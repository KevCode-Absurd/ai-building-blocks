name: Catalogue checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Ephemeral runner configuration preserves repository EOLs during checkout.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked site dependencies
        run: npm --prefix site ci
      - name: Check committed source and reviewed contracts
        run: node tools/qa/check-ci.mjs
      - name: Check minds and build catalogue indexes
        run: node tools/build-minds.mjs
      - run: npm --prefix site run index
      - name: Check generated sections are committed
        run: node tools/add-needs.mjs --check
      - name: Reject source drift from generation
        run: git -c core.longpaths=true diff --exit-code
      - name: Run all unit checks
        run: npm --prefix site run test:unit
      - name: Build production pages
        run: npm --prefix site run build
      - name: Check SEO
        run: npm --prefix site run seo
      - name: Reject source drift after build
        run: git -c core.longpaths=true diff --exit-code
