# Shared input/output types. When one item's output type matches another's input, the two items connect.
traction:
  business_profile: {desc: "A sourced business profile with buyer, offer, activation, growth goal, stage and limits; missing private metrics remain unknown."}
  traction_shortlist: {desc: "All 19 channels assessed, with up to three selected small tests and combined cash and time limits."}
  channel_experiment: {desc: "A channel-specific pilot with hypothesis, audience, artifact, owner, caps, tracking and decision rules."}
  experiment_results: {desc: "Observed dated results with cohort definitions, costs, account identities, activation, paid outcomes and retention."}
# Version 1 (2026-10-17). Field-level schemas are added as items need them.
brand_and_product:
  brand_brain:   {desc: "The brand's facts, voice, products, offers (with effective dates), claims register, personas and look.", schema: "planned: brand-brain v2 (Zod), backward compatible with CE v1"}
  product_data:  {desc: "One product's facts: price, variants, ingredients or materials, how it is used, photos by job."}
  offer:         {desc: "A live offer with price, terms, effective_from/to and a current flag."}
  persona:       {desc: "A buyer grounded in real review language: problem, trigger, wants, doubts, words they use."}
research:
  voc_reviews:    {desc: "Customer words from reviews, tickets, surveys or calls, with source and date."}
  competitor_set: {desc: "Competitor profiles and the gaps worth owning."}
  reference_set:  {desc: "Ads or pages chosen as references, by ID from the user's own connector, with each one's role."}
  ad_breakdowns:  {desc: "Structured teardown of reference ads (hook, angle, format, offer, proof)."}
  shortlist:      {desc: "A ranked short list chosen from a larger set, with reasons."}
creative:
  brief:         {desc: "A creative brief: goal, audience, angle, offer, mandatory claims (by ID), formats."}
  hooks:         {desc: "Opening lines, each with the angle and persona it targets."}
  ad_copy:       {desc: "Headline, primary text, description and CTA within platform limits."}
  script:        {desc: "A video ad script, beat by beat, with on-screen text and shots."}
  image_prompt:  {desc: "A render-ready image prompt plus the reference roles it uses."}
  static_ads:    {desc: "Rendered static or carousel ads with the brief and QA notes."}
  video_ads:     {desc: "Rendered video ads with the script and QA notes."}
data_and_pages:
  performance_sheet: {desc: "Ad or store performance export for a closed date window, with definitions."}
  landing_page:      {desc: "A landing page or advertorial: sections, copy, layout notes."}
  pdp_copy:          {desc: "Product page copy: title, benefits, details, FAQ, proof blocks."}
  email_flow:        {desc: "An email/SMS flow: trigger, timing, messages, segments."}
  audit_report:      {desc: "Findings with evidence, severity, missing inputs and next actions."}
  plan:              {desc: "A dated plan: what to do, in what order, with a decision rule for each step."}
# Added 2026-10-18 in the skill pass.
production:
  copy_draft:      {desc: "A draft of any copy (ad, page, email or script) that a check or edit pass works on."}
  angle_library:   {desc: "Ranked selling angles, each with the customer words and proof behind it."}
  objection_map:   {desc: "Each buyer doubt paired with the proof or answer that settles it, and where it goes on the page."}
  ad_style_dna:    {desc: "What makes a reference ad work (structure, pacing, look), described so it can be reused without copying."}
  design_direction: {desc: "A page's visual direction: type, colour, layout rules and what to avoid."}
  page_layout_spec: {desc: "A section-by-section layout for a page, with what each section holds."}
  web_page:        {desc: "A built or live web page, as a URL or saved HTML."}
  store_capture:   {desc: "Saved evidence from a storefront visit: screenshots, page text and what was observed, with dates."}
  theme_files:     {desc: "Shopify theme files (Liquid sections, settings) ready to upload."}
  brand_guide:     {desc: "A printable brand guide: voice, look, do and don't, with examples."}
  lessons_register: {desc: "What past creative taught: what worked, what failed and why, with dates."}
  feedback_notes:  {desc: "A person's notes on an output: what to keep, change or drop."}
  source_text:     {desc: "A long source in full: an article, a video or talk transcript, or notes from a book, with its title, author and link."}
  short_text:      {desc: "A short piece of text to reply to or work from: a post, comment, message, email or enquiry, with who wrote it and where."}
  skill_pack:      {desc: "Skill files ready to add to an AI: a workflow file and one SKILL.md for each of its steps."}
  image_plan:      {desc: "What an image should show and say, before any prompt is written."}
  approved_image:  {desc: "An image a person has approved for use."}
  upscaled_image:  {desc: "An approved image enlarged for print or large placements, checked for new defects."}
  shot_list:       {desc: "A video broken into shots with framing, motion, timing and on-screen text."}
  video_prompt:    {desc: "A render-ready prompt for one video shot, with the references it uses."}
  footage:         {desc: "Raw or generated video clips to edit."}
  edit_plan:       {desc: "A cut list: which takes, in what order, with trims, captions and sound."}
  avatar_sheet:    {desc: "Reference images that keep one character looking the same across shots."}
  product_photos:  {desc: "Photos of the real product, labelled by angle and use."}
  truth_sheet:     {desc: "What the product really looks like (shape, colour, label text, size), read from photos, so images stay accurate."}
  photo_set:       {desc: "A set of generated product photos in one style, checked against the truth sheet."}
  gallery_plan:    {desc: "The planned frames of a product page image gallery, one job per frame."}
  pdp_images:      {desc: "Finished product page gallery images with QA notes."}
# Added 2026-10-20 for minds and the council (docs/MINDS-PRD.md).
minds:
  question:      {desc: "The problem, decision or piece of work you want help with, and what a good outcome looks like."}
  mind_view:     {desc: "One mind's answer or piece of work, in their voice, built from their public record, with anything beyond the record marked."}
  council_brief: {desc: "The chair's brief: the recommended decision, the strongest dissent, what would change the call and the first three steps."}
# Added 2026-10-20 for skills imported from other libraries (tools/import-skills.mjs): code, files and the tools people use.
code_and_files:
  codebase:      {desc: "A project's code, in a folder or repo the AI can open."}
  code_change:   {desc: "A change to the code, with what it fixes and how it was checked."}
  web_app:       {desc: "A working web page or app, built and ready to open."}
  test_report:   {desc: "What was tested, what passed, what failed and why."}
  security_report: {desc: "The risks found in the code, ranked, each with a fix."}
  deploy_url:    {desc: "A live link to the app, and how it was put online."}
  document:      {desc: "A finished document, such as a Word file, a PDF or a page of notes."}
  spreadsheet:   {desc: "A spreadsheet with its data, formulas and charts."}
  slide_deck:    {desc: "A finished slide deck."}
  design_file:   {desc: "A design in a design tool, such as a Figma file, with its parts and styles."}
  audio:         {desc: "A sound or voice recording."}
  transcript:    {desc: "The words from a recording, written out, with who said what."}
  meeting_notes: {desc: "An agenda, notes or decisions from a meeting."}
  skill_files:   {desc: "A skill's folder: its SKILL.md and any files it needs."}
  tool_connection: {desc: "An AI connected to an outside tool or service, such as an MCP server."}
  image:         {desc: "A finished picture."}
# Added 2026-10-27 so items that really hand work to each other connect on a specific thing, not a generic brief or document.
# A plain request with no special shape stays a question; "brief" is only for creative briefs.
ideas_and_research:
  idea:           {desc: "An idea for a product, app, business, study or project, from one line to a short paragraph, or a list of rough ideas to compare."}
  customer_needs: {desc: "A ranked list of customer problems or unmet needs, each backed by the customers' own words and where they came from."}
  business_plan:  {desc: "A plan for a business or startup: the idea, the customers, the market, how it makes money and the key numbers."}
  story_outline:  {desc: "A story's plan: the premise, the characters and the scenes or chapters in order, with what happens in each."}
work_and_people:
  job_description: {desc: "A job or role in writing: title, team, duties, level and what good work looks like, as a job post or plain notes."}
  resume:          {desc: "A person's resume or CV, as pasted text or a file."}
  lesson_plan:     {desc: "A lesson, class task or activity for a stated age group and subject: the aims, the steps and what students do. Can be a full plan or a short note of what you want to teach."}
  contract:        {desc: "A contract or agreement in full, such as terms of service, an NDA or an order form, with its clauses, dates and any changes."}
  policy:          {desc: "A written policy or set of rules, such as a returns policy, a privacy policy or a staff handbook section, with the date it starts."}
  incident_record: {desc: "The record of an outage or incident: the timeline, what was affected, the alerts and who did what."}
sales_and_finance:
  lead_list:            {desc: "A list of sales leads or open deals, from a CRM or a CSV export, with company, contact, stage and last contact."}
  customer_list:        {desc: "A customer or order export, one row per customer or order, with dates, amounts and what they bought."}
  deal_terms:           {desc: "The terms of one deal, such as a sale, an investment or a company purchase: price, payment terms, discounts, debt, fees and dates."}
  financial_statements: {desc: "A company's income statement, balance sheet and cash flow statement, with notes, for one or more periods."}
search_and_site:
  keyword_list:        {desc: "A list of search keywords, each with what the searcher wants and, where known, monthly searches and difficulty."}
  search_query_report: {desc: "A search query export from Google Search Console or the Google Ads search terms report: each query with clicks, views, position or spend, for set dates."}
  page_speed_report:   {desc: "A PageSpeed Insights or Lighthouse result: real-user and lab speed numbers for each page tested."}
product_and_code:
  product_spec:        {desc: "What to build and how to tell it's done: a product requirements doc, feature spec or user stories with acceptance criteria."}
  api_spec:            {desc: "An API's spec, such as an OpenAPI file: the endpoints, data shapes, sign-in method and errors."}
  data_model:          {desc: "A database design: the tables or collections, their fields and keys, and how they link."}
  design_tokens:       {desc: "A design system's tokens: colours, type sizes, spacing and breakpoints, as CSS or JSON that code can use."}
  automation_workflow: {desc: "An automation built or designed in a tool such as n8n, Zapier or Make: its trigger, steps, error paths and settings."}
  prompt:              {desc: "A prompt or set of instructions written for an AI, such as a chat or system prompt, ready to use, test or improve."}
  eval_set:            {desc: "A fixed set of test cases for an AI, each with its input and the answer that counts as a pass."}
data_and_science:
  dataset:       {desc: "Data files to process or analyse, such as a CSV or JSON export, logs, lab or sensor files, with their format and where they came from."}
  signal_data:   {desc: "A recorded signal or time series, such as audio, sensor or measurement data, with its sample rate."}
  map_data:      {desc: "Map data, such as GeoJSON, a shapefile, a GeoPackage, a raster or a point cloud, with its coordinate system and fields."}
  training_data: {desc: "Examples used to train or fine-tune an AI model, such as labelled text pairs or images, with how they are split."}
  ai_model:      {desc: "A trained AI model file, such as a checkpoint, ONNX or TFLite file, ready to test, convert or deploy."}
media_links:
  social_accounts: {desc: "The social accounts to research, with each platform and handle or profile URL, and the date or post-count window."}
  video_link:    {desc: "A link to a video, playlist, channel or social post, to read or fetch."}
you:
  me_file:       {desc: "Your me.md: who you are, your work, projects, voice and preferences, with dates."}
