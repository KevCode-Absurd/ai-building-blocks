# Shared input/output types. When one item's output type matches another's input, the two items connect.
# Version 1 (2026-10-17). Field-level schemas are added as items need them.
brand_and_product:
  brand_brain:   {desc: "The brand's facts, voice, products, offers (with effective dates), claims register, personas and look.", schema: "planned: brand-brain v2 (Zod), backward compatible with CE v1"}
  product_data:  {desc: "One product's facts: price, variants, ingredients or materials, how it is used, photos by job."}
  offer:         {desc: "A live offer with price, terms, effective_from/to and a current flag."}
  persona:       {desc: "A buyer grounded in real review language: problem, trigger, wants, doubts, words they use."}
research:
  voc_reviews:    {desc: "Customer words from reviews, tickets, surveys or calls, with source and date."}
  competitor_set: {desc: "Competitor profiles and the gaps worth owning."}
  reference_set:  {desc: "Ads or pages chosen as references, by ID from the user's own connector, with each one's role."}
  ad_breakdowns:  {desc: "Structured teardown of reference ads (hook, angle, format, offer, proof)."}
  shortlist:      {desc: "A ranked short list chosen from a larger set, with reasons."}
creative:
  brief:         {desc: "A creative brief: goal, audience, angle, offer, mandatory claims (by ID), formats."}
  hooks:         {desc: "Opening lines, each with the angle and persona it targets."}
  ad_copy:       {desc: "Headline, primary text, description and CTA within platform limits."}
  script:        {desc: "A video ad script, beat by beat, with on-screen text and shots."}
  image_prompt:  {desc: "A render-ready image prompt plus the reference roles it uses."}
  static_ads:    {desc: "Rendered static or carousel ads with the brief and QA notes."}
  video_ads:     {desc: "Rendered video ads with the script and QA notes."}
data_and_pages:
  performance_sheet: {desc: "Ad or store performance export for a closed date window, with definitions."}
  landing_page:      {desc: "A landing page or advertorial: sections, copy, layout notes."}
  pdp_copy:          {desc: "Product page copy: title, benefits, details, FAQ, proof blocks."}
  email_flow:        {desc: "An email/SMS flow: trigger, timing, messages, segments."}
  audit_report:      {desc: "Findings with evidence, severity, missing inputs and next actions."}
  plan:              {desc: "A dated plan: what to do, in what order, with a decision rule for each step."}
# Added 2026-10-18 in the skill pass.
production:
  copy_draft:      {desc: "A draft of any copy (ad, page, email or script) that a check or edit pass works on."}
  angle_library:   {desc: "Ranked selling angles, each with the customer words and proof behind it."}
  objection_map:   {desc: "Each buyer doubt paired with the proof or answer that settles it, and where it goes on the page."}
  ad_style_dna:    {desc: "What makes a reference ad work (structure, pacing, look), described so it can be reused without copying."}
  design_direction: {desc: "A page's visual direction: type, colour, layout rules and what to avoid."}
  page_layout_spec: {desc: "A section-by-section layout for a page, with what each section holds."}
  web_page:        {desc: "A built or live web page, as a URL or saved HTML."}
  store_capture:   {desc: "Saved evidence from a storefront visit: screenshots, page text and what was observed, with dates."}
  theme_files:     {desc: "Shopify theme files (Liquid sections, settings) ready to upload."}
  brand_guide:     {desc: "A printable brand guide: voice, look, do and don't, with examples."}
  lessons_register: {desc: "What past creative taught: what worked, what failed and why, with dates."}
  feedback_notes:  {desc: "A person's notes on an output: what to keep, change or drop."}
  image_plan:      {desc: "What an image should show and say, before any prompt is written."}
  approved_image:  {desc: "An image a person has approved for use."}
  upscaled_image:  {desc: "An approved image enlarged for print or large placements, checked for new defects."}
  shot_list:       {desc: "A video broken into shots with framing, motion, timing and on-screen text."}
  video_prompt:    {desc: "A render-ready prompt for one video shot, with the references it uses."}
  footage:         {desc: "Raw or generated video clips to edit."}
  edit_plan:       {desc: "A cut list: which takes, in what order, with trims, captions and sound."}
  avatar_sheet:    {desc: "Reference images that keep one character looking the same across shots."}
  product_photos:  {desc: "Photos of the real product, labelled by angle and use."}
  truth_sheet:     {desc: "What the product really looks like (shape, colour, label text, size), read from photos, so images stay accurate."}
  photo_set:       {desc: "A set of generated product photos in one style, checked against the truth sheet."}
  gallery_plan:    {desc: "The planned frames of a product page image gallery, one job per frame."}
  pdp_images:      {desc: "Finished product page gallery images with QA notes."}
# Added 2026-10-20 for minds and the council (docs/MINDS-PRD.md).
minds:
  question:      {desc: "The problem, decision or piece of work you want help with, and what a good outcome looks like."}
  mind_view:     {desc: "One mind's answer or piece of work, in their voice, built from their public record, with anything beyond the record marked."}
  council_brief: {desc: "The chair's brief: the recommended decision, the strongest dissent, what would change the call and the first three steps."}
