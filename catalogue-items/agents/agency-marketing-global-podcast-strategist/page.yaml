name: Global Podcast Strategist agent
summary: Plan and grow a podcast on Spotify, Apple Podcasts and YouTube, with show positioning, an episode brief, guest outreach, growth steps and income paths.
headline: Global Podcast Strategist agent
subhead: Describe your show or idea and the listener you want. The agent plans your show's focus, an 8 to 12 week episode calendar, guest outreach and how to grow on Spotify, Apple Podcasts and YouTube. You get a show plan and an episode brief to use.
job: work-with-audio
thinking: high
thinking_why: The role compares choices and checks evidence. Use a model that can reason through the task and verify its work.
explain: |-
  Most new podcasts stop after a few episodes, often because the show is not clear enough to attract a listener or because growth is left to chance. This global podcast strategist agent plans the whole show so each episode feeds the next: a clear promise to a clear listener, a steady calendar, guests who bring listeners with them, and clips that pull new people in.

  It begins with the listener and the gap in what they hear now. It compares your idea with the shows already in your niche, writes a show document (name, promise, format, tone) and a standard episode brief with a hook for the first 90 seconds. It plans where to publish first, how to write titles that answer a real question, how to cut short clips, and how to ask guests and partner shows to share. It then sets out income paths: sponsors, listener support and your own products.

  It writes plans. It does not publish, pitch or measure for you, and it cannot see your stats. The role comes from Agency Agents under the MIT licence. The download holds the original profile, its licence and a setup guide. The profile's download figures, ad rates and growth targets are the author's examples. They are not results measured by AI Blocks, so check them before you use them.
when:
  - You are launching a podcast and need a clear focus, format and first 8 to 12 weeks of episodes.
  - Your show has plateaued and you need to know whether the title, the topic, the cadence or the promotion is the cause.
  - You want guests, and need a ranked list, a pitch and a briefing for each one.
  - You want to earn from your show and need to know what sponsors or members expect.
not_for:
  - "You want to plan a show for listeners in China on Xiaoyuzhou or Ximalaya: use the Chinese Podcast Strategist agent."
  - "You want an episode cleaned, mixed or mastered: use a sound editor, or the Video audio finishing plan for video."
  - "You want an audio file turned into text: use the Whisper speech transcriber."
  - "You want the show in another language: use the Video dubbing editor for the audio, then this agent to plan each new market."
  - "You want to buy ads or run a paid campaign: plan the show here, then use your ad platform."
you_give:
  - Your show idea or current show, with its topic and format, such as interview, solo or story
  - Who you want to reach, and what they listen to now
  - Where it is published now, and your main platform (optional)
  - Your goal, such as first 1,000 listeners, guests, sponsors or members
  - Time per week and who helps you (optional)
  - Stats you already have, such as downloads per episode and where drop-off happens (optional)
you_get:
  - A show document with name ideas, one-line promise, format, tone and how you differ from rival shows
  - An 8 to 12 week calendar with topic, guest and the clips to cut from each episode
  - An episode brief with the first-90-second hook, key questions and where the call to action goes
  - A guest pitch and a one-page briefing for each guest
  - A growth plan by platform, plus income paths with what each needs
how_to_use:
  - Add the pack to your AI as a skill. Or open a new chat and paste SKILL.md, then references/source-agent.md.
  - Say whether you are launching or fixing a show. Paste your idea or your current description, your listener and your goal.
  - Add two to five rival or model shows by name, with a line on each. Say "Do not invent stats or ad rates." Your AI asks once for what is missing.
  - Read the show document first. If you could swap in any other show's name and it still fits, ask for a sharper angle.
  - Use the episode brief for your next three episodes. Check every platform tip against that platform's own help pages first.
  - After four to six episodes, paste your real stats back in and ask what to change.
how_it_works:
  - title: Set the goal
    text: It confirms the show, the listener and the goal, and asks once for what is missing.
  - title: Define the listener and angle
    text: It describes who listens, what they hear now, and the one thing your show does that others do not.
  - title: Build the show document
    text: It writes the name, promise, format, tone and off-limits topics, and picks a main platform with reasons.
  - title: Plan the episodes
    text: It builds the calendar, the episode brief with a hook, and a guest list in tiers.
  - title: Plan discovery
    text: It writes title and description rules, clip ideas, newsletter and partner-show steps, and a plan to ask for reviews.
  - title: Plan growth and income
    text: It sets what to track, how to fix a plateau, and the paths to sponsors, members and your own products.
output_shape: |-
  SHOW DOCUMENT
    Name ideas <list> | Promise <one line> | Listener <who, needs, current shows>
    Format <interview, solo, story, panel> | Length <minutes> | Cadence <day and time>
    Angle <what only this show does> | Tone <3 words> | Off limits <topics>
    Main platform <choice and why>

  RIVAL SHOWS
    <show> | <what it does well> | <gap you can fill>

  CALENDAR (8 to 12 weeks)
    <week> | <topic> | <guest> | <clip ideas>

  EPISODE BRIEF
    Title <working title> | Hook <first 90 seconds> | Promise <what listener gets>
    Questions <list> | Call to action <where and what>

  GUESTS
    <tier> | <who> | <pitch angle>

  GROWTH AND TRACKING
    <platform> | <action> | <what to watch>

  INCOME PATHS
    <path> | <what it needs first> | <risk>

  OPEN CHECKS
    <platform tip or figure to confirm> | <how>
output_sample:
  input:
    - Your show idea or current show, and the listener you want
    - Your goal and the platforms you use
    - Rival or model shows, and your stats if you have them (optional)
  prerequisites:
    - An AI that reads pasted text, such as Claude, ChatGPT or Gemini
  output:
    - name: Show document
      contains: Name ideas, promise, listener, format, tone, angle and main platform with reasons.
    - name: Rival shows
      contains: Each rival's strengths and the gap your show can fill.
    - name: Calendar
      contains: An 8 to 12 week plan with topic, guest and clip ideas for each episode.
    - name: Episode brief
      contains: A reusable template with the first-90-second hook, questions and call to action.
    - name: Guests
      contains: A tiered guest list with a pitch angle for each, plus an outreach template.
    - name: Growth and tracking
      contains: Steps by platform and the numbers to watch, such as completion and follower growth.
    - name: Income paths
      contains: Sponsors, listener support and your own products, each with what it needs first.
    - name: Open checks
      contains: Figures and platform tips to confirm before you rely on them.
judge:
  - The result addresses your actual task and cites the evidence used.
  - Examples, role-play experience and targets are kept separate from verified results.
  - Claims of tests, memory, tool access or completed actions match what actually happened.
test:
  - Try a small task whose result you can check yourself.
  - Omit one important fact and check whether the agent names the gap.
tweaks:
  - what: Platform
    how: Name the one platform you care about first, such as YouTube, so the plan puts its steps first.
  - what: Format
    how: Say if your show is interview, solo, story or panel, since the advice differs for each.
  - what: Scope
    how: Ask for the show document only, or the guest outreach only, to get a shorter result.
improve:
  - Keep useful corrections with your task notes and apply them on the next run.
terms:
  - term: Hook
    meaning: The first moments of an episode, written to give the listener a reason to stay.
  - term: Show document
    meaning: A short guide that fixes your show's promise, format, tone and listener.
  - term: Consumption rate
    meaning: How much of an episode listeners play on average.
  - term: Feed drop
    meaning: Putting a bonus episode from a partner show into your feed, and the reverse.
  - term: CPM
    meaning: What an advertiser pays for each 1,000 plays of an ad.
  - term: Audiogram
    meaning: A short video clip of an episode, with a moving sound wave and captions.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Pasted text is enough for a plan. The AI cannot open your podcast stats, so paste the numbers in.
  inputs:
    - Your stats from your podcast host or platform dashboard, if the show is live.
    - Three to five rival shows with a line on what each does well.
