name: Senior Project Manager agent
summary: Turn your brief into a senior project manager plan with tasks and acceptance checks, plus the gaps and assumptions to check first.
headline: Senior Project Manager agent
subhead: Use this agent for senior project manager tasks. Get a scoped project plan with tasks and acceptance checks. Bring your brief. Share the goal, relevant files and limits. It uses the source profile to propose work and checks. You review the result before using it.
job: organise-work
thinking: high
thinking_why: The role compares choices and checks evidence. Use a model that can reason through the task and verify its work.
explain: >-
  Get a scoped project plan with tasks and acceptance checks. Bring your brief.


  A scoped project plan with tasks and acceptance checks.


  This is a role profile from Agency Agents, shared under MIT. The download includes the original profile, its licence and a setup guide. Its examples and success targets describe the intended work; they are not measured results from AI Blocks.
when:
  - You need the senior project manager role for a defined task.
  - You have relevant facts or files and want a proposal you can check.
not_for:
  - You need live project data or a tracker updated. Your AI cannot reach your tools here, so use your project tool and paste in what it shows.
  - You want someone to approve spending, send messages or change live systems. Ask a person on your team to do that.
  - You only need a short to-do list for one day. Write it by hand or ask your AI for a quick list instead.
you_give:
  - The task you want a senior project manager to handle, and what a useful result looks like.
  - Relevant files, evidence and constraints, including tools the AI can actually use.
you_get:
  - A scoped project plan with tasks and acceptance checks.
  - Assumptions, missing evidence and checks to run before accepting the work.
how_to_use:
  - Download the complete pack and open SETUP.md.
  - Add the pack as a skill in an AI that supports skills, or paste SKILL.md followed by references/source-agent.md into a chat.
  - For a Claude Code agent, copy references/source-agent.md into .claude/agents/ and supply the scope and review rules from SKILL.md.
  - Ask it to handle your senior project manager task. Share the goal, relevant material and limits.
  - Review the proposal and the checks. Authorize any external action separately.
output_sample:
  input:
    - Your project brief and the goal you want met
    - Files or notes that hold facts about the work
    - Limits on time, cost and tools (optional)
  prerequisites:
    - An AI that can read SKILL.md and references/source-agent.md, or a chat where you can paste both
  output:
    - name: Scoped project plan
      contains: The work split into tasks, with what is in and out of scope.
    - name: Acceptance checks
      contains: A check for each task that tells you whether the work is done.
    - name: Assumptions
      contains: What the plan takes as true that you have not confirmed.
    - name: Source references
      contains: Where each fact in the plan came from, such as your files or the role profile.
    - name: Checks still needed
      contains: Missing evidence and steps to run before you accept the plan.
how_it_works:
  - title: Set the task
    text: Confirm the intended result, available evidence and allowed actions.
  - title: Use the role profile
    text: Read the supplied Senior Project Manager profile and apply the methods that fit the task.
  - title: Review the result
    text: Separate facts from assumptions, show evidence and list checks still needed.
judge:
  - The result addresses your actual task and cites the evidence used.
  - Examples, role-play experience and targets are kept separate from verified results.
  - Claims of tests, memory, tool access or completed actions match what actually happened.
test:
  - Try a small task whose result you can check yourself.
  - Omit one important fact and check whether the agent names the gap.
tweaks:
  - what: Task scope
    how: Name the one result you need and the limits on time, cost and tools.
improve:
  - Keep useful corrections with your task notes and apply them on the next run.
terms: []
works_best_with:
  inputs:
    - A clear brief and the source files needed to check the result.
