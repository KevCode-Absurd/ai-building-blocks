name: Threat Intelligence Analyst agent
summary: Turn a threat report or indicator list into a threat intelligence brief with confidence ratings, ATT&CK matches and draft detection rules.
headline: Threat Intelligence Analyst agent
subhead: Paste a threat report, a vendor alert or a list of indicators, and say what kind of business you run. It rates each source, keeps facts apart from opinions, matches behavior to MITRE ATT&CK and drafts detection rules you can test.
job: secure-code
thinking: high
thinking_why: The role compares choices and checks evidence. Use a model that
  can reason through the task and verify its work.
explain: >-
  A vendor report lands, or your tools flag a list of odd IP addresses and file
  fingerprints. Now your team has to decide what to block, what to hunt for and
  what to ignore. A raw list does not say which items to trust. This threat
  intelligence analyst agent turns the pile into a threat intelligence brief.
  Each indicator is rated for source and confidence, and each one gets a
  suggested action.


  It keeps what was seen apart from what it thinks that means. It will not name
  an attacker group from one indicator, because IP addresses are shared and
  tools get stolen. It rates every source with the Admiralty scale, says high,
  medium or low confidence in plain words, and says what it is only guessing.
  Behavior is matched to MITRE ATT&CK only when the report gives evidence for
  the match.


  This is a role profile from Agency Agents, shared under MIT. A chat AI cannot
  look up an indicator, search your logs or read a threat feed. It works from
  what you paste, and it lists each lookup for you to run. Its examples,
  "tested on 50 samples" notes and success targets are not results from AI
  Blocks.
when:
  - A vendor, CERT or news report lands and your team asks "does this affect us?"
  - You have a list of IP addresses, domains or file hashes and need to know which to block first.
  - You must tell a boss or a client what a threat means, in plain words, and how sure you are.
  - You want a detection rule written from a report, to test in your own tools.
not_for:
  - An attack is happening now. Call your security team or provider. The Incident Responder agent can help you plan the response.
  - You only need detection rules for a known behavior, with no report. Use the Threat Detection Engineer agent.
  - You want live feed lookups, dark web watching or malware testing. A chat AI cannot do these. Use a threat feed or a sandbox tool.
  - You need to name who attacked you for the police or a lawsuit. This brief gives a view with a confidence level, not proof. Ask a qualified investigator.
you_give:
  - The report, alert or indicator list, pasted as text
  - Where each item came from (the vendor, a sharing group or your own logs) and its date
  - Your kind of business and the systems you run, such as Windows or Microsoft 365 (optional)
  - The decision you need to make, such as what to block this week (optional)
  - The sharing label on the data, such as TLP:AMBER (optional)
you_get:
  - A short brief that opens with what it means for you and what to do first
  - A table of indicators, each with a source rating, a confidence level and a suggested action
  - Facts from the report kept apart from the AI's own assessments
  - Behaviors matched to MITRE ATT&CK, each with its evidence
  - Draft Sigma or YARA detection rules, marked not tested (when the report supports them)
  - A list of gaps and checks to run before you block or share anything
how_to_use:
  - Download the pack and add it to your AI as a skill. Or paste SKILL.md into a new chat, then paste references/source-agent.md after it.
  - Paste your report or indicator list. Add where each item came from, its date, and your kind of business and systems.
  - Answer any question once. Anything you skip is marked MISSING, and the confidence goes down.
  - Read "What this means for you" first, then the indicator table. Check one indicator against its source before you trust the rest.
  - Run the checks it lists, such as searching your own logs for each indicator. A chat AI cannot do this for you. Paste what you find back in and ask it to update the brief.
  - Test any rule on logs you know are good and logs you know are bad before you switch it on. Remove names and internal details before you share the brief.
how_it_works:
  - title: Set the question
    text: It asks what decision the brief supports and who will read it, such as a SOC analyst or a board.
  - title: Clean and rate the sources
    text: It removes repeats, then rates each source for reliability and each fact for credibility, using the Admiralty scale.
  - title: Split facts from opinion
    text: It lists what the source said in one section and what the AI assesses in another, so you can see which is which.
  - title: Match behavior to ATT&CK
    text: It matches each behavior to a MITRE ATT&CK technique only when it can point to the evidence.
  - title: Set the confidence
    text: It gives low, medium or high confidence for each judgment and does not name a group from one indicator.
  - title: Draft actions and rules
    text: It suggests blocks, hunts and Sigma or YARA rules, matched to the reader, and marks every rule as not tested.
  - title: List gaps and checks
    text: It names the missing facts and the lookups you must run before you act or share.
output_shape: |-
  BOTTOM LINE
    <what this means for you> | confidence <low, medium or high> | top 3 actions <list>

  OBSERVATIONS (what the sources said)
    <fact> | source <name> | date <date>

  INDICATORS
    <indicator> | type <IP, domain, hash, URL or email> | source rating <A to F> | credibility <1 to 6> | confidence <low, medium or high> | action <block, hunt or watch> | review by <date>

  ASSESSMENTS (what the AI thinks it means)
    <judgment> | confidence <level> | why <reasons> | what would change it <list>

  ATT&CK MAPPING
    <behavior> | technique <ID and name> | evidence <quote or detail from the source>

  DRAFT DETECTION RULES
    <Sigma or YARA rule> | NOT TESTED | likely false positives <list>

  GAPS AND CHECKS
    MISSING <list> | checks to run before you act <list> | sharing label and what to remove before you share
output_sample:
  input:
    - A threat report, alert or list of indicators, pasted as text
    - Where each item came from, and its date
    - Your kind of business and the systems you run (optional)
    - The decision you need to make (optional)
  prerequisites:
    - An AI chat that accepts long pasted text, such as Claude, ChatGPT or Gemini
    - A way to run the checks it lists, such as your log search or a security tool
  output:
    - name: Bottom line
      contains: What the threat means for you, how sure the brief is, and the top three actions.
    - name: Observations
      contains: Only what the sources said, each with its source and date.
    - name: Indicators
      contains: Each indicator with a source rating, a confidence level, a suggested action and a review date.
    - name: Assessments
      contains: What the AI thinks it means, with a confidence level, the reasons and what would change its mind.
    - name: ATT&CK mapping
      contains: Each behavior matched to a technique, with the evidence for the match.
    - name: Draft detection rules
      contains: Sigma or YARA rules built from the report, marked not tested, with likely false positives.
    - name: Gaps and checks
      contains: What is missing, which lookups to run before you act, and what to remove before you share.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: You paste long reports and get a structured brief back. Claude Code can also save the rules as files.
    - name: Your log search or security tool
      why: The AI cannot search your network. You run each check there and paste the results back.
    - name: A lookup site such as VirusTotal
      why: You can check a hash, domain or IP there and paste what it says, so the AI can raise or lower its confidence.
  inputs:
    - The alert that made you ask, with its time and the affected system.
    - A list of the software and cloud services you run.
    - Last month's alerts from the same source.
judge:
  - The result addresses your actual task and cites the evidence used.
  - Examples, role-play experience and targets are kept separate from verified
    results.
  - Claims of tests, memory, tool access or completed actions match what
    actually happened.
test:
  - Try a small task whose result you can check yourself.
  - Omit one important fact and check whether the agent names the gap.
tweaks:
  - what: Reader
    how: Say who will read it. A SOC analyst gets indicators and rules. A manager gets the bottom line and the risk.
  - what: Scope
    how: Ask for triage only, which means the indicator table and the top three actions. Add the ATT&CK mapping and rules later.
  - what: Rule format
    how: Name the tool you use, such as Sigma for Microsoft Sentinel or YARA for file scans, so the draft rules match it.
improve:
  - Paste your lookup results back in, and ask it to update each rating and the actions.
  - Note which indicators turned out wrong or old, and tell it next time so it expires such items sooner.
terms:
  - term: Indicator (IOC)
    meaning: A clue that a system may be hit, such as an IP address, a web domain or a file fingerprint.
  - term: MITRE ATT&CK
    meaning: A public list of the ways attackers work, with an ID for each technique.
  - term: Admiralty scale
    meaning: A rating of the source (A to F) and of the fact (1 to 6), used to show how far to trust each item.
  - term: TLP
    meaning: Traffic Light Protocol, a label on a report that says who may see it, such as TLP:RED for named people only.
  - term: Sigma and YARA
    meaning: Plain-text rule formats. Sigma finds patterns in logs. YARA finds patterns in files.
  - term: Attribution
    meaning: Naming the group behind an attack. It needs more than one strong clue.
