slug: ai-answer-visibility-tracker
name: "AI answer visibility tracker"
summary: "Run the same shopper questions through AI assistants each month. Get your share of mentions against last month and the fix that fits the gap."
category: agent
type: agent
role: orchestrate
job: research
level: advanced
inputs:
  - {type: product_data, required: true}
  - {type: competitor_set, required: false}
  - {type: voc_reviews, required: false}
  - {type: web_page, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
uses: [shopper-question-and-fan-out-mapper, ai-recommendation-panel-runner, ai-recommendation-gap-finder, brand-facts-accuracy-fixer, ai-citation-source-finder, ai-shortlist-readiness-checker, ai-ready-product-page-editor]
steps:
  - {uses: shopper-question-and-fan-out-mapper, note: "Once, then again only when your range changes: the fixed list of shopper questions every later month is run against."}
  - {uses: ai-recommendation-panel-runner, note: "Every month: the same questions, the same assistants, scored against last month."}
  - {uses: ai-recommendation-gap-finder, note: "Only when your share fell, or a rival gained, by more than the agent's bar: why rivals are named and you are not."}
  - {uses: brand-facts-accuracy-fixer, note: "Only when an assistant states a wrong fact about your store: the source it used and the fix."}
  - {uses: ai-citation-source-finder, note: "Only when the gap is marked build or influence: which sites the assistants quote instead of you."}
  - {uses: ai-shortlist-readiness-checker, note: "Only when the gap is marked fix: whether your public pages can be found, matched and chosen."}
  - {uses: ai-ready-product-page-editor, note: "Only for up to two pages the readiness check fails: the page rewritten from your facts."}
schedule: "On the first Monday of each month, with the same questions as last month"
asks_before: [publishing page changes, editing theme files or robots.txt, contacting sites or journalists for a mention, posting on forums or Reddit, paying for placements or reviews]
origin: own
version: 1.0.0
example_pending: true
