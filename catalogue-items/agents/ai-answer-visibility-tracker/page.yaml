new_slug: ai-answer-visibility-tracker
name: AI answer visibility tracker
summary: Run the same shopper questions through AI assistants each month. Get your share against last month and the fix for the gap.
job: get-found-in-search
thinking: high
thinking_why: It runs up to seven skills, compares noisy results month to month and picks its own path. Give it your strongest model.
headline: AI answer visibility tracker
subhead: Give it your products and rivals. Each month it asks AI assistants the same shopper questions, compares how often your store is named with last month, and picks the fix that fits, with wrong facts first, then page fixes or the sites assistants quote instead of you.
explain: |
  Shoppers now ask AI assistants which store to buy from. You can check by hand, but the answers change from run to run, so one look tells you little. Most owners try a few questions once, see nothing, and never check again.

  This agent keeps a fixed list of shopper questions and runs it the same way each month. It records how often your store and each rival are named, and compares with last month. A small change is called normal wobble, not a win or a loss. A real fall or a rival's gain sends it to find the cause. Wrong facts go first. It proposes at most three fixes a month so you can see which one moved the numbers. It never changes your pages or contacts anyone without your yes.
when:
  - Shoppers in your category ask AI assistants for store or product picks.
  - You made changes to be named by AI and want to know if they worked.
  - An assistant said something wrong about your store and you want to catch it each month.
you_give:
  - Your product facts, price range and who the products are for
  - Your main rivals (optional)
  - Customer questions from reviews, tickets or search terms (optional)
  - Your store address and key pages (optional)
  - The assistants you can use, with web search on
you_get:
  - Your share of mentions overall and per assistant, with the number of valid runs
  - What moved against last month, and what is only normal wobble
  - A check of last month's fixes, as moved, no change or too early
  - Wrong facts with the source and the fix
  - Up to three fixes to approve, each with its reason
how_to_use:
  - Start a chat with the agent. In Claude Code, add it as a skill or save it in .claude/agents, then ask it to run this month's check.
  - The first time, give it your product facts and rivals. It builds a fixed question list and saves it.
  - Tell it which assistants to use, and keep them the same each month.
  - Read the fix list. Make the fixes you agree with, or say yes to each and let it make only those.
  - Run it again next month with the same questions. It reads last month's files.
how_it_works:
  - title: Build the panel
    text: Builds the fixed list of shopper questions once and saves it, so every month is run the same way.
  - title: Run the panel
    text: Asks each assistant each question and records who is named, who is linked and which sources are quoted.
  - title: Compare with last month
    text: Sets your share and each rival's share against last month. A change under five points is called normal wobble.
  - title: Check last month's fixes
    text: Looks at the questions each fix aimed at and marks it moved, no change or too early.
  - title: Choose the path
    text: Wrong facts go first. A real fall sends it to the gap finder, then to the quoted sources or your own pages, depending on the gap.
  - title: Limit the fixes
    text: Keeps at most three fixes a month so the next run can show which one worked.
output_shape: |-
  THIS MONTH
    Share of mentions <x%> vs <x%> last month | per assistant: <name x%, ...> | valid runs <n> each

  WHAT MOVED
    <question> | you: <x> to <x> | rivals who gained: <names>   (changes under 5 points: normal wobble)

  LAST FIXES CHECKED
    <fix> | made <date> | <moved | no change | too early>

  WRONG FACTS
    <claim> | said by: <assistant> | source: <where> | fix: <fix>

  FIXES TO APPROVE (at most 3)
    1. <fix> | from: <step> | why: <reason> | work: <size>

  FILES AND MISSING
    <each step's file> | MISSING: <every line>
tweaks:
  - what: The number of questions
    how: Ten to twenty is enough. More questions take longer and add little. Keep the list fixed once chosen.
  - what: The assistants you use
    how: Use the same ones every month, each with web search on. Turn off saved memory so earlier chats do not shape the answers.
  - what: Runs per question
    how: Answers vary. Run each question more than once if you can. Under about 15 valid runs per assistant, the share is too thin to compare.
  - what: Your rivals
    how: Name the stores you most often lose to. Without them, the agent can only report your own share.
judge:
  - The questions and assistants are the same as last month.
  - Every share shows how many valid runs sit behind it.
  - Small changes were called wobble, not wins or losses.
  - No more than three fixes were proposed.
  - Nothing was changed, posted or sent without your clear yes.
test:
  - Run the panel twice in one day. The shares should be close. If they are far apart, add more runs.
  - Ask one question yourself in an assistant and check the agent recorded the same answer.
  - Check one wrong fact it reports against the source it names.
improve:
  - Set your own size of change that counts as real, to suit how many runs you can do.
  - Add your key product claims to the facts you give it, so wrong facts are easier to spot.
  - Keep a note of each fix and its date in the visibility folder, so next month's check is exact.
  - If your range changes, ask it to rebuild the question list once and start a new base month.
works_best_with:
  tools:
    - name: Claude Code
      why: It can keep the visibility folder, read last month's files and run every step on a schedule.
    - name: ChatGPT, Gemini or Perplexity
      why: Run the questions here with web search on. Use the same ones every month.
  inputs:
    - A list of the stores you most often lose to
    - Your return, shipping and warranty pages, so wrong facts can be checked
