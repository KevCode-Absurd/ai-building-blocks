new_slug: ai-answer-visibility-tracker
name: AI recommendation mention tracker
summary: Track whether AI assistants name your store each month. Ask the same shopper questions, see your share against last month, and get up to three fixes.
job: get-found-in-search
thinking: high
thinking_why: It runs up to seven skills, compares noisy results month to month and picks its own path. Give it your strongest model.
headline: AI recommendation mention tracker
subhead: Give it your product facts and your main rivals. Each month it asks the same shopper questions in the same AI assistants and counts how often your store is named. You get your share against last month, wrong facts first, and at most three fixes to approve.
explain: |
  Shoppers now ask AI assistants which store to buy from. You can check by hand, but the answers change from run to run, so one look tells you little. Most owners try a few questions once, see nothing, and never check again.

  This AI mention tracker keeps a fixed list of shopper questions and runs it the same way each month. It records how often your store and each rival are named, and compares with last month. A small change is called normal wobble, not a win or a loss. A real fall, or a rival's gain, sends it to find the cause.

  Wrong facts go first, such as a wrong return policy or price. It proposes at most three fixes a month, so you can see which one moved the numbers. It never changes your pages or contacts anyone without your yes. It cannot promise that a fix gets you named, because each assistant decides for itself.
when:
  - Shoppers in your category ask AI assistants for store or product picks, and you want to know if yours is named.
  - You changed a page to be named by AI assistants and want to know whether it worked.
  - An assistant said something wrong about your store, and you want to catch that each month.
  - A rival keeps showing up in AI answers and you want to see how often, and why.
not_for:
  - You want a one-off check today. Use the AI search visibility tester, which sets up and reads one run.
  - You already know which rivals are named and want to know why. Use the AI search recommendation gap finder.
  - Your buyers do not ask AI assistants for picks, for example a very local trade or a custom-order business. A manual spot check each quarter is enough.
  - You want to check whether Google ranks your pages. Use the Search Console content planner.
you_give:
  - Your product facts, price range and who the products are for
  - Your 3 to 6 main rivals (optional, but without them it can only report your own share)
  - Customer questions from reviews, tickets or search terms (optional)
  - Your store address and key pages, such as returns and shipping (optional)
  - The AI assistants you can use, with web search on, and whether you are logged in
you_get:
  - Your share of mentions overall and for each assistant, with the number of valid runs behind it
  - What moved against last month, and what is only normal wobble
  - A check of last month's fixes, marked moved, no change or too early
  - Wrong facts the assistants stated, with the source they used and the fix
  - Up to three fixes to approve, each with its reason and the size of the work
how_to_use:
  - Add the agent to your AI. In Claude Code, save it in .claude/agents or add it as a skill. In Claude, ChatGPT or Gemini, paste it at the start of a chat. It keeps a visibility folder, so Claude Code is easiest; in a plain chat, paste last month's numbers.
  - The first month, give it your product facts and rivals. It builds a list of 10 to 20 shopper questions and saves it. Do not edit the list later, or months cannot be compared.
  - Pick the assistants and use the same ones every month, with web search on. Your AI can only ask the assistant it runs in. For any other, paste each question in yourself and paste the answer back.
  - Check the terms of each assistant before you repeat questions many times. Free versions often skip web search, and some features may need a paid plan. No paid tool is needed.
  - Read the wrong facts first, then the fix list. Make the fixes you agree with, or say yes to each one and let it make only those.
  - Run it again next month with the same questions. Pair it with the AI search recommendation gap finder when a rival keeps winning.
output_sample:
  input:
    - Your product facts, price range and who the products are for
    - Your 3 to 6 main rivals (optional)
    - Customer questions from reviews, tickets or search terms (optional)
    - Your store address and key pages, such as returns and shipping (optional)
    - The AI assistants you can use, with web search on
  prerequisites:
    - An AI assistant that can search the web
    - Your brand brain from the Brand profile builder (recommended)
    - Last month's numbers, or the ai-visibility folder (from month two)
  output:
    - name: This month
      contains: Your share of mentions overall and for each assistant, with the number of valid runs behind it.
    - name: What moved
      contains: Questions where you or your rivals gained or lost, with small changes marked as normal wobble.
    - name: Last fixes checked
      contains: Each earlier fix marked moved, no change or too early.
    - name: Wrong facts
      contains: Each wrong claim an assistant made, the source it used and the fix.
    - name: Fixes to approve
      contains: At most three fixes, each with its reason and the size of the work.
    - name: Files and missing
      contains: Each step's saved file, then every MISSING line in one list.
how_it_works:
  - title: Build the panel
    text: Builds the fixed list of shopper questions once and saves it, so every month is run the same way.
  - title: Run the panel
    text: Asks each assistant each question and records who is named, who is linked and which sources are quoted.
  - title: Compare with last month
    text: Sets your share and each rival's share against last month. A change under five points is called normal wobble.
  - title: Check last month's fixes
    text: Looks at the questions each fix aimed at and marks it moved, no change or too early.
  - title: Choose the path
    text: Wrong facts go first. A real fall sends it to the gap finder, then to the quoted sources or your own pages, depending on the gap.
  - title: Limit the fixes
    text: Keeps at most three fixes a month so the next run can show which one worked.
output_shape: |-
  THIS MONTH
    Share of mentions <x%> vs <x%> last month | per assistant: <name x%, ...> | valid runs <n> each

  WHAT MOVED
    <question> | you: <x> to <x> | rivals who gained: <names>   (changes under 5 points: normal wobble)

  LAST FIXES CHECKED
    <fix> | made <date> | <moved | no change | too early>

  WRONG FACTS
    <claim> | said by: <assistant> | source: <where> | fix: <fix>

  FIXES TO APPROVE (at most 3)
    1. <fix> | from: <step> | why: <reason> | work: <size>

  FILES AND MISSING
    <each step's file> | MISSING: <every line>
tweaks:
  - what: The number of questions
    how: Ten to twenty is enough. More questions take longer and add little. Keep the list fixed once chosen.
  - what: The assistants you use
    how: Use the same ones every month, each with web search on. Turn off saved memory so earlier chats do not shape the answers.
  - what: Runs per question
    how: Answers vary. Run each question more than once if you can. Under about 15 valid runs per assistant, the share is too thin to compare.
  - what: Your rivals
    how: Name the stores you most often lose to. Without them, the agent can only report your own share.
judge:
  - The questions and assistants are the same as last month.
  - Every share shows how many valid runs sit behind it.
  - Small changes were called wobble, not wins or losses.
  - No more than three fixes were proposed.
  - Nothing was changed, posted or sent without your clear yes.
test:
  - Run the panel twice in one day. The shares should be close. If they are far apart, add more runs.
  - Ask one question yourself in an assistant and check the agent recorded the same answer.
  - Check one wrong fact it reports against the source it names.
improve:
  - Set your own size of change that counts as real, to suit how many runs you can do.
  - Add your key product claims to the facts you give it, so wrong facts are easier to spot.
  - Keep a note of each fix and its date in the visibility folder, so next month's check is exact.
  - If your range changes, ask it to rebuild the question list once and start a new base month.
works_best_with:
  tools:
    - name: Claude Code
      why: It can keep the visibility folder, read last month's files and run every step on a schedule.
    - name: ChatGPT, Gemini or Perplexity
      why: Run the questions here with web search on. Use the same ones every month.
  inputs:
    - A list of the stores you most often lose to
    - Your return, shipping and warranty pages, so wrong facts can be checked
