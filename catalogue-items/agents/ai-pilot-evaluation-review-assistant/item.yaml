slug: ai-pilot-evaluation-review-assistant
name: AI pilot evaluation review assistant
summary: "Turn your AI pilot results into an evidence brief, data quality gaps and a go or stop checklist result. Missing baselines are flagged, not guessed."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: spreadsheet
    required: false
  - type: source_text
    required: false
outputs:
  - type: audit_report
  - type: document
uses:
  - prepare-an-ai-pilot-go-decision
  - source-note-summariser
steps:
  - uses: prepare-an-ai-pilot-go-decision
    note: Tests the goal as a hypothesis, checks the results table and applies your ordered checklist. Runs when new representative results arrive or a gate is due.
  - uses: source-note-summariser
    note: "Only when the goal or baseline may have changed: pulls the baseline and success definition from the old and new sources, so a changed measure starts a new labeled version and no improvement is claimed across versions. Uses your old and new source texts, not step 1's output. Hands the next review the baseline and success definition."
schedule: At an explicitly requested pilot gate review. Installation does not create a schedule.
asks_before:
  - Sending or submitting any message or form
  - Changing a live account, calendar, task, permission or published document
  - Spending money, releasing a payment or signing a contract
  - Starting or changing any recurring schedule
