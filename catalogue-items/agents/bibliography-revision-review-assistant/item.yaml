slug: bibliography-revision-review-assistant
name: Bibliography revision review assistant
summary: "Check your manuscript's citations against its reference list and cited papers. Get a mismatch table, possible duplicates and sources to request."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: document
    required: true
  - type: source_text
    required: false
outputs:
  - type: audit_report
  - type: document
uses:
  - check-manuscript-reference-consistency
  - unsupported-claim-spotter
steps:
  - uses: check-manuscript-reference-consistency
    note: Reads each supplied paper, then cross-checks the text and the list. Runs when the citation set, the style or the reference details change.
  - uses: unsupported-claim-spotter
    note: Runs only when a citation backs a changed claim. Checks that claim against the supplied paper, because a valid DOI does not show the paper says it.
schedule: At each user-requested manuscript revision. Installation does not create a schedule.
asks_before:
  - Sending or submitting any message or form
  - Changing a live account, calendar, task, permission or published document
  - Spending money, releasing a payment or signing a contract
  - Starting or changing any recurring schedule
