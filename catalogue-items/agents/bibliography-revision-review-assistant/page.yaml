new_slug: bibliography-revision-review-assistant
name: Bibliography revision review assistant
headline: Bibliography revision review assistant
summary: Check your manuscript's citations against its reference list and cited papers. Get a mismatch table, possible duplicates and sources to request.
job: research-topics
thinking: high
thinking_why: It reads many papers against one manuscript, keeps track of what each source shows and must not guess missing details.
subhead: Give it your manuscript, its reference list and the papers you cite. It checks every citation against the list and the papers, flags possible duplicates and lists what to fetch. You get six files, including a record to start your next revision from.
explain: |-
  A manuscript reference check means flipping between the text, the reference list and a folder of PDFs. A year is off by one. An author name is spelled two ways. The same paper sits in the list twice, once with a short title. This bibliography review does that work citation by citation and shows where each fact came from.

  It only uses what you supply. If a paper shows no year on its first page, the year stays MISSING. It does not look up a DOI or guess one. A valid DOI proves a paper exists. It does not prove the paper says what your sentence says. So when a citation backs a claim you changed in this revision, the agent checks that claim against the passage in the paper.

  It also keeps a short record of each review. At your next revision it compares the new manuscript with that record and checks only what changed. If nothing changed, it says so and stops. It suggests corrections and never edits your manuscript.
when:
  - You revised your manuscript and added, cut or moved citations.
  - A journal asks you to switch citation style, for example from numbered to author-year.
  - A co-author merged their reference list into yours and you suspect repeats.
  - A reviewer asked you to back a changed claim with a source.
not_for:
  - You want missing DOIs, volumes or page numbers looked up. It only uses the papers you give it and lists the gaps as source requests.
  - You want grammar and wording fixed in your text. Use the Proofreader.
  - You want every claim in a draft that has no source at all. Use the Unsupported claim spotter.
  - You need one check and no record for next time. Use the Check manuscript reference consistency workflow.
you_give:
  - Your manuscript, as a file or pasted text, with its version or date
  - Your reference list as it stands now (from your reference manager export or the end of the manuscript)
  - The papers you cite, as PDFs or pasted text. Add as many as you have.
  - The citation style your journal wants, such as APA 7 or Vancouver (in the journal's author guide)
  - The sentences you changed since the last version (optional)
  - The record from your last review (optional)
you_get:
  - A citation table that matches each in-text citation to a list entry and marks it Match, Mismatch, No entry or Not cited
  - The title, authors, year and identifier read from each paper you supplied, with where it was seen
  - Pairs of list entries that may be the same paper, with the reason to look
  - A list of papers to request and details still missing
  - A check of each changed claim against the passage in the cited paper
  - A short record to start your next revision from
how_to_use:
  - Download the pack and add it to your AI, or paste SKILL.md into a new chat. Claude, ChatGPT and Gemini work if they can read your files. If yours cannot, paste the text and the list.
  - Attach your manuscript, your reference list and the cited papers. Type your citation style. Add your last record if you have one.
  - Say "Run the review. Suggest corrections and do not edit my files." Your AI asks once for anything missing.
  - Open reference-cross-check.md first. For each Mismatch and No entry, look at the paper itself before you change your list.
  - Treat the duplicate pairs as questions. You choose which entry stays.
  - Get the papers listed in source-requests.md, keep next-review-record.md, and run the agent again after your next revision.
how_it_works:
  - title: Read the last record
    text: If you supply one, it compares the manuscript version, citation list and open items with this request. On a first run it sets a baseline instead.
  - title: Find what changed
    text: It compares the new manuscript, style and reference details with the record. If nothing changed and no review is due, it returns a short "unchanged" note and stops.
  - title: Read the papers
    text: For each paper you gave it, it writes down the title, authors, year, journal and any DOI it can see, and where on the page it saw each one. Anything it cannot see stays MISSING.
  - title: Cross-check the text and the list
    text: It matches every in-text citation to a list entry and compares spelling, years, numbering and format with your style. It also lists entries nothing cites.
  - title: Flag possible duplicates
    text: It pairs entries with the same title, authors or identifier written two ways. It does not merge them. You decide.
  - title: Check changed claims
    text: When a citation backs a sentence you changed, it finds the passage in the cited paper and says whether it supports the sentence, partly supports it, does not, or could not be checked.
  - title: Save the record
    text: It writes the manuscript version, the citation list, unresolved entries and the next review trigger, so your next run starts from here.
output_shape: |-
  SCOPE  <manuscript version or date> | <citation style> | <n> in-text citations | <n> list entries | <n> papers supplied
  CHANGED SINCE LAST REVIEW  <what changed, or "first run">

  CITATION TABLE
    <where in the manuscript> | <citation as written> | <matching list entry> | <Match, Mismatch, No entry or Not cited> | <what differs> | <suggested correction>

  PAPER DETAILS
    <paper file> | <title> | <authors> | <year> | <identifier> | <where seen> | <MISSING items>

  DUPLICATE CANDIDATES
    <entry A> | <entry B> | <why they may be one paper> | for you to decide

  SOURCE REQUESTS
    <list entry> | <what is missing> | <what to fetch>

  CLAIM CHECK (only for changed claims)
    <sentence> | <cited paper and passage> | <Supported, Partly supported, Not supported or Not checked>

  MISSING  <each gap and what it blocks>
  CHECKS MISSED  <one line each, or none>
output_sample:
  input:
    - Your manuscript, with its version or date
    - Your current reference list
    - The papers you cite, as PDFs or text
    - Your citation style, such as APA 7 or Vancouver
    - The sentences you changed since the last version (optional)
    - The record from your last review (optional)
  prerequisites:
    - An AI that can read files, such as Claude, ChatGPT or Gemini
    - Your reference list and papers in the version you plan to submit
  output:
    - name: reference-cross-check.md
      contains: Every in-text citation matched to a list entry and marked Match, Mismatch, No entry or Not cited, with what differs and a suggested correction.
    - name: paper-details.md
      contains: The title, authors, year and identifier read from each paper you gave it, where each was seen, and what stayed MISSING.
    - name: duplicate-candidates.md
      contains: Pairs of list entries that may be one paper, with the reason, left for you to decide.
    - name: source-requests.md
      contains: Each entry with missing details or no paper supplied, and what to fetch.
    - name: claim-check.md
      contains: For each changed claim, the passage in the cited paper and whether it supports the sentence. Written only when you name changed claims.
    - name: next-review-record.md
      contains: Manuscript version, citation list, unresolved entries, dates checked and the trigger for your next review.
tweaks:
  - what: Citation style
    how: Name the style and its edition, such as APA 7. It then checks formats against it. With no style named, it checks that your list agrees with itself.
  - what: Changed claims
    how: List the sentences you changed since the last version. It checks only those against the papers.
  - what: One version
    how: Give it one manuscript version. Mixed versions make numbered citations unreliable.
judge:
  - Every suggested correction traces to an actual supplied publication; citation metadata is not proof of the cited claim.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep each review's record in one folder, named by date, so the next run starts from the true earlier state.
  - Export your reference list from your reference manager each time, so the list the agent reads is the list you will submit.
  - Name the claims you rewrite in each revision. The claim check is the part a valid DOI cannot do for you.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file upload
      why: It reads the manuscript and several papers at once and keeps each fact tied to a file.
    - name: A reference manager export
      why: A BibTeX or RIS file from Zotero, EndNote or Mendeley gives it clean list entries to compare.
  inputs:
    - The journal's author guide page on references.
    - The previous review's record.
    - A named co-author who confirms the final list.
terms:
  - term: Reference cross check
    meaning: Matching every citation in the text to an entry in the reference list, and the entry to the paper itself.
  - term: DOI
    meaning: A permanent ID for a paper. A valid DOI proves the paper exists, not what it says.
  - term: Duplicate candidate
    meaning: Two list entries that may be the same paper. The agent flags them and you decide.
  - term: Record
    meaning: A short file that says where this review stopped, so the next review can start from it.
