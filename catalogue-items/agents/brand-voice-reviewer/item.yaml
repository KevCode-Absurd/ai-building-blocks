slug: brand-voice-reviewer
name: "Brand voice reviewer"
summary: "Give it each draft before it goes out. Get it checked against your voice, fixed and re-checked, with repeat slips tracked."
category: agent
type: agent
role: orchestrate
job: copy
level: intermediate
inputs:
  - {type: copy_draft, required: true}
  - {type: brand_brain, required: true}
  - {type: brand_guide, required: false}
outputs:
  - {type: copy_draft}
  - {type: audit_report}
uses: [voice-and-tone-guide-writer, draft-brand-voice-checker, brand-voice-rewriter]
steps:
  - {uses: voice-and-tone-guide-writer, note: "Once, only if you have no voice guide: the traits, tone by situation and word lists every later check is measured against."}
  - {uses: draft-brand-voice-checker, note: "Every draft, then again after each rewrite: the deviations ranked by severity, with before and after fixes."}
  - {uses: brand-voice-rewriter, note: "Only when the check finds a major deviation or more than three minor ones: a rewrite of the flagged lines in your voice, up to three rounds."}
schedule: "Each time a draft is ready to go out"
asks_before: [publishing or sending any copy, changing the voice guide or the brand file, adding a rule from repeat slips, making a legal or claim change without a qualified person's check]
origin: own
version: 1.0.0
example_pending: true
