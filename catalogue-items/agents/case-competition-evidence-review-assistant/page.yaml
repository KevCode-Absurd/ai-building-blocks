new_slug: case-competition-evidence-review-assistant
name: Case competition evidence review assistant
headline: Case competition evidence review assistant
summary: A revised case deck, financial bridge and challenge register.
job: speak-and-persuade
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: A revised case deck, financial bridge and challenge register. Share the full case, judging rubric, team recommendation, financial exhibits, explicit assumptions, time limit and available PPTX tools. Include the previous review when available. Your AI prepares the work and marks any facts it cannot verify.
explain: |-
  A revised case deck, financial bridge and challenge register.

  Give your AI the source material listed below and install the complete pack. It uses the component skills in the stated order, saves each result and checks the handoff before continuing. The recommendation answers the rubric; scenario arithmetic reconciles and every rendered slide is inspected. Missing tools or evidence stay visible in the final summary.
when:
  - You need a revised case deck, financial bridge and challenge register.
  - The relevant facts are spread across files or notes and need one consistent review.
  - You need to compare new evidence with the last review and choose the next action.
you_give:
  - The full case, judging rubric, team recommendation, financial exhibits, explicit assumptions, time limit and available PPTX tools. Include the previous review when available.
  - The intended reader, deadline and limits on what may be changed.
  - The last review and current evidence, if this is a repeat run.
  - "Available tools for the finished output: Python PPTX adapter and a compatible renderer."
you_get:
  - A revised case deck, financial bridge and challenge register.
  - Step files with evidence, unresolved facts and actual checks completed.
  - The reason each branch ran or was skipped, plus a minimal record for the next review.
how_to_use:
  - Download the complete pack and add its governing file and component skills to your AI.
  - Share the sources listed above and say which result you need.
  - Ask the AI to follow the governing file, save each result and stop on a failed required check.
  - Review the files, missing facts and proposed actions before using the result.
how_it_works:
  - title: Read scope and prior state
    text: Keep case version, rubric version, recommendation, assumptions, affected slides and render evidence. Establish a baseline on the first run.
  - title: Check the trigger
    text: The team changes its recommendation, financial exhibit or judging rubric.
  - title: Choose the next step
    text: Run stress-test-a-case-competition-recommendation for changed evidence or a due review. If a new assumption drives the recommendation, extract its source or mark it unsupported before rebuilding affected slides. Stop the deck path when required rendering tools are absent.
  - title: Check and save evidence
    text: The recommendation answers the rubric; scenario arithmetic reconciles and every rendered slide is inspected. Save source versions, branch reasons, outputs and unresolved checks.
output_shape: |-
  Scope and source coverage
  A revised case deck, financial bridge and challenge register.
  Step files and evidence references
  Changes since the last review and branches taken
  Unresolved facts and checks missed
  Proposed next action and approval status
tweaks:
  - what: Scope
    how: Choose one project, team, period or decision so the sources are comparable.
  - what: Evidence
    how: Provide the actual records and their dates rather than a summary from memory.
  - what: Acceptance
    how: The recommendation answers the rubric; scenario arithmetic reconciles and every rendered slide is inspected.
judge:
  - The recommendation answers the rubric; scenario arithmetic reconciles and every rendered slide is inspected.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
works_best_with:
  tools:
    - name: Python PPTX adapter and a compatible renderer
      why: Use the bundled launch-tools/USAGE.md, actual financial exhibits and build_case.py adapter; inspect every actual slide.
  inputs:
    - Approved examples of a good result.
    - A named reviewer and their acceptance rules.
terms:
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
