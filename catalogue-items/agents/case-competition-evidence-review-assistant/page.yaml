new_slug: case-competition-evidence-review-assistant
name: Case competition evidence review assistant
headline: Case competition evidence review assistant
summary: Re-check your case competition deck against the rubric and new evidence. Get a revised deck, a financial bridge and a challenge register.
job: speak-and-persuade
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it the case, the judging rubric, your team's recommendation and your financial exhibits. It checks the deck against the rubric, ties every number to a source and lists the questions judges will ask. You get a revised deck, a financial bridge and a challenge register.
explain: |-
  A case competition deck usually fails in the same few ways. It misses a rubric point. A number on a slide does not match the exhibit. An assumption has no source. This agent reviews your recommendation against the judging rubric and the case exhibits, then fixes the slides that need it.

  It works from your last review. If your team changes the recommendation or an exhibit, or the rubric changes, it finds the affected slides. It checks only those again. A new assumption needs a source, or the agent marks it unsupported before any slide is rebuilt on it. The financial bridge must add up step by step. Claims about the market or customers that no source backs are flagged.

  If your AI cannot build a PowerPoint file, you get the deck as text, slide by slide. The agent tells you so. It never says a slide was checked when it was not.
when:
  - Your team changes its recommendation in the last week before the final.
  - The judges update the rubric, or the case adds a new exhibit.
  - A teammate rebuilt a financial slide and you need to know the numbers still add up.
  - You want the hardest judge questions, each with an answer tied to a source.
not_for:
  - This is your first pass and you have no earlier review. Run the Case competition financial-assumption reviewer workflow.
  - You only want practice questions from the judges. Use the Case competition answer and backup-slide planner workflow.
  - You want a talk story, not a deck review. Use the Case-based pitch and talk writer workflow.
you_give:
  - The full case text and its exhibits
  - The judging rubric and your time limit
  - Your team's recommendation and current deck
  - Your financial exhibits and the assumptions behind them
  - Your last review file (optional)
  - Python PowerPoint tools, only if you want a .pptx file built (optional)
  - If your rubric is missing or partly pasted, say so. The agent marks the missing criteria and reviews the rest.
you_get:
  - A revised case deck, as a .pptx file if your AI can build one, or as slide-by-slide text
  - A financial bridge that ties each step to an exhibit or an assumption
  - A challenge register of likely judge questions with sourced answers
  - A rubric check that shows which slide answers each criterion
  - A list of claims that no source backs
  - A review log for your next review
how_to_use:
  - Download the pack from this page and add it to your AI. If you cannot add it, paste SKILL.md into a new chat.
  - Attach the case, rubric, current deck, exhibits and assumptions. Type your time limit. Say if this is the first review, or attach the last review file.
  - Say "Review against the rubric, fix the affected slides and check the bridge." If you want a .pptx, say so.
  - A .pptx needs an AI that can run Python and the deck builder tools from the pack. Without them you get the deck as text to paste into PowerPoint or Google Slides.
  - Open rubric-check.md first. Then open financial-bridge.md and compare each number with your exhibit.
  - Look at every slide yourself before you present. Keep review-log.md for the next round.
how_it_works:
  - title: Read the last state
    text: It keeps the case version, rubric version, recommendation, assumptions and the slides each one touches. The first run sets a baseline.
  - title: Check what changed
    text: It compares versions and dates with the last review. If nothing changed, it says so and leaves your work alone.
  - title: Stress test the recommendation
    text: It maps each rubric criterion to a slide and builds the strongest case against your recommendation.
  - title: Source the assumptions
    text: For each new assumption it finds the source in the case or exhibits, or marks it UNSUPPORTED before any slide uses it.
  - title: Rebuild the affected slides
    text: It changes only the slides touched by the change, saves them under new names and keeps your originals.
  - title: Check the sums and claims
    text: It checks the bridge adds up, scenarios are not shown as forecasts, and no claim lacks a source.
  - title: Save the review
    text: It logs the path taken, the checks done and the checks missed, so the next review can compare.
output_shape: |-
  RUBRIC CHECK
    <criterion> | <slide that answers it, or MISSING> | <gap and fix>

  FINANCIAL BRIDGE
    Start: <number, exhibit> -> <step, source> -> <step, source> -> End: <number>
    Reconciles: <yes or no, and the difference>

  CHALLENGE REGISTER
    <likely judge question> | <best answer> | <source> | <status: ready, needs evidence, weak>

  UNSUPPORTED CLAIMS
    <slide> | <claim> | <what to do>

  REVISED DECK
    <slide number> | <one-line message> | <numbers used and their sources>

  REVIEW LOG
    Baseline or comparison | what changed | path taken and why | checks done | CHECKS MISSED | next step
output_sample:
  input:
    - The full case and its exhibits
    - The judging rubric and your time limit
    - Your recommendation, current deck and financial exhibits
    - Your last review file (optional)
  prerequisites:
    - An AI that can read files, such as Claude, ChatGPT or Gemini
    - An AI that can run Python and the deck builder tools, only if you want a .pptx file
  output:
    - name: Revised deck (case-deck.pptx or deck-text.md)
      contains: The slides in order, one message per slide, with the numbers and sources each one uses.
    - name: financial-bridge.md
      contains: Steps from the starting numbers to your outcome, each tied to an exhibit or assumption.
    - name: challenge-register.md
      contains: Likely judge questions, your best answer, its source and whether it is ready.
    - name: rubric-check.md
      contains: Each rubric criterion, the slide that answers it and any gap.
    - name: unsupported-claims.md
      contains: Claims on slides with no source, and what to do with each.
    - name: review-log.md
      contains: What changed, the path taken, checks done and missed, and the state for next time.
tweaks:
  - what: The rubric
    how: Paste the rubric exactly as the judges wrote it, with the points for each criterion. The review is only as sharp as the rubric.
  - what: The exhibits
    how: Attach the original tables, not a summary from memory. The bridge can only tie to numbers it can see.
  - what: The last review
    how: Attach it on every repeat run. Without it the agent starts a new baseline and cannot say what changed.
improve:
  - Add the judges' written feedback from earlier rounds to your inputs, so the challenge register covers what they actually asked.
  - Keep the review log with your deck files. Each run then starts from your real state.
  - Edit the rubric check to add your team's own pass bar, such as "every slide answers one rubric criterion".
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file upload
      why: It reads the case, rubric and exhibits together and does the bridge sums.
    - name: Python PowerPoint tools and a slide renderer
      why: They let your AI build the .pptx and look at each rendered slide, instead of giving text only.
  inputs:
    - The judges' feedback from an earlier round.
    - Your team's notes on why you rejected the other options.
    - The speaker order and the time each person has.
terms:
  - term: Financial bridge
    meaning: A step-by-step walk from today's numbers to the outcome you recommend, with the source for each step.
  - term: Challenge register
    meaning: A list of questions the judges could ask, with your best answer and its source.
  - term: Rubric
    meaning: The list of things the judges score, and how many points each is worth.
  - term: Unsupported claim
    meaning: A statement on a slide that no source in the case or exhibits backs.
judge:
  - The recommendation answers the rubric; scenario arithmetic reconciles and every rendered slide is inspected.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
