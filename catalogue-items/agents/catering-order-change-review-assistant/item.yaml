steps:
  - uses: check-a-catering-order-before-service
    note: Run this when the approved headcount, dietary requirements, timing or quoted charges change. Recompute the totals and write the order-to-service checklist. Hands step 2 the discrepancy table, the totals check and the checklist.
  - uses: handover-note-writer
    note: Run this to write the service lead handover. Uses the discrepancy table, totals check and checklist from step 1 as its source material, and shows exactly what changed. Unresolved dietary facts stop the affected dish and go to the named dietary reviewer.
schedule: When the user supplies an approved order change. Installation does not create a schedule.
