new_slug: catering-order-change-review-assistant
name: Catering order change reviewer
headline: Catering order change reviewer
summary: Check a catering order change against the confirmed order. Get a discrepancy table, a service checklist and owner questions before service.
job: organise-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it the confirmed order, the approved change and your last review. It lists what changed in guest counts, times and prices, and recalculates the order totals. You get a discrepancy table, a service checklist and a handover note for the service lead. Dietary questions go to a named person, never to the AI.

explain: |
  A catering order changes more than once before the event. The guest count goes up. The start time moves. A quote line is edited in an email. Each change is easy to miss, and the kitchen, the van and the invoice all work from different copies.

  This catering order change review starts from the last order you confirmed. It compares the new approved change with that order line by line. It uses the Catering order and service checker to recompute the totals and write the order-to-service checklist. It then writes a handover for the service lead that shows exactly what changed. A change that was only suggested, and not approved, is listed as a question and not treated as the order.

  Allergy and diet details are different. The AI copies them word for word to the person you name as the dietary reviewer. It never guesses them and never says a meal is safe. If a dietary detail is unclear, the affected dish stops and goes on the owner question list.

when:
  - The customer emails a new guest count, and you need to know what else it changes in the order and the invoice.
  - The event start time moves, and the preparation and delivery times need rechecking.
  - Someone edits a quoted price or fee, and you need the order total recalculated.
  - A guest adds a dietary need, and you need it passed on word for word to the right person.

not_for:
  - You are checking an order for the first time with no earlier version. Use the Catering order and service checker.
  - You want the AI to confirm that a meal is safe for an allergy. It cannot. A chef or a dietitian must confirm every dietary fact.
  - You only need to check invoice totals and nothing else. Use the Invoice totals checker.
  - You want to write the kitchen's standard procedures. Use the Process and SOP writer.
  - You want it to email the customer or the kitchen. It prepares drafts and sends nothing.

you_give:
  - The confirmed catering order, with its version and date
  - The approved change, in the customer's own words, with its date
  - Guest counts, event times and the delivery or setup times
  - The customer's dietary and allergy requirements, copied exactly as given
  - The quoted prices, fees and any approved extras
  - The approved preparation procedures
  - The name of the person who confirms dietary facts, such as the chef
  - Your last review (optional on a repeat run)

you_get:
  - A list of what changed since the confirmed order, with the source and date of each change
  - A discrepancy table with the confirmed value, the new value and the difference
  - Recalculated order totals, with any mismatch flagged
  - A service checklist from the approved procedures and the new times
  - A handover note for the service lead that shows what changed
  - Owner questions, such as unapproved changes and unclear dietary details
  - A MISSING list, CHECKS MISSED and a short record for the next review

how_to_use:
  - Download the agent pack and add it to Claude, ChatGPT or Gemini. Add the catering order checker, the invoice totals checker and the handover note writer from the pack.
  - Say if this is a first run. If not, paste your last review and its record.
  - Attach the confirmed order and the change. Paste dietary details exactly as given. Name the person who confirms them.
  - Read the discrepancy table first. Check each change against the customer's message.
  - Send every dietary line to your named reviewer. Do not start preparation for a dish with an open dietary question.
  - Answer the owner questions and run it again. The agent sends nothing, so you send the handover yourself.

how_it_works:
  - title: Compare with the confirmed order
    text: Reads the saved record if it belongs to this order, or sets a first baseline. Lists each new or changed source. If nothing changed, it says so and stops.
  - title: Check the totals and the checklist
    text: Runs the Catering order and service checker. It recomputes the order totals with units, fees and rounding, and writes the order-to-service checklist from your approved procedures.
  - title: Hold dietary facts apart
    text: Copies each dietary or allergy line word for word to your named reviewer. If one is unclear or the reviewer is not named, the affected dish stops and appears on the question list.
  - title: Write the service lead handover
    text: Runs the Handover note writer. It puts what changed first, then what is due, then who needs to know.
  - title: Save and hand back
    text: Saves the review files and a proposed new record, and keeps the old one. Lists every MISSING line and every check that did not run.

output_shape: |
  REVIEW DATE <date>, EVENT <date and time>   ORDER <id>, VERSION <v>   LAST REVIEW <date or first run>

  CHANGED SINCE CONFIRMED ORDER  <item: confirmed to new, source and date>
  DISCREPANCIES    <item | confirmed | new | difference | approved? yes or no>
  TOTALS           <recomputed total>, <quoted total>, <mismatch or none>
  SERVICE CHECKLIST  <step | time | owner | procedure used>
  DIETARY          <line, word for word | reviewer | confirmed or open>
  HANDOVER FOR SERVICE LEAD  <what changed first, then due items>
  OWNER QUESTIONS  <question | who answers>

  RECORD FOR NEXT REVIEW  order ID, confirmed version, headcount, dated change evidence, open approvals
  MISSING  <each gap, and the line it stops>
  CHECKS MISSED  <one line each, or none>

output_sample:
  input:
    - Your confirmed catering order and the approved change, each with its date
    - Guest counts, event times and quoted prices
    - The customer's dietary requirements, copied exactly
    - The name of your dietary reviewer, such as the chef
    - Your last review (optional on a first run)
  prerequisites:
    - An AI that can read files, such as Claude, ChatGPT or Gemini
    - The Catering order and service checker and the Handover note writer in the agent pack
    - Your approved preparation procedures
  output:
    - name: Changed since confirmed order
      contains: Each change to headcount, time, menu or price, with its source and date.
    - name: Discrepancy table
      contains: One row per changed item with the confirmed value, the new value, the difference and whether the change is approved.
    - name: Order totals check
      contains: The order and quote totals recomputed with units, fees and rounding, and any mismatch.
    - name: Service checklist
      contains: The order-to-service steps from your approved procedures, with the new times.
    - name: Dietary lines
      contains: Each dietary or allergy requirement word for word, its named reviewer and whether it is confirmed or open. It never says a dish is safe.
    - name: Service lead handover
      contains: What changed first, then what is due, so the person running service can act on it.
    - name: Owner questions
      contains: Unapproved changes, unclear dietary details and missing facts, each with who answers.
    - name: Record for next review
      contains: The order ID, confirmed version, headcount, dated change evidence and open approvals, to paste into the next run.
    - name: MISSING and CHECKS MISSED
      contains: Every gap and the line it stops, and every check that failed or could not run.

tweaks:
  - what: Scope
    how: Pick one event so the sources are comparable.
  - what: Evidence
    how: Provide the real emails and order forms with their dates, and not a summary from memory.
  - what: A price change only
    how: Say that only prices changed. The checklist step is skipped and the totals check runs alone.
  - what: A new dietary need
    how: Paste the exact words and name the reviewer. The affected dish stops until the reviewer confirms.

judge:
  - Quantities and charges match the confirmed order; allergy and dietary details are never guessed or declared safe by AI.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep each review's record in one folder named by date, so the next run starts from the true prior state.
  - Number every order and every version of it, and quote the number in each change email.
  - Keep dietary requirements in one list with the date each was confirmed and by whom.
  - Keep corrections with the result so the next run uses current facts.

works_best_with:
  tools:
    - name: A capable chat AI with file support
      why: Reads the order, the emails and your procedures, and can save the record file. In plain chat it returns the same tables as text.
  inputs:
    - The confirmed order form and the quote, not a retyped copy.
    - The customer's own wording for any dietary need.
    - A named chef or dietitian who confirms dietary facts.

terms:
  - term: Discrepancy
    meaning: A difference between the confirmed order and the new request.
  - term: Confirmed order
    meaning: The version the customer and you both agreed to, with a date.
  - term: Handover note
    meaning: A short note that tells the next person what changed and what to do about it.
  - term: Dietary reviewer
    meaning: The qualified person who confirms allergy and diet facts. It is never the AI.
