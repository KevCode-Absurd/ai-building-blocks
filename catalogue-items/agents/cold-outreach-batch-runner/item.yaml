slug: cold-outreach-batch-runner
name: "Cold outreach batch runner"
summary: "Give it your prospects and last batch's results. Get a checked batch of cold emails to approve and send."
category: agent
type: agent
role: orchestrate
job: email
level: intermediate
inputs:
  - {type: persona, required: true}
  - {type: offer, required: true}
  - {type: lead_list, required: false}
  - {type: performance_sheet, required: false}
  - {type: source_text, required: false}
outputs:
  - {type: email_flow}
  - {type: plan}
uses: [inbox-delivery-fixer, prospect-list-builder, own-voice-outreach-writer, cold-email-writer, outbound-email-sequence-writer, cold-email-pre-send-checker]
steps:
  - {uses: inbox-delivery-fixer, note: "Only when the last batch bounced a lot or drew a spam complaint: stops sending and fixes the sending setup. Hands on a go or hold call; the list step starts from your persona, not from this report."}
  - {uses: prospect-list-builder, note: "Only when fewer unsent, qualified prospects are left than the next batch needs, or when replies show the list is the problem: builds or tightens the list from your persona, with the reason each one fits. Hands the list to the writing step. It does not use step 1's report; the two run side by side."}
  - {uses: own-voice-outreach-writer, note: "When a voice file or a few of your sent emails exist: takes step 2's list (or your current one) and writes the first emails in your voice, each tied to a fact about that prospect. Hands the emails to the follow-ups and the check."}
  - {uses: cold-email-writer, note: "Use this instead of step 3 when there is no voice sample, or when the last batch needs a new angle. It starts from your persona and offer, not from step 3's emails, and writes the first emails and the replies to people who answer. Hands the emails to the follow-ups and the check."}
  - {uses: outbound-email-sequence-writer, note: "Only for prospects who have not replied to a first email: takes the first emails from step 3 or 4 and writes the follow-ups with timing, up to four touches. Hands the whole set to the check."}
  - {uses: cold-email-pre-send-checker, note: "Every email, before it is ready to send: takes the first emails and follow-ups from steps 3 to 5, tests each claim against what you supplied, then fixes and checks again, up to three rounds. Hands back the emails that passed, ready for you to approve."}
schedule: "Once a week, on the day you send, after last batch's replies are in"
asks_before: [sending any email, changing mailbox, domain or sending-limit settings, raising the daily send volume, contacting anyone on the do-not-contact list, using a paid or scraping data source to build a list, replying to a person who answered]
origin: own
version: 1.0.0
example_pending: true
