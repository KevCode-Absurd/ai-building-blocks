slug: construction-variation-review-assistant
name: Construction variation review assistant
summary: Check a construction variation request against the signed contract and its prices. Get a cost and time check and a brief. Nothing is approved for you.
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: document
    required: true
  - type: meeting_notes
    required: false
  - type: question
    required: false
outputs:
  - type: document
  - type: audit_report
  - type: plan
needs_mode: manual
uses:
  - prepare-a-construction-variation-decision
  - executive-action-register
steps:
  - uses: prepare-a-construction-variation-decision
    note: "Run this when a priced variation or a contract approval record changes. Check the contract rules, recompute the cost and draft the decision brief. Hands the brief to the people who approve it; step 2 waits for their answer."
  - uses: executive-action-register
    note: "Run this only when an approval arrives. Uses the approval record you supply (minutes, email or signed form), not step 1's brief. Records the accepted scope, authority, amount and date from the approval itself. A submitted variation is not an approval."
schedule: When the user provides a revised variation or approval. Installation does not create a schedule.
