slug: customer-inbox-triage-and-reply-drafter
name: "Customer inbox triage and reply drafter"
summary: "Give it the new customer emails. Get them ranked, with a checked reply to approve for each. It never sends."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: voc_reviews, required: true}
  - {type: document, required: true}
  - {type: tool_connection, required: false}
  - {type: brand_brain, required: false}
  - {type: policy, required: false}
outputs:
  - {type: spreadsheet}
  - {type: copy_draft}
  - {type: plan}
uses: [support-ticket-sorter, support-inbox-priority-sorter, customer-reply-and-order-checker, customer-question-researcher, customer-reply-drafter, angry-customer-reply-checker, chargeback-evidence-gatherer, solved-ticket-help-page-writer]
steps:
  - {uses: support-ticket-sorter, note: "Every run: sorts the new emails by type, ranks them by severity and routes each. Hands the ranked queue to the steps that follow."}
  - {uses: support-inbox-priority-sorter, note: "Only for the top-ranked emails in step 1's queue: each email's text becomes its question. It sets P1 to P4 and checks for a duplicate or a known issue. Hands the priority to the reply steps."}
  - {uses: customer-reply-and-order-checker, note: "Only for order status, delivery and refund emails in step 1's queue: reads the email text, checks the order and drafts a reply. Refunds only on the owner's yes. Hands the draft on for sending. It works from step 1's queue, not step 2's priority; the two run side by side."}
  - {uses: customer-question-researcher, note: "Only for how-to and product emails in step 1's queue: reads the email text and finds the answer in the owner's own docs and past tickets, with sources. Hands the sourced answer to the reply drafter. It works from step 1's queue, not step 3's draft; the two run side by side."}
  - {uses: customer-reply-drafter, note: "For every email that has no draft yet: drafts the reply in the right tone, using step 4's sourced answer when there is one. Hands the draft to the complaint check or to you."}
  - {uses: angry-customer-reply-checker, note: "Only for complaints and upset customers: checks step 5's draft against the customer's words and the policy. Fixes and checks again, up to two rounds. Hands back a draft that passed."}
  - {uses: chargeback-evidence-gatherer, note: "Only when an email mentions a dispute or chargeback: that email becomes its question, with the order facts you give, not the reply drafts. Lists the proof to collect and whether to accept it."}
  - {uses: solved-ticket-help-page-writer, note: "Only when the same question has come in three times in 30 days: reads those solved tickets and their answers, not step 7's plan. Drafts a help article."}
schedule: "Run by hand each weekday morning, and again mid-afternoon if the inbox is busy. Nothing starts on a timer unless you connect a scheduler."
asks_before: [sending any reply, issuing a refund, replacement or credit, closing or assigning a ticket, publishing a help article, promising a date, an outcome or anything outside the policy, replying to a customer who mentions harm, legal action or a regulator]
origin: own
version: 1.0.0
example_pending: true
