slug: daily-order-and-shipping-watcher
name: "Daily order and shipping watcher"
summary: "Run it each morning. Get late and stuck orders found before customers write, and risky ones held only on your yes."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: tool_connection, required: true}
  - {type: spreadsheet, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
uses: [daily-fulfillment-digest-writer, where-is-my-order-risk-finder, risky-order-flagger, order-hold-manager, carrier-performance-comparer, tracking-number-fixer]
steps:
  - {uses: daily-fulfillment-digest-writer, note: "Every morning: open orders grouped by age, with holds and exceptions, set against yesterday's list."}
  - {uses: where-is-my-order-risk-finder, note: "Every morning: shipped orders with stale tracking and unshipped orders past your limit, before customers ask."}
  - {uses: risky-order-flagger, note: "Only when Shopify marked new orders as risky: lists them, then tags and holds them only after your yes."}
  - {uses: order-hold-manager, note: "Only after you have reviewed held orders and said which to release or keep held."}
  - {uses: carrier-performance-comparer, note: "Only when most of the stale tracking sits with one carrier: whether that carrier is slower than the others."}
  - {uses: tracking-number-fixer, note: "Only when you supply corrected tracking numbers and say yes: updates them on orders already shipped."}
schedule: "Every weekday morning, before support opens"
asks_before: [tagging or holding any order, releasing a held order, cancelling or changing an order, changing tracking numbers, emailing any customer]
origin: own
version: 1.0.0
example_pending: true
