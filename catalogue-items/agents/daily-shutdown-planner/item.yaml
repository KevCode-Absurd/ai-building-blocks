slug: daily-shutdown-planner
name: "Daily shutdown planner"
summary: "Give it your task list and tomorrow's calendar each evening. Get the day closed, three priorities set and focus hours protected."
category: agent
type: agent
role: orchestrate
job: ops
level: beginner
inputs:
  - {type: plan, required: true}
  - {type: question, required: true}
  - {type: meeting_notes, required: false}
outputs:
  - {type: plan}
uses: [week-priority-picker, deep-work-day-planner, not-to-do-list-builder, habit-plan-builder, weekly-status-update-writer]
steps:
  - uses: week-priority-picker
    note: "Every evening: the task list against real hours tomorrow, the big tasks that matter, three priorities and the list for the morning. Hands the three priorities to step 2."
  - uses: deep-work-day-planner
    note: "Every evening: tomorrow laid out with protected focus hours and the shallow work cut to two windows. Reads step 1's priorities and your calendar. Hands the day plan to the cut on Friday and to your hand-back."
  - uses: not-to-do-list-builder
    note: "Only on Friday, or when three days in a row lost their focus hours: what to stop, with a rule and a swap for each. Reads the plan from step 2. Hands the stop rules to next week's plan as proposals."
  - uses: habit-plan-builder
    note: "Only when the same interruption broke the focus hours three days running: one two-minute habit that guards them. Uses the interruption in your shutdown log, not step 3's stop list. Hands the habit to tomorrow's plan."
  - uses: weekly-status-update-writer
    note: "Only on Friday, when you ask: a one-page update for your team or manager from the week's closed days. Uses the week's closed-day files, not step 4's habit. Hands you the draft; nothing is sent without your yes."
schedule: "Run by hand every working day at shutdown time, with a longer pass on Friday. Nothing starts on a timer unless you connect a scheduler."
asks_before: [creating, moving or deleting calendar events, sending any message or status update, dropping a task from the list, declining a meeting, changing a commitment to someone else]
minds: [cal-newport]
origin: own
version: 1.0.0
example_pending: true
