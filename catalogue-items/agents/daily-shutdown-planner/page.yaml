new_slug: daily-shutdown-planner
name: Daily shutdown planner
summary: "Close your workday with a daily shutdown routine. Paste today's tasks and tomorrow's calendar. Get three priorities and protected focus time."
job: organise-work
thinking: medium
thinking_why: The daily pass is short and well bounded. A fast model handles most evenings. Use a stronger one on Friday, when it reads the week for patterns.
headline: Daily shutdown planner
subhead: Paste today's task list and tomorrow's calendar at the end of your working day. It marks each task done, carried or dropped, picks three priorities that fit the free hours, and places focus blocks. On Friday it adds stop rules and a status update. You approve every change.
explain: |
  Days end without ending. The list is half ticked, three new things arrived at five, and the mind keeps working through dinner because nothing was closed. Then the morning starts with the inbox, the first focus hour goes to whatever is loudest, and the thing that mattered carries to Thursday.

  This agent runs the shutdown. It marks each task done, carried or proposed drop and writes one line that the day is closed. It picks three priorities for tomorrow against the hours the calendar really leaves, places focus blocks in the longest gap, and boxes the shallow work. It flags anything carried three days and offers three ways out. On Friday, or after three days of broken focus blocks, it writes at most two stop rules with swaps, and when the same thing keeps breaking a block it proposes one two-minute habit to guard it. It never moves a meeting or sends a word.
when:
  - Your evenings leak into work because nothing was closed.
  - Your mornings start with the inbox and the real work starts at eleven.
  - The same task has carried for a week and you keep rolling it forward.
  - You want one fixed end-of-day routine instead of a new planning app.
not_for:
  - You want to close a whole week and plan the next one. Use the Weekly task focus planner.
  - You only want a brief of today's meetings and open tasks. Use the Daily executive brief writer.
  - You have no task list at all. It can't close a day it can't see, so write down what you did and what is left first.
  - You want it to move meetings, decline invites or message people. It only proposes, and you make each change.
you_give:
  - Today's task list, with what got done, what did not and what came in (from your to-do app or a note)
  - Tomorrow's calendar with times (copy it from Google Calendar or Outlook)
  - The one or two outcomes that matter most this week (advised)
  - Today's notes and loose thoughts (optional)
  - The shutdown log from earlier days (optional; paste it back each evening if you use a plain chat)
you_get:
  - The day closed, with done, carried and proposed drops
  - Three priorities for tomorrow that fit the real free hours, each with a first step
  - Protected focus blocks in the longest gap and shallow work in two windows
  - Stuck items with three ways out
  - On Friday, at most two stop rules with swaps, and a one-page status update if you ask
  - One two-minute habit to guard a block that keeps breaking
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the agent. In Claude Code, add it as a skill or save it in .claude/agents, then ask it to close the day.
  - Paste today's list and tomorrow's calendar, or keep them in a folder it can read. No web access or code is needed.
  - Say the one or two outcomes that matter this week. In a plain chat, paste them again each evening.
  - Check that every task on today's list is marked done, carried or proposed drop, and that tomorrow's three fit the free hours you gave.
  - Add the focus blocks to your own calendar, then stop working.
  - Run it again tomorrow evening and say whether the blocks held. After three days it starts seeing patterns.
output_sample:
  input:
    - "Today's task list: what got done, what did not, and what came in"
    - Tomorrow's calendar with times
    - The one or two outcomes that matter most this week (advised)
    - Today's notes (optional)
    - Your shutdown log from earlier days (optional)
  output:
    - name: Today, closed
      contains: Each task marked done, carried or proposed drop, and whether your focus blocks held.
    - name: Tomorrow's three
      contains: Three priorities that fit your free hours, each with a time block and a first step.
    - name: The day's shape
      contains: Your focus hours, two shallow work windows and a three-line morning list.
    - name: Stuck items
      contains: "Any task carried three days, with three ways out: drop it, shrink it or give it a block."
    - name: Friday
      contains: At most two stop rules with swaps, and a one-page status update if you ask.
    - name: The guard
      contains: One two-minute habit to protect a focus block that keeps breaking.
    - name: Files and missing
      contains: The day's file and a line for every fact it could not find.
how_it_works:
  - title: Close the day
    text: Marks each task done, carried or proposed drop, records whether the focus blocks held, and writes the day closed.
  - title: Pick tomorrow's three
    text: Picks the big tasks against the real free hours, three at most, and flags anything carried three days.
  - title: Lay out the day
    text: Places protected focus hours in the longest gap and boxes shallow work into two windows, four deep hours at most.
  - title: Cut on Friday or after three broken days
    text: At most two stop rules, each with a swap, proposed for next week.
  - title: Guard the blocks
    text: When the same interruption breaks the focus hours three days running, one two-minute habit with a cue.
  - title: Write the update on Friday
    text: A one-page status update from the week's closed days, when asked.
  - title: Log and hand back
    text: Saves the day and the row, then stops for your yes.
output_shape: |-
  TODAY, CLOSED
    done <n> | carried <n> | proposed drops: <task>, <task> | focus blocks held: <yes | no, broken by <what>>

  TOMORROW'S THREE
    1. <task> | block <time> | first step: <under 30 min>
    2. ...
    3. ...

  THE DAY'S SHAPE
    focus <time to time> | shallow window 1 <time> | shallow window 2 <time> | morning list: <three lines>

  STUCK (carried 3 days)
    <task> | drop | shrink to: <first step> | block on <date>

  FRIDAY
    stop: <rule> -> swap: <what> | stop: <rule> -> swap: <what>
    status update: <one page, if asked>

  THE GUARD
    <interruption> broke blocks <n> days | habit: <two minutes> | cue: <when> | restart: <how>

  FILES AND MISSING
    <the day's file> | MISSING: <every line>
example:
  business: sprout
  input: |
    [the agent]

    Close today for the marketing lead at Sprout. Practice list, not a
    real person's.
    Today's list: write the hook test plan (not done, carried 3 days);
    review 6 new ad images (done); reply to the creator coordinator about
    the roster (done); brief the photographer on the October shoot (not
    done); approve the Thursday newsletter (done, late); new today: the
    founder wants a one-pager on the habit angle by Friday.
    Tomorrow: 9:00 to 9:30 stand-up; 11:00 to 12:00 agency call; 14:00 to
    15:30 retail partner review; nothing after 15:30.
    Focus goal this week: the hook test plan and the habit-angle one-pager.
    Log so far this week: Mon focus block broken by Slack pings; Tue broken
    by Slack pings; Wed broken by a surprise founder request.
  output: pending

tweaks:
  - what: Tomorrow's calendar
    how: Give the real one. A focus block in a 45-minute gap is a wish.
  - what: The focus goal
    how: One or two outcomes for the week. Without them the three priorities come from the carry list alone.
  - what: Deep work cap
    how: Four hours a day is the default. Set two if your days are meeting-heavy.
  - what: Stuck rule
    how: Three days carried flags a task. Set two for a short week.
judge:
  - Every task today is marked done, carried or proposed drop.
  - The three priorities fit the free hours in the calendar you gave.
  - No more than four focus hours are planned.
  - Stop rules appear only on Friday or after three broken days.
  - Nothing in the calendar was changed.
test:
  - Give it a day with one task carried three times. It should flag it and offer three ways out.
  - Give it a calendar with no gap over an hour. It should say the day is shallow and not fake a block.
  - Run it twice on the same list and calendar. The three should match.
improve:
  - Set your deep work cap and stuck rule before the first run.
  - Record each morning whether the blocks held and what broke them, in three words. The guard step depends on it.
  - Give it your team's status update format once, so Friday's update needs no editing.
  - Pair it with the Weekly review keeper on Friday, which closes the week this one closes day by day.
works_best_with:
  tools:
    - name: Claude Code
      why: It can read the task file and calendar export and keep the daily files and log. You start it at shutdown time. It does not run on a timer.
    - name: Any good chat AI
      why: Paste the agent, today's list and tomorrow's calendar. Keep the log in a note.
  inputs:
    - A three-word note each morning on what broke yesterday's blocks
    - Your team's status update format
