slug: data-file-clean-up-loop
name: "Data file clean-up loop"
summary: "Give it a messy data file. It fixes and re-checks until the file passes, and saves your rules for the next one."
category: agent
type: agent
role: orchestrate
job: ops
level: beginner
inputs:
  - {type: dataset, required: true}
  - {type: question, required: false}
  - {type: spreadsheet, required: true}
outputs:
  - {type: spreadsheet}
  - {type: audit_report}
  - {type: dataset, required: true}
uses: [data-quality-auditor, messy-spreadsheet-cleaner, data-cleaner, spreadsheet-formula-auditor, data-quality-scorecard-maker]
steps:
  - uses: data-quality-auditor
    note: "First, and again after every clean-up round: gaps, duplicates and odd values, so each round is judged on a count. Uses your data file. Hands the counts to the clean-up steps, which fix what the counts show."
  - uses: messy-spreadsheet-cleaner
    note: "Only when the audit finds spacing, numbers stored as text, mixed date formats or exact duplicates. Cleans your data file, guided by the audit's counts. Hands the cleaned file to the next audit."
  - uses: data-cleaner
    note: "Only when the audit finds missing values, odd values or near duplicates that need a rule, not a simple fix. Works on the file from the last round, with the rules you approved. Hands the cleaned file to the next audit."
  - uses: spreadsheet-formula-auditor
    note: "Only when the file has formulas or links: errors, broken links and totals that do not tie out. Run once before cleaning and once after. Uses the file as it stands at that point. Hands formula errors to your hand-back; it never changes a formula."
  - uses: data-quality-scorecard-maker
    note: "Once, when the file passes or the rounds run out: a scorecard to keep and compare with the next file. Uses the final cleaned file (not the formula audit) and your pass rules. Hands back the scorecard and the saved rules."
schedule: "Each time a new export of the file arrives. A run with no saved, approved rules stops and waits for your yes"
asks_before: [overwriting the original file, deleting rows that are not exact duplicates, filling a blank with a guess, changing a formula, sending the cleaned file to anyone]
origin: own
version: 1.0.0
example_pending: true
