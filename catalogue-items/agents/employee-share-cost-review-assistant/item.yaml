  - convertible-eps-inclusion-test
steps:
  - uses: reconcile-share-compensation-dilution-and-cash
    note: Run this when a new award note, share ledger or pay reconciliation arrives. Compare award classes and settlement terms with the accepted model, then rebuild the weighted shares, the option dilution and the cash offset. It hands step 2 the linked workbook with the weighted basic shares, and the real terms of any award that needs the if-converted method.
  - uses: convertible-eps-inclusion-test
    note: Run this only for an award that needs the if-converted method instead of the treasury-stock method. It reads step 1's weighted basic shares and your own award contract and brief. Test its real terms and apply the continuing-operations control. An award that fits neither method stays unresolved and is never forced into an option formula.
