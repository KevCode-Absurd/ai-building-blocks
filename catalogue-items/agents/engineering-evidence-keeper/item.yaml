slug: engineering-evidence-keeper
name: Engineering change evidence agent
summary: Share a change and prior review state. Get fresh test and docs gaps,
  resolved findings and the next verification step.
category: agent
boards:
  - business
type: agent
role: orchestrate
job: ops
level: advanced
inputs:
  - type: codebase
    required: true
  - type: document
    required: false
  - type: test_report
    required: false
outputs:
  - type: audit_report
uses:
  - copilot-test-gap-audit
  - copilot-docs-sync-audit
  - copilot-bug-receipt
steps:
  - uses: copilot-test-gap-audit
    note: "Run only when the saved state and decision rules require it. Reads your codebase change and the saved state. Hands the test gaps and their finding IDs to the saved state, where the next branches read them."
  - uses: copilot-docs-sync-audit
    note: "Run only when the saved state and decision rules require it. Reads your codebase change, not step 1's test report. Hands the outdated docs and their finding IDs to the saved state."
  - uses: copilot-bug-receipt
    note: "Run only when a defect was repaired and the saved state and decision rules require it. Reads the fix in your codebase and the checks run, including the test report from the earlier steps. Hands back the dated receipt marked VERIFIED, PARTIAL or BLOCKED."
origin: rebuilt
version: 1.0.0
credits:
  - title: Awesome Copilot skill collection
    by: GitHub Copilot community
    url: https://github.com/github/awesome-copilot
    used: The component skills are copied under their own licenses. This catalogue
      adds original orchestration and decision rules.
example_pending: true
