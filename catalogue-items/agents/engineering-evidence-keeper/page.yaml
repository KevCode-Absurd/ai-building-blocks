new_slug: engineering-evidence-keeper
name: Engineering change evidence agent
summary: Check a code change against your last review. Find test and docs gaps, see which findings are closed and get one next step to verify.
job: test-and-fix-code
headline: Engineering change evidence agent
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: "Give it a code change and your last review state. It picks the one check that fits: test gaps, docs gaps or a bug receipt. You get a saved record and one next step."
explain: |-
  Share a change and prior review state. Get fresh test and docs gaps, resolved findings and the next verification step.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You changed code and already have an earlier review to compare with.
  - A finding was fixed and you need proof it is closed.
  - You want to know if the docs still match the code after a change.
  - You are picking up work again and need to know what changed since the last run.
not_for:
  - "You are auditing a repo for the first time: run the test gap audit or the docs sync audit on its own, since there is no earlier review to compare against."
  - "Your work is not code, such as copy, ads or finance: use a tool that fits that job, because this agent only checks repository changes."
  - "You want a fix written for you: ask your AI to patch the bug directly, then bring the change back here to check the proof."
you_give:
  - Your repository revision or commit ID
  - The list of files the change touches
  - Your earlier finding IDs (optional)
  - Your last agent-state.json file (optional)
  - Test commands and their results (optional)
you_get:
  - A dated decision log of what was checked and why
  - An updated state file you can use on the next run
  - Test gaps, docs gaps or a bug receipt marked VERIFIED, PARTIAL or BLOCKED
  - A list of missing facts and one next action
how_to_use:
  - Open Claude, ChatGPT or Gemini and add the full skill pack, including the skills folder. Use an AI that can read and save files.
  - Paste your commit ID and the list of files in the change.
  - Add your last agent-state.json and finding IDs if you have them.
  - Ask it to follow the agent and mark any missing facts.
  - Read the hand-back. Check that each VERIFIED mark rests on a test that really ran.
  - Approve any outside action yourself. It only drafts messages and never sends them.
output_sample:
  input:
    - Your repository revision or commit ID
    - The list of files the change touches
    - Your earlier finding IDs (optional)
    - Your last agent-state.json file (optional)
    - Test results or commands you have run (optional)
  prerequisites:
    - An AI that can read your files
    - A folder where it can save the state and log files
  output:
    - name: agent-state.json
      contains: The revision, scoped files, finding IDs, test results, doc paths, verified status and blockers, saved for the next run.
    - name: decision-log.md
      contains: A dated record of the branch chosen, the evidence checked and why.
    - name: Dated state
      contains: Whether the work is new, changed, unchanged, pending or blocked.
    - name: Branch selected and reason
      contains: Which check ran (test gaps, docs sync or bug receipt) and what made it the right one.
    - name: Sources checked and changed findings
      contains: The files and results it looked at, and which findings changed.
    - name: Missing facts, pending approvals and next action
      contains: What is still unknown, what needs your approval and the one step to take next.
how_it_works:
  - title: Compare saved state
    text: Check which sources, dates or results changed since the last run.
  - title: Choose the needed work
    text: If the source revision is new, run the relevant test-gap and docs checks. If evidence for a finding has changed, recheck that finding and record the outcome. If a defect was repaired, prepare its receipt with VERIFIED, PARTIAL or BLOCKED based on actual checks. If the revision and evidence are unchanged, reuse the prior findings. Never equate an edited file with a passed test.
  - title: Save the decision
    text: Record evidence, remaining gaps and one next action. Keep external action status explicit.
output_shape: |-
  Dated decision log
  Updated state and result files
  Missing facts and next action
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
