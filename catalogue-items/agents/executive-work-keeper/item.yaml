slug: executive-work-keeper
name: Executive work follow up agent
summary: Share new notes and your saved action list. Get changed commitments,
  due follow-up drafts and an updated work brief.
category: agent
boards:
  - business
type: agent
role: orchestrate
job: ops
level: advanced
inputs:
  - type: meeting_notes
    required: true
  - type: spreadsheet
    required: false
  - type: document
    required: false
outputs:
  - type: document
uses:
  - executive-action-register
  - executive-due-task-drafts
  - executive-daily-digest
steps:
  - uses: executive-action-register
    note: "Run only when the saved state and decision rules require it. Reads your new notes, saved action list and saved state. Hands the updated action list (owners, due dates, status) to steps 2 and 3."
  - uses: executive-due-task-drafts
    note: "Run only when the saved state and decision rules require it. Reads step 1's action list and the threads for tasks now due. Hands the follow-up drafts, with their send status, to step 3."
  - uses: executive-daily-digest
    note: "Run only when the saved state and decision rules require it. Reads step 1's action list, plus your calendar and step 2's follow-up drafts as waiting-on items. Hands back the dated work brief."
origin: rebuilt
version: 1.0.0
credits:
  - title: Executive assistant job ideas
    by: mgonto
    url: https://github.com/mgonto/executive-assistant-skills
    used: Inspiration for meeting preparation, action tracking, email drafting and
      daily briefings. These are original portable instructions, not copies of
      the unlicensed source.
example_pending: true
