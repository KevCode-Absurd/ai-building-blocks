steps:
  - uses: check-a-no-catchup-fund-distribution
    note: Run this when a distribution proposal, a dated preference record, a final entitlement notice or a carry recovery changes. It works out the preference owed, then pays capital, preference and the manager and investor split in order. It hands the clawback step the carry paid so far.
  - uses: gp-clawback-exposure-checker
    note: Run this only if someone has verified the final whole-fund entitlement. Compare the carry already paid with that entitlement, allowed tax, prior recoveries and escrow. Never treat one distribution's carry as the lifetime amount. Without a verified entitlement, skip this step and keep the proposed distribution apart from cash actually paid.
