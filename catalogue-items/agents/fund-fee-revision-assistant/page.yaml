new_slug: fund-fee-revision-assistant
name: Fund fee revision assistant
headline: Fund fee revision assistant
summary: Review supplied changes, preserve the last evidence baseline and return only affected calculations and unresolved approval questions.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Fee-basis bridge, offset use, invoice and carryforward reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked. Share lPA rates and basis definitions, stepdown date, comparable-period eligible bases, received eligible portfolio fees and prior offset credits. Include actual call notices and the commitment ledger only when the administrator funds fees through a capital call. Supply the previous approved review and actual changed source files with dates.
explain: |-
  Fee-basis bridge, offset use, invoice and carryforward reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked.

  Private fund fees. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need fee-basis bridge, offset use, invoice and carryforward reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked.
  - You work on private fund fees and need traceable calculations.
  - New evidence needs comparison with the prior dated review.
you_give:
  - LPA rates and basis definitions, stepdown date, comparable-period eligible bases, received eligible portfolio fees and prior offset credits. Include actual call notices and the commitment ledger only when the administrator funds fees through a capital call. Supply the previous approved review and actual changed source files with dates.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - Fee-basis bridge, offset use, invoice and carryforward reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked.
  - Original step files, financial assumptions, source coverage and a governing handoff summary.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Reconcile private fund fee charges
    text: Run the governing workflow when A fee basis, stepdown date, eligible fee receipt, offset allocation or carryforward credit changes.
  - title: Unfunded commitment checker
    text: If an actual approved fee capital call is supplied, reconcile its effect on the callable commitment ledger independently. A computed invoice is not automatically a call or a contribution; if no call evidence exists, skip the commitment branch and preserve only the fee proposal.
output_shape: |-
  Fee-basis bridge, offset use, invoice and carryforward reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Apply the charge for the actual selected period; comparison-period charges are never added together as one invoice. Never overwrite an accepted baseline with an unapproved scenario; record which branch ran or was skipped.
judge:
  - Apply the charge for the actual selected period; comparison-period charges are never added together as one invoice. Never overwrite an accepted baseline with an unapproved scenario; record which branch ran or was skipped.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
