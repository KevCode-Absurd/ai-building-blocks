new_slug: google-results-review-agent
name: Google results review agent
summary: Share dated Google Ads results and business targets. Get findings, evidence gaps, proposed next steps and a checkpoint for follow-up.
job: set-up-ai
headline: Google results review agent
subhead: Share dated Google Ads results and business targets. Get findings, evidence gaps, proposed next steps and a checkpoint for follow-up.
explain: |-
  Share scoped dated google ads exports, conversion setup and approved business targets. Get a google ads evidence report and follow-up checkpoint.

  This is a portable agent procedure for one bounded run. It can be reused with a checkpoint, but it does not claim an installed worker or continuous autonomous runtime.
when:
  - You need a google ads evidence report and follow-up checkpoint.
you_give:
  - Scoped dated Google Ads exports, conversion setup and approved business targets
  - Authorized tools, owner, limits and any prior checkpoint
you_get:
  - A Google Ads evidence report and follow-up checkpoint
  - Evidence gaps, proposed actions and checks not run
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
how_it_works:
  - title: Step 1
    text: "On first use configure the role from the brief and optional editable template: scope, owner, allowed tools, evidence sources, output contract, review limits and stop conditions. Resolve only material missing fields. A role file does not deploy a background process or grant access to another agent."
  - title: Step 2
    text: Run only the current bounded request or an explicitly authorized repeat. Load the last supplied checkpoint if present, compare its scope and evidence dates, then use the current request as authority. Set a maximum work/time/cost boundary before any paid or external operation.
  - title: Step 3
    text: Confirm manager versus target account, authorization, dates, currency, conversion actions and attribution. Use supplied exports or authorized read-only tools and distinguish branded demand from acquisition where the data permits.
  - title: Step 4
    text: Review Search, Shopping, Performance Max, Display or video only where applicable. Check tracking, search/keyword waste, asset/placement evidence and bidding/budget context. Do not impose generic account-structure thresholds as universal requirements.
  - title: Step 5
    text: Return source-linked findings with calculation inputs, evidence gaps and recommended tests. Keep bidding, negatives, budgets and pauses as proposed changes until explicitly authorized. Never treat platform attributed value as unique store sales without reconciliation.
  - title: Step 6
    text: End the run with a checkpoint containing scope, evidence dates/IDs, completed deliverables, proposed actions, unresolved facts, approvals and the next review trigger. Store it only in the destination the user requested; otherwise return it in the answer. A later run must revalidate stale facts and approvals. No promise of continuous monitoring or sending is implied.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
