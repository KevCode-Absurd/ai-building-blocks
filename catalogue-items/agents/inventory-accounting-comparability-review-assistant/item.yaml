steps:
  - uses: explain-inventory-accounting-margin-effects
    note: Run this when a new inventory note or fiscal-period update arrives. Compare the costing basis, reserve definition, charges and write-offs with the last accepted margin bridge, then run the three bridges. It hands step 2 a reconciled cost of goods sold and a record of which basis was used.
  - uses: trailing-period-financial-bridge
    note: Run this only when you want a trailing-period comparison. Rebuild revenue and cost of goods sold over matching periods before margins are worked out. A change from LIFO, or in reserve scope, needs a new documented basis, not a carried-forward formula.
