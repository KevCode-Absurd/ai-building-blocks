steps:
  - uses: reconcile-buybacks-with-owner-cash
    note: Run this when new repurchase execution, dividend or equity-statement evidence arrives. Compare actual amounts with the last accepted cash-allocation model, then run the EPS bridge, the payout cover and the book value roll-forward on the same executed amounts. It hands step 2 the executed dividend and buyback cash, in its workbook and reconciliation.
  - uses: dividend-reinvestment-share-schedule
    note: Run this only when a real shareholder reinvestment statement is supplied. It uses your reinvestment statement and step 1's executed dividend cash, not step 1's other schedules. Divide net dividend cash by the actual reinvestment price, apart from buyback cash. An authorization with no executions stays pending and is never counted as buyback cash.
