  - reconcile-basic-and-diluted-issuer-eps
steps:
  - uses: stock-split-eps-restatement
    note: Run this first, but only when a confirmed split or reverse split changes earlier periods. It hands step 2 the restated shares and EPS, with total earnings unchanged. If there is no confirmed split, skip it and start at step 2.
  - uses: reconcile-basic-and-diluted-issuer-eps
    note: Run this when a new filing or a revised share or instrument note arrives. Compare its date and period with the last accepted model, then rebuild basic and diluted EPS on step 1's restated share counts if a split was confirmed. A missing conversion term pauses only that instrument; never guess an exercise or conversion price.
