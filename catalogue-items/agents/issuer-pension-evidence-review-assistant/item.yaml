slug: issuer-pension-evidence-review-assistant
name: Issuer pension evidence review assistant
summary: Check a company's pension plan balances, costs and cash paid in. Spot new assumptions, gaps and any proposed move from OCI to profit.
category: agent
type: agent
role: orchestrate
job: ops
level: advanced
inputs:
  - type: financial_statements
    required: true
  - type: spreadsheet
    required: false
  - type: question
    required: true
outputs:
  - type: audit_report
  - type: spreadsheet
needs_mode: manual
uses:
  - separate-pension-cost-funding-and-remeasurement
  - oci-reclassification-bridge
steps:
  - uses: separate-pension-cost-funding-and-remeasurement
    note: Run this when new pension plan notes, actuarial disclosures or contribution records arrive. Compare the plan list and assumptions with the last accepted review, then split the change into cost, cash funding and remeasurement. It hands step 2 a reconciled opening and closing balance for each plan.
  - uses: oci-reclassification-bridge
    note: Run this only when someone proposes moving a pension OCI amount into profit. Check from the filing whether that amount may be moved at all. If the filing says it stays in OCI, stop and say so; never build a recycling entry for it.
