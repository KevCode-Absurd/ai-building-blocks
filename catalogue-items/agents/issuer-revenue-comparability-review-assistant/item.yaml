slug: issuer-revenue-comparability-review-assistant
name: Issuer revenue comparability review assistant
summary: Check if a company's sales growth is like for like after period, currency, business and reporting changes. Get a change log and workbook.
category: agent
type: agent
role: orchestrate
job: ops
level: advanced
inputs:
  - type: financial_statements
    required: true
  - type: spreadsheet
    required: false
  - type: document
    required: true
outputs:
  - type: audit_report
  - type: spreadsheet
needs_mode: manual
uses:
  - build-a-comparable-trailing-revenue-model
  - gross-to-net-revenue-bridge
steps:
  - uses: build-a-comparable-trailing-revenue-model
    note: Run this when a new revenue release or a restated comparative note arrives. Compare its periods, businesses and currencies with the accepted model, then rebuild trailing revenue on one basis. It hands step 2 a revenue figure that bridges back to what was reported.
  - uses: gross-to-net-revenue-bridge
    note: Run this only when the way sales are shown changed, such as gross to net, or deductions changed. Rebuild the bridge from gross billings to reported revenue before you work out growth. An unexplained difference stays as a residual and is not labelled an acquisition or currency effect.
