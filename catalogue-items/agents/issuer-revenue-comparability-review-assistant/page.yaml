new_slug: issuer-revenue-comparability-review-assistant
name: Revenue comparison reviewer
headline: Revenue comparison reviewer
summary: Check if a company's sales growth is like for like after period, currency, business and reporting changes. Get a change log and workbook.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it a company's new sales release and your last accepted sales model. It lines up the periods, currencies and businesses, and checks how sales are shown. You get a change log, a linked workbook and questions for your reviewer.
explain: |-
  Reported sales growth can mislead. A company may buy a business, sell one or report in a new currency mix. It may add an extra week to the year, or change how it shows rebates and returns. Each change moves the growth rate without changing how the core business did. If a growth label such as "organic" or "constant currency" comes with no definition, you cannot compare it with last year or with another company.

  This revenue comparison reviewer keeps a short record of the last accepted review. It holds the fiscal year boundaries, original and restated revenue, the list of businesses counted, the currency rule, calendar adjustments, the policy for gross versus net sales and the source versions. When a new release or a restated comparison arrives, it compares the periods, businesses and currencies with that record. Then it runs the Build a comparable trailing revenue model. That builds trailing revenue, then removes currency effects, acquisitions and extra weeks in a set order, so each adjustment appears once.

  If the way sales are shown changed, such as gross to net, it rebuilds the bridge from gross billings to reported revenue before it works out growth. An unexplained difference stays as a residual. It is never called an acquisition or a currency effect. It does not forecast sales or value the company. It uses only the filings you give it, and a person who knows them checks the result.
when:
  - A company reports new quarterly or annual revenue and you want growth on a like-for-like basis.
  - A release restates last year's sales, and your model still holds the old figures.
  - A company says growth is "organic" or "in constant currency", and you want to see the sums behind the label.
  - A company changed how it shows sales, such as net of rebates and returns instead of gross, and the growth rate looks different.
not_for:
  - You only want a trailing twelve month revenue figure. Use the Trailing year financial calculator.
  - You only want growth without currency moves. Use the Revenue growth currency checker.
  - You only want growth without acquisitions and sales of businesses. Use the Like-for-like sales growth checker.
  - You only want to remove an extra week from a 53-week year. Use the Extra week sales growth checker.
  - You want a sales forecast, a valuation or a view on the share price. It checks reported figures and gives no view.
you_give:
  - The new dated revenue release or restated comparison note (from the company's results page)
  - Annual and year-to-date revenue by business and currency, plus the matching figures a year ago
  - Details of businesses bought or sold in the periods, and any extra-week or calendar notes
  - The company's own line on how it defines organic or constant-currency growth
  - The gross billings, returns and rebates and the company's sales policy, if the way sales are shown changed
  - Your materiality threshold, reporting date, currency and scale
  - Your last accepted revenue model and its review log (optional on a first run)
  - The record from the last review, pasted in (optional on a first run)
you_get:
  - A revenue change log. Each change in period, currency, business or presentation shows its source, date and effect on growth.
  - A linked workbook of reported revenue and like-for-like revenue. Each adjustment is applied once, in a stated order.
  - A gross-to-net bridge, if the way sales are shown changed
  - A residual line for any difference nobody can explain, kept apart from acquisitions and currency
  - Reviewer questions for anything missing, plus MISSING lines, checks that could not run and a record for next time
how_to_use:
  - Download the pack and give it to an AI that can read files, such as Claude, ChatGPT or Gemini. For a workbook, pick one that can create spreadsheets. In plain chat it returns the same tables as text.
  - Say whether this is the first run. If not, paste the record from last time and attach the last accepted model. Then attach the new release and the company's growth definitions, and give your threshold, currency and scale.
  - Read "changed since last review" first. Check each restated figure, business change and calendar note against the page of the filing it came from.
  - Check that the like-for-like revenue bridges back to reported revenue, step by step. Each adjustment should appear once, and no period should mix a quarter with a year to date.
  - Check that every "organic" or "constant currency" label comes with the company's own definition. Then read any residual and decide if it needs a better source.
  - Answer the questions or leave them marked MISSING. Nothing is filed, sent or traded.
how_it_works:
  - title: Compares with the last review
    text: Reads the saved record if it belongs to this company, or sets a first baseline. Compares fiscal periods, businesses, currencies and definitions with the record. If nothing changed and no review is due, it says so and stops.
  - title: Builds trailing revenue
    text: Adds the last full year to the current year to date, and takes off the same period a year ago. It keeps every fiscal boundary and every restatement.
  - title: Removes currency effects
    text: Uses the same period and currency buckets and one stated exchange rate rule. It rebuilds revenue in comparable currency. It does not apply one currency percentage to everything.
  - title: Adjusts for businesses bought or sold
    text: Applies the documented acquisitions and sales to the same currency-adjusted period. The top and bottom of the growth sum cover the same businesses, and no currency effect is counted twice.
  - title: Removes extra weeks and rebuilds gross to net
    text: Takes out an extra week still inside the period, using the company's calendar notes. If the way sales are shown changed, it rebuilds the bridge from gross billings to reported revenue first.
  - title: Reconciles and saves the record
    text: Ties the final like-for-like revenue back to reported revenue, adjustment by adjustment. It writes a short record for next time and keeps the old one.
output_shape: |-
  REVIEW DATE <date>, <currency>, <scale>   LAST REVIEW <date or first run>

  CHANGED SINCE LAST REVIEW  <periods, restatements, businesses, currencies, presentation>
  TRAILING REVENUE           last year <n> + year to date <n> - prior year to date <n> = <n>
  CURRENCY                   rate rule <named>; revenue at comparable rates <n>; effect <n>
  BUSINESSES                 acquired <n>; sold <n>; like-for-like base <n>
  EXTRA WEEK                 <weeks removed and the source, or none>
  GROSS TO NET               gross <n> - returns <n> - rebates <n> - collected taxes <n> = <n> reported
  BRIDGE TO REPORTED         reported <n>; each adjustment once; comparable <n>; residual <n>
  GROWTH LABELS              <organic or constant currency, with the company's definition>
  CHANGE LOG                 <item | change | source and date | effect on growth>
  REVIEWER QUESTIONS         <one per gap>

  RECORD FOR NEXT REVIEW  fiscal boundaries, original and restated revenue, businesses,
                          currency rule, calendar adjustments, sales policy, source versions
  MISSING  <each gap, and the line it stops>
  CHECKS MISSED  <one line each, or none>
output_sample:
  input:
    - The new dated revenue release or restated comparison note
    - Annual and year-to-date revenue by business and currency, with the figures a year ago
    - Details of businesses bought or sold, and any extra-week or calendar notes
    - The company's own definitions of organic and constant-currency growth
    - Your materiality threshold, currency and scale
    - Your last accepted revenue model and its record (optional on a first run)
  prerequisites:
    - An AI that can read files. For a workbook, one that can create spreadsheets.
    - A named person who knows the company's filings and will check the result
  output:
    - name: Changed since last review
      contains: Each new period, restatement, business, currency or presentation change, with its filing page and date.
    - name: Trailing revenue
      contains: Last full year plus year to date less the same period a year ago, on one basis, keeping every fiscal boundary.
    - name: Currency, business and extra-week adjustments
      contains: Each adjustment applied once in a stated order, using the company's own rate rule and notes.
    - name: Gross-to-net bridge (only if presentation changed)
      contains: Gross billings less returns, rebates and collected taxes, tied to reported revenue.
    - name: Bridge to reported revenue
      contains: Comparable revenue stepped back to reported revenue, with any unexplained residual shown by itself.
    - name: Growth labels
      contains: Each "organic" or "constant currency" figure shown with the company's own definition.
    - name: Change log
      contains: "One row per change: the item, what changed, the source and date, and the effect on growth."
    - name: Reviewer questions
      contains: One question for each missing note, rate rule or restated figure.
    - name: Record for next review
      contains: Fiscal boundaries, original and restated revenue, businesses, currency rule and sales policy.
    - name: MISSING and CHECKS MISSED
      contains: Each gap and the line it stops. Each check that failed or could not run, or "none".
    - name: Workbook (if your AI can make one)
      contains: Reported and comparable revenue linked across the bridges, with a checks tab.
tweaks:
  - what: A different rate rule
    how: Name the rule, such as prior-year average rates. Revenue is rebuilt on that rule and the effect is shown.
  - what: A tighter threshold
    how: Set a lower threshold, such as 0.2 percentage points of growth. Smaller changes stay in the log but are not raised as questions.
  - what: No gross-to-net change
    how: Say the way sales are shown did not change. The bridge step is skipped with a reason.
  - what: A workbook
    how: Say you want a native spreadsheet. It builds one with inputs, formulas and a checks tab, and tells you what it could not verify.
judge:
  - All comparable revenue bridges reconstruct reported values, adjustments appear once and source-backed definitions accompany every organic or constant-currency label.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - No period mixes a quarter with a year to date, or two calendars. Any unexplained difference stays a residual, not an acquisition or a currency effect.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Keep each review's record in one folder, named by date, so the next run starts from the true prior state.
  - Keep one sheet with revenue by business and currency for each period, with the filing page for each row, and paste it in every time.
  - Paste the company's own definitions of organic and constant-currency growth once, and reuse them, so every label rests on a quoted source.
  - Pair it with the Gross-to-net revenue bridge when only the way sales are shown changed.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Builds a workbook with inputs and formulas you can click into, and can save the record file. In plain chat it returns the same tables as text.
    - name: The company's results page
      why: Gives the dated release, the segment tables and the growth definitions, each with a page you can cite.
  inputs:
    - Revenue by business and currency, not one group total, so each adjustment lands on the right figure.
    - The company's own notes on acquisitions, disposals and the calendar.
    - A named reviewer who knows the filings and will answer the questions it raises.
terms:
  - term: Trailing revenue
    meaning: Sales over the last twelve months, built from the last full year, the current year to date and the same period a year ago.
  - term: Organic growth
    meaning: Growth without the effect of businesses bought or sold, and usually without currency moves. Each company defines it, so read its definition.
  - term: Constant currency
    meaning: Sales restated at one set of exchange rates, so currency moves do not change the growth rate.
  - term: Gross to net
    meaning: The steps from the total billed to the revenue reported, after returns, rebates and taxes collected for others.
  - term: Residual
    meaning: A difference no source explains. It stays on its own line and is not given a label.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
