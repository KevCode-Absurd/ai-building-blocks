slug: job-application-evidence-review-assistant
name: Job application evidence review assistant
summary: "Tailor your resume and answers to a job using only what your record proves. See every claim it can't support, plus a submission checklist."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: job_description
    required: true
  - type: copy_draft
    required: true
  - type: document
    required: false
  - type: resume
    required: false
  - type: source_text
    required: true
outputs:
  - type: copy_draft
  - type: audit_report
  - type: resume
    required: true
uses:
  - tailor-a-job-application-to-real-evidence
  - proofreader
steps:
  - uses: tailor-a-job-application-to-real-evidence
    note: "Run when a new role is supplied or the draft changes. It matches the role to your real experience, makes the wording plain, and links every claim to a line in your record. It hands step 2 the tailored draft and its evidence notes."
  - uses: proofreader
    note: "Run for at most two passes on the tailored draft and evidence notes from step 1, which it takes as the text to proofread. It checks names, dates and the requested format, then lists what is still open. A claim with no proof comes out. Nothing is submitted."
schedule: For each new role or material application revision.
asks_before:
  - Sending or submitting any message or form
  - Changing a live account, calendar, task, permission or published document
  - Spending money, releasing a payment or signing a contract
  - Starting or changing any recurring schedule
