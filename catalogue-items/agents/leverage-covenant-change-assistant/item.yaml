slug: leverage-covenant-change-assistant
name: Leverage covenant change assistant
summary: Recheck a loan's net debt limit when earnings, cash or debt change. Get covenant EBITDA, headroom and a cure test. Not proof of compliance.
category: agent
type: agent
role: orchestrate
job: ops
level: advanced
inputs:
  - type: document
    required: true
  - type: spreadsheet
    required: false
outputs: []
needs_mode: manual
uses:
  - review-leverage-headroom-and-cure
  - debt-cash-sweep-checker
steps:
  - uses: review-leverage-headroom-and-cure
    note: Run this when a new covenant certificate, supported add-back, eligible cash balance, cure payment or prepayment record arrives. Rebuild covenant EBITDA, net debt and headroom for the test date, and run the cure only if headroom is negative. It hands step 2 the verified debt and cash figures.
  - uses: debt-cash-sweep-checker
    note: Run this only when a sweep is proposed or paid. A proposed sweep gives a scenario and leaves the actual debt unchanged. A paid sweep updates only the dated debt and cash, and leverage is run again. Scenario cash is never proof the covenant was met.
