new_slug: locked-box-recovery-review-assistant
name: Locked-box recovery review assistant
headline: Locked-box recovery review assistant
summary: Review supplied changes, preserve the last evidence baseline and return only affected calculations and unresolved approval questions.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A fixed-price adjustment bridge showing leakage and ticking compensation separately. Include changed inputs, source versions, branch reasons and checks still blocked. Share signed locked-box price, dated transfer ledger, permitted items, repayment evidence, daily ticking clause and counsel-confirmed eligible days. Include a dedicated leakage escrow agreement, account records and approved reserve evidence only if that collateral exists. Supply the previous approved review and actual changed source files with dates.
explain: |-
  A fixed-price adjustment bridge showing leakage and ticking compensation separately. Include changed inputs, source versions, branch reasons and checks still blocked.

  Acquisition closing. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need a fixed-price adjustment bridge showing leakage and ticking compensation separately. Include changed inputs, source versions, branch reasons and checks still blocked.
  - You work on acquisition closing and need traceable calculations.
  - New evidence needs comparison with the prior dated review.
you_give:
  - Signed locked-box price, dated transfer ledger, permitted items, repayment evidence, daily ticking clause and counsel-confirmed eligible days. Include a dedicated leakage escrow agreement, account records and approved reserve evidence only if that collateral exists. Supply the previous approved review and actual changed source files with dates.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A fixed-price adjustment bridge showing leakage and ticking compensation separately. Include changed inputs, source versions, branch reasons and checks still blocked.
  - Original step files, financial assumptions, source coverage and a governing handoff summary.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Reconcile a locked-box closing price
    text: Run the governing workflow when A new seller-benefit transfer, permitted-item consent, verified repayment or ticking-day confirmation is supplied.
  - title: Escrow release checker
    text: If unrecovered leakage has a specific approved escrow reserve, reconcile only that account and claim ledger before proposing a release or collateral shortfall. If no dedicated escrow or authority is evidenced, return a question and never divert an unrelated earnout or indemnity account.
output_shape: |-
  A fixed-price adjustment bridge showing leakage and ticking compensation separately. Include changed inputs, source versions, branch reasons and checks still blocked.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Recoveries and ticking amounts are sourced once; the actual agreement determines whether the daily amount applies to original or adjusted price. Never overwrite an accepted baseline with an unapproved scenario; record which branch ran or was skipped.
judge:
  - Recoveries and ticking amounts are sourced once; the actual agreement determines whether the daily amount applies to original or adjusted price. Never overwrite an accepted baseline with an unapproved scenario; record which branch ran or was skipped.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
