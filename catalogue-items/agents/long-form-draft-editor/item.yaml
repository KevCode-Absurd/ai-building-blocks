slug: long-form-draft-editor
name: "Long-form draft editor"
summary: "Give it a finished draft. Get it checked, edited and checked again until it passes, with every change logged."
category: agent
type: agent
role: orchestrate
job: creative
level: advanced
inputs:
  - {type: copy_draft, required: true}
  - {type: brief, required: false}
  - {type: feedback_notes, required: false}
outputs:
  - {type: copy_draft}
  - {type: audit_report}
  - {type: feedback_notes}
uses: [reader-feedback-sorter, cold-reread-marker, story-rules-checker, hidden-theme-finder, pre-publish-content-checker, ten-percent-cutter, scene-want-and-tactic-rewriter, show-dont-tell-scene-rewriter, dialogue-ear-checker, plain-english-editor, first-reader-question-writer]
steps:
  - {uses: reader-feedback-sorter, note: "Only when readers' notes are on file: a ranked rewrite list that sets what this round fixes first."}
  - {uses: cold-reread-marker, note: "Only for a story or narrative piece: pages to change, big holes and a score out of 100. Run at the start and after each round."}
  - {uses: story-rules-checker, note: "Only for a story: pass or fail on 18 plain rules and a score out of 100. Run at the start and after each round."}
  - {uses: hidden-theme-finder, note: "Once, only for a story: what the draft is really about, so cuts and fixes serve it."}
  - {uses: pre-publish-content-checker, note: "Only for an article, guide or post: brief, voice, facts, structure and AI-sound checks. Run at the start and after each round."}
  - {uses: ten-percent-cutter, note: "Round 1 only, and only if the draft is puffy: cuts to 90% of its length with a log. Never run again."}
  - {uses: scene-want-and-tactic-rewriter, note: "Only when scenes just explain: rebuilds them so each person wants something."}
  - {uses: show-dont-tell-scene-rewriter, note: "Only when passages name the feeling: rewrites them so things carry it."}
  - {uses: dialogue-ear-checker, note: "Only when talk is flagged: tests each line of dialogue and fixes the worst."}
  - {uses: plain-english-editor, note: "Final round: plain words in place of stiff or padded ones, on the changed parts."}
  - {uses: first-reader-question-writer, note: "Once, when the draft passes: a question sheet to send to first readers."}
asks_before: [overwriting the original draft, changing the plot, who does what, a fact, a quote or a name, cutting a whole scene or section, changing the writer's voice, sending or publishing the draft]
origin: own
version: 1.0.0
example_pending: true
