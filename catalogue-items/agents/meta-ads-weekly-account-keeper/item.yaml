slug: meta-ads-weekly-account-keeper
name: "Meta Ads weekly account keeper"
summary: "Give it your weekly Meta Ads exports. Get a true-return check, a scale-or-hold call and a change list to approve."
category: agent
type: agent
role: orchestrate
job: ads
level: intermediate
inputs:
  - { type: performance_sheet, required: true }
  - { type: product_data, required: true }
  - { type: brand_brain, required: false }
outputs:
  - { type: audit_report }
  - { type: plan }
uses: [ break-even-roas-and-cpa-calculator, ad-sales-drop-analyst, meta-delivery-troubleshooter, platform-roas-reality-check, meta-campaign-purpose-checker, creative-test-reader, meta-scaling-campaign-planner ]
steps:
  - { uses: break-even-roas-and-cpa-calculator, note: "Once, then reused: the break-even ROAS and CPA every later call is measured against. Hands every later step the break-even ROAS and CPA." }
  - { uses: ad-sales-drop-analyst, note: "Only when sales fell or cost per sale rose sharply against last week: which link broke, before any other change. Uses your two weekly exports and step 1's break-even as the bar. Hands step 3 the link that moved." }
  - { uses: meta-delivery-troubleshooter, note: "Only when the drop analysis points at reach, frequency or cost per 1,000 views: the failing delivery step and one change. Uses step 2's finding on which link moved. Adds its one change to the change list." }
  - { uses: platform-roas-reality-check, note: "On the first run, then every fourth week, or sooner when Meta's ROAS and your own new-customer numbers move apart: how far to trust Meta's number. Uses your store totals and step 1's break-even, not step 3's output. Hands steps 5 and 7 the trust level." }
  - { uses: meta-campaign-purpose-checker, note: "On the first run, then monthly or when a campaign was added: keep, merge or cut each campaign and fix setup errors. Uses your campaign list and, if step 4 ran, its audience split. Adds its calls to the change list." }
  - { uses: creative-test-reader, note: "Every week a creative test ran: keep, leave or replace calls by ad set, and the next brief. Uses your ad results and step 1's break-even as the target. Hands step 7 the winning ad sets." }
  - { uses: meta-scaling-campaign-planner, note: "Only when nothing is broken and the trust check is not low: the spend ladder and a raise-or-hold call. Uses step 1's break-even, step 4's trust level and step 6's winning ad sets." }
schedule: "Every Monday morning, after last week's data is in"
asks_before: [ changing budgets or bids, pausing or turning on campaigns, ad sets or ads, adding or removing audiences or exclusions, launching new ads, changing the attribution setting ]
origin: own
version: 1.0.1
example_pending: true
