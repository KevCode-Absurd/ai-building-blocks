slug: monthly-belief-evidence-keeper
name: "Monthly belief and evidence keeper"
summary: "Give it the beliefs your plan rests on. Each month get the evidence for and against, and what to test next."
category: agent
type: agent
role: orchestrate
job: research
level: intermediate
inputs:
  - {type: question, required: true}
  - {type: lessons_register, required: false}
  - {type: voc_reviews, required: false}
  - {type: idea, required: true}
outputs:
  - {type: lessons_register}
  - {type: audit_report}
  - {type: plan}
uses: [prediction-and-bet-planner, contrary-evidence-log-keeper, idea-evidence-review, real-knowledge-tester, learn-borrow-or-pass-planner]
steps:
  - {uses: prediction-and-bet-planner, note: "Once per belief, when it is added: what it predicts, what would prove it wrong, a small bet and a date to check. Hands step 2 the belief with its prediction and what would prove it wrong."}
  - {uses: contrary-evidence-log-keeper, note: "Every month: every fact against each belief logged at once, plus the facts for it, so nothing against slips from memory. Uses step 1's prediction as the belief to test. Hands step 3 the dated evidence log."}
  - {uses: idea-evidence-review, note: "Every month, for each belief with new evidence: a keep going, change or stop call and the next thing to learn. Uses step 1's prediction and step 2's log. Hands step 4 the call on each belief."}
  - {uses: real-knowledge-tester, note: "Only when a belief has had no evidence either way for three months: the hardest follow-up questions, which you can answer, and which you cannot. Uses step 3's call on the belief. Hands step 5 the gaps it found."}
  - {uses: learn-borrow-or-pass-planner, note: "Only when the knowledge test shows a gap: learn it, borrow help, start small or pass, with a first-week plan. Uses the gaps from step 4."}
schedule: "Run by hand on the first Friday of each month, and the day any belief reaches its check date. Nothing starts on a timer unless you connect a scheduler."
asks_before: [changing the plan or strategy, dropping a belief from the list, spending money or time on a bet, telling the team a belief has changed, contacting customers for evidence]
minds: [charles-darwin]
origin: own
version: 1.0.0
example_pending: true
