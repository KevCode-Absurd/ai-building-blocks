slug: monthly-competitor-watcher
name: "Monthly competitor watcher"
summary: "Give it this month's rival ads and pages. Get what changed since last month and the one or two moves worth answering."
category: agent
type: agent
role: orchestrate
job: research
level: intermediate
inputs:
  - {type: reference_set, required: true}
  - {type: competitor_set, required: true}
  - {type: brand_brain, required: false}
  - {type: voc_reviews, required: false}
outputs:
  - {type: audit_report}
  - {type: competitor_set}
uses: [ad-library-teardown-counter, competitor-messaging-comparer, competitor-ad-gap-finder, owned-word-mapper, disruption-risk-checker]
steps:
  - {uses: ad-library-teardown-counter, note: "Every month, per rival: counts by format, age and awareness stage, set against last month's counts."}
  - {uses: competitor-messaging-comparer, note: "Only for rivals whose ads or pages changed past the agent's bar: how their message and position moved."}
  - {uses: competitor-ad-gap-finder, note: "Only when a rival's mix of ad types or claims shifted sharply: where rivals now crowd in and where nobody is."}
  - {uses: owned-word-mapper, note: "Only every third month, or when a rival's headline word changed: which words are taken, contested or open."}
  - {uses: disruption-risk-checker, note: "Only when a new, cheaper or simpler rival appears: whether it is a nuisance or a real threat."}
schedule: "On the first Friday of each month, after the rival ads are collected"
asks_before: [changing your prices, offers or ads, contacting or buying from a rival, running or pausing any ad, publishing a comparison naming a rival]
origin: own
version: 1.0.0
example_pending: true
