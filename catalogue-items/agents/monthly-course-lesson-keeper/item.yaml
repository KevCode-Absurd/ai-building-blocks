slug: monthly-course-lesson-keeper
name: "Monthly course lesson keeper"
summary: "Give it your course lessons each month. Get stale or hard-to-follow lessons found, each fixed with an example, opener and quiz."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: document, required: true}
  - {type: feedback_notes, required: false}
  - {type: codebase, required: false}
outputs:
  - {type: audit_report}
  - {type: document}
  - {type: plan}
uses: [documentation-checker, accessible-lesson-auditor, small-working-example-explainer, lesson-opener-planner, recall-quiz-writer]
steps:
  - {uses: documentation-checker, note: "Every month, for lessons that teach a tool, product or process: claims that are now false, drift from how the thing works today, and weak spots."}
  - {uses: accessible-lesson-auditor, note: "Every month, for the lessons learners complained about or that are due for review: a check against Universal Design for Learning, fixes ranked by impact."}
  - {uses: small-working-example-explainer, note: "Only for a lesson where learners keep asking the same how question: the smallest example that shows the mechanism, with traced values."}
  - {uses: lesson-opener-planner, note: "Only for a lesson being rewritten: a five-minute opener that brings back what learners already know."}
  - {uses: recall-quiz-writer, note: "Only for a lesson being rewritten, or one with no quiz: a low-stakes recall quiz at three levels, with answers."}
schedule: "On the first Monday of each month, after last month's learner questions are collected"
asks_before: [publishing or replacing any lesson, emailing learners, changing the course outline or order, removing a lesson, changing a price or an access rule, replying to a learner]
minds: [andrej-karpathy]
origin: own
version: 1.0.0
example_pending: true
