slug: monthly-customer-voice-keeper
name: "Monthly customer voice keeper"
summary: "Give it this month's new reviews. Get new buyer words, new doubts and wrong-fit buyers, as changes to your brand file to approve."
category: agent
type: agent
role: orchestrate
job: research
level: intermediate
inputs:
  - {type: voc_reviews, required: true}
  - {type: brand_brain, required: true}
  - {type: persona, required: false}
outputs:
  - {type: audit_report}
  - {type: brand_brain}
uses: [customer-buying-reasons-finder, wrong-buyer-review-checker, buyer-identity-segment-finder, trust-barrier-fixer]
steps:
  - {uses: customer-buying-reasons-finder, note: "Every month, on the new batch only: the reasons people bought, in their exact words, each with a source ID."}
  - {uses: wrong-buyer-review-checker, note: "Only when low reviews rose or at least five came in: which ones are wrong-job buyers, plus not-for lines."}
  - {uses: buyer-identity-segment-finder, note: "Only every third month, or when the batch holds at least 50 reviews: whether a new kind of buyer is showing up."}
  - {uses: trust-barrier-fixer, note: "Only when a new doubt passes the bar: the proof that settles it, checked against your current page or ad message."}
schedule: "On the first working day of each month, after last month's reviews are in"
asks_before: [changing your brand file, changing live page, ad or email copy, replying to or contacting customers, adding a not-for line to a live page]
origin: own
version: 1.0.0
example_pending: true
