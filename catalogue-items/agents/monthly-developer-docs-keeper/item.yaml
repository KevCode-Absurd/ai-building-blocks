slug: monthly-developer-docs-keeper
name: Monthly developer docs keeper
summary: Share your docs and recent changes. Get stale pages fixed, broken steps
  flagged and a clearer start guide.
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: codebase
    required: true
  - type: document
    required: false
outputs:
  - type: audit_report
  - type: test_report
  - type: document
uses:
  - readme-first-run-tester
  - documentation-checker
  - changelog-entry-writer
  - code-documentation-writer
  - api-spec-writer
  - project-glossary-writer
steps:
  - uses: readme-first-run-tester
    note: "Every month: each README step tried in order and marked working or broken, with proof and the edit that fixes it. Passes on the broken steps, which top the hand-back."
  - uses: documentation-checker
    note: "Every month, for every doc that describes code changed since last time: false claims, drift from the code and weak spots. Uses each doc and the code it describes, not step 1's test. Passes on the false claims with file and line."
  - uses: changelog-entry-writer
    note: "Every month: the month's commits or pull requests grouped into added, changed and fixed, as a draft entry. Uses the month's git history, not the doc check. Passes on the draft entry."
  - uses: code-documentation-writer
    note: "Only for a module changed this month whose docstrings or usage guide no longer match: the rewrite, as a proposal. Uses the changed module and its current docs, not the changelog. Passes on the rewritten docs for your approval."
  - uses: api-spec-writer
    note: "Only when a public endpoint was added, changed or removed this month: the OpenAPI spec updated to match the code. Uses the endpoint code, the current spec and a short brief of what the API does, not step 4's docs. Passes on the updated spec."
  - uses: project-glossary-writer
    note: "Only when a new term appears in the month's code or docs, or a term is used two ways: the glossary entry and the decision record. Uses the terms you found in the code and docs, not the spec. Passes on the entry and the record."
schedule: On the first Tuesday of each month, after the month's releases are tagged
asks_before:
  - committing or merging any change
  - publishing docs or a changelog
  - deleting or renaming a doc
  - changing the public API or its spec
  - tagging a release
  - sending anything to users
origin: own
version: 1.0.0
example_pending: true
