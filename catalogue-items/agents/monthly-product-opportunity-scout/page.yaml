new_slug: monthly-product-opportunity-scout
name: Product candidate test planner
summary: Find your next product to sell each month. Give it your market, costs and ad captures. Get one capped test plan, or a plain no pick.
job: find-products
thinking: high
thinking_why: It runs up to eight skills, drops or keeps each candidate on the results and carries a pipeline from month to month. Give it your strongest model.
headline: Product candidate test planner
subhead: Give it your market, your costs and the ad or sales captures you saved. Each month it re-checks last month's candidates, scores the new ones and checks rivals on the few that pass. You get one product to test with a spending cap and a stop rule, or a plain "no pick this month".
explain: |
  Finding a product to sell is a monthly habit, not one search. A product that looked open in March can be full of rivals by April. A product with a good score can sit in a category that is about to fade. Most owners check once, fall for a good-looking idea and order stock before they see the field has changed.

  This product candidate planner keeps a running list in a file called scout/pipeline.md. Each month it re-checks every product on watch for new rivals and drops the ones that got crowded. It scores new finds on price, cost and fit. Only the few that pass get the deeper checks on rivals, untapped buyer groups and trend risk.

  At the end you get at most one pick, with a spending cap and a stop rule. If nothing earns a pick, it says so. It reads only the captures you give it, and it never browses, orders stock or contacts a supplier.
when:
  - You want a steady way to find your next product to sell, not a one-off hunch.
  - You have a list of product ideas and want to know which are worth a small test.
  - A product on your watch list may have filled up with rivals and you want to know before you order.
  - You saved ad library captures or sales rankings and want them turned into a pick and a plan.
not_for:
  - You have already chosen the product. Use the New product line checker to judge it and plan the test.
  - You have one idea and want a quick yes or no on price and margin. Use the Product idea viability scorer.
  - You have no captures and no cost figures. It cannot browse, so it has nothing to read. Collect the ads and rankings first.
  - You sell on Amazon. Use the Amazon product viability scorer for that marketplace.
you_give:
  - Your market and who buys, in a short paragraph
  - Screenshots from the Meta Ad Library, sales rankings or product graphs for your market (the first month, then fresh ones each month)
  - Your expected landed cost per unit (product plus shipping to the customer), your target price and the most you can lose on a test
  - Last month's scout/pipeline.md, if you ran it before (a pasted copy works in a chat)
  - Customer reviews of the category (optional)
  - A list of what you already sell (optional)
you_get:
  - One pick with its score out of 100, its rival check, its category call and why it beat the rest, or a clear "no pick this month"
  - A test plan with a spending cap, a pass result and a kill rule
  - A watch list showing what would move each product
  - A list of dropped products with one reason each
  - What to bring next month
how_to_use:
  - Add the agent to your AI. In Claude Code, save it in .claude/agents or add it as a skill. In Claude, ChatGPT or Gemini, paste it at the start of a chat. It saves a scout folder, so Claude Code is easiest; in a plain chat, paste last month's pipeline and save the new one yourself.
  - Save your evidence first. Capture ads for each product from the Meta Ad Library, and screenshot a sales ranking or product graph. The agent cannot browse the web.
  - Type your market, buyers, landed cost, target price and the most you can lose on one test. Mark any cost you are unsure of as a guess.
  - Read the pick. Check that every score shows its sums, and that each dropped or watched product has a reason.
  - Decide on the test yourself. The agent never orders, lists a product or spends money. When you run the test, add the result to the pipeline.
  - Next month, run it again with fresh captures and last month's pipeline. Take the pick to the New product line checker for a full launch check.
output_sample:
  input:
    - Your market and who buys, in a short paragraph
    - Ad library captures or sales rankings for your market
    - Your landed cost per unit, target price and the most you can lose on a test
    - Last month's scout/pipeline.md (optional)
    - Customer reviews of the category (optional)
  prerequisites:
    - An AI that can read images and, ideally, save files, such as Claude Code
    - Ad and sales screenshots you saved yourself, because the agent cannot browse
  output:
    - name: This month's pick
      contains: One product with its score, field call, category call, launch call and why it beat the rest, or no pick.
    - name: Test plan
      contains: The cheapest test, the spending cap, the pass result and the kill rule.
    - name: Watch list
      contains: Products kept on watch, with what would move each one.
    - name: Dropped this month
      contains: Each dropped product with a one-line reason.
    - name: Needs from you
      contains: Costs or evidence still missing so next month can score them.
    - name: scout/pipeline.md
      contains: One row per candidate with score, field verdict, status and the reason for the last change.
how_it_works:
  - title: Read the pipeline
    text: Opens last month's list of candidates and finds the ones on watch.
  - title: Re-check the old ones
    text: Checks each watched product for new rivals. A product that fell to skip is dropped with the reason.
  - title: Find and score new ones
    text: Reads your evidence for proven products and weak-rated gaps, then scores each new candidate that has a cost and a price.
  - title: Check the field
    text: Candidates that pass the score get a rival check. Crowded ones only stay if a buyer group nobody targets turns up.
  - title: Check the category
    text: For top candidates in a category you do not sell in yet, checks market size and trend risk.
  - title: Plan one test
    text: Picks the single best one and plans a capped test with a kill rule. If it fails the check, there is no pick this month.
output_shape: |-
  THIS MONTH'S PICK
    <product> | score <n>/100 | field: <GO | TEST FAST> | category: <GO | HOLD | not checked> | launch: <GO | TEST FIRST> | why it beat the rest
    Or: NO PICK THIS MONTH, because <weakest point>

  TEST PLAN
    1 <cheapest test> | cap <amount> | pass: <result>
    KILL RULE: <rule>

  WATCH LIST
    <product> | <what would move it>

  DROPPED THIS MONTH
    <product> | <one-line reason>

  NEEDS FROM YOU
    <costs or evidence missing>

  FILES AND MISSING
    <each step's file> | scout/pipeline.md | MISSING: <every line>
tweaks:
  - what: Costs for every candidate
    how: A candidate with no landed cost can't be scored. Give a rough cost and mark it as a guess.
  - what: How much you can risk
    how: Tell it the most you can lose on a test. The test plan is capped by it.
  - what: Fresh evidence each month
    how: New ad library or product-graph captures each month are what drive the re-checks. Old captures give old answers.
  - what: How long a watched product waits
    how: Three months with no change is the default before a drop. Set your own if your market moves slower or faster.
judge:
  - Every score came from the scoring skill, with the sums shown.
  - No candidate was scored without a cost and a price.
  - There is at most one pick, and none when the final check said no-go.
  - Every drop and every watch has a reason.
  - Nothing was ordered, sent, listed or spent.
test:
  - Run it on a product you already know failed. See if it would have been dropped or flagged.
  - Run it twice on the same evidence. The pick and the drops should be the same, apart from wording.
  - Give it a product you sell well. See whether it scores it high and says why.
improve:
  - Set your own cap on how many candidates are scored each month.
  - Add the products you tried before and what happened, so the scout learns your limits.
  - If you only sell in one category, remove the category check so the run is shorter.
  - Add the test results to the pipeline after each test, so scores can be compared with what happened.
works_best_with:
  tools:
    - name: Claude Code
      why: It can keep the scout folder and pipeline, read last month's files and run every step on a schedule.
    - name: Meta Ad Library
      why: Capture the ads for each candidate here, so the rival check has real counts.
  inputs:
    - Screenshots of product graphs or sales rankings for your market
    - Results of any earlier product tests you ran
