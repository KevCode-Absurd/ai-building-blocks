slug: monthly-returns-and-refunds-reviewer
name: "Monthly returns and refunds reviewer"
summary: "Run it monthly. Get the products driving refunds, why, what returns cost and the one fix to make first."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: tool_connection, required: true}
  - {type: product_data, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
uses: [refund-rate-analyzer, return-reason-finder, exchange-or-refund-split-reader, refund-speed-checker, return-cost-calculator, repeat-partial-refund-spotter]
steps:
  - {uses: refund-rate-analyzer, note: "Every month: refund rate by product for the last 30 days, set against last month's saved rates."}
  - {uses: return-reason-finder, note: "Every month: return reasons counted by product, so quality and misleading listings can be told apart."}
  - {uses: exchange-or-refund-split-reader, note: "Every month: how many returns became exchanges, store credit or refunds, against the month before."}
  - {uses: refund-speed-checker, note: "Every month: days from return request to refund, and the returns that ran late."}
  - {uses: return-cost-calculator, note: "Only when a product's refund rate is far above the store's, or one reason dominates: the true cost over 90 days."}
  - {uses: repeat-partial-refund-spotter, note: "Every month: orders with several partial refunds, which can point to fraud or a staff habit."}
schedule: "On the 3rd of each month, once last month's returns are closed"
asks_before: [refunding or cancelling any order, tagging a customer, pausing or changing a product listing, contacting a supplier or a customer]
origin: own
version: 1.0.0
example_pending: true
