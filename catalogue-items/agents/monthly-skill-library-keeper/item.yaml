slug: monthly-skill-library-keeper
name: "Monthly skill library keeper"
summary: "Point it at your skills folder each month. Get weak, clashing and unsafe skills found, and gaps worth a new skill."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - { type: skill_files, required: true }
  - { type: transcript, required: false }
outputs:
  - { type: audit_report }
  - { type: plan }
uses: [ skill-trigger-auditor, skill-file-validator, skill-safety-checker, skill-quality-tester, skill-portability-checker, project-skill-finder, repeated-work-skill-finder ]
steps:
  - { uses: skill-trigger-auditor, note: "Every month: when each skill fires, and which skills block or copy each other. Uses your whole skills folder. Hands the list of skills that fire badly or clash on to the test choice." }
  - { uses: skill-file-validator, note: "Every month, on each skill added or changed since last month: structure, wording and naming problems. Uses those skill files, not step 1's grades. Hands the problem list to the final fix list." }
  - { uses: skill-safety-checker, note: "Only on skills selected for a test: those that are new or changed, came from outside, are of unknown origin, or have new scripts since last month: risky code, data leaks and hidden commands. Runs before any test and never runs the skill's code. Hands a do-not-run list to the test and portability steps. It does not use step 2's problem list; it runs before any test." }
  - { uses: skill-quality-tester, note: "Only on skills that are new, changed or flagged by the trigger audit, and that passed step 3: structure, scripts run and a score. Uses those skill files, minus any marked do not run. Hands the scores to the fix list." }
  - { uses: skill-portability-checker, note: "Only when the skills are used in more than one AI tool, and only on skills that passed step 3: mistakes that stop them loading elsewhere. Uses the same skill files. Hands the fixes to the fix list. It does not use step 4's scores; the two run side by side." }
  - { uses: project-skill-finder, note: "Only when nothing unsafe was found, and you gave a project: skills worth adding or updating. Uses your own project folder, not step 5's portability fixes. Hands the skill ideas to the fix list." }
  - { uses: repeated-work-skill-finder, note: "Only when nothing unsafe was found, and you gave screen or session history: tasks you repeat that could become skills. Uses your history, not step 6's list. Hands draft skills to add to next month's folder." }
schedule: "Run by hand on the first Monday of each month. Nothing starts on a timer unless you connect a scheduler."
asks_before: [ editing, deleting or renaming any skill, installing a skill from outside, running a script that came with a skill, sharing or publishing a skill ]
origin: own
version: 1.0.1
example_pending: true
