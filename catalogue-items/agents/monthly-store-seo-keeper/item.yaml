slug: monthly-store-seo-keeper
name: "Monthly store SEO keeper"
summary: "Give it your monthly Search Console numbers. Get a search report, the pages to push and a short fix list to approve."
category: agent
type: agent
role: orchestrate
job: analysis
level: intermediate
inputs:
  - {type: performance_sheet, required: true}
  - {type: product_data, required: false}
  - {type: store_capture, required: false}
  - {type: brand_brain, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
uses: [monthly-store-seo-planner, organic-search-report-builder, fix-a-drop-in-search-traffic-and-check-it-recovers, search-console-traffic-drop-diagnoser, search-console-quick-win-finder, store-seo-fix-prioritiser, product-page-seo-builder]
steps:
  - {uses: monthly-store-seo-planner, note: "Once, then again only if your monthly hours change: the four-job monthly cycle and how many hours each gets."}
  - {uses: organic-search-report-builder, note: "Every month: non-branded clicks against the last period, so the path is chosen on data."}
  - {uses: fix-a-drop-in-search-traffic-and-check-it-recovers, note: "Only when non-branded clicks fell sharply and you can share your theme files: the cause, the fix order and proof the clicks return."}
  - {uses: search-console-traffic-drop-diagnoser, note: "Only when clicks fell sharply and you have no theme files to share: the pages that lost clicks and the likely cause."}
  - {uses: search-console-quick-win-finder, note: "Only when nothing is broken: the pages to push this month, capped at five."}
  - {uses: store-seo-fix-prioritiser, note: "Only when you add a crawl or indexing report: the fixes that matter and the ones to ignore."}
  - {uses: product-page-seo-builder, note: "Only for product pages the quick-win finder marks as needing new copy, up to three a month."}
schedule: "On the second working day of each month, once last month's Search Console data is final"
asks_before: [publishing page, title or description changes, editing theme files, changing redirects, robots.txt or noindex settings, ordering links or paid content]
origin: own
version: 1.0.0
example_pending: true
