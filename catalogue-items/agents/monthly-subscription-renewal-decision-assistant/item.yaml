steps:
  - uses: find-duplicate-and-unused-business-subscriptions
    note: "Run when a renewal enters your decision window, a quote changes or usage changes a lot. Finds duplicate or unused candidates and sets out the savings options. Uses your bills, usage evidence and last register. Hands the register to step 2, marking each subscription that still lacks notice terms or usage evidence."
  - uses: vendor-agreement-status-checker
    note: "Run when notice terms or usage are missing for a renewing subscription. Check the contract and write an evidence request before any advice to cancel. Takes the vendor name of each subscription step 1 marked as missing terms, plus any contract you supply, not the savings options. Hands the dates and the evidence request to the renewal brief."
schedule: Monthly, or when a dated renewal notice arrives; configure a schedule separately if requested.
