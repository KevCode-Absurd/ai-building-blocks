slug: new-screen-design-reviewer
name: "New screen design reviewer"
summary: "Point it at each new screen. Get a ready, fix-first or rethink call and a ranked fix list."
category: agent
type: agent
role: orchestrate
job: design
level: intermediate
inputs:
  - {type: question, required: true}
  - {type: design_file, required: false}
  - {type: web_page, required: false}
  - {type: codebase, required: false}
  - {type: design_direction, required: false}
outputs:
  - {type: audit_report}
  - {type: feedback_notes}
uses: [design-rules-file-writer, usability-heuristic-reviewer, design-feedback-giver, page-design-standards-checker, ai-look-design-reviewer, colour-contrast-checker, visual-hierarchy-fixer]
steps:
  - {uses: design-rules-file-writer, note: "Once, if you have the code and no rules file: writes the colours, type, spacing and parts your product really uses. Every review is measured against it. Uses your code. Hands the rules file to the colour check and the final measure."}
  - {uses: usability-heuristic-reviewer, note: "Every screen: walks it as a newcomer against ten usability rules and scores it out of 100. Uses the screen and its task, not step 1's rules. Hands its score and breaks to the call."}
  - {uses: design-feedback-giver, note: "Only when the screen is a mockup or a design file: feedback on usability, hierarchy and consistency. Uses the mockup or Figma link. Runs instead of step 4 or 5 for this kind of screen."}
  - {uses: page-design-standards-checker, note: "Only when the screen is a live or built page: checks contrast, spacing, hierarchy and mobile. Uses the page address or saved HTML. Hands its findings to the call."}
  - {uses: ai-look-design-reviewer, note: "Only when you give the screen's code: a score for how generic or AI-made it looks, with the fixes that gain most. Uses the screen's code, whether or not the page is live. Hands its score and fixes to the call."}
  - {uses: colour-contrast-checker, note: "Only when the screen adds or changes a colour: checks light and dark pairs against WCAG 2.2. Uses the colours in step 1's rules plus the new ones. Hands any failing pair to the call."}
  - {uses: visual-hierarchy-fixer, note: "Only when a review flags weak hierarchy, spacing or type: fixes for what the eye sees first. Uses the screen, guided by the problems steps 2 to 5 found. Hands the fixes to the hand-back."}
schedule: "Each time a new or changed screen is ready for review"
asks_before: [changing the design file or the code, commenting in the team's design tool, adding or changing a line in your design rules, marking a screen approved for release]
origin: own
version: 1.0.0
example_pending: true
