slug: offer-refresh-keeper
name: "Offer refresh keeper"
summary: "Give it your offers and their numbers each quarter. It finds the profit winner, tests what is weak, and plans one change."
category: agent
type: agent
role: orchestrate
job: offer
level: advanced
inputs:
  - {type: offer, required: true}
  - {type: product_data, required: true}
  - {type: performance_sheet, required: true}
  - {type: voc_reviews, required: false}
  - {type: competitor_set, required: false}
outputs:
  - {type: plan}
  - {type: audit_report}
uses: [store-offer-picker, offer-profit-per-session-checker, order-threshold-planner, discount-impact-checker, offer-checklist-reviewer, commodity-trap-checker, honest-urgency-planner, offer-test-planner]
steps:
  - {uses: store-offer-picker, note: "First run, and when the product mix or margins change: the offer types worth testing, with the maths."}
  - {uses: offer-profit-per-session-checker, note: "Every run: profit per session for each live offer, the winner, and whether it is safe to act on the comparison."}
  - {uses: order-threshold-planner, note: "Only when order sizes have moved since the last run, or a free-shipping or bundle line sits at the average: thresholds set at the real order peaks."}
  - {uses: discount-impact-checker, note: "Only when a sale or code is planned, or the profit check shows a discounted offer losing profit: the ROAS needed to keep profit per order."}
  - {uses: commodity-trap-checker, note: "Only when profit per session is falling while discounts rise, or buyers compare on price: how much of the offer a buyer can tell apart from rivals."}
  - {uses: offer-checklist-reviewer, note: "Only when the lead offer is not the profit winner, or has not changed in two quarters: a review against a tested checklist and the three changes most worth making."}
  - {uses: honest-urgency-planner, note: "Only when a deadline or limit is planned: real caps and dates, and the lines to say them truthfully."}
  - {uses: offer-test-planner, note: "Whenever one change is proposed: the funnel test, the tags to track and the read-out rule."}
schedule: "First week of every quarter, and before any planned sale"
asks_before: [changing a price, discount or guarantee, publishing or switching an offer on the live store, creating discount codes, sending an offer to customers, announcing a deadline or limit]
origin: own
version: 1.0.0
example_pending: true
