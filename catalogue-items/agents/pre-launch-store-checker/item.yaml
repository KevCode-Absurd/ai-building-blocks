slug: pre-launch-store-checker
name: "Pre-launch store checker"
summary: "Tell it your store setup. It checks go-live, re-checks after each fix, and stops at a clear go or a no-go."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: question, required: true}
  - {type: product_data, required: false}
  - {type: store_capture, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
uses: [store-go-live-checker, payments-and-checkout-settings-checker, shipping-rate-planner, store-tax-setup-planner, store-security-checkup]
steps:
  - {uses: store-go-live-checker, note: "Every round: the blockers, warnings, score and test orders. Hands steps 2 to 5 the blockers it found, so each of them runs only when its area is a blocker. This is the check the loop runs until it says GO."}
  - {uses: payments-and-checkout-settings-checker, note: "Round one, and again only if a payment or checkout item is a blocker: reads the payment and checkout blockers in step 1's report, plus your own settings. Hands back payout verification, capture, consent boxes and checkout fields to fix."}
  - {uses: shipping-rate-planner, note: "Only when the go-live check shows a shipping or rates blocker: reads that blocker, plus your parcels and costs. Hands step 4 the zones, rates and free-shipping line, which are the places you ship to."}
  - {uses: store-tax-setup-planner, note: "Only when the go-live check shows a tax blocker: reads that blocker, and the shipping zones from step 3 as the list of places you ship to. Hands back tax settings, rate rows and a test plan."}
  - {uses: store-security-checkup, note: "Once, in the round after the blockers are clear and before the real-money orders: uses your own admin list and apps, not step 4's tax plan, and the go-live report to see what is already clear. Hands back the staff sign-in, app and admin team fixes."}
schedule: "Each time you say you have fixed items on the list, up to four rounds"
asks_before: [switching payments from test to live, removing the storefront password, placing real-money test orders, changing payment, tax or shipping settings, entering or pasting any payment key or card number]
origin: own
version: 1.0.0
example_pending: true
