new_slug: prepare-private-bug-evidence-for-developers
name: Private bug evidence assistant
summary: Turn rough bug notes and a screenshot into a developer-ready bug report. You get a privacy checklist and a list of files that are safe to share.
job: build-software
headline: Private bug evidence assistant
subhead: Give your bug notes and a screenshot. On your own computer with masking tools, it masks a copy and checks it. In a cloud chat, bring a copy you already redacted. You get a draft issue, a privacy checklist and a list of safe files.
explain: |-
  A bug report often needs a screenshot, and a screenshot often shows more than you mean to share: a name, an order number, a token, a browser tab. This assistant keeps the original untouched and works from a masked copy. It checks the output pixels of that copy before it writes anything from it.

  It works in three steps. First it masks a separate copy of each screenshot on your computer and inspects the result. With no masking tools, it asks for a copy you redacted yourself and writes a text-only issue that leaves out any picture it has not checked. Second it writes the bug report from your notes and the checked copy: environment, steps, expected and actual behaviour, impact and how sure the repro is. It keeps what you reported apart from what was reproduced. Third it proofreads the report.

  It never says an image is safe. Automatic masking misses things, so a person checks the copy against the place it will be posted. It uploads and publishes nothing. A real password, key or token goes to your own incident process and gets rotated.
when:
  - You need to post a bug in a shared or public tracker and your screenshot has private details in it.
  - Your bug notes are rough and you want a report a developer can follow.
  - You want a record of which images are safe to share and which were never checked.
not_for:
  - "You have only a raw screenshot and a cloud chat: mask it on your own computer first, then bring the redacted copy here."
  - "The evidence is already cleared to share: write the issue straight in your tracker, no privacy review needed."
  - "A real password, key or token was exposed: send it to your own incident process and rotate it, do not paste it here."
  - "You want the issue posted for you: it drafts only, and you post it yourself."
you_give:
  - "BUG_NOTES: give expected and observed behavior, environment and actions already tried."
  - "EVIDENCE_FILES: give a local path for original images to local masking tools. In a cloud chat, attach only already-redacted copies; never upload raw sensitive images. Identify any remaining sensitive regions."
  - "SHARING_BOUNDARY: name intended recipient and public/private issue destination."
  - "TOOL_SCOPE: state local privacy-mask/Tesseract availability and image-processing permission."
you_get:
  - Reviewed redacted copies when local masking tools are available
  - A draft issue with environment, steps, expected and actual behaviour, impact and repro limits
  - A proofreading checklist and a safe-file list
  - Open reproduction questions for the reporter or product owner
  - A sharing gate marked PASS, FAIL or NOT RUN
how_it_works:
  - title: Create separate safe evidence copies
    text: Process originals locally against declared sensitivity. Detect candidate regions, mask a separate copy and inspect output pixels. Pass only reviewed copies and an abstract redaction log to issue drafting.
  - title: Draft the developer handoff
    text: Use safe evidence and bug notes for environment, steps, expected/actual behavior, impact and reproducibility limits. Separate reported from reproduced actions. Remove personal or secret data from quoted logs.
  - title: Check evidence and wording
    text: Proofread the English issue draft for spelling, grammar, terminology, filenames, numbered steps and jargon. Return an Original -> Suggestion -> Reason checklist. Flag factual uncertainty [verify] rather than silently changing it. The coordinator returns the existing draft issue, checklist and unresolved privacy/reproduction checks.
judge:
  - Originals remain intact and safe copies have clear identity.
  - Actual output pixels are reviewed or review stays NOT RUN.
  - Claims separate observed, reported and inferred behavior.
  - Nothing is uploaded or published.
how_to_use:
  - Download the pack and unzip it. Give the folder to your AI and start with START_HERE.txt.
  - "Give your bug notes: what you expected, what happened, your setup and what you tried. Say who will read the issue and whether the tracker is public or private."
  - Pick one path for the screenshot. On your own computer with a privacy mask tool and Tesseract, give the file path and the AI masks a copy. In a cloud chat or without tools, attach only a copy you already redacted.
  - Read the sharing gate. PASS means the checks that ran passed. FAIL means fix it and run again. NOT RUN means a check, such as the pixel review, did not happen, so do not share that image.
  - Check the masked copy yourself against the place you will post. Automatic masking is never complete.
  - Next, send the draft to the reporter or product owner to answer the open questions. Then post it yourself in the tracker you named. The assistant posts nothing.
output_sample:
  input:
    - "Your bug notes: what you expected, what happened, your setup and what you already tried"
    - Your screenshot files, as a local path or as redacted copies only
    - Who will read the issue, and whether the place you post it is public or private
    - Which local tools you have, such as a privacy mask tool and Tesseract, and if image work is allowed
  prerequisites:
    - Local masking tools on your computer if you want the AI to mask originals (screenshot-privacy-masker, Tesseract)
    - Without tools, a redacted copy of each image that you made yourself
  output:
    - name: Draft issue
      contains: A Markdown bug report with environment, steps, expected and actual behavior, impact and limits on how sure the repro is.
    - name: Safe-output manifest and status
      contains: A list of each safe image copy, how it links to its original, and whether its pixels were reviewed.
    - name: Proofreading checklist
      contains: Wording fixes as Original, Suggestion and Reason, with uncertain facts marked [verify].
    - name: Unanswered reproduction questions
      contains: Open questions for the reporter or product owner, such as missing expected behavior.
    - name: Sharing gate
      contains: A pass, fail or not-run status for the privacy checks before you share the issue.
thinking: high
