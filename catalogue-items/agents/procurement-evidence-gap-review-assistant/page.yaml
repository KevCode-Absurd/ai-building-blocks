new_slug: procurement-evidence-gap-review-assistant
name: Procurement evidence gap review assistant
headline: Procurement evidence gap review assistant
summary: Compare vendor proposals against your approval checklist and see which mandatory checks still lack proof. Get a dated trail of how you decided.
job: check-contracts
thinking: high
thinking_why: It must hold the criteria fixed, treat unknown mandatory checks as failed, and rerun only what new evidence touches.
subhead: Give it the vendor proposals, your ordered approval checklist with its stop rules, and your fixed criteria. It compares the vendors, runs the checklist in order, and shows which mandatory checks pass, fail or lack evidence. You get a record of how you decided.
explain: |-
  Vendor choices go wrong in quiet ways. A late proposal shifts the criteria. A missing security answer gets read as a pass. Months later nobody can say why you picked one vendor. This agent keeps a procurement decision trail. It records your criteria before it reads the vendors, and it holds them fixed.

  When a vendor sends new evidence, or a mandatory check falls due, it runs the Preserve a procurement decision audit trail workflow. That compares the proposals on the same scope and runs your checklist in order. If a mandatory item that was unknown gets evidence, it pulls the real scope and date from the source with the Source note summariser. Then it reruns the checklist from the earliest stop rule that evidence touches.

  An unknown mandatory check stays failed. It never adds a criterion after it has seen the vendors. You make the decision. It tells no vendor anything.
when:
  - A vendor sends a revised proposal or a new security or pricing document after you started scoring.
  - A mandatory check, such as a security review or a reference call, has just come due.
  - A manager asks "why did we choose them?" and the answer is spread across emails.
  - You are choosing between two or three vendors and need the same criteria applied to each.
not_for:
  - You have no approval checklist yet. Build one first with the Decision checklist builder, then run it here.
  - You want one vendor's contract terms read for risk. Use the Contract intake reviewer.
  - You want one vendor's cost and risk review for a renewal. Use the Vendor comparison writer on its own.
  - You are fixing a supplier's quality problem. Use the Supplier correction evidence review assistant.
  - You want vendors told the result. It sends nothing.
you_give:
  - The vendor proposals as sent, with their dates (from your email or procurement folder)
  - Your approval checklist in order, with its stop rules (the rules that end the review when a mandatory check fails)
  - Your decision criteria, fixed before you read the vendors
  - The evaluators' scores or notes, and any conflict of interest they declared
  - The last review's record (optional, needed to see what changed)
  - Today's date
you_get:
  - A side-by-side comparison of the vendors on your criteria, with exclusions and gaps shown
  - Your checklist run in order, each item marked pass, fail or blocked, with the proof behind it
  - A decision trail of what changed, on what evidence, and when
  - A list of missing proof and who can supply it
  - A short record to start the next review from
how_to_use:
  - Add the agent with the two pieces it uses, the Preserve a procurement decision audit trail workflow and the Source note summariser. If your AI cannot open them, paste both in with the agent.
  - Say if this is the first run. If not, paste last time's record. Then attach the proposals, your checklist, your criteria and the evaluators' notes.
  - Check that the criteria in the result match the ones you fixed. If they differ, stop and correct that first.
  - Read every mandatory check marked blocked. It needs proof, not a guess. Ask the vendor yourself.
  - Run it again when a vendor sends new evidence. It reruns from the first check that evidence touches. In plain chat it cannot save files, so keep the record it hands back.
how_it_works:
  - title: Reads the last record
    text: Uses the saved record or sets a first baseline. The record holds the procurement ID, criteria version, each vendor's source versions, mandatory check status and the decision trail.
  - title: Checks the trigger
    text: A vendor sent new evidence, or a mandatory check is due. If neither, it says nothing changed and stops.
  - title: Compares the vendors
    text: Runs the Vendor comparison writer on the real proposals, on the same scope and your fixed criteria. Exclusions, evidence gaps and exit costs stay in view.
  - title: Runs your checklist
    text: Runs the Decision checklist runner in your order. Unknown counts as a fail. A failed stop rule ends the call, and it still lists the rest.
  - title: Reruns only what changed
    text: When an unknown mandatory item gets proof, the Source note summariser pulls its real scope and date. The checklist reruns from the earliest stop rule that proof touches.
  - title: Saves the trail
    text: Writes the review files and a new record, keeps the old one, and lists MISSING lines and CHECKS MISSED.
output_shape: |-
  REVIEW <date>, procurement <ID>, criteria version <n>   LAST REVIEW <date or first baseline>

  CHANGED  <vendor, document, date, what it changes>
  COMPARISON  <criterion> | <vendor A> | <vendor B>   scope compared <...>   not comparable <reason>
  CHECKLIST  <n>. <item> | <PASS | FAIL | BLOCKED> | proof <source, date>
    stop rule applied: <none | item n>
  DECISION TRAIL  <date | what was decided or changed | by whom | on what evidence>
  CONFLICTS DECLARED  <evaluator, vendor>

  RECORD FOR NEXT REVIEW  <procurement ID, criteria version, vendor source versions, mandatory check status>
  MISSING  <each gap, who can supply it, and the item it blocks>
  CHECKS MISSED  <one line each, or none>
output_sample:
  input:
    - The vendor proposals as sent, with their dates
    - Your approval checklist in order, with its stop rules
    - Your decision criteria, fixed before you read the vendors
    - The evaluators' scores or notes and any declared conflicts of interest
    - The last review's record (optional)
  prerequisites:
    - An AI that can read uploaded files, such as Claude, ChatGPT or Gemini
    - The two pieces it uses, the Preserve a procurement decision audit trail workflow and the Source note summariser
  output:
    - name: What changed
      contains: Each new or revised vendor document with its date, and what it changes. On a first run it says first baseline.
    - name: Vendor comparison
      contains: Each vendor on your criteria, side by side, with the scope compared, exclusions, evidence gaps and exit costs. Anything not comparable is labelled.
    - name: Checklist result
      contains: Every checklist item in your order, marked pass, fail or blocked, with the proof behind it and the stop rule that applied.
    - name: Decision trail
      contains: A dated list of what was decided or changed, on what evidence, and by whom. The criteria version stays on every line.
    - name: Missing proof
      contains: Each mandatory item still unknown, what would settle it, who can supply it and which checklist item it blocks.
    - name: Record for next review
      contains: A small block to paste next time with the procurement ID, criteria version, vendor source versions and mandatory check status.
    - name: Saved files
      contains: The review files in a dated folder under reviews/procurement-evidence-gap-review-assistant/, when your AI can save files.
tweaks:
  - what: Criteria
    how: Fix them in writing before you attach any proposal. If you change them later, say so. It keeps both versions and shows both results.
  - what: Same scope
    how: Ask every vendor to quote the same scope. If one quote leaves out support or setup, it is shown as not comparable, not averaged in.
  - what: Mandatory items
    how: Mark each checklist item mandatory or not. Only mandatory items can block the result.
  - what: Conflicts
    how: List any conflict an evaluator declared. It flags the scores and removes none unless your checklist says to.
judge:
  - Criteria are not changed after seeing vendors; unknown mandatory checks remain failed or blocked.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep your approval checklist in one file and add each lesson from a past choice as a new item.
  - Save each review's record in a folder named by date, so the next run starts from the true earlier state.
  - Add a standard request for the proof you often chase, such as a security report, so you can send it the same way each time.
  - Pair it with the Software vendor chooser when you are still building the shortlist.
works_best_with:
  tools:
    - name: A chat AI that reads uploaded files
      why: Claude, ChatGPT and Gemini can read the proposals and the pack. In plain chat you save the record yourself.
    - name: Your procurement folder
      why: Keep every vendor document with its date in one place, so the AI reads what was actually sent.
  inputs:
    - Your written criteria with their weights.
    - Reference call notes.
    - The security or compliance documents each vendor shared.
terms:
  - term: Stop rule
    meaning: A checklist rule that ends the review when a mandatory check fails.
  - term: Mandatory check
    meaning: A checklist item every vendor must pass before the others count.
  - term: Decision trail
    meaning: A dated record of what was decided, on what proof, and by whom.
