new_slug: product-sample-approval-loop
name: Product sample approval loop
summary: Give it your tech pack and each sample. Get go or hold, fixes for the factory, and a stop at three rounds.
job: plan-supply-chain
thinking: high
thinking_why: It checks many pack lines, decides who is at fault and loops across rounds. Give it your strongest model.
headline: Product sample approval loop
subhead: Give it your tech pack and each sample as it arrives. It checks every line, says go or hold, tightens any vague line in the pack, writes the fixes to send the factory, and stops after three rounds.
explain: |
  Sampling can drag on for months. The factory sends a sample. You spot a problem and email back. The next sample fixes that and breaks something else. Nobody remembers what was agreed, and a vague line in the tech pack gets read two ways.

  This agent checks each sample against your pack, line by line, and scores it. A critical fail is a hold, whatever the score. If a failed line was vague, it tightens that line first. If the pack was clear, it writes the fix list for the factory. On a go, it re-checks your margin with the real quote and, at production stage, writes the inspection brief. After three rounds with a critical fail it stops and helps you pick the next factory. It sends and pays nothing.
when:
  - You are having a product made and samples keep coming back wrong.
  - You want a written record of what each sample got wrong and what was asked.
  - You want a clear point to stop, so a bad factory does not eat months.
you_give:
  - Your tech pack, the current version
  - Photos, measures, weights and colour readings for each sample
  - "The stage: strike-off, pre-production or production sample"
  - "Which pack lines are critical (strongly advised)"
  - Your quote and freight, for the margin check (optional)
you_get:
  - A line-by-line pass or fail, a score and a go or hold
  - Numbered fixes to send the factory, each with a spec and a number
  - Any pack line tightened, for your approval
  - On a go, your margin re-checked, and at production the inspection brief
how_to_use:
  - Add the agent in Claude Code, or save it in .claude/agents.
  - Give it the tech pack and the first sample's photos and measures, and say the stage.
  - Read the decision. If it is a hold, check the fix list and send it to the factory yourself.
  - When the next sample comes, run it again. It reads the log and checks only what is new.
  - On a go at production stage, take the inspection brief to your inspector before the goods ship.
how_it_works:
  - title: Read the log
    text: Opens the record of earlier rounds and counts how many are used at this stage.
  - title: Check the sample
    text: Checks every tech pack line against the sample and scores it, with critical lines counted heavier.
  - title: Choose the path
    text: On a hold with a vague line, it tightens the pack first. With a clear pack, it writes the factory fix list. On a go, it re-checks the margin.
  - title: Loop with a cap
    text: Waits for the next sample and checks again. It stops after three rounds at one stage.
  - title: Stop and re-score the factories
    text: If a critical line still fails in round three, it stops and re-scores your shortlist to name the next factory to try on a small batch.
  - title: Log and hand back
    text: Saves the round in the log and hands back the decision, then stops for your yes.
output_shape: |-
  THIS ROUND
    <product> | stage <...> | round <n> of 3 | score <n>/100 | <go | hold>

  DECISION AND WHY
    <failed line> | critical | spec <...> | found <...>

  FIX LIST FOR THE FACTORY
    1. <line> | spec <...> | found <...> | change <...>

  PACK CHANGES
    <line> | was <...> | now <...> | for your approval

  IF GO
    Margin with real quote <%> | gold standard: keep one sample at home and one at the factory
    Inspection brief: <ready | not yet>

  ROUNDS USED
    <n> of 3 at this stage | at the cap: <what happens>

  FILES AND MISSING
    <each step's file> | MISSING: <every line>
tweaks:
  - what: Which lines are critical
    how: Mark size, material, safety and legal labels. A critical fail is a hold, whatever the score.
  - what: Photos and measures
    how: A photo cannot show a weight or a measure. Add real numbers, or those lines are marked not checked.
  - what: Your margin target
    how: Give it before the first go, so the margin check has a line to compare with.
  - what: The round cap
    how: Three rounds is a starting point. Use two if samples cost a lot or take weeks.
judge:
  - Every pack line is checked, or named as not checked.
  - A critical fail is a hold, whatever the score.
  - A vague pack line is tightened before the next round.
  - The fix list gives a spec and a number for each line.
  - Nothing was sent, paid or approved without your yes.
test:
  - Run it on an old sample where you know a defect. See if it fails the right line.
  - Give it a pack with a line that can be read two ways and check it tightens that line.
  - Run three failing rounds and check it stops and does not ask for a fourth sample.
improve:
  - Add your own list of critical lines for each product type.
  - Save the factory's replies in the log, so repeated promises can be spotted.
  - Add a returns note from earlier products, so the checks cover the faults you have seen.
works_best_with:
  tools:
    - name: Claude Code
      why: It can keep the sample folder and the log for each product.
    - name: A measuring tape and a scale
      why: Real measures and weights are what turn a photo check into a real one.
  inputs:
    - The factory's quote and your freight costs
    - A shortlist of other factories and their answers
