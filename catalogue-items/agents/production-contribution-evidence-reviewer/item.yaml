    note: Run the governing workflow when a measured yield, a scrap recovery, an input price or a planned product quantity changes. It hands back cost per good unit, product contribution and a capacity check.
  - uses: commodity-pass-through-cost-bridge
    note: If an input invoice price changes, bridge the extra input cost and apply only the approved customer pass-through share before rebuilding contribution. Keep the original stock cost date. Do not infer demand or whether the plant can make the plan.
