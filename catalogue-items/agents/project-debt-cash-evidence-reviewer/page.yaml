new_slug: project-debt-cash-evidence-reviewer
name: Project debt cash evidence reviewer
headline: Project debt cash evidence reviewer
summary: A dated evidence review with changed assumptions, reconciliations and unresolved source gaps.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: "A linked project cash, debt repayment and loan-life cover schedule. Share three annual project operating cash records or approved scenarios, financing CFADS definition, loan opening balance, fixed rate, target service cover and contractual loan-life rate. Identify operating source basis: accrual before working-capital settlement or actual cash receipts/payments, with a compatible working-capital perimeter. Include the prior dated review and source versions when available."
explain: |-
  A linked project cash, debt repayment and loan-life cover schedule.

  Project finance coverage schedules. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need a linked project cash, debt repayment and loan-life cover schedule.
  - You work on project finance coverage schedules and need traceable calculations.
  - New evidence needs comparison with the prior dated review.
you_give:
  - "Three annual project operating cash records or approved scenarios, financing CFADS definition, loan opening balance, fixed rate, target service cover and contractual loan-life rate. Identify operating source basis: accrual before working-capital settlement or actual cash receipts/payments, with a compatible working-capital perimeter. Include the prior dated review and source versions when available."
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A linked project cash, debt repayment and loan-life cover schedule.
  - Original step files, financial assumptions, source coverage and a governing handoff summary.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Build a project debt service cash pack
    text: Run the governing workflow when A project operating cash source, financing definition or annual loan-service assumption changes.
  - title: Availability payment deduction checker
    text: If the changed receipt is an availability payment and the actual contract deduction certificate is supplied, reconcile that certified deduction before revising the affected CFADS period. Otherwise preserve the missing payment evidence. Any changed receipt or cost source must preserve the declared accrual-versus-cash basis; do not deduct working-capital settlement twice.
output_shape: |-
  A linked project cash, debt repayment and loan-life cover schedule.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: All annual cash is rebuilt from dated sources; principal rollforward ties; cash beyond maturity and financing proceeds are excluded from loan-life cover. Actual receipt/payment sources do not receive a second working-capital deduction; accrual and cash-basis routes are explicitly distinguished. Preserve changed-source evidence; no external transaction is authorized.
judge:
  - All annual cash is rebuilt from dated sources; principal rollforward ties; cash beyond maturity and financing proceeds are excluded from loan-life cover. Actual receipt/payment sources do not receive a second working-capital deduction; accrual and cash-basis routes are explicitly distinguished. Preserve changed-source evidence; no external transaction is authorized.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
