slug: project-reserve-evidence-reviewer
name: Project reserve evidence reviewer
summary: Check your project's debt reserve and who is paid first from project cash. Get a reserve roll-forward and payment waterfall, redone when terms change.
category: agent
type: agent
role: orchestrate
job: ops
level: advanced
inputs:
