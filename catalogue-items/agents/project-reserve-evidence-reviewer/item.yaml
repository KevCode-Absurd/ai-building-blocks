  - debt-service-covenant-headroom-checker
steps:
  - uses: reconcile-project-reserves-and-payment-priority
    note: Run the governing workflow when a reserve requirement, an authorized draw, an upcoming payment or a payment-priority source changes. It hands back a reserve roll-forward and a payment waterfall tied to it. Hands the reserve roll-forward and the payment waterfall to step 2.
  - uses: debt-service-covenant-headroom-checker
    note: If a signed debt-service test gates a requested distribution, work out only that cash test on the contract's own definition and periods. A cash residual does not pass a test nobody has checked. Uses the signed debt-service test in your loan document and the cash figures from step 1.
