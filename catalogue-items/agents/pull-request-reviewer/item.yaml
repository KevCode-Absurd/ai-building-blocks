slug: pull-request-reviewer
name: "Pull request reviewer"
summary: "Point it at each new pull request. Get a risk rating, ranked findings and a review to post once you say yes."
category: agent
type: agent
role: orchestrate
job: analysis
level: intermediate
inputs:
  - {type: code_change, required: true}
  - {type: codebase, required: true}
outputs:
  - {type: feedback_notes}
  - {type: audit_report}
uses: [pull-request-risk-scorer, pull-request-risk-reviewer, security-focused-change-reviewer, change-impact-checker, test-gap-finder, human-review-gate]
steps:
  - {uses: pull-request-risk-scorer, note: "Every pull request, first: size and risk, which sets how deep the rest goes. Hands the risk band and size to the reviewer."}
  - {uses: pull-request-risk-reviewer, note: "Every pull request: issues ranked by severity, with clear review comments. Uses the pull request and step 1's risk band. Hands the findings to the extra checks and the sign-off."}
  - {uses: security-focused-change-reviewer, note: "Only when the change touches sign-in, permissions, user input, secrets, payments, dependencies or build workflows. Uses the pull request, the repository and step 2's findings. Hands its security report to the sign-off."}
  - {uses: change-impact-checker, note: "Only when the change edits shared code, a public interface or a data shape that other parts rely on. Uses the repository and the change itself, not step 3's report. Hands its impact proof to the test check."}
  - {uses: test-gap-finder, note: "Every pull request that is not low risk, or any that adds behaviour without touching a test. Uses the change, your tests and step 4's impact proof when it ran. Hands the coverage gaps to the sign-off."}
  - {uses: human-review-gate, note: "Only when the risk is high or a blocker was found: a one-page sign-off before the change counts as done. Uses the findings, security report and test gaps from the earlier steps."}
schedule: "On every new pull request, and again when its author pushes changes"
asks_before: [posting comments on the pull request, approving it, requesting changes, merging or closing it, pushing commits to its branch]
origin: own
version: 1.0.0
example_pending: true
