slug: quarterly-accessibility-keeper
name: "Quarterly accessibility keeper"
summary: "Give it your site each quarter. Get accessibility gaps ranked, last quarter's fixes checked and a statement kept current."
category: agent
type: agent
role: orchestrate
job: design
level: intermediate
inputs:
  - { type: web_page, required: true }
  - { type: codebase, required: false }
  - { type: design_direction, required: false }
  - { type: design_tokens, required: false }
  - { type: question, required: true }
outputs:
  - { type: audit_report }
  - { type: plan }
uses: [ accessibility-standards-checker, accessibility-checker, colour-contrast-checker, federal-accessibility-checker ]
steps:
  - { uses: accessibility-standards-checker, note: "Every quarter: WCAG gaps by level across the site, what to fix first and notes for the accessibility statement, compared with last quarter. Hands the gaps and the fix-first list to the page check." }
  - { uses: accessibility-checker, note: "Every quarter, on the pages that matter most and any page changed since last time: a ranked list of problems against WCAG 2.2, with fixes proposed, never applied. Uses your key pages and code with step 1's gaps. Hands the ranked problems to the later checks." }
  - { uses: colour-contrast-checker, note: "Only when colour tokens exist or the palette changed: every light and dark pair checked, with the closest passing colours. Uses your colour tokens or design direction, not step 2's findings. Hands the failing pairs to the fix list." }
  - { uses: federal-accessibility-checker, note: "Only when you sell to government or a buyer asks for Section 508: the gaps, a fix plan and notes for the report. Uses your site description and the accessibility findings from steps 2 and 3." }
schedule: "First week of each quarter, and after any redesign"
asks_before: [ changing any page, code or colour, publishing or changing the accessibility statement, sending a report to a buyer or regulator, buying an audit or an overlay tool, claiming a conformance level ]
minds: [ jakob-nielsen ]
origin: own
version: 1.0.1
example_pending: true
