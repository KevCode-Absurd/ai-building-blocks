slug: quarterly-client-rate-reviewer
name: "Quarterly client rate reviewer"
summary: "Give it your hours and invoices by client each quarter. Get each client's real rate, who to raise and what to propose."
category: agent
type: agent
role: orchestrate
job: strategy
level: intermediate
inputs:
  - {type: spreadsheet, required: true}
  - {type: question, required: true}
  - {type: competitor_set, required: false}
outputs:
  - {type: plan}
  - {type: offer}
uses: [cash-tied-up-finder, client-fee-and-cap-setter, pricing-decision-planner, can-they-pay-deal-checker, results-agreement-writer]
steps:
  - {uses: cash-tied-up-finder, note: "Every quarter: how long each client takes to pay and how much of your cash they hold, so slow payers are priced for it."}
  - {uses: client-fee-and-cap-setter, note: "Every quarter: your fee floor, billing terms and the client cap that covers your costs, refreshed from this quarter's hours."}
  - {uses: pricing-decision-planner, note: "Only for a client whose real rate fell below your floor, or whose scope grew: the new price and how to frame it."}
  - {uses: can-they-pay-deal-checker, note: "Only before a raise is proposed to a client you want to keep: what they can likely pay and a range to offer."}
  - {uses: results-agreement-writer, note: "Only for a client you will re-contract: a one-page agreement on results, limits, help and review dates."}
schedule: "In the first week of each quarter, after last quarter's hours and invoices are in"
asks_before: [sending any rate change or proposal to a client, ending or pausing work with a client, signing or sending an agreement, offering a discount or a payment plan]
minds: [wolfgang-amadeus-mozart]
origin: own
version: 1.0.0
example_pending: true
