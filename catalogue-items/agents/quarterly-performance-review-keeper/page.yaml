new_slug: quarterly-performance-review-keeper
name: Quarterly performance review keeper
summary: Turn a quarter of goals and dated notes into fair performance reviews, a plan for each talk and next quarter's goals for you to approve.
job: lead-people
thinking: high
thinking_why: It judges people from evidence, decides when a hard message is earned and drafts goals that must be fair and true. Give it your strongest model.
headline: Quarterly performance review keeper
subhead: Give it each person's goals, the quarter's one-on-one notes and what the business needs next. It writes each performance review from dated evidence, plans the conversation, writes a hard message only where it is earned, and drafts next quarter's goals. You hold the meetings. It sends and records nothing.
explain: |
  Reviews get written from the last two weeks. The quarter's wins are forgotten, a problem nobody raised becomes a surprise in the meeting, and next quarter's goals are last quarter's with the dates moved. People feel it, and the review loses its point.

  This agent builds each review from what happened. It lists every key result hit or missed and every dated note, and flags any problem never raised in the quarter as "raise now, do not grade on it". It drafts the review in a format checked with counsel, plans the conversation so you ask for their view first, and writes a hard message only where results missed and a problem repeated after being raised. Then it drafts next quarter's goals from what the business needs. Every file stays with you.
when:
  - You manage people and owe each one a performance review at the end of the quarter.
  - Your last reviews were written from memory and it showed.
  - You want next quarter's goals to come from where the business is going, not from last quarter's list.
  - A review is due for a person whose problem you noted twice, and you are not sure it is fair to grade it.
not_for:
  - Someone is facing a warning, a dismissal or a legal complaint. That needs your HR lead or counsel, not a review draft.
  - You have no dated notes and no key results for the quarter. It will say the review is thin. Start with the Weekly one-on-one prep keeper and come back next quarter.
  - You want to prepare this week's one-on-one. Use the Weekly one-on-one prep keeper.
  - You only need next quarter's goals for one person. Use the Objectives and key results writer on its own.
you_give:
  - Each person's objectives and key results for the quarter, marked hit or missed (from your goals doc or tracker)
  - Your one-on-one notes, wins and problems for each person, with dates (advised; the Weekly one-on-one prep keeper's person files work)
  - The numbers each person owned this quarter (advised)
  - One paragraph on what the business needs next quarter
  - The review format you saved on the first run, checked with counsel (optional on the first run, it builds one)
you_get:
  - A per-person evidence list, every claim dated
  - A draft review per person in your format
  - A conversation plan that asks for their view first
  - A hard message only where it is earned
  - Next quarter's objectives and dated key results per person
  - A list of problems to raise now rather than grade
how_to_use:
  - Open the agent in Claude, ChatGPT or Gemini, or paste it into a new chat. In Claude Code, add it as a skill or save it in .claude/agents so it can keep one folder per person.
  - On the first run, approve the review format and have counsel check it before you share any review. It is saved and reused.
  - Paste one person's goals and dated notes at a time, or point it to their folder. Add your paragraph on next quarter. Leave out anything you would not want in a review file.
  - Read each review against its evidence. Every claim should point to a result or a dated note. Change what you disagree with.
  - Hold the meetings yourself, and ask for their view first. Approve next quarter's goals with each person, then save them for the next run.
output_sample:
  input:
    - Each person's goals for the quarter, marked hit or missed
    - Your dated one-on-one notes for each person (advised)
    - The numbers each person owned (advised)
    - One paragraph on what the business needs next quarter
    - Your saved review format, checked with counsel (optional on the first run)
  prerequisites:
    - An AI that can keep a private file per person, such as Claude Code, or a chat where you paste one person at a time
    - A lawyer or HR lead to check the review format before you share any review
  output:
    - name: The quarter
      contains: One line with reviews written, key results hit and missed, hard messages and thin reviews.
    - name: Evidence list
      contains: Each key result and every dated note for the person, with whether the problem was raised.
    - name: Raise now, do not grade
      contains: Problems nobody raised during the quarter, to say in the meeting and keep out of the grade.
    - name: Draft review
      contains: Each section of your saved format, with every claim tied to a result or a dated note.
    - name: Conversation plan
      contains: What to praise, what to say, how to say it, and the question to ask first.
    - name: Hard message
      contains: A written message, only where results missed and a raised problem repeated. Otherwise it says not earned.
    - name: Next quarter goals
      contains: A few objectives per person, each with key results that have dates.
    - name: Files and missing
      contains: Each person's saved file and a MISSING line for every gap.
how_it_works:
  - title: Set the format once
    text: Builds the review questions and the rules on what is written down, for counsel to check.
  - title: Gather the evidence per person
    text: Lists each key result and every dated note, and flags problems never raised during the quarter.
  - title: Draft the review
    text: Writes each section from the evidence only, in plain words that say where the person stands.
  - title: Plan the conversation
    text: What to praise, what to say and how, opening by asking for their view of the quarter.
  - title: Write the hard message when earned
    text: Only where results missed and a raised problem repeated, the written message that keeps the person.
  - title: Draft next quarter's goals
    text: A few objectives with dated key results per person, from what the business needs next.
  - title: Refresh recognition yearly
    text: A reward plan where anyone who reaches the level wins.
  - title: Log and hand back
    text: Saves each person's file and stops. Nothing is sent.
output_shape: |-
  THE QUARTER
    <n> reviews | key results hit <n> of <n> | hard messages: <n> | thin reviews: <n>

  <NAME>
    Evidence: <key result> hit | <key result> missed (<number>) | <date> win: <what> | <date> note: <what>, raised: <yes | no>
    Raise now, do not grade: <problem never raised>
    Review: <sections in the saved format, each claim dated>
    Conversation: ask first: "<question>" | praise: <what> | say: <what> | how: <three lines>
    Hard message: <text | not earned>
    Next quarter: <objective> | KR: <measure> by <date> | <objective> | KR: ...

  RECOGNITION PLAN (yearly)
    <level> -> <reward> | public moment: <when>

  FILES AND MISSING
    <each person's file> | MISSING: <every line>
example:
  business: sprout
  input: |
    [the agent]

    Prepare Q3 reviews for a marketing lead at Sprout with three reports.
    Practice notes, not real people.
    - A, performance marketer. KRs: hold cost per new subscriber under $42
      (ended at $39, hit); launch 12 new hooks (launched 7, missed). Notes:
      birthday price-cut launch on time (Sep); test plan late 3 weeks
      (raised 29 Sep); said creative queue is late, twice.
    - B, content lead, 4 months in. KRs: two posts a week (averaged 1.6,
      missed); newsletter every Thursday (missed 3 of 13, raised 2 Oct).
      Notes: limited flavour shoot landed early; brand voice file done.
    - C, lifecycle, 3 weeks in. No KRs yet. Notes: mapped the cancel flow.
    Business next quarter: widen beyond offer-led ads to the habit angle
    ("the one thing I stuck to"); launch Kids ads; cut first-30-day
    cancels. Format: saved from Q2, checked with counsel.
  output: pending
tweaks:
  - what: Your notes
    how: Dated one-on-one notes are the difference between a fair review and a memory of September.
  - what: The business paragraph
    how: Say what the team must do next quarter. Goals are drafted from it.
  - what: Hard message rule
    how: The agent writes one only where results missed and a raised problem repeated. Tighten or loosen it.
  - what: Format
    how: Have counsel check the format once. The agent then follows its rules on what gets written.
judge:
  - Every claim in a review points at a result or a dated note.
  - No one is graded on a problem they never heard about.
  - Each conversation opens by asking for their view.
  - Next quarter's goals tie to the business paragraph.
  - Nothing was sent, recorded or changed.
test:
  - Give it one person with a problem raised twice and one with the same problem never raised. Only the first should get a hard message.
  - Run it twice on the same notes. The reviews should match in substance.
  - Give it a person with no notes. It should say the review is thin, not fill the gap.
improve:
  - Use the Weekly one-on-one prep keeper through the quarter, so the evidence is already dated.
  - Write your review format once with counsel and save it before the first run.
  - Add the numbers each person owns to their file each month, not at quarter end.
  - Keep each person's approved goals in their folder, so next quarter starts from them.
works_best_with:
  tools:
    - name: Claude Code
      why: It can keep one private folder per person and read the one-on-one files from the quarter.
    - name: Any good chat AI
      why: Paste the agent and one person's goals and notes at a time. Keep the files private.
  inputs:
    - Each person's own written view of their quarter, if your format asks for one
    - Peer feedback collected under your format's rules
terms:
  - term: Key result
    meaning: A dated, measurable sign that an objective was reached, such as "cost per new subscriber under $42 by 30 Sep".
