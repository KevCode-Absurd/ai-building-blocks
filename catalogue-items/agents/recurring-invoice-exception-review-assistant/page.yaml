new_slug: recurring-invoice-exception-review-assistant
name: Recurring invoice exception review assistant
headline: Recurring invoice exception review assistant
summary: New invoice exceptions, resolved items with evidence and an approval review list.
job: track-numbers
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: New invoice exceptions, resolved items with evidence and an approval review list. Share new invoices, purchase and receipt records, approved vendor data and the prior exception ledger. Your AI prepares the work and marks any facts it cannot verify.
explain: |-
  New invoice exceptions, resolved items with evidence and an approval review list.

  Give your AI the source material listed below and install the complete pack. It uses the component skills in the stated order, saves each result and checks the handoff before continuing. Invoice IDs prevent duplicate processing; arithmetic and receipt checks remain separate from payment approval. Missing tools or evidence stay visible in the final summary.
when:
  - You need new invoice exceptions, resolved items with evidence and an approval review list.
  - The relevant facts are spread across files or notes and need one consistent review.
  - You need to compare new evidence with the last review and choose the next action.
you_give:
  - New invoices, purchase and receipt records, approved vendor data and the prior exception ledger.
  - The intended reader, deadline and limits on what may be changed.
  - The last review and current evidence, if this is a repeat run.
  - "Available tools for the finished output: A compatible spreadsheet engine."
you_get:
  - New invoice exceptions, resolved items with evidence and an approval review list.
  - Step files with evidence, unresolved facts and actual checks completed.
  - The reason each branch ran or was skipped, plus a minimal record for the next review.
how_to_use:
  - Download the complete pack and add its governing file and component skills to your AI.
  - Share the sources listed above and say which result you need.
  - Ask the AI to follow the governing file, save each result and stop on a failed required check.
  - Review the files, missing facts and proposed actions before using the result.
how_it_works:
  - title: Read scope and prior state
    text: Keep vendor ID, invoice ID, source hash, amount and currency, exception state, evidence references and review date. Establish a baseline on the first run.
  - title: Check the trigger
    text: A new invoice ID appears, supporting evidence changes or an unresolved exception reaches its review date.
  - title: Choose the next step
    text: Run the invoice workflow for new or changed records. Use invoice-totals-checker to revisit arithmetic exceptions only. If source records conflict, leave the invoice blocked for the responsible reviewer; never release payment.
  - title: Check and save evidence
    text: Invoice IDs prevent duplicate processing; arithmetic and receipt checks remain separate from payment approval. Save source versions, branch reasons, outputs and unresolved checks.
output_shape: |-
  Scope and source coverage
  New invoice exceptions, resolved items with evidence and an approval review list.
  Step files and evidence references
  Changes since the last review and branches taken
  Unresolved facts and checks missed
  Proposed next action and approval status
tweaks:
  - what: Scope
    how: Choose one project, team, period or decision so the sources are comparable.
  - what: Evidence
    how: Provide the actual records and their dates rather than a summary from memory.
  - what: Acceptance
    how: Invoice IDs prevent duplicate processing; arithmetic and receipt checks remain separate from payment approval.
judge:
  - Invoice IDs prevent duplicate processing; arithmetic and receipt checks remain separate from payment approval.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
works_best_with:
  tools:
    - name: A compatible spreadsheet engine
      why: Formula recalculation and workbook inspection need an actual compatible engine; static table checks can use supported scripts.
  inputs:
    - Approved examples of a good result.
    - A named reviewer and their acceptance rules.
terms:
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
