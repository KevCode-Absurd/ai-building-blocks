new_slug: recurring-invoice-exception-review-assistant
name: Recurring invoice exception review assistant
headline: Recurring invoice exception review assistant
summary: Check each new supplier invoice batch for duplicates, wrong sums and missing receipts. Get an exception ledger and a list for your approver.
job: track-numbers
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it new supplier invoices, purchase orders, receipts, your approved vendor list and last time's exception ledger. It checks each invoice for duplicates, wrong sums and missing receipts. You get new exceptions, items closed with proof and a list for your approver. It never releases a payment.
explain: |-
  Supplier invoice checks repeat every week or month, and the mistakes repeat with them. The same invoice arrives twice. A line total is wrong. Goods were never received. This agent checks only the new or changed invoices and keeps a ledger, so open exceptions are not lost between runs.

  A duplicate means the same vendor ID and the same invoice number, ignoring spaces, capital letters and leading zeros. A possible duplicate is the same vendor with the same amount and currency under a different number. A person decides on those. You can tell it how close the invoice dates must be to count.

  Arithmetic and receipt checks are separate from approval. When records conflict, the invoice stays blocked for the person responsible. The agent prepares a list for your approver. It does not approve, pay or onboard a vendor.
when:
  - A new batch of supplier invoices arrives and needs checking before approval.
  - You are closing the month and need to know which exceptions are still open.
  - A supplier sends a corrected invoice or a credit note for an earlier exception.
  - Your approver asks which invoices are ready for review.
not_for:
  - This is your first check and you have no ledger yet. Use the Check supplier invoices before approval workflow.
  - You want the sums on one invoice rechecked. Use the Invoice totals checker.
  - You want to chase customers who owe you. Use the Weekly invoice and cash chaser.
you_give:
  - The new supplier invoices for the batch
  - Purchase orders and goods or service receipts for those invoices
  - Your approved vendor list, with vendor IDs
  - The name of the person who approves payment
  - Last time's exception ledger (optional on the first run)
  - How close two invoice dates must be to count as a possible duplicate (optional)
you_get:
  - A list of new exceptions, each with its type and what would fix it
  - Items closed since last time, with the proof that closed them
  - A list of invoices ready for your approver, and a list that stays blocked
  - An updated exception ledger for the next run
  - A run log showing what was checked and what was not
how_to_use:
  - Download the pack from this page and add it to your AI. If you cannot add it, paste SKILL.md into a new chat.
  - Attach the new invoices, the purchase orders, the receipts and your approved vendor list. Leave out bank account details.
  - Attach last time's exception ledger, or say this is the first run. Name the person who approves payment.
  - Say "Check this batch. Add new exceptions to the ledger. Do not approve or pay anything." Your AI asks once for anything missing.
  - Open new-exceptions.md first. Check each one against the invoice itself.
  - Give approval-review-list.md to your approver. Keep exception-ledger.csv for the next batch.
how_it_works:
  - title: Read the ledger
    text: It keeps vendor ID, invoice ID, amount and currency, exception state, evidence and review date for each invoice. Unchanged invoices are skipped.
  - title: Find new or changed invoices
    text: A new invoice ID, changed supporting evidence or an exception that reached its review date puts an invoice in scope.
  - title: Check identity and duplicates
    text: It checks the required fields. Then it looks for the same vendor and invoice number, and for the same vendor and amount under another number.
  - title: Recompute the sums
    text: It recalculates lines, discounts, stated tax and totals. It does not choose a tax treatment.
  - title: Match to orders and receipts
    text: It checks that a purchase order exists, the price matches, the goods were received and the vendor is on your list.
  - title: Close only with proof
    text: An exception closes when you supply a corrected invoice, credit note or receipt. A passing date closes nothing.
  - title: Prepare the approver list
    text: Invoices with no open exceptions are listed as ready for review. Conflicting records stay blocked.
output_shape: |-
  NEW EXCEPTIONS (<batch date>)
    <vendor ID> | <invoice ID> | <amount and currency> | <Duplicate, Possible duplicate, Arithmetic, No PO, Price mismatch, No receipt, Quantity mismatch, Vendor not approved, or Missing field> | <what would fix it>

  RESOLVED SINCE LAST RUN
    <vendor ID> | <invoice ID> | <exception> | <evidence that closed it>

  APPROVAL REVIEW LIST
    Ready for approver review: <invoice ID, vendor ID, amount> (not approved)
    Blocked: <invoice ID> | <reason> | <who must resolve it>

  LEDGER ROW
    <vendor ID> | <invoice ID> | <amount and currency> | <exception> | <new, open, resolved or blocked> | <evidence reference> | <review date>

  RUN LOG
    Invoices checked | invoices skipped as unchanged | MISSING lines | CHECKS MISSED
output_sample:
  input:
    - The new supplier invoices for the batch
    - Purchase orders, receipts and your approved vendor list
    - Last time's exception ledger (optional on the first run)
    - The name of the person who approves payment
  prerequisites:
    - Vendor IDs on your approved list
    - An AI that can read files, such as Claude, ChatGPT or Gemini
    - A spreadsheet tool, only if you want the ledger as a workbook
  output:
    - name: exception-ledger.csv
      contains: One row per exception with vendor ID, invoice ID, amount, type, state, evidence and review date.
    - name: new-exceptions.md
      contains: This run's new exceptions, each with its type, the records behind it and what would fix it.
    - name: resolved-items.md
      contains: Exceptions closed since last time, with the evidence that closed each one.
    - name: approval-review-list.md
      contains: Invoices ready for your approver to review, and invoices that stay blocked with the reason.
    - name: run-log.md
      contains: What was checked, what was skipped as unchanged, missing facts and checks not done.
tweaks:
  - what: Duplicate rule
    how: Say how close two invoice dates must be to count as a possible duplicate. With no limit, it lists every same-vendor, same-amount pair.
  - what: Receipts
    how: Attach the goods or service receipts, not only the purchase orders. Without them the quantity check cannot run.
  - what: The ledger
    how: Attach the latest ledger every time. Without it, every invoice looks new and old exceptions are lost.
improve:
  - Add your own approval rules, such as a limit above which two people must review, to the approver list.
  - Keep each ledger with your finance records, so every batch starts from your real open items.
  - Add the exception types your team sees most, so the labels match your language.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file upload
      why: It reads invoices, orders and receipts together and does the sums.
    - name: A spreadsheet tool such as Excel or Google Sheets
      why: Your ledger is a file you can sort and filter by state or vendor.
  inputs:
    - Credit notes and supplier statements.
    - Your accounting export of invoices already paid.
    - A list of vendors on hold.
terms:
  - term: Exception
    meaning: An invoice that fails a check and needs a person to look at it.
  - term: Possible duplicate
    meaning: Two invoices from one vendor with the same amount and currency but different numbers.
  - term: Credit note
    meaning: A document from a supplier that cancels or reduces an earlier invoice.
  - term: Blocked
    meaning: An invoice that must not go to payment until the person responsible resolves the conflict.
judge:
  - Invoice IDs prevent duplicate processing; arithmetic and receipt checks remain separate from payment approval.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
