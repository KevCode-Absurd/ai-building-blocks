new_slug: referral-administration-evidence-review-assistant
name: Referral administration evidence review assistant
headline: Referral administration evidence review assistant
summary: Build a referral status handover for the next administrator. See what was sent, received and booked, what is unconfirmed, and draft the follow-ups.
job: organise-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it referral status records, proof of sending and receipt, and your clinic's follow-up rules. It builds a referral status handover for the next administrator. Sent, received, booked and completed stay apart. It lists missing confirmations and drafts follow-ups for you to send. It never judges clinical urgency.
explain: |-
  A referral can be sent, received, booked and completed, and each one is a separate fact. Teams often log "referral done" when only the first step happened. The next administrator then inherits a list where nobody knows which referrals are still waiting for a confirmation.

  This agent sorts each referral by the furthest step your records can prove. It uses a reference number and an administrative status only. Anything without proof is listed as an unconfirmed step, with a draft follow-up written to your clinic's own rules, such as how long to wait before chasing. With no rule, it writes MISSING and drafts nothing to send.

  It handles administration, not care. It does not rank urgency or guess what a patient needs. Clinical questions go to the qualified clinic contact. Use as little personal data as you can: a reference and a status, with no names, dates of birth or clinical details. Check your clinic's own data rules before you paste records into any AI tool.
when:
  - A referral coordinator is leaving or going on leave, and a colleague takes over the list.
  - A referral shows "sent" but the receiving clinic never confirmed it.
  - You want to know which referrals are still waiting for a booking date.
  - It is review day and you want what changed since last time.
not_for:
  - A patient's condition or urgency is in question. Go to the qualified clinic contact. This agent does not triage.
  - You want one quick note for the next administrator and no tracking. Use the Handover note writer.
  - You want to send a message or make a booking. This agent only drafts, and you send.
  - You want the actions from a team meeting turned into a list. Use the Executive action register keeper.
you_give:
  - Referral status records with a reference number, a status and dates (from your referral log or practice system; remove names and clinical details first)
  - Proof of sending and receipt, such as a dispatch confirmation, a receipt notice or a portal status
  - Booking confirmations, where there are any (optional)
  - Your clinic's approved follow-up rules, such as how long to wait before chasing and who to contact (from your procedures)
  - The name or role of the incoming administrator, and the contact for clinical questions
  - Last review's record (optional, from the second run on)
you_get:
  - "A referral status handover, with each referral shown at the furthest step your records prove: sent, received, booked or completed"
  - A list of missing confirmations, with the last date anything was confirmed
  - Draft follow-ups for you to send, written to your clinic's rules
  - A short list of items that need a clinician or the clinic contact
  - MISSING lines for each gap, and a record to start the next review from
how_to_use:
  - Add the agent to Claude, ChatGPT or Gemini with its helpers, the Prepare a referral administration handover workflow and the Executive action register keeper. Or download the pack and attach it.
  - Remove names, dates of birth and clinical details from your records first. Keep the reference, status and dates. Paste them with your follow-up rules. From the second review, add last review's record.
  - Read the list of missing confirmations first. Check that no referral is shown as received or booked without proof.
  - Read the draft follow-ups. Edit them, then send them yourself.
  - Take anything about a patient's needs to the clinic contact, not to this agent.
  - In a chat-only tool, copy the record it gives you and paste it in next time. Installing sets up no schedule, so you start each run.
how_it_works:
  - title: Read the last review
    text: "Loads the saved record: referral reference, administrative status, confirmation date and accepted follow-up. A first run builds a baseline with you."
  - title: Keep only what is needed
    text: The Source note summariser pulls out the reference, the status and the confirmation evidence. It leaves out names and clinical details, and flags any it finds in your records.
  - title: Find the proved step
    text: Sent needs proof of dispatch. Received needs a receipt. Booked needs a booking record. Completed needs a completion record. Silence means not confirmed.
  - title: Write the handover
    text: The Prepare a referral administration handover workflow runs the Source note summariser, then the Handover note writer. Pending confirmations and clinician contact points come first.
  - title: Draft and record follow-ups
    text: Writes one draft follow-up for each missing confirmation, to your clinic's rules. When someone accepts a follow-up, the Executive action register keeper records the owner and the date.
  - title: Check and save
    text: Checks that no urgency, outcome or confirmation is invented. Saves the files, a run log and the new record, and keeps the old record.
output_shape: |-
  REFERRAL HANDOVER <review date>, for <incoming administrator>
  <first review, or compared with <last review date>>
  CLINICAL QUESTIONS GO TO: <contact, or MISSING>

  REFERRALS
  <reference> | proved step <sent | received | booked | completed> | proof <record and date> | next confirmation needed <what, or none>

  MISSING CONFIRMATIONS
  <reference> | last confirmed <date> | follow-up draft <ID>

  FOLLOW-UP DRAFTS (not sent)
  <ID> | to <role from your rules> | <message> | send after <date from your rules, or MISSING>

  ACCEPTED FOLLOW-UPS
  <ID> | owner <name> | date <date>

  MISSING  <each gap>
  CHECKS MISSED  <one line each, or none>
  RECORD FOR NEXT REVIEW  <reference | status | confirmation date | accepted follow-up>
output_sample:
  input:
    - Referral status records, with names and clinical details removed
    - Proof of sending and receipt
    - Booking confirmations (optional)
    - Your clinic's follow-up rules
    - The incoming administrator and the contact for clinical questions
    - Last review's record (optional)
  prerequisites:
    - An AI that can read pasted text or files, such as Claude, ChatGPT or Gemini
    - The helper skills added, or the pack attached
    - Your clinic's permission to use these records with an AI tool
  output:
    - name: Referral handover
      contains: Every referral at the furthest step your records prove, with the proof and the next confirmation needed.
    - name: Missing confirmations
      contains: The referrals with no proof of receipt, booking or completion, and the last date anything was confirmed.
    - name: Follow-up drafts
      contains: A draft message for each missing confirmation, written to your clinic's rules. None is sent.
    - name: Clinician contact list
      contains: Items that need the clinic contact, with their role. The agent adds no clinical judgment.
    - name: Accepted follow-ups
      contains: Follow-ups that someone has accepted, with the owner and the date.
    - name: MISSING lines and CHECKS MISSED
      contains: Every fact the records did not give and every check that could not run.
    - name: Record for the next review
      contains: Reference, status, confirmation date and accepted follow-up. No names and no clinical details.
tweaks:
  - what: Follow-up rules
    how: Paste how long you wait before chasing, and who you contact. Without them, the drafts say MISSING.
  - what: Data kept
    how: Decide what the record keeps. A reference and a status is enough for most handovers.
  - what: Status words
    how: Give your own status names, such as letter out or awaiting slot, so they map to sent, received, booked and completed.
  - what: Who to tell
    how: Name the clinic contact for clinical questions, so those lines have an owner.
judge:
  - Sent, received, booked and completed remain distinct; no clinical urgency or patient outcome is inferred.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep one referral log per clinic, with a reference that never changes.
  - Write down what proof counts for each step, such as a portal notice or a letter.
  - Save your approved follow-up wording and paste it in every run, so every draft matches your clinic's style.
  - Record checks that need a person, such as an answer from a clinician, and finish them before you rely on the handover.
works_best_with:
  tools:
    - name: A capable chat AI with file support
      why: Keeps the record between reviews. Only add records your clinic allows you to share with an AI tool.
  inputs:
    - Your referral log export, with identifiers removed.
    - Receipt notices or portal status pages.
    - Your follow-up and escalation procedure.
terms:
  - term: Referral status
    meaning: Where a referral is in the paperwork. It says nothing about the patient's health.
  - term: Confirmation
    meaning: Proof that a step happened, such as a receipt notice.
  - term: Follow-up
    meaning: A message that chases a missing confirmation.
  - term: Handover
    meaning: The note one person gives the next, so they know what is open.
