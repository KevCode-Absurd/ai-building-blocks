new_slug: refinancing-payoff-revision-assistant
name: Refinancing payoff revision assistant
headline: Refinancing payoff revision assistant
summary: Review supplied changes, preserve the last evidence baseline and return only affected calculations and unresolved approval questions.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A linked debt face-to-cash-to-payoff-to-closing sources and uses reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked. Share actual issue price and fees, payoff letter and premium, distinct refinancing fees, acquisition uses, buyer available cash, rollover and sponsor commitments. If principal changed through PIK, include actual coupon terms, capitalization evidence and a revised payoff letter. Supply the previous approved review and actual changed source files with dates.
explain: |-
  A linked debt face-to-cash-to-payoff-to-closing sources and uses reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked.

  Acquisition financing. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need a linked debt face-to-cash-to-payoff-to-closing sources and uses reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked.
  - You work on acquisition financing and need traceable calculations.
  - New evidence needs comparison with the prior dated review.
you_give:
  - Actual issue price and fees, payoff letter and premium, distinct refinancing fees, acquisition uses, buyer available cash, rollover and sponsor commitments. If principal changed through PIK, include actual coupon terms, capitalization evidence and a revised payoff letter. Supply the previous approved review and actual changed source files with dates.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A linked debt face-to-cash-to-payoff-to-closing sources and uses reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked.
  - Original step files, financial assumptions, source coverage and a governing handoff summary.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Check acquisition refinancing funds
    text: Run the governing workflow when A lender sends revised issue proceeds, a payoff letter, fee invoice or confirmed closing date.
  - title: Cash and PIK interest checker
    text: If a capitalized PIK interval explains changed old principal, verify the supported single-period cash/PIK calculation and then obtain the actual revised payoff letter. Never add illustrative accrual to a legally binding payoff amount or count the same charge again as a closing fee.
output_shape: |-
  A linked debt face-to-cash-to-payoff-to-closing sources and uses reconciliation. Include changed inputs, source versions, branch reasons and checks still blocked.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Financing and payoff fees are deducted once; face debt never substitutes for usable funding cash. Never overwrite an accepted baseline with an unapproved scenario; record which branch ran or was skipped.
judge:
  - Financing and payoff fees are deducted once; face debt never substitutes for usable funding cash. Never overwrite an accepted baseline with an unapproved scenario; record which branch ran or was skipped.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
