slug: report-definition-drift-review-assistant
name: Report definition drift review assistant
summary: "Find where a recurring report's metric definition changed. Get a difference table, worked examples and a reporting procedure."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: spreadsheet
    required: false
  - type: question
    required: false
  - type: source_text
    required: false
outputs:
  - type: spreadsheet
  - type: document
uses:
  - source-note-summariser
  - align-recurring-report-metric-definitions
steps:
  - uses: source-note-summariser
    note: "Only when a metric definition lives in a long memo, email thread or meeting note: pulls out the definition as written, with the quotes. It hands over a summary of the definition, so the next step compares what the definition says and not a guess. If the owner or meaning is unclear, the affected comparison stops here and nothing is published as a trend."
  - uses: align-recurring-report-metric-definitions
    note: "Run when a recurring report changes its formula, source grain, time window or exclusions, or a review is due. It uses your reports and source tables, plus the definition summary from step 1 when there is one. It hands over the difference table, the worked examples and the reporting procedure."
schedule: At each user-requested reporting definition review. Installation does not create a schedule.
asks_before:
  - Sending or submitting any message or form
  - Changing a live account, calendar, task, permission or published document
  - Spending money, releasing a payment or signing a contract
  - Starting or changing any recurring schedule
