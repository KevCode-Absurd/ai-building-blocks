steps:
  - uses: source-note-summariser
    note: "Only when a paper is new or corrected: pulls out the changed sections, so only the comparisons they touch are updated. A missing paper gets a source request. It hands over a note of the changed sections."
  - uses: compare-conflicting-research-findings
    note: "Runs when a paper is added or corrected, or you ask for a review. It uses your full papers, plus the changed-section note from step 1 when there is one. It hands over the comparison table, the disagreement map and the evidence gaps."
schedule: On request or when the user supplies a changed paper. Installation does not create a schedule.
