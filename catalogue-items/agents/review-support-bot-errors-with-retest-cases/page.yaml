new_slug: review-support-bot-errors-with-retest-cases
name: Support bot error reviewer
summary: Check your support bot chats for wrong answers. Paste redacted chats and approved help text. You get a failure list, fix requests and retest cases.
job: help-customers
thinking: high
thinking_why: It judges answers against dated policy text and must not call something fixed without a real retest. Use your strongest model and read each finding.
headline: Support bot error reviewer
subhead: Paste redacted chats from your support bot and the help pages and policies it should follow. It finds the wrong answers, links each one to its evidence and groups repeats. You get a failure list, proposed fixes and retest cases. It never edits the bot.
explain: |
  Support chatbot errors rarely come one at a time. The same wrong answer about cancellations shows up in a dozen chats, each worded differently. Fixing one chat and calling it done leaves the rest. And a changed help article does not prove the bot now answers correctly.

  This reviewer starts with your approved help text, with its effective dates, and checks each chat against it. It marks whether the bot answered, whether the answer was right, and whether it passed the customer to a person when it should have. Repeats are merged into one failure, with every chat ID that shows it. Next it looks for shared causes, such as one outdated article, and labels each cause as a guess until you confirm it. Last, it writes one fix request per failure, each with a retest case you can run later.

  It only reads what you give it. It does not touch the live bot, edit your help pages, send replies or set up monitoring. A fix counts as proven only after someone runs the retest and the new answer passes.
when:
  - Your support bot gave a wrong answer on cancellations, refunds or prices, and you want to know how often.
  - You changed a help article and want a list of questions to ask the bot to see whether it now answers correctly.
  - You are about to hand a list of bot problems to the person who maintains the bot and want each one to have evidence.
  - You review bot chats every month and want repeat failures tracked instead of found again from scratch.
not_for:
  - You want the bot or your help pages edited. This reviewer only proposes; a person makes each change.
  - Your chats still carry names, emails or order numbers. Remove them first. It works on redacted copies only.
  - You have no approved help text to check against. It can sort topics and flag risks, but it cannot call an answer wrong.
  - You want to find the questions your help pages miss. Use the Monthly help centre keeper.
  - You want one transcript scored once. Use the Support chatbot conversation review.
you_give:
  - Redacted chat logs with an ID, a date and every turn of each chat (export from your bot tool)
  - The approved help pages, policies and escalation rules the bot should follow, each with its effective date
  - The review scope, meaning the date range, how the chats were picked, and the topics to cover
  - Your earlier findings list, or the word NONE on a first run (optional)
you_get:
  - A failure list with one row per failure, the chat IDs behind it and the approved source it breaks
  - Likely causes, each marked as a guess until confirmed
  - A draft fix request for each failure, ready for the person who maintains the bot
  - Retest cases with the question, the expected facts, the allowed hand-off to a person and the pass test
  - A status for each earlier finding, such as new, unchanged, seen fixed or untested
how_to_use:
  - Export the chats from your bot tool and remove customer names, emails, phone numbers and order numbers. Keep a chat ID and date on each one.
  - Gather the help pages and policies the bot is meant to follow. Put the date each took effect at the top of each.
  - Start a chat in Claude, ChatGPT or Gemini. Attach the agent pack, or paste the skill, then attach your files. Write the scope in a few lines, and paste your earlier findings or NONE.
  - Read the failure list first. Open two chat IDs from it and check that the evidence says what the row claims.
  - Treat every cause as a guess until the person who owns the bot confirms it. Give them the fix requests, not the raw chats.
  - After the bot is changed, run each retest case in the bot yourself. Paste the new answers back and run the agent again to mark what passed. It cannot run the bot for you.
output_sample:
  input:
    - Redacted bot chats with an ID and date on each
    - Your approved help pages and policies, each with its effective date
    - "The review scope: date range, how chats were picked and topics"
    - Your earlier findings list, or the word NONE (optional)
  prerequisites:
    - Chats with names, emails, phone numbers and order numbers already removed
    - An AI chat that can read attached files, or pasted text
  output:
    - name: Scope and limits
      contains: The chats reviewed, the date range and how they were picked, so rates are read as this sample only.
    - name: Failure list
      contains: One row per failure with the chat IDs, what the bot said, the source it breaks and its status.
    - name: Likely causes
      contains: Each cause with evidence for and against, marked as a guess until someone confirms it.
    - name: Draft fix requests
      contains: One request per failure saying what to change, why, and any open question for the bot owner.
    - name: Retest cases
      contains: A question to ask, the facts a right answer needs, the allowed hand-off to a person and a pass test.
    - name: Missing inputs and checks
      contains: Each missing input and what it blocks, plus PASS, FAIL or NOT RUN for every check.
how_it_works:
  - title: Compare answers with evidence
    text: Uses your chats, approved sources and scope to mark each chat as resolved or not and the answer as right or wrong, citing the chat turn and the source. Pasted exports work offline. Hands related failures on as clusters.
  - title: Separate symptoms from likely causes
    text: Looks at when and on what topic the failures bunch up, and at any tickets you linked. It lists evidence for and against each cause, and labels unverified causes as guesses. Hands the ranked list on.
  - title: Create retestable fix requests
    text: Writes one issue per distinct failure, with the redacted question, what the bot said, the source facts it should have used, when to pass to a person, and a pass or fail case. Keeps evidence IDs and open questions.
  - title: Track earlier findings
    text: Merges repeats with your earlier list, and marks each item new, unchanged, seen fixed or untested. A changed article is not counted as a fix.
output_shape: |
  SCOPE AND LIMITS
    <chats reviewed, date range, how picked> | rates apply to this sample only

  FAILURE LIST
    F<n> | <topic> | seen in <chat IDs> | bot said <short quote> | source says <fact, source ID, effective date> | status <new | unchanged | seen fixed | untested>

  LIKELY CAUSES (guesses until confirmed)
    <cause> | evidence for <IDs> | evidence against <IDs>

  DRAFT FIX REQUESTS
    F<n> | what to change | why | open question

  RETEST CASES
    R<n> | question to ask | expected facts | allowed hand-off | source IDs | pass test | NOT RUN

  MISSING AND CHECKS
    <every missing input and what it stops> | PASS, FAIL or NOT RUN for each check
tweaks:
  - what: A narrower review
    how: Name one topic, such as cancellations or refunds, and a date range. The failure list then covers only that topic.
  - what: Earlier findings
    how: Paste last month's list instead of NONE. Repeats are merged, and each earlier item gets a new status.
  - what: Linked tickets
    how: Add the support tickets that came in after a bot chat. They help the cause step see whether customers had to write in again.
judge:
  - Accuracy findings cite approved dated evidence.
  - Rates use only supplied sample with selection limits.
  - Repeats merge by failure intent and evidence.
  - Proposed fixes and actual retests are separate.
works_best_with:
  tools:
    - name: Claude
      why: Handles a long set of chats plus several help pages in one run, and keeps the evidence IDs straight.
    - name: Your bot tool's export
      why: The chat logs come from your own bot tool, such as a Zendesk or Intercom export or a custom bot's log. The agent does not connect to your account.
  inputs:
    - A short list of the questions customers ask most, so the review can check those first
    - The date of your last bot or help page change, so failures can be lined up with it
terms:
  - term: Redacted
    meaning: A chat with names, emails, phone numbers and order numbers taken out.
  - term: Retest case
    meaning: A fixed question to ask the bot again after a change, with the facts a correct answer must contain.
  - term: Escalation
    meaning: The bot passing the customer to a person.
  - term: Failure cluster
    meaning: Several chats that show the same wrong answer.
