slug: reviewer-response-progress-assistant
name: Reviewer response progress assistant
summary: "Turn journal reviewer comments into a response matrix, revision tasks and a list of missing evidence. Nothing is marked done without proof."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: source_text
    required: true
  - type: question
    required: false
  - type: meeting_notes
    required: false
outputs:
  - type: document
  - type: plan
uses:
  - map-journal-reviewer-requests-to-evidence
  - source-note-summariser
steps:
  - uses: map-journal-reviewer-requests-to-evidence
    note: Maps each reviewer comment to the manuscript and the evidence, builds the task register and checks any response draft. Runs when revised evidence, a new comment or a deadline arrives. Hands step 2 the response matrix and task register, so it knows which reviewer request each result must answer.
  - uses: source-note-summariser
    note: Reads the revised section or result when a task is reported done, so the status changes only after it is compared with the reviewer request. Uses the revised section or result you supply and step 1's response matrix. Hands back the updated status of each task.
schedule: At a user-requested response preparation checkpoint. Installation does not create a schedule.
asks_before:
  - Sending or submitting any message or form
  - Changing a live account, calendar, task, permission or published document
  - Spending money, releasing a payment or signing a contract
  - Starting or changing any recurring schedule
