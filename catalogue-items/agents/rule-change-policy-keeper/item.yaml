slug: rule-change-policy-keeper
name: "Rule change policy keeper"
summary: "Give it a rule that changed and your policies. Get gaps found and small redrafts checked for review."
category: agent
type: agent
role: orchestrate
job: analysis
level: advanced
inputs:
  - {type: source_text, required: true}
  - {type: document, required: true}
  - {type: brief, required: false}
outputs:
  - {type: audit_report}
  - {type: copy_draft}
  - {type: plan}
uses: [rule-change-policy-comparer, new-ai-rule-gap-checker, privacy-policy-drift-checker, store-policy-checker, handbook-change-checker, policy-redraft-proposer]
steps:
  - {uses: rule-change-policy-comparer, note: "Every rule change: which of your policies it touches and the gap for each requirement. Run again on each redraft."}
  - {uses: new-ai-rule-gap-checker, note: "Only when the change is a new AI law or rule: gaps against what you do now, and a fix plan."}
  - {uses: privacy-policy-drift-checker, note: "Only when the change involves personal data, or you plan a new use of it: where the privacy policy no longer matches, with fix wording."}
  - {uses: store-policy-checker, note: "Only when a store policy (returns, shipping, terms) is touched: gaps, clashes and unclear wording."}
  - {uses: handbook-change-checker, note: "Only when an employee handbook section is touched: what the redraft affects elsewhere."}
  - {uses: policy-redraft-proposer, note: "For each real gap: a small marked-up draft. Loops until the comparer finds no high gap, at most three rounds."}
schedule: "Each time a law, platform rule or standard that applies to you changes"
asks_before: [applying any redraft to a live policy page or handbook, publishing or sending a policy to staff or customers, telling a regulator or a customer about the change, closing a gap in your tracker]
origin: own
version: 1.0.0
example_pending: true
