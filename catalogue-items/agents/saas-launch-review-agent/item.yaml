slug: saas-launch-review-agent
name: SaaS launch decision agent
summary: Share your product, launch plan and new results. Get a dated decision
  on what to test, revise or keep.
category: agent
boards:
  - business
type: agent
role: orchestrate
job: ops
level: advanced
inputs:
  - type: question
    required: true
  - type: plan
    required: false
  - type: brief
    required: false
outputs:
  - type: plan
uses:
  - copilot-gtm-positioning-strategy
  - copilot-gtm-0-to-1-launch
  - copilot-gtm-product-led-growth
steps:
  - uses: copilot-gtm-positioning-strategy
    note: Run when the buyer or problem is unclear. Hands a positioning plan to the launch step.
  - uses: copilot-gtm-0-to-1-launch
    note: Run when positioning holds but there are no launch results. Takes the positioning plan and hands a first-customer plan to the growth step.
  - uses: copilot-gtm-product-led-growth
    note: Run only when a self-serve funnel has mature results. Takes your brief, plus the earlier plan if there is one, and hands back the activation and expansion plan.
origin: rebuilt
version: 1.0.0
credits:
  - title: Awesome Copilot skill collection
    by: GitHub Copilot community
    url: https://github.com/github/awesome-copilot
    used: The component skills are copied under their own licenses. This catalogue
      adds original orchestration and decision rules.
example_pending: true
