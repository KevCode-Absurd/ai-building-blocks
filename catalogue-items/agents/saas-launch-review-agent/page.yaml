new_slug: saas-launch-review-agent
name: SaaS launch decision agent
summary: Check your SaaS launch results and get a dated decision log that says what to test, revise or keep next, with gaps marked.
job: plan-strategy
headline: SaaS launch decision agent
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your product, launch plan and new results. Get a dated decision on what to test, revise or keep. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  A SaaS launch gives you a lot of numbers and little guidance on what to do next. Should you change the positioning, chase your first customers, or work on activation? Guessing wastes weeks of cash and time.

  This agent reads your product, your launch plan and your dated results. It picks one path: positioning if the buyer is unclear, a first-customer plan if there are no results yet, or an activation and growth review if a self-serve funnel has mature results. It compares your results with targets that you set, and writes a dated decision: test, revise or keep, with the evidence and one next action. It keeps a record of what is known and marks gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You launched a SaaS product and cannot tell if you should change the positioning, find first customers or work on activation.
  - New launch results came in and you need a dated decision on what to test, revise or keep.
  - You want each review to start from the last one, with the evidence and targets saved.
not_for:
  - "You have no product or buyer yet: write down who the buyer is and what problem you solve first, or talk to five likely buyers."
  - "You only want to review one number, such as signups: check it in your analytics tool or a spreadsheet."
  - "You want messages sent, spending approved or accounts changed for you: do those yourself after you review the draft."
you_give:
  - Your product description and who you think the buyer is
  - Your launch plan, with your cash and time limits
  - Your own targets, such as the signup-to-activation rate you need (the agent does not make targets up)
  - Dated results, such as signups, activations and paid customers (if any)
  - Your saved state file from the last run (if any)
you_get:
  - "A dated decision log: test, revise or keep, with the evidence behind it"
  - An updated state file for your next run
  - Missing facts, actions waiting for your approval and one next action
how_to_use:
  - Open Claude, ChatGPT or Gemini and add the full skill pack. Use an AI that can read and save files.
  - Share your product description, who you think the buyer is, and your launch plan. Add any new results with dates (signups, activations, paid customers). Add your saved state file if you have one.
  - Tell it your cash and time limits, and the dates to look at.
  - Ask it to follow the steps and mark any missing facts instead of guessing.
  - Read the decision log. Approve any send, spend or account change yourself before it happens.
output_sample:
  input:
    - Your product description and who you think the buyer is
    - Your launch plan, with any caps on cash and time
    - Your latest launch results, such as signups, activations and paid customers (optional)
    - Your saved state file from the last run (optional)
  prerequisites:
    - An AI that can read your files and save files to a folder you choose
  output:
    - name: agent-state.json
      contains: Product revision, buyer evidence, selected test, cash and time caps, the dates looked at, results seen and decision date.
    - name: decision-log.md
      contains: The dated decision, the evidence behind it, the gaps that remain and one next action.
    - name: Dated state
      contains: "One label for this run: new, changed, unchanged, pending or blocked."
    - name: Branch selected and reason
      contains: Which path was chosen (positioning, first customers or growth) and why.
    - name: Missing facts and approvals
      contains: Facts still needed, actions waiting for your approval and the single next step.
how_it_works:
  - title: Compare saved state
    text: Check which sources, dates or results changed since the last run.
  - title: Choose the needed work
    text: If the buyer or problem is unclear, work on positioning first. If positioning holds but there are no launch results, prepare a first-customer plan. If a self-serve funnel has mature results, assess activation and expansion. Results are mature when at least one full trial or buying cycle has passed since launch and you have signups, activations and paid customers for the same dates. If results are missing, too early or unchanged, return pending or unchanged instead of claiming growth. Keep assumptions separate from real customer outcomes. The branches run in order (positioning, then first customers, then growth). Only one runs each time.
  - title: Save the decision
    text: Record evidence, remaining gaps and one next action. Keep external action status explicit.
output_shape: |-
  Dated decision log
  Updated state and result files
  Missing facts and next action
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
  - Run it again when the next batch of results is in. It starts from your saved state.
  - After a decision to revise positioning, use the SaaS market position adviser. After a decision to test with first customers, use the First customer launch planner.
