slug: store-test-program-runner
name: "Store test program runner"
summary: "Give it your store numbers and test results. It ranks ideas, plans one test, reads it, and picks the next."
category: agent
type: agent
role: orchestrate
job: analysis
level: advanced
inputs:
  - { type: performance_sheet, required: true }
  - { type: question, required: true }
  - { type: store_capture, required: false }
  - { type: voc_reviews, required: false }
outputs:
  - { type: plan }
  - { type: audit_report }
uses: [ store-profit-per-visitor-calculator, heatmap-and-recording-reader, test-idea-ranker, big-swing-test-picker, store-test-readiness-checker, shopify-test-setup-picker, store-test-verdict-maker ]
steps:
  - { uses: store-profit-per-visitor-calculator, note: "Once, then each quarter: the gross profit per visitor every test is judged against. Uses your Shopify and analytics numbers, and hands its baseline to steps 2, 3 and 7." }
  - { uses: heatmap-and-recording-reader, note: "Only when the backlog has fewer than two ideas with two kinds of evidence each: turns what you watched into friction and test ideas. Uses your heatmap and recording notes, with step 1's baseline as the money at stake, and hands the findings to step 3." }
  - { uses: test-idea-ranker, note: "Each time a next test is needed: ranks the backlog by evidence and profit and names the one to run. Uses step 2's findings and the backlog, and hands step 4, 5 and 6 the ranked list." }
  - { uses: big-swing-test-picker, note: "Only when orders are between 30 and 300 a month: swaps the ranked list for bold tests the traffic can prove. Uses your store numbers and step 3's ranked list, and hands on the bold test that is also on that list." }
  - { uses: store-test-readiness-checker, note: "Before every test: repair or test, the sample, the weeks and the main metric. If it says repair first or research only, no test is planned. Uses your store numbers and the test chosen in steps 3 and 4, and hands on its sample, weeks and main metric." }
  - { uses: shopify-test-setup-picker, note: "For the first test, and whenever the plan, tool or page changes: what can be tested and by which route. Uses your Shopify plan and the test chosen in steps 3 and 4, not step 5's report, which only decides whether the test runs." }
  - { uses: store-test-verdict-maker, note: "When a test has ended: can the result be trusted, the lift as a range, the money, and a ship call. It writes the log entry. Uses your test numbers and dates, with the sample and weeks from step 5 and the test plan from step 6." }
schedule: "Every two weeks, and the day a running test ends"
asks_before: [ starting or stopping a test in a testing tool, publishing a test version or a winner to the live store, changing a theme or product page, changing a price, sending an email into a test ]
origin: own
version: 1.0.1
example_pending: true
