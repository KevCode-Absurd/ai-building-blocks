new_slug: student-work-marking-desk
name: Student work marking desk
summary: Mark a batch of student work against one rubric. Get feedback that names the problem, edge cases for you to decide, and class patterns.
job: teach-and-train
thinking: high
thinking_why: It must apply one rubric evenly across thirty pieces, write notes that teach without dictating and know when to leave a call to the teacher. Give it your strongest model.
headline: Student work marking desk
subhead: Give it the task, its goal and a batch of student work. It builds one rubric for you to approve, then marks every piece against it. You get feedback, edge cases and class patterns. You send the grades.
explain: |
  Marking a batch is where good teaching goes to die. The first essay gets twenty minutes and a thoughtful note. The thirtieth gets a tick and "good effort". The same mistake appears in half the pile and gets written out fifteen times instead of becoming Monday's lesson. And the notes drift from naming the problem to writing the fix, so the student learns to wait for it.

  This agent marks every piece the same way. It builds one rubric per task in words a student can read, and you approve it before marking starts. It marks each piece against it, names the weak lines in written work, and sharpens every note so it names a problem and offers a fix only as an example. It leaves the pieces between two levels to you. Then it reads across the batch and tells you which criterion a third of the class missed, with two quotes, and whose level fell since last time. It never sends a grade or a note.
when:
  - You teach a class or run a course and thirty pieces are waiting to be marked.
  - Your feedback has started writing the fix for the student.
  - You want to know what a third of the class got wrong before you plan the next lesson.
  - You mark the same task again and want to see who has grown.
not_for:
  - "You need a grade sent or saved in your school system: do that yourself, because this agent never sends or records a grade."
  - "You mark code, maths problem sets or multiple-choice exams with one right answer: use an answer key or your platform's auto-marking."
  - "You only have one or two pieces and no rubric: read them yourself and write the notes by hand."
you_give:
  - The task and what a good piece shows the student learned
  - Each piece of student work, as text or a file, with a student id
  - Your grade scale and any comment wording your school needs (optional)
  - Your saved rubric from an earlier batch (optional)
  - Past batches of the same class (optional)
you_get:
  - A rubric in plain words for each level, for you to approve before marking
  - A level for each criterion and feedback for every piece
  - The two or three edge cases, with the case for each level
  - Class patterns with two quoted examples each, pointing to the next lesson
  - Students whose level rose or fell since last time
  - Questions about work that looks copied, never a verdict
how_to_use:
  - Open a chat with the agent. In Claude Code, add it as a skill or save it in .claude/agents. In ChatGPT or Gemini, paste it in.
  - Describe the task and what a good piece shows. Before you paste any student work into an AI tool, check your school's data-protection and consent rules. Remove names first and use student ids.
  - On the first batch, read the rubric closely and approve it. It is kept for later batches of this task.
  - Attach the batch. In a chat AI, paste a few pieces at a time. Claude Code can read a folder of files.
  - Settle the edge cases, then read the class patterns before the pieces.
  - Approve the feedback and send grades and notes yourself through your school's system.
output_sample:
  input:
    - The task and what a good piece shows the student learned
    - Each piece of student work, as text or a file, with a student id
    - Your grade scale and any comment wording your school needs (optional)
    - Your saved rubric and past batches (optional, they build up after the first batch)
  prerequisites:
    - An AI chat. Claude Code is better if you want files kept between batches.
    - Student ids instead of names, and your school's data rules followed
  output:
    - name: The batch
      contains: One line with pieces marked, levels reached, edge cases and patterns found.
    - name: Per piece
      contains: A level for each criterion, the gaps, and feedback that names the problem.
    - name: Edge cases
      contains: Pieces between two levels, with the case for each level, left for you to decide.
    - name: Class patterns
      contains: Each criterion a third or more of the class missed, with two quotes and the next lesson.
    - name: Growth
      contains: Students whose level rose or fell since their last piece.
    - name: Questions for the teacher
      contains: Work that looks copied or out of character, written as a question, never a verdict.
    - name: Files and missing
      contains: Each saved file and every MISSING line.
how_it_works:
  - title: Build the rubric once per task
    text: Clear wording at each level, written for a student to read, approved by you before any marking.
  - title: Mark each piece
    text: A level per criterion and the gaps, with pieces on the edge between two levels marked for you.
  - title: Read the writing
    text: For essays and stories, names the weak lines and asks whether the student is fine with them.
  - title: Sharpen every note
    text: Each note names a problem, offers any fix only as an example, and cuts anything generic.
  - title: Find the patterns
    text: Any criterion a third or more missed becomes a class pattern with two quotes and the lesson it points to.
  - title: Log and hand back
    text: Saves each piece and the student rows, then stops. You send.
output_shape: |-
  THE BATCH
    <n> pieces | levels: <n> at <level>, <n> at <level> ... | edge cases <n> | patterns <n>

  PER PIECE
    <student id> | <criterion>: <level> | <criterion>: <level> | gaps: <what>
      Feedback: <note that names the problem> | example of a fix: <optional>
      Weak lines (written work): "<line>" - are you fine with this?

  EDGE CASES (for the teacher)
    <student id> | between <level> and <level> | case for each: <two lines>

  CLASS PATTERNS
    <criterion> missed by <n> of <n> | "<example>" | "<example>" | next lesson: <what>

  GROWTH
    <student id> | <level> -> <level> since <last task>

  QUESTIONS FOR THE TEACHER
    <student id> | <looks out of character because ...> (a question, not a finding)

  FILES AND MISSING
    <each file> | MISSING: <every line>
example:
  business: sprout
  input: |
    [the agent]

    Mark this batch for a retail training course run by Sprout for new
    store partners (practice course and practice learners).
    Task: "Write a 150-word shelf talker that a shopper reads in ten
    seconds and that makes no claim the label does not back." Goal:
    learners can turn label facts into plain, honest shopper copy.
    Allowed facts: 28 daily packs; 21 vitamins and minerals; 6 g prebiotic
    fiber; vegan pectin base; third-party tested; "supports digestion",
    never "fixes" or "cures".
    Batch: 12 pieces attached, ids L01 to L12. Examples:
    - L03: "Fixes bloating fast. 100% of your vitamins in every gummy."
    - L07: "Rip. Tip. Enjoy. 21 vitamins and minerals and 6 g of fiber in
      one small handful. Supports digestion. Vegan." (148 words total)
    - L11: 310 words, accurate facts, no headline.
    Rubric: none yet. Grade scale: pass / merit / not yet. Past batch:
    task 1, attached.
  output: pending
tweaks:
  - what: The goal
    how: Say what a good piece shows the student learned. The rubric is built from it, and the rubric decides everything after.
  - what: Pattern rule
    how: A third of the batch missing a criterion makes a pattern. Set a quarter for a large class.
  - what: Fix examples
    how: Tell it whether notes may include an example of a fix, or must name the problem only.
  - what: Student ids
    how: Use ids, not names. The files stay useful and the risk stays low.
judge:
  - Every piece was marked against the same rubric.
  - No note tells the student what to write.
  - Edge cases were left to you.
  - Patterns are counted and quoted.
  - Nothing was sent or recorded.
test:
  - Give it two pieces that deserve the same level. It should give them the same level.
  - Give it a batch where you know half made the same mistake. It should name the pattern with quotes.
  - Run it twice on the same batch. The levels should match.
improve:
  - Write the goal in one sentence before the first batch, and read the rubric hard before approving it.
  - Set the pattern rule and the fix-example rule for your class.
  - Keep the student rows between tasks, so growth shows.
  - Pair it with the Class quiz reteach keeper, which turns the patterns into the next lesson.
works_best_with:
  tools:
    - name: Claude Code
      why: It can keep one folder per task, one file per piece and the student rows between batches.
    - name: Any good chat AI
      why: Paste the agent, the task and a few pieces at a time. Keep the rubric in a note.
  inputs:
    - Your school or programme's required comment wording
    - Exemplars at each level from a past batch, so the rubric has anchors
