slug: study-plan-progress-review-assistant
name: Study plan progress review assistant
summary: A progress review, adjusted practice plan and the next understanding check.
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: source_text
    required: false
outputs:
  - type: plan
  - type: document
  - type: feedback_notes
uses:
  - choose-a-study-plan-you-can-keep
  - study-understanding-check
steps:
  - uses: choose-a-study-plan-you-can-keep
    note: "Run when: A checkpoint arrives, practice reveals a new gap or available time changes."
  - uses: study-understanding-check
    note: Use study-understanding-check on the learner actual recent answers. When the learner is absent, review only supplied answers and prepare an unrun next check; never invent responses or mastery. Keep successful parts of the plan; rerun the study planning workflow only for missed prerequisites, persistent errors or changed time. Mark the review incomplete if no practice evidence is available.
schedule: Weekly or at the learner agreed checkpoint.
asks_before:
  - Sending or submitting any message or form
  - Changing a live account, calendar, task, permission or published document
  - Spending money, releasing a payment or signing a contract
  - Starting or changing any recurring schedule
