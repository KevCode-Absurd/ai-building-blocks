new_slug: study-plan-progress-review-assistant
name: Study plan progress review assistant
headline: Study plan progress review assistant
summary: Review your study progress against your plan. See what is on track and what keeps going wrong, then get an adjusted plan and the next check.
job: study-and-practice
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your study goal, your plan, the sessions you finished and your real practice answers. It finds what is on track and which mistakes repeat. You get an adjusted plan and the next understanding check.
explain: |-
  A study plan made last month rarely fits this week. Your free time changes. Some topics go faster than you expected. Others keep tripping you up. This agent reviews your plan against what you did and what you answered.

  It treats practice answers as evidence and confidence as a feeling. If you say you know a topic but your answers show the same mistake twice, the topic stays on the plan. It keeps the parts of the plan that work. It changes the plan only when a prerequisite was missed, a mistake keeps coming back or your free time changed.

  It never makes up answers. If the learner is not there, it reviews only the answers you give it and writes the next check without running it. With no practice answers at all, the review is marked incomplete.
when:
  - You have a study plan and a week of sessions behind you, and want to know if the plan still fits.
  - A practice test showed a gap you did not expect.
  - Your free time changed, for example a new job or a closer exam date.
  - You tutor or parent a learner and want a weekly review built from their real answers.
not_for:
  - You have no plan yet. Use the Study roadmap and weekly session planner workflow.
  - You want to check one topic today. Use the Study understanding checker on its own.
  - The learner has no practice answers yet. Do a session first, then come back to this.
you_give:
  - Your learning goal and your exam or deadline date
  - Your current study plan
  - The sessions you finished, with dates and topics
  - Your real practice answers or scores, by topic
  - The hours you have free now
  - Your last review file (optional)
you_get:
  - A dated progress review showing what is done, on track and behind
  - The mistakes that keep repeating, taken from your real answers
  - An adjusted plan for the next one to two weeks, with what was kept, moved or dropped
  - The next understanding check, written but not run
  - A list of what is missing, and a review log for next time
how_to_use:
  - Download the pack from this page and add it to your AI. If you cannot add it, paste SKILL.md into a new chat.
  - Paste or attach your goal, deadline, current plan and the sessions you finished. Add your real practice answers, even if some are wrong.
  - Tell it how many hours you have free now. Attach your last review if you have one.
  - Say "Review my progress and adjust the plan. Do not invent any answers." Your AI asks once for anything missing.
  - Read progress-review.md and error-patterns.md first. Check that the mistakes it lists match your own answers.
  - Do the next check in next-check.md, then bring your answers to the next review.
how_it_works:
  - title: Read the last state
    text: It keeps your goal, topic, last practice date, observed mistakes and the next check you planned. The first run sets a baseline.
  - title: Check what triggered the review
    text: A checkpoint is due, practice showed a new gap or your free time changed.
  - title: Read your real answers
    text: It uses the Study understanding check on your recent answers. Without answers, it reviews only what you supplied.
  - title: Decide what to change
    text: It keeps what works. It reworks the plan only for a missed prerequisite, a repeated mistake or new free time.
  - title: Write the next check
    text: It prepares questions on the weak topics. It does not run them or invent your answers.
  - title: Save the review
    text: It records what changed, what is missing and the state for next time.
output_shape: |-
  PROGRESS REVIEW (<date>)
    Goal <goal> | Deadline <date> | Hours free now <number>
    Done <topics and dates> | On track <topics> | Behind <topics and by how much>

  MISTAKE PATTERNS
    <topic> | <the mistake> | <how many times it showed up> | <where in your answers>

  ADJUSTED PLAN (next <1 to 2> weeks)
    <session> | <topic> | <kept, moved, added or dropped> | <why>

  NEXT CHECK (not yet run)
    <question or task> | <topic> | <what a good answer shows>

  MISSING AND LOG
    MISSING lines | CHECKS MISSED | what changed since the last review | next review date
output_sample:
  input:
    - Your goal, deadline and current study plan
    - The sessions you finished and your real practice answers
    - The hours you have free now
    - Your last review file (optional)
  prerequisites:
    - A study plan, such as one from the Choose a study plan you can keep workflow
    - An AI that can read files, such as Claude, ChatGPT or Gemini
  output:
    - name: progress-review.md
      contains: What is done, on track and behind against your plan, with dates.
    - name: error-patterns.md
      contains: The mistakes that repeat across your real answers, and which topic each belongs to.
    - name: adjusted-plan.md
      contains: Your next one to two weeks of sessions, marking what was kept, moved, added or dropped and why.
    - name: next-check.md
      contains: Questions on your weak topics, written but not run, with what a good answer shows.
    - name: review-log.md
      contains: Missing facts, checks not done, what changed since last time and the state for the next review.
tweaks:
  - what: Real answers
    how: Paste the answers you gave, including wrong ones. Without them the review stays incomplete.
  - what: Dates
    how: Put a date on every session and every practice result. The agent cannot see a trend without dates.
  - what: Free hours
    how: Give the hours you really have now, not the hours you planned. The plan is cut to fit them.
improve:
  - Add your teacher's or course's own topic list, so the plan uses their wording.
  - Keep each review log with your notes. Next time the agent starts from your real history.
  - Add a rule for your own pass mark, such as "two correct answers in a row before a topic is done".
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file upload
      why: It reads your plan, your answers and your last review together.
  inputs:
    - Past exam papers or practice sets you have already done.
    - Your teacher's or tutor's feedback.
    - A note on when in the day you study best.
terms:
  - term: Understanding check
    meaning: A short set of questions that shows what you can do without looking at your notes.
  - term: Prerequisite
    meaning: A topic you must know before the next one makes sense.
  - term: Review log
    meaning: A file that records what changed and what is missing, so the next review can compare.
judge:
  - Plan changes follow observed errors and available time; confidence is not treated as mastery.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
