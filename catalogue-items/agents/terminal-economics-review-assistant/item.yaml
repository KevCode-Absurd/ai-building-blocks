    required: false
needs_mode: manual
uses:
  - link-operating-growth-to-terminal-reinvestment
  - economic-profit-fade-schedule
steps:
  - uses: link-operating-growth-to-terminal-reinvestment
    note: Run this when a revised operating forecast, a new view of the company's edge or a new terminal-value assumption arrives. Compare its source and drivers with the accepted model, fund the growth with reinvestment and back out the return the terminal value assumes. Hands step 2 the linked workbook with the funded terminal value, WACC and first stable-year NOPAT.
  - uses: economic-profit-fade-schedule
    note: Run this only when a dated source shortens the period of excess returns. Build a separate finite case, and expand the schedule when capital changes instead of using the constant-capital example. Uses step 1's workbook for NOPAT, WACC and capital, plus your dated source on how long the excess returns last.
