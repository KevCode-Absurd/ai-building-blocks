slug: terminal-economics-review-assistant
name: Terminal economics review assistant
summary: Check that long-term growth is paid for by reinvestment when a forecast changes. Get the corrected terminal value and the gap against your limit.
category: agent
type: agent
role: orchestrate
job: ops
level: advanced
