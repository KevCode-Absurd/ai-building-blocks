slug: test-failure-repair-loop
name: "Test failure repair loop"
summary: "Point it at a red test suite. Get capped rounds of fixes, re-checked each time, until green or stopped."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: codebase, required: true}
  - {type: test_report, required: false}
  - {type: question, required: true}
outputs:
  - {type: code_change}
  - {type: test_report}
uses: [failing-test-fixer, ci-failure-fixer, flaky-test-fixer, bug-root-cause-finder, fix-loop-breaker, lint-and-type-check-runner]
steps:
  - {uses: failing-test-fixer, note: "Each round, for failures that show up when you run the tests yourself: group them by cause and fix one group at a time. Hands the next step the changed working copy and the test result for the round."}
  - {uses: ci-failure-fixer, note: "Only when the tests pass on your machine but fail in the pull request check: find the cause before any edit. Works on the same code, with the earlier round's changes and test result."}
  - {uses: flaky-test-fixer, note: "Only for browser tests that pass sometimes and fail sometimes: find the cause and fix it, never retry until green. Works on the same code and the failing test output from the last round."}
  - {uses: bug-root-cause-finder, note: "Only when the cause of a group is not clear after one try: prove the cause before editing again. Takes the failing group from the last round as its brief, with that round's test result."}
  - {uses: fix-loop-breaker, note: "Only when the same failure comes back after a fix: a three-try budget with proof, and a rollback. Takes the earlier rounds' changes and results so it can see the failure repeat."}
  - {uses: lint-and-type-check-runner, note: "Once, when the tests are green: the project's own checks, so the fixes did not break something else. Checks the code with all the rounds' changes and hands back the check result."}
schedule: "Whenever the test suite goes red, or a pull request check fails"
asks_before: [committing or pushing, editing or deleting an expected value in a test, skipping or disabling a test, changing build or test settings, upgrading or installing packages, editing files outside the failing area]
origin: own
version: 1.0.0
example_pending: true
