slug: tiktok-ads-weekly-account-keeper
name: "TikTok Ads weekly account keeper"
summary: "Give it your weekly TikTok Ads exports. Get each ad called keep, fix or kill and a change list to approve."
category: agent
type: agent
role: orchestrate
job: ads
level: intermediate
inputs:
  - {type: performance_sheet, required: true}
  - {type: product_data, required: true}
  - {type: store_capture, required: false}
  - {type: brand_brain, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
uses: [product-margin-checker, tiktok-ads-account-setup-checker, tiktok-ad-test-reader, tiktok-spark-ad-picker, platform-roas-reality-check, tiktok-ads-account-auditor, next-dollar-budget-allocator]
steps:
  - {uses: product-margin-checker, note: "Once, then reused: the break-even cost per sale every later call is measured against."}
  - {uses: tiktok-ads-account-setup-checker, note: "First run only, or after a setup change: missing steps to fix before any ad is judged."}
  - {uses: tiktok-ad-test-reader, note: "Every week: keep, fix or kill for each ad that has run three days or more."}
  - {uses: tiktok-spark-ad-picker, note: "Only when organic or creator posts at least five days old are supplied: which to boost as Spark ads."}
  - {uses: platform-roas-reality-check, note: "First run of each month, or when TikTok shows a sudden jump in return: a truer return and a trust level."}
  - {uses: tiktok-ads-account-auditor, note: "First run of each month: a full check of pixel, creative, audiences and bids."}
  - {uses: next-dollar-budget-allocator, note: "Only when the gates pass: how to split a budget raise."}
schedule: "Every Monday morning, after last week's data is in"
asks_before: [raising or cutting budgets, pausing or turning on ads, boosting a post as a Spark ad, changing bids, audiences or targets]
origin: own
version: 1.0.0
example_pending: true
