slug: track-agent-injection-controls-and-retest-evidence
name: Agent injection evidence review assistant
summary: "Get safe prompt injection test cases for your AI agent, a control gap list and retest records. Tests run only with the owner's written approval."
category: agent
type: agent
role: orchestrate
job: ops
level: advanced
inputs:
  - type: document
    required: true
  - type: codebase
    required: false
  - type: question
    required: false
outputs:
  - type: security_report
  - type: test_report
  - type: plan
uses:
  - prompt-injection-defender
  - ai-agent-attack-tester
steps:
  - uses: prompt-injection-defender
    note: Use architecture and controls to map untrusted channels, protected assets, sinks and invariants. Record safeguards as missing, planned, implemented or verified with enforcement point and evidence need. Hands step 2 the boundary map and control table (a security report).
  - uses: ai-agent-attack-tester
    note: Use boundary map, exact written scope, fixtures and limits for uniquely identified tests. Run only owner-approved cases in approved environment. Preserve results, blocked/error cases, limits and cleanup. Uses step 1's boundary map and control table as the scope to test. Hands step 3 the findings and result ledger.
  - uses: prompt-injection-defender
    note: Use observed failures and authorized remediation diff to update control states/regressions. Require fresh evidence for verified state. Return residual paths, monitoring owners and explicit retest handoff. Reads step 1's control table and step 2's findings and results, plus the fix you made, and updates each control's state.
execution: coordinator
package_files: all
origin: own
example_pending: true
version: 1.0.0
