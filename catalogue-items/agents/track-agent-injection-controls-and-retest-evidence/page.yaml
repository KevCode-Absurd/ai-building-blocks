new_slug: track-agent-injection-controls-and-retest-evidence
name: Agent injection evidence review assistant
headline: Agent injection evidence review assistant
summary: Get safe prompt injection test cases for your AI agent, a control gap list and retest records. Tests run only with the owner's written approval.
job: secure-code
subhead: Give it a map of your AI agent and the written scope for testing. It lists where untrusted text can reach the agent, plans safe test cases with fake data and records every result. After a fix, it tracks the retest.
explain: |-
  Prompt injection is when text your AI agent reads, such as an email, a web page or an uploaded file, tells it to do something its owner never asked for. Telling the model to ignore that text helps a little. It is not a safe wall. The real controls sit outside the model: limited tool access, checks on what leaves, and a person approving risky actions.

  This assistant keeps one record for one approved round of testing. First it maps every path from untrusted text to a tool, a secret or an output. It writes the rules that must always hold, such as "an email body never decides who gets a message". Then it plans test cases that use fake accounts and harmless canary values. Every case ends as pass, fail, blocked, error or not run, and the counts use the full plan as the total, so a skipped case cannot hide. After a fix, a control moves to "verified" only when there is fresh test evidence.

  It will not widen your scope, touch another customer's data or fetch real secrets. With no written approval it writes a planning checklist and runs nothing. A design review cannot prove a defense works, so it never says "protected" from a diagram alone.
when:
  - You are about to give an AI agent tools such as email, files or a database and want to know where hostile text could steer it.
  - Your agent reads outside content like web pages, support tickets or uploaded documents.
  - A security reviewer asks for evidence that your injection controls work.
  - You fixed a hole and need a retest that points back to the failure it came from.
not_for:
  - You do not own the agent or have no written approval to test it. You get a planning checklist only, and nothing is run.
  - You want to test someone else's agent, a live production system or another customer's data. It stops.
  - You want a design review and fix plan with no tests. Use the Prompt injection defender.
  - You already have an approved test plan and only want to run it. Use the AI agent attack tester.
  - You want a general check of your code and packages. Use the Project secrets and package risk review.
you_give:
  - A map of your agent. List what it reads, each tool and its access, its memory and where its output goes (from your architecture notes).
  - Written approval to test. Name the agent's owner, the exact system and accounts, the dates, the limits and a person who can stop the test.
  - Safe test data, such as fake accounts, canary values that grant no access and the places test output may go
  - Your current safeguards, earlier findings and a few normal tasks the agent must still do (optional)
  - The agent's version or configuration ID (optional)
  - Results from tests you already ran (optional)
you_get:
  - A boundary map of every place untrusted text can reach the agent, what it protects and the rules that must always hold
  - A control table that marks each safeguard missing, planned, implemented or verified
  - A test case plan with a unique ID for each case
  - A results ledger with pass, fail, blocked, error or not run for every planned case
  - Findings with repeats merged, a fix for each and a retest queue
  - A cleanup list of test accounts, files and canary values
how_to_use:
  - Download the pack and add it to your AI, or paste SKILL.md into a new chat. Claude, ChatGPT and Gemini can plan and record. A plain chat cannot run the tests. You run each case in your own approved test setup.
  - Attach your agent map and your written approval. Add your test data and safeguards. If you have no written approval, say so. You then get a planning checklist only.
  - Say "Plan the cases and record results. Run nothing against any system." Your AI asks once for anything missing.
  - Open boundary-manifest.md first. Check that it lists every input and every tool. Add anything it missed.
  - Run each approved case in your test setup, then paste the result back. The AI records it as pass, fail, blocked or error. A case you did not run stays "not run".
  - After a fix, give it the change and your new test result. Only then does a control become verified. Keep retest-queue.md for the next round.
how_it_works:
  - title: Check the approval first
    text: It looks for the owner, the exact target, the dates, the limits and a stop contact. If any is missing, it writes a planning checklist and marks every case not run.
  - title: Map the boundaries
    text: It lists each input, tool, secret, memory and output, and marks which inputs an outsider can write to.
  - title: Write the rules that must always hold
    text: Each rule is something code can enforce, such as "retrieved text cannot change which tools are allowed". A rule that rests only on prompt wording is marked weak.
  - title: Plan safe cases
    text: Each case gets an ID, the input it uses, the rule it tests, the fake data it needs, the safe result to expect and when to stop. It adds normal tasks to check the agent still works.
  - title: Record every result
    text: It logs pass, fail, blocked, error or not run for each case, with the evidence you supplied. The total is the full plan, so unrun cases show.
  - title: Merge findings and track cleanup
    text: Failures with the same cause become one finding with a fix at the right place. It lists test accounts and files to remove, and says unknown until you confirm.
  - title: Review fixes and hand off the retest
    text: It updates each control against the same rules, asks for fresh evidence before it says verified, and lists what to retest and who watches for it.
output_shape: |-
  APPROVAL  <owner> | <target and accounts> | <window> | <limits> | <stop contact> | <present, partial or missing>
  CONFIGURATION  <agent version or ID, or MISSING>

  BOUNDARY MAP
    INPUTS  <channel> | <who can write to it> | <untrusted or trusted>
    TOOLS  <tool> | <access it has> | <identity it uses> | <what it can change>
    PROTECTED  <secret, private data or action> | <where it lives>
    OUTPUTS  <where results go> | <approved destination or not>

  RULES THAT MUST HOLD
    <rule> | <enforced in code, or prompt wording only>

  CONTROL TABLE
    <control> | <rule it supports> | <missing, planned, implemented or verified> | <where it is enforced> | <evidence needed>

  CASE PLAN
    <case ID> | <input used> | <rule tested> | <fake data> | <safe result expected> | <stop condition> | <approved yes or no>

  RESULTS LEDGER  <n> planned | <n> pass | <n> fail | <n> blocked | <n> error | <n> not run
    <case ID> | <status> | <evidence> | <time>

  FINDINGS  <finding> | <cases> | <cause> | <fix and where> | <owner or MISSING>
  CLEANUP  <item to remove> | <confirmed removed or unknown>
  RETEST QUEUE  <case ID> | <after which fix> | <who watches>
  MISSING  <each gap and what it blocks>
  CHECKS MISSED  <one line each, or none>
output_sample:
  input:
    - A map of your agent, with inputs, tools, access and outputs
    - Your written approval to test it
    - Safe test data, such as fake accounts and canary values
    - Your current safeguards and earlier findings (optional)
    - Results from tests you already ran (optional)
  prerequisites:
    - An AI to plan and record, such as Claude, ChatGPT or Gemini
    - Your own approved test setup to run the cases
    - Written approval from the agent's owner
  output:
    - name: boundary-manifest.md
      contains: Every input, tool, secret and output, which inputs outsiders can write to, the rules that must hold and each control's state.
    - name: case-plan.md
      contains: Each test case with its ID, input, rule tested, fake data, expected safe result and stop condition.
    - name: result-ledger.md
      contains: Pass, fail, blocked, error or not run for every planned case, with evidence and counts against the full plan.
    - name: findings.md
      contains: Failures merged by cause, each with the cases, the fix and where to enforce it.
    - name: cleanup-status.md
      contains: Test accounts, files and canary values to remove, each marked removed or unknown.
    - name: retest-queue.md
      contains: Cases to run again after each fix, who watches for the problem and what stays open.
tweaks:
  - what: Scope
    how: Test one agent and one environment per round. A second agent gets its own record.
  - what: Cases
    how: Start with the three inputs an outsider can write to most easily, such as an inbound email, a web page and an uploaded file.
  - what: Fixes
    how: Give the real change, not a description. A control turns verified only after a new test result.
judge:
  - Authorization, target and configuration match every executed case.
  - Synthetic fixtures and bounded destinations protect real data.
  - Implementation and verified behavior have separate evidence.
  - All planned case statuses and cleanup are retained.
improve:
  - Add your own normal tasks, so every fix is checked against what the agent must still do.
  - Keep the results ledger from each round. The next round then shows which cases are new.
  - Write each rule once in your own words and give it each time, so findings use the same terms.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file upload
      why: It reads your architecture notes and approval together and keeps a case and result table.
    - name: Your own test environment
      why: The cases must run somewhere safe, with fake accounts. The AI only plans and records.
  inputs:
    - A diagram or notes of how the agent is built.
    - A named person who can stop a test.
    - The agent's logs for the test window.
terms:
  - term: Prompt injection
    meaning: Text an agent reads that tries to make it do something its owner did not ask for.
  - term: Canary
    meaning: A fake value placed where it should never appear. If it shows up, something leaked.
  - term: Trust boundary
    meaning: The line between text you control and text an outsider can write.
  - term: Control
    meaning: A safeguard, such as a tool limit or an approval step, that stops a bad outcome.
  - term: Retest
    meaning: Running the same case again after a fix to see if it now passes.
thinking: high
thinking_why: It reasons about how an agent could be steered, keeps strict records of every test and must not claim a defense works without evidence.
