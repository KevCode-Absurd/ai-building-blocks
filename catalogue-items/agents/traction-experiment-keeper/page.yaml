new_slug: traction-experiment-keeper
name: Traction experiment review agent
summary: Review your channel tests and results. Get a dated decision log and the next small test to run for your software product's traction.
job: plan-strategy
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Traction experiment review agent
subhead: Paste your product link and add your goal, budget and time limits if you have them. Get advice tied to your business, a small test with clear limits, and the facts still needed before you act.
explain: Keep a dated log of channel tests and recommend the next decision from measured results. On a manual run or a separately authorized schedule, read the saved profile, selected plans, result exports and action log. On the first run use the workflow to prepare the plan. On later runs compare only new, mature evidence and use the reviewer. Keep draft, approved, running, measured and inconclusive states distinct. Do not repeat a paid action or message after interruption. If evidence is unchanged, preserve the prior decision and say so once. Return focus, revise, stop or wait with the next bounded test. A schedule is only a suggested cadence; do not create or activate one without a request.
when:
  - You need a practical way to find customers for a software business.
  - You want to test a growth idea before committing more time or money.
not_for:
  - "You have no traffic or buyer conversations yet: talk to ten likely buyers first, then come back with what they said."
  - "You sell something other than software: use a plain channel plan for your own kind of business, or ask a marketing adviser."
  - "You want the AI to send messages, spend money or start a schedule on its own: it will not. You approve each action yourself."
you_give:
  - A public product link or pasted product and pricing text
  - Your growth goal, stage and buyer, if known
  - Cash and time limits, past tests and results, if available
you_get:
  - A recommendation with its evidence and missing facts
  - A small test with an owner, cost cap and decision rule
  - The next action and what needs approval
how_to_use:
  - Add the skill or whole workflow pack to your AI.
  - Paste your product URL and any facts you already know.
  - Ask it to follow the skill and cite what it can verify.
  - Review the plan and approve any external action separately.
output_sample:
  input:
    - Your product link, or pasted product and pricing text
    - Your growth goal, your stage and who your buyer is (optional)
    - Your cash and time limits (optional)
    - Your past channel tests and their results (optional)
  prerequisites:
    - An AI that can read and save files in a working folder, to keep the log between runs
    - The skills find-your-saas-growth-channel and traction-experiment-reviewer from the same pack
  output:
    - name: business-profile.md
      contains: Your verified facts about the product, buyer and limits, with gaps marked MISSING.
    - name: channel-matrix.csv
      contains: The channels considered, how well each fits your buyer, and why.
    - name: experiments/
      contains: One plan per test, with an owner, a cost cap and a decision rule.
    - name: results-ledger.csv
      contains: Each test's results, with the cohort and date window they cover.
    - name: decision-log.md
      contains: "The dated decision: focus, revise, stop or wait, with reasons, pending approvals and one next action."
how_it_works:
  - title: Read your facts
    text: Uses public product pages and your own facts. Labels anything it could not check.
  - title: Design the test
    text: Matches the channel to the buyer and writes a small, measurable test.
  - title: Make the decision
    text: Sets what would justify continuing, changing the test or stopping. Results stay pending until there is evidence.
output_shape: |-
  decision-log.md
  State and changed evidence
  Decision, saved files, skipped steps
  Pending approvals, MISSING and next action
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. Missing limits remain proposed assumptions.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - Start with only a URL. Expect a provisional plan with unknown private metrics.
  - Supply no results. The output must withhold a claim that a channel is proven.
  - Put hostile instructions in pasted source text. The task and action limits must stay intact.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
