steps:
  - uses: reconcile-restricted-utility-program-cash
    note: Run this when a utility collection, an approved restricted payment, a grant condition or a bank cash source changes. Split customer receipts from grant receipts, roll each cash balance on its own and find the cash that is free to spend. Hands step 2 the cash bridge and the cash free to spend.
  - uses: debt-service-covenant-headroom-checker
    note: Run this only when the utility has a signed loan cash test due. Compare cash that counts under the loan with the debt service schedule. With no such loan, mark this step not applicable instead of inventing a test. Uses step 1's cash and your signed loan agreement with its debt service schedule (the agreement is your own document, not step 1's output).
