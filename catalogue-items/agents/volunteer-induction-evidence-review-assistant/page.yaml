new_slug: volunteer-induction-evidence-review-assistant
name: Volunteer induction evidence review assistant
headline: Volunteer induction evidence review assistant
summary: Check each volunteer's induction records against their role. See what is missing and where supervision has gaps. The AI never clears anyone.
job: teach-and-train
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your volunteer roles, your approved induction rules and the records of what each volunteer has done. It lists what is evidenced, what is missing and where supervision has gaps. A named person in your group still signs off any clearance.
explain: |-
  Volunteer induction goes wrong in a quiet way. Someone attends one session and is treated as ready. A supervisor leaves and nobody knows what the volunteer has shown. This agent checks your records against what each role needs, and shows the gaps.

  It reads your approved rules for each role and the records you give it. Each requirement gets one status: evidenced, attendance only, missing or overdue. Attending a session is never treated as clearance. The agent cannot decide that a person is safe to work with children or vulnerable people. A named person in your group, such as the safeguarding lead, makes and records that decision.

  When a supervisor changes, it writes a short handover of what the volunteer has shown and what is still open. It keeps personal details to a minimum and never asks for sensitive records.
when:
  - A new volunteer role is approved, or an existing role changes.
  - You need to know who has finished induction and who has not, before a shift or an event.
  - A supervisor is leaving and the volunteers need a clean handover.
  - A trustee, funder or partner asks how you induct volunteers.
not_for:
  - You have no induction checklist yet. Use the Build a volunteer induction checklist workflow.
  - You need a decision on whether someone is safe to volunteer. Your named safeguarding lead makes that call, not an AI.
  - You only need a handover note for one supervisor change. Use the Handover note writer.
you_give:
  - Your volunteer roles and what each one does
  - Your approved conduct, safeguarding and induction rules for each role
  - Records of what each volunteer has done, with dates and who signed it off
  - Who supervises whom, and when
  - The name or role of the person who signs off clearance
  - Your last review file (optional)
you_get:
  - An induction checklist for each role, tied to your own rules
  - A status for each volunteer and requirement, such as evidenced, attendance only, missing or overdue
  - A practice plan with supervised practice for each role
  - A list of supervision gaps
  - A short handover note when a supervisor changes
  - A review log for your next review
how_to_use:
  - Download the pack from this page and add it to your AI. If you cannot add it, paste SKILL.md into a new chat.
  - Attach your role descriptions and your approved induction and safeguarding rules. Say who signs off clearance.
  - Add your records using initials or an ID for each volunteer. Do not paste background check results or health details.
  - Say "Review induction evidence by role. Do not mark anyone cleared." Your AI asks once for anything missing.
  - Read induction-status.md first. Check each "attendance only" and "overdue" line against your own records.
  - Give the status file to your named sign-off person. Only they record clearance. Keep review-log.md for next time.
how_it_works:
  - title: Read the last state
    text: It keeps the role version, requirement IDs, evidence seen and sign-off status, without sensitive detail. The first run sets a baseline.
  - title: Check what changed
    text: A review runs when an approved role or required evidence changes, or when you ask for one.
  - title: Build the checklist per role
    text: It turns your approved rules into numbered requirements for joining, briefing, access, supervision and escalation. It adds no rule you did not supply.
  - title: Set a status for each requirement
    text: Each one is evidenced, attendance only, missing, overdue or ready for sign-off. Nobody is marked cleared.
  - title: Plan practice and spot gaps
    text: It plans supervised practice for each role and lists volunteers or shifts with no supervisor.
  - title: Write a handover if needed
    text: When a supervisor changes, it lists what the volunteer has shown and what is still open.
  - title: Save the review
    text: It records what changed and what is missing for next time.
output_shape: |-
  INDUCTION CHECKLIST (<role>)
    <requirement ID> | <requirement> | <source rule> | <due by>

  INDUCTION STATUS (<date>)
    <volunteer ID> | <requirement ID> | <Evidenced, Attendance only, Missing, Overdue or Ready for sign-off> | <record and date> | <next step>
    Sign-off owner <name or role> | Cleared by them: <recorded in your records, or not recorded>

  PRACTICE PLAN
    <role> | <what to demonstrate> | <who watches> | <when>

  SUPERVISION GAPS
    <volunteer, shift or role> | <gap> | <who could cover, for you to decide>

  HANDOVER (only if a supervisor changed)
    Shown so far <list> | Still open <list>

  REVIEW LOG
    MISSING lines | CHECKS MISSED | changes since last review
output_sample:
  input:
    - Your volunteer roles and your approved induction and safeguarding rules
    - Records of what each volunteer has done, by ID, with dates and sign-offs
    - Who supervises whom, and when
    - Your last review file (optional)
  prerequisites:
    - A named person who signs off clearance, such as your safeguarding lead
    - An AI that can read files, such as Claude, ChatGPT or Gemini
  output:
    - name: induction-checklist.md
      contains: Numbered requirements for each role, each tied to the rule it comes from.
    - name: induction-status.md
      contains: Each volunteer's status for each requirement, with the record behind it and the next step.
    - name: practice-plan.md
      contains: What each volunteer should demonstrate in supervised practice, who watches and when.
    - name: supervision-gaps.md
      contains: Volunteers, shifts or roles with no supervisor, with options for you to decide.
    - name: handover-note.md
      contains: Only when a supervisor changes. What the volunteer has shown and what is still open.
    - name: review-log.md
      contains: Missing facts, checks not done and the state for the next review.
tweaks:
  - what: Your own rules
    how: Attach the real documents your group approved. The agent adds no safeguarding rule of its own.
  - what: The sign-off person
    how: Name the role that signs off clearance. Every status line points to them.
  - what: Records
    how: Give dates and who signed each item off. A record with no date or signer counts as attendance only.
improve:
  - Add your group's own wording for each requirement, so the checklist matches your policies.
  - Keep each status file with your volunteer records, so the next review starts from your real history.
  - Add a rule for how long induction items stay valid, such as a yearly refresh, if your policy has one.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file upload
      why: It reads your rules, your records and your last review together.
  inputs:
    - Your volunteer handbook or code of conduct.
    - Your shift or rota list, so supervision gaps show up by shift.
    - The sign-off dates your group already holds.
terms:
  - term: Induction
    meaning: The set of steps a new volunteer completes before working on their own.
  - term: Attendance only
    meaning: The volunteer came to a session, but no record shows they demonstrated the skill or were signed off.
  - term: Safeguarding lead
    meaning: The person in your group who is responsible for keeping children and vulnerable adults safe.
  - term: Clearance
    meaning: A decision by a named person that a volunteer may start the role. This agent never makes it.
judge:
  - Access and responsibilities stay within approved roles; safeguarding clearance is never inferred from training attendance.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
next: [build-a-volunteer-induction-checklist, handover-note-writer]
