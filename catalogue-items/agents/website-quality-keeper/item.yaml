slug: website-quality-keeper
name: "Website quality keeper"
summary: "Check your site each week. See what got slower or harder to find since last time, with a ranked fix list."
category: agent
type: agent
role: orchestrate
job: page
level: intermediate
inputs:
  - {type: web_page, required: true}
  - {type: codebase, required: false}
  - {type: page_speed_report, required: false}
  - {type: spreadsheet, required: false}
  - {type: code_change, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
uses: [web-page-speed-tuner, wcag-accessibility-fixer, page-metadata-fixer, search-indexing-auditor, page-speed-fixer, page-issue-sorter]
steps:
  - {uses: web-page-speed-tuner, note: "Every run: where each key page is slow and why, against last run's saved numbers. Hands on: the speed findings, which go to the speed fixer (step 5) and the final sort (step 6)."}
  - {uses: wcag-accessibility-fixer, note: "Every run if you give the site code: scan only. Finds access problems by severity. Uses your site code, not step 1's output. Hands on: the access problems, for the final sort. Fixes are made only after a yes."}
  - {uses: page-metadata-fixer, note: "Every run, and always after new pages go up: missing titles, descriptions, share cards and canonical links. Uses your pages or site code, not step 2's output. Hands on: the tag problems, for the final sort."}
  - {uses: search-indexing-auditor, note: "Every run: pages that are not indexed, broken links, redirect chains and sitemap errors. Uses your site, code folder or Search Console export, not step 3's output. Hands on: the indexing problems, for the final sort."}
  - {uses: page-speed-fixer, note: "Only when speed or the PageSpeed scores got worse than last run: fix batches in order, to apply after a yes. Uses your PageSpeed report and site code, and step 1's findings to pick the pages. Hands on: the fix batches, which go at the top of the final list."}
  - {uses: page-issue-sorter, note: "Every run, last: puts every finding from steps 1 to 4 in one bucket (fix now, look into, or test) and ranks by gain and effort. Step 5's fix batches go at the top of the list as they are."}
schedule: "Every Monday morning, and again after each site release"
asks_before: [changing site code, changing a live theme or published pages, editing robots.txt, redirects or the sitemap, deleting or unpublishing a page, installing or removing an app or plugin]
origin: own
version: 1.0.0
example_pending: true
