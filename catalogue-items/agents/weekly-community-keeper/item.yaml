slug: weekly-community-keeper
name: Weekly community keeper
summary: Share community posts and questions. Get useful replies, repeat
  questions and a plan for the next week.
category: agent
type: agent
role: orchestrate
job: organic
level: intermediate
inputs:
  - type: source_text
    required: true
  - type: performance_sheet
    required: false
  - type: brand_brain
    required: false
outputs:
  - type: plan
  - type: document
  - type: audit_report
uses:
  - developer-community-builder
  - recognition-plan-designer
  - feedback-theme-finder
  - key-moment-designer
  - internal-update-writer
steps:
  - uses: developer-community-builder
    note: "Once, and again each quarter: the channels, the onboarding path and the events, as the plan each week is measured against. Hands on: the plan, which step 2 builds the recognition levels on."
  - uses: recognition-plan-designer
    note: "Once, then every quarter: the levels anyone can reach and the public moment for each, built on step 1's plan, so recognition is fair, not favourites. Hands on: the levels each week's recognitions are picked from."
  - uses: feedback-theme-finder
    note: "Every week: the themes in the week's posts and replies, with quotes, and which threads went unanswered. Uses the week's posts you paste in, not step 1's plan or step 2's levels. Hands on: the themes and unanswered threads, for the weekly note."
  - uses: key-moment-designer
    note: "Only when a first, a launch or a milestone is coming in the next month: the one peak to build and the rest kept simple. Uses the event you name as its question, not step 3's themes. Hands on: the moment's plan, for the weekly note."
  - uses: internal-update-writer
    note: "Every week, last: the weekly community note drafted from step 3's themes and answers owed, the recognitions picked from step 2's levels, and any moment from step 4."
schedule: Every Friday, after the week's posts are exported
asks_before:
  - posting or sending anything to the community
  - messaging any member
  - recognising a member publicly
  - removing or muting a member or a post
  - changing channels or rules
  - announcing an event
minds:
  - chip-heath
origin: own
version: 1.0.0
example_pending: true
