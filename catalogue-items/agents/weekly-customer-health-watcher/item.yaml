slug: weekly-customer-health-watcher
name: "Weekly customer health watcher"
summary: "Give it your account usage each week. Get who is slipping, who is up for renewal and the next touch for each."
category: agent
type: agent
role: orchestrate
job: analysis
level: intermediate
inputs:
  - {type: performance_sheet, required: true}
  - {type: spreadsheet, required: false}
  - {type: voc_reviews, required: false}
  - {type: tool_connection, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
  - {type: copy_draft}
uses: [customer-success-signals, customer-health-and-churn-scorer, churn-risk-finder, escalation-brief-writer, post-sale-follow-up-planner, renewal-watch-planner]
steps:
  - {uses: customer-success-signals, note: "Once, and again each quarter: the one early sign that a customer will stay, written as a percentage doing an event within a time. Hands on: the sign, which step 2 checks every account against."}
  - {uses: customer-health-and-churn-scorer, note: "Every week: each account scored for health, churn risk and upsell room, compared with last week's score. Uses this week's usage and support data you give. Hands on: the scores, which show who fell."}
  - {uses: churn-risk-finder, note: "Only for accounts whose score fell two weeks running or that missed the early sign: the likely cause and ideas for how to step in. Uses your usage, engagement and support data for those accounts. Hands on: the risk and cause for each, for the escalation or the touch."}
  - {uses: escalation-brief-writer, note: "Only when an at-risk account has an open problem the person cannot fix alone: the brief for engineering or leadership, built on step 3's cause plus the details you give. Hands on: the brief to send."}
  - {uses: post-sale-follow-up-planner, note: "Only for an account that is healthy or newly recovered: the thank-you note and the keep-in-touch plan. Uses the account's details you give, not the escalation brief. Hands on: the touch plan, for the hand-back."}
  - {uses: renewal-watch-planner, note: "Every week, if the account tool is connected read-only (or from the dates in your export): renewals in the next 90 days with timing and risk. Uses your account data, not the touch plan. Hands on: the renewal list, with at-risk accounts renewing within 60 days first."}
schedule: "Every Monday morning, from a fresh usage export"
asks_before: [sending any message to a customer, offering a discount, credit or extension, changing a plan or a contract, escalating to another team, marking an account as lost]
minds: [mark-roberge]
origin: own
version: 1.0.0
example_pending: true
