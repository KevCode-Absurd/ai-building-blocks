new_slug: weekly-project-delay-evidence-assistant
name: Weekly project delay evidence assistant
headline: Weekly project delay evidence assistant
summary: Find where work waits and why deadlines slip. Get a weekly delay trend brief and a keep, revise or stop call on your current fix.
job: organise-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it dated task updates, original estimates, actual finish dates and the fix you are testing. It compares waiting time and working time with your saved baseline and builds a project delay trend brief each week. It ends with a keep, revise or stop call on the fix. Thin evidence means no change.
explain: |-
  Projects miss deadlines for reasons that repeat: a review that queues for days, a hand-off with no owner, an estimate that is always short. Once you try a fix, you need to know if it works. Most teams judge it by feel.

  This agent keeps a baseline of how long similar tasks spent waiting and how long they spent being worked on. Each week it adds the new finished tasks and compares them with that baseline. It keeps waiting time and working time apart, because a task can be late while nobody is working on it. When a stage moves past the limit you set, it runs the Trace why work keeps missing deadlines workflow. When shared dependencies move across projects, it uses the Project risk and portfolio manager.

  A small sample cannot show a cause. With too few finished tasks, the agent tells you to leave the fix as it is and says how many more it needs. It writes a brief and a recommendation only. It does not change your plan or tell anyone.
when:
  - You tried a change, such as a faster review step, and want to know after a few weeks if it helped.
  - Tasks keep finishing later than estimated and you cannot say which stage holds them up.
  - A key dependency moved and several projects may slip together.
  - You review work every week and want the trend, not a fresh guess.
not_for:
  - One project with no finished tasks yet. There is no baseline to compare. Use the Trace why work keeps missing deadlines workflow for a first pass.
  - Tasks with no dates. Add start and finish dates first. Without them the agent can only ask for them.
  - Only shared dependencies or risks across projects changed. Use the Project risk and portfolio manager on its own.
  - You want a new finish date for one project. Use the Outside view timeline estimator.
you_give:
  - "Dated task updates: when each task started, when it waited and when it finished (from your project tool export, a spreadsheet or status notes)"
  - The original estimate for each task
  - The actual finish date for each completed task
  - "The fix you are testing: what changed, the date it started and the review date"
  - How far a stage's waiting time may move before it counts as a new pattern (optional; the agent proposes a rule if you give none)
  - Last review's record (optional, from the second week on)
you_get:
  - "A delay trend brief: waiting time and working time by stage, against the baseline"
  - A list of new delay patterns, or a clear note that there is no new pattern this week
  - A keep, revise or stop call on the fix, with the sample size behind it
  - A note on shared dependencies when they moved
  - MISSING lines for stages with no timing, and a record for the next week
how_to_use:
  - Add the agent to Claude, ChatGPT or Gemini with its helpers, the Trace why work keeps missing deadlines workflow and the Project risk and portfolio manager. Or download the pack and attach it.
  - Paste this week's task export and describe the fix you are testing. Say what a new pattern means to you, or let the agent propose a rule. From week two, paste last week's record.
  - Remove staff names and other personal details from the export before you paste it. Task IDs and stage names are enough.
  - Read the trend brief. Check the sample size before you believe any change.
  - If the brief says the evidence is too thin, leave the fix as it is.
  - Change your plan yourself if you agree. The agent changes nothing. After a "stop" call, you or the person who owns the fix decide what happens next.
  - The Project risk and portfolio manager comes with Python scripts. In a chat-only tool the AI reads the numbers instead of running them, and says so under CHECKS MISSED.
how_it_works:
  - title: Read last week's baseline
    text: Loads the task group, how the baseline is defined, the sample size, the fix being tested, the review date and links to the evidence. A first run builds the baseline with you.
  - title: Add new finished tasks
    text: Counts only tasks finished since the last review. A task missing a start or finish date is listed, not counted.
  - title: Compare with the baseline
    text: For each stage, compares waiting time and working time with the baseline. A new pattern is a move past your limit. With no limit given, it proposes a plain one and labels it ASSUMPTION for you to change.
  - title: Run the right workflow
    text: A new pattern runs the Trace why work keeps missing deadlines workflow, with the Process bottleneck finder, the Outside view timeline estimator and the Change rollout planner. Moved dependencies run the Project risk and portfolio manager.
  - title: Judge the fix
    text: Gives a keep, revise or stop call with the sample size shown. If the sample is too small, the fix stays unchanged and the brief says how much more evidence it needs.
  - title: Check and save
    text: Checks that only comparable tasks were compared and that no cause is claimed. Saves the files, a run log and the new record, and keeps the old record.
output_shape: |-
  DELAY REVIEW <date>, group <task group>
  <first baseline, or compared with <last review date>>
  FIX UNDER TEST: <change> | started <date> | review <date>

  TREND BY STAGE
  <stage> | waiting: baseline <x> now <y> | working: baseline <x> now <y> | sample <n tasks>

  NEW PATTERNS
  <stage> | what moved | rule used <yours, or ASSUMPTION> | evidence <task IDs>
  or: no new pattern this week

  DEPENDENCIES  <what moved and which projects it touches, or unchanged>

  RECOMMENDATION  <keep | revise | stop> | why | sample <n> | more evidence needed <what>

  MISSING  <stages or tasks with no timing>
  CHECKS MISSED  <one line each, or none>
  RECORD FOR NEXT REVIEW  <task group | baseline definition | sample size | change tested | review date | evidence links>
output_sample:
  input:
    - Dated task updates, with start, wait and finish dates
    - Original estimates for each task
    - Actual finish dates
    - The fix you are testing and its start and review dates
    - Your limit for a new pattern (optional)
    - Last review's record (optional)
  prerequisites:
    - An AI that can read pasted text or files, such as Claude, ChatGPT or Gemini
    - The helper skills added, or the pack attached
    - "A baseline: at least one earlier set of finished tasks, or the first run builds one with you"
  output:
    - name: Trend by stage
      contains: Waiting time and working time for each stage, against the baseline, with the number of tasks behind each figure.
    - name: New patterns
      contains: Any stage that moved past your limit, with the task IDs that show it. If none moved, it says so.
    - name: Dependencies note
      contains: Shared dependencies that moved and the projects they touch, from the Project risk and portfolio manager.
    - name: Recommendation
      contains: Keep, revise or stop for the fix you are testing, with the sample size and how much more evidence is needed.
    - name: Improvement plan
      contains: When a new pattern needs a change, one small test with an owner, a measured baseline, a review date and a success check.
    - name: MISSING lines and CHECKS MISSED
      contains: Stages with no timing, and every check that could not run, such as scripts that were read but not run.
    - name: Record for the next review
      contains: Task group, baseline definition, sample size, change tested, review date and evidence links.
tweaks:
  - what: Task group
    how: Compare similar tasks only. Mixing small and large work hides the pattern.
  - what: Pattern limit
    how: Set how far a stage may move before it counts as new. Say whether the limit is in days or in percent. For example, waiting time up by a quarter against the baseline, over at least eight finished tasks. Those numbers are only an example, so use your own.
  - what: Review length
    how: Say how many weeks or finished tasks the fix needs before you judge it. With no number from you, the agent treats fewer than eight finished tasks in a group as too thin, labels that ASSUMPTION and asks you to confirm or change it.
  - what: Stage names
    how: Use the stage names your team uses, so the brief matches your board.
judge:
  - Comparable work uses the same definitions; a small sample does not prove a cause.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep one record per task group, with the baseline definition written down, so each week uses the same one.
  - Give every task a fixed ID, so a renamed task is not counted twice.
  - Write down the keep, revise or stop rules you agree on, and paste them in every run.
  - Record checks that need a person or a script run, and finish them before you rely on the brief.
works_best_with:
  tools:
    - name: A capable chat AI with file support
      why: Keeps the record between weeks. An AI that can run Python can also run the scripts that come with the Project risk and portfolio manager.
  inputs:
    - An export from your project tool with start, wait and finish dates.
    - Notes on what the fix changed and when.
    - A list of shared dependencies across projects.
terms:
  - term: Baseline
    meaning: How long similar tasks took before your fix. New results are compared with it.
  - term: Waiting time
    meaning: Time a task sits with nobody working on it.
  - term: Working time
    meaning: Time someone is actively working on the task.
  - term: Stage
    meaning: One step of the work, such as drafting, review or sign-off.
  - term: Sample size
    meaning: How many finished tasks a comparison uses.
  - term: Dependency
    meaning: Something one piece of work needs from another before it can finish.
