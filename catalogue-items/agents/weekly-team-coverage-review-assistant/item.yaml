  - team-capacity-planner
steps:
  - uses: prepare-a-team-absence-handover
    note: "Run when: An absence, delivery date or available cover changes for a critical commitment. Hands step 2 the plan and the handover document: each task with its cover owner or a named gap."
  - uses: team-capacity-planner
    note: Run only if step 1 left a task short or uncovered. Takes step 1's handover document as the work to size and your own hours, then hands the manager defer, reduce or add-cover options.
schedule: Weekly when the team provides updated commitments and absence information.
