slug: weekly-team-coverage-review-assistant
name: Weekly team coverage review assistant
summary: "Spot critical work left without cover during absences. Get a team coverage brief, a list of uncovered commitments and draft handovers."
category: agent
type: agent
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: question
    required: false
  - type: meeting_notes
    required: false
outputs:
