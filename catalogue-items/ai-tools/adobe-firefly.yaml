slug: adobe-firefly
name: Adobe Firefly
maker: Adobe
url: https://www.adobe.com/products/firefly.html
promise: "Create images, video and audio from prompts, or edit and extend existing photos."
use_cases: [make-images, make-video, design]
categories: [image, video, design]
what_it_does:
  - Makes images from a written description.
  - Makes video clips and audio from a prompt or a still image.
  - Lets you choose between Adobe's own model and partner models.
  - Fills in or expands a photo from a written request.
  - "Works with Photoshop and Illustrator. Also works with Adobe Express."
benefits:
  - "Fix and extend photos using the Adobe apps you already work in."
  - Pick the model that suits each job from one account.
  - "Try ideas within the listed free allowance before choosing a paid plan."
best_for:
  - Designers and marketers who already use Adobe apps.
  - Editing and extending existing photos.
  - Teams that want Adobe's terms for commercial use.
not_for:
  - People who only need a few quick images and no editing apps.
  - Heavy video use on the smallest plan.
pricing:
  model: freemium
  from: US$9.99 per month
  note: Free plan gives a limited daily allowance. Standard includes 2,000 generative credits a month, Pro 4,000, Pro Plus 10,000 and Premium 50,000. Credits reset each month and do not roll over.
