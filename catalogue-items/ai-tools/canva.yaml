slug: canva
name: Canva
maker: Canva
url: https://www.canva.com
promise: "Design posts, slides, documents and videos with templates, brand assets and AI help."
use_cases: [design, make-images, slides-and-docs]
categories: [design, image, productivity]
what_it_does:
  - Gives you templates for posts, ads, decks, documents and video.
  - Makes images from a written description.
  - Removes backgrounds and resizes a design for each placement.
  - Drafts text and presentations from a short prompt.
  - Stores your logo, colours and fonts so every design matches.
benefits:
  - "Use templates to make a set of social posts without starting each design from scratch."
  - "Resize an ad design for different placements, then check each layout."
  - Keep every design in your brand colours and fonts.
  - Share a design with your team and edit it together.
best_for:
  - Owners and small teams who make their own designs.
  - Social posts, ad images, flyers and slide decks.
  - Finishing an image from another AI product with text and a logo.
not_for:
  - Detailed interface design for apps.
  - "Real-looking images that need tight control of each detail."
pricing:
  model: freemium
  from: US$18 per month
  note: Free plan has a monthly limit on AI use. Pro costs US$18 a month, or about US$12 a month billed yearly, and is for one person. Business is priced per person. Prices are from a June 2026 review, so check the page.
works_with:
  - chatgpt
  - claude
  - Google Drive
  - Dropbox
runs_in: [web, desktop, mobile, api]
blocks:
