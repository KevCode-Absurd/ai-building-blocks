slug: canva
name: Canva
maker: Canva
url: https://www.canva.com
promise: "Design posts, slides, documents and videos with templates, your brand assets and AI help."
use_cases: [design, make-images, slides-and-docs]
categories: [design, image, productivity]
what_it_does:
  - Gives you templates for posts, ads, decks, documents and video.
  - "Makes images and short videos from a written description with Magic Media. It counts against your monthly AI allowance (checked 26 Oct 2026)."
  - "Edits photos with Magic Studio tools such as Background Remover, Magic Eraser and Magic Expand (checked 26 Oct 2026)."
  - "Drafts and rewrites text with Magic Write. Free plans get the core features with fair-use limits (checked 26 Oct 2026)."
  - Stores your logo, colours and fonts so every design matches.
benefits:
  - "Use templates to make a set of social posts without starting each design from scratch."
  - "Resize an ad design for different placements, then check each layout."
  - Keep every design in your brand colours and fonts.
  - Share a design with your team and edit it together.
best_for:
  - Owners and small teams who make their own designs.
  - Social posts, ad images, flyers and slide decks.
  - Finishing an image from another AI product with text and a logo.
not_for:
  - Detailed interface design for apps. Use Figma AI for that.
  - "Real-looking images that need tight control of each detail. Try Adobe Firefly, which edits and extends photos."
  - "Heavy AI image use on the free plan. It allows up to 20 uses a month of the Standard or Premium AI tools, and none of the Ultra tools (checked 26 Oct 2026)."
pricing:
  model: freemium
  from: US$12 per month, billed yearly
  note: "Canva Pro, for one person: about US$12 a month billed yearly (US$144 a year), or US$18 a month billed monthly. Prices are for the US and differ by region (Canva's own page, checked 26 Oct 2026). A 30-day Pro trial is listed. Free plan: up to 20 monthly uses of Standard or Premium AI tools, no Ultra tools. When the limit is hit, free users lose AI access until the next monthly reset. Business and Enterprise plans exist. We did not confirm their prices."
works_with:
  - chatgpt
  - claude
  - Google Drive
  - Dropbox
runs_in: [web, desktop, mobile, api]
