  cost: "Starting from a template costs no AI uses. Making an image with Magic Media or using a Premium AI tool counts against the monthly allowance, which is up to 20 uses on the free plan."
  reply: "A finished design you can edit, download or share with your team. We did not check the file formats on offer, so look at the download menu. Read every word on it before you post."
