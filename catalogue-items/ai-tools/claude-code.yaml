slug: claude-code
name: Claude Code
maker: Anthropic
url: https://claude.com/product/claude-code
promise: "Change project code, fix bugs and run tests with an AI coding agent."
use_cases: [code, build-apps]
categories: [coding]
what_it_does:
  - Plans a task, writes the code and runs the tests in your own files.
  - Fixes bugs, refactors code and moves a project to a new setup.
  - Maps and explains a codebase you have never seen.
  - Opens pull requests for the changes it makes.
  - "Can ask for approval before editing files or running commands."
  - Runs in the terminal, your editor, the web, the desktop app and Slack.
benefits:
  - Get a first pass at a bug fix while you work on something else.
  - "Use an explanation of the files and code paths to explore an unfamiliar project."
  - "Save project rules in a file for the agent to use."
  - "Review changes before you merge or deploy them."
best_for:
  - Developers who want an agent that works across a whole project.
  - Founders with a codebase who need bugs fixed and tests written.
  - Teams that already use Claude and want coding included.
not_for:
  - Anyone who wants to build an app with no code at all (try Lovable or Bolt).
  - People who want a fixed bill, since heavy use can hit plan limits.
pricing:
  model: subscription
  from: US$20 per month
  note: Comes with the Claude Pro plan (about US$17 per month billed yearly), Max from US$100 per month, and Team and Enterprise. You can also pay by API usage through a Claude Console account. The free Claude plan does not include it.
