slug: cursor
name: Cursor
maker: Anysphere
url: https://cursor.com
promise: "Write, change and review project code with an AI agent inside your editor."
use_cases: [code, build-apps]
categories: [coding]
what_it_does:
  - Writes and changes code across your files when you describe the task.
  - Drafts a plan first, so you can check it before it builds.
  - Suggests the next lines as you type, and edits a selection on command.
  - Lets you pick the AI model, from OpenAI, Anthropic, Google and others.
  - Runs cloud agents that build, test and hand work back.
  - Reviews pull requests on GitHub.
benefits:
  - Hand off a bug fix and review the result instead of typing it.
  - "Save project rules and context in files for the agent to use."
  - Try a different AI model on the same task without changing editors.
  - Get a second review of a pull request before a teammate reads it.
best_for:
  - People who already work in a code editor and want an AI pair inside it.
  - "Small software teams handing routine coding tasks to agents."
  - "Founders who can read code and want help changing a working project."
not_for:
  - Anyone who wants to describe an app and never see code (try Lovable or Bolt).
  - "People who must check that the editor runs on their computer before buying."
pricing:
  model: freemium
  from: US$8 per month
  note: Free plan, then Plus (US$8), Premium (US$30), Super (US$100) and Ultra (US$200) per month. The vendor's page lists only Grok models under Plus, so the OpenAI, Anthropic and Google models above may need a higher plan. Check which models each plan includes before you pay. Teams start at US$30 per user.
works_with:
  - claude
  - chatgpt
  - gemini
  - GitHub
  - Slack
runs_in: [desktop, web, mobile, slack]
blocks:
  - agent-context-setter
  - ai-coding-agent-rules-writer
  - mcp-config-version-checker
  - mcp-tool-set-designer
  - mcp-server-hardener
  - simple-code-coach
  - slow-code-speeder
alternatives: [claude-code, github-copilot, windsurf, codex]
last_checked: 2026-10-21
first_result:
  - "Download Cursor from cursor.com and open a project folder that is saved with git. We did not check the install steps."
  - "Sign in. The free plan lets you try it. Check which AI models your plan includes before you pick one."
  - "Open the agent chat and describe one small change. Ask it to show its plan first."
  - "Read the plan, then let it edit. Read each changed file before you accept it."
  - "Run your tests. If something breaks, ask the agent to fix it, or undo the change in git."
  - "You end with: a plan you read before any edit, a list of changed files you can review, and a test run that passes or fails. Save your project rules in a file so the agent follows them next time."
  - "Next: write that rules file with the AI coding agent rules writer, and set up context with the Agent context setter."
needs:
  - "A computer where you can install an editor."
  - "A code project, saved with git."
  - "One small task, written as what should change."
  - "A plan that includes the AI models you want to use."
not_verified:
  - "Install steps and where the agent chat sits in the editor."
  - "Which models each plan includes. The Plus note names Grok models only."
  - "How much use each plan allows before limits."
sources:
