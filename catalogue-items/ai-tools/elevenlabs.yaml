slug: elevenlabs
name: ElevenLabs
maker: ElevenLabs
url: https://elevenlabs.io
promise: "Make voice-overs from text, transcribe speech and create dubbed audio, effects or music."
use_cases: [voice-and-audio]
categories: [voice]
what_it_does:
  - Reads your text aloud in a natural voice.
  - Turns speech into text.
  - Clones a voice from a sample, with professional cloning on higher plans.
  - Dubs a video into other languages.
  - Makes sound effects and music from a description.
benefits:
  - Add a voice-over to a video ad without booking a studio.
  - Put one narration in several languages.
  - "Use a chosen narration voice across a series of videos."
best_for:
  - Video ads, explainers and training that need narration.
  - Teams who add voices to AI video clips.
  - Developers building voice assistants with the API.
not_for:
  - Cloning someone's voice without their permission. Use only voices you have the right to use.
  - Long audio on a small plan, since all products share one credit pool.
pricing:
  model: freemium
  from: "US$6 per month"
  note: Free plan includes 10,000 credits a month. Starter includes 30,000 credits and a commercial licence. Text to speech uses about 1 credit per character on the standard models.
works_with:
  - kling
  - veo
  - heygen
  - capcut
runs_in: [web, mobile, api]
blocks:
  - multilingual-narrator
  - video-dubbing-editor
  - voice-swap-editor
  - sound-effects-designer
  - music-composer
  - noisy-audio-cleaner
  - subtitle-and-transcript-maker
  - make-a-voiceover-and-ship-it-in-other-languages
  - voice-assistant-builder
alternatives: [whisper, suno, heygen, descript]
last_checked: 2026-10-21
first_result:
  - "Go to elevenlabs.io and sign up for the free plan, which gives 10,000 credits a month."
  - "Open text to speech. Paste a short script of about 100 words and pick a voice."
  - "Generate it, listen, and fix the wording. Names and numbers often need a respelling to sound right."
  - "Standard models use about 1 credit per character, so 100 words is roughly 600 credits (our own sum)."
  - "Download the audio. Starter includes a commercial licence, so check your plan's licence before you use the audio in an ad."
  - "You end with an audio file of your script in the voice you chose."
  - "Next: for other languages, use the Multilingual narrator or follow the workflow Make a voiceover and ship it in other languages."
needs:
  - "An ElevenLabs account."
  - "A written script. Read it aloud first and fix awkward lines."
  - "Permission for any voice you clone."
  - "A plan with a commercial licence, if the audio is for ads or sale."
not_verified:
