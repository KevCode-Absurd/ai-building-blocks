slug: elevenlabs
name: ElevenLabs
maker: ElevenLabs
url: https://elevenlabs.io
promise: Natural voice-overs from text, plus dubbing, sound effects and music.
use_cases: [voice-and-audio]
categories: [voice]
what_it_does:
  - Reads your text aloud in a natural voice.
  - Turns speech into text.
  - Clones a voice from a sample, with professional cloning on higher plans.
  - Dubs a video into other languages.
  - Makes sound effects and music from a description.
benefits:
  - Add a voice-over to a video ad without booking a studio.
  - Put one narration in several languages.
  - Keep the same voice across every video you make.
best_for:
  - Video ads, explainers and training that need narration.
  - Teams who add voices to AI video clips.
  - Developers building voice assistants with the API.
not_for:
  - Cloning someone's voice without their permission.
  - Long audio on a small plan, since all products share one credit pool.
pricing:
  model: freemium
  from: "US$6 per month"
  note: Free plan includes 10,000 credits a month. Starter includes 30,000 credits and a commercial licence. Text to speech uses about 1 credit per character on the standard models.
works_with:
  - kling
  - veo
  - heygen
  - capcut
runs_in: [web, mobile, api]
blocks:
  - multilingual-narrator
  - video-dubbing-editor
  - voice-swap-editor
  - sound-effects-designer
  - music-composer
  - noisy-audio-cleaner
  - subtitle-and-transcript-maker
  - make-a-voiceover-and-ship-it-in-other-languages
  - voice-assistant-builder
alternatives: [whisper, suno, heygen, descript]
