slug: fireflies
name: Fireflies
maker: Fireflies.ai
url: https://fireflies.ai
promise: "Turn recorded calls into searchable transcripts, summaries and action lists."
use_cases: [meeting-notes]
categories: [productivity]
what_it_does:
  - Records and transcribes calls in more than 100 languages.
  - Writes a summary and action items after each meeting.
  - Lets you search across every past call for what was said.
  - Tracks talk time, topics and sentiment across conversations.
  - Sends notes to your CRM, Slack and task apps.
benefits:
  - "Keep a draft record of the call while you focus on the conversation."
  - "Search saved calls for an earlier customer comment."
  - Get follow-up tasks into your CRM without typing them in.
  - Review how calls go across a whole sales team.
best_for:
  - Sales and customer teams that live on calls.
  - Recruiters who need notes sent to their hiring system.
  - "Teams that want recorded meetings in one searchable place."
not_for:
  - People who dislike a note-taker bot joining the call.
  - Heavy use on the free plan, which has limited transcription credits.
pricing:
  model: freemium
  from: Check the maker's site
  note: Plans are Free, Pro, Business and Enterprise, billed per seat. Paid plans give more transcription credits and team features. The pricing page showed no dollar amounts when read.
works_with:
  - Zoom
  - Google Meet
  - Microsoft Teams
  - Slack
  - HubSpot
  - Salesforce
runs_in: [web, desktop, mobile, api]
blocks:
  - meeting-coaching-analyst
alternatives: [otter, granola, notion-ai, descript]
last_checked: 2026-10-21
sources:
