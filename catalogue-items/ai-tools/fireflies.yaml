slug: fireflies
name: Fireflies
maker: Fireflies.ai
url: https://fireflies.ai
promise: "Turn recorded calls into searchable transcripts, summaries and action lists."
use_cases: [meeting-notes]
categories: [productivity]
what_it_does:
  - Records and transcribes calls in more than 100 languages.
  - Writes a summary and action items after each meeting.
  - Lets you search across every past call for what was said.
  - Tracks talk time, topics and sentiment across conversations.
  - Sends notes to your CRM, Slack and task apps.
benefits:
  - "Keep a draft record of the call while you focus on the conversation."
  - "Search saved calls for an earlier customer comment."
  - Get follow-up tasks into your CRM without typing them in.
  - Review how calls go across a whole sales team.
best_for:
  - Sales and customer teams that live on calls.
  - Recruiters who need notes sent to their hiring system.
  - "Teams that want recorded meetings in one searchable place."
not_for:
  - People who dislike a note-taker bot joining the call, or calls where you cannot tell everyone that it is recording.
  - Heavy use on the free plan, which has limited transcription credits.
pricing:
  model: freemium
  from: Check the maker's site
  note: Plans are Free, Pro, Business and Enterprise, billed per seat. Paid plans give more transcription credits and team features. The pricing page showed no dollar amounts when read.
works_with:
  - Zoom
  - Google Meet
  - Microsoft Teams
  - Slack
  - HubSpot
  - Salesforce
runs_in: [web, desktop, mobile, api]
blocks:
  - meeting-coaching-analyst
alternatives: [otter, granola, notion-ai, descript]
last_checked: 2026-10-21
first_result:
  - "Go to fireflies.ai and sign up. Connect your calendar so it can see your meetings."
  - "Tell everyone on the call that a note-taker is joining. In some places you need each person's consent to record."
  - "Try it on one low-stakes meeting first, such as an internal check-in."
  - "After the call, open the transcript. Read the summary and check each action item against what was said."
  - "Search the transcript for a word you remember. Send the notes to your CRM or Slack if you use them."
  - "You end with a transcript, a summary and a list of action items for each call."
  - "Next: review how your calls go with the Meeting coaching analyst."
needs:
  - "A Fireflies account. The free plan has limited transcription credits."
  - "A calendar, and a call tool such as Zoom, Google Meet or Microsoft Teams."
  - "Consent from everyone on the call. Recording laws differ by place."
not_verified:
  - "Plan prices. The pricing page showed no dollar amounts."
  - "How the bot joins each call tool."
  - "Recording-consent rules for your place and your guests' places. Ask a lawyer if you are unsure."
sources:
  - https://fireflies.ai
  - https://fireflies.ai/pricing
