slug: gamma
name: Gamma
maker: Gamma
url: https://gamma.app
promise: "Turn a prompt, outline or file into a deck, document or web page draft."
use_cases: [slides-and-docs]
categories: [productivity, design]
what_it_does:
  - Makes a presentation from a prompt, an outline or an uploaded file.
  - Makes documents, simple websites and social posts in the same way.
  - Lays out content as cards that grow to fit your text.
  - Adds AI images and rewrites text when you ask.
  - Exports your work and shares it through a link.
benefits:
  - "Turn a rough outline into a deck draft to review."
  - Reuse one set of notes as a deck, a document and a page.
  - Change the look of a whole deck without moving boxes by hand.
  - Share a link people can open without installing anything.
best_for:
  - Founders and marketers who build pitch decks and proposals.
  - Teachers and trainers turning notes into slides.
  - Anyone who wants a first draft of a deck to edit.
not_for:
  - Exact layouts where every element must sit in a set place. Use Beautiful.ai for those.
  - Heavy data decks with many complex charts. Beautiful.ai can link a spreadsheet.
pricing:
  model: freemium
  from: Check the maker's site
  note: There is a free plan with a one-time set of credits, then paid Plus, Pro, Ultra, Team and Business plans. The pricing page did not load when read, and outside guides disagree on amounts.
works_with:
  - chatgpt
  - claude
  - canva
runs_in: [web, api]
blocks: []
alternatives: [beautiful-ai, canva, chatgpt]
last_checked: 2026-10-21
first_result:
  - "Go to gamma.app and sign up. The free plan gives a one-time set of credits."
  - "Choose to make a deck. Paste an outline, type a prompt or upload a file."
  - "Read the outline Gamma proposes. Cut or reorder cards before you accept it."
  - "Let it build the deck. Check every fact and number on every card against your notes."
  - "Edit with the AI, change the theme, then share a link or export."
  - "You end with a draft deck. Try the same notes as a document or a web page."
  - "Next: finish the visuals in Canva, or use Beautiful.ai when the layout must be exact."
needs:
  - "A Gamma account. The free plan is enough to try it."
  - "A topic, an outline or a file."
  - "Facts and numbers you have already checked."
not_verified:
