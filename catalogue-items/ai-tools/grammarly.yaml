slug: grammarly
name: Grammarly
maker: Grammarly
url: https://www.grammarly.com
promise: "Check and rewrite your draft for spelling, grammar, clarity and tone."
use_cases: [write-copy]
categories: [writing]
what_it_does:
  - Checks spelling, grammar and clarity as you type.
  - Rewrites a sentence or paragraph for clarity and flow in one click.
  - Suggests a tone that fits the message, such as friendly or confident.
  - Shows how a reader might react to your draft.
  - Flags text that reads as written by AI, and helps you revise it.
benefits:
  - "Review emails and posts for typos, tone and unclear sentences."
  - Fix the tone of a message before the customer sees it.
  - Edit in the app you already use, with no copy and paste.
  - Keep a team writing in one brand tone with shared style guides.
best_for:
  - Anyone who writes emails, product pages and posts all day.
  - Teams that want one tone across support, sales and marketing.
  - Non-native English writers who want a second pair of eyes.
not_for:
  - Writing a long piece from a blank page. A chat assistant such as ChatGPT or Claude does that better.
  - Checking languages other than English in depth.
pricing:
  model: freemium
  from: "Free plan available; paid prices in US dollars are not confirmed (see grammarly.com/plans)"
  note: The free plan includes spelling and grammar checks and 100 AI prompts a month. A paid individual plan adds full rewrites and more prompts. Enterprise is priced on request. The page showed local currency, so no US dollar price was confirmed. Before you pay, read the current price on grammarly.com/plans. You can finish the steps below on the free plan.
works_with:
  - Google Docs
  - Microsoft Office
  - Zendesk
runs_in: [web, desktop, mobile, browser-extension]
blocks: []
alternatives: [jasper, copy-ai, chatgpt, claude]
last_checked: 2026-10-21
first_result:
  - "Go to grammarly.com and sign up for the free plan. Follow the steps on the page as they are today."
  - "Add the browser extension or the desktop app from the Grammarly site, so it checks where you already write. Follow the install steps on the page. Skip this step if you only paste drafts into the editor."
  - "Paste a draft, such as a customer email, into the editor. Accept or reject each suggestion one by one."
  - "Pick a tone for the message, such as friendly or confident, and read the rewrite. If it asks you to upgrade, skip the rewrite. The corrected draft from the step before still counts."
  - "Read the final text aloud once. Grammarly checks spelling and style. It does not check whether your facts are true."
  - "Result: the corrected draft as one block of text, then the list of suggestions you accepted and rejected. If the rewrite needed a paid plan, the draft is corrected for spelling and grammar only."
  - "Next: for a first draft from nothing, write it in ChatGPT or Claude, then polish it here."
needs:
  - "A draft to check. English works best."
  - "A free account. The free plan covers spelling and grammar checks and 100 AI prompts a month, which is enough for the steps above. The tone rewrite may need a paid plan."
  - "The browser extension or app, if you want it in Google Docs or Microsoft Office."
