slug: grok
name: Grok
maker: xAI
url: https://grok.com
promise: "Search X and the web, ask questions, draft text and create images."
use_cases: [ask-an-assistant, research, make-images]
categories: [chat-assistant]
what_it_does:
  - Answers questions and drafts text from a message you type or say.
  - Searches X and the web for what people are saying now.
  - Makes images from a written description.
  - Reads files and images you share with it.
  - Offers deeper research on harder questions.
benefits:
  - See what people are saying about a topic today.
  - "Explore a recent topic through posts on X and linked web sources."
  - Get a quick image for a post or mock-up.
  - Try it free before you pay.
best_for:
  - "Reading what people are saying about recent topics."
  - Social media research.
  - People who already use X every day.
not_for:
  - Work that needs calm, balanced sources, since posts on X are often one-sided.
  - Heavy daily use on the free plan, which has caps.
pricing:
  model: freemium
  from: US$30 per month
  note: Free plan with usage caps. SuperGrok costs US$30 per month and SuperGrok Heavy US$300 per month. X Premium plans also include Grok.
works_with:
  - X
runs_in: [web, mobile, api]
blocks:
  - recent-topic-pulse-researcher
alternatives: [chatgpt, claude, perplexity, gemini]
last_checked: 2026-10-21
sources:
  - https://www.cloudzero.com/blog/grok-pricing/
  - https://ai-toolbox.co/grok-models/grok-pricing-plans-api-2026
