slug: gumloop
name: Gumloop
maker: Gumloop
url: https://www.gumloop.com
promise: "Build AI agents that read and update Slack, Gmail, HubSpot and Sheets for you."
use_cases: [automate]
categories: [automation]
what_it_does:
  - "Builds agents from a description of the job in plain words, using any AI model (checked 26 Oct 2026)."
  - "Connects to Slack, Gmail, Salesforce, HubSpot, Notion, Linear, GitHub and Google Sheets, plus 100 or more MCP server connections (checked 26 Oct 2026)."
  - "Watches the web or your apps and acts when your conditions match (checked 26 Oct 2026)."
  - "Saves reusable skills that agents write, refine and share (checked 26 Oct 2026)."
  - "Makes dashboards, documents, spreadsheets, presentations and shared web apps from your connected data (checked 26 Oct 2026)."
  - "Gives IT sign-in control, audit logs and usage monitoring. It also lists VPC deployments (checked 26 Oct 2026)."
benefits:
  - Hand off lead research, CRM updates and ticket sorting to an agent.
  - Share one agent with the whole team instead of rebuilding it.
  - Let a team build agents while IT keeps control of access.
  - "Build on it in code too, through its API, SDKs and command line tool (checked 26 Oct 2026)."
best_for:
  - "Marketing, sales and operations teams that want agents to use their connected apps."
  - Companies where IT must approve what agents can reach.
  - Teams replacing manual lead and CRM work.
not_for:
  - "One-off text writing with no apps involved. Use Claude or ChatGPT."
  - "Simple app-to-app moves with fixed steps. Zapier or Make may be enough."
  - "Anyone who needs a price, or high-volume jobs, before you know what one run costs in credits. We could not read the pricing page on 26 Oct 2026, so start with a few runs a day."
pricing:
  model: subscription
  from: Not confirmed. Check the maker's site
  note: "We could not read Gumloop's pricing page on 26 Oct 2026. Its own blog says the Solo and Team plans were combined into one Pro plan. Earlier notes from other sites listed Pro at about US$37 a month and disagreed on a free plan. We did not confirm either. Check the plan, the credits and the cost of each run on the vendor's page before you build anything that runs often."
works_with:
  - Slack
  - Gmail
  - Salesforce
  - HubSpot
  - Notion
  - Google Sheets
runs_in: [web, api, slack]
blocks: []
alternatives: [lindy, zapier, make, n8n]
last_checked: 2026-10-26
checked: 26 Oct 2026
first_result:
  - "Open gumloop.com and sign up, or book a demo if you are a company team. The sign-up steps were not on the pages we could read, so check the site."
  - "Open gumloop.com/pricing and find which plan includes agents and how credits are counted before you build."
  - "Write the job in one or two sentences, such as: when a new HubSpot lead arrives, research the company and post a summary in Slack."
  - "Connect only the apps the job needs, such as HubSpot and Slack. Sign in to each when asked."
  - "Run the agent once on one test record. Open the result in Slack, check it against the lead, and fix the task wording before you switch on a trigger. Keep it to a few runs a day until you know what one run costs in credits."
  - "You end with a short message in Slack for each record, and an agent you can share with your team. Next: if your steps never change, compare Zapier or Make. For a similar assistant, see Lindy."
needs:
  - "A Gumloop account on a plan that includes agents. We could not confirm which plan."
  - "Access to each app you want it to use, such as Slack or Gmail. A company may need IT to approve it."
  - "One job written in plain words, with the app it starts in and where the result should go."
example:
  task: "When a new HubSpot lead arrives, research the company and post a summary in Slack."
  cost: "Not known. We could not read the credit rules, so we cannot say what one run costs. Run it once and read the usage."
  reply: "A short Slack message per lead. Ask for four fixed lines in your task: company name, what it does, a one-line fit note, and the source link. The shape follows your task wording, so name those fields."
not_verified:
  - "Any price, any free plan, and the credits used per run. The pricing page did not load on 26 Oct 2026."
  - "The sign-up steps for a first agent. The pages we could read did not list them."
  - "How scheduled reports are set up. The home page lists them as a use case only."
sources:
