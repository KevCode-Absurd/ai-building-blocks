slug: harvey
name: Harvey
maker: Harvey
url: https://www.harvey.ai
promise: "Research legal questions, review contracts and draft documents for legal teams."
use_cases: [legal]
categories: [productivity, writing]
what_it_does:
  - "Researches questions about law, rules and tax."
  - Reviews contracts and supports negotiation.
  - Stores large sets of documents and answers questions about them.
  - Runs multi-step legal tasks through agents.
  - Tracks regulatory changes that affect a client.
benefits:
  - "Use AI to help review a set of contracts, with a lawyer checking the result."
  - Get answers that point back to their sources.
  - "Use separate spaces and access restrictions for client work."
  - See how your firm uses AI.
best_for:
  - Law firms.
  - In-house legal teams.
  - Teams with large volumes of contracts.
not_for:
  - Small businesses without a legal team, since it is sold to firms by demo.
  - Final legal advice, which still needs a lawyer to review it.
pricing:
  model: enterprise
  from: Check the maker's site
  note: No public prices. The maker asks you to request a demo.
works_with:
  - Microsoft Word
runs_in: [web]
blocks: []
alternatives: [claude, chatgpt, microsoft-copilot, glean]
last_checked: 2026-10-21
sources:
  - https://www.harvey.ai/
