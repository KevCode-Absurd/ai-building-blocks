slug: harvey
name: Harvey
maker: Harvey
url: https://www.harvey.ai
promise: "Get legal research and contract reviews from AI agents built for legal teams, for your lawyers to check."
use_cases: [legal]
categories: [productivity, writing]
what_it_does:
  - "Researches legal, regulatory and tax questions across areas of law (checked 26 Oct 2026)."
  - "Speeds up routine contract reviews, supports negotiation and shows trends across a contract portfolio (checked 26 Oct 2026)."
  - "Stores documents in a Vault and answers questions about many of them at once (checked 26 Oct 2026)."
  - "Routes legal tasks to purpose-built agents. Teams can assign, run and review work with agents and staff (checked 26 Oct 2026)."
  - "Tracks regulatory changes with Horizon Scanning and gives shared Spaces for firms, clients and co-counsel (checked 26 Oct 2026)."
benefits:
  - "Use AI to help review a set of contracts, with a lawyer checking the result."
  - "Keep client work in shared spaces with sign-in controls. It lists SAML sign-in, audit logs and IP allow-listing (checked 26 Oct 2026)."
  - "See how your firm uses AI, through its usage dashboard (checked 26 Oct 2026)."
  - "Send intake requests from across a company to the right place."
best_for:
  - Law firms.
  - In-house legal teams.
  - Teams with large volumes of contracts.
not_for:
  - "Small businesses without a legal team, since it is sold to firms by demo. Use Claude or ChatGPT for a first read, then see a lawyer. For that first read, paste redacted or dummy text only: remove names, amounts and anything confidential. Do not upload real client documents to any AI tool unless your firm's rules and the tool's data terms allow it."
  - "Final legal advice. A lawyer still has to review every result."
  - "Teams that want to try it today for free. No free trial is stated."
pricing:
  model: enterprise
  from: Check the maker's site
  note: "No public prices and no free trial stated (checked 26 Oct 2026). It is sold to law firms and in-house legal teams, so ask in the demo what price applies to a team of your size. The page asks you to request a demo. It lists regional sign-in for the US, EU and Australia."
works_with:
  - "Custom connectors (MCP is a standard way to link tools; who sets these up is not stated, so ask in the demo)"
runs_in: [web]
blocks: []
alternatives: [claude, chatgpt, microsoft-copilot, glean]
last_checked: 2026-10-26
checked: 26 Oct 2026
first_result:
  - "Use the Request a Demo link at harvey.ai. No self-serve sign-up is described."
  - "Before the demo, list what you want to test: the kind of work, such as a batch of vendor contracts, and roughly how many you handle."
  - "Before you share any client documents, ask in writing how Harvey stores them, whether they are used to train models, and who its sub-processors are. Put the answers in the contract."
  - "In the demo, upload one small batch of your own documents (only if you have permission to share them), with your lawyers in the room. Time how long the review takes and record what it returns."
  - "Ask what each answer links back to, so a lawyer can check it against the source."
  - "Agree who reviews the output before it goes to a client."
  - "Result: what Harvey returns is not confirmed, so ask to see it. Ask the vendor for this format (a suggestion from us, not confirmed by Harvey): per contract, the clause text, a link back to the source passage, and a sign-off line for the reviewing lawyer. Next: for a first read before you see a lawyer, try Claude or ChatGPT with redacted or dummy text only."
needs:
  - "A firm or company plan agreed through a demo."
  - "A set of your own documents to test, with permission to share them."
  - "Before the demo, write down: the document types you want to review (for example supplier contracts or NDAs), a rough count per month, and your security questions (data storage, model training, sub-processors, sign-in)."
  - "A lawyer to check every result."
example:
  task: "Review a set of supplier contracts and list the clauses on liability and termination."
  cost: "No public price. It is set after a demo."
  reply: "We could not confirm the exact output. The site says it surfaces insights across a contract portfolio. Ask in the demo for a clause-by-clause list with links back to the contract text. A lawyer then checks it."
not_verified:
  - "That it drafts documents. The page lists research, review, Vault, agents and workflows, but not drafting."
  - "Microsoft Word support. Our earlier notes said so. The page we read does not."
  - "Whether customer data is used to train models, how long data is kept, and who its sub-processors are. The page does not say."
  - "Its security claims are the vendor's own. The page links to certifications but not to audit reports."
sources:
  - https://www.harvey.ai/
