slug: intercom-fin
name: Intercom Fin
maker: Intercom
url: https://www.intercom.com/fin
promise: "Answer customer questions from your help content and hand unresolved chats to staff."
use_cases: [sell-and-support]
categories: [sales-and-support]
what_it_does:
  - Answers customer questions from your help articles and past answers.
  - Works in Intercom or on top of a helpdesk you already use.
  - Hands the chat to a person when it cannot solve it.
  - Can take actions in other systems, such as looking up an order.
benefits:
  - "Use help content to answer common customer questions."
  - "Check what each solved case costs, plus any helpdesk fees."
  - Keep your current helpdesk and add Fin on top.
best_for:
  - Support teams with many repeat questions and good help articles.
  - Teams that want a cost that moves with volume.
  - Stores with a busy inbox and a small team.
not_for:
  - Businesses with few support questions and a thin help centre.
  - Teams that want a flat monthly bill.
pricing:
  model: usage
  from: US$0.99 per resolution
  note: No seat cost for Fin itself, with a minimum monthly commitment (the page's example is 50 outcomes). Intercom's own helpdesk starts at US$29 per seat per month.
works_with:
  - Salesforce
  - zendesk-ai
  - Slack
runs_in: [web, mobile, api]
blocks:
  - support-desk-automation-builder
  - chat-export-need-finder
  - support-capacity-planner
alternatives: [zendesk-ai, gorgias, hubspot-breeze]
last_checked: 2026-10-21
first_result:
  - "Start at intercom.com/fin. We did not check whether you can sign up on your own or must book a demo."
  - "Read your help articles first. Fin answers from them, so fix old pages and fill gaps."
  - "Connect Fin to your help content and to your helpdesk."
  - "Test it with your ten most common customer questions. Read each answer against your policy."
  - "Set when a chat should pass to a person. Turn Fin on for a small share of chats."
  - "Read the first live chats each day. You pay per resolution, so watch the count."
  - "You end with customers getting answers from your help content, and staff taking only the chats Fin cannot solve."
  - "Next: plan your team with the Support capacity planner, or find what to automate with the Chat export need finder."
needs:
  - "Help articles that are current and clear."
  - "A helpdesk, or an Intercom account."
  - "Your refund and returns rules, written down."
  - "A budget per resolution, from US$0.99, plus the monthly minimum."
not_verified:
  - "Whether you can sign up without a demo."
  - "What counts as a resolution."
  - "Which helpdesks Fin works on top of, beyond Intercom's own."
sources:
