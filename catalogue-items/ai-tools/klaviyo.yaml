slug: klaviyo
name: Klaviyo
maker: Klaviyo
url: https://www.klaviyo.com
promise: "Build email and text campaigns from your store’s customer and order data."
use_cases: [email-and-sms, run-ads]
categories: [marketing]
what_it_does:
  - Builds campaigns and flows from a prompt with its Composer assistant.
  - Sends email and text messages from one store-connected account.
  - "Groups customers using the filters you describe."
  - Scores customers on predicted lifetime value, churn risk and best send time.
  - "Uses its Customer Agent to answer questions about orders."
benefits:
  - "Draft cart and welcome message flows, then review and launch them."
  - Message the right customers, based on what they bought and did.
  - See which emails and texts earn revenue in one place.
  - Turn a campaign idea into a draft in a single conversation.
best_for:
  - Online stores that sell through Shopify and want email and text in one place.
  - "Owners who want cart reminders, welcome notes and messages for past buyers."
  - Teams that sync ad audiences from customer lists.
not_for:
  - Businesses with no customer or order data to segment on.
  - Teams that want a flat price, since cost rises with your profile count.
pricing:
  model: freemium
  from: Check the maker's site
  note: The free plan covers up to 250 active profiles and 500 email sends a month. Paid email and text plans scale with your active profiles, and the page only offers an estimate builder.
works_with:
  - Shopify
  - claude
  - chatgpt
  - gorgias
  - zapier
runs_in: [web, api]
