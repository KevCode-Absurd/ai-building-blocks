slug: lindy
name: Lindy
maker: Lindy
url: https://www.lindy.ai
promise: "Handle email, scheduling, meeting notes and repeat work across your connected apps."
use_cases: [automate, ask-an-assistant]
categories: [automation, productivity]
what_it_does:
  - Connects to more than 1,500 apps, including Slack, Gmail, Notion and HubSpot.
  - Drafts and sends email replies, and books meetings.
  - Joins calls, takes notes and drafts follow-ups.
  - Runs recurring work on a schedule, such as a morning brief or weekly report.
  - "Can reuse a task you demonstrate."
  - Keeps memory of your work in plain files you can edit.
benefits:
  - Hand off inbox replies and meeting follow-ups.
  - Get a weekly report without building it by hand.
  - "Save a demonstrated process for the team to reuse."
  - Try it with free credits and no credit card.
best_for:
  - Busy operators and founders who live in email and meetings.
  - Teams handing off sales, support and reporting chores.
  - Anyone who wants an assistant, not a flowchart builder.
not_for:
  - People who want to see and control every step of a flow.
  - Anyone who needs a flat price, since credits are shared by the team.
pricing:
  model: subscription
  from: Check the maker's site
  note: Starts with US$50 of free credits and no card, which last 7 days. The pricing page shows Team from US$29.99 per month for 3,000 shared credits, while the home page says US$49.99 per user, so check the live page.
works_with:
  - Slack
  - Gmail
  - Google Calendar
  - Notion
  - HubSpot
runs_in: [web, slack, chrome]
blocks: []
alternatives: [gumloop, zapier, make, n8n]
last_checked: 2026-10-21
sources:
