slug: lovable
name: Lovable
maker: Lovable
url: https://lovable.dev
promise: "Build, edit and publish a web app or site through a chat."
use_cases: [build-apps]
categories: [coding]
what_it_does:
  - Builds a web app or site from a chat description.
  - Changes the design and features when you ask in plain words.
  - Adds sign-in, a database and payments to the app.
  - Publishes the app to a live link, with custom domains on paid plans.
  - Lets everyone in your workspace share one pool of credits.
benefits:
  - "Build a first version you can test and refine."
  - Test an idea with real users before you pay for a developer.
  - Fix and restyle the app by describing the change.
  - Start free with a daily credit allowance.
best_for:
  - Founders and operators with an app idea and no developer.
  - Designers and marketers who need a landing page or a small app.
  - Teams that want a fast prototype to show before a build.
not_for:
  - Large, long-lived products without a developer to clean up the code. Real customer payments or private data should wait until a developer has reviewed it.
  - Anyone who wants a fixed monthly bill, since credits, hosting and extras add up.
pricing:
  model: freemium
  from: US$25 per month
  note: Free plan with about 30 credits a month. Pro starts at US$25 per month for 100 credits, or US$21 billed yearly. Business starts at US$50. Cloud hosting is charged on top. Price from a June 2026 article, so check the live page.
works_with:
  - Supabase
  - GitHub
  - Stripe
runs_in: [web]
blocks:
  - lovable-project-cleaner
  - vibe-coded-app-cleaner
alternatives: [bolt, v0, replit, cursor]
last_checked: 2026-10-21
first_result:
  - "Go to lovable.dev and sign up. The free plan gives about 30 credits a month."
  - "Describe your app in a few sentences: who uses it, the three things it must do and the look you want."
  - "Look at the preview. Ask for one change at a time in plain words."
  - "Test it as a user would. Click every button and try bad input."
  - "Before you add sign-in or payments, check how it stores data and who can see it."
  - "Publish to the live link when it works. A custom domain needs a paid plan."
  - "You end with a working web app on a link."
  - "Next: tidy the result with the Lovable project cleaner or the Vibe-coded app cleaner."
needs:
  - "A Lovable account."
  - "A short written brief with the users, the main jobs and the look."
  - "Credits. The free plan has about 30 a month."
  - "A Supabase, GitHub or Stripe account, if the app needs them."
not_verified:
  - "Current plan prices. The note above comes from a June 2026 article."
  - "How many credits one change uses."
  - "How easy the code is for a developer to take over."
sources:
  - https://lovable.dev/pricing
  - https://eesel.ai/blog/lovable-pricing
