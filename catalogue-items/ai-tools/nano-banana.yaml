slug: nano-banana
name: Nano Banana
maker: Google
url: https://gemini.google
promise: "Create, combine and edit images from plain requests inside Gemini."
use_cases: [make-images]
categories: [image]
what_it_does:
  - Makes images from a written description in the Gemini app.
  - Edits a photo you upload when you say what to change.
  - Blends several photos into one scene.
  - "Uses references to help keep a person or product consistent across images."
  - Writes short pieces of readable text inside an image.
benefits:
  - "Ask for a product-photo edit, then check the result against the original."
  - Make a set of matching ad images from one reference picture.
  - Try image ideas for free before you pay for anything.
best_for:
  - Product photos and ad images built from your own pictures.
  - "People who want to edit a photo by typing the change."
  - "People who already use Google apps or Gemini."
not_for:
  - Long runs of images when you need a fixed monthly allowance.
  - Exact brand colours and fonts, which you still need to check by eye.
pricing:
  model: freemium
  from: Check the maker's site
  note: Free with a Google account, on a shared allowance with no published image count. Google AI Plus, Pro and Ultra raise the limits. Google lists prices in your local currency.
works_with:
  - gemini
  - adobe-firefly
  - freepik
runs_in: [web, mobile, api]
blocks:
  - gemini-image-and-video-maker
  - marketing-image-maker
  - accurate-product-image-ad-maker
  - image-ad-maker-with-exact-text
  - image-ad-settings-picker
  - scroll-stopping-image-ads
  - product-photo-set-maker
  - weekly-image-ad-batch-maker
  - three-look-product-photos
  - marketing-image-prompt-writer
  - single-image-ad-planner
  - image-upscale-checker
alternatives: [midjourney, ideogram, flux, adobe-firefly]
last_checked: 2026-10-21
first_result:
  - "Open the Gemini app at gemini.google.com and sign in. Nano Banana runs inside it."
  - "To edit, upload your own photo and say the one change you want."
  - "To make a set, upload one reference picture and describe each new scene."
  - "Compare each result to the original. Check the product, the colours and any text."
  - "Ask for one change at a time."
  - "You end with image files you can download."
  - "Next: plan the set with the Single image ad planner, or use the Accurate product image ad maker when packaging must be exact."
needs:
  - "A Google account."
  - "Your own photos, for edits."
  - "One clear change per request."
not_verified:
  - "The free allowance. Google publishes no image count."
  - "Which menu picks the image tool."
  - "Image sizes and file types."
sources:
