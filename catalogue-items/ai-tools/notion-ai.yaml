slug: notion-ai
name: Notion AI
maker: Notion
url: https://www.notion.com/product/ai
promise: "Find answers, draft pages and update records inside your Notion workspace."
use_cases: [organise-work, research, meeting-notes]
categories: [productivity, writing]
what_it_does:
  - Chats with an agent that creates and edits pages and databases for you.
  - Records meetings, then writes the summary and action points into a page.
  - Searches your workspace and connected apps and answers with sources.
  - Drafts and improves writing right inside a page.
  - Fills in database columns and writes formulas for you.
benefits:
  - Find answers in your own notes, with links to the source.
  - "Turn a recorded meeting into draft notes and next steps to check."
  - Keep notes, tasks and AI in one place instead of five apps.
  - Draft a first version of a doc from material you already have.
best_for:
  - Teams that already keep notes, wikis and projects in Notion.
  - Anyone who wants meeting notes saved next to their tasks.
  - Small companies building a shared knowledge base.
not_for:
  - People who do not use Notion. The AI works on the pages you keep there.
  - Teams that need a standalone meeting recorder with deep call analysis.
pricing:
  model: freemium
  from: US$20 per month
  note: Business, at US$20 per member billed monthly, includes the agent and AI meeting notes. Free and Plus (US$10) only include a trial of the AI. Custom agents use credits. Enterprise is priced on request.
works_with:
  - Slack
  - Google Drive
  - zapier
runs_in: [web, desktop, mobile]
blocks:
  - notion-wiki-writer
  - notion-research-writer
  - meeting-pre-read-writer
  - spec-to-task-planner
  - time-log-keeper
  - company-wiki-planner
  - brain-dump-organizer
  - weekly-meeting-actions-keeper
alternatives: [glean, guru, microsoft-copilot, claude]
last_checked: 2026-10-21
first_result:
  - "Open Notion and a page where you keep notes. The AI works on the pages you keep there."
  - "Check your plan. Free and Plus only include a trial of the AI. Business, at US$20 per member a month, includes the agent and AI meeting notes."
  - "Open the AI chat and ask one question about your own pages. Check that the answer links to the right page."
  - "Try one writing job. Select a page and ask it to improve or summarise the text."
  - "To try meeting notes, record one internal meeting and tell the people first. Read the summary against what was said."
  - "You end with an answer with links, a draft page, or a meeting summary with next steps."
  - "Next: plan your wiki with the Company wiki planner, or sort a messy list with the Brain dump organizer."
needs:
  - "A Notion workspace with your notes in it."
  - "A Business plan for the agent and AI meeting notes. Free and Plus have a trial only."
  - "Agreement from everyone before you record a meeting."
not_verified:
