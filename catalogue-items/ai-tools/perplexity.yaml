slug: perplexity
name: Perplexity
maker: Perplexity AI
url: https://www.perplexity.ai
promise: "Research questions on the web and read answers with source links to check."
use_cases: [ask-an-assistant, research]
categories: [chat-assistant]
what_it_does:
  - Searches the web and answers in plain words with numbered sources.
  - Runs longer research and writes a report.
  - Lets you ask follow-up questions on the same topic.
  - Reads files you upload and answers from them.
  - Groups related searches into shared spaces.
benefits:
  - "Open the cited pages to check what an answer is based on."
  - "Get a first overview of a market or competitor, then check the sources."
  - Keep research on one topic in one place.
  - Find out how AI search describes your own brand.
best_for:
  - Research where you need to see the source.
  - Fact checks and quick market scans.
  - People who would otherwise open ten browser tabs.
not_for:
  - "Long creative writing or brand copy. Use a general chat assistant such as ChatGPT or Claude instead."
  - Anything that rests on stale or thin sources, so open the links.
pricing:
  model: freemium
  from: US$20 per month
  note: These prices come from third-party sites, not from Perplexity, so check perplexity.ai before you pay. Free plan with limits. Pro costs US$20 per month. Max costs US$200 per month, and business plans are priced per user.
works_with: []
runs_in: [web, desktop, mobile, api]
blocks:
  - ai-search-platform-checker
  - ai-search-visibility-optimiser
  - ai-citation-scorer
  - reddit-answer-planner
alternatives: [chatgpt, gemini, claude, notebooklm]
last_checked: 2026-10-21
first_result:
  - "Go to perplexity.ai and sign up for the free plan."
  - "Ask a question with a clear scope, such as the top three competitors for one product and their prices."
  - "Open the numbered sources. Check the key facts on those pages."
  - "Ask follow-up questions to narrow it. Use a longer research run when you want a report. Whether the free plan includes the longer run is not verified; it may need Pro (US$20 a month), so check before you start."
  - "Save the work in a space for that topic."
  - "You end with a short answer followed by a numbered source list, one line per source. A longer research run gives a report. Its length was not verified. Open the sources before you rely on any fact."
  - "Next: to see how AI search describes your brand, use the AI search platform checker."
needs:
  - "A Perplexity account. Free works to start."
  - "A question with a clear scope."
  - "Time to open the sources."
not_verified:
  - "Where each mode sits in the menu."
  - "Limits on the free plan."
  - "How current its sources are for your topic."
sources:
  - https://www.eesel.ai/blog/perplexity-pricing
  - https://www.finout.io/blog/perplexity-pricing-in-2026
