slug: recraft
name: Recraft
maker: Recraft
url: https://www.recraft.ai
promise: "Create images, icons and scalable vector drafts from a written description."
use_cases: [make-images, design]
categories: [image, design]
what_it_does:
  - Makes images from a written description.
  - Makes vector graphics that stay sharp at any size.
  - Applies a style you set so images match your brand.
  - Edits and upscales images you already have.
  - Puts readable text into posters and graphics.
benefits:
  - Get icons and illustrations you can resize for any placement.
  - "Use a chosen style to guide a set of graphics for your brand."
  - Test logo and poster ideas before a designer starts.
best_for:
  - Icons, illustrations and posters for a brand.
  - Designers who want vector files from a prompt.
  - Marketing teams that need a steady look across images.
not_for:
  - "Photo-real people and product shots. Use a photographer or a stock photo library, or an image maker that handles photos."
  - Free commercial use, which the free plan does not allow.
pricing:
  model: freemium
  from: "Free plan; paid price not confirmed (third-party pages disagree)"
  note: Free plan images are public and not licensed for commercial use. Paid Basic, Pro and Teams plans add credits that reset monthly and do not roll over. Third-party pages disagree on the price.
works_with:
  - figma-ai
  - canva
runs_in: [web, api]
blocks:
  - marketing-image-maker
alternatives: [ideogram, midjourney, adobe-firefly, canva]
last_checked: 2026-10-21
first_result:
  - "Go to recraft.ai and sign up for the free plan. Free images are public and not licensed for commercial use."
  - "Choose vector for an icon or logo draft, or image for a picture."
  - "Describe the subject and the style. Set a style so a group of images matches."
  - "Make a set. Keep the closest and edit it."
  - "Check the text, the edges and any logo."
  - "You end with image or vector files. The exact file types (such as SVG or PNG) and the export sizes were not verified, so check what your plan downloads before you plan a job around it. Open a vector file in a design tool to resize it."
  - "Next: for ad images use the Marketing image maker. For exact words in an image use Ideogram."
needs:
  - "A Recraft account."
  - "A paid plan for anything you will sell or use in your business."
  - "A description of the subject and the style."
not_verified:
  - "Plan prices. Third-party pages list them differently."
  - "Which vector file types it exports."
  - "Where each tool sits in the app."
sources:
