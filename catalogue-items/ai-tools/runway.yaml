slug: runway
name: Runway
maker: Runway
url: https://runway.com
promise: "Create short video clips from prompts or images, then edit existing footage."
use_cases: [make-video, edit-video]
categories: [video]
what_it_does:
  - Makes video clips from a written description.
  - Turns a still image into a moving clip.
  - Edits existing footage, such as removing objects or changing the look.
  - Makes images and audio from the same account.
  - Spends one pool of credits across every kind of output.
benefits:
  - "Try edits or a new style on footage you already have."
  - Try several versions of a scene in one sitting.
  - Keep making and editing in one place instead of moving files between apps.
best_for:
  - Marketers who want to make and edit short clips in the same product.
  - Creative teams testing looks before a real shoot.
  - Short ad and social clips.
not_for:
  - Long videos made in one go.
  - People who want a fixed monthly cost, since heavy use drains credits quickly.
pricing:
  model: freemium
  from: "US$12 per month on yearly billing (the price on monthly billing was not confirmed)"
  note: Free plan gives a one-time grant of 125 credits. Standard is US$12 per month billed yearly and includes 625 credits a month, which reset each month.
works_with:
  - elevenlabs
  - capcut
  - midjourney
runs_in: [web, mobile, api]
blocks:
  - knitted-wool-video-prompts
  - paper-craft-video-prompts
  - watercolor-video-prompts
  - marketing-video-producer
alternatives: [kling, veo, pika, luma]
last_checked: 2026-10-21
first_result:
  - "Go to runway.com and sign up. The free plan gives a one-time grant of 125 credits."
  - "Pick one job: a clip from text, a still image into motion, or an edit of footage."
  - "Make a short clip first. One pool of credits pays for every kind of output, so keep early tests short."
  - "Check the clip frame by frame for faces, hands, on-screen text and object edges. If any look warped, run it again with a shorter or simpler prompt."
  - "To try an edit, use a short clip you own."
  - "You end with a short clip or an edited version of your footage. Typical clip length, resolution and file type were not verified, so check them in the app."
  - "Next: write the prompt with the Watercolor video clip prompt writer or the Paper craft video clip prompt writer, or plan the whole ad with the Marketing video producer."
needs:
  - "A Runway account and credits."
  - "A still image, or footage you own if you want to edit."
  - "A one-sentence description of the shot."
not_verified:
  - "How many credits one second of video uses."
  - "The longest clip it can make."
  - "Export file types."
sources:
  - https://runway.com/pricing
