slug: seedance
name: Seedance
maker: ByteDance
url: https://dreamina.capcut.com/
promise: "Create short video clips from text, pictures and visual references."
use_cases: [make-video]
categories: [video]
what_it_does:
  - Makes short video clips from a written description.
  - Turns a still image into a moving clip.
  - Takes reference images and clips to guide the look of a scene.
  - "Use it in Dreamina, or connect your app through ByteDance’s API."
benefits:
  - Test a video ad idea before you pay for a shoot.
  - Guide the look of a clip with your own reference pictures.
  - Try the free daily credits before you pay.
best_for:
  - Cinematic short clips and product ads.
  - People who already use CapCut, since Dreamina is made by the same company.
  - Prompt writers who want to try many styles of one script.
not_for:
  - Long videos with one continuous take.
  - Users in regions where the model is not offered.
pricing:
  model: freemium
  from: Check the maker's site
  note: Dreamina lists Free, Basic, Standard and Advanced plans, with free daily credits. The page does not show dollar prices, and third-party sites disagree.
