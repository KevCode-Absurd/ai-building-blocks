slug: shopify-magic
name: Shopify Magic
maker: Shopify
url: https://www.shopify.com/magic
promise: "Draft product copy, edit photos and handle store tasks inside Shopify."
use_cases: [write-copy, make-images, sell-and-support]
categories: [marketing]
what_it_does:
  - "Naming note: Shopify's page at this address now describes these features under the name Sidekick, its assistant. Shopify Magic may be an older name for the same tools (checked 26 Oct 2026)."
  - "Writes product copy from details you give it. Typing /product-description in Sidekick is one way in (checked 26 Oct 2026)."
  - "Turns phone photos into studio-style shots (checked 26 Oct 2026)."
  - "Helps you pick a theme, change your store design, and do launch tasks such as a domain, social posts and email campaigns (checked 26 Oct 2026)."
  - "Builds Shopify Flow automations for repeated jobs, and shows each change for your review before it applies (checked 26 Oct 2026)."
  - "Writes and runs code to forecast, compare or sum up your store data. In some stores it cannot run code (checked 26 Oct 2026)."
benefits:
  - "Draft product descriptions for a whole catalogue, then check each product's facts."
  - Get cleaner product photos without booking a shoot.
  - Ask about your own sales data and check the answer against your reports.
  - Finish routine admin jobs by typing what you want done.
best_for:
  - Shopify owners running a store alone or with a small team.
  - Catalogues that need many product pages written quickly.
  - New stores that need a theme and first pages.
not_for:
  - "Stores on other platforms. It only works inside the Shopify admin and the Shopify app."
  - "Brand voice work that needs heavy editing of each draft. Use Claude or ChatGPT with your brand notes instead."
pricing:
  model: subscription
  from: Included with a Shopify plan
  note: "Sidekick, Shopify's assistant, is included with your Shopify plan at no extra cost (checked 26 Oct 2026). Features and usage limits vary by plan, and the page does not say which plan gets what, so check shopify.com/pricing for your plan before you start. You need a Shopify store to use it. The page also showed a trial offer that may differ by country."
works_with:
  - Shopify
  - klaviyo
  - canva
runs_in: [web, mobile]
blocks:
  - shopify-store-setup-planner
  - shopify-theme-picker
  - shopify-dashboard-reader
  - shopify-landing-page-builder
  - product-title-cleaner
  - product-category-assigner
  - ai-ready-product-page-editor
alternatives: [klaviyo, chatgpt, claude, canva]
last_checked: 2026-10-26
checked: 26 Oct 2026
first_result:
  - "Log in to your Shopify admin on a computer, or open the Shopify app (checked 26 Oct 2026). You need a Shopify store first. Shopify offers a free trial on its sign-up page."
  - "Open Sidekick. Shopify says to click the purple glasses icon in the admin (checked 26 Oct 2026). No setup is needed."
  - "Type one small job, such as a description for one product. Add its name, material, size and price. Slash commands like /product-description are listed on Shopify's page."
  - "Read the draft against your real product. Fix any claim that is not true before you save it."
  - "Do the same for a photo: upload a phone photo and ask for a studio-style version. Compare it to the real product."
  - "You end with a short product description plus a short list of features, shown for you to edit in the admin, or an edited photo. The exact length depends on what you ask for and was not measured."
  - "Next: plan your store with the Shopify store setup planner, or clean up product titles with the Product title cleaner."
needs:
  - "A Shopify store on any plan. Sidekick is included, but limits vary by plan."
  - "Product facts for each item: name, materials, size, price and what it is for."
  - "Phone photos of your products, if you want the photo edit (optional)."
  - "A line or two on your brand voice, such as how formal you are (optional)."
example:
  task: "Draft a short product description for one new item in your catalogue, using the name, material, size and price you type in."
  cost: "Sidekick is included with your Shopify plan (checked 26 Oct 2026). Shopify's page does not state a price per use or a usage limit, so check your plan."
  reply: "A short block of product copy to edit. Length and tone depend on what you ask for. Our example shows the shape only, not a measured result. Check every fact against your product before you publish."
not_verified:
  - "That the name Shopify Magic is still used. Shopify's page at this address now describes Sidekick, and the Sidekick help page we read did not mention Shopify Magic."
  - "Whether Sidekick writes ShopifyQL queries. An earlier note here said so, but we could not confirm it on 26 Oct 2026."
  - "Which features and limits each Shopify plan gets. Shopify's page says they vary by plan and gives no table."
  - "How good the drafts are, or how much editing they need. We did not test it."
sources:
  - https://www.shopify.com/magic
  - https://help.shopify.com/en/manual/shopify-admin/productivity-tools/sidekick
  - https://www.shopify.com/pricing
