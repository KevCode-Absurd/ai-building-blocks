slug: stable-diffusion
name: Stable Diffusion
maker: Stability AI
url: https://stability.ai
promise: "Create and edit images locally or connect the model to your own app."
use_cases: [make-images]
categories: [image]
what_it_does:
  - Makes images from a written description.
  - "Removes parts of images, fills gaps, extends edges and removes backgrounds."
  - Makes small images bigger and sharper.
  - Follows a sketch or a layout you give it.
  - Offers model files you can download and run yourself.
benefits:
  - "Make batches of images using a setup you control."
  - "Run the model locally when your setup must keep files on your computer."
  - Build image steps into your own app or workflow.
best_for:
  - Developers and technical teams that want control over the model.
  - Batch jobs such as many product backgrounds.
  - People who want to tune a model on their own images.
not_for:
  - A first-time user who wants a simple app with a chat box.
  - Anyone who does not want to set up software or an API.
pricing:
  model: usage
  from: US$0.009 per image
  note: The API sells credits at US$0.01 each. Stable Image Core costs 3 credits and Ultra costs 8, and the cheapest model starts at 0.9 credits. New accounts get 25 free credits. Check the licence before using downloaded models in a business.
works_with:
  - ComfyUI
  - flux
  - krea
runs_in: [api, desktop]
blocks:
  - marketing-image-maker
alternatives: [flux, midjourney, leonardo, ideogram]
last_checked: 2026-10-21
first_result:
  - "Choose how you will run it: through the Stability AI API, or by downloading model files to run on your own computer. The second needs technical setup."
  - "For the API, create an account on stability.ai and make an API key. New accounts get 25 free credits."
  - "Send one request with a written description. Look at the image that comes back."
  - "For local use, read the licence on the model file before you use it in a business."
  - "Check the image for odd details before you use it."
  - "You end with image files from the API, or from your own computer."
  - "Next: write the description with the Marketing image prompt writer. If you want a simple app with a chat box, compare Leonardo."
needs:
  - "For the API: an account, an API key and credits (25 free to start)."
  - "For local use: a computer that can run the model, and someone with technical skill."
  - "A written description of the image."
not_verified:
  - "Setup steps for each way to run it."
  - "Which model licence fits business use."
  - "What computer you need to run it locally."
sources:
  - https://docs.stability.ai/pricing
