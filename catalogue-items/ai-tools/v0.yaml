slug: v0
name: v0
maker: Vercel
url: https://v0.app
promise: "Turn an app idea into code and a live preview, ready to deploy."
use_cases: [build-apps, design, code]
categories: [coding]
what_it_does:
  - Builds user interfaces and full apps from a plain-words prompt.
  - "Turns a wireframe or mock-up into a detailed working screen."
  - Shows a live preview as it builds.
  - Fixes errors in the code on its own.
  - Deploys to Vercel in one click.
  - Opens a pull request for review.
benefits:
  - "Build a clickable screen to review with a client."
  - Hand a developer real code to build on, not a picture.
  - Change copy and layout by asking for it.
  - Publish a prototype to a live link in one step.
best_for:
  - Designers and product people who want to test a screen as real code.
  - Developers who build with React and Vercel.
  - Teams that want a quick prototype before a full build.
not_for:
  - "A complete system for data and server work without technical help."
  - Free users who need more than 7 messages a day.
pricing:
  model: freemium
  from: US$30 per month
  note: Free plan with a limit of 7 messages a day. Plus is US$30 per user per month and includes US$30 of credits and US$2 of free daily credits. Business is US$100 per user per month.
works_with:
  - GitHub
  - Vercel
  - Figma
runs_in: [web, api]
blocks: []
alternatives: [lovable, bolt, replit, cursor]
last_checked: 2026-10-21
first_result:
  - "Go to v0.app and sign up on the free plan. It allows 7 messages a day."
  - "Type the screen or app you want in plain words. Name the page, what is on it and what a visitor does. Or upload a wireframe or mock-up."
  - "Watch the live preview as v0 builds it. Click through it as a visitor would."
  - "Ask for changes in words, one at a time, such as a new headline or a different layout. Each change uses a message."
  - "When it works, deploy it to Vercel or open a pull request on GitHub. Hand the code to a developer if it needs server or data work."
needs:
  - "A v0 account. Free works to start, with 7 messages a day."
  - "A plain-words description of the screen, or a wireframe or mock-up."
  - "Your own copy, colours and brand rules, so v0 does not invent them (optional)."
  - "A GitHub account for pull requests, and a Vercel account for one-click deploys (optional)."
example:
  reply: "A live preview link, the code behind it (React by default), and a pull request on GitHub if you connect it. Treat it as a prototype. A developer should review the code before customers use it."
sources:
  - https://v0.app/pricing
  - https://v0.app
