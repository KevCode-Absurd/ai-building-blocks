slug: veo
name: Veo
maker: Google
url: https://deepmind.google/models/veo/
promise: "Create short video clips with sound from text or still images."
use_cases: [make-video]
categories: [video]
what_it_does:
  - Makes short video clips from a written description.
  - Turns a still image into a moving clip.
  - Adds sound, speech and music to the clip.
  - Works inside Gemini, Google Flow and the Gemini API.
benefits:
  - Test a video ad idea before you pay for a shoot.
  - Get a clip with its own sound, so you skip a separate audio step.
  - "Use a product photo to guide the clip, then check its details."
best_for:
  - Short ad clips for Reels, TikTok and Shorts.
  - People who already pay for a Google AI plan.
  - Developers who want video inside their own app through the API.
not_for:
  - Long videos with one continuous take.
  - Exact on-screen text, which still comes out wrong often.
pricing:
  model: subscription
  from: Check the maker's site
  note: Sold through Google AI Plus, Pro and Ultra plans with usage limits, and per second through the Gemini API. Prices differ by country and Google changes plans often.
works_with:
  - gemini
  - elevenlabs
  - capcut
runs_in: [web, mobile, api]
blocks:
  - video-ad-shot-list-maker
  - weekly-video-ad-batch-maker
  - avatar-storyboard-planner
  - talking-object-video-prompts
  - selfie-style-video-prompts
  - podcast-style-video-prompts
  - short-film-video-prompts
  - 3d-explainer-video-prompts
  - offer-reel-real-product
  - wordless-video-ad-opening-writer
alternatives: [kling, runway, seedance]
last_checked: 2026-10-21
first_result:
  - "Pick where to run it: Gemini, Google Flow or the Gemini API. Gemini and Flow need a Google AI plan. The API is paid per second of video."
  - "Write the clip in one paragraph. Say who or what is in it, what happens, the camera view and the sound you want. Or upload a still image, such as a product photo, to start from."
  - "Generate one clip and watch it with sound on. Check the product, the hands and any words on screen. On-screen text often comes out wrong."
  - "Change one thing at a time in the prompt and generate again."
  - "Save the best clip. Add text, a logo and a voice-over in a video editor, then check the result on a phone. For a longer ad, join several clips there."
needs:
  - "A Google AI plan (Plus, Pro or Ultra) for Gemini and Flow, or a Gemini API key for developers. Plans have usage limits."
  - "A clip idea in a few lines, or a still image."
  - "A product photo, if the clip features your product (optional)."
  - "Your real claims and wording, added in editing. Do not ask Veo to write them on screen."
example:
  reply: "One short video clip with sound, as a file you download. The clip is only a visual draft. Add your real claims, text and logo in an editor, and check it against ad rules before it runs."
sources:
