slug: whisper
name: Whisper
maker: OpenAI
url: https://github.com/openai/whisper
promise: "Turn recordings into text in many languages, locally or through a paid API."
use_cases: [voice-and-audio, meeting-notes]
categories: [voice]
what_it_does:
  - Turns an audio recording into written text.
  - Works with many languages and can tell which one is spoken.
  - Translates speech into English with the multilingual models.
  - Runs on your own computer with open source code under the MIT licence.
  - Is also sold per minute through the OpenAI API.
benefits:
  - "Run the open model on your own computer to make transcripts."
  - Keep audio on your own computer when it is private.
  - Pay about US$0.36 an hour if you would rather not run it yourself.
best_for:
  - Transcripts of meetings, podcasts and videos.
  - Developers who add speech-to-text to their own app.
  - Teams who want private transcripts on their own machine.
not_for:
  - People who want a ready-made app with a summary, since Whisper only returns the text.
  - Slow computers without a graphics card for the larger models.
pricing:
  model: free
  from: Free
  note: The open source model is free to run. OpenAI's API charges US$0.006 per minute of audio for the hosted version.
works_with:
  - chatgpt
  - claude
  - fireflies
runs_in: [desktop, api]
blocks:
  - whisper-speech-transcriber
  - audio-meeting-notes-writer
  - meeting-notes-maker
  - dead-air-and-retake-cutter
  - youtube-transcript-saver
  - voice-swap-editor
alternatives: [otter, fireflies, elevenlabs, descript]
last_checked: 2026-10-21
first_result:
  - "Choose how to run it. For private audio, run the open source model on your own computer. For no setup, use OpenAI's API."
  - "To run it yourself, follow the install steps on the GitHub page. It needs Python and a tool called ffmpeg. A computer with a graphics card runs the larger models faster."
  - "Point it at one audio or video file. Tell it the language, or let it detect the language."
  - "Read the text against the audio. Check names, numbers and product words, since these are the usual errors."
  - "Paste the text into Claude or ChatGPT to get a summary, action items or an article."
needs:
  - "An audio or video file with clear speech."
  - "For the open source model, a computer where you can install Python and ffmpeg. For the API, an OpenAI account and a payment method."
  - "The language spoken, if you know it (optional)."
  - "A list of names and product words to check against the transcript (optional)."
example:
  reply: "The words from your recording as text, with no summary, speaker names or formatting. The open source tool can also write subtitle files. Check the GitHub page for the formats."
sources:
  - https://github.com/openai/whisper
  - https://developers.openai.com/api/docs/models/whisper-1
