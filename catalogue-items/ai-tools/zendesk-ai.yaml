slug: zendesk-ai
name: Zendesk AI
maker: Zendesk
url: https://www.zendesk.com/service/ai/
promise: "Answer common support questions, draft replies and route tickets inside Zendesk."
use_cases: [sell-and-support]
categories: [sales-and-support]
what_it_does:
  - Runs AI agents that answer customers across chat, email and messaging.
  - Charges per automated resolution, with a few included each month.
  - Helps your team with drafted replies and summaries through Copilot.
  - Routes tickets to the right team.
benefits:
  - "Set up AI answers for common tickets, with staff handling the rest."
  - Give your team a drafted reply to edit and send.
  - Keep one place for tickets from every channel.
best_for:
  - Support teams already on Zendesk.
  - "Teams with many repeat questions that AI can help answer."
  - "Leaders who compare results from different kinds of support messages."
not_for:
  - Small teams that only need a shared inbox. Gorgias suits small online stores, or a plain shared inbox may be enough.
  - Anyone who wants a single flat price for support and AI.
pricing:
  model: subscription
  from: US$19 per month
  note: Support Team costs US$19 per agent a month on yearly billing (US$25 monthly). AI agent resolutions are extra at US$2.00 each pay-as-you-go, and Copilot adds US$50 per agent a month.
works_with:
  - Slack
  - Salesforce
  - Shopify
runs_in: [web, mobile, api]
blocks:
  - support-desk-automation-builder
  - support-capacity-planner
  - data-request-reply-drafter
  - chat-export-need-finder
alternatives: [intercom-fin, gorgias, hubspot-breeze]
last_checked: 2026-10-21
first_result:
  - "Start with a Zendesk Support plan. Open your Zendesk admin settings and find the AI agent and Copilot options."
  - "List the 10 questions customers ask most. Write the correct answer to each from your own policies, or find it in your help centre articles."
  - "Point the AI agent at those help articles, so it answers from your words and not its own guess."
  - "Test it with real past questions. Read every reply it gives. Fix the articles that lead to a wrong answer."
  - "Turn it on for one channel and one type of question first. Watch the resolutions, and read some tickets it closed."
  - "Add Copilot for your team once the AI agent works. It drafts replies for your staff to edit and send."
  - "You end with AI replies on one channel, drafted replies for staff, and tickets tagged for the right team. Next: each month, check how many resolutions the AI closed, what they cost at US$2.00 each, and a sample of closed tickets. Add the next channel only when wrong answers are rare."
needs:
  - "A Zendesk Support plan."
  - "Help centre articles or written answers for your common questions."
  - "A list of topics a person must always handle, such as refunds, legal threats and health issues."
  - "A budget for resolutions, since each one the AI agent closes costs extra."
  - "Copilot (optional): an extra charge per agent each month."
example:
  reply: "AI replies to common tickets in chat and email, a drafted reply for staff to edit, and tickets routed to the right team. Staff still handle anything the AI should not answer."
sources:
  - https://www.zendesk.com/pricing/
