new_slug: advertorial-draft-editor
name: "Advertorial draft editor"
summary: "Paste your advertorial draft and get an edited version with a clear headline, plain words, exact study claims and a list of what still needs proof."
job: write-landing-page
thinking: medium
thinking_why: "It edits against clear rules and does simple sums, so a mid-size model is enough."

headline: "Advertorial draft editor"
subhead: Paste your advertorial draft and the idea it should carry. It fixes the headline, the opening, choppy lines, hard words and loose metaphors. You get the edited draft, subheadline options, a change log with reading grade before and after, and plain proof lines.

explain: |
  A draft advertorial usually has the same faults: a headline with too many ideas, an opening that starts with pain like every rival, choppy one-line paragraphs, long words and study numbers that are vague or stretched. An AI first draft often adds stock phrases on top.

  This skill edits the draft with a fixed set of checks. It tests the headline in one second, matches the headline to the advertorial type, and opens with curiosity, proof and benefit before pain. It adds permission words, rewrites fragments, lowers the reading level and checks that each metaphor fits what the product does. It also turns raw study numbers into exact plain claims, without rounding in your favour. It flags anything that still needs proof, or that makes the page look like something it is not.

when:
  - Your AI-written advertorial draft sounds stiff, choppy or full of stock phrases.
  - Your draft quotes a study and you want the number stated exactly in plain words.
  - Your headline tries to do three things and you want one clear curiosity hook.
not_for:
  - "Your page has no real study or proof to check: add the proof first, or use a plain copy editor for the wording only."
  - "Your ad is not written like an article, such as a short social ad: use the Sales copy editor instead."
  - "You only want to strip stock AI phrases from any copy: use the AI-style wording editor instead."

you_give:
  - The advertorial draft
  - The one idea and advertorial type it should carry (optional)
  - Proof you hold, such as studies, test results and review counts (optional)

you_get:
  - The edited draft
  - Three to five subheadline options per section
  - A change log with the reading grade before and after
  - Proof lines in plain words, each with a source note and limits, and a list of claims that still need proof

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the full draft and say which idea and type it should carry.
  - Paste any study details exactly (group size, length, control and treated figures, who ran it).
  - Read the change log and the list of claims that need proof.
  - Fix or cut each unproven claim before you publish.
output_sample:
  input:
    - Your advertorial draft
    - The one idea and advertorial type it should carry (optional)
    - Proof you hold, such as studies, test results and review counts (optional)
  output:
    - name: Edited draft
      contains: The full draft with a clearer headline, a new opening, smoother lines and plainer words.
    - name: Subheadline options
      contains: Three to five options for each section that read as a story when stacked alone.
    - name: Change log
      contains: Each change with the reason and a before and after, plus the reading grade before and after.
    - name: Proof lines
      contains: Each claim in plain words with a source note, its limits and the exact relative change worked out.
    - name: Still needs proof or review
      contains: Claims with no proof, or health, money or legal claims that need a qualified person.
    - name: Checks missed
      contains: Any check that was not run, or the word none.

how_it_works:
  - title: Tests the headline
    text: Could a stranger say what this is about at once? Keeps one curiosity element, two at most.
  - title: Matches type and headline
    text: A warning must warn about one thing. Removes tag-ons that don't serve the type.
  - title: Fixes the opening
    text: Opens with curiosity, proof, a constraint and the benefit, then pain, with permission words first.
  - title: Fixes the rhythm
    text: Rewrites choppy fragments as full sentences and keeps short lines to once or twice.
  - title: Lowers the reading level
    text: Swaps long words for short ones, to about grade 5 to 7, and reports grade before and after.
  - title: Writes subheadlines
    text: Three to five options per section that read as a story when stacked alone.
  - title: Checks metaphors
    text: Does the verb fit what the product does?
  - title: Translates study numbers
    text: Computes the exact relative change, rates the source and ties the claim to what was measured.

output_shape: |
  EDITED DRAFT
  <full edited text>

  SUBHEADLINE OPTIONS
  <section>: 1 <...> 2 <...> 3 <...> (best: <n>)

  CHANGE LOG
  <change> | why | before -> after
  READING GRADE: <before> -> <after>

  PROOF LINES
  <claim in plain words> | source note | limits
  Calculation: <control> -> <treated> = <relative change>

  STILL NEEDS PROOF OR REVIEW
  <claim> | <proof missing | needs qualified-person review>
  CHECKS MISSED: <none | list>

tweaks:
  - what: The idea and type
    how: Say which type you want, such as warning, discovery or origin story. It then trims the headline to fit that type.
  - what: Study details
    how: Paste the raw numbers, group size, length and who ran it. The exact relative change depends on them.
  - what: Reading grade
    how: Ask for grade 5 to 7 or leave it. A higher grade keeps the editorial feel. Feeling stays strong at either.
  - what: Brand voice
    how: Add your brand's voice rules, so edits keep your tone.

judge:
  - The headline passes the one-second test and has one big curiosity element.
  - No fact, number, study or expert was added that you did not supply.
  - Every study number is stated exactly, with group size, length and design.
  - The change log lists what changed and why, with the reading grade before and after.
  - Claims with no proof or needing review are listed, not hidden.

test:
  - Paste a draft with a deliberately stretched number (say, a 40% claim from a 24% change). It should correct it and show the sum.
  - Run it twice on the same draft. The edits should match in spirit and the same claims should be flagged.
  - Show the edited headline to a stranger for five seconds and ask what the page is about.
  - Have a second reader compare draft and edit for any new claim. There should be none.

improve:
  - Add your own banned phrases and AI tells to the skill file, so they are cut every time.
  - Add the grade range you want and your reading-level tool, so the report matches.
  - Add your approved proof lines and source notes, so the same study is always worded the same way.
  - Pair it with the Advertorial story and belief checker to catch spots where the story turns into a pitch.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI can run the edit. Paste the full draft in one go so it keeps the order."}
  inputs:
    - "The study paper or summary page for any study the draft quotes"
    - "Your brand voice rules"
    - "The ad that sends traffic to the page, so headline and ad stay matched"

terms:
  - term: Advertorial
    meaning: An ad written like an article. Label it as an ad where the platform or law requires.
  - term: Relative change
    meaning: How much a number moved compared with where it started, such as a fall from 0.45 to 0.24, which is nearly half.
  - term: Permission word
    meaning: A softener such as "maybe" that lets a reader accept a claim without feeling pushed.
