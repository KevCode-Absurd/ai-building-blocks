new_slug: ai-recommendation-panel-runner
name: "AI recommendation panel runner"
summary: "Test which stores AI names for your shopper questions. Get share of voice, the sources cited instead of you and a score out of 100."
job: get-found-in-search
thinking: medium
thinking_why: "It sorts many answers into a table and counts them. A mid-level model is enough. The questions must be run by you or by an AI that can browse."

headline: "AI recommendation panel runner"
subhead: "Give it your store name, your rivals and a list of shopper questions. It sets up a repeatable test on each AI assistant. You run the questions and paste the answers back. It records who gets named, linked and cited, and gives you a results table, your share of voice and a score out of 100."

explain: |
  Ask an AI assistant "best running shoes for flat feet" three times and you may get three different lists. One run proves nothing. To know if AI is naming your store more or less often, you need the same questions, asked the same way, on a schedule. That is an AI visibility test, and this skill sets it up.

  It fixes the questions. It runs each one several times, plus reworded versions, on each assistant that matters, in a fresh private window. It records three states for each run: named and linked, named without a link, and not there. Then it works out your share of voice and lists the sites AI cited instead of you. It also plans a fair test of any tactic, using questions you leave alone as a control.

  It shows if you are visible. It does not show how many people found you through AI. Answers vary by person, place and chat memory, so treat the score as a trend, not a ranking.

when:
  - You want to know if AI assistants name your store at all, and how that compares with your rivals.
  - You did something to get named, such as Reddit answers or a video, and want to know if it worked.
  - You need a monthly report on AI visibility without buying a paid tracker.
  - A rival keeps showing up in ChatGPT or Perplexity answers and you want to see which sites feed it.

not_for:
  - "You want to count visitors who came from AI tools. Use the AI traffic tracking planner."
  - "You want to know what to change on your pages to get named. Run this first, then use the AI search recommendation gap finder."
  - "AI says wrong things about your store, such as old prices or a wrong address. Use the AI store facts checker."
  - "You have no shopper questions yet. Use the Customer search question mapper first."

you_give:
  - Your store name, your domain and your three to five closest rivals
  - A fixed list of shopper questions, from the Customer search question mapper or your own
  - Which AI assistants you can run, and whether you are logged in or not
  - A spreadsheet to keep the runs (optional)

you_get:
  - "A results table: question, assistant, run, named, linked, position, rivals"
  - Share of voice for each assistant and each question group
  - A ranked list of the sites AI cited when it did not name you
  - A test plan with questions you leave alone and questions you act on
  - A visibility score out of 100, with the sum shown

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. It cannot browse other assistants for you, so you run the questions.
  - Paste your question list. If you have none, ask for 30 and keep the 10 to 20 closest to a purchase.
  - Run each question in a fresh private window on each assistant. Paste the answers back. Run each one more than once.
  - Ask for the table, your share of voice and the sources list.
  - Run the same questions each week and review each month.

how_it_works:
  - title: Fixes the panel
    text: It freezes the wording of your questions, so weeks can be compared. A solo owner can start with 15. A bigger catalogue can use 40 to 60.
  - title: Plans the runs
    text: Each question several times, plus 2 to 3 reworded versions, on each assistant, in a private window.
  - title: Compares free and logged in
    text: Free versions can skip web search, so they may give no citations. The skill marks those runs and leaves them out of citation counts.
  - title: Records three states
    text: Named and linked, named but not linked, or not there. It also logs position, rivals and sources.
  - title: Works out share of voice
    text: The percent of runs where you are named, and your average list position, for each assistant and each question group.
  - title: Ranks the sources
    text: It lists every site cited on questions where you were missing, counted by how many questions it appears on.
  - title: Plans a fair test
    text: It splits the panel in half. Half is left alone as the control, half is acted on. It compares two weeks before and two weeks after.
  - title: Scores visibility
    text: Named runs divided by valid runs, times 100, shown for each assistant with the sum.

output_shape: |
  PANEL  <number of questions> | <assistants> | <runs per question> | <date range>

  RESULTS
  <question> | <assistant> | <run> | <NAMED + LINKED / NAMED / ABSENT / NO SEARCH> | <position> | <rivals named>
  (one row per run)

  SHARE OF VOICE
  <assistant> | named in <n> of <runs> (<percent>) | linked in <n> | average position <n>
  <question group> | named in <percent>

  SOURCES AI CITED INSTEAD OF YOU
  <domain> | appears on <n> questions | action: <outreach idea>

  TEST PLAN
  Control (leave alone): <half of the questions>
  Test (act on): <the other half> | action: <tactic>
  Compare: <two weeks before vs two weeks after>

  SCORE  <n>/100 (<named runs> of <total runs> x 100 = <n>)

  NOT RUN  <what, and why>
  FIGURES  dated <month year>, from <named source>, or none quoted
  MISSING: <what was not given>
  READING RULES: answers vary by person, place and chat memory, so this is a trend, not a ranking. Named without a link counts as visibility. Runs with no web search are left out of citation counts.

output_sample:
  input:
    - Your store name, domain and three to five closest rivals
    - A fixed list of shopper questions
    - The AI assistants you can run, and whether you are logged in
    - The answers you paste back from each run
  prerequisites:
    - Shopper questions from the Customer search question mapper (optional)
    - A private browser window for each assistant
  output:
    - name: Panel
      contains: The number of questions, the assistants, the runs for each question and the date range, so next week's test matches.
    - name: Results
      contains: One row per run with the question, assistant, run number, named or linked or absent, list position and rivals named.
    - name: Share of voice
      contains: For each assistant and question group, how often you are named, how often linked and your average position.
    - name: Sources AI cited instead of you
      contains: The sites AI cited when it did not name you, counted by questions, each with an outreach idea.
    - name: Test plan
      contains: Half the questions left alone as a control, half acted on, and a before and after comparison over two weeks each.
    - name: Score
      contains: Your visibility out of 100 with the sum shown, for the whole panel and for each assistant.
    - name: Reading rules and gaps
      contains: A fixed note that answers vary and the score is a trend, plus what was not run and what was missing.

tweaks:
  - what: The number of questions
    how: A solo owner can start with 15. Ask an AI for 30 and keep the 10 to 20 nearest a purchase. The 40 to 60 for a larger catalogue is a working rule, not a source's number.
  - what: Which assistants
    how: List the ones your shoppers use, such as ChatGPT, Gemini, Perplexity, and Google for AI Overviews. A rare assistant is not worth the time.
  - what: Logged in or not
    how: Say which you can run. Paid accounts usually search the web. Free ones often do not, so their runs say little about citations.
  - what: Your rivals
    how: Name three to five. The table then logs when they are named and you are not.

judge:
  - The question wording is frozen and shown, so next week's run is comparable.
  - Every question has several runs, not one.
  - Named without a link is counted as visibility, not as a miss.
  - Runs with no web search are marked and left out of the citation counts.
  - The skill says answers vary by person, place and chat memory, so the numbers are a trend and not a ranking.

test:
  - Run the same five questions twice in a row. Note how much the answers change. That is your noise level.
  - Compare one question in a private window and in your logged-in account. See if the lists differ.
  - Pick one question where a rival is named and you are not. Check that the sources list shows where the rival gets named.
  - After you act on the test questions, check the control questions did not rise too. If they did, the tactic did nothing.

improve:
  - Add your own question groups to the skill file, such as best of, versus, fit and worth it.
  - Add the assistants you care about and a rule for how many runs each gets.
  - Save the table in a spreadsheet and the top cited sources in your org context.
  - Pair it with the AI search recommendation gap finder, which reads this output, and the AI store facts checker.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Records and counts the runs you paste in, and sorts the sources."}
    - {name: "A spreadsheet", why: "Enough for a small panel. A paid answer tracker only pays off at hundreds of questions."}
    - {name: "Ahrefs Brand Radar or Semrush", why: "Paid trackers can run large panels. Check the vendor's current price and pick the cheapest one that does the job."}
  inputs:
    - "Questions from the Customer search question mapper"
    - "Your rivals' product pages"
    - "Last month's table, so changes show"

terms:
  - term: Share of voice
    meaning: The share of AI answers in which your store is named.
  - term: Citation
    meaning: A link to your site shown in an AI answer.
  - term: Fan-out
    meaning: The extra searches an AI runs behind one question before it writes an answer.
  - term: Control group
    meaning: Questions you leave alone, so you can tell if a change came from your action or from the usual swings.
