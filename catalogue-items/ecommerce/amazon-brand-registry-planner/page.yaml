new_slug: amazon-brand-registry-planner
name: "Amazon brand registry planner"
summary: "Plan your Amazon Brand Registry application: check your name, pick a trademark type, and get an application pack and tools to turn on."
job: sell-on-amazon
thinking: low
thinking_why: "It follows a short, fixed order of steps, and the main risk is stale rules, which you check on Amazon's own pages."

headline: "Amazon brand registry planner"
subhead: Give it your brand name, logo, country and category. It plans the order of steps from name check to trademark to registry application. You get a trademark choice, the application pack and a list of tools to turn on after approval.

explain: |
  Brand Registry gives a brand owner more control of its listings and opens tools that other sellers cannot use, such as A+ content, Vine, brand analytics and the brand referral bonus. To apply, Amazon wants a trademark, and the order you do things in matters. A name that is too close to another brand can force a rebrand: two sellers in the source said they had to change names, and one put the cost at over 100,000 dollars in lost launches (their own figure, not a rule).

  This skill is a store version of a general brand protection planner. It covers the first-time order: check the name, apply for the trademark, take real photos of the product with your logo on it, then apply to the registry. Amazon asks for a registered or pending trademark, a logo image, a photo of the logo on the product or packaging, and your categories. You don't need an ASIN or a listing to apply. It lists what to turn on after approval. A trademark is specific to a country, and rules and open tools change, so confirm on the registry site. This is not legal advice.

when:
  - You have a brand name and are about to order stock, and want to protect the name from day one.
  - You have a listing live and want the tools that registry opens.
  - You are choosing between a word mark and a logo mark for a generic-sounding name.
not_for:
  - "Your brand is already in Amazon Brand Registry: use Amazon's own Brand Registry support for listing disputes and fakes."
  - "You sell on another marketplace, like eBay or Etsy: use that marketplace's own brand program pages."
  - "You need legal advice on a trademark: ask a qualified trademark attorney, since this plan is not legal advice."

you_give:
  - Your brand name and logo
  - Your country and category
  - Your current listing ASIN (optional, not needed to apply)
you_get:
  - A trademark choice and filing plan
  - The registry application pack
  - A list of tools to turn on after approval

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Give your brand name, logo, country and category, and the ASIN if you already have a listing.
  - Search the trademark database for your name and close spellings before you pay for anything. Paste what you find.
  - Follow the plan in order. Check each step on Amazon's registry page and the trademark office's page, since rules change.
  - Before you rely on a trademark, ask a qualified trademark professional.
output_sample:
  input:
    - Your brand name and logo
    - Your country and category
    - Your listing ASIN (optional)
    - Your trademark search results (optional)
    - Where your product is made (optional)
  prerequisites:
    - A trademark search you run yourself on your national office site, then paste the results
  output:
    - name: NAME CHECK
      contains: Your name set against close marks you found, with a risk of low or check further.
    - name: TRADEMARK CHOICE
      contains: Word mark, logo mark or both, why, your country and the filing steps.
    - name: REGISTRY APPLICATION PACK
      contains: Your trademark number, logo image, a real photo of the product or packaging with the logo, categories, answers and website.
    - name: TURN ON AFTER APPROVAL
      contains: Each registry tool to switch on, with what it does for you.
    - name: ALSO CONSIDER
      contains: A provisional patent for a new invention, and a manufacturer agreement against copying.
    - name: CHECK ON THE REGISTRY SITE
      contains: Current rules and tools to confirm, a not legal advice note and any missing items.

how_it_works:
  - title: Checks the name
    text: Checks the name is not close to another brand before any money is spent.
  - title: Picks the mark type
    text: Compares a word mark with a logo mark. A logo mark was easier to win for generic names in the source.
  - title: Plans the filing
    text: Applies for the trademark first. Amazon's registry page accepts a registered trademark, and a pending application in some cases, so you confirm yours on the registry site.
  - title: Plans the product photos
    text: Asks for a real photo of the product or packaging with the logo on it. No mock-ups, stock or edited images.
  - title: Builds the application pack
    text: Collects the trademark number, logo image, product photo and categories.
  - title: Lists the answers
    text: Plans the seller account, category, distribution answers and website.
  - title: Lists what to turn on
    text: After approval, A+ content, video, Vine, brand analytics, the brand referral bonus, sponsored brands ads, a store page, subscribe and save and the violation report tool.
  - title: Adds protection notes
    text: Notes provisional patents for new inventions and a manufacturer agreement against copying.

output_shape: |
  NAME CHECK
  <name> vs close marks found: <list> | risk: <low | check further>

  TRADEMARK CHOICE
  Mark type: <word | logo | both> | why: <...>
  Country: <...> | status needed for registry: <registered or pending application (Amazon's Brand Registry page)>
  Filing steps: <...>

  REGISTRY APPLICATION PACK
  Trademark number: <...> | Trademark office: <...>
  Logo image: <file> | Real photo of product or packaging with the logo: <file>
  Categories: <...> | Website: <... or none> | ASIN: <... or none, not required>
  Distribution answers: <...>

  TURN ON AFTER APPROVAL
  <tool>: <what it does for you>

  ALSO CONSIDER
  <provisional patent for a new invention | manufacturer agreement>

  CHECK ON THE REGISTRY SITE: <current rules and tools> | page: Amazon Brand Registry (brandservices.amazon.com) | last checked: <date>
  NOT LEGAL ADVICE: check with a qualified trademark professional.
  MISSING: <brand name | country | trademark number | product photo>

tweaks:
  - what: Country
    how: A trademark covers one country. Say where you sell and where you may sell next.
  - what: How generic the name is
    how: A generic-sounding name may be denied as a word mark, so the plan leans to a logo mark.
  - what: Whether the listing exists
    how: You can apply without a listing or an ASIN. The application needs a real photo of the product or packaging with the logo on it, so check Amazon's image rules first.
  - what: Where you make the product
    how: Say where the maker is. The plan adds a manufacturer agreement note.

judge:
  - The order is name check, trademark filing, real product photos, then registry application.
  - The plan says a registered or pending trademark is accepted, and that trademark approval can take a long time (one source says 6 to 18 months).
  - The pack lists what Amazon's page asks for: trademark number, logo image, a real photo of the logo on the product or packaging, and categories.
  - The turn-on list names each tool and what it does for you.
  - The plan says it is not legal advice and the rules change.

test:
  - Search the trademark database yourself for your name. The plan's name check should match what you find.
  - Read Amazon's registry page and compare the application pack with what it asks for.
  - Show the plan to a trademark professional and ask what they would change.
  - After approval, check each tool on the turn-on list is available in your account.

improve:
  - Add your chosen countries and the trademark office for each to the skill file.
  - Add your logo files and a real product photo showing the brand so the pack is ready.
  - Add a note of which tools you have turned on and the date.
  - Pair it with the Amazon listing writer for the listing and the Amazon launch week planner for Vine.

works_best_with:
  tools:
    - {name: "Your national trademark office search", why: "The free place to search for close marks before you spend money."}
    - {name: "Amazon Brand Registry page", why: "Where you apply and where current requirements are listed."}
    - {name: "A trademark attorney", why: "A qualified person can check scope and wording. This skill is not legal advice."}
  inputs:
    - "A trademark search result for your name and close spellings"
    - "Your logo files and a real photo of the product with the brand visible"
    - "Your listing ASIN, if you have one"
    - "The countries you sell in or plan to"

terms:
  - term: Word mark
    meaning: A trademark on the words of the brand name, in any style.
  - term: Logo mark
    meaning: A trademark on the design of your logo. Easier to win when the name is generic.
  - term: ASIN
    meaning: Amazon's product code for a listing.
  - term: Provisional patent
    meaning: A cheap first filing that holds a date for a new invention. The source says 75 dollars, which may have changed.
