new_slug: awareness-stage-ad-framework-chooser
name: Awareness-stage ad framework chooser
summary: Pick the right ad copy structure for what your buyer already knows. Get a headline, body and CTA, plus a warning if the stage is wrong.
job: write-ad-copy
headline: Awareness-stage ad framework chooser
subhead: Share product, buyer awareness stage, offer and proof. Get a stage-matched framework and ad copy.
explain: |-
  Copy that works on someone who already knows your brand confuses someone who has never heard of the problem. Copy that teaches the unaware bores the buyer who is ready to order. Most weak ads speak to the wrong stage.

  This skill asks what your buyer already knows, using five stages from unaware to most aware. It picks the copy structure for that stage, writes a headline, subheadline, body and call to action from your facts, and warns which other stages the ad would fail. It uses only the proof you give it.
when:
  - You are about to write an ad and are not sure what your buyer already knows.
  - An ad is not working and you think it speaks to the wrong stage.
  - You need one ad per stage for a new campaign.
  - You want to see which stages your current copy would fail.
not_for:
  - "Your buyer's stage is still unknown after you check: ask a few customers, or read your reviews first, then come back."
  - "Your audience mixes several stages: write one ad per stage, or split the audience first."
  - "You need market research on who your buyers are: do that first with a person or a survey, not this."
you_give:
  - Your product and what it does
  - Your buyer's awareness stage (optional)
  - Your offer and price terms
  - Your real proof, such as reviews or results (optional)
you_get:
  - A stage and a matching copy framework
  - A headline, subheadline, body and CTA
  - A warning on which other stages the copy would fail
  - A list of missing facts and assumptions
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code or paid tools are needed.
  - Paste your product facts, price and offer, and any real proof such as reviews. Say which stage your buyer is in, if you know.
  - If any item is missing, ask your AI to mark it as missing and not make it up.
  - Read the stage and framework first. Change the stage if it is wrong.
  - Check every claim in the ad copy against your facts before you publish.
  - If the cross-stage warning says the ad fails for some buyers, run it again for that stage.
output_sample:
  input:
    - Your product and what it does
    - Your buyer's awareness stage (optional if you are unsure)
    - Your offer and price terms
    - Your real proof, such as reviews or results
  output:
    - name: Stage
      contains: The awareness stage chosen for your buyer, with a note if it was a default guess.
    - name: Framework
      contains: The copy structure that fits that stage, with its structure and tone.
    - name: Headline
      contains: A short headline of four to six words.
    - name: Subheadline
      contains: A line of six to twelve words that supports the headline.
    - name: Body
      contains: Ad text sized for the stage, built only on the facts you gave.
    - name: CTA
      contains: A two to four word call to action that matches the stage.
    - name: Cross-stage warning
      contains: Which nearby stages the copy would suit, and which two-stage-away buyers it would fail.
how_it_works:
  - title: Check the inputs
    text: It confirms your product, offer and proof, and marks any fact that is missing. It does not invent proof.
  - title: Find the stage
    text: It asks what your buyer already knows and picks one of five stages. If it cannot tell, it defaults to solution aware and says so.
  - title: Pick the structure
    text: Each stage has its own structure and tone, from teaching for the unaware to a direct offer with a deadline for the most aware.
  - title: Write the ad
    text: A headline of 4 to 6 words, a subheadline, a body sized for the stage and a call to action of 2 to 4 words.
  - title: Warn on other stages
    text: It shows which nearby stages the ad would suit and which it would fail.
  - title: Review the result
    text: Check every claim against your facts before you publish.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
