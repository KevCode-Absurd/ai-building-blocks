new_slug: billing-reminder-and-confirmation-writer
name: "Billing reminder and confirmation writer"
summary: "Write a billing reminder email and order confirmation for each rebill, with a delay link first. Built to cut subscription cancels. Includes an A/B test plan."
job: keep-customers
thinking: medium
thinking_why: "It writes several emails to a fixed layout from your facts, so a mid-size model is enough. Use a stronger one if you have many products and gift schedules."

headline: "Billing reminder and confirmation writer"
subhead: Give it your subscription products, your gift schedule and your email platform. It writes a billing reminder for each rebill number and an order confirmation for first orders, rebills and one-time orders. You also get a link setup list and an A/B test plan.

explain: |
  Two emails sit right next to a cancel. The billing reminder says a charge is coming. The order confirmation says it just happened. Most stores leave both as plain, transactional emails from the subscription app or Shopify, with a big manage button at the top. One brand's audit, as told in the playbook this is built from, found the biggest cancel day was the day of the first rebill, when the plain receipt went out. That was about double the cancels on the reminder. It is one brand's result, not a rule, so check your own cancels by day.

  This skill rebuilds both emails in your email platform. It opens warm, shows the product and any free gift in the next box, and puts a one-click delay link first, because having too much product is a common reason to cancel. Check your own cancel reasons first. The manage link sits at the bottom. Cancel stays easy to find. The charge amount and date stay clear.

when:
  - Your reminder and receipt are still the plain default from your subscription app or Shopify.
  - Cancels spike around the first rebill and you do not know why.
  - You are adding a free gift on certain orders and want the emails to say so.
not_for:
  - "Your cancels come from product fit or slow shipping: fix that first, because these emails will not change it. Ask a few cancelled customers why they left."
  - "You need the flow for what happens after someone clicks cancel: use the Subscription cancel flow builder."
  - "You need a gift plan for your subscribers: use the Subscriber retention calendar, then bring the gift schedule here."

you_give:
  - Your subscription products and plans, and which order number each gift or perk lands on
  - Benefits, testimonials and usage tips you can reuse (real ones only)
  - Your email platform, subscription app and Shopify plan
  - Your current cancel rate on the billing reminder (optional)
you_get:
  - A billing reminder template, with a version for each rebill number (1 to 6)
  - An order confirmation template for first orders, rebills and one-time orders
  - "A link setup list: one-click delay, skip, swap and manage, and where cancel sits"
  - An A/B test plan against your current emails

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your plans, your gift schedule by order number, and a few real testimonials and benefits.
  - Say which email platform and subscription app you use, and your Shopify plan.
  - Check the draft for anything untrue about gifts or dates, then build it in your email platform.
  - Run the A/B test it gives you and compare cancels per 100 reminders sent.
output_sample:
  input:
    - Your subscription products and plans, and which order number each gift lands on
    - Real benefits, testimonials and usage tips
    - Your email platform, subscription app and Shopify plan
    - Your current cancel rate on the billing reminder (optional)
  prerequisites:
    - An email platform that can pull order data, such as Klaviyo (paid)
    - A subscription app that gives one-click delay, skip, swap and manage links, such as Skio or Recharge (paid)
  output:
    - name: Billing reminder, rebill 1 to 6
      contains: One reminder per rebill number with subject, preview, warm opening, next box, perks, delay link, cross-sell and manage link.
    - name: Order confirmation
      contains: Versions for a first order, a rebill and a one-time order, with order content, benefits and what comes next.
    - name: Link setup
      contains: Where to set up the delay, skip, swap, manage and cancel links.
    - name: A/B test
      contains: Your current email against the new one, measured in cancels per 100 reminders sent, by rebill number.
    - name: Checks missed
      contains: Any check the draft failed, or none.
    - name: Missing
      contains: Anything you did not give, such as a gift schedule or testimonials.

how_it_works:
  - title: Checks the notice rules
    text: Reminds you that some places require notice before a subscription charge, and tells you to ask a lawyer about your own state and country.
  - title: Moves it to your email platform
    text: Takes the reminder out of the subscription app so you can design it and use live order data.
  - title: Sets the layout order
    text: Warm opening, the next product, perks and any gift, a one-click delay link, a cross-sell, and manage at the bottom.
  - title: Writes a version per rebill
    text: Writes rebill 1 to 6 on their own. When the next order has a free gift, the gift becomes the headline.
  - title: Rebuilds the confirmation
    text: Writes confirmations for first order, rebill and one-time orders, with order content, benefits, a real testimonial and what comes next.
  - title: Lists the links
    text: Sets up one-click delay, skip, swap and manage links. Cancel stays easy to find, just not first.
  - title: Plans the test
    text: Measures cancels per 100 reminders by rebill number and tests the new email against the old.

output_shape: |
  BILLING REMINDER, REBILL <n>
  Subject: <line> | Preview: <line>
  1. Opening: <warm line>
  2. Next box: <product, size, date, charge amount>
  3. Perks and gift: <benefit lines; gift for this order if any>
  4. Delay link: <"need more time?" line + one-click link>
  5. Cross-sell: <one product>
  6. Bottom: <manage link; cancel link or path>

  (one block for each rebill number 1 to 6)

  ORDER CONFIRMATION
  First order: <blocks> | Rebill: <blocks> | One-time: <blocks>

  LINK SETUP
  delay: <where> | skip: <where> | swap: <where> | manage: <where> | cancel: <where>

  A/B TEST
  A: <current email> | B: <new email> | measure: cancels per 100 reminders sent, by rebill number | run: <weeks>

  CHECKS MISSED: <none or list>
  MISSING: <what you did not give>

tweaks:
  - what: Gift schedule by order number
    how: Say exactly which order gets which gift. The rebill versions turn on this, and a gift the email promises must really ship.
  - what: Real testimonials
    how: Paste true customer quotes with permission. The skill never makes one up. With none, it leaves the slot out.
  - what: Your current cancel rate
    how: Give cancels per 100 reminders sent. It becomes the baseline for the test.
  - what: Shopify plan
    how: Your plan may decide whether you can switch off Shopify's own confirmation email and replace it with the custom one. This item does not know which plans allow it, so check with Shopify support.

judge:
  - The charge amount and date are easy to find in every email.
  - The delay link comes before any manage or cancel link, and cancel is still reachable from the email.
  - Each rebill version differs from the others, and gift emails lead with the gift.
  - Every gift, perk and testimonial in the draft is one you gave it.
  - The test plan names one measure and one comparison, not several.

test:
  - Send yourself the reminder and the confirmation for rebill 1. Click every link. Delay and skip should act in one click, and cancel should work.
  - Check each gift line against your real schedule. A gift that does not arrive causes cancels and complaints.
  - Run the A/B test for at least one full billing cycle. Compare cancels per 100 reminders sent, split by rebill number.
  - The source reports a drop from 8.6 to 5.8 cancels per 100 for one brand. We could not verify it, so do not use it as a target. Beat your own baseline.

improve:
  - Save your gift schedule and your best true testimonials to your brand file, so every draft starts from them.
  - Add your own rule for the day count before the charge, based on what the law where you sell requires.
  - Add a version for customers who skipped last time, if your data shows they cancel more.
  - Pair it with the Subscriber retention calendar for the gift plan and the Subscription cancel flow builder for what happens after the cancel click.

works_best_with:
  tools:
    - {name: "Klaviyo", why: "It can pull next order date, items and order number into the email and build a different version for each rebill number. It is a paid service."}
    - {name: "Skio or Recharge", why: "Your subscription app supplies the one-click delay, skip, swap and manage links. Both are paid apps."}
    - {name: "Shopify", why: "Your plan decides whether you can turn off the built-in order confirmation. You need a paid Shopify plan."}
  inputs:
    - "Your cancel reasons, to see whether too much product is the top one"
    - "Your current reminder and confirmation emails, as screenshots"
    - "Benefit lines and usage tips from your product page"
    - "Cancels by day since the first order"

terms:
  - term: Rebill
    meaning: A repeat charge on a subscription after the first order. Rebill 1 is the second order.
  - term: Dynamic content
    meaning: Parts of an email that fill in from the customer's own order, such as the product, the date and the amount.
  - term: Order confirmation
    meaning: The email sent after a charge goes through, which tells the customer what was ordered and billed.
