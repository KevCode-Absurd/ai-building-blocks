new_slug: brand-and-non-brand-splitter
name: Brand and non-brand splitter
summary: Split your Google Ads results into brand and non-brand, see what the reports miss, and plan campaign exclusions. Give it your exports and brand names.
job: run-google-ads
thinking: medium
thinking_why: The sums are simple but the campaign map needs care, so a mid-size model is the right fit.
headline: Brand and non-brand splitter
subhead: Share dated campaign totals, search reports and your brand names. It checks report coverage, separates visible query groups and compares their reported returns on a matched basis. Get a campaign plan with supported exclusions, test queries and a custom coverage score. Hidden queries and unchecked settings stay unknown. The split does not prove which ads created sales.
explain: |
  Brand and non-brand queries can have different reported costs and returns. Their labels alone do not show whether an ad created demand or whether the shopper would have bought anyway. Search reports can also omit queries.

  This skill separates the visible data and shows its coverage against matching campaign totals. It calculates reported returns and compares them with a supported cost basis. It then plans exclusions and campaign roles using current supported controls. Exact brand negatives alone do not block queries with extra words. The custom score shows checked coverage, unknowns and the applicable maximum; it does not prove profit or complete separation.
when:
  - Your Performance Max or Shopping ROAS looks strong but new customers are not growing.
  - You want to compare reported non-brand returns with a clearly stated cost threshold.
  - You need a supported campaign separation plan and query checks before changing settings.
not_for:
  - "Your account has no brand search volume or no matching campaign totals: start with a plain review of your search terms export."
  - "You want proof that ads created sales: run a lift test or holdout test instead, because this split cannot show cause."
  - "You want to change live campaign settings: make the change yourself in Google Ads, or ask the person who manages your account."
you_give:
  - Dated matching campaign totals with spend, conversions, value, currency and attribution basis
  - Search terms or categories by campaign, with known report omissions
  - Your brand names, variants and ambiguous terms
  - Contribution margin before ads and its included cost scope, if available
  - Current account controls and competitor evidence, if available
you_get:
  - Visible brand and non-brand shares, plus report coverage and unknown queries
  - Reported attributed non-brand return and a supported cost comparison
  - Observed branded queries and proposed exclusions with match types and test cases
  - A campaign plan and custom rubric showing applicable points and unchecked items
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. Paste the skill, or open it if you added it.
  - Paste your campaign totals and your search terms report from Google Ads. Say the dates, currency and how value is counted.
  - Add your brand names, misspellings and product lines. Add your margin if you want a cost check.
  - Read the coverage line first. It shows how much spend the reports leave out.
  - Check the proposed exclusions and test queries. Make any change in Google Ads yourself, then review on the date it gives.
output_sample:
  input:
    - Dated campaign totals with spend, conversions, value and currency
    - Search terms report by campaign
    - Your brand names, spellings and product lines
    - Contribution margin before ads (optional)
    - Current campaign settings and competitor notes (optional)
  output:
    - name: DATA BASIS
      contains: The period, retrieval date, currency, attribution and how value is defined.
    - name: REPORT COVERAGE
      contains: Visible spend and value against matching campaign totals, with omitted amounts marked unknown.
    - name: VISIBLE QUERY SPLIT
      contains: The share of visible spend from brand, non-brand and ambiguous queries.
    - name: OBSERVED NON-BRAND ATTRIBUTED ROAS
      contains: Reported value divided by spend for non-brand queries, or unresolved if data is missing.
    - name: COST THRESHOLD
      contains: The cost basis you gave and whether non-brand returns pass it.
    - name: OBSERVED LEAKS
      contains: Branded queries seen in each campaign, with spend and evidence date.
    - name: PROPOSED EXCLUSIONS
      contains: Terms to exclude, with match type, level and queries that should be blocked or allowed.
    - name: CAMPAIGN PLAN
      contains: A role for each campaign, supported settings, and budget or eligibility risks.
    - name: CUSTOM COVERAGE RUBRIC
      contains: Points earned out of the applicable maximum, with unchecked items listed.
    - name: REVIEW ON
      contains: A review date, with the reason based on volume and conversion lag.
how_it_works:
  - title: Checks report coverage
    text: Matches periods and definitions, then shows covered spend and value against comparable campaign totals. Hidden queries stay unknown.
  - title: Compares reported returns
    text: Divides matched attributed value by spend. A missing or zero denominator leaves the return unresolved.
  - title: Reviews observed brand queries
    text: Names the campaigns and visible terms that need review, without claiming an exhaustive list.
  - title: Plans supported exclusions
    text: Checks match type, campaign type and control level. Exact brand alone does not block brand plus extra words.
  - title: Plans campaign roles
    text: Reviews supported bidding, priorities, budgets and fallback risks. These are choices to test, not proven growth gains.
  - title: Shows the custom rubric
    text: Reports earned points, applicable maximum, evidence dates and unknown checks. It cannot prove causal lift or profit.
  - title: Plans the next review
    text: Sets a review date with volume and conversion lag in mind, then checks what actually changed.
output_shape: |
  DATA BASIS  <period/retrieval date/currency/attribution/value definition>
  REPORT COVERAGE  <visible spend/value> of <matching campaign totals> | omitted/unknown <amounts>
  VISIBLE QUERY SPLIT  brand <share> | non-brand <share> | ambiguous <share>
  OBSERVED NON-BRAND ATTRIBUTED ROAS  <value/spend or unresolved>
  COST THRESHOLD  <basis/costs included or missing> | comparison <supported result or unresolved>

  OBSERVED LEAKS
  <campaign> | <visible branded query> | <spend> | evidence date

  PROPOSED EXCLUSIONS
  <term/control> | <match type/level/campaign type> | expected blocked/allowed cases | unverified settings

  CAMPAIGN PLAN
  <campaign> | <role> | <supported priority/bid settings or unknown> | <budget/eligibility risks>

  CUSTOM COVERAGE RUBRIC  <earned>/<applicable maximum> | unresolved <checks>
  <each check: evidence/date, campaigns passing/eligible, points or unknown>
  REVIEW ON  <date and conversion-lag rationale>
  MISSING / LIMITS  <report omissions | attribution | settings | costs | data>
  NO LIVE CHANGES  <unless separately authorised and verified>
tweaks:
  - what: Search terms by campaign
    how: Leaks only show when each term is linked to the campaign that served it. Export with the campaign column.
  - what: Every brand spelling
    how: List the name, misspellings, the name with no space and each product line, so brand terms are caught.
  - what: Your break-even ROAS
    how: State contribution margin before ads and which costs it includes. Gross margin alone gives only a gross-profit threshold.
  - what: Whether competitors bid on your name
    how: Use competitor evidence alongside cost, budget, organic presence and test results. Auction insights alone do not settle value.
judge:
  - Visible shares use the owner’s matching reports; hidden and ambiguous queries stay unknown.
  - Reported returns state value/spend, coverage and the supported cost basis.
  - Each observed leak names a campaign, visible query and evidence date.
  - Each proposed exclusion has a supported match type, level and blocked/allowed test cases.
  - The custom rubric shows applicable points, evidence and unknowns; it is not proof of profit or lift.
test:
  - "Compare exact negative [lantern] with lantern coffee: the extra-word query is not blocked by that negative alone."
  - "Use campaign spend 100 and visible spend 50: report 50% coverage and keep hidden 50 unclassified."
  - "Use visible non-brand value 80/spend 40: reported return 2; a zero spend denominator stays undefined."
  - "Use gross margin 50% and other variable costs 30%: gross-only threshold 2 differs from contribution threshold 5."
  - "Leave account controls unchecked or omit a campaign type: show unknown or not-applicable checks, not a complete 100-point clearance."
improve:
  - Put your brand names and misspellings in the skill file so every run uses the same list.
  - Keep the dated cost basis and targets beside the campaign plan, then update them when costs change.
  - Treat allowing Performance Max brand queries as a testable choice. Observed split numbers alone do not prove its incremental effect.
  - Pair it with the Branded Search and Shopping builder for the campaign settings, and the Search term sorter for the weekly clean-up.
works_best_with:
  tools:
    - name: Google Ads
      why: Campaign export, search terms, search category report and auction insights all come from here.
    - name: Any good chat AI
      why: Any current chat AI can work from pasted exports.
  inputs:
    - Matching dated campaign totals and query reports, including coverage and conversion-lag limits
    - Auction insights for your brand campaigns, to see who bids on your name
    - Your backend revenue by new and returning customer, to check the split against real sales
terms:
  - term: Non-brand ROAS
    meaning: Reported attributed conversion value divided by spend for the declared visible non-brand query group. Hidden queries and causal sales effects are separate questions.
  - term: Break-even ROAS
    meaning: A stated cost threshold. The simple revenue/ad-spend threshold is one divided by contribution margin before ads; gross margin alone excludes other costs.
  - term: Campaign priority
    meaning: A Standard Shopping control that can affect eligible campaign selection. Actual bidding, exclusions, inventory and budget limits also matter.
  - term: Impression share
    meaning: The share of searches where your ad could have shown and did.
