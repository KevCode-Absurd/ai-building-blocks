new_slug: brand-stylescape-planner
name: "Brand stylescape planner"
summary: "Plan three brand mood board directions for your store. Get one merged pick, photo rules, type and colour choices and a shoot brief."
job: brand-file
thinking: medium
thinking_why: "It compares three directions against your values and writes rules, so a mid-size model works and a stronger one gives more distinct directions."

headline: "Brand stylescape planner"
subhead: "Give it your brand values and who buys from you. It plans three different looks as mood boards and checks each against your values. Then it merges the best into one. You get photo rules, type and colour choices and a shoot brief."

explain: |
  Many stores pick a look by taste, then pay for changes when it does not fit. A brand stylescape is a wide mood board. It shows the brand on the pack, on a screen and on the product at once. Plan three early and check them against your values. You settle the look before you pay for design.

  This skill turns your values into rules for what may be shown. It plans three directions, each with a theme, colour mood, type feel and imagery. A fit grid shows which ones match your values and your buyer. You merge the best parts into one named direction and lock it. From it you get four to six photo rules, each with a Yes or No test, plus type jobs, a colour system and a shoot brief.

  It cannot draw the boards. It writes what goes on each one. A designer or an image tool builds them from the plan.

when:
  - You are launching or rebuilding a store and cannot decide how it should look.
  - Your photos, pack and site look like they came from different brands.
  - A photographer says "what look do you want?" and you have no answer yet.
  - You are choosing between a few looks and want a way to pick that is not taste alone.

not_for:
  - "Your logo and look are settled and customers know them. Use the Brand style guide writer to write the rules down."
  - "You want finished mood boards or images. This plans them in words. Build them in Figma or an image tool, and use the Brand-to-image prompt compiler for the prompts."
  - "You want to know if your site, emails and pack already say the same thing. Use the Store brand signal auditor."
  - "You are still choosing how you differ from rivals, not how you look. Start with the Positioning grid builder."

you_give:
  - "Three to five values you will not give up, and the traits your brand should show (write them, or take them from your brand brain)"
  - "What you sell and who buys it"
  - "Three to five rival brands, as screenshots or links to their site and pack (advised)"
  - "Where the look must show up, such as pack, site, social or product (advised)"
  - "Images you like, with a line on what you like in each (optional)"
  - "Whether customers already know your logo"
you_get:
  - "Three named visual directions, each with a theme, colour mood, type feel, imagery and where it shows up"
  - "A fit grid that marks each direction Yes, Partly or No against each value and your buyer"
  - "One merged direction, with what came from which board"
  - "Four to six photo rules, each with a Yes or No test, plus type jobs and a colour system"
  - "A short shoot brief for your photographer or designer"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. Use an AI that can read images if you want to attach any. It needs no code and no paid tool."
  - "Paste your values, what you sell and who buys. Add your brand brain if you have one. With no values, the AI will ask for three to five before it does anything else."
  - "Attach screenshots of three to five rivals and any images you like. Say what you like in each, and say if your logo is already known."
  - "Read the three directions and the fit grid. Tell the AI which you prefer and what to borrow from the others."
  - "Check each photo rule. You should be able to answer it Yes or No by looking at one photo. Ask for a rewrite of any rule you cannot."
  - "Give the photo rules and shoot brief to your photographer or designer. Build the home page and one product page in the new look before you change anything else."

output_sample:
  input:
    - "Your brand values and traits, or your brand brain"
    - "What you sell and who buys it"
    - "Screenshots or links for three to five rival brands (advised)"
    - "Images you like (optional)"
    - "Whether your logo is already known to customers"
  prerequisites:
    - "An AI that can read images, if you attach any"
    - "Your brand brain from the Website brand brain builder (optional)"
  output:
    - name: "Value filters"
      contains: "One rule for each value you will not give up. It says what you always show and what you never show."
    - name: "Three directions"
      contains: "Each has a name, a one-line theme, colour mood, type feel, imagery and where it shows up. It says what goes on its board."
    - name: "Fit grid"
      contains: "A table that marks each direction Yes, Partly or No against each value and your buyer, with a reason. Off-story directions are dropped."
    - name: "Merged direction"
      contains: "A named direction built on the strongest board, with the best parts of the others. It says what came from which board."
    - name: "Photo rules"
      contains: "Four to six rules. Each has a Yes or No test, a do example and a do-not example, and says which reference images to find."
    - name: "Type jobs and colours"
      contains: "Which typeface does headers, body and technical copy. One anchor colour with accents, checked on pack and on screen."
    - name: "Context test"
      contains: "The two pages to build first, usually your home page and one product page, before you roll the look out."
    - name: "Shoot brief"
      contains: "The shots, light, set styling, people in frame and what to avoid, built from the photo rules."

how_it_works:
  - title: Turns values into filters
    text: Each value you cannot break becomes a rule on what may be shown and what never appears.
  - title: Checks the logo
    text: If your logo already has customer recognition, the plan keeps it and only changes the look around it.
  - title: Plans three directions
    text: Three truly different themes, each with colour mood, type feel, imagery and where it appears.
  - title: Describes the boards
    text: What goes on each wide board so one glance previews the pack, a screen and the product. A designer or image tool builds it.
  - title: Grades the fit
    text: A grid of Yes, Partly or No against each value and your buyer. Directions that feel off-story are dropped.
  - title: Merges and locks
    text: The strongest direction is the base, with the best parts of the others added. It gets a name and becomes the reference.
  - title: Writes testable rules
    text: Four to six photo rules with a Yes or No test, three to five reference images each, type jobs and an anchor colour.
  - title: Plans the test
    text: Two real pages first, then the rest, and a shoot brief built from the rules.

output_shape: |
  STYLESCAPE PLAN: <store>
  VALUE FILTERS
  <value> -> always <...> | never <...>

  DIRECTIONS
  1 <name>: <one-line theme>
    colour <...> | type <...> | imagery <...> | shows up on <...>
  2 ...   3 ...

  FIT GRID (Yes / Partly / No)
  <direction> | <value 1> | <value 2> | buyer | dropped?

  MERGED DIRECTION: <name>
  base <direction>; kept <...> from <...>

  PHOTO RULES
  1 <rule> | test: <Yes/No question> | do <...> | do not <...>
  TYPE JOBS: <header> / <body> / <technical> / <accent>
  COLOURS: anchor <...> | accents <...> | checked on <pack, screen>
  CONTEXT TEST: <two pages to build first>
  SHOOT BRIEF: <shots, light, styling, people, avoid>
  CHECKS MISSED: <none | list>

tweaks:
  - what: Your values
    how: Give three to five values you will not give up. Vague values such as "quality" make all three directions look alike. Specific ones, such as "made in small batches by named people", give each a different feel.
  - what: Reference images
    how: Attach images you like and say what you like in each. The directions are built from what you show, so more images mean sharper directions.
  - what: Competitor brands
    how: Attach screenshots of three to five rivals so the directions can stay clear of their look.
  - what: Where the look must show up
    how: Name your touchpoints, such as pack, site, social and product. Each board is planned around them.
  - what: A logo that is already known
    how: Say so up front. The plan then keeps the logo and changes only what sits around it.

judge:
  - There are exactly three directions, and they feel different from each other.
  - Each value from your brief shows up in the fit grid with a reason.
  - The merged direction says what came from which board.
  - Every photo rule can be answered Yes or No by looking at a photo.
  - Nothing says a board or image already exists.

test:
  - Show the three direction summaries, without the grid, to three buyers. Ask which feels like your brand. Compare their pick to the grid.
  - Take one photo rule and judge five of your existing photos against it. The rule should sort them clearly into pass and fail.
  - Give the shoot brief to someone outside the project and ask them to list the first five shots. If they list the wrong ones, tighten the rules.
  - Build the home page and one product page in the new look before changing anything else, and look at both on a phone.

improve:
  - Add your own non-negotiable values to the first step, so every run filters by them.
  - Keep a standing do-not list of looks that do not fit your brand, such as clip-art style or flashing badges, and add it to the fit grid.
  - Save the merged direction, photo rules and colours to your brand file so ads, emails and product pages use the same look.
  - Pair it with the Positioning grid builder to choose the space to own first, and with the Store brand signal auditor to check the finished look.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI that reads images can describe and grade the directions. Attach your references."}
    - {name: "Figma", why: "A designer can build the wide boards and mock the pack and home page in one file."}
    - {name: "Pinterest", why: "A quick place to collect reference images for each theme before you build the boards."}
  inputs:
    - "Your brand brain file, with mission, values and voice"
    - "Screenshots of three to five rivals' sites and pack"
    - "Photos of your products in the scenes where they are used"
    - "Your current logo and any brand colours already in use"

terms:
  - term: Stylescape
    meaning: A wide mood board that shows the look of a brand across several places at once, such as pack, screen and product.
  - term: Anchor colour
    meaning: The main brand colour, with a few secondary colours added as accents.
  - term: Creative filter
    meaning: A rule taken from a brand value that decides what can and cannot be shown.
