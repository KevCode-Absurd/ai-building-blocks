  - title: Model Routing
    text: Follow the model routing section in the full method and keep its required fields and decision rules.
  - title: Deliver the Compiled Prompt
    text: Follow the deliver the compiled prompt section in the full method and keep its required fields and decision rules.
  - title: Compiled Generation Prompt
    text: Follow the compiled generation prompt section in the full method and keep its required fields and decision rules.
  - title: Review the result
