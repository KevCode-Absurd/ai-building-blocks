new_slug: brand-to-image-prompt-compiler
name: Brand-to-image prompt compiler
summary: Turn your brand, scene, product and copy into one image prompt for an AI image tool, with a negative prompt and a model pick.
job: make-image-ads
headline: Brand-to-image prompt compiler
subhead: Give it your brand details, layout, visual settings and approved copy. It builds one short prompt for an AI image tool. You also get a list of things to avoid and a model suggestion.
explain: |-
  Image tools drift off-brand when the prompt is a loose paragraph. Colours come out wrong, the product changes shape and the headline turns to gibberish.

  This skill builds one short prompt in a fixed order: brand colours and product first, then the scene, then how the product is shown, then your exact words in quotes, then what to avoid. It trims the prompt to the parts that matter, suggests a type of image tool and ends with the aspect ratio. Claude writes the prompt. Your image tool draws it.
when:
  - You have a brand, a layout and copy, and need one prompt for an image tool.
  - Your image prompts keep coming out off-brand or with garbled text.
  - You want to check which image model fits before you spend credits.
  - A teammate asks you to make a new ad image in the same style.
not_for:
  - "You want a finished ad with real fonts and layout: use a design tool such as Canva or Figma."
  - "You want a plain product photo with no text or brand rules: write a short prompt by hand or shoot the photo yourself."
  - "You have no brand profile, layout or copy yet: write those first, then come back."
you_give:
  - "Your brand profile: name, product, 3 to 5 hex color codes and visual style"
  - Your layout and aspect ratio
  - Your eight visual settings, such as mood, lighting, setting, style and camera angle
  - Your approved headline, sub line and button text (optional)
  - Anything you want to override (optional)
you_get:
  - One compact image prompt, kept under 500 tokens
  - A list of things to avoid
  - A model suggestion with a reason
  - A token and cost estimate
  - A note on anything missing or assumed
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code or paid tool is needed.
  - Paste your brand profile, layout, aspect ratio and eight visual settings.
  - Add your approved headline, sub line and button text, word for word.
  - "If something is missing, answer when your AI asks: use a default or fill it in."
  - Check that the hex codes and quoted text match what you gave.
  - Paste the prompt into your image tool. Check cost and model on its current pricing page.
output_sample:
  input:
    - "Your brand profile: name, product, 3 to 5 hex colors and visual style"
    - Your layout choice and aspect ratio
    - Your eight visual settings, such as mood, lighting and camera angle
    - Your approved headline, sub line and button text (optional)
  prerequisites:
    - Your brand profile and layout from earlier steps, or details you type in yourself
  output:
    - name: Model
      contains: The image model that suits the prompt, with a short reason.
    - name: Token estimate
      contains: A rough size of the prompt so you can keep it short.
    - name: Cost
      contains: A reminder to check your image tool's current price. It does not guess one.
    - name: Prompt
      contains: One compressed prompt with brand colors, scene, product, exact quoted text and aspect ratio.
    - name: Negatives
      contains: The list of things the image tool should not draw.
    - name: Expected output
      contains: A plain description of what the finished image should look like.
how_it_works:
  - title: Collect the inputs
    text: It checks your brand profile, layout, eight visual settings, copy and aspect ratio. It asks about anything missing and never invents hex codes or words.
  - title: Build the prompt
    text: "Five parts in order: brand and product, scene, product rendering, quoted text, things to avoid."
  - title: Trim it
    text: It cuts adjectives and background history. Hex codes, product, mood, layout and exact text stay.
  - title: Pick a tool
    text: It suggests the type of image tool that fits the content, and tells you to check its current price.
  - title: Hand it back
    text: The prompt, the avoid list, a rough size and a plain description of the image you should get.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
