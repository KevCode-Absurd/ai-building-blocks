new_slug: break-even-roas-and-cpa-calculator
name: Break-even ROAS and CPA calculator
summary: Work out your break-even ROAS and CPA from order value and costs. Get an ad allowance per order and a list of what is still missing.
job: run-google-ads
thinking: medium
thinking_why: The sums are simple, but it has to catch weak inputs and judge whether the numbers can pay for ads.
headline: Break-even ROAS and CPA calculator
subhead: It uses order value and profit left before ads to work out an ad-cost allowance and sales-to-ad-spend threshold. It compares matching click and order data, checks any repeat-buyer case and shows cost gaps. Get the sums and a custom checklist. These figures cover the costs named; they do not prove total profit or approve higher spending.
explain: |
  An ad result only makes sense against a clear cost basis. This skill starts with sales left after the variable costs you name, before advertising. It shows which costs are included and which still need checking. An order cost and a new-customer acquisition cost need different, matching counts.

  For valid inputs, it works out the sales-to-ad-spend threshold and ad allowance per order. It can compare expected cost per order from matching click cost and purchase rate. A repeat-buyer case needs measured contribution per acquired customer, including people who never buy again, plus cash timing. Revenue alone is not money available for ads. The custom checklist shows evidence and gaps; it does not establish cause, total profit or permission to change an account.
when:
  - You need an ad-cost threshold with its cost assumptions shown.
  - Reported ad returns and store results use different definitions.
  - You want to check a repeat-buyer case without treating future revenue as profit.
not_for:
  - "You want proof that ads caused your sales: this tool does not show that, so run a controlled test or ask an analyst."
  - "You need total business profit: use your accounting tool or ask your accountant, since this covers only the costs you name."
  - "You want your AI to change live ad accounts: it only proposes a next check, so make changes yourself in your ad platform."
you_give:
  - Average order value for the stated orders and period
  - Variable costs before ads, including applicable product, delivery, payment and refund costs
  - Matching click cost and purchase conversion rate, if available
  - Measured first-order and repeat contribution per acquired customer, including zero-repeat buyers, if available
  - Cash timing, customer groups and reporting definitions
you_get:
  - Sales-to-ad-spend threshold and ad allowance per order, with valid inputs and formulas
  - Matching cost-per-order comparison, or an unresolved result
  - Separate targets where supported costs differ
  - Custom checklist with checked maximum, missing evidence and a proposed next check
how_to_use:
  - Share the order value, costs and source of each input.
  - State the period, currency and customer group; mark estimates clearly.
  - Add matching click cost and purchase rate if you want a cost-per-order comparison.
  - For repeat buying, give measured cohort contribution, dates and cash timing.
  - Check omitted costs and unresolved evidence before approving any test or account change.
output_sample:
  input:
    - Your average order value for a set period
    - Your costs before ads, like product, delivery, payment and refunds
    - Your click cost and purchase rate (optional)
    - Your measured repeat-buyer profit per customer (optional)
    - Your cash timing and customer groups (optional)
  output:
    - name: Basis
      contains: The period, currency, customer group, sources, and which costs are in or out.
    - name: Thresholds
      contains: The break-even ROAS and the ad allowance per order, with the formulas shown.
    - name: Cost comparison
      contains: Your expected cost per order against the allowance, or a note that it cannot be judged yet.
    - name: Repeat case
      contains: Repeat-buyer profit and cash timing if you gave measured data, or a note that it is unresolved.
    - name: Custom checklist
      contains: Checklist points, the checked maximum and the evidence still missing.
    - name: Next check
      contains: A test or evidence request for you to approve, with no live changes.
how_it_works:
  - title: Checks the basis
    text: Checks finite values, positive denominators, matching periods and which costs are included.
  - title: Shows the formulas
    text: For a valid positive margin fraction, the ratio threshold is 1 divided by that fraction. Order allowance is order value times that fraction.
  - title: Keeps measures apart
    text: Separates all-order cost from new-customer cost and states attribution differences.
  - title: States the cost case
    text: Shows the first-order case and any separately supported repeat-contribution case. Missing evidence stays unresolved.
  - title: Checks repeat contribution
    text: Counts measured contribution per acquired customer, including zero-repeat buyers, with costs and cash timing.
  - title: Compares ad costs
    text: Divides matching click cost by the purchase-rate fraction. Cost above the matching allowance fails that limited cost test.
  - title: Splits targets where needed
    text: Uses separate supported cost bases for groups with different margins; it does not infer causal returns from platform reports.
  - title: Shows evidence and gaps
    text: Gives custom checklist points, checked maximum and unresolved items. A score does not approve a spend change.
output_shape: |
  BASIS
  <period, currency, order/customer group, sources, included and excluded costs>
  THRESHOLDS
  <1 / valid positive margin fraction>
  <order value x margin fraction = order ad allowance>
  <separate matched new-customer basis, or unresolved>
  COST COMPARISON
  <click cost / valid purchase fraction, or unresolved>
  <cost below, equal to or above matching allowance>
  REPEAT CASE
  <measured cohort contribution and cash timing, or unresolved>
  CUSTOM CHECKLIST
  <bounded parts, known subtotal / checked maximum, missing points>
  NEXT CHECK
  <evidence or test proposal for approval; no live change>
tweaks:
  - what: Cost basis
    how: List included and excluded variable costs. Fixed costs and other omissions may require a stricter target.
  - what: Channel definitions
    how: State how each platform counts sales and which store group matches the comparison.
  - what: Click and purchase data
    how: Use the same period and traffic group. A 5 percent rate is 0.05 in division.
  - what: Repeat evidence
    how: Use measured contribution per acquired customer, including zero-repeat buyers. Keep future assumptions separate.
  - what: Segments
    how: Separate supported costs and targets where product or customer groups differ.
judge:
  - Formulas show percentage-to-fraction conversion and valid denominators.
  - Cost scope, period and population match across each comparison.
  - Order CPA is not silently labelled new-customer CAC.
  - Repeat revenue alone never establishes an ad allowance.
  - Custom points show missing checks and do not claim total profit or spending clearance.
test:
  - "Use order value 100 and margin fraction 0.4: ratio threshold 2.5 and order allowance 40."
  - "Add click cost 1 and purchase rate 5 percent: expected order cost 20, below allowance 40. Do not reverse that comparison."
  - At margin 70 percent, the ratio threshold is about 1.43.
  - "Use zero margin or purchase rate: no positive allowance or finite expected order cost may be invented."
  - "Give repeat revenue 400 without contribution costs: a 120 ad allowance remains unsupported."
improve:
  - Save dated cost definitions by product group and update them when costs change.
  - Add measured repeat contribution and cash timing before exploring a repeat-buyer case.
  - Keep custom score weights separate from evidence that an ad change works.
  - Compare later actual results with the stated assumptions.
works_best_with:
  tools:
    - name: Any good chat AI
      why: It does the arithmetic and asks follow-up questions. Check the sums yourself once.
    - name: Shopify Analytics
      why: Gives your real AOV, new-customer share and repeat rate to paste in.
    - name: Google Ads Keyword Planner
      why: Shows the cost per click for your products, so the skill can check the fit.
  inputs:
    - A profit and loss by product line, so margin is real
    - A cohort report of repeat orders by 30, 60, 90, 180 and 365 days
    - Your last 90 days of ad spend and store revenue, to compute blended MER
terms:
  - term: ROAS
    meaning: Return on ad spend. Sales divided by ad spend. A ROAS of 2.5 means $2.50 in sales for each $1 of ads.
  - term: Break-even CPA
    meaning: Here, an ad allowance per order on the stated variable-cost basis. A new-customer threshold needs matching first-order customer costs and counts.
  - term: MER
    meaning: Marketing efficiency ratio. Total store revenue divided by total ad spend across all channels.
  - term: LTV
    meaning: Lifetime value. For this cost check, use measured contribution after stated costs per acquired customer, not lifetime revenue alone.
