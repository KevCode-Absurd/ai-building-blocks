new_slug: buyer-trigger-and-proof-mapper
name: Buyer trigger and proof mapper
summary: Find what makes a buyer start looking, how they feel, what proof they need and what result they want. Get a buyer trigger and proof map.
job: understand-customers
headline: Buyer trigger and proof mapper
subhead: Paste your customer words, product facts and any current ads. Your AI maps what starts the search, the feeling, the proof and the result the buyer wants. It also shows which step each ad is missing.
explain: |-
  Many ads get clicks and no sales because they skip a step in how the buyer decides. Some show proof but give no reason to care. Some promise a result but never name the moment the buyer felt the problem.

  This skill maps four steps from your customer words: the trigger that starts the search, the feeling behind it, the proof the buyer needs, and the result they expect. It then checks each of your ads for the steps it has and lacks, and ranks your ad ideas by how many steps they cover. It uses only what you give it.
when:
  - You are about to brief a new ad and need to know who you are talking to.
  - Your ads get clicks but few sales, and you want to see which step is missing.
  - You have a pile of reviews and want to turn them into a clear buyer picture.
  - You need to choose between ad ideas and want a reason to pick one.
not_for:
  - "You have no customer words or reviews yet: talk to a few buyers first, or read your competitors' public reviews."
  - "You want new ad copy now: write the ad with your usual copywriter or AI, then come back to check it."
  - "You need numbers on ad results: use your ad account reports, since this map has no performance data."
you_give:
  - Customer words, like reviews, support emails or ad comments
  - Your product facts, like what it is, who it is for and what it does
  - Your current ad copy or links to your ads (optional)
  - The buyer group you want to map
you_get:
  - A map of triggers, emotions, proof needed and expected payoff for your buyer
  - Each current ad checked for which of the four steps it has and which it lacks
  - Your ad ideas ranked by how many steps they cover
  - Advice on what to lead with for new buyers and for return visitors
  - A list of missing inputs and assumptions
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code, files or paid tools are needed.
  - Paste your customer words, product facts and the buyer group you want to map.
  - Add your current ads if you have them. Say so if you have none.
  - Ask for the buyer map and the ranked ad ideas.
  - Check each point against your own facts and customer words. Remove anything that is not backed up.
  - Build the top ranked ad first, and cover any missing step before you publish.
output_sample:
  input:
    - Customer words, like reviews, support emails or ad comments
    - Your product facts, like what it is, who it is for and what it does
    - Your current ad copy or links to your ads (optional)
    - The buyer group you want to map
  output:
    - name: Triggers
      contains: The specific moments or events that make this buyer notice the problem.
    - name: Emotions
      contains: The main and second feeling the buyer has when that trigger hits.
    - name: Evidence Required
      contains: The kinds of proof this buyer needs before they believe the product works.
    - name: Payoff Expected
      contains: The result the buyer expects after they buy.
    - name: Ad Concepts Ranked by TEEP Coverage
      contains: Your ad ideas ranked by how many of the four steps each one covers, with the missing ones named.
    - name: Recommendations
      contains: Which step to lead with for new buyers and for people who already visited, and which step never to skip.
how_it_works:
  - title: Check the inputs
    text: It confirms you gave customer words and product facts. Anything it cannot fill from them is marked missing, not invented.
  - title: Map the four steps
    text: Trigger, emotion, evidence and payoff, each with examples taken from your customer words.
  - title: Audit your ads
    text: Each ad is checked for which steps it has, which are missing and which is pushed too hard.
  - title: Balance the ad ideas
    text: Each idea gets a main step and supporting steps, so none skips a step.
  - title: Hand back the map
    text: The map, the ad ideas ranked by coverage, and what to lead with for new buyers and return visitors.
  - title: Review the result
    text: Check each point against your own facts and customer words. Remove anything not backed up.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
