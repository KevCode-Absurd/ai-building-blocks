new_slug: campaign-budget-scenario-planner
name: Campaign budget scenario planner
summary: Plan your campaign budget in three scenarios. Check totals, learning risk and spend concentration before you move any ad budget.
job: launch-and-scale-ads
headline: Campaign budget scenario planner
subhead: Share campaign spend, budget, results, targets and allowed total spend. Get three budget plans with balanced totals and change limits.
explain: |-
  Moving ad budget by instinct is how a good campaign gets starved and a weak one gets fed. Big jumps can also reset a platform's learning, so results get worse before they get better.

  Paste 30 days of results for each campaign: name, platform, daily budget, 30-day spend, revenue and purchases. Add currency, time zone, attribution window, your target return and your total daily budget. The skill puts each campaign in one group (scale, maintain, reduce or pause), then builds three plans: careful, middle and bold. Each plan adds up to your total, keeps every move to 50% or less on Google Ads and 20% or less on Meta, and checks that no campaign takes more than 60% of the budget. It proposes changes only. You make them.
when:
  - You have several campaigns and need to decide where the next dollar goes.
  - One campaign is far ahead on return and you want to scale it without breaking it.
  - You want the budget moves written down in safe steps before you touch the ad account.
not_for:
  - "You have no campaign-level spend and results data: pull a report from your ad platform first, then come back."
  - "You run ads outside Meta or Google and have not checked that platform's learning rules: use that platform's own budget tool."
  - "Your campaigns all miss the target and none qualify to scale: get a creative review before you change budgets."
you_give:
  - Campaign spend
  - Budget
  - Results
  - Targets and allowed total spend
you_get:
  - Three budget plans with balanced totals and change limits
  - The sources used, missing inputs and assumptions
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code or paid tool is needed.
  - Paste your campaign numbers from the last 30 days. A table or a spreadsheet export works.
  - Add your target return, total daily budget and how much risk you accept.
  - Read the classification table first. Check that each campaign sits in the right group.
  - Check that the new budgets add up to your total, then pick one of the three plans.
  - Make the changes in your ad platform in the phases the plan gives. Leave each change alone for 72 hours.
output_sample:
  input:
    - Each campaign's name, current daily budget and 30-day spend
    - Each campaign's revenue and number of purchases
    - Your target return on ad spend and your target cost per purchase (optional)
    - Your total daily budget and how much risk you accept
    - Lost impression share from budget and rank (optional)
  output:
    - name: Classification table
      contains: Every campaign with its group (scale, maintain, reduce or pause), the action to take and the new daily budget.
    - name: Scaling plan
      contains: For each campaign to scale, three budget increases (conservative, moderate, aggressive) with phases and a risk level.
    - name: Reduction plan
      contains: For each campaign to cut, the new budget and the step-by-step phases, with no single move over 50% on Google Ads or 20% on Meta.
    - name: Net impact summary
      contains: Current daily spend and return next to the proposed spend and return, plus the monthly change.
    - name: Implementation timeline
      contains: What to change on day 1, days 2 to 3, days 4 to 7, day 8 and day 15.
    - name: Monitoring checklist
      contains: What to watch after each change, including when to revert and the no-edit window.
how_it_works:
  - title: Collect the numbers
    text: It asks for 30 days of spend, revenue, purchases and budget for each campaign, plus your target return and total daily budget.
  - title: Sort each campaign
    text: "Each campaign lands in one group: scale, maintain, reduce or pause. It uses your target, and a placeholder if you gave none, and says so."
  - title: Build three plans
    text: For campaigns to scale it models a careful, a middle and a bold increase. It takes some return off the bold case, because return usually falls as spend rises. On Meta the 20% step cap always wins over the middle plan's default size.
  - title: Apply the safety rules
    text: No move over 50% on Google Ads or 20% on Meta, a gap of 72 hours between changes, a revert rule and a check that no campaign holds over 60% of the budget.
  - title: Check the totals
    text: Money freed from cuts and pauses goes to the campaigns that scale. Every plan adds up to your total.
  - title: Review the result
    text: Check the sums and the groups before you change anything in your ad account.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
