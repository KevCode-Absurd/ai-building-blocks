new_slug: cart-and-checkout-upsell-planner
name: "Cart and checkout upsell planner"
summary: "Rank cart and checkout upsells by profit added per order. Get one offer per slot, a cart layout and exit offers by stage."
job: make-offer
thinking: medium
thinking_why: "It ranks options with one formula and some layout rules, so a mid-size model is enough."

headline: "Cart and checkout upsell planner"
subhead: Give it your products with price and margin, and what people often buy together. It ranks each upsell and cross-sell by the profit it adds per order. You get one offer for the cart, one for checkout, offers for people who leave, and a plan to measure it.

explain: |
  Most stores add upsells by feel and judge them by average order value (AOV). AOV can rise while profit falls. A cheap add-on that many people take can add less profit than a pricier one fewer people take. Only the maths shows which. Each step of the buying path also behaves differently. In the cart the buyer is still deciding. At checkout they have committed, so a new product gets in the way.

  This cart upsell planner scores each option with one formula: take rate x add-on price x gross margin. That gives the profit it adds per order. Then it gives each slot one offer, lays out the cart from top to bottom and picks one low-friction add-on for checkout. It also sets offers for people who leave at each stage, and a plan to measure take rate, revenue per visit and margin lift.

  Take rates in the cart come from your own store. If you have none, the plan uses labelled example rates and says the order may change once you have real ones. The step after payment goes to the Upsell and downsell sequencer.

when:
  - You want to add upsells to your cart or checkout and want to pick the ones that add the most profit.
  - Your AOV rose after a change but your profit did not, and you want to see why.
  - You want a clear offer for people who leave your site at the browsing, cart or checkout stage.

not_for:
  - "You want offers shown after payment. Use the Upsell and downsell sequence planner."
  - "You want to set free-shipping or bundle thresholds. Use the Order threshold planner."
  - "You sell one product with no add-ons and no products bought together. Start with the Product pack and quantity discount planner."
  - "You want to check whether a live offer made money. Use the Offer profit-per-session checker."

you_give:
  - Products with price and gross margin, and which ones are bought together
  - Your current cart, checkout and post-purchase setup, and your checkout platform
  - Orders per month, current AOV and any take rates you already have
you_get:
  - Upsell and cross-sell options ranked by profit added per order
  - One offer per slot in the cart, one low-friction add-on at checkout, and exit offers by stage
  - A cart layout from top to bottom
  - A plan to measure take rate, revenue per visit and gross margin lift

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. It needs no code or web access.
  - Paste your products with price and margin, and the pairs customers buy together. Add real take rates if you have them.
  - Say what platform and apps run your cart and checkout. Some checkouts cannot show a second step.
  - Read the ranking first. Check that the highest profit per order is at the top, then read the slot plan.
  - Pick one change and run it as a test with a holdout group. Send the step after payment to the Upsell and downsell sequencer.

how_it_works:
  - title: Score every candidate
    text: Works out take rate x add-on price x gross margin for each option, and ranks them by profit added per order.
  - title: Give each slot one offer
    text: Cart, checkout and exit each get one offer, with take rates and friction matched to the slot.
  - title: Apply the five cart rules
    text: One offer per slot, relevance over price, favour high-margin products, readable in two to three seconds, judge by margin lift.
  - title: Lay out the cart
    text: Progress bar, one-click add-ons, subscribe upgrade and a sticky checkout button, from top to bottom.
  - title: Pick the checkout add-on
    text: One low-friction item such as shipping protection, never a new product.
  - title: Set exit offers by stage
    text: Different offers for people who left while browsing, at the cart and at checkout.
  - title: Plan measurement
    text: Tracks take rate, revenue per visit and gross margin lift per slot, one change at a time.

output_shape: |
  RANKING (profit added per order = take rate x price x margin)
  1 <offer> | <type: upsell / cross-sell> | take <%> x <$> x <%> = <$>
  2 <offer> ...
  note: <where a lower-margin item beats a higher-margin one, or the reverse>

  SLOT PLAN
  cart: <one offer> | take <range> | why <...>
  checkout: <one low-friction add-on> | price <$> | take <%>
  post-purchase: handed to the upsell and downsell sequencer

  CART LAYOUT (top to bottom)
  <progress bar steps> / <one-click add-ons, up to two> / <subscribe upgrade> / <sticky checkout button>

  EXIT OFFERS
  browsing <...> | cart <...> | checkout <...> | holdout <%>

  MEASURE  take rate, revenue per visit, gross margin lift per slot
  MISSING: <margins | pairs | platform | take rates>

output_sample:
  input:
    - Your products with price and gross margin
    - Which products are bought together, from your order history
    - Your cart and checkout platform and apps
    - Orders per month, current AOV and take rates you already have (optional)
  prerequisites:
    - An order export from your store, if you want the bought-together pairs read for you (optional)
  output:
    - name: Ranking
      contains: Every upsell and cross-sell with take rate x price x margin shown, sorted from most to least profit added per order.
    - name: Slot plan
      contains: One offer for the cart, one low-friction add-on for checkout, and the step after payment handed to the Upsell and downsell sequencer.
    - name: Cart layout
      contains: The cart from top to bottom, such as progress bar, up to two one-click add-ons, subscribe upgrade and a sticky checkout button.
    - name: Exit offers
      contains: One offer each for people who leave while browsing, at the cart and at checkout, plus a holdout share.
    - name: Measurement plan
      contains: Take rate, revenue per visit and margin lift for each slot, one change at a time.
    - name: Missing list
      contains: Margins, pairs, platform or take rates you did not give, so no number is guessed.

tweaks:
  - what: Take rates
    how: Paste your real take rates if you have them. Without them, the skill uses a labelled range and ranks on that.
  - what: Platform
    how: Name your checkout platform and apps. Some checkouts cannot show a second step, which changes what is possible.
  - what: Bought-together pairs
    how: Give the pairs from your order history. Relevant offers do better than random ones.
  - what: Price band for add-ons
    how: Give the range that feels small next to your main item. One-click add-ons should sit low in it.

judge:
  - Every option has the formula shown with its three numbers.
  - The ranking uses profit added, not AOV lift or take rate alone.
  - Each slot has exactly one offer.
  - Checkout has no new product, only one low-friction add-on.
  - Take rates are labelled as examples unless they came from your store.

test:
  - Rank two options by hand with the formula. Your ranking should match the skill's.
  - Swap a take rate for a lower one and run it again. The ranking should change in the way the formula says.
  - Check the offer on exit by stage. The checkout stage should have no discount, only risk reversal or free shipping.
  - Run the first change as a test with a holdout and compare profit per session, not only AOV.

improve:
  - Put your real margins, pairs and take rates into your org context so each run starts from them.
  - Add offers you have already tried and the result.
  - Add a rule for your store that overrides the defaults, such as no add-on above a set price.
  - Pair it with the order threshold planner for the progress bar steps.

works_best_with:
  tools:
    - {name: "Shopify", why: "Its order export shows which items are bought together. Cart and checkout options depend on your plan."}
    - {name: "Aftersell", why: "A paid Shopify app for cart and post-purchase offers. It can charge the stored card in one click. Check its current price."}
    - {name: "ReConvert", why: "Another paid Shopify app for post-purchase and thank-you page offers. Check its current price."}
  inputs:
    - "An order export showing which items are bought together"
    - "Your current take rates by slot"
    - "Refund and chargeback rates, so you can watch for annoyed buyers"

terms:
  - term: AOV
    meaning: Average order value. The average amount a customer spends in one order.
  - term: Take rate
    meaning: The share of buyers who say yes to an offer.
  - term: Upsell and cross-sell
    meaning: An upsell is more of the same, such as a bigger supply. A cross-sell is a different product that goes with it.
  - term: Revenue per visit
    meaning: Extra revenue from an offer divided by the number of people who saw it.
