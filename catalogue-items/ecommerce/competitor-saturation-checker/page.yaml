new_slug: competitor-saturation-checker
name: "Competitor saturation checker"
summary: "Check how crowded a product is before you test it. Give it rival ads from the Ad Library. You get a score out of 100 and a go, test fast or skip."
job: find-products
thinking: medium
thinking_why: "It sorts and counts what you paste in and applies fixed limits, so a mid-size model is enough."

headline: "Competitor saturation checker"
subhead: Give it a product name and the rival ads you found in the Facebook Ad Library. It counts the stores selling it, marks which rivals are serious, checks the wider niche and hands back a score out of 100 with a go, test fast or skip.

explain: |
  A product can look like a winner and still be a bad bet because a dozen stores already sell it with strong pages. It can also look crowded and still be fine, because crowding proves people buy. The hard part is telling those two apart.

  This skill uses the limits from two creator courses. Fewer than 5 stores advertising it in the last week is a good sign, and under 3 is better. With an ad spy tool, fewer than 10 stores selling it and no more than 3 serious ones. It also counts the wider niche, drops ads in the wrong language, reads each rival's offer and scores how open the product is out of 100. Those limits are defaults for beginner budgets, not rules.

when:
  - You found a product and want to know how many stores already run ads for it.
  - A product looks crowded and you need to know if a better offer could still win.
  - You are about to scale a product and want to repeat the count as a fresh snapshot.
not_for:
  - "You sell a branded product: this check counts real brands only, so use a plain brand check by hand instead."
  - "You sell only on TikTok Shop or Amazon: the Ad Library does not show those sellers, so check those marketplaces yourself."
  - "You need to find the ad ideas rivals use: use the Facebook ad library collector to list their ads."

you_give:
  - The product name and two or three other search words
  - Ad Library results for it, or the output of the Facebook ad library collector skill
  - Ad spy tool results (optional)
  - Links to rival stores (optional)
  - The wider niche term and the country you sell in (optional)
you_get:
  - A count of stores advertising it, how many are serious, and how many started in the last 7 days
  - A niche-level crowding note, not only the exact product
  - A score out of 100 with the sum shown, and a go, test fast or skip
  - The rival pages to watch, and their live ads if you pasted them

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Search the product in the Facebook Ad Library with Active ads on and the date set to the last 7 to 14 days. Paste or attach what you see.
  - Add the wider niche term, such as the other forms of the same product, and your country.
  - Read the counts and the verdict. Put the rival pages it names on a watch list and check them again in a few days.
  - If it says test fast, run the untapped buyer finder next to find a group nobody targets.
output_sample:
  input:
    - Your product name and two or three other search words
    - Ad Library results for the product, pasted or attached
    - The wider niche term and your country (optional)
    - Ad spy tool results (optional, paid)
    - Links to rival stores (optional)
  prerequisites:
    - Ad Library results, which you can get from the Facebook ad library collector skill or by searching the Ad Library yourself
    - A paid ad spy tool if you want the stores-selling check, otherwise that check is marked not run
  output:
    - name: COUNTS
      contains: Stores advertising the product in the last 7 days, serious rivals, new advertisers, and how crowded the wider niche is.
    - name: RIVALS
      contains: One line per rival store with its ad count, oldest ad date, whether it sells one product, and its offer.
    - name: SCORE
      contains: A score out of 100 with the sum of each check shown, and a note that it scores openness, not sales.
    - name: VERDICT
      contains: Go, test fast or skip, with one line on why.
    - name: WATCH
      contains: The rival pages to check again, with the date.
    - name: RIVAL LIVE ADS
      contains: The ad links you pasted, or none.
    - name: CHECKS MISSED
      contains: Any check it could not run and what it needs, plus anything missing from your input.

how_it_works:
  - title: Plans the searches
    text: The exact product, two or three other words and the wider niche. You compete with the whole niche, so both are counted.
  - title: Counts advertisers
    text: Stores running ads for the exact product in the last 7 days. Fewer than 5 is good and under 3 is better.
  - title: Removes non-rivals
    text: Ads in another language than your market, other products and big retailers come out, and the removal is shown.
  - title: Judges each rival
    text: Ad count, ad age, one product or many, and serious or weak. A badly built or abandoned store is a green flag.
  - title: Reads the offers
    text: Bundles, free gifts and subscriptions. A plain one-product store can be beaten with a better offer and page.
  - title: Scores and decides
    text: Six checks add to a score out of 100. Go is 75 or more. Test fast is 45 to 74. Skip is lower, with no offer gap and no fresh buyer group.

output_shape: |
  PRODUCT <name>  searched: <terms>  market: <country, language>

  COUNTS
  Stores advertising the exact product, last 7 days: <n>
  Stores selling it (ad spy tool): <n | not run>
  Serious rivals: <n>
  Started running ads in the last 7 days: <n>
  Niche crowding (<niche term>): <weak | mixed | serious>

  RIVALS
  <store> | ads <n> | oldest ad <date> | serious? | offer

  SCORE  <n>/100 (C1 <a> + C2 <b> + ... = <earned> of <possible>)
  VERDICT  <GO | TEST FAST | SKIP>  <one line why>
  WATCH  <rival pages to check again, with the date>
  RIVAL LIVE ADS  <links you pasted | none>

  CHECKS MISSED: <check and what is needed | none>
  MISSING: <what>

tweaks:
  - what: The date range
    how: Use the last 7 days for the strict count and 14 days if the product is slow. The 5-store limit is about the last week, so say which range you used.
  - what: The wider niche term
    how: Give the whole group of products the same buyer could pick, such as gummies, powders and pills next to patches. A narrow search hides the crowd.
  - what: Your market and language
    how: Say where you sell. Ads in another language are removed from the count because they sell to a different buyer.
  - what: An ad spy tool
    how: With one, the skill can check the under-10-stores limit. Without one, that check is marked not run and the score is out of fewer points.

judge:
  - Every count matches the ads you pasted. No store appears that you did not give it.
  - Removed ads are listed with the reason.
  - Brand-new rivals are on the watch list, not counted as proof of profit.
  - The score sum adds up, and checks that did not run are out of the total.
  - The verdict does not treat a crowded product as dead by default.

test:
  - Check a product you know is crowded. It should say so in the counts and still weigh the offer gap before it says skip.
  - Check a product you know is rare. It should have few advertisers and ask for proof of demand.
  - Run the same pasted ads twice. The counts and score should match.
  - Check one rival by hand. Their ad count and ad age should match what the skill wrote.

improve:
  - Change the limits in the skill file (5 stores, 10 stores, 3 serious) to match your own budget and market.
  - Add what counts as serious for your product type, such as a store with a brand name, its own photos and a review app.
  - Keep a sheet of past checks next to what happened in your tests, then adjust the points that misled you.
  - Pair it with the Facebook ad library collector for the rival ad list, and the untapped buyer finder for a crowded product.

works_best_with:
  tools:
    - {name: "Meta Ad Library", why: "Free. It lists active ads from any advertiser, which is what the 7-day store count needs."}
    - {name: "Any good chat AI", why: "Any current chat AI can count what you paste in and apply the limits."}
  inputs:
    - "The output of the Facebook ad library collector skill, for a clean list of rival ads"
    - "Screenshots of each rival's product page and offer"
    - "An ad spy tool export with the number of stores selling the product"
    - "Your own price and offer, so the offer gap check has something to compare with"

terms:
  - term: Ad Library
    meaning: Meta's free public list of the ads running on Facebook and Instagram.
  - term: Saturation
    meaning: How many sellers already sell the same product to the same buyer.
  - term: Serious rival
    meaning: A branded store with its own look and several ads running.
