new_slug: creator-pay-planner
name: "Creator pay planner"
summary: "Work out a fair flat fee or floor-or-commission offer for a creator post from your Meta ad cost and their real views, with a go or no-go."
job: grow-social
thinking: medium
thinking_why: "It does fee math and writes offer terms, which a mid-size model handles well."

headline: "Creator pay planner"
subhead: "Give it a creator's last 10 video views, their audience split and what your Meta ads cost per 1,000 views. It works out a flat fee, or a floor-or-commission offer for shop sales, and tells you go or no-go on their quote. You also get what to ask for in return."

explain: |
  Most stores guess what to pay a creator, then find out later that one post cost far more per view than their ads. CPM means the cost for every 1,000 views. If you know what your Meta ads cost per 1,000 views, you can work backwards to a fair price for an influencer post.

  This skill sets the creator's target at half your Meta CPM and multiplies it by the views their last 10 videos usually get. It then cuts the fee for any part of the audience you cannot sell to, and counts shipped product as part of the cost. If you sell through a shop, it can write a floor-or-commission offer instead. It tells you to walk away when the quote is above your ceiling.

  The method comes from founder interviews about very large creator programs. Their numbers are not checked here, so treat the half-of-Meta rule as a starting point. One creator tells you little, so the plan treats creator pay as many small bets.

when:
  - A creator sent you a price and you can't tell if it is fair.
  - You want to make the same simple offer to many small creators.
  - You sell through a shop, such as TikTok Shop, and want an offer that pays creators more when they sell more.
  - You are about to ship product and want to see how much cash fee is left after the product and postage.

not_for:
  - "You have no Meta ad cost and no paid view price to start from: run a small ad test first to get one. This skill won't guess a CPM."
  - "You want to pay many people only for approved clips of your own footage: use the Clipper program planner."
  - "You are sending free product with no cash fee: use the Influencer gifting planner."
  - "You want equity or a long deal with a well-known creator: use the Creator equity deal planner, and ask a lawyer."

you_give:
  - What your Meta ads cost per 1,000 views, or any paid view price you know (find it in Meta Ads Manager)
  - The creator's last 10 videos with their view counts
  - The creator's audience split by gender and country (optional, ask the creator for a screenshot)
  - Your hero product, margin, where you sell and what shipping costs (optional)
  - The creator's size, your budget and the cash you can hold for 90 days (optional)

you_get:
  - A fee with the target CPM, expected views, audience cut and cash fee, with the sum shown
  - A go, no-go or counter-offer on the creator's quote
  - Offer terms: a flat fee, or a floor or commission for shop sales, with posts and usage rights
  - What to ask for in return, such as number of posts and ad rights
  - Volume targets, a plan for posting the content again, and a check to run after posting

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini. If you have not added it, copy it and paste it into a new chat.
  - Paste your Meta CPM and the creator's last 10 videos with views. Ask the creator for a screenshot of their audience tab.
  - Say where you sell and what it costs to ship the product.
  - Read the go or no-go first, then the offer terms.
  - Send the offer in writing before the creator posts, with the paid-post label rule in it. In the week the video lands, check orders and branded search.

how_it_works:
  - title: Sets the target CPM
    text: Half of your Meta CPM, so a $20 Meta CPM gives a $10 target. With no Meta ads it uses a paid view price you state.
  - title: Finds expected views
    text: The average of the creator's last 10 videos, never the best one.
  - title: Cuts for the wrong audience
    text: It reduces the fee by the share of followers you cannot sell to, by gender or by a country you do not ship to.
  - title: Counts the product
    text: Shipped product and postage are part of the total cost, so the cash fee is smaller.
  - title: Writes the offer
    text: A flat fee agreed before posting, or for shop sales a floor or commission, whichever is higher, with posts and rights listed.
  - title: Gives go or no-go
    text: If the quote is above your ceiling, it says so and gives a counter-offer.
  - title: Plans volume and reuse
    text: How many posts to ask for, how to review them, and where to repost with the creator's name.
  - title: Checks it worked
    text: It tells you to check orders and branded search in the week a video lands, and says one creator tells you little. Judge the program over many creators.

output_shape: |
  FEE
  Meta CPM <$>  ->  target CPM <$> (half)
  Expected views <n> (average of last 10: <list>)
  Base fee = <views> / 1,000 x <target CPM> = <$>
  Off-target cut: <gender share>, <country share> -> <$>
  Less product and postage <$> -> cash fee <$>
  Quote received <$>  GO | NO-GO | COUNTER <$>

  OFFER
  <flat fee agreed before posting | floor of <$> a month or <15 to 20%> commission, whichever is higher>
  Posts: <n>  Usage and ad rights: <terms>
  Disclosure: posts carry #ad or the platform's paid-partnership label

  RECRUITING LADDER (optional, check the rules first)
  <micro-creator> -> <commission only when earnings pass the move-up line> -> <recruiter>

  VOLUME AND REPOSTING
  <posts per week>  Review owner: <name>  Repost to: <platforms>, commission <rule>

  CHECK AFTER POSTING: orders and branded search in the week the video lands. One creator tells you little; judge the program over many creators.
  CHECKS MISSED: <none | list>
  MISSING: <what>

output_sample:
  input:
    - What your Meta ads cost per 1,000 views
    - The creator's last 10 videos with view counts
    - The creator's audience split by gender and country (optional)
    - Your hero product, margin and where you sell (optional)
  prerequisites:
    - Meta ads running, or a paid view price you know
    - A screenshot of the creator's audience tab, which the creator can send
  output:
    - name: FEE
      contains: Target CPM, expected views, base fee, audience cut, product and postage, the cash fee, and go, no-go or counter.
    - name: OFFER
      contains: A flat fee, or a floor or commission for shop sales, with post count, usage rights and the paid-post label rule.
    - name: RECRUITING LADDER
      contains: An optional path from small creator to commission only to recruiter, with a note to check the rules first.
    - name: VOLUME AND REPOSTING
      contains: Posts per week, who reviews them, and where to repost with the creator's name.
    - name: CHECK AFTER POSTING
      contains: The orders and branded search to check in the week the video lands, and a reminder that one creator tells you little.
    - name: CHECKS MISSED and MISSING
      contains: Any check that failed and any input you did not give, such as a missing CPM or audience split.

tweaks:
  - what: Your Meta CPM
    how: Use a recent figure for the same country and product. A stale CPM moves every fee.
  - what: Audience split
    how: Ask for a screenshot of the creator's audience tab. Without it the skill marks the discount as unknown and gives a range.
  - what: Where you sell
    how: Say if you sell on your own site only. Then it keeps codes or links in the offer, since flat fees with no tracking are a harder bet.
  - what: Creator size
    how: With a small budget it keeps to about 5,000 to 50,000 followers and says so.
  - what: Cash you can hold
    how: Floor payments need cash for 90 days. Give your limit and the offer is cut to fit.

judge:
  - The fee shows its sum with each number you gave it.
  - It used the average of the last 10 videos, not the best video.
  - The audience cut matches the split the creator showed.
  - Shipped product is counted in the cost.
  - Every offer says the post must carry #ad or the platform's paid-partnership label.
  - It states that one creator tells you little, and treats the program as many small bets.

test:
  - Give it a creator whose last 10 videos you know and a CPM of $20. The fee should be the average views divided by 1,000, times $10.
  - Add a 25 percent male audience for a women-only product. The fee should drop by 25 percent.
  - Paste a quote far above the ceiling. It should say no-go and give a counter.
  - Run it twice on the same creator. The fee should match.

improve:
  - Add your current shop commission rules and your own review rhythm for how often you recheck the numbers.
  - Add your standard contract lines for usage rights, ad rights and posting dates.
  - Save your agreed CPM ceiling in your brand file, so every offer starts from it.
  - Keep a list of fees paid and the orders in the following week, to see if your half-of-Meta rule holds.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "It does the sums and writes the offer. Paste the views and your CPM as plain text."}
    - {name: "Meta Ads Manager", why: "It shows your own cost per 1,000 impressions, the number the fee starts from."}
    - {name: "TikTok Shop", why: "If you sell through the shop, its seller centre shows commission rules and orders per creator."}
  inputs:
    - "A screenshot of the creator's audience tab"
    - "Your landed cost and margin for the hero product"
    - "Branded search and order counts for the weeks around each past post"

terms:
  - term: CPM
    meaning: The cost for every 1,000 views.
  - term: Flat fee
    meaning: One price agreed before the creator posts, however the post does.
  - term: Floor or commission
    meaning: A minimum payment each month, or a share of sales, whichever is higher.
  - term: Usage rights
    meaning: What you may do with the creator's video, such as run it as an ad.
  - term: Branded search
    meaning: People searching Google for your brand name. A jump after a post is a sign it worked.
