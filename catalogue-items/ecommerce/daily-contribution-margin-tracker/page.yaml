new_slug: daily-contribution-margin-tracker
name: "Daily contribution margin tracker"
summary: "Track daily contribution margin for your online store. Give it sales, costs and ad spend. You get a daily sheet with returns counted as expected."
job: track-numbers
thinking: medium
thinking_why: "It sets up a sheet from a short formula and a returns rule, which a mid-size model does well if it checks each column."

headline: "Daily contribution margin tracker"
subhead: Give it your daily net sales, product and variable costs, ad spend and return rate. It builds a daily contribution margin sheet that counts returns as they are expected, not as they are processed. You get the sheet layout, the accrual rule and a ranked list of the metrics to show.

explain: |
  Contribution margin is net sales (before returns) minus the returns accrual, minus product cost, minus variable costs, minus ad spend. Leave fixed costs out of the daily number. If you spread rent across each day, a profitable media day can look like a loss and tell you to cut spend. Fixed costs belong in the owner's view of the month: contribution margin minus overhead is profit.

  Shopify's total sales takes returns off when they are processed, not when the sale happened. December returns can hit January, so January looks worse than it was. This skill accrues returns instead. It applies your expected return rate to each day's revenue, then reconciles to actual returns at month end and resets the rate from the last 90 days. Then your team sees one honest number each morning. You set the return rate once, in the sheet's rate cell, from your own last 90 days. You set the reconciliation date as the last day of each month.

when:
  - You judge a day by revenue and only learn at month end whether it made money.
  - Returns post late and make last month look different once they land.
  - Your team argues about which number matters.
not_for:
  - "Your store has no returns history yet: start with a simple sheet of sales minus costs, then switch once you have about 90 days of returns."
  - "You have no variable cost data, such as shipping or payment fees: work those out first with your accountant or your store reports."
  - "You want a full profit and loss with rent and salaries: ask your accountant or use your bookkeeping tool."

you_give:
  - Daily net sales (after discounts, before returns, so returns are only counted once, by the accrual)
  - Product cost and variable costs per order or as a percent
  - Daily ad spend
  - Your return rate
  - Monthly contribution goal and fixed costs (optional)

you_get:
  - A daily contribution margin sheet or dashboard layout
  - A returns accrual rule with the month-end check
  - A ranked list of metrics to show, with contribution margin at the top

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste a month of daily sales, costs and ad spend, and your return rate from the last 90 days.
  - Add your monthly contribution goal and fixed costs if you want the owner's view.
  - Paste the formulas into a sheet and check three days by hand.
  - Share the daily number with the whole team.
output_sample:
  input:
    - Your daily net sales
    - Your product cost and variable costs, per order or as a percent
    - Your daily ad spend
    - Your return rate from the last 90 days
    - Your monthly goal and fixed costs (optional)
  output:
    - name: Daily sheet
      contains: One row per day with net sales, returns accrual, costs, ad spend, contribution margin and margin as a percent of sales.
    - name: Formulas
      contains: The returns accrual and contribution margin formulas to paste into your sheet.
    - name: Month-end check
      contains: Accrued returns against actual returns, the difference, and a new rate from the last 90 days.
    - name: Owner view
      contains: Month contribution margin, fixed costs, profit, goal and gap. Kept apart from the media buyer's view.
    - name: Metric pyramid
      contains: The metrics to show, ranked, with contribution margin on top and channel ROAS at the bottom.
    - name: Checks missed and missing inputs
      contains: Any check that failed and any input you did not give, marked MISSING.

how_it_works:
  - title: Sets the formula
    text: Net sales before returns, minus the returns accrual, product cost, variable expense and ad spend. Fixed costs are left out.
  - title: Accrues returns
    text: The expected return rate is applied to each day's revenue. For example, 10% of a $1 million month is about $3,333 a day.
  - title: Reconciles each month
    text: At month end it compares the accrual with actual returns and resets the rate from the last 90 days.
  - title: Builds the pyramid
    text: Contribution margin on top, then revenue, spend, MER, order value, new-customer metrics, and channel ROAS at the bottom.
  - title: Splits the views
    text: The owner or finance view adds fixed costs and the monthly goal. The media buyer's daily view leaves them out.
  - title: Flags the customer file
    text: It reminds you to keep the active customer file growing, and to watch if it shrinks.
  - title: Shares it
    text: The number goes to the whole team, because people can only move what they see.

output_shape: |
  DAILY SHEET  one row per day
  date | net sales | returns accrual | product cost | variable cost | ad spend | contribution margin | CM % of net sales

  FORMULAS
  returns accrual = net sales x <return rate>
  contribution margin = net sales - returns accrual - product cost - variable cost - ad spend

  MONTH-END CHECK
  accrued returns <$> | actual returns <$> | difference <$> | new rate from last 90 days <%>

  OWNER VIEW (not for the media buyer)
  month contribution margin <$> | fixed costs <$> | profit <$> | goal <$> | gap <$>

  METRIC PYRAMID
  1 contribution margin  2 revenue, spend, MER, AOV  3 new-customer metrics  4 channel ROAS

  CHECKS MISSED: <none or list>
  MISSING: <input>

tweaks:
  - what: The return rate
    how: Use an honest rate from your last 90 days. A guessed rate makes every day look better or worse than it was.
  - what: Variable costs
    how: Include shipping, fulfilment and payment fees. Leave out rent, salaries and software.
  - what: Who sees which view
    how: Put fixed costs and the monthly goal in the owner or finance view only. Keep the media buyer's view to the daily number.
  - what: Month-end reset
    how: Reconcile the accrual to actual returns each month and reset the rate. If you skip this the error grows.

judge:
  - Fixed costs appear nowhere in the daily contribution number.
  - Returns are accrued on each day's revenue, with a month-end reconciliation.
  - The accrual rate is tied to a stated window of your own data.
  - Contribution margin sits at the top of the pyramid.
  - Anything it could not check is listed under CHECKS MISSED.

test:
  - Fill in last month and compare the total with your accountant's contribution margin. They should be close.
  - Change the return rate by 2 points and see how the daily numbers move.
  - Pick a day with big ad spend and check the sheet shows the real profit, not a loss from fixed costs.
  - Ask a teammate what they would do after reading a day's row.

improve:
  - Put your return rate and your reconciliation date in the skill file.
  - Add your usual seasonal return spikes so the accrual follows them.
  - Add a weekly roll-up once the daily sheet is steady.
  - Track the size of your active customer file monthly. A shrinking file can warn of falling repeat revenue. Check it against your own order history, and do not quote a repeat-buyer percentage.
  - Money figures are planning numbers. Check them with your accountant.

works_best_with:
  tools:
    - {name: "Google Sheets", why: "A daily sheet with a few formulas is easy to share, and everyone sees the same number."}
    - {name: "Shopify", why: "Its sales and returns reports feed the sheet, and cost per item gives product cost."}
    - {name: "Any good chat AI", why: "It writes the formulas and checks them against a few days you work out by hand."}
  inputs:
    - "Daily ad spend from every channel"
    - "Your last 90 days of returns, to set the accrual rate"
    - "Fixed costs per month, for the owner's view"

terms:
  - term: Contribution margin
    meaning: Net sales (before returns) minus the returns accrual, product cost, variable costs and ad spend. Fixed costs are not in it.
  - term: Returns accrual
    meaning: Setting aside the expected returns on each day's sales, instead of waiting until they are processed.
  - term: MER
    meaning: Net revenue divided by total ad spend.
