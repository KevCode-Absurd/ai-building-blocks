new_slug: discount-impact-checker
name: Discount impact checker
summary: Check a planned discount before it goes live. Give your prices and costs. See if your profit goal is possible and what ad return it needs.
job: make-offer
thinking: medium
thinking_why: It is mostly careful arithmetic with a few judgement calls, so a mid-size model is enough if it shows its sums.
headline: Discount impact checker
subhead: It compares full-price and discounted order numbers using your costs and expected units. First it checks whether the profit goal leaves any room for ad cost. A negative allowance is not viable; zero means no finite paid-ad target. Only a supported positive case gets a target and custom planning score. The score does not prove demand or profit.
explain: |
  A discount reduces revenue per unit while product and fulfilment costs still need to be paid. Higher orders or reported ad returns alone do not show that profit improved.

  This skill calculates the full-price case and a supplied discount scenario, then checks the ad cost allowed by your profit goal. If that allowance is negative, the goal is impossible under those inputs even before ads. If it is zero, only zero acquisition cost can meet it. These cases get no finite paid-ad target, score or go-ahead. A positive supported case can show the target return and a custom planning score, with missing costs and demand assumptions visible.
when:
  - You plan a site-wide sale, a code or an email discount and want to know the ROAS it needs before it goes live.
  - Someone suggests free shipping on a low-priced product and you want to see if it loses money.
  - A past sale had good ROAS but little profit and you want to know why.
  - You wonder if a two-for-one, bundle or gift would earn more than a percent off.
not_for:
  - "You have no cost or shipping data yet: work out your cost per order in a spreadsheet first, then come back."
  - "You want to pick which kind of offer to run: ask a person on your team or test one non-discount offer, such as a gift, on a small scale."
  - "You need to plan when to run the sale: use a sale calendar or ask your ad person, as this check does not set timing."
you_give:
  - Price, product cost, shipping, fulfilment and payment fees per order
  - Current AOV, units per order and target ROAS or profit per order
  - The planned discount and the units per order you expect on sale
  - Past sales at different discount levels, with units per order (optional)
  - The bundle, buy-one-get-one or gift you could run instead, with the gift cost (optional)
  - Cash you can spend while a sale pays back (optional)
you_get:
  - The full-price numbers and the same numbers under the discount
  - A supported positive-CPA ad target, or a not-viable/zero-CPA result with its reason
  - A custom planning score only for valid complete inputs; points do not prove success
  - The discount depth with the most profit per order, when your history allows it
  - The same promo run as a percent off, a bundle or buy-one-get-one, and a gift, side by side
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your price and every cost per order, including shipping, fulfilment and payment fees.
  - Paste your current AOV, units per order and target ROAS, then the discount you plan.
  - Add past sale records if available. They can inform scenarios but do not guarantee a future result.
  - Read the feasibility result first. Rework nonpositive-CPA cases before considering a limited test or score.
output_sample:
  input:
    - "Your price and costs per order: product, shipping, fulfilment and payment fees"
    - Your current average order value, units per order and target ROAS or profit per order
    - The discount you plan and the units per order you expect on sale
    - Past sales at different discount levels (optional)
    - A bundle, buy-one-get-one or gift you could run instead (optional)
  output:
    - name: Full price
      contains: Your order value, costs, gross profit, margin, break-even ROAS, target CPA and profit per order without a discount.
    - name: Under the discount
      contains: The same numbers after the discount is taken off the retail value of the units bought.
    - name: The bar
      contains: The ad cost your profit goal allows, whether that is possible, the ROAS needed and whether the jump is believable.
    - name: Best depth
      contains: The discount level with the most profit per order from your past sales, or a note that past sales are missing.
    - name: Offer comparison
      contains: Percent off, bundle or buy-one-get-one, and gift side by side, with discount plus ad cost per order.
    - name: Custom score
      contains: A planning score out of 100 with each penalty, only when the inputs are complete and the case is valid.
    - name: Verdict and next step
      contains: Not viable, zero-CPA only, rework inputs or a limited test, plus the first change to make and anything missing.
how_it_works:
  - title: Build full-price numbers
    text: Works out gross profit, break-even ROAS (1 divided by gross margin), target CPA and profit per order from your costs.
  - title: Apply the discount to retail value
    text: Takes the discount off the full retail value of the units bought, not off the new price, and adds the extra units you expect on sale.
  - title: Hold profit flat
    text: Finds the ad cost allowed by the profit goal. Negative means not viable; zero has no finite paid-ad target. Only a positive value permits division.
  - title: Test if the jump is believable
    text: Compares the gain in efficiency you need with what your own past sales show.
  - title: Find the best depth
    text: With past sales at several depths, finds where profit per order peaks. Without them, it says so.
  - title: Check layered offers and shipping
    text: Adds gifts, bigger packs and subscribe discounts to the same sheet, and flags free shipping on low-priced items.
  - title: Compare offer types
    text: Runs a percent off against a two-for-one or a gift on one sheet, and adds the discount to your CAC so you see the true cost of a new customer.
  - title: Check promo rules
    text: Checks the rules around the sale, such as winning on the first order, the returns policy and tying the deepest discount to a sign-up.
  - title: Score and give a verdict
    text: Scores only a supported positive-CPA case with complete costs. The house checklist is a planning aid, not proof of safety or a launch instruction.
output_shape: |
  FULL PRICE
  AOV <$> | costs <$> | gross profit <$> | margin <%>
  break-even ROAS <x> | target CPA <$> at <x> | profit per order <$>

  UNDER THE DISCOUNT (<n>% off, <units> units per order)
  retail value <$> | revenue <$> | AOV <$> | costs <$> | gross profit <$>
  break-even ROAS <x>

  THE BAR
  Required CPA <value> | feasibility <positive / ZERO-CPA ONLY / NOT VIABLE / unresolved>
  ROAS needed <only for positive required CPA; otherwise no finite paid-ad target>
  your current ROAS: <x> | gap: <+ or - %>
  believable? <yes / stretch / no, with the evidence>

  BEST DEPTH  <n>% (from <n> past sales) or MISSING: past sales

  OFFER COMPARISON (same promo, this store's costs)
  percent off: contribution after CAC <$> | bundle or buy-one-get-one: <$> | gift: <$>
  discount + CAC per order: <$> in each case

  CUSTOM SCORE <n>/100 only for complete valid inputs, or NOT SCORED: <reason>
  penalties: <each with points>
  <n>/100 after <the suggested change>

  VERDICT <not viable | zero-CPA only | rework inputs | consider a limited test with agreed limits>
  NEXT  <the first test or change>
  MISSING: <costs | units on sale | history>
tweaks:
  - what: Units per order on sale
    how: This number moves the answer most. Use your own last sale. If you have none, run a low case and a high case and read both.
  - what: Shipping and fulfilment cost
    how: Include shipping, fulfilment, fees and costs at the expected units. Missing costs prevent scoring.
  - what: Target
    how: Give a target profit per order, not only a target ROAS. The skill holds profit flat against it.
  - what: Offer type
    how: Name the bundle, two-for-one or gift you could run instead. The skill puts it next to the percent off with your own costs.
  - what: Layered offers
    how: Add the gift, bigger pack or subscribe discount you plan. A layered offer can need a much lower ROAS than a plain percent off.
judge:
  - Every number can be traced to something you gave it, and the sums are shown.
  - The discount is taken off retail value, not off an already reduced price.
  - Shipping, fulfilment and fees are counted in costs.
  - The score lists each penalty with its points and says what it measures.
  - Anything it had to assume is marked and not hidden inside a figure.
  - Each source figure is labelled as one source's claim, and a no-returns rule comes with a line to check the law.
  - Nonpositive required CPA prevents target division, scoring and a run-it verdict; invalid rate denominators remain unresolved.
test:
  - Run it on your last sale. Does the ROAS bar match the reason that sale made less profit than it looked?
  - Change only the discount from 15 to 25 percent and run it again. The ROAS bar should rise faster than the discount does.
  - Remove the shipping cost from your input. The skill should say shipping is missing and refuse to score.
  - Run it twice with the same input. The bar and verdict should match.
  - Use AOV 100, cost 40, current target 2.5 and one unit. At 50% off, required CPA minus 10 is not viable; at 40%, CPA 0 has no finite paid-ad target; at 25%, CPA 15 gives requiredROAS 5.
improve:
  - Save your real cost per order and your usual units per order in your brand file, so you do not retype them.
  - Add your own past sale results as a table, so the best-depth step has data to use.
  - Edit the score penalties in the skill file to fit your store, for example a lower tolerance if your cash is thin.
  - Pair it with a skill that picks the offer type first, and with one that plans sale timing.
works_best_with:
  tools:
    - name: Shopify
      why: Its reports give you AOV, units per order and discount codes used, which are the inputs this check needs.
    - name: Google Sheets
      why: Keep your cost table and past sales in a sheet, then paste them in.
  inputs:
    - A past sale export with discount percent and units per order
    - Your shipping cost table for one, two and three units
    - Your monthly cash position, so the cash check is real
terms:
  - term: Contribution after CAC
    meaning: What is left from one order after product, shipping, fulfilment, fees and the ad cost to win that customer.
  - term: Break-even ROAS
    meaning: The ad return you need just to cover your costs. It equals 1 divided by your gross margin.
  - term: Target CPA
    meaning: The most you can pay in ads to win one order and still hit your profit goal.
  - term: Retail value
    meaning: What the units in the order would cost at full price, before any discount.
