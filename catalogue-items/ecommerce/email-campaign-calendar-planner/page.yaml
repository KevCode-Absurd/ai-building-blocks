new_slug: email-campaign-calendar-planner
name: Monthly email campaign calendar planner
summary: Plan a month of store emails around your real dates and team size. Get send dates, angles, owners and a content mix check.
job: write-emails
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
headline: Monthly email campaign calendar planner
subhead: Share the brand, products, month, fixed dates, segments and available content. It proposes a pace, places launches and sales, then fills gaps with useful messages. Get send dates, two-line angles, owners and a mix check, plus a two-week preparation plan. Agency frequency rules are starting points to test. Deadlines, stock claims and send permission must be real.
explain: |
  Many stores email only when they have a sale. That teaches customers to wait for a discount, and it leaves the days between sales empty. Others send every day and drive people away.

  This skill builds a calendar around a steady rhythm. It places your fixed dates first (launches, restocks, sales), then holidays that fit your brand, then content you already own, then fills the gaps with non-discount ideas. It checks the mix, no two sends in a row of the same type, and how many are promotions. It sets a pace that fits your revenue and your team. A team that cannot keep a pace should start lower, because skipping weeks raises unsubscribes.
when:
  - You send emails only around sales and want a steady monthly rhythm.
  - You have a launch coming and want the sends around it planned.
  - You are always writing the same day's email at the last minute.
not_for:
  - You have no email list or no consent to send. Build your list first, or use the engaged list expander if people stopped opening.
  - You need one single email written. Ask a person or your AI to write that one email, as this plans a whole month.
  - You want to send the same plan to your whole list every week. Start with engaged people only, and test before you raise the pace.
you_give:
  - Your brand, products and target customer
  - "Fixed dates: launches, restocks and sale events"
  - Blogs, videos and reviews you can reuse
  - The month to plan and the segments you can send to
  - Your monthly revenue and team size (optional)
you_get:
  - A month calendar with send date, type, segment, status and owner
  - A two-line angle for each send
  - A mix check against seven content types
  - A production schedule that keeps you two weeks ahead
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your brand context, fixed dates and the month to plan.
  - List the content you already have, such as blogs, videos and reviews.
  - Check the mix and the pace against your real team capacity before you commit.
  - Load the emails two weeks ahead and review the results at month end.
output_sample:
  input:
    - Your brand, products and target customer
    - Your fixed dates, such as launches, restocks and sales
    - The month to plan
    - Blogs, videos and reviews you can reuse (optional)
    - Your monthly revenue, team size and segments (optional)
  prerequisites:
    - An AI chat such as Claude, ChatGPT or Gemini
    - Your brand brain from the Website brand brain builder (optional)
  output:
    - name: PACE
      contains: How many campaigns a week to send, and why that fits your revenue, team and list.
    - name: CALENDAR
      contains: One row per send with date, day, type, segment, status and owner, plus a two-line angle.
    - name: MIX CHECK
      contains: Counts of promotion, product, education, proof and brand sends, and the ratio of non-discount to discount.
    - name: WEEKLY VARIETY
      contains: Any two sends in a row of the same type, and the swap that fixes it.
    - name: PRODUCTION SCHEDULE
      contains: The dates to write, design and load each email so you stay two weeks ahead.
    - name: MONTH-END REVIEW
      contains: "What to check at month end: top sends by revenue, clicks without sales, and why some lagged."
    - name: CHECKS MISSED and MISSING
      contains: Any check that failed and any input you did not give, such as fixed dates or team size.
how_it_works:
  - title: Picks the pace
    text: By monthly revenue and team size. Under $50,000 a month, 2 to 3 campaigns a week. Over $50,000, 3 to 4. Over $200,000, 4 to 5. Rarely above 5. A small team starts at 2 a week. These are agency rules of thumb, so test them against your own unsubscribes and revenue per send.
  - title: Locks the fixed dates
    text: Launches, restocks and sales go in first. Sale events stay rare so customers do not learn to wait.
  - title: Adds fitting holidays
    text: Only those that suit the brand, one or two a month, with no discount.
  - title: Maps your content
    text: Blogs, videos and reviews are placed at the right season, with a teaser or a takeaway.
  - title: Fills the gaps
    text: With non-discount ideas built from the seven content types.
  - title: Checks the mix
    text: Promotions, product, education, proof and brand sends each have a target range, and no two sends in a row are of the same type.
  - title: Sets the runway
    text: Everything is written, designed and loaded two weeks ahead, with a review at month end.
output_shape: |
  PACE
  <n> campaigns a week | why: <revenue, team, list health>

  CALENDAR  <month>
  <date> | <day> | <type> | <segment> | <status> | <owner>
    Angle: <two lines>
  (one row per send)

  MIX CHECK
  Promotions <n> | Product <n> | Education <n> | Proof <n> | Brand <n>
  Ratio of non-discount to discount: <n> to 1 | Result: <pass | swap these>

  WEEKLY VARIETY
  <any two sends in a row of the same type, and the swap>

  PRODUCTION SCHEDULE
  Written by <date> | Designed by <date> | Loaded by <date> | Review <date>

  MONTH-END REVIEW
  <top opens, clicks, revenue; what lagged>
  MISSING: <fixed dates | content | segments | team size>
tweaks:
  - what: Your team size
    how: Tell it how many designed emails a week your team can make. Smaller teams use plain text for half the sends and start at two a week.
  - what: Your revenue
    how: The pace rises with revenue. Say your monthly revenue so the planner picks the right range.
  - what: Your discount rules
    how: Tell it how often you discount. The planner keeps at least 5 non-discount emails for every discount email.
  - what: Your segments
    how: Name the segments you can send to. The plan sends to engaged segments, with one or two sends a month to everyone still subscribed.
  - what: Your content
    how: List every blog, video, review roundup and guide you own. Reusing them is the quickest way to fill the calendar.
judge:
  - Fixed dates are placed before anything else.
  - The mix check shows the counts, not only a verdict.
  - No two sends in a row are of the same type.
  - The pace matches your revenue and team, and the page says what to do if you cannot keep it.
  - Discount emails are rare and the plan says why.
  - Anything you did not provide is marked, not invented.
test:
  - Give it a month with one sale and one launch. Both should sit on the right dates, with supporting sends around them.
  - Count the types in the calendar and compare with the mix check. The counts should match.
  - Ask for a team of one. The pace should drop and some sends should be plain text.
  - Follow the calendar for a month, then compare revenue per send with your last month.
improve:
  - Add your own idea buckets and a list of ideas that fit your brand.
  - Add your real send days, based on your own send-time tests.
  - Add your team's weekly capacity and who owns each type of send.
  - Save each month's review to your brand file so the next calendar starts from what earned.
  - Pair it with the email topic bank builder for ideas, the campaign email writer for the copy and the engaged list expander for the audience.
works_best_with:
  tools:
    - name: Klaviyo
      why: Its campaign calendar shows scheduled sends and segments in one view.
    - name: Notion or Google Sheets
      why: A shared table with date, type, owner and status keeps the production schedule visible.
  inputs:
    - Your last 3 months of campaigns with revenue per send
    - Your reviews, grouped by product
    - A list of your blogs and videos with dates
terms:
  - term: Segment
    meaning: A group of people in your email tool who share something, such as having opened an email recently.
  - term: Non-discount email
    meaning: An email that gives value, such as education or proof, instead of a sale.
  - term: Runway
    meaning: How far ahead your emails are written, designed and loaded.
  - term: Engaged
    meaning: People who opened, clicked or shopped within a set number of days.
