new_slug: five-gate-campaign-scaling-planner
name: Five-gate campaign scaling planner
summary: Check which Meta campaigns are ready to scale. Give it your results and targets. You get a five-gate review, a scaling plan and stop rules.
job: launch-and-scale-ads
headline: Five-gate campaign scaling planner
subhead: Share campaign results, targets, budget, pacing dates and saturation signals. Get a five-gate scaling review with method, timing and stop rules.
explain: |-
  Raising budget on a campaign that is not ready wastes money. This skill checks five gates for each campaign: cost per sale under target, enough sales per week, steady click rate, return above target and no creative fatigue. A campaign must pass all five.

  It then checks whether your spend is on pace for the month and picks a scaling method with a week-by-week plan, usually steps of 15 to 20 percent. It also lists the signs that mean you should stop. The thresholds are starting points. Check them against your own account and Meta's current guidance.
when:
  - You run Meta campaigns and want to know which ones are safe to scale.
  - Your spend is behind or ahead of plan for the month and you need to know why.
  - You want a step-by-step budget plan and stop rules written down before you raise any budget.
not_for:
  - Your campaign has under 14 days of data, or your ad account is new. Wait and collect more results first.
  - No campaign passes all five checks. Run a creative test first, then come back, because the plan will say fix creative before scaling.
  - You want to write new ads or check them before launch. Use a copywriter or your ad platform's review tools instead.
  - "You want a break-even ROAS, a spend ladder and a scaling campaign design: use the Meta scaling campaign planner."
you_give:
  - Results for each campaign over the last 14 to 30 days
  - Your target cost per sale and target return on ad spend
  - Your monthly budget cap and growth goal
  - Days at current budget and number of live ads (optional)
you_get:
  - A pass or fail for each campaign on the five gates, with what blocks it
  - A scaling method, new daily budget and week-by-week plan for each ready campaign
  - A saturation watchlist, stop rules and a 30-day projection
  - The missing inputs and assumptions
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text from this page.
  - Paste your results for each campaign from the last 14 to 30 days, plus your targets, budget cap and growth goal.
  - Answer any question about missing numbers. The AI marks gaps and does not guess.
  - Check the five-check table first. A campaign must pass all five to scale.
  - Check the maths and dates against your ad account before you change any budget.
  - Scale in steps of 15 to 20 percent, and wait at least 7 days between steps.
output_sample:
  input:
    - Your results for each campaign over the last 14 to 30 days
    - Your target cost per sale and target return on ad spend
    - Your monthly budget cap and growth goal
    - Days at current budget and number of live ads (optional)
  output:
    - name: Scale-Readiness Summary
      contains: A table showing each campaign's result on the five checks, whether it is ready to scale, and what blocks it.
    - name: Budget Pacing Status
      contains: Whether spend is on pace, under or over for the month, with the action to take.
    - name: Scaling Recommendations
      contains: For each ready campaign, the scaling method, new daily budget, timeline, week-by-week plan and risk level.
    - name: Budget Reallocation
      contains: Where to move budget from and where to move it to.
    - name: Saturation Watchlist
      contains: Signals such as frequency, cost per thousand views and click rate to watch, with the stop rules.
    - name: 30-Day Projection
      contains: Expected spend and revenue for the next 30 days based on the plan.
how_it_works:
  - title: Collects your data
    text: Asks for 14 to 30 days of results per campaign, plus your targets, budget cap and growth goal. It marks anything missing.
  - title: Runs the five gates
    text: Cost per sale under target for 2 weeks, enough sales per week, steady click rate, return above target and no creative fatigue. All five must pass.
  - title: Checks budget pacing
    text: Compares your 3-day average spend with the month so far and says if you are on pace, under or over.
  - title: Picks a scaling method
    text: Ranks five methods by risk, from raising the budget on a winner to a new market, and uses steps of 15 to 20 percent a week.
  - title: Watches for saturation
    text: Lists the signs to watch, such as frequency, cost per thousand views and click rate, with stop rules.
  - title: Hands back the plan
    text: A readiness table, pacing status, a plan for each ready campaign, where to move budget and a 30-day projection. Check the maths against your ad account before you change any budget.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
