    text: Follow the the 5 hook tactics section in the full method and keep its required fields and decision rules.
  - title: Generate 10-15 Hooks
    text: Follow the generate 10-15 hooks section in the full method and keep its required fields and decision rules.
  - title: Rank
    text: Follow the rank section in the full method and keep its required fields and decision rules.
  - title: Production Notes
    text: Follow the production notes section in the full method and keep its required fields and decision rules.
  - title: Rules
    text: Follow the rules section in the full method and keep its required fields and decision rules.
