new_slug: funnel-stage-creative-brief-builder
name: Funnel-stage creative brief builder
summary: Turn your buyer and product facts into ranked ad angles and ready-to-use creative briefs for each funnel stage in your ad campaigns.
job: plan-ad-tests
headline: Funnel-stage creative brief builder
subhead: Share brand profile, buyer, offer, evidence and production limits. Get ranked ad concepts and full hook, body, visual and cta briefs.
explain: |-
  Turn buyer and product facts into five ad angles and full production briefs for the right funnel stage.

  Share brand profile, buyer, offer, evidence and production limits. Get ranked ad concepts and full hook, body, visual and cta briefs.
when:
  - You need ranked ad concepts and full hook, body, visual and CTA briefs.
  - You need funnel-stage creative brief builder for a specific task.
  - You want the method's decisions and assumptions written down before acting.
not_for:
  - You have no facts about your buyer or offer yet. Gather those first, or ask a teammate who knows the customer.
  - You only need copy for one ad. Use a simple single-ad copy prompt in your AI chat instead.
  - You want your ads built, published or budgeted. This item writes briefs only, so use your ad platform or a media buyer.
you_give:
  - Brand profile
  - Buyer
  - Offer
  - Evidence and production limits
you_get:
  - Ranked ad concepts and full hook, body, visual and CTA briefs
  - The sources used, missing inputs and assumptions
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill's instructions.
  - Paste your buyer, brand name and website link. Add your offer and proof, such as reviews.
  - Paste competitor ads and recent ad results if you have them (optional). Anything you skip will be marked as missing.
  - Ask for the full brief and read the angles first.
  - Check every claim against your own facts, then fix any warn or fail from the preflight.
  - Produce the top concepts first. No code or paid tool is needed.
output_sample:
  input:
    - Your buyer or persona, in a few lines
    - Your brand name and website link
    - A competitor to stand apart from (optional)
    - Your recent ad results (optional)
  prerequisites:
    - An AI that can browse the web, if you want it to read your site. Otherwise paste your product facts.
  output:
    - name: Executive Summary
      contains: The buyer, the brand and the key insight that shapes the angles.
    - name: Messaging Angles
      contains: Five ranked angles, each with a type, a score and a one-line core message.
    - name: Funnel Adaptation Matrix
      contains: For each angle, a hook, sample headline and CTA for all five awareness stages.
    - name: Concept List
      contains: 10 to 15 numbered ad concepts, tagged with format and awareness stage.
    - name: Production Briefs
      contains: "For each concept: hook, body points, visual direction and CTA."
    - name: Preflight Results
      contains: A pass, warn or fail for each brief, plus a check of the whole batch.
    - name: Recommended Priority
      contains: The top three to five concepts to produce first.
