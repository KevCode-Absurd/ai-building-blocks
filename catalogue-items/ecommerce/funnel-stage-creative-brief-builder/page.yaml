  - title: Funnel Adaptations
    text: Follow the funnel adaptations section in the full method and keep its required fields and decision rules.
  - title: Generate 10-15 Ad Concepts
    text: Follow the generate 10-15 ad concepts section in the full method and keep its required fields and decision rules.
  - title: Review the result
    text: Return ranked ad concepts and full hook, body, visual and cta briefs. Check facts, math and the decisions before any action.
