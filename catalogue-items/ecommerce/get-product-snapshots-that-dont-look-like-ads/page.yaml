terms:
  - term: Built-in flash
    meaning: The small flash on the front of a compact camera or phone, fired straight at the subject from next to the lens.
  - term: Falloff
    meaning: How fast light gets weaker as it travels. With a flash, things further back get darker quickly.
  - term: Feed ad
    meaning: An ad that appears between normal posts as people scroll Instagram or Facebook.
