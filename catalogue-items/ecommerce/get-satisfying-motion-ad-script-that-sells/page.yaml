new_slug: get-satisfying-motion-ad-script-that-sells
name: Get a satisfying motion ad script that sells
summary: An ad that opens on one satisfying motion your product makes, then proves one fact.
job: make-video-ads

headline: Stop the scroll with one satisfying moment your product actually makes, then prove one fact
subhead: Give it how your product looks and is used, one fact you can prove and your offer. It picks one real motion (a pour, a peel, a click) and hands back a wordless five-second opening with a short narrated demonstration, or one frozen still.

explain: |
  People stop for a satisfying motion: a seal peeling off in one piece, a pour that fills a glass to the brim, a lid that clicks shut. Most attempts fall flat. The product spins on a turntable, nothing actually finishes, or the shot is slowed down and splashed until it looks fake.

  This skill builds the opening on one motion your product actually makes, at real speed, in the buyer's own kitchen or bathroom, with no face and no talking. The motion is already under way when the shot starts, and you can see the finish coming in the last third. Then a plain narrated demonstration connects what you just watched to the buyer, shows one action, says one fact you can prove, and ends on your offer. For an image ad it freezes the motion just before it finishes, which is the moment that holds the eye.

when:
  - Your product makes a motion worth watching when it's used (pours, peels, clicks, fits).
  - You need a strong opening for people who already know they want something like this.
  - You want an ad with no presenter and no face to film.

you_give:
  - How your product and pack look, and how it's used, step by step
  - The motions and sounds it makes, if you know them
  - The buyer stage, the one fact to prove and the length
  - Your approved claims and your offer
  - The buyer's own words and where they use it (optional)
you_get:
  - A wordless opening line with its overlay and a precise visual note
  - Demonstration lines with spoken words, on-screen text and visual notes
  - Or a frozen-instant still with its line, layout and image prompt
  - Any motion the facts don't describe, marked inferred

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste how your product is used, step by step, and how it opens.
  - Add the one fact you want to prove and your offer in real terms.
  - Say "video, 15 seconds" or "still".
  - Check the opening's visual note. It should name the motion already under way and what "done" looks like.
  - Film it for real or make it with an AI video tool, at real speed.

how_it_works:
  - title: Checks it fits
    text: Needs a motion a camera can see. If using the product is nothing to look at, it says so.
  - title: Picks what's in focus
    text: The product out of its pack first, then what it's made of, then the thing it replaces.
  - title: Picks one real motion
    text: A pour, a peel, a click, a fit, or order from mess. Anything the facts don't describe is marked inferred.
  - title: Keeps it real
    text: Real weight, real speed, the real product opened where it actually opens, in the buyer's own room.
  - title: Writes the opening
    text: Four to five seconds, one shot, no words spoken, an overlay of one to four words.
  - title: Writes the demonstration
    text: A bridge line, then start, action and end, one fact said once, and the offer.
  - title: Or freezes a still
    text: The instant just before the motion finishes, with one short line and 14 words in total.

output_shape: |
  OPENING (4 to 5 s, one shot, no spoken words)
  Overlay: "<1 to 4 words>"
  Visual note: <object in the brand's words>, <motion already part way>, <what done looks like>, <place>, <end sound>, <last frame>

  DEMONSTRATION
  Line | Spoken | On-screen text | Visual note
  2 | "<bridge: what they watched, what it means for them>" | - | ...
  3 | "<start, action or end>" | - | ...
  ... | "<one provable fact>" | ... | ...
  Close | "<offer and 2 to 4 word call to action>" | <same> | ...

  OR STILL
  Instant: <just before or at the finish>  Line: "<6 words or fewer>"
  Layout: <...>  Image prompt: <...>

  Inferred: <motions or sounds not in the facts>
  MISSING: <...>

example:
  business: sprout
  input: |
    [the skill]

    Product: Sprout daily greens gummies. A pouch of 28 daily packs.
    Use: tear one daily pack straight across the top, tip the small
    handful into your palm or a bowl. "Rip. Tip. Enjoy."
    Gummies: small opaque deep-green bears, soft matte, about
    thumbnail height. Big pouch: glossy deep green, opens only at its
    resealable top.
    Brand photos: bright, sunny, adults at home pouring gummies into
    a hand.
    Buyer stage: product aware. Length: 15 seconds.
    Fact to prove: "60+ ingredients, 21 vitamins & minerals, and 6g
    fiber" in 1 pack.
    Also true: no water, no mixing, no shaker.
    Offer: $29.99 first order with text sign-up, renews at $49.99
    every 4 weeks.
  output: |
    FIT  A real motion you can watch (tip and pour). Product-aware
         buyer. Fits.
    IN FOCUS  The product out of its pack: the gummies.
    MOTION  Pour and settle: the gummies tip out of the torn top into
            a palm. (How they bounce and the sound: inferred.)

    OPENING (5 s, one shot, no spoken words)
    Overlay: "Wait for it"
    Visual note: one Sprout daily pack, already torn straight across
    its top and tipping, held over a cupped palm at a sunny kitchen
    counter. The small deep-green bears slide out in a run and settle
    into the palm; the last one drops with a soft tap. Last frame: a
    small handful still in the palm, the empty pack in the other
    hand, the pouch upright behind them, in focus.

    DEMONSTRATION
    Line | Spoken | On-screen | Visual note
    2 | "That's the whole routine. One pack, straight into your hand."
        | - | Same palm, same counter, from above
    3 | "No water, no mixing, no shaker to wash." | - | Hand closes over
        the gummies; the counter beside it is bare
    4 | "One pack has 60-plus ingredients, 21 vitamins and minerals,
        and 6 grams of fiber." | 60+ ingredients. 21 vitamins &
        minerals. 6g fiber | The pouch close, front on
    Close | "First order $29.99 with text sign-up. Start your first
        pack." | $29.99 first order with text sign-up. Renews at
        $49.99 every 4 weeks. Start your first pack | Pouch and an
        empty pack on the counter, still

    Inferred: the soft tap and the way the bears settle (not in the
    facts). The tear is shown already done, along the top, the only
    way the brand allows.
    MISSING: what a single daily pack looks like (colour, printing),
    needed before the opening can be filmed or made.

tweaks:
  - what: What's in focus
    how: For people who know the problem but not you, ask to put the thing your product replaces in focus (a tub and shaker) instead of the product.
  - what: Video or still
    how: Ask for a still. It freezes the instant just before the motion finishes and adds one line of six words or fewer.
  - what: The overlay
    how: Give the buyer's own words for the moment. It uses the first words of their thought. Without them it uses "Wait for it".
  - what: Length
    how: 15 seconds gives the opening plus two or three lines. 30 seconds gives five or six, with start, action and end in separate shots.

judge:
  - The opening describes one motion, already under way, with a visible finish.
  - Nobody speaks in the first five seconds and there's no cut.
  - The overlay is four words or fewer and says nothing about price or results.
  - The fact said is one of your approved claims, said once.
  - The product opens exactly where it opens in real life.

test:
  - Check the motion against how your product is opened and used. For Sprout, the pack should tear straight across the top, nowhere else.
  - Run it on a product where using it is nothing to look at. It should tell you the format doesn't fit.
  - Read the opening on its own. One motion, already under way, no speech, no cut, and an overlay of four words or fewer.
  - Run it twice. If both runs pick the same motion, ask for a different one and film both to see which holds attention.

improve:
  - Write your product's real motions into "What you need" in the skill file (how it opens, pours or clicks), so step 3 never has to mark one inferred.
  - Add your never-show rules to step 4 ("Keep it real"), for example where the pack opens and where it never does.
  - Paste your approved claims into "What you need", so the one fact the demonstration says is always one you can back.
  - Pair it with the skill that makes wordless satisfying openings for video ads, to test more openings in front of the same demonstration.

terms:
  - term: Overlay
    meaning: Short text on screen over the video, added in editing.
  - term: Opening
    meaning: The first few seconds of an ad, the part that makes someone stop scrolling.
  - term: Buyer stage
    meaning: How much the buyer already knows about the problem and about you.
