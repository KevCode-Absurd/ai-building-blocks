new_slug: get-wordless-openings-people-watch-to-end
name: "Wordless openings people watch to the end"
summary: "Give it your product photos and ad. You get two or three four-second openings and the prompts to make them."
job: make-video-ads

headline: "Wordless openings people watch to the end"
subhead: Give it your product photos, how it really moves and the ad it goes in front of. It picks 2 or 3 motions with a clear finish (a fill, a click, a peel, a clean wipe, a sort), then writes a start frame, an end frame and a video prompt for each, with no words and no talking.

explain: |
  The first seconds of an ad decide whether anyone sees the rest. A motion with a finish holds the eye: a glass filling to its line, a seal peeling off in one piece, a lid clicking shut. People wait for the end. A product slowly turning on a stand doesn't do this, because nothing finishes.

  This skill picks motions from the way your product really opens, pours or closes, never one made up, and gives each opening a different finish. Each one starts with the motion already under way, lands its finish in the last third, and holds still for the final half second. You approve a line-up first. Then it writes two stills per opening: a start frame and an end frame that matches the first frame of your ad, so the join doesn't jump. Tools that take a first and last frame make the motion in between. It writes "real speed" once, avoids words that make tools play back slowly, and names the sound.

when:
  - Your ad holds people once they're in, but too many scroll past the first second.
  - Your product has a satisfying moment (a pour, a scoop, a click, a peel) that you've never shown up front.
  - You want to test new openings on an ad you already run, without filming a new ad.

you_give:
  - Your product photos by what they show (pack front, out of the pack, in hand, close-up of the surface)
  - How it opens, pours or is used, its real motions and sounds, and what it's made of
  - The ad it goes in front of (a still of its first frame, its first line, place and light)
  - Your brand's places, light, on-screen text style and what never to show (optional)
  - Your tool's shortest clip, and whether it takes a start and end frame (optional)
you_get:
  - A line-up of 2 or 3 openings, each with a different finish and a reason someone would wait
  - A start frame and an end frame prompt for each opening you approve
  - A video prompt for each, with timing, material behavior and sound lines
  - A suggested overlay of 1 to 4 words (or none) and a delivery list

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Attach your product photos and describe exactly how it opens and is used, in your brand's words.
  - Attach a still of the first frame of the ad it goes in front of.
  - Approve one row of the line-up before anything is made.
  - Make the two stills, then one clip, check it, then the rest. Test each opening on the same ad as separate ads.

how_it_works:
  - title: Picks by finish
    text: Level, fit, release, smooth or order, taken from how your product really moves. A motion nobody described is marked inferred.
  - title: Shapes it in thirds
    text: The motion is already part done in frame 1, the finish lands in the last third, and the final half second holds still.
  - title: Matches your ad
    text: Takes the light, distance and focus from your ad's first frame, and makes the end frame sit next to it without a jump.
  - title: Keeps real speed
    text: Writes "real speed" once, never slow motion or time-lapse, uses plain verbs and says how the material behaves.
  - title: Makes two stills each
    text: A start frame with the motion under way and an end frame with the finish done, so a tool that takes both makes the motion between.
  - title: Checks one clip first
    text: Frame 1 moving, the finish late, nothing new after it, a still last half second, and only the motion's own sound.

output_shape: |
  LINE-UP (approve one row before anything is made)
  <n> Focus: <..>  Finish: <kind>: <motion>. Done = <..>
    Place: <the ad's place and light>. Camera: <..>
    Sound: <..>  Last frame: <..>
    Why they'd wait: <one sentence>
  Inferred: <motions to confirm>

  START FRAME (row <n>)  Attach: <photo = job>. <motion part done>
  END FRAME (row <n>)  <finished, still, matching the ad's first frame>

  VIDEO PROMPT (row <n>)
  <aspect>, <seconds>, real speed. Camera: <..>. Start: <..>
  <timed motion>, <finish>, <hold>. <material behavior>.
  SFX: <..>  Ambient noise: <..>  No words, no one speaking.

  OVERLAY  <1 to 4 words, or none>
  DELIVER  <raw clip, clip with overlay, end frame, one line>
  MISSING: <facts it needed and didn't get>

example:
  business: sprout
  input: |
    [the skill]

    Product: Sprout greens gummies. Photos attached: pouch front, one
    daily pack, gummies in a palm, close-up of the gummies. Pouch:
    glossy deep green foil, big yellow wordmark. Gummies: small opaque
    deep-green bears, soft matte.
    How it's used: tear one daily pack, tip the small handful of
    gummies into your hand, eat. No water, no shaker.
    Brand handling notes: "The daily pack is torn straight across its
    top edge. Never the side, bottom or a corner." "Gummies pour out
    of the torn top into a palm or bowl." "The big pouch opens only at
    its resealable top. It is never shown torn."
    Real motions and sounds: not written down yet.
    Ad it goes before: "Powder tub". First frame (still attached): a
    man at a kitchen counter, morning window light from the left,
    holding a half-used powder tub.
    Brand look: bright, sunny, real homes; never clinical.
    Tool: 4-second clips, takes a start and an end frame.
  output: |
    LINE-UP (approve one row before anything is made)
    1 Focus: the gummies, out of the pack
      Finish: level: gummies pour from the torn top of a daily pack
      into an open palm. Done = the last gummy lands, the pack empty.
      Place: the kitchen counter from the ad, morning window light
      from the left. Camera: overhead, locked.
      Sound: a soft patter into the palm, a faint foil crinkle.
      Last frame: a palm of green bears, the empty pack above it, the
      pouch at the edge, label up.
      Why they'd wait: a tipped pack wants its last gummy to drop.
    2 Focus: the daily pack
      Finish: release: the pack torn straight across its top edge in
      one pull. Done = the strip comes away whole.
      Camera: locked, close, at counter height. Sound: the foil tear.
      Last frame: the torn pack held still, top open, gummies visible.
      Why they'd wait: a tear half done wants finishing.
    3 Focus: the pouch
      Finish: fit: a thumb runs along the resealable top until it's
      sealed end to end. Done = closed the full length.
      Camera: slow push in that stops as the seal closes.
      Sound: the seal's own sound. Last frame: the closed pouch, label
      to the lens.
      Why they'd wait: an open seal wants closing.
    Inferred: all three motions come from "tear, tip, eat" and the
    handling notes. Confirm how the resealable top closes before
    making row 3.

    START FRAME (row 1)
    Attach: daily pack photo = the pack; gummies close-up = the
    gummies; pouch-front photo = the pouch. Overhead on a kitchen
    counter, morning window light from the left. A daily pack torn
    straight across its top edge, already tipped over an open adult
    palm, the first gummies falling; the pouch at the top edge, label
    clear. Top seventh and bottom third of the frame kept plain.

    END FRAME (row 1)
    Same counter, light and angle. The palm holds a small heap of
    green gummy bears, still; the empty pack above it; the pouch at
    the top edge, label up. Light and colour match the ad's first
    frame.

    VIDEO PROMPT (row 1)
    9:16, 4 seconds, real speed. Camera: overhead, locked. The daily
    pack is torn straight across its top edge. Never the side, bottom
    or a corner. Gummies pour out of the torn top into a palm. Start:
    the pack already tipped, the first gummies falling. 0 to 2.5 s:
    small green gummy bears tumble from the torn top into the palm and
    stop. 2.5 to 3.5 s: the last gummy drops; the pack is empty. 3.5 to
    4 s: nothing moves. Small soft solids tumble and stop.
    SFX: a soft patter, a faint foil crinkle. Ambient noise: a quiet
    kitchen in the morning. No music. No words, no one speaking.

    OVERLAY  Suggest none, or "Wait for it" just below the top safe
    margin. Never an offer or claim. Your call.
    DELIVER  each opening as the raw clip, the clip with overlay, its
    end frame as a picture, and one line on what it shows.
    MISSING: how many gummies are in one adult pack, so the prompt
    gives no count. MISSING: Sprout's real motions and sounds, written
    down.

tweaks:
  - what: The finish
    how: Choose level (a pour that settles), fit (a click, a cap on its thread), release (a seal off in one piece), smooth (a clean wipe) or order (a sort, old things swept aside).
  - what: What's in focus
    how: The product out of its pack, something it's made of, or the old things it replaces. A sealed pack turning on a stand is a pack shot, not an opening.
  - what: The camera
    how: Locked by default. Overhead suits fills, sorts and spreads. A slow push in must stop when the motion ends.
  - what: Clip length
    how: 4 seconds suits most motions; ask for 6 if the motion needs it. The finish is kept in doubt until late either way.

judge:
  - The first frame already shows the motion part done, at thumbnail size.
  - The finish lands in the last third, and nothing new happens after it.
  - The last frame is still, with the product in view and the label clear.
  - The end frame sits next to your ad's first frame without a jump in place or light.
  - The prompt says "real speed" once, with no slow-motion, time-lapse or "explode" style words.
  - No words in the picture and nobody talking.

test:
  - Give it a product with no out-of-pack photo. It should refuse any opening that shows the product out of its pack and say MISSING, not guess what's inside.
  - Search each video prompt for "slow", "time-lapse", "explode" or a frame rate. Any of these changes how the tool plays it back.
  - Make one clip and scrub to the last half second. Nothing should move; if it does, end the motion earlier in the prompt and remake it.
  - Put the end frame next to your ad's first frame. If the place or light jumps, change the opening's place before making the batch.

improve:
  - Write your product's real motions and sounds into the "Product" line of the skill file once (how it opens, pours, seals), so every opening starts from them.
  - Copy your brand's handling rules there word for word, so every clip prompt carries them.
  - Keep a still of the first frame of each ad you run, so openings always land where your ads begin.
  - Save which finish won to your brand file, and test a new focus with the same finish next time.
  - For a talking opening instead, pair it with the skill that makes talking openings.

works_best_with:
  tools:
    - {name: "Veo 3.1", why: "Makes the motion between a start frame and an end frame you give it, with matching sound."}
    - {name: "Kling 4.0", why: "Follows the motion from a start frame closely, which helps when testing several openings."}
    - {name: "Nano Banana Pro", why: "Makes the start and end frames from your product photos with real-looking light."}
  inputs:
    - "A still of your ad's first frame, so the end frame can match its place and light exactly"
    - "A phone clip of the product being opened or poured, so the motion and its timing come from real life"
    - "The number of pieces in one serving, so counts in the prompt are right"

terms:
  - term: Opening (hook)
    meaning: The first few seconds of an ad, whose only job is to keep the right person watching.
  - term: Start and end frame
    meaning: Two approved stills. Some video tools make the motion between them, which keeps the finish where you want it.
  - term: Real speed
    meaning: The motion plays at normal speed. Words like "slow pour" make video tools play it back slowly.
