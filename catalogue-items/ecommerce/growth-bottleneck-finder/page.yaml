new_slug: growth-bottleneck-finder
name: Growth bottleneck finder
summary: Find what is holding back your store's growth. Give it your ad and funnel numbers. You get a ranked work order and the next test to run.
job: plan-strategy
thinking: high
thinking_why: It has to weigh several layers against each other and pick one limit, and a wrong pick sends weeks of work the wrong way.
headline: Growth bottleneck finder
subhead: It reviews data quality, funnel steps, creative, account structure and cash. Get the leading supported growth hypothesis, its evidence and a test date. If the data cannot distinguish causes, the answer stays unresolved. Planned gains are supported estimates or labelled scenarios. The custom score shows checked coverage and cannot prove a cause.
explain: |
  A store can stay flat for several reasons. A weak rate is a sign to investigate; it does not by itself prove what caused the problem.

  This skill checks the data first, then compares the funnel, creative, account structure, outside events and cash. It names a leading hypothesis only where the evidence supports one and keeps other explanations visible. It sizes proposed changes as supported estimates or clearly labelled scenarios. Missing effect evidence stays unresolved. The result is a review and test plan, not proof that one change will drive growth.
when:
  - Revenue or profit has been flat for months even though you keep making changes.
  - You have a list of ideas, such as new ad sets, new pages and budget moves, and cannot tell which matters.
  - You are not sure whether the problem is your ads, your site, your product or your cash.
not_for:
  - "Your main problem is cash, stock or shipping: use the Online store bottleneck finder."
  - "You want to know if your ad platform's ROAS is real: use the Ad return evidence checker, then the incrementality test planner for proof."
  - "You have no ad, funnel or margin numbers yet: collect 3 months of data first, or ask your analyst for an export."
you_give:
  - Monthly revenue, ad spend and gross margin
  - The metrics you use to decide, such as ROAS and conversion rate
  - CPM, click-through rate, CPC, conversion rate and order value for 3 to 6 months
  - Funnel drop-off by step, from product page to cart to checkout (optional)
  - Creative volume and ad age, and a summary of your account structure
  - Levers outside ads, such as creators, retail, PR and email (optional)
  - Cash and stock position (optional)
you_get:
  - A leading supported hypothesis or an unresolved result, with evidence and alternatives
  - An order of work and supported estimates or labelled scenarios for planned changes
  - A next data check or test with a review date
  - A custom checklist score with checked coverage and missing layers
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste 3 to 6 months of CPM, click-through rate, CPC, conversion rate, order value and CAC. Add your margin and your list of planned changes.
  - Say what outside the ad account might have moved sales, such as a creator deal or a press hit.
  - Read the evidence, alternative causes and missing checks before choosing a test. A score alone cannot establish the bottleneck.
  - Run it again on the re-test date with new numbers.
output_sample:
  input:
    - Monthly revenue, ad spend and gross margin
    - 3 to 6 months of CPM, click-through rate, CPC, conversion rate, order value and CAC
    - Creative volume, ad age and account structure
    - Your planned changes (optional)
    - Cash and stock position (optional)
  output:
    - name: BOTTLENECK
      contains: The leading supported idea, or UNRESOLVED, with the numbers that back it and a re-test date.
    - name: LAYER CHECK
      contains: A pass, part or fail for data, funnel, creative, account structure, and cash, with a reason for each.
    - name: CUSTOM RUBRIC
      contains: A score out of 100, how many layers were checked, and which layers are unknown.
    - name: ORDER OF WORK
      contains: "The order to fix things in: data first, then funnel or creative, then structure."
    - name: CHANGES YOU PLANNED
      contains: Each planned change with a supported estimate, a labelled scenario or an unresolved impact.
    - name: IGNORE THIS QUARTER
      contains: A short list of things not worth your time right now.
    - name: CHECKS MISSED / MISSING
      contains: The checks that failed and the numbers you did not give.
how_it_works:
  - title: Checks the data first
    text: Do your metrics match profit? If the numbers you decide on are wrong, nothing else is worth tuning.
  - title: Runs the treadmill check
    text: If you keep improving a metric while profit and revenue stay flat, it suspects the metric before the tactic.
  - title: Reads the funnel left to right
    text: Splits CAC into click cost and conversion rate, checks revenue per 100 visitors, and finds the step where people drop off.
  - title: Checks creative, then structure
    text: Creative volume, variety and spend per ad come before account structure.
  - title: Looks outside the ad account
    text: Creators, retail, PR and events can lift sales and confuse your ad numbers.
  - title: Checks cash
    text: If stock is tied up, an ad fix cannot be funded. It hands off to the cash side.
  - title: Sizes each change
    text: Shows supported effect estimates or labelled scenarios; missing effect evidence stays unresolved.
  - title: Names the next check
    text: Reports a leading supported hypothesis or an unresolved result, then sets the test metric and review date.
output_shape: |
  GROWTH HYPOTHESIS
  <leading supported idea or UNRESOLVED>
  Evidence <records> | Other causes <list> | Missing evidence <list>

  LAYER REVIEW
  <data, funnel, creative, structure, cash: checked finding or not checked>
  Revenue per 100 visitors = 100 × conversion-rate fraction × order value
  CAC = CPC / positive matched conversion-rate fraction, or undefined

  CUSTOM RUBRIC
  <points>/100 | checked layers <n>/5 | unknown layers <list>
  Points do not prove the cause or predict growth.

  PLANNED CHANGES
  <change> | supported estimate, labelled scenario or unresolved impact | evidence/assumptions

  NEXT CHECK
  <test/data step> | metric <units and basis> | review <date>
  MISSING / CHECKS MISSED
  <list>
tweaks:
  - what: Your size
    how: Give monthly revenue and ad spend. The impact check scales to it, since a budget move that matters at a small store is noise at a large one.
  - what: How far back your numbers go
    how: Give 3 to 6 months of rates. One bad week points at the wrong limit.
  - what: Your planned changes
    how: List each idea with what you expect it to do. The skill sizes each one against the gap it needs to close.
  - what: Outside-ad events
    how: Add dates for creator posts, press, retail launches and email pushes so they are not credited to ads.
judge:
  - A supported hypothesis or unresolved result appears with evidence and other possible causes.
  - The next check has a metric, counting basis and review date; proposed targets are labelled assumptions.
  - The order is data first, then funnel and creative, then structure.
  - Each effect is a supported estimate, labelled scenario or unresolved amount; none is invented as a real gain.
  - If cash is the answer, it hands off instead of rebuilding the cash diagnosis.
test:
  - Give flat profit and strong reported ROAS but no reconciliation. It should request the missing evidence, not declare a proved data cause.
  - Check the CAC split by hand. CPC divided by conversion rate should match the CAC it shows.
  - "Use conversion-rate fraction 0.03, order value 100, CPC 3: revenue per 100 visitors 300 and ad cost 300; product costs still prevent calling this profit break-even."
  - Give planned changes with no effect evidence or too few events. Keep impact and cause unresolved instead of forcing a winner.
improve:
  - Add your own scale gate to the skill file if your CPC is far from $1 to $3, using revenue per 100 visitors against your ad cost per 100 visitors.
  - Add the metrics you actually trust, such as new-customer MER, so the data check has your own bar.
  - Save your last bottleneck and re-test date in your brand file so each run starts with what you decided.
  - Add a list of outside levers you run each quarter, so they are not credited to ads.
  - Pair it with the online store bottleneck finder for cash, the platform ROAS reality check for data and the incrementality test planner for proof.
works_best_with:
  tools:
    - name: Any good chat AI
      why: It does the splitting and the comparison. Paste your numbers as a table.
    - name: Google Analytics 4
      why: Free. Shows funnel drop-off by step, so the skill can find where visitors leave.
    - name: Shopify
      why: Paid subscription. Order and margin data to check your ad numbers against real profit.
  inputs:
    - An export of last quarter's orders with product cost, so margin is real
    - A screenshot of your checkout funnel report
    - A list of changes made in the last 90 days, with dates
terms:
  - term: Bottleneck
    meaning: A step that limits a result. A suspected bottleneck needs evidence and a test before it is treated as the cause.
  - term: Scale gate
    meaning: An illustrative funnel comparison. Revenue per 100 visitors is 100 times conversion-rate fraction times order value. Compare matching traffic and the stated cost basis; 300 is not a universal pass mark.
  - term: MER
    meaning: Total revenue divided by total marketing spend across all channels.
  - term: CPM
    meaning: What you pay per 1, 000 ad views.
next: [online-store-bottleneck-finder, platform-roas-reality-check]
