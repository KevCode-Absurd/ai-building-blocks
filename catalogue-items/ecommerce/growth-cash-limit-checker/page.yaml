new_slug: growth-cash-limit-checker
name: Growth cash limit checker
summary: Check if cash will cap your growth. Give stock, supplier terms and your plan. Get a cash cycle, stock grades and a funding gap check.
job: plan-supply-chain
thinking: high
thinking_why: It joins stock, terms, debt and ad numbers into one cash picture, and a small slip changes the verdict. A stronger model keeps the sums consistent.
headline: Growth cash limit checker
subhead: It reviews dated stock movements, supplier terms, cash, debt and planned growth. Get a cash-cycle sum, supported stock grades and a funding-gap review. A stock balance alone cannot turn profit into cash. Missing figures leave affected choices unresolved. The custom planning score shows assumptions and coverage; it does not prove the plan is safe.
explain: |
  Profit and cash differ, but closing unsold stock alone cannot explain the gap. You need dated cash receipts, payments and working-capital movements. Growth funding also depends on margins, stock turns, collection timing and supplier terms.

  This skill builds the supported cash view, checks stock cover against lead time and compares a growth plan with available funding. It uses stated custom grade rules for stock and proposes ways to review slow items. Missing definitions or cash movements remain unresolved. Its planning points do not predict cash availability, prove safety or authorise borrowing.
when:
  - You plan to grow fast and want to know if cash will run out first.
  - Your profit looks good but your bank balance does not.
  - You have slow stock and want a plan to turn it into cash.
not_for:
  - "You have no stock or supplier data: ask your accountant or finance owner for it first, then come back."
  - "You need a formal cash forecast or a loan decision: ask your accountant or lender, as this is a planning check only."
  - "You want advice on one particular loan or lender: ask your accountant, as this tool does not judge lenders."
you_give:
  - Stock by product, with days on hand
  - Supplier lead times and payment terms
  - Debt and the interest you pay
  - Planned spend and growth for the next 12 months
  - Your net margin and ad return today (optional)
you_get:
  - A supported cash bridge and cash-cycle sum, with missing movements shown
  - Custom stock grades where definitions and records support them
  - A funding-gap review or an unresolved verdict
  - Custom planning points with applicable components, assumptions and coverage
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Ask your finance owner or accountant for stock, terms and debt, and paste them in.
  - Add your growth plan and your current net margin.
  - Read the grades and the verdict. Tell your ad team the goal if slow stock needs to move.
  - Rerun it each month, or when terms, stock or the plan change.
output_sample:
  input:
    - Your stock by product, with value and days on hand
    - Your supplier lead times and payment terms
    - Your debt and the interest you pay (optional)
    - Your planned spend and growth for the next 12 months
    - Your net margin and ad return today (optional)
  output:
    - name: Profit vs cash
      contains: Your profit, stock values and a dated cash bridge, or a note that the cash effect is unresolved.
    - name: Cash conversion cycle
      contains: Days of stock plus days sales outstanding minus days payable, with each part and the total.
    - name: Stock grades
      contains: Each product with a custom A to D grade, days on hand, value and a plan, plus the share in C and D.
    - name: Stockout test
      contains: Lead time, upfront payment share and cover at reorder, with the stockout days per reorder and possible fixes.
    - name: Growth test
      contains: Stock the plan needs, cash and terms that cover it, the gap, and what interest does to net margin.
    - name: Verdict
      contains: Cash-limited, ad-limited, neither or both, based on the numbers shown.
    - name: Slow stock plan
      contains: How to sell slow stock with paid media, such as a separate funnel, whitelisted pages or a new country.
    - name: Brief for your ad team
      contains: The goal for your ad team in one line.
    - name: Custom planning rubric
      contains: A score with cash cover, stockout, slow stock and debt parts, plus checked coverage and missing items.
how_it_works:
  - title: Separates profit from cash
    text: Uses dated receipts, payments and working-capital changes; closing stock alone is not a cash-flow adjustment.
  - title: Measures the cycle
    text: Days of inventory plus days sales outstanding minus days payable outstanding.
  - title: Tests stockouts
    text: Uses max(0, lead time minus stock-cover days) only under a stated same-basis cover assumption; actual uncertainty remains visible.
  - title: Tests the plan
    text: Checks whether your cash and loans cover the stock your growth needs, and what interest does to margin.
  - title: Grades stock
    text: Uses the owner’s stated grade definitions and data. A–D is this method’s custom scheme, not an automatic Shopify grade.
  - title: Plans slow stock
    text: A separate funnel at break-even or a small loss, whitelisted pages, even a new country at a deep discount.
  - title: Briefs the ad team
    text: Tells them the goal, so they do not chase profit alone, and checks whether a higher ad efficiency target is needed for a while.
  - title: Scores it
    text: Shows defined custom components, applicable maximum and unknowns. Partial data cannot clear the plan.
output_shape: |
  PROFIT VS CASH  profit <$>, opening/closing stock <$>, dated cash bridge <supported figures or UNRESOLVED>
  CASH CONVERSION CYCLE  <days of stock> + <days sales outstanding> - <days payable> = <days>

  STOCK GRADES
  <product> | grade <A/B/C/D> (custom scheme) | days on hand <n> | value <$> | plan
  Share of stock value in C and D: <%>

  STOCKOUT TEST
  Lead time <days>, paid up front <%>, cover held when you reorder <days> -> stockout risk <days per reorder>
  Fixes: <lower upfront share | shorter lead time | other, with its cost and risk>

  GROWTH TEST
  Plan needs <$> more stock; cash and terms cover <$>; gap <$>
  Interest and ad return: net margin <%> now -> <%> at plan
  VERDICT  <cash-limited | ad-limited | neither | both | UNRESOLVED>

  SLOW STOCK PLAN  <funnel, break-even target, pages, country if any, platform policy check>
  BRIEF FOR YOUR AD TEAM  <goal in one line>

  CUSTOM PLANNING RUBRIC  <earned/applicable maximum or UNRESOLVED>; checked coverage <basis>
  Components: cash cover <value/N/A/unknown>, stockout <...>, slow stock <...>, debt and margin <...>
  This score does not prove safety, predict cash availability or authorise borrowing.
  CHECKS MISSED: <none | checks that failed or could not run>
  MISSING: <what you did not give>
tweaks:
  - what: Stock by product
    how: List every product with days on hand and value. The grades and the slow-stock share depend on it.
  - what: Lead time and payment terms
    how: Give the real days to your shelf and the share paid up front. These drive the stockout test.
  - what: Debt and interest
    how: Include every loan, advance and factoring cost. The growth test needs the full cost.
  - what: The growth plan
    how: Give the growth rate you want and the ad spend that goes with it, so the plan can be tested.
judge:
  - The cash conversion cycle shows its three parts and the sum.
  - Each custom grade and slow-stock share has a defined data basis or stays unresolved.
  - Any funding verdict follows from supported cash and cost data; missing material inputs leave it unresolved.
  - Defined components add to the applicable subtotal; zero denominators and missing inputs are marked, not forced into 100 points.
  - Loan cost claims are labelled as the speaker's view.
test:
  - Use the same profit and closing stock but different cash-funded stock movements. Closing stock alone must not produce one cash-flow answer.
  - "Use lead time 30 and cover 45: implied stockout gap 0, not minus 15. Zero lead time makes the ratio not applicable."
  - Ask your accountant to check the cycle sum with your books.
  - Leave stock funding, cash or grade definitions missing. Do not clear the plan or show a complete score.
improve:
  - Add your own grade lines (for example, A is more than 6 turns a year) so grades match your category.
  - Add your accountant's rule for the cash you must keep.
  - Add your safe level for interest cost against margin.
  - Pair it with the supplier terms and float planner for ways to improve the cycle.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Any chat AI can run the cycle and grade your products from a pasted table.
    - name: Shopify
      why: Shows stock by product and sell-through, which is the base for the grades.
    - name: An accountant
      why: Checks the sums and the cost of your debt.
  inputs:
    - A stock report with value and days on hand by product
    - Supplier invoices with terms
    - Your loan and advance statements
    - Your forecast for the next 12 months
terms:
  - term: Cash conversion cycle
    meaning: The days between paying for stock and getting the cash back from selling it, after the days you take to pay suppliers.
  - term: Inventory grades
    meaning: An owner-defined grouping by stated stock and sales measures. This method’s A–D labels need explicit thresholds and a reporting period.
  - term: MER
    meaning: Marketing efficiency ratio, which is total revenue divided by total ad spend.
  - term: Whitelisted page
    meaning: A creator's or partner's account that runs your ads under their name.
