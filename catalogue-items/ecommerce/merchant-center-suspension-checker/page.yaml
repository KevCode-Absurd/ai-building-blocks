new_slug: merchant-center-suspension-checker
name: "Merchant Center suspension checker"
summary: "Check your Merchant Center and store for suspension risks. Get every gap ranked high, medium or low, plus a score out of 100."
job: run-google-ads
thinking: medium
thinking_why: "It checks many items across your store and Merchant Center and has to rank them by risk."

headline: "Merchant Center suspension checker"
subhead: Give it screenshots of your Merchant Center settings, your store link and your real shipping and return terms. It checks eight areas, from checkout to contact details. You get a pass or fail for each, a fix list ranked by risk, a schedule and a score out of 100.

explain: |
  A Merchant Center suspension stops your Shopping ads. It also stops the product feed part of Performance Max. Google does not tell you the exact reason. Most suspensions trace back to a mismatch. The price on your page is not the price in the feed. Shipping or returns say one thing in Merchant Center and another on your site. A payment method fails at checkout. Claims are bigger than you can prove.

  This Merchant Center suspension checker goes through your setup and your store, area by area. It ranks every gap by risk, so you fix the dangerous ones first. It is a best-practice check, not a promise. Google's own policies decide, so read the reason on any warning Google sends.

  It scores only what you showed it and lists the rest as not run, so a high score never hides a gap. It never suggests a new account, a new domain or any way round a suspension. If Google suspends you, you fix the named issue and use Google's own review process.

when:
  - You are setting up Merchant Center for the first time and want to avoid the common mistakes.
  - Google sent a mismatch warning, or products show "needs attention".
  - You plan to raise Shopping ad spend and want to remove the avoidable risks first.
  - You changed shipping, returns or prices in Shopify and want to check Merchant Center still matches.

not_for:
  - "You need to fix disapproved products and feed errors: use the Google Merchant Center feed checker."
  - "Google has already suspended you and you want the exact cause: this can't tell you. Read the reason in Merchant Center, fix that issue, then use Google's review process."
  - "You have no Merchant Center account or store site yet: set those up first, then run this."
  - "You want to plan your Shopping campaigns: use the Google Ads launch planner."

you_give:
  - Screenshots of Merchant Center business info, shipping and returns, and the Products needs attention page
  - Your store link and links to your return, shipping, terms and privacy pages
  - The shipping and return terms you really offer (optional)
  - What you sell and the claims you make about it (optional)
you_get:
  - A pass or fail for each of 8 areas, from payment and checkout to the site itself
  - A fix list ranked high, medium and low by suspension risk
  - A weekly, monthly and one-off check schedule
  - A score out of 100 with the sum shown
  - A list of checks it could not run and what each needs

how_to_use:
  - Open the skill in your AI. Claude, ChatGPT and Gemini all work. Add it to your AI, or copy it and paste it into a new chat.
  - Attach screenshots of Merchant Center business info, shipping and returns, and Products needs attention. Attach the real pages, not a description.
  - Paste your store link, your policy page links, and the shipping and return terms you really offer.
  - Read the fix list. Fix every High item before you raise ad spend, then run it again on fresh screenshots.
  - Put the schedule in your calendar. Check any warning against Google's own policy page.

how_it_works:
  - title: Checks setup
    text: Programmes, business info, claimed store, logos and colours, and for the US the small business attribute.
  - title: Checks shipping and returns
    text: On Shopify, shipping set to manual in the Google and YouTube app (other platforms use their own feed settings), a rate for every country, a ship-from location and a return policy linked to the real page.
  - title: Checks product data
    text: The main feed, any extra feeds, and everything under Products needs attention.
  - title: Checks checkout
    text: HTTPS, every payment method working, the final price shown before payment and discount codes that apply.
  - title: Checks claims and proof
    text: Factual claims only, real reviews and stock status that matches the page.
  - title: Checks business details
    text: Terms and privacy in the footer, matching address and phone, a branded email and a fast site.
  - title: Checks price match
    text: The price on the page, at checkout and in the feed should be the same. You edit price in Shopify only.
  - title: Ranks and scores
    text: Marks each gap high, medium or low, takes points off, and sets a schedule to repeat the check.

output_shape: |
  AREA RESULTS
  payment and checkout: <pass | fail | not run>  <gaps>
  product listings:     <pass | fail | not run>  <gaps>
  branding:             <pass | fail | not run>  <gaps>
  shipping:             <pass | fail | not run>  <gaps>
  returns:              <pass | fail | not run>  <gaps>
  legal:                <pass | fail | not run>  <gaps>
  contact:              <pass | fail | not run>  <gaps>
  site:                 <pass | fail | not run>  <gaps>

  FIX LIST (by risk)
  HIGH   <gap | where | fix>
  MEDIUM <gap | where | fix>
  LOW    <gap | where | fix>

  SCHEDULE  weekly: <...>  monthly: <...>  on each promotion: <...>  once: <...>
  SCORE  <n>/100 (100 - 20 x <High> - 10 x <Medium> - 5 x <Low> = <n>), on the checks run
  NOT RUN  <check | what is needed>
  MISSING: <what would sharpen it>
  NOTE  Google does not name the exact reason for a suspension. This is a best-practice check, not a guarantee.

output_sample:
  input:
    - "Screenshots of Merchant Center business info, shipping and returns, and Products needs attention"
    - "Your store link"
    - "Links to your return, shipping, terms and privacy pages"
    - "The shipping and return terms you really offer (optional)"
  prerequisites:
    - "A Merchant Center account for the settings checks"
    - "A live store site"
  output:
    - {name: "Area results", contains: "Pass, fail or not run for payment and checkout, product listings, branding, shipping, returns, legal, contact and site."}
    - {name: "Fix list", contains: "Every gap marked high, medium or low, with where it is and how to fix it."}
    - {name: "Schedule", contains: "What to check weekly, monthly, on each promotion and once."}
    - {name: "Score", contains: "A score out of 100 with the sum shown, counted on the checks that ran."}
    - {name: "Not run and missing", contains: "Each check it could not do, and what screenshot or link would let it run."}
    - {name: "Note", contains: "A closing line that Google decides suspensions and does not name the exact reason."}

tweaks:
  - what: Product type
    how: Say if you sell health, supplement or other claim-heavy products. Claims are the highest risk there, so the skill reads them closely.
  - what: Country
    how: Name the countries you ship to. Shipping and returns must exist for each one.
  - what: Screenshots
    how: Attach the real pages, not a description. A check that needs a screenshot is listed as not run without one.
  - what: Store age
    how: Say if the store is new or thin, with a default theme or copied reviews. That is a high risk whatever the checklist says.
  - what: Promotions
    how: List current promotions with dates, so end dates and site terms can be matched.

judge:
  - Every area has a pass or fail, and every fail has a fix.
  - Fixes are ranked high, medium and low by suspension risk.
  - It states that Google does not name the exact reason for a suspension.
  - It never suggests creating a new account or site to get around a suspension.
  - Price, shipping and return mismatches are ranked high.
  - The score shows its sum and what it counted.

test:
  - Show it a Merchant Center where the price in the feed differs from the page. It should rank this high.
  - Remove your return policy link from the input. It should fail returns.
  - Run it twice on the same screenshots. The fix list should match.
  - Compare one of its high-risk items with Google's own Merchant Center warning, if there is one.
  - After you fix the high items, run it again and see if the score rises.

improve:
  - Add the exact shipping and return terms you offer to your org context, so the check matches them.
  - Add a list of claims you may and may not make for your products, so claim checks use it.
  - Add your own schedule if you review weekly on a set day.
  - Add Google's current policy pages to the skill file with the date you read them.
  - Pair it with the Merchant Center feed health checker, which covers product data, and the Google ratings and store badge planner.

works_best_with:
  tools:
    - {name: "Google Merchant Center", why: "Shows diagnostics, business info, shipping and returns, and the store quality scorecard."}
    - {name: "Shopify", why: "Where price, availability and shipping come from. Edit them here, not in Merchant Center."}
    - {name: "Any good chat AI", why: "Reads your screenshots and ranks the gaps. No code or paid tool needed."}
  inputs:
    - "Screenshots of Merchant Center diagnostics"
    - "Your return and shipping policy pages"
    - "Your current promotions with start and end dates"

terms:
  - term: Merchant Center
    meaning: Google's tool where you upload your product feed so your products can show in Shopping.
  - term: Feed
    meaning: The list of your products and their details that you send to Google.
  - term: Supplemental feed
    meaning: An extra feed that adds or changes details of products in your main feed.
  - term: Suspension
    meaning: Google switches off your Merchant Center account, so your Shopping ads stop.
next: [merchant-center-feed-health-checker]
