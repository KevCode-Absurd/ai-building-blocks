new_slug: organic-search-report-builder
name: "Organic search report builder"
summary: "Turn Search Console and GA4 numbers into a search report. See non-branded clicks against last period, organic purchases and a score out of 100."
job: get-found-in-search
thinking: low
thinking_why: "It compares two sets of numbers you paste in, so a quick model is enough."

headline: "Organic search report builder"
subhead: "Paste your Search Console numbers for the last three months and the three before, plus your brand terms. It sets aside searches that use your brand name and compares clicks, impressions, click rate and position. If you add GA4 numbers, it adds your organic add-to-cart, checkout and purchase trend. You get a score out of 100 with its weights shown, and one thing to check next."

explain: |
  Total search clicks can look healthy while many of them come from people searching your own name. The number to watch for search growth is non-branded clicks. These are clicks from searches that do not include your brand. Search Console can show them, but only if you filter out your brand terms with a small pattern most owners never set up. This organic search report builder sets that up for you.

  It compares the last three months with the three before. It reads clicks, impressions, click rate and average position. It shows branded search as its own line, because a rise can be one sign that shoppers asked an AI assistant first and then searched for you. It is only a sign. Ads, press or email can lift it too.

  If you add GA4 numbers, it compares organic add to cart, begin checkout and purchase. It notes the site changes you made and when, then scores the result. The score is this skill's own measure, and its weights are a starting point you can change. A query split does not prove who is a new customer, and a fall does not prove its cause.

when:
  - You want one monthly or quarterly report that shows if search is growing, without the noise from your own brand name.
  - Your organic traffic moved and you want to know if clicks or sales moved with it.
  - You changed titles, pages or your theme and want to line up the dates with the numbers.
  - You pay an agency or freelancer for SEO and want a report you can check yourself.

not_for:
  - "Your clicks fell and you want to know which pages lost them. Use the Search Console traffic drop diagnoser."
  - "You want pages to push this month from queries that rank on page two. Use the Search Console quick-win finder."
  - "You want to know if SEO is worth doing for your store at all. Use the SEO worth-it checker."
  - "Your site is under three months old, or you have no Search Console set up. There is too little data for a trend."

you_give:
  - A Search Console export for the last 3 months and the 3 months before
  - Your brand terms and common misspellings
  - GA4 organic search numbers for add to cart, begin checkout and purchase, for both periods (optional)
  - A list of site changes with dates (optional)

you_get:
  - Non-branded clicks, impressions, click rate and position, with the change from the previous period
  - A branded search line, kept apart
  - Your organic funnel from GA4 against the previous period
  - A score out of 100 with the weights shown
  - The one thing to look at next

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. It needs no code and no login to your accounts.
  - In Search Console, set the range to the last 3 months, compare with the previous period, then export or copy the numbers.
  - Paste your brand terms and misspellings. Add the GA4 organic numbers if you have them.
  - List your site changes with dates, such as new pages or title edits.
  - Check the brand filter it shows. Apply the same filter in Search Console and see if the non-branded click total matches.
  - Act first on the one thing it says to look at next.

how_it_works:
  - title: Sets the range
    text: Search Console keeps 16 months. It uses the last 3 months against the 3 before.
  - title: Sets aside branded searches
    text: It filters out your brand terms and misspellings. What is left is reported as non-branded. This describes the words searched, not who the buyer is.
  - title: Reads four numbers
    text: Clicks, impressions, click rate and average position. Non-branded clicks come first.
  - title: Reports branded search
    text: It shows branded search as its own line. A rise is a possible sign of demand that started elsewhere, such as an AI chat. It is not proof.
  - title: Treats position as a trend
    text: It ignores small swings on searches with few impressions, because position is an average.
  - title: Adds the GA4 funnel
    text: It compares organic add to cart, begin checkout and purchase with the previous period. A fall at checkout becomes a question to investigate, not a diagnosis.
  - title: Lines up your changes
    text: It lists your logged changes and known Google updates next to the movement, as context only.
  - title: Scores the report
    text: Five parts with stated weights add up to 100. It names the one thing to check next.

output_shape: |
  PERIOD  <last 3 months> vs <previous 3 months>
  BRAND FILTER  <regex used> | check: <removed queries look right?>
  NON-BRANDED  clicks <n> (<change>) | impressions <n> (<change>) | CTR <x%> | avg position <x> (trend)
  BRANDED  clicks <n> (<change>) | note on possible AI-driven demand
  ORGANIC FUNNEL (GA4)  add to cart <change> | begin checkout <change> | purchase <n> vs <n>
  CHANGES LOGGED  <date: change> ... and known updates
  SCORE  <n>/100 or "not scored: <why>"  measures: how healthy the organic trend looks (weights are this skill's own)
    non-branded clicks <n>/30 | organic purchases <n>/25 | impressions <n>/15 | CTR and position <n>/15 | changes logged <n>/15
  LOOK AT NEXT  <one thing>
  NOT RUN  <check, why>
  MISSING: <anything not given>

output_sample:
  input:
    - Your Search Console export for the last 3 months and the 3 months before
    - Your brand terms and common misspellings
    - GA4 organic search numbers for both periods (optional)
    - Site changes with dates (optional)
  prerequisites:
    - Search Console set up for your store, with at least 3 months of data
  output:
    - name: Brand filter
      contains: The pattern used to set aside your brand searches, and a check that the removed queries look like your brand.
    - name: Non-branded line
      contains: Clicks, impressions, click rate and average position, each with the change from the previous period.
    - name: Branded line
      contains: Branded clicks and their change, with a note that a rise is a possible sign, not proof.
    - name: Organic funnel
      contains: GA4 add to cart, begin checkout and purchase against the previous period. Any fall is listed as a question to check.
    - name: Changes logged
      contains: Your dated site changes and known Google updates, shown as context for the movement.
    - name: Score
      contains: A score out of 100 in five parts, with each part's points and a line saying what it measures.
    - name: Look at next
      contains: The one thing to check first, taken from the weakest part. Missing items are listed as not run.

tweaks:
  - what: Your brand terms
    how: List every spelling, the store name, the domain and common typos. A missing term leaves branded clicks in the report.
  - what: The period
    how: Use three months on three months. A shorter range swings too much on a small store.
  - what: GA4 data
    how: Add the organic funnel. Without it the report can only score clicks and impressions.
  - what: Site change log
    how: List dates for new pages, theme or title edits and known Google updates, so movement can be tied to work.

judge:
  - The brand filter is shown, and the removed queries look like your brand.
  - Non-branded clicks come first, with the change from the previous period.
  - Position is described as a trend, with no claims from a tiny swing on few impressions.
  - The score says what it measures and shows each part's points.
  - A fall at checkout is not blamed on search.

test:
  - Check the non-branded click total by applying the same filter in Search Console yourself. The numbers should match.
  - Run the report on a period when you know something happened, such as a big launch. The report should show it.
  - Run it twice on the same numbers. The score should be the same.
  - Change one input, such as a missing brand misspelling, and see if the branded line grows.

improve:
  - Change the five weights in the skill file if your store lives on a different part, for example give purchases more.
  - Add your brand terms to the skill file so you never retype them.
  - Add a line for Bing and AI assistants, which Search Console doesn't cover.
  - Pair it with the Search Console traffic drop diagnoser when clicks fall, and the Search Console quick-win finder for pages to push.

works_best_with:
  tools:
    - {name: "Google Search Console", why: "The source of clicks, impressions, click rate and position. It keeps 16 months of data."}
    - {name: "GA4", why: "Gives the organic add to cart, begin checkout and purchase numbers for the same periods."}
  inputs:
    - "A site change log with dates"
    - "Your brand terms and common misspellings"
    - "Bing Webmaster numbers, since Search Console covers Google only"

terms:
  - term: Non-branded clicks
    meaning: Clicks from searches that don't include your brand name. They show how much search brings from people searching for what you sell.
  - term: Click rate (CTR)
    meaning: The share of people who saw your result and clicked it.
  - term: Average position
    meaning: Where your page showed in results on average across places and devices, so it's a trend more than an exact rank.
  - term: GA4
    meaning: Google Analytics 4. It counts what visitors do on your site, such as add to cart and purchase.
