new_slug: payments-and-checkout-settings-checker
name: Payments and checkout settings checker
summary: Share store settings and your country. Get checked findings, missing rules and fixes to review, with a custom checklist score.
job: set-up-store
thinking: medium
thinking_why: It checks a list of settings against rules and ranks the risks, so a middle model is enough.
headline: Payments and checkout settings checker
subhead: Share your platform, plan, country, business type and current settings. It checks current provider and local rules before proposing changes to payments, checkout or consent. Get confirmed findings, unchecked items and a custom score with its coverage. The score does not predict payout holds or prove readiness. Missing rules leave affected advice unresolved.
explain: |
  Payment and checkout problems need checks against your actual provider, country, plan and customer regions. A setting that fits one store may not fit another.

  This skill reviews the facts you supply and checks current official rules before proposing affected settings. It keeps confirmed blockers separate from other concerns and marks missing evidence. Its custom points help organise the checklist; they do not measure the chance of a payout hold or prove a launch is ready. A high score with material checks missing leaves readiness unresolved. It does not ask for bank, ID or card numbers. Applying settings, installing tools or switching live payments needs separate approval.
when:
  - You are setting up payments and need to check current provider requirements.
  - Your checkout loses buyers and you think the settings are the cause.
  - You need to review email or SMS consent for your actual customer regions.
you_give:
  - Your platform and country
  - Your actual legal business type and whether account details match; no bank, ID or card numbers
  - Your current payment, wallet and checkout field settings
  - The regions you sell to, and whether you use a separate email tool
  - Whether you offer cash on delivery, and any checkout or abandonment reports (optional)
you_get:
  - A custom checklist score, its sum and how much was checked
  - Confirmed payout blockers, other concerns and their evidence
  - Proposed settings supported by dated provider and local rules
  - Unchecked items and the facts needed before giving advice
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your platform, country, business type and current settings.
  - Never type bank, ID or card numbers into the chat. Say only what type of account you have.
  - Review the sources and missing items before choosing any change. Keep launch readiness unresolved when a material check is missing.
  - Check Shopify setting names against your admin, since they move often.
how_it_works:
  - title: Checks the rules that apply
    text: Records platform, plan, provider, country, currency, legal business type and customer regions. Verifies current official rules before affected advice.
  - title: Reviews payment setup
    text: Checks supported sign-in, identity, bank, capture and gateway requirements. A business number or continent alone cannot settle the answer.
  - title: Reviews checkout options
    text: Checks the actual plan and current admin before proposing fields, wallets, accounts or recovery settings.
  - title: Reviews consent by region
    text: Checks email and SMS separately. Brand size does not decide whether a box can be preselected.
  - title: Shows findings and gaps
    text: Puts confirmed blockers first, explains other judgments and reports unchecked items beside the custom score.
output_shape: |
  CUSTOM CHECKLIST SCORE  <n>/100 (100 - 20 x <blockers> - 8 x <risks> - 3 x <polish> = <n>)

  Coverage: <checked / applicable items, or unknown>
  Custom points are not payout probability or proof of readiness.

  RANKED FINDINGS (confirmed payout blockers first)
  <n>. <BLOCKER | RISK | POLISH> <area>: <what is wrong>
     fix: <supported setting and value, with dated official source; otherwise unresolved>

  SETTINGS TO CHANGE, IN ORDER
  1. <setting> -> <value>

  GATEWAYS
  <which to run together and which not to>

  CHECKOUT FIELDS
  <field> -> <required | optional | off>

  CONSENT BOXES BY REGION
  <region> -> <pre-ticked | unticked | not allowed to pre-tick>

  NOT CHECKED
  <item, and what is needed>
  MISSING: <platform | country | business type | settings>
  Consent rules vary by country. This is not legal advice.
tweaks:
  - what: Platform and country
    how: Shopify Payments is not in every country. Say yours so it checks the list first and plans other gateways if needed.
  - what: Business type
    how: Use the actual legal entity and current provider categories for your country. A registration number alone does not decide the account type.
  - what: Regions you sell to
    how: Check each customer region and channel against current applicable consent rules. Do not infer preselection from brand size.
  - what: Email tool
    how: Say if you use a separate email tool, so the consent and sign-up boxes match what that tool needs.
judge:
  - Confirmed payout blockers come first; other rankings state their evidence and judgment limits.
  - The score shows its sum, coverage and material unchecked items; it does not clear a launch or predict payout holds.
  - Every affected setting has a dated official provider source and applicable local basis, or stays unresolved.
  - Nothing asks you to type bank, ID or card numbers.
  - Consent advice is by region and ends with a note that it is not legal advice.
test:
  - Say your ID reads Robert but your store account says Rob. It should flag it as a likely verification hold.
  - Say you sell to the UK and your marketing box is pre-ticked. It should flag it.
  - Leave out your country. It should ask, because Shopify Payments is not in every country.
  - Run it twice on the same settings. The ranking should match.
  - "Provide no checked settings: undeducted points cannot prove readiness. Provide one blocker, two risks and one polish item: custom score 61, with launch still blocked."
  - Give a new brand, no customer regions, a business number and a bank described only as Europe. Leave entity category, network and consent choices unresolved.
improve:
  - Add the checkout fields and wallets you want as your standard, so each run checks against them.
  - Add your list of regions and the consent rule for each, with the date you checked it.
  - Add your gateway rules, such as which methods you run together.
  - Pair it with the store go-live checker for the test orders, and with a checkout page auditor for friction.
works_best_with:
  tools:
    - name: Shopify Payments
      why: Built into Shopify, with wallets such as Shop Pay, Apple Pay and Google Pay, and payout verification.
    - name: Stripe
      why: Has a connection test and test mode, and is used on WooCommerce through a plugin.
    - name: PayPal
      why: Can run beside Shopify Payments, and on WooCommerce needs a business account to connect.
  inputs:
    - Screenshots of your payment and checkout settings
    - Your abandoned checkout report
    - A list of regions you sell to
    - Your email tool's consent requirements
terms:
  - term: Payment capture
    meaning: When the money is taken from the buyer's card, either at checkout or after you review the order.
  - term: Wallet
    meaning: A saved payment method such as Shop Pay, Apple Pay or Google Pay.
  - term: Guest checkout
    meaning: Buying without making an account.
  - term: Pre-ticked box
    meaning: A consent box that is already ticked when the buyer sees it.
