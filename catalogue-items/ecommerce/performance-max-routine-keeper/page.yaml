new_slug: performance-max-routine-keeper
name: Performance Max routine keeper
summary: Check your Performance Max account with a daily, weekly and monthly routine. Get changes to review, a budget call and a spend score.
job: run-google-ads
thinking: medium
thinking_why: It applies a fixed routine to exports and weighs a budget move, so a mid-size model is enough.
headline: Performance Max routine keeper
subhead: Give it your Performance Max reports and your store revenue. You get this week's changes to review, a budget call, and a spend score when the numbers allow one. Nothing changes in your account until you approve it.
explain: |
  Performance Max hides a lot. A short routine each day, week and month shows where money goes and what to cut.

  Your reports slice the same spend in different ways. One wasted dollar can show up in the product report and the search term report. So the skill counts each dollar once before it gives a score. If it cannot tell which spend overlaps, it says so and gives no score.

  Google's ad return and your store revenue also measure different things. When they disagree, the skill notes it and tells you what to check. It does not guess the cause.

  The budget rules (raise 10 to 20 percent, the 80 percent test) come from one course. Treat them as a starting point and check them against your own results. The skill proposes changes only. You make them in Google Ads.
when:
  - You run Performance Max and want a weekly routine that fits into an hour.
  - Performance Max ROAS looks great but your store revenue does not match.
  - Spend jumped and you need to know where it went.
not_for:
  - "Your account has no Performance Max campaign: use the standard reports in Google Ads, or plan a new campaign with the Performance Max launch planner."
  - "You have no store revenue or attribution numbers: the reality check cannot run, so use Google Ads reports for a first look at spend."
  - "You want to pick a bid target: use the Google bid strategy chooser, then come back here for the weekly routine."
you_give:
  - Performance Max search term insights
  - Product-level spend and conversions
  - Asset details and a landing page and placement report
  - Your break-even CPA and ROAS, your MER and new-customer CPA from your attribution tool
you_get:
  - Daily, weekly and monthly findings with missing evidence shown
  - Proposed product, page, term and asset changes to review
  - A supported budget proposal or hold, with the source-rule limits
  - A matched trend comparison and descriptive score where unique flagged spend is known
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Export the Performance Max search term insights, product report, asset report and landing page report.
  - Add your break-even CPA and ROAS, and your blended MER and new-customer CPA.
  - Review the proposed changes and their evidence. Any account edit, upload or budget change needs separate approval and result checks.
  - Choose a review window that considers volume and conversion lag; the source’s two-to-four weeks is a starting example.
output_sample:
  input:
    - Your Performance Max search term insights
    - Your product-level spend and conversions
    - Your asset, landing page and placement reports (optional)
    - Your break-even CPA and ROAS (optional)
    - Your blended MER and new-customer CPA from your attribution tool (optional)
  prerequisites:
    - An AI chat that can read pasted exports
    - Access to Google Ads to export the reports
  output:
    - name: THIS WEEK'S FINDINGS
      contains: Daily, weekly and monthly checks, with proposed term exclusions, weak products and assets, and whether a customer list refresh is due.
    - name: EXCLUDE OR REPLACE
      contains: A list of products, pages, terms and assets with their spend, conversions and the action to review.
    - name: REALITY CHECK
      contains: Performance Max ROAS beside blended MER and new-customer CPA, with dates, gaps and any shift in channel mix.
    - name: BUDGET MOVE
      contains: A raise, hold or cut with the rule behind it, and how long to wait before the next change.
    - name: CUSTOM DESCRIPTIVE SCORE
      contains: A score out of 100 from flagged spend counted once, or a note that it cannot be worked out.
    - name: MISSING
      contains: Any report or number you did not give, so you know what limits the result.
how_it_works:
  - title: Runs the daily check
    text: Reviews observed queries and branded conversions, then proposes supported exclusions.
  - title: Runs the weekly check
    text: Spend by product, assets that underperform, landing pages and placements with high spend and low conversion.
  - title: Runs the monthly check
    text: Reviews search themes and whether a customer-list refresh is needed. It does not upload a list without separate approval.
  - title: Applies the budget rule
    text: Uses the attributed course percentages as planning heuristics, with actual costs, budget limits and uncertainty checked before a proposal.
  - title: Cuts fast, scales slow
    text: Waits two to four weeks after bidding changes and never doubles a budget overnight.
  - title: Checks against the outside
    text: Compares matched periods and definitions, keeping missing attribution and other possible causes visible.
  - title: Watches the channel split
    text: Looks for sudden shifts to YouTube or Gmail, with a script optional.
  - title: Checks flagged spend once
    text: Uses the union of uniquely mapped flagged spend. Missing overlap data leaves the combined score unresolved; no-spend score is undefined.
output_shape: |
  THIS WEEK'S FINDINGS
  daily   <proposed term exclusions | branded conversions observed, with basis>
  weekly  <products spending without selling | assets to replace | pages and placements to exclude>
  monthly <search themes to refresh | customer list due?>

  EXCLUDE OR REPLACE
  <product / URL / term / asset> | <spend> | <conversions> | <action>

  REALITY CHECK
  Matched basis/coverage <dates, currency, definitions, windows, gaps>
  PMax ROAS <n> | blended MER <n> | new-customer CPA <n>
  Observation <supported comparison> | causal/customer attribution <unresolved or separately supported with evidence>
  channel split <shift to YouTube or Gmail? yes/no>

  BUDGET MOVE  <up / hold / cut> <n>% because <rule>
  wait <2 to 4 weeks> before changing the target again

  CUSTOM DESCRIPTIVE SCORE  <n>/100 or <undefined / unresolved>
  Unique flagged spend <n or unresolved> / matched total <n>
  Deduplication and coverage <mapping and gaps>
  Not a causal waste, profit or incrementality measure.
  MISSING: <search terms | product report | break-even | MER or new-customer CPA>
tweaks:
  - what: Your break-even ROAS and CPA
    how: The budget move depends on whether ROAS sits above break-even. Give both numbers.
  - what: Your outside numbers
    how: Match your store and account measures by date, currency, attribution window and definition. Differences need investigation, not an automatic causal label.
  - what: Budget use
    how: State actual budget use and timing. The source’s 80% rule is one course heuristic, not proof a lower target improves results.
  - what: The time since your last change
    how: The skill waits 2 to 4 weeks after a bidding change, so say when you last made one.
judge:
  - The checklist has a daily, weekly and monthly part, each with a finding.
  - Every exclusion names a spend and a reason from your export.
  - Any budget move states its evidence, limits and source heuristic; missing cost basis leads to hold.
  - The outside comparison matches definitions and windows and does not claim causality from trends alone.
  - Unique flagged spend is counted once against a positive matched total; unknown overlap stays unresolved.
test:
  - Use total spend 100 and the same 60 in product and term reports. With verified overlap, score 40; do not add them into minus 20.
  - Use two flagged reports of 60 with unknown overlap. Leave the combined score unresolved.
  - Use total spend 0. Report no spend and undefined score.
  - Double spend with flat store revenue. State the observation without claiming warm buyers or causal waste.
improve:
  - Put your break-even CPA and ROAS in the skill file so the budget rule uses your numbers.
  - Add your attribution tool's name so the reality check names where to read MER.
  - Add a rule for when you pause a product group, such as spend over a set amount with no sale.
  - Pair it with the Performance Max launch planner for setup, and the Google bid strategy chooser for the target.
works_best_with:
  tools:
    - name: Google Ads
      why: Search term insights, product, asset, landing page and placement reports come from here.
    - name: Shopify
      why: Your backend revenue and new-customer data check Performance Max against reality.
    - name: Any good chat AI
      why: Any current chat AI can read a pasted export.
  inputs:
    - A Performance Max placement script, if you use scripts
    - Your attribution tool's new-customer CPA
    - Last month's customer list to upload
terms:
  - term: MER
    meaning: Marketing efficiency ratio. Total revenue divided by total ad spend across all channels.
  - term: Blended
    meaning: Counted across all channels together, not one campaign's own report.
  - term: Search theme
    meaning: A phrase that hints to Performance Max what customers search for.
  - term: Break-even CPA
    meaning: The most you can pay for a sale and still cover your costs.
