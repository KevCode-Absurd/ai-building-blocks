new_slug: phone-product-photoshoot
name: "A full product photoshoot from your phone photos"
summary: "Turn your phone photos into a product photoshoot plan: 8 to 12 shots, each with a light setup, made in every size you need and checked."
job: product-photos
thinking: high
thinking_why: "It runs several skills in a row. Give it your strongest model."

headline: "A full product photoshoot from your phone photos"
subhead: Give it your product photos, brand look and where the photos go. It plans 8 to 12 shots by job, writes a light setup for each one based on your product's surface, waits for your OK, makes one test photo, then makes and checks every size.

explain: |
  When people make product photos with AI, they usually pick looks first. They end up with twelve handsome pictures in the same soft light, none that shows how big the product is, and a label that changes from photo to photo.

  This workflow plans the way a studio does. First the shots: each one has a job (size, in use, texture, what's in the box), a distance and an angle, chosen by where the photos will go. Then a light card for each shot, written like a photographer's note, and adjusted for your product's surface: a glossy pouch needs its light moved so the shine misses the label, while fabric needs light from the side to show its weave. Then the reference photos. You approve the plan and one test photo before the rest are made and checked at full size.

when:
  - You need product photos for a product page, ads and email, and can't book a photoshoot.
  - Your AI product photos look nice but the product isn't quite right, or they all look the same.
  - Your product is shiny, clear or white, and the light keeps going wrong.
not_for:
  - "You only want one quick picture that borrows the look of a single photo: use the Product image spec writer, or ask your AI for one image."
  - "You have no real photo of the exact variant: take one with your phone first, because the shoot can't draw a side it has never seen."
  - "You need real photos of real people using the product: book a photographer, since this makes AI photos with an invented adult cast."

you_give:
  - One product and variant, named as you name it
  - Real photos of that exact variant, including one of it in use
  - Your brand facts (colours, photo style, places and props, what you never show, who buys and when)
  - Where the photos go and in which sizes (product page 1:1, feed 4:5, stories 9:16, email 3:2)
  - Reference photos you like (optional)
you_get:
  - A truth sheet describing your product
  - An approved shot list with a light card for each shot
  - A plan for each photo, and the looks you rejected
  - The photos in every size you asked for, named by job, with a pass or fail line each

how_to_use:
  - Copy the workflow and paste it into Claude, ChatGPT or Gemini. ChatGPT and Gemini can make the photos; with Claude, paste each prompt into your image tool.
  - Name the product and variant, attach your real photos (including one in use), and paste your brand facts.
  - Say where the photos go and which sizes you need. It makes only the sizes you name.
  - Approve the shot list, the light cards and the references. Nothing is made before you do.
  - Approve the test photo, then let it make and check the rest.
output_sample:
  input:
    - Your product and variant, named as you name it
    - Phone photos of that exact variant, including one in use
    - "Your brand facts: colours, photo style, props, what you never show"
    - Where the photos go and the sizes you need
    - Reference photos you like (optional)
  prerequisites:
    - An AI that can make images (ChatGPT or Gemini), or an image tool to paste the prompts into if you use Claude
  output:
    - name: Truth sheet
      contains: "What must stay true about the product: shape, colours, label words and how it opens, with MISSING where a photo is needed."
    - name: Shot list
      contains: Each shot with its job, distance, angle and where it is used, plus shots left out and why.
    - name: Light card
      contains: "For each shot: main light position and size, fill, time of day, and a fix for your product's surface."
    - name: References
      contains: Setups behind looks you like, with keep, swap or drop lines for each part.
    - name: Plan per shot
      contains: Each shot's job, who is in it, and decisions where a reference and your product disagree.
    - name: Photos
      contains: Every approved size, named by number, job and size, and marked as made with AI.
    - name: Checks
      contains: A pass or fail line per file, with what was asked and what came back.

how_it_works:
  - title: Writes down the product
    text: Records exactly how the product looks from its photos. No true photo of the variant means no shoot; no in-use photo means no in-use shots.
  - title: Plans the shots
    text: Each shot is a job, a distance and an angle, leaned toward your product page, ads or email. Always one close, one wide and one in harder light.
  - title: Writes a light card
    text: Where the main light sits, how big and soft it is, the fill, and the time of day. Glossy, matte, clear and white products each get their own fix.
  - title: Finds references
    text: Searched by the problem the shot solves, not your category. It writes the setup behind each one and what to keep, swap or drop.
  - title: Waits for your OK
    text: You approve the shot list, light cards and references before anything is made.
  - title: Tests one photo
    text: The product alone, in the main size. You approve it, and it becomes the look every later photo matches.
  - title: Makes every size
    text: Each size composed on its own from the same scene, never cropped from another.
  - title: Checks at full size
    text: Label zoomed to full screen, shadows against the light card, hands, props and files. Faults are logged, and repeats join the never-show list.

output_shape: |
  1. TRUTH SHEET
  <the product, line by line, with MISSING where a photo is needed>

  2. SHOT LIST (for your approval)
  <nn> | <job> | <distance> | <angle> | <what it shows> | <used for>
  Left out: <job, and the missing photo or rule>

  LIGHT CARD, SHOT <nn>
  Main: <clock position, height, size, hard or soft>
  Fill: <card, window, none>  Time: <...>
  Surface fix: <glossy / matte / clear / white on white>

  REFERENCES
  <nn>: search "<the shot's problem>"; keep / swap / drop lines

  3. PLAN, PER SHOT
  4. PHOTOS  <nn>_<job>_<size> (made with AI)
  5. CHECKS  <file>: <pass/fail; asked vs came back>

example:
  business: sprout
  input: |
    [the skill]

    Product: Sprout Original (Adults), Low Sugar, 28 daily packs.
    Photos: pouch front on; gummies in an open hand. No photo of a daily
    pack yet.

    Brand facts: glossy deep green stand-up foil pouch, big yellow
    wordmark, yellow bear face top right, "28 Daily Packs" at the
    bottom. Gummies: small opaque deep-green bears, soft matte. Tear the
    daily pack straight across the top and tip the gummies into a palm.
    The pouch opens only at its resealable top, never shown torn.
    Colours: forest green, cream, sunflower yellow. Photos bright,
    sunny, candy-like; everyday adults at home or outdoors; never
    clinical. Never show tie-in characters or partner marks.

    For: product page and Meta feed ads. Sizes: 1:1 and 4:5.
    No reference photos yet.
  output: |
    1. TRUTH SHEET (short form)
    Glossy deep green stand-up foil pouch, closed at its resealable top;
    big yellow wordmark; yellow bear face top right; "28 Daily Packs" at
    the bottom; no white burst (that's Sugar-Free). Gummies: small,
    opaque, deep-green bears, soft matte.
    MISSING: daily pack (whole and torn), pouch in a hand, pouch back.

    2. SHOT LIST (for your approval)
    01 | identity  | mid   | eye level     | pouch alone on cream |
         product page, catalogue ads (test shot)
    02 | substance | close | eye level     | three gummies, matte |
         product page
    03 | scale     | close | high          | small handful of gummies in
         an adult palm, pouch soft behind | product page, feed
    04 | use       | mid   | eye level     | adult eating one gummy at a
         sunny counter | feed ad
    05 | place     | wide  | eye level     | pouch on a counter by keys |
         feed ad
    06 | use       | wide  | high          | pouch in an open backpack by
         a water bottle | feed ad
    07 | range     | mid   | high          | three pouches (the 84-pack) |
         product page
    08 | ad base   | mid   | low           | pouch in hard morning sun,
         crisp shadow, open sky above | feed ad (harder light)
    Left out: arrival and tear-and-tip use (no daily pack photo); pouch
    in a hand.

    LIGHT CARD, SHOT 01
    Main: large soft window at 9 o'clock, a little above the pouch
    Fill: white card at 3 o'clock   Time: bright late morning
    Surface fix: glossy foil. The window sits well to the side so its
    shine runs down the pouch's left edge, away from the wordmark

    LIGHT CARD, SHOT 02
    Main: small window at 10 o'clock, low and close
    Fill: none   Surface fix: matte gummies. Low side light shows the
    soft surface; front light would flatten it

    REFERENCES (search by problem, not "supplements")
    01: "glossy foil pack alone on a warm plain ground"
    02: "sweets very close, matte, shallow focus"
    08: "small shiny object in hard sun with one crisp shadow"
    Keep each one's camera and light. Swap props for gummies, keys and
    a backpack. Drop their products, words and colours.

    STOP 1: approve the shot list, light cards and references.
    Then: test shot 01 in 1:1 for your OK, every shot in 1:1 and 4:5
    named like 01_identity_1x1, and a full-size check of each.

tweaks:
  - what: Where the photos go
    how: A product page set leans on identity, scale, substance, use and what's in the box. An ads set leans on use, place and space for words. Say which, and the shot list shifts.
  - what: Your product's surface
    how: Say if it's glossy, matte, clear or white. The light cards change, for example a black card beside a white product so it doesn't vanish.
  - what: Your own references
    how: Attach photos you like and say which shot each is for. Your direction beats the workflow's reading; your brand rules beat both.
  - what: The sizes
    how: Name only the sizes you'll use. Each one is made as its own picture, so every extra size is extra work and checking.

judge:
  - Every photo has one job, and no two share job, distance and angle.
  - At least one shot shows how big the product is.
  - Each shot has a light card, and the shadows in the photo match it.
  - The label matches the real photo when zoomed to full screen.
  - The test photo was approved before the rest were made.

test:
  - Zoom into the test photo's label beside your real photo before you approve it. If it's off, the rest of the set will be too.
  - Check the shot list has a scale shot. If it doesn't, you didn't give it a photo of the product in a hand, and it should say so.
  - Pick one photo and find its light card. The shadow should fall where the card says. If it doesn't, the prompt didn't carry the light card.
  - Put the finished set side by side and cover the product in each. If two backgrounds could swap, one photo isn't doing its own job.

improve:
  - Fix the sizes you always need in step 1, so it stops asking.
  - "Write your surface fix into step 4 once (for Sprout: glossy foil, light to the side so the shine misses the wordmark)."
  - "Add your rules for showing the product to step 6 (for Sprout: the pouch opens only at its resealable top and is never shown torn)."
  - Add the looks you rejected to the avoid list, so the next shoot doesn't offer them again.
  - Pair it with the skill that borrows one photo's look for a single quick picture, and the gallery workflow when the photos need words for a product page.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Takes several product photos plus up to 3 style references, and is Google's pick for brand consistency."}
    - {name: "GPT Image", why: "Keeps the product close to your photos, and lets you point at one detail to fix it."}
  inputs:
    - "A flat, straight-on photo of the label, so printed words can be checked letter by letter"
    - "Product photos past customers liked, so the look starts from what already works for you"
    - "Photos of the real props and surfaces you own, so the set uses real things"

terms:
  - term: Shot list
    meaning: The list of photos to make, each with its job and where it will be used.
  - term: Light card
    meaning: A short note of where each light sits, how big and soft it is, and what fills the shadows.
  - term: Safe area
    meaning: The middle part of a tall image where an app's buttons and captions won't cover the product.
