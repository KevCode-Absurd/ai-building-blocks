new_slug: platform-roas-reality-check
name: Platform ROAS reality check
summary: "Run a platform ROAS reality check: compare ad-platform returns with your store totals, spot the gaps and get the next test before you move budget."
job: read-ad-results
thinking: high
thinking_why: It weighs many signals that can disagree, such as attribution windows, audiences and tests. A stronger model keeps them straight.
headline: Platform ROAS reality check
subhead: Share matching dated platform exports, store totals and the available audience breakdown. It compares reported returns and their definitions, reviews the top ad and lists missing evidence. Get a descriptive report and a custom checklist score. Returning customers can still respond to ads. A gap, correlation or score does not prove which sales the ads caused.
explain: |
  Ad-platform reports and store totals can differ because they use different definitions, attribution windows, customer groups and channel coverage. The gap is a measurement question. It does not by itself prove wasted spend or show which customers would have bought anyway.

  This skill compares supported measures on a stated basis. It reviews the audience mix, top ad and evidence behind a budget choice. It keeps reported attribution, model estimates and completed experiments distinct. Ratios with zero or missing denominators stay undefined. The custom score is a review aid, not a probability or proof of causal return. A reused test factor needs dated evidence and clear limits.
when:
  - Your platform ROAS looks great but your bank balance does not.
  - You are about to move budget between channels, or raise spend on the ad with the best ROAS.
  - A new channel looks weak while Meta suddenly looks better, and you wonder why.
not_for:
  - "You want to plan a holdout or lift test: use the Incrementality test planner."
  - "You want to know if your customers repay what you spend to win them: use the LTGP to CAC checker."
  - "You have no store totals or platform export yet: pull those numbers first, or ask your ad manager for them."
you_give:
  - Platform ROAS with its attribution setting, plus the same ROAS on 7-day click, for set dates
  - Store new-customer revenue, total ad spend and new-customer count for the same dates
  - The audience breakdown (new, engaged, existing) and spend by campaign type
  - Your top ads with ROAS, spend and frequency (optional)
  - Holdout test results, daily ROAS data or post-purchase survey answers (optional)
you_get:
  - A comparison of reported measures, definitions, periods and missing coverage
  - A supported top-ad breakdown with audience and attribution limits
  - The evidence basis and next check for each proposed budget decision
  - A bounded custom checklist score with missing checks shown
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Pull the platform export twice for the same dates, once with default attribution and once on 7-day click. Add the audience breakdown.
  - Paste your new-customer revenue and total ad spend for the same dates, from a first-time-customer view.
  - Read the ladder first, then the traps, then the top ad check.
  - Do the one next step it gives you before you move any budget.
output_sample:
  input:
    - Platform ROAS for set dates, on default attribution and on 7-day click
    - Store new-customer revenue, total ad spend and new-customer count for the same dates
    - Your audience breakdown (new, engaged, existing) and spend by campaign type
    - Your top ads with ROAS, spend and frequency (optional)
    - Holdout test results, daily ROAS or survey answers (optional)
  output:
    - name: Data basis
      contains: The dates, currency, attribution settings, customer groups and coverage that every number below rests on.
    - name: Store measure
      contains: New-customer revenue divided by matched total ad spend, or undefined when spend is zero or missing.
    - name: Attribution comparison
      contains: The reported and window measures side by side, with their limits. They are not assumed to fall in order.
    - name: Top ad
      contains: The best ad's audience and attribution breakdown, or a note that the data is missing.
    - name: Evidence
      contains: For each budget decision, what the evidence is and which causal questions stay open.
    - name: Custom rubric
      contains: A bounded checklist score, the checks completed and the checks missing. It is not proof of cause.
    - name: Next check
      contains: One tracking check or suitable test to run before you move budget, with its limits.
    - name: Missing / checks missed
      contains: A list of the inputs and checks that were absent or failed.
how_it_works:
  - title: Sets your base
    text: Calculates new-customer revenue divided by matching total ad spend, where the denominator is positive. This is a descriptive store measure.
  - title: Compares attribution views
    text: Shows supplied window/model measures on their actual basis. Values need not form a descending ladder or match a different customer population.
  - title: Reviews window differences
    text: Compares supported attribution views. A difference is not pure view-through credit unless all other relevant definitions match.
  - title: Reviews the audience mix
    text: Shows spend and reported results for supplied groups. Existing customers may also respond to ads; their presence alone is not proof of waste.
  - title: Checks the top ad
    text: Reviews the ad’s supplied audience and attribution data. It does not turn a descriptive customer return into true incremental return.
  - title: Scans for traps
    text: Cross-platform comparisons, brand search, halo from other channels, tiny channels and ads you cannot measure.
  - title: Ranks the evidence
    text: Opinion, simple correlation, models, near-experiments or a true holdout, named for each decision.
  - title: Scores and advises
    text: Shows the custom points within their bounds, unchecked evidence and a next data or test step. The score does not establish cause or profit.
output_shape: |
  DATA BASIS
  <dates, currency, value definitions, attribution settings, customer groups, coverage>
  STORE MEASURE
  <new-customer revenue / positive matched total ad spend, or undefined>
  ATTRIBUTION COMPARISON
  <reported/window/model measures and limits; not assumed to descend>
  TOP AD
  <supported audience/window breakdown, or missing>
  EVIDENCE
  <decision> | supplied facts, model assumptions or completed test | unresolved causal questions
  CUSTOM RUBRIC
  <bounded components and total> | checks completed <coverage> | missing checks <list>
  Points and correlations are not causal confidence.
  NEXT CHECK
  <tracking check or suitable test, with limits>
  MISSING / CHECKS MISSED
  <list>
tweaks:
  - what: Same dates on both sides
    how: Use the same dates for the platform export and the store totals. Different dates make the gap look larger or smaller than it is.
  - what: First-time customers only
    how: Use a defined first-time-customer view for that descriptive ratio. Keep returning-customer results separate; neither group alone establishes incremental sales.
  - what: The audience breakdown
    how: It shows how much spend reached existing customers. Without it the skill cannot score that part.
  - what: Daily data
    how: A matched daily series can show co-movement. Shared denominators, seasonality and other channels can also explain it; correlation is not a causal test.
  - what: Other places you sell
    how: Say if you sell on Amazon or in stores. Ads that look weak on the website may lift those too.
judge:
  - The base is new-customer revenue divided by total ad spend for the same dates.
  - Attribution differences state which definitions changed; operator percentages remain labelled anecdotes.
  - Meta's click definition was not assumed. Each 7-day click figure is labelled "click definition not confirmed" until you confirm it in Meta's Business Help Centre.
  - No ROAS is compared across platforms, margins or funnel stages.
  - Each budget decision names its evidence level.
  - The custom score shows its bounds, working and unchecked evidence; it is not a probability or causal confidence.
test:
  - Give a platform/store gap with no experiment. Report the mismatch and missing evidence, not a true-return or would-have-bought-anyway conclusion.
  - Run it twice with the same inputs. The ladder and the score should match.
  - Change only the attribution setting in the export and see that the ladder and score change as you expect.
  - Check the store base by hand, as new-customer revenue divided by ad spend.
  - "Use zero ad spend: the store ratio is undefined. Use returning-customer spend without causal evidence: do not label it all wasted."
improve:
  - Save your usual platforms, your attribution settings and your margin in the skill file.
  - Record agreed review thresholds as custom planning rules, not validated safety limits for budget moves.
  - Reuse a test factor only with its source, date, uncertainty and applicability limits; retest when those conditions change.
  - Pair it with the LTGP to CAC checker for your anchor number and the Incrementality test planner for the next test.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Any chat AI can run the ladder and the score. Check the store base by hand.
    - name: Meta Ads Manager
      why: Lets you compare attribution settings and break results down by new, engaged and existing audiences.
    - name: Shopify
      why: Gives new-customer revenue and orders, and a cohort report for your own repeat data.
    - name: A post-purchase survey app
      why: Collects where buyers say they first heard of you, so you can compare it with platform data.
  inputs:
    - Daily 7-day click ROAS and daily new-customer revenue per ad dollar for the last 60 days
    - Results from any past holdout or lift test
    - Your Meta, Google and TikTok exports with attribution columns
    - Sales on Amazon or in stores by week
terms:
  - term: View-through
    meaning: Credit a platform takes for a sale when the buyer only saw the ad and did not click.
  - term: 7-day click
    meaning: Counts a sale only if the buyer clicked the ad and bought within 7 days.
  - term: Incremental
    meaning: Sales the ads really caused, beyond those that would have happened anyway.
  - term: Acquisition MER
    meaning: New-customer revenue divided by total ad spend. It is a store-level check on what the platforms report.
  - term: Halo effect
    meaning: A lift in one channel's numbers that really came from something else, such as another channel or a store event.
