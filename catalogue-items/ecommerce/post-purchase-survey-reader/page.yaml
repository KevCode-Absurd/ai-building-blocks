new_slug: post-purchase-survey-reader
name: Post-purchase survey reader
summary: Read your post-purchase survey answers next to ad spend. See which channels buyers name, and where platform sales reports disagree.
job: read-ad-results
thinking: medium
thinking_why: It sorts free-text answers into channels and compares several shares, so a mid-size model is enough.
headline: Post-purchase survey reader
subhead: Share dated answers with personal details removed, plus matching spend and reported sales. It groups replies by channel and compares counts and shares on a stated basis. Get a gap table, word-of-mouth trends and next checks. Recalled discovery and platform attribution differ; disagreement alone does not prove which channel caused sales.
explain: |
  A buyer may remember where they first heard of a store. An ad platform may report a later click or another kind of credit. These measures can disagree without showing that either channel caused or failed to cause a sale. The period, question, customer group and missing responses matter.

  This skill groups replies and compares supported counts and shares. It shows gaps in the evidence, tracks word-of-mouth counts beside their denominators and suggests further checks. Its custom checklist points are a review aid, not proof of accurate attribution or safe budget moves. Any spend experiment needs an appropriate comparison, duration, risk limit and authorization.
when:
  - Your platform and survey reports differ, and you want to understand their definitions and coverage.
  - You spend on podcasts, events or creators and can't see their effect in your ad reports.
  - You're about to move budget between channels and want a second view first.
not_for:
  - "You have no post-purchase survey yet: use the Post-purchase survey builder to write the questions first."
  - "You want proof that a channel caused sales: ask an analyst to set up a controlled spend test, because survey answers only show what buyers remember."
  - "You have only a handful of replies: wait and collect more, since a small set is mostly noise."
you_give:
  - Survey answers to "how did you hear about us", with order dates (names and emails removed)
  - Ad spend by channel for the same dates
  - Sales each platform reports, by channel (optional)
  - Your profit or P&L for the period (optional)
you_get:
  - A table of supported channel counts and shares, with definitions and missing coverage
  - Descriptive mismatches to investigate, without assigning causal sales credit
  - Word-of-mouth counts, denominators and share trends
  - Evidence-led next checks or proposed experiments with stated limits
  - Custom checklist parts and a supported total or known subtotal
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your survey answers with order dates, after removing names and emails.
  - Paste your ad spend by channel and, if you have it, the sales each platform reports for the same dates.
  - Review differences in dates, questions, coverage and channel groups first. Agree on the evidence, risk, comparison and duration before authorizing any spend experiment.
output_sample:
  input:
    - Your survey answers to how buyers heard about you, with order dates (names and emails removed)
    - Your ad spend by channel for the same dates
    - Sales each ad platform reports, by channel (optional)
    - Your profit and loss for the period (optional)
  output:
    - name: Survey read
      contains: The date range, eligible orders, valid replies and the share of orders that answered.
    - name: Data basis
      contains: The question asked, how channels were grouped, and what coverage is missing.
    - name: Channel table
      contains: Each channel's share of spend, answers and platform sales, with a plain read of any gap.
    - name: Word of mouth
      contains: Mention counts, the number they come from, and the weekly trend.
    - name: Hard-to-track spend
      contains: Whether podcasts, events or creators show up in the answers.
    - name: Big-quantity buyers
      contains: Unusually large orders, listed for a person to ask why.
    - name: Next check
      contains: A test or data check with its comparison, amount at risk, length, owner and stop rule.
    - name: Custom checklist
      contains: Planning points out of 100 across three parts, with any missing parts shown.
    - name: Missing
      contains: Inputs that were not given and checks that failed.
how_it_works:
  - title: Counts the answers
    text: Shows valid replies and eligible orders with their denominators. The rough 200-reply guide is not proof of a representative sample.
  - title: Sorts into channels
    text: Free text is grouped into Meta, TikTok, search, YouTube, podcast, email, word of mouth and other.
  - title: Compares the shares
    text: Compares defined spend and answer shares, including all-answer and paid-only views. A missing or zero denominator leaves the affected ratio undefined.
  - title: Adds the platform view
    text: Shows platform-reported shares with their attribution basis. A large gap is a descriptive mismatch, not proven over-credit or under-credit.
  - title: States the evidence limits
    text: Survey answers show recall, not verified first discovery. Platform reports show attribution, not automatic causal truth. Keep both limits visible.
  - title: Plans the next check
    text: A mismatch prompts investigation. Any proposed experiment states its comparison, amount at risk, duration, outcome, owner, stop rule and authorization boundary.
  - title: Tracks word of mouth
    text: Shows counts and denominators as well as shares. A rising share can result from other replies falling; it does not prove rising organic reach.
  - title: Flags big orders
    text: Unusually large orders go to a person to ask why, since they may be an event or a reseller.
  - title: Shows custom points
    text: The three planning parts have limits of 40, 30 and 30 points. Missing parts stay missing. Agreement does not prove accurate causal credit or a safe budget choice.
output_shape: |
  SURVEY READ  <date range> | eligible orders <n> | valid replies <n> | response rate <supported ratio or undefined>
  DATA BASIS  <question, attribution windows, customer groups, channel mapping, single or multiple mentions, missing coverage>
  CHANNEL  <channel> | spend share <n or undefined> | answer share all <n or undefined> | paid-only share <n or undefined> | platform share <n or undefined> | descriptive mismatch or unresolved basis
  WORD OF MOUTH  <count> / <valid response denominator> = <share or undefined> | count and share trends | recall limits
  HARD-TO-TRACK SPEND  <mentions and response window> | absence is not proof of failure
  BIG-QUANTITY BUYERS  <de-identified observation for a person to review>
  NEXT CHECK  <hypothesis or data check> | comparison <design> | amount at risk <if supported> | duration <volume and lag rationale> | outcomes <definitions> | owner and stop rule <stated or missing> | authorization <pending or given>
  CUSTOM CHECKLIST  <bounded parts, supported total or known subtotal> | evidence coverage <known and missing>
  These planning points are not causal confidence or proof of safe spending.
  MISSING / CHECKS MISSED  <list>
tweaks:
  - what: Number of replies
    how: Give the full set for the period and the number of eligible orders. More replies may reduce noise but do not remove recall or nonresponse bias.
  - what: Date range
    how: Match dates and state the question, attribution window and customer group. Different definitions may prevent direct comparison even on the same dates.
  - what: Channel groups
    how: Say how to group channels, such as Instagram and Facebook together as Meta, so the shares match your spend report.
  - what: Budget move size
    how: Choose the amount at risk and duration from the hypothesis, order volume, conversion lag and comparison design. A tenth of spend for one week is an illustration, not a validated default.
judge:
  - Counts, eligible orders, response coverage and denominators are shown.
  - Dates, channel groups, populations and attribution definitions are matched or their differences are explicit.
  - Share gaps remain descriptive and word-of-mouth counts accompany shares.
  - Any proposed spend experiment states risk, comparison, duration rationale, outcome, owner, stop rule and authorization.
  - No buyer name or email appears in the output.
  - Custom points show bounded parts and missing coverage; they do not establish causal credit or safe spending.
test:
  - "Use Meta at 50% of spend and answers: report matching shares, not fair or optimal allocation."
  - "Use 30 replies: call the pattern rough without treating hundreds as proof of representativeness."
  - "Remove platform sales: show the missing part and known subtotal, not a fabricated full score."
  - "Use word-of-mouth counts 20/100 then 20/50: share rises 20% to 40%, count remains 20; do not claim rising organic reach."
  - "Compare recalled first discovery with seven-day click credit: show different bases, not proven over-credit."
  - "Use zero valid replies: the answer share is undefined. Missing event mentions do not prove the event failed."
improve:
  - Add your own channel list and groupings to the skill file, so free-text replies always sort the same way.
  - Add the names of your podcasts, events and creators, so it can look for them in the answers.
  - Keep agreed score weights as custom planning choices. Changing weights does not calibrate attribution accuracy or causal confidence.
  - Pair it with the platform ROAS reality check and the post-purchase survey builder.
works_best_with:
  tools:
    - name: Any good chat AI
      why: It can sort free-text answers into channels and compare the shares for you.
    - name: Shopify
      why: Checkout survey apps run on the order status page and give you the answers with order dates. Some apps are paid, so check the price and your plan.
    - name: Slack
      why: Optional. A simple connection can post each new survey answer to a team channel. It may need a paid plan or an automation tool.
  inputs:
    - Your ad spend by channel for the same weeks
    - Sales each ad platform reports, by channel
    - Your profit and loss by week, as one outcome measure with its comparison and causal limits
terms:
  - term: Over-credited channel
    meaning: A possible interpretation to investigate when platform and survey shares differ. The gap alone does not prove that the platform took excess causal credit.
  - term: Share of answers
    meaning: A channel’s share of valid answers under the stated single-response or multiple-mention rule, with its denominator shown.
  - term: Word of mouth
    meaning: Buyers who say they heard from a friend or another person, not an ad.
