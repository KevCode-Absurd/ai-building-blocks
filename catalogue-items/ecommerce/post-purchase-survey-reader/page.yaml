new_slug: post-purchase-survey-reader
name: "Post-purchase survey reader"
summary: "Give survey answers and channel spend. Get over-credited channels, budget moves and a trust score out of 100."
job: read-ad-results
thinking: medium
thinking_why: "It sorts free-text answers into channels and compares several shares, so a mid-size model is enough."

headline: "Post-purchase survey reader"
subhead: Give it the answers buyers gave to "how did you hear about us" and your ad spend by channel. It compares each channel's share of answers with its share of spend and platform sales, and scores how far you can trust your numbers out of 100.

explain: |
  Ad platforms mark their own homework. Meta may say it drove half your sales while your profit says otherwise. A post-purchase survey, the short questions on your checkout success page, asks buyers directly where they heard of you. The answers are a second view of the same sales.

  This skill sorts the answers into channels, then lines up three shares for each channel: its share of your ad spend, its share of survey answers and its share of sales the platform reports. Where they disagree, it flags the channel as over-credited or under-credited and suggests a small budget move to test. It also tracks word of mouth, reads hard-to-track spend like podcasts, and flags unusually big orders. Buyers remember the most memorable ad, so use the survey beside the platform data and not in place of it.

when:
  - Your ad platform reports more sales than your store shows, and you can't tell which channel is padding its numbers.
  - You spend on podcasts, events or creators and can't see their effect in your ad reports.
  - You're about to move budget between channels and want a second view first.

you_give:
  - Survey answers to "how did you hear about us", with order dates (names and emails removed)
  - Ad spend by channel for the same dates
  - Sales each platform reports, by channel (optional)
  - Your profit or P&L for the period (optional)
you_get:
  - A table of spend share, answer share and platform share for each channel
  - A read on which channels are over- or under-credited
  - Small budget moves to test for one week
  - A trust score out of 100 with the sum shown

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your survey answers with order dates, after removing names and emails.
  - Paste your ad spend by channel and, if you have it, the sales each platform reports for the same dates.
  - Try one small budget move for a week, then watch the survey shares and your profit, not the daily ROAS.

how_it_works:
  - title: Counts the answers
    text: It states how many replies you have and what share of orders answered. Under about 200, the read is called rough.
  - title: Sorts into channels
    text: Free text is grouped into Meta, TikTok, search, YouTube, podcast, email, word of mouth and other.
  - title: Compares the shares
    text: Each channel's share of spend against its share of answers, once over all answers and once over paid channels only.
  - title: Adds the platform view
    text: Platform-reported sales share goes beside the other two. A big gap marks a channel as over- or under-credited.
  - title: Decides what to trust
    text: The survey for where buyers first heard, the platform for comparing ads inside one channel.
  - title: Picks a small test
    text: A small slice of budget moves for one week. You watch the survey shares and profit, not daily ROAS.
  - title: Tracks word of mouth
    text: A rising share of answers means organic reach is carrying part of what paid ads get credit for.
  - title: Flags big orders
    text: Unusually large orders go to a person to ask why, since they may be an event or a reseller.
  - title: Scores trust
    text: Survey against spend 40, number of replies 30, platform against survey 30. The weights are a starting point.

output_shape: |
  SURVEY READ  <date range> | orders <n> | replies <n> (<% of orders>)

  CHANNEL   SPEND SHARE   ANSWER SHARE (all)   ANSWER SHARE (paid only)   PLATFORM SALES SHARE   READ
  <channel> <%>           <%>                  <%>                        <%>                    <over-credited | fair | under-credited>

  WORD OF MOUTH  <% of answers> | trend: <up | flat | down by week>
  HARD-TO-TRACK SPEND  <event or episode>: <seen in answers | not seen>
  BIG-QUANTITY BUYERS  <order, quantity, send to a person to ask why>

  MOVES TO TEST
  1 <from channel> to <to channel>: <amount> for <one week> | watch: <survey share, P&L>

  TRUST SCORE  <n>/100 (survey vs spend + volume + platform vs survey). Weights are a starting point.

  MISSING: <survey answers | spend by channel | platform sales | P&L>

tweaks:
  - what: Number of replies
    how: More replies make a firmer read. Paste the full set for the period, and say how many orders it covers.
  - what: Date range
    how: Use the same dates for spend, platform sales and answers. A mismatch makes the shares meaningless.
  - what: Channel groups
    how: Say how to group channels, such as Instagram and Facebook together as Meta, so the shares match your spend report.
  - what: Budget move size
    how: The default is a small slice, about a tenth of a channel's spend, for one week. Say if you want a smaller test.

judge:
  - It states the number of replies and the share of orders that answered.
  - Spend, answer and platform shares use the same channel groups.
  - A channel is called over-credited only when its platform share is well above its survey share.
  - The budget move is small and has a watch list for one week.
  - No buyer's name or email appears in the output.

test:
  - Paste answers where Meta gets 50 percent of answers and 50 percent of spend. It should call Meta fair.
  - Paste only 30 replies. It should call the read rough.
  - Remove the platform sales. It should skip that part and still score the rest.
  - Run it twice on the same data. The channel shares should match.

improve:
  - Add your own channel list and groupings to the skill file, so free-text replies always sort the same way.
  - Add the names of your podcasts, events and creators, so it can look for them in the answers.
  - Change the score weights if one part matters more, such as response volume for a small store.
  - Pair it with the platform ROAS reality check and the post-purchase survey builder.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "It can sort free-text answers into channels and compare the shares for you."}
    - {name: "Shopify", why: "Checkout survey apps run on the order status page and give you the answers with order dates."}
    - {name: "Slack", why: "A simple connection can post each new survey answer to a team channel."}
  inputs:
    - "Your ad spend by channel for the same weeks"
    - "Sales each ad platform reports, by channel"
    - "Your profit and loss by week, to check what a budget move did"

terms:
  - term: Over-credited channel
    meaning: A channel whose platform reports far more sales than buyers say it earned.
  - term: Share of answers
    meaning: The part of all survey replies that name one channel.
  - term: Word of mouth
    meaning: Buyers who say they heard from a friend or another person, not an ad.
