new_slug: premium-positioning-mapper
name: Premium positioning mapper
summary: Map premium positioning for each buyer group. Get three lines to test, the proof you need and a price table, so you can hold a higher price.
job: brand-file
thinking: medium
thinking_why: It writes angles for several buyer groups and checks the price sums, so a mid-size model works and a stronger one finds sharper angles.
headline: Premium positioning mapper
subhead: Share product facts, buyer evidence, current prices and costs. It drafts what could feel special to each group and links each line to proof. Get three lines per group, ad ideas and a price table where inputs allow. Buyer reactions remain untested. Zero, loss or missing contribution leaves the sales target unresolved or not meaningful.
explain: |
  Premium positioning is a proposal about what buyers value and what the product can prove. It cannot make an unsupported claim true or show that buyers will accept a higher price. Discount advice and large-brand examples are starting points to test, not results for your store.

  This skill drafts angles for each buyer group, records proof needs and suggests lines to try. The price table shows contribution after the stated unit costs. A sales-volume target needs a positive baseline and positive contribution at the test price. Losses and missing costs stay visible. The table is a scenario, not a forecast of demand or complete company profit.
when:
  - You want to raise prices or stop relying on sales, and need a reason a buyer will accept.
  - You sell the same product to different kinds of buyers and one message does not fit them all.
  - You are about to brief creators or write ads and want a story that does not lean on a discount.
not_for:
  - Your product sells on price alone, like a commodity. Compare costs and rival prices in a spreadsheet, or ask a pricing adviser.
  - Your store cannot control its range, brand or where it sells. Fix that first, because a premium story needs you to back it up.
  - You need facts on what your brand stands for first. Build your brand brain with the Website brand brain builder, then come back.
you_give:
  - Your product and current price
  - Two to four buyer groups, with how well each knows you and your rivals
  - Reviews or buyer interview notes (optional)
  - Landed cost, fulfilment, fees and returns allowance at each price, up to two higher test prices, plus current units and their period
  - Rival prices and what rivals claim (optional)
you_get:
  - Per group, what feels exclusive, the identity they want and the story that links product to life
  - Three draft lines per group, with provisional ratings to check with real buyers
  - Ad ideas that carry the story without a discount, and a list of what not to say
  - A unit-contribution table, supported sales target or gap, separate brand-fit conclusion and a test plan
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product, price and buyer groups. Add real review lines or interview notes for each group if you have them.
  - Add your landed cost, fulfilment cost and the higher prices you want to test.
  - Test the best line per group with 2 or 3 buyers before you spend on ads.
  - Keep a control at your old price when you try a higher one.
output_sample:
  input:
    - Your product and current price
    - Two to four buyer groups and how well each knows you
    - Your landed cost, fulfilment cost, fees and returns allowance at each test price
    - Reviews or buyer interview notes (optional)
    - Rival prices and what rivals claim (optional)
  prerequisites:
    - Your brand brain from the Website brand brain builder helps, but is optional
  output:
    - name: Group blocks
      contains: "For each buyer group: what feels exclusive, the identity they want, the story, and who may appear."
    - name: Three draft lines per group
      contains: Lines to test, with provisional ratings that are not real buyer tests.
    - name: Ad ideas and DO NOT SAY list
      contains: Ads that carry the story without a discount, plus claims to avoid and a rule for when a sale is allowed.
    - name: PRICE CHECK
      contains: Contribution per unit at the current and higher test prices, and a sales target when the inputs allow it.
    - name: BRAND FIT
      contains: Whether the proposed claim is consistent, inconsistent or unresolved against your brand.
    - name: FREE IDEA + PAID KEEPSAKE
      contains: A proposal for a free idea paired with a paid keepsake.
    - name: TEST PLAN
      contains: Real buyer conversations and a measured comparison against a control price.
    - name: MISSING / CHECKS MISSED
      contains: Inputs you did not give and checks the skill could not run.
how_it_works:
  - title: Checks the fit
    text: Stops early when the product sells on price alone or the store cannot control its brand.
  - title: Maps what exclusive means
    text: Uses buyer words where available. Inferred group needs stay marked for real conversations.
  - title: Finds the unused angle
    text: A true quality rivals do not claim, with proof. Exclusivity comes from the story, not from running out of stock.
  - title: Writes identity and story
    text: Who the buyer wants to be seen as, and the life moment that puts the product in a world.
  - title: Picks real people
    text: Instructors, customers, community leaders or the founder, with consent. No made-up experts.
  - title: Reviews three draft lines
    text: Rates want, identity and memory as editorial judgments from the evidence. These ratings are not completed buyer tests.
  - title: Plans ads without a discount
    text: Ad ideas, a do-not-say list and a rule for when a sale is allowed.
  - title: Checks the price
    text: Shows complete stated costs and contribution at each higher test price. A whole-unit target is calculated only with a positive baseline and positive new contribution; brand fit is a separate judgment.
output_shape: |
  PREMIUM MAP: <product, current price, fit and evidence limits>
  GROUP <name> | awareness <evidence or inferred>
  exclusive means <evidence or hypothesis> | angle <true quality and proof needs>
  identity <proposed> | story moment <proposed> | real people <consenting people only>
  lines 1 to 3 <drafts and provisional editorial ratings, not completed buyer tests>
  ad ideas <without unsupported claims or fake scarcity>
  DO NOT SAY <reasons> | DISCOUNT RULE <source-limited proposal>
  PRICE CHECK <period, currency and current unit count>
  <current and higher test prices> | complete stated unit costs | contribution <amount or unresolved> | target <exact positive-input quotient and whole units rounded up, or zero/loss/missing reason>
  BRAND FIT <consistent, inconsistent or unresolved with proposed claim>
  FINANCIAL SCENARIO <positive, zero, loss or unresolved>; this is not actual demand or complete company profit
  FREE IDEA + PAID KEEPSAKE <proposal>
  TEST PLAN <real buyer conversations and a measured comparison at the control price>
  MISSING / CHECKS MISSED <list>
tweaks:
  - what: How well you know each buyer group
    how: Paste real review lines or interview notes for each group. With none, the groups are guesses and are marked [inferred]. Talk to 2 or 3 buyers before you use any line.
  - what: The proof behind your angle
    how: Give test results, materials, make process, awards or numbers you can show. The angle is only as strong as the proof you can put next to it.
  - what: The test prices
    how: Give the exact higher prices, current units and period. Include landed cost, fulfilment, fees and returns at each price. Missing costs are not zero, and a price-linked fee can change between rows.
  - what: Your category's price band
    how: Add the prices of four or five rivals. The skill stays inside the band shoppers know and looks for the premium in content, pack and where you sell.
  - what: Who is allowed to appear
    how: Say which real people (customers, staff, the founder, local experts) agree to appear. The skill builds the story around them and nobody invented.
judge:
  - Each group has its own idea of exclusive, written the way that group talks.
  - The unused angle is true and has proof named beside it.
  - Every line has provisional ratings and evidence limits. Actual buyer responses are recorded only when a real test took place.
  - No line uses fake scarcity, a made-up expert or a health, money or legal claim without a check note.
  - The table shows currency, period, costs and contribution. A sales target uses positive baseline and new contribution only, with whole units rounded up; losses, zeros and missing inputs are not forced into a target.
test:
  - Pick one buyer group you know well and read its block. If you would not recognise your own customer in it, add real quotes and run it again.
  - Show the three lines for one group to 2 or 3 people who buy from you. Ask which they would repeat to a friend, and keep the one they pick.
  - Run it twice on the same input. The groups and angles should stay close. If they swing a lot, the buyer descriptions are too thin.
  - Try the higher price on a small share of traffic and keep a control at the old price. Compare orders and profit, not only conversion rate.
  - Use current 100 units at price 30 and cost 25. At higher price 35 with cost 35, or price 40 with cost 45, give no profitable sales target.
  - With positive baseline contribution 500 and new contribution 7, show exact target 71.428571 and whole-unit target 72, as a scenario only.
  - "Omit current units or a required cost: leave the affected target missing. Keep a loss baseline separate rather than creating negative units."
improve:
  - Add the claims you may never make (health, income, before and after) to the "do not say" step so every run starts with them.
  - Save the group blocks you keep to your brand file, so ads, emails and product pages use the same identity and story.
  - Add your own test of "will they remember it", such as asking five people to repeat the line a day later.
  - Pair it with the Store promise writer to write the homepage promise, and with the Brand stylescape planner to turn the story into a look.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Any current chat AI can run this. Paste your reviews and notes into the chat.
    - name: Google Sheets or Excel
      why: Keeps the price table so you can change costs and test prices and see profit per unit move.
  inputs:
    - Interview notes from five buyers who paid full price
    - Reviews that mention why the buyer picked you over a rival
    - A list of four or five rivals with their prices and main claim
    - Photos or video of the real people who could appear in the story
terms:
  - term: Landed cost
    meaning: What one unit costs you once it is in your hands, including the product, shipping in and duties.
  - term: Control price
    meaning: The old price kept as a baseline for a planned comparison. A control price alone does not remove all other differences or prove the cause of a sales change.
  - term: Price band
    meaning: The range of prices shoppers in a category already expect to pay.
