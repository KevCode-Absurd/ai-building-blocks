new_slug: prepaid-plan-ltv-modeler
name: Prepaid plan LTV modeler
summary: Compare twelve-month profit for one-time sales and 3-order or 6-order prepaid plans. Give your prices, costs and discounts. See where your data has gaps.
job: keep-customers
thinking: medium
thinking_why: The work is a set of sums on your numbers, so a mid-level model is enough. Check one segment by hand.
headline: Prepaid plan LTV modeler
subhead: Share prices, costs, planned discounts and the store’s repeat-order data. It compares contribution per order and per customer over twelve months, then reviews customer mix and cash obligations. Get scenario tables and custom planning points. Upfront cash is not profit. Zero, loss or missing inputs block affected targets, and borrowed renewal figures remain test assumptions.
explain: |
  Prepayment creates an obligation to deliver. It does not guarantee completed orders, renewals or profit. A deeper discount can increase losses if it leaves no positive contribution after costs. The timing of deliveries, refunds and fees matters as well as the price.

  This skill compares one-time and prepaid scenarios over twelve months. It uses a valid cohort, a stated delivery schedule and complete costs, then checks customer mix and cash timing. A parity target is shown only when the baseline and plan contribution are positive. Custom points describe the scenario and evidence; they cannot make a loss-making plan profitable. Provider examples stay labelled until replaced by real data.
when:
  - You sell a repeat-use product and want to compare a three-order or six-order prepaid plan.
  - Someone says a prepaid discount is too deep and you want to see the whole picture.
  - You want customers to fund part of your next stock order.
not_for:
  - "You sell a one-off product that people buy once: use a simple margin check on one sale, since a prepaid plan has nothing to repeat."
  - "You only want to plan stock timing and cash: use the Inventory cash planner."
  - "You want to compare other ways to raise cash: use the Cash lever ranker."
you_give:
  - Prices, product and fulfilment costs, plus fees and refund allowances at each plan price
  - The discount you plan for each plan, such as 25 percent for 3 orders
  - A dated twelve-month cohort with customer and completed-order counts, and the basis of any repeat-order shares
  - What share of buyers you could move to each plan
  - Your re-enrol rate for plans, if you have run any (optional)
  - The delivery schedule, refund and cancellation assumptions, cash timing and prepaid obligations
you_get:
  - Contribution per order and expected per customer within twelve months
  - A supported whole-order parity target, or a zero, loss, missing or inapplicable reason
  - A valid customer-mix scenario and a separate cash-versus-obligations view
  - Custom planning parts with evidence gaps and a proposed test
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your price, costs and planned discounts. Attach your cohort table, or say that you have none.
  - Say how many buyers you think you could move to each plan.
  - Check contribution, data gaps and the delivery schedule before interpreting the custom points. A failed financial gate is not overridden by a high score. Agree on an appropriate test before committing.
  - Ask how the cash collected up front should be booked, from your accountant.
output_sample:
  input:
    - Your prices, product and fulfilment costs, fees and refund allowances
    - The discount you plan for each prepaid plan
    - A dated twelve-month cohort of one-time buyers with completed-order counts
    - The share of buyers you could move to each plan
    - Your delivery schedule, cash timing and prepaid obligations
  output:
    - name: Per order
      contains: Price after discount, costs, fees, refunds and contribution for each group, with missing inputs marked.
    - name: Orders
      contains: The cohort count, completed orders and delivery schedule behind each scenario.
    - name: Twelve-month contribution
      contains: One-time, three-order and six-order amounts, with absolute changes and uplift when the baseline is positive.
    - name: Contribution parity
      contains: The orders a plan needs to match one-time profit, or the reason there is no target.
    - name: Mix
      contains: Your share of buyers per plan, a sum check and the weighted contribution.
    - name: Cash
      contains: Dated net receipts against stock cost, plus remaining fulfilment, fee and refund obligations.
    - name: Custom points
      contains: Five planning parts scored up to 20 each, with missing checks and a financial gate.
    - name: First test
      contains: The group, schedule, assumptions and limits for a small trial of one plan.
how_it_works:
  - title: Finds profit per order
    text: Subtracts stated costs from the price after discount. Product and fulfilment assumptions are explicit; price-linked fees and refunds are calculated for each group.
  - title: Counts orders in a year
    text: Uses a positive cohort denominator and expected completed deliveries within twelve months. Prepaid obligations and re-enrol rates do not alone prove the count.
  - title: Works out LTV
    text: Multiplies expected twelve-month orders by unit contribution. Absolute changes are shown; percentage uplift needs a positive baseline.
  - title: Checks contribution parity
    text: Divides a positive baseline by positive plan contribution, then rounds up for whole orders. Zero or negative plan contribution gives no profitable target; this is not complete business break-even.
  - title: Weights by your mix
    text: Requires known comparable group values and nonnegative shares that sum to one. Invalid or missing mix inputs stay unresolved; they are not silently normalized.
  - title: Checks cash
    text: Compares dated net cash with stock costs and separately shows remaining fulfilment, fee and refund obligations. Cash covering stock is not proof of profit or full funding.
  - title: Suggests design ideas
    text: Stepped discounts, a pause option, a default to subscribe. Vendor claims are marked.
  - title: Scores it
    text: Five custom parts each stay between zero and 20. Missing parts stay missing beside a subtotal. Points are not calibrated viability or launch clearance.
output_shape: |
  PREPAID PLAN CHECK <product, dates, currency and stated twelve-month window>
  PER ORDER <price after discount, product, fulfilment, fees, refunds and contribution for each group; missing inputs stay marked>
  ORDERS <positive cohort denominator, completed orders, delivery schedule and stated scenario assumptions>
  TWELVE-MONTH CONTRIBUTION <one-time, three-order and six-order amounts> | absolute changes <amounts> | uplift <positive baseline only, otherwise not meaningful>
  CONTRIBUTION PARITY <exact positive-input quotient and whole orders rounded up, or zero/loss/missing/inapplicable reason>; not full business break-even
  MIX <shares and sum check> | weighted contribution <known or unresolved> | absolute change <amount> | uplift <positive baseline only>
  CASH <dated net receipts versus stock cost> | remaining fulfilment, fee and refund obligations <amounts or missing>; not profit or full funding
  CUSTOM POINTS <bounded known parts and supported total or subtotal> | missing checks <list> | financial gate <positive, zero, loss or unresolved>
  DESIGN IDEAS <vendor claims labelled, actual rules still need checks>
  FIRST TEST <group, schedule, assumptions, outcomes and limits>
  ACCOUNTING REVIEW <prepaid receipts and obligations>
  MISSING / CHECKS MISSED <list>
tweaks:
  - what: Retention from your own store
    how: Give a cohort table for one-time buyers. It is the number that matters most, and it moves the score.
  - what: The depth of discount
    how: Recalculate unit contribution at each discount. At zero or negative contribution, more orders cannot match a positive baseline; do not show a profitable parity target.
  - what: The share you can move
    how: Use an explicit mix of mutually exclusive groups. Shares must be known, nonnegative and sum to one. Do not normalize an invalid mix or call the example share realistic for your store.
  - what: Plan length
    how: Compare orders expected within the same twelve-month window under the delivery schedule. A longer prepaid obligation does not guarantee more completed orders in that period.
  - what: Re-enrol rate
    how: Use the store’s dated rate and cycle schedule. A re-enrol rate alone does not determine the number of completed orders; borrowed figures are separate scenarios.
judge:
  - Product and fulfilment assumptions are explicit, and price-linked fees and refunds use each scenario price. Missing costs are not zero.
  - Cohort denominators are positive, repeat-order share definitions are clear, and expected completed orders fit the twelve-month schedule.
  - Contribution and uplift use valid inputs; no percentage is forced from a zero or loss baseline.
  - Vendor examples remain labelled scenarios rather than store facts.
  - Known custom parts stay zero to 20; missing parts remain visible. Points cannot override nonpositive unit contribution.
  - The terms shown to buyers are clear about charges, delivery obligations, renewal, cancellation and refunds.
  - Customer-mix shares sum to one without silent normalization. Cash covering stock is separate from full funding and profit.
test:
  - Run it with only your one-time numbers and no plan. LTV should match what your cohort table gives.
  - Run it twice with the same inputs. The LTV and the score should match.
  - Change the discount from 25 to 15 percent and see that profit per order and break-even both move the way you expect.
  - Check one group by hand, as orders times profit per order.
  - "Use price 80, cost 34, one-time orders 1.2 and a 70% plan discount: plan contribution is minus 10 per order. Give no negative parity target or locked-order win."
  - "Use positive baseline 55.2 and plan contribution 26: exact parity is about 2.1231 orders, so three whole completed orders, as a scenario only."
  - "Use zero customers, a missing cost or a zero baseline: leave affected ratios or uplift undefined rather than zero."
  - "Use mix shares 0.85, 0.10 and 0.10: sum 1.05 is invalid. Stop the weighted result without normalization."
improve:
  - Save your price, cost per order and cohort table in the skill file so each run is faster.
  - Set explicit business limits in addition to the method’s required positive-contribution and missing-input gates. Custom points are not a substitute for those limits.
  - After a test, add your real re-enrol rate and retention to replace the test values.
  - Pair it with the Inventory cash planner for stock timing and the Cash lever ranker for other cash moves.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Any chat AI can do the sums. Check one group by hand.
    - name: Shopify
      why: Its cohort report shows how often one-time buyers come back.
    - name: A subscription app for your store
      why: Runs the prepaid plan and reports re-enrol and cancel rates once you test.
  inputs:
    - A cohort report for the last 12 months
    - Your current cost per order from your 3PL or packer
    - Refund and chargeback rates
    - Your payment provider's rules on prepaid and recurring charges
terms:
  - term: Prepaid plan
    meaning: The buyer pays up front for several orders, such as 3 or 6, usually at a bigger discount, and gets them over time.
  - term: LTV
    meaning: Lifetime value. This skill models only a stated twelve-month contribution scenario after the included costs; it does not forecast an unlimited lifetime or complete company profit.
  - term: Re-enrol
    meaning: When a buyer signs up for another round of the plan once the first one ends.
  - term: Working capital
    meaning: The cash you need to run the business day to day, including the cash tied up in stock.
