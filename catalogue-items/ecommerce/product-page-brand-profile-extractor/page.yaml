new_slug: product-page-brand-profile-extractor
name: Product page brand profile extractor
summary: "Turn one product page into a brand profile: product facts, claims, six colors and visual style, with gaps flagged. Works from a link or pasted text."
job: brand-file
headline: Product page brand profile extractor
subhead: Share product page or pasted page text, brand assets and approved facts. Get a source-linked product and brand profile with six color roles.
explain: |-
  Read a product page and build a sourced brand profile with product facts, claim limits, colors and visual rules.

  It pulls out the price, features, claims, testimonials and authority markers, then picks six colors: primary, secondary, accent, background, text and product. Colors are estimates read from the image, so check them against your brand guide. It then sets a visual style for your category and suggests three themes for ads.
when:
  - You are starting ad briefs and want the product facts, claims and colors in one profile.
  - A new product page needs its claims and visual style written down before you brief a designer.
  - You want to see which claims and testimonials the page really makes.
not_for:
  - "Your page has no product text, or you have no approved facts: write a plain product-copy brief by hand first."
  - "You need a full brand voice and customer guide from your whole site: use an org context builder, not one product page."
  - "You need exact brand colors from a style guide: ask your designer for the real hex codes."
you_give:
  - Product page or pasted page text
  - Brand assets and approved facts
you_get:
  - A source-linked product and brand profile with six color roles
  - The sources used, missing inputs and assumptions
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste this skill.
  - Add your product page link. If your AI can't open links, paste the page text instead.
  - Add your brand name and category if the page doesn't make them clear.
  - Read the profile. Check that every testimonial and claim appears on the page.
  - Check the hex codes against your real brand colors. They come from the page and image.
  - Use the profile as the base for ad briefs, copy and images.
output_sample:
  input:
    - Your product page link, or the page text pasted in
    - Your brand name (optional)
    - Your product category (optional)
  prerequisites:
    - Your AI needs web access to read a link. If not, paste the page text.
  output:
    - name: Product
      contains: Product name, price, category and link, pulled from the page.
    - name: Description and key features
      contains: A cleaned product description and a short list of features.
    - name: Marketing intelligence
      contains: Core mechanism, claims, testimonials, objections, audience, authority markers, positioning, selling points and emotional triggers.
    - name: Color palette
      contains: "Six colors with hex codes: primary, secondary, accent, background, text and product color."
    - name: Visual vocabulary
      contains: Backgrounds, lighting, props, mood, photo style, textures, color temperature and negative space.
    - name: Recommended themes
      contains: Three creative themes, each with a short reason based on the brand and audience.
how_it_works:
  - title: Check the inputs
    text: Confirm product page or pasted page text, brand assets and approved facts. Mark facts that are missing.
  - title: Read the page
    text: Paste the product link. If your AI cannot open it, or the store blocks it, paste the page text instead.
  - title: List the facts
    text: Pull out the name, price, description and features. Anything the page does not show is marked missing.
  - title: Separate claims from proof
    text: List what the page claims, which testimonials it shows and any press or certifications. Claims are kept as claims, not proof.
  - title: Estimate six colors
    text: Pick primary, secondary, accent, background, text and product colors from the image. Each hex code is labelled an estimate.
  - title: Set the visual style
    text: Write backgrounds, lighting, props, mood and photo style that fit your category.
  - title: Suggest three themes
    text: Give three ad themes, each with a short reason based on the brand and audience.
  - title: Review the result
    text: Return a source-linked product and brand profile with six color roles. Check facts, math and the decisions before any action.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
