new_slug: product-page-gallery-planner
name: "Product page gallery planner"
summary: "Plan your product page gallery image by image. Give it product facts, reviews and photos. You get an 8-image plan with sourced words and a gaps list."
job: product-photos
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Product page gallery planner"
subhead: Give it your product facts, reviews and photos. It scores the questions shoppers ask, keeps the ones a picture answers best, and plans each image with its message and sourced words. You get a score table, image cards and a gaps list.

explain: |
  Most product page galleries are five versions of the same pack shot. They answer "what is it" and leave shoppers guessing how big it is, how to use it and what happens if they don't like it. Shoppers go to the images first, and many try to judge size from them, so a missing size image costs sales.

  This skill doesn't fill a fixed template. It scores every likely shopper question 0 to 2 on three things: how often your customers ask it, whether a picture answers it better than a sentence, and whether you have the photo and the facts. The highest scores get a slot. The first image is always the product, the second answers your biggest doubt, and every set has a size image. Anything you can't prove becomes a gap to fill, never an invented line.

when:
  - Your product page gallery is mostly pack shots and you want it to answer shoppers' questions.
  - You're launching a product and need to brief a designer or an AI image tool on every image.
  - Customers keep asking the same things (how big, how do I use it) and you want the images to answer them.
not_for:
  - "You need one single product photo made: brief a photographer or designer, or use your image tool directly."
  - "You have no photos, facts or reviews yet: gather them first, because the plan marks every missing proof as a gap."
  - "You already have finished gallery images and want them checked: use the Product page image checker."
  - "You want a quick first pass with fewer checks: use the Product page photo planner."
  - "You want the images built and numbered with alt text, not just a plan: use the Product gallery image planner."

you_give:
  - Product facts (name, variant, price, how it's used, ingredients or materials with amounts, size, what's in the box)
  - Claims with sources, reviews word for word, rating counts and guarantee terms
  - Your product photos, labelled by job (front, in hand, in use, close-up and so on); attach them, since your AI can see pictures
  - The worry customers raise most, in their words (optional)
  - Whether the gallery is for a marketplace (optional)
you_get:
  - A score table showing why each image made the cut, or didn't
  - One card per image in upload order (question, message, photo, layout, words with sources)
  - A gaps list of every missing fact and photo, and which image waits on each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, guarantee and a handful of real reviews, copied exactly.
  - Attach your photos and say each one's job (front, in hand, in use, close-up).
  - Add the worry you hear most, in a customer's words, if you know it.
  - Read the gaps list first. Fill the gaps or accept the swaps, then hand the cards to your designer or image tool.
output_sample:
  input:
    - Your product facts (name, price, size, how it is used, what is in the box)
    - Your claims with sources, plus reviews copied word for word
    - Your product photos, each labelled by job (front, in hand, in use, close-up)
    - The worry customers raise most, in their words (optional)
    - Whether the gallery is for a marketplace (optional)
  prerequisites:
    - An AI that can read attached pictures, so it can sort your photos by job
  output:
    - name: KIND
      contains: The one or two kinds your product fits, such as worn, held and used, or goes on the body.
    - name: SCORES
      contains: A table scoring each image type on how often it is asked, picture strength and proof, with its slot, gap or cut.
    - name: CARD
      contains: One card per image with the question, message, photo, layout, sourced words, proof level and likely mistake.
    - name: GAPS
      contains: Each missing fact or photo, with the image that waits on it.
    - name: CHECKS MISSED
      contains: Any quality checks the plan could not pass, or the word none.

how_it_works:
  - title: Names the kind of product
    text: Goes in or on the body, worn, held and used, lives in a room, or fits with something else. Two kinds are allowed.
  - title: Lists the candidates
    text: 18 image types in five families, from "what is it?" to "can I trust it?".
  - title: Scores each one
    text: 0 to 2 for how often it's asked, whether a picture beats words, and whether you have the proof. No proof means a gap, not an image.
  - title: Fills the slots
    text: Product first, biggest doubt second, at least one size image, each question once. Eight images unless proof runs out.
  - title: Bends to your product
    text: A supplement shows ingredients with amounts; clothing shows fit on a body with the model's size; a part shows what it fits.
  - title: Writes one card per image
    text: Question, message, photo, layout, every word with its source, and the likely mistake. Words are fixed now.
  - title: Handles marketplaces
    text: For a marketplace, image 1 follows its plain main-image rules and your own first image moves to second.

output_shape: |
  KIND: <one or two kinds>

  SCORES  (asked + picture wins + proof = total)
  <type> <a>+<p>+<pr> = <total>  -> slot <nn> | gap | cut

  CARD <nn>-<type>
  question: <the shopper's question>
  message:  <one line>
  photo:    <which real photo, by job>
  layout:   <where the product sits; where words sit>
  words:    "<line>" (source: <where it came from>)
  proof:    <have | partial | NEED>
  watch:    <the likely mistake>

  (one card per image, in upload order)

  GAPS
  NEED: <fact or photo> -> <which image waits on it>

  CHECKS MISSED: <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Product: Sprout Original (Adults), Low Sugar, pouch of 28 daily
    packs. One pack a day, about 20 g, "a small handful" of gummies.
    Tear the pack across the top, tip the gummies into your palm.
    Facts: "60+ ingredients, 21 vitamins & minerals, and 6g fiber" per
    pack; vitamin C 93 mg, D3 20 mcg, B12 2.4 mcg, folate 400 mcg DFE.
    Study: 2025, 12 weeks, randomized, double-blind, placebo-controlled,
    120 healthy adults aged 23 to 59. Blood vitamin C +40.1%, folate
    +20.5%. Third-party tested for 70 pesticides and 4 heavy metals.
    Price: renews at $49.99 every 4 weeks ($1.78/day).
    Guarantee: 30-day money-back, "This policy applies only to your
    initial purchase."
    Ratings: 4.8 from 100,000 (header); 4.75 from 109,639 (widget).
    Photos: pouch front on; gummies in an open hand.
    Doubts: "A gummy can't hold enough to replace my powder." (most
    common) / "Will the price jump after the first order?" / "Is this
    just candy?"
  output: |
    KIND: goes in or on the body

    SCORES  (asked + picture wins + proof = total)
    Main          2+2+2 = 6  -> slot 01
    Made of       2+1+2 = 5  -> slot 02 (biggest doubt)
    Cost per use  2+1+2 = 5  -> slot 03 (answers "price jump?")
    Tested        1+1+2 = 4  -> slot 04 (answers "just candy?")
    Scale         1+2+1 = 4  -> slot 05 (gummies in hand only)
    Promise       1+0+2 = 3  -> slot 06
    Steps         1+2+0 = 3  -> gap (no daily pack photo)
    What arrives  1+2+0 = 3  -> gap (no daily pack photo)
    Voices        1+1+1 = 3  -> gap (rating source unclear)
    Side by side  1+1+0 = 2  -> cut (no current source for both sides)

    CARD 02-made-of
    question: Can a gummy hold enough?
    message:  One small pack carries a full day's list
    photo:    gummies in an open hand
    layout:   hand left, three short lines right
    words:    "60+ ingredients" / "21 vitamins & minerals" / "6g fiber"
              (source: product page, per pack)
    proof:    have
    watch:    per pack, never per gummy

    CARD 03-cost-per-use
    question: Will the price jump after the first order?
    message:  The renewal price, said plainly
    words:    "$49.99 every 4 weeks" / "$1.78 a day" (source: plan box)
    proof:    have
    watch:    show the renewal price, not only the first-order price

    CARD 04-tested
    question: Is this just candy?
    message:  Tested for absorption in a real study
    words:    "Clinically tested for nutrient absorption" / "Vitamin C
              +40.1%" / "Folate +20.5%" / small print "2025
              placebo-controlled study, 12 weeks, 120 healthy adults"
              (source: science page)
    proof:    have
    watch:    the study measured two vitamins in the blood. No energy
              or immunity claims. FLAGGED: seller to check health-claim
              rules before publishing

    Also planned: 01 main (pouch front on), 05 scale (small handful in
    a palm), 06 promise ("30-day money-back guarantee on your first
    order"; "first order" must stay).

    GAPS
    NEED: daily pack photo, whole and torn at the top -> steps, what
      arrives
    NEED: one rating and its source (4.8 from 100,000 or 4.75 from
      109,639) -> voices
    NEED: pouch in a hand -> a stronger scale image
    Six images now. Fill the first gap and steps and what arrives join.

    CHECKS MISSED: none

tweaks:
  - what: The biggest doubt
    how: Give the worry customers raise most, word for word. It takes slot 2, so the first image a shopper swipes to answers it.
  - what: The number of images
    how: Ask for 6 or 10 instead of 8. The score table decides what goes in or out.
  - what: Marketplace or your own store
    how: Say "marketplace" and slot 1 becomes the plain main image that platform asks for, with your own first image moved to slot 2.
  - what: The kind of product
    how: If it guesses wrong, correct it. "Worn" makes a fit guide a must and puts the scale image on a body.

judge:
  - The score table explains every image that made the cut and every one that didn't.
  - Slot 1 is the product, slot 2 answers the biggest doubt, and at least one image shows size.
  - Every number on a card has its unit and a source; every rating has its count.
  - Reviews are copied exactly, with the reviewer's published name.
  - The gaps list is honest. A missing review is a NEED line, not a made-up quote.

test:
  - Run it on a product you know well. Compare its top-scored questions with what customers email you. A big question scored low means you didn't give it that evidence.
  - Run it twice with the same facts. Slot 2 should answer the same doubt both times. If it changes, give the doubt word for word.
  - Check every number and quote on the cards against your label and your reviews. Nothing without a source should be on an image.
  - Read only the messages, in order, to someone who doesn't know the product. They should be able to say what it is, how big it is and what it costs.

improve:
  - Add questions your category always gets to the table in step 2, such as "does it fit my model?" for parts.
  - "Add your biggest doubt, in a customer's words, to step 4 as a fixed line (for Sprout: \"A gummy can't hold enough to replace my powder\")."
  - If you sell on a marketplace, paste its main-image rules into step 7.
  - Save the finished cards in your org context. When you remake the gallery, rescore only the questions with new evidence.
  - Pair it with the skill that writes down exactly how your product looks, and the one that checks the finished images against this plan.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "The scoring is simple sums, so any current chat AI can run it. Attach the photos so it can sort them by job."}
    - {name: "Google Sheets", why: "Keeps the score table in rows, so you can re-sort it when a new photo or fact arrives."}
  inputs:
    - "Return reasons and pre-sale questions with counts, so the 'asked' scores rest on real numbers"
    - "Your current gallery in upload order, so the plan shows what to keep and what to swap"
    - "For worn products, the model's height and size, so the scale card can state them"

terms:
  - term: Gallery
    meaning: The row of images at the top of a product page that shoppers swipe through.
  - term: Upload order
    meaning: The order the images appear in, starting with the one shoppers see first.
  - term: Scale image
    meaning: A picture that shows how big the product is, next to a hand, a body or a room.
