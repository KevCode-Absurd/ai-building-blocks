new_slug: product-photo-shoot-planner
name: Product photo shoot planner
summary: Plan a product photo shoot where every picture matches. Give it your product photos and colours. You get a style sheet and a prompt for each frame.
job: product-photos
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
headline: Product photo shoot planner
subhead: Attach your product photos and give your brand colours. It writes one style sheet that every prompt repeats, then plans about 9 frames that each differ in job, distance or angle. You get the style sheet, a frame list and one prompt per frame.
explain: |
  Product photos made one at a time rarely match. One is cool and bright, the next warm and dark, the props change, and side by side they look like five different brands. Photographers avoid this with a style guide: a few choices that never change across a shoot.

  This skill writes that style guide first, as six lines: a colour plan, one light setup, one lens feel, two or three surfaces, a small kit of real props and one finish. Every prompt repeats those lines word for word. Then it plans the frames on a grid of job (identity, scale, use and so on), distance and angle, so no two frames are alike. You approve the first frame before the rest are made.
when:
  - You need a set of product photos for a launch, a product page or social, and they must look like one shoot.
  - Your current photos all look different and your grid looks messy.
  - You want a short loop clip of the set for a story or reel.
not_for:
  - You have no true photo of the exact product variant. Take one first, or run the Product image spec writer to write down how the product looks.
  - You want one image ad with a headline and offer. Use the Three-way offer image ad planner.
  - You need a real shoot with a photographer, props and a studio. Hire a photographer, and use this only to plan the shot list.
you_give:
  - Real photos of the exact product and variant
  - Your brand colours as hex codes, your photo style, places and what you never show
  - Where the photos go and in which size (product page 1:1, feed 4:5, stories 9:16)
  - Who uses it, where and when (optional)
  - Whether you want the loop clip, and whether you hold rights to a music track (optional)
you_get:
  - A six-line style sheet for the whole set
  - A frame list, each with its job, distance, angle and what it shows
  - One prompt per frame, plus a check of the whole set side by side
  - An optional plan for a 6 to 8 second loop clip
  - Any check the set still missed, one line each
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Attach your product photos and paste your brand colours with their hex codes.
  - Say where the photos go and in which size, and whether you want the loop clip.
  - Read the style sheet and frame list, change anything you don't want, then say "go ahead".
  - Approve frame 01 (the product alone) before anything else is made.
output_sample:
  input:
    - Photos of your exact product and variant
    - Your brand colours as hex codes, photo style and what you never show
    - Where the photos go and in which size
    - Who uses it, where and when (optional)
    - Whether you want a loop clip, and music rights (optional)
  prerequisites:
    - An AI that can read your attached photos
    - An image tool to make the pictures, such as ChatGPT or Gemini (optional, you can take the prompts elsewhere)
  output:
    - name: Style sheet
      contains: "Six lines that stay the same for the whole set: colour plan, light, lens, surfaces, props and finish."
    - name: Frame list
      contains: Each frame with its job, distance, angle and what it shows, plus any job left out and why.
    - name: Prompts
      contains: One short prompt per frame, with image roles and the style sheet's light and finish lines copied word for word.
    - name: Set check
      contains: A side-by-side check that the product, light and finish match and no two frames are alike.
    - name: Loop clip plan
      contains: A frame order for a 6 to 8 second loop, only if you ask for it.
    - name: Checks missed
      contains: One line for each check the set still fails, or none. Missing facts such as a pack size are marked MISSING.
how_it_works:
  - title: Writes down the product
    text: Records exactly how your product looks from its photos. With no true photo of the exact variant, there's no shoot.
  - title: Picks a colour plan
    text: One of five, such as warm against cool or quiet set and loud product, chosen to keep your product's edge clear.
  - title: Fixes the light and lens
    text: One light setup written like a photographer's note, and one lens feel for the set. Glossy packs get the light moved so it doesn't flare across the label.
  - title: Plans the grid
    text: Each frame is a job, a distance and an angle, and no two frames share all three. Every set has the product alone, a size frame, a close frame and one with space for words.
  - title: Writes the prompts
    text: A short paragraph each, with the role of every attached image and the style sheet's light and finish lines copied word for word.
  - title: Tests, then makes the set
    text: Frame 01 first, for your approval. It then joins every later prompt as the look to match.
  - title: Checks the contact sheet
    text: All frames at phone size. Any frame warmer, cooler or brighter than the rest is remade from the style sheet.
output_shape: |
  STYLE SHEET
  Colour plan: <one of five>, <hex codes>
  Light:       <main light position, size, hard or soft, fill, time>
  Lens:        <lens feel; macro for close frames>
  Surfaces:    <2 or 3>
  Props:       <3 to 5 real things>
  Finish:      <contrast, saturation, grain>

  FRAMES (for your go-ahead)
  01 identity | <distance> | <angle> | <what it shows>  (test frame)
  02 <job> | <distance> | <angle> | <what it shows>
  ...
  Left out: <job, and the missing photo or rule>

  PROMPT, FRAME <nn>
  <image roles>. <scene>. <product, hands, size>. <camera>.
  <light line>. <finish line>. No added words, logos or marks.

  SET CHECK
  <same product? same light and finish? no two alike?>

  CHECKS MISSED: <one line per check still missed, or none>
example:
  business: sprout
  input: |
    [the skill]

    Product: Sprout Original (Adults), Low Sugar. Attached: the pouch
    front on, and gummies in an open hand. Glossy deep green stand-up
    foil pouch, big yellow wordmark, yellow bear face top right. The
    84-pack size is 3 pouches.

    Brand colours: forest green #00582D; deep forest green #002C17;
    cream #FFF7DF (hero background); kelly green #007E40 (buttons);
    sunflower yellow #FFCC2E (stars, badges); plum #581E5A (banner).
    Photo style: bright, sunny, candy-like. Everyday adults at home or
    outdoors. Never clinical, never muted.
    Ingredients include organic kale, spinach and spirulina. "Just grab
    and go."

    For: Instagram feed, 4:5. Photos only.
  output: |
    STYLE SHEET
    Colour plan: warm against cool. The pouch is a cool green, so the
                 grounds are warm: cream #FFF7DF and sunflower yellow
                 #FFCC2E. A green ground would swallow a green pouch
    Light:       large soft window light from 10 o'clock, white card
                 fill at 3 o'clock, bright late morning. The window
                 sits to the side so its shine misses the wordmark
    Lens:        50 to 85 mm full-frame feel; macro for close frames
    Surfaces:    cream plaster wall, pale oak counter, yellow paper
                 sweep
    Props:       loose gummies, fresh kale leaves, spinach leaves, a
                 set of keys, a canvas tote
    Finish:      bright, medium contrast, light film grain

    FRAMES (for your go-ahead)
    01 identity  | mid   | eye level     | pouch alone on the cream
                   sweep (test frame)
    02 scale     | close | high          | a small handful of gummies
                   in an adult palm, pouch soft behind
    03 substance | close | eye level     | three gummies, matte surface
    04 substance | mid   | straight down | pouch with kale and spinach
                   leaves on oak
    05 use       | mid   | eye level     | adult picking one gummy from
                   her palm at the counter
    06 place     | wide  | eye level     | pouch on the counter by keys
    07 range     | mid   | high          | three pouches together (the
                   84-pack)
    08 ad base   | wide  | low           | pouch small, lower right, on
                   yellow, clean space above
    09 use       | wide  | high          | pouch in an open tote with
                   keys on a hall bench
    Left out: arrival (no daily pack photo) and the pouch held up (no
    photo of the pouch in a hand). No pouch size is on file, so the
    prompts state none; check frame 01 against the real pouch.

    PROMPT, FRAME 04
    Image 1 is the real product: copy its shape, colours and printing
    exactly. Image 2 is the approved frame 01, for light and colour
    only. Seen from straight above, the glossy deep green Sprout
    stand-up foil pouch with a big yellow wordmark and a yellow bear
    face top right lies flat and closed on a pale oak counter, with a
    few fresh kale leaves and a small pile of spinach leaves beside it.
    The pouch is about the length of a hand. Camera straight down at
    mid distance, 50 mm feel. Large soft window light from 10 o'clock,
    white card fill at 3 o'clock, bright late morning. Bright, medium
    contrast, light film grain. No added words, logos or marks.

    SET CHECK (after frames 01 to 03)
    Same pouch in every frame? Same light and finish? No two frames
    share job, distance and angle?
tweaks:
  - what: The colour plan
    how: Tone on tone floods one brand colour; warm against cool and opposites play the ground against the product; quiet set, loud product suits clothes and hard goods; small splash keeps things neutral with one patch of colour.
  - what: The light
    how: Name your light in one line, such as "hard sun from the right, late afternoon". It goes into every prompt unchanged.
  - what: The number of frames
    how: Ask for 6 or 12 instead of 9. The grid rules still hold, so a smaller set keeps its spread of distances and angles.
  - what: The loop clip
    how: Ask for it and you get the frame order for a 6 to 8 second loop that cuts on the product's position and starts and ends on frame 01.
judge:
  - The product looks identical in every frame (label, shape, colours, finish).
  - The light, lens and finish lines are word for word the same in every prompt.
  - No two frames share job, distance and angle.
  - Props are real things the product contains or is used with, with no other brand's mark.
  - There are no words in any photo except those printed on the product.
test:
  - Put frame 01 beside your real product photo at full size before you approve it. If the pouch took on the scene's colour, ask for a different colour plan before the set is made.
  - Ask for the frame list twice. The frames can change, but the style sheet should stay the same. If it drifts, paste your own light line.
  - Lay the finished set out in a grid on your phone. Any frame warmer, cooler or brighter than the rest gets remade from the style sheet.
  - Cover the product in each frame and compare the backgrounds. If two look the same, one of those frames has no job of its own.
improve:
  - Write your colour plan and hex codes into step 3 of the skill file (for Sprout, cream #FFF7DF and sunflower yellow #FFCC2E as the grounds).
  - Save your best light line in step 3 too, so every shoot shares it.
  - "Add your rules for showing the product to step 2 (for Sprout: the daily pack torn straight across the top, gummies poured into a palm)."
  - Save the approved frame 01 in your brand file and attach it to every future set for this product.
  - Pair it with the skill that writes down exactly how your product looks, and the one that plans product page images if the photos are going on your product page.
works_best_with:
  tools:
    - name: Nano Banana
      why: Takes up to 6 product photos plus 3 style references, which suits holding one look across nine frames.
    - name: GPT Image
      why: Keeps the product close to your reference photos, and holds small edits across rounds.
  inputs:
    - Photos of the real props and surfaces you own, so repeated props look the same in every frame
    - A screenshot of your current feed grid, so the colour plan sits well next to what's already there
    - A close, straight-on photo of the label, so small print stays right in the close frames
terms:
  - term: Style sheet
    meaning: A few lines that fix the look of a whole shoot (colours, light, lens, surfaces, props, finish).
  - term: Match cut
    meaning: A cut between two shots where something sits in the same place in both, so the eye stays on it.
  - term: Contact sheet
    meaning: All the photos from a shoot laid out small, side by side, to compare them.
