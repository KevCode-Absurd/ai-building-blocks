new_slug: rapid-cut-product-video-prompt
name: Rapid-cut product video prompt
summary: Make a rapid-cut product video prompt with timed beats and a clear final hero shot. Give it your product and spot idea.
job: make-video-ads
headline: Rapid-cut product video prompt
subhead: Share a product and short spot idea. Get a timed product-only or surreal comedy prompt with a clear final hero shot. Bring the brief and any files you want it to use.
explain: |-
  Use this when you need a timed product-only or surreal-comedy spot. Choose product-only hyper-motion or surreal actor-and-product comedy. These are modes of one short-spot method; neither requires a long spoken script.

  Get duration, real product reference, palette and permitted transformations. Product package geometry, label, logo and material remain fixed even when its surroundings become surreal.

  What to gather first: your product name, spot length, label artwork or photos, palette, and whether a person appears. This skill only writes the prompt. To make the video you need your own account on a video tool such as Kling, Veo or Higgsfield. These are usually paid, so check the price first.

  Beats are 1 to 2 seconds each. A 15 to 20 second spot gets up to ten. Shorter spots get fewer, so nothing runs too fast to read.
when:
  - You need a timed product-only or surreal-comedy spot.
  - You have a product and a spot of 5 to 20 seconds in mind, and want a prompt to paste into a video tool.
not_for:
  - "You need a spoken-script ad: write the script first, then use your AI to turn it into scenes."
  - "You only need a still product image: use a standard product photo brief with your photographer or AI image tool."
  - "You need the finished video file: this makes a prompt only, so run it in a video tool you pick."
you_give:
  - Your product name and the spot idea
  - The spot length in seconds, and your palette
  - Approved label artwork or product photos
  - Whether a person appears (for the comedy mode)
you_get:
  - video prompt
  - shot list
  - Missing inputs and steps that still need to run
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text.
  - "Say which mode you want: product-only motion or surreal comedy with a person and the product."
  - Add your product, spot length in seconds, palette and photos if you have them.
  - Read the timed prompt. Check that the label, pack shape and claims match your facts.
  - Paste the prompt into your video tool. Check the final shot shows a readable label.
output_sample:
  input:
    - Your product and the short spot idea
    - Spot length in seconds
    - Product photos (optional)
    - Palette and any moves the product may make (optional)
    - Approved label artwork (optional)
  prerequisites:
    - A video tool to run the prompt in, if you want to make the video
  output:
    - name: MODE AND PRODUCT LOCK
      contains: The mode chosen, your product reference roles and the facts you approved for use.
    - name: TIMED PROMPT
      contains: Each time interval with its image and action, camera move, light and sound.
    - name: FINAL HERO HOLD
      contains: The closing shot with a readable pack and how long it stays on screen.
    - name: NOT RUN
      contains: The render and output checks that still need to be done by you.
how_it_works:
  - title: Read the brief
    text: Choose product-only hyper-motion or surreal actor-and-product comedy. These are modes of one short-spot method; neither requires a long spoken script.
  - title: Build the result
    text: "For product-only use up to ten short beats, fewer for a short spot:material-world macro, material cascade, floating elements, vortex, pack reveal, label/material detail, badge accent, hero arc, tactile payoff and final hero hold."
  - title: Check and hand off
    text: Keep the final label/front readable; exact text may require compositing approved artwork. Name the audio in each beat (music only, sound effects only, or no sound). Avoid unsupported claims about model superiority, price or render resolution.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
