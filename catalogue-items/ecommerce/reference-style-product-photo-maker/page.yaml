new_slug: reference-style-product-photo-maker
name: "Reference-style product photo maker"
summary: "Attach your product and a photo you like. Get a matching prompt and a score out of 100."
job: product-photos

headline: "Reference-style product photo maker"
subhead: Attach your product photos and one photo whose look you like. It reads that photo's light, camera and set, and moves them onto your real product. You get an image prompt, ranked pictures if your chat makes them, and a score out of 100.

explain: |
  Most small brands have three or four pack shots and need dozens of pictures. Asking an AI for "a nice lifestyle photo" gets a generic scene and often a redrawn label. Copying the look of a photo you like works much better, as long as you take its light and camera and never its product, brand or people.

  The skill reads your reference (the photo you're copying) the way a photographer would rebuild it: where each light sits, where the camera stands, the surfaces and props, how the frame is laid out, and the finish. Each line is kept, swapped for something from your product's real use, or dropped. The prompt names the role of every attached image, so the reference sets the look and your photo sets the product. Finished pictures are ranked with weights that change by use: a feed ad rewards stopping the scroll, a product page rewards room for words.

when:
  - You have a few pack shots and need more photos for ads, emails or your product page.
  - You've seen a photo whose light and mood you want on your own product.
  - You want a bold camera look, such as blind shadows or tilt-shift, for a feed ad.

you_give:
  - Real photos of the exact product and variant
  - One photo whose look you want to copy (your own, a past ad, or any photo you like), or the name of a camera look
  - What the picture is for (identity, in use, texture, in its place) and where it will go
  - Your brand colours and what you never show (optional)
  - The sizes you need (optional)
you_get:
  - A five-part reading of the reference photo
  - A keep, swap or drop line for each part
  - The finished image prompt, ready to paste
  - If your chat can make images, the pictures ranked with a score out of 100, and a reject list
  - If it can't, a score out of 100 for the prompt against its four checks

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Attach your real product photos and say which variant they show.
  - Attach the photo whose look you want, and say what the new picture is for, such as "email header, words added later".
  - Read the reading. If a line is wrong (the sun comes from the right, not the left), correct it before you use the prompt.
  - "Make one picture first (ChatGPT and Gemini can make images; with Claude, paste the prompt into your image tool). Compare it with your real photo at full size before making more."

how_it_works:
  - title: Writes down your product
    text: Records exactly how your product looks, so it knows the shape, colours, printed words and how the product is used.
  - title: Reads the set behind the photo
    text: Light, camera, set, frame and finish, every line filled in. The reference's own product, brand, words, logo and people are never taken.
  - title: Keeps, swaps or drops
    text: Keeps the light, camera and frame, swaps props for ones from your product's real use, and settles size, angle and the quiet area. Your brand colours win.
  - title: Writes the prompt
    text: Names what each attached image is for, then describes the scene, your product in it, the camera and light, and what must stay exactly the same.
  - title: Offers camera looks
    text: 16 looks in four families, ordered safest first for your product's true shape and colour. None is used as the main product page image.
  - title: Tests one picture
    text: You check it at full size beside the real photo. A prompt that failed is rewritten, never resent unchanged.
  - title: Ranks the keepers
    text: Three gates first (right product, light that agrees, nothing added). Then five scores, weighted for a feed ad or for a page or email.

output_shape: |
  READING
  Light:  <each source: clock position, height, size, hard or soft,
          colour; fill; shadows>
  Camera: <height, angle, distance, lens feel, focus>
  Set:    <place, surface, background, props and their roles>
  Frame:  <where the subject sits, fill, empty space, movement>
  Finish: <palette, contrast, saturation, grain, mood>

  KEEP / SWAP / DROP
  <part>: keep | swap -> <what> | drop
  Shown as: <...>  Size: <...>  Angle: <...>  Quiet area: <...>

  PROMPT
  Roles / Scene / Product in the scene / Camera and light /
  Finish / Keep

  RANKED (only if your chat made pictures)
  1. <file>  <score>/100 for <feed ad | page or email>  <job>
  REJECTS: <file, gate failed>
  SCORE (prompt only): <n>/100 (<checks passed> of 4 checks)
  MISSING: <...>

example:
  business: sprout
  input: |
    [the skill]

    Product: Sprout Original (Adults), Low Sugar. Attached: the pouch
    front on, and gummies in an open hand. Glossy deep green stand-up
    foil pouch, big yellow wordmark, yellow bear face top right, "28
    Daily Packs" at the bottom. Opens only at its resealable top.

    Reference (attached): a photo I like of a glass jar of sweets on a
    white kitchen windowsill. Hard morning sun from the right, crisp
    shadows falling left. Jar sharp, a garden behind the window
    blurred. Shot from just above sill height, close. Jar in the right
    third, bright empty wall on the left.

    For: an email header (3:2) and a Facebook image ad (4:5), with
    words added later.

    Brand look: cream #FFF7DF, forest green #00582D, sunflower yellow
    #FFCC2E. Bright, sunny, candy-like. Never clinical, never muted.
  output: |
    READING
    Light:  hard morning sun from 3 o'clock, low and small; no fill;
            crisp dark shadows falling left
    Camera: just above sill height, close, normal lens feel, shallow
            focus
    Set:    white kitchen windowsill, window behind, garden outside;
            the jar is the only prop
    Frame:  subject in the right third, bright empty wall on the left,
            still
    Finish: bright whites and greens, high contrast, fresh

    KEEP / SWAP / DROP
    Light: keep. Camera: keep. Frame: keep (left half is the quiet
    area for words).
    Set: swap the white sill for a cream sill #FFF7DF; swap the jar of
    sweets for a few loose gummies in front of the pouch.
    Drop: the jar, its sweets, any label or brand.
    Shown as: one serving, gummies loose on the sill (your gummy photo
    shows how they look). Size: MISSING, no photo of the pouch in a
    hand, so the prompt states none. Angle: sill height suits a
    stand-up pouch.

    PROMPT
    Roles: Image 1 is the real product: copy its shape, colours and
    printing exactly. Image 2 shows the gummies: small, opaque,
    deep-green bears, soft matte. Image 3 is the look reference: take
    only its light, camera and framing.
    Scene: a kitchen windowsill in a real home, cream wall #FFF7DF, a
    green garden softly blurred through the window behind.
    Product in the scene: the glossy deep green Sprout stand-up foil
    pouch stands upright and closed in the right third, a small handful
    of the gummies scattered on the sill in front of it. Hard sun
    lights it from the right and its shadow falls left across the sill.
    The foil's shine comes from this sun.
    Camera and light: just above sill height, close, normal lens,
    shallow focus. Hard low morning sun from the right, no fill, crisp
    shadows.
    Finish: bright, high contrast, cream with forest green and
    sunflower yellow.
    Keep: the pouch exactly as in Image 1, whole and never torn; no
    added words, logos or marks; the left half as bright, empty wall.
    Make 3:2 and 4:5 each as its own picture.

    NEXT
    Make one 3:2 picture. Check the wordmark, the bear face, "28 Daily
    Packs" and the shadow direction at full size, then make the 4:5.

tweaks:
  - what: The reference photo
    how: Choose by the problem the shot solves (a small object on a sunny windowsill), not by product category. A jar of sweets can suit a supplement pouch.
  - what: A camera look instead of a reference
    how: Name one, such as "blind shadows" or "tilt-shift", and the prompt describes the lens, light and colour instead. The safest looks for true colour are in the light family.
  - what: A spread of five
    how: Ask for five and you get one look from each family plus one picture in your everyday light, so you can see which direction suits your brand.
  - what: Where it's used
    how: Say "feed ad" or "product page". The ranking weights change, so a scroll-stopper wins in the feed and a picture with room for words wins on the page.
  - what: Fabric or room products
    how: For a blanket, rug or lamp, ask for the four room set-ups (in use, folded with a hand, pattern close-up, lifted from the box).

judge:
  - All five parts of the reading are filled in. None says "unclear".
  - The prompt never mentions the reference's product, brand or words.
  - In the picture, the printed words match your real photo letter for letter.
  - The product's shadow falls the same way as the rest of the scene.
  - There's real empty space where words will go, and it survives in every size you asked for.

test:
  - Use a photo of your own product that you already like as the reference. The reading should describe its light, camera height and lens the way you would. If it gets the light side wrong here, it will on new photos too.
  - Run the same reference twice. The two readings should agree line for line. If they don't, add one plain note with the reference, such as "sun from the left window, phone at table height".
  - Make one picture and put it beside your real pack shot at full size. Read the printed words letter for letter and check the shadow direction.
  - Rank the same pictures for a feed ad and for a product page. The order should change. If it doesn't, the pictures are too alike to need ranking.

improve:
  - Add your brand's rules for showing the product to step 3 of the skill file. For Sprout that's "the daily pack is torn straight across the top; the big pouch is never shown torn".
  - Write your brand colours and the things you never show into "What you need" as fixed lines.
  - Change the weights in step 8 to suit your use. For email headers with long headlines, raise "room to build on" and lower "feels photographed" by the same amount.
  - Strike camera looks you'll never use from the table in step 6, and add the ones that worked for you.
  - Pair it with the skill that writes down exactly how your product looks (step 1 already calls it), and the one that makes an approved image bigger without changing anything.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Takes up to 3 style reference images apart from the product photos, so the look and the product stay separate."}
    - {name: "GPT Image", why: "Keeps the product close to your photo while it takes the light from a second image."}
  inputs:
    - "Two or three photos with the same look, so the reading picks what they share"
    - "Your brand's past photos, so the finish stays in your colours"
    - "A note of the looks you used lately, so this run picks a new one"

terms:
  - term: Reference photo
    meaning: The photo you copy the look from (light, camera, colour). Its contents are never copied.
  - term: Quiet area
    meaning: A plain part of the picture kept free so a headline or button can be added later.
  - term: Camera look
    meaning: A special way of shooting, such as tilt-shift or flash with a slow shutter, that changes how the picture looks but not what's in it.
