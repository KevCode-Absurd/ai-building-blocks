new_slug: returns-policy-designer
name: "Returns policy designer"
summary: "Set a returns policy that keeps customers. Give it your return costs and product list. You get refund timing, keep-it rules and a recovery budget."
job: keep-customers
thinking: medium
thinking_why: "It weighs costs against risk for each product, so a mid-size model is enough if you give it your real return costs."

headline: "Returns policy designer"
subhead: Give it your return rate, what a return costs you and your product list. It sets when refunds move, when to push exchange or store credit, which items to refund without a return, and how much support can spend to put a problem right.

explain: |
  A return is a test of trust. Write-ups we could not verify say shoppers read your policy before they buy, and are less likely to buy again after a poor return. Yet most stores treat returns as a cost to cut, not a moment to keep the customer.

  This skill starts with three numbers: days from return request to refund start, the share refunded as store credit, and repurchase within 60 days of a return. It then writes the rules: when money moves, how to steer toward exchange or credit, which items are keep-it (refund, no return), and a per-incident budget so support can fix problems on the spot. Many figures come from vendors or secondary sources, so it treats them as direction and asks you to run your own 60-day check.

when:
  - Refunds take days and customers who return rarely buy again.
  - Return shipping and handling cost you more than some of the items are worth.
  - Support has to ask for approval every time a customer needs a fix.
not_for:
  - "Your store has very few returns or no resellable stock: a short plain returns page is enough."
  - "You need legal wording for each country: ask a lawyer or adviser who knows the consumer law where you sell."
  - "You only want the cost of one return or your refund speed: do the sum by hand in a spreadsheet first."

you_give:
  - Return rate by product and by reason
  - Days from return request to refund today
  - What one return costs you (shipping, handling, written-off stock)
  - Your product list with price, cost, weight and resale value after return
  - Your repeat rate for returners and non-returners, and any abuse history (optional)
you_get:
  - A refund timing rule
  - Exchange-first and store credit rules with the incentive
  - Each product marked keep-it, return or repair-first, with a price line and an abuse guard
  - A recovery playbook with a budget per incident, and the returns numbers to track

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your return data, your cost per return and your product list.
  - Say what your returns portal and helpdesk can do today.
  - Pilot instant refunds on repeat customers or low-value orders first, and set keep-it by case, not as a banner.
  - Check your numbers every 90 days with the matched comparison it gives you.
output_sample:
  input:
    - Your return rate by product and by reason
    - Your days from return request to refund today
    - "Your cost per return: shipping, handling and written-off stock"
    - Your product list with price, cost, weight and resale value after return
    - Your repeat rate for returners and any abuse history (optional)
  output:
    - name: YOUR NUMBERS
      contains: Days from request to refund start, store credit share, and repurchase within 60 days of a return.
    - name: REFUND TIMING
      contains: For each customer group, when money moves, and which group to pilot instant refunds on first.
    - name: EXCHANGE AND CREDIT RULES
      contains: The default of exchange or store credit, and the bonus for choosing credit.
    - name: PRODUCT RULES
      contains: Each product group with refund amount against return cost, a keep-it, return or repair-first rule, and a cap.
    - name: RECOVERY PLAYBOOK
      contains: How much support can spend per incident without approval, and on what.
    - name: POLICY TEXT
      contains: Short customer-facing wording, with a reminder to check consumer law before you publish.
    - name: TRACK and REVIEW EVERY 90 DAYS
      contains: The returns numbers to watch, and the matched comparison to run each quarter.

how_it_works:
  - title: Measures three numbers
    text: Days from request to refund start, share refunded as store credit, and repurchase within 60 days of a return.
  - title: Sets the refund clock
    text: It starts the clock at the request, not the warehouse scan, and moves money when the parcel is shipped or scanned for trusted orders.
  - title: Steers to exchange
    text: It defaults to exchange or store credit, with a small bonus credit for choosing credit over a refund to the card.
  - title: Prices a return
    text: It uses your own cost first. Only if you have none does it use an unverified rough range from unnamed write-ups, labelled as such.
  - title: Marks keep-it items
    text: An item is keep-it when the refund is smaller than the return cost, or it is damaged, perishable or hard to resell. You set the price line from your own sums.
  - title: Adds guards
    text: Offer keep-it case by case, cap it by value and watch repeat abusers, since some returns are fraud.
  - title: Considers longer cover
    text: Lifetime or repair-for-life cover for durable items, and a results-based guarantee to test, only when margins allow.
  - title: Sets the recovery budget
    text: Support can spend up to a set amount per incident without approval, to limit damage and not to plan failures. The amount is a share of your average order margin that you pick.

output_shape: |
  YOUR NUMBERS
    Request to refund start: <days>   Store credit share: <%>   60-day repurchase after a return: <%>

  REFUND TIMING
    <who>: money moves when <shipped | scanned | received> | pilot on <segment>

  EXCHANGE AND CREDIT RULES
    default: <exchange | store credit>   bonus for credit: <amount or %>

  PRODUCT RULES
    <SKU group> | refund <price> vs return cost <cost> | <keep-it | return | repair-first> | guard: <cap>

  RECOVERY PLAYBOOK
    Support may spend up to <$> per incident on: <refund | replace | gift | shipping upgrade>

  POLICY TEXT  <short customer-facing wording>
  Check consumer law where you sell before you publish.

  TRACK  <metrics>   REVIEW EVERY 90 DAYS  <matched comparison>
  CHECKS MISSED: <none | list>
  MISSING: <what was needed>

tweaks:
  - what: Your real cost per return
    how: Give shipping, handling and written-off stock for a typical item. The keep-it line depends on it, and the source ranges are only a fallback.
  - what: Your margin and cash
    how: Instant refunds and keep-it cost cash up front. Say how much risk you can carry, and it will start with repeat-trusted customers or lower order values.
  - what: Product mix
    how: Perishable, bulky or cheap items suit keep-it. Durable items suit repair-first or longer cover. Flag which is which.
  - what: Abuse history
    how: If you have had serial returners or fraud, say so. It will lower caps and add checks.

judge:
  - Every product group has a rule, and the rule follows from price versus return cost.
  - Keep-it is not advertised as the default, and has a value cap and a way to spot repeat abusers.
  - Vendor and secondary figures are labelled as such, and your own numbers come first.
  - The recovery budget is a set amount per incident, not a plan to cause failures.
  - The policy text is short, plain and states the refund timing.

test:
  - Give it three products you know well, one cheap, one fragile and one expensive. The rules should differ, with reasons.
  - Run it twice on the same data. The product rules should match.
  - Compare 60-day repurchase for returners and non-returners yourself before you roll anything out.
  - Pilot instant refunds on one group for a month, then check cash out, fraud and repeat orders.

improve:
  - Add your return reasons and your top five returned products to the skill file.
  - Add your carrier and portal limits, such as when you can refund before the parcel is back.
  - Add the consumer law notes your adviser gives you for each market you sell in.
  - Save your three returns numbers to your brand file each quarter.
  - Pair it with the guarantee designer for the terms of longer cover, and the first use gap checker to find why buyers return products.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI can set the rules from your numbers. Paste real costs and refund times."}
    - {name: "Loop Returns", why: "A returns portal for Shopify that supports exchanges and store credit. Check its fee against your return volume."}
    - {name: "AfterShip Returns", why: "A returns tool with refund rules by scan event. Check its fee against your return volume."}
  inputs:
    - "A list of returns with reason, item, date requested and date refunded"
    - "Your helpdesk tags for return contacts"
    - "A sample of past keep-it or goodwill refunds, if you have done any"
    - "Your current policy page text"

terms:
  - term: Keep-it refund
    meaning: A refund where the customer keeps the item and does not send it back.
  - term: Store credit
    meaning: Money the customer can only spend in your store.
  - term: Repurchase rate
    meaning: The share of customers who buy again within a set time.
  - term: Recovery budget
    meaning: A set amount support can spend on one problem without asking for approval.
