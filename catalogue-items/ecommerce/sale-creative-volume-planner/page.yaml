new_slug: sale-creative-volume-planner
name: "Sale creative volume planner"
summary: "Give it last year's top ads and your sale target. Get winners needed, ad count and phases."
job: plan-ad-tests
thinking: medium
thinking_why: "It does back-of-envelope sums and builds a phased plan, which a mid-size model handles well."

headline: "Sale creative volume planner"
subhead: Give it last year's spend by ad, your peak spend target for the sale, the ad types you can make and your offer dates. It works out how many winning ads you need and how many ads to ship. You get a mix by share of spend and a list of what to make in each phase.

explain: |
  In a big sale, ads are what runs out first. You can have the budget and the stock and still be stuck, because a single ad can only take so much spend before it tires. Planning from the budget alone leaves a gap.

  This skill works backwards from your peak daily spend. It finds what one ad carried last year, divides your target by that figure to get the number of winners you need, and shows why you need many more ads than winners, because spend spreads across a long tail of ads. It then gives a mix by ad type, rules for offer ads, a phase plan from teaser to last 24 to 48 hours, and how to read results when the sale distorts them. It also checks what you can really make, since 100 or more ads is not for a solo founder.

when:
  - A big sale is coming and you need to know how many ads to make before it starts.
  - Last year you ran out of fresh ads halfway through the sale.
  - You are raising your spend target and want to know if your ad count can carry it.

you_give:
  - Your peak daily spend target for the sale
  - Last year's spend by ad (the top 50 ads is enough)
  - The formats you can produce
  - Your offer and its end date
  - Your Meta page setup (optional)
you_get:
  - The number of winning ads and total ads you need
  - A mix by share of spend
  - A list of what to make in each phase
  - Page and account limits to fix before you ramp up
  - Rules for reading results during the sale

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Export last year's sale-period spend by ad and paste the top 50. Say which currency it is in.
  - Give your peak daily spend target and your offer dates. Make sure the end date is real.
  - List the ad types you can make. Be honest about your capacity.
  - Use the phase list as a production calendar, and set up spare pages before you ramp.

how_it_works:
  - title: Finds what one ad can carry
    text: Looks at last year's peak daily spend on a single ad, and the typical working ceiling.
  - title: Counts the winners
    text: Divides your peak daily spend target by spend per winner. Count ads that really carry spend, not ads uploaded.
  - title: Shows how spend spreads
    text: Spend is spread across many ads, so you need volume, not just a few winners.
  - title: Sets the mix
    text: Gives a share of spend by ad type, keeping evergreen ads running.
  - title: Writes the offer ad rules
    text: Discount and end date readable at thumbnail size, brand obvious, offer in the first line of copy.
  - title: Checks limits
    text: Looks at the Meta page limit, and your capacity to make the ads.
  - title: Phases the work
    text: Teaser and early access, launch, mid-sale refresh, then the last 24 to 48 hours.
  - title: Sets reading rules
    text: Judges sale ads at ad set level, leans on click metrics more than return, and checks before copying a sale winner into evergreen.

output_shape: |
  WHAT ONE AD CAN CARRY
  Top ad last year: <$ a day>  Typical evergreen ad: <$ a day>  Planning figure: <$ a day per winner>

  WINNERS NEEDED
  Peak target <$ a day> / <$ per winner> = <n winners>
  Ads to make: <n> (from your winner rate of <n%>, or MISSING)  Capacity check: <can you make this? yes | no, cap at $...>

  MIX BY SHARE OF SPEND
  Evergreen kept running: <50 to 60%>  Offer statics: <~19%>  Offer-badged winners: <~18%>
  Catalog ads: <~12%>  Long educational video: <~14% or none>  Creator and founder with sale banner: <rest>  Early access: <if used>

  OFFER AD RULES
  <readable at thumbnail | end date | brand | offer in first line | feed crop check>
  Catalog copy: <offer written in>

  PHASES
  Tease and early access: <what to make> | Launch: <...> | Mid-sale refresh: <...> | Last 24 to 48 hours: <...> (real deadline only)

  LIMITS TO FIX
  Meta pages: <extra pages set up?> | Backup offers ready: <list>

  HOW TO READ RESULTS
  <ad set level | click metrics | do not copy sale winners to evergreen unchecked>
  CHECKS MISSED: <none, or the list>
  MISSING: <what was not supplied>

tweaks:
  - what: Spend per winner
    how: Use your own account's figures. The source's examples are in Australian dollars. Evergreen ads ran $4,000 to $8,500 a day, the top ad $12,500, and the planning figure was $5,000 typical and $10,000 to $12,000 for a winner.
  - what: Your winner rate
    how: Give your share of ads that become winners. If it is near 5 percent, 12 to 18 winners means roughly 240 to 360 ads. That sum is our maths, not the source's.
  - what: Ad types you can make
    how: Tell it what you can produce. If you cannot make founder videos, it moves that share to the other types.
  - what: Store size
    how: Bigger accounts spread spend across more ads. Smaller ones concentrate more. A solo founder should cap spend to what they can make.

judge:
  - The winners count is shown as a sum from your own numbers.
  - The plan separates ads that carry spend from ads uploaded.
  - The mix adds up and keeps evergreen ads running.
  - The deadline in the last phase is real, not made up.
  - The capacity check says whether you can actually make the number of ads.

test:
  - Use last year's sale. Would the planned number of winners have carried the spend you actually reached?
  - Run it twice on the same inputs. The winner count and mix should match.
  - Check the ad types against what your team really produced last year.
  - After the sale, count how many ads really carried spend and compare with the plan.

improve:
  - Add last year's real peak figures per ad to the skill file so you do not paste the sheet again.
  - Add your page setup and any limits you hit before.
  - Add your backup offers so the plan lists them by name.
  - Pair it with a creative volume planner, a fatigued ad reviver, a gift with purchase planner and a sale-period discount checker.

works_best_with:
  tools:
    - {name: "Meta Ads Manager", why: "Exports spend by ad for last year's sale period."}
    - {name: "Canva", why: "A fast way to make the offer statics in bulk with a template."}
    - {name: "Any good chat AI", why: "Does the sums and builds the phase list from the sheet you paste."}
  inputs:
    - "Last year's sale-period spend by ad, top 50"
    - "Your best-selling products and their stock levels"
    - "Backup offers you could switch on mid-sale"
    - "Repeat-order rates for sale-period customers against normal months"

terms:
  - term: Evergreen ad
    meaning: An ad that runs all year, not just for one sale.
  - term: Offer static
    meaning: An image ad built around the deal, with the discount and end date shown large.
  - term: Catalog ad
    meaning: An ad that shows people the exact products they looked at, often called a dynamic product ad.
  - term: Ad set level
    meaning: Judging a group of ads together instead of each ad alone.
