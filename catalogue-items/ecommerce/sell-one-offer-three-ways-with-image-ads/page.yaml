new_slug: sell-one-offer-three-ways-with-image-ads
name: Sell one offer three ways with image ads
summary: Image ads for one offer, argued as the deal, the proof and the product, priced in one line.
job: make-image-ads

headline: Image ads for your whole offer, where changing the price means editing one line
subhead: Give it your offer's exact terms, your product photos, reviews and facts. It plans the offer three ways (the deal, a customer's proof, the product itself) in feed and story sizes, with the offer written once as a single line you can swap.

explain: |
  When an offer runs, most shops make one ad and crop it into every size. Everyone sees the same argument, even though the person who wants a deal and the person who doubts the quality need different reasons. And when the price changes, every ad has to be remade by hand.

  This skill plans each offer three ways. The deal ad states the offer plainly for people who already know you. The proof ad lets one real review carry the frame for people who doubt it's worth it. The product ad explains why it is worth full price, for people new to you. Each comes in 4:5 for the feed and 9:16 for stories, each laid out for its own shape. The offer's numbers and dates sit in one line of 12 words or fewer, identical on every ad, so changing the offer means editing that line only.

when:
  - You're about to run a sale, bundle or standing offer and need ads ready in every size.
  - Your offer ads all look the same and you can't tell which reason to buy is working.
  - Your prices change often and you're tired of remaking every ad.

you_give:
  - The offer in its own words, with price, terms, start and end dates and any real limit
  - The products in the offer, with real photos
  - Real reviews, word for word, for the proof ads
  - Product facts (what's in it, how it's made) for the product ads
  - Your colours and typefaces (optional)
you_get:
  - One offer line of 12 words or fewer, with its exact word count, for every ad
  - Six ads per product (3 ways x 2 sizes), each with layout, colours, picture and every line of text with its source
  - A side-by-side thumbnail test, so you know the three ads differ
  - A note on what to change when the offer changes

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste the offer exactly as your shop states it, with start and end dates. If there's no end date, say so.
  - List the photos you actually have, one line each. Don't describe photos you plan to take.
  - Paste your reviews and your product facts or approved claims.
  - Read the MISSING lines first, then hand the plan to whoever makes the images.
  - When the offer changes, edit the offer line on every ad and keep the pictures.

how_it_works:
  - title: Writes three arguments
    text: Plans the deal for people who know you, the proof for people who doubt the quality, and the product for people new to you.
  - title: Counts the set
    text: Works out 3 arguments x products or colours x 2 sizes, one set per product. Forty versions of one argument still count as one ad.
  - title: Lays out each size
    text: Plans 4:5 and 9:16 separately for their own shape. Neither is cropped from the other.
  - title: Writes the offer line
    text: Puts the offer's numbers and dates in one line of 12 words or fewer, in the offer's own words, identical on every ad. No other text repeats them.
  - title: Tests the thumbnails
    text: Pictures the three ads side by side at 300 px wide. If you can't name each one's argument without reading, they get different layouts and colours.
  - title: Checks proof and numbers
    text: Uses review counts, star ratings and callouts only where your facts hold them, and flags reviews it can't verify.

output_shape: |
  OFFER LINE (role: offer, identical on all <n> ads)
  "<the offer in its own words>"
  <word count> words. <where the words came from>

  MISSING  <end date, photos, reviews or facts not on file>
  NOT ADDED  <numbers or urgency left out, and why>

  AD <n>  <Deal | Proof | Product>, <4:5 | 9:16> (<who it's for>)
    Layout    <how the frame is arranged>
    Ground    <background colour>, text <colour>
    Picture   <which real photo, and how it's used>
    Headline  <line>   (<source>)
    Support   <line>   (<source>)
    Offer     the offer line, <large | chip | small>
  AD <n+1>  <same argument, other size, laid out for its own shape>

  300 PX TEST
  <can each argument be named without reading? pass or fail>

  WHEN THE OFFER CHANGES
  <edit the offer line only, keep the pictures>

example:
  business: sprout
  input: |
    [the skill]

    Offer (product page, word for word):
    "Same Sprout. New Lower Price. Subs Now Start at $29.99."
    Under the button: "Renews at $49.99 each 4 weeks."
    Footer: "Offer assumes customer has received and uses promotional
    SMS discount reserved for new customers only."
    Start: running now. End: none ("Not just for a week but
    indefinitely"). Limit: none.

    Product: Sprout Original (Adults), Low Sugar, 28 daily packs.
    Photos on file: the pouch on a soft green gradient; gummies poured
    into a hand.

    Reviews: all 20 (pasted)
    Product facts: brand file, fine-to-repeat claims (pasted)
    Brand look: forest green #00582D, warm cream #FFF7DF, sunflower
    yellow #FFCC2E, plum #581E5A. Work Sans bold. Bright, sunny photos.
  output: |
    OFFER LINE (role: offer, identical on all 6 ads)
    "Subs Now Start at $29.99. Renews at $49.99 each 4 weeks."
    11 words. Both sentences word for word from the product page.

    MISSING  end date. It's framed as permanent, so no ad says "ends",
             "last chance" or "limited". No urgency anywhere.
    MISSING  whether $29.99 also applies to Sugar-Free. Not shown, so
             this set is Low Sugar only: 3 ways x 2 sizes = 6.
    CONDITION  The $29.99 needs the text sign-up. Every ad carries a
             small-print line with no number in it: "With text sign-up,
             new customers only."
    NOT ADDED  a percentage. The site shows 49, 52, 55, 58 and 61%, so
             no ad says "% off".

    AD 1  Deal, 4:5 (people who already know Sprout)
      Layout    offer line large and centred, pouch below
      Ground    plum #581E5A, text cream #FFF7DF
      Picture   the gradient pouch photo, pouch cut out, closed
      Headline  Our birthday price cut   (names the kind of offer only)
      Support   28 daily packs in every pouch   (product page FAQ)
      Offer     the offer line, large, small print under it
    AD 2  Deal, 9:16. Laid out tall: headline in the top third, offer
          line at the centre, pouch low. Not cropped from AD 1.

    AD 3  Proof, 4:5 (people who doubt a subscription is worth it)
      Layout    one review fills the frame, offer as a small chip
      Ground    warm cream #FFF7DF, text forest green
      Picture   no person. Pouch cut-out, small, bottom right
      Review    "I hate subscriptions because I feel like they are a
                trap so I canceled it before the gummies even arrived.
                We quickly decided to resubscribe because we love
                [Sprout] so much!"   (review 17, cut at a sentence)
      Credit    "Sprout customer" only. The review has no name and is
                not marked verified. Flag before paid use.
      Offer     the offer line, small chip
    AD 4  Proof, 9:16. Review in larger type over two thirds of the
          height, chip and pouch at the foot.

    AD 5  Product, 4:5 (people new to Sprout)
      Layout    gummies-in-hand photo on the right, three numbered
                callouts on the left
      Ground    forest green #00582D, numbers in yellow #FFCC2E
      Headline  We made daily nutrition, like, ridiculously easy.
                (the brand's own line)
      1  60+ ingredients, 21 vitamins and minerals, 6 g fiber in one
         pack   (fine-to-repeat claim)
      2  Third-party tested for 70 pesticides and 4 heavy metals
         (product page)
      3  Vegan, with no synthetic dyes or sweeteners   (science page)
      Offer     the offer line, small, at the foot. Never the headline.
    AD 6  Product, 9:16. Callouts stacked under the photo, one per row.

    300 PX TEST (on this plan; repeat on the made images)
      Deal: plum block, one big line. Proof: cream, big quote marks,
      a paragraph. Product: green, a hand, numbers 1 2 3 in yellow.
      Each can be named without reading. Pass.

    WHEN THE OFFER CHANGES
      Edit the offer line once and paste it on all 6 ads. Keep every
      picture. If the new offer has a real end date, it goes inside
      that line, still 12 words or fewer.

tweaks:
  - what: The end date
    how: Give a real last day and the deal ad can say so, inside the offer line only. Without one, the plan writes no urgency at all.
  - what: Photos per variant
    how: Add a real photo for each flavour or version and you get a set per variant (Low Sugar and Sugar-Free would make 12 ads). The plan never invents a photo you don't have.
  - what: The review
    how: Name a review number to force a choice, or let it pick. Pick one that speaks to price or doubt, because the proof ad is for people unsure it's worth it.
  - what: Brand look
    how: Give your colours and font names and each argument gets its own ground and colour. Without them, it can only describe layouts.

judge:
  - The offer line is identical on every ad, 12 words or fewer, and the count shown matches.
  - No headline or support line repeats a price, saving or date from the offer.
  - The review on the proof ad is word for word with its number, and an unverified reviewer is flagged.
  - The product ad's three callouts each trace to your facts panel or approved claims.
  - Nothing says "ends soon" or "limited" unless your offer has a real date or count.
  - The 9:16 version is described as its own layout, not "same as 4:5, cropped".

test:
  - Run it on an offer you ran before. Compare its offer line with what your old ads said. If your old ads stated the offer in different words on different sizes, this is the fix; if its line is wrong, your pasted terms are.
  - Change the price in your input and run it again. Only the offer line should change. If a headline or callout changes too, a number leaked out of the offer line.
  - Run it with no end date and check every ad for "ends", "last chance", "limited" or "today only". There should be none.
  - Make the three 4:5 ads, shrink them to thumbnails side by side and ask someone to say what each one argues. If two look alike, ask for new layouts.

improve:
  - Write your standing offer, renewal price and any small-print condition into "What you need" in the skill file, word for word, so the offer line never drifts.
  - If your site shows several discount numbers, write the one that's live into the skill and ban the rest, so no ad quotes a number your page contradicts.
  - Add your brand's photo rules (how the pack opens, what's never shown torn) to step 3, so every layout uses the product the right way.
  - Once one argument wins, save it in your brand file and run more opening lines on that argument only, not more crops.
  - Pair it with a skill that checks a finished ad before you spend, and with one that checks it against Meta's ad rules.

terms:
  - term: 4:5 and 9:16
    meaning: Image shapes. 4:5 is a tall rectangle for the feed; 9:16 fills a phone screen for stories and reels.
  - term: Offer line
    meaning: The one piece of text on each ad that carries the price, saving and dates, so you can change it in one place.
  - term: Chip
    meaning: A small rounded label on an image, like a tag.
