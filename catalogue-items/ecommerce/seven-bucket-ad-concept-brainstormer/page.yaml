new_slug: seven-bucket-ad-concept-brainstormer
name: Seven-bucket ad concept brainstormer
summary: Brainstorm 20 or more ad concepts in seven groups, then rank them and pick the top eight to produce. Built for planning your next ad tests.
job: plan-ad-tests
headline: Seven-bucket ad concept brainstormer
subhead: Share product facts, target buyer, offer, past ads and production limits. Get a ranked concept list with top-eight production picks.
explain: |-
  Generate ad concepts in seven groups. Rank the best eight by fit, proof needs, effort and risk.

  Share product facts, target buyer, offer, past ads and production limits. Get a ranked concept list with top-eight production picks.
when:
  - Your ad ideas have run dry and you need 20 or more fresh angles in one go.
  - You want to choose which eight to shoot first, with the reason for each.
  - You are briefing an agency or freelancer and want ranked ideas, not a vague request.
not_for:
  - "You need one finished ad, not a list of ideas: ask your AI to write a single ad from your product facts."
  - "You have no product facts or proof yet: gather those first, because ideas without proof get killed."
  - "You need to build, launch or track the ads: use your ad platform, or ask a person who runs your ads."
you_give:
  - Product facts
  - Target buyer
  - Offer
  - Past ads and production limits
you_get:
  - A ranked concept list with top-eight production picks
  - The sources used, missing inputs and assumptions
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Give your product in one sentence, your main buyer, the stages to cover and your do-not-do list.
  - Read the top eight. Check the proof each one needs against what you really have.
  - Brief the top two or three first, then test them against each other.
output_sample:
  input:
    - Your product in one sentence
    - Your main buyer, or 2 or 3 buyer types
    - Which awareness stages you need to cover
    - Your brand voice and your do-not-do list
  output:
    - name: Concepts by bucket
      contains: At least 20 concepts in seven groups, each with hook, angle, buyer, stage, theme, format, proof needed and risk.
    - name: Top 8 to produce
      contains: The highest ranked concepts, each with its scores for novelty, proof, production ease and buyer match.
    - name: Defer
      contains: Good concepts of middle rank that can wait for a later round.
    - name: Kill
      contains: Weak concepts with no proof or a brand risk, each with the reason.
how_it_works:
  - title: Check the inputs
    text: Confirm your product in one sentence, your main buyer, the awareness stages to cover and your brand voice. Mark anything missing.
  - title: Generate concepts in seven groups
    text: Problem-first, identity-first, myth-bust, founder story, customer story, comparison and demonstration. At least 20 concepts in all.
  - title: Fill in each concept
    text: Hook, angle, buyer, stage, theme, format, proof needed and one risk. Each hook has to differ.
  - title: Score and rank
    text: Score each concept 1 to 10 for novelty, proof, production ease and buyer match. Add the four scores and rank by total.
  - title: Sort into top 8, defer and kill
    text: The eight highest go to production. Middle ones wait. Concepts with no proof or a brand risk are killed, with the reason.
  - title: Pick what to brief first
    text: Take the top two or three to your shooter or designer, and test them one change at a time.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
next: [creative-brief-writer, small-budget-ad-test-planner]
