new_slug: shipping-zone-and-rate-drafter
name: "Shipping zone and rate drafter"
summary: "Paste where you ship and real carrier costs. Get zones, rates, a free-shipping line and test carts."
job: set-up-store
thinking: low
thinking_why: "It compares charged price to real cost, zone by zone."

headline: "Shipping zone and rate drafter"
subhead: "Paste where you ship, your parcel sizes and real carrier costs. It drafts the zones and a rate for each, checks they cover your cost, sets a free-shipping line, and writes the test carts."

explain: |
  Shipping set up from memory quietly loses money. A flat rate that covers a small parcel can lose on a heavy one, and a free-shipping line set too low eats the margin on every order.

  This prompt starts from your real carrier cost. It drafts a small set of zones, checks the price charged against the cost, picks a line just above your average basket, and gives you carts to test before launch.

when:
  - "You are setting up shipping for the first time."
  - "You are adding a new country."
  - "You suspect free shipping is costing you margin."

you_give:
  - "Where you ship (required): countries or states, and where each ships from."
  - "Real carrier cost (required): per country or weight band."
  - "Parcel (required): packed weight and box size."
  - "Average order value and margin (advised)."
  - "Platform (advised): Shopify or WooCommerce."
you_get:
  - "Zones and a rate for each"
  - "A margin check per zone"
  - "A free-shipping line with the reason"
  - "Checkout wording and test carts"

how_to_use:
  - "Copy the prompt and paste it into a chat with Claude, ChatGPT or Gemini."
  - "Under it, paste your details: where you ship; real carrier cost; parcel; average order value and margin; platform."
  - "Send it and read the answer against the checks."
  - "If a line says MISSING, add that detail and send it again."

how_it_works:
  - title: "Start narrow"
    text: "One or two zones first. Add more once those work."
  - title: "Pick one model per zone"
    text: "Flat rate, free over a line, or carrier-calculated. Flat rates suit a small store."
  - title: "Check the money"
    text: "Compare the price charged with the real carrier cost on a typical parcel. Say plainly if a zone loses money."
  - title: "Set the free-shipping line"
    text: "Put it just above your average order value, for example 75 when the average basket is 62, and check the margin can carry it."
  - title: "Write wording and tests"
    text: "Checkout and announcement-bar text, then four test carts, including one at the exact line value."

output_shape: |
  ZONES: <zone> | ships from <place> | model <flat | free over | calculated> | price <amount>
  MARGIN CHECK: <parcel> | carrier cost <amount> | charged <amount> | covers or loses money
  FREE-SHIPPING LINE: <amount> per zone, because <reason>
  WORDING: <checkout text> | <announcement bar>
  TEST CARTS: <cart, country> | expect <carrier and price>
  NOT COVERED: <heavy goods, countries without a rate>

tweaks:
  - what: "Carrier costs"
    how: "Use real quotes for your usual parcel. Guesses make the margin check useless."
  - what: "Platform"
    how: "Name it so the settings match your admin."

judge:
  - "No rate is copied from an example. Each comes from your costs."
  - "Every zone is checked against real carrier cost."
  - "The free-shipping line sits above your average order value."
  - "Heavy or bulky goods needing weight rates are listed as not covered."

test:
  - "Use a zone you already run and compare the answer to your live rates."
  - "Give it no carrier cost. It should say MISSING, not invent a rate."
  - "Run the test carts in your store."

improve:
  - "Add your usual parcel size and weight under the prompt."
  - "Add your margin so the free-shipping line uses it."
  - "Pair it with a store go-live checker."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A short prompt like this works the same in Claude, ChatGPT or Gemini."}
  inputs:
    - "A carrier rate card"
    - "Your average order value from the last 90 days"

terms:
  - term: "Shipping zone"
    meaning: "A group of places that share the same shipping rates."
