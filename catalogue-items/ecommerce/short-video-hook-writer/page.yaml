new_slug: short-video-hook-writer
name: "Short video hook writer"
summary: "Write short video hooks for Reels or TikTok. Give it your product and post idea. You get ten hooks, checked, and the two to film first."
job: grow-social
thinking: medium
thinking_why: "It weighs ten styles against a set of checks, so a mid-size model is enough. A small one tends to skip the first-shot check."

headline: "Short video hook writer"
subhead: Give it your product and the post you want to make. It writes ten hooks in ten different styles, checks each for length, reading level and first shot, and tells you which two to film first.

explain: |
  The hook is the first line and the first shot of a short video. It decides whether a stranger keeps watching. Most store owners write the hook last and spend their time on the rest of the post. This skill flips that. It starts with the picture a viewer sees first, then writes the words.

  It writes your idea in ten different hook styles, such as a curiosity gap, a contrarian view or an outcome. Then it checks each one: five to eight words on screen, plain words, a clear first frame, and no claim you can't back up. The length and reading rules come from one creator's review of 1,300 viral Reels. They are a good starting rule, not a law. Check them against your own watch-time numbers.

when:
  - You have a product and a post idea but the opening line is blank.
  - Your videos get few views and you suspect the first three seconds.
  - You are about to film a batch and want to pick which openings to shoot.
not_for:
  - "You want long videos or horizontal video: write the script yourself or ask a video editor, because this only plans the first line and first shot of a short vertical clip."
  - "You want the first line of a static ad: use the Ad opening writer and reviewer."
  - "Your product can't be filmed, such as a service with nothing to show: plan a simple picture first, or work with a person who shoots video."
  - "You want a quick first pass with fewer checks: use the Video opening hook writer."
  - "You already have hooks and want them scored, with rewrites for the weak ones: use the Video hook scorer."

you_give:
  - Your product and the post idea
  - Who the viewer is, in one sentence (optional)
  - The real first shot you can film, such as where you are and what you hold (optional)
  - One proof number you can back up (optional)
you_get:
  - Ten hooks, each tagged with its hook style
  - A length, reading and framing check for each hook
  - The on-screen text and first picture for your top three
  - The two hooks to film first

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product and the post idea in a line or two.
  - Say what you can really film, such as the product in your hand, your kitchen or your warehouse. The picture comes first.
  - Add one proof number only if you can show where it came from.
  - Film the two hooks it picks. Compare them by 3-second hold in your analytics.
output_sample:
  input:
    - Your product and the post idea
    - Who the viewer is, in one sentence (optional)
    - What you can really film as the first shot (optional)
    - One proof number you can back up (optional)
    - Reels or TikTok (optional)
  output:
    - name: Header
      contains: Your product, post idea, the viewer in one sentence and the real first shot you can film.
    - name: Ten hooks
      contains: One line per hook in ten different styles, with on-screen text, word count, reading level and framing.
    - name: Top three
      contains: "For the best three: style, on-screen text, the first picture to film and a half-second test."
    - name: Film first
      contains: The two hooks to film first, with the reason for each.
    - name: Checks missed
      contains: Any check that failed or could not run, or the word none.
    - name: Missing
      contains: Anything you did not give it, such as the viewer, first shot or proof number.

how_it_works:
  - title: Picks the first shot
    text: It chooses the picture before the words. The first frame must show the topic, with high contrast, a clean background and bright light.
  - title: Writes ten styles
    text: The same idea is written in ten of fifteen styles, so you compare real choices instead of ten copies of one line.
  - title: Checks length
    text: On-screen text should run five to eight words. Up to twelve can work. Past twelve, results fell in one creator's review of viral Reels, which is not a formal study.
  - title: Checks reading level
    text: Grade 5 or lower, with no insider words or acronyms. A stranger should get it from one frame and one line.
  - title: Tests the curiosity gap
    text: It writes a too vague, a too complete and a middle version of the line, then keeps the middle one.
  - title: Checks claims
    text: Numbers must be believable and yours. Health results and before and after claims stay out unless you can show and source them.
  - title: Picks two to film
    text: It names the two hooks to film first, because a solo owner can only shoot so many posts a week.

output_shape: |
  HOOKS for <product> | post idea: <idea>
  VIEWER: <one sentence>   REAL FIRST SHOT: <what you can film>

  1  <style> | "<on-screen text>" | <n> words | grade <ok/high> | framing <loss/neutral/gain>
  2  <style> | "<on-screen text>" | <n> words | grade <ok/high> | framing <...>
  (ten lines, ten different styles)

  TOP THREE
  A  <style> | "<text>" | first picture: <subject, props, light, background>
     half-second test: <would a stranger know what is going on?>
  B  ...
  C  ...

  FILM FIRST: <hook> and <hook>, because <reason>

  CHECKS MISSED: <none | list>
  MISSING: <product | post idea | viewer | first shot | proof>

tweaks:
  - what: The real first shot
    how: Say what you can actually film. A hook that needs a set you don't have is no use. The more exact you are, the better the picture plan.
  - what: The viewer sentence
    how: One narrow viewer, such as "a dad buying a first road bike for his 6-year-old", gives sharper direct address and identity hooks than "parents".
  - what: Proof number
    how: Give a number that is real and modest. A believable result keeps more viewers than the biggest figure you have.
  - what: The platform
    how: Say Reels or TikTok. Sound-on habits and text placement differ, and the skill adjusts the on-screen text and the first frame.

judge:
  - Ten hooks, ten different styles, each tagged.
  - Every on-screen line is between four and twelve words, and most are five to eight.
  - You can read each hook out loud to a friend with no background and they get it.
  - The first picture for each top-three hook shows your product or topic and is something you can really film.
  - No hook depends on a sound effect, a made-up number or a claim you can't show.

test:
  - Run it on a post you already made that did badly. Read the hooks it writes. At least one should be clearly clearer than the one you used.
  - Show the top three first frames, as screenshots, to someone outside the business for half a second. Ask what the video is about.
  - Film the top two and post them close together. After a few days, compare the 3-second hold in your analytics.
  - Run it twice on the same idea. The styles may change, but the checks should give the same pass or fail on length.

improve:
  - Add your own words that must never appear, such as insider terms or claims your category can't make.
  - Save hooks that worked as examples in the skill file, with the style and the 3-second hold, so it learns your viewer.
  - Add the claims you may make and where each is sourced, so proof lines are quick to check.
  - Pair it with the skill that finds product angles first, then run this on the best angle.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "It can write and check the hooks. Attach a photo of your real first frame so it can judge contrast and clutter."}
    - {name: "Instagram Insights or TikTok analytics", why: "They show the 3-second hold and where viewers leave, which is how you test the hook rules on your own account."}
  inputs:
    - "A screenshot of your last five videos' first frames"
    - "Your 3-second hold rate for recent posts"
    - "Two or three hooks from your category that you noticed and remembered"

terms:
  - term: Hook
    meaning: The first line (on screen or spoken) and the first shot of a short video.
  - term: Curiosity gap
    meaning: A line that names the topic but holds back the result, so the viewer stays to learn it.
  - term: Hook swap
    meaning: Opening on a well-known, high-curiosity clip, then cutting into your own footage on a matching shape or movement.
