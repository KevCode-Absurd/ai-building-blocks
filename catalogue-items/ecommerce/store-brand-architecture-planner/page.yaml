new_slug: store-brand-architecture-planner
name: "Store brand architecture planner"
summary: "Decide if a new range gets its own name or your store name. Get a brand structure and a naming rule for future products."
job: brand-file
thinking: medium
thinking_why: "It applies a set of rules to your facts and explains the call. A mid-size model does this well. Use a stronger one if you run several stores."

headline: "Store brand architecture planner"
subhead: "Tell it about your stores, ranges and ad spend. It first checks whether you need a brand structure at all. Then it says whether each new range takes its own name or your store name, and gives you one naming rule for the next product."

explain: |
  Should a new product get its own name, or sit under your store name? That is the question this brand architecture planner answers. A new name needs its own ads, site and email list. The store name costs less. But every product you hang on one name can blur what the name means. A cheap range under a premium name can hurt the premium.

  Brand architecture is how your names fit together. You can have one master brand. You can have a parent with endorsed brands, which show a small "by Parent" tag. Or you can have separate brands. The skill picks one and says why.

  It uses tests from two well-known brand books: five rules for own name or store name, a shopping-list test and a bartender test. It always starts with a stop-early check. A store with one core product usually needs none of this. In that case it says so and stops, rather than invent a problem. The books' case studies are old, so only their logic carries over.

when:
  - You are adding a range and cannot decide between a new name and your store name.
  - You plan a cheaper or a premium line and worry it will change how people see your main brand.
  - You run two or more stores or brands and want one clear structure.
  - You are buying or launching another brand and need to decide how much of the parent name shows.

not_for:
  - "You sell one core product from one store. The skill will say you need no structure. Skip it."
  - "You need names for the new range. Use the Store name generator for ideas, then the Store name tester to score them."
  - "You want to change the name of a store you already run. Use the Store rebrand planner."
  - "You need trademark advice. This plans a structure only. Ask a lawyer about who owns each name."

you_give:
  - What your store or brand stands for, in your customers' words (review quotes work well)
  - The new product or range, its price and the sales you expect
  - Your stores, ranges and brands, with each one's share of sales and price tier
  - Monthly ad spend for each brand, and whether it sells by itself online or with a person
  - How many buyers buy from more than one of your brands (optional)
  - Any plan to buy or launch more brands (optional)

you_get:
  - A stop-early check that says whether you need a structure at all
  - Your answers to the five rules and the name tests, each with your own fact beside it
  - "A call for each range: its own name, store name plus a plain label, or store name only"
  - One structure with a short diagram, and one naming rule for future products
  - A note on how to keep your old brand meaning one thing, and what to keep, merge or stop using

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. It needs no code, files or web access.
  - Paste your list of brands and ranges. Add share of sales, price tier and monthly ad spend for each. Add the new product if there is one.
  - Say what each name stands for in your customers' words. Review quotes are best.
  - Read the stop-early check first. If it says you need no structure, you do not.
  - Look for any line marked MISSING and add that fact if you have it.
  - Save the naming rule in your brand notes and use it for the next product.

how_it_works:
  - title: Checks if you need this
    text: A store with one core product usually needs no structure. If so, it says so and stops.
  - title: Reads your ad budget
    text: A small ad budget points to the store name, because each new name needs its own ads, site and list. The skill treats under a few thousand dollars a month in ads, or fewer than two staff, as small. Those are starting points. Give it your own limit if you have one.
  - title: Runs the five rules
    text: Volume, competition, ad budget, importance and how it is sold point to own name or store name. Each rule is answered with your fact.
  - title: Runs the name tests
    text: Shopping list, bartender, teeter-totter, direction, same category and stretch. They show if a name already means too many things.
  - title: Picks a structure
    text: One master brand, a parent with endorsed brands, or separate brands, with the reasons.
  - title: Covers special cases
    text: Own-label ranges, acquisitions, widening a product's use, and a separate brand for a new technology.
  - title: Writes the rule and the actions
    text: One naming rule for future products, plus what to keep, merge or stop, and when to check repeat orders.

output_shape: |
  STOP-EARLY CHECK: <needed / not needed, why>
  BUDGET GATE: <ad spend per brand; lean to store name if small>

  FIVE RULES for <new range>
  Volume <big/small> | Competition <none/crowded> | Ad budget <big/small> | Importance <breakthrough/commodity> | How sold <self-serve/with a person>
  Lean: <own name | store name>

  TESTS
  Shopping list: <what comes home when the name is alone on a list>
  Bartender: <does the name alone get one thing>
  Teeter-totter: <does the name mean two things>
  Direction: <step up | step down | same level>
  Same category: <...>
  Stretch: <...>

  CALL: <own name | store name with descriptor | store name only>
  STRUCTURE: <one master brand | parent with endorsed brands | separate brands>, because <...>
  DIAGRAM: <parent> > <brand> > <range>
  NAMING RULE: <one rule for future products>
  OLD BRAND NOTE: <how to keep one meaning>
  KEEP / MERGE / STOP: <...>
  REVIEW: <when to compare repeat orders>
  SOURCE NOTE: <the book case studies are old; only the logic carries over>
  CHECK WITH A LAWYER: trademark ownership across entities
  CHECKS MISSED: <none, or list>

output_sample:
  input:
    - What your brand stands for, in your customers' words
    - Your stores, ranges and brands, with share of sales, price tier and monthly ad spend
    - The new range, with its price, expected sales and how it is sold
    - Buyers who buy from more than one brand (optional)
    - Rivals in the new space (optional)
  prerequisites:
    - Your brand brain from the Website brand brain builder (optional)
  output:
    - name: Stop-early check
      contains: A plain yes or no on whether a store like yours needs a brand structure. If not, the run ends here.
    - name: Budget gate
      contains: The ad spend for each brand, and whether it is small enough to point to the store name.
    - name: Five rules
      contains: Volume, competition, ad budget, importance and how it is sold, each answered with your fact. It ends with which way they lean.
    - name: Tests
      contains: Shopping list, bartender, teeter-totter, direction, same category and stretch. Each is a line on whether the name can carry the new range.
    - name: Call
      contains: For each range, its own name, the store name plus a plain label, or the store name only.
    - name: Structure and diagram
      contains: One master brand, a parent with endorsed brands, or separate brands, with the reason and a short parent-to-range diagram.
    - name: Naming rule
      contains: One sentence you can apply to a product you have not made yet.
    - name: Old brand note and keep, merge, stop list
      contains: How to keep your main name meaning one thing, and which names to keep, merge or stop using.
    - name: Review, source note and lawyer note
      contains: When to compare repeat orders, a reminder that the book case studies are old, and a reminder to check trademarks with a lawyer.
    - name: Checks missed
      contains: Any check that could not run because a fact was missing, or "none".

tweaks:
  - what: Your ad spend per brand
    how: The rules lean on budget. Give a real monthly figure for each brand. A thin budget points to a single store name.
  - what: Your own small-budget line
    how: The skill treats a few thousand dollars a month in ads, or under two staff, as small. These are starting points. Say your own limit and it will use that.
  - what: How well you describe what each name means
    how: Use customers' words from reviews. The shopping-list and bartender tests only work on what shoppers really think.
  - what: Price tier of the new range
    how: Say if it is above, below or level with your current range. The direction check depends on it.
  - what: Customer overlap
    how: Give the share of buyers who buy from more than one brand. High overlap favours one store name.
  - what: Whether you sell with a person or self-serve
    how: Sold by a person leans to the store name, because the person explains it. Self-serve leans to its own name.

judge:
  - It starts with the stop-early check, and says so if you do not need a structure.
  - Every rule has your fact beside it, not a general statement.
  - The call matches the lean of the rules, or says why it differs.
  - There is one naming rule you could apply to a product you have not made yet.
  - It says the case studies are old and the logic is what carries over.
  - It asks you to check trademark ownership with a lawyer.

test:
  - Give it a one-product store. It should say you need no structure and stop.
  - Give it a store with a premium range and a new budget range. It should warn about the step-down and suggest a separate name.
  - Run it twice with the same facts. The call should not flip. If it does, one of your facts was vague.
  - Ask three customers what your store name stands for, then compare with what you wrote.

improve:
  - Add your real ad budget lines and a rule such as "no new brand under a set monthly ad budget", so the skill checks your own limit.
  - Save the naming rule to your brand file so every new product is named the same way.
  - Add your marketplaces to the skill file, since own-label ranges inside a marketplace follow different rules.
  - Pair it with the Store name generator and Store name tester when a range does get its own name.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI can apply the rules. Paste your list of brands as a table."}
    - {name: "A spreadsheet", why: "Google Sheets or Excel is the easiest place to hold sales share, price tier and ad budget per brand before you paste them."}
  inputs:
    - "Review language showing what your customers say each brand is for"
    - "Repeat order figures per brand"
    - "Search volume for your store name compared with each range name"

terms:
  - term: Brand architecture
    meaning: How your store, brand and range names fit together.
  - term: House name
    meaning: The name of your store or company, used on products as well.
  - term: Endorsed brand
    meaning: A range with its own name that also shows a visible parent, like a small "by Parent".
  - term: Line extension
    meaning: Putting an existing name on a new product.
  - term: Own-label range
    meaning: Products a shop sells under its own name instead of a maker's name.
