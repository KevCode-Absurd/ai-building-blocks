new_slug: store-name-generator
name: "Store name generator"
summary: "Get 200+ store name ideas, a shortlist of 10 to 15 and a checklist to clear each one. Built from your brief and your rivals."
job: brand-file
thinking: medium
thinking_why: "It has to produce a lot of varied names and then judge them, which a mid-size model does well. Use a stronger one if the shortlist feels flat."

headline: "Store name generator"
subhead: "Give it your store brief, your rivals and the markets you sell in. It asks four questions about what the name must do. It writes 200 or more raw names in three separate frames. Then it cuts them to a shortlist of 10 to 15 with reasons, and a to-do list for checking that each name is free to use."

explain: |
  Most store names are picked in an afternoon from a short list of safe words. Then the name works every day for years: on the pack, in search, in ads and in every order email. A name that sounds like every rival, or that nobody can spell, costs you customers without telling you.

  This store name generator is adapted from one naming-agency founder's podcast interview, at a size a small store can run. It is not an endorsement by that person or a statement of how that agency works. It starts with four questions about what winning means, so the names have a job. It lists how your rivals name themselves, so you know which patterns to avoid. Then it writes a big pile of raw names in three frames before it judges any of them. Judging comes after, so good ideas are not killed early.

  You get a shortlist you can hand to the Store name tester. It cannot check a trademark or a domain. You do that yourself, and a lawyer should check trademarks.

when:
  - You are about to open a store, or launch a new product line, and need a business name that fits your market.
  - Your shortlist of names all feels the same and you want a wider pool to pick from.
  - Your current name is hard to spell or hard to find in search, and you want ideas before you decide to rename.
  - A rival has a name close to yours and you want names that stand apart.

not_for:
  - "You already have a shortlist and only need it scored. Use the Store name tester."
  - "You run a store with a name and are not sure it should change. Use the Store rebrand planner first."
  - "You are deciding if a new range gets its own name or your store name. Use the Store brand architecture planner."
  - "You want to know if a name is free to use. This cannot say that. Use your trademark office search and a lawyer."

you_give:
  - Your brand brief, or a few lines on what you sell, who it is for and what makes it better
  - Your three to five closest rivals, with their names
  - The countries and languages you sell in
  - Names you already like or dislike (optional)
  - Your brand file (optional)

you_get:
  - Your four strategy questions, answered once, plus the name patterns your rivals use
  - 200 or more raw names in three frames, kept apart and not judged
  - Ideas sorted into zones, with the bold ones kept alive
  - A shortlist of 10 to 15 names, each with the reason it made it
  - A clearance to-do list for trademark, domains, handles and meaning checks

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. It needs no code, files or web access.
  - Paste your brief, your rivals and your markets. If two people own the decision, give one agreed answer to each of the four questions.
  - Let it finish the raw names before you react. Do not ask it to remove names in the first round.
  - Read the shortlist. Then run the names you like through the Store name tester.
  - Do the clearance to-do list yourself before you spend money on a logo or a domain.

how_it_works:
  - title: Asks four questions
    text: How do we define winning, what do we have to win, what do we need to win, and what do we need to say. It writes one agreed answer to each.
  - title: Maps rival names
    text: It lists the patterns rivals use and marks the ones to stay away from.
  - title: Climbs the benefit ladder
    text: It goes from product facts to the customer need to the final benefit, because the best names often point at the benefit. It uses your words for the benefit and never invents one.
  - title: Writes raw names
    text: At least 200, from word roots, myths, the periodic table and word lists on the benefit. No judging yet.
  - title: Runs three frames
    text: One that knows the product, one with an extra trait added, and one that ignores the product and uses an unrelated theme.
  - title: Judges on a later pass
    text: Names land in a zone (invisible, tension or too wild). Rejections are rewritten as problems to solve.
  - title: Cuts to a shortlist
    text: 10 to 15 names, each with its reason and one rule to pass, which is whether it is believable.
  - title: Writes the clearance list
    text: Trademark by market, domains, social handles, marketplace names and native-speaker meaning checks, for you to do.

output_shape: |
  FOUR QUESTIONS (one agreed answer each)
  Winning: <...>  Must win: <...>  Need to win: <...>  Need to say: <...>

  RIVAL NAME PATTERNS TO AVOID
  <pattern> | <examples>

  BENEFIT LADDER
  <product fact> > <customer need> > <ultimate benefit>

  RAW NAMES (not judged)
  Frame A, knows the product: <name>, <name>, ... (<n> names)
  Frame B, product plus <extra trait>: <...> (<n> names)
  Frame C, unrelated theme <theme>: <...> (<n> names)

  ZONES
  Invisible: <names>  Tension: <names>  Too wild: <names>
  Rewritten reactions: <rejection> > <problem to solve>

  SHORTLIST (10 to 15)
  <name> | <frame> | <why it fits the benefit> | <zone> | <believable? yes/no>

  CLEARANCE TO-DO (you do these)
  Trademark by market, domain, social handles, marketplace names, native-speaker check
  NEXT: run the shortlist through the Store name tester.
  CHECKS MISSED: <none, or list>

output_sample:
  input:
    - Your brand brief, or what you sell, who it is for and what makes it better
    - Your three to five closest rivals and their names
    - The countries and languages you sell in
    - Names you already like or dislike (optional)
  prerequisites:
    - A brand brief from the Buyer brief writer, or your brand brain from the Website brand brain builder (both optional)
  output:
    - name: Four questions
      contains: One agreed answer each on what winning means, what you must win, what you need to win and what the name must say.
    - name: Rival name patterns to avoid
      contains: How your rivals name themselves, with examples, so you steer clear of the same patterns.
    - name: Benefit ladder
      contains: A line from your product fact, to what the customer needs, to the final benefit the name can point at.
    - name: Raw names
      contains: 200 or more names in three frames (knows the product, product plus one extra trait, unrelated theme). Nothing is judged or cut here.
    - name: Zones
      contains: Names sorted into invisible, tension and too wild. Bold ideas that drew an objection are reworded as a problem to solve.
    - name: Shortlist
      contains: 10 to 15 names. Each has its frame, why it fits the benefit, its zone and whether it is believable at first glance.
    - name: Clearance to-do
      contains: What you check yourself for each market you sell in. That is trademark search, domains, social handles, marketplace names and a native speaker's meaning check.

tweaks:
  - what: How well you answer the four questions
    how: Vague answers give vague names. Write what winning means in one sentence, such as "first choice for gift buyers in my country", before you start.
  - what: The third frame's theme
    how: Pick a theme that has nothing to do with your product, such as sport or weather. It gives the most surprising names, so choose one you find interesting.
  - what: The feeling the name must carry
    how: Say if it should feel fast, calm, trusted or bold. The shortlist uses it to pick between close names.
  - what: Markets and languages
    how: Name every country you sell in. The clearance list is only as complete as this list.
  - what: People who judge
    how: Run the judging pass with a second person who has not seen the brief. Two people judging apart avoids peer pressure.

judge:
  - The raw list has at least 200 names, split across the three frames.
  - Nothing was removed or ranked in the raw pass.
  - Every shortlisted name has a reason tied to the benefit, not just "sounds nice".
  - Several names would split a room, with some people loving them and some disliking them.
  - The clearance list names your markets, and the skill does not claim any name is free to use.

test:
  - Run it on a store you already know the name of. Count how many raw names look like the rival patterns it said to avoid. There should be few.
  - Run it twice with the same brief. The shortlists will differ, but the ideas in each should be of the same kind.
  - Show the shortlist to three people outside the business and ask which they could spell after hearing it once.
  - Pick one shortlisted name and do the clearance list for it before you decide anything.

improve:
  - Keep a list of old names under themes, such as small things, so a name from an earlier project can be reused. Paste it in each time.
  - Add rival name patterns from your own category to the skill file so the avoid list starts full.
  - Add the countries and languages you sell in to the skill file so the clearance list always covers them.
  - Pair it with the Store name tester for scoring, and with the Store brand architecture planner if you have more than one range.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI can write the raw pass. Ask for the three frames in separate messages so each starts fresh."}
    - {name: "Your country's trademark office search", why: "For example the USPTO search in the US or TMview from EUIPO in Europe. Use it, and a lawyer, to check trademarks."}
  inputs:
    - "A list of your rivals' names with a note on what each reminds you of"
    - "Customer words about the main benefit, so the ladder uses their language"
    - "A native speaker for each language you sell in"

terms:
  - term: Benefit ladder
    meaning: Starting from what the product is, going up to what the customer needs, then to the feeling they want in the end.
  - term: Invisible zone
    meaning: Names everyone likes because they are familiar, which also means nobody remembers them.
  - term: Tension zone
    meaning: Names about half the room loves and half dislikes. That split usually means the name has energy.
  - term: Clearance
    meaning: Checking that a name is free to use, in trademarks, domains, handles and meaning.
