new_slug: store-team-role-planner
name: "Store team role planner"
summary: "Plan your online store team. Give your revenue and who works for you. You get your next hire, what to outsource and who decides what."
job: hire-people
thinking: medium
thinking_why: "It matches your size and pain to roles and fills a grid, which a mid-range model handles well."

headline: "Store team role planner"
subhead: Describe your store, your revenue and who works on it today. It maps the five areas every online store needs, picks your next hire and what to outsource, and builds a chart of who decides what. You also get a short job brief for the hire.

explain: |
  Most store teams grow by accident. Someone gets hired for the loudest problem, and nobody is sure who approves a refund, a price change or a reorder.

  This skill covers five areas: administration, customer service, order fulfilment, digital marketing, and developers and designers. It shows who covers each one now, picks the next hire or freelancer from your biggest pain, and writes a responsibility chart. Each decision gets one person who starts it and sees it through. The revenue stages come from one speaker's rules of thumb, so treat them as a rough guide.

when:
  - You are making your first or second hire and want it to be the right one.
  - People step on each other, or nobody owns refunds, reorders or ad budget.
  - You want to know what to hand to freelancers before you hire full time.
not_for:
  - You have no revenue yet and no team. Start with a simple plan of your own and cover each job yourself.
  - You need a full company org design. Use a business plan or an HR adviser, not this planner.
  - You need legal or pay advice on contracts or contractors. Ask a qualified local adviser.

you_give:
  - Monthly revenue and gross margin
  - Current people and freelancers, with their hours
  - The decisions that come up again and again, such as reorders, price changes, ad budget, refunds and supplier changes (optional)
  - Your biggest pain right now (optional)
you_get:
  - A role map for your stage across the five areas
  - Your next hire and what to outsource
  - A responsibility chart for your key decisions
  - A job brief to hand to a job post writer

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your revenue, margin and who works on the store, with their hours.
  - List five or more decisions that come up often.
  - Tell it your biggest pain, such as late orders or slow support.
  - Fill any blank in the chart with your team, then send the job brief to your job post writer.
output_sample:
  input:
    - Your monthly revenue and gross margin
    - Your current people and freelancers, with their hours
    - The decisions that come up again and again (optional)
    - Your biggest pain right now (optional)
  output:
    - name: STAGE
      contains: Your revenue and team today, with a rough guide to which stage of growth you are in.
    - name: ROLE MAP
      contains: Who covers administration, customer service, fulfilment, marketing, and developers and designers, plus planning.
    - name: NEXT HIRE
      contains: The one role to add next, why now, and what to outsource with weekly hours.
    - name: WHO DECIDES WHAT
      contains: A chart of your decisions and people showing who starts, approves, supports or is told.
    - name: BALANCE
      contains: Optional note on which kind of team contributor is missing and who might cover it.
    - name: JOB BRIEF
      contains: The area, decisions held, work they must have done and the 90-day outcome.
    - name: CHECKS MISSED
      contains: Any check that could not be run, or none.

how_it_works:
  - title: Covers five areas
    text: Administration, customer service, fulfilment, digital marketing, and developers and designers. It shows who covers each.
  - title: Places your stage
    text: Founder in most roles until about a million in revenue, then specialists. It says this is a rough guide.
  - title: Adds the planner
    text: Once profit pays a wage, someone should own planning and forecasting.
  - title: Picks the next hire
    text: It ties your biggest pain to one hire or freelancer, and says what to hand off.
  - title: Builds the chart
    text: Decisions down the side, people across the top. R starts it, A-V approves or vetoes, S supports, I is told. One R per decision.
  - title: Checks the balance
    text: Optional. Spots a missing kind of contributor, without labelling people.
  - title: Writes the job brief
    text: Area, decisions held, work they must have done and the 90-day outcome, with no personal traits.

output_shape: |
  STAGE
  <revenue>, <people today>. Rough guide: <stage>

  ROLE MAP
  Administrator: <who>   Customer service: <who>   Fulfilment: <who>
  Digital marketing: <who>   Developers and designers: <who>
  Planning and forecasting: <who or none>

  NEXT HIRE
  <role>: <why now>
  OUTSOURCE: <task> to <freelancer type> (<hours a week>)

  WHO DECIDES WHAT
  Decision | <person 1> | <person 2> | <person 3>
  <decision> | R | A-V | I

  JOB BRIEF
  Area / Decisions held / Must have done / 90-day outcome

  CHECKS MISSED: <none or list>

tweaks:
  - what: The decisions you list
    how: Name real ones, such as "approve a refund over $50". The chart is only as sharp as the decisions.
  - what: Hours per person
    how: Give hours, not titles. It shows who is stretched and what to hand to a freelancer.
  - what: Your biggest pain
    how: One clear pain, such as late shipping or low conversion, points to one hire.
  - what: Your stage
    how: Give monthly revenue and margin. The plan differs for a founder doing everything and for a team of five.

judge:
  - All five areas show who covers them, even if it is you.
  - Every decision has exactly one R.
  - Few cells say A-V, so decisions do not stall.
  - The revenue stages are called rules of thumb.
  - The job brief lists work and results only, never age, family or health.

test:
  - Give it your team today and check that the role map matches how work actually gets done.
  - Pick a decision that caused an argument last month. See if the chart names one clear owner.
  - Run it twice on the same input. The next hire should be the same.
  - Show the chart to your team and ask where it is wrong.

improve:
  - Add your own decisions, such as a limit on discounts, to the list in the skill file.
  - Add the title names you use, so the chart reads like your team.
  - Save the chart in your org context and update it after every hire.
  - Pair it with the job post writer for the ad and the interview scorecard builder for the hiring steps.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "It needs only your text and numbers."}
    - {name: "Google Sheets", why: "A shared sheet holds the chart so everyone can see it and edit it."}
  inputs:
    - "A list of the last five problems that got stuck between people"
    - "Your calendar or task list, to show where the owner's time goes"
    - "Your freelancer list with rates and hours"

terms:
  - term: Responsibility chart
    meaning: A grid with decisions down the side and people across the top. Each cell says who starts it, approves it, helps or is told.
  - term: Fulfilment
    meaning: Picking, packing and shipping the order.
