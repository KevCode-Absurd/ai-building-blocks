new_slug: support-capacity-planner
name: "Support capacity planner"
summary: "Give it ticket data and your sales forecast. Get cost per ticket and hiring dates for peak."
job: run-your-store
thinking: medium
thinking_why: "It does a series of sums on your data and sets dates, which a mid-range model can do if you check the numbers."

headline: "Support capacity planner"
subhead: Give it 12 months of support tickets, your support costs and your sales forecast. It works out your cost per ticket, forecasts tickets from sales, and dates the hires and training you need before peak. You also get a team mix and a list of help page gaps.

explain: |
  Support gets slow and costly just when sales jump. Tickets rise with orders, new agents take weeks to train, and by the time you hire, the rush is over.

  This skill measures four things: resolution time, how many times each ticket is touched, reviews, and cost per service. Cost per service is all support costs, agents and software, divided by tickets. It turns your sales forecast into a ticket forecast, then counts back from your peak to give hire and training dates, aiming to keep cost per ticket about flat. It also lists the top ticket reasons to fix on your site, packaging or shipping. It is most useful with about 200 or more tickets a month.

when:
  - You get a big sales peak and support fell behind last time.
  - You do not know what each ticket costs you.
  - Tickets keep asking the same questions and you want to fix the cause.

you_give:
  - Tickets per month for 12 months
  - "Support costs: agents and software"
  - Your sales forecast by month
  - Average resolution time and touches per ticket (optional)
  - How long it takes you to hire and train an agent (optional)
you_get:
  - Your cost per ticket, resolution time and touchpoints as a baseline
  - Hire and training dates ahead of your peak
  - A team mix for simple and complex tickets
  - A list of help page and reply gaps behind your top ticket reasons

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your monthly tickets, costs and sales forecast for the next 12 months.
  - Tell it how long it takes to hire and train one agent.
  - Add your top ticket reasons if you tag them.
  - Check the plan against actual tickets each month and move the dates when the forecast changes.

how_it_works:
  - title: Sets the baseline
    text: Resolution time, touches per ticket, reviews and cost per service (all support costs divided by tickets).
  - title: Reads the signs
    text: Slow resolution points to missing site information, slow agents or weak canned replies. Many touches mean replies lack detail.
  - title: Forecasts tickets
    text: Tickets per order for each month, multiplied by forecast orders, with last year's peak as a guide.
  - title: Dates the hires
    text: Agents needed from forecast tickets, counted back from your peak by your training time. The goal is a flat cost per ticket.
  - title: Suggests a team mix
    text: Simple tickets to offshore agents, complex ones to local agents. Efficiency depends on training.
  - title: Fixes the causes
    text: Tags ticket reasons and lists the page, packaging or shipping changes that remove the top ones.
  - title: Reviews monthly
    text: Compares the plan with actual tickets and resolution time, and moves hire dates when the forecast moves.

output_shape: |
  BASELINE (last 12 months)
  Cost per service / Resolution time / Touchpoints / Reviews
  Read: <likely cause>

  TICKET FORECAST
  Month | Forecast orders | Tickets per order | Forecast tickets | Agents needed | Cost per service

  HIRING AND TRAINING DATES
  Hire by / Training starts / Ready for peak

  TEAM MIX
  Simple tickets / Complex tickets

  HELP PAGE AND MACRO GAPS
  Top reasons -> fix

  MONTHLY REVIEW
  CHECKS MISSED: <none or list>

tweaks:
  - what: Your sales forecast
    how: Give orders by month if you can. Tickets follow orders, so an order forecast beats a revenue guess.
  - what: Training time
    how: Say how many weeks it takes to hire and train one agent. The hire dates count back by it.
  - what: Last year's peak
    how: Paste last year's months. Peak months often have more tickets per order, and the plan uses that ratio.
  - what: Ticket reasons
    how: Tag the top five reasons. The plan then points to the fixes that remove the most tickets.
  - what: Local or offshore
    how: Say what you use today. The mix suits larger teams, and small stores can pick either.

judge:
  - Cost per service uses the same month for costs and tickets.
  - The forecast is built from tickets per order, not a flat guess.
  - Hire dates count back from your peak by your own training time.
  - Cost per service is shown by month and aims to stay about flat.
  - The offshore view is called one speaker's view.
  - The 200-ticket line is called the skill's own.

test:
  - Work out cost per service for one month by hand. It should match the skill.
  - Move the peak month later and see if the hire dates move with it.
  - Run it twice on the same data. The hire dates should match.
  - Check one top ticket reason against your helpdesk.

improve:
  - Add your training time and typical tickets per agent to the skill file.
  - Add your own ticket reason tags so the gap list uses your words.
  - Save each month's actuals and compare with the plan.
  - Pair it with the store team role planner and the product page fixes it points to.

works_best_with:
  tools:
    - {name: "Gorgias", why: "A helpdesk built for online stores that tracks email and tickets and exports reasons and times."}
    - {name: "Zendesk", why: "A general helpdesk with ticket tags and reports."}
  inputs:
    - "Last year's tickets by month with orders for the same months"
    - "Your top ticket reasons with counts"
    - "The canned replies you use today"

terms:
  - term: Cost per service
    meaning: All support costs, agents plus software, divided by the number of tickets.
  - term: Touchpoint
    meaning: One time an agent handles a ticket. Many touches per ticket mean replies are not complete.
  - term: Macro
    meaning: A saved reply an agent can send in one click.
