new_slug: test-idea-shortlist-maker
name: "Test idea shortlist maker"
summary: "Paste your test ideas and the evidence for each. Get a ranked shortlist and the one to run first."
job: test-store-changes
thinking: medium
thinking_why: "It weighs evidence and effort across several ideas."

headline: "Test idea shortlist maker"
subhead: "Paste your test ideas with the evidence behind each. It writes them as hypotheses, drops ideas with too little evidence, scores the rest with yes or no points, and names the one to run first."

explain: |
  Most stores test what someone felt like testing. Gut ranking favours the loudest idea, and a test with no evidence behind it rarely wins.

  This prompt asks for the evidence first. An idea needs two different kinds of proof to stay. The survivors get simple yes or no points, so the ranking is something you can argue with and check.

when:
  - "You have ten ideas and time for one."
  - "A team keeps arguing about what to test."
  - "You collected recordings and survey answers and need to use them."

you_give:
  - "Ideas (required): each with its evidence, such as a recording, a heatmap, a survey answer, a funnel drop or a customer call."
  - "Traffic and conversion of the page each idea touches (advised)."
  - "Build effort per idea: low, medium or high (advised)."
  - "Monthly orders (advised)."
you_get:
  - "A fix list kept apart from tests"
  - "Ideas written as full hypotheses"
  - "A ranked shortlist with the reasons"
  - "The one or two tests to run, and why the rest wait"

how_to_use:
  - "Copy the prompt and paste it into a chat with Claude, ChatGPT or Gemini."
  - "Under it, paste your details: ideas; traffic and conversion of the page each idea touches; build effort per idea; monthly orders."
  - "Send it and read the answer against the checks."
  - "If a line says MISSING, add that detail and send it again."

how_it_works:
  - title: "Split repairs from tests"
    text: "Anything broken goes on a fix list, not a test list."
  - title: "Write each as a hypothesis"
    text: "Because we saw [evidence], we believe [change] will cause [effect] for [who], measured by [metric]. It worked if the metric moves by [smallest lift worth shipping]."
  - title: "Count evidence"
    text: "One point for each different kind. Two recordings count once. Fewer than 2 points means parked."
  - title: "Score yes or no"
    text: "One point each for: above the fold, noticeable in 5 seconds, on a busy page, low build effort. Add the evidence points and rank by the total."
  - title: "Fit your stage"
    text: "Under about 300 orders a month, keep bold changes on the busiest page, one at a time. Under 30, say tests are not the next step."

output_shape: |
  FIX LIST: <broken items>
  RANKING: # | idea in one line | evidence kinds | yes/no points | effort | total
  RUN FIRST: <hypothesis in full>
  RUN NEXT: <idea or none>
  PARKED: <idea> | reason | what would move it up
  MISSING: <what you did not give>

tweaks:
  - what: "Evidence"
    how: "Name each kind. Two of the same kind count once."
  - what: "Order volume"
    how: "Give monthly orders so the list fits what your traffic can prove."

judge:
  - "Every ranked idea is a full hypothesis with a metric and a smallest lift."
  - "No ranked idea has fewer than 2 evidence points."
  - "Nothing broken is on the test list."
  - "The shortlist suits your monthly orders."

test:
  - "Include one idea with no evidence. It should be parked."
  - "Include a broken button. It should go on the fix list."
  - "Run it twice. The first pick should match."

improve:
  - "Add your real smallest lift worth shipping under the prompt."
  - "Keep a log of results so evidence points reflect what has won before."
  - "Pair it with a test result trust checker."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A short prompt like this works the same in Claude, ChatGPT or Gemini."}
  inputs:
    - "Heatmap and recording notes"
    - "Page traffic and gross profit per order"

terms:
  - term: "Hypothesis"
    meaning: "A clear guess you can check: what you change, what should happen, and how you measure it."
