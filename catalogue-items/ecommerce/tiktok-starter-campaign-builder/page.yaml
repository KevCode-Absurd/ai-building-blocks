new_slug: tiktok-starter-campaign-builder
name: "TikTok starter campaign builder"
summary: "Plan your first TikTok ads campaign. Give your budget, target cost per sale and 3 to 5 ads. Get the layout, budgets and a four-week plan."
job: launch-and-scale-ads
thinking: medium
thinking_why: "It does budget math and picks a layout, so a mid-size model is enough."

headline: "TikTok starter campaign builder"
subhead: Give it your daily budget, your target cost per sale and 3 to 5 finished ads. It lays out the campaign, ad groups and ads, sets the budget for each ad group, builds the audiences, and plans four weeks of targeting changes.

explain: |
  A first TikTok campaign often fails for setup reasons. The budget is too thin for TikTok to learn, all of it sits in one ad group, or too many interests are stacked. The two sources behind this skill also disagree on how much to spend, so a beginner can't tell which advice to follow.

  This skill takes your budget and target cost per acquisition (CPA, what you can pay for one sale) and builds the plan. You get a manual sales campaign, a budget per ad group with the math shown, audience recipes, and a four-week ladder that starts broad and adds one thing a week. Where the sources differ, such as two times your CPA against at least $50 a day, it shows both and says what each assumes.

when:
  - You have your TikTok account and pixel working and your first ads made, and you need the campaign laid out.
  - You have a small daily budget and aren't sure how many ad groups it can support.
  - You tried TikTok ads before with broad spread and no clear result, and want a tighter test.
not_for:
  - "Your pixel does not send a purchase event yet: use the TikTok ads account setup checker first, then come back."
  - "You already have ads running and want to read the results: use the TikTok ad test reader."
  - "You sell in TikTok Shop and want a Shop campaign: use the GMV Max campaign setup planner."

you_give:
  - Your daily budget and how many days you can test
  - Your target cost per sale, or an estimate from another channel
  - Your 3 to 5 finished ads, or their scripts
  - Whether your pixel sends a purchase event
  - A list of past buyers who agreed to marketing (optional)
you_get:
  - A campaign, ad group and ad layout with names
  - A daily budget per ad group, with the math and the learning-phase note
  - Audience recipes and a four-week targeting ladder
  - Rough cost ranges and an optional search ad plan

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Give your daily budget, your target cost per sale and how many ads you have.
  - Check that your pixel sends the purchase event before you launch. The skill marks the plan blocked if it doesn't.
  - Build the campaign as laid out. Each week, change only what the ladder says, and read results with the TikTok ad test reader.
output_sample:
  input:
    - Your daily budget and how many days you can test
    - Your target cost per sale (or a guess from another channel)
    - Your 3 to 5 finished ads, or their scripts
    - Whether your pixel sends a purchase event
    - A list of past buyers who agreed to marketing (optional)
  prerequisites:
    - A TikTok ads account with a pixel that sends a purchase event
    - At least 3 finished ads
  output:
    - name: TikTok starter plan header
      contains: Your daily budget, target cost per sale and whether the plan is ready to launch or blocked, with the reason.
    - name: Structure
      contains: The campaign, ad groups and ads with names, audiences, daily budgets and placements, plus a retargeting campaign if the budget allows.
    - name: Budget math
      contains: The formula and result for each ad group, purchases expected in 7 days, and a note on the learning phase.
    - name: Audiences
      contains: "A recipe for each audience: source, time window, exclusions and settings."
    - name: Four-week ladder
      contains: What to run each week, from broad targeting to stacked winners, and what to keep or cut.
    - name: Cost expectations
      contains: One operator's rough cost ranges, marked as not guaranteed.
    - name: Search ads add-on
      contains: A keyword plan and setup notes, only if you ask for it.
    - name: Checks missed and missing
      contains: Any checks that failed and any inputs the plan could not use.

how_it_works:
  - title: Checks you are ready
    text: It needs a purchase event on the pixel and at least 3 finished ads. If either is missing, it marks the plan blocked.
  - title: Picks the campaign type
    text: A manual sales campaign with a website destination, smart campaigns off, and Smart+ saved for a later side-by-side test.
  - title: Sets the budget
    text: It shows two times your CPA, at least $50 a day and TikTok's own advice, and does the math on how many purchases that buys in 7 days.
  - title: Lays out three levels
    text: Campaign for the goal, ad group for budget and audience, ad for the video. Several ad groups so each one learns alone.
  - title: Chooses audiences
    text: Broad first, then interest, then a 30-day visitor retargeting campaign and lookalikes built from your best sources.
  - title: Plans four weeks
    text: Week 1 broad, week 2 one interest, week 3 lookalikes, week 4 stack the winners.
  - title: Adds cost ranges
    text: One operator's CPM and CPC ranges, marked as rough.
  - title: Adds search ads if asked
    text: A keyword list of 20 to 50 terms, phrase match, and negative keywords after the first read.

output_shape: |
  TIKTOK STARTER PLAN
  Budget: <daily total> | target CPA: <$ or "not known: $50 fallback"> | launch: <ready | blocked: <why>>

  STRUCTURE
  Campaign <name: product-objective-date> | web conversions | CBO off
    Ad group 1 <name> | <audience> | $<per day> | placements: <...>
      Ads: <3 to 5 ad names>
    Ad group 2 ...
    Retargeting campaign: <audience, window, exclusions>

  BUDGET MATH
  <per ad group: formula and result; purchases in 7 days; learning note>

  AUDIENCES
  <recipe for each: source, window, exclusions, settings>

  FOUR-WEEK LADDER
  Week 1 <...> | Week 2 <...> | Week 3 <...> | Week 4 <...>
  Rule for each week: <what to keep, what to cut>

  COST EXPECTATIONS (one operator's ranges)
  SEARCH ADS ADD-ON (optional)

  CHECKS MISSED: <none | list>
  MISSING: <pixel event | finished ads | target CPA | ...>

tweaks:
  - what: Target CPA
    how: Give your real break-even cost per sale if you know it. A guess from another channel works, but say so, and the skill will mark the budget as based on an estimate.
  - what: Daily budget
    how: A small budget means fewer ad groups, not thinner ones. State your total and the skill sets how many groups it can feed.
  - what: Number of ads
    how: Give 3 to 5 finished ads. Fewer than 3 blocks the plan, since each ad group needs at least 3 to test.
  - what: Past buyers list
    how: Add a list of customers who agreed to marketing and it builds lookalike seeds and a retargeting exclusion from it.

judge:
  - The budget for each ad group is shown with its formula, not just a number.
  - It tells you honestly how many purchases your budget buys in 7 days.
  - Where the sources differ on budget or interests, you see both numbers and the reason.
  - There are at least 3 ads in every ad group.
  - It makes no promise about results.

test:
  - Give it a $20 a day budget. It should lay out one broad ad group with 3 ads, not a spread of many groups.
  - Give it no pixel. It should mark the plan blocked and say why.
  - Run it twice on the same inputs. The layout and budgets should match.
  - Check one budget by hand. Daily budget times 7, divided by your CPA, should give the purchases it quoted.

improve:
  - Add your real CPA and margin to the skill file, so the budget math uses your numbers and not estimates.
  - Add your country, so the lookalike advice (broad lookalikes for small countries) fits.
  - Save the layout and names that worked to your brand file, so your next campaign starts from them.
  - Pair it with the TikTok ads account setup checker before launch and the TikTok ad test reader after.

works_best_with:
  tools:
    - {name: "TikTok Ads Manager", why: "Needs a TikTok ads account with a payment method; you pay for ad spend. Where the campaign is built, and where the keyword planner and audience manager live."}
    - {name: "Shopify", why: "Paid plan needed. The official TikTok app sends purchase events the campaign optimises for."}
  inputs:
    - "Your break-even cost per sale from the break-even ROAS and CPA calculator"
    - "A list of your three best hooks from other channels"
    - "Screenshots of your pixel events from the last week"

terms:
  - term: Ad group
    meaning: The middle level of a TikTok campaign. It holds the budget, audience, placement and bid for a set of ads.
  - term: Learning phase
    meaning: The first days when TikTok tests who to show your ad to. Results swing until it ends.
  - term: Lookalike audience
    meaning: People TikTok finds who are similar to a group you give it, such as past buyers.
