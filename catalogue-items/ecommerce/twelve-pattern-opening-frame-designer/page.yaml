new_slug: twelve-pattern-opening-frame-designer
name: Twelve-pattern opening frame designer
summary: Pick opening frames for your ad from twelve visual patterns. Get a design brief for each first-frame test, with layout, light and text notes.
job: make-image-ads
headline: Twelve-pattern opening frame designer
subhead: Share product photos, buyer, ad angle, brand rules and placement. Get three to five opening frame specs with layout and light notes.
explain: |-
  The first frame is your ad's thumbnail. It decides whether someone stops scrolling.

  This skill picks three to five of twelve visual patterns that fit your product, buyer and ad angle. For each one it writes a brief: what is in the frame, the layout, the text, the light and the colors. It also says which pattern to test first and what to change in each A/B variant. It flags health, before and after and comparison frames, which need checking against ad rules.
when:
  - You have product photos and an ad angle, and need three to five first frames to test.
  - Your ads get few thumb stops and you want fresh visual ideas.
  - You need a written brief to hand to a designer or photographer.
not_for:
  - You need a finished image or a render. This gives written briefs only, so use a designer or an image tool to make the frame.
  - You want the spoken or written first line of the ad. Write that first, then pair it with each frame, because the method says to match the two.
  - You plan regulated health claims or competitor comparisons without checked facts. Use a plain product shot with no claim text instead.
you_give:
  - Product photos
  - Buyer
  - Ad angle
  - Brand rules and placement
you_get:
  - Three to five opening frame specs with layout and light notes
  - The sources used, missing inputs and assumptions
how_to_use:
  - Open the skill in your AI, or copy it and paste it into a new chat.
  - Add your product photos or a description of them, your buyer, your ad angle and where the ad will run.
  - Read the frame specs. Test the pattern it names first.
  - Check any health, before and after or comparison frame against the ad platform's rules and your own facts.
  - Give each brief to your designer, or use it with an image tool.
output_sample:
  input:
    - Your product photos and packaging
    - Your core claim or ad angle
    - Your buyer, in plain words
    - Where the ad will run, such as Meta feed, Reels, Story or Google Display
    - Your brand visual rules (optional)
  output:
    - name: Chosen patterns
      contains: Three to five of the twelve visual patterns, picked to fit your theme, product and buyer.
    - name: Frame spec
      contains: "For each pattern: subject, layout, background, text overlay, light and colors."
    - name: Production notes
      contains: "For each frame: photo type, assets you have or lack, time estimate and A/B test variants."
    - name: Verbal hook pairing
      contains: A spoken or written hook to pair with each frame, as the rules require.
    - name: Sources, gaps and assumptions
      contains: The facts used, inputs that were missing and what the AI had to assume.
how_it_works:
  - title: Check the inputs
    text: Confirm product photos, buyer, ad angle, brand rules and placement. Mark facts that are missing.
  - title: Pick three to five patterns
    text: Match the twelve patterns to your theme, product and buyer. Skip any that need photos or claims you do not have.
  - title: Design each frame
    text: For each pattern, set the subject, layout, background, text, light and colors.
  - title: Add production notes
    text: List the photo type, what you have and lack, the time to make it, and A/B variants.
  - title: Pair with a first line
    text: Each frame gets a spoken or written hook to go with it.
  - title: Check the rules
    text: The first frame must read in half a second, with five to seven words of text at most.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
