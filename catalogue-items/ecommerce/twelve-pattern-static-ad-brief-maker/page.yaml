new_slug: twelve-pattern-static-ad-brief-maker
name: Twelve-pattern static ad brief maker
summary: Pick one of 12 static ad patterns for your product and buyer stage. Get a static ad brief with copy, layout and image notes.
job: make-image-ads
headline: Twelve-pattern static ad brief maker
subhead: Tell your AI about your product, your buyer and the proof you have. It picks one of twelve static ad patterns and writes the brief. You get the copy, the layout and the image notes.
explain: |-
  Twelve static ad patterns cover most still ads, from a single pain moment to a last-chance review. Each one needs certain proof. A testimonial ad needs a real review. A comparison ad needs checked facts.

  This skill matches your buyer stage and the proof you really have to one pattern. It writes the copy, the layout and the image notes. It uses only your facts, so a count, quote or deadline is never made up.
when:
  - You need a still ad for Meta or another feed and want a common pattern to start from.
  - A designer asks for a brief and you only have a product and some reviews.
  - You want two opposite ads to test against each other in the same spot.
  - You are not sure which ad style fits a cold buyer and which fits a warm one.
not_for:
  - "You have no reviews, tests or other proof: write a plain product listing or ask a few customers for feedback first."
  - "You want a video ad: this makes still images only, so brief a video with a person who shoots video."
  - "You want to mix two ad styles in one ad: this picks one pattern per ad, so run it twice."
you_give:
  - Your product and a one-sentence description
  - Your main buyer, in a line or two
  - "Where the buyer is: cold, warm or ready to buy"
  - Proof you have, such as real reviews, test results or demos
  - Your offer terms (optional)
  - Design or budget limits (optional)
you_get:
  - One chosen ad pattern with the reason it fits
  - Headline, sub line, proof line and a short call to action
  - A simple layout diagram
  - A list of proof you must have before you run the ad
  - Notes for a photo shoot or AI image
  - An opposite version to test (optional)
how_to_use:
  - Gather your product facts, your buyer, real reviews or test results, and any offer or budget limits.
  - Open Claude, ChatGPT or Gemini and paste in the skill from this page. No code or paid tool is needed.
  - Paste your product, buyer stage and proof. Tell your AI what you do not have.
  - Read the pattern it picked. Check that every claim in the copy matches your real proof.
  - Hand the brief to a designer, or use the production notes to make the image yourself.
  - Ask for the opposite version if you want to test two ads.
output_sample:
  input:
    - Your product and a one-sentence description
    - Your main buyer, in a line or two
    - "Where the buyer is: cold, warm or ready to buy"
    - Proof you really have, such as reviews or test results
    - Offer terms and design or budget limits (optional)
  output:
    - name: Archetype
      contains: The one ad pattern picked from the twelve, based on buyer stage, proof and your strongest claim.
    - name: Visual
      contains: One sentence that describes the image the ad needs.
    - name: Copy
      contains: Headline, optional sub line, proof line and a call to action of three words at most.
    - name: Layout
      contains: A simple text diagram that shows where each part sits on the ad.
    - name: Evidence required
      contains: The proof you must have in hand before the ad can run.
    - name: Production notes
      contains: Notes for a photo shoot or for making the image with AI.
    - name: Variation (optional)
      contains: An opposite version of the same ad that you can test against it.
how_it_works:
  - title: Check the inputs
    text: Confirm product, buyer stage, offer, proof and production limits. Mark facts that are missing.
  - title: Narrow by buyer stage
    text: Cold, warm and ready-to-buy buyers each get four of the twelve patterns.
  - title: Narrow by proof
    text: A pattern is ruled out if you lack the proof it needs, such as a real review or a real deadline.
  - title: Pick one pattern
    text: Your strongest single claim picks the one pattern. Patterns are never mixed.
  - title: Write the brief
    text: Visual, headline, sub line, proof line, a call to action of three words at most, and a layout diagram.
  - title: List the proof you need
    text: The proof you must hold before the ad runs.
  - title: Add the opposite version
    text: Optional. A matching opposite ad to test in the same spot.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
