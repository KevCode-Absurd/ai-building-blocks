  - title: Calculate Diagnostic Metrics
    text: Follow the calculate diagnostic metrics section in the full method and keep its required fields and decision rules.
  - title: Plot to Hook x Hold Matrix
    text: Follow the plot to hook x hold matrix section in the full method and keep its required fields and decision rules.
  - title: Prescribe Fixes By Quadrant
    text: Follow the prescribe fixes by quadrant section in the full method and keep its required fields and decision rules.
  - title: Static / Carousel Ads
    text: Follow the static / carousel ads section in the full method and keep its required fields and decision rules.
  - title: Deliver the Diagnosis
    text: Follow the deliver the diagnosis section in the full method and keep its required fields and decision rules.
  - title: Review the result
    text: Return metric math, four-quadrant labels and fixes for each ad. Check facts, math and the decisions before any action.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
