new_slug: winning-ad-variant-writer
name: "Winning ad variant writer"
summary: "Turn one winning Meta ad into same-voice variants for each customer group, with a launch plan. Paste your winner, groups and product facts."
job: write-ad-copy
thinking: medium
thinking_why: "It rewrites in a matching voice and plans a launch, so a mid-size model gives clean variants."

headline: "Winning ad variant writer"
subhead: "Paste your best ad, the customer groups that bring most of your revenue and your product facts. It writes variants of the primary text and headline in the winner's own voice, one per group, plus a launch plan with a CBO test, a zombie campaign and a weekly creative hour."

explain: |
  A winning ad fades. Many stores rest all their results on one ad, then scramble when it tires. A faster move is to multiply it. One operator's view is that Meta reads your copy and image to help decide who sees an ad. On that view, a use-case word in the headline or first line, such as "for trail runs" or "for long flights", reaches a new pocket of people without rebuilding the ad. Treat that as an assumption to test, not a Meta promise. Triggers must name a use, never a personal trait such as health, age or family status.

  This skill takes the winner and the groups that bring most of your revenue (the 80/20 split is a rule of thumb, so use your own numbers), and writes same-voice variants for each group. You ask the AI to read the ad as its author, so a reader can't tell different writers made the versions. Only what relates to that group changes. The plan then launches the variants together, rescues good ads that got no spend and sets a weekly hour for fresh creative. The ideas come from one operator's lead-generation work, translated here to store buyers.

when:
  - You have one ad that works and you want more ads like it.
  - Your winner is tiring and you need fresh versions that keep its voice.
  - Some ads you rated highly got no spend and you want to give them a fair run.
not_for:
  - "You have no proven ad yet, or too little spend to test: write one first with the Ad opening writer and reviewer."
  - "You want new angles, not the same ad for new groups: use the Ad angle writer."
  - "You need to check an ad against Meta's rules before it runs: use the Meta ad policy checker."

you_give:
  - Your winning ad, with its copy and image
  - The customer groups that bring most of your revenue, with the words they use
  - Product and offer facts
  - Your ad policy limits, such as claims you may not make (optional)
you_get:
  - Variants of primary text and headline for each group
  - Identity-trigger versions, with the group word in the first line
  - A launch plan with a CBO test and a zombie campaign
  - A one-hour weekly creative slot

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the winning ad's copy and attach its image. Say how much it spent and what result it got.
  - List the customer groups that bring the most revenue, with their words, and your product facts.
  - Check each variant against your product facts and Meta's ad policies before it goes live.
  - Launch the winners together in one CBO and let Meta move spend.
output_sample:
  input:
    - Your winning ad copy and image, with its spend and result
    - Your top customer groups and the words they use
    - Your product and offer facts
    - Claims you may not make (optional)
  prerequisites:
    - A Meta ad that already works and has enough spend to read
    - Your brand brain from the Website brand brain builder (optional)
  output:
    - name: WINNER
      contains: The ad you chose, its spend and result, and notes on its tone, sentence length and signature phrases.
    - name: VARIANTS
      contains: For each customer group, a headline, primary text, the group word and where it sits, and the facts used.
    - name: LAUNCH PLAN
      contains: How to run the winners together in one CBO test, with budget and read window.
    - name: Zombie campaign
      contains: Which good ads got no spend, the ad set to put them in, and when to review.
    - name: Weekly creative hour
      contains: The day and time you set aside each week to make fresh ads.
    - name: POLICY AND CLAIMS CHECK
      contains: A pass, or a list of changes needed to match ad policy and your facts.
    - name: CHECKS MISSED
      contains: Any check that failed or could not be run, or none.

how_it_works:
  - title: Picks the winner
    text: By spend and result. It keeps it running. You don't switch off the others and ride one ad.
  - title: Finds identity triggers
    text: Groups or uses that bring most of your revenue, such as "for trail runs". Triggers name a use, not a personal trait.
  - title: Writes in the author's voice
    text: The AI reads the winner as its author and writes versions so a reader could not tell different writers made them.
  - title: Changes only what fits the group
    text: Start with body copy, then headlines, then the creative.
  - title: Uses longer copy where it helps
    text: One operator finds longer copy helps Meta place the ad more precisely. Treat it as something to test.
  - title: Plans the launch
    text: Winners go together in one CBO and Meta shifts spend.
  - title: Adds a zombie campaign
    text: Ads you rate highly that got no spend go into their own ad set, so each gets its own budget for a fair read. Meta does not guarantee delivery.
  - title: Checks policy and facts
    text: Every variant is checked against ad policy and your facts. No invented customer details or results.

output_shape: |
  WINNER: <ad name> | spend <$> | result <CPA or ROAS> | voice notes: <tone, sentence length, signature phrases>

  VARIANTS
  Group: <customer group> | their words: <phrases>
    Headline: <variant>
    Primary text: <variant>
    Identity trigger: <the group or use-case word, where it sits>
    Facts used: <product fact or claim and its source>

  LAUNCH PLAN
  Test: <one CBO | winners together | budget | read window>
  Zombie campaign: <which no-spend ads | own ad set | when to review>
  Weekly creative hour: <day and time>

  POLICY AND CLAIMS CHECK: <pass or list of changes>
  CHECKS MISSED: <list or none>

tweaks:
  - what: The groups you give
    how: Use real groups from your sales data, not guesses. It will not invent customer attributes.
  - what: Winner's voice
    how: Paste two or three of your best older ads too, so the voice match is closer.
  - what: Copy length
    how: Ask for a longer version to give Meta more to read, and a short version to compare.
  - what: Product facts and claims
    how: Paste what you can truthfully say. Variants stay inside it.
  - what: Ad policy limits
    how: Say what your category may not claim, such as health results or personal-attribute wording.

judge:
  - A reader cannot tell the variants from the original by voice.
  - Each variant changes only what relates to its group.
  - No variant makes a claim your facts don't support.
  - No variant names a personal attribute in a way ad policy forbids.
  - The plan says which result decides if a variant wins and when to read it.
  - The zombie campaign step names which ads go in.

test:
  - Show three variants and the original to someone who knows your brand and ask which is the original.
  - Check every claim in the variants against your product facts line by line.
  - Launch two variants against the winner with the same budget and read after 7 days or more.
  - Run it twice on the same winner and check the voice stays the same.

improve:
  - Add your approved claims and banned phrases to the skill file so every variant stays inside them.
  - Save the groups that worked in your brand file for the next run.
  - Add your own rule for how many variants to launch at once, based on your budget.
  - Pair it with the ad angle multiplier for new angles and the Meta ads compliance checker before launch.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "It writes and rewrites text you paste, so any current chat AI will do."}
    - {name: "Meta Ads Manager", why: "Its campaign setup is where the CBO test and the zombie ad set are built."}
  inputs:
    - "Two or three of your best older ads, for a closer voice match"
    - "Revenue by customer group from your store reports"
    - "Review text from each group, to borrow their real words"

terms:
  - term: Identity trigger
    meaning: A word for a group or use case in the headline or first line, such as "for runners", that tells the right people the ad is for them.
  - term: Zombie campaign
    meaning: A separate ad set for ads you rated highly that got no spend, so each gets its own budget for a fair read.
  - term: CBO
    meaning: Campaign budget optimization. You set one budget and Meta divides it between ads.
