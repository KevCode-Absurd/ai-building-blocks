terms:
  - term: Avatar card
    meaning: A short, fixed description of what carries the ad. Here it's usually your product's working part.
  - term: Chain
    meaning: How something works, written as 2 to 4 linked steps. This meets that, that happens, so you get this.
  - term: Parts key
    meaning: A list giving each part of the process one colour and one shape, kept the same in every shot.
  - term: Lock lines
    meaning: Short lines for the look, the parts and the product, pasted word for word into every prompt.
  - term: Dissolve
    meaning: A soft fade from one clip into the next.
