new_slug: ab-test-traffic-checker
name: "A/B test traffic checker"
summary: "Paste visits, orders and revenue. Get the test size, weeks needed and a readiness score out of 100."
job: audit-landing-page
thinking: high
thinking_why: "It reads a lot of data or many customer words, and the numbers and quotes must be right."

headline: "A/B test traffic checker"
subhead: Paste your visits, orders or sign-ups and revenue for a set of dates. It works out revenue per visitor for each traffic source and sizes a fair test with the standard sum. You get the visitors and weeks needed, a verdict and a test readiness score out of 100.

explain: |
  Conversion rate (the share of visitors who buy or sign up) is the number everyone quotes, and on its own it misleads. It drops when you send more new people from ads, rises when you cut them, and says nothing about how much each buyer spends. Teams redesign pages to fix a number that was never broken, or call a test after a few dozen sales.

  This skill reads your numbers carefully. It works out revenue per visitor, splits it by where visitors came from, and shows how much a change in that mix explains. Then it sizes a test with the sum statisticians use as a rule of thumb, from your conversion rate and the smallest lift worth finding, and turns that into weeks at your traffic. If the test would run past about four weeks, it says so, and tells you to test a bolder change or to ship the fix and watch.

when:
  - Someone says "our conversion rate dropped" and wants a redesign.
  - You changed a page and want to know if it worked.
  - You're thinking about A/B testing and want to know if you have the traffic for it.

you_give:
  - Visits, orders or sign-ups, and revenue, with the start and end dates
  - The same split by traffic source and by phone or desktop (optional, but it explains a lot)
  - The change you'd test and the smallest lift worth acting on (optional)
  - Your margin per order (optional)
you_get:
  - A numbers table with conversion rate, average order value and revenue per visitor, each sum shown
  - A short read of what moved and what the traffic mix explains
  - The test sizing written out, with visitors and weeks needed
  - A verdict (can test, test a bolder change, or ship and watch) and three next actions
  - A test readiness score out of 100, showing how much of the needed sample your traffic reaches in four weeks

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your numbers for one closed date range, such as all of last month, with the dates.
  - Add the split by traffic source if your analytics shows it.
  - Say what you're trying to decide, such as "did the new page work?" or "can we A/B test the plan box?".
  - Check which figures are marked "your data" and which are "rule of thumb" before you quote any of them.

how_it_works:
  - title: Works out the honest numbers
    text: Conversion rate, average order value and revenue per visitor, plus profit per visitor if you gave a margin. Every sum is shown.
  - title: Compares you only with you
    text: Never uses another business's rate as a target. A 9% rate on cheap orders can be worse than 1% on large ones.
  - title: Splits by traffic source
    text: Shows each source side by side, so you can see when a shift in who's visiting, not the page, moved the number.
  - title: Picks the lift worth finding
    text: Uses the smallest change that would pay for the work, or 20% for a small business if you don't say. Half the lift needs four times the visitors.
  - title: Sizes the test
    text: Visitors per version equals 16 times p times (1 minus p), divided by the change squared. Then it converts that into whole weeks at your traffic.
  - title: Gives a verdict
    text: Can test if it finishes in about four weeks. Otherwise test a bolder change, or ship the fix and compare revenue per visitor before and after.
  - title: Sets the rules
    text: Fix the sample first, don't stop early on a good-looking result, keep the split even, and send any email or sale to both versions.

output_shape: |
  WINDOW: <the dates the numbers cover>

  NUMBERS                                   Source
  Visits                  <number>          your data
  Orders or sign-ups      <number>          your data
  Conversion rate         <rate> (<sum>)    your data
  Average order value     <amount> (<sum>)  your data
  Revenue per visitor     <amount> (<sum>)  your data
  <one row block per traffic group, if supplied>

  READ
  - <4 to 6 lines: what moved, what the mix explains, what's unknown>

  TEST SIZING                               rule of thumb
  Lift to find: <n>%   Current rate p: <rate>
  16 x p x (1 - p) / (p x lift)² = <visitors per version>
  Total: <n>   Days at current traffic: <n>, rounded to <n> weeks

  VERDICT: <can test | test a bolder change | ship and watch>

  TEST READINESS SCORE
  <visitors in 28 days> / <total visitors needed> x 100 = <score> (capped at 100)

  NEXT 3 ACTIONS
  1. <action tied to a number>

example:
  business: sprout
  input: |
    [the skill]

    Page: sprout.example/products/sprout. Visits are ad link clicks
    (store visit counts not exported). Practice numbers, USD.
    ad / clicks / purchases / revenue
    T1 Hot girl tummy (pain)          4950  198  8336
    P1 Too expensive (61% off)        5530  151  5164
    P2 Dont pay full price (61% off)  5569   50  1555
    S1 Trusted by 1M (61% off)        1600   38  1254
    H1 One step never skip (habit)    1300   44  2015
    K1 Fiber kids                     2030   63  3062
    F1 Fiber question                 1524   46  1858
    W1 Muscle weight loss              900   23  1024
    R1 Runner                          538   10   400
    Each ad ran 14 to 42 days; exact dates not exported.
    First order $29.99 (with text sign-up), renews at $49.99.

    Question: the team wants to A/B test the plan box, because the
    ads say 61% off and the page says 52% and 55%. Can we, and which
    number should we judge the page by?
  output: |
    WINDOW: 14 to 42 days per ad. MISSING: exact dates.

    NUMBERS                           All ads    Source
    Visits (ad clicks)                23,941     your data
    Purchases                         623        your data
    Conversion rate (623 / 23,941)    2.60%      your data
    Average order (24,668 / 623)      $39.60     your data
    Revenue per visit (24,668/23,941) $1.03      your data
    Profit per visit                  MISSING: margin

    BY KIND OF AD          Clicks   Buy rate   Avg order   Rev/visit
    61% off (P1, P2, S1)   12,699   1.88%      $33.36      $0.63
    Everything else        11,242   3.42%      $43.48      $1.49

    READ
    - Visitors from the 61% off ads buy less often and spend less.
      Each of their visits is worth $0.63, against $1.49 for the rest.
    - So the page's overall rate moves with the ad mix. More spend on
      offer ads lowers conversion with no change to the page.
    - Judge the page by revenue per visit, split by kind of ad.
    - These are first orders only. MISSING: how many renew at $49.99.

    TEST SIZING                       rule of thumb
    Lift to find: 20% (none given; small-store default)
    p = 0.026, change = 0.026 x 0.20 = 0.0052
    16 x 0.026 x 0.974 / 0.0052² = about 15,000 visits per version
    Total for an A/B test: about 30,000, more than all 23,941 clicks
    in this file. A 10% lift would need about 120,000.
    Days at current traffic: MISSING, since there are no dates.

    VERDICT: ship and watch. The fix is a mismatch between the ad
    and the page, so it doesn't need a test to prove it.

    NEXT 3 ACTIONS
    1. Make the discount number on the page match the ad. Compare
       revenue per visit for the offer ads (now $0.63) before and
       after, knowing that isn't proof.
    2. Export store visits by source and device, with dates, so the
       weeks a test would take can be worked out.
    3. Get the renewal rate, so a $29.99 first order can be valued
       against the $49.99 renewals.

tweaks:
  - what: The lift worth finding
    how: Say "only worth it at 10% or more" and the sizing uses that. A smaller lift needs far more visitors, so pick the smallest one that would change what you do.
  - what: The traffic split
    how: Add visits and orders by source (ads, email, search) and by device. The read will say how much of any change comes from the mix rather than the page.
  - what: Your margin
    how: Add "margin 70%" or a profit per order and it judges by profit per visitor, which is harder to fool than revenue.
  - what: A before and after
    how: Paste two windows, one before the change and one after. It compares them on revenue per visitor and names the traffic mix in each.

judge:
  - Revenue per visitor is shown, or it says exactly why it can't be worked out.
  - The sample-size sum is written out, with the lift it uses named.
  - Every figure is marked "your data" or "rule of thumb". Nothing comes from an industry average.
  - The verdict says how many weeks a test would take, or what's missing to say.
  - Nothing is called "significant" before the planned sample is reached.

test:
  - Use a period where you know why the numbers moved, such as a sale week. It should explain the jump through traffic mix or order size, not call the page better.
  - Work out revenue per visitor yourself (revenue divided by visits) for one window and check it matches.
  - Put your numbers into a free online A/B test sample-size calculator. The visitors per version should be close to the skill's.
  - Halve the lift you ask for. The visitors needed should go up about four times.

improve:
  - Write your margin and the smallest lift worth acting on into "What you need" in the skill file, so every sizing uses them.
  - If your goal isn't a purchase (a sign-up, a booked call), change the words in step 1 so "orders" means your goal.
  - Add your traffic sources by name to step 3 (for example "Meta ads, new people" and "email, past buyers"), so the mix is read in your own groups.
  - Save each month's revenue per visitor in your brand file. The next run compares you with your own past, which is the comparison that counts.
  - Pair it with the "Landing page auditor" when the answer is "ship and watch", to find the obvious fixes to ship.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "The sums are simple, and the main chat AIs all show their working when asked."}
    - {name: "Google Sheets", why: "Keeps each month's numbers in one place, so you can check every sum and compare with your own past."}
    - {name: "Evan Miller's sample size calculator", why: "Free, and a quick second check on the visitors per version."}
  inputs:
    - "Daily visits to the page you'd test, so the weeks a test needs can be worked out"
    - "Your margin per order, so the page can be judged by profit per visitor"
    - "How many first orders renew or reorder, so a cheap first order is valued properly"
    - "A note of any sales, emails or price changes in the window, so their effect isn't read as the page"

terms:
  - term: Conversion rate
    meaning: The share of visitors who buy or sign up. 623 purchases from 23,941 visits is 2.60%.
  - term: Revenue per visitor
    meaning: Revenue divided by visitors. It tells you what each visit is worth.
  - term: A/B test
    meaning: Showing two versions of a page to different visitors at the same time and comparing results.
  - term: Lift
    meaning: How much better the new version does, as a share of the old. 2.6% to 3.1% is about a 20% lift.
  - term: Rule of thumb
    meaning: A rough working guide, not a published benchmark. The skill labels these so you don't quote them as fact.
