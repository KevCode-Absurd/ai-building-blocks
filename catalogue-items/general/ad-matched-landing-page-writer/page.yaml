new_slug: ad-matched-landing-page-writer
name: "Ad-matched landing page writer"
summary: "Paste your ad, facts and reviews. Get landing page copy that picks up where the ad left off."
job: write-landing-page

headline: "Ad-matched landing page writer"
subhead: Give it the ad, your product facts and offer, and real customer words if you have them. It opens the page where the ad left off and answers each doubt your customers raise. You get the page copy, with the full cost stated, and a list of facts still missing.

explain: |
  People tap an ad because of one promise. Then the page opens with the product name, lists every benefit and hides the renewal price in small print. The promise they tapped for has gone, so they leave.

  This skill writes a page for one buyer, one reason to buy and one offer. The first screen carries on from the ad: its main words in the headline, the same product in the picture, the same offer at the same price, one button and your guarantee line. Then it lists the doubts your customers actually raise, from your reviews and questions, and gives each one a section whose heading states the answer, so a skimmer still gets the case. Before the last button it states the whole cost: the renewal price, shipping, delivery time and returns terms. Every number and claim comes from your facts. Anything you didn't supply is left empty and listed.

when:
  - Your ad gets clicks but the page it sends people to doesn't sell.
  - You're launching an ad for a new kind of buyer and need a page that speaks to them.
  - Your product page tries to say everything to everyone, and you want a focused version.

you_give:
  - Your facts, such as what you sell, prices and offer names, guarantee, delivery and shipping terms, the claims you may make and any rating you hold
  - The ad that sends people there, with its first line, its picture (attach it; your AI can see pictures), buyer and offer (strongly recommended)
  - Real customer words, such as reviews, pre-sale questions and return reasons, each with a source (optional, best)
  - Whether it's used up and bought again (like a refill) or bought once and kept (like a jacket) (optional)
you_get:
  - A page brief naming the buyer, the reason to buy and the offer
  - A first screen built from the ad, and a list of your buyers' doubts with the section that answers each
  - Body sections with answer-first headings, a cost block, questions and a closing
  - A list of every field left empty because a fact was missing
  - Any of its own checks the page still misses, each named with the reason

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts and current offers with their exact names and prices.
  - Paste the ad word for word, attach its picture, and say who it's for.
  - Paste 10 to 20 real reviews or pre-sale questions with where each came from.
  - Check the "Left empty" list, then read the first screen on your phone to see it fits.

how_it_works:
  - title: Pins the page
    text: One buyer, one reason to buy, one offer. A different buyer or offer gets its own page.
  - title: Builds the first screen from the ad
    text: The ad's words in the headline, a plain line on what it is, the same product and offer, one button and your guarantee line.
  - title: Lists the doubts
    text: Takes each distinct worry from your customer words, most common first. With none, it uses the order shoppers usually need.
  - title: Answers each doubt
    text: One section per doubt. The heading states the answer and the text gives the fact or quote that backs it.
  - title: States the full cost
    text: Price, renewal price, shipping, delivery time and returns terms, all before the last button, so checkout holds no surprise.
  - title: Fits how it's bought
    text: Taste, contents and pausing for things used up. Fit, materials, returns and warranty for things kept, never a price per day.
  - title: Uses only real proof
    text: Quotes customers word for word and never writes a review, rating, count or deadline you didn't supply.
  - title: Checks the page
    text: Goes through its own checks, such as the full cost before the last button, fixes what it can, and names any check still missed.

output_shape: |
  PAGE BRIEF
  Buyer: <who>   Reason to buy: <one reason>   Offer: <name and price>
  Ad's opening line: "<...>"

  FIRST SCREEN
  Headline: <carries the ad's main words>
  What it is: <kind of product and form, in plain words>
  Picture: <the product, pack and variant the ad showed>
  Offer: <name and price the ad named>   Proof: <one that backs the promise, or none>
  Button: <what the buyer gets>   Under it: <risk line from your terms>

  DOUBTS
  <doubt in the buyer's words> | <sources> | answered in <section>

  BODY
  <Heading that states the answer>
  <1 to 3 short paragraphs from your facts and quotes>

  COST BLOCK
  <price, renewal, shipping, delivery, returns or guarantee terms>

  QUESTIONS
  <doubt still open> / <answer from your facts>

  CLOSING
  <one line back to the ad's promise> <button> <risk line>

  LEFT EMPTY
  MISSING: <each fact the page needed>

  CHECKS MISSED
  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Facts: Sprout Original (Adults) greens gummies, Low Sugar. Pouch of 28
    daily packs; tear one open, eat the handful inside. 60+ ingredients,
    21 vitamins and minerals, 6 g prebiotic fiber per pack. Vegan, pectin
    base. Subscribe: $49.99 every 4 weeks. First box $29.99 only with the
    text sign-up discount. One-time $66.65. "Pause Or Cancel Any Time."
    30-day money-back guarantee, first order only. Ships within 24 hours,
    arrives in 3-5 days on average. Free shipping on the first order.
    One-time orders say "No Free Shipping"; that cost is not stated. Survey (say "of surveyed users"): 95% take it at least 4-6x a
    week. Ratings on file disagree (4.8, 4.75, 4.74, 4.0). Sugar-Free uses
    sugar alcohols.

    Ad: "One Step I Never Skip". No offer named. Buyer: has quit powders
    and pill stacks, wants one habit that lasts.

    Customer words: sprout/reviews.md, R1 to R20 and the two fragments.
    Bought again (subscription).
  output: |
    PAGE BRIEF
    Buyer: quit powders and pills, wants one habit that lasts
    Reason to buy: it's the one you'll keep taking
    Offer: Subscribe & Save, Low Sugar, $29.99 first box
    Ad's opening line: "One Step I Never Skip"

    FIRST SCREEN
    Headline: The one daily step you won't skip, because you'll want it
    What it is: Greens, vitamins and fiber in one pack of gummies a day
    Picture: a hand tearing one daily pack straight across the top
    Offer: $29.99 first box with text sign-up, then $49.99 every 4 weeks
    Proof: "[Sprout] has been the one thing I've been able to stick to." (R1)
    Button: Start my first box
    Under it: 30-day money-back guarantee on your first order

    DOUBTS
    Will I actually keep taking it?      | R1, R2       | section 1
    Can it replace my powder and pills?  | R3, R5, R6   | section 2
    What if I don't like the taste?      | R18, R19     | section 3
    Is the subscription a trap?          | R17, R20     | section 4
    Is it worth the price?               | R3, fragment | cost block

    BODY
    1 You'll keep doing it, because there's nothing to mix
    Tear a pack, eat the handful. 95% of surveyed users take it at least
    4 to 6 times a week.
    2 One pack covers the powder and the pill shelf
    60+ ingredients, 21 vitamins and minerals and 6 g prebiotic fiber.
    "I also stopped buying separate probiotic gummies, b12 gummies, and
    multivitamin gummies. I just take these now..." (R5)
    3 Most people like the taste. Some need a few days
    "I thought the first pack I tried tasted terrible, but after the third
    day they started tasting better" (R18). Sensitive stomach? Start with
    Low Sugar. Sugar-Free uses sugar alcohols.
    4 You can pause or cancel any time
    Your first order has a 30-day money-back guarantee.

    COST BLOCK
    First box $29.99 with the text sign-up discount, then $49.99 every
    4 weeks. One-time: $66.65. Free shipping on your first order; one-time
    orders pay shipping (MISSING: the cost). Ships within 24 hours, arrives
    in 3 to 5 days on average. 30-day money-back guarantee, first order only.

    QUESTIONS
    How do I cancel? MISSING: the steps, so this stays unanswered
    Does the price go up? Yes, after the first box: $29.99, then $49.99.

    CLOSING
    Make it the step you keep. Start my first box.
    30-day money-back guarantee on your first order.

    LEFT EMPTY
    MISSING: the steps to cancel (section 4 and the questions need them)
    MISSING: shipping cost on one-time orders
    MISSING: one agreed star rating and its source, so no rating line
    MISSING: a dated reason to buy now, so no deadline

    CHECKS MISSED
    none (the one-time shipping cost is marked MISSING, not guessed)

tweaks:
  - what: The ad
    how: Paste a different ad and you get a different page. The headline, the first offer and the proof line all follow the ad's buyer and promise.
  - what: Customer words
    how: Add reviews, pre-sale questions and return reasons. The doubt list, and so the order of the body, comes from them. Without them it uses a standard order.
  - what: Used up or kept
    how: Say which, if it's not obvious. Things used up get taste, contents and pausing. Things kept get fit, materials, returns and warranty, and never a price per day.
  - what: An existing page
    how: Paste your current page and say "revise this". It keeps what already answers a doubt and rewrites the rest.

judge:
  - The headline carries the ad's main words, and the first offer is the one the ad named.
  - Each body heading states an answer to a real doubt from your customer words.
  - The renewal price, shipping, delivery time and returns terms all appear before the last button. Any your facts don't give shows there as MISSING, never a guess.
  - Every price, number and timeframe on the page appears in your facts.
  - No rating, review count, badge or deadline appears that you didn't supply.
  - Buttons say the same thing all the way down the page.

test:
  - Run it on an ad that already sends traffic to a page you know. The new first screen should repeat the ad's main words and show the price and one button.
  - Leave out your delivery terms. The page should promise no delivery time and list it under "Left empty".
  - Read only the body headings aloud. Someone who hasn't seen the page should be able to say why to buy.
  - Read the doubt list to someone who talks to your customers. Each one should be something buyers really ask.

improve:
  - In step 6, delete the branch that doesn't fit your product, and add your own pack sizes, pause rules or warranty terms.
  - Write your standard button text into step 2, so every page you make uses the same words.
  - Add your current offers with their exact names and prices under "Facts" in the skill, and update them when they change.
  - Save each page brief and its doubt list in your brand file next to the ad it belongs to.
  - Pair it with "Unanswered customer question finder" to build the doubt list from your reviews first, and run "Landing page 30-point checker" before it goes live.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "This is a writing job from facts you supply, and the main chat AIs all handle it well."}
  inputs:
    - "The ad's picture as an image, so the first screen can show the same product and variant"
    - "Your 20 most recent reviews plus your top pre-sale questions from support, so the doubts are real ones"
    - "Your shipping and returns policy text, so the cost block uses your exact terms"
    - "A phone screenshot of your current page, so it can keep what already works"

terms:
  - term: Landing page
    meaning: The page someone lands on after clicking an ad or link.
  - term: First screen
    meaning: What a visitor sees on their phone before scrolling.
  - term: Risk line
    meaning: The short line under the button that removes the worry, such as your guarantee or returns terms.
  - term: Doubt
    meaning: A worry that stops someone buying, such as "will it fit?" or "is this subscription a trap?".
