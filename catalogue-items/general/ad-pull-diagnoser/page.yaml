new_slug: ad-pull-diagnoser
name: "Ad pull diagnoser"
summary: "Find why your ad gets few replies. Paste the ad and your results to get likely causes ranked, with the cheapest fix first."
job: check-ads
thinking: high
thinking_why: "It weighs several possible causes against thin evidence, so it benefits from your strongest model."

headline: "Ad pull diagnoser"
subhead: Give it the ad, your results and where it ran. It checks whether the ad is counted, what the headline says alone, whether the appeal is right and believable, whether the offer is clear, and if the place or size is wrong. You get the causes ranked, cheapest fix first.

explain: |
  When an ad does not pull, the usual response is to change the picture, the colour or the whole campaign. Those are costly changes, and they are rarely the cause. Most weak ads fail in the same few places. The headline offers nothing. The reason to buy is wrong for the product. The claim is too big to believe or too vague to picture. The offer is hidden or the reply is hard to make.

  This skill checks those in the order they tend to matter. It starts by checking the ad is counted at all, since an ad nobody can trace is a guess. Then it reads the headline alone, as a stranger would. It checks the appeal, the claims, the offer and the reply path, and only then asks about the place, the time and the size. Each finding quotes the line or number it rests on. The causes come back ranked by how likely they are and how cheap to fix.

when:
  - An ad, email or page is seen but not answered and you do not know what to change.
  - You have a list of ideas for what is wrong and need an order.
  - You want to fix the cheapest likely cause first, before a redesign.
not_for:
  - "You have no way to trace replies to the ad: key the ad first, then come back."
  - "You want to compare your best ads with your worst ones: use the Winners and losers ad comparer."
  - "You already know the cause and need new wording: use the Reply-getting fix writer."

you_give:
  - The ad as the reader sees it
  - "Results by ad: audience, replies, sales, spend (optional)"
  - Where, when and how big it ran (optional)
you_get:
  - What a stranger would say the headline offers
  - A finding for each of seven checks, marked fine, suspect or broken, with its evidence
  - Causes ranked by likelihood and cost to fix
  - What it could not judge and what would settle it

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the whole ad, including the reply path.
  - Paste your results and say where and when it ran.
  - Fix the top cause first and change nothing else.
  - Take the fixed version to "Reply-getting fix writer" or run a split test against the old one.
output_sample:
  input:
    - Your ad as the reader sees it, with the reply path
    - "Your results by ad: audience, replies, sales, spend (optional)"
    - Where, when and how big the ad ran (optional)
    - Results for your other ads in the same place (optional)
  output:
    - name: Stranger sentence
      contains: One line on what a stranger thinks the headline offers and to whom, or a note that it is unclear.
    - name: Findings
      contains: Seven checks, each marked fine, suspect or broken, with the line or number it rests on.
    - name: Ranked causes
      contains: Each cause with its likelihood, cost to fix and a one-line fix, ordered by likelihood then cost.
    - name: Could not judge
      contains: What the skill could not check and what would settle it.
    - name: MISSING
      contains: Any input you did not give, marked where it would have mattered.
    - name: Checks missed
      contains: One line for each check the skill still missed, or none.

how_it_works:
  - title: Checks it is counted
    text: Looks for a key on the ad and a log of replies by key. Without one, the diagnosis is marked a guess.
  - title: Reads the headline alone
    text: Covers the rest and writes what a stranger would think the ad offers and to whom.
  - title: Checks appeal and belief
    text: Names the reason to buy and checks it fits, sits in the headline and is backed by a figure a reader could picture.
  - title: Checks offer and reply path
    text: Looks for the offer in the headline or subhead, a plain way to reply and one clear ask.
  - title: Checks place, time and size
    text: Only if results exist, and only where the data shows a mismatch.
  - title: Ranks the causes
    text: Orders by likelihood, then cost, and groups causes that share a fix.

output_shape: |
  STRANGER SENTENCE
  This offers <___> to <___> / unclear

  FINDINGS
  1. Counted: <fine / suspect / broken> | <evidence>
  2. Headline alone: <...> | <evidence>
  3. Appeal: <...> | <evidence>
  4. Believable and specific: <...> | <evidence>
  5. Offer and reply path: <...> | <evidence>
  6. Length: <...> | <evidence>
  7. Place, time, size: <...> | <evidence>

  RANKED CAUSES
  <n>. <cause> | likelihood <h/m/l> | cost to fix <l/m/h> | fix: <one line>

  COULD NOT JUDGE
  <what | what would settle it>

  MISSING
  <list>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: Results
    how: Add any other ads you ran in the same place with their counts. It uses them in step 7.
  - what: What counts as a reply
    how: Say if it is a click, a call or a sale, so step 1 knows what to look for.
  - what: How much you can change
    how: Say if the headline, the offer or the media is locked. It ranks the changes you can make.
  - what: Audience
    how: Describe who it was sent to. The headline is read against them.

judge:
  - The headline was judged with the copy covered.
  - Every finding quotes a line or number.
  - Causes are ranked by likelihood, then cost.
  - Nothing is blamed without evidence.
  - Key and counting are checked first.

test:
  - Give it an ad you know failed and check its top cause matches what you later learned.
  - Give it one that worked. It should find few broken checks.
  - Fix the top cause only and run a split test against the old ad.
  - Run it twice. The top cause should be the same.

improve:
  - Add the checks your market needs, such as a legal line or a price claim.
  - Keep each diagnosis and what you fixed, with the later result.
  - Add your usual reply rate per channel so step 7 can compare.
  - Pair it with "Winners and losers ad comparer" when you have several ads to compare.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Reading an ad and weighing causes is text work any strong chat AI does with this skill."}
    - {name: "Your ad platform or email tool", why: "Exports replies by ad for the results input."}
  inputs:
    - "Results for the same ad in other places"
    - "Results for your other ads in the same place"
    - "The exact key or link tag used on each ad"

terms:
  - term: Pull
    meaning: How many replies an ad brings for its audience or cost.
  - term: Key
    meaning: A code on an ad that lets you trace every reply back to it.
  - term: Reply path
    meaning: The steps a reader takes to respond, such as a button, a coupon or a phone number.
