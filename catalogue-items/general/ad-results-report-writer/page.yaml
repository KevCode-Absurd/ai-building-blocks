new_slug: ad-results-report-writer
name: "Ad results report writer"
summary: "Paste two periods of ad totals. Get the one-line answer, what changed and three ranked actions."
job: read-ad-results
thinking: high
thinking_why: "It reads a lot of data or many customer words, and the numbers and quotes must be right."

headline: "Ad results report writer"
subhead: Paste this period's ad totals and the period before. It recalculates every number from the totals and writes a one-page report. You get the answer in one line, the main changes, one open worry and three ranked actions, each with an owner.

explain: |
  Most ad reports are the export with a chart on top. Every number is there and nobody knows what to do. Some reports also average percentages across rows, which gives wrong answers, or credit the ads for a sales jump that came from a restock.

  This skill writes only what someone needs in order to decide. It first recalculates each number from the raw totals: cost per sale, return on spend, click rate. Then it keeps three things apart: what changed, the explanation the data supports, and what to do about it. The answer comes first, in one line, so a busy reader can act on it alone. It never says an action was done unless you show a record of it, marks any budget or pause action as needing your approval, and never invents wins to fill the page.

when:
  - It's the first Monday of the month, your co-founder wants the ad numbers on one page, and the last report was a chart nobody answered.
  - A client asks "so what should we do?" and your export only says what happened.
  - You ran a diagnosis on one ad and now need the account-level page that puts its findings next to the totals.
  - You spent more this month and want to know, with the sums done right, whether it paid off.

not_for:
  - Your sales just fell and you need to know why. Use the ad sales drop analyst first, then bring its findings here.
  - You need to decide whether to keep, fix or replace one ad. Use the campaign keep-or-change checker.
  - You have only one period of totals and no earlier one. It still writes the page, but there is no change column, so it can only describe.
  - You want a forecast or a budget plan. This reports what happened and proposes three actions; it doesn't predict.
  - "You want a quick first pass with fewer checks: use the Ad results brief writer."

you_give:
  - "This period's totals from your ad platform export (Meta Ads Manager or Google Ads: spend, impressions, clicks, purchases, revenue), with the dates, the currency and what each column counts"
  - The same columns for the period before, of the same length, so the two compare fairly
  - Your own orders and revenue for both periods, from your store (optional, but it is what makes the overall return trustworthy)
  - Your targets for cost per sale or return (optional)
  - Findings from a diagnosis, and a log of what was changed last period (optional)
  - Who reads the report and where, such as "a co-founder on a phone" (optional)
you_get:
  - A coverage line saying what the report includes and what's missing
  - The answer in one line, at the top
  - A table of the main numbers, this period against last, with the change
  - Two to four changes that matter, one unresolved worry, and three ranked actions, with budget changes marked for approval
  - Any of its own checks the report still misses, each named

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the totals for this period and the one before, in the same columns.
  - Say the dates, the currency and the attribution window if you know it.
  - Add your targets if you want each number judged against them.
  - "Recalculate one number yourself before you trust it: total spend divided by total purchases is your cost per sale. Check one share or percentage the same way."
  - Fill in the owner of each action, and make each "done when" something a person can look at, before you send the report. Nothing in it has been done until you have a record that it was.

how_it_works:
  - title: Calculates before writing
    text: Works out return, cost per sale, click rate, cost per click and cost per 1,000 impressions from the totals. A change from zero gets no percentage.
  - title: Keeps sources apart
    text: Uses your own sales records for overall efficiency and shows what the ad platform claims separately, because platforms can count the same sale twice.
  - title: Separates three things
    text: What changed, the explanation the data supports, and the action. Unsupported causes are labelled as guesses.
  - title: Leads with the answer
    text: One line the reader could act on alone, then the support in order of weight.
  - title: Picks three actions
    text: Ranked by money at stake, each tied to a number, with an owner and a check. Anything touching a budget, bid or ad status is marked needs approval.
  - title: Checks the report
    text: Goes through its own checks and fixes what it can. Any check still missed gets one line.

output_shape: |
  THE ANSWER
  <one line someone could act on if they read nothing else>

  PERIOD AND COVERAGE
  <dates, currency, attribution window, what's included>
  MISSING: <anything not given>

  NUMBERS
  <table: metric | this period | last period | change | target>

  MAIN CHANGES
  - <two to four changes, each with its numbers>

  ONE UNRESOLVED WORRY
  <the one thing still unexplained, labelled as unconfirmed>

  THREE NEXT ACTIONS
  1. <action>. Owner: <who>. Done when: <how you check it>
     <needs approval, if it changes a budget, bid or ad status>
  2. <action> ...
  3. <action> ...

  CHECKS MISSED
  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Practice results, USD (sprout/ad-results.csv). 9 ads, P1 split
    into two 21-day windows.
    ad / days / spend / impressions / clicks / purchases / revenue
    T1 Hot girl tummy        30  4200  300000  4950  198  8336
    P1 Too expensive d1-21   21  3000  250000  3750  112  3830
    P1 Too expensive d22-42  21  3000  193500  1780   39  1334
    P2 Dont pay full price   30  2500  227300  5569   50  1555
    H1 One step never skip   16  1300   96300  1300   44  2015
    K1 Fiber kids            30  2200  169200  2030   63  3062
    F1 Fiber question        30  1800  138500  1524   46  1858
    S1 Trusted by 1M         30  1600  128000  1600   38  1254
    W1 Muscle weight loss    14   900   64300   900   23  1024
    R1 Runner                30  1000   76900   538   10   400

    No earlier period for the whole account. No targets.
    Brand rule: say "supports", never "fix". Ads say 61% off; the
    product page shows 52% and 55%.
  output: |
    THE ANSWER
    Find out why P1 stopped working before spending more: it cost
    $26.79 a sale in its first 21 days and $76.92 in the next 21.

    PERIOD AND COVERAGE
    9 ads, 14 to 42 days each (exact dates MISSING), USD, practice
    numbers. Revenue is what the ad platform reports. MISSING:
    attribution window, store's own revenue, an earlier period for
    the account, targets. Only P1 has a before and after.

    NUMBERS (all ads)
    Spend                         $21,500
    Purchases                     623
    Platform revenue              $24,668
    Click rate (clicks / impr.)   1.46%
    Cost per click                $0.90
    Cost per 1,000 impressions    $13.08
    Cost per sale                 $34.51
    Return (revenue / spend)      1.15
    Revenue per sale              $39.60
    Earlier period: MISSING, so no change column.

    MAIN CHANGES
    - P1 got much worse in its second 21 days at the same spend.
      Cost per sale went from $26.79 to $76.92, and click rate from
      1.50% to 0.92%.
    - T1 has the lowest cost per sale: $21.21, return 1.98.
    - P2 has the top click rate (2.45%) but only 0.90% of clickers
      buy. $50.00 a sale.
    - R1: $100.00 a sale, but on 10 sales. Too few to call.

    ONE UNRESOLVED WORRY
    Why P1 dropped. The likely reasons (the same people seeing it too
    often, or paying more to reach new people) need reach and
    frequency, which aren't in the export.

    THREE NEXT ACTIONS
    1. Pull reach and frequency for P1's two windows. Owner: MISSING.
       Done when: we know if frequency rose as click rate fell.
    2. Before putting more money into T1, change its opening "Fix the
       Hot Girl Tummy". "Fix" breaks the brand's "supports" rule.
       Judge the new version on its own numbers. Owner: MISSING.
       Needs approval before any budget moves to T1.
    3. Make the ad's discount match the page (61% against 52% or 55%),
       then re-read P2's 0.90% buy rate. A guess, not a proven cause.
       Owner: MISSING.

    Nothing above has been done. No action log was supplied.

tweaks:
  - what: The prior period
    how: Add it and the report becomes a real change report. The "biggest differences" section turns into "what changed", with percentages.
  - what: Targets
    how: Add "target cost per sale $30" and each number gets judged against it. Without targets the report describes only.
  - what: An action log
    how: Paste what you changed last month and whether you checked it. The report will then say which actions were done and verified, and stop recommending them again.
  - what: Length
    how: Ask for "a longer version for the board" and it will expand, but only where the data supports more lines.

judge:
  - Check one number yourself. Cost per sale should be total spend divided by total purchases, not an average of each ad's figure.
  - The first line tells you what to do, on its own.
  - There are exactly three actions, ranked, and each one ties to a number in the report.
  - Any action that changes a budget or pauses an ad says needs approval.
  - No action is described as already done unless you gave it a record.
  - Platform revenue and your own revenue are never added together.
  - Anything missing is named in the coverage line, not quietly left out.

test:
  - Run it on last month, where you already know what happened. The changes it lists should match what you saw. If it misses the big one, check that column was in your export.
  - Work out total cost per sale yourself (all spend divided by all purchases) and compare it with the table.
  - Run it twice on the same numbers. The three actions can be worded differently, but they should point at the same numbers. If they don't, add your targets.
  - Hand it to the person who reads your reports and ask what they'd do first. If they can't say within a minute, ask it for a shorter version.

improve:
  - Put your targets (cost per sale or return) into "What you need" in the skill file, so every report judges against the same line.
  - Name your reader in "What you need", for example "a co-founder who reads it on a phone". The length and the words follow from that.
  - If you report to a client, add their names for campaigns and products to the skill, so the report uses their words, not the platform's.
  - Keep each month's three actions in log.md in your brand file, and paste them in next month so the report can say which were done and checked.
  - Pair it with a skill that finds out why your ads stopped selling. Run that first when something big moved, and paste its findings in here.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all do the sums well when the totals are pasted as a table with clear column names."}
    - {name: "Google Sheets", why: "Keeps both periods side by side, so you can check any number in the report yourself."}
  inputs:
    - "Your own orders and revenue for both periods, so overall return isn't based on platform claims"
    - "Last month's three actions and whether they were done, so the report doesn't repeat them"
    - "Findings from a diagnosis run, so the open worry has evidence behind it"

terms:
  - term: Return (ROAS)
    meaning: Revenue divided by ad spend. 1.24 means $1.24 back in sales for every $1 spent, before costs.
  - term: Click rate (CTR)
    meaning: Clicks divided by impressions. The share of people who saw the ad and clicked.
  - term: Attribution window
    meaning: How long after someone clicks or sees an ad a sale still gets credited to it, for example 7 days.
  - term: Platform-reported revenue
    meaning: The sales the ad platform says its ads caused. Different platforms can claim the same sale.

output_sample:
  input:
    - "This period's totals from your ad platform export, with dates and currency"
    - "The same columns for the period before, of the same length"
    - "Your store's orders and revenue for both periods (optional)"
    - "Your targets for cost per sale or return (optional)"
    - "Who reads the report and where (optional)"
  output:
    - name: "THE ANSWER"
      contains: "One line someone can act on if they read nothing else."
    - name: "PERIOD AND COVERAGE"
      contains: "The dates, currency, attribution window, and anything you did not give."
    - name: "NUMBERS"
      contains: "A table of each metric this period and last, the change and your target."
    - name: "MAIN CHANGES"
      contains: "Two to four changes, each with its numbers."
    - name: "ONE UNRESOLVED WORRY"
      contains: "The one thing still unexplained, marked as unconfirmed."
    - name: "THREE NEXT ACTIONS"
      contains: "Three actions, each with an owner and how you check it is done."
    - name: "CHECKS MISSED"
      contains: "One line for each check it could not run, or none."
