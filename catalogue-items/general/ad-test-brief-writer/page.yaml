new_slug: ad-test-brief-writer
name: Ad test brief writer
summary: Share brand facts and any ad results. Get three ideas, nine distinct designer briefs and questions to fill key gaps.
job: plan-ad-tests
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
headline: Ad test brief writer
subhead: Give it your brand facts and whatever ad results you have. It grades what the results prove, picks a plan, and writes three ideas aimed at different buyer doubts. You get nine versions spelled out for a designer and any check it missed.
explain: |
  Most ad briefs list a few headlines and leave the rest to the designer. The versions end up as the same ad reworded, and ad platforms tend to treat near-copies as one ad and spend on just one of them. So you test less than you think.

  This skill thinks before it writes. First it grades your evidence, from a proper split test down to someone else's ads, because that limits what it may claim. Then it picks one of three plans: explore new ideas, extend a winner that's holding up, or refresh a winner that's wearing out. Each idea names the doubt that stops your buyer (why switch, will it work, will it work for me, is it worth it, can I trust you) and the fact that answers it. Only then does it write three versions, each with its own first frame and its own change in message, person or format.
when:
  - You have a month of ad results and need the next round planned, not guessed.
  - Your test ads keep looking alike and one of them takes all the spend.
  - You hand ads to a designer or freelancer and want them made without a round of questions.
you_give:
  - Your brand file (facts, offers, claims you may make, buyers, voice, competitors)
  - Your ad results per ad for the last 1 to 4 weeks, or what the founder has seen (optional)
  - Your target return or cost per sale (optional)
  - Customer reviews or quotes (optional)
  - Your last brief, so no idea repeats (optional)
you_get:
  - A header with the evidence grade, the plan chosen and why
  - Three ad ideas, each aimed at a different buyer doubt, with a filled-in thinking block
  - Nine versions with layout, headline, picture and what each one changes
  - A footer listing guesses and the questions to ask the founder
  - Any check the brief still misses, one line each
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your brand file underneath, including the claims you may and may not make.
  - Paste your ad results, one row per ad, and your target if you have one.
  - Paste your reviews and your last brief if you have them.
  - Read the header first. If it says "Not proven", treat every idea as a test, not a sure thing.
  - Answer the founder questions in the footer, then run it again for a tighter brief.
how_it_works:
  - title: Grades the evidence
    text: Tested, measured, reported, observed or inferred. The grade caps what the brief may claim.
  - title: Diagnoses in three lines
    text: Who the ads speak to against who buys, which stage has nothing running, and which doubt stops new buyers most.
  - title: Picks a plan
    text: Explore, extend or refresh, from two questions. Is there a measured winner, and is it wearing out?
  - title: Names the doubt
    text: Each idea answers one of five doubts. No two ideas in a brief answer the same one.
  - title: Thinks before headlines
    text: Fills a thinking block with the doubt, the fact that answers it, the moment and a five-link check.
  - title: Writes three real versions
    text: Every version gets its own first frame plus a change in message, person or format, and every field is spelled out.
  - title: Lists the gaps
    text: Ends with lines it rewrote, every guess it marked, and questions for the founder.
output_shape: |
  AD BRIEF <brand>
  EVIDENCE   <tested | measured | reported | observed | inferred>, <basis>
  MISSING    <target, frequency or anything the plan depends on>
  PLAN       <explore | extend | refresh>, <why, and what would change it>
  DIAGNOSIS  <who the ads speak to vs who buys> / <empty stage> /
             <the doubt stopping new buyers>

  IDEA <n>  <name>
    Stage     <waking | comparing | closing>
    Doubt     <why switch | will it work | for me | worth it | trust>:
              "<buyer's words>" (<source>)
    Answer    <what they believe after>, held up by <fact>
    Moment    <a scene>
    Evidence  <grade>, <basis>
    Links     who / gain / proof / risk / step: <strong, thin, missing>
    Product   <product and real price>

    A  Changes: <first frame + message, person or format>
       <layout>. "<headline>"   Support: <line>
       Quote: <exact words and source, or "quote needed">
       Seen: <one line>. Photo: <file or "to be made">
    B ... C ...

  FOOTER  <lines rewritten, fields inferred, questions for the founder>
  CHECKS MISSED  <one line per check still missed, or none>
example:
  business: sprout
  input: |
    [the skill]

    Brand file: Sprout (pasted: products, prices and offers, fine and
    risky claims, who buys, voice, look, competitors, what seems to
    work)

    Reviews: all 20 (pasted)

    Ad results: ad-results.csv, one row per ad, 14 to 30 days
    (practice numbers, pasted)
    Columns: ad_name, format, opening_line, days_live, spend_usd,
    impressions, link_clicks, purchases, revenue_usd

    Last brief: none. Target: none. Offer push: no.

    Write the brief.
  output: |
    AD BRIEF, Sprout
    EVIDENCE   Measured: ad-results.csv, 9 ads, 14 to 30 days. Practice
               numbers. No frequency or on/off in the file.
    MISSING    target return. The account's own: 24,668 / 21,500 = 1.15.
    PLAN       Extend. T1 (return 1.98) beats the account by a wide
               margin. With no frequency, wear can't be checked; P1's
               cost per sale rose from $26.79 to $76.92, so if T1 starts
               doing the same, switch to Refresh.
    DIAGNOSIS  Ads speak mostly to price doubters (P1, P2, S1); the
               quitter (about 40% of buyers) has one ad, H1. / No ad
               speaks to buyers comparing against powders. / "A gummy
               can't hold enough" stops new buyers most.

    IDEA 1  T1's gut moment, a new opening (extends the winner)
      Stage     waking (knows the problem)
      Doubt     will it work for me: "Will this upset my stomach
                more?" (brand file)
      Answer    a gentle daily fiber you'll keep taking. Held up by
                "Supports digestion and gut health", 6 g prebiotic
                fiber per pack, review 8.
      Moment    3 pm at the desk, lunch sitting heavy, a fiber powder
                tub at home still half full (inferred)
      Evidence  measured: T1, 198 purchases, return 1.98 (practice)
      Links     who strong / gain strong / proof strong / risk thin
                (add Low Sugar) / step strong
      Product   Sprout Original, Low Sugar: $29.99 first box with
                text sign-up, then $49.99 every 4 weeks

      A  Changes: quote card first frame; message is gentleness.
         Quote card. "Your daily fiber, minus the drama."
         Quote: "The prebiotics do their job, but not aggressively"
         (review 8, brand site, not marked verified)
         Seen: a torn pack by a laptop, bears in a palm. To be made.
      B  Changes: a clean shaker on a drying rack; person is the
         powder quitter. Claim and proof line.
         "6 g of fiber. Zero shakers to wash."
         Support: "Supports digestion and gut health." Quote needed.
         Seen: the shaker, a pouch beside it. To be made.
      C  Changes: three bottles pushed aside by one pouch; message is
         one pack instead of three. Side by side.
         "One pack instead of three bottles."
         Quote: "I just take these now and it's easier for me to
         manage." (review 5, brand site, not marked verified)

    IDEA 2  The powder quitter, comparing fixes (new)
      Comparing. Doubt: will it work, "A gummy can't hold enough to
      replace my powder." Answer: one pack holds 60+ ingredients, 21
      vitamins and minerals, 6 g fiber. Evidence: inferred (R1, R3).
      A opens on the nutrition label, B on a half-used tub, C on a
      side by side with prices (photos to be made).

    IDEA 3  The busy parent, buying for herself (new)
      Waking. Doubt: can I trust them, "Is this just candy?" (stated
      doubt). Answer: third-party tests for 70 pesticides and 4 heavy
      metals. Moment: the school run, keys in hand (review 15,
      inferred scene). Evidence: inferred.

    FOOTER  Rewrote 1 line (B first said "gentle on your stomach",
      past the allowed claim). Inferred: all three moments.
      Ask the founder: target return? frequency for T1? may we quote
      reviews 1, 3, 5, 8, 15?
    (cut for length: the full run also had every field for ideas 2
    and 3, with all six of their versions spelled out)
tweaks:
  - what: Your target
    how: Add one line such as "target return 1.5". The plan is then chosen on your goal instead of on the account's own average.
  - what: Frequency
    how: Add a frequency column to your results. It's how the skill tells a winner that's holding up from one that's wearing out.
  - what: Offer push
    how: Write "build this round around the offer" and the offer becomes the gain in every idea. Dates and limits stay as they are on file, and no fake urgency is added.
  - what: The last brief
    how: Paste it and the skill avoids repeating any idea or doubt from it, so each round tests something new.
  - what: Product type
    how: For something kept, like a suitcase or a mattress, it adds an idea for buyers comparing options. For something used up, like coffee or a daily gummy, it focuses on the daily moment and a safe first try.
judge:
  - The header grades the evidence, and anything missing (like a target) is written as MISSING, not guessed.
  - Every idea names a doubt in the buyer's words and the fact that answers it. No fact, no idea.
  - No two ideas answer the same doubt.
  - Within each idea, every version has its own first frame and says what else it changes.
  - Every customer quote is word for word with its source, and no photo is named that you don't have.
test:
  - Run it on last month's results, then compare its plan with what you actually did next. If it says "Extend" and picks the ad you'd pick too, that's a good sign. If not, read its diagnosis.
  - Run it twice on the same input. The plan and the three doubts should match. If the plan flips, it's missing a fact like your target; add it.
  - Hand version A of one idea to your designer with no other notes. Count the questions they ask. Every question is a field to fix in the brief or the skill.
  - Lay the nine first frames side by side. If any two look like the same ad, the version rule failed.
improve:
  - Write your target and your usual ad formats into "What you need" in the skill file, so it never has to choose a plan with a caveat.
  - Add your banned claims to step 8, next to the headline rule, so versions can't drift past what you may say (as version B nearly did here).
  - If you only make image ads, delete the video line in step 6, so the brief stays shorter.
  - Answer the footer questions and save the answers in your brand file, so the next brief has fewer "inferred" fields.
  - Pair it with a skill that maps which moments and messages you've already covered before choosing ideas, and one that checks each finished ad before you spend.
works_best_with:
  tools:
    - name: Meta Ads Manager
      why: An export by ad for the last 1 to 4 weeks shows spend, purchases and frequency, which pick explore, extend or refresh.
    - name: Meta Ad Library
      why: Shows what runs now, as 'observed' evidence when you have no export.
    - name: Google Sheets
      why: Tracks cost per sale and frequency week by week, so you can see when a winner starts wearing out.
  inputs:
    - Your stock list and offer dates, so no idea briefs a product or deal that's gone
    - A list of the photos and footage you already have, by file name, so versions name real files
    - Answers from new buyers to 'what nearly stopped you?', so each doubt has a quote
terms:
  - term: Brief
    meaning: The written plan a designer or video maker works from, with every line, picture and choice already decided.
  - term: Version
    meaning: One finished ad within an idea. Here, each version has its own first frame and one more real change.
  - term: Evidence grade
    meaning: How much proof stands behind an idea, from a proper split test down to a reasoned guess.
  - term: Doubt
    meaning: What stops a buyer saying yes, such as "will it work for me?" or "is it worth the money?".
  - term: Return
    meaning: Revenue divided by ad spend. A return of 1.5 means $1.50 back for every $1 spent.
