new_slug: ad-test-budget-setter
name: Ad test budget setter
summary: Set your ad test budget from your target cost per sale. You get a daily budget, a spend limit per ad and a rule for when to cut or wait.
job: plan-ad-tests
thinking: low
thinking_why: It is a few sums and fixed rules.
headline: Ad test budget setter
subhead: Paste your target cost per sale, and the sales and days you want for a test. You get a daily test budget with the sum shown, a spend limit per ad in dollars, a read window, and what to do with a winner or a loser.
explain: |
  Most test budgets are guessed. Ads get cut after one bad day, or left running long after they should have been cut. Either way you learn little and spend too much.

  This prompt works from your own target cost per sale. It shows the sum for a daily test budget, sets a spend limit for each ad before you judge it, and picks a read window with a reason. The rules come from public talks by media buyers and are starting points, not platform rules. It also tells you how many ads a new idea needs, since only a few in a hundred win, and what to do with winners and losers.
when:
  - You are about to start testing ads and do not know how much to spend.
  - You keep cutting ads too early.
  - You need a clear rule you can follow without second-guessing.
not_for:
  - "You have no cost per sale figure yet: work out your break-even cost per sale from your margin first, then come back."
  - "You want the full version with every check: use the Ad test budget calculator."
  - "You want to plan which ideas to test: use a simple list of your top three ad ideas, then run them through this one."
you_give:
  - Your target cost per sale
  - Sales needed and test days (optional)
  - Order value and orders a week (optional)
you_get:
  - A daily test budget with the sum shown
  - A spend limit per ad in dollars
  - A read window with a reason
  - A rule for winners and losers
how_to_use:
  - Copy the prompt and paste it into a chat with Claude, ChatGPT or Gemini, with your details under it.
  - Under the prompt, write your target cost per sale and, if you know them, sales needed and days.
  - Check the sum for the daily budget with a calculator.
  - Write the spend limit down before you launch, so you do not change it later.
output_sample:
  input:
    - Your target cost per sale
    - Sales you need to call a result (optional)
    - Days you can test (optional)
  output:
    - name: INPUTS
      contains: Your target cost per sale, sales needed and test days, as the AI read them.
    - name: DAILY BUDGET
      contains: The sum for a daily test budget with your numbers shown, plus the total spend.
    - name: SPEND LIMIT PER AD
      contains: The most each ad can spend before you judge it, at 3 times and 5 times your target, in dollars.
    - name: READ WINDOW
      contains: How many days to wait before reading results, with the reason.
    - name: ADS FOR THIS IDEA
      contains: How many ads a new idea needs, as a starting point.
    - name: IF IT WINS / IF IT LOSES
      contains: Next steps for a winning ad and for a losing one.
    - name: MISSING
      contains: Anything you did not give, so you know what to add.
how_it_works:
  - title: Works out the budget
    text: Sales needed x cost per sale / days.
  - title: Sets a spend limit
    text: 3 times or 5 times your target, in dollars.
  - title: Picks a read window
    text: About 7 days, never before day 5.
  - title: Counts the ads
    text: 10 to 20 for a new idea.
  - title: Plans what comes next
    text: How to scale a winner and handle a loser.
output_shape: |
  INPUTS: target cost per sale <$>, sales needed <n>, days <n>
  DAILY BUDGET: <sales needed> x <$> / <days> = <$ a day>; total <$>
  SPEND LIMIT PER AD: 3x = <$>; 5x = <$>
  READ WINDOW: <days>, because <your store size>
  ADS FOR THIS IDEA: <10 to 20>
  IF IT WINS: <steps>   IF IT LOSES: <steps>
  MISSING: <what you did not give>
tweaks:
  - what: Target cost per sale
    how: A guess gives a guess. Work it out from your margin if you can.
  - what: Sales needed
    how: Fewer sales mean cheaper but weaker tests.
  - what: Days
    how: Small budgets need longer windows.
  - what: 3 times or 5 times
    how: Pick one and keep to it.
judge:
  - The budget sum is right.
  - Limits are in dollars.
  - The window has a reason.
  - Numbers are called starting points.
test:
  - Use your real target. Check the sum by hand.
  - Run it twice. The sums should be the same.
  - Follow the rule on your next test and see if it stops you cutting early.
improve:
  - Add your real cost per sale and margins to the prompt.
  - Change 3 times to 5 times if you prefer a flat yes or no.
  - Add your platform's own learning advice.
  - Pair it with the Two-version ad test planner.
works_best_with:
  tools:
    - name: Any good chat AI
      why: A short prompt works the same in Claude, ChatGPT or Gemini, so use the one you already have open.
    - name: A calculator
      why: Use it to check the sum before you spend.
  inputs:
    - Your break-even cost per sale
    - Your last month of ad spend and sales
    - Your average order value
terms:
  - term: Cost per sale
    meaning: What you spend on ads for each sale.
  - term: Spend limit
    meaning: The most you let an ad spend before you judge it.
