new_slug: adviser-fee-tier-checker
name: Adviser fee tier checker
headline: Adviser fee tier checker
summary: Work out a two-tier success fee, take off the retainer you already paid and see what is left to invoice. Each number ties back to your signed letter.
job: money-and-investing
thinking: high
thinking_why: "Each rate must apply to its own slice and the credit may only use paid retainers, so every step needs checking against the letter."
subhead: Give it your signed engagement letter and the deal value. It splits the value at the breakpoint, applies each rate to its own slice, checks the minimum fee and credits the retainer. You get the gross fee, the credit and the amount left to invoice.
explain: |-
  Many fee letters charge one rate on the first slice of a deal and a lower rate only on the slice above it. A common slip is to apply one rate to the whole value. This adviser fee checker applies each rate to its own slice only.

  Before it uses any rate, it settles what counts as deal value under your letter, such as debt taken on, later payments and rolled-over shares. It then compares the fee with the minimum fee and takes off only the retainer the letter lets you credit, once. If the credit is larger than the fee, it flags that and does not go below zero.

  It shows the sums so a reviewer can trace each number to the letter. It does not say whether a fee is owed. It is arithmetic, not legal or financial advice. Have your lawyer or adviser read the letter before you pay.
when:
  - Your adviser sends a success fee invoice and you want to check it against the signed letter.
  - The letter has two rates that switch at a breakpoint and you are not sure how they apply.
  - You paid a retainer and need to know how much of it comes off the final fee.
  - A reviewer asks you to show how the fee was worked out.
you_give:
  - The signed engagement letter, including the page that defines deal value
  - The breakpoint, the two rates and the minimum success fee
  - The deal value, and what counts in it (debt taken on, later payments, rolled-over shares)
  - The retainer you paid and how much of it the letter lets you credit
  - The reporting date and currency
you_get:
  - The gross success fee, split by tier
  - The retainer credit applied and the amount left to invoice
  - An editable workbook with your inputs, the sums and test cases
  - A list of missing inputs and the checks that did not run
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it in.
  - Attach the signed letter and give the deal value, the currency and the date.
  - Ask for the workbook. If your AI cannot make files, ask for the sums as a table.
  - Check that each rate was applied to its own slice and not to the whole value.
  - Read MISSING and CHECKS MISSED before you pay or send an invoice.
  - The bundled check script needs Node.js 20 or later. Without it, the AI does the sums in the chat.
how_it_works:
  - title: Settles the deal value
    text: Decides what counts as deal value under your letter, such as debt taken on, later payments and rolled-over shares, before any rate is used.
  - title: Splits at the breakpoint
    text: Applies the first rate up to the breakpoint and the second rate only to the slice above it. Then it compares the result with the minimum fee.
  - title: Credits the retainer
    text: Takes off only the retainer the letter lets you credit, once. The invoice never goes below zero, and a credit larger than the fee is flagged.
  - title: Shows the sums
    text: Every number is traced to a clause in the letter, so a reviewer can check it by hand.
output_shape: |-
  Gross success fee, retainer credit and remaining fee invoice.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Valuation date"
    how: "Use the date the signed letter sets for measuring deal value. Use one currency and one scale (for example USD millions) on every line."
  - what: "Deal value"
    how: "Change the deal value and have your AI recalculate. Keep the actual figures you supplied."
  - what: Rate rule
    how: Say in plain words how your letter applies the rates. The checker applies the second rate only to the slice above the breakpoint, and will flag a letter that reads as one rate on all of the value.
judge:
  - Marginal tiers are not an all-value cliff rate.
  - Retainer is credited only once and only when permitted by the engagement.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one adviser success fee you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define deal value into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
not_for:
  - "You want to check an adviser's fee as part of seller closing proceeds: use the Seller adviser fee and proceeds checker."
  - "You need a private fund's management fee or fee credits worked out: use Fund fee and credit reviewer."
  - "Your letter has a tail period, expense refunds or tax on the fee. This checker leaves those out."
  - "You are checking a private fund's management fee offsets, not an adviser's success fee: use the Fund management fee offset checker instead."
output_sample:
  input:
    - Your signed engagement letter
    - The deal value and what counts in it
    - The breakpoint, the two rates and the minimum fee
    - The retainer paid and the part you may credit
  prerequisites:
    - An AI that can read files (to read your letter and make the workbook)
  output:
    - name: Fee calculation
      contains: Gross fee by tier, the minimum fee test, the retainer credit and the amount left to invoice.
    - name: Workbook
      contains: An editable file with your inputs, the formulas and test cases you can change and recalculate.
    - name: Source index
      contains: Where each input came from, with its date, currency and period.
    - name: Reconciliations
      contains: Checks that the outputs tie back to the inputs and the letter.
    - name: MISSING lines
      contains: Each input you did not supply, left open and never replaced with zero.
    - name: CHECKS MISSED
      contains: The checks that could not run, or the word none.
