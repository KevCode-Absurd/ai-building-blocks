new_slug: agent-database-migration-planner
name: Agent database migration planner
summary: Plan a database migration that keeps your existing agent data. You get a schema map, staging checks, release order and rollback limits.
job: build-software
headline: Agent database migration planner
subhead: Plan a database change that preserves existing agent data. Get a schema map, staging checks, release order and recovery steps.
explain: |-
  Changing a database that already holds your agent data is where data gets lost. A quick reset fixes the schema and wipes the rows.

  This skill plans the change so the data stays. It maps your current tables to the ones your agents need, orders the steps so old and new code both keep working, and plans a rehearsal on a test copy. It also says plainly what a rollback cannot bring back. It plans only. A developer runs it on your servers.
when:
  - Your agents already store data, and you need to change the tables without losing it.
  - Your agent tables do not match your project's tables, and you need a map from one to the other.
  - You want a rehearsal and a recovery plan before anyone touches live data.
not_for:
  - "You only add one column to a table with no data you need to keep: use your normal migration tool."
  - "You want to wipe and rebuild a live database: this plan refuses a reset, so use a script made for a throwaway test copy."
  - "You need the migration run for you: this makes a plan and files, so ask a developer to run them on your servers."
you_give:
  - Your code, as a repo path or a zipped copy
  - Your schema file or a database dump, with the names of the agent tables in use
  - The exact change you want, and what you allow (plan only, or also write files)
  - Backup and restore details, if you have them (optional)
you_get:
  - A current-state summary of your tables, constraints, data size and backups
  - A source-to-target mapping of agent records to your tables
  - Ordered migration steps, with backfill and access rules
  - Staging checks and a rehearsal plan on a test copy
  - Release order and rollback limits
  - A list of what is missing and what was not run
how_to_use:
  - Open the skill in your AI, or copy it and paste it into a new chat.
  - Give it your code, your schema or dump, the table names, and the exact change you want.
  - Read the mapping and the ordered steps. Check them against your own tables.
  - Next, a developer runs the staging rehearsal on a test copy and brings the results back to your AI, which confirms the rollback plan.
  - Release to live data only after the rehearsal and the restore both pass.
output_sample:
  input:
    - Your code and database schemas for the project
    - The exact change you want made
    - The actions you allow, such as writing files or only planning
    - Backup and restore details (optional)
  prerequisites:
    - A test copy of your database, kept apart from live data, to rehearse the change
  output:
    - name: Current state summary
      contains: What the tables, constraints, data size and backups look like now, and which jobs read them.
    - name: Source-to-target mapping
      contains: Each agent record type matched to your project, with missing columns, renamed fields and meaning changes listed apart.
    - name: Ordered migration plan
      contains: Forward steps that add or change data in sequence, with backfill and access rules, and no table reset.
    - name: Staging checks
      contains: Queries and steps to test the change and the restore on a test copy, including row counts and old clients.
    - name: Release order and rollback limits
      contains: The order to ship, any locking or downtime, what to watch, and what a rollback cannot bring back.
    - name: Run evidence and open questions
      contains: What was run and what was not, plus assumptions and missing inputs.
how_it_works:
  - title: Inspect the current state
    text: Reads schema history, live tables, constraints, data size, ownership and every job that reads them. It checks backup and restore evidence first.
  - title: Map source to target
    text: Matches agent records to your project. Missing columns, renamed fields and changed meanings are listed apart.
  - title: Order the migration
    text: Writes forward steps that add or change data in sequence, with backfill and access rules. Any destructive change is a separate reviewed proposal.
  - title: Rehearse on a test copy
    text: Tests the change and the restore on isolated data. It checks row counts, values, indexes, ownership and old clients.
  - title: Plan the release and rollback
    text: Gives the release order, any locking or downtime, what to watch, and what a rollback cannot restore.
  - title: Report the evidence
    text: Lists what was run, what was not run, assumptions and open questions.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
