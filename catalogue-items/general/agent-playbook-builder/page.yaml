how_it_works:
  - title: Step 1
    text: Collect scoped findings in a defined time window.
  - title: Step 2
    text: Match the required independent signals.
  - title: Step 3
    text: Deduplicate incidents and enforce a cooldown.
  - title: Step 4
    text: Build child tasks and approval proposals.
  - title: Step 5
    text: Dry-run against known examples.
  - title: Step 6
    text: Keep the workflow recommendation-only until an owner authorizes execution.
