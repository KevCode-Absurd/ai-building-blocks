name: "AI image and video fix rule writer"
new_slug: ai-image-fix-rules
summary: "Paste feedback on AI work. Get each fix as a reusable rule with a prompt line and a check line."
job: check-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "AI image and video fix rule writer"
subhead: Paste the feedback on a finished image or clip, and attach the piece. It sorts each point into a lasting rule or a one-off and finds where the mistake slipped in. You get a prompt line and a check line per rule, and the lines your piece fails.

explain: |
  AI images and clips repeat the same mistakes: a pack torn open at the wrong edge, a hand floating in the air, a lid that vanishes between clips. If nobody writes the fix down, you pay for it again on the next job.

  This skill keeps two lists. The any-product list comes with ten rules, such as hands described in full and no generated children. Your product list holds rules about your product only, like where your pack tears. For each piece of feedback it keeps the person's words, decides whether it's a lasting rule or a one-off taste, and finds where the mistake slipped in: the prompt never asked, no photo showed it, or the tool ignored a clear instruction. Each rule gets two lines, one to paste into the next prompt and one to check the result against. Repeats are counted, and rules that are now fixed in your brand file are retired, so the list stays short enough to read in a minute.

when:
  - Someone has just corrected an AI image or clip and you want the fix to stick.
  - You're about to brief, prompt or check AI ad work and want the known mistakes in front of you.
  - The same kind of mistake keeps coming back across jobs.

you_give:
  - The feedback on a finished piece, in the person's exact words (optional)
  - The finished image, or screenshots of the clip, attached so it can see the mistake (optional; your AI can see pictures)
  - Your product rules list, if you have one (optional)
  - What you're making next, whether copy, images or video (optional)
you_get:
  - Each piece of feedback sorted into a lasting rule or a one-off, with where it slipped in
  - New or updated rules, each with a prompt line, a check line, a reason and a count
  - The prompt lines for your next job, ready to paste
  - A short list of rules to retire, once they're fixed in your brand file
  - Any of its four checks the rules still miss, and each check line a finished piece fails

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the feedback exactly as it was given, even if it's blunt, and attach the image or screenshots of the clip.
  - Paste your product rules if you have them, and say what you're making next.
  - Paste the prompt lines into your next brief or image prompt, and check the results against the check lines.
  - Run it again every time someone corrects a finished piece.

how_it_works:
  - title: Sorts each comment
    text: Keeps the person's words, then decides if it's a lasting rule or a one-off taste for this piece.
  - title: Finds where it slipped in
    text: The prompt never asked, no photo showed it, or the tool ignored a clear instruction. Each one has a different fix.
  - title: Picks the list
    text: A rule that holds for a candle, a backpack and a face cream goes on the any-product list. Anything about your product goes on yours, and into offers.md.
  - title: Writes two lines
    text: A prompt line that asks for the right thing, and a check line that says what fails, with a reason and the work it covers.
  - title: Counts and retires
    text: Repeats add to a count instead of a new rule. Rules now fixed in your brand file, with no failures in five jobs, are retired.
  - title: Hands over the rules
    text: Before each job, gives the prompt lines for that kind of work, then checks the finished piece against the check lines.

output_shape: |
  FEEDBACK SORTED
  <n> "<the person's words>"
      <lasting rule or one-off> . Slipped in: <not asked | not shown |
      ignored> . <any-product or product list> . <new, or count +1>

  NEW PRODUCT RULE (or UPDATED ANY-PRODUCT RULE)
  <rule name> (<copy, images, video>)
  Prompt: <what to ask for>
  Check: <what fails>
  Why: <what went wrong, in one sentence>
  Seen: <count>

  PROMPT LINES FOR THE NEXT <job>
  - <each rule that applies, ready to paste>
  - MISSING: <any product fact the rules need>

  RETIRE
  <rules now fixed in the brand file, with no failures in five jobs>

  CHECKS MISSED
  Rules: <one line each, or none>
  Finished piece (if given): <each check line it fails, or none>

example:
  business: sprout
  input: |
    [the skill]

    Feedback on yesterday's three kitchen images, from the brand
    lead:
    "Two of them have the daily pack torn down the side. We tear
    across the top. Always.
    In the palm one the gummies are coming out of the bottom
    corner.
    And they look like little jelly cubes. They're bears.
    Also could the counter be lighter?"

    Prompts used: "a Sprout daily pack being opened, gummies pouring
    into a palm, bright kitchen". Photo sent: pouch-front.jpg only.

    Our product list: empty so far.
    offers.md says: the daily pack is torn straight across its top
    edge, never the side, bottom or a corner. Gummies pour out of the
    torn top. Gummies are small opaque deep-green bears, soft matte,
    about thumbnail height.
    Next job: a new set of kitchen images.
  output: |
    FEEDBACK SORTED
    1 "torn down the side. We tear across the top"
      Lasting rule. Slipped in: not asked (the prompt said "being
      opened"). Any-product rule "The whole action, in words": count
      +1. The exact edge is about one product, so it's also a new
      product rule.
    2 "coming out of the bottom corner"
      Lasting rule. Slipped in: not asked. Same rules: count +1.
    3 "they look like little jelly cubes. They're bears"
      Lasting rule. Slipped in: not shown (no photo of the gummies)
      and not asked. Product list.
    4 "could the counter be lighter?"
      One-off taste for this set. Not a rule. Change it in the next
      prompts only.

    NEW PRODUCT RULE
    Sprout daily pack, how it opens (images, video)
    Prompt: tear the daily pack straight across its top edge; gummies
    fall from the torn top into a palm or bowl.
    Check: a side, bottom or corner tear, or gummies coming out
    anywhere else, fails.
    Why: two of three images showed a side tear, one a corner pour.
    Seen: 1

    NEW PRODUCT RULE
    Sprout gummies (images, video)
    Prompt: small opaque deep-green gummy bears, soft matte, about
    thumbnail height.
    Check: cubes, clear jelly or glossy sweets fail.
    Why: the gummies came back as jelly cubes.
    Seen: 1
    Fix at the source: offers.md already says both things. Add them
    to the fixed product description used in every prompt, and send
    a photo of the gummies.

    PROMPT LINES FOR THE NEXT KITCHEN SET (images)
    - "Small flat daily pack torn straight across its top edge; small
      opaque deep-green gummy bears, soft matte." Same words in every
      prompt.
    - Left hand holds the pack, torn top tipped down; gummies fall
      from the top into the open right palm.
    - Thumb and fingers placed; no hand over the pack's printing.
    - Gummies land and rest in the palm; pack, gummies and hand agree
      in size (gummies about thumbnail height).
    - The same pack and bears in every image of the set.
    - If the big pouch is in shot, it stays closed at its resealable
      top.
    - No generated children. No generated person shown as a customer
      or as the founder.
    - This set only: a lighter counter.
    - MISSING: a photo of the gummies out of the pack.

    RETIRE
    None yet.

tweaks:
  - what: What you're making next
    how: Say "video" and it adds the video-only rules (everything in view from the start, no finger counting, one state per object). Say "copy" and it keeps only the rules that apply to words.
  - what: Your product list
    how: Paste your existing product rules and it counts repeats against them instead of starting new ones.
  - what: The prompt and photos you used
    how: Paste them with the feedback. Then it can tell "not asked" from "ignored", which changes the fix.
  - what: One-off or rule
    how: If you know a comment is a lasting rule ("always the top edge"), say so. Otherwise one person's taste on one image stays a one-off.

judge:
  - Every rule can be checked by looking at a finished image or clip. "Make hands better" isn't a rule.
  - Every rule has a prompt line, a check line, a reason and the kind of work it covers.
  - Each comment names where the mistake slipped in, and the fix matches it.
  - Nothing about your specific product ended up on the any-product list.
  - Repeats were counted, not written twice.

test:
  - Paste feedback where you already know the answer, with one real rule and one taste comment in it. It should keep the rule and leave the taste as a one-off.
  - Paste the same correction twice, a week apart. The second run should add one to the count, not write a new rule.
  - Paste a failure where your prompt was clear and the tool still got it wrong. It should say "ignored" and suggest a different approach, not just add more words.
  - Paste its prompt lines into your next image prompt and compare the results with your last batch. The corrected mistakes should not come back.

improve:
  - Add your product list to the bottom of the skill file, under the any-product list, so every run starts with your rules in place.
  - Copy each product rule's prompt line into offers.md in the same words, so prompts and rules never disagree.
  - If you only make images, delete the video-only rules to keep the prompt lines short.
  - Review the retire list once a month. Rules fixed at the source make room for new ones.
  - Pair it with the skill that plans and checks AI images and clips. Its failure notes are the feedback this skill turns into rules.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all sort feedback well. Keeping the list in one saved file matters more than the tool."}
  inputs:
    - "The exact prompt and photos used for the piece, so it can tell a missing instruction from an ignored one"
    - "The failed image itself, so the rule describes what went wrong, not just what someone said"
    - "Your current product rules list, so repeats are counted and not written twice"

terms:
  - term: Any-product list
    meaning: Rules true for any product, such as hands described in full and no generated children.
  - term: Product list
    meaning: Rules about your product only, such as how your pack opens or what colour the lid is.
  - term: Prompt line and check line
    meaning: The words to put in the next prompt, and the thing to look for in the result to know it worked.
  - term: One-off taste
    meaning: A preference about one image that shouldn't become a standing rule.
