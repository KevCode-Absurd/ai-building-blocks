name: "AI workflow handoff planner"
new_slug: ai-workflow-handoff-planner
summary: "Plan an AI workflow handoff step by step. List your steps and get claim cards, handoff cards and run rules that keep every claim whole."
job: set-up-ai
thinking: high
thinking_why: "It runs several stages and keeps many rules at once across a long output."

headline: "AI workflow handoff planner"
subhead: Give it the steps of your AI process, in order, and the claims it uses. It locks each claim as a card that travels word for word and writes a handoff card for every step. You get the cards, run rules and any check it missed.

explain: |
  When you chain AI steps together (brand, buyer, brief, copy, image, check), each step gets a bundle of text to work from. Send too much and it gets confused. Send too little, or trim carelessly, and things break quietly. "21 vitamins per pack" becomes "21 vitamins per gummy", a guarantee loses "first order only".

  This skill starts by turning every claim into a card with its full wording and limits, which moves between steps word for word and is never rewritten. Then it writes a short handoff card for each step: what it needs, what it may use, what it returns and what it must never lose. Steps that can open files get a reference; steps that can't get the text itself. Stable material goes first so it can be reused, trimming follows a fixed order, and the run rules make sure a failed or partial result is never reported as a success.

when:
  - You're building a chain of AI steps for ads or content and want each step to get the right material.
  - Your process works but is slow or costly, and you want to trim it without breaking anything.
  - Outputs sometimes drop a condition, such as "first order only", and you need to find where it gets lost.
not_for:
  - "You have one prompt or a one-off piece of copy: write a plain brief and skip the planning."
  - "You want to write the ads themselves: use the Story image ad writer once your chain is planned."
  - "You want to know if a new prompt writes better ads: use the Ad reach planner to plan the test."

you_give:
  - The steps in order and what each one should produce
  - What each step is sent today, with any measured token or cost numbers (optional)
  - Fixed settings, such as the chosen model or budget, which it will keep (optional)
you_get:
  - Claim cards, each with its full wording, limits and source
  - A handoff card for each step (needs, may use, returns, never lose)
  - A bundle order (stable part first, then the part that changes) and run rules
  - A list of shortfalls and trade-offs
  - Any of its own checks the plan still misses, each named

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - List your steps in order, one line each, with what each one should hand on.
  - Attach proof-and-claims.md from your brand file, or paste the claims your ads use.
  - If you know what each step is sent now, paste it or describe it, with any measured costs (optional).
  - Check that steps able to open files are named. Steps that can't open files get the text pasted in instead.
  - Build the cards and run rules into your tool, then compare real usage with the estimates.
output_sample:
  input:
    - Your AI steps in order, one line each, with what each should hand on
    - Your proof-and-claims.md or the claims your ads use
    - What each step is sent today, with any measured costs (optional)
    - Fixed settings such as model or budget (optional)
  prerequisites:
    - A tool that can open files, such as Claude Code or a project with uploads, if you want steps to fetch files by reference. Without one, the plan pastes the text in.
  output:
    - name: Claim cards
      contains: Each claim with an ID, its full wording, its limits and its source, ready to pass on word for word.
    - name: Handoff cards
      contains: One per step, listing what it needs, may use, returns and must never lose.
    - name: Bundle order
      contains: The stable material first, then the parts that change each run, so the start can be reused.
    - name: Run rules
      contains: What to save per step, retry caps, budget and where to resume.
    - name: Shortfalls and trade-offs
      contains: Where the plan falls short, with MISSING lines for unknown outputs, budgets or settings.
    - name: Checks missed
      contains: One line for each of its own checks the plan still fails, or none.

how_it_works:
  - title: Locks the claims
    text: Turns each claim into a card with an ID, the full wording and its limits. Steps pick cards; they never rewrite them.
  - title: Labels the rest
    text: Marks every other fact as a checked fact, customer words, a guess or a creative choice.
  - title: Pastes or points
    text: Steps that can open files get a reference to fetch when needed. Steps that can't get the text itself.
  - title: Writes handoff cards
    text: For each step, what it needs, what it may use, what it returns in a fixed shape, and what it must never lose.
  - title: Gives each role its share
    text: Writers get buyer words and voice, designers the look and photos, checkers the real output and brief, fixers only the failed part.
  - title: Orders, trims and runs
    text: Stable material first so it can be cached, trimming in a fixed order, saving every step, capped retries, and nothing failed reported as a success.
  - title: Checks the plan
    text: Goes through its own checks, fixes what it can, and names any check it still missed.

output_shape: |
  CLAIM CARDS
  <ID>  "<full wording>"  Limits: <amount, serving, time, who,
        conditions>  Source: <...>

  HANDOFF CARDS
  Step <n> <name>
    Needs:       <...>
    May use:     <...>
    Returns:     <fixed shape, plus card IDs used>
    Never lose:  <cards, identity rules, exact words, photo roles>

  BUNDLE ORDER
  Stable first: <rules, claim cards, product facts, voice>
  Changes each run: <buyer, brief, draft, ...>

  RUN RULES
  Save per step: <fingerprint, version, settings, request, raw reply,
  result, usage, cost, retries>
  Retries: <named failure -> cap>   Budget: <...>   Resume from: <...>

  SHORTFALLS AND TRADE-OFFS
  <...>
  MISSING: <unknown step output | budget | fixed setting>

  CHECKS MISSED
  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Our steps:
    1. Brand reading: from the site, product page and reviews
    2. Buyer: one buyer with their doubts and words
    3. Brief: one ad idea
    4. Copy: the ad text
    5. Image prompt
    6. Image made by the image tool
    7. Check: the image and copy against the brief
    8. Fix: repair what failed

    Today every step gets the whole brand file plus all 20 reviews.
    Usage: not measured. Fixed: none. Steps 1 and 7 run in a tool
    that can open files; the rest can't.

    Facts the steps rely on: "60+ ingredients, 21 vitamins &
    minerals, and 6g fiber" in 1 pack. "Clinically tested for
    nutrient absorption" (2025 study, 120 healthy adults, vitamin C
    +40.1%, folate +20.5%). Survey: "95% of users take [Sprout] at
    least 4-6x per week", always "of surveyed users". $29.99 first
    order only with the text sign-up, renews at $49.99 every 4 weeks.
    30-day money-back, first order only. Reviews 11 and 14 mention
    GLP-1: customer words only, never the brand's claim.
  output: |
    CLAIM CARDS
    C1 "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
       Limits: per pack, never per gummy. Source: product page
    C2 "Clinically tested for nutrient absorption"
       Limits: 2025 study, 120 healthy adults, vitamin C and folate
       only. Source: brand study
    C3 "95% of users take Sprout at least 4-6x per week"
       Limits: always "of surveyed users". Source: brand survey
    C4 "$29.99 first order"
       Limits: only with the text sign-up; renews at $49.99 every 4
       weeks. Source: product page footer
    C5 "30-day money-back guarantee"
       Limits: first order only. Source: FAQ
    Not a card: GLP-1 (reviews 11 and 14). Customer words only.

    HANDOFF CARDS (steps 3 to 8)
    3 Brief
      Needs:      product facts, the one buyer, how much they know,
                  format, the cards available
      Returns:    argument, evidence (card IDs), hook, scene, format
      Never lose: C1 to C5 as written
    4 Copy
      Needs:      the brief, the chosen cards, buyer quotes and doubt,
                  voice rules with 3 or 4 real lines, length limits
      May use:    the closest proof card
      Returns:    the copy, each claim tagged with its card ID
      Never lose: "per pack"; "of surveyed users"; the renewal price;
                  "first order only"
    5 Image prompt
      Needs:      final scene, exact words and placement, pouch and
                  pack photos with roles, how the pack opens (top
                  edge only), colours and type, shape, what never
                  appears
      Returns:    one prompt keeping every locked word and photo role
    6 Image
      Needs:      the approved prompt and photos with their roles
      Returns:    real pixels, run ID, status
    7 Check (can open files)
      Needs:      the actual image and copy, the original brief, the
                  cards (by reference), the photos
      Returns:    issues tied to evidence; only what is visible
    8 Fix
      Needs:      only the failed part, the named fault, what depends
                  on it
      Returns:    the smallest fix, then a new check

    BUNDLE ORDER
    Stable first: claims rules, cards C1 to C5, product facts, voice,
    look
    Changes each run: buyer, brief, draft, the failed part

    RUN RULES
    Save per step: input fingerprint, skill version, settings, exact
    request, raw reply, checked result, usage, cost, retries.
    Retries: misspelt words in the image -> 2 tries, then change the
    approach. Resume from the last checked result. A failed image
    stays failed.

    SHORTFALLS
    Today all 20 reviews go to every step. Copy needs only the buyer's
    quotes; image and fix steps need none.
    MISSING: a budget, and measured usage, before any token target.

tweaks:
  - what: The steps
    how: Add or remove steps (a storyboard, a presenter, a report) and each gets its own handoff card and never-lose list.
  - what: A budget
    how: Give a token or cost limit. It trims in the fixed order and tells you plainly if a step still won't fit, rather than cutting a claim.
  - what: Which steps can open files
    how: Say which steps run in a tool that can read files. Those get references; the rest get the text pasted in.
  - what: Measured usage
    how: Paste real usage from your tool. It's reported apart from estimates, so you can see which step costs most.

judge:
  - Every claim travels as a whole card, with its amount, conditions and who it applies to.
  - The checking step gets the actual output and the original brief, not a summary.
  - The fixing step gets only the failed part and what depends on it.
  - Counts, budgets and sums are left to code, not to the AI.
  - Nothing failed or partial is marked as a success, and no stock or made-up output fills a gap.

test:
  - "Take one card with a condition (for Sprout: \"30-day money-back guarantee, first order only\") and follow it through every step. The condition should still be there at the end."
  - Run your chain once with the plan and open what the checking step received. It should be the real output and the original brief, not a summary.
  - Make one step fail on purpose. The run should stop and say why, and nothing should be reported as a success.
  - Measure real usage per step for one run and compare it with the plan's estimates.

improve:
  - Keep your claim cards in proof-and-claims.md, so every chain starts from the same wording.
  - Write your own steps and their handoff cards into the skill file, so every plan starts from your real chain.
  - Change the trim order in step 7 if your costs differ, but keep claim cards as the one thing that never goes.
  - Add the model and settings you can't change, so the plan works around them.
  - Pair it with the skill that tests whether a new prompt writes better ads, to check a slimmer bundle before it goes live.

works_best_with:
  tools:
    - {name: "Claude Code", why: "Can run the chain as files and code, save every step's request and reply, and do the counts in code."}
    - {name: "Claude", why: "Follows long handoff cards closely and returns work in the fixed shape you ask for."}
  inputs:
    - "Your proof-and-claims.md, so the claim cards start from approved wording"
    - "Real usage per step from one run, so trimming targets the step that costs most"
    - "One past output where a condition got lost, so the plan can show where it slipped"

terms:
  - term: Step
    meaning: One AI task in a chain, such as writing the brief or checking the image.
  - term: Bundle
    meaning: All the text and files one step is sent to do its job.
  - term: Claim card
    meaning: One claim with its full wording, limits and source, passed between steps word for word.
  - term: Token
    meaning: The unit AI tools count text in. About four characters of English, as a rough estimate.
  - term: Cache
    meaning: Reusing the unchanged start of a bundle between runs, which saves time and cost.
