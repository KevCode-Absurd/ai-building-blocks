new_slug: anger-pause-and-repair-planner
name: "Anger pause and repair planner"
summary: "Plan a pause and a calm first message after a fight or hurt at work or home. Sort facts from feelings and guesses before you reply."
job: lead-people
thinking: medium
thinking_why: "It must catch blame and unsupported claims hiding in your account."

headline: "Anger pause and repair planner"
subhead: "Describe a fight or hurt at work or home. It sets a pause, splits facts from feelings from guesses, checks who told you and drafts a calm first message that asks for help without blame."

explain: |
  A hurt makes a fast reply feel right. But the first message is often built on a guess about the other person's motive or on a report you got second-hand, and it starts a bigger fight.

  This skill adds a pause before anything is sent. It splits what happened from how it felt and what you are guessing. It checks whether the report reached you first-hand and whether your view of the person could be wrong. It asks if the anger comes from care or from irritation, then drafts a short message that says you are hurt, asks one open question and leaves out claims you cannot back up. It gives no mental health advice.

when:
  - "A colleague or client said something that stung and you want to reply."
  - "You heard something about yourself second-hand."
  - "A fight at home needs a calm first message."
not_for:
  - "You face abuse, threats or harassment: go to HR, your manager or a qualified adviser, not a message plan."
  - "You feel unsafe or in crisis: contact a qualified person or your local emergency line."
  - "You face a legal dispute: talk to a lawyer or other qualified adviser before you write back."

you_give:
  - "What was said or done, by whom, when"
  - "Your draft reply (optional)"
  - "Who told you, if you were told (optional)"
you_get:
  - "A pause plan with a wait time"
  - "Facts, feelings and guesses in three lists"
  - "A calm first message with one open question"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Describe what happened in a few lines. Do not send anything yet."
  - "Paste your angry draft if you have one."
  - "Read the three lists and move anything misplaced."
  - "Wait the time it says, then read the message again before sending."
output_sample:
  input:
    - What was said or done, by whom and when
    - Your angry draft reply (optional)
    - Who told you, if you were told (optional)
  output:
    - name: PAUSE
      contains: A three-breath pause, a wait time before replying, and a short line to send if you must answer sooner.
    - name: FACTS, FEELINGS and GUESSES
      contains: "Three separate lists: what a record would show, how it felt, and what you assume about the other person."
    - name: SOURCE
      contains: Whether you saw it yourself or were told, by whom, and what to check before acting.
    - name: WHAT I MAY NOT KNOW
      contains: What you may not know about the other person, and one other reading of the same facts.
    - name: WHERE THE ANGER COMES FROM
      contains: One sentence on whether your anger comes from care or from irritation.
    - name: CALM MESSAGE
      contains: Five or six sentences that say you are hurt, ask for help and end with one open question.
    - name: MISSING
      contains: Gaps in what you gave, marked so nothing is invented.
    - name: CHECKS MISSED
      contains: One line for each of its own checks that still failed, or none.

how_it_works:
  - title: "Stop before you send or say"
    text: "Stops and sets a pause before anything is sent or said."
  - title: "Separate facts from feelings"
    text: "Writes the facts of what was said or done apart from how it felt."
  - title: "Check the source"
    text: "Asks whether the source is first-hand or told in secret."
  - title: "Test your view of the other person"
    text: "Asks whether your view of them is right and what you may not know."
  - title: "Ask where the anger comes from"
    text: "Asks whether the anger comes from care or from irritation."
  - title: "Picture what might be hurting them"
    text: "Pictures the other person as a child and names what might be hurting them."
  - title: "Draft a calm opening"
    text: "Drafts a calm opening that says you are hurt and need help."
  - title: "Checks its own work"
    text: "Goes through its checks one by one, fixes what it can and names any it still missed."

output_shape: |
  PAUSE
  <breaths, wait time, line to send if you must answer>

  FACTS
  <what a record would show>
  FEELINGS
  <how it felt>
  GUESSES
  <what you assume about them>

  SOURCE
  <first-hand or told, by whom, what to check>

  WHAT I MAY NOT KNOW
  <list, one other reading>

  WHERE THE ANGER COMES FROM
  <care or irritation>

  CALM MESSAGE
  <5 or 6 sentences, one open question>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "Your draft"
    how: "Pasting the angry version shows where blame and guesses hide."
  - what: "Who it is"
    how: "Say if it is a boss, a client or a partner. The message tone changes."
  - what: "How long you can wait"
    how: "Give a real deadline. The pause plan fits it."
  - what: "What you want after"
    how: "Name it. The open question points there."

judge:
  - "The message names how you feel without blame."
  - "Nothing in it is a guess stated as a fact."
  - "It asks one open question."
  - "The three lists hold different things."
  - "It gives no health advice."

test:
  - "Read the message as the other person and note the line that would sting."
  - "Check each fact against messages or records."
  - "Wait a day and see if you would still send it."

improve:
  - "Add your own wording for the pause step."
  - "Add a list of phrases you want to avoid."
  - "Keep the facts list as a log if it is a repeat problem."
  - "Pair it with \"Listen-first talk planner\" once you are calm."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Planning and rewording are text work any strong chat AI does well with this skill."}
  inputs:
    - "The original message or email"
    - "Any record of what happened"
    - "A deadline for replying"

terms:
  - term: "First-hand"
    meaning: "Something you saw or heard yourself, not something you were told."
