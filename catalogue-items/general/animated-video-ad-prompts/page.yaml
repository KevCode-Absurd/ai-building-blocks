new_slug: animated-video-ad-prompts
name: "Animated film video clip prompt writer"
summary: "Turn your animated-movie ad script into clip prompts for AI video tools. Get a character card, sheets, a storyboard and an edit list."
job: make-video-ads
thinking: high
thinking_why: "It runs several stages and keeps many rules at once across a long output."

headline: "Animated film video clip prompt writer"
subhead: Give it an animated-movie ad script and product photos. It casts the character, plans the light for each story part, builds sheets and a storyboard, and writes the clips, stopping three times for your OK. You get every prompt and an edit list, with any check still missed.

explain: |
  The 3D animated-film look is easy to start and hard to hold. Over a few clips the faces turn toy-like, a character changes between shots, the light jumps around inside one moment, and the label on your pack turns to gibberish.

  This skill runs the whole process in six stages. It reads the script and gives each part of the story its own light. It writes an avatar card for the character and waits for your OK. It makes reference images, then a sheet with the character from every angle, a product sheet from your photos and a sheet for each room, plus lock lines pasted into every prompt. You approve those, then a storyboard with one frame per shot. Only then does it write clips that describe just the motion, the voice and the edit.

when:
  - You have a script written for the animated-feature look and want to make it with AI tools.
  - Your animated clips keep drifting into a cartoon or changing the character.
  - Your product's label keeps coming out wrong in generated shots.
not_for:
  - "You want a live-action ad or a non-animated look: write a plain brief for your video tool or a film crew, as this skill only builds the 3D animated-feature style."
  - "You have no script yet: write one first with the Animated film video ad script writer, or paste your own script in plain words."
  - "You want finished video made for you: this skill writes prompts only, so you need a video tool such as Veo, Kling or Higgsfield to make the clips."

you_give:
  - The approved script and its scenes, and its cast note if it has one
  - Real product photos (front, side, top) and every line of label text
  - How the product is used
  - The buyer's moment, your brand's light and approved claims (optional)
  - Your video tool's clip lengths and reference limits (optional)
you_get:
  - An avatar card and 3 or 4 reference image prompts to pick from
  - A light plan, sheet prompts for the character, product and rooms, and lock lines
  - A storyboard with one frame and one shot card per shot
  - Clip prompts and an edit list with cuts, captions, music and the end card
  - One line for each of its checks the prompts still miss

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the approved script, ideally from "Animated film video ad script writer", and attach your product photos with every label line typed out.
  - Approve or change the avatar card, then make the reference images and say which one you picked.
  - Make and approve the sheets and lock lines, then make and approve the storyboard frames.
  - Make each clip from its approved frame. If a take misses, rerun it once before you change any words.
output_sample:
  input:
    - Your approved animated ad script and its scenes
    - "Real product photos: front, side and top"
    - Every line of text on your product label
    - How the product is used (optional)
    - Your brand file and your video tool's clip limits (optional)
  prerequisites:
    - An AI chat that can read your photos
    - A video tool to make the clips from the prompts (paid credits may apply)
  output:
    - name: Light plan and look line
      contains: One light key for each story part, and one look line that ends every prompt.
    - name: Avatar card
      contains: A fixed casting description of the character, from face and clothes to voice. You approve it first.
    - name: Reference image prompts
      contains: Three or four prompts for the character in the look, so you can pick one.
    - name: Sheets and lock lines
      contains: Character, product and room sheet prompts, plus short lines pasted word for word into every prompt.
    - name: Storyboard
      contains: One frame prompt and one shot card per shot, with a continuity check for sides, eyelines and hands.
    - name: Clip prompts
      contains: Motion-only prompts that start from each approved frame, with dialogue and how each clip cuts out.
    - name: Edit list
      contains: Clip order, captions, music, the end card, safe zones and retake notes.
    - name: Checks missed
      contains: One line for each of its own checks the prompts still miss, or none.

how_it_works:
  - title: Reads the script
    text: Splits it into story parts, gives each part one light key, and writes one look line.
  - title: Writes the avatar card
    text: A made-up adult with age, build, face, hair, clothes, one item and voice, in fixed words. It stops for your OK.
  - title: Makes reference images
    text: Three or four images of the character in the look. You pick one.
  - title: Builds the sheets
    text: The character from five angles, the product with each label line and its colour, each room empty, and lock lines. It stops for your OK.
  - title: Draws the storyboard
    text: One frame per shot in a fixed order (who, action, place, camera, light, look), with countable beats and a continuity check. It stops for your OK.
  - title: Turns it into video
    text: Each frame starts its clip, the prompt says only the motion, then voice, cuts and the edit. Misses are rerun, simplified, then changed one thing at a time.

output_shape: |
  STAGE 0  LIGHT PLAN   <part>: <source, colour, shadows> (one per part)
           LOOK         <one line, at the end of every prompt>
  STAGE 1  AVATAR CARD  <role, age, build, face, hair, clothes, item,
           voice, never change>                  > STOP for approval
  STAGE 2  REFERENCES   <3 or 4 prompts>  Picked: <n>
  STAGE 3  SHEETS       Character: <5 angles, expressions, size>
                        Product: <front, side, top, label lines>
                        Rooms: <landmarks, where light enters>
           LOCK LINES   <look, casting, product, light key>
                                                 > STOP for approval
  STAGE 4  STORYBOARD
           FRAME <n>  <subject>. <action>. <place>. <camera>. <light
                      key>. <look line>. Attach: <sheet> = <its job>
           Card: <beats, focus, line (speaker), length, sound>
           Continuity: <sides of frame, eyelines, hands, product state>
                                                 > STOP for approval
  STAGE 5  CLIP <n>   From frame <n>. <action beats>. <camera move>.
                      Dialogue: <speaker>: <line>
                      Cut out: <on the action / on a look / insert /
                      time cut>
           EDIT LIST  <order, captions, music, end card, safe zones>
  CHECKS MISSED: <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Script: the 28-second narrated script from "An ad that looks like
    an animated movie". Parts: And (hallway, lines 1 and 2), But
    (kitchen, lines 3 and 4), Therefore (front door, lines 5 to 7).
    Light keys as given in the script.
    Cast note: the mum carries it, silent, with a narrator. Casting:
    a stylised animated woman, late thirties, slim, dark curly hair
    tied up, rust jumper, canvas tote on her left shoulder.
    Photos: [pouch front] [daily pack in a hand] [gummies in a palm]
    Pouch label: big yellow wordmark "Sprout" on glossy deep green,
    yellow bear face top right, "28 Daily Packs" at the bottom.
    Daily pack label words: not captured.
    Tool: 8-second clips, 2 reference images.
  output: |
    STAGE 0  LIGHT PLAN
    And: soft grey daylight through the front-door glass, gentle
      shadows.
    But: flat overhead kitchen light, cool, busy shadows.
    Therefore: low warm sun through the open front door, long soft
      shadows.
    LOOK  stylised 3D animated feature, real-looking light on designed
      shapes, true fabric, wood and foil, shallow lens.

    STAGE 1  AVATAR CARD
    Mum: a stylised animated woman, late thirties, slim, oval face,
    dark curly hair tied up, rust jumper, canvas tote on her left
    shoulder. Silent; the narrator speaks. Never change: hair tied
    up, the rust jumper, the tote on the left.
    > STOP: approved.

    STAGE 2  REFERENCES (4 prompts; one shown)
    Mum [as the card], standing, hands at her sides, neutral face,
    plain light-grey background, soft even light. [LOOK]
    Picked: 3.

    STAGE 3  SHEETS
    Character: image 3 attached. Front, three-quarter left and right,
      side, back; a tired breath out, a small smile; holding the
      pouch, which reaches from her wrist to her elbow. [LOOK]
    Product: pouch front attached = yellow "Sprout" wordmark on deep
      green, bear face top right, "28 Daily Packs"; front, side, top.
      Daily pack: shape and size from the hand photo, front turned
      toward her palm (label words MISSING).
    Rooms: 1 Hallway: front door at frame right with a glass panel,
      a small table with a bowl by the door. 2 Kitchen: counter along
      the back wall, sink at left, wall clock above the sink.
    LOCK LINES: [LOOK] / [Mum as the card] / the Sprout pouch exactly
      as the product sheet / the part's light key.
    > STOP: approved.

    STAGE 4  STORYBOARD (2 of 7 frames)
    FRAME 3  Mum. Stands at the sink, eyes on a used shaker lying in
      it, shoulders starting to drop. Kitchen, a plain unlabelled tub
      of green powder on the counter. Medium shot, eye level, focus
      on her face and the shaker. Flat overhead kitchen light, cool,
      busy shadows. [LOOK] Attach: character sheet = face, hair and
      clothes only.
    Card: beats: shoulders drop, a breath out, two fingers nudge the
      shaker aside. Narrator line 3. 5 s. Sound: a tap drip.
    FRAME 7  Mum at the open door, the pouch in her left hand, front
      to camera. Close on hand and pouch. Low warm sun, long soft
      shadows. [LOOK] Attach: product sheet = label exactly.
    Continuity: she walks screen right in every shot; the pouch is
      always in her left hand; the daily pack is torn from frame 5 on.
    > STOP: approved.

    STAGE 5  CLIP 3 (5 s)  From frame 3. Beats: her shoulders drop,
      she breathes out, two fingers nudge the shaker aside. Camera
      holds still. Dialogue: Narrator: But the powder wants a scoop,
      a shaker and a rinse. Cut out: on the action (her hand reaches
      for her keys).
    EDIT LIST: clips in line order; narrator voice designed from "warm
      adult, quick but calm"; soft music from line 5; offer card over
      frame 7 from current terms, inside the safe zone.

    (cut for length: the full run also had the other reference
    prompts, frames 1, 2 and 4 to 6, and clips for lines 1, 2 and 4
    to 7)

tweaks:
  - what: Light keys
    how: Name your brand's light ("bright and sunny, never gloomy") and the turn's key is built from it. The snag's key stays the least kind of the three.
  - what: Clip limits
    how: Give your tool's clip lengths and reference slots. It splits long actions across clips and attaches only the sheets each shot needs.
  - what: Inside views
    how: If your brand file says how the product works, the storyboard adds a cutaway with no people, showing only the parts you name.
  - what: An animal lead
    how: Say the lead is an animal and the avatar card describes the animal, with "stylised animated" in front of it.

judge:
  - It stopped for your OK after the avatar card, the sheets and the storyboard, or marked each one "(approve)" when you asked for every stage at once.
  - Every frame in the same story part has the same light key, word for word.
  - The look line and casting card never change between prompts.
  - No shot has more than two people, and every product shot spells out each label line or says MISSING.
  - No studio, film or character names anywhere.

test:
  - Line up the light keys across all frame prompts. They should change only where the story part changes.
  - Make the character sheet and two frames from different parts. The character should match in both.
  - Check every product frame for the attached product sheet and typed label words.
  - Run one frame prompt twice before rewriting it. If both come out toy-like, simplify the shot before blaming the words.

improve:
  - Once your look line works, paste it into stage 0 of the skill file, so every ad starts from tested wording.
  - Add your label lines with their colours to "What you need".
  - Save approved avatar cards and character sheets in your brand file, so the next ad starts at stage 4.
  - Pair it with "Animated film video ad script writer" first, and a captions skill in your brand font after.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Takes up to 14 reference images and keeps up to four characters the same, so your sheets and frames match."}
    - {name: "Veo", why: "Starts each clip from your approved frame and can make sound with it, in 8-second clips."}
    - {name: "Kling", why: "Takes up to 7 reference images in one video job, so figures and product stay the same from shot to shot."}
    - {name: "Gemini", why: "Lets you fix one thing in a clip by asking, while the rest of the shot stays the same."}
  inputs:
    - "Photos of a real room like the buyer's, so the rooms look lived in"
    - "The flat label artwork, so the product reads right in every frame"
    - "A short description of each voice (age, pace, accent), so voices stay the same in every clip"

terms:
  - term: Avatar card
    meaning: A short, fixed description of who carries the ad, from their look to their voice, approved before any image is made.
  - term: Light key
    meaning: One line describing the light for a part of the story, used for every shot in that part.
  - term: Lock lines
    meaning: Short lines for the look, the character, the product and the light, pasted word for word into every prompt.
  - term: Insert
    meaning: A close-up of a detail, such as hands or the product, cut into a scene.
  - term: Cutaway
    meaning: A view that shows the inside of something, as if part of it were cut away.
