new_slug: animated-video-ad-script
name: "Animated film video ad script writer"
summary: "Write an animated film video ad script: a timed 3D-style story with one cast adult, your real product and a cast note. Paste your idea and brand file."
job: make-video-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Animated film video ad script writer"
subhead: Give it your selling idea and brand file. It writes a three-part story in the look of a 3D animated film, casts one made-up adult and brings in your real product. You get a timed script, a cast note and any check it missed.

explain: |
  The look of a 3D animated film (stylised people, real-looking light) makes an everyday problem warm and easy to watch. It goes wrong in familiar ways. The face goes blank, the light changes for no reason, or the story stops halfway so a sales speech can start.

  This skill writes the story as one line: the buyer's ordinary moment, the snag, and the product in use. Each of those three parts gets its own light, planned before any shot, so the change in light tells the story too. Feelings are written as small gestures (sees the shaker, shoulders drop, pushes it aside), because one word like "tired" gets a blank face. The product arrives in a hand at the turn, with its label exact. Nothing on screen goes past your approved claims.

when:
  - You want a story-led video ad without filming, and the problem is a moment your buyer knows.
  - You want a script your video tool can follow, with one character who never changes.
  - You need a close view of how your product works that a camera couldn't film.
not_for:
  - "You need proof that rests on a real person, or a texture, pour or fit people judge by eye: film a demo or customer-style video instead, with a person or a simple phone shoot."
  - "You already have a script and only want it to sound right aloud: use the Ad script read-aloud editor."
  - "You want to check a finished ad against Meta rules: use the Meta ad policy checker."

you_give:
  - Your selling idea or an existing script
  - Your brand file, with the buyer's moment, the product's label words and your approved claims
  - The length, and who speaks (optional)
you_get:
  - The story in one line, in three parts
  - A light and colour key for each part, and a casting card
  - A timed script table with speaker, words, picture, cut and seconds
  - Notes on what was inferred and missing, and a cast note on who carries the ad
  - Any of its own checks the script still misses, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your selling idea and your brand file underneath.
  - Say the length and who speaks, such as "30 seconds, narrator".
  - Check every spoken line against your approved claims before you make anything.
  - Take the script and cast note to "Animated film video clip prompt writer". It takes it from there, with the avatar, sheets, storyboard and clips.
output_sample:
  input:
    - Your selling idea or an existing script
    - Your brand file, with the buyer's moment, product label words and approved claims
    - Length and who speaks (optional)
  prerequisites:
    - Your brand brain from the Website brand brain builder (optional)
    - A buyer brief from the Buyer brief writer (optional)
  output:
    - name: Story line
      contains: The buyer's ordinary moment, the snag, and the product in use with the small change it makes, in one line.
    - name: Light keys
      contains: One line of light and colour for each of the three story parts, changing only between parts.
    - name: Casting card
      contains: Age, build, hair, clothes and one carried item for the one made-up adult, worded the same every time.
    - name: Script table
      contains: Each line with speaker, words, picture, how the cut joins and seconds, ending on a held product shot.
    - name: Notes
      contains: What was inferred and what is marked MISSING, so no fact is guessed.
    - name: Cast note
      contains: Who carries the ad, why that suits your buyer, the voice, and what must never change.
    - name: Checks missed
      contains: One line for each of its own checks the script still fails, or none.

how_it_works:
  - title: Checks the fit
    text: Strong for a feeling the buyer knows, good for how something works inside. It says when a filmed ad would prove more.
  - title: Writes one story line
    text: The ordinary moment, the snag, then the product in use and the small change it makes.
  - title: Plans the light
    text: One light and colour key for each of the three parts, changing only between them.
  - title: Casts one adult
    text: A made-up adult on a casting card, described in the same words every time. Never a customer or expert.
  - title: Writes feelings as gestures
    text: What they notice, what the body does, what they do next, plus one small habit.
  - title: Times the script
    text: About two words a second, one speaker at a time, the product at the turn, and every cut marked.
  - title: Writes the cast note
    text: Who carries the ad, why that suits your buyer, their voice and what must never change.

output_shape: |
  STORY     <moment> and <what they do now>, but <snag>,
            therefore <product in use, small change>.

  LIGHT     And: <usual light>  But: <least kind light>
            Therefore: <warmer or clearer, from a real source>
  CASTING   <age, build, hair, clothes, one item>

  Line | speaker | words | picture (subject, action, light) | cut | s
  1    | <Narrator> | "<words>" | <one subject, one action, key> | <how it joins> | <n>
  <one row per line, last row held with the product>

  NOTES
  - Inferred: <...>
  - MISSING: <...>

  CAST NOTE  <who carries it, why, voice, what never changes>

  CHECKS MISSED: <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Idea: busy parents mean to take their greens and run out of time.
    A daily pack is the shortcut.
    Buyer (brand file): busy parents, 30 to 45, mostly mums.
    Review: "So easy to grab and eat on my way to the billion things
    I have to do as a mom."
    Approved claim: "60+ ingredients, 21 vitamins & minerals, and 6g
    fiber" in 1 pack.
    Product: glossy deep-green pouch, big yellow wordmark, yellow
    bear face top right, "28 Daily Packs" at the bottom. Daily pack
    torn straight across the top. Gummies: small deep-green bears.
    Offer: first order $29.99 with the text sign-up discount, renews
    at $49.99 every 4 weeks.
    Brand line: "Rip. Tip. Enjoy."
    Settings: video, 30 seconds, narrator.
  output: |
    FIT: a moment the buyer knows (the school-run rush). The claim
    line is said exactly as approved; no result is shown.

    STORY   A parent gets everyone out the door and means to take
            her greens, but the powder wants a scoop, a shaker and a
            rinse, therefore she grabs a daily pack on the way out.

    LIGHT   And: soft grey daylight through the front-door glass.
            But: flat overhead kitchen light, cool, busy shadows.
            Therefore: low warm sun through the open front door.
    CASTING a stylised animated woman, late thirties, slim, dark
            curly hair tied up, rust jumper, canvas tote on her left
            shoulder.

    1 | Narrator | "Seven forty. Lunches packed. Shoes, mostly found."
      | her in the hallway, lifting a small shoe from the mat; And
      | opens the ad | 4
    2 | Narrator | "You meant to have your greens today." | she
      glances toward the kitchen; And | on a look | 3
    3 | Narrator | "But the powder wants a scoop, a shaker and a
      rinse." | she sees the shaker in the sink, shoulders drop,
      nudges it aside with two fingers; But | to a detail | 5
    4 | Narrator | "Seven forty-one." | she taps her keys on the
      counter, eyes on the clock; But | on the action | 2
    5 | Narrator | "So grab a pack instead. Rip. Tip. Enjoy." | her
      hand takes a daily pack from the bowl by the door, tears it
      across the top, tips the bears into her palm; Therefore |
      time jump (two seconds later, at the door) | 5
    6 | Narrator | "Sixty-plus ingredients, twenty-one vitamins and
      minerals, and six grams of fiber, in one pack." | she eats
      them as she steps out, shoulders loosen, a small smile;
      Therefore | on the action | 6
    7 | none | held: the pouch in her hand at the open door, label to
      camera (yellow "Sprout" wordmark, bear face top right, "28
      Daily Packs"); offer on screen | to a detail | 3

    NOTES
    - 49 spoken words over 25 seconds, then 3 quiet seconds (28 in
      all), about 2 words a second.
    - On-screen offer: "$29.99 first order with text sign-up.
      Renews at $49.99 every 4 weeks."
    - Her smile is about the easier morning, not a health result.
    - Inferred: the bowl of packs by the door. It isn't in the brand
      file; it comes from the review's "on my way".
    - MISSING: the daily pack's own label words. Keep its front
      turned away in line 5 until they're supplied.

    CAST NOTE  The mum on the casting card carries it, silent, with
    a narrator. Busy parents see their own 7:40 rush in her, and a
    narrator keeps the claim line exact and out of her mouth.
    Narrator: a warm adult voice, quick but calm. Never change: the
    curly hair tied up, the rust jumper, the tote on her left
    shoulder.

tweaks:
  - what: Who speaks
    how: A narrator suits a quiet story. One character speaking on camera feels closer, but still never claims a result.
  - what: Length
    how: At 15 seconds the "and" part shrinks to one shot. At 40 seconds the snag gets room to build.
  - what: The light keys
    how: Name your brand's light (bright and sunny, soft and calm) and the "therefore" key uses it.

judge:
  - The story line has a clear snag and a turn your claims support.
  - The light changes only between the three parts.
  - The casting card is word for word the same everywhere.
  - Every feeling is written as gestures, not one word like "sad".
  - The product enters at the turn, in use, with its real label.

test:
  - Read only the light column. You should see three keys, in order, with no change inside a part.
  - Count the spoken words and divide by the seconds. It should be about 2 or 2.5 words a second.
  - Give it a buyer and idea you've already made an ad for. The moment should feel like that buyer's real day.
  - Run it twice. The character can change. The product, its label words and the claims must not.

improve:
  - Paste your exact label words, colours and opening steps into "What you need" in the skill file, so the product is never guessed.
  - Add your approved and banned claims to step 6.
  - Add two or three buyer moments from your reviews to step 2, so the story starts in a room your buyers know.
  - Save a casting card you like in your brand file, so a series of ads has one face.
  - Pair it with "Animated film video clip prompt writer", which runs the avatar, sheets, storyboard and clips.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
  inputs:
    - "Two or three buyer moments from your reviews, with the room and time of day"
    - "Photos of the product being opened, so every step in the script is true"
    - "The voice you already use in ads, if any, so the speaker fits your brand"

terms:
  - term: Light key
    meaning: One line describing the light and colour for a part of the story, used for every shot in that part.
  - term: Casting card
    meaning: A short, fixed description of a character, pasted the same way every time they appear.
  - term: Voice-over
    meaning: A narrator you hear but don't see.
