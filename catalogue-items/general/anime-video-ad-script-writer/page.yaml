new_slug: anime-video-ad-script-writer
name: "Anime video ad script writer"
summary: "Paste your idea and brand file. Get anime-style video shot cards, cast note and score out of 100."
job: make-video-ads

headline: "Anime video ad script writer"
subhead: Give it your selling idea and brand file. It designs one original adult hero for an anime-style video, picks one thing the drawing exaggerates, and writes every shot as two key poses and a hold. You get shot cards, a cast note and a score out of 100.

explain: |
  Hand-drawn anime can push things past real life. A chore can tower over the hero, a sigh can become a storm cloud, one quick tear of a pack can stretch into a moment. That makes it good for stopping a scroll. It also goes wrong easily: copied characters, a fight with no product in it, or a hero who "powers up" in a way that reads as a promised result.

  This skill keeps it original and honest. It proposes the look on four simple dials (line, shading, palette, backgrounds) and designs one hero who reads as an adult even as a black outline. It picks one thing to exaggerate, the size of the old way, a feeling, or the speed of one moment, each with a limit. It names the pose the whole ad builds to, then writes every shot the way TV anime is drawn: a start pose, an end pose and a short hold, with only a few parts moving. The product is drawn exactly, label words and all, and the hero never says it worked for them.

when:
  - Your buyer has an old way of doing things you can draw as huge and silly (a shoebox of receipts, a drawer of tangled chargers).
  - You want an ad that looks nothing like the others in your category.
  - You want a script your video tool can follow shot by shot, without the hero changing.

you_give:
  - Your selling idea or an existing script
  - Your brand file, with the product's look and label words, the old way it replaces, and your approved claims
  - The length and your video tool's clip length (optional)
you_get:
  - A proposed look line, a hero sentence and the one thing the drawing exaggerates
  - The problem, turn and payoff poses the ad builds to
  - Shot cards with key poses, holds, what moves, words and sound
  - A cast note saying who carries the ad and why, ready for the clips skill
  - A score out of 100 for how many of its own checks the script passes, with any it missed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your selling idea and brand file. Include, in your buyer's words, the old way your product replaces.
  - Say the length, such as "20 seconds", and your tool's clip length if you know it.
  - Picture it with the sound off. If you can't name the old way, the change and the product's part, ask for a clearer turn pose.
  - Take the shot cards and cast note to "Anime video clip prompt writer". It takes it from there, with the avatar, sheets, storyboard and clips.

how_it_works:
  - title: Checks the fit
    text: Confirms the idea suits drawing things bigger than life and doesn't rest on a real face or real texture.
  - title: Proposes the look
    text: Sets line, shading, palette and backgrounds as one look line, marked proposed so the clips skill can keep it.
  - title: Designs one hero
    text: An original adult you'd know as a black outline, in one sentence reused unchanged.
  - title: Picks one exaggeration
    text: The old way drawn huge, a feeling drawn as a comic symbol, or one moment drawn fast or held still.
  - title: Names three poses
    text: The problem pose, the turn pose with the product in hand, and the payoff pose the ad ends on.
  - title: Writes shot cards
    text: A start pose, an end pose and a hold for each shot, what moves and what stays still, one speaker at a time.
  - title: Writes the cast note
    text: Who carries the ad, why that suits your buyer, their voice and what must never change.

output_shape: |
  LOOK (proposed)  <line, shading, palette, backgrounds>
  HERO             <one original adult, one sentence>
  EXAGGERATION     <size / feeling / speed, and its limit here>
  POSES            Problem: <...>  Turn: <...>  Payoff: <...>

  Shot n · <seconds> · clip <n>
  Key A: <opening pose>  >  Key B: <end pose> · hold <time>
  Moves: <parts>   Holds: <parts>
  Words: <speaker>: "<exact line>" or none   Sound: <contact sounds>

  NOTES
  - Sound-off read: <old way, change, product's part>
  - <metaphors flagged, MISSING items>

  CAST NOTE  <who carries it, why, voice, what never changes>

  SCORE  <n>/100 (<passed> of <total> checks passed)
  Missed: <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Idea: the old way (chalky greens powder and a shaker) drawn as a
    giant. One daily pack cuts it down to size.
    Buyer: the powder quitter. Review: "I've been choking on [a
    big-name greens powder] for the last few years".
    The old way (brand file): a half-used tub of powder and a
    shaker.
    Product: glossy deep-green pouch, big yellow wordmark, yellow
    bear face top right, "28 Daily Packs" at the bottom. Daily pack
    torn straight across the top only. Gummies: small deep-green
    bears.
    Brand line: "Rip. Tip. Enjoy."
    Settings: video, 20 seconds, narrator only, light comedy,
    8-second clips.
  output: |
    LOOK (proposed)  thick even marker outline, flat colour with one
                     shadow tone, full bright palette, flat graphic
                     backgrounds.
    HERO             an original adult man, tall and lanky, spiky
                     black hair with one tuft over his left eye, teal
                     hoodie, sand trousers, white trainers.
    EXAGGERATION     Size. A plain, unlabelled tub of grey-green powder
                     drawn three times his height. It shrinks back
                     once the pack is open. A metaphor, not a result.
    POSES            Problem: arms crossed, glaring up at the tub.
                     Turn: both hands on the daily pack's top edge.
                     Payoff: at the front door, facing screen right,
                     the pouch at chest height, front to camera.

    Shot 1 · 4 s · clip 1
    Key A: behind the counter, arms crossed, facing the tub (screen
      right)  >  Key B: one eyebrow drops · hold 1 s
    Moves: eyebrow, hoodie strings.  Holds: body, tub.
    Words: Narrator: "Same fight, every morning."  Sound: fridge hum.

    Shot 2 · 3 s · clip 1
    Key A: he lifts the scoop  >  Key B: powder puffs into his face,
      he blinks · hold 0.5 s
    Moves: arm, the puff.  Holds: the tub.
    Words: none, the blink is the joke.  Sound: a soft puff.

    Shot 3 · 3 s · clip 2
    Key A: both hands pinch the daily pack's top edge (wind-up: they
      pinch tighter)  >  Key B: torn straight across in one pull ·
      hold 0.5 s
    Moves: hands, the torn strip.  Holds: the pack's front.
    Words: Narrator: "Or skip the scoop."  Sound: one crisp tear.

    Shot 4 · 4 s · clip 2
    Key A: the pack tips  >  Key B: small deep-green bears in his
      palm, the tub behind him shrunk to normal size · hold 1 s
    Moves: the bears, the tub shrinking.  Holds: the hero.
    Words: none.  Sound: a soft patter.

    Shot 5 · 6 s · clip 3
    Key A: he steps through the door, facing screen right  >
      Key B: the payoff pose · hold 1.5 s
    Moves: legs, then hair settling after the stop.  Holds: the
      pouch, front to camera.
    Words: Narrator: "Rip. Tip. Enjoy."  Sound: door click.

    20 seconds, 11 spoken words.

    NOTES
    - Sound-off read: the old way is the giant tub, the change is the
      torn pack, the product is the pouch in the payoff.
    - The hero never speaks and never says it worked for him.
    - The shrinking tub is a metaphor for an easier routine.
    - Offer text goes beside the pouch in editing, from the current
      offer.
    - MISSING: the daily pack's own label words. Shots 3 and 4 show
      its back until they're given.

    CAST NOTE  The hero carries it, silent, with an off-screen
    narrator. The powder quitter sees himself in a tired adult losing
    a daily fight with a tub, and a silent hero keeps every word with
    the brand. Narrator: a dry, friendly adult voice, unhurried. Never
    change: the tuft over his left eye, the teal hoodie, facing screen
    right toward the product.

tweaks:
  - what: The exaggeration
    how: Name one ("exaggerate the feeling") or let it choose. Size suits a cluttered old routine, speed suits a product whose use is the fun part.
  - what: The look
    how: Change any dial, such as "thin line and painted backgrounds" for a calmer feel. It keeps one look for the whole ad.
  - what: Sound
    how: Say "no dialogue" and it tells the whole story in poses and on-screen text, which works with the sound off.

judge:
  - The look, the hero and the exaggeration are named once at the top and never change.
  - You could name the old way, the change and the product's part in it with the sound off.
  - Every shot has a start pose, an end pose and a hold.
  - The product's label words match your pack or screen exactly.
  - No artist, studio, series or competitor is named, and the hero never says "it worked for me".

test:
  - Picture it with the sound off. You should still be able to say the old way, the change and the product's part in it.
  - Check every label word in the script against your real pack.
  - Count the moving parts on each shot card. Most should list only one or two.
  - Run it twice. The look can change, but the product, the claims and the one exaggeration rule must hold.

improve:
  - Write the old way in your buyer's own words into "What you need" in the skill file, so the giant is always theirs.
  - Save the look line and hero sentence you like in your brand file, so a series of ads looks like one family.
  - Add your banned claims to the checks, so no pose shows a result you can't back.
  - Pair it with "Anime video clip prompt writer" for the sheets and clip prompts.

works_best_with:
  tools:
    - {name: "Claude", why: "Follows long skill files closely and keeps the hero sentence word for word across every shot."}
  inputs:
    - "A photo of the product being opened and used, so the hero's hands copy your real steps"
    - "Two or three buyer reactions to the old way (a groan, a joke), so the hero's feeling rings true"
    - "A photo of the room where buyers use it, so the place feels like theirs"
    - "Your never-show list, so no shot draws something your brand avoids"

terms:
  - term: Key pose
    meaning: One of the main drawings in a shot, such as where an action starts and where it ends.
  - term: Hold
    meaning: A short moment where the drawing stays still before the cut, often where the joke lands.
  - term: Payoff pose
    meaning: The picture the whole ad builds to, usually the hero with your product, front to camera.
