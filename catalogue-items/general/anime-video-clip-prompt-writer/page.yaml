new_slug: anime-video-clip-prompt-writer
name: "Anime video clip prompt writer"
summary: "Turn an approved anime ad script and your product photos into hand-drawn style clip prompts and an edit list, with three stops for your OK."
job: make-video-ads
thinking: high
thinking_why: "It runs several stages and keeps many rules at once across a long output."

headline: "Anime video clip prompt writer"
subhead: Give it an approved anime-style ad script and real product photos. It writes the hero's card, builds sheets and a storyboard of key poses and holds, and writes the clip prompts, stopping three times for your OK. You get every prompt and an edit list, with any check still missed.

explain: |
  AI video tools can draw good 2D animation one clip at a time. Across a whole ad, things drift. The hero's hair changes, the style slides toward 3D, the label on your pack melts, and every part of the body moves at once, so it stops looking hand-drawn.

  This skill runs the whole process in six stages. It reads the script, writes an avatar card for the hero and waits for your OK. It makes a few reference images, then a sheet with the hero from every angle, a product sheet from your photos and a set sheet, plus lock lines repeated in every prompt. You approve those, then a storyboard where each shot is a start pose, an end pose and a short hold, with only a few parts moving. Only then does it write the clips, the voice and the edit.

when:
  - You have an approved anime-style script and want to make it with AI image and video tools.
  - Your animated clips keep changing the hero or the product between shots.
  - Your clips look like smooth 3D instead of hand-drawn animation.
not_for:
  - "You want a live-action ad: write the script and shot list yourself, or ask a video editor, because this skill only plans hand-drawn 2D anime."
  - "You need one still picture: use your image tool directly, because this skill plans a full video with clips."
  - "You have no script yet: write one first with the Customer quote video ad writer, then come back."

you_give:
  - The approved script with its shots, and its cast note if it has one
  - Real photos of your product (front, side, top, opened) and every label word
  - How the product is opened and used
  - Your tone, colours and approved claims (optional)
  - Your video tool's clip lengths and how many reference images it takes (optional)
you_get:
  - An avatar card for the hero, and 3 or 4 reference image prompts to pick from
  - Prompts for a character sheet from every angle, a product sheet and a set sheet, with lock lines
  - A storyboard of frames and shot cards with key poses, holds and what moves
  - Clip prompts and an edit list with cuts, captions, music and the end card
  - One line for each of its checks the prompts still miss

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the approved script, ideally from "Get an original anime ad script", and attach your product photos.
  - Approve or change the avatar card. Then make the reference images and tell it which one you picked.
  - Make the sheets and approve them with the lock lines, then make the storyboard frames and approve the board.
  - Make the clips from the approved frames. If a take fails, attach a screenshot, say what went wrong and ask for the fix.
output_sample:
  input:
    - Your approved anime-style ad script, with its shots
    - Real photos of your product and every word on its label
    - How your product is opened and used
    - Your tone, colours and approved claims (optional)
    - Your video tool's clip lengths and reference image limit (optional)
  prerequisites:
    - An AI that can read images, to look at your product photos
    - An AI image tool and an AI video tool to make the pictures and clips from the prompts
  output:
    - name: Avatar card
      contains: The hero's role, age, look, outline, clothes, voice and what never changes, held for your approval.
    - name: Reference images
      contains: Three or four image prompts of the hero in the chosen look, so you can pick one.
    - name: Sheets and lock lines
      contains: A character sheet, a product sheet and a set sheet, plus short lines pasted into every prompt.
    - name: Storyboard
      contains: One shot card per shot with two key poses, a hold, what moves, what holds and continuity notes.
    - name: Clip prompts
      contains: One prompt per clip with its start frame, end pose, the motion only, and how it cuts out.
    - name: Edit list
      contains: Clip order, captions, music, end card, safe zones and retakes.
    - name: Checks missed
      contains: One line for each check the prompts still miss, or none.

how_it_works:
  - title: Reads the script
    text: Lists the shots, lines and claims, keeps the look line or sets the four dials, and names the payoff pose.
  - title: Writes the avatar card
    text: An original adult hero with a shape you'd know in silhouette, clothes, voice and what never changes. It stops for your OK.
  - title: Makes reference images
    text: Three or four images of the hero in the look. You pick one.
  - title: Builds the sheets
    text: The hero from five angles with the expressions the script needs, the product from your photos, each set empty, and lock lines. It stops for your OK.
  - title: Draws the storyboard
    text: One frame per shot, each a start pose, an end pose and a hold, with what moves and what holds. It checks facing and props, then stops for your OK.
  - title: Turns it into video
    text: Each frame starts its clip, the prompt says only the motion, then voice, cuts, captions and the end card. Failed takes are rerun, simplified, then fixed one thing at a time.

output_shape: |
  STAGE 1  AVATAR CARD  <role, age, look, silhouette, clothes, voice,
           never change>                         > STOP for approval
  STAGE 2  REFERENCES   <3 or 4 prompts>  Picked: <n>
