name: "Anti-AI-slop copy editor"
new_slug: anti-ai-slop-copy-editor
summary: "Paste your copy. Get each machine-sounding line fixed, the full rewrite and a score out of 100."
job: check-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Anti-AI-slop copy editor"
subhead: Paste finished copy. It scans every line for 16 signs of machine writing, from inflated meaning to chatbot leftovers, and checks the rhythm. You get each hit with a plain fix, the full rewrite and a score out of 100, before and after.

explain: |
  Readers now spot AI-written copy fast, and once they spot it they doubt the claims around it. Usually a cluster of habits gives it away, such as lines that make things sound important, the same few sentence shapes, a familiar set of words and a tidy layout.

  This skill checks for 16 signs drawn from public guides to spotting AI text, including the one Wikipedia's editors keep. They sit in five families: inflated meaning, stock shapes, word choice, layout and leftovers. It quotes every hit and writes a plain fix using only facts already in the copy. It also flags runs of sentences the same length. Because no single sign proves anything, it reports hits per 100 words, and it leaves alone things that only look suspicious, like correct grammar or your brand's own lines.

when:
  - You used AI to write an ad, page or email and want to remove what gives it away.
  - Copy from a writer feels slick and empty, and you want to see why.
  - You want a last scan before publishing anything customers will read.

you_give:
  - The copy to scan
  - Your voice notes and the brand's own published lines, so real brand habits can stay (optional)
you_get:
  - Every hit quoted, with its sign and a plain fix
  - Hits per 100 words, before and after
  - A score out of 100 worked out from the hits and the rhythm, before and after
  - The lines it chose not to flag, and why
  - A rhythm pass or fail, and the full copy rewritten with the fixes

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the copy you want checked.
  - Paste your voice notes and a few lines your brand already uses, if you have them.
  - Read the hits list first, then the rewrite. Accept or reject each change.
  - For a script that will be spoken aloud, also run a read-aloud polish for scripts.

how_it_works:
  - title: Scans for 16 signs
    text: Five families. Inflated meaning, stock shapes, word choice, layout and chatbot leftovers.
  - title: Quotes each hit
    text: Every hit is quoted exactly, with the number and name of the sign, so you can find it yourself.
  - title: Writes a plain fix
    text: Replaces each hit with plain wording, using only facts already in the copy.
  - title: Checks the rhythm
    text: Flags three or more sentences in a row of about the same length, and runs of fragments.
  - title: Leaves real writing alone
    text: Correct grammar, a formal tone, three real facts in a row and your brand's own lines aren't flagged.
  - title: Counts the density
    text: Reports hits per 100 words before and after, so you can compare drafts.

output_shape: |
  HITS: <n> in <words> words (<n> per 100)
  <n>. "<the exact words>"
     Sign: <number and name>
     Fix:  <plain wording, using only facts in the copy>

  NOT FLAGGED
  <lines that looked suspicious, and why they stay>

  RHYTHM: <pass / fail>, <the run that fails>

  REWRITTEN COPY
  <the full copy with every fix applied>

  AFTER: <n> per 100 words

  SCORE
  Before: 100 - (<hits per 100 words> x 10) - <10 if rhythm fails> = <score>
  After: <score>

example:
  business: sprout
  input: |
    [the skill]

    Copy (email intro):
    1 Whether you're a busy parent or a gym regular, your nutrition
      matters.
    2 Sprout packs 60+ ingredients, 21 vitamins and minerals, and 6 g
      of fiber into one small daily pack of gummies.
    3 No powders. No pills. No shaker.
    4 Does it actually work? Absolutely.
    5 Less hassle. More greens.
    6 It's about more than vitamins.
    7 Level up your daily routine.
    8 Clinically tested for nutrient absorption.
    9 Rip. Tip. Enjoy.

    Brand's own lines: "Rip. Tip. Enjoy." / "Tastes like a treat,
    works like a supplement."
  output: |
    HITS: 6 in 65 words (9.2 per 100)
    1. "Whether you're a busy parent or a gym regular,"
       Sign: 9, stock opener
       Fix:  cut line 1 and open on line 2, the fact
    2. "No powders. No pills. No shaker."
       Sign: 6, negation run
       Fix:  cut. Line 2 already says what you get: one small daily
             pack of gummies.
    3. "Does it actually work? Absolutely."
       Sign: 8, self-answered question
       Fix:  cut. Line 8 gives the fact, in its own place.
    4. "Less hassle. More greens."
       Sign: 5, contrast pivot
       Fix:  cut. Line 2 already says what you get.
    5. "It's about more than vitamins."
       Sign: 1, importance inflation
       Fix:  cut. MISSING: what "more" means; the copy doesn't say.
    6. "Level up your daily routine."
       Sign: 10, familiar word cluster
       Fix:  cut. "One small daily pack" in line 2 already says it.

    NOT FLAGGED
    "Rip. Tip. Enjoy." is the brand's own line and reads as plain
    instructions for the pack, so it stays.

    RHYTHM: fail. Lines 3 to 7 are nine sentences of one to five words
    in a row. Line 8 is a fragment that isn't a label; the rewrite makes
    it a whole sentence where it stands.

    REWRITTEN COPY
    Sprout packs 60+ ingredients, 21 vitamins and minerals, and 6 g of
    fiber into one small daily pack of gummies. It's clinically tested
    for nutrient absorption. Rip. Tip. Enjoy.

    AFTER: 0 per 100 words (0 hits in 29 words; rhythm pass)

    SCORE
    Before: 100 - (9.2 x 10) - 10 = -2, stops at 0
    After: 100 - (0 x 10) = 100

tweaks:
  - what: Your brand's own lines
    how: Paste them. A brand that uses a three-beat line in its own copy keeps it on lines a person would still say, instead of having every triple flagged.
  - what: What kind of copy
    how: This is for copy people read. For a spoken script, run a read-aloud polish as well, because speech has different tells.
  - what: Facts in the copy
    how: Fixes only use facts already there. If your draft is thin, expect MISSING notes and cut flourishes rather than new detail.
  - what: Only the hits
    how: Ask for "hits only, no rewrite" if you want to fix the lines yourself.

judge:
  - Every hit is quoted exactly as it appears in your copy.
  - No fix adds a fact, claim or number that wasn't in the copy.
  - The rewrite keeps your meaning and order.
  - A fixed sign hasn't turned into another, such as a negation run becoming a triple.
  - Read the rewrite aloud. It should sound plainer, not cleverer.

test:
  - Run it on a paragraph you wrote and one an AI wrote for the same job. The AI one should have more hits per 100 words.
  - Plant three signs in good copy, such as a negation run and a self-answered question. It should catch all three.
  - Paste a well-edited human paragraph with perfect grammar. It shouldn't flag the grammar.
  - Run it twice on the same copy. The hit list should be the same.
  - Read the rewrite next to the original. It should mean the same thing, in the same order.

improve:
  - Add your brand's real style habits (a three-beat line it uses, for example) to step 4 of the skill file, so they aren't flagged.
  - Add words your AI drafts lean on to sign 10, with the plain word to use instead.
  - Cut families that never come up in your copy if you want a shorter skill to paste.
  - Save your most common hits to your brand file as things every writing request should avoid.
  - Pair it with "Edit a draft so it reads clean and sells" for a full editor's read, and "Make sure every ad sounds like your brand" if the rewrite lost your tone.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI can scan for the 16 signs. Ask it to quote each hit exactly as written."}
  inputs:
    - "The prompt or brief that made the draft, so the fixes go back into it and the next draft starts cleaner"
    - "A second draft for the same job, so the hits per 100 words can be compared"
    - "Your list of words the brand never uses, so those are flagged too"

terms:
  - term: Sign
    meaning: A recognisable habit of machine writing, such as "No X. No Y. Just Z.", that makes copy read as AI-made.
  - term: Rhythm
    meaning: How sentence lengths rise and fall. Speech varies; machine copy often doesn't.
  - term: Hits per 100 words
    meaning: How many signs it found for every 100 words, so you can compare a draft before and after.
