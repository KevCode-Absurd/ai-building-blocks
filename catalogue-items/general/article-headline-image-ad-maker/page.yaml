new_slug: article-headline-image-ad-maker
name: "Article headline image ad maker"
summary: "Turn your page headline into a square image ad prompt, with a check that the ad and the page match, so the click feels like one story."
job: make-image-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Article headline image ad maker"
subhead: Paste your story ad and attach a screenshot of the page it opens. It puts the page's headline, cut to 7 words, on a candid photo of the same moment. You get the image prompt, a match check with fixes and any check it missed.

explain: |
  An ad can win the click and still lose the reader. If the picture talks about a shaker in the sink and the page opens on a product name, people feel switched and leave. This skill puts the page's own headline on a candid photo of the moment the page starts with, so the click feels like turning a page.

  It cuts the headline to 7 words or fewer, because people give a post under two seconds on a phone. It keeps a plain area in the photo for the line, away from the bottom where buttons sit, and sets it in plain heavy type with no masthead, byline or date. Then it runs a scent check: do the ad and the page's first screen share the same words, the same scene and the same promise?

when:
  - Your ad sends people to a long page and you want the two to feel like one story.
  - People click your ad but leave the page fast.
  - The problem needs a line of words before a photo of it makes sense.
not_for:
  - Your page does not open on the ad's story. Use a plain product photo ad, or change the page first.
  - You want a photo with no words on it. Ask your AI for a plain candid photo prompt instead.
  - You need the ad text itself. Use the Fact-based ad copy writer first, then come back here.

you_give:
  - Your approved story ad
  - The headline on your page's first screen, and a screenshot of that screen attached (optional, but best; your AI can see pictures)
  - Where and when the problem happens, for the photo (optional)
you_get:
  - One line of 7 words or fewer, placed and styled on the photo
  - A second line for under the image
  - A scent check on words, scene and promise, with fixes
  - A 60 to 120 word image prompt, ready to paste
  - Any of its five other checks it couldn't meet, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad.
  - Paste your page's first-screen headline and attach a screenshot of that screen. If there's no page yet, say so.
  - Paste the image prompt into your image tool. Check every letter of the line on the finished image.
  - Fix whatever the scent check flags, on the ad or on the page, before you spend.
output_sample:
  input:
    - Your approved story ad
    - The headline on your page's first screen
    - A screenshot of that first screen (optional)
    - Where and when the problem happens (optional)
  prerequisites:
    - An image tool such as ChatGPT, Gemini or Higgsfield, if you want the picture made
  output:
    - name: Scene
      contains: What someone scrolling would say they saw in the picture.
    - name: Where and when
      contains: The place, the time and what is within reach.
    - name: The photo
      contains: The moment shown, with a plain area kept clear for the words.
    - name: Words on the image
      contains: The one line in quotes, with its word count and where it came from.
    - name: Type and place
      contains: Where the line sits, its colours and its weight.
    - name: Blank version
      contains: The same photo with no words on it.
    - name: Line under the image
      contains: A different short line to sit under the picture, with its character count.
    - name: Scent check
      contains: A match or a fix for the words, the scene and the promise.
    - name: Image prompt
      contains: A 60 to 120 word prompt, ready to paste into your image tool.
    - name: Checks missed
      contains: One line for each check it could not meet, or none.

how_it_works:
  - title: Sets the house rules
    text: Square, looks taken on a phone, no logo, price, button or brand colour, no product unless asked, any person is a made-up adult, and it never poses as a user's own photo. The ad label stays on.
  - title: Takes the page's headline
    text: Uses the page's biggest first-screen line. If that's only a product name, it writes the line from your story and flags the page.
  - title: Cuts it to 7 words
    text: Cuts words without swapping in new ones, so it reads at a glance.
  - title: Briefs the photo
    text: The same moment your page opens on, with a plain area in the top or middle third for the words.
  - title: Sets the type
    text: One line in plain heavy type. No masthead, outlet name, byline or date, so it never passes for a newspaper.
  - title: Runs the scent check
    text: Compares the ad with your page's first screen on words, scene and promise, and says what to change.

output_shape: |
  SCENE              <what someone scrolling would say they saw>
  WHERE AND WHEN     <place, time, what is within reach>
  THE PHOTO          <the moment, and the clear area for words>
  WORDS ON THE IMAGE "<one line>" (<word count>, from <page | story>)
  TYPE AND PLACE     <position, colours, weight>
  BLANK VERSION      <the same photo with no words>
  LINE UNDER IMAGE   <words> (<characters>)

  SCENT CHECK
  Words:   <match | fix>
  Scene:   <match | fix>
  Promise: <match | fix>

  IMAGE PROMPT
  <60 to 120 words, ready to paste>

  CHECKS MISSED
  <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on reviews 4 and 6):
    I'd been choking on a greens powder for years. Every evening
    ended the same way: the shaker soaking in the sink, a green film
    that wouldn't rinse out.
    This year I gave it up. Sprout is one daily pack: tear the top,
    eat the small handful of gummies inside. 60+ ingredients, 21
    vitamins and minerals, 6 g prebiotic fiber. No water, no shaker.
    30-day money-back guarantee on your first order.

    Ad links to: the Sprout product page.
    First screen: title "Sprout Superfood Gummies", under it "60+
    potent ingredients to revive whole body vitality in great tasting
    gummies." First image: the pouch on a soft gradient.
  output: |
    SCENE              A kitchen sink at night, a shaker soaking in it,
                       one line of words across the wall above.
    WHERE AND WHEN     Kitchen sink, about 9pm, one overhead light.
                       Within reach: the shaker, its scoop, a dish
                       brush, a wet cloth over the tap.
    THE PHOTO          A plain shaker, lid off, in cloudy water with a
                       green film inside. Scoop and a green-tinged dish
                       brush beside it. The tiled wall above the tap is
                       bare, kept clear for the line.
    WORDS ON THE IMAGE "9pm. The shaker's still soaking." (5 words,
                       from the story; the page title is a product name)
    TYPE AND PLACE     Top third, on the bare tiles. Black, heavy plain
                       sans-serif on the light tile, sentence case.
    BLANK VERSION      The same photo with no words.
    LINE UNDER IMAGE   Swap the scoop for a pack. (26)

    SCENT CHECK
    Words:   Fix. The page opens on "Sprout Superfood Gummies". Add
             the same line, or a longer version of it, to the top of
             the page, or send this ad to a page that opens with it.
    Scene:   Fix. The page's first image is the pouch on a gradient.
             Lead with this sink photo, or one of the same moment.
    Promise: Fix. The page promises "whole body vitality". The ad
             promises an end to the washing up. Move the "No Mess, No
             Stress" lines and the "Vs Powders" reviews to the first
             screen; they sit in a closed accordion and at the bottom.

    IMAGE PROMPT
    Square 1:1 candid phone photo of a kitchen sink at about 9pm under
    one overhead light. A plain plastic shaker bottle, lid off, soaks
    in cloudy water with a green film inside, beside a scoop and a
    dish brush with green-tinged bristles. A wet cloth hangs over the
    tap. Slight tilt, ordinary light, a little grain, unstyled. The
    tiled wall above the tap is bare. In the top third, on the tiles,
    heavy black plain sans-serif text reading "9pm. The shaker's still
    soaking." spelled exactly. No logo, no brand name, no price, no
    button, no person, no product, no other text.

tweaks:
  - what: The page headline
    how: Paste your page's real first-screen headline. If it reads well alone, it goes on the photo word for word, cut to 7 words, which keeps the ad and the page in step.
  - what: The caption line
    how: When the line has to be written fresh, ask for a different one, such as a question about the thing ("How long has that been soaking?") or the buyer's own line from a review.
  - what: Where the words sit
    how: Say "on the wall above" or "across the window". Open space looks more like a real photo; a plain band is easier to read on a busy one.
  - what: The photo
    how: Point it at the moment your page starts with. The scent check works best when the ad and the page show the same scene.

judge:
  - The line on the photo matches the page's first screen, or the scent check says how to fix it.
  - It's 7 words or fewer, and every letter is right on the finished picture.
  - It says only what your copy supports. No invented number and no named expert.
  - Nothing looks like a newspaper. There is no masthead, outlet name, byline or date.
  - The line under the image is different from the line on it.

test:
  - Run it on an ad whose page headline already works. It should use that headline word for word, cut to 7 words if needed.
  - Run it on a page whose title is only a product name. The scent check should flag the words and say what to change.
  - Put the finished picture next to your page's first screen on a phone. If someone can't tell they're the same story, fix the one the scent check named.
  - Ask a colleague whether the picture looks like a post or an ad. If they say ad, look for a logo, brand colour or styled shot that slipped in.

improve:
  - Write your page headlines into your org context, one per landing page, so the skill can pick the right one by link.
  - Add the words your brand never uses to the check list, so no line breaks them.
  - Add your page's first images to the org context, so the scene check can run without you describing them.
  - Pair it with a skill that writes the landing page, so the page's opening line is written first and the picture follows it.

works_best_with:
  tools:
    - {name: "GPT Image", why: "Spells a short line on a photo better than older models, and you can point at one wrong word to fix it."}
    - {name: "Nano Banana", why: "Google's main image model, with better text on images and steady results across follow-up edits."}
  inputs:
    - "A phone screenshot of your page's first screen, so the scent check compares what buyers see"
    - "Two or three real photos of the room where the problem happens, so the scene looks like your buyers' homes"
    - "The words buyers use for the problem in reviews, so a fresh line sounds like them"

terms:
  - term: Scent check
    meaning: Comparing an ad with the page it opens, to see if they share the same words, scene and promise. When they match, people keep reading.
  - term: First screen
    meaning: What someone sees on the page before they scroll.
  - term: Masthead
    meaning: A newspaper or magazine's name at the top of its page. This picture never has one.
