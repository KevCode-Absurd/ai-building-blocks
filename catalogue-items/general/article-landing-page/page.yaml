new_slug: article-landing-page
name: "Article-style landing page writer"
summary: "Paste your facts, offer and ad. Get an article-style page, labelled as an ad, and an image list."
job: write-landing-page
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Article-style landing page writer"
subhead: Give it your product facts, your offer and the ad that sends people over. It writes a long page in ten sections, from a problem the reader knows to your offer, labelled as an ad. You get the page copy, an image list and any check it missed.

explain: |
  Someone who clicks an ad but has never heard of you isn't ready for a price and a button. Send them to a product page and most leave. They first need to see their own problem, understand why what they tried didn't work, and only then meet your product.

  This skill writes that kind of page, often called an advertorial (an ad written like an article). It moves the reader in four steps. Recognise: the problem in their words. Understand: why the usual fixes fail, and the tests a real fix would have to pass. Believe: your product against each test, with proof you can show. Decide: the offer with full terms and the last doubts answered. It puts "Advertisement" above the headline, writes subheads that tell the story on their own, and never invents a journalist, doctor, founder quote or review.

when:
  - You run ads to people who have the problem but don't know your product yet, and they bounce off your product page.
  - Your ad reads like a story or article, and the page it sends people to jumps straight to "Add to cart".
  - You have a real reason the usual fixes fail and want a page with room to explain it.

you_give:
  - Your product facts, price, offers, guarantee and the claims you're allowed to make
  - The ad that sends people to the page (its first line, buyer and offer, with its image attached)
  - The true reason the usual fix fails and why yours is different
  - Real customer quotes with where they came from (optional)
you_get:
  - The full page copy in ten sections under four moves
  - The subheads on their own, to show the page still makes sense to a skimmer
  - A page brief and an image list with a caption for every image
  - A MISSING list of everything left out because you didn't supply the fact
  - Any of its own checks the page still misses, each named

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts and your claims list underneath, including what you must never say.
  - Paste the ad that will send people here, word for word, and say who it speaks to.
  - Write two or three sentences on why the usual fixes fail and why yours is different. If you can't, work that out first, because the page is built on it.
  - Read the MISSING list before anything else, then check the offer block against your real prices.

how_it_works:
  - title: Keeps the ad's promise
    text: The headline keeps the ad's words, the first image shows the same product, and any offer the ad named comes first.
  - title: Labels it as an ad
    text: Puts "Advertisement" above the headline in the first screen, with no fake newspaper name, byline or date.
  - title: Recognise
    text: A headline, a short standfirst, and the problem as the reader lives it, with no brand name.
  - title: Understand
    text: Why the usual fixes keep failing, then two to four tests any real fix would have to pass.
  - title: Believe
    text: Your product against each test, then proof you can show, with real quotes beside the claims they back, then who it suits.
  - title: Decide
    text: The offer with full terms, the doubts that remain, and one last line with the button.
  - title: Works for skimmers
    text: Subheads that say something, a caption under every image, and short paragraphs for phones.
  - title: Checks the page
    text: Goes through its own checks, such as the ad label above the headline and no button before section 5, fixes what it can, and names any check it still missed.

output_shape: |
  PAGE BRIEF
  Ad hook: <the ad's first line>   Buyer: <who it's for>
  Problem: <in their words>   Cause: <why the usual fix fails>
  Tests: <two to four>   Offer: <the offer the ad named>

  [Advertisement]  (above the headline, first screen)

  RECOGNISE
  1 <headline> / <standfirst>
  2 <subhead> / <the moment, in the reader's words>
  UNDERSTAND
  3 <subhead> / <the usual fixes and the cause they miss>
  4 <subhead> / <the tests a real fix must pass>
  BELIEVE
  5 <subhead> / <the product against each test>  [Button]
  6 <subhead> / <proof, with quotes beside claims>
  7 <subhead> / <who it suits, who it doesn't, what to expect>
  DECIDE
  8 <subhead> / <real offers, full terms under the button>
  9 <subhead> / <the doubts that remain, answered>
  10 <last line>  [Button]  <risk line>

  SUBHEADS ALONE
  <the subheads in order>

  IMAGE LIST
  <slot>: <real product photo> / caption: <one fact>

  MISSING
  - <each fact the page needed and didn't get>

  CHECKS MISSED
  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Facts: Sprout greens gummies. Pouch of 28 daily packs. Tear one open,
    eat the small handful of gummies. 60+ ingredients, 21 vitamins and
    minerals, 6 g prebiotic fiber per pack. Vegan, pectin base. Low Sugar
    or Sugar-Free (Sugar-Free uses sugar alcohols). Third-party tested for
    70 pesticides, 4 heavy metals, 16 contaminants, 9 microbial contaminants.
    Subscribe: $49.99 every 4 weeks. First order $29.99 only with the
    text-message sign-up discount. One-time: $66.65. Guarantee: 30-day
    money-back, first order only. Ships within 24 hours, arrives in 3-5 days
    on average. Fine to say: "Supports digestion and gut health".
    Never: "fix", weight loss, energy or immunity claims.

    Ad: "Struggling to Get Enough Fiber?" Main text: "Feeling off in your gut
    lately? [Sprout] supports digestion with 6g of fiber, prebiotics, and
    daily vitamins to help keep your gut balanced without powders or prep."
    No offer named. Buyer: the gut-fix seeker (bloating, irregularity).

    Why the usual fix fails: people quit supplements because they're
    unpleasant (chalky powders, pills that make you gag, a shelf of
    bottles). Sprout is one you want to eat.

    Quotes: reviews 8, 10 and 18 from reviews.md.
  output: |
    PAGE BRIEF
    Ad hook: "Struggling to Get Enough Fiber?"   Buyer: gut-fix seeker
    Cause: the usual fixes are unpleasant, so people stop taking them
    Tests: you'd want it daily / one step / nothing to mix
    Offer: none named, so the subscription leads

    [Advertisement]  (above the headline, first screen)

    RECOGNISE
    1 Struggling to get enough fiber? Why the usual fixes don't stick
      Most fiber fixes work on paper. Here's why people stop taking them,
      and what one you'd keep taking looks like.
    2 You've bought the fiber. Your gut still feels off.
      You know you need more fiber. You've been told it. But most days
      you're still bloated or not regular. So why isn't it working?

    UNDERSTAND
    3 The usual fixes fail at the taking
      Fiber powders work if you drink them, and a chalky drink every
      morning gets old. Pills turn into a shelf of bottles, and some are
      the kind you gag on. So people stop.
    4 A fix that lasts has to pass three tests
      You'd want to take it every day. It does the job in one step. There's
      nothing to mix or wash.

    BELIEVE
    5 How Sprout meets each test
      You'd want it: a pectin gummy you eat straight from the pack.
      One step: 6 g prebiotic fiber and 21 vitamins and minerals in the
      same pack, to support digestion and gut health.
      Nothing to mix: tear open one pack and eat the small handful inside.
      [Button: Start my first box]
    6 Tested for 70 pesticides and 4 heavy metals
      Third-party tested for 70 pesticides, 4 heavy metals, 16
      contaminants and 9 microbial contaminants. Vegan, pectin base.
      Not used: review 10 ("less bloated") and review 8 (names IBS). Both
      claim results the brand can't claim itself.
    7 Who it suits, and who should pick Low Sugar
      If your stomach is sensitive to sugar alcohols, choose Low Sugar.
      Sugar-Free uses them. What to expect, in a buyer's words: "I thought
      the first pack I tried tasted terrible, but after the third day
      they started tasting better" (retailer review)

    DECIDE
    8 $29.99 for your first box, then $49.99 every 4 weeks
      Subscribe, Low Sugar, 28 packs: $29.99 with our text sign-up
      discount, then $49.99 every 4 weeks. One-time, 28 packs: $66.65.
      Under the button: 30-day money-back guarantee, first order only.
      Ships within 24 hours, arrives in 3-5 days on average.

    (cut for length: sections 9 and 10, the subheads list and the image
    list. MISSING in the full run: grams of sugar per pack, and the ad's
    image)

tweaks:
  - what: The "why the usual fix fails" lines
    how: This is the spine of the page. The more exactly you say what goes wrong with the old fix, the sharper the tests in section 4 get. Leave it out and the skill asks once, then leaves that section as a marked gap.
  - what: The ad you paste
    how: Paste a different ad and the headline, first screen and first offer all change to match it. A page that doesn't keep its ad's promise loses people in the first screen.
  - what: Quotes
    how: Paste reviews about the page's problem. Each one goes beside the claim it backs. Quotes that claim results the brand can't claim are left out and listed.
  - what: Bought again or bought once
    how: Say which it is if it isn't obvious. A pan or a jacket gets materials, returns and warranty in place of ingredients and subscription terms.

judge:
  - The word "Advertisement" sits above the headline, and nothing looks like a newspaper.
  - The headline uses the ad's words and doesn't name your brand or product.
  - No button appears before section 5.
  - Every price, guarantee line and claim matches your facts word for word.
  - No quote, doctor, founder line or rating appears that you didn't supply.
  - Read only the subheads. They should tell the story.

test:
  - Run it from an ad that already brings you cold clicks. The headline should keep the ad's words, and the first screen should show what the ad showed.
  - Leave out the reason the usual fix fails. It should ask once, then leave that section as a marked MISSING gap, never a cause it made up.
  - Give it facts with one gap on purpose, such as no delivery time. The page should leave delivery out and list it under MISSING.
  - Give it a review that claims a health result. It should leave the review out and say why.
  - Ask someone who doesn't know your product to read only the subheads, then say what it does and who it isn't for.

improve:
  - Write your voice into step 5 of the skill file, with three lines from your best copy and the words you never use.
  - In step 7, delete the "bought once" or "bought again" branch that doesn't fit, and add your own pack sizes, pause rules or warranty terms.
  - Add your allowed and banned claims under "What you need", so the page never goes beyond what you can prove.
  - Save the cause and the tests from section 4 to your brand file. They rarely change, and other pages can use them.
  - Pair it with a skill that maps real customer doubts, so section 9 answers what buyers ask, and run a landing page check before it goes live.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI can write the ten sections. Give it every fact so the MISSING list stays honest."}
    - {name: "Hemingway Editor", why: "Marks hard sentences in yellow and red, so paragraphs stay short enough for phones."}
  inputs:
    - "Test results or an ingredient or materials sheet, so the proof section has facts to walk through"
    - "Real customer photos shared with permission, so image captions show real use"
    - "Questions buyers ask before buying, from chat or email, so the questions section uses their words"

terms:
  - term: Advertorial
    meaning: An ad written like an article. It must be clearly labelled as advertising.
  - term: Standfirst
    meaning: One or two sentences under the headline that say what the page will show.
  - term: Cold reader
    meaning: Someone who has never heard of your brand before seeing the ad.
  - term: Offer block
    meaning: The part of the page with the price, the buying options and the guarantee.
