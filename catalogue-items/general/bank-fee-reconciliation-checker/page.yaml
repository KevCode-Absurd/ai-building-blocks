new_slug: bank-fee-reconciliation-checker
name: Bank fee reconciliation checker
headline: Bank fee reconciliation checker
summary: Check one month of bank service charges against your agreement. See what you should have paid, the credit applied and the gap to the bill.
job: money-and-investing
thinking: high
thinking_why: "Prices, credits and the bill must tie line by line to the agreement, so each step needs checking against it."
subhead: Give it your bank agreement, the month's service counts and the bank's invoice. It rebuilds the charge from per-item prices and the fixed fee, applies your balance credit and compares the result with what you were billed.
explain: |-
  A bank bill puts item prices, a fixed account fee and a credit on your balances into one number. This bank fee checker rebuilds that number from your agreement line by line, so you can see which line is off.

  It multiplies each service count by its contracted price, adds the fixed fee, then takes off only the credit the agreement allows. The credit cannot go above the gross fees, and any unused credit is shown on its own. The gap is the bill minus the expected charge, so a positive gap means you were billed more.

  It changes nothing with the bank and does not say you are owed a refund. It gives you questions to take to the bank.
when:
  - The monthly bank bill looks higher than usual.
  - You want to confirm that the credit on your balances was applied.
  - The bank changed its prices and you want to see the effect on one month.
  - A reviewer asks for a bridge from the agreement to the bill.
you_give:
  - Your bank service agreement with the price list
  - The month's count for each service, such as wires or deposits
  - The fixed monthly account fee
  - The balance credit the agreement allows (optional)
  - The bank's invoice total for the same month
you_get:
  - The gross charge for each service line
  - The credit applied and any credit left unused
  - The expected charge and the gap to the bill
  - Questions to ask the bank about each gap
  - An editable workbook and a list of checks that did not run
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it in.
  - Attach the agreement and the invoice, and paste the counts for one month.
  - Ask the AI to show which price and which count each line used.
  - Check that every count and price use the same service unit and the same month.
  - Read MISSING before you contact the bank. Nothing is sent to the bank for you.
  - The bundled check script needs Node.js 20 or later. Without it, the AI does the sums in the chat.
how_it_works:
  - title: Lists your inputs
    text: Writes down the agreement price lines, the month's counts, the fixed fee and the bank's invoice, each with its date and currency. Any line without evidence is marked MISSING.
  - title: Prices each service
    text: Multiplies each service count by its contracted price. For example, 100 payments at 0.20 is 20. It checks that the count and the price use the same unit and the same month.
  - title: Adds the fixed fee and applies the credit
    text: Gross fees are the service lines plus the fixed fee. The allowed credit comes off, capped at the gross fees, and any unused credit is shown on its own line.
  - title: Compares with the bill
    text: The gap is the bank's invoice minus the expected charge. For each line that does not tie, it writes one question for the bank. It changes nothing with the bank.
output_shape: |-
  A service charge bridge and billing difference.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Billing month"
    how: "Take the billing month from the bank agreement and the month's service counts. Use one currency and scale on every line."
  - what: "Service counts"
    how: "Change the service counts and have your AI recalculate. Keep the actual figures you supplied."
judge:
  - Every material input has a source location, date, unit, sign and approval status.
  - Keep actual records, contractual inputs and scenarios separate; a missing value never becomes zero.
  - Counts and prices use matching service units and period; credit allowance is not an assumed interest rate.
  - Gross less applied credit equals expected net charge; signed difference remains billed minus expected.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one bank service charge you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define included credit into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
not_for:
  - "You want to match bank statement lines to your ledger: use Bank and ledger matcher."
  - "You want to check interest and fees on a revolving credit line: use Revolving loan interest and fee checker."
  - "You want group cash pool interest and bank charges checked: use Cash pool interest and fee checker."
output_sample:
  input:
    - Your bank service agreement and price list
    - The month's service counts
    - The fixed account fee and any balance credit
    - The bank's invoice total
  prerequisites:
    - An AI that can read files
  output:
    - name: Source map
      contains: The agreement terms, counts, currency and period used, each with its date.
    - name: Charge bridge
      contains: Gross charge by line, the fixed fee, the credit applied and the expected net charge.
    - name: Billing difference
      contains: Billed amount minus expected amount, with the sign shown.
    - name: Evidence questions
      contains: What to ask the bank for each line that does not tie.
    - name: Workbook
      contains: An editable file with your inputs, formulas and test cases.
    - name: MISSING lines
      contains: Each input you did not supply, left open and never replaced with zero.
    - name: CHECKS MISSED
      contains: The checks that could not run, or the word none.
