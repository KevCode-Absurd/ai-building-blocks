new_slug: bold-bet-downside-checker
name: "Bold bet downside checker"
summary: "Check a bold plan before you commit. Get the worst case in numbers, ways to cap the loss and a go, change or no verdict."
job: think-and-decide
thinking: medium
thinking_why: "It looks for the worst case and ways to cap it, and gives a verdict, using fixed questions."

headline: "Bold bet downside checker"
subhead: "Paste a bold plan and what you can afford to lose. It writes the worst case in numbers, lists ways to cap it, collects the view of people close to customers, sets a stop signal and gives a one-word verdict: go, change or no."

explain: |
  Bold plans are often judged on the upside alone. The excitement fills the space where the worst case should be. Then a plan that could have been tried small is tried all at once, and the loss hits the main business.

  This skill writes the bold move in one sentence and the worst case in plain numbers, and names what you cannot afford to lose. It lists ways to cap the loss, such as a smaller first version, a licence, a partner or a separate company. It asks what the people closest to customers think, sets a stop signal and a review date, and only then checks the gut feeling. The verdict is go, change or no, with one reason.

when:
  - "You are about to launch a new product line, enter a new market or sign a big contract."
  - "A partner wants you to commit a large sum quickly."
  - "You feel strongly about a plan and want a cold check before you act."
  - "Your team is excited about a big move and nobody has written down what it could cost."
not_for:
  - "The choice is small and easy to undo: use the Reversible decision sorter."
  - "You want the single outcome that could end the business, whatever its odds: use the Ruin risk stress tester."
  - "You want the strongest argument against your plan: use the Case-against writer."
  - "You are not sure the idea is wanted yet: use the Smallest test picker first."

you_give:
  - "The plan in a few lines"
  - "What you would spend, in money and time"
  - "What you cannot afford to lose"
  - "The people closest to customers and what they have said (optional)"
you_get:
  - "The bold move in one sentence"
  - "The worst case in numbers"
  - "Ways to cap it and which are doable"
  - "A stop signal, a review date and a one-word verdict"

how_to_use:
  - "Open the skill in your AI, or copy it and paste it into Claude, ChatGPT or Gemini. It needs no files or tools."
  - "Paste the plan, what it would cost in money and time, and what the business could not survive losing. Without a plan and a cost, it stops and asks."
  - "Add what the people closest to customers think, even if they are unsure."
  - "Read the worst case first. Check each figure against your own."
  - "Say your gut feeling out loud when it asks, after you have seen the numbers."
  - "If the verdict is change, pick a cap and run it again. Then use the Informed captain decision planner to name who decides."

how_it_works:
  - title: "Say the move in one sentence"
    text: "Writes the bold move in one sentence."
  - title: "Write the worst case in numbers"
    text: "Writes the worst case in plain numbers."
  - title: "List ways to cap the loss"
    text: "Lists ways to cap the downside and what each costs."
  - title: "Ask the people near customers"
    text: "Collects the view of people close to customers."
  - title: "Set the stop signal"
    text: "Sets a stop signal and a review date."
  - title: "Check the gut feeling last"
    text: "Checks the gut feeling last, after the numbers."
  - title: "Give the verdict"
    text: "Gives a go, change or no verdict with one reason."
  - title: "Check it"
    text: "Runs its own checks, fixes what it can and names any it missed."

output_shape: |
  THE MOVE
  <one sentence>

  WORST CASE
  - Money: <figure> | Time: <figure> | Other: <figure>
  Cannot afford to lose: <what>

  WAYS TO CAP IT
  - <cap> | Doable: <yes / no> | Costs in upside: <note>

  WHAT THE PEOPLE NEAR CUSTOMERS SAY
  - <person or role> | View: <view> | Would test: <what>

  STOP SIGNAL: <figure or event> | LOOK ON: <date>

  GUT CHECK
  <what was said, and how it compares>

  VERDICT: <go / change / no>
  Reason: <one sentence>

  MISSING
  <facts that would change the verdict>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "What you can afford to lose"
    how: "Be exact. A cap is judged against this figure."
  - what: "What you have already tried"
    how: "Add it. A past pilot makes the worst case smaller."
  - what: "The people you ask"
    how: "Name them. Their views carry more weight than an average."
  - what: "Time pressure"
    how: "Say if there is a deadline. It changes which caps are still possible."

judge:
  - "The worst case has a number."
  - "At least one cap is listed and doable."
  - "A stop signal and a review date are written."
  - "The verdict is one word with one reason."
  - "The people near customers were asked."

test:
  - "Run it on a past bet that went badly. See if the cap list would have saved you."
  - "Run it on a bet that went well and check it did not say no."
  - "Compare its worst case with your own estimate."

improve:
  - "Add your own limit for losses to the notes."
  - "Add structures you use, such as separate entities or pilots."
  - "Keep a list of bets and results."
  - "Pair it with Informed captain decision planner for who decides."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Planning, questioning and structuring are text work any strong chat AI does well with this skill."}
  inputs:
    - "The budget and cash position"
    - "Customer feedback on the idea"
    - "Past similar bets and results"
    - "Legal or contract terms"

terms:
  - {term: "Cap", meaning: "A limit that stops a loss from growing past what you can afford."}
  - {term: "Stop signal", meaning: "A figure or event, set in advance, at which you stop or change course."}

output_sample:
  input:
    - "Your plan in a few lines"
    - "What it would cost in money and time"
    - "What you cannot afford to lose"
    - "What the people closest to customers think (optional)"
  output:
    - name: "THE MOVE"
      contains: "Your bold plan in one sentence: what, by when and with what."
    - name: "WORST CASE"
      contains: "What you lose in money, time and other harm if it fails, and what you cannot afford to lose."
    - name: "WAYS TO CAP IT"
      contains: "Smaller first versions, partners or separate companies, each marked doable or not, with what it costs in upside."
    - name: "WHAT THE PEOPLE NEAR CUSTOMERS SAY"
      contains: "Each person's view, their reason and what they would test first."
    - name: "STOP SIGNAL and LOOK ON"
      contains: "The figure or event at which you stop, and the date you review progress."
    - name: "GUT CHECK"
      contains: "How you feel after seeing the numbers, compared with the worst case."
    - name: "VERDICT"
      contains: "One word, go, change or no, with one reason."
    - name: "MISSING and CHECKS MISSED"
      contains: "Facts you did not give, and any check the answer failed, or none."
