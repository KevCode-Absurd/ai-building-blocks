new_slug: bond-type-and-maturity-chooser
name: Bond type and maturity chooser
summary: Compare bond yields, taxes and price risk. Get clear sums, missing inputs and limits before choosing a bond category.
job: money-and-investing
thinking: medium
thinking_why: The sums are small. Care is needed to separate tax, credit and price risk and leave unsupported choices unresolved.
headline: Compare bond taxes and price risk with clear sums
subhead: Share comparable yields, your tax basis and verified duration or pricing inputs. It checks after-tax income, estimates rate sensitivity and reviews credit, call and deposit limits. Missing evidence leaves the choice unresolved. This is an educational comparison; it names no bond, fund or company.
explain: |
  A higher quoted yield can pay less after tax. A fixed-rate bond can also lose market value when yields rise. Credit risk is a separate issue: holding to maturity does not guarantee repayment.

  This skill compares categories using supplied evidence. It shows a simple tax break-even when the yields and tax basis support it. Rate-sensitivity estimates use modified duration or supported repricing, never maturity alone. Large rate shifts need fuller pricing assumptions. Credit quality, guarantees, tax rules, call terms and deposit protection need their own checks. Missing evidence stays unresolved.
when:
  - You have set a stock and bond split and now need to say what kind of bonds the bond part holds.
  - A bond pays more than the rest and you want to know what you give up for it.
  - You are comparing a tax-free bond with a taxable one.
you_give:
  - Your stock and bond split, and the amount in bonds
  - Comparable yields, jurisdiction and investor tax basis
  - The price fall you could accept and the rate change to test
  - Verified modified duration, or supported cash flows and pricing inputs
  - Issuer, guarantee, currency, call and deposit details where relevant
you_get:
  - A supported tax break-even and comparison, or an unresolved result
  - A duration-based price estimate with its limits, or missing pricing inputs
  - Credit-quality checks kept separate from yield and price risk
  - A deposit comparison with term, access and insurance limits
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your split, comparable yields, jurisdiction and tax basis.
  - Supply verified duration or pricing inputs for a rate-risk comparison. Mark missing facts.
  - Review unresolved inputs and the stated limits with a licensed adviser before using the comparison.
how_it_works:
  - title: Finds the tax break-even
    text: Checks comparable yields and tax treatment. For a positive taxable yield, shows the supported simple break-even; zero, negative or missing inputs need a different assessment.
  - title: Checks rate sensitivity
    text: Uses verified modified duration or supported repricing to test the stated price-swing limit. Maturity alone cannot supply duration.
  - title: Checks credit quality
    text: Uses the historical category order as a starting point, then checks the actual issuer, guarantee, currency, rating basis and jurisdiction. No category guarantees repayment.
  - title: Keeps weak bonds out
    text: Says why higher yield from weaker borrowers is the wrong trade for a plain plan.
  - title: Checks the call date
    text: Flags a bond that can be paid off early at less than you paid.
output_shape: |
  TAX COMPARISON
  Comparable yields <values or missing> | Jurisdiction and tax basis <evidence>
  Break-even <supported value or unresolved> | After-tax yields <values> | Choice <supported comparison or unresolved>

  RATE SENSITIVITY
  Price-swing limit <n>% | Yield change <x> percentage points
  Verified modified duration <value or missing> | Linear estimate <value with limits or unresolved>
  Full repricing needed <reason> | Length choice <supported category or unresolved>

  CREDIT CHECKS
  Issuer, guarantee, currency, seniority and dated rating <evidence or missing>
  Historical category order <starting point and limits, not a guarantee>

  KEEP OUT
  <categories outside the plain-plan method and reasons>

  DEPOSIT COMPARISON
  <term, currency, access, yield and insurance evidence or missing>

  CALL CHECK
  <terms and risk or missing>

  MISSING
  <list>

  CHECKS MISSED
  <one line per check still missed, or none>
tweaks:
  - what: A different change in rates
    how: Say how far rates could move in your view and it reruns the price-swing sums.
  - what: Several accounts
    how: Say which account holds the bonds. Tax-sheltered accounts change the tax sum.
  - what: Your own list of kinds
    how: Paste the kinds you are being offered and it ranks those.
judge:
  - The tax comparison checks positive comparable yields and the actual tax basis before showing a break-even.
  - Rate sensitivity uses verified duration or supported repricing; missing inputs leave the choice unresolved.
  - Credit quality, tax treatment and rate sensitivity stay separate; no category is called risk-free.
  - High-yield categories stay outside this plain-plan method with a reason.
  - No bond, fund or company is named.
test:
  - "Use comparable 6% taxable and 4.2% tax-free yields: the simplified break-even is 30%; at 12% tax, taxable leaves 5.28%."
  - Use zero or negative taxable yield. Do not divide by zero or reuse the positive-yield above/below rule.
  - Give maturity but no duration or pricing inputs. Leave the rate-risk choice unresolved.
  - "Use verified duration 4 and 18 with a 2-point yield rise: linear falls are about 8% and 36%, subject to pricing limits."
  - Use promised principal 100 and default recovery 40. Do not claim holding to maturity guarantees 100.
improve:
  - Rerun it when rates move a lot or your tax rate changes.
  - Keep a one-line note of each bond kind you hold and why.
  - Pair it with "Investing policy page writer" so the bond choice goes on your page.
works_best_with:
  tools:
    - name: Any good chat AI
      why: A few small sums and a ranked list are text work any strong chat AI does well with this skill.
    - name: A bank or broker rate page
      why: Current yields come from there, and the skill works better with real figures.
  inputs:
    - Comparable yields and the actual investor tax basis
    - Verified modified duration or supported pricing inputs
terms:
  - term: Maturity
    meaning: The date when principal is due under the bond terms. Payment still depends on the issuer meeting its obligations.
  - term: Tax-free bond
    meaning: A bond whose interest qualifies for a stated tax exemption. The rules depend on the instrument, jurisdiction and investor.
  - term: Call date
    meaning: A date from which the borrower may pay a bond off early, usually at a set price.
