new_slug: book-value-per-share-rollforward
name: Book value per share roll-forward
headline: Book value per share roll-forward
summary: Roll opening common equity to closing equity and get book value per share, with each movement tied to a source. Works from public filings.
job: money-and-investing
thinking: high
thinking_why: "Profit, dividends, buybacks and other income must roll opening equity to closing equity, and the share count must match the same owners."
subhead: Give it a company's opening equity, its profit and payouts for the year, and its share counts. It rolls opening equity to closing equity, divides by closing shares and shows what moved book value per share.
explain: |-
  Book value per share is the part of a company's accounts that belongs to its ordinary shareholders, divided by the number of shares. It moves when the company earns profit, pays dividends, issues shares or buys them back.

  This skill starts with opening equity and adds each movement, so you can see why the number changed and check the result against the balance sheet. Any gap is listed, never hidden. The practice figures are made up: 500 + 80 - 10 + 40 - 30 - 60 gives 520 million of closing equity. Divided by 52 million closing shares, that is 10 a share. Paying 52 million more in dividends would lower it to 9.

  Book value is an accounting figure. It is not the share's market price or what the business would sell for, so do not use it as a buy or sell signal.
when:
  - You want to know how a company's book value per share moved from one period to the next, and why.
  - You work from public filings and need each movement traced to a source.
  - A reviewer needs to trace the result back to inputs and assumptions.
  - You want equity and per-share book value rolled forward. To test whether profit covers a payout to shareholders, use the Shareholder distribution coverage checker instead.
not_for:
  - "You need earnings per share: use weighted average shares and a simple EPS calculation, because this item uses closing shares only."
  - "You have a private company or a tax or legal-basis question: ask an accountant for a full accounts or tax review."
  - "You want a market value or a buy or sell view: use a valuation model or ask a licensed adviser, because book value is only an accounting measure."
  - "You need weighted-average shares and basic EPS, not closing book value: use the Weighted-average share schedule instead."
you_give:
  - Opening common equity, ordinary profit, common dividends, issuance cash, repurchase cash, OCI and opening/closing share counts.
  - "The balance sheet date, plus the currency and scale used for the book value per share roll-forward."
  - "Your spreadsheet tool, if you want the book value per share roll-forward as a workbook."
you_get:
  - A common-equity movement table and book-value-per-share bridge.
  - "An editable workbook of the book value per share roll-forward, with its inputs, formulas and test cases to rerun."
  - "A tie-out of computed closing equity and the balance sheet, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the balance sheet, the equity statement and the share counts."
  - "Tell it what you need: closing common equity and book value per share, with each movement tied to a source."
  - "Ask it to stop and mark MISSING if the opening or closing share count is not in your sources."
  - "Check that closing shares, not weighted shares, set the book value per share, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Opening common equity, ordinary profit, common dividends, issuance cash and repurchase cash
    - Other comprehensive income (OCI) for the period
    - Opening and closing share counts
    - Reporting date, currency, scale and accounting basis
    - Your filings or statements as the source (optional but best)
  prerequisites:
    - An AI that can read your files and build a spreadsheet, to get the workbook
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Common-equity movement table
      contains: Opening equity plus profit, OCI and issuance, less dividends and repurchases, tied to closing equity.
    - name: Book-value-per-share bridge
      contains: Closing equity divided by closing shares, split into the equity effect and the share-count effect.
    - name: Scope and dated sources
      contains: The sources used, with their dates, currency and scale.
    - name: Inputs and assumptions
      contains: Each input and assumption, kept apart from reported facts.
    - name: Model calculations and reconciliations
      contains: The workings and each tie-out to the balance sheet, with no unexplained plug.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation and reopening the saved file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: Takes the right equity
    text: Uses parent common equity, not total equity with minority or preference interests. Profit and OCI must belong to the same owners.
  - title: Rolls the equity forward
    text: Opening equity plus profit, OCI and issuance cash, less dividends and repurchase cash. The result is compared with the balance sheet.
  - title: Divides by closing shares
    text: Book value per share is closing equity over closing ordinary shares. The equity effect and the share-count effect are shown apart.
output_shape: |-
  A common-equity movement table and book-value-per-share bridge.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Balance sheet date"
    how: "Take the balance sheet date from the balance sheet, the equity statement and the share counts. Use one currency and scale on every line."
  - what: "Share repurchases"
    how: "Change the share repurchases and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Closing shares are used for book value while weighted shares remain reserved for EPS.
judge:
  - Closing shares are used for book value while weighted shares remain reserved for EPS.
  - Opening equity plus all movements ties to closing equity without an unexplained plug.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one book value per share roll-forward you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define common equity into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
