new_slug: book-value-per-share-rollforward
name: Book value per share roll-forward
headline: Book value per share roll-forward
summary: Reconcile retained earnings, capital movements and closing shares to book value per share.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A common-equity movement table and book-value-per-share bridge. Share opening common equity, ordinary profit, common dividends, issuance cash, repurchase cash, OCI and opening/closing share counts.
explain: |-
  A common-equity movement table and book-value-per-share bridge.

  Public equity and share counts. Illustrative figures. 500+80-10+40-30-60 = $520 million closing equity. Dividing by 52 million closing shares gives $10. Raising dividends by $52 million lowers book value per share to $9.
when:
  - You need a common-equity movement table and book-value-per-share bridge.
  - You work on public equity and share counts and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Opening common equity, ordinary profit, common dividends, issuance cash, repurchase cash, OCI and opening/closing share counts.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A common-equity movement table and book-value-per-share bridge.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: 1. Extract parent common equity rather than total equity including minority or preference interests; reconcile profit and OCI attributable to the same owners
    text: Extract parent common equity rather than total equity including minority or preference interests; reconcile profit and OCI attributable to the same owners.
  - title: 2. Add ordinary profit, OCI and issuance proceeds, then deduct dividends and repurchase cash; compare computed closing equity with the balance sheet
    text: Add ordinary profit, OCI and issuance proceeds, then deduct dividends and repurchase cash; compare computed closing equity with the balance sheet.
  - title: 3. Divide by actual closing ordinary shares for book value per share; separate the equity numerator effect from the share-denominator effect
    text: Divide by actual closing ordinary shares for book value per share; separate the equity numerator effect from the share-denominator effect.
output_shape: |-
  A common-equity movement table and book-value-per-share bridge.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Closing shares are used for book value while weighted shares remain reserved for EPS.
judge:
  - Closing shares are used for book value while weighted shares remain reserved for EPS.
  - Opening equity plus all movements ties to closing equity without an unexplained plug.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
