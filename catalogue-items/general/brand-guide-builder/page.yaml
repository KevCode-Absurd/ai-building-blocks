new_slug: brand-guide-builder
name: "Brand guide builder"
summary: "Attach your brand file. Get a printable brand guide, a values file and a score out of 100."
job: brand-file

headline: "Brand guide builder"
subhead: Attach your brand file, plus logo rules and site styles if you have them. It builds a printable guide with a one-page quick sheet and only readable colour pairs. You get the guide, a copy-paste values file and a score out of 100 against its checks.

explain: |
  When a new designer, editor or freelancer starts, they need your colours, fonts, voice and photo rules. Usually they get a logo file and a vague "keep it clean". Then the work comes back in the wrong green, with a stock photo, yellow text nobody can read and a tagline you'd never say.

  This skill turns your brand file into two files. The first is a printable HTML guide in your own colours and fonts. Page 2 is a quick sheet a stranger can work from alone. The pages after it give the reason behind each rule, then the values, then do and don't examples from your real copy. It checks every text colour against every background it sits on, so the guide only shows pairs people can read. The second file holds every value to paste into a design or image tool. Pages with nothing to show are left out, and every blank is listed with the question that would fill it.

when:
  - A designer, freelancer or agency is starting work with you and needs your rules in one place.
  - Your brand rules live across a few files and nobody can find the hex codes.
  - You want a sheet you can paste into an AI image or design tool so it stays on brand.

you_give:
  - Your brand file, mainly voice-and-look.md and proof-and-claims.md
  - Your logo file and its rules, such as clear space and smallest size (optional)
  - Your site's styles, such as colour variables, spacing, corner radius and buttons, for web work (optional)
you_get:
  - A printable HTML guide of up to eight A4 pages, in your own colours and fonts, with a quick sheet on page 2
  - A contrast table showing which text colours can sit on which backgrounds
  - A tokens file with every colour, font and rule, plus CSS variables and a design tokens block
  - A two-line note on what was left out and which colour pairs fail for text
  - A score out of 100 for the share of its seven checks the guide passes, with each one missed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. A tool that can write and preview files works best.
  - Attach your brand file. Colours and fonts are the minimum; without both it stops and asks you to finish the brand file first.
  - Add your logo rules and, for web work, your site's colour variables and button styles.
  - Open the HTML file in a browser and print to PDF with margins set to none.
  - Check "Not yet captured" on the quick sheet and fill those gaps in your brand file.

how_it_works:
  - title: Checks the minimum
    text: Needs colours with hex codes and at least one font. Any other topic with nothing on file is left out and listed as a gap.
  - title: Writes the reasons
    text: One or two sentences per topic from your brand file, such as each colour's job and which font is for headings.
  - title: Checks colour pairs
    text: Works out the contrast of each text colour on each background. Normal text needs 4.5 to 1 and large text 3 to 1, the web's accessibility levels.
  - title: Puts the quick sheet first
    text: Page 2 holds the colours, readable pairs, fonts, the voice in five words, one copy rule, one picture rule and the gaps.
  - title: Builds the topic pages
    text: Colour, type, logo, voice, pictures and web parts, each on its own A4 page, skipping topics with nothing on file.
  - title: Builds the tokens file
    text: Every value to copy, CSS variables, and the same colours and sizes in the standard design tokens format.

output_shape: |
  brand-guide.html  (A4, one topic per page)
    1 Cover: <name>, Brand guide, <one line>, <date>
    2 Quick sheet: <chips: name, hex, job> . Readable pairs: <text on
      background> . Fonts: <font: job> . Voice: <5 words> . Copy rule .
      Picture rule . Not yet captured: <gap>: <question>
    3 Colour: <why> . <swatch: name, hex, job> . contrast table
    4 Type: <why> . <font> set in <your own line> . size scale
    5 Logo (only with rules on file)
    6 Voice: <traits as this, not that> . tone by situation . claims
      you may and may not say
    7 Pictures: <style, people, light, do and don't>
    8 Web parts (only with site styles)

  brand-tokens.md
    <colour>  <hex>  <job>
    Text pairs: <text> on <background> <ratio> <pass or never for text>
    :root { --<name>: <hex>; ... }
    Fonts and sizes . Voice rule . Picture rule
    { "color": { "<name>": { "$type": "color", "$value": "<hex>" } } }

  NOTE  Left out: <page>, because <missing what>. Fails for text: <pair>

  SCORE  <passed> / 7 checks x 100 = <score>   Missed: <one line each>

example:
  business: sprout
  input: |
    [the skill]

    Brand file: the Sprout folder. voice-and-look.md has colours with
    hex and job, fonts, voice traits and real lines, image style and
    the "show it right" pack rules. proof-and-claims.md has the claims
    list.

    No logo rules and no site code. This guide is for a freelance
    designer making social posts.
  output: |
    brand-guide.html  (6 A4 pages; Logo and Web parts left out)

    1 COVER
    Sprout . Brand guide . Daily nutrition, like, ridiculously easy

    2 QUICK SHEET
    Colours: Forest green #00582D pouch, accents . Deep forest #002C17
    headings . Cream #FFF7DF backgrounds . Kelly green #007E40 buttons .
    Sunflower #FFCC2E stars, badges . Plum #581E5A top banner
    Readable text pairs: deep forest on cream 14.3 . white on kelly
    green 5.2 . deep forest on sunflower 10.1 . white on plum 12.0
    Never for text: sunflower on cream (1.4)
    Fonts: Work Sans bold speaks, Work Sans medium explains, DM Mono labels
    Voice: playful, cheeky, short, numbers first
    Copy rule: say "supports", never "fix"
    Picture rule: bright and sunny; the daily pack torn straight across the top
    Not yet captured:
    - Logo: clear space, smallest size, uses to avoid? (ask the founder)
    - Display font for big statement lines: its name and file?

    3 COLOUR
    Why: green like the greens inside, warm like a snack, never clinical.
    Cream carries the page; one green does the selling.
    [six swatches with name, hex and job, as on the quick sheet]
    Contrast: sunflower is for stars and badge shapes only. Text on a
    sunflower badge is deep forest.
    Backgrounds: cream, then a deep forest band, then cream again.

    4 TYPE
    Sample (Work Sans bold): "Tastes like a treat, works like a supplement."
    Sample (DM Mono, uppercase): 21 VITAMINS & MINERALS . 6G FIBER

    6 VOICE
    A funny friend, not a lab coat: "Rip. Tip. Enjoy."
    Plain claims, not big promises: "Supports digestion and gut health",
      not "Fix the Hot Girl Tummy"
    May say: "Supports digestion and gut health" (approved)
    May not say: "revive whole body vitality" (no support on file)

    7 PICTURES
    Bright, sunny, candy-like. Pouch on a soft two-colour gradient,
    gummies in front, everyday adults pouring gummies into a hand.
    Do: tear the daily pack straight across the top.
    Don't: tear it at the side, bottom or corner; show tie-in cartoon
    characters or partner marks; go clinical or muted.

    brand-tokens.md (excerpt)
    Kelly green  #007E40  buttons . white text on it: 5.2, pass
    Sunflower    #FFCC2E  stars, badges . never as text on cream (1.4)
    :root { --forest:#00582D; --deep:#002C17; --cream:#FFF7DF;
            --button:#007E40; --sun:#FFCC2E; --plum:#581E5A; }
    { "color": { "button": { "$type": "color", "$value": "#007E40" } } }

    NOTE
    Left out: Logo (no rules on file) and Web parts (not a web build).
    Fails for text: sunflower on cream.

tweaks:
  - what: Web build or not
    how: Add your site's colour variables, spacing and button styles and you get a web parts page with real rendered buttons and cards. Leave them out for a print and social guide.
  - what: Logo rules
    how: Paste clear space, smallest size and uses to avoid, and a logo page is added. Without them, the logo is listed as not yet captured, never invented.
  - what: Real lines for voice
    how: Make sure voice-and-look.md has lines you really use. The voice page's examples come only from those.
  - what: Online store add-on
    how: For physical products it adds a page on how each product must look on camera and a page on your brand's places, light and sound.

judge:
  - The guide uses your colours and fonts, not a generic grey and blue.
  - Page 2 alone is enough to make one on-brand post.
  - Every text colour shown on a background passes its contrast level, and failing pairs are named.
  - Voice examples are real lines from your copy, not invented ones.
  - It prints one topic per page with nothing cut off.
  - Every blank in your brand file appears under "Not yet captured".

test:
  - Give only page 2 to someone who has never worked with you and ask for one social post. Every question they ask points to a gap on the quick sheet.
  - Print it to PDF with margins set to none. Each topic should fill its own page, with nothing cut off.
  - Check two of the contrast numbers in a free contrast checker. They should match to one decimal place.
  - Search your site for two of the voice examples. They should be lines you've used.

improve:
  - Add your logo rules to your brand file before you run it. They're the most common gap on the quick sheet.
  - Add a page to the list in step 4 if you need one, such as packaging or post templates, and say what goes on it.
  - Change the paper size in step 4 if you don't print on A4, for example to Letter in the US.
  - Paste brand-tokens.md at the top of every design or image request, so each tool starts from your real values.
  - Pair it with the skill that builds a brand file from your website, and the founder call that fills the gaps the quick sheet lists.

works_best_with:
  tools:
    - {name: "Claude", why: "Writes the whole guide as one HTML file and shows a live preview, so you can check the pages before printing."}
    - {name: "Google Chrome", why: "Its Print to PDF follows the A4 page size and page breaks the guide sets."}
  inputs:
    - "Your logo files and their rules, so the guide gets a logo page and no gap on the quick sheet"
    - "Your site's CSS file or theme settings, so the hex codes and fonts match the live site exactly"
    - "Five of your own best photos, so the pictures page shows your real style"
    - "Three ads or posts you're proud of, so the voice examples are your best lines"

terms:
  - term: Hex code
    meaning: The six-character code for a colour on screens, such as #1A2B3C.
  - term: Contrast ratio
    meaning: How much a text colour stands out from its background. The web's accessibility rules ask for at least 4.5 to 1 for normal text.
  - term: Tokens
    meaning: The named values a design uses (colours, font sizes, spacing), written so they can be copied straight into code or a design tool.
  - term: CSS variables
    meaning: Named colour and size settings in web code, so a whole site can change colour by editing one line.
