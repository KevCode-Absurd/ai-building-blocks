new_slug: buyer-brief-writer
name: "Buyer brief writer"
summary: "Paste your offer and some reviews. Get a half-page buyer brief and the one force your copy must move."
job: understand-customers

headline: "Buyer brief writer"
subhead: Paste your offer and real buyer evidence, such as reviews, support emails or survey answers. It sorts their words into what pushes, pulls, worries and holds them back. You get a half-page brief, the one force your copy must work on, and any check it missed.

explain: |
  Most copy misses because it's aimed at a label ("busy mums 30 to 45") or at everything at once. It describes the problem to people who already feel it, and skips the worry that's really stopping them.

  This skill reads your buyer evidence the way switching research does. Buyers move when the push of the problem and the pull of something better outweigh their fear of the new and the comfort of habit. It quotes your buyers for each of those four forces, places them on Eugene Schwartz's five levels of awareness, and judges how much the market has already heard. Then it picks the one force your copy must move, and ends with a one-line job statement the writer works from.

when:
  - You're about to write an ad, a page, an email or a script and want to aim it first.
  - You have a pile of reviews and want to know what they say about why people buy.
  - Your copy explains the problem well, but people still don't buy.

you_give:
  - Your offer in a few lines, what you sell, the price and the terms
  - Buyer evidence, such as reviews, support messages, survey answers, call notes or cancellation reasons
  - Where the copy will run (optional)
  - Your brand file, with voice, offers, approved claims and what competitors promise (optional)
you_get:
  - A job line that says when they look, what they want, and what stops them
  - How aware the buyer is, and how much the market has already heard, with the evidence
  - The four forces in your buyers' own words, and the one your copy must work on
  - A bank of buyer phrases to borrow, and a list of gaps to ask customers about
  - Any of its own checks the brief still misses, each named

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your offer in three or four lines.
  - Paste the buyer evidence as written. Include unhappy reviews and cancellation reasons; they hold the fears.
  - Add what competitors promise, if you know, so it can judge what the market has heard.
  - Read the gaps list. Each one is a question worth asking your customers.

how_it_works:
  - title: Finds the moment
    text: Quotes what happened right before buyers started looking, as a situation, never a label.
  - title: Sorts four forces
    text: Push, pull, fear of switching and habit, each with your buyers' own words, or marked as a gap.
  - title: Places awareness
    text: Puts the buyer on Schwartz's five levels, from unaware to most aware, and names the evidence.
  - title: Judges what they've heard
    text: Decides whether your promise is new, common, or so common the copy must show how it works.
  - title: Picks one force
    text: Chooses the force your copy must move. Loud fear means proof and risk removal; weak push means making the problem felt.
  - title: Writes the job line
    text: When this happens, I want this, so I can do this. What stops me is this.
  - title: Checks the brief
    text: Goes through its own checks, such as exact quotes and one force only, fixes what it can, and names any check it still missed.

output_shape: |
  JOB LINE
  When <the moment>, I want to <the progress>, so I can <what it gives
  them>. What stops me: "<fear or habit, in their words>".

  AWARENESS
  <one of five levels>, because <evidence>

  WHAT THE MARKET HAS HEARD
  Stage <1 to 5>, because <evidence>

  FOUR FORCES
  Push:   "<quote>"
  Pull:   "<quote>"
  Fear:   "<quote>"
  Habit:  "<quote>" or MISSING

  WORK ON
  <the one force>, which means the copy <what to spend words on>

  WORD BANK
  "<phrase>" / "<phrase>" / ...

  GAPS
  <each as a question to ask customers>

  CHECKS MISSED
  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Offer: Sprout greens gummies, 28 daily packs. First box $29.99 with
    a text sign-up discount, then $49.99 every 4 weeks. One-time $66.65.

    Buyer evidence (reviews):
    1. "I've tried a few green powders over the years. The issue has
    never been nutritive content. It's always been an issue of
    consistency like many things. [Sprout] has been the one thing I've
    been able to stick to."
    2. "It's wild I WANT to take [Sprout] and don't forget."
    3. "I was taking [a big-name greens powder] but even with their
    monthly subscription discount it was still $94 a month and the
    drink was definitely gritty/chalky."
    4. "I've been choking on [a big-name greens powder] for the last
    few years"
    5. "I also stopped buying separate probiotic gummies, b12 gummies,
    and multivitamin gummies. I just take these now and it's easier
    for me to manage."
    6. "not having to clean a shaker bottle or extra dishes for greens
    stuff in powder form, is absolutely excellent!"
    7. "They are expensive"

    Where it runs: a Facebook ad
  output: |
    JOB LINE
    When I've paid for greens again and stopped taking them, I want one
    I keep taking, so I can stop managing a shelf of bottles. What stops
    me: "They are expensive".

    AWARENESS
    Solution aware. They know greens supplements and have tried them
    (reviews 1, 3, 4).

    WHAT THE MARKET HAS HEARD
    Stage 3. Review 1 says "The issue has never been nutritive content",
    so the nutrients promise is old news. The copy must show how this
    one gets taken every day.

    FOUR FORCES
    Push:   "the drink was definitely gritty/chalky" / "choking on"
    Pull:   "the one thing I've been able to stick to" / "I WANT to take
            [Sprout] and don't forget"
    Fear:   "They are expensive"
    Habit:  MISSING. Every review is from someone who already switched.

    WORK ON
    Fear. The push and pull are loud in these reviews, so the copy
    shouldn't spend its words on the problem. It should put the real
    price per day beside the first-order guarantee and its limit.

    WORD BANK
    "stick to" / "gritty/chalky" / "choking on" / "clean a shaker
    bottle" / "easier for me to manage" / "I WANT to take"

    GAPS
    - What do people who haven't bought yet use now, and why do they stay?
    - Is the price worry about the first box or the renewal?
    - Does "can a gummy hold enough?" worry them? The brand file says so,
      but none of these reviews do.

tweaks:
  - what: The evidence you paste
    how: Reviews come from people who already switched, so they show push and pull. Cancellation reasons and support messages show fear and habit. Paste both for all four forces.
  - what: Which buyer
    how: If your evidence mixes different kinds of buyer, add "focus on buyers who mention X" to get one clear brief instead of a blend.
  - what: Competitor promises
    how: Paste what three competitors promise. It makes the market stage a judgement from evidence instead of a guess.
  - what: No evidence at all
    how: It will mark the awareness level as assumed and give you three questions to ask customers. Ask them before writing.

judge:
  - Every quote appears word for word in the evidence you pasted. Search for two of them.
  - There's exactly one force to work on, with a reason.
  - Forces with no evidence are marked as gaps, not filled with guesses.
  - The job line describes a moment, not an age group or a job title.
  - The market stage names the evidence it rests on.

test:
  - Run it on reviews from a buyer group you know well. If the job line describes someone you don't recognise, check which reviews it leaned on.
  - Run it twice on the same evidence. The awareness level and the force to work on should match.
  - Add a batch of cancellation reasons and run it again. The fear and habit lines should fill in.
  - Give the brief to a writer and compare their draft with one written without it. The aimed draft should spend its words on the chosen force.

improve:
  - Add the buyer groups from your brand file to "What you need" in the skill file, so step 3 places each group the same way every run.
  - Write what your main competitors promise into step 4, so the market stage is judged the same way every time.
  - Save each brief to your brand file, one per buyer group, and update it when new reviews come in.
  - Pair it with "Sales copy opening writer" or "Ad first line writer and scorer", which both start from this brief.

works_best_with:
  tools:
    - {name: "Claude", why: "Every current Claude model reads up to 1 million tokens, so a big pile of reviews and tickets fits in one chat."}
    - {name: "Gemini", why: "Also takes long inputs, and works inside Google Sheets if your survey answers live there."}
  inputs:
    - "Cancellation reasons or refund notes, so the fear and habit forces have quotes"
    - "Answers to 'what nearly stopped you buying?' from a short survey after purchase, so fears come from real words"
    - "Competitor ads from the Meta Ad Library, so the market stage rests on what others promise"

terms:
  - term: Buyer evidence
    meaning: Anything your buyers wrote or said in their own words, such as reviews, emails or survey answers.
  - term: Four forces
    meaning: Push (what's wrong now), pull (what's better), fear (of switching) and habit (the comfort of the old way).
  - term: Awareness level
    meaning: How much the buyer knows, from not knowing they have the problem to knowing your product and only needing the deal.
  - term: Job line
    meaning: One sentence that says when the buyer looks, what they want, and what stops them.
