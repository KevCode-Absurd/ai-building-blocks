new_slug: buyer-problem-list-builder
name: Buyer problem list builder
summary: "Build a buyer problem list: map the doubts a buyer has from start to result, with quotes and guesses kept apart. Get candidate offer outcomes."
job: make-offer
thinking: medium
thinking_why: It has to think of many problems a buyer has, but the method is fixed and every line can be checked against buyer words.
headline: Buyer problem list builder
subhead: Share the buyer’s goal, product facts and real feedback. It maps stages and doubts about results, effort, time and whether the change will work. Get a problem table and candidate offer outcomes. Quotes and guesses stay marked. Each outcome needs its own capability and proof check before use; a buyer worry does not prove your product can deliver it.
explain: |
  A buyer may face several doubts while moving from a starting situation to a desired result. Your evidence may show some of them; others are ideas to test. A longer list is not proof that every buyer has those worries.

  This skill maps stages and asks about the result, the chance of success, effort and time. It separates quotes from guesses and proposes candidate How-to outcomes. Problem evidence and product capability are different checks. A worry about time cannot establish a faster result or no-learning promise. Keep unsupported outcomes as internal ideas, with the proof or product work needed before use.
when:
  - You are building a new offer and only know a few of the buyer's problems.
  - Buyers say "I need to think about it" and you cannot say what they are thinking about.
  - Your offer sells the thing you make, not the result the buyer wants.
not_for:
  - "You have not described your buyer yet: write a short buyer note first, or ask a few real customers what they wanted."
  - "You need prices, channels or ad copy: those need a separate step, because this list only maps problems and ideas for outcomes."
  - "You want proof your product can deliver a result: check that with your own product facts and tests, as buyer worries do not prove it."
you_give:
  - "Your buyer: a persona, or a plain description"
  - Product facts, actual capabilities, limits and claim evidence if available; missing proof blocks claim approval
  - Reviews, call notes or survey answers in the buyer's words (optional)
  - Your org context (optional)
you_get:
  - The result written as a place the buyer arrives
  - Stages from today to that place, in order
  - Possible problems grouped by outcome, likelihood, effort and time, with the actual count shown
  - Candidate How-to outcomes, with separate problem evidence and capability/claim status
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your buyer description and what you sell. Add reviews or call notes if you have them.
  - Read the stage list and fix any stage that is out of order or missing.
  - Review each problem with real buyers. Check every candidate outcome against product capability and proof before carrying approved ideas into delivery planning.
output_sample:
  input:
    - Your buyer, as a persona or a plain description
    - Your product facts, limits and any proof of claims
    - Reviews, call notes or survey answers in the buyer's words (optional)
    - Your org context files (optional)
  output:
    - name: Desired result
      contains: The place the buyer wants to arrive, written without your product name, in their words where you gave any.
    - name: Stages
      contains: Five to ten steps the buyer takes from today to the result, including the step before and after.
    - name: Problems and candidate outcomes
      contains: A table of stage, problem, driver, quote or GUESS, candidate How-to outcome, and capability status.
    - name: Count
      contains: "The number of problems split by driver: outcome, likelihood, effort and time."
    - name: Unapproved outcomes
      contains: Speed, ease, guarantee or result ideas that lack proof and must not be published.
    - name: Missing and checks missed
      contains: Gaps marked MISSING, and any check that failed, or none.
how_it_works:
  - title: Names the place they arrive
    text: Drafts the desired result without a product noun. Supplied buyer words stay distinct from inferred wording.
  - title: Lists the stages
    text: Puts what the buyer must do in order, including the step just before they find you and the one right after the result.
  - title: Asks four questions per stage
    text: Worth it, will it work for me, is it hard or confusing, will it take too long.
  - title: Uses buyer words first
    text: Quotes reviews and notes. Where there are none, the line is marked as a guess.
  - title: Proposes outcomes and checks proof
    text: Drafts candidate How-to outcomes, then separates problem evidence from product capability. Unsupported speed, ease or results stay unapproved.
output_shape: |
  DESIRED RESULT
  <supplied buyer words or labelled proposed wording>

  STAGES
  <starting situation to desired result and next need>

  PROBLEMS AND CANDIDATE OUTCOMES
  Stage | Problem | Driver | Problem evidence: exact quote or GUESS | Candidate How-to outcome | Capability/claim status | Proof or product work needed
  Status: supported | needs evidence | outside current capability | for confirmation

  COUNT
  <actual ideas by driver; not a claim all buyers share them>

  UNAPPROVED OUTCOMES
  <unsupported duration, ease, guarantee or result; do not publish>

  MISSING / CHECKS MISSED
  <list or none>
tweaks:
  - what: How far the stages go
    how: Choose how far the journey goes. Include a next need when useful; do not add unsupported problems just to make the list longer.
  - what: Buyer words
    how: Paste real quotes. Keep exact quoted evidence separate from guesses, and check product capability independently for each proposed outcome.
  - what: One buyer or several
    how: Run it once per buyer type. A first-time buyer and a repeat buyer have different problems.
judge:
  - The desired result has no product noun; exact buyer words and proposed wording are distinguished.
  - Each stage has at least one problem under every one of the four drivers.
  - Every problem is written from the buyer's side, not as a feature you lack.
  - Each candidate names a useful proposed result and has a separate capability/claim check before approval.
  - Problem quotes and guesses remain distinct; even a real quote does not prove an outcome the product can deliver.
test:
  - Give a buyer worry about setup taking a weekend, with no timing evidence. Do not turn it into an under-one-hour or no-learning promise.
  - Supply a guessed problem. Keep GUESS on that problem and mark the candidate outcome as needing its own proof.
  - Supply actual product evidence with scope and limits. Approve only the supported claim, preserving those limits.
  - Show proposed problems to a real buyer and record what they confirm; do not report this check as completed before it runs.
improve:
  - Add the new problems that real buyers raise in sales calls.
  - Keep the list and rerun it each time the product changes.
  - Mark the problems that came up most in reviews so later steps keep them.
works_best_with:
  tools:
    - name: Any good chat AI
      why: This is text and number work that any strong chat AI does well with the skill.
  inputs:
    - A persona from Best customer finder or your own notes
    - Reviews or call notes in the buyer's words
    - Your product facts
terms:
  - term: Value drivers
    meaning: "The four things that decide how much a buyer values an offer: the outcome, how likely it is, how long it takes and how much effort it costs."
  - term: Promise
    meaning: Here, a candidate How-to outcome for offer design. It becomes usable only after its product capability, evidence, scope and limits are checked.
