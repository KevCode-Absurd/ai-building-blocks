new_slug: buying-habit-stack-designer
name: "Buying habit stack designer"
summary: "Design a repeat purchase habit: get the cue, real rewards, true brand ties, rival gaps and a chain that makes buyers reach for you again."
job: plan-strategy
thinking: high
thinking_why: "It must judge which forces are real for your product and how they feed each other. That calls for careful, joined-up reasoning."

headline: "Buying habit stack designer"
subhead: "Tell it what you sell, who buys it and the buying you want repeated. It names the one action and its cue, grades each reward, finds where a rival could become the habit and links it all in a chain. An honesty check then removes any false proof."

explain: |
  Some products get bought again with no fresh decision. The buyer just reaches for them. A repeat purchase habit like that is worth more than one clever ad, because it repeats on its own.

  Habits come from a short list of forces: a cue that sets them off, a reward each time, pleasant ties to the brand, being easy to find wherever a rival could be, and seeing other people use it. One force alone is thin. This skill grades each one as strong, weak or none, then links them so each helps the next. If few rewards are strong, it tells you to fix the product first.

  Unlike a plain "customer loyalty" plan, it hunts for the places where a rival could become the habit because you are absent. It ends with an honesty check that removes ties or proof built on a false claim. The method follows Charlie Munger's account of how consumer brands build habits.

when:
  - You want customers to buy again without comparing options each time.
  - Your plan has an ad idea but no reason anyone would buy twice.
  - You sell something used often, such as coffee, razors or a monthly app, and a rival wins the moment of choice.
  - You must choose where to spend so your product feels like the obvious pick in one moment, such as the mid-afternoon dip.

not_for:
  - "The purchase is rare, such as a mattress or a wedding dress. There is no repeat to build. Use the Brand reach audit to see where buyers can't think of you or can't buy."
  - "You don't yet know if anyone wants the product. Test the idea first with the Smallest test picker."
  - "You need one word or name to own in your market. Use the Ownable word picker."

you_give:
  - "What you sell, who buys it, the price and where it is sold. Paste your plan or a few lines."
  - The one action you want repeated, such as "reorder on the first of the month" (optional)
  - When and where buyers buy now, and which rivals they use (optional)
  - Your budget, if you want the reach map sized to it (optional)

you_get:
  - The one action to repeat and the cue that sets it off
  - A rewards table with each reward marked strong, weak or none
  - Up to five true ties the brand can earn, and how each is made
  - A reach map, a visibility plan and a chain showing how the forces feed each other

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini. If you added it, call it by name. If not, copy it and paste it in.
  - Paste what you sell, who buys it, the price and where it is sold. Add the one action you want repeated.
  - Add what you know about when and where buyers reach for this now, and who the rivals are. It needs no files or web access.
  - Read the rewards table first. If few are strong, fix the product before you build on it.
  - Check each tie and each piece of proof. Cut any you could not say out loud to a customer.
  - Take the plan to the Failure-first plan check, then test the cue with a few real buyers.

how_it_works:
  - title: Names the response and the cue
    text: One action to repeat and what triggers it, such as a time, a place or a feeling. With no cue given, it proposes two or three to test.
  - title: Checks the rewards
    text: Usefulness, sensory pleasure, lift or calm, and fit for the moment, each marked strong, weak or none.
  - title: Lists true ties
    text: Up to five pleasant links the brand can earn honestly, and how each is made. Any tie that needs a false claim is dropped.
  - title: Maps your reach
    text: Lists every place a buyer might reach for something, and finds where a rival could become the habit because you are not there.
  - title: Plans what others can see
    text: Picks places where use can be visible, and marks any fake proof for removal.
  - title: Links the forces into a chain
    text: Shows how each force helps the next, and counts the links. It only counts forces it could fill in.
  - title: Runs an honesty and envy check
    text: Removes false beliefs and hidden costs, and asks how to deserve the success.
  - title: Checks itself
    text: Runs its own checks and names any it missed.

output_shape: |
  RESPONSE AND CUE
  <action>, triggered by <cue>

  REWARDS
  Usefulness: <what> [STRONG/WEAK/NONE]
  Sensory: ...  Lift or calm: ...  Fit for the moment: ...

  TRUE TIES (up to five)
  1. <tie>: made by <how>

  REACH MAP
  <place> | covered <yes/part/no> | rival could form a habit if <gap>

  WHAT OTHERS CAN SEE
  <places and what shows>

  THE CHAIN
  <force> -> <force> -> <force> ... (<n> links)

  HONESTY AND FAIRNESS
  <removed items; how success will be deserved>

  MISSING
  <what would firm up the design>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - What you sell, who buys it, the price and where it is sold
    - The one action you want repeated (optional)
    - When and where buyers buy now, and which rivals they use (optional)
  output:
    - name: Response and cue
      contains: The one action to repeat and the time, place or feeling that sets it off.
    - name: Rewards table
      contains: Usefulness, sensory pleasure, lift or calm, and fit for the moment, each marked strong, weak or none.
    - name: True ties
      contains: Up to five pleasant links the brand can earn honestly, each with how it is made.
    - name: Reach map
      contains: Every place a buyer might reach for something, how well you cover it and where a rival could win.
    - name: What others can see
      contains: Places where buying or using shows, and what shows there. Fake proof is marked for removal.
    - name: The chain
      contains: How each force feeds the next, with a count of the links.
    - name: Honesty and fairness check
      contains: What was removed for false claims or hidden costs, and how to deserve the success.
    - name: Missing and checks missed
      contains: Facts that would firm up the design, plus any check the skill could not pass.

tweaks:
  - what: The cue
    how: Name a real trigger buyers already have, such as a mid-afternoon dip.
  - what: The places
    how: List every place a buyer might reach for something in that moment. The gaps show where a rival can win.
  - what: The ties
    how: Offer only ties you can back up. They must fit the product.
  - what: Your budget
    how: Say how much you can spend. It changes which places you can cover first.

judge:
  - The response is one action with a cue.
  - Every reward is real.
  - No tie or proof depends on a false claim.
  - The reach map names a gap.
  - At least four forces are linked.

test:
  - Give it a product with strong sensory pleasure. The rewards table should show it.
  - Give it a product with no reward beyond price. It should tell you to fix the product first.
  - Give it a plan that depends on fake reviews. They should be removed.
  - Run it twice. The cue and the chain should hold.

improve:
  - Add buyer research on when and where they reach for products like yours.
  - Re-check the chain every quarter, since gaps in reach change.
  - Add a line for how each force will be measured.
  - Pair it with the "Incentive checker" if you depend on partners for reach.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Linking forces and checking claims is text work any strong chat AI does well."}
    - {name: "A map or list of selling places", why: "Helps you fill in the reach map with real places."}
  inputs:
    - "The plan from the Target size back-solver"
    - "Customer research on when and where they buy"
    - "A list of your rivals and where they sell"

terms:
  - term: Cue
    meaning: The time, place, feeling or sight that sets off the habit.
  - term: Tie
    meaning: A pleasant link between the brand and something people like, earned honestly.
  - term: Force
    meaning: One thing that builds a habit, such as a reward, a tie, reach or what others can see.
  - term: Stack
    meaning: Many forces used together so that each one helps the next.
