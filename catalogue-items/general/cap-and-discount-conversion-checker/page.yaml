new_slug: cap-and-discount-conversion-checker
name: Cap and discount conversion checker
headline: Cap and discount conversion checker
summary: Check which conversion price applies, the cap or the discount, and see how many shares a lower-of note converts into versus round pricing.
job: money-and-investing
thinking: high
thinking_why: "The cap price and the discount price come from different definitions, so each must be built from the signed terms before the lower one is chosen."
subhead: Selected price, conversion shares and extra shares versus round pricing. Share signed instrument explicitly granting lower-of pricing, approved cap conversion price, round price, discount and converting balance.
explain: |-
  Selected price, conversion shares and extra shares versus round pricing.

  Venture financing. Illustrative figures only, in USD thousands. A note converts a balance of 120 in a round priced at 4 per share, with a 25% discount. The discounted price is 3. If the cap price is 2, the cap is lower, so it applies: 120 / 2 = 60 shares, against 30 shares at the round price, which is 30 extra. If the cap price is 3.5 instead, the discounted price of 3 is lower, so the discount applies: 120 / 3 = 40 shares, which is 10 extra.
when:
  - You need selected price, conversion shares and extra shares versus round pricing.
  - You work on venture financing and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "Your note has no signed lower-of clause: ask a lawyer or your finance lead which price applies."
  - "You need to read what the contract means: get legal review, because this only does the arithmetic."
  - "You need the cap price worked out from a full capitalization table: use your deal lawyer or a cap table tool."
  - "You need the simple interest on a convertible note and the shares its balance becomes: use the Convertible note interest checker instead."
you_give:
  - Signed instrument explicitly granting lower-of pricing, approved cap conversion price, round price, discount and converting balance.
  - "The conversion date, plus the currency and scale used for the note conversion price."
  - "Your spreadsheet tool, if you want the note conversion price as a workbook."
you_get:
  - Selected price, conversion shares and extra shares versus round pricing.
  - "An editable workbook of the note conversion price, with its inputs, formulas and test cases to rerun."
  - "A tie-out of the converting balance and the shares issued, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the signed note and the round terms."
  - "Tell it what you need: the cap price, the discount price, the lower of the two and the shares the note converts into."
  - "Ask it to stop and mark MISSING if the cap price or the discount is not in your sources."
  - "Check that both prices apply to the same security and the same currency per share, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Your signed note or SAFE that grants lower-of pricing
    - The approved cap conversion price
    - The round price and the discount
    - The balance that converts
    - Your reporting date and currency
  prerequisites:
    - An AI that can read your files
    - Node.js 20 or later, only if you want to run the bundled calculation
    - A spreadsheet tool, only if you want a workbook
  output:
    - name: Selected price
      contains: The lower of the cap price and the discounted round price, with the branch that applies.
    - name: Conversion shares
      contains: The converting balance divided by the selected price.
    - name: Extra shares versus round pricing
      contains: How many more shares the selected price gives than the plain round price.
    - name: Inputs and assumptions
      contains: Each input with its source, date, currency and scale.
    - name: Reconciliations
      contains: Checks that the prices apply to the same security and tie back to the inputs.
    - name: MISSING lines
      contains: Inputs the AI could not find, left open and never guessed.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
how_it_works:
  - title: 1. Confirm lower-of election and compute cap price separately using its actual capitalization definition
    text: Confirm lower-of election and compute cap price separately using its actual capitalization definition.
  - title: 2. Calculate round price times one minus discount, then select the lower of this result and approved cap price
    text: Calculate round price times one minus discount, then select the lower of this result and approved cap price.
  - title: 3. Divide converting balance by selected price and compare to round-price shares; name the binding branch
    text: Divide converting balance by selected price and compare to round-price shares; name the binding branch.
output_shape: |-
  Selected price, conversion shares and extra shares versus round pricing.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Conversion date"
    how: "Take the conversion date from the signed note and the round terms. Use one currency and scale on every line."
  - what: "Round price"
    how: "Change the round price and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Both prices apply to the same security and currency per share.
judge:
  - Both prices apply to the same security and currency per share.
  - Zero or negative conversion prices block calculation.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one note conversion price you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define lower-of pricing into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
