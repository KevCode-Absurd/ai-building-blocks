new_slug: capped-participation-checker
name: Capped participation checker
headline: Capped participation checker
summary: Find what a preferred investor gets from a sale under a capped participation payout, and whether converting to common shares pays more.
job: money-and-investing
thinking: high
thinking_why: "The capped route and the conversion route behave differently as the price rises, so each needs its own calculation."
subhead: Give it the sale proceeds and the terms of one preferred share class. It works out the capped payout and the payout if the investor converts to common shares. You get the larger payout and what is left for everyone else.
explain: |-
  Some investors hold preferred shares. In a sale, an investor with capped participation gets their money back first. This is the preference. They then share in what is left, up to a cap. This capped participation checker shows what that investor is paid and what is left for the other owners.

  The cap here includes the money back. A 3x cap on 100 invested means the investor can take 300 in total, not 300 on top. The skill also works out the other choice. The investor can convert to common shares and take their ownership share of all the proceeds. The cap does not limit that choice. The investor takes whichever is larger.

  Practice numbers, not a real deal: 100 invested, a 1x preference, a 3x cap and 20% ownership. At 1000 of proceeds, the preference pays 100. Then 20% of the 900 left adds 180. Capped participation pays 280, and converting pays only 200, so 280 wins. At 2000 of proceeds, the cap holds the first route to 300, but converting pays 400, so converting wins.
when:
  - A term sheet gives your investor a 1x preference with participation capped at 3x, and you want their payout at a given sale price.
  - You want to find the sale price where converting to common starts to beat the capped payout.
  - A board member asks how much is left for common holders after one preferred class is paid.
  - You are checking a lawyer's or accountant's payout table against the share terms.
not_for:
  - The preferred class has no participation, only a preference or a choice to convert. Use the Preferred share payout comparison analyst.
  - Two or more preferred classes rank against each other, or the terms add dividends. This covers one class and no dividends, so ask a lawyer or build a full payout table.
  - You want what the sellers take home after debt, cash and deal costs. Use the Business sale proceeds checker first, then bring its result here.
you_give:
  - The sale proceeds left for shareholders after debt and any claims that rank ahead (from the sale agreement or your cap table)
  - The amount the investor paid in for this class of shares (from the term sheet or share purchase agreement)
  - The preference multiple, such as 1x, and the cap multiple, such as 3x, including the money back (from the share terms)
  - The investor's ownership share if they converted to common, and whether the terms let them convert (from your cap table)
  - The currency and units, such as USD thousands
  - Your own payout spreadsheet (optional)
you_get:
  - The preference paid, the participation paid and the capped total
  - The payout if the investor converts to common shares
  - Which choice pays more, and the investor's final payout
  - What is left for common holders and everyone else
  - A list of missing facts and checks it could not run
  - A small workbook with the same sums, if your AI can make files
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. A chat is enough. You do not need to run code.
  - Paste the share terms, the amount invested, the ownership share and the sale proceeds. Say the currency and units. Attach the term sheet page if you can.
  - Ask in plain words, such as what does the investor get at 1000 of proceeds, and would converting pay more?
  - Check one line yourself. The capped route is the preference plus the ownership share of what is left, held at the cap. The convert route is the ownership share of all proceeds.
  - Read MISSING and CHECKS MISSED before you use any figure. Run a second sale price to find where converting wins.
  - Ask for a workbook only if your AI can make files.
how_it_works:
  - title: Checks the terms
    text: Confirms the cap includes the money back, that the cap is not below the preference, and that converting is still allowed.
  - title: Pays the preference
    text: Pays the preference first, up to the proceeds there are.
  - title: Adds capped participation
    text: Adds the ownership share of what is left, then holds the total at the cap.
  - title: Works out converting
    text: Takes the ownership share of all proceeds, with no cap on this route.
  - title: Picks the larger payout
    text: Gives the investor the larger of the two, and shows what is left for everyone else.
  - title: Marks the gaps
    text: Writes MISSING for any number it was not given and lists checks it could not run. It never fills a gap with zero.
output_shape: |-
  RESULT
  Preference paid <amount> | Participation paid <amount> | Capped total <amount> | Convert payout <amount> | Investor takes <capped or convert> <amount> | Left for others <amount>

  SCOPE AND SOURCES
  <period, currency and units; source and date for each input>

  INPUTS AND ASSUMPTIONS
  <amount invested, preference multiple, cap multiple, ownership share, proceeds>

  CALCULATIONS AND TIES
  <each sum with its figures, then the tie of investor payout plus left for others to proceeds>

  FILE CHECK
  <what was recalculated in the workbook, or "no workbook made">

  MISSING
  <list>

  CHECKS MISSED
  <one line per check not done, or none>
output_sample:
  input:
    - The sale proceeds left for shareholders
    - The amount the investor paid in for this class
    - The preference multiple and the cap multiple
    - The investor's ownership share if they converted
    - Your own payout spreadsheet (optional)
  prerequisites:
    - The term sheet or share terms that set the preference and the cap
    - A cap table that shows the ownership share
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: RESULT
      contains: The preference, participation, capped total, convert payout, the one the investor takes, and what is left for others.
    - name: SCOPE AND SOURCES
      contains: The period, currency and units, with the source and date of each input.
    - name: INPUTS AND ASSUMPTIONS
      contains: Each number you gave it and each assumption, kept apart from facts.
    - name: CALCULATIONS AND TIES
      contains: Each sum shown with its figures, and the check that the payouts add up to the proceeds.
    - name: FILE CHECK
      contains: What was recalculated in the workbook, or a note that none was made.
    - name: MISSING
      contains: Every number it needed and did not get. It never fills one with zero.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
tweaks:
  - what: A different sale price
    how: Change the proceeds and run it again. The capped route stops growing at the cap, and converting keeps growing.
  - what: A different cap
    how: Change the cap multiple. A cap below the preference multiple is refused.
  - what: A different ownership share
    how: Change the ownership share. It sets both the participation and the convert payout.
judge:
  - Total participation cap must be at least the preference multiple.
  - The independent conversion alternative is not capped by the participation cap.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one capped participation payout you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define cap multiple into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can do these sums in a chat.
    - name: An AI that can make spreadsheet files
      why: It can build the workbook, recalculate it and check that it reopens.
    - name: Node.js 20 or later (optional)
      why: Runs the small script that comes with the skill, for a second check of the numbers.
  inputs:
    - The page of the term sheet or share terms that sets the preference, the cap and the right to convert
    - The cap table that shows the investor's ownership share
    - A named reviewer and the question you want answered
terms:
  - term: Preferred shares
    meaning: Shares that get paid before common shares in a sale.
  - term: Preference
    meaning: The money an investor gets back first, often the amount they paid in.
  - term: Participation
    meaning: A share of what is left after the preference is paid.
  - term: Cap
    meaning: The most the investor can take through the preference and participation together.
  - term: Convert to common
    meaning: Swap the preferred shares for common shares and take an ownership share of all the proceeds.
  - term: Common shares
    meaning: The ordinary shares held by founders, staff and others, paid after preferred shares.
  - term: Illustrative figures
    meaning: Practice numbers that show how the sums work. They are not a real deal.
before:
  - closing-equity-proceeds-checker
next:
