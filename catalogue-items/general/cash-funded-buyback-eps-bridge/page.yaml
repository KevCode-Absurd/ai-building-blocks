new_slug: cash-funded-buyback-eps-bridge
name: Cash-funded buyback EPS bridge
headline: Cash-funded buyback EPS bridge
summary: Work out EPS before and after a cash-funded buyback, and see how much share-count accretion is offset by the lost cash earnings.
job: money-and-investing
thinking: high
thinking_why: "Share count falls and earnings fall at the same time, so the two effects must be kept apart and tied to what was actually executed."
subhead: Give it your profit, share count, the cash spent and the price paid. It works out EPS before and after the buyback, and the earnings lost on the cash. You get the two effects side by side.
explain: |-
  A cash buyback changes EPS (earnings per share) in two ways at once. Fewer shares are left, which lifts EPS. The cash no longer earns a return, which lowers profit. This bridge keeps the two effects apart so you can see the net result.

  Practice numbers, not a real company: profit of 100 and 50 million shares. Spending 100 million at 20 a share retires 5 million shares. The cash was earning 5 million after tax, so profit falls to 95. EPS moves from 100 / 50 = 2.00 to 95 / 45 = 2.11. A higher EPS does not show the buyback was good value.
when:
  - A company finished a cash buyback and you want to see what it did to EPS.
  - You want the share-count effect and the lost-return effect side by side.
  - A reviewer needs each figure traced to a filing or record.
not_for:
  - "You fund the buyback with debt or have costs: build a separate debt-funding schedule with your finance lead, because this skill only covers cash."
  - "The buyback happens part way through the period: use a separate timing schedule built with your analyst or in your own spreadsheet."
  - "You want to know if the buyback is good value or should happen: ask a qualified adviser, because this skill does not recommend or run a repurchase."
  - "You want to know whether dividends and buybacks fit within equity cash flow: use the Shareholder distribution coverage instead."
you_give:
  - Ordinary profit, opening shares, cash-funded repurchase amount, execution price, timing and after-tax return forgone on cash.
  - "The repurchase date, plus the currency and scale used for the buyback EPS bridge."
  - "Your spreadsheet tool, if you want the buyback EPS bridge as a workbook."
you_get:
  - Before-and-after EPS and a cash opportunity-cost reconciliation.
  - "An editable workbook of the buyback EPS bridge, with its inputs, formulas and test cases to rerun."
  - "A tie-out of lower earnings and lower weighted shares to EPS, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the buyback record and the cash earnings figures."
  - "Tell it what you need: EPS before and after the buyback, and the earnings lost on the cash used."
  - "Ask it to stop and mark MISSING if the amount of cash actually spent is not in your sources."
  - "Check that the buyback does not retire every outstanding share, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Your ordinary profit and opening share count
    - The cash spent on the buyback and the price paid per share
    - The timing of the buyback and the after-tax return lost on that cash
    - "Reporting date, currency and scale (optional: your accounting basis and fiscal calendar)"
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Scope and dated sources
      contains: The mandate, whether it is a scenario or a past review, and the dated sources used.
    - name: Inputs and assumptions
      contains: Every input with its source, date, currency and scale, kept apart from assumptions.
    - name: Model calculations and reconciliations
      contains: Shares retired, after-tax earnings lost, and the bridge from old EPS to new EPS.
    - name: Actual file verification
      contains: "The workbook checks that ran: recalculation, a changed input, formula review and reopening the saved file."
    - name: "MISSING: lines"
      contains: Each input or fact that was not supplied, left open and never filled in.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
how_it_works:
  - title: 1. Check the mandate is an illustrative scenario or historical review; distinguish announced authorization from actual executed repurchases
    text: Check the mandate is an illustrative scenario or historical review; distinguish announced authorization from actual executed repurchases.
  - title: 2. Compute shares retired from executed cash and price; calculate the after-tax earnings forgone on that cash for the same period
    text: Compute shares retired from executed cash and price; calculate the after-tax earnings forgone on that cash for the same period.
  - title: 3. Reconcile lower earnings and lower weighted shares to EPS; isolate timing, transaction costs and financing assumptions before interpreting accretion
    text: Reconcile lower earnings and lower weighted shares to EPS; isolate timing, transaction costs and financing assumptions before interpreting accretion.
output_shape: |-
  Before-and-after EPS and a cash opportunity-cost reconciliation.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Repurchase date"
    how: "Take the repurchase date from the buyback record and the cash earnings figures. Use one currency and scale on every line."
  - what: "Execution price"
    how: "Change the execution price and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Repurchases do not remove all outstanding shares.
judge:
  - Repurchases do not remove all outstanding shares.
  - After-tax cash earnings lost are deducted; EPS accretion is not described as value creation.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one buyback EPS bridge you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define executed repurchase into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
