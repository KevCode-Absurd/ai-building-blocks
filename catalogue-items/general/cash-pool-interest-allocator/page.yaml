new_slug: cash-pool-interest-allocator
name: Cash pool interest allocator
headline: Cash pool interest allocator
summary: An entity interest schedule with a pool residual
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: An entity interest schedule with a pool residual. Share actual entity deposit and borrowing principal, fixed approved rates, common accrual days and day-count basis; legal pool structure.
explain: |-
  An entity interest schedule with a pool residual.

  Treasury cash pools. Illustrative figures only, in USD unless labelled otherwise. This is a focused schedule with explicit period and timing assumptions. Rebuild from actual dated sources before use; the example is not a full financial forecast.
when:
  - You need an entity interest schedule with a pool residual.
  - You work on treasury cash pools and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Actual entity deposit and borrowing principal, fixed approved rates, common accrual days and day-count basis; legal pool structure.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - An entity interest schedule with a pool residual.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: 1. Create a dated source map of the stated balances, transaction IDs, currency, units, period boundaries and contractual definitions
    text: Create a dated source map of the stated balances, transaction IDs, currency, units, period boundaries and contractual definitions. Stop affected lines on missing evidence.
  - title: 2. Separate entity credit balances from borrowings and source the approved internal rates and contractual day-count basis
    text: Separate entity credit balances from borrowings and source the approved internal rates and contractual day-count basis.
  - title: 3. Accrue each side on the supplied principal and common period; show deposit interest received and borrower interest paid separately
    text: Accrue each side on the supplied principal and common period; show deposit interest received and borrower interest paid separately.
  - title: 4. Compute the center spread and reconcile borrower interest to depositor interest plus center residual
    text: Compute the center spread and reconcile borrower interest to depositor interest plus center residual.
output_shape: |-
  An entity interest schedule with a pool residual.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Every material input has a source location, date, unit, sign and approval status.
judge:
  - Every material input has a source location, date, unit, sign and approval status.
  - Keep actual records, contractual inputs and scenarios separate; a missing value never becomes zero.
  - Principal, rate and days must represent the same accrual window; rates are decimal annual fractions.
  - Borrower interest minus deposit interest must equal pool-center residual; no netting changes legal balances.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
