new_slug: chat-screenshot-image-ad-maker
name: "Chat screenshot image ad maker"
summary: "Paste your story ad. Get the chat messages and a ready-to-paste screenshot image prompt."
job: make-image-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Chat screenshot image ad maker"
subhead: Paste your story ad. It picks a one-to-one text or a group chat, casts the people who noticed the problem, and writes a short thread that leaves the narrator on the spot. You get the messages, an image prompt and a line to run under it.

explain: |
  A problem someone else points out is harder to wave away. "It's been open since January" from a partner says more than any line the brand could write. When the whole family piles on in a group chat, it's harder still. And people read a message thread in a feed before they've decided to.

  This skill reads your story and picks the thread that fits: a one-to-one text when one person noticed, or a group chat with up to three senders when the family all know. The others notice; the narrator admits, dodges or says nothing, and the thread ends open, so the story has to answer it. Messages stay under about 12 words, so the chat reads in one look on a phone. The screen uses plain bubbles, made-up names and no real app's colours, ticks or faces. It suggests typing the messages into a design tool, so every word stays exact.

when:
  - Your story has a partner, relative or friend who noticed the problem or the workaround.
  - The problem is something a family jokes about or keeps noticing in each other.
  - You want a picture with words that still reads like a normal post.

you_give:
  - Your approved story ad, with the other people in it and what they noticed
  - How your buyer texts, and whether their family uses group chats (optional)
you_get:
  - One-to-one or group, with who each person is and what they noticed
  - Two to six messages in order, with who sent each
  - A blank version and the line under the picture
  - A 60 to 120 word image prompt, and how to make it exact
  - Any of its six checks the brief still misses, each named

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad. If it quotes the texts, those exact words are used.
  - Say "group chat" or "one-to-one" if you already know which you want. Otherwise it picks from the story.
  - Type the messages into plain bubbles in a design tool, or paste the prompt into your image tool.
  - Read every message and name letter by letter, then read the flags. Any message written for the image needs a second look before it runs.

how_it_works:
  - title: Sets the house rules
    text: Square, a plain screenshot, no logo, price, product or real app look, made-up names and no faces as contact photos.
  - title: Picks the thread
    text: A one-to-one text when one person noticed, or a group chat when the family or friends all know.
  - title: Casts the people
    text: Who each person is to the narrator, a made-up first name or initial, and a group name a real family would use.
  - title: Finds what they noticed
    text: The bad moment seen from outside, or a habit they question, in your story's words.
  - title: Keeps it short
    text: Two to five messages one-to-one, four to six in a group, each under about 12 words.
  - title: Ends it open
    text: A question to the narrator left hanging, so your story's first line has something to pick up.

output_shape: |
  SCENE             <what someone scrolling would say they saw>
  THREAD            <one-to-one | group>, <fit: yes | inferred>
  WHO AND WHEN      <each person, name or initial, group name, time>
  WHAT THEY NOTICED <one line, and where in the story>
  MESSAGES          <sender>: "<text>", in order
  BLANK VERSION     <the screen with empty bubbles>
  LINE UNDER IMAGE  <words> (<which line>, <characters>)
  FLAGS             <words written for the image, anything inferred, a new story opening if needed>
  IMAGE PROMPT      <60 to 120 words, every message in quotes once>
  HOW TO MAKE IT    <design tool or image tool>
  CHECKS MISSED     <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved; narrator: a customer who agreed, built on
    reviews 1 and 3, example only):
    In March my partner Sam texted me from the kitchen:
      sam: is the green tub in the cupboard still yours
      me: technically, yes. it's mine
      sam: it's been open since january
      me: i drank it twice. it was gritty
      sam: so are you keeping it or what
    I didn't answer. I'd tried a few green powders over the years.
    The issue was never what was in them. It was sticking with it.
    Sprout is one daily pack of gummies: tear the top, eat them. 60+
    ingredients, 21 vitamins and minerals, 6 g prebiotic fiber. No
    water, no shaker.

    Buyer: the quitter who wants to stick, 28 to 45.
  output: |
    SCENE             A text thread where someone asks if the green
                      tub in the cupboard is still theirs.
    THREAD            One-to-one. One person noticed, and the story
                      quotes the thread.
    WHO AND WHEN      The narrator's partner, "Sam". 7:42 pm.
    WHAT THEY NOTICED The tub open since January and barely used
                      (story, the thread).
    MESSAGES          Sam: "is the green tub in the cupboard still yours"
                      Me: "technically, yes. it's mine"
                      Sam: "it's been open since january"
                      Me: "i drank it twice. it was gritty"
                      Sam: "so are you keeping it or what"
    BLANK VERSION     The same screen, five empty bubbles in the same
                      places.
    LINE UNDER IMAGE  Keeping the green tub? (a question about the
                      thing, 22)
    FLAGS             All five messages are the story's own words. Sam
                      is a made-up name. The thread ends on Sam's
                      question, unanswered, as the story does. Nothing
                      names the product or a rival.
    IMAGE PROMPT      Square 1:1 plain phone screenshot of a text
                      conversation, slightly cropped at the top. A thin
                      top bar shows only the name "Sam" and a blank
                      grey circle. Time stamp "7:42 pm". Plain light
                      grey bubbles on the left for Sam, plain white
                      bubbles with a thin grey edge on the right for me,
                      in this order: Sam
                      "is the green tub in the cupboard still yours",
                      me "technically, yes. it's mine", Sam "it's been
                      open since january", me "i drank it twice. it was
                      gritty", Sam "so are you keeping it or what". No
                      app name, no logo, no ticks, no contact photo, no
                      notification banner.
    HOW TO MAKE IT    Type the five messages into plain bubbles in a
                      design tool and export a square image.
    CHECKS MISSED     none

tweaks:
  - what: One-to-one or group
    how: Ask for a group chat when your story has family who all know, such as a brother counting the bottles in the cupboard. It names the group, adds up to two more senders and lets the narrator stay silent.
  - what: Who notices
    how: Name the person in your story who'd really say it, a partner, a sister, a flatmate or a coworker. The closer they are, the more the text stings.
  - what: How it ends
    how: Ask for "ends on the narrator's reply" if your story's first line answers that reply instead of a question.
  - what: How they text
    how: Tell it if your buyers write in full sentences, with capitals, with nicknames or in another language. Lower case suits younger buyers, not everyone.

judge:
  - The others notice the problem. Nobody sells or cheers.
  - It's two to six messages, each readable on a phone without zooming, with three senders at most.
  - The thread ends with the narrator on the spot, and your story's first line picks it up.
  - Every message is from your story, or flagged as written for the image.
  - Every name is made up, and the screen looks like no real app, with no face as a contact photo.

test:
  - Give it a story that quotes a thread. The messages should match word for word, in order.
  - Give it a story where the whole family teases the narrator. It should pick a group chat, not a one-to-one text.
  - Give it a story with no second person. It should send you to the phone note or the snapshot.
  - Look at the finished picture at arm's length on your phone. If you can't read it, ask for fewer messages.

improve:
  - Add how your buyers text and talk to family (lower case, nicknames, emoji or not, language) to your brand file.
  - Quote the thread in your story word for word. Then the picture copies the story and needs no extra check.
  - Keep one bubble style for all your chat ads, built once in your design tool, with a group version beside it.
  - Pair it with a story ad skill, so the first line answers the message left hanging.

works_best_with:
  tools:
    - {name: "Figma", why: "You type each message and name into plain bubbles yourself, so every word is exact and the look copies no app."}
    - {name: "Nano Banana", why: "Google recommends it for accurate text, if you'd rather generate the screenshot."}
    - {name: "Any good chat AI", why: "Writing short, true-sounding texts and family banter from a story is something Claude, ChatGPT and Gemini all do well."}
  inputs:
    - "Real texts or comments where buyers mention what a partner or family says about the problem, with permission, so the thread sounds like them"
    - "Your buyer's age range and how they text, so the case, length and slang fit"
    - "Which chat apps your market uses most, so the plain layout still feels familiar"
    - "A blank bubble layout you've built once, so every chat ad looks the same and needs only new words"

terms:
  - term: Thread
    meaning: A run of text messages, shown as a screenshot.
  - term: Group chat
    meaning: A message thread shared by a family or a group of friends.
  - term: Blank version
    meaning: The same picture with empty bubbles, so you can change the words later.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
