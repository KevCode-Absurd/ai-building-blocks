new_slug: choose-three-on-brand-designs-for-page
name: Choose from three on-brand designs for your page
summary: Three distinct design plans for one page in your colours and fonts, plus a review once it's built.
job: write-landing-page

headline: Three clearly different designs for your page, all in your own colours, fonts and photos
subhead: Give it your finished page copy and your brand's colours, fonts and photos. It sets one design system, plans three directions that differ in layout and what the pictures do, maps every section for phone and desktop, and can review a built page for design and readability problems.

explain: |
  When you ask for page designs, you often get three versions of the same layout in three colours. Or your fonts get swapped and the delivery terms hidden to make it look cleaner.

  This skill plans the design before anything is built. First it writes down a system from your own brand: which colours do which job, which font is for headings and which for reading, and one main visual move. Then it plans three directions that differ in how the first screen is composed, what the images do and how the argument flows, such as a product demonstration, a story told like a magazine, or a close look at details. Each section gets a phone and a desktop layout. Give it screenshots of a built page and it reviews them twice, once for design and once for technical problems like text that's too small or too faint.

when:
  - Your page copy and offer are settled and you need a design plan before anyone builds it.
  - A page is built and you want to know what looks wrong or is hard to read on a phone.
  - You want to compare a few real options before committing to a redesign.

you_give:
  - Your brand's colours and what each is for, fonts, voice, logo and product photos
  - The page's copy or brief, the buyer, the ad that sends people there, the offer and the facts
  - What may change, a light refresh or a full redesign (optional)
  - Phone and desktop screenshots of a built page, for a review (optional)
you_get:
  - One design system with named colours, font roles, a main visual move and layout rules
  - Three design directions, each with its first screen, image job and section order
  - A section plan with one row per section, for phone and desktop
  - If you sent screenshots, design and technical findings with a fix for each

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste your brand colours with hex codes and font names, and describe or attach your product photos.
  - Paste the finished page copy and the ad that sends people to it.
  - Say whether this is a refresh (keep what works) or a redesign (layout can change).
  - Pick one direction, then hand the section plan to whoever builds the page. Once it's built, send screenshots back for the review.

how_it_works:
  - title: Checks the kind of page
    text: This is for pages that persuade, which lead with the real product, believable proof and a clear decision. Dashboards and tools need a different approach.
  - title: Sets the system first
    text: Writes four to six of your existing colours with their jobs, font roles, one main visual move, layout rules, line length, motion and accessibility aims. Adds no new colours or fonts.
  - title: Makes three real options
    text: Directions differ in first-screen layout, what the images do and the rhythm of the argument. Three colour swaps don't count.
  - title: Plans every section
    text: Each section answers one buyer question and gets a phone layout and a desktop layout, in a sensible reading order.
  - title: Designs the buying moment
    text: Shows the real product and variant, keeps the ad's promise visible, and groups price, choices and terms around the button.
  - title: Sets the type
    text: Body text starts at 16 px. Delivery, returns and subscription details stay visible on phones.
  - title: Reviews a built page
    text: Does one visual pass and one technical pass (contrast, tiny text, tap targets, zoom), each finding tied to a section and screen size.

output_shape: |
  DESIGN SYSTEM
  Colours: <colour> <hex> = <job>  (4 to 6, all yours)
  Type: headings <font>, body <font>, buttons <font>
  Main visual move: <one>
  Layout rules: <2 to 5>   Line length: <45 to 75 characters>
  Motion: <policy>   Accessibility: <aims>

  DIRECTION A  <name>
  First screen: <composition>   Images: <their job>
  Argument rhythm: <order>   Phone: <...>   Desktop: <...>
  DIRECTION B  <...>
  DIRECTION C  <...>

  SECTION PLAN
  # | Section | Buyer question | Phone layout | Desktop layout | Image

  REVIEW  (only if you sent screenshots)
  Visual: <section>, <screen size>: <what's wrong> . <fix>
  Technical: <section>, <screen size>: <what's wrong> . <fix>
  Not checked: <what couldn't be verified>

example:
  business: sprout
  input: |
    [the skill]

    Brand look (sprout/brand.md): forest green #00582D, deep forest
    #002C17 (headings, dark sections), cream #FFF7DF (hero background),
    kelly green #007E40 (buttons), sunflower yellow #FFCC2E (stars,
    badges), plum #581E5A (top banner). Work Sans bold headings, Work Sans
    medium body, DM Mono small uppercase tags, a chunky display font for
    big lines. Photos: bright, sunny, pouch on a soft 2-colour gradient,
    gummies poured into a hand. Pack torn straight across the top only.

    The page: our main product page for Sprout Original, copy and offer
    as now (sprout/product-page.md). Buyer: people who quit powders.
    Scope: redesign. Keep every price, term and the guarantee wording.
    No screenshots yet.
  output: |
    DESIGN SYSTEM
    Colours: cream #FFF7DF = page and hero background
             deep forest #002C17 = headings, dark proof bands
             kelly green #007E40 = the one main button
             forest green #00582D = pouch, section accents
             sunflower #FFCC2E = small badges only
             plum #581E5A = announcement bar only
    Type: headings Work Sans bold, body Work Sans medium 16 px and up,
          tags DM Mono uppercase, big statement lines in the display font
          (MISSING: its name and file)
    Main visual move: the torn daily pack, gummies pouring into a palm
    Layout rules: one idea per section; price, terms and button always
      together; renewal price never smaller than body text
    Line length: 45 to 75 characters   Motion: none beyond hover
    Accessibility: yellow never carries text; contrast checked on cream

    DIRECTION A  "Rip. Tip. Enjoy."  (demonstration)
    First screen: three steps across one hand-held shot: tear, tip, eat
    Images: show the habit happening   Rhythm: how easy, what's inside,
      proof, price   Phone: steps stack, button under step 3
    DIRECTION B  "The shelf you clear"  (story)
    First screen: a powder tub, shaker and pill bottles on one side, one
      green pouch on the other   Images: before and after of the counter,
      never of a body   Rhythm: the old way, the swap, reviews from
      people who quit powders, price   Desktop: split screen
    DIRECTION C  "What's in one pack"  (detail)
    First screen: one daily pack, big, with 60+ / 21 / 6 g in DM Mono
      tags   Images: close-ups and the nutrition label   Rhythm: what's
      inside, testing, study, price   Phone: tags become a swipe row

    SECTION PLAN (direction B)
    # | Section       | Buyer question            | Phone           | Image
    1 | Hero          | What is it, for me?       | stacked split   | counter swap
    2 | Plan box      | What does it cost?        | price, renewal, | pouch
      |               |                           | guarantee, button together
    3 | The old way   | Why switch?               | 3 short lines   | shaker, pills
    4 | What's inside | Is it enough?             | 3 DM Mono tags  | label close-up
    5 | Reviews       | Do people stick with it?  | 3 quote cards   | none
    6 | Testing       | Can I trust it?           | one dark band   | none
    7 | Questions     | What if...?               | open by default | none

    KEPT VISIBLE ON PHONES
    "Renews at $49.99 each 4 weeks", "30-day guarantee on your first
    order", the text sign-up condition for $29.99, delivery time.

    NOT CHECKED
    No screenshots yet, so no visual or technical review. Contrast of
    white text on photos needs a look once built.

tweaks:
  - what: Refresh or redesign
    how: Say "refresh" to keep the layout and content you weren't asked to touch. Say "redesign" to let the directions recompose the page, while your facts, offer terms and behaviour stay fixed.
  - what: Your brand colours
    how: Give each colour a job (background, button, accent). With jobs set, the three directions use them consistently instead of guessing.
  - what: Product photos
    how: List the photos you have by view (front, detail, in use, scale). Without them, image slots stay as labelled boxes rather than generated stand-ins.
  - what: Review only
    how: Send screenshots at phone, tablet and desktop widths and ask for the review only. You get the two lists of findings without new directions.

judge:
  - Every colour and font in the plan is one you supplied.
  - The three directions differ in layout and what the pictures do, not only in colour.
  - No offer, claim, review or badge appears that isn't in your facts.
  - Delivery, returns and subscription terms stay visible on phones.
  - Each review finding names a section and a screen size.
  - Anything it couldn't check, such as contrast over a photo, is listed as not checked.

test:
  - Search the plan for any colour or font you didn't supply. There should be none.
  - Put the three first screens side by side. If two differ only in colour, ask for a new third direction.
  - Run the review on a built page with a problem you already know about, such as small text on phones. It should name the section and the screen size.
  - Read the "not checked" list. Text contrast over photos should be on it unless someone checked it by eye.

improve:
  - Write your design system into step 2 once (colours with their jobs, font roles, layout rules), so every page starts from the same system and you only paste the copy.
  - Replace the example directions in step 3 with kinds that suit your brand, for example a recipe-card layout for a food brand.
  - Add the terms you must always show to step 6 (renewal price, delivery time), so no direction hides them.
  - Save the direction you choose to the look section of your brand file, so later pages match it.
  - Pair it with a skill that writes the page copy from your ad first, and one that borrows the layout of a page you admire when you have a reference.

terms:
  - term: Design system
    meaning: The fixed set of colours, fonts, sizes and rules every section of the page follows.
  - term: First screen
    meaning: What a visitor sees before scrolling. On a phone this is small.
  - term: Contrast
    meaning: How clearly text stands out from its background. Faint grey text on white fails.
  - term: Tap target
    meaning: The area you can tap on a phone. Buttons around 44 px tall are easy to hit.
