new_slug: claim-and-proof-matcher
name: Claim evidence checker
summary: Check ad copy against your proof. See which claims are backed, which go too far, and how to fix each gap without making up evidence.
job: check-ads
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
headline: Claim evidence checker
subhead: Give it ad copy and the proof you have. It lists stated and implied claims, pairs each with evidence, flags gaps and suggests a fix.
explain: |
  Copy often says more than the seller can back, and what a line makes the reader think can be bigger than what it says. A doubting reader notices both. A claim with proof beside it is believed, and a claim without it costs trust for the whole page.

  This skill lists every claim, headline first, and writes the proof beside each. It marks claims bigger than their proof and proof that sits far from its claim. It reads each line as a doubting reader and asks what a fair-minded jury would need. It also lists what a claim leads a reader to think and checks that is true too. The fix is to shrink the claim, add real proof, or move the proof. It never invents proof.
when:
  - You have a page or ad ready and want to know which claims a buyer will doubt.
  - You are about to run ads in a market with strict claim rules.
  - You have lots of proof but it is not sitting next to the claims it backs.
not_for:
  - "You need legal or platform sign-off on a finished page: ask a compliance reviewer, because this score does not clear any rule."
  - "You want to plan or tighten your offer: use the Offer checklist reviewer."
  - "You have no proof at all yet: collect results, reviews and numbers first, or every claim will come back as a gap."
you_give:
  - Your ad or page copy
  - "Your proof: test results, numbers, reviews, awards, facts (optional)"
  - Your offer terms (optional)
you_get:
  - Unique stated and implied claims, with proof or a gap flag
  - Evidence scope, dates, quote permissions and claim-by-claim findings
  - An evidence-match score with evaluated/total coverage
  - A fix for each gap and any separate rule checks still needed
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill. No code, files or paid tools are needed.
  - Paste your ad or page copy in the order a reader sees it.
  - Paste your proof under it, with where each piece comes from and its date. Add your offer terms if you have them.
  - Ask your AI to check the claims against the proof.
  - Read the gaps first. Check that no fix adds a fact you cannot back.
  - Use the fixes in your copy. Get a separate rule check if your market restricts claims.
output_sample:
  input:
    - Your ad or page copy, in the order a reader sees it
    - Your proof, with sources and dates (optional)
    - Your offer terms (optional)
    - Reviews that show what buyers doubt (optional)
  output:
    - name: Draft reviewed
      contains: The exact draft or version that was checked, so the score matches the text you have.
    - name: Claims and proof table
      contains: Each stated and implied claim with its proof, source, date, distance from the claim and a verdict.
    - name: Three reasons why
      contains: Whether the copy says why you beat other choices, why the claim is true, and why to act now.
    - name: Worn-out words and marks
      contains: Exclamation marks and stock phrases that carry no fact.
    - name: Evidence-match score
      contains: Matched claims out of those checked, with coverage and unchecked claims shown apart.
    - name: Fixes
      contains: For each gap, whether to shrink the claim, add real proof or move proof, with the new text.
    - name: Missing
      contains: Proof the seller still needs to find, marked MISSING and never invented.
    - name: Checks missed
      contains: One line for each check the skill could not pass, or none.
how_it_works:
  - title: Lists every claim
    text: Lists every stated claim, headline first, and every claim the copy implies.
  - title: Writes proof beside each
    text: Pairs each claim with the proof that sits beside it on the page.
  - title: Marks the gaps
    text: Marks claims bigger than their proof and proof that sits far from its claim.
  - title: Reads as a doubter
    text: Reads each line as a doubting reader and notes what a fair-minded jury would need.
  - title: Checks implications
    text: States what each claim leads a reader to think and checks that is true.
  - title: Fixes the gap
    text: Shrinks the claim, adds real proof, or moves the proof next to the claim.
  - title: Checks the reasons why
    text: Checks the copy gives the three reasons why, or marks them missing.
  - title: Scores it
    text: Scores matched claims among those evaluated. It shows coverage and unknowns separately; the score does not establish legal or platform clearance.
output_shape: |
  SCORE
  <0 to 100, or NOT SCORED> | Worked out as: <claims matched ÷ claims evaluated> (evaluated/total shown; NOT CHECKED claims listed apart)

  CLAIMS AND PROOF
  1. Claim: "<line>" | Type: <stated / implied>
     Leads reader to think: <what>
     Proof: <proof and source> or GAP
     Distance: <next to claim / far>
     Verdict: <matched / outruns proof / implication untrue>
  ...

  THREE REASONS WHY
  Better than the alternatives, including doing nothing: <present / MISSING>
  Why it is true: <present / MISSING>
  Why act now: <present / MISSING>

  WORN-OUT WORDS AND MARKS
  <exclamation marks and worn phrases found>

  FIXES
  1. <claim number> | Do: <shrink / add real proof / move proof> | New text: <text>
  ...

  SCORE AFTER FIXES
  <0 to 100>, same method

  MISSING
  <proof the seller still needs>

  CHECKS MISSED
  <one line per check still missed, or none>
tweaks:
  - what: Proof with sources
    how: Give each proof with where it comes from. Unsourced proof is marked as unverified.
  - what: Claim rules in your market
    how: Paste any rules on health, money or safety claims. It checks claims against them.
  - what: The reader's doubts
    how: Add reviews or questions that show what buyers doubt. It checks those claims first.
  - what: Where proof sits
    how: Paste the whole page in order, so it can judge whether proof is near its claim.
judge:
  - Every claim is listed with its proof or a gap flag.
  - No fix invents proof the seller does not have.
  - Proof sits next to the claim it backs.
  - All three reasons why are present or marked missing.
  - Exclamation marks and worn-out phrases are flagged.
test:
  - Run it on a page where you know which claims are weak. See if it finds them.
  - Check three of its gap flags against your own records.
  - Run it twice. The claims it finds should stay close.
  - Show a fixed line to a sceptical friend and ask if they now believe it.
improve:
  - Add your proof library, with sources, so fixes can use real proof.
  - Add a list of claims you may never make.
  - Save approved claims and their proof to your org context.
  - Pair it with "Sales copy readiness checker" for a last pass before launch.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Listing claims and matching them to proof is text work any strong chat AI does well with this skill.
  inputs:
    - Test results, studies and lab reports
    - Reviews with names and dates
    - A list of claims your market's rules restrict
terms:
  - term: Implied claim
    meaning: Something the reader will conclude from your words even though you did not say it.
  - term: Three reasons why
    meaning: Why you beat the alternatives, why your claim is true, and why the reader should act now.
