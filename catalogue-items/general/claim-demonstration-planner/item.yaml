  - {type: product_data, required: true}
  - {type: copy_draft, required: false}
outputs:
  - {type: script, required: true}
origin: rebuilt
version: 1.0.0
minds: [rosser-reeves]
credits:
  - {title: "Reality in Advertising", by: "Rosser Reeves, 1961", used: "Locking the picture to the spoken words, finding one picture that shows the claim (even for a benefit nobody can see), keeping presenters who add nothing off screen, and building the rest of the ad around that picture"}
