    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
  inputs:
    - "Photos of a real place your buyers share, like a school gate, so the set feels known"
    - "Photos of real stop-motion clay figures you like, so the finish names marks that exist"
    - "Your best current image ad, so you can test the clay one against it"

terms:
  - term: Show job
    meaning: What the picture has to show for the selling idea, such as the product arriving or the lead calm while the crowd carries on.
  - term: Set card
    meaning: A short list that fixes the scale, finish, stand-in materials, light and focus.
  - term: Quiet area
    meaning: A calm part of the picture, here a plain clay wall, kept free for the words.
  - term: Glance test
    meaning: Showing the ad for 2 seconds. If a stranger can say what it's for, it passes.
