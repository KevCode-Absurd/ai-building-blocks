tweaks:
  - what: The finish
    how: Ask for "crisp" for a premium, careful look, or "rough" for big thumbprints and lumpy shapes on a silly brand. "Handled" sits between.
  - what: The shared hassle
    how: Name the place and the routine (a train, a till queue, a school gate). The opening, the snag and the ripple are all built around it.
  - what: Length
    how: 20 seconds keeps the routine, the swap and the sign-off at about 45 words. 45 seconds gives the snag and the ripple more room at about 100.
  - what: The lead
    how: Name the lead's job or day (a nurse on a night shift, a parent at the school gate) and the snag and the cast note are built around them.
  - what: How it works
    how: If your brand file says how the product works, the swap can show it in clay. Without it, there's no how-it-works moment.

judge:
  - The lead is described in exactly the same words every time.
  - No clay figure speaks or says the product worked.
  - Only one figure moves in each shot.
  - Every label word matches your real pack.
  - There's one clay morph at most, at the swap.

test:
  - Check the story needs other people. If one figure on a tabletop could tell it, a single-character clay script fits better.
  - Search the script for any line spoken by a clay figure. There should be none.
  - Read the "mover" column. If any row names two movers, ask it to split the shot.
  - Check every label word against your real pack.

improve:
  - Pick your finish once and write it into step 3 of the skill file, so every ad in the series matches.
  - Paste your label lines with their colours into "What you need", so the sculpted product is never guessed.
  - Add the shared places your buyers know to step 2 (for Sprout, an office kitchen or a school gate).
  - Save your lead's description in your brand file, so the same figure can come back in the next ad.
  - Pair it with the skill that turns a clay town script into clips, and with the clay-town image ad skill for a matching still. For one character on a single tabletop, use the single-character clay script instead.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
  inputs:
    - "Photos of a real place your buyers share, like a school gate, so the set feels known"
    - "Photos of the product from the front, side and top, so the sculpted version is never guessed"
    - "A short list of moments your brand won't show, so the crowd scenes stay on brand"

terms:
  - term: Stop-motion
    meaning: Animation made by moving clay figures a tiny bit between photos, which gives a slightly stepped movement.
  - term: Clay morph
    meaning: One clay object reshaping into another in a few stepped poses, like a shaker squashing into a flat pack.
  - term: Set card
    meaning: A short list that fixes the scale, finish, stand-in materials, light and focus for the whole ad.
