new_slug: clay-town-video-ad-script-writer
name: "Clay town video ad script writer"
summary: "Paste your idea and brand file. Get a clay-town video script, set card and cast note."
job: make-video-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Clay town video ad script writer"
subhead: Give it your selling idea and brand file. It writes a narrated clay-animation video around a hassle a whole crowd shares, where one lead gets out of it with your product. You get a set card, a timed five-part script and a cast note for the video step.

explain: |
  Some problems are awkward to show with real people: a queue at the office sink, a packed train, the school-gate rush. In a handmade clay town they become funny and easy to watch, because everyone recognises the routine and nobody real is embarrassed.

  This skill builds the story on that shared hassle. The crowd does the routine, one lead hits a snag, swaps in your product, and steps out while everyone else carries on. It writes a set card the way a studio plans one: one scale, one finish, model-maker stand-ins for water and glass, studio light and shallow focus. Only one figure moves in each shot, as in real stop-motion. A narrator tells the story; no clay figure speaks or claims a result. Your product is sculpted under its real printed label, every word exact.

  It ends with a cast note: the lead in full, the crowd, and why. The skill that turns a clay town script into clips takes it from there. Want a still instead? Use "Clay town image ad maker".

when:
  - Your buyer's problem happens around other people (a commute, an office, a family dinner).
  - You want a playful, handmade-looking ad without hiring a cast or building a set.
  - You want a script ready to hand to an AI video process, with the lead and crowd already cast.

you_give:
  - Your selling idea or an existing script
  - Your brand file, with the buyer's moment, who else is there, your product's label lines and your approved claims
  - A photo of your product (attach it; your AI can see pictures)
  - The length (20, 30 or 45 seconds) and how much the buyer already knows (optional)
you_get:
  - A set card (scale, finish, stand-ins, light, focus)
  - A line-by-line script in five movements, with the picture, who moves and the seconds
  - A cast note with the lead in full, the crowd and why this lead carries it
  - Notes on what was inferred and what's missing
  - Any of its own checks the script still misses, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your selling idea and your brand file. Say where your buyer's hassle happens and who else is there.
  - Attach a clear photo of your product, and type out every line of its label too. It won't invent label words.
  - Say the length, such as "30 seconds".
  - Take the script and cast note to "Turn your clay town script into handmade-looking clips". It runs the video process from there.

how_it_works:
  - title: Checks the fit
    text: Confirms the hassle happens around other people, and says where proof must come from elsewhere.
  - title: Names the shared hassle
    text: Writes one line about what everyone at the place does, so the crowd has a routine to perform.
  - title: Dresses the set
    text: One scale, one finish level, stand-ins like clear gel for water, studio light and shallow focus.
  - title: Writes the cast note
    text: A made-up adult lead written the same way every time, a crowd built from a few varied base figures, and why this lead carries it.
  - title: Writes five movements
    text: The routine, the snag, the swap, the ripple and the sign-off, with one mover per shot and at most one clay morph.
  - title: Holds the claims
    text: Label words exact, how it works only as you state it, and the crowd never used as proof.

output_shape: |
  FIT       <why the hassle suits a crowd, and what clay can't prove>
  HASSLE    Every <time>, everyone at <place> <does the annoying thing>.

  SET CARD  Scale <...> | Finish <crisp / handled / rough>
            Stand-ins <...> | Light <...> | Focus <...>
  CAST NOTE
  LEAD      <adult, build, clay skin colour, hair, clothes, signature item>
  CROWD     <3 or 4 base figures and how they vary>
  WHY       <why this lead carries the ad>

  #  movement  narration          picture                  mover   s
  <one row per line>

  WORDS  <spoken words> (target <target>)
  NOTES
  - Inferred: <...>
  - MISSING: <anything the facts didn't give>

  CHECKS MISSED  <one line each, or none>

