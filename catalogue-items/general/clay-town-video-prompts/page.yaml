new_slug: clay-town-video-prompts
name: "Clay town video clip prompt writer"
summary: "Turn a clay-town ad script into stop-motion image and clip prompts: avatar card, sheets, storyboard, clips and an edit list."
job: make-video-ads
thinking: high
thinking_why: "It runs several stages and keeps many rules at once across a long output."

headline: "Clay town video clip prompt writer"
subhead: Give it a narrated clay-town script and photos of your product. It plans the lead and the crowd, builds the sheets and a storyboard with one mover per shot, then writes the stop-motion clip prompts. It stops three times for your OK. You get every prompt and an edit list.

explain: |
  AI tools can make convincing clay animation, but they slip out of it. Faces drift between shots. A crowd turns to mush when everyone moves at once. Water comes out photo-real. The label on your clay pack reads as nonsense.

  This skill writes the prompts the way a stop-motion crew plans a shoot, in six stages. It writes the lead's avatar card, turns it into an image, then makes sheets of every angle, the crowd, the clay product and each empty set. Four fixed lines (set, light, palette, lens) and the lead's full description are pasted into every prompt. The storyboard gives each shot a frame and one mover. Clips run 2 to 5 seconds, with stepped stop-motion timing for the figures and a smooth camera.

  You approve the avatar, the sheets and the storyboard before any video credits are spent.

when:
  - You have a narrated clay-town script and need it made with AI image and video tools.
  - Your clay clips keep sliding into a smooth computer-graphics look, or the crowd falls apart.
  - You want to approve each step before you spend credits on video.
  - You want the same clay lead and set to look the same across a whole ad.

not_for:
  - You have no script yet. Write one first with the Clay town video ad writer, then come back.
  - You want one character on one tabletop with one changing object. Use the Claymation video clip prompt writer.
  - You want a single still image, not a clip. Use the Clay town image ad maker.
  - You want a paper look, not clay. Use the Paper craft video clip prompt writer.

you_give:
  - The narrated clay-town script, with its shots, set card and cast note
  - Real photos of your product's front, side and top, from your own shoot or listing, and every line of its label typed out
  - How the product is used, in the steps your brand really uses
  - Your brand colours and tone (optional)
  - Your video tool's clip lengths and whether it takes a first and last frame (optional)
you_get:
  - An avatar card for the lead and crowd to approve, then reference prompts and a pick
  - Character, crowd, product and set sheets, with the set bible and lead line locked
  - A storyboard with a frame, a shot card and a planned scene change for every shot
  - Clip prompts with stop-motion timing and one mover, and an edit list
  - Any of its own checks the prompts still miss, one line each

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it in. It writes prompts only. You make the pictures and clips in an image tool and a video tool. The clip stage needs a connected or paid video tool, and each clip costs credits.
  - Paste the script. The best start is one from the Clay town video ad script writer. Attach your product photos and type out every label line.
  - Approve the avatar card. Make the reference images and pick one.
  - Make the sheets. Compare the product sheet with your real pack, word by word. Then approve the sheets with the lock lines.
  - Approve the storyboard. Make each clip from its approved frame, 2 or 3 takes each, and pick the best.
  - Record the narration and cut the edit from the edit list. Check the offer and renewal wording against your ad platform's rules before the ad goes live.

how_it_works:
  - title: Takes in the script
    text: Reads the set card, the places, the mover in each shot and the one morph.
  - title: Picks the avatar
    text: The lead written in full and a crowd of 3 or 4 base figures. You approve the card.
  - title: Turns it into an image
    text: Three or four clay reference images of the lead, and the pick.
  - title: Makes sheets and lock lines
    text: Every angle of the lead, the crowd, the clay product under its printed label, each empty set, and the set bible. You approve them.
  - title: Storyboards every shot
    text: A frame and a shot card naming the one mover, and a scene change chosen on purpose. You approve the board.
  - title: Turns it into video
    text: Short clips with stepped timing and a hold line, the morph from a frame pair, the narration, then the edit and a claims check.

output_shape: |
  STAGE 0  SCRIPT IN   Places <...> | Movers <...> | Morph <shot, or none>
  STAGE 1  AVATAR CARD (approve)
           Lead: role <...> | age <...> | look <...> | clothes <...>
           item <...> | voice <none> | never changes <...>
           Crowd: <3 or 4 base figures>
  STAGE 2  REFERENCE IMAGES  <prompt>  Make <3 or 4>. Pick: <which, why>
  STAGE 3  SHEETS AND LOCK LINES (approve)
           SET <...>  LIGHT <...>  PALETTE <...>  LENS <...>
           LEAD <full description>
           Sheets <lead angles, crowd, product views, each set>
  STAGE 4  STORYBOARD (approve)
           F<n> <camera>, <figure, held pose>, in <set>. [SET] [LIGHT]
           [PALETTE] [LENS]   Card <n>: <framing> | mover <...> | "<line>" | <s>
           SCENE CHANGE <shot> > <shot>: <cut / match cut / morph / wipe>
  STAGE 5  CLIP <n> (<s>, start F<n>, last <frame or none>)
           [MOTION] Beat 1 <...> Beat 2 <...> Camera <one> [HOLD]
           VOICE <...>  EDIT <order, captions, end card, safe zone>
           MISSING: <anything the inputs didn't give>
  CHECKS MISSED  <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Script: the 10-line office-sink script from "Get a clay town ad
    script with a crowd". Places: the office kitchen (lines 1 to 4),
    Dev's desk (lines 6 to 10). Line 5 is the morph: the shaker in
    Dev's hand squashes into a flat daily pack.
    Set card: figures a hand tall, chunky props, handled finish,
    water as clear gel, soft morning key light from a window.
    Cast note: Dev, a clay adult man, about 30, slim, warm brown clay
    skin, short black clay hair with comb grooves, a mustard knit
    jumper of real fabric, navy clay trousers, a lanyard. Crowd: four
    base figures (tall, short, round, slight).
    Photos: pouch front, side and top; a daily pack in a hand.
    Pouch label: big yellow "Sprout" wordmark on deep green, yellow
    bear face top right, "28 Daily Packs" at the bottom.
    Daily pack label words: not captured.
    Colours: forest green #00582D, warm cream #FFF7DF, sunflower
    yellow #FFCC2E. Tool: 5-second clips, first and last frame: yes.
    Approvals: run all six stages in one go. I'll review the marked stops.
  output: |
    STAGE 0  SCRIPT IN  Places: kitchen, desk. Movers: crowd in 1,
    hands in 2, Dev in 3 and 4, the shaker in 5. Morph: shot 5.

    STAGE 1  AVATAR CARD (approve)
    Lead: Dev, an office worker late for a meeting, about 30, slim,
    warm brown clay skin, short black clay hair with comb grooves,
    a mustard knit jumper of real fabric, navy clay trousers. Item: a
    lanyard. Voice: none; mouth sculpted closed. Never changes: the
    jumper, the lanyard, the hair grooves. Crowd: four base figures,
    tall, short, round and slight, each face distinct.

    STAGE 2  REFERENCE IMAGES
    [LEAD], standing, front on, plain cream backdrop. [SET] [LIGHT].
    Make 4. Pick: the one whose slump reads clearly from the side.

    STAGE 3  SHEETS AND LOCK LINES (approve)
    SET      A handmade stop-motion miniature set, figures about a hand
             tall, some thumbprints on matte modelling clay, felt and
             real woven fabric, chunky oversized props, running water
             as clear gel, photographed on a real tabletop set with a
             macro lens.
    LIGHT    One soft key light from a window on the left, a gentle
             fill from the right, bright morning.
    PALETTE  Forest green, warm cream, sunflower yellow, mustard, navy.
    LENS     Shallow focus, subject sharp, background softly blurred,
             camera inside the miniature world at clay chest height.
    LEAD     Dev, a clay adult man, about 30, slim, warm brown clay
             skin, short black clay hair with comb grooves, a mustard
             knit jumper of real fabric, navy clay trousers, a lanyard.
    Sheets: Dev front, three-quarter left and right, side, back,
    slumped and stepping aside, the pouch about his forearm's length;
    the crowd side by side; the pouch front, side, top under a printed
    paper label reading "Sprout", a bear face, "28 Daily Packs"; the
    kitchen and the desk, empty.

    STAGE 4  STORYBOARD (approve)
    F3 Medium at clay chest height, [LEAD], slumped on the counter
    with elbows wide, eyes on a blank clay clock, a clay shaker held
    low, in the kitchen, two soft queue figures behind. [SET] [LIGHT]
    [PALETTE] [LENS]
    Card 3: medium | mover: Dev | eyes lift, shoulders sink, hold;
    the queue holds still | "Dev is fourth in line..." | 4.5 s
    SCENE CHANGE 4 > 5: morph. First frame: close on Dev's clay hand
    holding the shaker. Last frame: same hand and camera, holding a
    flat clay daily pack seen from its top edge.
    SCENE CHANGE 7 > 8: match cut, Dev on the same spot at his desk.

    STAGE 5  CLIP 5 (1.5 s, first and last frame as above)
    [MOTION] The clay shaker squashes down and flattens into the daily
    pack in a few stepped poses. Camera: locked off. HOLD: Same figures
    as the references. Every surface stays clay, felt or fabric.
    Mouths stay still. Labels stay as printed. Takes: 3.
    VOICE  Narrator recorded separately in a stock voice. No figure
    speaks, so no lip-sync.
    EDIT  Shots 1 to 10 with the planned changes. Captions inside the
    safe zone. End card with line 9: [FIRST-ORDER PRICE] first order with
    [SIGN-UP TERMS]. Renews at [RENEWAL PRICE] every [PERIOD]. MISSING:
    exact offer terms; check them against the ad platform's policy before use.
    MISSING: the daily pack's label words. It is shown from its top
    edge in shots 5 and 6 until they're supplied.
    CHECKS MISSED  none
    (cut for length: the full run also had frames, cards and clips
    for shots 1, 2, 4 and 6 to 10, with the lock lines and LEAD line
    pasted in full where this shows [SET], [LIGHT], [PALETTE], [LENS]
    and [LEAD])

output_sample:
  input:
    - "Your narrated clay-town script, with its set card and cast note"
    - "Photos of your product (front, side, top) with every label line typed out"
    - "How the product is used"
    - "Your brand colours and your video tool's clip lengths (optional)"
  prerequisites:
    - "A script from the Clay town video ad script writer, for the best start"
    - "An image tool and a video tool to make the pictures and clips"
  output:
    - name: "Avatar card"
      contains: "The lead's role, look, clothes and what never changes, plus a crowd of 3 or 4 base figures."
    - name: "Reference image prompts"
      contains: "Prompts for 3 or 4 clay images of the lead, and which one to pick."
    - name: "Sheet prompts and lock lines"
      contains: "Character, crowd, product and set sheets, with the set, light, palette, lens and lead lines."
    - name: "Storyboard"
      contains: "A frame prompt and shot card for every shot, with the planned scene changes."
    - name: "Clip prompts"
      contains: "One prompt per clip with stop-motion timing, counted beats, one camera move and a hold line."
    - name: "Edit list"
      contains: "Clip order, captions, voice, end card, safe zones and any MISSING lines."
    - name: "Checks missed"
      contains: "One line for each check the prompts still fail, or none."

tweaks:
  - what: The finish
    how: Crisp gives fine tool lines for a premium feel. Handled adds some thumbprints. Rough gives big prints and lumpy shapes for a silly brand. The SET line changes with it.
  - what: The palette
    how: Give your brand colours and the set is built around them. Without them it proposes three to five colours and marks them "proposed".
  - what: Scene changes
    how: Ask for a cut, a match cut or a pass-by wipe between shots. Keep the clay morph for the one moment that matters, usually when the product arrives.
  - what: Clip length
    how: Give the shortest clip your tool makes well. Clips of 2 to 5 seconds with one action hold the clay look far better than long ones.

judge:
  - It stopped for your approval after the avatar card, the sheets and the storyboard, or marked those three stops if you asked for one go.
  - The set, light, palette and lens lines are word for word the same in every prompt.
  - The lead's full description appears wherever they do.
  - Every shot card names one mover, and everyone else holds still.
  - The label lines are written out exactly, and there's at most one clay morph, built from a first and last frame.

test:
  - Make the character sheet and two storyboard frames. If Dev's face differs between them, fix the lead line before making clips.
  - Make one clip and watch the background. If the crowd moves when it shouldn't, strengthen the "holds still" part of the card and remake it.
  - Compare the label on the product sheet with your real pack, word by word.
  - Watch one clip at full size. If it looks like smooth computer graphics, check the motion line is there word for word.

improve:
  - Write your chosen finish and palette into stage 3 of the skill file, so every clay ad you make matches.
  - Save the approved character and crowd sheets with your brand files, so the same figures come back and new ads start at stage 4.
  - Add your product's label lines and "never show" list to "What you need", so the product sheet is right first time.
  - Pair it with the skill that writes a clay town ad script first, and one that adds captions in your brand font afterwards.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Takes up to 14 reference images and keeps up to four characters the same, so your sheets and frames match. Check the current limit in the tool."}
    - {name: "Veo", why: "Takes a first and a last frame, so a planned change starts and ends exactly where you want. Check that your plan includes it."}
    - {name: "Kling", why: "Takes up to 7 reference images in one video job, so figures and product stay the same from shot to shot. Check the current limit in the tool."}
    - {name: "ElevenLabs", why: "Reads the narration in a stock voice from its library, with tags for pauses and pace."}
  inputs:
    - "Photos of real stop-motion clay figures you like, so the finish line names marks that exist"
    - "The flat label artwork, so the clay product and the edit keep every label line right"
    - "The recorded narration before you make clips, so each clip is timed to its line"

terms:
  - term: Avatar card
    meaning: A short description of who carries the ad (look, clothes, props, voice, what never changes). You approve it before any image is made.
  - term: Set bible
    meaning: Four fixed lines (set, light, palette, lens) pasted into every prompt so all shots look like one set.
  - term: Mover
    meaning: The one figure or object that moves in a shot. Everyone else holds still.
  - term: First and last frame
    meaning: Two images you give a video tool so it makes the motion between them. Used here for the clay morph.
  - term: 180° line
    meaning: An imaginary line through the action. Keeping the camera on one side of it stops people and things swapping sides between shots.
