new_slug: claymation-video-ad-script-writer
name: "Claymation video ad script writer"
summary: "Paste your idea and product facts. Get a claymation video shot table and a cast note."
job: make-video-ads

headline: "Claymation video ad script writer"
subhead: Give it your selling idea and product facts. It picks one clay object that changes shape on camera to show the problem or the fix, and writes the narration and shots for one silent clay character. You get a shot table, a cast note and any check it missed.

explain: |
  Some products work in ways a camera can't film. Vitamins your body absorbs, a coating inside a pan, a habit that slowly gets easier. Ads for these end up as someone talking about it, and people scroll past.

  Claymation (clay figures moved a little between frames, like a stop-motion film) can show what a camera can't, because clay can change shape right in front of you. This skill builds the whole ad around one clay object on a small handmade set: a tangle that loosens, a stack that squashes flat. It plans the set the way a stop-motion crew would, with one finish, clear gel for water and cotton wool for steam, and only one thing moving in each shot. A narrator tells the story, the clay character acts it out without speaking, and your product keeps its real label. The picture never shows more than your approved claims say.

when:
  - Your product's benefit is real but invisible, and talking-head ads about it fall flat.
  - You want a gentle, eye-catching way to show a problem to people who haven't thought about it much yet.
  - You want a script your video tool can follow shot by shot, with one clay set that never changes.

you_give:
  - The selling idea, or a script you already have
  - Your product facts, approved claims and claims you must never make
  - Who the buyer is and the moment the problem hits them
  - A photo of your product (attach it; your AI can see pictures)
  - Your offer and guarantee, in their real terms (optional)
  - The length (optional)
you_get:
  - The changing object, with its before, changing and after states
  - One character sentence and a set plan with its finish, stand-ins and two palettes
  - A shot table with seconds, narration, picture, what moves and on-screen text
  - A cast note on who carries the ad, ready for the shots skill
  - Any of its own checks the script still misses, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts and your approved and banned claims underneath.
  - Describe the buyer and the moment the problem bites, in one or two sentences.
  - Say the length, such as "30 seconds", and paste your real offer terms if you want one.
  - Check the changing object first. If a stranger couldn't tell what changed with the sound off, ask for a different object.
  - Take the script and cast note to "Claymation video clip prompt writer". It takes it from there, with the avatar, sheets, storyboard and clips.

how_it_works:
  - title: Checks clay fits
    text: Clay suits a hidden cause or a small everyday problem. If your selling point needs a real face or is only a price, it says so.
  - title: Picks the changing object
    text: One clay object that stands for the problem, with three states, changing by clay moves like squashing or unknotting.
  - title: Keeps it inside your claims
    text: The change on the set counts as a claim, so it shows only what your approved claims say.
  - title: Casts one silent character
    text: One clay adult who looks like your buyer, never a child or a real person, who never speaks or gives a testimonial.
  - title: Sets the stage once
    text: One small set, one finish (crisp, handled or rough), model-maker stand-ins, and your product with its real label.
  - title: Writes makeable shots
    text: Shots of 3 to 6 seconds, one thing moving in each, one clay morph at the swap at most.
  - title: Writes the cast note
    text: Who carries the ad, the clay character or the changing object, why, the narrator's voice and what never changes.

output_shape: |
  FIT        <why clay suits this idea and buyer, or what to use instead>
  OBJECT     <one clay object>
             Before: <...>  Changing: <...>  After: <...>
  CHARACTER  <one sentence, reused unchanged>
  SET        <pieces, finish, stand-ins, before and after palettes>
  PRODUCT    <clay prop with printed label, or real photo lit to match>

  Shot | s | narration | picture | mover | state | on-screen text
  1 | <n> | "<line>" | <what's on screen> | <the one thing that moves> | before | -
  ...
  <the swap, marked MORPH if used>
  <last: offer over the character with the product, then a held pose>

  <total seconds and word count>

  NOTES
  - Claims used: <each claim and its source>
  - <anything left out on purpose, and why>
  - MISSING: <facts the script needed>

  CAST NOTE  <who carries it, why, voice, what never changes>

  CHECKS MISSED: <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Idea: people who quit greens powder. The tub, the shaker, the chalky
    glass, then the tub sits half used.
    Buyer: 28 to 45, office job, has quit powders and pill stacks.
    Wants one habit that lasts.
    Product: Sprout, daily greens gummies. Pouch of 28 daily packs. Tear
    one pack straight across the top, tip the small handful of green
    gummy bears into your palm. No water, no mixing, no shaker.
    Pouch: glossy deep green, big yellow wordmark, "28 Daily Packs".
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g fiber" in
    1 pack.
    Offer: $29.99 first order with the text sign-up discount, renews at
    $49.99 every 4 weeks.
    Brand line: "Rip. Tip. Enjoy."
    Colours: forest green #00582D, cream #FFF7DF, sunflower #FFCC2E.
    Video, 30 seconds.
  output: |
    FIT        A buyer who has tried the old fix, and a routine problem
               told as a story. Clay fits.
    OBJECT     A leaning grey clay tower on the counter: powder tub,
               scoop and shaker.
               Before: it teeters.  Changing: it squashes down into
               the counter.  After: a clear counter, the pouch on it.
               (It shows the routine getting simpler. Nothing on file
               says the pack replaces a powder's nutrients.)
    CHARACTER  A clay man, 6 heads tall, slim, warm beige clay, short
               dark hair as one shape, rust jumper, grey trousers, bead
               eyes, a small clay watch.
    SET        A kitchen counter, a shelf, a sink and a window. Handled
               finish. Water in the sink as clear gel. Before: blue-grey
               with one dull khaki. After: forest green, cream and
               sunflower.
    PRODUCT    The real pouch photo, lit to match the set.

    Shot | s | narration | picture | mover | state | on-screen text
    1 | 3 | "You bought the powder. And the shaker." | whole set, he
        stands at the counter beside the teetering tower | tower |
        before | -
    2 | 3 | "Then it sat there, half full." | the tub very close, a
        clay ring of dust round its base | tower leans | before | -
    3 | 3 | "Chalky glass. One more thing to wash." | character close,
        nose wrinkled, shaker at arm's length | character | before | -
    4 | 3 | "So he tried one small pack instead." | hands at the pouch,
        within reach; he takes one daily pack | character | before | -
    5 | 3 | "Rip. Tip. Enjoy." | hands: he tears the pack straight
        across the top, green bears tip into his palm | hands | - | -
    6 | 4 | "No water. No mixing. No shaker." | MORPH: the tower
        squashes down into the counter in stepped poses, cream and
        green spreading | tower | changing | -
    7 | 4 | "Sixty-plus ingredients, 21 vitamins and minerals, 6 grams
        of fiber." | the clear counter, pouch front to camera | colour
        settles | after | -
    8 | 4 | "First order, $29.99 with text sign-up." | the character
        beside the pouch, bears in his palm | character | after |
        $29.99 first order with text sign-up. Renews at $49.99 every
        4 weeks.
    9 | 3 | "For anyone with a half-used tub." | held pose: keys in
        hand, pouch on the counter | none | after | -

    30 seconds, 58 words.

    NOTES
    - Claims used: "60+ ingredients, 21 vitamins & minerals, and 6g
      fiber" (label). The no-water, no-shaker routine (product facts).
    - Tearing follows the brand's rule: straight across the top only.
    - The doubt "can a gummy hold enough?" is left for another ad.
    - MISSING: what a single daily pack looks like, needed before
      shots 4 and 5 can be made.

    CAST NOTE  The clay man carries it, silent, with a narrator. The
    powder quitter sees his own half-used tub in the tower beside
    him, and the narrator keeps every claim out of a clay mouth.
    Narrator: a warm, wry adult voice, unhurried. Never change: the
    character sentence and the handled finish.

tweaks:
  - what: The changing object
    how: Ask for three objects first, then the script for the clearest one. Pick the one a stranger would read on mute.
  - what: The finish
    how: Say crisp, handled or rough. Crisp suits premium and food brands, rough suits snacks, gifts and playful brands.
  - what: Want a still instead?
    how: Use "Clay scene image ad maker", which makes one clay image ad on this same set.
  - what: The length
    how: Under 20 seconds it drops the story and gives you problem, change, offer. At 60 seconds the problem can run up to 20 seconds.

judge:
  - You can say in one sentence what the object is and what changes it.
  - The three states are marked, and the change happens in front of the camera.
  - Each shot has one thing moving, and there's one morph at most.
  - The character never talks, never says the product worked for them, and isn't a child.
  - Every picture matches an approved claim, and the product keeps its real label.

test:
  - Give it a plain price offer as the selling idea. It should tell you clay doesn't fit.
  - Read only the picture column with the narration covered. You should still see what went wrong and what fixed it.
  - Run it twice on the same input. The object can differ, but both should keep the character silent and stay inside your approved claims.
  - Read the narration aloud against the seconds column. Lines that run over need cutting.

improve:
  - Paste your approved and banned claims into "What you need" in the skill file, so every picture is checked against them.
  - Add your product's never-show rules to step 6. For Sprout, the pack is only ever torn straight across the top.
  - When a changing object works, save it with its three states in your brand file, so the next ad reuses it.
  - Pair it with "Claymation video clip prompt writer", which runs the avatar, sheets, storyboard and clips.

works_best_with:
  tools:
    - {name: "Claude", why: "Follows long skill files closely and keeps every picture tied to a claim you gave it."}
    - {name: "ElevenLabs", why: "Reads the narration aloud in a steady voice, so you can check each line fits its seconds."}
  inputs:
    - "A photo of a single pack being opened, so the hands shots copy your real steps"
    - "Two or three reviews about the old routine, so the failed fixes are ones buyers really tried"
    - "The pack's real size in centimetres, so the set is built to the right scale"
    - "Your never-show list, so the set leaves out anything your brand avoids"

terms:
  - term: Claymation
    meaning: Animation made with clay figures that are moved a little between each frame, so they look handmade.
  - term: Morph
    meaning: One clay shape squashing and reshaping into another on camera.
  - term: Stand-in
    meaning: A material a model-maker uses in place of the real thing, such as clear gel for water.
  - term: Approved claims
    meaning: The exact sentences your legal or compliance check says you may use about the product.
