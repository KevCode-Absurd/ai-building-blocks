new_slug: claymation-video-clip-prompt-writer
name: "Claymation video clip prompt writer"
summary: "Paste your clay script and attach product photos. Get matching clip prompts and an edit list."
job: make-video-ads

headline: "Claymation video clip prompt writer"
subhead: Give it a claymation ad script and photos of your product. It fixes one clay character, set and product, then builds reference images, sheets, a storyboard and stop-motion clip prompts, stopping three times for your OK. You get every prompt, an edit list and any check it missed.

explain: |
  AI video tools drift. The character's hair changes between clips, clay turns into shiny plastic, your label gets redrawn with wrong letters, and the one change the ad depends on happens off screen. You end up paying for the same clip again and again.

  This skill runs the whole process in six stages, the way a stop-motion crew would. It writes fixed lines for the set, light and lens, with one clay finish and named stand-ins (water as clear gel, steam as cotton wool). It writes a card for the clay character and waits for your OK. Next come a sheet with the character from every angle, a product sheet and the set before and after, plus lock lines. You approve those, then a storyboard where only one thing moves in each shot. Only then does it write clips with stepped clay timing, and the one morph from a first and last frame.

when:
  - You have a claymation script and want to make it with AI image and video tools.
  - Your earlier clips kept changing the character, the set or the product label.
  - You want the change in the ad (a knot loosening, a tower squashing flat) to happen on camera, at clay speed.

you_give:
  - The script's shot table, with the changing object's three states, the character, the set, the product choice and the cast note
  - Photos of your product (front, side, top), every label line, and how it's used
  - Your colours, approved claims and what never to show (optional)
  - The clip lengths your video tool accepts (optional, 3 to 6 seconds by default)
you_get:
  - Fixed lines for set, light, lens and palettes, and an avatar card for the clay character
  - Reference image prompts, then sheets for the character, product and set, with lock lines
  - A storyboard with one still, one mover and counted beats per shot, and the morph's frame pair
  - Clip prompts and an edit list, with a fix list for each take
  - Any check the prompts couldn't meet, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the script from "Claymation video ad script writer", then attach your product photos and list the label lines.
  - Approve or change the character card, then make the reference images and say which you picked.
  - Make and approve the sheets and lock lines, then the storyboard stills.
  - Make each clip from its approved still, check it against the fix list, then cut them over the narration.

how_it_works:
  - title: Reads the script
    text: Lists each shot's mover and state, and writes the set, light, lens and palette lines with one clay finish and named stand-ins.
  - title: Writes the avatar card
    text: The clay character from the script's sentence, with clay hands, a silent mouth and the narrator's voice. It stops for your OK.
  - title: Makes reference images
    text: Three or four images of the character on a plain backdrop. You pick one.
  - title: Builds the sheets
    text: The character from five angles, your product as a labelled clay prop or its real photo, and the set before and after, with lock lines. It stops for your OK.
  - title: Draws the storyboard
    text: One still per shot, one mover, counted beats, one camera instruction, and the morph's first and last frame. It stops for your OK.
  - title: Turns it into video
    text: Clips with stepped clay timing and a hold line, narration laid on in editing, and a fix list for every take.

output_shape: |
  STAGE 0  FIXED LINES  SET: <finish, stand-ins, no words>  LIGHT: <..>
                        LENS: <..>  PALETTES: Before <..> After <..>
  STAGE 1  AVATAR CARD  <the script's sentence, clay hands, silent,
                        narrator's voice, never change>
                                                 > STOP for approval
  STAGE 2  REFERENCES   <3 or 4 prompts>  Picked: <n>
  STAGE 3  SHEETS       Character: <5 angles, poses, size>
                        Product: <clay prop or photo, label lines>
                        Set: <before state, after state>
           LOCK LINES   CHARACTER, SET, LIGHT, LENS, PALETTES, PRODUCT
                                                 > STOP for approval
  STAGE 4  STORYBOARD
           SHOT <n> (<state>, mover: <..>)  Still: <camera, who,
           pose or state, place> + lock lines. Beats: <..>
           MORPH  <first frame, last frame> or none
                                                 > STOP for approval
  STAGE 5  CLIP <n> (<s>)  Attach: <image = job>. Motion line. Beats.
                           Camera. Hold line. Sound.
           EDIT LIST  <order, offer text, safe zones, fixes>
  CHECKS MISSED: <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Script (30 s, from "Show what your product does, in a clay
    animation ad"):
    Object: a leaning grey clay tower of powder tub, scoop and shaker.
    Before: it teeters. Changing: it squashes down into the counter.
    After: a clear counter, the pouch on it.
    Character: a clay man, 6 heads tall, slim, warm beige clay, short
    dark hair as one shape, rust jumper, grey trousers, bead eyes, a
    small clay watch. Cast note: he carries it, silent, with a narrator.
    Set: kitchen counter, shelf, sink, window. Handled finish. Water in
    the sink as clear gel. Before: blue-grey with one dull khaki.
    After: forest green, cream and sunflower.
    Product: the real pouch photo, lit to match the set.
    Shots: 1 whole set, tower teeters (mover: tower) ... 5 he tears
    the pack straight across the top, bears tip into his palm (hands)
    | 6 MORPH: the tower squashes into the counter (tower) ... 9 held.
    Pouch photo attached: glossy deep green, big yellow wordmark,
    "28 Daily Packs". Tool: 4 to 6 second clips, 9:16, 3 references,
    first and last frame.
  output: |
    STAGE 0  FIXED LINES
    SET: a handmade stop-motion tabletop kitchen (counter, one shelf,
      a sink, a window shape), matte modelling clay with some
      thumbprints, photographed with a macro lens. The water in the
      sink is clear gel. No words anywhere on the set.
    LIGHT: one soft key light from the left, a gentle fill from the
      right, bright and sunny.
    LENS: shallow focus, background softly blurred, camera at his eye
      level on a stand. The edges of the set never show.
    PALETTES: Before: blue-grey, cool grey, one dull khaki (the tub).
      After: forest green #00582D, cream #FFF7DF, sunflower #FFCC2E.

    STAGE 1  AVATAR CARD
    CHARACTER: a clay man about 6 heads tall, slim, warm beige clay
    skin, short dark hair as one smooth shape, rust jumper, grey
    trousers, black bead eyes, a small clay watch on his left wrist;
    chunky clay hands with rounded fingertips. Silent. Narrator: a
    warm, wry adult voice. Never change: the watch on his left wrist.
    > STOP: approved.

    STAGE 2  REFERENCES (4; picked 2, the clearest outline)

    STAGE 3  SHEETS
    Character: front, three-quarter left and right, side, back; head
      tilted up, nose wrinkled; beside the pouch, which reaches his
      shoulder.
    Product: the Sprout pouch exactly as in the attached photos, lit by
      the set's key light from the left, no letter redrawn.
    Set: the counter with the grey tower teetering (before); the same
      counter clear, cream and green, the pouch on it (after).
    LOCK LINES: CHARACTER, SET, LIGHT, LENS, PALETTES as above;
      PRODUCT: the pouch as the product sheet, shoulder high to him.
    > STOP: approved.

    STAGE 4  STORYBOARD (2 of 9 shots)
    SHOT 1 (before, mover: the tower)  Still: 9:16, wide on the whole
      set. The man stands at the counter, one hand on it, head tilted
      up at the teetering tower; the pouch beside his hand. [LOCK
      LINES] Beats: rocks left, rocks back, holds leaning. Locked off.
    SHOT 6 (changing, mover: the tower)  MORPH. First frame: the tower
      on the counter, before palette. Last frame: the clear counter,
      cream and green, the pouch front on. Locked off.
    Continuity: the pouch stays shoulder high and label to camera; he
      holds the torn pack in his left hand from shot 5.
    > STOP: approved.

    STAGE 5  CLIP 1 (4 s)  Attach image 1 = the man, image 2 = the
      set, image 3 = the pouch. Stop-motion timing: the clay moves in
      small stepped poses, about 12 new poses a second, with a faint
      shimmer between poses. The camera moves smoothly. Beat 1 the
      tower rocks left; beat 2 it rocks back; beat 3 it holds, leaning.
      Camera: locked off. Same character, set and product as the
      references. Every surface stays clay or its stand-in. His mouth
      stays still. The label stays as printed. Sound: a faint creak.
    EDIT LIST: nine clips over the narration in order, 30 seconds. On
      screen over shot 8, inside the safe zone: "$29.99 first order
      with text sign-up. Renews at $49.99 every 4 weeks."
    MISSING: a photo of a single daily pack. Until it's supplied,
    shot 5 can't match the real pack.

    (cut for length: the full run also had shots 2 to 5 and 7 to 9,
    and the other clip prompts)

tweaks:
  - what: The product choice
    how: Say "clay prop" to sculpt the pack in clay wrapped in its printed label, or "real photo" to use your photo lit by the set. The script usually decides; this changes only the product sheet and line.
  - what: The finish
    how: Crisp (fine tool lines) suits premium and food, handled (some thumbprints) most everyday goods, rough (big thumbprints) silly brands. One finish for the whole ad.
  - what: The clip length
    how: Give your tool's limits, for example "5 second clips". Each shot stays one action, so longer clips just hold the end pose longer.
  - what: Never-show list
    how: Paste the things your brand never shows (a body changing, a pack opened the wrong way). It writes them out of every prompt and describes what to show instead.

judge:
  - It stopped for your OK after the avatar card, the sheets and the storyboard, or marked each "(approve)" if you asked for every stage at once.
  - The lock lines appear word for word in every still and clip prompt.
  - Each clip has one mover and one camera instruction, and there is at most one morph, made from a first and last frame.
  - The product follows its one product line in every shot, with the label exactly as printed.
  - The change happens in view, by a clay move, and never pops or vanishes.

test:
  - Run it on a script where you already know the changing object and its three states. The before set sheet should show the same object in the same state.
  - Make the sheets before any clip. If the clay looks like shiny plastic or the label has new letters, fix the lock lines now, while it's cheap.
  - Run it twice on the same script and compare the lock lines. They should say the same thing both times.
  - Make only the morph clip and watch it muted. If someone can't say what changed, the change was too fast or happened off screen.

improve:
  - Write your product line into stage 3 of the skill file once (shape, colours, label lines, size against a hand), so every run starts with it.
  - Add your brand's never-show rules to the Avoid list, for example that the daily pack is only ever torn straight across the top.
  - Save the approved avatar card, sheets and lock lines in your brand file, so the next clay ad starts at stage 4.
  - Pair it with "Claymation video ad script writer" first, so the changing object and its three states are settled.

