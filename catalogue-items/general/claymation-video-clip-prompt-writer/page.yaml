    - {name: "Veo", why: "Takes a first and a last frame, so the one morph starts and ends exactly where you planned."}
    - {name: "Kling", why: "Takes several reference images in one job, so the character and product hold from shot to shot."}
    - {name: "ElevenLabs", why: "Reads the narration at a steady pace you can time the clips to."}
  inputs:
    - "The flat label artwork, so a clay prop's printed label carries every line correctly"
    - "Photos of real clay figures you like, so the finish line names marks that exist"
    - "The recorded narration before you make clips, so each clip is timed to its line"

terms:
  - term: Avatar card
    meaning: A short, fixed description of the clay character and the narrator's voice, approved before any image is made.
  - term: Lock lines
    meaning: Short descriptions of the character, set, light, lens and product, pasted unchanged into every prompt so all shots match.
  - term: Stand-in
    meaning: What a model-maker uses for a hard material, such as clear gel for water or cotton wool for steam.
  - term: Morph
    meaning: One clay change where the old thing squashes and reshapes into the new state, made from a first and last frame.
