name: "Video script writer from a competitor ad idea"
new_slug: competitor-idea-video-script
summary: "Turn a competitor ad you admire into a new video script. It borrows one idea, writes from your own facts, and checks nothing else is copied."
job: study-competitors
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Video script writer from a competitor ad idea"
subhead: Give it a real ad you admire, as a screenshot or its words, plus your reviews and facts. It finds the one idea that made the ad work and writes a new video script from your research. You get the script, a five-line copy check and a list of what's missing.

explain: |
  "Make something like this" goes wrong in two ways. The new ad keeps too much of the old one, or it drifts so far that the good part is lost. Either way the ad you liked taught you nothing.

  This skill keeps one thing: the move that made the ad work, such as saying the buyer's doubt out loud before answering it. It writes that move as one sentence that would make sense for any product. Then it checks your brand has a true fact or a real quote to carry it. The script comes from your own reviews and facts, and a distance check confirms nothing else came across. Copyright covers the wording of an ad and leaves the idea under it free to use.

  It works best from a real ad. Notes like "science-first brand" or "creator videos" describe a company, not an ad, so it asks once for one. Without one, it writes from your research, marks the gap and tells you what to collect. If you want the same parts in the same order, use the skill that borrows an ad's structure instead.

when:
  - A teammate shares an ad and says "something with this energy".
  - You've studied competitor ads and want one idea from them without copying anyone.
  - You want to test whether a move from another category works for your buyer.
not_for:
  - 'You only have notes about a brand, like "science-first", and no ad you have seen: collect one real ad from the Meta Ad Library first, or give your own words about an ad you saw.'
  - "You want to keep the ad's rows, order and pace: use the Competitor video script adapter."
  - "You have no customer reviews or product facts: gather a few real quotes and facts first, or the proof lines will be marked missing."
  - "Your script would make vitamin, health or money claims you have not checked: run each claim past the label and your local rules first, because this skill checks copying, not claim rules."

you_give:
  - A real ad, as a screenshot, a video, its words with where you saw them, or a breakdown card (attach the screenshot; your AI can see pictures)
  - Your customer reviews or survey answers, copied as written
  - Your product facts, proof, offer, guarantee and the claims you may make
  - What not to borrow, and the script length and speaker (optional)
you_get:
  - The one idea borrowed, in a sentence, with the fact it rests on and where it acts
  - A new script with the belief it changes, every line sourced, opening variants and a test plan
  - A five-line distance check and a list of anything missing
  - A list of any of the nine checks still missed, or none

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the ad you admire, or its screenshot, with where you saw it. A breakdown card from the competitor study works too.
  - Paste your reviews and product facts underneath. Add anything you don't want borrowed.
  - Read the idea line first. If it isn't what you liked, say what you liked and run it again.
  - Check all five distance lines say yes before you film anything.
output_sample:
  input:
    - "A real ad you admire: a screenshot, its words with where you saw it, or a breakdown card"
    - Your customer reviews or survey answers
    - Your product facts, proof, offer, guarantee and allowed claims
    - What not to borrow, and script length and speaker (optional)
  prerequisites:
    - A real ad someone saw, with an ID, a link or its own words
    - Your brand facts, or the Org context builder result (helps, not required)
  output:
    - name: REFERENCE
      contains: The ad you studied, with its source, and one line on what it does.
    - name: IDEA BORROWED
      contains: The one idea in a sentence, the fact of yours it rests on, and where it acts.
    - name: SCRIPT
      contains: The belief shift, a beat table with sourced lines, opening variants, a selling beat and a test plan.
    - name: DISTANCE CHECK
      contains: Five yes or no lines showing nothing but the idea came across from the ad.
    - name: MISSING
      contains: Every gap marked in the work, or none.
    - name: CHECKS MISSED
      contains: Each of the nine checks that failed or could not run, or none.

how_it_works:
  - title: Checks there is a real ad
    text: It looks for an ad someone saw, with an ID, a link or its own words. Without one it asks once, then carries on from your research and lists what to collect.
  - title: Lists the ideas
    text: For each ad, one sentence on how it wins attention or belief, tied to what's on screen.
  - title: Picks the one you can back
    text: The winner rests on a true fact or quote of yours and answers a doubt your buyers voice.
  - title: Writes the script
    text: The idea shapes one or two parts. The order, lines and proof come from your own research.
  - title: Checks the distance
    text: Five yes or no lines on order, wording, claims, people and shots, and your do-not-borrow list.
  - title: Runs nine checks
    text: Checks the reference, the idea, the part it shapes, the sources and the five distance lines, and names any check still missed.

output_shape: |
  REFERENCE
  Ad: <advertiser, ID or link, start date, or its words quoted> | What it does: <one line>

  IDEA BORROWED
  <one sentence>
  Rests on: <your fact or quote, with source>
  Where it acts: <one or two parts>
  Other ideas considered: <idea | why not>

  SCRIPT
  Belief shift: Now they believe ___. After this ad they believe ___.
  Assumed: <...>
  | Beat | Spoken line | On-screen text | Picture note | Evidence |
  Opening variants: <...>  Selling beat: <...>
  Test plan: <...>  Placeholders: <...>

  DISTANCE CHECK
  Order of parts differs from the reference: <yes/no>
  No run of 5 or more words from it: <yes/no>
  No claim, number, price or offer term from it: <yes/no>
  No person, story, shot, music or sound from it: <yes/no>
  Nothing from "do not borrow": <yes/no>

  MISSING
  <every MISSING line, or none>

  CHECKS MISSED
  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Reference ad: Sprout's own live ad, headline as written: "'Sprout
    is too expensive': here's 61% off to prove otherwise". Public Meta
    Ad Library, 15+ copies live. (No competitor ad was on
    file, so this uses one of ours.)
    Don't borrow: the discount or the price doubt.
    Research: buyer doubt from the org context, "A gummy can't hold
    enough to replace my powder." Review: "[Sprout] has been the one
    thing I've been able to stick to."
    Facts (the daily-value figures are printed on the label and are on
    the allowed-claims list): one pack is about 100% of daily value for vitamins, about
    25% for minerals. 6g fiber. Survey of 3,000+ customers: 80% of
    surveyed users take it daily. Offer: $29.99 first order with text
    sign-up, then $49.99 every 4 weeks; 30-day money-back, first order
    only. Buyer stage: solution aware. Length: 20 seconds. Speaker:
    narrator.
  output: |
    REFERENCE
    Ad: Sprout, ID not on file, seen live, headline as written:
    "'Sprout is too expensive': here's 61% off to prove otherwise"
    | What it does: puts
    the buyer's complaint in quotes, in their words, then answers it.

    IDEA BORROWED
    Say the buyer's doubt out loud, then answer it with something they
    can check.
    Rests on: the "can a gummy hold enough" doubt (org context) and the
    label numbers (science page).
    Where it acts: the doubt and the answer.
    Other ideas considered: none (one ad given).

    SCRIPT
    Belief shift: Now they believe a gummy can't hold enough. After
    this ad they believe it's honest about what it holds, and it's one
    they'd keep taking.
    Assumed: the minerals figure is shown, since an honest limit is
    what makes the answer believable.

    Beat | Spoken | On-screen | Picture note | Evidence
    Opening | "One reviewer says it's the one thing they've stuck
      with." | "[Sprout] has been the one thing I've been able to stick
      to." | Daily pack torn straight across the top, gummies into a
      palm | Review 1, brand site
    Doubt | "Fair question, though. Can a gummy hold enough?" | Can a
      gummy hold enough? | Palm held still, close | Org context, buyer 1
    Answer | "One pack: about 100% of daily value for vitamins.
      Minerals, about a quarter." | Vitamins ~100% DV. Minerals ~25%
      DV. | Plain cream card, one number at a time | Science page
    Proof | "And 80% of surveyed users take it daily." | 80% of
      surveyed users take it daily | Text card with the source line |
      Brand survey, 3,000+ customers
    Offer | "First order $29.99 with text sign-up, then $49.99 every
      four weeks." | 30-day money-back, first order only | Pouch on the
      counter | Product page price box, FAQ
    Action | "Start with one pouch." | Start Now | Pouch, front on |
      Site button

    Opening variants: doubt first | "Can a gummy hold enough?" | same |
      palm of gummies; habit | "Four in five surveyed users take it daily." |
      80% of surveyed users take it daily | pack on a desk
    Selling beat: the answer, where the minerals limit is said plainly.
    Test plan: against the offer-led ads. If it wins, try the same
    idea on the "will it upset my stomach" doubt next.
    Placeholders: none. Spoken words: 54, inside the 54-word budget
    for 20 seconds.

    DISTANCE CHECK
    Order of parts differs from the reference: yes (it opens on a
    review, and the doubt comes second)
    No run of 5 or more words from it: yes
    No claim, number, price or offer term from it: yes (no 61% off)
    No person, story, shot, music or sound from it: yes
    Nothing from "do not borrow": yes

    MISSING
    none

    CHECKS MISSED
    none

tweaks:
  - what: The reason you give
    how: Say what you liked in one line ("it admitted the price first"). It then checks the ad for that move. "Great energy" won't help, so it reads the idea from the ad itself.
  - what: What not to borrow
    how: List the reference's claims, offers, people and shots you want kept out. The last distance line checks each one.
  - what: More than one ad
    how: Give two or three ads. It lists an idea for each and picks the one your facts back best, with the others and why they lost.
  - what: When nothing transfers
    how: If none of the ideas has a true fact of yours behind it, it says so, asks once for the fact, and marks the proof MISSING. Give it a different ad, or use the customer-research script skill on its own.

judge:
  - REFERENCE names a real ad with an ID, a link or its own words.
  - The idea line would make sense for a product in another category.
  - The idea shapes one or two named parts, not the whole script.
  - Every number and quote has a source from your own facts.
  - All five distance lines say yes.

test:
  - Give it only notes about a brand, with no ad. It should ask once for an ad, then carry on with REFERENCE marked MISSING, the idea marked inferred, and a list of what to collect.
  - Read the idea line. It should not mention the reference's product, category or claims.
  - Give it an idea your brand has nothing true to back. It should say so, ask once for the fact, and mark the proof MISSING instead of making one up.
  - Put the script beside the reference. The order should differ and no five words in a row should match.

improve:
  - Keep a list of borrowed ideas in your org context, one sentence each, with the ad each came from and how its test went.
  - Add your customer quotes and facts with sources to the skill file, so step 2 always has a true fact to check.
  - Run the competitor study first, so this skill gets breakdown cards and the category's clichés to avoid.
  - Pair it with the read-aloud skill after the script, so every line is easy to say.

works_best_with:
  tools:
    - {name: "Meta Ad Library", why: "The free public place to see a real ad and note its ID and start date, browsed by hand."}
    - {name: "Any good chat AI", why: "The job is careful reading and writing from your facts, which any strong chat AI handles."}
  inputs:
    - "A screenshot or the first three frames of the reference ad, so the idea comes from what's on screen"
    - "Two or three reference ads instead of one, so it can pick the idea your facts back best"
    - "The cliché list from your competitor study, so it skips moves your category already overuses"
    - "Your claims list with what's allowed and what isn't, so the script stays inside it"

terms:
  - term: Reference ad
    meaning: A real ad, yours or someone else's, that you're learning from.
  - term: Distance check
    meaning: Five yes or no questions confirming the new script took nothing but the idea from the reference.
  - term: Buyer stage
    meaning: How much the buyer already knows about the problem and about you.
