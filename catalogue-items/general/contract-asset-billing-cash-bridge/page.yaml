new_slug: contract-asset-billing-cash-bridge
name: Contract asset billing cash bridge
headline: Contract asset billing cash bridge
summary: "Build a contract asset billing cash bridge: see how unbilled revenue turns into invoices and collections, with every gap and adjustment flagged."
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A contract-asset-to-billings-to-collections schedule with explicit completeness gates. Share contract-asset and receivable opening/closing balances, new unbilled revenue, direct invoices and all noncash adjustments.
explain: |-
  A contract-asset-to-billings-to-collections schedule with explicit completeness gates.

  Issuer revenue and cash-flow reconciliation. Illustrative figures. Contract assets30+100-40 imply90 transferred to invoices. Add200 direct invoices and opening receivables50, then subtract closing60: collections280. Closing contract assets50 lowers transfers and inferred collections by10.
when:
  - You need a contract-asset-to-billings-to-collections schedule with explicit completeness gates.
  - You work on issuer revenue and cash-flow reconciliation and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - You have no conditional payment terms, so nothing sits as a contract asset. Use a simple receivables roll-forward in a spreadsheet.
  - You want to forecast future cash. Use a cash-flow forecast, because this bridge only looks back at past periods.
  - You need to decide if revenue was recognized correctly. Ask your accountant or auditor, because this tool does not test contract recognition.
you_give:
  - Contract-asset and receivable opening/closing balances, new unbilled revenue, direct invoices and all noncash adjustments.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A contract-asset-to-billings-to-collections schedule with explicit completeness gates.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
output_sample:
  input:
    - Opening and closing contract asset balances
    - Opening and closing receivable balances
    - New unbilled revenue for the period
    - Direct invoices raised in the period
    - Write-offs, FX, factoring, tax and other noncash adjustments
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, to run the bundled calculation check (optional)
  output:
    - name: Scope and dated sources
      contains: The period, currency, scale, accounting basis and the dated source for each balance.
    - name: Inputs and assumptions
      contains: Every balance and flow you supplied, kept apart from assumptions, with gaps marked MISSING.
    - name: Model calculations and reconciliations
      contains: Transfers from contract assets to receivables, then inferred collections, with each reconciliation shown.
    - name: Editable workbook
      contains: A native spreadsheet with live formulas, an input schema and test cases for the calculation.
    - name: Actual file verification
      contains: The checks that ran on the workbook, such as recalculation, changed-input test and reopening the file.
    - name: "MISSING: and CHECKS MISSED"
      contains: Unresolved inputs and any check that failed or could not run, or the word none.
how_it_works:
  - title: 1. Read the conditional-payment terms and distinguish contract assets from unconditional receivables
    text: Read the conditional-payment terms and distinguish contract assets from unconditional receivables.
  - title: 2. Reconcile opening contract assets plus new unbilled revenue less closing contract assets to transfers into receivables, adjusting all noncash movements separately
    text: Reconcile opening contract assets plus new unbilled revenue less closing contract assets to transfers into receivables, adjusting all noncash movements separately.
  - title: 3. Add direct invoices to transfers and roll receivables from opening to closing to infer collections; reconcile write-offs, FX, factoring and tax differences before accepting the result
    text: Add direct invoices to transfers and roll receivables from opening to closing to infer collections; reconcile write-offs, FX, factoring and tax differences before accepting the result.
output_shape: |-
  A contract-asset-to-billings-to-collections schedule with explicit completeness gates.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Transferring a contract asset to receivables is not treated as a new revenue event.
judge:
  - Transferring a contract asset to receivables is not treated as a new revenue event.
  - Cash collections are inferred only after complete noncash and perimeter adjustments.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
