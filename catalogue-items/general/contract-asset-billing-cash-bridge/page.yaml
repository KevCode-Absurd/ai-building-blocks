new_slug: contract-asset-billing-cash-bridge
name: Contract asset billing cash bridge
headline: Contract asset billing cash bridge
summary: "Build a contract asset billing cash bridge: see how unbilled revenue turns into invoices and collections, with every gap and adjustment flagged."
job: track-numbers
thinking: high
thinking_why: "Contract assets, invoices and collections move in a chain, so each link must tie to the next before the cash figure can be trusted."
subhead: Give it your opening and closing contract-asset and receivable balances, new unbilled revenue and direct invoices. It works out what moved into invoices and what was collected. You get the schedule and any gap it cannot explain.
explain: |-
  Some revenue is earned before you can bill it. That sits as a contract asset until the payment is no longer conditional. This bridge follows that money in three steps: unbilled revenue, then invoices, then cash collected.

  It reads one past period. It works out what moved into receivables, adds your direct invoices and rolls receivables forward to infer collections. Write-offs, currency effects and tax must be added as their own lines, or the result stays open.

  Illustrative figures. Contract assets of 30 + 100 − 40 imply 90 transferred to invoices. Add 200 of direct invoices and opening receivables of 50, then subtract closing receivables of 60: collections are 280. If closing contract assets were 50, transfers and inferred collections would each be 10 lower.
when:
  - You have unbilled revenue and want to see how much turned into invoices and cash.
  - Reported revenue and cash collected do not line up and you need to see why.
  - A reviewer needs each balance traced to a record.
not_for:
  - You have no conditional payment terms, so nothing sits as a contract asset. Use a simple receivables roll-forward in a spreadsheet.
  - You want to forecast future cash. Use a cash-flow forecast, because this bridge only looks back at past periods.
  - You need to decide if revenue was recognized correctly. Ask your accountant or auditor, because this tool does not test contract recognition.
  - "You are tracking customer advances and deferred revenue, not unbilled revenue: use the Customer advance revenue tracker instead."
  - "You want a trailing-year flow built from annual and year-to-date statements: use the Trailing year financial calculator instead."
you_give:
  - Contract-asset and receivable opening/closing balances, new unbilled revenue, direct invoices and all noncash adjustments.
  - "The period end, plus the currency and scale used for the contract asset to cash bridge."
  - "Your spreadsheet tool, if you want the contract asset to cash bridge as a workbook."
you_get:
  - A contract-asset-to-billings-to-collections schedule with explicit completeness gates.
  - "An editable workbook of the contract asset to cash bridge, with its inputs, formulas and test cases to rerun."
  - "A tie-out of contract assets, receivables and collections, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the opening and closing balances and the billing records."
  - "Tell it what you need: unbilled revenue turning into invoices and then collections."
  - "Ask it to stop and mark MISSING if an opening or closing balance is not in your sources."
  - "Check that a transfer to receivables is not treated as new revenue, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Opening and closing contract asset balances
    - Opening and closing receivable balances
    - New unbilled revenue for the period
    - Direct invoices raised in the period
    - Write-offs, FX, factoring, tax and other noncash adjustments
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, to run the bundled calculation check (optional)
  output:
    - name: Scope and dated sources
      contains: The period, currency, scale, accounting basis and the dated source for each balance.
    - name: Inputs and assumptions
      contains: Every balance and flow you supplied, kept apart from assumptions, with gaps marked MISSING.
    - name: Model calculations and reconciliations
      contains: Transfers from contract assets to receivables, then inferred collections, with each reconciliation shown.
    - name: Editable workbook
      contains: A native spreadsheet with live formulas, an input schema and test cases for the calculation.
    - name: Actual file verification
      contains: The checks that ran on the workbook, such as recalculation, changed-input test and reopening the file.
    - name: "MISSING: and CHECKS MISSED"
      contains: Unresolved inputs and any check that failed or could not run, or the word none.
how_it_works:
  - title: Separate contract assets
    text: Tell contract assets from receivables you can already bill.
  - title: Find what moved to invoices
    text: Opening contract assets plus new unbilled revenue, less closing, less noncash items.
  - title: Infer collections
    text: Roll receivables forward with direct invoices. Show write-offs, currency and tax apart.
output_shape: |-
  A contract-asset-to-billings-to-collections schedule with explicit completeness gates.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING:
  CHECKS MISSED
tweaks:
  - what: "Period end"
    how: "Take the period end from the opening and closing balances and the billing records. Use one currency and scale on every line."
  - what: "Noncash adjustments"
    how: "Change the noncash adjustments and have your AI recalculate. Keep the actual figures you supplied."
  - what: "Closing contract assets"
    how: "Change the closing contract-asset balance and rerun. Transfers and collections should both move by the same amount, in the opposite direction."
judge:
  - Transferring a contract asset to receivables is not treated as a new revenue event.
  - Cash collections are inferred only after complete noncash and perimeter adjustments.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one contract asset to cash bridge you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define contract asset into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
before: []
