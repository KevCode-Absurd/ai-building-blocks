new_slug: contract-liability-release-bridge
name: Contract-liability release bridge
headline: Contract-liability release bridge
summary: Check your contract liability roll-forward. Give it opening and closing balances, new advances and signed changes. You get inferred revenue release.
job: track-numbers
thinking: high
thinking_why: "The release is inferred from the other lines, so each addition and deduction needs a source before the gap can be read."
subhead: Give it your opening and closing contract liabilities, new advances and the release the company discloses. It works out the revenue released and compares it with the disclosure. You get the release and any gap it cannot explain.
explain: |-
  Customers sometimes pay before you deliver. That money sits as a contract liability, often called deferred revenue, until you earn it. This bridge works out how much was earned (released to revenue) in a past period.

  The formula is release = opening balance + new advances + signed other changes − closing balance. It then compares the result with the release the company reports. Any difference is shown as a gap to explain, not hidden.

  Illustrative figures. 100 opening + 80 additions − 120 closing = 60 released, which matches the disclosure and is 40% of 150 total revenue. A closing balance of 130 would imply a release of 50, which leaves a 10 unexplained difference.
when:
  - You have customer advances or deferred revenue and want the revenue released from them.
  - The release a company discloses does not match the balances and you need to see the gap.
  - A reviewer needs each balance traced to a record.
not_for:
  - "You need to split a contract into performance obligations: ask your accountant or auditor, as this only checks the total roll-forward."
  - "You want to forecast future bookings or revenue: build that in your own spreadsheet, as this only looks back."
  - "You only have a receivables balance with no deferred revenue: check it with a simple aging report in your accounting tool."
  - "You are tracking unbilled revenue turning into invoices and collections: use the Contract asset billing cash bridge instead."
you_give:
  - Opening/closing contract liabilities, new advances or deferred billings, signed non-revenue changes and disclosed releases.
  - "The period end, plus the currency and scale used for the contract liability roll-forward."
  - "Your spreadsheet tool, if you want the contract liability roll-forward as a workbook."
you_get:
  - A historical contract-liability roll-forward with inferred release and reconciliation residual.
  - "An editable workbook of the contract liability roll-forward, with its inputs, formulas and test cases to rerun."
  - "A tie-out of the inferred release and the disclosed release, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the opening and closing liabilities and the disclosed releases."
  - "Tell it what you need: the revenue released from customer advances and any unexplained gap."
  - "Ask it to stop and mark MISSING if the opening liability or the new advances is not in your sources."
  - "Check that advances are not all treated as cash collected without evidence, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Opening and closing contract liability balances
    - New advances or deferred billings for the period
    - Signed changes that are not revenue, such as FX or acquisitions (optional)
    - Release amounts the company disclosed, with dates and currency
    - Reporting date, currency, scale and accounting basis
  prerequisites:
    - An AI that can create and read spreadsheet files
    - Node.js 20 or later, to run the bundled calculation (optional)
  output:
    - name: Scope and dated sources
      contains: The sources you supplied, their dates, and the period, currency and scale used.
    - name: Inputs and assumptions
      contains: Each balance and flow with its source, sign and period, plus any assumption made.
    - name: Model calculations and reconciliations
      contains: The roll-forward from opening to closing, the inferred release, and how it compares with the disclosed release.
    - name: Actual file verification
      contains: Results of recalculating, inspecting and reopening the workbook, and which checks could not run.
    - name: MISSING and CHECKS MISSED
      contains: Inputs still needed and checks that failed or did not run, or the word none.
how_it_works:
  - title: 1. Separate contract liabilities from receivables, refundable deposits and other payables; verify whether new additions are billings or cash advances under the source definition
    text: Separate contract liabilities from receivables, refundable deposits and other payables; verify whether new additions are billings or cash advances under the source definition.
  - title: 2. Start with opening liability, add new deferred consideration and signed acquisition/FX/other changes, then deduct closing liability to infer revenue release
    text: Start with opening liability, add new deferred consideration and signed acquisition/FX/other changes, then deduct closing liability to infer revenue release.
  - title: 3. Compare with the disclosed release and total recognized revenue; distinguish revenue from opening balances from all releases during the period
    text: Compare with the disclosed release and total recognized revenue; distinguish revenue from opening balances from all releases during the period.
output_shape: |-
  A historical contract-liability roll-forward with inferred release and reconciliation residual.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Period end"
    how: "Take the period end from the opening and closing liabilities and the disclosed releases. Use one currency and scale on every line."
  - what: "New advances"
    how: "Change the new advances and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Liability additions are not all called cash collections without source evidence.
judge:
  - Liability additions are not all called cash collections without source evidence.
  - Release from opening liabilities and total annual release are kept distinct.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one contract liability roll-forward you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define contract liability into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
