new_slug: convertible-eps-inclusion-test
name: Convertible EPS inclusion test
headline: Convertible EPS inclusion test
summary: Check if a convertible adds or cuts your diluted EPS. Compare basic EPS with incremental EPS to decide whether to include the dilution.
job: money-and-investing
thinking: high
thinking_why: "A convertible only counts as dilutive when it lowers EPS, so the numerator and the share count must be tested together."
subhead: Give it your profit, share counts and the convertible's terms. It compares basic EPS with the extra earnings per extra share from conversion. You get a clear call on whether to include the dilution.
explain: |-
  A convertible bond or note can turn into shares. If it does, profit rises a little (you stop paying the interest) and the share count rises a lot. This test checks whether that lowers EPS (earnings per share). If it does, the convertible is dilutive and counts in diluted EPS.

  The rule is simple. Incremental EPS = after-tax interest saved ÷ extra shares. If that is lower than basic EPS, include the convertible. If it is higher, leave it out.

  Practice numbers, not a real company: basic EPS is 100 / 100 = $1.00. Incremental EPS is 2 / 50 = $0.04, so the convertible counts. Diluted EPS is 102 / 150 = $0.68. With a $60 million adjustment instead, EPS would rise to $1.07, so the convertible would be left out.
when:
  - You have one convertible bond or note and need to know if it dilutes EPS.
  - You are building a diluted EPS schedule and want each number traced to a source.
  - A reviewer asks you to show how the result ties back to the inputs.
  - You want an editable workbook that shows the basic, candidate and incremental EPS.
not_for:
  - "You have a loss, several convertibles, contingent settlement, cash elections or participating securities: ask an accountant for a full IAS 33 analysis."
  - "You want to check a fund or investor statement: use a plain review by your fund administrator or accountant instead."
  - "You need to know if a contract allows conversion: read the contract with your lawyer first, then come back."
  - "Your dilution comes from options, not a convertible: use the Employee option dilution calculator instead."
  - "You want to explain a share-price change through EPS growth and the P/E multiple: use the Share price return analyst instead."
you_give:
  - Profit from continuing operations for ordinary shareholders.
  - Basic weighted average shares.
  - The after-tax change to profit if the convertible converts, such as saved interest.
  - Extra weighted shares from conversion, from the instrument terms.
  - Reporting date, currency, scale and accounting basis.
you_get:
  - A comparison of basic EPS, candidate EPS and incremental EPS.
  - A dilutive or anti-dilutive label, given only after the checks pass.
  - An editable workbook with an input schema and test cases.
  - A list of missing inputs and checks that could not run.
how_to_use:
  - Download the full pack and open your AI tool. Use one that can make spreadsheet files.
  - Share the filing pages or numbers for profit, shares and the convertible's terms.
  - Say the reporting date, currency and scale.
  - Ask your AI to follow SKILL.md and mark any gap as MISSING instead of guessing.
  - Check the assumptions, the conversion date match and CHECKS MISSED before you rely on the result.
  - To run the bundled calculation on your own numbers, use Node.js 20 or later.
output_sample:
  input:
    - Profit from continuing operations for ordinary holders
    - Basic weighted average shares
    - After-tax change to profit if the convertible converts
    - Extra weighted shares from conversion
    - Reporting date, currency and scale
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later to run the bundled calculation (optional)
  output:
    - name: Single-instrument if-converted comparison
      contains: Basic EPS, candidate EPS and incremental EPS side by side, with a dilutive or anti-dilutive label.
    - name: Scope and dated sources
      contains: The sources, dates, currency and scale the calculation relies on.
    - name: Inputs and assumptions
      contains: Every input and assumption, kept apart from reported facts.
    - name: Model calculations and reconciliations
      contains: The EPS formulas and checks that the numbers tie out.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation, a changed input and reopening the file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs not supplied and checks that failed or could not run.
how_it_works:
  - title: Read the terms
    text: Take the conversion ratio, timing, interest and tax effects from the contract.
  - title: Compare incremental EPS
    text: Divide the after-tax profit change by the extra shares. Compare with basic EPS.
  - title: Label it
    text: Call it dilutive only if it lowers EPS. Stop if there is more than one convertible.
output_shape: |-
  A single-instrument if-converted comparison showing basic EPS, candidate EPS and incremental EPS.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING:
  CHECKS MISSED
tweaks:
  - what: "Assumed conversion date"
    how: "Take the assumed conversion date from the profit figures, the share count and the convertible terms. Use one currency and scale on every line."
  - what: "After-tax interest saved"
    how: "Change the after-tax interest saved and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Numerator and denominator adjustments use the same assumed conversion date.
judge:
  - Numerator and denominator adjustments use the same assumed conversion date.
  - An EPS increase under the profitable fixture is anti-dilutive and is not silently included.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one convertible EPS test you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define incremental EPS into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
