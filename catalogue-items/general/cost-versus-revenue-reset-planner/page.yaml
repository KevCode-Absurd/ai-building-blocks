new_slug: cost-versus-revenue-reset-planner
name: "Cost versus revenue reset planner"
summary: "Paste last year's costs and revenue. Get one clear reset decision, who is affected and a staff note that owns the mistake."
job: lead-people
thinking: high
thinking_why: "It weighs a decision that affects people, so it should check the numbers and the wording with care."

headline: "Cost versus revenue reset planner"
subhead: Paste your costs and revenue for the last year or two. It sets cost growth beside revenue growth, finds the bets that ran ahead of sales, and settles on one reset decision. You get the plan, who is affected and a draft note to staff that owns the mistake.

explain: |
  When costs grow faster than sales, many leaders cut a little now and a little more later. Each round hurts people and shakes trust, and the gap often stays. A clear decision made once, with the reasons said plainly, is usually kinder and easier to carry out.

  This skill puts the two growth lines side by side, then names which spending decisions ran ahead of revenue and who made them. It asks whether small trims would be enough and, if not, picks one larger move. It then writes the support for each affected person in specific numbers and dates, sets a goal that stays ambitious after the cut and drafts the staff note. The note opens with the decision and owns the mistake in the writer's name.

when:
  - Costs have grown faster than revenue and you must decide what to do about it.
  - You need to tell staff about a reduction and want the note to be honest and specific.
  - You are tempted to cut a bit each quarter and want to test whether one decision is better.

you_give:
  - Costs and revenue by period for the last one or two years (spreadsheet or pasted figures)
  - The big spending decisions and who made them
  - Who would be affected and the support you can offer, such as pay, cover and time
  - Your goal for the next few years (optional)
you_get:
  - A cost against revenue comparison, in plain numbers
  - One reset decision and why smaller trims will or will not be enough
  - A support list with figures and dates for each affected group
  - A draft staff note that opens with the decision

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your figures with the period they cover and say what each column means.
  - List the big bets, who approved them and what each cost.
  - Say what support you can honestly offer. Leave a gap rather than guess.
  - Read the note aloud. The person who signs it should be willing to say every line.

how_it_works:
  - title: Compares growth
    text: Sets the change in costs beside the change in revenue for the same period.
  - title: Finds the bets
    text: Names which spending ran ahead of revenue and who made the call.
  - title: Tests small cuts
    text: Works out whether trims would close the gap. If not, picks one larger move.
  - title: Writes the support
    text: Gives each affected group specific terms, numbers and dates.
  - title: Keeps the goal large
    text: Sets the goal that stays after the cut, so the plan is not just shrinking.
  - title: Drafts the note
    text: Opens with the decision, gives the reason, owns the mistake and states what changes.
  - title: Checks the plan
    text: Runs its own checks and names any it missed.

output_shape: |
  COST AGAINST REVENUE
  Period: <dates>   Costs: <change>   Revenue: <change>   Gap: <amount>

  THE BETS THAT RAN AHEAD
  <bet> | Cost: <amount> | Decided by: <name or role>

  THE DECISION
  <one clear move, and why smaller cuts will or will not be enough>

  WHO IS AFFECTED
  <group> | <number> | <support: terms, amounts, dates>

  THE GOAL THAT STAYS
  <the aim after the reset>

  DRAFT NOTE TO STAFF
  <decision first, reason, own part, what changes, support>

  MISSING
  <what was not provided>

  CHECKS MISSED
  <one line per check missed, or none>

tweaks:
  - what: The periods
    how: Give at least two comparable periods. One year alone cannot show whether costs ran ahead.
  - what: Who made each bet
    how: Name the role. The note can only own the mistake if it is clear whose call it was.
  - what: The support you can give
    how: Use real figures. The skill leaves gaps marked rather than inventing terms.
  - what: Your goal
    how: State it in a line. A plan that only shrinks is rejected by the checks.

judge:
  - The decision is in the first lines of the note.
  - The note owns the mistake in the name of the person signing it.
  - Support terms are specific numbers and dates, not "fair" or "generous".
  - The plan keeps the goal large and does not shrink it.
  - It does not promise that no more changes will come.

test:
  - Run it on figures from a past year where you know what happened. See if it finds the same gap.
  - Ask a colleague to read the note and say what the decision is. They should answer in one sentence.
  - Run it twice. The comparison figures should match each time.
  - Check each support figure against your own contracts and legal rules before you send anything.

improve:
  - Add your own rule for how much cost growth you accept compared to revenue growth.
  - Add the legal and notice rules in your country, so the support list is complete.
  - Save the note and the result after the event, so the next one starts from real lessons.
  - Pair it with a message writer for the individual conversations.

works_best_with:
  tools:
    - {name: "A spreadsheet", why: "Your figures and growth rates are easiest to check in a sheet before the AI uses them."}
    - {name: "Any good chat AI", why: "Comparing figures and drafting the note is text work any strong chat AI does well."}
  inputs:
    - "A list of open roles and committed spending"
    - "Local notice and pay rules, confirmed by an adviser"
    - "The last note you sent staff about the business"

terms:
  - term: Reset
    meaning: One clear change in size or spending, made once, to bring costs in line with revenue.
  - term: Ran ahead of revenue
    meaning: Spending that grew faster than the sales meant to pay for it.
