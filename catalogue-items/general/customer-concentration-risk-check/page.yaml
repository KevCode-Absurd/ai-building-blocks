new_slug: customer-concentration-risk-check
name: "Customer concentration risk check"
summary: "List your top clients and key dependencies. Get a risk map, limits to set and an exit plan for the biggest one."
job: plan-strategy
thinking: medium
thinking_why: "It adds up shares from your numbers and weighs five kinds of dependence, but the steps are fixed."

headline: "Customer concentration risk check"
subhead: Give it your sales by client and a list of your suppliers, people and lenders. It finds every dependence that could sink you, sets a limit for each and writes a calm exit plan for your biggest client.

explain: |
  Many businesses are one phone call from a crisis. One client pays a quarter of your income, one supplier makes your key part, one person holds the know-how, or one lender holds your credit. Most owners only look at the biggest client, and only when there is trouble.

  This skill checks five kinds of dependence: client, technology, country, type of work and key person. It adds supplier and credit dependence on top. It works from your own numbers, flags anything above a share you agree to, sets a limit with an owner for each kind, and writes the polite exit you would offer if your biggest client pushed terms that would hurt you.

when:
  - One client or one supplier makes up a big share of your money.
  - A large customer has asked for a price cut or longer payment terms.
  - You want limits in writing before you take the next big deal.

you_give:
  - "Sales by client for the last 12 months, in a sheet or pasted list"
  - "Your main suppliers with the share of sales each one affects"
  - "Your key people, tools and countries or regions you depend on"
  - "Your sources of credit (optional)"
  - "The terms your biggest client is asking for (optional)"

you_get:
  - "A risk map of every dependence, rated high, medium or low with the number behind it"
  - "A share limit for each kind of dependence, each with an owner"
  - "A second-source plan for suppliers and credit"
  - "A short exit plan for your biggest client"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Paste your sales by client, then list suppliers, key people, tools and where you sell."
  - "Say which limits you can live with. If you are not sure, ask it to propose some."
  - "Name your biggest client and any terms they are pushing."
  - "Take the limits to whoever owns each one, and set a date to run the check again."

how_it_works:
  - title: Lists every dependence
    text: Breaks your revenue down by client, technology, country, type of work and key person.
  - title: Marks what could sink you
    text: Flags any single item whose loss would cut sales or stop delivery.
  - title: Tests the biggest client's terms
    text: Asks whether the terms they want would hurt your long-term health, not only this quarter.
  - title: Sets share limits
    text: Proposes a limit for each kind of dependence, with an owner and a review date.
  - title: Writes the polite exit
    text: Drafts how you would decline the terms and help the client move on smoothly.
  - title: Checks suppliers and credit
    text: Works out how much of your sales rides on each supplier, checks contract length, late or wrong shipments and treatment, and finds a second source of credit.

output_shape: |
  DEPENDENCE MAP
  <kind> | <item> | <share of sales> | <rating> | <what happens if it leaves>

  CLIENT TERMS CHECK
  <biggest client, the terms asked, what they would do to your health>

  LIMITS TO SET
  <kind> | <limit> | <owner> | <review date>

  SUPPLIERS AND CREDIT
  <supplier or lender> | <share of sales it affects> | <contract end> | <second source>
  Pay first if cash is short: <order and why>

  EXIT PLAN FOR THE BIGGEST CLIENT
  <what you say, what you offer to help them move, the date>

  MISSING
  <facts that would sharpen the map>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: The share you treat as risky
    how: Tell it your own line, for example 15% of sales. Without one it proposes a line and says why.
  - what: Length of the data
    how: Twelve months of sales by client gives a fair picture. A single quarter can hide a client who pays late.
  - what: Supplier detail
    how: Add contract end dates and how often orders arrive late or wrong. These show who is slipping.
  - what: Your real alternatives
    how: Name who else could do the job. A risk with a ready second option is rated lower.

judge:
  - All five kinds of dependence are checked, not only the biggest client.
  - Every limit has a number and a named owner.
  - A polite exit is written for the case where you refuse terms.
  - Every client or supplier named appears in the data you gave.
  - Each supplier above your share line is listed.

test:
  - "Run it on a year of sales you know well. Check that the shares match your own sums."
  - "Hide one big client in the data and see whether it still flags the next biggest."
  - "Run it twice. The ratings should stay close."
  - "Show the exit plan to someone who knows the client and ask if it sounds fair."

improve:
  - "Add your own risk line to the steps so it never has to guess."
  - "Add the dependences special to your field, such as one platform or one licence."
  - "Save your limits to your brand file so later plans stay inside them."
  - "Pair it with a plan writer to cover the work of finding new clients."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Adding shares and writing the plan is text and arithmetic any strong chat AI can do."}
    - {name: "A spreadsheet", why: "Lets you export sales by client and paste a clean list in."}
  inputs:
    - "Supplier contracts with end dates"
    - "A list of late or wrong shipments from the last year"
    - "Your loan or credit terms"

terms:
  - term: Concentration
    meaning: How much of your income depends on one client, supplier, country or person.
  - term: Second source
    meaning: A backup supplier or lender you have spoken to before you need them.
