new_slug: customer-conversation-notes-sorter
name: "Customer conversation notes sorter"
summary: "Paste raw notes from customer talks. Get facts, praise and feature ideas told apart, plus the follow-up question for each."
job: understand-customers
thinking: medium
thinking_why: "It judges what each note is worth, but the categories are fixed."

headline: "Customer conversation notes sorter"
subhead: Paste your notes or quotes from customer conversations. It marks each note with a short symbol, flags compliments, vague claims and feature requests as weak data, and digs under them. You get facts sorted by person, the real signals and the follow-up question for each weak note.

explain: |
  After a good-feeling meeting it is easy to write "they loved it" and move on. Compliments, "I would definitely buy that" and feature requests feel like progress. They are not facts about the person's life, so they can send you the wrong way for months.

  This skill splits your notes into single items and tags each one: emotion, pain, goal, obstacle, workaround, feature request, money, a named person or company, or a follow-up task. It flags three kinds of weak data. Compliments are set aside. Vague claims and future promises are pinned to a real moment. Ideas are traced back to the reason behind them. For each weak note it writes the question to ask next time. Then it shows what the strong notes add up to.

when:
  - You've done a few conversations and your notes are a mix of quotes and feelings.
  - Everyone you spoke to "liked it" and you don't know what to do next.
  - You need to share what customers said with a team without handing over just your opinion.

you_give:
  - Your notes from one or more conversations, as rough as they are
  - Who each was with and the date, if you have it (optional)
  - Your big three questions or what you were trying to learn (optional)
  - Exact quotes in quotation marks, where you have them (optional)
you_get:
  - Every note tagged with a symbol and marked as fact, compliment, fluff or idea
  - The follow-up question for each weak note
  - A summary of the real signals (pains, goals, obstacles, workarounds and money)
  - A judgement of each person as a customer, a complainer or not a customer

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your notes as they are, with who said them and when, if you know.
  - Say what you were trying to learn, so it can see which notes matter.
  - Read the weak-data list first, then ask the follow-up questions in your next talks.
  - Share the sorted notes, with the quotes, with anyone else making decisions.

how_it_works:
  - title: Checks the notes
    text: If notes are only conclusions such as "they loved it", it asks for what was said. If you want it to confirm your idea, it explains that it sorts evidence instead.
  - title: Splits into single items
    text: One quote or learning per item, with the person and date, and exact words kept in quotation marks.
  - title: Tags each item
    text: Adds a symbol for emotion, pain, goal, obstacle, workaround, feature request, money, named person or company, or follow-up.
  - title: Flags weak data
    text: Marks compliments, fluff and ideas, and says what each one is worth.
  - title: Digs under ideas and feelings
    text: Lists the likely reasons behind a request or strong emotion and writes the question that finds the real one.
  - title: Pulls out the facts
    text: Collects specific past events, what people tried, what it cost and who else is involved.
  - title: Judges each person
    text: Marks them as a likely customer, a complainer or not a customer, from what they did about the problem.
  - title: Sums up the signals
    text: Groups the strong notes and counts how many people said each.
  - title: Checks the set
    text: Runs its own checks and names any it missed.

output_shape: |
  WHAT YOU HAVE
  <number of conversations, number of items, how many are facts>

  SORTED NOTES (per person)
  <person, date>
  <n>. <mark> "<quote or note>" | Kind: <fact / compliment / fluff / idea>
     Worth: <what it tells you, or nothing>
     Ask next: <follow-up question>

  WEAK DATA
  Compliments: <list>  Fluff: <list>  Ideas and requests: <list, with likely reasons>

  REAL SIGNALS
  Pains: <list, with how many people>
  Goals: <list>   Obstacles: <list>   Workarounds: <list>
  Money: <list>   Named people and companies: <list>

  EACH PERSON
  <name>: <likely customer / complainer / not a customer>, because <reason>

  TO DO
  <follow-ups and promised next steps>

  MISSING
  <what the notes lack>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: Exact quotes
    how: Paste them in quotation marks. They are the strongest evidence and can be reused in copy or to settle a debate.
  - what: Your marks
    how: The skill uses a plain-text set of marks. Tell it if you prefer your own and it will follow them.
  - what: What you were trying to learn
    how: Give your big three. Notes that bear on them come first.
  - what: Number of conversations
    how: Paste several at once. Counts across people show which signals repeat.

judge:
  - Every item is tagged and called a fact, compliment, fluff or idea.
  - No compliment or "I would" is treated as a fact.
  - Every weak item has a follow-up question.
  - Exact quotes are kept word for word.
  - The summary counts people, not mentions.

test:
  - Run it on notes where you know the outcome. Check that the praise it flagged did not lead to a sale.
  - Hide one of your own conclusions in the notes ("they loved it") and see if it asks what was said.
  - Run it twice. The tags should agree on most items.
  - Use the follow-up questions in your next talk and see whether they bring out facts.

improve:
  - Add your industry's common fluff phrases to step 4 so they get flagged every time.
  - Add the marks you prefer to step 3.
  - Save the sorted notes in one shared file so your team reads the same evidence.
  - Pair it with "Idea evidence review" once you have five or so conversations.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Sorting and tagging notes is text work that any strong chat AI does well with this skill."}
    - {name: "A shared spreadsheet or index cards", why: "Sorted notes are easy to filter by mark when each item has its own row or card."}
  inputs:
    - "Exact quotes in quotation marks with the person's name and date"
    - "Audio transcripts of the talks, if the person agreed to be recorded"
    - "Your big three questions, so it can show which notes answer them"

terms:
  - term: Fluff
    meaning: Vague claims ("I always"), promises ("I would") and maybes ("I might") that don't describe something they did.
  - term: Workaround
    meaning: A makeshift fix the person already uses, such as a spreadsheet or a helper.
  - term: Obstacle
    meaning: Something that stops a person solving their problem even though they want to.
