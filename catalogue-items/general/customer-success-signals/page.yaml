new_slug: customer-success-signals
name: "Customer success leading-sign definer"
summary: "Find an early sign that new customers will stay. Paste what customers did and who left. You get one action, a percent and a time limit."
job: test-an-idea
thinking: high
thinking_why: "It compares groups of customers and must warn when the data is too thin to trust."

headline: "Customer success leading-sign definer"
subhead: Paste what customers did after they bought, and who stayed and who left. It compares the two groups and finds one early action that stays linked to staying. You get one sign written as a percent, an action and a time limit, plus how to measure it.

explain: |
  Sales tell you the message works. Customers who stay tell you the product works. Retention takes a year or more to show, which is too slow to steer by. A leading sign is an early action you can count within weeks and that goes with customers who stay.

  This skill asks first whether customers stay and renew, not whether they bought. It lists what the customers who stayed did early that the others did not, and picks one action. It writes the sign as "P percent of customers do E within T days" and sets P and T so you can check it in 30 to 60 days. It tells you to measure by cohort, warns when the sample is small, and checks lifetime value against cost to win before you add more sellers.

when:
  - You grow sales but customers leave and you cannot say why.
  - You need an early number to tell you in weeks whether a new customer is on track.
  - You are about to hire more salespeople and want to know if customers get value first.
not_for:
  - "You have no customers yet, or fewer than about 20: run a short survey of people who might buy instead."
  - "You want to know why sales are slow: look at your sales calls and offer first, since this tool only studies customers who already bought."
  - "You have no record of who stayed and who left: write that list first, because the tool stops without it."

you_give:
  - What customers did after they bought, with dates
  - Which customers stayed and which left
  - Customer reviews or call notes (optional)
  - Cost to win a customer and what a customer pays over time (optional)
you_get:
  - A comparison of what retained and lost customers did early
  - One sign written as a percent, an action and a time limit
  - How to measure it by cohort in 30 to 60 days
  - A check of lifetime value against cost to win

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your customer data with a start date and the day each customer left, if they did.
  - Add any reviews or call notes and a past audit if you have one.
  - Pick the sign it proposes and put it on a weekly report.
  - Check it again after one or two cohorts and keep or change it.
output_sample:
  input:
    - What customers did after they bought, with dates
    - Which customers stayed and which left
    - Customer reviews or call notes (optional)
    - Your cost to win a customer and what a customer pays over time (optional)
  output:
    - name: Do customers stay?
      contains: The count of customers who stayed and left in your period, with a warning if either group is small.
    - name: What stayers did early
      contains: Each early action with the percent of stayers and leavers who did it, ranked by the gap.
    - name: The sign
      contains: One action written as P percent of customers do it within T days, with the working shown.
    - name: How to measure
      contains: How to count one cohort and the first date to check it.
    - name: Message fit or product fit
      contains: A line on whether leavers never used the product or used it and still left.
    - name: Economics
      contains: Lifetime value against cost to win, as a ratio, when you gave cost figures.
    - name: Missing and checks missed
      contains: What you did not provide and any checks the result failed, or none.

how_it_works:
  - title: Starts with staying
    text: Asks whether customers renew, not whether they bought.
  - title: Compares the groups
    text: Lists the actions retained customers took early that others did not.
  - title: Picks one action
    text: Chooses a single action that is clear, countable and linked to staying.
  - title: Writes the sign
    text: Writes it as P percent do the action within T days.
  - title: Sets the numbers
    text: Chooses P and T so the sign can be checked in 30 to 60 days.
  - title: Measures by cohort
    text: Plans a count for each group of customers who joined in the same period.
  - title: Checks the economics
    text: Compares lifetime value with cost to win before you add sellers.

output_shape: |
  DO CUSTOMERS STAY?
  Stayed: <number>   Left: <number>   Period: <dates>

  WHAT STAYERS DID EARLY
  <action> | Stayers: <percent> | Leavers: <percent>

  THE SIGN
  <P> percent of customers <do action> within <T> days

  HOW TO MEASURE
  Cohort: <joined in which period>   Check on: <date>

  ECONOMICS
  Lifetime value: <amount>   Cost to win: <amount>   Ratio: <ratio>

  WARNINGS
  <small sample, message fit or product fit>

  MISSING
  <what was not provided>

  CHECKS MISSED
  <one line per check missed, or none>

tweaks:
  - what: Dates
    how: Give the start date and the day each customer left. Without dates the skill cannot compare timing.
  - what: Number of customers
    how: Say how many you have. Small groups produce a warning, not a firm sign.
  - what: Reviews and call notes
    how: Paste them. They help separate customers who did not like the product from those who never used it.
  - what: Cost figures
    how: Give cost to win a customer and what customers pay over time, so the ratio can be worked out.

judge:
  - The sign is one action, not a vague feeling.
  - The time limit is short enough to act on.
  - It compares customers who stayed with those who left.
  - It warns when the sample is too small.
  - It separates message fit from product fit.

test:
  - Check the sign against last year's customers. See whether those who met it stayed more often.
  - Count the percent yourself from your own data and compare it with the skill's number.
  - Run it twice. The chosen action should be the same or close.
  - Track the next cohort for 60 days and see if the sign predicts who stays.

improve:
  - Add the actions your product team already counts, so the sign uses data you have.
  - Add your own lifetime value and cost to win figures, so the economic check is yours.
  - Save each cohort's result, so the sign can be tested over time.
  - Pair it with a pay plan checker when sellers are paid on the sign.

works_best_with:
  tools:
    - {name: "A spreadsheet", why: "Counting how many customers did an action by day is simple in a sheet and easy to check."}
    - {name: "Any good chat AI", why: "Comparing two groups and writing the sign is text work any strong chat AI does well."}
  inputs:
    - "A list of customers with start and end dates"
    - "A log of actions each customer took in the first weeks"
    - "Reviews or support tickets"

terms:
  - term: Leading sign
    meaning: An early action you can count soon after purchase that goes with customers who stay.
  - term: Cohort
    meaning: A group of customers who started in the same week or month.
  - term: Lifetime value
    meaning: What a customer pays you over the whole time they stay.
