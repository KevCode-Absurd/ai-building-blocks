new_slug: customer-value-spend-limit-calculator
name: "Customer value and spend limit calculator"
summary: "Paste sales by customer type and source. Get what a customer is worth and the most you can spend to win one."
job: plan-strategy
thinking: medium
thinking_why: "The arithmetic is fixed, but sorting customers and choosing sensible assumptions needs care."

headline: "Customer value and spend limit calculator"
subhead: Give it sales broken down by customer type and where each customer came from. It works out what each group spends over their life with you, takes off the cost of serving them, and sets the most you can spend to win one while still making a profit.

explain: |
  Most businesses judge ad spend by the first sale alone, so they stop spending when a customer costs more than their first order. But a customer is worth what they spend over their whole time with you, less what it costs to serve them. Some groups are worth three times others, and some sources bring in the worst.

  This skill groups buyers by type and by source, then works out what each group spends over its life. It subtracts the cost of serving them to find profit per buyer, and sets a spend limit that still leaves profit. It compares that limit with what you pay now in each source, flags the sources that overspend, and lists back-end sales and repeat steps that would raise the limit.

when:
  - You do not know how much you can afford to pay for a new customer.
  - Some customers cost a lot to win and you are not sure if they pay back.
  - You want to know which sources bring the best customers over time.

you_give:
  - Sales data by customer type and by source, with dates (required)
  - What you pay to win a customer in each source (optional but needed for the flag)
  - Cost of serving a customer, such as delivery, support, returns and discounts (optional)
  - Back-end sales or repeat products you offer (optional)
you_get:
  - Value per buyer by type and by source over a stated period
  - Profit per buyer after the cost of serving them
  - A spend limit for each group, with the assumptions stated
  - A flag on each source that spends over the limit, and ways to raise the limit

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your sales with customer type, source and dates. Say what period it covers.
  - Add your cost to serve and what you pay in each source.
  - Read the spend limit and the flags. Check each labelled assumption.
  - Change the assumptions that look wrong and run it again.

how_it_works:
  - title: Group the buyers
    text: Groups buyers by type and by where they came from.
  - title: Work out lifetime spend
    text: Works out what each group spends over its life with you.
  - title: Subtract serving cost
    text: Subtracts the cost of serving them to find profit per buyer.
  - title: Set the spend limit
    text: Sets the most you can spend to win a buyer and still keep a profit.
  - title: Compare with now
    text: Compares the limit with what you pay now in each source.
  - title: Find ways to raise it
    text: Lists back-end sales and repeat steps that would raise the limit.
  - title: Check it
    text: Runs its own checks and names any it missed.

output_shape: |
  GROUPS
  <type> from <source> | Buyers: <n> | Period: <dates>

  VALUE PER BUYER
  <group> | Orders: <n> | Spend over period: <amount> | Cost to serve: <amount> | Profit per buyer: <amount>

  SPEND LIMIT
  <group> | Limit: <amount> | Assumptions: <list>

  WHAT YOU PAY NOW
  <source> | Pay: <amount> | Limit: <amount> | Flag: <over / within / MISSING>

  HOW TO RAISE THE LIMIT
  <back-end sale or repeat step> | Effect: <how much, and how we know>

  MISSING
  <what would sharpen the numbers>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: Length of the period
    how: Use a period long enough to include repeat orders. A short one makes every buyer look worth only their first sale.
  - what: Cost to serve
    how: Include delivery, support, returns and payment fees. Leaving them out inflates the limit.
  - what: How safe you want to be
    how: Say what share of profit per buyer you want to keep. The limit is set below the profit, not equal to it.
  - what: Customer types
    how: Use real types such as trade, gift buyers and subscribers. Mixed groups hide the best and worst.

judge:
  - Value is shown by buyer type and source.
  - The spend limit is below the profit per buyer.
  - Costs of serving the buyer are included.
  - Assumptions are labelled.
  - Sources that overspend are flagged.

test:
  - Pick one group and work out the profit per buyer by hand. It should match.
  - Remove the cost to serve and see how much the limit jumps. That is the size of the risk.
  - Run it twice on the same data. The limits should be the same.
  - Cut the spend in a flagged source for a month and watch what happens to new buyers.

improve:
  - Add your real cost lines to the cost-to-serve step, such as packaging and returns.
  - Add a rule for how long you can wait to get your spend back.
  - Save the limits in your notes and recheck them each quarter.
  - Pair it with "Growth lever audit" to pick which lever to work on.

works_best_with:
  tools:
    - {name: "A spreadsheet", why: "Easy to change assumptions and see the limit move."}
    - {name: "Any good chat AI", why: "Handles the grouping, the arithmetic and the flags once your data is pasted in."}
  inputs:
    - "An order export with customer IDs, dates and source"
    - "Your costs for delivery, support and returns by order"
    - "What you pay in each ad or referral source"

terms:
  - term: Lifetime value
    meaning: What a buyer spends with you over their whole time as a customer, less what it costs to serve them.
  - term: Spend limit
    meaning: The most you can pay to win one buyer and still leave a profit.
  - term: Back-end sale
    meaning: A later purchase from someone who already bought, such as an add-on, a refill or a renewal.
