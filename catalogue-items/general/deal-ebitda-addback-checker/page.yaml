new_slug: deal-ebitda-addback-checker
name: Deal EBITDA addback checker
headline: Deal EBITDA addback checker
summary: Check how much of a requested EBITDA addback your deal cap allows. Give it your EBITDA and addbacks. You get adjusted EBITDA and the excess.
job: money-and-investing
thinking: high
thinking_why: "The cap depends on how the agreement defines its base, and a wrong base changes the allowed amount."
subhead: Give it your EBITDA, your addback requests and the cap in your agreement. It applies the cap to EBITDA before addbacks. You get adjusted EBITDA, the allowed addback and the excess that is rejected.
explain: |-
  Lenders and buyers let you add some costs back to EBITDA, often only up to a cap. Here the cap is a share of EBITDA before the addbacks. This checker applies that cap. You get adjusted EBITDA, the addback it allows and the excess it rejects.

  The cap is measured on EBITDA before addbacks, and uncapped adjustments are added in full. Costs it caps are limited to the cap amount. It does not say whether an addback is allowed by the contract. Your lawyer decides that.

  Illustrative figures only. With EBITDA of 100, a 20% cap permits 20 of the 40 requested. Adding 10 uncapped gives adjusted EBITDA of 130. A 10% cap permits only 10, which gives 120 and rejects 30.
when:
  - A lender or buyer asks you to justify an addback against a cap.
  - You need a traceable EBITDA addback calculation for a credit agreement.
  - A reviewer wants to see every number tied back to its source.
  - You want to test how a different cap changes adjusted EBITDA.
not_for:
  - "Your cap is measured on EBITDA after the addbacks: ask an adviser or your lawyer to work out the algebra, because this tool only handles caps on EBITDA before addbacks."
  - "You need to know if the addback is legally allowed under your contract: ask your lawyer, because this tool only does the arithmetic."
  - "You want audited earnings or free cash flow: use your accountant's reported figures, because adjusted EBITDA here is a contract scenario."
  - "You need to fix an EV to EBITDA multiple that leaves out minority interests: use the Minority-interest multiple reconciliation instead."
you_give:
  - Your actual EBITDA before addbacks.
  - Adjustments that have no cap, with their support (optional).
  - Capped addbacks, with support for each.
  - The signed cap, stated as a share of EBITDA before addbacks.
  - Reporting date, currency, scale and accounting basis.
you_get:
  - Adjusted EBITDA.
  - The allowed capped addback.
  - The disallowed excess.
  - An editable workbook with inputs, calculations and checks.
  - A list of missing inputs and checks that did not run.
how_to_use:
  - Download the pack and open it in an AI that can work with files.
  - Paste your EBITDA, addbacks, cap and the source for each. Say the cap is on EBITDA before addbacks.
  - Ask your AI to build the workbook and stop on any missing input instead of using zero.
  - "Check the example: a 20% cap on 100 admits 20 of 40 requested. Adding 10 uncapped gives 130."
  - Read MISSING and CHECKS MISSED before you rely on the result.
output_sample:
  input:
    - Your actual EBITDA before addbacks
    - Addbacks that have no cap (optional)
    - Addbacks that are capped, with support for each
    - The cap from your signed agreement, as a share of EBITDA before addbacks
    - Reporting date, currency and scale
  prerequisites:
    - An AI that can create spreadsheet files
    - Node.js 20 or later, to run the bundled calculation (optional)
  output:
    - name: Adjusted EBITDA
      contains: Actual EBITDA plus the allowed capped addbacks plus the uncapped adjustments.
    - name: Allowed capped addback
      contains: The lesser of the cap amount and the supported capped requests.
    - name: Disallowed excess
      contains: The part of the requested capped addback that goes over the cap.
    - name: Editable workbook
      contains: A spreadsheet with inputs, calculations and checks, built on illustrative figures you replace.
    - name: Reconciliations
      contains: A tie-out of accepted and rejected amounts, with the evidence for each accepted item.
    - name: MISSING and CHECKS MISSED
      contains: Inputs still unknown and checks that failed or could not run.
how_it_works:
  - title: Separate real from proposed
    text: Keep earned EBITDA apart from proposed adjustments. Drop duplicates and unsupported claims.
  - title: Apply the cap
    text: Cap amount is EBITDA before addbacks times the cap fraction. Allow the lower of that and supported requests.
  - title: Add up
    text: Add allowed capped and uncapped adjustments. List the evidence for each accepted item.
output_shape: |-
  Adjusted EBITDA, allowed capped addback and disallowed excess.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING:
  CHECKS MISSED
tweaks:
  - what: "Test date"
    how: "Take the test date from the credit or deal agreement and your EBITDA. Use one currency and scale on every line."
  - what: "Requested addback"
    how: "Change the requested addback and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Do not use this formula when the cap denominator includes the addbacks themselves.
judge:
  - Do not use this formula when the cap denominator includes the addbacks themselves.
  - Capped and uncapped categories must not overlap or duplicate reported benefit.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one EBITDA addback cap you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define addback cap into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
