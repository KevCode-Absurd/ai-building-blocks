new_slug: debt-cash-sweep-checker
name: Debt cash sweep checker
headline: Debt cash sweep checker
summary: Check a loan cash sweep. Get the repayment owed, what your cash allows, ending cash, ending debt and any amount left unpaid.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it the excess cash flow your lender has confirmed, the sweep percentage in the loan, your cash on hand, your minimum cash and the debt that can be repaid. It works out the repayment the loan asks for, the repayment your cash allows, and what is left over on each side.
explain: |-
  Many loans have a cash sweep. After each year, the borrower must use a set share of its excess cash flow to repay debt early. The share is a percentage in the loan agreement. But the borrower may also have to keep a minimum amount of cash. So the amount that must be repaid and the amount that can be repaid can differ.

  This debt cash sweep checker puts those two numbers side by side. The sweep the loan asks for is the excess cash flow times the sweep percentage. The cash available is what you hold above your minimum. The repayment is the smallest of three amounts: the sweep owed, the cash available and the debt that can still be repaid. Anything the cash cannot cover is shown as unpaid, so a shortfall is never hidden.

  It never adds excess cash flow to cash that already includes it, because that would count the same money twice. It does not give a payment instruction or say whether you meet any loan test.
when:
  - Your lender has confirmed the year's excess cash flow and you need the sweep payment worked out.
  - Cash is tight and you want to see how much of the sweep you can pay and how much stays unpaid.
  - You are building the next year of a loan model and need ending cash and ending debt.
  - A reviewer wants the sweep traced back to the loan terms.
not_for:
  - You want to work out excess cash flow itself. This takes a confirmed figure and does not build one.
  - The loan has several debt tranches that are repaid in an order, or required repayments on a schedule. Use the Project payment priority planner for order of payment.
  - You want to test a loan limit after the sweep, such as debt service cover. Use the Loan covenant cash coverage checker.
  - You want a full cash forecast. This is one year and one tier only.
you_give:
  - The excess cash flow your lender has confirmed (from the compliance certificate or the loan agreement's definition)
  - The sweep percentage (from the loan agreement)
  - Your cash on hand before the sweep, already including this year's cash (from your accounts)
  - Your minimum cash, if the loan requires one (from the loan agreement)
  - The debt balance that can be repaid early (from the lender's statement)
  - The currency and the units, such as USD in millions
  - Your own loan spreadsheet (optional)
you_get:
  - The sweep the loan asks for
  - The repayment your cash allows, which is the smallest of the three limits
  - Ending cash and ending debt after that repayment
  - Any sweep left unpaid, shown on its own line
  - A list of missing facts and checks that could not run
  - A small workbook with the same sums, if your AI can make files
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. A chat is enough. You do not need to run code.
  - Paste the five figures and say where each came from. Give the currency and units. Write the sweep percentage as a number, such as 50%.
  - Say whether your cash figure already includes this year's cash flow. It should, and the skill will ask if it is unclear.
  - "Check one line yourself: the sweep owed is the excess cash flow times the percentage. For 15 at 50% that is 7.5."
  - Read the unpaid line, MISSING and CHECKS MISSED before you use any figure. Ask for a workbook only if your AI can make files.
how_it_works:
  - title: Lists the sources
    text: Writes each figure with its date, source, currency and units, and keeps loan terms apart from your assumptions.
  - title: Reads the sweep terms
    text: Takes the confirmed excess cash flow and the sweep percentage. It does not build the excess cash flow figure.
  - title: Works out the sweep owed
    text: Multiplies the confirmed excess cash flow by the sweep percentage.
  - title: Finds the cash available
    text: Takes your minimum cash off your cash on hand. A negative result counts as zero available, and is shown.
  - title: Sets the repayment
    text: Pays the smallest of the sweep owed, the cash available and the debt that can be repaid.
  - title: Ties the balances
    text: Ending cash is cash less the repayment. Ending debt is debt less the repayment. Unpaid sweep is the sweep owed less the repayment.
output_shape: |-
  RESULT
  Sweep owed <amount> | Repayment made <amount> | Ending cash <amount> | Ending debt <amount> | Unpaid sweep <amount>

  SCOPE AND SOURCES
  <currency, units; source and date for each input; the loan clause that sets the sweep>

  INPUTS AND ASSUMPTIONS
  <excess cash flow, sweep percentage, cash before sweep, minimum cash, eligible debt>

  CALCULATIONS AND RECONCILIATIONS
  <each sum with its figures; repayment is the smallest of the three limits; balances tie>

  FILE CHECK
  <what was recalculated in the workbook, or "no workbook made">

  MISSING
  <each fact needed and not given>

  CHECKS MISSED
  <one line per check not done, or none>
output_sample:
  input:
    - The excess cash flow your lender has confirmed
    - The sweep percentage and your minimum cash
    - Your cash on hand before the sweep
    - The debt balance that can be repaid early
  prerequisites:
    - The loan agreement page that sets the sweep and the minimum cash
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: RESULT
      contains: Sweep owed, repayment made, ending cash, ending debt and any unpaid sweep.
    - name: SCOPE AND SOURCES
      contains: The currency and units, with the source and date of each input and the loan clause behind the sweep.
    - name: INPUTS AND ASSUMPTIONS
      contains: Each figure you gave it and each assumption, kept apart from facts.
    - name: CALCULATIONS AND RECONCILIATIONS
      contains: Each sum shown, which of the three limits set the repayment, and the balance ties.
    - name: FILE CHECK
      contains: What was recalculated in the workbook, or a note that none was made.
    - name: MISSING
      contains: Every fact it needed and did not get. It never fills one with zero.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
tweaks:
  - what: Period and currency
    how: Use the same currency and units for every figure. Say them once at the start.
  - what: Cash definition
    how: Say which cash counts toward your minimum, such as only unrestricted cash, so the cash figure is the right one.
  - what: Waivers
    how: If the lender has waived or reduced the sweep, give the waiver and its date. The skill will not assume one.
judge:
  - Do not add ECF again to cash that already includes the period generation.
  - Insufficient cash or debt allocation authority remains a visible gap, not assumed waiver.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can do these sums in a chat and show each step.
    - name: An AI that can make spreadsheet files
      why: It can build the workbook, recalculate it and check that it reopens.
    - name: Node.js 20 or later (optional)
      why: Runs the small script that comes with the skill, for a second check of the numbers.
  inputs:
    - The compliance certificate with the excess cash flow
    - The page of the loan agreement that sets the sweep percentage and minimum cash
    - The lender's statement of the debt balance
    - A named reviewer and the question you want answered
terms:
  - term: Cash sweep
    meaning: A loan rule that sends a share of the year's spare cash to repay debt early.
  - term: Excess cash flow
    meaning: The spare cash left after the costs the loan agreement allows. The agreement defines it, and the lender confirms it.
  - term: Minimum cash
    meaning: The least cash the borrower must keep, so it cannot be used for the sweep.
  - term: Reconciliation
    meaning: A check that explains any gap between two sets of figures that should match.
  - term: Illustrative figures
    meaning: Practice numbers that show how the sums work. They are not a real loan.
