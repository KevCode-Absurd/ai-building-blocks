new_slug: debt-issue-proceeds-checker
name: Debt issue proceeds checker
headline: Debt issue proceeds checker
summary: "Check debt issue proceeds: tie face value to the cash you actually received after issue discount and upfront fees, with checks and gaps listed."
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it the debt face amount, the issue price, the upfront fees and your funding statement. It works out the discount, the cash and the net proceeds. It then ties them to what you actually received.
explain: |-
  Original issue discount, gross cash and usable net proceeds.

  Acquisition financing. Illustrative figures only. 100 face at98% provides98, less1 fee gives97. At95% it gives94 while principal remains100.
when:
  - You have a loan or bond issued below par and need to know the real cash received.
  - You are checking acquisition financing and a lender's funding figure looks low.
  - A reviewer wants to trace net proceeds back to the contract and the funding statement.
  - You want to be sure no fee was taken out twice.
not_for:
  - "You need tax OID amortization or effective-interest schedules: ask your tax adviser or accountant, because this only checks one issue."
  - "You need to know if a loan is legally available or funded: read the signed credit agreement and the lender's funding notice."
  - "You want to build a full debt payoff schedule: use a spreadsheet loan schedule, and keep principal at face there."
you_give:
  - Debt face amount, from the signed contract.
  - Issue price as a share of par, from the contract.
  - Upfront cash fees, listed one by one.
  - Your actual funding statement showing the cash received.
  - Reporting date, currency and scale (for example, thousands).
  - Your spreadsheet tool and the file format you want (optional).
you_get:
  - Original issue discount, worked out as face less face times the issue-price fraction.
  - Gross cash and usable net proceeds, worked out as face times the fraction, less fees.
  - A tie between your result and the funding statement.
  - An editable workbook, if you ask for one.
  - A list of missing inputs and checks that did not run.
how_to_use:
  - Download the pack and open it in your AI. Claude, ChatGPT and Gemini all work.
  - Paste or attach the face amount, issue price, fees and funding statement. Add the currency, scale and date.
  - Ask for the calculation. For a workbook, use an AI that can make and reopen spreadsheet files.
  - To run the bundled script, you need Node.js 20 or later and an AI that can run code. Otherwise the AI does the sums in the chat.
  - Check the discount, gross cash and net proceeds against your funding statement.
  - Read MISSING and CHECKS MISSED before you rely on the result.
output_sample:
  input:
    - Debt face amount
    - Issue price as a share of par, from the contract
    - Upfront cash fees, listed separately
    - Your funding statement showing cash received
    - Currency, scale and reporting date
  prerequisites:
    - A spreadsheet tool and an AI that can work with files, if you want a workbook
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Original issue discount
      contains: Face amount less face times the issue-price fraction, which is the discount at issue.
    - name: Gross cash
      contains: Face times the issue-price fraction, before any upfront fees are taken out.
    - name: Usable net proceeds
      contains: Gross cash less each distinct upfront fee once, tied to your funding statement.
    - name: Scope and dated sources
      contains: Where each input came from, with its date, currency and scale.
    - name: Model calculations and reconciliations
      contains: The workings, and how face less cash ties back to the discount and fees.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation, changed-input test and reopening the file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: 1. Separate legal principal from cash issue price; identify withheld fees and already-netted charges
    text: Separate legal principal from cash issue price; identify withheld fees and already-netted charges.
  - title: 2. Multiply face by issue-price fraction; reconcile face less funded cash as original issue discount
    text: Multiply face by issue-price fraction; reconcile face less funded cash as original issue discount.
  - title: 3. Deduct distinct cash fees once and tie net cash to actual funding evidence while keeping principal at face
    text: Deduct distinct cash fees once and tie net cash to actual funding evidence while keeping principal at face.
output_shape: |-
  Original issue discount, gross cash and usable net proceeds.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Debt principal is not reduced by OID in a principal-payoff schedule.
judge:
  - Debt principal is not reduced by OID in a principal-payoff schedule.
  - No fee is deducted twice when the quoted issue price is already net.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
