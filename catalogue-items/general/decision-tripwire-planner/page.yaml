new_slug: decision-tripwire-planner
name: "Decision options and tripwire planner"
summary: "Paste a yes-or-no choice. Get three real options, a test of your hunch and a stop line set in advance."
job: think-and-decide
thinking: medium
thinking_why: "It follows four fixed moves but has to come up with real alternatives and honest counterarguments."

headline: "Decision options and tripwire planner"
subhead: Give it a choice you are framing as yes or no. It widens the choice to at least three options, argues against your favourite, asks how you will feel later, and sets a number or date that forces a rethink. You get a plan for being wrong.

explain: |
  A yes-or-no question hides better answers. We tend to see two options, favour the one we already lean toward, decide while the feelings are strong, and assume we got it right. Four small fixes help: widen the choices, test the hunch, step back, and prepare for being wrong.

  This skill restates your choice and lists what is pushing you. It adds two options that are not yes or no, and borrows ideas from people outside your field. It argues the opposite of your hunch and lists why your favourite might fail. It asks how you will feel in ten minutes, ten months and ten years. Last, it sets a tripwire, a number or date that makes you rethink, and writes the plan for being wrong, with whom to ask for a second view.

when:
  - You are asking "should I or shouldn't I" about a job, hire, price or project.
  - You have already half-decided and want to test it fairly.
  - You want a clear signal in advance for when to change course.

you_give:
  - The choice, in a sentence, and when you must decide
  - What is pulling you each way
  - What you have already tried or ruled out (optional)
you_get:
  - At least three options, two of them beyond yes or no
  - The case against your favourite, written out
  - A short view across ten minutes, ten months and ten years
  - A tripwire and a fallback with a named person to ask

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Describe the choice and say which way you lean.
  - Read the added options and cross out any that are not real for you. Ask for more if needed.
  - Read the case against your favourite. Mark anything you cannot answer.
  - Write the tripwire in your calendar or notes, and tell the person named in the fallback.

how_it_works:
  - title: Restates the choice
    text: Writes the choice plainly and lists what is pushing you each way.
  - title: Widens the options
    text: Adds two options that are not yes or no, with ideas borrowed from other fields.
  - title: Argues against your hunch
    text: Builds the case against your favourite and lists why it might fail.
  - title: Steps back in time
    text: Asks how each option looks in ten minutes, ten months and ten years.
  - title: Sets the tripwire
    text: Picks a number or date that forces a rethink.
  - title: Plans for being wrong
    text: Writes the fallback and names who to ask for a second opinion.

output_shape: |
  THE CHOICE
  <restated> | Pushing you toward: <list>  Pushing you away: <list>

  THE OPTIONS
  1. <your favourite>  2. <option>  3. <option>  (plus any more)
  Borrowed from: <field or example>

  THE CASE AGAINST YOUR FAVOURITE
  <reasons it might fail>

  STEPPING BACK
  10 minutes: <feeling>  10 months: <feeling>  10 years: <feeling>

  THE TRIPWIRE
  If <number or date> then <rethink>

  IF YOU ARE WRONG
  Fallback: <plan>  Ask for a second view: <name or role>

  MISSING
  <what is unknown>

  CHECKS MISSED
  <one line per check missed, or none>

tweaks:
  - what: Which way you lean
    how: Say it. The case against is aimed at your favourite, so it needs to know what that is.
  - what: Deadline
    how: Give the real date. The tripwire and options fit the time you have.
  - what: What you cannot do
    how: Name limits such as money and time so the added options are real for you.
  - what: Who you trust
    how: Name one or two people. The fallback names one of them for a second view.

judge:
  - There are at least three options, not two.
  - The case against the favourite is written down.
  - The tripwire is a number or a date, not a feeling.
  - There is a named fallback.
  - The ten-minute, ten-month and ten-year views differ in a way that matters.

test:
  - Run it on a choice you made last year and compare the options to what you considered then.
  - Check the tripwire. Could you tell, on that day, whether it had been hit?
  - Run it twice. The extra options should differ, but the case against should stay close.
  - Share the output with the person named as the second view and see if they agree to the role.

improve:
  - Add typical options in your field to the widening step, such as renting, a pilot or a part-time start.
  - Add your own rule for tripwires, such as "never set one lower than the cost of quitting".
  - Keep the tripwire with your plan and check it on a fixed date.
  - Pair it with "Reversible decision sorter" to match the effort to the size of the choice.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Generating options and counterarguments is text work any strong chat AI does well with this skill."}
    - {name: "A calendar", why: "A tripwire date only works if it shows up where you will see it."}
  inputs:
    - "Numbers that bear on the choice, such as cost, runway or pay"
    - "Notes on what similar people or companies chose, and how it went"

terms:
  - term: Tripwire
    meaning: A number or date set in advance that, once reached, forces you to stop and rethink.
