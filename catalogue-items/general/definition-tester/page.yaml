new_slug: definition-tester
name: "Definition tester"
summary: "Test a claim built on a word like fair or loyal. Get a plain definition tried against hard cases, and your claim reworded."
job: think-and-decide
thinking: high
thinking_why: "It has to invent counter-cases that really break a definition, then repair it. That takes careful reasoning."

headline: "Definition tester"
subhead: "Paste a claim that leans on a big word such as fair, loyal or quality. Your AI writes a plain definition, tries cases that could break it, and repairs it each time. You get a tested definition, your claim reworded, and the disputes still open."

explain: |
  Teams argue for hours about whether a pay scheme is "fair" or a customer is "loyal", and never notice that each person means something different. The argument cannot end because the word has no test. A claim that rests on an untested word is a claim nobody can check.

  This definition tester starts with the cases you are sure about. It asks what one feature the sure cases share and the others lack, then writes a definition in plain words without using the word itself. Next it tries to break the definition with two kinds of case: one that fits the words but is plainly not the thing, and one that is plainly the thing but does not fit the words. After each break it repairs the definition and runs the old cases again.

  Unlike a dictionary lookup, it works from your cases and your setting. It also finds one real case people would dispute and says who or what would decide it, step by step. It makes your own wording testable. It does not rule on law or ethics.

when:
  - "Your team argues about whether a pay plan or a policy is 'fair', and nobody can say what fair means."
  - "You are writing a contract term, a survey question or a metric and need a word pinned down first."
  - "A claim sounds right, but you cannot say what would prove it wrong."
  - "Customers or staff keep using a word like 'quality' or 'loyal' and you suspect they mean different things."

not_for:
  - "You need a ruling on a legal term or an ethics question. Ask a lawyer or an expert in that field. This only tests your own wording."
  - "You want to know if a claim is true, not what a word in it means. Use the Claim credibility reviewer."
  - "You want to test the sums behind a loyalty plan or loyalty claim. Use the Loyalty claim checker."
  - "The word is already defined in your contract or law. Use that definition and skip this."

you_give:
  - "The claim or sentence that uses the big word"
  - "Two or three cases you are sure fit the word, and one or two you are sure do not (optional)"
  - "Where people disagree about it (optional)"
  - "Customer or staff comments that use the word (optional)"
  - "Where the definition will be used, such as a contract, a survey or a team rule (optional)"
you_get:
  - "The key word and a tested definition in plain words"
  - "Each test case, with whether it broke the definition and why"
  - "A real case people dispute, and who or what would decide it"
  - "Your claim rewritten with the tested wording"
  - "What is still unclear"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. No files, web search or code needed."
  - "Paste your claim as it stands. Add the cases you are sure about. If you send nothing, it asks for the claim and stops."
  - "Read each test case it offers. Where it marks CONFIRM, say whether the case really breaks the definition. Your answer is the test."
  - "Check the final definition. Could someone who was not in the room use it to sort five new cases?"
  - "Put the new wording in your policy, contract line or message. Hand the 'who decides' steps to the person it names."

how_it_works:
  - title: "Picks the word"
    text: "Finds the one word the claim stands or falls on, and says why it matters."
  - title: "Finds what examples share"
    text: "Looks for the one feature your sure cases have and the others lack, not a list of them."
  - title: "Writes a first definition"
    text: "Uses plain words a stranger could follow, and never the key word itself."
  - title: "Tries to break it"
    text: "Builds cases that fit the words but not the meaning, and the reverse, and says which broke it."
  - title: "Repairs and retests"
    text: "Fixes the definition after each break and reruns the earlier cases, for up to four rounds."
  - title: "Names a disputed case"
    text: "Finds a real case people would argue over and says who or what would decide it."
  - title: "Checks for circles"
    text: "Makes sure the definition does not lean on the word it defines, then rewrites your claim."

output_shape: |
  THE CLAIM
  <claim> | Key word: <word> | Why this word: <reason>

  FIRST DEFINITION
  <definition> | Shared feature: <feature>

  COUNTER-CASES
  1. <case> | Breaks it: <yes/no> | Why: <reason>
  2. ...

  REVISED DEFINITION
  <definition after repairs> | Tested against: <cases>

  A CASE PEOPLE DISPUTE
  <case> | Who or what decides: <person or test> | Steps: <1, 2, 3>

  CIRCLE CHECK
  <ok / found a circle in X and fixed by Y>

  THE CLAIM, REWRITTEN
  <claim with tested wording>

  STILL UNKNOWN
  <what remains unclear>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "Your claim, with the big word in it"
    - "Two or three cases you are sure fit, and one or two you are sure do not (optional)"
    - "Where people disagree, or comments that use the word (optional)"
  output:
    - name: "THE CLAIM"
      contains: "Your claim, the one word it rests on, and why that word matters most."
    - name: "FIRST DEFINITION"
      contains: "A definition in plain words, and the one feature all your sure cases share."
    - name: "COUNTER-CASES"
      contains: "At least two cases that try to break it, each marked broken or not, with the reason."
    - name: "REVISED DEFINITION"
      contains: "The definition after repairs, and the cases it was tested against."
    - name: "A CASE PEOPLE DISPUTE"
      contains: "A real case people would argue over, who or what decides it, and the steps."
    - name: "CIRCLE CHECK"
      contains: "A check that the definition does not use the word it defines, and the fix if it did."
    - name: "THE CLAIM, REWRITTEN"
      contains: "Your original claim with the tested wording swapped in."
    - name: "STILL UNKNOWN and CHECKS MISSED"
      contains: "What stays unclear, and one line for each of its own checks it could not meet."

tweaks:
  - what: Sure examples
    how: Give cases you are certain fit and cases you are certain do not. They anchor the definition.
  - what: The setting
    how: Say where the definition will be used, such as a contract, a survey or a team rule. The test changes.
  - what: Who disagrees
    how: Name the groups. The disputed case is sharper when it comes from a real split.
  - what: How exact it must be
    how: A legal term needs more counter-cases than a team value. Say which you need.

judge:
  - The key word has a written definition.
  - At least two counter-cases were tried and the result of each is shown.
  - The final claim uses the tested wording.
  - What remains unknown is stated plainly.
  - Someone who was not in the room could apply the definition.

test:
  - Run it on a word you already define well, such as "invoice", and check it does not invent trouble.
  - Give the final definition to two people and ask each to sort five cases. They should agree.
  - Run it twice. The counter-cases may differ, but the final definition should be close.
  - Try to break the final definition yourself with a case it missed.

improve:
  - Add the words your team argues about most, with the cases that caused each fight.
  - Add your field's standard definitions so it can compare against them.
  - Save each tested definition in a glossary file and paste it in next time.
  - Pair it with "Customer buying reasons finder" when the word came from customer comments.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Building and testing definitions against cases is reasoning in text."}
    - {name: "A shared glossary page", why: "Tested definitions are only useful if the team can find them."}
  inputs:
    - "Real cases that caused disagreement"
    - "The policy or contract line that uses the word"
    - "Customer or staff quotes that use the word"

terms:
  - term: Counter-case
    meaning: A case that fits your words but plainly is not the thing, or is the thing but does not fit your words.
  - term: Circle
    meaning: A definition that uses the word it is meant to define, so it explains nothing.
  - term: Key word
    meaning: The one word the whole claim stands or falls on.
