new_slug: disagree-and-commit-note-writer
name: Disagree-and-commit note writer
summary: "Turn a stuck decision and each person's view into one fair dissent line each, a named decider and a note that closes the debate."
job: lead-people
thinking: medium
thinking_why: It separates two kinds of disagreement, but the note format and steps are fixed.
headline: "Disagree-and-commit note writer"
subhead: "Paste the decision and each person's view and reason. It writes each doubt as one fair line and tests whether it is a different guess or a clash of aims. You get who decides, a commit line for each person and a short team note with a review date."
explain: |
  Debate has to end. When it does not, the default winner is the person with the most stamina. A team that cannot disagree and then act together either argues forever, or goes along in silence and drags its feet.

  This disagree and commit note writer puts each doubt on record in one fair line per person. Then it asks two questions. Do both sides want the same outcome? Would new facts change this person's mind? If yes to both, it is a difference of view, and you ask people to gamble with you and commit. If not, it is a clash of aims, and one named person decides, fast.

  The note names the owner, the review date and the signal that would show the decision is wrong. The boss writes a dissent and a commit line too. The method comes from Jeff Bezos's 2016 letter to shareholders.
when:
  - "A decision has been argued in three meetings with no end."
  - "One person keeps reopening a call after it was made."
  - "You are the boss and you disagree with a call your team wants to make."
  - "Two people want different things, such as speed against quality, and more talk is not fixing it."
not_for:
  - "You are still choosing between options and nobody is arguing. Use the Decision evidence planner first."
  - "You want views weighed by track record to pick the call. Use the Group decision reviewer."
  - "You need to name one owner before the debate starts. Use the Team decision ownership planner."
  - "You need to give one person hard feedback. Use the Hard feedback message writer."
you_give:
  - "The decision and the options"
  - "Each person's view, with their reason, in a line or two"
  - "Who owns the decision (optional)"
  - "The deadline (optional)"
  - "Notes from the meetings where it was argued (optional)"
you_get:
  - "One fair line of dissent per person, including the boss if they disagree"
  - "Each dissent sorted as a difference of view or a clash of aims"
  - "A named decider, a time limit and what each side brings, if the aims clash"
  - "A commit line each person says back, with an action in it"
  - "A signal that would show the decision is wrong, and a review date"
  - "A short note for the team"
how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. It needs no tools."
  - "Paste the decision, the options and each person's view with the reason. If you leave out the decision or the views, it asks for them and stops. If a view is only a position, it asks for the reason."
  - "Say who owns the decision and when it must be made."
  - "Show each person their dissent line and ask if it is fair. Fix any line they would not accept."
  - "Send the team note, then hold the review date."
how_it_works:
  - title: Records each dissent
    text: "One fair line per person: what they fear will go wrong, and why."
  - title: Sorts view from aims
    text: Same goal with different guesses, or different goals.
  - title: Escalates a clash of aims
    text: Names who decides, what each side brings and a 48 hour limit.
  - title: Asks for the gamble
    text: For a difference of view, asks the dissenter to commit.
  - title: Applies it to the boss
    text: If the boss disagrees, the boss writes a dissent and commits too.
  - title: Writes the commit lines
    text: What each person will do, in their own voice.
  - title: Drafts the team note
    text: Decision, owner, review date, signal and dissents on record.
output_shape: |
  DECISION
  <decision | owner | review date>

  DISSENT ON RECORD
  <name | what they think will go wrong | why>

  VIEW OR AIMS
  <name | view / aims | test result>

  ESCALATE
  <who decides | what each side brings | by when> or "none: no clash of aims"

  COMMIT LINES
  <name: "I disagree because ... I will ... fully ... we look at ... on ...">

  SIGNAL THAT IT IS WRONG
  <what we would see, and when>

  NOTE TO THE TEAM
  <short note>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - "The decision and the options"
    - "Each person's view, with their reason"
    - "Who owns the decision and any deadline (optional)"
  output:
    - name: "DECISION"
      contains: "The decision, its owner and the review date."
    - name: "DISSENT ON RECORD"
      contains: "One fair line per person: what they think will go wrong, and why."
    - name: "VIEW OR AIMS"
      contains: "Each dissent sorted as a difference of view or a clash of aims, with the two-question test."
    - name: "ESCALATE"
      contains: "For a clash of aims: who decides, what each side brings and a two-day limit. Otherwise none."
    - name: "COMMIT LINES"
      contains: "One line per person saying why they disagree, what they will do and when the team looks again."
    - name: "SIGNAL THAT IT IS WRONG"
      contains: "What the team would see, and by when, that shows the decision is wrong."
    - name: "NOTE TO THE TEAM"
      contains: "Five to eight lines: decision, owner, review date, signal, dissents on record and thanks."
    - name: "MISSING and CHECKS MISSED"
      contains: "What you did not give, and any of its own checks it missed."
tweaks:
  - what: Each person's reason
    how: Give a line or two each. A fair dissent needs the real reason, not just the position.
  - what: Who owns the decision
    how: Name one person. If no one owns it, say so and the skill will flag it.
  - what: The review date
    how: Pick a date when the first signal will be visible.
  - what: The tone of the team
    how: Say if people have felt unheard. The note will say that the doubts were recorded.
judge:
  - Each dissent is one fair line the person would accept.
  - Every dissent is sorted as view or aims, with the test.
  - A clash of aims goes to a named decider with a time limit.
  - The commit lines say what the person will do, not just agree.
  - The note names a signal and a review date.
test:
  - Show each person their dissent line. Ask if it is fair.
  - Run it on a past decision that dragged. See if it finds a clash of aims.
  - Run it with the boss as a dissenter. The boss should get a commit line too.
  - Hold the review date. Compare the signal with what happened.
improve:
  - Add your team's way of escalating, such as a named tie-breaker.
  - Add the phrases your team uses for committing.
  - Keep a log of dissents and who was right.
  - Pair it with "Decision evidence bar setter" before the call.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Writing fair summaries of views and a short team note is text work any strong chat AI does well with this skill.
  inputs:
    - Meeting notes where the views were argued
    - The decision deadline
    - Past decisions the same people disagreed on
    - The cost of delay
terms:
  - term: Disagree and commit
    meaning: You state that you disagree, then back the decision fully once it is made.
  - term: Misalignment
    meaning: A clash of aims or priorities that more talk will not fix.
