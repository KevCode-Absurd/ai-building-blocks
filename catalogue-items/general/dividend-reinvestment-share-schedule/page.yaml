new_slug: dividend-reinvestment-share-schedule
name: Dividend reinvestment share schedule
headline: Dividend reinvestment share schedule
summary: Find how many shares a cash dividend buys at your actual reinvestment price, and compare the result with keeping the cash.
job: money-and-investing
thinking: high
thinking_why: "The shares added depend on the real reinvestment price, and mixing in adjusted prices would count the dividend twice."
subhead: Give it your share count, dividend and reinvestment price. It works out the new shares and compares your ending value with keeping the cash. Fees and withholding are shown on their own lines.
explain: |-
  With a dividend reinvestment plan, the cash dividend buys more shares instead of being paid out to you. This schedule shows the new shares. It also compares your ending value with the case where you kept the cash.

  New shares = (dividend cash − fees − withholding) ÷ the price the plan actually paid. It uses the real reinvestment price from your plan statement, not the market price on another day. It tracks share count. It does not test whether the company can afford its dividend.

  Illustrative figures. 100 shares × $1 yields $100, which buys five shares at $20. At an ending price of $22, 105 shares are worth $2,310, against $2,300 if the dividend stayed cash. If the shares were bought at $22, both values would be $2,300.
when:
  - You got a cash dividend that was reinvested and want to see the new share count.
  - You want to know if reinvesting left you better off than taking the cash.
  - A reviewer needs to trace the result back to your inputs.
  - You want an editable spreadsheet to check a plan statement.
not_for:
  - "You want total return from a price series: use an adjusted-price return calculation in a spreadsheet, and do not add dividends twice."
  - "Your plan fees or withholding are unknown: get the plan statement from your broker first, then run this."
  - "You want a forecast of future dividends or prices: ask a licensed adviser, because this schedule only uses prices you supply."
  - "You want to know if the company can afford its dividend and buybacks: use the Shareholder payout cash checker instead."
  - "You need EPS and share counts restated after a stock split: use the Stock split earnings adjustment calculator instead."
you_give:
  - Shares you held before the dividend.
  - Dividend per share.
  - The actual price the dividend was reinvested at.
  - Fees and withholding, if any (optional).
  - The ending share price.
you_get:
  - The dividend cash, net cash and shares added.
  - Your ending value next to the keep-the-cash case.
  - An editable spreadsheet with live formulas.
  - A list of missing inputs and checks that did not run.
how_to_use:
  - Download the pack and open SKILL.md in your AI, or paste it in.
  - Share your share count, dividend, reinvestment price, fees, withholding and ending price.
  - Ask your AI to build the schedule as a spreadsheet. This needs an AI that can make files.
  - Check the net cash, shares added and ending value against your broker statement.
  - Read MISSING and CHECKS MISSED before you rely on the result.
output_sample:
  input:
    - Shares you held before the dividend
    - Dividend per share
    - Actual reinvestment price
    - Fees and withholding (optional)
    - Ending share price
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation (optional)
  output:
    - name: Scope and dated sources
      contains: The records used, their dates, the currency and scale, and the question being answered.
    - name: Inputs and assumptions
      contains: Every number you supplied, with fees and withholding shown on their own lines.
    - name: Model calculations and reconciliations
      contains: Dividend cash, net cash, shares added and ending value, set against the case where the cash was kept.
    - name: Editable workbook
      contains: A spreadsheet with live formulas, an input schema and golden test cases.
    - name: Actual file verification
      contains: The recalculation, changed-input and reopen checks that were run on the workbook.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and checks that failed or could not run.
how_it_works:
  - title: Confirm the inputs
    text: Check the payment date, eligible shares and the actual reinvestment price. Use unadjusted prices.
  - title: Turn cash into shares
    text: Dividend cash less fees and withholding, divided by the reinvestment price, gives new shares.
  - title: Compare with holding cash
    text: Compare ending value with and without reinvesting.
output_shape: |-
  A dividend cash-to-shares schedule with a no-reinvestment comparator.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING:
  CHECKS MISSED
tweaks:
  - what: "Ending price"
    how: "Change the ending price in your inputs and ask your AI to recalculate the schedule. You see at which price reinvesting beats keeping the cash. Use one currency and scale on every line."
  - what: "Reinvestment price"
    how: "Change the reinvestment price and have your AI recalculate. Keep the actual figures you supplied."
  - what: "Dividend per share"
    how: "Change the dividend per share and have your AI recalculate the dividend cash and the new shares. Keep the actual figures you supplied."
judge:
  - An adjusted total-return price series is not combined with explicit dividends.
  - Residual cash and fractional-share restrictions are disclosed rather than silently rounded away.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one dividend reinvestment you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define reinvestment price into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
before: []
