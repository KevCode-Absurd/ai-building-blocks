  - {type: audit_report, required: false}
outputs:
  - {type: audit_report}
origin: rebuilt
version: 1.0.0
needs_mode: manual
minds: [ed-catmull]
credits:
  - {title: "Creativity, Inc.", by: "Ed Catmull with Amy Wallace, Random House, 2014", used: "Early versions are expected to be bad, so judge a project against its own earlier versions; step in when the crew loses confidence in the lead or when work returns unchanged after notes; the options are keep going, change the lead, or shut it down"}
