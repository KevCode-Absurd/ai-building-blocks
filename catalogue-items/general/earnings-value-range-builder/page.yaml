new_slug: earnings-value-range-builder
name: Earnings value range builder
summary: Turn a range of normal earnings and a share price into a low, middle and high earnings value range, and see how much of the price is hope.
job: money-and-investing
thinking: high
thinking_why: It chooses a multiple with reasons, handles debt ahead of the shares and must keep the answer a range. That needs careful reasoning.
headline: See what a company's earnings support, and how much of the price is hope
subhead: It applies this method’s chosen earnings multiples and ceiling to supplied figures, then compares the results with price. Get a three-point model range and a supported price breakdown. The breakdown requires positive price and supported nonnegative values; its parts cannot exceed the price or turn negative. These labels do not prove true value or tell you to trade.
explain: |
  An earnings multiple produces a model value under stated assumptions. It does not establish what a share is truly worth or whether it is suitable to buy. Normal earnings, multiples and debt treatment need evidence.

  This skill uses the method’s historical multiple and yield rules, then compares model values with a supplied price. It splits only a finite positive price using supported nonnegative values. The earnings-supported part cannot exceed the price; the remainder cannot be negative, and both shares add to 100%. A model value above price is shown separately. Missing inputs or unsupported domains leave the affected result unresolved.
when:
  - You know what a company earns in an ordinary year and want to see what that supports.
  - A share price looks high and you want to know how much of it rests on growth that has not happened.
  - You are weighing a price for a small business and want a range, not one number.
not_for:
  - "You have no earnings figures yet: use the Normal earnings estimator first to get low, normal and high earnings per share."
  - "You want to value a company that loses money, or a private business with no adjusted earnings: ask a licensed financial adviser for a fuller valuation."
  - "You need to decide on a large or personal purchase: use a licensed financial adviser, because this is a method, not advice."
you_give:
  - Low, normal and high earnings per share from "Normal earnings estimator"
  - The share price and share count, or the asking price of a private business
  - Debt and preferred shares ahead of the ordinary shares (optional)
  - The yield on top-grade bonds today (optional)
you_get:
  - A multiple with the reason for it
  - A low, middle and high value per share and in total
  - A cross-check against interest rates
  - The earnings yield and whether it clears the floor
  - A nonnegative model price breakdown, plus any separate value-versus-price gap, or an unresolved result
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the earnings range, the price and the debt ahead of the shares.
  - Say what you know about how stable the business is.
  - Read the split of the price before the range.
  - Take the result to "Asset floor estimator".
output_sample:
  input:
    - Low, normal and high earnings per share, from the Normal earnings estimator
    - The share price and share count, or the asking price of a private business
    - Debt and preferred shares ahead of the ordinary shares (optional)
    - The yield on top-grade bonds today (optional)
    - A few words on how stable the business is (optional)
  prerequisites:
    - The earnings range from the Normal earnings estimator
  output:
    - name: FACTS
      contains: The earnings range, price, share count and debt ahead, with any missing items marked.
    - name: MULTIPLE
      contains: The chosen multiple with its reason, the ceiling of 20 and the interest-rate cross-check.
    - name: VALUE RANGE
      contains: Low, middle and high value per share and in total.
    - name: DEBT AHEAD
      contains: How a quarter change in business earnings moves earnings per share.
    - name: YIELD FLOOR
      contains: Normal earnings divided by price, and whether it clears about 5%.
    - name: SPLIT OF THE PRICE
      contains: The earnings-supported part of the price and the remainder, or an unresolved result with the reason.
    - name: HOW WIDE
      contains: One sentence on how wide the range is and what that means.
    - name: MISSING
      contains: Facts you did not give.
    - name: CHECKS MISSED
      contains: One line for each check still missed, or none.
how_it_works:
  - title: Picks the multiple
    text: Anchors at about 10 to 12.5 and moves it only for stated reasons, never above 20.
  - title: Cross-checks with interest rates
    text: Compares the multiple with 1 divided by twice the top-grade bond yield.
  - title: Builds the range
    text: Low, middle and high values from low, normal and high earnings.
  - title: Allows for debt ahead
    text: Shows how debt and preferred shares magnify the swings in earnings per share.
  - title: Applies the yield floor
    text: Calls the price speculative if normal earnings are under about 5% of it.
  - title: Splits the price
    text: Uses the lowest of positive price, supported MIDDLE value and ceiling for the earnings-supported price part. The remainder is nonnegative; value above price is separate.
output_shape: |
  FACTS
  Normal earnings per share: <low> / <normal> / <high> | Price: <amount> | Shares: <n> | Debt and preferred ahead: <amount>

  MULTIPLE
  <multiple> because <reason> | Ceiling: 20 | Interest-rate cross-check: <multiple>

  VALUE RANGE
  LOW: <value> | MIDDLE: <value> | HIGH: <value> (per share) | In total: <low> / <middle> / <high>

  DEBT AHEAD
  A quarter change in business earnings moves earnings per share by <percent>

  YIELD FLOOR
  Normal earnings / price = <percent> | Clears 5%: <yes / no>

  SPLIT OF THE PRICE
  Supported domain <positive price; nonnegative supported values, or unresolved>
  Earnings-supported price part: <amount, percent> | Remainder: <amount, percent>
  Check: parts add to price and 100%; neither is negative
  Separate MIDDLE-versus-price gap <amount, not a negative remainder>

  HOW WIDE
  <one sentence on the gap and what it means>

  MISSING
  <facts not given>

  CHECKS MISSED
  <one line per check still missed, or none>
tweaks:
  - what: Your multiple
    how: Give one if you have a reason. The skill checks it against the ceiling and interest rates.
  - what: Bond yield
    how: Give the current top-grade yield. It sets the cross-check.
  - what: Debt detail
    how: List each debt with its rate. Heavy debt lowers the multiple a step.
  - what: Private business
    how: Give the asking price and the owner's pay. Owner pay changes normal earnings.
judge:
  - The multiple has a reason and does not pass 20.
  - The value is a range of three points.
  - The yield floor is applied and stated.
  - On the supported domain, price parts are nonnegative, add to price and 100%, and leave excess model value as a separate comparison.
  - It never says buy or sell and invents no figure.
test:
  - Run it on a company with debt and check that the swings in earnings per share are shown.
  - Give it a price over 20 times normal earnings and see that the price is called speculative.
  - Run it with and without a bond yield and check the cross-check changes.
  - Run it twice. The range should not change.
  - "Use price 8, MIDDLE 12, ceiling 20: parts 8 and 0, or 100% and 0%; show MIDDLE-minus-price 4 separately."
  - "Use HIGH earnings 1.37 and chosen multiple 12: HIGH model value 16.44. Zero price leaves the percentage split unresolved."
improve:
  - Add your own multiples by type of business, from past reads.
  - Keep a record of ranges and prices later seen.
  - Pair it with "Normal earnings estimator" and "Asset floor estimator".
  - Run it on three similar companies and compare the splits.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Picking a multiple with reasons and splitting a price is text work. It cannot look up prices.
    - name: A spreadsheet
      why: Handy for the three-point range and the yield.
    - name: A licensed financial adviser
      why: Needed for a large or personal decision. This skill is a method, not advice.
  inputs:
    - The earnings range from the earlier step
    - The latest balance sheet, for the debt and preferred shares ahead
terms:
  - term: Multiple
    meaning: The number you multiply earnings by to get a value. A multiple of 12 means a value of 12 times a year's earnings.
  - term: Earnings yield
    meaning: A year's earnings divided by the price. It is the multiple turned upside down.
  - term: Speculative part of a price
    meaning: A house analytical label for the remaining price after the capped earnings-supported part. It is not proof of investment quality or actual future growth.
