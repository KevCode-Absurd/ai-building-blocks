new_slug: earnings-value-range-builder
name: "Earnings value range builder"
summary: "Paste normal earnings and the share price. Get a low, middle and high value and how much of the price is hope."
job: money-and-investing
thinking: high
thinking_why: "It chooses a multiple with reasons, handles debt ahead of the shares and must keep the answer a range. That needs careful reasoning."

headline: "See what a company's earnings support, and how much of the price is hope"
subhead: "Give it normal earnings as a range, the share price and any debt ahead of the shares. It picks a multiple that fits the business and never lets it pass a hard ceiling, applies a floor on earnings yield and splits the price into the part earnings support and the part that is hoped-for growth."

explain: |
  Many people value a company by the latest year's profit times a number they have heard. That gives a neat answer and a poor one. The profit swings, the number is a habit, and the result says nothing about how much of the price is a bet.

  This skill uses a range of normal earnings and picks a multiple for the business, with a hard ceiling at 20 times for anything called an investment. It checks the multiple against interest rates, applies a floor on earnings yield, and adjusts for debt and preferred shares ahead. Then it splits the price: the part that normal earnings support, and the part paid for results not yet shown. It is a method, not financial advice, and never says buy or sell.

when:
  - You know what a company earns in an ordinary year and want to see what that supports.
  - A share price looks high and you want to know how much of it rests on growth that has not happened.
  - You are weighing a price for a small business and want a range, not one number.

you_give:
  - Low, normal and high earnings per share from "Normal earnings estimator"
  - The share price and share count, or the asking price of a private business
  - Debt and preferred shares ahead of the ordinary shares (optional)
  - The yield on top-grade bonds today (optional)
you_get:
  - A multiple with the reason for it
  - A low, middle and high value per share and in total
  - A cross-check against interest rates
  - The earnings yield and whether it clears the floor
  - The price split into an investment part and a speculative part

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the earnings range, the price and the debt ahead of the shares.
  - Say what you know about how stable the business is.
  - Read the split of the price before the range.
  - Take the result to "Asset floor estimator".

how_it_works:
  - title: Picks the multiple
    text: Anchors at about 10 to 12.5 and moves it only for stated reasons, never above 20.
  - title: Cross-checks with interest rates
    text: Compares the multiple with 1 divided by twice the top-grade bond yield.
  - title: Builds the range
    text: Low, middle and high values from low, normal and high earnings.
  - title: Allows for debt ahead
    text: Shows how debt and preferred shares magnify the swings in earnings per share.
  - title: Applies the yield floor
    text: Calls the price speculative if normal earnings are under about 5% of it.
  - title: Splits the price
    text: Separates the part earnings support from the part paid for hoped-for growth.

output_shape: |
  FACTS
  Normal earnings per share: <low> / <normal> / <high> | Price: <amount> | Shares: <n> | Debt and preferred ahead: <amount>

  MULTIPLE
  <multiple> because <reason> | Ceiling: 20 | Interest-rate cross-check: <multiple>

  VALUE RANGE
  LOW: <value> | MIDDLE: <value> | HIGH: <value> (per share) | In total: <low> / <middle> / <high>

  DEBT AHEAD
  A quarter change in business earnings moves earnings per share by <percent>

  YIELD FLOOR
  Normal earnings / price = <percent> | Clears 5%: <yes / no>

  SPLIT OF THE PRICE
  Investment part: <amount, percent> | Speculative part: <amount, percent>

  HOW WIDE
  <one sentence on the gap and what it means>

  MISSING
  <facts not given>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: Your multiple
    how: Give one if you have a reason. The skill checks it against the ceiling and interest rates.
  - what: Bond yield
    how: Give the current top-grade yield. It sets the cross-check.
  - what: Debt detail
    how: List each debt with its rate. Heavy debt lowers the multiple a step.
  - what: Private business
    how: Give the asking price and the owner's pay. Owner pay changes normal earnings.

judge:
  - The multiple has a reason and does not pass 20.
  - The value is a range of three points.
  - The yield floor is applied and stated.
  - The price is split into investment and speculative parts.
  - It never says buy or sell and invents no figure.

test:
  - Run it on a company with debt and check that the swings in earnings per share are shown.
  - Give it a price over 20 times normal earnings and see that the price is called speculative.
  - Run it with and without a bond yield and check the cross-check changes.
  - Run it twice. The range should not change.

improve:
  - Add your own multiples by type of business, from past reads.
  - Keep a record of ranges and prices later seen.
  - Pair it with "Normal earnings estimator" and "Asset floor estimator".
  - Run it on three similar companies and compare the splits.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Picking a multiple with reasons and splitting a price is text work. It cannot look up prices."}
    - {name: "A spreadsheet", why: "Handy for the three-point range and the yield."}
    - {name: "A licensed financial adviser", why: "Needed for a large or personal decision. This skill is a method, not advice."}
  inputs:
    - "The earnings range from the earlier step"
    - "The latest balance sheet, for the debt and preferred shares ahead"

terms:
  - term: Multiple
    meaning: The number you multiply earnings by to get a value. A multiple of 12 means a value of 12 times a year's earnings.
  - term: Earnings yield
    meaning: A year's earnings divided by the price. It is the multiple turned upside down.
  - term: Speculative part of a price
    meaning: The part of a price that normal earnings do not support, paid in hope of results not yet shown.
