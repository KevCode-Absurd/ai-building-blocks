new_slug: economic-profit-fade-schedule
name: Economic profit fade schedule
headline: Economic profit fade schedule
summary: "Build an economic profit schedule: two years of excess returns, then zero. You get the present value added to your invested capital."
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A two-period economic-profit schedule and PV contribution over invested capital. Share opening invested capital, two annual NOPAT forecasts, WACC and evidence supporting constant capital and zero later excess returns.
explain: |-
  A two-period economic-profit schedule and PV contribution over invested capital.

  Public equity valuation. Illustrative figures.Capital charge1,000×10%=100. Excess returns20 and10 have PV20/1.1+10/1.21=26.446281. Add constant capital1,000 to obtain1,026.446281 under the imposed terminal assumptions.
when:
  - You need a two-period economic-profit schedule and PV contribution over invested capital.
  - You work on public equity valuation and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "Your capital, tax or write-offs change each year: build a larger schedule with a finance person, since this one holds capital flat."
  - "Excess returns last longer than two years: use a longer multi-year valuation model in your own spreadsheet instead."
  - "You need a full investment view or advice: ask a qualified analyst, because this only shows one narrow calculation."
you_give:
  - Opening invested capital, two annual NOPAT forecasts, WACC and evidence supporting constant capital and zero later excess returns.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A two-period economic-profit schedule and PV contribution over invested capital.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
output_sample:
  input:
    - Your opening invested capital
    - Two years of forecast NOPAT (operating profit after tax)
    - Your WACC (cost of capital)
    - Evidence that capital stays flat and later excess returns are zero
    - Reporting date, currency and scale
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, if you want to run the bundled calculation (optional)
  output:
    - name: Scope and dated sources
      contains: The mandate, valuation date, currency, scale and each source with its date.
    - name: Inputs and assumptions
      contains: Every input and assumption, kept apart from reported facts and marked MISSING where unknown.
    - name: Model calculations and reconciliations
      contains: The yearly capital charge, each year's economic profit, its present value and the total added to capital.
    - name: Actual file verification
      contains: What was recalculated, reopened and rendered in the workbook, and what could not run.
    - name: MISSING and CHECKS MISSED
      contains: Open inputs and any checks that failed or did not run, or the word none.
how_it_works:
  - title: 1. Use operating invested capital excluding nonoperating assets and a WACC matching NOPAT
    text: Use operating invested capital excluding nonoperating assets and a WACC matching NOPAT.
  - title: 2. Deduct the annual capital charge from each NOPAT forecast and discount each economic profit at correct annual timing
    text: Deduct the annual capital charge from each NOPAT forecast and discount each economic profit at correct annual timing.
  - title: 3. Add discounted economic profits to opening capital only under constant-capital and zero-terminal-excess-return assumptions; reconcile maintenance investment with depreciation
    text: Add discounted economic profits to opening capital only under constant-capital and zero-terminal-excess-return assumptions; reconcile maintenance investment with depreciation.
output_shape: |-
  A two-period economic-profit schedule and PV contribution over invested capital.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Terminal NOPAT equals WACC times constant invested capital.
judge:
  - Terminal NOPAT equals WACC times constant invested capital.
  - Growth capital is not omitted from a business described as growing.
  - Trace dates, currency, scale, accounting perimeter and source pages for every material input.
  - Keep the focused illustration separate from a complete investment conclusion; list unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
