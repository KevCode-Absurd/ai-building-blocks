new_slug: edit-a-draft-so-it-sells
name: "Fix the lines in your draft that lose sales"
summary: "Paste your draft and your facts. You get the weak lines fixed, each with what it gains, and your best details kept."
job: write-ad-copy

headline: "Fix the lines in your draft that lose sales"
subhead: Paste any customer-facing draft and the facts it may use. It reads the draft as a skimmer, as a line-by-line reader and as a doubter, fixes only where one of them would stop, and logs each change with what it gains.

explain: |
  Edits often make copy worse. The odd true detail gets cut because it sounds informal, a clear line gets softened, or the whole piece gets rewritten and loses its voice. Nobody can say what each change was for.

  This skill reads your draft three ways. First as a skimmer, who only sees headings, first sentences and buttons. Then line by line, marking every place a reader could stop. Then as a doubter about to pay, checking each claim and term. It fixes the stops from the top of the page down, because the top gets the most attention. Every change goes in a ledger with its gain. That might be a lower reading grade, or a claim now backed by your facts. A change with no gain is undone.

when:
  - You have a draft ad, page, email or script and want an editor's read before it goes out.
  - A rewrite made your copy blander and you want to know which changes to undo.
  - You need to change one thing in copy that already works, without breaking the rest.

you_give:
  - The draft, with each part labelled (headline, body, button)
  - The facts it may use, such as approved claims, offer terms and product facts
  - Who it's for and how much they know (optional)
  - One specific change you want, if the copy already runs (optional)
  - Your voice notes and claims you must never make (optional)
you_get:
  - What it locked, and the specific details it protected
  - The word count, reading grade and longest sentence, before and after
  - A ledger of changes, each with the read that found it and what it gains
  - Lines left as they are, with the reason, and a one-line verdict

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your draft underneath, with each part labelled.
  - Paste the facts it may use. It won't add anything beyond them.
  - If you only want one thing changed, say so, for example "make the headline answer the price doubt".
  - Read the ledger. Undo any change whose gain doesn't convince you.

how_it_works:
  - title: Locks what can't move
    text: Lists your claims, numbers, terms and the order of the argument, plus every specific detail, and protects them.
  - title: Measures the draft
    text: Counts the words and gives the reading grade and the longest sentence, so you can see the change.
  - title: Reads as a skimmer
    text: Checks that headings, first sentences, captions and buttons carry the point on their own.
  - title: Reads line by line
    text: Marks every place a reader could stop, such as a jump in logic or a word to decode.
  - title: Reads as a doubter
    text: Checks each claim for a fact beside it, and each price, renewal and guarantee for its full terms.
  - title: Fixes from the top
    text: Makes the plainest fix for each stop, top of the page first, and logs the gain. No gain means no change.

output_shape: |
  LOCKED
  <claims, numbers, terms, the order of the argument>

  SPECIFICS PROTECTED
  <every number, name, how-it-works detail or odd true detail>

  MEASURES
  <words, reading grade, longest sentence> -> <after>

  LEDGER
  <n>. <part> | read <1 skim / 2 slide / 3 doubt>
     Was:  "<old text>"
     Now:  "<new text>"
     Gain: <fewer words / lower grade / stop removed / claim backed>

  LEFT AS IS
  <lines kept, and why>

  VERDICT
  <a wording problem, or a weak reason to buy no edit can fix>

example:
  business: sprout
  input: |
    [the skill]

    Draft (product page, top section):
    Under title: 60+ potent ingredients to revive whole body vitality
    in great tasting gummies.
    Bullets: Promotes mental clarity + energy / Supports immunity +
    stress relief / Supports digestion and gut health / Clinically
    tested for nutrient absorption
    Plan box: Subscribe & Save. $29.99. $1.07/day. Pause Or Cancel Any
    Time. 30-Day Money-Back Guarantee.
    Button: Start Now
    Under button: DISCOUNT AUTO-APPLIED. Renews at $49.99 each 4 weeks.
    Cancel anytime.
    Why Sprout: No more gagging on pills, sloshing chalky powders, or
    cleaning messy counters.

    Facts: 60+ ingredients, 21 vitamins & minerals, 6 g fiber per pack.
    The $29.99 needs the text sign-up discount for new customers. The
    guarantee covers the first order only.
    Buyer: people who quit powders and think it costs too much.
  output: |
    LOCKED
    $29.99, $1.07/day, $49.99 each 4 weeks, the 30-day guarantee, the
    four bullets, the order (promise, bullets, plan, button, why)

    SPECIFICS PROTECTED
    "60+", "Renews at $49.99 each 4 weeks", "gagging on pills",
    "sloshing chalky powders", "cleaning messy counters"

    MEASURES
    69 words, grade 8.3 -> 94 words, grade 6.0. The extra words are the
    terms the doubter needed.

    LEDGER
    1. Under title | read 3 doubt
       Was:  "60+ potent ingredients to revive whole body vitality"
       Now:  "60+ ingredients, 21 vitamins and minerals, and 6 g of
             fiber, in one pack of great tasting gummies a day."
       Gain: claim backed. Nobody can picture "whole body vitality";
             the facts list says what's in the pack.
    2. Plan box | read 3 doubt
       Was:  "30-Day Money-Back Guarantee."
       Now:  "30-day money-back guarantee on your first order."
       Gain: term stated in full, where the buyer decides.
    3. Button | read 1 skim
       Was:  "Start Now"
       Now:  "Start my first box"
       Gain: stop removed. It says what the buyer gets.
    4. Under button | read 3 doubt
       Was:  "DISCOUNT AUTO-APPLIED."
       Now:  "$29.99 for your first box with the text sign-up discount
             for new customers."
       Gain: claim backed. The discount needs the text sign-up, so
             "auto-applied" isn't true.

    LEFT AS IS
    "Renews at $49.99 each 4 weeks. Cancel anytime." is plain and
    honest. The "Why Sprout" line is all specifics. Bullets 1 and 2 are
    bold claims, so a claims check owns them.

    VERDICT
    A wording problem. The reason to buy (no more chalky powders) is
    strong. Run bullets 1 and 2 through a claims check.

tweaks:
  - what: A change request
    how: If the copy already runs, name the one change you want. It locks everything else and only touches what the request needs.
  - what: The facts
    how: A fix that needs a fact you didn't give becomes MISSING. Give it the full facts list and it can back vague claims with something you can point to.
  - what: The reading grade target
    how: It aims for grade 8 or under for ads and emails and 10 for pages. Name your own target if your buyers read at a different level.
  - what: How many changes
    how: Six is the default. Ask for "the top three" if you're short on time. It fixes from the top of the page down.

judge:
  - Every ledger row names a gain you can check.
  - No claim, number, price, guarantee, name or quote changed.
  - Every specific detail from your draft is still there.
  - Most lines were left as they were, with a reason.
  - Read each new line beside the old one. The new one should be plainer, not cleverer.

test:
  - Run it on copy a good editor has already fixed. It should find most of the same lines and keep the details your editor kept.
  - Run it twice. The locked list and the specifics should match both times.
  - Plant a line nobody would say in a strong draft, such as "Nutrition, reimagined." It should fix that line and leave the rest.
  - Plant a guarantee with its limit left out. The doubter read should catch it.
  - Check the before and after reading grades with a free readability checker. They should be close to what it reports.

improve:
  - Paste the claims your brand must never make into "What you need" in the skill file, so no fix goes near them.
  - If your copy always has the same parts, list them in step 1 (for example "headline, main text, button").
  - Set your own reading grade target in step 2.
  - Save the specifics it protects to your brand file. They're often the best material for your next ad.
  - Run "Stop your copy from sounding like AI" first if an AI tool wrote the draft, and finish with "Know if your copy is ready to publish".

terms:
  - term: Specific
    meaning: A detail a reader can check or picture, such as a number, a name or how it's made. Every edit protects these.
  - term: Stop
    meaning: A place where a reader would stop reading, such as a word they'd have to decode or a jump in logic.
  - term: Reading grade
    meaning: The school year a reader needs to follow the text easily, worked out from sentence and word length.
