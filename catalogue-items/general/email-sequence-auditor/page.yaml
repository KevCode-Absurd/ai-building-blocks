new_slug: email-sequence-auditor
name: Email sequence auditor
summary: "Email sequence auditor: sort each email in your flow by its numbers. Get protect, fix and unknown groups, plus one test per problem."
job: audit-landing-page
thinking: medium
thinking_why: It reads numbers per email and sorts them by fixed rules.
headline: Email sequence auditor
subhead: Bring the flow map, timing, recipient counts and results for the same period. It keeps current emails as the control, works out supported rates and flags missing facts. Get priority groups, one fix and test for each supported problem, plus a team note. The score is a house summary. A full score waits until all its parts can be judged; unknown results earn no health points.
explain: |
  When a flow underperforms, the usual move is to rewrite it. That throws away the emails that work, and the rewrite is based on taste, not numbers. You end up changing things you have never measured.

  This skill treats the current emails as the control and changes nothing yet. It maps the whole flow: triggers, timing, tags and dead ends. It records each email's numbers and sorts them. Green emails are protected and studied. Red emails are fixed first. Yellow emails come next. It leaves out style opinions and fixes only what the numbers show. Findings go to your team before any rewrite.
when:
  - Your welcome or follow-up flow underperforms and you plan to rewrite it.
  - You inherited a flow and do not know which emails matter.
  - Revenue from email is flat and you do not know where it leaks.
not_for:
  - "You have no send or result data yet: use your email platform's flow report first, then come back."
  - "You want to audit one single broadcast email: read its numbers in your email platform, as there is no flow to map."
  - "You want new emails written: ask your AI to rewrite only the red emails after the audit, with a person's review."
you_give:
  - "Your email flow: each email with trigger and timing"
  - Opens, clicks, conversions, unsubscribes and revenue per email
  - Segments and tags the flow uses (optional)
  - The goal of the flow (optional)
you_get:
  - A map of the flow with dead ends marked
  - Each email as green, yellow or red, with its numbers
  - Score components and data coverage; a full score only when all parts can be judged
  - One proposed fix and one test for each red email
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the flow in order, with timing between emails.
  - Paste the numbers for each email for the same period.
  - Say what the flow should achieve.
  - Share the audit with your team before anyone rewrites an email.
output_sample:
  input:
    - Your email flow, each email with its trigger and timing
    - Opens, clicks, conversions, unsubscribes and revenue per email for the same period
    - Your goal for the flow (optional)
    - Segments and tags the flow uses (optional)
  prerequisites:
    - Results exported from your email platform's flow report
  output:
    - name: Score
      contains: A score out of 100 only if every part can be judged, with the sums and data coverage.
    - name: Flow map
      contains: The trigger, each email with its delay, and any dead ends.
    - name: Numbers
      contains: A table of open, click, conversion, unsubscribe and revenue for each email.
    - name: Green
      contains: Emails that work, with why, so you protect and study them.
    - name: Red
      contains: Emails with a failed number, each with one fix and one test.
    - name: Yellow
      contains: Emails to look at next, including any with missing numbers.
    - name: For the team
      contains: Findings and decisions needed before anyone rewrites an email.
    - name: Missing
      contains: Every gap in your data, listed and never guessed.
    - name: Checks missed
      contains: One line for each check the audit missed, or none.
how_it_works:
  - title: Keeps the control
    text: Treats the current emails as the control and changes nothing yet.
  - title: Maps the flow
    text: Maps triggers, timing, tags and dead ends.
  - title: Records the numbers
    text: Records each email’s results for the same period. Missing data stays marked, earns no health credit and is shown in the coverage count.
  - title: Sorts by colour
    text: Uses green for supported strong results, red for supported problems and yellow for uncertain or missing results. Unknown is not healthy.
  - title: Leaves out taste
    text: Fixes only problems the numbers show.
  - title: Reports first
    text: Reports before any rewrite. It shows component sums and coverage. With unresolved components it withholds the full score; a structural subtotal is labeled separately.
output_shape: |
  SCORE: <n>/100 only if all components can be judged; otherwise NOT SCORED
    COMPONENTS: map 20 | verified numbers 20 | healthy judged emails 40 | no dead ends 20
    OUTCOME COVERAGE: <judged emails>/<total emails>
    HEALTH: <40 x green share of judged emails | NOT SCORED if none>
    STRUCTURAL SUBTOTAL: <available points, labeled structural only; not a health score>

  FLOW MAP
  <trigger> -> <email 1> (day 0) -> <email 2> (day 2) ... 
  Dead ends: <list>

  NUMBERS
  <email> | Open | Click | Conversion | Unsubscribe | Revenue

  GREEN (protect and study)
  <email> | <why>

  RED (fix now)
  <email> | <number that failed> | Fix: <one fix> | Test: <one test>

  YELLOW (next)
  <email> | <why>

  FOR THE TEAM
  <findings and decisions needed before any rewrite>

  MISSING
  <list>

  CHECKS MISSED
  <one line per check missed, or none>
tweaks:
  - what: Numbers for every email
    how: Give each email’s numbers. Gaps stay yellow, earn no health credit and remain outside the judged-outcome denominator. Unresolved score parts block a full score.
  - what: Your red line
    how: Tell it your own thresholds, for example a first-email open rate it must beat.
  - what: Volume per email
    how: Add how many people received each. Small groups make the colours less certain.
  - what: Flow goal
    how: Name the one action the flow is for. It decides which numbers matter.
judge:
  - Every finding points to a number, not a taste.
  - Nothing is rewritten before the control is measured.
  - Missing data is listed, not guessed.
  - Each red email has one proposed fix and one test.
  - Green emails are named as ones to protect.
  - Unknown results earn no health points. Coverage is shown, and unresolved components prevent a full score.
test:
  - Run it on a flow where you know the best email. Check it is green.
  - Check that no finding is about style, such as tone or word choice, unless a number backs it.
  - Run it twice. The colours should match.
  - Fix one red email, wait for the numbers and re-run the audit.
  - Give a three-email flow with no results. All remain unknown/yellow; health and the full score are NOT SCORED, even if the flow map is complete.
improve:
  - Add your own cut-offs for opens, clicks and unsubscribes by email type.
  - Add the tags and segments your flows use, so dead ends are spotted.
  - Save the green emails to a folder as your reference copy.
  - Pair it with a rewrite step that works only on the red emails.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Sorting emails by their numbers is work any strong chat AI does with this skill.
    - name: Your email platform's flow report
      why: Gives per-email opens, clicks, conversions and revenue.
  inputs:
    - Send counts per email
    - "Flow settings: triggers, delays and tags"
    - The goal and the list size
terms:
  - term: Control
    meaning: The current version, kept as it is so changes can be compared against it.
  - term: Dead end
    meaning: A point where people stop receiving emails without a reason.
  - term: Flow
    meaning: A set of emails sent in order after something a person does.
