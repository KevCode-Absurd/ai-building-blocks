thinking: medium
thinking_why: "It writes or plans with a handful of checks."
new_slug: empty-room-image-ad-maker
name: "Empty room image ad maker"
summary: "Turn your story ad into an empty-room image ad: a photo prompt with three set objects and a short line to run under the picture."
job: make-image-ads

headline: "Empty room image ad maker"
subhead: Give it your story ad. It picks the room where the change shows and casts three objects that show what the problem left, what tells the hour and where the person should be. You get the photo prompt and the line under the image.

explain: |
  Some problems change how people live more than how they look: sleep, rushed mornings, a routine that slips. A sad face at a window is a cliché and reads as an ad. A room just after someone left it works better, because readers fill in the missing person, and the person they picture is themselves.

  The skill casts three objects, each with one job. The trace is what the problem left behind, like a full mug gone cold. The clock tells the hour, like low sun after the school run. The gap shows where the person should be, like a chair pushed back. It puts the camera where that person would stand coming back in, lets the hour set the light, and adds ordinary clutter so the room looks lived in.

when:
  - Your buyer's problem changes their routine, sleep or home life more than their looks.
  - You want a picture with feeling and no staged sad face.
  - Your story already mentions what the room looked like.
not_for:
  - "Your problem shows in how people look, or the ad leads with price: use a plain photo of the product or a face-led picture from your own designer instead."
  - "You want a picture of a person in the moment: ask for a Problem moment image ad maker if you have one, since this skill never shows anyone in frame."
  - "You need the story ad itself first: use the Fact-based ad copy writer, then bring its text here."

you_give:
  - Your approved story ad, with the changed-day detail in its opening
  - What changed in how buyers live, in their words (optional)
  - Your brand's places, light and anything you never show (optional)
you_get:
  - The room, the hour and the light
  - The trace, the clock and the gap, with where the camera stands
  - The line under the image, and flags on anything taken from the story alone
  - A 60 to 120 word image prompt, ready to paste
  - Any of the skill's five checks still missed, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad. The room and its objects should be in the opening lines.
  - Add what customers say changed in their days, if you have reviews or notes.
  - Paste the image prompt into your image tool. If the room looks like a catalogue, ask again with more clutter.
  - Read the flags. Check anything taken only from the story against what buyers say.
output_sample:
  input:
    - Your approved story ad, with the changed-day detail in its opening
    - What changed in how buyers live, in their words (optional)
    - Your brand's places, light and anything you never show (optional)
  prerequisites:
    - An AI chat such as Claude, ChatGPT or Gemini
    - An image tool if you want the picture made (ChatGPT and Gemini can; Claude needs one connected)
  output:
    - name: Scene
      contains: One line on what someone scrolling would say they saw.
    - name: Room and hour
      contains: The room, the time of day and the light.
    - name: The trace, the clock and the gap
      contains: "One object each: what the problem left, what tells the hour, and where the person should be."
    - name: Camera
      contains: Where the camera stands and why, at the eye level of the person coming back in.
    - name: Ordinary clutter
      contains: Everyday items unrelated to the story, so the room looks lived in.
    - name: Line under the image
      contains: A short caption of about 27 characters, with its character count.
    - name: Flags
      contains: Any object taken from the story alone, and where it came from.
    - name: Image prompt
      contains: A 60 to 120 word prompt, ready to paste into your image tool.
    - name: Checks missed
      contains: Any of the five checks the result still fails, one line each, or none.

how_it_works:
  - title: Sets the house rules
    text: Square, looks taken on a phone, no logo, price, button, brand colour or product, and nobody in frame.
  - title: Picks the room
    text: The room your buyer would recognise first, without a caption.
  - title: Casts three objects
    text: One trace of the problem, one clock that tells the hour, one gap where the person should be.
  - title: Places the camera
    text: Where the person would stand coming back in, at their eye level.
  - title: Sets light and clutter
    text: The hour sets the light, and ordinary clutter makes the room look lived in.

output_shape: |
  SCENE              <what someone scrolling would say they saw>
  ROOM AND HOUR      <room, time, light>
  THE TRACE          <what the problem left behind>
  EXTRA TRACE        <one more, or none>
  THE CLOCK          <what tells the hour>
  THE GAP            <where the person should be>
  CAMERA             <where it stands, and why>
  ORDINARY CLUTTER   <things with nothing to do with the story>
  WORDS ON THE IMAGE None.
  LINE UNDER IMAGE   <words> (<characters>)
  FLAGS              <objects from the story alone, and their source>
  IMAGE PROMPT       <60 to 120 words, ready to paste>
  CHECKS MISSED      <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on review 15):
    By 8:15 the kitchen is empty. Two cereal bowls in the sink, a
    lunchbox lid left on the counter, and at my place, a full mug of
    coffee gone cold and a slice of toast with one bite out of it.
    That was my breakfast most school days.
    Now I grab a Sprout pack on the way out. Tear the top, eat the
    small handful of gummies on the way. 21 vitamins and minerals,
    6 g prebiotic fiber. Or as one mum put it: "So easy to grab and
    eat on my way to the billion things I have to do as a mom."

    Buyer: the busy parent, 30 to 45, mostly mums.
    Brand look: bright, sunny, real homes. Never clinical.
  output: |
    SCENE              An empty kitchen just after the school run, a
                       full mug and a bitten slice of toast left at one
                       place.
    ROOM AND HOUR      Family kitchen, about 8:15am, bright low sun
                       through the window, lights off.
    THE TRACE          At one place: a full mug of coffee gone cold.
    EXTRA TRACE        Beside it, a plate with a slice of toast, one
                       bite out.
    THE CLOCK          A lunchbox lid left on the counter, its box gone,
                       with the low morning sun across the table.
    THE GAP            The chair at that place pushed back at an angle,
                       as if someone stood up mid-bite.
    CAMERA             In the doorway at adult eye level, where the
                       parent would stand coming back for their keys.
    ORDINARY CLUTTER   Two cereal bowls in the sink, a hair tie and a
                       school letter on the table, a charger cable.
    WORDS ON THE IMAGE None.
    LINE UNDER IMAGE   Breakfast, one bite in. (23, plain caption)
    FLAGS              From the story, not research: the cold coffee
                       and the toast. Review 15 backs the rush in a
                       mum's own words, but not these objects. Check
                       this is a morning real buyers describe before it
                       runs. No children in frame; the bowls and
                       lunchbox lid are objects only.
    IMAGE PROMPT       Square 1:1 phone photo taken from a kitchen
                       doorway at adult eye level at about 8:15am,
                       slightly tilted, bright low morning sun across
                       the table, lights off, a little grain in the
                       shadows. Nobody in the room. At one place, a
                       full mug of coffee gone cold and a plate with a
                       slice of toast with one bite out of it; that
                       chair is pushed back at an angle. A lunchbox lid
                       on the counter. Two cereal bowls in the sink, a
                       hair tie, a school letter and a charger cable on
                       the table. Lived-in, unstyled. No person, no
                       children, no logo, no product, no text.
    CHECKS MISSED      none

tweaks:
  - what: Which room
    how: Ask for "the bedroom at 2am" or "the hallway by the front door" if that's where your buyer's change shows. Pick the room they'd recognise first.
  - what: The three objects
    how: Name your own trace, clock or gap from your research. Keep one per role, plus one extra trace at most.
  - what: The hour
    how: The light does much of the feeling. Grey early light reads as "after a bad night"; bright sun on an empty table reads as "everyone left already".
  - what: Where the camera stands
    how: Move it to where your buyer would come back in, such as the top of the stairs or the end of the bed.

judge:
  - Nobody is in the frame, and nothing suggests harm or an emergency.
  - You can name the trace, the clock and the gap without being told.
  - It looks lived in, with clutter that has nothing to do with the story.
  - Nothing says whose home it is.
  - There's no product and no second, happier photo.

test:
  - Show the picture to someone who fits your buyer and ask what happened in this room this morning. If they can tell the story back, the objects work.
  - Run it twice on the same story. The room and the three roles should stay the same.
  - Run it on a story with no changed room. It should ask once, then carry on with the room marked [inferred] and suggest the everyday snapshot.
  - Test it against a snapshot with a person in it. Some buyers respond to the empty room, some to a face.

improve:
  - Add what buyers say changed at home, in their own words, to your org context. Those details become the trace and stop the flags.
  - Add your brand's light and time of day to step 5, so the hour matches your look.
  - Add the objects your brand never shows (medicine, bins, mess) to the house rules.
  - Write the trace into your story's first line, so the reader can match picture and text at once.

works_best_with:
  tools:
    - {name: "GPT Image", why: "Its thinking mode plans where things sit before it draws, which helps place the three objects."}
    - {name: "Nano Banana", why: "Takes up to 10 object photos, so a real mug, pillow or lamp can be copied into the room."}
  inputs:
    - "Photos of real rooms like your buyers' (your own or your team's, with permission), so the room looks lived in"
    - "Reviews that mention a time of day, so the clock object and the light are real"
    - "Your brand's past photos, so the light and finish match the rest of your feed"

terms:
  - term: Story ad
    meaning: An ad whose main text tells one person's story, like a post from a friend.
  - term: The trace, the clock, the gap
    meaning: The three objects in the room. One shows what the problem left, one tells the time, one shows where the person should be.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
