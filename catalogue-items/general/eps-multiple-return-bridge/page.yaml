new_slug: eps-multiple-return-bridge
name: EPS and multiple return bridge
headline: EPS and multiple return bridge
summary: Explain a share-price change through earnings growth and P/E multiple change. Give EPS, P/E and dividends. You get a bridge that adds up to the price move.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A sequential price-return attribution that reconciles exactly to the observed change. Share positive comparable starting and ending EPS, dated P/E multiples, cash dividends and corporate-action adjustments.
explain: |-
  A sequential price-return attribution that reconciles exactly to the observed change.

  Public equity and share counts. Illustrative figures. Price rises from $20 to $36: $10 comes from EPS growth at 10× and $6 from the multiple change on $3 EPS. With $1 cash dividend, period return is 17/20=85%.
when:
  - You need a sequential price-return attribution that reconciles exactly to the observed change.
  - You work on public equity and share counts and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "Your EPS is zero or negative: the bridge needs positive EPS, so use a valuation model built for loss-making firms, or ask an analyst."
  - "You need dividends reinvested, tax, fees or a forecast: use a total-return model in a spreadsheet, as this bridge covers none of these."
  - "You want a buy, sell or price call: speak to a licensed adviser, because this only explains a past move."
you_give:
  - Positive comparable starting and ending EPS, dated P/E multiples, cash dividends and corporate-action adjustments.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A sequential price-return attribution that reconciles exactly to the observed change.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
output_sample:
  input:
    - Starting and ending EPS on the same basis
    - Starting and ending P/E multiples, with dates
    - Cash dividends paid in the period
    - Currency, scale and reporting date
    - Share splits or other corporate actions (optional)
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later to run the bundled calculation script (optional)
  output:
    - name: Scope and dated sources
      contains: The question, the period, and the dated sources used for each input.
    - name: Inputs and assumptions
      contains: Every input with its date, currency, scale and any assumption made.
    - name: Model calculations and reconciliations
      contains: The earnings effect, the multiple effect, the dividend and the total return, checked against the price change.
    - name: Editable workbook
      contains: A spreadsheet with inputs, formulas and checks, plus an input schema and test cases.
    - name: Actual file verification
      contains: Which checks ran on the real files, such as recalculation, a changed input and reopening.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that could not be found and checks that failed or did not run.
how_it_works:
  - title: 1. Put both EPS figures on the same split, accounting and period basis; derive comparable price from EPS times P/E at each date
    text: Put both EPS figures on the same split, accounting and period basis; derive comparable price from EPS times P/E at each date.
  - title: 2. Hold the opening multiple fixed to measure the EPS effect, then apply the ending EPS to the multiple change; show the chosen ordering
    text: Hold the opening multiple fixed to measure the EPS effect, then apply the ending EPS to the multiple change; show the chosen ordering.
  - title: 3. Divide each dollar effect and cash dividend by opening price and reconcile to the simple total holding-period return
    text: Divide each dollar effect and cash dividend by opening price and reconcile to the simple total holding-period return.
output_shape: |-
  A sequential price-return attribution that reconciles exactly to the observed change.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Earnings effect plus multiple effect equals the price change exactly.
judge:
  - Earnings effect plus multiple effect equals the price change exactly.
  - Dividend cash is not counted again in a dividend-adjusted price series.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
