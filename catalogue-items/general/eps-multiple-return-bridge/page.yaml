new_slug: eps-multiple-return-bridge
name: EPS and multiple return bridge
headline: EPS and multiple return bridge
summary: Explain a share-price change through earnings growth and P/E multiple change. Give EPS, P/E and dividends. You get a bridge that adds up to the price move.
job: money-and-investing
thinking: high
thinking_why: "The two effects overlap, so the order you apply them in changes each one and the total must still tie."
subhead: Give it the starting and ending EPS, the dated P/E multiples and any cash dividends. You get the price change split into an earnings effect and a multiple effect that add up to the real change.
explain: |-
  A share price moves for two reasons: earnings change, or buyers pay a different multiple of earnings (the P/E). This bridge splits the move into those two parts and shows they add up to the real change.

  Illustrative figures: the price rises from $20 to $36. EPS growth from $2 to $3 at a 10x multiple explains $10. The multiple moving from 10x to 12x on $3 EPS explains $6. With a $1 cash dividend, the period return is 17 / 20 = 85%.
when:
  - You want to know how much of a share-price move came from earnings and how much from the multiple.
  - You work on public equity and share counts and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "Your EPS is zero or negative: the bridge needs positive EPS, so use a valuation model built for loss-making firms, or ask an analyst."
  - "You need dividends reinvested, tax, fees or a forecast: use a total-return model in a spreadsheet, as this bridge covers none of these."
  - "You want a buy, sell or price call: speak to a licensed adviser, because this only explains a past move."
  - "You need basic EPS built from weighted-average shares: use the Weighted share count calculator instead."
you_give:
  - Positive comparable starting and ending EPS, dated P/E multiples, cash dividends and corporate-action adjustments.
  - "The start and end dates, plus the currency and scale used for the price return bridge."
  - "Your spreadsheet tool, if you want the price return bridge as a workbook."
you_get:
  - A sequential price-return attribution that reconciles exactly to the observed change.
  - "An editable workbook of the price return bridge, with its inputs, formulas and test cases to rerun."
  - "A tie-out of the two effects and the observed price change, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the EPS, P/E and dividend figures for both dates."
  - "Tell it what you need: the share-price change split into an earnings effect and a multiple effect."
  - "Ask it to stop and mark MISSING if a P/E or an EPS figure is not in your sources."
  - "Check that the earnings effect plus the multiple effect equals the price change, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Starting and ending EPS on the same basis
    - Starting and ending P/E multiples, with dates
    - Cash dividends paid in the period
    - Currency, scale and reporting date
    - Share splits or other corporate actions (optional)
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later to run the bundled calculation script (optional)
  output:
    - name: Scope and dated sources
      contains: The question, the period, and the dated sources used for each input.
    - name: Inputs and assumptions
      contains: Every input with its date, currency, scale and any assumption made.
    - name: Model calculations and reconciliations
      contains: The earnings effect, the multiple effect, the dividend and the total return, checked against the price change.
    - name: Editable workbook
      contains: A spreadsheet with inputs, formulas and checks, plus an input schema and test cases.
    - name: Actual file verification
      contains: Which checks ran on the real files, such as recalculation, a changed input and reopening.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that could not be found and checks that failed or did not run.
how_it_works:
  - title: Lines up the two dates
    text: Puts both EPS figures on the same share basis and the same kind of period, after any split. Price at each date is EPS times P/E.
  - title: Splits the price move
    text: The earnings part keeps the starting P/E and changes only EPS. The multiple part is the P/E change times the ending EPS. The two add up to the price change.
  - title: Turns it into a return
    text: Divides each part and the cash dividends by the starting price, so you see each one's share of your total return over the period.
output_shape: |-
  A sequential price-return attribution that reconciles exactly to the observed change.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Start and end dates"
    how: "Take the start and end dates from the EPS, P/E and dividend figures for both dates. Use one currency and scale on every line."
  - what: "The order of the two effects"
    how: "Change the order of the two effects and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Earnings effect plus multiple effect equals the price change exactly.
judge:
  - Earnings effect plus multiple effect equals the price change exactly.
  - Dividend cash is not counted again in a dividend-adjusted price series.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one price return bridge you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define P/E multiple into SKILL.md, so every run uses your wording."
next: [earnings-reliability-check]

works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
  - term: Holding-period return
    meaning: Your total gain over the period, from the price change plus cash dividends, as a share of the starting price.
  - term: Dividend-adjusted price series
    meaning: Past prices lowered by data providers to build dividends in. Use it, or add dividends yourself, but never both, or the dividend counts twice.
