new_slug: excel-handover-guide-writer
name: Excel workbook handover writer
summary: Share your workbook and update steps. Get a guide for its next owner.
job: work-with-files
thinking: high
thinking_why: Native file features, source meaning and check evidence must
  survive the workflow.
headline: Excel workbook handover writer
subhead: Share a working workbook and its update process. Get a guide explaining
  inputs, formulas, refresh steps and known limits. Work on a copy of your file.
  Get a clear record of what passed and what still needs checking.
explain: >-
  Share a working workbook and its update process. Get a guide explaining
  inputs, formulas, refresh steps and known limits.


  It works with the actual Excel files and follows a specific method for this
  task. Your source files stay intact. The method starts by checking what your
  AI already knows and which files it can read. It asks only for missing facts
  that change the work.


  You get the requested files plus a short record of the sources and checks. A
  saved file alone does not prove that its formulas, links or layout work. Any
  check that needs an app your AI cannot use stays marked as not run. Review
  those limits before you share the result.
when:
  - Share a working workbook and its update process. Get a guide explaining
    inputs, formulas, refresh steps and known limits.
  - The actual workbook, source-file locations supplied with permission, update
    process, target Excel version and intended next owner.
  - You need a checked copy while keeping your original files intact.
you_give:
  - The actual workbook, source-file locations supplied with permission, update
    process, target Excel version and intended next owner.
  - The app and file tools your AI can use for the requested work
you_get:
  - workbook-handover.md, a dependency inventory and an unchanged source
    workbook.
  - A record of source files, changes and check results
  - Missing facts and any checks that could not run
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it
    and paste it in.
  - Supply your actual files and describe the result. The AI checks existing
    context before asking for missing information.
  - Review the native output and its real check evidence before sharing it.
how_it_works:
  - title: Step 1
    text: 1. Read existing documentation and confirmed context before asking for
      information. Inspect actual sheets, formulas, names and connections to
      distinguish observed behavior from the owner’s description.
  - title: Step 2
    text: 2. Map each input to its source, unit, period and expected grain. Record
      access requirements without copying passwords, tokens or private
      connection strings.
  - title: Step 3
    text: 3. Trace important outputs to their owning formulas and inputs. Explain
      deliberate overrides and the difference between blank, zero and missing
      data.
  - title: Step 4
    text: 4. Write the real update sequence, validation controls, stop conditions
      and recovery from a failed refresh. Mark unexecuted steps as instructions
      rather than completed tests.
  - title: Step 5
    text: 5. Have the guide point to exact sheets, ranges and safe example files.
      Preserve the original workbook and leave unresolved dependencies or
      ownership decisions clearly listed.
output_shape: |-
  FILES
  workbook-handover.md, a dependency inventory and an unchanged source workbook.

  SOURCE MAP
  <file and version> | <sheet, cell or slide> | <what it supports>

  CHECKS
  <check> | <passed, failed or not run> | <evidence>

  OPEN ITEMS
  <missing fact or unsupported check> | <next action>
tweaks:
  - what: Your source files
    how: The actual workbook, source-file locations supplied with permission, update
      process, target Excel version and intended next owner.
  - what: The result you need
    how: Name the file format, audience and parts that must stay editable. State any
      page or slide limit.
  - what: The app used to check it
    how: Say which Excel or PowerPoint version you will use. Your AI must name any
      check it cannot run.
judge:
  - Instructions match inspected features.
  - Credentials are excluded.
  - Refresh and recalculation claims have actual evidence.
  - The result names its sources and keeps unrun checks visible.
test:
  - "Try this case: The owner says Refresh All updates a query, but no refresh
    engine is available. Check that it does this: Describe the observed
    connection and required refresh sequence; mark execution not run."
  - "Try this case: An output depends on a missing external workbook. Check that
    it does this: List the exact unresolved dependency and affected outputs."
  - Reopen the saved result and compare it with the source. Keep any failed or
    unrun check in the report.
improve:
  - Add your confirmed field names, file rules and target app version to the
    required-input section.
  - Add a small test case with a known answer to the acceptance checks. Keep
    made-up records separate from real work.
  - Save the working rules with the file guide so the next run uses the same
    meanings and checks.
warnings:
  - Requires tools for the requested native file format. Checks requiring an
    unavailable native application must remain marked not run.
tests:
  - input: The owner says Refresh All updates a query, but no refresh engine is
      available
    expected: Describe the observed connection and required refresh sequence; mark
      execution not run.
  - input: An output depends on a missing external workbook
    expected: List the exact unresolved dependency and affected outputs.
