new_slug: excel-input-form-builder
name: Excel input form builder
summary: Build an Excel input form with dropdowns, clear entry cells and duplicate checks. Give your field rules and get a form ready to fill in.
job: work-with-files
thinking: high
thinking_why: Native file features, source meaning and check evidence must survive the workflow.
headline: Excel input form builder
subhead: Share your fields and allowed values. Get an Excel input form with dropdowns, clear entry cells and validation checks. Work on a copy of your file. Get a clear record of what passed and what still needs checking.
explain: >-
  A sheet anyone can type into fills up with typos, blanks and duplicate IDs. This builds an Excel table that limits what can be entered and shows problems as they happen.


  It works with the actual Excel files and follows a specific method for this task. Your source files stay intact. The method starts by checking what your AI already knows and which files it can read. It asks only for missing facts that change the work.


  You get the requested files plus a short record of the sources and checks. A saved file alone does not prove that its formulas, links or layout work. Any check that needs an app your AI cannot use stays marked as not run. Review those limits before you share the result.
when:
  - You collect records in Excel and keep getting typos, blanks or duplicate IDs.
  - You are handing a sheet to someone else to fill in and want it to limit what they can type.
  - You have your field list and allowed values, and want a form built from them.
not_for:
  - "You need many people to enter data at the same time: use a shared database or an online tool such as Google Forms."
  - "You only want to clean or fix data already in a sheet: do that by hand or ask your AI for a one-off cleanup, not a new form."
  - "You need a form that stops pasted data for sure: Excel checks can be bypassed by pasting, so use a database with enforced rules."
you_give:
  - Field names, data types, allowed values, required fields, record key and intended Excel version.
  - The app and file tools your AI can use for the requested work
you_get:
  - input-form.xlsx and field-rules.md, with an empty production table and a separate illustrative test copy.
  - "In the workbook: a form sheet with one column per field and shaded entry cells, a lists sheet holding the dropdown values, and a check column that flags duplicates and missing fields."
  - A record of source files, changes and check results
  - Missing facts and any checks that could not run
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Supply your actual files and describe the result. The AI checks existing context before asking for missing information.
  - Review the native output and its real check evidence before sharing it.
output_sample:
  input:
    - Your field names, with the type of each (text, date, number)
    - Allowed values for each field, such as a list for status
    - Which fields are required, and which field is the record key
    - Your Excel version
    - Your existing workbook to copy from (optional)
  prerequisites:
    - An AI that can read and write real Excel files (.xlsx), not only text
  output:
    - name: input-form.xlsx
      contains: An empty Excel table with dropdowns, entry cells, a frozen header, and visible checks for missing and duplicate entries.
    - name: field-rules.md
      contains: Each field with its type, allowed values, required status and how blanks and zero are treated.
    - name: Illustrative test copy
      contains: A separate copy with made-up records used to test valid, missing, duplicate and pasted-invalid entries.
    - name: Source map
      contains: Which source file and cell each rule came from, and what it supports.
    - name: Checks
      contains: Each check marked passed, failed or not run, with the evidence.
    - name: Open items
      contains: Missing facts and checks that could not run, each with a next action.
how_it_works:
  - title: Step 1
    text: 1. Reuse confirmed field definitions. Distinguish text identifiers, dates, quantities, blanks and valid zero values. Ask only for unresolved rules that change validation.
  - title: Step 2
    text: 2. Create one record per row in a native Excel table. Store IDs as text, keep dates typed and reserve separate columns for inputs and calculated results.
  - title: Step 3
    text: 3. Add dropdowns with Excel's Data Validation list (from a named list on a separate sheet) and plain error messages. Check required fields and duplicate keys with visible diagnostics; pasted data can bypass validation.
  - title: Step 4
    text: 4. Give the entry cells a light fill, freeze the top row of the table and keep any existing formulas. Add a duplicate flag column (for example a COUNTIF check on the key). Lock calculation cells only if asked, and say that worksheet protection is not encryption.
  - title: Step 5
    text: 5. Test valid, missing, duplicate and pasted-invalid records in a disposable copy. Reopen the saved workbook and deliver the empty form with its rules and unresolved limitations.
output_shape: >-
  FILES

  input-form.xlsx and field-rules.md, with an empty production table and a separate illustrative test copy.


  SOURCE MAP

  <file and version> | <sheet, cell or slide> | <what it supports>


  CHECKS

  <check> | <passed, failed or not run> | <evidence>


  OPEN ITEMS

  <missing fact or unsupported check> | <next action>
tweaks:
  - what: Your source files
    how: Field names, data types, allowed values, required fields, record key and intended Excel version.
  - what: The result you need
    how: Say who will fill in the form and which columns must stay open for them to edit.
  - what: The app used to check it
    how: Say which Excel version you will use. Your AI must name any check it cannot run.
judge:
  - No invented production records.
  - Blank and zero obey the supplied rules.
  - Validation survives save/reopen or its unverified status is stated.
  - The result names its sources and keeps unrun checks visible.
test:
  - "Try this case: Record ID 0012, quantity 0 allowed, status Open or Closed. Check that it does this: Keep 0012 as text and 0 as a valid number; restrict the status list."
  - "Try this case: Two pasted records share the same required ID. Check that it does this: Flag both as duplicate candidates; do not silently delete either."
  - Reopen the saved result and compare it with the source. Keep any failed or unrun check in the report.
improve:
  - Add your confirmed field names, file rules and target app version to the required-input section.
  - Add a small test case with a known answer to the acceptance checks. Keep made-up records separate from real work.
  - Save the working rules with the file guide so the next run uses the same meanings and checks.
warnings:
  - Requires tools for the requested native file format. Checks requiring an unavailable native application must remain marked not run.
tests:
  - input: Record ID 0012, quantity 0 allowed, status Open or Closed
    expected: Keep 0012 as text and 0 as a valid number; restrict the status list.
  - input: Two pasted records share the same required ID
    expected: Flag both as duplicate candidates; do not silently delete either.
