new_slug: excel-workbook-change-reviewer
name: Excel workbook change reviewer
summary: Compare two versions of an Excel workbook. Get a review of changed values, formulas and file features, with the cell for each change.
job: work-with-files
thinking: high
thinking_why: Native file features, source meaning and check evidence must survive the workflow.
headline: Excel workbook change reviewer
subhead: Share the old and revised workbook. Get a review of changed values, formulas, names and workbook features. Work on a copy of your file. Get a clear record of what passed and what still needs checking.
explain: >-
  Two versions of a workbook can look the same and still differ: a formula pasted over with its value, a moved row, a changed range. This compares the old and revised files and lists each change with its sheet and cell.


  It works with the actual Excel files and follows a specific method for this task. Your source files stay intact. The method starts by checking what your AI already knows and which files it can read. It asks only for missing facts that change the work.


  You get the requested files plus a short record of the sources and checks. A saved file alone does not prove that its formulas, links or layout work. Any check that needs an app your AI cannot use stays marked as not run. Review those limits before you share the result.
when:
  - A colleague sends back a revised budget or model and you need to see what changed before you rely on it.
  - You want proof that only the changes you asked for were made.
  - A number changed and nobody can say which edit caused it.
not_for:
  - "You want to fix errors in a workbook: ask the file owner or an Excel user to repair it. This item only reviews and makes no repairs unless you ask."
  - "You are comparing two unrelated files: this tool needs an old and a new version of the same workbook. Use the owner's change log instead."
  - "You only need to know that two files differ: use Excel's own Spreadsheet Compare or a manual check."
you_give:
  - Your old workbook
  - Your revised workbook
  - What you meant to change (optional)
  - Which column or ID identifies each row (optional)
  - How big a difference matters, such as a rounding limit (optional)
  - Which Excel version you will open the result in (optional)
you_get:
  - workbook-change-review.xlsx and change-register.md.
  - A record of source files, changes and check results
  - Missing facts and any checks that could not run
how_to_use:
  - Open a chat with an AI that can read and write Excel files and run code. Paste the skill in, or add it to your AI.
  - Upload the old workbook and the revised workbook.
  - Say which column or ID identifies each row, and how big a difference matters. Add what you meant to change, if you know.
  - Read the change register. Check that a moved row is marked as a reorder and a formula turned into a number is flagged.
  - Look at the OPEN ITEMS list for checks that could not run. Check those in Excel yourself before you share the result.
  - Take the findings to the file owner. Ask them to confirm or fix each one.
output_sample:
  input:
    - Your old workbook
    - Your revised workbook
    - What you meant to change (optional)
    - Which column or ID identifies each row (optional)
    - How big a difference matters, such as a rounding limit (optional)
  prerequisites:
    - An AI that can read and write Excel files and run code
    - Both workbooks saved as .xlsx files
  output:
    - name: workbook-change-review.xlsx
      contains: A review of every changed value, formula, name and workbook feature, with the sheet and cell and before and after evidence.
    - name: change-register.md
      contains: A written list of changes, marked as a reorder, a value change, a formula edit or a formula replaced by a number.
    - name: SOURCE MAP
      contains: Which file version, sheet and cell support each finding.
    - name: CHECKS
      contains: Each check marked passed, failed or not run, with the evidence.
    - name: OPEN ITEMS
      contains: Missing facts and checks that could not run, each with a next action.
how_it_works:
  - title: Step 1
    text: 1. Keep both original files unchanged and work on copies. Note each file's name and date. List sheets, hidden sheets, tables, defined names, formulas, links, validations, charts, pivots and whether it contains macros, without running macros or refreshing connections.
  - title: Step 2
    text: 2. Match records by confirmed stable keys, not by row position alone. Align changed sheet names and separate added, removed and reordered records.
  - title: Step 3
    text: 3. Compare input values and formula text separately. Distinguish a formula edit, a formula replaced with a constant, a changed reference and a result changed by upstream inputs.
  - title: Step 4
    text: 4. Review changed names, validation ranges, hidden sheets, print settings, external links and data connections. State features the inspection tool cannot preserve or compare.
  - title: Step 5
    text: 5. Recalculate the copies in Excel (or another tool that can, such as LibreOffice) and investigate material differences using the agreed tolerance. Report file, sheet and cell or object locations with before/after evidence; make no repairs unless requested.
output_shape: |-
  FILES
  workbook-change-review.xlsx and change-register.md.

  SOURCE MAP
  <file and version> | <sheet, cell or slide> | <what it supports>

  CHECKS
  <check> | <passed, failed or not run> | <evidence>

  OPEN ITEMS
  <missing fact or unsupported check> | <next action>
tweaks:
  - what: Your source files
    how: Baseline and revised workbook, intended changes, sheet/key mapping and materiality or tolerance rules.
  - what: The result you need
    how: Say whether you want every change listed or only the ones above your rounding limit.
  - what: The app used to check it
    how: Say which Excel version you will use. Your AI must name any check it cannot run.
judge:
  - Reordering is not reported as every record changing.
  - Formulas and cached values are distinguished.
  - Uninspected native features stay explicit.
  - The result names its sources and keeps unrun checks visible.
test:
  - "Try this case: A row moved but its ID, value and relative formula meaning are unchanged. Check that it does this: Record a reorder, not a fabricated business change."
  - "Try this case: A formula cell is replaced with its current numeric result. Check that it does this: Flag a formula-to-constant change even if the displayed number is unchanged."
  - Reopen the saved result and compare it with the source. Keep any failed or unrun check in the report.
improve:
  - Add your confirmed field names, file rules and target app version to the required-input section.
  - Add a small test case with a known answer to the acceptance checks. Keep made-up records separate from real work.
  - Save the working rules with the file guide so the next run uses the same meanings and checks.
warnings:
  - Requires tools for the requested native file format. Checks requiring an unavailable native application must remain marked not run.
tests:
  - input: A row moved but its ID, value and relative formula meaning are unchanged
    expected: Record a reorder, not a fabricated business change.
  - input: A formula cell is replaced with its current numeric result
    expected: Flag a formula-to-constant change even if the displayed number is unchanged.
next: [excel-powerpoint-number-checker]
