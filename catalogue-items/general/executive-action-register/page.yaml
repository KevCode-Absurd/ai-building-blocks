new_slug: executive-action-register
name: Executive action register keeper
summary: Turn meeting notes or email threads into one action register with owners, due dates, source links and open commitments.
job: organise-work
headline: Executive action register keeper
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share meeting notes or email threads. Get one action list with owners, deadlines, source links and unresolved commitments. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share meeting notes or email threads. Get one action list with owners, deadlines, source links and unresolved commitments.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
not_for:
  - "You want to send messages or change tasks without checking them first: this only drafts changes, so approve each one yourself."
  - "You have one action and no source notes: type it straight into your task manager."
  - "You need minutes or a summary of one meeting, not a task list: use the Meeting minutes writer instead."
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - "action-register.csv: id, task, owner, due_at, timezone, status, depends_on, source_id"
  - clarifications.md
  - proposed-task-changes.md
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
output_sample:
  input:
    - Your meeting notes or email threads
    - The date window to cover
    - Your timezone
    - Your current task list (optional)
  prerequisites:
    - Notes or emails pasted in as text, or exported from your mail or meeting tool
  output:
    - name: action-register.csv
      contains: One row per action with ID, task, owner, due date, timezone, status, dependency and source.
    - name: clarifications.md
      contains: Short list of actions that still need an owner or a date.
    - name: proposed-task-changes.md
      contains: Draft create, update and complete steps for your task system, with conflicts shown first.
    - name: Closing note
      contains: Source coverage, missing facts, proposed outside actions and one next step.
how_it_works:
  - title: Read the sources
    text: Identify the current request, time window and facts you can verify.
  - title: Pull out the actions
    text: Find each commitment, decision and request. Give each a stable ID, a task, an owner, a due date and a source link.
  - title: Fix dates and remove repeats
    text: Turn dates like "by Friday" into real dates using your timezone. Merge the same action from email and notes into one row.
  - title: Flag the gaps
    text: List actions with no owner or no date. Show overdue, due soon, blocked and undated work apart.
  - title: Check and hand back
    text: Check owners, dates and sources. Separate drafts from completed external actions.
output_shape: |-
  action-register.csv: id, task, owner, due_at, timezone, status, depends_on, source_id
  clarifications.md
  proposed-task-changes.md
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
