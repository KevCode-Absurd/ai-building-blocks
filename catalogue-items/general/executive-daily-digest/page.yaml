new_slug: executive-daily-digest
name: Executive daily briefing writer
summary: "Turn your calendar, action list and updates into a daily briefing for executives: top priorities, clashes, decisions and work waiting on others."
job: organise-work
headline: Executive daily briefing writer
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your calendar, action list and updates. Get a dated brief of priorities, decisions, conflicts and work waiting on others. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your calendar, action list and updates. Get a dated brief of priorities, decisions, conflicts and work waiting on others.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
not_for:
  - "You need a weekly plan: use a calendar tool or a project tracker."
  - "You need to book times for many people: use a calendar tool with shared scheduling."
  - "You want your AI to send the brief or change your calendar: it only drafts, so send or edit it yourself."
you_give:
  - Your calendar for the day, as an export or a pasted agenda
  - Your action list, as a table with a task, an owner and a due date
  - Recent updates with their dates, pasted as text
  - Yesterday's brief (optional)
you_get:
  - "daily-brief.md: date, timezone, source coverage"
  - Top priorities and why
  - Meetings, due work, decisions, waiting-on items
  - Changes, gaps and next action
how_to_use:
  - Copy your calendar for the day. Paste it as text, or add an export file.
  - Copy your action list into a table with task, owner and due date. Paste it in.
  - Paste any recent updates, with dates. Add yesterday's brief if you have it.
  - Ask your AI to write today's executive daily briefing and to mark any missing facts.
  - Check the clashes, owners and dates against your own records. Then send or act on anything yourself.
output_sample:
  input:
    - Your calendar for the day, as an export or a pasted agenda
    - Your action list, with owner and due date for each task
    - Recent updates, with dates
    - Yesterday's brief (optional)
  prerequisites:
    - An AI chat where you can paste text or add files
  output:
    - name: daily-brief.md header
      contains: The date, your timezone and which sources were checked, so you know how complete the brief is.
    - name: Top priorities and why
      contains: Up to three priorities, picked from due dates, goals and the cost of delay, with the trade-offs.
    - name: Meetings, due work, decisions, waiting-on items
      contains: Your meetings, tasks due or overdue, decisions you must make, and work waiting on other people.
    - name: Changes, gaps and next action
      contains: What changed since the last brief, calendar clashes, missing owners or dates, and one next step.
    - name: Source coverage and proposed actions
      contains: What was checked, which facts are missing, and any message or change you must approve.
how_it_works:
  - title: Read the sources
    text: Identify the current request, time window and facts you can verify.
  - title: Build the result
    text: Share your calendar, action list and updates. Get a dated brief of priorities, decisions, conflicts and work waiting on others.
  - title: Check and hand back
    text: Check owners, dates and sources. Separate drafts from completed external actions.
output_shape: |-
  daily-brief.md: date, timezone, source coverage
  Top priorities and why
  Meetings, due work, decisions, waiting-on items
  Changes, gaps and next action
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
