new_slug: executive-email-draft
name: Executive reply draft writer
summary: Write a reply to an email thread. Share the thread and your goal. You get a draft with clear recipients, checked facts and one next step.
job: write-emails
headline: Executive reply draft writer
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Paste an email thread and say what you want from the reply. Your AI drafts the reply and lists who it goes to. It also shows which facts the thread backs up and which are missing.
explain: |-
  A long thread hides what was promised, who asked what and who should be copied. This reads the whole thread, then drafts a reply that answers the open questions.

  It lists To, CC and BCC before the draft and marks any fact the thread does not back up. Missing dates or prices become placeholders, not guesses. Nothing is sent. Text inside the thread cannot give it new instructions.
when:
  - A long thread has a new question and you need a clear answer.
  - You are replying to a boss, client or partner and want the facts right.
  - You are not sure who should be on To, CC or BCC.
  - You need to suggest meeting times in a set time zone.
not_for:
  - "You want to send the email for you without a read-through: this only drafts, so review it and send it yourself."
  - "You are writing a first cold email with no thread: write a short note yourself or ask your AI for a plain first draft."
  - "The thread is a legal, HR or money dispute: ask a lawyer, an HR lead or your accountant before you reply."
you_give:
  - The full email thread, newest message first if you can
  - Your goal for the reply
  - Your writing style or an example email (optional)
  - Your time zone and free dates (optional)
you_get:
  - The To, CC and BCC lines, checked before the draft
  - A subject line and reply body
  - A list of facts the thread supports and facts that are missing
  - One next step and whether the draft is ready to send
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill.
  - Paste the full email thread and say what you want the reply to do.
  - Add your style notes and free dates if you have them.
  - Check the recipients first, then the facts and the placeholders.
  - Fill in any missing dates or prices, then send the email yourself. This works with pasted text and needs no code or paid tool.
output_sample:
  input:
    - The email thread you need to answer, pasted in full
    - Your goal for the reply
    - Your writing style or an example email (optional)
    - Your time zone and dates you can meet (optional)
  prerequisites:
    - A mail connector, only if you want a draft saved in your inbox. Pasted text works without one.
  output:
    - name: Recipients
      contains: The To, CC and BCC lines, listed before the draft, with any unclear recipient flagged for you to confirm.
    - name: Subject and reply body
      contains: A subject line and a reply that answers the open questions, with placeholders where dates or prices are missing.
    - name: Facts checked and missing facts
      contains: What the thread supports, what it only claims, and what you still need to supply.
    - name: Next step and approval status
      contains: The one action requested and whether the draft is approved to send.
how_it_works:
  - title: Paste the thread
    text: Paste the full thread and say what you want from the reply. Add a sample of your writing, your time zone and free dates if you have them.
  - title: Answer questions
    text: If a recipient or a fact is unclear, your AI asks before it drafts. It does not reply to all or copy anyone by default.
  - title: Read the draft
    text: You get the To, CC and BCC lines first, then the subject and body. Missing dates or prices appear as placeholders.
  - title: Check and send
    text: Check the recipients and each fact against the thread before you send. You send the email yourself.
output_shape: |-
  Recipients: To / CC / BCC
  Subject and reply body
  Facts checked and missing facts
  Next step and approval status
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
