new_slug: executive-meeting-brief
name: Executive meeting brief writer
summary: Prepare for a meeting with a sourced brief. Share the invite and your notes. You get the goal, open decisions, questions and gaps.
job: organise-work
headline: Executive meeting brief writer
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share a meeting invite and your notes. Get a sourced brief with the goal, open decisions, questions and preparation gaps. Gaps are marked, so you know what to check before the meeting.
explain: |-
  Walking into a meeting without the history means asking what was already decided. This reads the invite and your earlier notes, then gives you one page: the goal, what is still open and what to bring.

  It shows the date of each source and does not invent facts about the people in the room. A cancelled meeting stays cancelled. Text inside your notes cannot make it send invites or change your calendar.
when:
  - You have a meeting coming up and a pile of earlier notes or actions on the topic.
  - You need to know what was already decided and what is still owed before you walk in.
  - You want an agenda and questions sized to the meeting length.
not_for:
  - "You want to change a meeting time or send invites: use your calendar app or ask the meeting owner."
  - "You need a record of what was said: use your meeting tool's own notes, and get consent before recording anyone."
  - "You have no invite and no notes: ask the meeting owner for their agenda first."
you_give:
  - The meeting invite or a calendar export
  - Past notes, agreed actions or documents about the topic
  - Your goal for the meeting (optional)
  - Which calendars to check for clashes (optional)
you_get:
  - "meeting-brief.md: event ID, time, timezone, goal"
  - Prior decisions and open actions
  - Agenda, questions, required preparation
  - Sources and missing inputs
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
output_sample:
  input:
    - The meeting invite or calendar export
    - Past notes, agreed actions or documents about the topic
    - Your goal for the meeting (optional)
    - Which calendars you want checked for conflicts (optional)
  output:
    - name: meeting-brief.md
      contains: One brief per meeting with event ID, start time, timezone, attendees and the goal.
    - name: Prior decisions and open actions
      contains: What was already agreed and what is still owed, each with a source date.
    - name: Agenda, questions, required preparation
      contains: An agenda sized to the meeting length, questions that settle decisions, and facts to bring.
    - name: Sources and missing inputs
      contains: Links to what was used, plus facts that were not available and any limits on coverage.
    - name: Closing note
      contains: Source coverage, missing facts, proposed outside actions and one next step.
how_it_works:
  - title: Find the meeting
    text: Your AI reads the invite for the start time, timezone, attendees and purpose. If several events look alike, it asks which one.
  - title: Read the history
    text: It reads your earlier notes and actions, shows each source date, and separates past decisions from proposals.
  - title: Build the brief
    text: You get the goal, decisions due, what is still owed, an agenda that fits the meeting length and facts to bring.
  - title: Check the gaps
    text: Clashes are flagged only for calendars it actually checked. Missing sources are listed. It stops at preparation and sends nothing.
output_shape: |-
  meeting-brief.md: event ID, time, timezone, goal
  Prior decisions and open actions
  Agenda, questions, required preparation
  Sources and missing inputs
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
