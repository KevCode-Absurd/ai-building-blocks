new_slug: fact-based-ad-copy-writer
name: "Fact-based ad copy writer"
summary: "Write ad copy from your real product facts. Give it the buyer and the facts. You get an ad built on one fact, with the source of each line."
job: write-ad-copy
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Fact-based ad copy writer"
subhead: Give it your product facts and the buyer you want. It finds the one fact that answers that buyer's biggest doubt and builds the ad on it. You get the ad, an image note and the fact behind each line.

explain: |
  Most ads fail for one of two reasons. They praise the product in words anyone could use ("premium", "high quality"), or they promise more than the product can back up. Readers have learned to discount both. What they believe is a specific fact, because it sounds like something the seller has checked.

  This skill works from your buyer's point of view. First it asks what this buyer wants and what makes them hesitate. Then it searches your product facts for the single detail that answers that, such as a dose, a material or a step in how it's made, and builds the whole ad on it: the first line, the headline, the picture and the next step. Every claim is checked against your facts, numbers keep their exact wording and conditions, and anything you can't prove is flagged instead of written.

when:
  - You have a product with real details, but your ads sound like everyone else's.
  - You're worried an ad overclaims, and want each line backed by something you can show.
  - You're writing for one specific buyer, for example people who tried a competitor and gave up on it.
not_for:
  - You have no product facts to share. Gather your spec sheet or product page first, or the ad will be full of gaps marked MISSING.
  - You want a long sales page. Use a landing page writer, or write the page copy by hand, because this makes one ad.
  - You want bold claims with no proof. This tool cuts or flags claims it cannot back. Ask your legal or compliance person instead.

you_give:
  - Who the ad is for, what they want, and what makes them doubt
  - Your product facts and the claims you're allowed to make
  - The ad format and its length limits
  - Your real offer terms, if you're using one (optional)
  - A draft line, script or image to improve (attach the image; your AI can see pictures) (optional)
you_get:
  - The finished ad copy in your format
  - A note on the image so the picture says the same thing
  - A list of which fact backs each line, and what's missing
  - Any of its own checks the ad still misses, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts underneath. A facts panel, spec sheet or product page all work.
  - Say who the ad is for in one or two sentences, including what makes them hesitate.
  - Name the format and its limits, for example "Facebook image ad, main text under 125 characters, headline under 40".
  - Read the notes at the end first. If it says MISSING, decide whether to find that fact or drop the claim.
output_sample:
  input:
    - Who the ad is for, what they want and what makes them doubt
    - Your product facts and the claims you may make
    - The ad format and its length limits
    - Your real offer terms (optional)
    - A draft line, script or image to improve (optional)
  output:
    - name: Main text
      contains: The ad words, opening on the buyer's want or doubt, with a character count.
    - name: Headline
      contains: One line built on the fact it chose, with a character count.
    - name: Image
      contains: A note on what the picture shows, used the real way, with no invented results.
    - name: Notes
      contains: The reason chosen, the fact and its source, conditions kept, facts left out, and what is missing.
    - name: Checks missed
      contains: One line for each of its own checks the ad still fails, or none.

how_it_works:
  - title: Starts with the buyer
    text: Writes down the buyer's situation and what your product changes for them, before looking at the product at all.
  - title: Finds the one fact
    text: Searches your facts for the detail that answers this buyer's want or doubt. A small specific fact usually beats an impressive number.
  - title: Turns it into a benefit
    text: Says what that fact means for the buyer in plain words, and only links it to results your facts support.
  - title: Writes the ad
    text: Puts the main reason to care in the first line, replaces vague praise with the fact, and uses only your real offer terms.
  - title: Makes the picture match
    text: Describes an image that shows the product used the real way, with no invented results.
  - title: Edits for the decision
    text: Cuts every line that doesn't help an interested buyer decide, and removes claims it can't back.
  - title: Shows its working
    text: Lists the reason chosen, the fact behind it and anything missing, so you can check it in a minute.
  - title: Checks the ad
    text: Goes through its own checks, such as every line tracing to a fact, fixes what it can, and names any check still missed.

output_shape: |
  <AD COPY, in the format you asked for>
  MAIN TEXT (<character count>)
  <the ad's words, opening on the buyer's want or doubt>

  HEADLINE (<character count>)
  <one line built on the chosen fact>

  IMAGE
  <what the picture shows, used the real way, no invented results>

  NOTES
  Reason chosen:   <why this buyer would care>
  Fact behind it:  <the fact, and where it came from>
  Conditions kept: <limits on the fact you kept>
  Not used:        <strong facts left out, and why>
  MISSING:         <proof you'd need for a stronger ad>

  CHECKS MISSED    <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Product facts (from the product page and science page):
    - 1 daily pack = 60+ ingredients, 21 vitamins and minerals,
      6 g prebiotic fiber, in a small handful of gummies
    - About 100% of daily value for vitamins, about 25% for minerals
    - Vegan, pectin base. Low Sugar or Sugar-Free
    - Study: 12 weeks, 120 adults, blood vitamin C up 40.1%,
      folate up 20.5% vs placebo (absorption only)
    - Allowed: "supports digestion and gut health"
    - Not allowed: "fix", weight loss, energy or immunity results

    Buyer: people who quit greens powders because of the taste and
    the shaker. Doubt: "A gummy can't hold enough to replace my powder."

    Format: Facebook image ad. Main text under 125 characters,
    headline under 40.
  output: |
    MAIN TEXT (121 characters)
    Quit your greens powder? One Sprout pack has 21 vitamins and
    minerals and 6 g of fiber, in gummies you eat from the pack.

    HEADLINE (34 characters)
    6 g of fiber, and no chalky powder

    IMAGE
    A kitchen counter in morning light. A daily pack torn straight
    across the top, green gummy bears pouring into an open palm.
    Behind it, out of focus, a half-used powder tub and a shaker
    bottle with a green ring inside. No before-and-after, no person
    "glowing".

    NOTES
    Reason chosen:   answers "a gummy can't hold enough" for people
                     who quit powders
    Fact behind it:  "21 vitamins and minerals, 6 g prebiotic fiber"
                     per pack (product page)
    Conditions kept: minerals are about 25% of daily value, so the ad
                     never says "everything you need" or "replaces
                     your powder"
    Not used:        the absorption study. Strong, but it needs more
                     than 125 characters to explain fairly
    Not used:        the discount. This buyer's doubt is what's
                     inside, not the price
    MISSING:         a fair side-by-side with a powder's label.
                     Without it, "no chalky powder" is as far as
                     the ad can go

    CHECKS MISSED    none

tweaks:
  - what: The buyer
    how: This changes everything. For Sprout, running the same facts for busy parents instead of powder quitters picks a different fact ("6 gummies, no fight at the table") and a different ad.
  - what: The format line
    how: Give exact limits. "Under 125 characters" gets you one tight idea; "long Facebook post, up to 300 words" lets it explain the absorption study as well.
  - what: The allowed and banned claims
    how: Paste them. Without them it can only follow your facts, and it will flag more lines as MISSING. With them it stays inside what your legal check approved.
  - what: A draft to improve
    how: Paste an ad you already run and add "edit this, don't rewrite it". It swaps vague words for facts and leaves good lines alone.

judge:
  - The first line names something this buyer feels or has done, not your product's name.
  - You can point to a fact for every claim. Check two lines against your product page.
  - Nothing says "fix", "best", "clinically proven" or a result you can't back.
  - The image shows the product used the real way (here, a pack torn across the top).
  - Read it aloud. If it could be any brand in your category, the fact isn't doing its job.

test:
  - Run it on an ad you already know worked. If it picks a different fact than your winner used, read its notes; it may have found a better one, or your facts list is missing the one that sold.
  - Run it twice on the same input. The fact it picks should be the same both times. If it changes, your buyer description is too vague; add their doubt in their own words.
  - Put its ad next to your current best and ask a colleague which one they'd believe. Don't say which is new.
  - Check the MISSING line. If it's empty on a product with thin facts, it skipped a check; run it again and ask for the notes in full.

improve:
  - Add your allowed and banned claims to the skill file under "What you need", so you never have to paste them again.
  - Add your brand's voice rules to step 4 ("Write the words"), with two lines from your best ad as the model.
  - If you always write for the same platform, replace the format line in your input with fixed limits inside the skill.
  - When an ad wins, write the winning fact and buyer into your brand file, so the next run starts from what already sold.
  - Pair it with "Brand voice editor" before anything goes live, and "Sales copy readiness checker" as the last read.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Matching one fact to one doubt works well in any strong chat AI with this skill."}
    - {name: "Meta Ads Manager", why: "Its preview shows whether the fact lands before the main text is cut at See more."}
  inputs:
    - "Your full facts panel or spec sheet, with the source of each fact, so it can find the detail rivals don't mention"
    - "Your allowed and banned claims list from your legal or compliance check"
    - "Five reviews that state the buyer's doubt in their own words, so the fact answers the real worry"
    - "A real photo of the product in use, so the image note shows how it's really used"

terms:
  - term: Allowed claims
    meaning: The exact sentences your legal or compliance check says you may use about the product.
  - term: Main text
    meaning: The words above the image in a Facebook or Instagram ad.
