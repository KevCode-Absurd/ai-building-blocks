new_slug: factoring-cashflow-timing-bridge
name: Factoring cash-flow timing bridge
headline: Factoring cash-flow timing bridge
summary: Reconcile reported operating cash with receivable-sale advances and customer receipts received by a factor.
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: An analytical look-through cash-timing bridge alongside reported CFO. Share reported CFO, factored cash advances included in CFO, actual customer collections retained by the factor and fee/perimeter records.
explain: |-
  An analytical look-through cash-timing bridge alongside reported CFO.

  Issuer revenue and cash-flow reconciliation. Illustrative figures.80 factor advances replace50 matched customer receipts, accelerating30 cash;100 reported CFO minus30 gives70 analytical CFO. Receipts70 reduce acceleration to10 and give90 analytical CFO. Real financing fees remain costs.
when:
  - You need an analytical look-through cash-timing bridge alongside reported CFO.
  - You work on issuer revenue and cash-flow reconciliation and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Reported CFO, factored cash advances included in CFO, actual customer collections retained by the factor and fee/perimeter records.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - An analytical look-through cash-timing bridge alongside reported CFO.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: 1. Read the receivables-transfer terms and reported derecognition/cash-flow policies; distinguish a receivable sale from secured financing
    text: Read the receivables-transfer terms and reported derecognition/cash-flow policies; distinguish a receivable sale from secured financing.
  - title: 2. Identify actual factor proceeds already included in CFO and actual customer receipts paid to the factor that replaced company collections, matching period and pool
    text: Identify actual factor proceeds already included in CFO and actual customer receipts paid to the factor that replaced company collections, matching period and pool.
  - title: 3. Replace factor advance proceeds with those customer receipts for the analytical timing view; retain real fees and reconcile reserves, settlements, recourse and noncash differences
    text: Replace factor advance proceeds with those customer receipts for the analytical timing view; retain real fees and reconcile reserves, settlements, recourse and noncash differences.
output_shape: |-
  An analytical look-through cash-timing bridge alongside reported CFO.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Receipts or remittances already inside CFO are not added again.
judge:
  - Receipts or remittances already inside CFO are not added again.
  - The analytical view is labeled separately and does not rewrite the reported accounting classification.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
