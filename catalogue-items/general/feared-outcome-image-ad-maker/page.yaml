thinking: medium
thinking_why: "It writes or plans with a handful of checks."
new_slug: feared-outcome-image-ad-maker
name: "Feared outcome image ad maker"
summary: "Paste your story ad and buyers' fear. Get a quiet photo prompt and the step to offer."
job: make-image-ads

headline: "Feared outcome image ad maker"
subhead: Give it your story ad, the fear your buyers name themselves and the step your story offers. It checks all three hold and shows the fear as one quiet piece of paperwork lying where post lands. You get the photo prompt, the line under the image and the step your copy must offer.

explain: |
  Many buyers act only when they picture where a problem is heading. Research on fear in messages has found the same thing for decades: fear moves people when they can also see a step they can take. Show the fear with no way out and they look away. So this skill shows the threat quietly in the picture, and leaves the step to the story underneath.

  It starts with a gate. The fear must be one your buyers state themselves, the story must offer a step the reader can take with a fact behind it, and the fear can't be about illness or the body. Then it turns the fear into its paperwork: the one ordinary object that would arrive if it came true, such as a card statement, a repair quote or a renewal letter. It places that object where post lands, among real clutter, and keeps the scene calm.

when:
  - Your buyers name a feared next step in their own words (the price jump after the first order, the repair quote, the lost deposit).
  - A picture of today's problem isn't moving people, and the worry about later is what makes them act.
  - Your story already offers a clear step the reader can take.

you_give:
  - Your approved story ad and the worry in it
  - What your buyers fear happens next, in their words, with where it came from
  - The step your story offers, and the fact that backs it
  - Outcomes your brand may never suggest (optional)
you_get:
  - A pass or stop on the three-part gate
  - The one object, what it stands for and where it lands
  - A short line to run under the image, and the step the copy must carry
  - A 60 to 120 word image prompt, ready to paste
  - Any of the skill's six checks still missed, or the gate part that failed when it stops

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad underneath.
  - Add the feared next step exactly as your buyers say it, with its source.
  - Say what step the story offers and the fact behind it, if the story doesn't make it obvious.
  - Read the "step for the copy" line and check your story's first lines deliver it.

how_it_works:
  - title: Sets the house rules
    text: Square, looks taken on a phone, no logo, price, button, brand colour or product, and no warning signs or red text.
  - title: Runs the gate
    text: The fear is your buyers', the story offers a doable step with a fact behind it, and the fear isn't about health or the body.
  - title: Finds the paperwork
    text: The one ordinary object that arrives if the fear comes true, such as a statement, a quote or a renewal letter.
  - title: Puts it where it lands
    text: On the doormat, by the post, on the passenger seat, among real clutter, with at most a hand at the edge.
  - title: Keeps it quiet
    text: Room light, a slight tilt, soft unreadable print. The moment before anything happens.
  - title: Hands the step to the copy
    text: One line on what the story's first lines must offer. The picture never shows the fix.

output_shape: |
  GATE                Their fear: <words, source>
                      Doable step: <step, fact>
                      Safe to show: <yes | no>     -> <pass | stop>
  SCENE               <what someone scrolling would say they saw>
  THE OBJECT          <what it is, the fear it stands for>
  WHERE IT LANDS      <place, clutter, light, a hand or none>
  WORDS ON THE IMAGE  <none beyond the object's own soft print>
  LINE UNDER IMAGE    <words> (<caption line>, <characters>)
  STEP FOR THE COPY   <what the first lines must offer>
  FLAGS               <what the copy must not promise, anything inferred>
  IMAGE PROMPT        <60 to 120 words, ready to paste>
  CHECKS MISSED       <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on review 17):
    I hate subscriptions. I feel like they are a trap.
    Every "first order" deal I'd signed up for, I waited for the full
    price to land on my card.
    So before I tried Sprout, I read the line under the button:
    "Renews at $49.99 each 4 weeks. Cancel anytime." The $29.99 first
    box needs the text sign-up discount. I knew both numbers before I
    paid. 30-day money-back guarantee on the first order.

    Buyer: the price doubter.
    Feared next step, from the brand file: "Will the price jump after
    the first order?"
  output: |
    GATE                Their fear: "Will the price jump after the
                        first order?" (brand file) and "they are a
                        trap" (review 17).
                        Doable step: read the renewal line before
                        paying. Fact: the site states "Renews at $49.99
                        each 4 weeks" under the button.
                        Safe to show: yes, it's about money. -> pass
    SCENE               A printed card statement lying open on a
                        kitchen table, a little apart from the post.
    THE OBJECT          A folded-open card statement, the kind that
                        shows a renewal charge. It stands for the full
                        price landing after a first-order deal.
    WHERE IT LANDS      A wooden kitchen table, early evening, overhead
                        light. Two unopened envelopes, keys, a mug with
                        a coffee ring, a phone face down. An adult's
                        hand rests at the right edge, not touching it.
    WORDS ON THE IMAGE  None beyond the statement's own print, soft and
                        unreadable. No bank name, no amount.
    LINE UNDER IMAGE    After the first-order deal. (plain caption, 27)
    STEP FOR THE COPY   The first lines must say what the narrator did:
                        read the renewal price before paying, with both
                        numbers stated.
    FLAGS               The copy must give the real renewal ($49.99
                        every 4 weeks) and say $29.99 needs the text
                        sign-up. Nothing may suggest the price never
                        changes. Cancelling is the loudest complaint on
                        public review sites, so promise no easier
                        cancel than the site's own words. The guarantee
                        covers the first order only.
    IMAGE PROMPT        Square 1:1 quiet phone photo of a wooden kitchen
                        table in the early evening under an overhead
                        light, slightly tilted. A folded-open printed
                        card statement lies a little apart from two
                        unopened envelopes, a set of keys, a mug with a
                        coffee ring under it and a phone face down. A
                        few crumbs on the table. An adult's hand rests
                        at the right edge near the statement, not
                        touching it. The statement's print is soft and
                        unreadable. Ordinary room light, a little
                        grain, unstyled, calm. Plain unbranded paper
                        only.
    CHECKS MISSED       none

tweaks:
  - what: The object
    how: Ask for a different piece of paperwork for the same fear, such as a renewal email on a phone face up instead of a paper statement. Pick the one your buyer would see first.
  - what: Where it lands
    how: Move it to where the dread happens for your buyer ("on the doormat", "on the passenger seat"). The place does half the work.
  - what: The hand
    how: Ask for "no hand" for a colder, emptier picture, or keep the hand at the edge to show someone is about to deal with it.
  - what: How much print shows
    how: Keep it soft. If you need one word readable, keep it to a single plain word and check it isn't a claim or a real organisation's name.

judge:
  - The fear is one your buyers state themselves, with a source you can point to.
  - The story offers a step the reader can take, backed by a fact.
  - The picture is calm. No accident, emergency, hospital or damaged body.
  - No real bank, company, clinic or person is named or shown.
  - Nothing in the picture or the line says your product prevents the outcome.

test:
  - Run it on a fear you've heard from customers many times. The object should be the one they'd name first. If it isn't, add their exact words to the input.
  - Give it a story with a fear and no step. It should ask once for the step, carry on with it marked MISSING, and say the picture can't run until the story offers one.
  - Give it a fear about health. It should stop and hand you to the empty-room picture.
  - Test it against a snapshot of today's problem with the same story. Some buyers respond to now, some to later.

improve:
  - Add your buyers' feared next steps, in their words and with sources, to "What you need". This picture is only as honest as that list.
  - Add your brand's outcome limits (what you may never suggest) to the checks in the skill file.
  - Add the places post lands in your buyers' homes, so the object sits somewhere they'd know.
  - Pair it with the story ad skill, so the doable step sits in the first lines under the picture.

works_best_with:
  tools:
    - {name: "GPT Image", why: "Follows detailed placement of small objects on a table, and keeps print soft when you ask."}
    - {name: "Nano Banana", why: "Follows named light such as 'overhead kitchen light, early evening' for a calm, ordinary scene."}
    - {name: "Any good chat AI", why: "The gate and the brief work the same in any strong chat AI."}
  inputs:
    - "Support emails or reviews where buyers describe what they're afraid of, so the fear is theirs and sourced"
    - "The exact wording of your renewal, refund or guarantee terms, so the step in the copy is checkable"
    - "Your outcome limits, so the copy never hints the product stops the fear coming true"

terms:
  - term: Feared next step
    meaning: Where the buyer worries the problem is heading, in their own words.
  - term: Doable step
    meaning: Something the reader can do about the fear, which the story offers and a fact backs up.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
