name: Fictional setting plausibility check
headline: Fictional setting plausibility check
summary: Check your fictional setting plausibility before you draft. Find weak links between land, food, trade and daily life, with fixes for each.
subhead: Share your setting and its rules. Find weak links between land, resources, trade and daily life. Copy the complete prompt, add your setting and rules, then review the questions.
job: write-and-tell-stories
thinking: high
thinking_why: The task compares evidence and alternatives. Its output still needs the stated checks.
explain: >-
  Find weak geography, economy and period assumptions in a fictional setting before drafting scenes.


  This is one pass over the setting sheet you paste in. It looks at your world through three lenses: land and resources, daily life and institutions, and technology and history. One prompt does all three, so you do not need three separate tools.


  This task uses selected methods from Anthropologist, Geographer, Historian. It is a focused adaptation. The original agents remain available: [Anthropologist agent](https://useaiblocks.com/agents/agency-academic-anthropologist), [Geographer agent](https://useaiblocks.com/agents/agency-academic-geographer), [Historian agent](https://useaiblocks.com/agents/agency-academic-historian). Those roles come from Agency Agents under the MIT licence, which this item's LICENSE file carries.
when:
  - You have a map, a setting sheet or world notes and want to catch weak links before you write scenes.
  - A reader or editor said something in your world does not add up, such as where the food or trade comes from.
  - You want questions and small fixes, with your own words quoted, not a grade.
not_for:
  - "You want to check new scenes against an older canon document: use the world-detail consistency checker."
  - "You want real history or culture fact-checked: ask a historian or read your own sources, since this check needs supplied references."
  - "You want a score or a yes or no on realism: this gives questions and small fixes, not a grade."
you_give:
  - A fictional setting sheet or map description, genre and intentional fantasy/science rules.
  - Specific historical/cultural references only when the setting borrows from them.
you_get:
  - A short, prioritized list of plausibility questions with quoted setting details.
  - Small revision options and their downstream effects.
  - Explicit fantasy liberties and unresolved factual claims.
how_to_use:
  - Copy the prompt into a new chat.
  - Replace the input lines with your setting, rules and supplied references.
  - Review the quoted evidence and suggested changes.
  - Apply the fixes you accept to your setting sheet, then run the check again on the revised sheet. To check new scenes against an older canon document, use the World detail consistency checker.
output_sample:
  input:
    - Your setting sheet or map description
    - Your genre and the rules that may differ from reality
    - References and a specific time or place (optional)
  output:
    - name: Priority issues
      contains: Up to five weak links, each with a quoted detail, the missing link, a small fix and what it changes.
    - name: Intentional liberties
      contains: The fantasy or science rules you chose, kept as they are and not marked as errors.
    - name: Unresolved questions
      contains: Real-world claims left unverified and open questions for you to answer.
how_it_works:
  - title: Paste your setting
    text: Add your setting sheet or map notes, your genre, the rules you chose to break and any real time or place you borrow from. Add your own references if you want real history checked.
  - title: Follow three chains
    text: It follows land and resources to settlement, daily life to institutions, and technology to history. It quotes the exact line of yours that each concern rests on.
  - title: Keep your rules
    text: Magic and other rules you chose are kept as they are. They are listed as liberties, not errors.
  - title: Get up to five issues
    text: Each issue has the quote, the missing link, a small fix and what the fix changes. Real-world claims it cannot check are marked unverified.
judge:
  - Issues quote actual supplied setting details.
  - Intentional fantasy rules are preserved rather than labelled impossible.
  - Material/cultural links are conditional, with uncertainty and alternatives.
  - No invented source, authenticity score or absent canon fact appears.
test:
  - Try a small supplied case whose facts and result you can check.
  - Omit one required fact and check that the affected work stays unresolved.
tweaks:
  - what: Task scope
    how: State the intended result, available evidence and actual tools before starting.
improve:
  - Keep useful corrections with the task evidence for the next run.
terms: []
