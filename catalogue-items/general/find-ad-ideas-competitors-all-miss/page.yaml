new_slug: find-ad-ideas-competitors-all-miss
name: "Find the ad ideas your competitors all miss"
summary: "Give it competitor ads from Meta's Ad Library. You get where they all crowd, what nobody says, and briefs for your gaps."
job: study-competitors

headline: "Find the ad ideas your competitors all miss"
subhead: Give it competitor ads you collected by hand from Meta's public Ad Library, plus your own facts and reviews. It maps which kinds of ad the category crowds into, checks that against what buyers say, and briefs the gaps your proof can fill.

explain: |
  Scrolling competitor ads gives you a feeling, not a plan. You notice the loud ones, miss the quiet ones that have run for months, and end up copying an ad's surface without knowing why it was built that way.

  This skill reads a fair sample instead: 3 to 6 competitors, and for each one their 5 longest-running and 5 newest ads. Every ad goes on the same map of nine ad types the other skills here use. Then it counts. A type half the competitors use is crowded, so your ad there would look like theirs. A type nobody uses is open. It also lists what buyers say most in reviews and marks which ads speak to it. A gap needs both: room on the map, or a buyer nobody talks to, and proof you hold to fill it. The Ad Library shows no spend or sales for ordinary ads, so run time is treated as a hint, never as proof.

when:
  - You're planning a new batch of ads and want to know what your category already runs before you brief anyone.
  - Every competitor ad seems to say the same thing and you want to know what that thing is, word for word.
  - You suspect there's a gap in your market, such as a doubt nobody answers, and want evidence for it.

you_give:
  - What the work is for, such as your whole business, one product or a sale, plus who it targets and the country
  - Competitor ads collected by hand from Meta's Ad Library, with library ID, start date, text and a screenshot
  - Your business facts, voice, the claims you may make, your reviews, and your own ads with how they did
  - Your competitor list, 3 to 6 names (recommended)
you_get:
  - A short summary and the top three gaps
  - A map of the category by ad type, crowded, thin or open
  - A card for every ad studied, and the claims everyone repeats
  - Briefs for each gap, with the proof each rests on and what to avoid

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Say what the work is for in one line, for example "new customers for our main product, US".
  - In facebook.com/ads/library, search each competitor by name. Take their 5 longest-running and 5 newest active ads, with the library ID, start date and a screenshot of each.
  - Paste them in with your own facts, claims list, reviews and current ads.
  - Read the gaps and briefs first, then the map and cards behind them.

how_it_works:
  - title: Confirms the competitors
    text: Checks the list with you, because a wrong list spoils everything after it.
  - title: Takes a fair sample
    text: Up to 10 ads per competitor, half long-running and half new, so one big spender can't set the pattern.
  - title: Tags run time
    text: New under 30 days, kept to 89, long-runner from 90. A hint about what they keep paying for, never a result.
  - title: Writes a card per ad
    text: Reads the image itself. Records the type, the main claim word for word, the proof and offer shown, and whether the brand shows with the logo covered.
  - title: Maps the category
    text: Counts which types half the competitors crowd into, which only one uses, and which nobody does.
  - title: Checks the buyers
    text: Lists what three or more reviewers say and marks which competitor ads speak to it.
  - title: Briefs the gaps
    text: Turns each gap your proof can fill into an ad card with a headline of 7 words or fewer, inside your own claims rules.

output_shape: |
  SUMMARY
  <3 sentences>
  Top 3 gaps: <gap>, <gap>, <gap>

  SAMPLE
  <competitor> | <ads kept> | <tiers> | <skips, and why>

  CATEGORY MAP
  <type> | <advertisers using it> | <crowded | thin | open> | <main dress>

  AD CARD  (one per ad)
  <advertiser, library ID, started, tier, live or ended>
  Code <type · dress>   Answers <question>
  Claim "<word for word>"   Proof <...>   Offer <...>
  Logo covered: <could you tell whose it is?>

  CLICHES   "<claim, word for word>" (<advertisers>)
  BUYERS    <want or doubt> (<n> reviewers) | <ads that speak to it>
  GAPS AND BRIEFS
  <n> <gap> <why: map or buyers> <proof on file>
      Code / Picture / Headline / Proof / Read it by / Avoid
  LIMITS    <what wasn't seen>

example:
  business: sprout
  input: |
    [the skill]

    Today's job: plan our first ads for new customers, US, image ads.
    About 3 ideas.

    My business: a smaller greens gummy brand. Our facts and claims list
    aren't written yet, and we have no reviews of our own yet.

    Competitors: start with the category leader, Sprout.

    Ads: 15 live Sprout headlines plus 2 main texts from the public Meta Ad
    Library, with copies live and the mix of the
    40 newest ads (sprout/ads.md). No screenshots, no library IDs, no
    start dates.
    Reviews: Sprout's 20 public reviews (sprout/reviews.md), as the
    nearest view of what buyers in this category say.
  output: |
    SUMMARY
    The leader's ads crowd into "Why now?" and "Is it for me?", led by
    one discount, "61% off". "Can I believe it?" is nearly empty, and
    the powder-quitter story buyers tell most is missing from its ads.
    One advertiser and text only, so this shows one brand's habits,
    not the category's.
    Top 3 gaps: quitting powder (Old way, new way), taste, a believe-it
    ad of any kind. Each needs your own proof first.

    SAMPLE
    Sprout | 15 headlines, 2 main texts | tiers unknown (no start
    dates) | no creative seen
    MISSING: 2 to 5 more competitors. Fewer than 3 shows one brand only.

    CATEGORY MAP (pencilled from headlines, 1 advertiser)
    The offer        | 1 | crowded (5 headlines, 6 with #4; #1 has
                             15+ copies)
    The moment       | 1 | crowded (6 headlines)
    Look inside      | 1 | thin (#15)
    In use           | 1 | thin (#12)
    Checked fact     | 1 | thin (#4, maybe)
    Product alone    | 0 | open, unless #8 lands there
    Old way new way  | 0 | open
    Their words      | 0 | open
    The occasion     | 1 | Kids flavour launches only
    Dress: not seen for any ad.

    AD CARDS (text only: first frame, look and logo check not seen)
    #1   Code The offer · ?   Answers why now?
         Claim "'Sprout is too expensive': here's 61% off to prove
         otherwise"   Proof none   Offer 61% off   15+ copies live
    #6   Code The moment · ?   Answers is it for me?
         Claim "Fix the Hot Girl Tummy"   Proof none. "Fix" goes past
         the brand's own "supports" rule.
    Main text 1  Claims "gut-supporting probiotics". The product page
         lists prebiotic fiber and no probiotics. A real error.
    #12  Code In use · ?   Claim "One Step I Never Skip"   1 copy live
    (cut for length: cards for the other 12 headlines)

    CLICHES
    "61% off" in 4 headlines. Only one advertiser, so not yet a
    category cliché. Check it against the others you add.
    Heading: the 40 newest ads are 19 offer-led, against about 80% in
    a 50-ad sample four days earlier, so the leader is widening.

    BUYERS (3 or more reviewers)
    Quit greens powders, gritty or a chore (3, 4, 6)   | no ad
    Regular, less bloated (7, 8, 9, 10)                | #6, #7
    Tastes good (6, 12, 14)                            | no adult ad
    Finally stuck with it (1, 2): only 2, a hunch      | #12

    GAPS AND BRIEFS (structure only until you add your facts)
    1 Quitting powder. Open type, 3 reviewers, no ad.
      Code     Old way, new way · Camera · New
      Picture  split: a shaker and powder tub, then your product in a
               hand, same light both sides, the tub unbranded
      Headline MISSING: needs your own product's facts
      Proof    MISSING: your format facts (no water, no mixing, if true)
      Read it  click rate, after 100 link clicks
      Avoid    the leader's pouch colours, any named powder
    2 Taste. 3 reviewers, no adult ad speaks to it.
      Needs    your own reviews about taste, word for word
    3 A "can I believe it?" ad. The type is nearly empty.
      Needs    a real customer quote, or a checked number with source.
               Not the leader's study: it tested the leader's product.
    MISSING: your claims list, voice and reviews. Every brief above
    needs them before it becomes an ad.

    LIMITS
    No creative seen, no start dates, one advertiser only.

tweaks:
  - what: What the work is for
    how: Saying "one product" narrows the sample to competitors selling that kind of product. Saying "a sale" takes more "Why now?" ads and records each offer's shape.
  - what: Who the ads target
    how: Say "new customers" and the gaps lean to "what is it?" and "is it for me?". Say "people who know us" and they lean to "can I believe it?".
  - what: How many competitors
    how: Give 3 to 6. Fewer and it tells you the map shows those brands' habits only.
  - what: The creative itself
    how: Attach screenshots. With text only, every card is labelled text only and the look and logo checks are skipped.

judge:
  - Every card has a library ID, an advertiser and a start date, or "not shown".
  - Claims are quoted word for word, from the ad itself, not the caption.
  - The words "winner" and "profitable" never describe a competitor's ad.
  - Each gap names both its reason (the map or the buyers) and the proof that fills it.
  - The briefs use your facts and claims only, with none of their words, people or footage.

test:
  - Include one competitor ad you know well. Check its type, claim and proof on the card against what you know.
  - Look up three library IDs in the Ad Library yourself. The advertiser and start date should match.
  - Read every gap. Each should name a buyer count or a map count. A gap with neither is a guess, so drop it.
  - Search the briefs for any competitor's words, people or logos. There should be none.
  - Run it again a month later with fresh ads. Gaps that show up both times are the ones to test first.

improve:
  - Mark the types your market never uses, so they're never counted as open.
  - Change the sample in "Sampling and run time" if your market has many small advertisers, and keep the cap per competitor.
  - Keep your claims rules and reviews in your brand file, and log each ad's result in the "Results" section of log.md, so it never suggests a repeat or a claim you can't make.
  - Save the category map and the top three gaps to your brand file with the date, so the next run shows what moved.
  - Pair it with a skill that sorts competitor ads into a study board first, and one that briefs image ads for the gaps.

works_best_with:
  tools:
    - {name: "Meta Ad Library", why: "The public source for competitor ads, with library IDs and start dates, browsed by hand."}
    - {name: "Claude", why: "Holds dozens of ad cards and your claims rules in one long chat."}
    - {name: "Google Sheets", why: "Counts types per advertiser, so crowded and open cells are easy to check."}
  inputs:
    - "Twenty or more of your own reviews, so the buyer check uses your buyers"
    - "The study board from the competitor board skill, so cards start from ads already filed"
    - "Your claims list with what's allowed and what isn't, so every brief stays inside it"
    - "A screenshot of every ad, so cards are read from the creative and not the text"

terms:
  - term: Crowded
    meaning: An ad type that half or more of your competitors use. An ad of yours there looks like theirs in the feed.
  - term: Gap
    meaning: Room on the map or a buyer nobody talks to, that you hold the proof to fill.
  - term: Cliché
    meaning: A claim two or more competitors make in nearly the same words.
  - term: Run time
    meaning: How long an ad has been live. A hint about what an advertiser keeps, not proof of results.
