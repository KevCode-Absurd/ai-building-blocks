new_slug: find-out-why-your-ads-stopped-selling
name: "Find out why your ads stopped selling"
summary: "Paste your ad numbers. You get the likely reasons ranked, the evidence for each, and what to fix first."
job: read-ad-results

headline: "Find out why your ads stopped selling"
subhead: Paste the numbers you exported from your ad account. It redoes every sum, checks sales are being counted, shows which link broke (cost to be seen, clicks, buyers or order size) and by how much, then ranks the likely reasons with what to check next.

explain: |
  When ad results slip, the usual reaction is to blame the ad and make a new one. Often the real cause sits somewhere else: sales not being recorded, an offer that doesn't show on the page, a product out of stock, or a budget cap. Changing the ad then fixes nothing and throws away an ad that was working.

  This skill reads your export like a careful analyst. It recalculates every rate from the raw totals (never averaging percentages) and checks the tracking first. Then it splits the rise in cost per sale into its links: what it costs to be seen, how many viewers click, how many clickers buy, and how much they spend. You see, in numbers, which link did most of the damage. Each finding comes with the reasons for and against, the next thing to check, and a proposed action. It never changes a budget or pauses an ad, even if a tool is connected to your account. You approve and make every change.

when:
  - Your cost per sale went up and you want to know why before you touch anything.
  - A few ads cost far more per sale than the rest and you're not sure what's different.
  - Someone on the team says "the algorithm changed" and you want to see if the numbers back that up.

you_give:
  - Your exported ad numbers by ad or campaign, with spend, impressions, clicks, purchases and revenue
  - The same numbers for an earlier period to compare with (optional, but needed to spot a real drop)
  - Your target cost per sale or return, and your margin (optional, needed to call anything good or bad)
  - A list of what you changed and when, such as new ads, prices or pages (optional)
you_get:
  - A table of every ad with its rates recalculated from the totals
  - The chain split, showing each link's share of the change in cost per sale
  - A ranked list of findings, tracking problems first, each with possible reasons, what to check and a proposed action
  - A list of the data that was missing and what it would have told you

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Export your ad results as a spreadsheet or CSV and paste it underneath. Leave out customer names, emails and IDs.
  - Add the earlier period if you have it, and say what changed between the two (a new offer, a page change, a bigger budget).
  - Add your target cost per sale and your margin if you know them. Without them it will describe, not judge.
  - Read Finding 1 first. If it's a tracking problem, fix that before acting on anything else.

how_it_works:
  - title: Redoes the sums
    text: Recalculates every rate from matching totals, marks what's missing, and treats a blank as unknown rather than zero.
  - title: Checks tracking first
    text: Looks at whether purchases and their values are being recorded properly. A drop in sales with steady clicks gets investigated as a counting or after-click problem first.
  - title: Splits the chain
    text: Cost per sale is cost per 1,000 views divided by clicks per view and buyers per click. It shows how much of the change each link caused.
  - title: Weighs the reasons per link
    text: For each link that moved, tests the likely causes, such as the same people seeing the ad too often, a page that no longer matches, or an ad set sent back to learning by a big edit.
  - title: Uses your targets, not rules of thumb
    text: Judges against your own targets and your own past results. A return above 1 is not called profit without your costs.
  - title: Ranks the findings
    text: Puts tracking problems first, then the problems with the most money behind them, and drops anything that wouldn't change a decision.
  - title: Proposes, never changes
    text: Gives a proposed action and when to revisit it, one change at a time. It never changes a budget or pauses an ad; you approve each change.

output_shape: |
  BASIS
  <what the data covers: ads, dates, currency>
  MISSING: <anything not given, and what that stops it judging>

  RECALCULATED FROM TOTALS
  <table: ad | spend | clicks | click rate | buy rate | cost per sale | return>

  CHAIN SPLIT
  Cost per 1,000 views <change>, click rate <change>, buy rate <change>,
  revenue per sale <change>. Share of the change in cost per sale: <...>

  FINDING 1. <a tracking problem, or "tracking checked" and why it's fine>
  Seen:      <what the numbers show>
  Reasons:   (a) <possible reason>  (b) <another possible reason>
  Check:     <the next thing to look at>
  Proposal:  <what to do once you know>
  Revisit:   <when to look again>

  FINDING 2, 3 ... <same layout, ranked by the money at stake>

  NOT CONCLUDED
  - <what the data can't support yet>

  Proposals only. Nothing has been changed.

example:
  business: sprout
  input: |
    [the skill]

    Export (sprout/ad-results.csv, practice numbers), USD.
    ad_name,days,spend,impressions,link_clicks,purchases,revenue
    P1 Too expensive days 1-21,21,3000,250000,3750,112,3830
    P1 Too expensive days 22-42,21,3000,193500,1780,39,1334
    Same image ad in both windows. Opening line: "'Sprout is too
    expensive': here's 61% off to prove otherwise".

    What we know: this headline has 15+ copies live, the most in the
    account. The ad says 61% off; the product page shows 52% and 55%.
    The $29.99 first order needs the text sign-up discount and renews
    at $49.99 every 4 weeks.

    Question: P1 cost $26.79 a sale in its first 21 days. Why did it
    get so much worse, and should we pause it?
  output: |
    BASIS
    One ad, two 21-day windows, USD, practice numbers. MISSING: exact
    dates, attribution window, targets, margin, how many first orders
    renew. So nothing here is called profitable or not.

    RECALCULATED FROM TOTALS
                        Days 1-21   Days 22-42   Change
    Spend               $3,000      $3,000       same
    Impressions         250,000     193,500      -22.6%
    Cost per 1,000      $12.00      $15.50       +29.2%
    Click rate          1.50%       0.92%        -38.7%
    Buy rate            2.99%       2.19%        -26.6%
    Purchases           112         39           -65.2%
    Cost per sale       $26.79      $76.92       +187%
    Return              1.28        0.44
    Revenue per sale    $34.20      $34.21       same
    Buy rate = purchases / clicks. Return = revenue / spend.

    CHAIN SPLIT
    Cost per sale rose 2.87 times. Of that rise, about 46% came from
    fewer clicks per view, 29% from fewer buyers per click, and 24%
    from dearer views. Revenue per sale didn't move. The weakest link
    is clicks per view.

    FINDING 1. Tracking: no fault visible, not yet confirmed
    Seen:      revenue per sale is the same in both windows, so the
               way sale values are recorded didn't change. Sales fell
               faster than clicks (-65% against -53%).
    Reasons:   (a) fewer sales are being recorded; (b) a real drop
               after the click (Finding 4).
    Check:     store orders from this ad's link in each window, and
               the event counts. MISSING: both.

    FINDING 2. Fewer clicks per view (the biggest share)
    Seen:      same ad, same spend, click rate down 38.7%.
    For:       the usual pattern when the same people see one ad
               over and over.
    Against:   can't be confirmed without reach and frequency.
    Check:     frequency (views per person) in each window.

    FINDING 3. Dearer to be seen
    Seen:      the same $3,000 bought 22.6% fewer impressions.
    Reasons:   (a) the same buyers are being reached again; (b) the
               15+ copies of this headline may be bidding for the
               same people (a guess to check); (c) wider auction
               changes. Not an "algorithm change" on this alone.
    Check:     reach per window, and when the other copies launched.
               MISSING: change log.

    FINDING 4. Fewer buyers per click
    Seen:      buy rate down from 2.99% to 2.19%.
    Reasons:   (a) the page or offer changed near day 22; (b) the
               clicks that are left are from less ready buyers. The
               61% ad against a 52% or 55% page holds in both windows,
               so it can't explain the change by itself, but it's
               worth fixing anyway.
    Check:     did the page, price or offer change around day 22?

    PROPOSAL (for you to approve; nothing changed in the account)
    Don't pause yet. Check frequency first. If it rose while clicks
    fell, add one new version of the price-doubt ad with a new first
    image, inside the same $143 a day, and change nothing else that
    week so the result is readable.
    Revisit: once frequency, reach and store orders are in.

    NOT CONCLUDED
    - Profit. First-order return leaves out $49.99 renewals.
      MISSING: renewal rate and margin.

    Proposals only. Nothing has been changed.

tweaks:
  - what: The earlier period
    how: Add the previous 30 days in the same columns and the skill switches from comparing ads with each other to finding what actually changed. That's the only way it can test whether people are tired of an ad.
  - what: Your targets and margin
    how: Add "target cost per sale $X, margin Y%" and it will call each ad above or below target. Without them it only describes.
  - what: The change log
    how: List your changes with when each happened ("price page edited, then a new offer a week later"). It will line each one up against the numbers and often finds the cause there.
  - what: Store orders
    how: Paste your store's own order count and revenue for the same dates. It will compare them with what the ad platform claims and flag gaps.

judge:
  - Pick one ad and check its cost per sale yourself (spend divided by purchases). It should match.
  - The first finding is about tracking or sale values, or it says tracking was checked and why it's fine.
  - Each finding lists at least two possible reasons, not one confident cause.
  - Nothing says "pause now", nothing is changed in the account, and no saving is promised.
  - The chain split's shares add up to the whole change in cost per sale.
  - Missing data is named, and the skill says what it would have changed.

test:
  - Run it on a past month where you already know what went wrong, such as a broken checkout or a price change. That reason should be near the top, or it should name the data it would need to find it.
  - Work out cost per sale for your two biggest ads by hand (spend divided by purchases) and compare with its table. A different number means it averaged where it should have added up.
  - Delete the purchases for one ad and run it again. That ad's rates should say "unknown", not a guessed number.
  - Run it twice on the same export. The order of the findings should stay the same. If it moves, add your targets and margin so it has a fixed line to judge by.

improve:
  - Write your targets into "What you need" in the skill file (cost per sale, margin, the return where you break even), so every run judges against them without you pasting them.
  - Export reach and frequency with every run. They're what tells "tired of the ad" apart from "running out of new people".
  - Add the exact column names your ad platform exports to step 1, so the skill reads them the same way every month.
  - If your business has a known pattern, such as a weekly email day or a slow January, add it to the list of explanations in step 3 so it gets weighed with the others.
  - After each run, write down which finding turned out to be true in log.md in your brand file, under Results. Paste those notes in next time as your change log.
  - Pair it with a skill that turns your ad numbers into a one-page report when someone else needs the short version, and with a store page check when the reasons point to what happens after the click.

works_best_with:
  tools:
    - {name: "Claude", why: "Works the sums from a pasted export step by step and shows them, so you can check each one."}
    - {name: "Google Sheets", why: "Lets you redo any number in the table yourself, from the same totals."}
    - {name: "Meta Ads Manager", why: "Export both periods with reach, frequency and the attribution setting, and make any approved change there by hand."}
  inputs:
    - "Reach and frequency for both periods, so a tired audience can be told apart from a used-up one"
    - "Your store's own orders for the same dates, so a counting fault shows up"
    - "A dated change log of ads, prices, pages and budgets, so each drop can be lined up with what changed"
    - "Your margin and renewal rate, so it can say whether an ad still makes money"

terms:
  - term: Return (ROAS)
    meaning: Revenue divided by ad spend. 1.56 means $1.56 back in sales for every $1 spent, before product and shipping costs.
  - term: Click rate
    meaning: Link clicks divided by impressions. The share of people who saw the ad and clicked.
  - term: Buy rate
    meaning: Purchases divided by link clicks. The share of people who clicked and then bought.
  - term: Tracking
    meaning: The code that tells your ad platform a sale happened and what it was worth.
  - term: Placement
    meaning: Where the ad was shown, such as the Instagram feed, Stories or a partner app.
