new_slug: finish-the-sale-your-ad-started
name: Finish the sale your ad started
summary: Full copy for one landing page that carries on from your ad, for one buyer and one offer.
job: write-landing-page

headline: A landing page that picks up where your ad left off, built only from your facts
subhead: Give it the ad, your product facts and offer, and real customer words if you have them. It writes the whole page for one buyer and one offer, starting with a phone-sized first screen that repeats the ad's promise, then answers each question in the order a buyer asks it.

explain: |
  People click an ad because of one promise. Then they land on a page that opens with the product name, lists every benefit, and buries the price. The promise they clicked for has vanished, so they leave.

  This skill writes a landing page for one buyer, one reason to buy and one offer. The headline keeps the ad's main words. The first screen, about five short lines on a phone, says what the buyer gets, why this product, why now, and why they should trust it, with the price and one button. The rest of the page answers what a buyer wants to know next: what it does for me, will it work for me, what does it cost in full, what if I don't like it. Every number and claim comes from your facts. Anything you didn't supply is left empty and listed.

when:
  - Your ad gets clicks but the page it sends people to doesn't sell.
  - You're launching a new ad for a new kind of buyer and need a page that speaks to them.
  - Your product page tries to say everything to everyone, and you want a focused version.

you_give:
  - Your facts, such as what you sell, prices and offer names, guarantee, delivery terms, the claims you may make and any rating you actually hold
  - The ad that sends people there, with its first line, buyer, offer and image (optional, but strongest)
  - Real customer quotes and the doubts that stop people buying (optional)
  - Whether it's bought again (like a refill) or bought once (like a jacket) (optional)
you_get:
  - A three-line page brief (buyer, reason to buy, offer)
  - The first screen, body sections, a comparison if useful, 5 to 8 questions and a closing block
  - A list of every field left empty because a fact was missing

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste your product facts and current offers with their exact names and prices.
  - Paste the ad word for word, and say who it's for.
  - Add a few real customer quotes, and any questions buyers ask before buying.
  - Check the "Left empty" list, then read the first screen on your phone to see it fits.

how_it_works:
  - title: Pins the page's job
    text: Writes down one buyer, one reason to buy and one offer. A different buyer or offer gets its own page.
  - title: Carries on from the ad
    text: Keeps the ad's main words in the headline and leads with the offer the ad named, under the same name.
  - title: Fills the first screen
    text: Promise, proof, price and button, answering what it is, why this one, why now and why trust it. Leaves out any reason it can't back.
  - title: Orders the rest
    text: Follows the buyer's questions, from what it does for me to what it costs to what if it doesn't work and when it arrives.
  - title: Writes the copy
    text: Leads with the outcome and uses the feature as the reason to believe. Every line has to survive "so what?".
  - title: Fits how it's bought
    text: For something bought again it covers taste, contents and subscriptions. For something bought once it covers fit, materials, returns and warranty.
  - title: Uses only real proof
    text: Quotes customers word for word and never writes a review, rating, count or badge you didn't supply.

output_shape: |
  PAGE BRIEF
  Buyer: <who>   Reason to buy: <one reason>   Offer: <name and price>
  Ad's opening line: "<...>"

  FIRST SCREEN
  Eyebrow: <product name>
  Headline: <6 to 12 words, the outcome, keeps the ad's words>
  Sub-headline: <what the ad left out>
  - <3 bullets: what this buyer must know before paying>
  Proof: <rating or quote you hold, or nothing>
  Price: <...>   Why now: <real reason, or none>
  Button: <what the buyer gets>   Under it: <risk line from your terms>

  BODY
  <Heading that says what the buyer gets>
  <1 to 3 short paragraphs from your facts, one doubt per section>

  QUESTIONS (5 to 8)
  <a reason not to buy, in the buyer's words> / <answer from your facts>

  CLOSING
  <headline> <one sentence> <button> <risk line>

  LEFT EMPTY
  MISSING: <each fact the page needed>

example:
  business: sprout
  input: |
    [the skill]

    Facts: Sprout Original (Adults) greens gummies, Low Sugar. Pouch of 28
    daily packs; tear one open, eat the handful inside. 60+ ingredients,
    21 vitamins and minerals, 6 g prebiotic fiber per pack. About 100% of
    daily value for vitamins, about 25% for minerals. Vegan, pectin base.
    Subscribe: $49.99 every 4 weeks ($1.78/day). First order $29.99 only
    with the text sign-up discount. One-time $66.65. "Pause Or Cancel Any
    Time." 30-day money-back guarantee, first order only. Ships within 24
    hours, arrives in 3-5 days on average. Third-party tested.
    Survey (say "of surveyed users"): 95% take it at least 4-6x a week.
    Ratings on file disagree (4.8, 4.75, 4.74, 4.0).
    Alternative: a big-name greens powder, about $79 a month.

    Ad: "One Step I Never Skip". No offer named. Buyer: has quit
    powders and pill stacks, wants one habit that lasts.

    Quotes: R1, R3 and R18 from sprout/reviews.md.
    Bought again (subscription).
  output: |
    PAGE BRIEF
    Buyer: quit powders and pills, wants one habit that lasts
    Reason to buy: it's the one you'll keep taking
    Offer: Subscribe & Save, Low Sugar, $29.99 first box
    Ad's opening line: "One Step I Never Skip"

    FIRST SCREEN
    Eyebrow: Sprout Original
    Headline: The one daily step you won't skip, because you want to eat it
    Sub-headline: 21 vitamins and minerals and 6 g fiber in one pack of
    greens gummies. No shaker, no pills.
    - Tear a pack, eat the handful. That's the whole step.
    - About 100% of your daily value for vitamins, about 25% for minerals
    - Third-party tested, vegan, pectin base
    Proof: "[Sprout] has been the one thing I've been able to stick to."
    Price: $29.99 first box with text sign-up, then $49.99 every 4 weeks
    Why now: none (no dated offer on file)
    Button: Start my first box
    Under it: 30-day money-back guarantee on your first order. Pause or
    cancel any time.

    BODY
    You'll actually keep doing it
    95% of surveyed users take it at least 4 to 6 times a week.
    Your powder and your pill shelf, in one pack
    60+ ingredients, 21 vitamins and minerals and 6 g prebiotic fiber.
    "I was taking [a big-name greens powder] but even with their monthly
    subscription discount it was still $94 a month and the drink was
    definitely gritty/chalky."

    COMPARISON  (only facts held for both sides)
                   Sprout                     Greens powder
    Taking it      tear, eat                  scoop, shake, wash up
    Price          $49.99 / 4 weeks           about $79 a month

    QUESTIONS
    Can a gummy hold enough? Each pack has 60+ ingredients, 21 vitamins
      and minerals and 6 g fiber. Vitamins sit near 100% of daily value,
      minerals near 25%.
    What if I don't like the taste? Some people need a few days: "after the
      third day they started tasting better". Your first order has a
      30-day money-back guarantee.
    Will the price jump? Yes, after the first box: $29.99, then $49.99
      every 4 weeks.
    Will it upset my stomach? Start with Low Sugar. Sugar-Free uses sugar
      alcohols.
    Can I cancel? Pause or cancel any time.
    When does it arrive? Ships within 24 hours, 3-5 days on average.

    CLOSING
    Make it the step you keep. One pack a day.
    Button: Start my first box. 30-day money-back guarantee, first order.

    LEFT EMPTY
    MISSING: one agreed star rating and its source, so no rating line
    MISSING: steps to cancel, beyond "pause or cancel any time"
    MISSING: a real dated reason to buy now

tweaks:
  - what: The ad
    how: Paste a different ad and you get a different page. The headline, the first offer and the questions all follow the ad's buyer and promise.
  - what: Bought again or bought once
    how: Say which, if it's not obvious. A refillable product gets taste, contents and subscription terms. A one-off gets fit, materials, returns and warranty, and never a price per day.
  - what: Customer quotes
    how: Add quotes that prove the page's main promise. Without them the proof line stays empty rather than holding a made-up review.
  - what: An existing page
    how: Paste your current page and say "revise this". It fixes in order of clarity, copy, offer, proof and friction, and keeps what already works.

judge:
  - The headline repeats the ad's main words.
  - The first screen fits on a phone with the price and one button visible.
  - Every price, number and timeframe on the page appears in your facts.
  - No rating, review count, badge or "bought today" figure appears that you didn't supply.
  - Each question is a real reason someone wouldn't buy, not "What is your shipping policy?".
  - Buttons say the same thing all the way down the page.

test:
  - Run it on an ad that already sends traffic to a page you know. The new first screen should repeat the ad's main words and show the price and one button.
  - Leave out your delivery terms. The page should promise no delivery time and list it under "Left empty".
  - Run it twice with the same ad and facts. The buyer and reason to buy in the page brief should match. If they don't, write them into your input yourself.
  - Read the questions to someone who talks to your customers. Each should be something buyers ask before they buy, not company history.

improve:
  - In step 6, delete the "bought once" or "bought again" branch that doesn't fit your product, and add your own pack sizes, pause rules or warranty terms.
  - Write your standard button text into the first-screen line of "What you hand back", so every page you make uses the same words.
  - Add your current offers, with their exact names and prices, under "Facts" in the skill, and update them when they change, so no page uses an old price.
  - Save each page brief (buyer, reason to buy, offer) in your brand file next to the ad it belongs to.
  - Pair it with a skill that matches real customer doubts to your page, for the questions section, and run a quick landing page checklist before it goes live.

terms:
  - term: Landing page
    meaning: The page someone lands on after clicking an ad or link.
  - term: First screen
    meaning: What a visitor sees on their phone before scrolling.
  - term: Risk line
    meaning: The short line under the button that removes the worry, such as your guarantee or returns terms.
  - term: Compare-at price
    meaning: A crossed-out higher price shown next to the real one. It must be a real former or separate price.
