new_slug: first-market-picker
name: "First market picker"
summary: "Find the small group of buyers you can win first. Give it your product. You get a ranked short list and the one group to own."
job: plan-strategy
thinking: low
thinking_why: "It lists groups and scores them against fixed tests, which most chat AIs do well."

headline: "Pick the small group of buyers you can win first"
subhead: "Tell it what you sell and who might use it. It scores each group on size, closeness, need, rivals and reach, cuts the broad ones, and gives you a ranked short list with the one to own first."

explain: |
  Trying to sell to everyone means reaching no one. A small group that sits together and needs your product weekly is easier to win, and winning it gives you proof for the next group.

  This skill lists the groups that could use your product and scores each on five tests. It drops groups that are too big, too scattered or already served, and ranks the rest. It then tells you what to count to be sure.

when:
  - "Your product could serve many kinds of buyers and you can't pick."
  - "Your plan says \"small businesses\" or \"everyone\"."
  - "You need a group you can reach in the next few weeks."
not_for:
  - "Your product already sells well to a proven group: use the Market boundary checker to test where that market ends."
  - "You already know your first group and want to talk to buyers: write a short request and ask five people for a call."
  - "You want the size of a whole industry: use a market report or ask a person who knows the trade."
  - "You want a broad group sliced into people you can reach this week: use the First customer group picker."

you_give:
  - "What your product does"
  - "Groups of buyers you think could use it (optional)"
  - "Places and people you can reach now (optional)"
you_get:
  - "A scored list of groups"
  - "A ranked short list with reasons"
  - "The one group to own first"
  - "What to count to confirm it"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Paste your product and any groups you already have in mind. Say where you can reach people."
  - "Count the numbers it asks for before you act on the pick. Treat the pick as a guess until you do."
  - "Take the pick to your next conversation with buyers, and name the group when you speak."
output_sample:
  input:
    - What your product does and the problem it solves
    - Groups of buyers you think could use it (optional)
    - Places, lists and people you can reach now (optional)
  output:
    - name: Ranked short list
      contains: Each group with a 0 to 2 score on small, close, need, served and reach, plus one line of reasoning.
    - name: The pick
      contains: The one group to own first, or a smaller slice of it if the top group looks too big.
    - name: Why you could own it
      contains: Two sentences on why you could be the first name this group thinks of.
    - name: What to count
      contains: The numbers to check before you act, with MISSING marked for any you don't have.
    - name: Next group along
      contains: The group that sits next to the pick and could be your next one.
    - name: Checks missed
      contains: One line for each check the result still fails, or none.

how_it_works:
  - title: "Lists the groups"
    text: "Cuts by who the buyers are, not by industry."
  - title: "Scores five tests"
    text: "Small, close, in need, lightly served and reachable."
  - title: "Cuts the wrong groups"
    text: "Drops those that are too big, too scattered or out of reach."
  - title: "Ranks the rest"
    text: "One line of reasoning per group."
  - title: "Shrinks the pick"
    text: "Offers a smaller slice if the top group is large."
  - title: "Names what to count"
    text: "Lists the numbers that would confirm the pick."

output_shape: |
  RANKED SHORT LIST
  1. <group> | Small <0-2> Close <0-2> Need <0-2> Served <0-2> Reach <0-2> | <reason>
  2. <group> | ...
  3. <group> | ...

  THE PICK
  <group or slice>

  WHY YOU COULD OWN IT
  <two sentences>

  WHAT TO COUNT
  <numbers> | MISSING: <what you don't have>

  NEXT GROUP ALONG
  <group>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "Groups you know"
    how: "List groups from real customers or leads. It scores those first."
  - what: "Where you can reach people"
    how: "Name lists, communities and events you use. Reach scores come from these."
  - what: "Size"
    how: "Tell it how many buyers you could handle in the first year. It sets the right size for the pick."

judge:
  - "Each group is described by who they are."
  - "The pick scores well on need and reach."
  - "No pick depends on a small share of a large market."
  - "The list of numbers to count is specific."

test:
  - "Run it on a product with the group \"all small businesses\". It should cut that group."
  - "Run it with a small, reachable group and a large scattered one. The small one should win."
  - "Run it twice on the same input. The pick should stay close."

improve:
  - "Add real lists of buyers, so counts come from data."
  - "Add notes from past sales, so need scores come from evidence."
  - "Pair it with \"Market boundary checker\" to test the pick."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Listing and scoring groups against fixed tests is text work that any strong chat AI does with this skill."}
  inputs:
    - "Lists of buyers you can reach"
    - "Notes on who bought or asked for your product"
    - "A map of where your buyers gather"

terms:
  - term: "First market"
    meaning: "The small group of buyers you aim to win before anyone else."
  - term: "Lightly served"
    meaning: "A group that has no strong supplier today."
next: [first-customers-by-hand-planner, customer-interview-request]
