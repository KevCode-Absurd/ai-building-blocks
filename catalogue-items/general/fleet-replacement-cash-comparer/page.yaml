new_slug: fleet-replacement-cash-comparer
name: Fleet replacement cash comparer
headline: Fleet replacement cash comparer
summary: Compare replacing a fleet vehicle with keeping it. Get a cash schedule and present value of the extra cash, so you can judge a fleet replacement.
job: track-numbers
thinking: high
thinking_why: "Cash moves in different years, so each amount needs its date and a stated discount rate before the totals mean anything."
subhead: Give it your replacement quote, the old vehicle's sale value, three years of savings, the end-of-term difference and your discount rate. It builds a cash schedule for replacing instead of keeping. You get the present value and a list of anything still missing.
explain: |-
  A replacement can look good on price and still lose cash over its life. This compares replacing a vehicle now with keeping it, using only the extra cash the change brings, and brings that cash back to today's value.

  Illustrative USD amounts only. Replacing now costs $1,000, less $200 from selling the old vehicle, so $800 goes out at time zero. Savings are $300 a year for three years. The terminal difference is $100: the replacement's sale proceeds minus the sale proceeds you give up by not keeping the old vehicle. So final-year incremental cash is $300 + $100 = $400. At a zero discount rate, future cash is $300 + $300 + $400 = $1,000, and the net benefit is $1,000 - $800 = $200. With a terminal difference of -$100, future cash is $800 and exactly covers the $800 paid at time zero. No depreciation or financing cash is included.
when:
  - You are deciding whether to replace a truck or van now or keep it.
  - A manager asks you to show the cash case for a fleet purchase.
  - You have a vehicle quote and a trade-in value and want the net cash at time zero.
  - A reviewer needs to trace every number back to a dated source.
not_for:
  - "You need tax, financing or downtime effects: these need their own dated sources, so ask your accountant or finance lead."
  - "You do not know what the old vehicle would sell for at the end: find a dated quote first, because the skill will not assume zero."
  - "You want to decide if a vehicle is safe or due for service: ask your mechanic or fleet manager, as this only compares cash."
  - "You want what one freight trip earns after fuel, driver and tolls: use the Freight trip contribution builder instead."
you_give:
  - The quoted cash price of the replacement vehicle, with its date and currency.
  - What the old vehicle would sell for today, with its date.
  - The extra cash saved each year for three years.
  - The difference in end-of-term sale value, replacement minus keep (can be negative).
  - Your approved discount rate.
you_get:
  - A cash schedule for time zero, years 1 to 3 and the end of term.
  - The present value of that extra cash, and the net benefit.
  - An editable workbook with inputs, formulas and test cases.
  - A list of missing inputs and checks that did not run.
how_to_use:
  - Gather the five inputs above, each with its date and currency.
  - "Open Claude, ChatGPT or Gemini with a tool that can make spreadsheet files. Upload the pack and say: follow SKILL.md."
  - Paste your inputs. If one is missing, the AI marks it MISSING and stops that part.
  - To run the bundled calculation, use an AI that can run code with Node.js 20 or later.
  - Read the assumptions, the reconciliations and CHECKS MISSED before you rely on the result.
output_sample:
  input:
    - Quoted cash price of the replacement vehicle
    - What the old vehicle would sell for today
    - Extra cash saved each year for three years
    - Difference in end-of-term sale value, replacement minus keep (can be negative)
    - Your approved discount rate
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, to run the bundled calculation (optional)
  output:
    - name: Incremental cash schedule
      contains: Cash at time zero, years 1 to 3 and the end-of-term difference, for replacing instead of keeping.
    - name: Present value
      contains: Future cash discounted at your rate, with undiscounted and discounted totals shown and reconciled separately.
    - name: Scope and dated sources
      contains: Where each input came from, with its date, currency and scale.
    - name: Inputs and assumptions
      contains: Every input and assumption, kept apart from reported facts.
    - name: Model calculations and reconciliations
      contains: The working formulas and the checks that the totals agree.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation, a changed input and reopening the file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: List the five inputs
    text: Notes each input with its date and currency. A missing input is marked MISSING and never treated as zero.
  - title: Put cash out at time zero
    text: The replacement price minus what the old vehicle sells for today. The old vehicle's sale is counted once, here.
  - title: Add the yearly savings
    text: Years 1 and 2 hold the annual saving. Year 3 holds the saving plus the end-of-term difference, which can be negative.
  - title: Discount and compare
    text: Discounts each future line at your rate, shows undiscounted and discounted totals side by side, and gives the net benefit.
output_shape: |-
  An incremental replacement cash schedule and present value.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Quote date"
    how: "Take the quote date from the replacement quote, the old vehicle's sale value and the yearly savings. Use one currency and scale on every line."
  - what: "Yearly cash saving"
    how: "Change the yearly cash saving and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Every material driver traces to a dated source; actuals and scenarios remain separate.
judge:
  - Every material driver traces to a dated source; actuals and scenarios remain separate.
  - Missing evidence blocks the affected calculation instead of becoming a zero.
  - Savings are positive or signed negative incremental cash, not promised operational improvements.
  - Old-vehicle immediate sale is counted once at time zero. Terminal cash is the signed replacement-minus-keep difference at the common horizon; it is not the replacement vehicle sale alone or depreciation.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one fleet replacement comparison you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define present value into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
