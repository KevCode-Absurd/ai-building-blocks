new_slug: fleet-replacement-cash-comparer
name: Fleet replacement cash comparer
headline: Fleet replacement cash comparer
summary: An incremental replacement cash schedule and present value
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: An incremental replacement cash schedule and present value. Share quoted replacement purchase cash, realizable old-vehicle sale at time zero, three annual incremental operating savings, signed new-minus-keep terminal cash difference and approved discount rate.
explain: |-
  An incremental replacement cash schedule and present value.

  Fleet capital decisions. Illustrative USD amounts only. Replace now costs1000 less old sale200=800 at time zero. Annual incremental operating savings are300 each; the terminal input100 is replacement sale proceeds less the keep-vehicle terminal sale forgone, so final-year incremental cash400 gives present future cash1000 at zero discount and net benefit200. With a negative terminal difference of100, future cash800 exactly covers the initial800. No depreciation or financing cash is included.
when:
  - You need an incremental replacement cash schedule and present value.
  - You work on fleet capital decisions and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Quoted replacement purchase cash, realizable old-vehicle sale at time zero, three annual incremental operating savings, signed new-minus-keep terminal cash difference and approved discount rate.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - An incremental replacement cash schedule and present value.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: 1. Map dated source records, actual units, period cutoffs, currency, definitions and missing evidence before computing
    text: Map dated source records, actual units, period cutoffs, currency, definitions and missing evidence before computing.
  - title: 2. Compare continued use with replacement on the same workload; include only incremental cash and source old-vehicle sale evidence
    text: Compare continued use with replacement on the same workload; include only incremental cash and source old-vehicle sale evidence.
  - title: 3. Place replacement purchase less immediate old-vehicle sale at time zero and annual operating differences at their year ends
    text: Place replacement purchase less immediate old-vehicle sale at time zero and annual operating differences at their year ends. At the horizon add new-vehicle sale proceeds minus the foregone terminal sale proceeds of the retained old vehicle; source both alternatives and allow a negative difference.
  - title: 4. Discount future incremental cash at the approved comparable cash-flow rate and reconcile undiscounted and discounted totals separately
    text: Discount future incremental cash at the approved comparable cash-flow rate and reconcile undiscounted and discounted totals separately.
output_shape: |-
  An incremental replacement cash schedule and present value.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Every material driver traces to a dated source; actuals and scenarios remain separate.
judge:
  - Every material driver traces to a dated source; actuals and scenarios remain separate.
  - Missing evidence blocks the affected calculation instead of becoming a zero.
  - Savings are positive or signed negative incremental cash, not promised operational improvements.
  - Old-vehicle immediate sale is counted once at time zero. Terminal cash is the signed replacement-minus-keep difference at the common horizon; it is not the replacement vehicle sale alone or depreciation.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
