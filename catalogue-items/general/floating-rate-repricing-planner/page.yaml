new_slug: floating-rate-repricing-planner
name: Floating rate repricing planner
headline: Floating rate repricing planner
summary: Work out the extra interest a rate rise adds to each floating-rate loan, then see your new total interest for the period, loan by loan.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it each floating-rate loan's balance, the extra rate you expect and the share of the year it applies. It works out the extra interest on every loan and adds it to your base interest. You get a loan-by-loan repricing ladder and the new total.
explain: |-
  When rates rise, a floating-rate loan costs more. How much more depends on three things: how much of the loan floats, how big the rate move is, and how long the new rate applies. This floating rate repricing planner does that sum for each loan on its own, so you can see which loan adds the most to your interest bill.

  It counts only the part of each loan that really floats. A part you have fixed or hedged comes out first, and only if you can show the contract. Each loan's extra rate then runs for the share of the year after its reset date, not the whole year. A loan that resets in July feels about half a year of the rise.

  The loan rows are added up and checked against the total. Practice numbers: 1,000 floating at 1% extra for half a year adds 5. 500 at 2% extra for a quarter of the year adds 2.5. The extra is 7.5, so base interest of 60 becomes 67.5.
when:
  - Your bank says its base rate will rise on a set date, and you want to know what that adds to your interest bill this year.
  - You are setting a budget and want to test a 1% or 2% rise on each loan.
  - Two loans reset on different dates and you need the extra cost of each one.
  - A lender, board or partner asks how much a rate rise adds to your interest cost.
not_for:
  - "You want to check what a lender actually charged on a revolving credit line: use the Revolver interest and fee checker."
  - You need floors, caps or repayments during the year. This skill applies one flat rate move to each loan, so those need a separate schedule.
  - "Part of your interest is added to the loan instead of paid in cash: use the Cash and PIK interest checker."
you_give:
  - The floating balance of each loan (from your lender statement)
  - The extra annual rate for each loan, such as 1% or 2% (your rate scenario)
  - The share of the year each new rate applies, or the reset date and the day count in your loan agreement
  - Your interest for the period if rates did not move (from your budget or lender statement)
  - The currency and units, such as USD thousands
  - The part of any loan you have fixed or hedged, with the contract that proves it (optional)
you_get:
  - A repricing ladder with one row per loan
  - The extra interest on each loan and in total
  - Your new total interest, base interest plus the extra
  - A check that the loan rows add up to the total
  - A list of missing facts and checks it could not run
  - A small workbook with the same sums, if your AI can make files
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. A chat is enough. You do not need to run code.
  - "Paste the numbers for each loan: floating balance, extra rate and when the new rate starts. Add your base interest and say the currency and units."
  - "Ask in plain words, such as: what do a 1% rise on loan A and a 2% rise on loan B add to this year's interest?"
  - Check one row yourself. Extra interest is the floating balance times the extra rate times the share of the year.
  - Read MISSING and CHECKS MISSED before you use any figure.
  - Ask for a workbook only if your AI can make files.
how_it_works:
  - title: Lists your sources
    text: Notes the balance, currency, units and period for each loan, and the contract terms that define the rate.
  - title: Takes out fixed and hedged parts
    text: Counts only floating principal. It removes a fixed or hedged part only when you give the contract that shows it.
  - title: Prices each loan's rise
    text: Multiplies each loan's floating balance by its extra rate and by the share of the year the rate applies.
  - title: Adds up and ties out
    text: Adds the extra interest to your base interest, then checks that the loan rows equal the total change.
  - title: Marks the gaps
    text: Writes MISSING for any number you did not give and lists any check it could not run. It never fills a gap with zero.
output_shape: |-
  RESULT
  Extra interest <amount> | Base interest <amount> | New total interest <amount>

  REPRICING LADDER
  <one row per loan: floating balance | extra rate | share of year | extra interest>

  SCOPE AND SOURCES
  <period, currency and units; source and date for each input>

  INPUTS AND ASSUMPTIONS
  <floating balances, fixed or hedged parts removed, extra rates, shares of year, day count>

  CALCULATIONS AND TIES
  <each sum with its figures, then the tie of loan rows to the total change>

  FILE CHECK
  <what was recalculated in the workbook, or "no workbook made">

  MISSING
  <list>

  CHECKS MISSED
  <one line per check not done, or none>
output_sample:
  input:
    - The floating balance of each loan
    - The extra rate and the share of the year for each loan
    - Your base interest if rates did not move
    - The fixed or hedged part of any loan, with its contract (optional)
  prerequisites:
    - Your lender statements or loan agreements
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: RESULT
      contains: Extra interest in total, your base interest and the new total interest.
    - name: REPRICING LADDER
      contains: One row per loan with its floating balance, extra rate, share of year and extra interest.
    - name: SCOPE AND SOURCES
      contains: The period, currency and units, with the source and date of each input.
    - name: INPUTS AND ASSUMPTIONS
      contains: Each number you gave it and each assumption, kept apart from facts.
    - name: CALCULATIONS AND TIES
      contains: Each sum shown with its figures, and the check that loan rows equal the total change.
    - name: FILE CHECK
      contains: What was recalculated in the workbook, or a note that none was made.
    - name: MISSING
      contains: Every number it needed and did not get. It never fills one with zero.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
tweaks:
  - what: A different rate move
    how: Change the extra rate for one loan. Only that loan's row and the total change.
  - what: A later reset date
    how: Lower the share of the year. A reset with three months left is 0.25.
  - what: A hedged part
    how: Give the hedge contract. The hedged balance comes out of that loan's floating balance first.
judge:
  - Every material input has a source location, date, unit, sign and approval status.
  - Keep actual records, contractual inputs and scenarios separate; a missing value never becomes zero.
  - Floating balances exclude confirmed fixed portions without double counting hedge notional.
  - A rate shock of zero must leave incremental interest at zero; year fractions remain between zero and one.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can do these sums in a chat.
    - name: An AI that can make spreadsheet files
      why: It can build the workbook, recalculate it and check that it reopens.
    - name: Node.js 20 or later (optional)
      why: Runs the small script that comes with the skill, for a second check of the numbers.
  inputs:
    - Your latest lender statement for each loan
    - The page of the loan agreement that sets the rate, the reset dates and any hedge
    - A named reviewer and the rate scenario you want to test
terms:
  - term: Floating rate
    meaning: A loan rate that moves when a market rate, such as a bank base rate, moves.
  - term: Rate shock
    meaning: A set rise or fall in rates that you test, such as plus 1%.
  - term: Repricing ladder
    meaning: A table with one row per loan, showing when its rate resets and what that adds to cost.
  - term: Year fraction
    meaning: The share of a year the new rate applies. Half a year is 0.5.
  - term: Hedge
    meaning: A contract that fixes the rate on part of a loan.
  - term: Reconciliation
    meaning: A check that explains any gap between two sets of figures that should match.
