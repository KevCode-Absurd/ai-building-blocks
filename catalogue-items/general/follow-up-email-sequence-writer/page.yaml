new_slug: follow-up-email-sequence-writer
name: "Follow-up email sequence writer"
summary: "Turn one planned email into four follow-ups with a new reason each, one ask, send timing and a stop rule. Paste your email and offer."
job: write-emails
thinking: medium
thinking_why: "It has to find four different reasons in one input and keep every fact straight across four emails."

headline: "Follow-up email sequence writer"
subhead: "Paste the one email you were going to send and the offer behind it. It pins one ask and finds four different reasons to act. You get four short emails, each with one reason, plus the days between them and a rule for when to stop."

explain: |
  Most people send one email and call it a campaign. The reader was busy, or not ready, or needed one more fact. A follow-up email sequence works when each message brings something new. A message that only says "just bumping this" gives them nothing to act on.

  This prompt turns your single email into four. Every email asks for the same action. Each one carries a different reason: the main benefit, the biggest doubt answered, proof, then a short and honest last note. It suggests the gaps between sends. It keeps every price and deadline exactly as you gave them.

  It also writes the rule that ends the sequence when someone replies or buys. If you have no proof or no real deadline, it says MISSING and writes a question instead of making one up.

when:
  - "You wrote one sales or outreach email and are about to send it once to a list."
  - "People open your first email and nothing happens after."
  - "You have an offer with a real end date and want the run-up planned."
  - "You send a lone reminder and want to know what a second and third email should say."

not_for:
  - "People started to buy or sign up and went quiet: use the Sales follow-up email writer."
  - "You need a weekly plan for your whole list, not one offer: use the Email schedule planner."
  - "Your list never agreed to hear from you: check it first with the Email consent and message reviewer."
  - "You already send a sequence and want to know what works: use the Email sequence results auditor."
  - "You want a whole welcome, nurture or win-back flow from one goal: use the Email sequence and timing writer."

you_give:
  - "The email you planned to send, or its facts: what you offer, to whom, and the one action you want"
  - "The offer, with price, terms and any real deadline (advised)"
  - "Who gets it and what they already know (advised)"
  - "Proof you may use, such as a quote with permission or a number you can back (optional)"
you_get:
  - "One ask, and four different reasons marked as from your input or a gap"
  - "Four emails under 150 words each, with subject lines"
  - "Suggested days between sends, with the reason for each gap"
  - "A stop rule for when the sequence ends"
  - "A list of facts it was missing"

how_to_use:
  - "Copy the prompt, then paste it into Claude, ChatGPT or Gemini with your email under it. It needs no files or paid tools."
  - "Add the offer facts and who the list is. Give real prices and dates only."
  - "Check the list of reasons first. Fill any gap with a real fact and run it again, or let that email ask a question."
  - "Check every price, date and quote against your own records before you send."
  - "Load the four emails into your email tool with the suggested gaps and the stop rule."

how_it_works:
  - title: "Pins the one ask"
    text: "Every email asks for the same action. A second ask gets parked."
  - title: "Lists four reasons"
    text: "Main benefit, biggest doubt answered, proof, cost of waiting. Each marked FROM INPUT or GAP."
  - title: "Gives each email one reason"
    text: "No email repeats another. The last one is short and honest about the deadline."
  - title: "Sets the timing"
    text: "Suggests days between sends and says why."
  - title: "Writes the emails"
    text: "Under 150 words each, subject under eight words, only facts from the input."
  - title: "Writes the stop rule"
    text: "A reply, a purchase or an opt-out ends the sequence."

output_shape: |
  THE ASK         <one action>
  REASONS         1 <...> 2 <...> 3 <...> 4 <...>
  TIMING          Day 0, Day <n>, Day <n>, Day <n> (SUGGESTED)
  EMAIL 1         Subject: <...> / <body> / <ask line>
  EMAIL 2 to 4    <same shape>
  STOP RULE       <when it ends>
  MISSING         <...>
  CHECKS MISSED   <one line each, or none>

output_sample:
  input:
    - "The email you planned to send, or its facts"
    - "The offer, with price, terms and any real deadline (advised)"
    - "Who gets it and what they already know (advised)"
    - "Proof you may use (optional)"
  prerequisites:
    - "An AI chat. No files, web access or paid tools are needed."
    - "A list of people who already know you or opted in"
  output:
    - {name: "The ask", contains: "The one action every email asks for."}
    - {name: "Reasons", contains: "Four different reasons to act, each marked from your input or a gap."}
    - {name: "Timing", contains: "Suggested days between sends, with the reason for each gap."}
    - {name: "Emails 1 to 4", contains: "A subject line, a short body and the ask line for each, under 150 words."}
    - {name: "Stop rule", contains: "When the sequence ends: a reply, a purchase or an opt-out."}
    - {name: "Missing", contains: "Offer facts, proof or deadlines you did not give."}

example:
  business: sprout
  input: |
    [the prompt]

    List: people who bought one pouch of Sprout greens gummies once, at the
    full one-time price of $66.65, and did not subscribe.
    Ask: start a subscription.
    Offer: Subscribe and Save, 28 packs every 4 weeks, first box $29.99,
    renews at $49.99 every 4 weeks, free shipping, pause or cancel any time,
    30-day money-back guarantee. No end date on the offer.
    Proof I can use: a brand survey of 3,000+ customers, "95% of surveyed
    users take Sprout at least 4 to 6 times a week". Review quote with
    permission: "Sprout has been the one thing I've been able to stick to."
    My one email:
    Subject: Ready for your next pouch?
    Your first pouch should be running low. Subscribe today and save up to
    55% on your first box, with free shipping. Start Now.
  output: pending

tweaks:
  - what: "The deadline"
    how: "Give a real end date and email 4 gets sharper. Give none and it stays an honest last note."
  - what: "Proof"
    how: "One quote with permission or one number you can back turns email 3 from a claim into evidence."
  - what: "Who they are"
    how: "Past customers need less background and a shorter sequence. Cold leads need more doubt-answering."

judge:
  - "All four emails ask for the same thing."
  - "You can name the one reason in each email, and they differ."
  - "No price, deadline or result appears that you did not give."
  - "Each email reads fine if it is the only one they open."
  - "The stop rule is there."

test:
  - "Send the sequence to half a list and your single email to the other half. Compare replies or sales."
  - "Run it twice. THE ASK and the four reason types should match."
  - "Give it an email with no proof. Email 3 should ask a question or say MISSING, not invent a number."

improve:
  - "Add your real send-gap rule, so TIMING stops being a suggestion."
  - "Paste your offers file from your org context, so prices and terms are always right."
  - "Pair it with the Email send readiness scorer before loading it into your tool."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all handle a four-email draft in one message."}
  inputs:
    - "The last sequence you sent and which email got the most replies"
    - "The three doubts customers raise most before buying"
