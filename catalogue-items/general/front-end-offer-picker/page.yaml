new_slug: front-end-offer-picker
name: Front-end offer picker
summary: "Pick your best first step: premium, free or discount. Scored on your lead costs, cash and proof, with a plan to move up."

job: make-offer
thinking: medium
thinking_why: It weighs several facts about your business against three routes and gives a reasoned pick. The scoring is fixed.
headline: Front-end offer picker
subhead: "Give it your offer and what you know about your leads, costs, cash and market. It scores a premium, a free and a discount first step against those facts and picks one. You get what must be true for it to work, when to move to premium, and two tests to run first."

explain: |
  If too few people respond to your offer, the usual fix is a better ad. Often the better fix is a different way in. A premium offer on its own brings the best buyers, but it costs the most to reach them and pays back the slowest. A free first step brings the most leads at the lowest cost. A deep discount on one piece collects a little cash and sets up the next sale.

  This front end offer picker compares the three on your facts: how many leads you can handle, what a lead costs, how long you can wait to break even, how well buyers know what you sell, any rules on free offers where you sell, and how much proof you hold. It gives each route a score, so the pick follows from the numbers and not from a hunch.

  If the scores tie, or most of your facts are unknown, it makes no pick. It tells you which facts would break the tie. The ideas come from Alex Hormozi's draft chapter on how to attract buyers. His figures on free offers are his own claim, so test them on your own leads.

when:
  - "Too few people respond to your offer, and a better ad has not fixed it."
  - "Your cost to win a customer is higher than you can afford."
  - "You are entering a new market, or a small local one, and have no proof yet."
  - "You are unsure whether to offer a free trial, a free audit or a deep discount, and want a reason to pick one."

not_for:
  - "You have already chosen a free first step for a physical product. Use the Free sample offer planner."
  - "You have chosen to lead with useful information. Use the Information-led lead offer planner."
  - "You have no offer or price yet. Use the Hidden offer finder first."
  - "You want to improve a lead offer you already run. Use the Lead offer tuner."

you_give:
  - "Your offer: what is in it, and the price"
  - "Your numbers: leads per week, cost per lead, cost per sale, close rate (optional)"
  - "Cash you can spend while you learn, and how long you can wait to break even (optional)"
  - "Your market, and any rules on free offers where you sell (optional)"
  - "What proof you hold, such as reviews or results (optional)"

you_get:
  - "A score for premium, free and discount, fact by fact"
  - "The pick, with the reason and what must be true for it to work"
  - "The facts that would change the pick"
  - "When and how to move to a higher-priced start"
  - "Two tests with a spend, a time and a win rule written first"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini. If you added it to your AI, start a chat with it. If not, copy it and paste it in."
  - "Paste your offer and price, then whatever lead and cost numbers you have. Say \"unknown\" for any you lack. It will not invent them."
  - "Say how much cash you could spend while you learn, and how many new leads you can answer each week."
  - "Read the score table before the pick. If the totals tie, the answer is a list of facts to find out, not a route."
  - "Run the two tests it sets, with the win rule it wrote first."
  - "Take the pick to the Lead cost and friction planner."

how_it_works:
  - title: Gathers your facts
    text: Volume, cost, cash, trust, rules, how well buyers know your type of offer.
  - title: Lays out the three routes
    text: Pros, cons and when each fits.
  - title: Scores each
    text: Against your facts, 0 to 3 per fact.
  - title: Picks one
    text: Says what must be true and what would change the pick.
  - title: Plans the move up
    text: When and how to go to premium once you have proof.
output_shape: |-
  YOUR FACTS
  Volume | cost per lead | cost per sale | cash and time to break even | proof | how well buyers know this offer | rules on free

  SCORES
  Route | fact-by-fact scores | total

  THE PICK
  <route> | why | what must be true

  WHAT WOULD CHANGE IT
  <facts that flip the pick>

  MOVING UP
  <when and how to go to premium>

  FIRST TESTS
  <two tests with a win rule>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check missed, or none>
output_sample:
  input:
    - "Your offer and its price"
    - "Your lead and cost numbers (optional)"
    - "Cash you can spend, and your market's rules on free offers (optional)"
    - "The proof you hold (optional)"
  prerequisites:
    - "Your offer from the Hidden offer finder (optional)"
  output:
    - name: "Your facts"
      contains: "Volume, cost per lead, cost per sale, cash, proof and rules, with unknowns marked MISSING."
    - name: "Scores"
      contains: "Premium, free and discount scored 0 to 3 on each fact, with totals."
    - name: "The pick"
      contains: "The route, why it won, and what must be true for it to work. No pick on a tie."
    - name: "What would change it"
      contains: "The facts that would flip the pick."
    - name: "Moving up"
      contains: "When and how to go to premium once you have proof."
    - name: "First tests"
      contains: "Two tests, each with a spend, a time and a win rule."
    - name: "MISSING and CHECKS MISSED"
      contains: "Facts you did not give, and one line per check still missed."

tweaks:
  - what: Your cash
    how: State how long you can wait to break even. Less cash pushes the pick toward free or discount.
  - what: Your sales process
    how: A weak sales process makes premium risky. Say how tight yours is.
  - what: Rules
    how: Name any rules on free offers in your country or field.
judge:
  - The pick follows from the scores, not from a preference.
  - Each fact is stated or marked as missing.
  - The reason names what must be true.
  - There is a plan to move to premium.
  - The tests have a win rule.
test:
  - Give it a case with lots of cash and strong proof. It should lean premium.
  - Give it a case with no proof and little cash. It should lean free or discount.
  - Check that rules on free offers move the pick toward discount.
improve:
  - Rerun it each time proof or cash changes.
  - Keep the numbers from your tests for the next run.
  - "Layer the offers: premium works as the second offer after a free first step."
works_best_with:
  tools:
    - name: Any good chat AI
      why: This is text and number work that any strong chat AI does well with the skill.
  inputs:
    - A sheet of lead and sales numbers
    - Reviews or testimonials you hold
    - Your cost to give the first step away
terms:
  - term: Front end
    meaning: The first offer a new buyer sees.
  - term: Premium offer
    meaning: The main offer sold at full price on its own.
