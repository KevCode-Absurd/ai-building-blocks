new_slug: fund-recycling-capacity-checker
name: Fund recycling capacity checker
headline: Fund recycling capacity checker
summary: Check how much of your fund's recycling cap is left and how much of a distribution you can reinvest. Give it the cap, the amount used and the distributions.
job: money-and-investing
thinking: high
thinking_why: "The cap comes from the agreement's own definitions, so each base and each eligible distribution must be confirmed."
subhead: Give it your fund's recycling cap and what you have used so far. It works out what is left to reuse from new distributions. You also see the excess it leaves out.
explain: |-
  A fund agreement often lets you reinvest distributions up to a cap. This works out how much of the cap is left, how much of a new distribution fits under it and how much is left out. Any past overuse stays visible.

  Illustrative figures only. A 20% recycling cap on a commitment of 100 is 20. With 12 already recycled, 8 is left, so 8 of 15 eligible distributions can be reused and 7 is left out. With 18 already recycled, only 2 is left.
when:
  - A fund distribution arrives and you need to know how much can be reinvested.
  - You must show a reviewer how the recycling cap was used.
  - You suspect past recycling went over the cap and want it shown.
  - You are checking a fund manager's recycling figures against the signed agreement.
not_for:
  - "You need to know if a distribution is legally eligible by date or recall rights: ask your fund's lawyer or the fund administrator."
  - "You want to decide on a new investment: use your investment committee process, as spare cap does not approve a deal."
  - "You need to track recalled amounts or commitment changes: use the fund administrator's ledger, as this checks one cap only."
  - "You need to split a capital call across commitments: use the Capital call allocation checker instead."
you_give:
  - The commitment cap base from your fund agreement.
  - The recycling fraction in the agreement.
  - The total recycled so far.
  - The distributions that are eligible to recycle.
  - Proof that the recycling window is still open.
  - Reporting date, currency and scale.
you_get:
  - The remaining cap after past recycling.
  - The amount of new distributions you can reuse.
  - The excess that is left out.
  - Any past overuse of the cap, kept visible.
  - A list of missing inputs and checks that did not run.
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini. Use one that can read files.
  - "Share your fund agreement figures: cap base, fraction, amount used and eligible distributions."
  - Add the reporting date, currency and scale.
  - Ask your AI to run the check and list anything it could not confirm.
  - Read the MISSING lines and the reconciliation before you rely on the numbers.
  - Ask your fund administrator or lawyer to confirm which distributions are eligible.
output_sample:
  input:
    - Your commitment cap base
    - The recycling fraction in your fund agreement
    - How much recycling has been used so far
    - Your eligible distributions
    - Proof the recycling window is still open
  prerequisites:
    - An AI that can read your files
    - Node.js 20 or later, only if you want to run the included calculation script (optional)
  output:
    - name: Remaining cap
      contains: The recycling cap left after subtracting what was already recycled, with any past overuse shown.
    - name: Reusable amount
      contains: The part of the new eligible distributions that fits inside the remaining cap.
    - name: Excluded excess
      contains: The part of the distributions that is over the cap and cannot be recycled.
    - name: Prior cap overuse
      contains: Any amount already recycled beyond the cap in earlier periods.
    - name: Scope and dated sources
      contains: The documents, dates and currency each input came from.
    - name: Reconciliations
      contains: Checks that the eligible, reused and excluded amounts add back to the distributions.
    - name: MISSING and CHECKS MISSED
      contains: Inputs not supplied and checks that failed or could not run.
how_it_works:
  - title: 1. Check the exact cap basis, investment-period cutoff, eligible distribution categories and any LP approvals
    text: Check the exact cap basis, investment-period cutoff, eligible distribution categories and any LP approvals.
  - title: 2. Compute aggregate cap and subtract actual previously recycled amounts, keeping any historic overuse visible
    text: Compute aggregate cap and subtract actual previously recycled amounts, keeping any historic overuse visible.
  - title: 3. Admit only eligible new distributions within remaining capacity; reconcile distributions left ineligible under the cap
    text: Admit only eligible new distributions within remaining capacity; reconcile distributions left ineligible under the cap.
output_shape: |-
  Remaining cap, reusable amount, excluded excess and prior cap overuse.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Distribution date"
    how: "Take the distribution date from the fund agreement and the distribution records. Use one currency and scale on every line."
  - what: "Recycled amount to date"
    how: "Change the recycled amount to date and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Eligible distributions are confirmed separately; a cash receipt is not automatically recyclable.
judge:
  - Eligible distributions are confirmed separately; a cash receipt is not automatically recyclable.
  - Previously recycled amounts cannot be omitted when reusing the same distribution notice.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one fund recycling cap you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define recycling cap into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
next: [capital-call-allocation-checker]
