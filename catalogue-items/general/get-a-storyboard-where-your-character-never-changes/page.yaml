new_slug: get-a-storyboard-where-your-character-never-changes
name: "A storyboard where your character never changes"
summary: "Give it your character images, script and product photos. You get every shot planned, with framing and timing."
job: make-video-ads

headline: "A storyboard where your character never changes"
subhead: Give it your character's reference images, the approved script and your product photos. It locks the character in one fixed description, gives each shot one job, writes the moment to draw, the framing and the timing, and checks the script fits what's on screen.

explain: |
  A storyboard is a shot-by-shot plan of an ad, drawn or described before anything is filmed or generated. Two problems usually creep in. The character slowly changes from frame to frame (a different hairstyle, a new jacket), and shots get added because they look nice, not because they move the argument on.

  This skill writes one identity line from your character's reference images (face, hair, marks, build, outfit) and repeats it word for word in every frame, the way animators keep a character on model with a model sheet. The first shot stops the scroll. Every shot after it carries one of five links (who it's for, what they gain, the proof, the risk removed, the next step), so a missing reason to believe shows up as a gap. It also checks the things film crews watch for: which way the character faces, where they look, and where each prop sits. Timing is checked against the script, and on-screen text stays exact and in your real font.

when:
  - You have a chosen character and an approved script and need a storyboard before making the video.
  - Your character keeps changing between frames and you want one fixed reference to work from.
  - You want to check an ad has a clear opening, a reason to believe and a call to action before spending on it.

you_give:
  - Your character's reference images (front, three-quarter, side, back, face and hands)
  - The approved script or narration, with the buyer, their doubt and the call to action
  - Product photos and your logo, if they appear
  - Your brand voice and font
  - How it's delivered, such as narrator or talking to camera (optional)
you_get:
  - One identity line to paste into every frame
  - A numbered shot table with job, moment, cast, action, framing, setting, lines, on-screen text and timing
  - A continuity note listing what stays fixed and what changes where
  - A review of the character, the product and the five links

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Attach your character's reference images, and say which view each one is.
  - Paste the approved script and say who the buyer is, their doubt, and what you want them to do.
  - Attach product photos and name your font.
  - Paste the identity line into every image or video prompt you make from the board.

how_it_works:
  - title: Locks the character
    text: Writes one identity line from the reference images only, and keeps it apart from what may change per shot.
  - title: Gives every shot one job
    text: The first shot stops the scroll. Each shot after carries who, gain, proof, risk or the next step, so a missing link shows up.
  - title: Keeps the words exact
    text: Doesn't rewrite approved lines, keeps product printing real, and puts on-screen text in your real font.
  - title: Writes each frame
    text: The moment to draw, who's there, one action, framing, setting, props and timing.
  - title: Holds continuity
    text: Keeps light, facing direction, eyelines and prop positions the same between neighbouring frames.
  - title: Times and reviews
    text: Reads each shot's lines against its time, keeps narration apart from on-camera lines, and reviews before anything is made.

output_shape: |
  IDENTITY LINE (paste into every frame)
  <face, hair, marks, build, outfit, in a fixed order>

  Shot | job | moment to draw | cast | action | framing |
       setting and props | lines | on-screen text | timing
  1    | stop | <...> | <character> | <one action> | <close/wide> |
       <...> | "<words>" | "<exact text>" | <0-3 s>
  <one row per shot>

  CONTINUITY
  Fixed: <light, facing direction, room layout, product state>
  Changes: <what changes, in which shot>

  REVIEW
  Character: <...>  Product: <...>  Links: who / gain / proof / risk /
  step, each with its shot or "gap"
  MISSING: <anything not supplied>

example:
  business: sprout
  input: |
    [the skill]

    Character: a made-up woman, about 38, shoulder-length dark brown
    hair, brown eyes, light olive skin, a small mole on her left
    cheek, mustard cardigan over a white tee, jeans.
    [front] [three-quarter] [side] [face close-up] [hands]
    Delivery: narrator voice-over. She doesn't speak.
    Buyer: the busy parent. Doubt: "Is this just candy?"
    Call to action: start a first order.
    Approved narration:
    1 School run. Work bag. Breakfast for three.
    2 Your own nutrition? A handful of gummies now.
    3 One daily pack. Rip, tip, enjoy.
    4 60+ ingredients, 21 vitamins and minerals, 6 grams of fiber.
    5 Just grab and go.
    On-screen end text: "First order $29.99 with text sign-up.
    Renews at $49.99 every 4 weeks."
    Product: [pouch front] [daily pack in a hand]. Tear the daily
    pack straight across the top only.
    Font: Work Sans Bold (headings), Work Sans Medium (body).
  output: |
    IDENTITY LINE
    Woman about 38, light olive skin, brown eyes, small mole on her
    left cheek, shoulder-length dark brown hair, mustard cardigan over
    a white tee, blue jeans.

    1  STOP + WHO  0-3 s
       Moment: hallway, a school bag on one shoulder, her work bag in
       the other hand.  Action: turns towards the door.
       Framing: medium, eye level.  Setting: front door at right,
       window light from left.
       VO: "School run. Work bag. Breakfast for three."
    2  GAIN  3-7 s
       Moment: she sets the work bag on a side table where a Sprout
       pouch stands, label to camera.  Action: one hand reaches for
       the pouch.  Framing: medium close.
       VO: "Your own nutrition? A handful of gummies now."
    3  PROOF (it works as shown)  7-11 s
       Moment: her hands tear a daily pack straight across the top
       edge and tip small deep-green gummies into her palm.
       Framing: close on hands, matching the "in a hand" photo.
       VO: "One daily pack. Rip, tip, enjoy."
    4  PROOF (answers "just candy?")  11-16 s
       Moment: the pouch on the side table, sharp, her open hand
       with gummies soft beside it.  Framing: close on the pouch.
       VO: "60+ ingredients, 21 vitamins and minerals, 6 grams of
       fiber."  On screen: "60+ ingredients. 21 vitamins & minerals.
       6 g fiber." (Work Sans Bold)
    5  GAIN, paid off  16-18 s
       Moment: she eats the gummies and opens the front door.
       Framing: medium, from behind her shoulder, still moving
       right to left as in shot 1.
       VO: "Just grab and go."
    6  STEP  18-22 s
       Moment: held on the pouch on the side table, door open behind.
       On screen: "First order $29.99 with text sign-up. Renews at
       $49.99 every 4 weeks." (Work Sans Medium, in the empty space
       above the pouch, no box)

    CONTINUITY
    Fixed: identity line in shots 1, 2, 3 (hands, cardigan cuffs) and
    5. Front door at right, window light from left. She moves right
    to left throughout. The pouch stays on the side table from shot 2
    on, label to camera.
    Changes: the daily pack is torn in shot 3 and stays torn.

    REVIEW
    Links: who (1), gain (2, 5), proof (3, 4), step (6).
    Risk: gap. Nothing answers "is it safe to try?". Suggest adding
    "30-day money-back on your first order" to the end text, which
    needs your approval first.
    She never claims a result; the narrator speaks only approved lines.
    Character sameness: check again after the panels are drawn.
    MISSING: the daily pack's own label words, so shot 3 frames it
    from the side.

tweaks:
  - what: Delivery style
    how: Switch from narrator to "talking to camera" and the shots change. Her lines get lip-sync timing and the framing tightens on her face.
  - what: Length
    how: Give a target ("15 seconds") and it merges shots while keeping the stop shot, one proof and one call to action.
  - what: The buyer's doubt
    how: Name the doubt and the proof shot is built to answer it. A different doubt moves which fact goes on screen.
  - what: Reference views
    how: Add a hands view if the product is handled. Without it, the proof shot is the most likely place for the character to drift.

judge:
  - The identity line is word for word the same in every frame where she appears.
  - There's one stop shot, every link has a shot or is flagged as a gap, and there's exactly one call to action.
  - The narration in each shot fits its time when you read it aloud.
  - The product is shown and handled the way your own photos show it.
  - On-screen text matches your approved wording exactly, and the font is named.

test:
  - Search the board for the identity line. It should appear, unchanged, in every frame with the character.
  - Read the narration aloud with a timer. Each shot's words should fit its time.
  - Take the fact line out of the script and run it again. The review should flag proof as a gap.
  - Show the board to someone who hasn't read the script. They should be able to tell the story from the shots.

improve:
  - Paste your character's identity line and reference views into "What you need" in the skill file, so every board starts from the same person.
  - If your team names shots differently, keep the five links but add your names beside them in step 2.
  - Write your font names and on-screen text rules into step 3, so text is never left to the image tool.
  - Pair it with a skill that writes ad copy from one true product fact for the narration, one that turns the board into clips, and one that adds captions in your brand font.

terms:
  - term: Storyboard
    meaning: A shot-by-shot plan of an ad, drawn or described before anything is filmed or generated.
  - term: Identity line
    meaning: One fixed description of the character, pasted word for word into every frame so they don't drift.
  - term: Reference views
    meaning: Images of the character from set angles (front, three-quarter, side, back, face, hands), used to keep them the same.
  - term: Five links
    meaning: Who it's for, what they gain, the proof, the risk removed and the next step. Each shot after the first carries one.
  - term: Continuity
    meaning: Keeping things the same from one shot to the next, such as the outfit, the light and where objects sit.
