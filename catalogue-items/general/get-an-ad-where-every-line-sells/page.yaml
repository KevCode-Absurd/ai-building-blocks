new_slug: get-an-ad-where-every-line-sells
name: "Make every line of your ad sell"
summary: "Paste your ad and product facts. You get the weak lines fixed with real facts, and your strong lines kept."
job: write-ad-copy

headline: "Make every line of your ad sell"
subhead: Paste your draft ad and your product facts. Every line gets four quick tests and the whole ad gets five checks. You get each weak line fixed with a fact you gave it, the price and guarantee added if they're missing, and a verdict.

explain: |
  Most weak ads aren't wrong. They just don't give anyone a reason to buy. A line like "a premium blend for the modern ritual" sounds fine in a meeting, but nobody would say it out loud, and any rival could print it. Often the price is missing too.

  This skill reads the draft the way an experienced editor would. Every line gets four tests in order. Would a person say it? Does it give this buyer a reason? Is the praise backed by a fact? Could a rival say it unchanged? Then the whole ad gets five checks: one promise, an opening that picks out the buyer, proof beside each claim, a full ask, and words that match the picture. It only uses facts you gave it. It never changes a claim, a price or the guarantee. If the real problem is the reason to buy, it says so instead of polishing.

when:
  - You have a draft ad that reads fine, but you doubt it would make anyone buy.
  - Your ad leans on words like "premium", "high quality" or "the best", and you want facts in their place.
  - You want an editor's pass before the brand voice and claims checks.

you_give:
  - The draft, with each part labelled (on the image, main text, headline, or script lines)
  - Your product facts, approved claims, guarantee and offer terms
  - Who the ad is for and their main doubt (optional)
  - Your voice notes and lines your brand already publishes (optional)
you_get:
  - Each line that needs a change, with the failing phrase and the test it fails
  - The full corrected text for each of those lines
  - A list of facts a line needed but you didn't give
  - A two-sentence verdict on the promise, and whether the wording or the reason to buy is the problem

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your draft underneath, with each part labelled.
  - Paste the facts it may use. It uses only these, so include the price and the guarantee wording.
  - Add one line on who the ad is for and what makes them hesitate.
  - Read the verdict first. If it says the reason to buy is the problem, rethink the ad before fixing lines.

how_it_works:
  - title: Say it
    text: Each line must be a whole sentence a person would say, clear to a stranger on its own.
  - title: So what
    text: Each line must give this buyer a reason. A count or spec only counts once it says what it does for them.
  - title: Prove it
    text: Swaps "premium", "best" or "amazing" for the amount, test or process that earns it, from your facts only.
  - title: Swap it
    text: Asks if a rival's ad could carry the line unchanged. If so, and your facts hold something only yours has, it adds that.
  - title: Checks the whole ad
    text: One promise, an opening that picks out the buyer, proof beside each claim, a full ask, and words that match the picture.
  - title: Gives a verdict
    text: Lists each change with its reason, then says whether the wording or the reason to buy is the problem.

output_shape: |
  CHANGES
  <n>. <field>
     Failing:   "<the exact phrase>"
     Fails:     <the test or check, in a few words>
     Corrected: <the full corrected text for that field>
  (usually 0 to 5 changes; most lines stay)

  MISSING
  <any fact a line needed that wasn't in your facts>

  VERDICT
  <two sentences: is there one clear promise, and is the problem
  the wording or the reason to buy>

example:
  business: sprout
  input: |
    [the skill]

    Draft (Facebook image ad):
    On image: Sprout Superfood Gummies
    Main text: 60+ potent ingredients to revive whole body vitality in
    great tasting gummies. The best way to get your greens. Shop now.
    Headline: The ultimate daily supplement

    Facts:
    - 1 pack of gummies a day: 60+ ingredients, 21 vitamins & minerals,
      6 g fiber
    - Eaten straight from the pack. No water, no mixing, no shaker.
    - 2025 study, 12 weeks, 120 adults: blood vitamin C +40.1%, folate
      +20.5%. Approved: "Clinically tested for nutrient absorption"
    - First box $29.99 with the text sign-up discount, then $49.99
      every 4 weeks. Pause or cancel any time.
    - 30-day money-back guarantee, first order only
    - Unsupported: "revive whole body vitality"

    Buyer: people who quit greens powders. Doubt: "A gummy can't hold
    enough to replace my powder."
  output: |
    CHANGES
    1. On image
       Failing:   "Sprout Superfood Gummies"
       Fails:     the opening, it names the product but gives no reason
       Corrected: Your daily greens, without the shaker

    2. Main text, first sentence
       Failing:   "60+ potent ingredients to revive whole body vitality
                  in great tasting gummies."
       Fails:     prove it, praise words with no fact behind them
       Corrected: One pack of gummies a day gives you 60+ ingredients,
                  21 vitamins and minerals, and 6 g of fiber.

    3. Main text, second sentence
       Failing:   "The best way to get your greens."
       Fails:     swap it, any greens brand could say this
       Corrected: It's clinically tested for nutrient absorption. In a
                  12-week study of 120 adults, blood vitamin C went up
                  40.1% and folate 20.5%.

    4. Main text, the ask
       Failing:   "Shop now."
       Fails:     the ask, no price, no guarantee, nothing about what
                  happens next
       Corrected: Your first box is $29.99 with our text sign-up
                  discount, then $49.99 every 4 weeks, and you can pause
                  or cancel any time. Your first order has a 30-day
                  money-back guarantee.

    5. Headline
       Failing:   "The ultimate daily supplement"
       Fails:     so what, a superlative that gives no reason to read on
       Corrected: 21 vitamins and minerals, no shaker

    MISSING
    A taste fact. "Great tasting" went out with sentence 1, because
    nothing in the facts backs it.

    VERDICT
    The draft had no promise and no price. Now it promises one thing
    (your greens without the shaker), answers "can a gummy hold
    enough?" with the study, and says what it costs. The reason to buy
    is fine; the wording was the problem. Send "revive whole body
    vitality" to your claims check before it appears anywhere else.

tweaks:
  - what: The facts list
    how: Every fix for a vague word comes from here. A short list gets you more MISSING notes and plainer lines. A full list with amounts, tests and terms gets you specific ones.
  - what: The buyer line
    how: Say how aware the buyer is. For a stranger, the opening check pushes toward their situation. For someone who knows you, toward their doubt and the offer.
  - what: Which parts to check
    how: Paste only the headline if that's all you want checked. It leaves the rest alone.
  - what: Your brand's own lines
    how: Paste lines you already publish. It won't rewrite a plain brand line just because it could be more specific.

judge:
  - You can point to the one sentence that says what the buyer gets.
  - No price, claim, guarantee wording or product name changed. Compare them side by side.
  - Every new fact in a corrected line is in the facts you gave it.
  - Most of your lines were left alone. Zero to five changes is normal for a decent draft.
  - The ask says what to do, what it costs and what happens if they don't like it.

test:
  - Run it on an ad you know sold well. It should leave most lines alone. If it rewrites a line people answered to, paste that line as a brand line next time.
  - Run the same draft twice. The changes should land on the same lines. If they move, your facts list is thin, so add amounts, tests and terms.
  - Put "premium" in a line where your facts hold the number behind it. It should swap the word for that number, not for another adjective.
  - Show its version and your current best, with the same picture, to someone who'd buy. Ask which one they'd tap, without saying which is new.
  - Read the MISSING list. Every gap should be a fact you lack, not one you gave it.

improve:
  - Paste your full facts list (amounts, tests, price, guarantee terms) into "What you need" in the skill file, so the prove-it test always has real numbers.
  - Add the claims your brand must never make, in your own words (for example "never say fix"), to the same section.
  - If you write for one platform, add its limits to the opening check, for example "main text before See more under 125 characters".
  - When the same MISSING fact comes up twice, find it and add it to your brand file.
  - Pair it with "Turn features into reasons to buy" when the draft is a feature list, then finish with "Make every ad sound like your brand" and "Know if your copy is ready to publish".

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Testing lines against a facts list works well in any strong chat AI with this skill."}
    - {name: "Meta Ads Manager", why: "Its ad preview shows where your main text gets cut at See more, so you can check the opening."}
  inputs:
    - "Your claims list with the source of each claim, so the prove-it test only swaps in facts you can back"
    - "Two or three lines from your best past ads, so it leaves your proven phrasing alone"
    - "A screenshot of the image, so it can check the words agree with the picture"
    - "Your buyers' main doubt in their own words from a review, so the opening and proof aim at it"

terms:
  - term: The ask
    meaning: The part of the ad that tells the buyer what to do next, such as "Pick your size".
  - term: Swap test
    meaning: Asking whether a rival's ad could carry the same line unchanged. If it could, the line says nothing about yours.
  - term: Main text
    meaning: The words above the image in a Facebook or Instagram ad.
