new_slug: get-an-offer-that-answers-your-buyers-doubt
name: Get an offer that answers your buyer's doubt
summary: An offer built around what stops one buyer saying yes, with terms, wording and a profit check.
job: make-offer

headline: "An offer that removes your buyer's biggest doubt"
subhead: Give it one buyer and their biggest doubt, your prices and costs, and your guarantee. It picks a kind of offer (a new angle, a bundle, a gift, a spend reward or, rarely, a discount), writes the terms and wording, checks the profit and tests it against seven common mistakes.

explain: |
  When sales slow down, most businesses reach for a discount. A discount touches only one part of an offer, the price, and often teaches buyers to wait for the next sale. It also does nothing about the reason this buyer is hesitating, such as not trusting the subscription.

  This skill starts from one buyer and the doubt that holds them back, in their own words. Every offer has five parts (who it's for and why now, the price, what's added, what removes the risk, a real reason to act now), and it builds those parts to answer that doubt. It picks one kind of offer, works out what an order keeps after costs, and checks the result against seven failures, such as a spend level set at the average order or a gift nobody wants. Unknown costs become a formula, never an invented number.

when:
  - You're about to run a discount and want to check there isn't a better offer.
  - You know what stops people buying (price, trust, "will it work for me") and want an offer that answers it.
  - You want different offers for new buyers and returning buyers.

you_give:
  - One buyer and their main doubt, in their own words
  - What you sell, the price, what each unit costs you, and delivery cost
  - Your guarantee and terms, quoted exactly
  - Recent order values, items per order, repeat buying and past discounts (optional)
  - Your voice and current offers with dates (optional)
you_get:
  - Up to three offers, one per kind that fits, each with its five parts
  - The line for the page, the line a person would say aloud, and the terms
  - A profit check, or the formula when a cost is missing
  - What you must arrange first, which mistakes it avoids, and a test plan

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Name one buyer and their biggest doubt, using real customer words if you have them.
  - Paste your prices, unit costs, delivery costs and guarantee exactly as written.
  - Add recent order data if you have it. It's what lets the profit check give numbers instead of formulas.
  - Pick one offer and test it on its own page beside your current offer. Keep the current one until the new one beats it.

how_it_works:
  - title: Defines the five parts
    text: Who it's for and why now, the price, what's added, what removes the risk, a real reason to act now. Each is written or marked "none".
  - title: Starts from the buyer
    text: Names one buyer and their biggest doubt, restates the product as the answer, and keeps new and returning buyers apart.
  - title: Picks one kind of offer
    text: A new angle (costs no margin), a bundle, a gift with purchase, spend more get more, or a rare straight discount.
  - title: Adds only what answers the doubt
    text: A risk remover, a real reason to act now, a reward for staying or a free extra. Two to four parts, then it stops.
  - title: Checks the numbers
    text: What an order keeps after the cost of every unit at full price, delivery and fees, and how many extra items a discount needs to hold today's profit.
  - title: Reads the order shape
    text: Sets spend levels just above where orders cluster, never at the average.
  - title: Runs seven checks
    text: Discount with no reason, margin worked out wrong, one offer for new and returning buyers, threshold at the average, wrong gift, a promotion every week, ignoring a slow season.
  - title: Words it
    text: A two-to-four-word name, a page line, a spoken line and why it answers the doubt. The saving is stated once, as money or a share, never both.

output_shape: |
  OFFER <n>: <name, 2 to 4 words>
  Buyer and doubt: <who> / "<doubt in their words>"
  Kind:            <new angle | bundle | gift | spend more get more |
                   discount>
  Five parts:      who and why now <...> | price <...> | added <...> |
                   risk removed <...> | reason to act now <... or none>
  Page line:       "<...>"
  Said aloud:      "<...>"
  Terms:           <one or two sentences; a first-order price says what
                   it becomes after>
  Profit check:    <kept per order, or MISSING: cost + the formula>
  Must arrange:    <...>
  Avoids:          <which of the seven failures>
  Why it answers the doubt: <...>

  TEST PLAN
  <run beside the current offer; after 90 to 120 days ask buyers which
  part made them buy>

example:
  business: sprout
  input: |
    [the skill]

    Buyer: the price doubter. Knows the brand, thinks it costs too
    much. Doubts: "Which discount is real?" "Will the price jump after
    the first order?" "I hate subscriptions because I feel like they
    are a trap."

    Prices: one-time 28 packs $66.65. Subscription $49.99 every 4
    weeks. First order $29.99, only with the text sign-up discount.
    Live on the site at once: "Save 52%", "up to 55% off", "49% off",
    "58%"; ads say "61% off". "Buy 2 Save $5" for more than one
    person on an order. Merch: tote $36.99.
    Terms: "Pause Or Cancel Any Time." Guarantee: 30-day money-back,
    "This policy applies only to your initial purchase."
    Cost per pouch, delivery cost, fees: not known.
  output: |
    OFFER 1: One price, said once
    Buyer and doubt: price doubter / "Which discount is real?"
    Kind:         new angle (same product, price and terms)
    Five parts:   who: people who saw four different discounts | price:
                  $29.99 first box with text sign-up, then $49.99 |
                  added: none | risk: 30-day money-back on the first
                  order | reason now: none
    Page line:    "$29.99 for your first box when you sign up by text.
                  Then $49.99 every 4 weeks. Pause or cancel any time."
    Said aloud:   "First box is thirty bucks if you sign up by text,
                  then it's fifty every four weeks."
    Profit check: none needed. It costs no margin.
    Must arrange: remove the other discount numbers from the bar,
                  badge, pop-up and ads, so one figure shows everywhere
    Avoids:       a promotion every week (six figures live at once)
    Why: the doubt is about trust in the number, and one number with
    its renewal in the same sentence answers it.

    OFFER 2: A tote with box two
    Buyer and doubt: price doubter / "Will the price jump after the
                  first order?"
    Kind:         gift with purchase, on the second box
    Five parts:   who: new subscribers deciding whether to stay | price:
                  $49.99, stated up front | added: the Sprout tote
                  ($36.99 on our site) | risk: pause or cancel any time
                  | reason now: none
    Page line:    "Your second box comes with our tote ($36.99 on our
                  site). Same $49.99 we showed you on day one."
    Profit check: MISSING: cost of a tote and of a pouch, delivery.
                  Kept on box two = $49.99 - pouch cost - tote cost
                  - delivery - fees
    Must arrange: tote stock, how many exist, sold-out wording
    Avoids:       blank discount; calling a gift a discount
    Why: it rewards staying instead of hiding the jump.

    OFFER 3: Not offered yet
    A third kind (a bundle or a spend level) needs your order values
    and costs. MISSING: last 90 days of order values, items per
    order, cost per pouch, delivery for 1, 2 and 3 pouches.

    TEST PLAN
    Run offer 1 on its own page beside today's page, which stays live
    until something beats it. After 90 to 120 days, ask buyers which
    part made them buy and drop what nobody names.

tweaks:
  - what: The buyer
    how: Change the buyer and the offer changes. A buyer who doubts it works gets a risk remover; a buyer who thinks it's too dear gets more for the money; a returning buyer gets a reason to stay.
  - what: Order data
    how: Paste your last 90 days of order values and items per order. Spend levels are then set just above where orders cluster, and the profit check gives real numbers.
  - what: One product or many
    how: With one main product, it tries winning new buyers, then a gift, then a rare discount. With many products, it looks at bundles, add-ons from other categories and spend levels.
  - what: After the main offer
    how: Ask for "cart and checkout offers" and it adds one add-on per slot (cart, checkout, after payment, on leaving), judged by added profit per order, not by how many people take it.

judge:
  - Each offer names one buyer and answers a doubt from your research, in their words.
  - The guarantee is quoted exactly. Anything longer or wider is listed under "must arrange".
  - No urgency appears without a real date or limit.
  - A first-order price states what it becomes after, in the same sentence.
  - Unknown costs show as a formula with MISSING, not as made-up numbers.
  - No offer says the product treats, cures or prevents anything.

test:
  - Run it for a buyer you've already won with an offer that worked. Its offer should answer the same doubt. If not, check the doubt you gave it.
  - Fill in your real costs and check its profit sum with a calculator.
  - Run it twice for the same buyer. It should pick the same kind of offer both times.
  - Read the wording to someone who fits the buyer. Ask what they'd pay today and when the price changes. If they can't tell you, the terms aren't clear yet.

improve:
  - "Write your real costs into step 5 of the skill file: cost per unit, and delivery for one, two and three items. Every formula then becomes a number."
  - "Add your guarantee, word for word, to step 4 (for Sprout: 30-day money-back, first order only), so no offer stretches it."
  - Add your buyers and their doubts to step 2, copied from your brand file.
  - Add a lesson from your own history to the seven checks, such as "no new discount number while three are already live".
  - Pair it with the skill that lists offers from what you already have for a quick list, then use this one to build out the best.

terms:
  - term: Margin
    meaning: What you keep from a sale after the cost of making and sending the product.
  - term: Spend level
    meaning: An order amount at which a reward kicks in, such as a gift on orders over a set amount.
  - term: Risk remover
    meaning: Anything that makes saying yes safe, such as a money-back guarantee or a way to cancel.
