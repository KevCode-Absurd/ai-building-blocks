new_slug: get-believed-with-a-text-someone-else-sent
name: "A text-message picture where someone close spots the problem"
summary: "Give it your story ad. You get two to five short texts that end unanswered, and a screenshot prompt."
job: make-image-ads

headline: "A text-message picture where someone close spots the problem"
subhead: Give it your story ad. It casts the partner, sister or friend who noticed, writes two to five short texts that end on an unanswered question, and briefs a plain screenshot with no real app's look.

explain: |
  A problem someone else points out is harder to wave away. "It's been open since January" from a partner says more than any line the brand could write. And people read a text thread in a feed before they've decided to.

  This skill casts the other person as the one who notices: the push seen from outside, or a habit they question. The narrator admits, dodges or jokes, and the thread ends open, so the story has to answer it. Messages stay under about 12 words, so the whole thread reads in one look on a phone. The screen uses plain bubbles in neutral tones, a first name or an initial, and no real app's colours, ticks or contact photos. It suggests typing the messages into a design tool, so every word stays exact.

when:
  - Your story has a partner, relative or friend who noticed the problem or the workaround.
  - Your story quotes a text exchange, or could without adding a fact.
  - You want a picture with words that still reads like a normal post.

you_give:
  - Your approved story ad, with the second person and what they noticed
  - How your buyer texts, if you know (optional)
you_get:
  - Who the other person is and what they noticed
  - Two to five messages in order, with who sent each
  - A blank version and the line under the picture
  - A 60 to 120 word image prompt, and how to make it exact

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad. If it quotes the texts, those exact words are used.
  - Type the messages into plain bubbles in a design tool, or paste the prompt into your image tool.
  - Read every message in the result letter by letter. One wrong letter looks fake.
  - Read the flags. Any message written for the image needs a second look before it runs.

how_it_works:
  - title: Sets the house rules
    text: Square, a plain screenshot, no logo, price, product or real app look, no notification banners or unread counts.
  - title: Casts the other person
    text: Who they are to the narrator, with a made-up first name or an initial.
  - title: Finds what they noticed
    text: The bad moment seen from outside, or a habit they question, in your story's words.
  - title: Keeps it short
    text: Two to five messages, each under about 12 words, so it reads in one look.
  - title: Ends it open
    text: A last question nobody answered, so your story's first line has something to pick up.

output_shape: |
  SCENE             <what someone scrolling would say they saw>
  WHO AND WHEN      <the other person, name or initial, time on screen>
  WHAT THEY NOTICED <one line, and where in the story>
  MESSAGES          <sender>: "<text>", in order
  BLANK VERSION     <the screen with empty bubbles>
  LINE UNDER IMAGE  <words> (<which line>, <characters>)
  FLAGS             <words written for the image, anything inferred>
  IMAGE PROMPT      <60 to 120 words, every message in quotes once>
  HOW TO MAKE IT    <design tool or image tool>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved; narrator: a customer who agreed, built on
    reviews 1 and 3, example only):
    In March my partner Sam texted me from the kitchen:
      sam: is the green tub in the cupboard still yours
      me: technically, yes. it's mine
      sam: it's been open since january
      me: i drank it twice. it was gritty
      sam: so are you keeping it or what
    I didn't answer. I'd tried a few green powders over the years.
    The issue was never what was in them. It was sticking with it.
    Sprout is one daily pack of gummies: tear the top, eat them. 60+
    ingredients, 21 vitamins and minerals, 6 g prebiotic fiber. No
    water, no shaker.

    Buyer: the quitter who wants to stick, 28 to 45.
  output: |
    SCENE             A text thread where someone asks if the green
                      tub in the cupboard is still theirs.
    WHO AND WHEN      The narrator's partner, "Sam". 7:42 pm.
    WHAT THEY NOTICED The tub open since January and barely used
                      (story, the thread).
    MESSAGES          Sam: "is the green tub in the cupboard still yours"
                      Me: "technically, yes. it's mine"
                      Sam: "it's been open since january"
                      Me: "i drank it twice. it was gritty"
                      Sam: "so are you keeping it or what"
    BLANK VERSION     The same screen, five empty bubbles in the same
                      places.
    LINE UNDER IMAGE  Keeping the green tub? (a question about the
                      thing, 22)
    FLAGS             All five messages are the story's own words. Sam
                      is a made-up name. The thread ends on Sam's
                      question, unanswered, as the story does. Nothing
                      names the product or a rival.
    IMAGE PROMPT      Square 1:1 plain phone screenshot of a text
                      conversation, slightly cropped at the top. A thin
                      top bar shows only the name "Sam" and a blank
                      grey circle. Time stamp "7:42 pm". Plain light
                      grey bubbles on the left for Sam, plain white
                      bubbles with a thin grey edge on the right for me,
                      in this order: Sam
                      "is the green tub in the cupboard still yours",
                      me "technically, yes. it's mine", Sam "it's been
                      open since january", me "i drank it twice. it was
                      gritty", Sam "so are you keeping it or what". No
                      app name, no logo, no ticks, no contact photo, no
                      notification banner.
    HOW TO MAKE IT    Type the five messages into plain bubbles in a
                      design tool and export a square image.

tweaks:
  - what: Who notices
    how: Name the person in your story who'd really say it, a partner, a sister, a flatmate or a coworker. The closer they are, the more the text stings.
  - what: How it ends
    how: Ask for "ends on the narrator's reply" if your story's first line answers that reply instead of a question.
  - what: How they text
    how: Tell it if your buyers write in full sentences or with capitals. Lower case suits younger buyers, not everyone.
  - what: Fewer messages
    how: Ask for two or three when your buyers scroll fast. One sharp question and one reply can be enough.

judge:
  - The other person notices the problem. Neither person sells.
  - It's two to five messages, each readable on a phone without zooming.
  - The thread ends open, and your story's first line picks it up.
  - Every message is from your story, or flagged as written for the image.
  - The screen looks like no real app, with no face as a contact photo.

test:
  - Give it a story that quotes a thread. The messages should match word for word, in order.
  - Give it a story with no second person. It should send you to the phone note or the snapshot.
  - Look at the finished picture at arm's length on your phone. If you can't read it, ask for fewer messages.
  - Run it against a snapshot of the same moment. Keep whichever brings more readers to the offer.

improve:
  - Add how your buyers text (lower case, emoji or not, long or short) to your brand file.
  - Quote the thread in your story word for word. Then the picture copies the story and needs no extra check.
  - Keep one bubble style for all your thread ads, built once in your design tool.
  - Pair it with a story ad skill, so the first line answers the unanswered message.

works_best_with:
  tools:
    - {name: "Figma", why: "You type each message into plain bubbles yourself, so every word is exact and the look copies no app."}
    - {name: "Nano Banana Pro", why: "Google recommends its Gemini 3 Pro Image model for accurate text, if you'd rather generate the screenshot."}
    - {name: "Any good chat AI", why: "Writing short, true-sounding texts from a story is something Claude, ChatGPT and Gemini all do well."}
  inputs:
    - "Real texts your customers have shared about the problem, with permission, so the thread sounds like them"
    - "Your buyer's age range and how they text, so the case, length and slang fit"
    - "A blank bubble layout you've built once, so every thread ad looks the same and needs only new words"

terms:
  - term: Thread
    meaning: A run of text messages between two people, shown as a screenshot.
  - term: Blank version
    meaning: The same picture with empty bubbles, so you can change the words later.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
