new_slug: get-comic-page-ad-script-that-sells
name: "Tell your buyer's story in comic panels that sell"
summary: "Give it your selling idea. You get a panel-by-panel comic ad script for vertical video, ending on your real product."
job: make-video-ads

headline: "Tell your buyer's story in comic panels that sell"
subhead: Give it your selling idea and product facts. It picks one claim, shapes the story in four movements, and writes a panel list with a named cut into each panel, short captions, a closing photo of your real product and a note on who carries the ad.

explain: |
  Comics suit phones. One panel at a time, with the story jumping forward in the gap between panels, where the reader fills in what happened. Most comic ads still fall apart. Too many tiny panels, captions nobody can read, and a drawn "customer" saying the product changed their life, which is a claim you can't back.

  This skill writes a comic ad around one claim. The story moves in four steps taken from four-panel comic strips: set the buyer's moment, let it get harder, turn it with your product, then land in the same place, changed. Every panel fills the screen and every cut is named for what it does, such as the next step of an action or one moment slowed down for the reveal. The hero is drawn simple so viewers see themselves in them, and your product is drawn from its photo with no letters. Captions and narration are short enough to add in editing, and the last panel is your real product photo.

when:
  - Your product fixes an everyday problem you can tell in a few panels.
  - You want a vertical video ad that looks handmade and still makes one clear point.
  - You want a script your video tool can follow panel by panel, with a hero who never changes.

you_give:
  - The selling idea, or a script you already have
  - Your product facts, how it's used, and how it works
  - Your approved claims, banned claims and current offer
  - The length and your lettering typeface (optional)
you_get:
  - The one claim the comic acts out, with its source
  - A hero line and palette to reuse in every prompt
  - A panel list with movement, cut, motion, caption, narration and seconds
  - A cast note on who carries the ad, ready for the shots skill

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, approved claims and offer underneath.
  - Say who the buyer is and the moment the problem bites, in a sentence.
  - Say the length, such as "30 seconds".
  - Cover the captions and read only the drawings. If you can't tell what changed, ask for a clearer turn panel.
  - Take the panel list and cast note to "Turn your comic ad script into video clips". It takes it from there, with the avatar, sheets, storyboard and clips.

how_it_works:
  - title: Checks a comic fits
    text: Comics suit a short problem story or a drawable look inside your product. It says so if your ad needs a real face or a long offer.
  - title: Picks one claim
    text: Every panel builds toward it. A second claim becomes a second ad.
  - title: Moves in four steps
    text: Set the moment, let it grow harder, turn it with your product, then land in the same place, changed.
  - title: Names every cut
    text: The next step of an action, a new subject, a jump in time, or one slowed moment for the reveal, which stays on screen longest.
  - title: Keeps the hero simple
    text: A few clear features in the same words every time. The product is drawn from its photo, brightest in its panels, with no letters.
  - title: Writes words for editing
    text: Captions of 6 words or fewer and narration of 10 or fewer per panel, added in editing, then a photo panel of your real product.
  - title: Writes the cast note
    text: Who carries the ad, why that suits your buyer, the narrator's voice and what must never change about the hero.

output_shape: |
  FIT     <why a comic suits this, or what to use instead>
  CLAIM   <the one claim, and its source>
  HERO    <simple features, same words every time>
  PALETTE <black plus 3 or 4 flat colours; the product is brightest>

  Panel | movement | transition in | what's drawn | motion | caption | narration | s
  1 | set | opens | <who, where, one large thing> | <layers / one part / pan> | <6 words or fewer> | "<10 words or fewer>" | <n>
  ...
  <last> | land | subject to subject | PHOTO PANEL (set in editing) | none | <offer> | none | <n>

  NOTES   <buyer words used, claims left out, MISSING>
  CAST NOTE  <who carries it, why, voice, what never changes>

example:
  business: sprout
  input: |
    [the skill]

    Idea: quitting greens powder because the routine is a chore.
    Buyer: 28 to 45, office job, has quit powders. Their words: "I've
    been choking on [a big-name greens powder] for the last few years",
    "not having to clean a shaker bottle".
    Product: Sprout daily greens gummies. One daily pack, torn straight
    across the top, gummies tipped into a palm. No water, no mixing,
    no shaker. Pouch: glossy deep green, yellow wordmark.
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
    in 1 pack.
    Visible result: none, it's a daily supplement.
    Offer: $29.99 first order with text sign-up, renews at $49.99 every
    4 weeks. 30-day money-back, first order only.
    Brand line: "Rip. Tip. Enjoy."
    Video, 30 seconds.
  output: |
    FIT     A routine problem told as a short story, with a drawable
            look inside the pack. A comic fits. Nothing visible, so
            the land panels show a changed morning, not a result.
    CLAIM   "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
            in 1 pack (label).
    HERO    an adult woman, round simple face, dark ponytail, navy
            blazer over a white top, small gold hoop earrings.
    PALETTE black, cream, sky blue, warm grey, and the pack's deep
            green, which only the product wears.

    1 | set | opens | the hero at the counter, a glass of green
        sludge raised, a sweat drop by her eye | the glass layer
        drifts forward | CHOKING ON POWDER AGAIN | "Every morning,
        the same chalky glass." | 4
    2 | grow | action to action | same angle, the shaker dropped in
        the sink, the tub shoved to the back of the shelf | one drip
        from the tap | THE SHAKER WINS AGAIN | "Then the shaker sits
        in the sink." | 4
    3 | turn | subject to subject | a clean cutaway of one daily
        pack, small green bears inside | pan down the tall panel |
        60+ INGREDIENTS / 6G FIBER | "So the whole lot went in one
        pack." | 5
    4 | turn | moment to moment | close on her hands tearing the pack
        straight across the top, bears tipping into her palm | the
        tear, slowed | RIP. TIP. ENJOY. | "One small handful a day."
        | 6
    5 | land | action to action | the counter clear, she eats from
        her palm | three flat layers drift apart | NO SHAKER TO WASH |
        "Same kitchen. Nothing to rinse." | 4
    6 | land | scene to scene | outside, she walks down a sunny
        street, keys swinging | the keys swing | - | - | 3
    7 | land | subject to subject | PHOTO PANEL: the real pouch photo
        in the same border, set in editing | none | $29.99 first
        order with text sign-up. Renews at $49.99 every 4 weeks. |
        none | 4

    30 seconds, 31 spoken words. Panel 4 is the reveal, so it's
    longest.

    NOTES
    - Caption 1 uses the buyer's own word "choking" (review 4).
    - Cutaway labels come from the one claim. "21 vitamins &
      minerals" isn't a caption, because cutting it to fit would
      change the fact.
    - No drawn person reports a result. The land panels show the
      routine changing, nothing about her body.
    - The guarantee needs its "first order only" limit, so it goes
      in the feed text, not the comic.
    - MISSING: a photo of a single daily pack, so the drawn sachet
      matches the real one.

    CAST NOTE  The drawn hero carries it, silent, with a narrator over
    the panels. A simple face lets the powder quitter see themselves
    in her, and a narrator keeps the claim out of a drawn mouth.
    Narrator: a dry, friendly adult voice, quick. Never change: the
    dark ponytail, the navy blazer, the gold hoops.

tweaks:
  - what: Want a still instead?
    how: Use "Sell one claim with a comic strip ad", which makes one 3 or 4 panel image ad in this same look.
  - what: The number of panels
    how: Five drawn panels make a quick 20-second cut. Up to eight make a fuller story. The reveal panel always stays longest.
  - what: The turn
    how: Ask for a cutaway in the turn if buyers doubt what's inside. Leave it out if the point is the routine, not the contents.
  - what: The palette
    how: Give your brand colours. The comic keeps black plus 3 or 4 flat colours, and your product stays the brightest thing.

judge:
  - Cover the captions. Can you still tell what was wrong and what changed?
  - Only one claim appears anywhere, including the cutaway labels.
  - Every panel has a named cut, and the reveal panel is the longest.
  - No drawn person says the product worked for them, and none is an expert or a child.
  - The ad ends on a photo panel of your real product, not a drawing of it.

test:
  - Give it two claims at once. It should pick one and tell you the second is a second ad.
  - Read the transition column. Most cuts should be "action to action" or "subject to subject", with one slowed reveal.
  - Run it twice on the same input. Both versions should keep the hero line word for word and every caption at 6 words or fewer.
  - Read only the drawn column to someone and ask what the product does. If they can't say, the turn panel is doing too little.

improve:
  - Paste a few buyer phrases from your reviews into "What you need" in the skill file, so the captions use their words instead of ad lines.
  - Write your hero line and palette into step 5, so every comic ad in a series looks the same.
  - Add how your product works, with a source, to your brand file. Without it, step 7 drops the cutaway.
  - Pair it with "Turn your comic ad script into video clips", which runs the avatar, sheets, storyboard and clips.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "The panel list is plain writing, so Claude, ChatGPT or Gemini all handle it well when you paste the skill."}
    - {name: "Canva", why: "Sets captions as real text and places your product photo as the last panel, so no lettering is left to the AI."}
  inputs:
    - "Five to ten buyer phrases from reviews about the old routine, so the captions sound like them"
    - "A photo of the product out of its pack and in a hand, so the drawn product matches its real size"
    - "Your never-show list, so no panel draws something your brand avoids"
    - "A note on where your ad will run (Reels, Stories, TikTok), so captions sit clear of the app's buttons"

terms:
  - term: Gutter
    meaning: The gap between comic panels, where the reader fills in what happened.
  - term: Panel transition
    meaning: What changes between two panels, such as the next step of an action or a jump in time.
  - term: Photo panel
    meaning: Your real product photo framed like a comic panel, added in editing.
  - term: Cutaway
    meaning: A drawing of something with part removed, so you can see inside.
