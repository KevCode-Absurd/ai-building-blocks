new_slug: get-doubters-reading-with-a-dont-buy-warning
name: "A \"don't buy\" warning that gets doubters reading"
summary: "Give it your story ad and the reason. You get a short, hand-made warning and a photo prompt."
job: make-image-ads

headline: "A \"don't buy\" warning that gets doubters reading"
subhead: Give it your story ad, the kind of product that failed and why. It writes the advice your narrator would give a friend in three to nine words, props it against the old thing, and leaves the reason to your story.

explain: |
  Buyers who were let down before expect the next thing to be the same. An ad that tells them not to buy is the last thing they expect, and ads that admit a downside tend to be believed more than ads that only praise. So doubters read on to find out why.

  This skill finds the advice your narrator would give a friend about the kind of product that failed them. It's either a stop ("Don't buy another tub of greens") or a check ("Check the seam first"). It keeps it to three to nine words on a hand-made card, propped against a generic version of the old thing with its labels turned away. It never names a rival, never looks like an official notice, and never puts the reason on the card. The reason belongs in the story, which is why people read it.

when:
  - Your buyers tried things before and were let down.
  - Your story warns against a kind of product, or a habit, and says why.
  - You can back the claim your story uses to answer the warning.

you_give:
  - Your approved story ad and the advice it gives
  - The kind of product that failed, in your buyers' words
  - Why it failed, and the claim that answers it, with sources
you_get:
  - The advice as a stop or a check, and where it comes from
  - Three to nine words, exactly as they'll appear on the card
  - The card, the old thing it leans on, and a blank version
  - A 60 to 120 word image prompt and the line under the picture

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad, then the kind that failed and why, with the claim that answers it.
  - Write the card yourself and photograph it, or paste the prompt into your image tool.
  - Read the card in the result letter by letter.
  - Check the old thing in the frame looks like no rival's product.

how_it_works:
  - title: Sets the house rules
    text: Square, looks taken on a phone, no logo, price, button or brand colour, no person and no product unless asked.
  - title: Finds the advice
    text: A stop or a check, the way your narrator would warn a friend about this kind of product.
  - title: Writes it short
    text: Three to nine words, aimed at the kind of product, never the reason and never your product's name.
  - title: Tests the reason
    text: It's in your story, you can back the answer, and it scares nobody about health or safety.
  - title: Props it up
    text: A hand-made card against the generic old thing, labels turned away, where your buyer would find it.

output_shape: |
  SCENE             <what someone scrolling would say they saw>
  WHERE AND WHEN    <place, time, light, camera spot>
  THE ADVICE        <stop | check>, <where in the story>
  THE REASON        <one line, its source, the claim that answers it>
  THE FORM          <card | envelope | taped note>, <pen>
  THE OLD WAY       <the generic object, labels turned away>
  WORDS ON IMAGE    "<words>" (<word count>)
  BLANK VERSION     <the same scene with the card blank>
  LINE UNDER IMAGE  <words> (<which line>, <characters>)
  FLAGS             <words written for the image, claims to keep in the story>
  IMAGE PROMPT      <60 to 120 words, the words in quotes once>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved; narrator: a customer who agreed, built on
    reviews 1 and 3, example only):
    I paid $94 a month for a greens powder, even with the
    subscription discount, and the drink was gritty and chalky.
    My advice: don't buy another tub of greens.
    The issue was never what was in it. It was sticking with it.
    Sprout is one daily pack of gummies: 60+ ingredients, 21 vitamins
    and minerals, 6 g prebiotic fiber. No water, no shaker. 30-day
    money-back guarantee on your first order.

    The kind that failed: greens powder (a big-name powder, don't
    name it).
    Reason: review 3 ("gritty/chalky", "$94 a month"), review 1
    ("an issue of consistency").
    Answering claim: "60+ ingredients, 21 vitamins & minerals, and
    6g fiber" in 1 pack (label).
  output: |
    SCENE             A handwritten card that says not to buy another
                      tub of greens, propped against a half-used tub.
    WHERE AND WHEN    A kitchen counter by the sink, morning, window
                      light. Camera: standing at the counter, looking
                      down a little.
    THE ADVICE        A stop (story, line 2), kept close to its words.
    THE REASON        Gritty and hard to keep up (reviews 1 and 3).
                      Answered by one daily pack, no water, no shaker,
                      with the label claim. For the record only.
    THE FORM          A plain white index card, black marker.
    THE OLD WAY       A plain white powder tub, lid off, about a third
                      full, label turned to the wall. A plastic shaker
                      with a green film inside.
    WORDS ON IMAGE    "Don't buy another tub of greens." (6 words)
    BLANK VERSION     The same counter with the card blank.
    LINE UNDER IMAGE  definitely gritty/chalky (the buyer's own line,
                      24)
    FLAGS             Card words are the story's own. The line under
                      the image is from review 3: keep the customer's
                      permission on file. Name no rival anywhere. Keep
                      "first order only" beside the guarantee in the
                      story.
    IMAGE PROMPT      Square 1:1 phone photo of a kitchen counter by
                      the sink in morning window light, looking down a
                      little. A plain white index card leans against a
                      plain white powder tub with its lid off, about a
                      third full of green powder, label turned to the
                      wall. On the card, in black marker handwriting,
                      spelled exactly: "Don't buy another tub of
                      greens." Beside it, a plastic shaker with a green
                      film inside. A tea towel and a sponge at the
                      edge. Slight tilt, a little grain, unstyled. No
                      logo, no readable label, no brand name, no
                      person, no product.

tweaks:
  - what: Stop or check
    how: Ask for a check when your story says what the reader can look for, such as "Check the seam first". It gives doubters something to do, not just something to avoid.
  - what: The form
    how: Ask for a note taped to the old thing's box, or the back of an envelope, if that suits your buyer better than a card.
  - what: Write it yourself
    how: Use the brief as a shot list. A real card in your own handwriting, propped on a real counter, needs no checking.
  - what: Words off
    how: Switching words off removes the warning. It sends you to the old-things photo instead.

judge:
  - The card warns against a kind of product or a habit, never a named rival.
  - It's three to nine words, and the reason is left to your story.
  - It looks like one person's advice, with no official notice or hazard look.
  - Nothing scares the reader about health or safety.
  - The old thing in the frame is generic, with its label turned away.

test:
  - Give it a story where the reason has no source. It should stop and say what's missing.
  - Give it a story that names a rival brand. The card and the photo should show only the kind.
  - Show the picture to a buyer who was let down before. If they ask "why not?", it's working.
  - Run a stop against a check on the same story. Keep whichever brings more readers to the offer.

improve:
  - Add what your buyers tried before and why it failed, in their words, to your brand file.
  - Keep a source beside every claim the story uses to answer the warning.
  - Add the checks a buyer can do themselves (a seam, a weight, a label) to step 2, so it can offer a check.
  - Pair it with a story ad skill, so the first lines give the reason the card holds back.

works_best_with:
  tools:
    - {name: "Your phone camera and a marker", why: "A card you write and prop up yourself looks real because it is, and nothing needs checking."}
    - {name: "Nano Banana Pro", why: "Google recommends its Gemini 3 Pro Image model for accurate text, so a generated card is more likely to be spelled right."}
    - {name: "Any good chat AI", why: "Turning a story into one line of advice is close reading, which Claude, ChatGPT and Gemini all do well."}
  inputs:
    - "Complaints from reviews about the kind of product your buyers used before, so the warning names a real letdown"
    - "One thing buyers can check for themselves before they buy, so the card can offer a check"
    - "A photo of the generic old thing as buyers keep it, so the prop looks right"

terms:
  - term: Stop
    meaning: Advice not to repeat a habit, such as buying the same kind of thing again.
  - term: Check
    meaning: Advice to look at one thing before buying again.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
