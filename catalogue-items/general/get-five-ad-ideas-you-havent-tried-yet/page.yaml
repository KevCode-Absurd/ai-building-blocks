new_slug: get-five-ad-ideas-you-havent-tried-yet
name: Get five ad ideas you haven't tried yet
summary: A map of what your ads have and haven't tried, plus five new ideas for the biggest gaps.
job: plan-ad-tests

headline: Get five new ad ideas aimed at what your ads have never tried
subhead: Give it your past ads (an account export, an ad library page or just your own list) and your brand file. It maps what has run against what hasn't, ranks the biggest gaps, and writes five ideas that each fill one gap with your real claims and offers.

explain: |
  When ads stop working, most teams make more of the same: a new colour, a new headline, the same opening shot. The account fills up with near-copies while whole lanes stay empty, such as a buyer nobody has spoken to, a reason to buy nobody has led with, or a product that never got an ad.

  This skill takes stock first. It sorts your past ads by reason to buy, kind of opening line, how much the buyer already knows, format and product, and marks each as measured, reported or never run. Then it checks ten motives, nine kinds of opening, five buyer knowledge levels and your competitors' ads for lanes you haven't used. The five ideas each fill one gap, differ from each other, and use only claims and offers from your brand file.

when:
  - Your ads have gone stale and every new one looks like the last one.
  - You're planning next month's tests and want ideas that are truly new for your brand.
  - You only have an ad library page or your own memory of what you ran, and want a structured view anyway.

you_give:
  - What your ads have done, from an account export, an ad library page or your own list
  - Your brand file, with products, prices, buyers, claims and offers
  - Competitor ads or notes (optional)
  - Who can appear on camera, and which formats you can make (optional)
you_get:
  - Tables of what has run, with each result marked measured, reported or not measured
  - The open lanes, covering motives, openings, buyer knowledge levels, narrow buyers, formats and products
  - Five ad ideas, each with headlines, an opening and the gap it fills
  - A ranked list of the ten gaps that matter most

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste your past ads. An export with spend and purchases is best, but a list of what you ran works too.
  - Paste your brand file underneath, including your approved claims and current offers.
  - Add competitor ads if you have them. Without them it skips that section and says so.
  - Read the ranked gaps at the end first, then pick the one or two ideas that fill the top gaps.

how_it_works:
  - title: States its evidence
    text: Says whether it's working from measured results, the founder's account or an ad library, and only claims what that evidence supports.
  - title: Lists what has run
    text: Tables every reason to buy and every format used, with its result and what that result rests on.
  - title: Checks the open lanes
    text: Goes through ten motives, nine kinds of opening line and five buyer knowledge levels, and marks which ones no ad has used.
  - title: Finds narrower buyers
    text: Names six to eight buyers narrower than your profiles, each backed by a review or remark, or marked "inferred".
  - title: Checks formats, products and competitors
    text: Finds the biggest format gap, the product with no ads, and what competitors lean on that you haven't tried.
  - title: Writes five ideas
    text: Each idea fills one gap and differs from the others in motive, buyer and how much the buyer knows. Every claim and offer comes from your brand file.
  - title: Ranks the gaps
    text: Lists the ten gaps that matter most and says whether each is known from results or only from what's running.

output_shape: |
  EVIDENCE: <account export / founder's account / ad library>

  1. WHAT HAS RUN
  <table: ad | reason to buy | format | buyer | buyer knows | result | result rests on>
  Worked: <pattern>   Didn't: <pattern>

  3. MOTIVES NOT LED WITH      <open lanes, from the ten>
  4. OPENINGS NOT USED         <kinds that fit, or "needs: ...">
  5. BUYER KNOWLEDGE LEVELS    <level: enough / thin / nothing>
  6. NARROW BUYERS             "<name>": <who, moment, evidence or "inferred">
  7. FORMATS                   <biggest format gap>
  9. PRODUCTS                  <the one with no ads that most deserves them>

  10. IDEA A: <name>
  Gap filled: <section and line>   Motive: <...>   Buyer: <...>
  Belief in the way: "<buyer's words>" (<source>)
  Headlines: <three, ten words or fewer>
  Opening: <2 to 4 sentences, or first five seconds of video>
  (ideas B to E in the same layout)

  11. TOP 10 GAPS
  <rank | gap | why | known from results or from what's running>

example:
  business: sprout
  input: |
    [the skill]

    Evidence: the brand's ad library page (sprout/ads.md: 15 live
    headlines, copies live, the mix of the 40 newest ads) and
    practice results for 9 ads (sprout/ad-results.csv).
    Brand file: sprout/brand.md. Reviews: sprout/reviews.md.
    Competitors: the five described in the brand file.
    People on camera: a paid former pro athlete only. No founder
    story on file. Formats: any.
  output: |
    EVIDENCE: ad library (what's running, no results) plus practice
    numbers. "Practice" below means made-up numbers, not real results.

    1. WHAT HAS RUN (top lines)
    Reason to buy              Copies  Result
    Price doubt + 61% off      15+     P1 $26.79 then $76.92 a sale (practice)
    Deal as insider tip        8+      P2 $50.00 a sale (practice)
    Deal + 4 free gifts        10      not measured
    Gut pain in slang          5       T1 $21.21 a sale (practice)
    Hair                       6       not measured
    Habit ("One Step I Never Skip") 1  H1 $29.55 a sale (practice)
    Worked (practice): pain and habit openings cost less per sale
    than deal openings. Didn't: the top deal ad wore down (P1).

    3. MOTIVES NOT LED WITH
    Prove something to myself (no), feel in control (no), save
    effort (partly). Biggest open lane: "I finally stuck with it",
    the top review theme, in 2 of the 40 newest ads.

    4. OPENINGS NOT USED THAT FIT
    Push back on a belief: "The issue has never been nutritive
    content... It's always been ... consistency" (review 1).
    Cost of the problem: the half-used tub of powder.
    Startling fact: the study (vitamin C +40.1% in the blood).
    Real expert: needs a real expert. The athlete is a paid
    spokesperson, not an expert.

    5. HOW MUCH THE BUYER KNOWS
    Doesn't see the problem: nothing. Knows the problem: thin.
    Comparing solutions: nothing against powders. Knows Sprout: heavy.
    Ready to buy: heavy (61% off everywhere).

    6. NARROW BUYERS (3 of 7 shown)
    "The powder quitter with a tub in the cupboard": "I've been
      choking on [a big-name greens powder] for the last few years"
      (review 4). Opening: the tub. First buy: Original, 28 packs.
    "The shelf of gummy bottles": "I also stopped buying separate
      probiotic gummies, b12 gummies, and multivitamin gummies"
      (review 5). Opening: the shelf, then one pack.
    "The subscription-wary": "I hate subscriptions because I feel
      like they are a trap" (review 17). Use only the site's own
      words on cancelling ("Pause Or Cancel Any Time").

    7. FORMATS: not captured in the library. Not known, ask.

    9. PRODUCTS: Sugar-Free has no ad. MISSING: a reason in the
    brand file to push it (it notes sugar alcohols upset some
    stomachs), so no idea is aimed at it.

    10. IDEA A: "The tub in the cupboard"
    Gap filled: section 3, prove something to myself. Buyer:
    powder quitter, comparing solutions. Format: video.
    Belief in the way: "A gummy can't hold enough to replace my
      powder." (brand file). Belief to plant: one pack holds 60+
      ingredients, 21 vitamins & minerals, 6 g fiber, and it's
      the one people keep taking (review 1).
    Headlines: "The greens you'll actually finish" /
      "Your powder is still in the cupboard" /
      "60+ ingredients. No shaker to wash."
    First five seconds: a half-used tub of green powder and a
      shaker in the sink. A hand tears a daily pack straight across
      the top and tips the gummies into a palm.
    IDEA B: "One pack, not a shelf". Gap: feel in control. Image,
      a row of bottles against one pouch. Note: don't say it
      replaces a multivitamin; minerals are about 25% of daily value.
    (cut for length: the full run also had ideas C to E, section 8
    on competitors and the ranked top 10 gaps)

tweaks:
  - what: The evidence you give
    how: An export with spend and purchases lets it say "tested and lost". A library page or your own list only lets it say "ran" or "never ran". Give the best you have and it adjusts what it claims.
  - what: Allowed formats
    how: Add "image ads only" and it judges coverage inside image formats, so it won't fill the list with video gaps you can't make.
  - what: People and rights
    how: Say who can appear on camera (the founder, a staff member, nobody). Ideas that need a person you don't have get marked "needs" instead of recommended.
  - what: Competitor ads
    how: Paste five to ten competitor ads or describe them. The audit adds what they lean on that you haven't tried, and what nobody in your market does.

judge:
  - The first line says what evidence the audit rests on.
  - Nothing is called a winner without numbers and dates. "Still running" isn't treated as a win.
  - Each of the five ideas names a different gap, and no two share the same buyer and motive.
  - Every narrow buyer quotes a real review or remark, or is marked "inferred".
  - The ideas use only your claims, prices and offers. Check one headline against your brand file.

test:
  - Think of a gap you already know about, such as a buyer you've never spoken to or a product with no ads. Check it shows up in the map or the top ten gaps.
  - Run it twice on the same list. The top gaps should mostly match, even if the five ideas differ.
  - Check one headline from each idea against your brand file. Any price, claim or offer you can't find there is a fail.
  - Show the five ideas and your last five ads to whoever makes your ads, mixed up, and ask which ones feel new.

improve:
  - Edit the lists of motives, openings and formats in steps 3, 4 and 7 of the skill file. Add the ones that matter in your market and delete the ones you'll never use.
  - Write your own rule for "tested" into step 1 (for example "at least three times our target cost per sale spent"), so results are judged your way.
  - Save the gap map in your brand file after each run, and paste it back next month so filled gaps drop off.
  - Add real review quotes to your brand file. The narrow buyers then come with evidence instead of "inferred".
  - Pair it with a skill that writes ad copy from one true product fact, to turn the best idea into a finished ad.

terms:
  - term: Reason to buy
    meaning: The reason someone buys, in their words. An ad usually leads with one.
  - term: Opening
    meaning: The first line or first two seconds of an ad, the part that makes someone stop scrolling.
  - term: Buyer knowledge level
    meaning: How much the buyer already knows about the problem and about you, from "doesn't know they have the problem" to "ready to buy".
  - term: Ad library
    meaning: A public page where an ad platform shows the ads a brand is running now. It shows the ads, not the results.
