new_slug: get-fresh-script-from-why-ad-worked
name: Get a fresh script from why an ad worked
summary: Takes the one idea that made an ad work and builds a new script on your own research.
job: study-competitors

headline: Keep what made an ad work, and get a new script that is never a copy
subhead: Tell it why an ad you like works and give it your customer research and facts. It turns that reason into one idea, checks your brand can use it, and hands back a new script where the idea shapes one or two parts.

explain: |
  "Make something like this" usually ends one of two ways. The new ad copies the reference's lines and shots too closely, or it drifts so far that the thing you liked is gone. Both waste the reference.

  This skill takes only the reason the reference worked, never its script, on purpose, so it can't drift toward the reference's words. It states that reason as one idea about persuasion (for example, "admit a weakness first, so the good part lands as a surprise"), then checks whether your brand has a true fact the idea can work on. If it doesn't, it says the reference doesn't transfer. The idea shapes one or two parts of the script, usually the opening and the proof. Everything else, including the order, comes from your own research, and a distance check at the end confirms nothing was borrowed.

when:
  - A teammate shares an ad and says "something with this energy".
  - You admire a competitor's ad but don't want anything that looks like theirs.
  - You want to test whether a persuasion idea from another category works for your buyer.

you_give:
  - Why the reference worked, in your own words (not its script)
  - What not to borrow from it (optional)
  - Your customer research, with real quotes
  - Your product facts, proof, offer and buyer stage
  - The script type, length and speaker (optional)
you_get:
  - The idea, in one sentence, and where it works in the script
  - A full new script with belief, assumptions, lines, opening variants and a test plan
  - A four-line distance check against the reference

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Write one or two sentences on why the reference worked. Don't paste its script.
  - List anything not to borrow (its claims, people, shots).
  - Paste your customer research and product facts underneath.
  - Read the idea line first. If it isn't what you liked about the reference, correct it and run again.
  - Check the distance lines before using the script.

how_it_works:
  - title: States the idea
    text: One sentence, stripped of the reference's subject and of how its product is sold.
  - title: Checks it fits
    text: Looks for a true fact, a customer finding or proof your brand has that the idea can work on. If none, it says so.
  - title: Decides where it works
    text: Usually the opening and how the proof is delivered. The idea doesn't set the order.
  - title: Writes the script
    text: Uses the full customer-research method. One belief to change, real quotes only, every fact sourced.
  - title: Checks the distance
    text: Confirms the order, claims, numbers, stories, people and shots are all your own.

output_shape: |
  Idea: <one sentence>
  Where it works: <parts of the script>

  Belief: They think ___. After this they think ___.
  Assumed: <...>
  Part | Spoken line | On-screen text | Visual note | Evidence
  ...
  Opening variants: <type> | <line> | <overlay> | <first frame>
  Part that carries the ad: <...>
  Test plan: <...>
  Placeholders: <...>

  Distance check
  Order is the brand's: <yes/no>
  No claim, number or offer from the reference: <yes/no>
  No story, person or shot from the reference: <yes/no>
  Nothing from "do not borrow": <yes/no>

example:
  business: sprout
  input: |
    [the skill]

    Why the reference worked: it opened by admitting the product's
    weak point, so when the good part came, you believed it.
    Don't borrow: its price comparison.
    Research: quitters' doubt, "A gummy can't hold enough to replace
    my powder." Review: "[Sprout] has been the one thing I've been
    able to stick to."
    Facts: one pack is about 100% of daily value for vitamins, about
    25% for minerals. "60+ ingredients, 21 vitamins & minerals, and
    6g fiber." Survey of 3,000+ customers: 80% of surveyed users take
    it daily. Bought again (subscription). "Pause Or Cancel Any Time."
    Offer: $29.99 first order with text sign-up, then $49.99 every 4
    weeks; 30-day money-back, first order only.
    Buyer stage: solution aware. Length: 20 seconds. Speaker: narrator.
  output: |
    Idea: admit a real limit first, so the strength that follows is
    believed.
    Where it works: the opening and the proof.

    Belief: They think a gummy can't hold enough. After this they think
    it's honest about what it holds, and it's one they'd keep taking.
    Assumed: no quote on cancelling, so the doubt "am I locked in" is
    answered with the site's own words only.

    Part | Spoken | On-screen | Visual note | Evidence
    Opening | "A gummy pack won't give you every mineral at 100%." | Not
      100% of everything | A daily pack on a counter, torn across the
      top | Science page
    Admission | "Minerals come to about a quarter of daily value." |
      Minerals: ~25% DV | Gummies tipping into a palm | Science page
    Promise | "Vitamins come to about 100%. Plus 6 grams of fiber." |
      Vitamins: ~100% DV. 6g fiber | Palm close | Science page; label
    Proof | "And people keep taking it: 80% of surveyed users take it
      daily." | 80% of surveyed users take it daily | Text card with
      source | Brand survey, 3,000+ customers
    Offer | "First order $29.99 with text sign-up, then $49.99 every 4
      weeks. Pause or cancel any time." | Same, plus "30-day
      money-back on your first order" | Pouch on the counter |
      Product page price box
    Call to action | "Start with one pouch." | Start Now | Pouch, front
      on | Site button

    Opening variants: admission | "It won't cover every mineral." |
      Not 100% of everything | torn pack; question | "Can a gummy hold
      enough?" | Can a gummy hold enough? | palm of gummies
    Part that carries the ad: proof (people who keep taking it).
    Test plan: against the offer-led "too expensive" ads. If it wins,
    the honest-limit opening is worth trying on the price doubt next.
    Placeholders: none.

    Distance check
    Order is the brand's: yes
    No claim, number or offer from the reference: yes
    No story, person or shot from the reference: yes
    Nothing from "do not borrow": yes (no price comparison)

tweaks:
  - what: The reason you give
    how: Be specific about why it worked. "It admitted a weakness first" gives a usable idea; "it had great energy" doesn't, and it will ask you for one reason.
  - what: What not to borrow
    how: List the reference's claims, people and shots you want kept out. The distance check confirms each one.
  - what: Script type
    how: Name a type (person to camera, demonstration, narrated). The type sets the order and the idea works inside it.
  - what: When it doesn't transfer
    how: If your brand has nothing true for the idea to work on, it says so and writes from your research alone. Give it a different reason to try again.

judge:
  - The idea line doesn't mention the reference's product, category or subject.
  - The order of the script is different from the reference.
  - Every number and quote has a source from your own facts.
  - The idea shows up in one or two named parts, not all of them.
  - All four distance lines say yes.

test:
  - Read the idea line. It should not mention the reference's product, category or subject.
  - Give it a reason your brand has nothing true to support. It should say the reference doesn't transfer.
  - Check the four distance lines. All should say yes, and the script's order should differ from the reference.
  - Run it twice on the same idea. The idea should shape the same one or two parts both times.

improve:
  - Keep a list of ideas from references in your brand file, one sentence each, and paste in the next one you want to test.
  - Add your customer quotes and facts with sources to "What you need" in the skill file. Step 2 needs a true fact for the idea to work on.
  - If you always want the idea in the same parts (usually the opening and the proof), write that into step 3.
  - Pair it with the skill that writes a video ad script from customer research, since step 4 uses its method, or with the skill that borrows a reference's whole structure when you want that instead.

terms:
  - term: Reference ad
    meaning: An existing ad, yours or someone else's, that you're using for inspiration.
  - term: Distance check
    meaning: Four yes or no questions confirming the new script took nothing but the idea from the reference.
  - term: Buyer stage
    meaning: How much the buyer already knows about the problem and about you.
