new_slug: get-long-narrated-ad-script-that-sells
name: "A long video ad that teaches buyers until they're ready"
summary: "Give it your research and proof. You get a 1 to 10 minute narrated script, as long as your proof can fill."
job: make-video-ads

headline: "A long video ad that teaches buyers until they're ready"
subhead: Give it your brief, customer research, product facts and the proof you hold. It counts your problems, explanations and proof, picks the length they can fill, and hands back narration with a picture note for every line.

explain: |
  Long video ads (often called video sales letters) can sell to people who have never heard of you, because they have time to teach. Most fail because they're a short ad stretched out. The same claim repeated, more adjectives, a single call to action at minute eight, and a "results by day 30" timeline nobody can back up.

  This skill sizes the script to what you can prove. It counts your separate problems, your explanations of how the product works, and your real pieces of proof, then writes the longest script those facts fill, and says what's missing if you asked for more. Long scripts repeat a cycle (problem, promise, how it works, objection, proof) about three times, each round with a new problem. Every line gets a picture that changes every few seconds, tagged with whether you already have it or need to film or make it.

when:
  - You're writing an ad for buyers who don't yet know they need a product like yours.
  - Your product needs explaining before people trust it, and a 15-second ad can't hold that.
  - You were asked for a 5-minute video and want to know if your facts can fill it.

you_give:
  - The brief, the length you want and the buyer stage
  - Customer research, including the buyer's own words and objections
  - Product facts, how it works, and any results over time with sources
  - The proof you hold, counted (study, tests, reviews, ratings, guarantee)
  - Footage you already have, and your offer and claims
you_get:
  - A timed table of narration, on-screen text and a picture note for every line
  - The cycles, calls to action, product arrival and proof marked
  - Notes on the length chosen, what you counted and what's missing for longer

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your customer research, product facts and claims underneath.
  - List your proof, one line each, with its source.
  - Say the length you want, for example "5 minutes".
  - Read the notes first. If it chose a shorter length, the notes say what you'd need for the longer one.
  - Read the full script aloud once before it goes to the editor.

how_it_works:
  - title: Checks it fits
    text: Long narration suits buyers who need teaching. It says so if your buyer only needs the offer.
  - title: Counts your facts
    text: Counts separate problems, explanations of how it works, and real proof. That count sets the length.
  - title: Grows each part
    text: A longer script gets a longer problem story and more proof. The opening line and the offer never grow.
  - title: Plans the cycles
    text: One pass at 60 seconds, one or two at 2 to 3 minutes, about three at 5 to 10 minutes, each with its own problem.
  - title: Writes for the ear
    text: Opens cold on a story, teaches as it goes, and brings the product in late in the first cycle.
  - title: Writes the picture track
    text: A picture for every line, changing every 2 to 4 seconds, each tagged on file, product photo, diagram, text card, or to film.

output_shape: |
  COUNT
  Problems: <each separate problem, with source>
  Explanations of how it works: <each, with source>
  Proof: <each piece, with source>
  Results over time: <usable time points, or "none: no timeline">
  Length: <chosen length and why; what a longer one would need>

  Time | Narration | On-screen text | Visual note (kind: description)
  0:00-0:04 | "<cold open>" | - | to film: <...>
  ...
  <PRODUCT ARRIVES> ...
  <PROOF 1: source> ...
  <CALL TO ACTION 1> ...
  <CYCLE 2> ...

  NOTES
  <length reasoning, what's missing for longer, MISSING items>

example:
  business: sprout
  input: |
    [the skill]

    Length: 5 minutes. Buyer stage: problem aware.
    Research: people quit greens powders and pill stacks. "The issue
    has never been nutritive content. It's always been an issue of
    consistency like many things." (review). "gritty/chalky" (review).
    Gut buyers: bloating, irregularity, tried fiber powders.
    Doubts: "A gummy can't hold enough to replace my powder."
    Product: Sprout, daily greens gummies. One pack a day, torn straight
    across the top. 60+ ingredients, 21 vitamins & minerals, 6 g
    prebiotic fiber. Vitamins about 100% of daily value, minerals about
    25%. Approved: "Supports digestion and gut health."
    Proof: 2025 study (12 weeks, 120 adults, vitamin C +40.1%, 2.7x
    placebo; folate +20.5%, 2.9x placebo). Third-party tested for 70
    pesticides, 4 heavy metals, 16 contaminants, 9 microbial
    contaminants. Survey of 3,000+ customers: 80% of surveyed users take
    it daily; 67% better, more regular digestion. NSF, GMP, FDA-
    registered facilities. 20 review quotes. Ratings: four different
    numbers by source.
    Results over time: FAQ says "within days or weeks". The site's
    30/60/90-day timeline is unsupported.
    Footage: brand photos of adults pouring gummies into a hand.
    Offer: 30-day money-back, first order only.
  output: |
    COUNT
    Problems: 2. (1) Quitting powders and pills. (2) Gut irregularity.
      Price is an objection, not a problem.
    Explanations: 3. The one-pack format; 6 g prebiotic fiber with
      "supports digestion"; the absorption study.
    Proof: 6. Study, testing, survey, review quotes, facilities, a
      rating (only with its source named).
    Results over time: none usable. No timeline.
    Length: 2 min 30 s, two short cycles. 5 minutes needs about three
      separate problems; there are two. Proof is enough for longer.

    Time | Narration | On-screen | Visual note
    CYCLE 1: QUITTING
    0:00-0:04 | "Somewhere in your kitchen there's a tub of green
      powder." | - | to film: a half-used tub at the back of a cupboard
    0:04-0:08 | "It's about half full." | - | to film: lid off, the
      scoop buried in powder
    0:08-0:12 | "And you stopped drinking it weeks ago." | - | to
      film: the shaker upside down on a drying rack
    0:12-0:18 | "One reviewer said the problem was never the
      nutrients." | "The issue has never been nutritive content."
      (customer review, brand site) | text card: the quote exactly
    0:18-0:24 | "It was keeping it up. The scoop, the water, the
      shaker to wash." | - | to film: three quick cuts, one per item
    0:24-0:30 | "So what would you actually keep doing?" | - | to
      film: a hand pausing over the tub
    0:30-0:36 | "Something you'd want to eat." | - | on file: an adult
      pouring gummies into a hand
    PRODUCT ARRIVES
    0:36-0:42 | "Sprout is one small pack of green gummies a day." |
      Sprout | product photo: pouch on a soft gradient
    0:42-0:48 | "Tear it across the top and tip a small handful into
      your palm." | Rip. Tip. Enjoy. | to film: the tear, straight
      across the top
    0:48-0:56 | "Sixty-plus ingredients, 21 vitamins and minerals, and
      6 grams of fiber." | 60+ ingredients. 21 vitamins & minerals.
      6g fiber | text card
    0:56-1:02 | "Can a gummy hold enough? Vitamins come to about 100% of
      daily value. Minerals, about a quarter." | Vitamins ~100% DV.
      Minerals ~25% DV | diagram: two bars, the second a quarter of
      the first
    PROOF 1 (brand survey of 3,000+ customers)
    1:02-1:10 | "And people keep taking it. 80% of surveyed users take
      it every day." | 80% of surveyed users take it daily | text card
      with source line
    1:10-1:14 | "Your first order has a 30-day money-back guarantee."
      | First order only | text card
    CALL TO ACTION 1
    1:14-1:18 | "Start with one pouch." | sprout.example | product
      photo: pouch

    (cut for length: the full run also had cycle 2, 1:18 to 2:30, on
    gut irregularity with "supports digestion and gut health", the
    survey's 67% line and the testing proof, then the offer and a
    final call to action)

    NOTES
    - No timeline: the brand's 30/60/90-day promises have no support.
    - The rating isn't used: four sources disagree. If used, name one.
    - Minerals at about 25% is said plainly. It answers the "can a
      gummy hold enough" doubt honestly.
    - MISSING for 5 minutes: a third separate problem with its own
      explanation and proof.
    - MISSING: customer footage with ad consent; all real-person
      shots are hands only, "to film".

tweaks:
  - what: The length you ask for
    how: Ask for the length you want. If your facts can't fill it, it writes the longest version they can and lists what's missing, rather than padding.
  - what: Your proof list
    how: Add a piece of proof (a test, a quote, a count) and run it again. More proof lets the script grow; a third separate problem lets it add a third cycle.
  - what: A timeline
    how: If you have sourced time points (week 1, month 1), paste them. It builds one cycle per step. Without them it leaves the timeline out.
  - what: Footage on file
    how: List the real clips you have and who agreed to appear. It tags those shots "on file" and plans the rest as "to film" or "to make".

judge:
  - The notes count your problems, explanations and proof, and the length matches the count.
  - The first few seconds don't mention the product.
  - The product arrives late in the first cycle, as the answer to what the script taught.
  - Each piece of proof shows its source on screen when it's cited.
  - No line stays on one picture for more than about four seconds.
  - There's a call to action after each cycle, not just one at the end.

test:
  - Ask for 10 minutes on a product with little proof. It should say what's missing and write a shorter script, not stretch one claim.
  - Check the counts in its notes against your own list of problems, explanations and proof. The length should match what you count.
  - Run it twice at the same length. Both should bring the product in late in the first cycle and put a call to action after every cycle.
  - Read the first minute aloud with a timer. If any picture holds for more than about four seconds, the picture track needs more notes.

improve:
  - Add your proof list with sources (studies, test results, survey numbers marked "of surveyed users") to "What you need" in the skill file, so step 2 counts the same things every time.
  - Write the lengths you actually run into step 3, so it only writes for those.
  - Add your brand's own phrases to step 5 ("Write for the ear"), so the narration still sounds like you at minute eight.
  - When the notes list a missing problem or proof piece, add it to your brand file. Each one earns more minutes than any rewrite.
  - Pair it with the skill that makes a script easy to say aloud, before recording.

terms:
  - term: Video sales letter
    meaning: A long ad where a narrator explains the problem and the product over changing pictures, usually several minutes long.
  - term: Cycle
    meaning: One round of problem, promise, how it works, objection and proof. Long scripts repeat it with a new problem each time.
  - term: Buyer stage
    meaning: How much the buyer already knows about the problem and about you.
