new_slug: get-new-ads-from-your-best-script
name: Get new ads from your best script
summary: Your winning script retold as I, you or they, with every fact, line and length kept the same.
job: make-video-ads

headline: Get new ads from a script that already works, without touching what makes it work
subhead: Give it a script you trust and say who should tell it (I, you or she) and when (past, present or future). It changes only the voice, keeps every fact, line and length, and flags any line it couldn't change honestly.

explain: |
  Writing a new ad from scratch is slow, and a fresh idea is a fresh risk. A script told as "I did this" and the same script told as "you do this" feel like two different ads to a viewer, and the ad platform treats them as two ads too. That makes a voice change the cheapest way to get more out of a script you already trust.

  This skill changes the person (I, you, she or they) and the tense (past, present, future) and nothing else. It leaves how the product works in the present tense, keeps the offer spoken to the viewer, and keeps customer quotes word for word. When a new voice would turn a line into a claim nobody can back, such as an AI presenter saying "it worked for me", it keeps the old wording and tells you why.

when:
  - You have a script that sells and want more versions to test without writing new ones.
  - A customer story was written as "I" and you need a version an AI presenter or narrator can say honestly.
  - You want the same ad as a direct "you" script and as a told story, to see which one people watch.

you_give:
  - The script, line by line, with on-screen text and picture notes if you have them
  - The new person and tense (for example "third person, past")
  - Who will say it (a real customer, the founder, a creator, or an AI presenter or narrator)
  - A name and pronoun for a third-person version (optional)
  - Your brand voice (optional)
you_get:
  - The same script, same number of lines in the same order, in the new voice
  - Opening-line variants and on-screen text changed the same way
  - Notes on every line it kept in the old voice, and why

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste your script underneath, one line per row, with any on-screen text and picture notes.
  - Write the new person and tense, for example "first person, past" or "third person, past, she".
  - Say who will say it. This matters, because an AI presenter can't claim a personal result.
  - Read the notes first, then read the new script aloud and compare it line by line with the old one.

how_it_works:
  - title: Sets the new voice
    text: Works out who the new subject is (the speaker, the viewer, or a described person) and which tense fits. It invents no surname or life story.
  - title: Changes the story lines
    text: Rewrites the opening, the problem and the experience lines in the new person and tense.
  - title: Leaves facts in the present
    text: Keeps how the product works in the present tense, because it's true now, and keeps the offer and call to action spoken to the viewer.
  - title: Fixes what the change breaks
    text: Turns lines that stop making sense (a confession told as "you") into something that does, without adding a claim.
  - title: Keeps the rhythm
    text: Holds sentence lengths, repeated phrases and brand words, and keeps each line within about 10% of its old length.
  - title: Updates text and pictures
    text: Changes on-screen text and opening variants the same way, and rewrites picture notes only where the person on screen changes.
  - title: Checks honesty
    text: Compares old and new line by line for the same facts in the same order, and notes any line where honesty limited the change.

output_shape: |
  <line number>. "<spoken words in the new voice>"
     text: <on-screen text, changed the same way>
     picture: <picture note, changed only where the person on screen changes>
  (same number of lines, in the same order)

  OPENING VARIANTS
  "<variant in the new voice>"  (<leads into line 2, or kept and why>)

  NOTES
  Kept in the old voice: <line numbers, and why>
  Pictures:  <what changed on screen>
  Honesty:   <lines where honesty limited the change>
  Length:    <any line outside 10% of its old length>
  MISSING:   <anything it needed and didn't get>

example:
  business: sprout
  input: |
    [the skill]

    Script (AI presenter, talking to camera, "you", present):
    1. "You bought the big tub of greens powder. Again." /
       presenter at a kitchen counter holding a half-used powder tub
    2. "By week two it's chalky sludge in a shaker you never clean." /
       presenter frowns at a shaker bottle with a green ring inside
    3. "So the tub sits at the back of the cupboard." /
       a cupboard door closes on the tub
    4. "Sprout is 60+ ingredients, 21 vitamins and minerals and 6 g of
       fiber in one daily pack." / text: 60+ ingredients. 6 g fiber /
       a daily pack torn straight across the top, gummies into a palm
    5. "No water, no mixing, no shaker." / text: No shaker /
       green gummy bears in the palm
    6. "One reviewer wrote: 'Sprout has been the one thing I've been
       able to stick to.'" / text: Customer review, brand site /
       the pouch on the counter, closed at its resealable top
    7. "Your first order is $29.99 with the text sign-up. It renews at
       $49.99 every 4 weeks." / text: $29.99 first order with SMS
       sign-up / pouch and one torn pack side by side
    Opening variants: "Still paying for a tub you don't drink?" /
    "Rip. Tip. Enjoy."

    New voice: third person, past. Pronoun: he.
    Who says it: an AI narrator, off screen.
  output: |
    1. "He bought the big tub of greens powder. Again."
       picture: a man at a kitchen counter holding a half-used powder
       tub, not looking at the camera. Narrator heard over it.
    2. "By week two it was chalky sludge in a shaker he never cleaned."
       picture: he frowns at a shaker bottle with a green ring inside
    3. "So the tub sat at the back of the cupboard."
       picture: a cupboard door closes on the tub (unchanged)
    4. "Sprout is 60+ ingredients, 21 vitamins and minerals and 6 g of
       fiber in one daily pack."
       text: 60+ ingredients. 6 g fiber
       picture: unchanged. The pack is torn straight across the top.
    5. "No water, no mixing, no shaker."
       text: No shaker
       picture: unchanged
    6. "One reviewer wrote: 'Sprout has been the one thing I've been
       able to stick to.'"
       text: Customer review, brand site
       picture: unchanged
    7. "Your first order is $29.99 with the text sign-up. It renews at
       $49.99 every 4 weeks."
       text: $29.99 first order with SMS sign-up
       picture: unchanged

    OPENING VARIANTS
    "Still paying for a tub he never drank."  (leads into line 2)
    "Rip. Tip. Enjoy."  (kept, see notes)

    NOTES
    Kept in the old voice:
    - Lines 4 and 5: how the product works stays in the present
      tense. It is true now, not part of his story.
    - Line 6: a customer quote stays word for word in any voice.
    - Line 7: the price and renewal are spoken to the viewer, in the
      present. In a third-person script the narrator turns to the
      viewer here.
    - Variant 2: a brand line, kept as written.
    Pictures: lines 1 and 2 change from a presenter talking to camera
    to a man shown on screen with the narrator over him. He is a
    fictional adult, never called a customer.
    Honesty: the narrator tells the powder story as a story. Nothing
    says he stuck with Sprout or felt better, because the original
    never said it either. The review stays labeled as a review.
    Length: every line within 10% of its old length in characters.
    Variant 1 is one character shorter; "he never drank" keeps the
    question's sting as a statement.
    Same 7 lines, same order, same facts. MISSING: nothing.

tweaks:
  - what: The new person
    how: '"I" suits a story a real customer tells; "you" suits a direct script; "she" or "they" suits a narrator over footage. If an AI will say it, ask for "you" or "she", because it cannot honestly say "I".'
  - what: The tense
    how: Past tense reads as a story that happened. Present reads as now and how things work. Future reads as a promise or warning, so use it sparingly. Ask for two tenses at once to get two versions.
  - what: Who says it
    how: Change this from "AI presenter" to "real customer" and the skill will allow more first-person lines, but it leaves [brackets] where the customer's own true details go.
  - what: The name and pronoun
    how: Give a first name and pronoun for third person ("Dana, she"). Without one it uses "they" and never makes up a surname or back story.

judge:
  - Put old and new side by side. Same number of lines, same order, same facts in each.
  - Every number, price, renewal term and customer quote is word for word the same.
  - Lines about how the product works are still in the present tense.
  - The offer and call to action still speak to the viewer.
  - Read it aloud. No line sounds translated or stiff.
  - Nothing an AI presenter says claims a result of their own.

test:
  - Convert a script, then ask it to convert the new version back to the original voice. The round trip should land almost word for word on your original. If facts drift, it is changing more than the voice.
  - Run the same script and voice twice. The story lines may differ slightly; numbers, prices and quotes must never change.
  - Ask for a first-person version twice, once with "AI presenter" and once with "real customer". The AI version should turn personal results into observations; if both read the same, the honesty rules were skipped.
  - Hand the old and new scripts to a colleague and ask them to circle any line that now says something new. There should be none.

improve:
  - Add your fixed brand lines and offer wording to step 7 of the skill file as words it must never change, so they survive every voice.
  - If the same speaker always says your ads (an AI narrator, say), write that into "What you need" as the default, so the honesty rules apply without you typing it.
  - Paste your allowed claims under the checks, so it flags any new wording that strays from them.
  - Only convert scripts that have already done well, and save which voice won back to your brand file next to the script.
  - Pair it with a skill that makes a script easy to say aloud, and one that plans which versions to test against each other.

terms:
  - term: Person
    meaning: Who the script is about. First person is "I", second is "you", third is "she", "he" or "they".
  - term: Tense
    meaning: When it happens. Past ("I stopped"), present ("I stop") or future ("you'll stop").
