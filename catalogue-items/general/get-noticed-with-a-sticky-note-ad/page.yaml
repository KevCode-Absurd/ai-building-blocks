new_slug: get-noticed-with-a-sticky-note-ad
name: "A sticky-note photo that tells your story at a glance"
summary: "Give it your story ad. You get the house rule your buyer had to write down, and a photo prompt."
job: make-image-ads

headline: "A sticky-note photo that tells your story at a glance"
subhead: Give it your story ad. It finds the rule the old way forced on your buyer, writes it in two to eight handwritten words, sticks it on the thing the rule is about, and briefs a plain phone photo.

explain: |
  People only stick up a note like "eggs: OTHER pan" or "CANCEL before the 14th" when the old way keeps letting them down. The note is the habit in a few words, and where it's stuck tells you the rest. Anyone who has written the same kind of rule knows the story before they read the ad. Handwritten notes also get noticed: in one well-known study, a request written on a sticky note got far more people to reply than the same request printed in the letter.

  This skill finds the reminder, ban or workaround in your story, keeps it to two to eight words in thick marker, and sticks it on the very thing the rule is about, such as the pan handle or the monitor edge. It keeps to one note, or two when the story is about a reminder that kept failing. Best of all, it suggests writing the note yourself and taking the photo, because a real note looks like a real note.

when:
  - Your story has a house rule, reminder or workaround the narrator wrote down.
  - The problem lives on one thing at home or at a desk.
  - You want a picture with words that still looks like a normal photo.

you_give:
  - Your approved story ad, with any rule, reminder or workaround in it
  - How your buyer writes notes, if you know (optional)
you_get:
  - The rule, and the two to eight words exactly as they'll appear
  - The thing it's stuck on and what's nearby
  - A blank version and the line under the picture
  - A 60 to 120 word image prompt, and the easiest honest way to make it

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad. If it quotes the note, those exact words are used.
  - Write the note yourself in thick marker, stick it where the brief says and photograph it. Or paste the prompt into your image tool.
  - Read the note in the result letter by letter. One wrong letter makes it look fake.
  - Look at it on your phone at arm's length. If you can't read it, use fewer words.

how_it_works:
  - title: Sets the house rules
    text: Square, looks taken on a phone, no logo, price, button or brand colour, no person and no product unless asked.
  - title: Finds the rule
    text: A reminder, a ban or a workaround the old way forced on your buyer, in your story's words.
  - title: Writes it short
    text: Two to eight words in thick marker, the way people write notes to themselves.
  - title: Sticks it where it applies
    text: On the thing the rule is about, like a pan handle or a monitor edge. The place does half the telling.
  - title: Says how to make it
    text: A real note photographed is best. Generated works too, if you check every letter.

output_shape: |
  SCENE             <what someone scrolling would say they saw>
  WHERE AND WHEN    <place, time, light, camera spot>
  THE RULE          <reminder | ban | workaround>, <where in the story>
  WHERE IT'S STUCK  <the thing it's on, what's nearby>
  THE NOTE          <colour, pen, how many>
  WORDS ON IMAGE    "<words>" (<word count>)
  BLANK VERSION     <the same scene with the note blank>
  LINE UNDER IMAGE  <words> (<which line>, <characters>)
  FLAGS             <words written for the image, anything inferred>
  IMAGE PROMPT      <60 to 120 words, the words in quotes once>
  HOW TO MAKE IT    <real note | generated | blank plus handwriting>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved; narrator: a customer who agreed, built on
    reviews 3 and 17, example only):
    For a year there was a sticky note on my monitor: "CANCEL the
    powder before the 14th." I never did. Every month another $94
    went on my card.
    I hate subscriptions. I feel like they are a trap.
    So with Sprout I read the line under the button first: "Renews
    at $49.99 each 4 weeks. Cancel anytime." The $29.99 first box
    needs the text sign-up discount. 30-day money-back guarantee on
    the first order.

    Buyer: the price doubter, who knows the brand and thinks it costs
    too much.
  output: |
    SCENE             A yellow sticky note on a computer monitor that
                      says to cancel the powder before the 14th.
    WHERE AND WHEN    A home desk, evening, one desk lamp on. Camera:
                      sitting in the desk chair, looking at the screen.
    THE RULE          A reminder (story, line 1), quoted word for word.
    WHERE IT'S STUCK  The bottom edge of the monitor, the spot you see
                      every time you sit down. A bank card, a mug and a
                      phone on the desk below.
    THE NOTE          One square yellow note, slightly curled at one
                      corner. Black marker, a little rushed, "CANCEL" in
                      capitals as in the story.
    WORDS ON IMAGE    "CANCEL the powder before the 14th." (6 words)
    BLANK VERSION     The same monitor with the note blank.
    LINE UNDER IMAGE  I hate subscriptions. (the buyer's own line, 21)
    FLAGS             Note words lifted from the story. The line under
                      the image is from review 17: keep the customer's
                      permission on file. Keep the monitor generic.
                      Copy check: cancelling is the loudest complaint on
                      review sites, so keep to the site's own words
                      ("Cancel anytime") and nothing more.
    IMAGE PROMPT      Square 1:1 phone photo of a home desk in the
                      evening, lit by one desk lamp. A square yellow
                      sticky note is stuck to the bottom edge of a
                      plain, generic computer monitor, one corner
                      lifting. On it, in slightly rushed black marker
                      handwriting, spelled exactly: "CANCEL the powder
                      before the 14th." A bank card, a mug and a phone
                      on the desk below. The screen is dark. Slight
                      tilt, a little grain, ordinary and unstyled. No
                      logo on the monitor, no brand name, no price, no
                      person, no other notes.
    HOW TO MAKE IT    Write the note in thick black marker, stick it on
                      a monitor at home, switch the lamp on and take the
                      photo sitting down.

tweaks:
  - what: Where it's stuck
    how: Move it onto the thing your buyer struggles with. A pan handle says the kitchen, a monitor says work or bills, a cupboard door says the thing hidden behind it.
  - what: Two notes
    how: Ask for "a second, older note" when your story is about a reminder that kept failing. Never more than two.
  - what: Write it yourself
    how: Use the brief as a shot list. A real note in your own handwriting is the most believable version and takes minutes.
  - what: Words off
    how: Ask for a blank note. A blank sticky note on the right thing still makes people wonder what it said.

judge:
  - The note is the narrator's own rule, with no claim and no product name.
  - It's two to eight words, readable on a phone without zooming.
  - It's stuck on the thing the rule is about.
  - The handwriting looks rushed and real, not neat or typed.
  - There's one note, or two at most.

test:
  - Give it a story that quotes a note. The note should match word for word, capitals included.
  - Give it a story with no rule or workaround. It should send you to the everyday snapshot.
  - Look at the finished picture at arm's length on your phone. If you can't read the note, ask for fewer words.
  - Run the note with words against the same photo with a blank note. Keep whichever brings more readers to the offer.

improve:
  - Ask customers what notes they've stuck up about the problem, and add them to your brand file. Real notes make the best pictures.
  - Add the things your buyers struggle with at home to your brand file, so the note lands on one they'd know.
  - Put the note in your story word for word. Then the picture copies the story and needs no extra check.
  - For longer handwritten lines or lists, use the handwritten note skill.

works_best_with:
  tools:
    - {name: "Your phone camera and a marker", why: "A note you write and photograph yourself looks real because it is, and costs nothing."}
    - {name: "Nano Banana Pro", why: "Google recommends its Gemini 3 Pro Image model for accurate text, so a generated note is more likely to be spelled right."}
    - {name: "Your phone's photo editor", why: "Lets you write the words by hand on a photo with a blank note, if the image tool misspells them."}
  inputs:
    - "Photos of notes customers have really stuck up, shared with permission, so the words and places are theirs"
    - "A photo of the real thing the rule is about, such as your buyer's kind of pan or desk, so the scene looks right"
    - "How your buyers write (capitals, short forms, slang), so the note sounds like them"

terms:
  - term: Workaround
    meaning: What someone does to cope with a problem they haven't fixed.
  - term: Blank version
    meaning: The same picture with no words, so you can change the words later without starting again.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
