new_slug: get-offer-reel-that-shows-your-real-product
name: "An offer video with your product and price exactly right"
summary: "Give it your product photos, words and offer. You get a finished 10 to 20 second video in every size you need."
job: make-video-ads

headline: "An offer video with your product and price exactly right"
subhead: Give it your real product photos, approved words, colours, fonts and offer. It plans a beat-timed shot list for you to approve and builds the reel in code. It reviews the rendered frames at least three times, then hands you the finished video in each shape you need.

explain: |
  AI video tools often get wrong the one thing you can't afford to: the product. The label smudges, the pack changes shape, the colour drifts. In a launch or offer reel, the whole point is "this product, this price", so that's a real problem.

  This skill builds the reel in code instead, with a tool such as Remotion. It uses only your real photos, your own fonts and colours, and words you've already approved. Text and photos move to a music beat that is also made in code and measured, so every cut lands on time. It writes the brief and a shot list first, then stops until you reply APPROVED. After the build, a separate reviewer scores the rendered frames at phone size, with the app's covered areas marked. That happens over at least three rounds before you see anything. It's made for offers, launches and short lists of reasons, not demos or stories.
when:
  - You're launching a product or an offer and need a short reel in your exact brand look.
  - AI-generated video keeps getting your pack or label wrong.
  - You need the same reel in several shapes (tall for Reels and Stories, 4:5 for feeds).

you_give:
  - What the reel is for (launch, offer, reasons, bundle, closing card)
  - Real product photos (the front on a clean background, plus unpacked, in a hand, in use)
  - Approved words in order, with sources for claims, prices and offers
  - Your colours, font files and logo file
  - Length, shapes, music and voice (optional)
you_get:
  - A filled brief and a style guide
  - A beat-timed shot list with every claim's source, for your approval
  - The timeline, the film's code and a review log
  - Final videos in each shape, with loudness and review scores

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. It needs a coding agent that can run code on your computer, such as Claude Code with Remotion.
  - Give it your photos, approved words, colours, font files and logo.
  - Answer the one round of questions about anything blank.
  - Read the shot list carefully, then reply APPROVED or ask for changes.
  - Wait for the review rounds to finish before judging the reel.
  - For later changes, ask it to update the shot list first, then rebuild.

how_it_works:
  - title: Fills the brief
    text: Reads your brand file first and asks only for what's blank, in one round. A missing photo is asked for, never generated.
  - title: Sets up the project
    text: A new folder of its own, with photos named by job and your fonts, colours and logo.
  - title: Writes a style guide
    text: Colours, type sizes readable on a phone, rhythm, allowed transitions, and how text comes in and goes out.
  - title: Sets the beat grid
    text: Makes the music in code, measures its beats, and puts every cut on a bar line.
  - title: Stops for approval
    text: Writes the shot list with sources for every claim and price, and builds nothing until you say APPROVED.
  - title: Builds the film
    text: Real photos only, never redrawn. Something new every two to four seconds, an end card of two seconds or less.
  - title: Reviews rendered frames
    text: At least three rounds by a separate reviewer, scored on the real output, until every score is 8 or more.
  - title: Delivers every shape
    text: Final videos with loudness, scores, a contact sheet and anything knowingly left imperfect.

output_shape: |
  BRIEF
  Purpose: <...>  Photos: <by job>  Words: <in order, with sources>
  Offer: <as the live offer states it>  Length: <...>  Shapes: <...>
  Fonts: <...>  Logo: <...>  Music: <...>  Voice: <...>
  MISSING: <anything blank>

  STYLE GUIDE
  Colours: <token> <hex> (from <where>)  Type: <display, text, sizes>
  Ways in and out: <...>  Product: <placement, shadow>

  BEAT GRID
  <tempo>, <bars>, marks: <name> = beat <n>

  SHOT LIST
  Beats | Time | On-screen words | Photo | Motion | Sound | New on screen
  ...
  Sources: <claim, price, offer> = <where from>

  STOPPED: reply APPROVED to build.

example:
  business: sprout
  input: |
    [the skill]

    Purpose: a "reasons" reel for Sprout, 15 to 20 seconds.
    Shapes: 9:16 and 4:5. Music: made in code. Voice: none.
    Photos on file: the pouch on a soft gradient; an adult pouring
    gummies into a hand.
    Approved words and claims:
    - "Rip. Tip. Enjoy."
    - Title: "Sprout Superfood Gummies"
    - "60+ ingredients, 21 vitamins & minerals, and 6g fiber" in 1 pack
    - No water, no mixing, no shaker
    - Third-party tested for 70 pesticides, 4 heavy metals, 16
      contaminants, 9 microbial contaminants
    - 2025 study, 12 weeks, 120 adults: vitamin C +40.1% (2.7x placebo)
    Offer: $29.99 first order with the text sign-up discount. "Renews
    at $49.99 each 4 weeks." Button text: "Start Now".
    Colours: cream #FFF7DF, deep forest #002C17, sunflower #FFCC2E.
    Fonts: Work Sans bold and medium, DM Mono.
  output: |
    BRIEF
    Purpose: reasons reel, 17.5 s. Shapes: 9:16, 4:5. Music: code-made.
    Voice: none. Placement: feed, watched with the sound off.
    Photos: front (pouch on gradient), hand (pouring).
    Offer: "$29.99 first order with text sign-up" and "Renews at $49.99
      every 4 weeks", both on screen. No percentage: the site shows
      52%, 55%, 49% and 58%, so none is used until one is confirmed.
    MISSING: Work Sans and DM Mono font files; the logo file; a photo
      that shows the testing (the tested-for reason is dropped until
      there is one); a photo of a single daily pack.

    STYLE GUIDE
    Colours: ground cream #FFF7DF (hero background); text deep forest
      #002C17 (headings); accent sunflower #FFCC2E (stars and badges),
      key word only.
    Type: Work Sans bold for lines (main line 200 px at 1080p), Work
      Sans medium for small lines (at least 28 px), DM Mono for the
      source line. Left-aligned at 120 px, sentence case.
    Ways in: rise through a mask, card rise. Ways out: lift through
      the mask, hard cut. No fades.
    Product: photos scaled whole, soft contact shadow, type never over
      the label.

    BEAT GRID
    96 bpm, 7 bars (beat = 0.625 s, bar = 2.5 s, 17.5 s).
    Marks: open = 1, what = 5, reason1 = 9, reason2 = 13, proof = 17,
    offer = 21, end = 26.

    SHOT LIST
    Beats | Time | Words | Photo | Motion | Sound | New
    1-4 | 0.00-2.50 | "Rip. Tip. Enjoy." | front | pouch on frame
      0, micro push 1.00 to 1.05; words rise one per beat | kick on 1 |
      pouch + words
    5-8 | 2.50-5.00 | "Sprout Superfood Gummies" | front | line
      lifts out, title rises | snare on 5 | title
    9-12 | 5.00-7.50 | "60+ ingredients, 21 vitamins & minerals, and 6g
      fiber" | hand | photo card rises; words type on | hit on 9 |
      hand photo
    13-16 | 7.50-10.00 | "No water. No mixing. No shaker." | hand,
      tighter | push 1.00 to 1.08; each phrase rises on a beat | ticks
      on 13, 14, 15 | three phrases
    17-20 | 10.00-12.50 | "Vitamin C in the blood: up 40.1%" + DM Mono
      "2025 study, 12 weeks, 120 adults. 2.7x placebo." | front |
      card rise; "40.1%" in sunflower | hit on 17 | figure + source
    21-25 | 12.50-15.63 | "$29.99 first order with text sign-up" then
      "Renews at $49.99 every 4 weeks" | front | lines swap one
      after the other | snare on 21, 23 | price, then renewal
    26-28 | 15.63-17.50 | "Start Now" + logo | front | micro push,
      button rises | final hit on 26 | end card (1.88 s)

    Sources: "Rip. Tip. Enjoy." = brand line; title = product page;
    60+/21/6g = label claim; no water = product facts; 40.1%, 2.7x =
    2025 study; prices = product page price box; "Start Now" = button.

    STOPPED. Nothing is built until you reply APPROVED.

tweaks:
  - what: The purpose
    how: Say "launch", "offer", "3 reasons", "bundle" or "closing card". Each changes the shot order; an offer reel leads with the price as the offer states it.
  - what: Shapes
    how: List every shape you need (9:16, 4:5, 1:1, 16:9). It renders the main one first, then the rest, and checks the app's covered areas on the tall one.
  - what: Voice
    how: Leave it out for a feed reel watched on mute. Add one only if you own the recording or a voice tool's licence covers it.
  - what: A reference reel
    how: Share a reel whose rhythm you like. It takes the pacing and grammar only, never its words, pictures or music.

judge:
  - The product is on screen in the first frame, and you know what it is by 2 seconds with the sound off.
  - Every word in the shot list has a source next to it.
  - The full price terms are on screen, not only the first-order price.
  - Something new appears every 2 to 4 seconds, and the end card is 2 seconds or less.
  - The review log shows at least three rounds and every score at 8 or more.

test:
  - Stop at the shot list and check every word and price against your site. Each line should have a source next to it, and the full price terms should be there, not only the first-order price.
  - Look at the first rendered frame at phone size with the sound off. You should know what the product is within 2 seconds.
  - Put a frame of the reel next to your product photo. The label, shape and colour should be identical, because nothing is redrawn.
  - Ask for a second shape (square after 9:16) and check that no text sits in the app's covered areas in either one.
  - Read the review log. Three rounds or more, every score 8 or above, and anything knowingly left imperfect named plainly.

improve:
  - Fill your brand file with what step 1 asks for (photos named by job, fonts, colour codes, logo, approved claims, offer terms), so it has nothing to ask next time.
  - Edit the style guide rules in step 3 to your own type sizes and allowed transitions, and keep the style guide and beat grid from your first reel.
  - If you always deliver the same shapes and lengths, write them into step 9 instead of asking each time.
  - Settle one discount number across your site and ads, and put only that number in your brand file. The reel shows whatever terms you give it.
  - Pair it with the skill that writes a flat graphic ad script, if you'd rather settle the words and order before anything is built.

works_best_with:
  tools:
    - {name: "Claude Code with Remotion", why: "Remotion draws each frame from code, and its agent skills let Claude Code build, render and re-check the reel on your computer."}
  inputs:
    - "Your product photos with clean cut-out edges as PNG files, so the pack sits on any background without a halo"
    - "A reel whose pacing you like, so the beat grid and cut rhythm start from something you've already approved"
    - "Your live offer page as it stands today, so every price and term on screen matches what buyers will see"
    - "A licensed music track, if you want real music in place of music made in code"

terms:
  - term: Beat grid
    meaning: A timing plan built on the music's beats, so every cut and text change lands exactly on the rhythm.
  - term: LUFS
    meaning: A standard measure of how loud a video sounds. -14 is a common target for social video.
  - term: Contact sheet
    meaning: A page of small frames from the video, so you can check every moment at a glance.
