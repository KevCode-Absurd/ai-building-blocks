new_slug: get-phone-video-script-that-sounds-unscripted
name: "A phone video script that sounds unscripted"
summary: "Give it your buyer and product facts. You get a four-part script, a shot list and two other openings to test."
job: make-video-ads

headline: "A phone video script that sounds unscripted"
subhead: Give it one buyer, your product facts and who will film it. You get a script that starts on the buyer's snag and spends most of its time on the product in someone's hands, with the length worked out from the real steps, a shot list and two other snags to test.

explain: |
  A video that looks filmed by a customer works because it sounds like a person, not a brand. Most scripts for these videos fail at exactly that. They list features, the creator sounds like they're reading, and the ending turns into a sales pitch.

  People tell stories in three moves: this was going on, but something got in the way, so I did this. Randy Olson calls it And, But, Therefore. This skill writes that spine first, then four parts. The snag opens it, in the buyer's own words. The hands part shows the product used in its real order, with one proof you can see, like the label held to the lens. Noticed says only what the speaker saw, tasted or did. The pointer says where to get it and one honest thing to know first. The length comes from the number of real steps, so it's never squeezed or padded.

when:
  - You're briefing a creator or customer to film a video about your product and need the words.
  - Your current phone-style ads sound read, not said.
  - You want one script that answers one specific doubt, such as "is this just candy?"

you_give:
  - One buyer, the moment the problem shows, their main doubt and their own words
  - Your product facts, how it's used step by step, handling rules, claims allowed and banned, and the price as stated
  - Who will say it (a real creator who has used it, an AI presenter, or a founder or customer on their own footage)
  - Your brand voice, banned words and past scripts (optional)
you_get:
  - The spine in one line, then the script in four timed parts
  - Notes on how to say it (tone, pace, where, how the phone is held)
  - A shot list part by part, saying which hand holds what
  - Two other snags to test, and a list of blanks the speaker fills

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, claims and a handful of real reviews underneath.
  - Describe one buyer and their doubt in a sentence or two. Say who will film it.
  - Read the script aloud standing up, at speaking pace. Rewrite any line you stumble on.
  - Turn it into a filming brief for your creator with the filming brief skill.

how_it_works:
  - title: Settles who says it
    text: A real creator may tell their own story, with blanks for their true details. An AI presenter gets no personal story or result.
  - title: Writes the spine
    text: One line, "situation, but snag, so what they did". No snag, no script.
  - title: Works out the length
    text: About 4 seconds for each real use step, plus time for the snag, what they noticed and the pointer.
  - title: Writes four parts
    text: Snag, hands, noticed, pointer. The hands part is the longest on screen and makes sense with the sound off.
  - title: Caps the claims
    text: Noticed holds only what the speaker saw, tasted, timed or did. At most two product facts, each also shown on screen.
  - title: Adds what the maker needs
    text: How to say it, a shot list with which hand holds what, and two other snags, each a different doubt.

output_shape: |
  Script: "<title>" (<seconds>, from <n> hand steps; <speaker>)
  Spine: <situation>, but <snag>, so <what they did>

  Snag (<times>): "<line>"
  Hands (<times>): "<words>"  [proof moment: <what is seen>]
  Noticed (<times>): "<observation or [blank]>"
  Pointer (<times>): "<where, plus one thing to know>"

  HOW TO SAY IT  <tone, pace, place, clothes, phone, face>
  SHOT LIST
  <part> <times>  <one action, which hand holds what>
  OTHER SNAGS (each read with the first hands line)
  <n> <doubt>: "<line>"
  BLANKS AND GAPS  <blanks, facts used, where it goes next>

example:
  business: sprout
  input: |
    [the skill]

    Buyer: the busy parent, 30 to 45, buys Sprout Adults for herself.
    Doubt: "Is this just candy?"
    Their words: "So easy to grab and eat on my way to the billion
    things I have to do as a mom." (review 15). "[Sprout] literally
    tastes like fruit snacks I ate as a kid." (review 12)
    Product: Sprout, daily greens gummies. Pouch of 28 daily packs.
    1 pack = 60+ ingredients, 21 vitamins and minerals, 6 g fiber.
    Every gummy comes Low Sugar or Sugar-Free. Take one pack from the
    pouch, tear it across the top, tip the gummies into a hand.
    Price: $29.99 first order with the text sign-up, then $49.99 every
    4 weeks.
    Approved claims: the pack facts above. "Supports digestion and gut
    health."
    Never say: fix, energy or immunity results, weight loss.
    Handling: pouch opens only at its resealable top; the pack tears
    straight across its top edge.
    Speaker: a real creator who has used it.
  output: |
    Script: "Not candy" (40 seconds, from 5 hand steps; real creator)
    Spine: these taste like the fruit snacks I grew up on, but that
    made me think they were candy, so I read the pack.

    Snag (0-8 s): "These taste like the fruit snacks I ate as a kid.
    Which worried me. [What you took before, in your words.]"
    [only if true for you]
    Hands (8-28 s): "This is one day. One pack. Look, 21 vitamins and
    minerals and six grams of fiber, in this. Tear the top, tip them
    out, little green bears."  [proof moment: the pack's label held to
    the lens, numbers readable]
    Noticed (28-34 s): "[What you noticed, from what you tasted or
    did. For example, how many days in a row you've kept it up, if you
    counted.]"
    Pointer (34-40 s): "They're on their site. Heads up, the $29.99
    first order is with their text sign-up. After that it's $49.99
    every four weeks."

    HOW TO SAY IT
    Bright, quick, a little wry. Kitchen in the morning, window light,
    bag on her shoulder. Plain top, no logos. Phone at arm's length
    for the snag, propped on the counter for the hands. Eyebrows up on
    "worried me". A small shrug at noticed.

    SHOT LIST
    Snag    0-8 s    face, medium; left hand holds a daily pack low
    Hands   8-12 s   from above: left hand holds the pouch open at its
                     resealable top, right hand takes out one pack
            12-17 s  right hand holds the pack to the lens, label
                     readable, on "21 vitamins"
            17-21 s  both hands tear the pack straight across the top
            21-25 s  left hand tips the gummies into the right palm
            25-28 s  she eats them
    Noticed 28-34 s  face, medium
    Pointer 34-40 s  face; picks up her keys on "every four weeks"

    OTHER SNAGS (each read with "This is one day. One pack.")
    1 Sugar: "I wanted greens, not a sugar habit." (then the hands
      show the Low Sugar label)
    2 Time: "Mornings here, there's no time to mix a shake."
      [only if true for you]

    BLANKS AND GAPS
    [What you took before] and [What you noticed] are the creator's own.
    If they have no true detail, they drop that line and tell us.
    Facts used: 21 vitamins and minerals and 6 g fiber, from the pack.
    The prices are offer terms, said as the business states them.
    Hand on to: the filming brief skill.

tweaks:
  - what: Who says it
    how: Change "real creator" to "AI presenter" and the script switches to "you" and observation, with no blanks for personal experience, because a made-up person can't have one.
  - what: The length
    how: Add or remove real use steps and the length follows, about 4 seconds a step. Ask for a fixed length and it tells you which steps it would drop to fit.
  - what: The snag
    how: Name the doubt or hassle you want to answer, such as price or taste. The spine, the proof moment and the pointer change to match it.
  - what: Handling rules
    how: Paste how the product may be held, opened and shown. If it may only be displayed, the hands part becomes the sealed product on a surface, turned to show the label.

judge:
  - Read it aloud. It sounds said, and no line would suit a polished advert's voice-over.
  - The spine has a real "but", and the script opens on it.
  - The hands part is the longest on screen and you could follow it with the sound off.
  - Every spoken fact is in your facts and also visible on screen.
  - Every first-person line is something the speaker could truthfully say, or a blank for them.
  - No stock hype words like "obsessed" or "life-changing".

test:
  - Leave out who the buyer is. It should stop and ask, because it writes no script without one buyer.
  - Run it for a real creator and for an AI presenter on the same facts. Only the creator version should have blanks and first-person lines.
  - Count the use steps in the shot list. The length should be close to 4 seconds a step plus about 20 for the rest.
  - Watch the shot list in your head with the sound off. If you can't follow the product being used, the hands part needs more steps.

improve:
  - Add your product's handling rules to "What you need" as standard, so every shot list opens and holds the product the right way.
  - Paste your buyers' own words from reviews each time, and save the snags that work to your brand file.
  - Add your banned words and past scripts to the say test, so it never repeats a snag you've already run.
  - Let the creator change any line they wouldn't say, as long as they keep the point, and note what they changed.
  - Pair it with the skill that turns an approved script into a filming brief for a real person, or one that makes AI presenter openings for a made-up one.

terms:
  - term: Spine
    meaning: The one-line story behind the script. What was going on, what got in the way, and what they did.
  - term: Snag
    meaning: The doubt or hassle the buyer has, said first so the right viewer recognises it.
  - term: Proof moment
    meaning: One thing the viewer can see that backs a fact, such as the label held to the lens.
  - term: Blank
    meaning: A gap in [brackets] for the speaker's own true detail. They fill it, or drop that line.
