new_slug: get-podcast-clip-ad-script-that-sells
name: Get a podcast clip ad script that sells
summary: A short two-person talk-show ad that changes one belief without sounding like an ad.
job: make-video-ads

headline: Change one belief your buyers hold, in a clip that sounds overheard instead of sold
subhead: Give it the belief you want to change, real customer doubts and your facts. It writes a 15 to 45 second exchange between a doubting Host and an explaining Guest, where every fact comes from your list and nobody claims a result.

explain: |
  Clips of two people talking at microphones get watched, because they feel like real conversation, not an ad. Done badly they turn into a fake expert in a studio saying the product changed their life. That's a testimonial and a credential you can't back, and buyers hear the ad copy straight away.

  This skill keeps the format honest. The Host voices a doubt your real customers have; the Guest answers with facts from your list, or passes on what reviews say, word for word and attributed. Neither is an expert, a customer or your founder, and neither claims to have used the product. Each turn is a sentence or two, with one fact, so it sounds like talk. The product sits on the table in view, and the offer appears as text at the end, never spoken.

when:
  - Your buyers hold a belief that stops them buying, and you can answer it with facts.
  - Your category has heard every claim, and a plain ad gets ignored.
  - You want a believable talking ad without hiring a presenter who pretends to be a customer.

you_give:
  - The one belief to change, the buyer stage and the length
  - Real customer doubts and words, with sources
  - Your product facts and a short reason it works
  - Every fact a speaker may state, your offer and banned claims
  - Video or still
you_get:
  - A line-by-line script for Host and Guest with visual notes
  - The structure chosen and a clip plan with words per clip
  - A six-word opener for sound-off viewers and the end text
  - A list of every fact said, with its source

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste the doubt or belief you want to change, in your customers' own words.
  - Paste the facts a speaker may say, one per line, with sources.
  - Say "video, 30 seconds" or "still".
  - Read it aloud with someone. If a line sounds like ad copy, ask for it to be rewritten as talk.
  - For a video, take the script to "Turn your podcast clip script into ready-to-make video shots".

how_it_works:
  - title: Checks it fits
    text: Suits a doubt or myth said out loud. It says so if your point needs a picture or the offer has many terms.
  - title: Sets the cast
    text: Two fictional, unnamed adults. Host on the left asks and doubts, Guest on the right explains.
  - title: Applies speech rules
    text: Speakers state facts about the product or pass on reviews, attributed. Never a result, a title or an unsourced number.
  - title: Sets one plain room
    text: No logos or signs, the product on the table facing the camera, the offer as text only.
  - title: Picks one argument
    text: One belief changes by the end, and the doubt is one real customers voiced.
  - title: Writes the video
    text: One of four structures, short turns of one fact each, the product named late, the Host closing.
  - title: Or writes the still
    text: A frame caught mid-reaction with one subtitle of ten words or fewer.

output_shape: |
  BELIEF  <they think ___; after this they think ___>
  STRUCTURE  <problem then fix, discovery, myth-bust, or what's on the table>
  SOUND-OFF OPENER  "<6 words>"

  Line | Speaker and words | On-screen text | Visual note
  1 | Host: "<doubt or reaction, not a greeting>" | <opener> | Host left, Guest right; <one action, one reaction>
  2 | Guest: "<one fact>" | - | ...
  ...
  <last> | Host: "<what they'll do next>" | <offer and call to action> | ...

  Clip plan: <clip> = <lines>, <words>

  FACTS SAID
  <fact> = <source>
  MISSING: <...>

example:
  business: sprout
  input: |
    [the skill]

    Belief to change: "A gummy can't hold enough to replace my powder."
    (a real doubt from the brand's buyer research)
    Buyer stage: solution aware. Video, 30 seconds.
    Facts a speaker may state:
    - One daily pack is about 20 g, "a small handful" of gummies
    - 60+ ingredients, 21 vitamins & minerals, and 6g fiber in 1 pack
    - About 100% of daily value for vitamins, about 25% for minerals
      (science page)
    Review on file: "[Sprout] has been the one thing I've been able to
    stick to." (brand site)
    Never: claims that it replaces a powder; any result as the
    speaker's own.
    Offer: $29.99 first order with text sign-up, renews at $49.99
    every 4 weeks. 30-day money-back, first order only.
    Brand name said: "Sprout".
  output: |
    BELIEF  They think a gummy can't hold enough. After this they
            think one pack holds more than they expected, and they
            know exactly what it doesn't.
    STRUCTURE  Myth-bust (the buyer research shows the belief)
    SOUND-OFF OPENER  "Can a gummy really hold enough?"

    Line | Speaker and words | On-screen | Visual note
    1 | Host: "A gummy can't hold enough to replace my powder." |
        Can a gummy really hold enough? | Two-shot, Host left, Guest
        right. Host taps the table once; Guest's eyebrows lift.
    2 | Guest: "It's a whole pack, though. About twenty grams, a
        small handful." | - | Single on Guest, hands showing the
        size; Host leans back, arms folded.
    3 | Host: "A small handful of candy." | - | Listener single: Guest
        half smiles, mouth closed.
    4 | Guest: "Sixty-plus ingredients, twenty-one vitamins and
        minerals, six grams of fiber." | - | Product close: the pouch
        on the table, front on.
    5 | Host: "Twenty-one. At full dose?" | - | Host single, one brow
        raised; Guest nods once.
    6 | Guest: "Vitamins, about a hundred percent of daily value.
        Minerals, about a quarter." | - | Two-shot; Host unfolds his
        arms.
    7 | Host: "Huh. At least that's honest." | - | Host single; Guest
        glances at the pouch.
    8 | Guest: "And the reviews keep saying, 'the one thing I've been
        able to stick to.'" | - | Guest single; Host looks at the
        pouch.
    9 | Host: "Okay. Send me that." | $29.99 first order with text
        sign-up. Renews at $49.99 every 4 weeks. 30-day money-back on
        your first order | Two-shot, pouch in the lower middle.

    Clip plan: 1 = lines 1-3 (25 words), 2 = lines 4-6 (25 words),
    3 = lines 7-9 (24 words).

    FACTS SAID
    About 20 g, a small handful: product page and brand file
    60+ ingredients, 21 vitamins & minerals, 6 g fiber: label claim
    About 100% vitamins, about 25% minerals: science page
    Review quote, word for word: brand site review
    Nobody says it replaces a powder: no claim on file for that. The
    Guest gives the numbers and lets the viewer decide.

tweaks:
  - what: The structure
    how: Ask for myth-bust when buyers hold a clear belief, discovery when the Guest can be surprised by a fact, or problem then fix when you have the problem in customers' words.
  - what: The length
    how: 15 seconds is one clip of two or three turns. 45 seconds runs to four clips. Over 45 seconds, use another format.
  - what: Still instead of video
    how: Ask for a still. You get one frame caught mid-reaction, a subtitle of ten words or fewer, and a full image prompt.
  - what: How the brand name is said
    how: Give the pronunciation if it's unusual. Otherwise it spells it as said and marks it inferred.

judge:
  - The opening line is a doubt or reaction, not "welcome back".
  - The Host's doubt is one your customers have said in their own words.
  - Every fact the Guest says appears in the facts list with a source.
  - Nobody says they tried it, saw results, or is an expert.
  - The offer only appears as on-screen text at the end.

test:
  - Run it on a doubt a customer said in their own words. The Host's first line should be that doubt, not "welcome back".
  - Check each fact the Guest says against your facts list. Every one should be there, with its source.
  - Run it twice on the same doubt. In neither version should anyone say they tried it, saw results or is an expert.
  - Read it aloud with a colleague, one part each. Any turn longer than two sentences, or any line that sounds written, needs fixing.

improve:
  - Paste your buyers' doubts, word for word from reviews and support emails, into "What you need" in the skill file, so step 5 always starts from a real one.
  - Add your allowed facts with sources to step 3 ("Follow the speech rules"), so the Guest only ever says those.
  - If you make a series, write your room and props into step 4, so every clip looks like the same show.
  - Pair it with the skill that turns a podcast clip script into cast, room and clip prompts for a video tool.

terms:
  - term: Myth-bust
    meaning: A conversation where one person states what buyers believe and the other gives the one reason it isn't so.
  - term: Sound-off opener
    meaning: A short version of the first line shown as text, for people watching with the sound off.
  - term: Buyer stage
    meaning: How much the buyer already knows about the problem and about you.
