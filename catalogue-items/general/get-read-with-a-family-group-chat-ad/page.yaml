new_slug: get-read-with-a-family-group-chat-ad
name: "A family group chat picture where the problem comes up"
summary: "Give it your story ad. You get four to six family messages that put the narrator on the spot."
job: make-image-ads

headline: "A family group chat picture where the problem comes up"
subhead: Give it your story ad. It names the group the way a real family would, gives up to three people four to six short messages where the problem comes up, ends with the narrator on the spot, and briefs a plain screenshot.

explain: |
  When the whole family knows about a problem, it gets hard to wave away. A group chat shows that in one look: someone raises it, someone piles on, and the narrator has no good answer. The group's name and the way they write tell the right reader this is their kind of family.

  This skill checks your story has family or friends in it, names the group as a real family would, and casts up to three people with made-up first names. It writes four to six messages under about 12 words each, so the chat reads in one look on a phone, and ends with a question to the narrator left hanging. No message names the product. The screen uses plain bubbles with no real app's colours, wallpaper or ticks, and it suggests typing the messages into a design tool so every word stays exact.

when:
  - Your story has family or friends who know about the problem.
  - Your buyers' families talk in group chats.
  - The problem is something people joke about, or keep noticing in each other.

you_give:
  - Your approved story ad, with the family or friends in it
  - Whether group chats are how your buyers talk to family (optional)
you_get:
  - A group name and up to three made-up senders
  - Four to six messages in order, with who sent each
  - A blank version and the line under the picture
  - A 60 to 120 word image prompt, and how to make it exact

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad. If it quotes the chat, those exact words are used.
  - Type the messages into plain bubbles in a design tool, or paste the prompt into your image tool.
  - Read every message in the result letter by letter, names included.
  - Read the flags. Any message written for the image needs a second look before it runs.

how_it_works:
  - title: Sets the house rules
    text: Square, a plain screenshot, no logo, price, product or real app look, made-up names, no faces as contact photos.
  - title: Checks the fit
    text: Family or friends in your story, and group chats in your market. Anything unclear is marked inferred.
  - title: Names the group
    text: A few words a real family would use, like "Sunday dinners", with one emoji at most.
  - title: Writes the pile-on
    text: Someone raises it, someone adds what everyone knows, the narrator answers weakly or not at all.
  - title: Ends on the narrator
    text: A question to them left hanging, so your story's first line has something to answer.

output_shape: |
  SCENE             <what someone scrolling would say they saw>
  FIT               <family in story: yes | inferred>, <group chats: yes | inferred>
  GROUP AND TIME    <group name>, <time on screen>
  SENDERS           <made-up first names and who each is>
  MESSAGES          <sender>: "<text>", in order
  BLANK VERSION     <the screen with empty bubbles>
  LINE UNDER IMAGE  <words> (<which line>, <characters>)
  FLAGS             <words written for the image, anything inferred>
  IMAGE PROMPT      <60 to 120 words, every message in quotes once>
  HOW TO MAKE IT    <design tool or image tool>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved; narrator: a customer who agreed, built on
    review 5, example only):
    At Sunday dinner my brother counted the supplement bottles in my
    cupboard. Seven. Probiotic gummies, B12 gummies, multivitamin
    gummies, a greens powder I'd stopped mixing.
    That night my sister asked in the family chat which ones I
    actually took. I didn't answer.
    Now it's one Sprout daily pack: 60+ ingredients, 21 vitamins and
    minerals and 6 g prebiotic fiber, in a small handful of gummies.
    I stopped buying the others.

    Buyer: the quitter who wants to stick, 28 to 45.
  output: |
    SCENE             A family group chat where a brother and sister
                      tease someone about the seven bottles in their
                      cupboard.
    FIT               Family in the story: yes. Group chats in this
                      market: inferred.
    GROUP AND TIME    "Sunday dinners", 9:14 pm.
    SENDERS           Leo (brother) and Ana (sister). The narrator
                      stays silent, as the story says.
    MESSAGES          Leo: "counted the supplement bottles in your
                      cupboard. seven"
                      Ana: "seven?? which ones do you actually take"
                      Leo: "my guess is none of them"
                      Ana: "hello??"
    BLANK VERSION     The same screen with four empty bubbles in the
                      same places.
    LINE UNDER IMAGE  Seven bottles. Which ones? (a question about the
                      thing, 26)
    FLAGS             Words written for the image: read before it
                      runs. The story gives the count and the sister's
                      question, and the rest follows from it. Leo and
                      Ana are made-up names. No message names a product
                      or a rival.
    IMAGE PROMPT      Square 1:1 plain phone screenshot of a group chat,
                      slightly cropped at the top. A thin top bar shows
                      the group name "Sunday dinners" and three blank
                      grey circles. Time "9:14 pm". Plain light grey
                      bubbles on the left, each with a small coloured
                      first name above it, in this order: Leo "counted
                      the supplement bottles in your cupboard. seven",
                      Ana "seven?? which ones do you actually take", Leo
                      "my guess is none of them", Ana "hello??". Plain
                      white background. No app name, no logo, no
                      wallpaper, no ticks, no contact photos, no
                      notification banner.
    HOW TO MAKE IT    Type the four messages into plain bubbles in a
                      design tool and export a square image.

tweaks:
  - what: Who's in the group
    how: Name who'd really be in it, siblings, parents, old friends or flatmates. Their names and the group name show the reader whose family this is.
  - what: The narrator speaks
    how: Ask for "the narrator replies last" if your story has them answer. Their reply should give the problem away, never fix it.
  - what: How they write
    how: Tell it how your buyers write to family, such as full sentences, nicknames or another language. It writes the chat that way.
  - what: Fewer messages
    how: Ask for four messages when your buyers scroll fast. The pile-on still works with one question and two replies.

judge:
  - The problem comes up as something the family knows or jokes about.
  - No message names the product, recommends anything or states a result.
  - The chat ends with the narrator on the spot, and your story's first line picks it up.
  - Every name is made up, and the screen looks like no real app.
  - It reads in one look on a phone, with no walls of emoji.

test:
  - Give it a story with only one other person in it. It should send you to the two-person text skill.
  - Give it a story that quotes the chat. The messages should match word for word.
  - Look at the finished picture on your phone at arm's length. If you can't read the names, ask for fewer messages.
  - Run it against the two-person text version of the same story. Keep whichever brings more readers to the offer.

improve:
  - Add how your buyers talk to family (language, nicknames, emoji or not) to your brand file.
  - Quote the chat in your story word for word. Then the picture copies the story and needs no extra check.
  - Keep one chat layout for all your group chat ads, built once in your design tool.
  - Pair it with a story ad skill, so the first line answers the question left hanging.

works_best_with:
  tools:
    - {name: "Figma", why: "You type each message and name into plain bubbles yourself, so every word is exact and the look copies no app."}
    - {name: "Nano Banana Pro", why: "Google recommends its Gemini 3 Pro Image model for accurate text, if you'd rather generate the screenshot."}
    - {name: "Any good chat AI", why: "Writing family banter that sounds real is something Claude, ChatGPT and Gemini all do well."}
  inputs:
    - "Reviews or comments where buyers mention what their family says about the problem, so the pile-on is real"
    - "The language and nicknames your buyers use with family, so the chat sounds like theirs"
    - "Which chat apps your market uses most, so the plain layout still feels familiar"

terms:
  - term: Group chat
    meaning: A message thread shared by a family or a group of friends.
  - term: Blank version
    meaning: The same picture with empty bubbles, so you can change the words later.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
