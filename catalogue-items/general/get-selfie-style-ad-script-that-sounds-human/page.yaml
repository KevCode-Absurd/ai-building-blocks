new_slug: get-selfie-style-ad-script-that-sounds-human
name: "A selfie-style ad that sounds like a real person"
summary: "Give it your buyer's doubt and your claims. You get a timed phone-style script that answers the doubt honestly."
job: make-video-ads

headline: "A selfie-style ad that sounds like a real person"
subhead: Give it your buyer's doubt, your facts and who will be on camera. You get a 15 to 60 second script in five timed beats, or one still that looks like a posted phone photo, where every claim has a source.

explain: |
  A video that looks filmed on someone's phone gets watched like a friend's post. Then one line gives it away. A hype word, three numbers in a row, or a pack held up beside a grin, and people scroll on. If the person on screen was made by AI, a line like "this worked for me" is also untrue, and ad rules say a fake customer must be labelled as one.

  So this skill decides who is talking before it writes anything. A real creator speaks for themselves, with blanks left for the details only they know. An AI presenter talks to "you", shares what they've noticed, or quotes real customers word for word. Then it writes five beats: a hook, the doubt, the product shown in a hand, a result that claims less than it could, and a friendly hand-off. One detail carries the ad, and the word count is set to fit the length.

when:
  - You want an ad that feels like a post, filmed by a creator or made with an AI presenter.
  - Your buyers have one doubt that seeing the product in a hand can settle.
  - You need a still that looks like someone's phone photo, not a studio shot.

you_give:
  - Why people buy, how much your buyer knows already, and the length
  - Video or still, and real creator or AI presenter
  - Your buyer's doubt, their moment and their own words, with quotes and sources
  - How the product opens and is used, and any result you can see
  - Your approved and banned claims, never-say list and current offer
you_get:
  - A five-beat script with what's said, on-screen text and a picture note for each beat
  - The one detail that carries the ad, its source, and a word count that fits the length
  - Or, for a still, the caption, the moment, how it was taken and an image prompt
  - Every claim, number and quote listed with its source, plus the AI label line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, claims and a few real reviews.
  - Say what you want, for example "video, 30 seconds, AI presenter".
  - Name the doubt to answer, in your buyer's words if you have them.
  - Read beat 4 again. It should claim less than your facts allow.
  - Take the script to "Turn your selfie-style script into consistent clips" for the video prompts.

how_it_works:
  - title: Checks a phone video fits
    text: One person with a phone is good at a shared problem and a product shown in a hand. It says so when your point can't be seen.
  - title: Settles who is speaking
    text: A real creator gets blanks for their own details. An AI presenter talks to "you" and never claims a result.
  - title: Picks one detail
    text: One number, time or size from your facts carries the ad. Price and offer terms don't count.
  - title: Writes five beats
    text: A hook that names the topic fast, the doubt, the product in use, an honest result and a hand-off.
  - title: Times the words
    text: About 2.5 words a second, so 30 seconds holds about 70 words.
  - title: Plans the pictures
    text: Tall frame, real room light, the product in hand before it's named, and a new view every few seconds.

output_shape: |
  Beat | Says | On screen | Picture
  1 HOOK | "<mid-thought, no brand name>" | <short text> | <how it's filmed>
  2 DOUBT | "<the buyer's doubt>" | ... | ...
  3 SHOW [DEMO] | "<the product in use>" | ... | <one action per cut>
  4 HONEST RESULT | "<less than the facts allow>" | <source> | ...
  5 HAND-OFF | "<what to do next>" | <offer as it is> | ...
  (real creator: [blanks] for their own details)

  ANCHOR  <the one detail>, from <source>
  WORDS  <count>, about <seconds> at 2.5 words a second
  DISCLOSURE  <AI label and on-screen line, if any>

  CLAIMS, NUMBERS AND QUOTES
  <item>   <source>
  MISSING: <what it needed and didn't get>

example:
  business: sprout
  input: |
    [the skill]

    Video, about 30 seconds. AI presenter.
    Why people buy: daily greens you'll keep taking.
    Buyer: has quit greens powders before. Knows the problem, not
    this fix.
    Doubt: "A gummy can't hold enough to replace my powder."
    Moment: the kitchen on a weekday morning, about to leave.
    Quote: "[Sprout] has been the one thing I've been able to stick
    to." (review, brand site)
    Product: one daily pack, torn straight across the top, a small
    handful of green gummies tipped into a palm. No water, no
    mixing, no shaker. No visible result.
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g
    fiber" per pack. Minerals about 25% of daily value.
    Never say: fix, "everything you need", energy or immunity
    results, weight loss.
    Offer: $29.99 first order with text sign-up, renews at $49.99
    every 4 weeks.
  output: |
    Beat | Says | On screen | Picture
    1 HOOK | "Quick question. How full is the greens tub at the back
      of your cupboard?" | How full is your greens tub? | Arm's-length
      selfie, kitchen, window light from the left. Coat half on.
    2 DOUBT | "You've probably figured a few gummies can't do what a
      scoop of powder does." | - | Cut closer on "gummies". The
      green pouch already in her free hand, still sealed.
    3 SHOW [DEMO] | "Here's the daily pack. Tear it across the top,
      tip it out. Twenty-one vitamins and minerals in that handful.
      No water, no shaker to wash." | 21 vitamins & minerals per
      pack | Phone propped on the counter, looking down. One pack out
      of the pouch, torn across the top, gummies tipped into her
      palm. Then very close on the palm.
    4 HONEST RESULT | "One customer put it like this. 'The one thing
      I've been able to stick to.'" | "The one thing I've been able
      to stick to." Customer review, brand site | Back to selfie,
      gummies in hand, a small shrug.
    5 HAND-OFF | "It's on their site. First order's twenty-nine
      ninety-nine if you sign up by text." | $29.99 first order with
      text sign-up. Renews at $49.99 every 4 weeks. | She eats the
      gummies and picks up her keys.

    ANCHOR  21 vitamins and minerals, from the product page. The 60+
    ingredients and 6 g of fiber stay out, so one detail carries it.
    WORDS  82, about 33 seconds at 2.5 words a second.
    DISCLOSURE  Platform AI label on. Small "AI presenter" line on
    screen through beat 1.

    CLAIMS, NUMBERS AND QUOTES
    21 vitamins and minerals per pack    approved claim, product page
    No water, no shaker                  how it's used, brand file
    "The one thing I've been able to
    stick to."                           review, brand site, exact
    $29.99, $49.99, text sign-up         price page
    The doubt is answered by what's shown. Nothing says it replaces
    a powder, and with minerals at about 25%, nothing says
    "everything you need".
    She never says she takes it, feels better or saw a result.
    MISSING: nothing for this script.

tweaks:
  - what: Real creator or AI presenter
    how: Switch to "real creator" and the beats move to "I", with blanks like "[when you noticed]" for their own true details.
  - what: Video or still
    how: A still is one moment mid-use, taken as a selfie, mirror photo or look down at the hands, with one caption of 12 words or fewer.
  - what: The doubt
    how: Name a different doubt ("isn't this just candy?") and the Doubt and Show beats change to answer it with what's shown.
  - what: Hook options
    how: Ask for three hooks. Each comes in a different way, such as the situation, a question or the product in use, on the same body.

judge:
  - The hook has no greeting and no brand name, and you can tell the topic in the first few seconds.
  - There's one number or detail in the spoken lines, and it's in your facts.
  - An AI presenter never claims a result or a story of their own, and every quote has a source.
  - Beat 4 claims less than your facts allow.
  - The word count fits the length, at about 70 words for 30 seconds.
  - Nothing sounds like stock ad talk ("obsessed", "life-changing", "buy now").

test:
  - Count the numbers in the spoken lines, leaving out price. You should find one.
  - Run it once as "AI presenter" and once as "real creator". Only the creator version should have blanks and "I" lines.
  - Give it no customer quote. Beat 4 should become an observation, with nothing in quotation marks.
  - Read it aloud with a timer. It should land within a few seconds of the length you asked for.

improve:
  - Paste your buyers' own nouns from reviews into "Buyer's words" in the skill file, so the Doubt beat sounds like them.
  - Add your brand's pet phrases to the hype list in step 5, so they get caught too.
  - Write how your product opens and what must never show into step 7.
  - Keep the hook that wins in your brand file, then test new hooks on the same body.

works_best_with:
  tools:
    - {name: "Claude", why: "Keeps the speaker rules and the one-detail limit in view across a long brief."}
    - {name: "Veo 3.1", why: "Turns a start frame of your AI presenter into short talking clips with the lips matched to the line."}
  inputs:
    - "Support emails or return reasons, so the doubt comes from more than reviews"
    - "A phone clip of someone opening and using the product, so the Show beat follows the real steps"
    - "The first three seconds of your best ad so far, so new hooks have something to beat"
    - "For a real creator, their own notes on how they used it, so the blanks fill with true details"

terms:
  - term: Hook
    meaning: The first few seconds, which decide whether people keep watching.
  - term: Anchor
    meaning: The one number, time or size that carries the ad.
  - term: AI presenter
    meaning: A made-up adult made with a video tool. Not a customer, so they can't claim a result.
