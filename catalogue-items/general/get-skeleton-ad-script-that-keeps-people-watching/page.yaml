tweaks:
  - what: Which way it runs
    how: Without your product, the old way piles up and the peak is a mess people enjoy watching. With it, the good effect spreads. Choose "with it" only if you can back every rung that shows a result.
  - what: What grows on screen
    how: Ask for a pile, a space, a crowd or reach. A crowd suits things people notice, like a scent or a bag. A space suits things that protect or maintain.
  - what: The label on each rung
    how: Counts, distances and crowd sizes are free. A time label like "Week 3" next to a result reads as a promise, so give a sourced time point or keep the result off it.
  - what: Length
    how: 15 seconds drops rung 2 and keeps about 30 words. 35 seconds gives each rung more room at about 75 words. A still shows one frame, or two panels for buyers comparing options.
  - what: The skeleton
    how: Give it one signature item it wears in every ad, like a cap or scarf, so people start to know it. Or dress it for the place.

judge:
  - The question is about the viewer's habit, not your product, and the last rung answers it.
  - Each rung goes one step further on the same thing, and nothing else changes.
  - Any number or time tied to a result points to a claim you actually hold.
  - The skeleton never speaks and its bones never change. Only its situation does.
  - The product shows up once, after the peak or in the first rung, and the ad never stops to sell midway.

test:
  - Run it on a product with no time points you can back. Every label should come back as a count, distance or crowd, with no result next to it.
  - Read the four rungs out of order to a colleague and ask them to put them back. If they can't, the climb isn't steep enough.
  - Run the same brief twice. The game sentence should stay close; if it jumps to a new idea, write the old habit more exactly in your brief.
  - Time yourself reading the script aloud at an easy pace. A 25-second script should take 23 to 28 seconds.

improve:
  - Add the habit your buyers quit, in their own words, to "What you need" in the skill file, so every run starts from the real old way.
  - Write your product-showing rules (how the pack opens, what never appears) into the video section, so picture notes get them right first time.
  - Pick one signature item for your skeleton and write it into "The skeleton", so it becomes a character people know across ads.
  - Save the question that wins in your brand file, then test new questions on the same game.
  - Pair it with the skill that turns a skeleton script into shots and prompts for your image and video tools.

