new_slug: get-skeleton-ad-script-that-keeps-people-watching
name: "A funny skeleton ad that keeps people watching"
summary: "Name the habit you replace. You get a funny skeleton script that climbs four steps to your product."
job: make-video-ads

headline: "A funny skeleton ad that keeps people watching"
subhead: Give it your product, the old habit it replaces and your approved claims. It finds the one thing that grows, asks an open question, and climbs four rungs to a silly peak, lived by a cartoon skeleton. Then your product lands once.

explain: |
  Some selling ideas are about things building up: the tubs you gave up on, the mess a small problem makes over a year. A camera can't film that in 30 seconds. A cartoon skeleton can, and an open question ("How many tubs can one cupboard hold?") keeps people watching until the answer.

  This skill builds the script like a comedy sketch. It finds the "game", the one thing that grows, and picks how each step is counted on screen: a count, a distance, a crowd or, only with proof, a time. Then it climbs four rungs, from true to life to the place giving up. Every rung changes one thing in one place, so the climb reads with the sound off. Any number tied to a result must come from your approved claims. Silly exaggeration is free.

when:
  - Your product replaces a habit or a pile of old things, and you want to show where the old way ends up.
  - You need an ad for people who don't yet think they have a problem, and a straight product ad would get skipped.
  - You want something funny and visual that still keeps every claim honest.

you_give:
  - Your product, who it's for, how much they already know, and the length (15, 25 or 35 seconds, or a still)
  - The old habit or old things it replaces, and how your product is used
  - Your approved claims, any time points you can back with a source, and your offer
  - Review lines about the old way (optional)
  - A signature item for the skeleton, like a cap or scarf (optional)
you_get:
  - The game in one sentence, what grows, how it's counted, and why it fits
  - A script table with each rung's label, narration, picture beats and seconds
  - A timing map with the word count, or a still with every word and an image prompt
  - A claims list showing which labels are free and which need a source

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts and approved claims underneath. Your brand file works.
  - Write the old habit your product replaces, in your customers' words if you have them.
  - Say the length ("video, 25 seconds" or "still") and who the ad is for.
  - Check the claims list. Any rung with a number tied to a result should point to a claim you hold.
  - Take the script to the skill that turns a skeleton script into shots, to make it.

how_it_works:
  - title: Checks the fit
    text: Confirms the idea is about something building up, which suits people who don't see the problem yet. A change in a body is never the subject.
  - title: Finds the game
    text: Writes "the more X, the more Y grows" in one line, and picks whether it runs without your product (a pile-up) or with it (a win).
  - title: Picks what grows
    text: A pile, a space, a crowd or how far the effect reaches. Then a label for each rung, preferring counts over times.
  - title: Writes the question
    text: One open question about the viewer's habit, under 10 words, that the last rung answers.
  - title: Climbs four rungs
    text: True to life, a bit much, silly, then the peak. Only one thing changes each time, in one place.
  - title: Lands the product once
    text: Right after the peak, or in the first rung if the ad runs with your product. Then the offer, with exact terms on screen.
  - title: Checks every claim
    text: Allows a result, time or count claim only if it's approved. Plain labels and silly exaggeration are free.

output_shape: |
  GAME      The more <habit>, the more <thing you can see> grows.
  RUNS      <without it / with it>   GROWS <pile / space / crowd / reach>
  LABEL     <count / distance / crowd / time>
  WHY       <one line>

  QUESTION  "<open question about the viewer's habit>"

  #  label   narration                 picture (wind-up, change, reaction)   s
  <one row per rung, then the turn, the claim line and the close>

  ON SCREEN (close)  <exact offer terms>

  TIMING  <words> spoken words (target <target>), about <seconds> s

  CLAIMS
  <label or claim>   <free, or approved claim and its source>
  Not used: <claims left out, and why>
  MISSING: <facts it needed and didn't get>

