terms:
  - term: Game
    meaning: The one unusual thing in a comedy bit that keeps coming back bigger. Here, the thing that grows each rung.
  - term: Rung
    meaning: One step of the climb. Each rung has a label, one narrated line and one picture.
  - term: Match cut
    meaning: A cut between two shots framed the same way, so only the thing that changed stands out.
