new_slug: get-talking-openings-that-keep-viewers-watching
name: Get talking openings that keep viewers watching
summary: Two or three new 6-second spoken openings for an ad you already run, plus the prompts to make them.
job: make-video-ads

headline: "New openings that keep viewers watching your ad"
subhead: Give it the ad you already have, your product photos and your buyer. It writes 2 or 3 opening lines that each stop scrolling a different way, and the prompts to make them with a made-up AI presenter who lifts your product on a cue word.

explain: |
  Most people see only the first few seconds of an ad. If the opening doesn't hold them, the rest never gets seen, however good it is. Writing a whole new ad to fix that is slow. Swapping in a new opening and testing it is fast.

  This skill writes openings that lead straight into your ad's first line. Each one uses a different way to stop the scroll: a habit the right buyer recognizes, a customer's real words, a doubt named before they think it, a number said plainly. Each is 18 words or fewer, said by a made-up adult presenter in one real-looking room, with your product lifted into view on one cue word. It never lets the AI presenter claim a personal result, and every fact comes from your brand, word for word.

when:
  - You have an ad that explains well but loses people in the first seconds.
  - You want to test several openings on the same ad without filming a new one.
  - You need a talking opening but don't have a creator available.

you_give:
  - The ad you already run (its first spoken line, first frame, who's in it and where)
  - Your product photos (front, in hand, in use), how it's used and what it replaces
  - Your buyer, what almost stops them, their own words, and your approved claims
  - An approved AI presenter, if you have one (optional)
  - The clip length your video tool makes (optional, 6 seconds by default)
you_get:
  - A line-up of 2 or 3 openings, each with a different approach, a cue word and a pace
  - Fixed descriptions of the presenter and the room
  - An opening image prompt and a video clip prompt for each opening
  - A checklist for the finished clips and what to deliver

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste the first line of your existing ad and describe its first frame. The full script is better.
  - Paste your brand facts, approved claims and a few real reviews. Attach product photos.
  - Approve one opening line before anything is made. Read it aloud with your ad's first line.
  - Make the opening image, then one clip, then the rest. Test each opening on the same ad as separate ads.

how_it_works:
  - title: Applies the rules
    text: Each line is written against your ad, said by a made-up adult who claims nothing only a real customer could, 18 words or fewer, ending on a closed mouth.
  - title: Picks the presenter
    text: Reuses your approved presenter, or offers three from your buyer profile. Never a look-alike of a real creator.
  - title: Chooses an approach for each
    text: Picks from recognizable habit, customer quote, doubt first, number first and others, only where your facts support it.
  - title: Sets a pace
    text: Quiet, fast or direct, described as what you see and hear. At most one quiet opening per batch.
  - title: Checks each line
    text: Fits the clip with half a second to spare, every fact word for word, and leads into your ad's first line.
  - title: Shapes the 6 seconds
    text: Presenter mid-thought at 0, the line, the product lifted on the cue word around second 4, a still last half second.
  - title: Writes the prompts
    text: An opening image, then a clip prompt in phone-video words, with no music, no subtitles and no film terms.

output_shape: |
  LINE-UP (cue word in *stars*)
  <n> <approach> | <pace> | <words>
    "<opening line with the *cue* word>"
    Room: <room>. Product: <where it starts, when it's lifted>
    Leads into: <the ad's first line, and what pays it off>
  Not used: <approaches the facts don't support, and why>

  PRESENTER  <fixed description, a made-up adult>
  ROOM       <the one room and its light>

  OPENING IMAGE (<opening>)
  Attach: <each reference and what it's for>. <first frame>

  CLIP PROMPT (<opening>)
  <aspect, length, speed, references, place, objects, camera>
  <0-4 s line>, <cue and lift>, <last half second still>
  Voice: <age, pace, traits, accent>. Sound: <room, product, no music>

  CHECKS PER CLIP  <what to check>
  DELIVER  <raw clip, last frame, line, approach>
  MISSING: <facts it needed and didn't get>

example:
  business: sprout
  input: |
    [the skill]

    Ad to go in front of: "Powder tub", video, about 25 seconds.
    First line: "You bought the big tub of greens powder. Again."
    Line 4: "Sprout is 60+ ingredients, 21 vitamins and minerals and
    6 g of fiber in one daily pack."
    First frame: our approved AI presenter (man, early 30s) at a
    kitchen counter, morning, holding a half-used powder tub.
    Product: Sprout. Photos attached: pouch front, one daily pack in a
    hand, gummies in a palm. One pack a day, torn straight across the
    top. Visible result: none.
    Buyer: the quitter who wants to stick, 28 to 45. Doubts: "A gummy
    can't hold enough to replace my powder." "They are expensive."
    Review 1: "[Sprout] has been the one thing I've been able to stick
    to." (already used as line 6 of the ad)
    Approved claims: "60+ ingredients, 21 vitamins & minerals, and 6g
    fiber" in 1 pack.
    Never say: fix, energy or immunity results, weight loss.
    Real deadline: none.
  output: |
    LINE-UP (cue word in *stars*)
    1 Put it down | Fast | 15 words
      "Put the shaker down. Your daily greens can come in a little
      pack you *tear*."
      Room: kitchen counter. Product: a daily pack low in his hand,
      lifted to chest height on "tear", front to the lens, not torn.
      Leads into: "You bought the big tub of greens powder. Again."
    2 Recognizable habit | Direct | 12 words
      "Scoop, shake, gag, then the shaker sits in the sink till
      *Friday*."
      Product: the pack on the counter, lifted on "Friday".
      Leads into the same first line; the ad's line 2 (the sludge in
      the shaker) pays off the habit.
    3 Doubt first | Direct | 12 words
      "Think a handful of gummies can't hold much? Wait for the
      *numbers*."
      Product: pack in hand, lifted on "numbers".
      Pays off: the ad's line 4 says the numbers word for word.
    Not used: watch this (no visible result), customer quote (the ad
    already uses the strongest review), number first (line 4 already
    says the numbers), replaces these (no approved claim that it
    replaces powder), real deadline (none). No quiet pace: the ad
    opens bright.

    PRESENTER  The approved AI presenter from "Powder tub" (man, early
    30s), worded exactly as in his approved picture. A made-up adult,
    never called a customer.
    ROOM  The same kitchen: counter, window, morning daylight.

    OPENING IMAGE (opening 1)
    Attach: presenter picture = the man; pack-in-hand photo = the
    product. He stands at the counter, mouth just opening, eyes on the
    lens, the daily pack low in one hand, front uncovered. Phone video
    look, window light only, nothing important in the top or bottom
    sixth of the frame.

    CLIP PROMPT (opening 1)
    9:16, 6 seconds, real speed. References: presenter picture, pack
    photo. Place: the kitchen above; only the counter, the pack and a
    shaker bottle in the scene. Camera: held at arm's length.
    0-4 s: he says "Put the shaker down. Your daily greens can come in
    a little pack you tear." Bright, quick, eyebrows moving, his free
    hand pushes the shaker aside, a small lean in. About 4-5 s, on
    "tear": he lifts the pack to chest height beside his face, front
    to the lens. Last half second: mouth closed, eyes on the lens,
    pack held still.
    Voice: man, early 30s, quick, bright and wry, plain US accent.
    Room: faint kitchen hum. Pack sound: a soft foil crinkle on the
    lift. No music, no subtitles.

    CHECKS PER CLIP
    Whole line said word for word, not rushed. Lips match. The pack
    comes up on the cue word, matches its photo and is not torn. Last
    frame: mouth closed, pack still, sits beside the ad's first frame.
    DELIVER  raw clip, its last frame as a picture, the line, the
    approach. Test the ad with each opening as a separate ad.
    MISSING: your tool's prices. The batch is 1 image and 3 clips.

tweaks:
  - what: Which approaches
    how: Look at what you can back first. A real review allows the customer quote. A sourced number allows number first. A visible result allows "watch this". A real offer end date allows a deadline. Without the fact, that approach is skipped.
  - what: The pace
    how: Quiet is low and steady (10 to 14 words). Fast is bright with one free hand (14 to 18). Direct is level and square (12 to 16). Your brand voice decides first; match the pace of your ad's opening.
  - what: The presenter
    how: Reuse an approved presenter so the opening and the ad match. If your ad has a real creator, use their own footage or a plainly different person, never an AI look-alike.
  - what: Clip length
    how: 6 seconds suits most lines; ask for 8 for a quiet opening. If a line won't fit, it proposes shorter words for you to approve, and never cuts it silently.

judge:
  - Each opening uses a different approach. None starts with a greeting, "so" or your brand name.
  - Each line is 18 words or fewer and has one cue word marked.
  - Read each one aloud, then your ad's first line. It flows.
  - The presenter never says "I tried it", "this worked for me" or a personal story.
  - Every fact is your brand's, word for word, and every quote has its source.
  - The last frame is a closed mouth and a still product.

test:
  - Give it an ad with no visible result and no review. It should skip "watch this" and "customer quote" and say why, not write them anyway.
  - Read each opening aloud with a timer, followed by your ad's first line. Each should finish with half a second to spare inside the clip length.
  - Run it twice on the same ad. Approaches may change, but every fact and quote should stay word for word.
  - Make one clip before the batch and play it in front of your ad on your phone. If the join jumps (a word cut off, a product that moves), fix that clip before making the others.

improve:
  - Paste your full ad script into "What you need" rather than only the first line, so it can check each opening is paid off later in the ad.
  - Add your approved presenter's fixed description to the skill file, so every batch reuses the same face.
  - Write your banned phrases and claims into step 1's rules, so no opening needs a second check.
  - Keep a note of which approach won on each ad in your brand file, and ask for that approach first next time.
  - For an opening with no talking, pair it with the skill that makes wordless, satisfying openings.

terms:
  - term: Opening (hook)
    meaning: The first line or first few seconds of an ad, whose only job is to make the right person keep watching.
  - term: Cue word
    meaning: The word in the line where the presenter lifts the product into view.
  - term: AI presenter
    meaning: A made-up adult generated by a video tool. Not a customer, so they can't claim personal results.
