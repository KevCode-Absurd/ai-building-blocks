new_slug: get-usable-creator-videos-from-one-clear-brief
name: Get usable creator videos from one clear brief
summary: A filming brief a real creator, customer or founder can follow first time, in their own words.
job: make-video-ads

headline: Get creator videos back at the right length, in good light, with every shot you asked for
subhead: Give it your approved script, what you need delivered and how the product is used. It writes a brief with the idea, the openings to film, the points to hit in their own words, extra shots, filming rules and how to send the files.

explain: |
  A vague brief gets you the wrong length, a window behind the creator's head, no shot of the product being opened, and lines read off a screen. A brief that scripts every word is worse: it asks them to say things that never happened to them, which is dishonest and sounds it.

  This skill gives them a rail, not a script. Each point of the approved script becomes a beat with a blank for their own true detail, and it tells them to leave a beat out if they have nothing true to put there. It only asks them to film openings that are true for them. It adds the extra shots an editor needs, plain do and don't rules for light, sound and framing, and exact file names. Anything you haven't confirmed, like the deadline or where the video will run, is flagged at the top.

when:
  - A customer, creator or founder is about to film a video from a script you've approved.
  - Past creator videos came back unusable (wrong length, bad light, no product close-ups).
  - You want to be sure nobody is asked to claim a result they didn't have.

you_give:
  - The approved script (selected openings, body points, the one number, the verdict and the handoff)
  - What you need delivered (length, shape, extra shots, raw files, deadline, where it will run)
  - How the product is opened, held and used
  - Words and claims they must never say
  - Your brand voice (optional)
you_get:
  - A list of anything you still need to confirm, at the top
  - The idea in 3 to 5 sentences, and the openings to film
  - The body points as beats with blanks for their own details
  - An extra-shot checklist, filming do and don't rules, and file-sending instructions

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste your approved script underneath, then your delivery needs and how the product is used.
  - Add your never-say list. If you don't have one, write the claims you can't make.
  - Fix every [CONFIRM] at the top before you send the brief.
  - Send it to the creator as it is. The skill doesn't send or post anything.

how_it_works:
  - title: Writes the idea
    text: Says in 3 to 5 sentences who is talking, where, what happens and what the viewer is left thinking, and why it should feel like a person's post.
  - title: Lists the openings
    text: Only the approved ones, each a different way in. First-person openings are marked "film only if true for you".
  - title: Turns points into beats
    text: Setup, shown use, the number, verdict and handoff, each with [blanks] for their own true details and a rule to drop a beat they can't fill.
  - title: Adds extra shots
    text: The product where they use it, picking it up, opening it the real way, close-ups, the name to camera, plus shots for this idea.
  - title: Sets filming rules
    text: Framing, light, sound, phone settings, product, clothes and editing, as a simple do and don't table.
  - title: Explains the files
    text: Three folders, simple names, a note on what they wouldn't say, and the agreed usage. Filming alone never grants usage rights.

output_shape: |
  CONFIRM BEFORE SENDING
  [CONFIRM: <each missing requirement>]

  CONCEPT
  <3 to 5 sentences: who, where, what happens, what the viewer thinks>
  <one line on why it reads as a person's post>

  OPENINGS
  Opening | What to say        | Also do
  <id>    | "<approved line>"  | <film only if true, product cue>

  BODY (<length>; use your own words, keep the point)
  <beat>  | <point, with [blanks] for their own true details>
  Don't say: <never-say list>

  EXTRA SHOTS (no talking, well lit)
  [ ] <shot>

  FILMING
  Do <rule> | Don't <rule>

  SENDING FILES
  <folders, names, notes, usage terms>

example:
  business: sprout
  input: |
    [the skill]

    Approved script (a real customer who switched from greens powder):
    Openings selected:
    A "I quit greens powder more times than I can count."
    B "If your greens powder lives at the back of the cupboard,
       watch this."
    Body points: what you tried before and why you stopped | shown
    use: tear one daily pack, tip the gummies into your hand | the
    number: 21 vitamins and minerals and 6 g of fiber in one pack |
    verdict in your words | handoff: first order $29.99 with the text
    sign-up, renews at $49.99 every 4 weeks.
    Delivery: 20 to 30 seconds, 9:16, raw files, extra shots wanted.
    Deadline: not set. Paid or organic: not decided.
    Handling: the pouch opens only at its resealable top. The daily
    pack tears straight across its top edge, never the side or a
    corner. Gummies tip from the top into a palm.
    Never say: "fix", weight loss, energy or immunity results,
    "clinically proven", "probiotics".
  output: |
    CONFIRM BEFORE SENDING
    [CONFIRM: deadline]
    [CONFIRM: paid or organic use, for how long, on which channels]

    CONCEPT
    A customer who gave up on greens powder talks to her phone in her
    own kitchen. She says what she tried before, takes one daily pack
    out of the pouch, tears it across the top and tips the gummies into
    her hand. The viewer is left thinking "that's a habit I could
    actually keep." It should feel like her own post: her kitchen, her
    phone, her words, no studio.

    OPENINGS
    Opening | What to say                         | Also do
    A       | "I quit greens powder more times    | Film only if true for you.
            | than I can count."                  | Otherwise skip, tell us.
    B       | "If your greens powder lives at the | Hold up one daily pack on
            | back of the cupboard, watch this."  | "this".
    Start right on the line. No "hi guys".

    BODY (20 to 30 seconds; use your own words, keep the point)
    Setup      | [what you tried before] and [why you stopped]
    Shown use  | tear one pack straight across the top, tip the gummies
               | into your hand, [when in your day you take it]
    The number | "21 vitamins and minerals and 6 grams of fiber, in one
               | pack."
    Verdict    | [what's different for you, small and plain]
    Handoff    | "First order is $29.99 with the text sign-up. It renews
               | at $49.99 every 4 weeks."
    No true detail for a blank? Leave that beat out and tell us.
    Don't say: "fix", "clinically proven", "probiotics", anything about
    weight loss, energy or immunity, or any result you didn't have.

    EXTRA SHOTS (no talking, well lit, no seasonal decorations)
    [ ] the pouch where you keep it
    [ ] opening the pouch at its resealable top
    [ ] taking out one daily pack
    [ ] tearing the pack straight across its top edge, close up
    [ ] gummies tipping into your palm, close up
    [ ] the pouch held to the lens, name readable
    [ ] your old powder tub or shaker, if you still have one, with any
        label turned away

    FILMING
    Do                                  | Don't
    9:16, eye level, space around you   | crop your head at the top
    face a window or lamp               | stand with a window behind you
    quiet room                          | music, TV or a fan running
    clean lens, no filters              | beauty mode
    pouch name to the lens              | fingers over the name
    plain top                           | logos, words or other brands
    film a different top for extras     | edit anything

    SENDING FILES
    Three folders: Hooks, Body, Extra shots. Names like "Hook A",
    "Body", "Extra 4 tearing the pack". Leave a second of stillness
    before and after each take. With the files, tell us which opening
    felt most like you and anything you wouldn't say. List any take
    you couldn't film.
    Usage: [CONFIRM]. Filming this doesn't by itself give us the right
    to run it as a paid ad.

tweaks:
  - what: Who is filming
    how: A founder gets openings about the founding story, filmed in their own words. A customer or creator only gets openings true for them; anything else is marked skippable.
  - what: Extra shots
    how: Ask for shots specific to your idea, such as "the old powder tub" or "the pack going into a gym bag". The standard ones (picking it up, opening it, the name to camera) are always included.
  - what: Delivery needs
    how: Give the length, shape (9:16, 4:5), deadline and where it will run. Anything missing becomes a [CONFIRM] at the top, and the skill never borrows numbers from another brief.
  - what: Your voice
    how: Paste your brand voice and it adjusts the wording of the openings and the handoff, while still telling the creator to use their own words.

judge:
  - Every spoken line in the brief is from the approved script or is a [blank] for their own detail.
  - No result, health or money claim appears that isn't in the approved script.
  - Every first-person opening is marked "only if true for you".
  - The deadline and usage terms come from you, or are flagged [CONFIRM].
  - The extra shots show the product opened the way it really opens.
  - A creator could read the filming rules in a minute and know exactly what to do.

test:
  - Leave the deadline and usage out of your input on purpose. Both should come back as [CONFIRM] at the top, never filled in with a guess.
  - Give it a script with a first-person result in it ("it sorted my gut"). The brief should turn it into a blank or mark it skippable, not ask the creator to say it.
  - Hand the brief to a colleague who hasn't seen the script and ask them to film the extra shots on their phone. Anything they get wrong is a line to make clearer.
  - Compare it with the last brief you sent that came back unusable. Each problem you had should now have a rule in the filming table.

improve:
  - Write your product's handling rules (how it opens, what never appears on camera) into "What you need" in the skill file, so every brief carries them.
  - Add your standard usage terms and channels to step 6 once you've agreed them, so the [CONFIRM] lines only appear when something is new.
  - Keep your never-say list in your brand file and paste it in every time. Add any line creators tell you they wouldn't say.
  - Ask the creator to film both openings, so one shoot gives you two ads to test.
  - Pair it with a skill that writes the approved phone video script first.

terms:
  - term: Beat
    meaning: One part of the video with one job, like the setup or the verdict.
  - term: Raw files
    meaning: The original videos straight from the phone, with no editing, filters or music.
  - term: Usage rights
    meaning: Your permission to run the video, and where and for how long. Agree it in writing; filming alone doesn't grant it.
