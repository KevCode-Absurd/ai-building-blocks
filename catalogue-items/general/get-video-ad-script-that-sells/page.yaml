new_slug: get-video-ad-script-that-sells
name: "A video ad script with a fact behind every line"
summary: "Give it your product facts. You get a beat-by-beat script sized to the length, 5 to 8 openings, and a first test."
job: make-video-ads

headline: "A video ad script with a fact behind every line"
subhead: Give it your product facts, and customer research if you have it. It maps what your buyer lived through, writes nine beats with words, screen text, a picture and a source for every line, fits them to a word budget, and adds openings and a first test.

explain: |
  Most weak scripts fail before the first line. Nobody pinned down the buyer, checked the offer or asked what can be proved. Then the writer reaches for clever openings and staples them onto a body that doesn't follow. The ad gets attention and sells nobody.

  This skill does that thinking first. It maps the buyer's timeline from your research: the workaround they live with, the day it got bad enough, what they tried, the doubt at checkout and how they describe life after. It places the buyer by what they already know, reads what your offer really has, and finds the claim a rival can't copy. Then it writes nine beats (opening, problem, promise, how it works, doubt, proof, offer, guarantee, call to action) and fits them to a word budget for the length.

  The beat order follows Blue Sense Digital's public masterclass, How To Write Meta Ads That Scale. Buyer awareness comes from Eugene Schwartz, opening checks and one-change testing from John Caples, and specific facts over adjectives from Claude Hopkins. The pace of 3 words a second comes from published research on how fast ads should talk.

when:
  - You need a video ad script and want the reason behind every line.
  - You have a script that isn't working and want to know which beat is broken.
  - You need a 15-second or 60-second version of a script that works at 30.

you_give:
  - Your product facts, how it works, price, offer, guarantee, allowed claims and proof
  - Customer research such as reviews, tickets or survey answers (optional)
  - The buyer, the reason they buy and the offer (optional, it proposes one)
  - Length and speaker (optional, 30 seconds and a creator by default)
  - An existing script and its results, to review it (optional)
you_get:
  - The script in nine beats, each line with spoken words, screen text, picture and evidence
  - A spoken word count checked against the budget for the length
  - 5 to 8 openings from different sources, each marked pass or fail on four checks
  - A suggested format, a test plan and notes on anything risky

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your brand file or product facts, then any reviews or survey answers.
  - Say what you want, such as "a 30-second script", "three scripts to test" or "what's wrong with this script".
  - Check the notes for MISSING and [ASSUMED]. Assumed insights are bets to test.
  - Test 3 to 5 openings on one body first, before you write new bodies.

how_it_works:
  - title: Maps the buyer's timeline
    text: Before, the trigger, what they tried, the doubt at checkout and life after, each in their own words. With no research it marks the whole map as assumed.
  - title: Places the buyer
    text: Names how much they already know and how tired the market is of claims. That decides how the ad opens.
  - title: Reads the offer
    text: Uses only what exists and picks one price frame that real numbers support.
  - title: Finds the claim a rival can't copy
    text: Cuts any line a rival could paste in, and swaps adjectives for facts a viewer could check.
  - title: Writes nine beats to a budget
    text: Opening, problem, promise, how it works, doubt, proof, offer, guarantee, call to action, fitted to the words the length holds.
  - title: Writes openings last
    text: 5 to 8, each from a different source, each checked on who it picks out, why they'd stay, whether it runs into line 2 and whether picture and words agree.
  - title: Picks a format and a test
    text: Chooses the format from what the viewer must see to believe, then plans a test that changes one thing at a time.

output_shape: |
  ## <Script title>
  Concept: <buyer> x <reason to buy> x <offer>
  Awareness: <level> | Claim fatigue: <1 to 5> | <length>
  Pace: <words a second> | Budget: <words> | Spoken: <exact>
  Selling beat: <beat> | Format: <suggested>

  <BEAT>  "<spoken line>"  Screen: <screen text>
          Picture: <what's on screen>  Evidence: <source or [ASSUMED]>
  (nine beats; any beat left out says why)

  OPENINGS (Who, Why stay, Flow, Agree)
  <n> <source>: "<line>"  <four checks>  <keep or drop>

  TEST PLAN  <what changes, what a win means, what to make next>
  NOTES      <placeholders, assumptions, risky claims>

example:
  business: sprout
  input: |
    [the skill]

    Ask: a script, 30 seconds, AI presenter, second person.
    Buyer: the price doubter. Knows Sprout, maybe from a store shelf,
    and thinks it costs too much. Doubts: "Which discount is real?"
    "Will the price jump after the first order?"
    Product: Sprout greens gummies. 1 pack a day = 60+ ingredients,
    21 vitamins and minerals, 6 g prebiotic fiber.
    Price: $29.99 first order with the SMS sign-up, renews at $49.99
    every 4 weeks ($1.78 a day). 30-day money back, first order only.
    Discounts live: ads say 61% off; the site says 52%, 55%, 49%, 58%.
    Customer words: "They are expensive" (retailer). "I hate
    subscriptions because I feel like they are a trap so I canceled
    it before the gummies even arrived. We quickly decided to
    resubscribe because we love [Sprout] so much!" (review 17)
    Results (practice numbers): P1 "'Sprout is too expensive': here's
    61% off", days 1-21: 3,750 link clicks, 112 purchases. Days 22-42:
    1,780 clicks, 39 purchases, same $3,000 spend.
    Complaint: cancelling is the loudest complaint on review sites.
    Voice: playful, cheeky, short lines, numbers up front.
  output: |
    ## The real number
    Concept: price doubter x know the real price x first-order price
    Awareness: aware of Sprout | Claim fatigue: 4 (tired of discount
    claims, so plain prices only) | 30 s
    Pace: 3.0 | Budget: 84 | Spoken: 84
    Selling beat: the offer | Format: short phone video or image ad

    OPENING  "Seen three different discounts on the same gummies this
          week?"  Screen: which discount is real?
          Picture: presenter scrolling a phone, mid-thought.
          Evidence: live ads and site show five different percentages
    PROBLEM  "You close the tab. A price that keeps moving feels like a
          trap."  Picture: thumb hovers, then closes the tab.
          Evidence: review 17 ("they are a trap")
    PROMISE  "You want the real number before you sign up."
          Screen: the real number
    HOW IT WORKS  "One pack a day. 21 vitamins and minerals and 6 grams
          of fiber."  Picture: a pack torn across the top, gummies
          tipped into a palm. Evidence: product page
    DOUBT  left out: no room at 30 s. The offer says the renewal price
          aloud, which answers "will the price jump".
    PROOF  "One buyer cancelled before it arrived, then wrote, 'We
          quickly decided to resubscribe.'"  Screen: the quote,
          labelled customer review. Evidence: review 17, word for word
    OFFER  "It's Sprout. $29.99 for your first order with the text
          sign-up, then $49.99 every 4 weeks."
          Screen: $29.99 first order (text sign-up). Then $49.99 every
          4 weeks, $1.78 a day. Evidence: price page, footer
    GUARANTEE  left out at 30 s. It covers the first order only, so it
          stays on the page where the limit can be read.
    CALL TO ACTION  "Sign up for the texts and start your first order."
          Screen: end card, $29.99 first order, renews at $49.99, held
          for 2 seconds.

    OPENINGS (Who, Why stay, Flow, Agree)
    1 Last doubt: "Seen three different discounts on the same gummies
      this week?"  pass pass pass pass  keep
    2 The offer: "Here's what it costs after the first order, up
      front."  pass pass pass pass  keep
    3 Their word: "'They are expensive.' Fair. Here's the real
      number."  pass pass pass pass  keep
    4 Before: "If you screenshot a price before you subscribe to
      anything, this is for you."  pass pass pass pass  keep
      [ASSUMED]
    5 A number: "What does a greens gummy cost a day?"  fail (anyone
      could stop, nobody in particular) pass pass pass  drop

    TEST PLAN
    P1's clicks fell by more than half in days 22 to 42 at the same
    spend (practice numbers). That looks like fading, so new openings
    come first. Run this body with openings 1 to 3 as separate ads. If
    2 wins, plain renewal pricing is the draw; test it as an image ad
    next. If 3 wins, the buyer's own word works; write a 60-second
    version that adds the doubt and guarantee beats.

    NOTES
    No percentage is used. The ads say 61% and the site shows four
    other numbers, so the script quotes only prices a buyer will pay.
    The text sign-up and the renewal are said aloud. Nothing promises
    an easy cancel, the loudest complaint. [ASSUMED]: opening 4.
    84 spoken words, on the budget for 30 seconds at 3.0 a second.

tweaks:
  - what: What you ask for
    how: '"Openings only" runs the timeline and openings. "Three scripts to test" gives three scripts on three different reasons to buy. "What''s wrong with this script" runs a review. "A 15-second version" re-plans from the word budget.'
  - what: A reference ad
    how: Paste an ad you like. It maps the job each line does and rebuilds each job with your facts, sharing no run of 6 or more words with the reference.
  - what: Speaker and pace
    how: Name the speaker. A calm narrator or older presenter gets 2.7 words a second; a fast young creator can go to 3.3, with fewer ideas. The budget changes with it.
  - what: Results for review
    how: Paste the ad's numbers. Early drop points at the opening; a drop when the product appears points at the reveal; clicks without sales point at the landing page and price.

judge:
  - The opening runs straight into line 2 when read aloud.
  - The problem is one person's workaround, and it isn't solved yet.
  - The promise comes before how it works, and the proof is at least as strong as the promise.
  - The product is named late, at the offer.
  - Every number traces to your facts, and every guess is marked.
  - The spoken word count fits the budget for the length and pace.

test:
  - Run it on an ad you know won. If its selling beat isn't the part you think sold it, read its reasons before you trust either.
  - Give it no research. Every insight should come back marked [ASSUMED] in an "Assumed timeline".
  - Paste a script that isn't working, with its numbers. It should name one beat as the weakest and say which number points there.
  - Count the spoken words yourself. They should match its count and sit at or just under the budget.

improve:
  - Paste your business facts, allowed claims and never-say list into "What you need" in the skill file, so every run starts from the same truth.
  - Add your brand's voice rules to the voice pass (step 11), with two lines from your best ad as the model.
  - Feed it return and cancel reasons. They shape the guarantee and the call to action.
  - When a script wins, save its concept and selling beat to your brand file, and change one thing per variant next time.
  - Pair it with the skill that finds the lines that lose the sale, or the one that plans a batch of different script types.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
    - {name: "Meta Ads Manager", why: "Its A/B test splits one audience between your ads and changes one thing, so the result is fair."}
  inputs:
    - "Return and cancel reasons, so the guarantee and the ask answer real doubts"
    - "Your three best past ads with their results, so the test plan starts from what worked"
    - "Screenshots of rival ads from the Meta Ad Library, so your openings avoid what everyone runs"

terms:
  - term: Beat
    meaning: One part of the script with one job, like the problem or the proof. Several lines can make one beat.
  - term: Buyer's timeline
    meaning: Five points from your research, in the order the buyer lived them. Before, the trigger, what they tried, the doubt at checkout, and life after.
  - term: Awareness
    meaning: How much the buyer already knows, from unaware of the problem to ready to buy. It decides how the ad opens.
  - term: Selling beat
    meaning: The beat doing most of the selling. It decides the best format.
  - term: Word budget
    meaning: How many spoken words fit the length. Seconds minus 2 for the end card, times the pace.
