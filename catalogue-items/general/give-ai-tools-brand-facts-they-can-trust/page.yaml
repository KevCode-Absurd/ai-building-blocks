new_slug: give-ai-tools-brand-facts-they-can-trust
name: "Brand facts your team and AI tools can trust"
summary: "Give it your website text, product sheet and reviews. You get offers, claims, buyers and look sorted, each line sourced."
job: brand-file

headline: "Brand facts your team and AI tools can trust"
subhead: Paste your pages, product sheet, reviews and style guide, each with a short label. It sorts them into four sections that drop straight into your brand file (offers, claims, buyers, voice and look), tags every line with its source, lists the gaps, and hands the next step only what it needs.

explain: |
  Brand material is usually a pile. Claims from the sales page sit next to the logo colours and a few customer quotes, and nobody knows which line is proven and which is just something the brand says. Then an AI writing an ad picks up "clinically tested" from the product page and stretches it, or an image tool gets a page of claims it can't use.

  This skill keeps four sections apart: your offers with exact prices and terms, your claims with what backs each one, your buyers in their own words, and your voice and look. Every line gets the same tag your brand file uses (confirmed with its source, inferred, disputed or unknown), so the sections can go straight into offers.md, proof-and-claims.md, customers.md and voice-and-look.md. A claim with nothing behind it is marked pending, even when it's on your own site. Then it cuts a short slice for whoever works next, so a designer never gets review quotes and a writer never gets hex codes.

when:
  - You're about to brief a writer, designer or AI tool and want to hand over facts you can stand behind.
  - Your brand material mixes claims, colours and customer quotes, and you can't tell what is proven.
  - Your product, price or offer just changed and the facts every tool works from need refreshing.

you_give:
  - Your brand's own material, such as website pages, product sheet, packaging, style guide, reviews and past ads, each with a short label
  - What happens next, such as planning, writing or image work (optional)
you_get:
  - Four sections (offers, claims, buyers, voice and look), every line tagged with its source
  - Each claim marked approved, pending or banned, with what backs it
  - A GAPS list of what's missing and who can answer it
  - A short slice for the next step, if you named one

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your material and give each piece a short label and date (product page, Oct 2026) so the sources make sense.
  - Say what comes next, for example "this goes to a designer", to get the slice.
  - Read GAPS and the pending claims first. Those are the lines nobody should use in an ad until you find proof.
  - Copy each section into its brand file, and rerun the skill when a product, price or offer changes.

how_it_works:
  - title: Tags every line
    text: Uses the brand file's tags, confirmed with its source, inferred, disputed or unknown, so nothing unproven reads as fact.
  - title: Sorts into four sections
    text: Offers, claims, buyers, and voice and look, each matching one file in your brand file.
  - title: Marks every claim
    text: Approved when a document or test backs it, pending when the brand says it with nothing on file, banned when the material rules it out.
  - title: Keeps proof honest
    text: A review of another product never counts as proof for yours. Missing testimonials or test results stay missing.
  - title: Keeps real files
    text: Names the actual logo and font files. A missing one is listed as a gap, never swapped for a stand-in.
  - title: Cuts a slice
    text: Planning gets buyers and approved claims, writing gets offer facts, claims and quotes, image work gets the product's look, colours and allowed words.

output_shape: |
  OFFERS  (for offers.md)
  <product, variant, contents, price, terms>  [confirmed: <label>, <date>]

  CLAIMS  (for proof-and-claims.md)
  "<claim as written>" | <approved | pending | banned> | <what backs it>

  BUYERS  (for customers.md)
  <buying situation>  [<tag>]
    "<their words>" [<review number>]   Wants: <...>   Doubts: <...>

  VOICE AND LOOK  (for voice-and-look.md)
  <voice lines, words used and avoided>  [<tag>]
  <colour, font, logo file, photo style>  [confirmed | inferred]

  GAPS
  [unknown: <what>, <who can answer>]

  SLICE FOR <NEXT STEP>
  <only what that step needs>

example:
  business: sprout
  input: |
    [the skill]

    Sources:
    S1 brand notes, Oct 2026
    S2 main product page as text, 13 Oct 2026
    S3 20 public reviews, numbered R1 to R20
    S4 15 live ad headlines

    Next step: image work. A designer is making image ads for the
    Original pouch.
  output: |
    OFFERS  (for offers.md)
    Sprout Original (Adults): pouch of 28 daily packs, about 20 g each
      [confirmed: S1, S2]
    60+ ingredients, 6 g prebiotic fiber per pack [confirmed: S1]
    Vitamins and minerals: "21" [confirmed: S1] and "over 20"
      [confirmed: S2 ingredients panel] [disputed]
    Vegan, pectin base, no gelatin [confirmed: S2]
    Subscribe $49.99 every 4 weeks. One-time $66.65. First order $29.99
      only with the text sign-up discount [confirmed: S2 footer]
    Guarantee: "This policy applies only to your initial purchase."
      30 days [confirmed: S2 FAQ]

    CLAIMS  (for proof-and-claims.md)
    "Clinically tested for nutrient absorption" | approved | the
      brand's 2025 study (vitamin C, folate) | only for those two
    "Supports digestion and gut health" | approved | listed as fine to
      repeat [S1]
    "Supports immunity + stress relief" | pending | nothing on file
    "revive whole body vitality" | pending | nothing on file
    "4.8/5.0 (100,000)" | pending | the page widget says 4.75 from
      109,639 [disputed]
    "1M+ Customers" | pending | nothing on file

    BUYERS  (for customers.md; shares are estimates from reviews)
    The quitter who wants to stick (about 40%) [inferred share]
      "[Sprout] has been the one thing I've been able to stick to." [R1]
    The gut-fix seeker (about 25%) [inferred share]
      "Feel lighter, less bloated and overall good." [R10]
    The busy parent (about 25%) [inferred share]
      "They think it's a treat." [R16]
    The price doubter (share unknown)
      "I hate subscriptions because I feel like they are a trap" [R17]

    VOICE AND LOOK  (for voice-and-look.md)
    Playful, cheeky, short lines, numbers up front [confirmed: S1]
    In use: "Rip. Tip. Enjoy." [confirmed: S1, S4]
    Forest green #00582D, deep forest #002C17, cream #FFF7DF, kelly
      green #007E40 (buttons), sunflower #FFCC2E, plum #581E5A
      [confirmed: S1]
    Work Sans bold headings, Work Sans medium body, DM Mono tags
      [confirmed: S1]
    Pouch: glossy deep green foil, big yellow wordmark, "28 Daily
      Packs" at the bottom [confirmed: S1]
    Daily pack torn straight across the top [confirmed: S1]
    Sunflower for stars and badges only, never body text [inferred]

    GAPS
    [unknown: logo file, founder]
    [unknown: font files and the display font's name, founder]
    [unknown: grams of sugar per pack, founder]
    [unknown: one agreed star rating with its source, founder]

    SLICE FOR IMAGE WORK
    Product: green Original pouch, 28 packs; gummies small, deep green,
      matte. Tear the pack straight across the top.
    Colours and fonts: as above. Photo style: bright, sunny, soft
      two-colour gradient, gummies poured into a hand.
    Words allowed on the image: "21 vitamins & minerals", "6g fiber",
      "Third-party tested". No rating, no "1M+", no tie-in characters.

tweaks:
  - what: The next step
    how: Name it and the slice changes. "Image work" gets the product's look, colours and allowed words, with no claims list. "Writing" gets offer facts, approved claims and quotes, with no hex codes.
  - what: Source labels
    how: Give every pasted piece a short label and a date. The labels are what make the sections checkable later, so "S2 product page, Oct 2026" beats an unlabelled paste.
  - what: Reviews
    how: Add a review export with the verified-buyer column. Without it, the skill notes which quotes it can't confirm as real buyers.
  - what: One product at a time
    how: If you sell several products, run it once per product. Facts and buyer quotes don't transfer between products.

judge:
  - Every line ends with a tag, and every confirmed line names its source. Pick three and check them against the original.
  - Claims with nothing behind them on file are marked pending, even when they're on your own site.
  - Prices and offer terms are copied exactly, not rounded or reworded.
  - Colours and fonts sit only under voice and look.
  - The GAPS list names real missing files or proof, and nothing in the sections quietly fills them.

test:
  - Give it a product page with one claim you know has no proof behind it. That claim should come back pending.
  - Pick five lines at random and check each source against the original. If any line has no source or the wrong one, don't pass the sections on yet.
  - Leave out your logo file or your font name. It should appear under GAPS, and the look section should not name a stand-in.
  - Name a next step, such as image work, and check the slice holds only the product's look, colours and allowed words, with no review quotes or research notes.

improve:
  - Add your own source labels to "What you need" (product page, label, lab report, founder), so every run names sources the same way.
  - Write your banned claims into step 2, so any line that matches one is flagged, even when it comes from your own site.
  - If you sell to two very different buyers, ask for a separate buyers section for each.
  - Copy the sections into your brand file with today's date, and rerun when a price, offer or product changes.
  - If you're starting from nothing, run the skill that builds a full brand file from your website instead. Use this one for new material and for slices.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all sort and tag material well when every piece has a clear label."}
  inputs:
    - "A review export with the verified-buyer column, so quotes can be confirmed as real buyers"
    - "Your lab reports or test certificates, so more claims can be marked approved instead of pending"
    - "Your logo and font files by name, so the look section has no gaps"
    - "Your current brand file, so new material is checked against what's already confirmed"

terms:
  - term: Pending claim
    meaning: Something the brand says about itself with no proof on file yet. Fine on your own page, risky in an ad.
  - term: Tag
    meaning: A short label after each line showing whether it's confirmed (and where from), inferred, disputed or unknown.
  - term: Slice
    meaning: The short part of the sections that one next step needs, such as the look and allowed words for a designer.
