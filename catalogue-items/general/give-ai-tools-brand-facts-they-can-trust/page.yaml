new_slug: give-ai-tools-brand-facts-they-can-trust
name: Give AI tools brand facts they can trust
summary: Your brand material sorted into product facts, buyer evidence, voice and look, every line with its source.
job: brand-file

headline: "Brand facts your team and AI tools can trust"
subhead: Give it your website text, product sheet, reviews and brand guidelines. It sorts them into four separate records (product facts, buyer evidence, writing voice, visual rules), tags every line with its source, lists the gaps, and hands each next step only the part it needs.

explain: |
  Brand material is usually a pile. Claims from the sales page sit next to the logo colours and a few customer quotes, and nobody knows which line is proven and which is just something the brand says. Then an AI writing an ad picks up "premium" from the product page and treats it as a fact, or an image tool gets a page of claims it can't use.

  This skill keeps four records apart. Product facts hold what you can say about the product, with exact prices and terms. Buyer evidence holds what real customers live through, in their words. Voice holds how you write. Visual rules hold colours, fonts and logo, each marked as seen in your own material or only suggested. Every claim is labelled as proven by a named source or as something the brand asserts. Anything missing stays missing.

when:
  - You're about to brief a writer, designer or AI tool and want to hand over facts you can stand behind.
  - Your brand material mixes claims, colours and customer quotes, and you can't tell what is proven.
  - Your product, price or offer just changed and the facts every tool works from need refreshing.

you_give:
  - Your brand's own material, such as website pages, product sheet, packaging, guidelines, reviews and past ads
  - What the records are for next, such as planning, writing or making images (optional)
you_get:
  - Four records under headings, every line followed by its source
  - Each claim labelled as backed by a named source or as a brand assertion
  - A GAPS list of what is missing, such as a logo file or proof
  - A short handoff for the next step, if you named one

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste your material underneath and give each piece a short label (product page, facts panel, reviews) so the sources make sense.
  - Say what comes next, for example "this goes to a copywriter", to get the handoff slice.
  - Read the GAPS list and the "brand assertion" labels first. Those are the lines nobody should use in an ad until you find proof.
  - Save the four records in your brand file and rerun the skill when a product, price or offer changes.

how_it_works:
  - title: Keeps four records apart
    text: Product facts, buyer evidence, writing voice and visual rules each get their own section, so a colour rule never sits beside a health claim.
  - title: Labels every claim
    text: A claim found on a sales page counts as something the brand says until a source backs it. A review of another product never counts as proof for yours.
  - title: Takes only what's there
    text: Missing testimonials, certificates or results stay missing. It won't invent a colour palette to fill a template.
  - title: Explains technical words
    text: Keeps every line plain enough for a 13-year-old, and adds a short meaning to any technical term the buyer needs.
  - title: Keeps real logo and font files
    text: Records the actual files. A missing one is listed as a gap, never swapped for a stand-in.
  - title: Hands over a slice
    text: Planning gets the buyer and the main promise, writing gets facts, quotes and voice, image work gets the scene, product references and visual rules.

output_shape: |
  RECORD 1  PRODUCT FACTS
  <fact: contents, size, price, offer terms>  [<source>]
  Claims
    <claim>   supported by <source>  |  brand assertion

  RECORD 2  BUYER EVIDENCE
  <buyer group>  [<source>]
    Moment: "<their words>" [<source>]
    Wants: <...>   Doubts: <...>

  RECORD 3  WRITING VOICE
  <how the brand writes>, lines in use, words it never uses  [<source>]

  RECORD 4  VISUAL RULES
  <colour, font, logo, photo rule>   observed [<source>] | suggested

  GAPS
  MISSING: <logo file | font file | proof | ...>

  HANDOFF: <NEXT STEP>
  <only the facts, quotes or rules that step needs>

example:
  business: sprout
  input: |
    [the skill]

    Sources:
    S1 brand file (sprout/brand.md)
    S2 main product page as text (sprout/product-page.md)
    S3 20 public reviews, numbered R1 to R20 (sprout/reviews.md)
    S4 15 live ad headlines (sprout/ads.md)

    Next stage: image work. A designer is making image ads for the
    Original pouch.
  output: |
    RECORD 1  PRODUCT FACTS
    Sprout Original (Adults): pouch of 28 daily packs, about 20 g per pack,
      "a small handful" of gummies [S1, S2]
    60+ ingredients, 6 g prebiotic fiber per pack [S1]
    Vitamins and minerals: "21" [S1 science page] and "over 20" [S2
      ingredients panel]. The two counts disagree.
    Vegan, pectin base, no gelatin [S2]
    Subscribe $49.99 every 4 weeks. One-time $66.65. First order $29.99
      only with the text sign-up discount (footer small print) [S1, S2]
    Guarantee: 30-day money-back, "This policy applies only to your
      initial purchase." [S2 FAQ]
    Claims
      "Clinically tested for nutrient absorption"  supported by the brand's
                                                    2025 study (vit C, folate)
      "Supports digestion and gut health"          supported: listed as fine
                                                    to repeat [S1]
      "Supports immunity + stress relief"          brand assertion [S2]
      "revive whole body vitality"                 brand assertion [S2]
      "4.8/5.0 (100,000)"                          brand assertion. Widget says
                                                    4.75 from 109,639 [S2]
      "1M+ Customers"                              brand assertion [S2]

    RECORD 2  BUYER EVIDENCE  (shares are estimates from reviews [S1])
    Quitter who wants to stick (about 40%)
      "[Sprout] has been the one thing I've been able to stick to." [R1]
    Gut-fix seeker (about 25%)
      "Feel lighter, less bloated and overall good." [R10]
      Doubt: Sugar-Free upsets some stomachs [S1, review-site fragment]
    Busy parent (about 25%)
      "They think it's a treat." [R16]
    Price doubter (share unknown)
      "I hate subscriptions because I feel like they are a trap" [R17]

    RECORD 3  WRITING VOICE
    Playful, cheeky, casual. Short lines, numbers up front [S1]
    Lines in use: "Rip. Tip. Enjoy." / "Tastes like a treat, works like a
      supplement." [S1]

    RECORD 4  VISUAL RULES
    Forest green #00582D, deep forest #002C17, cream #FFF7DF,
      kelly green #007E40 (buttons), yellow #FFCC2E, plum #581E5A  observed [S1]
    Work Sans bold headings, Work Sans medium body, DM Mono tags   observed [S1]
    Adult pouch: glossy deep green foil, big yellow wordmark, yellow bear
      face top right, "28 Daily Packs" at the bottom              observed [S1]
    Gummies: small opaque deep-green bears, soft matte            observed [S1]
    Daily pack torn straight across the top, never side or corner observed [S1]
    Never show tie-in cartoon characters or partner marks          observed [S1]
    Yellow for stars and badges only, never body text              suggested

    GAPS
    MISSING: logo file
    MISSING: font files, and the name of the display font
    MISSING: grams of sugar per pack
    MISSING: one agreed star rating with its source

    HANDOFF: IMAGE WORK
    Product: green Original pouch, 28 packs; gummies small, deep green,
      matte. Tear the pack straight across the top.
    Colours and fonts: Record 4. Photo style: bright, sunny, soft
      two-colour gradient, gummies poured into a hand.
    Words allowed on the image: "21 vitamins & minerals", "6g fiber",
      "Third-party tested". No rating, no "1M+", no tie-in characters.

tweaks:
  - what: The next stage
    how: Name it and the handoff changes. "Image work" gets colours, the product's look and the photo rules, with no claims at all. "Writing" gets facts, quotes and voice, with no hex codes.
  - what: Source labels
    how: Give every pasted piece a short label and a date. The labels are what make the records checkable later, so "S2 product page, Oct 2026" beats an unlabelled paste.
  - what: Reviews
    how: Add a review export with the verified-buyer column. Without it, the skill notes which quotes it can't confirm as real buyers.
  - what: One product at a time
    how: If you sell several products, run it once per product. Facts and buyer quotes don't transfer between products.

judge:
  - Every line ends with a source label. Pick three and check them against the original.
  - Sales-page wording such as "premium" is marked as a brand assertion, not a fact.
  - Prices and offer terms are copied exactly, not rounded or reworded.
  - Colours and fonts sit in the visual record only, each marked observed or suggested.
  - The GAPS list names real missing files or proof, and nothing in the records quietly fills them.

test:
  - Give it a product page with one claim you know has no proof behind it. That claim should come back marked as a brand assertion, not a fact.
  - Pick five lines at random and check each source label against the original. If any line has no source or the wrong one, don't pass the records on yet.
  - Leave out your logo file or your font name. It should appear under GAPS, and the visual record should not name a stand-in.
  - Name a next step, such as image work, and check the slice holds only the scene, product references and visual rules, with no review quotes or research notes.

improve:
  - Rename or split the four records in step 1 to match how your team works. If you sell to two separate kinds of buyer, give each one its own buyer evidence record.
  - Add your own source labels to step 1 (product page, label, lab report, founder), so every run names sources the same way.
  - Write your banned claims into step 2, so any line that matches one is flagged, even when it comes from your own site.
  - Save the finished records in your brand file with today's date, and rerun them (step 7) whenever a price, offer or product changes.
  - Pair it with a skill that interviews the founder to fill the gaps it lists. If you're starting from nothing, use a skill that builds a full brand file from your website instead.

terms:
  - term: Brand assertion
    meaning: Something the brand says about itself with no proof on file yet. Fine on your own page, risky in an ad.
  - term: Source label
    meaning: A short tag after each line showing where it came from, so anyone can check it.
