new_slug: go-or-no-go-launch-checker
name: Go or no-go launch checker
summary: "Check a launch plan against six faults and three readiness checks. Get a go, wait or no verdict and a fix list before you spend."
job: plan-strategy
thinking: medium
thinking_why: It judges each fault from your plan and must give a firm verdict.
headline: Go or no-go launch checker
subhead: "Give it your plan and, if you have one, a comparison with your rival. It tests the plan against six faults and three halfway checks from Sun Tzu's The Art of War. You get each fault marked present, absent or missing, one verdict (go, wait or no) and a fix list."
explain: |
  Plans fail in common ways before they ever meet the market. The task is too big for the team. Strong people have weak managers, or the other way round. An angry person acts alone. Orders are unclear. Nobody has judged how strong the other side is. A launch readiness check should catch these before you spend.

  This skill runs your plan through six faults and three halfway checks from Sun Tzu's chapter on terrain, in the Giles translation. Each fault gets a mark and a reason quoted from your plan. The three checks ask if your team is ready, if the other side is open to your move and if the ground allows it. Most teams check only the first.

  It ends with one verdict, never a maybe. The "about ten times" size test comes from the book. The go, wait and no rules are ours, so treat the verdict as a hard second opinion, not a forecast.
when:
  - You have a launch date and want a hard check before you commit money.
  - Your team has approved a plan and you want an outside test of it.
  - You have just run a rival comparison and need to turn it into a decision.
  - One person is pushing a big move out of pride or a wish to get even, and you want it tested.
not_for:
  - "The plan has already launched. Use the Program keep-or-cut reviewer on its results, or the Pivot or persevere decider if it is stalling."
  - "The rival is your main risk and you have no comparison yet. Run the Rival matchup scorer first. Without it the rival fault is marked missing and the best verdict is wait."
  - "You want an open list of everything that could go wrong, not a verdict. Use the Failure-first plan check."
you_give:
  - "Your plan: what you will do, when, with what team and money"
  - A comparison with your rival, such as a Rival matchup scorer result (optional)
  - Who is in charge and how decisions and orders are passed on (optional)
  - Any doubts people on the team have voiced (optional)
you_get:
  - Each of six faults marked present, absent or missing, with a reason from your plan
  - Three halfway checks answered yes, no or missing
  - One verdict, go, wait or no, with the single reason that decided it
  - A fix list for each fault found, and what would turn a wait into a go
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini. If you added it, call it by name. If not, copy it and paste it in.
  - Paste your plan. Add the rival comparison if you have one, and who decides and how orders reach the team.
  - Answer the motive question honestly. Say so if pride, anger or a wish to get even is part of the reason.
  - Read the verdict and the one reason behind it first. Then read the fix list.
  - Fix the faults, then run it again with the updated plan. It needs no files or web access.
  - If it says wait because the rival is missing, run the Rival matchup scorer and paste the result back in.
how_it_works:
  - title: Reads the plan
    text: Pulls out the task, the team, the leader, the orders and what is known about the rival.
  - title: Tests six faults
    text: Marks each of six faults present, absent or missing, with a reason quoted from your plan.
  - title: Asks about motive
    text: Asks whether anger, pride or a wish to win face is driving the plan.
  - title: Runs three halfway checks
    text: Tests your readiness, the opponent's openness and whether the ground allows the move.
  - title: Gives the verdict
    text: Go, wait or no, with the single reason that decided it.
  - title: Lists the fixes
    text: Writes what to change for each fault, and what would turn wait into go.
  - title: Checks the set
    text: Runs its own checks and names any it missed.
output_shape: |
  THE PLAN
  <one line: what, when, with whom>

  SIX FAULTS
  1. Task too big for the force: present or absent or missing | <reason>
  2. Strong people, weak managers: present or absent or missing | <reason>
  3. Strong managers, weak people: present or absent or missing | <reason>
  4. Angry managers acting alone: present or absent or missing | <reason>
  5. Unclear orders and authority: present or absent or missing | <reason>
  6. Rival strength not judged: present or absent or missing | <reason>

  MOTIVE
  <is anger or pride a driver: yes or no, why>

  THREE HALFWAY CHECKS
  Your team is ready: <yes, no or missing>
  The opponent is open: <yes, no or missing>
  The ground allows it: <yes, no or missing>

  VERDICT: GO or WAIT or NO
  <the reason that decided it>

  FIXES
  <fault>: <change>

  MISSING
  CHECKS MISSED
output_sample:
  input:
    - "Your plan: what you will do, when, with what team and money"
    - A comparison with your rival (optional)
    - Who decides and how orders are passed on (optional)
  prerequisites:
    - A rival comparison, such as a result from the Rival matchup scorer (optional)
  output:
    - name: The plan in one line
      contains: What you will do, by when and with whom, quoted from your plan.
    - name: Six faults
      contains: Each fault marked present, absent or missing, with a reason taken from your plan.
    - name: Motive
      contains: Whether anger, pride or a wish to get even is part of why the plan exists.
    - name: Three halfway checks
      contains: Whether your team is ready, the other side is open and the ground allows the move.
    - name: Verdict
      contains: Go, wait or no, with the single reason that decided it.
    - name: Fixes
      contains: One change for each fault found, and what would turn a wait into a go.
    - name: Missing and checks missed
      contains: Facts the plan did not give, plus any check the skill could not pass.
tweaks:
  - what: The rival comparison
    how: A scored comparison lets the checker judge the rival fault from evidence. Without one, that fault is marked MISSING.
  - what: How honest the motive answer is
    how: Say if the plan is partly about proving a point. The checker asks, and the answer can turn go into wait.
  - what: The plan's detail
    how: Give names for who decides and how orders reach the team. Faults on authority depend on them.
judge:
  - All six faults are marked present or absent, each with a reason from your plan.
  - All three halfway checks are answered.
  - The verdict is go, wait or no, not a maybe.
  - Anger or pride as a driver is asked about.
  - Every fault found has a fix.
test:
  - Run it on a past launch that failed. See if it finds a fault you now know was there.
  - Run it twice. The verdict should hold.
  - Remove the rival comparison and check the rival-strength fault turns into MISSING.
  - Fix one fault it found and run again. The verdict should move.
improve:
  - Add your team's known weak points to step 2, so the strong and weak checks look for them.
  - Add your own minimum for a go, such as budget cover for three months.
  - Save each verdict with the date and the result, so you can see how often it was right.
  - Pair it with Rival matchup scorer before it and a plan writer after it.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Checking a plan against a fixed list of faults is text work any strong chat AI does well with this skill.
  inputs:
    - A rival comparison from Rival matchup scorer
    - A list of who decides what, so authority is clear
    - The team's own worries, written down by them
terms:
  - term: Halfway check
    meaning: A check of only one of three things. Knowing only one of the three means you are about halfway to knowing.
  - term: Fault
    meaning: A known way a plan fails before it meets the market, such as unclear orders.
