how_it_works:
  - title: Step 1
    text: Use this for the initial Cloud project, Google Ads manager relationship and OAuth client setup. The later token-and-access planner covers developer-token readiness, refresh authorization and a read-only account probe. Confirm who owns each project and account before choosing settings.
  - title: Step 2
    text: Inspect the current official setup for the chosen client type and intended internal or external users. Create or select the authorized Cloud project, enable the needed API and configure the consent audience, application identity and authorized redirect locations as applicable.
  - title: Step 3
    text: Choose the correct OAuth client type for the selected local, installed or web application. Register only redirect locations the user controls. Keep client secret values in secure local or hosted secret settings; the handoff lists field names, never values.
  - title: Step 4
    text: Confirm the Google Ads manager and target account links and which user can authorize access. Do not create duplicate accounts or assume a manager ID equals the target customer ID. Record the mapping with redacted identifiers in public notes.
  - title: Step 5
    text: Check the least capability needed for the diagnostic workflow against current provider-supported scopes and consent rules. Do not promise narrower scopes the provider does not offer; the application itself must also enforce read-only operations.
  - title: Step 6
    text: Return the Cloud/client/manager setup checklist and the exact remaining credential steps. Do not claim a refresh token or successful account query from client creation alone. Hand the prepared configuration to the separate final access-check method.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
