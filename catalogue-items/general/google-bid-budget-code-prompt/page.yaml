new_slug: google-bid-budget-code-prompt
name: Google bid and budget coding prompt
summary: Get a coding brief for Google Ads bid and budget checks. It covers a bid strategy review and safe budget moves, written as proposals to review.
job: build-software
headline: Google bid and budget coding prompt
subhead: Get a coding brief for Google Ads bid and budget checks, with matched data, business targets and proposed changes.
explain: |-
  Changing Google Ads bids and budgets without a clear rule loses money quietly. This prompt gives you a coding brief for two read-only checks: one reviews how each campaign's bid strategy is doing, the other proposes budget moves that keep your total spend the same. Every move is a proposal for a person to review.

  The prompt you paste holds the full method. It marks missing inputs and separates proposed actions from actions that were actually completed.
when:
  - You want your own tool to check Google Ads bid strategies and suggest budget moves.
  - You want the rules for a budget move written down before anyone codes them.
  - You want tests that prove the total budget stays the same and no budget goes below zero.
  - You have a developer or a coding AI who can build and run it.
not_for:
  - Your account has no conversion tracking. Do a manual bid review in Google Ads instead.
  - You want your AI to change bids or budgets in the account. This brief only proposes changes for you to review.
  - You have no code project to build in. Ask a person who runs Google Ads to review bids and budgets by hand.
you_give:
  - Your code project, or its schema and file layout
  - The Google Ads customer ID, date range and account currency
  - Each campaign's current bid strategy and budget
  - Your approved ROAS or CPA targets and your total spend limit
you_get:
  - A coding brief for the bid strategy diagnostic + budget reallocator
  - Required files, setup gaps and test cases
how_to_use:
  - Paste the text of SKILL.md into Claude, ChatGPT or Gemini. Use Claude Code or Codex if you want it to read your project files.
  - Attach or open your repository, then answer the inputs it asks for: customer ID, date range, currency, ROAS or CPA targets and your spending limit.
  - Check the brief against your own facts before you use it.
  - Next: give the brief to a developer or your coding AI. Review every proposed move with the budget owner before anything is changed in Google Ads.
output_sample:
  input:
    - Your code project, or its schema and file layout
    - What the feature must do
    - Your approved ROAS or CPA targets (optional)
    - Your total spend limit and any campaigns to protect (optional)
  prerequisites:
    - An AI that can read your code project
    - "Google Ads API access only if you later run it on a real account: developer token, OAuth and account permissions"
  output:
    - name: Typed input
      contains: The fields the code takes, such as customer ID, date range, currency, current budgets, targets and data freshness.
    - name: Bid strategy diagnosis module
      contains: Checks strategy fit, learning status, impression share loss and conversion evidence, and marks missing data.
    - name: Target attainment calculation
      contains: Actual results against target ROAS or CPA, with no profit claim unless margin is supplied.
    - name: Budget reallocation module
      contains: Proposed moves that keep the total spend and respect minimums, maximum changes and protected campaigns.
    - name: Move table
      contains: "Per move: campaign ID, current and proposed budget, change, reason, evidence window, risk, review owner and stop condition."
    - name: Test cases
      contains: Tests for missing targets, zero conversions, currency, budget totals, no-move cases and unknown impact.
    - name: Setup gaps
      contains: A list of missing files, schemas and API permissions to fix before building.
how_it_works:
  - title: Inspect the target project
    text: Check its file structure, interfaces and service setup before choosing paths.
  - title: Write the feature brief
    text: Follow the full method below. Preserve its named modules, decision rules and required output.
  - title: Check the handoff
    text: List missing dependencies, acceptance cases and the failure paths the implementation must cover.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
