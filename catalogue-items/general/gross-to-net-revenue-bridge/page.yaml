new_slug: gross-to-net-revenue-bridge
name: Gross-to-net revenue bridge
headline: Gross-to-net revenue bridge
summary: Build a gross-to-net revenue bridge. Give it billings, returns and rebates. You get a check against your reported net revenue, with gaps flagged.
job: track-numbers
thinking: high
thinking_why: "Deductions and presentation rules each change net revenue, so each needs evidence before the bridge can be called complete."
subhead: Give it gross billings, returns, rebates, collected taxes, pass-through amounts and your revenue policy notes. You get a bridge from billings to net revenue, checked against your reported figure.
explain: |-
  Gross billings and reported revenue rarely match, because returns, rebates, taxes you collect for others and pass-through amounts come off in between. This bridge takes each deduction off once and shows what, if anything, is left unexplained against your reported net revenue.

  Illustrative figures, in USD million. Gross billings of 1,000, less returns 50, rebates 30, collected taxes 20 and pass-through amounts 100, give net revenue of 800. If rebates were 50 instead, the bridge gives 780 and leaves 20 unexplained against the unchanged reported 800.
when:
  - Billed amounts and reported revenue differ and you need to see why, line by line.
  - You need to show which deductions are valid and that none was taken twice.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - Your returns and rebates are already taken out of the gross figure. Fix the input first, or the bridge counts them twice.
  - You need to decide if you are principal or agent. Ask your accountant or auditor to review the contract and revenue policy.
  - You need a legal or investment opinion. Use a qualified adviser, because this only checks the arithmetic and your sources.
  - "You need growth with acquisitions, disposals and currency taken out: use the Like-for-like sales growth checker instead."
you_give:
  - Gross billings, returns, rebates, excluded collected taxes, pass-through amounts and principal-versus-agent policy evidence.
  - "The reporting period, plus the currency and scale used for the gross-to-net revenue bridge."
  - "Your spreadsheet tool, if you want the gross-to-net revenue bridge as a workbook."
you_get:
  - A billings-to-revenue bridge with deduction and presentation checks.
  - "An editable workbook of the gross-to-net revenue bridge, with its inputs, formulas and test cases to rerun."
  - "A tie-out of gross billings, deductions and reported revenue, the inputs still missing and the checks that ran."
how_to_use:
  - Open your AI tool and add the skill file. Use one that can make spreadsheet files if you want a workbook.
  - Add your gross billings, returns, rebates, collected taxes, pass-through amounts and your reported net revenue. Include the date, currency and scale.
  - Add your contract or revenue policy notes, so your AI can tell which deductions are valid.
  - Ask your AI to build the bridge. If you have Node.js 20 or later, it can also run node scripts/run-model.mjs references/model.json inputs.json, where inputs.json holds your numbers.
  - Read the gap between the bridge and your reported figure. Check every item in MISSING and CHECKS MISSED before you rely on it.
output_sample:
  input:
    - Your gross billings for the period
    - Returns, rebates, taxes collected for others and pass-through amounts
    - Your contract or revenue policy notes on principal versus agent
    - Your reported net revenue, with date, currency and scale
    - Your spreadsheet tool (optional)
  prerequisites:
    - An AI that can create and reopen spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Scope and dated sources
      contains: The period, currency, scale and the dated sources each figure came from.
    - name: Inputs and assumptions
      contains: Each gross figure and deduction with its sign, source and any assumption made.
    - name: Model calculations and reconciliations
      contains: Each deduction taken once from gross billings, the net result, and the gap to reported revenue.
    - name: Editable workbook
      contains: A spreadsheet of the bridge with inputs, formulas and checks, if you ask for one.
    - name: Actual file verification
      contains: What was recalculated, rendered and reopened in the saved file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: List the deductions
    text: Returns, rebates, taxes collected for others and pass-through amounts, each with its sign and source. Your policy notes decide which are valid.
  - title: Check for double counting
    text: Confirms nothing is already taken out of the gross figure and no two deductions overlap.
  - title: Subtract once
    text: Takes each deduction off gross billings one time to get bridge net revenue.
  - title: Compare with reported
    text: Shows the unexplained gap, then lists what to recheck first. The order is netting, doubles, timing, evidence and signs.
output_shape: |-
  A billings-to-revenue bridge with deduction and presentation checks.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Reporting period"
    how: "Take the reporting period from the billings, the deductions and the policy notes. Use one currency and scale on every line."
  - what: "Rebates and returns"
    how: "Change the rebates and returns and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Returns and rebates have not already been netted in the gross input.
judge:
  - Returns and rebates have not already been netted in the gross input.
  - Principal-versus-agent conclusions are supported by control evidence, not produced by the calculator.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one gross-to-net revenue bridge you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define principal or agent into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
