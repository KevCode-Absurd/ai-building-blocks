new_slug: grounded-job-protocol
name: "Grounded job protocol"
summary: "Give it any real job. Your AI frames it, studies your actual business first, explores real options, builds in your style and gets checked."
job: plan-strategy
thinking: medium
thinking_why: "It sets the order of work and the checks. The work itself is done by the skills it calls."

headline: "Make your AI's work fit your business, not the average one"
subhead: Seven steps your AI follows for any job bigger than a quick answer. It frames the job, captures your real site or data, writes what good looks like for you, tries real options, builds in your own style and has a fresh chat check it. You get the work, the checks and a short record of what was decided.

explain: |
  AI work often looks the same for every business. Pages ignore the real site. Plans could belong to anyone. That is not a wording problem. The AI was never shown your business, so it wrote the average answer.

  This protocol fixes the order of work. First it writes a short job card, including whether to improve what you have or start fresh. Improving is the default when something exists. Then it captures the real thing: your site's colours, fonts, layout, words and prices, or your real account data. Nothing gets made until that file exists.

  Next it writes a short taste brief: what must stay, which brands to learn from, and which AI habits to avoid. It makes two or three options that really differ, builds the chosen one in your style, and has a separate chat check it against pass-or-fail rules and a score for that kind of work. It ends with a decisions file and any lessons worth keeping.

when:
  - Your AI is about to make a page, ads, emails, copy, an audit, an analysis, a plan or code for a real business.
  - Past AI work for you came back generic and you want a method that stops it.
  - You run several AI agents and want them all to follow one way of working.
not_for:
  - "Quick answers and one-line edits. Just ask."
  - "A brand-new business with nothing to capture yet. You can still use the steps; the capture step becomes your brand guide and references."

you_give:
  - The job, in your own words, and what a good result looks like
  - Your website or the account or data the job is about
  - Two or three brands or pages you admire, and one you do not want to look like (optional)
you_get:
  - A five-line job card with the kind of work and the mode
  - Context files with your real site or data, captured before any work starts
  - A taste brief with what to keep, what to learn from and what to avoid
  - Two or three real options, and the chosen one built in your style
  - A check by a fresh chat, with pass-or-fail rules and a score
  - A decisions file and any lessons worth keeping

how_to_use:
  - Add the skill to your AI, or paste it in at the start of the chat.
  - Describe the job and give your website or data.
  - Answer the few taste questions it asks about position, price, what must never change and brands you admire.
  - Pick one of the options it shows you, or let it choose and say why.
  - Read the check results and the decisions file before you use the work.

how_it_works:
  - title: Frames the job
    text: Writes who it is for, the outcome, the kind of work, how success is measured, and whether to improve what exists or start fresh.
  - title: Captures the real thing
    text: Measures your live site or pulls your real data first. Every later choice must point back to it.
  - title: Writes a taste brief
    text: Says which brand codes to keep, which category habits to keep or break, which references to learn from and which AI habits to avoid.
  - title: Tries real options
    text: Makes two or three options that differ in idea, proof, structure, look or offer, not just colour or wording.
  - title: Builds in your style
    text: Keeps your menu, footer, fonts, colours and real facts. Gaps go on a checklist, not on the page.
  - title: Gets checked by someone else
    text: A fresh chat checks hard rules (facts, placeholders, access, brand fit) and scores the craft for that kind of work.
  - title: Records what was decided
    text: Writes what was considered, what was chosen and why, the strongest objection and what to test next.

output_shape: |
  JOB CARD
  Client / Outcome / Deliverable kind / Success measure / Mode (patch | extend | new)

  CONTEXT        context/brand-dna.md (or data snapshot), references
  TASTE BRIEF    codes to keep / conventions to keep or break / references / defaults to avoid / must never change
  DIRECTIONS     A, B, C with the axis each changes and the reference it learns from
  DELIVERABLE    built inside the client's system
  CHECK          gates pass/fail, craft score by criterion, defaults found, fidelity report (pages)
  DECISIONS.md   considered / chosen and why / strongest dissent / test next
  RULES I LEARNED  typed lines: decision_rule, taste_reference, never_do, exemplar, check
  CHECKS MISSED  <one line each, or none>

example:
  business: gehna
  input: |
    [the skill]

    Improve the product page for the Filigree Pearl 18K Gold Dangle Earrings
    on gehnaindia.com so more visitors add it to the cart.
  output: |
    JOB CARD
    Client: Gehna, gehnaindia.com, gold and gemstone jewellery
    Outcome: more add-to-carts on this product page
    Deliverable kind: web_page   Success measure: add-to-cart rate
    Mode: patch (the page is live)

    CONTEXT
    Captured / and the product page on 9 Nov 2026 into context/brand-dna.md:
    Lato body and UPPERCASE buttons, Nanum Myeongjo titles, marigold #F6B74D
    main button with 4 px corners, white page, dark six-column footer,
    price 16,530 rupees, 4.8/5 from 519 Google reviews.

    TASTE BRIEF (defaults to avoid)
    web-font-swap, web-sentence-case-buttons, web-accent-promoted,
    web-cream-premium, web-dropped-chrome, web-visible-placeholders.

    DIRECTIONS (change-sets to the live page)
    A. Price clarity: one line under the price explaining the online-payment
       saving; delivery date beside the button.
    B. Proof: move the 4.8/5 Google rating next to the title.
    C. Size and scale: add the existing spec grid values to the first screen
       on phones.
    Chosen: A, because the price block is the first doubt on the page.

    CHECK (after the build, by a fresh chat)
    Gates to run: facts traced, no placeholders, nav and footer kept, fonts
    loaded, works at 390 px, button works, then the brand fidelity check.

    DECISIONS.md: chose A over B and C; strongest dissent is that reviews
    (B) answer more doubts. Test next: change-set A against the live page.

    CHECKS MISSED
    none

tweaks:
  - what: Improve or start fresh
    how: Say "start fresh" only if you want a new design. Otherwise your AI improves what you have and lists each change with its reason.
  - what: Number of options
    how: Two or three is the default. Ask for one if the job is small, but it still writes down what else it considered.
  - what: Who checks
    how: Use a new chat, another AI or a colleague for the check. The point is that the checker did not make the work.

judge:
  - The job card names the mode, and it is "patch" when something already exists.
  - Every design or copy choice points to the captured site, data or a named reference.
  - The options differ in idea, proof, structure, look or offer, not only in colour or wording.
  - The check is done separately, with pass-or-fail rules that cannot be averaged away.
  - The decisions file records the strongest objection and what to test next.

test:
  - Give it a job for a business with a live site and no other details. It should capture the site before it makes anything.
  - Ask for "a redesign". It should ask once whether to improve the page or replace it.
  - Read the options. If two differ only in colour, ask it to replace one.

improve:
  - Keep the context folder in your project, so the next job starts from the same capture.
  - Add lessons that apply to many clients to your agent's "Rules I learned", and keep client lessons in the client's folder.
  - Use it with Brand DNA capture, AI default patterns and Brand fidelity check, which it calls at the right steps.

works_best_with:
  tools:
    - {name: "An AI that can run code and use a browser", why: "Captures your site and runs the brand checks itself."}
    - {name: "A second chat or AI seat", why: "Does the independent check without having made the work."}
  inputs:
    - "Your website, or read access to the account or data the job is about"
    - "Two or three brands you admire and one you do not want to look like"

output_sample:
  input:
    - The job, in your own words
    - Your website, or the account or data the job is about
    - Brands you admire and one to avoid (optional)
  output:
    - name: Job card
      contains: Who, outcome, kind of work, success measure and mode.
    - name: Context and taste brief
      contains: Your captured site or data, and what to keep, learn from and avoid.
    - name: Options and the built work
      contains: Two or three real options, the chosen one built in your style.
    - name: Check and decisions
      contains: Pass-or-fail rules, a craft score, the decisions file and lessons worth keeping.
    - name: Checks missed
      contains: One line for each check that could not run, or none.

terms:
  - term: Mode
    meaning: Whether the job improves what exists (patch), adds to it (extend) or starts fresh (new).
  - term: Gate
    meaning: A pass-or-fail rule, such as "every fact has a source". A failed gate cannot be made up for by a good score elsewhere.
  - term: Fresh chat
    meaning: A new conversation, or another AI or person, that checks the work without having made it.
