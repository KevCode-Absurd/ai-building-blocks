new_slug: grounded-job-protocol
name: "Grounded job protocol"
summary: "Give it any real job. Your AI studies your business, makes real options and gets the work checked."
job: plan-strategy
thinking: medium
thinking_why: "It sets the order of work and the checks. The work itself is done by the skills it calls."

headline: "Make your AI's work do its job for your business"
subhead: Seven steps for any job bigger than a quick answer. Your AI writes a one-screen spec sheet and captures your real site or data. It makes about three real versions of the key part, and a fresh reviewer picks one. You get the finished work first.

explain: |
  AI work often looks the same for every business. Pages ignore the real site. Plans could belong to anyone. Even work that fits your brand can miss the point, like an email with no product in it. The AI was never told what the work is for.

  This protocol fixes the order of work. First your AI writes a one-screen spec sheet. It says who must do what after seeing the work, and lists five to seven tests the work must pass. Then it captures the real thing, your site or your account data. It makes about three real versions of the part that matters most, and a fresh reviewer picks one. It builds that one with true facts only. Before hand-over, another fresh reviewer reads it as your client would. Any claim without a source is removed.

when:
  - Your AI is about to make a page, ads, emails, copy, an audit, a plan or code for a real business.
  - Past AI work for you came back generic, or looked right but did not do its job.
  - You run several AI agents and want them all to follow one way of working.
not_for:
  - "Quick answers and one-line edits. Just ask."
  - "A brand-new business with nothing to capture yet. You can still use the steps; the capture step becomes your brand guide and references."

you_give:
  - The job, in your own words
  - Your website, or the account or data the job is about
  - Answers to a few short questions, or "you decide" (optional)
you_get:
  - The finished work first, with three to five lines on what it is and what to check
  - A one-screen spec sheet with the tests the work had to pass
  - Every fact traced to a dated source, and no claim your AI made up
  - A short list of any checks that could not run

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Describe the job and give your website or data.
  - Answer its few questions in one message, or say "you decide". It tells you what it will assume.
  - Let it work. It makes about three real versions of the key part, and a fresh chat picks one. You are not asked to choose.
  - Read the opening lines of the result. They say what was decided and what to check before you use it.

how_it_works:
  - title: Writes the spec sheet
    text: One screen with who must do what after seeing the work, the exact count, and five to seven tests the finished work must pass.
  - title: Captures what the job needs
    text: Measures your live site or pulls your real data. Every fact gets a source and a date. It checks that what you sell is live, in stock and at that price.
  - title: Writes a taste brief
    text: For work a buyer sees, it notes which brand codes to keep, which references to learn from and which AI habits to avoid.
  - title: Makes real candidates
    text: About three versions of the part that decides the result, such as three first screens or nine ad ideas. A fresh reviewer picks one.
  - title: Builds to a craft floor
    text: Gives true facts a new framing and adds no new facts. It makes one recommendation, never a menu, and fills every field the format needs.
  - title: Gets a client's-eye check
    text: A fresh reviewer sees only your brief, the work and the facts. Each test gets a pass or a fail. A claim with no source is removed.
  - title: Hands over the work first
    text: Three to five opening lines, then the work. No process notes reach you. Lessons are kept for the next job.

output_shape: |
  OPENING LINES (3 to 5)
  <what this is> / <the main decision and why> / <what to check before use>

  THE WORK
  <in the format you asked for, built inside your own system>

  APPENDIX
  <supporting detail, only if needed>

  CHECKS MISSED
  <one line each, or none>

  WORKING FILES (your AI keeps these; they are not part of the hand-over)
  context/spec.md         <the job, the count, 5 to 7 acceptance tests, decisions, assumptions, mode>
  context/facts.md        <every fact with its source and date>
  context/brand-dna.json  <your captured site, or a data snapshot for an audit>
  context/taste-brief.md  <brand codes to keep, references, defaults to avoid>
  DECISIONS.md            <working notes for the next job>

example:
  business: gehna
  input: |
    [the skill]

    Improve the product page for the Filigree Pearl 18K Gold Dangle Earrings
    on gehnaindia.com so more visitors add it to the cart.
  output: |
    SPEC SHEET (context/spec.md)
    The job: a shopper on this product page adds the earrings to the cart.
    Deliverable: 1 improved product page (web_page). Mode: patch, the page is live.
    Acceptance tests:
    1. Does a shopper see the price and any saving before the button? (job)
    2. Is the proof beside the place where a doubt starts? (job)
    3. Can Gehna publish this today on its own theme? (ready)
    4. Does every price, rating and policy match a dated source? (truth)
    5. After five seconds on a phone, is it clear what is sold and what to do? (clear)
    Decisions to take: which proof leads, what to cut from the first screen.
    Brand context: facts, voice and look.

    FACTS (context/facts.md, captured from / and the product page on 9 Nov 2026)
    Price 16,530 rupees. 4.8/5 from 519 Google reviews.
    Lato body and UPPERCASE buttons, Nanum Myeongjo titles, marigold #F6B74D
    main button with 4 px corners, white page, dark six-column footer.
    Buyer can act: to confirm on the live page before the build (stock, price, link).

    TASTE BRIEF (defaults to avoid)
    web-font-swap, web-sentence-case-buttons, web-accent-promoted,
    web-cream-premium, web-dropped-chrome, web-visible-placeholders.

    CANDIDATES (three first screens, each the live page as it would change)
    A. Price clarity: one line under the price explaining the online-payment
       saving; delivery date beside the button.
    B. Proof: the 4.8/5 Google rating moves next to the title.
    C. Size and scale: the existing spec grid values join the first screen
       on phones.
    Fresh reviewer's pick: A. The price block is the first doubt on the page.
    To take from B: the rating beside the title. Reviews answer many doubts.

    CHECK (after the build, by a fresh chat with only the brief, the page and the facts)
    Each acceptance test: pass or fail, with the line that proves it.
    Each claim: sourced or not. A claim with no source is removed.
    Gates to run: facts traced, the buyer can act today, no placeholders,
    nav and footer kept, fonts loaded, works at 390 px, button works,
    then the brand fidelity check.

    HAND-OVER (opening lines)
    This is the product page with the price block made clear and the rating
    moved beside the title.
    Main decision: lead with price clarity, because it is the first doubt.
    Check before use: the saving line against today's price, and the delivery date.

    CHECKS MISSED
    none

tweaks:
  - what: Improve or start fresh
    how: Say "start fresh" only if you want a new design. Otherwise your AI improves what you have and lists each change with its reason.
  - what: How many candidates
    how: About three is the default. Ask for two if the job is small. They are still made as real work, not as descriptions.
  - what: Who reviews
    how: Use a new chat, another AI or a colleague. The point is that the reviewer did not make the work and has not seen the reasoning.
  - what: How much brand context
    how: A page or an ad takes your facts, voice and look. A plan takes facts only. Say so if your job needs more or less.

judge:
  - The spec sheet has five to seven tests, and at least two are about the buyer or the decision.
  - Every price, rating, policy and product claim points to a dated source.
  - The candidates differ in promise, proof, structure or offer, not only in colour or wording.
  - The result gives one recommendation, not a list of options for you to pick from.
  - The work comes first, and nothing in it talks about the method or its files.

test:
  - Give it a job for a business with a live site and no other details. It should capture the site before it makes anything.
  - Ask for "a redesign". It should ask once whether to improve the page or replace it.
  - Check one price or rating in the result against your live site. It should match, and the facts file should show the date it was captured.
  - Read the candidates. If two differ only in colour, ask it to replace one.

improve:
  - Keep the context folder in your project, so the next job starts from the same capture.
  - Add lessons that apply to many clients to your agent's "Rules I learned", and keep client lessons in the client's folder.
  - Use it with Org context capture, AI default patterns and Brand fidelity check, which it calls at the right steps.

works_best_with:
  tools:
    - {name: "An AI that can run code and use a browser", why: "Captures your site and runs the brand checks itself."}
    - {name: "A second chat or AI seat", why: "Does the independent check without having made the work."}
  inputs:
    - "Your website, or read access to the account or data the job is about"
    - "Two or three brands you admire and one you do not want to look like"

output_sample:
  input:
    - The job, in your own words
    - Your website, or the account or data the job is about
    - Answers to a few short questions (optional)
  output:
    - name: Opening lines
      contains: What this is, the main decision and why, and what to check before use.
    - name: The work
      contains: The finished page, ads, emails, audit, plan or code, built in your style with true facts only.
    - name: Spec sheet and facts
      contains: The tests the work had to pass, and every fact with its source and date.
    - name: Checks missed
      contains: One line for each check that could not run, or none.

terms:
  - term: Spec sheet
    meaning: One screen that says what the work is for, how many pieces there are, and the tests it must pass.
  - term: Acceptance test
    meaning: A question the finished work must answer yes to, such as "Does every email show a product?"
  - term: Mode
    meaning: Whether the job improves what exists (patch), adds to it (extend) or starts fresh (new).
  - term: Gate
    meaning: A pass-or-fail rule, such as "every fact has a source". A failed gate cannot be made up for by a good score elsewhere.
  - term: Fresh reviewer
    meaning: A new chat, another AI or a person who checks the work without having made it.
