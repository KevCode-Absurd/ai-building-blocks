new_slug: growth-engine-finder
name: Growth engine finder
summary: "Find which growth engine drives your business: repeat use, referrals or paid. Get the sums, one metric to watch and the facts you still lack."
job: plan-strategy
thinking: medium
thinking_why: It picks one of three models and does short sums, but needs care with missing figures.
headline: Growth engine finder
subhead: It identifies a supported main growth model and calculates what your figures allow. Repeat-use data can show net customer growth, referral data can show a loop factor, and paid-customer data can show unit margin. These are different measures. Get a primary metric, its units and the next review date. Missing growth evidence stays unresolved.
explain: |
  A business can grow through customers staying, customers bringing others, paid acquisition or a mix. These are useful planning models, not proof that only one rate matters.

  This skill uses your records to choose a supported main model and show its sum. It keeps customer growth per period separate from a referral loop factor or lifetime unit margin. A positive margin alone does not show that customer numbers grew or that cash is available. Get a metric with clear units, supporting facts to keep and a review date.
when:
  - Growth has stalled and the team disagrees about why.
  - You are about to spend on ads, features or referrals and want to know which would matter.
  - Your weekly report has twenty numbers and no one acts on them.
not_for:
  - "You have no customer records yet: first collect data or run a small test with a few real buyers, then come back."
  - "You want to know if one idea is worth building: use the Minimum experiment planner."
  - "You want a case against a plan you already like: use the Plan objection writer."
you_give:
  - How your recent customers arrived and whether they stayed
  - Your rates, if you have them (optional)
  - Your plan (optional)
you_get:
  - A supported main model, or the evidence still needed to choose one
  - A calculation with units, assumptions and missing figures
  - A primary metric with its owner and review date
  - A simpler weekly view that retains necessary cost, customer-flow and cash evidence
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Describe where your last twenty customers came from and whether they stayed.
  - Paste your monthly figures if you have them.
  - Review the primary metric with its units and supporting counts, costs and cash timing.
output_sample:
  input:
    - How your last twenty customers arrived and whether they stayed
    - Your monthly rates, such as customers gained and lost (optional)
    - Your plan or earlier guesses (optional)
  output:
    - name: Main model
      contains: Which engine drives growth (repeat use, referrals or paid), or that it is unresolved, with the evidence used.
    - name: Supported sum
      contains: The formula with your figures and units, and what it does and does not show.
    - name: Watch
      contains: One main metric with how it is counted, who owns it and when to review it.
    - name: Drop list
      contains: Figures in your current report that do not matter for this engine.
    - name: Value check
      contains: What shows that people get a real benefit from the product.
    - name: Next test and limits
      contains: The lever to test as a guess, the signs the engine is tiring and a date to look again.
    - name: Missing and checks missed
      contains: Facts you did not give, and any check the answer failed.
how_it_works:
  - title: Picks the engine
    text: Sticky, viral or paid, from how customers arrive.
  - title: Names a primary metric
    text: "Keeps the units clear: customer rate, assumed loop factor or unit margin."
  - title: Does the sum
    text: With your numbers, gaps left open.
  - title: Gives a verdict
    text: Reports only the conclusion the supplied model supports; missing counts or timing leave customer growth unresolved.
  - title: Names what to watch
    text: Names the main metric while retaining the supporting evidence needed to interpret it.
  - title: Checks the value
    text: Whether people get a real benefit.
  - title: Notes the run-out sign
    text: And a date to check again.
output_shape: |
  MAIN MODEL
  <repeat use | referrals | paid | unresolved> | evidence <basis>
  Other models <roles and evidence>

  SUPPORTED SUM
  <formula, inputs and units>
  Customer growth per period <rate or unresolved>
  Loop factor <cohort/cycle assumptions or not applicable>
  Lifetime unit margin <basis or unresolved; not a customer rate>

  WATCH
  <primary metric> | units/counting basis <definition> | owner <name> | review <date>
  Supporting evidence to retain <customer flows, costs, cash timing>

  NEXT TEST / LIMITS
  <lever as hypothesis, assumptions and run-out signs>
  MISSING / CHECKS MISSED
  <list>
tweaks:
  - what: Monthly figures
    how: Real counts of gained and lost customers make the verdict firm instead of a range.
  - what: The cost of winning a customer
    how: "Add all of it: ads, staff time, shop rent. A low figure flatters the paid engine."
  - what: What a customer is worth
    how: Use value after the cost of serving them, over their whole time with you.
  - what: How people hear of you
    how: Tell it the actual route. Guesses push the pick to the wrong engine.
judge:
  - The main model is supported or explicitly unresolved; other material growth routes are not erased.
  - The sum uses your numbers, with gaps shown.
  - "Verdict units match the model: unit margin alone cannot establish per-period customer growth."
  - The primary metric has clear units and a counting basis, owner and review date.
  - The weekly view retains supporting customer, cost and cash evidence needed to interpret the primary metric.
test:
  - Run it on a business you know well. See if the engine matches how it grows.
  - Run it with a low and a high guess for a missing figure. Check whether the verdict flips.
  - Show the one rate to a teammate and ask what they would do if it fell.
  - Check the rate again next month and see if the engine pick still holds.
  - "Use lifetime value after service costs 30 and acquisition cost 22: unit margin 8, but customer growth per month remains unresolved without counts and timing."
  - "Use starting customers 100, new 30, lost 28 in one period: net growth 2%. A missing or zero starting base leaves the rate undefined."
improve:
  - Add your own period (week or month) and units to step 2 so sums come out in your terms.
  - Add the figures you already track so the drop list is specific.
  - Save each month's rate in a sheet to watch the trend, not the level.
  - Pair it with the Learning milestone planner to set targets for the rate.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Choosing an engine and doing the sums is text and arithmetic.
    - name: A spreadsheet
      why: Keeps monthly rates and shows the trend.
  inputs:
    - Customer counts gained and lost per month
    - Invitation or referral counts
    - Cost of winning a customer, in full
    - Revenue per customer after costs
terms:
  - term: Sticky growth
    meaning: Growth that comes from keeping customers coming back faster than you lose them.
  - term: Viral growth
    meaning: Growth where each customer brings others by simply using the product.
  - term: Paid growth
    meaning: Growth where you spend money to win each customer and reinvest the margin.
  - term: Churn
    meaning: The share of customers who leave in a period.
