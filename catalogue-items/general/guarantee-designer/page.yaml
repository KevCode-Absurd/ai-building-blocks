new_slug: guarantee-designer
name: Guarantee designer
summary: Design a money-back guarantee for your offer. Give it your price, costs and refunds. You get a draft, refund sums and the checks to run first.
job: make-offer
thinking: high
thinking_why: It must compare several guarantee types against your costs and run the sums. Give it your strongest model.
headline: Guarantee designer
subhead: It ranks buyer concerns, compares guarantee types and drafts clear conditions, timing and remedies. Get refund-and-cost scenarios, name ideas and missing checks. A revenue-only refund ratio does not preserve profit when delivery costs remain. Affordability and applicable rules need evidence; the draft stays unapproved where those checks are missing.
explain: |
  A guarantee can address a buyer concern, but it also creates costs and obligations. Refund rates, delivery costs, remedy costs and cash limits all affect what the business can afford. A guarantee cannot replace evidence for the promised result.

  This skill drafts options and shows supplied scenarios. It keeps the sales lift needed to preserve net revenue separate from the lift needed to preserve profit. A zero or negative new per-sale profit cannot recover a positive old profit just by selling more under the same assumptions. Missing costs leave affordability unresolved. Current consumer, claim and platform rules must be checked for the actual market before the draft is used.
when:
  - Buyers say they are not sure it will work for them.
  - You offer a generic 30-day refund and it does little.
  - You want a guarantee but fear refunds.
not_for:
  - "You are not sure risk is the real doubt and want the whole offer rebuilt: use the Customer offer builder."
  - "You already have a guarantee and only want it reviewed: use the Offer checklist reviewer."
  - "You need a legal ruling on what you may promise in your market: ask a qualified adviser, because this skill gives no legal advice."
you_give:
  - Your offer, price and what it costs you to deliver
  - Your refund rate and current sales (optional)
  - The actions a buyer must take to get the result
  - Rules on claims in your field (optional)
you_get:
  - The buyer's top fears, ranked
  - The guarantee type that fits, with the reason
  - The guarantee written in an if-then form, with options for the remedy
  - Refund-and-cost scenarios with supported profit-preserving lift, or an unresolved result
  - Three names for it, and a note on rules and limits
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the offer, price and cost to deliver.
  - List the actions a buyer must take for the result to happen.
  - Check the costs, cash limits and applicable rules before approving any use. A test needs agreed measures and loss limits.
output_sample:
  input:
    - "Your offer: what is in it, the price and how you deliver it"
    - What it costs you to deliver to one buyer, in time and cash
    - The actions a buyer must take to get the result
    - Your refund history and current sales (optional)
  output:
    - name: Buyer fears
      contains: The top three things a buyer worries about when they pay, ranked.
    - name: Type and why
      contains: Which kind of guarantee fits your price and delivery cost, and the reason.
    - name: The guarantee
      contains: One written promise with an if, a time and an or what.
    - name: Options for the remedy
      contains: Three to five choices for what you give the buyer if the result does not come.
    - name: Refund sums
      contains: Your costs and refund rates run through profit per sale, with the sales lift needed or an unresolved note.
    - name: Names
      contains: Three honest name ideas for the guarantee.
    - name: Limits and rules
      contains: What to check in your market before you use the draft.
    - name: Missing
      contains: Gaps in what you gave, marked so nothing is invented.
    - name: Checks missed
      contains: One line for each check that failed, or none.
how_it_works:
  - title: Finds the fear
    text: Ranks what buyers worry about when they pay.
  - title: Chooses the type
    text: By ticket size, cost to deliver and how measurable the result is.
  - title: Writes it with teeth
    text: If you do not get this result in this time having done these actions, we do this.
  - title: Runs the sums
    text: Keeps revenue-retaining and profit-retaining lift separate, counts stated costs on refunded buyers and flags undefined or unviable cases.
  - title: Names and checks
    text: Gives three name ideas and lists the applicable-rule and delivery-evidence checks; it does not clear an unverified draft.
output_shape: |-
  BUYER FEARS
  1. ... 2. ... 3. ...

  TYPE AND WHY
  <no condition, conditional, all sales final or pay on result>

  THE GUARANTEE
  If you <actions> and do not <result> within <time>, we <remedy>.

  OPTIONS FOR THE REMEDY
  <3 to 5 choices>

  REFUND SUMS
  <dated inputs and assumptions, per-sale profit, total profit and supported lift or UNRESOLVED>

  NAMES
  <3>

  LIMITS AND RULES
  <what to check locally>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check missed, or none>
tweaks:
  - what: Ticket size
    how: Low-ticket consumer offers suit broad guarantees. High-ticket or business offers suit specific ones.
  - what: How measurable the result is
    how: If you can measure it, pay-on-result is possible. If not, tie the guarantee to actions.
  - what: Appetite for risk
    how: Say whether you can afford to refund and still have spent the delivery cost.
judge:
  - The guarantee has an if, a time and an or what.
  - The type fits the ticket size and delivery cost.
  - Profit-preserving lift uses complete applicable costs and a positive new per-sale profit; revenue-only lift is labelled separately.
  - Proposed conditions have evidence tying them to the result; they do not override mandatory consumer rights.
  - A rules note is included and no result is promised that you cannot support.
test:
  - Redo the sums by hand. Net money before and after should match.
  - Give the guarantee to a buyer who is unsure. They should be able to say what they would do to qualify.
  - Track refunds for a month and compare them to the sums.
  - "Use price 900, cost 120, refunds 5% then 10%: per-sale profits 735 and 690; profit-preserving lift is about 6.52%, not the revenue-only 5.56%."
  - Use zero/negative new per-sale profit or missing costs. Do not promise affordability or divide into a positive sales target.
improve:
  - Start with a service or pay-on-result guarantee, and loosen it only once you know refunds stay low.
  - Tie each guarantee to the one action that best predicts success.
  - Revisit the sums quarterly.
works_best_with:
  tools:
    - name: Any good chat AI
      why: This is text and number work that any strong chat AI does well with the skill.
  inputs:
    - Your refund history
    - The cost to deliver per buyer
    - The actions that past successful buyers took
terms:
  - term: Conditional guarantee
    meaning: A guarantee that applies if the buyer takes stated actions and does not get the result.
  - term: Break-even lift
    meaning: How much sales must rise to cover a higher refund rate.
