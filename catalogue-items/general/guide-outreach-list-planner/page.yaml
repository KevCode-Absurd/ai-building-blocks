new_slug: guide-outreach-list-planner
name: Guide outreach list planner
summary: "Check your guide is worth sharing, then plan who to contact, a personal note for each type and a small first send with tracking."
job: grow-social
thinking: medium
thinking_why: It builds lists and writes personal notes, which needs judgement about fit.
headline: Guide outreach list planner
subhead: "Give it your new guide, its topic and who it is for. It checks the guide against the top rival page, then builds four lists of people to contact. You get a note for each list, a small first send with a stop rule and a way to track replies."
explain: |
  A guide that nobody hears about does nothing. Sending one message to thousands of people rarely works, and people can tell. Outreach works when the guide beats what is already out there and each note shows you read the other person's site.

  This guide outreach list planner checks the guide first. If it is not more detailed than the top rival page and well designed, it says so and stops. If it passes, it builds four lists of about 200 contacts by type: sites, blogs, Facebook pages and Twitter profiles. It writes one note template per list before the guide goes live.

  It then plans a small first send, so you learn which wording works, and sets a stop rule. Contacts must come from public places, every email needs your real name, an honest subject and a way to opt out, and each platform has its own rules. The reply rates in the skill come from a 2013 interview. They are a reference, not a promise.
when:
  - "You just finished a long guide, report or resource and need people to see it."
  - "You are about to email many sites and want each note to feel personal."
  - "You sent outreach before and got no replies."
  - "You want to know if your guide is strong enough before you spend time on outreach."
not_for:
  - "Your guide is thin or looks like a plain document. Improve it first. The guide check will stop the plan."
  - "You would email people who have no reason to expect it. Build an audience first with the Give before ask sequence planner."
  - "You want to launch through someone else's audience. Use the Network launch distribution planner."
  - "You want to pay for reach. Use the Reach-before-repeat planner."
you_give:
  - "Your guide, as a link or its text, and its topic"
  - "Who the guide is for"
  - "The top rival pages on the same topic (optional)"
  - "Sites and people you already know, to start the lists (optional)"
  - "What you offer the people you contact (optional)"
you_get:
  - "A check that the guide is worth sharing"
  - "Four lists of about 200 contacts each, with how to find the people"
  - "One personal note template per list, each naming the person's own site"
  - "A send plan with a small first send and a stop rule"
  - "A tracking table for replies and shares per list"
how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. For real names, use an AI that can search the web, or add names from your own research."
  - "Give the guide and the topic, and name the top rival pages if you know them. Without the guide and topic, it asks and stops."
  - "Read the guide check. If it says the guide is weak, fix the guide before any outreach."
  - "Fill the lists with real people from public sources. Do not buy lists or collect emails against a site's rules."
  - "Add one real fact about each person's site to each note. Send a few hundred first, with your real name and a way to opt out."
  - "Track replies by list, then bring the numbers back."
how_it_works:
  - title: Checks the guide
    text: Compares it with the top rival page for depth and design.
  - title: Builds four lists
    text: Relevant sites, blogs on the topic, Facebook pages and Twitter profiles, about 200 each.
  - title: Writes the templates
    text: One note per type, drafted before the guide goes live.
  - title: Makes each note personal
    text: Names the person's site and says why the guide fits their readers.
  - title: Plans a small send
    text: A few hundred first, learn the wording, then grow slowly.
  - title: Sets the tracking
    text: Replies and shares per list, with a comparison to a launch without outreach.
  - title: Checks the set
    text: Runs its own checks and names any it missed.
output_shape: |
  GUIDE CHECK
  Rival page: <the top rival> | Ours is more detailed: <yes or no, how> | Designed: <yes or no>

  LISTS (about 200 each)
  Sites: <who fits, how to find them> | Blogs: <...> | Facebook pages: <...> | Twitter profiles: <...>
  Each row: name | site | email or handle | why it fits | where the contact came from

  NOTES (exactly four, one per list)
  <type>: Subject: <...>
  Hi <name>, <opening line naming [their site / page / handle]>... <why the guide fits their readers>... <the link> ... <your name and how to opt out>

  SEND PLAN
  Batch 1: <n> | Stop rule: <...> | Then: <...>

  TRACKING
  Replies and shares per list | Compare with: <a launch without outreach>
  (2013 reference rates, not promises)

  MISSING
  <what would improve the plan>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - "Your guide, as a link or its text, and its topic"
    - "Who the guide is for"
    - "The top rival pages on the same topic (optional)"
    - "Sites and people you already know (optional)"
  prerequisites:
    - "A finished guide that is live or ready to publish"
    - "An AI that can search the web, if you want it to find real contacts (optional)"
  output:
    - name: "GUIDE CHECK"
      contains: "How your guide compares with the top rival page on depth and design, and a stop if it falls short."
    - name: "LISTS"
      contains: "Four lists of about 200 rows each, for sites, blogs, Facebook pages and Twitter profiles, with how to find them."
    - name: "NOTES"
      contains: "Four note templates, one per list, each opening with a line that names the person's own site."
    - name: "SEND PLAN"
      contains: "A first send of a few hundred notes, a stop rule and what to do next."
    - name: "TRACKING"
      contains: "Replies and shares per list, a launch without outreach to compare against, and 2013 reference rates."
    - name: "MISSING and CHECKS MISSED"
      contains: "What you did not give, and any of its own checks it missed."
tweaks:
  - what: The rival pages
    how: Name the top two or three. The depth check needs them.
  - what: How personal the notes are
    how: Add a fact about each person's site. Notes with a real detail get more replies than templates.
  - what: The send size
    how: A few hundred is the start. Raise it only after the first replies.
  - what: The list types
    how: Swap a type that does not fit your field for one that does, such as podcasts or newsletters.
judge:
  - Every note names the person's own site.
  - No two notes in a send are identical.
  - The guide is checked as more detailed than the top rival page before outreach.
  - The send size starts small with a stated stop rule.
  - Rates quoted are labelled as 2013 figures, not promises.
test:
  - Read one note as if you were the recipient. Would you reply?
  - Send ten notes and count replies before you send more.
  - Run it twice. The list types should stay the same.
  - Compare your reply rates with the 2013 reference and note any difference.
improve:
  - Add the sites and communities you already know to the lists.
  - Add words you never use in a note to the personal step.
  - Save the wording that got replies to your outreach file.
  - Pair it with a skill that writes the guide itself.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Drafting notes and sorting lists is text work any strong chat AI does well with this skill.
    - name: A spreadsheet
      why: Holds the lists, the notes sent and the replies, one row per person.
  inputs:
    - The top rival pages on your topic
    - A list of sites you already know and read
    - The stats of past outreach, if any
terms:
  - term: Outreach
    meaning: Contacting people one by one to show them something, in the hope they share or link to it.
