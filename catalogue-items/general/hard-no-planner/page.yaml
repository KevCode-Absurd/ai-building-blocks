new_slug: hard-no-planner
name: "Hard no planner"
summary: "Turn down a request without losing trust. Get a clear, respectful no with your real reasons, a fairness check and another way forward."
job: lead-people
thinking: low
thinking_why: "It follows a short fixed pattern and writes a few lines."

headline: "Hard no planner"
subhead: Paste a request you must turn down, who asked and why you cannot say yes. It says the request back, keeps only your true reasons, writes the no in one plain sentence and offers another way to reach what they want. You get words you can say or send.

explain: |
  A no that hides behind policy makes people feel brushed off. A harsh no makes them feel small. Either way they leave with no way forward, and trust drops. Most people also put the answer off for days because they dread it.

  This skill writes how to say no to a request, such as a raise, a refund or a favour. It starts from how you would want to be treated in their place. It says their request back so they know you listened. Then it tests each reason you give: is it the true one, or a cover for another? True reasons stay. "Policy" stays only when the policy really is the reason. Then comes the no in one sentence, with no softening in front of it, and a route to the goal behind the request.

  It also asks if you would give the same answer to anyone who asked, and if the company can afford the opposite. The method follows the golden-rule leadership in Mary Kay Ash's writing. For a quicker one-paste version, see the word-for-word no writer.

when:
  - Someone asks for a raise, a favour, a refund or an exception you cannot give.
  - You keep putting off an answer because you do not want to disappoint them.
  - You are about to write 'unfortunately, due to policy' and know it will land badly.
  - A client asks for more scope than the deal covers and you need to hold the line kindly.

not_for:
  - "You must tell someone they are being let go or have broken a rule: use the layoff plan writer for cuts, and HR or a lawyer for discipline or legal disputes."
  - "You want to give feedback on someone's work or behaviour, not decline a request: use the hard feedback message writer."
  - "You want a quick one-paste version with no setup: use the word-for-word no writer. This skill adds the true-reason test and the fairness check."
  - "You are too angry or hurt to write calmly: start with the Anger pause and repair planner."

you_give:
  - "The request, who made it and when"
  - "Your real reasons for saying no, even if they feel awkward"
  - "What you think they are trying to achieve (optional)"
  - "What you can honestly offer instead (optional)"
  - "Whether you will say it out loud or send it in writing (optional)"
you_get:
  - "Their request said back in your words"
  - "A guess at the goal behind it, marked as a guess"
  - "Your real reasons, in plain words"
  - "The no in one sentence, and the words to offer another route"
  - "A fairness check, and the whole message in under 150 words"

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. It needs no files, web access or paid tools.
  - Paste the request and say who asked and when. Add what you think they really need.
  - List your true reasons, even the awkward ones. If a reason is private, say so and the skill will say you cannot share it. It will not invent a cover story.
  - Say what you can offer instead, or ask it to suggest options for you to consider. Say whether you will speak it or write it.
  - Read the no out loud. Change any line you would not say to their face, then send it.

how_it_works:
  - title: Takes their seat
    text: Writes one or two lines on how you would want to be treated if you were asking. That sets the tone.
  - title: Restates the request
    text: Says what they asked in your own words, with what they said they need, so they know you listened.
  - title: Tests each reason
    text: Keeps the true reasons and drops cover stories. 'Policy' stays only if it really is the reason.
  - title: Says the no
    text: One sentence in the first person, with no softening word in front of it.
  - title: Finds the goal and a route
    text: Guesses what they are after and offers one to three routes you said you can do. With none, it marks it MISSING.
  - title: Checks fairness and blame
    text: Asks if you would say the same to anyone and removes any line that blames the person for asking.
  - title: Fits the setting
    text: Short lines if you will say it, an ordered note if you will send it. Under 150 words.

output_shape: |
  WHAT THEY ASKED
  <request restated>

  WHAT THEY MAY BE AFTER
  <the goal behind it, marked as a guess>

  THE NO, WORD FOR WORD
  <opening restatement>
  <real reasons>
  <the no in one sentence>
  <another route>

  FAIRNESS CHECK
  <fair to the company and to others>

  MISSING
  <what was not provided>

  CHECKS MISSED
  <one line per check missed, or none>

output_sample:
  input:
    - "The request, who made it and when"
    - "Your real reasons for saying no"
    - "What they are trying to achieve (optional)"
    - "What you can honestly offer instead (optional)"
  output:
    - name: "WHAT THEY ASKED"
      contains: "Their request said back in your own words, so they know you understood it."
    - name: "WHAT THEY MAY BE AFTER"
      contains: "The goal behind the request, marked as a guess unless they said it."
    - name: "THE NO, WORD FOR WORD"
      contains: "The restatement, your true reasons, the no in one sentence and another route, in under 150 words."
    - name: "FAIRNESS CHECK"
      contains: "One line on whether you would say the same to anyone, and one on whether the company can afford the opposite."
    - name: "MISSING and CHECKS MISSED"
      contains: "Any reason, option or fact you did not give, and any check it could not pass."

tweaks:
  - what: Your real reasons
    how: Be honest about them. If a reason cannot be told, the skill says so rather than inventing a cover story.
  - what: The goal behind the request
    how: Say what you think they want. A good alternative depends on it.
  - what: How you will deliver it
    how: Say if it is spoken or written. A spoken no is shorter and warmer than a written one.
  - what: What you can offer
    how: List real options, even small ones. A true small offer beats a vague promise.

judge:
  - It restates the request before giving any reason.
  - The no is stated directly and not left to be guessed.
  - Reasons are real, with no hiding behind policy.
  - Another path is offered that serves their goal.
  - Nothing in it blames the person.

test:
  - Give the draft to a colleague and ask what you are saying. They should say no, plainly.
  - Read it aloud. Mark any line you would not say to a face.
  - Run it twice. The no and the reasons should stay the same.
  - After you send it, note how the person responded and what they did next.

improve:
  - Add your standard reasons for each common request, so the reasons are ready and true.
  - Add options you can offer for common requests.
  - Save your best no's in one file the skill reads for style.
  - Pair it with a feedback conversation planner when the no is about performance.

works_best_with:
  tools:
    - {name: "Claude, ChatGPT or Gemini", why: "Restating a request and writing a short reply is text work. No files, web access or paid tools needed."}
    - {name: "Your email or chat app", why: "Check the length and tone in the place the message will be read."}
  inputs:
    - "The original message asking for the request"
    - "The policy or limit you are working under, in plain words"
    - "Options you can honestly offer"

terms:
  - term: Restate
    meaning: To say what someone asked in your own words so they know you understood.
  - term: Hide behind policy
    meaning: To cite a rule as the reason when the real reason is something else.
  - term: Fairness check
    meaning: Asking if you would give the same answer to anyone who asked in the same spot.
