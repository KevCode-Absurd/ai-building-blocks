new_slug: hedgehog-focus-finder
name: "Hedgehog focus finder"
summary: "Find what your business should focus on. Say what you do, love and do well. Get a plain focus statement, stop-doing list and one bet."
job: plan-strategy
thinking: high
thinking_why: "It has to find an honest overlap of three things and separate real strengths from competence, which needs careful judgement."

headline: "Hedgehog focus finder"
subhead: "Tell it what you do, what you love, what you do well and what you do badly. It finds where what you care about, what you can be best at and what drives your money overlap. You get a plain focus statement, a stop-doing list and one bet."

explain: |
  Many businesses spread across everything they could do. The ones that stay strong find one business focus, where three circles overlap: what you care about deeply, what you can be best at, and the one number that drives your income. The result is not a goal. It is a plain fact about what you are.

  This skill asks about each circle. It is as strict about what you cannot be best at as about what you can, because being good is not the same as being best. It names the one number that drives your money, strips boasts out of the statement, and asks who you want to be, as an identity and not a cost target. It then checks which large markets are about to change and whether your main strength fits them.

  It ends with a stop-doing list and one bet tied to a named strength. The first half follows Jim Collins' Hedgehog Concept. The identity and market steps come from interviews with Lisa Su. If you want to test whether an edge will last against rivals, use the Business power tester after this one.

when:
  - You are doing too many things and cannot say which one to put first.
  - You are setting a direction for the next few years and want it grounded in fact.
  - A new market is tempting you and you want to test it against what you are best at.
  - You run a small team and every new idea pulls you in a different direction.

not_for:
  - "You are choosing between two prices or two campaigns. Use the Pricing decision planner for prices, or the One bold move picker to back one move."
  - "You already know your focus and want to test whether your edge will last against rivals. Use the Business power tester."
  - "You want a list of products to cut. Use this first to find the focus, then the Product line cutter."

you_give:
  - What you do and who you do it for
  - What you love, what you do well and what you do badly, in the same message
  - Your brand file or notes on strengths (optional)
  - Rivals and what they do best (optional)

you_get:
  - A plain statement of the one thing to focus on
  - The three circles, each with evidence
  - The one number that drives your money
  - A stop-doing list and a bet that fits a named strength

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini. If you added it, call it by name. If not, copy it and paste it in.
  - Say what you do and who for. Then say what you love, what you do well and what you do badly. Be honest about the last one. It needs no files or web access.
  - Name the one number that drives your income, if you know it, such as profit per customer or revenue per hour.
  - Read the focus statement first, then the list of what you cannot be best at. Cut any boast.
  - Show the focus and the stop-doing list to a colleague who will push back.
  - Revisit it once a year, or when you face a major choice.

how_it_works:
  - title: What you love
    text: Lists what you are deeply passionate about, with evidence such as work you do for little or topics you return to.
  - title: What you can be best at
    text: Lists what you could be best at, and what you cannot be best at even if you are competent.
  - title: The engine measure
    text: Names the one measure that drives your money or resource engine.
  - title: Find the overlap
    text: Finds where the three overlap and writes it as a plain fact, not a goal.
  - title: Strip the bravado
    text: Removes boasts and anything that is only competence.
  - title: Your identity
    text: Asks who you want to be when you grow up, as an identity and not a cost goal.
  - title: Large changing markets
    text: Checks which markets are large and about to change, and picks a bet that fits a strength.
  - title: Check it
    text: Runs its own checks and names any it missed.

output_shape: |
  THE THREE CIRCLES
  Passion: <list> | Evidence: <fact>
  Best at: <list> | Cannot be best at: <list>
  Engine measure: <one measure> | Why this one: <reason>

  THE FOCUS
  <one or two sentences, a plain fact, not a goal>

  WHAT YOU WANT TO BE
  <identity in a sentence>

  FUNDAMENTALLY BEST AT
  <named strength> | Proof: <fact>

  LARGE MARKETS ABOUT TO CHANGE
  <market> | Why it is changing: <reason> | Fit with strength: <yes/no/partly>

  THE BET
  <bet> | Fits: <named strength>

  STOP DOING
  1. <item> | Why: <reason>

  MISSING
  <what would sharpen the statement>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - What you do and who you do it for
    - What you love, what you do well and what you do badly
    - Your brand file or notes on strengths (optional)
    - Rivals and what they do best (optional)
  output:
    - name: The three circles
      contains: What you care about, what you could be best at, what you cannot, and the one number that drives your money.
    - name: The focus
      contains: One or two plain sentences on what you are, written as a fact and not a goal.
    - name: What you want to be
      contains: Your identity in one sentence, not a cost or size target.
    - name: Fundamentally best at
      contains: The one deepest strength under the others, with proof.
    - name: Markets about to change
      contains: Large markets where a shift is coming, and whether your strength fits each.
    - name: The bet
      contains: One bet that fits the named strength, with the first step.
    - name: Stop doing
      contains: Activities outside the overlap, each with a reason.
    - name: Missing and checks missed
      contains: What would sharpen the statement, plus any check the skill could not pass.

tweaks:
  - what: Honesty about weaknesses
    how: Name what you do badly. The best-at circle is only as good as the list of things you cannot be best at.
  - what: The engine measure
    how: Pick one measure, such as profit per customer or revenue per hour. Two measures blur the focus.
  - what: Your rivals
    how: List what they do best. It shows where being best is out of reach.
  - what: Proof for strengths
    how: Give a fact for each strength, such as a result, a rating or a repeat customer.

judge:
  - It is an understanding, not a goal.
  - It says what you cannot be best at.
  - The economic engine is named with a measure.
  - There is a stop-doing list.
  - The bet fits a named strength.

test:
  - Read the focus to a colleague and ask if it describes the business or just sounds good.
  - Try the stop-doing list on one item for a quarter and see what you miss.
  - Run it twice. The focus should stay close.
  - Compare the focus with the last five big choices you made and see how many fit.

improve:
  - Add your own proof for each strength so the best-at circle is firm.
  - Add the measure your team already tracks as the engine measure.
  - Save the focus in your brand file and check new ideas against it.
  - Pair it with "Business power tester" to test the edge behind the focus.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Probing for the overlap of three ideas is reasoning work any strong chat AI does well."}
    - {name: "A trusted colleague", why: "Someone who will say when a strength is only competence is worth more than any tool."}
  inputs:
    - "Your results by product or service, to find the engine measure"
    - "Customer reviews that name what you do best"
    - "A list of things you said no to and the reasons"

terms:
  - term: Engine measure
    meaning: The one number that best shows what drives your money or resources, such as profit per customer.
  - term: Stop-doing list
    meaning: A list of things you drop because they do not fit the focus.
  - term: Hedgehog
    meaning: Jim Collins' name for a business that knows one big thing and does it better than anyone.
