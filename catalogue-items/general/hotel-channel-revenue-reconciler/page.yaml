new_slug: hotel-channel-revenue-reconciler
name: Hotel channel revenue reconciler
headline: Hotel channel revenue reconciler
summary: A room-night and net channel contribution bridge
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A room-night and net channel contribution bridge. Share same-property available room nights, direct and agent sold nights, realized rates, contracted commission and occupied-night service cash cost.
explain: |-
  A room-night and net channel contribution bridge.

  Hospitality operating finance. Illustrative figures only in USD unless labelled otherwise. This focused operating schedule does not establish a complete business forecast, accounting treatment, market price or approval.
when:
  - You need a room-night and net channel contribution bridge.
  - You work on hospitality operating finance and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Same-property available room nights, direct and agent sold nights, realized rates, contracted commission and occupied-night service cash cost.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A room-night and net channel contribution bridge.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: 1. Map dated source records, actual units, period cutoffs, currency, definitions and missing evidence before computing
    text: Map dated source records, actual units, period cutoffs, currency, definitions and missing evidence before computing.
  - title: 2. Reconcile available and sold room nights to the same property and stay period, excluding canceled bookings and duplicated reservations
    text: Reconcile available and sold room nights to the same property and stay period, excluding canceled bookings and duplicated reservations.
  - title: 3. Build gross room revenue by channel from realized rates, subtract contracted commission and preserve cash settlement differences separately
    text: Build gross room revenue by channel from realized rates, subtract contracted commission and preserve cash settlement differences separately.
  - title: 4. Deduct occupied-night service cash cost and report contribution separately from gross ADR and available-night revenue
    text: Deduct occupied-night service cash cost and report contribution separately from gross ADR and available-night revenue.
output_shape: |-
  A room-night and net channel contribution bridge.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Every material driver traces to a dated source; actuals and scenarios remain separate.
judge:
  - Every material driver traces to a dated source; actuals and scenarios remain separate.
  - Missing evidence blocks the affected calculation instead of becoming a zero.
  - Sold nights cannot exceed same-property available nights; data or perimeter exceptions require correction before this model is used. Zero sold nights makes ADR inapplicable.
  - Gross room revenue less commission and occupied-night cost equals modeled contribution; fixed property expenses remain outside.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
