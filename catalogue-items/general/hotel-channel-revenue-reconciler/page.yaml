new_slug: hotel-channel-revenue-reconciler
name: Hotel channel revenue reconciler
headline: Hotel channel revenue reconciler
summary: Reconcile hotel room nights and revenue by booking channel. Get net revenue after agent commission, contribution after service cost, and occupancy.
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it one property's available room nights, the nights sold direct and through an agent, the real rate for each, the agent commission rate and the service cost per occupied night. It checks the nights, then works out revenue by channel. You get net channel revenue, contribution and occupancy.

explain: |-
  A hotel can look full and still earn little from some channels. Agents and booking sites take commission, so a night sold through them leaves less cash than a night sold direct. Hotel channel revenue reconciliation shows that gap by putting both channels on the same page.

  This skill first checks the nights. Sold nights must come from the same property and stay period as the available nights, with cancelled and duplicate bookings left out. Then it multiplies nights by the real rate for each channel, takes the contracted commission off the agent revenue, and takes off the service cost of each occupied night.

  The result is contribution. It is not hotel profit, because rent, wages and other fixed costs stay outside. Gross room revenue and net revenue are both shown, so nobody quotes the larger number by mistake.

when:
  - Your agent or booking-site share is growing and you want to know what it costs you per night.
  - You are comparing direct bookings with agent bookings for last month or last quarter.
  - A new commission rate is proposed and you want its effect on net revenue before you agree.
  - An owner or lender asks for occupancy and net revenue per available night, with the working shown.

not_for:
  - "You want a full hotel profit and loss. This covers room revenue and a per-night service cost only. Fixed costs stay out."
  - "You want to set room prices or decide how many rooms to overbook. This is arithmetic on past or stated numbers, not pricing advice."
  - "You need revenue booked under accounting rules, or to match commission invoices to bank payments. Ask your accountant."

you_give:
  - "Available room nights for one property and one period, from your property system (PMS) or night audit"
  - "Nights sold direct and nights sold through an agent, with cancellations and duplicates taken out"
  - "The real average rate per sold night for each channel"
  - "The commission rate on agent bookings, from your contract or commission statement"
  - "Service cost per occupied night, such as housekeeping and supplies"
  - "The period dates, currency and scale"
you_get:
  - "Sold nights, occupancy, and gross room revenue by channel"
  - "Agent commission and net channel revenue"
  - "Contribution after the per-night service cost"
  - "Net revenue per available night"
  - "A list of anything missing, and which results it blocked"

how_to_use:
  - "Add the skill to your AI, or copy it into a new chat in Claude, ChatGPT or Gemini. Attach the PMS export and commission statement if your AI reads files."
  - "Give the nights, rates, commission rate and service cost for one property and one period. Say which currency you use."
  - "Check the input table first. Sold nights must not be higher than available nights. If they are, fix the data before you go on."
  - "Read net channel revenue and contribution before gross revenue. Gross is not what you keep."
  - "If a figure is missing, it names it and stops the results that need it. Add it and run again."
  - "A finance lead should check the sources before the result goes to an owner or lender."

how_it_works:
  - title: Maps your sources
    text: Lists each figure with its date, period, currency and where it came from.
  - title: Reconciles the nights
    text: Checks sold nights against available nights for the same property and stay period, and leaves out cancelled and duplicate bookings.
  - title: Builds revenue by channel
    text: Multiplies sold nights by the real rate for each channel to get gross room revenue.
  - title: Takes off commission
    text: Applies the contracted commission to agent revenue and keeps any cash settlement difference apart.
  - title: Takes off service cost
    text: Subtracts the service cost of each occupied night to get contribution.
  - title: Shows the ratios
    text: Reports occupancy and net revenue per available night, and marks an average rate as not applicable when no nights sold.

output_shape: |-
  SCOPE AND SOURCES
  <figure> | <source> | <date> | <currency, scale, period>

  INPUTS AND ASSUMPTIONS
  Available nights: <n> | Direct nights, rate: <n, rate> | Agent nights, rate: <n, rate> | Commission rate: <%> | Service cost per occupied night: <amount>

  CHANNEL BRIDGE
  Sold nights / occupancy: <n, %>
  Gross room revenue: <direct + agent>
  Commission: <agent revenue x rate>
  Net channel revenue: <gross less commission>
  Contribution: <net less service cost>
  Net revenue per available night: <net / available nights>

  CHECKS RUN
  <check> | <result>

  MISSING
  <figure and what it blocked>

  CHECKS MISSED
  <one line per check that failed or could not run, or none>

output_sample:
  input:
    - "Available room nights for one property and period"
    - "Nights sold direct and through an agent"
    - "The real rate per night for each channel and the agent commission rate"
    - "Service cost per occupied night"
  prerequisites:
    - "A property system (PMS) export or night audit for the period"
    - "The commission terms or a commission statement"
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: "SCOPE AND SOURCES"
      contains: "Each figure with where it came from, its date, currency and the stay period it covers."
    - name: "INPUTS AND ASSUMPTIONS"
      contains: "The nights, rates, commission rate and service cost you gave, kept apart from any assumption."
    - name: "CHANNEL BRIDGE"
      contains: "Sold nights, occupancy, gross room revenue, commission, net revenue, contribution and net revenue per available night."
    - name: "CHECKS RUN"
      contains: "Each tie-out and its result, including that sold nights do not exceed available nights."
    - name: "MISSING"
      contains: "Any figure it could not find, and which result that stopped."
    - name: "CHECKS MISSED"
      contains: "Every check that failed or could not run, or none."

next: [weekly-numbers-sheet-designer, numbers-drop-explainer]

tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Try a different commission rate or service cost to see the effect on contribution. Keep your actual figures beside the what-if figures.
  - what: Acceptance
    how: Before you share the result, check that each figure has a dated source, and that actual figures and what-if figures are not mixed.

judge:
  - Every material driver traces to a dated source; actuals and scenarios remain separate.
  - Missing evidence blocks the affected calculation instead of becoming a zero.
  - Sold nights cannot exceed same-property available nights; data or perimeter exceptions require correction before this model is used. Zero sold nights makes ADR inapplicable.
  - Gross room revenue less commission and occupied-night cost equals modeled contribution; fixed property expenses remain outside.

test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.

improve:
  - Save one reconciliation your finance lead has checked and signed off, so your AI copies its layout. Add the rules they use to accept a result.
  - When you correct a figure, note which source it came from and the date.

works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs. Without it, the AI does the sums in chat.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.

terms:
  - term: Room night
    meaning: One room let for one night. Ten rooms for two nights is twenty room nights.
  - term: Occupancy
    meaning: Sold room nights divided by available room nights.
  - term: Contribution
    meaning: Net room revenue less the per-night cost of serving a guest. It is not profit, because fixed costs stay out.
  - term: Agent commission
    meaning: The share of a booking that a travel agent or booking site keeps, as set in your contract.
  - term: Reconciliation
    meaning: A second check that compares two records or totals and explains any gap.
