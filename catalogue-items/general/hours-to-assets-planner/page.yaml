new_slug: hours-to-assets-planner
name: "Hours-to-assets planner"
summary: "See which of your income stops when you stop working. Get one way to turn your skill into something you own and a first step."
job: plan-strategy
thinking: high
thinking_why: "It reshapes how someone earns, so it has to weigh trade-offs between several routes."

headline: "Hours-to-assets planner"
subhead: "Paste how you earn today, with hours and pay if you know them. It marks each income line as pay that stops when you stop or pay that goes on without you. Then it picks one way to multiply your work, builds a product idea from your own skill and plans your first week."

explain: |
  If every dollar you earn needs another hour of your time, your income has a ceiling set by the clock. Some work escapes it: a product, a tool, a piece of media, a team that works for you, money that earns. It is hard to see which parts of your pay are which.

  This skill splits your earnings into pay tied to your time and pay that is not. It names which kind of multiplier could carry each time-tied line: other people, money, or code and media that cost almost nothing to copy. It prefers the kind that needs no one's permission, so you can start this month. It turns one skill or piece of judgment into a product you could own, works out your real hourly rate, and lists work to stop, hire out or automate.

  It promises no income and no timeline. The method draws on The Almanack of Naval Ravikant. If you do not yet know what you are paid for, run the Specific knowledge finder first.

when:
  - You are busy and well paid, but you stop earning the day you stop working.
  - You want to turn a service into a product and do not know which part.
  - You are weighing a raise or a job offer and want to know what you would own at the end.
  - You freelance or consult and your income follows your hours almost exactly.

not_for:
  - "You don't yet know what you are known for, or you are looking for a first job. Use the Personal expertise finder first."
  - "You want to cut or hand off tasks, not change how you earn. Use the Revenue-focused task planner or the Urgent versus important sorter."
  - "You run a business with set products and want more sales from them. Use the Business growth lever planner."

you_give:
  - "How you earn today: each client, role or product, with hours per week and what it pays"
  - The skill or judgment people pay you for. Clients' own words are best. (optional)
  - Your goal or income target (optional)
  - How much time and money you can risk (optional)
  - A sales or income sheet for the last year (optional)

you_get:
  - Each income line marked as paid only while you work, or beyond your hours
  - One way to multiply your work, with the reason, and which kind of multiplier it is
  - A product idea built from your own skill or name
  - Your real hourly rate, a stop or hire-out list and a first step for this week

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini. If you added it, call it by name. If not, copy it and paste it in.
  - Paste what you earn and from where, with hours where you know them. Estimates are fine if you mark them. It needs no files or web access.
  - Say what you are known for. What clients say about you is the piece most likely to become the product.
  - Read the time-tied lines first, then the route it picked and the product idea.
  - Say how much time and money you can risk, so the route fits you.
  - Do the one-week step, write down what you learned, and come back at the review date.

how_it_works:
  - title: Split how you earn
    text: Splits income into time-tied and not time-tied, and shows the share tied to your hours.
  - title: Name the multipliers
    text: "Names which kind could carry each line: people, money, or code and media."
  - title: Prefer the one needing no permission
    text: Prefers the route that needs no one's approval and can start this month.
  - title: Turn a skill into a product
    text: Describes a product built on one skill you are paid for, and what it replaces in your hours.
  - title: Decide what goes under your name
    text: Names what you put under your own name and the risk that carries.
  - title: Set a rate and a stop list
    text: Works out your hourly rate with the sum shown, and lists work to drop, hire out or automate.
  - title: Write the first step
    text: Writes one step that fits in a week and a review date a few months out.
  - title: Check it
    text: Runs its own checks, fixes what it can and names any it missed.

output_shape: |
  HOW YOU EARN
  - <line> | <hours per week> | <income> | <time-tied / beyond hours>
  Share tied to hours: <share>

  MULTIPLIER FOR EACH LINE
  - <line> | <people / money / code and media> | Needs: <what>

  THE ROUTE
  <chosen route and why it needs no permission, or what permission it needs>

  THE PRODUCT
  <who it is for, the problem, what it replaces>

  UNDER YOUR NAME
  <what, and the risk>

  YOUR RATE AND STOP LIST
  Rate: <figure and how it was worked out>
  - <task> | stop / hire out / automate

  FIRST STEP THIS WEEK
  <one step>
  REVIEW ON: <date> | Look at: <what>

  MISSING
  <facts that would change the plan>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "How you earn today: each client, role or product, with hours per week and what it pays"
    - The skill or judgment people pay you for (optional)
    - Your goal or income target (optional)
    - A sales or income sheet for the last year (optional)
  output:
    - name: How you earn
      contains: Each income line with its hours and pay, marked paid only while you work or beyond, plus the share tied to hours.
    - name: Multiplier for each line
      contains: Whether people, money, or code and media could carry each time-tied line, and what that needs.
    - name: The route
      contains: The one way chosen to multiply your work, and why it needs no one's permission.
    - name: The product
      contains: Who it is for, the problem it solves and what it replaces in your hours.
    - name: Under your name
      contains: What you will put under your own name, and the risk that carries.
    - name: Your rate and stop list
      contains: Your real hourly rate with the sum, and each task marked stop, hire out or automate.
    - name: First step this week
      contains: One step that fits in a week, a review date and what to look at then.
    - name: Missing and checks missed
      contains: Facts that would change the plan, plus any check the skill could not pass.

tweaks:
  - what: "Hours per line"
    how: "Real hours make the split and the rate sharper. Estimates are fine if you mark them."
  - what: "Your goal"
    how: "A goal changes how aggressive the first step is. Leave it out for a gentler plan."
  - what: "What you are known for"
    how: "Say what clients say about you. The product comes from that."
  - what: "How much risk you will take"
    how: "Say how much time and money you can lose. The route is sized to fit."

judge:
  - "Each income line says whether it pays only while you work or beyond."
  - "The plan uses one multiplier route, not all of them."
  - "Your name or judgment is part of the product."
  - "No income figure or timeline is promised."
  - "The first step fits in one week."

test:
  - "Run it on your last year of income and check the time-tied share against what you feel."
  - "Ask it for the stop list and see if you would really hand off those tasks."
  - "Do the one-week step and write down what you learned before the review date."

improve:
  - "Add your usual hourly rate and the tasks you hate, so step 6 names them."
  - "Add products you have thought of before, so it builds on them."
  - "Save the review date notes to a file and paste them in next time."
  - "Pair it with Specific knowledge finder if you do not yet know what your product should be about."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Judging advice and asking sharp questions is text work any strong chat AI does well with this skill."}
    - {name: "A spreadsheet", why: "Lets you keep hours and income per line so the split is easy to redo each quarter."}
  inputs:
    - "Hours per week for each income line"
    - "A sales or income sheet for the last year"
    - "Your specific knowledge (from Specific knowledge finder)"
    - "Clients' comments on what they value"

terms:
  - {term: "Time-tied", meaning: "Pay that stops when you stop working."}
  - {term: "Multiplier", meaning: "A way to carry your work to more people without more of your hours: people, money, or code and media."}
  - {term: "Code and media", meaning: "Software, writing, video and tools that cost almost nothing to copy once made."}
