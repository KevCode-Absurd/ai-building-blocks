new_slug: image-ad-gap-finder
name: "Image ad gap finder"
summary: "Find the image ad types you're missing. Attach your ads and results to get an ad gap grid, up to three test briefs and a score out of 100."
job: plan-ad-tests
thinking: high
thinking_why: "It studies ads or pages closely and works out why they work."

headline: "Image ad gap finder"
subhead: Attach screenshots of your image ads, with results and the claims you can back. It maps each ad by type and look, reads where buyers get stuck, and briefs up to three new tests. You get a gap grid, ad cards and a score out of 100.

explain: |
  Most ad accounts keep making the same two or three kinds of image ad, usually a product shot, a review card and a discount. When results flatten, the next batch is more of the same in new colours, or six new formats at once on a budget too thin to learn from.

  This skill puts every ad you run on one map. The map has nine ad types, sorted by the question each answers for a buyer, such as "what is it?" or "can I believe it?", and three looks: photographed, designed or phone-made. Empty spots show what you've never tried. Your numbers show which question buyers are stuck on. Plenty of clicks but few sales usually means "can I believe it?" hasn't been answered. It then briefs up to three new ads, each a different type, and works out how many your budget can feed to a result worth reading.

when:
  - Your image ads all look like product shots or discount cards and you want something different to test.
  - You have results but can't tell what they say about the next ad to make.
  - You're about to launch lots of new formats at once and want to narrow it to the few your budget can read.
not_for:
  - "You have no image ads running yet: write a plain test plan with the Ad test brief writer, or start with one simple product photo ad."
  - "You run video ads: use the Video ad format planner to choose what to film next."
  - "You already know the ad you want to test and only need the plan: use the Ad test brief writer."

you_give:
  - A screenshot of each image ad you run now, with its headline (attach them; your AI can see pictures)
  - Results per ad, with dates, if you have them
  - The claims you're allowed to make and the offers you run
  - Customer reviews or support tickets showing what buyers doubt (optional)
you_get:
  - A grid of your ads by type and look, with the empty spots shown
  - The signals in your numbers, each with the figures behind it
  - Up to three ad cards, each a different type, traced to a signal
  - A log of claims that were cut, so they don't creep back in
  - A score out of 100 for the plan, with one line for each check it missed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Attach a screenshot of each image ad you run and list its headline. Leave out videos.
  - Paste your results per ad, with dates. Without them you get guesses, and it says so.
  - Paste your claims list and offers, with dates for any sale.
  - Run each new ad against what already runs, then run the skill again with the results.
output_sample:
  input:
    - A screenshot of each image ad you run, with its headline
    - Results per ad with dates (optional)
    - The claims you can back and the offers you run
    - Customer reviews or support tickets (optional)
  prerequisites:
    - An AI that can read pictures
  output:
    - name: Grid
      contains: Your ads sorted by question, type and look, with the empty types listed.
    - name: Signals
      contains: What your numbers show and which buyer question each one points to.
    - name: Budget
      contains: How many new ads your two-week spend can bring to a readable result.
    - name: Ad cards
      contains: Up to three briefs, each a different type, with signal, picture, words, proof and how to judge it.
    - name: Cut claims
      contains: Claims removed because they can't be backed, so they stay out.
    - name: Score
      contains: A score out of 100 for the plan, with one line for each check missed.

how_it_works:
  - title: Codes every ad
    text: Gives each ad a type, a look and an audience. An ad known only by its headline is marked that way.
  - title: Fills the grid
    text: Counts your ads across nine types and three looks. Empty spots are the candidates.
  - title: Reads your numbers
    text: Compares each ad's click rate and sales per click with your account's middle value, once it has enough clicks or sales to mean something.
  - title: Finds where buyers stop
    text: Matches what it sees to a question, such as lots of clicks and few sales meaning "can I believe it?" is unanswered.
  - title: Picks what your budget can read
    text: Picks up to three new ads, each a different type, and works out how many your spend can bring to 20 sales each.
  - title: Writes ad cards
    text: Code, signal, picture, words, proof, how to judge it and where it breaks, plus a log of cut claims.

output_shape: |
  GRID (<n> image ads)
  <question>  <type>   <ads>   <dress, or "not captured">
  Empty types: <list>

  SIGNALS  (median <click rate>, <buys per click>)
  <n> <what you see, with the numbers>  -> <stuck question>

  BUDGET
  <spend for 2 weeks> / (20 x <cost per purchase>) = <n> tests

  CARD <n>
  Code        <type · dress · audience>
  Signal      <row and numbers>
  Picture     <what's in frame>
  Words       "<headline>" (<words>) + <up to 3 items>
  Proof       <fact or quote, with source>
  Read it by  <measure, read point, win line>
  Breaks if   <the likely failure>

  CUT CLAIMS
  <ad>  <claim, and why>

  SCORE  <n>/100 (<checks passed> of 4 checks)
  Missed: <one line per check still missed>

example:
  business: sprout
  input: |
    [the skill]

    Image ads running now (ad-results.csv, practice numbers). The
    images weren't captured, only headlines:
    P1 image: "'Sprout is too expensive': here's 61% off to prove
       otherwise" (two 21-day windows)
    P2 image: "Don't Pay Full Price. You Literally Don't Have To.
       (61% off inside)"
    S1 image: "Trusted by 1M+: Take 61% OFF"
    W1 image: "Support Muscle While You Lose Weight"
    R1 image: "The Daily Nutrition Every Runner Forgets"
    F1 carousel: "Struggling to Get Enough Fiber?"
    Full results for all 10 rows pasted below (T1, H1, K1 are videos).
    Buyer doubts: all 20 reviews (pasted below).
    Claims and offers: Sprout brand file (pasted below).
  output: |
    Image ads only. T1, H1 and K1 are videos, used for the medians
    only. Results are practice numbers, not benchmarks. All codes are
    headline only: no image was captured, so dress is blank.

    GRID (6 image ads)
    Why now?        The offer      3   P1, P2, S1 (S1 could be Checked
                                       fact; needs the image)
    Is it for me?   The moment     3   W1, R1, F1
    Empty types: Product alone, Look inside, Old way new way, In use,
    Their words, Checked fact, The occasion. 7 of 9.

    SIGNALS  (median of all 10 rows: click rate 1.30%, buys per click
    2.78%)
    1 Buys per click under the median on P2 (0.90%, 50 purchases), S1
      (2.38%, 38), W1 (2.56%, 23) and P1's second window (2.19%, 39).
      P2 has the best click rate in the account (2.45%) and the worst
      buys per click.  -> Can I believe it?
    2 P1's click rate fell 39%, from 1.50% to 0.92%, between its two
      21-day windows (3,750 then 1,780 clicks).  -> the look has worn
      out. MISSING: P1's image, to know which dress to change to.
    3 Reviews 1, 2 and 3 to 6 repeat quitting powders and finally
      sticking with it. No image ad says it.  -> Is it for me?
    R1 has 10 purchases: under the read point, read on clicks only.

    BUDGET
    $21,500 over about 30 days is about $10,000 for 2 weeks.
    $10,000 / (20 x $34.51 cost per purchase) = 14. Capped at 3.

    CARD 1
    Code        Their words · Designed · New
    Signal      1
    Picture     A warm cream card, the quote in big forest green type,
                yellow quote marks, the pouch small at the foot.
    Words       "Sprout has been the one thing I've been able to stick
                to." (12, a real quote) + "Sprout customer review"
    Proof       review 1, brand site. Hand-picked by the brand: credit
                it as a review, never "verified".
    Read it by  buys per click, after 20 purchases. Wins at 3.48% or
                more (25% over 2.78%).
    Breaks if   a face is added beside the quote, or it's reworded

    CARD 2
    Code        Checked fact · Designed · New
    Signal      1
    Picture     One big number on deep forest green, a small daily pack
                torn across the top beside it.
    Words       "12-week study: blood vitamin C up 40.1%" (7) +
                "2025 randomized, placebo-controlled study, 120 adults"
    Proof       the science page. The study measured absorption only.
    Read it by  buys per click, after 20 purchases. Win line 3.48%.
    Breaks if   it drifts into "energy" or "immunity", which the study
                didn't test

    CARD 3
    Code        Old way, new way · Camera · New
    Signal      3
    Picture     Split down the middle, same light both sides. Left: an
                unbranded powder tub, scoop and a shaker with a green
                ring. Right: one daily pack torn across the top, gummies
                in a palm.
    Words       "Greens without the shaker bottle" (5) + "No water. No
                mixing." under the right half
    Proof       product facts: no water, no mixing, no shaker. Reviews
                3, 4 and 6 for the hassle.
    Read it by  click rate, after 100 link clicks. Wins at 1.63% or
                more (25% over 1.30%).
    Breaks if   the tub looks like a real brand's, or the two halves
                are lit differently

    CUT CLAIMS
    P1, P2, S1  "61%" isn't on the site, which shows 49, 52, 55 and
                58%. MISSING: which number is live, with dates.
    W1  "Support Muscle While You Lose Weight": no evidence on file.
    R1  "Every Runner Forgets": nothing on file about runners. Cut
        "every", or the ad.
    S1  "1M+" is brand-reported. Keep only with its source.
    Stay cut: "Fix", "clinically backed formula for energy,
    immunity", "backed by 35,000+ studies", the dated "$1.26 vs $3.60".

tweaks:
  - what: Your results
    how: Paste impressions, link clicks and purchases per ad with dates. Picks backed by numbers come ahead of picks from empty cells.
  - what: A sale with dates
    how: Add a real start and end date. Only then will it brief The offer or The occasion.
  - what: An ad you've seen elsewhere
    how: Attach a screenshot of another brand's ad and ask for its code. It keeps the type and look and briefs it with a claim you can back.
  - what: Your budget
    how: Give your two-week spend and cost per purchase. It works out how many new ads can reach 20 purchases, up to three.

judge:
  - Every ad you run has one code, and headline-only codes are marked.
  - Every signal shows the numbers behind it and had enough clicks or sales to read.
  - The picks are different types, and each traces to a signal.
  - Every quote is word for word, and every number has its source.
  - Each card's headline is 7 words or fewer, or 12 for a real quote.

test:
  - Code your running ads yourself first, then run it. Where you disagree, read its reason. A mismatch usually means it had only the headline, not a screenshot of the ad.
  - Run it twice on the same ads. The grid and the signals must match exactly.
  - Work out one signal yourself from your results file, such as an ad's buys per click against the median. The numbers must match.
  - Run the cards against your current best ad, then run the skill again with the new results.

improve:
  - Write your claims list and your cut claims into "What you need" in the skill file, so cut claims stay cut across every round.
  - Add your own signals to the table in step 4 (for example "most complaints are about cancelling"), with the type that answers each.
  - Mark the types you can never fill (no study means no Checked fact), so they're never picked.
  - After each round, save the grid and the winner in your brand file, and paste the last grid next time.
  - Pair it with a skill that picks the right layout for each card, and with one that plans a larger test batch once a type wins.

works_best_with:
  tools:
    - {name: "Meta Ads Manager", why: "Exports impressions, link clicks, purchases and spend per ad for the dates you pick."}
    - {name: "Google Sheets", why: "Works out medians and click rates from the export, so you can check its numbers."}
    - {name: "Any good chat AI", why: "Coding ads and writing cards works well in any strong chat AI that can read images."}
  inputs:
    - "A screenshot of each running ad, so the look can be coded and not left blank"
    - "Your two-week spend and cost per purchase, so the budget check is exact"
    - "Last round's grid and cut-claims log, so it builds on what you learned"

terms:
  - term: Ad type map
    meaning: Nine kinds of image ad, sorted by the question each answers for a stranger, with three looks each.
  - term: Click rate
    meaning: Link clicks divided by the number of times the ad was shown.
  - term: Buys per click
    meaning: Purchases divided by link clicks. Low buys per click with a good click rate means people are curious but not convinced.
  - term: Median
    meaning: The middle value when your ads are lined up from worst to best. One extreme ad can't drag it.
