name: "Image ad maker with exact text"
new_slug: image-ad-maker-with-exact-text
summary: "Write a word-perfect image ad prompt with exact text, photo jobs and tool settings, plus a fix for each fault in what comes back."
job: make-image-ads
thinking: high
thinking_why: "It has to keep the product, its label and every word on the picture exact."

headline: "Image ad maker with exact text"
subhead: Paste your agreed image plan and attach your product photos. It writes tool settings and one prompt that gives each photo a job and every word once in quotes. You get the prompt, a check list for what comes back and a fix for each fault.

explain: |
  Image tools now spell well and follow long prompts, yet most images still fail on small things. A headline comes back with a letter missing, the label on your pack gets redrawn, a prop from a reference photo walks into your scene, or the product floats with no shadow. Each fix costs a try, and a careless retry can break what was right.

  This skill writes the brief the way current image models read best. Settings such as size and quality go in the tool, not the prompt. Each photo is numbered with one job ("use this for size only"). The product's most visible facts are written the same way every time. Every word sits once in quotes, top to bottom, with its place and colour. When the image comes back, it tells you what to read letter by letter and how to fix one fault per edit while keeping the rest.

when:
  - You've agreed what an image should say and show, and want it made right in as few tries as possible.
  - Your image tool keeps misspelling words, redrawing your label or copying things from your reference photos.
  - You found a prompt online and want to use its look without its people, brands or claims.
not_for:
  - "You still need to decide what the image says: settle the plan first, because this item only writes the prompt for an agreed plan."
  - "You need body copy or legal lines on the image: add that text in a design tool such as Canva or Figma after the picture is made."
  - "You want a video ad: this item makes still images only, so use a video tool or a person who edits video."

you_give:
  - The agreed plan, with the exact words (or "no words"), the scene, the layout and the sizes
  - Reference photos, attached, each with what it's for (optional; your AI can see pictures)
  - Facts about how the product looks and is used (optional)
  - Your brand colours as hex codes and a picture of your type (optional)
you_get:
  - The settings to choose in your image tool, kept apart from the prompt
  - One prompt, ready to paste, with a job for every photo
  - What to check letter by letter when the image comes back
  - A fix for each common fault, one edit at a time
  - A six-point match check, for the prompt and for each image that comes back

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your plan. Include every word that should be on the image, exactly as written.
  - Attach your photos and say what each is for, such as "the product as sold" or "the light I want".
  - In your image tool, set the ratio, size and quality first. Then attach the photos in the order given and paste the prompt.
  - Attach the image that comes back to the same chat for its match check. If one thing is wrong, paste the fix line for that one thing and keep the rest.
output_sample:
  input:
    - Your agreed image plan, with the exact words, scene, layout and sizes
    - Reference photos, each with what it is for (optional)
    - Facts about how your product looks and is used (optional)
    - Your brand colours as hex codes (optional)
  prerequisites:
    - An agreed image plan, written before you start
    - An image tool that takes reference photos, such as GPT Image, Nano Banana, FLUX or Ideogram
  output:
    - name: Settings
      contains: The ratio, size, quality and photo order to set in your image tool, kept apart from the prompt.
    - name: Prompt
      contains: One paste-ready prompt with a job for each photo, the product facts, the scene, the layout and every word once in quotes.
    - name: Check when it comes back
      contains: The words to read letter by letter, the product details to compare and the likely leaks from your photos.
    - name: Missing
      contains: Anything the plan did not settle, listed so you can fill it in.
    - name: Match check
      contains: A six-point check of the prompt and each image that comes back, with one line for each miss.
    - name: Fix table
      contains: One edit for each common fault, with what to keep, and when to start fresh instead.

how_it_works:
  - title: Locks the plan
    text: Lists every fixed word, subject, scene and size. Anything still open goes on a MISSING line. A borrowed prompt loses whatever your plan didn't approve.
  - title: Splits settings from words
    text: Ratio, resolution and quality are set in the tool. Writing "4K" in a prompt sets nothing.
  - title: Gives each photo one job
    text: Every photo is numbered, with what to take from it and what to ignore, so its props and people stay out.
  - title: Keeps the product true
    text: The same two or three visible facts in every prompt, the printing kept as photographed, and the size anchored to a hand or an everyday object.
  - title: Writes the scene, then the layout
    text: Sentences in order of importance, named props, then zones in reading order with where the empty space goes.
  - title: Writes each word once
    text: In quotes, top to bottom, with place, colour and how the type looks, plus a count of the pieces of text.
  - title: Fixes one fault per edit
    text: A fix table matches each fault to one edit, repeating what to keep, and says when to start fresh instead.

output_shape: |
  SETTINGS (set in the tool, not in the prompt)
  Model, ratio, resolution, quality, photos in order

  PROMPT
  <what the image is and where it runs>
  Reference photos: Image 1: <what, take, ignore> ...
  Product: <2 or 3 visible facts>. <what it must never become>.
  Scene: <two to four sentences>
  Layout: <zones from top to bottom; the empty space>
  Words, top to bottom (exact, nothing else):
  <role, place, look, hex>: "<exact words>"
  The image has exactly <N> pieces of added text.
  Hands and use: <only when held, opened or worn>
  Keep out: <the few things that must not appear>

  CHECK WHEN IT COMES BACK
  <words to read letter by letter; product details; likely leaks>
  MISSING: <anything the plan didn't settle>

  MATCH CHECK
  CHECKS MISSED: <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Plan: product page image 3, "Why does it work?"
    - Kind: a finished product page image for the Sprout store
    - Words: headline "One pack. 60+ ingredients." Points: "21 vitamins
      & minerals", "6g prebiotic fiber", "Vegan, pectin base"
    - Scene: the pouch standing on a soft two-colour gradient, a few
      gummies scattered in front
    - Layout: headline band at the top, pouch centre-left, three points
      in the right third
    - Sizes: 1:1 and 4:5
    - Tool: GPT Image

    Photos: 1 = the pouch, front on. 2 = gummies in an open hand.
    Product facts: glossy deep green stand-up foil pouch, big yellow
    wordmark, yellow bear face top right, "28 Daily Packs" at the
    bottom. Gummies: small opaque deep-green bears, soft matte, about
    thumbnail height. The big pouch opens only at its resealable top
    and is never shown torn.
    Colours: deep forest green #002C17, warm cream #FFF7DF, sunflower
    yellow #FFCC2E. Type: bold plain sans for headings, medium for body.
  output: |
    SETTINGS (set in the tool, not in the prompt)
    Model: GPT Image · Ratio: 1:1 first, then 4:5 as its own image
    Quality: high (small text on the image)
    Photos attached, in this order: 1 = pouch, 2 = gummies in hand

    PROMPT
    A photorealistic product page image for an online store.

    Reference photos:
    Image 1: the pouch as sold. Match its shape, colours and printing
    exactly. Ignore its background.
    Image 2: gummies in an open hand. Use it for the gummies' size,
    colour and soft matte finish only. Ignore the hand.

    Product: a glossy deep green stand-up foil pouch, big yellow
    wordmark, yellow bear face top right, "28 Daily Packs" along the
    bottom. Always a stand-up pouch, never a tub, jar or box. Keep the
    printing exactly as in Image 1; do not redraw it. The pouch is
    closed at its resealable top.

    Scene: The pouch stands upright on a smooth gradient that fades from
    warm cream #FFF7DF at the top to sunflower yellow #FFCC2E at the
    bottom. A few small deep-green gummy bears lie scattered in front
    of it, each about the height of a thumbnail. Bright, even light
    with a soft shadow under the pouch. The camera faces the pouch
    straight on at its middle.

    Layout: Top fifth: a plain cream band for the headline. Left half:
    the pouch, about half the frame height. Right third: three points
    stacked, each with a small sunflower yellow dot. Bottom fifth: no
    text.

    Words, top to bottom (exact, nothing else):
    Headline, top band, bold plain sans-serif, sentence case,
    #002C17 (deep forest green): "One pack. 60+ ingredients."
    Point 1, right third, medium plain sans-serif, #002C17:
    "21 vitamins & minerals"
    Point 2, below it, same style: "6g prebiotic fiber"
    Point 3, below it, same style: "Vegan, pectin base"
    No full stop after any point. The image has exactly 4 pieces of
    added text. No other text except what is printed on the pouch.

    Keep out: people and hands, a second pouch, a box, buttons,
    borders, badges.

    For 4:5, make a new image with the same prompt, and change the
    layout line to: "Top quarter: the headline band, with more space
    above it."

    CHECK WHEN IT COMES BACK
    Read the numbers in the headline and point 1 digit by digit, and
    check point 1 kept its ampersand. Compare the wordmark, bear face
    and pack count with Image 1. Count 4 pieces of added text. No full
    stop after point 1. No hand from Image 2 in the picture.
    MISSING: the pouch's real height. It stands alone, so no size is
    stated beyond the gummies.

    MATCH CHECK
    CHECKS MISSED: none (the prompt asks for each check clearly;
    check the image again when it comes back)

tweaks:
  - what: The photo jobs
    how: Change what you say a photo is for and the prompt changes with it. "In a hand" gives only the size, "in use" gives only the action, and "the light I want" gives light and camera height but never its product or people.
  - what: No words on the image
    how: Say "no words" in the plan. The words section is left out and a clean zone is named instead, such as "the top third is plain wall", so you can add type later in a design tool.
  - what: The image tool
    how: Name your tool. The settings line changes to its real controls, and the prompt follows its habits, such as describing what is there instead of using "no" for a model that ignores it.
  - what: An edit, not a new image
    how: Paste the image you made and say what's wrong. You get one line that changes that one thing and repeats what to keep.

judge:
  - Every planned word appears in the prompt once, in quotes, spelled exactly as in the plan.
  - Every attached photo has one job, with what to take and what to ignore.
  - Ratio, size and quality are in the settings, not written into the prompt.
  - The type is described by its look, and every colour has a hex code.
  - Nothing appears that the plan didn't approve, such as a new claim, person, prop or style.
  - On the returned image, the pieces of text can be counted and the count matches.

test:
  - Run it on an image you already made and liked, with the plan you made it from. The new prompt should keep the same words, product facts and layout, and add a job for every photo.
  - Run it twice on the same plan. The words section should match letter for letter. If it changes, your plan isn't exact enough at that point.
  - Make the image and count the pieces of text. The count should match the prompt, with every word spelled as in your plan.
  - Give it a prompt you found online, along with your plan. Check that none of that prompt's people, brands, props or claims made it into yours.

improve:
  - "Write your colours as hex codes and how your type looks into step 7 (for Sprout: deep forest green #002C17, warm cream #FFF7DF, bold plain sans for headings), so every prompt describes them the same way."
  - "Add your product's two or three most visible facts to step 4 as a fixed line (for Sprout: glossy deep green pouch, big yellow wordmark, yellow bear face top right)."
  - Add the faults your own image tool makes most often to the fix table, with the fix that worked.
  - Write your tool's real settings into step 2, such as its ratios, sizes and how many photos it takes.
  - Pair it with the skill that writes down how your product looks from its photos before you start, and the one that makes the finished image bigger without changing it.

works_best_with:
  tools:
    - {name: "GPT Image", why: "Reads numbered photos and quoted words closely, and edits one part while keeping the rest."}
    - {name: "Nano Banana", why: "Takes several product and people photos at once, and Google suggests it for finished images with text."}
    - {name: "Ideogram", why: "Lets you set each block of text and where it goes, and on paid plans you can fix one wrong word without a new image."}
    - {name: "FLUX", why: "Matches hex colour codes tied to each object, which helps when brand colours must be exact."}
  inputs:
    - "A plain-background photo of the product, front on and at least 2000 pixels wide, so the label is copied, not guessed"
    - "Your logo as a clean PNG or SVG file, to attach as artwork or add after"
    - "A photo of the product in a real hand, so its size comes out right"
    - "Your show-it-right rules, such as how the pack opens and what's never shown"
    - "An image that came out right before, with the prompt that made it"

terms:
  - term: Reference photo
    meaning: A photo you attach so the image tool copies one thing from it, such as the product's shape or the light.
  - term: Hex code
    meaning: A six-character colour code, such as "#002C17", that names one exact colour.
  - term: Edit
    meaning: Asking the tool to change one part of an image it already made, while keeping everything else.
