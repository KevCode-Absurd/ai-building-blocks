thinking: high
thinking_why: "It studies ads or pages closely and works out why they work."
new_slug: image-ad-remake-planner
name: "Image ad remake planner"
summary: "Turn your best video ad into an image ad or swipe carousel. Every word stays in order, and you get a prompt for each image or card."
job: make-image-ads

headline: "Image ad remake planner"
subhead: Give it your best ad, with screenshots of its shots, your brand file and product photos. It puts every line on an image or in the post text, in order, and flags lines too long instead of cutting them. You get image prompts, the cards and the post words.

explain: |
  When a video ad works, you want it in the feed as an image too, or as a carousel people swipe. Remaking it by hand usually means rewording it, and the rewording often drops the one line that was doing the selling. Cramming every word onto one picture loses the glance.

  This skill has no say over the words. It lays out the original in order, finds the beat that does the persuading and checks a still or carousel can carry it. A reveal needs its own card, so it lands on a swipe. Then it places every line: on the image, or in the post text, always in the original order. Each image or card follows the image-ad rules: the glance test, a headline of 7 words or fewer, at most 3 other things to read, big type, strong contrast, feed sizes, and your real pack laid over the picture. A line that breaks a rule is flagged for you, never trimmed.

when:
  - A video ad works and you want the same ad as a feed image or a carousel.
  - You're handing a remake to a designer and need the words locked.
  - You want a carousel where the reveal lands on a swipe, not mid-card.
not_for:
  - "Your ad depends on motion you watch finish, like a pour or a before and after: use the Best ad in a new format skill for a video remake."
  - "You want to reword or shorten the ad: this keeps every word unchanged, so rewrite the script first."
  - "You have no working ad yet: write a script first with the Customer quote video ad writer."

you_give:
  - The original ad, with a screenshot of each shot, plus every spoken word, on-screen line and the post text
  - Still or carousel, the size and the number of cards if it's fixed
  - Your brand file, with label text, claims, the live offer, fonts and colors
  - Real product photos, attached (optional, needed if the product appears)
you_get:
  - The ad laid out in order, and the beat that sells with its risk in the new format
  - A layout and a card or slot table, with every line placed and any over-long line flagged
  - An image prompt per image or card, and the post words
  - The edit step that lays your real pack on, and a word count against the original
  - Any check it couldn't pass, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the original ad's words. For a video, attach a screenshot of each shot and list its time and words.
  - Say "still" or "carousel" and the size, for example "carousel, 4:5". Attach your product photos.
  - Read the flags. Decide for each over-long line whether to run it as it is or move it to the post text.
  - Make each picture from its prompt, then add the words and your real pack in your editor.
output_sample:
  input:
    - Your original ad, with a screenshot of each shot and every spoken word, on-screen line and post text
    - Still or carousel, plus the size and number of cards if fixed
    - Your brand file, with claims, live offer, fonts and colors
    - Your product photos (optional)
  prerequisites:
    - An AI that can read images, if you attach screenshots
    - An image maker such as Nano Banana, to turn each prompt into a picture
    - An editor to add your words and real pack on top
  output:
    - name: Laid out
      contains: The original ad in order, with each shot, its words and the job it does.
    - name: The beat that sells
      contains: The beat that persuades, whether a still or carousel can carry it, and the risk.
    - name: Layout and cards
      contains: A still or carousel plan with every original line placed on a card, with over-long lines flagged.
    - name: Image prompts
      contains: One text-free scene prompt per image or card, built from the original setting and product.
    - name: Post words
      contains: The original post text, unchanged, or a note that it is missing.
    - name: Edit step
      contains: How to lay your real pack and words over each picture and check contrast.
    - name: Notes and checks missed
      contains: A word count against the original, flags, missing inputs and any check it could not pass.

how_it_works:
  - title: Lays the ad out
    text: Lists each shot or part in order with its time, picture and words, and labels what each one does.
  - title: Finds what sells
    text: Picks the beat that persuades and says up front if a still or carousel can't carry it, such as a reveal in a single frame.
  - title: Places every line
    text: One beat per card for a carousel, with the reveal on its own swipe. For a still, the opening as the headline and the rest in the post text, in order.
  - title: Applies the image-ad rules
    text: The glance test, a 7-word headline, at most 3 other things to read, 30 px type, 4.5:1 contrast, 4:5 or 1:1. Breaks are flagged, not fixed.
  - title: Rebuilds the pictures
    text: Keeps the original's setting, props and product, shows the moment each line is about, and writes a prompt with no text in it.
  - title: Counts the words
    text: Checks every original word appears once, in order, across the images and the post text.

output_shape: |
  LAID OUT (the original, in order)
    <E1> <element> "<words>"  Job: <opening, problem, turn, proof, offer>

  THE BEAT THAT SELLS  <the beat, whether the format carries it, the risk>

  LAYOUT  <still or carousel>, <4:5 or 1:1>, <pixels>
    <0 to n %> <words on a calm band> | <n to 100 %> <picture>

  CARDS
    <n> <job> "<the original line>" <words> <flag or ok>
       Picture: <the moment the line is about>

  IMAGE PROMPT (card <n>)  <scene, action, product, light, framing, no text>

  POST WORDS  <the original post text, unchanged, or MISSING>
  EDIT STEP   <real pack overlay, word placement, contrast check>
  NOTES  Word check: <n> of <n>, in order. Flags: <...>  MISSING: <...>
  CHECKS MISSED  <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Original ad: a 20-second narrated video (an earlier Sprout script,
    not a live ad).
    1 "Greens powder takes a scoop, water and a shaker."
    2 "Then the shaker needs washing."
    3 "A Sprout pack takes one tear."
    4 "Inside: sixty-plus ingredients, 21 vitamins and minerals, 6
       grams of fiber."
    5 "One tear. That's the routine."
    Offer on screen: "$29.99 first order with text sign-up. Renews at
    $49.99 every 4 weeks." Post text: none on file.
    New format: carousel, 4:5, Instagram feed.
    Product: glossy deep green stand-up pouch, big yellow wordmark,
    yellow bear face top right. Photos: pouch front, daily pack in a
    hand. The daily pack tears straight across its top edge only.
    Colors: deep forest #002C17, warm cream #FFF7DF. Font: Work Sans.
    Brand file: attached (brand.md).
  output: |
    LAID OUT
      E1 line 1 "Greens powder takes a scoop, water and a shaker." problem
      E2 line 2 "Then the shaker needs washing." problem
      E3 line 3 "A Sprout pack takes one tear." turn
      E4 line 4 "Inside: sixty-plus ingredients, ..." proof
      E5 line 5 "One tear. That's the routine." close
      E6 offer text, on screen at the end. offer

    THE BEAT THAT SELLS  The turn in line 3: three steps, then one
    tear. A carousel keeps the order if "one tear" lands on its own
    swipe. Risk: you see a frozen tear instead of watching it.

    LAYOUT  carousel, 4:5, 1080 x 1350, 5 cards, one look
      0-20 %   cream band: the card's line, Work Sans Bold
      20-100 % the picture

    CARDS
    1 problem "Greens powder takes a scoop, water and a shaker." 9
      words: FLAG, over the 7-word glance limit, kept whole
      Picture: a scoop of green powder over a glass of water, a
      shaker beside it on a kitchen counter
    2 problem "Then the shaker needs washing." 5 words: ok
      Picture: a green-ringed shaker in the sink
    3 turn "A Sprout pack takes one tear." 6 words: ok
      Picture: two hands tearing a daily pack straight across its top
    4 proof "Inside: sixty-plus ingredients, 21 vitamins and minerals,
      6 grams of fiber." 11 words: FLAG, kept whole
      Picture: small deep-green gummy bears in an open palm, the
      pouch soft behind
    5 close "One tear. That's the routine." 5 words: ok
      + offer line (12 words, the original's terms) + button
      Picture: the pouch and the torn empty pack on the counter

    IMAGE PROMPT (card 3)
    Two adult hands over a sunny kitchen counter tearing a small flat
    daily pack straight across its top edge, the strip half off,
    window light from the left, the top fifth a plain cream wall for
    words, 4:5, no text. (Cards 1, 2, 4 and 5 follow the same order.)

    POST WORDS  MISSING: the original's post text. Left empty and
    flagged; no new words written.
    EDIT STEP  Set each line on the cream band, deep forest on cream
    (about 14:1). Lay the real pouch, cut out from its photo, over the
    one in card 5. Type: lines 56 px, offer 30 px.
    NOTES  Word check: 48 of 48 words, in order, none changed. Flags:
    cards 1 and 4 run past 7 words; you decide whether to keep them or
    move them to the post text. MISSING: the daily pack's own label
    words, so card 3 frames it from the side.
    CHECKS MISSED  none

tweaks:
  - what: Still or carousel
    how: A carousel gives each beat a card and the reveal a swipe. A still keeps only the opening, the turn and the offer on the image, and moves the rest to the post text.
  - what: Number of cards
    how: Fix the count and beats are joined in order, never dropped. Fewer cards than beats means more lines per card, which the glance test may flag.
  - what: Over-long lines
    how: Say "move over-long lines to the post text" and those cards carry the picture alone, with every word still in order.
  - what: A video instead
    how: For the same ad in a new video style, use "Video ad style remake planner".

judge:
  - Read the cards and the post text in order. They match the original word for word.
  - The reveal has its own card, so it lands on a swipe.
  - Each card has a headline of 7 words or fewer or is flagged, with at most 3 other things to read.
  - No new claim, number or offer appears anywhere, including in the prompts.
  - The product matches your photos, with your real pack laid on.

test:
  - Run it on an ad you know well, then read only the lines on its cards aloud. They must match the original word for word, in order.
  - Give it an ad with a line you know breaks one of your claim rules. It should flag the line and leave it.
  - Ask for a still from a five-line video. Lines it can't fit on the image should appear in the post text, in order, not disappear.
  - Show each card for 2 seconds to someone who hasn't seen the video. They should be able to say what it's about.

improve:
  - Add your product photo list and how the product opens to "What you need" in the skill file, so pictures are always rebuilt the right way.
  - Write your house carousel size and card count into the brief step, if you always use the same.
  - Fix flagged lines in the original first if you want them on the image. A remake carries every word over, mistakes included.
  - Pair it with the skill that checks a finished ad before you spend, once the images are made.

works_best_with:
  tools:
    - {name: "Claude", why: "Keeps every word of the original in order across a long remake and counts them back."}
    - {name: "Nano Banana", why: "Works from your product photos as references, so the pack keeps its true shape in every card."}
    - {name: "Meta Ads Manager", why: "Its preview shows the carousel in each placement before you spend."}
  inputs:
    - "The original ad file itself, not just its words, so each picture matches its setting and framing"
    - "The ad's results, so you know which beat earned them and must survive"
    - "Your live offer terms, so an offer that has ended gets flagged"

terms:
  - term: Carousel
    meaning: An ad made of several images or cards that people swipe through.
  - term: Beat
    meaning: One step in the ad's argument, such as the problem, the turn, the proof or the close.
  - term: Post text
    meaning: The words above the image in a feed ad, also called primary text.
  - term: Glance test
    meaning: Showing the ad for 2 seconds. If a stranger can say what it's for, it passes.
