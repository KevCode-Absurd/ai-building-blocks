new_slug: image-ad-test-learnings
name: Image ad grid production and test planner
summary: Plan 50 image ads as a grid of buying reasons, ad types and looks. Get a pilot row and briefs, and see which reason or type sells.
job: plan-ad-tests
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
headline: Image ad grid production and test planner
subhead: It plans up to 50 image ads across buying reasons, ad types and looks, shrinking the grid when proof is thin. It checks a pilot before making more. You get briefs, images where possible and gaps. Image tools and stage approvals are needed; budget and winner rules are heuristics, not proof of sales lift.
explain: |
  A first big batch of ads often turns into fifty versions of one idea, so when one wins you can't tell why. Was it the message, or the kind of ad? Or the batch fills with invented urgency, fake experts and stock faces that can't be used.

  This workflow plans the 50 as a grid. Five reasons to buy run across five ad types, each in two looks. Every reason meets every type, so afterwards you can see whether a reason won or a type won, with ten ads behind each answer. It checks your budget first: about 100 sales across the sprint reads every row and column, and if that's too much it shrinks the grid instead of padding it. A cell it can't fill honestly stays empty. You approve the grid, then a pilot row of ten finished ads, before it makes the rest.
when:
  - You're about to make your first large batch of image ads and want each one to teach you something.
  - Past batches looked varied but all made the same argument.
  - You want a plan your team can split up and brief, with counts that prove the mix is balanced.
not_for:
  - "You only need one ad: use the Single image ad planner, which briefs a single image ad."
  - "You have no buyer research or product photos yet: gather your reviews and photos first, because this plan leaves out reasons it can't back."
  - "You want to check finished ads against Meta rules: use the Meta ad policy checker."
you_give:
  - Your org context with voice, claims, live offers, guarantee and never-show list
  - Buyer research such as reviews, buyer types and their own words
  - A list of the product photos you have and what each one shows
  - Your cost per sale and past ad results, such as the Results section of your org context's log.md (optional)
you_get:
  - A list of your photos saying which can lead an ad, with a shoot suggestion if there are too few
  - Five reasons to buy, five ad types and two looks, with the proof for each
  - The grid of 50, empty cells marked, counts per row and column, and a budget check
  - After your approvals, a pilot row, then all the briefs and finished images with their check results
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your org context and buyer research underneath, including only offers that are live today.
  - List every product photo you have and what it shows. Be honest if you only have one or two.
  - Ask for stage 1 only. Read the grid, the budget check and the MISSING lines before you approve anything.
  - Reply "approved" to move on. If you ask for changes, it shows the stage again and waits.
output_sample:
  input:
    - "Your brand facts: voice, claims, live offers, guarantee and never-show list"
    - Your buyer research, such as reviews and their own words
    - A list of your product photos and what each one shows
    - Your cost per sale and past ad results (optional)
  prerequisites:
    - An image tool such as ChatGPT or Gemini if you want the pictures made in chat
    - "Your approval at two points: the grid, then the pilot row"
  output:
    - name: Photo list
      contains: Each photo, what it shows, whether it can lead an ad, and a shoot suggestion if you have too few.
    - name: Reasons to buy
      contains: Five reasons, each with the buyer, the problem, what only this product does and the proof.
    - name: Ad types and looks
      contains: Five ad types covering at least three buyer questions, and two looks.
    - name: Grid
      contains: The planned ads with an idea in each cell, empty cells marked, and counts per row and column.
    - name: Budget check
      contains: The purchases needed and the estimated spend, shown as a rough planning guide.
    - name: Pilot row
      contains: Ten finished ads from one reason, made first so you can approve the look.
    - name: Briefs and images
      contains: A brief and image for each remaining ad, with check results and any failures shown.
how_it_works:
  - title: Lists your photos
    text: Notes what each photo shows and whether it can lead an ad, and suggests a shoot if you have too few.
  - title: Picks five reasons to buy
    text: Each needs three separate buyers saying it, or one buyer and a past ad that beat your usual cost per sale.
  - title: Picks five ad types
    text: Uses a skill that finds the image ad types you're missing, covering at least three of the four buyer questions.
  - title: Fills the grid
    text: Every reason meets every type in two looks. Cells it can't fill honestly are marked empty.
  - title: Checks the budget
    text: Works out the sales needed to read every row and column, and shrinks the grid if your budget can't reach it.
  - title: Makes a pilot row
    text: Uses a skill that plans an image ad's layout to brief and make ten ads, then waits for your approval before the other forty.
  - title: Makes and checks the rest
    text: Uses a skill that finds flaws in finished image ads. Failed images are shown, never hidden.
output_shape: |
  STAGE 1 PLAN. Nothing is briefed until you approve.

  PHOTOS
  <photo>   <what it shows>   <can lead | supports only, and why>
  <shoot suggestion if there are too few>

  REASONS TO BUY (rows)
  R<n> <buyer | problem | only this product | proof>

  AD TYPES (columns)  <5 types, and the questions they cover>
  LOOKS               <2 dresses>

  GRID (<dress>)
          <type>   <type>   <type>   <type>   <type>
  R<n>    <idea>   <idea>   EMPTY    ...

  COUNTS   <ads per row, per column, total>
  BUDGET   <purchases needed> x <cost per purchase> = <spend>
  MISSING: <photos, research, live offer, source>
  APPROVAL 1  WAITING FOR YOU.
