tweaks:
  - what: Grid size
    how: Ask for 4 x 4 x 2 (32 ads) or 3 x 3 x 2 (18 ads) if your budget can't reach about 100 sales. The rules stay the same.
  - what: Live offers
    how: List only offers running today, with an end date. Only then can a "Why now?" type join the grid, and it takes one column at most.
  - what: The two looks
    how: Name them if you know which you've tested least, such as phone-made and photographed.
  - what: Your audience
    how: Say "people who know us" and it leans the types toward "can I believe it?" and "why now?".
judge:
  - Every reason to buy names three buyers, or one buyer and a past ad that beat your cost per sale.
  - Every cell in the grid is either a real idea or marked EMPTY with the reason.
  - The counts per row and column add up to the total.
  - Read two cell ideas aloud. Each names something true about your product that a rival couldn't copy unchanged.
  - It stopped at the approval and didn't start writing briefs.
test:
  - Add the counts yourself. Rows and columns must each add up to the planned total, with empty cells subtracted.
  - Run stage 1 with last year's winning ad in the past results. Its reason to buy should be a row. If it isn't, your research doesn't cover that buyer yet.
  - Run stage 1 twice. The rows and columns should mostly match. If half of them change, give it fewer, sharper buyer descriptions.
  - Ask for changes and check it shows the plan again and waits.
  - After the sprint, check each winning row or column had about 20 sales before you call it.
improve:
  - Write your cost per sale into "What you need" in the skill file, so the budget check is exact every time.
  - Add your live offer and the one discount number that's real, so a "Why now?" column never quotes a number the site states two ways.
  - Mark the types you can never fill (for example Checked fact, with no study on file), so they're never chosen as a column.
  - After the sprint, keep the winning row and column and plan the next grid around them.
  - Pair it with a skill that finds the image ad types you've never tried before you start, and with one that finds flaws in finished image ads at the end.
works_best_with:
  tools:
    - name: Claude
      why: Holds a 50-cell plan and its rules across a long chat without dropping cells.
    - name: Google Sheets
      why: Adds up results by row and column once each ad name carries its code.
    - name: GPT Image
      why: Makes many pictures from the same product reference photos.
    - name: Meta Ads Manager
      why: Runs the sprint and exports purchases per ad, so the grid can be read.
  inputs:
    - A naming rule that puts each ad's row, column and look in its ad name, so results sort into the grid
    - A fresh product shoot by view (open, in hand, in use), so more cells can be filled honestly
    - Your account's cost per purchase for the last 30 days, so the budget check uses a real number
terms:
  - term: Grid
    meaning: The plan of the sprint. Rows are reasons to buy, columns are ad types, and each cell is made in two looks.
  - term: Pilot row
    meaning: One row of ten finished ads, made first so you can approve the look and the briefs before the other forty.
  - term: Reading a row
    meaning: Adding up the results of every ad in it, so you learn about the reason to buy, not one ad.
