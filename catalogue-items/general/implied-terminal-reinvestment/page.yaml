new_slug: implied-terminal-reinvestment
name: Implied terminal reinvestment schedule
headline: Implied terminal reinvestment schedule
summary: Work backwards from a terminal value to the cash flow, reinvestment and return on new capital (ROC) it assumes. Give it value, NOPAT, growth and WACC.
job: money-and-investing
thinking: high
thinking_why: "The terminal value is taken as given and worked backwards, so the method only holds if it covers operating assets at the terminal date."
subhead: Share terminal operating value, first stable-year NOPAT (operating profit after tax), stable growth and the matching WACC (discount rate). You get the cash flow the value assumes (FCFF), the reinvestment it needs and the return on new capital (ROC) it implies.
explain: |-
  A terminal value hides two assumptions: how much profit the business must plough back to grow, and what that new money earns. This works both out from the value you already have. FCFF is the cash left for investors after reinvestment. ROC is the return earned on new reinvestment.

  If you start from growth and return on capital instead and want the reinvestment a terminal value needs, use the Terminal growth reinvestment checker. This one starts from the value and works backwards.

  Public equity valuation. Illustrative figures. A terminal value of 1,000 at a 10% WACC and 3% growth implies FCFF of 70. With NOPAT of 100, reinvestment is 30, or 30% of NOPAT. Growth of 3% divided by a 30% reinvestment rate gives a ROC of 10%. A value of 800 implies FCFF of 56, reinvestment of 44 (44%) and a ROC of 6.818182%.
when:
  - You have a terminal value and want to know what reinvestment and return on capital it assumes.
  - A terminal value looks too high and you want to test whether the growth it needs is believable.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You need a full company valuation or an investment call: use a person who does valuation work, such as an analyst or adviser."
  - "You are valuing a bank, insurer or other financial firm: this method does not fit, so use a model built for financial firms."
  - "Your reinvestment comes out zero, negative or above 100%: the steady-state view fails, so rework your growth, WACC or terminal value first."
  - "You start from growth and return on capital and want the reinvestment a terminal value needs: use the Terminal growth reinvestment checker instead."
you_give:
  - Terminal operating value, first stable-year NOPAT, stable growth and matching WACC.
  - "The terminal date, plus the currency and scale used for the implied terminal reinvestment."
  - "Your spreadsheet tool, if you want the implied terminal reinvestment as a workbook."
you_get:
  - An implied FCFF, reinvestment-rate and ROC workpaper.
  - "An editable workbook of the implied terminal reinvestment, with its inputs, formulas and test cases to rerun."
  - "A tie-out of the backsolved cash flow and the terminal value, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the terminal value, first stable-year NOPAT, growth and WACC."
  - "Tell it what you need: the cash flow, reinvestment rate and return on capital hidden in the terminal value."
  - "Ask it to stop and mark MISSING if the terminal value or the WACC is not in your sources."
  - "Check that the backsolved cash flow rebuilds the terminal value exactly, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Your terminal operating value, at the terminal date, for operating assets only
    - Your first stable-year NOPAT (operating profit after tax)
    - Your stable growth rate and matching WACC (discount rate)
    - Reporting date, currency, scale and accounting basis
  prerequisites:
    - An AI that can read and write spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Scope and dated sources
      contains: The valuation date, currency, scale, accounting basis and the dated source for each input.
    - name: Inputs and assumptions
      contains: Each input and assumption, kept apart from reported facts, with gaps marked MISSING.
    - name: Model calculations and reconciliations
      contains: Implied FCFF, reinvestment, reinvestment rate and return on capital, plus a check that FCFF rebuilds your terminal value.
    - name: Actual file verification
      contains: The recalculation, formula and reopen checks that were run on the workbook.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
how_it_works:
  - title: Check the value
    text: Confirms the value is at the terminal date and covers operating assets only, and records how it was valued.
  - title: Find the cash flow
    text: FCFF is value times (WACC minus growth). Reinvestment is NOPAT minus FCFF.
  - title: Find the rate and return
    text: Reinvestment rate is reinvestment divided by NOPAT. ROC is growth divided by the reinvestment rate.
  - title: Flag a broken result
    text: Zero, negative or above-100% reinvestment means the steady-state view fails. It is flagged, not adjusted.
output_shape: |-
  An implied FCFF, reinvestment-rate and ROC workpaper.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING lines
  CHECKS MISSED
tweaks:
  - what: "Terminal date"
    how: "Take the terminal date from the terminal value, first stable-year NOPAT, growth and WACC. Use one currency and scale on every line."
  - what: "Stable growth"
    how: "Change the stable growth and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Backsolved FCFF reconstructs supplied terminal value exactly.
judge:
  - Backsolved FCFF reconstructs supplied terminal value exactly.
  - Timing, currency and operating perimeter match across all inputs.
  - Trace dates, currency, scale, accounting perimeter and source pages for every material input.
  - Keep the focused illustration separate from a complete investment conclusion; list unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one implied terminal reinvestment you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define terminal value into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
