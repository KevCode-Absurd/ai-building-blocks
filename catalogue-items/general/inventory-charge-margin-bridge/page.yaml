new_slug: inventory-charge-margin-bridge
name: Inventory charge margin bridge
headline: Inventory charge margin bridge
summary: Find how much inventory write-downs and reversals moved your gross margin. Get a reported-to-charge-excluded margin bridge you can trace to its sources.
job: track-numbers
thinking: high
thinking_why: "A charge must sit inside the cost line you adjust, and repeating charges stay a real cost, so each needs reading against the notes."
subhead: A reported-to-charge-excluded gross-margin bridge with recurring-cost cautions. Share reported revenue/COGS, inventory write-downs and reversals included in that COGS, plus accounting basis and notes.
explain: |-
  A reported-to-charge-excluded gross-margin bridge with recurring-cost cautions.

  Issuer accounting and earnings. Illustrative figures. Reported margin is (1,000 - 700) / 1,000 = 30%. A charge of 30 less a reversal of 10 is a net charge of 20, or 2 percentage points, so the charge-excluded margin is 32%. With a zero reversal, the charge is 30 and the charge-excluded margin is 33%.
when:
  - You need a reported-to-charge-excluded gross-margin bridge with recurring-cost cautions.
  - You work on issuer accounting and earnings and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You need to value inventory or decide how big a reserve should be: ask your accountant or auditor, because this only shows what past charges did to margin."
  - "You want to treat all write-downs as one-off costs: do not use this to hide them, because repeat obsolescence is a real cost of doing business."
  - "You need to track an earlier write-down through later sales item by item: use an inventory ledger or a stock-level spreadsheet instead."
  - "You need a LIFO to FIFO inventory and earnings bridge: use the LIFO reserve earnings bridge instead."
you_give:
  - Reported revenue/COGS, inventory write-downs and reversals included in that COGS, plus accounting basis and notes.
  - "The reporting period, plus the currency and scale used for the inventory charge margin bridge."
  - "Your spreadsheet tool, if you want the inventory charge margin bridge as a workbook."
you_get:
  - A reported-to-charge-excluded gross-margin bridge with recurring-cost cautions.
  - "An editable workbook of the inventory charge margin bridge, with its inputs, formulas and test cases to rerun."
  - "A tie-out of reported margin and the charge-excluded margin, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the income statement and the inventory write-down notes."
  - "Tell it what you need: reported gross margin and the margin with inventory charges and reversals removed."
  - "Ask it to stop and mark MISSING if a disclosed write-down or reversal is not in your sources."
  - "Check that each disclosed charge or reversal is counted once and sits in the stated line, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Reported revenue and cost of goods sold (COGS) for the period
    - Inventory write-downs and reversals included in that COGS, from the notes
    - Accounting basis, reporting date, currency and scale
    - Your spreadsheet tool and the file format you want (optional)
  prerequisites:
    - An AI that can create and reopen spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation script (optional)
  output:
    - name: Scope and dated sources
      contains: The period, accounting basis and the dated sources each figure comes from.
    - name: Inputs and assumptions
      contains: Revenue, COGS, charges and reversals as reported, with currency, scale and signs, kept apart from assumptions.
    - name: Model calculations and reconciliations
      contains: Net charge, COGS without it, and gross profit and margin before and after, tied back to the statements.
    - name: Actual file verification
      contains: "What was checked in the saved workbook: recalculation, changed input, formulas and reopening the file."
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs that could not be found and checks that failed or did not run, or none.
how_it_works:
  - title: 1. Locate disclosed write-downs and reversals and verify both sit inside the selected COGS line rather than elsewhere
    text: Locate disclosed write-downs and reversals and verify both sit inside the selected COGS line rather than elsewhere.
  - title: 2. Net current charges and permitted reversals, remove the signed net charge from COGS and reconcile gross-profit and margin effects
    text: Net current charges and permitted reversals, remove the signed net charge from COGS and reconcile gross-profit and margin effects.
  - title: 3. Keep reported margin primary; explain that recurring obsolescence remains an economic cost and do not relabel all charges as nonrecurring
    text: Keep reported margin primary; explain that recurring obsolescence remains an economic cost and do not relabel all charges as nonrecurring.
output_shape: |-
  A reported-to-charge-excluded gross-margin bridge with recurring-cost cautions.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING lines
  CHECKS MISSED
tweaks:
  - what: "Reporting period"
    how: "Take the reporting period from the income statement and the inventory write-down notes. Use one currency and scale on every line."
  - what: "Net inventory charge"
    how: "Change the net inventory charge and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Each disclosed charge or reversal is included once and agrees to its income-statement location.
judge:
  - Each disclosed charge or reversal is included once and agrees to its income-statement location.
  - US-GAAP reversal restrictions and IFRS reversal ceilings are not conflated.
  - Tie all inputs to source notes, dates, currency, scale and signs.
  - Retain reported figures beside analytical adjustments and list every unresolved source gap.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one inventory charge margin bridge you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define write-down into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
