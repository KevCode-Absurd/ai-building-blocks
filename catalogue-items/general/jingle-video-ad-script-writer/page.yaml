new_slug: jingle-video-ad-script-writer
name: "Jingle video ad script writer"
summary: "Paste product facts and buyer. Get a 6 to 30 second jingle script and score out of 100."
job: make-video-ads

headline: "Jingle video ad script writer"
subhead: Give it your product facts, buyer's moment and approved claims. It writes a rhymed jingle about what they get, picks a sound to match and lays it out bar by bar, a picture per line. You get the lyric, a music-tool brief and a score out of 100.

explain: |
  Memory research on jingles points the same way again and again. Words set to a simple tune are easier to recall, especially when the tune comes back. Rhymed lines feel truer. Faster tunes with a familiar shape tend to stick. Most song ads ignore this. They open on a long intro, change the tune every chorus, or chant the brand name instead of the reason to buy.

  This skill writes the hook first: 4 to 8 syllables about what the buyer gets, sung from the first bar and repeated on the same tune. It picks the sound from the buyer's moment (a morning rush wants a faster beat than a wind-down), lays every line on a bar grid so the length is right, and puts your brand name in a short sung tag at the end. A sung claim follows the same rules as a spoken one.

  It ends with a cast note: the singer's voice and who is on screen, and why. The skill that turns a song script into shots makes the music first, then the video, from there.

when:
  - Your product sells on a feeling (ease, relief, fun) and a catchy line would help people remember it.
  - Your spoken ads explain well, but nobody remembers them a day later.
  - You want a 6, 15 or 30 second ad for people who know the problem but haven't picked a fix.

you_give:
  - Why people buy, how much they already know, and the length (6, 15 or 30 seconds)
  - Your buyer and the moment your product fits into, like a school run or a late shift
  - Your main benefit, how the product is used, and any brand lines
  - Your brand voice and whether your brand uses music in ads
  - Your approved and banned claims, the offer and the guarantee
you_get:
  - Three hook drafts, the pick and why
  - Two sound options and the pick, chosen by fit with the buyer's moment
  - The lyric on a bar grid, with a picture for every line
  - A sound brief for the music tool, a claims list and a cast note
  - A score out of 100 for how many of its own checks the script passes, with any it missed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your brand file or product facts and approved claims underneath.
  - Say who the buyer is, the moment the product fits into, the length, and whether your brand uses music.
  - Clap the beat and sing the hook. Check every sung claim against your claims list.
  - Take the script and cast note to the skill that turns a song script into shots. It makes the music first, then runs the video process.

how_it_works:
  - title: Checks the fit
    text: A song suits a feeling and a phrase that sticks. It's weak at explaining how something works, at proof and at offer terms.
  - title: Writes the hook
    text: Three drafts of 4 to 8 syllables about what the buyer gets, with a rhyme or repeated sound. It picks one and says why.
  - title: Picks the sound by fit
    text: Sets the tempo from how fast the moment is, the instruments from the product's world, and the voice from who the buyer would hum along with.
  - title: Lays out the bars
    text: Works out seconds per bar from the tempo, then fits the hook, verse, lift and tag to 6, 15 or 30 seconds.
  - title: Writes the lyric
    text: Sings the hook from bar 1 and repeats it on the same tune, puts key words on the beat, and saves the brand name for the tag.
  - title: Checks the claims
    text: A sung line may claim no more than a spoken one. If a fact doesn't fit the rhythm, it changes the words around it, never the fact.
  - title: Writes the cast note
    text: Describes the singer's voice and who is on screen (one animated lead, the cast on the tag, or the product alone), and why.

output_shape: |
  HOOK DRAFTS  1 "<...>"  2 "<...>"  3 "<...>"
  PICK         <number>: <why>

  SOUND  A <genre, tempo, voice, instruments>: <why>
         B <...>: <why>
         Pick: <A or B>

  GRID   <BPM>, <seconds> s a bar, <bars> bars = <seconds> s
  bars  section  lyric (syllables)        picture            on screen
  <one row per line>

  SOUND BRIEF
  <length, BPM, key, voice, instruments, arrangement in order>
  <lyric with [Hook] [Verse] [Lift] [Tag] tags>

  CLAIMS IN THE LYRIC
  <line>  <approved claim, brand line, or plain figure of speech>

  CAST NOTE  <voice>; <who is on screen>: <why>
  MISSING: <anything to confirm before the song is made>

  SCORE  <n>/100 (<passed> of <total> checks passed)
  Missed: <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Length: 30 seconds
    Reason to buy: daily nutrition she can keep up with on busy
    mornings
    Buyer: the busy parent, 30 to 45, mostly mums. Buys Adults for
    herself. Has quit powders. Knows the problem, not this fix.
    Moment: the school-run morning, out the door by 8.
    Their words: "So easy to grab and eat on my way to the billion
    things I have to do as a mom." (review 15)
    Product: Sprout greens gummies. One daily pack, torn across the
    top, a small handful of gummies. No water, no mixing, no shaker.
    Approved claims: "60+ ingredients, 21 vitamins & minerals, and 6g
    fiber" in 1 pack. "Supports digestion and gut health."
    Brand lines: "Rip. Tip. Enjoy." "Tastes like a treat, works like a
    supplement."
    Never say: fix, energy or immunity results, weight loss.
    Offer: $29.99 first order with the text sign-up, renews at $49.99
    every 4 weeks. Voice: playful, cheeky, short lines.
  output: |
    HOOK DRAFTS  1 "Rip it, tip it, out the door"
                 2 "Grab it on the way"
                 3 "One little pack and go"
    PICK  1. It reworks the brand's "Rip. Tip." into the buyer's own
          moment (out the door), rhymes inside itself, and is 7
