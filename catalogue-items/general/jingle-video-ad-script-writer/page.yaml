    SOUND  A Bright indie pop, 120 BPM, warm female lead, handclaps,
             jangly guitar: a quick morning that stays playful.
           B Bouncy acoustic folk-pop, 112 BPM, female lead with a
             small group on the hook, stomps: homey, a little slower.
           Pick: A. The school run is a rush, and the voice is cheeky.

    GRID  120 BPM, 2 s a bar, 15 bars = 30 s. Hook 3 times.
    bars   section  lyric (syllables)               picture
    1      Hook     Rip it, tip it, out the door (7) at the front door she
                                                    tears a daily pack
                                                    across its top; the
                                                    pouch on the hall table
    2               A handful of greens and nothing close: green gummy
                    more (9)                        bears tip into her palm
    3      Verse    Lunch box packed and the        a lunch box snaps shut,
                    kettle's on (8)                 the kettle steams
    4               Keys in my hand and the         she lifts keys off the
                    morning's gone (9)              hook
    5               That chalky shake? Still in the close: a shaker of
                    sink (8)                        green sludge in the sink
    6               No time to scrub, no time to    she glances at it and
                    think (8)                       walks past
    7-8    Hook     (same two lines, same tune)     she eats the gummies,
                                                    bag on her shoulder
    9-10   Lift     Twenty-one vitamins and         the pouch open at its
                    minerals (10, two bars)         resealable top, one pack
                                                    beside it
    11-12           Tastes like a treat, works like she smiles and pulls the
                    a supplement (10, two bars)     door shut behind her
    13-14  Hook     (same two lines, same tune)     she walks down the path
    15     Tag      Rip. Tip. Sprout. (3 notes)     the pouch front on
           On screen (bar 15): $29.99 first order with SMS sign-up.
           Renews at $49.99 every 4 weeks.

    SOUND BRIEF
    30 seconds, 120 BPM, 4/4, C major. Warm, bright female lead; two
    backing voices join the last hook and the tag. Handclaps, jangly
    electric guitar, light bass, simple drums. Start on the sung hook
    at 0 seconds, no intro. Lighter drums in the verse, full band on
    the second hook, claps and voice only in the lift, full band on
    the last hook. End on the sung tag with a clean stop at 30 s.
    [Hook] [Verse] [Hook] [Lift] [Hook] [Tag], lyric as above.

    CLAIMS IN THE LYRIC
    Bars 9-10   "21 vitamins & minerals", approved, sung in words. It
                takes two bars because the fact can't be shortened.
    Bars 11-12  brand line, sung exactly. The lift doesn't rhyme: both
                lines are fixed wording.
    Bar 2       "nothing more": figure of speech for "that's all it
