    CAST NOTE  Voice: warm, bright female lead, unseen. On screen: one
    animated adult woman, the busy parent, in every shot. The song is
    her morning, so one lead the buyer sees herself in carries it.
    MISSING: whether Sprout uses music in ads. Confirm before the
    song is made.

tweaks:
  - what: Length
    how: 6 seconds is the hook and the tag. 15 seconds adds a two-line verse and plays the hook twice. 30 seconds adds a lift and plays the hook three times.
  - what: The buyer's moment
    how: The tempo follows it. A morning rush or workout lands around 112 to 128 BPM, a wind-down around 70 to 90. Name the moment exactly and the sound gets closer.
  - what: The singer
    how: An unseen singer is the default and easiest to make. Ask for "lead sings on long notes" to show an animated singer only on held notes, or "crowd on the tag" for a group finish.
  - what: Brand lines
    how: Paste lines your brand already uses. The skill sings them exactly, and they often make the best hook or tag.

judge:
  - Sing it once, then try to sing the hook back without looking. If you can't, the hook is too long or too twisty.
  - The hook is about what the customer gets, and the brand name sits only in the tag.
  - The hook comes back on the same tune every time.
  - Every number or health result in the lyric is in your approved claims, word for word.
  - The pack is on screen within the first 5 seconds.

test:
  - Clap the beat and speak each line. Any key word that lands between claps needs a rewrite.
  - Count the bars and multiply by the seconds per bar. A 30-second song should come to 28 to 32 seconds.
  - Circle every number in the lyric and find it in your claims list. One that isn't there means the claims step was skipped.
  - Play a rough version to someone who hasn't seen the brief and ask what the product does for them. If they only remember the brand name, the hook isn't about the customer.

improve:
  - Add your brand lines to "What you need" in the skill file, marked as sung exactly, so every song can use them.
  - Fix your tag (the brand name and its 2 to 4 notes) in the skill file, and use the same one in every song ad.
  - Write your answer to "does the brand use music in ads?" into the skill file, so it stops asking.
  - Save the hook that wins to your brand file, and test a new verse against it next time.
  - Pair it with the skill that turns a song script into shots, which makes the music first, then check music rights before you pay to run it.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
    - {name: "Suno", why: "Has a style box and a lyrics box that reads section tags like [Verse]. Songs you download on a paid plan can run in ads."}
    - {name: "Eleven Music", why: "Can build a song from a section-by-section plan, and its paid plans are cleared for commercial use."}
  inputs:
    - "How your brand name is said, with the stressed part marked, so the tag sings it right"
    - "Two sounds your buyers like, described by tempo, voice and instruments (never by artist)"
    - "Any jingle or sound the brand already owns, so the tag can reuse it"

terms:
  - term: Hook
    meaning: The short sung line people remember. Here it says what the buyer gets.
  - term: Tag
    meaning: A short sung phrase with the brand name, at the end, the same in every ad.
  - term: BPM
    meaning: Beats per minute, the speed of the song. At 120 BPM, one bar of four beats lasts 2 seconds.
