new_slug: keyword-to-post-outline-writer
name: "Keyword to post outline writer"
summary: "Turn a keyword into a keyword to post outline: intent, headings with notes and what to cover. Paste the phrase and who is searching."
job: get-found-in-search
thinking: low
thinking_why: "It builds a short outline from a clear phrase."

headline: "Keyword to post outline writer"
subhead: "Paste a search phrase and who is searching. The prompt returns a one-page outline: the intent behind the search, the reader's job, headings with notes, what the post must cover, pages to link to and one way to know it worked."

explain: |
  Posts rank when they match what the searcher wants. A writer with only a keyword and a word count has to guess, and often guesses wrong.

  This prompt works out the intent first: is the person learning, comparing or buying. It then writes the reader's job in one sentence and an ordered outline with a note under each heading. Some headings are questions answered right away, which helps readers and search tools. It lists what must be covered, without inventing numbers or sources, and ends with one measure of success.

when:
  - "You are about to commission or write a post."
  - "Your posts do not rank or get skimmed."
  - "You want to brief an AI writer."
not_for:
  - "You need a full brief with every check: use the Content brief writer."
  - "You are writing a product page or a news story: write it by hand, or ask your AI with your own notes."
  - "You need a title and snippet for search results: use the Search title and snippet writer."

you_give:
  - "The search phrase"
  - "Who is searching and what they want"
  - "What you sell (optional)"
  - "Pages to link to (optional)"
you_get:
  - "The intent and the page type"
  - "An ordered outline with notes"
  - "A list of what to cover, link to and avoid"

how_to_use:
  - "Copy the prompt, then paste it into Claude, ChatGPT or Gemini with your details under it."
  - "Under it, give the search phrase and who is searching."
  - "Add your offer and pages to link to."
  - "Hand the outline to a writer or paste it into your AI with a writing request."
output_sample:
  input:
    - The search phrase
    - Who is searching and what they want to do
    - What you sell or offer (optional)
    - Pages on your site to link to (optional)
    - What the top results look like (optional)
  output:
    - name: Intent and page type
      contains: Whether the searcher wants to learn, compare or buy, and the kind of page that fits.
    - name: Reader's job
      contains: One sentence on the problem the reader is trying to solve when they land.
    - name: Outline
      contains: Ordered headings with a one-line note under each, some phrased as questions.
    - name: Must cover
      contains: Key terms, facts and numbers needed, and sources to find, with nothing invented.
    - name: Links
      contains: Up to three of your pages to link to.
    - name: Avoid
      contains: Things the post should leave out.
    - name: Success measure
      contains: One way to tell the post worked.
    - name: Missing
      contains: Facts or inputs that were not given and are still needed.

how_it_works:
  - title: "Find the intent"
    text: "Learn, compare or buy."
  - title: "Name the reader's job"
    text: "One sentence."
  - title: "Write the outline"
    text: "Headings with notes."
  - title: "List coverage"
    text: "Terms, facts, links and a measure."

output_shape: |
  INTENT: <learn | compare | buy> - page type: <...>
  READER'S JOB: <one sentence>
  OUTLINE
  <n>. <heading> - <note>
  MUST COVER
  <terms, facts, sources to find>
  LINK TO
  <up to three pages>
  AVOID
  <...>
  SUCCESS: <one measure>
  MISSING: <...>
  CHECKS MISSED: <each check that failed, or none>

tweaks:
  - what: "What ranks now"
    how: "Say if the top results are lists or guides. The page type follows."
  - what: "Your offer"
    how: "Add it and the post leads there at the right moment."
  - what: "Reader level"
    how: "Say beginner or expert. Headings and terms change."

judge:
  - "The intent matches the phrase."
  - "The headings follow the reader's job."
  - "Nothing is invented."
  - "The outline fits on a page."

test:
  - "Search the phrase and compare the page type with the top results."
  - "Hand the outline to someone and ask if they could write from it."
  - "Run it twice and compare the headings."

improve:
  - "Add your style rules to the avoid list."
  - "Add your usual links so they are always included."
  - "Pair it with Search title and snippet writer for the title."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A short prompt works in any strong chat AI. Paste it, then add your details under it."}
  inputs:
    - "The top three results for the phrase"
    - "Your customers' questions"
    - "Your best page on this topic"
