new_slug: knitted-wool-ad-script
name: "Knitted wool video ad script writer"
summary: "Paste your brief and product facts. Get a knitted-wool video script, a room list and a cast note."
job: make-video-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Knitted wool video ad script writer"
subhead: Give it your brief, buyer and approved claims. It picks the real yarn technique that shows your point, gives every surface a fabric and tests every yarn change as a claim. You get a 15 to 40 second knitted-world script, a room list and a cast note.

explain: |
  Some subjects are hard to watch on camera. Digestion, sleep, pests, grime. A small world of knitted and crocheted wool helps. It's warm and odd enough to stop a scroll, and it makes an awkward problem kind to look at. It also tempts you into pictures you can't back up, like a knot on a doll's tummy coming loose.

  This skill starts from the job. It asks what the turning shot must show (a reveal, something spreading, two things joining, parts adding up, a mood calming, or the product held still) and picks the yarn technique that does it. Plying twists strands into one yarn, so it suits two things becoming one. Joined crochet squares suit many parts adding up. It gives every surface a real fabric (garter ridges for a rug, rib for wood grain, felt for steam) and reads every yarn change as a sentence your claims must back.

  It ends with a cast note: who carries the ad, and a plain sketch of the doll. The skill that turns a knitted script into shots takes it from there. Want a still instead? Use "Knitted wool image ad maker".

when:
  - Your product deals with a subject people find awkward to look at.
  - You want a soft, unusual ad for people who don't know they need you yet.
  - You can say what your product does in one picture, like strands joining or a pack knitting into view.

you_give:
  - The reason someone buys, what the buyer knows, the selling idea and the length
  - A photo of your product (attach it; your AI can see pictures), its biggest label lines and how it's used
  - Your buyer's look, their room and what they tried before
  - Your approved claims, banned claims and offer
you_get:
  - A show plan with the yarn technique, the fabrics and the claim it implies
  - A room list, every object with its material and color
  - A line-by-line script with one move per shot
  - A list of every yarn change with its source, and a cast note with a sketch of the doll

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, label lines and claims underneath.
  - Describe the buyer in two sentences, including what they'd look like as a doll.
  - Say the length, such as "30 seconds".
  - Check that every object in the script has knitted, crocheted or felted in front of it. Anything without it will come out real.
  - Take the script and cast note to the skill that turns a knitted script into shots. It runs the video process from there.

how_it_works:
  - title: Checks the fit
    text: Wool suits awkward subjects and simple product stories. It tells you to film instead when proof, fit or taste is the point.
  - title: Names what the key shot must show
    text: One of six jobs (reveal, spread, join, build, calm, hold), chosen from your selling idea.
  - title: Picks the yarn technique
    text: Knitting up to reveal, unrolling to spread, plying to join, joined squares to build, loosening to calm.
  - title: Gives every surface a fabric
    text: Stockinette for walls and clothes, garter for rugs, rib for wood grain, felt for steam, crochet for solid things.
  - title: Reads every change as a claim
    text: Writes the sentence each yarn change implies and keeps it only if your claims back it. Nothing shows a body getting better.
  - title: Writes the script
    text: One main doll, one move per shot, 5 words or fewer over the turn, the offer over the still product.
  - title: Writes the cast note
    text: Picks a doll, hands only, or the product alone to carry the ad, says why, and sketches the doll.

output_shape: |
  SHOW PLAN
  Selling idea: <one sentence>
  Show job: <reveal, spread, join, build, calm, hold>
  Technique: <knitting up, plying, joined squares...>
  It implies: "<sentence>"  Source: <claim or fact>

  ROOM  <every object with its material and color>

  # | Narration | Picture | Move
  <n> | "<line>" | <...> | <one gesture or camera move>
  <n> | "<5 words or fewer>" | THE TURN: <technique> | <change>

  Timing: <words> at 2.2 a second = <seconds>. Clips: <split>

  CLAIMS SHOWN
  <change> = <source>
  Rejected: <change> (<why>)

  CAST NOTE  <doll, hands only, or product alone>: <why>
  Doll sketch: <age, build, hair, clothes with fabric and color>
  MISSING: <facts it needed>

  CHECKS MISSED  <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    About 30 seconds.
    Selling idea: six grams of prebiotic fiber, in a gummy you'll
    actually eat.
    Buyer: the gut-fix seeker, woman, 25 to 55. Bloating and
    irregularity. Has tried fiber powders and probiotics. Doubts:
    "Will this upset my stomach more?"
    Product: Sprout Low Sugar, pouch of 28 daily packs; tear one
    straight across the top and tip the small deep-green gummy bears
    into your palm. 6 g prebiotic fiber per pack.
    Pouch: glossy deep green, big yellow wordmark "Sprout", yellow bear
    face top right, "28 Daily Packs" at the bottom.
    Approved: "Supports digestion and gut health." "60+ ingredients,
    21 vitamins & minerals, and 6g fiber."
    Never: "fix" the tummy, any result as a promise.
    Brand note: Sugar-Free upsets some stomachs; point gut-sensitive
    buyers to Low Sugar.
    Offer: $29.99 first order with text sign-up, renews at $49.99 every
    4 weeks.
  output: |
    SHOW PLAN
    Selling idea: six grams of prebiotic fiber, in a gummy you'll
    actually eat.
    Show job: join (fiber becoming one easy pack).
    Technique: plying. Six thin leaf-green strands twist together into
    one thick yarn that runs into a crocheted daily pack.
    It implies: "One pack holds 6 g of fiber." Source: product facts
    and the approved claim. The six strands are a picture of the
    number, not a measure.

    ROOM  Kitchen: cream stockinette walls, an oak-brown rib-knit
    counter, a pale blue crocheted glass, a white crocheted tub, a small
    brown crocheted bottle, a felted puff of steam from a teal
    crocheted kettle. One chunky yarn throughout.

    1 | "Fiber powder. Gritty, every single morning." | The crocheted
        doll in her mustard jumper stirs the pale blue crocheted glass
        at the oak-brown rib-knit counter; grey felted clumps float on
        top. Shoulders hunched, head turned away, mouth pulled
        down. | One slow stir.
    2 | "Then the probiotic pills she kept forgetting." | The brown
        crocheted bottle sits behind the white crocheted tub; the
        crocheted doll glances at it and looks away. | She turns her
        head.
    3 | "Here's six grams of fiber, the easy way." | Close: six thin
        strands of leaf-green yarn lie side by side on the oak-brown
        rib-knit counter. |
        Locked-off camera.
    4 | "Six strands. One pack." | THE TURN: plying. The six leaf-green
        strands twist together into one thick leaf-green yarn that runs into a
        deep-green crocheted daily pack. | About 3 seconds, 4 words.
    5 | "Rip. Tip. Enjoy." | Close on the doll's crocheted hands at her
        mustard cuffs: she tears the deep-green crocheted pack
        straight across the top; small deep-green crocheted bears tip
        into her palm. | The tear.
    6 | "Sprout supports digestion and gut health." | The deep-green
        crocheted pouch on the oak-brown rib-knit counter, "Sprout" in yellow intarsia, a yellow
        crocheted bear face top right, "28 Daily Packs" stitched at the
        bottom. | Slow dolly in.
    7 | "Try Low Sugar. First order $29.99 with text sign-up." | Same,
        held. On screen: $29.99 first order with text sign-up. Renews
        at $49.99 every 4 weeks. | Held still.
    8 | "For anyone done with powders and pills." | Same, held. | Still.

    Timing: 51 words at 2.2 a second, plus the 3-second turn and a
    held end, is about 30 seconds. Clips of 8 s: 1 = lines 1-2, 2 =
    lines 3-4 (the turn), 3 = lines 5-6, 4 = lines 7-8, held.

    CLAIMS SHOWN
    Six strands plied into the pack = 6 g prebiotic fiber per pack
    Felted clumps in the glass = the buyer's own words about powders;
      no brand shown
    Line 6 = approved claim, narrated, never pictured as a body change
    Low Sugar named = brand note on Sugar-Free and stomachs
    Rejected: a knot on her tummy coming loose (implies the product
      fixes digestion; the claim is "supports")
    Rejected: a glowing strand travelling into her body (the brand
      doesn't state how the fiber works)

    CAST NOTE  One crocheted doll. The buyer's story (powders, then
    pills, then the pack) lives in her mornings, so a doll carries it
    kindly; the product arrives in her hands at line 5.
    Doll sketch: a woman about 40, medium build, shoulder-length dark
    brown yarn hair in loose waves, a mustard stockinette jumper, grey
    rib-knit trousers, embroidered eyes and brows.
    MISSING: the color of "28 Daily Packs" on the pouch, and a photo of
    a single daily pack.
    CHECKS MISSED  none

tweaks:
  - what: The show job
    how: Ask for reveal to knit the product into view, build to join squares for many ingredients, spread for something that fills a day, or hold for buyers who already know you.
  - what: Fabrics
    how: Name a surface and it picks the stitch (garter for a rug, cables for a tree, felt for steam). Say "chunky yarn" for big cosy stitches or "fine yarn" for more detail.
  - what: Who carries it
    how: One doll when the problem lives in someone's day, hands only for a how-to, or the product alone for buyers who already know you.
  - what: Night scenes
    how: Say where the light comes from (a lamp, a phone) and it writes the source into each picture note.

judge:
  - The show plan's implied sentence is something your claims let you say.
  - Every object in every picture note has a material word and a color.
  - There is one main doll, sketched the same way every time, and no doll speaks.
  - No shot is a close-up of a face, and nothing shows a body getting better.
  - The product has its true shape and only real label words.
  - The narration fits the length at a calm pace, with 5 words or fewer over the turn.

test:
  - Search the picture notes for any object without knitted, crocheted or felted. There should be none.
  - Ask for a knot loosening on the doll's tummy. The claim step should reject it and say why.
  - Run it twice on the same brief. The doll sketch should come back close, and the same in every line of one run.
  - Read the cast note and ask whether a doll is needed at all. For a buyer who knows you, the product alone may carry it.

improve:
  - Write your banned claims into step 4 of the skill file, so every yarn change is tested against them.
  - If you run a series, save the doll sketch and room list in your brand file and paste them into every run.
  - Add your house yarn thickness and colors to step 3, so every ad matches.
  - Pair it with the skill that turns a knitted script into shots, and with the knitted image ad skill for a matching still.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
  inputs:
    - "Photos of knitted or crocheted toys you like, so the doll sketch names stitches that exist"
    - "Your brand colors matched to real yarn shades, so the room list uses colors a maker could buy"
    - "A photo of the product in a hand, so the knitted version keeps its true size"

terms:
  - term: Show job
    meaning: What the key shot has to show for the selling idea, such as a reveal or two things joining.
  - term: Plying
    meaning: Twisting two or more strands of yarn together into one thicker yarn.
  - term: Amigurumi
    meaning: Small stuffed figures crocheted in tight spirals, so the stuffing never shows.
