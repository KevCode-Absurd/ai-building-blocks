new_slug: knitted-wool-video-clip-prompt-writer
name: "Knitted wool video clip prompt writer"
summary: "Paste your knitted script and attach product photos. Get sheets, a storyboard and wool clip prompts."
job: make-video-ads
thinking: high
thinking_why: "It runs several stages and keeps many rules at once across a long output."

headline: "Knitted wool video clip prompt writer"
subhead: Give it a narrated knitted-wool script and product photos. It writes a doll card, sheets, a storyboard and clip prompts where yarn moves only as yarn can, stopping three times for your OK. You get every prompt and an edit list.

explain: |
  A knitted-wool ad goes wrong in small ways that add up. A real person turns up standing in a wool room. The doll's hair changes from shot to shot. A kettle comes out in steel because nobody said it was crocheted. Stitches smear as the clip plays, and the label on your pack is misspelled.

  This skill runs the same six stages as every video block here. It picks who carries the ad, turns the doll into an image, and makes a sheet of every angle, plus product and room sheets. Three lock lines are fixed there and pasted into every prompt: the doll card, a material sentence giving every surface a real fabric, and a motion sentence for stop-motion on twos. Then a storyboard, with a frame and a card for each shot. Only then come clips, with each yarn technique written as yarn really behaves, like strands winding into one thicker yarn. You approve the avatar, the sheets and the storyboard first.

when:
  - You have a knitted-wool script and need it made with AI image and video tools.
  - Earlier tries drifted into real people, real materials or a doll that kept changing.
  - You want to approve each step before you spend credits on video.

you_give:
  - The script with narration and picture notes (and its show plan, room list and cast note, if you have them)
  - Clean photos of your product's front, side and top, and its label text word for word
  - How your product is used
  - Your tools and clip lengths, and whether your video tool makes sound (optional)
you_get:
  - An avatar card to approve, then reference image prompts and a pick
  - Doll, product and room sheets, with the doll card and material sentence locked
  - A storyboard with a frame prompt and a shot card for every shot
  - Clip prompts where yarn moves only as yarn can, and an edit list

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your script, then your label text, and attach the product photos.
  - Approve the avatar card, then make the reference images and pick one.
  - Make the sheets and approve them with the lock lines, then approve the storyboard.
  - Make the clips from the approved frames, record the narration, and cut the edit from the edit list.

how_it_works:
  - title: Takes in the script
    text: Reads the show job and yarn technique, and where the change starts and ends.
  - title: Picks the avatar
    text: One crocheted doll, or the product alone, written as a card. You approve it.
  - title: Turns it into an image
    text: Three or four reference images of the doll, opening with "a crocheted doll of", and the pick.
  - title: Makes sheets and lock lines
    text: Every angle of the doll, the crocheted product, each room, the doll card, a material sentence and a motion sentence. You approve them.
  - title: Storyboards every shot
    text: A frame and a shot card per shot, with no face close-ups. You approve the whole board.
  - title: Turns it into video
    text: Clips in stop-motion on twos with the technique written as yarn behaves, the narration, then the edit and a claims check.

output_shape: |
  STAGE 0  SCRIPT IN   Turn: <show job>, <technique>. Starts <where>,
           ends <where>. Yarn scene change: <one, or none>
  STAGE 1  AVATAR CARD (approve)
           Role <...> | Age <...> | Look <...> | Clothes <...>
           Props <...> | Voice <...> | Never changes <...>
  STAGE 2  REFERENCE IMAGES  <prompt>  Make <3 or 4>. Pick: <which, why>
  STAGE 3  SHEETS AND LOCK LINES (approve)
           MATERIAL <sentence>  DOLL CARD <description>
           MOTION <sentence>  PRODUCT <line>
           Character sheet <angles, poses, size>  Product sheet <views>
           Room sheet <each room, every object, material and color>
  STAGE 4  STORYBOARD (approve)
           F<n> <frame prompt with [MATERIAL] and [DOLL CARD]>
           Card <n>: <framing> | <camera> | <action> | "<line>" | <s> | <sound>
           Continuity <180° line, hands, product state>
  STAGE 5  CLIP <n> (<s>, start F<n>, end <frame or none>)
           [MOTION] Camera <one move>  0 to <n> s <...>  Fixed <...>
           VOICE <...>  EDIT <order, captions, overlay, end card, safe zone>
           MISSING: <facts it needed>
  CHECKS MISSED  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Script (from the knitted wool script skill), about 30 s.
    Show plan: join, plying. Six leaf-green strands twist into one
    yarn that runs into a crocheted daily pack.
    1 "Fiber powder. Gritty, every single morning."  She stirs a glass.
    3 "Here's six grams of fiber, the easy way."  Six strands, close.
    4 "Six strands. One pack."  THE TURN: plying.
    5 "Rip. Tip. Enjoy."  Hands tear the pack across the top.
    (lines 2, 6 to 8: pills, pouch, offer and close)
    Cast note: one crocheted doll. Sketch: a woman about 40, medium
    build, shoulder-length dark brown yarn hair in loose waves, a
    mustard stockinette jumper, grey rib-knit trousers.
    Photos attached: pouch front, side and top. Label: "Sprout" in
    yellow, a yellow bear face top right, "28 Daily Packs" at the
    bottom. Tear only straight across the top.
    Video tool: 8-second clips, takes an end frame, no sound.
    Brand file: attached (brand.md).
    Approvals: take the avatar card and sheets as approved, and write
    every stage now.
  output: |
    STAGE 0  SCRIPT IN  Turn: join, plying. Starts with six loose
    strands at line 3, ends with one yarn running into the pack at
    line 4. Yarn scene change: none. Claim: line 6, narrated only.

    STAGE 1  AVATAR CARD (approve)
    Role: a woman done with powders and pills, lines 1, 2, 5. Age:
    about 40. Look: medium build, dark brown yarn hair in loose waves,
    embroidered eyes and brows. Clothes: mustard stockinette jumper,
    grey rib-knit trousers. Props: a pale blue crocheted glass, then
    the daily pack. Voice: none on screen. Never changes: hair, jumper,
    no face close-ups.

    STAGE 2  REFERENCE IMAGES
    A crocheted doll of a woman about 40, as on the card, standing
    full length against a cream knitted wall. [draft MATERIAL]. Make
    4. Pick: the one with the clearest embroidered brows, so feelings
    read at medium shot.

    STAGE 3  SHEETS AND LOCK LINES (approve)
    MATERIAL  A small handmade world made entirely of wool: cream
    stockinette walls, an oak-brown rib-knit counter, crocheted objects
    stuffed firm, felted wool for steam, one chunky yarn throughout,
    colors kept to cream, oak brown, white, teal, pale blue, leaf
    green, deep green and sunflower yellow, soft window light from the
    left, shallow focus so the set reads small.
    DOLL CARD  A crocheted doll of a woman about 40, medium build,
    shoulder-length dark brown yarn hair in loose waves, a mustard
    stockinette jumper, grey rib-knit trousers, embroidered eyes and
    brows.
    MOTION  Wool stop-motion animated on twos: each pose holds for two
    frames, about 12 new poses a second; stitches stay in place and the
    fuzz stays soft.
    POUCH  A deep-green crocheted pouch, a yellow crocheted bear face
    top right; "Sprout" in yellow intarsia, "28 Daily Packs" stitched.
    Doll sheet: front, three-quarter left and right, side, back,
    stirring, hands cupped; the pack about her palm's length. Pouch
    sheet: front, side, top. Room sheet: the kitchen, empty.

    STAGE 4  STORYBOARD (approve)
    F3 (lines 3-4) Six thin strands of leaf-green yarn lie side by side
    on the oak-brown rib-knit counter, ends pointing to a deep-green
    crocheted daily pack. [MATERIAL]. Close-up at counter height. No
    doll card: she isn't in this shot.
    Card 3: close | locked-off | the strands wind into one yarn that
    runs into the pack | "Here's six grams... One pack." | 8 s | none
    Continuity: her right hand stirs and tears; the pack is whole
    until line 5; the pouch is never torn.

    STAGE 5  CLIP 2 (8 s, start F3, end: one thick yarn into the pack)
    [MOTION] Camera: locked-off. 0 to 4 s: the strands lie still; one
    end lifts. 4 to 7 s: they wind around each other into one thicker
    green yarn, turning as they go, and run into the pack. 7 to 8 s:
    yarn and pack rest. Fixed: the counter and the pack. Takes: 3.
    VOICE  Narrator recorded separately in a stock voice. Dolls never
    speak, so no lip-sync.
    EDIT  Clips 1 to 4 in order, cuts. Captions inside the safe zone.
    If the label is wrong in clip 4, lay the real label from the photo
    over it. End card: $29.99 first order with text sign-up. Renews at
    $49.99 every 4 weeks. Check line 6 says "supports", as approved.
    MISSING: the color of "28 Daily Packs", and a single daily pack
    photo for F3 and the tear.
    CHECKS MISSED  none
    (cut for length: the full run also had F1, F2, F5, F6 and clips 1,
    3 and 4)

tweaks:
  - what: Who carries it
    how: One doll, or the product alone. With no doll, stages 1 to 3 become the product and room sheets.
  - what: Fabrics
    how: Change a surface's fabric in the material sentence (garter for a rug, cables for a tree, felt for steam) and every image prompt follows.
  - what: Yarn thickness
    how: Chunky yarn gives big, cosy stitches and less detail. Fine yarn keeps small details like a label. Pick one for the whole ad.
  - what: Your video tool
    how: Give its clip length and say if it takes an end frame or makes sound. The timed steps, the turn's end frame and the sound line change to fit.

judge:
  - It stopped for your approval after the avatar card, the sheets and the storyboard, unless you approved them ahead.
  - The material sentence is word for word the same in every prompt, and the doll card in every frame she's in.
  - Every object in every prompt names its material and a real color.
  - Each clip has one camera move and one yarn change, written as yarn behaves.
  - No frame asks for a close-up of a face.
  - The label lines are short, in quotes, and match your pack.

test:
  - Make the doll sheet first. If she looks like a real person, check that the prompt opens with "a crocheted doll of".
  - Flick through the storyboard frames. Her hair and jumper should match in every one.
  - Make the turn's clip and watch the stitches. They should stay put while the strands wind together; if they smear, try a shorter clip.
  - Search every prompt for "needle" and "hook". Neither should appear outside the avoid field.

improve:
  - Save your approved doll card, material sentence and room sheet in your brand file, so every ad in a series matches.
  - Keep the approved sheets and attach them from the start, so new ads begin at stage 4.
  - Add your video tool, clip length and end-frame support to "Your tools", so the timed steps fit first time.
  - Add any miss you keep seeing to the fixes table in stage 5, with the change that cured it.
  - Pair it with the skill that writes the knitted wool script, so every picture note already names its material.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Takes up to 14 reference images and keeps up to four characters the same, so your sheets and frames match."}
    - {name: "Veo", why: "Starts each clip from your approved frame and can end on a second frame, in 8-second clips."}
    - {name: "Kling", why: "Takes up to 7 reference images in one video job, so figures and product stay the same from shot to shot."}
    - {name: "ElevenLabs", why: "Reads the narration in a stock voice from its library, with tags for pauses and pace."}
  inputs:
    - "A close photo of a knitted swatch in your colors, so stitches look real in every frame"
    - "The flat label artwork, so the label you put back in editing matches the pack exactly"
    - "The recorded narration before you make clips, so each clip is timed to its line"

terms:
  - term: Avatar card
    meaning: A short description of who or what carries the ad (look, clothes, props, voice, what never changes). You approve it before any image is made.
  - term: Doll card
    meaning: A fixed description of the doll (build, yarn hair, clothes) pasted whole into every frame she's in.
  - term: Lock lines
    meaning: Fixed lines, like the doll card and material sentence, pasted word for word into every prompt so every frame matches.
  - term: On twos
    meaning: Each pose is held for two frames, so you see about 12 new poses a second. It gives the stepped, handmade look of stop-motion.
  - term: 180° line
    meaning: An imaginary line through the action. Keeping the camera on one side of it stops people and things swapping sides between shots.
