new_slug: know-if-you-have-enough-visitors-to-test
name: Know if you have enough visitors to test
summary: Judge your page by revenue per visitor, and learn whether your traffic can support a fair test.
job: audit-landing-page

headline: Know if your page is working, and if it gets enough visitors to test
subhead: Paste your visits, orders or sign-ups and revenue for a set of dates. It works out revenue per visitor, shows what your traffic mix does to the numbers, and says how many visitors and days a fair test would need, or that you can't test yet.

explain: |
  Conversion rate (the share of visitors who buy or sign up) is the number everyone quotes, and it misleads on its own. It drops when you send more cold traffic from ads, rises when you cut that traffic, and says nothing about how much each buyer spends. Teams redesign pages to fix a number that was never broken, or call a test after a few dozen sales.

  This skill reads your numbers the careful way. It works out revenue per visitor (conversion rate times average order value), checks whether a change in where visitors came from explains the movement, and shows how the number could be gamed. Then it sizes a test with a stated rule of thumb: roughly 1,000 sales or sign-ups per version. If your traffic can't support that, it tells you to ship the obvious fixes and track before and after instead.

when:
  - Someone says "our conversion rate dropped" and wants a redesign.
  - You changed a page and want to know if it worked.
  - You're thinking about A/B testing and want to know if you have the traffic for it.

you_give:
  - Visits, orders or sign-ups, and revenue for a fixed set of dates
  - The same split by traffic source and by phone or desktop (optional, but it explains a lot)
  - Your margin per order (optional)
  - What changed on the page and when (optional)
you_get:
  - A numbers table with conversion rate, average order value and revenue per visitor, with the working shown
  - A short read of what moved, what the traffic mix explains and what is still unknown
  - A test verdict with visitors and days needed, or "can't test, ship and monitor"
  - Three next actions, each tied to a number

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste your numbers for one closed date range (for example, all of last month), with the dates.
  - Add the split by traffic source if your analytics shows it.
  - Say what you're trying to decide, such as "did the new page work?" or "can we A/B test this?".
  - Check which figures are marked "your data" and which are "rule of thumb" before you quote any of them.

how_it_works:
  - title: Works out the honest numbers
    text: Conversion rate, average order value and revenue per visitor, plus profit per visitor if you gave a margin. The working is shown.
  - title: Compares you only with you
    text: Refuses to compare your conversion rate with other businesses. A 9% rate on small orders can be a worse business than 1% on large ones.
  - title: Reads the traffic mix
    text: Checks whether more cold traffic explains a falling rate, which is expected and not a page fault.
  - title: Shows how numbers get gamed
    text: Points out that any single number can be pushed up while the business does worse, and judges by revenue or profit per visitor instead.
  - title: Sizes the test
    text: Uses about 1,000 conversions per version, divides by your rate to get visitors needed, doubles it for an A/B test and converts it into days at your traffic.
  - title: Rules out bad tests
    text: Flags tests called too early, stopped the day they looked good, or skewed by an email blast.
  - title: Says what to do
    text: If you can't test, it tells you to ship the obvious fixes and compare before and after, and says that isn't proof.

output_shape: |
  WINDOW: <the dates the numbers cover>

  NUMBERS                                   Source
  Visits                  <number>          your data
  Orders or sign-ups      <number>          your data
  Conversion rate         <rate> (<sum>)    your data
  Average order value     <amount> (<sum>)  your data
  Revenue per visitor     <amount> (<sum>)  your data
  <or MISSING: what's needed to work it out>

  READ
  - <5 to 8 lines: what moved, what the traffic mix explains, what's unknown>

  TEST VERDICT
  Rule of thumb: about 1,000 conversions per version.
  <visits needed per version, total, and how long at your traffic>
  Verdict: <can test> or <cannot test; ship and monitor>

  NEXT 3 ACTIONS
  1. <action tied to a number>
  2. ...
  3. ...

example:
  business: sprout
  input: |
    [the skill]

    Page: sprout.example/products/sprout. Visits are ad link clicks
    (store visit counts not exported). Practice numbers, USD.
    ad / clicks / purchases / revenue
    T1 Hot girl tummy (pain)          4950  198  8336
    P1 Too expensive (61% off)        5530  151  5164
    P2 Dont pay full price (61% off)  5569   50  1555
    S1 Trusted by 1M (61% off)        1600   38  1254
    H1 One step never skip (habit)    1300   44  2015
    K1 Fiber kids                     2030   63  3062
    F1 Fiber question                 1524   46  1858
    W1 Muscle weight loss              900   23  1024
    R1 Runner                          538   10   400
    Each ad ran 14 to 42 days; exact dates not exported.
    First order $29.99 (with text sign-up), renews at $49.99.

    Question: the team wants to A/B test the plan box, because the
    ads say 61% off and the page says 52% and 55%. Can we, and
    which number should we judge the page by?
  output: |
    WINDOW: 14 to 42 days per ad. MISSING: exact dates.

    NUMBERS                           All ads    Source
    Visits (ad clicks)                23,941     your data
    Purchases                         623        your data
    Conversion rate (623 / 23,941)    2.60%      your data
    Average order (24,668 / 623)      $39.60     your data
    Revenue per visit (24,668/23,941) $1.03      your data
    Profit per visit                  MISSING: margin

    BY KIND OF AD          Clicks   Buy rate   Avg order   Rev/visit
    61% off (P1, P2, S1)   12,699   1.88%      $33.36      $0.63
    Everything else        11,242   3.42%      $43.48      $1.49

    READ
    - Visitors from the 61% off ads buy less often and spend less.
      Each of their visits is worth $0.63, against $1.49 for the rest.
    - So the page's overall rate moves with the ad mix. If more spend
      goes to offer ads, conversion falls with no change to the page.
    - Judge the page by revenue per visit, split by kind of ad, and
      name the mix in every period you compare.
    - Cutting the offer ads would raise conversion rate on paper and
      could still lower total revenue. Don't judge by the rate alone.
    - These are first orders only. Renewals at $49.99 aren't in here.
      MISSING: how many first orders renew.
    - Ad clicks aren't store visits. MISSING: store visits by source
      and device.

    TEST VERDICT
    Rule of thumb: about 1,000 conversions per version.
    1,000 / 0.026 = about 38,400 visits per version, 76,900 for an
    A/B test. That's 3.2 times all the ad clicks in this file.
    Days needed: MISSING, since there are no dates.
    Verdict: cannot test at this volume. Ship and monitor.

    NEXT 3 ACTIONS
    1. Ship the obvious fix: one discount number that matches the ad
       and the page. Compare revenue per visit before and after for
       the offer ads (now $0.63), knowing that isn't proof.
    2. Export store visits by source and device for the same dates.
    3. Get the renewal rate, so a $29.99 first order can be valued
       against the $49.99 renewals.

tweaks:
  - what: The traffic split
    how: Add visits and sign-ups by source (ads, email, search) and by device. The read will say how much of any change comes from the mix rather than the page.
  - what: Your margin
    how: Add "margin 70%" or a profit per order and it judges by profit per visitor, which is harder to fool than revenue.
  - what: A before and after
    how: Paste two windows, one before the change and one after. It compares them on revenue per visitor and names the traffic mix in each.
  - what: No analytics at all
    how: Say so. It switches to walking through the page as a buyer on a phone and ranks fixes by impact, confidence and ease, each out of 10, with no money value attached.

judge:
  - Revenue per visitor is shown, or the skill says exactly why it can't be worked out.
  - Every figure is marked "your data" or "rule of thumb". Nothing comes from an unnamed industry average.
  - The test verdict gives visitors needed and how long that takes at your traffic.
  - The date window is stated at the top.
  - Nothing is called "significant" without the number of conversions behind it.

test:
  - Use a period where you know why the numbers moved, such as a sale week. It should explain the jump through traffic mix or order size, not call the page better.
  - Work out revenue per visitor yourself (revenue divided by visits) for one window and check it matches.
  - Give it a short window with under 100 orders. It should tell you a test can't be trusted yet, not size one anyway.
  - Run it twice on the same numbers. The visitors needed should be the same both times, because it's a sum, not an opinion.

improve:
  - Write your margin or profit per order into "What you need" in the skill file, so step 1 also judges by profit per visitor every time.
  - If your goal isn't a purchase (a sign-up, a booked call), change the words in step 1 so "orders" means your goal.
  - Add your traffic sources by name to step 3 (for example "Meta ads, new people" and "email, past buyers"), so the mix is read in your own groups.
  - Save each month's revenue per visitor in your brand file. The next run compares you with your own past, which is the comparison that counts.
  - Pair it with a store page check when the answer is "can't test yet", to find the obvious fixes to ship and track instead.

terms:
  - term: Conversion rate
    meaning: The share of visitors who buy or sign up. 623 purchases from 23,941 visits is 2.60%.
  - term: Revenue per visitor
    meaning: Revenue divided by visitors, or conversion rate times average order value. It tells you what each visit is worth.
  - term: A/B test
    meaning: Showing two versions of a page to different visitors at the same time and comparing results.
  - term: Cold traffic
    meaning: Visitors who haven't heard of you before, usually from ads. They buy less often than returning visitors.
  - term: Rule of thumb
    meaning: A rough working guide, not a published benchmark. The skill labels these so you don't quote them as fact.
