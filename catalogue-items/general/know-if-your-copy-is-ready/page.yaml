new_slug: know-if-your-copy-is-ready
name: Know if your copy is ready, in 15 questions
summary: A ship or rewrite verdict from 15 yes or no questions, each backed by a line.
job: check-ads

headline: A clear ship or rewrite verdict on your copy, with the line that proves each answer
subhead: Paste a finished ad, page or email. It answers fifteen yes or no questions, quoting the line behind each answer, then says whether the piece ships or which part goes back, with up to three fixes in order.

explain: |
  The last read before copy goes out is usually a gut feeling. Someone says "looks good" or "something's off", and nobody can say what. Copy then ships with an invented deadline or a guarantee that's missing its terms, or gets rewritten for being plain when plain was fine.

  This skill turns that last read into fifteen yes or no questions. The first three come first, in strict order. Would a person say every line aloud? Does it move the buyer from what they have to what they want? Does something happen to someone? A no on any of those three sends that part back, however good the rest is. The other twelve check the opening, the proof, the doubt, the ask, the guarantee and the length. Every no quotes the line that caused it. It never marks copy down for being plain or bold.

when:
  - An ad, page or email is finished and you need a ship or don't-ship decision.
  - You're reviewing a writer's or an AI's copy and want reasons you can send back.
  - Two people disagree about whether a piece is ready.

you_give:
  - The finished copy
  - Who it's for and how much they know (optional)
  - Your approved claims and offer terms, so it can check proof and guarantee answers (optional)
you_get:
  - A verdict, ship or rewrite with the part named
  - Fifteen yes or no answers, each with one line of evidence
  - Up to three fixes, in order

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste the finished copy underneath.
  - Add one line on who it's for and how much they know.
  - Paste your approved claims and offer terms. Without them, three questions come back as "cannot verify".
  - If the verdict is rewrite, fix the first fix on the list, then run it again.

how_it_works:
  - title: Natural first
    text: Asks whether a person would say every line aloud and a stranger would understand it. A no here sends that part back.
  - title: Then selling
    text: Asks whether it moves the buyer toward what they want, with every feature turned into what changes for them.
  - title: Then story
    text: Asks whether something happens to someone, and for a buyer who doesn't know an answer exists, whether the product comes late.
  - title: Twelve more checks
    text: The buyer, the one big idea, the opening, proof, the main doubt, the ask, urgency, the guarantee, length, the close and the first line.
  - title: Quotes the evidence
    text: Every no comes with the line that caused it, so you can see the problem yourself.
  - title: Gives the verdict
    text: Ship, or rewrite with the part named. Any no on the first three questions means rewrite.

output_shape: |
  VERDICT: <SHIP / REWRITE (part)>

  Q1  Natural          <yes/no>  <evidence line>
  Q2  Sells            <yes/no>  <evidence line>
  Q3  Story            <yes/no>  <evidence line>
  Q4  Knows the buyer  <yes/no>  <evidence line>
  ...
  Q15 Opening is specific  <yes/no>  <evidence line>

  TOP FIXES
  1. <the most important fix>
  2. <...>
  3. <...>

example:
  business: sprout
  input: |
    [the skill]

    Copy (Facebook ad, emoji removed):
    Main text: Big news: your first order of [Sprout] just got a lot
    more affordable. $29.99 for your first order, that's less than
    $1.10/day for 60+ whole-food ingredients, 21 vitamins & minerals,
    and gut-supporting probiotics in one daily gummy pack. $20 off your
    first order. +$5 off for every extra person. Third-party tested.
    Online-exclusive offer. Shop [Sprout].
    Headline: Get up to 61% OFF + 4 FREE gifts: online exclusive

    Buyer: knows Sprout and thinks it costs too much. Doubt: "Will the
    price jump after the first order?"

    Facts: 60+ ingredients, 21 vitamins & minerals, 6 g prebiotic
    fiber (no probiotics in the ingredient list). First box $29.99 with
    the text sign-up discount, then $49.99 every 4 weeks. 30-day
    money-back guarantee, first order only. Third-party tested.
  output: |
    VERDICT: REWRITE (the selling and the story)

    Q1  Natural           yes  Reads as talk: "your first order ... just
                               got a lot more affordable."
    Q2  Sells             no   "60+ whole-food ingredients, 21 vitamins &
                               minerals" never says what changes for them.
    Q3  Story             no   Nothing happens to anyone.
    Q4  Knows the buyer   yes  It opens on price, this buyer's doubt.
    Q5  One idea          no   "$29.99", "$20 off", "+$5 off" and "up to
                               61% OFF" are four deals.
    Q6  First lines       yes  "just got a lot more affordable" speaks to
                               a price doubter.
    Q7  Proof             no   "gut-supporting probiotics". The facts list
                               prebiotic fiber and no probiotics.
    Q8  Main doubt        no   Nothing says it renews at $49.99.
    Q9  The ask           no   "Shop [Sprout]" doesn't say what they get.
    Q10 Reasons for now   yes  No deadline is claimed. "Online-exclusive"
                               can't be checked from the facts given.
    Q11 Guarantee         no   Not mentioned. It's 30 days, first order
                               only.
    Q12 Length            yes  Short, right for a buyer who knows Sprout.
    Q13 Close             no   Ends on "Shop [Sprout]", not on the price.
    Q14 Right buyer       yes  Price doubters stop; others skip.
    Q15 Specific opening  no   "Big news:" could open any ad.

    TOP FIXES
    1. Remove "probiotics". The product has prebiotic fiber, not
       probiotics, so the line isn't true.
    2. Pick one deal and say what it renews at: $29.99 for the first box
       with the text sign-up discount, then $49.99 every 4 weeks.
    3. Turn the ingredient list into what changes for this buyer, and
       add the 30-day guarantee with its first-order limit.

tweaks:
  - what: The buyer line
    how: Question 12 checks length against how much the buyer knows. Say "has never heard of us" and a short piece fails; say "ready to buy" and a long one does.
  - what: The facts
    how: Questions 7, 10 and 11 check proof, urgency and guarantee terms. Without your facts it answers "cannot verify" instead of guessing yes.
  - what: Several pieces
    how: Paste one piece per run. Mixing an ad and its landing page in one run blurs which line failed.
  - what: Strictness
    how: Leave it as is. It's built to never mark copy down for being plain, bold or using a round number, which keeps it from pushing you toward clever copy.

judge:
  - Every no quotes a real line from your copy.
  - The verdict is rewrite if any of questions 1 to 3 is no.
  - No fix asks you to add a fact you don't have.
  - It doesn't mark you down for being plain or using "best" in your own voice.
  - The top fixes are in order of importance, with the first-three questions first.

test:
  - Run it on a piece you know worked and one you know flopped. The winner should ship, or fail only on small points. If both ship, add the buyer line so question 12 can do its job.
  - Run it twice on the same piece. The verdict and the answers to questions 1 to 3 should match.
  - Paste copy with one guarantee condition left out. Question 11 should catch it.
  - Check that every no quotes a real line from your copy. A no without a quote is a guess.

improve:
  - Paste your exact guarantee wording and offer terms into "Facts" in the skill file, so questions 10 and 11 always have them.
  - Add a question of your own after question 15 if every piece must pass a rule of yours, such as "every star rating names its source".
  - Save the questions your copy fails most often to your brand file, and give them to writers up front.
  - If question 3 keeps failing on ads for people who don't know you, write those with "Tell your buyer's problem so well they see themselves".
  - Run "Edit a draft so it reads clean and sells" first, so this is the final check, not the first edit.

terms:
  - term: Cold buyer
    meaning: Someone who has never heard of you and may not know their problem has an answer.
  - term: The ask
    meaning: The part that tells the reader what to do next.
