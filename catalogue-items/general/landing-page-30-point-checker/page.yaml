new_slug: landing-page-30-point-checker
name: "Landing page 30-point checker"
summary: "Check your landing page with 30 yes-or-no questions. Paste the page and your ad. You get the five fixes to make first and a score out of 100."
job: audit-landing-page
thinking: high
thinking_why: "It judges work against many checks, so a stronger model catches more."

headline: "Landing page 30-point checker"
subhead: Paste your page text, attach phone screenshots, and add the ad that sends people there if you have it. It runs 30 yes-or-no checks at the five stops a buyer makes. You get the evidence for each no, five fixes to make first and a score out of 100.

explain: |
  Before a page goes live, or right after a bad week, you want a quick and honest pass that catches the obvious problems. A gut read misses things, like the renewal price sitting in small print or a sale that says "limited time" when it never ends.

  This skill walks your page the way a buyer does, in five stops. Arrive: is this what the ad promised? Understand: what exactly is it? Believe: why should I trust it? Commit: what will it cost me, and what if it goes wrong? Fine print: does anything feel off? Each stop has six checks, built from published shopper research, usability studies and the rules on pricing and reviews. Every check is yes, no or can't tell. Each "no" is tagged as a deal-breaker (the buyer can't buy, or would feel misled) or a drag. Deal-breakers come first in the fix list, then whatever sits highest on the page.

when:
  - A page is about to go live and you want a last check before you spend on ads.
  - A page just had a bad week and you want a quick read on why, before a deeper review.
  - You're giving feedback on someone else's page and want a fair, structured way to do it.
not_for:
  - "You want a deeper review ranked by how bad each problem is: use the Landing page conversion reviewer."
  - "You have sales numbers and want to find where buyers leave your funnel: use the Sales funnel drop-off finder."
  - "You have no page yet, only an idea: write the page first, then run this check on it."

you_give:
  - The page text, plus phone screenshots of the first screen and the buy area (attach them; your AI can see pictures)
  - The ad that sends people there, with its words and its image attached (optional)
  - Your real prices, offer terms, guarantee, delivery and returns terms, and the claims you may make (optional)
  - A phone speed report for the page, such as PageSpeed Insights (optional)
you_get:
  - A two-line verdict naming the stop where the page loses buyers
  - All 30 checks with yes, no or can't tell, the evidence and a one-line fix
  - A count of no's at each stop, so you see where the trouble clusters
  - The five fixes to make first, deal-breakers at the top, and what it couldn't judge
  - A checks score out of 100 (the share of checks the page passes), now and with the five fixes made

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the page text and attach phone screenshots, top to bottom.
  - Paste the ad word for word and attach its image. Without it, the first three checks are marked can't tell.
  - Paste your real terms and claims, so it can spot where the page says something different.
  - Make the five fixes, then run it again on the new page. The deal-breakers should be gone.
output_sample:
  input:
    - Your page text, plus phone screenshots of the first screen and the buy area
    - The ad that sends people to the page, with its image (optional)
    - Your real prices, offer terms and allowed claims (optional)
    - A phone speed report for the page (optional)
  prerequisites:
    - An AI that can read images, if you want the screenshot checks judged
  output:
    - name: Verdict
      contains: Two lines naming the stop where the page loses buyers and the check that shows it.
    - name: The checks
      contains: All 30 checks, grouped by stop, each with a result, a deal-breaker or drag tag, evidence and a fix.
    - name: No's by stop
      contains: A count of no's at each of the five stops, so you see where trouble clusters.
    - name: First five fixes
      contains: The five fixes to make first, deal-breakers on top, each with its check number and place on the page.
    - name: Checks score
      contains: The share of checks passed now and with the five fixes made, plus any deal-breaker left.
    - name: Can't tell
      contains: The checks it could not judge and what you would need to add to judge them.

how_it_works:
  - title: Arrive
    text: Six checks on the first phone screen. Does it repeat the ad's words, product and offer, and can a stranger tell what it is in five seconds?
  - title: Understand
    text: Six checks on what you get, how you use it, whether it fits, the photos, and whether the headings alone carry the main reason to buy.
  - title: Believe
    text: Six checks on reviews near the button, one rating with its count, critical reviews you can read, proof beside each claim, and who is selling.
  - title: Commit
    text: Six checks on the full price, shipping cost, a delivery date, returns near the button, how to cancel, and what checkout will ask for.
  - title: Fine print
    text: Six checks on crossed-out prices, deadlines, matching discount numbers, nothing ticked in advance, text size and phone speed.
  - title: Ranks the fixes
    text: Deal-breakers first, then whatever sits higher on the page, then the quicker fix. Colour and style come last.

output_shape: |
  VERDICT
  <the stop where the page loses buyers, and the check that shows it>

  CHECKS
  # | Check | Yes / No / Can't tell / Doesn't apply | Deal-breaker or drag | Evidence | Fix
  STOP 1 ARRIVE       1 to 6
  STOP 2 UNDERSTAND   7 to 12
  STOP 3 BELIEVE      13 to 18
  STOP 4 COMMIT       19 to 24
  STOP 5 FINE PRINT   25 to 30

  NO'S BY STOP
  Arrive <n>  Understand <n>  Believe <n>  Commit <n>  Fine print <n>

  FIRST FIVE FIXES
  1 <fix>  (check <n>, <deal-breaker or drag>, <where on the page>)

  CHECKS SCORE
  Now: <yes> / <yes + no> x 100 = <score>   (<n> can't tell or doesn't apply left out)
  With the five fixes made: <score>
  Deal-breakers left: <list, or none>

  CAN'T TELL
  <check>: <what would let you judge it>

example:
  business: sprout
  input: |
    [the skill]

    The page: Sprout's main product page, as text top to bottom
    (sprout/product-page.md). No screenshots, no speed report.

    The ad: "'Sprout is too expensive': here's 61% off to prove otherwise"

    Facts: sprout/brand.md, with the real prices, the guarantee terms
    and the table of risky or unsupported claims.
  output: |
    VERDICT
    Buyers are lost at stop 1. The ad promised 61% off, and the page
    shows 52%, "up to 55%" and 55% (check 3).

    STOP 1 ARRIVE
    1  No, drag     "Sprout Superfood Gummies" says nothing about price,
                    which the ad was about. Fix: lead with the real price
    2  Can't tell   Ad image and gallery not captured
    3  No, DEAL     Ad 61%; bar "Save 52%"; badge "UP TO 55% OFF"
                    Fix: one real first-order offer, the same everywhere
    4  No, drag     From text only: "Superfood" doesn't say greens
                    Fix: say greens, vitamins and fiber in one daily pack
    5  No, drag     "Start Now" doesn't say what you get. Position can't
                    tell. Fix: "Start my first box"
    6  Can't tell   "Sign Up for 55% Off" pop-up, timing unknown
    STOP 2 UNDERSTAND
    7  Yes          "28 packs each 4 weeks"
    8  Yes          Directions panel: one pack a day
    9  Yes          Flavour tile, 28 packs, one pack a day
    10 Can't tell   Gallery not captured
    11 Yes          "Snackable, Packable, Tested", "Quality You Can Trust"
    12 No, drag     Bullets: clarity, energy, immunity, stress, digestion,
                    absorption. Fix: one reason first, the rest under it
    STOP 3 BELIEVE
    13 No, drag     Reviews sit at the very bottom
                    Fix: three reviews next to the plan box
    14 No, drag     4.8 (100,000) at the top, 4.75 (109,639) in the widget
                    Fix: one rating, its count and its source
    15 Yes          Widget shows newest first, including "the taste is off."
    16 No, DEAL     "Promotes mental clarity + energy" is on the brand's
                    risky list; the study measured 2 vitamins
                    Fix: remove until a claims check backs it
    17 Yes          Paid athlete is disclosed in small print
    18 Can't tell   Footer contact details not captured
    STOP 4 COMMIT
    19 No, DEAL     "$29.99" with "DISCOUNT AUTO-APPLIED"; the text sign-up
                    condition is in the footer; "Renews at $49.99" is small
                    Fix: "$29.99 first box with text sign-up, then $49.99
                    every 4 weeks" in the plan box
    20 No, drag     One-time says "No Free Shipping" but no cost
                    Fix: state the shipping cost
    21 Yes          FAQ: ships within 24 hours, arrives in 3 to 5 days
    22 No, DEAL     "30-Day Money-Back Guarantee"; "first order only" is in
                    the last FAQ. Fix: "on your first order" by the button
    23 No, drag     "Pause Or Cancel Any Time" with no steps
                    Fix: one line on how to cancel
    24 Can't tell   Checkout not captured
    STOP 5 FINE PRINT
    25 Yes          $66.65 crossed out is the real one-time price
    26 No, DEAL     "Limited Time Sale" in the bar; the price cut is "Not
                    just for a week but indefinitely". Fix: drop "Limited Time"
    27 No, DEAL     52%, 55% and "up to 55%" on one visit (same fix as 3)
    28 Yes          No add-ons seen ticked. Subscribe looks pre-selected
                    (inferred), which is a plan choice, not an extra
    29 Can't tell   No phone screenshots
    30 Can't tell   No speed report

    NO'S BY STOP
    Arrive 4  Understand 1  Believe 3  Commit 4  Fine print 2

    FIRST FIVE FIXES
    1 One discount number that matches the ad (checks 3 and 27, top bar)
    2 Drop "Limited Time Sale" (check 26, top bar)
    3 Pull the unbacked claims from the bullets (check 16, first screen)
    4 Full price and renewal together in the plan box (check 19)
    5 "On your first order" beside the guarantee line (check 22)

    CHECKS SCORE
    Now: 9 / (9 + 14) x 100 = 39   (7 can't tell left out)
    With the five fixes made: 15 / 23 x 100 = 65
    Deal-breakers left: none

    CAN'T TELL
    Checks 2, 6, 10 and 29: phone screenshots from top to bottom.
    Check 18: the footer. Check 24: checkout up to payment.
    Check 30: a PageSpeed Insights report on a phone.
    MISSING: which discount is the real first-order offer

tweaks:
  - what: The ad
    how: Add it and the first three checks compare the page with it. Without it they're marked can't tell.
  - what: Your facts
    how: Add your real prices, terms and claims list. Check 16 can then catch claims you're not allowed to make, and check 27 can tell which discount is the real one.
  - what: A checkout screenshot
    how: Add one, stopping before payment. Check 24 then shows whether guest checkout and express ways to pay are there.
  - what: Product page add-on
    how: For an online store, the store add-on explains how some checks read on a product page, such as the grey add-to-cart button when no option is picked.

judge:
  - Every "no" quotes the page or says where it is.
  - Checks it couldn't see are marked can't tell, never yes.
  - The verdict names one stop, not a list.
  - No fix adds a rating, count, price, offer or deadline you didn't supply.
  - The checks score shows its sum (yes out of yes plus no), says how many checks were left out, and is never sold as a sales forecast.

test:
  - Run it on an old version of a page you've since fixed. The problems you fixed should come back as no's.
  - Leave out the ad. Checks 1 to 3 should say can't tell, not yes.
  - Run it twice on the same page. The deal-breakers should match both times.
  - Check every quote in the evidence against your page. A quote that isn't on the page means it guessed.

improve:
  - Add a check your market needs to the right stop, such as a size chart for clothing under Understand, and keep the count in the name true.
  - Paste your real prices, terms and claims into "Your facts" in the skill once, so checks 16, 25 and 27 run every time.
  - Save each verdict and its five fixes, with the date, in your brand file, so the next pass shows what you fixed.
  - Pair it with the "Landing page auditor" when you want a deeper review ranked by severity, and with the "Sales funnel drop-off finder" once you have sales numbers.

works_best_with:
  tools:
    - {name: "Any good chat AI that reads images", why: "It can judge the first-screen and phone checks from your screenshots instead of guessing from text."}
    - {name: "PageSpeed Insights", why: "Free from Google. It gives the phone speed numbers check 30 needs from just the page's address."}
  inputs:
    - "Phone screenshots from top to bottom, taken on a real phone, so the first-screen checks aren't guesses"
    - "The ad that sends the most traffic, word for word with its image, for the three arrival checks"
    - "Your shipping, returns and subscription terms as written in your policies, to compare with the page"
    - "A screenshot of checkout up to the payment step, so check 24 can be judged"

terms:
  - term: Deal-breaker
    meaning: A problem that stops a buyer, or would make them feel misled after paying.
  - term: Drag
    meaning: A problem that costs some buyers or slows them down, but doesn't stop the sale on its own.
  - term: First screen
    meaning: What shows on a phone before you scroll.
  - term: Free-shipping threshold
    meaning: The order amount you must reach before shipping becomes free.
