new_slug: landing-page-design-planner
name: "Landing page design planner"
summary: "Plan a landing page design from your copy and brand. Get three different directions, a section plan and a build brief, before anyone builds."
job: write-landing-page
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Landing page design planner"
subhead: Give it your live page or your page copy and brand. If the page is live, it measures it first and plans three sets of changes to it. For a new page it plans three directions that differ in layout and what the pictures do. You get a section plan, a build brief, and a review if you send screenshots.

explain: |
  When you ask for page designs, you often get three versions of the same layout in three colours. Or your fonts get swapped and the delivery terms hidden to make it look cleaner.

  This skill plans the design before anything is built. If your page is already live, it improves that page by default. It captures the live site first, then plans three ranked sets of changes, each tied to what it found. For a new page, it first writes down a system from your own brand: which colours do which job, which font is for headings and which for reading, and one main visual move. Then it plans three directions that differ in how the first screen is composed, what the images do and how the argument flows, such as a product demonstration, a story told like a magazine, or a close look at details. Each section gets a phone and a desktop layout. Give it screenshots of a built page and it reviews them twice, once for design and once for technical problems like text that's too small or too faint.

when:
  - Your page copy and offer are settled and you need a design plan before anyone builds it.
  - A page is built and you want to know what looks wrong or is hard to read on a phone.
  - You want to compare a few real options for improving a live page before anyone rebuilds it.
not_for:
  - "You need the page copy written first: use the Ad-matched landing page writer, then bring the copy here."
  - "You are designing a dashboard or a tool screen: ask a designer for a product-tool layout brief instead."
  - "Your offer and copy are not settled yet: finish those first, because this plan does not invent offers, proof or claims."

you_give:
  - Your live page's address, so it can be measured first (or your brand's colours, fonts, voice, logo and product photos for a new page)
  - The page's copy or brief, the buyer, the ad that sends people there, the offer and the facts
  - Whether to improve the live page (the default), add a new page to your site, or do a full redesign (optional)
  - Phone and desktop screenshots of a built page, for a review (attach them; your AI can see pictures) (optional)
you_get:
  - One design system with named colours, font roles, a main visual move and layout rules
  - Three design directions, each with its first screen, image job and section order
  - A section plan with one row per section, for phone and desktop, and a build brief you can paste into a design tool
  - If you sent screenshots, design and technical findings with a fix for each
  - Any of its own checks the plan still missed, one line each, or none

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your brand colours with hex codes and font names, and attach your product photos.
  - Paste the finished page copy and the ad that sends people to it.
  - If the page is live, your AI improves it by default. Say "full redesign" only if you want the layout to change.
  - Pick one direction, then hand the section plan to whoever builds the page. Once it's built, send screenshots back for the review.
output_sample:
  input:
    - Your brand colours with their jobs, fonts, logo and product photos
    - Your page copy or brief, the buyer, the ad and the offer
    - Whether this is a refresh or a redesign (optional)
    - Phone and desktop screenshots of a built page (optional)
  prerequisites:
    - Your org context from the Org context builder, or your own brand details
    - An AI that can see pictures, if you send screenshots
  output:
    - name: Design system
      contains: Four to six of your colours with their jobs, font roles, one main visual move, layout rules and accessibility aims.
    - name: Three directions
      contains: Each has a name, first screen layout, what the images do, argument order, and phone and desktop notes.
    - name: Section plan
      contains: One row per section with the buyer question, phone layout, desktop layout and image.
    - name: Build brief
      contains: A short block for the chosen direction that you can paste into a design or build tool.
    - name: Review
      contains: Visual and technical findings in two lists, each with section, screen size and fix, plus what could not be checked.
    - name: Checks missed
      contains: One line for each check the plan still missed, or none.

how_it_works:
  - title: Checks the kind of page
    text: This is for pages that persuade, which lead with the real product, believable proof and a clear decision. Dashboards and tools need a different approach.
  - title: Sets the system first
    text: Writes four to six of your existing colours with their jobs, font roles, one main visual move, layout rules, line length, motion and accessibility aims. Adds no new colours or fonts.
  - title: Makes three real options
    text: Directions differ in first-screen layout, what the images do and the rhythm of the argument. Three colour swaps don't count.
  - title: Plans every section
    text: Each section answers one buyer question and gets a phone layout and a desktop layout, in a sensible reading order.
  - title: Designs the buying moment
    text: Shows the real product and variant, keeps the ad's promise visible, and groups price, choices and terms around the button.
  - title: Sets the type
    text: Body text starts at 16 px. Delivery, returns and subscription details stay visible on phones.
  - title: Reviews a built page
    text: Does one visual pass and one technical pass (contrast, tiny text, tap targets, zoom), each finding tied to a section and screen size.
  - title: Checks the work
    text: Runs its own checks on the plan and fixes what fails. Any check it still missed is listed, one line each.

output_shape: |
  DESIGN SYSTEM
  Colours: <colour> <hex> = <job>  (4 to 6, all yours)
  Type: headings <font>, body <font>, buttons <font>
  Main visual move: <one>
  Layout rules: <2 to 5>   Line length: <45 to 75 characters>
  Motion: <policy>   Accessibility: <aims>

  DIRECTION A  <name>
  First screen: <composition>   Images: <their job>
  Argument rhythm: <order>   Phone: <...>   Desktop: <...>
  DIRECTION B  <...>
  DIRECTION C  <...>

  SECTION PLAN
  # | Section | Buyer question | Phone layout | Desktop layout | Image

  BUILD BRIEF  (chosen direction)
  Job: <...>  System: <values>  Sections: <in order, phone layout each>
  Images: <real photos to use>  Always visible: <terms>

  REVIEW  (only if you sent screenshots)
