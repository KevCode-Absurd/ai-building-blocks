  <one line per check missed, or none>

example:
  business: gehna
  input: |
    [the skill]

    Live page: https://www.gehnaindia.com/filigree-pearl-18k-gold-dangle-earrings
    Brand capture: context/brand-dna.md and screenshots (9 Nov 2026).
    Goal: more phone visitors add the earrings to the cart. Keep every
    price, term and policy as on the site. Mode: improve the live page.
  output: |
    MODE: patch (the page is live; no redesign asked for)

    DESIGN SYSTEM (from the capture, product page)
    Colours: white page, about 60% of the page by pixels
             charcoal #3E3F43 = text and the dark footer, about 12%
             marigold #F4B54A = ADD TO CART and the offer line only, under 1%
             wine = the "TOP 25" badge only; it stays small
    Type: titles Nanum Myeongjo 800 30 px; body Lato 400 14 px;
          buttons Lato UPPERCASE 14 px
    Shapes: 4 px corners on buttons and boxes; round category chips
    Keep: menu bar, photo gallery with thumbnails, four-cell spec grid,
      dark footer, section order (product > FAQ > Complete Your Look >
      You May Also Like > reviews > categories > Customer Favorites)

    CHANGE-SET A  "Clear the buying moment"  (recommended)
    1. Move the WhatsApp bubble so it no longer covers the right end of
       ADD TO CART at 390 px (seen on the phone screenshot). Reuse.
    2. Show the delivery line ("Yours by 28 to 29 Nov") right under
       ADD TO CART on phones; today it sits below the first screen.
       Reuse the existing delivery row.
    Test: add-to-cart rate on phones, change-set A against the live page.

    CHANGE-SET B  "Proof beside the product"
    1. Move "4.8/5, 519 Google Reviews" from the banner above the photos
       to just under the product title. Restyle within the capture:
       Lato 14 px, the existing stars.
    Test: add-to-cart rate, B against the live page.

    CHANGE-SET C  "Size and weight first"
    1. Show the spec grid (gold 0.73 g, 18K, gemstone 1.87 ct, gross
       1.1 g) above the karat choice on phones. Reuse the grid as is.
    Test: add-to-cart rate and FAQ opens, C against the live page.

    PICK: A, because it frees the main button on the first phone screen.

    BUILD BRIEF (change-set A)
    Edit the live product template only. No new colour, font or
    component. Keep the header, footer and every section in place.

    NOT CHECKED
    How the moved WhatsApp bubble behaves on very small phones (320 px).
    Run the brand fidelity check on the patched page before hand-off.


tweaks:
  - what: Improve or redesign
    how: With a live page, it plans changes to that page by default and keeps everything you weren't asked to touch. Say "full redesign" to let the directions recompose the page, while your facts, offer terms and behaviour stay fixed.
  - what: Your brand colours
    how: Give each colour a job (background, button, accent). With jobs set, the three directions use them consistently instead of guessing.
  - what: Product photos
    how: List the photos you have by view (front, detail, in use, scale). Without them, image slots stay as labelled boxes rather than generated stand-ins.
  - what: Review only
    how: Send screenshots at phone, tablet and desktop widths and ask for the review only. You get the two lists of findings without new directions.

judge:
  - Every colour and font in the plan is one you supplied.
  - The three directions differ in layout and what the pictures do, not only in colour.
  - No offer, claim, review or badge appears that isn't in your facts.
  - Delivery, returns and subscription terms stay visible on phones.
  - Each review finding names a section and a screen size.
  - Anything it couldn't check, such as contrast over a photo, is listed as not checked.

test:
  - Search the plan for any colour or font you didn't supply. There should be none.
  - Put the three first screens side by side. If two differ only in colour, ask for a new third direction.
  - Run the review on a built page with a problem you already know about, such as small text on phones. It should name the section and the screen size.
  - Read the "not checked" list. Text contrast over photos should be on it unless someone checked it by eye.

improve:
  - Write your design system into step 2 once (colours with their jobs, font roles, layout rules), so every page starts from the same system and you only paste the copy.
  - Replace the example directions in step 3 with kinds that suit your brand, for example a recipe-card layout for a food brand.
  - Add the terms you must always show to step 6 (renewal price, delivery time), so no direction hides them.
  - Save the direction you choose to the look section of your org context, so later pages match it.
  - Pair it with "Ad-matched landing page writer" for the copy first, and "Competitor landing page layout planner" when you have a reference page.

works_best_with:
  tools:
    - {name: "Claude", why: "Holds a long design system and section plan in one chat, and can turn the chosen direction into a working page to preview."}
    - {name: "Figma Make", why: "Turns the build brief into a working prototype you can tweak, so you can compare directions before anyone codes."}
    - {name: "WebAIM Contrast Checker", why: "A free check of each text and background pair in your colours, before and after the page is built."}
  inputs:
    - "Your colours as hex codes, each with its job, and your font files or names"
    - "Product photos listed by view (front, detail, in use, next to something for scale)"
    - "Two or three pages you like the feel of, with a line on what you like, as mood references only"
    - "Screenshots of the built page at 390, 768 and 1280 px wide, for the review"

terms:
  - term: Design system
    meaning: The fixed set of colours, fonts, sizes and rules every section of the page follows.
  - term: First screen
    meaning: What a visitor sees before scrolling. On a phone this is small.
  - term: Contrast
    meaning: How clearly text stands out from its background. Faint grey text on white fails.
  - term: Tap target
    meaning: The area you can tap on a phone. Buttons around 44 px tall are easy to hit.
