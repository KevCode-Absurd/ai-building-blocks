new_slug: layout-default-breaker
name: "Layout default breaker"
summary: "Find the layout choices your software made for you. Get three hand-made alternatives and a two-reader test for your page, cover or slide."
job: design-work
thinking: medium
thinking_why: "It must tell chosen from inherited layout choices and invent different options, with a risk check on each."

headline: "Layout default breaker"
subhead: Give it a page, cover or layout, its message and who reads it. It marks every layout choice as yours or inherited from a template. You get three different hand-made alternatives and a test with two real readers to check the message still gets through.

explain: |
  Most pages look the way they do because the software offered that margin, that grid and that font size. The result is clean, and it looks like every other page. Readers feel nothing because nothing was decided.

  This skill starts from the readers and the message. It lists each layout choice and marks it as one you made or one a template made. Then it points you to real things around you to use, such as tickets, labels or your own photos. You print or cut the parts and move them by hand until the page makes people feel the subject. It sets the attitude of the page to match its readers, and lets one happy accident stay if it helps.

  The method follows public talks and interviews by the designer David Carson. It is our reading of his work, not his words. You get three alternatives that differ in kind, and a plan to check with two real readers.

when:
  - Your page, poster, cover or slide looks clean and forgettable.
  - You used a template and want to know which choices you never made.
  - You want to try a bolder layout without losing the message.
  - A reader said "nice" about your page but could not say what it was about.

not_for:
  - Your layout is already tested and working, or it is a form or data table where plain defaults help readers. Use the Website usability reviewer to check it instead.
  - You want a clear grid, type list and white-space plan with firm rules. Use the Page typography and layout planner.
  - You want a poster made from type only. Use the Type-led poster planner.
  - You do not know your readers or message yet. Write the brief first with the Design brief rules writer.

you_give:
  - Your page, cover or layout, as a picture or a detailed description
  - Who reads it, and what it must say, in one sentence each
  - Your copy (optional)
  - Photos or objects from the subject's world (optional)
you_get:
  - A list of layout choices, each marked made by you, inherited or unknown
  - Real things around you to gather and use
  - Three alternatives that differ in kind, each with its main risk
  - Steps for a hand trial with paper or a rough mock-up
  - A two-reader test with a pass mark

how_to_use:
  - Open the skill in your AI. Use one that can see images if you attach a picture.
  - Attach your layout. Say who reads it and what the message is in one sentence each. If you leave out all three, the skill asks for them and stops.
  - Read the made-or-inherited list. Note each choice you never decided.
  - Gather the real material it names. Your AI can't see or fetch these, so photograph or collect them yourself.
  - Print or cut the parts and try one alternative by hand. Mark any alternative that needs material you don't have.
  - Show two real readers each version for ten seconds and ask what it says. Both must name the message to pass.

how_it_works:
  - title: States audience and message
    text: Writes who reads it and what must get through before touching the layout.
  - title: Marks every choice
    text: Lists each layout choice and marks it made by you or inherited from a template.
  - title: Gathers real material
    text: Suggests things from your own surroundings to use, rather than a search.
  - title: Moves parts by hand
    text: Plans a hand trial where parts are printed or cut and moved until the page feels right.
  - title: Matches the attitude
    text: Sets the page's attitude to fit its readers.
  - title: Allows one accident
    text: Keeps one accident only if it helps the message.
  - title: Tests with readers
    text: Plans a check with two real readers that the message still gets through.

output_shape: |
  AUDIENCE AND MESSAGE
  <who reads it> | Message: <one sentence>

  CHOICES
  <choice> | Made by you / Inherited | Why it matters

  REAL MATERIAL TO GATHER
  <list from your own surroundings>

  THREE ALTERNATIVES
  A. <idea> | Attitude: <x> | What changes: <list> | Risk: <y>
  B. ...
  C. ...

  HAND TRIAL
  <steps with paper or rough mock-up>

  ACCIDENT RULE
  <what may stay, what must go>

  READER TEST
  <two readers, the question, what counts as a pass>

  MISSING
  <what would sharpen the options>

  CHECKS MISSED
  <one line per check missed, or none>

tweaks:
  - what: The audience
    how: Describe real readers, such as late-shift nurses or teenage gamers. The attitude of the page follows from them.
  - what: How far to go
    how: Say if the page can be wild or must stay safe. It scales the three alternatives.
  - what: The one thing that must read
    how: Name it, such as a date or price. The alternatives will protect it.
  - what: Medium
    how: Say if it is print, screen or both. It changes what can be done by hand.

judge:
  - Every default is marked as chosen or inherited.
  - Three different alternatives are made.
  - The message still reads for a real reader.
  - The attitude matches the audience.
  - Any wild move has a reason.

test:
  - Run it on a layout you know came from a template and see if it spots the template choices.
  - Print the alternatives and show them to two people from your audience. Ask what the page says.
  - Run it twice and check the three options are different each time in kind, not only in colour.
  - Cover the headline and see if the page still feels like its subject.

improve:
  - Add your brand rules, so the alternatives stay within the parts you cannot change.
  - Add a list of materials from your own world, such as tickets, labels or photos.
  - Add a rule for the minimum legibility any option must keep.
  - Pair it with a type and spacing checker after you choose an option.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Reviewing layout choices from an image and a brief is something any strong chat AI that can see images does well."}
    - {name: "Paper, scissors and a printer", why: "Moving parts by hand shows options software hides."}
  inputs:
    - "A photo or scan of the current layout"
    - "Real objects or photos from the subject's world"
    - "Two readers willing to give feedback"

terms:
  - term: Inherited choice
    meaning: A layout setting you did not decide, such as a margin or font size a template supplied.
  - term: Hand trial
    meaning: Moving printed or cut parts around by hand to find a layout, before building it on screen.

output_sample:
  input:
    - Your page, cover or layout, as a picture or a description
    - Who reads it and the message, in one sentence each
    - Your copy (optional)
  prerequisites:
    - Paper, scissors and a printer for the hand trial
    - An AI that can see images, if you attach a picture
    - Two real readers for the test
  output:
    - name: AUDIENCE AND MESSAGE
      contains: Who reads it and the one sentence that must get through.
    - name: CHOICES
      contains: Each layout choice marked made by you, inherited or unknown, with why it matters.
    - name: REAL MATERIAL TO GATHER
      contains: Five to eight things from your own surroundings to use in the trial.
    - name: THREE ALTERNATIVES
      contains: Three layouts that differ in kind, each with its attitude, what changes and its main risk.
    - name: HAND TRIAL
      contains: Steps to print or cut the parts and move them by hand, with a time limit.
    - name: ACCIDENT RULE
      contains: Which accident may stay if it helps, and what must never happen.
    - name: READER TEST
      contains: A test with two readers, the question to ask and what counts as a pass.
    - name: MISSING
      contains: What would sharpen the options.
