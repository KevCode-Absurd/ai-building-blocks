new_slug: lead-offer-planner
name: "Information-led lead offer planner"
summary: "Plan a lead offer built on useful information. Get the offer, a countable reply step, a short ad or letter, and who follows up on each reply."
job: make-offer
thinking: medium
thinking_why: "It picks one offer from several options and sets rules for follow-up, but the steps are fixed."

headline: "Information-led lead offer planner"
subhead: Give it your product or service and the person whose problem costs them money. It picks the information that person would ask for and turns it into the offer. You get the offer, the reply step, the short ad or letter and a plan that gives every reply an owner.

explain: |
  Most ads either pitch or hint. A pitch makes people who are not ready ignore you. A hint gives them no reason to reply. Your best prospects are often people with a costly problem who are still looking for facts, and they will not answer a sales call they did not ask for.

  This skill starts from the problem and what it costs. It lists the information that person would ask for to ease the problem and picks one piece as the offer. It defines what counts as a reply, writes the short ad or letter that asks for it, and gives each reply a named owner and a time for the next contact. Last, it sets how you will count replies and sales from each source, so you can see which source pays.

when:
  - Your ads talk about you and nobody replies.
  - Leads arrive but nobody follows up on a set day.
  - You sell something costly or slow to decide, and buyers research first.
not_for:
  - "You have not yet chosen between a premium, free or discount first step: use the First purchase offer planner."
  - "You sell a low-cost impulse item where buyers do not research first: write a direct offer with a price and a buy button instead."
  - "People already reply but do not buy: use the Sales follow-up email writer to bring them back."

you_give:
  - Your product or service, what it costs and what it does
  - Who has the costly problem and what it costs them, if you know
  - Who will handle replies, and how often they can follow up (optional)
you_get:
  - One information offer, named and described in the buyer's terms
  - A definition of a reply and how it is recorded
  - A short ad or letter that offers the information and asks for the reply
  - A routing and counting plan with owners and times

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts. Say who has the problem and what it costs them, in money or time.
  - Tell it who will handle replies and how fast they can.
  - Check that the offer is something your buyer would ask for. Send the ad or letter to one small group first.
  - After two weeks, bring the reply counts back and ask it to compare sources.
output_sample:
  input:
    - Your product or service, what it costs and what it does
    - Who has the costly problem and what it costs them (optional)
    - Who will handle replies and how fast (optional)
  output:
    - name: The costly problem
      contains: Who has the problem and what it costs them in money, time or risk.
    - name: The offer
      contains: The name, format and reason for one piece of information your buyer would ask for.
    - name: What counts as a reply
      contains: One action you can count and where each reply is written down.
    - name: The short ad or letter
      contains: A short text that names the problem, offers the information and asks for one step.
    - name: Routing table
      contains: Each kind of reply with a named owner and a time for the next contact.
    - name: Counting plan
      contains: Where the ask runs, what is counted for each place, and a review date.
    - name: MISSING lines
      contains: Facts that would sharpen the offer, such as the cost of the problem.
    - name: CHECKS MISSED
      contains: One line for each check still missed, or none.

how_it_works:
  - title: Names the costly problem
    text: Writes who has the problem and what it costs them, in money, time or risk. A problem you cannot price is flagged.
  - title: Lists what they would ask
    text: Lists the questions that person would put to an expert before buying, checked against your facts.
  - title: Picks the offer
    text: Chooses one piece of information the buyer wants and makes it the offer, not the product.
  - title: Defines a reply
    text: States exactly what counts as a reply and where it is written down.
  - title: Routes each reply
    text: Gives each kind of reply a named owner and a time for the next contact.
  - title: Writes the ask
    text: Writes the short ad or letter that offers the information and asks for one step.
  - title: Plans the count
    text: Sets how replies and sales are counted by source, and when to review.
  - title: Checks the set
    text: Runs its own checks and names any it missed.

output_shape: |
  THE COSTLY PROBLEM
  <who has it, what it costs them, how you know>

  THE OFFER
  Name: <name of the information>
  What it is: <format and contents>
  Why they want it: <the question it answers>

  A REPLY IS
  <what counts, where it is recorded>

  THE AD OR LETTER
  <short text, with one clear step>

  ROUTING
  <reply type> | Owner: <name> | Next contact: <time>

  COUNTING
  <sources, what is counted, review date>

  MISSING
  <facts that would sharpen the offer>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: The cost of the problem
    how: A number, even a rough one, lets the offer speak to the loss. Without one the skill marks it MISSING and writes a softer offer.
  - what: What the buyer asks today
    how: Paste real questions from calls or emails. They beat guesses.
  - what: How many people can reply
    how: Tell it your team size so the routing times are ones you can keep.
  - what: The format
    how: Say if you can make a report, a call, a checklist or a sample. It picks one you can deliver.

judge:
  - The offer is information a buyer would ask for, not your product in disguise.
  - A reply is defined in one line you could count.
  - Every kind of reply has a named person and a time.
  - The problem named is one the buyer already knows they have.
  - The ad or letter asks for one step only.

test:
  - Show the offer to someone who fits the buyer and ask if they would send for it. Note their words.
  - Check that the person named as owner agrees to the follow-up time.
  - Send the ad or letter to a small list and count replies against the definition.
  - Run the skill twice and compare which information it picks. The pick should stay close.

improve:
  - Add the usual questions your sales team hears to step 2.
  - Save the best performing offer and its reply count to your brand file.
  - Add your rule for how fast a reply must be answered.
  - Pair it with "Almost-buyer follow-up writer" for people who reply but do not buy.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Listing questions and drafting a short ad or letter is text work any strong chat AI handles."}
    - {name: "A spreadsheet", why: "Easiest way to log each reply, its owner and its next contact time."}
  inputs:
    - "Real questions buyers asked before buying"
    - "What a lost sale or a bad purchase costs, if known"
    - "The places you advertise now"

terms:
  - term: Reply
    meaning: A specific action by the buyer that you can count, such as sending for the report or booking a call.
  - term: Routing
    meaning: Deciding who deals with each reply and when.
