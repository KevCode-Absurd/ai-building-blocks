    10 Reads labels: methylfolate, third-party tests (facts)      3
                                                         total   50

    FIRST SLOTS (6 of 50)
    01 Headline-led | reason 1 | quitter | knows solutions | confession
       Big type: "I quit my greens powder, not greens". Pouch small.
    02 Testimonial | reason 2 | quitter | knows problem | confession
