tweaks:
  - what: Your own mix
    how: Replace the 40/30/20/10 split with what your results say. If testimonials have always won for you, give that group more slots and it recalculates the counts.
  - what: Live offers
    how: Only list offers running today, and say which number is the real one if your site shows several. With no offer it drops offer-first slots and gives them to the other workhorse formats.
  - what: Number of ads
    how: Ask for 20 instead of 50. The same rules apply, with fewer reasons to buy and the caps lowered to match.
  - what: Competitor gaps
    how: Add what competitors never say. It turns those gaps into reasons to buy, described without naming the competitor.

judge:
  - The format numbers add up to exactly 50, and each group matches its share.
  - No reason to buy has more than 6 ads and no opening line type more than 8.
  - Read two slot ideas aloud. Each names something true about your product that a rival couldn't copy unchanged.
  - Every quote is word for word with its review number, and no slot shows a child, a made-up expert or a generated customer.
  - It stopped at the approval and didn't start writing briefs.

test:
  - Run stage 1 with last year's winning ad in the past results. Its reason to buy should be on the map. If it's missing, your buyer research doesn't cover that buyer yet.
  - Add the counts yourself for the format mix and the reasons. They must add to exactly 50, with no reason above 6 and no opening line type above 8. A wrong sum means the plan can't be trusted.
  - Run stage 1 twice. The reasons to buy should mostly match. If half of them change, give it fewer, sharper buyer descriptions.
  - Ask for changes and check it shows the plan again and waits. If it starts writing briefs, it skipped the approval.
  - Pick any two slots and swap them in your head. If nobody would notice, the slot ideas aren't specific enough; tell it which ones.

improve:
  - Replace the 40/30/20/10 split in step 2 of the skill file with your own mix once you have results, and write the reason next to it.
  - Add your live offer and the one discount number that's real to "What you need", so offer-first slots never quote a number the site states two ways.
  - Delete formats from step 2 you'll never make (for example founder, if there's no founder to show), so their shares go where they're useful.
  - After the sprint, save the three best reasons and formats in your brand file, and run a smaller sprint on just those.
  - Pair it with a skill that finds the image ad types you've never tried before you start, and with one that finds flaws in finished image ads at the end.

terms:
  - term: Slot
    meaning: One planned ad in the 50, with its format, buyer, reason to buy and idea fixed before anyone writes it.
  - term: Text-led
    meaning: An ad where the words carry the message and the product is only a small picture.
  - term: Opening line type
    meaning: The kind of first line that makes someone stop scrolling, such as a confession or a price comparison. Marketers call this the hook.
