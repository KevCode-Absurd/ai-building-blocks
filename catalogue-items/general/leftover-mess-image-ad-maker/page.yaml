thinking: medium
thinking_why: "It writes or plans with a handful of checks."
new_slug: leftover-mess-image-ad-maker
name: "Leftover mess image ad maker"
summary: "Turn your story ad into a close-up photo prompt of the mess your problem leaves behind, plus a short line to run under the image."
job: make-image-ads

headline: "Leftover mess image ad maker"
subhead: Give it your story ad. It pins down what the problem leaves behind, its honest amount and where it was found, then frames it close in the plain look of a phone snap. You get the photo prompt and a line under the image.

explain: |
  Many problems leave something you can see: shed hair, lint, limescale, spilled powder, a worn-out sole. Shot close, in the plain look of a phone snap, it takes a second look to work out what it is. People with the problem get there on that second look, and the story's first line confirms it. That small gap, opened and closed fast, is what makes people stop.

  The skill fixes three facts first: what the residue is in your buyer's words, the honest amount, and the surface or container that gives it away. Then it frames it close with that container cut by the edge, and picks the light by tone: hard flash for mess people complain about, softer room light for mess they'd rather not mention. It keeps the amount true to your research and never shows anything that reads as injury. The result is a made image, so it never claims a real customer took it or presents it as a testimonial.

when:
  - Your buyer's problem leaves something behind they can see or touch.
  - You're showing ads to people who don't know you yet and want a picture that earns a second look.
  - Your story opens by describing what the narrator keeps finding.
not_for:
  - "Your problem leaves nothing you can see or touch: use a problem-moment image ad maker and show the daily routine instead."
  - "You want to point at one spot on a picture: use a circled-flaw image ad maker."
  - "Your problem shows on the body or looks like injury or illness: skip this and show the routine, not the body."

you_give:
  - Your approved story ad and the residue it names
  - How your buyers describe what they find, and how much (optional)
you_get:
  - The mess, its honest amount and where it was found
  - How close to shoot it, from what angle, and with which light
  - A short line to run under the image
  - A 60 to 120 word image prompt, ready to paste
  - Any of the six checks it still missed, one line each, or none

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad underneath. The residue should be named in the first lines.
  - Add how your buyers describe what they find, from reviews or messages, if you have it.
  - Paste the image prompt into your image tool. If it looks like a clean studio close-up, ask again with "phone flash, slightly blurry edges".
  - Compare the amount in the picture with your research. If it looks worse than real life, make it again.
output_sample:
  input:
    - Your approved story ad, with the mess it names
    - How your buyers describe what they find, and how much (optional)
  prerequisites:
    - An image tool such as GPT Image or Nano Banana, if you want the picture made
  output:
    - name: Scene
      contains: One sentence on what someone scrolling would say they saw.
    - name: Where and when
      contains: The place, the time of day and what is within reach.
    - name: The residue
      contains: What the mess is, how much of it there is and where it was found.
    - name: Framing and light
      contains: How close to shoot, the angle, and whether to use flash or room light.
    - name: Words on the image
      contains: None. The picture carries no text.
    - name: Line under the image
      contains: A short plain caption of about 27 characters that never names the product.
    - name: Flags
      contains: The amount and where it came from, plus anything the skill had to guess.
    - name: Image prompt
      contains: A 60 to 120 word prompt, ready to paste into your image tool.
    - name: Checks missed
      contains: One line for each check the picture still fails, or none.

how_it_works:
  - title: Sets the house rules
    text: Square, looks taken on a phone, no logo, price, button, brand colour or product, and at most one hand at the edge.
  - title: Fixes three facts
    text: What the residue is in your buyer's words, the honest amount, and the surface or container that gives it away.
  - title: Frames it close
    text: The residue fills a third to half the frame, with the giveaway container cut by the edge so the second look can happen.
  - title: Picks the light by tone
    text: Hard flash for mess people complain about, softer room light for mess they're embarrassed by.
  - title: Runs the two-look test
    text: One second for "something spilled", two seconds for "I know that". Too obvious goes closer; too vague shows more container.

output_shape: |
  SCENE               <what someone scrolling would say they saw>
  WHERE AND WHEN      <place, time of day, what is within reach>
  THE RESIDUE         <what it is, how much, where it was found>
  FRAMING AND LIGHT   <how close, angle, flash or room light and why>
  WORDS ON THE IMAGE  None.
  LINE UNDER IMAGE    <words> (<caption line>, <characters>)
  FLAGS               <the amount and its source, anything inferred>
  IMAGE PROMPT        <60 to 120 words, ready to paste>
  CHECKS MISSED       <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on review 6 and the brand's line about
    messy counters):
    This is my counter at 7am. A dusting of green powder around the
    scoop, every morning, and a wet cloth to wipe it up before work.
    I liked what was in the powder. I didn't like the mess.
    Sprout is a small handful of gummies in a daily pack. One
    reviewer said not having to clean a shaker bottle or extra dishes
    "is absolutely excellent!" 60+ ingredients, 21 vitamins and
    minerals, 6 g prebiotic fiber.

    Buyer: the quitter who wants to stick, 28 to 45.
  output: |
    SCENE               A close-up of fine green dust scattered across
                        a dark kitchen counter around a plastic scoop.
    WHERE AND WHEN      A kitchen counter, 7am, before work. Within
                        reach: the base of a plain tub, a damp cloth.
    THE RESIDUE         Green dust, "a dusting", as the story says.
                        One morning's spill around the scoop, a few
                        small clumps by its edge. Found where it always
                        lands: around the scoop, next to the tub.
    FRAMING AND LIGHT   Close, from above, the dust and scoop filling
                        about a third of the frame. The tub base is cut
                        by the top edge, so the second look reads
                        "powder tub". Hard phone flash: this is mess
                        people complain about.
    WORDS ON THE IMAGE  None.
    LINE UNDER IMAGE    My counter at 7am. Daily. (plain caption, 25)
    FLAGS               Amount from the story ("a dusting"). Don't make
                        it a pile. The scoop and tub are plain and
                        unbranded, never a rival's. The damp cloth is
                        from the story's second line.
    IMAGE PROMPT        Square 1:1 close phone photo taken from above
                        with harsh on-camera flash. A light dusting of
                        fine green powder lies scattered across a dark,
                        slightly scratched kitchen counter around a
                        plain white plastic scoop, with a few small
                        clumps by the scoop's edge. The powder and
                        scoop fill about a third of the picture. The
                        base of a plain unlabelled tub is cut off by
                        the top edge, and a damp grey cloth sits half
                        in view at the right. Slight tilt, soft blurry
                        corners, ordinary and unstyled. Plain objects
                        only, nothing written or drawn on the image.

tweaks:
  - what: How close
    how: Closer makes the first look harder, which is the point. Ask for "fill half the frame" if it reads too easily, or "show more of the tub" if nobody can tell at all.
  - what: The light
    how: Flash looks like a quick phone snap. Room or window light is softer and suits mess people would rather not talk about.
  - what: A hand
    how: Add "a hand wiping it with a cloth at the edge" to show it happens every day, or keep it hands-free so the mess is all there is.
  - what: The amount
    how: Say the real amount, such as "one morning's dusting" or "a palm-sized clump". Exaggeration reads as a trick.

judge:
  - It's one residue, in the amount your research describes, not exaggerated.
  - It's odd or unpleasant, never graphic. No blood, wound or anything medical.
  - The giveaway container or surface is partly in shot, so the second look can happen.
  - There's no product, pack, logo, text, arrow or circle anywhere.
  - It looks like a cheap phone photo, not a clean studio close-up.

test:
  - Show the picture to someone for one second and ask what it is. A pause, then the right answer, is what you want. No answer at all means it's too close.
  - Compare the amount in the picture with how your buyers describe it. If it's worse, make it again with the real amount named.
  - Run it on a story whose problem leaves nothing behind. It should send you to the snapshot skill instead.
  - Test it against a snapshot of the same story with a person in it, so the picture is the only change.

improve:
  - Add your buyers' words for what they keep finding to "What you need". Their exact description makes the best opening and the best picture.
  - Add the amounts your research describes, so the skill never has to guess how much.
  - Add the surfaces of your buyers' homes (dark counters, tiled floors) to step 3, so the place looks like theirs.
  - Pair it with the story ad skill, so the first line names what the picture shows.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Follows named light and camera terms, such as 'harsh on-camera flash, from above'."}
    - {name: "GPT Image", why: "Follows detailed placement, so the residue and the cut-off container sit where you describe them."}
  inputs:
    - "A real phone photo of the mess from your own home or a customer who agreed, so the image tool can match its texture"
    - "Reviews that mention the mess with an amount, such as 'every morning' or 'a handful', so the amount is honest"
    - "Your never-shown list, so mess you don't want linked to the brand stays out"

terms:
  - term: Residue
    meaning: What a problem leaves behind, such as lint, hair, powder or limescale.
  - term: Story ad
    meaning: An ad whose main text tells one person's story, like a post from a friend.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
