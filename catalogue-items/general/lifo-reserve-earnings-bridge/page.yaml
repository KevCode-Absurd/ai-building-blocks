new_slug: lifo-reserve-earnings-bridge
name: LIFO reserve earnings bridge
headline: LIFO reserve earnings bridge
summary: Turn the LIFO reserve in a company's filing into a FIFO inventory and earnings bridge. See how COGS, inventory and after-tax profit change.
job: track-numbers
thinking: high
thinking_why: "The reserve changes both the balance sheet and the income statement, and the direction of each effect can be checked on its own."
subhead: Give it a company's LIFO inventory, its LIFO reserves, COGS, revenue and tax rate. It restates inventory, COGS and after-tax earnings as if the company used FIFO. You get a bridge from reported to FIFO figures, with checks and gaps listed.
explain: |-
  Companies that use LIFO report lower inventory and often higher COGS than FIFO companies. The filing gives the LIFO reserve, the gap between the two. This skill uses it to restate inventory, COGS and after-tax earnings on a FIFO basis, so you can compare companies like for like.

  Illustrative figures, not a real company: the reserve rises from 40 to 60, an increase of 20. That lowers FIFO COGS from 350 to 330, so gross margin is 170 / 500 = 34%. FIFO inventory is 200 + 60 = 260. After tax at 25%, earnings rise by 20 x 75% = 15. A closing reserve of 30, below the opening 40, reverses these directions.
when:
  - You compare a LIFO company with a FIFO company and need the numbers on the same basis.
  - You want to know how much a rising LIFO reserve lowered reported profit.
  - You need to flag a reserve drop, where old low-cost layers boosted profit.
  - A reviewer wants to trace each FIFO figure back to a filing.
not_for:
  - "Your company reports under IFRS or has no LIFO disclosure: IAS 2 does not allow LIFO, so compare the reported FIFO or average-cost figures directly."
  - "You need a tax return, a filing or advice on a tax refund: ask your accountant, because this bridge is an analysis only."
  - "You need a full forecast model with several years of statements: build it in your own spreadsheet with an accountant or analyst."
  - "You need the margin effect of inventory write-downs and reversals: use the Inventory write-down margin checker instead."
you_give:
  - Reported LIFO inventory at the end of the period.
  - LIFO reserve at the start and end of the period.
  - Reported cost of goods sold (COGS) and revenue.
  - The tax rate to apply to the change.
  - Notes on acquisitions, currency effects or method changes in the reserve (optional).
you_get:
  - FIFO inventory, which is LIFO inventory plus the closing reserve.
  - FIFO COGS, which is LIFO COGS less the rise in the reserve.
  - The gross margin and after-tax earnings difference, tied to reported figures.
  - A flag when the reserve fell, so the gain is not shown as growth.
  - An editable workbook, if you ask for one, plus a list of missing inputs and unrun checks.
how_to_use:
  - "Collect the numbers from the company's annual report: inventory, both reserve balances, COGS, revenue and the tax rate you want to use."
  - Open your AI and add this skill. Use an AI that can make spreadsheet files if you want a workbook.
  - Paste your numbers and say the reporting date, currency and scale. Say if any reserve change came from an acquisition or currency move.
  - Ask for the bridge. If you want to run the included script, your AI needs Node.js 20 or later.
  - "Check the direction first: a rising reserve should lower FIFO COGS. Then read the MISSING lines and CHECKS MISSED before you use the result."
output_sample:
  input:
    - Reported LIFO inventory
    - Opening and closing LIFO reserve
    - Reported cost of goods sold (COGS) and revenue
    - Tax rate to apply
    - Notes on acquisitions, currency or method changes (optional)
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, only if you want to run the included calculation script
  output:
    - name: Scope and dated sources
      contains: The reporting date, currency, scale and the filings or notes each number came from.
    - name: Inputs and assumptions
      contains: Every number used, the tax effect assumption, and any reserve change you asked to exclude.
    - name: Model calculations and reconciliations
      contains: FIFO inventory, FIFO COGS, gross margin difference and after-tax earnings difference, tied back to reported figures.
    - name: Editable workbook
      contains: A spreadsheet with inputs, formulas and checks, when you ask for a workbook.
    - name: Actual file verification
      contains: Which recalculation and file checks ran on the workbook.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and any checks that failed or could not run.
how_it_works:
  - title: Checks the basis
    text: Confirms US-GAAP LIFO use and how the filing defines the reserve. Takes out acquisition, currency and method-change effects.
  - title: Restates inventory and COGS
    text: FIFO inventory is LIFO inventory plus the closing reserve. FIFO COGS is LIFO COGS less the rise in the reserve.
  - title: Restates margin and earnings
    text: Shows the gross margin and after-tax earnings difference, and flags a reserve fall so it is not shown as growth.
output_shape: |-
  A FIFO analytical restatement with inventory, COGS and after-tax earnings differences.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING lines
  CHECKS MISSED
tweaks:
  - what: "Fiscal year end"
    how: "Take the fiscal year end from the filing's inventory note and income statement. Use one currency and scale on every line."
  - what: "Tax rate"
    how: "Change the tax rate and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: An increasing reserve lowers estimated FIFO COGS. Check the direction by hand.
judge:
  - An increasing reserve lowers estimated FIFO COGS; the direction is checked independently.
  - The tax effect is a disclosed analytical assumption, not a cash refund or statutory tax filing.
  - Tie all inputs to source notes, dates, currency, scale and signs.
  - Retain reported figures beside analytical adjustments and list every unresolved source gap.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one LIFO to FIFO bridge you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define LIFO reserve into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
