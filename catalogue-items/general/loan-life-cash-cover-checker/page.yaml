  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: 1. Map dated sources, contractual definitions, period boundaries, currency, scale and source gaps before calculating
    text: Map dated sources, contractual definitions, period boundaries, currency, scale and source gaps before calculating.
  - title: 2. Confirm the remaining loan horizon and remove cash beyond maturity or excluded by the agreement
    text: Confirm the remaining loan horizon and remove cash beyond maturity or excluded by the agreement.
  - title: 3. Discount end-year qualifying cash at the supplied financing-definition rate; keep valuation WACC and equity returns out of the calculation
    text: Discount end-year qualifying cash at the supplied financing-definition rate; keep valuation WACC and equity returns out of the calculation.
  - title: 4. Divide present qualifying cash by opening loan balance and show the signed currency cushion over debt
    text: Divide present qualifying cash by opening loan balance and show the signed currency cushion over debt.
