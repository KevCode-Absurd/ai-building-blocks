new_slug: local-production-scanner
name: "Local production opportunity scanner"
summary: "Find what to make locally in a market that imports most of it. Get a ranked pick, what to build, a first plant size and a buffer."
job: test-an-idea
thinking: high
thinking_why: "It weighs sourced numbers across costs, risk and sizing, and must not invent figures."

headline: "Local production opportunity scanner"
subhead: "Give it what your market buys from outside and what you can invest. It ranks what to make locally, lists the power, water and roads you must build, sizes the first plant and adds a buffer. You get a plan and an evidence audit."

explain: |
  When a market imports much of what it uses, the gap looks like an opportunity. It often is, but the cost of power, roads and ports can sink the plan, and a plant that is too small never changes prices.

  This skill starts from a sourced list of imports and picks the item where local making keeps the most jobs and value. It lists what you must build yourself, sizes the first plant to move the market, plans funding with a fallback business and adds a buffer for cost and time overruns. It also names the policy risk to watch.

when:
  - "You are deciding what to make in a market that imports most of it."
  - "You think a local plant could win but have not costed power, roads or storage."
  - "Investors ask what happens if costs run over or rules change."
not_for:
  - Your market has no import or price data at all. Collect customs or trade body figures first, or ask a local trade body.
  - You run a service business and local making is not the question. Talk it over with an adviser or a peer in your trade.
  - You only want to test if people will buy. Run a small paid trial with a few real buyers before you build anything.

you_give:
  - "Your market and what you can invest"
  - "Import or price data with sources"
  - "Known costs for power, transport and storage (optional)"
you_get:
  - "A ranked list of local making options with reasons"
  - "The infrastructure you must build, with cost ranges"
  - "A first plant size and funding fallback"
  - "A buffer and policy risks to watch"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Paste your import data with sources and your investment limits."
  - "Fill the `MISSING:` lines with real quotes before relying on the plan."
  - "Review the policy watch list every quarter."
output_sample:
  input:
    - Your market and what you can invest
    - Import or price data with sources
    - Known costs for power, transport and storage (optional)
    - Your fallback business and time horizon (optional)
  output:
    - name: Imports
      contains: Each item the market buys from outside, with its volume or value and the source of that figure.
    - name: Top three
      contains: The three items where local making keeps the most jobs and value, with one reason each.
    - name: Pick
      contains: The one item to make locally.
    - name: To build
      contains: The power, water, roads, ports and storage needed, whether each exists, and a cost range or a MISSING line.
    - name: Plant size
      contains: The first plant volume that could shift the market, and the logic behind it.
    - name: Funding and fallback
      contains: How the first phase is paid for and the fallback business that earns meanwhile.
    - name: Buffer
      contains: A cost and time overrun buffer, marked as given by you or proposed.
    - name: Policy risks
      contains: Rule changes that could hurt, one signal to watch for each, and what you would do.
    - name: Missing and checks missed
      contains: Gaps in your data, and any checks the plan still fails.

how_it_works:
  - title: "Lists imports"
    text: "Each item with its volume and source."
  - title: "Picks the top item"
    text: "Where the most work and value stays."
  - title: "Lists what to build"
    text: "Power, water, roads, ports and storage."
  - title: "Sizes the plant"
    text: "Big enough to change the market."
  - title: "Plans funding"
    text: "From profits, with a fallback business."
  - title: "Adds a buffer"
    text: "For cost and time overruns."
  - title: "Names policy risk"
    text: "With one signal to watch for each."

output_shape: |
  IMPORTS
  <item> | <volume or value> | source <x>

  TOP THREE
  1. <item>: <why>

  PICK
  <item>

  TO BUILD
  <need>: exists? <y/n> | cost <range or MISSING>

  PLANT SIZE
  <volume> because <logic>

  FUNDING AND FALLBACK
  <plan> | fallback <business>

  BUFFER
  <cost %> and <time %> (<given or proposed>)

  POLICY RISKS
  <risk> | watch <signal> | response <action>

  MISSING
  <gaps>

  CHECKS MISSED
  <lines or none>

tweaks:
  - what: "Data sources"
    how: "Customs data and trade body reports give stronger rankings than guesses."
  - what: "Your investment limit"
    how: "State it. It decides what size of plant is real."
  - what: "Your fallback business"
    how: "Name it. The funding plan rests on it."
  - what: "The time horizon"
    how: "Say how many years you can wait for first output."

judge:
  - "Every import has a source."
  - "Missing infrastructure has a cost or a `MISSING:` line."
  - "The buffer is shown and labelled given or proposed."
  - "The fallback business is named."
  - "Each policy risk has a signal to watch."

test:
  - "Run it on a product you know the market for. Compare the ranking with what you expect."
  - "Run it twice. The top item should stay the same."
  - "Check three of its numbers against the source."
  - "Show it to a local trade body or bank and note what they correct."

improve:
  - "Add your country's duty and licence list to step 7."
  - "Add your own buffer rule to step 6."
  - "Update the import table each quarter."
  - "Pair it with an MVP experiment planner to test demand before building."

next: [mvp-experiment-planner, idea-evidence-review]

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Ranking and structuring a sourced table is text work."}
    - {name: "A spreadsheet", why: "Holds the import table, costs and buffer so you can change a number and see the effect."}
  inputs:
    - "Customs or trade data"
    - "Quotes for power and transport"
    - "Price lists of local and imported goods"
    - "Your finance limits and timeline"

terms:
  - term: "Import substitution"
    meaning: "Making locally what the market now buys from elsewhere."
  - term: "Buffer"
    meaning: "Extra budget and time added for things that run over."
