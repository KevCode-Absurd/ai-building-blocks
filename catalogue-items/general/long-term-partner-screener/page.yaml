new_slug: long-term-partner-screener
name: "Long-term partner screener"
summary: "Check a partner, client or hire before you commit. Get scores for integrity, intelligence and energy, and a keep, test-first or walk-away call."
job: lead-people
thinking: medium
thinking_why: "It scores people on three traits from evidence, which takes careful reading but follows a fixed frame."

headline: "Long-term partner screener"
subhead: "Describe a partner, client or hire and what you have seen of them. It scores intelligence, energy and integrity with integrity first, flags cynicism, tests the history, and gives a keep, test-first or walk-away call."

explain: |
  Work with the right person for ten years and the gains stack up. Work with the wrong one and a single bad deal can cost you more than a dozen good ones earned. Most of us pick on charm, skill or a good first meeting.

  This skill starts with the game: what are you doing together and how often will you play it? It scores intelligence, energy and integrity from what you have seen, weighting integrity first because the other two make a person who lacks it more costly. It flags habits like cynicism, tests the record for who rounds up in whose favour, and asks whether a one-off win here would hurt the relationship. It ends with a call and says what would change it.

when:
  - "You are about to sign a long contract or take on a co-founder."
  - "A client is great on revenue but you have a bad feeling about them."
  - "You are choosing between two hires or two vendors."
not_for:
  - "You are judging a seller's advice or pitch: use the Advice skin-in-the-game checker."
  - "You are making a one-off, low-stakes purchase: a quick look at reviews or a short chat is enough."
  - "You have no firsthand dealings with the person yet: meet them or run a small paid trial first, then come back."

you_give:
  - "Who the person is and the game you would play together"
  - "What you have seen them do, with dates if possible"
  - "How often and for how long you would work together"
  - "References or past dealings (optional)"
you_get:
  - "Scores for intelligence, energy and integrity, each with evidence"
  - "Flags for habits that tend to repeat"
  - "A history test of how they handle small costs and credit"
  - "A keep, test-first or walk-away call with what would change it"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Describe the person and what you would do together. Add what you have actually seen, not feelings."
  - "Add anything from other people who have dealt with them."
  - "Read integrity first, then the other two."
  - "Use the test-first plan if it says so, then bring back what happened."
output_sample:
  input:
    - Who the person is and what you would do together
    - What you have seen them do, with dates if you can
    - How long and how often you would deal with them
    - What other people say about them (optional)
  output:
    - name: The game
      contains: What you would do together, for how long, and how often you would deal with each other.
    - name: Scores
      contains: Integrity, intelligence and energy rated low, medium or high, each with something you have seen.
    - name: Flags
      contains: Habits like cynicism that tend to repeat, with what you saw.
    - name: History test
      contains: Who rounds in whose favour, who pays small costs, and what they did when fairness cost them.
    - name: One-off win risk
      contains: Whether a quick win in this deal could cost the relationship over time.
    - name: Call
      contains: Keep, test first or walk away, with a reason, a small test if needed, and what would change it.
    - name: What is unknown
      contains: The facts about the person you still do not have.
    - name: Checks missed
      contains: One line for each self-check that failed, or none.

how_it_works:
  - title: "State the game"
    text: "States what you would do together and how often."
  - title: "Score the three traits"
    text: "Scores intelligence, energy and integrity from evidence, integrity first."
  - title: "Flag cynicism"
    text: "Flags pessimism and cynicism that tend to come true."
  - title: "Test the history"
    text: "Tests how they handle small costs, credit and fairness."
  - title: "Ask about a one-off win"
    text: "Asks whether a one-off win would cost the relationship."
  - title: "Give the call"
    text: "Gives a keep, test-first or walk-away call and what would change it."
  - title: "Check it"
    text: "Runs its own checks, fixes what it can and names any it missed."

output_shape: |
  THE GAME
  <what you would do, how long, how often>

  SCORES (integrity first)
  Integrity: <low / medium / high> | Seen: <evidence>
  Intelligence: <low / medium / high> | Seen: <evidence>
  Energy: <low / medium / high> | Seen: <evidence>

  FLAGS
  - <habit> | Seen: <what>

  HISTORY TEST
  - Rounds in whose favour: <note>
  - Quietly pays small costs: <note>
  - When fairness cost them: <note>

  ONE-OFF WIN RISK
  <note>

  CALL: <keep / test first / walk away>
  Reason: <two sentences>
  Test (if any): <small test and date>
  Would change if: <what>

  WHAT IS UNKNOWN
  <list>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "The length of the game"
    how: "A ten-year deal makes the same scores look worse than a one-week job."
  - what: "Who you heard it from"
    how: "Mark each fact as seen or told. Told facts count for less."
  - what: "Your own stake"
    how: "Say what you would lose. A bigger loss tightens the call."
  - what: "Two candidates"
    how: "Run it twice and compare the scores, not the charm."

judge:
  - "Each score cites something observed, not an impression."
  - "Integrity is judged before talent."
  - "The call names what would change it."
  - "It says what is unknown about the person."
  - "Facts you heard from others are marked as told."

test:
  - "Run it on someone you have worked with for years and see if the scores match your experience."
  - "Run it on a person who burned you, with only the facts you had at the start. See if it would have warned you."
  - "Run it twice. The call should not flip between runs."

improve:
  - "Add the red flags you have learned from your own past deals."
  - "Add what you consider fair for small costs in your field."
  - "Keep a log of people you screened and how it went."
  - "Pair it with Advice skin-in-the-game checker for a person who is selling you something."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Judging advice and asking sharp questions is text work any strong chat AI does well with this skill."}
  inputs:
    - "What other people say about the person"
    - "Past deals or contracts with them"
    - "How they behaved when something went wrong"
    - "How long you plan to work together"

terms:
  - {term: "Integrity", meaning: "Doing what they said they would do, and being fair when nobody is checking."}
  - {term: "Repeated game", meaning: "A relationship where you deal with the same person many times, so trust compounds."}
