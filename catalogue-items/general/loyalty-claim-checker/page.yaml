new_slug: loyalty-claim-checker
name: "Loyalty claim checker"
summary: "Test a loyalty scheme claim before you pay for it. Paste the plan and its numbers. You get the sums checked, the costs added and a plain verdict."
job: think-and-decide
thinking: high
thinking_why: "It checks arithmetic and weighs evidence, and a slip changes the verdict."

headline: "Loyalty claim checker"
subhead: "Paste a loyalty plan or claim with its numbers. It traces the promised gain, adds the costs, checks whether heavy buyers have room to buy more and compares the same money spent on reaching more buyers. You get a plain verdict."

explain: |
  Loyalty plans often count sales that would have happened anyway and leave out the cost of rewards. Heavy buyers usually buy most of what they need from you already, so there is little to win from them.

  This skill writes down the claim and the gain, then traces where the gain comes from in the sums. It adds the costs, checks how much room your heaviest buyers have, and asks what evidence supports the claim. Then it spends the same money on reaching more buyers, using your figures, and shows the two side by side. You get a plain verdict and a list of the data you still need.

when:
  - "A vendor pitched you a loyalty scheme or a points app."
  - "Your team wants to focus on retention instead of new buyers."
  - "You need to defend or kill a plan with numbers."
not_for:
  - "You sell something people buy once or very rarely and have no repeat data: use a plain budget check with your own cost per new buyer instead."
  - "You want to split a budget between brand and sales work: use the Brand and sales budget splitter."
  - "You want to test a vendor claim that has nothing to do with loyalty or retention: use the Claim skepticism kit."

you_give:
  - "The claim or plan, with its cost and promised gain"
  - "Your numbers: buyers, repeat rate, spend, cost of reach (optional)"
  - "Where the claim came from (optional)"
you_get:
  - "A table of where the gain comes from"
  - "The costs and the room-to-buy check"
  - "A side-by-side with reaching more buyers"
  - "A plain verdict and the data to ask for"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Paste the claim as it was made, with its figures."
  - "Add your numbers for buyers, spend and cost per new buyer."
  - "Read the side-by-side and challenge any assumption."
  - "Ask for the data it lists before you commit."
output_sample:
  input:
    - The loyalty plan or claim, with its cost and the gain it promises
    - "Your numbers: buyers, repeat rate, spend per buyer, cost to reach a new buyer (optional)"
    - Where the claim came from, such as a vendor deck or case study (optional)
  output:
    - name: Claim
      contains: The claim in one sentence and the gain it promises as a number.
    - name: Where the gain comes from
      contains: Each part of the gain, the sum behind it, and any part that rests on a guess.
    - name: Costs
      contains: Rewards, discounts, systems and staff time, and the net once costs come off the gain.
    - name: Room to buy more
      contains: How much your heaviest buyers already buy from you, compared with light buyers.
    - name: Evidence
      contains: Each source marked as independent, from the seller or from another type of business, and what it shows.
    - name: Side by side
      contains: Loyalty against reaching more buyers, with the same money and the same time frame.
    - name: Verdict
      contains: Go, test small or do not do it, with the main reason.
    - name: Data to ask for
      contains: Each missing item and who could supply it, plus any checks the AI missed.

how_it_works:
  - title: "Write the claim and the gain"
    text: "Writes the claim and the gain it promises."
  - title: "Trace where the gain comes from"
    text: "Finds where the gain comes from in the arithmetic."
  - title: "Add the costs"
    text: "Lists the cost of raising loyalty or share of wallet."
  - title: "Check room to buy more"
    text: "Checks if heavy buyers have room to buy more."
  - title: "Check the evidence"
    text: "Checks where evidence from other categories or years supports it."
  - title: "Compare with reaching more buyers"
    text: "Compares with the same money spent on reaching more buyers."
  - title: "Give a verdict and the data to ask for"
    text: "Gives a plain verdict and the data to ask for."
  - title: "Checks its own work"
    text: "Goes through its checks one by one, fixes what it can and names any it still missed."

output_shape: |
  CLAIM
  <sentence> | Gain promised: <number>

  WHERE THE GAIN COMES FROM
  <part> | Sum | Assumption without a figure

  COSTS
  <item>: <amount>
  Net: <gain minus cost>

  ROOM TO BUY MORE
  <heavy buyers' share, light buyers' share, verdict>

  EVIDENCE
  <source> | independent / seller / other type of business | shows <...> | does not show <...>

  SIDE BY SIDE
  Loyalty: <result> | Reach: <result> | Same money, same period

  VERDICT
  <go / test small / do not do> because <reason>

  DATA TO ASK FOR
  <item> from <who>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "Your numbers"
    how: "Real repeat rate and cost of reach change the verdict most."
  - what: "The time frame"
    how: "Use the same window for both plans."
  - what: "The category"
    how: "Say how often people buy. Rare purchases leave little room for loyalty."
  - what: "Evidence"
    how: "Paste the case study itself, not a summary."

judge:
  - "The gain is split into parts with sums."
  - "Costs include rewards given to people who would have bought anyway."
  - "The same money and period are used for both plans."
  - "The verdict is one plain sentence."
  - "Every number comes from you."

test:
  - "Run it on a scheme you already ran and compare with your actual results."
  - "Change one assumption and see if the verdict flips."
  - "Ask a finance-minded colleague to check the sums."

improve:
  - "Add your cost per new buyer to the skill so it is always used."
  - "Add a list of your past schemes and results."
  - "Save each verdict to compare with outcomes."
  - "Pair it with \"Claim skepticism kit\" for vendor claims."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Sorting and weighing written facts is text work any strong chat AI does well with this skill."}
    - {name: "A spreadsheet", why: "Keeping the sums in cells lets you change one assumption and see the result."}
  inputs:
    - "A sales export for the last year"
    - "Your cost per new buyer"
    - "The vendor's proposal"

terms:
  - term: "Share of wallet"
    meaning: "The portion of a buyer's spending in a category that goes to you."
  - term: "Light buyer"
    meaning: "Someone who buys in your category rarely."
