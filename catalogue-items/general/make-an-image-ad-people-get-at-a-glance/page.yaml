new_slug: make-an-image-ad-people-get-at-a-glance
name: "An image ad people understand at a glance"
summary: "Give it your ad brief. You get one clear point for the image, the reading order, and a picture brief."
job: make-image-ads

headline: "An image ad people understand at a glance"
subhead: Give it your ad script or brief and your product facts. It picks the one point an image can carry, sets what the eye reads first, second and third in 20 words or fewer, moves the rest into the text above, and writes a brief for the picture.

explain: |
  An image ad has no sound, no set order and about a second of attention. Most image ads fail because they try to fit a whole video script onto one picture: five claims at the same size, a slogan, a price and a list of features. Nobody reads it, so nobody remembers it.

  This skill makes the image carry one point: an offer, one proof or one contrast. Eye-tracking research on print ads found the picture pulls the eye whatever its size, while words get read only as they get bigger. So the picture carries the point where it can, the biggest words pick out the right person, a second line gives the promise, and the smallest gives the offer and what to do. Everything else goes into the main text above, in the script's order. A blur test and a two-second test check the result.

when:
  - You have a video script or a brief and need an image ad version of it.
  - Your image ads are crowded with words and nobody seems to read them.
  - You want an offer, a single proof point or an old-way-versus-new-way comparison in one picture.

you_give:
  - The script or brief (the reason to buy, the steps of the argument, who it's for, and which point this ad is about)
  - Product facts (how it looks, how it's used, what a result may show)
  - Your claims, offer terms and guarantee, exactly as you run them
  - Your customers' own words for the problem (optional)
  - Whether the image should carry no words, and whether it should look like a plain post or a designed ad (optional)
you_get:
  - The one point and the reading order, with exact words and word counts
  - A brief for the picture (what's in it, where the product and words sit, the look)
  - The main text above the image, with the first sentence's character count
  - The line under the image, the button, and a source for every number and offer term

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your script or brief and say which point this ad is about, or let it choose.
  - Paste your product facts, claims and the exact offer and guarantee terms.
  - Add a few customer phrases from reviews, if you have them.
  - Check the sources list at the end before the ad goes to a designer or an image tool.

how_it_works:
  - title: Picks one point
    text: An image makes one claim. It carries an offer, one proof or one contrast. The rest goes to the main text and the landing page.
  - title: Lets the picture lead
    text: The picture is seen first whatever its size, so it shows the problem, the product at work or the two ways side by side.
  - title: Sizes the words by job
    text: The first read picks out the person, the second gives the promise, the third gives the offer and the action. 20 words or fewer in all.
  - title: Writes the main text
    text: The steps the image left out, in the script's order. It opens with a sentence of 125 characters or fewer that doesn't repeat the image headline.
  - title: Makes the openers agree
    text: Image headline, first line of the main text and the line under the image make the same claim in different words.
  - title: Runs two quick checks
    text: Blur the layout and the picture should still be the biggest shape. Show it for two seconds and someone should be able to say the claim.

output_shape: |
  1. POINT AND READING ORDER
  The one point: <offer | proof | contrast>
  The picture: <what it shows>
  First read:  "<words>" (<n> words)
  Second read: "<words>" (<n> words)
  Third read:  "<words>" (<n> words)

  2. IMAGE WORDS: <total> words

  3. PICTURE BRIEF
  Look: <plain post | designed>, 4:5
  <what's in the picture, where the product sits, where each line goes>

  4. MAIN TEXT
  <first sentence> (<n> characters)
  <the points the image left out, in order>

  5. LINE UNDER THE IMAGE: "<...>" (<n> characters)   BUTTON: <...>

  6. SOURCES
  "<number, quote or offer term>": <where it comes from>
  MISSING: <...>

example:
  business: sprout
  input: |
    [the skill]

    Script: the powder quitter. They've quit greens powders and pill
    stacks because they couldn't stick with them. Sprout is greens
    you eat. This ad's point: old way vs new way.

    Product facts: pouch of 28 daily packs. Tear one open across the
    top, pour the small handful of green gummy bears into your palm.
    No water, no mixing, no shaker. 60+ ingredients, 21 vitamins &
    minerals, 6 g fiber per pack. About 100% of daily value for
    vitamins, about 25% for minerals (per pack).

    Claims OK: "95% of users take [Sprout] at least 4-6x per week with
    80% taking daily" (always "of surveyed users", 3,000+ customers).
    Offer: subscription $49.99 every 4 weeks, "Pause Or Cancel Any
    Time". $29.99 first order only with the text sign-up discount.
    Guarantee: 30-day money-back, first order only.

    Customer words: "[Sprout] has been the one thing I've been able
    to stick to." / "not having to clean a shaker bottle"
  output: |
    1. POINT AND READING ORDER
    The one point: contrast, the powder you quit vs a pack you eat
    The picture: old way beside new way
    First read:  "The one thing I've been able to stick to."
                 (9 words, a customer's words, in quote marks)
    Second read: "No shaker. No mixing." (4 words)
    Third read:  "30-day money-back on your first order" (6 words)

    2. IMAGE WORDS: 19 words

    3. PICTURE BRIEF
    Look: plain post, 4:5. A real kitchen counter in daylight, shot
    like a phone photo. Left: a half-used tub of greens powder, no
    label, and a shaker bottle with green residue. Right: one Sprout
    daily pack torn straight across its top edge, green gummy bears
    poured into an adult's palm. Quote across the top third, second
    read under it, third read small at the bottom. No face. Blur
    check: the two halves of the counter are the biggest shapes,
    then the quote.

    4. MAIN TEXT
    The problem with greens powder was never the nutrition. It was
    sticking with it. (opener: 80 characters)
    Sprout is greens you eat. One daily pack, a small handful of
    gummy bears: 60+ ingredients, 21 vitamins & minerals and 6g fiber.
    No water, no shaker, no counter to wipe.
    Worried a gummy can't hold enough? One pack gives about 100% of
    your daily value for vitamins and about 25% for minerals.
    95% of surveyed users take it at least 4-6x per week, 80% daily.
    $49.99 every 4 weeks. Pause or cancel any time. 30-day
    money-back guarantee on your first order.

    5. LINE UNDER THE IMAGE: "Greens you'll stick with" (24)
       BUTTON: Shop now

    6. SOURCES
    "The one thing I've been able to stick to": review 1, brand site
    "No shaker. No mixing.": product facts (no water, no mixing,
      no shaker)
    "30-day money-back on your first order": FAQ, first order only
    60+ / 21 / 6g, 100% and 25% of daily value: science page, per pack
    95% / 80%: brand survey of 3,000+ customers, "of surveyed users"
    $49.99, "Pause or cancel any time": product page plan box
    Not used: $29.99. It needs the text sign-up discount. If you use
      it, say so and give the $49.99 renewal in the same sentence.

tweaks:
  - what: Which point the ad makes
    how: Say "offer", "proof" or "contrast". An offer ad puts the real price and terms in the third read; a proof ad builds the whole image around one number with its source.
  - what: No words on the image
    how: Say "no words on the image" and the picture does the first read alone, by showing the problem or the comparison plainly. The opening moves to the first sentence of the main text.
  - what: Plain post or designed
    how: Ask for a plain-post look for people who don't know you yet, or a designed look with your colours for people who already do.
  - what: Customer words
    how: Paste a few review lines. The first read then uses the customer's word for the problem. Without them, it writes from the product and marks the script "inferred".

judge:
  - The image makes one claim, not three of the same size.
  - Count the words on the image. 20 or fewer, and the biggest line 10 or fewer.
  - Blur the picture. The biggest shape should be the picture, then the first read.
  - Every number, quote and offer term has a source in the last section.
  - No generated person is presented as a customer, founder or expert, and no child appears.

test:
  - Run it on a script you already turned into an image ad that worked. Compare the point it picks with the one you used, and read its reason if they differ.
  - Run it twice on the same script. It should pick the same point both times. If it changes, tell it which kind you want.
  - Count the image words yourself, 20 or fewer in total and 10 or fewer in the biggest line.
  - Once the image is made, show it to someone for two seconds, then hide it. Ask what the ad was about. If they can't say, the first read is wrong.

improve:
  - List your usual offer, proof and contrast in step 1 of the skill file, with the fact each one rests on, so every run picks from points you can back.
  - Add your offer terms, exactly as written, to the third read in step 2, so the conditions always sit next to the price.
  - Set your default look in step 4, a plain post for people who don't know you or designed with your colours for people who do.
  - Add a list of your customers' exact words for the problem to "What you need", so the first read can use them.
  - Pair it with the skill that turns an approved image plan into a prompt, and the carousel skill when one image can't hold the argument.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Choosing the point and writing the words works the same in any strong chat AI."}
    - {name: "Canva", why: "Sets your three reads as real text over the picture, so you can resize and blur-check them."}
    - {name: "Meta Ads Manager", why: "Its placement previews show whether text sits clear of the buttons in Feed, Stories and Reels."}
  inputs:
    - "The video script or brief this ad comes from, so the main text keeps its order"
    - "Ten real review lines, so the first read can use a customer's word"
    - "Your live offer page as text, so terms are copied and not remembered"
    - "Your best image ad so far, so the new one has something to beat"

terms:
  - term: Reading order
    meaning: What the eye lands on first, second and third in an image, set by size and contrast.
  - term: Main text
    meaning: The words above the image in a Facebook or Instagram ad.
  - term: Plain-post look
    meaning: An ad image made to look like a normal photo or post, not like an ad.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
