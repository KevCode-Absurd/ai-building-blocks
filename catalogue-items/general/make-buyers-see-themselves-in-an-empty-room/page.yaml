new_slug: make-buyers-see-themselves-in-an-empty-room
name: "An empty-room photo that tells your buyer's story"
summary: "Give it your ad's story. You get the room, the objects and the light, and a prompt for the photo."
job: make-image-ads

headline: "An empty-room photo that tells your buyer's story"
subhead: Give it your story ad. It picks the room where the change shows, two or three objects that tell it (a cold coffee, a pillow on the sofa, a second alarm clock), the hour and its light, and writes a prompt for a plain doorway photo.

explain: |
  Some problems change how people live more than how they look: sleep, energy, routines, the morning rush. A photo of a sad person at a window is a cliché and reads as an ad. An empty room with the evidence left in it works better, because the reader fills in the missing person, and the person they picture is themselves.

  The skill takes the room from your story and research, then names two or three objects that show what changed, like a full mug gone cold beside one bitten slice of toast. It sets the hour and the light that hour gives, and briefs a phone photo from the doorway, slightly tilted, with real clutter and a little noise in the dark areas. Nobody is in the frame, nothing suggests harm or an emergency, and there's no second, happier photo.

when:
  - Your buyer's problem changes their routine, sleep or home life more than their appearance.
  - You want an emotional picture without a staged sad face.
  - Your story mentions what the room looked like because of the problem.

you_give:
  - Your approved story ad, with the changed-life detail in its opening
  - What changed in how buyers live, in their words (optional)
  - Your brand's places, light and anything you never show (optional)
you_get:
  - The room, the hour and the light
  - Two or three objects that tell the story
  - The headline to run under the image, and flags on anything inferred
  - A 60 to 120 word image prompt, ready to paste

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad underneath. The room and its objects should be in the opening lines.
  - Add what customers say changed in their lives, if you have reviews or notes.
  - Paste the image prompt into your image tool. If the room looks like a hotel or a catalogue, ask again with more clutter.
  - Read the flags. Anything marked inferred should be checked against what buyers say.

how_it_works:
  - title: Sets the ground rules
    text: Square, looks taken on a phone, no logo, price, button, brand colour or product, and nobody in frame.
  - title: Finds the changed room
    text: Takes the room from your story and research, and names two or three objects that show what changed.
  - title: Sets the hour
    text: Names the time and the light it gives, like a hallway lamp at 2am or bright sun after the school run.
  - title: Shoots from the doorway
    text: A phone photo, slightly tilted, with a little noise in the dark areas.
  - title: Adds real clutter
    text: A mug, a remote, shoes. Nothing styled.

output_shape: |
  SCENE
  <one sentence: what someone scrolling would say they saw>

  WHERE AND WHEN
  <place, time of day, what is within reach>

  THE ROOM AND HOUR
  <the room seen from the doorway, the time, the light>

  THE 2 OR 3 OBJECTS
  <each object that tells the change>

  REAL CLUTTER
  <ordinary things around them, nothing styled>

  WORDS ON THE IMAGE
  None.
  HEADLINE UNDER THE IMAGE
  <"The reason you..." or "Why your ... ended up ...">

  FLAGS
  <anything inferred, and where it came from>

  IMAGE PROMPT
  <60 to 120 words, ready to paste>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on review 15):
    By 8:15 the kitchen is empty. Two cereal bowls in the sink, a
    lunchbox lid left on the counter, and at my place, a full mug of
    coffee gone cold and a slice of toast with one bite out of it.
    That was my breakfast most school days.
    Now I grab a Sprout pack on the way out. Tear the top, eat the
    small handful of gummies on the way. 21 vitamins and minerals,
    6 g prebiotic fiber. Or as one mum put it: "So easy to grab and
    eat on my way to the billion things I have to do as a mom."

    Buyer: the busy parent, 30 to 45, mostly mums.
    Brand look: bright, sunny, real homes. Never clinical.
  output: |
    SCENE
    An empty kitchen after the school run, with a full mug of coffee
    and a bitten slice of toast left at one place.

    WHERE AND WHEN
    A family kitchen, about 8:15am, bright sun through the window.
    Within reach: the table, the counter, the sink.

    THE ROOM AND HOUR
    Kitchen seen from the doorway, just after everyone has left.
    Warm morning sun across the table, lights off.

    THE 3 OBJECTS
    A full mug of coffee gone cold, a faint skin on top.
    A slice of toast on a plate with one bite out of it.
    A lunchbox lid left on the counter, its box gone.

    REAL CLUTTER
    Two cereal bowls in the sink, a hair tie and a school letter on
    the table, a chair pushed back at an angle.

    WORDS ON THE IMAGE
    None.

    HEADLINE UNDER THE IMAGE
    Why your breakfast ended up cold on the counter.

    FLAGS
    Inferred: the cold coffee and the toast come from the story, not
    from customer research. Review 15 backs the rush in a mum's own
    words, but not these objects. Check this is a morning real buyers
    describe before it runs.
    No children in frame. The bowls and lunchbox lid are objects
    only.

    IMAGE PROMPT
    Square 1:1 phone photo taken from a kitchen doorway at about
    8:15am, slightly tilted, bright morning sun across the table,
    lights off, a little noise in the shadows. Nobody in the room. At
    one place on the table, a full mug of coffee gone cold with a
    faint skin on top, and a plate with a slice of toast with one
    bite out of it. A lunchbox lid left on the counter. Two cereal
    bowls in the sink, a hair tie and a school letter on the table, a
    chair pushed back. Lived-in, not styled. No person, no children,
    no logo, no product, no text.

tweaks:
  - what: Which room
    how: Ask for "the bedroom at 2am" or "the hallway by the front door" instead, if that's where your buyer's change shows. The room should be the one your buyer would recognise first.
  - what: The objects
    how: Name the two or three you want from your research. More than three turns it into clutter with no story.
  - what: The hour
    how: The light does a lot of the feeling. Grey early light reads as "after a bad night"; bright sun on an empty table reads as "everyone left without me".
  - what: How tidy
    how: If the picture comes out too clean, ask for specific clutter (shoes, a remote, a charger). Hotel-clean rooms look like ads.

judge:
  - Nobody is in the frame, and nothing suggests harm, an accident or an emergency.
  - The objects tell the change without a caption.
  - It looks lived-in, with real clutter, not styled.
  - Nothing says whose house it is.
  - There's no product, and no second, happier photo.

test:
  - Show the picture to someone who fits your buyer and ask what happened in this room this morning. If they can tell the story back, the objects work.
  - Run it twice on the same story. The room and the objects should stay the same.
  - Run it on a story with no changed room. It should send you to the everyday snapshot instead of inventing a room.
  - Test it against a snapshot with a person in it. Some buyers respond to the empty room, some to the face.

improve:
  - Add what buyers say changed at home, in their own words, to the brand file section. Those details become the objects and stop the inferred flags.
  - Add your brand's light and time of day to step 3, so the hour matches your look.
  - Add the objects your brand never shows (medicine, mess, bins) to the ground rules in step 1.
  - Write the objects into your story's first lines, so the reader can match picture and text at once.

terms:
  - term: Story ad
    meaning: An ad whose main text tells one person's story in their own words, like a post from a friend.
  - term: Inferred
    meaning: Taken from the story or a guess, not from buyer research. Check it before it runs.
  - term: Headline under the image
    meaning: The bold line under the picture in a Facebook or Instagram ad.
