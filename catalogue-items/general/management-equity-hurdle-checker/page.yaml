new_slug: management-equity-hurdle-checker
name: Management equity hurdle checker
headline: Management equity hurdle checker
summary: Check what management earns above a fixed equity hurdle. Give it your incentive terms and equity value. You get the vested payout and any shortfall.
job: money-and-investing
thinking: high
thinking_why: "The hurdle is a threshold on equity value, so the order of claims and the vested share must be read from the signed terms."
subhead: Give it your signed incentive terms and the equity value. It takes the hurdle off the equity value, then applies the participation and vesting percentages. You get the payout, what is left for others, and any shortfall.
explain: |-
  Many private equity incentive plans pay management only on equity value above a fixed hurdle. This skill checks the arithmetic of that payout against signed award terms. It does not say whether the terms apply.

  Illustrative figures only, not a real deal. Equity of 160 less a hurdle of 100 leaves 60. At 10% participation and 75% vesting, management is paid 60 x 10% x 75% = 4.5. Equity of 80 is below the hurdle, so management is paid zero.
when:
  - You need to know what management earns above a fixed equity hurdle.
  - A deal team wants to check a private equity incentive plan.
  - A reviewer must trace the payout back to its inputs.
  - Equity value moves and you want to see when the hurdle is met.
not_for:
  - "Your hurdle has a catch-up, ratchet, option exercise price or leaver forfeiture: ask a legal or tax adviser, because this checker leaves those out."
  - "You need a tax, employment or fair-value accounting view: use an accountant or tax adviser."
  - "You need legal advice on whether the award terms apply: ask a lawyer who has read the signed documents."
  - "You need shares or cash swapped at a fixed exchange ratio: use the Fixed share-swap payout calculator instead."
  - "You need a seller's cash and ownership after rolling proceeds into the buyer's equity: use the Seller rollover ownership calculator instead."
you_give:
  - Your signed incentive terms.
  - Net equity value left to share out, with its date.
  - The fixed senior hurdle amount.
  - Management participation percentage.
  - Vested percentage.
you_get:
  - The vested management payout.
  - The equity value left for other holders.
  - The hurdle shortfall, if equity value is below the hurdle.
  - An editable spreadsheet with your inputs and formulas.
  - A list of missing inputs and checks that did not run.
how_to_use:
  - Download the pack and open it in an AI that can work with files.
  - Share your incentive terms, equity value, hurdle, participation and vesting. Add the currency and scale.
  - "Ask your AI to follow SKILL.md. Example: equity 160, hurdle 100, participation 10%, vested 75% gives 4.5."
  - Let it build and recalculate the spreadsheet. Running the script needs Node.js 20 or later.
  - Read the assumptions, reconciliations and the CHECKS MISSED line before you rely on the result.
output_sample:
  input:
    - Your signed incentive terms
    - Net equity value left to share out, with its date
    - The fixed senior hurdle amount
    - Management participation percentage and vested percentage
    - Reporting date, currency and scale
  prerequisites:
    - An AI that can create and open spreadsheet files
    - Node.js 20 or later, only if you want the bundled calculation script run
  output:
    - name: Vested management proceeds
      contains: What management is paid after the hurdle, using the participation and vested percentages.
    - name: Senior residual
      contains: The equity value left for other holders after the management payout.
    - name: Hurdle shortfall
      contains: How far equity value falls below the hurdle, shown as zero payout to management.
    - name: Editable workbook
      contains: A spreadsheet with inputs, formulas and checks that you can change and recalculate.
    - name: Scope and dated sources
      contains: Where each input came from, with its date, currency and scale.
    - name: Reconciliations
      contains: A check that management payout plus other-holder residual equals the equity value above the hurdle and below it.
    - name: MISSING and CHECKS MISSED
      contains: Inputs not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: Checks the terms
    text: Confirms management shares only above a fixed money hurdle, with no catch-up or ratchet, and keeps purchased rollover equity apart.
  - title: Works the payout
    text: Equity less the hurdle, floored at zero, times participation, then times the vested fraction.
  - title: Reconciles
    text: Management payout plus the other holders' residual must equal the equity. An unmet hurdle and unvested interests are flagged apart.
output_shape: |-
  Vested management proceeds, senior residual and hurdle shortfall.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING lines
  CHECKS MISSED
tweaks:
  - what: "Equity value date"
    how: "Take the equity value date from the incentive terms and the net equity value. Use one currency and scale on every line."
  - what: "Net equity value"
    how: "Change the net equity value and have your AI recalculate. Keep the actual figures you supplied."
judge:
  - Hurdle is an equity-value threshold after debt and prior claims.
  - Purchased rollover proceeds are not included again as free management participation.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one management payout you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define equity hurdle into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
