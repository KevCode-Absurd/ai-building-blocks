new_slug: management-fee-stepdown-checker
name: Management fee stepdown checker
headline: Management fee stepdown checker
summary: Compare a fund's quarterly management fee before and after the fee basis and rate change, with a bridge that shows what moved the fee.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it your fund's fee clauses, the commitment before the stepdown, the invested amount after it, both annual rates and the part of a year. It works out one quarter's fee on each basis. You get both fees and the difference between them.
explain: |-
  Many private funds charge a management fee on what you promised to invest during the early years. After a set date the fee steps down. It then runs on a smaller basis, such as the money actually invested, and often at a lower rate. This management fee stepdown checker compares the two fees for a quarter, so you can check the bill after the change.

  Each fee is the basis times the annual rate times the share of a year. The before fee uses your commitment. The after fee uses the invested amount your agreement allows, which is not always the fund's NAV. Both use the same quarter, so the two fees are fair to compare. The difference is split into the part from the smaller basis and the part from the lower rate. It is a one-quarter bridge. It is not a saving you can book for the year.

  Practice numbers: a basis of 100 at 2% for a quarter costs 0.5. After the stepdown, an eligible basis of 60 at 1.5% costs 0.225. The difference is 0.275. If the eligible basis were 80, the after fee would be 0.3 and the difference 0.2.
when:
  - Your fund's fee has just stepped down, and you want to check the new quarterly charge against the agreement.
  - You are about to invest in a fund and want to see how the stepdown changes the fee.
  - A fee notice shows a new basis and you cannot tell how the number was reached.
  - Your finance team asks what the stepdown saves over one quarter.
not_for:
  - "Fees are reduced by portfolio fees the manager collected: use the Fund management fee offset checker."
  - "You want a full check of every fee line on a fund: use the Private fund fee and offset checker workflow."
  - You need fee waivers, offsets or a fee that changes day by day inside the quarter. This skill compares two whole quarters. Split a part quarter into separate periods first.
  - You want to know what the fee base should legally be. A fund lawyer must read the agreement.
you_give:
  - The fee clauses from the limited partner agreement, including the stepdown date (from the agreement)
  - The commitment basis before the stepdown (from the agreement or capital account statement)
  - The invested basis after the stepdown, as the agreement defines it (from the fund's records)
  - The annual fee rate before and after, such as 2% and 1.5% (from the agreement)
  - The part of a year for the quarter, usually 0.25
  - The currency and units, such as USD millions
you_get:
  - The quarterly fee before the stepdown
  - The quarterly fee after the stepdown
  - A bridge of the difference between the two
  - A check that both fees use the same period
  - A list of missing facts and checks it could not run
  - A small workbook with the same sums, if your AI can make files
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. A chat is enough. You do not need to run code.
  - "Paste the fee clauses and the numbers: the two bases, the two rates, the stepdown date and the part of a year. Say the currency and the units."
  - Say whether any fee waiver applies. Waivers are shown on their own line and left out of the sums.
  - Check one fee yourself. It is the basis times the annual rate times the part of a year.
  - Read MISSING and CHECKS MISSED before you use any figure.
  - Ask for a workbook only if your AI can make files.
how_it_works:
  - title: Reads the stepdown terms
    text: Finds the stepdown date, the investments the new basis leaves out and each rate. Fee waivers are kept apart.
  - title: Computes the before fee
    text: Multiplies the commitment basis by the before rate and the part of a year.
  - title: Computes the after fee
    text: Multiplies the eligible invested basis by the after rate and the same part of a year.
  - title: Builds the bridge
    text: Shows the difference as a one-quarter bridge, not a booked yearly saving.
  - title: Marks the gaps
    text: Writes MISSING for any number you did not give and lists any check it could not run. It never fills a gap with zero.
output_shape: |-
  RESULT
  Fee before <amount> | Fee after <amount> | Difference <amount>

  FEE BRIDGE
  <before fee, effect of the smaller basis, effect of the lower rate, after fee>

  SCOPE AND SOURCES
  <stepdown date, period, currency and units; source and date for each input>

  INPUTS AND ASSUMPTIONS
  <commitment basis, invested basis and what it excludes, both rates, part of a year, waivers>

  CALCULATIONS AND TIES
  <each fee with its figures, and the check that both use the same period>

  FILE CHECK
  <what was recalculated in the workbook, or "no workbook made">

  MISSING
  <list>

  CHECKS MISSED
  <one line per check not done, or none>
output_sample:
  input:
    - The fee clauses and stepdown date from the fund agreement
    - The commitment basis and the invested basis
    - The annual fee rate before and after the stepdown
    - The part of a year, such as 0.25 for a quarter
  prerequisites:
    - The limited partner agreement or a fee schedule from it
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: RESULT
      contains: The quarterly fee before the stepdown, the fee after it and the difference.
    - name: FEE BRIDGE
      contains: How the fee moves from before to after, split into the basis effect and the rate effect.
    - name: SCOPE AND SOURCES
      contains: The stepdown date, period, currency and units, with the source of each input.
    - name: INPUTS AND ASSUMPTIONS
      contains: Each number you gave it and each assumption, including any waivers kept apart.
    - name: CALCULATIONS AND TIES
      contains: Each fee shown with its figures, and the check that both use the same period.
    - name: FILE CHECK
      contains: What was recalculated in the workbook, or a note that none was made.
    - name: MISSING
      contains: Every number it needed and did not get. It never fills one with zero.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
tweaks:
  - what: A different invested basis
    how: Change the eligible basis alone. Only the after fee and the difference move.
  - what: A lower or higher rate after the stepdown
    how: Change the after rate. The before fee stays put.
  - what: A part quarter
    how: Split it into two periods with their own year fractions and run each one.
judge:
  - Post-stepdown basis is supplied from actual contractual records, not automatically NAV.
  - Fees apply to comparable periods; partial-quarter timing needs explicit split periods.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can do these sums in a chat.
    - name: An AI that can make spreadsheet files
      why: It can build the workbook, recalculate it and check that it reopens.
    - name: Node.js 20 or later (optional)
      why: Runs the small script that comes with the skill, for a second check of the numbers.
  inputs:
    - The fee and expenses pages of the limited partner agreement
    - The fund's latest fee notice or capital account statement
    - A named reviewer, such as your fund lawyer or accountant
terms:
  - term: Stepdown
    meaning: A set date after which the management fee drops, often by a lower rate or a smaller basis.
  - term: Commitment basis
    meaning: The total amount you promised to invest, which the early fee is charged on.
  - term: Invested basis
    meaning: The money actually put into investments, as the agreement defines it.
  - term: Limited partner agreement (LPA)
    meaning: The contract between the fund manager and the investors.
  - term: Year fraction
    meaning: The part of a year the fee covers. A quarter is 0.25.
