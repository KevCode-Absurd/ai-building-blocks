new_slug: manufacturing-yield-cost-bridge
name: Manufacturing yield cost bridge
headline: Manufacturing yield cost bridge
summary: Work out the true cost per good kilogram of one production batch after yield loss, conversion cost and scrap sales, with a clear bridge.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it one batch's input kilograms, how much came out good, what the input and the making cost, and the price you really got for scrap. It splits the batch into good output and scrap. You get the net batch cost and the cost per good kilogram.
explain: |-
  When you make something, not everything that goes in comes out as a good product. Some becomes scrap. You still paid for it. This manufacturing yield cost bridge shows what a good kilogram really costs once you count that loss, the cost of making it and any money back from selling the scrap.

  The batch is split into good kilograms and scrap kilograms, and the two must add up to what went in. Input cost and conversion cash are added together. Only scrap you have a real price for is counted, and it comes off the cost once. It is not also added as revenue. The net batch cost is then divided by good kilograms only, so every lost kilogram is paid for by the good ones.

  Practice numbers: 1,000 kg goes in and 80% comes out good, so 800 kg is good and 200 kg is scrap. Input costs 2,000 and making it costs 1,000. Scrap sells at 0.50 a kilogram, which brings back 100. Net batch cost is 2,900. Cost per good kilogram is 3.625. If yield falls to 70%, the net cost is 2,850, good output is 700 kg and the cost per good kilogram is 4.07.
when:
  - A batch came out with less good product than planned, and you want to know what each good kilogram cost.
  - You are setting a price and need the real cost per kilogram, not the cost of the raw material.
  - You want to see how much a drop in yield from 80% to 70% costs on one batch.
  - A supplier or plant manager quotes a yield and you want the cost bridge behind it.
not_for:
  - "You want to choose which products to make given limited machine time: use the Product mix capacity checker."
  - "You want to follow raw material price changes into your selling price: use the Raw material price impact calculator."
  - You need cost for tax or company accounts, which have their own rules. This skill does not value inventory.
  - You have many batches or a forecast for the year. This skill prices one batch at a time.
you_give:
  - The kilograms that went into the batch (from your production record)
  - The good output, as a yield such as 80% or as kilograms (from the quality check)
  - The cost of the inputs (from supplier invoices)
  - The conversion cash, meaning labor, energy and other cash used to make the batch (from your cost records)
  - The price you can show for scrap, with proof such as a buyer quote (optional)
  - The period, currency and units, such as USD
you_get:
  - Good kilograms and scrap kilograms, which add up to the input
  - The money back from scrap
  - The net batch cost, input plus conversion less scrap
  - The cost per good kilogram
  - A check that good plus scrap equals input and that scrap money is counted once
  - A list of missing facts and checks it could not run
  - A small workbook with the same sums, if your AI can make files
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. A chat is enough. You do not need to run code.
  - "Paste the batch facts: input kilograms, yield or good kilograms, input cost, conversion cash and the scrap price if you have proof of one. Say the currency and the period."
  - Say if scrap has no buyer. Then the scrap price is left out, not set to zero, and the result says so.
  - Check one number yourself. Cost per good kilogram is the net batch cost divided by the good kilograms.
  - Read MISSING and CHECKS MISSED before you use any figure.
  - Ask for a workbook only if your AI can make files.
how_it_works:
  - title: Lists your sources
    text: Notes the quantities, units, dates and any contract terms, and flags evidence gaps.
  - title: Splits the batch
    text: Reconciles input kilograms to good output and scrap. It does not guess if scrap can be sold or at what price.
  - title: Values the scrap
    text: Counts only scrap with evidence of a price. That money comes off input plus conversion cash, once.
  - title: Finds the unit cost
    text: Divides net batch cost by good kilograms and shows how the cost moves if yield is lost.
  - title: Marks the gaps
    text: Writes MISSING for any number you did not give and lists any check it could not run. It never fills a gap with zero.
output_shape: |-
  RESULT
  Good kg <amount> | Scrap kg <amount> | Net batch cost <amount> | Cost per good kg <amount>

  COST BRIDGE
  <input cost + conversion cash = gross batch cost; less scrap money = net batch cost; divided by good kg>

  SCOPE AND SOURCES
  <batch, period, currency and units; source and date for each input>

  INPUTS AND ASSUMPTIONS
  <input kg, yield, input cost, conversion cash, scrap price and its proof>

  CALCULATIONS AND TIES
  <each sum with its figures, and the checks that good plus scrap equals input and scrap money is counted once>

  FILE CHECK
  <what was recalculated in the workbook, or "no workbook made">

  MISSING
  <list>

  CHECKS MISSED
  <one line per check not done, or none>
output_sample:
  input:
    - Input kilograms and good output or yield for one batch
    - The cost of the inputs and the conversion cash
    - A scrap price with proof, if scrap has a buyer (optional)
    - Your production record and supplier invoices (optional)
  prerequisites:
    - A finished batch with quantities measured in one unit
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: RESULT
      contains: Good kilograms, scrap kilograms, net batch cost and cost per good kilogram.
    - name: COST BRIDGE
      contains: Input cost plus conversion cash, less scrap money, divided by good kilograms.
    - name: SCOPE AND SOURCES
      contains: The batch, period, currency and units, with the source and date of each input.
    - name: INPUTS AND ASSUMPTIONS
      contains: Each number you gave it and each assumption, kept apart from facts.
    - name: CALCULATIONS AND TIES
      contains: Each sum shown with its figures, and the checks that quantities and scrap money tie.
    - name: FILE CHECK
      contains: What was recalculated in the workbook, or a note that none was made.
    - name: MISSING
      contains: Every number it needed and did not get. It never fills one with zero.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
tweaks:
  - what: A lower yield
    how: Change the yield only. Good kilograms fall, scrap rises and cost per good kilogram goes up.
  - what: No buyer for scrap
    how: Leave the scrap price out. Money back from scrap is shown as not confirmed, and cost per kilogram is higher.
  - what: A cheaper or dearer input
    how: Change the input cost. Conversion cash and yield stay put.
judge:
  - Each material input is sourced with currency, scale, sign and period.
  - Actual records and scenarios remain separate; missing evidence is not zero.
  - Yield is greater than zero and at most one; input mass and output mass use consistent units.
  - Good output plus scrap equals input mass; scrap proceeds are not counted twice as both revenue and cost reduction.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can do these sums in a chat.
    - name: An AI that can make spreadsheet files
      why: It can build the workbook, recalculate it and check that it reopens.
    - name: Node.js 20 or later (optional)
      why: Runs the small script that comes with the skill, for a second check of the numbers.
  inputs:
    - The production record for the batch, with weights
    - Supplier invoices for the inputs and your cost records for labor and energy
    - A buyer quote or invoice for scrap
terms:
  - term: Yield
    meaning: The share of what goes in that comes out as good product.
  - term: Scrap
    meaning: Material from the batch that is not good product.
  - term: Conversion cash
    meaning: The cash spent to turn inputs into product, such as labor and energy.
  - term: Net batch cost
    meaning: Input cost plus conversion cash, less money back from scrap.
  - term: Cost per good kilogram
    meaning: Net batch cost divided by the good kilograms only.
