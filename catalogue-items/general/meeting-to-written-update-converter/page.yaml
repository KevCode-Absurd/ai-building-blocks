new_slug: meeting-to-written-update-converter
name: "Meeting to written update converter"
summary: "Turn a recurring status meeting into a short written update. Get each agenda item sorted, the hours saved, a template and a two-week trial."
job: organise-work
thinking: low
thinking_why: "It sorts a given agenda and designs a short template from it."

headline: "Meeting to written update converter"
subhead: "Paste a recurring meeting's purpose, agenda, attendees and a recent set of notes. It sorts each item into report, decide, solve or social and counts the hours the meeting costs. You get a written update to replace the report parts, a template, the shorter meeting that stays and a two-week trial."

explain: |
  The weekly status meeting is six people listening to one person read. Everyone agrees it is too long. Nobody cancels it, because somewhere in it a decision gets made. Many teams now keep the report parts in writing and save the room for the few things that need one.

  This prompt sorts your agenda into four kinds of item: report, decide, solve or social. It checks each label against what was said last time, so the sort rests on the notes and not on the agenda. It counts the cost in hours per month and shows every sum, so you can check them. Then it designs the written update, with who writes it, when, where, a word limit and how questions get asked.

  The decide and solve items stay in a shorter meeting with fewer people. The social part gets a new home so it is not lost by accident. It ends with a template with headings and word limits, and a two-week trial with something to measure.

when:
  - "A weekly meeting has grown to an hour and most of it is updates."
  - "Your team is spread across time zones and the live meeting leaves someone out."
  - "You want to cancel a meeting but are afraid of losing the one decision it makes."
  - "People say they leave a meeting with nothing decided, and you want to find which items cause it."

not_for:
  - "The meeting is mostly live talk, such as an interview, a coaching one-on-one or an incident call: keep it as a call."
  - "You have a long list of meetings and approvals to cut: use the Process and meeting cleanup planner."
  - "You only have rough notes from one meeting and want minutes: use the Rough-note meeting minutes writer."
  - "A decision keeps slipping and you want one meeting to settle it: use the Decision debate meeting planner."

you_give:
  - "The meeting's purpose, how often it runs, how long it lasts, who attends and the usual agenda"
  - "Notes from one to three recent meetings (advised)"
  - "What people complain about (optional)"
  - "Where your team already writes, such as a channel or a doc (optional)"
you_get:
  - "Each agenda item sorted as report, decide, solve or social, with a line from the notes as proof"
  - "The hours the meeting costs per month, and the hours saved, with every sum written out"
  - "A written update design and its template, with a word limit on each heading"
  - "The shorter meeting that stays, if any, and where the social part goes"
  - "A two-week trial with a measure and an end question"

how_to_use:
  - "Copy the prompt, then paste it into Claude, ChatGPT or Gemini with the meeting details under it."
  - "Paste last week's notes so the sort is based on what really happened."
  - "Check AGENDA SORTED. Fix any label you disagree with and run it again."
  - "Check the hours. Every sum is written out, so you can redo one with a calculator."
  - "Post the template, start the two-week trial, and ask the end question when it is over."

how_it_works:
  - title: "Sorts the agenda"
    text: "Report, decide, solve or social, each backed by a line from the notes or marked as a guess."
  - title: "Counts the cost"
    text: "People times minutes, in hours per month, before and after, with every sum shown."
  - title: "Moves reports to writing"
    text: "Who writes, when, where, the word limit, and how questions work."
  - title: "Keeps what needs a room"
    text: "Decide and solve items in a shorter meeting with only the people who decide."
  - title: "Protects the social part"
    text: "Suggests where it goes so it is not lost by accident."
  - title: "Writes the template and trial"
    text: "Headings with word limits, and a two-week trial with a measure and an end question."

output_shape: |
  AGENDA SORTED   <item | label | evidence>
  COST NOW        <attendees x minutes / 60 x meetings per month = hours per month>
  COST AFTER      <kept meeting + reading + writing = hours per month; saving = now - after>
  WRITTEN UPDATE  <who, when, where, limit, questions>
  MEETING KEPT    <items, length, attendees> or none
  SOCIAL          <where it goes>
  TEMPLATE        <headings, instruction, limit>
  TRIAL           <changes, measure, end question>
  MISSING         <...>
  CHECKS MISSED   <one line each, or none>

output_sample:
  input:
    - "The meeting's purpose, how often it runs, its length, who attends and the usual agenda"
    - "Notes from one to three recent meetings (advised)"
    - "What people complain about (optional)"
  prerequisites:
    - "An AI chat. No files, web access or paid tools are needed."
  output:
    - {name: "Agenda sorted", contains: "Each item labelled report, decide, solve or social, with a line from the notes to back it."}
    - {name: "Cost now", contains: "Attendees times minutes times meetings per month, written out as hours per month."}
    - {name: "Cost after", contains: "Hours for the shorter meeting plus reading and writing time, and the saving, with each sum shown."}
    - {name: "Written update", contains: "Who writes it, when, where, the word limit and how questions get asked."}
    - {name: "Meeting kept", contains: "The decide and solve items that stay, the new length and who attends, or none needed."}
    - {name: "Social", contains: "Where the social part goes so it is not lost."}
    - {name: "Template", contains: "The update's headings, each with a one-line instruction and a word limit."}
    - {name: "Trial", contains: "What changes on day one, what to measure over two weeks, and the end question."}

example:
  business: sprout
  input: |
    [the prompt]

    Meeting: Sprout weekly team sync, Mondays, 60 minutes, 7 people (founder,
    marketing lead, two support agents, web developer, ops manager, designer).
    Agenda: last week's sales and ad numbers (marketing lead reads them out);
    support volume and top complaints (support agent reads them); site
    changes shipped (developer); stock and shipping (ops); upcoming limited
    flavour launch (founder asks for decisions on date and ad angle); anything
    else.
    Notes from last Monday: numbers took 20 minutes with questions; support
    said cancel complaints up again; developer shipped the new Kids page;
    ops flagged the pouch reprint; the launch date for Raspberry Lemonade
    was debated for 15 minutes and not decided; the designer did not speak.
    Complaints: runs over, the launch decision keeps slipping.
  output: pending

tweaks:
  - what: "The notes"
    how: "Real notes make the sort honest. Without them every label is a guess."
  - what: "What people complain about"
    how: "Say it. 'Nothing gets decided' points at the decide items, 'runs long' at the report items."
  - what: "Your tools"
    how: "Say where written updates can live (a channel, a doc) so the design uses what you have."
  - what: "Reading and writing time"
    how: "Say how long people take to read and write an update. Without it the prompt assumes 10 minutes to read and 20 to write, and says so."

judge:
  - "The labels match what happened in the notes."
  - "The hours are right."
  - "Every template heading has a word limit."
  - "The decisions still have a time and a room."
  - "You know what to measure in two weeks."

test:
  - "Run the trial and compare hours in meetings and decisions made against the two weeks before."
  - "Run it twice. The sort should match."
  - "Give it a meeting whose agenda is all decisions. It should say the meeting stays, shorter."

improve:
  - "Add where your team already writes, so the update lands in a place people read."
  - "Keep the template and tune the word limits after the trial."
  - "Pair it with the Weekly status update writer to fill the template each week."

works_best_with:
  tools:
    - {name: "Claude, ChatGPT or Gemini", why: "A one-message plan works in any strong chat AI."}
    - {name: "A calculator or spreadsheet", why: "Lets you check the hours sums yourself."}
  inputs:
    - "Two or three sets of past notes, so the sort sees a pattern"
    - "The calendar invite, so attendees and length are exact"

terms:
  - term: "Report item"
    meaning: "An agenda item where one person tells and everyone else listens."
  - term: "Decide item"
    meaning: "An item where the group must choose, and the choice needs a room."
  - term: "Template"
    meaning: "The fixed headings of the written update, each with a word limit."
