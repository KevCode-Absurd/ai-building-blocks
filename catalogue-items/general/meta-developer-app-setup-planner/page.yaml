new_slug: meta-developer-app-setup-planner
name: Meta developer app setup planner
summary: Plan your Meta developer app with the least access you need, private secrets and a read-only test that shows the access works.
job: connect-tools
headline: Meta developer app setup planner
subhead: Tell it what you want to do with Meta ad data and which app and ad account you own. It picks read-only, Ad Library research or changes, lists the permissions to ask for and plans where to keep the token. You get a setup plan and a small read-only test.
explain: |-
  The usual mistake with a Meta developer app is to ask for the widest access, such as ads_management, when you only want to read results. Wide access means more review steps and more risk if a token leaks.

  This Meta developer app setup planner starts from what you need: a read-only ads audit, Ad Library research or changes to ads. It checks Meta's current app types and permissions for that mode, and separates app permissions from the ad account access that your business has to assign. A token with the right scope but no account access should fail clearly, not trigger a wider request.

  It plans where the token lives, who owns it and when it expires, and it never prints secrets in the output. Turning the app on does not give it permission to publish ads, change budgets or read other clients' accounts.
when:
  - You want to read your Meta ad account data from code or an AI tool.
  - You want Ad Library research and are not sure which app type to pick.
  - You are about to ask for ads_management and may not need it.
  - You are handing app setup to a teammate and want a clear plan.
you_give:
  - Your code project, or a short description of the app that will connect
  - What you need to do, such as read-only reporting, Ad Library research or changes to ads
  - The Meta app and business account you own, and the ad account to use
  - Who has access to that ad account today, a person or a system user
  - What you allow the AI to do, such as plan only or also run a test
you_get:
  - The mode to choose, read-only or changes, and why
  - The permissions to ask for and the Meta reviews still missing
  - A map of the app, business and ad account with IDs hidden
  - A plan for keeping the token safe, with its owner, expiry and renewal
  - A small read-only test, with its result or the reason it did not run
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it in. To run a test from your project, use Claude Code or another assistant that can run files.
  - Say what you want to do and which app and ad account you own.
  - Ask it to check Meta's current permission pages first, because they change. It needs web access for this. Without it, it marks the steps as unchecked.
  - Never paste an app secret or token into the chat. Keep them in your secrets settings.
  - Check the plan asks for read-only access if that is all you need, and read the permission errors it reports.
how_it_works:
  - title: Choose the mode
    text: Confirm whether the user needs a read-only audit, Ads Library research or authorized account changes. Choose the correct owned developer app and business/account context. A data-reading task does not automatically need campaign-management authority.
  - title: Check permissions and review
    text: Inspect current official app types, API products, permissions and review requirements for that intended mode. For a read-only ads audit, start from the supported ads-read capability rather than adding ads_management by default. Library access can have distinct verification and scope requirements.
  - title: Confirm account access
    text: Confirm the user or system identity actually has access to the intended ad account and app. Distinguish app permissions from business asset assignment. A token with a scope but no account access must fail clearly rather than widening authority blindly.
  - title: Store credentials safely
    text: You create the token in Meta and store it in your own secure settings, with an owner, expiry and renewal plan. The AI cannot create or store credentials for you and must not claim to. Do not print tokens, app secrets or personal identifiers in the output. Never install a browser extension just because a source lesson used one.
  - title: Run a small read-only test
    text: Plan or run one read-only Graph API request, such as the list of ad accounts with name and status, using your own token. It passes if it returns the account name and status and changes nothing. If it fails, you get the error by category and a specific request for more access.
  - title: Hand over the map
    text: Return a redacted app/account map, selected read-only or write mode, actual granted capabilities, missing reviews and probe evidence or not-run reason. Enabling the app is not permission to publish ads, alter budgets or query unrelated client accounts.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - "Your Meta calls already fail with errors: use Meta API access troubleshooter."
  - "You want the ad account itself reviewed: use Meta Ads 30-check account auditor."
  - "You need server-side sale tracking set up: use Meta server tracking checker."
output_sample:
  input:
    - Your code project or a short description of the app
    - What you need, such as read-only reporting or Ad Library research
    - The Meta app, business and ad account you own
    - Who has access to the ad account today
  prerequisites:
    - A Meta developer account and a business account you control
    - Access to the ad account you want to read
  output:
    - name: Mode and permissions
      contains: Read-only, library research or changes, with the permissions to ask for and why.
    - name: Missing reviews
      contains: Any Meta review or verification you still need before the access works.
    - name: App and account map
      contains: How the app, business and ad account connect, with every ID hidden.
    - name: Credential plan
      contains: Where the token lives, who owns it, when it expires and how it is renewed.
    - name: Read-only test
      contains: One small safe request, with its result or the reason it did not run.
    - name: Evidence and gaps
      contains: The sources used, open questions and the checks that did not run.
