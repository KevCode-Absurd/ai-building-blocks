headline: Meta developer app setup planner
subhead: Plan a Meta app setup with the least access needed, private secrets and a scoped read check.
explain: |-
  Share the selected codebase, schemas and service setup. Get a concrete setup or code-change plan with required files.

  Follow the actual current account/project structure rather than source screenshots or fixed historical settings.
when:
  - You need a concrete setup or code-change plan with required files.
you_give:
  - The selected codebase, schemas and service setup
  - The exact change you want and actions you authorize
you_get:
  - A concrete setup or code-change plan with required files
  - Missing inputs and a bounded verification plan
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
how_it_works:
  - title: Step 1
    text: Confirm whether the user needs a read-only audit, Ads Library research or authorized account changes. Choose the correct owned developer app and business/account context. A data-reading task does not automatically need campaign-management authority.
  - title: Step 2
    text: Inspect current official app types, API products, permissions and review requirements for that intended mode. For a read-only ads audit, start from the supported ads-read capability rather than adding ads_management by default. Library access can have distinct verification and scope requirements.
  - title: Step 3
    text: Confirm the user or system identity actually has access to the intended ad account and app. Distinguish app permissions from business asset assignment. A token with a scope but no account access must fail clearly rather than widening authority blindly.
  - title: Step 4
    text: Create and store authorized credentials in secure settings with an owner, expiry and rotation plan. Do not print tokens, app secrets or personal identifiers in the output. Never install a browser extension just because a source lesson used one.
  - title: Step 5
    text: Plan or run a minimal authorized read-only identity/account probe using tools present in the selected environment. Confirm any named local script exists before use. Report current permission errors by category and keep requests for additional access specific to the task.
  - title: Step 6
    text: Return a redacted app/account map, selected read-only or write mode, actual granted capabilities, missing reviews and probe evidence or not-run reason. Enabling the app is not permission to publish ads, alter budgets or query unrelated client accounts.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
