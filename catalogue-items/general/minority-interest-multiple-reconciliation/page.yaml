new_slug: minority-interest-multiple-reconciliation
name: Minority-interest multiple reconciliation
headline: Minority-interest multiple reconciliation
summary: Fix an EV to EBITDA multiple that leaves out minority interests. Get the matched enterprise value, the new multiple and the gap.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it the parent company's market value, debt, cash, the value of outside owners' shares in its subsidiaries, and consolidated EBITDA. It builds the enterprise value that matches that EBITDA. You see the multiple with and without the outside owners.
explain: |-
  Some companies own most of a subsidiary, not all of it. The company's accounts still count 100% of the subsidiary's earnings in EBITDA. Outside owners hold the rest. If your enterprise value leaves those owners out, the top of the EV to EBITDA multiple is too small for the bottom. The company looks cheaper than it is. This minority-interest multiple reconciliation adds the outside owners back and shows the gap.

  The sum is parent equity value plus debt plus the value of the outside owners' stake, less cash. Use a market estimate for the outside stake where you can. The balance sheet shows a book figure, and the skill keeps the two labelled so you never mix them. Stakes the company holds in other firms as investments are a different thing, and they stay out of this fix.

  Practice numbers, not a real company: parent equity 100, debt 50, cash 10, outside owners' stake 40 and EBITDA 20. The matched enterprise value is 100 + 50 - 10 + 40 = 180. That gives 180 / 20 = 9 times. Leave out the 40 and you get 140 / 20 = 7 times, which is 2 times too low.
when:
  - A comparison table shows a low EV to EBITDA multiple for a company that owns most, but not all, of its subsidiaries.
  - You have consolidated EBITDA and want to check that the enterprise value above it counts the outside owners.
  - A reviewer asks why your multiple is higher than the one on a data site.
  - You compare a parent company with peers that own all of their subsidiaries.
not_for:
  - The group owns all of its subsidiaries, so there are no outside owners. The plain EV to EBITDA sum is enough.
  - EBITDA is zero or negative. The multiple means nothing, and the skill will not give one.
  - You want to price the company or choose peers. This shows one multiple only. To test a return from a multiple, use the EPS and multiple return bridge.
  - The company holds stakes in other listed firms as investments. Use the Listed holding look-through NAV.
you_give:
  - The parent company's market value of equity, with the date (share price times shares)
  - Total debt and cash from the latest consolidated balance sheet
  - The value of the outside owners' share in the subsidiaries, as a market estimate or the balance sheet figure (say which)
  - Consolidated EBITDA for the same date and the same group of companies
  - Your own comparison spreadsheet (optional)
you_get:
  - The matched enterprise value, with the outside owners counted
  - The EV to EBITDA multiple, with and without the outside owners
  - How many times the old multiple was too low
  - A note on which outside-owner figure is a market estimate and which is book value
  - A list of missing facts and checks it could not run
  - A small workbook with the same sums, if your AI can make files
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. A chat is enough. You do not need to run code.
  - Paste the equity value, debt, cash, outside-owner figure and EBITDA. Say the date, the currency and the units, such as USD millions.
  - Ask in plain words, such as what is the EV to EBITDA multiple if I count the outside owners?
  - Check one line yourself. Equity plus debt plus the outside owners' stake, less cash, divided by EBITDA.
  - Read MISSING and CHECKS MISSED before you use the multiple. Ask for a workbook only if your AI can make files.
how_it_works:
  - title: Maps the group
    text: Confirms the subsidiaries that feed 100% of EBITDA. Tells outside owners in those subsidiaries apart from stakes the company holds as investments.
  - title: Builds the enterprise value
    text: Adds parent equity, debt and the outside owners' value, then takes off cash and any assets you treat separately.
  - title: Divides by matching EBITDA
    text: Uses EBITDA for the same companies and the same date. A mismatch is flagged, not fixed by guessing.
  - title: Shows the gap
    text: Puts the multiple with and without the outside owners side by side, so you see the effect before you pick any peer.
  - title: Marks the gaps
    text: Writes MISSING for any number it was not given. It never fills a gap with zero.
output_shape: |-
  RESULT
  Matched EV <amount> | Multiple <x> times | Multiple without outside owners <x> times | Understated by <x> times

  SCOPE AND SOURCES
  <date, currency and units; source and date for each input>

  INPUTS AND ASSUMPTIONS
  <parent equity, debt, cash, outside-owner value (market or book), EBITDA>

  CALCULATIONS AND TIES
  <each sum with its figures; cash, debt and EBITDA tied to the same group and date>

  FILE CHECK
  <what was recalculated in the workbook, or "no workbook made">

  MISSING
  <list>

  CHECKS MISSED
  <one line per check not done, or none>
output_sample:
  input:
    - The parent company's market value of equity, with the date
    - Consolidated debt and cash
    - The value of the outside owners' share in subsidiaries
    - Consolidated EBITDA for the same date and group
    - Your own comparison spreadsheet (optional)
  prerequisites:
    - The latest consolidated balance sheet and a share price
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: RESULT
      contains: The matched enterprise value, the multiple with and without outside owners, and how far off the old one was.
    - name: SCOPE AND SOURCES
      contains: The date, currency and units, with the source and date of each input.
    - name: INPUTS AND ASSUMPTIONS
      contains: Each number you gave it, with the outside-owner value marked as market or book.
    - name: CALCULATIONS AND TIES
      contains: Each sum shown with its figures, and a check that debt, cash and EBITDA cover the same group.
    - name: FILE CHECK
      contains: What was recalculated in the workbook, or a note that none was made.
    - name: MISSING
      contains: Every number it needed and did not get. It never fills one with zero.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
tweaks:
  - what: No outside owners
    how: Set the outside-owner value to zero. Both multiples match, and the gap is zero.
  - what: Book value instead of market value
    how: Use the balance sheet figure, and say so. The skill labels it as book, since it is often far from market.
  - what: A different date or currency
    how: Move every input to one date and one currency first. The skill flags any that do not match.
judge:
  - Noncontrolling-interest market estimates are distinguished from reported book amounts.
  - Consolidated cash, debt and earnings cover the same subsidiaries and date.
  - Trace dates, currency, scale, accounting perimeter and source pages for every material input.
  - Keep the focused illustration separate from a complete investment conclusion; list unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can do these sums in a chat.
    - name: An AI that can make spreadsheet files
      why: It can build the workbook, recalculate it and check that it reopens.
    - name: Node.js 20 or later (optional)
      why: Runs the small script that comes with the skill, for a second check of the numbers.
  inputs:
    - The latest consolidated balance sheet, with debt, cash and the amount shown for outside owners
    - A note on how the outside owners' stake is valued, by market or by book
    - A named reviewer and the question you want answered
terms:
  - term: Minority interest
    meaning: The part of a subsidiary that outside owners hold. Also called noncontrolling interest.
  - term: Enterprise value
    meaning: What it costs to buy the whole business, debt included. Equity plus debt plus outside owners, less cash.
  - term: EV to EBITDA multiple
    meaning: Enterprise value divided by EBITDA. It shows how many years of operating earnings the price equals.
  - term: Consolidated
    meaning: Counted as one group, with 100% of each subsidiary's figures included.
  - term: Illustrative figures
    meaning: Practice numbers that show how the sums work. They are not a real company.
