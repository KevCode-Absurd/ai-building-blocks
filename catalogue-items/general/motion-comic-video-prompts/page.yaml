new_slug: motion-comic-video-prompts
name: Motion comic video clip prompt writer
summary: Turn your comic ad script and product photos into motion comic video clip prompts, with an edit list and three approval points along the way.
job: make-video-ads
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
headline: Motion comic video clip prompt writer
subhead: Share the panel script, real product photos, claims and brand style. It defines the hero, reference sheets and storyboard, then writes one motion prompt per panel. You get prompts and editing notes, with three review points. Images and clips can be made with connected tools; paid generation needs approval, and missing photos limit product checks.
explain: |
  Comics are built for phones. One panel at a time, read top to bottom, with the story jumping forward in the gap between panels. AI video tools spoil the look in familiar ways. They draw letters as scribble, puff flat ink into 3D, change the hero between shots, and redraw your label.

  This skill runs the whole process in six stages. It confirms the panel list and names every cut. It writes a card for the hero, kept simple so viewers see themselves in them, and waits for your OK. It makes reference images, then a sheet with the hero from every angle, a product sheet drawn from your photos with no letters, and a set sheet. You approve those, then a storyboard with one still per panel. Only then does it write one clip per panel, each with one small motion. Captions go in during editing, and the last panel is your real product photo.
when:
  - You have a comic ad script and want to make it with AI image and video tools.
  - Earlier attempts gave you garbled lettering or a product with a made-up label.
  - You want a short, handmade-looking problem-and-fix story for vertical video.
not_for:
  - "You still need the comic script: write it first with the Motion comic video ad script writer."
  - "Your proof depends on pouring, stretching or fitting, or on a real person's result: film a live demo or use a testimonial video."
  - "You want a quick edit of a clip you already have: use your video editor, such as CapCut."
you_give:
  - The comic script, with its panels, captions, narration and cast note
  - Photos of your product (front, side, top, out of the pack), how it's used, and the one claim
  - Your colours and lettering typeface (optional)
  - The clip lengths your video tool accepts (optional)
you_get:
  - A panel list with a named transition into every panel, and an avatar card for the hero
  - Reference image prompts, then sheet prompts for the hero, product and places, with lock lines
  - A storyboard with one panel still and one card per panel
  - One clip prompt per panel, and an edit list for captions, narration, sound and the photo panel
  - Any check the prompts still missed, one line each, or none
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your comic script, ideally from "Motion comic video ad script writer", then attach your product photos.
  - Approve or change the hero card, then make the reference images and say which you picked.
  - Make and approve the sheets and lock lines, then the panel stills.
  - Make one clip per panel, then add captions, narration and the photo panel in your editor last.
output_sample:
  input:
    - Your comic script with panels, captions, narration and a note on the cast
    - Photos of your product from the front, side and top, plus how it is used and your one claim
    - Your brand colours and lettering font (optional)
    - The clip lengths your video tool accepts (optional)
  prerequisites:
    - An AI that can make images and video, or links to tools that can
    - A paid image or video tool account may be needed, and the skill asks before you spend
  output:
    - name: Panel list
      contains: Every panel with a named cut into it, what is drawn, and the ink style set once.
    - name: Avatar card
      contains: A short fixed description of the hero and the narrator's voice, held for your approval.
    - name: Reference image prompts
      contains: Three or four prompts for the hero in the ink line, so you can pick one.
    - name: Sheets and lock lines
      contains: Hero, product and place sheet prompts, plus short lines pasted into every prompt to keep the look fixed.
    - name: Storyboard
      contains: One still prompt per panel with its cut, one motion, caption, narration, length and sound.
    - name: Panel clip prompts
      contains: One clip prompt per panel, with flat ink and a single small motion.
    - name: Edit list
      contains: Captions, narration, sound, the real product photo panel, the offer and safe zones for editing.
    - name: Checks missed
      contains: One line for each check the prompts still missed, or none.
how_it_works:
  - title: Reads the script
    text: Checks a comic fits, confirms 5 to 8 panels with a named cut into each, and sets the ink line once.
  - title: Writes the avatar card
    text: One adult hero with a few clear features and a simple face, plus the narrator's voice. It stops for your OK.
  - title: Makes reference images
    text: Three or four images of the hero in the ink line. You pick one.
  - title: Builds the sheets
    text: The hero from five angles with the feeling symbols the script needs, the product drawn from your photos with no letters, each place empty, and lock lines. It stops for your OK.
  - title: Draws the storyboard
    text: One full-screen still per panel with its cut, one motion, caption and narration, checked for facing and the product's state. It stops for your OK.
  - title: Turns it into video
    text: One clip per panel with flat ink and no words, narration over it, hard cuts, captions lettered in editing and your real product photo last.
output_shape: |
  STAGE 0  PANEL LIST  <n> | <transition in> | <what's drawn>
           INK         <line, fills, shadow, dots, palette, border>
  STAGE 1  AVATAR CARD <simple features, voice, never change>
                                                 > STOP for approval
  STAGE 2  REFERENCES  <3 or 4 prompts>  Picked: <n>
  STAGE 3  SHEETS      Hero: <5 angles, symbols, size>
                       Product: <front, side, top, no letters;
                       label words kept for the photo panel>
                       Places: <empty, main angle>
           LOCK LINES  <ink, hero, product, palette, border>
                                                 > STOP for approval
  STAGE 4  STORYBOARD
           PANEL <n> STILL  <prompt>  Attach: <sheet> = <its job>
           Card: <transition> | <one motion> | caption "<...>" |
           narration "<...>" | <s> | <sound>
                                                 > STOP for approval
  STAGE 5  PANEL <n> CLIP  <length>, from still <n>: <one motion>.
                           Ink stays flat 2D. No words appear.
           EDIT LIST   <captions, narration, sound, photo panel,
                       offer, safe zones>
  CHECKS MISSED  <one line per check still missed, or none>
example:
  business: sprout
  input: |
    [the skill]

    Script (30 s, from "Tell your buyer's story in comic panels that
    sell"). Claim: "60+ ingredients, 21 vitamins & minerals, and 6g
    fiber" in 1 pack.
    P1 "Every morning, the same chalky glass." CHOKING ON POWDER AGAIN
    P2 "Then the shaker sits in the sink." THE SHAKER WINS AGAIN
    P3 "So the whole lot went in one pack." 60+ INGREDIENTS / 6G FIBER
    P4 "One small handful a day." RIP. TIP. ENJOY.
    P5 "Same kitchen. Nothing to rinse." NO SHAKER TO WASH
    P6 (no narration) out the door. P7 photo panel, offer text.
    Hero: an adult woman, round simple face, dark ponytail, navy
    blazer over a white top, small gold hoop earrings.
    Product: Sprout pouch, photo attached (glossy deep green, big yellow
    wordmark, yellow bear face top right, "28 Daily Packs").
    Use: tear one daily pack straight across the top, tip into palm.
  output: |
    STAGE 0  PANEL LIST  1 opens · 2 action to action · 3 subject to
    subject · 4 moment to moment (the reveal, 6 s) · 5 action to
    action · 6 scene to scene · 7 subject to subject (photo panel).
    INK  bold even black line, flat fills, one shadow tone, light
    halftone dots in shadows; black, cream, sky blue, warm grey, and
    the product's deep green; thin black border, cream gutter.

    STAGE 1  AVATAR CARD
    The hero: an adult woman, round simple face, dark ponytail, navy
    blazer over a white top, small gold hoop earrings. Silent; a dry,
    friendly narrator, quick. Never change: ponytail, blazer, hoops.
    > STOP: approved.

    STAGE 2  REFERENCES (4; picked 1, the simplest face)

    STAGE 3  SHEETS
    Hero: front, three-quarter left and right, side, back; a sweat
      drop, a flat stare, a small grin; holding a daily pack in one
      palm. [INK]
    Product: the daily pack as a small flat deep-green sachet with a
      yellow edge, bears deep green, front, side and top; no letters.
      Label words "Sprout" and "28 Daily Packs" kept for the photo
      panel only.
    Places: kitchen counter with a sink, from the side; a sunny street.
    LOCK LINES: [INK] / [HERO as the card] / [the sachet as the
      product sheet, the most saturated thing in frame].
    > STOP: approved.

    STAGE 4  STORYBOARD (panel 4 shown)
    PANEL 4 STILL  9:16 inside the border. Close on two hands tearing
      the sachet straight across its top, small deep-green bears
      tipping into the left palm. [LOCK LINES] No words. Attach:
      product sheet = sachet shape and colours.
    Card: moment to moment | the tear, slowed | caption "RIP. TIP.
      ENJOY." | narration "One small handful a day." | 6 s | one tear
    Continuity: she faces screen right in panels 1, 2 and 5; the torn
      sachet stays in her left hand from panel 4.
    > STOP: approved.

    STAGE 5  PANEL 4 CLIP  6 s, from panel 4 still: the tear runs
      slowly across the top, then the bears tip out. Ink stays flat
      2D. No words appear.
    EDIT LIST
    - Captions in Work Sans bold capitals, one box per panel, top left,
      inside the safe zone.
    - Narration over panels 1 to 5; panels 6 and 7 silent.
    - Sound: a glass clink, a drip, one tear, light music from panel 5.
    - Photo panel: the real pouch photo, same border; text "$29.99
      first order with text sign-up. Renews at $49.99 every 4 weeks."
    MISSING: a photo of a single daily pack, so the drawn sachet
    matches the real one.

    (cut for length: the full run also had the reference prompts,
    panel stills and clips for panels 1 to 3, 5 and 6)
tweaks:
  - what: Number of panels
    how: Five panels for a quick 20-second cut, up to eight for a fuller story. The reveal panel always stays longest.
  - what: Transitions
    how: Ask for a slower, moodier open and it adds one "details of a place" transition at the start. It never stacks two.
  - what: Motion
    how: Say "layers only" for the calmest look, or allow one moving part per panel for more life.
  - what: The palette
    how: Give your brand colours. The ink keeps black plus 3 or 4 flat colours, and your product stays the brightest.
judge:
  - It stopped for your OK after the avatar card, the sheets and the storyboard, unless you asked for every stage in one go.
  - Every panel has a named transition, and the reveal panel is the longest.
  - The lock lines are the same, word for word, in every prompt.
  - No prompt asks the tool to draw words or numbers, and each clip has one kind of motion.
  - The last panel is your real product photo, set in editing.
test:
  - Read the transition column. Most should be "action to action" or "subject to subject", with one slowed reveal.
  - Make the character sheet and three panel stills. The hero should look the same in each.
  - Search every prompt for words the tool would have to write. There should be none.
  - Make one clip. It should have one motion and flat ink, with no drift toward 3D.
improve:
  - Write your ink line and palette into stage 0 of the skill file, so every comic ad in a series looks the same.
  - Add your product's never-show rules to the Avoid list.
  - Save the approved avatar card, character sheet and lock lines in your org context, so the next ad starts at stage 4.
  - Pair it with "Motion comic video ad script writer" first, so the claim and panels are settled.
works_best_with:
  tools:
    - name: Nano Banana
      why: Takes up to 14 reference images and keeps up to four characters the same, so your sheets and panels match.
    - name: Veo
      why: Starts each clip from your approved panel still and can make sound with it, in 8-second clips.
    - name: CapCut
      why: Lets you add the words, numbers and captions as their own layers after the clips are made.
  inputs:
    - Your lettering font file, so captions match your brand
    - Two comic pages you like, attached as pictures, so the ink line has a target
    - The final narration recording, so each panel's length fits its line
terms:
  - term: Avatar card
    meaning: A short, fixed description of the hero and the narrator's voice, approved before any image is made.
  - term: Panel transition
    meaning: What changes between two comic panels, such as the next step of an action or a jump in time.
  - term: Gutter
    meaning: The gap between comic panels, where the reader fills in what happened.
  - term: Lock lines
    meaning: Short lines for the ink, the hero and the product, pasted word for word into every prompt.
  - term: Photo panel
    meaning: Your real product photo framed like a comic panel, added in editing.
