  tools:
    - {name: "Claude Code with Remotion", why: "Builds the ad in code, so every word, number and bar height renders exactly as written."}
    - {name: "Claude", why: "Turns a long shot table into build sheets without dropping a layer or a source."}
    - {name: "Veo", why: "Makes wordless moving backgrounds of plain shapes if you want them behind the layers."}
  inputs:
