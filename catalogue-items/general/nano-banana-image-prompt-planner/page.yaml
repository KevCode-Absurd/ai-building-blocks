new_slug: nano-banana-image-prompt-planner
name: Nano Banana image prompt planner
summary: Describe an image or edit. Get matching Nano Banana prompts in plain words and JSON (a structured format), with a role for each reference image.
job: make-images
headline: Nano Banana image prompt planner
subhead: Describe an image or edit. Get matching prompts in plain words and in JSON (a structured format), with clear reference roles and changes. Bring the brief and any files you want it to use.
explain: |-
  Use this when you need paired natural-language and JSON image/edit prompts. Choose generation, edit, composite/outpaint, style extraction or style reuse from the actual request. A single requested change is not permission to redesign the whole scene.

  Build the three pillars: subject, physical context and style. Set camera position/direction, action/body position, expression, lighting, foreground/background, color and aspect ratio only where relevant.
when:
  - You need paired natural-language and JSON image/edit prompts.
  - You want a clear draft and checks from the material you already have.
not_for:
  - "You only need one quick prompt with no edits or references: ask any image tool directly, or write one sentence yourself."
  - "You want the finished image made: this writes prompts only, so paste them into Nano Banana in Gemini or your image tool."
  - "You want to edit a photo you have no rights to use: get permission from the owner first, or use an image you own."
you_give:
  - "Your brief in one sentence, plus where the image will be used"
  - "Optional: an approved image to edit, and its file type"
  - "Optional: reference images, how many, and which one wins if they clash"
you_get:
  - "A plain-language prompt and a matching JSON prompt, with a role for each reference image"
  - Missing inputs and steps that still need to run
how_to_use:
  - Add the skill to your AI, or download the pack and give its instructions to your AI.
  - Write your brief in one sentence and say where the image will be used. Attach any image to edit and any reference images.
  - For each reference, say what it is for (product shape, face, style or layout) and which one wins if they clash.
  - Read the plain-language prompt and the JSON side by side. Check they say the same thing.
  - Paste the plain-language prompt into Nano Banana in Gemini, or your image tool, and attach the same images. Check the result against the preserve list.
output_sample:
  input:
    - "Your brief: the image you want, or the edit you want made"
    - An approved image you want to keep or change (optional)
    - Reference images, such as a product, a face or a style (optional)
    - What matters most if references clash (optional)
  output:
    - name: PLAIN LANGUAGE
      contains: Copy-ready visual instructions covering subject, setting, style, camera, light, color and any edits.
    - name: JSON
      contains: "The same instructions as structured fields: mode, subject, context, style, references, edits and preserve rules."
    - name: NOT RUN
      contains: What could not be checked, such as unseen reference images, image generation or the final picture.
how_it_works:
  - title: Read the brief
    text: Choose generation, edit, composite/outpaint, style extraction or style reuse from the actual request. A single requested change is not permission to redesign the whole scene.
  - title: Build the result
    text: Return plain language first and JSON second with equivalent information. Keep fields meaningful; omit irrelevant clothing/skin fields for non-human subjects.
  - title: Check and hand off
    text: Check JSON parses, edit instructions do not conflict with preserve rules, and the plain-language/JSON versions agree. Prompt drafting does not imply an image was rendered.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
