new_slug: nda-traffic-light-checker
name: NDA traffic-light checker
summary: Get a first check on an NDA before you sign. Paste it in for a green, yellow or red rating and the odd clauses in plain words.
job: check-contracts
thinking: medium
thinking_why: It compares each clause against a standard, which needs some judgement.
headline: NDA traffic-light checker
subhead: Paste the NDA and say whether you share, receive or both. You get a green, yellow or red rating, the odd clauses with section numbers and plain meaning, and what to ask them to change.
explain: "Most NDAs are routine. A few hide terms that tie your hands, like a ban on working with their competitors or a claim to your ideas. This prompt checks the agreement against common standards: the type, the definition, the usual exceptions, how long it lasts and a list of odd clauses. It gives a traffic-light rating so you know whether it looks routine, needs a change or needs a second opinion. It is a first check, not legal advice. Have a qualified person check anything rated yellow or red, and anything you are unsure of."
when:
  - Someone sent you an NDA and wants it back today.
  - You want to know if it is standard before you call a lawyer.
  - You send NDAs and want to check the ones you get back.
not_for:
  - "You are about to sign a high-value or long-term deal: have a qualified lawyer read it."
  - "Your NDA is rated yellow or red: ask a qualified person to review it before you sign."
  - "You need a full clause-by-clause review of many NDAs: use the NDA quick checker."
you_give:
  - The full NDA text
  - Whether you share, receive or both
  - What you plan to share (optional)
you_get:
  - A green, yellow or red rating with a reason
  - Odd clauses quoted, with plain meaning
  - A short list of changes to ask for
how_to_use:
  - Copy the prompt, then paste it into Claude, ChatGPT or Gemini with your details under it.
  - Under it, paste the NDA text and your side.
  - Send it and read the result.
  - Do not sign yellow or red ones without a second look.
output_sample:
  input:
    - The full NDA text
    - Whether you are sharing, receiving or both
    - What you plan to share (optional)
  output:
    - name: RATING
      contains: Green, yellow or red, with a one-line reason for the rating.
    - name: ODD CLAUSES
      contains: Each odd clause with its section number, the quoted words, what it means and why it matters.
    - name: WHAT TO ASK THEM TO CHANGE
      contains: A short list of edits to request before you sign.
    - name: MISSING
      contains: Facts it needed but did not have, marked so nothing is guessed.
    - name: CHECKS MISSED
      contains: Any check that failed or could not run, or none if all checks ran.
how_it_works:
  - title: Check the shape
    text: One-way or two-way, and the definition of confidential.
  - title: Check the basics
    text: The usual exceptions, and how long it lasts.
  - title: Find odd terms
    text: Clauses that go beyond secrecy, then rate it.
output_shape: |-
  RATING
  <GREEN / YELLOW / RED>. <one-line reason>
  A first check, not legal advice. Have a qualified person check it before you sign.

  ODD CLAUSES
  <section, quoted words, plain meaning, why it matters>

  ASK THEM TO CHANGE
  <short list>

  MISSING
tweaks:
  - what: Side
    how: Say if you are sharing or receiving. It changes the rating.
  - what: Strictness
    how: Ask it to rate red on any non-compete.
  - what: Length
    how: Ask for just the rating and top three clauses.
judge:
  - Rating fits the findings.
  - Clauses are quoted with sections.
  - Your side is used.
  - Plain meaning.
test:
  - Paste an NDA with a non-compete. It should flag it as odd.
  - Paste a standard NDA. It should rate green.
  - Run twice. The rating should match.
improve:
  - Add your own red lines, like a maximum term.
  - Add your usual NDA to compare against.
  - Use the full skill when many NDAs arrive at once.
works_best_with:
  tools:
    - name: Any good chat AI
      why: A one-message prompt works in any strong chat AI, with nothing to install.
  inputs:
    - The full NDA text
