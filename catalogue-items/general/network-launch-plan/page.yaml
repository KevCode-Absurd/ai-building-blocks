new_slug: network-launch-plan
name: Network launch distribution planner
summary: Plan a network launch for a product that needs other users. Pick a network that already holds your first users, and set a number to aim for.
job: grow-social
thinking: medium
thinking_why: It judges which network to borrow and sets a number, which needs judgement.
headline: Network launch distribution planner
subhead: Give it your product and say where your first users already spend time. It picks the network that gives cheap reach and sharing, designs a first use that invites a second person and sets a tipping-point number. You get a launch route with an exit if it fails.
explain: |
  A product that gets better with more users has a cold-start problem: it is not worth joining until others have. Building your own audience from nothing is slow. The usual way out is to start on a network that already holds your first users and borrow its reach.

  This skill lists the networks and tools your first users already use and picks the one that gives cheap reach and easy sharing. It designs the first use so that it invites a second person, sets a tipping-point number and says how you will count it. It plans the step from the borrowed network to word of mouth, and writes what to cut if distribution does not arrive.
when:
  - Your product is only useful when other people join it.
  - You have no audience and need a way to reach the first few hundred users.
  - You are choosing which platform or tool to launch on.
not_for:
  - Your product works fine for one person alone. Skip this and use a plain launch plan or ask a few buyers directly.
  - You want your first customers one by one, by hand. Use the First customer outreach planner.
  - You already have users and want to write ads. Use the Story image ad writer.
  - "Your product is a marketplace or app and you want a plan score out of 10 and density measures: use the Network launch planner."
you_give:
  - The product and what it does
  - Who the first users are and where they spend time
  - A buyer description (optional)
  - What you can spend in time and money
you_get:
  - A shortlist of existing networks, with the one picked and why
  - A first use that invites a second person
  - A tipping-point number and how to count it
  - A plan to move to word of mouth, and what to cut if it fails
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Describe the product and where your first users already are.
  - Say what you can spend.
  - Run the first use with a few real people.
  - Count the number it sets, then bring the result back.
output_sample:
  input:
    - Your product and what it does
    - Who your first users are and where they spend time
    - What you can spend in time and money
    - A buyer description (optional)
  output:
    - name: The first users
      contains: Who they are and where they already spend time.
    - name: Networks to borrow
      contains: At least four networks compared on reach, cost and ease of sharing, with the pick and why.
    - name: The first use
      contains: What a person does first, and how that action invites a second person.
    - name: The number
      contains: The tipping-point number, how you will count it and the date to reach it.
    - name: From borrowed to own
      contains: The step that moves people from the borrowed network to sharing by word of mouth.
    - name: Exit
      contains: What to cut or change if the number is missed by the date.
    - name: Missing
      contains: Facts it needed but did not have, marked so nothing is invented.
    - name: Checks missed
      contains: One line for each of its own checks that failed, or none.
how_it_works:
  - title: Lists networks
    text: Names the networks and tools your first users already use.
  - title: Picks the host
    text: Chooses the one that gives cheap reach and easy sharing.
  - title: Designs the first use
    text: Makes the first use invite a second person.
  - title: Sets the number
    text: Picks the tipping-point number and how you will count it.
  - title: Plans the hand-off
    text: From the borrowed network to word of mouth.
  - title: Writes the exit
    text: What to cut if distribution does not arrive.
  - title: Checks the set
    text: Runs its own checks and names any it missed.
output_shape: |
  THE FIRST USERS
  <who, and where they already spend time>

  NETWORKS TO BORROW
  <network> | Reach: <...> | Cost: <...> | Sharing: <...> | Pick: <yes or no, why>

  THE FIRST USE
  <what a person does first> | Invites: <how it brings in a second person>

  THE NUMBER
  <tipping-point number> | Counted by: <how> | By when: <date>

  FROM BORROWED TO OWN
  <the step that moves people to word of mouth>

  EXIT
  <what to cut or change if the number is missed by the date>

  MISSING
  CHECKS MISSED
tweaks:
  - what: Where your users are
    how: "Name real places: a platform, a tool, a group. 'Online' is too wide."
  - what: How much sharing the product allows
    how: Say whether one person can invite another inside the product. The first use is built on that.
  - what: Your spend
    how: Give a time and money limit. The pick depends on cost.
  - what: The date
    how: Give a date for the number. Without one, the exit rule is empty.
judge:
  - Each step names a real network or channel.
  - A tipping-point number is set.
  - The plan has an exit if distribution fails.
  - The first use invites another person.
  - The pick is explained by reach, cost and sharing.
test:
  - Ask three of your first users if they already use the network you picked.
  - Run the first use with five people and count how many invite a second.
  - Run it twice. The pick should stay close.
  - Check the number against how many people the network can reach.
improve:
  - Add the networks you can never use, such as ones with rules against promotion.
  - Add your own earlier counts to the number step.
  - Save the result of each trial to your results file.
  - Pair it with a skill that plans the first customers by hand.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Comparing networks and planning a first use is text work any strong chat AI does well with this skill.
  inputs:
    - A list of where your first users spend time
    - Counts from earlier launches
    - Notes from talks with first users
terms:
  - term: Tipping point
    meaning: The number of users after which the product grows without your help.
  - term: Network effect
    meaning: The product becomes more useful as more people use it.
