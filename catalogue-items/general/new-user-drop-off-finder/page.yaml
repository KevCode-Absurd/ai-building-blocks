new_slug: new-user-drop-off-finder
name: "New user drop-off finder"
summary: "Find where new users drop off between visit, sign-up and day 30. Get the biggest leak, the missing first-visit step and one fix to measure."
job: build-product
thinking: medium
thinking_why: "It does simple funnel arithmetic and then judges which step to fix. The steps are fixed."

headline: "New user drop-off finder"
subhead: "Paste your visits, sign-ups and the people still active after 30 days. It works out the share lost at each step, ranks the biggest drop, and checks whether the feature you are considering would reach enough people. You get the drop-off, a fix for new users and a measure."

explain: |
  When people stop using a product, the usual answer is to build another feature. But a feature mostly reaches people who already use the product a lot, and they are few. The bigger loss happens earlier, in the first visit, when new people leave before they see why the product is worth their time.

  This new user drop-off finder lays out your funnel from visit to sign-up to 30-day use. It finds the biggest drop in share terms and writes it down before any feature idea. If you have a feature in mind, it estimates how many sign-ups could ever see it.

  Then it reads the landing page and first visit for the missing step, and names the two to four actions that make someone an active user. It ends with one change for new and casual users, with a measure, a target and a date to check.

when:
  - "Sign-ups look fine, but few people are still around after a month."
  - "Your team wants to build a new feature to bring users back."
  - "You need to choose between fixing the first visit and building something new."
  - "You want to know where new users leave, using only three numbers from your analytics."

not_for:
  - "Your funnel ends in a purchase (visit, product page, cart, order). Use the Sales funnel drop-off finder."
  - "You have results grouped by join date and want to compare groups over time. Use the Cohort funnel analyst."
  - "You have an event log with many steps and want conversion and time to convert. Use the Conversion funnel analyst."
  - "You already know the first visit is the problem and want the flow designed. Use the First-use onboarding designer."
  - "You have no sign-up step at all, so there is nothing to count between visit and day 30."

you_give:
  - "Visits, sign-ups and users still active at 30 days, all for the same named period. Take them from Google Analytics or your product's own analytics."
  - "What counts as active, such as three sessions in a week (recommended)"
  - "The feature you are thinking of building, and who it is for (optional)"
  - "A description or screenshot of your landing page and first visit (optional)"
you_get:
  - "Your funnel, with the count and share at each step"
  - "The biggest drop, ranked, written before any feature idea"
  - "An estimate of how many sign-ups the feature would reach"
  - "The step or message missing from the first visit"
  - "One change for new users, with a measure, a target and a date"

how_to_use:
  - "Copy the skill and paste it into Claude, ChatGPT or Gemini, or open it if you added it to your AI. It needs no files or paid tools."
  - "Paste your three counts and name the period, for example 1 to 30 September. Use the same dates for every count."
  - "Say what active means for your product. Describe the first visit, or attach a screenshot."
  - "Add the feature idea if there is one, and who it is for."
  - "Check one share yourself with a calculator. Then run the one change it picks and measure on the date it sets."

how_it_works:
  - title: "Asks for the counts first"
    text: "If none of the three counts is given, it asks for them and stops. It does not guess numbers."
  - title: "Lays out the funnel"
    text: "Writes visits, sign-ups and 30-day users with each count and share, and flags any step that is larger than the one before it."
  - title: "Finds the biggest drop"
    text: "Works out the share of people lost between steps and ranks the drops."
  - title: "Checks the feature's reach"
    text: "Estimates how many sign-ups would ever see the feature, and states the assumptions."
  - title: "Reads the first visit"
    text: "Looks at the landing page and first visit for what a new person needs and does not get."
  - title: "Names the active actions"
    text: "Lists the actions that active users take and casual users do not. With no data, it labels this a guess."
  - title: "Plans one change"
    text: "Picks one change for new users, with the measure it should move, a target and a date."

output_shape: |
  THE FUNNEL (period: <dates>)
  Visits: <n> | Sign-ups: <n> (<share of visits>) | Active at 30 days: <n> (<share of sign-ups>)

  BIGGEST DROP
  <step to step> | Lost: <n people, share> | Ranked: <1, 2>

  THE FEATURE IDEA
  <feature> | Reaches: <who> | Estimate: <n people, share of sign-ups>

  THE FIRST VISIT
  Missing: <step or message> | Evidence: <what the page shows>

  ACTIONS THAT MAKE SOMEONE ACTIVE
  <action 1>, <action 2>, <action 3> | Source: <data or MISSING>

  THE CHANGE TO TRY
  <change for new users> | Measure: <metric> | Target: <number> | Check on: <date>

  MISSING
  <facts that would change the findings>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "Visits, sign-ups and users still active at 30 days, for one named period"
    - "What counts as active (recommended)"
    - "The feature you are considering and who it is for (optional)"
    - "A description or screenshot of your landing page and first visit (optional)"
  output:
    - name: "THE FUNNEL"
      contains: "The count and share at each step from visit to sign-up to 30-day use."
    - name: "BIGGEST DROP"
      contains: "The steps ranked by share of people lost, written before any feature idea."
    - name: "THE FEATURE IDEA"
      contains: "Who the feature reaches and an estimate of how many sign-ups that is."
    - name: "THE FIRST VISIT"
      contains: "The step or message a new person is missing, with the evidence for it."
    - name: "ACTIONS THAT MAKE SOMEONE ACTIVE"
      contains: "Two to four actions active users take, or a labelled guess if there is no data."
    - name: "THE CHANGE TO TRY"
      contains: "One change for new users with a measure, a target and a date."
    - name: "MISSING and CHECKS MISSED"
      contains: "Any fact it lacked and any check it could not finish."

tweaks:
  - what: One clear period
    how: Use the same dates for every count. Mixed periods make the shares meaningless.
  - what: A real definition of active
    how: Say what active means, such as three sessions in a week. The 30-day count depends on it.
  - what: The first visit
    how: Attach a screenshot of what a new person sees, or describe the first five clicks.
  - what: The feature's audience
    how: Say who it is for. The skill compares that group with your 30-day users.

judge:
  - Each step shows counts and shares.
  - The drop-off comes before feature ideas.
  - The feature's reach is estimated.
  - The change targets new users.
  - A measure and a date are set.

test:
  - Check the shares by hand with a calculator for each step.
  - Run it on an older period where you know what fixed the drop, and see if it points the same way.
  - Run the planned change for the length it states and compare the measure.
  - Run it twice. The biggest drop should be the same.

improve:
  - Add your own definition of an active user and the actions that lead to it.
  - Add the numbers by source, such as ads or referrals, so new users from each can be compared.
  - Keep each period's funnel in a file and paste last quarter's in to see the trend.
  - Pair it with "Sales funnel drop-off finder" if your funnel ends in a purchase.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Funnel shares and plain-language findings are text and arithmetic work."}
    - {name: "Your analytics tool", why: "Gives the exact counts the skill needs, by period."}
  inputs:
    - "Counts by source of visits"
    - "A screenshot of the landing page and first screen"
    - "A list of the actions your active users take"

terms:
  - term: Funnel
    meaning: The steps people pass through, such as visit, sign-up and still active, with fewer people at each step.
  - term: Active user
    meaning: Someone who keeps doing the actions that show your product is useful to them.
  - term: Share
    meaning: A count as a part of the step before it, for example 200 sign-ups from 1,000 visits is 20%.
