new_slug: no-catchup-waterfall-checker
name: No-catchup waterfall checker
headline: No-catchup waterfall checker
summary: Check how one fund payout splits across capital, preference and carry with no GP catch-up. You get LP cash, GP carry and any unpaid shortfall.
job: money-and-investing
thinking: high
thinking_why: "Each tier is paid in order and only from cash left after the tier above, so the order and the amounts must come from the agreement."
subhead: Capital returned, preference paid, GP carry, LP cash and remaining first-tier shortfall. Share available distributable cash, eligible unreturned LP capital, separately verified accrued preference and residual GP carry fraction under a no-catchup LPA.
explain: |-
  Capital returned, preference paid, GP carry, LP cash and remaining first-tier shortfall.

  Private fund distributions. Illustrative figures only. A distribution of 150 first returns 100 of capital, then pays 20 of preference. The remaining 30 splits 6 to the GP and 24 to the LP (a 20% carry), so LP cash totals 144. A distribution of 110 returns 100 of capital, pays 10 of preference, leaves 10 of preference unpaid and pays zero carry.
when:
  - You need capital returned, preference paid, GP carry, LP cash and remaining first-tier shortfall.
  - You work on private fund distributions and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You need a GP catch-up, deal-by-deal carry or a tax-distribution waterfall: ask your fund lawyer or fund administrator, because this tool does not model them."
  - "You want to know what your LPA clause means: ask a fund lawyer, because this tool only does the arithmetic."
  - "You want to check an investor statement against its records: use the Investor statement NAV checker."
  - "You need to work out the accrued preferred return itself: use the Preferred return accrual checker instead."
you_give:
  - Available distributable cash, eligible unreturned LP capital, separately verified accrued preference and residual GP carry fraction under a no-catchup LPA.
  - "The distribution date, plus the currency and scale used for the fund distribution waterfall."
  - "Your spreadsheet tool, if you want the fund distribution waterfall as a workbook."
you_get:
  - Capital returned, preference paid, GP carry, LP cash and remaining first-tier shortfall.
  - "An editable workbook of the fund distribution waterfall, with its inputs, formulas and test cases to rerun."
  - "A tie-out of investor cash plus manager cash and the amount distributed, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the fund agreement, the cash available and the capital and preference owed."
  - "Tell it what you need: capital returned, preference paid, carry, investor cash and any shortfall."
  - "Ask it to stop and mark MISSING if the unreturned capital or the accrued preference is not in your sources."
  - "Check that carry stays at zero until all capital and preference are paid, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Cash available to distribute
    - Unreturned LP capital
    - Accrued preference, checked against your LPA
    - Share of leftover cash that goes to the GP as carry
    - Reporting date, currency and scale
  prerequisites:
    - A spreadsheet tool and an AI that can create files, if you want the workbook
    - Node.js 20 or later, only if you want to run the included calculation script
  output:
    - name: Capital returned
      contains: The part of the cash paid back to LPs as unreturned capital, up to what is owed.
    - name: Preference paid
      contains: The part of the remaining cash that covers accrued preference, and nothing more than is owed.
    - name: GP carry and LP cash
      contains: How the cash left after both first tiers splits between the GP and the LPs.
    - name: Remaining first-tier shortfall
      contains: Any capital or preference still unpaid when cash runs out, with carry at zero.
    - name: Editable workbook and reconciliations
      contains: A native workbook, input schema and checks that LP plus GP cash equals the distribution.
    - name: MISSING and CHECKS MISSED
      contains: Inputs you did not supply and checks that failed or could not run, or none.
how_it_works:
  - title: 1. Confirm whole-fund return-of-capital priority and explicitly no GP catch-up or GP co-investment in this schedule
    text: Confirm whole-fund return-of-capital priority and explicitly no GP catch-up or GP co-investment in this schedule.
  - title: 2. Pay the lesser of available cash and unreturned capital, then preference only from remaining cash
    text: Pay the lesser of available cash and unreturned capital, then preference only from remaining cash.
  - title: 3. Split only cash left after both senior tiers by residual carry fraction; reconcile LP plus GP cash and unpaid senior claims
    text: Split only cash left after both senior tiers by residual carry fraction; reconcile LP plus GP cash and unpaid senior claims.
output_shape: |-
  Capital returned, preference paid, GP carry, LP cash and remaining first-tier shortfall.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING lines
  CHECKS MISSED
tweaks:
  - what: "Distribution date"
    how: "Take the distribution date from the fund agreement, the cash available and the capital and preference owed. Use one currency and scale on every line."
  - what: "Cash available to distribute"
    how: "Change the cash available to distribute and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Carry remains zero until the entire supplied capital and preference obligations are met.
judge:
  - Carry remains zero until the entire supplied capital and preference obligations are met.
  - Capital, preference and residual GP/LP cash sum to the distribution exactly.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one fund distribution waterfall you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define preferred return into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
