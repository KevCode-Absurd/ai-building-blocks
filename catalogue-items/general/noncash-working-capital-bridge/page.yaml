new_slug: noncash-working-capital-bridge
name: Noncash working-capital bridge
headline: Noncash working-capital bridge
summary: Find how much cash a business really put into working capital, after removing acquisitions, currency and write-offs from the balance change.
job: track-numbers
thinking: high
thinking_why: "Only part of a balance change is cash, so each noncash movement must be found in the notes before the cash figure is read."
subhead: Give it the opening and closing operating working capital and the acquisition, currency and write-off figures from the notes. It takes those out of the balance change and shows the cash the business really put in.
explain: |-
  Working capital on the balance sheet can rise for reasons that never touched cash, such as buying a company, a currency move or a write-off. If you read the whole rise as cash spent, you get the wrong picture. This skill removes the noncash parts and shows the cash effect that is left.

  Illustrative figures, not a real company. The balance rises from 100 to 150, an increase of 50. Noncash movements of 20 + 5 - 5 = 20 leave 30 of operating investment, and a cash effect of -30. If the acquisition adds 30 to the balance instead, only 20 is operating investment.
when:
  - You need to know how much cash went into working capital, not just how the balance moved.
  - You compare cash flow and balance sheet and the numbers do not tie.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - You have factoring, supplier finance or discontinued operations. These need their own schedules, so split them out first or ask your accountant.
  - You only have two balances and no notes on acquisitions, currency or write-offs. Get the notes from the filing first, as this skill cannot guess them.
  - You want a full cash-flow statement or a company valuation. Use a full model built with your finance team.
  - "Part of your operating cash came early from selling invoices to a factor: use the Factoring cash-flow timing bridge instead."
you_give:
  - Opening and closing operating working capital, plus the signed acquisition, currency and other noncash movements for the same set of businesses.
  - "The period end, plus the currency and scale used for the working capital investment."
  - "Your spreadsheet tool, if you want the working capital investment as a workbook."
you_get:
  - The operating investment in working capital for the period, and the matching cash-flow effect with its sign.
  - "An editable workbook of the working capital investment, with its inputs, formulas and test cases to rerun."
  - "A tie-out of the balance change and the noncash movements, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the balance sheets and the notes on acquisitions, currency and write-offs."
  - "Tell it what you need: the cash put into operating working capital after noncash movements are removed."
  - "Ask it to stop and mark MISSING if an acquisition, currency or write-off figure from the notes is not in your sources."
  - "Check that balance sheet changes are not treated as cash before acquisitions and currency are removed, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Opening and closing operating working capital
    - Acquisition, currency and write-off movements, with signs, from the notes
    - Reporting date, currency and scale
    - Accounting basis and fiscal calendar
    - Your spreadsheet tool and the file format you want (optional)
  prerequisites:
    - An AI that can create and open spreadsheet files
    - Node.js 20 or later, only to run the bundled calculation check (optional)
  output:
    - name: Scope and dated sources
      contains: The period, currency, scale and the dated sources used for each input.
    - name: Inputs and assumptions
      contains: Every opening, closing and noncash figure with its source, sign and any assumption made.
    - name: Model calculations and reconciliations
      contains: The bridge from balance change to operating investment and the signed cash-flow effect, with reconciliation results.
    - name: Actual file verification
      contains: "Which workbook checks ran: recalculation, changed-input test, rendering and reopening the saved file."
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs that could not be found and checks that failed or could not run, or none.
how_it_works:
  - title: Defines the measure
    text: Sets operating working capital the same way at both dates, leaving out cash, financing and tax balances.
  - title: Takes out noncash movements
    text: Lists acquisitions, currency translation and write-offs from the notes with signs, and subtracts them from the balance change.
  - title: Gives the cash effect
    text: Reverses the sign of what is left to show the cash-flow effect, then reconciles opening to closing with no plug.
output_shape: |-
  Operating investment in working capital and its signed cash-flow effect
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING lines
  CHECKS MISSED
tweaks:
  - what: "Period end"
    how: "Take the period end from the balance sheets and the notes on acquisitions, currency and write-offs. Use one currency and scale on every line."
  - what: "Acquisition and currency movements"
    how: "Change the acquisition and currency movements and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Balance-sheet changes are not treated as cash movements before removing acquisitions and FX.
judge:
  - Balance-sheet changes are not treated as cash movements before removing acquisitions and FX.
  - Increases and decreases use an explicit sign convention; no unexplained item becomes a balancing plug.
  - Tie all inputs to source notes, dates, currency, scale and signs.
  - Retain reported figures beside analytical adjustments and list every unresolved source gap.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one working capital investment you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define operating working capital into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
