new_slug: nonparticipating-preference-checker
name: Nonparticipating preference checker
headline: Nonparticipating preference checker
summary: See what a preferred investor takes from a sale, money back or conversion to common, whichever pays more, and what is left for common holders.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it the cash available to shareholders and the terms of one preferred share class. It works out the money-back payout and the payout if the investor converts to common. You get the larger payout, and what is left for common holders.
explain: |-
  Investors in a startup often hold preferred shares. In a sale, a nonparticipating investor has two choices. They can take their money back first, which is the preference. Or they can convert to common shares and take their ownership share of everything. They cannot do both. This nonparticipating preference checker works out both and picks the larger.

  The investor's payout can never be more than the cash available. So the skill takes the larger of the two claims, caps it at the cash on hand, and gives the rest to common holders. It also shows the switch point. That is the sale amount where converting starts to pay more, which is the preference divided by the ownership share.

  Practice numbers, not a real deal: 100 invested, a 1x preference and 20% ownership if converted. At 300 of proceeds, the preference pays 100 and converting pays 60. The investor takes 100, and common holders share 200. At 1,000, converting pays 200, which beats 100. Common holders share the other 800. The switch point is 100 / 20% = 500.
when:
  - A term sheet gives your investor a 1x preference with no participation, and you want their payout at a given sale price.
  - You want to find the sale price where converting to common starts to beat the money back.
  - A founder asks how much is left for common holders after one preferred class takes its pick.
  - You are checking a lawyer's or accountant's payout table against the share terms.
not_for:
  - The investor also shares in what is left after the money back. Use the Capped participation checker.
  - Two or more preferred classes rank against each other, or the terms add dividends that pile up. This covers one class with no dividends. Ask a lawyer or build a full payout table.
  - You want the cash that reaches shareholders after debt and deal costs. Use the Closing equity proceeds checker first, then bring its result here.
you_give:
  - The cash available to shareholders after debt and any claims that rank ahead (from the sale agreement)
  - The amount the investor paid for this class of preferred shares (from the term sheet or share purchase agreement)
  - The preference multiple, such as 1x (from the share terms)
  - The investor's ownership share if they converted to common (from your cap table)
  - Your own payout spreadsheet (optional)
you_get:
  - The money-back payout and the payout if the investor converts
  - Which choice pays more, and the investor's final payout
  - What is left for common holders
  - The sale amount where converting starts to win
  - A list of missing facts and checks it could not run
  - A small workbook with the same sums, if your AI can make files
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it into a new chat. A chat is enough. You do not need to run code.
  - Paste the share terms, the amount invested, the preference multiple, the ownership share and the cash available. Say the currency and units, such as USD thousands. Attach the term sheet page if you can.
  - Ask in plain words, such as what does the investor get at 300 of proceeds, and when does converting win?
  - Check one line yourself. The money-back route is the amount invested times the multiple. The convert route is the ownership share times the cash available.
  - Read MISSING and CHECKS MISSED before you use any figure. Run a second sale amount to see the choice flip.
how_it_works:
  - title: Checks the terms fit
    text: Confirms one senior preferred class, a right to convert, no participation and no dividends that pile up. If not, it stops and says so.
  - title: Works out both claims
    text: Amount invested times the preference multiple is the money-back claim. Cash available times the ownership share is the convert claim.
  - title: Picks the larger
    text: Takes the larger claim, capped at the cash available, as the investor's payout.
  - title: Gives the rest to common holders
    text: Cash available less the investor's payout goes to common holders. The two payouts add up to the cash available.
  - title: Marks the gaps
    text: Writes MISSING for any number it was not given. It never fills a gap with zero.
output_shape: |-
  RESULT
  Investor takes <money back or convert> | Investor payout <amount> | Common holders <amount> | Converting wins above <amount>

  SCOPE AND SOURCES
  <currency and units; source and date for each input>

  INPUTS AND ASSUMPTIONS
  <cash available, amount invested, preference multiple, ownership share>

  CALCULATIONS AND TIES
  <money-back claim, convert claim, the larger, the cap at cash available, and the tie of both payouts to cash available>

  FILE CHECK
  <what was recalculated in the workbook, or "no workbook made">

  MISSING
  <list>

  CHECKS MISSED
  <one line per check not done, or none>
output_sample:
  input:
    - The cash available to shareholders after senior claims
    - The amount the investor paid for the preferred shares
    - The preference multiple, such as 1x
    - The investor's ownership share if converted
    - Your own payout spreadsheet (optional)
  prerequisites:
    - The term sheet or share terms that set the preference and the right to convert
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: RESULT
      contains: Which choice the investor takes, the investor's payout, what common holders get and the switch point.
    - name: SCOPE AND SOURCES
      contains: The currency and units, with the source and date of each input.
    - name: INPUTS AND ASSUMPTIONS
      contains: Each number you gave it and each assumption, kept apart from facts.
    - name: CALCULATIONS AND TIES
      contains: Both claims, the larger one, the cap at cash available, and a check that both payouts add up.
    - name: FILE CHECK
      contains: What was recalculated in the workbook, or a note that none was made.
    - name: MISSING
      contains: Every number it needed and did not get. It never fills one with zero.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
tweaks:
  - what: A higher sale price
    how: Try a larger cash amount. Above the switch point, converting wins and the common share rises with it.
  - what: A 2x preference
    how: Change the multiple. The money-back claim doubles, and the switch point moves up with it.
  - what: A sale below the money-back claim
    how: Try a small cash amount. The investor takes all of it, and common holders get nothing.
judge:
  - Preferred plus common proceeds equals available equity proceeds.
  - A preference cannot pay more than available proceeds.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can do these sums in a chat.
    - name: An AI that can make spreadsheet files
      why: It can build the workbook, recalculate it and check that it reopens.
    - name: Node.js 20 or later (optional)
      why: Runs the small script that comes with the skill, for a second check of the numbers.
  inputs:
    - The page of the term sheet or share terms that sets the preference and the right to convert
    - The cap table that shows the investor's ownership share
    - A named reviewer and the question you want answered
terms:
  - term: Preferred shares
    meaning: Shares that get paid before common shares in a sale.
  - term: Preference
    meaning: The money an investor gets back first, often the amount they paid in.
  - term: Nonparticipating
    meaning: The investor takes the preference or converts, not both.
  - term: Convert to common
    meaning: Swap the preferred shares for common shares and take an ownership share of all the cash.
  - term: Common shares
    meaning: The ordinary shares held by founders, staff and others, paid after preferred shares.
  - term: Illustrative figures
    meaning: Practice numbers that show how the sums work. They are not a real deal.
