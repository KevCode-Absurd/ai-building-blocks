new_slug: normal-earnings-estimator
name: "Normal earnings estimator"
summary: "Find normal earnings for a company from 5 to 10 years of results. You get low, normal and high figures, and a range only if the checks pass."
job: money-and-investing
thinking: high
thinking_why: "It chooses a window, applies rules about when the latest year can stand alone and builds a range from judgment. That needs careful reasoning."

headline: "Normal earnings estimator"
subhead: "Share five to ten years of cleaned earnings and the reliability rating. It compares averages and candidate low, normal and high figures. You get a range only if the source checks pass and the figures are in order. Conflicting candidates stay unresolved rather than being forced into a valuation."

explain: |
  It checks the reliability rating, uses a stated share count and compares earnings over five to ten years. It shows averages with actual losses and with loss years at zero. The latest year needs specific evidence before it can stand alone.

  The low, normal and high candidates must satisfy LOW <= NORMAL <= HIGH. If they cross, you get the separate calculations and a failed check, not a manufactured range. Do not sort or clamp figures to make them fit. This order guard is a platform adaptation; the historical source credit stays intact. The method gives analysis rather than personal investment advice.

when:
  - You need one earnings figure to value a business and have several years of results.
  - The latest year is far from the earlier ones and you cannot decide how to treat it.
  - You want a range, not a single number.
not_for:
  - "You have no earnings record yet or fewer than five years of results: gather the years first, or value the business from its assets with a licensed financial adviser."
  - "Your earnings are not cleaned yet or you have not rated how reliable they are: first use the Earnings record reliability checker."
  - "You want a buy or sell call, or a decision on your own savings: ask a licensed financial adviser, because this gives analysis only."

you_give:
  - Cleaned and restated earnings by year, five to ten years
  - The reliability rating from "Earnings record reliability checker"
  - Share counts by year (optional)
you_get:
  - The window and share count used
  - Averages with loss years in and at zero
  - A statement of whether the latest year was used alone, and why
  - Candidate low, normal and high earnings per share and in total, each with a reason
  - A range-order result and a validated range only after all source and order checks pass

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the cleaned earnings and the rating from the earlier step.
  - Add the share count for each year if you have it.
  - Read why it did or did not use the latest year.
  - Take a validated range to the valuation step only after the source and order checks pass. If they fail, resolve the candidates first.
output_sample:
  input:
    - Your cleaned earnings for each of the last 5 to 10 years
    - The reliability rating from the Earnings record reliability checker
    - Your share counts by year (optional)
  prerequisites:
    - Cleaned earnings from an earlier cleaning step
    - A reliability rating from the Earnings record reliability checker
  output:
    - name: BASIS
      contains: The years used, the share count and where it came from, and the reliability rating you gave.
    - name: AVERAGES
      contains: Averages with loss years at real value and at zero, plus the five-year and ten-year averages.
    - name: LATEST YEAR
      contains: Whether the latest year was used alone, and which of the three conditions held or failed.
    - name: CANDIDATE EARNINGS PER SHARE
      contains: Low, normal and high figures, each with its reason, per share and in total.
    - name: RANGE ORDER
      contains: PASS or FAIL with the actual inequality, and a range only when the checks pass.
    - name: LIMITS
      contains: "What affects the estimate: source coverage, loss treatment, year choice and open assumptions."
    - name: MISSING
      contains: Facts you did not give, marked so nothing is invented.
    - name: CHECKS MISSED
      contains: One line for each check that failed, or none.

how_it_works:
  - title: Checks the rating
    text: Stops if the record is rated not a guide, and says value must come from assets.
  - title: Restates per share
    text: Puts every year on today's share count.
  - title: Chooses the window
    text: Uses five to ten years, usually seven, and shows the others.
  - title: Averages two ways
    text: Shows loss years at real value and set to zero.
  - title: Tests the latest year
    text: Uses it alone only if three conditions hold.
  - title: Caps the figure
    text: Holds it at what a normal year has already produced.
  - title: Checks the candidate order
    text: Keeps low, normal and high statistics separate until LOW <= NORMAL <= HIGH passes. Conflicting candidates stop the range and valuation handoff.

output_shape: |
  BASIS
  Window: <years> | Share count: <n and source> | Rating from the earlier step: <rating>

  AVERAGES
  Loss years real: <amount> | Loss years at zero: <amount> | Five-year: <amount> | Ten-year: <amount>

  LATEST YEAR
  Used alone: <yes / no> | Not a boom: <yes / no> | Rising for years: <yes / no> | Industry supports growth: <yes / no>

  CANDIDATE EARNINGS PER SHARE
  LOW: <amount> because <reason>
  NORMAL: <amount> because <reason>
  HIGH: <amount> because <reason>
  In total: <low> / <normal> / <high>

  RANGE ORDER
  <PASS / FAIL> | <actual inequality>
  <validated range only after source/order checks pass, or NO VALID ORDERED RANGE>

  LIMITS
  <source coverage, loss treatment, year selection and unresolved assumptions>

  MISSING
  <facts not given>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: Window length
    how: Say how many years you want. Seven is the usual choice.
  - what: Boom years
    how: Name years you think were unusually good for business. The skill then keeps them out of the high case.
  - what: Share count
    how: Give today's count and any splits. Per-share figures depend on it.
  - what: Industry view
    how: Say what you know about the industry's outlook. It decides whether the latest year can stand alone.

judge:
  - The rating is applied first, and a not a guide record gets no figure.
  - Both averages are shown.
  - The latest year is used alone only when all three conditions are met.
  - No trend is projected past what a normal year has shown.
  - It never says buy or sell and invents no figure.
  - LOW <= NORMAL <= HIGH is tested. Crossed candidates remain separate and block any approved range or valuation handoff; no sorting or clamping.

test:
  - Give it a record with one loss year and check both averages appear.
  - Give it a record with a record-high last year and see that it is not used alone.
  - Give it a not a guide record and see that it stops.
  - Use [1, 2, -1, 3, 2] with GUIDE. Low 2/3, normal 8/5 and high 4/3 must fail order and stop range/valuation. Never reorder them.
  - Use [1, 2, 1, 3, 4] with GUIDE. The candidate order 4/3 <= 11/5 <= 8/3 passes, subject to source checks.

improve:
  - Add your own rule for which years count as boom years.
  - Keep a record of ranges and what the company later earned.
  - Pair it with "Earnings record reliability checker" and "Earnings value range builder".
  - Run it on three similar companies and compare the ranges.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Choosing a window and building a range is text work."}
    - {name: "A spreadsheet", why: "Handy for averages and the worst and best three-year runs."}
    - {name: "A licensed financial adviser", why: "Needed for a large or personal decision. This skill is a method, not advice."}
  inputs:
    - "Cleaned earnings by year"
    - "Share counts and any splits"

terms:
  - term: Normal earnings
    meaning: What a business earns in an ordinary year of trade, not a boom and not a slump.
  - term: Earnings per share
    meaning: A company's profit divided by the number of shares, so you can compare it with the share price.
