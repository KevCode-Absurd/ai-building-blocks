new_slug: oci-reclassification-bridge
name: OCI reclassification bridge
headline: OCI reclassification bridge
summary: Check that moving an amount between OCI and profit leaves total comprehensive income unchanged. Get a signed, after-tax reclassification table.
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: An after-tax profit/OCI reclassification table with a comprehensive-income conservation check. Share profit before a specific reclassification, OCI before it, signed after-tax reclassification and source notes on recycling eligibility.
explain: |-
  An after-tax profit/OCI reclassification table with a comprehensive-income conservation check.

  Issuer accounting and earnings. Illustrative figures. Recycling5 into profit changes80/20 profit/OCI to85/15; total remains100. A signed loss of10 produces70/30 and still100. The calculation does not establish whether recycling is permitted.
when:
  - You need an after-tax profit/OCI reclassification table with a comprehensive-income conservation check.
  - You work on issuer accounting and earnings and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You need to know if the standard lets you recycle an amount to profit: read the accounting standard first, or ask your auditor."
  - "You need to review an OCI reserve balance or its valuation: use a separate reserve or valuation review, or ask your accountant."
  - "You need to track tax or owner transactions: keep these in your own schedules, because this bridge leaves them out."
you_give:
  - Profit before a specific reclassification, OCI before it, signed after-tax reclassification and source notes on recycling eligibility.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - An after-tax profit/OCI reclassification table with a comprehensive-income conservation check.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
output_sample:
  input:
    - Profit before the reclassification
    - OCI before the reclassification
    - The signed after-tax amount being reclassified
    - Source notes showing the amount may be recycled
    - Reporting date, currency and scale
  prerequisites:
    - An AI that can create and read spreadsheet files, if you want a workbook
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Reclassification table
      contains: Profit and OCI before and after the after-tax amount, with equal and opposite signs.
    - name: Comprehensive-income check
      contains: Total comprehensive income before and after, showing it does not change.
    - name: Scope and dated sources
      contains: The sources, dates, currency, scale and accounting basis the work relies on.
    - name: Inputs and assumptions
      contains: Every input with its source, sign and reporting period, kept apart from assumptions.
    - name: Model calculations and reconciliations
      contains: The workings and the checks that tie opening and closing balances.
    - name: Actual file verification
      contains: Which workbook and script checks ran, and what they found.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and checks that failed or could not run.
how_it_works:
  - title: 1. Identify the reserve and whether the applicable standard permits recycling to profit; distinguish reclassification from a new fair-value or actuarial movement
    text: Identify the reserve and whether the applicable standard permits recycling to profit; distinguish reclassification from a new fair-value or actuarial movement.
  - title: 2. Apply the same after-tax signed amount positively to profit and negatively to OCI, or reverse both signs for a loss recycling
    text: Apply the same after-tax signed amount positively to profit and negatively to OCI, or reverse both signs for a loss recycling.
  - title: 3. Reconcile total comprehensive income before and after; keep tax and any owner transactions outside the reclassification proof
    text: Reconcile total comprehensive income before and after; keep tax and any owner transactions outside the reclassification proof.
output_shape: |-
  An after-tax profit/OCI reclassification table with a comprehensive-income conservation check.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: After-tax signs are equal and opposite in profit and OCI.
judge:
  - After-tax signs are equal and opposite in profit and OCI.
  - Non-recyclable balances such as specified pension remeasurements are not assigned a fictional recycling entry.
  - Tie all inputs to source notes, dates, currency, scale and signs.
  - Retain reported figures beside analytical adjustments and list every unresolved source gap.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
