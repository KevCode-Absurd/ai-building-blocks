new_slug: odd-one-out-image-ad-maker
name: "Odd-one-out image ad maker"
summary: "Paste your story ad. Get a photo prompt of one odd thing and a score out of 100."
job: make-image-ads

headline: "Odd-one-out image ad maker"
subhead: Give it your story ad. It finds one ordinary thing in the first lines that doesn't fit, such as a thing in the wrong place, and checks the story explains it. You get a photo prompt of just that, a line under the image and a score out of 100.

explain: |
  In a crowded market every ad shows the same pain: the same tired face, the same messy kitchen. Readers learn to skip it. This skill takes another route. It finds one small thing in your story that doesn't fit, like a shaker bottle full of pens, and makes the whole picture about it. People get curious when they notice a small gap they feel they could close, and the only way to close this one is to read.

  It names the kind of mismatch (wrong use, wrong place, wrong time or wrong amount) and runs a one-second test: a stranger can name the thing at once but can't say why it's like that. Then it checks your story's first two lines explain it, because a puzzle the story doesn't answer feels like a trick. The picture shows only that thing, where it sits, with plain surroundings and no product.

when:
  - Every rival in your market shows the same problem photo, and yours blends in.
  - A story ad already works and you want a fresh picture to test against it.
  - Your story's opening has one strange, specific detail that makes people ask why.

you_give:
  - Your approved story ad, with its first lines
  - Where and when the problem shows up for the buyer (optional)
  - Whether you want a few words on the picture (optional, off by default)
you_get:
  - The mismatch, its kind, and the line of your story that explains it
  - Where it sits, how close to shoot it and what surrounds it
  - A short line to run under the image that doesn't give the answer away
  - A 60 to 120 word image prompt, ready to paste
  - A score out of 100 from the skill's five checks, with one line per check missed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad underneath. The odd detail should be in the first two or three lines.
  - Say whether you want a few words on the picture. If you're not sure, ask for both versions.
  - Paste the image prompt into your image tool and make one square picture.
  - Show it to someone who hasn't read the story. They should name the thing but not know why.

how_it_works:
  - title: Sets the house rules
    text: Square, looks taken on a phone, no logo, price, button, brand colour or product, and any person is a made-up adult.
  - title: Finds the mismatch
    text: One ordinary thing from the first lines used the wrong way, in the wrong place, at the wrong time or in the wrong amount.
  - title: Runs the one-second test
    text: A stranger can name the thing at once but can't say why. Too vague shows more; too obvious isn't odd enough.
  - title: Checks the story closes it
    text: The first two lines must explain the mismatch, or the click feels like a trick and it picks another.
  - title: Shoots only that
    text: Where it really sits, close enough to read, with plain surroundings and nothing that hints at an event.

output_shape: |
  SCENE               <what someone scrolling would say they saw>
  THE MISMATCH        <wrong use | wrong place | wrong time | wrong amount>
                      closed by: "<the story line that explains it>"
  WHERE AND WHEN      <place, time of day, what surrounds it>
  FRAMING             <how close, where it sits in the frame>
  WORDS ON THE IMAGE  <none, or 3 to 6 lifted words>
  BLANK VERSION       <only if it has words>
  LINE UNDER IMAGE    <words> (<caption line>, <characters>)
  FLAGS               <lifted or written words; anything inferred>
  IMAGE PROMPT        <60 to 120 words, ready to paste>
  SCORE               <n>/100 (<passed> of 5 checks) | missed: <one line each>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on reviews 1 and 3):
    My old shaker bottle holds pens now.
    There's still a green ring at the bottom.
    I was paying $94 a month for a greens powder that was gritty and
    chalky, and I rinsed that shaker every morning until I didn't.
    The issue was never what was in the powder. It was sticking with
    it.
    Sprout is one daily pack: tear the top, eat the small handful of
    gummies inside. 60+ ingredients, 21 vitamins and minerals, 6 g
    prebiotic fiber. No water, no shaker.

    Words on the image: yes, if they help.
  output: |
    SCENE               A plastic shaker bottle full of pens on a desk,
                        with a faded green ring at the bottom.
    THE MISMATCH        Wrong use. Closed by: "My old shaker bottle
                        holds pens now. There's still a green ring at
                        the bottom."
    WHERE AND WHEN      A home desk, morning, window light. Around it:
                        the bare desk and the edge of a closed notebook.
    FRAMING             Centre frame, close enough to see the ring
                        through the plastic.
    WORDS ON THE IMAGE  "holds pens now." (3 words, from the first
                        line), small and white in the top-left corner,
                        like a caption added in a phone editor.
    BLANK VERSION       The same shaker and pens with no words.
    LINE UNDER IMAGE    Retired, never rinsed. (plain caption, 22)
    FLAGS               Words lifted from the copy. The caption rests
                        on the story's green ring. The shaker is plain
                        and unbranded, never a powder brand's. No tub,
                        scoop, pack or gummies in frame.
    IMAGE PROMPT        Square 1:1 phone photo of a clear plastic shaker
                        bottle with its lid off, standing on a plain
                        home desk in morning window light. It is
                        stuffed with pens and one pencil. Inside,
                        around the bottom, a faded green ring of dried
                        powder. The shaker sits centre frame, close
                        enough to see the ring, with only the bare desk
                        and the edge of a closed notebook around it.
                        Slight tilt, a little grain, ordinary and
                        unstyled. Small plain white caption in the
                        top-left corner, as if added in a phone's photo
                        editor, reading "holds pens now."

tweaks:
  - what: Which mismatch
    how: Ask for a different kind, such as "wrong amount" (three half-used tubs in a row) from the same story. The strongest are things people own but use the wrong way.
  - what: Words or no words
    how: Without words the picture is a pure puzzle. Three to six words from your copy tell the reader there's a story behind it. Make both and test them.
  - what: How close
    how: Closer makes it stranger. Say "fill half the frame" if it shows too much room around the thing.
  - what: Too strange
    how: If testers can't name the thing at all, ask for "a little more of the room in view". It must be odd, not unreadable.

judge:
  - There's exactly one mismatch, and nothing else competes with it.
  - Your story's first two lines explain it.
  - It hints at nothing that didn't happen in the story, such as an accident.
  - There's no product and no shock value.
  - The line under the image doesn't give the answer away, and any words on the image come from your copy.

test:
  - Show the picture to two people who haven't read the story. Both should name the thing, and neither should know why.
  - Run it twice on the same story. It should pick the same mismatch. If not, your opening has two details competing; cut one.
  - Give it a story whose first lines don't explain the detail. It should say so and pick another.
  - Put it next to your snapshot ad for the same story and ask which makes people want to read the text. Don't say which is new.

improve:
  - Keep a short list of mismatches that worked for you in step 2 of the skill file, so it tries those first.
  - Add anything your brand never shows (mess, food, bathrooms) to the house rules.
  - Write the odd detail into your story's first line on purpose when you draft it.
  - Pair it with the snapshot skill. Run the snapshot first to learn which problem buyers stop for, then this as the fresh test.

works_best_with:
  tools:
    - {name: "GPT Image", why: "Follows long, specific scene descriptions, which an unusual pairing like pens in a shaker needs."}
    - {name: "Nano Banana", why: "Follows named light and lens terms, which keeps an odd object looking like an ordinary phone photo."}
  inputs:
    - "A real photo of the odd thing if you or a customer has one, so the image tool can match it"
    - "Two or three reviews that mention what buyers did with the old thing, so the mismatch is one they lived"
    - "Your current best story ad picture, so the new one can be tested against it"

terms:
  - term: Mismatch
    meaning: An ordinary thing used the wrong way, in the wrong place, at the wrong time or in the wrong amount.
  - term: Story ad
    meaning: An ad whose main text tells one person's story, like a post from a friend.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
