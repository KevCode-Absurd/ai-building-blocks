new_slug: offer-reel-real-product
name: "An offer video with your product and price exactly right"
summary: "Make an offer video from your real product photos, approved words and price. You get a 10 to 20 second reel in each shape you need."
job: make-video-ads
thinking: high
thinking_why: "It runs several skills in a row. Give it your strongest model."

headline: "An offer video with your product and price exactly right"
subhead: Give it your real product photos, approved words, colours, fonts and offer. It makes your product the star, sets a style guide, plans a beat-timed storyboard for you to approve and builds the reel in code. It reviews the rendered frames at least three times, then hands you the video in each shape.

explain: |
  AI video tools often get wrong the one thing you can't afford to: the product. The label smudges, the pack changes shape, the colour drifts. In a launch or offer reel, the whole point is "this product, this price", so that's a real problem.

  This skill builds the reel in code instead, with a tool such as Remotion, and follows the same stages as any video, with your product as the avatar. You approve a product card first, then a product sheet made from your real photos and a style guide with your own fonts and colours. Next comes the storyboard: a beat grid and a shot list, where every word you've approved moves to a music beat that is also made in code and measured. It stops until you reply APPROVED. After the build, a separate reviewer scores the rendered frames at phone size, with the app's covered areas marked, over at least three rounds before you see anything. It's made for offers, launches and short lists of reasons, not demos or stories.

when:
  - You're launching a product or an offer and need a short reel in your exact brand look.
  - AI-generated video keeps getting your pack or label wrong.
  - You need the same reel in several shapes (tall for Reels and Stories, 4:5 for feeds).
not_for:
  - "You need a demo that shows the product in use: film real footage instead, or ask a video editor."
  - "You want a story told by a person: film the person, or use the Video ad script writer from customer quotes to plan it."
  - "You have no computer that can run code: a simple video editor such as Canva or CapCut is an easier fit."

you_give:
  - What the reel is for (launch, offer, reasons, bundle, closing card)
  - Real product photos (the front on a clean background, plus unpacked, in a hand, in use)
  - Approved words in order, with sources for claims, prices and offers
  - Your colours, font files and logo file
  - Length, shapes, music and voice (optional)
you_get:
  - A filled brief and a product card to approve
  - A product sheet from your real photos, a style guide and lock lines to approve
  - A beat-timed storyboard with every claim's source, which you approve before anything is built
  - The film's code, a review log and final videos in each shape, with loudness and scores

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. It needs a coding agent that can run code on your computer, such as Claude Code with Remotion.
  - Give it your photos, approved words, colours, font files and logo, and answer the one round of questions.
  - Approve the product card, then the product sheet and style guide.
  - Read the storyboard carefully, then reply APPROVED or ask for changes.
  - Wait for the review rounds to finish before judging the reel. For later changes, ask it to update the storyboard first, then rebuild.
output_sample:
  input:
    - What the reel is for, such as a launch, offer, 3 reasons, bundle or closing card
    - Your real product photos, with the front on a clean background
    - Your approved words in order, with a source for each claim, price and offer
    - Your colours, font files and logo file
    - Length, shapes, music and voice (optional)
  prerequisites:
    - A coding agent that can run code on your computer, such as Claude Code with Remotion
    - Your brand brain from the Brand profile builder
    - A video ad script from the Video ad script writer from customer quotes
  output:
    - name: Brief
      contains: Your purpose, words, offer, length, shapes, music and voice, with anything blank marked MISSING.
    - name: Product card
      contains: The product variant, which photo does which job, and what never changes. You approve it.
    - name: Photo picks
      contains: The hero photo and the photos chosen for each reason.
    - name: Product sheet and style guide
      contains: Clean cut-outs of your photos, colours, type sizes, ways in and out, and lock lines. You approve them.
    - name: Storyboard
      contains: A beat grid and shot list with on-screen words, photos, motion, sound and a source for every claim.
    - name: Review log
      contains: Each review round with its scores and the fixes made, until every score is 8 or more.
    - name: Final videos
      contains: The reel in each shape, with loudness, scores, a contact sheet and anything left imperfect.

how_it_works:
  - title: Fills the brief
    text: Reads your brand file first and asks only for what's blank, in one round. A missing photo is asked for, never generated.
  - title: Makes the product the avatar
    text: A product card naming the variant, which photo does which job and what never changes. You approve it.
  - title: Builds the sheets
    text: Clean cut-outs of your real photos, a style guide with colours, type sizes and ways in and out, and lock lines. You approve them.
  - title: Storyboards to the beat
    text: Makes the music in code, measures its beats, and writes a shot list with a source for every claim. Nothing is built until you say APPROVED.
  - title: Builds the film
    text: Real photos only, never redrawn. Something new every two to four seconds, an end card of two seconds or less.
  - title: Reviews rendered frames
    text: At least three rounds by a separate reviewer, scored on the real output, until every score is 8 or more.
  - title: Delivers every shape
    text: Final videos with loudness, scores, a contact sheet and anything knowingly left imperfect.

