new_slug: one-bold-move-picker
name: "One bold move picker"
summary: Pick the one move to back from your marketing plan. Get a stop list for the rest, what it costs and a pass or fail test with a date.
job: plan-strategy
thinking: high
thinking_why: "It has to compare rivals' weak spots and judge which one move beats the rest, so deeper thinking gives a sharper pick."

headline: "One bold move picker"
subhead: Paste your plan or list of moves, your rivals and your budget if you know it. It finds where each rival is least ready and scores each move on four tests. You get one move to back, a stop list for the rest, a money check and a pass or fail test with a date.

explain: |
  Plans tend to grow into a list of small efforts, each done well. The idea behind this skill is that in any one situation, a single move produces the big result. It is usually aimed where the rival does not expect you. Spread the same money over ten moves and none is strong enough to reach the buyer.

  The skill scores each move on four yes or no tests. Does it hit a real rival weak spot? Does it feed the one idea you own? Would the rival fail to expect it, or need a year to copy it? Can you say it to a buyer in one sentence? It picks the winner and turns every other move into a park or a cut.

  It then checks that something you already sell is not blocking the move, and prices the move. It names an owner who stays close to customers, and sets a pass or fail test with a date. A move that fails is dropped early, not rescued. The method draws on Al Ries and Jack Trout's laws of marketing.

when:
  - Your plan has many moves and each gets a thin slice of money.
  - You are chasing a bigger rival and cannot tell where to hit.
  - A fix list from a review has more items than you can do.
  - You keep adding campaigns instead of choosing one.
not_for:
  - "You have one campaign to plan, not a choice between moves: use the Focused marketing planner."
  - "You have no plan or fix list yet: run the Marketing strategy reviewer first to get one."
  - "Your product is brand new and has no rivals yet: use the First market picker."
  - "You want a plan checked against rules, not a move picked: use the Marketing strategy reviewer."

you_give:
  - Your plan, or a list of three to eight moves you are considering
  - Your rivals and what each is known for (optional)
  - A fix list from the Marketing plan law checker (optional)
  - Your budget, as a number or a range (optional)
  - The one word or idea you own, or want to own (optional)
you_get:
  - Where each rival is least ready, with a source or a marked guess
  - A score out of four for each move
  - The one move to back, in one sentence a buyer would understand
  - "A stop list: every other move parked or cut, and the money that frees"
  - A money check, a named owner and a pass or fail test with a date

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it into a new chat. It needs no files, web access or paid tools.
  - Paste your plan. If you have a fix list from the Marketing plan law checker, paste that too.
  - Add your rivals and what each is known for. Add your budget, or say you do not know it.
  - Read the one-sentence move. Say it to three buyers and see if they repeat it back.
  - Check the owner. It should be someone who can decide and who still talks to customers.
  - Hold the owner to the pass or fail test on its date. If it fails, drop or change the move.

how_it_works:
  - title: Collects the candidates
    text: Lists every move in the plan and in the fix list.
  - title: Finds rival weak spots
    text: For each rival, finds where its strength stops it, and where it has said it will not go.
  - title: Scores four tests
    text: Hits a weakness, feeds your one idea, is unexpected, and can be said in one sentence.
  - title: Picks one
    text: Chooses the highest score and says why it beats the second.
  - title: Writes the stop list
    text: Marks every other move park or cut and adds up the money that frees.
  - title: Checks the blocker
    text: Looks for something you sell or say today that would confuse the move.
  - title: Prices and owns it
    text: Compares money needed with money you have, names an owner and sets a test with a date.
  - title: Checks itself
    text: Runs its own checks and names any it missed.

output_shape: |
  WHERE EACH RIVAL IS LEAST READY
  <rival> | Its strength: <x> | What that stops it doing: <y> | Evidence: <source or guess>

  CANDIDATE MOVES
  <move> | Hits weak spot: <yes/no> | Feeds your idea: <yes/no> | Unexpected: <yes/no> | One sentence: <yes/no> | Score: <n of 4>

  THE ONE MOVE
  <the move in one sentence a buyer would understand> | Why it beats the next: <line>

  STOP LIST
  <move> | Park or cut | Frees: <amount or MISSING>

  THE BLOCKER
  <what you sell or say today that would confuse the move> | Step back: <what to drop> | Step forward: <the move>

  MONEY
  Needed: <amount and how it was priced> | Available: <amount> | Ratio: <n> | If under 0.5, narrow by: <market, place or channel>

  OWNER AND FRONT LINE
  <name or role> | Visits customers or shops <how often>

  PASS OR FAIL TEST
  By <date>: <measure and threshold> | If it fails: <drop or change, not rescue>

  MISSING
  <facts that would change the pick>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - Your plan or list of moves
    - Your rivals and what each is known for (optional)
    - A fix list from the Marketing plan law checker (optional)
    - Your budget (optional)
  output:
    - name: WHERE EACH RIVAL IS LEAST READY
      contains: Each rival's strength, what it stops them doing, and a source or a marked guess.
    - name: CANDIDATE MOVES
      contains: Each move scored yes or no on four tests, with a total out of four.
    - name: THE ONE MOVE
      contains: The winning move in one sentence a buyer would understand, and why it beats the next.
    - name: STOP LIST
      contains: Every other move marked park or cut, with the money or time it frees.
    - name: THE BLOCKER
      contains: Anything you sell or say today that would confuse the move, with what to drop.
    - name: MONEY
      contains: What the move needs, what you have, the ratio and how to narrow it if money is short.
    - name: OWNER AND FRONT LINE
      contains: One person who decides, and how often they visit customers or shop as one.
    - name: PASS OR FAIL TEST
      contains: A measure, a threshold and a date, plus what happens if it fails.
    - name: MISSING and CHECKS MISSED
      contains: Facts that would change the pick, and any check still failing.

tweaks:
  - what: Candidate moves
    how: List real options, including ones you dislike. A short list of three or four works better than a long one.
  - what: Rival weak spots
    how: Give the words buyers use about each rival. A weakness with no source is marked as a guess.
  - what: Your idea
    how: State the one word or idea you own or want to own. The feed test needs it.
  - what: Budget
    how: Give a number or a range. A real number lets the ratio test run.

judge:
  - Exactly one move is picked, and the rest are parked or cut.
  - The rival weak spot comes from the rival's strength, with a source or a marked guess.
  - The move fits in one sentence a buyer would understand.
  - The money is priced from quotes or marked MISSING, not guessed.
  - The owner is close to customers, and the test has a date and a threshold.

test:
  - Run it on a plan with eight moves. Check it names one and cuts or parks seven.
  - Give it a plan where one move blocks another. See if it finds the blocker.
  - Read the one-sentence move to three buyers. They should repeat it back.
  - Run it twice. The picked move should stay the same or close.

improve:
  - Add a list of moves rivals have already tried, so it doesn't pick a stale one.
  - Add your last three failed moves and why, so the unexpected test learns from them.
  - Set a standing review date, so the test is not forgotten.
  - Pair it with "Long-run effects checker" before you commit money.

works_best_with:
  tools:
    - { name: "Any good chat AI", why: "Comparing rivals and scoring moves is text work any strong chat AI does with this skill." }
  inputs:
    - "Rival websites, reviews and ads"
    - "Your fix list from a plan check"
    - "Quotes for press support and paid media"

terms:
  - term: Stop list
    meaning: The moves you decide not to do now, and the money that decision frees.
  - term: Front line
    meaning: The places where customers meet your product, such as shops, calls and delivery.
  - term: Blocker
    meaning: Something you sell or say today that would make the new move unclear to buyers.
