new_slug: one-symbol-concept-finder
name: "One-symbol concept finder"
summary: "Find the one idea for your poster, cover or video opening. Get a one-line core, one feeling, one symbol and a list of what to leave out."
job: design-work
thinking: medium
thinking_why: "It makes a creative choice among options, but the steps and checks are fixed."

headline: "One-symbol concept finder"
subhead: "Tell it what your poster, cover or video opening is about and where people will see it. It writes the core in one line, names one feeling and picks one symbol. You get strict limits and a list of what to leave out, as a short plan for a designer or an image tool."

explain: |
  Design that tries to say everything says nothing. A poster with six ideas gets a glance and no memory. The hard part is deciding which one idea to carry, and that choice usually gets skipped.

  This skill works backward from the feeling. It writes what the piece is about in one line, then names the one feeling a stranger should have. It lists six objects or shapes that could stand for the idea and picks one. It then sets limits you can check by looking, such as two colours and three shapes. Next it twists the symbol so people look twice, and lists what you are leaving out on purpose.

  The method follows public accounts of how the designers Saul Bass and Paul Rand worked. It is our reading of their approach, not their words. You get a plan, not a picture. A designer or an image tool draws it.

when:
  - "You are about to brief a poster, cover, logo or event graphic and have too many ideas."
  - "You need the first ten seconds of a video or talk to set one mood."
  - "Your design feels busy and you cannot say what to cut."
  - "A designer asked what the one thing is that this should say, and you had three answers."

not_for:
  - "You want the finished design or its layout. This plans the idea only. For a layout, use the Layout default breaker, then hand the result to a designer."
  - "You are drawing the letters of a name. Use the Wordmark sketch planner."
  - "You already have several logo ideas and want to pick one. Use the Logo strength tester."
  - "You need a whole brand identity for many places. Use the Identity system planner."

you_give:
  - "What the piece is about, in a few sentences (required)"
  - "Where people will see it and for how long, such as a poster glanced at for two seconds"
  - "Fixed items such as colours, logo or required words (optional)"
you_get:
  - "The core in one line and the one feeling it should set"
  - "Six symbol options, with the one chosen and why"
  - "Limits for shapes, colour and motion that you can check by looking"
  - "A twist that makes the symbol look new"
  - "A list of what to leave out and why"

how_to_use:
  - "Open the skill in your AI, or copy it and paste it in."
  - "Paste what the piece is about, where it will be seen and any fixed items. If you give no subject at all, the skill asks for it and stops."
  - "Read the core line first. If it is wrong, say so and run it again before looking at the symbol."
  - "Check the limits against your fixed items, then pick the symbol or ask for a different one."
  - "Pass the plan to your designer, or to an image tool such as ChatGPT or Gemini to draw it."

how_it_works:
  - title: "Writes the core"
    text: "One sentence that says what the piece is about, not what happens in it."
  - title: "Names the feeling"
    text: "One plain feeling word, tied to the core."
  - title: "Lists symbols"
    text: "Six options, each with what it says and what it might say by mistake."
  - title: "Picks and hints"
    text: "Chooses one symbol and plans how to hint at the hard parts."
  - title: "Sets limits"
    text: "Shapes, colours and moves, written so you can check them."
  - title: "Makes it strange"
    text: "One way to break or change the symbol so people look twice."
  - title: "Times the motion"
    text: "For moving pieces, sets the beat before any picture."
  - title: "Cuts"
    text: "Lists what to leave out and why, then checks itself."

output_shape: |
  CORE
  <one sentence>

  FEELING
  <one word> because <reason>

  SYMBOL OPTIONS
  1. <object>: says <x>, might say <y>
  ... (six)
  CHOSEN: <symbol> because <reason>
  HINTED, NOT SHOWN: <thing> via <how>

  LIMITS
  Shapes: <n>  Colours: <list>  Moves: <list>  Type: <rule>

  THE TWIST
  <how the symbol is made strange>

  TIMING (if it moves)
  <beat, entry, exit>

  LEFT OUT ON PURPOSE
  - <item>: <reason>

  MISSING
  <gaps>

  CHECKS MISSED
  <lines or none>

tweaks:
  - what: "Where it will be seen"
    how: "A thumbnail needs a simpler symbol than a wall poster. Say the size and the time people have."
  - what: "The feeling you want"
    how: "If you already know it, say so. It saves a round and the symbols fit better."
  - what: "Limits you will accept"
    how: "Tell it the colours or shapes you must use. Fewer fixed items give it more room."
  - what: "Anything off limits"
    how: "Name symbols you have seen too often in your field so it skips them."

judge:
  - "You can say the idea out loud in one sentence."
  - "The chosen symbol would still read at a small size."
  - "The feeling is one word, not a list."
  - "At least three things are left out, each with a reason."
  - "Someone else could check the limits by looking."

test:
  - "Run it on a piece you already made. See if the plan matches the best part of it."
  - "Show the symbol and feeling to a friend for three seconds. Ask what they felt. Compare it with the named feeling."
  - "Run it twice. The core line should stay close even if the symbols change."
  - "Give the plan to a designer and ask what was unclear."

improve:
  - "Add your brand colour and type limits to step 5 so every plan starts inside them."
  - "Add symbols that are overused in your field to a \"skip\" list in step 3."
  - "Save the feelings you pick to your brand file so later pieces stay consistent."
  - "Pair it with an image prompt writer to turn the plan into a prompt."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Choosing and trimming ideas is text work any strong chat AI does well with this skill."}
    - {name: "ChatGPT or Gemini", why: "They draw the picture once you have the plan."}
  inputs:
    - "A one-page brief for the piece"
    - "Two or three pieces you like and why"
    - "Your brand colours and type"
    - "The size and place it will appear"

terms:
  - term: "Symbol"
    meaning: "One simple object or shape that stands for the whole idea."
  - term: "Limits"
    meaning: "Rules you set before designing, such as two colours and three shapes."

output_sample:
  input:
    - What the piece is about, in a few sentences
    - Where people will see it and for how long
    - Fixed items such as colours, logo or required words (optional)
  output:
    - name: CORE
      contains: One sentence that says what the piece is really about.
    - name: FEELING
      contains: One plain feeling word and the reason it fits the core.
    - name: SYMBOL OPTIONS
      contains: Six objects or shapes, each with what it says and what it might say by mistake, and the one chosen.
    - name: LIMITS
      contains: Rules you can check by looking, such as the number of shapes, the colours, the moves and the type.
    - name: THE TWIST
      contains: One way to make the symbol strange so people look twice.
    - name: TIMING
      contains: For moving pieces only, the beat, where the symbol enters and where it ends.
    - name: LEFT OUT ON PURPOSE
      contains: At least three things cut from the first draft, each with a reason.
    - name: MISSING
      contains: Anything you did not give that would sharpen the plan.
