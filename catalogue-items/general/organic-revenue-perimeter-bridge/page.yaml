new_slug: organic-revenue-perimeter-bridge
name: Organic revenue perimeter bridge
headline: Organic revenue perimeter bridge
summary: Separate acquisition, disposal and currency effects from a comparable revenue growth calculation.
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A reported-to-organic revenue bridge with clearly defined comparable bases. Share reported revenues, current acquired revenue, disposed prior-period revenue, signed currency effect and documented comparable perimeter.
explain: |-
  A reported-to-organic revenue bridge with clearly defined comparable bases.

  Issuer revenue and cash-flow reconciliation. Illustrative figures. Prior comparable revenue100-10=90; current comparable130-20-5=105. Growth105/90-1=16.666667%. Acquired revenue15 gives110/90-1=22.222222%.
when:
  - You need a reported-to-organic revenue bridge with clearly defined comparable bases.
  - You work on issuer revenue and cash-flow reconciliation and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Reported revenues, current acquired revenue, disposed prior-period revenue, signed currency effect and documented comparable perimeter.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A reported-to-organic revenue bridge with clearly defined comparable bases.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: 1. Document exactly which businesses, dates and currencies belong in both comparable periods; remove divested or acquired contributions symmetrically where present
    text: Document exactly which businesses, dates and currencies belong in both comparable periods; remove divested or acquired contributions symmetrically where present.
  - title: 2. Strip the supplied acquisition and signed currency effects from current revenue and supplied disposed revenue from the prior base
    text: Strip the supplied acquisition and signed currency effects from current revenue and supplied disposed revenue from the prior base.
  - title: 3. Divide comparable current revenue by comparable prior revenue less one; reconcile every bridge component and avoid labeling a vendor-defined measure universal organic growth
    text: Divide comparable current revenue by comparable prior revenue less one; reconcile every bridge component and avoid labeling a vendor-defined measure universal organic growth.
output_shape: |-
  A reported-to-organic revenue bridge with clearly defined comparable bases.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Acquisition, disposal and FX effects are mutually exclusive and use a documented ordering.
judge:
  - Acquisition, disposal and FX effects are mutually exclusive and use a documented ordering.
  - Comparable prior revenue remains positive and both periods cover the same businesses.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
