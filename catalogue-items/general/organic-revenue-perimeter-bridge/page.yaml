new_slug: organic-revenue-perimeter-bridge
name: Organic revenue perimeter bridge
headline: Organic revenue perimeter bridge
summary: Work out organic revenue growth by taking acquisitions, disposals and currency effects out of reported revenue, with a bridge you can check.
job: track-numbers
thinking: high
thinking_why: "The three adjustments can overlap, so each must have a stated order and source before growth is called organic."
subhead: Give it your reported revenue, the acquired and disposed revenue, and the currency effect. It removes them to find organic growth. You get a bridge you can trace back to each input.
explain: |-
  A reported-to-organic revenue bridge with clearly defined comparable bases.

  Illustrative figures only. Prior comparable revenue: 100 - 10 = 90. Current comparable revenue: 130 - 20 - 5 = 105. Organic growth: 105 / 90 - 1 = 16.67%. If you also take out 15 of acquired revenue, it is 110 / 90 - 1 = 22.22%.
when:
  - You report growth to a board or lender and need to show it without deals and currency swings.
  - You bought or sold a business and need comparable revenue for both periods.
  - A reviewer wants to trace each step of the growth figure back to its source.
  - Currency moves made reported growth look better or worse than trading really was.
not_for:
  - "You only need reported revenue growth from the accounts: compare the two reported figures in a plain spreadsheet."
  - "You cannot document which businesses sit in both periods: ask your finance lead to define the comparable group first."
  - "You need an audit opinion or a legal view on the accounting: use a qualified accountant."
  - "You only need to split growth into real growth and the currency effect: use the Revenue growth currency checker instead."
you_give:
  - Reported revenue for the current and prior period.
  - Revenue from acquired businesses in the current period, with dates.
  - Revenue from disposed businesses in the prior period, with dates.
  - The currency effect, with its sign.
  - The list of businesses in the comparable group.
  - Reporting currency, scale and accounting basis.
you_get:
  - A bridge from reported revenue to organic revenue growth.
  - An editable workbook with an input list and test cases.
  - Reconciliation of each bridge part.
  - A list of missing inputs and checks that did not run.
how_to_use:
  - Download the pack and open it in an AI that can create spreadsheet files.
  - Paste or attach your revenue figures, deal dates, currency effect and comparable business list.
  - Ask your AI to follow SKILL.md and to say what is missing instead of guessing.
  - Check the assumptions and reconciliations in the result.
  - Read CHECKS MISSED before you use the growth figure.
  - Pass the bridge and reconciliation to your reviewer, with your source files.
output_sample:
  input:
    - Reported revenue for the current and prior period
    - Revenue from acquired businesses and the dates they joined
    - Revenue from disposed businesses in the prior period
    - Currency effect with its sign (plus or minus)
    - List of businesses in the comparable group
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Scope and dated sources
      contains: Which businesses, dates, currencies and source files the bridge covers.
    - name: Inputs and assumptions
      contains: Every figure used, with its source, date, currency, scale and sign.
    - name: Model calculations and reconciliations
      contains: The bridge from reported to organic revenue and a check that each part adds up.
    - name: Actual file verification
      contains: "What was checked in the workbook: formulas, errors, a changed input, and a reopened file."
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: Fixes the perimeter
    text: Writes which businesses, dates and currencies sit in both periods, so acquired and divested revenue are removed the same way.
  - title: Removes the three effects
    text: Takes disposed revenue off the prior base, then acquired revenue and the signed currency effect off the current figure.
  - title: Works out organic growth
    text: Comparable current divided by comparable prior, less one. Every removed part is shown and ties back to reported revenue.
output_shape: |-
  Reported-to-organic revenue bridge: comparable prior, comparable current, organic growth
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Period end"
    how: "Take the period end from the revenue for both periods and the notes on acquisitions, disposals and currency. Use one currency and scale on every line."
  - what: "The order of the adjustments"
    how: "State the order you use: disposals from the prior year, then acquisitions, then currency from the current year. A different order changes the middle figures, so keep it fixed. The bridge must still add back to reported revenue."
  - what: What a correct bridge looks like
    how: Each bought, sold or currency effect is taken out once, in the stated order, and the parts add back to reported revenue.
judge:
  - Acquisition, disposal and FX effects are mutually exclusive and use a documented ordering.
  - Comparable prior revenue remains positive and both periods cover the same businesses.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one organic revenue growth you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define organic growth into SKILL.md, so every run uses your wording."
before: []
next: [constant-currency-revenue-bridge, extra-week-revenue-comparability]
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
