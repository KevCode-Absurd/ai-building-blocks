name: "Overhead portrait image maker"
new_slug: overhead-portrait-image-maker
summary: "Paste a brief and attach photos. Get one overhead portrait image prompt with the camera and light set."
job: make-image-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Overhead portrait image maker"
subhead: Paste a short brief and attach photos of the person and product if you have them. It sets the camera distance and light so the face looks big but human. You get one prompt, the role of each photo and a list of any step that didn't run.

explain: |
  A portrait taken from right above someone, with a wide lens close to the face, makes the forehead and eyes big and the chin small, with the shoulders falling away. It stops the scroll, which is why beauty, fashion and creator-style ads use it. AI image tools usually miss. You get an ordinary eye-level headshot, a round fisheye bubble, a face swollen all over, or waxy skin.

  This skill works from how a real camera behaves. The stretch comes from distance: the closer the camera, the bigger whatever is nearest. So you pick a strength by camera distance, and the prompt says which parts of the face are nearer and which are further. It puts the light behind the camera, because a camera right above a face blocks the light from above. And if a product appears, it rests against the cheek, since held toward the lens it would look too big.

when:
  - You want a bold, close portrait for a beauty, fashion or creator-style ad or social post.
  - Your image tool keeps giving you a plain headshot or a fisheye bubble when you ask for this look.
  - You want to show a small product beside the face, such as a lipstick or a pouch.

you_give:
  - A short brief (who, setting, mood, frame shape, whether words or a product appear)
  - A photo of the approved person or character, attached (optional; your AI can see pictures)
  - A photo of your product, attached (optional)
  - A photo of this camera angle to copy, attached (optional)
  - The exact words, if any go on the image (optional)
you_get:
  - One prompt paragraph, ready to paste
  - The role of each photo you attached
  - For an edit, a one-line change and a list of what stays the same
  - If your chat makes images, the picture with a pass or fail line for each check

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Write a two-line brief, such as "woman in her 50s, lying on a sofa, relaxed, 4:5, no words, holding our product".
  - Attach the photos you have and say what each one is (the person, the product, the camera angle).
  - Say gentle, strong or extreme if you know; strong is the default.
  - Paste the prompt into your image tool, then attach the result to the same chat to check the face, eyes, light and label.

how_it_works:
  - title: Gives each photo one role
    text: The person photo sets who it is, the product photo sets the real product, and a camera photo sets only the angle and face size. With no person photo, it describes a new made-up adult.
  - title: Picks a strength
    text: Gentle (about 50 to 60 cm away), strong (30 to 40 cm) or extreme (about 20 cm), always with a lens that keeps straight lines straight.
  - title: Places the light
    text: Behind or beside the camera, angled down at the upturned face, so the camera doesn't cast a shadow on it.
  - title: Writes the prompt in order
    text: What it is, the camera, what the perspective does to the face, the light, the skin, the setting, then the product and any words.
  - title: Places the product
    text: Rested against the cheek at face height, so it shows at its true size with the label facing the lens.
  - title: Changes one thing at a time
    text: For an edit, it names the one change and lists everything that stays the same.
  - title: Fixes what went wrong
    text: A table of common faults, each with one fix, such as moving the light when the face comes out dark.

output_shape: |
  PROMPT
  <one paragraph: photo from directly above, adult looking up;
  strength (distance, lens feel, rectilinear); what the perspective
  does; light; skin; setting, clothes, expression; product at face
  height if shown; words or "no added words"; what you want, said
  positively>

  IMAGE ROLES
  <Image 1: the person | Image 2: the product | Image 3: camera
  position only | none, and what that means>

  NOT RUN
  <any step that couldn't be done, such as no image made>

  CHECKS (only if an image was made)
  Angle / perspective / light / identity / product / words:
  <pass or fail, with the fix>
  MISSING: <identity photo | product photo | approved words>

  CHECKS MISSED: <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Brief: an adult woman in her thirties lying on a picnic blanket in
    a sunny park, looking straight up into the lens, relaxed, smiling.
    Holding our pouch beside her lower cheek. 4:5. No words.

    Product photo attached: glossy deep green stand-up foil pouch, big
    yellow wordmark, yellow bear face top right, "28 Daily Packs" at
    the bottom. Opens only at its resealable top.

    Brand look: bright, sunny, candy-like. Never clinical, never muted.
    No identity photo. No camera reference photo.
  output: |
    PROMPT
    A photo taken from directly above an adult woman in her thirties
    lying on her back on a checked picnic blanket in a sunny park,
    looking straight up into the lens. The camera is about 35 cm above
    her face with a rectilinear 20 mm full-frame lens feel, so straight
    lines stay straight. Her forehead and eyes are nearest the lens and
    largest, her face narrows to a smaller chin, and her shoulders
    shrink away onto the blanket. Her hair spreads on the blanket around
    her head. Soft sunlight comes from just behind the camera, angled
    down onto her face, lighting her forehead and cheekbones with a
    small shadow under the nose and catchlights high in both eyes. Her
    skin shows fine pores, small soft hairs and her own slight
    asymmetry, with a light natural sheen. A relaxed, easy smile, a
    plain cotton t-shirt. Her right hand rests the glossy deep green
    Sprout stand-up foil pouch from Image 1 against her lower cheek, at
    face height, closed at its resealable top, label facing the lens
    and clear of her mouth: big yellow wordmark, yellow bear face top
    right, "28 Daily Packs" at the bottom, exactly as in Image 1. Whole
    head and chin in frame, tall 4:5 frame. No added words. Her face is
    in proportion for this distance and her eyes are sharp.

    IMAGE ROLES
    Image 1, product photo: the real pouch.
    No identity photo: she is a new made-up adult. Never call her a
    customer.
    No camera reference: the angle comes from the words above.

    NOT RUN
    No image was made here. Paste the prompt into your image tool, then
    check: camera above the face, face narrowing to the chin, no shadow
    on the face, the wordmark and "28 Daily Packs" unchanged, the pouch
    clear of her mouth.

    MISSING: the pouch's real size. Resting it at face height keeps its
    size believable; check it against the real pouch.
    Strength: strong (the default). Ask for gentle if you want her
    shoulders and more of the blanket in frame.

    CHECKS MISSED: none

tweaks:
  - what: The strength
    how: Gentle reads as a playful selfie with shoulders in frame. Strong is the classic look. Extreme fills the frame with the face. Only the distance and lens lines change.
  - what: The frame shape
    how: Say 4:5, 9:16 or 1:1. A tall frame shows more body below the face; a square shows less. It recomposes for each shape instead of stretching the face.
  - what: A person photo
    how: Attach an approved photo of your model or character and the prompt keeps their face, skin tone, marks, age, hair and build.
  - what: The light
    how: Ask for "window light from behind the camera" or "warm lamp behind the lens". Only the light line changes, and it stays behind the camera.

judge:
  - The camera is clearly above the face, not at eye level.
  - The face is big at the top and narrows to the chin, without a bubble or an evenly swollen face.
  - The face is lit, with no shadow from the camera.
  - Skin has fine, uneven texture, not a waxy finish or a repeating pattern.
  - Any product has the right label, shape and colour, at a size that looks real.

test:
  - Make the same prompt at gentle and at extreme. The extreme one should show a bigger forehead and less body. If they look alike, the distance line isn't reaching the tool; move it earlier in the prompt.
  - Check the straight lines in the setting, such as the blanket's checks. If they curve into a bubble, add the rectilinear line again.
  - With a person photo attached, put the result beside it. Check face shape, skin tone, marks and hair. If the person changed, make that image's role line stricter.
  - Zoom into the skin at full size. If it looks waxy or stamped, cut the skin line down to one plain sentence and try again.

improve:
  - Write your usual strength and frame shape into step 2 of the skill file, so every portrait matches.
  - Keep one approved person photo per character and name it in step 1, so the same person appears in every ad.
  - "If you show a product, write how it's held in real life into step 6 (for Sprout: the pouch closed at its resealable top, rested against the cheek)."
  - Add your claims rules to the avoid list. In a field with claim rules (health, beauty, food, money, alcohol and the like), ban any before and after and any result shown on a person.
  - Pair it with the skill that turns an approved image plan into a prompt when the portrait carries a headline, and the one that makes an approved image bigger for the final export.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Takes up to 5 character references, so the approved person still looks like themselves from above."}
    - {name: "GPT Image", why: "Holds small edits across several rounds, which suits 'change only the hair' requests."}
  inputs:
    - "Several photos of the approved person from different angles, so the face holds at close range"
    - "A photo of the real surface (a bed, a rug, grass), so the hair and texture around the head look real"
    - "Your brand's rules for skin and make-up, so the prompt keeps the person as they are"

terms:
  - term: Rectilinear lens
    meaning: A wide lens that keeps straight lines straight, unlike a fisheye, which bends them into a curve.
  - term: Catchlight
    meaning: The small bright reflection of the light in a person's eyes.
  - term: Perspective
    meaning: How things nearer the camera look bigger than things further away. The closer the camera, the stronger it gets.
