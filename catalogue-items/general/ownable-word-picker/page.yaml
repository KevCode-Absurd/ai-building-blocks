new_slug: ownable-word-picker
name: "Ownable word picker"
summary: Pick the one word your brand can own. Get a four-test score for each candidate, two backups and a list of what to stop saying.
job: plan-strategy
thinking: high
thinking_why: "It weighs many candidate words against four tests and a halo check, so more thinking gives a better single pick."

headline: Ownable word picker
subhead: Paste your word map, which shows the words your rivals own, and what you sell. It lists candidate words, drops any that are taken or empty and scores the rest on four tests. You get one word to own, two backups and a stop list.

explain: |
  The strongest move in brand positioning is to own one word in the buyer's mind. A good word is simple, wanted and true, and it has an opposite that another brand could stand on. A word that fails any of these ends up as decoration. Research can mislead here. If a survey says buyers want "fast" and a rival already owns it, advertising "fast" helps the rival.

  This skill takes your word map and writes candidates of four kinds: a benefit, a service, an audience and a preference. It cuts any word that is taken or empty, then scores the rest on simple, wanted, true and opposed. It prefers a word opposite to the leader's. It checks what buyers would assume once they believe the word, and picks one word and two backups.

  It ends with what you must stop saying, because one word needs the others to go quiet. No word map yet? Make one first with the Owned word mapper. The method draws on Al Ries and Jack Trout's laws of marketing.

when:
  - Your message lists four strengths and buyers remember none.
  - Research says buyers want something, and you suspect a rival already owns it.
  - You must choose between two good words and cannot decide.
  - You are about to write a homepage, a name or a slogan.
not_for:
  - "You have no map of the words rivals own: run the Competitor brand association mapper first."
  - "You already have your word and need the sentence that states your position: use the Positioning statement writer."
  - "You want a name for a new kind of product: use the Category name writer."
  - "You have your word and want a full list of what to cut against it: use the Brand focus trade-off planner. This skill only gives a short stop list."

you_give:
  - "Your word map: which rival owns which word, and which words are open (from the Owned word mapper)"
  - What you sell, and any proof you hold, such as tests, numbers, awards or customer results (optional)
  - Words you cannot use because of law or brand rules (optional)
  - Reviews or survey lines that show what buyers care about (optional)
you_get:
  - Ten to fifteen candidate words, in four kinds
  - A score from 0 to 2 on four tests for each word that survives
  - What buyers would also assume if they believed each of your top words
  - One word to own and two backups, with the proof you hold and lack
  - A stop list of messages to drop

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it into a new chat. It needs no files, web access or paid tools.
  - Paste your word map. If you do not have one, run the Owned word mapper first. The skill will not pick without it.
  - Add a short description of what you sell, with any proof you have.
  - Read the proof lines. A word with no proof scores low on the true test.
  - Say the winning word to five people and ask what they assume about you.
  - Take the word into the Positioning statement writer, then the Give-up list planner.

how_it_works:
  - title: Lists candidates
    text: Writes benefit, service, audience and preference words, ten to fifteen in all.
  - title: Cuts taken and empty words
    text: Removes any word a rival owns or that every rival claims.
  - title: Scores four tests
    text: Simple, wanted, true and opposed, each from 0 to 2.
  - title: Prefers the leader's opposite
    text: Adds a point to a word opposite to the leader's attribute.
  - title: Checks the halo
    text: Writes what buyers would also assume once they believe the word.
  - title: Picks one and two backups
    text: Chooses the top score and keeps two next best.
  - title: Writes the stop list
    text: Names what you must stop saying so the word is heard.

output_shape: |
  CANDIDATES
  <word> | Kind: <benefit, service, audience, preference> | Cut? <taken, empty, or kept>

  FOUR TESTS
  <word> | Simple: <0-2> | Wanted: <0-2> | True: <0-2> | Opposed: <0-2> | Opposite to leader: <+1 or 0> | Total: <n>

  HALO
  <word> | Buyers will also assume: <2 gifts> | Risk: <1 line>

  THE PICK
  Own: <word> | Backups: <word>, <word>
  Proof you have: <line> | Proof you lack: <line>
  Position in five words: "<Brand>: <word>"

  STOP SAYING
  <claim or message to drop> | Why: <line>

  MISSING
  <proof or buyer evidence that would change the pick>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - Your word map from the Owned word mapper
    - What you sell, and any proof you hold (optional)
    - Words you cannot use (optional)
    - Reviews or survey lines on what buyers care about (optional)
  output:
    - name: CANDIDATES
      contains: Ten to fifteen words in four kinds, each marked taken, empty or kept.
    - name: FOUR TESTS
      contains: Each kept word scored 0 to 2 on simple, wanted, true and opposed, with a total.
    - name: HALO
      contains: "For the top three words: two other good things buyers would assume, and one risk."
    - name: THE PICK
      contains: One word to own, two backups, the proof you have and lack, and the position in five words.
    - name: STOP SAYING
      contains: Messages, features and claims to drop so the word is heard, each with a reason.
    - name: MISSING and CHECKS MISSED
      contains: Proof or buyer evidence that would change the pick, and any check still failing.

tweaks:
  - what: Proof
    how: Give real tests, numbers, firsts or customer results. A word with no proof scores low on true.
  - what: Buyer evidence
    how: Give reviews or survey lines that show the word matters. Otherwise the wanted score is a guess.
  - what: The word map
    how: Use a map made from buyer words, not your own view of rivals.
  - what: Words you cannot use
    how: List words banned by law or brand rules so they are cut at the start.

judge:
  - The pick is one word, not a phrase of three ideas.
  - The word is not taken by a rival and not an empty claim.
  - The word has proof you hold today, or the gap is stated.
  - The word has a real opposite that another brand could hold.
  - The stop list names real messages to drop.

test:
  - Say the word to five people and ask what they assume about you. See if it matches the halo.
  - Search the word with your category and see if a rival leads.
  - Run it twice. The pick should stay close.
  - Ask a rival-minded friend what the opposite word would be. It should be real.

improve:
  - Add your own proof file so the true test is faster.
  - Add the words your sales team hears buyers say.
  - Re-test the word every year or when a rival changes its line.
  - Pair it with "Positioning statement writer" to turn the word into a line.

works_best_with:
  tools:
    - { name: "Any good chat AI", why: "Listing words and scoring them against fixed tests is text work any strong chat AI does with this skill." }
  inputs:
    - "The word map from Owned word mapper"
    - "Proof such as tests, awards, numbers and customer results"
    - "Reviews that show what buyers care about"

terms:
  - term: Word map
    meaning: A list of which rival owns which word in buyers' minds, and which words are still open.
  - term: Owned word
    meaning: The one word buyers link to a brand.
  - term: Halo
    meaning: The extra good things buyers assume about a brand once they believe its main word.
  - term: Opposed
    meaning: A word has an opposite that another brand could hold, so choosing it means something.
