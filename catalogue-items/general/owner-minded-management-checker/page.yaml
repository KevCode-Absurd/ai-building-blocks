new_slug: owner-minded-management-checker
name: "Owner-minded management checker"
summary: "Check whether the managers of a business can be trusted with owners' money. Rates ability, honesty and owner-mindedness from cash use and pay."
job: money-and-investing
thinking: medium
thinking_why: "It reads a record of choices and rates each quality on evidence. The ratings need care, but the steps are fixed."

headline: "Owner-minded management checker"
subhead: "Paste what you know about the people running a business: deals, payouts, pay and letters to owners. It follows the cash, compares pay with results, counts the mistakes they name, then rates ability, honesty and owner-mindedness, each with an evidence line. It is a method of analysis, not personal financial advice."

explain: |
  When you own part of a business, other people spend your money every day. A great product can be wasted by managers who chase size, pay themselves well when owners get little, or never admit a mistake.

  This skill judges managers by what they did. It logs each use of spare cash and marks it good, poor or unknown. It compares pay with what owners got, looks for growth that served the manager more than the owner, and counts the failures they named plainly. It then rates three qualities, able, honest and owner-minded, each with the fact that backs it. It treats management as second to the quality of the business. It gives no buy or sell calls.

when:
  - You are about to back a business and want to know if the people running it will treat your money well.
  - A business looks strong but the managers keep doing large deals.
  - You hire or promote a leader who will run money that is not their own.
not_for:
  - "You want to know if the business itself is strong: first run the Business power tester, then bring its report here."
  - "You have no records on how managers used cash or what they were paid: gather the letters to owners and the pay table first, or ask a person who knows the firm."
  - "You want a buy or sell view on a named security: ask a licensed financial adviser, as this gives no such advice."

you_give:
  - Findings on the business, such as a report on its edge
  - What managers did with cash over several years (optional)
  - Pay tables and letters to owners (optional)
  - The stake or decision you are weighing (optional)
you_get:
  - A cash log marked good, poor or unknown
  - A comparison of pay with owner results
  - Ratings for able, honest and owner-minded, each with its evidence
  - A call, and the one fact that would change it

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste what you have on the business and on how managers used cash.
  - Add the last few letters or reports they wrote to owners.
  - Read the three ratings and check each evidence line yourself.
  - Take the call back to your main decision, with the business findings first.
output_sample:
  input:
    - Findings on the business, such as a report on its edge
    - What managers did with spare cash over several years (optional)
    - Pay tables and letters to owners (optional)
    - The stake or decision you are weighing (optional)
  prerequisites:
    - A report on the business, for example from the Business power tester
  output:
    - name: Weight
      contains: How much management matters here, with the business placed first.
    - name: Cash log
      contains: Each use of spare cash with year and amount, marked good, poor or unknown.
    - name: Pay against results
      contains: A comparison of manager pay with owner results and how pay ties to owner return.
    - name: Growth for its own sake
      contains: Deals that raised the manager's standing but not the owners' return, or none.
    - name: Mistake talk
      contains: A count of failures named in plain words and what changed after.
    - name: Ratings
      contains: Able, honest and owner-minded, each rated with one evidence line.
    - name: The call
      contains: A view on management only, and the one fact that would change it.
    - name: Missing and checks missed
      contains: What would firm up the ratings, and any checks the skill failed.

how_it_works:
  - title: Puts the business first
    text: A good business with ordinary managers beats an ordinary business with a star, so management is weighed second.
  - title: Follows the cash
    text: Logs each use of spare money with amount and year, and marks it good, poor or unknown.
  - title: Compares pay and results
    text: Looks for pay that rises when owner results fall, or rewards size alone.
  - title: Spots growth for its own sake
    text: Flags deals that raised the manager's standing but not the owners' return.
  - title: Counts named mistakes
    text: Reads past letters for failures named in plain words, with amounts.
  - title: Rates three qualities
    text: Able, honest and owner-minded, each high, mixed, low or missing, with an evidence line.
  - title: Makes the call
    text: Weighs honesty and owner-mindedness most and names the fact that would change the call.
  - title: Checks itself
    text: Runs its own checks and names any it missed.

output_shape: |
  WEIGHT
  <how much management matters here and why>

  CASH LOG
  <year> | <choice> | <amount> | GOOD / POOR / UNKNOWN

  PAY AGAINST RESULTS
  <comparison and one line on how pay ties to owner return>

  GROWTH FOR ITS OWN SAKE
  <deals or none>

  MISTAKE TALK
  <count of named failures and what changed>

  RATINGS
  Able: <rating> because <fact>
  Honest: <rating> because <fact>
  Owner-minded: <rating> because <fact>

  THE CALL
  <strong support / no change / reason to be careful>; changes if: <fact>

  MISSING
  <what would firm up the ratings>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: How far back
    how: Give at least five years of choices. One year shows luck.
  - what: The letters
    how: Paste the last three letters or reports to owners so the mistake count has material.
  - what: Your relation to the money
    how: Say whether you are an owner, a lender or a manager. It changes what matters most.
  - what: Business findings
    how: Include any report on the edge or the industry, so management is judged second.

judge:
  - The cash log has amounts and years.
  - Pay is compared with owner results.
  - Each rating has an evidence line, or says missing.
  - Management is weighed after the business.
  - The call names the fact that would change it.

test:
  - Run it on managers with a clear record of large poor deals. The cash log should show it.
  - Run it with only a speech and no record. Ratings should come back missing.
  - Give it a letter full of wins and no failures. The mistake count should lose a point.
  - Run it twice. The ratings should hold.

improve:
  - Add the specific kinds of deals that go wrong in your field.
  - Keep a file of managers' promises, and check later whether they were kept.
  - Add a line on who owns shares that they bought with their own money.
  - Pair it with the "Incentive checker" for deeper study of how pay steers choices.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Reading a record of choices and rating them against fixed rules is text work any strong chat AI does well."}
    - {name: "A spreadsheet", why: "Lets you tabulate years of deals and payouts to see a pattern."}
  inputs:
    - "A report from the Business power tester"
    - "Several years of letters to owners"
    - "The pay table and a list of major deals"

terms:
  - term: Owner-minded
    meaning: Treats the money as their own, holds a real stake bought with their own funds and shares the owners' losses.
  - term: Spare cash
    meaning: Money the business earns beyond what it needs to run, which managers must decide how to use.
  - term: Growth for its own sake
    meaning: Making the business bigger without raising what owners earn on each unit of money put in.
