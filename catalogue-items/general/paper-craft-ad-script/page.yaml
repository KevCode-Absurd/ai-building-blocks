new_slug: paper-craft-ad-script
name: "Paper craft video ad script writer"
summary: "Paste your brief and product facts. Get a paper-craft video script and a cast note."
job: make-video-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Paper craft video ad script writer"
subhead: Give it your brief, product facts and approved claims. It picks the real paper mechanism that shows your point, like a flap or pop-up, and tests every paper change as a claim. You get a 15 to 40 second paper-craft script and a cast note for the video.

explain: |
  A world of real paper makes a small everyday problem feel like a picture book, and a pop-up that rises as a page turns feels like opening a gift. Ask an AI tool for "paper" carelessly, though, and you get flat clip art, a craft model sitting on a desk, or a coffee cup that comes out as a real cup because nobody said it was card.

  This skill starts from the job. It asks what the turning shot must show (a reveal, something spreading, two things joining, parts adding up, a mood calming, or the product held still) and picks the mechanism paper engineers use for exactly that. A lift-the-flap or a pop-up reveals. A concertina spreads across the scene. Layers stacked front to back show many parts. It sets how deep the paper is built, names the paper on every object, and reads every paper change as a sentence your claims must back.

  It ends with a cast note: one paper figure, paper hands only, or the product alone, and why. The skill that turns a paper-craft script into shots takes it from there. Want a still instead? Use "Paper craft image ad maker".

when:
  - Your product fixes a small everyday problem you can tell as a short story.
  - You want a warm, handmade-looking ad for people who don't know your brand yet.
  - You want a reveal that feels like a gift, with your product popping up from the page.

you_give:
  - The reason someone buys, what the buyer knows, the selling idea and the length
  - A photo of your product (attach it; your AI can see pictures), its biggest label lines and how it's used
  - Your approved claims, banned claims and offer
  - Your buyer's moment and words, brand colors and voice (optional)
you_get:
  - A show plan with the paper mechanism, the build and the claim it implies
  - A line-by-line script with the paper named in every picture, camera spots and one move per shot
  - A list of every paper change with its source, and the ones it rejected
  - A cast note saying who should carry the ad, and why
  - Any of its own checks the script still missed, one line each, or none

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, biggest label lines and claims underneath.
  - Write the selling idea in one sentence and the buyer's moment in another.
  - Say the length, such as "30 seconds".
  - Check that every object in the picture notes names its paper. Anything without it will come out real.
  - Take the script and cast note to the skill that turns a paper-craft script into shots. It runs the video process from there.

how_it_works:
  - title: Checks the fit
    text: Paper suits small everyday problems and gift-like reveals. It tells you to film instead when proof or real texture is the point.
  - title: Names what the key shot must show
    text: One of six jobs (reveal, spread, join, build, calm, hold), chosen from your selling idea.
  - title: Picks the paper mechanism
    text: A flap or pop-up to reveal, a concertina to spread, tab and slot to join, layers or quilling to build.
  - title: Sets how deep it's built
    text: Flat cut figures, layered planes, pop-up and fold, or quilled detail, plus the paper types and one edge style.
  - title: Reads every change as a claim
    text: Writes the sentence each paper change implies and keeps it only if your claims back it.
  - title: Writes the script
    text: Paper named on every object, the camera placed inside the world, one move per shot, 5 words or fewer over the turn.
  - title: Writes the cast note
    text: Picks one paper figure, paper hands only, or the product alone to carry the ad, and says why.

output_shape: |
  SHOW PLAN
  Selling idea: <one sentence>
  Show job: <reveal, spread, join, build, calm, hold>
  Mechanism: <flap, pop-up, concertina, tab and slot, layers...>
  Build and paper: <flat cut, layered...>, <card stock, kraft...>, <edge>
  It implies: "<sentence>"  Source: <claim or fact>

  # | Narration | Picture (paper named) | Camera | Move
  <n> | "<line>" | <...> | <where it stands> | <one move>
  <n> | "<5 words or fewer>" | THE TURN: <mechanism> | <...> | <change>

  Timing: <words> at 2.2 a second = <seconds>. Clips: <split>

  CLAIMS SHOWN
  <change> = <source>
  Rejected: <change> (<why>)

  CAST NOTE  <figure, hands only, or product alone>: <why>
  MISSING: <facts it needed>

  CHECKS MISSED  <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    About 30 seconds.
    Selling idea: your own greens can ride along in the morning rush,
    one pack at a time.
    Buyer: the busy parent, 30 to 45. Says: "So easy to grab and eat
    on my way to the billion things I have to do as a mom."
    Product: Sprout Low Sugar, pouch of 28 daily packs. Tear one pack
    straight across the top and tip the small deep-green gummy bears
    into your palm. Pouch: glossy deep green, big yellow wordmark
    "Sprout", yellow bear face top right, "28 Daily Packs" at the
    bottom.
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
    in 1 pack.
    Never say: fix, energy or immunity results, weight loss.
    Offer: $29.99 first order with text sign-up, renews at $49.99
    every 4 weeks. Brand line: "Rip. Tip. Enjoy."
  output: |
    SHOW PLAN
    Selling idea: your own greens can ride along in the morning rush.
    Show job: reveal (the product arriving in her day).
    Mechanism: pop-up. She turns a page of her paper planner and the
    daily pack stands up from the fold on a parallel fold.
    Build and paper: flat-cut figure on layered planes, with one
    pop-up. Matte card stock, kraft for the lunchboxes, scissor-cut
    edges. Colors: cream, forest green, sunflower yellow, sky blue.
    It implies: "One pack fits into a packed morning." Source: the
    directions ("grab a single pack daily") and the buyer's own words.

    1 | "Lunchboxes. Permission slip. One missing shoe." | A cream card
        kitchen on three layered planes; a jointed paper woman in a
        blue card jumper; two kraft-paper lunchboxes on the counter. |
        Her eye level. | One lunchbox slides along the counter.
    2 | "Your own vitamins? Still on the shelf." | A card shelf, a plain
        white card tub behind a cereal box cut from red card. | Low at
        the shelf. | The tub tips back on its base.
    3 | "So put them where your day already goes." | Her paper hands
        hold an open paper planner, the page crowded with flat-cut
        icons (a bus, a laptop, a shopping bag). | Over her shoulder. |
        The page edge lifts.
    4 | "One pack, right there." | THE TURN: pop-up. The page turns and
        a green card daily pack stands up from the fold, its shadow
        growing as it rises. | Same. | About 3 seconds, 4 words.
    5 | "Rip. Tip. Enjoy." | Paper hands tear the pack straight across
        the top; small deep-green card bears tip into the palm. | Close
        on the hands. | The wrist pivots on its pin.
    6 | "Sixty-plus ingredients, twenty-one vitamins and minerals, six
        grams of fiber." | A deep green card pouch on a grey card car
        seat, "Sprout" in yellow, "28 Daily Packs" at the bottom. |
        Seat height. | Slow push in through the layers.
    7 | "First order $29.99 with the text sign-up." | Same, held. On
        screen: $29.99 first order with text sign-up. Renews at $49.99
        every 4 weeks. | Same. | Held still.

    Timing: 45 words at 2.2 a second, plus the 3-second turn and a
    held end, is about 30 seconds. Clips of 8 s: 1 = lines 1-2, 2 =
    lines 3-4 (the turn), 3 = lines 5-6, 4 = line 7, held.
    No children shown: the lunchboxes and the permission slip carry
    the family.

    CLAIMS SHOWN
    The pack rising into her day = directions: one pack daily
    Line 6 = approved claim, said in full
    Rejected: a flap lifting off a tired face to show a bright one
      (implies an energy result, which is banned)
    Rejected: calling the pack "breakfast" (implies a meal
      replacement; no claim on file)

    CAST NOTE  One flat-cut paper woman, an invented adult about 40.
    The selling idea lives in her crowded morning, so she carries it;
    the pack arrives in her hands at the turn.
    MISSING: what the single daily pack's printing looks like; line 4
    assumes plain green.

tweaks:
  - what: The show job
    how: Ask for reveal for a gift-like arrival, spread for something that fills a day, build to show many ingredients or steps, or hold for buyers who already know you.
  - what: How deep it's built
    how: Flat cut suits comedy and gestures. Layered planes suit a rich, premium scene. Pop-up and fold suits reveals. Quilled detail suits ingredients and patterns.
  - what: Who carries it
    how: One paper figure when the problem lives in someone's day, paper hands only for a how-to, or the product alone for a gift-like reveal.
  - what: Length
    how: 15 to 40 seconds. It counts words at about 2.2 a second and keeps one paper-made scene change at most.

judge:
  - The show plan's implied sentence is something your claims let you say.
  - The turn's mechanism fits the job, and there is at most one paper-made scene change.
  - Every object in every picture note names its paper or card.
  - No paper person speaks, and none is a child or claims a result.
  - The product has its true shape and only real label words.
  - The narration fits the length at a calm pace, with 5 words or fewer over the turn.
  - The cast note makes one choice and gives a reason you agree with.

test:
  - Search the picture notes for any object without a paper word. There should be none.
  - Ask for a flap that turns a tired face into a bright one. The claim step should reject it and say why.
  - Run it for a buyer who only needs the offer. It should tell you paper is a weak fit.
  - Read only the cast note and the show plan to a colleague. They should be able to picture who carries the ad and what the turn shows.

improve:
  - If one build suits your brand, write it into step 3 of the skill file so every ad in a series matches.
  - Add your banned claims to step 4, so every paper change is tested against them.
  - Write your biggest label lines and their colors into "What you need".
  - Pair it with the skill that turns a paper-craft script into shots, and with the paper-craft image ad skill for a matching still.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
  inputs:
    - "Photos of a paper craft or pop-up book you like, so the build has a clear model"
    - "The pack's flat artwork, so the paper pieces match its real colors and shapes"
    - "A photo of the product in a hand, so the paper world gets the size right"

terms:
  - term: Show job
    meaning: What the key shot has to show for the selling idea, such as a reveal or many parts adding up.
  - term: Pop-up
    meaning: A paper piece fixed across a fold, so it stands up as the page opens.
  - term: Concertina
    meaning: A strip folded back and forth in a zigzag, so it opens out like an accordion.
