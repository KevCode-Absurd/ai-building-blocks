new_slug: paper-cutout-explainer-video-ad-script-writer
name: "Paper cutout explainer video ad script writer"
summary: "Paste your point and product facts. Get a paper-cutout explainer script, cast note and score out of 100."
job: make-video-ads

headline: "Paper cutout explainer video ad script writer"
subhead: Give it your selling idea and product facts. It writes your point as one sentence, picks a paper-cutout proof picture for each line and times it to land on the word it proves. You get a 20 to 40 second script, a cast note and a score out of 100.

explain: |
  Explainer ads often try to say everything. Five features, three charts, a paragraph on screen, and a viewer who has scrolled away before the point lands. Others show charts with no real numbers behind them.

  This skill keeps the ad to one point, written as one sentence: what you do now, the snag you didn't see, and the product. Each line gets one proof picture, picked from what the line claims. "Takes fewer steps" gets a row of objects that shrinks. "Replaces" gets a swap. "Is made of" gets the parts laid out flat. The picture appears on the word it proves, one signal shows where to look, and the screen carries a few key words, never the whole narration. That follows long-standing research on how people learn from words and pictures together. Charts appear only when you have the figures.

when:
  - You have one clear argument, such as why the usual routine fails or what your product replaces.
  - You want viewers to follow the point with the sound off.
  - You have real figures to show, or want an ad that proves things with objects when you don't.

you_give:
  - The selling idea, or a script you already have
  - Your product facts, how it works, and what it replaces
  - Your figures with sources, approved claims and banned claims
  - A photo of your product (attach it; your AI can see pictures)
  - Your colours, typefaces, offer and guarantee
  - The length (optional)
you_get:
  - Your point in one sentence and a small paper kit
  - A table of narration, key word, proof picture, signal and move for every line
  - Notes on where each figure comes from, and anything MISSING
  - A cast note on what carries the ad, ready for the shots skill
  - A score out of 100 for how many of its own checks the script passes, with any it missed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, figures and claims underneath.
  - Say what point you want to prove, or ask it to pick one from your facts.
  - Say the length, such as "30 seconds".
  - Read the point first. If it has two snags, ask for two separate ads.
  - Take the script and cast note to "Paper cutout explainer video clip prompt writer". It takes it from there, with the product sheet, storyboard and clips.

how_it_works:
  - title: Checks it fits
    text: Good for settling a doubt with a picture. It says so if your ad is about a feeling or is only an offer.
  - title: Writes one point
    text: What you do now, the snag, then the product, in one sentence with one "but".
  - title: Picks proof by the claim
    text: Fewer steps, made of, replaces, fits or works by. Each kind of claim gets its own kind of picture.
  - title: Sets a small paper kit
    text: One paper and cut style, one signal colour and pointer, your product always in full colour.
  - title: Times pictures to words
    text: Each picture lands on the word it proves, with one signal and a few key words on screen.
  - title: Keeps proof honest
    text: No chart without your figures, no named rival, no body before and after, no real people.
  - title: Writes the cast note
    text: Usually your product cutout carries the ad, so it's the avatar. The note says why, and names the narrator's voice.

output_shape: |
  POINT
  You <do this> and <expect that>, but <snag>, therefore <product>.

  PAPER KIT
  Material: <ground, cut style>   Signal: <colour, pointer shape>
  Photos: <product full colour; others one treatment>

  Line | Narration | Key word | Proof picture | Signal | Move | On screen | s
  1 | "<sentence>" | <word> | <picture for the claim's verb> | <pointer> | <slide / swap / pivot / flap / build-up> | <1 to 5 words> | <n>
  ...
  <last line: product cutout large and still, offer on screen>

  NOTES
  - Figures: <each figure and its source, or "no chart">
  - MISSING: <what the ad needs>

  CAST NOTE  <what carries it, why, narrator's voice, what never changes>

  SCORE  <n>/100 (<passed> of <total> checks passed)
  Missed: <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Idea: the powder routine has too many steps; a pack has one.
    Buyer: has quit greens powders. Words: "gritty/chalky", "not having
    to clean a shaker bottle". Old way: a half-used tub and a shaker.
    Product: Sprout daily greens gummies. One daily pack, torn straight
    across the top, gummies tipped into a palm. No water, no mixing.
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
    in 1 pack. "Clinically tested for nutrient absorption" (2025 study,
    12 weeks, 120 adults: vitamin C +40.1%, 2.7x placebo).
    Photos: gummies in a hand, pouch front. Old-way photos: none yet.
    Colours: cream #FFF7DF, forest green #00582D, sunflower #FFCC2E.
    Type: Work Sans bold and medium.
    Offer: $29.99 first order with text sign-up, renews at $49.99.
    Video, 20 seconds.
  output: |
    POINT
    You buy a greens powder and expect an easy daily habit, but every
    glass takes a scoop, water, a shake and a rinse, therefore Sprout
    puts it in one pack you tear open.

    PAPER KIT
    Material: warm cream card (#FFF7DF), scissor-cut edges, soft short
      shadows
    Signal: sunflower yellow #FFCC2E, a hand-cut strip with one
      pointed end
    Photos: old-way objects in black and white; the product always
      full colour

    Line | Narration | Key word | Proof | Signal | Move | On screen | s
    1 | "A greens powder takes four steps." | four | tub, scoop,
        water glass, shaker landing in a row | strip under the row |
        build-up, one piece per beat | 4 STEPS | 4
    2 | "Then one more: rinsing the shaker." | rinsing | the shaker
        cutout over a paper sink | strip points at the lid | slide
        (the sink slides in under it) | +1 RINSE | 3
    3 | "A Sprout pack takes one tear." | one | the whole row slides
        out; one daily pack drops into its spot | strip along the top
        edge | swap | 1 STEP | 4
    4 | "Inside: sixty-plus ingredients, twenty-one vitamins and
        minerals, and six grams of fiber." | Inside | the pack's front
        lifts to show the gummies-in-a-hand photo | strip points at
        the gummies | flap | 60+ INGREDIENTS. 6G FIBER | 5
    5 | "One tear a day." | tear | the pouch cutout large and still,
        centre | none | hard cut, hold | $29.99 first order with text
        sign-up. Renews at $49.99 every 4 weeks | 4

    NOTES
    - 34 spoken words over 20 seconds, so the pictures have room.
    - Figures: 60+, 21 and 6g from the label claim. No chart. The
      absorption study is a second point; it has real figures for a
      two-bar chart, so make it its own ad.
    - Line 3 shows the tear straight across the top, the only way the
      brand allows.
    - Compared with "a greens powder", never a named powder brand.
    - MISSING: black-and-white photos of a plain tub, scoop, glass and
      shaker (no brand marks), and a photo of a single daily pack.

    CAST NOTE  The product carries it: the daily pack and pouch
    cutouts are the avatar, and no person is needed, since the point
    is a count of steps. Narrator: a quick, dry adult voice, off
    screen. Never change: the cutouts come from the real photos, and
    the paper kit above.

tweaks:
  - what: The point
    how: Ask for a specific claim, for example "it replaces" or "it's made of". Each gives a different kind of proof picture.
  - what: Your figures
    how: Paste test results, counts or measurements with their sources. With them you get a chart drawn to the real proportions. Without them, objects do the proving.
  - what: The paper kit
    how: Name the paper and cut style (brown kraft, torn edges) and the signal colour. It keeps to them all the way through.
  - what: Want a still instead?
    how: Use "Paper cutout image ad maker", which makes one image ad in this same paper kit.

judge:
  - You can say the point in one breath, and it has one "but".
  - Each line's proof picture fits what the line claims.
  - Each picture is marked to land on a key word.
  - Every number on screen has a source in the notes.
  - With the sound off, the pictures alone still make the argument.

test:
  - Run it on the point your best ad already makes. If the one-sentence point isn't the one you meant, your selling idea needs to be sharper.
  - Read only the proof picture column, as if the sound were off. It should still make the argument.
  - Ask for a chart without giving the figures. It should leave the chart out or mark it MISSING, never invent bars.
  - Check the on-screen column. No cell should repeat its whole narration line.

improve:
  - Write your paper, cut style and signal colour into step 4 of the skill file, so every explainer in a series looks the same.
  - Add your measured figures, with sources, to your brand file. Charts make strong proof, and step 3 only allows them from real numbers.
  - Describe the old way you sell against in "What you need" (for Sprout, a powder tub and a shaker), so swaps never show a real rival.
  - Pair it with "Paper cutout explainer video clip prompt writer", which runs the product sheet, storyboard and clips.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
  inputs:
    - "A photo of the old way you sell against, with no rival brand in view"
    - "Photos of real paper or card in your brand colors, so the paper kit names materials that exist"
    - "One or two explainers you find clear, so you can name the pace you want"

terms:
  - term: Cutout
    meaning: A photo of your product with the background removed, so it can sit on any layout.
  - term: Signal
    meaning: The one arrow, ring or strip, in one colour, that shows the viewer where to look.
  - term: Key word
    meaning: The word in a line that the picture proves. The picture appears exactly as it's said.
