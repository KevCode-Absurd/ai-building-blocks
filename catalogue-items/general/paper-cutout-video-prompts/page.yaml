new_slug: paper-cutout-video-prompts
name: "Paper cutout explainer video clip prompt writer"
summary: "Turn a one-point script and your product photos into timed paper cutout explainer video prompts, plus an edit list for the words and numbers."
job: make-video-ads
thinking: high
thinking_why: "It runs several stages and keeps many rules at once across a long output."

headline: "Paper cutout explainer video clip prompt writer"
subhead: Give it a one-point cutout explainer script and product photos. It makes every paper piece first, builds a storyboard of layered frames, and times each move to the word it proves, stopping three times for your OK. You get every prompt and an edit list.

explain: |
  A paper-cutout explainer looks handmade and clear: your product cut out, an arrow, a ring round the part that matters. Ask an AI video tool for it and you often get the opposite. Flat digital graphics, misspelled labels, paper bending like rubber, and your product redrawn a little differently in every scene.

  This skill runs the whole process in six stages, the way a cutout animator works. It lists every piece the ad needs. Your product cutout is the avatar, so it writes a card for it and waits for your OK. Next come a product sheet, every other piece and the empty ground, with lock lines and paper rules. You approve those, then a storyboard where each frame is a stack of paper layers and each move has a start and an end. Only then does it write the clips, timed to the voice-over. Words and numbers go in during editing.

when:
  - You have a one-point explainer script and want to make it with AI image and video tools.
  - Earlier attempts came out as flat digital graphics or with garbled text.
  - Your product looked slightly different in every scene.
not_for:
  - "You want a live-action or talking-head ad: film it, or ask a video editor. This skill only makes paper cutout clips."
  - "You don't have a script yet: write one first with the Paper cutout explainer video ad script writer, then come back."
  - "You want finished video with no paid tools: this writes prompts only. You still need an image and video tool to make the clips."

you_give:
  - The script, ideally with a proof picture, key word and move for each line, and its cast note
  - Your product photos (front, side, top, out of the pack) and how the product works
  - Any figures you want shown, with their sources
  - Your colours, typefaces and approved claims (optional)
you_get:
  - A parts list and an avatar card for your product cutout
  - Test cutout prompts, then sheet prompts for the product, every piece and the ground, with lock lines
  - A storyboard with one layer-stack frame and a rigged move per line
  - Clip prompts timed to the voice-over, and an edit list of every word and number with its source
  - Any check the prompts still missed, one line each, or none

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. It writes prompts only, so you need an image and video tool to make the clips.
  - Paste your script, ideally from the Paper cutout explainer video ad script writer, then attach your product photos.
  - Approve the avatar card for your product cutout, then make the test cutouts and pick one.
  - Approve the sheets and lock lines, then approve the storyboard frames.
  - Record the narration, then make each clip from its approved frame. Higgsfield credits and Google or OpenAI keys bill per clip or picture.
  - Add the words, numbers and charts in your editor, using the edit list.
output_sample:
  input:
    - Your cutout explainer script, one point per line
    - "Your product photos: front, side, top and out of the pack"
    - How the product works, and any figures with their sources
    - Your colours, typefaces and approved claims (optional)
  prerequisites:
    - An image tool and a video tool to turn the prompts into clips, such as Nano Banana and Veo (paid plans or credits may apply)
    - Your voice-over recording, or time to make one, before you make the clips
  output:
    - name: Parts list
      contains: Every paper piece and photo the ad needs, each marked have, make or missing.
    - name: Avatar card
      contains: How your product cutout is made and what must never change, for your approval.
    - name: Test cutout prompts
      contains: Three or four versions of the product cutout, so you can pick the edge and shadow.
    - name: Sheet prompts and lock lines
      contains: Product, pieces and empty ground prompts, plus the paper and product lines repeated in every prompt.
    - name: Storyboard
      contains: One frame per line as paper layers, with each move rigged from a start to an end.
    - name: Clip prompts
      contains: Motion only, timed to land on each key word, ending with a short hold.
    - name: Edit list
      contains: Every word and number with its source, plus captions, end card and safe zones.
    - name: Checks missed
      contains: One line for each check the prompts still fail, or none.

how_it_works:
  - title: Lists every piece
    text: Product cutouts, other photos, paper shapes and the ground, each marked have, make or missing.
  - title: Makes your product the avatar
    text: A card for the cutout (which photo, the edge, the shadow, what never changes), plus a made-up person only if a line needs one. It stops for your OK.
  - title: Tests the cutout
    text: Three or four versions in your paper kit, so you pick the edge and shadow you like.
  - title: Builds the sheets
    text: The product from three sides with its label exact, every other piece, the empty ground, and paper rules in every prompt. It stops for your OK.
  - title: Draws the storyboard
    text: Each frame as paper layers back to front, each move with a start and an end, checked so one frame ends where the next begins. It stops for your OK.
  - title: Turns it into video
    text: Narration first, then clips timed to land on each key word, then words and figures added in editing, checked against your sources.

output_shape: |
  STAGE 0  PARTS LIST   <piece> | <from which photo, or made> |
                        have / make / MISSING
  STAGE 1  AVATAR CARD  <product photo, cut, size, narrator's voice,
                        never change>             > STOP for approval
  STAGE 2  TEST CUTOUTS <3 or 4 prompts>  Picked: <n>
  STAGE 3  SHEETS       Product: <front, side, top, label words>
                        Pieces: <one prompt each>  Ground: <prompt>
           LOCK LINES   <paper kit, product, paper rules>
                                                  > STOP for approval
  STAGE 4  STORYBOARD
           FRAME <line n>  Layers, back to front:
             1 <ground>  2 <piece, place, size>  3 <product>
             4 <signal>   Attach: <piece> = <its job>
           Move: <slide / swap / pivot / flap / build-up>, start >
           end, lands on "<key word>"
                                                  > STOP for approval
  STAGE 5  CLIP <n>     Start <frame>, end <frame>. <s>-<s> <move>.
                        Hold at rest. [LOCK LINES]
           EDIT LIST    <every word and number with source, captions,
                        end card, safe zones>
  CHECKS MISSED  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Script (20 s, from "Prove one point fast in a paper-cutout ad"):
    1 "A greens powder takes four steps." key: four. Row of tub,
      scoop, glass, shaker. Build-up.
    2 "Then one more: rinsing the shaker." key: rinsing. Sink slides
      in under the shaker.
    3 "A Sprout pack takes one tear." key: one. Swap: the row out, a
      daily pack in.
    4 "Inside: sixty-plus ingredients, twenty-one vitamins and
      minerals, and six grams of fiber." key: Inside. Flap.
    5 "One tear a day." Pouch large and still, offer on screen.
    Paper kit: warm cream card, scissor-cut edges; signal sunflower
    #FFCC2E strip with one pointed end; old way in black and white.
    Cast note: the product carries it; quick, dry narrator.
    Photos: pouch front, gummies in a hand. No single daily pack
    photo yet. Old-way photos: to be shot.
    Clips: 8 seconds, 9:16.
  output: |
    STAGE 0  PARTS LIST
    Pouch cutout | pouch front photo | have
    Gummies-in-a-hand cutout | hand photo | have
    Daily pack cutout | single pack photo | MISSING
    Tub, scoop, glass, shaker | to shoot, no brand marks | MISSING
    Paper sink | grey card, two layers | make
    Signal strips x3, blank label strips x2, ground | card | make

    STAGE 1  AVATAR CARD
    The product is the avatar: the pouch, cut from the pouch front
    photo, scissor-cut edge with a thin white margin, visible card
    thickness, short soft shadow; two thirds of the frame height in
    line 5. No person. Narrator: a quick, dry adult voice. Never
    change: shape, deep green, yellow wordmark, bear face, "28 Daily
    Packs".
    > STOP: approved.

    STAGE 2  TEST CUTOUTS (4; one shown)
    The attached pouch photo cut out as a printed photo on card,
    scissor-cut edge, thin white margin, visible card thickness,
    short soft shadow, plain grey background. Shape, colours and
    printing unchanged. Picked: 2 (thinnest margin).

    STAGE 3  SHEETS
    Product: cutout 2 from the front, side and top; label words as
      printed: "Sprout", "28 Daily Packs".
    Pieces: paper sink in grey card, two layers; sunflower strips;
      blank cream strips. Old-way pieces wait for their photos.
    Ground: warm cream card filling the frame, faint grain, flat from
      above, even overhead light with no glare.
    LOCK LINES: warm cream card, scissor-cut edges, visible thickness,
      short soft shadows / the pouch as product sheet / flat stiff
      card on one plane, shadows travel with their pieces, photos stay
      photos, nothing bends or morphs.
    > STOP: approved for lines 1, 2 and 5.

    STAGE 4  STORYBOARD (line 1 shown)
    FRAME 1  Layers, back to front: 1 ground  2 tub, scoop, glass and
      shaker in a row across the middle third, each a fifth of the
      frame wide  3 one sunflower strip under the row, point at right.
      Attach: the four old-way cutouts = shapes, black and white.
    Move: build-up, one piece per beat, left to right, lands on
      "four". Ends where frame 2 starts.
    > STOP: approved.

    STAGE 5  CLIP 1 (8 s, lines 1 and 2)  Start: the empty ground.
      End: frame 2. 0.0-0.6 s tub drops in at left and eases to a
      stop; 0.6-1.2 scoop; 1.2-1.8 glass; 1.8-2.4 shaker (on "four"
      at 2.2 s); 2.4-3.0 strip slides in; 3.0-5.2 sink slides up
      under the shaker (on "rinsing" at 4.6 s); 5.2-8.0 hold at rest.
      [LOCK LINES]
    EDIT LIST
    4 STEPS, +1 RINSE, 1 STEP: counts of the pieces shown
    60+ INGREDIENTS. 6G FIBER: label claim
    $29.99 first order with text sign-up. Renews at $49.99 every 4
      weeks: product page price box and footer
    MISSING: the daily pack photo (lines 3 and 4) and the four
    old-way photos (line 1).

    (cut for length: the full run also had the other test cutouts,
    frames 2 to 5 and clip 2)

tweaks:
  - what: Clip length
    how: Give your tool's clip length. At 8 seconds you fit two or three lines a clip; at 5 seconds, one or two.
  - what: The paper kit
    how: Name your paper and cut style up front, for example "kraft paper, torn edges". Every piece prompt repeats it.
  - what: Diagrams that move
    how: Mark the pin points on a diagram piece ("the lid hinge"). Its pivot is then rigged around that pin and nowhere else.
  - what: A person cutout
    how: Say a line needs a person. It adds one made-up adult cutout with pinned joints to the avatar card and the sheets.

judge:
  - It stopped for your OK after the avatar card, the sheets and the storyboard, unless you asked for every stage in one go.
  - Every piece in every layer stack appears on the parts list.
  - The product cutout is made once from its photo and reused.
  - No prompt asks the tool to write a letter or a number.
  - Every move has a start, an end and a key word it lands on, and every figure in the edit list has a source.

test:
  - Run it on a script whose figures you know by heart. Every number in the edit list should match your source, and no prompt should ask the tool to write one.
  - Make the product sheet and two frames. The product should look identical in both.
  - Play the narration with the clip timings beside it. Each move should land as its key word is said.
  - For each move, say out loud what it shows. If you can't, that line needs a different proof picture.

improve:
  - Write your paper kit into the lock lines in stage 3 of the skill file, so every run uses the same paper and cut style.
  - Keep your approved pieces in one folder and list them in "What you need", so stage 0 marks them "have".
  - Add your figures with their sources to your brand file. The edit list checks every number against them.
  - Pair it with "Paper cutout explainer video ad script writer" first, so each line already has its proof picture and key word.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Takes up to 14 reference images, so every piece and frame matches your sheets."}
    - {name: "Veo", why: "Starts each clip from your approved frame and can end on a second one, in 8-second clips."}
    - {name: "ElevenLabs", why: "Reads the narration with tags for pauses and pace, from a voice you design by description."}
    - {name: "CapCut", why: "Lets you add the words, numbers and captions as their own layers after the clips are made."}
  inputs:
    - "Product photos on a plain background, so each piece cuts out cleanly"
    - "Your brand font files, so the edit list can be set in them"
    - "The final voice-over recording, so each move lands on its key word"

terms:
  - term: Avatar card
    meaning: A short, fixed description of what carries the ad. Here it's usually your product cutout.
  - term: Parts list
    meaning: Every paper piece and photo the ad needs, listed before anything is made.
  - term: Layer stack
    meaning: A frame described as paper layers from back to front, with a place for each piece.
  - term: Pin
    meaning: The point a jointed paper part turns around, like a split pin in a card puppet.
  - term: Lock lines
    meaning: Short lines for the paper, the product and the paper rules, pasted word for word into every prompt.
