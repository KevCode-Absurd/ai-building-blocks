new_slug: personal-mission-statement
name: "Personal mission statement writer"
summary: "Turn your roles, goals and values into a personal mission statement in three lengths, with a one-line version you can say from memory."
job: think-and-decide
thinking: medium
thinking_why: "It turns your own notes into tight wording and checks it against fixed rules."
headline: "Personal mission statement writer"
subhead: "Give it your roles, goals and values. Your AI writes a mission statement in three lengths, in the present tense and in your words. It cuts what will not last, checks that every role has a line, and sets a review date."
explain: |
  Many mission statements read like a poster and change nothing. A useful one is short, specific to you and ready to hand when a request lands. It says what you want to be and what you want to do, and it holds the line on what you will not trade. This writer helps you write a personal mission statement from your own notes, not from a template.

  It starts from your roles, goals and values. It sorts them into being, doing and limits, then drafts a long version with a line per role. It cuts job titles, tools, numbers and empty adjectives, since those will change. It then writes a medium and a one-sentence version, checks that every role has a line, and reads the short one for ease.

  It also sets a review date and a place to keep it. For a family or a small team, it adds a step where everyone edits, because people back what they helped write.
when:
  - You have a roles-and-goals map and need it in a few lines.
  - You want a standard to say yes or no against.
  - A family or team wants one shared statement everyone helped write.
  - Your old statement reads like a poster and you would never say it out loud.
not_for:
  - "You want a company or brand mission. Use the Business mission writer."
  - "You have not listed your roles and goals yet. Start with the Roles and long-term goals mapper, then come back."
  - "You already have a statement and want to know if it works. Use the Mission choice tester."
  - "You only want a ranked list of values. Use the Life values reflection coach."
you_give:
  - "Your roles and long-term goals, for example from the Roles and long-term goals mapper"
  - "Your top values, for example from the Eulogy values finder (optional)"
  - "What you would refuse to do for money, praise or ease (optional)"
  - "Who it is for, such as you, a family or a team (optional)"
  - "Phrases you already use about yourself or your work (optional)"
you_get:
  - A long, a medium and a one-sentence mission statement
  - Your being, doing and limits piles
  - A map of each role to the line that covers it
  - A review date and a place to keep it
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. No files, web search or code needed.
  - Paste your roles, goals and values. Say if it is for you, a family or a team. If you send no roles and goals, it asks for them and stops.
  - Read the three versions aloud. Mark any line that sounds like someone else.
  - Ask for a rewrite of any line you would not say. Keep going until you could say the short one from memory.
  - Take the final version to the Mission choice tester.
how_it_works:
  - title: Gathers raw lines
    text: Pulls every role, goal and value into being, doing and limits.
  - title: Picks a form
    text: Offers a list of rules, a paragraph by roles or one sentence, and suggests the one that suits you.
  - title: Drafts the long version
    text: One or two present-tense lines per role, in your words.
  - title: Cuts to the core
    text: Removes job titles, tools, numbers and adjectives with nothing behind them.
  - title: Writes shorter versions
    text: A paragraph and a sentence that keep your limits.
  - title: Covers every role and reads it aloud
    text: Matches each role to a line, flags roles left out, and flags phrases that sound borrowed.
  - title: Adds how it lives
    text: Sets where to keep it, when to review it and how a family or team writes it together.
output_shape: |
  RAW LINES
  Being: <list>   Doing: <list>   Limits: <list>
  LONG VERSION
  <one or two lines per role>
  MEDIUM VERSION
  <60 to 100 words>
  SHORT VERSION
  <one sentence>
  ROLE MAP
  <role> -> <line>
  KEEP IT
  Where: <place>   Review: <date>   Rule: core stays, details update
  MISSING
  <what would sharpen the statement>
  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - Your roles and long-term goals
    - Your top values (optional)
    - What you would refuse to do for money, praise or ease (optional)
    - Who it is for, and phrases you already use (optional)
  prerequisites:
    - "Your roles and goals from the Roles and long-term goals mapper, and your values from the Eulogy values finder, if you have not listed them yet"
  output:
    - name: RAW LINES
      contains: Your roles, goals and values sorted into being, doing and limits.
    - name: LONG VERSION
      contains: One or two present-tense lines for each role, in your words.
    - name: MEDIUM VERSION
      contains: A paragraph of 60 to 100 words that keeps your limits.
    - name: SHORT VERSION
      contains: One sentence you could say from memory.
    - name: ROLE MAP
      contains: Each role matched to the line that covers it, with any role left out.
    - name: KEEP IT
      contains: Where to keep the statement, a review date and the rule that the core stays and details update.
    - name: MISSING and CHECKS MISSED
      contains: What would sharpen the statement, and one line for each of its own checks it missed.
tweaks:
  - what: Limits
    how: Say what you would not do for money, praise or ease. Without limits the statement says nothing hard.
  - what: The form
    how: Ask for the list form if you like rules and the paragraph form if you think in roles.
  - what: Who it is for
    how: For a family or team, say who will help write it. The skill adds a step for everyone to edit.
  - what: Your own words
    how: Paste phrases you really use. The draft will sound like you and not like a poster.
judge:
  - Every line is in the present tense and in your words.
  - No line depends on a job title, a tool or a number.
  - Every role has a line.
  - You can say the short version after reading it twice.
  - There is at least one limit, something you would refuse.
test:
  - Read the short version to someone who knows you. Ask if it sounds like you.
  - Take one hard choice from last month and see if the statement would have settled it.
  - Wait a week, then write the short version from memory and compare.
improve:
  - Add your own taboo words to the skill file, such as "passionate", so they never appear.
  - Save the final version in your about-me file and in your calendar's weekly review.
  - Add a family or team version with a step for each person to edit.
  - Pair it with "Mission choice tester" right after.
works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Shaping and cutting your own wording is text work any strong chat AI does well."}
    - {name: "A printed card or wall note", why: "A statement you see weekly gets used. One in a file does not."}
  inputs:
    - "A roles-and-goals map from Roles and long-term goals mapper"
    - "A ranked values list from Eulogy values finder"
    - "Three phrases you often use about your work"
terms:
  - term: Core
    meaning: The part of the statement that should hold for years, as opposed to details that will change with jobs and seasons.
  - term: Limits
    meaning: What you refuse to trade, even for money, praise or an easy life.
