thinking: medium
thinking_why: "It writes or plans with a handful of checks."
new_slug: phone-note-image-ad
name: "Phone note screenshot image ad maker"
summary: "Turn your story ad into a phone note screenshot ad: a private note in your narrator's voice, plus a plan to build the image. Words on it stay under 30."
job: make-image-ads

headline: "Phone note screenshot image ad maker"
subhead: Give it your story ad. It picks the note your narrator keeps, such as a streak, a list of things tried or a running cost, and writes 10 to 30 words in their voice. You get the note and how to build the screenshot.

explain: |
  A note people type to themselves is private. Seeing one feels like reading something you weren't meant to, so the words get read by reflex. People also tend to restart goals on fresh dates, like a Monday or the 1st of the month, and the notes app is where those restarts pile up: day 1, day 2, back to day 1.

  The skill picks one of four note shapes from your story: a streak that keeps resetting, a list of things tried and how each ended, a running cost, or a plan dated again on every fresh start. It writes a short title and a few lines the way people type to themselves, with the last line as the one that stings. The screen is a generic notes layout that copies no real phone. It suggests setting the words as real text in a design tool, because image tools still misspell.

when:
  - Your story is about trying things, failing and restarting.
  - The narrator keeps track of something (days, attempts, money, what they tried).
  - You want words on the picture that feel private, not written for an audience.
  - A note written for the image comes back labelled as a re-creation first, so it is never passed off as a real person's note.
not_for:
  - "You want a message from another person on screen: use the Chat screenshot image ad maker."
  - "You want the picture to show reminders the phone keeps sending: use the Ignored reminders image ad maker."
  - "You want to show a made-up story as a real person's private note. Use a true note a customer agreed to share, or label the picture as a re-creation, and check your platform's rules on misleading ads."
  - "You have no story ad yet, or want no words on the picture: write the story first, or use the Problem moment image ad maker."

you_give:
  - Your approved story ad, with any note the narrator keeps
  - How your buyer would type it (optional)
  - Whether words on the image are on or off (optional, default on)
you_get:
  - The note's shape and why it fits your story
  - A 1 to 4 word title and 3 to 6 short lines, exactly as they'll appear
  - A blank version and a short line to run under the image
  - How to build the screen with exact words, or an image prompt
  - Any of the skill's seven checks it still missed, one line each, or none

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad underneath. If the story quotes the note, it uses those words exactly.
  - Build the screen in a design tool from the brief, with the words typed in as real text.
  - If you use the image prompt instead, check every word in the result.
  - Crop it a little at the bottom, the way people share screenshots.
output_sample:
  input:
    - Your approved story ad, with any note the narrator keeps
    - How your buyer would type to themselves (optional)
    - Whether words on the image are on or off (optional, on by default)
  prerequisites:
    - An image tool in your AI, or a design tool like Canva or Figma, to build the screen
    - Your brand brain from the Website brand brain builder (optional)
  output:
    - name: Scene
      contains: One sentence on what someone scrolling would say they saw.
    - name: Shape
      contains: Streak, tried list, running cost or restart plan, and why it fits your story.
    - name: The screen
      contains: The layout, font, time in the status bar and how the picture is cropped.
    - name: Words on the image
      contains: The title and 3 to 6 lines exactly as typed, with the word count.
    - name: Blank version
      contains: The same note with only its title, so you can change the words later.
    - name: Line under the image
      contains: A short caption of about 27 characters that never names the product.
    - name: Flags
      contains: Which words were lifted from your story, which were written for the image, and what was guessed.
    - name: How to make it
      contains: A design-tool build, or an image prompt of 60 to 120 words.
    - name: Checks missed
      contains: One line for each check the note still fails, or none.

how_it_works:
  - title: Sets the house rules
    text: Square, looks like a cropped screenshot, no logo, price, button, product or real phone look.
  - title: Picks the note's shape
    text: A streak, a tried list, a running cost or a restart plan, from what your story says the narrator kept.
  - title: Writes the note
    text: A 1 to 4 word title and 3 to 6 lines, 10 to 30 words, typed the way people type to themselves.
  - title: Briefs a generic screen
    text: A bold title, plain lines, a plain font, the time in the status bar and plenty of empty space.
  - title: Says how to make it
    text: Set the words as real text in a design tool for exact spelling. The image tool is the fallback.

output_shape: |
  SCENE               <what someone scrolling would say they saw>
  SHAPE               <streak | tried list | running cost | restart plan>
  THE SCREEN          <layout, font, time shown, crop>
  WORDS ON THE IMAGE  (<word count>)
                      <title>
                      <3 to 6 lines, exactly as typed>
  BLANK VERSION       <the note with its title only>
  LINE UNDER IMAGE    <words> (<caption line>, <characters>)
  FLAGS               <lifted or written for the image; anything inferred>
  HOW TO MAKE IT      <design-tool build, or a 60 to 120 word prompt>
  CHECKS MISSED       <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on reviews 1 and 2):
    I found this in my notes app last week:
      greens streak
      day 1: done
      day 2: done
      day 3: forgot
      day 4: back to day 1
    I'd restarted that note more times than I can count.
    I've tried a few green powders over the years. The issue was
    never what was in them. It was consistency.
    Sprout is one daily pack: tear the top, eat the small handful of
    gummies inside. One reviewer put it this way: "It's wild I WANT
    to take [Sprout] and don't forget."

    Buyer: the quitter who wants to stick, 28 to 45, office jobs.
  output: |
    SCENE               A phone note titled "greens streak" that keeps
                        going back to day 1.
    SHAPE               Streak. The story's note counts days and
                        resets, and "back to day 1" is its sting.
    THE SCREEN          Generic notes layout: bold title, plain lines,
                        plain sans-serif font, white background, status
                        bar time 07:48. Empty space below, cropped a
                        little at the bottom.
    WORDS ON THE IMAGE  (16 words)
                        greens streak
                        day 1: done
                        day 2: done
                        day 3: forgot
                        day 4: back to day 1
    BLANK VERSION       The same screen with the title "greens streak"
                        and nothing below it.
    LINE UNDER IMAGE    Day 1, again. (plain caption, 13)
    FLAGS               Words lifted from the copy, lower case as typed.
                        "07:48" isn't in the story; it was chosen to fit
                        a morning routine (inferred). The reviewer's
                        line stays in the ad's text, never on the
                        picture.
    HOW TO MAKE IT      Design tool: a 1080 x 1080 white frame, a thin
                        status bar with "07:48" at the top, the title
                        in bold 44 pt, the four lines in regular 36 pt,
                        left-aligned with wide margins, and the bottom
                        edge cut through empty space. Fallback prompt:
                        Square 1:1 cropped phone screenshot of a
                        generic notes screen, white background, plain
                        sans-serif font, status bar showing 07:48. A
                        bold title reads "greens streak". Below it,
                        four plain lower-case lines exactly as written:
                        "day 1: done" / "day 2: done" / "day 3: forgot"
                        / "day 4: back to day 1". Wide empty white
                        space below, cut at the bottom edge like a
                        shared screenshot. Generic icons only, text
                        spelled exactly.

tweaks:
  - what: The note's shape
    how: Ask for a tried list, a running cost or a restart plan instead of a streak. The shape tells the reader what kind of person wrote it.
  - what: How it's typed
    how: Ask for "all lower case, one typo" for someone tired, or "dates and ticks" for someone organised. Keep it to how your buyer would type.
  - what: Length
    how: Ten words reads in a second; 30 is the most before it looks written for an audience. Cut lines, not words within lines.
  - what: Words off
    how: Switch words off and it hands you to the snapshot skill, with the phone screen turned away.

judge:
  - The note agrees with your story and is the narrator's own.
  - No product, result or claim appears in it.
  - It's 30 words or fewer and doesn't read as written for an audience.
  - The screen looks like no real phone's notes app.
  - Every word in the picture matches the note exactly.

test:
  - Run it on a story that quotes a note. The words on the image should match it exactly and the flags should say "lifted".
  - Run it on a story that only describes a note. It should write the fewest words that say what the story says, and flag them.
  - Show the screenshot to someone who fits your buyer. If they say "that's an ad", look for a line that sounds like a pitch and cut it.
  - Count the words in the finished picture. More than 30 means a line slipped in that wasn't asked for.

improve:
  - Add how your buyers type to themselves (lower case, ticks, dates) to "What you need", so written notes sound like them.
  - Save your notes-screen design as a template once, so every new note only changes the words.
  - Write the note into your story word for word, with the last line as the one that stings.
  - Pair it with the reminders skill when the story is about a routine people can't keep.

works_best_with:
  tools:
    - {name: "Canva", why: "Sets the note as real text on a plain screen, so no word is misspelt and you can change it in seconds."}
    - {name: "Figma", why: "Same job with finer control over the status bar, margins and crop, and the frame can be copied for the next one."}
    - {name: "GPT Image", why: "The fallback if you'd rather generate the screen. It renders short quoted text well, but check every word."}
  inputs:
    - "A real note a customer agreed to share, with personal details removed, so the shape and wording are true"
    - "Five reviews about restarting or forgetting, so the lines use your buyers' words"
    - "Your saved notes-screen template, so every version looks the same"

terms:
  - term: Story ad
    meaning: An ad whose main text tells one person's story, like a post from a friend.
  - term: Status bar
    meaning: The strip at the top of a phone screen showing the time and battery.
  - term: Blank version
    meaning: The same picture with no words, so you can change the words later without starting again.
