new_slug: pick-the-right-layout-for-your-image-ad
name: Pick the right layout for your image ad
summary: The one job your image ad can do with your proof, plus its reading order, zones and style.
job: make-image-ads

headline: A clear layout for your image ad, built around the one job your evidence can support
subhead: Give it the buyer, the argument, the size and the proof you have. It picks the kind of ad your evidence allows, then plans the reading order, a zone map in percentages, the style and how it differs from your other ads.

explain: |
  Most image ads start from a layout someone liked. That's how you end up with a testimonial ad and no real testimonial, or a founder ad with a stock face. The layout looks right, but the ad has nothing true to stand on.

  This skill starts from the job instead. It lists the kinds of ad that could work, such as a review that answers a doubt, a fair comparison or a labelled feature, and rules out any your evidence can't back. Then it plans one ad. It sets the order the eye reads it, where each piece sits on the canvas for your size, and a style chosen for the job (studio for clarity, graphic for explaining, documentary for real use). If you share your other ads, it checks this one changes the argument or the scene, not just the colours.

when:
  - You know who the ad is for and what it argues, but not what it should look like.
  - You keep defaulting to the same layout and want one chosen for a reason.
  - You're adding an ad to a batch and need it to be truly different from the rest.

you_give:
  - The buyer, the argument, the product and the ad size
  - The proof you have, such as reviews, photos, offers and comparison facts
  - Your other ads in the batch (optional)
  - Fixed rules, such as no text in the image or a set layout (optional)
you_get:
  - The kind of ad chosen and why your evidence allows it, plus the kinds ruled out
  - The reading order and a zone map for your size
  - The style and the job it does
  - What this ad changes compared with the rest of the batch

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Write a short brief underneath with the buyer, the argument, the product and the size, such as "4:5 feed".
  - Paste your evidence, and say plainly what you don't have (no founder photo, no sale).
  - Add your other ads in the batch if you want this one to differ from them.
  - Hand the zone map to your designer or image tool, and fix any MISSING item first.

how_it_works:
  - title: Picks the job first
    text: Chooses from twelve kinds of ad, such as a problem moment or a review that answers an objection, and rules out any your evidence can't back.
  - title: Sets the reading order
    text: One main idea first, then the support, then the action, with qualifications kept next to their claim.
  - title: Maps the zones
    text: Places image, text, attribution, product and action for your exact size, rearranged rather than stretched.
  - title: Chooses the style
    text: Picks a style by the job it does, such as studio for product clarity or graphic for explaining.
  - title: Varies against the batch
    text: Keeps the product and brand rules fixed and changes the argument or scene, so no two ads share both.

output_shape: |
  JOB  <the kind of ad>
  <why your evidence allows it, with the source>
  Flag: <anything about the proof to state truthfully>

  RULED OUT
  <kind of ad>   <the missing proof, photo or offer>

  READING ORDER
  1 <main idea>  2 <support>  3 <qualifier>  4 <product>  5 <action>

  ZONE MAP, <shape> (<pixels>), top to bottom
  <from-to %>   <what sits there, colour and size>

  STYLE  <style>
  Job    <what the style does for this ad>

  VARIES AGAINST THE BATCH
  <other ad>  <what this one changes: argument or scene>

  FIXED    <product identity and brand rules kept>
  MISSING: <proof, photo or file still needed>

example:
  business: sprout
  input: |
    [the skill]

    Brief: one image ad for the gut-fix seeker (bloating and
    irregularity, has tried fiber powders and probiotics). Doubt:
    "Will this upset my stomach more?" Argument: a gentle daily fiber
    habit. Product: Sprout Original. Size: feed, 4:5.
    Evidence: Sprout brand file and all 20 reviews (pasted below).
    Photos: the pouch on a soft gradient; gummies poured into a hand.
    No founder photo. No sale with an end date.
    Other ads in the batch:
    T1 video, opens "Fix the Hot Girl Tummy"
    F1 carousel, opens "Struggling to Get Enough Fiber?"
  output: |
    JOB  A review that answers an objection
    Objection: "Will this upset my stomach more?" (brand file, the
    gut-fix seeker's stated doubt)
    Answer, review 8, word for word, cut at a full stop:
      "The prebiotics do their job, but not aggressively, and I feel
      like my overall digestion has improved."
    Flag: review 8 has no name and isn't marked verified. Attribute it
    as "Sprout customer review", never as verified. Its next sentence
    names IBS, a condition, so it stays out of the ad.

    RULED OUT
    Founder portrait     no founder on file
    Genuine deadline     the price cut is "indefinitely", no end date
    Problem moment       no photo of the problem; a staged scene would
                         be an illustration, not proof
    Fair comparison      the only comparison fact ("most fiber
                         supplements contain only 5g") has no source
    Grid of proof        no review is marked verified

    READING ORDER
    1 the quote (main idea)
    2 attribution: Sprout customer review
    3 fact: "6 g prebiotic fiber in every pack"
    4 qualifier: "Sensitive stomach? Choose Low Sugar."
    5 gummies in a hand, with the pouch
    6 action button

    ZONE MAP, 4:5 (1080 x 1350), top to bottom
    0-8%     margin
    10-46%   quote, forest green #00582D on warm cream #FFF7DF, large,
             left aligned, yellow #FFCC2E quote marks
    48-53%   attribution, small
    56-63%   fact line, forest green, under the attribution
    64-68%   qualifier, small, right under the fact it qualifies
    70-90%   the gummies-in-hand photo, cut out, about 40% of width,
             pouch beside it, closed
    91-96%   button, 2 to 4 words
    No face anywhere near the quote.

    STYLE  Graphic: flat cream card, real type set over it, one real
           photo
    Job    let the customer's words carry the ad. The hand photo shows
           real use without a staged person.

    VARIES AGAINST THE BATCH
    T1  argues gut pain in slang, on video, with a face. This argues
        gentleness, with a quote and no face.
    F1  asks about getting enough fiber, card by card. This answers a
        doubt in one frame.
    Found while checking: T1's "Fix" is on the brand's own risky list.
    Check it before it runs again.

    FIXED    pouch shape, deep green, yellow wordmark; a daily pack is
             only ever torn across its top; no generated person; no
             result shown
    MISSING: a logo file. Work Sans bold is on file.

tweaks:
  - what: The objection
    how: Name a different doubt, such as "a gummy can't hold enough". It may pick a labelled feature ad with the ingredient counts instead of a review.
  - what: The size
    how: Ask for 9:16 as well. It rearranges the zones for the tall frame and keeps the qualifier next to its claim.
  - what: Fixed choices
    how: Say "no product in the image" or "use a set layout". It keeps those and chooses the job and style around them.
  - what: The batch
    how: Paste every ad already running. The more it sees, the more precisely it can make this one different.

judge:
  - The chosen kind of ad names the evidence it rests on, and that evidence is in what you gave it.
  - Quotes match the review word for word, with the reviewer named and verification stated truthfully.
  - The zone map covers top to bottom for your exact size, with one clear main idea.
  - No generated face or person stands next to a customer quote.
  - It says what changes against each other ad, in argument or scene, not only colour.

test:
  - Run it on an ad you already ran that worked. If it picks the same kind of ad, good. If it rules that kind out, read why; you may be missing the proof it needs in your input.
  - Leave out a photo or a review you'd normally rely on, and check it rules out the kinds of ad that need it.
  - Run it twice on the same brief. The job and the ruled-out list should match. The zone percentages can shift a little.
  - Hand the zone map to your designer without notes. If they ask where something goes, that zone is missing from the map.

improve:
  - List your real photos and proof (verified reviews, founder story, comparison facts) in "What you need" in the skill file, so it knows which kinds of ad you can always make.
  - Delete the kinds of ad in step 1 your business can never back (for example a founder portrait, if there's no founder to show).
  - Add your brand colours, typeface and show-it-right rules to step 4, so every zone map uses them.
  - Save each zone map that wins as a template in your brand file, with the job it did.
  - Pair it with a skill that checks your facts fit an ad template, and with one that finds the image ad types you've never tried.

terms:
  - term: Zone map
    meaning: Where each piece of the ad sits, given as a share of the canvas from top to bottom.
  - term: Qualifier
    meaning: The small words that keep a claim true, such as "on your first order". They must sit right beside the claim.
  - term: Objection
    meaning: The doubt that stops a buyer, such as "will this upset my stomach more?".
