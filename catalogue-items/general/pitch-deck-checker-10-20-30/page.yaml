new_slug: pitch-deck-checker-10-20-30
name: Pitch deck 10/20/30 checker
summary: Check your pitch deck against the 10/20/30 rule. Paste your slides and talk time. Get a score out of 100 from five checks and fixes by slide.
job: speak-and-persuade
thinking: low
thinking_why: It counts and compares against fixed limits, then lists fixes.
headline: Pitch deck 10/20/30 checker
subhead: Paste your slide text, your talk time and who you are pitching to. It counts slides, estimates speaking time and checks text size, your opening and your stated niche. You get a score out of 100 from five parts, with each part shown, and fixes by slide.
explain: |
  The 10/20/30 rule says a pitch deck should have ten slides, run twenty minutes and use type no smaller than thirty points. It is a guide for presenting, not a test of whether a pitch will win funding. This pitch deck checker applies the rule to your deck so you can see where it runs long, dense or generic.

  It scores five parts, each from 0 to 20: slide count, talk length, text size, opening and aim with niche. It shows the working for each. It judges your opening against the audience you name, not against a general company intro. Every fix names the slide to change.

  Some checks need facts you may not have given. Without a font size, it marks the font check missing and uses a labelled word-count guess. Timing is an estimate from a planning pace of 130 words a minute, so rehearse to be sure. The score is a review aid. It does not predict funding or audience response.
when:
  - Your deck has twenty slides and you have a short slot.
  - You are not sure the text is big enough for the room.
  - You use the same opening with every audience.
  - You have a pitch tomorrow and want one last pass on length and clarity.
not_for:
  - "You want a view on whether the business is fundable. This checks the form of the deck, not the business."
  - "You have no deck yet and need the story outlined: use the Pitch arc planner."
  - "The deck is fine but the order of the talk is weak: use the Speech tension planner."
  - "Your readers will read a document alone and nobody will present it: use the Narrative memo checker."
you_give:
  - The text of your deck, slide by slide, with a heading for each slide
  - How long you have to speak, and who you are pitching to
  - The smallest font size in the deck, from your slide software (optional)
  - Your speaker notes (optional)
you_get:
  - A score out of 100 from five parts, each worked out and shown
  - Slide count, estimated talk time and a font check
  - Fixes in order of impact, each tied to a slide
  - A note on whether your opening fits this audience
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. It needs no files, web access or paid tools.
  - Paste the deck text with a heading for each slide. Add your speaker notes if you have them.
  - Say who you are pitching to and how long you have. Add the smallest font size from your slide software.
  - Fix the highest-impact items first, then run it again and compare the two scores.
  - Time yourself speaking the deck once, and compare it with the estimate.
how_it_works:
  - title: Counts the slides
    text: Compares slide count with the ten slide limit and names slides to merge or cut.
  - title: Times the talk
    text: Divides the spoken words by 130 a minute, a planning pace. Real timing needs a rehearsal.
  - title: Checks text size
    text: Checks the font size you give. Without one, it marks the check missing and uses a labelled word-count guess.
  - title: Checks the opening
    text: Looks for an opening made for this audience, not a general company history.
  - title: Checks the aim and niche
    text: Checks the deck aims to avoid being ruled out, and states a niche that is valuable and unique.
  - title: Scores and fixes
    text: Shows each part from 0 to 20 and the total only when the inputs support it. Lists fixes by slide, biggest gain first.
output_shape: |
  CUSTOM SCORE: <n>/100 if supported, or <known subtotal and unresolved parts>
  How it was worked out: slides <n>/20, length <n>/20, text size <n>/20, opening <n>/20, aim and niche <n>/20

  SLIDES
  Count: <n> | Limit: 10 | Merge or cut: <slide numbers>

  LENGTH
  Words: <n> | Estimated time: <minutes> | Limit: <minutes>

  TEXT SIZE
  Actual smallest font: <valid supplied pt or MISSING>
  Text-density proxy <labelled points or unresolved> | dense slides <numbers>

  OPENING
  <what it does now, and what a custom opening needs>

  AIM AND NICHE
  <what the deck says, and what is missing>

  FIXES, IN ORDER
  1. Slide <n>: <fix>

  MISSING
  <facts not given>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - Your deck text, slide by slide
    - How long you have and who you are pitching to
    - The smallest font size in the deck (optional)
    - Your speaker notes (optional)
  output:
    - name: CUSTOM SCORE
      contains: A total out of 100 from five parts, each out of 20, with the working shown.
    - name: SLIDES
      contains: Your slide count against the limit of ten, and which slides to merge or cut.
    - name: LENGTH
      contains: Word count, estimated minutes at 130 words a minute, and your time limit.
    - name: TEXT SIZE
      contains: Your smallest font size, or MISSING with a labelled word-count guess and the dense slides.
    - name: OPENING
      contains: What your first slide does now and what an opening made for this audience needs.
    - name: AIM AND NICHE
      contains: Quoted lines that show your aim and your niche, or a note that they are missing.
    - name: FIXES, IN ORDER
      contains: Each fix names a slide, ordered from biggest point gain to smallest.
    - name: MISSING and CHECKS MISSED
      contains: Facts you did not give, and any check the review could not finish.
tweaks:
  - what: Your talk time
    how: Give the real slot. The limit changes from twenty minutes to whatever you have.
  - what: Font size
    how: Give the smallest valid font size. Without it, the actual font check stays missing; word counts provide a labelled proxy only.
  - what: Who you pitch to
    how: Name the person or firm. The opening check needs it.
  - what: Speaker notes
    how: Paste them separately. Time is based on what you will say, not on the slide text.
judge:
  - Slide count and timing are reported with numbers.
  - Actual font size is checked from a valid supplied value or marked missing; the word-count proxy is labelled separately.
  - The opening is judged against this audience.
  - Every fix says which slide it touches.
  - Each part stays 0–20 and a total 0–100 appears only when supported. Estimates, proxies and missing parts remain visible.
test:
  - Run it on a deck you already know is too long. The score should be low and the fixes clear.
  - Cut the slides it names, run it again and compare the scores.
  - Time yourself speaking the deck and compare it with the estimate.
  - Show the deck to a stranger for one minute and ask what you do.
  - "Use 12 slides, estimated 60 minutes, 10-point type, and 20 each for opening/aim: parts 14/0/0/20/20, total 54; no negative part."
  - "Omit font size but supply two slides over 40 words: actual font MISSING, clearly labelled density proxy 10/20."
improve:
  - Change the limits in step 1 if your event sets different ones, such as eight slides.
  - Add your investor or client list so the opening check knows their interests.
  - Add your own points system if you want to weight length higher.
  - Pair it with "Speech tension planner" to order the beats before you check them.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Counting, timing and listing fixes is text work any strong chat AI does well with this skill.
    - name: Slide software
      why: To check font size and view the deck as the audience will.
  inputs:
    - The slide text, one block per slide
    - Your speaker notes
    - Who you are pitching to and what they invest in
terms:
  - term: 10/20/30
    meaning: A rule of thumb for decks of ten slides, twenty minutes and type no smaller than thirty points.
  - term: Niche
    meaning: The narrow place where you are both valuable to a buyer and different from rivals.
  - term: Proxy
    meaning: A stand-in measure, such as word count for text size. It is labelled and never counted as the real check.
