new_slug: pivot-or-persevere-decider
name: Pivot or persevere decider
summary: Decide whether to keep going or change course. Get a one-line call with facts for and against, the kind of pivot that fits and a review date.
job: plan-strategy
thinking: high
thinking_why: It weighs mixed evidence for a costly decision and must separate signal from hope.
headline: Pivot or persevere decider
subhead: Paste your progress against your targets, by group of customers, and any customer notes. It counts six signs that you are stuck and works out how many more tests you can afford. You get a keep-going or change-course call, the kind of change that fits and a date to review it.
explain: |
  This is the call most teams put off. The numbers are mixed, someone is always sure the next release will fix it, and changing course feels like admitting failure. Many people wish afterwards that they had decided sooner.

  This skill sets progress against the milestones you wrote down, over several groups of customers. It counts six signs of being stuck and works out how many more tests you can afford. It states a call to persevere or pivot, with the facts for and against. If the call is to change course, it names which of ten kinds of change fits what customers said, what you keep, and the new guess to test.

  It gives a judgment, not a formula, and a date to review it. The method draws on the pivot or persevere meeting in Eric Ries's Lean Startup. The six signs are rules of thumb, and the three-sign line is ours.
when:
  - Your changes keep failing to move the key numbers.
  - Your team is split between giving up and one more try.
  - You are asked to justify another quarter of money or time.
  - Your totals are rising, but the rates behind them are flat.
not_for:
  - "You have no milestones or targets yet: use the Seven-question startup scorer or the MVP experiment planner first."
  - "You only have raw numbers by join date: run the Cohort funnel reader first, then bring its result here."
  - "You already decided to pivot and need the cheapest first test: use the Smallest test picker."
  - "You run an established business whose sales are falling: use the Market shift turnaround planner."
you_give:
  - Your progress against targets, by group of customers (the Cohort funnel reader gives you this, or paste your own table)
  - Notes from customers, including those who left (optional, but they help most)
  - Your money or time left, your spend per month and how long one test takes (optional)
  - The milestones you set earlier, with their dates (optional)
you_get:
  - A keep-going or change-course call in one line, with facts for and against
  - A count of six stuck signs, each with its evidence
  - How many more test cycles you can afford
  - If changing course, the kind of change that fits, what you keep and a new guess to test
  - A date for the next review and who should be there
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it into a new chat. It needs no files, web access or paid tools.
  - Paste your table of rates against targets. If you used the Cohort funnel reader, paste its result.
  - Add notes from customers, especially those who left. Add your money and time left.
  - Check the evidence next to each stuck sign that says yes.
  - Treat the call as advice, not a formula. Argue with it using facts, with your team.
  - Hold the review on the date it sets, with the people it lists.
how_it_works:
  - title: Gathers the evidence
    text: Milestones, results and customer notes.
  - title: Reads the trend
    text: Over several groups, not one period.
  - title: Counts stuck signs
    text: Six yes or no questions with evidence.
  - title: Does the runway sum
    text: In test cycles left.
  - title: Makes the call
    text: With facts for, against and what would change it.
  - title: Names the pivot
    text: One of ten kinds, with what to keep.
  - title: Sets the next review
    text: Date, people and what each brings.
output_shape: |-
  EVIDENCE
  <milestone> | predicted <x> | actual <x>

  TREND
  <rate>: start <a> | now <b> | target <c> | direction <up | flat | down>

  STUCK SIGNS
  <sign>: <yes | no> because <evidence>
  Count: <n> of 6

  RUNWAY
  <money or time left> / <spend per month> / <months per cycle> = <cycles>
  Target reached on <date> at current pace

  CALL
  <PERSEVERE | PIVOT>
  For: <three facts>
  Against: <one fact>
  Would change my mind: <x>

  IF PIVOT
  Kind: <type> | evidence <x>
  Keep: <x> | Drop: <x>
  New guess: <sentence with number>
  Smallest test: <x>

  NEXT REVIEW
  <date> | <attendees and what each brings>

  MISSING
  <gaps>

  CHECKS MISSED
  <lines or none>
output_sample:
  input:
    - Your progress against targets, by group of customers
    - Notes from customers, including those who left (optional)
    - Your money or time left and how long one test takes (optional)
    - The milestones you set earlier (optional)
  output:
    - name: EVIDENCE
      contains: Each milestone with what you predicted and what happened.
    - name: TREND
      contains: Each key rate at the start, now and at target, and whether it is moving up, flat or down.
    - name: STUCK SIGNS
      contains: Six yes or no questions, each with its evidence, and a count out of six.
    - name: RUNWAY
      contains: How many more test cycles your money or time allows, and when the target is reached at today's pace.
    - name: CALL
      contains: PERSEVERE or PIVOT in one line, with three facts for, one against and what would change it.
    - name: IF PIVOT
      contains: The kind of change, what you keep and drop, the new guess with a number and the smallest test.
    - name: NEXT REVIEW
      contains: A date, who attends and what each person brings, plus MISSING and CHECKS MISSED lines.
tweaks:
  - what: Customer notes
    how: Notes from people who left often say more than the numbers. Paste them.
  - what: Money and time left
    how: With these it counts test cycles. Without them it only reads the trend.
  - what: How long a test cycle takes
    how: Be honest. A long cycle means fewer chances to be wrong.
  - what: Your milestones
    how: Dated predictions let it measure the gap between hope and result.
judge:
  - The call is one line, with facts for and against.
  - It uses several groups, not one good week.
  - Each stuck sign has evidence behind it.
  - The runway is counted in test cycles.
  - A pivot names one kind and what you keep.
test:
  - Run it on a past decision whose outcome you know. See if the call would have been right.
  - Run it twice on the same facts. The call should not change.
  - Give the same facts to a teammate and compare calls before reading the skill's.
  - At the review date, check whether the new guess was tested as planned.
improve:
  - Add your own stuck signs to step 3 from past stalled projects.
  - Add the money and time rules your board uses to step 4.
  - Keep a log of each call and what happened.
  - Pair it with the Smallest test picker for the pivot's first test.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Weighing evidence and writing a call is text work.
    - name: A shared document
      why: Keeps the evidence, the call and the review date where the team can see them.
  inputs:
    - The progress reading from the Cohort funnel reader
    - Notes from customers who left
    - Your money and time left
    - Your milestone predictions
terms:
  - term: Pivot
    meaning: A planned change to the product, customer, price or growth route that tests a new guess.
  - term: Persevere
    meaning: Keep going on the same plan because the rates are moving toward the target.
  - term: Runway
    meaning: How many more times you can test a guess before money or time run out.
  - term: Group of customers
    meaning: People who joined in the same week or month, so you can compare them with later groups.
