new_slug: plain-error-message-writer
name: "Plain error message writer"
summary: "Rewrite confusing error messages in plain words. Give it your errors and get what went wrong, the next step and a fix, costliest first."
job: design-work
thinking: low
thinking_why: "It rewrites short messages by set rules."

headline: "Plain error message writer"
subhead: "Paste the error messages people see in your app, form or checkout. The prompt rewrites each one to say what went wrong and what to do next, flags the ones that could be prevented, and puts the costliest mistakes first."

explain: |
  An error message shows up when someone is already stuck. A code, a stock phrase or a hint of blame makes it worse, and they leave.

  This prompt rewrites each message in three parts. It says what went wrong in the person's words, gives one next step, and asks if the error could be stopped before it appears. It also ranks them by the cost of the mistake, so the ones that lose money or data are fixed first. It never invents a cause that your trigger does not support.

when:
  - "Your checkout or sign-up form shows stock errors."
  - "Support gets the same confused question after an error."
  - "You are cleaning up the text in a new product."
not_for:
  - "You need legal or payment provider text that must keep fixed wording: check with the provider or a lawyer first."
  - "You need a full review of a whole form or screen: use the Forms and instructions rewriter."
  - "You want the full version with every check: use the Error message rewriter."

you_give:
  - "The exact error messages"
  - "What triggers each (optional)"
  - "Your voice notes (optional)"
you_get:
  - "A rewrite of each message"
  - "A next step for each"
  - "A ranking by cost of the mistake"

how_to_use:
  - "Copy the prompt, then paste it into Claude, ChatGPT or Gemini with your details under it."
  - "Under it, paste your error messages, one per line."
  - "Add what triggers each one if you know."
  - "Send the rewrites to whoever edits the app text."
output_sample:
  input:
    - Your error messages, one per line
    - What triggers each message (optional)
    - Your voice notes, such as calm or direct (optional)
  output:
    - name: Ranked list
      contains: Your messages in order from highest cost to lowest, so money and data problems come first.
    - name: Original and Trigger
      contains: The message as you pasted it and what causes it, or MISSING if you did not say.
    - name: Cost
      contains: A rating of high, medium or small, based on lost money, lost data or a blocked task.
    - name: Rewrite
      contains: One sentence on what went wrong in plain words, then one clear next step.
    - name: Prevent it
      contains: A way to stop the error before it shows, such as a date picker that greys out past dates.
    - name: MISSING
      contains: A list of facts you did not give, such as unknown triggers, so nothing is invented.

how_it_works:
  - title: "Add the trigger"
    text: "What causes each message."
  - title: "Strip jargon"
    text: "No codes in the main text."
  - title: "Say what and how"
    text: "What went wrong, then the next step."
  - title: "Rank"
    text: "Costliest mistakes first."

output_shape: |
  <n>. COST: <high | medium | small>
     Original: <...>
     Trigger: <...>
     Rewrite: <what went wrong>. <next step>
     Prevent it: <...>
  MISSING
  <...>

tweaks:
  - what: "Triggers"
    how: "Without a trigger, the rewrite stays general and marks it MISSING."
  - what: "Voice"
    how: "Say calm, warm or direct and the rewrites follow."
  - what: "Where it shows"
    how: "Say if it is a small toast or a full page. Length changes."

judge:
  - "No message blames the person."
  - "Each gives a next step."
  - "No code stands alone."
  - "The costliest mistakes are first."

test:
  - "Paste a message that is just a code. It should come back as a plain sentence."
  - "Paste a blaming message. The blame should be gone."
  - "Show the rewrites to someone who has never used the app."

improve:
  - "Add your product's own words for things."
  - "Add the contact route for support."
  - "Pair it with Brand voice one-pager writer so the tone matches."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A short prompt works in any strong chat AI. Paste it, then add your details under it."}
  inputs:
    - "Support tickets caused by errors"
    - "Your screen size limits"
    - "A list of the actions that trigger each error"
