new_slug: podcast-style-ad-script
name: "Podcast-style video ad script writer"
summary: "Write a podcast-style video ad script for two made-up speakers. Give it a buyer doubt and your facts. You get a timed script with sources."
job: make-video-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Podcast-style video ad script writer"
subhead: Give it a doubt your buyers hold and the facts you can back. It writes a 15 to 45 second podcast-style talk where a doubting Host meets an explaining Guest, timed to your clips. You get the script, every fact's source and a cast note.

explain: |
  Clips of two people talking at microphones get watched because they feel like overhearing a real talk. They go wrong when a "guest" in a studio says the product changed their life. That's a testimonial from someone who never used it, with a title nobody can check, and viewers hear the ad copy at once.

  This skill starts from one line: what buyers believe now, and what they should believe by the end. The Host voices a doubt your buyers really have. The Guest answers with facts from your list, or passes on what reviews say, word for word and credited. Neither speaker is an expert, a customer or your founder, and a small "Dramatization" line makes clear they're actors. Each turn holds one fact, the words are counted to fit each clip, and the offer shows as text at the end, never spoken.

when:
  - Your buyers hold a belief that stops them buying, and your facts can answer it.
  - Your category has heard every claim, and plain ads get ignored.
  - You want a talking ad that feels real without anyone pretending to be a customer.
not_for:
  - "You need a real customer or expert on camera: film that person, since this script uses two made-up actors and never a real endorsement."
  - "Your product is a health, supplement or other regulated one: get a legal or ad-policy review first, or use a single-speaker or product demo format."
  - "Your point must be seen, or your offer has many terms: use a product demo clip, or a short written ad."

you_give:
  - The one belief to change, how much your buyer knows already, and the length
  - Real customer doubts and words, with sources
  - Your product facts and a short reason it works
  - A photo of your product or pack (attach it; your AI can see pictures)
  - Every fact a speaker may say, your offer and banned claims
  - The length you want (15 to 45 seconds)
you_get:
  - A belief line and the way the argument moves
  - A line-by-line script for Host and Guest, with picture notes
  - A clip plan with the words in each clip, a muted opener and the end text
  - Every fact said, with its source, the disclosure line and a cast note
  - Any of its own checks the script still missed, one line each, or none

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the doubt you want to answer, in your customers' own words.
  - Paste the facts a speaker may say, one per line, with sources.
  - Say the length, for example "30 seconds".
  - Read it aloud with someone, one part each. Any line that sounds like ad copy goes back for a rewrite.
  - Take the script and cast note to "Podcast-style video clip prompt writer". It takes it from there, from the cast to the finished clips.
output_sample:
  input:
    - The one belief you want to change, and how much your buyer already knows
    - Your buyers' doubts in their own words, with sources
    - Your product facts and a short reason it works
    - A photo of your product or pack
    - Your offer, banned claims and the length you want, 15 to 45 seconds
  prerequisites:
    - Your brand brain from the Brand profile builder, or the same facts pasted in
    - A buyer brief from the Buyer brief writer, or the same details pasted in
    - An AI that can read pictures, to check your product photo
  output:
    - name: Belief line
      contains: What buyers think now and what they should think by the end, taken from a doubt they really voiced.
    - name: Shape, product entry and muted opener
      contains: How the talk moves, how the product shows up, and a short opening line for viewers with the sound off.
    - name: Script table
      contains: One row per line with the speaker and words, any on-screen text, and a picture note for each turn.
    - name: Clip plan
      contains: Which lines sit in each clip and how many words each clip holds, plus the offer as end text.
    - name: Facts said
      contains: Every fact a speaker says, with its source, and any gaps marked MISSING.
    - name: Disclosure line
      contains: The on-screen Dramatization label, plus an AI label if the people are AI-made.
    - name: Cast note
      contains: Which two made-up adults should play Host and Guest, how they differ, the room, and why.
    - name: Checks missed
      contains: One line for each check the script still missed, or none.

how_it_works:
  - title: Checks it fits
    text: Talk suits a doubt said out loud. It says so when your point needs a picture or the offer has many terms.
  - title: Writes the belief line
    text: What buyers think now and what they'll think after, taken from a doubt real buyers voiced.
  - title: Sets two honest speakers
    text: Two made-up, unnamed adults, marked as a dramatization. Host on the left doubts, Guest on the right explains.
  - title: Limits what they say
    text: Facts from your list and credited reviews only. Never a result, a title or a number without a source.
  - title: Picks the shape
    text: Problem then fix, discovery, or myth-bust, plus how the product enters the frame.
  - title: Counts the words
    text: About 2.5 words a second, two or three turns per clip, and no sentence split across clips.
  - title: Writes the cast note
    text: Says which two made-up adults should play Host and Guest, and why, so the clips skill can cast them.

output_shape: |
  BELIEF  They think <...>. By the end they think <...>.
  SHAPE  <problem then fix, discovery or myth-bust>
  PRODUCT ENTRY  <on the table from frame 1, or noticed partway>
  MUTED OPENER  "<6 words or fewer>"
  DISCLOSURE  <Dramatization line, AI label if AI-made>
  CAST NOTE  <two made-up adults, how they differ, the room, and why>

  Line | Speaker and words | On-screen text | Picture note
  1 | Host: "<doubt or reaction>" | <opener> | Host left, Guest right; <one action, one reaction>
  2 | Guest: "<one fact>" | - | ...
  ...
  <last> | Host: "<what they'll do next>" | <offer as end text> | ...

  CLIP PLAN  <clip> = <lines>, <words>

  FACTS SAID
  <fact> = <source>
  MISSING: <...>

  CHECKS MISSED  <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Belief to change: "A gummy can't hold enough to replace my powder."
    (a doubt from the brand's buyer research)
    Buyer: knows the usual fixes. Video, 30 seconds.
    Facts a speaker may say:
    - One daily pack is about 20 g, "a small handful" of gummies
    - 60+ ingredients, 21 vitamins & minerals, and 6g fiber per pack
    - About 100% of daily value for vitamins, about 25% for minerals
      (science page)
    Review on file: "[Sprout] has been the one thing I've been able to
    stick to." (brand site)
    Never: that it replaces a powder; any result as a speaker's own.
    Offer: $29.99 first order with text sign-up, renews at $49.99
    every 4 weeks. 30-day money-back, first order only.
    Brand name said: "Sprout".
  output: |
    BELIEF  They think a gummy can't hold enough. By the end they
            think one pack holds more than they guessed, and they
            know what it doesn't hold.
    SHAPE  Myth-bust (the research shows the belief)
    PRODUCT ENTRY  On the table from frame 1, front to camera
    MUTED OPENER  "Can a gummy hold enough?"
    DISCLOSURE  "Dramatization" small in a top corner, plus the AI
                label if the clip is AI-made.

    Line | Speaker and words | On-screen | Picture note
    1 | Host: "A gummy can't hold enough to replace my powder." |
        Can a gummy hold enough? | Two-shot, Host left, Guest right.
        Host taps the table; Guest's brows lift.
    2 | Guest: "It's a whole pack. About twenty grams, a small
        handful." | - | Guest single, hands showing the size; Host
        leans back, arms folded.
    3 | Host: "So, a handful of candy." | - | Guest reacting: a half
        smile, mouth closed.
    4 | Guest: "Sixty-plus ingredients. Twenty-one vitamins and
        minerals. Six grams of fiber." | - | Close on the pouch on the
        table, front on.
    5 | Host: "Twenty-one. At full amounts?" | - | Host single, one
        brow up; Guest nods once.
    6 | Guest: "Vitamins, about a hundred percent of daily value.
        Minerals, about a quarter." | - | Two-shot; Host unfolds his
        arms.
    7 | Guest: "The reviews keep saying 'the one thing I've been able
        to stick to.'" | - | Guest single; Host glances at the pouch.
    8 | Host: "Okay. Send me that." | $29.99 first order with text
        sign-up. Renews at $49.99 every 4 weeks. 30-day money-back on
        your first order | Two-shot, pouch low in the middle.

    CLIP PLAN  1 = lines 1-3 (24 words), 2 = lines 4-6 (26 words),
    3 = lines 7-8 (17 words). 67 words, about 27 seconds.

    FACTS SAID
    About 20 g, a small handful = product page and brand file
    60+ ingredients, 21 vitamins & minerals, 6 g fiber = label claim
    About 100% vitamins, about 25% minerals = science page
    Review words, exact = brand site review
    Nobody says it replaces a powder. There's no claim on file for
    that, so the Guest gives the numbers and the viewer decides.

    CAST NOTE  Two made-up adults, peers of the quitter who wants to
    stick (28 to 45). A Host in his forties who sounds tired of
    powders, and a younger Guest who reads labels. Make them differ in
    age, hair, build and colour of top, at a plain table at home. No
    host or show anyone knows, and nobody dressed as an expert.
    Next: the podcast clips skill writes the two cast cards.

tweaks:
  - what: The shape
    how: Ask for myth-bust when buyers hold a clear belief, discovery when a fact can surprise the Guest, or problem then fix when you have the problem in buyers' words.
  - what: How the product enters
    how: Ask for "noticed on the table" and the Host spots the pack partway and asks what it is. It's still never pulled from a bag.
  - what: The length
    how: 15 seconds is one clip of two or three turns. 45 seconds runs to three or four clips. Past 45 seconds, use another format.
  - what: The buyer stage
    how: Say how much your buyer knows. It suits buyers who know the problem or have heard every claim; for buyers who don't see a problem yet, it tells you to pick another format.

judge:
  - The first line is a doubt or a reaction, never "welcome back".
  - The Host's doubt is one your buyers have said in their own words.
  - Every fact the Guest says is on your facts list with a source.
  - Nobody says they tried it, saw results or is an expert.
  - The word count fits the length, and the offer only appears as end text.

test:
  - Read line 1 on its own. If it doesn't make you want line 2, ask for a new opener.
  - Tick each fact the Guest says against your facts list. Every one should be there.
  - Run it twice on the same doubt. Neither version should have anyone claim a result or a title.
  - Count the words in each clip. At about 2.5 words a second, they should fit the clip length.

improve:
  - Paste your buyers' doubts, word for word from reviews and support emails, into "What you need" in the skill file, so step 2 always starts from a real one.
  - Add your allowed facts with sources to step 5, so the Guest only ever says those.
  - If you make a series, write your room and props into step 10, so every clip looks like the same set.
  - Put your video tool's clip length into step 9, so the clip plan fits it.

works_best_with:
  tools:
    - {name: "Claude", why: "Keeps every spoken fact tied to your list and counts the words in each clip."}
    - {name: "Kling", why: "Makes clips up to 15 seconds with several shots and lines for more than one speaker, so a clip can hold a few turns."}
    - {name: "Veo", why: "Speaks quoted lines for a named speaker, so each turn comes from the right mouth."}
  inputs:
    - "A recorded sales or support call, used with permission, so the turns sound like your buyers really talk"
    - "A voice note of how your brand name is said, so neither speaker gets it wrong"
    - "A photo of the room you want, so a series of clips keeps one set"
    - "Your video tool's clip lengths, so every clip ends on a whole turn"

terms:
  - term: Myth-bust
    meaning: A talk where one person states what buyers believe and the other gives the one reason it isn't so.
  - term: Muted opener
    meaning: A short version of the first line shown as text, for people watching with the sound off.
  - term: Dramatization
    meaning: A small on-screen label saying the people are actors, not a real unscripted talk.
