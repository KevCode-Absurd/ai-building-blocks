new_slug: positioning-memo
name: "Outcome-first positioning memo writer"
summary: "Paste your product facts. Get a positioning memo for your team that names the outcome you sell and ends with one line everyone can repeat."
job: write-and-tell-stories
thinking: medium
thinking_why: "It reframes the product around an outcome and must keep every claim tied to the facts."

headline: "Outcome-first positioning memo writer"
subhead: "Paste your product facts. It names what customers think they are buying, the outcome they really get, who they become after three months and one relatable example user, then writes a team memo with one line everyone can repeat."

explain: |
  Teams drift into selling the feature list. The product is a tool, so the talk is about the tool. Customers do not shop for a tool. They shop for the thing the tool helps them become.

  This skill writes a memo for your team that starts there. It states what customers think they are shopping for and translates your value into those terms and into the outcome they really get. It asks who a customer becomes after three months. It uses one analogy from a business that sells a way of life, not a thing. It invents a clearly labelled, relatable user and walks them through. It boils everything to one line the team can repeat, and ends with the bar of polish the work must meet.

when:
  - "Your team argues about features and nobody can say what you sell."
  - "You are about to write a launch, a pitch or a site and need one clear point."
  - "You joined a company and want to write down what it is really for."
not_for:
  - "You need a decision on a proposal with the ask on page one: use the Six-page narrative memo writer."
  - "You want ad copy or a landing page now: agree the one line first, then write the copy with a separate ad or page writer."
  - "You have no product facts yet: write down what it does, who uses it and what it costs first, or talk to a few customers."

you_give:
  - "Facts about your product or service: what it does, who uses it, what it costs"
  - "What customers say they wanted when they came (optional)"
  - "Your brand file (optional)"
  - "Who the memo is for (optional)"
you_get:
  - "What customers think they are shopping for, and the outcome they get"
  - "Who users become after three months"
  - "A relatable example user, labelled as invented"
  - "A memo with one repeatable line and a polish bar"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Paste the product facts."
  - "Say who will read the memo."
  - "Check the outcome against what real customers have told you."
  - "Read the repeatable line aloud to your team."
output_sample:
  input:
    - "Facts about your product or service: what it does, who uses it, what it costs"
    - What customers say they wanted when they came (optional)
    - Your brand file (optional)
    - Who the memo is for (optional)
  output:
    - name: What they think they are shopping for
      contains: One or two lines on what a customer believes they are buying, in their words.
    - name: Outcome
      contains: "Three columns: what you built, what it lets them do, and what it changes."
    - name: Who they become
      contains: Two or three lines on who a customer is after three months of use.
    - name: Analogy
      contains: One business that sells a way of life, how it maps to yours and where it breaks.
    - name: Example user
      contains: One invented, labelled user walked from first need to first result.
    - name: The line
      contains: One sentence your team can repeat in one breath that names the outcome.
    - name: Quality standard
      contains: The standard the work must meet, plus three things that fail it.
    - name: MISSING and CHECKS MISSED
      contains: Gaps in your facts, and any checks the memo still fails, or none.

how_it_works:
  - title: "Say what they think they are shopping for"
    text: "Write in one or two lines what a customer believes they are buying when they arrive, in their words."
  - title: "Translate to the outcome"
    text: "Restate your value in those terms, then in the outcome they really get."
  - title: "Ask who they become"
    text: "Describe who a customer is after three months of use, in two or three lines, using only what the facts support."
  - title: "Add one analogy"
    text: "Choose one analogy from a business that sells a way of life or an identity rather than a thing."
  - title: "Walk through a relatable user"
    text: "Invent one example user who is in a hurry."
  - title: "Boil it to one line"
    text: "Write the single line the team can repeat to explain what you sell."
  - title: "End with the polish bar"
    text: "State the standard of quality the work must meet, based on what the outcome demands."
  - title: "Check it"
    text: "Go through \"Check before you hand it back\" one line at a time and fix any check that fails, if you can."

output_shape: |
  WHAT THEY THINK THEY ARE SHOPPING FOR
  <two lines>

  OUTCOME
  Feature | what it lets them do | what it changes

  WHO THEY BECOME (3 months)
  <two or three lines>

  ANALOGY
  <business, how it maps, where it breaks>

  EXAMPLE USER (invented)
  <walkthrough>

  THE LINE
  <one breath>

  POLISH BAR
  <standard and three things that fail it>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "Customer words"
    how: "Real quotes make the first section true instead of guessed."
  - what: "Time frame"
    how: "Change three months to what fits your product."
  - what: "The reader"
    how: "A memo for a new hire reads different from one for a board."
  - what: "Analogy business"
    how: "Name one you like and it will use it."

judge:
  - "The outcome would still make sense without your product's name."
  - "The repeatable line fits in one breath."
  - "The example user is labelled invented."
  - "Every claim traces to your facts."
  - "You could read the memo to a new hire and they would get it."

test:
  - "Read the line to three team members and ask what they think you sell."
  - "Compare the outcome with what your last five customers told you."
  - "Check each product claim against your facts."
  - "Run it twice. The line should stay close."

improve:
  - "Add your real customer quotes to the facts."
  - "Add your own quality bar to the last step."
  - "Save the line in your brand file."
  - "Once the line is agreed, take it to the Customer hero message writer to turn it into copy."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Reframing facts and writing a memo are text work."}
    - {name: "Customer interview notes", why: "They are the best source for what people think they are buying."}
  inputs:
    - "Reviews or support tickets"
    - "Your brand file"
    - "A competitor's one-line pitch to contrast"

terms:
  - term: "Outcome"
    meaning: "What changes for the customer after they use the product."
  - term: "Polish bar"
    meaning: "The standard of quality the work must meet to deliver the outcome."
