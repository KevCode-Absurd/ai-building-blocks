new_slug: positioning-statement-writer
name: Positioning statement writer
summary: Share your product, buyer evidence and main rivals. Get a proposed position, one clear statement and a short team brief.
job: plan-strategy
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
headline: Positioning statement writer
subhead: Share what buyers compare, what rivals are known for and the facts you can prove. It maps the choices, checks possible differences and picks one attribute to explore. You get a plain statement, proof needs and limits on the claim. Guesses stay marked, and any buyer test still needs real people.
explain: |
  Buyers put brands in a ranking in their minds, one short ladder for each kind of product. The top rung is taken by a leader who stands for something. A brand that says "we do everything" gets no rung at all. Positioning is the work of deciding which rung and which single idea you will hold.

  This skill lists the categories a buyer would put you in and who tops each one. It names what each rival owns as a word or an attribute, and finds a true weakness you can use. If you can't be first in a category, it defines a new one you can lead. It picks one attribute to own, writes a plain one-line statement, tests that it needs no explaining and checks it doesn't stretch past the core.
when:
  - Your pitch lists many strengths and buyers can't say what you stand for.
  - A rival leads your category and you need to know how to compete.
  - You are writing a homepage, ad or pitch and need one clear message first.
you_give:
  - Your product and who it is for
  - Your main rivals, and what they are known for
  - What you can truthfully claim (optional)
you_get:
  - Buyer categories and the rival evidence behind them
  - A useful difference the product can prove, or a clear evidence gap
  - One proposed position, a plain statement and limits on its use
  - A short team brief, rival substitution check and reader-test status
how_to_use:
  - Supply the relevant brief and material, or name files in the authorized project.
  - Ask for the stated result. Keep supplied facts, assumptions and missing evidence distinct.
  - Review the result before authorizing repairs or external changes. Save the returned packet or authorize a file destination.
how_it_works:
  - title: Maps buyer choices
    text: Names the relevant categories and rivals from the supplied buyer evidence. Any guessed ranking stays marked.
  - title: Checks a real difference
    text: Looks for a useful trade-off the product can prove. It does not infer a rival weakness from size or price.
  - title: Writes a bounded position
    text: Chooses one attribute, writes the line and checks whether the nearest rival could use it too. A niche is a proposal until evidence supports leadership.
  - title: Returns the team brief
    text: Separates facts from assumptions, sets the stretch limit and marks any reader test that has not run.
output_shape: |
  THE LADDERS
  Category: <name> | Top rung: <brand> | Second: <brand> | Where you sit: <rung or none>
  ...

  WHAT EACH RIVAL OWNS
  <rival> | <one word or attribute> | Evidence: <how known>

  THE WEAK SPOT YOU CAN USE
  <rival> can't <weakness> because <reason> | True and checkable: <how to check>

  THE CATEGORY YOU CAN LEAD
  <existing rung open, or a new category defined, and why>

  THE ONE ATTRIBUTE TO OWN
  <attribute> | Dropped: <list>

  THE POSITION, IN ONE LINE
  <statement>
  Needs no explaining? <test and answer>

  THE STRETCH LIMIT
  <where the line stops, so it does not dilute>

  BRIEF FOR THE TEAM
  <3 to 5 lines: audience, position, proof, what not to say>

  MISSING
  <facts that would sharpen the position>

  CHECKS MISSED
  <one line per check still missed, or none>
tweaks:
  - what: Rivals you name
    how: Name those buyers actually compare you with, not those you wish they did.
  - what: What rivals are known for
    how: Use the words buyers use, from reviews. These beat your guess.
  - what: Proof you have
    how: Give facts you can show. The position only claims what you can back up.
  - what: Your core product
    how: Say what you must keep selling. It sets the stretch limit.
judge:
  - The position is a single attribute, not a list.
  - Each rival's owned idea is named.
  - The rival weakness is true and checkable.
  - A new category is only proposed when no rung is open.
  - The line stretches no further than the core product.
test:
  - Read the one-line statement to three people and ask what it says you stand for.
  - Check the rival weakness against a source such as reviews or a public fact.
  - Run it twice. The attribute you own should stay close.
  - Put the statement next to rivals' lines and see if it is easy to tell apart.
improve:
  - Add your categories and the usual leaders to step 1.
  - Add words buyers use in reviews, so rivals' attributes are in their language.
  - Save the position as part of your brand file.
  - Pair it with "Brand name stretch checker" before you add products under the name.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Comparing rivals and writing a plain line is text work that any strong chat AI does with this skill.
  inputs:
    - Rival websites and reviews
    - Your own reviews, for the words buyers use
    - Proof points such as tests, awards and numbers
terms:
  - term: Position
    meaning: The one idea a brand holds in the buyer's mind compared with rivals.
  - term: Rung
    meaning: A place on the buyer's mental ladder for a category, such as first choice or second choice.
