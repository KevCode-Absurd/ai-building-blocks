new_slug: post-money-safe-ownership-checker
name: Post-money SAFE ownership checker
headline: Post-money SAFE ownership checker
summary: Check how much of the company a SAFE holder owns after the SAFE converts, and after a later priced round. Built for cap-only post-money SAFEs.
job: money-and-investing
thinking: high
thinking_why: "A SAFE is not stock until it converts, so the cap, the share count and the later round must each come from the signed documents."
subhead: Give it your cap-only post-money SAFE, the amount received, the cap and the later round's dilution. It works out the ownership the SAFE gives, then what is left after the later round. You get a plain bridge, an editable workbook and a list of open questions.
explain: |-
  A SAFE gives an investor a share of the company later, when a priced round converts it. This skill works out that share for a cap-only post-money SAFE, then what is left after a later round dilutes it. It lists the conversion terms it could not settle, so a lawyer can check them. It is arithmetic, not legal or investment advice.

  Illustrative figures only. An amount of 100 at a post-money cap of 1,000 gives 100 / 1,000 = 10%. If a later round dilutes by 20%, the holder keeps 80% of that: 10% x 0.8 = 8%. An amount of 200 at the same cap gives 20%, and 16% after the same round.
when:
  - You hold or issued a cap-only post-money SAFE and want to know the ownership it converts to.
  - A priced round is coming and you want to see how it dilutes the SAFE holder.
  - A reviewer needs to trace each ownership figure back to a signed source.
  - You want a spreadsheet you can change and recalculate.
not_for:
  - "Your SAFE has only a discount, an MFN term, or more than one class of SAFE: ask a startup lawyer or use a cap table tool, since this skill does not solve those."
  - "You need a legal reading of what the SAFE says or advice on whether to sign: ask a lawyer."
  - "You want to guess later dilution from a headline valuation: get the dilution figure from the round documents first, because this skill only uses a figure you give it."
  - "You need to size an option pool top-up before new money: use the Option pool top-up checker instead."
you_give:
  - Your signed cap-only post-money SAFE
  - The amount the company received under the SAFE
  - The valuation cap and how the SAFE counts company shares
  - The share given up in a later priced round, from round documents
  - Your reporting date, currency and scale
  - Your spreadsheet tool and the file format you want (optional)
you_get:
  - The ownership the SAFE gives at the cap, and what is left after the later round.
  - A list of conversion terms that are still open and need your check.
  - An editable workbook with inputs, formulas and checks.
  - A comparison against your instrument ledger, with any gaps marked MISSING.
  - A list of checks that ran and checks that did not.
how_to_use:
  - Open Claude, ChatGPT or Gemini. Use one that can make spreadsheet files.
  - Paste the SKILL.md text, or upload the pack, and attach your SAFE and round documents.
  - Give the amount received, the cap and the later round's dilution. Say your currency and scale.
  - Ask for the ownership bridge and the workbook. The script step needs code running and Node.js.
  - Read the MISSING lines and CHECKS MISSED before you rely on any number.
  - Have a lawyer confirm what the SAFE means before you act on the result.
output_sample:
  input:
    - Your signed cap-only post-money SAFE
    - The amount the company received
    - The valuation cap and how the SAFE defines the company's shares
    - The share of ownership given up in a later priced round, from round documents
    - Your reporting date, currency and scale
  prerequisites:
    - An AI that can create and open spreadsheet files
    - Node.js 20 or later, only if you want to run the included calculation script
  output:
    - name: Ownership bridge
      contains: The SAFE holder's ownership from the cap, then after the later round's dilution, with each step shown.
    - name: Unresolved conversion conditions
      contains: Terms that could change how the SAFE converts, such as a lower round price, listed for you to check.
    - name: Editable workbook
      contains: A spreadsheet with inputs, formulas and checks, using the same layout as the included example.
    - name: Input schema and calculation reference
      contains: The inputs the calculation needs, their units and the test cases it must match.
    - name: Reconciliations
      contains: A comparison of the SAFE amount and ownership against the instrument ledger.
    - name: MISSING lines
      contains: Every input or source that was not supplied, left open rather than guessed.
    - name: CHECKS MISSED
      contains: The checks that failed or could not run, or the word none.
how_it_works:
  - title: 1. Confirm cap-binding post-money form and capitalization exclusions; stop if a lower round price changes the conversion basis
    text: Confirm cap-binding post-money form and capitalization exclusions; stop if a lower round price changes the conversion basis.
  - title: 2. Divide funded investment by post-money cap and reconcile to the instrument ledger; a SAFE is not issued stock before conversion
    text: Divide funded investment by post-money cap and reconcile to the instrument ledger; a SAFE is not issued stock before conversion.
  - title: 3. Apply the supplied later round dilution fraction; keep any new option-pool expansion separate
    text: Apply the supplied later round dilution fraction; keep any new option-pool expansion separate.
output_shape: |-
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Open conversion conditions (terms still to confirm)
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Conversion date"
    how: "Take the conversion date from the signed SAFE and the later round documents. Use one currency and scale on every line."
  - what: "The later round's dilution"
    how: "Change the later round's dilution and have your AI recalculate. Keep the actual figures you supplied."
  - what: Several amounts
    how: Run the same cap with each amount received to compare holders side by side.
judge:
  - Investment and cap use identical currency and scale.
  - SAFE ownership and aggregate ownership must remain between zero and one.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one SAFE ownership you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define post-money cap into SKILL.md, so every run uses your wording."
before: []
next: [option-pool-top-up-checker, weighted-average-antidilution-checker]
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
