new_slug: powerpoint-accessibility-reviewer
name: PowerPoint accessibility reviewer
summary: Share your deck. Get specific fixes for reading order, titles,
  alternative text and readable slides.
job: work-with-files
thinking: high
thinking_why: Native file features, source meaning and check evidence must
  survive the workflow.
headline: PowerPoint accessibility reviewer
subhead: Share your deck. Get specific fixes for slide titles, reading order,
  alternative text and readable visual content. Work on a copy of your file. Get
  a clear record of what passed and what still needs checking.
explain: >-
  Share your deck. Get specific fixes for slide titles, reading order,
  alternative text and readable visual content.


  It works with the actual PowerPoint files and follows a specific method for
  this task. Your source files stay intact. The method starts by checking what
  your AI already knows and which files it can read. It asks only for missing
  facts that change the work.


  You get the requested files plus a short record of the sources and checks. A
  saved file alone does not prove that its formulas, links or layout work. Any
  check that needs an app your AI cannot use stays marked as not run. Review
  those limits before you share the result.
when:
  - Share your deck. Get specific fixes for slide titles, reading order,
    alternative text and readable visual content.
  - Actual PPTX, audience needs, intended presentation app and available source
    images or chart data.
  - You need a checked copy while keeping your original files intact.
you_give:
  - Actual PPTX, audience needs, intended presentation app and available source
    images or chart data.
  - The app and file tools your AI can use for the requested work
you_get:
  - accessibility-review.md and a remediated PPTX copy when editing is requested
    and supported.
  - A record of source files, changes and check results
  - Missing facts and any checks that could not run
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it
    and paste it in.
  - Supply your actual files and describe the result. The AI checks existing
    context before asking for missing information.
  - Review the native output and its real check evidence before sharing it.
how_it_works:
  - title: Step 1
    text: 1. Inspect actual slide titles, native object order, text sizes, color
      use, images, tables and charts. Record the target PowerPoint version and
      which checks the tool can perform.
  - title: Step 2
    text: 2. Give slides useful titles and verify logical reading order in
      PowerPoint’s Reading Order pane when available. Mark purely decorative
      objects appropriately instead of treating visual position as proof of
      reading order.
  - title: Step 3
    text: 3. Write concise alternative text from the image or chart’s actual purpose
      and evidence. Preserve meaningful labels and table headers, and avoid
      unsupported interpretations of a visual.
  - title: Step 4
    text: 4. Check contrast, text legibility, information conveyed only by color,
      link labels and animation-dependent meaning. Inspect rendered slides as
      well as document structure.
  - title: Step 5
    text: 5. Run the intended application’s accessibility checker and a relevant
      keyboard or screen-reader spot check when available. State unrun checks
      and unresolved findings; never equate an XML scan with full accessibility
      compliance.
output_shape: >-
  FILES

  accessibility-review.md and a remediated PPTX copy when editing is requested
  and supported.


  SOURCE MAP

  <file and version> | <sheet, cell or slide> | <what it supports>


  CHECKS

  <check> | <passed, failed or not run> | <evidence>


  OPEN ITEMS

  <missing fact or unsupported check> | <next action>
tweaks:
  - what: Your source files
    how: Actual PPTX, audience needs, intended presentation app and available source
      images or chart data.
  - what: The result you need
    how: Name the file format, audience and parts that must stay editable. State any
      page or slide limit.
  - what: The app used to check it
    how: Say which Excel or PowerPoint version you will use. Your AI must name any
      check it cannot run.
judge:
  - Structural and visual checks are recorded separately.
  - Reading order is not inferred from coordinates alone.
  - No unsupported compliance certification.
  - The result names its sources and keeps unrun checks visible.
test:
  - "Try this case: The first object in reading order is a decorative
    background. Check that it does this: Inspect the actual accessibility order
    and mark the decoration appropriately."
  - "Try this case: The chart only distinguishes series by red and green. Check
    that it does this: Require an additional readable distinction such as labels
    or patterns."
  - Reopen the saved result and compare it with the source. Keep any failed or
    unrun check in the report.
improve:
  - Add your confirmed field names, file rules and target app version to the
    required-input section.
  - Add a small test case with a known answer to the acceptance checks. Keep
    made-up records separate from real work.
  - Save the working rules with the file guide so the next run uses the same
    meanings and checks.
warnings:
  - Requires tools for the requested native file format. Checks requiring an
    unavailable native application must remain marked not run.
tests:
  - input: The first object in reading order is a decorative background
    expected: Inspect the actual accessibility order and mark the decoration
      appropriately.
  - input: The chart only distinguishes series by red and green
    expected: Require an additional readable distinction such as labels or patterns.
