new_slug: powerpoint-speaker-note-builder
name: PowerPoint speaker notes builder
summary: Turn your PowerPoint deck into speaker notes with source links, transitions and a timing plan for your talk length. Your original file stays safe.
job: work-with-files
thinking: high
thinking_why: Native file features, source meaning and check evidence must survive the workflow.
headline: PowerPoint speaker notes builder
subhead: Give your AI your deck and how long you will speak. It writes short spoken notes for each slide and links claims to your sources. You also get a draft timing plan.
explain: >-
  Share your deck and talk length. Get slide notes with source references, transitions and a realistic rehearsal plan.


  It works with the actual PowerPoint files and follows a specific method for this task. Your source files stay intact. The method starts by checking what your AI already knows and which files it can read. It asks only for missing facts that change the work.


  You get the requested files plus a short record of the sources and checks. A saved file alone does not prove that its formulas, links or layout work. Any check that needs an app your AI cannot use stays marked as not run. Review those limits before you share the result.
when:
  - You have a finished deck and need notes before the talk.
  - A teammate gave you their slides and you must present them.
  - You want each figure in your notes tied to a source.
  - You need to fit a talk into a set time, with room for questions.
not_for:
  - "You only want to fix fonts, layout or colors on your slides: use PowerPoint's own formatting tools or a designer."
  - "Your deck will not be spoken aloud, such as a reading deck sent by email: write a short summary instead."
  - "Your AI cannot read or save PowerPoint files: ask it for a plain text script and paste the notes in yourself."
you_give:
  - Your PowerPoint file (.pptx)
  - Your talk length in minutes
  - Your audience
  - The source documents for your figures and claims
  - The tone you want, such as warm or formal (optional)
you_get:
  - A copy of your deck with speaker notes on each slide
  - A draft timing sheet for slides, transitions and questions
  - A source map linking claims to your files
  - A list of checks that passed, failed or did not run
  - A list of missing facts to fix before you present
how_to_use:
  - Open a chat in an AI that can read and save PowerPoint files, such as Claude with file tools. Paste in the skill or add it.
  - Upload your deck and the source files for your figures.
  - Tell it your talk length, your audience and the tone you want.
  - Answer any question it asks about missing facts.
  - Open the new deck and check that each note sits on the right slide.
  - Read the open items list, fix what is missing, then rehearse with a real timer.
  - Do a question-and-answer practice pass. For a take-home copy, use the PowerPoint audience handout builder, which keeps your notes out of the audience file.
output_sample:
  input:
    - Your PowerPoint deck (.pptx)
    - Your talk length in minutes
    - Who is in the audience
    - Source files for any figures or claims
    - The tone you want, such as warm or formal (optional)
  prerequisites:
    - An AI that can open and save PowerPoint files
  output:
    - name: deck-with-notes.pptx
      contains: A copy of your deck with spoken notes saved on each slide, with sources and transitions.
    - name: Rehearsal timing sheet
      contains: A draft time for each slide, transitions and questions, marked as an estimate until you rehearse.
    - name: Source map
      contains: Which file and slide or cell backs each claim and figure in your notes.
    - name: Checks
      contains: Each check marked passed, failed or not run, with the evidence.
    - name: Open items
      contains: Missing facts and checks that could not run, with the next step for each.
how_it_works:
  - title: Step 1
    text: 1. Read each slide and its existing notes. Reuse confirmed audience, purpose and speaker context, preserving approved messages and existing citations.
  - title: Step 2
    text: 2. Write a brief spoken explanation for each slide rather than reading every bullet verbatim. Explain the evidence, relevant caveat and transition to the next slide.
  - title: Step 3
    text: 3. Link claims and figures to supplied sources in the notes. Keep uncertain material labeled, and do not invent anecdotes, user stories or audience reactions.
  - title: Step 4
    text: 4. Allocate a draft timing budget across slides, questions and transitions. Label it as a rehearsal estimate until a real timed run is available.
  - title: Step 5
    text: 5. Save native speaker notes without changing visible slide content unnecessarily. Reopen the PPTX, verify note-to-slide alignment and remove private presenter-only material from any requested audience copy.
output_shape: |-
  FILES
  deck-with-notes.pptx and a rehearsal timing sheet.

  SOURCE MAP
  <file and version> | <sheet, cell or slide> | <what it supports>

  CHECKS
  <check> | <passed, failed or not run> | <evidence>

  OPEN ITEMS
  <missing fact or unsupported check> | <next action>
tweaks:
  - what: Your source files
    how: Actual deck, audience, talk duration, source evidence and the speaker’s preferred style.
  - what: The result you need
    how: Name the file format, audience and parts that must stay editable. State any page or slide limit.
  - what: The app used to check it
    how: Say which PowerPoint version you will use. Your AI must name any check it cannot run.
judge:
  - Notes remain attached to the correct slide.
  - Timing estimates are not described as a completed rehearsal.
  - Audience copies follow the requested notes policy.
  - The result names its sources and keeps unrun checks visible.
test:
  - "Try this case: Eight-minute talk with six content slides and two minutes for questions. Check that it does this: Budget six minutes for the content and label the draft timing estimate."
  - "Try this case: A slide number changed during reordering. Check that it does this: Attach the note to the actual slide identity, not the old ordinal alone."
  - Reopen the saved result and compare it with the source. Keep any failed or unrun check in the report.
improve:
  - Add your confirmed field names, file rules and target app version to the required-input section.
  - Add a small test case with a known answer to the acceptance checks. Keep made-up records separate from real work.
  - Save the working rules with the file guide so the next run uses the same meanings and checks.
warnings:
  - Requires tools for the requested native file format. Checks requiring an unavailable native application must remain marked not run.
tests:
  - input: Eight-minute talk with six content slides and two minutes for questions
    expected: Budget six minutes for the content and label the draft timing estimate.
  - input: A slide number changed during reordering
    expected: Attach the note to the actual slide identity, not the old ordinal alone.
before: []
