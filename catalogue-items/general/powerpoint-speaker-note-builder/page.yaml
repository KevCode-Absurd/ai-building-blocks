new_slug: powerpoint-speaker-note-builder
name: PowerPoint speaker notes builder
summary: Share your deck and talk length. Get speaker notes, source links and a
  timing plan.
job: work-with-files
thinking: high
thinking_why: Native file features, source meaning and check evidence must
  survive the workflow.
headline: PowerPoint speaker notes builder
subhead: Share your deck and talk length. Get slide notes with source
  references, transitions and a realistic rehearsal plan. Work on a copy of your
  file. Get a clear record of what passed and what still needs checking.
explain: >-
  Share your deck and talk length. Get slide notes with source references,
  transitions and a realistic rehearsal plan.


  It works with the actual PowerPoint files and follows a specific method for
  this task. Your source files stay intact. The method starts by checking what
  your AI already knows and which files it can read. It asks only for missing
  facts that change the work.


  You get the requested files plus a short record of the sources and checks. A
  saved file alone does not prove that its formulas, links or layout work. Any
  check that needs an app your AI cannot use stays marked as not run. Review
  those limits before you share the result.
when:
  - Share your deck and talk length. Get slide notes with source references,
    transitions and a realistic rehearsal plan.
  - Actual deck, audience, talk duration, source evidence and the speaker’s
    preferred style.
  - You need a checked copy while keeping your original files intact.
you_give:
  - Actual deck, audience, talk duration, source evidence and the speaker’s
    preferred style.
  - The app and file tools your AI can use for the requested work
you_get:
  - deck-with-notes.pptx and a rehearsal timing sheet.
  - A record of source files, changes and check results
  - Missing facts and any checks that could not run
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it
    and paste it in.
  - Supply your actual files and describe the result. The AI checks existing
    context before asking for missing information.
  - Review the native output and its real check evidence before sharing it.
how_it_works:
  - title: Step 1
    text: 1. Read each slide and its existing notes. Reuse confirmed audience,
      purpose and speaker context, preserving approved messages and existing
      citations.
  - title: Step 2
    text: 2. Write a brief spoken explanation for each slide rather than reading
      every bullet verbatim. Explain the evidence, relevant caveat and
      transition to the next slide.
  - title: Step 3
    text: 3. Link claims and figures to supplied sources in the notes. Keep
      uncertain material labeled, and do not invent anecdotes, user stories or
      audience reactions.
  - title: Step 4
    text: 4. Allocate a draft timing budget across slides, questions and
      transitions. Label it as a rehearsal estimate until a real timed run is
      available.
  - title: Step 5
    text: 5. Save native speaker notes without changing visible slide content
      unnecessarily. Reopen the PPTX, verify note-to-slide alignment and remove
      private presenter-only material from any requested audience copy.
output_shape: |-
  FILES
  deck-with-notes.pptx and a rehearsal timing sheet.

  SOURCE MAP
  <file and version> | <sheet, cell or slide> | <what it supports>

  CHECKS
  <check> | <passed, failed or not run> | <evidence>

  OPEN ITEMS
  <missing fact or unsupported check> | <next action>
tweaks:
  - what: Your source files
    how: Actual deck, audience, talk duration, source evidence and the speaker’s
      preferred style.
  - what: The result you need
    how: Name the file format, audience and parts that must stay editable. State any
      page or slide limit.
  - what: The app used to check it
    how: Say which Excel or PowerPoint version you will use. Your AI must name any
      check it cannot run.
judge:
  - Notes remain attached to the correct slide.
  - Timing estimates are not described as a completed rehearsal.
  - Audience copies follow the requested notes policy.
  - The result names its sources and keeps unrun checks visible.
test:
  - "Try this case: Eight-minute talk with six content slides and two minutes
    for questions. Check that it does this: Budget six minutes for the content
    and label the draft timing estimate."
  - "Try this case: A slide number changed during reordering. Check that it does
    this: Attach the note to the actual slide identity, not the old ordinal
    alone."
  - Reopen the saved result and compare it with the source. Keep any failed or
    unrun check in the report.
improve:
  - Add your confirmed field names, file rules and target app version to the
    required-input section.
  - Add a small test case with a known answer to the acceptance checks. Keep
    made-up records separate from real work.
  - Save the working rules with the file guide so the next run uses the same
    meanings and checks.
warnings:
  - Requires tools for the requested native file format. Checks requiring an
    unavailable native application must remain marked not run.
tests:
  - input: Eight-minute talk with six content slides and two minutes for questions
    expected: Budget six minutes for the content and label the draft timing estimate.
  - input: A slide number changed during reordering
    expected: Attach the note to the actual slide identity, not the old ordinal alone.
