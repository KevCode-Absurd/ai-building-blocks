new_slug: prediction-and-bet-planner
name: "Prediction and bet planner"
summary: "Turn a belief into a checkable bet. Get what it predicts, what would prove you wrong, a small stake and a date to check."
job: test-an-idea
thinking: medium
thinking_why: "It turns a loose belief into checkable claims and weighs rival explanations, which needs some judgment."

headline: "Prediction and bet planner"
subhead: "Give it a belief about your market, customers or work. It states the belief plainly and writes what it predicts that you could check. It writes the result that would prove you wrong before any test. You get a small stake, a date to check and the rival explanations."

explain: |
  A belief that nothing could disprove teaches you nothing. "Customers like our brand" or "this channel will grow" feel true. Nothing could show they are false, so nobody checks. Putting a small stake and a date on a belief forces one question: what would you see if you were wrong?

  This skill strips the belief down to its simplest form and writes what it predicts. It writes the result that would prove you wrong before you test anything, so you can't move the goalposts later. It sets a small stake and a date. It lists the rival explanations and says which one you prefer and why.

  The bet is the point. Most planning tools stop at a forecast. This one leaves a block to fill in on the date: the result, who won, and what changed your mind.

when:
  - "You hold a strong view about your market and have never tested it."
  - "Two people on your team disagree and neither can say what would change their mind."
  - "A planning meeting ends with a vague forecast such as this channel will grow."
  - "You want to write your guesses down first, so you can learn from them instead of explaining them away later."

not_for:
  - "You need a proper test with before and after numbers: use the One-change experiment planner."
  - "You want the strongest case against a plan you already favour: use the Plan objection writer."
  - "You want to collect facts against a belief over several weeks: use the Assumption evidence tracker."
  - "The belief has no result you could ever see, or a stake would be unsafe or unfair. It will not work here."

you_give:
  - "The belief, in your own words"
  - "What changes if you are right or wrong (optional)"
  - "Rival views you have heard (optional)"
  - "Numbers that bear on the belief, such as last quarter's sign-ups (optional)"
you_get:
  - "The belief in its simplest form"
  - "2 to 4 things it predicts that you could check, each with where to look and by when"
  - "The result that would prove you wrong, written before the test"
  - "A small stake, who holds it and a date to check"
  - "Rival explanations set out fairly, with the one you prefer"
  - "Blanks to fill in on the date: result, won or lost, what changed your mind"

how_to_use:
  - "Open the skill in your AI, or copy it and paste it into Claude, ChatGPT or Gemini. It needs no files or tools."
  - "Write the belief the way you would say it to a friend. Add any numbers you have."
  - "Read WHAT WOULD PROVE ME WRONG first. If you would never accept that result, say so and ask for a sharper version."
  - "Pick a stake you would feel but not fear, such as a lunch, a donation or an hour of work. Do not bet money."
  - "On the date, check the numbers, fill in the AT THE DATE block and settle the bet in the open. For a test with before and after numbers, take the belief to the One-change experiment planner."

how_it_works:
  - title: Simplifies the belief
    text: States the belief in its plainest form, without hedges.
  - title: Writes the predictions
    text: Writes what the belief predicts that you could check.
  - title: Names the losing result
    text: Writes the result that would prove you wrong, before any test.
  - title: Sets the stake and date
    text: Sets a small stake and a date for checking.
  - title: Lists rival explanations
    text: Sets out the other explanations fairly and says which you prefer and why.
  - title: Settles the bet
    text: At the date, checks the result and pays up in public if you lost.
  - title: Records the change of mind
    text: Notes what changed your mind or confirmed your view.

output_shape: |
  THE BELIEF
  <simplest form>

  WHAT IT PREDICTS
  1. <thing you could check> | Where to look: <source> | By: <date>
  ...

  WHAT WOULD PROVE ME WRONG
  <result, as a number or an outcome>

  THE BET
  Stake: <what> | Held by: <who> | Check on: <date>

  RIVAL EXPLANATIONS
  1. <rival view> | Fits the facts because <reason>
  2. ...
  I prefer: <which> because <reason>

  AT THE DATE
  Result: <fill in> | Won or lost: <fill in> | Settled in public: <how>

  WHAT CHANGED MY MIND
  <fill in>

  MISSING
  <facts that would sharpen the bet>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "Your belief, in your own words"
    - "What is at stake if you are right or wrong (optional)"
    - "Rival views you have heard (optional)"
    - "Numbers that bear on the belief (optional)"
  prerequisites:
    - "Any chat AI. A shared note or doc helps if others should see the bet."
  output:
    - name: "THE BELIEF"
      contains: "Your belief in its simplest form, in one sentence with no hedges."
    - name: "WHAT IT PREDICTS"
      contains: "Two to four things you could check if the belief is true, each with where to look and by when."
    - name: "WHAT WOULD PROVE ME WRONG"
      contains: "The result, as a number or a plain outcome, written before any test."
    - name: "THE BET"
      contains: "A small stake, who holds it and the date to check."
    - name: "RIVAL EXPLANATIONS"
      contains: "At least two other explanations for the same facts, in their strongest form, and which you prefer."
    - name: "AT THE DATE"
      contains: "Blanks for the result, won or lost, and how you settled it in the open."
    - name: "WHAT CHANGED MY MIND"
      contains: "A line to fill in on the date about what surprised you."
    - name: "MISSING and CHECKS MISSED"
      contains: "Facts that would sharpen the bet, and any check the answer failed, or none."

tweaks:
  - what: Wording of the belief
    how: Say it plainly, without "might" or "tends to". Vague words make wrong results hard to see.
  - what: The stake
    how: Choose something you would feel, but not fear. A stake you ignore does nothing.
  - what: The date
    how: Pick one when the evidence will exist. Too early and nothing shows, too late and you forget.
  - what: Rival views
    how: Add the strongest rival you have heard. It will be set out fairly.

judge:
  - Every prediction can be checked by a named result.
  - A losing result is written down before the test.
  - The stake and date are set.
  - At least one rival explanation is listed fairly.
  - The belief can be wrong.

test:
  - Try a belief you already know turned out false. See if the plan would have caught it.
  - Show the losing result to a colleague. Ask if they would agree it counts as wrong.
  - Run it twice on the same belief. The predictions should be close.
  - At the date, check that the result was easy to read against what you wrote.

improve:
  - "Add the numbers you can pull to the prediction step, so predictions use real sources."
  - "Add the kind of stake your team likes, such as a lunch or a donation."
  - "Keep a list of bets and results to see how often you are right."
  - "Pair it with the One-change experiment planner when a bet needs a proper test."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Turning a belief into checkable claims is text work that any strong chat AI does with this skill."}
    - {name: "A shared note or doc", why: "Lets others see the bet and the date, which keeps you honest."}
  inputs:
    - "Numbers that bear on the belief"
    - "The strongest rival view you have heard"
    - "The names of people who will see the bet"

terms:
  - term: Prediction
    meaning: A claim about what you will see if the belief is true, which you can check.
  - term: Stake
    meaning: The small price you agree to pay if you turn out to be wrong.
