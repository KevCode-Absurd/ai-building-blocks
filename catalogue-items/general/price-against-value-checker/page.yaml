new_slug: price-against-value-checker
name: Price against value checker
summary: Check a price against value. Share dated cash flows, costs and a rate. You get three value cases, a price limit if the inputs support one, and gaps.
job: money-and-investing
thinking: high
thinking_why: It builds a value range from thin facts and compares it with alternatives, which needs careful reasoning.
headline: Price against value checker
subhead: Share cash amounts, receipt dates, costs and your chosen rate. It discounts each dated payment, checks the order of three cases and compares alternatives. Get the sums, a supported range or unresolved candidates, and a maximum-price scenario where valid. A discount from estimated value does not prove safety or tell you to transact.
explain: |
  The price asked and the value estimated from future cash flows can differ. That estimate depends on the amounts, dates, costs and rate you supply. A finite two-year stream is not worth the same as the same amount paid forever.

  This skill shows dated sums for three cases. It gives an ordered range only when the supported bad, ordinary and good values fit that order. Missing or crossed cases stay separate. A maximum-price rule is applied only after those checks pass. It also compares the stated alternative and fees. These are scenarios for analysis, not guarantees or personal financial advice.
when:
  - You are about to buy a business, equipment, a contract or a stake and must set a price.
  - A seller says it is a bargain and you cannot tell.
  - You want to compare a new opportunity with what you already have.
not_for:
  - "Your purchase has no dated cash flows, or a known market quote sets the price: use a comparable-sales check or the quoted price instead."
  - "You want a personal verdict on whether to buy or sell a named security: ask a licensed financial adviser, as this method does not give advice."
  - "You have no rate and no way to choose one: first settle your rate with an adviser or accountant, then come back."
you_give:
  - Your dated cash amounts, with currency and whether each arrives at the start or end of a period
  - Your time span in years, or a clear statement that the payments last forever
  - Your chosen rate and the period it covers
  - The asking price, all fees and terms, and any price rule you want to test
  - Your next best alternative for the same money or time (optional)
you_get:
  - Three supported value scenarios with dated sums, or the gaps that block them
  - An ordered range only when all supported cases fit their original order
  - A maximum-price scenario after the value and order checks, with its rule and limits
  - The stated alternative, friction costs and a before-you-commit list
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste dated cash flows, their currency, timing and horizon, your chosen rate and period, the asking price and fees. Name the alternative.
  - Check each assumption it writes down and correct any you know are wrong.
  - Review any supported maximum-price scenario and its assumptions before using it. Missing or crossed cases give no manufactured limit. This is not financial advice.
output_sample:
  input:
    - Your dated cash amounts, with currency and timing
    - Your chosen rate and the period it covers
    - The asking price, fees and terms
    - Your next best alternative for the same money or time (optional)
  output:
    - name: Cash flows
      contains: Your dated amounts in bad, ordinary and good cases, with timing and horizon. Unknown items are marked missing.
    - name: Case values
      contains: Each case discounted by date, with every term of the sum shown.
    - name: Range
      contains: A low, middle and high range only if the cases fit that order. Otherwise no range is given.
    - name: Maximum price
      contains: Your price rule applied to the middle case, with the gap to the asking price. Left open if checks fail.
    - name: Quality over time
      contains: A sum showing what a steady return does over a long hold. An illustration, not a forecast.
    - name: Alternative
      contains: Your next best use of the same money or time, compared with this choice.
    - name: Friction
      contains: Fees, taxes, switching costs and sales commissions, and what they cost over the period.
    - name: Before you commit
      contains: Short answers on timing, funding, exit, better uses of the money and approvals.
    - name: Missing and checks missed
      contains: Gaps in your inputs and any checks the skill could not pass, or none.
how_it_works:
  - title: List what you get
    text: Lists supplied dated cash flows in bad, ordinary and good cases. Unknown amounts or dates stay missing.
  - title: Turn it into a value
    text: Discounts each dated payment with a matching rate period. At zero rate it sums finite flows. A perpetuity shortcut requires an explicit constant forever stream and a positive rate.
  - title: Set the range
    text: Gives a range only when all cases are supported and bad is no greater than ordinary, which is no greater than good. Crossed candidates keep their labels.
  - title: Set the walk-away price
    text: After the value and order gates pass, applies your stated rule or a labelled illustration. A lower price alone does not establish safety.
  - title: Check the long run
    text: Shows the method’s illustrative long-run sum. It does not establish a real holding’s future return.
  - title: Name the best alternative
    text: Compares with the next best use of the same money or time.
  - title: Count the friction
    text: Adds fees, taxes, switching costs and sales commissions.
  - title: Write the before-you-commit list
    text: Lists timing, funding, exits and alternatives.
  - title: Write the plan
    text: Records supported scenarios or unresolved candidates, any valid maximum-price rule, the alternative and remaining checks.
  - title: Checks its own work
    text: Runs its own checks and names any it missed.
output_shape: |
  CASH FLOWS <currency, amounts, dates, start/end timing, horizon and explicit assumptions>
  RATE <chosen rate and matching period, or missing/invalid>
  CASE VALUES <bad, ordinary, good with original labels and each dated sum>
  RANGE <supported bad <= ordinary <= good, or NO VALID ORDERED RANGE / missing cases; never sort or clamp>
  MAXIMUM PRICE <only after value and order checks pass: stated or labelled illustrative rule, arithmetic, asking price and gap; otherwise unresolved>
  QUALITY OVER TIME <illustration, not a forecast>
  ALTERNATIVE <stated choice and supported comparison, or missing>
  FRICTION <fees, taxes and switching costs over the stated period>
  BEFORE YOU COMMIT <timing, funding, exit, alternatives, approvals>
  LIMITS <assumptions and unresolved checks; not proof of safety or an instruction to transact>
  MISSING / CHECKS MISSED <list or none>
tweaks:
  - what: The rate you choose
    how: Supply the rate and its period. Do not invent a rate or silently change timing. With nonnegative future receipts, a higher valid rate lowers present value; mixed cash flows need their own sums.
  - what: How many years you count
    how: State a finite horizon you can defend. Do not turn a staying-power grade into an assumed forever stream.
  - what: The share you use for room for error
    how: State the share or rule to compare after the value and case-order checks pass. Two-thirds of the middle case is an illustration, not proof of safety.
judge:
  - Each dated term can be redone by hand, with matching rate period and finite valid inputs.
  - Finite zero-rate streams use their sum; C/r is reserved for the explicitly defined positive-rate perpetuity.
  - Ranges and maximum-price conclusions require supported cases in their original order. Missing or crossed candidates stay unresolved.
  - The maximum-price rule and assumptions are stated without a guarantee of safety.
  - The alternative and costs use supplied evidence over the same stated period.
test:
  - For 10 received at each of two year ends and rate 10%, show the finite discounted sum rather than 10/0.10.
  - Move those receipts to the start of each year and recalculate using their actual dates.
  - At zero rate, sum a finite stream without dividing by zero.
  - "Give only the good case, or crossed case values: show the gaps or labelled candidates, not an invented range or price limit."
  - Use identical complete inputs twice and compare the arithmetic and stated assumptions.
improve:
  - Keep a record of walk-away prices and what you paid.
  - Add your own typical fees to step seven.
  - Share the sums with someone who will challenge your rate.
next: [sit-still-rule-writer, price-drop-rules-writer, failure-first-plan-check]
works_best_with:
  tools:
    - name: Any good chat AI
      why: This is text reasoning that any strong chat AI handles with the skill.
    - name: A notes app or document
      why: Keeps your answers and the result in one place you can come back to.
  inputs:
    - Past results for the thing being priced, by year
    - A written offer with all fees and terms
    - The return on your best alternative
terms:
  - term: Margin of safety
    meaning: A chosen gap between estimated value and price, intended to leave room for error. It does not prevent loss or prove the estimates are sound.
  - term: Best alternative
    meaning: The next best use of the same money or time, which is the real cost of any choice.
