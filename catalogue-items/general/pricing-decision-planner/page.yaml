new_slug: pricing-decision-planner
name: "Pricing decision planner"
summary: "Set a price from what your product is worth to the buyer. Get three test prices, total profit at each, the best pick and a plan to raise it."
job: make-offer
thinking: high
thinking_why: "It estimates sales and total profit at several prices from thin data, so a bad guess changes the answer."

headline: "Pricing decision planner"
subhead: Give it your product, its costs and what the result is worth to the buyer. It sets three prices from that worth and estimates total profit at each. You get the best price, a gap check, a plan to raise a live price, an owner and a review date.

explain: |
  Many prices are set by adding a margin to cost or by copying a rival. Both skip the question that matters: what is this worth to the buyer, and at which price does the business earn the most in total, not per item.

  This skill sums the true value to the buyer, not the cost alone. It does not copy rivals. It sets three prices as a share of that worth, estimates sales at each and works out the total profit. It picks the price with the highest total profit, checks the gap between price and worth stays wide, and checks the buyer would still be happy at it. If a price is already live, it plans the raise: add value first, then give a dated notice. It names one leader to own the choice, and sets a date to review sales and margin.

when:
  - You are launching something and have no idea what to charge.
  - Your price came from cost plus a margin, or from a rival, and you are unsure it is right.
  - You are thinking of a price rise or cut.
  - You discount to close and want a better way.
not_for:
  - "You want to choose how narrow a buyer to aim at, not what to charge one buyer: use the Niche offer pricing planner."
  - "You have no costs yet and cannot guess them: work them out first, because total profit cannot be found without them."
  - "You need to write the reason for the price or the sales page: use a writing step after this one, not this planner."

you_give:
  - Your product, your costs per unit and your fixed costs
  - What rivals charge (optional, used only as a floor check)
  - What buyers say about value, price and alternatives (optional)
  - Your sales so far at today's price (optional)
you_get:
  - What the result is worth to the buyer, with the sums
  - Three prices that could each work, with sales and total profit estimated at each
  - The price with the highest total profit, the gap to the worth and a buyer check
  - A plan to raise a price that is already live
  - A named owner and a review date

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts and costs, and any sales at today's price.
  - Paste what rivals charge and what buyers say, in their words.
  - Pick the price it recommends only after checking the guesses with real buyers.
  - Put the review date in your calendar.
output_sample:
  input:
    - Your product and what it costs you per unit
    - Your fixed costs for the period
    - What rivals charge (optional)
    - What buyers say about value and price (optional)
    - Your sales so far at today's price (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini. No code or paid tool is needed.
  output:
    - name: Value to the buyer
      contains: The sums for what the result is worth to the buyer, with the lowest sound figure chosen.
    - name: Costs
      contains: Your cost per unit and fixed costs, with any missing cost marked.
    - name: Three prices
      contains: A table of three prices with sales estimate, margin per unit and total profit at each.
    - name: The pick
      contains: The price with the highest total profit, the gap to worth, the multiple of cost and a buyer check.
    - name: If a price is live
      contains: What to add first, the dated notice, and what to offer instead of a discount.
    - name: The number to watch
      contains: One sales or margin figure to track, and the level that would change the price.
    - name: Owner and review
      contains: The person who owns the choice and a date to compare real sales with the estimates.
    - name: Missing and checks missed
      contains: Figures you did not give, and one line for each check the plan still fails.

how_it_works:
  - title: Sums the buyer's value
    text: Adds up what the result is worth to the buyer from their side, not from your cost, and takes the lowest sound figure.
  - title: Sets three prices
    text: Chooses three prices inside a band of the buyer's worth, without copying a rival.
  - title: Estimates sales at each
    text: Estimates sales at each price and marks every guess.
  - title: Works out total profit
    text: Multiplies the margin by the sales to find the total profit at each price.
  - title: Finds the best
    text: Picks the price with the highest total profit.
  - title: Checks the gap
    text: Worth divided by price should stay at 3 or more, with the price well above your cost.
  - title: Plans a raise
    text: For a live price, adds value first and gives a dated notice.
  - title: Checks the buyer
    text: Checks that the buyer would still be glad to buy at that price.
  - title: Names the owner
    text: Names the leader who owns the choice.
  - title: Sets the review
    text: Sets a date to review sales and margin.
  - title: Checks the plan
    text: Runs its own checks and names any it missed.

output_shape: |
  VALUE TO THE BUYER
  Route | sum | figure   (lowest sound figure: <number>)

  COSTS
  Per unit: <figure> | Fixed: <figure>

  THREE PRICES
  Price | Sales estimate (guess or data) | Margin per unit | Total profit
  <price A> | <n> | <figure> | <figure>
  <price B> | ...
  <price C> | ...

  THE PICK
  <price> because <highest total profit> | Gap: <worth / price> | Multiple of cost: <n> | Buyer check: <their words or MISSING>

  IF A PRICE IS LIVE
  <what to add first, the dated notice, who keeps the old price>

  THE NUMBER TO WATCH
  <sales and margin figure to track>

  OWNER AND REVIEW
  Owner: <name> | Review: <date>

  MISSING
  <figures not given>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: Costs
    how: Give per-unit and fixed costs. Without them total profit cannot be worked out, and it will say so.
  - what: Sales estimates
    how: Give any sales you have at one price. It uses them to size the others, and marks the guess.
  - what: Buyer words
    how: Paste what buyers say about value. The buyer check relies on it.
  - what: How wide the three prices are
    how: Say how far you are willing to move. It sets the three within that range.

judge:
  - Three prices are compared on total profit.
  - Costs are in the sheet, not assumed.
  - The buyer view is stated in the buyer's words.
  - One person owns the decision.
  - A review date is set.

test:
  - Recompute the total profit for each price by hand.
  - Show the three prices to a few buyers and ask which feels fair.
  - Check that the price with the highest profit is not far outside what rivals charge without a reason.
  - Run it twice and compare the pick.

improve:
  - Add your real sales at each price you have used to the input.
  - Add price rules you must keep, such as a floor or a price ending.
  - Save each review result to your notes.
  - Pair it with "Value proposition builder" to write the reason for the price.
  - Run Value equation scorer first and paste its report, so the worth rests on the weakest driver.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Comparing three prices and the arithmetic of total profit is work any strong chat AI handles."}
    - {name: "A spreadsheet", why: "Lets you change a sales guess and see total profit move."}
  inputs:
    - "Sales at today's price for several months"
    - "Buyer interviews about value"
    - "Rival prices with what they include"

terms:
  - term: Total profit
    meaning: The margin on one item times the number sold, not the margin per item alone.
  - term: Gap
    meaning: What the result is worth to the buyer divided by the price. A high gap keeps the deal a good one.
  - term: Buyer check
    meaning: A test that the buyer is still glad to pay the price.
