new_slug: problem-moment-image-ad-maker
name: "Problem moment image ad maker"
summary: "Paste your story ad. Get a phone-photo image prompt of the problem moment and a caption line."
job: make-image-ads

headline: "Problem moment image ad maker"
subhead: Give it your story ad. It finds the half second where the problem is plainest, decides who was holding the phone and casts a made-up adult to live it. You get a plain phone photo prompt, a line under the image and flags for anything it guessed.

explain: |
  Most image ads look like ads: a product on a clean background, a price, a button. People scroll past them on reflex. This skill makes the picture for a story ad look like a photo someone took in the middle of an ordinary morning, so the right buyer knows the moment before deciding it's an ad.

  It works the way a street photographer does. It looks for the one instant where the situation reads at a glance, like the second try at swallowing a pill. Then it decides who held the phone. The buyer's own view, looking down at their hands, says "this is me". A partner's view from a few steps away says "someone noticed". The strain goes in hands and posture, never a pulled face, and the light comes from the room at that hour.

when:
  - You have a story ad and need its first picture, and you don't know which type to try.
  - Another picture type can't be made honestly from your story (no note, no review, no sourced fact).
  - Your current image ads show the product on a clean background and people scroll past them.

you_give:
  - Your approved story ad
  - Who the buyer is and when the problem hits them (optional)
  - Your brand's places, light and anything you never show (optional)
you_get:
  - The instant to show, who held the phone, and the person in it
  - A short line to run under the image
  - A 60 to 120 word image prompt, ready to paste into your image tool
  - Flags for anything it had to guess

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your story ad underneath, exactly as it will run.
  - Add one line on who the buyer is and when the problem hits, if the story doesn't say.
  - Paste the image prompt into your image tool and make one square picture.
  - Put the picture next to your story's first line. If the person is posing or smiling, make it again.

how_it_works:
  - title: Sets the house rules
    text: Square, looks taken on a phone, no logo, price, button, brand colour or product, and any person is a made-up adult.
  - title: Names the instant
    text: Picks the half second the problem is clearest, such as a hand mid-reach or the second try, and writes it as one action.
  - title: Decides who held the phone
    text: The buyer's own view looking down says "this is me". Someone a few steps away says "someone noticed". The choice sets the angle.
  - title: Casts a made-up adult
    text: Ordinary clothes, mid-action, with as little face as the moment allows. Hands, a shoulder or a turned head is often enough.
  - title: Puts the strain in the body
    text: The grip, the posture and the free hand carry the problem. For a problem on the body, it shows the routine instead.
  - title: Lights it from the room
    text: Names the real light at that hour and frames it a little off-centre, with something cut off by the edge.

output_shape: |
  SCENE               <what someone scrolling would say they saw>
  WHERE AND WHEN      <place, time of day, what is within reach>
  THE INSTANT         <one action, present tense>
  WHO HELD THE PHONE  <the buyer | someone in the room>, <angle>
  THE PERSON          <made-up adult: age, clothes, hands, how much face>
  WORDS ON THE IMAGE  None.
  LINE UNDER IMAGE    <words> (<caption line>, <characters>)
  FLAGS               <anything inferred, what stays out of frame>
  IMAGE PROMPT        <60 to 120 words, ready to paste>
  CHECKS MISSED       <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on review 5 and the brand's own line
    about pills):
    Every morning at the kitchen sink: one huge multivitamin, a full
    glass of water, and three tries to get it down.
    Then the probiotic. Then the B12.
    Now it's one Sprout daily pack. Tear the top, eat the small
    handful of gummies inside. 60+ ingredients, 21 vitamins and
    minerals, 6 g prebiotic fiber. No water needed.

    Buyer: the quitter who wants to stick, 28 to 45, office jobs.
    Brand look: bright, sunny, everyday adults in casual clothes at
    home. Never clinical.
  output: |
    SCENE               A man at a kitchen sink on a sunny morning,
                        head tipped back, trying to swallow a pill
                        with a full glass of water.
    WHERE AND WHEN      A home kitchen, a weekday before work, sun
                        through the window. Within reach: a plain
                        tablet bottle with its lid off, keys and a
                        work lanyard on the counter.
    THE INSTANT         Tipping his head back for the second swallow,
                        glass at his lips, left hand gripping the sink.
    WHO HELD THE PHONE  Someone in the room: a partner in the doorway,
                        about three steps behind and to the side, so
                        his face is mostly turned away.
    THE PERSON          Made-up man, mid 30s, plain blue work shirt,
                        sleeves pushed up. Right hand holds the glass.
                        Not posing, not looking at the camera.
    WORDS ON THE IMAGE  None.
    LINE UNDER IMAGE    Three tries for one pill. (plain caption, 25)
    FLAGS               Inferred: the work shirt and lanyard come from
                        the buyer line (office jobs), not the story.
                        The bottle is plain and unlabelled, never a
                        rival's. The pouch and daily packs stay out;
                        they belong to the story's ending.
    IMAGE PROMPT        Square 1:1 phone photo taken from a kitchen
                        doorway on a sunny weekday morning. A made-up
                        man in his mid 30s in a plain blue work shirt,
                        sleeves pushed up, stands at the sink seen
                        from behind and to the side, head tipped back,
                        right hand holding a full glass of water to his
                        lips, left hand gripping the sink edge. A plain
                        white tablet bottle with its lid off sits by
                        the tap; keys and a lanyard lie on the counter.
                        Bright window light, slightly off-centre, the
                        fridge door cut off at the left edge, a little
                        grain, unretouched. His face is turned away.
                        Plain unlabelled objects only, no text.
    CHECKS MISSED       none

tweaks:
  - what: The instant
    how: Point it at a different line ("use the turn, not the opening") and you get a different photo of the same story. Make two and test them.
  - what: Who held the phone
    how: Ask for "the buyer's own view" to show only hands and the sink from above, or "someone in the room" for a side-on view. Own-view pictures hide the face entirely, which helps when faces come out fake.
  - what: The light
    how: Name the real light at that hour, such as "phone glow only" or "grey 7am light through blinds". Wrong light is the quickest way a snapshot starts to look staged.
  - what: The product
    how: It stays out by default. If you ask for it, it comes back small and to one side, never held up, and the picture has to work without it.

judge:
  - Read your story's first line, then look at the picture. They should be the same instant.
  - Your buyer would say "that's me", not "that's an ad".
  - Nobody is smiling at the camera, posing or pulling a pained face.
  - There's no product, logo, price or words in the picture.
  - The line under the image describes the thing or the moment, never the reader.

test:
  - Run it on a story ad whose picture already worked. It should land on the same instant, or one your buyers would also know.
  - Run it twice on the same story. The instant and the viewpoint should stay the same; only small details should change.
  - Show the picture without the text to someone who fits your buyer. Ask "what's happening here?" If they describe an ad, the light or the pose is wrong.
  - Test it against your current product-on-a-background image with the same text, so the picture is the only change.

improve:
  - Write your brand's places, light and time of day into "What you need", so the room matches your world every time.
  - Add the things your image tool keeps sneaking in (a smile, a product, a logo) to the "Avoid" list in the skill file.
  - When an instant works, save it in your brand file as the buyer's moment, so the next story starts there.
  - Pair it with the skill that picks the right picture for a story ad, when you're not sure a snapshot is the best type.

works_best_with:
  tools:
    - {name: "GPT Image", why: "Follows long scene descriptions closely, including which hand holds what and where the camera stands."}
    - {name: "Nano Banana", why: "Responds well to named light and camera terms, so 'from the doorway, window light' shows up in the picture."}
    - {name: "Any good chat AI", why: "Picking the instant and writing the brief works the same in any strong chat AI."}
  inputs:
    - "Five reviews that describe the moment in the buyer's words, so the instant comes from them and not from a guess"
    - "A phone photo of a real room your buyers live in, so the place and light look like theirs"
    - "Your never-shown list, such as no bathrooms or no food, so the prompt leaves them out"

terms:
  - term: Story ad
    meaning: An ad whose main text tells one person's story, like a post from a friend.
  - term: Decisive moment
    meaning: A photographer's name for the one instant when a whole situation can be read at a glance.
  - term: Line under the image
    meaning: The bold headline under the picture in a Facebook or Instagram ad.
