new_slug: project-cash-available-bridge
name: Project cash available bridge
headline: Project cash available bridge
summary: Build a project cash available bridge (CFADS) that states its accrual or cash basis and never counts working-capital movements twice.
job: money-and-investing
thinking: high
thinking_why: "Accrual and cash figures treat working capital differently, so the basis must be declared before any line is added or removed."
subhead: A contract-defined project cash available bridge with declared accrual or cash basis and no duplicated working-capital movements. Share financing cash definition; accrual operating revenue and operating costs excluding depreciation/noncash costs before working-capital cash movements; contract exclusions, cash taxes, maintenance capital and signed working-capital investment. Identify whether source data instead already represents actual cash receipts/payments.
explain: |-
  A contract-defined project cash available bridge with declared accrual or cash basis and no duplicated working-capital movements.

  Project finance cash definitions. Illustrative figures only in USD for one period. This fixture is an accrual-to-cash bridge: operating revenue 1,000 less operating cost proxy 400 (excluding depreciation and non-cash expenses) gives 600 before working-capital movements. Contract exclusions 100, cash taxes 50, maintenance capital 100 and working-capital investment 50 leave CFADS 300. An actual receipts/payments source already embeds working-capital settlement and must not deduct that 50 again. A verified cash-basis route explicitly omits the extra working-capital adjustment; unknown data never becomes zero.
when:
  - You need a contract-defined project cash available bridge with declared accrual or cash basis and no duplicated working-capital movements.
  - You work on project finance cash definitions and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You only need a plain profit forecast: use a simple income forecast in your own spreadsheet instead."
  - "You are sizing debt or setting loan terms: ask your lender or financial adviser, because this bridge does not do that."
  - "Your data is actual cash receipts and payments, and you have not checked how it treats working capital: confirm that first, or ask your accountant."
  - "You need to split project cash across senior debt, reserve top-up and junior debt: use the Project payment waterfall builder instead."
you_give:
  - Financing cash definition; accrual operating revenue and operating costs excluding depreciation/noncash costs before working-capital cash movements; contract exclusions, cash taxes, maintenance capital and signed working-capital investment. Identify whether source data instead already represents actual cash receipts/payments.
  - "The period end, plus the currency and scale used for the cash available for debt service."
  - "Your spreadsheet tool, if you want the cash available for debt service as a workbook."
you_get:
  - An editable workbook with the cash available bridge, built on your stated basis.
  - A source index showing where each input came from and its date.
  - A reconciliation table that ties the bridge to source cash and the contract definition.
  - A list of missing inputs and a CHECKS MISSED list.
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the financing agreement's cash definition and the operating figures."
  - "Tell it what you need: the cash available bridge on a stated accrual or cash basis."
  - "Ask it to stop and mark MISSING if the financing cash definition or the basis of the source data is not in your sources."
  - "Check that working capital movements are counted once, on one stated basis, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Your financing cash definition from the contract
    - Operating revenue and operating costs before working-capital movements, or actual cash receipts and payments
    - Contract exclusions, cash taxes, maintenance capital and working-capital investment
    - Reporting date, currency, scale and accounting basis
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, to run the bundled calculation (optional)
  output:
    - name: Scope and dated sources
      contains: "The sources you gave, their dates, and the basis chosen: accrual before working capital, or actual cash."
    - name: Inputs and assumptions
      contains: Every input with its source, currency, scale, sign and period, kept apart from formulas.
    - name: Model calculations and reconciliations
      contains: The bridge from revenue to cash available, tied back to source cash and the contract definition.
    - name: Actual file verification
      contains: Results of recalculating, testing a changed input, rendering each sheet and reopening the saved workbook.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that could not be found and checks that failed or did not run, or the word none.
how_it_works:
  - title: 1. Declare the source basis before calculating
    text: Declare the source basis before calculating. The included model uses accrual operating revenue and an operating cost proxy excluding depreciation and other noncash expenses, both before working-capital settlement movements. Source the financing CFADS definition and matching periods.
  - title: 2. For the pre-working-capital accrual route, subtract contract exclusions, the operating cost proxy, cash taxes, permitted maintenance capital and signed working-capital investment
    text: For the pre-working-capital accrual route, subtract contract exclusions, the operating cost proxy, cash taxes, permitted maintenance capital and signed working-capital investment. Match exclusions to the working-capital perimeter to avoid adjusting excluded revenue twice.
  - title: 3. If actual cash receipts and actual cash operating payments are used instead, those already reflect receivable/payable settlement
    text: If actual cash receipts and actual cash operating payments are used instead, those already reflect receivable/payable settlement. Build a cash-basis bridge and explicitly omit the working-capital adjustment; use zero in that model field only after verifying and recording that it is already embedded, never because evidence is missing.
  - title: 4. Reconcile the chosen route to source cash and the contract definition
    text: Reconcile the chosen route to source cash and the contract definition. Do not mix accrual revenues with cash-paid operating costs or deduct working-capital movements twice. Keep debt service below the bridge and source every other cash/noncash adjustment.
output_shape: |-
  A contract-defined project cash available bridge with declared accrual or cash basis and no duplicated working-capital movements.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Period end"
    how: "Take the period end from the financing agreement's cash definition and the operating figures. Use one currency and scale on every line."
  - what: "Working capital investment"
    how: "Change the working capital investment and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: The source map identifies accrual-before-working-capital or actual-cash basis for every operating line; mixed bases stop the affected bridge.
judge:
  - The source map identifies accrual-before-working-capital or actual-cash basis for every operating line; mixed bases stop the affected bridge.
  - The fixture working-capital increase is an outflow and a decrease a release. An actual cash-receipt/payment bridge explicitly excludes this additional adjustment.
  - Excluded operating income and its receivable/payable balances use the same qualifying cash perimeter, preventing duplicated exclusions.
  - Depreciation/noncash expenses and financing proceeds are not included as operating cash uses/sources; debt service stays below CFADS.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one cash available for debt service you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define cash available for debt service into SKILL.md, so every run uses your wording."
before: []
next: [project-payment-waterfall-builder, debt-service-covenant-headroom-checker]
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
