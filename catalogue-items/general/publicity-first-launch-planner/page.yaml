new_slug: publicity-first-launch-planner
name: "Publicity-first launch planner"
summary: "Plan a product launch that wins press before you spend on ads. Get your category claim, one idea to own and when ads should start."
job: plan-strategy
thinking: medium
thinking_why: "It chooses a category claim and a news angle, which needs judgment, then follows a fixed order."

headline: "Publicity-first launch planner"
subhead: "Give it your new product, its category and what you can truthfully claim. It checks whether you are first in your category, picks one idea to own and finds a news angle a reporter would use. You get a launch plan with press first and a set point to start ads."

explain: |
  A publicity-first launch puts press, reviews and talks before ads. The method behind this skill comes from Al Ries. He held that ads are the seller talking about itself, so a new brand has little credibility when it starts there. Stories told by others come first, and ads follow once people believe you.

  The skill states your category, in the words buyers use, and checks whether you are first in it. If you are not, it finds a narrower category you can lead. It picks the one word or idea to own and finds a news angle that works without your product name. Then it plans press and third-party stories, with a date for each.

  It also sets the point of trust: the signs that mean ads can start, and how much to spend. It never names a real reporter or invents a "first". Anything it cannot check is marked, with the search for you to run.

when:
  - You are launching a new product or brand with a small ad budget.
  - Your last launch had ads, but nobody seemed to notice or believe it.
  - You sell in a crowded category and need a reason to stand out.
  - You want to know when it is safe to start spending on ads.

not_for:
  - "You need sales this week and cannot wait for press: use a paid plan, such as the Google Ads launch planner."
  - "You want one stunt idea, not a whole plan: use the Launch stunt planner."
  - "You don't yet know who you sell to or what you stand for: start with the Positioning statement writer."

you_give:
  - "Your product and the category buyers put it in"
  - "Your price, benefits and any proof you can show, such as tests, awards or firsts"
  - "Your launch budget and dates (optional)"
  - "Your brand voice and look (optional)"
  - "Outlets, writers or reviewers you can reach (optional)"

you_get:
  - "A category claim you can defend, or a narrower category you can lead"
  - "The one word or idea to own"
  - "A news angle that works without your product name"
  - "A press and third-party plan, with a date for each step"
  - "The signs of trust that mean ads can start, and how much to spend"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. It needs no files, web access or paid tools."
  - "Describe the product and name the category the way buyers do. Add price, benefits and proof."
  - "Say what you can truthfully claim as first or best at something. It checks the claim and tells you what to search to confirm it."
  - "Add your budget and any outlets you can reach."
  - "Show the news angle to one reporter or friend. Run the press plan first, and start ads only at the point of trust it names."

how_it_works:
  - title: States the category
    text: Writes the category in buyers' words and says whether you are first in it, with what was checked.
  - title: Narrows if not first
    text: If you are not first, defines a narrower category you can lead and says why it is true.
  - title: Picks one idea
    text: Picks the one word or idea you want to own and drops every other claim from the launch.
  - title: Finds the news angle
    text: Finds the angle a reporter would care about, without the product name, backed by a fact you gave.
  - title: Plans press first
    text: Lists outlets, reviewers and third-party stories, each with a pitch line and a date, before any ad.
  - title: Makes it look different
    text: Compares how rivals look and lists what yours will do differently.
  - title: Sets the ad point
    text: Names the signs of trust at which ads start, and how much to spend.

output_shape: |
  THE CATEGORY
  Category: <name> | First in it: <yes/no, evidence>
  If not first, the narrower category to lead: <name>

  THE ONE IDEA TO OWN
  <one word or idea>

  THE NEWS ANGLE
  <angle that stands without the product name> | Why a reporter cares: <reason>

  PRESS AND THIRD-PARTY PLAN (before any ad)
  Who: <outlets, writers, reviewers, groups> | Pitch: <line> | By: <date>

  THE LOOK
  How it differs from rivals: <list>

  THE POINT OF TRUST
  Start ads when: <signs, such as coverage count or search interest>
  Ad spend: <amount or share> | Goes first to: <what>

  CLAIM CHECK
  <what in the category claim was checked and how>

  MISSING
  <facts that would sharpen the launch>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "Your product and the category buyers put it in"
    - "Price, benefits and proof you can show"
    - "Budget and dates (optional)"
    - "Outlets or writers you can reach (optional)"
  prerequisites:
    - "Your brand brain from the Website brand brain builder (optional)"
  output:
    - name: "The category"
      contains: "Your category in buyers' words, whether you are first in it, and a narrower one to lead if not."
    - name: "The one idea to own"
      contains: "A single word or idea your product can stand for with proof."
    - name: "The news angle"
      contains: "A one-line angle that works without your product name, and why a reporter would care."
    - name: "Press and third-party plan"
      contains: "Outlets, writers and reviewers to approach before any ad, a pitch line for each and a date."
    - name: "The look"
      contains: "How rivals look, and what yours will do differently so it is easy to tell apart."
    - name: "The point of trust"
      contains: "The signs that mean ads can start, when they start and how much to spend."
    - name: "Claim check"
      contains: "Each part of your first or leader claim marked as checked, and how."
    - name: "Missing and Checks missed"
      contains: "Facts you did not give, and any check the skill could not pass."

tweaks:
  - what: Your category
    how: Name it the way buyers do. A made-up name makes the claim of being first harder to check.
  - what: Proof you have
    how: Share tests, awards or firsts. A news angle needs something a reporter can check.
  - what: Budget
    how: State what you can spend on press and on ads. It sets the point of trust and spend.
  - what: Rivals' look
    how: Describe how rivals look, or paste links to them. The plan makes yours different.

judge:
  - One word or idea is chosen to own.
  - The news angle stands without the product name.
  - Ads wait until the trust point.
  - The look is different from rivals.
  - The category claim is checked for truth.

test:
  - Show the news angle to a reporter or friend and ask if they would read it.
  - Check the category claim by searching for an earlier rival.
  - Run it twice. The idea to own should stay close.
  - Look at the look next to your rivals and see if you can tell it apart at a glance.

improve:
  - Add the outlets and groups you can reach to the press plan.
  - Add your own signs of trust, such as number of reviews, for the ad start point.
  - Save the angle and results of each pitch for the next launch.
  - Pair it with "Positioning statement writer" to set the idea to own.

works_best_with:
  tools:
    - {name: "Claude, ChatGPT or Gemini", why: "Choosing a category claim and writing pitch lines is text work. No files or paid tools needed. Web search helps check who was first."}
  inputs:
    - "A list of outlets and writers who cover your category"
    - "Proof you can show, such as tests or firsts"
    - "Photos of rivals' products or packaging"

terms:
  - term: Category
    meaning: The kind of product a buyer puts yours in when they think of what to buy.
  - term: Point of trust
    meaning: The moment when enough people believe in you that ads will work.
  - term: Third-party story
    meaning: A story about you told by someone else, such as a review, a talk or a customer.
