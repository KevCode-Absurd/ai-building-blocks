how_it_works:
  - title: 1. Identify purchased-intangible amortization separately from software, financing costs and internally developed assets; retain the statutory line
    text: Identify purchased-intangible amortization separately from software, financing costs and internally developed assets; retain the statutory line.
  - title: 2. Subtract the specifically attributable recognized tax benefit from amortization to obtain the after-tax adjustment
    text: Subtract the specifically attributable recognized tax benefit from amortization to obtain the after-tax adjustment.
  - title: 3. Divide reported and alternative income by the same appropriate diluted share count, and explain why an addback does not erase purchase cost or ongoing asset replacement
    text: Divide reported and alternative income by the same appropriate diluted share count, and explain why an addback does not erase purchase cost or ongoing asset replacement.
