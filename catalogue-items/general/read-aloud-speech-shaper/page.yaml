next: []
works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Reshaping notes into a read-aloud script is text work any strong chat AI does well with this skill."}
    - {name: "A phone voice recorder", why: "To hear where your breath catches and where you rush."}
  inputs:
    - "Your notes in any order"
    - "The names, dates and places that must appear"
    - "A line from a poem or text that matters to the room"

terms:
  - term: Refrain
    meaning: A short line that returns during the speech and changes a little each time.
  - term: Register
    meaning: The tone of voice the moment needs, such as plain, warm or grave.
