new_slug: real-feeling-checker

name: "Real feeling checker"

summary: "Check if your story, ad or talk makes people feel what you meant. Get a score out of 100, the fakes it uses and a plainer rewrite."

job: design-work

thinking: high

thinking_why: "It judges sincerity and spots fakes in text, and each call needs a quote as evidence."

headline: "Real feeling checker"

subhead: "Paste a story, ad, talk or design brief. It names the one feeling the piece should pass on and tests four ways that feeling gets faked. You get a score out of 100, the places the feeling fades and a plainer rewrite of the weakest passage."

explain: |
  Polished work can still feel empty. The writing is smooth and the design is sharp, but nobody feels anything. The usual causes are a copied look, a pile of accurate detail, a shock added for effect, or a puzzle that is clever and carries no feeling.

  This real feeling checker works from Leo Tolstoy's idea that good work passes a feeling from one person to another. It names the one feeling your piece should pass on. Then it asks whether the maker lived it, and tests four fakes with a quote from your text for each.

  It rates the piece on three conditions: individual, clear and sincere. It shows where the feeling is lost and rewrites one passage in plain words. Unlike a general edit, it does not praise craft. It checks only whether the feeling gets through.

when:
  - "A founder story reads well, but readers do not react."
  - "You are about to publish a brand film script, speech or About page and want to know if it rings true."
  - "A design brief lists many effects and no single feeling."
  - "You have two drafts and need to pick the one that sounds lived, not staged."

not_for:
  - "You want the wording checked for machine-sounding lines. Use the Anti-AI-slop copy editor."
  - "You want a sales draft tightened line by line. Use the Sales copy editor."
  - "You have no draft yet and need a design brief written. Use the Design brief rules writer first."
  - "The text is a legal notice, a data report or safety copy, where feeling is not the goal."

you_give:
  - "The story, ad, talk or design brief to check, pasted in full"
  - "The one feeling you meant to pass on, such as pride or relief (optional)"
  - "Who it is for (optional)"
  - "A few lines on what the maker really went through (optional)"

you_get:
  - "The feeling named in one word"
  - "A score out of 100, with the sums shown"
  - "Four fakes, each marked yes or no with a quote from your piece"
  - "The places where the feeling fades, and why"
  - "The weakest passage rewritten in plain words"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. It needs no tools or files."
  - "Paste the whole piece. If you paste nothing, it asks for the piece and stops."
  - "Add the feeling you meant, and a line on what really happened to the maker, if you know them."
  - "Read each quoted fake aloud. You know what happened, so decide if you agree."
  - "Rewrite the flagged passages in plain words, using its rewrite as a model. Run it again and check the score went up."

how_it_works:
  - title: "Names the feeling"
    text: "Picks one word for what the piece should pass on. If you gave one, it uses yours."
  - title: "Asks if it was lived"
    text: "Looks for detail only someone there would know, and for signs of working for money or show."
  - title: "Tests four fakes"
    text: "Borrowed look, piled-up detail, shock or effect, and puzzle or news value. Each needs a quote."
  - title: "Rates three conditions"
    text: "Individual, clear and sincere, then adds the score out of 100 and shows the working."
  - title: "Marks the loss"
    text: "Points to each place the reader would stop feeling, with the plainest fix."
  - title: "Rewrites one passage"
    text: "Takes the weakest passage and says it in short, plain words."
  - title: "Checks itself"
    text: "Runs its own checks and names any it missed."

output_shape: |
  FEELING
  <one word>

  SINCERITY FIRST
  <did the maker live it, yes / unclear / no> because <reason>

  FAKES
  Borrowed look: <yes or no> | quote: "<short quote>"
  Piled-up detail: <yes or no> | quote: ...
  Shock or effect: <yes or no> | quote: ...
  Puzzle or news value: <yes or no> | quote: ...

  SCORE
  <n> out of 100 = sincere <n>/40 + clear <n>/20 + individual <n>/20 + fakes absent <n>/20

  WHERE THE FEELING IS LOST
  <place> because <reason> | Plainer: <what to cut or say simply>

  THE PLAINEST WAY
  <weakest passage, rewritten>

  MISSING
  <what would change a call>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "The story, ad, talk or design brief to check, in full"
    - "The one feeling you meant to pass on (optional)"
    - "Who it is for (optional)"
    - "A few lines on what the maker lived through (optional)"
  output:
    - name: "FEELING"
      contains: "One word for the feeling the piece passes on, or should pass on."
    - name: "SINCERITY FIRST"
      contains: "Whether the maker lived it (yes, unclear or no), with the evidence."
    - name: "FAKES"
      contains: "Borrowed look, piled-up detail, shock and puzzle value, each marked yes or no with a quote."
    - name: "SCORE"
      contains: "A number out of 100, with the sums for sincere, clear, individual and fakes absent."
    - name: "WHERE THE FEELING IS LOST"
      contains: "Each place the reader stops feeling, the reason, and the plainer way to say it."
    - name: "THE PLAINEST WAY"
      contains: "Your weakest passage rewritten in short, plain words."
    - name: "MISSING"
      contains: "What it could not judge, and what would change a call."
    - name: "CHECKS MISSED"
      contains: "One line for each of its own checks it missed, or none."

tweaks:
  - what: "The feeling"
    how: "Name one feeling, such as relief or pride. A piece meant to pass on three at once is hard to check."
  - what: "What the maker lived"
    how: "Even two lines on the real experience behind it helps the sincerity call."
  - what: "Who it is for"
    how: "Say if it is for everyone or insiders. A piece that only experts can follow fails a clarity test."
  - what: "Which piece"
    how: "Give one piece at a time. A long set blurs the quotes."

judge:
  - "The feeling is named in one word."
  - "Each fake is marked yes or no with a quote from the piece."
  - "Sincerity is judged first."
  - "The fix makes the piece simpler, not fancier."
  - "The score shows its working."

test:
  - "Run it on a piece you know is sincere and one you wrote to order. See if the scores differ."
  - "Give the flagged passage to someone and ask what they feel. Compare with the named feeling."
  - "Run it twice. The named feeling should stay the same."
  - "Rewrite a flagged passage, run it again and check the score moved."

improve:
  - "Add your brand's true stories to \"What you need\" so it can judge sincerity against facts."
  - "Add words your brand avoids to the fake test for borrowed looks."
  - "Keep a list of passages that passed, as models for your team."
  - "Pair it with \"Design brief rules writer\" to turn the fix into a brief."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Reading a text and judging it against fixed tests suits any strong chat AI."}
    - {name: "A person who was there", why: "Only someone who lived it can say if the piece is true to it."}
  inputs:
    - "The maker's own notes on what happened"
    - "The audience description"
    - "Earlier versions of the piece"
    - "Comments from people who read it"

terms:
  - term: "Fake"
    meaning: "Something that looks like feeling but carries none, such as copying an older look."
  - term: "Sincere"
    meaning: "Made by someone who really felt it, not for money or show."
  - term: "Borrowed look"
    meaning: "A style copied from older or popular work, with no feeling of your own in it."
  - term: "Piled-up detail"
    meaning: "Many accurate facts stacked together, with no feeling in any of them."
