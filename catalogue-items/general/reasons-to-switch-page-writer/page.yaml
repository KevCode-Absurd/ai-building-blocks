new_slug: reasons-to-switch-page-writer
name: "Reasons-to-switch page writer"
summary: "Write a reasons-to-switch page for buyers comparing options. Give it your facts and offer. You get 3 to 7 reasons, the offer and headlines."
job: write-landing-page
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Reasons-to-switch page writer"
subhead: Give it your facts and offer, plus the ad and real customer quotes if you have them. It sorts your facts into what pushes buyers to switch and what holds them back. You get 3 to 7 reasons, the offer, questions, headline options and layout notes.

explain: |
  Some buyers already know what kind of product they want and are comparing options. A product page lists features. It rarely says why yours beats what they use now, or answers the worry that stops them switching.

  This skill writes a short "reasons to switch" page that does that one job. It sorts your facts into four piles: what wears buyers down about the old way, what's better about yours, what they fear about switching, and the habits that keep them where they are. Then it writes 3 to 7 reasons, at least one for a worry and one for a habit, because easing a worry often does more than one more benefit. Each title states a fact as a claim, so someone who only scans the titles still gets the case.

when:
  - Your buyers compare you with a cheaper or more familiar option, and your product page doesn't say why you're better for them.
  - You want a short page between your ad and your product page for people who aren't ready to buy yet.
  - Buyers like the idea but stall on a worry, such as taste, price or cancelling.
not_for:
  - "Your buyers don't know the product type yet, or have nothing to switch from: put the facts on your product page, or write a short guide to the category."
  - "You want the full product page with specs and a buy box: build it in your store, or ask a web designer."
  - "You need ad copy, not a page: write the ad first with your AI, then come back with it."

you_give:
  - Your facts, such as what the product is, what sets it apart, prices, offers, guarantee, delivery and the claims you may make
  - The ad that sends people there, with its image attached (strongly recommended)
  - Real customer quotes and the doubts that stop people buying (recommended)
  - How many reasons you want (optional)
you_get:
  - Your facts sorted into push, pull, doubt and habit
  - Three headline options with a pick, and 3 to 7 reasons with titles, bodies and proof
  - The offer block, one question per doubt, a closing and the button text
  - Layout notes, a MISSING list, and any check it couldn't meet

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your facts and current offers, and say what your buyer uses now.
  - Paste the ad that will send people here, so the first screen keeps its words.
  - Add real customer quotes with their source, and the doubts you hear before people buy. With no real quotes, the page ships without proof boxes. You can wait to get some, or go ahead.
  - Pick a headline and check every reason against your facts before you build the page.
output_sample:
  input:
    - "Your facts: what you sell, what sets it apart, prices, offers, guarantee, delivery and allowed claims"
    - The ad that sends people to the page, with its image (strongly recommended)
    - Real customer quotes and the doubts that stop people buying (recommended)
    - How many reasons you want (optional)
  output:
    - name: Page brief
      contains: Who the buyer is, what they use now, the ad's opening line and your offer.
    - name: Four piles
      contains: Your facts sorted into push, pull, doubt and habit, one line per fact.
    - name: Headline options
      contains: Three headlines, a pick with the reason, and a line saying who the page is from.
    - name: Reasons 1 to N
      contains: Each reason has a claim title, a short body, proof from a real quote or none, and an image note.
    - name: Offer block
      contains: The live offer, what is included, and its main condition beside the price.
    - name: Questions and answers
      contains: One answered question for each doubt buyers raised.
    - name: Closing and button text
      contains: A closing heading, one lead-in line and the button text used everywhere.
    - name: Layout notes, MISSING and Checks missed
      contains: How to lay out the page, facts it couldn't fill, and any check it still missed.

how_it_works:
  - title: Pins buyer and old way
    text: Who's reading and what they use now. Every reason is a reason to choose yours over that.
  - title: Sorts facts four ways
    text: Push (the old way's problems), pull (what's better), doubt (fears about switching) and habit (what keeps them put).
  - title: Chooses the reasons
    text: 3 to 7, each arguing one thing, with doubt reasons last, right before the offer.
  - title: Writes each reason
    text: A 5 to 9 word title that states a fact as a claim, and a short body on what changes and why it's true.
  - title: Places the proof
    text: Real quotes sit right under the claim they prove. No quotes means no proof tiles.
  - title: Writes the offer and questions
    text: The live offer once, with its main condition beside the price, then one answer per doubt.
  - title: Keeps it honest
    text: Signed by the business or a real person, never laid out to look like a magazine or review site.
  - title: Checks the page
    text: Goes through its own checks, such as every reason resting on a fact and every quote matching a review, fixes what it can, and names any it missed.

output_shape: |
  PAGE BRIEF
  Buyer: <who>   Old way: <what they use now>   Ad line: "<...>"   Offer: <...>

  FOUR PILES
  Push: <...>   Pull: <...>   Doubt: <...>   Habit: <...>

  HEADLINE OPTIONS
  Ad's words: <...>   Push: <...>   Pull or doubt: <...>
  Pick: <one> . <why>     Under it: <who the page is from>

  <N> REASONS
  1 <title, 5 to 9 words, a claim> (<pile>)
    <what they do now, what changes, the fact that makes it true>
    Proof: "<real quote>" (<source>) | none
  ...

  OFFER       <offer, what's included, condition beside the price>
  QUESTIONS   <one per doubt> / <answer>
  CLOSING     <heading> . <one line> . Button: <same everywhere>
  LAYOUT      <first screen, titles, proof, offer, button>
  MISSING     <each fact it couldn't fill>
  CHECKS MISSED <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Facts: sprout/brand.md and sprout/product-page.md (product,
    prices, guarantee, claims fine and risky, kinds of alternative).

    Buyer: has quit greens powders and wants one habit that lasts.
    Uses now: a greens powder and a shaker.

    No ad yet. Quotes: sprout/reviews.md (R1, R5, R6, R15, R18).
    Doubts on file: "A gummy can't hold enough to replace my powder."
    "They are expensive." Taste can take a few days.
    Offer: Subscribe & Save, Low Sugar.
  output: |
    PAGE BRIEF
    Buyer: powder quitter   Old way: greens powder and a shaker
    Ad line: none   Offer: Subscribe & Save, Low Sugar

    FOUR PILES
    Push:  gritty, chalky drinks; washing the shaker (R3, R6)
    Pull:  tear and eat; 60+ ingredients in one pack; habit survey
    Doubt: not enough in a gummy; price; taste at first (R18)
    Habit: a morning routine built around the shaker

    HEADLINE OPTIONS
    Ad's words: none yet
    Push:  Done scrubbing the shaker? Greens you tear open and eat
    Doubt: Quit greens before? Here's what's different this time
    Pick: Push. This buyer's story starts at the sink.
    Under it: From the Sprout team.

    6 REASONS
    1 One pack to tear, nothing left to wash (push)
      You tear the top off a pack and eat the gummies inside.
      Proof: "not having to clean a shaker bottle or extra dishes for
      greens stuff in powder form, is absolutely excellent!" (R6)
    2 Most surveyed users take it 4+ days a week (pull)
      95% of surveyed users take it at least 4 to 6 times a week,
      and 80% daily, after three months.
      Proof: "[Sprout] has been the one thing I've been able to stick
      to." (R1)
    3 60+ ingredients and 6 g fiber in one pack (pull, answers
      the doubt that a gummy can't hold enough)
      21 vitamins and minerals; vitamins at about 100% of daily
      value, minerals about 25%.
      Proof: "I also stopped buying separate probiotic gummies, b12
      gummies, and multivitamin gummies." (R5)
    4 It fits the minute you already spend on greens (habit)
      Keep the morning slot. Grab a pack on the way out instead.
      Proof: "So easy to grab and eat on my way to the billion things
      I have to do as a mom." (R15)
    5 Third-party tested for 70 pesticides and 4 heavy metals (doubt)
      Also 16 contaminants and 9 microbial contaminants.
      Proof: none
    6 Your first order is covered for 30 days (doubt)
      30-day money-back guarantee, first order only. Taste can take a
      few days: "after the third day they started tasting better" (R18)

    OFFER   Subscribe & Save, Low Sugar, 28 daily packs.
            $29.99 first box with the text sign-up discount, new
            customers only. Then $49.99 every 4 weeks ($1.78 a day).
            Typically ships within 24 hours.
    QUESTIONS (2 of 4 shown)
            Will Sugar-Free upset my stomach? It uses sugar alcohols.
            Start with Low Sugar if your stomach is sensitive.
            Why is the guarantee first order only? The policy says:
            "This policy applies only to your initial purchase."
    CLOSING Ready to retire the shaker? . Button: Start my first box
    LAYOUT  Numbered titles in bold; R6 under reason 1; offer once.
    MISSING A star rating with one agreed source, so no rating line.
            No percentage off: the site shows 49% to 61% at once.
    CHECKS MISSED none

tweaks:
  - what: What the buyer uses now
    how: This decides every pile. "A cheap supermarket version" gets pushes about what's in it; "a pricier premium brand" gets doubts about value.
  - what: The doubts you paste
    how: Paste the questions people ask before buying and the top return reasons. Each becomes a doubt reason or a question, which often does more than another benefit.
  - what: The count
    how: Ask for three, five or seven. If there aren't that many true, distinct reasons, it gives fewer and says why.
  - what: The ad
    how: Paste it and the first screen and the first headline option keep its words, so the click feels like one story.

judge:
  - Each reason argues something different. No two say the same thing in new words.
  - At least one reason answers a doubt, and the doubt reasons sit just before the offer.
  - Every title reads as a claim on its own. None is a label like "Benefits".
  - Every reason rests on a fact you supplied, and every quote matches a review.
  - No rating, review count, badge or percentage appears that you didn't supply or that your site contradicts.
  - The byline is the business or a real person, and nothing looks like a magazine.

test:
  - Read only the reason titles aloud. They should make the case on their own. If two sound alike, ask it to merge them.
  - Give it facts that only support three reasons. It should deliver three and say why.
  - Check every reason against your facts, and every proof tile against your reviews, word for word.
  - Show the three headline options to someone who buys in your category and ask which they'd read on. Compare their pick with the skill's.

improve:
  - Write the old way your buyers use now into step 1, so every run argues against the right thing.
  - Keep a running list of pre-sale questions and return reasons in your brand file. It feeds the doubt pile.
  - Save the reasons that sell to your brand file, so your next page and your next ads start from them.
  - Pair it with a skill that turns reviews into ranked buying reasons first, and one that builds the finished page in your store.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI can sort the facts and write the reasons. Give it the full facts so it adds nothing."}
    - {name: "Hemingway Editor", why: "Marks hard sentences in yellow and red, so long reason bodies get cut before the page goes live."}
  inputs:
    - "Return reasons and pre-sale questions from your inbox, so the questions section answers real doubts"
    - "The kinds of product buyers use now (no brand names), so each reason compares with the right old way"
    - "Your price history with dates, so the offer block only shows savings against prices you charged"

terms:
  - term: Reasons-to-switch page
    meaning: A short page listing a few distinct reasons to choose your product over what the reader uses now.
  - term: Push, pull, doubt, habit
    meaning: What moves people to switch (the old way's problems, the new way's appeal) and what holds them back (worries and routines).
  - term: Proof tile
    meaning: A small box with a real customer quote and its source, placed under the reason it supports.
