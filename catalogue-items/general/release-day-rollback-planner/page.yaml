new_slug: release-day-rollback-planner
name: "Release day rollback planner"
summary: "Plan a safe release before you ship. Paste what you are releasing and where it runs. Get checks, steps, a rollback plan and a way to confirm it worked."
job: ship-and-host
thinking: medium
thinking_why: "It must match the plan to your setup and think through what can fail."

headline: "Release day rollback planner"
subhead: "Paste what you are releasing, where it runs and who is affected if it breaks. It rates the risk, lists what to check first, orders the steps with pause points, writes the way back, and says how to tell it worked."

explain: |
  Most failed releases do not fail because of the change. They fail because nobody decided beforehand how to spot trouble or how to go back. Then the team improvises under pressure.

  This prompt writes that decision first. You get the checks, the steps in order with places to pause, the signs that mean undo, and a short list to confirm success. It also names what cannot be undone.

when:
  - "You are releasing something that touches real customers."
  - "You have never rolled back and do not know how."
  - "A release involves a database change."
not_for:
  - "You want the full version with every check: use the Safe release planner."
  - "You are doing a first-time setup of a new site or app: ask whoever hosts it, or follow your host's own setup guide."
  - "The change is not live and touches no customers, such as a test copy: skip the plan and just make the change."

you_give:
  - "What you are releasing"
  - "Where it runs"
  - "Who is hurt if it breaks"
  - "Your usual release method (optional)"
you_get:
  - "A risk rating with the reason"
  - "A pre-release checklist"
  - "Steps with pause points"
  - "Undo signs and steps, and a post-release check"

how_to_use:
  - "Copy the prompt, then paste it into your AI chat (Claude, ChatGPT or Gemini)."
  - "Under it, paste your details, one item for each line in What you need."
  - "Send it and read the reply against the checks at the end of the prompt."
  - "Answer anything marked MISSING and send it again, or ask for one part to be redone."
output_sample:
  input:
    - What you are releasing, in plain words
    - Where it runs, such as your host, and whether a database or paid service is involved
    - "Who is affected if it breaks: customers, staff or money"
    - Your usual way to release (optional)
  output:
    - name: RISK
      contains: A rating of low, medium or high, with the reason, based on what changes and who is affected.
    - name: BEFORE YOU START
      contains: "A checklist: tests pass, the production build works, settings and secrets are set, and a backup and way back are ready."
    - name: STEPS
      contains: The release steps in order, each with a pause point where you look before going on.
    - name: UNDO IT IF
      contains: The signs that mean undo, the undo steps, and anything that cannot be undone.
    - name: AFTER
      contains: What to check once it is live, and how long to watch.
    - name: MISSING
      contains: Any facts you did not give, so you can fill them in and run it again.
    - name: CHECKS MISSED
      contains: One line for each check the plan still fails, or none.

how_it_works:
  - title: "Rate the risk"
    text: "Say low, medium or high and why, using what changes, who is affected and whether data changes. Data changes raise the risk."
  - title: "Before you start"
    text: "List checks in four groups: tests pass, the production build works, settings and secrets are set, and a backup and way back are ready. Mark what I must confirm."
  - title: "Order the steps"
    text: "Write the release steps in order, with a pause point after each where I look before going on."
  - title: "Plan the way back"
    text: "Say what would make you undo the release (name the signs), the exact steps to undo it, and what cannot be undone, such as a changed database."
  - title: "Prove it worked"
    text: "List what to check after: the main page loads, the changed feature works, errors have not risen. Name how long to watch."

output_shape: |
  RISK
  <low | medium | high> because <reason>

  BEFORE YOU START
  - [ ] <check>

  STEPS
  1. <step>  (pause: <what to look at>)

  UNDO IT IF
  - <sign>
  Undo steps: <...>
  Cannot be undone: <...>

  AFTER
  - <check>, watch for <time>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check, or none>

tweaks:
  - what: "Name your platform"
    how: "Say where it runs so steps match it. If you do not, it asks once, then keeps the steps general with no commands."
  - what: "Last known-good version"
    how: "Give the tag, build or backup point you would go back to. The undo steps start from it."
  - what: "Database changes"
    how: "Say if data changes. It changes the undo plan the most."
  - what: "Who is affected"
    how: "Customers and money raise the checks."

judge:
  - "The undo plan comes before the release steps."
  - "Each step has a place to pause and look."
  - "Anything that cannot be undone is named."
  - "The after-checks are things you can actually see."

test:
  - "Walk a past release through it. Would it have caught what went wrong?"
  - "Run it twice. The risk rating should match."
  - "Remove the platform name. Steps should turn general."

improve:
  - "Add your platform's real commands once you have checked them."
  - "Add your team's rule for who approves a release."
  - "Save the plan after each release and note what you changed."

before: []
works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A one-message prompt works in any strong chat AI, so use the one you already have."}
  inputs:
    - "The name of your platform"
    - "A note on any database change"

terms:
  - term: "Rollback"
    meaning: "Going back to the version that worked before the release."
