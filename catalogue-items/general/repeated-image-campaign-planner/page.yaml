new_slug: repeated-image-campaign-planner
name: "Repeated image campaign planner"
summary: "Turn one product photo into look-alike images that change only colour. Get the colour list, steps a helper can follow and a price."

job: make-image-ads
thinking: low
thinking_why: "The plan follows a fixed pattern, with one source image and a set of colour changes."

headline: "Repeated image campaign planner"
subhead: "Give it your product and one plain photo. It finds the one thing your buyers know on sight, then plans a set of images built from that single photo, with only the colour changing. You get the colour list, steps a helper can follow and a price for the volume."

explain: |
  Many image campaigns spend weeks on a new look for every picture. A set built from one flat photo, repeated in new colours, is fast to make and easy to recognise. It also stays easy for a helper to extend later. It suits a product, a poster series or a run of social posts.

  This repeated image campaign planner starts by finding the one thing your buyers already know you by. It uses one plain photo as the only source and changes nothing but the colour from piece to piece. Then it writes the steps so someone else can make the next piece without asking you.

  It also says which slips can stay and which must go, and it checks the set at thumbnail size. If two colours look alike on a phone, it changes one before it hands the plan back. It plans the pictures and does not draw them, so you make them in ChatGPT, Gemini or an image editor.

when:
  - "You need a run of images fast, such as a launch week of posts, and want them to look like one family."
  - "You have one strong product photo and want to use it ten times without it looking the same."
  - "A freelancer or helper will make the next pieces, and you want steps they can follow without you."
  - "You sell prints, posters or merch in colour options and need a price that fits the number you will make."

not_for:
  - "Your photo has several subjects or no one clear shape. Use the Single image ad planner."
  - "You want a different idea for each ad, not one image in many colours. Use the Image ad remake planner."
  - "You want the written words on the image set exactly. Use the Exact-text image ad prompt writer."
  - "You want to know which style your past ads won with. Use the Winning image ad style finder."

you_give:
  - "What you sell, and the one thing buyers know it by (a shape, a pack, a mark)"
  - "One plain, centred, well-lit photo of it, attached"
  - "How many pieces you plan to make, and where they will be seen (optional)"
  - "Your cost per piece (optional)"
  - "Your brand colours, or colours to avoid (optional)"

you_get:
  - "The one thing your buyers know on sight, and why"
  - "The set: how many pieces, with one colour for each"
  - "Numbered steps a helper can follow to make the next piece"
  - "A keep-or-fix rule for slips and happy accidents"
  - "A price for the volume with the sum shown, and a thumbnail check"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini. If you added it to your AI, start a chat with it. If not, copy it and paste it in."
  - "Say what you sell and attach one plain photo of it. A busy photo will not repeat well."
  - "Say how many pieces you plan to make and where they will be seen, such as phone, poster or shelf. Add your cost per piece if you know it."
  - "Read THE SET first. Check the colours stay apart when you shrink them to phone size."
  - "Give the steps to a helper, or follow them yourself in ChatGPT (GPT Image), Gemini (Nano Banana) or an image editor. Claude plans the set but can't draw it."
  - "Check that the piece you make matches the plan before you make the rest."

how_it_works:
  - title: Finds the known thing
    text: Picks what your buyers already recognise on sight.
  - title: Fixes one source
    text: Uses one plain photo as the single source for the whole set.
  - title: Plans the repeats
    text: Lays out the set with only the colour changing between pieces.
  - title: Writes the process
    text: Turns the method into steps another person can run.
  - title: Keeps happy accidents
    text: Notes where slips or odd results can stay, and where they should go.
  - title: Sets the price
    text: Sets a price that fits the volume you plan to make.
  - title: Keeps it flat
    text: Checks the surface is plain, with no hidden meaning to explain.
  - title: Checks the plan
    text: Runs its own checks and names any it missed.

output_shape: |
  THE KNOWN THING
  <what buyers recognise and why>

  SOURCE IMAGE
  <the one photo and what it must show>

  THE SET
  <n> pieces | Colours: <list>
  Piece 1: <colour and use> ...

  STEPS FOR THE NEXT ONE
  1. <step> ...

  HAPPY ACCIDENTS
  <what may stay, what must go>

  PRICE FOR THE VOLUME
  <price and how it was set>

  SMALL-SCREEN CHECK
  <what reads at a glance>

  MISSING
  <what would sharpen the plan>

  CHECKS MISSED
  <one line per check missed, or none>

output_sample:
  input:
    - "What you sell, and the one thing buyers know it by"
    - "One plain photo of it"
    - "How many pieces, and where they will be seen (optional)"
    - "Your cost per piece and brand colours (optional)"
  prerequisites:
    - "An image tool such as ChatGPT (GPT Image), Gemini (Nano Banana) or an image editor, to make the pieces"
    - "Your brand brain from the Website brand brain builder (optional)"
  output:
    - name: "The known thing"
      contains: "What buyers recognise on sight, and one line on why."
    - name: "Source image"
      contains: "The one photo every piece is made from, and what it must show."
    - name: "The set"
      contains: "How many pieces, with one colour and one use for each."
    - name: "Steps for the next one"
      contains: "Numbered steps with the file, size, position, background and colour value."
    - name: "Happy accidents"
      contains: "Which slips may stay because they help, and which must go."
    - name: "Price for the volume"
      contains: "A price for the number you will make, with the sum shown."
    - name: "Small-screen check"
      contains: "How each piece looks at thumbnail size, with any look-alike colours already changed."
    - name: "MISSING and CHECKS MISSED"
      contains: "What would sharpen the plan, and one line per check still missed."

tweaks:
  - what: The one photo
    how: Pick a plain, centred, well-lit photo. Busy photos do not repeat well.
  - what: Number of pieces
    how: Say how many you plan to make. It changes the price and the number of colours.
  - what: Colour limits
    how: Name brand colours, or colours to avoid. The set then stays on-brand.
  - what: Where it is seen
    how: Say if it is shown on a phone, a poster or a shelf. It sets the size at which it must read.

judge:
  - The set uses only one source image.
  - A new person could make the next piece from the written steps.
  - A price is set for the volume.
  - It still reads at a glance on a small screen.
  - Only colour changes between pieces.

test:
  - Give the steps to a helper and see if the piece they make matches the set.
  - View all pieces at thumbnail size. Each should still be known at once.
  - Change the number of pieces and see if the price follows a clear rule.
  - Check that every piece uses the same photo and not a lookalike.

improve:
  - Add your brand colours as the default colour list.
  - Add a rule for what counts as a happy accident in your work and what counts as an error.
  - Save the steps as a one-page guide for helpers.
  - Pair it with an image prompt writer once the plan is settled.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Planning the set and steps is text work any strong chat AI does well."}
    - {name: "ChatGPT, Gemini or an image editor", why: "These make or recolour the pictures once the plan is ready."}
  inputs:
    - "Your brand colour list"
    - "A photo from a different angle, in case the first is weak"
    - "Your cost per piece"

terms:
  - term: Source image
    meaning: The single photo every piece in the set is made from.
  - term: Happy accident
    meaning: An unplanned slip or odd result that helps the piece and is kept on purpose.
