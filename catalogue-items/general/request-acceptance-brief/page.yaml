  "thinking": "medium",
  "thinking_why": "Requires following the supplied scope and checking evidence; domain expertise is not assumed.",
  "explain": "Turn any concrete request into a scope, input list, named deliverables and acceptance checks. This is a general method for tasks without a reliable specialist match. Planning is deterministic; executing these instructions requires your own compatible AI runner.",
  "when": [
    "You have a concrete deliverable without a matching specialist workflow."
  ],
  "you_give": [
    "The original request, constraints and available evidence."
  ],
