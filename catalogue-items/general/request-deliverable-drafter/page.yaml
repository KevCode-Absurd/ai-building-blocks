{
  "headline": "Request deliverable drafter",
  "subhead": "Use an agreed request brief to create its named files, with source evidence and explicit gaps.",
  "job": "set-up-ai",
  "thinking": "medium",
  "thinking_why": "Requires following the supplied scope and checking evidence; domain expertise is not assumed.",
  "explain": "Use an agreed request brief to create its named files, with source evidence and explicit gaps. This is a general method for tasks without a reliable specialist match. Planning is deterministic; executing these instructions requires your own compatible AI runner.",
  "when": [
    "You have a concrete deliverable without a matching specialist workflow."
  ],
  "you_give": [
    "The original request, constraints and available evidence."
  ],
  "you_get": [
    "Editable named files, requirements and honest check status."
  ],
  "how_to_use": [
    "Include the full request and complete required inputs.",
    "Run the workflow in a compatible AI runner.",
    "Review unresolved checks before using the result."
  ],
  "how_it_works": [
    {
      "title": "Follow the brief",
      "text": "Read request-brief.md and the original request. Produce each named deliverable with the supplied facts, files and tools. Work through requirement IDs in order and maintain a requirement-to-file map. For a schedule require availability, roles and dates; for budgets require amounts, units, currency and assumptions; for research require sources; for comparisons use the same criteria across options. These are examples of input checks, not permission to change the requested task. Never substitute an unrelated specialist skill. Do not fabricate missing facts. Ask only for inputs that block the requested result; label optional assumptions. Use the requested file format if a compatible runner is available. Otherwise provide editable source and explicit conversion instructions, marking conversion not run. Save deliverables/ and artifact-index.md with paths, version and requirement IDs. For high-stakes or regulated work produce a review draft and state the qualified review still needed. Do not send, publish, book, spend or schedule external actions. Creating this workflow pack has not executed this skill."
    }
  ],
  "output_shape": "Requirement ID | Artifact path | Evidence | Status | Missing input",
  "tweaks": [
    {
      "what": "Domain",
      "how": "Supply your own standards and review rubric."
    }
  ],
  "judge": [
    "Every requested result is covered or explicitly unresolved.",
    "No unsupported execution or specialist-validation claim."
  ],
  "test": [
    "Try missing inputs and verify that no facts are invented."
  ],
  "improve": [
    "Replace a general stage with a suitable specialist skill."
