new_slug: research-spend-cohort-adjustment
name: Research spend cohort adjustment
headline: Research spend cohort adjustment
summary: Build a research asset and amortization schedule from your dated R&D expense cohorts, and see how it changes operating profit (EBIT).
job: track-numbers
thinking: high
thinking_why: "The result depends on the life you choose, so the choice needs a stated reason and a clear line from statutory accounting."
subhead: Give it your yearly R&D expense, reported EBIT, the economic life you choose and why. It builds a research asset and an amortization schedule by year of spend, and shows adjusted EBIT beside reported EBIT. This is an analyst restatement, not statutory accounting.
explain: |-
  Accounting rules often expense research as it is spent. An analyst may instead treat each year's research as an asset that wears out over its useful life. This skill does that for you, one year of spend at a time (a "cohort"), and shows how operating profit (EBIT) changes.

  It adds this year's research expense back to EBIT, takes off the amortization of the earlier years' cohorts, and shows the research asset left. This year's spend is counted at full cost and is not amortized in its first year. It keeps development costs you already capitalized separate so nothing is counted twice. It does not change taxes and it does not say what your statutory accounts may recognize.

  Illustrative figures: research asset 30 + 24 x 2/3 + 18 x 1/3 = 52. Amortization (24 + 18 + 12) / 3 = 18. Adjusted EBIT 100 + 30 - 18 = 112.
when:
  - You want to restate EBIT as if research spend were an asset, using dated R&D expense by year.
  - You compare companies that spend different amounts on research and want a like-for-like profit view.
  - A reviewer needs to trace the research asset and the amortization back to each year of spend.
not_for:
  - "You need to recognize an asset under IAS 38 for your statutory accounts: use your accountant or auditor."
  - "You want to forecast whether research will succeed: use a person who knows the product and market."
  - "You only want a quick view of reported profit: read the income statement directly, with no adjustment."
  - "You need EPS with acquired-intangible amortization added back: use the Acquired asset earnings adjustment checker instead."
you_give:
  - R&D expense for the current year and each prior year, dated
  - Reported EBIT
  - The economic life you choose, and why
  - The amortization convention (for example, spend counted at year end) and evidence for it
  - Any development costs already capitalized, kept separate
  - The fiscal year end, currency and scale; and your spreadsheet tool if you want a workbook
you_get:
  - A research asset and amortization schedule by year of spend, and adjusted EBIT beside reported EBIT
  - An editable workbook with inputs, formulas and test cases to rerun
  - A tie-out of the asset to the amortization, the inputs still missing and the checks that ran
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the yearly R&D expense and the reported EBIT."
  - "Tell it what you need: the research asset, the yearly amortization and the change to operating profit."
  - "Ask it to stop and mark MISSING if a year of R&D expense is not in your sources."
  - "Check that development spend already capitalized is not counted again, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Your current and prior R&D expense by year
    - Your reported EBIT
    - The economic life you choose, with your reason
    - Reporting date, currency and scale
    - Your accounting basis and fiscal calendar
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, only to run the bundled reference calculation (optional)
  output:
    - name: Scope and dated sources
      contains: The question, the reporting date, currency and scale, and each source with its date.
    - name: Inputs and assumptions
      contains: Every input and the economic life you chose, with the amortization convention stated.
    - name: Model calculations and reconciliations
      contains: Each cohort's unamortized cost, current amortization, the research asset and adjusted EBIT, tied back to inputs.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation, changed-input test and reopening the saved file.
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs that could not be found and any check that failed or did not run.
how_it_works:
  - title: 1. Choose and justify an economic life; retain statutory R&D treatment and previously capitalized development costs separately
    text: Choose and justify an economic life; retain statutory R&D treatment and previously capitalized development costs separately.
  - title: 2. For each historical expense cohort, calculate unamortized cost and current amortization under one stated convention; remove abandoned projects using evidence
    text: For each historical expense cohort, calculate unamortized cost and current amortization under one stated convention; remove abandoned projects using evidence.
  - title: 3. Add current expensed research back to EBIT and deduct cohort amortization; carry the research asset consistently into any adjusted capital-return calculation without changing cash taxes automatically
    text: Add current expensed research back to EBIT and deduct cohort amortization; carry the research asset consistently into any adjusted capital-return calculation without changing cash taxes automatically.
output_shape: |-
  SCOPE AND DATED SOURCES
  INPUTS AND ASSUMPTIONS (life, convention, evidence)
  COHORT TABLE: year of spend, cost, amortization this year, unamortized balance
  RESEARCH ASSET, AMORTIZATION AND ADJUSTED EBIT beside reported EBIT
  RECONCILIATIONS
  FILE CHECKS: what ran
  MISSING:
  CHECKS MISSED:
tweaks:
  - what: Fiscal year end
    how: Take the fiscal year end from the yearly R&D expense and the reported EBIT. Use one currency and scale on every line.
  - what: Economic life
    how: Change the economic life and have your AI recalculate. Keep the actual figures you supplied.
  - what: Abandoned projects
    how: Name projects that were stopped and give evidence. They are removed from the asset.
judge:
  - No already-capitalized development expenditure is counted again.
  - Asset cohorts roll forward and the expense/amortization adjustment is applied consistently to profit and capital.
  - Tie all inputs to source notes, dates, currency, scale and signs.
  - Retain reported figures beside analytical adjustments and list every unresolved source gap.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one research asset schedule you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define economic life into SKILL.md, so every run uses your wording."
before: []
next: [ purchased-amortization-eps-bridge, roe-margin-check ]
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
