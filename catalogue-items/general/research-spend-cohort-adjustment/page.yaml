new_slug: research-spend-cohort-adjustment
name: Research spend cohort adjustment
headline: Research spend cohort adjustment
summary: Build a research asset and amortization schedule from your dated R&D expense cohorts, and see how it changes operating profit (EBIT).
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A cohort research-asset schedule and operating-profit adjustment, separate from statutory accounting. Share current and prior R&D expense cohorts, reported EBIT, chosen economic life and evidence for the amortization convention.
explain: |-
  A cohort research-asset schedule and operating-profit adjustment, separate from statutory accounting.

  Issuer accounting and earnings. Illustrative figures. Asset30+24×2/3+18×1/3=52. Amortization(24+18+12)/3=18. Adjusted EBIT100+30-18=112. Current expense36 raises the year-end asset and EBIT adjustment by6 under the stated convention.
when:
  - You need a cohort research-asset schedule and operating-profit adjustment, separate from statutory accounting.
  - You work on issuer accounting and earnings and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You need to recognize an asset under IAS 38 for your statutory accounts: use your accountant or auditor."
  - "You want to forecast whether research will succeed: use a person who knows the product and market."
  - "You only want a quick view of reported profit: read the income statement directly, with no adjustment."
you_give:
  - Current and prior R&D expense cohorts, reported EBIT, chosen economic life and evidence for the amortization convention.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A cohort research-asset schedule and operating-profit adjustment, separate from statutory accounting.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
output_sample:
  input:
    - Your current and prior R&D expense by year
    - Your reported EBIT
    - The economic life you choose, with your reason
    - Reporting date, currency and scale
    - Your accounting basis and fiscal calendar
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, only to run the bundled reference calculation (optional)
  output:
    - name: Scope and dated sources
      contains: The question, the reporting date, currency and scale, and each source with its date.
    - name: Inputs and assumptions
      contains: Every input and the economic life you chose, with the amortization convention stated.
    - name: Model calculations and reconciliations
      contains: Each cohort's unamortized cost, current amortization, the research asset and adjusted EBIT, tied back to inputs.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation, changed-input test and reopening the saved file.
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs that could not be found and any check that failed or did not run.
how_it_works:
  - title: 1. Choose and justify an economic life; retain statutory R&D treatment and previously capitalized development costs separately
    text: Choose and justify an economic life; retain statutory R&D treatment and previously capitalized development costs separately.
  - title: 2. For each historical expense cohort, calculate unamortized cost and current amortization under one stated convention; remove abandoned projects using evidence
    text: For each historical expense cohort, calculate unamortized cost and current amortization under one stated convention; remove abandoned projects using evidence.
  - title: 3. Add current expensed research back to EBIT and deduct cohort amortization; carry the research asset consistently into any adjusted capital-return calculation without changing cash taxes automatically
    text: Add current expensed research back to EBIT and deduct cohort amortization; carry the research asset consistently into any adjusted capital-return calculation without changing cash taxes automatically.
output_shape: |-
  A cohort research-asset schedule and operating-profit adjustment, separate from statutory accounting.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: No already-capitalized development expenditure is counted again.
judge:
  - No already-capitalized development expenditure is counted again.
  - Asset cohorts roll forward and the expense/amortization adjustment is applied consistently to profit and capital.
  - Tie all inputs to source notes, dates, currency, scale and signs.
  - Retain reported figures beside analytical adjustments and list every unresolved source gap.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
