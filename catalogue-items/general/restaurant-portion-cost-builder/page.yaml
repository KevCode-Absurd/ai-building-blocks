new_slug: restaurant-portion-cost-builder
name: Restaurant portion cost builder
headline: Restaurant portion cost builder
summary: Work out the cost per portion and contribution for one batch of one dish, from real weights, yield, cash costs and price. Built for restaurant portion costing.
job: track-numbers
thinking: high
thinking_why: "Yield is measured per batch, so portion cost is only as sound as the weights and cash costs recorded for that batch."
subhead: A batch yield, portion cost and service contribution schedule. Share purchased batch weight, observed edible yield, actual portion weight, same-batch ingredient/labor/energy cash, confirmed selling price and served demand.
explain: |-
  A batch yield, portion cost and service contribution schedule.

  Give it the weight you bought, the edible weight you measured, the portion weight, the batch's cash cost, the price and the portions served. It works out the yield, the cost per portion and what the batch contributed. It covers one batch of one dish. It is not a full business forecast and gives no food safety advice.
when:
  - You need a batch yield, portion cost and service contribution schedule.
  - You work on food service operating finance and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You want a full venue profit and loss with rent and wages: use a restaurant P&L in your accounting tool or ask your accountant."
  - "You want to set menu prices that cover fixed costs: use a menu pricing sheet in Google Sheets or Excel."
  - "You need food safety, allergen or tax stock valuation advice: ask a qualified food safety or accounting professional."
  - "You need the cost per good unit of a production batch after yield loss: use the Manufacturing yield cost bridge instead."
you_give:
  - Purchased batch weight, observed edible yield, actual portion weight, same-batch ingredient/labor/energy cash, confirmed selling price and served demand.
  - "The batch date, plus the currency and scale used for the portion cost."
  - "Your spreadsheet tool, if you want the portion cost as a workbook."
you_get:
  - A batch yield, portion cost and service contribution schedule.
  - "An editable workbook of the portion cost, with its inputs, formulas and test cases to rerun."
  - "A tie-out of batch cost, portions served and receipts, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the batch purchase, the measured yield and the portion weight."
  - "Tell it what you need: the cost per portion and the contribution from one batch of one dish."
  - "Ask it to stop and mark MISSING if the purchased weight or the edible yield is not in your sources."
  - "Check that every driver traces to a dated record, and actuals stay apart from scenarios, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Purchased batch weight and the edible weight you measured after prep
    - The portion weight you serve
    - Ingredient, labor and energy cash spent on that same batch
    - Your confirmed selling price and how many portions were served
    - Reporting date, currency and who will review it
  prerequisites:
    - An AI that can create spreadsheet files
    - Node.js 20 or later, only if you want the bundled calculation script run
  output:
    - name: Scope and dated sources
      contains: What the schedule covers and where each input came from, with dates.
    - name: Inputs and assumptions
      contains: Every number you supplied and any assumption, kept apart from actual records.
    - name: Model calculations and reconciliations
      contains: Yield, theoretical portions, served portions, cost per portion and contribution, tied back to batch cash.
    - name: Actual file verification
      contains: "The workbook checks that ran: recalculation, a changed input test, rendering and reopening the file."
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs you did not supply and any check that failed or could not run, or none.
how_it_works:
  - title: 1. Map dated source records, actual units, period cutoffs, currency, definitions and missing evidence before computing
    text: Map dated source records, actual units, period cutoffs, currency, definitions and missing evidence before computing.
  - title: 2. Source actual purchased and edible weights for the same batch; use measured yield, not a culinary safety or handling assumption
    text: Source actual purchased and edible weights for the same batch; use measured yield, not a culinary safety or handling assumption.
  - title: 3. Divide edible mass by the approved serving mass to show theoretical portion capacity, then cap modeled served portions at supplied demand
    text: Divide edible mass by the approved serving mass to show theoretical portion capacity, then cap modeled served portions at supplied demand.
  - title: 4. Allocate batch cash across theoretical portions, show unserved capacity and reconcile actual modeled service receipts less full batch cash
    text: Allocate batch cash across theoretical portions, show unserved capacity and reconcile actual modeled service receipts less full batch cash.
output_shape: |-
  A batch yield, portion cost and service contribution schedule.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Batch date"
    how: "Take the batch date from the batch purchase, the measured yield and the portion weight. Use one currency and scale on every line."
  - what: "Portion weight"
    how: "Change the portion weight and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Every material driver traces to a dated source; actuals and scenarios remain separate.
judge:
  - Every material driver traces to a dated source; actuals and scenarios remain separate.
  - Missing evidence blocks the affected calculation instead of becoming a zero.
  - Weight units match and yield is positive and at most one; portion size is positive.
  - Unserved theoretical portions are not automatically saleable later; fractional portions are planning equivalents until owner rounding is applied.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one portion cost you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define edible yield into SKILL.md, so every run uses your wording."
before: []
next: [manufacturing-yield-cost-bridge, service-utilization-margin-builder]
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
