new_slug: retail-markdown-stock-reconciler
name: Retail markdown stock reconciler
headline: Retail markdown stock reconciler
summary: "Check a retail markdown stock reconciliation: see sold-unit contribution, units left and cash recovered against the full purchase cost of a stock batch."
job: track-numbers
thinking: high
thinking_why: "Sales cannot exceed the stock bought, and actual sales must stay apart from planned clearance, so the units need to tie first."
subhead: A stock cohort reconciliation with sold-unit contribution, remaining units and cumulative cash after the full cohort purchase. Share opening stock cohort units and unit purchase cash cost, full-price and markdown units sold and realized prices, clearance cash expenses; identify the timing of the original cohort purchase.
explain: |-
  A stock cohort reconciliation with sold-unit contribution, remaining units and cumulative cash after the full cohort purchase.

  Illustrative cohort of 100 units purchased for 5 each costs 500. Selling 40 at 10 and 30 at 6 realizes 580. Sold purchase cost 350 plus clearance 10 leaves sold-unit contribution 220; this excludes 150 purchase cost still held in 30 units. Cumulative cash after the full 500 original purchase and 10 clearance is 70. At a markdown price of 4, receipts are 520, sold-unit contribution is 160 and cumulative cohort net cash is 10. Cumulative cash is across purchase and clearance dates, not a single-period cash-flow claim. Overselling stock is refused.
when:
  - You need a stock cohort reconciliation with sold-unit contribution, remaining units and cumulative cash after the full cohort purchase.
  - You work on retail stock cash recovery and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You need profit for a period or current-period cash flow: use your accountant or a finance planning tool instead."
  - "You need tax reporting or sales tax figures: ask your accountant, since this does not cover tax."
  - "You need to price a markdown or decide a clearance plan: use a spreadsheet or a pricing tool, since this only checks sales that already happened."
  - "You need how much a lender will advance against your inventory: use the Inventory borrowing base builder instead."
you_give:
  - Opening stock cohort units and unit purchase cash cost, full-price and markdown units sold and realized prices, clearance cash expenses; identify the timing of the original cohort purchase.
  - "The purchase date, plus the currency and scale used for the markdown stock reconciliation."
  - "Your spreadsheet tool, if you want the markdown stock reconciliation as a workbook."
you_get:
  - A stock cohort reconciliation with sold-unit contribution, remaining units and cumulative cash after the full cohort purchase.
  - "An editable workbook of the markdown stock reconciliation, with its inputs, formulas and test cases to rerun."
  - "A tie-out of units sold, units left and the opening quantity, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the opening stock, the sales records and the clearance costs."
  - "Tell it what you need: contribution from sold units, units left and cash recovered against the purchase cost."
  - "Ask it to stop and mark MISSING if the opening quantity or the unit cost is not in your sources."
  - "Check that every driver traces to a dated record, and actuals stay apart from proposed clearance, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Units in the opening stock batch and the purchase cost per unit
    - When the batch was bought and the total purchase cash
    - Units sold at full price and the price you got
    - Units sold at markdown and the price you got
    - Clearance costs paid in cash (optional)
  prerequisites:
    - An AI that can create and open spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Scope and dated sources
      contains: The records used, their dates, the currency and what the work covers.
    - name: Inputs and assumptions
      contains: Every number you gave, with its source and any assumption marked as one.
    - name: Model calculations and reconciliations
      contains: Units sold against opening units, sold-unit contribution, units left and cumulative net cash for the batch.
    - name: Editable workbook
      contains: A spreadsheet with live formulas, an input schema and test cases you can change and recalculate.
    - name: Actual file verification
      contains: The checks that ran on the saved workbook, such as recalculation and reopening the file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs still needed and any check that failed or could not run, or none.
how_it_works:
  - title: 1. Map dated source records, actual units, period cutoffs, currency, definitions and missing evidence before computing
    text: Map dated source records, actual units, period cutoffs, currency, definitions and missing evidence before computing.
  - title: 2. Freeze the cohort, opening quantity and source cost; separate actual sold units from proposed clearance quantities
    text: Freeze the cohort, opening quantity and source cost; separate actual sold units from proposed clearance quantities.
  - title: 3. Reconcile full-price plus markdown units sold against opening cohort quantity; refuse sales exceeding available stock
    text: Reconcile full-price plus markdown units sold against opening cohort quantity; refuse sales exceeding available stock. Separate realized receipts, purchase cost of sold units and the purchase-cost memo of unsold units.
  - title: 4. Calculate sold-unit contribution after sold purchase cost and clearance expense
    text: Calculate sold-unit contribution after sold purchase cost and clearance expense. Separately subtract the full original cohort purchase cash from realized receipts and clearance expense to report cumulative cohort net cash, not current-period cash flow.
output_shape: |-
  A stock cohort reconciliation with sold-unit contribution, remaining units and cumulative cash after the full cohort purchase.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Purchase date"
    how: "Take the purchase date from the opening stock, the sales records and the clearance costs. Use one currency and scale on every line."
  - what: "Clearance quantity"
    how: "Change the clearance quantity and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Every material driver traces to a dated source; actuals and scenarios remain separate.
judge:
  - Every material driver traces to a dated source; actuals and scenarios remain separate.
  - Missing evidence blocks the affected calculation instead of becoming a zero.
  - Closing stock equals opening units less all sold units and cannot be negative. Sold-unit cost plus the held purchase-cost memo equals the original cohort purchase cost.
  - Sold-unit contribution excludes unsold purchase cost; cumulative cohort net cash includes the full original purchase once. The held-cost memo is neither recoverable value nor new cash.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one markdown stock reconciliation you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define stock cohort into SKILL.md, so every run uses your wording."
before: []
next: [inventory-borrowing-base-builder]
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
