new_slug: revolver-interest-fee-checker
name: Revolver interest and fee checker
headline: Revolver interest and fee checker
summary: "Check what your lender charged on a revolving credit line: interest on drawn money, the fee on unused credit and extras, tied to your bill."
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: "Give it one billing period: the average amount you drew, the average unused amount the fee applies to, the two rates and the day count. It works out the interest, the commitment fee and any other fees, then compares the total with the lender's bill. You get a short schedule, the gap against the bill and a list of what it could not check."
explain: |-
  A revolver is a credit line you can borrow from, repay and borrow from again, up to a limit. The lender charges interest on the part you have drawn. It also charges a commitment fee on the part you have not. This revolver interest and fee checker rebuilds both charges for one period so you can see if the bill adds up.

  The usual mistake is to use the balance on the last day. Both charges run on the average balance over the period. A line drawn late in the month costs far less than its closing balance suggests. The skill asks for the average and will not guess it from end balances.

  It keeps the two charges apart. It uses the year basis in your agreement, 360 or 365 days. It changes the fee base only when your agreement says so. If your sums and the bill differ, the gap stays on the page as a gap. It is never forced to zero.
when:
  - "The lender's monthly or quarterly bill looks too high or too low and you want to check it."
  - "You need to budget interest and commitment fees on a credit line you already have."
  - "Your accountant asks how you worked out the interest accrual for the period."
  - "You are moving a hand-built spreadsheet to one place where every rate and day count is visible."
not_for:
  - "You want to know how much you can still borrow on the line: use the Revolving credit availability checker."
  - "Interest is added to the loan balance instead of being paid: use the Cash and added interest calculator."
  - "You need interest that is capitalised into an asset you are building: use the Construction loan interest calculator."
  - "You want to know if you pass a lender's cash-cover test: use the Loan covenant cash coverage checker."
you_give:
  - "The average amount drawn over the period, from the lender's statement or your loan system"
  - "The average unused amount the fee applies to. Your credit agreement says what counts, such as whether letters of credit are left out"
  - "The interest rate and the commitment fee rate for the period, from the agreement or the lender's rate notice"
  - "The number of days in the period and the year basis (360 or 365), from the agreement"
  - "Other fees charged in the period, such as agent or letter of credit fees (optional)"
  - "The total the lender billed, so the skill can compare (optional)"
you_get:
  - "Interest on the drawn amount, with the sum shown"
  - "The commitment fee on the unused amount, with the sum shown"
  - "The total charge: interest plus commitment fee plus other fees"
  - "The difference from the lender's bill, with a likely cause or a note that it is unexplained"
  - "A list of figures you did not give and checks that could not run"
how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or paste it in as your first message. Add it to your AI if you want to reuse it."
  - "Paste the figures from the list above, one per line, with the period dates and the currency. Attach the lender statement and the rate and fee pages of the credit agreement if you have them."
  - "Check the balances first. If you only have opening and closing balances, say so. The AI will mark the average as missing and ask for daily balances. It will not calculate from the closing balance."
  - "Read the schedule and the gap against the bill. A gap with no clear cause stays open."
  - "Ask for a spreadsheet only if your AI can make files. Without file tools, the table in the chat is enough."
how_it_works:
  - title: 1. Fixes the period
    text: Writes the start date, end date, days, currency and scale. Balances, rates and the bill must cover the same days, or that line waits.
  - title: 2. Checks the balances
    text: Uses the average drawn and average unused amounts over the same days. It does not work an average out from end balances.
  - title: 3. Checks the fee base
    text: Applies any carve-outs, such as letters of credit, only when your agreement says so. If it is not sourced, the line is marked missing.
  - title: 4. Works out each charge
    text: Interest is average drawn times the rate times days over the year basis. The commitment fee uses the average unused amount and its own rate.
  - title: 5. Adds other fees and compares
    text: Adds only the fees you named, shows the total and sets it beside the lender's bill. A gap is named or left unexplained, never plugged.
output_shape: |-
  PERIOD AND SOURCES
  <start date> to <end date> | <days> days | <currency and scale> | <documents used>

  INPUTS
  Average drawn: <amount> | Average unused fee base: <amount> | Interest rate: <rate> | Commitment fee rate: <rate> | Basis: <360 or 365> | Other fees: <amount or none>

  CHARGES
  Interest: <drawn> x <rate> x <days> / <basis> = <amount>
  Commitment fee: <unused> x <fee rate> x <days> / <basis> = <amount>
  Other fees: <named fees and amount>
  Total: <amount>

  AGAINST THE BILL
  Billed: <amount> | Difference: <amount> | Likely cause: <cause or unexplained>

  MISSING
  <figures not supplied>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - "The average drawn amount and the average unused amount for one billing period"
    - "The interest rate, the commitment fee rate, the days in the period and the 360 or 365 basis"
    - "Other fees and the amount the lender billed (optional)"
  prerequisites:
    - "The lender statement and the rate and fee terms from your credit agreement"
    - "An AI that can make files, only if you want a spreadsheet (optional)"
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - {name: "Period and sources", contains: "The dates, currency and documents used, so a reviewer can trace every figure."}
    - {name: "Inputs", contains: "Each figure you gave with its source, and a MISSING line for any you did not."}
    - {name: "Charges", contains: "Interest, commitment fee and other fees, each with the sum shown, then the total."}
    - {name: "Against the bill", contains: "The billed amount, the difference and the likely cause, or a note that it is unexplained."}
    - {name: "Workbook (optional)", contains: "An editable spreadsheet with inputs, formulas and a checks tab, if your AI can make files."}
    - {name: "MISSING and CHECKS MISSED", contains: "What you did not supply, and every check that failed or could not run."}
tweaks:
  - what: Period and currency
    how: Use the same period, currency and scale for the balances, the rates and the bill.
  - what: Rate changes
    how: If a rate changed during the period, give each rate with its start date and ask for one row per rate.
  - what: Letters of credit
    how: Say whether they count as drawn, as unused or as neither for the fee, and quote the clause that says so.
  - what: Acceptance
    how: Interest plus commitment fee plus other fees equals the total, and a zero rate or balance gives a zero charge.
judge:
  - Actual records, contractual terms and scenarios remain distinguishable.
  - Missing evidence blocks the affected line; no default zero or unexplained balancing plug.
  - Average balances refer to the same statement window; letters of credit fee treatment is explicitly sourced.
  - Interest plus commitment fee plus other charges must equal modeled total; a zero rate or balance produces zero corresponding charge.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save your agreement's fee base wording and day count once, so each period you only change the balances."
  - "Keep a note of each period's difference from the bill and what caused it."
works_best_with:
  tools:
    - name: Any good chat AI
      why: The sums are short, so the AI can show them line by line in the chat.
    - name: A file-capable AI or a spreadsheet app
      why: Needed only if you want an editable workbook with a checks tab.
    - name: Node.js 20 or later (optional)
      why: Runs the bundled script that repeats the sums, as a second check.
  inputs:
    - The lender's statement for the period
    - The rate and fee pages of the credit agreement
    - Daily balances, if you have them, so the average is not guessed
terms:
  - term: Revolver
    meaning: A credit line you can borrow from, repay and borrow from again, up to a limit.
  - term: Commitment fee
    meaning: A fee the lender charges on the part of the line you have not drawn.
  - term: Year basis
    meaning: Whether the lender counts a year as 360 or 365 days when it works out interest.
  - term: Average drawn
    meaning: The mean amount borrowed across the period, not the amount on the last day.
  - term: Reconciliation
    meaning: Comparing your own sums with the bill and explaining any difference.
