new_slug: rights-issue-eps-adjustment
name: Rights-issue EPS adjustment
headline: Rights-issue EPS adjustment
summary: Work out a rights issue's theoretical ex-rights price and restate past EPS with the bonus factor. Get a workpaper with checks and gaps listed.
job: money-and-investing
thinking: high
thinking_why: "The factor only applies to a pro-rata offer, so the terms must be confirmed before past EPS is restated."
subhead: A theoretical ex-rights price and retrospective bonus-factor workpaper. Share pre-rights market price, subscription price, existing and rights shares, issue timetable and historical EPS.
explain: |-
  A theoretical ex-rights price and retrospective bonus-factor workpaper.

  Public equity and share counts. Illustrative figures. (4 × $10 + 1 × $5) / 5 = $9 theoretical price. Bonus factor 10/9 restates $2 comparative EPS to $1.80. A $10 subscription yields no bonus adjustment.
when:
  - You need a theoretical ex-rights price and retrospective bonus-factor workpaper.
  - You work on public equity and share counts and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "Your offer is not pro-rata, so the bonus factor does not apply: ask your accountant to apply IAS 33 to the actual terms."
  - "You need the value of tradable rights, fees or tax effects: use a full valuation model built by a finance professional."
  - "You need current-period EPS with dilution from options or convertibles: use a full IAS 33 EPS model, since this covers only the rights bonus element."
  - "You need past EPS and share counts restated after a stock split: use the Stock-split EPS restatement instead."
you_give:
  - Pre-rights market price, subscription price, existing and rights shares, issue timetable and historical EPS.
  - "The last day before the rights price, plus the currency and scale used for the rights issue adjustment."
  - "Your spreadsheet tool, if you want the rights issue adjustment as a workbook."
you_get:
  - A theoretical ex-rights price and retrospective bonus-factor workpaper.
  - "An editable workbook of the rights issue adjustment, with its inputs, formulas and test cases to rerun."
  - "A tie-out of the ex-rights price and the bonus factor, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the offer terms, the share counts and past EPS."
  - "Tell it what you need: the theoretical ex-rights price, the bonus factor and restated past EPS."
  - "Ask it to stop and mark MISSING if the pre-rights price or the subscription price is not in your sources."
  - "Check that cash, old shares and new shares use the same per-share units, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Share price just before the rights trade ex-rights
    - Subscription price per new share
    - Number of existing shares and new rights shares
    - Issue dates and your reporting date
    - Past EPS you want restated
  prerequisites:
    - An AI that can read your files and run a spreadsheet
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Scope and dated sources
      contains: What the work covers and where each input came from, with dates.
    - name: Inputs and assumptions
      contains: Every input with its source, period, currency and scale, plus the assumptions made.
    - name: Model calculations
      contains: The theoretical ex-rights price, the bonus factor and the restated comparative EPS.
    - name: Reconciliations
      contains: Independent checks that tie share counts and cash proceeds to the sources.
    - name: Actual file verification
      contains: The recalculation, formula and reopen checks run on the real workbook.
    - name: MISSING lines
      contains: Each input that was not supplied, left open instead of guessed.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or the word none.
how_it_works:
  - title: 1. Confirm the issue is a pro-rata rights offer and identify the cum-rights price immediately before exercise
    text: Confirm the issue is a pro-rata rights offer and identify the cum-rights price immediately before exercise.
  - title: 2. Divide pre-issue market value plus subscription proceeds by total shares to obtain theoretical ex-rights price; calculate the bonus factor as pre-rights price divided by theoretical price
    text: Divide pre-issue market value plus subscription proceeds by total shares to obtain theoretical ex-rights price; calculate the bonus factor as pre-rights price divided by theoretical price.
  - title: 3. Apply a bonus factor of at least one to comparative EPS and pre-rights weighted shares; time-weight actual new shares separately in the current-period EPS ledger
    text: Apply a bonus factor of at least one to comparative EPS and pre-rights weighted shares; time-weight actual new shares separately in the current-period EPS ledger.
output_shape: |-
  A theoretical ex-rights price and retrospective bonus-factor workpaper.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Last day before the rights price"
    how: "Take the last day before the rights price from the offer terms, the share counts and past EPS. Use one currency and scale on every line."
  - what: "Subscription price"
    how: "Change the subscription price and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Cash proceeds, old shares and new shares use consistent per-share units.
judge:
  - Cash proceeds, old shares and new shares use consistent per-share units.
  - Only the bonus element is retrospective; actual current-period issue timing is preserved.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one rights issue adjustment you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define bonus factor into SKILL.md, so every run uses your wording."
before: []
next: [stock-split-eps-restatement, treasury-stock-option-dilution]
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
