works_best_with:
  tools:
    - {name: "A spreadsheet", why: "Keeps the cleaned years and rival figures together and lets you recheck each sum."}
    - {name: "Any good chat AI", why: "Reading pasted accounts and running fixed sums is work any strong chat AI does well with this skill."}
  inputs:
    - "Five years of income statements and balance sheets"
    - "Dividends paid and shares bought back in each year"
    - "The same figures for two or three rivals"

terms:
  - term: Return on equity
    meaning: Operating profit after tax divided by the money owners have in the business. It shows how well that money is put to work.
  - term: Equity
    meaning: What is left for owners after all debts are taken off the assets.
  - term: Operating margin
    meaning: Operating profit divided by sales. It shows how much of each sale is left after the costs of running the business.
