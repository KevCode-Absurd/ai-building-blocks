new_slug: roles-and-goals-mapper
name: "Roles and long-term goals mapper"
summary: Map your life roles and set one or two lasting goals for each. Get a role table and see which role crowds out the others.
job: think-and-decide
thinking: medium
thinking_why: "It organises what you give it and checks balance against fixed rules, so a mid-level model is enough."
headline: "Roles and long-term goals mapper"
subhead: Tell it what you do and who depends on you. It lists your roles and writes one line on what you are about in each. It sets one or two lasting results per role and shows which role is crowding out the others. You get a role table you can plan your weeks from.
explain: |-
  When you think about life as one long to-do list, the loudest part wins. Work takes the evenings. Health, friends and learning wait for a quieter time that never comes. Splitting your life into roles shows what each part needs.

  This skill lists the roles you play, from your own health to work, family and community. For each role it writes what you are about, ties it to a value and sets one or two results you could name when they are done. Each result has a test, so "spend more time with the kids" becomes something you can check.

  Then it compares the hours each role takes with how much that role matters to you. It names the role crowding out the others and sets a date to look again. It never tells you which role to favour. The method follows Stephen Covey's habit of starting with roles and goals. This version is ours.
when:
  - Work fills every hour and the rest of life gets what is left.
  - You are about to write a personal mission statement and need the parts first.
  - A new season starts, such as a new job, a baby or a move, and you want to know where to put your time.
  - You feel busy all week and sense that something important is slipping.
not_for:
  - You do not know your values yet. Use the Life values reflection coach first, then come back.
  - You want a plan for this week's tasks. Use the Week priority picker or the Values-based weekly planner.
  - You need to settle one specific choice, such as taking a job. Use the Pros and cons decision planner.
you_give:
  - What you do, who depends on you and what is on your mind
  - Your top values, for example from the Eulogy values finder (optional)
  - A rough picture of how you spend a week (optional)
  - Your hours and ranking for each role, when it asks
you_get:
  - A table of your roles, each with what you are about, a guiding value and one or two results with a test
  - A balance view that names the role crowding out the others
  - One small result each for body, mind, relationships and meaning
  - A review date and the results to plan first
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Describe your situation in a paragraph. Paste your top values if you have them.
  - When it asks, rank your roles by how much they matter and say roughly how many hours each takes. Use real hours, not wished-for hours.
  - Check each result. Cross out any you took on only because someone else wanted it.
  - Save the table, then take it to the Personal mission statement writer.
how_it_works:
  - title: Lists the roles
    text: Finds four to eight parts you play, merging or adding until the list is real. It always keeps a role for yourself.
  - title: Writes what you are about
    text: One sentence per role that a stranger could picture, such as what someone would see you do.
  - title: Links to values
    text: Ties each role to one of your values, and flags roles with no value and values with no role.
  - title: Sets lasting results
    text: One or two results per role, each with a test for when you have arrived. Results from someone else's wish are marked.
  - title: Checks the balance
    text: Compares hours with how much each role matters and names the role crowding out the rest.
  - title: Adds renewal
    text: Makes sure your own role has a small result for body, mind, relationships and meaning.
  - title: Dates the review
    text: Sets a review in about six months and picks what to plan first.
output_shape: |
  ROLES
  1. <role> | About: <one sentence> | Value: <value> | Results: <one or two, each with its test>
  2. ...
  BALANCE
  <role> | hours now | importance | note
  Crowding out the rest: <role>, which displaced <what>
  RENEWAL
  Body: <result or left out>   Mind: ...   Relationships: ...   Meaning: ...
  REVIEW
  <date> | Plan first: <results that matter but have no deadline>
  MISSING
  <what would sharpen the map>
  CHECKS MISSED
  <one line per check still missed, or none>
tweaks:
  - what: How many roles you list
    how: Four to eight works. More than eight and the roles blur. Fewer than four and the map hides someone.
  - what: Whether a goal is a result
    how: Ask if you can name the day it is done. If not, rewrite it.
  - what: Your values
    how: Paste a ranked list. Without it the links to values are guesses.
  - what: Honest hours
    how: Give real hours, not wished-for hours. The balance view depends on them.
judge:
  - Every role has an "about" line that you could act on tomorrow.
  - Every goal names the day it is done, not an activity.
  - You recognise the crowding role without being told.
  - No goal is there only because someone else wants it.
  - Your own role has a goal.
test:
  - Run it and show the table to someone who knows you well. Ask what is missing.
  - Compare the hours column with your calendar from last month.
  - Run it again in six months and see what moved.
improve:
  - Add your real roles to the skill file, so it stops asking for them.
  - Save the map in your about-me file for the weekly planner.
  - Add a rule of your own, such as one result per role in the next year.
  - Pair it with "Eulogy values finder" before and "Personal mission statement writer" after.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Sorting roles and checking goal wording is text work. Claude, ChatGPT and Gemini all do it well with this skill.
    - name: A spreadsheet or notes app
      why: Keeps the role table where you can see it when you plan the week.
  inputs:
    - A ranked values list from the Eulogy values finder
    - Your calendar from the last month, to check the hours column
    - A note on what others expect from you in each role
terms:
  - term: Result
    meaning: Something you can name when it is done, as opposed to an activity you keep doing.
  - term: Crowding role
    meaning: The role that takes the most hours while ranking low in how much it matters to you.
output_sample:
  input:
    - What you do, who depends on you and what is on your mind
    - Your top values (optional)
    - How you spend a typical week (optional)
  prerequisites:
    - Your values list from the Eulogy values finder (optional)
  output:
    - name: ROLES
      contains: Four to eight roles, each with what you are about, a guiding value and one or two results with a test.
    - name: BALANCE
      contains: Each role's hours now and importance, and the role crowding out the rest.
    - name: RENEWAL
      contains: One small result each for body, mind, relationships and meaning, or a note on which you left out.
    - name: REVIEW
      contains: A date about six months out, and the results to plan first.
    - name: MISSING and CHECKS MISSED
      contains: Facts you did not give, and any of its own checks it could not pass, or none.
