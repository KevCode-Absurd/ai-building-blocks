slug: sales-copy-editor
renamed_from: edit-a-draft-so-it-sells
name: "Sales copy editor"
summary: "Paste a draft and facts. Get weak lines fixed, each with its gain, and a one-line verdict."
category: general
boards: [ecommerce]
type: skill
role: check
job: copy
level: advanced
inputs:
  - {type: copy_draft, required: true}
  - {type: brand_brain, required: false}
  - {type: ad_copy, required: false}
outputs:
  - {type: audit_report}
uses: [anti-ai-slop-copy-editor, sales-copy-readiness-checker, clear-before-clever-copy-checker]
