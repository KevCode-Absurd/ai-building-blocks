new_slug: sales-copy-opening-writer
name: "Sales copy opening writer"
summary: "Write the opening of your sales copy: paste your buyer, offer and proof, and get two different openings to test against each other."
job: write-ad-copy
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Sales copy opening writer"
subhead: Give it a brief on your buyer, your offer and the proof you can use. It picks one of six classic lead types for how aware the buyer is. You get two openings to test, from neighbouring leads, and the promise your close must keep.

explain: |
  The opening decides whether anyone reads the rest. Most writers open the same way every time, or test two versions of the same opening reworded. When one wins, nobody learns anything.

  This skill uses the six lead types from the copywriting book Great Leads, by Michael Masterson and John Forde: offer, promise, problem-solution, secret, proclamation and story. The book lines them up from direct to indirect. A buyer ready to buy gets a direct lead. A buyer who doesn't know they have the problem gets an indirect one. The skill picks the starting lead, checks you have what it needs (a secret lead needs a real fact), and writes it. Then it writes the next lead along the scale, so your test compares two real approaches.

when:
  - You're writing an ad, page or email and aren't sure how to start it.
  - You want to test two openings that differ in approach, not in wording.
  - Your openings keep starting with the product for buyers who've never heard of you.
not_for:
  - You only need a headline for the top of a page. Use the Website first-screen copy writer.
  - You want many first lines to scan at once. Use the Ad hook writer.
  - You have no offer or buyer notes yet. Write them first with the Buyer brief writer.

you_give:
  - A brief on the buyer, how aware they are, what they want and their main doubt
  - Your offer, its terms and the proof you can use
  - What competitors promise, or what the market has heard (optional)
  - What shows before "see more" or before the thumb moves on (optional)
you_get:
  - How aware the buyer is, and whether the market has heard the promise often
  - Opening A, with the lead it uses and why it fits
  - Opening B, from the next lead along the scale, with the reason for the step
  - The promise the close must keep, and any lead skipped for lack of proof
  - Any of its own checks the openings couldn't pass, named one per line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste a brief on your buyer, including how aware they are.
  - Paste your offer and the proof you're allowed to use.
  - Say where it will run, such as "Facebook main text, about 125 characters show".
  - Run both openings on the same body copy, so only the opening changes.

how_it_works:
  - title: Finds the starting lead
    text: Uses the buyer's awareness to pick a place on the scale, from the offer for ready buyers to a story for cold ones.
  - title: Checks what it needs
    text: Each lead needs something real, such as a deal with full terms or a checkable fact. If it's missing, it moves one step.
  - title: Writes opening A
    text: The first sentence carries what the reader gets, or makes the next one hard to skip. Length follows awareness.
  - title: Writes opening B
    text: Steps one lead toward indirect if the market has heard the promise often, or toward direct if it's fresh.
  - title: Sets the close
    text: Names the promise the close must keep, so the piece ends where its opening pointed.
  - title: Checks the openings
    text: Goes through its own checks, such as two different leads, no fact you didn't supply and every offer with its limit, fixes what it can, and names any it still misses.

output_sample:
  input:
    - A brief on your buyer, how aware they are and their main doubt
    - Your offer, its terms and the proof you can use
    - What competitors promise (optional)
    - How much text shows before "see more" (optional)
  prerequisites:
    - A buyer brief, from the Buyer brief writer, if you have one (optional)
  output:
    - name: "Buyer"
      contains: How aware the buyer is, and whether the market has heard your promise often.
    - name: "Opening A"
      contains: The first opening, the lead type it uses and why it fits this buyer.
    - name: "Opening B"
      contains: A second opening from the next lead type along, with the reason for the step.
    - name: "Close must keep"
      contains: One line naming the promise the end of the piece has to keep.
    - name: "Skipped"
      contains: Any lead type left out because you gave no proof for it.
    - name: "Checks missed"
      contains: One line for each of the skill's own checks the openings failed, or none.

output_shape: |
  BUYER: <awareness>, market <fresh / heard it often>

  OPENING A: <lead>, <why it fits>
  <the opening>

  OPENING B: <next lead>, one step <direct / indirect>, <why>
  <the opening>

  CLOSE MUST KEEP
  <one line>

  SKIPPED
  <any lead you lacked the material for>

  CHECKS MISSED
  <one line per check still missed and why, or none>

example:
  business: sprout
  input: |
    [the skill]

    Buyer: knows Sprout, maybe from a store shelf, and thinks it costs
    too much. Hasn't decided (product aware).
    Doubts: "Which discount is real?" / "Will the price jump after the
    first order?"
    Market: every greens brand promises the same nutrients.
    Offer and proof:
    - Per pack: 60+ ingredients, 21 vitamins & minerals, 6 g fiber
    - First box $29.99 with the text sign-up discount for new
      customers, then $49.99 every 4 weeks ($1.78/day). One-time $66.65.
    - 30-day money-back guarantee, first order only
    Channel: Facebook main text, about 125 characters show before
    "see more"
  output: |
    BUYER: product aware, market has heard the promise often

    OPENING A: promise. A product-aware buyer who hasn't decided needs
    the biggest benefit you can back.
    Your greens, vitamins and fiber in one pack a day, for $1.78 a day
    on subscription after your first box. Each pack has 60+ ingredients,
    21 vitamins and minerals, and 6 g of fiber.

    OPENING B: problem-solution, one step indirect, because every greens
    brand makes the same nutrients promise.
    Seen a few different Sprout discounts and can't tell which is real?
    Here it is, plainly. Your first box is $29.99 with the text sign-up
    discount for new customers. After that it's $49.99 every 4 weeks,
    and your first order has a 30-day money-back guarantee.

    CLOSE MUST KEEP
    The real price now and after the first box, so "too expensive" is
    answered with numbers.

    SKIPPED
    Secret: no little-known, checkable fact in the proof given.

    CHECKS MISSED
    None.

tweaks:
  - what: How aware the buyer is
    how: This picks opening A. If you're wrong here, you get an opening for the wrong person, so base it on reviews or support messages, not a guess.
  - what: What the market has heard
    how: This decides which way opening B steps. Paste three competitor promises and it can judge it instead of assuming.
  - what: Proof
    how: The secret and proclamation leads need a real fact. Without one, they're skipped and named under SKIPPED.
  - what: Where it runs
    how: Tell it how much shows before "see more". It keeps each opening's key sentence inside that space.

judge:
  - The two openings use different leads, next to each other on the scale.
  - Neither uses a fact, number or quote you didn't supply.
  - An opening for a cold buyer doesn't start with the product.
  - A named customer or founder moment appears only if it's on record.
  - The first sentence of each opening says what the reader gets, or makes the next sentence hard to skip.

test:
  - Run it for a buyer and offer where you know which opening worked. Opening A should use that lead, or say why not.
  - Run it twice. Opening A's lead should be the same both times.
  - Read the two openings back to back. If you can't name the lead each one uses, they're the same opening reworded.
  - Remove all proof and run it again. It should fall back to problem-solution or story.
  - Test both with the same body and picture, changing only the opening.

improve:
  - Write your buyer brief into "What you need" in the skill file, so step 1 starts from the same place every run.
  - Write what your competitors promise into the skill file, so step 4 steps the same way each time.
  - Add a real, checkable fact to your brand file if you want the secret lead available.
  - Save each winning opening to your brand file, with the buyer it worked for.
  - For a stronger start, run "Know who you're writing for before you start" first (a few plain lines about your buyer also work), and pair it with "Finish your sales page with proof and one ask" to write the rest.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Any current chat AI can pick and write the two openings. Give it the proof so it invents none."}
    - {name: "Meta Ad Library", why: "Shows the promises other brands run now, so you can tell if the market has heard yours often."}
  inputs:
    - "Reviews that describe the problem in buyers' words, so the problem and story leads have material"
    - "A real event you may tell, such as a support call or a founder's day, so a story lead can be true"
    - "A dated test result or study you may cite, so the secret and proclamation leads become possible"

terms:
  - term: Lead
    meaning: The opening of a piece of sales copy, the part read before someone decides to carry on.
  - term: Direct and indirect
    meaning: A direct lead opens with the deal or the benefit. An indirect one opens with a problem, a fact, news or a story, and reaches the product later.
  - term: Awareness
    meaning: How much the buyer knows, from not knowing they have the problem to knowing your product and only needing the deal.
