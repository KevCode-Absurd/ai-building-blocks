new_slug: sbc-share-offset-cost
name: Share compensation cash-offset cost
headline: Share compensation cash-offset cost
summary: Estimate cash needed to offset actual employee share issuance without confusing it with reported compensation expense.
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A share-issuance cash-offset scenario and comparison with reported compensation expense. Share net employee shares issued, matched repurchase price, employee exercise proceeds and reported share-based compensation expense.
explain: |-
  A share-issuance cash-offset scenario and comparison with reported compensation expense.

  Issuer accounting and earnings. Illustrative figures.Three million issued shares×$20 cost60 to offset; employee proceeds10 reduce net cash to50,10 above reported expense40. Price15 makes gross45, net35 and a negative5 comparison.
when:
  - You need a share-issuance cash-offset scenario and comparison with reported compensation expense.
  - You work on issuer accounting and earnings and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Net employee shares issued, matched repurchase price, employee exercise proceeds and reported share-based compensation expense.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A share-issuance cash-offset scenario and comparison with reported compensation expense.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: 1. Reconcile vested/issued employee shares, forfeitures and net settlements to the share ledger; distinguish actual issuance from accounting diluted shares
    text: Reconcile vested/issued employee shares, forfeitures and net settlements to the share ledger; distinguish actual issuance from accounting diluted shares.
  - title: 2. Multiply actual net shares by a stated repurchase execution-price scenario and subtract employee exercise proceeds once
    text: Multiply actual net shares by a stated repurchase execution-price scenario and subtract employee exercise proceeds once.
  - title: 3. Compare cash offset cost with reported compensation expense while retaining both; explain timing and valuation differences rather than replacing accounting expense automatically
    text: Compare cash offset cost with reported compensation expense while retaining both; explain timing and valuation differences rather than replacing accounting expense automatically.
output_shape: |-
  A share-issuance cash-offset scenario and comparison with reported compensation expense.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Employee proceeds and net settlement are not deducted twice.
judge:
  - Employee proceeds and net settlement are not deducted twice.
  - The schedule does not add the same dilution cost again to an FCFF already adjusted for share compensation.
  - Tie all inputs to source notes, dates, currency, scale and signs.
  - Retain reported figures beside analytical adjustments and list every unresolved source gap.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
