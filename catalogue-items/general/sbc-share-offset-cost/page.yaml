new_slug: sbc-share-offset-cost
name: Share compensation cash-offset cost
headline: Share compensation cash-offset cost
summary: Estimate the cash needed to offset the shares you actually issued to staff, and compare it with reported share compensation expense.
job: track-numbers
thinking: high
thinking_why: "Issued shares and reported expense measure different things, so each line needs its own source before the two are compared."
subhead: Give it the shares your company issued to employees, a repurchase price to test, and what employees paid. It works out the cash needed to offset those shares. It then compares that cost with reported share compensation expense.
explain: |-
  A share-issuance cash-offset scenario and comparison with reported compensation expense.

  Illustrative figures, in millions. Three million issued shares x $20 = 60 to offset. Employee proceeds of 10 reduce net cash to 50, which is 10 above reported expense of 40. At a price of $15, gross is 45, net is 35, and the comparison is -5 (35 - 40).
when:
  - You want to know what it would cost in cash to buy back the shares you issued to staff.
  - You need to explain why that cash cost differs from reported share compensation expense.
  - You want to test a few repurchase prices side by side.
  - A reviewer needs to trace each number back to its source.
not_for:
  - "You need the fair value of grants: ask an accountant or valuation adviser, because this does not value awards."
  - "You need diluted earnings per share: use your accounting team's EPS workings, because this uses actual issued shares only."
  - "You want to decide on or run a share buyback: talk to your finance lead and legal adviser, because this only models cost."
  - "You need incremental shares from options for diluted EPS: use the Treasury-stock option dilution instead."
you_give:
  - Net employee shares issued, from your share ledger
  - The repurchase price you want to test
  - Cash employees paid to exercise their awards
  - Reported share-based compensation expense
  - Reporting date, currency and scale
  - Your spreadsheet tool and the file format you need (optional)
you_get:
  - The cash needed to offset the issued shares, before and after employee payments
  - A side-by-side comparison with reported compensation expense, with reasons for the gap
  - An editable workbook, if your AI can build files
  - A list of missing inputs and checks that did not run
how_to_use:
  - Open your AI and upload the pack, or paste SKILL.md into the chat.
  - Add your share ledger figures, repurchase price, exercise proceeds and reported expense, with dates, currency and scale.
  - Ask for the cash-offset comparison. If you want a workbook, use an AI that can make and open files.
  - "Check the MISSING: lines and CHECKS MISSED before you use any number."
  - Confirm employee payments are subtracted only once.
output_sample:
  input:
    - Net employee shares issued, checked against your share ledger
    - Matched repurchase price you want to test
    - Cash employees paid to exercise their awards
    - Reported share-based compensation expense
    - Reporting date, currency and scale
  prerequisites:
    - An AI that can create and recalculate spreadsheet files (optional, for the workbook)
    - Node.js 20 or later (optional, to run the bundled calculation)
  output:
    - name: Scope and dated sources
      contains: The period, currency, accounting basis and the dated records each figure comes from.
    - name: Inputs and assumptions
      contains: Every input and the repurchase price scenario, kept apart from reported facts.
    - name: Model calculations and reconciliations
      contains: Gross offset cost, cash after employee proceeds, and the comparison with reported expense.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation, a changed-input test and reopening the saved file.
    - name: "MISSING: lines"
      contains: Each input that was not supplied, so no number is guessed or set to zero.
    - name: CHECKS MISSED
      contains: Either none, or the exact checks that failed or could not run.
how_it_works:
  - title: 1. Reconcile vested/issued employee shares, forfeitures and net settlements to the share ledger; distinguish actual issuance from accounting diluted shares
    text: Reconcile vested/issued employee shares, forfeitures and net settlements to the share ledger; distinguish actual issuance from accounting diluted shares.
  - title: 2. Multiply actual net shares by a stated repurchase execution-price scenario and subtract employee exercise proceeds once
    text: Multiply actual net shares by a stated repurchase execution-price scenario and subtract employee exercise proceeds once.
  - title: 3. Compare cash offset cost with reported compensation expense while retaining both; explain timing and valuation differences rather than replacing accounting expense automatically
    text: Compare cash offset cost with reported compensation expense while retaining both; explain timing and valuation differences rather than replacing accounting expense automatically.
output_shape: |-
  A share-issuance cash-offset scenario and comparison with reported compensation expense.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Issue period"
    how: "Take the issue period from the share ledger, the repurchase price and the exercise payments. Use one currency and scale on every line."
  - what: "Repurchase price"
    how: "Change the repurchase price and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Employee proceeds and net settlement are not deducted twice.
judge:
  - Employee proceeds and net settlement are not deducted twice.
  - The schedule does not add the same dilution cost again to an FCFF already adjusted for share compensation.
  - Tie all inputs to source notes, dates, currency, scale and signs.
  - Retain reported figures beside analytical adjustments and list every unresolved source gap.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one share offset cost you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define net share issuance into SKILL.md, so every run uses your wording."
before: []
next: [reconcile-share-compensation-dilution-and-cash, treasury-stock-option-dilution]
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
