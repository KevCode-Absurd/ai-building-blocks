new_slug: scene-detail-picker
name: "Scene detail picker"
summary: "Pick the few details that make a place feel real before you draft. Give it your story's places. You get four details each, plus what to skip."
job: write-and-tell-stories
thinking: low
thinking_why: "It follows a short fixed method for each place."

headline: "Pick the few details that make a place feel real, then stop describing"
subhead: "Give it your situation and the places your first scenes happen in. It runs a quick recall of each place across the five senses, keeps four details, adds a fresh comparison and lists what to skip so the scene stays about the story."

explain: |
  Description goes wrong in two ways. Too little leaves the reader nearsighted. Too much buries the story, and the reader puts the book down because it got boring. The fix is not a rule about length. It is picking details well.

  This skill works on a place before you draft. It asks you to call the place up all at once, across the five senses, then writes down the first four things that come. First details tend to be the truest. It favours place and texture over faces and clothes, adds one fresh comparison if it can find one that is not a cliche, and lists what to skip. It also marks what the reader will fill in better than you could. You get a short sheet for each place to keep beside the draft.

when:
  - "Your drafts open with a paragraph of scenery that goes nowhere."
  - "You are about to write a place you know only a little."
  - "A reader said they could not picture where it happened."
not_for:
  - "You want to fix scenes you already wrote: ask your AI to cut or tighten the draft instead, as this sheet is for before you write."
  - "You are writing a report, guide or other non-fiction: this tool is built for stories, so describe the place in plain facts yourself."
  - "You need a plot, characters or an outline: this only picks details for places, so work out the story first, then come back."

you_give:
  - "Your situation or brief"
  - "The places your first scenes happen in"
  - "Places you know in real life that they resemble (optional)"
  - "The mood you want in each place (optional)"
you_get:
  - "Four first-to-mind details for each place"
  - "One fresh comparison for each place, or a note that none was good enough"
  - "A skip list for each place"
  - "A line saying what to leave to the reader"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Paste your situation, then list the places in order."
  - "If a place is real, name it. It will use what is true about it and mark what it made up."
  - "Keep the sheet beside you while you draft."
  - "Use the details once each. Do not repeat them."
output_sample:
  input:
    - Your situation or brief
    - The places your first scenes happen in, in order
    - Real places they resemble (optional)
    - The mood or whose eyes we see through (optional)
  output:
    - name: Place block
      contains: "One block per place: four first-to-mind details, with at least one that is not sight."
    - name: Fresh comparison
      contains: One comparison between two unlike things for each place, or a note that none was good enough.
    - name: Skip
      contains: A short list of things easy to describe that would slow the story.
    - name: Leave to the reader
      contains: One line on what the reader will fill in, such as faces or ordinary furniture.
    - name: Made up, not known
      contains: Any details the AI invented, so you can tell them from real ones.
    - name: A word on length
      contains: How many lines each place should get in your draft.
    - name: Checks missed
      contains: One line for each check that failed and why, or none.

how_it_works:
  - title: "Lists the places"
    text: "Takes the places your first scenes happen in."
  - title: "Recalls each one"
    text: "Calls up each place across the five senses."
  - title: "Keeps four details"
    text: "Picks the first four that come, favouring place and texture."
  - title: "Trims the people"
    text: "Drops faces, clothes and long lists."
  - title: "Adds a comparison"
    text: "Offers one fresh comparison, or none."
  - title: "Writes a skip list"
    text: "Names what to leave out of each place."
  - title: "Leaves room"
    text: "Marks what the reader will supply."

output_shape: |
  PLACE 1: <name>
  Four details: <detail> | <detail> | <detail> | <detail>
  Senses used: <list>
  Fresh comparison: <the thing is like the other thing> | or: none good enough
  Skip: <list>
  Leave to the reader: <one line>
  Made up, not known: <details it invented>

  PLACE 2: <name>
  <same>

  A WORD ON LENGTH
  <how many lines each place gets in the draft>

  CHECKS MISSED
  <one line per check missed, or none>

tweaks:
  - what: "Real places"
    how: "Say which places you know. Recall from a real place gives details no one else would think of."
  - what: "Mood"
    how: "Say the mood. The same room feels different when someone is afraid in it."
  - what: "Point of view"
    how: "Say whose eyes it is. A baker notices different things than a bus driver."
  - what: "Length"
    how: "Say if the piece is short. A short piece gets two details for each place, not four."

judge:
  - "Each place has exactly four details."
  - "At least two senses other than sight appear in the sheet."
  - "The comparison is not one you have heard before."
  - "The skip list names real temptations, such as clothes or the weather."
  - "Invented details are marked as invented."

test:
  - "Run it on a place you know well. Check the four details are things you would also have named."
  - "Run it on a cliche room such as a haunted house. The comparison should avoid the usual ones."
  - "Draft one scene from the sheet. The place should be clear in under five lines."

improve:
  - "Add a list of comparisons you are tired of, and it will avoid them."
  - "Keep a detail bank of real places you visit."
  - "Use the sheet again in the second draft to check you did not over-describe."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A short recall exercise per place is plain text work."}
    - {name: "A pocket notebook", why: "Write down real details when you notice them. The best ones come from life."}
  inputs:
    - "A photo of a real place"
    - "The character whose eyes we see through"

terms:
  - term: "Texture"
    meaning: "How a place feels: the grit underfoot, a hum, a smell."
  - term: "Fresh comparison"
    meaning: "A comparison between two unlike things that the reader has not met before."
