new_slug: search-title-and-snippet-writer
name: "Search title and snippet writer"
summary: "Write a search title and description for your page. Give it your topic, search phrase and benefit. Get three options with character counts."
job: get-found-in-search
thinking: low
thinking_why: "It writes short lines to set length limits."

headline: "Search title and snippet writer"
subhead: "Paste what the page is about, the search phrase people use and your best benefit. The prompt writes three titles and descriptions that show in search results, with character counts, a line for social sharing and a pick."

explain: |
  The title and description are your page's ad in search results. A vague one gets skipped, even if you rank well. A cut-off one looks sloppy.

  This prompt writes three versions from different angles. Each title puts your search phrase near the start. Each description leads with the benefit and ends with an action. It shows the character count so nothing is cut off, and it never promises more than the page does. It also adds a line for social sharing and picks one option with a reason.

when:
  - "Your page ranks but few people click."
  - "You are publishing a new page."
  - "Your titles are cut off in search."
not_for:
  - "You need a full SEO check of every tag on a page: use the Title and meta tag writer."
  - "Your titles are fixed by a product feed or listing tool: edit them in that tool instead."
  - "You have no main search phrase yet: research what people type first, or ask a colleague who knows your buyers."

you_give:
  - "What the page is about"
  - "The main search phrase"
  - "Who it is for and the best benefit"
  - "Brand name (optional)"
you_get:
  - "Three titles and descriptions with counts"
  - "A line for social sharing"
  - "A pick with one reason"

how_to_use:
  - "Copy the prompt, then paste it into Claude, ChatGPT or Gemini with your details under it."
  - "Under it, describe the page and its search phrase."
  - "Say who it is for and the best benefit."
  - "Paste the pick into your page settings and check how it looks in search."
output_sample:
  input:
    - What the page is about, in two sentences
    - The main search phrase people type
    - Who the page is for and its best benefit
    - Page type and brand name (optional)
  output:
    - name: Option 1
      contains: A title and description with character counts, written from one angle such as the direct answer.
    - name: Option 2
      contains: A second title and description with counts, written from a different angle such as the benefit.
    - name: Option 3
      contains: A third title and description with counts, written from another angle such as a question.
    - name: Social line
      contains: One short line to use when the page is shared on social media.
    - name: Pick
      contains: The option that fits best, with one reason for the choice.

how_it_works:
  - title: "Title"
    text: "Phrase near the start."
  - title: "Description"
    text: "Benefit first, then an action."
  - title: "Three angles"
    text: "Different ways in."
  - title: "Check"
    text: "Nothing beyond the page."

output_shape: |
  OPTION 1 (<angle>)
  Title: <...> (<n> characters)
  Description: <...> (<n> characters)
  OPTION 2 ...
  OPTION 3 ...
  SOCIAL LINE: <...>
  PICK: <n> because <...>

tweaks:
  - what: "Search phrase"
    how: "Give the exact words people type. The titles center on it."
  - what: "Page type"
    how: "A product page, a guide and a home page use different angles."
  - what: "Brand name"
    how: "Say if the brand name must appear."

judge:
  - "The phrase is in each title."
  - "Counts are within the limits."
  - "The three angles differ."
  - "Nothing goes beyond the page."

test:
  - "Paste the output in a search preview tool and check nothing is cut off."
  - "Compare the pick with your current title."
  - "Change one title and watch clicks for a few weeks."

improve:
  - "Add your usual brand name format."
  - "Add words you never use in titles."
  - "Pair it with Keyword to post outline writer."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A short prompt works in any strong chat AI. Paste it, then add your details under it."}
  inputs:
    - "Your current title and description"
    - "Clicks and impressions for the page"
    - "Two rival results for the same phrase"
