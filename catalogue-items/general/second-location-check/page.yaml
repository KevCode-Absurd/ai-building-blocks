new_slug: second-location-check
name: "Second location readiness checker"
summary: "See if your business runs without you before opening a second location. Get trial gaps, a fix list and a ready or not yet call."
job: plan-strategy
thinking: medium
thinking_why: "It sorts trial notes into gaps and runs a short list of checks with your numbers. The checks are fixed, so a mid-range model does it well."

headline: "Second location readiness checker"
subhead: "Paste your manual and what you saw when a newcomer ran a shift. It turns every stop, question and guess into a gap in the manual. It checks that your first location earns without you, and checks the new site, its supplies and who will run it. You get a ready or not yet call and a fix list."

explain: |
  A second location that copies only what you do from memory will copy your good days. It will miss the dozens of small things you do without noticing. A trial shift run by a real newcomer is the cheapest way to find them before you open a second location.

  This skill takes your trial notes and sorts each stop, question and guess into a gap: a missing step, an unclear number, a missing tool, or a judgment only you can make. It then checks three things that decide whether a copy can work. Does the first location make money when you are not there? Can a second site and its supplies be arranged on the same terms? Is there one named person who can run it?

  It ends with ready, ready with fixes or not yet, and the fixes in order. With no trial notes it says the manual is untested, and makes the trial the first fix. It never guesses takings, costs or a person.

when:
  - You are about to open a second location, sign a partner or hire a manager to run your business.
  - A newcomer just ran a shift from your manual and you have notes on where they struggled.
  - Your first location is busy but you are not sure it earns money when you are not there.

not_for:
  - "You are still deciding whether to open, or choosing a site: use the Go or no-go launch checker."
  - "You have no manual yet: write one with the Operations manual writer, then run a trial shift."
  - "You want to know which market to enter next, and in what order: use the Market expansion sequencer."
  - "You want to know if one bad year would sink the business: use the Bad-year break-even tester."

you_give:
  - "Your manual, standards sheet or job cards (from the Operations manual writer, or your own)"
  - "Notes from a newcomer's trial shift: where they stopped, asked or guessed"
  - "Takings and costs for a week you were away (optional)"
  - "The second site and who would run it, even if it is only an idea (optional)"

you_get:
  - "Each trial note sorted into a gap, with a one-line fix"
  - "A check that the first location earns without you on site"
  - "A check on the second site, its supplies and who runs it"
  - "A call of ready, ready with fixes or not yet"
  - "A fix list in order, with an owner and a date for each"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. It needs no files, web access or paid tools."
  - "Paste the manual and your trial notes exactly as you wrote them. With no trial notes it will tell you to run a trial first."
  - "Add takings and costs for a week you were away, if you have them. Without them the first check says unknown."
  - "Name the second site and who would run it. A real person, not only a job title."
  - "Fix the gaps in the order it gives, then run the trial again with a different person."

how_it_works:
  - title: Sorts the trial notes
    text: Each stop is a missing step, an unclear number, a missing tool or a judgment call only you can make.
  - title: Groups the gaps
    text: Counts gaps by role and type. A role with over a third of them needs a new card, not a patch.
  - title: Checks it runs without you
    text: Looks at takings, costs and complaints in a week you were away.
  - title: Checks the site and supplies
    text: Asks if the same inputs can be bought on the same terms and the site fits the layout.
  - title: Checks the person
    text: Asks who runs it, how they were trained, and who checks their work.
  - title: Checks the money
    text: If you gave costs, tests whether the new site can lose a fifth of sales and still cover them.
  - title: Calls it
    text: Ready, ready with fixes or not yet, with the fixes in order.

output_shape: |
  TRIAL GAPS
  <note> | Type: <missing step / unclear number / missing tool / judgment call> | Fix: <>

  RUNS WITHOUT YOU?
  Takings and cost in a week you were away: <numbers or MISSING> | Complaints or redo: <> | Call: <yes / partly / no / unknown>

  SECOND SITE, SUPPLIES, PERSON
  Site: <> | Supplies on the same terms: <> | Named person: <> | Trained by: <> | Checked by: <>

  CALL
  <ready / ready with fixes / not yet> | Why: <>

  FIX LIST IN ORDER
  1. <> 2. <> 3. <>

  MISSING
  <facts that would change the call>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "Your manual, standards sheet or job cards"
    - "Notes from a newcomer's trial shift"
    - "Takings and costs for a week you were away (optional)"
    - "The second site and who would run it (optional)"
  prerequisites:
    - "A manual, such as one from the Operations manual writer"
    - "A trial shift run by someone who has not worked in your business"
  output:
    - name: "Trial gaps"
      contains: "Each stop, question or guess typed as a missing step, unclear number, missing tool or judgment call, with a fix."
    - name: "Runs without you?"
      contains: "Takings, costs and complaints in a week you were away, ending in yes, partly, no or unknown."
    - name: "Second site, supplies, person"
      contains: "Whether the site fits, supplies come on the same terms, and who runs it, trains them and signs them off."
    - name: "Call"
      contains: "Ready, ready with fixes or not yet, and why."
    - name: "Fix list in order"
      contains: "Fixes ordered by what blocks opening, each with an owner and a date."
    - name: "Missing and Checks missed"
      contains: "Facts that would change the call, and any check the skill could not pass."

tweaks:
  - what: Your trial notes
    how: Write them straight after the shift. Include small things like "asked where the spare box is".
  - what: A week you were away
    how: Give takings and costs. Without them the first check stays unknown.
  - what: The second site
    how: Say how it differs from the first in size, layout and supply route.
  - what: Who runs it
    how: Name a real person and what they have done so far. A role title is not enough.

judge:
  - Every trial note appears as a gap with a fix.
  - The without-you check uses numbers from a week you were away, or says MISSING.
  - The call names a person, not only a role.
  - The fix list is in order of what blocks opening.
  - No fact is invented.

test:
  - Give it notes with five stops. It should return five gaps.
  - Give it a business that has never run without you. The first check should say unknown.
  - Run it twice on the same input. The call should be the same.

improve:
  - Run the trial with a second newcomer after you fix the gaps. The list should shrink.
  - Keep each trial's gap list. Repeated gaps point to a weak part of the manual.
  - Rerun the check after your first month at the second location, using its real numbers.

works_best_with:
  tools:
    - {name: "Claude, ChatGPT or Gemini", why: "Sorting notes into gaps and running a fixed list of checks is reasoning work. No files, web access or paid tools needed."}
    - {name: "Your till or sales report", why: "Takings for a week you were away turn the first check into a number."}
  inputs:
    - "A manual from Operations manual writer"
    - "Takings and costs for a week you were away"
    - "A list of the second site's differences"

terms:
  - term: Trial gap
    meaning: A place where a newcomer stopped, asked or guessed, which shows something missing from the manual.
  - term: Runs without you
    meaning: The location earns what it should and meets its standards when the owner is not there.
  - term: Judgment call
    meaning: A decision only the owner can make today, which needs a rule written down before it can be copied.
