new_slug: secondary-nav-price-checker
name: Secondary NAV price checker
headline: Secondary NAV price checker
summary: Check a secondary NAV price quote. See your closing payment after interim distributions, plus the future cash calls you would also have to fund.
job: money-and-investing
thinking: high
thinking_why: "The price and the future calls are different cash amounts, so they must stay apart and each must trace to the quote."
subhead: Give it the reference NAV and its date, the quoted price as a share of NAV, the distributions the seller keeps and the unfunded commitment you take on. It works out the quoted price, the closing payment, and a separate budget for future cash calls.
explain: |-
  In a secondary purchase, the price is quoted as a share of a reference NAV (the fund's reported net asset value on a set date). Two things then change what you really pay: distributions the seller keeps between that date and closing, and the future cash calls you take on.

  This skill works out the quoted price (NAV x price fraction), the adjusted closing payment (quoted price less credited distributions), and the future-call budget (the unfunded commitment you take on). It keeps the future calls apart from the purchase payment and adds them only in a labelled cash budget. It warns you not to deduct distributions twice if the quote already uses an updated NAV. It is price arithmetic, not a fair value or a view on future NAV.

  Illustrative figures only: NAV 100 at an 80% price is 80. A seller-kept distribution of 5 leaves 75 at closing. Future calls of 30 make a cash budget of 105.
when:
  - You are buying a fund interest in a secondary and want the closing payment and future-call budget shown separately.
  - You need to check whether the quote already counts interim distributions.
  - A reviewer needs to trace each figure to the quote and the fund statement.
not_for:
  - "You need a fair value or a view on future NAV: ask a valuation professional, since this only does price arithmetic."
  - "The deal has interim cash calls, currency conversion or a discount-rate valuation: use a valuation specialist, as this check does not cover them."
  - "You need to know if the deal terms are legal or binding: ask a lawyer, because the arithmetic cannot settle that."
  - "You need the unfunded part of one commitment after calls and recalls: use the Unfunded commitment checker instead."
  - "You need to check how much of a fund's distributions it can recycle: use the Fund recycling capacity checker instead."
you_give:
  - The reference NAV and its date
  - The price fraction (the quote as a percent of NAV)
  - Interim distributions the seller keeps that the deal credits against the price
  - The unfunded commitment you take on, from the commitment ledger
  - The closing date, currency and scale; and your spreadsheet tool if you want a workbook
you_get:
  - The quoted price, the adjusted closing payment and a separate future-call funding budget
  - An editable workbook with inputs, formulas and test cases to rerun
  - A tie-out of the price, the adjustment and the closing payment, the inputs still missing and the checks that ran
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the price quote, the reference NAV and the commitment ledger."
  - "Tell it what you need: the quoted price, the closing payment and the future calls shown separately."
  - "Ask it to stop and mark MISSING if the reference NAV or the price fraction is not in your sources."
  - "Check that interim distributions are not deducted twice if the quote already uses an updated NAV, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Your reference NAV and its date
    - Your price fraction, such as the percent of NAV quoted
    - Interim distributions the seller keeps and credits against the price
    - Your unfunded commitment that transfers to the buyer
    - Your reporting date, currency and scale
  prerequisites:
    - An AI that can run code and make spreadsheet files, for the workbook and the calculation script (optional for a plain answer)
  output:
    - name: Scope and dated sources
      contains: The deal, the sources used and the date of each one.
    - name: Inputs and assumptions
      contains: Each input with its source, date, currency and scale, and every assumption made.
    - name: Model calculations and reconciliations
      contains: Quoted price, adjusted closing payment and the separate future-call funding budget, with checks that tie them back.
    - name: Actual file verification
      contains: Which workbook and script checks ran and what they found.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and checks that failed or could not run.
how_it_works:
  - title: 1. Confirm the quoted NAV date, transferred interest and treatment of calls and distributions between reference date and closing
    text: Confirm the quoted NAV date, transferred interest and treatment of calls and distributions between reference date and closing.
  - title: 2. Multiply reference NAV by price fraction; deduct only seller-retained distributions explicitly credited dollar-for-dollar against price
    text: Multiply reference NAV by price fraction; deduct only seller-retained distributions explicitly credited dollar-for-dollar against price.
  - title: 3. Show future unfunded commitment separately from purchase payment and sum them only as a gross cash funding budget, not fair value
    text: Show future unfunded commitment separately from purchase payment and sum them only as a gross cash funding budget, not fair value.
output_shape: |-
  SCOPE AND DATED SOURCES
  INPUTS AND ASSUMPTIONS (NAV date, price fraction, credited distributions, unfunded commitment)
  QUOTED PRICE, ADJUSTED CLOSING PAYMENT, FUTURE-CALL BUDGET, GROSS CASH FUNDING BUDGET
  TIE-OUT: price less credited distributions = closing payment
  FILE CHECKS: what ran
  MISSING:
  CHECKS MISSED:
tweaks:
  - what: Reference NAV date
    how: Take the reference NAV date from the price quote and the fund statement. Use one currency and scale on every line.
  - what: Price fraction
    how: Change the price fraction and have your AI recalculate. Keep the actual figures you supplied.
  - what: Several prices
    how: Give two or three price fractions to see the cash budget side by side.
judge:
  - Interim distributions are not deducted twice if the quote already uses an updated NAV.
  - Unfunded commitment is a future contractual cash exposure, not current purchase-price consideration.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one secondary NAV price you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define price fraction into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
