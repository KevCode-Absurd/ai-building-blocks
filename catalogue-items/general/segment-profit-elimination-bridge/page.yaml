new_slug: segment-profit-elimination-bridge
name: Segment profit elimination bridge
headline: Segment profit elimination bridge
summary: "Reconcile segment profit to group operating profit, with each elimination and corporate cost shown and any unexplained gap left open."
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: "Give it each segment's profit, the eliminations between segments, the corporate costs kept at head office, any other adjustments and the group operating profit the company reported. It lines them up in one signed bridge and shows what is left over. You get the bridge, the gap and a list of definitions to check."
explain: |-
  Companies report profit for each segment, such as a division or a region. Add those up and you rarely get the group's operating profit. The gap is made of eliminations (profit on sales between segments), costs held at head office and accounting adjustments. This segment profit reconciliation lays each one out as a signed line.

  Two traps matter. A segment's measure may not be operating profit at all. Segment EBITDA is not group EBIT, so the skill reads each segment's definition first. And a profit elimination is not a revenue elimination. The skill keeps those two lines apart.

  If the bridge does not land on the reported number, the difference stays on the page as an unexplained gap. The skill never adds a balancing line. That is the point. You find out what is missing before you build a valuation on segment earnings.
when:
  - "You are reading a segment note in an annual report and want to see how it reaches the group's operating profit."
  - "You plan to value each segment on its own and need to know the segment profits really add up."
  - "The segment table and the income statement show different profit and you need to find out why."
  - "A reviewer asks for the bridge from segment profit to consolidated operating profit."
not_for:
  - "You want to reconcile revenue, not profit: use the Gross-to-net revenue bridge for sales deductions, or the Organic revenue perimeter bridge for acquisitions and currency."
  - "You want to value the business or pick a multiple. This skill stops at the bridge. The Minority-interest multiple reconciliation is the next step for valuation."
  - "You want to compare profit with cash: use the Cash versus earnings checker."
  - "You only have group figures and no segment note. There is nothing to bridge."
you_give:
  - "Each segment's profit and the name of the measure it uses, from the segment note"
  - "The eliminations between segments, with their signs"
  - "Corporate or unallocated costs"
  - "Other adjustments the note lists, such as share-based pay or one-off items (optional)"
  - "The group operating profit as reported, for the same period and the same scope"
  - "The period, currency and scale, such as USD millions for the year to 31 December"
you_get:
  - "A signed bridge from the sum of segment profits to the group's computed operating profit"
  - "The residual: reported group profit less the bridge total"
  - "A flag on any segment measure that is not operating profit, such as EBITDA"
  - "A list of lines that could explain a residual, and checks that could not run"
how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or paste it in as your first message. Add it to your AI if you want to reuse it."
  - "Paste the segment table and the lines that reconcile it. Say the period, currency and scale. Attach the annual report pages if you can."
  - "Check the definitions first. The AI lists each segment's measure and says if it differs from group operating profit."
  - "Read the bridge and the residual. A residual that is not zero stays open until a source explains it."
  - "Do not use segment profits in a valuation until the residual is explained or you have chosen to accept it."
how_it_works:
  - title: 1. Reads each definition
    text: Maps each segment measure to group operating profit. A segment EBITDA is flagged, not treated as group EBIT.
  - title: 2. Adds up the segments
    text: Sums the segment measures for the same period and scope as the group figure.
  - title: 3. Applies the signed lines
    text: Applies eliminations, corporate costs and disclosed adjustments one by one. Profit eliminations and revenue eliminations stay separate.
  - title: 4. Compares with the reported figure
    text: The residual is reported minus computed. It is never plugged.
  - title: 5. Holds the gate
    text: Marks a residual as a source gap before the segment earnings go into any valuation.
output_shape: |-
  SCOPE
  <period> | <currency and scale> | <source pages> | Group measure: <operating profit as defined>

  SEGMENT MEASURES
  <segment> | <measure and definition> | <amount> | Same as group measure: <yes, no or MISSING>

  BRIDGE
  Sum of segments: <amount>
  Intersegment profit eliminations: <signed amount>
  Corporate costs: <signed amount>
  Accounting adjustments: <signed amounts>
  Computed group operating profit: <amount>
  Reported group operating profit: <amount>
  Residual: <reported - computed>

  WHAT THE RESIDUAL MEANS
  <zero, or the lines that could explain it and what source would settle it>

  MISSING
  <figures not supplied>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - "Each segment's profit, with the name of the measure the company uses for it"
    - "The eliminations, corporate costs and other adjustments from the segment note"
    - "The group operating profit as reported, for the same period"
  prerequisites:
    - "The segment note and the income statement from the annual report"
    - "An AI that can make files, only if you want a spreadsheet (optional)"
  output:
    - {name: "Scope", contains: "The period, currency, scale and pages used, and which group measure the bridge ties to."}
    - {name: "Segment measures", contains: "Each segment's measure and definition, and whether it matches group operating profit."}
    - {name: "Bridge", contains: "Sum of segments, each signed line, the computed group profit, the reported figure and the residual."}
    - {name: "What the residual means", contains: "Zero, or the lines that could explain it and the source that would settle it."}
    - {name: "Workbook (optional)", contains: "An editable spreadsheet with inputs, the bridge formulas and a checks tab, if your AI can make files."}
    - {name: "MISSING and CHECKS MISSED", contains: "What you did not supply, and every check that failed or could not run."}
tweaks:
  - what: More than two segments
    how: Give every segment on its own line. The bridge adds as many segments and reconciling lines as the note shows.
  - what: Adjusted or reported profit
    how: Say which group measure to tie to. Segment measures often match an adjusted figure, not the statutory one.
  - what: Several periods
    how: Run each period on its own, with its own reported figure, so one period's gap does not hide another's.
  - what: Acceptance
    how: Profit eliminations and revenue eliminations are not confused, and the target measure, period and segment note use the same scope.
judge:
  - Profit eliminations and revenue eliminations are not confused.
  - Target measure, period and segment note use the same perimeter.
  - Trace dates, currency, scale, accounting perimeter and source pages for every material input.
  - Keep the focused illustration separate from a complete investment conclusion; list unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save the company's segment definitions once, so each new year only changes the figures."
  - "Keep a note of each residual you found and which line later explained it."
works_best_with:
  tools:
    - name: Any good chat AI
      why: The bridge is a short list of signed lines, so the AI can show it in the chat.
    - name: A file-capable AI or a spreadsheet app
      why: Needed only if you want an editable workbook with a checks tab.
    - name: Node.js 20 or later (optional)
      why: Runs the bundled script that repeats the sums, as a second check.
  inputs:
    - The segment note and the income statement from the same annual report
    - The company's definition of each segment measure
terms:
  - term: Segment
    meaning: A part of a company that reports its own profit, such as a division or a region.
  - term: Intersegment elimination
    meaning: A line that removes profit made on sales between segments, so it is not counted twice at group level.
  - term: Corporate costs
    meaning: Head office costs that are not given to any segment.
  - term: Residual
    meaning: What is left when reported profit minus computed profit is not zero.
  - term: EBITDA and operating profit
    meaning: EBITDA is profit before interest, tax, depreciation and amortization. Operating profit is after depreciation and amortization.
