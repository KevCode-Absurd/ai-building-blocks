how_it_works:
  - title: Step 1
    text: Save the prediction before the outcome is known.
  - title: Step 2
    text: Match the correct outcome window.
  - title: Step 3
    text: Grade with deterministic math where possible.
  - title: Step 4
    text: Use explanation text only after scoring.
  - title: Step 5
    text: Separate wrong diagnosis from wrong action.
  - title: Step 6
    text: Propose lessons and record review maturity without silently changing production rules.
