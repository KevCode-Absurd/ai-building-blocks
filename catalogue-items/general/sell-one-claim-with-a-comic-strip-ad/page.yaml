new_slug: sell-one-claim-with-a-comic-strip-ad
name: "Sell one claim with a comic strip ad"
summary: "A four-cell comic strip image ad around one claim, ending on a photo of your real product."
job: make-image-ads

headline: "Sell one claim with a comic strip ad"
subhead: Give it your selling idea, product facts and photos. It draws three flat comic panels around one claim with a simple hero and your product, adds a photo panel of the real pack, and hands back the layout, the words, an image prompt and the feed copy.

explain: |
  A comic strip makes people read on, because the eye wants to know what happens in the next panel. Most comic image ads waste that. Nine tiny panels, speech balloons on every one, a drawn "customer" praising the product, and a label the image tool turned into scribble.

  This skill builds the strip from four movements: the buyer's moment getting worse, the product turning it, the same place changed, then a photo panel of your real product. The hero is drawn simple so viewers see themselves in them. The product is drawn from its photo with no letters and kept the brightest thing in its panel, and the real photo closes the strip so the label stays exact. The words pass image-ad rules: a headline of 7 words or fewer, at most three other things to read, and type big and clear enough for a phone.

when:
  - Your product fixes an everyday problem you can show in three drawn panels.
  - You want an image ad that people read panel by panel instead of scrolling past.
  - You made the comic video and want a still in the same look.

you_give:
  - Your selling idea, or the one claim to act out
  - Your product facts, how it's used, and how it works
  - Your approved claims, banned claims and current offer
  - Your colours and lettering typeface
  - Product photos with a sharp label (optional at first, needed before you make the image)
you_get:
  - The one claim, a hero line, an ink line and a palette
  - What each of the four cells shows, with the layout and a zone map
  - The words on the image, checked for size and contrast, and an image prompt
  - Feed copy with a first line, headline and button

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, approved claims, offer and colours underneath.
  - Say who the buyer is and the moment the problem bites, in a sentence.
  - Make the three drawn panels from the prompt, then place your real product photo in the fourth cell and set the words in a design tool.
  - Cover the words and look at the drawings. If you can't tell what changed, ask for a clearer turn panel.

how_it_works:
  - title: Checks a comic fits
    text: Suits a short problem story or a drawable look inside your product. It says so if your ad needs a real face or long terms.
  - title: Picks one claim
    text: Every panel builds toward it. A second claim becomes a second ad.
  - title: Fits four movements in four cells
    text: The moment getting worse, the product turning it, the same place changed, then a photo panel of your real product.
  - title: Keeps the hero simple
    text: A few clear features in one line. The product is drawn from your photo with no letters and is the brightest thing in its panel.
  - title: Lays out and checks words
    text: A 2 by 2 grid in 4:5 or 1:1, a headline of 7 words or fewer, at most three other things to read, 30 px type and 4.5:1 contrast.
  - title: Writes the prompt and copy
    text: Flat ink panels with no words in the image, an empty frame for the photo panel, and feed copy that carries the claim.

output_shape: |
  FIT       <why a comic suits this, or what to use instead>
  CLAIM     <the one claim, and its source>
  HERO      <simple features, one line>
  INK       <line, fills, shadow, dots, palette, border>

  CELLS     1 set and grow: <who, where, one large thing>
            2 turn: <...>   3 land: <...>
            4 photo panel: <real product photo, placed in editing>
  LAYOUT    <4:5 or 1:1>, 2 x 2 grid, zone map in %
  WORDS     Headline: "<7 words or fewer>" <size, colour, contrast>
            Other: "<up to 3 items>"
  IMAGE PROMPT  <three drawn panels, no words, cell 4 left empty>
  FEED COPY <first line, primary text, headline, button>
  NOTES     <buyer words used, claims left out, MISSING>

example:
  business: sprout
  input: |
    [the skill]

    Idea: quitting greens powder because the routine is a chore.
    Buyer: 28 to 45, office job, has quit powders. Their words: "I've
    been choking on [a big-name greens powder] for the last few years",
    "not having to clean a shaker bottle".
    Product: Sprout daily greens gummies. One daily pack, torn straight
    across the top, gummies tipped into a palm. Pouch: glossy deep
    green, big yellow wordmark, yellow bear face top right.
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
    in 1 pack. Visible result: none.
    Offer: $29.99 first order with text sign-up, renews at $49.99 every
    4 weeks.
    Colours: cream #FFF7DF, deep forest #002C17. Type: Work Sans bold.
    Photos: [pouch front] [daily pack in a hand]
  output: |
    FIT       A routine problem told in three steps. A comic fits.
              Nothing visible, so panel 3 shows an easier morning.
    CLAIM     "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
              in 1 pack (label).
    HERO      an adult woman, round simple face, dark ponytail, navy
              blazer over a white top, small gold hoop earrings.
    INK       bold even black line, flat fills, one shadow tone, light
              halftone dots; black, cream, sky blue, warm grey, and the
              pack's deep green, which only the product wears; thin
              black border, cream gutter.

    CELLS     1 set and grow: the hero at the counter, a glass of green
                sludge raised, the shaker waiting in the sink behind
                her, one sweat drop by her eye.
              2 turn: close on her hands tearing a small deep-green
                sachet straight across the top, bears tipping into her
                palm.
              3 land: the same counter, clear, the sink empty; she eats
                from her palm, keys in her other hand.
              4 photo panel: the real pouch photo, front on, in the
                same border.
    LAYOUT    4:5, 1080 x 1350. Headline band 0-14%; grid 16-100%, each
              cell about 520 x 560 px.
    WORDS     Headline: "Your greens, in one torn pack." Work Sans bold
              72 px, deep forest on cream, 14.3:1.
              Other: cell 1 caption "CHOKING ON POWDER AGAIN"; cell 2
              caption "60+ INGREDIENTS. 6G FIBER." Both Work Sans bold
              36 px, deep forest on cream boxes, 14.3:1. Cell 3 is
              wordless. 2 other things to read.
    IMAGE PROMPT  Three flat ink comic panels in a 2 x 2 grid, 4:5,
      thin black borders, cream gutters, bold even black outlines, flat
      fills, one shadow tone, light halftone dots. Top left: an adult
      woman with a round simple face, dark ponytail, navy blazer over a
      white top, small gold hoops, at a kitchen counter raising a glass
      of green sludge, a shaker in the sink behind, one sweat drop.
      Top right: close on her hands tearing a small flat deep-green
      sachet across its top, small deep-green gummy bears tipping into
      her palm; the sachet's shape and colour from the attached photo,
      no letters. Bottom left: the same counter, clear, she eats from
      her palm. Bottom right: an empty bordered cell. Palette black,
      cream, sky blue, warm grey; only the sachet is deep green. No
      words, letters or numbers anywhere.
    FEED COPY First line: Tear one pack and tip the gummies into your
              hand. The shaker can stay in the cupboard.
              Primary text: 60+ ingredients, 21 vitamins & minerals and
              6g fiber in one pack. $29.99 first order with text
              sign-up. Renews at $49.99 every 4 weeks.
              Headline: Rip. Tip. Enjoy. (16 characters)
              Button: Shop now
    NOTES     Caption 1 uses the buyer's word "choking" (review 4). "21
              vitamins & minerals" stays in the feed text, since cutting
              it to fit a caption would change the fact. MISSING: a
              photo of a single daily pack, so the drawn sachet matches.

tweaks:
  - what: Four drawn panels
    how: Ask for set and grow as two panels and the photo panel goes small under the grid. It still keeps three other things to read at most.
  - what: The turn
    how: Ask for a cutaway in panel 2 if buyers doubt what's inside. Leave it out if the point is the routine, not the contents.
  - what: The size
    how: Ask for 1:1 as well. The grid fills the square and the headline moves into the photo panel's border.
  - what: The palette
    how: Give your brand colours. The comic keeps black plus 3 or 4 flat colours, and your product stays the brightest thing.

judge:
  - Cover the words. You can still tell what was wrong and what changed.
  - Only one claim appears anywhere, including any cutaway.
  - The headline is 7 words or fewer, with at most 3 other things to read, each at 30 px or more and 4.5:1 contrast.
  - The drawn product has no letters, and the strip ends on your real product photo.
  - No drawn person says the product worked for them, and none is an expert or a child.

test:
  - Show the finished strip on a phone for two seconds and ask what the product does. If they can't say, the turn panel is doing too little.
  - Give it two claims at once. It should pick one and tell you the second is a second ad.
  - Run it twice on the same input. The hero line and the word counts should hold both times.
  - Check the drawn sachet against your real pack photo. Shape and colours should match, with no letters.

improve:
  - Paste buyer phrases from your reviews into "What you need" in the skill file, so captions use their words.
  - Write your hero line and ink line into steps 4 and 5, so your strips and comic videos look like one family.
  - Add how your product works, with a source, to your brand file. Without it, the cutaway is dropped.
  - Pair it with "Tell your buyer's story in comic panels that sell" when you want the video version too.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Follows a panel grid well and takes your product photo as a reference for the drawn pack."}
    - {name: "GPT Image", why: "Follows a detailed panel layout closely and lets you fix one panel without redrawing the rest."}
    - {name: "Canva", why: "Sets captions as real text and places your product photo in the fourth cell, so no lettering is left to the AI."}
  inputs:
    - "Five to ten buyer phrases from reviews about the old routine, so the captions sound like them"
    - "A photo of the product out of its pack and in a hand, so the drawn product matches its real size"
    - "Your never-show list, so no panel draws something your brand avoids"

terms:
  - term: Gutter
    meaning: The gap between comic panels, where the reader fills in what happened.
  - term: Photo panel
    meaning: Your real product photo framed like a comic panel, placed in a design tool.
  - term: Cutaway
    meaning: A drawing of something with part removed, so you can see inside.
  - term: Contrast
    meaning: How much the words stand out from what's behind them. 4.5:1 is the usual floor for easy reading.
