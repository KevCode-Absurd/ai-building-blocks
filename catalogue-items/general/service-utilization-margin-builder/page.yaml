new_slug: service-utilization-margin-builder
name: Service utilization margin builder
headline: Service utilization margin builder
summary: "Turn a month of paid hours into utilization, revenue and delivery margin for a service team, so you see what each billable hour really earns."
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: "Give it one month: paid hours, hours spent on fixed duties and leave, billable client hours, the fee you actually earned per billable hour, loaded labor cost and direct project costs. It splits paid time into available and billable hours, then works out revenue, cost and margin. You get a short bridge, and a stop message if the hours cannot be right."
explain: |-
  A service business sells time, and not every paid hour can be sold. Some go to leave, internal meetings and admin. This service utilization calculator separates paid hours from the hours you could bill, then shows how many of those you did bill. That share is your utilization.

  Then it turns hours into money. It multiplies billable hours by the fee you actually earned per hour, not the rate on your price list. It takes off what delivery cost: the full labor cost of the paid hours, plus project costs paid in cash. What is left is contribution. Contribution as a share of revenue is the delivery margin.

  Labor paid during leave or fixed duties stays in the cost once. The skill never takes it out twice. If leave and fixed duties use up every paid hour, or billable hours are more than the hours available, it stops and tells you. It will not show a ratio that cannot be true.
when:
  - "You run an agency, consultancy or studio and want to see what a month of staff time really earned."
  - "Utilization looks healthy but profit does not, and you want to see where the hours and money go."
  - "You are setting a target utilization or an hourly fee and want real numbers beside the target."
  - "You want to compare one team's month with another's, using the same sums."
not_for:
  - "You have no time records. Without billable hours there is no utilization to work out. Track hours for a month first."
  - "You sell products, not time: use the Product margin checker or the Per-order profit calculator."
  - "You want to choose which products or jobs use limited capacity best: use the Product mix capacity checker."
  - "You want to judge how well a person works. Utilization does not measure performance."
  - "You want company profit after overhead, financing and tax. This stops at contribution."
you_give:
  - "Paid hours for the month for one person or team, from payroll or your time tool"
  - "Hours spent on fixed duties, such as admin, training and internal meetings"
  - "Leave hours, such as holiday and sick leave"
  - "Billable client hours worked, from your time records"
  - "The fee you actually earned per billable hour, from invoices. It can differ from your rate card"
  - "Loaded labor cost for all the paid hours: pay plus benefits and payroll costs"
  - "Direct project cash costs, such as freelancers, software or travel charged to the job"
you_get:
  - "Available client hours: paid hours less fixed duties and leave"
  - "Utilization: billable hours divided by available hours"
  - "Revenue: billable hours times the fee earned per hour"
  - "Delivery cost, contribution and contribution margin, with the sums shown"
  - "A stop message if the hours cannot be right, and a list of figures still missing"
how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or paste it in as your first message. Add it to your AI if you want to reuse it."
  - "Paste one month of figures for one person, team or client group. Use the same month for every figure and say the currency."
  - "Check the hours first. Paid hours less fixed duties and leave must leave time to sell, and billable hours must fit inside it."
  - "Use the fee you earned, not the rate card. If you only have the rate card, the AI shows revenue at that rate and labels it a rate-card estimate."
  - "Read the bridge, then ask what changes if billable hours or the fee change. Each answer reuses the same sums."
how_it_works:
  - title: 1. Fixes the period and sources
    text: Writes the month, the currency and where each figure came from. A figure from a different month waits.
  - title: 2. Splits paid hours
    text: Takes leave and fixed duties off paid hours. What is left is the pool of client hours that could be billed.
  - title: 3. Matches billable hours to the pool
    text: Divides billable hours by that pool for utilization, then multiplies them by the fee you earned. Unbilled work is kept in its own line.
  - title: 4. Takes off delivery cost
    text: Subtracts loaded labor and direct project cash, then shows contribution and margin. Billable hours above the pool are flagged.
output_shape: |-
  PERIOD AND SOURCES
  <month> | <currency> | <where each figure came from>

  HOURS
  Paid: <hours> | Fixed duties: <hours> | Leave: <hours> | Available: <hours> | Billable: <hours> | Utilization: <percent>

  MONEY
  Revenue: <billable hours> x <fee per hour> = <amount>
  Loaded labor: <amount> | Direct project cash: <amount> | Delivery cost: <amount>
  Contribution: <revenue> - <delivery cost> = <amount>
  Contribution margin: <contribution> / <revenue> = <percent>

  STOP FLAGS
  <hours that cannot be right, or none>

  MISSING
  <figures not supplied>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - "One month of paid hours, fixed duty hours and leave hours for a person or team"
    - "Billable client hours and the fee you actually earned per billable hour"
    - "Loaded labor cost and direct project cash costs for the same month"
  prerequisites:
    - "Payroll or time-tool records, and your invoices for the month"
    - "An AI that can make files, only if you want a spreadsheet (optional)"
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - {name: "Period and sources", contains: "The month, the currency and where each figure came from."}
    - {name: "Hours", contains: "Paid, fixed duty, leave, available and billable hours, and the utilization share."}
    - {name: "Money", contains: "Revenue, loaded labor, direct project cash, delivery cost, contribution and margin, each with its working."}
    - {name: "Stop flags", contains: "A warning if leave and duties use all paid hours, or billable hours exceed what was available."}
    - {name: "Workbook (optional)", contains: "An editable spreadsheet with inputs, formulas and a checks tab, if your AI can make files."}
    - {name: "MISSING and CHECKS MISSED", contains: "What you did not supply, and every check that failed or could not run."}
tweaks:
  - what: Period and currency
    how: Use the same month, currency and scale for hours and money. Do not mix a payroll month with an invoice month.
  - what: Fee per hour
    how: Use fees earned from invoices. A rate-card fee shows what could have been billed, not what was.
  - what: Unbilled work
    how: Add hours worked but not billed as their own number, so they do not hide inside utilization.
  - what: Acceptance
    how: Each input has a source, currency, scale, sign and period, and labor paid during leave is counted once.
judge:
  - Each material input is sourced with currency, scale, sign and period.
  - Actual records and scenarios remain separate; missing evidence is not zero.
  - Available client hours and billed revenue must be positive for the displayed ratios; zero-activity periods require a separate amount-only view.
  - Labor paid during leave or fixed duties remains in loaded labor cost and is not deducted a second time.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save your usual fixed duty and leave hours once, so each month only changes billable hours, fees and costs."
  - "Keep each month's result so you can see utilization and margin move over time."
works_best_with:
  tools:
    - name: Any good chat AI
      why: The sums are short, so the AI can show them line by line in the chat.
    - name: A file-capable AI or a spreadsheet app
      why: Needed only if you want an editable workbook with a checks tab.
    - name: Node.js 20 or later (optional)
      why: Runs the bundled script that repeats the sums, as a second check.
  inputs:
    - A time export for the month from your time tool
    - Invoices or revenue records for the same month
    - Payroll cost for the people included
terms:
  - term: Utilization
    meaning: The share of available client hours that were billed to clients.
  - term: Fixed duties
    meaning: Paid hours that cannot be sold, such as admin, training and internal meetings.
  - term: Loaded labor cost
    meaning: Pay plus the extra costs of employing someone, such as benefits and payroll taxes.
  - term: Contribution
    meaning: Revenue less the direct costs of delivering the work. Overhead is not included.
  - term: Contribution margin
    meaning: Contribution as a share of revenue.
