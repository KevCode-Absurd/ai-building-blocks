new_slug: set-up-redis-bullmq-job-queue-builder-prompt
name: Redis + BullMQ Job Queue coding prompt
summary: "Get a coding brief for a Redis and BullMQ job queue: connection, queue, worker and a test script, with steps to run it and check it works."
job: build-software
headline: Redis + BullMQ Job Queue coding prompt
subhead: Get a coding brief for a Redis and BullMQ job queue, with scoped jobs, retries and failed-job handling.
explain: |-
  Some work should not run while a visitor waits: sending emails, running reports, calling an AI. A job queue holds that work and runs it in the background, with retries when a job fails.

  This prompt builds the smallest working queue with Redis and BullMQ. It writes a shared connection, a queue, a worker that logs each job, and a test script that sends three test jobs. It explains priority, retries and concurrency in plain words.
when:
  - You are building an app that needs background work, such as agent tasks or emails.
  - You want a first queue that you can test in a few minutes.
  - You are new to coding and want each part explained simply.
not_for:
  - "You need a production queue with strict TLS checks: set up certificate checks first, or use a managed queue service."
  - "You only need one task to run later or on a timer: use a simple scheduled job from your host instead."
  - "You do not have a code project or a Redis server yet: set up the project and Redis first, then come back."
you_give:
  - Your code project, open in Claude Code
  - A running Redis server and its REDIS_URL, saved in .env.local
you_get:
  - A connection file, a queue file, a worker file and a test script
  - A plain explanation of priority, retries and concurrency
  - A test run that shows three jobs completed. The agent names and account ID in the test are placeholders to swap for real ones.
how_to_use:
  - Open your code project in an AI that can edit files, such as Claude Code.
  - Make sure Redis is running and REDIS_URL is in your .env.local file.
  - Paste the prompt from the download and ask the AI to list anything missing before it writes code.
  - Run the test script with npx tsx scripts/test-queue.ts and check that all three jobs log as completed.
  - The prompt keeps certificate checks on for rediss:// links. If your Redis server uses a self-signed certificate, tell the AI, and it turns the checks off for testing only. Turn them back on before real use.
  - Once the three test jobs complete, ask the AI to replace the logging in the worker with your real job code.
output_sample:
  input:
    - Your code project, opened in a coding AI such as Claude Code
    - Your Redis link in a .env.local file (REDIS_URL)
    - Which jobs the queue should run (optional)
  prerequisites:
    - An AI that can read and edit files in your project
    - A running Redis server, either local or a cloud one such as Upstash
    - Permission to install the bullmq and ioredis packages
  output:
    - name: lib/queue/connection.ts
      contains: One shared Redis connection that reads REDIS_URL, stops with a clear error if it is missing, and handles cloud links.
    - name: lib/queue/agent-queue.ts
      contains: A queue named agent-jobs and an enqueueJob function that adds a job with a priority and returns its ID.
    - name: lib/queue/worker.ts
      contains: A worker that runs three jobs at once, logs each job, and logs when a job completes or fails.
    - name: scripts/test-queue.ts
      contains: A script that adds three test jobs, waits five seconds, then prints Done.
    - name: Plain explanation
      contains: Short notes on why to use a queue, what priority means, how retries work and what concurrency means.
how_it_works:
  - title: Check what you have
    text: Your coding AI looks for your project and REDIS_URL, and lists anything missing before it writes code.
  - title: Install the packages
    text: It asks before it installs bullmq and ioredis.
  - title: Write the queue files
    text: A shared connection, a queue called agent-jobs, a worker that handles 3 jobs at a time, and a test script.
  - title: Test and explain
    text: You run the test script and check that all three jobs log as completed. The AI explains the parts in plain words.
