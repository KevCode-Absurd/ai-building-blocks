new_slug: shared-service-activity-cost-allocator
name: Shared service activity cost allocator
headline: Shared service activity cost allocator
summary: "Split a shared service cost across departments by how much each one used, with the cost of unused capacity shown on its own line."
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: "Give it one period's shared service cost, its normal capacity, each department's counted use and your allocation policy. It works out a rate per unit of activity, charges each department for what it used and shows what is left over. You get the rate, each department's charge and the cost of unused capacity."
explain: |-
  Shared services such as IT, HR or facilities cost money that no single department owns. A common fix is to split the cost evenly or by headcount. That charges departments for things they never asked for. This shared service cost allocation uses an activity driver instead: tickets handled, hours used or transactions processed.

  The rate is the cost pool divided by normal capacity, not by actual use. Departments pay for what they used at the normal rate. The cost of idle capacity shows on its own line and is not pushed onto departments. That way one busy or quiet month does not distort every team's charge.

  Every count must use the same unit and the same period as the cost pool. The skill refuses to mix, say, tickets and hours in one rate. If use goes above capacity, it shows unused capacity as a negative number and flags an overload to look at.
when:
  - "A shared team such as IT, HR or facilities costs money, and departments ask why they pay what they pay."
  - "You want to charge departments for what they use instead of by headcount."
  - "You need to see how much of a shared cost is idle capacity."
  - "You are changing an allocation policy and want to see the effect on each department."
not_for:
  - "You need a transfer price or a statutory costing rule. This is a management view, not an accounting policy. Ask your accountant."
  - "You want to prove that cutting a department would save the cost. An allocation does not show savings you could actually make."
  - "You want margin on billable staff time: use the Service utilization margin builder."
  - "You want to choose which products use limited capacity best: use the Product mix capacity checker."
you_give:
  - "The shared service's total cost for one period, from your ledger"
  - "Normal capacity in activity units, such as tickets or hours per month"
  - "Each department's actual units used in the same period, from your system's counts"
  - "Your approved allocation policy, if you have one (optional)"
  - "The currency and the period, such as USD for March"
you_get:
  - "The rate per activity unit"
  - "Each department's charge: units used times the rate"
  - "The unassigned cost: the pool less all charges, which is the cost of unused capacity"
  - "Unused units, and a flag if use is above capacity"
  - "A list of missing figures and checks that could not run"
how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or paste it in as your first message. Add it to your AI if you want to reuse it."
  - "Paste the cost pool, the normal capacity and each department's counts. Say the unit and the period for each."
  - "Check that every count uses the same unit. The AI stops if tickets and hours are mixed in one rate."
  - "Read the rate, each department's charge and the unassigned line. Ask your finance lead if the idle cost should stay unassigned or be shared by policy."
  - "To test a policy change, give the new capacity or counts and ask for a rerun."
how_it_works:
  - title: 1. Fixes the pool
    text: Writes the period, the currency and what the cost pool holds. One period and one pool at a time.
  - title: 2. Picks one driver
    text: Uses one activity unit for normal capacity and for every department's count. It does not mix units.
  - title: 3. Works out the rate
    text: Divides the pool by normal capacity. Then multiplies each department's units by that rate.
  - title: 4. Shows what is left
    text: The pool less all charges is the unassigned cost. Capacity less units used is the unused units. Idle cost is not forced onto departments.
  - title: 5. Reconciles
    text: Charges plus unassigned cost must equal the pool, and the result is checked line by line.
output_shape: |-
  POOL AND PERIOD
  <period> | <currency> | Pool: <amount> | Driver: <unit> | Normal capacity: <units>

  RATE
  <pool> / <normal capacity> = <rate> per <unit>

  ALLOCATION
  <department> | Units used: <units> | Charge: <units> x <rate> = <amount>
  <department> | Units used: <units> | Charge: <units> x <rate> = <amount>
  Allocated total: <amount>

  UNUSED CAPACITY
  Unassigned cost: <pool> - <allocated total> = <amount>
  Unused units: <capacity> - <units used> = <units>

  FLAGS
  <use above capacity, mixed units or none>

  MISSING
  <figures not supplied>

  CHECKS MISSED
  <one line per check still missed, or none>
output_sample:
  input:
    - "One period's total cost for the shared service"
    - "Normal capacity in one activity unit, such as tickets or hours"
    - "Each department's units used in the same period"
  prerequisites:
    - "Counts from your ticket, time or transaction system, and the cost from your ledger"
    - "Your allocation policy, if one exists (optional)"
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - {name: "Pool and period", contains: "The period, currency, cost pool, driver unit and normal capacity."}
    - {name: "Rate", contains: "The cost per unit of activity, with the sum shown."}
    - {name: "Allocation", contains: "Each department's units, rate and charge, and the allocated total."}
    - {name: "Unused capacity", contains: "The unassigned cost, the unused units and a flag if use is above capacity."}
    - {name: "Workbook (optional)", contains: "An editable spreadsheet with inputs, formulas and a checks tab, if your AI can make files."}
    - {name: "MISSING and CHECKS MISSED", contains: "What you did not supply, and every check that failed or could not run."}
tweaks:
  - what: Number of departments
    how: Give every department its own line. The method adds as many as you have.
  - what: Normal capacity
    how: Say how you set it, such as the usual monthly volume or what the team can handle. A different base changes the rate.
  - what: Policy for idle cost
    how: Ask for a second view that shares idle cost by your policy. It is labeled as a policy choice, and the first view stays.
  - what: Acceptance
    how: Charges plus unassigned cost equal the pool, and every count uses the same unit and period.
judge:
  - Each material input is sourced with currency, scale, sign and period.
  - Actual records and scenarios remain separate; missing evidence is not zero.
  - Capacity is positive, and every driver count uses the same activity unit and reporting period.
  - Allocated departmental cost plus signed unassigned cost equals the pool; negative unused capacity is an overload exception.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save your driver unit, normal capacity and policy once, so each period only changes the cost and counts."
  - "Keep each period's unassigned cost so you can see idle capacity grow or shrink."
works_best_with:
  tools:
    - name: Any good chat AI
      why: The sums are short, so the AI can show them line by line in the chat.
    - name: A file-capable AI or a spreadsheet app
      why: Needed only if you want an editable workbook with a checks tab.
    - name: Node.js 20 or later (optional)
      why: Runs the bundled script that repeats the sums, as a second check.
  inputs:
    - The cost report for the shared service for the period
    - Counts from the system that records the activity
    - Your written allocation policy, if you have one
terms:
  - term: Shared service
    meaning: A team that serves many departments, such as IT, HR or facilities.
  - term: Cost pool
    meaning: The total cost of the shared service for one period, before it is split.
  - term: Activity driver
    meaning: The unit that causes the cost, such as a ticket, an hour or a transaction.
  - term: Normal capacity
    meaning: The amount of activity the shared service is set up to handle in a normal period.
  - term: Unassigned cost
    meaning: The part of the pool left over after departments are charged for what they used. It is the cost of unused capacity.
