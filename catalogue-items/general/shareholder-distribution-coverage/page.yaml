new_slug: shareholder-distribution-coverage
name: Shareholder distribution coverage
headline: Shareholder distribution coverage
summary: Check if dividends and net buybacks fit within equity free cash flow. You get a bridge showing the funding surplus or shortfall.
job: money-and-investing
thinking: high
thinking_why: "Only executed buybacks count and the cash flow measure must match the owners paid, so each line needs its source."
subhead: A distribution-to-equity-cash-flow bridge with the funding surplus or shortfall. Share cash dividends, actual repurchases, equity issuance proceeds and a sourced free-cash-flow-to-equity schedule for matching periods.
explain: |-
  A distribution-to-equity-cash-flow bridge with the funding surplus or shortfall.

  Public equity and share counts. Illustrative figures. $40 dividends + $100 repurchases - $10 issuance = $130 distributions, exceeding $120 FCFE by $10. Reducing repurchases to $70 leaves $20 after $100 distributions.
when:
  - You need a distribution-to-equity-cash-flow bridge with the funding surplus or shortfall.
  - You work on public equity and share counts and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You want to know if a dividend is sustainable or whether to buy or sell: ask a licensed financial adviser, as this tool only checks one period."
  - "You need coverage based on FCFF or EBITDA: build that in your own spreadsheet, as this tool uses equity free cash flow only."
  - "You only have announced buybacks that have not been carried out: wait for the cash-flow statement, as only executed repurchases count."
  - "You need EPS before and after a cash-funded buyback: use the Cash-funded buyback EPS bridge instead."
you_give:
  - Cash dividends, actual repurchases, equity issuance proceeds and a sourced free-cash-flow-to-equity schedule for matching periods.
  - "The fiscal period, plus the currency and scale used for the distribution coverage."
  - "Your spreadsheet tool, if you want the distribution coverage as a workbook."
you_get:
  - A distribution-to-equity-cash-flow bridge with the funding surplus or shortfall.
  - "An editable workbook of the distribution coverage, with its inputs, formulas and test cases to rerun."
  - "A tie-out of distributions, issuance and equity cash flow, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the cash flow statement and an equity free cash flow schedule."
  - "Tell it what you need: dividends plus net buybacks against equity free cash flow, with the surplus or shortfall."
  - "Ask it to stop and mark MISSING if the dividend, buyback or issuance figure is not in your sources."
  - "Check that equity free cash flow is not confused with firm free cash flow or EBITDA, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Cash dividends for each period
    - Executed share repurchases for each period
    - Equity issuance proceeds for each period
    - Your free-cash-flow-to-equity schedule, with sources
    - Currency, scale and fiscal calendar
  prerequisites:
    - An AI that can create and read spreadsheet files, for the workbook
    - Node.js 20 or later, to run the bundled calculation (optional)
  output:
    - name: Distribution bridge
      contains: Dividends plus net repurchases compared with equity free cash flow, showing the surplus or shortfall.
    - name: Scope and dated sources
      contains: The periods, currency, scale and the source page for each input.
    - name: Inputs and assumptions
      contains: Every input and assumption, kept apart from reported facts.
    - name: Model calculations and reconciliations
      contains: The formulas, plus debt movement and cash balance reconciliations.
    - name: Actual file verification
      contains: The checks that ran on the workbook, such as recalculation and reopening the saved file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs not supplied and any checks that failed or could not run.
how_it_works:
  - title: 1. Identify distributions and equity issuance separately in the cash-flow statement; exclude announced but unexecuted buybacks
    text: Identify distributions and equity issuance separately in the cash-flow statement; exclude announced but unexecuted buybacks.
  - title: 2. Net issuance cash against executed repurchases, add ordinary cash dividends and compare with independently defined equity free cash flow
    text: Net issuance cash against executed repurchases, add ordinary cash dividends and compare with independently defined equity free cash flow.
  - title: 3. Show cash retained or external funding required; reconcile debt movements and cash-balance changes before interpreting the shortfall
    text: Show cash retained or external funding required; reconcile debt movements and cash-balance changes before interpreting the shortfall.
output_shape: |-
  A distribution-to-equity-cash-flow bridge with the funding surplus or shortfall.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Fiscal period"
    how: "Take the fiscal period from the cash flow statement and an equity free cash flow schedule. Use one currency and scale on every line."
  - what: "Free cash flow definition"
    how: "Change the free cash flow definition and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: FCFE definition and debt cash flows are disclosed and not confused with FCFF or EBITDA.
judge:
  - FCFE definition and debt cash flows are disclosed and not confused with FCFF or EBITDA.
  - Gross buybacks and issuance proceeds remain visible behind the net figure.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one distribution coverage you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define equity free cash flow into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
