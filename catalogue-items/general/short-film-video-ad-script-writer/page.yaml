new_slug: short-film-video-ad-script-writer
name: "Short film video ad script writer"
summary: "Paste your idea and brand file. Get a twist short-film script, timed shot table and cast note."
job: make-video-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Short film video ad script writer"
subhead: Give it your selling idea and brand file. It writes a short live-action-style story where your product causes the twist, with a detail planted early that the ending pays off. You get a timed shot table, notes for the edit and a cast note.

explain: |
  Film-style ads (a photo-real scene with actors, like a short film) can carry a feeling or a small joke better than any list of features. They usually go wrong in the writing. The product turns up as a logo card after the story ends, a character "reviews" it, or the shots look lovely and nothing happens.

  This skill starts with one line: the setup, but a snag, therefore what the product changes. If a beat only follows with "and then", it gets rewritten. It picks one detail to show early, often the product or the thing your buyer used before, and pays it off at the end, so the twist feels earned and your brand is on screen from the start. One or two made-up adults can doubt, react or hand something over, but never claim a result. Each shot has one event and at most one camera move, and the story reads even with the sound off.

when:
  - You want a story-led video ad with people, without filming real customers.
  - You have a headline or idea with a small story in it, such as a mix-up, a kindness or a callback.
  - Your current video ads end with the product tacked on after the story.

you_give:
  - Your selling idea, a headline or an existing script
  - Your brand file, with the buyer's moment, how the product is used and your approved claims
  - The total length, your video tool's clip length and your sound choices (optional)
you_get:
  - A one-line turn and a one-line plant and payoff
  - A cast list, each person described once
  - A timed shot table with event, camera, move, line and sound, clip joins marked
  - Notes on what was inferred, how the clips split and the text to add in editing
  - A cast note on who carries the ad and how each person sounds, ready for the clips skill
  - Any of its own checks the script couldn't pass, named one per line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your selling idea and your brand file.
  - Give the total and your tool's clip length, for example "20 seconds, 10-second clips".
  - Check the turn line. If the product isn't in the "therefore", ask for another version.
  - Take the script and cast note to "Short film video clip prompt writer". It takes it from there, with the avatars, sheets, storyboard and clips.

how_it_works:
  - title: Checks the fit
    text: Confirms the idea is a feeling or a small story, not proof that needs a real person.
  - title: Writes the turn line
    text: The setup, but a snag, therefore what the product changes. Weak "and then" links get rewritten.
  - title: Plants a detail
    text: Shows one thing early, often the product, that the ending gives a new meaning.
  - title: Opens on a question
    text: Starts mid-action, so the first seconds make people ask what's going on.
  - title: Writes each shot
    text: One event, at most one camera move, where people look, and feelings written as things you can see.
  - title: Fits your tool
    text: Groups shots into clips of your tool's real length and checks the story reads with the sound off.
  - title: Writes the cast note
    text: Who carries the ad, why that suits your buyer, each voice in plain words, and what must never change.

output_shape: |
  TURN  <setup> and <what's going on>, but <snag>, therefore
        <what the product changes>.
  PLANT  <what's shown early>  PAYOFF  <how the ending explains it>

  CAST
  Character A: <who, clothes, accessory>
  Character B: <...>

  Shot | length | event | cast and camera | move | line | sound
  1    | <s> | <one event> | <who, size, angle> | <one move> |
       Character A: "<line>" | <sound>
  <one row per shot, clip joins marked>

  NOTES
  - Inferred: <...>  Clips: <...>  Text in editing: <...>

  CAST NOTE  <who carries it, why, voices, what never changes>

  CHECKS MISSED  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Idea: the brand's live story headline "He Asked What Day It Was.
    I Handed Him a Gummy." (sprout/ads.md)
    Product: Sprout daily packs. Tear one straight across the top,
    tip the small deep-green gummies into a palm, eat. Pouch: glossy
    deep green, big yellow "Sprout" wordmark, "28 Daily Packs".
    The old way (brand file): a half-used tub of powder and a shaker.
    Brand line: "Rip. Tip. Enjoy."
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g fiber".
    Settings: 20 seconds, 10-second clips, voices and room sound,
    no music.
  output: |
    TURN  A half-asleep man asks what day it is and his partner barely
          looks up, but her answer is a torn daily pack, therefore the
          day stops mattering, because the pack is the same every day.
    PLANT  A half-used tub of powder at the back of the counter, and
           the pouch in the fruit bowl, front just showing.
    PAYOFF  The tub gets pushed further back; the pouch ends up front
            and centre.

    CAST
    Character A: a woman, about 40, short grey-streaked hair, navy
      jumper, reading glasses pushed up on her head.
    Character B: a man, about 40, rumpled dark hair, faded green
      T-shirt, one sock on.

    1  3 s   B shuffles into the kitchen mid-yawn.
             Wide, counter height. The tub sits at the back; the pouch
             peeks out of the fruit bowl. No move.
             Character B: "What day is it?"   Sound: fridge hum.
    2  2 s   A keeps her eyes on her mug.
             Single on A, medium. Slow push in, ends on her eyes.
             (no line)   Sound: a spoon against the mug.
    3  3 s   A tears a daily pack straight across the top.
             Close on her hands and the pack, label up. No move.
             Character A: "Pack day."   Sound: the tear.
    4  2 s   B takes the pack from her hand. Single on B, medium,
             his eyes on A. No move.   Sound: foil crinkle.
    ---- clip join (deliberate cut) ----
    5  2 s   B tips the gummies into his palm.
             Close on his hand. No move.
             Character B: "Same as yesterday?"   Sound: soft patter.
    6  2 s   B eats the gummies, eyes on A. Single on B, medium
             close. No move.   Sound: room tone.
    7  3 s   A finally looks up. Over B's shoulder onto A. No move.
             Character A: "Same as every day."
    8  3 s   B slides the tub further back, leaving the pouch in
             front, label to camera. Wide, slow pull back, ends with
             both in frame and the pouch centred.
             Narrator: "One pack a day. Rip. Tip. Enjoy."

    NOTES
    - Inferred: the couple and the kitchen come from the headline,
      not from the buyer profiles.
    - Sound off: the turn shows in shot 3, the pack handed over where
      an answer should be. Captions carry every line.
    - Nobody claims a result. B's look is curiosity, not proof.
    - Text in editing, over shot 8: "60+ ingredients. 21 vitamins &
      minerals. 6g fiber." Offer from current terms.
    - Clips: shots 1 to 4 make clip 1 (3+2+3+2 = 10 s), shots 5 to 8
      make clip 2 (2+2+3+3 = 10 s).

    CAST NOTE  B carries it: the doubter whose question sets up the
    joke, so the powder quitter watching sides with him. A answers
    with the pack and three words. A: low, calm, a little dry. B:
    sleepy, warm, slow. Narrator: friendly, unhurried. Never change:
    A's glasses on her head, B's one sock, both on their own side of
    the table.

    CHECKS MISSED  none

tweaks:
  - what: The kind of turn
    how: Ask for a different turn, such as a negotiation over something small, a quiet kindness or a visual mix-up. The turn line changes first.
  - what: The plant
    how: Name what to plant, such as the old shaker or a line said early. It must come back at the payoff.
  - what: One or two characters
    how: One character with a narrator suits a quiet story. Two suit a joke or a hand-over.
  - what: Sound
    how: Say "no dialogue" and it tells the story with looks and actions, with a narrator only at the end.

judge:
  - The turn line has "but" and "therefore", and the product is in the "therefore".
  - Something shown early returns at the end with a new meaning.
  - Every spoken line has a label (Character A, Character B, Narrator).
  - No character says the product worked for them.
  - Each shot has one event and at most one camera move.
  - The shot lengths add up to the total you asked for.

test:
  - Skip the product shots and read the rest. If the story still ends the same way, the product isn't causing the turn.
  - Find the plant in the first shots and its payoff at the end. If either is missing, ask again.
  - Watch the storyboard or first cut with the sound off. You should still see the turn.
  - Run it twice on the same idea. The turn can change. The product's role and the claims should not.

improve:
  - Add your brand's favourite kinds of turn, such as a running joke, to step 2 of the skill file.
  - Write your video tool's clip lengths and reference limits into step 11, so shots are planned to fit.
  - List objects from your buyer's old way in "What you need" (for Sprout, the powder tub and the shaker), so step 3 always has something to plant.
  - Pair it with a skill that turns a short film script into consistent clips, then one that adds captions in your brand font.

works_best_with:
  tools:
    - {name: "Claude", why: "Keeps shot lengths adding up to your total and every line labelled across a long shot table."}
    - {name: "Kling", why: "Makes clips up to 15 seconds with several shots and spoken lines, so a whole beat can be one clip."}
  inputs:
    - "Photos of the product from the front, side and top, so the payoff shot shows the real pack"
    - "Objects from your buyer's old way, such as the tub they gave up on, so the script has something to plant"
    - "A photo of the kind of room your buyer lives in, so the set is easy to picture and make"
    - "One or two short films or ads whose tone you like, so the turn lands in the right mood"

terms:
  - term: Turn
    meaning: The moment the story changes direction. Here, the product makes it happen.
  - term: Plant and payoff
    meaning: A detail shown early without comment that the ending gives a new meaning.
  - term: Eyeline
    meaning: Where a character is looking, kept steady so cuts between shots make sense.
