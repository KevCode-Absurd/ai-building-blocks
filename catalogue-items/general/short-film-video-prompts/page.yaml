terms:
  - term: Avatar card
    meaning: A short, fixed description of a person in the ad, from their look to their voice, approved before any image is made.
  - term: Floor plan
    meaning: A map of the room from above, showing where people, lights, props and cameras go.
  - term: The line
    meaning: An imaginary line between two characters. Keeping the camera on one side stops them seeming to swap places.
  - term: Establishing frame
    meaning: One wide picture of the whole scene that fixes the room, the light and where everything sits.
  - term: Prop log
    meaning: A running note of who holds what after each shot.
