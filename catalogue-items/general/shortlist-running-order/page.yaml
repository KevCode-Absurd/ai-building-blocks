new_slug: shortlist-running-order
name: "Shortlist and running-order planner"
summary: "Paste a long list of ideas, songs, headlines or slides. Get a cut shortlist and an order that reads as one flow."
job: think-and-decide
thinking: medium
thinking_why: "It ranks and orders items by judgment, but each step has a fixed rule."

headline: "Shortlist and running-order planner"
subhead: "Paste a long list of ideas, songs, headlines or slides, and say how many slots you have. It cuts to a shortlist with a reason for every cut, tests the weakest pick against the best leftover, and orders the set by contrast."

explain: |
  When you have thirty ideas and room for eight, it is tempting to keep your favourites and order them by when you thought of them. The result is a set where the weak items hide among the good ones and every item sounds like the one before it.

  This skill starts with far more candidates than slots, scores each on whether the core idea is strong on its own, and cuts to finalists. It then names the weakest finalist and tests it against the strongest unused candidate, whoever made it. It orders the finalists by contrast so the set holds attention, checks that it rewards a second look, and asks you to re-read it after a break. Every cut has a one-line reason.

when:
  - "You have a list of ad angles, headlines or talk topics and room for only a few."
  - "You are putting together a playlist, a deck, a newsletter or a product range."
  - "A team brought many ideas and you need to cut fairly."

you_give:
  - "The full list of candidates, as long as you have it"
  - "How many slots there are"
  - "What the set is for and who will see it"
  - "Who made each item (optional)"
you_get:
  - "A shortlist with a one-line reason for every cut"
  - "The weakest finalist, tested against the best unused item"
  - "A running order, with the reason for each placement"
  - "A re-read date"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Paste every candidate, even rough ones, and say how many slots you have."
  - "Say what the set is for and who will see it."
  - "Read the cut reasons. Argue with any you disagree with."
  - "Re-read the final set after a break, as the last line tells you."

how_it_works:
  - title: "Count candidates against slots"
    text: "Checks there are at least three candidates for every slot."
  - title: "Test each core idea"
    text: "Scores each on whether the core idea stands alone."
  - title: "Cut to finalists"
    text: "Cuts to the number of slots, with a reason for each cut."
  - title: "Challenge the weakest finalist"
    text: "Tests the weakest finalist against the best unused item."
  - title: "Order by contrast"
    text: "Orders the finalists so neighbours differ."
  - title: "Check the second look"
    text: "Checks the set rewards a second look."
  - title: "Set a re-read"
    text: "Sets a re-read after a break before locking."
  - title: "Check it"
    text: "Runs its own checks, fixes what it can and names any it missed."

output_shape: |
  THE BRIEF
  Slots: <n> | Candidates: <n> | Purpose: <what and for whom>

  SCORED
  - <candidate> | <strong / fair / weak> | <why>

  CUTS
  - <candidate> | <one-line reason>

  WEAKEST FINALIST
  <finalist> vs <best unused> | Result: <kept / swapped> | Why: <reason>

  RUNNING ORDER
  1. <item> | Why here: <contrast reason>

  SECOND LOOK
  <what rewards a second viewing, or what to sharpen>

  RE-READ ON: <date> | Ask: <question>

  MISSING
  <facts that would change the cut>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "Number of slots"
    how: "Give the real number. A tighter limit forces harder cuts."
  - what: "The purpose and the audience"
    how: "State both. Strong for a client pitch is not strong for a social post."
  - what: "Who made each item"
    how: "Include it only if you want the swap test to show how often it is ignored."
  - what: "Order rules you already have"
    how: "Say if an item must open or close. It places the rest around it."

judge:
  - "At least three times as many candidates as slots were considered."
  - "The weakest finalist was named and tested against a replacement."
  - "The order uses contrast, not a flat run of similar items."
  - "Every cut has a one-line reason."
  - "The set has a re-read date."

test:
  - "Run it on a list you already cut by hand. See which of your picks it would have swapped."
  - "Show the final order to someone who has not seen the list and ask where they lost interest."
  - "Run it twice. The top picks should stay the same."

improve:
  - "Add your own test for step 2, such as passing the elevator test or fitting on one slide."
  - "Add order rules from your field, such as always opening with a hook."
  - "Keep a file of cut items, and look at it before your next list."
  - "Pair it with Honest draft feedback giver to work on the items that are left."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Structuring decisions and writing plans is text work any strong chat AI does well with this skill."}
    - {name: "A spreadsheet or cards", why: "Lets you move items around and see the order, which helps with step 5."}
  inputs:
    - "Past sets and which items worked"
    - "The audience and where they will see it"
    - "Limits such as length, time or format"
    - "Notes on what you tried before"

terms:
  - {term: "Running order", meaning: "The order in which items appear, such as songs on an album or slides in a deck."}
  - {term: "Finalist", meaning: "An item that survived the first cut and is competing for a slot."}
