new_slug: signal-guided-search-planner
name: "Signal-guided search planner"
summary: "Find the cause or the winner in a big pile of ads, customers or products. Get a plan that splits it and follows one signal."
job: test-an-idea
thinking: high
thinking_why: "It has to judge whether an odd result is a real finding or a test error, and decide where to keep digging."

headline: "Signal-guided search planner"
subhead: "Describe a pile to search, such as your ads, customers or a year of orders, and what you want to find. Paste a results sheet. The skill picks one signal, splits the pile and measures every part the same way. You get a plan that keeps digging where the signal is strongest."

explain: |
  You may be hunting for the cause of a problem, or the one winner in a big pile of results. It is tempting to look at the top few and stop. That misses the parts you never measured. It also mixes up a lucky result with a real one. Searching well means one signal, measured the same way on every part.

  This skill picks that signal and tests your measuring on a case where you already know the answer. It splits the pile by ordinary means, such as channel or month. It measures every part and keeps only the part where the signal is strongest. Then it splits that part again.

  When a result is a surprise, it rules out a measuring mistake before calling it real. It stops when the signal stops concentrating, and lists what it dropped and why.

when:
  - "You have a large pile of ads, products or customers and need to find where the good ones come from."
  - "A number is off, such as margin or returns, and you need to find which part of the business causes it."
  - "A result looks odd and you can't tell if it is a real find or a measuring mistake."
  - "Someone says our best ads all share one thing, after looking at only the top five."

not_for:
  - "You have two periods of ad totals and want to know what changed: use the Ad sales drop analyst."
  - "You want to compare two versions of one ad or page: use the A/B test results reader."
  - "You think your tracking is broken, not your ads: use the Ad data quality checker first."
  - "You have a short list you can sort by eye. Splitting a pile only pays off when it is too big to read."

you_give:
  - "The pile you are searching and what you want to find"
  - "A results sheet with one row per item, for a stated period, with units"
  - "A case in the sheet where you already know the right answer (optional)"
  - "Ways to split the pile, such as channel, product type or month (optional)"
you_get:
  - "The one signal to follow, and how to measure it the same way every time"
  - "A test of the measuring on a known case"
  - "One table per round: every part, expected, measured and the gap"
  - "Which part to keep each round, and a rule for when to stop"
  - "A write-up of what was found and a list of what was dropped and why"

how_to_use:
  - "Open the skill in your AI, or copy it and paste it into Claude, ChatGPT or Gemini."
  - "Describe the pile and what you want to find. Paste your results sheet, or export it first from Meta Ads Manager, Google Ads or your store."
  - "Name a case where you know the answer, such as an ad you know did well. It tests the measuring first."
  - "Check each round's table against your sheet. If the sheet runs past a few dozen rows, use an AI that can run code, or a spreadsheet, to do the sums."
  - "Bring the next round's numbers back after each split. Once you find the part worth testing, take it to the One-change experiment planner."

how_it_works:
  - title: Picks one signal
    text: Chooses a number you can measure the same way every time and defines how.
  - title: Tests the setup
    text: Runs the measure on a case where you already know the answer, to see that it reads true.
  - title: Splits the pile
    text: Divides the pile by ordinary means, such as source or type, and measures every part.
  - title: Compares to expected
    text: Sets what each part should score and flags any gap between expected and measured.
  - title: Rules out test error
    text: Checks the measuring, the dates and the sample size before calling a gap real.
  - title: Keeps the strongest part
    text: Keeps and re-splits only the part where the signal is strongest, and repeats.
  - title: Stops and writes up
    text: Stops when the signal stops concentrating and writes what was found and what was dropped.

output_shape: |
  THE SIGNAL
  Measure: <what is measured>
  How: <the same way every time>
  Check on a known case: <case and result>

  ROUND 1
  Split by: <how>
  Part | Expected | Measured | Gap | Test error ruled out?
  <part> | <n> | <n> | <n> | <yes/no/how>
  Keep: <part>  Drop: <parts and why>

  ROUND 2 ... (repeat)

  STOP RULE
  <what shows the signal has stopped concentrating>

  WHAT WAS FOUND
  <result>

  WHAT WAS THROWN AWAY AND WHY
  <part | reason>

  MISSING
  <facts that would sharpen the search>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "The pile you are searching and what you want to find"
    - "A results sheet, one row per item, for a stated period"
    - "A case you already know the answer for (optional)"
    - "Ways to split the pile (optional)"
  prerequisites:
    - "Your results, exported from your ad platform or store. A spreadsheet helps for long sheets."
  output:
    - name: "THE SIGNAL"
      contains: "The one measure to follow, exactly how it is measured, and the check on a known case."
    - name: "ROUND 1, ROUND 2 and on"
      contains: "One table per round: each part, expected, measured, gap and whether a test error was ruled out, plus what you keep and drop."
    - name: "STOP RULE"
      contains: "What shows the signal has stopped concentrating, so you know when to stop."
    - name: "WHAT WAS FOUND"
      contains: "The result in plain words, and what you could not tell."
    - name: "WHAT WAS THROWN AWAY AND WHY"
      contains: "Each dropped part with the number or check that justified dropping it."
    - name: "MISSING and CHECKS MISSED"
      contains: "Facts that would sharpen the search, and any check that failed or could not run, or none."

tweaks:
  - what: The signal
    how: Name one number, such as orders per 100 visits. A single measure keeps every part comparable.
  - what: How you split the pile
    how: Offer splits that cost nothing to make, such as by source, month or price band.
  - what: Expected values
    how: Give typical results per part. It uses them to flag gaps instead of guessing.
  - what: Sample size per part
    how: Say how many items sit in each part. Small parts get a warning, not a verdict.

judge:
  - The signal is defined and can be repeated the same way each time.
  - Every part was measured, not just the best one.
  - Each gap was checked for test error before it was called real.
  - The write-up lists what was dropped and why.
  - The search stops on a stated rule, not on a feeling.

test:
  - Hide a known winner in a small pile and see that the plan finds it.
  - Give it a pile where nothing stands out. It should stop and say the signal didn't concentrate.
  - Run the same sheet twice. The parts it keeps should match.
  - Check one dropped part by hand to confirm the signal really was weak there.

improve:
  - "Add the splits that are normal in your field (channel, store, supplier) to step 3."
  - "Add your usual test errors, such as a tracking gap or a sale period, to the error check."
  - "Save each round's table so you can restart the search later."
  - "Pair it with the One-change experiment planner once you have found the part worth testing."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Planning the rounds and reading the tables is text work that any strong chat AI does with this skill."}
    - {name: "A spreadsheet", why: "Holds the per-part numbers and the gaps from each round."}
  inputs:
    - "Results per item for the same dates"
    - "A known case where you already know the answer"
    - "Notes on anything that changed in the period"

terms:
  - term: Signal
    meaning: The one number that tells you how promising a part of the pile is.
  - term: Test error
    meaning: A mistake in how you measured, such as a tracking gap, that can fake a result.
