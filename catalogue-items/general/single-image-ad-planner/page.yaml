new_slug: single-image-ad-planner
name: "Single image ad planner"
summary: "Paste your facts. Get the layout, image words, feed copy, a prompt and a score out of 100."
job: make-image-ads

headline: "Single image ad planner"
subhead: Paste your facts and the buyer, or a script to turn into one image. It settles the one point the ad argues and the type your proof allows. You get the layout, image words, feed copy, an image prompt and a score out of 100.

explain: |
  Many image ads try to say three things at once. The picture shows one idea, the words on it say another, and the text above repeats the headline. Others start from a layout someone liked and end up as a review ad with no real review in it. A stranger scrolls past without knowing what was on offer.

  This skill starts with one sentence: this buyer should do this, because of this one fact. The buyer's question picks the ad type, such as "can I believe it?" for someone with a doubt, and each type needs one kind of proof, so it rules out the types you can't back. Then it sets what the eye reads first, second and third, since the picture pulls the eye whatever its size and words need size. It plans the zones in percent, keeps the image words short enough for a glance, and fits the feed copy to the lengths Meta shows today.

when:
  - You need one image ad for a buyer and don't know what the picture or words should be.
  - You have a video script or a brief and need one image that carries its best point.
  - Your image ads carry too many words, or a layout you liked but can't back with proof.

you_give:
  - Your facts (what you sell, prices now and later, the guarantee, claims you can and can't make, proof on file)
  - What to plan (words on the image, feed copy or both), how many ads and which sizes
  - Customer reviews or support tickets (optional)
  - The buyer, how much they know and their doubt (optional; it picks one and says so)
  - A script to turn into one image, product photos attached and labelled, or your other ads in the batch (optional)
you_get:
  - The one sentence the ad argues, with the claim and where it came from
  - The ad type, the look and the layout, with the types ruled out and why
  - A zone map in reading order, and the words on the image with a word count
  - Feed copy with three headlines, each with its character count
  - A prompt for an image model, and a list of every guess and gap
  - A score out of 100 for the share of its five checks the plan passes, with each one missed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your facts, with the offer and guarantee exactly as your site states them.
  - Paste customer reviews word for word, with where each one came from.
  - Name the buyer, for example "people who know us and think we cost too much", or paste the script this image comes from.
  - Say what to plan and the size, for example "words on the image and feed copy, one ad, 4:5", and list your other live ads if you have them.
  - Read the proof and gaps list before you hand the plan to a designer.

how_it_works:
  - title: Writes the argument
    text: Puts the whole ad in one sentence, the buyer, the action and one fact on file. From a script, it picks the one step the image carries.
  - title: Finds the buyer's question
    text: New buyers ask what it is or if it's for them, warm ones if they can believe it, ready ones why now.
  - title: Picks one claim
    text: Keeps the fact that is on file, matters to this buyer and can't be copied by a rival, then makes it specific.
  - title: Picks the type your proof allows
    text: Checks each ad type under the question against the proof it needs, rules out the rest, and sets the look and the layout.
  - title: Sets the reading order
    text: The picture first, then the headline, the promise or proof, and the offer or action, mapped in zones for your size.
  - title: Writes to the limits
    text: A headline of 7 words or fewer, three other things to read at most, and feed copy fitted to Meta's lengths, every character counted.
  - title: Hands over a prompt
    text: One paragraph for an image model, with each product photo given a role and the empty space marked for the words.

output_shape: |
  ## Ad <n>: <short name>
  Argument: <one sentence>
  Buyer: <who> | <New, Warm or Ready> | Question: <...>
  Claim: <the fact> (source: <where>)
  Offer: <what you get, price today, price after, guarantee>
  Code: <type · dress · audience> | Skeleton: <...> | Size: <...>
  Ruled out: <types and why>

  ### Picture and layout
  Picture must show: <...>
  Reading order: picture, then <first>, <second>, <third>
  Zones: <from-to %  what sits there>

  ### Words on the image (<word count>)
  Headline: <line>   Other: <badge or support line>

  ### Feed copy
  First line: <line> (<characters>)
  Rest: <lines>
  Headlines: <option> (<characters>) x3
  Description: <line> (<characters>)   Button: <button>

  ### Image prompt
  <one paragraph>

  ### Proof and gaps
  Sources | Against the batch | Inferred | MISSING | Check before launch

  ### Score
  <passed> / 5 checks x 100 = <score>   Missed: <one line each>

example:
  business: sprout
  input: |
    [the skill]

    Business facts: Sprout brand file (pasted: products, prices,
    offers, fine and risky claims, buyers, voice, look)
    Customer research: all 20 reviews (pasted)
    Buyer: the price doubter. Knows the brand, maybe from a store
    shelf, thinks it costs too much. Doubts: "Which discount is
    real?" "Will the price jump after the first order?"
    Offer: Sprout Original, Low Sugar. $29.99 first box with the
    text sign-up, then $49.99 every 4 weeks ($1.78/day, site's
    figure). 30-day money-back, first order only. "Pause Or Cancel
    Any Time."
    Plan: words on the image and feed copy. One ad, 4:5.
    Photos: pouch on gradient (1), gummies in a palm (2).
    Other ads in the batch: P1 image "'Sprout is too expensive':
    here's 61% off to prove otherwise"; S1 image "Trusted by 1M+:
    Take 61% OFF".
  output: |
    ## Ad 1: Every price, up front
    Argument: Price doubters should start a Sprout box because the
      ad shows what box two costs, before they sign up.
    Buyer: the price doubter | Ready | Question: Why now?
    Claim: renews at $49.99 every 4 weeks for 28 daily packs, which
      the site gives as $1.78 a day (source: product page)
    Offer: 28 daily packs every 4 weeks. $29.99 first box with the
      text sign-up, then $49.99. 30-day money-back, first order
      only. Start the subscription.
    Code: The offer · Camera · Ready | Skeleton: Stack | Size: 4:5
    Ruled out: The occasion (no real date; the price cut runs
      "indefinitely").

    ### Picture and layout
    Picture must show: the product, with the real numbers large.
    Reading order: picture (hand and pouch), then the headline,
      then the first-box badge. The button is the action.
    Zones, 4:5 (1440 x 1800):
      0-6%    margin
      6-30%   headline, deep forest green #002C17 on warm cream
      32-88%  an adult hand, no face, holding one daily pack torn
              straight across the top, gummies in the palm; the
              closed pouch behind, "28 Daily Packs" in view
      76-86%  badge lower left, on plain cream, beside the price
      88-96%  margin
    Photos needed: a daily pack torn across the top, in a hand
      (not on file).

    ### Words on the image (13 words)
    Headline: $1.78 a day. Even after box one.  (7 words)
    Other:    First box $29.99 with text sign-up

    ### Feed copy
    First line: Think Sprout costs too much? Here's every price, box
      one and after. (67)
    Rest: Your first box is $29.99 with the text sign-up. After that
      it renews at $49.99 every 4 weeks for 28 daily packs: $1.78 a
      day for 60+ ingredients, 21 vitamins and minerals and 6g
      fiber in each pack. One customer's powder cost them "$94 a
      month". 30-day money-back on your first order. Pause or
      cancel any time.
    Headlines: The full price, up front (24) | $1.78 a day after
      box one (25) | What box two costs (18)
    Description: 30-day money-back, first order (30)   Button: Shop now

    ### Image prompt
    Vertical 4:5 photo, 1440 x 1800. Soft daylight from the left on
    a plain warm cream surface. An adult hand, no face, holds one
    small flat daily pack torn straight across its top edge, with a
    small handful of deep-green gummy bears in the palm. Behind it
    stands the green foil pouch from photo 1: keep its shape, colour
    and label exactly, closed at its top. Match the gummies to photo
    2. Leave the upper third empty and plain for a headline. No
    text, logos or extra packs; the words are set afterwards in Work
    Sans bold.

    ### Proof and gaps
    Sources: prices from the product page; counts from the
      fine-to-repeat claims; "$94 a month" is review 3, powder brand
      left out.
    Against the batch: P1 and S1 are offers too, but both argue a
      percentage off. This one argues the price after box one.
    Not used: any percentage off. The site shows 49, 52, 55, 58 and
      61%, so none is safe.
    Check before launch: $49.99 / 28 is $1.785 and the site rounds
      to $1.78. Low Sugar only: Sugar-Free renews at $54.99. Use
      only the site's words on cancelling.
    MISSING: the torn-pack photo; a logo file.
    Blur check on the plan: hand and pouch biggest, then headline.

tweaks:
  - what: The buyer
    how: Change the buyer to one who has never heard of you. The question becomes "is it for me?", the image loses its headline and shows a moment from their day, and the story moves into the feed copy.
  - what: A script instead of facts alone
    how: Paste a video script and say which point the image carries, an offer, one proof or one contrast. The other steps go into the feed copy in the script's order.
  - what: What to plan
    how: Ask for "no words on the image" and the picture argues alone while the first feed line does the stopping. Ask for a plain-post look and it plans a Lo-fi picture.
  - what: Number of ads
    how: Ask for three, or list your live ads. Each new ad changes the claim or the type, with a note on what each one tests.
  - what: The size
    how: Ask for 9:16 as well. It recomposes the zones and moves the words and logo out of the top, the bottom and the edges that Stories and Reels cover.

judge:
  - You can say in one sentence what the ad argues, and the picture and every line argue the same thing.
  - The ad type's proof is in your inputs, and the types it ruled out each have a reason.
  - The image headline is 7 words or fewer, with at most three other things to read.
  - Every character count is shown and within its limit (first line under 125, headline 27 or fewer).
  - Customer quotes are word for word, with a source, and never sit beside a face.
  - The offer appears in your exact words, and anything the ad couldn't back is listed as MISSING.

test:
  - Run it for a buyer and offer you've already advertised. Compare its claim and type with your best ad's. If it picks something weaker, check that your winning fact is in your facts.
  - Count two of its character counts yourself and check every price against your site. One miscount means you should check them all.
  - Run it twice with the same input. The claim, the type and the layout should match. If they change, pin down the buyer more tightly.
  - Once the image is made, show it to someone for two seconds, then hide it. Ask what the ad was about. If they can't say, the first read is wrong.

improve:
  - Paste your offer, renewal terms and guarantee into "What you need" in the skill file, word for word from your site, so every ad uses the same terms.
  - Mark the types on the map you can never fill (for example Checked fact, if you hold no study), so they're ruled out at once.
  - Add your top refund and cancel reasons as fixed rules, so no ad promises the thing that lets buyers down.
  - Save each winning claim, type and layout in your brand file, and paste them next time so new ads start from what sold.
  - Pair it with the prompt that keeps your product and words exact in the image, and a check of the finished ad before you spend.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Planning one ad from your facts and counting characters works well in any strong chat AI."}
    - {name: "Nano Banana", why: "Takes many reference images and draws legible text, so the pack and any typed words come out close to real."}
    - {name: "Canva", why: "Sets your three reads as real text over the picture, so you can resize them and run the blur check."}
    - {name: "Meta Ads Manager", why: "Its ad preview shows where the first line and headline get cut on each placement before you spend."}
  inputs:
    - "Your last 20 reviews, including the 2 to 4 star ones, so the claim answers a doubt buyers really have"
    - "Product photos labelled front, open, in a hand and in use, so the prompt can give each one a role"
    - "Your best and worst image ads with their results, so it can pick a claim your buyers already answer to"
    - "Your typeface files and logo as an SVG, so the designer sets the words to match your brand"

terms:
  - term: Feed copy
    meaning: The words around an image ad in the feed, the main text above it plus the headline, description and button below.
  - term: Ad type
    meaning: One of nine kinds of image ad, sorted by the question it answers for a stranger, such as "can I believe it?".
  - term: Reading order
    meaning: What the eye lands on first, second and third in an image, set by size and contrast.
  - term: Ready buyer
    meaning: Someone who knows your product but hasn't bought yet, often because of one last doubt such as the price.
  - term: Safe zone
    meaning: The part of a Stories or Reels ad that buttons and captions don't cover. Words and logo go inside it.
