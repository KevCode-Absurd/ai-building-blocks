new_slug: skill-breakdown-teaching-planner
name: "Skill breakdown teaching planner"
summary: "Break a skill into 4 to 8 steps a beginner can learn, with a common mistake and a self-check for each, plus a first-hour plan."
job: teach-and-train
thinking: medium
thinking_why: "It has to find the steps the expert no longer notices, which takes reasoning about the description."

headline: "Skill breakdown teaching planner"
subhead: "Paste how you do a skill and who you want to teach. It finds the steps you no longer notice and puts 4 to 8 in learning order. Each step gets a common mistake and a check the learner can run alone. You also get a plan for the first hour."

explain: |
  The person who does a thing best is often the worst at teaching it. Half the steps have become invisible to them. "You just know when it is ready" is true for the expert and no help to a beginner. The beginner needs that feeling turned into something they can look at or count.

  This prompt reads how you do the skill and hunts for those hidden steps. It turns each one into an action a beginner can do on purpose. Then it breaks the skill into 4 to 8 steps. They follow the order to learn, which is not always the order you work. Each step gets the common mistake, a check the learner can run alone, and a sign they are ready to move on.

  It marks the step where most people stall and says what to do when they do. It ends with a first hour that finishes on a small, complete result, even a rough one.

when:
  - "You are training your replacement in something you have done for years."
  - "New hires keep failing at a task that feels obvious to you."
  - "You want to turn what you know into a course, a how-to or a training day."
  - "A teammate asks you to show them, and you realise you can't explain how you decide."

not_for:
  - "You want a one-page reference the learner keeps: use the Training handout writer."
  - "You already have the steps and need a timed session: use the Timed practice session planner."
  - "You are planning a school lesson for a class, not training one person on a task: use the Direct teaching lesson builder."

you_give:
  - "The skill, described the way you would explain it to a friend, including the parts you just know"
  - "The learner: who they are, what they know already and how much time you have"
  - "What beginners got wrong before (optional)"
  - "One good result and one poor one (optional)"
you_get:
  - "What the learner will be able to do, and how you will judge it"
  - "The hidden steps you do without noticing, written out"
  - "4 to 8 steps in learning order, each with a common mistake, a self-check and a ready sign"
  - "The hard step and what to do when learners stall"
  - "A plan for the first hour"

how_to_use:
  - "Copy the prompt and paste it into Claude, ChatGPT or Gemini. It needs no files or tools."
  - "Under it, type the skill, the learner and the time you have. Write as you would talk. Include things you just know."
  - "Read HIDDEN STEPS FOUND first. If a step is wrong or missing, say so and run it again."
  - "Check that every quick check is something the learner can do alone. If one needs a colleague, ask for a solo version."
  - "Teach the FIRST HOUR and note where the learner stalls. To plan that hour minute by minute, take it to the Timed practice session planner."

how_it_works:
  - title: "Names the result"
    text: "What the learner will be able to do, and how it is judged."
  - title: "Finds the hidden steps"
    text: "Every decision made by feel, turned into something a beginner can do on purpose."
  - title: "Orders the steps"
    text: "Four to eight, in learning order, grouped into stages."
  - title: "Writes four lines per step"
    text: "What to do, the common mistake, the quick check, the ready sign."
  - title: "Marks the hard step"
    text: "Where most people stall, and what to do about it."
  - title: "Plans the first hour"
    text: "Steps, repetitions, and a complete result to leave with."

output_shape: |
  THE RESULT          <one line>
  HIDDEN STEPS FOUND  <...>
  STEPS               <stage> <n. do | mistake | check | ready when>
  THE HARD STEP       <which, why, what to do>
  FIRST HOUR          <steps, reps, outcome>
  MISSING             <...>
  CHECKS MISSED       <one line each, or none>

output_sample:
  input:
    - "A description of the skill, in your own words"
    - "Who will learn it, what they know and how much time you have"
    - "What beginners got wrong before (optional)"
    - "One good and one poor result (optional)"
  prerequisites:
    - "Any chat AI. No files, tools or web access needed."
  output:
    - name: "THE RESULT"
      contains: "One line on what the learner will be able to do and how you will judge it."
    - name: "HIDDEN STEPS FOUND"
      contains: "The things you do without noticing, each turned into a step a beginner can do on purpose."
    - name: "STEPS"
      contains: "4 to 8 steps in learning order. Each has what to do, a common mistake, a quick check and a ready sign."
    - name: "THE HARD STEP"
      contains: "The step where most beginners stall, why, and what to do when they do."
    - name: "FIRST HOUR"
      contains: "Which steps to teach, how many repetitions, and the small result the learner leaves with."
    - name: "MISSING"
      contains: "Facts you did not give, such as the learner or the time."
    - name: "CHECKS MISSED"
      contains: "Any quality check the plan failed, or none."

example:
  business: sprout
  input: |
    [the prompt]

    Skill: reading a week of Sprout ad results and deciding which ads to
    keep, cut or copy. I have done it every Monday for two years. I look at
    spend, orders and cost per order for each ad, but mostly I look at the
    opening line and whether the ad is "doing its job" for the buyer it is
    aimed at. A discount ad with a high cost per order is fine if it is
    pulling price doubters; a habit ad with the same cost is a problem. I
    check how long it has run, because the first three days lie. I cut
    anything that has been flat for two weeks unless it is the only ad on
    an angle. I copy the opening line of anything that beats the account
    average and write two variations.
    Learner: our new marketing coordinator, one month in, knows the ads
    manager but has never made a keep-or-cut call. We have 90 minutes on
    Monday.
    Past teaching: the last person cut ads after three days and kept
    everything with a low cost per order even when it was aimed at the
    wrong buyer.
  output: pending

tweaks:
  - what: "Detail"
    how: "The more you ramble, the more hidden steps the prompt can find. Say the things you 'just know'."
  - what: "Past teaching"
    how: "What beginners got wrong before becomes the common mistakes, marked as observed rather than likely."
  - what: "Examples"
    how: "A good and a poor result let the quick checks point at a real difference."

judge:
  - "Every step has a check the learner can run alone."
  - "The hidden steps are things you really do by feel."
  - "Likely mistakes are marked as likely."
  - "The first hour ends with a result."
  - "There are no more than eight steps."

test:
  - "Teach the first hour to one person and note where they stalled. It should be the marked hard step."
  - "Run it twice. The steps should match in substance."
  - "Leave out the learner. It should plan for a beginner with one hour and say MISSING: learner."

improve:
  - "Add your examples of good and poor results so the checks are concrete."
  - "After each teaching session, paste in what went wrong and let the mistakes update."
  - "Take the FIRST HOUR to the Timed practice session planner to run it."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A one-message plan works in any strong chat AI."}
  inputs:
    - "A recording of you doing the skill while talking through it"
    - "The learner's own attempt, so the plan starts where they are"
