new_slug: social-video-edit-planner
name: "Social video edit planner"
summary: "Attach clips and the post's idea. Get a timed cut list, captions, a cover and export checks."
job: grow-social
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Social video edit planner"
subhead: Attach your clips or key frames, a transcript if you have one, and the one idea the post should land. It plans the opening, cuts, captions, cover and export. You get a timed cut list, words to confirm and export checks.

explain: |
  Most brands sit on hours of their own footage: a founder talking, a how-to, orders being packed, a peek behind the scenes. Turning it into posts takes time. The quick fix is to dress it up like an ad, with fast zooms, music over the words and a "shop now" at the end. A good everyday post needs less. It needs one idea, a first line that makes sense on its own, and captions that say what was really said.

  This skill works in five passes. It logs the clips and flags every name, number and "not" the transcript might have misheard. It picks the opening and trims around it without cutting a warning in half. It matches your own extra footage (B-roll) to the line it shows. It times captions so people can read them, inside the part of the screen the app's buttons don't cover. Then it plans the cover and export. It checks for the things Instagram says cut a post's reach, like another app's watermark or black bars. It never adds a testimonial, a milestone or an offer.

when:
  - You filmed a founder chat, a how-to, a care step or a behind-the-scenes moment and want a post from it.
  - You have one long recording and want several short posts out of it.
  - You need a clear edit brief for an editor or for your editing app.

you_give:
  - Your clips, or screenshots of key frames from each (attach them; your AI can see pictures), with each clip's length and any speech or music
  - A transcript, if you have one
  - The one idea this post should land
  - Your brand file with fonts, colours and product names (optional)
  - Where it will be posted, its shape, length and caption style (optional)
you_get:
  - The post's purpose and its opening line
  - A cut list with source, in and out times, what's on screen, caption timing and sound
  - Extra shots, each with the line it covers, or the shot still to film
  - A list of words to confirm against the recording before captions go on
  - The cover, post caption, ending, and export settings with the checks to run
  - Any of its six checks the plan still misses, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Attach your clips, or screenshots of key frames from each, with each clip's length. Paste the transcript if you have one.
  - Say the one thing the post should teach or show, for example "how to open the pack".
  - Listen to each flagged word in the recording and fix the plan before captions go on.
  - Hand the cut list to your editor or follow it in your editing app. Watch the export on a phone, with sound and then muted.

how_it_works:
  - title: Logs the footage
    text: Lists each clip, what it shows and any words burned in. Flags names, numbers, steps and every "not" for a person to check against the recording.
  - title: Shapes the story
    text: Writes the one idea as a sentence, opens on the first line that stands alone, and trims between thoughts, never inside a warning.
  - title: Plans the picture
    text: Puts your own extra footage over the line it shows, held long enough to see. Drops any take that breaks your rules for showing the product.
  - title: Times captions and sound
    text: One or two short lines at a time, slow enough to read, clear of the app's buttons. Voice first, and music only if you own or licensed it.
  - title: Finishes and checks
    text: A real frame for the cover, a clean master and a captioned copy, and a check for watermarks, black bars and muted sound.

output_shape: |
  PURPOSE: <one sentence>
  OPENING LINE: "<...>"

  CUT LIST
  # | source | in-out (s) | on screen | caption (post time) | sound
  1 | <clip> | <in>-<out> | <...>     | "<words>" (<from>-<to>) | <voice>

  EXTRA SHOTS
  <clip> over "<line>" | from <source> (or SHOT TO FILM: <...>)

  CHECK BEFORE CAPTIONING
  <time>: <name, number or step to confirm>

  COVER AND POST CAPTION: <real frame + a few words> / "<post caption>"
  ENDING: <...>   DISCLOSURE: <... or none needed>
  EXPORT: <shape, size, length, files>; checks: <watermark, borders,
  sound, first frame, joins, last second, phone with sound and muted>
  SAVE FOR ANOTHER POST: <times and idea>   NOT USED: <clip and why>
  MISSING: <...>
  CHECKS MISSED: <one line each, or none>

example:
  business: sprout
  input: |
    [the skill]

    Purpose: show how to open a pack the right way.
    Clips (all vertical):
    1. Talking at a kitchen counter, 0:42, speech. Transcript below.
    2. Hands open the big pouch at its resealable top and take out
       one daily pack, 0:12, no speech.
    3. Close-up: one pack torn straight across the top, gummies
       tipped into a palm, 0:08, no speech.
    4. Same as 3, but the pack is torn at the corner, 0:07.

    Auto transcript, clip 1:
    [0:00] Okay so, um, people keep asking how to open these.
    [0:05] So this is the big pouch, it opens at the top, it reseals.
    [0:12] Inside are 28 daily packs.
    [0:16] You tear one straight across the top. Not the side.
    [0:22] Then you just tip the gummies into your hand. Rip, sip,
    enjoy.
    [0:29] That's a small handful, that's your one pack for the day.
    [0:35] Over 20 vitamins and minerals, no water, no shaker.

    Rules: the daily pack tears straight across its top edge, never
    the side, bottom or a corner. The big pouch is never shown torn.
  output: |
    PURPOSE: Show how to open the pouch and one daily pack the right way.
    OPENING LINE: "People keep asking how to open these."

    CUT LIST (post times run 0 to 33 s)
    # | source           | in-out (s) | on screen         | caption
    1 | clip 1           | 2-5        | speaker           | "People keep asking /
                                                             how to open these."
    2 | clip 1 audio     | 5-12       | clip 2            | "This is the big pouch."
                                                             "It opens at the top."
                                                             "It reseals."
    3 | clip 1           | 12-16      | speaker           | "Inside are 28 daily packs."
    4 | clip 1 audio     | 16-22      | clip 3, 0-6       | "Tear one straight /
                                                             across the top."
                                                             "Not the side."
    5 | clip 1 audio     | 22-29      | clip 3, 6-8, then | "Then tip the gummies /
                                        speaker            into your hand."
                                                             "Rip. Tip. Enjoy." (check)
    6 | clip 1           | 29-35      | speaker           | "That's a small handful."
                                                             "That's your one pack /
                                                             for the day."
    Sound: recorded voice only, all the way through. No music.
    Cut: 0-2 ("Okay so, um").

    EXTRA SHOTS
    Clip 2 over "it opens at the top, it reseals" (your footage).
    Clip 3 over "tear one straight across the top" (your footage). The
    tear stays on screen for 6 seconds, long enough to see the edge.

    CHECK BEFORE CAPTIONING
    0:26 to 0:29: the transcript says "Rip, sip, enjoy". Your line is
    "Rip. Tip. Enjoy." Listen. Caption what was said. If it was "sip",
    end row 5 at "into your hand" or re-record the line.
    0:12: "28 daily packs". Matches the pouch. Confirm the speaker said 28.

    COVER AND POST CAPTION
    Cover: a real frame from clip 3, the torn top edge. Text "How to open
    your daily pack", placed in the middle of the frame, above the app's
    bottom buttons.
    Post caption: "Big pouch: open at the top, it reseals. Daily pack:
    tear straight across the top. Save this for your first box."
    ENDING: end card over the last 2 seconds of row 6, "Save this for
    your first box." DISCLOSURE: none needed (your own post).
    EXPORT: 9:16, 1080 x 1920, about 33 seconds. A clean master and a
    captioned copy. Checks: no watermark, no black bars, voice on; first
    frame, each join and the last second; watch on a phone with sound,
    then muted.
    SAVE FOR ANOTHER POST: 35-42, what's inside. It's a second idea, and
    "over 20" doesn't match the "21 vitamins & minerals" on the label.
    Re-record it with the label's number first.
    NOT USED: clip 4. It shows the corner tear the brand never shows.

tweaks:
  - what: The one idea
    how: Change the idea and the cut changes with it. "Show how it's made" leans on extra shots of your process. "Answer a real question" opens on the question.
  - what: A long recording
    how: Paste a long transcript and ask for several posts. You get passages that stand alone, each with in and out times, its opening, what the viewer learns and an ending.
  - what: The layout
    how: Ask for full frame, speaker with cutaways, or split screen. It keeps one layout for the whole post, with face and product in view.
  - what: Music
    how: Say you own a track or hold a licence for it. It goes under the voice, low enough that every word stays clear. Otherwise the post stays voice only.

judge:
  - The post lands one idea, and the opening line makes sense on its own.
  - Every name, number and step in the captions is either confirmed or listed to check against the recording.
  - No extra shot suggests a different product, a result or a fact the footage doesn't show.
  - Use and care steps keep their conditions, and nothing shows the product used the wrong way.
  - Captions stay clear of the app's buttons and stay up long enough to read.
  - There's no invented testimonial, milestone or offer, and no "buy now" ending unless you asked for one.

test:
  - Check five names or numbers in the captions against the recording. Any mismatch that isn't on the check list means the transcript wasn't read closely.
  - Cut the opening as planned and watch it. The first line should make sense quoted on its own.
  - Run it twice on the same clips. It should pick the same opening. If it changes, state the one idea more plainly.
  - Lay each caption over a screenshot of the app with its buttons showing. No caption should sit under a button or the post text.

improve:
  - 'Add your product names and numbers, written your way, to pass 1 of the skill file, so captions are always checked against one source (for Sprout: "daily pack", "28 Daily Packs", "6 g prebiotic fiber").'
  - "Write your caption style into pass 4: font, size, colour and how many words go on a line."
  - Set your export sizes in pass 5 for each place you post.
  - Add your rules for showing the product to pass 3, so no extra shot shows it used the wrong way (for Sprout, the pack is torn straight across the top).
  - Pair it with the founder video planner to decide what to film. Use the video ad edit plan instead when the post will run as a paid ad.

works_best_with:
  tools:
    - {name: "Gemini", why: "Watches the clips you upload and points to moments by minute and second, so cut times come from the footage."}
    - {name: "Claude", why: "Keeps a long transcript and every rule in the skill in view, so warnings stay with their steps."}
    - {name: "Descript", why: "Lets you cut the video by deleting words from its transcript, which follows a cut list line by line."}
  inputs:
    - "Your rules for showing the product, such as how a pack opens, so no take shows it the wrong way"
    - "A photo of the label or pack, so every number the speaker says gets checked against print"
    - "Your extra clips, or a key frame from each, attached, so each line gets a real shot"
    - "Two past posts with their captions, so the caption style and ending match yours"

terms:
  - term: B-roll
    meaning: Extra footage shown over someone talking, such as a close-up of the thing they're describing.
  - term: Cut list
    meaning: The list of every piece of footage used, in order, with its start and end times.
  - term: Burned-in words
    meaning: Text or captions already part of a clip's picture, which can't be removed in the edit.
  - term: Safe area
    meaning: The part of a vertical video the app doesn't cover with its name, buttons and post text.
