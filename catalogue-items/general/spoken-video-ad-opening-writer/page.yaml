new_slug: spoken-video-ad-opening-writer
name: Spoken video ad opening writer
summary: Write spoken video ad openings for the ad you already run. Give it your ad and product photos. Get three 6-second openings, a storyboard and clip prompts.
job: make-video-ads
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
headline: Spoken video ad opening writer
subhead: Give it the ad you already run, your product photos and your buyer. It writes three spoken 6-second openings that each keep people watching a different way, with your yes at each stage. You get a presenter, storyboard, clip prompts and an edit list.
explain: |
  Most people see only the first few seconds of an ad. If the opening doesn't hold them, the rest never gets seen. Writing a whole new ad to fix that is slow. Putting a new opening in front of the ad you have, and testing it, is fast.

  This skill writes three openings that lead straight into your ad's first line. Each one makes a different move: it mirrors the buyer's day, asks a question your ad answers, promises what they'll see, leads with proof, or flips a belief. TikTok advises testing a few creatives that differ a lot, so it gives you three, not ten. Each line is counted against the clip at a normal speaking pace. Then it runs the video process. It reuses your ad's approved presenter and sheet where it can, so the cut doesn't jump, and plans one frame per opening before writing any clip prompt. Your product is in frame from the first second, and the presenter never claims a result only a real customer could have.
when:
  - You have an ad that explains well but loses people in the first seconds.
  - You want to test new openings on the same ad without filming a new one.
  - You need a talking opening but don't have a creator available.
not_for:
  - "You want a full new ad from scratch: write the script first with your own brief, then come back for openings."
  - "Your ad uses a real creator or customer who speaks about their own results: ask that person to film a new opening instead."
  - "You want an opening with no talking: use the Wordless video ad opening writer."
you_give:
  - The ad you already run (its first spoken line, a screenshot of its first frame, and the script if you have it)
  - Your product photos (front, in hand, in use), how it's handled and what it replaces
  - Your buyer, their main doubt, their own words, and the claims you can back
  - The ad's approved presenter card and sheet, if you have them (optional)
  - The clip length your video tool makes (optional, 6 seconds by default)
you_get:
  - A line-up of three openings, each with its move, word count, dials and the ad line that pays it off
  - The presenter card and sheet, reused or new, with lock lines
  - A storyboard with one frame and one shot card per opening
  - A clip prompt per opening, checks and an edit list
  - Any of its own checks the openings still miss, one line each
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the first line of your ad and attach a screenshot of its first frame. The full script is better. Attach the presenter's card and sheet if you have them.
  - Paste your brand facts, the claims you can back and a few real reviews. Attach product photos.
  - Read each opening aloud, then your ad's first line. Approve the line-up, then the presenter, the sheet and the storyboard.
  - Make one clip, check the join, then the rest. Test each opening on the same ad as separate ads.
  - Costs: writing the prompts is free in any chat AI. Making the clips needs a paid video tool (Higgsfield credits, a paid Google AI plan, or an API key from a video service). Each clip is billed by that service, so check its price per clip before you run a batch.
  - The presenter is an AI-made adult. Keep the AI label on, and never let the presenter claim a personal result or story.
output_sample:
  input:
    - The first spoken line of your ad, and a screenshot of its first frame
    - Your product photos, such as front, in hand and in use
    - Your buyer, their main doubt and the claims you can back
    - Your ad's approved presenter card and sheet (optional)
    - The clip length your video tool makes (optional)
  prerequisites:
    - An AI that can read images, so it can check your photos and first frame
    - A video tool that makes speech, if you want to turn the clip prompts into clips
  output:
    - name: Line-up (Stage 0)
      contains: Three openings, each with its move, word count, energy and distance, and the ad line that pays it off.
    - name: Avatar card (Stage 1)
      contains: The presenter, reused from your ad or newly made, for you to approve.
    - name: Reference images (Stage 2)
      contains: The picked picture from your ad, or one to four new ones of the presenter.
    - name: Character sheet (Stage 3)
      contains: Views and expressions of the presenter, plus lock lines for presenter, room and product.
    - name: Storyboard (Stage 4)
      contains: One frame and one shot card per opening, with the product in place and the line to say.
    - name: Clip prompts (Stage 5)
      contains: One prompt per opening in plain phone-video words, with the line, the touch and the still last second.
    - name: Edit list
      contains: How to join each opening to your ad, add captions and the AI label, and what to deliver.
    - name: Checks missed
      contains: One line for each of its own checks the openings still miss, or none.
how_it_works:
  - title: Picks three moves
    text: From mirror, gap, promise, proof and flip, only where your facts support it. Each one names the line in your ad that pays it off.
  - title: Counts the words
    text: About 2.5 spoken words a second, with time to settle and a still second at the end. That's 11 words for 6 seconds, 16 for 8.
  - title: Sets two dials
    text: Energy (calm, level or lively) and distance (close or propped). One opening matches your ad's first frame so the cut feels like one video.
  - title: Reuses your presenter
    text: Copies the ad's approved presenter card and sheet, or makes a new made-up adult for you to approve.
  - title: Storyboards each opening
    text: One frame with the product already in a hand, label to the lens, and a shot card with the line and the touch. You approve them.
  - title: Writes the clips
    text: One prompt per opening in phone-video words, no music and no film terms, checked against your ad's first frame.
output_shape: |
  STAGE 0  LINE-UP (approve before anything is made)
  <n> <move> | <words>/<budget> | energy <dial>, <distance>
    "<opening line>"  Touch: <on which word>  Paid off by: <ad line>
  Not used: <moves the facts don't support, and why>
  STAGE 1  AVATAR CARD (approval 1)  <reused from the ad, or new>
  STAGE 2  REFERENCE IMAGES  <the ad's picked picture, or 1-4 new>
  STAGE 3  SHEET (approval 2)
  <views and expressions for the dials>  Product: <..>  Room: <..>
  LOCK LINES  <presenter> <room> <product>
  STAGE 4  STORYBOARD (approval 3)
  Frame <n>: <lock lines, product in place, mouth opening>
  Shot card <n>: <distance, energy, line, touch, still last second, voice>
  STAGE 5  CLIPS
  CLIP PROMPT (<opening>)  <aspect, length, references, objects, camera,
  line, touch, still second, voice, room sound>
  EDIT  <joins, captions, AI label, deliver list>
  MISSING: <facts it needed and didn't get>

  CHECKS MISSED: <one line per check missed, or none>
example:
  business: sprout
  input: |
    [the skill]

    Ad to go in front of: "Powder tub", video, about 25 seconds.
    First line: "You bought the big tub of greens powder. Again."
    Line 4: "Sprout is 60+ ingredients, 21 vitamins and minerals and
    6 g of fiber in one daily pack."
    First frame: our approved AI presenter (man, early 30s) at a
    kitchen counter, morning, holding a half-used powder tub, at
    arm's length, level voice. His card and sheet are attached.
    Product: Sprout. Photos attached: pouch front, one daily pack in a
    hand, gummies in a palm. One pack a day, torn straight across the
    top. Visible result: none.
    Buyer: the quitter who wants to stick, 28 to 45. Doubt: "A gummy
    can't hold enough to replace my powder."
    Review 1: "[Sprout] has been the one thing I've been able to stick
    to." (already used as line 6 of the ad)
    Never say: fix, energy or immunity results, weight loss.
    Real deadline: none.
  output: |
    STAGE 0  LINE-UP
    1 Mirror | 11/11 | level, arm's length (matches the ad)
      "Shaker in the sink since Monday? This pack needs no water."
      Touch: turns the pack's front to the lens on "This pack".
      Paid off by: "You bought the big tub of greens powder. Again."
    2 Gap | 11/11 | lively, arm's length
      "How much fits in one little pack? Stay for the label."
      Touch: taps the pack on "label". Paid off by: line 4.
    3 Flip | 11/11 | calm, propped at mid shot
      "You're not bad at supplements. Powder is hard to keep up."
      Touch: nudges the tub away on "Powder". Paid off by: lines 1-2.
    Not used: proof (line 4 already says the numbers), promise (no
    visible result), timing (no real date).  [approved]

    STAGE 1  AVATAR CARD (approval 1)
    Reused unchanged from "Powder tub": the made-up man, early 30s,
    never called a customer.  [confirmed]
    STAGE 2  REFERENCE IMAGES  His picked picture from the ad.

    STAGE 3  SHEET (approval 2)
    Added to his sheet: calm, level and lively faces; a daily pack in
    his right hand, front out.
    Product: the daily pack from its photo, sealed. Room: the ad's
    kitchen, counter, window, morning daylight.  [approved]

    STAGE 4  STORYBOARD (approval 3)
    Frame 1 and 2 (shared): [presenter] [room] at the counter, mouth
    just opening, eyes on the lens, a sealed daily pack in one hand,
    front uncovered. Nothing important in the top or bottom sixth.
    Shot card 1: arm's length, level energy, the line, the turn on
    "This pack", still for the last second, a shaker in the sink behind.
    Frame 3: propped at mid shot, the pack and the tub on the counter.
    [approved]

    STAGE 5  CLIPS
    CLIP PROMPT (opening 1)
    9:16, 6 seconds, real speed. References: his picture, pack photo,
    frame 1. Only the counter, the pack and a shaker in the sink.
    Held at arm's length. 0 to 0.5 s: settles, mouth opening. 0.5 to
    5 s: he says "Shaker in the sink since Monday? This pack needs no
    water." Even, dry voice, eyebrows up on "Monday". On "This pack"
    he turns the pack's front square to the lens. 5 to 6 s: mouth
    closed, eyes on the lens, pack still. Voice: man, early 30s, even
    pace, plain US accent. Sound: faint kitchen hum, a soft foil
    crinkle on the turn. No music, no subtitles.
    Check: every word said, lips match, the pack stays sealed, the
    last frame sits beside the ad's first frame without a jump.
    EDIT  Hard cut into "Powder tub". Captions in the ad's style. AI
    label on. Deliver: raw clip, last frame, line, move. Test each
    opening as a separate ad.
    MISSING: your tool's prices.
tweaks:
  - what: Which moves
    how: Look at what you can back. A visible result allows a promise preview. A sourced number allows proof. A real date allows timing. Without the fact, that move is skipped.
  - what: The dials
    how: Calm, level or lively for energy; close or propped for distance. Your brand voice sets the range. A quiet brand may drop lively altogether.
  - what: The presenter
    how: Attach your ad's approved presenter card and sheet, and stages 1 to 3 reuse them. If your ad has a real creator, use their own footage or a plainly different person, never an AI look-alike.
  - what: Clip length
    how: 6 seconds gives an 11-word line. Ask for 8 and the budget goes to 16. A line that won't fit gets shorter words for you to approve.
judge:
  - The three openings make three different moves, each within its word budget.
  - None starts with a greeting, "so" or your brand name, and each flows into your ad's first line.
  - The run stopped for your yes on the line-up, the presenter, the sheet and the storyboard, unless you asked for every stage in one go.
  - The presenter never says "I tried it", "this worked for me" or a personal story.
  - Every fact is your brand's, word for word.
  - The product is in frame from the first frame.
test:
  - Give it an ad with no visible result and no review. It should skip promise and real-line proof and say why.
  - Read each opening aloud with a timer. It should finish with a full second to spare inside the clip.
  - Attach your ad's presenter sheet. Stages 1 and 2 should reuse it, not invent a new face.
  - Make one clip and play it in front of your ad on your phone. If the join jumps, fix that clip before making the others.
improve:
  - Paste your full ad script, not just the first line, so it can name the exact line that pays off each opening.
  - Save your approved presenter card and sheet in your brand file, so every batch of openings reuses the same face.
  - Write your banned claims into stage 0, so no opening needs a second check.
  - Keep a note of which move won on each ad, and ask for that move first next time.
  - For an opening with no talking, pair it with the skill that makes wordless, satisfying openings.
works_best_with:
  tools:
    - name: Veo
      why: Makes speech and lip movement along with the picture, starting from your approved frame.
    - name: Kling
      why: Makes speech with lip sync in several languages, from your reference images.
    - name: Nano Banana
      why: Makes the opening frame from your product photos, so the real product is in frame from the first second.
  inputs:
    - Your ad's audience retention chart, so you can see the second where viewers leave
    - Photos of a real room like your buyer's, so the presenter's room looks lived in
    - A note of your typical buyer's age and style, so a new presenter feels like one of them
terms:
  - term: Opening (hook)
    meaning: The first line or first few seconds of an ad, whose job is to keep the right person watching.
  - term: Move
    meaning: The way an opening earns attention, such as mirroring the buyer's day or asking a question the ad answers.
  - term: Word budget
    meaning: How many words fit in the clip at a normal speaking pace, with time to settle and a still second at the end.
  - term: AI presenter
    meaning: A made-up adult generated by a video tool. Not a customer, so they can't claim personal results.
