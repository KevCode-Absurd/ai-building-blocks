new_slug: stalled-deal-indecision-checker
name: "Stalled deal indecision checker"
summary: "Find out why a quiet deal stalled: doubt, endless research or fear of a mistake. Paste your deal notes, get a plan and a message to send."
job: sell-and-negotiate
thinking: medium
thinking_why: "It reads between the lines of notes to name a cause, which takes judgement."

headline: "Stalled deal indecision checker"
subhead: "Paste your notes on a deal that went quiet. It finds the buyer's own words that show they are stuck and names why. You get a depth rating, a firm recommendation, safety nets you can offer and a short message to send."

explain: |
  A stalled deal is often not lost to a rival. The buyer is stuck. They cannot pick, or they feel there is always more to check, or they fear the choice will go wrong. A nudge, a deadline or another deck usually makes it worse.

  This skill reads your deal notes like a stalled deal checker. It pulls out the buyer's quotes with dates and sorts the stall into one of three causes. It rates how deep it runs, so you know whether to count the deal in your forecast. If the notes show a plain no or a lost rival, it says so and stops.

  Then it does what a stuck buyer needs. It gives a firm pick, says what to stop offering, and pairs each fear with a safety net you can really give. It leaves out fake urgency.

when:
  - "A buyer loved the meetings, then went quiet for two weeks."
  - "The buyer keeps asking for one more comparison, demo or reference call."
  - "You are about to add a deadline or a discount to force an answer."
  - "Your forecast counts a deal that has not moved in a month and you want an honest view."

not_for:
  - "The buyer has said no, or told you they chose someone else. That is a lost deal, not a stall: use the Deal win reason finder to learn from it."
  - "The buyer is ready and you only need the closing question: use the Sales closing question planner."
  - "The buyer is unsure they can afford it: use the Deal payment checker."
  - "You have no notes or buyer messages yet. Gather the last three messages first."

you_give:
  - "Your notes on the deal: emails, call notes and what the buyer said, with dates (from your inbox, CRM or notebook)"
  - "Your offer and what you can adjust, such as a trial, a refund or help to start (optional)"
  - "How similar deals ended (optional)"
you_get:
  - "The signs of a stall, quoted with dates"
  - "The cause, with the quotes that show it"
  - "How deep it runs and whether to count the deal in your forecast"
  - "A personal pick, what to stop offering and a safety net for each fear"
  - "A message under 150 words that you can send today"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. It needs no files, web access or paid tools."
  - "Paste the buyer's last messages and your call notes. Keep their exact words and the dates."
  - "Say which safety nets you can really give: a trial, a refund, start-up help. It will not offer one you did not list."
  - "Check the cause against what you know of this buyer. If it feels wrong, say why and run it again."
  - "Edit the message into your own voice, send it, and write down the reply."

how_it_works:
  - title: "Reads the signs"
    text: "Marks stalls, repeat requests for more information and 'let me think about it', and quotes each with its date."
  - title: "Names the cause"
    text: "Sorts the stall into doubts the choice, always more to learn, or doubts the result. A plain no or a lost rival ends the run."
  - title: "Judges depth"
    text: "Rates the stall light, moderate or deep, and says whether to count the deal in your forecast."
  - title: "Recommends"
    text: "Writes what it would choose in the buyer's place, naming the option, the size and the start date."
  - title: "Limits exploring"
    text: "Lists what to stop offering, such as more demos, and writes one line on what is enough to decide."
  - title: "Adds safety nets"
    text: "Pairs each fear with a net, such as an opt-out or a first-value plan. A net you cannot give is marked MISSING."
  - title: "Removes fake urgency"
    text: "Replaces any invented deadline with a real date or a plain line on what happens next."
  - title: "Writes the message"
    text: "Drafts the email or call opening in under 150 words."

output_shape: |
  SIGNS FOUND
  "<buyer quote>" | <date>

  CAUSE
  <doubts the choice, always more to learn, or doubts the result> | Evidence: <quotes>

  DEPTH AND FORECAST
  <light, moderate or deep> | Count in forecast: <advice and confidence>

  RECOMMENDATION
  <what you would choose in their place and why>

  STOP OFFERING
  <list> | What is enough to decide: <one sentence>

  SAFETY NETS
  Fear: <x> | Net: <y> | Can offer: <yes or MISSING>

  MESSAGE
  <under 150 words>

  MISSING
  <what would help>

  CHECKS MISSED
  <one line each, or none>

output_sample:
  input:
    - "Your notes on the deal, with the buyer's words and dates"
    - "Your offer and what you can adjust (optional)"
    - "How similar deals ended (optional)"
  output:
    - name: "SIGNS FOUND"
      contains: "Each stall or repeat request, quoted in the buyer's words with its date."
    - name: "CAUSE"
      contains: "Whether the buyer doubts the choice, wants endless research or fears a mistake, with the quotes behind it."
    - name: "DEPTH AND FORECAST"
      contains: "A light, moderate or deep rating and whether to count the deal in your forecast."
    - name: "RECOMMENDATION"
      contains: "What you would pick in their place, with the option, size and start date."
    - name: "STOP OFFERING"
      contains: "The extras to drop, and one line on what is enough to decide."
    - name: "SAFETY NETS"
      contains: "Each fear paired with a net you can really give, or MISSING if you cannot."
    - name: "MESSAGE"
      contains: "A short email or call opening, under 150 words, with no fake deadline."
    - name: "MISSING and CHECKS MISSED"
      contains: "Facts you did not give and any check the answer still fails."

tweaks:
  - what: "Buyer quotes"
    how: "Their exact words make the cause clearer."
  - what: "What you can offer"
    how: "List the nets you can give: refunds, trials, start help."
  - what: "How long it has been quiet"
    how: "Give dates so depth can be judged."
  - what: "The size of the deal"
    how: "A larger deal may need nets that match."

judge:
  - "The cause matches the quotes."
  - "The recommendation names a specific option."
  - "Each fear has a net you can really give."
  - "Nothing adds pressure or a made-up deadline."
  - "The message is short enough to send today."

test:
  - "Run it on a deal that went cold. See whether the cause fits what the buyer later said."
  - "Run it twice. The cause should stay the same."
  - "Send the message to one stalled buyer and note the reply."
  - "Compare deals you counted before and after in your forecast."

improve:
  - "Add the safety nets you can offer as a standing list."
  - "Add your own rule for when to count a deal."
  - "Save outcomes by cause in a notes file."
  - "Pair it with \"Sales closing question planner\" once they are ready to choose."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Reading notes and drafting a short message is text work a strong chat AI does well."}
    - {name: "Your CRM or notes tool", why: "Keep dates and quotes for each deal in one place."}
  inputs:
    - "The full email thread"
    - "Your trial and refund terms"
    - "Notes from other deals that stalled"

terms:
  - term: "Indecision"
    meaning: "When a buyer cannot choose, as opposed to saying no."
  - term: "Safety net"
    meaning: "An offer that lowers the risk of saying yes, such as a refund or a trial."
