new_slug: standards-sheet-writer
name: "Repeatable standards sheet writer"
summary: "Describe your product or service. Get a one-page sheet of checkable standards so it feels the same every time."
job: lead-people
thinking: low
thinking_why: "It sorts what you give it into fixed headings with few judgement calls."

headline: "Repeatable standards sheet writer"
subhead: "Describe your product or service and give any numbers you hold. It walks the customer's path, writes standards you can answer with a yes or no, names what you never cut and adds a ten-minute visit check. You get a one-page standards sheet."

explain: |
  A product that is great on Monday and average on Friday loses the customers who noticed. The fix is rarely effort. It is a clear standard that a new person can read, follow and be checked against.
  
  This skill walks your product from order to hand-off, then writes standards for quality, service, cleanliness and value. Each one is a yes-or-no statement with a real number from you, such as a weight or a wait in minutes. It names what you will never cut, gives each person one job, plans how a newcomer is trained and adds a quick visit check. Gaps are marked, never guessed.

when:
  - "You are about to open a second location, hire a first helper or hand work to a partner."
  - "Customers say it was better last time, and you cannot say why."
  - "You want a new hire to be good in their first week."

you_give:
  - "Your product or service, from order to hand-off"
  - "Your real numbers: weights, times, prices, refund terms (optional)"
  - "Product facts such as ingredients, materials or steps (optional)"
you_get:
  - "A one-page standards sheet with yes-or-no checks"
  - "A never-cut list and one job per role"
  - "A training plan and a ten-minute visit check"

how_to_use:
  - "Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in."
  - "Describe what a customer orders and who delivers it, from first request to hand-off."
  - "Paste any numbers you hold. Leave out ones you do not know."
  - "Run the visit check on your own place first and fix what fails."
  - "Hand the sheet to one other person and ask them to check it, without your help."

how_it_works:
  - title: "Walk it from order to hand-off"
    text: "Lists every moment from order to hand-off, with what the customer gets at each."
  - title: "Turn the four areas into standards"
    text: "Writes yes-or-no standards for quality, service, cleanliness and value, using your own numbers."
  - title: "Name what you never cut"
    text: "Names what you will never cut, such as filler or a substitute."
  - title: "Give each person one job"
    text: "Gives each person one clear job and cuts extra movement."
  - title: "Decide how a newcomer learns it"
    text: "Plans how a newcomer is trained to the standard."
  - title: "Add a visit check"
    text: "Adds a short visit check anyone can run."
  - title: "Leave room for owners"
    text: "Marks what is fixed, and where local ideas can be collected."
  - title: "Checks its own work"
    text: "Goes through its checks one by one, fixes what it can and names any it still missed."

output_shape: |
  ORDER TO HAND-OFF
  <n>. <moment> | Customer gets: <what> | Owner: <who>
  
  STANDARDS
  Quality:     <yes-or-no standard with number>
  Service:     <...>
  Cleanliness: <...>
  Value:       <...>
  
  NEVER CUT
  <list>
  
  ROLES
  <role>: <one job, steps included>
  
  TRAINING
  <first week in order>, signed off by <who>
  
  VISIT CHECK
  <8 to 12 yes-or-no questions>
  
  LOCAL IDEAS
  <what may vary, how ideas are collected>
  
  MISSING
  <numbers not given>
  
  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "Your numbers"
    how: "Real weights, times and refund terms make the standards checkable. Leave out what you do not know and it marks the gap."
  - what: "How many people deliver it"
    how: "Say it is you alone or a team of ten. The role step changes with it."
  - what: "What you worry about most"
    how: "Name the thing that varies. It goes first in the standards."
  - what: "Where it will be copied"
    how: "Say whether a second site or a partner will use it, so the local-ideas rule fits."

judge:
  - "Someone who has never seen your business can answer each standard with yes or no."
  - "Every number is one you gave it."
  - "The never-cut list names real things, not slogans."
  - "Each person has one job."
  - "The visit check fits on one page."

test:
  - "Run the visit check on your own place and see if it catches a known weak spot."
  - "Give the sheet to a new helper and watch what they ask. Add a standard for each question."
  - "Run it twice with the same facts. The standards should stay close."

improve:
  - "Add your industry's usual shortcuts to step 3 so they land on the never-cut list."
  - "Save the sheet to your brand file so other skills use the same standards."
  - "After each visit check, add the failure that turned up to the sheet."
  - "Pair it with \"Team culture memo writer\" for the people side."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Sorting plain rules into checkable form is text work any strong chat AI does well with this skill."}
    - {name: "A printed clipboard", why: "The visit check works best on paper, carried through the place."}
  inputs:
    - "Photos of the product done right"
    - "Past complaints or refund reasons"
    - "Supplier specs or recipes"

terms:
  - term: "Never-cut list"
    meaning: "The things you refuse to remove or swap, even when costs rise."
