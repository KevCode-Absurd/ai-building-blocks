new_slug: stop-image-tools-redrawing-your-product-and-words
name: "Stop image tools changing your product and words"
summary: "Give it your approved ad plan and photos. You get one short prompt that keeps your product and words exact."
job: make-image-ads

headline: "Stop image tools changing your product and words"
subhead: Give it the approved scene, layout and words for one ad, plus your product facts and reference photos. It sorts the brief into keep, translate and drop, names each photo's role, and writes the prompt in five blocks with your product's details repeated word for word.

explain: |
  By the time an ad is approved, the brief around it is long: research notes, rejected versions, three ways to say "bright", and a brand file the image tool doesn't need. Paste all of that in and the tool drifts. It mixes in the rejected idea, misses the rule in paragraph six, or swaps your pack for an easier one to draw.

  This skill follows what the model makers' own guides advise. It sorts the brief into what to keep, what to translate into things a camera can see, and what to drop. It names every attached photo's role in one line. It writes the prompt in five blocks with the most important first: use and shape, the subject with your product's lock lines word for word, the place, the camera and light, and the exact words in quotes. It ends with one line saying what must not change, and it fits the wording to the model you use.

when:
  - You have an approved ad and need the prompt for your image tool or an automated pipeline.
  - Your prompts have grown long and the images keep picking up old or rejected ideas.
  - Your tool has a length limit and you need the prompt to fit without losing anything important.

you_give:
  - The approved scene, layout and image shape (not the rejected ideas)
  - Your product facts, ideally the lock lines from your truth sheet
  - Reference photos, each with what it's for
  - The approved words, with where they sit and which is biggest (optional)
  - Which image tool you use and any length limit (optional)
you_get:
  - One prompt in five blocks plus a keep line, with its character count
  - A one-line role for every attached image
  - A list of what was left out, and a MISSING line for any fact it needed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the approved ad, the exact words and the product facts. Rejected versions can stay in; they'll be dropped.
  - Attach your reference photos and say what each one is for.
  - Say which image tool you use and the image shape, such as 4:5.
  - Paste the prompt into your image tool. For a fix, attach the picture and name the one change.

how_it_works:
  - title: Sorts the brief
    text: Keep the approved scene, words, product facts and rules. Translate labels like "premium" into things a camera sees. Drop notes and rejected ideas.
  - title: Names each image's role
    text: The real product, the logo, a person to keep, a scene to match, a layout for structure only, or a style for light only.
  - title: Writes five blocks
    text: Use and shape, the subject with your lock lines, place and layout, camera and light, then the exact words in quotes.
  - title: Adds the keep line
    text: One line at the end saying the product stays exactly as in the photo, with the lock lines repeated.
  - title: Says what it wants
    text: Writes "a plain unlabelled tub" instead of "no logo", since some models ignore or flip a "no".
  - title: Fits the model
    text: Full sentences for chat-based tools, subject first and no negatives for FLUX.2, and never cuts a lock line to fit a limit.

output_shape: |
  PROMPT (<characters>)
  1 Use and shape:   <...>
  2 Subject:         <product, action, lock lines, size, hands>
  3 Place:           <where, what's around, layout>
  4 Camera, light:   <distance, angle, lens, light, finish>
  5 Words:           "<exact words>", <place, size, look, colour>
  Keep:              <product exactly as Image n: lock lines>

  IMAGES     Image 1 = <role>; Image 2 = <role>; ...
  LEFT OUT   <what was dropped and why>
  MISSING    <image role | product fact | approved words>

example:
  business: sprout
  input: |
    [the skill]

    Approved scene: kitchen counter in daylight. An adult hand tears
    a daily pack across the top and pours the gummies into the other
    palm. The Sprout Original pouch stands behind, label to camera.
    Approved text: "Rip. Tip. Enjoy." top left, forest green #00582D.
    Size: 4:5. Tool: GPT Image 2.5. Prompt limit: 1,000 characters.

    Images: 1 = adult pouch, front on. 2 = a daily pack, torn across
    the top. 3 = layout sketch (headline box says "HEADLINE HERE").

    Lock lines (from the truth sheet): glossy deep green stand-up foil
    pouch; big yellow wordmark, yellow bear face top right; "28 Daily
    Packs" at the bottom; small opaque deep-green bears, soft matte;
    daily pack torn straight across the top only.
    Rules: the big pouch opens only at its resealable top, never torn.
    Photos bright, sunny, candy-like. Never clinical.

    Notes: we rejected a version with a shaker bottle in it. Also
    tried "Tear. Pour. Done." Make it pop, really bright, vibrant,
    super bright and fun.
  output: |
    PROMPT (947 characters)
    1 Use and shape:  A 4:5 photo for a social ad.
    2 Subject:        An adult's left hand holds the daily pack from
                      Image 2, torn straight across the top only, and
                      tips a small handful of small opaque deep-green
                      bears, soft matte, into the right palm. Behind
                      it stands the closed pouch from Image 1, label to
                      camera: glossy deep green stand-up foil pouch;
                      big yellow wordmark, yellow bear face top right;
                      "28 Daily Packs" at the bottom.
    3 Place:          A white kitchen counter. Hands lower middle,
                      pouch behind at right, clear space top left.
                      Image 3 sets the structure only.
    4 Camera, light:  Eye level, close. Bright window sun, warm and
                      saturated, glossy foil catching the light,
                      cheerful and candy-like.
    5 Words:          "Rip. Tip. Enjoy." once, top left, bold rounded
                      sans-serif, colour #00582D.
    Keep:             Keep both packs exactly as in Images 1 and 2,
                      label as printed: glossy deep green stand-up foil
                      pouch; big yellow wordmark, yellow bear face top
                      right; "28 Daily Packs" at the bottom. The only
                      words are the headline and the packs' print.

    IMAGES     Image 1 = the real product (pouch); Image 2 = the real
               product (daily pack, torn); Image 3 = layout, structure
               only.
    LEFT OUT   The shaker version and "Tear. Pour. Done." (rejected),
               "HEADLINE HERE" (placeholder), "pop, vibrant, super
               bright" (translated into warm saturated morning sun),
               "never clinical" (covered by the counter and sun).
    MISSING    How many gummies are in an adult pack. Kept as "a small
               handful", with no count.

tweaks:
  - what: Words added later
    how: Say the words will go on in a design tool. Block 5 then asks for clear empty space where they'll go, and no words.
  - what: A length limit
    how: Give your tool's limit. It cuts leftovers first and never a lock line, a word or a rule. If it still won't fit, it says so.
  - what: A set of ads
    how: Run it for each ad in a set. The lock lines repeat in the same words every time, so the pack doesn't drift between images.
  - what: A fix
    how: Attach the approved picture and name the one thing to change. The prompt asks for that change, repeats the keep line and keeps everything else the same.

judge:
  - Every attached photo has one stated role.
  - Your lock lines appear word for word, and the pack hasn't been swapped or simplified.
  - Approved words appear once, in quotes, with their place, or the prompt asks for clear space.
  - No rejected idea, research note or placeholder made it into the prompt.
  - The prompt says what it wants, with no pile of "no" lines.

test:
  - Paste your full brief, rejected versions and all. Search the prompt for any word from a rejected version. If one is there, it leaked.
  - Run it twice on the same approved ad. The subject block and keep line should match word for word.
  - Give it your tool's length limit and check what was cut. Lock lines and rules should survive; repeated adjectives should go.
  - Make the image and compare the pack with your real photo at full size, checking colour, quantity and how it opens.

improve:
  - Keep your product's lock lines in your brand file, so every prompt in a set uses the same words.
  - Add how the product opens and is held to your lock lines (for Sprout, the daily pack tears straight across the top), so it's never guessed.
  - Write your usual image tool and its limit into "What you need", so it fits that tool every time.
  - Pair it with the truth sheet skill, which writes the lock lines, and with the skill that finds flaws in finished image ads before launch.

works_best_with:
  tools:
    - {name: "GPT Image 2.5", why: "Takes several labelled reference images and follows exact quoted words for headlines."}
    - {name: "Nano Banana Pro", why: "Mixes many reference images and is Google's pick for assets where the text must be right."}
    - {name: "FLUX.2", why: "Gives tight control when the prompt leads with the subject and ties each hex colour to one object."}
  inputs:
    - "The lock lines from your truth sheet, so the product's details repeat word for word"
    - "A sharp front-on photo of the real pack and one of it in use, labelled by role"
    - "Your exact brand colours as hex codes and the name of your headline font"
    - "The approved picture from the last round, so a fix starts from it"

terms:
  - term: Reference photo
    meaning: A photo attached to the prompt so the image tool can copy one thing from it, such as the product or the layout.
  - term: Lock lines
    meaning: The few visible product details every prompt repeats word for word, so the product doesn't drift.
  - term: Placeholder
    meaning: Stand-in text in a layout sketch, such as "HEADLINE HERE", that marks where real words will go.
