new_slug: stop-paying-for-the-same-ai-mistake-twice
name: Stop paying for the same AI mistake twice
summary: Every correction on an AI ad becomes a one-line rule, checked before your next job.
job: check-ads

headline: "Stop paying for the same AI mistake twice"
subhead: Paste the feedback someone gave on a finished image or clip. It sorts each point into a lasting rule or a one-off taste, for any brand or only yours, writes each rule so you can check it, and lists the rules before your next job.

explain: |
  AI images and clips repeat the same mistakes: a pack torn open at the wrong edge, a hand floating in the air, a lid that vanishes between clips. If nobody writes the fix down, you pay for it again on the next job.

  This skill keeps two lists. The general list holds rules true for any product, and it comes with ten, such as "hands in full" and "no generated children". Your brand list holds rules about your product only, like where your pack tears. For each piece of feedback it keeps the person's words, decides whether it's a lasting rule or a one-off taste, picks the right list, and counts repeats instead of writing them twice. Each rule is written both ways (do this, never that) in 40 words or fewer, with its reason. Before you make anything, it hands you the rules for that kind of work.

when:
  - Someone has just corrected an AI image or clip and you want the fix to stick.
  - You're about to brief, prompt or check AI ad work and want the known mistakes in front of you.
  - The same kind of mistake keeps coming back across jobs.

you_give:
  - The feedback on a finished piece, in the person's exact words (optional)
  - Your brand's own rules list, if you have one (optional)
  - What you're making next, whether copy, images or video (optional)
you_get:
  - Each piece of feedback sorted into a lasting rule or a one-off, general or your brand only
  - New or updated rules, written both ways, with a reason and the kind of work they cover
  - Repeat counts for rules already on the list
  - The rules for your next job, as a short list to paste into the brief

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste the feedback exactly as it was given, even if it's blunt.
  - Paste your brand's rules list if you have one, and say what you're making next.
  - Copy the new rules into your brand file, and the "apply" list into your next brief or image prompt.
  - Run it again every time someone corrects a finished piece.

how_it_works:
  - title: Keeps two lists apart
    text: General rules must hold for any product (would it hold for a serum, a frying pan and a jacket?). Brand rules are about your product only.
  - title: Applies rules before making
    text: Gives the rules for each kind of work to whoever writes the brief or prompt, and checks the finished piece against them.
  - title: Sorts each piece of feedback
    text: Keeps the person's words, then decides if it's a lasting rule or a one-off taste, and which list it belongs in.
  - title: Counts repeats
    text: If the rule is already listed, it adds one to its count instead of writing it twice. Rules that keep coming back move up.
  - title: Writes the rule both ways
    text: What to do and what never to do, checkable on a finished piece, 40 words or fewer, with a reason.
  - title: Updates your brand file
    text: Copies confirmed rules about how your product looks and is used into the product's record, so the fact lives there too.

output_shape: |
  FEEDBACK SORTED
  <n> "<the person's words>"
      <lasting rule or one-off>. <general or brand list>.
      <new, or already listed: count +1>

  NEW BRAND RULE (or UPDATED GENERAL RULE)
  <rule name> (<copy, images, video>)
  Do: <what to do, checkable on a finished piece>
  Never: <what never to do>
  Why: <what went wrong, in one sentence>
  Seen: <count>
  <note on what the brand file already says>

  APPLY BEFORE THE NEXT <job> (<kind of work>)
  - <each rule that applies, as a line to paste into the prompt>
  - MISSING: <any product fact the rules need>

example:
  business: sprout
  input: |
    [the skill]

    Feedback on yesterday's three kitchen images, from the brand
    lead:
    "Two of them have the daily pack torn down the side. We tear
    across the top. Always.
    In the palm one the gummies are coming out of the bottom
    corner.
    And they look like little jelly cubes. They're bears.
    Also could the counter be lighter?"

    Our brand list: empty so far.
    Our brand file says: the daily pack is torn straight across its
    top edge, never the side, bottom or a corner. Gummies pour out of
    the torn top. Gummies are small opaque deep-green bears, soft
    matte, about thumbnail height.
    Next job: a new set of kitchen images.
  output: |
    FEEDBACK SORTED
    1 "torn down the side. We tear across the top"
      Lasting rule. Already on the general list (How the thing is
      opened, held and used). Count +1. The exact edge is about one
      product, so it also becomes a brand rule.
    2 "coming out of the bottom corner"
      Lasting rule. Already on the general list (Say the whole
      action). Count +1.
    3 "they look like little jelly cubes. They're bears"
      Lasting rule. Brand list (one product's look).
    4 "could the counter be lighter?"
      One-off taste for this set. Not a rule. Change it in the next
      prompts only.

    NEW BRAND RULE
    Sprout daily pack, how it opens (images, video)
    Do: tear the daily pack straight across its top edge; gummies
    come out of the torn top into a palm or bowl.
    Never: a side, bottom or corner tear, or gummies coming out
    anywhere else.
    Why: two of three images showed a side tear, one a corner pour.
    Seen: 1

    NEW BRAND RULE
    Sprout gummies (images, video)
    Do: small opaque deep-green gummy bears, soft matte, about
    thumbnail height.
    Never: cubes, clear jelly or glossy sweets.
    Why: the gummies came back as jelly cubes.
    Seen: 1
    Your brand file already says both things. The prompts didn't
    repeat them, so both rules are about repeating them.

    APPLY BEFORE THE NEXT KITCHEN SET (images)
    - Describe pack and gummies once, the same way, in every prompt:
      "small flat daily pack torn straight across its top edge;
      small opaque deep-green gummy bears, soft matte".
    - Say the whole action: which hand holds the pack, torn top
      tipped down, gummies falling from the top into the open palm.
    - Hands in full: thumb and fingers placed, no hand over the
      pack's printing.
    - A real scene: gummies land and rest; pack, gummies and hand
      agree in size (gummies about thumbnail height).
    - One look across the set: the same pack and bears in every
      image.
    - Opened only the real way: if the big pouch is in shot, it
      stays closed at its resealable top, never torn (brand file).
    - No generated children. No generated person shown as a
      customer or as the founder.
    - This set only: a lighter counter.

tweaks:
  - what: What you're making next
    how: Say "video" and it adds the video-only rules (everything in view from the first frame, no counting on fingers, one state per object). Say "copy" and it keeps only the rules that apply to words.
  - what: Your brand list
    how: Paste your existing brand rules and it will count repeats against them instead of starting new ones.
  - what: One-off or rule
    how: If you know a comment is a lasting rule ("always the top edge, never the side"), say so. Otherwise it treats a single person's taste on one image as a one-off.
  - what: Moving a rule to the general list
    how: A general rule learned on your brand applies to you at once, and to other brands only after a person confirms it.

judge:
  - Every rule can be checked by looking at a finished image or clip. "Make hands better" isn't a rule.
  - Every rule has a reason and says which kind of work it covers.
  - Nothing about your specific product ended up on the general list.
  - Repeats were counted, not written twice.
  - One person's taste on one image was not turned into a standing rule.

test:
  - Paste feedback where you already know the answer, with one real rule and one taste comment in it. It should keep the rule and leave the taste as a one-off.
  - Paste the same correction twice, a week apart. The second run should add one to the count, not write a new rule.
  - Give it a rule about your product and check it lands on your brand list. Ask the skill's own question about it (would it hold for a serum, a frying pan and a jacket?).
  - Paste its "apply" list into your next image prompt and compare the results with your last batch. The corrected mistakes should not come back.

improve:
  - Add your brand list to the bottom of the skill file, under the general list, so every run starts with your rules in place.
  - Write your product's opening and use steps into your brand file in the same words the rules use, so prompts and rules never disagree.
  - If you only make images, delete the video-only rules from the general list to keep the "apply" list short.
  - Pair it with the skill that plans and checks AI images and clips. Its failure notes are the feedback this skill turns into rules.

terms:
  - term: General list
    meaning: Rules true for any product, such as hands described in full and no generated children.
  - term: Brand list
    meaning: Rules about your product only, such as how your pack opens or what colour your gummies are.
  - term: One-off taste
    meaning: A preference about one image that shouldn't become a standing rule.
