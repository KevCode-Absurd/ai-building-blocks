new_slug: stop-strangers-scrolling-with-a-story-ad
name: "A story-style ad strangers stop to read"
summary: "Give it your customers' words about the problem. You get a picture idea and a short story ad."
job: write-ad-copy

headline: "A story-style ad strangers stop to read"
subhead: Give it your customers' own words and the claims you may make. It finds the moment the old way stopped working, picks a picture of that moment, writes a 120 to 260 word story, and says what the page it opens must start with.

explain: |
  People scrolling at night aren't shopping. They skip anything that looks like an ad in a fraction of a second. A picture of a moment they've lived through, like a shelf of supplements they gave up on, gets the look a product photo never gets.

  This skill builds that kind of ad in three checks. Stop: the picture is unexpected and about the problem. Sort: people with the problem see themselves, and nobody is told what they have. Follow: the story's first line picks up the picture, and the page opens on the same moment. The story moves the way people switch: the moment it got too much, what they kept doing, why they doubted new things, and what's different here.

when:
  - You want to reach people who have never heard of you, and your product ads only reach people who already know you.
  - Your reviews keep describing the same moment, and you want an ad built on it.
  - You have a page that teaches the problem before it sells, or you're about to build one.

you_give:
  - Customer words about the problem (reviews, emails, call notes), with where each came from
  - Your product facts, the claims you may make and what you never say
  - Who the buyer is and what they use now (optional)
  - Who may tell the story, such as the founder or a customer who agreed (optional)
  - The page the click will open (optional)
you_get:
  - A pass or fail on whether the problem can carry a story ad
  - A picture plan with a starter image prompt, and the story with its exact word count
  - The line under the picture, and what the page's first screen must say
  - Flags on quotes and inferred lines, plus two tests to run

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste five or so reviews that describe the problem, each with its number or source.
  - Paste your product facts and your approved and banned claims.
  - Say who may narrate. If nobody has agreed, leave it out and the brand tells the story.
  - Read the page line. If it says the page is missing, build that page before you spend on the ad.

how_it_works:
  - title: Finds the push
    text: Looks for the moment in your reviews when the old way stopped being bearable. With no such moment, it stops and suggests a direct product ad.
  - title: Finds the evidence
    text: Asks whether the problem leaves a trace in a place, on a thing, on the body, in words, or nowhere safe to photograph, and picks the matching picture skill.
  - title: Checks stop and sort
    text: The picture must look out of place in a feed, and someone with the problem must know what it's about with no caption.
  - title: Writes the story
    text: 120 to 260 words in four parts (the moment, the habit, the doubt, what's different), with the first 125 characters picking up the picture.
  - title: Writes the line under it
    text: A short caption line of about 27 characters that never names the product or the reader's health.
  - title: Sets where the click goes
    text: Says what the page's first screen must repeat, so the click feels like the next page of the same story.
  - title: Plans the tests
    text: Two pictures against one story first, then a second opening on the winner.

output_shape: |
  PUSH       <pass or fail, with the buyer's words and source>

  PICTURE
  Trace:     <place | thing | body | words | nowhere safe | moment>
  Skill:     <picture skill to use>
  Scene:     <what's in the frame, no product, no words>
  Wonder:    <what it makes people ask>
  Starter prompt: <40 to 80 words>

  STORY  (opener: <type> / narrator: <who> / <word count> words)
  <push> <habit> <doubt> <pull> <one line to the page>

  LINE UNDER THE PICTURE   <words> (<caption line>, <characters>)
  PAGE      <what the first screen must say, or MISSING>
  FLAGS     <permissions, inferred lines, claims used>
  TESTS     1. <two pictures, one story>  2. <second opening>

example:
  business: sprout
  input: |
    [the skill]

    Buyer: the gut-fix seeker, 25 to 55, mostly women. Bloating and
    irregularity. Uses now: fiber powders and probiotics.

    Customer words:
    7. "My bowel movements are normal for the 1st time in 15 years!"
    8. "The prebiotics do their job, but not aggressively, and I feel
       like my overall digestion has improved." (brand site)
    9. "[Sprout] have been the solution to my problems with
       regularity." (retailer)
    10. "Feel lighter, less bloated and overall good." (retailer)

    Product: Sprout, a daily pack of greens gummies, 6 g prebiotic
    fiber. Low Sugar or Sugar-Free.
    Allowed: "Supports digestion and gut health." Survey line, always
    "of surveyed users": "67% ... experienced better, more regular
    digestion."
    Never: "fix", treats IBS, a result in a set time.
    Narrator: nobody has agreed. Destination page: none yet.
  output: |
    PUSH       Pass, but thin. Buyers name the problem ("problems with
               regularity", 9; "less bloated", 10) and the fixes they
               tried, not one dated moment. The shelf of old fixes is
               the moment they'd recognise.

    PICTURE
    Trace:     on a thing (what's left over)
    Skill:     make-people-look-twice-at-the-leftover-mess
    Scene:     an open kitchen cupboard, one shelf holding a fiber
               powder tub, a bottle of capsules and a bag of prunes
    Wonder:    why does one shelf hold three fixes for one stomach?
    Starter prompt: Square 1:1 phone photo into an open kitchen
    cupboard at eye level, evening kitchen light. One shelf: a plain
    tub of fiber powder with a crusted scoop, an unbranded bottle of
    capsules, a half-empty bag of prunes clipped shut. Slight tilt, a
    little grain, a rice jar and mugs at the edges. No logos, no
    readable labels, no product, no person, no text.

    STORY  (opener: describe the frame / narrator: the brand / 197 words)
    There's a shelf like this in a lot of our customers' kitchens. A
    tub of fiber powder with the scoop crusted inside. A bottle of
    probiotic capsules. A bag of prunes, clipped shut.

    Every one of them went up there for the same stomach. Customers
    tell us about the bloating and the "problems with regularity",
    sometimes for years.

    The shelf makes sense. Everyone says eat more fiber, so you buy
    the powder. Then the capsules, in case it's the gut bacteria.
    Then the prunes. Each one asks for its own step every day, and the
    steps slip the moment a week gets busy.

    So when something new turns up, it's fair to think: another tub
    I'll stop taking.

    Here's what's different. Sprout puts 6 g of prebiotic fiber into
    one small pack of gummies. You tear the top and eat them. No
    water, no mixing, nothing to wash. One customer said the
    prebiotics "do their job, but not aggressively". Another said they
    "feel lighter, less bloated and overall good". In our survey, 67%
    of surveyed users experienced better, more regular digestion.

    We wrote up what we've learned about fiber people keep taking.
    It's on one page, below.

    LINE UNDER THE PICTURE   One stomach. Three fixes. (plain caption, 25)
    PAGE      MISSING: a page that opens on the same shelf and the
              line "There's a shelf like this...". It explains why gut
              fixes don't stick, signed by the Sprout team. Product and
              offer near the end. Point sensitive stomachs to Low Sugar.
    FLAGS     Reviews 8 and 10 aren't marked verified: get permission
              before quoting them in paid ads. Review 8 is cut before
              it mentions IBS. Inferred: the prunes, the busy week.
              Review 7 left out: in a story for strangers it reads as
              a promise.
    TESTS     1. This shelf against keep-people-reading-with-a-hand-
              drawn-story, same story.
              2. Winner with a date opener: "Most shelves we hear
              about started with one tub in January." (inferred)

tweaks:
  - what: The customer words you paste
    how: The story borrows their phrases, so the reviews set its voice. Paste powder quitters' reviews and you get a story about the shaker in the sink, with a different picture.
  - what: Who narrates
    how: A founder with facts on record gets a first-person story. Leave it out and the brand speaks, summing up what customers say. It never invents a customer or an expert.
  - what: The picture trace
    how: Name a trace (a place, a thing, words) if you already know what stops your buyers. The first line is then written to pick up that picture.
  - what: The length
    how: Ask for about 120 words for a quick read, or up to 260 when the doubt needs answering in full. It stays inside that range.

judge:
  - Cover the product name. The picture and the first line should still make sense.
  - The first 125 characters pick up what the picture makes people wonder.
  - Every quoted phrase matches a review word for word. Check two against your reviews page.
  - No price, discount or product page link appears in the story.
  - Nothing says the product treats a condition or works in a set time.
  - The word count shown is between 120 and 260. Paste the story into a word counter to confirm.

test:
  - Run it on the problem your most reviews talk about. The push should pass and the picture should be something a buyer would recognise.
  - Run it on a product people buy only for its looks. It should fail the push and suggest a direct product ad.
  - Run it twice on the same reviews. The trace and the wonder line should match, and every quote must still match a review.
  - Show the story and your current best ad to someone who doesn't know your brand. Ask which one they'd keep reading, without saying which is new.

improve:
  - Write your approved claims and never-say list into "What you need" in the skill file, so you don't paste them each time.
  - If a founder or customer agreed to tell their story, add the facts on record about them under "Who may narrate".
  - Delete the traces in step 2 your business can't show, so it only picks pictures you can make.
  - When a picture and opening win, save them in your brand file and name them in your next run.
  - Pair it with a skill that writes the page the click goes to, and run the finished ad through the Facebook ad rules check.

terms:
  - term: Story ad
    meaning: An ad made to look like a normal post, with a picture and a short story under it instead of a product pitch.
  - term: Push
    meaning: The moment the old way stopped being bearable for the buyer. It's what makes people start looking for something new.
  - term: See more
    meaning: The link Facebook and Instagram add when the main text is long. Only the first line or two show before it.
