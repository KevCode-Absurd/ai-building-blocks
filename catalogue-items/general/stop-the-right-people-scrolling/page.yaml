new_slug: stop-the-right-people-scrolling
name: "Openings that stop the right people scrolling"
summary: "Give it your buyer, offer and proof. You get new openings, or a score and a fix for ones you run."
job: write-ad-copy

headline: "Openings that stop the right people scrolling"
subhead: Give it a brief on your buyer, your offer and proof, and either "write" or "score". It writes hooks that flag your buyer and promise a gain, or scores your hooks on four checks plus an honesty gate, with a fix for any under 3.

explain: |
  A hook is the first line of an ad, or its first seconds, that makes someone stop scrolling. Odd hooks stop people but often the wrong ones. Clever hooks hide what the reader gets, so the people who'd buy keep scrolling.

  This skill follows rules that mail-order advertisers proved with split tests nearly a century ago. The opening that sells flags down the right reader, offers them a gain, and brings news. Curiosity works only when it points at that gain. To write, it decides what the hook must name from how aware the buyer is, then spreads hooks across gain, news and curiosity. For video, it writes what's seen, read and heard, so the hook works with the sound off. To score, it checks each hook for Flags, Gain, New and Clear, then fails any that break the honesty gate.

when:
  - You need new openings for a video, image ad or post and want them aimed at the right buyer.
  - You have a list of hooks and want to know which to keep before you spend money testing them.
  - Your hooks get attention but the wrong people stop.

you_give:
  - A brief on the buyer, how aware they are and what stops them
  - Your offer and the proof you may claim
  - Write (how many, which format) or score (paste your hooks)
  - The line that follows the hook (optional, but best)
  - Your voice notes and claims you must never make (optional)
you_get:
  - In write mode, hooks spread across gain, news and curiosity, each with its next line, and for video what's seen, read and heard
  - In score mode, each hook's four checks, a score out of 4, the honesty gate, and a fix for any under 3
  - The buyers your set of hooks misses

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste a brief on your buyer and the proof you're allowed to use.
  - Write "Mode, write, 6 hooks, 20-second video", or "Mode, score" with your hooks pasted below.
  - Paste the line that comes after each hook, so it can check the hook gets paid off.
  - In score mode, fix the hooks under 3 first. Drop any that fail the gate.

how_it_works:
  - title: Flags the buyer
    text: Names the buyer's moment in words they'd use, so the right person knows it's for them.
  - title: Matches their awareness
    text: An unaware buyer gets their situation. A ready buyer gets the deal. Each level in between gets its own job.
  - title: Spreads three appeals
    text: Gain is the default. News only when it's true and new. Curiosity only when the answer is the gain.
  - title: Writes for sound off
    text: For video, it writes what's seen, read and heard, with movement and the brand early, all carrying one message.
  - title: Scores four checks
    text: Flags, Gain, New and Clear, one point each. Keep 3 or 4, fix anything under 3.
  - title: Applies the honesty gate
    text: Any fact not in your proof, a banned claim, or a line telling viewers they have a body condition fails the hook.

output_shape: |
  Write mode:
  <n>. <the hook>
     Appeal:    <gain / news / curiosity>
     Names:     <what it names for this awareness level>
     Next line: <the line that pays it off>
     Video:     seen <...> / read <...> / heard <...>

  Score mode:
  <n>. "<the hook>"
     Flags <0/1>  Gain <0/1>  New <0/1>  Clear <0/1>  = <score>/4
     Gate: <pass / fail, why>
     Fix:  <one line, for any under 3>

  MISSED
  <buyers or moments no hook flags>

example:
  business: sprout
  input: |
    [the skill]

    Mode: score
    Buyer: people who quit greens powders and pill stacks. They want one
    habit that lasts. Solution aware; they may not know Sprout yet.
    Proof: 60+ ingredients, 21 vitamins & minerals, 6 g fiber per pack.
    Approved wording is "supports", never "fix".

    Hooks (live ads):
    1. 'Sprout is too expensive': here's 61% off to prove otherwise
    2. Fix the Hot Girl Tummy
    3. One Step I Never Skip
    4. Struggling to Get Enough Fiber?
    5. The Daily Nutrition Every Runner Forgets
    6. He Asked What Day It Was. I Handed Him a Gummy.
  output: |
    WARNING
    MISSING: next line. Each hook is scored alone, so a hook the next
    line drops won't show up here.

    1. "'Sprout is too expensive': here's 61% off to prove otherwise"
       Flags 0  Gain 1  New 1  Clear 1  = 3/4
       Gate: fail. "61% off" isn't in the proof you gave.
       Fix:  check 61% against the live offer. Even then, a deal hook
             suits people who know Sprout, not quitters who may not.

    2. "Fix the Hot Girl Tummy"
       Flags 0  Gain 1  New 0  Clear 0  = 1/4
       Gate: fail. "Fix" breaks the approved "supports".
       Fix:  for gut buyers, name the problem plainly and use
             "supports".

    3. "One Step I Never Skip"
       Flags 1  Gain 1  New 0  Clear 1  = 3/4
       Gate: pass. The "I" must be a real person, not an AI presenter.
       Keep. Never skipping is what this buyer wants.

    4. "Struggling to Get Enough Fiber?"
       Flags 0  Gain 0  New 0  Clear 1  = 1/4
       Gate: pass
       Fix:  save it for fiber buyers, and add what they get.

    5. "The Daily Nutrition Every Runner Forgets"
       Flags 0  Gain 0  New 0  Clear 1  = 1/4
       Gate: pass
       Fix:  it flags runners. Keep it for them, not for quitters.

    6. "He Asked What Day It Was. I Handed Him a Gummy."
       Flags 0  Gain 0  New 1  Clear 1  = 2/4
       Gate: pass
       Fix:  tie the odd moment to the habit, such as the half-used
             powder tub, so it flags the quitter.

    MISSED
    Only hook 3 flags the quitter. Run write mode for that buyer, with
    gain hooks about keeping the habit.

tweaks:
  - what: Write or score
    how: Score your current hooks before writing new ones. You'll see which buyer each one flags, and the fixes often beat starting over.
  - what: Which buyer
    how: Flags and Gain depend on the buyer you name. A deal hook scores well for people who know you and badly for people who don't, and that's useful to know.
  - what: The next line
    how: Paste it. Without it, hooks are scored alone with a warning, because a hook the next line drops loses the viewer anyway.
  - what: Mix of appeals
    how: Ask for "mostly gain" or "include two news hooks" if you know what your buyers respond to.

judge:
  - Every hook is one idea in plain words, with no made-up term.
  - No hook states a fact you didn't supply.
  - Every curiosity hook says or shows what the reader gets.
  - No hook tells the viewer they have a health or body condition.
  - In score mode, every hook under 3 has a fix you could use today.

test:
  - Score a hook you know won and one you know lost. The winner should score higher. If it doesn't, check the buyer you named.
  - Score the same hooks twice. The scores should match within one point.
  - Write hooks, then score them in a second run. The hooks it wrote should score 3 or 4 and pass the gate.
  - Plant a hook with a number that isn't in your proof. The gate should fail it.
  - Run its best hook against your current one, with the same next line after both.

improve:
  - Write your buyer's moment, in their words, into step 1 of the write steps in the skill file.
  - Add your never-say list and health claim rules to "What you need", so the gate catches them every time.
  - If you mostly make video, add your own first-frame rules to step 4 (for example "show the pack in a hand").
  - Save each winning hook with its next line to your brand file, since the two work together.
  - Pair it with "Get openings to test that each try something different" for more ways in.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Hooks are short and the checks are plain, so any current chat AI does this well."}
    - {name: "Meta Ad Library", why: "Shows the ads other brands run now, so you can check a hook isn't one buyers already see everywhere."}
    - {name: "Meta Ads Manager", why: "Exports results for each ad, so score mode can be checked against the openings you ran."}
  inputs:
    - "Your past hooks with their results, so new ones avoid what already failed"
    - "Stills from the first three seconds of your video, so the 'seen' layer matches the real footage"
    - "Short phrases buyers use in reviews, so the flag uses their words"

terms:
  - term: Hook
    meaning: The first line, or the first seconds of a video, that makes someone stop scrolling.
  - term: Appeal
    meaning: What the hook offers to make someone stop, such as a gain, a piece of news or a question.
  - term: Next line
    meaning: The sentence that comes right after the hook. It must pay off what the hook started.
