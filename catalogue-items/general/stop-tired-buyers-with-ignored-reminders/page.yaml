new_slug: stop-tired-buyers-with-ignored-reminders
name: Stop tired buyers with the reminders they ignore
summary: A generic lock screen showing the reminders your narrator keeps setting, and ignoring, because of the problem.
job: make-image-ads

headline: A screenshot of the reminders your buyer keeps ignoring, in their phone's own voice
subhead: Give it your story ad. It writes one to four short reminders with times, each something the narrator does because of the problem, and a prompt for a plain lock screen where they've piled up.

explain: |
  Everyone knows what their own ignored reminders look like. A stack of them on a lock screen ("Vitamins.", "Vitamins. Still on the counter.") shows the workaround in the phone's own voice, and the person who has the same reminders sees themselves at once. It suits routines people can't keep: a cream twice a day, a supplement, a bedtime, a chore that keeps coming round.

  The skill writes one to four reminders of three to eight words, each with a time, each something the narrator set because of the problem as your story tells it. Repetition does the work, so the same reminder minutes or hours apart is often stronger than four different ones. The lock screen is generic and copies no real phone's look, and no reminder pretends to come from an app, a shop or a clinic, or mentions your product.

when:
  - Your story is about a routine the narrator can't keep, or a chore that keeps coming back.
  - The narrator has tried to fix it with reminders or alarms.
  - Your buyer's problem has a time of day, like the school run or bedtime.

you_give:
  - Your approved story ad, with the routine the narrator sets reminders for
  - When in the day the problem happens (optional)
  - Whether words on the image are on or off (optional, default on)
you_get:
  - One to four reminders, each with its exact text and time
  - The lock screen layout and the time it shows
  - A blank version and the headline under the image
  - A 60 to 120 word image prompt, ready to paste

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste your story ad underneath. If it quotes the reminders, they'll be used word for word.
  - Paste the image prompt into your image tool and make one square picture.
  - Check each reminder's text and time in the result. Image tools mix up numbers.
  - If the screen looks like a particular phone brand, ask again for "a generic lock screen".

how_it_works:
  - title: Sets the ground rules
    text: Square, looks like a phone screenshot, no logo, price, button, product or real phone look.
  - title: Writes the reminders
    text: One to four reminders of 3 to 8 words, each with a time, each something the narrator does because of the problem.
  - title: Briefs a generic lock screen
    text: The time, a plain wallpaper, and the reminders stacked as notification cards.
  - title: Gives every word exactly
    text: Each reminder's text and time, as a real-looking screenshot crop.
  - title: Describes the blank version
    text: The same screen with the notification area empty.

output_shape: |
  SCENE
  <one sentence: what someone scrolling would say they saw>

  WHERE AND WHEN
  <the screen and the time shown>

  THE SCREEN
  <lock screen or list, wallpaper, clock>

  REMINDERS
  <time>  <reminder, 3 to 8 words>
  <1 to 4 reminders, newest on top>

  WORDS ON THE IMAGE
  <the reminders and times, exactly as written, plus the clock>
  BLANK VERSION
  <the screen with an empty notification area>
  HEADLINE UNDER THE IMAGE
  Read this if you've snoozed this one too.

  FLAGS
  <lifted or written for the image; anything inferred>

  IMAGE PROMPT
  <60 to 120 words, ready to paste>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on reviews 15 and 16):
    My phone has three school-morning reminders.
    7:15: "Kids vitamins. Before shoes."
    7:30: "Vitamins. Still on the counter."
    7:45: "Did anyone take the vitamins?"
    Most mornings the answer was no.
    I'd tried all of the green options for the kids. Sprout Kids is
    the only one mine love eating: 6 Strawberry Burst gummies in a
    daily pack, for ages 2 to 13. They think it's a treat. I grab my
    own pack on the way out the door.

    Buyer: the busy parent, 30 to 45, mostly mums. Problem time: the
    school run.
  output: |
    SCENE
    A phone lock screen on a school morning with three ignored
    vitamin reminders stacked up.

    WHERE AND WHEN
    A phone screen at 7:52 am.

    THE SCREEN
    A generic lock screen: large clock "7:52" at the top, plain pale
    grey wallpaper, three notification cards stacked, newest on top.

    REMINDERS
    7:45   Did anyone take the vitamins?
    7:30   Vitamins. Still on the counter.
    7:15   Kids vitamins. Before shoes.

    WORDS ON THE IMAGE
    The three reminders and times above, exactly as written, plus the
    clock "7:52".

    BLANK VERSION
    The lock screen with the clock and an empty notification area.

    HEADLINE UNDER THE IMAGE
    Read this if you've snoozed this one too.

    FLAGS
    Reminders lifted from the copy, word for word.
    "7:52" is not in the story. It was chosen to sit after the last
    reminder (inferred).
    Each card is labelled only "Reminder". No app name or icon.
    The wallpaper is a plain colour, not Sprout's green or yellow.
    No children on screen or in a wallpaper photo. Claims about
    children get extra scrutiny, and the reminders make none.

    IMAGE PROMPT
    Square 1:1 cropped phone screenshot of a generic lock screen with
    a plain pale grey wallpaper and a large clock reading "7:52" at
    the top. Below it, three stacked notification cards, each
    labelled only "Reminder" with a plain grey square icon. Newest on
    top: "Did anyone take the vitamins?" 7:45, then "Vitamins. Still
    on the counter." 7:30, then "Kids vitamins. Before shoes." 7:15.
    Text and times spelled exactly. Slightly cropped like a shared
    screenshot, ordinary phone screen look. No real phone maker's
    icons or fonts, no app names, no logo, no brand name, no product,
    no emoji, no photo, no person.

tweaks:
  - what: Same reminder or different ones
    how: Ask for "the same reminder three times" for a routine people forget (a cream, a pill). Reminders that get sharper, like these, suit a routine that keeps slipping.
  - what: How many
    how: One reminder is quiet and sad. Three is the pile-up most people recognise. Four is the limit before it's hard to read.
  - what: Lock screen or list
    how: Ask for "a reminders list" instead of a lock screen when the story is about a chore that repeats over days or weeks, not hours.
  - what: The time on the clock
    how: Set it to the moment your story's problem peaks. A clock a few minutes after the last reminder shows it was ignored.

judge:
  - Every reminder is one the narrator set for themselves. None looks like it came from a real app, bank, clinic, shop or courier.
  - No reminder is a sales message or names your product.
  - Each reminder is something a person would set.
  - There are four reminders or fewer, and every time and word is right.
  - The screen copies no real phone's look or icons.

test:
  - Run it on a story that quotes the reminders. They should appear word for word, in time order, newest on top.
  - Run it on a story about something people buy once. It should send you to the sticky note or the old-thing picture instead.
  - Check every time and number in the finished picture against the reminders list. Image tools swap digits.
  - Show it to someone who fits your buyer and ask "is this your phone?" A nod is the result you want.

improve:
  - Add your buyer's problem times (the school run, bedtime, the first of the month) to the brand file section, so the clock fits every time.
  - Add a fixed wallpaper colour to step 3 that is never your brand colour, so the screen never looks like your ad.
  - Put the reminders in your story word for word, with their times, so nothing needs extra checking.
  - Pair it with the everyday snapshot skill on the same morning, and test which one stops more people.

terms:
  - term: Lock screen
    meaning: What a phone shows before you open it, with the time and notifications.
  - term: Story ad
    meaning: An ad whose main text tells one person's story in their own words, like a post from a friend.
  - term: Blank version
    meaning: The same picture with no words, so you can change the words later without starting again.
