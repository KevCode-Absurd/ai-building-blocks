new_slug: stop-your-buyer-mid-scroll-with-a-snapshot
name: Stop your buyer mid-scroll with an everyday snapshot
summary: A phone-photo style picture of the moment your buyer's problem hits, with a ready-to-paste image prompt.
job: make-image-ads

headline: A picture of your buyer's own bad moment, so they stop before spotting the ad
subhead: Give it your story ad. It finds the moment in the story where the problem hits, casts a made-up person to live it, and writes a prompt for a plain phone photo with no product, no logo and no words.

explain: |
  Most image ads look like ads: a product on a clean background, a price, a button. People scroll past them on reflex. This skill makes the picture for a story ad (an ad whose text tells one person's story) look like a photo someone took of their own morning, so the right buyer recognises the moment before deciding it's an ad.

  It reads your story and picks the exact moment the problem bites: where, what time, what the hands are doing. Then it describes a made-up adult in ordinary clothes, in a real room, framed the way a phone would catch it, with the strain shown in posture and hands instead of a pulled face. It's the safest first picture to test, and the one to fall back on when other picture types can't be made honestly from your story.

when:
  - You have a story ad and need its first picture, and you don't know which type to try.
  - Another picture type can't be made honestly from your story (no note, no review, no sourced fact).
  - Your current image ads show the product on a clean background and people scroll past them.

you_give:
  - Your approved story ad text, with its opening line
  - Who the buyer is and when the problem hits them (optional)
  - Your brand's places, light and anything you never show (optional)
you_get:
  - The scene, the moment and the person, described in a few lines
  - The headline to run under the image
  - A 60 to 120 word image prompt, ready to paste into your image tool
  - Flags for anything it had to guess

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste your story ad underneath, exactly as it will run.
  - Add one line on who the buyer is and when the problem hits, if the story doesn't say.
  - Paste the image prompt into your image tool and make one square picture.
  - Put the picture next to your story's first line. If the person is posing or smiling, make it again.

how_it_works:
  - title: Sets the ground rules
    text: Square, looks taken on a phone, no logo, price, button, brand colour or product, and any person is a made-up adult.
  - title: Finds the moment
    text: Takes the moment from your story's opening or breaking point, with the place, the time and what the hands are doing.
  - title: Casts a made-up person
    text: Describes an adult who fits your buyer, in ordinary clothes, not posing. Hands, a shoulder or a view from behind is often enough.
  - title: Frames it like a phone photo
    text: Slightly off-centre, a real room or car, daylight or lamp light.
  - title: Shows the strain honestly
    text: Puts the problem in posture and hands, never a face pulled for the camera. For a problem on the body, it shows the routine or workaround instead.
  - title: Writes the prompt
    text: Hands back the scene, the headline under the image, any flags and the image prompt.

output_shape: |
  SCENE
  <one sentence: what someone scrolling would say they saw>

  WHERE AND WHEN
  <place, time of day, what is within reach>

  THE MOMENT
  <what the hands and body are doing>

  THE PERSON
  <made-up adult: age, look, clothes, which hand holds what>

  WORDS ON THE IMAGE
  None.

  HEADLINE UNDER THE IMAGE
  Read this if <the moment, as something they do, in their words>.

  FLAGS
  <anything inferred, and what stays out of the picture>

  IMAGE PROMPT
  <60 to 120 words, ready to paste>

example:
  business: sprout
  input: |
    [the skill]

    Story ad (approved, built on review 5 and the brand's own line
    about pills):
    Every morning at the kitchen sink: one huge multivitamin, a full
    glass of water, and three tries to get it down.
    Then the probiotic. Then the B12.
    Now it's one Sprout daily pack. Tear the top, eat the small
    handful of gummies inside. 60+ ingredients, 21 vitamins and
    minerals, 6 g prebiotic fiber. No water needed.

    Buyer: the quitter who wants to stick, 28 to 45, office jobs.
    Brand look: bright, sunny, everyday adults in casual clothes at
    home. Never clinical.
  output: |
    SCENE
    Someone at a kitchen sink in the morning, head tipped back,
    swallowing a pill with a full glass of water.

    WHERE AND WHEN
    A home kitchen, a weekday morning before work, sun through the
    window. Within reach: a plain tablet bottle with its lid off, a
    glass, keys and a work lanyard on the counter.

    THE MOMENT
    Head tipped back, right hand holding the glass to his lips, left
    hand gripping the edge of the sink. The second of the story's
    three tries.

    THE PERSON
    A made-up man in his mid 30s, plain blue work shirt, sleeves
    pushed up. Seen from the side and slightly behind, face mostly
    turned away. Not posing, not looking at the camera.

    WORDS ON THE IMAGE
    None.

    HEADLINE UNDER THE IMAGE
    Read this if your vitamins take three tries to get down.

    FLAGS
    Inferred: the work shirt and lanyard come from the buyer (office
    jobs), not the story.
    The bottle is plain and unlabelled, never a rival's.
    The pouch and daily packs stay out. They belong to the ending,
    and the picture only has to stop the person at the sink.
    Brand look kept: bright morning sun, a real kitchen, nothing
    clinical.

    IMAGE PROMPT
    Square 1:1 phone photo of a real home kitchen on a weekday
    morning, bright sun through the window. A made-up man in his mid
    30s in a plain blue work shirt, sleeves pushed up, stands at the
    sink, seen from the side and slightly behind, head tipped back,
    right hand holding a full glass of water to his lips, left hand
    gripping the sink edge. A plain white tablet bottle with its lid
    off sits by the tap; keys and a lanyard lie on the counter.
    Slightly off-centre, a little grain, no retouching, not posed. No
    text, no logo, no label, no product, no children, no smile.

tweaks:
  - what: The moment
    how: Point it at a different line ("use the breaking point, not the opening") and you get a different photo of the same story. Make two and test them.
  - what: Who is in the picture
    how: Ask for "hands only" or "seen from behind" if faces come out fake in your image tool. Hands are easier to get right and still read as a person.
  - what: The light
    how: Name the real light at that hour, such as "phone glow only" or "grey 7am light through blinds". Wrong light is the quickest way a snapshot starts to look staged.
  - what: The product
    how: It stays out by default. If you ask for it, it comes back small and to one side, never held up, and the picture has to work without it.

judge:
  - Read your story's first line, then look at the picture. They should be the same moment.
  - Your buyer would say "that's me", not "that's an ad".
  - Nobody is smiling at the camera, posing or pulling a pained face.
  - There's no product, logo, price or words in the picture.
  - The headline under the image describes something they do, not a condition they have.

test:
  - Run it on a story ad whose picture already worked. It should land on the same moment, or one your buyers would also know.
  - Run it twice on the same story. The moment should stay the same; only small details should change.
  - Show the picture without the text to someone who fits your buyer. Ask "what's happening here?" If they describe an ad, the light or the pose is wrong.
  - Test it against your current product-on-a-background image with the same text, so the picture is the only change.

improve:
  - Write your brand's places, light and time of day into the "What it reads from your brand file" section, so the room matches your world every time.
  - Add the things your image tool keeps sneaking in (a smile, a product, a logo) to the "Avoid" list in the skill file.
  - When a moment works, save it in your brand file as the buyer's moment, so the next story starts there.
  - Pair it with the skill that picks the right picture for a story ad, when you're not sure a snapshot is the best type.

terms:
  - term: Story ad
    meaning: An ad whose main text tells one person's story in their own words, like a post from a friend.
  - term: Image prompt
    meaning: The text you paste into an image tool to make the picture.
  - term: Headline under the image
    meaning: The bold line under the picture in a Facebook or Instagram ad.
