new_slug: stop-your-copy-sounding-like-ai
name: Stop your copy from sounding like AI
summary: Every line that reads as machine-written found, with a plain fix, from 18 patterns readers spot.
job: check-ads

headline: Copy that reads like a person wrote it, with every machine-sounding line found and fixed
subhead: Paste finished copy. It scans every line for 18 patterns readers have learned to spot, such as "no this, no that" lists, mirrored lines and questions it answers itself. You get each hit quoted, a plain replacement, a rhythm check and the full rewritten copy.

explain: |
  Readers now spot AI-written copy in a second, and many stop trusting it. The giveaways are patterns more than words: three short sentences that all start with "No", two lines that mirror each other, a question answered with "Absolutely", a closing line trying to be a quote.

  This skill checks copy against 18 named patterns, from dropped small words to company-voice excitement, and quotes every hit. For each, it writes a plain replacement using only facts already in the copy. If a fix would need a fact that isn't there, it marks it MISSING and cuts the flourish instead. It also checks rhythm: whole sentences, lengths that vary like speech, and short sentences only where the thought turns. A style trick your brand uses in its own copy can stay, but only on a line a person would still say.

when:
  - You used AI to write an ad, page or email and want to remove what gives it away.
  - Copy from a writer feels slick and empty, and you want to see why.
  - You want a last scan before publishing anything customers will read.

you_give:
  - The copy to scan
  - Your voice notes and the brand's own published phrases, so real brand habits can stay (optional)
you_get:
  - The number of hits, each quoted, named and given a replacement
  - A rhythm pass or fail, with the run of sentences that fails
  - The full copy rewritten with the fixes

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste the copy you want checked.
  - Paste your voice notes and a few lines your brand already uses, if you have them.
  - Read the hits list first, then the rewritten copy. Accept or reject each change.
  - For a script that will be spoken aloud, also run a read-aloud polish for scripts.

how_it_works:
  - title: Scans every line
    text: Checks each line against 18 named patterns, from "no" chains and mirror lines to stock openers and warm-ups.
  - title: Quotes each hit
    text: Every hit is quoted exactly, with the name of the pattern, so you can find it yourself.
  - title: Writes a plain fix
    text: Replaces each hit with plain wording, using only facts already in the copy.
  - title: Checks the rhythm
    text: Whole sentences, lengths that vary like speech, and no runs of short balanced lines.
  - title: Respects real brand habits
    text: Keeps a style trick your brand uses in its own copy, but only on a line a person would still say.

output_shape: |
  HITS: <n>
  <n>. "<the exact words>"
     Pattern:     <which of the 18>
     Replacement: <plain wording, using only facts in the copy>
  (repeat for each hit)

  RHYTHM: <pass / fail>, <the run of sentences that fails>

  REWRITTEN COPY
  <the full copy with every fix applied>

example:
  business: sprout
  input: |
    [the skill]

    Copy (email intro):
    1 Whether you're a busy parent or a gym regular, your nutrition
      matters.
    2 Sprout packs 60+ ingredients, 21 vitamins and minerals, and 6 g
      of fiber into one small daily pack of gummies.
    3 No powders. No pills. No shaker.
    4 Does it actually work? Absolutely.
    5 Less hassle. More greens.
    6 It's about more than vitamins.
    7 Level up your daily routine.
    8 Clinically tested for nutrient absorption.
    9 Rip. Tip. Enjoy.

    Brand's own lines: "Rip. Tip. Enjoy." / "Tastes like a treat,
    works like a supplement."
  output: |
    HITS: 7
    1. "Whether you're a busy parent or a gym regular,"
       Pattern:     stock opener
       Replacement: cut line 1 and open on line 2, the fact
    2. "No powders. No pills. No shaker."
       Pattern:     the "no" chain
       Replacement: You eat them straight from the pack, so there's no
                    shaker to wash.
    3. "Does it actually work? Absolutely."
       Pattern:     question it answers itself
       Replacement: It's clinically tested for nutrient absorption.
                    (the fact from line 8)
    4. "Less hassle. More greens."
       Pattern:     mirror lines
       Replacement: cut. Line 2 already says what you get.
    5. "It's about more than vitamins."
       Pattern:     "it" with no owner
       Replacement: cut. MISSING: what "more" means; the copy doesn't
                    say.
    6. "Level up your daily routine."
       Pattern:     hollow growth verb
       Replacement: cut. "One small daily pack" in line 2 already says
                    it.
    7. "Clinically tested for nutrient absorption."
       Pattern:     dropped small words
       Replacement: moved into hit 3 as a whole sentence

    KEPT
    "Rip. Tip. Enjoy." is the brand's own line, and it reads as plain
    instructions for the pack, so it stays.

    RHYTHM: fail. Lines 3 to 5 are six short sentences of the same
    length in a row.

    REWRITTEN COPY
    Sprout packs 60+ ingredients, 21 vitamins and minerals, and 6 g of
    fiber into one small daily pack of gummies. You eat them straight
    from the pack, so there's no shaker to wash. It's clinically tested
    for nutrient absorption. Rip. Tip. Enjoy.

tweaks:
  - what: Your brand's own lines
    how: Paste them. A brand that uses a three-beat rhythm in its own copy keeps it on lines that still make sense, instead of having every rhythm flagged.
  - what: What kind of copy
    how: This is for copy people read. For a spoken script, run a read-aloud polish as well, because speech has different tells.
  - what: Facts in the copy
    how: Replacements only use facts already there. If your draft is thin, expect MISSING notes and cut flourishes rather than new detail.
  - what: Only the hits
    how: Ask for "hits only, no rewrite" if you want to fix the lines yourself.

judge:
  - Every hit is quoted exactly as it appears in your copy.
  - No replacement adds a fact, claim or number that wasn't in the copy.
  - The rewritten copy keeps your meaning and order.
  - A fixed pattern hasn't turned into another one, such as a "no" chain becoming a matched pair.
  - Read the rewrite aloud. It should sound plainer, not cleverer.

test:
  - Run it on a paragraph you wrote and one an AI wrote for the same job. The AI one should get more hits.
  - Plant three patterns from the table in good copy, such as a "no" chain and a question it answers itself. It should catch all three.
  - Run it twice on the same copy. The hit list should be the same.
  - Paste your brand lines with the copy. It should keep a style trick your brand uses in its own copy, on a line a person would still say.
  - Read the rewrite next to the original. It should mean the same thing, in the same order.

improve:
  - Add your brand's real style habits (a three-beat line it uses, for example) to step 4 of the skill file, so they aren't flagged.
  - Add patterns your AI drafts hit often to the table, each with your own "Instead".
  - Cut table rows that never come up in your copy if you want a shorter skill to paste.
  - Save your most common hits to your brand file as things every writing request should avoid.
  - Pair it with "Edit a draft so it reads clean and sells" for a full editor's read, and "Make sure every ad sounds like your brand" if the rewrite lost your tone.

terms:
  - term: Pattern
    meaning: A recognisable shape of sentence, such as three short lines starting with "No", that makes copy sound machine-written.
  - term: Rhythm
    meaning: How sentence lengths rise and fall. Speech varies; machine copy often doesn't.
