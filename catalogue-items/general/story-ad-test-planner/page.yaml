new_slug: story-ad-test-planner
name: "Story ad test planner"
summary: "Paste your facts and reviews. Get a fit verdict, an honest narrator and four story tests."
job: plan-ad-tests

headline: "Story ad test planner"
subhead: Paste your product facts and numbered customer reviews. It checks whether a story ad suits the product, picks the problem to lead with and why buyers switch, then names an honest narrator. You get a setup sheet and four stories to test.

explain: |
  A story ad is an everyday-looking picture with a short story under it, posted like a normal post. It works when readers see their own experience in it. That needs buyers who have tried other fixes and dropped them. It also needs a narrator who is real.

  This skill settles those things before anyone writes copy. It checks the fit and ranks the problems in your reviews by count and strength. For the lead problem, it finds why people switch. It quotes the moment the old way failed and the habit that kept them stuck. It also quotes their doubt about the new thing and what pulled them over. It picks an honest narrator and says where the click should go. It ends with four stories to test, a short list for a person to check, and every gap in one list.

when:
  - You're thinking about story ads and aren't sure your product suits them.
  - Your reviews mention several problems and you need to pick one to lead with.
  - You have no customer cleared to be quoted and need an honest narrator anyway.
  - You want a few story ads to test that are different enough to learn from.

you_give:
  - Your product, who buys it, and the claims you may and may not make
  - Customer reviews, emails or call notes, numbered, with where each came from
  - What rivals already say (optional)
  - People cleared to speak, such as the founder or a customer who agreed (optional)
  - The page the ad will link to (optional)
you_get:
  - A fit verdict, and a table of problems with counts and strength
  - The lead problem, with why people switch, in buyers' exact words and review numbers
  - The narrator, the page the click opens, and a four-row test plan
  - What a person must check, how to read results, and every gap in one list
  - Any check the sheet still missed, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste all your reviews, numbered, with where each came from.
  - Paste your claims list. Say who has agreed to be quoted. If nobody has, say so.
  - Read the fit verdict first. If it says the product doesn't suit a story ad, run a short direct ad instead.
  - Hand the sheet to a skill that writes the story ad. It uses the lead problem, the narrator and the page.

how_it_works:
  - title: Checks the fit
    text: Looks for things buyers tried and dropped. With no history like that, it stops and suggests a direct ad.
  - title: Ranks the problems
    text: Groups the reviews by problem, counts them, rates how strongly each is said, and picks a lead and a backup.
  - title: Finds why people switch
    text: Quotes the moment the old way failed, the habit, the doubt and the pull, then lists things you could photograph.
  - title: Picks the aim and narrator
    text: Chooses a shared moment or one kind of buyer, then a real narrator or the brand. It never invents a person.
  - title: Plans the click and the test
    text: Says which page the click opens, then plans four stories that each differ in how they open and what they show.
  - title: Lists the gaps
    text: Ends with what a person must check and every MISSING line in one place.

output_shape: |
  FIT  <suits or doesn't suit, with things tried and review numbers>

  PROBLEMS
    Problem          Reviews      Count  Strength
    <problem>        <numbers>    <n>    <strong / medium / mild>
    Lead: <problem>   Backup: <problem>

  WHY THEY SWITCH (lead)
    Push:   "<exact words>" (<number>)
    Habit:  <what they kept doing, and why> (<numbers>)
    Doubt:  "<exact words>" (<number>)
    Pull:   "<exact words>" (<number>), matched to <allowed claim>
    Traces: <places, things or words where the problem shows>

  CLAIM LIMITS  <what the story may and may not say>
  AIM  <moment-first or person-first, and why>
  NARRATOR  <who speaks>, reviews that may be quoted: <numbers>
  CLICK GOES TO  <the page and its first screen, or MISSING>

  TEST PLAN
    # Opens on   Trace          Opener
    1 <force>    <trace>        <scene / date or count / real quote>
    ... four rows, each different on all three ...

  READING RESULTS  <the rules>
  A PERSON CHECKS  <list>
  MISSING  <every gap, in one list>
  CHECKS MISSED: <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Product: Sprout, daily greens gummies. A pouch of 28 daily packs;
    you tear a pack open and eat the gummies. $29.99 first box with the
    text sign-up, then $49.99 every 4 weeks.
    Buyers: the quitter who wants to stick (about 40%), the gut-fix
    seeker (about 25%), the busy parent (about 25%), the price doubter.
    Claims: the brand file's "fine to repeat" list. Never the risky list.

    Customer words: all 20 reviews from reviews.md, numbered, with
    sources, plus "They are expensive" (retailer).

    People cleared to speak: nobody. No founder story on file, and no
    customer has agreed to ad use.
    Market notes: none. Page: none yet.
  output: |
    FIT  Suits. A used-up product, and buyers have dropped other fixes:
    "a few green powders over the years" (1), a powder they were
    "choking on" (4), and separate probiotic, B12 and multivitamin
    gummies (5).

    PROBLEMS
      Problem                    Reviews         Count  Strength
      Quitting supplements       1-6             6      strong
      Gut trouble                7-11            5      strong
      Busy family days           15-17           3      medium
      Taste worries              18, 19          2      mild
      Price and subscriptions    3, 17, 20, R    4      medium
      (R = the extra retailer line "They are expensive")
      Lead: quitting supplements. Backup: gut trouble, but only as one
      buyer's story, and only "supports digestion and gut health".

    WHY THEY SWITCH (lead)
      Push:   "it was still $94 a month and the drink was definitely
              gritty/chalky" (3)
      Habit:  kept buying powders "over the years" because "The issue
              has never been nutritive content" (1)
      Doubt:  "They are expensive" (retailer); "I hate subscriptions
              because I feel like they are a trap" (17)
      Pull:   "It's wild I WANT to take [Sprout] and don't forget" (2),
              matched to "95% of users take [Sprout] at least 4-6x per
              week" (of surveyed users)
      Traces: the shaker bottle to clean (6), the row of separate
              gummy bottles (5), the morning drink (3, 4), a half-used
              powder tub (inferred from 1 and 3)

    CLAIM LIMITS  No "fix", no weight, energy or GLP-1 lines as the
    brand's own claim (11, 14). Survey numbers keep "of surveyed users".

    AIM  Moment-first: anyone who has quit a powder knows it, and the
    biggest group (about 40%) lives it. No market notes, so assumed.

    NARRATOR  The brand, summing up what customers tell it. Reviews 1,
    2, 4 and 6 may be quoted word for word as "one customer wrote",
    unnamed. Review 4 names a rival, so it becomes "a greens powder".

    CLICK GOES TO  MISSING: an article-style page that opens on the
    half-used tub and the shaker. Build it before the ad runs.

    TEST PLAN
      # Opens on  Trace                   Opener
      1 Push      half-used powder tub    the scene in the picture
      2 Habit     row of gummy bottles    a count ("three bottles")
      3 Doubt     shaker bottle to clean  a real quote (17)
      4 Pull      the morning drink       a real quote (2)

    READING RESULTS
    - Compare only with Sprout's other ads for new customers.
    - Same budget and days for all four rows.
    - Judge on readers who reach the offer, then on sales.
    - Retire a row that sends fewer readers than usual and sells nothing.
      If all four fail, try gut trouble.

    A PERSON CHECKS
    - Every quote matches the review, word for word.
    - No review is shown as a named person's words.
    - Each claim is on the "fine to repeat" list.

    MISSING
    - MISSING: an article-style page
    - MISSING: what rivals already say (aim assumed)
    - MISSING: written ad-use consent for any review

tweaks:
  - what: The buyer group
    how: Name a smaller group, such as busy parents buying for themselves. You get a person-first aim, and the problem and traces change to theirs.
  - what: People cleared to speak
    how: Add a customer who agreed in writing, with their own story. Then a test row can be told in their own words.
  - what: Market notes
    how: Say how many rivals already tell the same story. In a crowded market it leans toward one kind of buyer.
  - what: Size of the test
    how: Four rows is the default. Ask for a fifth if your budget allows, still different on all three columns.

judge:
  - The fit names real things buyers tried, with review numbers.
  - The counts in the problems table match the review numbers listed.
  - Push, habit, doubt and pull are exact quotes with numbers, or say MISSING.
  - The narrator is a real cleared person or the brand. Nobody is invented.
  - The four test rows differ on all three columns.
  - The sheet ends with every MISSING line in one list.

test:
  - Run it on a product story ads don't suit, such as a one-off gift. It should say "doesn't suit" and stop. If it plans stories anyway, the fit check isn't working.
  - Count the reviews behind the lead problem yourself. Its numbers should match yours.
  - Run it twice on the same reviews. The lead problem and narrator should match.
  - Look for any invented first name or "customer" voice. If you find one, the narrator rule failed.

improve:
  - Write your cleared narrators and the facts on record into the skill file, so it stops falling back to the brand voice.
  - Add your banned claims to step 3, so a health problem like the gut one is limited the same way every time.
  - Paste survey answers or call notes. Doubts show up there more clearly than in reviews.
  - Build the article-style page once, then give its first screen to every run.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Sorting and counting reviews works well in any current chat AI, as long as all the reviews fit in one chat."}
    - {name: "Meta Ad Library", why: "Shows which stories rivals already run, free and without an account, so the aim is based on fact."}
  inputs:
    - "Reviews from a retailer or review site as well as your own site, so the doubts are real and not only the praise"
    - "Survey answers to 'what did you use before, and why did you stop?', so the push is in buyers' own words"
    - "Written ad-use consent from even one customer, so one story can be told in first person"
    - "The first screen of your article-style page, so the sheet can check it opens on the same moment"

terms:
  - term: Story ad
    meaning: An everyday-looking picture with a short story under it, posted like a normal post and clearly from the brand.
  - term: Push, habit, doubt and pull
    meaning: The four reasons people switch or stay. Push is the old way failing. Habit keeps them stuck. Doubt is fear of the new thing. Pull is what draws them over.
  - term: Trace
    meaning: A place, thing or written words where the problem shows, which a picture can capture.
  - term: Moment-first and person-first
    meaning: Moment-first opens on something anyone with the problem has lived. Person-first opens on one kind of buyer.
