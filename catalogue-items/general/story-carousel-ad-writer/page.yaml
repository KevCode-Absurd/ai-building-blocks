name: "Story carousel ad writer"
new_slug: story-carousel-ad-writer
summary: "Write a story carousel ad card by card. Give your card count and buyer. You get each card's picture, words and headline, plus the main text."
job: write-ad-copy
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Story carousel ad writer"
subhead: Tell it how many cards, who the buyer is and what you can prove. It picks one of eight story shapes and writes each card's picture, words and headline. You get every card, the text above the ad, a button and flags for anything to check.

explain: |
  A carousel is an ad people swipe through, card by card. Many people only ever see card one, and fewer reach each card after it. So most carousels fail in one of two places: the first card gives nobody a reason to swipe, or the last card is so crowded that the action gets lost.

  This skill writes the carousel like a short script. It first picks one of eight story shapes, such as "fixes that failed" or "before you buy", based on how aware the buyer is, and checks you have the material that shape needs. Then it writes one idea per card, with a headline for the field under each card that adds to it. It keeps one look across the cards so they read as one piece, and brings your product in late for people who don't know you yet. The last card leads with the action in 20 words or fewer, with only real offer terms and dates. The main text above the ad carries the argument for people who never swipe.

when:
  - You want to run a carousel but don't know what should go on each card.
  - Your carousels get views on card one and nobody swipes.
  - You have several real reasons or customer quotes and want to lay them out in order.
not_for:
  - "You want one image ad, not a set of cards: write a single-image ad with your AI, or ask a designer for one picture and one line."
  - "You have no real customer quotes: skip the proof stack shape. This skill will use a how-it-works story instead and mark proof as missing."
  - "You need to check an ad against Meta's rules: use a Meta ad policy checker after the cards are written."

you_give:
  - How many cards (4 to 6 suits most stories)
  - Who the buyer is, what they doubt and how aware they are
  - Your offer, guarantee and the claims you can back
  - Your brand voice, look and banned claims (optional)
you_get:
  - A card-by-card plan with the picture, the words on the card and a headline for under it
  - The visual thread that stays the same on every card
  - The main text above the ad, for people who never swipe, and a button
  - Flags for gaps, guesses and quotes to check
  - Any of its own checks it couldn't pass, named one per line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Say how many cards you want.
  - Describe the buyer in a sentence or two, including what they've already tried.
  - Paste your offer, guarantee, approved claims and any customer quotes with their sources.
  - Read the flags at the end. Any MISSING line is something to find or drop before the ad runs.
output_sample:
  input:
    - How many cards you want (4 to 6 suits most stories)
    - Who the buyer is, what they doubt and how much they know
    - Your offer, guarantee and the claims you can back
    - Your brand voice, colours and banned claims (optional)
    - Real customer quotes with their sources (optional)
  prerequisites:
    - An AI chat such as Claude, ChatGPT or Gemini
    - Your org context and buyer brief, if you have them (optional)
  output:
    - name: Shape line
      contains: The story shape it picked, how aware the buyer is, and the number of cards.
    - name: Card blocks
      contains: One block per card with the picture, one or two sentences, and a headline for under the card, each with a count.
    - name: Visual thread
      contains: What stays the same on every card, such as layout, framing, light and colours.
    - name: Main text
      contains: The words above the ad, with card one's question, a short argument and the offer.
    - name: Button
      contains: The button wording to use on the ad.
    - name: Flags
      contains: Missing dates, proof or terms, plus quotes to check and anything left out.
    - name: CHECKS MISSED
      contains: One line per check the carousel still fails, or none.

how_it_works:
  - title: Picks the story shape
    text: One of eight, by how aware the buyer is. A buyer who has tried other fixes gets "fixes that failed"; a buyer nearly ready gets "before you buy".
  - title: Writes the first card
    text: Makes card one work on its own and open a question only the swipe answers.
  - title: One idea per card
    text: One or two plain sentences per card, each making the next card feel needed.
  - title: Adds a headline per card
    text: About 40 characters for the field under each card, adding to the card instead of repeating it.
  - title: Keeps one look
    text: The same layout, framing, light and colours on every card, so the set reads as one ad.
  - title: Writes the last card
    text: Leads with the action, then the offer and guarantee, in 20 words or fewer, with a date only if it's real.
  - title: Writes the text above
    text: Main text that carries card one's question and a short version of the argument, then a check for anything invented.
  - title: Checks the carousel
    text: Counts every card's words, goes through its own checks, such as card one working alone and no repeats, fixes what it can, and names any it still misses.

output_shape: |
  Shape: <story shape> | <buyer awareness> | Cards: <n>

  <n> <card job>
    Picture:  <what the card shows>
    Card:     <one or two sentences>              (<word count>)
    Headline: <line under the card>               (<characters>)
  ... one block per card ...

  Visual thread: <what stays the same on every card>

  Main text: <card one's question, the short argument, the offer>
  Button: <button>

  Flags
  MISSING: <dates, proof or terms not on file>
  <quotes to check, guesses, anything left out and why>

  CHECKS MISSED  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Cards: 6
    Buyer: people who quit greens powders, pills or a shelf of
    gummies. They know the kinds of fix, not us. Doubt: "A gummy
    can't hold enough to replace my powder."
    Facts: 1 daily pack = 60+ ingredients, 21 vitamins and minerals,
    6 g prebiotic fiber, in a small handful of gummies. About 25% of
    daily value for minerals. Allowed: "Supports digestion and gut
    health." Brand line: "No more gagging on pills, sloshing chalky
    powders, or cleaning messy counters."
    Offer: $29.99 first box with the text sign-up, then $49.99 every
    4 weeks. Guarantee: 30-day money-back, first order only.
    Quotes: review 3 "the drink was definitely gritty/chalky".
    Review 5 "I also stopped buying separate probiotic gummies, b12
    gummies, and multivitamin gummies."
  output: |
    Shape: Fixes that failed | Solution aware | Cards: 6

    1 Hook
      Picture:  a kitchen counter in morning light. An unbranded powder
                tub with a shaker, a row of pill bottles, a jar of
                gummies.
      Card:     You've probably tried one of these. Maybe all three.
                                                           (9 words)
      Headline: Why each one ends up left behind      (32 characters)
    2 Fix one
      Picture:  the powder tub and a shaker with a green ring inside.
      Card:     Greens powder. One buyer said "the drink was
                definitely gritty/chalky."                (10 words)
      Headline: Plus a shaker to wash every day       (31 characters)
    3 Fix two
      Picture:  the pill bottles alone, same counter, same light.
      Card:     A row of pills. The kind some people gag on.
                                                          (10 words)
      Headline: Easy to start, easy to skip           (27 characters)
    4 Fix three
      Picture:  five gummy jars lined up on a shelf.
      Card:     A shelf of separate gummies, one bottle for each thing.
                                                          (10 words)
      Headline: Plus a lot to keep track of           (27 characters)
    5 What works and why
      Picture:  a daily pack torn straight across the top, green bears
                pouring into a palm. The pouch behind, not named.
      Card:     One pack a day instead. 60+ ingredients, 21 vitamins
                and minerals, 6 g prebiotic fiber, in a small handful
                of gummies.                               (21 words)
      Headline: Tear it open and eat it               (23 characters)
    6 Offer
      Picture:  the deep green pouch and one torn pack, front on.
      Card:     Tap Shop now. Sprout, $29.99 first box with text
                sign-up, then $49.99 every 4 weeks. Money-back on
                first order.                              (19 words)
      Headline: Supports digestion and gut health     (33 characters)

    Visual thread: the same counter and morning light on every card,
    warm cream background, one object per card until card 5.

    Main text: Quit a greens powder, a pill stack or a shelf of
    gummies? Swipe through the fixes people try, and why each one got
    left on the counter. Sprout is one daily pack of green gummy
    bears, with 60+ ingredients, 21 vitamins and minerals and 6 g of
    prebiotic fiber, and nothing to mix. First box $29.99 with the
    text sign-up, then $49.99 every 4 weeks. 30-day money-back on
    your first order.
    Button: Shop now

    Flags
    MISSING: real date. Orders "on average arrive 3-5 days later", which
    is not a date, so card 6 has none.
    Reviews 3 and 5 are from the brand site and not marked verified.
    Confirm before paid use. Card 4 retells review 5 in plain words;
    only card 2 quotes.
    Card 3's headline is a general point, not from a review. Check it
    fits your buyers.
    No percentage off anywhere. The site shows four different numbers,
    so the cards use the dollar prices instead.
    Minerals are about 25% of daily value, so no card says "everything
    you need" or "replaces your powder".

    CHECKS MISSED  none

tweaks:
  - what: The buyer
    how: Say how aware they are. A buyer who has never tried a fix gets their story; one who is comparing gets "fixes that failed" or "how it works"; one nearly ready gets "before you buy".
  - what: Number of cards
    how: Three cards gives you a hook, one reason and the offer. Ten gives room for a proof card per doubt. More cards only help if each one has a new idea.
  - what: Customer quotes
    how: Paste real quotes with their source. With none, it swaps proof cards for "how it works" cards and says MISSING proof.
  - what: Delivery or offer dates
    how: Give a real date and the last card can say "get it by Friday". Without one, it leaves dates out.

judge:
  - Cover every card but the first. Would card one alone make you want to swipe?
  - The last card is 20 words or fewer and starts with the action.
  - No two cards, or a card and its headline, say the same thing.
  - Every quote matches a real review word for word, with its source.
  - For people new to your brand, the product isn't named on card one.
  - Nothing appears that isn't in your facts, such as a deadline, a count or a result.

test:
  - Run it on a carousel you already ran and know the result of. Compare its card 1 with yours. If it picks a different shape, read why, then test its card 1 against your old one.
  - Run it twice with the same input. The shape and each card's job should match, even if the words differ. If the shape changes, say more clearly how aware the buyer is.
  - Cover every card but the first and show it to someone who doesn't know your product. Ask what they think card 2 will say. If they can't guess at all, card 1 isn't opening a question.
  - Read the flags. A carousel with quotes and offer terms should flag at least one quote or date to check.

improve:
  - Paste your offer, guarantee and its conditions into "What you need" in the skill file, so the last card always uses the same approved terms.
  - Delete the story shapes you can't support (no customer quotes means no proof stack), so it never picks one you'd have to fake.
  - Write your usual card count, colours and background into step 5, so every carousel keeps your look.
  - When a carousel wins, save its card 1 and its shape in your org context, and paste that next time.
  - Pair it with "Pre-launch ad checker" once the cards are made.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Planning cards from your facts works well in any strong chat AI with this skill."}
    - {name: "Figma", why: "Keeps one layout across all the cards and sets the words as real type. Optional: it has a free plan, and paid plans need an account."}
    - {name: "GPT Image", why: "Makes a matching set of scenes from one description and your product photos. Optional: it needs a ChatGPT account, and free plans have tight daily limits. You can also build the cards by hand."}
    - {name: "Meta Ads Manager", why: "Its preview shows each card with its headline, so you can check nothing gets cut."}
  inputs:
    - "Real product photos from two or three angles, so the product cards show the real thing"
    - "Five to ten reviews in your buyers' own words, so the proof and fix cards quote real people"
    - "A real delivery or offer date, so the last card can give a reason to act now"
    - "A carousel you ran before, with its result, so the new one starts from what worked"

terms:
  - term: Carousel
    meaning: An ad made of several cards that people swipe through sideways.
  - term: Card headline
    meaning: The short bold line under each card in a Facebook or Instagram carousel.
  - term: Main text
    meaning: The words above the ad in a Facebook or Instagram feed.
