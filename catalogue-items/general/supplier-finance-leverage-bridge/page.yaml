new_slug: supplier-finance-leverage-bridge
name: Supplier finance leverage bridge
headline: Supplier finance leverage bridge
summary: See how treating supplier finance as debt changes your net debt and trade payables, with the reported figures kept beside the adjusted ones.
job: track-numbers
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it reported debt, cash, trade payables and the supplier finance balances you can prove. It moves only the proven balance from payables to debt, takes off cash once and shows reported and adjusted figures side by side.
explain: |-
  Some companies pay suppliers through a finance provider, and the balance can sit in trade payables instead of debt. An analyst may want to see that balance as debt-like. This bridge builds that view without overwriting the reported one.

  It moves only the balance you can evidence from payables to debt. Total liabilities stay the same. It takes off the same eligible cash once to reach net debt, and it keeps the reported measures next to the adjusted ones.

  The result is a what-if view. It is not a ruling on how a company must classify these balances.
when:
  - You read a company's accounts and see a supplier finance note.
  - A debt ratio looks low and you want to see it with supplier balances included.
  - You compare two companies and only one reports supplier finance.
  - A reviewer asks how payables and debt were moved.
you_give:
  - Reported debt from the financing section
  - Cash that counts toward net debt
  - Trade payables
  - The supplier finance balances you can prove, with the note or page that shows them
  - The reporting date, currency and scale
you_get:
  - A bridge from reported net debt to adjusted net debt
  - Trade payables before and after the move
  - A check that total liabilities did not change
  - An editable workbook and a list of missing inputs
  - The checks that did not run
how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or paste it in.
  - Attach the accounts or paste the balance sheet and the supplier finance note.
  - Ask it to quote the line that shows each supplier finance balance.
  - Check that the balance is not already inside reported debt, and that cash is taken off only once.
  - Read MISSING and CHECKS MISSED before you use the adjusted figures.
  - The bundled check script needs Node.js 20 or later. Without it, the AI does the sums in the chat.
how_it_works:
  - title: 1. Read payment terms, provider payments and balance disclosures; distinguish arrangement identification from a conclusion that every balance must be classified as borrowing
    text: Read payment terms, provider payments and balance disclosures; distinguish arrangement identification from a conclusion that every balance must be classified as borrowing.
  - title: 2. For a clearly labeled debt-like scenario, add only the identified balance to financing debt and remove it from operating trade payables
    text: For a clearly labeled debt-like scenario, add only the identified balance to financing debt and remove it from operating trade payables.
  - title: 3. Deduct the same eligible cash once for net debt; reconcile the balance-sheet perimeter and preserve reported classifications beside the analytical scenario
    text: Deduct the same eligible cash once for net debt; reconcile the balance-sheet perimeter and preserve reported classifications beside the analytical scenario.
output_shape: |-
  A reported-to-analytical leverage bridge with supplier balances shown separately.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Supplier balances are not already included in financing debt.
judge:
  - Supplier balances are not already included in financing debt.
  - Reclassification changes debt and operating payables consistently without changing total liabilities.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
not_for:
  - "You need to recheck a loan net debt limit after earnings or cash change: use Loan net debt covenant reviewer."
  - "You want to see how much cash really went into working capital: use Noncash working-capital bridge."
  - "You want a ruling on how the accounts must classify these balances. Ask the auditor; this is a what-if view."
output_sample:
  input:
    - Reported financing debt and cash
    - Trade payables
    - Supplier finance balances with the page that shows them
    - The reporting date, currency and scale
  prerequisites:
    - An AI that can read files
  output:
    - name: Reported view
      contains: Debt, cash, net debt and trade payables as the company reports them.
    - name: Adjusted view
      contains: The proven supplier balance moved from payables to debt, with cash taken off once.
    - name: Bridge
      contains: Each step from reported net debt to adjusted net debt, with total liabilities unchanged.
    - name: Workbook
      contains: An editable file with your inputs, formulas and test cases.
    - name: MISSING lines
      contains: Each input you did not supply, left open and never replaced with zero.
    - name: CHECKS MISSED
      contains: The checks that could not run, or the word none.
