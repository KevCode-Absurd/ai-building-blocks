new_slug: tagline-score-card
name: "Tagline score card"
summary: "Test your tagline on ten pass or fail checks. Get a score out of 100, a truth check and four rewritten taglines, each scored."
job: brand-file
thinking: low
thinking_why: "It checks a short line against fixed tests."

headline: "Tagline score card"
subhead: "Paste your tagline, and rival taglines if you have them. This prompt names the tagline type and runs ten pass or fail tests worth 10 points each. It checks the promise is true, then scores the line out of 100 and writes four rewrites, each scored the same way. The score does not show how well the line will sell or clear trademark rights."

explain: |
  A tagline is judged in seconds, so a weak one is easy to feel and hard to explain. Without a list of tests, a team ends up arguing about taste.

  This tagline checker fixes the list at ten tests. They include being short, different from rivals, easy to say aloud and free of bad second meanings. Each test gets a pass or fail and a one-line reason. The score is 10 points per pass.

  It also asks whether the promise in the line is true for your business. A line that claims "fastest delivery" fails if nothing in your business backs it up. Last, it writes four sharper taglines: three of the same type and one of a different type. Each rewrite is scored on the same ten tests.

  The score shows how well a line fits this list. It does not show how well the line will sell.

when:
  - "You have two or three tagline options and need to pick one."
  - "Your tagline feels vague, but you cannot say why."
  - "You are about to print packaging or launch a site with a new line."
  - "A rival's line sounds close to yours and you want to know if yours is different enough."

not_for:
  - "You want a company or product name. This tests a tagline, not a name."
  - "You want your big idea, three key messages and a list of every place the words must match. Use the Tagline tester."
  - "You have no tagline yet. This prompt tests and rewrites a line you give it. Write a first draft with your AI, then bring it here."
  - "You need to know if you may legally use the line. A quick search is not a trademark check. Ask a qualified person."

you_give:
  - "Your tagline, or a few options to compare"
  - "Three rival taglines (optional, needed for the different and unique tests)"
  - "What you want to be known for (optional)"
  - "Where it will appear, such as a pack, header or email footer (optional)"
  - "The countries or languages you sell in (optional)"
you_get:
  - "The tagline type, and a pass or fail with a reason on ten tests"
  - "A score out of 100, with the sum shown"
  - "A check that the promise in the line is true for your business"
  - "Four rewrites: three of the same type and one of another, each scored"
  - "A list of anything it could not check"

how_to_use:
  - "Copy the prompt and paste it into Claude, ChatGPT or Gemini. It needs no files or paid tools."
  - "Under it, paste your tagline, or your options one per line. Add three rival taglines."
  - "Say what you want to be known for, where the line will appear and where you sell."
  - "Read the failed tests first. Then read the truth check. A line that fails it needs a change to the line or to the business."
  - "Pick a rewrite, read it aloud, and search the exact words in quotes yourself before you use it."

how_it_works:
  - title: "Names the type"
    text: "Imperative (starts with a verb), descriptive, superlative, provocative or specific. It says whether that type suits the stage of your business."
  - title: "Runs ten tests"
    text: "Short, different from rivals, unique, captures the brand, easy to say and remember, no bad second meaning, readable small, easy to protect, makes you feel something, one idea only."
  - title: "Adds the score"
    text: "10 points for each pass, with the sum shown. A test it cannot run counts as MISSING and scores 0."
  - title: "Checks it is true"
    text: "For each claim in the line, it names the part of your business that proves it. If there is none, it says so."
  - title: "Writes four rewrites"
    text: "Three of the same type and one of another type. None adds a claim you did not give. Each is scored on the ten tests."
  - title: "Warns once"
    text: "It says once that a quick search is not a trademark check."

output_shape: |
  TAGLINE: "<line>" | type: <imperative | descriptive | superlative | provocative | specific>
  STAGE FIT: <fits | does not fit>, <why>
  TESTS
  1 Short: PASS | FAIL | MISSING - <reason>
  (... to 10)
  SCORE: <passed> x 10 = <score> out of 100
  IS IT TRUE: <claim> proven by <part of the business, or "nothing">
  REWRITES
  1 "<line>" | <type> | score <n>/100 (<sum>)
  2 "<line>" | <type> | score <n>/100 (<sum>)
  3 "<line>" | <type> | score <n>/100 (<sum>)
  4 "<line>" | <other type> | score <n>/100 (<sum>)
  MISSING: <facts it needed and did not have>
  CHECKS MISSED: <one line per check not done, or none>

output_sample:
  input:
    - "Your tagline, or a few options to compare"
    - "Three rival taglines (optional)"
    - "What you want to be known for (optional)"
    - "Where it will appear (optional)"
  output:
    - name: "TAGLINE and STAGE FIT"
      contains: "The tagline type, and whether that type suits the stage of your business."
    - name: "TESTS"
      contains: "Ten tests, each marked pass or fail with a one-line reason."
    - name: "SCORE"
      contains: "The number of passes times 10, out of 100, with the sum shown."
    - name: "IS IT TRUE"
      contains: "Each claim in the line, and the part of your business that proves it."
    - name: "REWRITES"
      contains: "Four new taglines, three of the same type and one of another, each with its score."
    - name: "MISSING and CHECKS MISSED"
      contains: "Any fact it lacked and any test it could not run."

tweaks:
  - what: "Rival lines"
    how: "Without rivals, the differentiated and unique tests are marked MISSING."
  - what: "Where it appears"
    how: "A small pack or footer changes the legibility test."
  - what: "Markets"
    how: "Say where you sell, so the second-meaning test checks those languages."

judge:
  - "Every test has a reason."
  - "The sums add up."
  - "Rewrites keep your claim true."
  - "The type fits the stage of your business."

test:
  - "Test a tagline you know is weak. It should fail at least two tests."
  - "Run it twice and compare the score."
  - "Read the best rewrite aloud and see if you can repeat it the next day."

improve:
  - "Add the words your brand never uses."
  - "Add your customers' phrases so rewrites use them."
  - "Pair it with Brand voice one-pager writer."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "A short prompt works in any strong chat AI. Paste it, then add your details under it."}
    - {name: "Google search", why: "Search your line in quotes to see if others in your field already use it. Most chat AIs cannot do this for you."}
  inputs:
    - "Three phrases customers use about you"
    - "Your key messages"
    - "A search of your tagline in quotes"

terms:
  - term: "Tagline"
    meaning: "A short line that says what your brand stands for, often placed next to your logo."
  - term: "Second meaning"
    meaning: "An unwanted meaning the words can carry in another language or in slang."
