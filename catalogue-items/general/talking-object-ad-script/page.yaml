new_slug: talking-object-ad-script
name: "Talking object video ad script writer"
summary: "Write a talking object video ad script: one everyday object speaks in 8 to 30 seconds, with a cast note and a source for every fact it states."
job: make-video-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Talking object video ad script writer"
subhead: Give it your buyer's moment, your product and your approved claims. It picks one object from the buyer's home to speak and writes an 8 to 30 second monologue that ends on a line people repeat. You get the script clip by clip, a cast note and every fact it states, with its source.

explain: |
  Buyers rarely say their problem out loud, and an ad that says it for them can sound preachy. An object that was in the room says it better. The bedside lamp has seen the 1 am scrolling. The crusty shaker bottle knows it's been replaced. Nobody mistakes a talking shaker for a fake testimonial, so it can be blunt.

  This skill chooses the narrator first: a witness in the room, the has-been your product replaces, or the culprit (a stain, a puddle). Never the product. It tests the object on four counts: it's really there, it reads in a second with a face that fits its shape, it has something mild to lose, and it's nobody's brand and nobody's body. Research on faces in products backs this: people warm to a face that suits the object and go cold on a nasty one. Then it writes four moves: the gripe, the detail only the object knows, the turn when your product appears, and a landing line. The object only reports what it could have seen.

when:
  - Your buyer doesn't talk about the problem, but something in their home sees it every day.
  - Your product replaces an old thing people keep and feel a bit silly about.
  - You want a funny ad that makes no claim your facts can't back.
  - You have review lines that name an object in your buyer's home.
not_for:
  - "You need to prove a result or explain how the product works: use a testimonial ad or a product demo, not a talking object."
  - "You want to sell an offer in the spoken words: put the offer in on-screen text, or write a plain direct-response script."
  - "You want a single picture, not a video: use the Talking object image ad maker."

you_give:
  - The problem, how much the buyer already knows, and the length
  - Your buyer's moment (the room, the time of day, what's in reach) and what they tried before
  - A photo of your product and pack (attach it; your AI can see pictures), what it replaces and whether the result can be seen
  - Your voice, how far a joke can go, your approved claims and your offer
you_get:
  - The narrator, the four tests it passed, and its mood
  - The monologue clip by clip, with picture notes, the turn marked and words per clip
  - A cast note on the narrator, its mood and its voice, for the clips skill
  - Every fact the object states, with its source
  - Any of its own checks it couldn't pass, named one per line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, approved claims and a few customer reviews underneath.
  - Describe where the problem happens, for example "at the kitchen sink, 7 am". Name any object your customers mention.
  - Say the length, for example "20 seconds", and how dry or silly your humour can be.
  - Read the last line to someone who hasn't seen the script. If they can't repeat it, ask for five new endings.
output_sample:
  input:
    - Your problem, how much the buyer knows, and the length
    - "Your buyer's moment: the room, the time and what they tried before"
    - Your product facts, plus a photo of the product and pack (recommended)
    - Your voice, how far a joke can go, your approved claims and your offer
  prerequisites:
    - Your brand brain from the Brand profile builder (optional)
    - A buyer brief from the Buyer brief writer (optional)
  output:
    - name: NARRATOR
      contains: The chosen object, whether it is a witness, has-been or culprit, its four test results and its visible state.
    - name: MOOD
      contains: One mood from sore, sheepish, worried or deadpan, with the reason it fits your brand.
    - name: CLIP
      contains: Each clip's first-person lines with picture notes, the turn marked, plus seconds, word count and on-screen offer.
    - name: FACTS THE OBJECT STATES
      contains: Every fact the object says, its source, and what the object could not have seen.
    - name: CAST NOTE
      contains: The narrator, its material, where its face goes, its mood, its voice and why it suits the buyer.
    - name: CHECKS MISSED
      contains: One line for each of its own checks that failed, or none.

how_it_works:
  - title: Checks the fit
    text: A talking object carries a problem and one feeling. It's weak at explaining how something works, at proof and at selling an offer, and it says so.
  - title: Picks who talks
    text: A witness in the room, the has-been your product replaces, or the culprit itself. Never the product, whose face would cover its label.
  - title: Tests the object
    text: It's really there, it reads in a second with a face where its shape suggests one, its flaw is mild, and it's nobody's brand and nobody's body.
  - title: Sets one mood
    text: Sore, sheepish, worried or deadpan. A brand that never jokes gets deadpan. The joke is on the object, never the buyer.
  - title: Writes four moves
    text: The gripe, the detail only it knows, the turn as your product appears by a cut, and a landing line a stranger could repeat.
  - title: Keeps it honest
    text: First person, never "you", and only what the object could have seen. The offer is on-screen text, never spoken.
  - title: Writes the cast note
    text: The narrator, its mood and its voice, and why it suits the buyer, so the clips skill can build it.

output_shape: |
  NARRATOR  <object> (<witness, has-been or culprit>)
  True: <evidence>  Readable: <shape, where the face goes>
  At stake: <what it could lose>  Fair: <beside the product, generic>
  State: <the damage you can see>

  MOOD  <sore, sheepish, worried or deadpan>, and why

  CLIP <n> (<move>, <seconds>, <words>)
  <n> "<first-person line>"
    <picture note: framing, what the features do, one movement>
  (the turn clip opens on the product; offer as on-screen text)

  FACTS THE OBJECT STATES
  "<words>"   <source>
  Not claimed: <what it couldn't have seen>

  CAST NOTE  <narrator, material and damage, face spot, mood, voice, and why>

  CHECKS MISSED  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Media: video, about 24 seconds
    Problem: has quit greens powders again and again; the routine
    never sticks. Buyer has tried other fixes.
    Buyer's moment: the kitchen sink in the morning, shaker in the
    drying rack, half-used tub in the cupboard.
    Their words: "Plus not having to clean a shaker bottle or extra
    dishes for greens stuff in powder form, is absolutely excellent!"
    (review 6). "the drink was definitely gritty/chalky" (review 3)
    Product: Sprout. Glossy deep green pouch, yellow wordmark; 28 daily
    packs, each torn straight across the top. Result can't be seen.
    Replaces: greens powder and the shaker. Also true: no water, no
    mixing, no shaker.
    Approved claims: "60+ ingredients, 21 vitamins & minerals, and 6g
    fiber" in 1 pack.
    Voice: playful, cheeky. Jokes are fine; no guilt.
    Offer: $29.99 first order with the text sign-up, renews at $49.99
    every 4 weeks.
  output: |
    NARRATOR  The shaker bottle (has-been)
    True: review 6 names "a shaker bottle" on its own.
    Readable: a frosted shaker with a flip lid. The face goes on the
      flat front above the dried ring, where a label would sit.
    At stake: replaced and left in the drying rack. Its flaw (the
      stain) is mild and a bit sad, nothing nasty.
    Fair: stands on the same counter as the pouch at true size; no
      logo, no rival's shape or colours, not a body part.
    State: a dried green ring inside, green crust on the lid hinge.

    MOOD  Sheepish. A cheeky brand could go sore, but the old thing
    owning up is funnier and aims no guilt at the buyer.

    CLIP 1 (gripe and inside detail, 8 s, 20 words)
    1 "I'm the shaker. He hasn't picked me up in weeks."
      Face close. Brows tilted up, eyes droopy. Mouth moves with the
      words.
    2 "This green ring? That's the powder. It never scrubs out."
      Very close on the ring inside. Eyes roll down to look at it.
    CLIP 2 (the turn, 8 s, 16 words)
    3 "Then a green pouch moved onto the counter."
      Cut: opens on the Sprout pouch on the counter beside the rack,
      label to camera, closed at its resealable top. The shaker's eyes
      slide to it.
    4 "He tears a little pack, tips, and goes."
      A daily pack on the counter, torn straight across the top, empty.
      Nobody in frame.
    CLIP 3 (landing, 8 s, 15 words)
    5 "No water. No shaking. No me."
      The shaker whole in the rack. It sags a little.
    6 "Turns out he never hated greens. He hated me."
      Face close. Eyes widen, then the mouth settles into a small,
      wobbly smile. Hold.
      On screen: First order $29.99 with SMS sign-up. Renews at $49.99
      every 4 weeks.

    The shaker never says the offer or "you", and the man it talks
    about is never seen.

    FACTS THE SHAKER STATES
    "the shaker"          review 6
    "the powder"          the old way it replaces, brand file
    "a green pouch"       brand file, how the pouch looks
    "tears a little pack, tips"  brand file ("Rip. Tip. Enjoy.")
    "No water. No shaking."  brand file (no water, no mixing, no shaker)
    Not claimed: anything about his health, gut or energy. The shaker
    only reports what it saw.

    CAST NOTE  The shaker carries it: frosted plastic, a dried green
    ring inside, the face on the flat front above the ring. Sheepish,
    with an earnest, slightly whiny man's voice in his thirties. It
    suits the quitter who wants to stick, because the shaker is the
    thing they gave up on. Next: the talking object clips skill writes
    its character card.

    CHECKS MISSED  none

tweaks:
  - what: Who talks
    how: For buyers who don't see the problem yet, ask for a witness (the bedside lamp, the coat hook). For a visible problem, ask for the culprit (a limescale ring). Name an object from your reviews and it wins.
  - what: The mood
    how: Pick sore, sheepish, worried or deadpan. Deadpan suits dry brands, sheepish suits a gentle one, sore needs a brand that's happy to be loud.
  - what: A still instead
    how: Want a still instead? Use "Talking object image ad maker", which keeps the same narrators and moods in one picture with a speech bubble.
  - what: Length
    how: 8 seconds is one clip and a complete ad in three lines. 24 to 30 seconds gives three clips and room for the inside detail before the turn.

judge:
  - The object never says "you". It talks about "she", "he" or "they".
  - It says nothing it couldn't have seen. No result inside a body, no how-it-works, no number from nowhere.
  - The product has its real label and no face, and arrives by a cut at the turn.
  - There is one talking object, one mood, and a flaw that's mild enough to like.
  - The last line is one a stranger could repeat.
  - The offer appears as on-screen text only.

test:
  - Give it a brief where the result can't be seen and no object is named. It should pick a witness or ask what's in the room, never invent your buyer's home.
  - Run it three times, naming a different object each time. Each should pass the four tests or be swapped out with a reason.
  - Search the object's lines for "you", a price and any body result. Finding one means a rule was skipped.
  - Read only the last line to someone who hasn't seen the script. If they can't tell what the ad is about, ask for five new endings.

improve:
  - Add the objects your customers mention in reviews to "What you need" in the skill file, so it starts from their words.
  - Write which moods your brand allows into step 4, so it never picks one you'd reject.
  - Add your product-showing rules (how the pack opens, what is never shown) to the video section, so picture notes get them right.
  - Save the landing lines that win in your brand file. They make good headlines elsewhere.
  - Pair it with "Talking object video clip prompt writer", which takes the script and cast note from here to finished clips.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Writing a short first-person monologue to these rules works well in any strong chat AI."}
    - {name: "Veo", why: "Speaks the object's quoted lines with matching room sound when the clips are made."}
  inputs:
    - "Review lines that name an object in the buyer's home, so the narrator is one your buyers already picture"
    - "A phone photo of the real spot where the problem happens, so the room and light in the picture notes are true"
    - "Two or three jokes your brand has run before, so the mood matches how far your humour goes"
    - "The product's real size next to everyday things, so it stands at true scale beside the object"

terms:
  - term: Witness
    meaning: An object that sits in the room when the problem happens and reports what it saw.
  - term: Has-been
    meaning: The old thing your product replaces, still kept and a bit ashamed of itself.
  - term: The turn
    meaning: The moment a cut shows your product and the object's story changes.
