terms:
  - term: Has-been
    meaning: The old thing your product replaces, still kept and a bit ashamed of itself.
  - term: Witness
    meaning: An object that sits in the room when the problem happens and reports what it saw.
  - term: Glance test
    meaning: Showing the ad for 2 seconds. If a stranger can say what it's for, it passes.
  - term: Calm area
    meaning: A plain part of the picture kept free for the words.
