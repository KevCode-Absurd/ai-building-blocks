example:
  business: sprout
  input: |
    [the skill]

    Problem: has quit greens powders again and again; the routine
    never sticks. Buyer has tried other fixes. Runs in the Instagram
    feed.
    Buyer's moment: the kitchen sink in the morning, shaker in the
    drying rack, half-used tub in the cupboard.
    Their words: "Plus not having to clean a shaker bottle or extra
    dishes for greens stuff in powder form, is absolutely excellent!"
    (review 6)
    Product: Sprout Superfood Gummies. Glossy deep green stand-up
    pouch, big yellow wordmark "Sprout", yellow bear face top right,
    "28 Daily Packs" at the bottom. Photos attached: front, side, top.
    Also true: no water, no mixing, no shaker.
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
    in 1 pack. Voice: playful, cheeky. Jokes are fine; no guilt.
    Colors: deep forest #002C17, warm cream #FFF7DF, sunflower #FFCC2E.
    Offer: $29.99 first order with the text sign-up, renews at $49.99
    every 4 weeks.
  output: |
    NARRATOR  The shaker bottle (has-been)
    True: review 6 names "a shaker bottle" on its own.
    Readable: a frosted shaker with a flip lid; the face goes on the
      flat front above the dried ring.
    At stake: replaced and left in the rack. The stain is mild and a
      bit sad, nothing nasty.
    Fair: no logo, no rival's shape or colours, not a body part.
    State: a dried green ring inside, green crust on the lid hinge.

    MOOD  Sheepish. Light: warm morning light low from the left.
    EXPRESSION  Brows tilted up, eyes sliding right toward the pouch,
    mouth a small wobbly line. It doesn't look at the viewer.

    LAYOUT   4:5, 1080 x 1350
    0-22 %   calm wall above the sink: the bubble, tail down to the mouth
    22-80 %  the shaker in the drying rack, left of centre; the pouch
             standing at the right edge, label to camera, a little taller
    80-100 % plain cream counter edge: name line, offer line

    WORDS ON THE IMAGE
    Bubble (7 words): "He never hated greens. He hated me."
    Name line: "Sprout Superfood Gummies"  Source: product page
    Offer line: "$29.99 first order with text sign-up. Renews at
    $49.99 every 4 weeks."  Source: offer terms
    Type: bubble 60 px, name 40 px, offer 30 px, all deep forest. On
    the white bubble about 15:1; on the cream strip about 14:1.

    IMAGE PROMPT
    A real photograph of a kitchen counter by the sink in the morning.
    A frosted white plastic shaker bottle with a grey flip-top lid
    stands in a drying rack, no logo and no measuring marks, a dried
    green powder ring inside a third of the way up and green crust on
    the lid hinge. A face moulded into its flat front above the ring:
    two round eyes sliding to the right, short brow ridges tilted up,
    a small mouth in a wobbly line. Behind it a kettle and a folded tea
    towel, nothing with words. At the right edge, a glossy deep green
    stand-up foil pouch exactly as in the attached photo, label to
    camera, no face. Warm light low from the left. 4:5, the top fifth
    a plain wall left empty for a speech bubble, a plain cream counter
    strip along the bottom. No people.

    POST WORDS
    Primary text: No water, no mixing, no shaker. One daily pack has
    60+ ingredients, 21 vitamins & minerals, and 6g fiber.
    Headline field: Rip. Tip. Enjoy.
    Button: Shop now
    EDIT STEP  Add the bubble: white, thin deep-forest outline, tail to
    the mouth. Lay the real pouch, cut out from the front photo, over
    the one in the picture. Set the name and offer lines on the cream
    strip. Check contrast on the finished image.
    CHECKS MISSED  none
    MISSING: nothing for this ad.

tweaks:
  - what: Who talks
    how: For buyers who don't see the problem yet, ask for a witness (the bedside lamp, the coat hook). For a visible problem, ask for the culprit. Name an object from your reviews and it wins.
  - what: The mood
    how: Deadpan suits dry brands, sheepish suits a gentle one, sore needs a brand happy to be loud. The light changes with it.
  - what: The look
    how: Ask for "a real photograph" for a face moulded into the object's surface, or "a soft 3D animated look" for something rounder.
  - what: Size
    how: 4:5 is the default for feeds. Ask for 1:1 as well and it recomposes the picture, never stretching the object or cropping the pack.

judge:
  - Shown for 2 seconds, someone can say what the object is fed up about and what the product is.
  - The bubble has 7 words or fewer, says "I" or "me", and never says "you".
  - There are at most 3 other things to read, in type big and dark enough to read on a phone.
  - The object says nothing it couldn't have seen, and every fact matches your claims.
  - The product matches your photos, has no face, and has your real pack laid over it.

test:
  - Give it a brief where no object is named and the result can't be seen. It should pick a witness or ask what's in the room, never invent your buyer's home.
  - Ask for a bubble that promises a health result. It should refuse and say the object couldn't have seen that.
  - Run it twice with different objects. Each should pass the four tests or be swapped out with a reason.
  - Put the finished image next to your current best image ad at phone size. Ask which one someone would stop for.

improve:
  - Add the objects your customers mention in reviews to "What you need" in the skill file, so it starts from their words.
  - Write which moods your brand allows into step 4, so it never picks one you'd reject.
  - Save the bubble lines that win in your brand file. They make good hooks for the video version too.
  - Pair it with the talking object video skills, so the still and the video share one narrator.

