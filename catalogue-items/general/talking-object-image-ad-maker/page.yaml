new_slug: talking-object-image-ad-maker
name: "Talking object image ad maker"
summary: "Plan a talking object image ad. Give it your buyer's moment and brand file. You get the narrator, bubble line, image prompt and ad words."
job: make-image-ads

headline: "Talking object image ad maker"
subhead: Give it your buyer's moment, brand file and product photos. It picks one object from the buyer's home, tests it and gives it one feeling and a speech bubble of 7 words or fewer. You get an image prompt, the ad words, a layout and the edit step that adds your real pack.

explain: |
  Buyers rarely say their problem out loud, and an ad that says it for them can sound preachy. An object that was in the room says it better. The crusty shaker knows it's been replaced. The bedside lamp has seen the 1 am scrolling. Nobody mistakes a talking shaker for a fake testimonial, so it can be blunt and funny.

  This skill plans one image. It picks the narrator first: a witness in the room, the has-been your product replaces, or the culprit itself, never your product. It tests the object on four counts: it's really there, its face fits its shape, it has something mild to lose, and it's nobody's brand and nobody's body. Then it catches one expression halfway through a feeling and writes a bubble line in the object's own voice. Last come the image-ad rules: the glance test, a bubble of 7 words or fewer, at most 3 other things to read, big type, strong contrast, feed sizes, and your real pack laid over the picture.

when:
  - Your buyer won't say the problem out loud, but something in their home sees it every day.
  - Your product replaces an old thing people keep and feel a bit silly about.
  - You run a talking object video and want a still that matches it.
not_for:
  - "You want a video, not a still: use the talking object ad script skill, which writes the video version."
  - "Your product needs proof to sell, like numbers or before and after photos: use a plain product photo ad with the proof written on it."
  - "You have no brand file or buyer details yet: use the Brand profile builder and the Buyer brief writer first."

you_give:
  - The problem, how much the buyer knows, and the buyer's moment (room, time of day, what they tried before)
  - Your brand file, with label text, approved claims, humour limits and offer
  - Photos of your product's front, side and top, attached (optional, needed if it appears)
you_get:
  - The narrator, the four tests it passed, its mood and its expression
  - A layout for 4:5 or 1:1, with space kept for the bubble and the small lines
  - The bubble line, the other words on the image, an image prompt and the post words
  - The edit step that adds the bubble and lays your real pack over the picture
  - Any of its six checks it couldn't pass, named one per line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Describe where the problem happens, for example "at the kitchen sink, 7 am". Name any object your customers mention.
  - Paste your brand file and attach the product photos. Say how dry or silly your humour can be.
  - Make the picture from the prompt, then add the bubble, the words and your real pack in your editor.
  - Show it to someone for 2 seconds. If they can't say what the object is fed up about, ask for a plainer expression.
output_sample:
  input:
    - The problem, what your buyer knows, and the buyer's moment
    - Your brand file with label text, approved claims, humour limits and offer
    - Photos of your product from the front, side and top (optional)
  prerequisites:
    - An AI chat that can read your pasted brand file
    - An image maker and an editor to build the final picture
  output:
    - name: Narrator
      contains: The object that talks, which kind it is, and the four tests it passed.
    - name: Mood and expression
      contains: One feeling, the light to match, and what the object's face is doing.
    - name: Layout
      contains: A 4:5 or 1:1 frame with space kept for the bubble and the small lines.
    - name: Words on the image
      contains: The bubble line of 7 words or fewer, plus up to three other short lines with their source.
    - name: Image prompt
      contains: A full scene description for your image maker, with an empty space for the bubble.
    - name: Post words
      contains: The primary text, headline field and button words for the ad.
    - name: Edit step
      contains: How to add the bubble, lay your real pack on the picture and check contrast.
    - name: Checks missed
      contains: Any of the six checks the plan could not pass, one per line, or none.

how_it_works:
  - title: Checks the fit
    text: A talking object carries a problem and one feeling. It tells you when proof or a plain product photo would say it better.
  - title: Picks who talks
    text: A witness in the room, the has-been your product replaces, or the culprit itself. Never your product.
  - title: Tests the object
    text: It's really there, its face fits its shape, its flaw is mild, and it's nobody's brand and nobody's body.
  - title: Sets mood and expression
    text: Sore, sheepish, worried or deadpan, with the light to match, and one face caught halfway through the feeling.
  - title: Writes the bubble
    text: Seven words or fewer, in the object's own voice, never "you", and only what it could have seen.
  - title: Applies the image-ad rules
    text: The glance test, at most 3 other things to read, 30 px type, 4.5:1 contrast, 4:5 or 1:1, and your real pack laid on.

