new_slug: tell-the-problem-so-buyers-see-themselves
name: Tell your buyer's problem so well they see themselves
summary: A long story of one person's problem that explains the cause plainly and brings your product in late.
job: write-ad-copy

headline: A story so close to your buyer's life they think "that's me" before you ask
subhead: Give it a note on your buyer, the real cause of the problem if you know it, your product facts and a length. It writes one person's problem as it gets worse, explains why it keeps happening in plain words, and brings your product in late as the way out.

explain: |
  People who don't know their problem has an answer won't read a sales pitch. They'll read a story about themselves. Most copy for these cold buyers gives up after one line of problem and jumps to the product, so the reader never recognises themselves.

  This skill writes the long version. It opens inside one moment, with one person, and stays with them. The problem gets worse through what they do about it: the small ways they work around it, each fix they tried and why it stopped working. Then it states the real cause in one plain idea that makes every failed fix make sense, if your facts hold one. If they don't, it stays with what the person notices and invents no cause. The product arrives late, with one fact at most, and the story ends back at the opening moment, changed.

when:
  - Your buyers don't know an answer exists, or only feel the problem, and short ads aren't landing.
  - You need a long ad text, an email or a page section that tells the problem as a story.
  - You know why the problem keeps happening and want that told plainly, not as a pitch.

you_give:
  - A note on the buyer, how much they know, the one thing they want, what they tried and their own words
  - The real cause of the problem, from your product facts (optional, but best)
  - Your product facts, offer and the proof you may use
  - How long it can be, in words or characters
  - Your voice notes and claims you must never make (optional)
you_get:
  - The finished story in paragraphs, with no headings or lists
  - A line saying which cause was used and where it came from, or that none was
  - A line listing anything assumed

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste a note on your buyer, including what they tried and their own words from reviews.
  - If you know why the problem keeps happening, and your facts support it, paste that as the cause.
  - Paste your product facts and offer, and give a length, for example "300 to 400 words".
  - Read the "Cause used" and "Assumed" lines. Anything assumed is worth checking before it runs.

how_it_works:
  - title: Opens inside a moment
    text: A time, a place, one person doing one thing. No product, no name for the problem, no greeting.
  - title: Keeps one person
    text: The same person from the first line to the last, so the reader thinks "that's me" more than once.
  - title: Makes it worse
    text: The small ways they work around it, then each fix they tried, what it cost and why it stopped. The fix fails, never the person.
  - title: States the cause
    text: One plain idea, said as a friend would, that makes every failed fix make sense. Only if your facts hold it.
  - title: Brings the product late
    text: After the cause. How they found it, their doubt, the first use and one ordinary day since, with one fact at most.
  - title: Ends with one step
    text: Returns to the opening moment, changed, then gives one thing to do.
  - title: Checks the pace
    text: Each paragraph leans into the next and adds an event, a cost or a detail. Nothing is said twice.

output_shape: |
  <the story, in paragraphs of 2 to 5 whole sentences, no headings:
  about a quarter on life as it is, half on the problem getting
  worse and fixes failing, a quarter on the cause, the product and
  the next step>

  Cause used: <the source fact, quoted, or "none, stayed with what
              the person notices">
  Assumed:    <anything inferred>

example:
  business: sprout
  input: |
    [the skill]

    Buyer: busy parents with picky eaters. They feel the problem but
    don't know a kids' greens gummy exists. Want: no fight at the table.
    Tried (from a review): "all of the 'green' options for the kids".
    Doubts: "Is this just candy?" / "Is the sugar okay for kids?"
    Real cause: none on file
    Product facts: Sprout Kids, 1 pack a day, 6 strawberry gummies,
    yellow pack, ages 2 to 13. Free from synthetic dyes. The pack is
    torn open across the top.
    Customer quote (word for word): "They think it's a treat."
    Offer: first Kids box from $24.99
    Length: 300 to 350 words
  output: |
    It's ten past seven on a school morning, and last night's broccoli
    is still on a plate by the sink. You scrape it into the bin while
    the toast goes on, and you tell yourself that tonight will be
    different.

    It usually isn't. You've started hiding spinach in the pasta sauce
    and blending smoothies with something green at the bottom, and you
    know which plates get pushed away before anyone has sat down. You
    pick your battles, and most nights you pick none.

    So you tried the green options made for kids. There was a powder
    you could stir into juice, until they tasted it and the juice went
    down the sink. There was a chewable from the supermarket that came
    back out half eaten. Each one looked like the answer for about a
    week, and then the fight moved somewhere else.

    And dinner becomes the part of the day you dread. Every night is a
    small negotiation, and by seven you're too tired to win it, so the
    plate comes back with the green bits lined up along the edge.

    What you notice, after a while, is that they'll eat almost anything
    that feels like a treat, and almost nothing that feels like it's
    good for them.

    Then you come across Sprout Kids, a small yellow pack of six
    strawberry gummies for the day, and your first thought is that it
    must be candy. You check the back, and it's free from synthetic
    dyes. The first morning you tear the pack across the top and tip
    the gummies into a small hand, and they're gone before the toast
    is. One parent who wrote to us put it this way: "They think it's a
    treat."

    There might still be broccoli on the plate tonight. But the morning
    isn't a fight anymore. If that sounds like your kitchen, start with
    one pouch of Sprout Kids, from $24.99 for your first box, and see
    how the first week goes.

    Cause used: none, stayed with what the person notices.
                MISSING: real cause
    Assumed:    the juice powder and the supermarket chewable are
                illustrations; the review only says "all of the 'green'
                options". MISSING: grams of sugar per pack, so "is the
                sugar okay?" is left unanswered.

tweaks:
  - what: The cause
    how: This is what makes the story land. Paste a cause your facts support and it becomes the turn of the story. Leave it out and the story stays with what the person notices.
  - what: What they tried
    how: List the real fixes your buyers mention in reviews. Each one becomes a step in the story where hope rises and falls.
  - what: The length
    how: Long means more happens, not more words. Give it room (300 words or more) only if you have enough tried fixes and detail to fill it.
  - what: Who the person is
    how: Name the moment from your reviews, such as a morning routine or a meal. The more exact the moment, the more readers recognise themselves.

judge:
  - The product doesn't appear before the cause, or before the reader knows the problem.
  - Every paragraph adds something new, an event, a cost or a detail.
  - There's no figure, quote, study or deadline you didn't supply. Any quote in quotation marks is word for word.
  - The reader is never blamed. The fixes fail, not the person.
  - It reads aloud without fragments or rows of one-line paragraphs.

test:
  - Run it with a buyer note built from reviews you know well. Each failed fix in the story should be one your buyers mention.
  - Run it twice. The cause and the opening moment should match. If the cause changes, it's guessing, so give it the cause from your facts.
  - Give the story to someone like your buyer without saying what it sells. Ask where they first thought "that's me", and where they got bored.
  - Find the first mention of the product. It should come after the cause.
  - Check the "Cause used" line. It should quote a fact you gave it, or say none.

improve:
  - Write the plain cause of your buyer's problem, from your product facts, into "What you need" in the skill file, so step 4 has it every run.
  - Add the fixes your buyers say they tried (from reviews) to step 3, so the story uses them.
  - Change the rough split under step 7 if your stories run short, for example less time on life as it is.
  - Save the opening moment that works to your brand file.
  - Run "Know who you're writing for before you start" first, and finish with "Know if your copy is ready, in 15 questions".

terms:
  - term: Cold buyer
    meaning: Someone who doesn't know you, and may not know their problem has an answer.
  - term: Cause
    meaning: The plain reason the problem keeps happening, which explains why the usual fixes didn't work.
