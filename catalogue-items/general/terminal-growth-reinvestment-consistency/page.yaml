new_slug: terminal-growth-reinvestment-consistency
name: Terminal growth reinvestment check
headline: Terminal growth reinvestment check
summary: Build a terminal value from NOPAT, growth, ROC and WACC. You get the reinvestment, FCFF and a test with ROC at WACC.
job: money-and-investing
thinking: high
thinking_why: "Growth needs reinvestment, so the growth rate, the return and the discount rate have to fit together."
subhead: Give it first stable-year NOPAT, a stable growth rate, the return on new investment and a matching WACC. You get the reinvestment that growth needs, the free cash flow, the terminal value and a test with return equal to WACC.
explain: |-
  A terminal value assumes a business grows at a steady rate forever. Growth is not free: the business has to put part of its profit back in. If a valuation takes the growth but not the reinvestment, the value is too high.

  This skill works the reinvestment out from the growth rate and the return on new investment, takes it off profit to get free cash flow, and divides by the discount rate less growth. It then repeats the sum with the return equal to the discount rate, to show how much of the value rests on a high return. Practice figures only: with NOPAT of 100, growth of 3%, ROC of 15% and WACC of 10%, the reinvestment rate is 3%/15% = 20%. Reinvestment is 20, so FCFF is 80. Terminal value = 80 / (10% - 3%) = 1,142.86. If ROC falls to 10%, the reinvestment rate is 30%, FCFF is 70 and the value is 1,000.
when:
  - You are valuing a business and the terminal value looks high for its growth.
  - You want to know what reinvestment a stable growth rate needs.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You need a full company valuation: build a full discounted cash flow model, since this checks only the terminal value part."
  - "You value a bank or insurer: use a method made for financial firms, because this covers one operating business."
  - "Your discount rate is not above your growth rate: fix those inputs first, because the terminal value cannot be worked out."
  - "You already have a terminal value and want the reinvestment hidden inside it: use the Implied terminal reinvestment schedule instead."
you_give:
  - First stable-year NOPAT, stable growth, stable ROC and matching WACC.
  - "The terminal date, plus the currency and scale used for the terminal reinvestment check."
  - "Your spreadsheet tool, if you want the terminal reinvestment check as a workbook."
you_get:
  - The reinvestment, free cash flow and terminal value for your growth rate, plus the same with return equal to WACC.
  - "An editable workbook of the terminal reinvestment check, with its inputs, formulas and test cases to rerun."
  - "A tie-out of reinvestment, cash flow and terminal value, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the stable-year NOPAT, growth, return on capital and WACC."
  - "Tell it what you need: the reinvestment a stable growth rate needs, the cash flow and the terminal value."
  - "Ask it to stop and mark MISSING if the growth rate or the return on capital is not in your sources."
  - "Check that WACC is above growth and the reinvestment is possible, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - First stable-year NOPAT (after-tax operating profit)
    - Stable growth rate
    - Stable return on capital (ROC)
    - WACC that matches your cash flows
    - Reporting date, currency and scale
  prerequisites:
    - An AI that can work with spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation (optional)
  output:
    - name: Scope and dated sources
      contains: What was valued, the valuation date, currency and scale, and where each input came from.
    - name: Inputs and assumptions
      contains: Each input with its source and date, kept apart from assumptions and scenarios.
    - name: Model calculations and reconciliations
      contains: The reinvestment rate, reinvestment, FCFF and terminal value, with a return-spread sensitivity and tie-outs.
    - name: Actual file verification
      contains: "Which workbook checks ran: recalculation, changed input test, rendering and reopening the saved file."
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs that were not supplied and checks that failed or could not run, or the word none.
how_it_works:
  - title: Line up the inputs
    text: Use first stable-year NOPAT and a WACC that matches operating cash flows, currency and inflation.
  - title: Work out the reinvestment
    text: Reinvestment rate is growth divided by return on capital. Take that share of NOPAT off to get free cash flow.
  - title: Value it and test it
    text: Divide free cash flow by WACC less growth. Repeat with return equal to WACC. Never raise growth while holding reinvestment fixed.
output_shape: |-
  A terminal reinvestment and FCFF schedule with a return-spread sensitivity.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Terminal date"
    how: "Take the terminal date from the stable-year NOPAT, growth, return on capital and WACC. Use one currency and scale on every line."
  - what: "Stable return on capital"
    how: "Change the stable return on capital and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: WACC exceeds growth and reinvestment is economically feasible.
judge:
  - WACC exceeds growth and reinvestment is economically feasible.
  - Terminal-date value is separately discounted to the valuation date.
  - Trace dates, currency, scale, accounting perimeter and source pages for every material input.
  - Keep the focused illustration separate from a complete investment conclusion; list unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one terminal reinvestment check you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define return on capital into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
  - term: NOPAT
    meaning: Operating profit after tax, before interest.
  - term: ROC
    meaning: Return on capital, the profit a business earns on each unit it invests.
  - term: WACC
    meaning: The average cost of the money that funds the business, used as the discount rate.
  - term: FCFF
    meaning: Free cash flow to the firm, the cash left after the business reinvests.
