new_slug: test-reply-offer-planner
name: "Test reply offer planner"
summary: "Pick one reply offer for your ad test that brings enough replies from real buyers. Get the offer lines and a boost plan."
job: plan-ad-tests
thinking: medium
thinking_why: "It weighs a trade-off between enough replies and real buyers, but follows fixed steps."

headline: "Test reply offer planner"
subhead: Give it your test plan and what you sell. It picks a small free or low-cost item for people to reply to, decides whether to show it or hide it, and screens out people who only want a freebie. You get the offer lines, the expected replies against your target and a plan to raise the count if it falls short.

explain: |
  A test needs replies to count. If the thing people reply to is weak, you get ten replies a version and the result is luck. If it is too good, you get a crowd who wanted the free item and a winner that never sells.

  This skill picks the reply offer on purpose. It starts from what a reply should predict, lists at least four small items you could give, and chooses the one closest to what you really sell. It decides whether to show the offer or tuck it into the last paragraph, and adds a light screen when free draws the wrong people.

  Then it compares the expected replies with your target. If the count looks low, it plans boosts in a set order, from making the item free to showing it more clearly. You settle the boosts before launch, so the offer never changes mid-test. The offer stays identical in both versions, and any free claim carries its conditions in the same line.

when:
  - You are setting up a test of two ads or emails and do not know what to ask readers to do.
  - Your last test gave too few replies to read.
  - Free offers bring replies from people who never buy.
  - You want to know in advance if your audience is big enough to reach the reply target.

not_for:
  - "You still need to design the test, split the audience and set the winner rule: use the A/B test design planner first."
  - "You want to check your real prices and deals for clashes: use the New offer opportunity finder."
  - "You have one ad and no second version to compare: skip the test and use a plain survey."
  - "The versions must run in different places: plan the swap with the Cross-over copy test planner."

you_give:
  - Your test plan, or the two versions, audience size and reply target
  - Your real offer and price (optional)
  - What you could give away, such as a guide, sample or trial, and what each costs you (optional)
  - Your budget per reply (optional)
you_get:
  - A chosen reply offer and a back-up, with the cost per piece
  - A decision on shown or hidden, and a screen if one is needed
  - Expected replies against your target, and the order of boosts if short
  - The offer lines, with the condition next to any "free"
  - A note on how to match replies to buyers later

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the test plan from the Split-run test planner, or the two versions, audience size and reply target. Say what you sell.
  - List anything you already have that could be the reply item, and what it costs you.
  - Put the same offer lines in both versions, in the same place and size.
  - Settle any boosts before launch. Once the test runs, do not change the offer.
  - Keep a note of which repliers go on to buy. Read the test with the Split-run result reader.

how_it_works:
  - title: States what a reply must predict
    text: One line that says what a reply shows, so the offer is judged on that.
  - title: Lists at least four options
    text: Samples, guides, checklists, catalogues, trials, quotes and calls, each with its cost.
  - title: Picks the closest fit
    text: Chooses the item most like what you sell, so repliers look like buyers.
  - title: Decides shown or hidden
    text: Shown for many replies, hidden to learn if anyone read the copy or to avoid freebie hunters.
  - title: Adds a screen if needed
    text: A small charge, one question or a phone check, so people who only want a freebie drop out.
  - title: Compares with the target
    text: Raises a low count in a set order and trims a high one. If you gave no reply rate, it shows a labelled range.
  - title: Writes the offer lines
    text: The ad line, the reply form line and the thank-you line, with any condition beside "free".

output_shape: |
  AIM
  A reply shows ___ and is likely to buy ___.

  THE OFFER
  Chosen: <item> | Cost per piece: <n> | Back-up: <item>
  Shown or hidden: <choice> because <reason>
  Screen: <none / small charge / one question / phone check>

  EXPECTED AGAINST TARGET
  <expected replies per version, as a range> vs <target>
  If short, in order: <boosts>

  OFFER LINES
  Ad line: <...>  Reply form: <...>  Thank-you: <...>

  MATCHING LATER
  <how replies are tied to buyers>

  MISSING
  <list>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "Your test plan, or the two versions with the audience size and reply target"
    - "Your real offer and price (optional)"
    - "What you could give away and what each costs you (optional)"
  prerequisites:
    - "A test plan, such as the one from the Split-run test planner"
  output:
    - {name: "Aim", contains: "One line saying what a reply shows and what it predicts about buying."}
    - {name: "The offer", contains: "The chosen reply item and a back-up with cost per piece, shown or hidden, and any screen."}
    - {name: "Expected against target", contains: "Expected replies per version against your target, and the order of boosts if short."}
    - {name: "Offer lines", contains: "The ad line, the reply form line and the thank-you line, with conditions beside any free claim."}
    - {name: "Matching later", contains: "How each reply is tied to a key and later to a buyer."}
    - {name: "MISSING and CHECKS MISSED", contains: "Facts you did not give, and any check that failed or could not run."}

tweaks:
  - what: What you can give
    how: List real items you already have. It prefers these to making something new.
  - what: Your budget per reply
    how: Give a cost limit. Items above it are dropped.
  - what: Who follows up
    how: Say if a salesperson will call. A phone check is then added as a screen.
  - what: Real offer
    how: Give your real offer so the reply item can lead into it.

judge:
  - The offer is the same item, wording, size and place in both versions.
  - The item is close to what you sell.
  - Expected replies are compared with the target.
  - Any free claim shows its conditions.
  - Replies can be matched to buyers.

test:
  - Run the test and count the replies per version. Check you reached the target or the plan said why not.
  - Follow the repliers and see how many bought, versus a random group.
  - Compare a free item and a low-priced one on a small run, and check which brought buyers.
  - Check both ads carry the same offer words and place.

improve:
  - Keep a list of reply items and their cost per reply and buyer share.
  - Add items your market likes to step 2.
  - Add boosts you can use in your tools to step 6.
  - Record which items drew freebie hunters, and drop them.

works_best_with:
  tools:
    - {name: "Claude, ChatGPT or Gemini", why: "Listing options and weighing them is text work any strong chat AI handles with this skill."}
    - {name: "A spreadsheet", why: "Tracks replies, buyers and cost per piece for each item."}
  inputs:
    - "The plan from Split-run test planner"
    - "Your price list and anything you can give away"
    - "Results from past tests, if you have them"

terms:
  - term: Reply offer
    meaning: The small thing a reader is invited to ask for in a test, such as a sample or a guide.
  - term: Hidden offer
    meaning: An offer placed in the last paragraph with no button or box, so only people who read the copy find it.
  - term: Screen
    meaning: A small step that filters out people who only want something free.
  - term: Boost
    meaning: A change that raises the reply count, such as making the item free. You plan boosts before launch.
