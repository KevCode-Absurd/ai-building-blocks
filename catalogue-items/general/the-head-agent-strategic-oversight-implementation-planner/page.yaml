how_it_works:
  - title: Step 1
    text: Group findings that describe the same issue.
  - title: Step 2
    text: Compare evidence and disagreements.
  - title: Step 3
    text: Rank by urgency and business impact.
  - title: Step 4
    text: Route work through the authority registry and depth limit.
  - title: Step 5
    text: Keep blockers attached to child tasks.
  - title: Step 6
    text: Escalate unresolved decisions.
  - title: Step 7
    text: Synthesize recommendations without changing campaigns directly.
