new_slug: third-option-finder
name: "Third option finder"
summary: Find a third option for two plans people are stuck on. Get one that beats a compromise, plus a small test to start this week.
job: think-and-decide
thinking: high
thinking_why: "Finding an option that is more than a split of the difference takes real creative reasoning, then a fair test of it."

headline: "Third option finder"
subhead: Tell it the two plans two sides are stuck on. The skill writes each plan fairly and finds what each side is protecting. Then it builds options beyond the two on the table. You get one option that is more than a split, plus a small first step both sides can try.

explain: |-
  When two sides each hold a plan, the usual way out is to split the difference. Both lose a little and nobody is glad. A better way out is an option neither side has named yet. It meets each side's core need and does more than either plan did.

  This skill writes each plan fairly, with what each side is protecting. It says whether this is a true clash of views or two fixed plans. It sets the plans aside and asks what could beat both. It runs a what-if round, asks who has solved something similar and widens the goal so more options can qualify.

  Every new option is tested against each side's core need. The skill does not claim an option will work before it is tried, and it will not invent a case study. It picks one option and shrinks it to a first step for this week. The approach follows Stephen Covey's idea of a third alternative. This version is ours.

when:
  - Two people or teams are stuck on opposite plans and the talks go in circles.
  - A decision keeps ending in a split-the-difference that nobody likes.
  - You need a way forward at home or at work that both sides can say yes to.
  - Partners disagree on direction, such as raise money or stay small, and each has a reason.
not_for:
  - One side has already decided, or the choice is bound by law or safety rules. Take it to counsel or the person who decides.
  - You only need to close the debate and name a decider. Use the Team decision and dissent note writer.
  - The stakes are high and you want many views. Use the Council decision brief writer.

you_give:
  - The two plans, in each side's own words
  - What each side cares about and fears losing (optional)
  - Limits that cannot move, such as a budget or a date (optional)
  - What has already been tried (optional)
you_get:
  - Each side's plan and core need, written without taking a side
  - Whether this is a real clash of worldviews or two fixed plans
  - At least three options beyond the original two, each tested against both needs
  - One chosen option and a small first step both sides can try this week

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Describe both plans as fairly as you can. Better, paste each in the words that side would use. If you only know one side's plan, say so.
  - Add the limits that cannot move.
  - Read the options and the core needs. Fix any need it got wrong, then run it again.
  - Share the chosen option and first step with both sides before the next meeting. Run the small test and bring back what happened.

how_it_works:
  - title: States both plans
    text: Writes each plan in two lines and what each side is protecting, without taking a side.
  - title: Names the kind of fight
    text: Says if it is a real clash of views or two fixed plans, with the reason.
  - title: Sets the plans aside and asks what-if
    text: Asks what one change would transform this, what the opposite of the usual would look like, and what both sides assume is fixed.
  - title: Looks for solved cases
    text: Names a real similar problem someone solved, or says it can't. It never invents one.
  - title: Widens the goal
    text: Restates the goal as a result, so any option can qualify, not only the two named.
  - title: Tests each option
    text: Lists at least three new options and checks whether each side keeps its core need and whether it beats a simple split.
  - title: Picks one and shrinks it
    text: Chooses one option, sets a first step for this week and names what would send you back to the what-if round.

output_shape: |
  THE TWO PLANS
  Side A: <plan> | Protecting: <core need>
  Side B: <plan> | Protecting: <core need>

  KIND OF FIGHT
  <clash of worldviews / two fixed plans> | Why: <reason>

  OPTIONS BEYOND THE TWO
  1. <option> | A keeps: <need> | B keeps: <need> | Better than a split? <yes/no, why>
  2. ...
  3. ...

  WHAT-IF ROUND
  <changes and opposites considered>
  Who has solved this: <example>

  THE CHOSEN OPTION
  <option> | Why: <reason>

  FIRST STEP THIS WEEK
  <small step> | Who: <names> | Done when: <result>

  MISSING
  <facts that would change the choice>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: Each side's own words
    how: Paste what each side would say, not your summary. The core need shows in how they put it.
  - what: What cannot move
    how: List hard limits so the options are real, not hopeful.
  - what: Who is in the room
    how: Say who will decide. An option needs a person who can say yes.
  - what: What has failed
    how: List earlier fixes and why they fell short, so they are not repeated.

judge:
  - The chosen option differs from a simple compromise and each side gains something.
  - Each side's core need is named and kept.
  - There are at least three options beyond the original two.
  - The first step is small enough to start this week.
  - Neither side is described as the villain.

test:
  - Run it on a dispute you already solved. See if it finds your answer or a better one.
  - Show each side their own plan as the skill wrote it. They should say it is fair.
  - Run it twice. The options may differ, but the core needs should match.
  - Try the first step for a week and see if both sides stay in.

improve:
  - Add the sort of fights your team has, with what worked, to the skill as examples.
  - Add rules your organisation cannot break, such as budget or policy.
  - Add a list of people who can break a tie, so each option names who must agree.
  - Pair it with "Advisory council" for a hard decision with high stakes.

works_best_with:
  tools:
    - name: Any good chat AI
      why: Turning positions into needs and generating options is text work. Claude, ChatGPT and Gemini all do it with this skill.
    - name: A shared doc
      why: Both sides can read and comment on the options at the same time.
  inputs:
    - A short note from each side in its own words
    - The numbers behind each plan
    - Past attempts and why they stalled

terms:
  - term: Core need
    meaning: What a side must keep for any plan to be acceptable to it, under the plan it named.
  - term: Compromise
    meaning: A deal where each side gives something up, so both end up with less than they hoped.
output_sample:
  input:
    - The two plans, in each side's own words
    - What each side cares about and fears losing (optional)
    - Limits that cannot move (optional)
    - What has been tried (optional)
  output:
    - name: THE TWO PLANS
      contains: Each plan in two lines, with what each side is protecting.
    - name: KIND OF FIGHT
      contains: A clash of views or two fixed plans, with the reason.
    - name: OPTIONS BEYOND THE TWO
      contains: At least three options, each tested against both core needs and against a simple split.
    - name: WHAT-IF ROUND
      contains: The changes and opposites it tried, and a real case where someone solved something similar.
    - name: THE CHOSEN OPTION
      contains: The option that keeps both needs and gains the most, with the reason.
    - name: FIRST STEP THIS WEEK
      contains: A small step both sides can try, who does it and what result shows it worked.
    - name: MISSING and CHECKS MISSED
      contains: Facts you did not give, and any of its own checks it could not pass, or none.
