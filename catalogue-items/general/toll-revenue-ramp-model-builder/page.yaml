new_slug: toll-revenue-ramp-model-builder
name: Toll revenue ramp model builder
headline: Toll revenue ramp model builder
summary: Build a three-year toll revenue model from your traffic forecasts, toll rate and collection share. You get receipts, operating cash and checks.
job: money-and-investing
thinking: high
thinking_why: "Traffic forecasts and measured counts come from different sources, so they must be kept apart and each one dated."
subhead: Give it three years of chargeable passages, the toll, the share of tolls paid in cash and your operating costs. You get billed receipts, cash receipts and operating cash for each year, with each source dated.
explain: |-
  A toll road earns money per passage, but not every billed toll is paid in cash. This skill keeps those two apart. It multiplies each year’s chargeable passages by the toll to get billed receipts, applies the cash collection share to get cash receipts, then takes off operating costs.

  It keeps the traffic study forecast separate from passages actually counted, takes out exempt vehicles, and never applies the collection loss twice to counts that are already cash-paid. It is arithmetic only, and it leaves out debt service and capital spending. Practice figures only: chargeable passages before collection loss are 1,000, 1,200 and 1,500 over three years. The toll is 2 and the collection share is 90%. Cash receipts are 1,800, 2,160 and 2,700. Less operating costs of 1,000, 1,100 and 1,200, operating cash is 800, 1,060 and 1,500.
when:
  - You have a traffic study with three years of chargeable passages and want the cash they should bring in.
  - You need to show billed tolls and cash tolls side by side.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You need a traffic forecast or a concession valuation: ask a traffic study firm or a valuation adviser, because this model only does the arithmetic."
  - "You need debt service or capital spending in the cash result: add those in your own project finance model after this step."
  - "Your passage counts are already cash-paid: reconcile that basis first, because this model would cut them for collection loss a second time."
  - "You need an energy operating cash schedule from delivered MWh and one contract price: use the Energy contract cash modeler instead."
you_give:
  - Three annual counts of chargeable passages before collection loss, with the traffic study and its date
  - The toll per billable passage, and the share of billed tolls paid in cash
  - Operating cash costs for the same three years
  - "The forecast year, plus the currency and scale used for the toll revenue model."
  - "Your spreadsheet tool, if you want the toll revenue model as a workbook."
you_get:
  - Billed receipts, cash receipts and operating cash for each of the three years.
  - "An editable workbook of the toll revenue model, with its inputs, formulas and test cases to rerun."
  - "A tie-out of chargeable passages, receipts and operating cash, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the traffic forecasts, the toll rate and the collection share."
  - "Tell it what you need: three years of toll receipts and operating cash."
  - "Ask it to stop and mark MISSING if a year of traffic or the toll rate is not in your sources."
  - "Check that each input is sourced with currency, scale, sign and period, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Three yearly counts of chargeable passages before collection loss
    - Toll per billable passage
    - Share of tolls collected in cash
    - Operating cash costs for each year
    - Reporting date, currency, scale and accounting basis
  prerequisites:
    - An AI that can create and recheck spreadsheet files
    - Node.js 20 or later, to run the bundled calculation (optional)
  output:
    - name: Scope and dated sources
      contains: The sources you gave, their dates, period boundaries and any evidence gaps still open.
    - name: Inputs and assumptions
      contains: Each input with its source, currency, scale and period, kept apart from assumptions.
    - name: Model calculations and reconciliations
      contains: Yearly billed receipts, cash collected, operating costs and operating cash, with checks that totals tie.
    - name: Actual file verification
      contains: What was recalculated, tested with a changed input, rendered and reopened in the workbook.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and any checks that failed or could not run.
how_it_works:
  - title: List and date the sources
    text: Note the traffic study, toll schedule, collection history and cost budget, and any gap in them.
  - title: Keep forecasts and counts apart
    text: Separate the study’s forecast from passages actually counted. Take out exempt vehicles and note the vehicle mix and the toll basis.
  - title: Work out billed and cash receipts
    text: Passages times toll gives billed receipts. Billed receipts times the cash collection share gives cash receipts. Counts that are already cash-paid are not cut for collection loss a second time.
  - title: Take off costs and test
    text: Subtract the same year’s operating costs. Show a volume change and a collection change one at a time, then hand each year’s cash to the coverage step.
output_shape: |-
  A three-year toll receipts and operating cash schedule.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Forecast year"
    how: "Take the forecast year from the traffic forecasts, the toll rate and the collection share. Use one currency and scale on every line."
  - what: "Collection share"
    how: "Change the collection share and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Each material input is sourced with currency, scale, sign and period.
judge:
  - Each material input is sourced with currency, scale, sign and period.
  - Actual records and scenarios remain separate; missing evidence is not zero.
  - Passages and toll cover the same vehicle mix; forecast traffic is never presented as independently measured demand.
  - Annual receipts sum to total receipts; operating cash excludes debt service and capital spending handled downstream.
  - Passage inputs mean billable or chargeable passages before collection loss; already-cash-paid units require a separately reconciled basis and must not receive the collection deduction again.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one toll revenue model you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define chargeable passage into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
