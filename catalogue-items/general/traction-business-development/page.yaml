new_slug: traction-business-development
name: Partnership experiment planner
summary: Plan a partnership test for your software product. Paste your link. You get one small pilot with a cost cap, measures and a stop rule.
job: sell-and-negotiate
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Partnership experiment planner
subhead: Paste your product link and add your goal, budget and time limits if you have them. Get advice tied to your business, a small test with clear limits, and the facts still needed before you act.
explain: >-
  A focused business development plan for your product. It reads the buyer and offer, checks why this channel might work and writes a small test. The default is SaaS; you can ask for general-business mode.


  Prepare a small number of researched partner proposals with a limited co-marketing or integration test before negotiating a broad agreement.


  A signed agreement is not distribution. Separate sourced accounts from accounts merely influenced by a partner.
when:
  - You think a partner shares your buyers and want a small test before any big deal.
  - You need a practical way to find customers for a software business.
  - You want to test a growth idea before committing more time or money.
not_for:
  - "You want to compare all 19 growth channels first: use the Traction workflow, then come back here if partnerships win."
  - "You have no shared buyer with any partner, or only one partner deal in mind: talk to that partner directly and agree a small trial."
  - "You sell a consumer product with no software or service side: ask a local distributor or supplier for a trial instead."
you_give:
  - A public product link or pasted product and pricing text
  - Your growth goal, stage and buyer, if known
  - Cash and time limits, past tests and results, if available
you_get:
  - A recommendation with its evidence and missing facts
  - A small test with an owner, cost cap and decision rule
  - The next action and what needs approval
how_to_use:
  - Add the skill or whole workflow pack to your AI.
  - Paste your product URL and any facts you already know.
  - Ask it to follow the skill and cite what it can verify.
  - Review the plan and approve any external action separately.
output_sample:
  input:
    - Your product link, or pasted product and pricing text
    - Your growth goal and deadline (optional)
    - Your cash cap and weekly hours (optional)
    - Past tests and results (optional)
  prerequisites:
    - An AI that can browse the web, or pasted page text if it cannot
  output:
    - name: Recommendation
      contains: Whether to test partnerships now, later or not at all, with the main reason.
    - name: Evidence
      contains: Each fact used, with its source link, access date and what it means for the plan.
    - name: Buyer and useful action
      contains: Who the buyer is and the first useful thing they do in your product.
    - name: Channel mechanism
      contains: How a partner would help that buyer reach value.
    - name: Pilot
      contains: The test idea, audience, offer, deliverable and who owns it.
    - name: Limits
      contains: Cash cap, hours and end date, marked as proposed or approved.
    - name: Measurement
      contains: Events to track, the buyer group, counts to divide by and how credit is given.
    - name: Decision
      contains: The rule for when to continue, revise or stop.
    - name: Risks and next action
      contains: The main risks and the one next step, with anything needing your approval.
    - name: MISSING
      contains: The facts still unknown that could change the plan.
how_it_works:
  - title: Compare partnership types
    text: Compare distribution, integration, co-marketing and licensing partnerships. Identify the shared buyer and each side's actual incentive.
  - title: Map a realistic partner pipeline
    text: Map a realistic partner pipeline with evidence, decision owner, mutual value, dependencies and a modest next commitment.
  - title: Draft a pilot with an exit
    text: Draft a pilot with responsibilities, referral ownership, implementation effort, data access, success criteria and an exit condition.
output_shape: |
  Recommendation: <test now / later / weak fit, with reason>
  Evidence: <source URL, access date, fact, implication>
  Buyer and useful action: <...>
  Channel mechanism: <how the buyer reaches value>
  Pilot: <hypothesis, audience, offer, deliverable, owner>
  Limits: <cash, hours, date, proposed or approved>
  Measurement: <events, cohort, denominators, attribution>
  Decision: <continue / revise / stop rule>
  Risks and next action: <...>
  Produces: <a partner-fit matrix, mutual-value memo, proposal and pilot terms checklist>
  MISSING: <unknowns>
  CHECKS MISSED: <one line each, or none>
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. Missing limits remain proposed assumptions.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - A partner signs a memorandum but sends no buyers. Record a partnership milestone, not acquired customers.
  - Give no budget or results. The output must mark limits as proposed and withhold a success claim.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
