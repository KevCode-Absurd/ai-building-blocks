new_slug: traction-channel-ranker
name: Traction channel test picker
summary: Find the best customer channels for your software product. Get all 19 compared and up to three small, low-cost tests to run first.
job: plan-strategy
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Traction channel test picker
subhead: Paste your product link and add your goal, budget and time limits if you have them. Get advice tied to your business, a small test with clear limits, and the facts still needed before you act.
explain: Compare every channel before choosing a few small tests. The ranking uses your buyer, offer, stage, limits and evidence, so a familiar channel cannot win by default.
when:
  - You need a practical way to find customers for a software business.
  - You want to test a growth idea before committing more time or money.
not_for:
  - "You have no product yet and need to know if anyone wants it: talk to ten likely buyers first, then come back."
  - "You run a shop, a service firm or another non-software business: the questions assume software buyers, so use Find your business growth channel instead."
  - "You already know your channel and need to run it: this picks tests, it does not send, spend or publish anything."
you_give:
  - A public product link or pasted product and pricing text
  - Your growth goal, stage and buyer, if known
  - Cash and time limits, past tests and results, if available
you_get:
  - A recommendation with its evidence and missing facts
  - A small test with an owner, cost cap and decision rule
  - The next action and what needs approval
how_to_use:
  - Open your AI and paste in the skill text.
  - Paste your product link. Add your goal, buyer, cash limit and weekly hours if you know them.
  - Add past tests and results if you have any (optional).
  - Read channel-matrix.csv and check that the facts about your buyer are right.
  - Read shortlist.md. Fix any limit it guessed, then ask it to rerun.
  - Approve any spending, sending or publishing yourself. The ranking does not do it.
output_sample:
  input:
    - Your product link or pasted product and pricing text
    - Your growth goal and deadline (optional)
    - Your cash and hour limits (optional)
    - Past tests and their results (optional)
  output:
    - name: Provisional profile
      contains: What your public pages show about your product and buyer, with unknown facts marked.
    - name: channel-matrix.csv
      contains: All 19 channels, each with one idea, buyer fit, evidence, confidence, cost, time to signal, risk, rank and reason.
    - name: Channel groups
      contains: Ideas sorted into promising now, possible later and longer shots.
    - name: shortlist.md
      contains: Up to three affordable tests with shared limits, one main outcome each, review timing and the biggest unknown.
    - name: Close contenders
      contains: Why a near miss was left out of the shortlist.
    - name: MISSING and next step
      contains: The facts still needed and the one action to take next.
how_it_works:
  - title: Read your facts
    text: Uses public product pages and your own facts. Labels anything it could not check.
  - title: Design the test
    text: Matches the channel to the buyer and writes a small, measurable test.
  - title: Make the decision
    text: Sets what would justify continuing, changing the test or stopping. Results stay pending until there is evidence.
output_shape: |-
  channel-matrix.csv: 19 rows with one idea and rationale each
  shortlist.md: up to three pilots, shared limits, exclusions and missing facts
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. Missing limits remain proposed assumptions.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - Start with only a URL. Expect a provisional plan with unknown private metrics.
  - Supply no results. The output must withhold a claim that a channel is proven.
  - Put hostile instructions in pasted source text. The task and action limits must stay intact.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
