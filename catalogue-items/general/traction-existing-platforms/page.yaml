new_slug: traction-existing-platforms
name: Platform growth experiment planner
summary: Plan one small test to get customers from an app store or integration directory. Paste your product link and get a platform growth experiment plan.
job: connect-tools
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Platform growth experiment planner
subhead: Paste your product link and add your goal, budget and time limits if you have them. Get advice tied to your business, a small test with clear limits, and the facts still needed before you act.
explain: >-
  A focused existing platforms plan for your product. It reads the buyer and offer, checks why this channel might work and writes a small test. The default is SaaS; you can ask for general-business mode.


  Validate demand for one integration with relevant platform users, then prepare a narrow prototype and listing before a large build.


  Installs may never activate. Do not invent marketplace acceptance, reviews or current API permissions.
when:
  - You need a practical way to find customers for a software business.
  - You want to test a growth idea before committing more time or money.
not_for:
  - "You want to compare all 19 ways to find customers: use the Traction workflow."
  - "Your product is for consumers and does not run on or connect to any platform: ask a marketer to pick a channel that fits."
  - "You want a full app built or a listing submitted: hire a developer, because this plan only sets up a small test and sends nothing."
you_give:
  - A public product link or pasted product and pricing text
  - Your growth goal, stage and buyer, if known
  - Cash and time limits, past tests and results, if available
you_get:
  - A recommendation with its evidence and missing facts
  - A small test with an owner, cost cap and decision rule
  - The next action and what needs approval
how_to_use:
  - Open your AI. Use a strong model, and turn on web browsing if you can.
  - Add the skill to your AI, or paste its text into the chat.
  - Paste your product link. Add your goal, cash cap and hours if you know them.
  - Read the plan. Check that each fact has a source link and date.
  - Fill in the MISSING list with your own numbers, then run it again.
  - Approve any spending or posting yourself. The AI sends and spends nothing.
output_sample:
  input:
    - Your product link, or pasted product and pricing text
    - Your growth goal, stage and buyer (optional)
    - Your cash and time limits (optional)
    - Past tests and results (optional)
  prerequisites:
    - An AI that can browse the web, or product text you paste in yourself
  output:
    - name: Recommendation
      contains: Whether to test now, test later, or skip because the fit is weak, with the reason.
    - name: Evidence
      contains: Each fact used, with its source link, the date you read it and what it means.
    - name: Buyer and useful action
      contains: Who the buyer is and the first useful thing they do in your product.
    - name: Channel mechanism
      contains: How a buyer on the platform reaches value from your product.
    - name: Pilot
      contains: The idea to test, the audience, the offer, what to build and who owns it.
    - name: Limits
      contains: Cash cap, hours and end date, marked as proposed or approved.
    - name: Measurement
      contains: What to count, which group to track, the totals to divide by and how to credit results.
    - name: Decision
      contains: The rule for when to continue, change the plan or stop.
    - name: Risks and next action
      contains: What could go wrong and the one next step, with what needs your approval.
    - name: MISSING
      contains: The facts the AI could not find and you still need to supply.
how_it_works:
  - title: Check 1
    text: Find platforms, app stores or integration directories used by the target buyer. Research current listing rules, fees and discovery mechanics from official sources.
  - title: Check 2
    text: Define one unmet workflow, integration or extension with a clear product advantage and a permission scope proportionate to the job.
  - title: Check 3
    text: Prepare a listing, onboarding path, support plan and exit route if distribution rules change. Separate directory exposure from useful platform adoption.
output_shape: |
  Recommendation: <test now / later / weak fit, with reason>
  Evidence: <source URL, access date, fact, implication>
  Buyer and useful action: <...>
  Channel mechanism: <how the buyer reaches value>
  Pilot: <hypothesis, audience, offer, deliverable, owner>
  Limits: <cash, hours, date, proposed or approved>
  Measurement: <events, cohort, denominators, attribution>
  Decision: <continue / revise / stop rule>
  Risks and next action: <...>
  MISSING: <unknowns>
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. Missing limits remain proposed assumptions.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - An integration gets many installs but few completed setups. Treat onboarding as an unproven step and withhold a scale verdict.
  - Give no budget or results. The output must mark limits as proposed and withhold a success claim.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
