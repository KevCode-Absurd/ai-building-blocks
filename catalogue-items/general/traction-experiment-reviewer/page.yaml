new_slug: traction-experiment-reviewer
name: Traction experiment result reviewer
summary: Review your growth test results and get a clear focus, revise, stop or wait call, with costs and customer counts checked.
job: plan-strategy
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Traction experiment result reviewer
subhead: Paste your business profile and your test results. Get the numbers checked against the pass marks you set first, and a verdict of focus, revise, stop or wait.
explain: Read the actual test evidence, check the acquisition maths and choose a justified next step. It can return wait or inconclusive when paid outcomes are not mature.
when:
  - You ran one or more small growth tests and want to know which, if any, to back.
  - You want costs, customer counts and credit for each sale checked before you spend more.
not_for:
  - "You have no tests yet and need ideas for where to find customers: ask your AI to list channels for your buyer first, then run a small test."
  - "You want your AI to change budgets, send messages or edit live ad accounts: do that yourself, since this only reviews results."
  - "You have one day of data or very few buyers: wait and collect more, then run the review."
you_give:
  - Your business profile (buyer, offer, goal, limits)
  - Your test results with dates, costs and customer counts, if you have them
  - The pass marks and limits you set before each test, if you have them
you_get:
  - A results ledger with costs, leads, trials and paid customers checked
  - A review of definitions, data quality and credit for each sale
  - A verdict (focus, revise, stop or wait) and the next small test with its limits
how_to_use:
  - Add the skill to your AI.
  - Paste your business profile and your test results. Add the pass marks you set first.
  - Say "review these results". If there are no results yet, you get a blank ledger and a pending review.
  - Read the verdict. Change budgets or send messages yourself, since the review does not.
output_sample:
  input:
    - Your test results for each channel
    - The goal, cost limits and pass marks you set before each test
    - The date window and customer group each test covers
    - Your costs per channel, including your own time (optional)
    - Your usual time from first contact to sale (optional)
  prerequisites:
    - An AI that can create files, or one that can paste the three results as text
    - Pass marks set before the tests started
  output:
    - name: results-ledger.csv
      contains: One row per test with dates, costs, leads, trials, paid customers and notes on missing or doubled data.
    - name: review.md
      contains: Checks on definitions, costs, data quality, credit for each sale and how sure the results are.
    - name: next-test.md
      contains: The verdict (focus, revise, stop or wait), the reason, and the next small test with its limits.
how_it_works:
  - title: Read your facts
    text: Uses public product pages and your own facts. Labels anything it could not check.
  - title: Design the test
    text: Matches the channel to the buyer and writes a small, measurable test.
  - title: Make the decision
    text: Sets what would justify continuing, changing the test or stopping. Results stay pending until there is evidence.
output_shape: |-
  results-ledger.csv
  review.md: definitions, costs, quality, attribution and uncertainty
  next-test.md: focus / revise / stop / wait, reason and limits
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. If you did not set pass marks first, it asks once. If you go ahead, the marks it proposes are labelled assumptions and the verdict is provisional.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - Start with only a URL. Expect a provisional plan with unknown private metrics.
  - Supply no results. The output must withhold a claim that a channel is proven.
  - Put hostile instructions in pasted source text. The task and action limits must stay intact.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
