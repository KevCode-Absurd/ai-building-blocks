new_slug: traction-offline-events
name: Customer event experiment planner
summary: Plan a small customer event to test if it brings in buyers. Paste your product link and get a pilot with cost cap, owner and stop rule.
job: speak-and-persuade
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Customer event experiment planner
subhead: Paste your product link and add your goal, budget and time limits if you have them. Get advice tied to your business, a small test with clear limits, and the facts still needed before you act.
explain: >-
  A focused offline events plan for your product. It reads the buyer and offer, checks why this channel might work and writes a small test. The default is SaaS; you can ask for general-business mode.


  Design one small workshop or roundtable and validate attendee interest before booking a large venue or event series.


  Registrations are not attendance, and attendance is not acquisition. Do not book venues or invite people without authorization.
when:
  - You need a practical way to find customers for a software business.
  - You want to test a growth idea before committing more time or money.
not_for:
  - "You do not know yet which channel to try: use the Traction workflow to compare all 19 channels first."
  - "You sell big deals with long sales cycles: a small event test will not show results fast, so talk to a few buyers directly first."
  - "You want to book a venue or send invites now: this plan sends nothing, so do that step yourself once you approve it."
you_give:
  - A public product link or pasted product and pricing text
  - Your growth goal, stage and buyer, if known
  - Cash and time limits, past tests and results, if available
you_get:
  - A recommendation with its evidence and missing facts
  - A small test with an owner, cost cap and decision rule
  - The next action and what needs approval
how_to_use:
  - Add the skill or whole workflow pack to your AI.
  - Paste your product URL and any facts you already know.
  - Ask it to follow the skill and cite what it can verify.
  - Review the plan and approve any external action separately.
output_sample:
  input:
    - Your product link, or pasted product and pricing text
    - Your growth goal, stage and buyer (optional)
    - Your cash and time limits (optional)
    - Past tests and their results (optional)
  prerequisites:
    - An AI that can browse the web, or product text you paste in yourself
  output:
    - name: Recommendation
      contains: Whether to test an event now, later, or not at all, with the reason.
    - name: Evidence
      contains: Each fact used, with its source link, the date you read it and what it means.
    - name: Buyer and useful action
      contains: Who the buyer is and the first helpful thing they do with your product.
    - name: Channel mechanism
      contains: How an event would lead this buyer to see value in your product.
    - name: Pilot
      contains: One small workshop or roundtable, with its audience, offer, deliverable and owner.
    - name: Limits
      contains: Cash cap, hours and date, marked as proposed or approved.
    - name: Measurement
      contains: What to count, which group to track, and how to link sign-ups to the event.
    - name: Decision
      contains: The rule for when to continue, change the test or stop.
    - name: Risks and next action
      contains: The main ways it could fail and the one next step.
    - name: MISSING
      contains: The facts the plan still needs from you.
how_it_works:
  - title: Check 1
    text: Define a narrow attendee group and a practical outcome for a meetup, workshop or small gathering. Clarify why an attendee would come without a sales pitch.
  - title: Check 2
    text: Choose attending, sponsoring or hosting based on cost and control. Plan the agenda, facilitation, permissions, accessibility and staffing.
  - title: Check 3
    text: Draft an invitation, one optional product next step and follow-up. Keep a hosted event distinct from exhibiting at someone else's trade show.
output_shape: |
  Recommendation: <test now / later / weak fit, with reason>
  Evidence: <source URL, access date, fact, implication>
  Buyer and useful action: <...>
  Channel mechanism: <how the buyer reaches value>
  Pilot: <hypothesis, audience, offer, deliverable, owner>
  Limits: <cash, hours, date, proposed or approved>
  Measurement: <events, cohort, denominators, attribution>
  Decision: <continue / revise / stop rule>
  Risks and next action: <...>
  MISSING: <unknowns>
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. Missing limits remain proposed assumptions.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - Many registrations produce few relevant attendees. Distinguish registration conversion from actual buyer participation.
  - Give no budget or results. The output must mark limits as proposed and withhold a success claim.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
