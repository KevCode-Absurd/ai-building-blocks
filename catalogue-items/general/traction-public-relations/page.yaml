new_slug: traction-public-relations
name: Press outreach experiment planner
summary: Plan a press outreach test for your product. Paste your link and get a small pilot with a reporter list, one pitch, cost caps and stop rules.
job: speak-and-persuade
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Press outreach experiment planner
subhead: Paste your product link and add your goal, budget and time limits if you have them. Get advice tied to your business, a small test with clear limits, and the facts still needed before you act.
explain: >-
  A focused public relations plan for your product. It reads the buyer and offer, checks why this channel might work and writes a small test. The default is SaaS; you can ask for general-business mode.


  Prepare a short list of relevant reporters and one evidence-backed pitch. Test a small approved outreach batch before expanding it.


  Coverage and estimated readership are exposure measures, not acquired customers. Do not invent press contacts, quotes or editorial interest.
when:
  - You need a practical way to find customers for a software business.
  - You want to test a growth idea before committing more time or money.
not_for:
  - "Your product has no public story, milestone or customer insight yet: build one first, or pick a different channel to test."
  - "You want to compare press with all the other ways to find customers: use the Traction workflow."
  - "You need press contact details or a promise of coverage: this plan will not invent either, so ask a PR person or check each outlet's own site."
  - "You want a media list, pitch emails and a press kit outline: use the Press outreach planner."
you_give:
  - A public product link or pasted product and pricing text
  - Your growth goal, stage and buyer, if known
  - Cash and time limits, past tests and results, if available
you_get:
  - A recommendation with its evidence and missing facts
  - A small test with an owner, cost cap and decision rule
  - The next action and what needs approval
how_to_use:
  - Open Claude, ChatGPT or Gemini. Web browsing helps but is not required.
  - Paste your product link, or paste your product and pricing text.
  - Add your goal, buyer, budget and hours if you know them.
  - Ask it to plan a press outreach test and cite what it can verify.
  - Check the Evidence and MISSING sections, then fill the gaps.
  - Approve any sending or spending yourself. The plan sends nothing.
output_sample:
  input:
    - Your product link, or pasted product and pricing text
    - Your growth goal, stage and buyer (optional)
    - Your cash and time limits (optional)
    - Past tests and results (optional)
  prerequisites:
    - An AI that can browse the web helps. Without it, paste your page text.
  output:
    - name: Recommendation
      contains: Whether to test press now, later or not at all, with the reason.
    - name: Evidence
      contains: Each fact used, with its source link, access date and what it means.
    - name: Buyer and useful action
      contains: Who buys, and the first useful thing they do in your product.
    - name: Channel mechanism
      contains: How a reader of a story would reach value in your product.
    - name: Pilot
      contains: The hypothesis, audience, offer, deliverable and owner for one small outreach batch.
    - name: Limits
      contains: Cash, hours and end date, marked as proposed or approved.
    - name: Measurement
      contains: What to count, which group, and how to credit visits to coverage.
    - name: Decision
      contains: The rule for when to continue, revise or stop.
    - name: Risks and next action
      contains: What could go wrong and the one step to take next.
    - name: MISSING
      contains: The facts the AI could not find and you need to supply.
how_it_works:
  - title: Check 1
    text: Identify a dated milestone, unusual customer insight or original research. Separate evidence from the company's promotional claims.
  - title: Check 2
    text: Find reporters by recent relevant coverage. Record the article, date, reader fit and a specific reason each reporter might care; leave contact details unknown unless publicly verified.
  - title: Check 3
    text: Consider a small specialist outlet before a broad publication. Build one concise pitch with a clear news hook, evidence, spokesperson and useful source material.
output_shape: |
  Recommendation: <test now / later / weak fit, with reason>
  Evidence: <source URL, access date, fact, implication>
  Buyer and useful action: <...>
  Channel mechanism: <how the buyer reaches value>
  Pilot: <hypothesis, audience, offer, deliverable, owner>
  Limits: <cash, hours, date, proposed or approved>
  Measurement: <events, cohort, denominators, attribution>
  Decision: <continue / revise / stop rule>
  Risks and next action: <...>
  MISSING: <unknowns>
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. Missing limits remain proposed assumptions.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - A large outlet links to a launch, but no downstream conversions are available. Report exposure and missing attribution, not a successful acquisition channel.
  - Give no budget or results. The output must mark limits as proposed and withhold a success claim.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
