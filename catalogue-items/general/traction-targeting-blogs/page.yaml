new_slug: traction-targeting-blogs
name: Niche publication experiment planner
summary: Find niche blogs and newsletters that reach your buyers. Get a small placement test with a cost cap, tracking and a clear stop rule.
job: grow-social
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Niche publication experiment planner
subhead: Paste your product link and add your goal, budget and time limits if you have them. Get advice tied to your business, a small test with clear limits, and the facts still needed before you act.
explain: >-
  A focused targeting blogs plan for your product. It reads the buyer and offer, checks why this channel might work and writes a small test. The default is SaaS; you can ask for general-business mode.


  Prepare a small publisher shortlist and one contribution or sponsorship proposal, then test a limited approved placement.


  Do not merge paid placements with earned press. Current publication audiences and prices require fresh evidence.
when:
  - You need a practical way to find customers for a software business.
  - You want to test a growth idea before committing more time or money.
not_for:
  - "You want to compare all 19 growth channels first: use the Traction workflow."
  - "You have no buyer evidence yet: talk to a few likely buyers first, then come back."
  - "You want free press coverage from journalists: ask a PR person, because this plan covers paid or guest placements only."
you_give:
  - A public product link or pasted product and pricing text
  - Your growth goal, stage and buyer, if known
  - Cash and time limits, past tests and results, if available
you_get:
  - A recommendation with its evidence and missing facts
  - A small test with an owner, cost cap and decision rule
  - The next action and what needs approval
how_to_use:
  - Open Claude, ChatGPT or Gemini. Web browsing helps, but you can paste your page text instead.
  - Paste this skill into the chat.
  - Paste your product link, plus your goal, budget and hours if you know them.
  - Read the Recommendation and MISSING lines first, then fill any gaps.
  - Approve any email, payment or posting yourself. The AI sends and spends nothing.
output_sample:
  input:
    - Your product link, or pasted product and pricing text
    - Your growth goal, stage and buyer (optional)
    - Your cash and time limits (optional)
    - Past tests and results (optional)
  prerequisites:
    - An AI that can browse the web helps. Without it, paste your page text.
  output:
    - name: Recommendation
      contains: Whether to test this channel now, later or not at all, with the reason.
    - name: Evidence
      contains: Each fact used, with its source link, the date you read it and what it means.
    - name: Buyer and useful action
      contains: Who the buyer is and the first useful thing they do in your product.
    - name: Channel mechanism
      contains: How a reader of a niche publication gets to your product and sees its value.
    - name: Pilot
      contains: The idea to test, the audience, the offer, what you deliver and who owns it.
    - name: Limits
      contains: Cash cap, hours and end date, marked as proposed or approved.
    - name: Measurement
      contains: What you count, which group, and how you credit each publication.
    - name: Decision
      contains: The rule for when to continue, change the test or stop.
    - name: Risks and next action
      contains: What could go wrong and the one step to take next.
    - name: MISSING
      contains: Facts the AI could not find and you need to supply.
how_it_works:
  - title: Check 1
    text: Research specialist blogs, newsletters and creators by recent audience-relevant work. Record evidence of buyer fit rather than treating follower counts as buying intent.
  - title: Check 2
    text: Compare a guest contribution, a useful early product preview and a disclosed sponsorship. State what the publisher and reader receive.
  - title: Check 3
    text: Choose a specific placement and landing page. Treat current rates, availability and publisher contacts as unknown until verified.
output_shape: |
  Recommendation: <test now / later / weak fit, with reason>
  Evidence: <source URL, access date, fact, implication>
  Buyer and useful action: <...>
  Channel mechanism: <how the buyer reaches value>
  Pilot: <hypothesis, audience, offer, deliverable, owner>
  Limits: <cash, hours, date, proposed or approved>
  Measurement: <events, cohort, denominators, attribution>
  Decision: <continue / revise / stop rule>
  Risks and next action: <...>
  MISSING: <unknowns>
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. Missing limits remain proposed assumptions.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - A large creator has a broad audience while a smaller newsletter reaches buyers. Evaluate buyer fit and customer cost before reach.
  - Give no budget or results. The output must mark limits as proposed and withhold a success claim.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
