new_slug: traction-trade-shows
name: Trade show experiment planner
summary: Plan a trade show test for your product. Paste your link. Get a small pilot with a cost cap, measures and a clear continue or stop rule.
job: sell-and-negotiate
thinking: high
thinking_why: It weighs buyer evidence, channel fit and test economics. Use your strongest model.
headline: Trade show experiment planner
subhead: Paste your product link and add your goal, budget and time limits if you have them. Get advice tied to your business, a small test with clear limits, and the facts still needed before you act.
explain: >-
  A focused trade shows plan for your product. It reads the buyer and offer, checks why this channel might work and writes a small test. The default is SaaS; you can ask for general-business mode.


  Attend or research a smaller relevant show and test pre-booked meetings before committing to a major booth.


  Badge scans are not qualified opportunities. Published attendance claims require source dates and do not prove buyer concentration.
when:
  - You are weighing a trade show and want a small test before paying for a booth.
  - You need a practical way to find customers for a software business.
  - You want to test a growth idea before committing more time or money.
not_for:
  - "You want to compare all 19 growth channels: use the Traction workflow."
  - "Your buyers do not go to trade shows or industry events: pick another channel and test that one instead."
  - "You want to book a big booth today: this plan tests a small step first, so ask a trade show organizer for a quote."
you_give:
  - The name, dates and location of the show you are weighing
  - A public product link or pasted product and pricing text
  - Your growth goal, stage and buyer, if known
  - Cash and time limits, past tests and results, if available
you_get:
  - A recommendation with its evidence and missing facts
  - A small test with an owner, cost cap and decision rule
  - The next action and what needs approval
how_to_use:
  - Add the skill or whole workflow pack to your AI.
  - Paste your product URL and any facts you already know.
  - Ask it to follow the skill and cite what it can verify.
  - Review the plan and approve any external action separately.
output_sample:
  input:
    - Your product link or pasted product and pricing text
    - Your growth goal, stage and buyer (optional)
    - Your cash and time limits (optional)
    - Past tests and results (optional)
  prerequisites:
    - An AI that can browse the web helps. Without it, paste your product page text.
  output:
    - name: Recommendation
      contains: Whether to test now, later, or skip, with the reason.
    - name: Evidence
      contains: Each fact with its source link, access date and what it means for you.
    - name: Buyer and useful action
      contains: Who you want to reach and the first useful thing they do with your product.
    - name: Channel mechanism
      contains: How a buyer met at a show gets to value.
    - name: Pilot
      contains: The test idea, audience, offer, deliverable and owner.
    - name: Limits
      contains: Cash cap, hours and date, marked as proposed or approved.
    - name: Measurement
      contains: What you count, which group, and how you credit wins.
    - name: Decision
      contains: The rule for when to continue, revise or stop.
    - name: Risks and next action
      contains: What could go wrong and the one next step.
    - name: MISSING
      contains: The facts the plan still needs from you.
how_it_works:
  - title: Research the show
    text: "Research the show's actual audience, prior attendee evidence and buyer roles. Choose one outcome: qualified customers, partners or press."
  - title: Compare ways to take part
    text: Compare attending, a small sponsorship and exhibiting. Include travel, staff time, booth materials, demos and follow-up cost.
  - title: Plan meetings and follow-up
    text: Draft pre-booked meeting outreach, a short demonstration, lead qualification questions and a dated follow-up plan.
output_shape: |
  Recommendation: <test now / later / weak fit, with reason>
  Evidence: <source URL, access date, fact, implication>
  Buyer and useful action: <...>
  Channel mechanism: <how the buyer reaches value>
  Pilot: <hypothesis, audience, offer, deliverable, owner>
  Limits: <cash, hours, date, proposed or approved>
  Measurement: <events, cohort, denominators, attribution>
  Decision: <continue / revise / stop rule, naming the cost cap and who approves spending>
  Risks and next action: <...>
  Produces: <a show comparison, total-cost budget, meeting plan, demo script and follow-up sequence>
  MISSING: <unknowns>
  CHECKS MISSED: <one line each, or none>
tweaks:
  - what: Your growth goal
    how: Give a target and deadline so the advice has something concrete to work towards.
  - what: Your real limits
    how: State your cash cap and available hours. Missing limits remain proposed assumptions.
judge:
  - Facts link to evidence, and guesses are marked.
  - The proposed action fits the buyer, budget and stage.
  - A lead or trial is never counted as a paid customer.
  - The result gives a clear next step and missing inputs.
test:
  - A booth collects many scans but no agreed next steps. Report contact volume and missing qualification, not pipeline value.
  - Give no budget or results. The output must mark limits as proposed and withhold a success claim.
improve:
  - Save results with the cohort and date window, then rerun the review.
  - Replace assumptions with your own observed numbers.
terms:
  - term: Traction
    meaning: Evidence that real customers want and use what you sell.
  - term: Activation
    meaning: The first useful action a new customer completes with your product.
  - term: CAC
    meaning: The cost to win a new paying customer, with the included costs stated.
