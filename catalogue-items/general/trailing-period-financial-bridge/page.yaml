new_slug: trailing-period-financial-bridge
name: Trailing-period financial bridge
headline: Trailing-period financial bridge
summary: Find a trailing 12-month figure for revenue or another flow. Give it last year and matching year-to-date numbers. You get a checked bridge.
job: track-numbers
thinking: high
thinking_why: "The sum only works for flows and when both periods match, so the period lengths and the cut-offs need checking."
subhead: Give it last full-year revenue (or another flow), this year to date and the same period last year. It adds and subtracts them into a trailing 12-month figure, and checks that both year-to-date periods match.
explain: |-
  A trailing 12-month figure shows the latest full twelve months of a flow, such as revenue, without waiting for the year-end report. You get it by adding this year to date to last full year, then taking off the same period last year.

  This skill does that sum and checks the traps: a year-to-date figure read as a single quarter, a prior period of a different length, restated comparatives and a changed fiscal year. Practice figures: last full year 100 + current year to date 40 - prior-year period 30 = trailing 110. The sum works for flows such as revenue, not for EPS, margins or balance-sheet figures.
when:
  - You want a trailing 12-month figure for revenue, operating profit or another flow.
  - You have the last annual report and two matching year-to-date statements.
  - A reviewer needs to trace the result back to its inputs and assumptions.
not_for:
  - "You need trailing EPS, margins or average-balance ratios: these need a different method, so work them out with your finance lead or accountant."
  - "You need a balance-sheet figure such as cash or debt: use the closing balance from the latest statement, not a trailing sum."
  - "You want to trade, file or move money from the result: this only checks the numbers, so ask a qualified person to act on it."
  - "You need one extra fiscal week taken out of this year's revenue: use the Extra-week revenue comparability schedule instead."
you_give:
  - Last full-year flow, current YTD flow, comparable prior YTD flow and fiscal-period definitions.
  - "The year-to-date cut-off, plus the currency and scale used for the trailing twelve months."
  - "Your spreadsheet tool, if you want the trailing twelve months as a workbook."
you_get:
  - A trailing 12-month figure built from last year, this year to date and the same period last year, with the period checks.
  - "An editable workbook of the trailing twelve months, with its inputs, formulas and test cases to rerun."
  - "A tie-out of the trailing figure and four quarters where available, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the last annual report and both year-to-date statements."
  - "Tell it what you need: the trailing figure built from last year, this year to date and the same period last year."
  - "Ask it to stop and mark MISSING if the prior year-to-date figure is not in your sources."
  - "Check that the prior year-to-date period has the same length and cut-off as the current one, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Your last full-year figure for one flow, such as revenue
    - Your current year-to-date figure for the same flow
    - Your year-to-date figure for the same period last year
    - Your fiscal year end, currency and scale
    - Your four quarter records (optional)
  prerequisites:
    - An AI that can build and check spreadsheet files, for the workbook
    - Node.js 20 or later, only to run the bundled calculation script (optional)
  output:
    - name: Scope and dated sources
      contains: The flow you chose, the reporting date, and where each number came from.
    - name: Inputs and assumptions
      contains: Each input with its period, currency, scale and sign, plus any assumption made.
    - name: Model calculations and reconciliations
      contains: "The bridge: last full year plus current year-to-date minus prior year-to-date, tied to quarter records where available."
    - name: Actual file verification
      contains: What was recalculated, inspected and reopened in the workbook, and what could not run.
    - name: "MISSING: lines"
      contains: Each input or evidence gap that stopped or limited a calculation.
    - name: CHECKS MISSED
      contains: Checks that failed or could not run, or none if all passed.
how_it_works:
  - title: Pick one flow and line up the periods
    text: Choose a flow such as revenue or operating profit. Match the fiscal cut-offs, currency and scope across the three statements.
  - title: Add and subtract
    text: Add current year to date to last full year, then subtract the same interval last year. Keep restated figures next to the originals.
  - title: Tie it to the quarters
    text: Compare the result with the last four quarter records where you have them, and show any gap. Keep balance-sheet figures, margins and EPS out of this sum.
output_shape: |-
  A trailing-period additive-flow reconciliation with period-boundary checks.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Year-to-date cut-off"
    how: "Take the year-to-date cut-off from the last annual report and both year-to-date statements. Use one currency and scale on every line."
  - what: "The figure being rolled"
    how: "Change the figure being rolled and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Prior YTD has the same duration and calendar cut-off as current YTD.
judge:
  - Prior YTD has the same duration and calendar cut-off as current YTD.
  - Cumulative YTD values are not mistaken for stand-alone quarter values.
  - Source each balance, flow, period, perimeter, currency and sign; distinguish a true zero from missing evidence.
  - Preserve reported measures beside analytical measures and retain unexplained residuals.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one trailing twelve months you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define year to date into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
