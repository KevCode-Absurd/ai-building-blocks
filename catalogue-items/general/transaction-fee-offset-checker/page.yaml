new_slug: transaction-fee-offset-checker
name: Transaction fee offset checker
headline: Transaction fee offset checker
summary: Check your private fund transaction fee offset. Give it the gross fee and eligible fees. You get the offset used, net fee due and carryforward.
job: money-and-investing
thinking: high
thinking_why: "Which fees qualify, and how much carries forward, both come from the agreement, so each must be read from it."
subhead: Give it the gross management fee, the transaction fees your fund received, the offset percentage from the fund agreement and the credit brought forward. You get the offset used, the net fee due and the credit carried forward.
explain: |-
  Some private fund agreements let transaction fees paid by portfolio companies cancel part of the management fee. Any credit not used in one period may carry to the next. Getting this wrong means the fund over- or under-charges its investors.

  This skill checks the arithmetic for one fund and one period. It lists each fee against the agreement’s eligible categories, applies the offset percentage, adds the credit brought forward, caps the offset at the gross fee, and rolls the unused credit forward. It does not read the contract for legal meaning. Practice figures only: the gross fee is 10 and the offset is 100%. Eligible fees of 6 plus a prior credit of 2 give an offset of 8, so the net fee is 2 and no credit is left. With eligible fees of 12 plus the 2 credit, 14 is available, the offset used is 10, the net fee is 0 and 4 carries forward.
when:
  - You need the offset used, the net management fee and the carryforward for one fund and one period.
  - A reviewer wants to trace the fee result back to the LPA terms and your inputs.
  - You hold transaction fees from portfolio companies and need to know how much of the management fee they cover.
not_for:
  - "You need to split fees across several funds or apply a tax gross-up: ask your fund accountant or counsel, because this checks one fund and one period only."
  - "You need refunds or expiring credits handled: ask your fund administrator, because this only covers carryforward that the LPA allows."
  - "You want to know if a fee is allowed under your LPA: ask your lawyer, because this checks the arithmetic and does not read the contract for legal meaning."
  - "You need a management fee compared before and after a change in basis or rate: use the Fund management fee change checker instead."
you_give:
  - Gross management fee, eligible received transaction fees, contractual offset percentage and verified beginning offset carryforward.
  - "The fee period, plus the currency and scale used for the management fee offset."
  - "Your spreadsheet tool, if you want the management fee offset as a workbook."
you_get:
  - The offset used, the net management fee due and the ending carryforward.
  - "An editable workbook of the management fee offset, with its inputs, formulas and test cases to rerun."
  - "A tie-out of gross fee, offset used and net fee, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the fund agreement and the fee income records."
  - "Tell it what you need: the offset used, the net management fee due and the carryforward."
  - "Ask it to stop and mark MISSING if the gross fee or the offset percentage is not in your sources."
  - "Check that an offset is not assumed from cash received without proof of eligibility and allocation, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Your gross management fee for the period
    - Your eligible transaction fees received, with the LPA fee terms
    - Your offset percentage from the LPA
    - Your verified beginning carryforward credit
    - Your reporting date, currency and scale
  prerequisites:
    - An AI that can create and open spreadsheet files
    - Node.js 20 or later, if you want to run the bundled calculation (optional)
  output:
    - name: Scope and dated sources
      contains: The sources used, their dates, and what the work covers.
    - name: Inputs and assumptions
      contains: Each input with its source, currency, scale and period, plus the assumptions made.
    - name: Model calculations and reconciliations
      contains: Offset used, net management fee and ending carryforward, with a check that the roll-forward ties.
    - name: Editable workbook
      contains: A native spreadsheet with inputs, calculations and checks you can change and recalculate.
    - name: Actual file verification
      contains: What was recalculated, inspected, rendered and reopened in the workbook.
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs that were not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: Sort the fees
    text: Match every fee received to the agreement’s eligible categories and the right fund. Set aside excluded items such as broken-deal costs.
  - title: Work out the offset available
    text: Apply the offset percentage to the eligible fees and add the credit brought forward.
  - title: Cap it and carry forward
    text: Use the offset only up to the gross fee. Carry unused credit forward only if the agreement allows it, and check that the roll-forward ties.
output_shape: |-
  Offset used, net management fee and carryforward roll-forward.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Fee period"
    how: "Take the fee period from the fund agreement and the fee income records. Use one currency and scale on every line."
  - what: "Offset percentage"
    how: "Change the offset percentage and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Offsets are not inferred from gross cash receipts without eligibility and allocation evidence.
judge:
  - Offsets are not inferred from gross cash receipts without eligibility and allocation evidence.
  - Used plus ending carryforward equals beginning credit plus newly eligible offsets.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one management fee offset you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define fee offset into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
