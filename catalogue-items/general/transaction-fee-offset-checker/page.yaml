new_slug: transaction-fee-offset-checker
name: Transaction fee offset checker
headline: Transaction fee offset checker
summary: Check your private fund transaction fee offset. Give it the gross fee and eligible fees. You get the offset used, net fee due and carryforward.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Offset used, net management fee and carryforward roll-forward. Share gross management fee, eligible received transaction fees, contractual offset percentage and verified beginning offset carryforward.
explain: |-
  Offset used, net management fee and carryforward roll-forward.

  Private fund fees. Illustrative figures only. Fees6 plus prior credit2 offset8 of10 due. Eligible fees12 plus2 offset10 and leave4 credit.
when:
  - You need the offset used, the net management fee and the carryforward for one fund and one period.
  - A reviewer wants to trace the fee result back to the LPA terms and your inputs.
  - You hold transaction fees from portfolio companies and need to know how much of the management fee they cover.
  - Do not use this for several funds, refunds, expiring credits or tax gross-ups. Ask your fund accountant instead.
not_for:
  - "You need to split fees across several funds or apply a tax gross-up: ask your fund accountant or counsel, because this checks one fund and one period only."
  - "You need refunds or expiring credits handled: ask your fund administrator, because this only covers carryforward that the LPA allows."
  - "You want to know if a fee is allowed under your LPA: ask your lawyer, because this checks the arithmetic and does not read the contract for legal meaning."
you_give:
  - Gross management fee, eligible received transaction fees, contractual offset percentage and verified beginning offset carryforward.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - Offset used, net management fee and carryforward roll-forward.
  - An illustrative editable workbook, input schema, executable calculation reference and golden test cases.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
output_sample:
  input:
    - Your gross management fee for the period
    - Your eligible transaction fees received, with the LPA fee terms
    - Your offset percentage from the LPA
    - Your verified beginning carryforward credit
    - Your reporting date, currency and scale
  prerequisites:
    - An AI that can create and open spreadsheet files
    - Node.js 20 or later, if you want to run the bundled calculation (optional)
  output:
    - name: Scope and dated sources
      contains: The sources used, their dates, and what the work covers.
    - name: Inputs and assumptions
      contains: Each input with its source, currency, scale and period, plus the assumptions made.
    - name: Model calculations and reconciliations
      contains: Offset used, net management fee and ending carryforward, with a check that the roll-forward ties.
    - name: Editable workbook
      contains: A native spreadsheet with inputs, calculations and checks you can change and recalculate.
    - name: Actual file verification
      contains: What was recalculated, inspected, rendered and reopened in the workbook.
    - name: "MISSING: and CHECKS MISSED"
      contains: Inputs that were not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: 1. Map every received fee to the LPA eligible categories and fund allocation; separate prohibited or excluded interest and broken-deal costs
    text: Map every received fee to the LPA eligible categories and fund allocation; separate prohibited or excluded interest and broken-deal costs.
  - title: 2. Apply the actual offset percentage to eligible fees and add beginning carryforward
    text: Apply the actual offset percentage to eligible fees and add beginning carryforward.
  - title: 3. Use offsets only up to gross fee; carry unused credit forward only if the LPA allows it and reconcile the ending balance
    text: Use offsets only up to gross fee; carry unused credit forward only if the LPA allows it and reconcile the ending balance.
output_shape: |-
  Offset used, net management fee and carryforward roll-forward.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Offsets are not inferred from gross cash receipts without eligibility and allocation evidence.
judge:
  - Offsets are not inferred from gross cash receipts without eligibility and allocation evidence.
  - Used plus ending carryforward equals beginning credit plus newly eligible offsets.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
