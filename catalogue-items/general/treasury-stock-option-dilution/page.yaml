how_it_works:
  - title: 1. Read the option terms and identify instruments eligible for the treasury-stock method; determine all assumed proceeds required by the applicable standard
    text: Read the option terms and identify instruments eligible for the treasury-stock method; determine all assumed proceeds required by the applicable standard.
  - title: 2. Divide assumed proceeds by average period market price to obtain hypothetical repurchases; incremental shares are the positive excess of options over repurchases
    text: Divide assumed proceeds by average period market price to obtain hypothetical repurchases; incremental shares are the positive excess of options over repurchases.
  - title: 3. Add eligible incremental shares to basic weighted shares, calculate candidate EPS and check anti-dilution and time weighting before inclusion
    text: Add eligible incremental shares to basic weighted shares, calculate candidate EPS and check anti-dilution and time weighting before inclusion.
