new_slug: treasury-stock-option-dilution
name: Treasury-stock option dilution
headline: Treasury-stock option dilution
summary: Work out treasury stock method dilution from your option terms and average share price. You get incremental shares and a diluted EPS check.
job: money-and-investing
thinking: high
thinking_why: "Options only dilute when they are in the money, and the assumed proceeds depend on the plan terms."
subhead: A treasury-stock-method option schedule with out-of-money and diluted-EPS checks. Share weighted options, exercise proceeds including applicable assumed proceeds, average market price, basic weighted shares and continuing ordinary earnings.
explain: |-
  A treasury-stock-method option schedule with out-of-money and diluted-EPS checks.

  Public equity and share counts. Illustrative figures. Ten million options × $6 yields $60 million proceeds, buying six million shares at $10. Four million incremental shares produce 208 / 104 = $2 EPS. At $10 exercise price there is no incremental dilution.
when:
  - You need to find the extra shares that stock options add to a diluted share count.
  - You must show a reviewer how diluted EPS was reached, from the option terms to the result.
  - You want to test whether options at a given exercise price dilute at all at the average share price.
not_for:
  - "You have several option classes, restricted units or tax-affected awards: this schedule covers one option class, so use a full diluted-EPS model built by your accountant."
  - "You need a legal reading of the option contract or a view on whether to invest: ask a qualified adviser, because this only does the arithmetic."
  - "You only need basic EPS with no options or other dilutive items: divide earnings by basic weighted shares in a simple spreadsheet."
  - "Your dilution comes from a convertible, not options: use the Convertible EPS inclusion test instead."
you_give:
  - Weighted options, exercise proceeds including applicable assumed proceeds, average market price, basic weighted shares and continuing ordinary earnings.
  - "The average price period, plus the currency and scale used for the option dilution."
  - "Your spreadsheet tool, if you want the option dilution as a workbook."
you_get:
  - A treasury-stock-method option schedule with out-of-money and diluted-EPS checks.
  - "An editable workbook of the option dilution, with its inputs, formulas and test cases to rerun."
  - "A tie-out of options, assumed repurchases and added shares, the inputs still missing and the checks that ran."
how_to_use:
  - "Download the pack and give your AI its SKILL.md. Then add the option terms, the average share price and basic weighted shares."
  - "Tell it what you need: the extra shares the options add and a diluted EPS check."
  - "Ask it to stop and mark MISSING if the exercise terms or the average price is not in your sources."
  - "Check that the average price for the period is used, not the closing price, then read CHECKS MISSED before you rely on the result."
output_sample:
  input:
    - Number of options (weighted) and their exercise price
    - Average market price for the period
    - Basic weighted shares
    - Continuing ordinary earnings
    - Reporting date, currency and scale
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation script
  output:
    - name: Treasury-stock-method option schedule
      contains: Assumed proceeds, hypothetical share buyback and incremental shares, with out-of-money options counted as zero.
    - name: Diluted-EPS checks
      contains: Candidate diluted EPS against basic EPS, with anti-dilution and time-weighting checks before the shares are included.
    - name: Scope and dated sources
      contains: The sources used, with their dates, currency and scale.
    - name: Inputs and assumptions
      contains: Each input and assumption, kept apart from reported facts.
    - name: Model calculations and reconciliations
      contains: The workings and the independent comparisons that explain any differences.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation, a changed input and reopening the saved file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and checks that failed or could not run, or the word none.
how_it_works:
  - title: 1. Read the option terms and identify instruments eligible for the treasury-stock method; determine all assumed proceeds required by the applicable standard
    text: Read the option terms and identify instruments eligible for the treasury-stock method; determine all assumed proceeds required by the applicable standard.
  - title: 2. Divide assumed proceeds by average period market price to obtain hypothetical repurchases; incremental shares are the positive excess of options over repurchases
    text: Divide assumed proceeds by average period market price to obtain hypothetical repurchases; incremental shares are the positive excess of options over repurchases.
  - title: 3. Add eligible incremental shares to basic weighted shares, calculate candidate EPS and check anti-dilution and time weighting before inclusion
    text: Add eligible incremental shares to basic weighted shares, calculate candidate EPS and check anti-dilution and time weighting before inclusion.
output_shape: |-
  A treasury-stock-method option schedule with out-of-money and diluted-EPS checks.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Average price period"
    how: "Take the average price period from the option terms, the average share price and basic weighted shares. Use one currency and scale on every line."
  - what: "Average share price"
    how: "Change the average share price and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: Average period price is used rather than the closing price.
judge:
  - Average period price is used rather than the closing price.
  - Out-of-money options contribute zero incremental shares; assumed proceeds include required non-exercise components where applicable.
  - Tie every material input to its filing page, period, currency and scale.
  - Keep illustrative figures separate from sourced issuer facts; report unresolved checks.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one option dilution you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define treasury stock method into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
