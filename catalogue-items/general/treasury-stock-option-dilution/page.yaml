new_slug: treasury-stock-option-dilution
name: Treasury-stock option dilution
headline: Treasury-stock option dilution
summary: Use option terms and average share prices to reconcile incremental diluted shares.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A treasury-stock-method option schedule with out-of-money and diluted-EPS checks. Share weighted options, exercise proceeds including applicable assumed proceeds, average market price, basic weighted shares and continuing ordinary earnings.
explain: |-
  A treasury-stock-method option schedule with out-of-money and diluted-EPS checks.

  Public equity and share counts. Illustrative figures. Ten million options × $6 yields $60 million proceeds, buying six million shares at $10. Four million incremental shares produce 208 / 104 = $2 EPS. At $10 exercise price there is no incremental dilution.
when:
  - You need a treasury-stock-method option schedule with out-of-money and diluted-EPS checks.
  - You work on public equity and share counts and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
