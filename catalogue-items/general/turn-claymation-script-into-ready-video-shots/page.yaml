new_slug: turn-claymation-script-into-ready-video-shots
name: Turn your claymation script into ready-to-make video shots
summary: Paste-ready prompts that keep your clay character, set and product the same in every clip.
job: make-video-ads

headline: Get clay-animation clips that match from first to last, with your label never redrawn
subhead: Give it a narrated claymation script and a photo of your product. It fixes one clay character, one tabletop set and one object that changes, then hands you still prompts to approve and a clip prompt for every part of the script.

explain: |
  AI video tools drift. The character's hair changes between clips, clay turns into shiny plastic, your label gets redrawn with wrong letters, and the one change the ad depends on happens off screen. You end up paying for the same clip again and again.

  This skill turns a claymation script into instructions a video tool can follow shot by shot. It writes four fixed lines (character, material, light, product) that you paste unchanged into every prompt, so nothing drifts. It plans the opening still image for you to approve before any video is made, then one clip per part of the script, each with one small clay move and one change of state. Your product always comes from its real photo, and a checklist tells you what to look for in each clip.

when:
  - You have a claymation script and need prompts for an AI image and video tool.
  - Your earlier clips kept changing the character, the set or the product label.
  - You want the change in the ad (a knot loosening, a stack shrinking) to happen on camera, at real clay speed.

you_give:
  - The narrated script, line by line
  - A photo of your product's front, plus how it's used and how it works
  - Your colours, the buyer's moment and what never to show (optional)
  - The clip lengths your video tool accepts (optional)
you_get:
  - The idea in one line, with the changing object's three states
  - Four fixed lines to paste unchanged into every prompt
  - A character still prompt and an opening frame prompt to approve first
  - One clip prompt per part of the script, plus a checklist for each clip

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste your script underneath, then attach or describe your product photo, how it's used and your approved claims.
  - Say which video tool you use and the clip lengths it allows, for example "8 to 10 second clips".
  - Make the character still first. Only move on when you like it.
  - Make the opening frame from the character still and the product photo, then make each clip from the approved still.
  - Check every clip against the checklist at the end before you join them.

how_it_works:
  - title: Finds what changes
    text: Picks one clay object with three states and one thing that acts on it. A stranger with the sound off should be able to say what changed.
  - title: Fixes the character
    text: Writes one sentence for the clay character and reuses it unchanged. An adult who looks like the buyer, never a child or a real person, and who never talks.
  - title: Builds one set
    text: A small tabletop set from the buyer's moment, three or four pieces, no words anywhere, with everything except the product made of clay.
  - title: Names two palettes
    text: Grey and cool for the problem, your brand colours once it changes. Until then, the product is the only thing in your colours.
  - title: Places the real product
    text: Uses your product photo exactly, sets its size against the character once, and opens it only the way your use steps say.
  - title: Plans clay movement
    text: Pose to pose with short holds, one change of state per clip, the camera still or making one slow move.
  - title: Stills before clips
    text: You approve the character and the opening frame before any clip is made.
  - title: Checks each clip
    text: Clay stays clay, the character matches clip one, the change happened in view, and the label wasn't altered.

output_shape: |
  THE IDEA
  <the changing object, its three states, and what acts on it>

  FIXED LINES (paste unchanged into every prompt)
  Character: <one sentence: size, build, clay colour, hair, two clothing colours, one mark>
  Material: <what is clay, what handmade material, tool marks>
  Light: <soft studio light, focus, scale>
  Product: <copy the attached photo exactly; its size against the character>

  PALETTES
  Problem: <greyed, cool, one dull colour>
  Changed: <your brand colours>

  STILL 1, CHARACTER
  <prompt>
  STILL 2, OPENING FRAME (attach: <picture> = <its job>)
  <prompt>

  CLIP 1 (<length>, from <still>)
  <time> <one small move> Narration: "<line>"
  ... End frame: <...>
  CLIP 2, CLIP 3 ...

  CHECK EACH CLIP
  - <five checks for this character, this object, this product>

  MISSING: <what's needed and what the prompts do until you have it>

example:
  business: sprout
  input: |
    [the skill]

    Script (30 s, from "Get a claymation ad script that sells"):
    1 "You bought the powder. And the shaker."
    2 "Then it sat there. Half full."
    3 "Chalky glass. Another thing to wash."
    4 "So, one small pack instead."
    5 "Rip. Tip. Enjoy."
    6 "No water. No mixing. No shaker."
    7 "Sixty-plus ingredients, 21 vitamins and minerals, 6 grams of fiber."
    8 "First order, $29.99 with text sign-up. Money back in 30 days."
    9 "For anyone with a half-used tub of powder."
    Changing object: grey clay tower of tub, scoop and shaker.

    Product: Sprout pouch, photo attached (glossy deep green stand-up
    pouch, big yellow wordmark, yellow bear face top right, "28 Daily
    Packs" at the bottom). Gummies: small opaque deep-green bears.
    Use: tear one daily pack straight across the top, tip into palm.
    Never tear the big pouch; it opens only at its resealable top.
    Colours: forest green #00582D, cream #FFF7DF, sunflower #FFCC2E.
    Clips: 10 seconds, 9:16.
  output: |
    THE IDEA
    A grey clay tower on the counter (powder tub, scoop, shaker).
    Worst: it teeters. Changing: pieces sink flat one by one.
    Changed: a clear counter. What acts on it: the pack being torn open.

    FIXED LINES (paste unchanged into every prompt)
    Character: a clay adult man about five heads tall, medium build,
      light brown clay skin, short dark hair as one smooth shape, rust
      jumper, grey trousers, black bead eyes, a pressed-line mouth,
      a small clay watch on his left wrist.
    Material: everything except the pouch, pack and gummies is matte
      modelling clay with slight tool marks and no fingerprints; the
      dust ring and the glass of water are clay shapes; plain card
      backdrop.
    Light: soft even studio light, bright and sunny, shallow focus,
      small-model scale.
    Product: the Sprout pouch exactly as in the attached photo, no
      letter redrawn; standing on the counter it reaches his shoulder.

    PALETTES
    Problem: grey, cool blue-grey, one dull khaki (the tub).
    Changed: forest green #00582D, cream #FFF7DF, sunflower #FFCC2E.
    Until line 6 the pouch is the only green thing on the set. In 9:16
    the tower sits upper third behind him; the pouch beside his hand.

    STILL 1, CHARACTER
    [Character line], standing, front on, plain grey card backdrop.
    [Material line]. [Light line].

    STILL 2, OPENING FRAME (attach: character still = who he is;
    pouch photo = the product, copy exactly)
    9:16. A small clay kitchen set: counter, one cupboard, a window
    shape. [Character line], one hand on the counter, head tilted at
    a teetering grey clay tower of a tub, a scoop and a shaker.
    [Product line], front to camera. [Material line]. [Light line].
    Problem palette only.

    CLIP 1 (10 s, from Still 2)
    0-3 s  fixed camera at his eye level. The tower rocks in two small
           steps. Narration: "You bought the powder. And the shaker."
    3-6 s  a clay dust ring forms round the tub. "Then it sat there.
           Half full."
    6-10 s he lifts the shaker, arm out, nose wrinkling in one step.
           "Chalky glass. Another thing to wash." End frame: shaker
           held out, tower leaning.

    CLIP 2 (10 s, from Clip 1 end frame)
    0-3 s  he sets the shaker down and takes one daily pack from beside
           the pouch, touching the pouch's side, never its front. "So,
           one small pack instead."
    3-6 s  he tears the pack straight across the top; deep-green bears
           tip into his palm. "Rip. Tip. Enjoy."
    6-10 s the tower's pieces sink flat one by one, the counter taking
           on cream and green. "No water. No mixing. No shaker."

    (cut for length: the full run also had Clip 3, ending on the held
    pose with the offer added later, and the sound line: one off-screen
    narrator, a soft paper rip, a clay tap per piece, no music)

    CHECK EACH CLIP
    - Clay stays matte; the gummies and pouch stay photographic
    - Watch, jumper colour and hair shape match Clip 1
    - The tower sank by clay moves in view, never vanished
    - The pack tore straight across its top, never a side or corner
    - Pouch printing unchanged; no words on the set

    MISSING: a photo of a single daily pack (colour, printing). Until
    supplied, Clip 2's hand shots can't match the real pack.

tweaks:
  - what: The fixed lines
    how: Change the character line once (age, clothes, one mark like a scarf) and every prompt updates with it. Never write "same as before"; paste the line.
  - what: The clip length
    how: Give your tool's limits, for example "5 second clips". It spreads the script over more clips with one change of state each.
  - what: Working by hand
    how: Say "one still per scene". You get 6 to 10 scene stills of 5 to 8 seconds to join with hard cuts, instead of generated clips.
  - what: Never-show list
    how: Paste the things your brand never shows (a body changing, a pack opened the wrong way). It writes them out of every prompt and describes what to show instead.

judge:
  - The four fixed lines appear word for word in every still and clip prompt.
  - Each clip has exactly one change of state, and the narration over it is short.
  - The product line says to copy the photo and never to redraw the label.
  - Nothing in the clips falls, crashes or explodes.
  - The checklist matches this ad (this changing object, this character), not generic advice.

test:
  - Run it on a script where you already know the changing object and its three states. The idea line at the top should name the same object and states. If it picks a different one, your script doesn't make the change clear enough.
  - Make the character still and the opening frame before any clip. If the clay looks like shiny plastic or the label has new letters, fix the four fixed lines now, while it's cheap.
  - Run it twice on the same script and compare the four fixed lines. The character, material and product lines should say the same thing both times.
  - Make only the first clip, watch it with the sound off, and ask someone what changed. If they can't say, the change happened off screen or too fast.

improve:
  - Write your product line into step 5 of the skill file once (exact shape, colours, printing and size against a hand), so every run starts with it.
  - Add your brand's never-show rules to the Avoid list, for example that the daily pack is only ever torn straight across the top.
  - If you always make one shape and length, set it in step 8 (for example 9:16, about 10 seconds a clip) instead of saying it each time.
  - Save the approved character still and the four fixed lines to your brand file, so the next clay ad keeps the same character.
  - Pair it with the skill that writes the claymation script first, so the changing object and its three states are settled before any prompt.

terms:
  - term: Still
    meaning: A single image made first, so you can approve the look before paying for video.
  - term: Clip prompt
    meaning: The written instructions you give an AI video tool for one short piece of video.
  - term: 9:16
    meaning: A tall video shape, the one phones use for Reels, Stories and TikTok.
