new_slug: turn-claymation-script-into-ready-video-shots
name: "Turn your clay ad script into video clips"
summary: "Give it your clay script and product photo. You get image and clip prompts that keep every shot matching."
job: make-video-ads

headline: "Turn your clay ad script into video clips"
subhead: Give it a narrated claymation script and a photo of your product. It fixes one clay character, one tabletop set with one finish, and your product as a labelled clay prop or its real photo, then writes stills to approve and a short clip prompt for every shot.

explain: |
  AI video tools drift. The character's hair changes between clips, clay turns into shiny plastic, your label gets redrawn with wrong letters, and the one change the ad depends on happens off screen. You end up paying for the same clip again and again.

  This skill plans the shoot the way a stop-motion crew would. It writes fixed lines for the character, the set, the light and the lens, with one clay finish and named stand-ins (water as clear gel, steam as cotton wool), and pastes them unchanged into every prompt. Your product is either a clay prop wrapped in its printed label or the real photo lit to match the set, whichever the script chose. You approve reference stills first. Each clip is a few seconds long with one thing moving, stepped clay timing and one camera instruction, and the one clay morph, if there is one, comes from a first and last frame.

when:
  - You have a claymation script and need prompts for an AI image and video tool.
  - Your earlier clips kept changing the character, the set or the product label.
  - You want the change in the ad (a knot loosening, a tower squashing flat) to happen on camera, at clay speed.

you_give:
  - The script's shot table, with the changing object's three states, the character, the set and the product choice
  - A photo of your product's front, every label line, and how it's used
  - Your colours, approved claims and what never to show (optional)
  - The clip lengths your video tool accepts (optional, 3 to 6 seconds by default)
you_get:
  - Fixed lines for character, set, light, lens, palettes and product
  - Reference still prompts for the character, the set and the product
  - A still and a clip prompt for every shot, with one mover each
  - The morph's frame pair (if used), edit notes and a check for each clip

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the script from the claymation script skill, then attach your product photo and list its label lines.
  - Say which video tool you use and the clip lengths it allows.
  - Make the reference stills first. Only move on when you like them.
  - Make each shot's still from the references, then its clip, and check each clip before joining them.

how_it_works:
  - title: Writes fixed lines
    text: Character, set, light, lens and palettes, pasted word for word into every prompt. One clay finish for the whole ad, with stand-ins named.
  - title: Sets the product
    text: A clay prop wrapped in your printed label, or your real photo lit by the set's light. Never clay letters, and it opens only your way.
  - title: References first
    text: The character in two views, the empty set with the object in its before state, and the product. You approve them before any clip.
  - title: One mover per shot
    text: Only the character or the changing object moves. Everything else holds still or blinks.
  - title: Clay timing
    text: Every clip moves in small stepped poses, about 12 a second, with a smooth camera and the action in counted beats.
  - title: One morph at most
    text: If the script swaps the old thing for the new state, it gets a first and last frame and one change written as clay squashing and reshaping.
  - title: Checks each clip
    text: Clay stays matte, the character matches, the change happens in view, one thing moves, and the label is unchanged.

output_shape: |
  FIXED LINES (paste unchanged into every prompt)
  CHARACTER: <the script's sentence, clay hands>
  SET: <tabletop set, one finish, stand-ins, no words>
  LIGHT: <key light side, fill>
  LENS: <shallow focus, eye-level camera on a stand>
  PALETTES: Before <..>  After <..>
  PRODUCT: <clay prop with label lines in quotes, or the photo lit to match>; <size against the character>

  REFERENCES
  1 <character, two views>  2 <empty set, before state>  3 <product>

  SHOT <n> (<state>, mover: <..>)
  Still: <camera, who or what, pose or state, place> + fixed lines
  Clip (<seconds>): attach <image = job>. Motion line. Beats: <..>
  Camera: <..>. Hold line. Sound: <..>

  MORPH  <first frame, last frame, the one clay change> or none
  EDIT NOTES  <order, offer text>
  MISSING: <what's needed>

example:
  business: sprout
  input: |
    [the skill]

    Script (30 s, from the claymation script skill):
    Object: a leaning grey clay tower of powder tub, scoop and shaker.
    Before: it teeters. Changing: it squashes down into the counter.
    After: a clear counter, the pouch on it.
    Character: a clay man, 6 heads tall, slim, warm beige clay, short
    dark hair as one shape, rust jumper, grey trousers, bead eyes, a
    small clay watch.
    Set: kitchen counter, shelf, sink, window. Handled finish. Water in
    the sink as clear gel. Before: blue-grey with one dull khaki.
    After: forest green, cream and sunflower.
    Product: the real pouch photo, lit to match the set.
    Shots: 1 whole set, tower teeters (mover: tower) | 2 the tub very
    close (tower leans) | 3 him close, nose wrinkled (character) |
    4 hands take one daily pack (character) | 5 he tears the pack
    straight across the top, bears tip into his palm (hands) | 6 MORPH:
    the tower squashes into the counter (tower) | 7 the clear counter,
    pouch front on (colour settles) | 8 him beside the pouch (character)
    | 9 held pose (none)
    Pouch photo attached: glossy deep green, big yellow wordmark,
    "28 Daily Packs". Tool: 4 to 6 second clips, 9:16, 3 references,
    first and last frame.
  output: |
    FIXED LINES (paste unchanged into every prompt)
    CHARACTER: a clay man about 6 heads tall, slim, warm beige clay
      skin, short dark hair as one smooth shape, rust jumper, grey
      trousers, black bead eyes, a small clay watch on his left wrist;
      chunky clay hands with rounded fingertips.
    SET: a handmade stop-motion tabletop kitchen (counter, one shelf,
      a sink, a window shape), matte modelling clay with some
      thumbprints, photographed with a macro lens. The water in the
      sink is clear gel. No words anywhere on the set.
    LIGHT: one soft key light from the left, a gentle fill from the
      right, bright and sunny.
    LENS: shallow focus, background softly blurred, camera at his eye
      level on a stand. The edges of the set never show.
    PALETTES: Before: blue-grey, cool grey, one dull khaki (the tub).
      After: forest green #00582D, cream #FFF7DF, sunflower #FFCC2E.
      Until shot 6 the pouch is the only green thing.
    PRODUCT: the Sprout pouch exactly as in the attached photo, lit by
      the set's key light from the left, no letter redrawn; standing
      on the counter it reaches his shoulder.

    REFERENCES
    1 [CHARACTER] front and three-quarter, plain grey card backdrop.
    2 [SET] empty but for the grey clay tower of tub, scoop and shaker,
      teetering. Before palette.
    3 The pouch photo, as supplied.

    SHOT 1 (before, mover: the tower)
    Still: 9:16, wide on the whole set. The man (image 1) stands at the
    counter, one hand on it, head tilted up at the teetering tower
    (image 2); the pouch (image 3) beside his hand. [fixed lines]
    Clip (4 s): attach image 1 = the man, image 2 = the set, image 3 =
    the pouch. Stop-motion timing: the clay moves in small stepped
    poses, about 12 new poses a second, with a faint shimmer between
    poses. The camera moves smoothly. Beat 1 the tower rocks left;
    beat 2 it rocks back; beat 3 it holds, leaning. Camera: locked off.
    Same character, set and product as the references. Every surface
    stays clay or its stand-in. His mouth stays still. The label stays
    as printed. Sound: soft room tone, a faint clay creak.

    SHOT 5 (mover: his hands)
    Clip (4 s): beat 1 his hands hold one daily pack; beat 2 they tear
    it straight across the top; beat 3 deep-green bears tip into his
    palm. Camera: locked off, close on the hands.

    SHOT 6 (changing, mover: the tower) MORPH
    First frame: the tower standing on the counter, before palette.
    Last frame: a clear counter, cream and green, the pouch front on.
    Clip (6 s): the grey tower squashes down into the counter in a few
    stepped poses, cream and green spreading out from where it stood.
    Camera: locked off. Sound: a soft clay squash.

    (Shots 2 to 4 and 7 to 9 follow the same pattern: one still, one
    clip, one mover. Shot 9 is a held pose, no mover.)

    EDIT NOTES
    Cut the nine clips over the narration in order, 30 seconds. On
    screen over shot 8: "$29.99 first order with text sign-up. Renews
    at $49.99 every 4 weeks." Never in a prompt.
    MISSING: a photo of a single daily pack (colour, printing). Until
    it's supplied, shot 5 can't match the real pack.

tweaks:
  - what: The product choice
    how: Say "clay prop" to sculpt the pack in clay wrapped in its printed label, or "real photo" to use your photo lit by the set. The script usually decides; this changes only the product line.
  - what: The finish
    how: Crisp (fine tool lines) suits premium and food, handled (some thumbprints) most everyday goods, rough (big thumbprints) silly brands. One finish for the whole ad.
  - what: The clip length
    how: Give your tool's limits, for example "5 second clips". Each shot stays one action, so longer clips just hold the end pose longer.
  - what: Never-show list
    how: Paste the things your brand never shows (a body changing, a pack opened the wrong way). It writes them out of every prompt and describes what to show instead.

judge:
  - The fixed lines appear word for word in every still and clip prompt.
  - Each clip has one mover and one camera instruction.
  - There is at most one morph, at the swap, made from a first and last frame.
  - The product follows its one product line in every shot, with the label exactly as printed.
  - Nothing falls, crashes or explodes, and the change happens in view.

test:
  - Run it on a script where you already know the changing object and its three states. The before still should show the same object in the same state.
  - Make the references before any clip. If the clay looks like shiny plastic or the label has new letters, fix the fixed lines now, while it's cheap.
  - Run it twice on the same script and compare the fixed lines. They should say the same thing both times.
  - Make only the morph clip and watch it muted. If someone can't say what changed, the change was too fast or happened off screen.

improve:
  - Write your product line into step 2 of the skill file once (shape, colours, label lines, size against a hand), so every run starts with it.
  - Add your brand's never-show rules to the Avoid list, for example that the daily pack is only ever torn straight across the top.
  - Save the approved references and fixed lines to your brand file, so the next clay ad keeps the same character and set.
  - Pair it with the skill that writes the claymation script first, so the changing object and its three states are settled before any prompt.

