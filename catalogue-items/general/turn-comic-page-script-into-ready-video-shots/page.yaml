new_slug: turn-comic-page-script-into-ready-video-shots
name: "Turn your comic ad script into video clips"
summary: "Give it your comic script and product photo. You get a full-screen panel-by-panel video plan, with prompts and clean lettering."
job: make-video-ads

headline: "Turn your comic ad script into video clips"
subhead: Give it a comic ad script and a photo of your product. Each panel becomes one full-screen shot, and each cut gets a named comic transition. You get a panel list, panel stills and one clip per panel, ending on a photo panel of your real product.

explain: |
  Comics are built for phones. One panel at a time, read top to bottom, with the story jumping forward in the gap between panels. AI video tools spoil the look in familiar ways. They draw letters as scribble, puff flat ink into 3D, change the hero between shots, and redraw your label.

  This skill turns each panel into one vertical shot and treats the cut as the gap between comic panels. Every cut is named for what it does (the next step of an action, a jump to a new subject, a jump in time, or one moment slowed down for the reveal). The hero is drawn simple, so viewers see themselves in them, and the product is drawn exactly from its photo with no letters. Each panel moves in one small way, by splitting into flat layers, moving one part or panning down. Captions go in during editing, and the last panel is your real product photo, framed like a panel.

when:
  - You have a comic ad script and need prompts for an AI image and video tool.
  - Earlier attempts gave you garbled lettering or a product with a made-up label.
  - You want a short, handmade-looking problem-and-fix story for vertical video.

you_give:
  - The comic script, with its panels, captions and narration
  - A photo of your product, how it's used, and the one claim
  - Your colours and lettering typeface (optional)
  - The clip lengths your video tool accepts (optional)
you_get:
  - A panel list with a named transition into every panel
  - Fixed lines for the ink, the hero, the product and the palette
  - A still prompt and a clip prompt for each panel
  - Edit notes for captions, narration, sound and the final photo panel

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your comic script underneath, then attach your product photo.
  - Add how the product is used and the one claim the comic acts out.
  - Agree the panel list before asking for prompts.
  - Make the hero still and the panel stills, compare them, then make one clip per panel.
  - Add captions, narration and the photo panel in your editor last.

how_it_works:
  - title: Checks it fits
    text: Suits a short problem story or a drawable how-it-works. It says so if your product is judged by how it looks in use.
  - title: Lists the panels
    text: 5 to 8 panels, each with a named transition, and the reveal panel held longest.
  - title: Keeps the hero simple
    text: A few clear features in the same words every time, so viewers see themselves in the hero.
  - title: Draws the product exact
    text: Shape and colours from your photo, the brightest thing in its panels, with no drawn letters.
  - title: Moves one thing per panel
    text: Flat layers drifting apart, one moving part, or a pan down a tall panel. The ink stays flat.
  - title: Letters in editing
    text: Captions, narration and sound effects go in afterwards, and the last panel is your real product photo.

output_shape: |
  PANEL LIST
  Panel | transition in | what's drawn | motion | caption (edit) | narration | s
  1 | opens | <who, where> | <layers / one part / pan> | <6 words or fewer> | "<10 words or fewer>" | <n>
  ...
  <last> | subject to subject | PHOTO PANEL (set in editing) | none | offer | none | <n>

  FIXED LINES
  Ink:     <line, fills, shadow, dots, palette>
  Hero:    <simple features, same words every time>
  Product: <shape and colours from the photo, no letters>

  PANEL <n> STILL  <prompt>  Attach: <photo> = <its job>
  PANEL <n> CLIP   <length>, from still <n>: <one motion>. No words appear.

  EDIT NOTES
  <captions, narration, sound, photo panel and offer>
  MISSING: <...>

example:
  business: sprout
  input: |
    [the skill]

    Script (30 s, from "Get a comic page ad script that sells",
    written for a page on a desk):
    Claim: "60+ ingredients, 21 vitamins & minerals, and 6g fiber" in
    1 pack.
    P1 "Every morning, the same chalky glass." CHOKING ON POWDER AGAIN
    P2 "Then the shaker sits in the sink." THE SHAKER WINS AGAIN
    P3 "So the whole lot went in one pack." 60+ INGREDIENTS / 6G FIBER
    P4 "One small handful a day." RIP. TIP. ENJOY.
    P5 "Same kitchen. Nothing to rinse." NO SHAKER TO WASH
    P6 (no narration) out the door
    Close: real pouch, offer text.

    Product: Sprout pouch, photo attached (glossy deep green, big yellow
    wordmark, yellow bear face top right, "28 Daily Packs").
    Use: tear one daily pack straight across the top, tip into palm.
    Brand photos: bright, sunny, never clinical.
  output: |
    Desk, hand and page turns dropped; the six panels and their
    words kept.

    PANEL LIST
    1 | opens | the hero at the counter, glass of green sludge
        raised, face screwed up | glass layer drifts forward | CHOKING
        ON POWDER AGAIN | "Every morning, the same chalky glass." | 4
    2 | action to action | same angle, the shaker dropped in the sink
        | one drip from the tap | THE SHAKER WINS AGAIN | "Then the
        shaker sits in the sink." | 4
    3 | subject to subject | a clean cutaway of one daily pack, small
        green bears inside | pan down the tall panel | 60+ INGREDIENTS /
        6G FIBER | "So the whole lot went in one pack." | 5
    4 | moment to moment | close on her hands tearing the pack across
        the top, bears tipping into her palm | the tear, slowed | RIP.
        TIP. ENJOY. | "One small handful a day." | 6
    5 | action to action | the counter clear, she eats from her palm
        | three layers drift apart | NO SHAKER TO WASH | "Same kitchen.
        Nothing to rinse." | 4
    6 | scene to scene | outside, she walks off down a sunny street,
        keys swinging | keys swing | none | none | 3
    7 | subject to subject | PHOTO PANEL: the real pouch photo in the
        same border, set in editing | none | offer | none | 4

    FIXED LINES
    Ink:     bold even black line, flat fills, one shadow tone, light
             halftone dots in shadows; palette black, cream, sky blue,
             warm grey, and the product's deep green.
    Hero:    an adult woman, round simple face, dark ponytail, navy
             blazer over a white top, small gold hoop earrings.
    Product: the daily pack as a small flat deep-green sachet with a
             yellow edge, bears deep green; no letters.

    PANEL 4 STILL  9:16. A thin black panel border with a cream gutter
      at the screen edges. Inside: close on two hands tearing a
      small flat deep-green sachet straight across its top, small
      deep-green gummy bears tipping into the left palm. [Ink line].
      The sachet is the most saturated thing in the frame. No words.
      Attach: pouch front = the green and yellow colours only.

    PANEL 4 CLIP   6 s, from panel 4 still: the tear runs slowly
      across the top, then the bears tip out. Ink stays flat 2D.
      No words appear.

    (cut for length: the full run also had the hero still and
    stills and clips for panels 1 to 3, 5 and 6)

    EDIT NOTES
    - Captions in Work Sans bold capitals, one box per panel, top left.
    - Narration over panels 1 to 5; panels 6 and 7 silent.
    - Sound: a glass clink, a drip, one tear, light music from panel 5.
    - Photo panel text: "$29.99 first order with text sign-up. Renews
      at $49.99 every 4 weeks."
    MISSING: a photo of a single daily pack, so the drawn sachet in
    panels 3 and 4 matches the real one.

tweaks:
  - what: Number of panels
    how: Five panels for a quick 20-second cut, up to eight for a fuller story. The reveal panel always stays longest.
  - what: Transitions
    how: Ask for a slower, moodier open and it adds one "details of a place" transition at the start. It never stacks two.
  - what: Motion
    how: Say "layers only" for the calmest look, or allow one moving part per panel for more life.
  - what: The palette
    how: Give your brand colours. The ink keeps black plus 3 or 4 flat colours, and your product stays the brightest.

judge:
  - Every panel has a named transition, and the reveal panel is the longest.
  - The hero line is the same, word for word, in every prompt.
  - No prompt asks the tool to draw words or numbers.
  - Each clip has one kind of motion, and the ink stays flat.
  - The last panel is your real product photo, set in editing.

test:
  - Read the transition column. Most should be "action to action" or "subject to subject", with one slowed reveal.
  - Make the hero still and three panel stills. The hero should look the same in each.
  - Search every prompt for words the tool would have to write. There should be none.
  - Make one clip. It should have one motion and flat ink, with no drift toward 3D.

improve:
  - Write your ink line and palette into step 4 of the skill file, so every comic ad in a series looks the same.
  - Add your product's never-show rules to the Avoid list.
  - Save the approved hero line and hero still in your brand file for the next ad.
  - Pair it with the skill that writes the comic script, so the claim and panels are settled first.

