new_slug: turn-cutout-explainer-script-into-ready-video-shots
name: "Turn your paper-cutout script into video clips"
summary: "Give it your script and product photos. You get piece, frame and clip prompts, plus the words to add when editing."
job: make-video-ads

headline: "Turn your paper-cutout script into video clips"
subhead: Give it a one-point cutout script and your product photos. It lists every paper piece, makes the pieces before the scenes, and describes each frame as a stack of layers. Each move is timed to the word it proves, and you get a list of every word and figure to add in editing.

explain: |
  A paper-cutout explainer looks handmade and clear: your product cut out, an arrow, a ring round the part that matters. Ask an AI video tool for it and you often get the opposite. Flat digital graphics, misspelled labels, paper bending like rubber, and your product redrawn a little differently in every scene.

  This skill works like a cutout animator. It starts with a parts list, then makes each piece on its own, so your product cutout comes from its photo once and stays the same everywhere. Each frame is described as a stack of paper layers, back to front. Each move is rigged with a start and an end (a slide, a swap, a part swinging on its pin, a flap lifting, pieces landing one by one) and timed to land on its key word. The tool never writes a letter. Words, numbers and charts go in during editing, checked against your real figures.

when:
  - You have a one-point explainer script and need prompts for an AI image and video tool.
  - Earlier attempts came out as flat digital graphics or with garbled text.
  - Your product looked slightly different in every scene.

you_give:
  - The script, ideally with a proof picture, key word and move for each line
  - Your product photos and how the product works
  - Any figures you want shown, with their sources
  - Your colours, typefaces and approved claims (optional)
you_get:
  - A parts list marking what you have, what to make and what's missing
  - Prompts for each paper piece and the empty ground
  - Still prompts as layer stacks, and clip prompts with moves timed to the voice-over
  - An edit list of every word and number, with its source

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your script underneath, then attach your product photos.
  - Add any figures you want charted, each with where it comes from.
  - Make the pieces first, then the stills, and approve them.
  - Make each clip from its approved still, with the narration timed.
  - Add the words, numbers and charts in your editor, using the edit list.

how_it_works:
  - title: Lists every piece
    text: Product cutouts, other photos, paper shapes and the ground, each marked have, make or missing.
  - title: Makes pieces before scenes
    text: Each piece is its own image, so your product comes from its photo once and never gets redrawn.
  - title: Stacks the layers
    text: Each frame is written back to front, with a place and size for every piece.
  - title: Rigs every move
    text: Slide, swap, pivot on a pin, lift a flap or build up, each with a start and an end, and paper that stays flat and stiff.
  - title: Times moves to words
    text: Each move lands on the word it proves, and every clip ends with a short still hold.
  - title: Leaves words for editing
    text: Every word and figure is listed for your editor and checked against your sources.

output_shape: |
  PARTS LIST
  <piece> | <from which photo, or made> | have / make / MISSING

  PIECE <n>  <prompt for one piece on a plain background>
  GROUND     <empty paper, filling the frame, flat from above>

  STILL <line n>  Layers, back to front:
    1 <ground>  2 <piece, place, size>  3 <product, place, size>
    4 <signal, from where to where>
    Attach: <piece image> = <its job>

  CLIP <n> (<length>, from still <n>)
  <s>-<s>  <move: start position > end position>  (lands on "<key word>")
  Paper rules: <flat, stiff, one plane, pins, shadows, no morphing>
  End: hold, all pieces at rest

  EDIT LIST
  <every on-screen word and number, with source>
  MISSING: <...>

example:
  business: sprout
  input: |
    [the skill]

    Script (20 s, from "Get a cutout explainer ad script that sells"):
    1 "A greens powder takes four steps." key: four. Row of tub,
      scoop, glass, shaker. Build-up.
    2 "Then one more: rinsing the shaker." key: rinsing. Sink slides
      in under the shaker.
    3 "A Sprout pack takes one tear." key: one. Swap: the row out, a
      daily pack in.
    4 "Inside: sixty-plus ingredients, twenty-one vitamins and
      minerals, and six grams of fiber." key: Inside. Flap.
    5 "One tear a day." Pouch large and still, offer on screen.
    Paper kit: warm cream card, scissor-cut edges; signal sunflower
    #FFCC2E strip with one pointed end; old way in black and white.
    Photos: pouch front, gummies in a hand. No single daily pack
    photo yet. Old-way photos: to be shot.
    Type: Work Sans bold and medium. Clips: 8 seconds, 9:16.
  output: |
    PARTS LIST
    Pouch cutout | pouch front photo | have
    Gummies-in-a-hand cutout | hand photo | have
    Daily pack cutout | single pack photo | MISSING
    Tub, scoop, glass, shaker cutouts | to shoot, no brand marks |
      MISSING
    Paper sink | made: grey card, two layers | make
    Signal strips x3 | made: sunflower card, one pointed end | make
    Blank label strips x2 | made: cream card | make
    Ground | made: warm cream card | make

    PIECE (pouch)  The attached pouch photo cut out as a printed
      photo on card, scissor-cut edge with a thin white margin,
      visible card thickness, short soft shadow, plain grey
      background. Shape, colours and printing unchanged.
    GROUND  Warm cream card filling the frame, faint paper grain,
      seen flat from above, even overhead light with no glare.

    STILL 1  Layers, back to front:
      1 ground  2 tub, scoop, glass and shaker cutouts in a row
      across the middle third, each about a fifth of the frame wide
      3 one sunflower strip under the row, point at right
      Attach: the four old-way cutouts = their shapes, in black and
      white. No words appear; strips are blank.

    CLIP 1 (8 s, starts on the empty ground; still 1 is the frame
    it builds to)
    0.0-0.6 s  tub drops in at left, eases to a stop
    0.6-1.2 s  scoop lands beside it
    1.2-1.8 s  glass lands
    1.8-2.4 s  shaker lands  (lands on "four" at 2.2 s)
    2.4-3.0 s  sunflower strip slides in under the row
    3.0-5.2 s  sink piece slides up under the shaker  (lands on
               "rinsing" at 4.6 s)
    5.2-8.0 s  hold, all pieces at rest
    Paper rules: flat stiff card on one plane, shadows travel with
    their pieces, photos stay photos, nothing bends or morphs.

    (cut for length: the full run also had stills 2 to 5 and clips
    2 and 3, which wait for the daily pack photo)

    EDIT LIST
    4 STEPS, +1 RINSE, 1 STEP: counts of the pieces shown
    60+ INGREDIENTS. 6G FIBER: label claim
    $29.99 first order with text sign-up. Renews at $49.99 every 4
      weeks: product page price box and footer
    MISSING: the daily pack photo (lines 3 and 4) and the four
    old-way photos (line 1).

tweaks:
  - what: Clip length
    how: Give your tool's clip length. At 8 seconds you fit two or three lines a clip; at 5 seconds, one or two.
  - what: The paper kit
    how: Name your paper and cut style up front, for example "kraft paper, torn edges". Every piece prompt repeats it.
  - what: Diagrams that move
    how: Mark the pin points on a diagram piece ("the lid hinge"). Its pivot is then rigged around that pin and nowhere else.
  - what: Charts
    how: Paste the figures with sources and say which line they prove. The layer stack sets the bar lengths; the numbers go in during editing.

judge:
  - Every piece in every layer stack appears on the parts list.
  - The product cutout is made once from its photo and reused.
  - No prompt asks the tool to write a letter or a number.
  - Every move has a start, an end and a key word it lands on.
  - Every figure in the edit list has a source.

test:
  - Run it on a script whose figures you know by heart. Every number in the edit list should match your source, and no prompt should ask the tool to write one.
  - Make the product piece and two stills. The product should look identical in both.
  - Play the narration with the clip timings beside it. Each move should land as its key word is said.
  - For each move, say out loud what it shows. If you can't, that line needs a different proof picture.

improve:
  - Write your paper kit into step 2 of the skill file, so every run uses the same paper and cut style.
  - Keep your approved piece images in one folder and list them in "What you need", so step 1 marks them "have".
  - Add your figures with their sources to your brand file. The edit list checks every number against them.
  - Pair it with the skill that writes the cutout explainer script, so each line already has its proof picture and key word.

terms:
  - term: Parts list
    meaning: Every paper piece and photo the ad needs, listed before anything is made.
  - term: Layer stack
    meaning: A frame described as paper layers from back to front, with a place for each piece.
  - term: Pin
    meaning: The point a jointed paper part turns around, like a split pin in a card puppet.
  - term: Cutout
    meaning: A photo of your product with the background removed.
