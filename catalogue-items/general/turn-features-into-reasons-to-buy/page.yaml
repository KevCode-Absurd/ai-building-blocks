new_slug: turn-features-into-reasons-to-buy
name: Turn features into reasons to buy
summary: Your feature list turned into short points, each one benefit with a reason to believe it.
job: write-ad-copy

headline: Selling points that each give one benefit and a real reason to believe it
subhead: Paste your feature and fact list, a note on your buyer, and where the points will go. It turns each feature into what the buyer gets, aims each point at a different want or doubt, and lists which claims still need evidence.

explain: |
  Most feature lists read like a spec sheet. "21 vitamins and minerals. 6 g fiber. Vegan." The buyer has to work out what each one means for them, and most won't. The opposite mistake is worse: turning "contains fiber" into "fixes your digestion" without any proof.

  This skill climbs a chain for each feature: what it is, how it works, what the buyer gets. It checks each step on its own, because an ingredient or a certificate proves only itself. If the next step isn't supported, it keeps the checked fact and lists the gap under "Needs evidence" instead of guessing. Then it mixes kinds of point, such as a plain benefit with its number, an exact detail or a real customer line, aims each at a different want or doubt, and puts the strongest first and the proof or guarantee last.

when:
  - You have a list of features and need the bullet points for a product page, an ad image or a long ad.
  - Your points all sound like a spec sheet, or all make the same argument.
  - You want to know which of your benefit claims you can actually back.

you_give:
  - Your feature and fact list, with where each fact comes from
  - A note on the buyer, how much they know and their main wants and doubts
  - Where the points go (on an image, in a list or in long copy), how many and the length limits
  - What competitors all claim, so you can avoid it (optional)
you_get:
  - A numbered list of points, each tagged with its kind, the want or doubt it targets and the source fact
  - A "Needs evidence" list of benefit steps your facts don't support yet

how_to_use:
  - Copy the skill and paste it into Claude, ChatGPT or Gemini.
  - Paste your facts with their source, such as "label", "lab report" or "product page".
  - Describe the buyer's main wants and doubts. Two to four-star reviews hold the real doubts.
  - Say where the points go and how many, for example "4 bullets under the price, one sentence each".
  - Read the "Needs evidence" list. Each item is a claim to drop or to find proof for.

how_it_works:
  - title: Climbs the chain
    text: For each feature, works from what it is, to how it works, to what the buyer gets, and checks each step separately.
  - title: Makes it specific
    text: Adds the how or why, such as an amount or a moment of use, but only an exact detail your source holds.
  - title: Mixes the kinds
    text: Uses different kinds of point, such as a benefit with its number, a fact and what it changes, a real customer line, and proof last.
  - title: Aims each point
    text: Points each one at a different want or doubt. Two points making the same argument become one.
  - title: Orders the list
    text: Strongest first, proof or guarantee last, and the order shifts with how much the buyer knows.
  - title: Skims it fast
    text: Reads each aloud, then skims the list quickly and rewrites or cuts any point the eye slides past.

output_shape: |
  POINTS
  <n>. <the point, one plain sentence>
     (<kind> | <want or doubt it targets> | <source fact>)
  (strongest first, proof or guarantee last)

  NEEDS EVIDENCE
  MISSING: evidence for <the benefit step your facts don't support>

example:
  business: sprout
  input: |
    [the skill]

    Features and facts:
    - 60+ ingredients, 21 vitamins & minerals, 6 g prebiotic fiber per
      pack, in a small handful of gummies (product page)
    - 1 pack a day, torn across the top, eaten from the pack. No water,
      no mixing, no shaker. (product page)
    - 2025 study, 12 weeks, 120 adults: blood vitamin C +40.1%, folate
      +20.5%. Approved: "Clinically tested for nutrient absorption"
      (science page)
    - 80% of surveyed users take it daily, survey of 3,000+ customers
      (product page)
    - 30-day money-back guarantee, first order only (FAQ)
    - Current bullets also say "Promotes mental clarity + energy" and
      "Supports immunity + stress relief" (no source)
    Buyer: people who quit greens powders. Want: one habit that lasts.
    Doubts: "A gummy can't hold enough to replace my powder." / "They
    are expensive."
    Where: 4 bullets under the product title, one sentence each
    Competitors all say: "science-first", long ingredient lists
  output: |
    POINTS
    1. One pack holds 60+ ingredients, 21 vitamins and minerals, and 6 g
       of prebiotic fiber, in a small handful of gummies.
       (benefit with its number | "can a gummy hold enough?" | product
       page)

    2. You tear the pack open and eat the gummies, so there's nothing to
       mix or wash, and 80% of surveyed users take it daily.
       (the easy way, and what makes it easy | one habit that lasts |
       product page and survey)

    3. It's clinically tested for nutrient absorption, and in a 12-week
       study blood vitamin C went up 40.1% and folate 20.5%.
       (proof | "does a gummy actually work?" | science page)

    4. Your first order comes with a 30-day money-back guarantee.
       (guarantee, with its first-order limit | "they are expensive" |
       FAQ)

    Point 2 is the one a "science-first" powder can't say.

    NEEDS EVIDENCE
    MISSING: evidence for "mental clarity + energy" and "immunity +
    stress relief". The study measured blood vitamin C and folate only,
    so both stay off the list.
    MISSING: evidence that the other vitamins and minerals are absorbed
    as well. Point 3 names only the two the study measured.
    MISSING: a price-per-day fact. "They are expensive" is answered only
    by the guarantee here.

tweaks:
  - what: Where the points go
    how: On an image, three points is a full list and each answers one doubt in a short sentence. In a product page list or long copy, points can carry more detail.
  - what: How much the buyer knows
    how: A ready buyer gets facts and terms. A buyer comparing products gets the difference. A buyer who only knows the problem gets their struggle recognised, without technical words.
  - what: Competitor claims
    how: Paste what every rival says. When everyone lists the same benefits, it adds the point that removes the first objection, or says how yours works.
  - what: Sources
    how: Tag each fact with where it came from. Points are only as trustworthy as their sources, and the tags show you which ones to double-check.

judge:
  - Every number and claim traces to a fact you gave it. Check two.
  - No point is a bare feature. Each says what the buyer gets.
  - No two points make the same argument.
  - Each point is a plain sentence a person would say.
  - Gaps sit in "Needs evidence", not in the points.

test:
  - Run it on a product page whose points you know sell. Compare its list with yours. Points it drops or moves to "Needs evidence" are worth a second look.
  - Run it twice. The same claims should land in "Needs evidence" both times.
  - Pick two points and trace each one to the fact it came from.
  - Skim the list fast and cross out any point your eye slides past. If there is one, it should be the weakest.

improve:
  - Paste your feature list with sources into "What you need" in the skill file, so you don't have to each time.
  - Add what every rival says to "Competitor claims", so step 6 works on every run.
  - If your points always go on an image, set the count and length in "Where the points go" (for example "three points, under 8 words each").
  - When you find proof for an item in "Needs evidence", add it to your brand file.
  - Pair it with "Get headlines a stranger understands at a glance" when the points sit on an ad image, and "Get an ad where every line sells" for the copy around the list.

terms:
  - term: Chain
    meaning: The steps from a feature (what it is) to how it works to what the buyer gets. Each step needs its own support.
  - term: Needs evidence
    meaning: A benefit your facts don't prove yet. Keep it off the page until you have proof.
