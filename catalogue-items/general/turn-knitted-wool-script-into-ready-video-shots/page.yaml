new_slug: turn-knitted-wool-script-into-ready-video-shots
name: "Turn your knitted script into video clips"
summary: "Give it your script and product photo. You get image and clip prompts that keep every frame a handmade world of wool."
job: make-video-ads

headline: "Turn your knitted script into video clips"
subhead: Give it a narrated knitted-wool script and your product photo. It writes one material sentence and a doll card for every image, reference stills to approve first, and clip prompts where yarn moves only as yarn can.

explain: |
  A knitted-wool ad goes wrong in small ways that add up. A real person turns up standing in a wool room. A kettle comes out in steel because nobody said it was crocheted. A face in close-up looks odd, stitches smear as the clip plays, and the label on your pack is misspelled.

  This skill writes prompts the way the tools' own guides advise. One material sentence gives every kind of surface a real fabric (stockinette walls, a rib-knit counter, felted steam) and goes word for word into every image prompt. The doll is written once as a card and pasted whole wherever she appears. You make the doll, the product and each room as reference stills first. Each clip prompt then says only what moves: stop-motion on twos, one camera move, and the yarn technique written as yarn really behaves, like strands winding into one thicker yarn.

when:
  - You have a knitted-wool script and need prompts for AI image and video tools.
  - Earlier tries drifted into real people, real materials or misspelled labels.
  - Your turn is a yarn moment, like strands joining or a pack knitting into view, and you want it to read clearly.

you_give:
  - The script with narration and picture notes (and its show plan, doll card and room list, if you have them)
  - A clean product photo and its biggest label lines with their colors
  - How your product is used
  - Your tools and clip lengths, and whether your video tool makes sound (optional)
you_get:
  - The turn, with where the yarn change starts and ends
  - A material sentence, motion sentence, doll card, room list and product line
  - Reference stills and start frames, in making order
  - Clip prompts, a sound line and edit notes, plus fixes for common misses

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your script underneath, then your label lines, and attach the product photo.
  - Make the doll, the product and each room as their own stills first, and approve them.
  - Make each start frame with the approved pictures attached.
  - Make one clip per start frame, then add the narration and offer in editing.

how_it_works:
  - title: Finds the turn
    text: Reads the show job and yarn technique from your script, and where the change starts and ends.
  - title: Writes one material sentence
    text: A fabric for every kind of surface, one yarn thickness, real colors, side light and shallow focus, pasted unchanged everywhere.
  - title: Makes references first
    text: The doll from her card, the crocheted product with short label lines, and each empty room.
  - title: Writes start frames
    text: Who and what, the feeling in the pose, the setting, the material sentence, camera and label lines.
  - title: Writes clips that move like yarn
    text: Stop-motion on twos, one camera move, and the technique written as yarn behaves.
  - title: Adds sound, edit notes and fixes
    text: Ambient sound only if your tool makes it, the real label laid over if needed, and what to change when a result misses.

output_shape: |
  TURN  <show job>, <technique>. Starts <where>, ends <where>.
  Yarn scene change: <one, or none>

  MATERIAL SENTENCE  <pasted unchanged into every image prompt>
  MOTION SENTENCE  <opens every clip prompt>
  DOLL CARD  <pasted whole whenever she's in frame>
  ROOMS  <every object, material and color>
  PRODUCT  <crocheted pack, label lines "<exact words>">

  REFERENCES (make and approve first)
  R<n> <what>. Prompt: <...> Attach: <photo> = <job>

  START FRAMES
  F<n> (lines <n>) <who, doing what, pose>. <setting>. [MATERIAL].
  Camera: <...>. Label: "<line>"  Attach: R<n> = <job>

  CLIP <n> (<seconds>, from F<n>)
  [MOTION] Camera: <one move>  0 to <n> s: <...>  <n> to <n> s: <...>
  Fixed: <...>  End: <...>  Narration: "<line>"

  SOUND  <ambient line, or none>
  EDIT NOTES  <label overlay, text, narration>
  MISSING: <facts it needed>

example:
  business: sprout
  input: |
    [the skill]

    Script (from the knitted wool script skill), about 30 s.
    Show plan: join, plying. Six leaf-green strands twist into one
    yarn that runs into a crocheted daily pack.
    Doll card: a crocheted woman about 40, medium build, shoulder-
    length dark brown yarn hair in loose waves, a mustard stockinette
    jumper, grey rib-knit trousers, embroidered eyes and brows.
    1 "Fiber powder. Gritty, every single morning."  She stirs a glass.
    2 "Then the probiotic pills she kept forgetting."
    3 "Here's six grams of fiber, the easy way."  Six strands, close.
    4 "Six strands. One pack."  THE TURN: plying.
    5 "Rip. Tip. Enjoy."  Hands tear the pack across the top.
    6 "Sprout supports digestion and gut health."  Pouch, dolly in.
    7-8 Offer and close, held on the pouch.
    Product photo attached. Label: "Sprout" in yellow, a yellow bear
    face top right, "28 Daily Packs" at the bottom. Gummies: small
    deep-green bears. Tear only straight across the top.
    Video tool: 8-second clips, no sound.
  output: |
    TURN  Join, plying. Starts with six loose strands on the counter
    at line 3; they wind into one yarn that runs into the daily pack at
    line 4; ends with the yarn and pack at rest.
    Yarn scene change: none. Every change of setting is a cut.

    MATERIAL SENTENCE
    A small handmade world made entirely of wool: cream stockinette
    walls, an oak-brown rib-knit counter, crocheted objects stuffed
    firm, felted wool for steam, one chunky yarn throughout, colors
    kept to real-world tones (cream, oak brown, white, teal, pale blue,
    leaf green, deep green, sunflower yellow), soft window light from
    the left, shallow focus so the set reads small.

    MOTION SENTENCE
    Wool stop-motion animated on twos: each pose holds for two frames,
    about 12 new poses a second; stitches stay in place and the fuzz
    stays soft.

    ROOMS  Kitchen: a pale blue crocheted glass, a white crocheted tub,
    a small brown crocheted bottle, a teal crocheted kettle with a
    felted puff of steam.
    PRODUCT  A deep-green crocheted stand-up pouch, stuffed firm, a
    yellow crocheted bear face top right. Label: "Sprout" in large
    yellow intarsia letters; "28 Daily Packs" stitched small at the
    bottom.

    REFERENCES (make and approve first)
    R1 Doll. A crocheted doll of a woman about 40, medium build,
      shoulder-length dark brown yarn hair in loose waves, a mustard
      stockinette jumper, grey rib-knit trousers, embroidered eyes and
      brows, standing full length, front on, against a cream knitted
      wall. [MATERIAL]. Camera at her eye level, full shot.
    R2 Pouch. [PRODUCT], front on, on the oak-brown rib-knit counter.
      [MATERIAL]. Attach: pouch photo = shape and colors.
    R3 Kitchen, empty. [ROOMS]. [MATERIAL]. Camera at counter height.

    START FRAME F3 (lines 3-4)
    Six thin strands of leaf-green yarn lie side by side on the
    oak-brown rib-knit counter, their ends pointing to a small
    deep-green crocheted daily pack at the right. [MATERIAL]. Camera:
    close-up at counter height. Attach: R3 = the counter.
    (No doll card: she isn't in this shot.)

    CLIP 2 (8 s, from F3)
    [MOTION] Camera: locked-off.
    0 to 4 s: the six strands lie still; one end lifts slightly.
    4 to 7 s: the strands wind around each other into one thicker green
    yarn, turning as they go, and the yarn runs into the daily pack.
    7 to 8 s: the yarn and pack rest.
    Fixed: the counter and the pack's shape.
    End: one thick green yarn leading into the pack.
    Narration: "Here's six grams of fiber, the easy way. Six strands.
    One pack."

    SOUND  None. The tool makes no sound; record the narrator
    separately.
    EDIT NOTES  If "Sprout" or "28 Daily Packs" comes out wrong in clip
    4, lay the real label from the photo over the held frame. Offer as
    on-screen text on clip 4: $29.99 first order with text sign-up.
    Renews at $49.99 every 4 weeks.
    MISSING: the color of "28 Daily Packs" on the pouch, and a photo of
    a single daily pack for F3 and the tearing close-up.
    (cut for length: the full run also had F1, F2, F5, F6 and clips 1,
    3 and 4)

tweaks:
  - what: Fabrics
    how: Change a surface's fabric in the material sentence (garter for a rug, cables for a tree, felt for steam) and every image prompt follows.
  - what: Yarn thickness
    how: Chunky yarn gives big, cosy stitches and less detail. Fine yarn keeps small details like a label. Pick one for the whole ad.
  - what: Camera
    how: Locked-off is the default. Ask for one slow dolly in on a held product shot. Dolls stay at full or medium shot.
  - what: Clip length
    how: Give your tool's clip length. It resizes the timed steps to fit, still with one change per clip.

judge:
  - The material sentence is word for word the same in every image prompt.
  - The doll card is pasted whole wherever she appears, and left out of shots without her.
  - Every object in every prompt names its material and a real color.
  - Each clip has one camera move and one yarn change, written as yarn behaves.
  - No prompt asks for a close-up of a face.
  - The label lines are short, in quotes, and match your pack.

test:
  - Make R1 (the doll) first. If she looks like a real person, check that the prompt opens with "a crocheted doll of".
  - Make clip 2 and watch the stitches. They should stay put while the strands wind together; if they smear, try a shorter clip.
  - Put two start frames side by side. The material sentence should match word for word.
  - Search every prompt for "needle" and "hook". Neither should appear outside the avoid field.

improve:
  - Save your approved material sentence, doll card and room list in your brand file, so every ad in a series matches.
  - Keep the approved doll, product and room stills, and attach them from the start of each new ad.
  - Add your video tool and clip length to "Your tools", so the timed steps fit first time.
  - Add any miss you keep seeing to the fixes table, with the change that cured it.
  - Pair it with the skill that writes the knitted wool script, so every picture note already names its material.

terms:
  - term: Material sentence
    meaning: One fixed sentence giving every kind of surface its fabric, plus the yarn, colors and light, pasted word for word into every image prompt.
  - term: Doll card
    meaning: A short fixed description of the doll (build, yarn hair, clothes) pasted whole into every frame she's in.
  - term: On twos
    meaning: Each pose is held for two frames, so you see about 12 new poses a second. It gives the stepped, handmade look of stop-motion.
