new_slug: turn-motion-graphics-script-into-ready-video-shots
name: Turn your motion graphics script into ready-to-make video shots
summary: A design card, storyboard, and wordless plate and clip prompts, plus every word to set in editing.
job: make-video-ads

headline: Get a flat graphic ad where every word, number and logo comes out exactly right
subhead: Give it a motion graphics script and your product cutout. It fixes a design system in your colours and type, storyboards one move per shot, writes prompts for wordless plates, and lists every word and number for you to set in editing.

explain: |
  AI video tools are bad at text. Ask one for a graphic ad and you get misspelled labels, invented numbers, a logo that's almost yours, and bars on a chart that don't match any figure. The camera drifts and the flat design turns into fake 3D.

  This skill splits the job in two. The video tool makes only what it's good at: flat shapes, backgrounds, icons drawing in, your product cutout turning slowly, all with no words. Every prompt repeats one look line and a movement lock, so each shot stays flat, square-on and in your palette, with one move that comes to rest. Then you get a list of every word, number and logo, with its timing and source, to set yourself in your editor using your own typefaces. Charts are drawn to the proportions of your real figures, with the figures added on top.

when:
  - You have a motion graphics script and need prompts for an AI image and video tool.
  - Earlier attempts came out with garbled text, wrong numbers or a drifting camera.
  - You want charts or diagrams in the ad that match your real figures exactly.

you_give:
  - The script or key messages, with any figures
  - A cutout-quality photo of your product, or a screen capture for an app
  - How your product works, and figures with sources
  - Your colours, typefaces and never-show list (optional)
you_get:
  - A design system card in seven parts
  - A storyboard with one message and one move per shot
  - An opening still prompt, plate prompts and clip prompts
  - A text layer list of every word and number, with time and source

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste your script underneath, then attach or describe your product cutout.
  - Add your colours, typefaces and any figures with sources.
  - Make the opening still first and check it has no text in it.
  - Make each clip with its prompt, ending with everything at rest.
  - Set the words and numbers in your editor from the text layer list.

how_it_works:
  - title: Fixes the design system
    text: Grid, three type sizes, your palette with one accent, one shape style, one icon style, one way of moving.
  - title: One message per shot
    text: Every move shows something. What matters most, cause and effect, a comparison, or how it works step by step.
  - title: Keeps the cutout true
    text: Your product from its photo, in every first shot, never redrawn as an icon.
  - title: Draws honest charts
    text: Bars keep the proportions of your figures. No data, no chart.
  - title: Storyboards it
    text: Shots of 3 to 4 seconds, 2 or 3 to a clip, each clip ending with everything still.
  - title: Writes plates and clips
    text: Wordless plate prompts with a plain copy area, and clip prompts with a movement lock.
  - title: Lists the text
    text: Every word and number for editing, checked against your approved copy and data.

output_shape: |
  DESIGN SYSTEM CARD
  Grid: <...>  Type: <3 sizes>  Palette: <ground, brand colours, accent>
  Shapes: <...>  Icons: <...>  Cutout: <...>  Transition: <one family>

  STORYBOARD
  Time | Message laid over | Picture, what its move shows | Enters | Hold | Exits
  ...

  OPENING STILL
  <look line> <attached cutout and what to copy> <plate and plain copy area> <palette and light> <no generated words, numbers, logos>

  CLIP <n>
  <look line> <shots in order, one move each> <movement lock>

  TEXT LAYER LIST
  <time> "<word or number>" <size> <source>
  MISSING: <...>

example:
  business: sprout
  input: |
    [the skill]

    Script (from "Get a motion graphics ad script that sells"):
    1 "What's in one Sprout pack?"           WHAT'S IN ONE PACK?
    2 "Sixty-plus ingredients."               60+ INGREDIENTS
    3 "Twenty-one vitamins and minerals."     21 VITAMINS & MINERALS
    4 "And 6 grams of prebiotic fiber."       6G PREBIOTIC FIBER
    5 "In a 12-week study, vitamin C in the blood rose 2.7 times more
       than placebo."  Chart: left bar 2.7x the right. VITAMIN C: 2.7X
    6-7 Offer: $29.99 first order with text sign-up, then $49.99 every
       4 weeks. Cancel anytime.
    Cutout: Sprout pouch, glossy deep green, yellow wordmark (attached).
    Colours: cream #FFF7DF, forest #00582D, deep forest #002C17,
    kelly #007E40, accent sunflower #FFCC2E.
    Type: Work Sans bold and medium, DM Mono. Clips: 10 s, 9:16.
  output: |
    DESIGN SYSTEM CARD
    Grid: 4 columns, 96 px margins; copy zone top third; cutout lower
      two-thirds, centred
    Type: Work Sans bold 96 px / Work Sans medium 48 px / DM Mono 28 px
    Palette: cream ground; forest, deep forest, kelly; accent sunflower
    Shapes: rounded corners throughout
    Icons: outlined, 6 px line, 12 px radius, deep forest
    Cutout: front on, true colour, one soft shadow beneath
    Transition: slide along the grid, ease out, hold

    STORYBOARD
    0-3 s | WHAT'S IN ONE PACK? | pouch slides up to centre; hierarchy
      | pouch | 2 s | -
    3-6 s | 60+ INGREDIENTS | leaf icon slides in left of pouch | icon
      1 | 2 s | -
    6-9 s | 21 VITAMINS & MINERALS | drop icon slides in beside it |
      icon 2 | 2 s | -
    (clip 1 ends, all at rest)
    9-12 s | 6G PREBIOTIC FIBER | wheat icon completes the row | icon 3
      | 2 s | icons slide off left
    12-17 s | VITAMIN C: 2.7X PLACEBO | two bars rise on one baseline,
      left bar 2.7x the right, left in sunflower; comparison | bars |
      3 s | bars slide off
    (clip 2 ends)
    17-22 s | offer lines | pouch centred, still | - | 5 s | -

    OPENING STILL
    A flat original graphic design on a plain warm cream ground
    (#FFF7DF), even 4-column grid, flat rounded shapes in forest green
    #00582D and kelly green #007E40, one sunflower #FFCC2E accent,
    even shadowless light, locked square-on camera. Attached: Sprout
    pouch cutout; copy its shape, colours and printing exactly. Plate:
    the pouch centred in the lower two-thirds with one soft shadow;
    the top third left plain cream for copy. No generated words,
    numbers, logos, watermarks or app screens.

    CLIP 2 (10 s, continues from clip 1's last frame)
    [Look line]. 0-3 s a third outlined icon, a wheat stalk, slides in
    along the grid to complete a row of three, eases to a stop, holds.
    3-5 s the icons slide off left together. 5-10 s two rounded bars
    rise from one baseline beside the pouch, the left bar 2.7 times
    the height of the right, left bar sunflower, right bar pale kelly;
    both stop and hold. Movement lock: flat graphic motion at real
    speed, locked camera, no shake, drift or zoom, no blur trails,
    particles or lens flare, no 3D depth, nothing morphs, the pouch
    keeps its proportions, colours and printing. No generated words,
    numbers, logos, watermarks or app screens.

    (cut for length: the full run also had plate prompts for each icon
    and the bars, and clips 1 and 3)

    TEXT LAYER LIST
    0.5 s  "WHAT'S IN ONE PACK?"  96 px  script
    3.5 s  "60+ INGREDIENTS"  48 px  label claim
    6.5 s  "21 VITAMINS & MINERALS"  48 px  label claim
    9.5 s  "6G PREBIOTIC FIBER"  48 px  label claim
    13 s   "VITAMIN C: 2.7X PLACEBO"  96 px  2025 study
    13 s   "2025 RANDOMIZED PLACEBO-CONTROLLED STUDY, 120 ADULTS"
           28 px  study
    17.5 s "$29.99 FIRST ORDER WITH TEXT SIGN-UP"  48 px  price box
    19.5 s "THEN $49.99 EVERY 4 WEEKS. CANCEL ANYTIME."  48 px  price
