    Logo: brand file needed (MISSING: logo file).

tweaks:
  - what: The transition family
    how: Choose slide, wipe, scale or draw-on once. Slide suits contents and icons; draw-on suits a diagram that builds link by link.
  - what: Shots per clip
    how: Give your tool's clip length. It keeps each shot at 3 to 4 seconds and fits 2 or 3 to a 10-second clip.
  - what: Charts
    how: Paste the figure and its source. The prompt states the bar proportions in words, and the number goes in the text layer list.
  - what: App instead of product
    how: Give a screen capture of your app. It treats the capture as the cutout and never generates screens; real screenshots are prepared by hand.

judge:
  - The same look line appears in the opening still and every clip prompt.
  - No prompt asks the tool to write any word, number or logo.
  - Every shot has one move and ends at rest.
  - Chart proportions in the prompt match the figure in the text list.
  - Every line in the text layer list has a source.

test:
  - Search every prompt for words, numbers or a logo. There should be none. They all belong in the text layer list.
  - Check one chart. A bar twice as tall should stand for a figure twice as big, and the figure should be in the text list with its source.
  - Make the opening still and look at it at phone size. The copy area should be plain enough to set text on.
  - Run it twice on the same script. The design system card should name the same colours, typefaces and single accent both times.

improve:
  - Write your design system into step 1 of the skill file (your colour codes, typefaces and the one accent), so every ad in a series matches.
  - Add your figures and their sources to your brand file. Step 4 only draws charts from them.
  - List your own logo, icons and screenshots in "What you need", so the plan leaves them for editing instead of generating them.
  - Pair it with the skill that writes the motion graphics script, so each shot already has one message.

terms:
  - term: Plate
    meaning: A background image with no words on it, made so text can be added on top in editing.
  - term: Movement lock
    meaning: A fixed paragraph in every clip prompt that tells the video tool how things may and may not move.
  - term: Text layer
    meaning: The words and numbers you add on top of the video in your editor, instead of asking the AI to draw them.
