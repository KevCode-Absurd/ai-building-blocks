new_slug: turn-motion-graphics-script-into-ready-video-shots
name: "Turn your graphic ad script into a finished video"
summary: "Give it your graphic ad script and product cutout. You get a build sheet per shot with exact text and timings."
job: make-video-ads

headline: "Turn your graphic ad script into a finished video"
subhead: Give it a motion graphics script (look card, fact sheet and shot table) and your product cutout. It checks the script, sets the canvas and safe area, and writes a layer-by-layer build sheet for every shot, ready for an editor or for code with Claude Code, with every word and number exact.

explain: |
  Graphic ads live on exact numbers, and AI video tools still misspell words, invent figures and redraw labels. So this skill never asks a video model for text, a chart or your product. Every word, number, bar and the product photo is built as a live layer in an editor or in code, so it comes out exactly as the script wrote it.

  It takes the script skill's output as it is. It checks that every number has a source, every chart starts at zero and the full price terms travel with the price. Then it sets the canvas and the app's safe area, works out each shot's length from its hold time, and writes a build sheet per shot: layers from back to front, each move with its frames and easing (ease out to arrive, ease in to leave, under half a second). For code it lists one scene per shot for Remotion with Claude Code. If you want moving backgrounds, it writes wordless prompts for a video model, and nothing else.

when:
  - You have a motion graphics script and want it built without a single wrong number.
  - Your last AI-made graphic ad came back with misspelled words or a redrawn label.
  - You want to build ads in code with Claude Code and need a clear plan to hand it.

you_give:
  - The script from the motion graphics script skill (look card, fact sheet, shot table)
  - A cutout of your product with the background removed
  - Your font files, logo and colour codes (optional)
  - Your route, an editor or code, and whether you want moving backgrounds (optional, code by default)
you_get:
  - A script check that passes or lists what's wrong
  - The canvas, frame rate, margins and safe area
  - A build sheet for every shot, with layers, moves, frames and easing
  - A Remotion scene list or editor layer list, background prompts if wanted, and a text table with sources

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the whole script from the motion graphics script skill and attach your product cutout.
  - Say whether you'll build in an editor or in code, and whether you want moving backgrounds.
  - For code, open Claude Code in a Remotion project and give it the scene list.
  - Watch the preview at phone size and check every number against the text table before the final render.

how_it_works:
  - title: Checks the script
    text: Every number on the fact sheet with a source, every chart from zero, full price terms with the price, one fact and one moving thing per shot.
  - title: Sets the canvas
    text: Size, frame rate and margins from the look card, with words kept out of the top 14%, the bottom 35% and the side edges.
  - title: Times each shot
    text: The script's hold time plus a short entrance. Arrivals ease out in under half a second, exits ease in, and text sits still while it's read.
  - title: Writes build sheets
    text: Background, product, shapes and charts, text and the small line, back to front, each move with its frames and easing. Bars are drawn from their numbers.
  - title: Picks the route
    text: One scene per shot for Remotion with Claude Code, or the same layers as keyframes for an editor.
  - title: Keeps models wordless
    text: A video model only makes moving backgrounds of plain shapes. Text, numbers, charts and the product always sit on top as layers.

output_shape: |
  SCRIPT CHECK  pass, or <problems>
  CANVAS  <size>, <frame rate>, margins <..>, safe area <..>

  SHOT <n> (<seconds>, <frames>)  Fact: <..>
  Layers, back to front:
  background: <colour or background prompt n>
  product: <position, size, shadow>
  shape/chart: <colour job>, <from> to <to>, frames <a-b>, <easing>
  text: "<exact text>" <size>, <position>, in <frame>, out <frame>
  small line: "<source or terms>"

  ROUTE  <Remotion scene list, or editor layer list>
  BACKGROUNDS  <wordless prompts, or none>
  TEXT TABLE  <shot | text | start-end | source>
  MISSING: <..>

example:
  business: sprout
  input: |
    [the skill]

    Script (from the motion graphics script skill, 20 s, 9:16):
    LOOK CARD  Frame: 9:16, 96 px side margins at 1080 wide, words
    upper middle, product below. Colour jobs: cream #FFF7DF background;
    forest #00582D and deep forest #002C17 for shapes and text;
    sunflower #FFCC2E highlight, one thing per shot. Type: Work Sans
    bold 96 px, Work Sans medium 48 px, DM Mono 28 px uppercase.
    Product: pouch cutout, one soft shadow. Motion: rise in with ease
    out, drop out with ease in, 0.4 s each.
    FACT SHEET  60+ ingredients, 21 vitamins & minerals, 6g fiber =
    label. Vitamin C 2.7x placebo = 2025 study, 12 weeks, 120 adults.
    $29.99 first order with text sign-up; renews at $49.99 every 4
    weeks, cancel anytime = offer terms.
    SHOTS  1 opening "What's in one pack?" 1.8 s | 2 "60+ ingredients"
    1.5 s | 3 "21 vitamins & minerals" 2.0 s | 4 "6 g prebiotic fiber"
    1.8 s | 5 bars, "Vitamin C: 2.7x placebo" + "2025 study, 12 weeks,
    120 adults" 4.2 s | 6 "$29.99 first order" + "with text sign-up"
    2.8 s | 7 "Then $49.99 every 4 weeks" + "Cancel anytime" 3.1 s
    Cutout attached. Route: code. Backgrounds: none.
  output: |
    SCRIPT CHECK  Pass. Every number is on the fact sheet with a
    source; the bars in shot 5 are set from 2.7 and 1 on one zero
    line; the renewal follows the first-order price in shot 7.

    CANVAS  1080 x 1920, 30 frames a second. Side margins 96 px.
    Safe area: no words above 269 px or below 1248 px from the top,
    or within 65 px of either side.

    SHOT 1 (2.2 s, 66 frames)  Fact: none (opening)
    background: cream #FFF7DF
    product: pouch cutout, centred, lower half, 720 px tall, one soft
      shadow; rises 120 px into place, frames 0-12, ease out
    text: "What's in one pack?" Work Sans bold 96 px, deep forest,
      upper middle; in at frame 6 (rise 40 px, 12 frames, ease out),
      still to frame 66

    SHOT 2 (1.9 s, 57 frames)  Fact: count
    product: holds
    text: "60+" in sunflower and "ingredients" in deep forest, Work
      Sans bold 96 px, beside the pouch; "60+" scales from 80% to 100%,
      frames 0-12, ease out; still to frame 57

    SHOT 5 (4.6 s, 138 frames)  Fact: measured result
    shape/chart: one zero line in forest; placebo bar grows to 200 px,
      Sprout bar to 540 px (2.7 times), sunflower, frames 0-12, ease
      out; then still
    text: "Vitamin C: 2.7x placebo" Work Sans bold 96 px, in at frame
      6, still to frame 138
    small line: "2025 STUDY, 12 WEEKS, 120 ADULTS" DM Mono 28 px, held
      the whole shot

    SHOTS 6 and 7 (3.2 s and 3.5 s)  Fact: price and terms
    product: centred, still. Nothing moves while the terms are read.
    text: "$29.99 first order" / "with text sign-up", then "Then
      $49.99 every 4 weeks" / "Cancel anytime", each pair in together
      at frame 6, out with ease in over 8 frames

    (Shots 3 and 4 follow shot 2: each new line rises in under the
    last, 12 frames, ease out. Total 20.0 s.)

    ROUTE  Remotion with Claude Code: one composition, 1080 x 1920 at
    30 a second, seven scenes in order with the frame counts above.
    Fonts from your files; colours as hex codes; every line as a
    typed string; bar heights computed from 2.7 and 1. Render a
    preview first.
    BACKGROUNDS  None. Flat cream throughout.

    TEXT TABLE
    1 | What's in one pack? | 0.2-2.2 s | opening, no claim
    2 | 60+ ingredients | 2.2-4.1 s | label
    3 | 21 vitamins & minerals | 4.1-6.5 s | label
    4 | 6 g prebiotic fiber | 6.5-8.7 s | label
    5 | Vitamin C: 2.7x placebo; 2025 study, 12 weeks, 120 adults |
        8.7-13.3 s | 2025 study
    6 | $29.99 first order; with text sign-up | 13.3-16.5 s | offer
    7 | Then $49.99 every 4 weeks; Cancel anytime | 16.5-20.0 s |
        offer terms
    MISSING: the Work Sans and DM Mono font files, to install before
    the render.

tweaks:
  - what: The route
    how: Say "code" to get a Remotion scene list for Claude Code, or "editor" to get the same layers as keyframes for your motion editor.
  - what: Moving backgrounds
    how: Ask for them and you get wordless prompts of plain shapes in your colours for a video model. Text, charts and the product still sit on top as layers.
  - what: Pace
    how: Hold times come from the script (characters divided by 15, plus half a second). To go faster, cut words in the script, not hold time here.
  - what: Shape
    how: Ask for 4:5 or 1:1 as well. It resets the canvas and safe area and moves the layers, keeping every word and number the same.

judge:
  - No word, number, chart or product is asked of a video model.
  - Every number on screen matches the fact sheet, with its source in the text table.
  - Bars are drawn from their numbers, to scale from one zero line.
  - Text holds still for its full hold time and sits inside the safe area.
  - Arrivals ease out and exits ease in, each in under half a second.
  - The product cutout looks the same in every shot.

test:
  - Give it a script with a number that has no source. The script check should stop and name it.
  - Measure the two bars in the render. Their heights should keep the same ratio as their numbers.
  - Pause on each shot at phone size. Every line should read twice before it leaves.
  - Read the text table against your offer terms, character by character. The renewal price should never be missing from a shot that shows the first-order price.

improve:
  - Save your canvas, fonts and colour codes in your brand file, so every build starts from them.
  - Keep a Remotion project with your fonts installed, so Claude Code only has to add the scenes.
  - Add your house entrance and exit moves to step 3, so every ad moves the same way.
  - Pair it with the motion graphics script skill, which writes the look card, fact sheet and shot table this skill reads.

works_best_with:
  tools:
    - {name: "Claude Code with Remotion", why: "Builds the ad in code, so every word, number and bar height renders exactly as written."}
    - {name: "Claude", why: "Turns a long shot table into build sheets without dropping a layer or a source."}
    - {name: "Veo 3.1", why: "Makes wordless moving backgrounds of plain shapes if you want them behind the layers."}
  inputs:
    - "Your font files and a vector logo, so text and branding render sharp at every size"
    - "A clean cutout of the product in each view you show, so no shot needs a redrawn pack"
    - "One past ad in your style, so entrance and exit moves match what buyers have seen"

terms:
  - term: Build sheet
    meaning: The list of layers in one shot, back to front, with each move's timing and easing.
  - term: Ease out and ease in
    meaning: Ease out starts fast and settles, for things arriving. Ease in starts slow and speeds away, for things leaving.
  - term: Safe area
    meaning: The part of a tall video the app doesn't cover with names, buttons or captions.
