new_slug: turn-paper-world-script-into-ready-video-shots
name: "Turn your paper-craft script into video clips"
summary: "Give it your script and product photo. You get image and clip prompts that keep every frame real cut and folded paper."
job: make-video-ads

headline: "Turn your paper-craft script into video clips"
subhead: Give it a narrated paper-craft script and your product photo. It writes one material sentence for every image, reference stills to approve first, and clip prompts where paper moves only as paper can (slide, pivot, fold, pop up).

explain: |
  Paper ads break in familiar ways once an AI video tool gets them. The scene turns into flat clip art. It shows up as a craft model on a desk instead of a world you're inside. Shapes go soft like clay, paper bends like rubber, and your label gets redrawn wrong.

  This skill writes prompts the way the tools' own guides advise. One material sentence (the build, the paper types, the edge, the colors, one low side light so every layer casts a shadow) goes word for word into every image prompt. You make the product, the figure and each setting as reference stills first. Each clip prompt then says only what moves, in paper terms: stop-motion on twos, rigid pieces, one camera move, and the paper mechanism written as it really works, like a card piece standing up from the fold as a page opens.

when:
  - You have a paper-craft script and need prompts for AI image and video tools.
  - Earlier attempts looked like clip art, clay, or a model on a table.
  - Your turn is a paper moment, like a pop-up or a flap, and you want it to read clearly.

you_give:
  - The script with narration and picture notes (and its show plan, if you have one)
  - A clean product photo and its biggest label lines with their colors
  - How your product is used
  - Your tools and clip lengths, and whether your video tool makes sound (optional)
you_get:
  - The turn, with where the paper change starts and ends
  - A material sentence and a motion sentence to paste unchanged
  - Reference stills and start frames, each with a camera spot inside the scene
  - Clip prompts, a sound line and edit notes, plus fixes for common misses

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your script underneath, then your label lines, and attach the product photo.
  - Make the card product and the figure first, and approve them.
  - Make each start frame with the approved pictures attached.
  - Make one clip per start frame, then add the narration and offer in editing.

how_it_works:
  - title: Finds the turn
    text: Reads the show job, paper mechanism and build from your script, and where the change starts and ends.
  - title: Writes one material sentence
    text: Build, paper types, edge, colors and a low side light, pasted unchanged into every image prompt.
  - title: Makes references first
    text: The card product (or a cut-out photo of it), the paper figure and each empty setting.
  - title: Places the camera inside
    text: Every start frame says where the camera stands in the paper world, so it never looks like a model on a desk.
  - title: Writes clips that move like paper
    text: Stop-motion on twos, rigid pieces, one camera move, and the mechanism written as it really works.
  - title: Adds sound, edit notes and fixes
    text: Ambient sound only if your tool makes it, the real label laid over if needed, and what to change when a result misses.

output_shape: |
  TURN  <show job>, <mechanism>. Starts <where>, ends <where>.
  Paper scene change: <one, or none>

  MATERIAL SENTENCE  <pasted unchanged into every image prompt>
  MOTION SENTENCE  <opens every clip prompt>

  REFERENCES (make and approve first)
  R<n> <what>. Prompt: <...> Attach: <photo> = <job>

  START FRAMES
  F<n> (lines <n>) <subject and action>. <setting>. [MATERIAL].
  Camera: <spot inside the scene>. Label: "<line>"  Attach: R<n> = <job>

  CLIP <n> (<seconds>, from F<n>)
  [MOTION] Camera: <one move>  0 to <n> s: <...>  <n> to <n> s: <...>
  Fixed: <...>  End: <...>  Narration: "<line>"

  SOUND  <ambient line, or none>
  EDIT NOTES  <label overlay, text, narration>
  MISSING: <facts it needed>

example:
  business: sprout
  input: |
    [the skill]

    Script (from the paper world script skill), about 30 s.
    Show plan: reveal, pop-up. Flat-cut figure on layered planes,
    matte card, kraft lunchboxes, scissor-cut edges.
    1 "Lunchboxes. Permission slip. One missing shoe." Card kitchen.
    2 "Your own vitamins? Still on the shelf." Card shelf.
    3 "So put them where your day already goes." Paper planner.
    4 "One pack, right there." THE TURN: the page turns, the daily
      pack stands up from the fold.
    5 "Rip. Tip. Enjoy." Paper hands tear the pack across the top.
    6 "Sixty-plus ingredients, twenty-one vitamins and minerals, six
      grams of fiber." Card pouch on a car seat, slow push in.
    7 Offer, held.
    Product photo attached. Label: "Sprout" in yellow, a yellow bear
    face top right, "28 Daily Packs" at the bottom. Gummies: small
    deep-green bears. Tear only straight across the top.
    Colors: forest green #00582D, cream #FFF7DF, sunflower #FFCC2E.
    Video tool: 8-second clips, no sound.
  output: |
    TURN  Reveal, pop-up. Starts on the open planner at line 3; the
    page turns and the daily pack stands up from the fold at line 4;
    ends with the pack upright and still.
    Paper scene change: none. The page turn is the turn itself; every
    other change of setting is a cut.

    MATERIAL SENTENCE
    A world built from real paper: flat-cut figures pinned at the
    joints, set on three layered planes, matte card stock in cream,
    forest green, sunflower yellow and sky blue, kraft paper for boxes,
    clean scissor-cut edges showing the card's thickness, one low warm
    side light so each layer casts a soft shadow on the one behind,
    the paper scene filling the frame on every side.

    MOTION SENTENCE
    Paper stop-motion animated on twos: each pose holds for two frames,
    about 12 new poses a second; every piece stays rigid and flat.

    REFERENCES (make and approve first)
    R1 Pouch. A deep green stand-up pouch cut and folded from card,
      front on, a yellow card bear face top right. [MATERIAL]. Label:
      "Sprout" in large yellow letters; "28 Daily Packs" small at the
      bottom. Attach: pouch photo = shape and colors.
    R2 Woman. A flat-cut paper woman with adult proportions, front on:
      cream card face with two black dot eyes, short dark brown card
      hair, blue card jumper, grey card trousers, pinned at shoulders,
      elbows and knees, against plain cream card. [MATERIAL].
    R3 Kitchen, empty. Cream card walls, forest green card cupboards,
      a sunflower card window. [MATERIAL].

    START FRAME F3 (lines 3-4)
    The paper woman's pinned hands hold an open paper planner, the
    right-hand page crowded with flat-cut icons (a bus, a laptop, a
    shopping bag), the kitchen layers behind her. [MATERIAL]. Camera:
    over her shoulder, at her eye level. Attach: R2 = the woman, R3 =
    the room behind.

    CLIP 2 (8 s, from F3)
    [MOTION] Camera: locked-off.
    0 to 4 s: her paper hand turns the planner page from right to left.
    4 to 7 s: as the next page opens flat, a green card daily pack
    fixed across the fold stands up to upright, its shadow growing on
    the page.
    7 to 8 s: the pack stands still.
    Fixed: her figure and the kitchen layers.
    End: the pack upright in the fold.
    Narration: "So put them where your day already goes. One pack,
    right there."

    SOUND  None. The tool makes no sound; record the narrator
    separately.
    EDIT NOTES  If the pouch label comes out wrong in clip 4, lay the
    real label from the photo over the held frame. Offer as on-screen
    text on clip 4: $29.99 first order with text sign-up. Renews at
    $49.99 every 4 weeks.
    MISSING: a photo of a single daily pack for the pop-up and the
    tearing close-up.
    (cut for length: the full run also had F1, F2, F5, F6 and clips 1,
    3 and 4)

tweaks:
  - what: The build
    how: Change the build in the material sentence (flat cut, layered planes, pop-up and fold, quilled detail) and every image prompt follows.
  - what: Camera spot
    how: Name one per setting (her eye level, low at the counter, straight down). It always stands inside the paper world.
  - what: Motion feel
    how: On twos is the default handmade step. If clips judder too much, ask for "smooth stepped motion" and keep "every piece stays rigid".
  - what: Busy labels
    how: Ask for the cut-out photo version of your pack. It keeps every word exact without asking the image tool to spell them.

judge:
  - The material sentence is word for word the same in every image prompt.
  - Every start frame names a camera spot inside the scene.
  - Every object in every prompt names its paper or card.
  - Each clip has one camera move and one paper change, written as paper moves.
  - The label lines on the card pack are short, in quotes, and match your pack.

test:
  - Make R2 (the figure) first. If it comes back as flat digital art, run the same prompt once more before changing any words.
  - Make clip 2 and watch the pack. It should stand up stiffly from the fold, never bend or melt into place.
  - Search the prompts for "desk", "table" and "scissors". None should appear outside the avoid field.
  - Run it twice on the same script. The material and motion sentences should match word for word.

improve:
  - Write your approved material sentence into step 2 of the skill file, so every ad in a series uses the same paper.
  - Save your approved figure and pack stills in your brand file, and attach them to every scene.
  - Add your video tool and clip length to "Your tools", so the timed steps fit first time.
  - Add any miss you keep seeing to the fixes table, with the change that cured it.
  - Pair it with the skill that writes the paper-craft script, so every line is already one paper picture.

