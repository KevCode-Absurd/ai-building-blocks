    - {name: "Veo 3.1", why: "Starts each clip from your approved still and can make sound with it, in 8-second clips."}
    - {name: "Kling 4.0", why: "Takes up to 10 reference images in one job, so figures and product stay the same from shot to shot."}
    - {name: "ElevenLabs Eleven v4", why: "Reads the narration with tags for pauses and pace, and can use a voice cloned from your own recording."}
  inputs:
    - "Photos of real paper you like (card, tissue, kraft), so the material sentence names paper that exists"
    - "The flat label artwork, so the label you put back in editing matches the pack exactly"
    - "The recorded narration before you make clips, so each clip is timed to its line"

terms:
  - term: Material sentence
    meaning: One fixed sentence describing the paper build, paper types, edge, colors and light, pasted word for word into every image prompt.
  - term: On twos
    meaning: Each pose is held for two frames, so you see about 12 new poses a second. It gives the stepped, handmade look of stop-motion.
  - term: Start frame
    meaning: The approved still a video tool animates from. The clip prompt then describes only what moves.
