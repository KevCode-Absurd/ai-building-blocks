  inputs:
    - "A photo of a real room or counter like the one in the script, so the place reference looks lived in"
    - "Photos of the product open and closed, so every step shows it the right way"
    - "The narration recorded in one take, so each clip is cut to its line"

terms:
  - term: Reference image
    meaning: An image you attach to a prompt so the tool copies a character, place or product from it.
  - term: Start frame
    meaning: The image a video clip begins from. The video tool animates forward from it.
  - term: Match cut
    meaning: A cut between two shots framed the same way, so only the thing that changed stands out.
