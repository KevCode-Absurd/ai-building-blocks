    - "The narration recorded in one take, so each clip is cut to its line"

terms:
  - term: Avatar card
    meaning: A short description of who or what carries the ad (look, props, voice, what never changes). You approve it before any image is made.
  - term: Lock lines
    meaning: Fixed lines for the skeleton, the look and the plain surfaces, pasted word for word into every prompt.
  - term: Start frame
    meaning: The image a video clip begins from. The video tool animates forward from it.
  - term: Match cut
    meaning: A cut between two shots framed the same way, so only the thing that changed stands out.
  - term: 180° line
    meaning: An imaginary line through the action. Keeping the camera on one side of it stops things swapping sides between shots.
