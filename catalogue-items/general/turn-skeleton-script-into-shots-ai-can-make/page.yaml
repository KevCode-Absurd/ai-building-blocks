new_slug: turn-skeleton-script-into-shots-ai-can-make
name: "Turn your skeleton ad script into video clips"
summary: "Give it your script and product photo. You get image and clip prompts with the same skeleton in every shot."
job: make-video-ads

headline: "Turn your skeleton ad script into video clips"
subhead: Give it a skeleton ad script and a real photo of your product. It builds three reference images, fixes one camera for every step, and writes a still and a short clip prompt per step, plus an edit plan for labels and the offer.

explain: |
  AI video tools forget everything between shots. Ask for "a cartoon skeleton" six times and you get six skeletons, a cupboard that moves, a calendar with garbled numbers and a pack with the wrong label. Then the climb stops making sense with the sound off.

  This skill makes the parts that must not change first: a three-view sheet of the skeleton, the place at its first step, and the product from its photo. Every shot is built from those, never from the last shot. One camera framing is used for every step, so each step joins the next on a match cut and only the growing thing moves. Each clip covers one step in 3 to 5 seconds, with the motion written as three beats. Labels and the offer are added in editing, never asked of the video tool.

when:
  - You have a skeleton "what happens if" script and need to make it with AI image and video tools.
  - Earlier tries gave you a different skeleton in every shot, or words and numbers baked into the picture.
  - You want a clear plan of every shot, in order, before you spend money on video credits.

you_give:
  - The script, line by line (the question, the steps with their labels, the turn, the close)
  - A real photo of your product, how it's used and how it must be shown
  - Your brand colours and whether you use music (optional)
  - Your image and video tools, their clip lengths and how many reference images they take (optional)
you_get:
  - Prompts for three reference images, each with its job
  - Fixed lines for the skeleton, the look and the plain surfaces, to paste into every prompt
  - A shot map with one fixed camera for every step, plus a still and a clip prompt per shot
  - An edit plan with the labels, the offer and their timings

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your skeleton script underneath and attach the product photo.
  - Make the three reference images first and approve them before any shot.
  - Make each still with the references attached, then each clip from its still.
  - Record the narration, cut the clips to it, and add the labels and offer as text in your editor.

how_it_works:
  - title: Reads the script
    text: Notes what grows, each step's label, the one place and where the product enters. It flags a script that changes place between steps.
  - title: Builds the references
    text: A three-view skeleton sheet, the place at its first step and the product from its photo. Each is named by its job in every prompt.
  - title: Writes the fixed lines
    text: One line for the skeleton, one for the look (style, three to five colours, the light) and one describing plain, unmarked surfaces.
  - title: Fixes one camera
    text: Every step uses the same framing, so steps join on a match cut. Close-ups go between steps.
  - title: Maps and writes the stills
    text: One row and one still per shot, with the growing thing described in shares (half the shelf), since image tools miscount.
  - title: Writes short clips
    text: One step per clip, 3 to 5 seconds, motion in three counted beats, one camera instruction and a hold line.
  - title: Plans the edit
    text: Narration first, then labels, the held peak, music cues if the brand uses music, and the exact offer on the last shot.

output_shape: |
  REFERENCES
  Image 1 (skeleton): <three-view sheet prompt>
  Image 2 (place at step 1): <empty set prompt>
  Image 3 (product): <from its photo>

  CHARACTER  <fixed skeleton line>
  LOOK       <style, 3 to 5 colours, light source>
  CLEAN      <plain surfaces, said positively>

  STEP CAMERA  <one framing used for every step>

  SHOT MAP
  # | label | what grows, at this step | camera | beats | seconds
  <one row per shot>

  STILL <n>  (attach: <images and their jobs>)
  [CHARACTER] [LOOK] SHOT: <camera; action; place; props; product>. [CLEAN]

  CLIP <n>  start frame: still <n>, <seconds>
  Beat 1 <...>. Beat 2 <...>. Beat 3 <...>. Camera: <one instruction>.
  HOLD: <fixed hold line>   SOUND: <if your tool makes sound>

  EDIT PLAN  <label or offer> at <seconds> | music cues | MISSING

example:
  business: sprout
  input: |
    [the skill]

    Script (from the skeleton ad script skill):
    Q "How many half-used tubs can one cupboard hold?"
    1 TUB 1 "Tub one. Two scoops, then the chalky taste wins."
    2 TUB 5 "Tub five. The shelf starts to bend."
    3 TUB 12 "Tub twelve. The door needs a hip to shut."
    4 TUB 20 "Tub twenty. The cupboard gives up."
    T "Or skip the tub. Rip. Tip. Enjoy."
    C "Sprout gummies. Sixty-plus ingredients in one daily pack."
    O "First order, $29.99 with text sign-up."

    Product: Sprout greens gummies. Photos attached: pouch front, one
    daily pack. Pouch: glossy deep green foil, big yellow wordmark,
    yellow bear face top right. Gummies: small opaque deep-green bears.
    Show it right: pack torn straight across its top edge only;
    gummies pour from the top into a palm; the pouch opens only at its
    resealable top, never torn.
    Colours: forest green #00582D, warm cream #FFF7DF, sunflower
    yellow #FFCC2E. Bright, sunny, candy-like. Never clinical.
    Tools: 5-second clips, 3 reference images. Music: not stated.
  output: |
    REFERENCES
    Image 1 (skeleton): [CHARACTER]. Three views on one sheet: front,
    three-quarter, side. Standing, arms relaxed. Plain mid-grey
    background, even light.
    Image 2 (kitchen at step 1): [LOOK]. Wide from a kitchen doorway at
    chest height. One open wall cupboard with a long straight shelf, a
    row of identical sealed tubs end to end, a shaker bottle on the
    counter, a window on the left. [CLEAN]
    Image 3 (product): the Sprout pouch and one daily pack from the
    attached photos, printing unchanged, on plain cream.

    CHARACTER  A lanky adult cartoon skeleton, warm ivory bones with a
    soft matte finish, big round cartoon eyes set in the sockets,
    white with dark pupils, no clothes.
    LOOK  Cinematic 3D animated image, warm cream, forest green and
    sunflower yellow, soft morning light from a window on the left.
    CLEAN  Plain white tubs with plain lids, blank cupboard doors and
    walls.

    STEP CAMERA  Wide from the doorway at chest height, skeleton
    standing at the cupboard's left end. Used for Q and steps 1 to 4.

    SHOT MAP
    # | label  | the cupboard at this step         | camera | s
    Q | none   | all sealed, shelf straight        | step   | 0-3.5
    1 | TUB 1  | first tub open, lid half on       | step   | 3.5-7.5
    2 | TUB 5  | a quarter of the row open, dips   | step   | 7.5-10.5
    3 | TUB 12 | over half open, door springs back | step   | 10.5-14
    4 | TUB 20 | all open, shelf folded, tubs on   | step   | 14-18.5
      |        | the floor                         |        |
    T | none   | skeleton at the counter, pouch    | medium | 18.5-21.5
    C | none   | palm, gummies pouring             | close  | 21.5-24.5
    O | offer  | pouch and pack front on           | wide   | 24.5-27

    STILL 3  (attach: image 1 = the skeleton, image 2 = the kitchen)
    [CHARACTER] [LOOK] SHOT: wide from the doorway at chest height; the
    skeleton presses the cupboard door with one hip, eyes narrowed;
    more than half the row of tubs open, the shelf sagging in the
    middle; the door pushed half shut. [CLEAN]

    CLIP 3  start frame: still 3, 3.5 s
    Beat 1 the skeleton leans its hip into the door. Beat 2 the door
    springs back open. Beat 3 its eyes go wide and its shoulders drop.
    Camera: locked off.
    HOLD: Same skeleton as image 1. Bones stay joined and rigid. Jaw
    stays closed. Real-time speed. Surfaces stay plain.
    SOUND: quiet kitchen room tone, a creak from the shelf.

    CLIP T  start frame: still T, 3 s (attach image 3 = the product)
    Beat 1 the skeleton turns from the cupboard to the counter. Beat 2
    it tears one daily pack straight across its top edge. Beat 3 it
    looks up, eyes soft. Camera: slow push in. HOLD and SOUND as above.

    EDIT PLAN (times are estimates until the narration is recorded)
    TUB 1 at 3.5 s | TUB 5 at 7.5 s | TUB 12 at 10.5 s | TUB 20 at
    14 s, held to 18.5 s | offer text from 24.5 s: "$29.99 first order
    with SMS sign-up. Renews at $49.99 every 4 weeks. 30-day money
    back, first order only."
    MISSING: whether Sprout uses music, so none is planned.
    MISSING: the daily pack's size, so shot T sizes it from the photo.
    (cut for length: the full run also had stills Q, 1, 2, 4, C and O,
    and clips for every shot)

tweaks:
  - what: The step camera
    how: Name the framing you want, like "wide from the doorway". Keep it the same for every step, or the climb stops reading with the sound off.
  - what: Clip length
    how: Give the shortest clip your tool makes well, often 4 or 5 seconds. One step per clip keeps the tool on task. Tools that take timed prompts can hold two steps.
  - what: The skeleton's signature item
    how: Add a cap or scarf to the character line and the reference sheet. It then appears, unchanged, in every shot and every future ad.
  - what: Sound
    how: If your video tool makes sound, keep the sound line to room tone and small prop noises. The narration and any music go on in editing.

judge:
  - Every step is framed the same way, and only the growing thing changes between them.
  - The skeleton has the same eyes, bones and proportions in every image.
  - No calendar, clock, sign or number appears inside any picture.
  - The product matches its photo, label and all, and opens the way your brand shows it.
  - Every prompt starts with the same character and look lines, word for word.

test:
  - Make the three references and the stills for step 1 and the peak. If the skeleton or the cupboard differs between them, fix the fixed lines before you spend credits on clips.
  - Flick between the step stills like a flipbook. Only the growing thing should move.
  - Show the stills, in order and with no sound, to someone who hasn't read the script. Ask what's happening. If they can't follow the climb, the steps aren't far enough apart.
  - Check every product shot against your real packaging, including how it opens. Any mismatch is a reason to stop before making video.

improve:
  - Write your fixed look line (your colours, light and style) into step 3 of the skill file, so every skeleton ad looks like one brand.
  - Save the approved skeleton sheet with your brand files and attach it as image 1 every time.
  - Add your product-showing rules to step 2, so the product reference is right first time.
  - Add your tools' clip lengths and reference limits to "What you need", so the plan fits without you saying it each time.
  - Pair it with the skill that writes a skeleton "what happens if" script, if you don't have one yet.

