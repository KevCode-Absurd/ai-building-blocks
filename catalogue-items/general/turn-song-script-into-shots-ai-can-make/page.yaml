new_slug: turn-song-script-into-shots-ai-can-make
name: "Turn your song ad script into video clips"
summary: "Give it your lyrics and product photo. You get a music brief, a storyboard on the beat and clip prompts."
job: make-video-ads

headline: "Turn your song ad script into video clips"
subhead: Give it your approved lyric and a product photo. It writes the brief for a music tool, then a storyboard cut to the finished song's real timings, plus image and video prompts for an animated lead who sings in some shots.

explain: |
  A song ad falls apart in making. The music tool adds a long intro, the video cuts land mid-word, the singer's face changes between shots, and mouths move in shots where nobody should be singing. Fixing one section of a song on its own usually makes it worse.

  This skill treats the song as the clock. First it writes the music brief: a title, a short style line and the lyric in labeled sections. You make the song once, whole. Then it takes the real time of every word and cuts the storyboard to it. It fixes one animated lead and one product description, makes a character picture first, and writes each video prompt with a guard so mouths only move in shots marked SUNG. It turns a script into shot-by-shot instructions for a video tool; it does not make the music itself.

when:
  - You have an approved song lyric and need to make the music and the animated video.
  - Earlier tries gave you cuts that missed the beat or a singer who looked different in every shot.
  - You want a clear plan before spending credits on a music tool and a video tool.

you_give:
  - The approved lyric, with section tags
  - A real product photo, how it's used, its main benefit and claims with sources
  - Your buyer, voice, colors, and whether your brand uses music and animation (optional)
  - The tools you'll use for music, images and video (optional)
you_get:
  - A music brief (title, style line, lyrics in sections) and a rule for redoing it
  - A timing sheet to fill from the finished song
  - Fixed descriptions of the lead, the look and the product
  - A storyboard timed to the song, and image and video prompts with a guard line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your approved lyric and attach a product photo.
  - Paste the music brief into your music tool and make the whole song in one go.
  - Paste the real word timings back in. The skill re-times every shot to them.
  - Make the character picture, approve it, then make each shot and clip in order.

how_it_works:
  - title: Briefs the song
    text: Writes a title, a style line under 25 words and the lyric in sections. Brand words are sung exactly. No instrumental intro.
  - title: Takes the real timings
    text: Uses the time of every word in the finished song as the clock. Before the song exists it plans at 2.5 words a second and marks every time as an estimate.
  - title: Fixes the lead and the look
    text: Describes one animated adult lead once (shape, hair, two clothing colors, one mark) and makes a character picture to attach to every shot.
  - title: Decides where the lead sings
    text: Usually the hook and the last chorus on camera, with silent pictures between.
  - title: Storyboards to the song
    text: One row per shot with time range, lyric, SUNG or silent, the picture and the framing. No words in any picture.
  - title: Builds the clips
    text: Writes video prompts in one of two ways, with a guard so no mouth moves outside SUNG shots and no sound is made in the clip.
  - title: Joins over the song
    text: Lays the whole song over the clips, then adds the offer and captions in editing.

output_shape: |
  MISSING: <anything to confirm before the song is made>

  SONG BRIEF
  Title: <the hook line>
  Style: <under 25 words, no artist or band>
  Lyrics: <sections in order, sung exactly>
  Redo rule: <remake the whole song, never one section>

  TIMING SHEET (<estimates, or real word times>)
  <line> <start-end> | ... | total <seconds>

  LEAD (paste unchanged)  <one fixed description of the animated adult>
  LOOK     <one fixed style sentence>
  PRODUCT  <from its photo, and how it is shown>
  PLACE    <the one place and its props>

  STORYBOARD
  #  time  lyric (start)  sung?  picture, framing
  <one row per shot>

  CLIP <n> PROMPT
  Shot <n> (<time>): <one action, camera, cut on the beat>
  GUARD (every clip): <fixed guard line>

example:
  business: sprout
  input: |
