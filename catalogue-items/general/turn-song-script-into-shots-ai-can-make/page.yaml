    #  time       lyric (start)          sung?   picture, framing
    1  0.0-2.8    Rip, tip, enjoy        SUNG    sings by the door, medium
    2  2.8-6.0    Lunch boxes packed     silent  boxes snap shut, close
    3  6.0-9.2    Shoes on the stairs    silent  shoes, kettle steams, wide
    4  9.2-12.8   And the chalky green   silent  shaker in the sink, close
