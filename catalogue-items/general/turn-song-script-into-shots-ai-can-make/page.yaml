    A handful of gummies, no water, no mess
    [Verse 2] Twenty-one vitamins and minerals, one small pack /
    Six grams of fiber, and you don't look back
    [Chorus] Rip, tip, enjoy, and out the door /
    Tastes like a treat, works like a supplement
    SUNG lines: 1, 9, 10
    Product: Sprout pouch and one daily pack, photos attached. Pouch:
    glossy deep green foil, big yellow wordmark, yellow bear face top
    right. Gummies: small opaque deep-green bears.
    Show it right: pack torn straight across its top edge; gummies pour
    from the top into a palm; the pouch opens only at its resealable top.
    Colors: forest green #00582D, warm cream #FFF7DF, sunflower yellow
    #FFCC2E. Bright, sunny, candy-like. Song not made yet.
  output: |
    MISSING: whether Sprout uses music and animation in ads. Ask
