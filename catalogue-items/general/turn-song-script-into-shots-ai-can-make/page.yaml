new_slug: turn-song-script-into-shots-ai-can-make
name: "Turn your song ad script into video clips"
summary: "Give it your song script and product photo. You get a music prompt, a storyboard on the beat and clip prompts."
job: make-video-ads

headline: "Turn your song ad script into video clips"
subhead: Give it a bar-by-bar song script and a product photo. It writes the prompt for a music tool, times every shot to the song's bars, and writes image and video prompts that keep one animated lead and your product the same in every shot.

explain: |
  A song ad falls apart in the making. The music tool adds a long intro, the video cuts land between beats, the lead's face changes from shot to shot, and mouths move where nobody should be singing.

  This skill uses the song as the clock. It writes a music prompt that starts singing at 0 seconds and ends on your sung brand tag, and has you pick the best of a few whole takes. Then it works out how long each bar lasts from the tempo, so every cut lands on a downbeat. The lead and the product are made as reference images first, and every shot is built from them. Each clip times its motion to the beat. Mouths move only on held notes, or where your tool can sync a mouth to the song. It writes the prompts; it does not make the music itself.

when:
  - You have a song ad script laid out in bars and need to make the music and the animated video.
  - Earlier tries gave you cuts that missed the beat, or a singer who looked different in every shot.
  - You want a clear plan before you spend credits on a music tool and a video tool.

you_give:
  - The song script, with the lyric in bars, the sound brief, the pictures and who sings
  - A real product photo, how it's used and how it must be shown
  - Your colours, and whether your brand uses music and animation (optional)
  - The music, image and video tools you'll use, and their clip lengths (optional)
you_get:
  - A music prompt in your tool's layout, and a rule for picking a take
  - A bar grid with the start time of every section
  - Fixed lines for the lead and the look, and three reference prompts
  - A storyboard cut on the bars, plus still and clip prompts with a hold line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your song script and attach the product photo.
  - Paste the music prompt into your music tool, make a few whole takes, and pick one.
  - Tell the skill the take's tempo, or paste its word times if it drifted. It re-times the shots.
  - Make the reference images, approve them, then make each still and clip in order.

how_it_works:
  - title: Writes the music prompt
    text: Length, tempo, key, voice, instruments and the arrangement in order, with singing from 0 seconds and the tag at the end.
  - title: Fixes the clock
    text: Works out the seconds per bar from the tempo and checks the chosen take against it. Real word times take over only if it drifts.
  - title: Fixes the lead and look
    text: One line for the animated lead, one for the look, and reference images for the lead, the place and the product.
  - title: Plans the singing
    text: An unseen singer by default. On-camera singing only on held notes, or with a tool that syncs a mouth to audio.
  - title: Storyboards on the bars
    text: Shots of one or two bars that cut on a downbeat, with the product on screen in the first 5 seconds.
  - title: Writes stills and clips
    text: Motion timed to the beat, one camera instruction per shot, and a hold line in every clip.

output_shape: |
  MUSIC PROMPT  <one paragraph, or style box + lyrics box>
  TAKE RULE     <make 3 to 5 whole takes, pick one, never join takes>

  BAR GRID  <BPM>, <seconds> s a bar (<estimate or from the take>)
  <section> bar <n> at <seconds> | ... | end <seconds>

  LEAD  <fixed line>    LOOK  <fixed line>
  REFERENCES  Image 1 <lead> | Image 2 <place> | Image 3 <product>

  STORYBOARD
  bars  seconds  lyric (start)  picture  singing?  framing
  <one row per shot>

  STILL <n>   [LOOK] SHOT: <framing; lead's action; place; product>
  CLIP <n>    [00:00-00:0n] <motion on the beat; camera>
              HOLD: <fixed hold line>

  EDIT  cuts on bar lines | offer over the tag | MISSING

example:
  business: sprout
  input: |
    [the skill]

    Song script (from the song ad script skill), 30 s, 120 BPM:
    [Hook] Rip it, tip it, out the door / A handful of greens and
    nothing more
    [Verse] Lunch box packed and the kettle's on / Keys in my hand
    and the morning's gone / That chalky shake? Still in the sink /
    No time to scrub, no time to think
    [Hook] (same two lines)
    [Lift] Twenty-one vitamins and minerals (2 bars) / Tastes like a
    treat, works like a supplement (2 bars)
    [Hook] (same two lines)  [Tag] Rip. Tip. Sprout.
    Sound: bright indie pop, warm female lead, handclaps, jangly
    guitar. Singer: unseen. Pictures as in the script.
    Product: Sprout pouch and one daily pack, photos attached. Pack
    torn straight across its top edge; gummies pour from the top into
    a palm; the pouch opens only at its resealable top.
    Colours: forest green, warm cream, sunflower yellow. Bright, sunny.
    Tools: one-box music tool; video clips up to 8 s with timed prompts.
  output: |
