    (cut for length: the full run also had the character picture
    prompt, the opening frame and prompts for clips 1, 3 and 4)

tweaks:
  - what: How the clips are built
    how: '"One place, clips that continue" chains clips of about 10 seconds and three lyric lines from one last frame to the next. "One image per shot" slices the song into pieces, each starting and ending on a beat, with SUNG shots matched mouth to words.'
  - what: Where the lead sings
    how: Two sung shots can bookend five silent ones. Ask for the lead to act out the story while singing, or to sing on a small stage between silent pictures.
  - what: The lead
    how: Give the lead's look in your own words (shape, hair, two clothing colors, one mark like glasses or a scarf). It keeps that wording fixed in every prompt.
  - what: Real timings
    how: Paste the word times from the finished song and ask it to re-time the storyboard. Only trim silence before the first word; instrumental stretches get pictures.

judge:
  - The song starts singing at once and the hook lands in the first 5 seconds.
  - Every cut falls on a real word time from the finished song, not an estimate.
  - The lead and the product look the same in every shot.
  - Mouths move only in shots marked SUNG, and match the words there.
  - No artist, band or tune is named or copied in the style line.
  - Nothing in the lyric or pictures claims more than your approved claims.

test:
  - Make the song first and paste in its real word times. Every shot boundary in the new storyboard should sit on one of those times; any that doesn't was left as an estimate.
  - Make the character picture and one SUNG shot and one silent shot. Check the lead matches in both and that the silent shot has a closed mouth.
  - Run the same lyric twice. The lead description and place should come back almost word for word; if they drift, paste your own lead description into the input.
  - Watch the finished clips with the sound off. Each silent shot should show what its lyric line says.

improve:
  - Write your brand's fixed look sentence and product-showing rules into step 3 of the skill file, so every song ad matches your other ads.
  - Save your approved lead's description and character picture in your brand file, and paste them into every run so the singer becomes a familiar face.
  - Add the clip length your video tool makes to "What you need", so clip plans fit without you saying it each time.
  - Pair it with the skill that writes a song ad script, if you don't have an approved lyric yet.

terms:
  - term: Timing sheet
    meaning: A list of when each word starts and ends in the finished song. It sets where every cut goes.
  - term: Guard line
    meaning: A fixed sentence added to every video prompt that stops common mistakes, like mouths moving or text appearing.
  - term: BPM
    meaning: Beats per minute, the speed of the song.
