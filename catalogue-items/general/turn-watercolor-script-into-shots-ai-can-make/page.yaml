new_slug: turn-watercolor-script-into-shots-ai-can-make
name: "Turn your watercolor script into video clips"
summary: "Give it your script and product photo. You get image and clip prompts that keep every frame one real-looking watercolor."
job: make-video-ads

headline: "Turn your watercolor script into video clips"
subhead: Give it your watercolor script and a product photo. It writes one material sentence for every image, reference stills to approve first, and clip prompts that describe only the one paint change, in the order you make them.

explain: |
  AI video tools lose watercolor fast. Paint swirls through every frame. The result looks like a photo with a filter. A brush and a hand wander in because the prompt said "brush". Colors go brown, and the label on your pack gets misspelled.

  This skill writes prompts the way the tools' own guides advise. One material sentence (paper, how the pigment sits, texture, colors, light) goes word for word into every image prompt. You make the product, the figure and the place as reference stills first. Each clip prompt then skips what the picture already shows and says only what moves: one camera move, the paint change in time order, what stays fixed. Techniques are written as what wet paint really does, so "glazing" becomes a thin see-through layer that darkens where it overlaps.

when:
  - You have a watercolor ad script and need it made with AI image and video tools.
  - Earlier tries looked like a filter, or the paint kept moving everywhere.
  - Your pack's label keeps coming out wrong in painted shots.

you_give:
  - The script with narration and picture notes (and its show plan, if you have one)
  - A clean product photo and its biggest label lines with their colors
  - What the product is made of, as your brand lists it
  - Your tools and clip lengths, and whether your video tool makes sound (optional)
you_get:
  - The turn, with where the paint change starts and stops
  - One material sentence to paste into every image prompt
  - Reference stills and start frames, in making order
  - Clip prompts, a sound line and edit notes, plus fixes for common misses

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your watercolor script and attach the product photo. Type out the biggest label lines.
  - Make the painted product first and compare it with your real pack.
  - Approve each start frame before you make its clip.
  - Make the clips in order, then add the narration, the real label if needed, and the offer in editing.

how_it_works:
  - title: Finds the turn
    text: Reads the show job and paint technique from your script, and where the change starts, stops and must never cross.
  - title: Writes one material sentence
    text: Paper, pigment, texture, colors and light, pasted unchanged into every image prompt.
  - title: Makes references first
    text: The painted product, the figure and the place, each approved by eye before any scene.
  - title: Writes start frames
    text: What's painted, the setting, the material sentence, flat framing and short label lines in quotes.
  - title: Writes clips that describe motion only
    text: One camera move, the paint change in timed steps, and what stays fixed.
  - title: Adds sound, edit notes and fixes
    text: Ambient sound only if your tool makes it, the real label laid over if needed, and what to change when a result misses.

output_shape: |
  TURN  <show job>, <technique>. Starts <where>, stops <where>.
  Never crosses <the label>.

  MATERIAL SENTENCE  <pasted unchanged into every image prompt>

  REFERENCES (make and approve first)
  R<n> <what>. Prompt: <...> Attach: <photo> = <job>

  START FRAMES
  F<n> (lines <n>) <subject and action>. <setting>. [MATERIAL]. <framing>.
  Label: "<line>"  Attach: R<n> = <job>

  CLIP <n> (<seconds>, from F<n>)
  Camera: <one move>  0 to <n> s: <...>  <n> to <n> s: <...>
  Fixed: <...>  End: <settled state>  Narration: "<line>"

  SOUND  <ambient line, or none>
  EDIT NOTES  <label overlay, text, narration>
  MISSING: <facts it needed>

example:
  business: sprout
  input: |
    [the skill]

    Script (from the watercolor ad script skill), about 30 s.
    Show plan: build, glazing. Leaf glazes stack until they match the
    pouch's deep forest green. Cold-press, light granulation.
    1 "Your shelf has a tub for every green." Shelf of plain tubs.
    2 "Most of them stopped getting opened." Dusty tub rim, dry brush.
    3 "Here are those greens, one layer at a time." One pale kale leaf.
    4 "Kale. Spinach. Spirulina. Broccoli. Wheatgrass." THE TURN.
    5 "Sixty-plus ingredients, twenty-one vitamins and minerals, six
      grams of fiber." The pouch where the layers meet.
    6 "In one pack you tear and eat." Hand, torn daily pack, bears.
    7-8 Offer and close, held on the pouch.
    Product photos attached: pouch and one daily pack. Pouch: glossy
    deep green, "Sprout" in big yellow letters, yellow bear face top
    right, "28 Daily Packs" at the bottom. Pack torn straight across
    the top only. Video tool: 8-second clips, no sound.
  output: |
    TURN  Build, glazing. Starts on the pale kale leaf in the lower
    centre at line 4; four more leaf glazes land over it; stops settled
    before line 5. Never crosses the pouch, which arrives dry in clip 3.

    MATERIAL SENTENCE
    Transparent watercolor on warm-white cold-press paper with a
    visible tooth, pigment pooling slightly darker at the edge of each
    dried shape, light granulation in the greens, colors kept to
    grey-green, leaf green, yellow-green, blue-green and deep forest
    green, bare paper as the brightest light.

    REFERENCES (make and approve first)
    R1 Pouch. A painted deep forest green stand-up pouch, front on, on
      bare paper, crisp hard edges, a small yellow bear face top right.
      [MATERIAL]. Flat and square to the sheet. Label: "Sprout" in
      large sunflower-yellow letters; "28 Daily Packs" small at the
      bottom. Attach: pouch photo = shape and colors.
    R2 Hand and pack. A loosely painted adult hand holding a small
      green daily pack torn straight across its top edge, five small
      deep-green gummy bears in the palm. [MATERIAL]. Attach: pack
      photo = the pack.
    R3 Shelf. A painted wooden shelf of plain unlabelled tubs and a
      shaker, empty of people. [MATERIAL].

    START FRAME F3 (lines 3-4)
    A single pale painted kale leaf, still wet and shiny, in the lower
    centre of a sheet of bare paper. [MATERIAL]. Flat and square to the
    sheet, the painting filling the frame.
    Avoid field: photograph, 3D render, plastic, brush, hand, desk.

    CLIP 2 (8 s, from F3)
    Camera: locked-off, square to the sheet.
    0 to 4 s: the pale kale leaf dries from shiny to matte.
    4 to 7 s: four thin see-through green layers spread over it one
    after another, each shaped like a leaf (spinach, blue-green
    spirulina, broccoli, wheatgrass); where they overlap, the color
    deepens toward forest green.
    7 to 8 s: the last wet edge stops and dries matte.
    Fixed: the paper and every dry shape.
    End: a deep green stack of leaves, settled.
    Narration: "Here are those greens, one layer at a time. Kale.
    Spinach. Spirulina. Broccoli. Wheatgrass."

    SOUND  None. The tool makes no sound; record the narrator
    separately.
    EDIT NOTES  If "Sprout" or "28 Daily Packs" comes out wrong in clip
    4, lay the real label from the pouch photo over the held frame.
    Offer as on-screen text on clip 4: $29.99 first order with text
    sign-up. Renews at $49.99 every 4 weeks.
    MISSING: a clear photo of the daily pack's printing for R2.
    (cut for length: the full run also had F1, F5, F6 and clips 1, 3
    and 4)

tweaks:
  - what: Paper
    how: Rough paper with granulation feels earthy. Hot-press is smooth and keeps fine shapes and label letters crisp. Change it in the material sentence and every prompt follows.
  - what: Camera
    how: Locked-off is the default and the safest. Ask for one slow dolly in on the held product shot, never two moves in one clip.
  - what: Clip length
    how: Give your tool's clip length. It resizes the timed steps to fit, still with one change per clip.
  - what: Sound
    how: Say if your video tool makes sound. It adds one ambient line (soft water and paper, a quiet room) and keeps the narrator separate.

judge:
  - The material sentence is word for word the same in every image prompt.
  - Each clip prompt names one camera move and at most one paint change.
  - The turn is written as what wet paint does, never as a brush at work.
  - The product's label lines are short, in quotes, and match your pack.
  - Nothing painted goes beyond your claims and ingredient list.
  - Every frame reads as watercolor on paper, never as a filtered photo.

test:
  - Make R1 (the painted product) and hold it next to your real pack. If a label line is wrong, plan the overlay before making anything else.
  - Make clip 2 and watch the paper. If the grain slides or more than one thing moves, lock the camera and name the fixed parts more plainly.
  - Search every prompt for "brush". There should be none.
  - Show the start frames in order, with no sound, to someone who hasn't read the script. Ask what the paint showed. If they can't say, the turn isn't reading.

improve:
  - Save your approved material sentence in your brand file, so every painted ad uses the same paper and colors.
  - Keep your approved reference stills and list them in "What you need", so new ads attach them from the start.
  - Add your video tool and its clip length to "Your tools", so the timing fits first time.
  - Add any miss you keep seeing to the fixes table in the skill file, with the change that cured it.
  - Pair it with the skill that writes a watercolor ad script, if you don't have a script yet.

terms:
  - term: Material sentence
    meaning: One fixed sentence describing the paper, paint, texture, colors and light, pasted word for word into every image prompt.
  - term: Start frame
    meaning: The approved still a video tool animates from. The clip prompt then describes only what moves.
  - term: Locked-off camera
    meaning: A camera that stays perfectly still for the whole clip.
