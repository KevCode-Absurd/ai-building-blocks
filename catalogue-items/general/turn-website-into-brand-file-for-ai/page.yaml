new_slug: turn-website-into-brand-file-for-ai
name: "Teach AI your brand, straight from your website"
summary: "Give it your website address. You get eight plain files of your facts, offers, buyers and voice, each fact sourced."
job: brand-file

headline: "Teach AI your brand, straight from your website"
subhead: Give it your website address, plus reviews and past results if you have them. It reads the site, checks the basics with you once, asks only what the site can't answer, and writes eight files where every fact says where it came from.

explain: |
  Every time you ask an AI to write an ad, a page or an email, it starts from nothing. You paste the same facts again, it guesses the rest, and the guesses creep into your copy as prices you don't charge and claims you can't make.

  This skill builds your brand file once, for any online business: a store, an app, a software tool, a service or a course. It's one folder of eight files covering what you sell, who buys and why, what you can claim, how you sound and look, your market, and a log of changes and results. Every fact carries a tag (confirmed, inferred, disputed or unknown), so your AI can tell a checked fact from a guess. The start file is short enough to paste into the instructions box of a Claude project, a ChatGPT project or a Gemini Gem. The other seven go in as the project's files.

when:
  - You use AI for marketing and keep pasting the same background into every chat.
  - You're starting work with a new writer, designer or agency and want them reading the same facts as you.
  - Your website is the only place your business facts are written down, and you want them in one tidy folder.

you_give:
  - Your website address
  - Your about text and price list, if the site can't be read (optional)
  - Customer reviews, survey answers or support emails (optional)
  - Past results from ads, emails or offers (optional)
you_get:
  - A folder of eight plain files, from a start file for your AI to a claims list and a change log
  - A tag on every fact saying whether it's confirmed, inferred, disputed or unknown
  - A two-sentence diagnosis of your biggest gap, at the top of the start file
  - A list of what's still unknown and who can answer it

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. A tool that can read websites works best.
  - Give it your website address. If it can't read the site, paste your about page and your price list instead.
  - Check the fact sheet it shows you and correct anything wrong.
  - Answer the questions you can and skip the rest. Pasting real reviews makes the buyer profiles much better.
  - Paste 00-start-here.md into your AI project's instructions and add the other files. When something changes, edit the file, add a line to log.md and upload it again.

how_it_works:
  - title: Reads the site
    text: Reads the pages every business has (home, about, pricing, FAQ, policies), then the ones your kind of business has, such as product pages, help docs or case studies.
  - title: Tags every fact
    text: Marks each fact confirmed (with the page and date), inferred, disputed or unknown.
  - title: Checks in once
    text: Shows you a short fact sheet and waits for your corrections before writing anything.
  - title: Asks the most-needed questions
    text: At most five, one at a time, each skippable, ranked by how many later tasks need the answer.
  - title: Maps your market
    text: Lists the options buyers weigh, including doing nothing, and 3 to 5 competitors with their pitch, prices and the gap they leave.
  - title: Writes eight files
    text: Puts only tagged facts in. A blank says what would fill it and who can answer.
  - title: Checks its own work
    text: Makes sure prices and offers match across files, every claim sits in the claims list, and buyer profiles without real quotes are marked as inferred.

output_shape: |
  brand-file/
    00-start-here.md        <the business in five lines, diagnosis, house
                             rules for any AI, which file for which task>
    business.md             <one line, category, stage, positioning,
                             story, promise>
    offers.md               <each offer: price and billing, how it works,
                             what it replaces, policies, buyer questions>
    customers.md            <buyer profiles with real quotes, or tagged
                             inferred>
    proof-and-claims.md     <claims list with status and proof, the
                             guarantee word for word>
    voice-and-look.md       <voice traits and scales, tone by situation,
                             colours, fonts, images, brand world>
    market.md               <options buyers weigh, competitors, open
                             ground>
    log.md                  <recent changes, decisions, graded results,
                             open questions>

  SUMMARY
  Disputed: <n, and which>
  Buyer profiles grounded: <n of n>
  Still unknown: <field>, who can answer it: <person>

example:
  business: sprout
  input: |
    [the skill]

    Website: sprout.example

    (Check-in) Fact sheet looks right.
    (Questions, one at a time)
    1 Proof for "1M+ customers" and the 4.8 rating? Skip.
    2 What's live right now? The $29.99 first box with text sign-up.
    3 Customer words? Here are 20 public reviews (sprout/reviews.md).
    4 Past results? Here are our 15 live headlines (sprout/ads.md).
      No numbers.
    5 Who may appear in content? A paid former pro athlete only.
    Competitors: your list of five is right, go ahead.
  output: |
    CHECK-IN
    Sprout | daily greens gummies in single-serve packs | greens gummy
    supplement | established [inferred: sold in big-box stores] |
    Adults, Kids, limited flavours, an electrolyte pack, merch |
    forest green #00582D [confirmed: home and product pages,
    13 Oct 2026]
    > You: looks right

    --- 00-start-here.md (top) ---
    Diagnosis: Buyers already know the problem and have tried powders
    and pills; the gut-fix seeker feels it most. The ads lead with
    money off, while buyers talk most about finally sticking with a
    supplement, which only 2 of the 40 newest ads use.
    House rules: claims come only from proof-and-claims.md. Never use
    an [inferred] or [unknown] fact as true. Every "supports" claim
    stays "supports".

    --- offers.md (excerpt) ---
    Sprout Original (Adults), Low Sugar, 28 packs
      One-time $66.65 ($2.38/day). Subscribe $49.99 every 4 weeks
      [confirmed: product page, 13 Oct 2026]
      First order $29.99, only with the text sign-up discount
      [confirmed: footer small print]
      Discount stated six ways: 52%, 55%, up to 55%, 49%, 58%, and 61%
      in ads [disputed]
    Guarantee, word for word: "This policy applies only to your initial
      purchase." 30 days, first order [confirmed: FAQ]

    --- customers.md (excerpt) ---
    1 The quitter who wants to stick (about 40%, estimated from reviews)
      [inferred share]
      Quotes: "[Sprout] has been the one thing I've been able to stick
      to." (R1) / "I've been choking on [a big-name greens powder] for
      the last few years" (R4)
      Pushed by: chalky powders, pills they forget. Nearly stopped by:
      "A gummy can't hold enough." Tried before: greens powders, pill
      stacks.
    4 The price doubter (share unknown)
      Quotes: "They are expensive" (retailer), "I hate subscriptions
      because I feel like they are a trap" (R17)
      Open question: what do people who nearly bought say?

    --- proof-and-claims.md (excerpt) ---
    "Supports digestion and gut health" | approved | on the label |
      product page, 13 Oct 2026 | as written, never "fixes"
    "1M+ customers" | pending | none on file | product page |
      [unknown: founder]
    "Fix the Hot Girl Tummy" | banned | none | live ad | reads as a
      treatment claim

    --- log.md (excerpt) ---
    Results
    "'Sprout is too expensive': here's 61% off to prove otherwise"
      offer-led, price doubter, 15+ copies live. Grade: seen running.
      Result [unknown: whoever runs the ad account]

    SUMMARY
    Disputed: 4 (the discount, "20+" against 21 vitamins and minerals,
    the star rating, the Kids renewal price)
    Buyer profiles grounded: 4 of 4 (the price doubter only just)
    Still unknown:
    - Grams of sugar per pack (founder)
    - Which discount is the real one (founder)
    - Source for "1M+ customers" and the 4.8 rating (founder)
    - Ad results with real numbers (whoever runs the ad account)
    Next: run the founder interview to fill these.

tweaks:
  - what: Your answers
    how: Each answer replaces an unknown. Pasting 20 or more real reviews is the biggest upgrade, because it turns inferred buyer profiles into ones built on real words.
  - what: Pages it reads
    how: Point it at specific pages if your site is big ("read the homepage, /pricing and these three product pages"). For an online store, the store add-on adds collections, policies, product photos and a truth sheet per product.
  - what: Competitors
    how: Name the competitors you care about instead of letting it search. You'll get a sharper market file and fewer irrelevant names.
  - what: Results
    how: Paste an export with real numbers. Without numbers, every result in the log is graded "seen running" or "reported", which is honest but less useful.

judge:
  - Every price in the files matches your price list exactly.
  - Every fact carries a tag, and every confirmed fact names its page or person.
  - Every customer quote is something a real customer wrote, with where it came from. Profiles without quotes say inferred.
  - Two pages that disagree are both recorded and tagged disputed, never quietly picked.
  - The diagnosis at the top of the start file names one specific gap you recognise.

test:
  - Check the prices first. Compare three offers line by line with your price list; any rounding or a missing offer means it read an old or wrong page.
  - Run it on a site where you know two pages disagree, such as an old discount. Both versions should be there, tagged disputed.
  - Search the files for "[inferred]". Each one should be something you can't find stated on your site.
  - Start a fresh project, load only the folder, and ask for one ad. If your AI asks for something the folder should hold, fill that blank.

improve:
  - Edit the page list in step 1 to name the pages that matter on your site, so it never skips them.
  - Add your own house rules to the 00-start-here.md row (claims you never make, words you never use), so every tool that loads the folder follows them.
  - Keep log.md current. Add a dated line every time a price, offer or product changes, so later tasks don't use old facts.
  - Re-run step 7 after big edits, to catch prices or claims that no longer match across files.
  - Pair it with a skill that interviews the founder to fill the unknowns only they can answer, and with one that turns the folder into a printable guide for designers.

terms:
  - term: Brand file
    meaning: One folder with your facts, offers, buyers, claims, voice and history, which any AI or person can read before working for you.
  - term: Tag
    meaning: A short label on each fact saying whether it's confirmed (with its source), inferred, disputed or unknown.
  - term: Claims list
    meaning: Every claim you might make, marked approved, pending or banned, with the proof behind it.
  - term: Buyer profile
    meaning: A short description of one kind of buyer, what they want and what makes them hesitate, built on their own words where possible.
