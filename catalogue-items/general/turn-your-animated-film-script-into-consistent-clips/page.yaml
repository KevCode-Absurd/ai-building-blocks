new_slug: turn-your-animated-film-script-into-consistent-clips
name: "Turn your animated-movie script into video clips"
summary: "Give it your script and product photo. You get image and clip prompts with the same characters, light and look throughout."
job: make-video-ads

headline: "Turn your animated-movie script into video clips"
subhead: Give it an approved script and your product photo with its exact label words. It plans the light for each part of the story, writes a casting card per character, then writes still prompts, clip prompts and cuts for your AI image and video tool.

explain: |
  The 3D animated-film look is easy to start and hard to hold. Over a few clips the faces turn toy-like, a character changes between shots, the light jumps around inside one moment, and the label on your pack turns to gibberish.

  This skill holds the look by repeating three things without change. A light key for each part of the story, so every shot of the same moment is lit the same way. A casting card for each character, pasted in the same words every time. A short look line at the end of every prompt. Each shot is written in one fixed order (who, what they do, where, camera, light, look), and your product's photo and label words go into every shot it appears in. When a shot misses, it reruns, simplifies, then changes one thing.

when:
  - You have a script written for the animated-feature look and need prompts for an AI tool.
  - Your animated clips keep drifting into a cartoon or changing the character.
  - Your product's label keeps coming out wrong in generated shots.

you_give:
  - The approved script and its scenes
  - A real product photo and every line of label text
  - How the product is used
  - The buyer's moment, your brand's light and approved claims (optional)
  - Your video tool's clip lengths and reference limits (optional)
you_get:
  - A light plan with one key per story part
  - A look line and a casting card for each character
  - A list of places, with a still prompt for each empty place
  - Still prompts and clip prompts in a fixed order, with cuts planned

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the approved script, ideally from "Get a warm animated film ad script".
  - Attach your product photo and type out every line of the label.
  - Make the casting stills and place stills first, then the first frame of each shot. Approve each before any clip.
  - If a still misses, rerun the same prompt once before you change any words.

how_it_works:
  - title: Plans the light first
    text: One light key per part of the story, used word for word in every shot of that part.
  - title: Writes a look line and casting cards
    text: A short line for the render and a fixed description per character, never more than two people a shot.
  - title: Lists the places
    text: Each room with its fixed landmarks and where the light comes in, made once as an empty still.
  - title: Writes shots in one order
    text: Who, what they do in countable beats, where, camera, light key, then the look line.
  - title: Keeps the product exact
    text: Attaches the photo and types each label line with its colour, with a hand or mug for size.
  - title: Plans cuts and retakes
    text: Each join cuts on an action, a look, a close-up or a time change. Misses are rerun, simplified, then changed one thing at a time.

output_shape: |
  LIGHT PLAN
  <part 1>: <source, colour, shadows>
  <part 2>: <...>   <part 3>: <...>

  LOOK     <one line, at the end of every prompt>
  CASTING  <name>: <age, build, face, hair, clothes, item>
  PLACES   <room, landmarks, where light enters>

  STILL <n>  <subject>. <action>. <place>. <camera>. <light key>.
             <look line>. Attach: <image> = <its job>

  CLIP <n>   From still <n>. <action beats>. <camera move>.
             Dialogue: <speaker>: <line>
             Cut out: <on the action / on a look / insert / time cut>

example:
  business: sprout
  input: |
    [the skill]

    Script: the 28-second narrated script from "Get a warm animated
    film ad script". Parts: And (hallway, lines 1 and 2), But
    (kitchen, lines 3 and 4), Therefore (front door, lines 5 to 7).
    Light keys as given in the script.
    Casting: a stylised animated woman, late thirties, slim, dark
    curly hair tied up, rust jumper, canvas tote on her left
    shoulder.
    Photos: [pouch front] [daily pack in a hand] [gummies in a palm]
    Pouch label: big yellow wordmark "Sprout" on glossy deep green,
    yellow bear face top right, "28 Daily Packs" at the bottom.
    Daily pack label words: not captured.
    Tool: 8-second clips, 2 reference images.
  output: |
    LIGHT PLAN
    And: soft grey daylight through the front-door glass, gentle
      shadows.
    But: flat overhead kitchen light, cool, busy shadows.
    Therefore: low warm sun through the open front door, long soft
      shadows.

    LOOK     stylised 3D animated feature, real-looking light on
             designed shapes, true fabric, wood and foil, shallow lens.
    CASTING  Mum: a stylised animated woman, late thirties, slim,
             oval face, dark curly hair tied up, rust jumper, canvas
             tote on her left shoulder.
    PLACES   1 Hallway: front door at frame right with a glass panel,
               a small table with a bowl by the door.
             2 Kitchen: counter along the back wall, sink at left,
               wall clock above the sink.

    STILL 3 (line 3, first frame)  Mum. Stands at the sink, eyes on
      a used shaker lying in it, shoulders starting to drop. Kitchen,
      a plain unlabelled tub of green powder on the counter. Medium
      shot, eye level, focus on her face and the shaker. Flat
      overhead kitchen light, cool, busy shadows. [LOOK]
      Attach: casting still = face, hair and clothes only.

    CLIP 3 (5 s, line 3)  From still 3. Beats: her shoulders drop,
      she breathes out, two fingers nudge the shaker aside. Camera
      holds still. Dialogue: Narrator: But the powder wants a scoop,
      a shaker and a rinse.
      Cut out: on the action (her hand reaches for her keys).

    STILL 5 (line 5, first frame)  Mum. Her right hand lifts one
      daily pack from the bowl by the door. Hallway, door open. Close
      shot on her hand and the bowl, slightly high angle. Low warm
      sun through the open front door, long soft shadows. [LOOK]
      Attach: daily pack in a hand = shape, size and grip. Pack front
      turned toward her palm (label words MISSING).

    CLIP 7 (3 s, line 7)  From still 7. Beats: she turns the pouch
      so its front faces camera, then holds. Camera holds still.
      No dialogue. Attach: pouch front = yellow "Sprout" wordmark on
      deep green, bear face top right, "28 Daily Packs".

    (cut for length: the full run also had the casting and place
    still prompts, stills and clips for lines 1, 2, 4 and 6, and a
    cut list)

    MISSING: the daily pack's own label words. Its front stays
    turned away until they're supplied.

tweaks:
  - what: Light keys
    how: Name your brand's light ("bright and sunny, never gloomy") and the turn's key is built from it. The snag's key stays the least kind of the three.
  - what: Clip limits
    how: Give your tool's clip lengths and reference slots. It splits long actions across clips and attaches only the images each shot needs.
  - what: Inside views
    how: If your brand file says how the product works, it adds a cutaway with no people, showing only the parts you name.
  - what: An animal lead
    how: Say the lead is an animal and the casting card describes the animal, with "stylised animated" in front of it.

judge:
  - Every shot in the same story part has the same light key, word for word.
  - The look line and casting cards never change between prompts.
  - No shot has more than two people in it.
  - Every prompt with the product spells out each label line, or says MISSING.
  - No studio, film or character names anywhere.

test:
  - Line up the light keys across all still prompts. They should change only where the story part changes.
  - Make the casting still and two shots from different parts. The character should match in both.
  - Check every product shot for the attached photo and typed label words.
  - Run one still prompt twice before rewriting it. If both come out toy-like, simplify the shot before blaming the words.

improve:
  - Once your look line works, paste it into step 2 of the skill file, so every ad starts from tested wording.
  - Add your label lines with their colours to "What you need".
  - Save approved casting cards in your brand file and reuse them across ads.
  - Pair it with a skill that writes an animated film ad script first, and one that adds captions in your brand font afterwards.

terms:
  - term: Light key
    meaning: One line describing the light for a part of the story, used for every shot in that part.
  - term: Casting card
    meaning: A short, fixed description of a character, pasted the same way in every prompt.
  - term: Insert
    meaning: A close-up of a detail, such as hands or the product, cut into a scene.
  - term: Cutaway
    meaning: A view that shows the inside of something, as if part of it were cut away.
