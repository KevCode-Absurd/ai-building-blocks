new_slug: turn-your-animated-film-script-into-consistent-clips
name: Turn your animated film script into consistent clips
summary: Still and clip prompts for an animated-feature look, with fixed characters and your exact label.
job: make-video-ads

headline: "Turn your animated-film script into matching clips"
subhead: Give it an approved script and your product photo with its exact label words. It writes three fixed wording blocks for the look, one full description per character, then the still prompts, clip prompts and transitions for your AI image and video tool.

explain: |
  The animated-feature look (stylised people, real-looking light, every frame like a film still) is easy to start and hard to hold. Over a few clips the faces turn toy-like, characters change between shots, people appear in product close-ups, and the label on the pack turns into gibberish.

  This skill holds the look with fixed wording. It writes three fixed blocks (the look, the cast and the framing) and pastes them unchanged into every prompt. Each character is described in full every time and made once as a solo picture that's attached to every shot. The product's photo goes into every shot it appears in, with each label line written out. Clips get one motion action each, and scene changes use one of three named transitions.

when:
  - You have a script written for the animated-feature look and need prompts for an AI tool.
  - Your animated clips keep drifting into a cartoon or changing the character.
  - Your product's label keeps coming out wrong in generated shots.

you_give:
  - The approved script and list of scenes
  - A real product photo and every line of label text
  - How the product is really used
  - The buyer's moment, colours and approved claims from your brand file (optional)
  - Your video tool's clip lengths and reference limits (optional)
you_get:
  - Three fixed wording blocks to paste into every prompt
  - Full character descriptions and a list of places
  - Still prompts in a set order, with attached images named by job
  - Clip prompts and transition prompts

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste the approved script, ideally from "Get a warm animated film ad script".
  - Attach your product photo and type out every line of the label.
  - Make the solo character picture first, then the first frame of each scene, and approve each before any clip.
  - If a still misses, run the identical prompt again before you change any words.

how_it_works:
  - title: Writes three fixed blocks
    text: The look, the cast and the framing, written once and pasted unchanged into every still prompt.
  - title: Designs the characters
    text: Original adults built for your buyer, each made once as a solo picture and attached to every shot.
  - title: Builds the places
    text: Each place from the buyer's moment, written as a film set the camera stands inside.
  - title: Writes each still
    text: Full character description, one subject, one action, and the feeling written as what the face does.
  - title: Keeps the product exact
    text: Attaches the photo and writes out each label line with its colour, every time it appears.
  - title: Writes clips and transitions
    text: One motion line, one action and one speaker per clip, and one named transition between scenes.

output_shape: |
  FIXED BLOCKS (paste unchanged)
  LOOK:  <light, materials, film colour, stylised shapes>
  CAST:  <proportions, faces, eyes, skin, hair, clothes>
  FRAME: <composed like a film still, camera inside the scene>

  CHARACTER  <full description, repeated in every prompt>
  PLACES     <each place as a film set>

  STILL <n>  [LOOK] [CAST if people] <scene> [FRAME]
             Attach: <image> = <its job>

  CLIP <n>   <motion line>. <one action>. <speech and speaker>.
             <camera move>. End: <state>

  TRANSITION <scene> > <scene>: <one action> + motion line

example:
  business: sprout
  input: |
    [the skill]

    Script: the 30-second narrated script from "Write a 3D animated
    film ad script". Line 1: hallway, she holds keys and a school
    bag strap, tired. Line 2: focus shifts from the shaker on the
    counter to her. Line 3: she takes a daily pack from a bowl.
    Line 4: tears it across the top, tips gummies into her palm.
    Line 5: she eats, shoulders drop. Line 6: held at the front door
    with the pouch. Narrator only.
    Character: a stylised animated woman, about 38, slim build, dark
    brown hair in a loose bun, mustard cardigan over a white tee,
    canvas tote.
    Photos: [pouch front] [daily pack in a hand] [gummies in a palm]
    Pouch label: big yellow wordmark "Sprout" on glossy deep green,
    yellow bear face top right, "28 Daily Packs" at the bottom.
    Daily pack label words: not captured.
    Handling: daily pack torn straight across the top edge only.
    Tool: 10-second clips, 2 reference images.
  output: |
    FIXED BLOCKS
    LOOK:  a frame from a high-end 3D animated feature film,
           real-world light, accurate reflections, true fabric weave,
           wood grain and foil, film colour, shallow lens, on
           designed stylised shapes.
    CAST:  stylised adults about six heads tall, refined faces with
           a clear cheekbone and jaw, slightly enlarged expressive
           eyes with detailed irises, soft skin, groomed hair
           strands, clothes that fold like real fabric, clearly
           animated, feature-film finish.
    FRAME: composed like a film still, camera inside the scene,
           the scene filling the frame.

    CHARACTER  a stylised animated woman, about 38, slim build, dark
               brown hair in a loose bun, mustard cardigan over a
               white tee, canvas tote on her left shoulder.
    PLACES     1 a narrow sunlit hallway, front door at the right, a
               small table with a bowl of daily packs.
               2 the kitchen counter seen through the doorway.

    STILL 1 (solo character)  [LOOK] [CAST] [CHARACTER], standing,
      neutral face, plain warm-grey background. [FRAME]
    STILL 2 (line 1 first frame)  [LOOK] [CAST] [CHARACTER] in the
      hallway, keys in her right hand, a school bag strap in her
      left. Feeling: worn out. Brows pinched together, mouth a flat
      line, shoulders raised. Morning sun from the left. [FRAME]
      Attach: still 1 = who she is.
    STILL 4 (line 4)  [LOOK] [FRAME] Close on two stylised hands
      tearing a daily pack straight across its top edge, small
      opaque deep-green gummy bears tipping into the left palm.
      No face in frame. Attach: daily pack in a hand = shape and
      grip; gummies in a palm = the gummies.

    CLIP 2 (line 2)  Smooth feature-quality 3D animation with natural
      weight and restrained acting. Focus shifts from the shaker on
      the counter to her in the doorway; she holds still.
      Narrator: "Your greens powder? Still on the counter."
      End: she's sharp in the doorway, shaker soft.
    CLIP 6 (line 6)  Smooth feature-quality 3D animation with natural
      weight and restrained acting. She stands at the open door and
      turns the pouch so its label faces the camera, then holds.
      Narrator: offer line. End: held pose, label readable.
      Attach: pouch front = label "Sprout", yellow bear face top
      right, "28 Daily Packs".

    TRANSITION line 1 > line 2: camera-led. The camera pushes past her
      shoulder into the kitchen as focus moves to the shaker.

    MISSING: the daily pack's label words. Still 4 keeps the pack
    side-on until they're supplied.
    (cut for length: the full run also had stills 3, 5 and 6 and
    clips 1, 3, 4 and 5)

tweaks:
  - what: Clip limits
    how: Give your tool's clip lengths and how many reference images it takes. It keeps one motion action per clip and attaches only the images each shot needs.
  - what: How-it-works shots
    how: If your brand file says how the product works, it adds a macro shot with no people showing it mid-action, only as far as your wording goes.
  - what: Transitions
    how: Ask for a camera-led, world-led or match-cut move between two scenes. Each one names a single shared object and one visible action.
  - what: An animal lead
    how: Say the lead is an animal and it drops the cast block and describes the animal in the scene instead.

judge:
  - The three fixed blocks are word for word the same in every still prompt.
  - Product-only and how-it-works prompts have no cast block, so no people appear.
  - Every prompt with the product spells out each label line, or says MISSING.
  - The character's full description appears in every prompt they're in.
  - No studio, film or character names anywhere.

test:
  - Compare the three fixed blocks across every still prompt. They should be word for word the same.
  - Make the solo character picture and two stills. The character should look the same in both.
  - Check the product-only prompts. They should have no cast block, so no people appear.
  - Run one still prompt twice before rewriting it. If both come out toy-like, the tool is the problem, not the words.

improve:
  - Once your three fixed blocks work, paste them into step 1 of the skill file, so every ad starts from wording you've already tested.
  - Add your label lines with their colours to "What you need".
  - Save the approved character lines in your brand file and reuse them across ads.
  - Pair it with a skill that writes an animated film ad script first, and one that adds captions in your brand font afterwards.

terms:
  - term: Fixed block
    meaning: A paragraph of wording written once and pasted unchanged into every prompt, so the look doesn't drift.
  - term: Macro
    meaning: A very close shot that makes something small fill the frame.
  - term: Match cut
    meaning: A cut where a shape or gesture in one scene carries straight on into the next.
