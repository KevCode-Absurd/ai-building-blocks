new_slug: turn-your-clay-town-script-into-handmade-looking-clips
name: "Turn your clay-world script into video clips"
summary: "Give it your script and product photo. You get image and clip prompts that look handmade in every frame."
job: make-video-ads

headline: "Turn your clay-world script into video clips"
subhead: Give it a narrated clay-town script and your product photo with its label lines. It writes a set bible like a stop-motion crew's, the reference images to make first, and still and clip prompts with one figure moving at a time.

explain: |
  AI tools can make convincing clay animation, but they slip out of it easily. Faces drift between shots, a crowd turns to mush when everyone moves at once, water comes out photo-real, and the label on your clay pack reads as nonsense.

  This skill plans the shoot the way a stop-motion crew does. It fixes four lines for every prompt: the set (scale, finish, model-maker stand-ins such as clear gel for water), the light, the palette and the lens. It has you make a lead sheet, a crowd sheet, empty sets and the clay product first, and builds every shot from those. Each clip is 2 to 5 seconds with one mover, stepped stop-motion timing for the figures and a smooth camera, the way studios shoot it. Scene changes are chosen on purpose: a cut, a match cut, one clay morph or a pass-by wipe.

when:
  - You have a narrated clay-town script and need prompts for an AI image and video tool.
  - Your clay clips keep sliding into a smooth computer-graphics look, or the crowd falls apart.
  - Your clay product keeps getting the label wrong.

you_give:
  - The narrated script with its shots, set card and cast sheet
  - A real product photo and every line of its label
  - How the product is used
  - Your brand colours and tone (optional)
  - Your video tool's clip lengths and whether it takes a first and last frame (optional)
you_get:
  - A set bible with fixed set, light, palette and lens lines
  - Reference prompts for the lead, the crowd, each empty set and the clay product
  - Still prompts per shot and clip prompts with stop-motion timing and one mover
  - Scene changes, including the frame pair for the one clay morph

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the script, ideally from "Get a clay town ad script with a crowd".
  - Attach your product photo and type out every label line.
  - Make the references first and approve them, then each still, then each clip.
  - Paste the fixed lines exactly as given. Don't shorten them to "same style as before".

how_it_works:
  - title: Writes the set bible
    text: Four fixed lines for the set, light, palette and lens, built from the script's set card and pasted into every prompt.
  - title: Makes the references
    text: A lead sheet, a crowd sheet of base figures, each place empty, and the clay product with its printed paper label.
  - title: Writes each still
    text: Camera, subject, action, place, then the fixed lines. The lead's full description goes in every shot they're in.
  - title: Keeps one mover
    text: Only the figure the script names moves. Everyone else holds or does one small repeat, like a blink.
  - title: Writes short clips
    text: 2 to 5 seconds, counted beats, stepped stop-motion timing for figures, a smooth camera and a hold line.
  - title: Chooses scene changes
    text: A cut by default, a match cut, a pass-by wipe, or one clay morph at the swap built from a first and last frame.

output_shape: |
  SET BIBLE
  SET      <scale, finish, materials, stand-ins, photographed on a set>
  LIGHT    <key and its direction, fill, any lamps in the set>
  PALETTE  <3 to 5 colours>
  LENS     <shallow focus, camera height inside the world>

  REFERENCES
  Image <n> (<job>): <prompt>

  STILL <shot>  (attach: <image> = <job>)
  <camera>, <figure, one held pose>, in <place>, <props>.
  [SET] [LIGHT] [PALETTE] [LENS]

  CLIP <shot>  <seconds>, start frame: still <shot>
  [MOTION] Beat 1 <...>. Beat 2 <...>. Camera: <one instruction>.
  [HOLD]

  SCENE CHANGE  <shot> > <shot>: <cut / match cut / morph / wipe>
  MISSING: <anything the inputs didn't give>

example:
  business: sprout
  input: |
    [the skill]

    Script: the 10-line office-sink script from "Get a clay town ad
    script with a crowd". Places: the office kitchen (lines 1 to 4),
    Dev's desk (lines 6 to 10). Line 5 is the morph: the shaker in
    Dev's hand squashes into a flat daily pack.
    Set card: figures a hand tall, chunky props, handled finish,
    water as clear gel, soft morning key light from a window.
    Lead: Dev, a clay adult man, about 30, slim, warm brown clay
    skin, short black clay hair with comb grooves, a mustard knit
    jumper of real fabric, navy clay trousers, a lanyard.
    Crowd: four base figures (tall, short, round, slight).
    Photos: [pouch front] [daily pack in a hand]
    Pouch label: big yellow "Sprout" wordmark on deep green, yellow
    bear face top right, "28 Daily Packs" at the bottom.
    Daily pack label words: not captured.
    Colours: forest green #00582D, warm cream #FFF7DF, sunflower
    yellow #FFCC2E. Tool: 5-second clips, first and last frame: yes.
  output: |
    SET BIBLE
    SET      A handmade stop-motion miniature set, figures about a hand
             tall, some thumbprints on matte modelling clay, felt and
             real woven fabric, chunky oversized props, running water
             as clear gel, photographed on a real tabletop set with a
             macro lens.
    LIGHT    One soft key light from a window on the left, a gentle
             fill from the right, bright morning.
    PALETTE  Forest green, warm cream, sunflower yellow, mustard, navy.
    LENS     Shallow focus, subject sharp, background softly blurred,
             camera inside the miniature world at clay chest height.

    REFERENCES
    Image 1 (Dev): Dev, a clay adult man, about 30, slim, warm brown
      clay skin, short black clay hair with comb grooves, a mustard
      knit jumper of real fabric, navy clay trousers, a lanyard. Front
      and three-quarter views on a plain cream backdrop. [SET] [LIGHT]
    Image 2 (crowd): four clay office workers side by side, one tall,
      one short, one round, one slight, each a distinct sculpted face,
      real fabric office clothes. [SET] [LIGHT]
    Image 3 (kitchen): an empty clay office kitchen, one sink, a
      counter, a plain clay clock with a blank face. [SET] [LIGHT] [LENS]
    Image 4 (pouch): the Sprout pouch sculpted in clay at its true
      shape, deep green, wrapped in a printed paper label reading
      "Sprout" in big yellow letters, a yellow bear face top right,
      "28 Daily Packs" at the bottom. [SET] [LIGHT]

    STILL 3  (attach: image 1 = Dev, image 3 = the kitchen)
    Medium at clay chest height, Dev, a clay adult man, about 30,
    slim, warm brown clay skin, short black clay hair with comb
    grooves, a mustard knit jumper of real fabric, navy clay trousers,
    a lanyard, slumped on the counter with elbows wide, eyes on the
    blank clock, a clay shaker held low, in the kitchen, two soft
    queue figures behind. [SET] [LIGHT] [PALETTE] [LENS]

    CLIP 3  4.5 s, start frame: still 3
    Stop-motion timing: the figures move in small stepped poses,
    about 12 new poses a second, with a faint shimmer of fingerprints
    between poses. The camera moves smoothly. Beat 1 Dev's eyes lift
    to the clock. Beat 2 his shoulders sink. Beat 3 he holds. The
    queue behind holds still. Camera: locked off.
    HOLD: Same figures as the references. Every surface stays clay,
    felt or fabric. Mouths stay still. Labels stay as printed.

    SCENE CHANGE 4 > 5: morph, built as a frame pair.
    First frame: close on Dev's clay hand holding the clay shaker.
    Last frame: the same hand and camera, holding a flat clay daily
    pack seen from its top edge, no label in view.
    Clip prompt: the clay shaker squashes down and flattens into the
    daily pack in a few stepped poses. [MOTION] [HOLD]
    SCENE CHANGE 7 > 8: match cut. Dev at his desk on the same spot
    in frame, the queue now soft behind him.

    MISSING: the daily pack's label words. It is shown from its top
    edge in shots 5 and 6 until they're supplied.
    (cut for length: the full run also had set plate for the desk,
    stills and clips for shots 1, 2, 4 and 6 to 10)

tweaks:
  - what: The finish
    how: Crisp gives fine tool lines for a premium feel. Handled adds some thumbprints. Rough gives big prints and lumpy shapes for a silly brand. The SET line changes with it.
  - what: The palette
    how: Give your brand colours and the set is built around them. Without them it proposes three to five colours and marks them "proposed".
  - what: Scene changes
    how: Ask for a cut, a match cut or a pass-by wipe between shots. Keep the clay morph for the one moment that matters, usually when the product arrives.
  - what: Clip length
    how: Give the shortest clip your tool makes well. Clips of 2 to 5 seconds with one action hold the clay look far better than long ones.

judge:
  - The set, light, palette and lens lines are word for word the same in every prompt.
  - The lead's full description appears wherever they do.
  - Every clip names one mover, and everyone else holds still.
  - The label lines are written out exactly, and nothing else on the set has words.
  - There's at most one clay morph, built from a first and last frame.

test:
  - Make the lead sheet and two stills. If Dev's face differs between them, fix the lead description before making clips.
  - Make one clip and watch the background. If the crowd moves when it shouldn't, strengthen the "holds still" line and remake it.
  - Compare the label in a still with your real pack, word by word.
  - Watch one clip at full size. If it looks like smooth computer graphics, check the motion line is there word for word.

improve:
  - Write your chosen finish and palette into step 1 of the skill file, so every clay ad you make matches.
  - Save the lead sheet and crowd sheet with your brand files, so the same figures can come back in the next ad.
  - Add your product's label lines and "never show" list to "What you need", so the product reference is right first time.
  - Pair it with the skill that writes a clay town ad script first, and one that adds captions in your brand font afterwards.

terms:
  - term: Set bible
    meaning: Four fixed lines (set, light, palette, lens) pasted into every prompt so all shots look like one set.
  - term: Mover
    meaning: The one figure or object that moves in a shot. Everyone else holds still.
  - term: First and last frame
    meaning: Two images you give a video tool so it makes the motion between them. Used here for the clay morph.
