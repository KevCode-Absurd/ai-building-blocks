new_slug: turn-your-products-hidden-process-into-3d-clips
name: "Turn your 3D ad idea into video clips"
summary: "Give it your product facts and sources. You get honest story options, then a 3D explainer plan, prompts and captions."
job: make-video-ads

headline: "Turn your 3D ad idea into video clips"
subhead: Give it your product facts with sources and your claims list. It tests which hidden process is true and worth teaching, offers 2 or 3 story options and waits for your pick. Then it plans a 3D film that dives from an everyday moment into the process and back out.

explain: |
  A short 3D explainer about something nobody can see (what an ingredient does, how a fabric handles sweat) can hold attention like a good science film. Most attempts fail one of two ways. They bend a claim to fit a dramatic picture, or the "lesson" is a sales pitch in disguise and viewers can tell.

  This skill starts by testing the process. It writes each candidate as a short chain of links ("this meets that, that happens, so you get this") and marks every link as sourced, common knowledge or unsupported. A chain survives only if it's hidden from a camera, true at every link, and teaches something a viewer could sketch afterwards. Then it offers story options and stops so you can choose. The film it plans has four movements: the everyday moment, one long dive down to where the process happens, the chain link by link, and back out to the same moment. Your product appears at the link where it acts, and each part of the process keeps one colour all the way through.

when:
  - Your product's benefit is invisible and you want to know if there's an honest story to tell about it.
  - You want to compare story options before paying for any video.
  - You've picked a story option and need the stills, clips, captions and voice brief.

you_give:
  - Your product, clean pack photos and how it's used
  - How it works, step by step, each step with a source
  - Your approved and banned claims, and what buyers assume
  - Your colours, font and a voice you have the right to use (optional at first)
  - Your video tool's clip lengths (optional)
you_get:
  - Candidate chains with every link marked, and which survived
  - Honesty notes, including anything a regulator might look at
  - 2 or 3 story options to choose from, each a whole film in 80 words or fewer
  - After you choose, a four-movement film plan, a colour key, still and clip prompts, captions and a voice brief

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product facts, with the source for each claim, and your banned claims.
  - Read the chains and honesty notes first. If nothing survives, it will tell you to use another format.
  - Pick one story option and reply with its letter.
  - If your product has claim rules (supplements, skincare), get the script checked before any picture is made.

how_it_works:
  - title: Runs three tests
    text: Hidden from a camera, true at every link, and worth teaching even without your brand name.
  - title: Writes candidate chains
    text: Looks at the tiny, the surface and the structure, writes each process as 2 to 4 links, and marks every link.
  - title: Sets honesty rules
    text: 'Only "supports" or "helps". No body before and after, numbers only with sources.'
  - title: Offers options, then stops
    text: 2 or 3 whole-film options in 80 words or fewer, with risks flagged, and waits for your choice.
  - title: Plans four movements
    text: The everyday moment, one long dive down, the chain link by link, then back out to the same moment.
  - title: Colour-codes the parts
    text: Each part of the process keeps one colour and shape all the way through, so the eye can follow it.
  - title: Stills, then clips
    text: Approves the key stills first, then writes clips that start from them, with a voice a person has approved.

output_shape: |
  CHAINS
  <name>: <this> meets <that>, <that happens>, so you get <this>
    Links: <sourced / common knowledge / unsupported, each>
    Tests: hidden <y/n>  true <y/n>  teaches <y/n>   Kept or dropped

  HONESTY NOTES
  - <words, pictures and numbers to avoid, regulator flags>

  STORY OPTIONS (pick one)
  A "<name>": <moment, chain, snag, product's link, closing moment,
     who it suits, 80 words or fewer>. Sources: <...>. Flags: <...>
  B ...

  STOPPED: waiting for your choice. After it: film plan by movement,
  parts key, still and clip prompts, captions, voice brief.

example:
  business: sprout
  input: |
    [the skill]

    Product: Sprout daily greens gummies. Pouch of 28 daily packs.
    Tear a pack straight across the top, eat the gummies.
    Facts and sources (sprout/brand.md):
    - 1 pack: 60+ ingredients, 21 vitamins & minerals, 6 g prebiotic
      fiber (a branded fiber blend, inulin listed). Label.
    - Study 2025: 12 weeks, randomized, double-blind,
      placebo-controlled, 120 healthy adults. Blood vitamin C +40.1%,
      folate +20.5%. Science page.
    - Methylfolate, not folic acid. Science page.
    Approved: "Supports digestion and gut health". "Clinically tested
    for nutrient absorption", with the study and its numbers.
    Risky (brand file): "Gummies begin breaking down almost
    immediately ... fast and efficient bioavailability" (no support).
    "61% of Americans experience weekly digestive issues" (footnote
    only says "Source").
    Buyer assumptions: "A gummy can't hold enough to replace my
    powder." Reviews: people quit gritty, chalky powders.
  output: |
    CHAINS
    1 Fiber as food: 6 g prebiotic fiber meets the bacteria already
      in the gut, they feed on it, so it supports digestion.
      Links: 6 g (label); bacteria feed on prebiotic fiber (common
      knowledge, brand to confirm); "supports digestion" (approved).
      Snag link: the fiber never arrives when the powder tub sits
      unopened (reviews: people quit gritty powders).
      Tests: hidden yes, true yes, teaches yes. KEPT.
    2 Absorption: vitamin C from the pack passes into the blood, and
      blood levels rose 40.1% in the study.
      Links: study (sourced); gut to blood (common knowledge).
      Tests: hidden yes, true yes, teaches no. The only new fact is
      the study result, which is about the brand. DROPPED here; it
      suits a cutout explainer with a two-bar chart.
    3 Fast breakdown: the brand's own line has no support. DROPPED.
    4 Methylfolate: a fact with no sourced chain of what it does. A
      feature, not a process. DROPPED.
    Only chain 1 survived, so both options use it with different
    openings.

    HONESTY NOTES
    - Supplements have claim rules. The brand reads the script before
      any picture is made.
    - Say "supports digestion", never "fixes bloating".
    - The "61%" figure has no source. Leave it out.
    - The gut is a plain tube shape at the small size, never anatomy.
    - Don't show energy or immunity. Nothing here tested them.

    STORY OPTIONS (pick one)
    A "Who's eating breakfast?" Opens on a kitchen table at 7 am,
      then asks who else is having breakfast. Dives into a plain
      tube where tiny stylised bacteria wait. Snag: the fiber never
      arrives, because the gritty powder stays in the cupboard. The
      pack's fiber arrives (yellow strands); they feed. Back out:
      she tears a pack at the door. Suits the gut-health buyer.
      Sources: label, approved claim, common knowledge. Flag:
      "supports" only; brand to confirm the feeding link.
    B "The unopened tub". Opens on a full powder tub with dust on its
      lid, then dives through the lid into the still, sealed powder.
      Same chain from there, ending on a pack torn open instead.
      Suits the powder quitter. Same sources and flags as A.

    STOPPED: waiting for your choice of A or B. After it come the film
    plan, parts key, still and clip prompts, captions and voice brief.

tweaks:
  - what: Your sources
    how: Add a source for each step of how it works. Links marked "common knowledge, brand to confirm" turn into sourced ones and more chains survive.
  - what: Number of options
    how: Ask for three if you have several processes worth testing. It still offers only chains that pass all three tests.
  - what: Your script
    how: Paste an existing script and it runs the tests on it, then builds the film plan from it instead of writing a new one.
  - what: Clip limits
    how: Give your tool's real clip lengths and whether it can start on a chosen image. It keeps the dive as one move only if your tool can join clips cleanly.

judge:
  - Every link in a kept chain is marked sourced or common knowledge, never assumed.
  - At least one chain was dropped, and the reason names the test it failed.
  - The honesty notes name the exact words and pictures to avoid for your product.
  - It stops after the story options and waits for your choice.
  - In the film plan, the product first appears at its own link.

test:
  - Look at the dropped chains. Each should name the test it failed. If every chain survives, your facts may be too thin to test.
  - Check each link in the kept chain against its source.
  - Pick an option and check the film plan follows it, with the dive, the chain and the return to the same moment.
  - Make the surface still, the deepest dive frame and the product's arrival before any clip. The parts key colours should match in all three.

improve:
  - Add your sourced chains to "What you need" in the skill file, so step 2 starts from them instead of hunting from scratch.
  - If your product's process lives at a size not listed in step 2, add it with an example.
  - Write the details of the voice you've recorded or licensed into step 8, so every video uses the same one.
  - Save the chain, the option you chose and the parts key in your brand file.
  - Pair it with a skill that writes only the 3D how-it-works script, when you need the words without the prompts.

terms:
  - term: Chain
    meaning: How something works, written as 2 to 4 linked steps. This meets that, that happens, so you get this.
  - term: Common knowledge
    meaning: Something a school textbook would say, so it doesn't need the brand's own source.
  - term: Parts key
    meaning: A list giving each part of the process one colour and one shape, kept the same in every shot.
  - term: Dissolve
    meaning: A soft fade from one clip into the next.
