new_slug: turn-your-short-film-script-into-consistent-clips
name: "Turn your short-film script into video clips"
summary: "Give it your script and product photo. You get image and clip prompts with the same faces, room and light throughout."
job: make-video-ads

headline: "Turn your short-film script into video clips"
subhead: Give it an approved script with labelled speakers and a real product photo. It plans the scene like a film crew, with a floor plan, lettered camera positions, casting cards and one light recipe. Then it writes shot cards, a log of who holds what, and a retake plan.

explain: |
  AI video can now make photo-real people acting in a room. Across several angles it slips. Faces change, the window jumps to the other wall, two people seem to swap sides, a mug vanishes between shots, and the listener's mouth moves during someone else's line.

  This skill plans the scene the way a small crew would before a shoot. A floor plan says where everyone stands, where the light comes from and where the camera can go, all on one side of the line between the two people. Casting cards and one establishing shot fix faces and the room. Every shot card has one action in countable beats, where people look and what's in focus, with dialogue in its own block. A prop log tracks who holds what. When a shot fails, it reruns, simplifies, then fixes one thing.

when:
  - You have an approved film-style script and need prompts for an AI image and video tool.
  - Your generated shots keep changing faces, rooms or light between angles.
  - Things appear, vanish or swap hands between your shots.

you_give:
  - The approved script with speaker labels and scenes
  - A real product photo and how it's held and used
  - The buyer's moment and your brand's places (optional)
  - Your video tool's clip lengths and reference limits (optional)
you_get:
  - A one-line turn and a floor plan with lettered camera positions
  - Casting cards, an establishing still and a light recipe
  - Shot cards grouped into clips, with dialogue blocks and a prop log
  - A retake plan for any shot that fails

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste the approved script, ideally from "Get a short film ad script with a twist".
  - Attach your product photo and say how it's held and used.
  - Make the casting images and the establishing still first, approve them, then the other camera positions, then the clips.
  - If a shot fails, paste what went wrong and ask for the retake.

how_it_works:
  - title: Finds the turn
    text: Writes the scene in one line (the setup, the snag, what the product changes) and gives the payoff a reaction shot.
  - title: Draws a floor plan
    text: Walls, windows, lights, people, the product, and lettered camera positions on one side of the line.
  - title: Fixes faces and the room
    text: Casting cards for each person, then one wide establishing still with its light recipe.
  - title: Writes shot cards
    text: Camera position, size, one action in countable beats, gaze, focus, and dialogue in its own block.
  - title: Logs the props
    text: Who holds what after every shot, so nothing appears or vanishes.
  - title: Plans cuts and retakes
    text: Cuts on an action, a look, a close-up or a time change. Misses are rerun, simplified, then fixed one thing at a time.

output_shape: |
  TURN   <setup> and <what's going on>, but <snag>, therefore <change>

  FLOOR PLAN
  <walls, doors, windows, light sources, people, product>
  Line: between <A> and <B>. Camera side: <side>
  Setups: A <wide> · B <single> · C <single> · D <inserts>

  CASTING  A: <...>   B: <...>
  LIGHT    <source, direction, softness, 3 to 5 colours>
  ESTABLISHING STILL (setup A)  <prompt>

  CLIP <n> (<length>)
  [<setup>] <size> · <action beats> · gaze <...> · focus <...> · move <...>
    Character A: <exact line>
  Props after: <who holds what>
  Cut out: <on the action / on a look / insert / time cut>

  RETAKES  <shot>: rerun > simplify > change <one instruction>

example:
  business: sprout
  input: |
    [the skill]

    Script: the 16-second script from "Get a short film ad script
    with a twist". Two shots per clip, two clips.
    Character A: a woman, about 40, short grey-streaked hair, navy
    jumper, reading glasses pushed up on her head.
    Character B: a man, about 40, rumpled dark hair, faded green
    T-shirt.
    Lines: B "Sweets for breakfast?" / A "Greens." / B "They're
    bears." / A "Green bears." / Narrator "One pack a day. Rip.
    Tip. Enjoy."
    Twist: when she looks away, B tears a pack for himself.
    Set: a small kitchen table, morning.
    Photos: [pouch front] [daily pack in a hand] [gummies in a palm]
    Handling: tear the daily pack straight across the top only.
    Tool: 8-second clips, 3 reference images, clean cuts.
  output: |
    TURN  A couple at breakfast, and she's eating gummy bears, but
          he teases her for it, therefore he quietly tears a pack for
          himself.

    FLOOR PLAN
    Small square table, window on the left wall (the only light),
    door behind B. A sits on the window side, B opposite. The pouch
    stands by A's right hand, label to camera side; two daily packs
    lie beside it. A mug by A's left elbow.
    Line: between A and B. Camera side: the room side, away from
    the window.
    Setups: A wide from the room side, table height · B over B's
    shoulder onto A, 50 mm look · C over A's shoulder onto B, same
    height · D inserts of hands and packs, from above the table.

    CASTING  A: a made-up woman, about 40, short grey-streaked hair,
             navy jumper, reading glasses pushed up on her head.
             B: a made-up man, about 40, rumpled dark hair, faded
             green T-shirt, a little stubble.
    LIGHT    soft morning daylight from the left window, gentle
             fall-off to the right; cream, navy, sage green, warm
             wood, pale grey.

    ESTABLISHING STILL (setup A)  Photo-real. The FLOOR PLAN as one
      frame: both seated, A eating from her palm, B holding a mug.
      [LIGHT]. Attach: casting A and B = faces and clothes only;
      pouch front = shape and print.

    CLIP 1 (8 s)
    [C] medium on B · lowers his mug, eyes on A's palm, one eyebrow
      up · focus on B · no move
      Character B: Sweets for breakfast?
    [B] medium on A · keeps chewing, does not look up · focus on A ·
      no move
      Character A: Greens.
    Props after: B's mug on the table by his right hand; A holds
      three gummies in her left palm.
    Cut out: on a look (B leans toward her palm)

    CLIP 2 (8 s)
    [D] close from above · A's hand lifts her mug away; B's hand
      slides one daily pack off the table · no move
    [A] wide · B tears the pack straight across the top, tips bears
      into his palm, glances at A · focus on B
      Narrator: One pack a day. Rip. Tip. Enjoy.
    Props after: B holds the torn pack; one daily pack left on the
      table; the pouch untouched, label to camera.

    (cut for length: the full run also had the lines "They're bears"
    and "Green bears" in a third clip, and still prompts for setups
    B, C and D)

    RETAKES  None yet. If A's glasses vanish in setup B: rerun once,
      then re-attach casting A to that shot only.

tweaks:
  - what: Clip limits
    how: Say whether your tool can start a clip from a chosen image. If not, every join is planned as a clean cut with a fresh start still.
  - what: Setups
    how: Ask for a fifth position, such as a shot from the doorway. It's added on the same side of the line, with its own fixed height and lens.
  - what: Crossing the line
    how: Ask for a planned cross for a moment of unease. It plans a camera move the viewer sees, or a shot straight down the line.
  - what: Voices
    how: Give each voice's accent, pitch and pace. It writes them once and reuses the words.

judge:
  - Every camera position sits on one side of the line, or the crossing is planned.
  - The light recipe is the same, word for word, in every prompt for the scene.
  - Each shot card has one action and at most one camera move.
  - The prop log has no gaps.
  - Dialogue matches the script exactly, and no character claims a result or plays a customer.

test:
  - Make the establishing still and two setups. The window, the door and the pouch should stay in the same places.
  - Read the prop log from top to bottom. Every object should be accounted for after every shot.
  - Watch one dialogue clip with the sound off. Only the speaker's mouth should move.
  - When a shot fails, paste the fault back in. You should get the next retake step for that shot only.

improve:
  - Save the approved casting cards, light recipe and establishing still in your brand file, and reuse them for a series.
  - Add each voice's accent, pitch and pace to "What you need".
  - Write your tool's limits into the skill (clip length, starting from an image), so every join is planned right.
  - Pair it with a skill that writes a short film ad script with labelled speakers, and one that adds captions in your brand font.

terms:
  - term: Floor plan
    meaning: A map of the room from above, showing where people, lights, props and cameras go.
  - term: The line
    meaning: An imaginary line between two characters. Keeping the camera on one side stops them seeming to swap places.
  - term: Establishing still
    meaning: One wide picture of the whole scene that fixes the room, the light and where everything sits.
  - term: Prop log
    meaning: A running note of who holds what after each shot.
