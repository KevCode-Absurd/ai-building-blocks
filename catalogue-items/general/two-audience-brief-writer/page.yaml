new_slug: two-audience-brief-writer
name: "Two-audience brief writer"
summary: "Write a brief for work that must satisfy experts and newcomers. Get two audience profiles, two failure tests and a promise to each."
job: write-and-tell-stories
thinking: medium
thinking_why: "It weighs two groups against each other, but the steps and tests are fixed."

headline: "Two-audience brief writer"
subhead: "Tell it what you are making and where people will meet it. It describes the expert and the newcomer, names the two ways the work can fail, and writes one promise to each. You get a one-page brief for a writer, a designer or yourself."

explain: |
  Most work is aimed at one reader and misses the other. Write for experts and a beginner is lost by the second paragraph. Write for beginners and the experts decide you have nothing new. The usual fix is to aim at the middle, which pleases nobody.

  This brief writer sets the target before anything is drafted. It describes each group by what they notice and what loses them. It names the two ends to avoid: so plain that an expert yawns, and so dense that only an expert follows. Each end gets a yes-or-no test you can run on a draft.

  It then writes a promise for each group. The newcomer gets something to enjoy on the first pass with no help. The expert finds something that rewards a closer look. Where the two overlap, usually a clear main idea, it says so the draft can lean on it. It uses real comments from both sides when you have them, and marks a gap when you do not.

when:
  - "You are making a talk, article, product page, course or song for an audience that runs from beginners to experts."
  - "Feedback pulls you both ways: one person says it is too basic, another says it is too hard."
  - "You are briefing a writer or designer and want one page on who the work must satisfy and how."
  - "A draft keeps coming out bland and you suspect you aimed at the middle."

not_for:
  - "You are planning a campaign and need what to say, to whom and what next: use the Marketing brief writer."
  - "You need tight design limits with room to play: use the Design brief rules writer."
  - "You have one clear audience, such as only your buyers: use the Buyer brief writer."
  - "You already have the brief and want the draft: use the Layered draft writer."

you_give:
  - "What you are making and where people will meet it (a page, a stage, a feed, a shelf)"
  - "Who the experts are and who the newcomers are, with real comments or past reactions if you have them (optional)"
  - "Length, format and any limits (optional)"
  - "A buyer note from earlier work (optional)"
you_get:
  - "A description of each audience: what they notice, what they need and what loses them"
  - "Two failure ends, each with a test you can run on a draft"
  - "One promise to the newcomer and one to the expert"
  - "The shared ground the draft can stand on"
  - "A list of anything missing"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini. If you added it to your AI, start it by name. If not, paste the skill file into a new chat. It needs no files or paid tools."
  - "Say what you are making and where people will meet it. Paste real comments from an expert and a newcomer if you have them."
  - "Read the two failure tests. If either does not match how your field works, say so and ask for a rewrite."
  - "Check that the two promises are different from each other. If they sound alike, ask it to sharpen the expert one."
  - "Take the brief to the Layered draft writer to get a draft, or give it to your writer or designer."

how_it_works:
  - title: "Pins the piece down"
    text: "Writes what it is, where it will be met and the one idea it exists to deliver."
  - title: "Describes the expert"
    text: "What they already know, what they spot, what they have seen too often and what would make them stop reading."
  - title: "Describes the newcomer"
    text: "What they know, what they need explained, how long they will give it and what loses them."
  - title: "Names the two ways to fail"
    text: "Too plain and too dense, each with a test a real person can run."
  - title: "Writes a promise to each"
    text: "What the newcomer enjoys alone on the first pass, and what the expert finds on the second."
  - title: "Finds the shared ground"
    text: "The things both groups want, such as a clear main idea, and what may go to one group only."
  - title: "Checks the brief"
    text: "Runs its own checks and names any it missed."

output_shape: |
  THE PIECE
  <what it is, where it is met, the one idea>

  THE EXPERT
  Knows: <...>  Notices: <...>  Has seen too often: <...>  Stops reading if: <...>

  THE NEWCOMER
  Knows: <...>  Needs explained: <...>  Time they will give: <...>  Lost if: <...>

  TWO WAYS TO FAIL
  Too plain: <sign> | Test: <question to ask of a draft>
  Too dense: <sign> | Test: <question to ask of a draft>

  THE PROMISES
  Newcomer, first pass: <one line>
  Expert, second look: <one line>

  SHARED GROUND
  <what both want, and what may go to one group only>

  MISSING
  <facts about either group that you would need>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "What you are making and where people will meet it"
    - "Who the experts and newcomers are, with real comments (optional)"
    - "Length, format and limits (optional)"
    - "A buyer note from earlier work (optional)"
  prerequisites:
    - "An AI chat. No files, web access or paid tools are needed."
  output:
    - {name: "The piece", contains: "What it is, where it is met and the one idea it exists to deliver."}
    - {name: "The expert", contains: "What they know, notice, have seen too often and what makes them stop."}
    - {name: "The newcomer", contains: "What they know, what needs explaining, how long they will give it and what loses them."}
    - {name: "Two ways to fail", contains: "Too plain and too dense, each with a yes-or-no test for a draft."}
    - {name: "The promises", contains: "One line for the newcomer's first pass and one for the expert's second look."}
    - {name: "Shared ground", contains: "What both groups want, and what may go to one group only."}
    - {name: "Missing", contains: "Facts about either group the brief still needs."}

tweaks:
  - what: "Real people"
    how: "Name two real people, one from each group. The descriptions stay specific instead of generic."
  - what: "Where they meet it"
    how: "Say if it is read alone, heard live or skimmed. A talk and a page need different tests."
  - what: "Which group matters more"
    how: "If one group pays or decides, say so. It still writes both promises, but marks the lead."

judge:
  - "Each group has at least one thing it notices or is lost by that the other does not."
  - "Both failure ends come with a test a person could run on a draft."
  - "The two promises are different from each other and each is one line."
  - "The brief does not ask for a blend that gives neither group anything."

test:
  - "Run it on a piece you have already made. See if the failure tests would have caught what readers complained about."
  - "Give the brief to a friend and ask them to describe the expert and the newcomer back. They should match what you meant."
  - "Run it twice. The promises should stay close in meaning even if the wording changes."

improve:
  - "Add the exact words experts use for what bores them, so the failure test matches how they talk."
  - "After each real audience reaction, update the promises with what each group actually said."
  - "Pair it with the Layered draft writer to turn the brief into a draft."

next: [layered-draft-writer, deliverer-fit-planner]

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "This is reading, sorting and writing, which any strong chat AI does well with this skill."}
    - {name: "Comments and reviews from both kinds of people", why: "Real words from an expert and a beginner make the two descriptions sharper than guesses."}
  inputs:
    - "A buyer or audience note, so the newcomer is a real person"
    - "Past comments on your earlier work"
    - "The length and format you are limited to"

terms:
  - term: "Failure end"
    meaning: "One of the two ways work goes wrong for a mixed audience: too plain or too dense."
  - term: "Shared ground"
    meaning: "What both groups want from the piece, such as a clear main idea."
