new_slug: two-version-ad-test-planner
name: Two-version ad test planner
summary: "Plan a fair test of two ad versions in one message. Get one difference, a key on each, the audience size and a winner rule."
job: plan-ad-tests
thinking: low
thinking_why: It compares two texts and applies fixed test rules.
headline: Two-version ad test planner
subhead: Paste two versions of an ad, email or page, and your usual reply rate if you know it. You get the one real difference, what to keep equal, a fair split, a key for each version, the audience size with the sum, and a winner rule with a read date. It is the short version of the Split-run test planner.
explain: |
  Many ad tests prove nothing. Two versions change three things at once, run in different weeks, or get called after a handful of replies.

  This prompt sets up the test before you spend. It finds the one difference between your versions, and if there are several, it splits them into separate tests. It picks a fair way to divide the audience and gives each version a key so you can tell the results apart later. It sizes the audience so you reach about 100 replies per version, and shows the sum.

  Last, it writes the winner rule, with a read date, before launch, so you cannot change the goalposts after. Even with no versions pasted, it still gives default keys, a read date counted from launch day and the size sum at a labelled range of reply rates. It runs in one message. For a control ad, rounds or more than two versions, use the Split-run test planner.
when:
  - You have two versions of an ad and want to know which is better.
  - A past test was unclear and you want a cleaner one.
  - You need to explain to a team how the test will be judged.
  - You want a plan in one message, not a long planning session.
not_for:
  - "You have more than two versions, or want a control ad: use the Split-run test planner."
  - "The versions must run in different places, such as two magazines: use the Cross-over copy test planner."
  - "You already have the counts: use the Two-version result reader."
  - "You do not know what people should reply to: use the Test reply offer planner first."
you_give:
  - The two versions, in full, labelled A and B
  - The offer (optional)
  - Your usual reply rate (optional)
you_get:
  - The one difference, in a line
  - What must stay equal, and a split method
  - A key for each version
  - The audience size with the sum shown
  - A winner rule with a read date
  - A list of traps to avoid
how_to_use:
  - Copy the prompt and paste it into a chat with Claude, ChatGPT or Gemini, with your details under it.
  - Paste both versions under the prompt, labelled A and B.
  - Add your usual reply rate if you know it. If not, you get a range and a question.
  - Set the keys in your tools and make the split with your email tool or ad platform.
  - Save the winner rule somewhere before you launch.
  - On the read date, use the Two-version result reader.
how_it_works:
  - title: Finds the difference
    text: Splits the test if more than one thing changed.
  - title: Keeps the rest equal
    text: Same offer, price, reply path, size, time and audience.
  - title: Chooses the split
    text: Random halves, or the platform's own even split.
  - title: Keys each version
    text: A code that changes if the text changes. It uses a default code if you name no tool.
  - title: Sizes the audience
    text: About 100 replies per version, with the sum shown.
  - title: Writes the winner rule
    text: Before launch, with a read date or a launch day plus a number of days.
output_shape: |
  THE ONE DIFFERENCE: <one line>
  KEEP EQUAL: <list>
  SPLIT: <how>
  KEYS: A = <key>, B = <key>
  AUDIENCE: 100 / <rate> = <people> per version, <total> in all
  WINNER RULE: <number> decides; a gap of <size> counts; read on <date or launch day plus N>; if close, <action>
  TRAPS TO AVOID: <list>
  MISSING: <what you did not give>
  CHECKS MISSED: <one line each, or none>
output_sample:
  input:
    - "Two versions of an ad, email or page, in full"
    - "The offer, if it is not in the versions (optional)"
    - "Your usual reply rate (optional)"
  prerequisites:
    - "An AI chat. No files, web access or paid tools are needed."
  output:
    - {name: "The one difference", contains: "A single line naming what changes. If several things changed, the test is split."}
    - {name: "Keep equal", contains: "The offer, price, reply path, size, send time and audience that must match."}
    - {name: "Split", contains: "How to make the halves: a random shuffle or the platform's even split."}
    - {name: "Keys", contains: "A different code for each version, so each reply can be traced."}
    - {name: "Audience", contains: "100 divided by your reply rate, per version and in all, with the sum shown."}
    - {name: "Winner rule", contains: "The deciding number, the gap that counts, the read date and what to do if it is close."}
    - {name: "Traps to avoid", contains: "Different send times, an uneven split, a hidden second change and the same people seeing both."}
    - {name: "Missing", contains: "Anything you did not give, so you know what to add."}
tweaks:
  - what: Versions
    how: Change one thing between them. More than one makes the test unclear.
  - what: Reply rate
    how: Give your real one. A guess gives a wrong audience size.
  - what: Winner number
    how: Say whether you judge on replies, cost per reply or sales.
  - what: More than two versions
    how: Use the Split-run test planner. It plans a knockout or a control.
judge:
  - There is one difference.
  - Both versions run together.
  - The keys are different.
  - The sum for the audience is shown.
  - The rule has a date.
test:
  - Give it two versions with three differences. It should split them.
  - Run it twice. The difference and keys should match.
  - Follow the plan on a small send and see if the result is clear.
improve:
  - Add your usual reply rates for each channel.
  - Add the traps you have hit before.
  - Add how your platform splits audiences.
  - Pair it with the Two-version result reader.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: A short prompt works the same in any of them, so use the one you already have open.
    - name: Your email tool or ad platform
      why: Most have an even split setting that makes the halves for you.
  inputs:
    - Your past reply rates
    - How your platform splits audiences
    - The date you can read the result
terms:
  - term: Key
    meaning: A code on each version that shows which one a reply came from.
  - term: Control
    meaning: The version you measure every new version against.
  - term: Read date
    meaning: The day you look at the counts and apply the winner rule. You set it before you launch.
