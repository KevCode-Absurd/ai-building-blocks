new_slug: value-ladder-planner
name: "Value ladder planner"
summary: "Turn what you sell into a value ladder: a free first step, rising rungs, what moves buyers up and the one rung to fix this quarter."
job: make-offer
thinking: medium
thinking_why: "It arranges your offers and picks one rung to fix, which takes some judgement, but the steps are fixed."

headline: "Value ladder planner"
subhead: Give it your offers, their prices and what each one does for the buyer. It builds a value ladder with a free or low first step and rungs that rise in price and result. You get the ladder, what moves a buyer up each rung and the one rung to work on this quarter.

explain: |
  Many businesses sell one offer at one price. A buyer who is not ready leaves. A buyer who wants more has nowhere to go. A value ladder fixes both. It puts your offers in order, from a free or low first step to a top tier. Each rung solves a bigger problem for the same buyer at a higher price.

  This skill lists what you sell and what each offer costs the buyer. It starts the ladder with a small, easy step. Then it puts each next rung higher in price and result. It adds one rung with a repeat fee, so income comes again. It marks the core path and writes what moves a buyer up. Last, it picks the one rung to build or fix this quarter, so you do not try to fix everything at once.

when:
  - You sell one main thing, and buyers who are not ready for it leave.
  - You have many products with no clear order between them.
  - Buyers stop after one purchase and you do not know what to offer next.
  - A teammate asks "what do we sell first, and what comes after?"

not_for:
  - You have no offers or prices yet. Start with the Hidden offer finder or the Offer builder that answers buyer doubts, then come back.
  - You want to price one offer in good, better and best versions. Use the Three-tier price ladder drafter.
  - You want a plan for funding a product range from sales. Use the Staged product ladder planner.
  - You want add-ons at checkout. Use the After-sale offer planner.

you_give:
  - Everything you sell, with prices (rough is fine), from your price list or store
  - What each offer gives the buyer, in plain words
  - Who your best buyers are and what they buy next (optional)
  - Sales by offer, from your store or sales sheet (optional)
you_get:
  - A ladder of rungs from free or low to top tier
  - The result and price of each rung
  - What moves a buyer from one rung to the next
  - The one core path and the single rung to work on this quarter

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it in. It needs no tools or files.
  - Paste a list of what you sell. Give each offer a price and the result the buyer gets.
  - Add what buyers buy next and your sales by offer, if you have them. Without them, the quarter pick is a judgement, and it says so.
  - Read the ladder. Check that every rung is for the same buyer and gives a bigger result than the one below.
  - Fix any rung marked "to build" or MISSING, then work on the one rung it picks before the others.

how_it_works:
  - title: Lists what you sell
    text: Writes every offer with its price and what it gives the buyer.
  - title: Starts with a free step
    text: Puts a free or very cheap first step at the bottom that solves one small problem.
  - title: Raises each rung
    text: Puts each next rung at a higher price and a bigger result for the same buyer.
  - title: Adds a recurring rung
    text: Adds one rung with a repeat fee so income repeats.
  - title: Marks the core path
    text: Marks one core path and which side offers feed it.
  - title: Writes the move-up
    text: States what moves a buyer from each rung to the next.
  - title: Picks one rung
    text: Chooses the single rung to fix or build this quarter.
  - title: Checks the ladder
    text: Runs its own checks and names any it missed.

output_shape: |
  WHAT YOU SELL
  <offer> | Price: <figure> | Result for the buyer: <result>

  THE LADDER
  Rung 1 (free or low): <offer> | Solves: <one small problem>
  Rung 2: <offer> | Price: <figure> | Result: <bigger result>
  ...
  Recurring rung: <offer> | Fee: <figure per period>

  CORE PATH
  <the rungs most buyers should take> | Side offers: <list and what they feed>

  WHAT MOVES A BUYER UP
  Rung <n> to <n+1>: <trigger or event>

  WORK ON THIS QUARTER
  <rung> because <reason>

  MISSING
  <facts not given>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "Everything you sell, with prices (rough is fine)"
    - "What each offer gives the buyer"
    - "Who your best buyers are (optional)"
    - "Sales by offer (optional)"
  prerequisites:
    - "Your brand brain from the Website brand brain builder (optional)"
  output:
    - name: "WHAT YOU SELL"
      contains: "One line per offer with its price and the result the buyer gets."
    - name: "THE LADDER"
      contains: "Rungs from a free or low first step up to the top tier, each with price and result."
    - name: "Recurring rung"
      contains: "The one offer a buyer can pay for again each period, with the fee."
    - name: "CORE PATH"
      contains: "The rungs most buyers should take, plus side offers and which rung each one feeds."
    - name: "WHAT MOVES A BUYER UP"
      contains: "For each step up, the event or message that makes the buyer ready."
    - name: "WORK ON THIS QUARTER"
      contains: "The single rung to build or fix first, with the reason."
    - name: "MISSING and CHECKS MISSED"
      contains: "Facts you did not give, and any check the ladder still fails."

tweaks:
  - what: Real prices
    how: Give actual prices. The ladder should rise, and it tells you where it does not.
  - what: What buyers do next
    how: Say what they buy after the first step. It builds the move-up on that.
  - what: Your capacity
    how: Say what you can deliver. It will not put a rung you cannot serve on the ladder.
  - what: Recurring income
    how: Say if you could charge a repeat fee. It picks the best fit, or leaves it blank.

judge:
  - Rungs rise in price and in result.
  - The first rung is free or low and solves one problem.
  - One core path is marked.
  - Every step names what moves the buyer up.
  - Only one rung is chosen to fix first.

test:
  - Give the ladder to a customer and ask which rung they would take next.
  - Check each rung really delivers a bigger result than the one below.
  - Check you could serve the top rung if many came.
  - Run it twice and compare the rung it picks.

improve:
  - Add the sales you have for each offer to the input.
  - Add rungs you will not offer to the rules.
  - Save the quarter's result for the chosen rung to your notes.
  - Pair it with "After-sale offer planner" to test add-ons at each rung.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Ordering offers and writing the move-up is text work any strong chat AI handles."}
    - {name: "A spreadsheet", why: "Lets you see sales, price and next purchase by rung."}
  inputs:
    - "Sales by offer for the last year"
    - "What customers bought second"
    - "Your best buyers' goals"

terms:
  - term: Value ladder
    meaning: A set of offers in order from a free or low first step to a top tier.
  - term: Rung
    meaning: One offer on the ladder.
