new_slug: value-proposition-builder
name: "Value proposition builder"
summary: "Write a value proposition from your offer and customer facts: what they gain, one incentive and proof from a similar customer."
job: make-offer
thinking: medium
thinking_why: "It chooses which facts become value and proof, and refuses claims without evidence, but the structure is fixed."

headline: "Value proposition builder"
subhead: Give it your offer, what you know about the customer and any proof you can use. It writes your value pitch in five and a half parts. You get what the customer gains, one incentive, what you keep giving after the sale and proof from a similar customer.

explain: |
  Every seller says quality, service and experience. A pitch that lists what you are gives the buyer nothing to weigh. They weigh what they will gain: money earned, money saved, time freed or a risk avoided. They also ask if you will still be there after they pay.

  A value proposition builds the pitch around that gain. This skill writes it in five and a half parts. First your company value, product value and your own value as the seller. Then one incentive, marked one time only. Then how the customer earns, benefits or profits, with numbers where you have them. The half step is what you keep giving after the sale. Last comes proof from a similar customer.

  It then checks the draft against the doubts buyers have after they pay. It never fills a gap with a guess. A missing figure or case is marked, not made up.

when:
  - Your pitch lists features, and the buyer asks what is in it for them.
  - You are about to meet a buyer and want your value on one page.
  - You offer a deal and cannot say what it is worth to the customer.
  - A buyer says "why should I pay that?" and you need a better answer.

not_for:
  - You have no offer yet, only an idea. Use the Hidden offer finder first.
  - You want the one sentence your ad rests on. Use the Selling proposition finder.
  - You want a first message to a stranger. Use the Stranger first-message writer.
  - You have no facts, no results and no customer to describe. It marks every part MISSING and gives you a blank outline.

you_give:
  - What you sell, with price and terms, from your price list or sales page
  - Who the customer is and what they want to gain, from your notes or past calls
  - Results, case notes, reviews and numbers you can prove (optional)
  - The doubts buyers voice after they buy (optional)
you_get:
  - Your company, product and seller value, each stated plainly
  - One incentive, marked one time only
  - The customer's profit, with figures where you have them
  - What you keep giving after the sale, and a proof line from a similar customer

how_to_use:
  - Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it in. It needs no tools or files.
  - Paste your offer, the customer facts and any proof you may use. If you paste nothing, it asks for the offer and customer first.
  - Add the doubts buyers say they have after they buy, if you know them.
  - Check each figure and each proof line against your own records. Cut anything you cannot prove.
  - Edit THE PITCH into your own voice. Then run it through the Sales copy editor before it goes on a page or into a meeting.

how_it_works:
  - title: Lists your three values
    text: Writes company value, product value and your value as the seller, each from facts you gave.
  - title: Adds one incentive
    text: Writes one short-term incentive and marks it one time only.
  - title: States the customer profit
    text: Writes how the customer produces, benefits or profits, with numbers where you have them.
  - title: Adds the half step
    text: Writes what you keep giving after the sale.
  - title: Adds similar proof
    text: Adds proof from a customer like this one.
  - title: Checks buyer doubts
    text: Checks the draft against the buyer's own after-purchase doubts.
  - title: Checks the draft
    text: Runs its own checks and names any it missed.

output_shape: |
  YOUR VALUE
  Company: <value>
  Product: <value>
  You as the seller: <value>

  INCENTIVE (one time only)
  <incentive, limit or end>

  WHAT THE CUSTOMER GAINS
  <how they produce, benefit or profit, with figures>

  AFTER THE SALE (the half step)
  <what you keep giving>

  PROOF FROM A SIMILAR CUSTOMER
  <customer type, result, source>

  THE PITCH
  <draft in the buyer's words>

  BUYER DOUBTS AFTER PURCHASE
  <doubt> | Answered by: <line>

  MISSING
  <facts not given>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "What you sell, with price and terms"
    - "Who the customer is and what they want to gain"
    - "Results, case notes or reviews you can prove (optional)"
    - "The doubts buyers voice after they buy (optional)"
  prerequisites:
    - "Your brand brain from the Website brand brain builder (optional)"
  output:
    - name: "YOUR VALUE"
      contains: "Your company value, product value and your value as the seller, from facts you gave."
    - name: "INCENTIVE (one time only)"
      contains: "One reason to act soon, with what it is and when it ends."
    - name: "WHAT THE CUSTOMER GAINS"
      contains: "How the customer earns, benefits or profits, with figures where you gave them."
    - name: "AFTER THE SALE (the half step)"
      contains: "What you keep giving after they pay, such as support or a review."
    - name: "PROOF FROM A SIMILAR CUSTOMER"
      contains: "The customer type, the result and where the proof comes from."
    - name: "THE PITCH"
      contains: "A short draft in the buyer's words, built from the parts above."
    - name: "BUYER DOUBTS AFTER PURCHASE"
      contains: "Each doubt with the pitch line that answers it, or a flag if none does."
    - name: "MISSING and CHECKS MISSED"
      contains: "Facts you did not give, and any check the draft still fails."

tweaks:
  - what: Figures
    how: Numbers for profit, saving or time turn a claim into value. With none, the skill says the gain in plain words and marks MISSING.
  - what: Proof
    how: Give a real result with a source. The skill never invents a case.
  - what: The incentive
    how: State what it is and when it ends. It marks it one time.
  - what: The buyer's doubts
    how: Paste the doubts your buyers voice after buying. The draft answers each.

judge:
  - The customer's profit is stated and is not a vague promise.
  - The incentive is marked one time.
  - The proof comes from a similar situation.
  - There is no claim of honesty or quality without evidence.
  - The value you keep giving after the sale is named.

test:
  - Read the pitch to a customer and ask what they would want proved.
  - Check each figure against your records.
  - Remove the incentive and see if the pitch still holds.
  - Run it twice and compare the customer profit it states.

improve:
  - Add your strongest case and its numbers to the input every time.
  - Add claims you must not make to the checks.
  - Save pitch versions that won deals to your brand file.
  - Pair it with a skill that writes your sales page or letter.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Writing a short pitch from your facts is text work any strong chat AI handles."}
    - {name: "Your CRM or deal notes", why: "Holds the real results and the objections buyers raised."}
  inputs:
    - "A case with before and after numbers"
    - "Customer reviews with their words"
    - "What it costs a customer to not buy"

terms:
  - term: Incentive
    meaning: A reason to act soon, such as a bonus or a limited price.
  - term: Half step
    meaning: The value you keep giving after the sale, such as support or updates.
