new_slug: video-ad-edit-planner
name: "Video ad edit planner"
summary: "List your clips and script. Get a timed cut list, caption windows, a sound plan and exports."
job: make-video-ads

headline: "Video ad edit planner"
subhead: List your clips, attach screenshots from each, and paste your approved script and offer. It sorts the usable moments, times every cut and caption to the real speech, and plans the sound. You get a cut list, caption windows, a sound plan, export settings and the shots still missing.

explain: |
  Raw footage rarely cuts itself into an ad. The founder's best line is buried after a long pause, the product shot covers the label, a caption repeats a number the automatic transcript misheard, and the music track was only cleared for organic posts. Editors also add things that don't belong: a countdown, "link in bio", a discount nobody approved.

  This skill plans the edit before anyone opens an editor. It lays your clips against the argument (opening, problem, product, proof, action), keeps only moments that earn their place, and times every cut and caption to the real footage, not the script. It protects the product's look and every claim, keeps qualifications attached, and ends on your approved offer only. It's a plan for an editor; it never claims a finished video exists.

when:
  - You have founder, customer or product footage and need it cut into a paid ad.
  - You want to swap a new opening onto an ad you already run and check the join.
  - An editor's last cut added claims, urgency or music you never approved.

you_give:
  - Your clips, with lengths, shape, and any speech, words on screen or music in them
  - A few screenshots from each clip (attach them; your AI can see pictures)
  - The approved script, claims and offer (the only words the ad may carry)
  - What you sell, with real packaging photos and how it's used
  - Who the ad is for (optional)
  - Delivery needs, like shapes, length and caption style (optional)
you_get:
  - A cut list with source in and out times and the timeline position of each shot
  - Caption windows timed to the kept speech, with transcript checks
  - A sound plan and the close, using only approved terms
  - Export settings per shape, and a list of shots you still need
  - Any of its six checks the plan couldn't pass, named one per line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - List each clip with its file name, length and shape, and attach a few screenshots from each. Paste the transcript with times if you have one.
  - Paste the approved script, claims and offer. Say what shapes and length you need.
  - Hand the plan to your editor, or follow it yourself in any editing app.
  - Watch the first frame, every join and the close with sound on and off before you publish.

how_it_works:
  - title: Maps footage to the argument
    text: Lays clips against opening, problem, product, proof and action, keeps only moments that earn their place, and names any shot that's missing.
  - title: Opens on a clear first frame
    text: Trims dead setup without clipping the first word, and checks any new opening's join for voice, light, sound and product.
  - title: Protects product and proof
    text: Uses real product shots, shows use when its line is spoken, and never crops away a qualification or lets a transition hide the label.
  - title: Times to the real footage
    text: Records source in and out times, re-times captions after every cut, and checks the transcript's names, numbers and negatives.
  - title: Plans readable captions
    text: Two lines at most, about 42 characters each, no faster than about 15 characters a second, inside the app's safe area.
  - title: Checks generated takes
    text: Looks at mouth timing, exact words and voice through the whole take, and names a replacement if a take is broken.
  - title: Plans sound and the close
    text: Voice first, real sound effects, music only if cleared for paid use. Ends on one action with the approved offer.
  - title: Sets the exports
    text: Each shape with a clean and a captioned copy, as a browser-playable MP4, to review before it runs.
  - title: Checks the plan
    text: Checks the plan against its six checks, fixes what it can, and names any it still misses.

output_shape: |
  CUT LIST (<version>)
  # source  in-out (s)  timeline  shows  audio
  <one row per shot>
  Cut: <what was removed, and why>

  JOINS  <opening-to-body checks, if openings are swapped>

  CAPTION WINDOWS (re-timed to the cut)
  <start-end>  <caption text>
  Transcript checks: <words to listen for>

  SOUND  Voice: <..> Effects: <..> Music: <source and clearance>
  CLOSE  <the approved action, offer and destination>
  EXPORT <shapes, clean and captioned copies, file settings>
  GAPS   MISSING: <shots, times or clearances needed>
  CHECKS MISSED  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Footage (a real customer, filmed from our brief, all 9:16):
    H1 hookA.mp4 4 s. 0.4 "I quit greens powder more times than I
       can count." (ends 3.6)
    H2 hookB.mp4 5 s. 0.3 "If your greens powder lives at the back
       of the cupboard, watch this." (ends 4.4), holds up a pack
    B  body.mp4 32 s. To camera, pack in hand. 0.9 "Okay, um, so."
       2.6 "This is one day." 4.0 "You tear the top, tip it out."
       7.9 "21 vitamins and minerals and 6 grams of fiber, in one
       pack." 13.0 "Honestly it fixed my stomach." 15.8 "First order
       is $29.99 with the text sign-up. It renews at $49.99 every 4
       weeks." (ends 22.6), then looks off camera.
    X1 tear.mp4 6 s. Pack torn straight across its top edge, close.
    X2 pour.mp4 5 s. Gummies tip into her palm, close.
    X3 pouch.mp4 4 s. Pouch held to the lens, name readable.
    No music supplied.
    Approved script: both hooks and the body lines from the brief.
    Never say: "fix", or any health result.
    Need: two versions (H1 + body, H2 + body), 9:16 and 4:5, under
    30 seconds, captions.
  output: |
    CUT LIST (version A, H1 + body)
    # source  in-out (s)  timeline    shows                 audio
    1 H1      0.4-3.6     0.0-3.2     her to camera         H1
    2 B       2.6-4.0     3.2-4.6     holds up a pack       B
    3 X1      0.5-2.5     4.6-6.6     tear across the top   B 4.0-6.0
    4 X2      0.0-1.9     6.6-8.5     gummies into palm     B 6.0-7.9
    5 X3      0.0-4.0     8.5-12.5    pouch, name readable  B 7.9-11.9
    6 B       11.9-13.0   12.5-13.6   her to camera         B
    7 B       15.8-22.6   13.6-20.4   her, price and terms  B
    8 X3      0.0-2.5     20.4-22.9   pouch (hold)          room tone
    Cut: B 0.9-2.6 (filler). Cut: B 13.0-15.8 "Honestly it fixed my
    stomach." It isn't in the approved script and "fix" is banned.
    Shots 3 and 4 show the use while "tear the top, tip it out" is
    spoken. Version B swaps shot 1 for H2 0.3-4.4 (0.0-4.1) and moves
    the rest 0.9 s later: 23.8 s.

    JOINS
    H1 into "This is one day.": same kitchen, same top, pack sealed in
    both. Fine. H2 ends "watch this" with the pack held up; "This is
    one day" picks up the same pack. Check the light matches; H2 was
    filmed nearer the window.

    CAPTION WINDOWS (version A)
    0.0-3.2    I quit greens powder more times than I can count.
    3.2-8.5    This is one day. You tear the top, tip it out.
    8.5-13.6   21 vitamins and minerals and 6 grams of fiber, in one
               pack.
    13.6-17.0  First order is $29.99 with the text sign-up.
    17.0-20.4  It renews at $49.99 every 4 weeks.
    Transcript checks: listen at B 7.9 for "21" (the site also says
    "over 20") and "6 grams"; at B 15.8 for "$29.99" and "$49.99".
    Every caption stays under 2 lines of 42 characters and 15
    characters a second. The renewal follows the price with no gap.

    SOUND
    Voice: B and the hook clips, natural delivery, no speed change.
    Effects: X1's own foil tear under shot 3, if its room audio is
    clean. Music: none supplied, so none.

    CLOSE
    Price and renewal as she says them, held on the pouch in shot 8.
    No discount, deadline, guarantee or "link in bio" added.

    EXPORT
    Versions A and B, each 9:16 1080x1920 and 4:5 1080x1350, each as a
    clean copy and a captioned copy: 8 files. H.264, yuv420p, MP4 with
    audio. 4:5 crop: check her face, the hands in shots 3 and 4 and the
    pouch name in shots 5 and 8 stay in frame.

    GAPS
    MISSING: a verdict take. Her only verdict was the cut "fixed" line.
    Ask her to re-film one small, plain line with no health result.
    This is a plan. Nothing is rendered yet.

    CHECKS MISSED  none

tweaks:
  - what: A new opening on an old ad
    how: Give the new opening clip and the ad it joins. The plan checks the join for pronouns, argument, voice, product state (opened or sealed), light, room sound and music, and says if the two don't fit.
  - what: Shapes and length
    how: Ask for 9:16, 4:5 or 1:1 and a maximum length. It keeps the whole frame first and flags every shot where a center crop would lose a face, hands or the label.
  - what: Caption style
    how: Ask for no added captions, burned-in captions, or both. "No added captions" and "silent" are different; text already in the footage stays unless you have a clean source.
  - what: AI-generated takes
    how: Include generated clips and it checks each through its last spoken word for mouth timing, teeth, exact words and voice, and names a replacement shot when a take is broken.

judge:
  - Every claim, number and offer on screen is in your approved copy.
  - The product looks right in every shot it appears in, label readable, opened the way it really opens.
  - Each caption matches what's actually said after the cuts.
  - Off-script lines, like a creator's own health claim, are cut, not kept.
  - The ending carries only your approved terms. No added urgency or discount.
  - The plan says it's a plan, and lists any missing shots.

test:
  - Put one off-script line with a banned word into your transcript. The cut list should remove it and say why.
  - Check three cut points against the real clips in your editor. The in and out seconds should land on whole words, not mid-word.
  - Ask for two versions with different openings. The join notes should name at least one thing to check (light, product state, pronouns); if they say "fine" with no reason, ask again.
  - Give it a music track with no paid-use clearance. It should plan no music, or flag the clearance as missing.

improve:
  - Add your approved script, claims and offer terms to "What you need" in the skill file as a standing list, so every edit checks against the same words.
  - Write your product's handling rules into step 3 (how it opens, what shot shows the label best), so it protects them in every cut.
  - Add your house caption style and export shapes to step 7, so delivery settings come out the same every time.
  - Keep separate voice and music tracks, and paste a transcript with times; without one every in and out point is an estimate.
  - Pair it with the skill that plans on-screen text for a finished video ad, once the cut is approved.

works_best_with:
  tools:
    - {name: "Claude", why: "Holds a long transcript, the approved copy and the cut list in one chat without losing a number."}
    - {name: "Descript", why: "Edits video by its transcript, so in and out points land on whole words."}
    - {name: "DaVinci Resolve", why: "A free editor with subtitle tracks and the export settings this plan asks for."}
  inputs:
    - "A transcript with word timings for every clip, so cuts and captions land on real words"
    - "Separate voice and music tracks, so music can be changed without touching the voice"
    - "The licence for any music track, so you know it's cleared for paid ads"
    - "Photos of the pack from each side, so every product shot can be checked against the real thing"

terms:
  - term: Cut list
    meaning: A table of every shot in the edit, with where it comes from in the source clip and where it sits in the ad.
  - term: In and out points
    meaning: The second a shot starts and stops inside the original clip.
  - term: Clean copy
    meaning: The same video with no added captions or text, kept so you can re-edit or re-caption later.
