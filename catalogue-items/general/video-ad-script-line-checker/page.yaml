thinking: medium
thinking_why: "It writes or plans with a handful of checks."
new_slug: video-ad-script-line-checker
name: "Video ad script line checker"
summary: "Check your video ad script line by line. Get each weak line with a fix from your own facts, plus a score out of 100 before and after."
job: make-video-ads

headline: "Video ad script line checker"
subhead: Give it a video ad script you're about to film or one that isn't working. It labels every line by beat and runs 12 groups of checks. You get each weak line with a fix from your facts, and a score out of 100 before and after.

explain: |
  "This script feels flat" isn't something you can fix. Neither is "make it punchier". Scripts fail for reasons you can name: an opening that picks out nobody, praise any rival could copy, a list of features where one promise should be, a crowd of happy users nobody counted, or "shop now" with nothing about what happens next.

  This skill gives each of those a check with a code, so a review reads like a marked-up draft. Three groups cover the whole script: is it true, does it fit the buyer, and will it work spoken and silent. Nine more cover each beat, from opening to call to action. Truth problems come first, because they can get an ad rejected. Your brand's own voice and facts always win.

  The beat order follows Blue Sense Digital's public masterclass, How To Write Meta Ads That Scale. Other checks come from Eugene Schwartz, John Caples and Claude Hopkins, and the pace check from published research on how fast ads should talk.

when:
  - A script is about to be filmed and you want a second opinion before spending money.
  - An ad isn't working and you want to know which lines are to blame.
  - You're writing a script and want the checks for one part, such as the opening or the proof.
not_for:
  - "You have no script yet: use the Customer quote video ad writer to write one first."
  - "Your script has no spoken or on-screen lines, such as a silent product clip: a script check has nothing to mark up, so plan the shots with a person or a storyboard."
  - "You want to read your ad results, not judge a script: use the Ad change decision checker."

you_give:
  - The script you're writing or judging
  - Your product facts, allowed claims and brand voice, so fixes stay true (optional)
  - Whether the product is used up and reordered, or bought once and kept (optional)
  - The length and speaker, for the pace check (optional)
  - Which groups of checks you want (optional, it picks for the task)
you_get:
  - Every weak line, quoted, with the check it fails, what's wrong and a fix
  - The beats the script is missing
  - The spoken word count against the budget for the length
  - A list of facts a fix would need that you haven't given
  - A score out of 100 now and after the fixes, with the sum shown

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste its reference file (principles.md) too, then your script, one line per row.
  - Add your product facts and allowed claims, so every fix uses only true facts.
  - Say whether your product is used up and reordered, or bought once and kept.
  - Fix the Truth problems first, then read the whole script aloud again.
output_sample:
  input:
    - Your video ad script, one line per row
    - Your product facts, allowed claims and brand voice (optional)
    - Whether the product is reordered or kept (optional)
    - The length and speaker, for the pace check (optional)
  output:
    - name: Weak line blocks
      contains: Each weak line quoted, with its beat, the check it fails, what is wrong and a fix from your facts.
    - name: Missing beats
      contains: The parts of the script that never appear, each with what the script fails to do.
    - name: Word count
      contains: Spoken words counted against the budget for your script length and pace.
    - name: MISSING facts
      contains: The facts a fix would need that you did not give, so nothing is made up.
    - name: Score
      contains: A score out of 100 now and after the fixes, with the deductions shown.

how_it_works:
  - title: Labels every line
    text: Tags each line with its beat and notes any beat that's missing.
  - title: Checks the whole script
    text: Truth (nothing invented, claims allowed), Fit (one awareness level, the right doubts) and Delivery (sounds right, fits the budget, works with sound off).
  - title: Checks each beat
    text: Nine groups, from whether the opening picks out the buyer to whether the call to action says what happens next.
  - title: Quotes, codes and fixes
    text: For each weak line, quotes it, cites a check code like Proof 2, and writes a fix from your facts. A fix that needs a missing fact is marked MISSING.
  - title: Ranks what to fix
    text: Truth first, then the opening, then the rest in beat order.

output_shape: |
  LINE <n> "<the line, quoted>"  Beat: <beat>
  <Check code>: <what is wrong>
  Fix: <a rewrite using only your facts, or MISSING>
  (one block per weak line, Truth problems first)

  MISSING BEATS
  <beat>: <what the script never does>

  WORDS  <spoken> of <budget> for <length> at <pace>
  MISSING: <facts a fix would need>

  SCORE
  Now: 100 - <deductions> = <score>
  After the fixes: <score>

example:
  business: sprout
  input: |
    [the skill]

    Script to judge (30 seconds, voice-over; a draft stitched from
    lines on our site and in our ads):
    1 "Fix the Hot Girl Tummy."
    2 "Sprout is the first smart gummy that fills the gaps."
    3 "60+ potent ingredients to revive whole body vitality."
    4 "Clinically backed formula for energy, immunity, and daily
       wellness."
    5 "Trusted by 1M+."
    6 "Get up to 61% OFF + 4 FREE gifts. Shop now!"

    Facts: 1 pack = 60+ ingredients, 21 vitamins and minerals, 6 g
    prebiotic fiber. Study: 12 weeks, blood vitamin C and folate only.
    Allowed: "Supports digestion and gut health." Survey: "67% ...
    experienced better, more regular digestion", always "of surveyed
    users". Offer: site says 52% or 55%, ads say 61%. $29.99 first
    order with SMS sign-up, renews at $49.99 every 4 weeks.
    Buyer: the gut-fix seeker; has tried fiber powders and
    probiotics. Doubt: "Will this upset my stomach more?"
    Customer words: "The prebiotics do their job, but not
    aggressively" (review 8).
    Voice: playful, cheeky. Bought: reordered (subscription).
  output: |
    LINE 4 "Clinically backed formula for energy, immunity..."
    Beat: proof
    Truth 1: the study measured two vitamins in the blood, not energy
    or immunity. Proof 1: the claim is far bigger than the proof.
    Fix: proof that matches the gut promise. "67% of surveyed users
    experienced better, more regular digestion." Screen: brand
    survey, 3,000+ customers.

    LINE 1 "Fix the Hot Girl Tummy."  Beat: opening
    Truth 3: "fix" sounds like treating bloating; the allowed word is
    "supports". Truth 5: it tells viewers what they have.
    Problem 1: a symptom, not what they do about it.
    Fix: open on what they've tried. "Fiber powder. Probiotics. That
    tea your friend swore by. Then 3 pm hits." [ASSUMED: the 3 pm
    moment]

    LINE 6 "Get up to 61% OFF + 4 FREE gifts. Shop now!"  Beat: offer
    and call to action
    Truth 2: the discount appears four ways across ads and site, so
    it isn't a fact yet. Call to action 1: no next step, no effort,
    no reason for now.
    Fix: "Your first order is $29.99 with the text sign-up, then
    $49.99 every 4 weeks. Start with Low Sugar."

    LINE 2 "the first smart gummy that fills the gaps"  Beat: promise
    Truth 1: "first" has no source. Offer 1: the product is named
    before anything has landed. "Smart" and "fills the gaps" are
    words any rival could use.
    Fix: cut it. Name Sprout at the offer.

    LINE 3 "60+ potent ingredients to revive whole body vitality"
    Beat: how it works
    Truth 3: "revive whole body vitality" can't be backed. How it
    works 1: a feature with a vague promise and no reason it works.
    Fix: "One pack has 6 grams of prebiotic fiber in a handful of
    gummies. It supports digestion and gut health."

    LINE 5 "Trusted by 1M+."  Beat: proof
    Proof 3: a bare count is weak next to a specific survey result,
    and "trusted" is a word any rival could use.
    Fix: cut it at 30 seconds.

    MISSING BEATS
    Doubt: "Will this upset my stomach more?" is never answered. Add
    review 8: "The prebiotics do their job, but not aggressively."
    Problem: there is no workaround, only a slogan.

    WORDS  46 of 84 for 30 s at 3.0 a second. Room for the doubt beat
    and one problem line.
    MISSING: one agreed discount figure. Until then the script uses
    prices, not a percentage.
    MISSING: which 4 gifts. They change, so the line can't name them.

tweaks:
  - what: Which groups
    how: Ask for "Delivery only" to polish a script for speaking, "Offer and call to action" to tighten the ending, or "all" for a full review. Fewer groups means a shorter, sharper review.
  - what: Reordered or kept
    how: Several checks change with this. For something reordered, the first order and the habit matter most. For something kept, the buyer weighs price against how long it lasts, the fit and the returns policy. If you don't say, it applies both and names the difference.
  - what: Your facts
    how: Paste your product facts and allowed claims. Without them, fixes that need a fact are marked MISSING instead of filled in.
  - what: Writing, not judging
    how: Say "use as a guide while I write" and it gives no separate review. The script you write follows the checks instead.

judge:
  - Every problem quotes a real line from your script.
  - Every check code it cites is in the reference, and the reason matches it.
  - Truth problems come first.
  - Every fix uses only your facts. Nothing from the reference's examples appears as a fact.
  - Missing beats are named, as well as weak lines.

test:
  - Run it on your best-performing ad. It should flag little; if it tears a winner apart, read which checks it cites before you change anything.
  - Plant one claim you know you can't back. It should catch it under Truth and offer a fix from your facts or a MISSING line.
  - Run it twice on the same script. The same lines should be flagged both times, even if the fixes are worded differently.
  - Leave out whether your product is reordered or kept. It should say MISSING and judge both ways.

improve:
  - Add your allowed and banned claims to "What you need" in the skill file, so every review checks against your real limits.
  - Add your brand's voice rules and never-say list under Delivery in the reference file, so voice problems cite your own rules.
  - Write your product type (reordered or kept) into the skill file as a default.
  - Save the problems it finds often to your org context as "lines we keep getting wrong", and check new drafts against them first.
  - Pair it with the skill that writes a video ad script beat by beat, to rewrite once you know what's wrong.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
  inputs:
    - "The ad's audience retention chart, if it has run, so you can see the line where people left"
    - "The reviews and research the script was built from, so fixes use buyers' real words"
    - "Your list of lines you keep getting wrong, so it checks those first"

terms:
  - term: Beat
    meaning: One part of the script with one job, like the problem or the proof.
  - term: Check code
    meaning: A short name for one check, like Truth 1 or Proof 2, so you can look it up in the reference file.
  - term: Reordered or kept
    meaning: Used up and bought again (coffee, a supplement, a face cream) versus bought once and owned (a jacket). The buyer's doubts differ.
