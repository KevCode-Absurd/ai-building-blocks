name: "Video ad script type picker"
new_slug: video-ad-script-type-picker
summary: "Pick different video ad script types from one round of buyer research, so each test ad sells a new way. Get each type's opening, tone and proof."
job: make-video-ads
thinking: medium
thinking_why: "It writes or plans with a handful of checks."

headline: "Video ad script type picker"
subhead: Give it your buyer, why they buy and what you can prove. It picks from 14 video script types in four groups so each ad sells a different way, and lists the types it skipped. You get each script's type, opening and tone, and the fact that backs it.

explain: |
  Write four scripts from the same research with the same recipe and you get the same ad four times, with new words. Viewers and the ad platform treat them as one ad, so your test tells you nothing.

  A script type is a different shape for the same truth. One ad has a person talking to camera, one shows the product working, one tells a story, one teaches the viewer something. Each also hands the selling to a different beat: the problem, a doubt, how it works, the proof or the offer. This skill shortlists the types your facts can support (a type that needs a customer story or a test you don't have is skipped, never faked), takes one from each group where it can, and gives each script a starting and ending tone. Pair it with a script-writing skill to write them.

  Every type uses the nine beats in the order taught in Blue Sense Digital's public masterclass, How To Write Meta Ads That Scale, and says where it changes that order. Matching types to what the buyer knows follows Eugene Schwartz.

when:
  - Your last batch of ads all looked like versions of one ad.
  - You have good customer research and want several ads to test against each other.
  - You're not sure which way into the problem will work, and want to test the options properly.
not_for:
  - "You want one hero ad and no test batch: use a single script writer, or write it yourself from your best customer quote."
  - "You have no customer research yet: talk to a few buyers first, then come back with what they said."
  - "You want the finished scripts written for you: this picks the types, so pair it with a script-writing skill."
  - "You want a quick first pass with fewer checks: use the Video ad message planner."

you_give:
  - The buyer, the reason they buy and the offer
  - How much the buyer already knows, and the length
  - What you can supply, such as what buyers tried, the doubt at checkout, process facts, a real customer story, a real shortcoming
  - Your approved claim wording, if you sell a health, supplement, food or money product, so scripts stay inside it
  - How many scripts you want (optional, 4 by default)
you_get:
  - A batch of script types, each with its group, selling beat, opening and tone
  - The fact that meets each type's needs, with its source
  - A list of skipped types, each with the reason
  - The scripts themselves, if you pair it with a writing skill
  - Any of its own checks the batch couldn't pass, named one per line

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. Add its reference file (types.md) too.
  - Paste your buyer, the reason they buy, the offer and the length.
  - List what you can prove. Be honest about what you don't have; missing facts just skip types.
  - Read the skipped list. It shows which facts would open up more types.
  - Take each chosen type to a script-writing skill, such as the one that writes from customer quotes.
output_sample:
  input:
    - Your buyer, why they buy and your offer
    - How much the buyer already knows, and the ad length
    - What you can prove, such as what buyers tried, a real customer story or a real shortcoming
    - How many scripts you want (optional, 4 by default)
  prerequisites:
    - The reference file types.md, which holds the recipe for each script type
  output:
    - name: Batch
      contains: One row per script with its type, group, selling beat, opening, tone and the fact that backs it.
    - name: Spread
      contains: The groups and selling beats used, and a check that no two scripts open on the same fact.
    - name: Skipped types and why
      contains: Each type left out, with the reason or the missing fact it needs.
    - name: CHECKS MISSED
      contains: One line for each of its own checks the batch failed, or none.

how_it_works:
  - title: Shortlists types
    text: Checks all 14 types against your facts, how much the buyer knows and the length. A type that needs something you don't have is skipped.
  - title: Spreads the batch
    text: One type from each group (talk, show, story, teach) where it can, at least three different selling beats, and never two that open on the same fact.
  - title: Loads each recipe
    text: Takes the speaker, tense, beat order and where the product appears from the reference file.
  - title: Sets the tone
    text: Gives each script a starting tone and an ending tone, each matched to something your research shows customers feel.
  - title: Lists what it skipped
    text: Names every type left out and the missing fact or rule behind it.

output_shape: |
  Batch: <n> scripts

  <n>. <type> (<group>) | selling beat: <beat> |
     opens on: <timeline point or fact> | tone: <start> -> <end>
     | needs met: <the fact, and where it came from>
  (one row per script)

  Spread: <groups used>, <selling beats used>, <check that no two
  open on the same fact>

  Skipped types and why
  <type>   <reason, or MISSING: the fact it needs>

  CHECKS MISSED  <one line per check still missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Buyer: the quitter who wants to stick, 28 to 45. Has quit greens
    powders, pill stacks and multivitamins. Doubt: "A gummy can't
    hold enough to replace my powder."
    Reason to buy: one daily habit that lasts.
    Offer: $29.99 first order with the text sign-up, renews at $49.99
    every 4 weeks. 30-day money back, first order only.
    Knows: the problem and the fixes, not Sprout. Length: 45 to 60 s.
    Voice: playful, cheeky, no guilt.
    What we can supply:
    - 1 pack = 60+ ingredients, 21 vitamins and minerals, 6 g fiber;
      tear, tip, eat; no water, no shaker
    - reviews: "the drink was definitely gritty/chalky" (3); "I also
      stopped buying separate probiotic gummies, b12 gummies, and
      multivitamin gummies." (5); "So easy to grab and eat on my way
      to the billion things I have to do as a mom." (15); "I thought
      the first pack I tried tasted terrible, but after the third day
      they started tasting better" (18)
    - survey, of surveyed users: "95% ... take [Sprout] at least
      4-6x per week with 80% taking daily"
    - pectin base, vegan; third-party tested for 70 pesticides
    Not on file: time points, a day count, a test against rivals.
  output: |
    Batch: 4 scripts

    1. Tries in a row (story) | selling beat: how it works (what the
       powders missed) | opens on: Tries, the gritty powder, then the
       pill stack | tone: fed up -> relieved
       | needs met: two tries, greens powders and pill stacks (buyer
       brief), with review 3 for the gritty drink
    2. Doubt first (talk) | selling beat: doubt | opens on: Last
       doubt, "a gummy can't hold enough" | tone: matter of fact ->
       confident | needs met: the buyer's doubt (org context), answered
       by one pack's 60+ ingredients, 21 vitamins and minerals and
       6 g of fiber (product page)
    3. Day in use (show) | selling beat: proof | opens on: a morning,
       pack torn on the way out the door | tone: amused -> proud
       | needs met: when and how it's used (review 15) and the survey,
       said as "of surveyed users"
    4. Flaw first (talk) | selling beat: doubt | opens on: a real
       shortcoming, the first pack can taste odd | tone: matter of
       fact -> pleased | needs met: review 18, and the org context note
       that taste can take a few days

    Spread: story, talk, show; no teach type qualifies, so talk is
    used twice and the batch says so. Selling beats: how it works,
    doubt and proof. No two open on the same fact.
    No worry or guilt: the brand's voice rules them out, so script 1
    starts fed up, not worried.

    Skipped types and why
    The real cause   MISSING: one true cause to teach. The study shows
                     absorption only.
    Time-lapse       MISSING: time points Sprout can back
    Making of        real facts (pectin base, testing), but they answer
                     "is it clean", a doubt this buyer doesn't have
    Straight case    needs met, but its Before point is the powder
                     again, the same fact script 1 opens on
    Turning point    needs a real customer telling her own Trigger
                     day; an AI presenter can't
    Someone noticed  MISSING: a real account of someone else noticing
    Mirror           wrong stage: this buyer knows the problem
    Show it working  no visible result; the tear and tip already sit
                     inside script 3
    Line-up          MISSING: a real test against rivals
    Offer up front   wrong stage: suits buyers who already know Sprout

    CHECKS MISSED  none

tweaks:
  - what: How many scripts
    how: Ask for 3, 4 or 6. Above 4 it still needs a different opening fact for each script, so bigger batches need more facts.
  - what: What you can supply
    how: Each fact you add can open a type. Two things buyers tried open "Tries in a row"; a real shortcoming opens "Flaw first"; a decision in how it's made opens "Making of".
  - what: Length
    how: Stories need about 45 seconds or more, and a time-lapse 60 or more. At 30 seconds the shortlist leans to Show it working, Doubt first and Offer up front.
  - what: Tones your brand avoids
    how: Say if your voice rules out worry or guilt. It takes the nearest allowed tone and says so.

judge:
  - Each script would be called a different ad from its neighbour.
  - Each type's needs are met by a fact you supplied, named next to it.
  - The batch uses at least three selling beats and, where facts allow, all four groups.
  - Two types never open on the same fact.
  - Every skipped type has a reason, and missing facts are marked.

test:
  - Leave out any customer story. "Someone noticed" and "Turning point" should land in the skipped list, never in the batch with a made-up account.
  - Run it twice on the same input. The groups and selling beats should spread the same way, even if the types differ.
  - Read the four openings aloud to a colleague. If two sound like the same ad, ask for a swap from the skipped list.
  - Add one new fact (a real process decision, say) and run it again. The type it opens should appear in the batch or move up the skipped list.

improve:
  - Keep a standing list of what you can supply (what buyers tried, shortcomings, process facts, time points) in "What you need" in the skill file, and add to it as you learn more.
  - Write your brand's banned tones (worry, guilt) into step 4, so the tone plan always fits your voice.
  - Add a note to the type recipes for types that have won for you, so the shortlist tries them first.
  - Test the whole batch at once on the same audience, and save which type won to your org context.
  - Pair it with the skill that writes a video ad script from customer quotes, to write each chosen type.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
    - {name: "Meta Ads Manager", why: "Its A/B test splits one audience between your ads and changes one thing, so the result is fair."}
  inputs:
    - "Past ad results sorted by script type, so the shortlist skips types that failed"
    - "A list of what you can film (founder on camera, product only, customer clips), so every type can be made"
    - "Your brand voice rules, so each type's tone fits"

terms:
  - term: Script type
    meaning: A shape for a script, such as Tries in a row or Show it working, with its own opening, order and selling beat.
  - term: Group
    meaning: What the viewer is watching. A person talking, something shown, a story lived, or a lesson taught.
  - term: Selling beat
    meaning: The part of the script doing most of the selling (the problem, a doubt, how it works, proof or the offer).
  - term: Starting and ending tone
    meaning: How the script feels at the opening and at the call to action. The change between them happens at the promise.
