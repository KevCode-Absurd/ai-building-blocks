new_slug: video-script-pov-editor
name: "Video ad script point-of-view editor"
summary: "Change who tells your video ad script (I, you or she) and when, with every fact and line kept. Get a new version to test, with notes."
job: make-video-ads
thinking: low
thinking_why: "It reshapes what you give it, with few judgement calls."

headline: "Video ad script point-of-view editor"
subhead: Give it a script you trust, and say who tells it (I, you or she) and when (past, present or future). It moves only the voice, keeping every fact, line and length. You get the new script, moved openings and notes on lines it kept.

explain: |
  A new ad from scratch is slow, and a new idea is a new risk. Yet "I did this" and "you do this" land as two different ads, for viewers and for the ad platform. Retelling a script you already trust costs less than any other route to more ads.

  This skill moves the person (I, you, she or they) and the tense (past, present, future). Nothing else changes. How the product works stays in the present tense, because it's true today. The offer still speaks to the viewer, and customer quotes stay word for word. Some lines would become a claim nobody can back, such as an AI presenter saying "it worked for me". Those keep their old wording, and the notes say why.

when:
  - You have a script that sells and want more versions to test without writing new ones.
  - A customer story was written as "I", and you need a version an AI presenter can say honestly.
  - You want the same ad as a direct "you" script and as a told story, to see which one people watch.
not_for:
  - Your script has not run yet and you do not know it works. Test it first, or write a new one with the Customer quote video ad writer.
  - You need to change the message, offer or buying reason. Use the Customer quote video ad writer to write a fresh script.
  - You want the script easier to say aloud, with shorter lines. Use the Ad script read-aloud editor.

you_give:
  - The script, line by line, with on-screen text and picture notes if you have them
  - The new person and tense (for example "third person, past")
  - Who will say it (a real customer, the founder, a creator, or an AI presenter or narrator)
  - A name and pronoun for a third-person version (optional)
  - Your brand voice (optional)
you_get:
  - The same script in the new voice, every line in its old place
  - Opening variants and on-screen text moved the same way
  - Notes on each line kept in the old voice, and why
  - Any of its own checks the script still misses, one line each

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your script underneath, one line per row, with any on-screen text and picture notes.
  - Write the new person and tense, for example "first person, past" or "third person, past, she".
  - Say who will say it. An AI presenter can't claim a result of its own, so this changes what's allowed.
  - Read the notes first. Then read the new script aloud and hold it next to the old one.
output_sample:
  input:
    - Your script, line by line, with on-screen text and picture notes
    - The new person and tense, such as third person, past
    - Who will say it (a real customer, founder, creator or AI presenter)
    - A name and pronoun for a third-person version (optional)
    - Your brand voice (optional)
  prerequisites:
    - A video ad script you already trust, such as one from the Video ad script writer from customer quotes
  output:
    - name: Retold script
      contains: Every line in its old place, with the new spoken words, on-screen text and picture note.
    - name: Opening variants
      contains: Each opening moved to the new voice, with a note on how it leads into line 2.
    - name: Notes
      contains: Lines kept in the old voice and why, picture changes, honesty limits, and any line off by more than 10% in length.
    - name: MISSING
      contains: Anything the skill needed and did not get, such as the speaker.
    - name: CHECKS MISSED
      contains: One line for each of its own checks the new script still misses, or none.

how_it_works:
  - title: Picks the voice
    text: Works out who the new subject is (the speaker, the viewer or a described person) and which tense suits the story.
  - title: Moves the story lines
    text: Retells the opening, the problem and the experience in the new person and tense.
  - title: Keeps facts in the present
    text: How the product works stays in the present tense, and the offer still speaks to the viewer.
  - title: Repairs broken lines
    text: Fixes lines that stop making sense in the new voice, such as a secret told as "you", without adding a claim.
  - title: Keeps the rhythm
    text: Sentence lengths, repeats and brand words stay, and each line stays within about 10% of its old length.
  - title: Moves text and pictures
    text: On-screen text and opening variants move the same way. Picture notes change only when a new person is on screen.
  - title: Checks honesty
    text: Holds old and new side by side for the same facts in the same order, and flags each line where honesty held the move back.

output_shape: |
  <line number>. "<spoken words in the new voice>"
     text: <on-screen text, moved the same way>
     picture: <picture note, changed only if a new person is on screen>
  (every line kept, in its old place)

  OPENING VARIANTS
  "<variant in the new voice>"  (<leads into line 2, or kept and why>)

  NOTES
  Kept in the old voice: <line numbers, and why>
  Pictures:  <what changed on screen>
  Honesty:   <lines where honesty limited the move>
  Length:    <any line more than 10% off its old length>
  MISSING:   <anything it needed and didn't get>

  CHECKS MISSED: <one line per check missed, or none>

example:
  business: sprout
  input: |
    [the skill]

    Script (AI presenter, talking to camera, "you", present):
    1. "You bought the big tub of greens powder. Again." /
       presenter at a kitchen counter holding a half-used powder tub
    2. "By week two it's chalky sludge in a shaker you never clean." /
       presenter frowns at a shaker bottle with a green ring inside
    3. "So the tub sits at the back of the cupboard." /
       a cupboard door closes on the tub
    4. "Sprout is 60+ ingredients, 21 vitamins and minerals and 6 g of
       fiber in one daily pack." / text: 60+ ingredients. 6 g fiber /
       a daily pack torn straight across the top, gummies into a palm
    5. "No water, no mixing, no shaker." / text: No shaker /
       green gummy bears in the palm
    6. "One reviewer wrote: 'Sprout has been the one thing I've been
       able to stick to.'" / text: Customer review, brand site /
       the pouch on the counter, closed at its resealable top
    7. "Your first order is $29.99 with the text sign-up. It renews at
       $49.99 every 4 weeks." / text: $29.99 first order with SMS
       sign-up / pouch and one torn pack side by side
    Opening variants: "Still paying for a tub you don't drink?" /
    "Rip. Tip. Enjoy."

    New voice: third person, past. Pronoun: he.
    Who says it: an AI narrator, off screen.
  output: |
    1. "He bought the big tub of greens powder. Again."
       picture: a man at a kitchen counter holding a half-used powder
       tub, not looking at the camera. Narrator heard over it.
    2. "By week two it was chalky sludge in a shaker he never cleaned."
       picture: he frowns at a shaker bottle with a green ring inside
    3. "So the tub sat at the back of the cupboard."
       picture: a cupboard door closes on the tub (unchanged)
    4. "Sprout is 60+ ingredients, 21 vitamins and minerals and 6 g of
       fiber in one daily pack."
       text: 60+ ingredients. 6 g fiber
       picture: unchanged. The pack is torn straight across the top.
    5. "No water, no mixing, no shaker."
       text: No shaker
       picture: unchanged
    6. "One reviewer wrote: 'Sprout has been the one thing I've been
       able to stick to.'"
       text: Customer review, brand site
       picture: unchanged
    7. "Your first order is $29.99 with the text sign-up. It renews at
       $49.99 every 4 weeks."
       text: $29.99 first order with SMS sign-up
       picture: unchanged

    OPENING VARIANTS
    "Still paying for a tub he never drank."  (leads into line 2)
    "Rip. Tip. Enjoy."  (kept, see notes)

    NOTES
    Kept in the old voice:
    - Lines 4 and 5: how the product works stays in the present
      tense. It is true now, not part of his story.
    - Line 6: a customer quote stays word for word in any voice.
    - Line 7: the price and renewal are spoken to the viewer, in the
      present. The narrator tells his story, then speaks straight
      to the viewer for the close.
    - Variant 2: a brand line, kept as written.
    Pictures: lines 1 and 2 change from a presenter talking to camera
    to a man shown on screen with the narrator over him. He is a
    fictional adult, never called a customer.
    Honesty: the narrator tells the powder story as a story. Nothing
    says he stuck with Sprout or felt better, because the original
    never said it either. The review stays labeled as a review.
    Length: every line within 10% of its old length in characters.
    Variant 1 is one character shorter; "he never drank" keeps the
    question's sting as a statement.
    Same 7 lines, same order, same facts. MISSING: nothing.

tweaks:
  - what: The new person
    how: '"I" suits a story a real customer tells. "You" suits a direct script. "She" or "they" suits a narrator over footage. If an AI will say it, ask for "you" or "she", because it can''t honestly say "I".'
  - what: The tense
    how: Past tense sounds like a story that happened. Present sounds like now. Future sounds like a promise or warning, so use it rarely. Ask for two tenses to get two versions.
  - what: Who says it
    how: Switch from "AI presenter" to "real customer" and it allows more "I" lines, with [brackets] left where the customer's own true details go.
  - what: The name and pronoun
    how: Give a first name and pronoun for third person ("Dana, she"). Without one it uses "they" and never makes up a surname or back story.

judge:
  - Hold old and new side by side. Every line is there, in its old place, with the same facts.
  - Every number, price, renewal term and customer quote is word for word the same.
  - Lines about how the product works are still in the present tense.
  - The offer and call to action still speak to the viewer.
  - Read it aloud. No line sounds translated or stiff.
  - Nothing an AI presenter says claims a result of its own.

test:
  - Move a script, then ask it to move the new version back. The round trip should land close to your original, word for word. If facts drift, it is changing more than the voice.
  - Run the same script and voice twice. The story lines may differ a little; numbers, prices and quotes never should.
  - Ask for an "I" version twice, once with "AI presenter" and once with "real customer". The AI version should turn personal results into reports. If both read the same, it skipped the honesty rules.
  - Give a colleague the old and new scripts and ask them to circle any line that now says something new. They should find none.

improve:
  - Add your fixed brand lines and offer wording to step 7 of the skill file as words it must never change, so they survive every voice.
  - If the same speaker always reads your ads (an AI narrator, say), write that into "What you need" as the default.
  - Paste your allowed claims under the checks, so it flags any new wording that strays from them.
  - Only retell scripts that have already done well, and note which voice won in your brand file next to the script.
  - Pair it with a skill that makes a script easy to say aloud, and one that plans which versions to test against each other.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Moving a script into a new voice while holding every fact works well in any strong chat AI."}
  inputs:
    - "The results of the original ad (watch time, sales), so you only retell a script worth more versions"
    - "Two or three customer reviews in their own words, so an \"I\" version for a real customer has true details to use"
    - "Your list of allowed and banned claims, so a moved line never drifts into a new claim"

terms:
  - term: Person
    meaning: Who the script is about. First person is "I", second is "you", third is "she", "he" or "they".
  - term: Tense
    meaning: When it happens. Past ("I stopped"), present ("I stop") or future ("you'll stop").
