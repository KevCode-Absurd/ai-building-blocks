new_slug: visual-twist-image-ad-maker
name: "Visual twist image ad maker"
summary: "Paste a buyer's words. Get a one-twist image ad, its prompt and a score out of 100."
job: make-image-ads

headline: "Visual twist image ad maker"
subhead: Give it the problem in a buyer's words, your product facts, a product photo and your colours. It anchors the idea in a real moment and adds one twist that is both unexpected and relevant. You get the words, the layout, an image prompt and a score out of 100.

explain: |
  Ask an image tool for an ad and you get a centred product, a floating headline and a pretty picture of the benefit. People scroll past it, because they've seen it a thousand times and nothing in it is about them.

  This skill builds the picture from one thought you want the buyer to have. It anchors that thought in a real moment from a review, then adds one twist: two things side by side, merged, or one swapped in where another belongs. Research on ads shows people remember what is both unexpected and relevant, so the skill checks both before it writes a word. It keeps the frame simple, gives the headline one job (a gain, news or a question about the picture) and builds the real product from your photo.

when:
  - Your image ads look like everyone's, with a product in the middle and a benefit headline.
  - You have a review that describes a vivid moment and want a picture built on it.
  - You need an image prompt with a clear layout, because "make an ad for my product" keeps giving you the same ad.

you_give:
  - The problem in a buyer's words and the moment it shows
  - Your product facts, the line on how it works and what you never show
  - A real product photo, attached
  - Up to two brand colours and your typeface
  - A live offer (optional)
you_get:
  - A concept card with the one thought, the moment, the twist and the unexpected-and-relevant check
  - A headline with its job, a support line and the line under the image
  - Layout notes and how to draw the product from your photo
  - An image prompt ready to paste, plus a MISSING list
  - A score out of 100 from the skill's five checks, with one line per check missed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste one review that describes the problem, word for word, and say when it happens.
  - Paste your product facts and claims, and attach your product photos.
  - Give your colours as hex codes and your typeface name.
  - Read the MISSING lines, then paste the image prompt into your image tool and set the words in your design tool.

how_it_works:
  - title: Writes the one thought
    text: Finishes "After one look, the buyer thinks..." in the buyer's own words.
  - title: Anchors it in a moment
    text: Names the exact place, object and time from the review, so the idea is relevant.
  - title: Adds one twist
    text: Picks the simplest of four structures (plain with one exact detail, side by side, merged, swapped in) that makes the moment unexpected.
  - title: Checks both halves
    text: Keeps the idea only if it's unexpected and relevant. Unexpected alone is a gimmick; relevant alone is wallpaper.
  - title: Writes the words
    text: A headline of 7 words or fewer with one job (gain, news or a question about the thing), plus the line under the image.
  - title: Lays out the frame
    text: One focal point, the real product readable at thumbnail size, words in one quiet area, at most two colours.
  - title: Writes the prompt
    text: Problem first, then the twist, then the product from your photo, with scale set against something ordinary.

output_shape: |
  ONE THOUGHT  <what the buyer thinks after one look> (<quote and source>)
  MOMENT       <place, object, time>
  TWIST        <plain detail | side by side | merged | swapped in>
               Concludes: <goes with | is like | is the opposite of>
  CHECK        Unexpected: <yes or no>  Relevant: <yes or no>
  HEADLINE     <7 words or fewer>  (job: <gain | news | curiosity>)
  SUPPORT      <one line in the brand's words, or none>
  LINE UNDER   <about 27 characters>
  LOOK         <photo | drawn or 3D | sketch>, <why>

  FRAME (<4:5 | 9:16>)
  Focal point / Words / Product / Scale / Colours

  PRODUCT TREATMENT
  <which photo, how it's drawn, what's left out>

  IMAGE PROMPT
  <problem first, twist, product from the photo, words in quotes>

  MISSING:  <quote, photo or fact still needed>
  Not used: <options dropped, and why>
  SCORE     <n>/100 (<passed> of 5 checks) | missed: <one line each>

example:
  business: sprout
  input: |
    [the skill]

    Problem: review 6, "Plus not having to clean a shaker bottle or
    extra dishes for greens stuff in powder form, is absolutely
    excellent!" and review 3, "the drink was definitely
    gritty/chalky."
    Moment: a weekday morning at the sink.

    Product: Sprout, daily greens gummies. Tear a pack, eat the
    gummies. No water, no mixing. 6 g prebiotic fiber.
    Brand line: "No more gagging on pills, sloshing chalky powders, or
    cleaning messy counters."
    Never: "fix", weight or energy results, before-and-after.

    Photos: the adult pouch on a soft gradient; one daily pack torn
    straight across the top, gummies pouring into a palm.
    Look: deep forest green #002C17, sunflower yellow #FFCC2E. Work
    Sans bold. Photos are bright and sunny, never clinical.
    Offer: none.
  output: |
    ONE THOUGHT  "Greens shouldn't come with washing up." (review 6,
                 "not having to clean a shaker bottle or extra dishes")
    MOMENT       Kitchen counter, weekday 7am, the dish rack by the sink
    TWIST        Side by side. A dish rack crammed with every part of
                 one powder shaker drying (bottle, lid, mixing ball,
                 scoop), and beside it on the bare counter one torn
                 daily pack with a few gummies.
                 Concludes: is the opposite of
    CHECK        Unexpected: yes, a full rack for one drink.
                 Relevant: yes, it's review 6's complaint.
    HEADLINE     Greens with nothing to wash.  (job: gain)
    SUPPORT      No more sloshing chalky powders or cleaning messy
                 counters. (the brand's own line, cut at whole phrases)
    LINE UNDER   One pack. Nothing to rinse. (27)
    LOOK         Photo, because the point is a real mess. Bright
                 morning light, as the brand shoots.

    FRAME (4:5)
    Focal point  the crowded dish rack, left two thirds, cropped at the
                 left edge
    Words        headline on the plain tiled wall at top, deep forest
                 green; support line under it, smaller
    Product      the torn pack lying flat on the bare counter, right
                 third, gummies spilling from the torn top edge
    Scale        the shaker bottle stands as tall as the rack's plate
                 slots; a mug at the far edge for size
    Colours      deep forest green words; sunflower yellow only as a
                 thin underline under "nothing"

    PRODUCT TREATMENT
    From the torn-pack photo: the pack torn straight across its top
    edge, never the side or a corner. The pouch stays out; it is never
    shown torn. Pack size taken from the photo, not guessed.

    IMAGE PROMPT
    Tall 4:5 photo of a bright kitchen counter at 7am in warm morning
    sun. On the left, a dish drying rack cropped at the frame edge,
    crammed with the parts of one plastic powder shaker drying: the
    bottle, its lid, a wire mixing ball and a scoop, water beading on
    them, a faint green film in the bottle. On the bare counter to the
    right, one small flat green sachet lying flat, torn straight across
    its top edge, a few small green gummy bears spilling out. A mug at
    the far edge. Plain cream tiled wall across the top for text. No
    other words, no logos, no people.

    MISSING:  none.
    Not used: merged and swapped in, since side by side already lands.
              A news headline, since no new fact fits this thought.

tweaks:
  - what: The one thought
    how: Change the sentence and the whole ad changes. For Sprout, "A gummy can hold enough" leads to a fact-led picture instead of a mess.
  - what: The twist
    how: Ask for "merged" or "swapped in" when side by side looks like ads your buyers already see. Each step asks more of the viewer, so test it on someone first.
  - what: The look
    how: Name it if you have a house look. A sketch suits how it works; a drawn look suits a private subject; a photo suits a real cost or mess.
  - what: The frame size
    how: Say "tall 9:16" and the words move out of the top seventh and the bottom third, where the app's buttons sit.

judge:
  - Cover the headline. The picture alone shows the problem.
  - You can say in one sentence why the picture is unexpected and why it's relevant.
  - The product is in the ad, small and matching your real photo, not pasted in a corner.
  - The picture shows the problem or its cause, never a result like a changed body or a before-and-after.
  - The headline names a moment or a gain, not a condition the reader has.
  - The prompt mentions the problem before the product.

test:
  - Run it on the problem your best-selling ad already shows. Compare the twist with your ad. If yours is still stronger, name your structure in the input and run again.
  - Make the image, cover the words and show it to someone who has the problem. If they can't say what's wrong in a second, ask for a simpler twist.
  - Run it twice with the same quote. The one thought and the moment should match.
  - Compare the drawn product with your real photo. Shape, colours and large print must match; any invented small print means the prompt needs the "leave small print out" line.

improve:
  - Paste your brand colours and typeface into "What you need", and attach the same product photos each run, so every run builds the product the same way.
  - Add your show-it-right rules (how the pack opens, what's never shown) to the check list.
  - Save each one thought that wins, with its twist, in your brand file, and name it in your next run.
  - Pair it with a skill that checks finished image ads for errors before you spend.

works_best_with:
  tools:
    - {name: "GPT Image", why: "Keeps your real product close to its reference photo, and sets short headlines better."}
    - {name: "Nano Banana", why: "Takes up to 6 product photos and is Google's pick for brand consistency, so the product and colours stay true."}
  inputs:
    - "Two or three of your ads that people ignored, so the twist avoids looking like them"
    - "A photo of the real moment from your team or a customer (with permission), so the scene has the one exact detail"
    - "A product photo from the angle the scene needs, so the image model doesn't have to guess the side it can't see"

terms:
  - term: Twist
    meaning: The one unexpected move in the picture, such as two things side by side or one thing swapped in where another belongs.
  - term: Unexpected and relevant
    meaning: The test every idea must pass. It must surprise the viewer and be about their problem at the same time.
  - term: Image prompt
    meaning: The text you paste into an image tool to make the picture.
