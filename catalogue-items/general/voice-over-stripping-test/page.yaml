new_slug: voice-over-stripping-test
name: "Voice-over stripping test"
summary: "Find which voice-over lines your video script can cut. Get each line sorted as telling or counterpoint, plus a shorter script."
job: make-video-ads
thinking: medium
thinking_why: "Each line needs a judgment call, but the sort is simple: telling or counterpoint."

headline: "Voice-over stripping test"
subhead: "Paste a video script with narration marked. It takes all the narration out and checks if the picture still tells the story. Then it sorts each line as telling or counterpoint. You get a verdict on every line and a shorter revised script."

explain: |
  Narration often explains what the viewer can already see. A voice says "he was nervous" over a shot of a man gripping a chair. The line steals the moment from the picture. The viewer stops watching and starts listening.

  This skill runs a stripping test on your video script. It splits the script into narration and scenes, then names the feeling each scene should leave. It removes all the narration and reads what is left. If the story still works, most of the narration was not needed.

  Then it sorts each narration line. A telling line repeats the picture. A counterpoint line adds what the picture cannot. It cuts the telling lines or turns them into something seen or done. It keeps only counterpoint, and it keeps any open meaning you left there on purpose.

when:
- "Your video script has a voice that feels like it is explaining everything."
- "A video ad runs long and you need to cut words, not pictures."
- "You are not sure whether the narration helps."
- "A client says the voice-over feels like it talks down to the viewer."

not_for:
- "Your script has no narration. There is nothing to strip. Use the Video ad script line checker to check the lines you have."
- "Spoken lines that must stay, such as price, terms or legal wording. Mark them as must-keep, and the test will not cut them."
- "You want the spoken words to sound natural when read out loud. Use the Ad script read-aloud editor."
- "You have no script yet. Use the Video ad script writer from customer quotes first, then come back."

you_give:
- "The full script with narration marked as voice-over or VO, scene by scene, from your script document"
- "What each scene should make the viewer feel (optional)"
- "What is seen in each shot, from your shot list or storyboard (optional)"
- "The length limit in seconds (optional)"
you_get:
- "A verdict on the story with the narration stripped out"
- "Every narration line sorted as telling or counterpoint, with a reason"
- "A revised script with the cuts and the replacement actions"
- "A note on any open meaning kept on purpose"
- "Any gaps and any check the revised script still misses"

how_to_use:
- "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it in. It needs no tools or files."
- "Paste the script with narration clearly marked. If a scene has no picture note, add one line saying what is seen."
- "Write the feeling you want for each scene, if you know it. Mark any line that must stay."
- "Read STRIPPED READ first. Then go through each line and say which cuts you reject."
- "Use REVISED SCRIPT as your next draft. Then run it through the Ad script read-aloud editor."

how_it_works:
  - title: "Split narration from scene"
    text: "Separate the script into narration lines and scene content (what is seen and heard)."
  - title: "Name the feeling"
    text: "For each scene, write in one line what the viewer should feel or understand."
  - title: "Strip and reread"
    text: "Remove all narration and read what is left from start to end."
  - title: "Sort each line"
    text: "Label every narration line."
  - title: "Cut or dramatise"
    text: "For each telling line, either cut it or turn it into something seen or done, and write the replacement action."
  - title: "Keep counterpoint only"
    text: "Keep counterpoint lines only if the stripped version cannot say it."
  - title: "Reread cold"
    text: "Read the new version once more from the top as if for the first time."
  - title: "Check it"
    text: "Go through \"Check before you hand it back\" one line at a time and fix any check that fails, if you can."

output_shape: |
  STRIPPED READ
  <does the story still work, which scenes broke>

  NARRATION LINES
  1. "<line>" | telling or counterpoint | reason | action: cut / show as <> / keep

  REVISED SCRIPT
  <the script with the changes>

  AMBIGUITY KEPT
  <where and why>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check still missed, or none>

output_sample:
  input:
    - "Your video script with the narration marked as voice-over or VO"
    - "What each scene should make the viewer feel (optional)"
    - "A picture note for each scene, such as a shot list (optional)"
    - "A length limit, and any line that must stay (optional)"
  output:
    - name: "STRIPPED READ"
      contains: "Whether the story still works with no narration, and which scenes lost their meaning."
    - name: "NARRATION LINES"
      contains: "Every line sorted as telling or counterpoint, with a reason and what happened to it."
    - name: "REVISED SCRIPT"
      contains: "Your script with the telling lines cut or turned into action, and only counterpoint kept."
    - name: "AMBIGUITY KEPT"
      contains: "Where it left the meaning open on purpose, and why."
    - name: "MISSING"
      contains: "Picture notes or facts it needed and did not get."
    - name: "CHECKS MISSED"
      contains: "One line for each check the revised script still fails, or none."

tweaks:
  - what: "Scene feeling"
    how: "State the feeling for each scene. Cuts are judged against it."
  - what: "Length limit"
    how: "Give a time limit. It decides how many counterpoint lines survive."
  - what: "Required claims"
    how: "Mark any line that must stay for legal or product reasons."
  - what: "Picture detail"
    how: "Describe each shot. The test needs to know what is seen."

judge:
- "No kept line describes what is on screen."
- "Each cut line has a reason."
- "The stripped version makes sense on its own."
- "The remaining narration is shorter than before."
- "Nothing you needed to say is missing."

test:
- "Read the stripped script aloud to someone and ask what they understood."
- "Check each kept line adds a fact, contrast or irony the picture cannot."
- "Run it twice. The telling and counterpoint sort should match."
- "Film or storyboard one cut scene and see if it works."

improve:
- "Add your brand's required lines to a must-keep list."
- "Add the type of narration your style uses, such as a founder voice."
- "Keep a file of counterpoint lines that worked."
- "Pair it with an on-screen text planner if you move words to the screen."

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Sorting lines and rewriting scenes is text work."}
    - {name: "A video editor", why: "Cut the real footage after the script is stripped."}
  inputs:
    - "A shot list or storyboard"
    - "The brand's required claims"
    - "The length limit in seconds"

terms:
  - term: "Telling"
    meaning: "A narration line that says what the picture already shows or explains a feeling."
  - term: "Counterpoint"
    meaning: "A narration line that adds meaning the picture cannot, such as a contrast or irony."
