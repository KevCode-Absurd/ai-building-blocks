new_slug: wakeups-how-agents-alert-each-other-implementation-planner
name: Agent wakeup and stale-claim builder
summary: Build an agent wakeup flow with scoped events, duplicate checks, claim leases, retries and recovery.
job: build-software
headline: Agent wakeup and stale-claim builder
subhead: Build an agent wakeup flow with scoped events, duplicate checks, claim leases, retries and recovery.
explain: |-
  Share scoped event signals, deduplication key, claim lease and agent state. Get a bounded wakeup dispatcher with retry and stale-claim recovery.

  The complete method and its supporting files are in the download. It marks missing inputs and separates proposed actions from actions that were actually completed.
when:
  - You need a bounded wakeup dispatcher with retry and stale-claim recovery.
  - You are adding this function to an agent system.
  - You need to compare an existing version with the supplied starter.
you_give:
  - Scoped event signals, deduplication key, claim lease and agent state
you_get:
  - A bounded wakeup dispatcher with retry and stale-claim recovery
  - A failure checklist and synthetic test cases
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
how_it_works:
  - title: Step 1
    text: Persist one event signal with a deduplication key.
  - title: Step 2
    text: Claim eligible events atomically.
  - title: Step 3
    text: Keep client and agent scope attached.
  - title: Step 4
    text: Respect pause and budget limits.
  - title: Step 5
    text: Dispatch a bounded heartbeat.
  - title: Step 6
    text: Mark consumed only after handoff.
  - title: Step 7
    text: Reset stale claims safely and avoid creating extra user-visible threads.
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - You need one agent run loop that does a single task per run. Use the Single-task agent heartbeat builder.
  - You need a job queue that survives crashes and caps retries. Use the Recoverable agent job queue builder.
  - You need a task table where an agent claims one task at a time. Use the Agent issue and checkout builder.
output_sample:
  input:
    - Your list of events that should wake an agent (for example, a proposal approved or a task assigned)
    - The key that marks two events as the same one
    - How long an agent may hold a claim before it counts as stale
    - How your agents store their state and pause or budget limits
  prerequisites:
    - A codebase with an agent system already running a regular heartbeat
    - Someone who can review and test the code before it goes live
  output:
    - name: Wakeup dispatcher
      contains: Draft code that saves one wakeup per event, claims it once, and hands it to the right agent.
    - name: Duplicate check
      contains: How the dedup key stops the same event from waking an agent twice.
    - name: Stale-claim recovery
      contains: A rule that puts claims back in the queue when a worker crashes before finishing.
    - name: Failure checklist
      contains: The ways this can break, such as lost wakeups, event storms and loops, with what to check.
    - name: Synthetic test cases
      contains: Test cases built from made-up events that cover duplicates, crashes and paused agents.
