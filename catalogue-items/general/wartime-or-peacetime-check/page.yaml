new_slug: wartime-or-peacetime-check
name: "Wartime or peacetime check"
summary: Is your company in peacetime or wartime? Get a call backed by evidence, a plan to lead in that mode and a signal to switch.
job: think-and-decide
thinking: medium
thinking_why: "It weighs evidence for a call and has to test a tempting shortcut."

headline: "Wartime or peacetime check"
subhead: Describe your company's position and any numbers you trust. The skill lists the evidence on each side and calls peacetime or wartime. It tests the shortcut people want, such as a pivot or a deal. You get a plan for that mode, what to tell the team and a signal that says the mode has changed.

explain: |-
  A calm company needs a leader who builds process and widens the market. A company fighting for survival needs one who cuts, decides fast and tells the team the truth. The wrong style does damage: long debate in a fight, or panic in a calm period.

  This skill asks for the facts, lists the evidence for each mode and makes the call. Then it gives the plan that fits: widen and delegate, or cut and stop debating. It uses only the numbers you give it. It will not make up a runway limit or a deadline.

  It also tests the shortcut people are pushing against fixing the real problem. It sets what the team hears and how often, and writes the signal that means it is time to switch modes. This is a management frame based on Ben Horowitz's peacetime and wartime CEO idea. It is not financial or legal advice.

when:
  - Results are slipping and you cannot tell if it is a blip or a threat.
  - People keep proposing a pivot.
  - Your team argues over details while cash falls.
  - A big rival has just made a move and you do not know how hard to react.
not_for:
  - You have one bad month and no cash or customer numbers. Do a normal review first. Wartime needs a real threat to survival.
  - You need to decide whether to change what you sell. Use the Pivot or persevere decider.
  - You want to test a budget against a bad year. Use the Bad year plan stress tester.

you_give:
  - "Your situation: what you sell, who to, how you are doing and what worries you"
  - Numbers you trust, such as growth, cash months or churn (optional)
  - The shortcut people want, such as a pivot or a deal (optional)
  - How long you can wait for evidence (optional)
you_get:
  - A call on peacetime or wartime, with the evidence on each side
  - A plan for that mode, including what to stop
  - A test of the shortcut people want
  - What the team hears, and how often
  - A signal that tells you the mode has changed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - "Describe where you stand in a paragraph: what you sell, who to and what worries you."
  - Add the numbers you trust. With no numbers, treat the call as a first read.
  - Say what shortcut people are pushing, in exact words.
  - Read the evidence on both sides before you read the call. Fix any fact it got wrong.
  - Read the plan twice before you share the team message.

how_it_works:
  - title: Describes the threat
    text: One paragraph of facts on what threatens the company, such as a rival, a rule change or falling cash. Or it says there is none.
  - title: Calls the mode
    text: Peacetime is a big lead in a growing market. Wartime is a threat to survival. It lists evidence on each side and what would settle a close call.
  - title: Plans for that mode
    text: "Peacetime: where to widen and what to delegate. Wartime: what to cut, the details that matter and what to stop debating."
  - title: Tests the shortcut
    text: Asks what the shortcut solves, what it leaves and what evidence supports it, against fixing the real problem.
  - title: Sets what the team hears
    text: Writes what the team is told, how often and by whom, with bad news in full.
  - title: Writes the change signal
    text: Names one or two measures or events that mean it is time to switch modes. Any number you did not give is marked MISSING.
  - title: Checks its own work
    text: Runs its own checks, fixes what it can and names any it missed.

output_shape: |
  THREAT
  <paragraph, or none>

  MODE
  <peacetime / wartime> | Evidence for: <...> | Evidence against: <...> | Would settle it: <...>

  PLAN
  Widen / delegate: <...>   or   Cut / details that matter / stop debating: <...>

  SHORTCUT TEST
  <shortcut> | Solves: <...> | Leaves: <...> | Evidence: <...>

  TEAM MESSAGE
  <what, how often, who>

  CHANGE SIGNAL
  <measure or event>

  MISSING
  <gaps>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: "Numbers"
    how: "Cash months, growth and churn move the call more than words."
  - what: "Your size"
    how: "A five-person team and a fifty-person team decide differently."
  - what: "The shortcut"
    how: "Name it exactly. The test depends on it."
  - what: "Your time frame"
    how: "Say how long you can wait for evidence."

judge:
  - "The mode has figures behind it."
  - "The shortcut is questioned."
  - "The plan lists what to stop."
  - "A sign for changing mode is named."
  - "No figure appears that you did not give."

test:
  - "Run it on a past period and see if the call matches what happened."
  - "Show the mode call to a colleague who disagrees and note why."
  - "Run it twice with the same facts. The call should not flip."

improve:
  - "Add the figures you trust most to the evidence step."
  - "Add a past crisis as a test case."
  - "Save the change signal in your review notes."
  - "Pair it with \"Claim skepticism kit\" to test the shortcut."

works_best_with:
  tools:
    - name: Any good chat AI
      why: Weighing evidence for a call is text work. Claude, ChatGPT and Gemini all do it with this skill.
    - name: Your finance sheet or dashboard
      why: Cash months, growth and churn move the call more than words do. Copy in the figures you trust.
  inputs:
    - Cash and runway figures
    - Competitor moves
    - Customer churn or lost-deal notes

terms:
  - term: "Peacetime and wartime"
    meaning: "Calm growth with a lead, against a fight for survival."
output_sample:
  input:
    - Your situation and what worries you
    - Numbers you trust (optional)
    - The shortcut people want (optional)
  output:
    - name: THREAT
      contains: What threatens the company, in one paragraph of facts, or a note that there is none.
    - name: MODE
      contains: Peacetime or wartime, with evidence for, evidence against and what would settle it.
    - name: PLAN
      contains: Widen and delegate for peacetime. For wartime, what to cut, what matters most and what to stop debating.
    - name: SHORTCUT TEST
      contains: What the shortcut solves, what it leaves and the evidence for it.
    - name: TEAM MESSAGE
      contains: What the team hears, how often and from whom.
    - name: CHANGE SIGNAL
      contains: One or two measures or events that mean it is time to switch modes.
    - name: MISSING and CHECKS MISSED
      contains: Facts you did not give, and any of its own checks it could not pass, or none.
