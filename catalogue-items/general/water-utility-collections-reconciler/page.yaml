subhead: A water billing, collection and receivables bridge. Share same-period produced and billed cubic meters, approved average realized billed rate, opening receivables, current and arrears receipts, authorized adjustments and operating cash.
explain: |-
  A water billing, collection and receivables bridge.

  Utility collections finance. Illustrative figures only in USD unless labelled otherwise. This focused operating schedule does not establish a complete business forecast, accounting treatment, market price or approval.
