  - You need a water billing, collection and receivables bridge.
  - You work on utility collections finance and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Same-period produced and billed cubic meters, approved average realized billed rate, opening receivables, current and arrears receipts, authorized adjustments and operating cash.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A water billing, collection and receivables bridge.
