thinking: medium
thinking_why: "It writes or plans with a handful of checks."
new_slug: watercolor-image-ad-maker
name: "Watercolor image ad maker"
summary: "Plan a watercolor image ad from your selling idea and product photos. You get an image prompt, the words for the ad and a layout."
job: make-image-ads

headline: "Watercolor image ad maker"
subhead: Give it your selling idea, brand file and product photos. It picks one moment and the paint technique caught in it, then checks the picture against your claims. You get a watercolor image prompt, the ad words and a layout.

explain: |
  A photo can't show sixty ingredients in one pack, or a scent filling a room. A watercolor can, and a calm painting stands out in a loud feed. The risk is a lovely picture nobody can read in a glance, with a pack whose label the image tool has spelled wrong.

  This skill plans one image. It picks the moment from what your buyer knows, then the show job the picture must do (a reveal, something spreading, two things joining, parts adding up, a mood calming, or the product held still) and the paint technique frozen mid-change. It reads the picture as a sentence and keeps it only if your claims back it. Then it applies the image-ad rules: a headline of 7 words or fewer, at most 3 other things to read, big type on bare paper, strong contrast, feed sizes, and your real label laid over the painted one.

when:
  - Your product sells on what's inside it, a scent or a mood, and a product photo looks flat.
  - You run a watercolor video and want a still that matches it.
  - You want a calm image ad that people new to you can read in a glance.
not_for:
  - "Your product needs proof or real texture to sell: use a plain product photo instead."
  - "You want a moving ad: use the watercolor ad script skill, which plans a video."
  - "You need food that looks tasty or a believable human face: use a real photo shoot or a photographer."

you_give:
  - The reason someone buys, what the buyer knows and the selling idea
  - Your brand file, with label text, ingredients, approved claims and offer
  - Photos of your product's front, side and top, attached (optional, needed if it appears)
you_get:
  - A moment plan with the paint technique and the claim it implies
  - A layout for 4:5 or 1:1, with a quiet area of bare paper for the words
  - The words on the image, an image prompt and the post words
  - The edit step that lays your real label over the painted one

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your selling idea and brand file, and attach the product photos.
  - Read the moment plan. If the implied sentence isn't something you can say, ask for another show job.
  - Make the image from the prompt, then lay the real label and the words on it in your editor.
  - Show it to someone for 2 seconds. If they can't say what it's for, ask for a simpler moment.
output_sample:
  input:
    - Why someone buys, what your buyer already knows and your selling idea in one sentence
    - Your brand file with label words, ingredients, approved claims and offer
    - Photos of your product from the front, side and top (optional, needed if it appears)
  prerequisites:
    - An AI that can make images, if you want the picture made in the chat. Claude cannot draw unless an image tool is connected.
    - Your brand brain and buyer brief make the result better, but they are not required.
  output:
    - name: Moment plan
      contains: The moment, the show job, the paint technique, the sentence the picture implies and the claim that backs it.
    - name: Layout
      contains: The size, 4:5 or 1:1, and a top to bottom map of picture, quiet area and product spot.
    - name: Words on the image
      contains: A headline of 7 words or fewer and up to 3 more things to read, each with its source.
    - name: Image prompt
      contains: A prompt in a set order, ending with the label lines, plus a list of plain nouns to avoid.
    - name: Post words
      contains: The primary text, the headline field and the button label for the ad.
    - name: Edit step
      contains: How to lay your real label over the painted one, place the words and check contrast.
    - name: Checks missed
      contains: One line for each check that failed, or none.
    - name: MISSING lines
      contains: Any facts the skill needed and did not have, marked instead of guessed.

how_it_works:
  - title: Checks the fit
    text: Paint suits contents, scent, mood and many parts. It tells you to use a photo when proof or real texture is the point.
  - title: Picks the moment
    text: From what the buyer knows, then one of six show jobs and the paint technique caught mid-change.
  - title: Sets the look
    text: Paper, texture, 3 or 4 colors that won't mix to mud, and a quarter of the frame left as bare paper.
  - title: Reads the picture as a claim
    text: Writes the sentence the picture implies and keeps it only if your claims back it.
  - title: Applies the image-ad rules
    text: The glance test, a short headline, at most 3 other things to read, 30 px type, 4.5:1 contrast, 4:5 or 1:1.
  - title: Writes the prompt and words
    text: An image prompt in a set order, the words on the image, the post words, and the real label laid on in editing.

output_shape: |
  MOMENT   <problem / change caught halfway / product held>
  SHOW JOB <reveal, spread, join, build, calm, hold>, <technique>
  It implies: "<sentence>"  Source: <claim or fact>

  LAYOUT   <4:5 or 1:1>, <pixels>
  <0 to n %> <quiet area: words> | <n to n %> <picture> | <product spot>

  WORDS ON THE IMAGE
  Headline (<n> words): "<...>"
  <up to 3 more>: "<...>"  Source: <...>

  IMAGE PROMPT  <subject, setting, paint, light, framing, "label lines">
  AVOID FIELD   <plain nouns>

  POST WORDS  Primary text <...> | Headline field <...> | Button <...>
  EDIT STEP   <label overlay, word placement, contrast check>
  CHECKS      <glance test, words, type, contrast, size>
  CHECKS MISSED: <one line each, or none>
  MISSING: <facts it needed>

example:
  business: sprout
  input: |
    [the skill]

    Selling idea: a whole shelf of greens in one small pack.
    Buyer: the quitter who wants to stick, 28 to 45. Gave up greens
    powders ("gritty/chalky"). Knows the fixes, not Sprout. Runs in
    the Instagram feed.
    Product: Sprout Low Sugar, 28 daily packs. Glossy deep green
    stand-up pouch, big yellow wordmark "Sprout", yellow bear face top
    right, "28 Daily Packs" at the bottom. Photos attached: front,
    side, top.
    Ingredients include organic kale, spinach, spirulina, chlorella,
    wheatgrass, broccoli and beet; acai, goji, pomegranate.
    Approved: "60+ ingredients, 21 vitamins & minerals, and 6g fiber"
    in 1 pack. Never say: fix, energy or immunity results, weight loss.
    Colors: forest green #00582D, warm cream #FFF7DF, sunflower
    yellow #FFCC2E.
    Offer: $29.99 first order with the text sign-up, renews at $49.99
    every 4 weeks.
  output: |
    MOMENT   The change caught halfway: the buyer knows the fixes,
             not Sprout.
    SHOW JOB Build, glazing. Five see-through leaf glazes stacked,
             each overlap a shade deeper, running into the pouch.
    It implies: "These greens are in this pack." Source: ingredients
    panel.
    Rejected: beet, acai and pomegranate (red-violets would mix to
    brown with the greens).

    LAYOUT   4:5, 1080 x 1350
    0-24 %   bare paper: headline and small line
    24-86 %  the leaf stack, left to right, ending at the pouch,
             lower right, crispest edges in the frame
    86-100 % bare paper strip: offer line

    WORDS ON THE IMAGE
    Headline (6 words): "Kale, spinach, spirulina. One small pack."
    Small line: "60+ ingredients, 21 vitamins & minerals, and 6g fiber
    in 1 pack."  Source: approved claim, word for word
    Offer line: "$29.99 first order with text sign-up. Renews at
    $49.99 every 4 weeks."  Source: offer terms
    Type: headline 64 px, small line 34 px, offer 30 px, all in forest
    green on the warm-white paper (about 8:1).

    IMAGE PROMPT
    A painted watercolor stack of five see-through leaf shapes (kale,
    spinach, spirulina, broccoli, wheatgrass) laid one over another
    across the middle of the sheet, each overlap a shade deeper, the
    last layer still wet at its edge, running into a painted deep
    forest green stand-up pouch at lower right with crisp hard edges
    and a small yellow bear face top right. Bare warm-white cold-press
    paper all round. Transparent watercolor, light granulation in the
    greens, colors kept to grey-green, leaf green, yellow-green,
    blue-green and deep forest green, sunflower yellow on the pouch
    only. Soft even daylight, bare paper as the brightest light. Flat
    and square to the sheet, 4:5, the top quarter and a thin bottom
    strip left as bare paper. Label on the pouch: "Sprout" in large
    sunflower-yellow letters; "28 Daily Packs" small at the bottom.
    AVOID FIELD  photograph, 3D render, plastic, brush, painter's hand,
    desk, text

    POST WORDS
    Primary text: Gave up on gritty greens powders? Sprout is 60+
    ingredients, 21 vitamins & minerals, and 6g fiber in 1 pack.
    Headline field: Your greens in one daily pack
    Button: Shop now
    EDIT STEP  Lay the real pouch, cut out from the front photo, over
    the painted one at the same size. Set the words on the bare paper.
    Check contrast on the finished image; if the paper came out
    darker, darken the words. For 1:1, repaint with a shorter stack;
    never crop the pouch.
    CHECKS  Glance test: greens stacking into one pack. Headline 6
    words, 2 more things to read, type 30 px and up, 4.5:1 or more.
    CHECKS MISSED: none
    MISSING: nothing for this ad.

tweaks:
  - what: The moment
    how: The problem as the buyer lives it suits people new to it. The change caught halfway suits people comparing fixes. The product held large suits people who know you.
  - what: The show job
    how: Reveal for one hero ingredient, spread for a scent or warmth, join for an ingredient becoming the product, build for a long list, calm for a mood.
  - what: Paper and texture
    how: Rough paper with granulation feels earthy and handmade. Smooth hot-press keeps fine detail and label shapes crisp.
  - what: Size
    how: 4:5 is the default for feeds. Ask for 1:1 as well and it recomposes the picture, never stretching or cropping the product.

judge:
  - Shown for 2 seconds, someone can say what the product is and the one idea.
  - The headline has 7 words or fewer, with at most 3 other things to read.
  - The words sit on bare paper, big and dark enough to read on a phone.
  - The implied sentence is something your claims let you say, and nothing shows a body changing.
  - The product matches your photos, with your real label laid over it.

test:
  - Give it a short ingredient list. Every painted ingredient should be on your list.
  - Ask for a picture that hints at an energy boost. The claim step should reject it and say why.
  - Run it twice on the same brief. The show job and the moment should stay close.
  - Put the finished image next to your current best image ad at phone size. Ask which one says what's inside faster.

improve:
  - Write your house paper and colors into step 3 of the skill file, so every painted ad in a series matches.
  - Add your banned claims to step 4, so the picture is tested against them.
  - Save your approved headline and the moment that wins in your brand file.
  - Pair it with the watercolor video skills, so the still and the video share one look.

works_best_with:
  tools:
    - {name: "Nano Banana", why: "Works from your product photos as references, so the painted pack keeps its true shape."}
    - {name: "Any good chat AI", why: "Claude, ChatGPT and Gemini all follow this skill well, so use the one you already have."}
  inputs:
    - "A scan of a real watercolor you like, so the paper and edges look painted"
    - "The full ingredient list from the pack, so every painted part is really inside"
    - "Your best current image ad, so you can test the painted one against it"

terms:
  - term: Show job
    meaning: What the picture has to show for the selling idea, such as a reveal or many parts adding up.
  - term: Glazing
    meaning: Laying a thin see-through layer of paint over dry paint. Where layers overlap, the color goes deeper.
  - term: Quiet area
    meaning: A calm part of the picture, here bare paper, kept free for the words.
  - term: Glance test
    meaning: Showing the ad for 2 seconds. If a stranger can say what it's for, it passes.
