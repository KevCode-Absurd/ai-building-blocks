new_slug: wayfinding-sign-planner
name: "Wayfinding sign planner"
summary: "Plan signs a first-time visitor can follow: every decision point, one lead mark, what each sign says and rules staff can reuse."
job: design-work
thinking: medium
thinking_why: "It walks each route and decides where signs go and what they say, which takes judgement about a place."

headline: "Wayfinding sign planner"
subhead: "Describe your building, campus or site and the routes visitors take. It walks each route as a first-time visitor and marks every point where they must choose. You get one lead mark, the words for each sign and rules so staff can add signs later."

explain: |
  Signs are often added one at a time, by different people, in different styles. The visitor sees a pile of arrows, logos and warnings and still gets lost.

  This wayfinding sign planner starts from the visitor's walk, not from what the operator wants to say. It lists every point where a person must choose a way. It picks one lead mark that reads from far away, and one master colour, with smaller labels under it.

  For each point, it writes what a lost person needs next, in the order they need it. Each place gets one name, used everywhere. It ends with a rules page so staff can add signs later without you. It plans signs and does not draw them. It does not replace legal or safety signs.

when:
  - "Visitors keep asking staff where the toilets, the lift or the front desk are."
  - "You are opening, moving or expanding a clinic, school, shop, office or event site."
  - "Signs were added over the years and now clash."
  - "A new hire or volunteer needs rules for making a sign that matches."

not_for:
  - "You have one room or one door. A plain label is enough."
  - "You need fire exit, accessibility or other signs the law requires. Ask a licensed signage or accessibility professional."
  - "You only want the words on your current signs checked. Use the Plain words interface rewriter."
  - "You want a logo or a brand look for the business. Use the Brand mark system planner."

you_give:
  - "A description or floor plan of the place, with its entrances and main destinations"
  - "Where first-time visitors start, where they want to go and what they ask staff"
  - "Signs you already have, and any you cannot change (optional)"
  - "How far away the farthest sign must be read (optional)"
  - "Languages used, and visitors with low vision or reduced mobility (optional)"
you_get:
  - "A numbered list of decision points for every route"
  - "One lead mark and master colour, with the smallest size and the farthest distance it must read"
  - "What each sign says, in the order a lost person needs it"
  - "One name for each place"
  - "A short rules page staff can use to add signs"
  - "A walkthrough as a first-time visitor"

how_to_use:
  - "Open the skill in Claude, ChatGPT or Gemini, or copy it and paste it into a new chat. It needs no tools."
  - "Describe the place and name the entrances and the main places people want to reach. Attach a floor plan if your AI takes files."
  - "Say where first-time visitors start and what they usually ask staff. If you leave out the place or the routes, it asks for them and stops."
  - "Check the decision points against the real building. Add any it missed."
  - "Walk the plan with a stranger and note where they hesitate."
  - "Give the rules page to whoever orders new signs."

how_it_works:
  - title: Walks each route
    text: Walks each route as a first-time visitor and lists every point where they must choose.
  - title: Picks the lead mark
    text: Chooses one dominant mark that reads from far away and at any size.
  - title: Sets a master colour
    text: Lets one master colour or mark lead and gives each area a smaller label under it.
  - title: Writes what a lost person needs
    text: Writes what a lost person needs next, in the order they need it.
  - title: Uses repetition
    text: Keeps the same place looking the same every time so the mark can be trusted.
  - title: Records the rules
    text: Writes rules so staff can add signs without you.
  - title: Walks it through
    text: Walks the finished plan as a stranger and runs its own checks.

output_shape: |
  PLACE AND ROUTES
  <place> | Entrances: <list> | Main destinations: <list>

  DECISION POINTS
  <route>: <point 1>, <point 2> ...

  LEAD MARK
  <mark> | Master colour: <colour> | Smallest size it reads at: <size and distance>

  SIGN LIST
  <point> | Sign type | Says: <text in order of need>

  ONE NAME PER PLACE
  <place> = <the one name used on every sign>

  RULES FOR NEW SIGNS
  <rules>

  WALKTHROUGH
  <step by step as a first-time visitor>

  MISSING
  <what would improve the plan>

  CHECKS MISSED
  <one line per check missed, or none>

output_sample:
  input:
    - "A description or floor plan of the place, with entrances and main destinations"
    - "Where first-time visitors start and where they want to go"
    - "Existing signs and any you cannot change (optional)"
    - "How far away the farthest sign must be read (optional)"
  prerequisites:
    - "An AI that can read an attached floor plan, if you have one (optional)"
  output:
    - name: "PLACE AND ROUTES"
      contains: "Your entrances, main destinations and the routes it walked."
    - name: "DECISION POINTS"
      contains: "A numbered list of every spot on each route where a visitor must choose."
    - name: "LEAD MARK"
      contains: "The one mark and master colour, with the smallest size and farthest distance it must read."
    - name: "SIGN LIST"
      contains: "For each decision point, the sign type and what it says, in the order a lost person needs it."
    - name: "ONE NAME PER PLACE"
      contains: "A single name for each place, used on every sign."
    - name: "RULES FOR NEW SIGNS"
      contains: "Mark, colours, fonts, sizes, heights and wording rules, plus a test for any new sign."
    - name: "WALKTHROUGH"
      contains: "Each route walked again as a stranger, with any spot where they would hesitate."
    - name: "MISSING and CHECKS MISSED"
      contains: "What you did not give, and any of its own checks it missed."

tweaks:
  - what: Entrances and starting points
    how: List every way in, including the side door people use. Each is a place where a visitor needs a sign.
  - what: Viewing distance
    how: Say how far away the farthest sign must read. It sets the minimum size of the lead mark.
  - what: Languages and readers
    how: Name any languages and visitors with low vision or reduced mobility. It changes the wording and placement.
  - what: What cannot change
    how: List fixed signs, such as safety or legal ones. The plan works around them.

judge:
  - Every decision point has a sign.
  - The lead mark is readable at the farthest viewing distance.
  - No two signs use competing marks.
  - Each sign says what a lost person needs next, not what the operator wants to say.
  - The rules let someone else add a sign correctly.

test:
  - Ask a stranger to find three places using only the planned signs and watch where they hesitate.
  - Stand at the farthest viewing point and check the lead mark can be seen.
  - Have a staff member write one new sign from your rules and compare it with the plan.
  - Check each existing sign against the plan and mark any that clash.

improve:
  - Add the exact fonts, colours and sizes you use, so signs ordered later match.
  - Add a list of words you always use for places, and words you never use.
  - Add the list of safety signs and codes that apply to your site.
  - Pair it with the "Plain words interface rewriter" to check the wording on each sign.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Planning decision points and sign text is text work any strong chat AI does well."}
    - {name: "A floor plan and a friend", why: "A stranger walking the route shows where signs fail faster than any review."}
  inputs:
    - "A floor plan or map"
    - "Photos of the current signs"
    - "Questions visitors ask staff most often"

terms:
  - term: Decision point
    meaning: A place where a visitor must choose which way to go.
  - term: Lead mark
    meaning: The one dominant symbol or colour that marks your system and reads from far away.
  - term: Master colour
    meaning: The one colour that leads on every sign, with smaller labels in other colours under it.
  - term: Viewing distance
    meaning: How far away someone stands when they must still be able to read the sign.
