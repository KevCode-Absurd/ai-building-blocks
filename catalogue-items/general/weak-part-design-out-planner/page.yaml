new_slug: weak-part-design-out-planner
name: "Weak part design-out planner"
summary: "Describe what keeps breaking. Get the part causing most trouble and ways to design it out."
job: build-product
thinking: medium
thinking_why: "It weighs evidence and compares options, but the steps are fixed."

headline: "Weak part design-out planner"
subhead: Give it a product, process or system that keeps failing, with any fault or cost records you have. It finds the part behind most of the trouble, asks why that part must exist, and hands back options that remove it, with the trade-off and a first test.

explain: |
  When something keeps breaking, the usual move is to patch the weak part again. A part that causes most of the faults is often a part the design needs for no good reason. Patching it costs you every month, for as long as you keep it.

  This skill lists the parts and where faults, delays and costs come from, then picks the worst one from the numbers, not from a hunch. It asks why that part has to exist and looks for a design that gets the same result without it. Then it states what the new design costs, checks that the rest of the system still works, and names what to test first.

when:
  - Returns, complaints or repairs keep tracing back to the same area.
  - A process has one step that always stalls or needs a person to rescue it.
  - You are about to fix the same part for the third time.

you_give:
  - The product, process or system, and what keeps going wrong
  - Any records of faults, costs, returns or delays, by part or step (optional)
  - What the thing must achieve, and any limits on budget, time or rules (optional)
you_get:
  - A table of parts with their share of faults and costs
  - The one part chosen as the main trouble, with the evidence
  - Two or three ways to design it out, with the trade-off in one line each
  - A system check and the first thing to test

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Describe the thing and what keeps going wrong. Paste any fault, return or cost records as they are.
  - Say what the thing must still do, so the options do not drop the main result.
  - Read the chosen part and its evidence first. Argue with it if the numbers look wrong.
  - Run the first test it names before you commit to a redesign.

how_it_works:
  - title: Lists the parts
    text: Splits the thing into parts or steps and notes where faults and costs come from, with numbers where you gave them.
  - title: Picks the worst part
    text: Chooses the part with the largest share of trouble, from the evidence and not from a guess.
  - title: Asks why it exists
    text: States the job that part does, and asks if that job needs doing at all.
  - title: Finds a way without it
    text: Looks for a design that gets the same result with the part removed, not mended.
  - title: Names the trade-off
    text: Says in one line what the new design costs or gives up.
  - title: Checks the whole system
    text: Looks at the parts around it to see that the change does not move the fault elsewhere.
  - title: Writes the plan
    text: Hands back the design-out, the first test and what result would stop the plan.

output_shape: |
  THE THING AND ITS JOB
  <what it is and what it must achieve>

  WHERE THE TROUBLE COMES FROM
  <part> | faults or cost: <number or MISSING> | share: <percent>

  THE MAIN TROUBLE PART
  <part> | evidence: <numbers or records>

  WHY IT EXISTS
  <the job it does, and whether that job is needed>

  OPTIONS THAT REMOVE IT
  1. <design> | gives up: <trade-off in one line>
  2. ...

  SYSTEM CHECK
  <each neighbouring part: still works or changes>

  FIRST TEST
  <what to try, what result keeps the plan, what result stops it>

  MISSING
  <facts that would sharpen the choice>

  CHECKS MISSED
  <one line per check still missed, or none>

tweaks:
  - what: Records by part
    how: Fault counts, costs or repair times per part make the choice solid. Without them the pick is marked as a guess.
  - what: The result the thing must keep
    how: State it plainly, such as "keep the item sealed". Options that lose it get dropped.
  - what: Limits
    how: Name any budget, rule or supplier limit so options stay realistic.
  - what: How wide the system is
    how: Name the neighbouring parts, teams or suppliers, so the system check has something to test.

judge:
  - The chosen part has numbers or records beside it, or is marked as a guess.
  - At least one option removes the part. It does not just strengthen it.
  - Each option states what it gives up in one line.
  - The system check names the neighbouring parts, not only the chosen one.
  - The first test could fail, and the plan says what a fail means.

test:
  - Run it on a past problem where you know what fixed it. See if it picks the same part.
  - Run it twice on the same input. The chosen part should stay the same.
  - Remove the records and run again. It should mark the pick as a guess.
  - Try the first test it names on a small scale before changing anything for real.

improve:
  - Add your own fault categories to step 1, so the table matches how you track problems.
  - Add the limits you always have, such as rules or supplier terms, to the checks.
  - Save past design-outs and what they cost, and paste them in as examples of the trade-off line.
  - Pair it with a checker such as "Breaking change reviewer" before you ship the redesign.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Sorting records, comparing options and writing the plan is text work any strong chat AI does."}
    - {name: "A spreadsheet", why: "Fault counts and costs by part are easiest to total and rank in a sheet before you paste them in."}
  inputs:
    - "Return, repair or complaint records tagged by part"
    - "A parts or steps list with the cost of each"
    - "Photos or a diagram of the thing"

terms:
  - term: Design out
    meaning: Change the design so a part is no longer needed, instead of fixing the part.
  - term: Trade-off
    meaning: What you give up or pay in return for the gain.
