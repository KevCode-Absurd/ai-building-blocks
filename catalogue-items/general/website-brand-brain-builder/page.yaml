name: Brand file builder
new_slug: website-brand-brain-builder
summary: Build one brand file from your website and what you already have. Offers, facts, buyers, claims, voice and look, each with a source and date.
job: brand-file
thinking: medium
thinking_why: It compares supplied evidence and follows a specific method.
headline: Brand file builder
subhead: Share your website and any product, customer or brand documents you already have. It builds one brand file your AI reads before every job. Each line says where it came from and when, old prices are flagged, and unanswered questions stay visible.
explain: |
  Every time you ask an AI to write an ad, a page or an email, it starts from nothing. You paste the same facts again, it guesses the rest, and the guesses creep into your copy as prices you don't charge and claims you can't make.

  This skill builds your brand file once, for any online business, and then keeps it current. It measures your website, then sorts in what you already have, like product sheets, a style guide, reviews or old ads. You get one folder in your own project. It holds your live prices and offers, your lasting facts, your buyers and the claims you can make, your voice and look, the sites you admire and compete with, and what worked on past jobs.

  Every line carries its source, its date and a status. A claim with no proof on file is marked pending, even on your own site. Prices and offers count as old after 7 days, so your AI checks them again before it sells anything. Each job reads only the slice it needs, and a job that needs none skips it.
when:
  - You use AI for marketing and keep pasting the same background into every chat.
  - You're briefing a new writer, designer or AI tool and want them working from facts you can stand behind.
  - Your facts are spread across your site, product sheets and old ads, and you can't tell which claims are proven.
  - Your AI has used an old price or an offer that has ended.
not_for:
  - "You need one ad or one email and have no site or brand material: ask your AI to write it directly, with the facts pasted in."
  - "You only want a quick look at a rival: read their site yourself, or ask your AI to summarise their pages."
  - "You want a printable design guide for a designer: this gives facts and rules, not a formatted guide."
you_give:
  - Your website address, or your pages pasted in if it can't be read
  - Brand material you already have, like product sheets, a style guide or past ads, each with a label and date (optional)
  - Customer reviews, survey answers or support emails (optional)
  - Past results from ads, emails or offers, as an export or pasted summary (optional). If your AI is connected to an ad account or store, it reads it only with your say-so
  - Your next step, such as planning, writing or image work (optional)
you_get:
  - One brand file in your own project, with an index that shows what is fresh, what is old and what is missing
  - Your prices, offers, stock and shipping, each with its page and date
  - Your lasting facts, buyers and claims, each marked checked, not confirmed or banned
  - Real lines in your own words, your colours, fonts and buttons
  - The sites you admire, avoid and compete with, and what you kept or dropped on past jobs
  - A short slice for your next step, if you name one
how_to_use:
  - Paste your website address into your AI. If it can't read sites, paste your key pages as text instead.
  - Add any product sheets, style guides, reviews or past results. Label each one and give its date.
  - Name your next step, such as writing ads. You then get a short slice for that job.
  - Check the short fact sheet it shows you and correct anything wrong. Answer its questions, or skip them.
  - Look at the claims marked pending and the list of what's missing.
  - Before each later job, ask it to check the brand file. It refreshes only what has gone old.
output_sample:
  input:
    - Your website address, or your pages pasted in
    - Product sheets, a style guide or past ads (optional)
    - Customer reviews, survey answers or support emails (optional)
    - Past results from ads, emails or offers (optional)
    - Your next step, such as planning, writing or image work (optional)
  output:
    - name: index.md
      contains: One screen that says what is in the brand file, how fresh each part is and what is missing.
    - name: offers.json
      contains: Each price, promotion, stock and shipping line with its page and the date it was read.
    - name: facts.json
      contains: What you are and sell, policies, proof, buyers and the claims list, each with a source, a date and a status.
    - name: look.json
      contains: Colours with their share of the page, fonts, shapes, buttons, menu, footer and image style.
    - name: voice.md
      contains: Real lines word for word, button words, customer words kept apart, and voice notes.
    - name: references.md
      contains: The sites you admire and avoid, and your competitors with their pitch, prices and the gap they leave.
    - name: worked.md
      contains: What you kept, dropped or asked for more of, and results, by job and date.
    - name: Slice for your next step
      contains: Only the facts your named next step needs, if you name one.
how_it_works:
  - title: Checks what exists
    text: Looks for a brand file first and updates it. It never starts a second one. Older folders and loose notes are moved in.
  - title: Measures the site
    text: Captures your live pages for prices, offers, stock, look and real lines, each with its page and date.
  - title: Sorts in your material
    text: Reads each labelled piece you gave it. When your material and your site disagree, it keeps both and marks them disputed.
  - title: Checks in once
    text: Shows you a short fact sheet and waits for your corrections. It asks only about a conflict or a missing decision.
  - title: Asks the most-needed questions
    text: At most five, one at a time, each skippable, ranked by how many later tasks need the answer.
  - title: Lists buyers and claims
    text: Builds each buyer record on real quotes. Marks each claim approved, pending or banned. A review of a rival never counts as proof.
  - title: Maps your market
    text: Lists the options buyers weigh, including doing nothing, and 3 to 5 competitors with their pitch, prices and the gap they leave.
  - title: Cuts a slice
    text: Planning gets buyers and approved claims. Writing gets offer facts, claims and quotes. Image work gets the product's look, colours, fonts and the words allowed on the picture.
  - title: Keeps it current
    text: Prices, offers and stock count as old after 7 days, and look and voice after 90. A new capture adds to the file and lists what changed.
output_shape: |
  context/brand-file/
    index.md        <what is here, how fresh, what is missing>
    offers.json     <price | offer | stock | shipping, each with
                     source and date>
    facts.json      <facts, buyers and claims, each with source,
                     date and status>
    look.json       <colours, fonts, shapes, buttons, imagery>
    voice.md        <real lines, button words, customer words>
    references.md   <admired, avoided, competitors>
    worked.md       <kept, dropped, results, by job and date>
    history/        <earlier versions, changes>

  SLICE FOR <NEXT STEP>
  <only what that step needs>

  SUMMARY
  Disputed: <n, and which>
  Buyer records grounded: <n of n>
  MISSING: <what>, <who can answer>

  CHECKS MISSED: <one line each, or none>
tweaks:
  - what: Your material and reviews
    how: Every labelled piece fills blanks the site leaves. Pasting 20 or more real reviews is the biggest upgrade, because it turns inferred buyer records into ones built on real words.
  - what: The next step
    how: Name it and you get a slice. Image work gets the product's look, colours and allowed words, with no review quotes. Writing gets offer facts, approved claims and quotes, with no hex codes.
  - what: Pages it reads
    how: Point it at specific pages if your site is big ("read the homepage, /pricing and these three product pages"). For an online store, the store add-on adds product photos and a truth sheet per product.
  - what: Competitors
    how: Name the competitors you care about instead of letting it search. You'll get a sharper market map and fewer irrelevant names.
  - what: Results
    how: Paste an export with real numbers. Without numbers, every result is graded "seen running" or "reported", which is honest but less useful.
judge:
  - Every price in the brand file matches your price list exactly, and has the date it was read.
  - Every line has a source, and every checked fact names its page, label or person.
  - Claims with nothing on file are marked pending, even when they're on your own site.
  - Every customer quote is something a real customer wrote, with where it came from.
  - Two sources that disagree are both recorded and marked disputed, never quietly picked.
  - The slice holds only what the next step needs. An image slice has no review quotes and no pending claims.
  - Old prices are listed for a recheck, not passed on as facts.
test:
  - Check the prices first. Compare three offers line by line with your price list; any rounding or a missing offer means it read an old or wrong page.
  - Give it a product sheet that disagrees with your site, such as an old price. Both versions should be there, marked disputed.
  - Leave out your logo file. It should come back as a MISSING line, with no stand-in logo or font.
  - Run it again a week later. It should update the same brand file and list what changed, not start a new one.
improve:
  - Edit the page list in step 3 to name the pages that matter on your site, so it never skips them.
  - Add your banned claims, so every job that reads the brand file leaves them out.
  - Capture your pricing and best-selling pages each week, so later tasks don't use old facts.
  - After each job, tell it what you kept and dropped. The next job starts from that.
  - Pair it with a skill that interviews the founder to fill the gaps only they can answer.
works_best_with:
  tools:
    - name: Claude
      why: A project keeps the index as its instructions and the slice as knowledge, even on a free account.
    - name: Gemini
      why: A Gem keeps the index as instructions that Gemini follows every time you use it.
    - name: Shopify
      why: If you sell on Shopify, it exports your products and variants as a spreadsheet, so offers match every variant.
  inputs:
    - Names of 3 to 5 competitors you already watch, so the market map starts from real ones
    - Your logo and font files by name, so the look has no gaps
    - Lab reports or test certificates, so more claims can be approved instead of pending
    - Who on your team can answer questions about proof and offers, so each gap names a real person
terms:
  - term: Brand file
    meaning: One folder in your own project with your offers, facts, buyers, claims, voice, look and history, which any AI or person can read before working for you.
  - term: Status
    meaning: A short label on each line. Live means checked, not confirmed means reasoned, disputed or unknown, and banned means you've ruled it out.
  - term: Claims list
    meaning: Every claim you might make, with its proof. Approved means a document or test backs it, pending means nothing is on file yet, banned means you've ruled it out.
  - term: Buyer record
    meaning: A short description of one kind of buyer, what they want and what makes them hesitate, built on their own words where possible.
  - term: Slice
    meaning: The short part of the brand file one next step needs, such as the look and allowed words for a designer.
  - term: Stale
    meaning: Too old to trust. Prices, offers and stock are stale after 7 days, and the look and voice after 90 days.
