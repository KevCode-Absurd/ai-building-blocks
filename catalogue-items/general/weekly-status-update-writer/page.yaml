new_slug: weekly-status-update-writer
name: Weekly status update writer
summary: Write a weekly status update from your notes. Get a one-page report with an overall call, risks and the decisions you need, in under 250 words.
job: document-work
thinking: low
thinking_why: It fills a fixed one-page layout from your updates.
headline: Weekly status update writer
subhead: Paste your updates for the period. You get a one-page status report that opens with an overall call, then what got done, risks, the decisions you need and next steps.
explain: This is the short, weekly version. It is one page, under 250 words, for a regular internal update. For a longer report with every check, use the Status report writer. Status reports fail when they bury the point. This prompt puts the call first, as one word and one reason. Then it lists results, owners, risks and the decisions you need, each with a date and your recommendation. It stays under 250 words and uses only the numbers you give it. Leaders can read it in a minute and know where they are needed.
when:
  - A weekly update is due and you are short on time.
  - Your last update was too long to read.
  - You need a decision and want it noticed.
not_for:
  - "You need a full report with every check: use the Status report writer."
  - "You are writing an incident report or a formal board pack: ask a person who owns that format, or use the Status report writer."
  - "You have no updates yet: gather your notes first, then come back."
you_give:
  - The period and project
  - Your updates
  - Who reads it (optional)
you_get:
  - An overall status with a reason
  - Done, in progress, risks and decisions needed
  - Next period's top three
how_to_use:
  - Copy the prompt, then paste it into Claude, ChatGPT or Gemini with your details under it.
  - Under it, paste the period, the project and your updates.
  - Send it and read the result.
  - Send it at the same time each week, so people look for it.
output_sample:
  input:
    - The period and project
    - "Your updates: what got done, what is in progress, problems and decisions you need"
    - Who reads it (optional)
  output:
    - name: STATUS
      contains: One word, On track, At risk or Off track, and one sentence on why.
    - name: DONE
      contains: What got finished, written as results and not as activity.
    - name: IN PROGRESS
      contains: Open items, each with an owner and a date.
    - name: RISKS
      contains: What could go wrong, the effect, and what you are doing about it.
    - name: DECISIONS NEEDED
      contains: Each question, the date it is needed by, and your recommendation.
    - name: NEXT
      contains: The top three things for the next period.
    - name: MISSING
      contains: Lines that flag any facts you did not give, so nothing is invented.
how_it_works:
  - title: Call it
    text: One word and one reason, first.
  - title: List results
    text: What got done, in progress, and risks.
  - title: Ask clearly
    text: Each decision has a date and a recommendation.
output_shape: |-
  STATUS
  <On track / At risk / Off track>. <one sentence>

  DONE
  IN PROGRESS (owner, date)
  RISKS (risk, effect, action)
  DECISIONS NEEDED (question, by when, recommendation)
  NEXT (top three)
  MISSING
tweaks:
  - what: Reader
    how: Name leaders, customers or your team and the depth changes.
  - what: Length
    how: Ask for three lines for chat.
  - what: Period
    how: Say weekly or monthly.
judge:
  - Status comes first.
  - Results, not activity.
  - Decisions have dates.
  - Under 250 words.
test:
  - Give a long ramble. It should shrink to under 250 words.
  - Give no owner for an item. It should write MISSING.
  - Run twice. The status call should match.
improve:
  - Paste last week's report so it can show change.
  - Add your team's goals for the quarter.
  - Keep a running file of weekly reports.
works_best_with:
  tools:
    - name: Any good chat AI
      why: A one-message prompt works in any strong chat AI, with nothing to install.
  inputs:
    - The period and project
