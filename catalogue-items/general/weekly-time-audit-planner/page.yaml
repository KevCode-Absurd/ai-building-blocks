new_slug: weekly-time-audit-planner
name: "Weekly time audit planner"
summary: "Find where your week went. Paste last week's calendar and get your hours sorted into chosen, taken and habit, plus one protected hour a day."
job: think-and-decide
thinking: medium
thinking_why: "It sorts and adds up your hours, then makes a few judgement calls about who gains. The steps are fixed."

headline: "Weekly time audit planner"
subhead: "Give it last week's calendar, or a list of what you did each day, and the work you most want to move. It tags every block as chosen by you, taken by someone else, or taken by habit, and adds up the hours. You get the count, your three biggest time takers and one protected hour a day."

explain: |
  A weekly time audit starts from a simple fact. Most people can say what they spent last month in money, but not where last Tuesday went. Hours leave in small pieces: a meeting nobody needed, an inbox check, a favour you could not refuse. Nobody sends a bill, so nobody notices.

  This skill keeps an account book for your week. It lists every block, including gaps, travel and scrolling. It tags each one as chosen by you, taken by another person, or taken by habit, and adds up each pile. Then it asks who gains from the three biggest takers. That question is what sets it apart from a plain list of meetings.

  It ends with action, not a chart. It picks one hour a day that is hard for others to take, ties it to a real piece of work, and turns every "later" into a dated first step.

when:
  - You end most weeks sure you were busy, but not sure what you got done.
  - Your calendar is full of things other people put there.
  - You keep saying you will start the big piece of work when you have time.
  - You are about to plan next week and want the facts about last week first.

not_for:
  - "You have no record of last week and cannot recall it. Keep a rough log for three days, then run this."
  - "You want a plan for next week from a task list. Use the Week plan maker from a task list."
  - "You already know your takers and want rules to stop them. Use the Not-to-do list builder."

you_give:
  - "Last week's calendar (an export or a readable screenshot), or a plain list of what you did each day"
  - "The one piece of work you most want to move, such as a report, a course or a product"
  - "Fixed commitments you cannot move, such as a school run or a shift (optional)"
  - "Your usual working hours (optional)"
you_get:
  - "Every block of last week, tagged as chosen, taken by others or taken by habit"
  - "Hours added up in each pile, with each pile's share of the week"
  - "Your three biggest takers, with what each cost you and who gains"
  - "One protected hour a day, tied to a named piece of work"
  - "Each old 'later' turned into a first step with a day and a time"

how_to_use:
  - "Open the skill in your AI if you added it, or copy it and paste it into a new chat in Claude, ChatGPT or Gemini."
  - "Paste last week's calendar, or write out your days, even roughly. Add the one piece of work you most want to move. It needs both, and asks for any you leave out."
  - "Answer its questions about blocks it cannot sort, such as a block called busy."
  - "Check the count first. The three piles plus any hours not accounted for should add up to the hours you gave it."
  - "Put the protected hour in your calendar before you close the chat."
  - "Run it again in a week and compare the piles. Use the Not-to-do list builder if the same takers come back."

how_it_works:
  - title: Lists the blocks
    text: Writes down every block of last week, including gaps, commutes and scrolling, so nothing hides in "other".
  - title: Marks who chose it
    text: Tags each block as chosen by you, taken by someone else, or taken by habit. It asks when it cannot tell.
  - title: Adds up the piles
    text: Totals the hours in each pile, like an account book, and shows each as a share of the week.
  - title: Names the takers
    text: Picks the three biggest takers, states what each costs and who gains from it.
  - title: Protects one hour
    text: Picks an hour a day that is yours and names the work item it protects.
  - title: Dates the promises
    text: Turns every "later" and "someday" into a first step with a day and a time.
  - title: Checks itself
    text: Runs its own checks and names only the ones that failed.

output_shape: |
  THE WEEK IN BLOCKS
  <day> <time> <what happened> | <hours> | <chosen / taken by others / taken by habit>

  THE COUNT
  Chosen by you: <hours> (<share>)
  Taken by others: <hours> (<share>)
  Taken by habit: <hours> (<share>)
  Not accounted for: <hours>

  THREE BIGGEST TAKERS
  1. <taker> | <hours> | Cost: <what it displaced> | Who gains: <person or thing>
  2. ...
  3. ...

  THE PROTECTED HOUR
  <day and time each day> for <named work item>
  Why this one: <reason>

  DATED FIRST STEPS
  <old "later" promise> -> <step> on <day> at <time>

  MISSING
  <facts that would change the count>

  CHECKS MISSED
  <one line per failed check, or none>

output_sample:
  input:
    - "Last week's calendar, or a list of what you did each day"
    - "The one piece of work you most want to move"
    - "Fixed commitments you cannot move (optional)"
    - "Your usual working hours (optional)"
  prerequisites:
    - "A calendar you can export or screenshot, or a day-by-day list written from memory"
  output:
    - name: "THE WEEK IN BLOCKS"
      contains: "Every block of the week with its day, time, hours and a tag: chosen, taken by others or taken by habit."
    - name: "THE COUNT"
      contains: "Hours and share of the week in each pile, plus any hours it could not account for."
    - name: "THREE BIGGEST TAKERS"
      contains: "The three sources that took the most hours, with what each cost you and who gained."
    - name: "THE PROTECTED HOUR"
      contains: "One hour a day tied to a named piece of work, with the reason that hour was picked."
    - name: "DATED FIRST STEPS"
      contains: "Each old 'later' promise turned into a first step with a day and a time."
    - name: "MISSING"
      contains: "Facts it needed and did not have, such as what a block called busy really was."
    - name: "CHECKS MISSED"
      contains: "Only the checks that failed, or none."

next: [not-to-do-list-builder, week-plan-from-task-list-maker, digital-tool-audit-planner]

tweaks:
  - what: How detailed your calendar is
    how: A calendar with real meeting names sorts better than blocks called "busy". Add short notes for gaps.
  - what: The work you want to move
    how: Name one concrete item. "Finish the draft of the proposal" gives the protected hour a purpose; "be more productive" does not.
  - what: Fixed commitments
    how: List what cannot move so the skill does not suggest cutting it.
  - what: Your honesty about habit
    how: Say how long phone and inbox checks really took. Guessing low hides the biggest taker.

judge:
  - Every hour of the week is in one of the piles, or listed as not accounted for.
  - Each of the three takers has a cost and a person or thing that gains.
  - The protected hour names a real piece of work, not "focus time".
  - No step says "someday" or "when I have time".
  - The piles add up to the hours you gave it.

test:
  - Run it on a week you remember well. Check that the blocks you call chosen really were.
  - Run the same week twice. The three takers should stay close.
  - Add one dated step to your calendar and see if you keep it for a week.
  - Compare the piles for two weeks in a row to see if the takers shrank.

improve:
  - Add your own habit list (feeds, chat apps, check-ins) so the skill spots them by name.
  - Add the hours you can control to the skill, so it never suggests moving a fixed shift.
  - Save the three takers each week in one file and look for the ones that return.
  - Pair it with "Not-to-do list builder" to turn the takers into stop rules.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Sorting and adding up a list of blocks is plain text work."}
    - {name: "Your calendar app's export", why: "A real export is faster and more honest than memory."}
  inputs:
    - "A time log kept for three days, so habit blocks are not guessed"
    - "A list of your top three goals this quarter"
    - "The names of people who send you most of your requests"

terms:
  - term: Taker
    meaning: A person, task or habit that takes your hours without you having chosen to give them.
  - term: Protected hour
    meaning: A block in your day that only you may use, tied to one named piece of work.
  - term: Time audit
    meaning: A count of where your hours went, sorted into piles, like an account book for time.
