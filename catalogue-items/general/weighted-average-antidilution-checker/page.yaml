new_slug: weighted-average-antidilution-checker
name: Weighted-average antidilution checker
headline: Weighted-average antidilution checker
summary: Check a weighted-average antidilution reset. Give it your charter clause and share counts. You get the revised conversion price and ratio.
job: money-and-investing
thinking: high
thinking_why: "The formula changes with the charter's own definitions, so the clause must be read before any number is used."
subhead: Revised conversion price and protected-series conversion ratio. Share actual charter formula, old conversion price, defined A shares, qualifying C shares, cash consideration and trigger/exemption confirmation.
explain: |-
  Revised conversion price and protected-series conversion ratio.

  When a company sells new shares below the old conversion price, a weighted-average clause in the charter lowers the investors' conversion price. This skill does that arithmetic for one cash issuance and one series. It reads your clause first, because each charter defines the terms its own way. It stops on any missing input instead of guessing zero.

  Illustrative figures only, not a real company:

  | Item | Value |
  |---|---|
  | A: shares in the charter's definition | 100 |
  | Old conversion price | 10 |
  | Cash paid for the new shares | 200 |
  | B: shares that cash would buy at the old price (200 / 10) | 20 |
  | C: new shares actually issued | 40 |
  | New conversion price: 10 x (100 + 20) / (100 + 40) | 60/7, about 8.57 |

  If the cash paid were 400, B would be 40, which equals C, and the price stays 10. This is arithmetic only. Ask your lawyer to confirm how the charter reads before you rely on it.
when:
  - You need revised conversion price and protected-series conversion ratio.
  - You work on venture financing and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
not_for:
  - "You have a full-ratchet clause, several series or linked instruments: ask your startup lawyer, because this checks one cash issuance and one series."
  - "You do not have the charter text: get the signed charter from the company first, since the skill needs the real formula."
  - "You want to know who is legally owed shares or votes: ask counsel, because this only does the arithmetic."
  - "You need the conversion price of a note with a cap or discount: use the Cap and discount conversion checker instead."
you_give:
  - Actual charter formula, old conversion price, defined A shares, qualifying C shares, cash consideration and trigger/exemption confirmation.
  - "The issue date, plus the currency and scale used for the antidilution reset."
  - "Your spreadsheet tool, if you want the antidilution reset as a workbook."
you_get:
  - Revised conversion price and protected-series conversion ratio.
  - "An editable workbook of the antidilution reset, with its inputs, formulas and test cases to rerun."
  - "A tie-out of the old and revised conversion price, the inputs still missing and the checks that ran."
how_to_use:
  - Open your AI and paste in the skill, or upload the pack and ask it to follow SKILL.md.
  - Paste the charter conversion price clause and your old conversion price.
  - Add the A share count, the qualifying C shares and the cash paid, and say whether the trigger and exemptions were checked.
  - Say which spreadsheet tool you use. Running the bundled calculation needs Node.js 20 or later.
  - Read the assumptions, the reconciliations and the MISSING and CHECKS MISSED lines before you rely on the result.
output_sample:
  input:
    - Your charter conversion price clause
    - Your old conversion price
    - Your count of shares in the charter's A definition
    - Your count of qualifying new shares (C) and the cash paid for them
    - Your confirmation that the issue triggers the reset and no exemption applies
  prerequisites:
    - An AI that can create and recalculate spreadsheet files
    - Node.js 20 or later, only if you want to run the bundled calculation check
  output:
    - name: Revised conversion price and ratio
      contains: The new conversion price for the protected series and its conversion ratio, or the old price if no reset applies.
    - name: Scope and dated sources
      contains: The charter and records used, with their dates.
    - name: Inputs and assumptions
      contains: Each input with its source, plus the assumptions made where the charter was unclear.
    - name: Model calculations and reconciliations
      contains: The steps that find B and the new price, with checks that tie back to your inputs.
    - name: Actual file verification
      contains: Which workbook checks ran, such as recalculation, a changed-input test and reopening the file.
    - name: MISSING and CHECKS MISSED
      contains: Inputs that were not supplied and checks that failed or could not run, or none.
how_it_works:
  - title: 1. Map actual A, B and C definitions including outstanding options and deemed issuances; verify exemptions and trigger
    text: Map actual A, B and C definitions including outstanding options and deemed issuances; verify exemptions and trigger.
  - title: 2. Calculate B as qualifying consideration divided by old price, then old price times (A plus B)/(A plus C)
    text: Calculate B as qualifying consideration divided by old price, then old price times (A plus B)/(A plus C).
  - title: 3. Retain the old price when there is no qualifying downward reset; document required contractual rounding separately
    text: Retain the old price when there is no qualifying downward reset; document required contractual rounding separately.
output_shape: |-
  Revised conversion price and protected-series conversion ratio.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: "Issue date"
    how: "Take the issue date from the charter clause and the share counts. Use one currency and scale on every line."
  - what: "Cash consideration"
    how: "Change the cash consideration and have your AI recalculate. Keep the actual figures you supplied."
  - what: Acceptance
    how: A must follow the actual broad- or narrow-based charter denominator.
judge:
  - A must follow the actual broad- or narrow-based charter denominator.
  - Only a qualifying down-round issuance enters this calculation.
  - Trace each input to its dated signed source, currency, scale and period.
  - Reconcile outputs; preserve MISSING and CHECKS MISSED rather than guessing zero.
test:
  - Run the included baseline and changed-input fixtures, then compare with the stated expected results.
  - Remove a required input and confirm the affected calculation refuses to invent a zero.
  - Recalculate the workbook after changing an input and inspect the saved output.
improve:
  - "Save one antidilution reset you have already checked as an approved example, so your AI copies its layout."
  - "Write how your documents define conversion price into SKILL.md, so every run uses your wording."
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
    - name: Node.js 20 or later
      why: Run the bundled dependency-free reference calculation against explicit numeric inputs.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
