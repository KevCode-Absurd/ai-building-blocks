name: "Winning image ad style finder"
new_slug: winning-image-ad-style-finder
summary: "Find the image ad style your best ads share. Attach six or more ads with results. Get a style list and new ad plans that each test one change."
job: make-image-ads
thinking: high
thinking_why: "It studies ads or pages closely and works out why they work."

headline: "Winning image ad style finder"
subhead: Attach six or more of your ads with results, and name the product to sell. It finds the traits only your winners share, then plans new ads that keep them and change one thing. You get the style with its counts, a do-not-carry list and new ad plans.

explain: |
  When an ad wins, the usual move is to copy it: same words, same offer, a new colour. That teaches you nothing, and it can carry over things that were only true of that ad, like an old discount or a review about another product.

  This skill ranks your measured ads and puts the top third beside the bottom third. It reads both on five traits: the kind of ad, the layout, your brand's colours and type, the shape of the words, and how the product is shown. A trait only counts as your style when nearly all the winners have it and no more than half the losers do. A trait both share is just your habit. Where your records don't say why an ad won, it writes "not recorded". Then it plans new ads for the product you name. Each keeps the style and changes one thing: the kind of ad, the message, the audience or the product.

when:
  - You have a handful of ads that beat your account's usual and want more like them.
  - Your new ads drift off-brand, or copy the winner so closely they test nothing.
  - You're adding a new product or buyer and want to reuse a style that already works.
not_for:
  - "You have fewer than six ads with about 20 sales each: treat your best ad as one example, and wait for more results before you look for a style."
  - "You only want ad words for a product: use the Fact-based ad copy writer."
  - "You want finished image ads made from a plan: use the Product image ad prompt writer."

you_give:
  - Six or more of your own ads, with the images attached (your AI can see pictures), dates, spend and results
  - The result you judge on, such as cost per sale
  - The product to sell, named every time, with its photos and facts
  - Your org context, for colours, type, claims and current offers
  - How many new ads you want (optional, 5 by default)
you_get:
  - A ranking of your measured ads, top, middle and bottom
  - The style, with each trait's count among winners and losers
  - A do-not-carry list of words, numbers, people and offers that stay with the old ads
  - New ad plans, each saying what is kept and the one thing changed

how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Attach the images of your ads, with spend, results and dates. A results file alone gives only the words half of the style.
  - Say which result you judge on, such as cost per sale. Only ads with about 20 sales count, or 100 link clicks if you judge on click rate.
  - Name the product you want new ads for. Paste its facts and a clean product photo.
  - At the first stop, correct the style. At the second, edit the plans before anything is made.
output_sample:
  input:
    - Six or more of your own ads, as images, with dates, spend and results
    - The result you judge on, such as cost per sale
    - The product to sell, with its facts and a clean photo
    - Your org context (optional)
    - How many new ads you want (optional)
  prerequisites:
    - An AI that can look at ad images
    - Your results exported from your ad account
  output:
    - name: WORKING FROM
      contains: The product, the ads, the dates and the result you judge on, so a stale fact is caught early.
    - name: RANKING
      contains: Each measured ad with its result, placed in the top, middle or bottom group.
    - name: STYLE
      contains: Each trait with its count among winners and losers, kept or dropped, plus a do-not-carry list.
    - name: NEW ADS
      contains: Each plan lists what it keeps, the one thing it changes, a draft headline and the fact it rests on.
    - name: MISSING
      contains: Images, reasons or small print the AI needed but did not have.
    - name: CHECKS MISSED
      contains: Any check the AI could not fix, or the word none.
    - name: STOP 1
      contains: What you should correct in the style before anything is made.

how_it_works:
  - title: Says what it's using
    text: Repeats the product, ads, dates and the result you judge on, so a stale fact is caught early.
  - title: Ranks your ads
    text: Counts an ad only once it has about 20 sales, then splits them into top, middle and bottom thirds.
  - title: Reads five traits
    text: The kind of ad, the layout, your brand's colours and type, the shape of the words, and how the product is shown.
  - title: Keeps what separates
    text: A trait counts when nearly all winners have it and no more than half the losers do. The rest is habit.
  - title: Finds what's untried
    text: Lists the kinds of ad, messages and audiences your winners never used, then stops so you can correct the style.
  - title: Plans the new ads
    text: Each keeps the style and changes one thing, for the product you named, using only facts it holds.
  - title: Stops before making
    text: Shows every plan for your edits, then uses your clean product photo as the reference if images are made.

output_shape: |
  WORKING FROM
    Product  <named product, price>
    Ads      <file, how many, dates>
    Judged   <the result, and the read point>

  RANKING (<result>. Account usual: <n>)
    <ad>   <result>   <top | middle | bottom>
    Not measured: <ads under the read point>

  STYLE  (top <n> vs bottom <n>)
    <trait>   top <n> of <n>   bottom <n> of <n>   <kept | dropped>
    Why each won: <from your records, or "not recorded">
    Do not carry: <words, numbers, people, offers>
    Never used by winners: <types, messages, audiences>

  NEW ADS
    <n> Code <type · dress · audience>
        Kept <traits>   Changed <the one thing>
        Headline "<draft>" (<words>)
        Rests on <fact or quote, with source>

  MISSING  <images, reasons, small print>
  CHECKS MISSED  <one line each, or none>
  STOP 1   <what to correct before anything is made>

example:
  business: sprout
  input: |
    [the skill]

    Ads: ad-results.csv, one row per ad, 14 to 42 days (all 10 rows
    pasted; practice numbers). P1 is one ad split into two 21-day
    windows. Columns: ad_name, format, opening_line, days_live,
    spend_usd, impressions, link_clicks, purchases, revenue_usd
    Ad images: not attached
    Judge on: cost per purchase
    Product: Sprout Original (Adults)
    Facts: Sprout org context (pasted)
    Reviews: all 20 (pasted)
    How many new ads: 3
  output: |
    WORKING FROM
