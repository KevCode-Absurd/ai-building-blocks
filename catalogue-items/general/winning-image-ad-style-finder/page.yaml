tweaks:
  - what: The product
    how: Name a different product and the same style is redrawn to its shape, using only views its own photos show. The product becomes the one change.
  - what: How many new ads
    how: Ask for more and it spreads them across more untried types, messages and audiences. No two change the same thing in the same way.
  - what: Why ads won
    how: Add a line per ad on why you think it won, from a test or a note. Those reasons replace "not recorded".
  - what: The result you judge on
    how: Switch from cost per sale to click rate if sales are thin. The read point becomes 100 link clicks.

judge:
  - The ranking matches your file, and ads under about 20 sales are left out.
  - Every kept trait shows its count among winners and losers.
  - Any reason for a win comes from your records, or is written "not recorded".
  - The do-not-carry list includes the winners' words, offers and people.
  - Each new ad changes exactly one thing, and you can say what it is in a few words.

test:
  - Rank your ads yourself on the same result, then compare. The order and the thirds must match your file exactly.
  - Run it with five measured ads. It should say it can't read a style and treat the best one as a single reference.
  - Run it twice on the same results. The kept traits and the do-not-carry list should match. If a reason for a win appears, check it came from your notes.
  - When the new ads are made, put each one next to its winner. You should be able to name the one change in a few words.

improve:
  - Write the result you judge on and your account's usual into "What you need" in the skill file, so every run ranks the same way.
  - Add a "why it won" line to your org context each time you end a test, and paste those lines next time.
  - Keep images of every ad you run, so the visual traits can always be read.
  - Run it every month with your latest results, so the style follows what's working now.
  - Pair it with a skill that finds the image ad types you've never tried, when you want ideas outside your current style.

works_best_with:
  tools:
    - {name: "Meta Ads Manager", why: "Exports spend, purchases and dates per ad, so the ranking matches your account."}
    - {name: "Google Sheets", why: "Ranks the ads and splits them into thirds, so you can check its counts."}
    - {name: "Any good chat AI", why: "Reading traits works in any strong chat AI that can look at ad images."}
  inputs:
    - "Images of your bottom ads as well as your top ones, so traits can be compared"
    - "A one-line note per past test on why you think it won or lost"
    - "A clean photo of the new product from each view, so layouts can be redrawn to its shape"

terms:
  - term: Cost per sale
    meaning: Ad spend divided by the number of purchases. Lower is better.
  - term: Account's usual
    meaning: Your whole account's result over the same period. An ad above it is a winner for you, whatever other brands get.
  - term: Trait
    meaning: One thing an ad does that you can check, such as no price in the headline, or the product shown in a hand.
  - term: Word shape
    meaning: How the words are built, such as their length, who speaks and how the headline opens, without the actual sentences.
