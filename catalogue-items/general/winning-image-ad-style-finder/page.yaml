               text sign-up, then $49.99 every 4 weeks
      Ads      ad-results.csv, 9 ads, 14 to 42 days. Practice numbers.
               P1's two windows are joined into one ad.
      Judged   cost per purchase, read after about 20 purchases.
               Small print: the $29.99 needs the text sign-up. Must
               every ad carry that? (asked at Stop 1)

    RANKING (cost per purchase. Account usual: $21,500 / 623 = $34.51)
      T1 Hot girl tummy (video)        $21.21   top
      H1 One step never skip (video)   $29.55   top
      K1 Fiber kids (video)            $34.92   top
