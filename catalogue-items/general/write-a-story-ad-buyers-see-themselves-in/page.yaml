new_slug: write-a-story-ad-buyers-see-themselves-in
name: Write a story ad buyers see themselves in
summary: A long story ad that reads like a person's post, built from your reviews, with an honest narrator.
job: write-ad-copy

headline: A story ad that reads like a real person's post, built only from what customers said
subhead: Give it your customer quotes, your product facts and the shape you want. It writes a story that carries a reader from their problem to your page, in their words, with a narrator who is honest about who they are.

explain: |
  Long story ads work because the reader sees their own life in the first three lines. They go wrong when the writer fills gaps with a made-up customer, a fake statistic or a result nobody reported. Then the ad is a lie, even when it sells.

  This skill builds the "before" from your research and keeps the "after" inside what customers report and your claims allow. You choose a form (the shape of the story), an arc (how the narrator feels about it), a narrator and a length. If the narrator is a composite of several customers, the last line says so. Any fact you didn't give it becomes a placeholder in square brackets, listed in the notes for you to fill or cut.

when:
  - Your reviews tell the same story again and again, and you want an ad that tells it properly.
  - You're writing a long post-style ad and want to be sure nothing in it is invented.
  - You want two or three versions of one story, in different shapes or moods, to test against each other.

you_give:
  - The buyer, the reason they buy and your offer
  - Real customer quotes about the problem, what they tried and what changed
  - Your product facts, approved claims, banned claims and guarantee
  - The form, arc, narrator and length you want (it can suggest them if you're unsure)
  - Where the ad sends people, a product page or an article-style page
you_get:
  - The full story, ready to paste as the ad's text
  - Other openings, each with a headline for under the image and an image idea
  - Notes with the word count, every placeholder, everything inferred and which reviews each borrowed phrase came from

how_to_use:
  - Start a chat with the skill: open it if you added it to your AI, or copy it and paste it in.
  - Paste five or more real reviews with their numbers, plus your product facts and claims list.
  - Name the form, arc, narrator and length. Start with "personal history", "reluctant believer", composite and short if you're unsure.
  - Say where the click goes. Use a product page for people who already know the problem and have tried a fix.
  - Read the notes first. Fill or delete every square-bracket placeholder, and check the inferred lines before the ad runs.

how_it_works:
  - title: Follows the honesty rules
    text: Invents no statistic, study, expert, review or price, and keeps the result inside what customers actually report.
  - title: Picks the narrator
    text: Uses a real customer, a composite, the founder, a real expert who agreed, or an observer, each with its own limits.
  - title: Decides the story's shape
    text: Notes the main problem, the doubt underneath, the old fix, how much the buyer already knows and where the ad leads.
  - title: Builds the story
    text: Uses up to eight parts, from the opening moment through the breaking point and the new explanation to the close, as the form allows.
  - title: Sets the length
    text: Keeps only the parts each length allows. A longer story has more happen in it, never the same point said twice.
  - title: Writes how people talk
    text: Uses whole sentences in short paragraphs and plain words, with no headings, dashes or lists.
  - title: Adds other openings
    text: Writes alternative first lines with a headline for under the image and an image idea taken from the story.

output_shape: |
  TITLE  <problem> / <form> / <arc>

  COPY
  <opening: a moment the reader recognises, no product>
  <what they tried, and what it cost>
  <the new explanation>
  <first experience, small and specific>
  <what changed, inside what customers report>
  <close: the reader's doubt, the link, the real offer once>
  <closing line if the narrator is a composite>

  OTHER OPENINGS (hook_variants)
  <n> First lines: "<two or three lines>"
    Headline: <line under the image>
    Image: <one line, taken from the story>

  NOTES
  Lead problem / Underneath / Old way / Buyer knows / Narrator
  Word count:     <n>
  Placeholders:   <[gaps] to fill, or none>
  Borrowed:       <phrases and the review each came from>
  Inferred:       <lines not from your research>
  Left out:       <what was dropped, and why>

example:
  business: sprout
  input: |
    [the skill]

    Buyer: the quitter who wants to stick. Reason to buy: finally a
    daily habit that lasts. Offer: the first-order guarantee.
    Customer words (Sprout reviews):
    1. "I've tried a few green powders over the years. The issue has
       never been nutritive content. It's always been an issue of
       consistency like many things."
    2. "It's wild I WANT to take [Sprout] and don't forget."
    3. "...even with their monthly subscription discount it was still
       $94 a month and the drink was definitely gritty/chalky."
    5. "I also stopped buying separate probiotic gummies, b12 gummies,
       and multivitamin gummies. I just take these now and it's
       easier for me to manage."
    18. "I thought the first pack I tried tasted terrible, but after
        the third day they started tasting better"
    Facts: Sprout, a daily pack of greens gummies you tear open and
    eat. 60+ ingredients, 21 vitamins and minerals, 6 g fiber.
    Never: "fix", energy or weight results, "replaces your powder".
    Guarantee: 30-day money-back, first order only.

    Form: personal history. Arc: reluctant believer.
    Narrator: composite. Length: short. Destination: product page.
  output: |
    TITLE  Quitting every supplement / personal history / reluctant
    believer

    COPY
    I've tried a few green powders over the years, and a shelf of
    separate gummies after that. What was in them was never the issue.
    Sticking with it was.

    The powder was the one I had most hope for. I paid for the
    subscription, and the drink was definitely gritty/chalky, so most
    mornings the tub just sat next to a shaker bottle I didn't want to
    wash.

    Somewhere along the way I decided I was just someone who doesn't
    stick to things. Then it hit me that I never quit because of what
    was inside. I quit because every option asked me to do something I
    didn't want to do, every single day.

    So when I saw greens as a little pack of gummies you tear open and
    eat, I nearly scrolled past, because it looked like candy. I tried
    it mostly to prove a point. I thought the first pack I tried tasted
    terrible, but after the third day they started tasting better.

    I just take these now and it's easier for me to manage, and I
    stopped buying the separate gummies too. It's wild, but I want to
    take it, and I don't forget.

    If you've quit a powder or a pill stack and decided you're the
    problem, I get it, because I decided the same thing. The link is
    below. Their guarantee is a 30-day money-back on your first order.

    This story is put together from what Sprout customers told us.

    OTHER OPENINGS (hook_variants)
    1 First lines: "For years I thought I was just someone who doesn't
      stick to things."
      Headline: Why your greens habit keeps falling apart
      Image: five half-used, unbranded supplement jars on a shelf
    2 First lines: "The powder was the one I had most hope for."
      Headline: Before you buy another greens powder, read this
      Image: a shaker bottle in the sink with a green ring inside

    NOTES
    Lead problem:   quitting every supplement (reviews 1, 3, 5)
    Underneath:     "it's me, I don't stick to things" (inferred)
    Old way:        greens powders and separate gummies, as kinds
    Buyer knows:    the problem and fixes that failed, so short fits
    Narrator:       composite of reviews 1, 2, 3, 5, 18, no name given.
                    Closing line included. No review is marked verified.
    Word count:     244, closing line included
    Placeholders:   none needed
    Borrowed:       "tried a few green powders over the years" (1);
                    "the drink was definitely gritty/chalky" (3); "I
                    just take these now and it's easier for me to
                    manage" (5); the first-pack taste line (18); "It's
                    wild ... and I don't forget" (2)
    Inferred:       the unwashed shaker; "looked like candy"; "to prove
                    a point"; the idea that every option asked for a
                    daily chore
    Left out:       "$94 a month" (review 3). It's another brand's price
                    and can't be checked, so it stays out.
    Tests against:  the same story with the searcher arc

tweaks:
  - what: The form
    how: Personal history opens on a flat count of what they tried. Swap to "please stop doing this" for a short, sharper post, or "forum post" for a long one that opens on what the narrator used to believe.
  - what: The arc
    how: Reluctant believer sounds guarded and leans on your guarantee at the end. The searcher sounds determined and lists every attempt. Same quotes, different mood.
  - what: The narrator
    how: Composite is the safe default. If a real customer has agreed in writing, name them and the story uses only their own details and words.
  - what: The length
    how: Brief and short suit strangers and phone readers. Standard and long add parts such as "I know what you're thinking" and what's in it, so only use them when you have the facts to fill them.

judge:
  - Read the first three lines alone. Would your buyer think it's about them?
  - Every phrase in quotation marks matches a review or your guarantee word for word.
  - The result in the story is one a customer reported. Look for it in your reviews.
  - A composite story ends with the line saying it was put together from customers.
  - No rival brand is named, and nothing says the product treats a condition or works in a set time.
  - The word count in the notes matches what a word counter says.

test:
  - Run it on the story your best reviews already tell. Read the first three lines to someone who bought from you and ask if it sounds like them. If they say "sort of", paste more reviews about the moment before they bought.
  - Search your reviews for every phrase in quotation marks. Each must match word for word. One reworded quote is reason enough not to run it.
  - Run it twice with the same form and arc. The borrowed phrases and the result described should stay the same; only the scene details should change.
  - Put it next to your current best long ad and read both aloud. Note where you stumble or skim in each.
  - Read the "Inferred" and "Placeholders" lines. If both are empty on thin research, it filled gaps without telling you; ask it to mark every line not from a review.

improve:
  - Paste your allowed and banned claims and your guarantee wording into "What you need" in the skill file, so the close always uses the exact terms.
  - If you only ever run one form (for example personal history), delete the others from references/forms-and-arcs.md so it can't drift.
  - Add two lines from your brand voice to step 6 as a model, so the narrator sounds like your customers and your brand, not a generic post.
  - When a version wins, save its form, arc and opening in your brand file, then test a new arc on the same quotes next time.
  - Pair it with a skill that plans the story ad (problem, narrator, picture) before you write it, and with one that reads copy aloud for flow.

terms:
  - term: Composite narrator
    meaning: A first-person voice built from what several real customers said, never presented as one real person.
  - term: Form
    meaning: The shape of the story, such as a personal history, a letter about someone or a rant.
  - term: Arc
    meaning: How the narrator feels about the problem and the answer, from guarded to quietly angry.
  - term: Placeholder
    meaning: A gap in square brackets, such as [delivery time], left where a fact is needed but wasn't given.
