how_it_works:
  - title: Step 1
    text: Read the role and operation policy.
  - title: Step 2
    text: Check and reserve budget before the model call.
  - title: Step 3
    text: Pass scoped context and the selected model.
  - title: Step 4
    text: Record input and output tokens, provider status and actual price inputs.
  - title: Step 5
    text: Reconcile failed or cancelled calls.
  - title: Step 6
    text: Return an explicit error instead of inventing a model response.
