thinking: low
thinking_why: It uses a few set viewer functions.
new_slug: 3d-image-viewer-builder
name: 3D image viewer builder
summary: Build a 3D image viewer in MATLAB. Give it a scan or mesh and get code to scroll slices, overlay masks and draw marked regions.
job: build-software
headline: 3D image viewer builder
subhead: Give it a 3D scan, volume file or surface mesh, plus any mask to lay on top. It picks the right MATLAB display call for your data and writes the viewer code. You get slice scrolling, overlay display, drawn regions with notes and a starter app layout if you want one. It needs MATLAB with the Image Processing Toolbox, and the licence lets you use it only with MathWorks products.
explain: |
  You get MATLAB code that opens a 3D scan or surface mesh in an interactive viewer. You can scroll through slices, lay a colour mask on top, and draw marked regions and notes right on the volume.

  The skill picks the right display call for your data type. Volumes go in a volume viewer, and meshes use a faster surface object than the older isosurface route. Medical files such as DICOM or NIfTI load through the medical volume class, which brings in spacing and units from the file. It also covers overlays, drawn shapes with move callbacks, streaming data in, and wrapping the viewer in an app. It needs MATLAB with the Image Processing Toolbox.
when:
  - You have a CT or MRI file and want to look at it in 3D.
  - You need to lay a segmentation mask over the original scan.
  - You want users to draw regions of interest on a volume.
  - You are building a small app around a 3D data viewer.
not_for:
  - "You do not have the Image Processing Toolbox: the skill falls back to older isosurface and patch calls, which are slower, so get the toolbox first."
  - "You only need a quick still picture of a slice: use MATLAB's imshow on one slice, no viewer needed."
  - "You do not use MATLAB: ask a developer for a viewer in your own tool, because this writes MATLAB code only."
  - You want to use the code outside MATLAB or other MathWorks products. The licence does not allow it.
you_give:
  - Your 3D volume, scan file or surface mesh
  - A mask or label volume to overlay (optional)
  - The shapes or regions you want to mark
  - Whether you want a plain viewer or a small app (optional)
you_get:
  - MATLAB code for the viewer
  - Overlay and mask display
  - Drawn regions and annotations
  - Slice scrolling controls
  - A starter app layout (optional)
how_to_use:
  - Open your AI chat and paste in the skill text from this page.
  - Paste in the file type of your scan (DICOM, NIfTI or mesh) and say what you want to see, such as slices, a mask overlay or drawn regions.
  - Say if you want a small app around the viewer.
  - Run the code it gives you in MATLAB. You need the Image Processing Toolbox. DICOM and NIfTI files also need the Medical Imaging Toolbox.
  - Check the scan opens with the right size and units, and that a slice looks like the scan you expect.
  - If it fails, tell your AI the exact MATLAB error. The usual causes are a missing toolbox and wrong spacing or units.
  - Want a full app next? Ask for the app layout, or pair the viewer with the MATLAB app builder.
  - This is a viewing aid, not a tool for diagnosis. Ask someone who knows MATLAB, and a qualified clinician for anything medical, before you rely on what you see.
output_sample:
  input:
    - Your 3D volume, scan file (DICOM, NIfTI or NRRD) or surface mesh
    - A mask or label volume to lay on top (optional)
    - The shapes or regions you want to draw and mark
    - "What you want to build: a plain viewer or a small app"
  prerequisites:
    - MATLAB with the Image Processing Toolbox
    - The Medical Imaging Toolbox, if you load DICOM, NIfTI or NRRD files
    - Use it only with MathWorks products such as MATLAB. The licence (BSD 2-Clause plus MathWorks reuse terms) says so
  output:
    - name: Viewer setup
      contains: Code that creates the 3D viewer and shows your volume with volshow, set to the right units and spacing.
    - name: Surface mesh display
      contains: Code that shows a surface mesh in the viewer using a Surface object, not the older isosurface call.
    - name: Overlay display
      contains: Code that lays your mask or label volume over the scan in colour.
    - name: Annotations
      contains: Code that lets users draw shapes on the volume, with a callback that runs when a shape moves.
    - name: Rendering style and streaming
      contains: Code to change how the volume looks and to feed in new volume data over time.
    - name: App layout
      contains: A starter app that holds the viewer, with an optional colorbar and linked viewers.
