name: 3D website builder
summary: Describe the site and its mood. Get 3D page code with shaders, motion,
  a preloader and phone tuning.
job: build-websites
headline: 3D website builder
subhead: Describe the site, its mood, your colours and any 3D models. It writes
  the scene and render loop, custom shader effects, smooth motion and hover
  behaviour, and a loading screen. You get code tuned to run well on phones,
  with the pixel ratio capped and effects kept light.
explain: |
  A high-end 3D website needs more than a model on a page, and this skill writes the code for custom shader effects, smooth motion, a loading screen and phone tuning.

  The work goes in four steps. First, a render loop with a resize handler and a pixel ratio capped at two, so high-density screens do not choke. Second, post-processing such as bloom, depth of field or film grain, kept to few passes. Third, motion and light physics, so objects respond to hover, drag and click. Fourth, an asset pipeline with compressed models and a preloader. It includes examples in React Three Fiber and in GLSL for a wavy liquid surface.
when:
  - You want an award-style site with 3D and custom visual effects.
  - Your 3D page looks good on a laptop but stutters on a phone.
  - You need a branded loading screen while heavy files download.
  - You want objects to react to the mouse in a natural way.
you_give:
  - A description of the site and its mood
  - Your brand colours and any 3D models
  - The framework you use, such as React (optional)
  - Target devices and a speed goal
you_get:
  - Scene and render loop code
  - Shader and post-processing effects
  - A preloader
  - Motion and hover behaviour
  - Mobile performance settings
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and open a browser.
