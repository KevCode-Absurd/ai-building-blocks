thinking: medium
thinking_why: It follows set steps but picks channels to fit your business.
new_slug: 90-day-marketing-plan
name: Ninety day marketing plan builder
summary: Build a 90 day marketing plan for your online store. Give it your product, price and budget. You get a buyer profile, ranked channels and weekly actions.
job: run-your-store
headline: Ninety day marketing plan builder
subhead: Describe your product, price, store platform, budget and main rivals. It writes a buyer profile, maps how competitors price and position, and ranks the channels worth starting with. You get the profile, a channel list with budget split, an email and text flow outline and a 90 day action plan.
explain: |
  Your online store gets a full marketing plan: who your buyer is, which channels to start with, how to split your budget, and what to do in each of the first 90 days.

  The skill starts with your product, market and rivals. From that it writes a buyer profile with pains and buying reasons, then maps how competitors price and position, and where the gaps sit. Next it ranks channels such as paid ads, search, email and text, content, social, influencers and referrals by likely return for your stage. Each one gets a budget share and a content direction. It works for Shopify, Amazon, Etsy and others, and needs no API key.

  The benchmark figures in the plan (channel returns, budget shares, repeat-buyer rates) come from the original author's reading of public reports such as Omnisend and Gartner. We have not checked them. Treat them as starting guesses and replace them with your own numbers as soon as you have them.
when:
  - You just launched a store and have no marketing plan.
  - You have a small budget and need to know where to spend it first.
  - You want to know who your best buyer is and where to find them.
  - You are planning the next quarter and want weekly actions.
not_for:
  - "You need detailed ad campaign setup: use a pay-per-click planner or the ad platform's own setup guide, because this plan only gives a short ad brief."
  - "You want Amazon keyword research: use a tool built for Amazon search terms, because this plan only gives keyword themes."
  - "You want a plan with no questions asked: it needs your price, margin, budget and stage, and it marks guesses clearly."
you_give:
  - Your product and price
  - Your store platform
  - Your marketing budget
  - Your main competitors (optional)
  - Your sales so far (optional)
you_get:
  - A buyer profile
  - A ranked channel list with budget split
  - An email and text flow outline
  - A content and social direction
  - A 90 day action plan
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text into a new chat.
  - Tell it about your product, price, margin, monthly budget and where you sell.
  - Answer its one round of multiple-choice questions. Short replies like 1b 2c 3a are enough.
  - Add competitor names or links if you have them. Your AI needs web access to look them up.
  - Check the guesses marked with a warning sign. Give better numbers and ask it to update the plan.
  - Start with the week one actions in the 90-day plan.
  - After week four, add your real sales and spend numbers and ask your AI to update the plan.
output_sample:
  input:
    - Your product type and price
    - Your profit margin and monthly marketing budget
    - Your business stage and main goal
    - Where you sell, such as Shopify, Amazon or Etsy
    - Your competitors, as names or links (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini
    - Web access in your AI, if you want it to look up competitors (optional)
  output:
    - name: Business Snapshot
      contains: Your product, price, margin, budget, stage and goal in one short summary, with guesses marked.
    - name: Target Audience Persona
      contains: Who your buyer is, their pains, why they buy and where they spend time online.
    - name: Competitive Landscape
      contains: How rivals price, position and market, and where the gaps are.
    - name: Channel Strategy (Prioritized)
      contains: Channels ranked for your stage, each with a budget share and content direction.
    - name: 90-Day Action Plan
      contains: A week-by-week list of actions and milestones for your first three months.
    - name: KPIs & Measurement
      contains: The numbers to track to know if each channel is working.
