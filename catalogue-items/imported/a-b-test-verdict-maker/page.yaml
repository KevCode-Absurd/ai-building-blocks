thinking: high
thinking_why: Wrong statistics lead to wrong launches, so each check needs care.
new_slug: a-b-test-verdict-maker
name: A/B test verdict maker
summary: Check your A/B test data for a bad split, see each version's result with a 95% range, and get a clear ship, stop or extend call.
job: track-numbers
headline: A/B test verdict maker
subhead: Give it your test plan, the data with user, version and outcome, and your main and guard metrics. It checks that traffic split as planned, works out each version's result with a 95 percent range and looks for side effects. You get a report and a ship, stop or keep running call.
explain: |
  Your A/B test ends with a clear ship, don't ship or keep running call, backed by the numbers.

  The skill confirms the test setup first: the question, who was split, the main metric and the guard metrics. Then it checks that traffic split the way it should, using a chi-square test. If the split is off, it stops, because the result cannot be trusted. Next it works out each version's rate with a 95 percent range, runs a z-test for rates or Welch's t-test for averages, and repeats the test on guard metrics. A drop in any guard metric blocks the launch. It finishes with the expected business impact and a filled-in report.
when:
  - Your test finished and your team needs a yes or no.
  - The result looks positive but you doubt it is real.
  - A test has run for weeks with no clear winner.
  - You want to size a test before you start it.
not_for:
  - "Your test has not reached its planned sample size yet: wait until it does, or ask a data analyst before you call it."
  - "You have no data, only an idea: plan the sample size with a simple online sample size calculator first."
  - "You need to compare more than two versions or run tests over time: ask a statistician, as this skill covers one test against a control."
you_give:
  - Your test plan or hypothesis
  - Data with user ID, version and outcome
  - The main metric and any guard metrics
  - The planned traffic split
you_get:
  - A traffic split check
  - Results with 95 percent ranges
  - Guard metric checks
  - A ship, stop or extend call
  - A written test report
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick one that can run code and read files, as the script in this skill needs it to check the split.
  - Paste in this skill and your test plan, with the main metric, guard metrics and planned split.
  - Upload your data file with user ID, version and outcome for each user.
  - Read the split check first. If the split is off, stop and fix how users were assigned before you trust any result.
  - Read the guard metric checks, then the ship, stop or extend call and the expected impact.
  - Save the filled-in report to share with your team.
  - If your AI cannot run code, ask it to do the split check by hand with a chi-square calculator, and to work out the rest step by step.
  - After the call, use the ship decision to brief your team. If the call is stop or extend, plan the next test and size it with a sample size calculator.
output_sample:
  input:
    - Your test plan or hypothesis
    - Your test data with user ID, version and outcome
    - Your main metric and any guard metrics
    - Your planned traffic split, such as 50/50
    - The smallest gain that is worth shipping (optional)
  prerequisites:
    - An AI that can run code and read a CSV file works best
  output:
    - name: scripts/ab_test_analyzer.py
      contains: A script that checks the split, runs the significance test, checks power and tests guard metrics from a CSV or summary numbers.
    - name: references/ab_test_design_guide.md
      contains: Notes on why splits go wrong, how to plan sample size, and the risks of peeking and testing many things.
    - name: assets/ab_test_report_template.md
      contains: "The report: test design, results, checks, the ship, stop or extend call, and expected impact."
