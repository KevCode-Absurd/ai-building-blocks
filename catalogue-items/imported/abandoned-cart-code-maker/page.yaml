thinking: medium
thinking_why: It creates real codes, so it must get the rules right.
new_slug: abandoned-cart-code-maker
name: Abandoned cart code maker
summary: Connect your Shopify store. Get one discount code per shopper who left
  a cart, plus a tag.
job: make-offer
headline: Abandoned cart code maker
subhead: Give it your Shopify store, how many days back to look, a minimum cart
  value and the discount. It pulls recent abandoned checkouts, drops small carts
  and makes one unique code per shopper. You get a preview count, the live
  codes, a tag on each customer and a summary. Codes cannot be bulk deleted.
explain: |
  You get a unique discount code for each shopper who left a cart, and each of them is tagged in your Shopify store so you can message them next. The codes are live as soon as they are made, and they cannot be bulk deleted.

  It pulls abandoned checkouts from the last few days, filters out carts below your minimum value, then creates one code per person at your chosen percentage with your chosen prefix. It then adds a tag to each customer. A preview mode shows how many people qualify before anything is written. It does not send email, so you need a separate tool for that. It needs the Shopify command line signed in, with the right permissions.
when:
  - You want to win back shoppers who left items in their cart.
  - You need single-use codes so one code is not shared around.
  - You want a tagged list of customers to feed into your email tool.
  - You want to see how many carts qualify before you commit.
you_give:
  - Your Shopify store address
  - How many days back to look
  - A minimum cart value (optional)
  - The discount percentage and code prefix
  - Shopify access with the right permissions
you_get:
  - A preview count of eligible shoppers
  - One unique code per shopper
  - A tag on each customer
  - A summary of what was created
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin and change live
    store data.
