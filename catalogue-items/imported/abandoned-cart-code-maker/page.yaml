thinking: medium
thinking_why: It creates real codes, so it must get the rules right.
new_slug: abandoned-cart-code-maker
name: Abandoned cart code maker
summary: Make one single-use discount code for each shopper who left a cart in your Shopify store, tag them, and get a CSV list to use in an abandoned cart email.
job: make-offer
headline: Abandoned cart code maker
subhead: Give it your Shopify store, how many days back to look, a minimum cart value and the discount. It pulls recent abandoned checkouts, drops small carts and makes one unique code per shopper. You get a preview count, the live codes, a tag on each customer and a summary. To undo a run, delete its discount in Shopify Admin.
explain: |
  You get a unique discount code for each shopper who left a cart, and each of them is tagged in your Shopify store so you can message them next. The codes are live as soon as they are made. To undo a run, delete the discount it made in your Shopify Admin under Discounts. The tags stay on the customers until you remove them.

  It pulls abandoned checkouts from the last few days, filters out carts below your minimum value, keeps one checkout per email, then creates one code per person at your chosen percentage with your chosen prefix. It then adds a tag to each customer. A preview mode shows how many people qualify before anything is written. It does not send email, so you need a separate tool for that. It needs the Shopify command line signed in, with the right permissions.
when:
  - You want to win back shoppers who left items in their cart.
  - You need a unique code for each shopper so one code is not shared around.
  - You want a tagged list of customers to feed into your email tool.
  - You want to see how many carts qualify before you commit.
not_for:
  - "You need to send the emails: use Shopify Email or your own email tool, because this only makes codes and tags."
  - "You want one shared code for everyone: make it by hand in your Shopify discounts page."
  - "Your store is not on Shopify: use your own store's discount tools, because this only works with Shopify."
you_give:
  - Your Shopify store address
  - How many days back to look
  - A minimum cart value (optional)
  - The discount percentage and code prefix
  - Shopify access with the right permissions
you_get:
  - A preview count of eligible shoppers
  - One unique code per shopper
  - A tag on each customer
  - A summary of what was created
how_to_use:
  - Open an AI that can run code and use the Shopify command line, such as Claude Code. A plain chat window cannot do this.
  - Sign in to your store with the Shopify command line first. Your login needs the permissions listed on this page.
  - Paste this skill. Give your store address, days back, minimum cart value, discount and code prefix.
  - Run it in preview mode first. Turn on dry run, and check how many shoppers qualify.
  - Your AI will first run a small read-only check of the Shopify queries. It has not been tested on a real store, so expect it to fix a field name or two. Then it stops and asks you to confirm the count. Reply with the count and say yes before anything is made.
  - Once you confirm, the codes go live at once. If something is wrong, delete the discount in Shopify Admin. The tags stay on the customers until you remove them.
  - Open the CSV and load it into your email tool. It needs the customer_email and discount_code columns, and the tag name if your tool filters by tag. Then send each shopper their code.
output_sample:
  input:
    - Your Shopify store address
    - How many days back to look (optional)
    - A minimum cart value (optional)
    - The discount percentage and code prefix (optional)
    - A tag name for the shoppers (optional)
  prerequisites:
    - An AI that can run code and use the Shopify command line
    - A Shopify login with permission to read checkouts and customers, and to write discounts and customers
  output:
    - name: Start banner
      contains: Your store address and the start time, shown when the run begins.
    - name: Step log
      contains: One line per step with what was asked and how many items it found or changed.
    - name: Discount codes
      contains: One single-use code per eligible shopper, with your prefix, your percentage and a 30 day expiry.
    - name: Customer tags
      contains: Your tag added to each shopper who got a code, so you can find them later.
    - name: Outcome summary
      contains: Counts of checkouts found, eligible shoppers, codes made, shoppers tagged and errors.
    - name: recovery_list CSV
      contains: One row per shopper with email, cart total, date left, code, discount percentage and tag.
