thinking: medium
thinking_why: It follows a set method and adapts its questions or draft to your evidence.
new_slug: academic-cv-builder
name: Academic CV builder
summary: Build an academic CV for a faculty, postdoc or research job. Share your degrees, papers, grants and teaching. Get a draft in the right order.
job: find-a-job
headline: Academic CV builder
subhead: Share your degrees, publications, research, grants and teaching record. It orders the sections for your target academic role and formats each part. You get a CV draft, field-specific layout notes and a checklist of missing details to confirm.
not_for:
  - "You are applying for an industry job or a non-academic role: use a standard resume builder, because this skill is made for academic CVs."
  - "You need a cover letter or research statement: write those with your AI as a separate task, since this skill only builds the CV."
  - "You want a one or two page resume: use a standard resume builder, because an academic CV lists your full record and runs longer."
explain: Share your degrees, publications, research, grants and teaching record. It orders the sections for your target academic role and formats each part. You get a CV draft, field-specific layout notes and a checklist of missing details to confirm.
you_give:
  - Your degrees, publications, grants and teaching history.
  - The academic role and field you are applying to.
you_get:
  - A structured academic CV draft.
  - Notes on section order and field conventions.
  - A list of missing or unconfirmed details.
how_it_works:
  - title: Choose the section order
    text: Orders the sections for a research, teaching or other academic role.
  - title: Ask for what is missing
    text: Asks for missing details one at a time before drafting, such as dates, DOIs and your role on each grant.
  - title: Format your record
    text: Puts what you supplied into consistent sections in your field's style.
  - title: Check the details
    text: Checks dates and publication status, and lists what you still need to confirm.
how_to_use:
  - "Gather your details first: degrees with dates and advisors, a publication list with DOIs, grants with amounts and your role, and the job advert."
  - Open Claude, ChatGPT or Gemini and paste the skill instructions. No code, files or paid tools are needed.
  - Paste your details, and tell your AI the role and field you are applying for.
  - Answer any questions your AI asks about missing details.
  - Check the draft against the job advert. Confirm every item on the missing-details checklist.
  - Replace any sample names, grants and dates before you send the CV.
  - Next, paste the confirmed draft into your application. Ask your AI for a cover letter or research statement as a separate task.
output_sample:
  input:
    - Your degrees, with dates, advisors and thesis titles
    - Your publications, with DOIs if you have them
    - Your grants, with amounts and your role
    - Your teaching, mentoring and service history
    - The academic role and field you are applying for
  output:
    - name: Recommended Section Order
      contains: The order of CV sections that suits your role type and field, such as research, teaching or admin.
    - name: Section Content
      contains: Your education, positions, publications, presentations, grants, teaching, mentoring, service and awards, formatted in the style of your field.
    - name: Formatting Notes
      contains: Field-specific habits to follow, such as author order, numbered lists and how to mark your own name.
    - name: Things to Add/Update
      contains: A checklist of missing or unconfirmed details for you to fill in or check.
