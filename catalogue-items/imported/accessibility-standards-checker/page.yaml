thinking: medium
thinking_why: It tests against a fixed list of success criteria.
new_slug: accessibility-standards-checker
name: Accessibility standards checker
summary: Check your site against WCAG accessibility rules. Give it your page code or screenshots. You get gaps by level, ranked fixes and draft statement notes. Not legal advice.
job: check-contracts
headline: Accessibility standards checker
subhead: "Describe your site or app, paste its code or add screenshots, and say which level you aim for: A, AA or AAA. It checks each criterion and sorts the gaps by level. You get a gap table, fixes ranked by priority, corrected code, draft accessibility statement notes and a map from rules to laws."
explain: |
  Where your site or app falls short of the web accessibility standard shows up in a list sorted by level, with the most important fixes first, plus notes for an accessibility statement.

  The skill answers in the format that suits your question. A criterion question gets the rule, its level, why it matters, common failures and the fix. An audit gets a table of issue, location, severity and repair. A gap review marks each criterion red, amber or green. It always names the exact criterion number, such as 2.4.7 Focus Visible. It also maps the rules to laws like the European Accessibility Act, Section 508 and ADA cases. That law map is a starting point only. The dates in it were last checked by the original author on 3 October 2026 and may be out of date, so confirm each one with an accredited assessor or a lawyer.

  What it adds to a plain question about WCAG: a gap table with a status for every criterion, fixes ranked by priority, your code with corrections, and draft statement notes in one pass.
when:
  - A client asks whether your site meets accessibility rules.
  - You need to know which fixes to do first with limited time.
  - You want draft notes for an accessibility statement, to finish after a full test.
  - You want to see which laws apply to your product.
not_for:
  - "You need a legal opinion or a formal audit: ask an accredited accessibility assessor, since this gives general guidance only."
  - "You want a fast automatic scan of live pages: run a scanner such as axe or WAVE, and use this to explain and rank what it finds."
  - "You only need a plain-language summary of one rule: ask your AI the question directly, no full check needed."
you_give:
  - A description of your site or app
  - Page HTML, code or screenshots to review (optional)
  - "The level you aim for: A, AA or AAA"
  - Your country or market (optional)
you_get:
  - A gap table with status for each criterion
  - Fixes ranked by priority
  - Annotated code with corrections
  - Draft notes for an accessibility statement
  - A map from rules to laws
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - "Describe your site and say which level you aim for: A, AA or AAA."
  - Paste one page or one component at a time. A whole page of HTML can be too long for a usable gap table. Add screenshots if you have them, and name the level you aim for, before you ask for a gap table. A URL alone gives the skill nothing to check, because it cannot open a link.
  - Read the gap table first. Check that each criterion number matches what you see on the page.
  - Pass the ranked fixes to your developer. After the fixes, re-test with an automatic scanner such as axe or WAVE. Then do a manual keyboard check and a screen reader check.
  - Treat the statement notes as a draft. Do not publish a claim such as "meets AA" until a full test is done and an accredited assessor has checked it.
  - Laws and deadlines in the map were last checked by the original author on 3 October 2026, and some dates, such as the June 2025 European deadline, have already passed. Confirm them with an assessor or lawyer before you rely on them.
output_sample:
  input:
    - A description of your site or app
    - Your page HTML or screenshots (optional)
    - "The level you aim for: A, AA or AAA"
    - Your country or market (optional)
  prerequisites:
    - An AI chat that can read pasted text or images. It cannot open a link by itself.
  output:
    - name: Gap table
      contains: Each criterion with a red, amber or green status, short gap notes and a priority.
    - name: Audit table
      contains: Each issue, where it is, how serious it is and how to fix it.
    - name: Ranked fixes
      contains: The changes to make first, ordered by level and priority.
    - name: Annotated code
      contains: Your code with the rule breaks marked, plus a corrected version.
    - name: Accessibility statement notes
      contains: Draft conformance claim, known issues and a contact line for your statement.
    - name: Legal mapping
      contains: Each criterion matched to laws such as the European Accessibility Act, Section 508 and ADA cases.
