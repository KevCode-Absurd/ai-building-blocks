thinking: medium
thinking_why: It follows set quality rules while making many layout choices.
new_slug: accessible-ui-builder
name: Accessible UI builder
summary: Describe your screen and get accessible UI component code that works on phone and desktop and follows your design system.
job: build-websites
headline: Accessible UI builder
subhead: Describe the screen, your design system and the framework you use. It builds small components that each do one job, follow your style rules and work with a keyboard and screen reader. You get the component code, a responsive layout, focus handling, loading, empty and error states, and tests if you want them.
explain: |
  A screen that is responsive, usable with a keyboard and screen reader, and consistent with your design system is built for you. It should look like a careful designer made it, not a generic AI page.

  The skill keeps each component small and does one job. It prefers composing parts, such as a card with a header and a body, over one component with a dozen options. It follows your existing spacing, colour and type rules rather than inventing new ones, and it adds proper labels, focus states and sensible states for loading, empty and error. It also steers away from the stock AI look. You need a front-end project to build in.
when:
  - You need a new page or component that follows your style.
  - Your current screen fails on keyboard or screen reader use.
  - You want a layout that works on phone and desktop.
  - Generated screens in your app all look the same and you want them to look hand made.
not_for:
  - "You only need server or API work with no screen: ask a back-end developer or use your AI's general coding help."
  - "You need a new brand look, logo or colours from scratch: start with a designer or a design tool, then come back."
  - "You have no front-end project to build in: use a simple page builder instead."
you_give:
  - A description of the screen
  - Your design system or style rules
  - The framework your project uses
  - Existing components to reuse (optional)
you_get:
  - Component code
  - Responsive layout
  - Accessible labels and focus handling
  - Loading, empty and error states
  - Tests for the component (optional)
how_to_use:
  - Gather three things first, the screen description, your design rules and your framework with its version. Then open your AI in a chat, or in a coding tool that can see your project files.
  - Paste the skill text, then describe the screen you want.
  - Add your design system rules, your framework and any components to reuse.
  - Let your AI build the components, then ask for tests if you want them.
  - Tab through the screen with your keyboard and check it at phone and desktop widths.
  - Fix anything on the checklist that fails before you use the code. The full checklist file is not in this copy, so check labels, focus and contrast by hand.
  - Next, run the Accessibility checker on the finished screen, then ask a designer to review it.
output_sample:
  input:
    - A description of the screen you want
    - Your design system or style rules
    - The framework your project uses
    - Existing components to reuse (optional)
  prerequisites:
    - A front-end project to build in
    - An AI that can run code and open a browser, to check the result
  output:
    - name: Component files
      contains: Small components that each do one job, built from parts and using your spacing, colour and type rules.
    - name: Responsive layout
      contains: A mobile-first layout checked at 320, 768, 1024 and 1440 pixels wide.
    - name: Accessibility
      contains: Labels on controls, keyboard use, focus handling and clear heading order, aimed at WCAG 2.1 AA.
    - name: States
      contains: Loading, empty and error views, plus success and permission states where they apply.
    - name: Test file
      contains: Tests for the component, when you ask for them.
    - name: Checklist result
      contains: A tick list covering keyboard use, screen reader, responsive widths, design system fit and console errors.
