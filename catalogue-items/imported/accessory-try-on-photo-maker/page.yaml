thinking: medium
thinking_why: Where the item sits on the body decides if the photo looks real.
new_slug: accessory-try-on-photo-maker
name: Accessory try-on photo maker
summary: Make an accessory try-on photo from your product shot. Give it a shoe, bag, watch or necklace photo and get a prompt that puts it on a model.
job: product-photos
headline: Accessory try-on photo maker
subhead: Give it a clear product photo, a reference photo of the model and scene, and where the item should sit. It writes the image prompt with exact placement, perspective and shadow rules that keep the product unchanged. You get the prompt, and the on-model picture once your image tool draws it.
explain: |
  A real-looking person can wear your shoe, bag, watch, glasses or necklace in a photo made from your product picture.

  The skill writes the instructions for an image model and sends your product image plus a model reference photo with them. The key idea is that an accessory fills only a small part of the picture, so the prompt says exactly where it must sit, such as on the nose bridge and ears for glasses. It tells the model to keep your product identical in shape, colour and detail and to change nothing else in the scene. Your image model draws it, and that may need an account or key.
when:
  - You sell accessories and want on-model photos without a shoot.
  - You have a flat product photo and need a lifestyle version.
  - You want the same scene with a different product in it.
  - You need the product to stay true to the real item.
not_for:
  - "You do not have the model's agreement: use only a reference photo of a person who has agreed to it, and never show the result as a real customer photo or an endorsement."
  - "You want clothing on a model: this skill is for worn items like glasses, watches and bags, so use a photographer or a clothing try-on tool."
  - "You need photos of real customers or a real shoot: a person must take those, and marketplaces may ask you to label made-up images."
  - "You only have a blurry, cropped or cluttered product photo: retake the photo first, or the product will not stay true."
you_give:
  - A clear photo of the product
  - A reference photo of the model and scene
  - Where the item should be worn
  - An image-tool account with an API key and credits (the skill uses dLazy). This is a paid service, so you need it before the picture step.
  - Written agreement from the person in the model photo
you_get:
  - A ready-to-run image prompt
  - Placement instructions for the item
  - Rules that keep the product unchanged
  - The finished on-model image, once your image tool runs it
how_to_use:
  - Before you start. The picture step needs a paid dLazy account, an API key and credits. A dry run shows the cost first. Without them you still get the prompt, which you can run in another image tool that edits with several pictures.
  - Open Claude, ChatGPT or Gemini and paste in this skill. Pasting it into a chat only writes the prompt. It does not draw the picture.
  - Add your product photo, your model photo and where the item should be worn. Photos must be 20 KB to 15 MB, larger than 400 x 400 pixels, and jpg, jpeg, png or webp. The model must have agreed to the use of their photo.
  - Read the prompt it writes. Check the placement line and the keep-unchanged rules.
  - To get the picture, run the prompt in your image tool. The skill's own route is the dlazy command line tool or scripts/gen.mjs, which need a paid API key and credits, so a coder or an AI that can run code must do this step. Do the cost check first (it has a dry run). Or paste the prompt into another image tool that can edit with several pictures.
  - Ask for 2 to 4 versions, pick the best, and fix any problem with the fix-up lines. Each version is one JPEG, 1024 x 1536 for body shots or 1024 x 1024 for close-ups of a wrist or ear.
  - Label the image as illustrative wherever a buyer or marketplace could take it for a real customer photo.
  - Check the image against the marketplace's image rules before you upload it.
  - Next, write the listing text with the Product description writer.
output_sample:
  input:
    - "A clear photo of your product (optional: more angles of it)"
    - A reference photo of the model and scene
    - Where the item should sit, such as nose bridge, wrist or neck
  prerequisites:
    - An image tool that can edit with several pictures, with an account or key, which costs credits
    - An AI that can run code, if you want it to draw the image for you
  output:
    - name: Image prompt
      contains: One block of text that names the product, the model photo, the exact placement and what must not change.
    - name: Placement line
      contains: Where the item sits on the body, with perspective, scale and contact shadow.
    - name: Keep-unchanged rules
      contains: Orders to keep product shape, colour, hardware and logo the same, and leave face and background alone.
    - name: Fix-up lines
      contains: Extra sentences to add if the item sits wrong, looks too big, doubles up or changes the face.
    - name: On-model image
      contains: One portrait JPEG per run, with 2 to 4 versions to pick from if you ask for them.
