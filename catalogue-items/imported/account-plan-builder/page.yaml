thinking: high
thinking_why: It weighs many facts to set goals and a plan.
new_slug: account-plan-builder
name: Account plan builder
summary: Build an account plan for one customer. Give it the account name and your CRM, or a file of account and deal rows. You get goals, key people, risks and next steps in one doc.
job: sell-and-negotiate
headline: Account plan builder
subhead: "Name the account and connect your CRM and document tools, or upload a file of account and deal rows. It gathers the account picture, then drafts a plan in sections: current state, goals, who you know, open deals, risks and actions. You get the plan in a doc or in chat, a stakeholder map and the key CRM fields updated after you approve, or a checklist if it cannot write to your CRM."
explain: |
  You get a strategic plan for one account in a shared doc, with the key fields copied back to your CRM. It covers where the account stands, goals, the people involved, open deals, risks and next steps.

  The skill starts by checking your CRM setup, then gathers the account picture from your connected tools. It drafts the plan in sections: current state, goals, stakeholder coverage showing who you know and who you are missing, an opportunity map, risks, and an action plan. You review the draft. The highlights then sync to the CRM, and you decide whether to approve each change. Your CRM and a docs tool are optional. An uploaded file of account and deal rows works instead, and the plan then shows in chat with a checklist to apply by hand.
when:
  - You are preparing for a quarterly review with a key customer.
  - You need a plan for a large account you just inherited.
  - You want to see which decision makers you have not met.
  - You want your CRM to match the plan without retyping.
not_for:
  - "You are prepping a first call with a new prospect: use a short discovery brief or your own call notes, since there is no account history to plan from."
  - "You only want to see who you know at the account: ask your AI for a stakeholder map on its own, which is one step of this plan."
  - "You want a deep search for upsell ideas only: ask your AI for an expansion review, as this plan only lists first ideas."
you_give:
  - The account name
  - Your CRM and document tools, or a file of account and deal rows
  - Your goals for the account (optional)
  - Notes or past plans (optional)
you_get:
  - A written account plan in a doc
  - A stakeholder coverage map
  - An opportunity and risk list
  - An action plan with next steps
  - CRM fields updated after your approval
how_to_use:
  - Before you start, have the account name ready, and connect your CRM and docs tool, or have a file of account and deal rows. Enrichment tools are optional, and are usually paid services with their own account or key.
  - Open Claude, ChatGPT or Gemini and paste in the skill text. Connect your CRM first if your AI allows it.
  - Type the account name. Say if you want a new plan or a refresh, and if you want a quarter, half or year.
  - If your CRM is not connected, upload a file of the account and deal rows. Paste any notes or call transcripts too.
  - Read each section and check the sources it names. Fix anything that looks wrong.
  - Approve the CRM changes one by one. If your AI cannot write to your CRM, you get a checklist to apply by hand.
output_sample:
  input:
    - The account name or CRM record
    - "Plan length: quarter, half or year (optional)"
    - Your goals for the account (optional)
    - Notes, past plans or call transcripts (optional)
  prerequisites:
    - A CRM your AI can read, or a file of your account and deal rows
    - A docs tool to hold the plan (optional, the plan shows in chat if missing)
  output:
    - name: Account snapshot
      contains: What the customer does, their size and where the relationship stands today.
    - name: Their goals and initiatives
      contains: What the customer says it wants, with the source named for each point.
    - name: Where we are
      contains: Open and closed deals, and what was won or lost and why.
    - name: Stakeholder coverage
      contains: Who you know at the account and who you are missing.
    - name: Opportunity map
      contains: Ideas for growing the account, each with the evidence behind it.
    - name: Risks
      contains: Rival vendors, renewal exposure and the risk of losing your champion.
    - name: Action plan
      contains: Dated actions with an owner for each, covering the plan length you chose.
    - name: CRM updates
      contains: A short account summary and next steps on open deals, shown before and after for you to approve.
