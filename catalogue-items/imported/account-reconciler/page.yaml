thinking: medium
thinking_why: It matches rows and explains what is left.
new_slug: account-reconciler
name: Account reconciler
summary: Give it a ledger and a bank statement. Get matched items, the gaps
  sorted by type and a next step each.
job: track-numbers
headline: Account reconciler
subhead: Give it a ledger or trial balance extract, the bank statement or other
  record to compare, and the period you are closing. It matches the items that
  agree and sorts each gap into timing, adjustment or needs a look. You get the
  matched list, the differences by type, an aging view and a next action for
  each. Have an accountant check it.
explain: |
  Differences between your books and a bank statement, subledger or partner records are matched, sorted and explained. Have an accountant check the result before you rely on it.

  The skill compares your ledger balance to the other source and lists the items that do not agree. It sorts each one into three groups: timing differences that will clear on their own, adjustments you need to book, and items that need investigation. It ages the open items, so old ones stand out, and shows trends over time. It handles bank reconciliations, ledger to subledger, and intercompany. You get a note for each gap that says what it is and what to do next.
when:
  - It is month end and the bank balance does not match your books.
  - Two group companies disagree on what they owe each other.
  - You need to explain old open items to your accountant.
  - You want a clear list of what needs booking and what needs a closer look.
you_give:
  - A ledger or trial balance extract
  - A bank statement or the other record to compare
  - The period you are closing
  - Your escalation thresholds (optional)
you_get:
  - Matched items
  - A list of unmatched differences
  - Each difference sorted by type
  - An aging view of open items
  - A note on the next action for each gap
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read the files you upload.
