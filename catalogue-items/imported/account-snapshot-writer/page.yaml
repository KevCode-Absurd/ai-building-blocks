thinking: medium
thinking_why: It pulls the right facts and says plainly when data is thin.
new_slug: account-snapshot-writer
name: Account snapshot writer
summary: "Get an account research briefing on any company from your Common Room data: key contacts, signals and next steps. Needs a connected Common Room."
job: sell-and-negotiate
headline: Account snapshot writer
subhead: Name a company or domain and connect your Common Room account. It finds the company, pulls the activity, contacts and intent signals that matter for your question, and adds a web search when the data is thin. You get a short account overview, key contacts, a note when data is limited and suggested angles for your approach.
explain: |
  A short briefing on a company, drawn from the signals in your Common Room data, tells you what the account has been doing so you know how to approach it.

  The skill first loads your own context. It finds the company in Common Room and pulls only the fields that matter for that question, such as activity, contacts and intent signals. If the data is sparse, it adds a web search and notes that the briefing is based on limited data. It then reasons across the signals and produces a clean overview with the facts first. It needs a Common Room account connected.

  This is the Common Room account research skill, shared in Anthropic's knowledge-work-plugins collection under the Apache 2.0 licence. We changed its name and the page text only. What it adds to Common Room's own account page: one short briefing that puts the signals, key contacts and next steps in one place, a plain note when the data is thin, and a web search for recent news.
when:
  - You are about to call a company and want a quick background.
  - You hear a company name and want to know if they already use you.
  - You want to see what an account has done in your community.
  - You need a briefing for a teammate taking over an account.
not_for:
  - "You need to review many accounts at once: export a list from Common Room or your CRM instead."
  - "The company has no Common Room record and you have no web access: use a plain web search or your CRM instead."
  - "You only need one fact, like the owner or staff count: look it up in Common Room or your CRM directly."
you_give:
  - A company name or domain
  - A connected Common Room account
  - The question you care about (optional)
you_get:
  - A short account overview
  - Recent activity and signals
  - Key contacts found
  - A note when data is limited
  - Suggested angles for your approach
how_to_use:
  - Check that you have a paid Common Room account and that it is connected to your AI. The skill cannot run without it.
  - Open Claude, ChatGPT or Gemini with the Common Room connection turned on, and paste in the skill instructions.
  - Paste your ideal customer profile and what you offer. This copy has no company notes file, so without them the fit view is general.
  - Type a company name or domain. Add your question if you have one, such as whether they show buying signals.
  - Read the result. Check that each fact came from Common Room, and note any line that says data is limited.
  - If the data is thin, the skill adds a web search for recent news. Allow web access in your AI if you want this. Without web access it still runs, but a thin account gets only what Common Room holds and a note that data is limited.
  - Use the next steps to plan your call or to hand the account to a teammate.
output_sample:
  input:
    - A company name or domain
    - A connected Common Room account
    - The question you care about (optional)
  prerequisites:
    - A paid Common Room account
    - Common Room connected to your AI through its MCP connection
    - An AI that can use connected tools
  output:
    - name: Snapshot
      contains: Two or three sentences on what the company does, its stage and your relationship with it.
    - name: Key Details
      contains: Employee count, industry, location, domain and funding, when Common Room returns them.
    - name: CRM & Ownership
      contains: The account owner, opportunity stage and ARR, only if your CRM fields come back.
    - name: Scores
      contains: Every available score as a raw value or percentile, never a label.
    - name: Signal Highlights
      contains: The three to five most important signals, each with a date.
    - name: Top Contacts
      contains: The top five contacts with name, title and score, highest score first.
    - name: RoomieAI Research
      contains: The summary research from Common Room's own AI research tool (RoomieAI), and the names of other research topics available.
    - name: Recommended Next Steps
      contains: Two or three specific actions backed by the signals found.
