thinking: medium
thinking_why: It scores many accounts against a set of rules.
new_slug: account-tier-ranker
name: Account tier ranker
summary: Give it your accounts. Get a fit score, an activity score and a tier
  for each, with reasons.
job: sell-and-negotiate
headline: Account tier ranker
subhead: Give it a list of accounts or your whole book, your ideal customer
  profile and a connected CRM. It scores each account for fit from 0 to 10 using
  size, industry and tools, then scores recent activity. You get both scores, a
  tier for each account, the reason behind each score and a suggested move per
  tier.
explain: |
  A long list of accounts becomes a short list of where your time pays off most. Each account is scored for fit and for activity, with a plain reason.

  The skill reads your ideal customer profile from your setup, then pulls the account set you named or your whole book. It scores fit from 0 to 10, using traits such as size, industry and tools. It then scores engagement from 0 to 10 from recent contact, visits and product use. The two scores combine into a tier, and each tier gets a recommended move: pursue, nurture or leave alone. It needs your CRM connected.
when:
  - You have more accounts than hours and need to pick where to focus.
  - A new quarter starts and you want to reset priorities.
  - You want to find strong-fit accounts that have gone quiet.
  - Your team argues about which accounts matter most.
you_give:
  - A list of accounts, or your full book
  - Your ideal customer profile
  - A connected CRM
  - Which signals count as engagement (optional)
you_get:
  - A fit score and an activity score for each account
  - A tier for each account
  - A reason behind each score
  - A suggested move per tier
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your CRM, email and calendar.
