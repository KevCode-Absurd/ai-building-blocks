thinking: medium
thinking_why: It scores many accounts against a set of rules.
new_slug: account-tier-ranker
name: Account tier ranker
summary: Tier your accounts by fit and activity so you know where to spend time. Get scores, a tier and a next move for each account.
job: sell-and-negotiate
headline: Account tier ranker
subhead: Give it a list of accounts or your whole book, your ideal customer profile and a connected CRM or a spreadsheet. It scores each account for fit from 0 to 10 using size, industry and tools, then scores recent activity. You get both scores, a tier for each account, the reason behind each score and a suggested move per tier.
explain: |
  A long list of accounts becomes a short list of where your time pays off most. Each account is scored for fit and for activity, with a plain reason.

  The skill reads your ideal customer profile from your setup, then pulls the account set you named or your whole book. It scores fit from 0 to 10, using traits such as size, industry and tools. It then scores engagement from 0 to 10 from open deals, how recent the last contact was, inbound email and how many contacts are involved. The two scores combine into four groups, and each gets a recommended move. Tier A (high fit, high activity): push the open deal. Tier B (high fit, low activity): start outreach. Tier C (low fit, high activity): hold one call to confirm fit. Deprioritized (low fit, low activity): leave alone and review each quarter. A connected CRM is best, and a spreadsheet of your accounts works too.
when:
  - You have more accounts than hours and need to pick where to focus.
  - A new quarter starts and you want to reset priorities.
  - You want to find strong-fit accounts that have gone quiet.
  - Your team argues about which accounts matter most.
not_for:
  - "You have fewer than about 20 accounts: review them by hand, since a score adds little."
  - "You have no CRM, book file or ideal customer profile: write down who your best customer is first, then come back."
  - "You want to fix messy CRM fields: update the records yourself or in your CRM, as this only flags what could not be scored."
you_give:
  - A list of accounts, or your full book
  - Your ideal customer profile
  - A connected CRM or a spreadsheet of your accounts
  - Which signals count as engagement (optional)
you_get:
  - A fit score and an activity score for each account
  - A tier for each account
  - A reason behind each score
  - A suggested move per tier
how_to_use:
  - "Write your ideal customer profile first if you have none: the industries, the size range, the job titles you sell to, and the red flags that rule an account out. The default weights apply unless you change them. Fit: industry 3, size 3, right job titles 2, no red flags 2. Engagement: open deal 3, last contact 3, inbound email 2, several contacts 2. A score of 6 or more counts as high."
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on this page.
  - It works best when your AI can read your CRM, email and calendar.
output_sample:
  input:
    - "Your accounts: all you own, a named list or a saved CRM view"
    - "Your ideal customer profile: industries, size, job titles and red flags"
    - A connected CRM, or a spreadsheet of your accounts
    - Your email (optional)
  prerequisites:
    - A CRM connected to your AI, or an uploaded spreadsheet of your accounts
    - Your ideal customer profile, or an answer to one question your AI asks
  output:
    - name: Tier A table
      contains: "High fit and high activity accounts with scores, open deal, last touch and next action: progress the deal and add contacts."
    - name: Tier B table
      contains: "High fit, low activity accounts with scores and next action: start outreach and look for a reason to reach out."
    - name: Tier C table
      contains: "Low fit, high activity accounts with scores and next action: hold one discovery call to confirm fit or drop them."
    - name: Deprioritized accounts
      contains: Low fit, low activity accounts listed by name only, with no active move. Revisit them each quarter.
    - name: Coverage gaps
      contains: Tier A or B accounts with no activity in 30 days or more, and accounts missing fields so they could not be scored.
