thinking: low
thinking_why: It applies accrual rules to listed items.
new_slug: accrual-schedule-drafter
name: Accrual schedule drafter
summary: "Draft your month-end accrual schedule: each amount worked out, its support cited, and a draft journal entry for your controller to approve."
job: money-and-investing
headline: Accrual schedule drafter
subhead: Give it your accrual policy list, the period's expenses and open orders, and the contracts or estimates behind them. It works through each accrual, calculates the amount for the period and cites the source. You get a schedule with amounts, the support for each entry, draft journal entries and period totals. A controller approves before posting.
explain: |
  Month-end accruals land in one schedule where every entry is calculated, backed by its source, and turned into a draft journal entry. It is a draft only. A controller approves it before anything is posted.

  The skill goes through your accrual policy list one item at a time. For each one it works out the amount for the period, such as unbilled services, bonuses or utilities, and cites the invoice, contract or estimate it used. It then writes the matching debit and credit lines. At the end you get one schedule with totals, so you can review all entries together. It does not post anything to your system. You still decide what goes in.
when:
  - It is month end and you must book expenses that have not been invoiced.
  - You need the support for each accrual in one place for your auditor.
  - A new team member needs a consistent way to build the schedule.
  - You want draft entries ready for your controller to review.
not_for:
  - "You already have the invoice: book it through accounts payable, not as an accrual."
  - "You need tax or payroll accruals: use this only if your accrual policy list covers them, or ask your accountant."
  - "You want entries posted to your books: this only drafts them, so a controller must review and post by hand."
you_give:
  - Your accrual policy list
  - The period's expenses and open orders
  - Contracts or estimates for the support
  - Last month's schedule (optional)
you_get:
  - An accrual schedule with amounts
  - The source cited for each entry
  - Draft journal entries
  - Period totals for review
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat.
  - Ask your AI to follow this skill. Paste or upload the accrual policy list, the period dates, the amounts already booked (from your trial balance or ledger export) and the invoices or contracts behind each amount.
  - Next, once your controller approves, post the entries in your ledger by hand and file the schedule with the close checklist or your auditor's support.
output_sample:
  input:
    - Your accrual policy list
    - The period's expenses and open orders
    - Contracts or estimates that back each amount
    - Last month's schedule (optional)
  prerequisites:
    - The entity name and the period you are closing
    - Amounts typed or pasted into the chat if your AI cannot read invoice files
  output:
    - name: Accrual schedule
      contains: One row per accrual with its basis, period portion, amount already booked, this-period amount and support reference.
    - name: Draft journal entries
      contains: A debit to the expense account and a credit to the accrued liability for each row with an amount.
    - name: Reversal notes
      contains: A memo line on entries that reverse on day 1 of next period, where your policy says so.
