job: money-and-investing
headline: Acquisition due diligence planner
subhead: Describe the deal, the parties, your reason for it and your timeline.
  It starts by testing why this deal makes sense, then lists what a buyer
  reviews and the valuation methods to cross-check the price. You get a due
  diligence checklist, valuation checks, a red flag list, an integration plan
  and a pre-signing verification list.
explain: |
  Before you sign a deal to buy or sell a company, this skill hands you a due diligence list, valuation checks and an integration plan, so you ask the right questions.

  It starts with one question: why this deal? The strategic reason has to be clear before anything else. Then comes a checklist covering the areas a buyer reviews, and valuation methods to cross-check the price. For integration, it offers frameworks for the first days after close. If you are the one being bought, it covers readiness signs, six to twelve months of preparation, and negotiation points. It lists red flags for both sides and ends with a check to run before any letter of intent or signature.
when:
  - You are weighing the purchase of a smaller company.
  - You want to sell your business and need to prepare.
  - You need a list of what to ask in due diligence.
  - You want a plan for the first 100 days after a deal.
you_give:
  - A description of the deal and parties
  - Your reason for the deal
  - Financial figures you have (optional)
  - Your timeline
you_get:
  - A due diligence checklist
  - Valuation checks
  - An integration plan
  - A list of red flags
  - A pre-signing verification list
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
