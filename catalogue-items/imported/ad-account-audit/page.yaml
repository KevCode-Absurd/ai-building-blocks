thinking: high
thinking_why: It weighs evidence across many platforms and flags what data is missing.
new_slug: ad-account-audit
name: Twelve-platform ad account auditor
summary: Run a multi-platform ad account audit. Give it your ad exports and goal. You get a scored report by platform, with evidence and ranked fixes.
job: read-ad-results
headline: Twelve-platform ad account auditor
subhead: Give it your ad account exports, your goal, your monthly budget and your tracking setup. It audits each platform (Google, Meta, YouTube, LinkedIn, TikTok and others) and cites a source for every finding. You get a scored audit by platform, the evidence, a ranked list of fixes, a budget and measurement plan and test ideas for next month.
explain: |
  A fact-based audit of your paid advertising comes with the proof for each finding and clear next steps. It covers Google, Meta, YouTube, LinkedIn, TikTok and other platforms.

  The skill works in a set order. It first collects context: your goal, budget and exports. Then it routes the job, whether that is an audit, strategy, measurement plan or report. Every finding must cite its source, and it will not claim what the data cannot show. In this copy the helper workers and the scoring engine are not included. Your AI does one pass over your exports and gives a rough score for each platform, shown with how much of the evidence it could see, plus a ranked list of actions. It will not change a live campaign unless you clearly approve the specific change first. Your keys and secrets stay out of the output.
when:
  - You spend on several ad platforms and do not know what is working.
  - A new agency took over and you want an independent check.
  - You want a plan for budget and measurement for next quarter.
  - You need a report that shows its evidence.
not_for:
  - "You want a quick look at one platform: use that platform's own reporting tool in Google Ads, Meta Ads Manager or TikTok Ads Manager."
  - "You need new ad images, video or copy: ask your AI for creative help instead, since this audit does not make ads."
  - "You have no exports and no goal yet: get an export from each ad platform and write down your goal first, because this audit stops and asks rather than guessing."
  - "You want live campaigns changed for you: this audit only drafts changes, and a person must approve and apply each one."
you_give:
  - Ad account exports or reports
  - Your goal, such as sales or leads
  - Your monthly budget
  - Your tracking setup (optional)
  - Landing page links (optional)
you_get:
  - A scored audit by platform
  - Evidence for each finding
  - A ranked list of fixes
  - A budget and measurement plan
  - Test ideas for the next month
how_to_use:
  - Know this first. The helper workers, sub-skills, run folders and slash commands are not included in this copy. Plain chat is the default way to use it, with one pass over your exports.
  - Open Claude, ChatGPT or Gemini and paste in the skill text, or upload the skill folder if your AI accepts files.
  - Upload your ad exports. Add your goal, monthly budget and the platforms you run. Add your tracking setup and landing page links if you have them.
  - A plain chat run gives a single-pass audit with no run manifest, no worker fan-out and no live-account data. Do not mistake it for the full toolkit's output. The landing page and competitor steps look at live pages, so approve each source first, or paste the page text.
  - Live account reading is optional. It needs your own read-only tokens and an AI that can run code. Skip it if you only have exports.
  - Ask your AI to audit your ad account. Answer any question it asks about your goal or data. The report has six parts, in this order. They are a scored summary, findings with sources, ranked fixes, a budget and measurement plan, missing data, and test ideas.
  - Check the findings and their sources first. Then work through the ranked fixes.
  - Treat every account change as a draft. Approve and apply each one yourself.
output_sample:
  input:
    - Your ad account exports or reports from each platform
    - Your goal, such as sales or leads
    - Your monthly budget
    - Your tracking setup (optional)
    - Your landing page links (optional)
  prerequisites:
    - An AI that can read files, so it can open your exports
    - Your own read-only access tokens, only if you want it to read live ad accounts (optional)
  output:
    - name: Run header
      contains: "A short record of this run: your goal, platforms, budget, data window and which files were used."
    - name: Platform scores
      contains: A health score for each platform, shown with how much of the evidence was available.
    - name: Findings with evidence
      contains: Each finding cites its source in your data, and notes what the data cannot show.
    - name: Ranked fixes
      contains: The actions to take, in order, with an owner, a measurement window and a rollback note.
    - name: Budget and measurement plan
      contains: How to split spend across platforms and what to track so results can be trusted.
    - name: Missing data and partial results
      contains: Any platform or input that failed or was missing, so the audit is never called complete by mistake.
    - name: Test ideas
      contains: Experiments to run next month, based on what the audit found.
