thinking: high
thinking_why: It weighs evidence across many platforms and flags what data is missing.
new_slug: ad-account-audit
name: Twelve-platform ad account auditor
summary: Give it your ad exports and goal. Get a scored audit across Google,
  Meta, TikTok and more, with fixes.
job: read-ad-results
headline: Twelve-platform ad account auditor
subhead: Give it your ad account exports, your goal, your monthly budget and
  your tracking setup. It audits each platform (Google, Meta, YouTube, LinkedIn,
  TikTok and others) and cites a source for every finding. You get a scored
  audit by platform, the evidence, a ranked list of fixes, a budget and
  measurement plan and test ideas for next month.
explain: |
  A fact-based audit of your paid advertising comes with the proof for each finding and clear next steps. It covers Google, Meta, YouTube, LinkedIn, TikTok and other platforms.

  The skill works in a set order. It first collects context: your goal, budget and exports. Then it routes the job, whether that is an audit, strategy, measurement plan or report. Every finding must cite its source, and it will not claim what the data cannot show. Helper workers can check different platforms side by side. The result carries a score and a ranked list of actions. It will not change a live campaign unless you clearly approve the specific change first. Your keys and secrets stay out of the output.
when:
  - You spend on several ad platforms and do not know what is working.
  - A new agency took over and you want an independent check.
  - You want a plan for budget and measurement for next quarter.
  - You need a report that shows its evidence.
you_give:
  - Ad account exports or reports
  - Your goal, such as sales or leads
  - Your monthly budget
  - Your tracking setup (optional)
  - Landing page links (optional)
you_get:
  - A scored audit by platform
  - Evidence for each finding
  - A ranked list of fixes
  - A budget and measurement plan
  - Test ideas for the next month
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your ad exports and files, and
    optionally read your ad accounts with your own read-only tokens. Account
    changes stay as drafts for your approval.
