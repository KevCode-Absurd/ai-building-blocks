thinking: low
thinking_why: It spins a set list of angles from one idea.
new_slug: ad-angle-multiplier
name: Ad angle multiplier
summary: Give it one winning ad idea. Get 10 to 15 different angles with hooks
  and a test order.
job: plan-ad-tests
headline: Ad angle multiplier
subhead: "Give it your best ad or core idea, the product, the offer and the
  audience. It works from six directions: pain, desire, proof, identity,
  contrarian and urgency. You get 10 to 15 clearly different angles, a hook for
  each, the type of angle it is and a suggested order to test them."
explain: |
  One ad idea that already works turns into 10 to 15 clearly different angles, each with a hook, so you can test them side by side instead of running small edits of the same ad.

  The skill works from six directions. Pain starts with the problem. Desire starts with the result. Proof leans on evidence. Identity speaks to who the buyer is. Contrarian goes against common belief. Urgency adds a reason to act now. Each angle has to feel new, so minor rewrites are rejected. That helps you find out which message moves people, rather than which wording does. It works with any product and needs only your winning idea and some context on the audience.
when:
  - One ad is working and you need more like it to scale.
  - Your ads are tiring out and you need fresh messages.
  - You plan a creative test and need distinct angles.
  - You are stuck writing variations of the same line.
you_give:
  - Your best ad or core idea
  - The product and offer
  - Your audience
  - Proof points you can use (optional)
you_get:
  - 10 to 15 distinct angles
  - A hook for each angle
  - The type of angle each one is
  - A suggested order to test
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
