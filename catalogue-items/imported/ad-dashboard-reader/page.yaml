thinking: high
thinking_why: It weighs biased numbers against each other before advising.
new_slug: ad-dashboard-reader
name: Ad dashboard reader
summary: Read your ad dashboard numbers with confidence. Paste your platform and sales figures to get a plain reading and a scale, hold or cut call.
job: read-ad-results
headline: Ad dashboard reader
subhead: Paste your dashboard numbers from each ad platform, your own sales data and the date range and attribution settings. It explains how each platform inflates its own credit and reconciles them against your sales. You get a plain reading of each metric, a noise check on changes, a scale, hold or cut call and a suggested incrementality test.
explain: |
  Ad numbers stop being a puzzle once each metric is explained. See where platforms disagree with each other, and whether to scale a campaign or cut it.

  The skill reads your pasted dashboard figures with care. It explains how each platform's attribution model inflates its own credit, and how to reconcile Meta, Google and your own sales data. It warns about the ROAS trap, where a short window hides the value of a customer over time. It checks whether a change is real or just noise. It also explains incrementality tests, such as holding out a region, so you can tell what ads caused versus what would have happened anyway. If data is missing, it says what it needs.
when:
  - Meta and Google both claim credit for the same sale.
  - ROAS looks great but your bank balance does not.
  - You cannot tell if last week's dip is real or random.
  - You want to know whether to raise or cut spend.
not_for:
  - "You need a plan for which channels to buy: use a paid media strategy step or talk to a media buyer first."
  - "You want to write or test new ad creative: use a creative testing step, not a dashboard reading."
  - "You have no sales or order data at all: pull a simple sales export from your shop or bank first, or the totals cannot be checked."
you_give:
  - Dashboard numbers from each ad platform
  - "Your own sales or order data: order dates, order totals, currency, and customer IDs if you want lifetime value"
  - The date range and attribution settings
  - Your margin or customer value (optional)
you_get:
  - A plain reading of each metric
  - A reconciliation across platforms
  - A noise check on changes
  - A scale, hold or cut call
  - A suggested incrementality test
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tool is needed.
  - Paste your dashboard numbers from each ad platform, one platform at a time.
  - Add your own sales figures, the date range and each platform's attribution window.
  - Ask your AI to read each metric, then reconcile the totals to your sales.
  - Ask for the noise check, then the scale, hold or cut call and one test to run next.
  - Check the result against your own bank figures before you change any budget.
output_sample:
  input:
    - Dashboard numbers from each ad platform you run
    - Your own sales or order data for the same dates
    - The date range and attribution settings on each platform
    - Your margin or customer value (optional)
  output:
    - name: Metric readings
      contains: One plain line per metric saying what it counts, what it leaves out, and how far to trust it.
    - name: Reconciliation table
      contains: Each platform's claimed sales set against your own sales, showing where credit is counted twice.
    - name: Noise verdict
      contains: A call on whether a recent change is real or likely random, based on the size of the data.
    - name: Scale, hold or cut call
      contains: One clear decision on spend, with the reasons and any numbers still missing.
    - name: Incrementality test
      contains: One proposed test, such as holding out a region, to show what the ads really caused.
