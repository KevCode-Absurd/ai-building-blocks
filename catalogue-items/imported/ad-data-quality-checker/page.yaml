new_slug: ad-data-quality-checker
name: Ad data quality checker
summary: Give it your ad and sales tables. Get nine checks that catch missing
  spend, duplicates and empty columns.
job: track-numbers
headline: Ad data quality checker
subhead: Give it your ad and sales tables, the date window, the time zone and
  the systems you are comparing. It runs nine checks, including that spend adds
  up across buckets, leads are not double counted and columns are filled. You
  get the result of each check, the rows that failed, a column fill report and a
  repeatable record.
explain: |
  Nine checks run on your ad and sales tables and catch missing spend, duplicates, double-counted leads and empty columns before they distort a report.

  The skill makes you state your evidence first: the reporting window, time zone and which systems you are comparing. It then runs the checks on typed inputs, including every excluded row, so nothing disappears quietly. It checks that spend adds up across all buckets, that funnel counts add up with unknowns kept, that rates use the right population, and that each lead has one primary record. It compares sources that claim to measure the same thing. The result is complete and repeatable, with the scope of each check labelled.
when:
  - Your ad spend total does not match the platform's invoice.
  - You suspect leads are counted twice in your report.
  - A column in your data looks empty and you want proof.
  - You need a repeatable check before sending a report to a client.
you_give:
  - Ad and sales tables, with the date window
  - The systems you want to compare
  - The time zone for the report
  - A list of expected columns (optional)
you_get:
  - Results for nine quality checks
  - Rows or groups that failed
  - A column fill report
  - The scope of each check
  - A repeatable record of the findings
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run Node code and SQL on your own BigQuery
    data.
