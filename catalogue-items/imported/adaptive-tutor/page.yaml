thinking: medium
thinking_why: It adapts each lesson to your answers.
new_slug: adaptive-tutor
name: Adaptive tutor
summary: Learn a topic at your level. Give it your goal and time. It checks what you know, then teaches in short steps with practice and feedback.
job: think-and-decide
headline: Adaptive tutor
subhead: Name a topic, your goal and how much time you have. It asks a few questions to find your level, then teaches in short steps, each followed by a question you answer from memory. You get the level check, lessons in steps, practice with feedback, a study guide if you want one and a plan for what to review next.
explain: |
  You get a lesson that fits your level on a topic you choose. It begins with a short check of what you already know, then teaches in small steps with practice and feedback.

  The diagnostic asks a few questions, so the lesson skips what you know and fills real gaps. Each step is a short explanation, then a question to answer from memory, since recall helps learning stick. If you answer well, it moves faster. If you struggle, it explains another way and slows down. It can also give you a study guide, a lesson plan or a set of drills.

  Licence: CC BY 4.0 applies to this copy, as the LICENSE-CONTENT file in this folder says. That file governs. The author's own file header (DAIR.AI) says MIT, which is the author's label for the original. Credit goes to DAIR.AI and sickn33.
when:
  - You want to learn a new topic and do not know where to start.
  - You have an exam coming and need practice questions.
  - You studied something once and want a refresher.
  - You teach and want a lesson plan that adapts to the group.
not_for:
  - "You only need a quick fact or a one-line answer: ask your AI the question directly."
  - "You need a certified course or a credential: sign up for an official course from the provider instead."
  - "You want a real teacher to mark long essays or projects: ask a tutor or teacher for that."
you_give:
  - A topic to learn
  - What you already know (optional)
  - Your goal or deadline
  - How much time you have
you_get:
  - A quick level check
  - Short lessons in steps
  - Practice questions with feedback
  - A study guide (optional)
  - A plan for what to review next
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code or paid tool is needed.
  - Paste the skill text, then tell your AI the topic you want to learn.
  - Add your goal, your deadline and how much time you have. Say what you already know if you can.
  - Answer the level-check questions. Then work through the first lesson.
  - Try each practice question before you read the answer. Ask for a study guide if you want one.
  - Ask for the next lesson, or for a review plan, when you finish.
output_sample:
  input:
    - The topic you want to learn
    - Your goal or deadline
    - How much time you have
    - What you already know (optional)
  output:
    - name: Level check
      contains: One to three short questions that show what you already know and what you want from the lesson.
    - name: Lesson
      contains: One small step per reply, made of a short goal, a concrete example, the idea behind it and a guided practice step. It ends with one question for you to answer.
    - name: Knowledge check
      contains: A question or task you answer yourself, with feedback on why answers are right or wrong.
    - name: Study plan
      contains: For longer goals, a short path with daily focus, practice and review points. Only if you ask.
    - name: Next step
      contains: What to practice or review next, based on how you answered.
