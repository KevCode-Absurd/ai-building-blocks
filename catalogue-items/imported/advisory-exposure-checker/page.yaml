thinking: medium
thinking_why: It runs set read-only checks and writes up the result.
new_slug: advisory-exposure-checker
name: Advisory exposure checker
summary: Check if a breach or package advisory affects your computer and projects. Get a read-only check and a saved report with a clear verdict.
job: secure-code
headline: Advisory exposure checker
subhead: Name the advisory, package or vulnerability and the folders to check. It picks the relevant checks, searches your Node and Python projects for affected versions and looks at installed tools, changing nothing on your machine. You get the list of checks run, what was found, a clear verdict, a saved report and follow-up steps for you.
explain: |
  Find out if a security advisory touches your computer and projects with a read-only check, saved as a report. Nothing on your machine is changed.

  The skill follows hard rules: look, do not fix. Pick the advisory or breached package and it chooses the relevant checks from a menu. For software supply chain advisories it searches your Node and Python projects for affected versions. It also looks at installed tools, running programs and open network ports, startup items, settings that raise risk, and editor or browser extensions. The report lists the advisories in scope, what was found, a verdict in set wording, actions taken and follow-ups. It tells you when breaking the read-only rule would be needed, and asks first.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The author's own file header (davidondrej) says MIT. Credit goes to davidondrej and sickn33.
when:
  - A package you use was in the news for a breach.
  - You want to know if you are exposed to a new vulnerability.
  - Your team asks for proof that you checked.
  - You want a record of what you looked at.
not_for:
  - "You want the problem fixed for you: this only looks and lists steps, so run the fix yourself or ask a developer."
  - "Your AI cannot run commands on your computer: ask a security person to check, or do the checks by hand."
  - "You need a full security review of a company network: hire a security professional."
you_give:
  - The name of the advisory, package or vulnerability
  - The folders or projects to check
  - Permission to read your machine
  - Package manager or system details (optional)
you_get:
  - A list of checks run
  - What was found on your machine
  - A clear verdict
  - A saved report
  - Follow-up steps for you
how_to_use:
  - Open an AI that can run read-only commands and save one file, such as Claude Code or Codex. The ready-made checks are written for a Mac. Linux needs small changes. On Windows the skill marks each check it cannot run.
  - Paste the skill, then name the advisory, CVE or package you want checked.
  - Say which folders to search. The file searches stay in those folders. A few other checks read fixed places such as startup items, shell settings and extensions.
  - On Windows the skill has no ready checks. It marks each one "not checked". On Linux, your AI must swap in the matching paths and tools.
  - Let it run the checks. It reads your files and settings but changes nothing.
  - Read the verdict. The only file it writes is the report, in the security-audits folder in your Documents.
  - If the verdict is Affected, run the fix steps listed under Follow-ups yourself.
output_sample:
  input:
    - The advisory, CVE or package name
    - The folders or projects to check (optional)
    - "Your computer type: Mac, Linux or Windows (optional)"
  prerequisites:
    - An AI that can run read-only commands on your computer
    - Permission for it to read your home folder and shell settings
  output:
    - name: Advisories in scope
      contains: The advisory, what it affects, and which versions are at risk.
    - name: Audit results
      contains: A table with each check run and what it found, such as a version or none.
    - name: Verdict
      contains: One of Not affected, Affected or Partially affected, with short reasons.
    - name: Action taken
      contains: A note that nothing was changed, installed or removed.
    - name: Follow-ups
      contains: Steps for you to run yourself, or none if nothing is needed.
