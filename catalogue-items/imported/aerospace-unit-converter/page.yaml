thinking: medium
thinking_why: It maps each conversion to the right function and checks the result.
new_slug: aerospace-unit-converter
name: Aerospace unit and frame converter
summary: Convert aerospace units, time systems and coordinate frames with MATLAB code you can rerun. Give it your values and the target frame or unit.
job: build-software
headline: Aerospace unit and frame converter
subhead: Give it your values with their current units or frame, the target units or frame, and the dates where the frame depends on time. It converts units, time systems such as UTC, positions between Earth frames, orbit elements and rotation forms. You get the converted values, MATLAB code to rerun, the assumptions used and a check of the result.
explain: |
  Values move correctly between units, time systems and coordinate frames, with MATLAB code you can run again. That avoids the slip-ups that come from mixing frames in flight or space work.

  The skill covers unit changes, time systems such as UTC and sidereal time, and positions in latitude, longitude and altitude, Earth-fixed and Earth-inertial frames. It also converts orbit elements to position and velocity, and moves between Euler angles, rotation matrices and quaternions. Time-dependent conversions use the right date. It shows the standard patterns and picks the right function for each case. It stays inside basic aerospace maths, so check the toolbox notes for harder dynamics. This is for aerospace and flight-data engineers who already work in MATLAB. MATLAB and the Aerospace Toolbox are paid products from MathWorks, and you must already hold a licence for both.

  Licence: the LICENSE.md file in this folder governs (BSD 2-Clause plus a MathWorks term that limits use to MathWorks products). The skill file header links MathWorks' own licence page, which says the same kind of thing.
when:
  - You have data in feet and knots and need metres and metres per second.
  - You need to turn GPS positions into Earth-fixed coordinates.
  - You must convert orbit elements to position and velocity.
  - Your attitude data is in Euler angles and you need quaternions.
not_for:
  - "You do not use MATLAB or have no licence for it and the Aerospace Toolbox: this is a paid-software skill, so use a free unit converter for plain unit changes."
  - "You need air density or pressure at altitude: use the MATLAB aerospace environment skill, which covers atmosphere models."
  - "You need to predict an orbit or plan a satellite move: use the Aerospace Toolbox, Aerospace Blockset or Satellite Communications Toolbox."
  - "You need local east, north, up positions from GPS points: use the Navigation Toolbox, which has those functions."
you_give:
  - Your values and their current units or frame
  - The units or frame you want
  - Dates and times, if the frame changes with time (optional)
you_get:
  - Converted values
  - MATLAB code you can rerun
  - The frame and time assumptions used
  - A check of the result
how_to_use:
  - Open a chat with an AI that can run MATLAB code, or plan to run the code yourself. You need MATLAB with the Aerospace Toolbox. Check your MATLAB release first, because some functions only exist from certain releases. The skill lists the release for most functions.
  - Paste the skill text into the chat, about 1,400 words. If your question is about frames or rotations, also paste the matching reference file from the references folder (coordinate-systems.md or rotation-conventions.md). For unit questions, paste unit-conversion-guide.md.
  - Add your values, their current units or frame, and the target. Add dates if the frame depends on time.
  - Ask your AI to name the frame and time system it assumes before it converts.
  - Run the MATLAB code and check the round-trip result matches your starting values.
  - Compare a few converted values with a source table before you use them in a simulation.
  - Next, feed the converted values into your simulation or analysis. For air density or pressure inputs, pair it with the MATLAB aerospace environment skill.
output_sample:
  input:
    - Your values, with their current units or frame
    - The units or frame you want
    - Dates and times, if the frame changes with time (optional)
    - Your MATLAB release, so the right functions are used (optional)
  prerequisites:
    - MATLAB with the Aerospace Toolbox
    - An AI that can run MATLAB code, or you run the code yourself
  output:
    - name: Converted values
      contains: Each value in the unit, time system or frame you asked for.
    - name: MATLAB code
      contains: A script using Aerospace Toolbox functions that you can rerun on your own data.
    - name: Assumptions used
      contains: The frames, time system, date and rotation order the conversion relied on.
    - name: Check of the result
      contains: A round-trip test that converts back and compares with your starting values. It passes when the error is under 1e-10.
