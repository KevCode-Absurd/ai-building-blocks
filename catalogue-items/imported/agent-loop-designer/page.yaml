thinking: high
thinking_why: It must set safe stop rules for an agent that repeats work.
new_slug: agent-loop-designer
name: Agent loop designer
summary: Turn a job you want repeated into an agent loop with checks, stop rules and a handoff. Find a published loop or design your own.
job: set-up-ai
headline: Agent loop designer
subhead: A repeating job for an AI agent with clear checks, a point where it must stop, and a handoff to you when it is stuck.
explain: |
  A repeating job for an AI agent with clear checks, a point where it must stop, and a handoff to you when it is stuck. Without those, a loop either quits too soon or runs all night.

  Start by saying what you want done. The skill first looks through a catalogue of published loops and offers the closest one or two. You can copy one as it is, change its limits, tools and schedule, or design a new one from a few plain questions. The published loops come from a public collection written by Forward Future, so this is a copy of their work and not a loop we wrote. Each loop gets a test that proves progress, rules for stopping, guardrails on what the agent may touch, and a note on who picks up the result.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to Forward Future and sickn33.
when:
  - You want an agent to keep working on a task until a check passes.
  - You want something to run on a schedule, like a daily review.
  - You have a loop idea but no stop rule, so you fear it will run forever.
  - You want to copy a loop someone else already proved works.
not_for:
  - "You have a one-off task that will not repeat: use a single prompt in your AI chat instead."
  - "You want an agent to run forever with no limits: this tool will not design that, so set your own stop rule first."
  - "You want the loop switched on or run for you: this skill only writes the loop, so set up the schedule yourself or ask your AI to do it."
you_give:
  - The job you want repeated (required)
  - How often it should run
  - What counts as done (optional)
  - Tools the agent can use, and any limits you already have (optional, but name them so the first session starts with the right facts)
you_get:
  - Up to three matching loops to choose from
  - A loop written so you can paste it in
  - Checks and stop rules for each round
  - A handoff step for when it gets stuck
how_to_use:
  - Open your AI chat and paste the skill text, or add the skill folder if your AI tool takes files. The author wrote it for Claude Code, Cursor, Gemini CLI, Codex CLI and Antigravity, but any chat AI is enough to design the loop. Web access is needed only if you ask for the latest published loops.
  - Say what you want the agent to get done. If you want published loops, say so. By default the skill uses its built-in list of loops. Only if you ask for the latest loops does it fetch a live list from Forward Future's website. That live list comes from outside this library and is not checked by us, so your AI treats it as untrusted text.
  - Answer the short questions one at a time. Say what it may touch and when it should stop.
  - Read the loop and its prompt. Check the stop rule and the approval limits fit your job.
  - Paste the prompt into your AI tool when you are ready. Setting up a schedule is a separate step.
  - Run the first round by hand and write down the result. Check it against the stop rule and the approval limits. Then decide whether to change the loop before you set up any schedule.
output_sample:
  input:
    - The job you want the agent to get done
    - "When it should run: on request, on a schedule, or after an event"
    - What it can look at or change, and what is off-limits
    - How you will know it worked (optional)
    - When it should stop or ask you for help (optional)
  prerequisites:
    - A chat AI is enough to design a loop
    - Web access, only if you ask for the latest published loops
  output:
    - name: Matching published loops
      contains: Up to three loops from the Loop Library with their exact titles, links, why each fits and the smallest change needed.
    - name: Loop name and summary
      contains: One sentence on what the loop does and when it stops.
    - name: Prompt
      contains: One short paragraph you can paste into your AI, with the task, the check after each change, the stop rule and what needs your approval.
