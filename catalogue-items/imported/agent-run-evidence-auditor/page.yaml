thinking: high
thinking_why: It weighs many records and must not trust the agent's own summary.
new_slug: agent-run-evidence-auditor
name: Agent run evidence auditor
summary: Check an AI agent run for proof. Give it the logs and goal. You get each success claim checked, with gaps and conflicts marked.
job: test-and-fix-code
headline: Agent run evidence auditor
subhead: A claim-by-claim check of whether an AI agent really did what it says it did. A confident "all done" is not proof, so each success claim is matched to records.
explain: |
  A claim-by-claim check of whether an AI agent really did what it says it did. A confident "all done" is not proof, so each success claim is matched to records.

  You give it the logs, traces, approvals and deploy records from one run. First it fixes the goal and what counts as success, without bending the rules to fit the evidence. Then it splits the big claim into small testable ones and logs each in a ledger with the proof used, any conflicting record and a verdict: proven, partly proven, contradicted or not proven. Missing evidence is marked as missing, not as failure. It only reads. It never reruns tools or changes anything.
when:
  - An agent says a job is finished and you want proof before you trust it.
  - A run stopped halfway and you need to know what really happened.
  - You must show a reviewer which steps were done by the agent and which by a person.
  - You suspect an agent skipped a check or retried more than it should.
not_for:
  - "You want to plan what to record before a future run: ask an engineer to add logging first, since this only reads records that already exist."
  - "You need the missing steps done, such as a rerun, an approval or a deploy: ask the person who owns that system, because this audit never changes anything."
  - "You have no logs, traces or records at all: collect them first, because without records every claim comes back not proven."
you_give:
  - Logs, traces or records from the run
  - The goal the agent was given
  - What counted as success
  - Approval or deploy records (optional)
you_get:
  - A claim ledger with a verdict for each claim
  - Links to the records behind each verdict
  - A list of gaps and missing evidence
  - Conflicts between what was claimed and what was logged
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code needs to run.
  - Paste or attach the logs, traces and records from one run. Add the goal and what counted as success.
  - Say which records are missing, if you know. Add approval or deploy records if you have them.
  - Read the claim ledger first. Check every claim marked contradicted or not proven.
  - Read the overall verdict and the blocking claim IDs. Collect the missing records, then run the audit again.
output_sample:
  input:
    - Logs, traces or records from one agent run
    - The goal the agent was given
    - What counted as success
    - Approval or deploy records (optional)
  prerequisites:
    - The run records saved as text or files your AI can read
  output:
    - name: Scope and evidence inventory
      contains: The run, the success rules, the records checked and any integrity problems found in them.
    - name: Claim ledger
      contains: One row per small claim with its proof, any conflicting record, coverage, a verdict and the gap.
    - name: Reconstructed timeline
      contains: "Only the key events: state changes, faults, retries, checkpoints, approvals and deploys."
    - name: Gaps and counterevidence
      contains: Which claims are affected and whether the missing proof can still be collected.
    - name: Overall verdict
      contains: One sentence on the run, plus the claim IDs that block a full pass.
