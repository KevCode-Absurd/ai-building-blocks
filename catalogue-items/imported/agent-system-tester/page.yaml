thinking: high
thinking_why: Designing fair measures needs careful reasoning.
new_slug: agent-system-tester
name: Agent system tester
summary: "Build an AI agent testing plan: a scoring rubric, test tasks and pass marks, so you can tell if a change made your agent better or worse."
job: test-and-fix-code
headline: Agent system tester
subhead: A way to measure how well your AI agent works, so you can tell if a change made it better or worse. Agents answer differently each run and can reach a goal by several paths, so one pass or fail test is not enough.
explain: |
  A way to measure how well your AI agent works, so you can tell if a change made it better or worse. Agents answer differently each run and can reach a goal by several paths, so one pass or fail test is not enough.

  The skill builds a rubric with several parts, such as accuracy, completeness, source quality and effort spent. It judges the final result and allows different routes to get there. An AI judge gives volume, and a person checks the tricky cases. It also suggests a realistic token budget to test with, and sets pass marks you can use as a gate before release.
when:
  - You changed a prompt and cannot tell whether the agent got better.
  - You want to catch regressions before you ship an update.
  - You are comparing two set-ups of the same agent.
  - You need a pass mark an agent must hit before release.
not_for:
  - "You only need to check one answer or a single-answer task: read it yourself or run a quick spot-check instead."
  - "You want to fix bugs in ordinary code: use a normal unit test or ask your AI to review the code directly."
  - "You want live monitoring with alerts and dashboards: use your own monitoring tool, since this gives you a plan, not a running service."
you_give:
  - A description of what your agent does, and the tools it can use
  - Example tasks and good answers (optional)
  - A current baseline run of your agent on a few tasks, if you have one
  - Any scoring guide you already use (optional)
  - The changes you want to compare
  - Your token or cost limits (optional)
you_get:
  - A scoring rubric with weighted parts
  - A set of test tasks
  - A judging plan using AI and human review
  - Pass marks to use as a release gate
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the full text of the skill file (SKILL.md) from the download.
  - If you have no baseline yet, run your current agent on the test tasks first. The scores of the changed agent need something to be compared with.
  - The rubric and test tasks work in a free chat tool. Automated judging needs code and an API key. Without them, paste your agent's results back into the chat by hand and ask your AI to score them.
  - Describe what your agent does. Add example tasks and good answers if you have them (optional).
  - Say which changes you want to compare, and your token or cost limits (optional).
  - Read the rubric and test tasks it gives you. Change any part that does not fit your agent.
  - Run your agent on the test tasks, before and after your change. Paste the results back so your AI can score them.
  - Check the tricky cases yourself, then compare the scores to the pass marks. If the score meets the release gate, keep the change. If it falls below, revert it. Log each score with the date so you can see the trend. The skill only writes the plan. Automating the tests needs code running and an AI judge, which you set up yourself. For a written report of the results, pair it with a review item such as the experiment result analyst.
output_sample:
  input:
    - A description of what your agent does
    - Example tasks and good answers (optional)
    - The changes you want to compare
    - Your token or cost limits (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini
    - Code running and an AI judge key only if you want to automate the tests (optional)
  output:
    - name: Scoring rubric
      contains: Quality parts such as accuracy, completeness, source quality and tool efficiency, each with level descriptions and a weight.
    - name: Test tasks
      contains: A set of tasks from simple to very complex, with expected answers where you gave them.
    - name: Judging plan
      contains: How an AI judge scores the results and which tricky cases a person should check.
    - name: Token budget
      contains: A realistic token limit to test with, since token use drives much of an agent's results.
    - name: Pass marks
      contains: The overall score an agent must reach before release, based on your use case.
    - name: Test report layout
      contains: A table of tasks by rubric part with scores, pass or fail against the gate, and tokens used.
