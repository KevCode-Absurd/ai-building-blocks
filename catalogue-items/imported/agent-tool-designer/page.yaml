thinking: high
thinking_why: Tool design shapes how the whole agent behaves.
new_slug: agent-tool-designer
name: Agent tool designer
summary: Design agent tool definitions that your AI picks and uses correctly. Give it your tools or tasks. Get fewer, clearer tools with better errors.
job: connect-tools
headline: Agent tool designer
subhead: Tool definitions your AI agent can pick and use correctly, with fewer tools and clearer ones. Tools that overlap or describe themselves badly are a common cause of agent mistakes.
explain: |
  Tool definitions your AI agent can pick and use correctly, with fewer tools and clearer ones. Tools that overlap or describe themselves badly are a common cause of agent mistakes.

  The key test: if a person could not say which tool fits a task, the agent cannot either. So the skill merges tools that do nearly the same thing. Each description answers three questions: what it does, when to use it, and what it returns. Replies are sized to be complete without wasting tokens. Error messages say what went wrong and how to fix the call. It also sets matching names and settings across all tools, so the agent learns one pattern and not ten.
when:
  - Your agent picks the wrong tool or calls it with the wrong inputs.
  - You have too many overlapping tools and want to cut them down.
  - You are adding a new tool and want its description right the first time.
  - Tool errors leave the agent stuck.
not_for:
  - Your agent has only one or two tools that already work. Leave them alone and test them with real requests.
  - You need code for the tools. Ask a developer to build them, then use this to review the definitions.
  - Your tool data is messy or your task is unclear. Write down the agent's main task in a few lines first, then come back.
you_give:
  - The tools your agent has now, or the jobs it must do
  - Examples of failed tool calls (optional)
  - The agent's main task
  - Naming rules you already use (optional)
you_get:
  - A shorter, clearer tool list
  - A description for each tool
  - Better error messages
  - A naming and settings pattern to follow
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. Paste in the skill's instructions. No code running or paid tools are needed.
  - List your agent's main task and its current tools. Add any failed tool calls you have (optional).
  - Ask your AI to review the tool set and cut or merge tools that overlap. Ask for the result as a short table of tools (keep, merge or cut), then a description block for each tool, then a list of error messages.
  - Read each new description. Check that a person could tell which tool fits which task.
  - Test the new tools with real requests to your agent. Fix any call that still goes wrong.
  - Keep a log of failing calls. Run the revised tools against a set of real requests, then run the skill again with that log, or check your agent with the agent system tester.
output_sample:
  input:
    - The tools your agent has now, or the jobs it must do
    - The agent's main task
    - Examples of failed tool calls (optional)
    - Naming rules you already use (optional)
  output:
    - name: Consolidation review
      contains: Which tools overlap, which to merge, and which can be cut so each job has one clear tool.
    - name: Tool descriptions
      contains: For each tool, what it does, when to use it, and what it returns.
    - name: Response format options
      contains: Guidance on short or full replies, so the agent gets what it needs without wasted length.
    - name: Error messages
      contains: Plain messages that say what went wrong and how to fix the call.
    - name: Tool definition schema
      contains: Each tool written out with its name, inputs and settings in one consistent pattern.
    - name: Naming and settings pattern
      contains: Shared naming rules and settings so the agent learns one pattern across all tools.
    - name: Testing plan
      contains: Steps to try the tools with real agent requests and spot calls that go wrong.
