new_slug: ai-agent-monitoring-planner
name: AI agent monitoring planner
summary: Describe your AI agent. Get a plan to trace its steps, costs and errors
  without logging private data.
job: build-software
headline: AI agent monitoring planner
subhead: "A plan to see what your AI agent is doing: each step, how long it
  took, what it cost and where it failed. Nobody's private text gets stored."
explain: |
  A plan to see what your AI agent is doing: each step, how long it took, what it cost and where it failed. Nobody's private text gets stored.

  It starts from the questions you need answered, such as which tool causes timeouts or why cost per task rose. Each user attempt becomes one trace, with a step for every model call, search, tool use, handoff and retry. Steps log fixed fields: version, status, timing, tokens and cost. Content is left out by default, and capture needs approval, masking and short retention. The plan adds a few headline numbers, alerts tied to user impact, and a runbook for investigating problems.
when:
  - Your agent sometimes runs slowly and you cannot tell which step is the cause.
  - The bill for your agent rose and you need to know why.
  - You need audit evidence of what the agent did without keeping customer text.
  - Different tools and frameworks log in different ways and you want one
    standard.
you_give:
  - A description of the agent's workflow
  - Questions you want answered
  - Your logging or monitoring tools (optional)
  - Privacy and retention rules
you_get:
  - A trace and event layout
  - Metrics with clear definitions
  - Dashboard and alert specs
  - Privacy and retention settings
  - An investigation runbook
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
