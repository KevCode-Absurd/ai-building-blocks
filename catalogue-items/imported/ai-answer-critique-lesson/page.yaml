thinking: medium
thinking_why: It turns critical thinking standards into plain questions.
new_slug: ai-answer-critique-lesson
name: AI answer critique activity builder
summary: Give it a subject. Get a worksheet that has students judge an AI answer
  on clarity, evidence and fairness.
job: teach-and-train
headline: AI answer critique activity builder
subhead: "A class worksheet set that teaches students to read an AI answer
  closely instead of trusting how smooth it sounds. It is built around six
  standards for judging claims: clear, accurate, precise, relevant, deep and
  broad."
explain: |
  A class worksheet set that teaches students to read an AI answer closely instead of trusting how smooth it sounds. It is built around six standards for judging claims: clear, accurate, precise, relevant, deep and broad.

  People spot weak writing by clues like bad grammar or an odd source. AI text has none of those, so students need a new reading habit. The kit has a markup guide where students underline claims stated with too much confidence, numbers with no source and expert-sounding words with little behind them. A scoring grid rates each standard weak, medium or strong. It adds push-back sentence starters and a teacher script that models the first read aloud.
when:
  - Your students copy AI answers and never question them.
  - You need a ready activity on judging AI text for your subject.
  - You want students to give reasons for what they trust, not just opinions.
  - You want a teacher script to show how a close read sounds.
you_give:
  - Your subject and year level
  - A topic or question for the AI to answer
  - A sample AI answer (optional)
  - Time available for the lesson (optional)
you_get:
  - A markup guide for students
  - A weak, medium, strong scoring grid
  - Sentence starters for pushing back
  - A teacher modelling script
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
