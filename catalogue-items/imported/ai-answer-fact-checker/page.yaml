thinking: high
thinking_why: It checks each claim and its source one by one.
new_slug: ai-answer-fact-checker
name: AI answer fact-checker
summary: Check an AI answer claim by claim. You get a verdict for each claim, with links to public sources, so you know what holds up.
job: think-and-decide
headline: AI answer fact-checker
subhead: Paste an AI answer and the question you asked. Your AI splits the answer into single claims and checks each one against public sources. You get a verdict and a link for every claim.
explain: |
  A list of the claims in an AI answer, each checked against current public sources, with links and a short verdict. It also compares answers from several AIs and shows where they agree, clash or leave out proof.

  It keeps three questions apart: did the AI gather evidence, does the cited source actually say that, and is the claim true. Paste the answer text, the original question and any date or country that matters. Every web page and file is treated as untrusted. Links are screened before they open. It does not log in for you or touch private chats. Using the web tools your AI already has, it writes a report with one row per claim.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The author's own file header (ASI2030) says Apache-2.0. Credit goes to ASI2030 and sickn33.
when:
  - An AI gave you facts and you need to know which ones hold up.
  - You asked two or three AIs the same question and the answers differ.
  - A source cited by an AI looks odd and you want to see if it says what the AI claims.
  - You must send a checked summary to a boss or client.
not_for:
  - "You need legal, medical or financial advice you can rely on: ask a qualified professional, and use this only to prepare questions."
  - "The answer sits in a private chat or behind a login: paste the answer text yourself, since it will not log in for you."
  - "You want a single score to rank AIs: this gives a verdict per claim, not a ranking, unless you ask for one and agree the rule."
you_give:
  - The question you asked the AI
  - The AI answer text, or a public link to it
  - Which AI gave each answer
  - A date or country that matters (your AI asks before it browses if this is missing)
you_get:
  - Each claim from the answer, listed one by one
  - "A verdict for each claim: supported, contradicted or insufficient"
  - A check of whether each cited source says what the AI claims
  - Links to the public pages that back each finding
  - A comparison of where several AIs agree or clash
how_to_use:
  - Open Claude, ChatGPT or Gemini with web search turned on. The check needs a web-enabled AI. Web search can need a paid plan or a setting you turn on, so check before you start.
  - Paste the skill text into the chat.
  - Paste your question, then the AI answer. Label each answer with the AI that wrote it.
  - Add the date or country that matters, if there is one.
  - Read the claim matrix first. Open the links for any claim that matters to you.
  - The check opens public web pages and PDFs, which can hold bad or unsafe content. Your AI treats them as untrusted. Do not give it passwords or log-in details.
  - For contradicted claims, fix them before you use the answer. For insufficient claims, find better proof or ask an expert in that field. Drop or fix every claim that fails before you send the answer on, and re-run the check on the new text.
output_sample:
  input:
    - The question you asked the AI
    - The AI answer text, or a public link to it
    - Which AI gave each answer
    - A date or country that matters (optional)
  prerequisites:
    - An AI that can search the web and open pages
  output:
    - name: Question and scope
      contains: The question you asked and the date or country the check covers.
    - name: Executive finding
      contains: A short summary of what held up and what did not.
    - name: Claim matrix
      contains: One row per claim with its verdict, citation check and the evidence link.
    - name: Citation-fidelity findings
      contains: Whether each cited source exists and really says what the AI claims.
    - name: Platform comparison
      contains: Where the AIs agree, clash, or cover facts the others skipped.
    - name: Unresolved limitations
      contains: Claims it could not settle, and what needs your documents or an expert.
