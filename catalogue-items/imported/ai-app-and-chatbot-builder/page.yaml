thinking: medium
thinking_why: It picks parts and wires them together.
new_slug: ai-app-and-chatbot-builder
name: AI app and chatbot builder
summary: Describe the chatbot, document question answerer or tool-using agent you want. Get starter code for your AI app in Python with LangChain.
job: build-software
headline: AI app and chatbot builder
subhead: "Tell your AI what app you want: a chatbot, a document question answerer or an agent that uses tools. You get starter Python code built with LangChain. It works with more than one AI provider, so you can switch later."
explain: |
  Working code for a chatbot, a document question answerer, or an agent that uses tools, written with the LangChain library. It runs on your choice of AI provider, so you can swap one for another later.

  You describe the app. The skill picks the right shape. A chatbot gets conversation memory. A document question answerer gets a search step that loads your files, splits them, stores them and pulls the best pieces into each answer. An agent gets a set of tools and a loop where it decides when to use them. You need Python 3.10 or newer, a package install and an API key from your AI provider. It also points to simpler tools if your need is narrower.
when:
  - You want a chatbot that remembers the conversation.
  - You need an app that answers questions from your own documents.
  - You want an agent that can call tools like search or a calculator.
  - You may switch AI providers later and want code that makes that easy.
not_for:
  - "You only want to chat with your own files and have no coding setup: use a ready-made chat tool or the file upload in Claude, ChatGPT or Gemini."
  - "You need a complex workflow with loops, many agents or tight control: use LangGraph, a separate library, instead."
  - "You want a search-focused app over many documents and nothing else: use LlamaIndex, a library built for that."
you_give:
  - A plain description of the app you want
  - The documents or tools it should use (optional)
  - Your preferred AI provider
  - An API key from that provider
you_get:
  - Starter Python code for your chatbot, question answerer or agent
  - Install commands for the right packages
  - A document search setup, if your app needs one
  - An example of an agent that uses tools
  - A note on when a different library is a better fit
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Describe the app you want in plain words. Say which AI provider you use.
  - Add the documents or tools the app should use, if any. The default document search loads your own files, such as PDFs. The multi-document example that loads web pages is optional. Loading live web pages is a form of scraping, so check each site's terms first. The example weather and search tools return fixed placeholder text. Swap them for a real search or data source before you use the app.
  - Set your API key as an environment variable for your provider. Never paste it into the code or the chat. The starter document search uses OpenAI embeddings, which need a paid OpenAI key. Either set up that key first, or ask your AI to use an embeddings option for your own provider.
  - Read the code your AI writes. Check that it asks for your API key and does not run unsafe code.
  - Before the first run, install LangChain and note its version (pip show langchain). The code was written for version 0.3 or newer and has not been run, so check each call against the docs for your version.
  - Run it once in a test folder, with a few test documents, before you use it on real ones. Use Python 3.10 or newer on your computer. Your AI can run it for you only if it can run code.
  - Ask one test question about a fact you know is in your documents. Done when the answer is right and it names the file it used. If it fails, paste the error back to your AI and ask for a fix.
output_sample:
  input:
    - A plain description of the app you want
    - The documents or tools it should use (optional)
    - Your preferred AI provider
    - Your Python setup and an API key from your AI provider
  prerequisites:
    - Python 3.10 or newer on your computer
    - An API key from your AI provider
    - An AI that can run Python code, or a place where you can run it yourself
    - "Optional: Pinecone and LangSmith need their own accounts and keys, and may cost money"
  output:
    - name: Installation
      contains: The pip commands to install LangChain and the add-ons for your chosen AI provider.
    - name: Basic model call
      contains: A short starter script that sends one question to your AI provider and prints the answer.
    - name: Agent with tools
      contains: Code for an agent that picks and calls tools, such as search or a calculator.
    - name: Conversation memory
      contains: Code that lets a chatbot remember earlier messages in the same chat.
    - name: Document question answerer
      contains: Code that loads your files, splits them, stores them and pulls the best pieces into each answer.
    - name: Vector store options
      contains: Setup examples for storing document pieces locally or in the cloud.
    - name: Alternatives note
      contains: Short guidance on when LangGraph or another library fits better than LangChain.
