thinking: high
thinking_why: It must trace where untrusted text can reach the model.
new_slug: ai-app-injection-defender
name: AI app injection defender
summary: Find where hijacked instructions can reach your AI app, then add layers of defence. Get screening code and attack tests for prompt injection.
job: secure-code
headline: AI app injection defender
subhead: Your AI app checked for hijacked instructions and given layers of defence. Prompt injection happens when text from a user, web page or document tells the AI to ignore its real rules.
explain: |
  Your AI app checked for hijacked instructions and given layers of defence. Prompt injection happens when text from a user, web page or document tells the AI to ignore its real rules.

  The skill maps where untrusted text enters: chat input, retrieved documents, tool results, shared context and displayed markup. Then it adds layers. System rules rank above user text, and tool output is treated as data only. Untrusted text is kept apart from control instructions. Each tool gets an allow-list for the task. Replies are checked for format, secrets and unsafe actions. High-impact steps need human approval. Starter Python code screens for common attack phrases, and you test it with sample attacks.
when:
  - Your app reads web pages or documents and you worry about hidden instructions.
  - Someone reported that your bot can be tricked.
  - Your agent can call tools and you need to limit what a bad prompt can do.
  - You are reviewing an AI product before launch.
not_for:
  - "You need a formal audit or sign-off: hire a professional security reviewer."
  - "Your app takes no outside text, only fixed inputs you wrote: you do not need this, so skip it."
  - "You want to build the app itself: use a plain coding step in your AI first, then come back to check it."
you_give:
  - Your app's code or a description of how it works
  - Where it reads outside text from
  - The tools and actions it can take
  - Sample inputs for testing (optional)
you_get:
  - A map of where attacks can enter
  - A layered defence plan
  - Starter screening code
  - Tool permission rules
  - A set of attack tests
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill, or upload the skill folder.
  - Paste your app's code, or describe how it works. Say where it reads outside text and which tools it can use.
  - Ask your AI to list the entry points where untrusted text can get in. Check the list against what you know.
  - Ask it to pick the defence layers that fit, then add the screening and output check code.
  - Run the red-team tests on a test copy. This needs Python, so use an AI that can run code or run the files yourself.
  - Fix any test that fails and run the tests again before you launch.
output_sample:
  input:
    - Your app's code or a plain description of how it works
    - Where it reads outside text from, such as chat, web pages or documents
    - The tools and actions it can take
    - Sample inputs for testing (optional)
  prerequisites:
    - An AI that can read your project files, or a pasted description of the app
    - Python 3.10 or newer to run the starter screening code
    - A test copy of your app, not the live one
  output:
    - name: Attack surface
      contains: "The places untrusted text can enter: user input, retrieved documents, tool results, shared context and displayed markup."
    - name: Defense-in-depth pattern
      contains: "Five layers: rule ranking, separating untrusted text, tool allow-lists, output checks and human approval."
    - name: prompt_sanitizer.py
      contains: Starter Python code that screens input for common attack phrases.
    - name: Canary token system
      contains: Code that plants a hidden marker and alerts you if it shows up in a reply.
    - name: Multi-layer defense configuration
      contains: A settings file that turns on each layer and sets tool permissions.
    - name: output_validator.py
      contains: Starter Python code that checks replies for leaked secrets, prompt leaks and overlong text.
    - name: Red-team test cases
      contains: A file of sample attacks you run against your app to see what passes or fails.
