thinking: medium
thinking_why: It scores passages against a clear rubric.
new_slug: ai-citation-scorer
name: AI citation scorer
summary: Check how easily AI tools can quote your page. Get each passage scored with rewrites to try. Scores are a guide, not proof.
job: get-found-in-search
headline: AI citation scorer
subhead: Every passage on your page scored for how easily an AI tool can lift it into an answer, with rewrites to try. Published research suggests AI picks passages that stand alone, answer a question up front and carry real facts. We have not checked its figures.
explain: |
  Every passage on your page scored for how easily an AI tool can lift it into an answer, with rewrites to try. Published research suggests AI picks passages that stand alone, answer a question up front and carry real facts. We have not checked its figures.

  The scorer splits your page into blocks and rates each one. It looks for a length near 134 to 167 words, a direct answer in the first one or two sentences, and specific facts such as numbers, dates and named things. Self-containment is a large share of the score. A block that says "it" or "this" without naming the subject scores low, because it makes no sense when lifted out. Each weak block gets a clear rewrite you can copy.

  Licence: CC BY 4.0 applies to this copy, as the LICENSE-CONTENT file in this folder says. That file governs. The author's own file header (zubair-trabzada) says MIT, which is the author's label for the original. Credit goes to zubair-trabzada and sickn33.
when:
  - You want AI assistants to quote your page in their answers.
  - Your article ranks but AI tools ignore it.
  - You are rewriting product or help pages and need to know which parts to fix first.
  - You want a score to compare pages.
not_for:
  - "You have not written the page yet: use a plain editing pass once you have a draft, then score it."
  - "You want to know why a page ranks low in Google: use a person who knows SEO or a site audit tool."
  - "You need proof that AI tools quote your page: check the AI tools yourself, since these scores are a guide only."
you_give:
  - The page address or its text
  - The question the page should answer
  - Pages from rivals to compare (optional)
you_get:
  - A score for each passage
  - An overall citability score
  - Reasons each block scored high or low
  - Rewrite suggestions you can paste in
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini.
  - Paste the full SKILL.md text into the chat. Plain chat needs only that text and your page text. The file tools, pandoc and headless Chrome that the skill file lists are optional. A plain chat cannot save files, so you get the report as text in the chat. Copy it into your own file.
  - Paste your page text below it, or give the page address if your AI can open web pages.
  - Add the question the page should answer (optional).
  - Read the weakest blocks first. Paste in the rewrites you like.
  - Score the page again after you edit it. Treat every score and effect as a guide, not a measurement.
output_sample:
  input:
    - Your page address or the page text
    - The question the page should answer (optional)
    - Pages from rivals to compare (optional)
  prerequisites:
    - An AI that can open web pages, or paste in your page text instead
  output:
    - name: Score Summary
      contains: Your overall citability score and the scores for each of the five parts of the rubric.
    - name: Strongest Content Blocks
      contains: The passages most ready to be quoted, with a score and the reason each one works.
    - name: Weakest Content Blocks (Rewrite Priority)
      contains: The passages that score lowest, why they score low, and a rewrite you can copy.
    - name: Quick Win Reformatting Recommendations
      contains: Five changes to make first, each with a likely effect (low, medium or high), marked as a guess.
    - name: Per-Section Scores
      contains: A score for every section of the page, in page order.
