thinking: medium
thinking_why: It picks one of a few known methods and writes code.
new_slug: ai-data-extractor-builder
name: AI data extractor builder
summary: Build an AI data extractor that turns a reply into checked, typed fields. Say what to pull. Get code that fits OpenAI, Anthropic or Google.
job: build-software
headline: AI data extractor builder
subhead: Code that pulls specific facts out of an AI's reply and hands back checked, typed data, not loose text. Your next step, like a database write or a screen, can then rely on the shape.
explain: |
  Code that pulls specific facts out of an AI's reply and hands back checked, typed data, not loose text. Your next step, like a database write or a screen, can then rely on the shape.

  You list the fields you need, with type, required or optional, and allowed values. The skill shows how to enforce that shape with each provider. OpenAI takes a JSON schema in its response format. Anthropic uses a tool call as a structured-output slot. Google uses a response schema. Python gets Pydantic models, and JavaScript gets Zod. It then adds retry logic: when the reply fails validation, it sends the error back and asks again. You need some code skill and an API key.
when:
  - Your AI replies come back as messy text and your code breaks parsing them.
  - You want invoices, emails or reviews turned into clean fields.
  - The AI sometimes gives wrong types or leaves out fields.
  - You are feeding AI output straight into a database or app.
not_for:
  - "You want free-form text like a summary, essay or chat reply: ask your AI directly, no extractor needed."
  - "You want to check web form or API input with Zod: use zod-validation-expert, which is not part of this skill."
  - "You want better wording or quality in the AI's text: fix your prompt first, since this only fixes the shape."
you_give:
  - The fields you need extracted
  - Sample text to pull them from
  - Your AI provider and language
  - An API key. Each provider bills the calls to your account, so you need a paid key before you run the code
you_get:
  - A schema for your fields
  - Working extraction code
  - Validation that catches bad output
  - Retry logic when a reply fails the check
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Say which fields you need. Give each one a type, say if it is required, and list allowed values.
  - Paste a sample of the text you want to pull the fields from.
  - Say your AI provider and your language, Python or JavaScript.
  - Run the code you get with your own API key. This needs a place to run code, so use a project on your computer or an AI that can run code.
  - Test it on real inputs and fix the schema if a field comes back wrong.
  - Next, pass the checked object to your database or screen. Log the input, the raw reply and any check errors, so you can tell a schema problem from a prompt or model problem.
output_sample:
  input:
    - The fields you want pulled out, with type, required or optional, and allowed values
    - A sample of the text to pull them from
    - Your AI provider (OpenAI, Anthropic or Google) and your language (Python or JavaScript)
    - An API key for that provider
  prerequisites:
    - An AI that can run code, or a project where you can run it yourself
    - An API key from your AI provider
  output:
    - name: Schema
      contains: Your fields set out with type, required or optional, and allowed values, as a Pydantic model or Zod schema.
    - name: Extraction code
      contains: A working call for your provider that forces the reply into your schema and returns typed data.
    - name: Validation
      contains: A check that catches wrong types, missing fields and bad values before they reach your database or screen.
    - name: Retry logic
      contains: When a reply fails the check, the error goes back to the AI and it tries again, up to a set cap.
    - name: Edge case notes
      contains: Known limits and things to avoid, so the code holds up with real inputs.
