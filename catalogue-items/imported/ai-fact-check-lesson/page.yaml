new_slug: ai-fact-check-lesson
name: AI claim fact-check lesson builder
summary: Give it a topic. Get a step-by-step way for students to check AI claims
  and citations before they trust them.
job: research-topics
headline: AI claim fact-check lesson builder
subhead: A class activity that teaches students to check an AI's claims and
  citations before they trust them. AI makes errors that old fact-check rules
  miss, because there is no author or funder to look up.
explain: |
  A class activity that teaches students to check an AI's claims and citations before they trust them. AI makes errors that old fact-check rules miss, because there is no author or funder to look up.

  The lesson builds on the SIFT method: stop, investigate, find better coverage, trace claims. It adds moves for four AI errors: invented studies, made-up statistics, real papers credited to the wrong author, and false claims that experts agree. Each gets its own check. Students trace a claim back to its origin. The kit includes a Hallucination Hunt game, a list of error types for your topic, and a teacher script that sets a real citation beside a fake one.
when:
  - Your students quote AI facts and citations without checking them.
  - You want a hands-on activity on spotting made-up sources.
  - You need a short method students can remember and use.
  - You want a script to model checking a citation in front of the class.
you_give:
  - Your subject and year level
  - A topic for the lesson
  - An AI answer with claims to check (optional)
  - Class time available (optional)
you_get:
  - A list of AI error types for your topic
  - A step-by-step check for students
  - A Hallucination Hunt activity
  - A teacher script with a real and a fake citation
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
