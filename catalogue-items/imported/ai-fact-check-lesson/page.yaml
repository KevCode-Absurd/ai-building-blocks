thinking: medium
thinking_why: It adapts a source-checking method to AI errors.
new_slug: ai-fact-check-lesson
name: AI claim fact-check lesson builder
summary: Build an AI fact-check lesson for your class. Give it a topic. You get a way for students to check AI claims and citations before they trust them.
job: research-topics
headline: AI claim fact-check lesson builder
subhead: A class activity that teaches students to check an AI's claims and citations before they trust them. AI makes errors that old fact-check rules miss, because there is no author or funder to look up.
explain: |
  Two terms: lateral reading means leaving a source to see what other sources say about it. The Ennis standard is a test of whether a claim is accurate and well supported.

  A class activity that teaches students to check an AI's claims and citations before they trust them. AI makes errors that old fact-check rules miss, because there is no author or funder to look up.

  The lesson builds on the SIFT method: stop, investigate, find better coverage, trace claims. It adds moves for four AI errors: invented studies, made-up statistics, real papers credited to the wrong author, and false claims that experts agree. Each gets its own check. Students trace a claim back to its origin. The kit includes a Hallucination Hunt game, a list of error types for your topic, and a teacher script that sets a real citation beside a fake one.
when:
  - Your students quote AI facts and citations without checking them.
  - You want a hands-on activity on spotting made-up sources.
  - You need a short method students can remember and use.
  - You want a script to model checking a citation in front of the class.
not_for:
  - "Your class has no AI text to check: use a general source-evaluation lesson, or ask a librarian for one."
  - "You want to check one claim yourself right now: search the claim in Google Scholar or ask your school librarian."
  - "You need a lesson on judging websites and authors: use a general source-evaluation lesson instead."
you_give:
  - Your subject and year level
  - A topic for the lesson
  - An AI answer with claims to check (optional)
  - Class time available (optional)
you_get:
  - A list of AI error types for your topic
  - A step-by-step check for students
  - A Hallucination Hunt activity
  - A teacher script with a real and a fake citation
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the full text of SKILL.md into the chat. It returns the error types for your topic, the four-step AI check, the verification moves, the Hallucination Hunt and the teacher script.
  - "Send your details: the AI text students will check, such as an AI summary with named studies, plus your subject, year level and the tools students can use to check. Add the AI tool they use if you know it."
  - Read the error types first. Remove any that do not fit your class.
  - Run the Hallucination Hunt with a real AI answer from your subject, then use the teacher script to show one check aloud.
  - Check every real citation in the script yourself before class. The author name, study and figure in the skill file's example are invented, so do not show them to students as real.
  - Next, turn what the Hallucination Hunt finds into a class discussion. For a follow-up lesson, use a general source-evaluation lesson. The original collection's source credibility protocol and AI output audit designer are not in this library yet.
output_sample:
  input:
    - Your subject and year level
    - The kind of AI text students will check, such as an AI summary with named studies
    - The tools students can use to check, such as Google Scholar or a library database (optional)
    - The AI tool students use (optional)
  output:
    - name: Hallucination Taxonomy
      contains: The kinds of AI error most likely in your subject, with what each one looks like.
    - name: AI-Adapted SIFT Protocol
      contains: The four SIFT moves (stop, investigate, find better coverage, trace claims), changed to suit AI text.
    - name: Verification Moves
      contains: Specific checks students run on a claim or citation, using the tools they have.
    - name: Hallucination Hunt Activity
      contains: A class game where students find and prove the false claims in an AI answer.
    - name: Teacher Modelling Script
      contains: A script that shows you checking a real citation and a fake one in front of the class.
