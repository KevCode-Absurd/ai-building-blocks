thinking: medium
thinking_why: It judges feedback against learning research, then rewrites it.
new_slug: ai-feedback-quality-checker
name: AI feedback quality checker
summary: Check your AI tutor's feedback to students for timing and wording, then get a better version. Paste the student's work and the reply.
job: teach-and-train
headline: AI feedback quality checker
subhead: A check of the feedback your AI tool gives students, with a better version written for you. Vague feedback such as "good effort" changes nothing.
explain: |
  A check of the feedback your AI tool gives students, with a better version written for you. Vague feedback such as "good effort" changes nothing. Feedback that does the thinking for the student teaches nothing.

  You paste what the student did and what the AI said back. The check compares it with what research says works. It looks at timing, whether the comment is about the task, the method or the student's own self-checking, and whether it avoids praising the person. The report says what works and why. Then it writes a rebuilt reply, specific enough to act on that leaves the effort with the student.
when:
  - Your AI tutor gives replies like "great job" that do not help.
  - Your AI feedback gives away the answer.
  - "You are choosing when an AI should comment: right away or after an attempt."
  - You want to compare the feedback two tools give.
not_for:
  - "You want to grade or mark student work: use your own judgement or your school's marking scheme."
  - "You need a final mark or a decision on a grade: ask the teacher, as this check only reviews the feedback."
  - "You only want to know if the student's answer is right: check it against your answer key or ask a colleague."
you_give:
  - What the student submitted
  - The AI's current feedback
  - The subject and level
  - The learning goal (optional)
you_get:
  - A diagnosis of what works and what does not
  - A rewritten reply
  - The reasons behind each change
  - Set-up tips for timing and tone
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the instructions from this skill.
  - Paste what the student wrote or did.
  - Paste the reply your AI tool gave the student.
  - Add the year group and subject. Add the learning goal if you have one (optional).
  - Read the diagnosis first, then the rewritten reply.
  - Check the rewrite fits your class before you reuse it.
output_sample:
  input:
    - What the student submitted
    - The feedback your AI gave now
    - Student level and subject (optional)
    - What the feedback should achieve (optional)
    - Limits such as length or timing (optional)
  output:
    - name: Diagnosis
      contains: What works and what does not in the current feedback, judged against research on useful feedback.
    - name: Feedback Type Analysis
      contains: Whether the comments are about the task, the method, the student's self-checking, or the student as a person.
    - name: Improved Feedback Design
      contains: A rewritten reply that is specific, can be acted on, and leaves the thinking with the student.
    - name: Design Rationale
      contains: The reason behind each change you were given.
    - name: Implementation Notes
      contains: Tips for when the feedback should appear and what tone to use.
