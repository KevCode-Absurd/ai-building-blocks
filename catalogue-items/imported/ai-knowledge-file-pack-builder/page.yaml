thinking: high
thinking_why: It follows a set method with a few checks.
new_slug: ai-knowledge-file-pack-builder
name: AI knowledge file pack builder
summary: "Turn your notes and facts into an Open Knowledge Format folder: linked Markdown files your team and AI tools can read, reuse and check."
job: document-work
headline: AI knowledge file pack builder
subhead: Share facts, definitions or steps you want to reuse. You get a folder of linked Markdown notes in Open Knowledge Format v0.1, with clear document types and sources. It is a plain folder, not a database or a wiki. The Python checker is optional.
explain: |
  Open Knowledge Format (OKF) is a folder of Markdown files. Each file holds one idea and starts with a type line. Files link to each other, so people and AI tools can read, reuse and check what you know.

  You give your AI your notes, facts and sources. It writes one file per idea, picks stable folder names and adds the type and source to each. The optional Python checker then tests the types, reserved file names and links. The skill's own examples are about data tables. For business knowledge, such as a process or a policy, treat each process or policy as one file.
when:
  - You want facts, definitions or steps saved in a form your AI tools can reuse.
  - You need a folder of notes that links together and cites its sources.
  - You want to share a body of knowledge with a team or another AI tool.
not_for:
  - "You want a normal wiki or help pages for people: use a plain wiki or docs tool instead."
  - "You need to check full YAML syntax: use a YAML parser, because the bundled checker only reads a simple subset."
  - "You have one short note to save: keep it in a plain document, no folder needed."
  - "You want a wiki to build up over time from your notes: use the notes wiki builder instead."
you_give:
  - The knowledge, sources, document types, stable folder names, and intended readers.
you_get:
  - A linked Markdown knowledge folder, optional index and change log, and format review notes.
how_it_works:
  - title: Plan stable knowledge files
    text: Choose one concept per file and use stable paths so links keep their meaning.
  - title: Write clear metadata
    text: Add the required document type and useful optional fields. Keep sources and examples with the content.
  - title: Check the format
    text: Review document types, reserved filenames, and links. The helper checks a limited set of rules; it is not a full YAML parser.
works_best_with:
  tools:
    - name: File access; Python for optional checks
      why: The bundled helper reads a simple subset of YAML. A full YAML parser is needed to check complete YAML syntax.
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill, or upload its folder if your AI can read files.
  - Paste your notes, facts and sources. Say who will read the folder and what each topic should be called.
  - Ask your AI to write the folder. It must be able to create files. If it cannot, ask it to return the file list and the text of each file, then save each file by hand. Check that each file has a type and that links point to real files.
  - The bash steps in the skill and the Python checker are for developers. A business user can skip them and ask the AI to write the files. The checker is optional. To run the checker, you need Python 3.8 or newer with PyYAML. Without Python, your AI can still write the folder, and you check the links by hand. Create each folder before you add files to it.
  - Next, save the folder in a repo or shared drive. Point your AI tool's file access at its index.md. Choose the notes wiki builder if your notes grow over time, the company wiki planner for team processes with owners, or the text to knowledge graph builder to pull links out of one long document.
output_sample:
  input:
    - Your notes, facts, definitions or steps to reuse
    - Links or names of your sources
    - The kind of document each topic should be (optional)
    - Who will read the folder (optional)
  prerequisites:
    - An AI that can create files, to get the folder
    - Python 3.8 or newer with PyYAML, only if you want to run the optional checker
  output:
    - name: Concept files
      contains: One Markdown file per idea, each with a type in its header and a body that links to related files.
    - name: Folders and file paths
      contains: Stable names that group files by topic, so links keep working when you add more.
    - name: index.md
      contains: An optional list of the files in each folder, with a short line about each one.
    - name: log.md
      contains: An optional change history with dated headings in year-month-day form.
    - name: Concept template
      contains: A starter file with the suggested header fields and body sections, such as Schema, Examples and Citations.
    - name: Format review notes
      contains: What passed and what failed on types, reserved file names and links, from the optional checker.
next: [notes-wiki-builder, company-wiki-planner, text-to-knowledge-graph-builder]
