thinking: medium
thinking_why: It scores against a set rubric.
new_slug: ai-look-design-reviewer
name: AI-look design reviewer
summary: Check your UI code for signs it looks AI-made. Get a 0 to 100 design score, the lines that cost points and a ranked fix list.
job: design-work
headline: AI-look design reviewer
subhead: Your screen looks off and you cannot say why. This review finds the reason. It reads your UI code, scores it from 0 to 100 and points to the exact lines that make it look machine-made.
explain: |
  Your screen looks off and you cannot say why. This review finds the reason. It reads your UI code, scores it from 0 to 100 and points to the exact lines that make it look machine-made.

  The score comes from seven categories, such as coherence, colour, type hierarchy, layout, and missing states. Each starts at full marks. Points come off for faults it can cite, like mixed corner radii, two accent colours, pure black text, emoji used as icons, or no empty and error states. You get a fix list ranked by how much each change lifts the score. It only reviews. It will not edit your files unless you ask.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The author's own file header (bitjaru) says MIT. Credit goes to bitjaru and sickn33. The rubric is bitjaru's StyleSeed review, shared through sickn33's collection. The full 74-rule set is at github.com/bitjaru/styleseed.
when:
  - Your app screen looks generic or unfinished and you cannot say why.
  - You want a quality check on a page before you ship it.
  - An AI built your front end and you want to know what gives it away.
  - You need a ranked list of design fixes to hand to a developer.
not_for:
  - "You need backend code reviewed: ask a developer or a code review tool, as this only checks how screens look."
  - "You need a logo or brand identity: work with a designer, as this does not create or judge brand marks."
  - "You only want a colour contrast check: use a free contrast checker tool, as this covers much more than contrast."
you_give:
  - UI code files or a folder (React, Tailwind or HTML)
  - The page or screen to focus on (optional)
  - Your brand colours or design tokens (optional)
you_get:
  - A score from 0 to 100
  - Points lost per category, with line references
  - A ranked fix list
  - A short list of what already works
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text into the chat, or load the skill file if your AI takes files.
  - Add your UI code. Paste one file, or give your AI the project folder if it can read files.
  - Say which screen to focus on. Add your brand colours if you have them.
  - Read the score and the fix list. Start with fix number 1, as it gains the most points.
  - Ask your AI to apply the fixes if you want them done. It only reviews unless you ask.
  - Run the review again after the fixes. Aim for about 80 or more, then ship.
output_sample:
  input:
    - Your UI code files or a folder (React, Tailwind or HTML)
    - The page or screen to focus on (optional)
    - Your brand colours or design tokens (optional)
  prerequisites:
    - An AI that can read your project files, or code pasted into the chat
  output:
    - name: Design Score
      contains: Your total out of 100, a letter grade from A to F and the file reviewed.
    - name: Category breakdown
      contains: A score for each of seven categories, with the line numbers that lost points.
    - name: Fix first
      contains: A ranked list of fixes, ordered by how many points each one would add.
    - name: Re-score estimate
      contains: A rough score you could reach after you apply the fixes.
    - name: Folder summary
      contains: For a folder, a one-line score per file, then the full breakdown of the lowest file.
