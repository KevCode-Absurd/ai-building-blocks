thinking: low
thinking_why: It is a short set of standing rules, not a long analysis.
new_slug: ai-memory-habit-setter
name: AI memory habit setter
summary: Set up AI memory rules so your AI knows when to recall and when to save decisions, and stops asking the same questions every session.
job: set-up-ai
headline: AI memory habit setter
subhead: Your AI has a memory tool connected, yet it still asks the same questions and forgets what you decided last week. This skill gives it standing rules for when to look things up and when to write them down.
explain: |
  Your AI has a memory tool connected, yet it still asks the same questions and forgets what you decided last week. This skill gives it standing rules for when to look things up and when to write them down.

  The rules are plain. Recall before you start work that has history, pick a tool, or follow a convention. Save after a decision, a correction, a failure, or a lasting preference. Each note holds one fact, the reason, the date and the source, in your own words. It skips secrets and anything that can be reread from a file. It works with a notes folder, a local memory server or a hosted one.
when:
  - You connected a memory tool but your AI never seems to use it.
  - Your AI keeps undoing a habit you already corrected.
  - You start every session by repeating the same background.
  - You want one set of memory rules across several AI tools.
not_for:
  - "You want to design the memory system itself, such as what to store and how to search it: pick a memory tool first, then come back for the rules."
  - "You have a one-off question with all the facts in the message: just ask it, memory adds nothing."
  - "You want to store passwords, keys or personal data: keep those out of AI memory and use a password manager."
you_give:
  - The memory tool or folder your AI can use
  - Your project name
  - Standing decisions you want kept (optional)
you_get:
  - Rules for when your AI recalls
  - Rules for when it saves
  - A note format with fact, reason, date and source
  - A list of what never to save
how_to_use:
  - Connect a memory tool to your AI first. A notes folder works. So does a memory server. This skill adds no memory tool of its own.
  - Open a chat in Claude, ChatGPT or Gemini, or your AI tool's rules or instructions area. Paste the skill text.
  - Tell your AI the project name and where its memory lives, such as the folder path or server name.
  - Add any standing decisions you want kept (optional). Ask your AI to save each one as a note.
  - Work as usual. Check that your AI names the notes it used, with dates, before it starts.
  - Correct it when it forgets. It should save the correction as a new note.
output_sample:
  input:
    - The memory tool or notes folder your AI can use
    - Your project name
    - Decisions you want kept (optional)
  prerequisites:
    - An AI that can use a memory tool, such as a notes folder or a memory server
  output:
    - name: Recall before acting
      contains: When your AI must read memory first, such as old projects, tool choices and phrases like 'as we agreed'.
    - name: Save after deciding
      contains: "When your AI writes a note: after decisions, corrections, failures and lasting preferences."
    - name: Note format
      contains: One fact per note, with the reason, the date and where it came from, in your own words.
    - name: Closing old notes
      contains: How to mark a note as no longer true, with an end date, instead of deleting it.
    - name: Conflicts
      contains: How your AI shows two notes that disagree, with dates, and asks you which one holds.
    - name: What never to save
      contains: "A list of things to skip: secrets, personal data, file contents and temporary state."
