thinking: medium
thinking_why: It judges flaws like warped hands or fabric, which takes careful looking.
new_slug: ai-product-photo-inspector
name: AI product photo inspector
summary: Give it an AI-made product photo. Get a risk rating, eight checks and lines to add to your prompt before you retry.
job: product-photos
headline: AI product photo inspector
subhead: Give it an AI-made product photo. Get a risk rating, eight checks and lines to add to your prompt before you retry.
explain: |
  Check an AI-made product photo before it reaches an ad. You get a risk rating of low, medium or high, a verdict on each of eight checks, and a call to run it, redo it or send it for a manual touch-up.

  The eight checks cover a warped product, an odd face, bad hands, wrong limbs, garbled text, clashing light and shadow, cut-out edge marks, and platform rule breaks. The last part is the most useful. It writes one to three English lines you can paste onto the end of your image prompt, so the next try fixes the exact fault. A person still makes the final call. It runs through the dlazy command line and spends credits.
when:
  - You made a model-wearing-product photo with AI and want to know if it is ad-ready.
  - Your AI images keep having odd hands or smeared logos.
  - You generate many product images and need a fast first filter.
  - You want exact prompt fixes instead of redoing from scratch.
you_give:
  - The AI-made product image
  - The prompt you used (optional)
  - The ad platform it is for (optional)
  - A dlazy account with credits
you_get:
  - A low, medium or high risk rating
  - A pass or fail result for all eight checks
  - A run, redo or retouch call
  - One to three prompt lines to fix the faults
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can look at images, and run code if you want it to retry for you.
