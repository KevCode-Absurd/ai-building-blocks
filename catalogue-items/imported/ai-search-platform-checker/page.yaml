thinking: medium
thinking_why: It runs one checklist per AI search tool.
new_slug: ai-search-platform-checker
name: AI search platform checker
summary: Check how your site shows up in AI search. Get a score and fix list for Google AI Overviews, ChatGPT, Perplexity, Gemini and Bing Copilot.
job: get-found-in-search
headline: AI search platform checker
subhead: Each AI search tool picks its sources by its own rules, so a site that wins in one can be missing from another. This check shows where your site stands on each.
explain: |
  Each AI search tool picks its sources by its own rules, so a site that wins in one can be missing from another. This check scores your site on each platform separately.

  For every platform, it runs a checklist and gives a score from 0 to 100. Google AI Overviews checks include question headings, direct answers under them, tables, lists, a FAQ, cited statistics, dates and author bylines. The output is one file with a score, the gaps and action items for each platform. Fix the platform that matters most to your buyers first.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to zubair-trabzada and sickn33.
when:
  - You rank in Google but never appear in ChatGPT answers.
  - You want to pick which AI platform to work on first.
  - You need platform-specific edits for one key page.
  - You have to show a client where each AI engine stands.
not_for:
  - You need every check scored. Checks that need facts your AI cannot reach (Reddit activity, backlinks, Bing coverage) are marked unverified, which leaves the score incomplete.
  - Your site has no public pages yet. Publish a few pages first, then run the check.
  - You want a quick look at one page only. Read that page yourself against the checklist, or ask your AI for a short review.
  - You want your Google rankings tracked over time. Use a rank tracking tool, since this check gives a one-time report.
you_give:
  - Your website address
  - Your main topic or industry
  - The queries you most want to win (optional)
you_get:
  - A 0 to 100 score per AI platform
  - The gaps behind each score
  - Action items for each platform
  - One saved report file
how_to_use:
  - Gather your website address, your five most important search questions, and, if you have them, Search Console and Bing Webmaster data. Without that data some checks are marked unverified.
  - Open Claude, ChatGPT or Gemini. Use one that can open web pages, or the check will be weaker.
  - The skill's text has had the unsourced percentages removed. Any figure left is the original author's guess with no source, so do not quote it to clients as fact. Scores with unverified factors are shown as partial, such as points earned out of points checked.
  - If you want the report as a PDF, that step needs pandoc and headless Chrome, which the skill does not include. Ask for the report as text instead.
  - Paste the skill text into the chat, or upload the skill file. The check gives plain text by default. The PDF step is optional.
  - Type your website address and your main topic or industry. Add the questions you want to win if you have them.
  - Ask your AI to check your site against each platform and write the report.
  - Some checks need facts your AI cannot open on the public web, such as Reddit activity, backlinks or Bing coverage. Give it those facts, or ask it to mark the score "unverified".
  - Read the scores first. Start with the platform your buyers use most, then do the quick wins.
  - If you act on the Wikipedia or Reddit advice, say who you are, follow each site's rules on writing about your own business, and never post as if you were independent.
output_sample:
  input:
    - Your website address
    - Your main topic or industry
    - The questions you most want to win (optional)
  prerequisites:
    - An AI that can open web pages, so it can read your site
    - A paid account and extra tools only if you want the report as a PDF
  output:
    - name: Overall Platform Readiness
      contains: One summary of how ready your site is across all five AI search platforms.
    - name: Platform Scores
      contains: A score from 0 to 100 for each of the five platforms.
    - name: Platform Details
      contains: For each platform, what your site does well, the gaps found, and the fixes to make.
    - name: Prioritized Action Plan
      contains: Fixes sorted into quick wins for this week, medium-term for this month, and strategic for this quarter.
    - name: GEO-PLATFORM-OPTIMIZATION.md
      contains: The saved report file that holds all of the sections above.
