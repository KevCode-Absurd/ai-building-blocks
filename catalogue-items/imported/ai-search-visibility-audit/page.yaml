thinking: medium
thinking_why: It tests many technical and content points.
new_slug: ai-search-visibility-audit
name: Search and AI answer visibility auditor
summary: Find what stops customers finding you in Google and AI answers. Give it your website and get a search visibility audit with fixes ready to paste.
job: get-found-in-search
headline: Search and AI answer visibility auditor
subhead: Give it your website address. It checks whether Google and AI assistants can read your site and quote it correctly. You get a ranked fix list and files you can upload.
explain: |
  Find out what stops customers finding you in Google and in AI assistants, and get the actual files to fix it. The aim is to make your site easy to read and quote correctly. It does not try to trick any AI into recommending you.

  It crawls the site, then checks six AI-facing points: crawler access in robots.txt, whether text shows without JavaScript, an llms.txt file, structured data, clear facts such as hours and prices, and listings like Google Business Profile. Then it asks assistants the questions a customer would ask and records what comes back. You get the five fixes that matter most, plus a rewritten robots.txt and llms.txt.

  Each run fetches your live public pages, with no login needed. Connecting Shopify or Wix is optional and uses your own login. Without it, the audit reads public pages only. This copy has the main skill file but not the original plugin's detailed checklists, so it works from the main file and lists any check it could not cover.
when:
  - Customers say they asked an AI about your trade and you never came up.
  - You suspect a security plugin is blocking AI crawlers.
  - AI tools quote your hours or prices wrongly.
  - You want fixes ready to upload, not a list of advice.
not_for:
  - "Your site is behind a login or has no public pages: use a plain SEO auditor tool, since this audit can only read public pages."
  - "You need hosting or DNS changes made: ask your web developer or host. This audit only hands back the exact record to add."
  - "You want an AI to recommend your business: nobody can promise that, so use a Google Business Profile and honest reviews instead."
you_give:
  - Your website address
  - Your business type and service area
  - Access to your site platform (optional)
  - The questions customers ask (optional)
you_get:
  - A crawl report of what was and was not reachable
  - Results from real assistant questions
  - The top five fixes in order
  - A corrected robots.txt and an llms.txt
how_to_use:
  - Open Claude, ChatGPT or Gemini in a chat that can open web pages. Paste in the skill text from this page. It runs on its own, without the original plugin's reference files.
  - Type your website address, your business type and your service area. Add the questions customers ask, if you know them (optional).
  - Wait for the crawl report first. Check that it lists the pages it could not reach.
  - Read the top five fixes. Answer any question it asks about your hours, prices or services. It will not guess.
  - Copy the new robots.txt and llms.txt into your site, or ask your web developer to do it.
  - Run the audit again in 30 days to see what changed.
output_sample:
  input:
    - Your website address
    - Your business type and service area
    - The questions your customers ask (optional)
    - Access to your site platform, such as Shopify or Wix (optional)
  prerequisites:
    - An AI that can open web pages from a link
  output:
    - name: Crawl report
      contains: The pages that could be reached, the pages that could not, and what each one shows without JavaScript.
    - name: AI half check
      contains: Findings on crawler access, readable text, llms.txt, structured data, clear facts and listings.
    - name: Assistant test
      contains: Each customer question you asked, whether you appeared, who did, and which sources were cited.
    - name: Top five fixes
      contains: The five findings that matter most, ranked by impact, with the rest in an appendix.
    - name: robots.txt
      contains: A corrected file that lets AI crawlers in.
    - name: llms.txt
      contains: A plain file describing what your business does, where it works and how to reach you.
    - name: JSON-LD blocks and rewritten titles
      contains: Structured data and new titles and descriptions, ready to paste.
    - name: Recheck date
      contains: A date to run the audit again, since changes take time to show.
