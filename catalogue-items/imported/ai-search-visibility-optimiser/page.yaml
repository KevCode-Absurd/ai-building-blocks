thinking: medium
thinking_why: It follows set rules and picks edits per page.
new_slug: ai-search-visibility-optimiser
name: AI search visibility optimiser
summary: Check how ChatGPT, Perplexity and Google AI answers treat your page, then get edits so they cite you. Built for AI search visibility.
job: get-found-in-search
headline: AI search visibility optimiser
subhead: Edits to a page or topic that make AI search tools more likely to pull it into answers and name you as the source. The target is Google AI Overviews, ChatGPT, Perplexity and similar tools.
explain: |
  Edits to a page or topic that make AI search tools more likely to pull it into answers and name you as the source. The target is Google AI Overviews, ChatGPT, Perplexity and similar tools.

  First it checks where you stand: what the AI says today for your key questions, who gets cited, whether your content can be lifted out cleanly, and whether AI bots can get in. Then it works on three things. Structure means short answer blocks, clear definitions, comparisons and FAQs. Authority means named sources, fresh facts and expert bylines. Presence means being on the sites AI trusts. It also covers schema markup and tracking.
when:
  - Competitors get named in AI answers and you do not.
  - AI describes your price or features wrongly.
  - You want existing blog posts rewritten so an answer can be lifted from them.
  - You need a way to track AI mentions over time.
not_for:
  - "You need a technical or on-page SEO audit for Google search: use the technical SEO auditor instead."
  - "You only need schema markup added to a page: use a schema tool or a developer, since this skill only suggests markup."
  - "The page does not affect sales or leads: skip it, because the edits take time and will not pay back."
you_give:
  - A page address or a topic
  - Your key customer questions
  - Your competitors (optional)
  - Your product or brand background (optional)
  - An AI plan that can browse the web. Some browsing features need a paid plan, and the monitoring tools the skill names (such as Otterly, Peec AI and Semrush) are paid services. You can skip them and check by hand
you_get:
  - A check of today's AI answers on your topic
  - Page edits that make content easy to quote
  - Schema markup suggestions
  - A tracking list of prompts to monitor
how_to_use:
  - Open your AI. Use one that can browse the web, such as ChatGPT, Claude or Gemini.
  - Upload the skill file, or paste its text. The full skill is long, so if your AI limits pasting, paste only the parts for the step you are on.
  - Add your page address or topic, and your key customer questions. Pick 10 to 20 questions to test.
  - Add your competitors and brand background if you have them.
  - Ask for the audit first. Check each question in ChatGPT, Perplexity and Google, and record in a table who is cited. Read the audit section first.
  - Use the audit to choose edits. The Extractability check maps to edits to your answer blocks. The AI bot access check maps to your robots settings. Citation patterns map to the sources and bylines you add. Apply the page edits one at a time.
  - Re-check the same questions in a few weeks to see what changed.
  - Then make the page edits on the pages that sell first, and add schema markup to those pages.
output_sample:
  input:
    - A page address or a topic
    - Your key customer questions
    - Your competitors (optional)
    - Your product or brand background (optional)
  prerequisites:
    - An AI that can browse the web, so it can check live AI answers
  output:
    - name: AI visibility audit
      contains: What AI tools answer today for your key questions, and which sites they cite.
    - name: Citation patterns
      contains: Who gets named in those answers and what kind of content they use.
    - name: Extractability check
      contains: A pass or fail list showing if answers can be lifted cleanly from your page.
    - name: AI bot access check
      contains: Whether AI crawlers can reach your page or are blocked.
    - name: Page edits
      contains: A numbered list of changes to structure, sources and wording so your content is easy to quote.
    - name: Schema markup
      contains: Suggested structured data to add to your page.
    - name: Monitoring list
      contains: The questions to re-check over time to see if AI mentions you more.
