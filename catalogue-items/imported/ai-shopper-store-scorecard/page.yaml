thinking_why: A script runs six fixed checks and the AI reports them.
new_slug: ai-shopper-store-scorecard
name: AI shopper store scorecard
summary: Check if AI shopping tools can read your Shopify store. Give it your store link and get a 6-point scorecard with proof for each result.
job: get-found-in-search
headline: AI shopper store scorecard
subhead: Can an AI shopping assistant actually read your Shopify store? In about two minutes you get a six point scorecard with proof for each result, set against 99 other stores from the author's own unpublished study. That comparison is unverified and only a rough guide.
explain: |
  Can an AI shopping assistant actually read your Shopify store? In about two minutes you get a six point scorecard with proof for each result, set against 99 other stores.

  A small Python script visits your store politely. It follows robots.txt, waits a second between requests and sends about 15 requests. It checks six things: AI crawlers allowed in and an llms.txt file, shipping and returns in structured data, star ratings in structured data, barcodes, descriptions of 80 words or more, and image alt text. The report says what an AI agent cannot answer because of each gap. The 99 stores come from the skill author's own October 2026 study. Its data is not published with the skill and we have not checked it, so treat every comparison figure as a rough guide. It needs Python. A fuller paid audit is mentioned at the end.
when:
  - You want a fast read on whether AI shopping tools can see your products.
  - You wonder how your store compares with other Shopify stores.
  - You need proof of gaps before asking a developer for changes.
  - You want a quick check before a bigger audit.
not_for:
  - Your store is not on Shopify or is password-protected. Check your product pages by hand instead, because the script cannot read them.
  - You want a step-by-step fix list. This only finds gaps. Use the paid agent-ready-store-audit in the Store Ops Pack.
  - You do not own the store or have no permission to check it. Ask the owner first, or skip it.
you_give:
  - Your Shopify store address
  - Python on your computer
  - Pages to paste if the script cannot fetch them (optional)
you_get:
  - A pass or gap result on six checks
  - Evidence for each result
  - A comparison with 99 stores
  - Plain notes on what AI agents cannot do because of each gap
how_to_use:
  - This skill was first called agent-ready-quick-check, so look for that name in its files.
  - Open an AI that can run Python code, such as Claude with code tools turned on.
  - The script visits the live store pages, about 15 requests. Run it only on a store you own or have permission to check.
  - Add the skill file and the script folder to the chat.
  - "Tell your AI: run the quick check on your store link. Your AI will ask you in chat to confirm you own the store or have permission. Only after you say yes does it add the --owner-confirmed flag the script needs. The flag is a step in the chat, not a real ownership check, so the yes has to be true."
  - Read the scorecard. Start with the gaps that say what an AI agent cannot answer.
  - To fix the gaps, use the structured data writer and the llms.txt writer, both free in this library, and the AI search audit for a wider check. The fuller audit named at the end of the scorecard is a paid product from the skill's author.
  - If a page could not be fetched, paste its text when your AI asks.
output_sample:
  input:
    - Your Shopify store link
    - Pages you paste in if the script cannot fetch them (optional)
  prerequisites:
    - An AI that can run Python code
    - Python 3 on the machine that runs it
  output:
    - name: Header and score
      contains: The store domain, the date, and how many of the 6 checks your store passes against the study median.
    - name: Scorecard table
      contains: One row per check with a pass or gap result, the evidence found, and the share of study stores that pass.
    - name: AI crawler and llms.txt check
      contains: Whether AI agents are allowed in by robots.txt and whether an llms.txt file exists.
    - name: Product data checks
      contains: Shipping and returns, star ratings and barcodes in structured data, description length, and image alt text.
    - name: What this means
      contains: Three to five bullets saying what an AI agent cannot answer because of each gap.
    - name: Paid audit line
      contains: One closing line pointing to the full audit in the paid Store Ops Pack.
