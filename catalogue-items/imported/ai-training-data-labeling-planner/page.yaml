thinking: high
thinking_why: It follows a set method with a few checks.
new_slug: ai-training-data-labeling-planner
name: AI training data labeling planner
summary: Plan how to label data for your AI. Give it the task and sample records. You get label rules, reviewer guidance, quality checks and a sampling plan.
job: teach-and-train
headline: AI training data labeling planner
subhead: Share the task your AI will learn, example records, and labeling limits. It defines labels, edge cases, reviewer guidance, and a fair way to sample records. You get a labeling plan and quality checks that preserve uncertainty and disagreements instead of forcing agreement.
explain: |
  This is for anyone preparing data to teach an AI a task, such as sorting support tickets or tagging photos. Labeling means a person marks each example with the right answer, so the AI can learn from it.

  The skill sets out what each label means, with clear examples and rules for odd cases. It plans how to pick fair samples and how to train and check your reviewers. It keeps real disagreement visible instead of hiding it. It also records where the data came from and what rights you have. You get a plan you can hand to reviewers.

  Four terms. A held-out sample is a set of records you keep aside to check quality later. Adjudication is a named person settling a disagreement by a stated rule. Abstention is an "unsure" label reviewers may pick. Out-of-distribution means unlike the examples the AI has seen.
when:
  - You are about to have people label examples to teach an AI a task.
  - Your reviewers disagree and you do not know why.
  - You need a written record of where your data came from and what rights you have.
  - You want a plan you can hand to a team of reviewers.
not_for:
  - "You need statistical power or sample size maths: ask a data scientist or a stats tool."
  - "You want to train or test a model: use your machine-learning engineer or a training tool."
  - "You need to store data or build a data pipeline: ask a data engineer."
you_give:
  - The downstream task, example items, population, rights and access limits, budget, and reviewers.
you_get:
  - A label schema, reviewer guide, sample plan, provenance record, and quality review plan.
how_it_works:
  - title: Define labels and rights
    text: Set the unit, label choices, unclear cases, abstention option, source rights, and data access rules.
  - title: Plan sampling and training
    text: Keep a fair sample aside to check the results later. Train reviewers with examples before using their labels.
  - title: Check quality and disagreement
    text: Use blind rechecks and qualified review. Keep genuine ambiguity and disagreement visible.
  - title: Set a stopping rule
    text: Balance coverage, downstream value, time, cost, and quality before handing a versioned dataset to the next owner.
works_best_with:
  tools:
    - name: A chat AI that can read the bundled reference files
      why: Use the supplied references and templates for the chosen task. Scripts are optional unless that task specifically needs them.
how_to_use:
  - Before you start, write down the task the AI will learn, 10 to 20 example records, where the data came from and what you may do with it, who will review, and your budget and deadline.
  - Remove names, contact details and other personal fields from your example records before you paste them into any AI tool. Note which fields are sensitive.
  - Add the downloaded folder to an AI that can read the included references and templates.
  - Give the task, example records, rights limits, reviewers, budget, and what a useful label means.
  - Ask for label rules, reviewer guidance, sampling, and quality checks. The label rules come as a table with these columns. Label, meaning, a good example, a bad example and a rule for edge cases.
  - Ask it to end with a short list headed "Open questions" that names each unresolved rights issue and each reviewer issue.
  - The source also names separate jobs for statistics, data storage, model training, and interface design. Those optional specialist skills are not required for labeling and are not included.
output_sample:
  input:
    - The task your AI will learn
    - A few example records
    - Where the data comes from and what rights you have
    - Your budget and who will review (optional)
  prerequisites:
    - An AI that can read the downloaded folder of reference files and templates
  output:
    - name: Annotation plan
      contains: The task, the label unit, the sampling mix, the held-out check sample, and when to stop.
    - name: Annotation guide
      contains: Label choices with good and bad examples, edge case rules, an unsure option, and when to escalate.
    - name: Provenance and rights record
      contains: Where data came from, license or consent, sensitive fields, access, how long you keep it, and version.
    - name: Reviewer training and calibration
      contains: How reviewers are qualified, trained on sample items, and rechecked blind over time.
    - name: Quality report
      contains: Agreement by label and slice, disagreements kept visible, how they were settled, and guide fixes.
