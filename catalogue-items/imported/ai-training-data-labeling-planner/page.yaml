thinking: high
thinking_why: It follows a set method with a few checks.
new_slug: ai-training-data-labeling-planner
name: AI training data labeling planner
summary: Share examples and the task. Get label rules, reviewer guidance, quality checks, and a sampling plan.
job: teach-and-train
headline: AI training data labeling planner
subhead: Share the task your AI will learn, example records, and labeling limits. It defines labels, edge cases, reviewer guidance, and a fair way to sample records. You get a labeling plan and quality checks that preserve uncertainty and disagreements instead of forcing agreement.
you_give:
  - The downstream task, example items, population, rights and access limits, budget, and reviewers.
you_get:
  - A label schema, reviewer guide, sample plan, provenance record, and quality review plan.
how_it_works:
  - title: Define labels and rights
    text: Set the unit, label choices, unclear cases, abstention option, source rights, and data access rules.
  - title: Plan sampling and training
    text: Keep a fair sample aside to check the results later. Train reviewers with examples before using their labels.
  - title: Check quality and disagreement
    text: Use blind rechecks and qualified review. Keep genuine ambiguity and disagreement visible.
  - title: Set a stopping rule
    text: Balance coverage, downstream value, time, cost, and quality before handing a versioned dataset to the next owner.
works_best_with:
  tools:
    - name: A chat AI that can read the bundled reference files
      why: Use the supplied references and templates for the chosen task. Scripts are optional unless that task specifically needs them.
how_to_use:
  - Add the downloaded folder to an AI that can read the included references and templates.
  - Give the task, example records, rights limits, reviewers, budget, and what a useful label means.
  - Ask for label rules, reviewer guidance, sampling, and quality checks. Keep proposed roles and unresolved rights clear.
  - The source also names separate jobs for statistics, data storage, model training, and interface design. Those optional specialist skills are not required for labeling and are not included.
