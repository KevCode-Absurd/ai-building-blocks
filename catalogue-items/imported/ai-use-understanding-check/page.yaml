thinking: medium
thinking_why: It finds where AI use hides gaps and adds checks.
new_slug: ai-use-understanding-check
name: AI-use understanding check planner
summary: Plan checkpoints that check student understanding when they use AI. Tell it how they use AI on a task. You get recall prompts and class steps.
job: teach-and-train
headline: AI-use understanding check planner
subhead: Students who use AI can feel they understand a topic because the answer reads so smoothly. Checkpoints that expose the gap between what they think they know and what they can do turn that into a lesson.
explain: |
  Students who use AI can feel they understand a topic because the answer reads so smoothly. Checkpoints that expose the gap between what they think they know and what they can do turn that into a lesson.

  You describe how students use AI on a task and what worries you. The skill explains how that use can inflate their confidence. Then it designs moments where students must recall or explain without the AI's text in front of them, and compare their prediction with their result. Retrieval is the main tool, because it shows the true state of knowledge. It does not ban AI. It builds the checking into the task and draws on research on self-regulated learning.
when:
  - Students hand in good essays but cannot explain them aloud.
  - You allow AI on a task and want to know what students really learned.
  - You need a quick check to run before an assessment.
  - You want to teach students to judge their own understanding.
not_for:
  - "You want to grade a single student on their own work: use a marking rubric or a short talk with that student."
  - "You need a formal test or exam: write the assessment yourself, then use this to plan checks before it."
  - "You want a loop of quizzes and feedback across a unit: use the Retrieval quiz writer for the quizzes and the Written feedback checker for the feedback."
you_give:
  - How students use AI on the task
  - Your main concern about understanding
  - Year group and subject (optional)
  - The AI tool they use (optional)
  - How the work is assessed (optional)
you_get:
  - An analysis of where confidence may be inflated
  - Checkpoints that require recall without AI
  - Prompts for students to predict and compare
  - Guidance on running them in class
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the full text of the skill file (SKILL.md) for this item. It holds the prompt your AI follows, and it is not shown in full on this page.
  - Describe how your students use AI on the task. Add what worries you about their understanding.
  - Add year group, subject, AI tool and how the work is assessed if you know them (optional).
  - Run it and read the diagnosis first. Check it matches what you see in class.
  - Pick one checkpoint and run it in your next lesson without AI on screen.
  - Compare what students predicted with what they could do. Use the gap to plan your next lesson.
  - Next, build the recall quizzes with the Retrieval quiz writer, or the prediction questions with the Self-explanation question writer.
output_sample:
  input:
    - How students use AI on the task
    - The main worry about their understanding
    - Year group and subject (optional)
    - The AI tool they use (optional)
    - How the work is assessed (optional)
  output:
    - name: Metacognitive Diagnosis
      contains: How AI use in this task may make students feel they understand more than they do.
    - name: Monitoring Interventions
      contains: Checkpoints, predict-and-compare prompts and self-check tasks that make students recall or explain without the AI text.
    - name: AI Usage Guidelines
      contains: Simple rules for when and how students use AI during the task.
    - name: Assessment Alignment
      contains: How the checkpoints match the way the work will be assessed.
    - name: Red Flags
      contains: Signs in student work or talk that show a gap in real understanding.
