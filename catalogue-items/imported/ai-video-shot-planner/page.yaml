thinking: medium
thinking_why: It follows set steps but makes many small creative calls.
new_slug: ai-video-shot-planner
name: AI video shot planner
summary: "Turn one line into an AI video shot planner result: a shot list, a ready prompt for each shot, and fixes for clips that failed."
job: make-video-ads
headline: AI video shot planner
subhead: "A shot list and one ready prompt per shot for your AI video, plus a plan to fix clips that came out wrong. Most failed clips break for dull reasons: two actions in one clip, no camera move, a changing subject, or a mood instead of an image."
explain: |
  Start by typing your video idea in one line. You get back a shot list and a prompt for every shot.

  It asks three questions at most, then splits the video into short shots with a prompt for each. It runs three modes. Plan builds the shot list. Fix rewrites a prompt that is failing. Review looks at a bad clip and names the one change before the next try. It plans only, it does not make video.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The author's own file header (HEOJUNFO) says MIT. Credit goes to HEOJUNFO and sickn33.
when:
  - You have a video idea and need to turn it into clips an AI model can make.
  - Your video prompt keeps producing the wrong result.
  - The same character looks different from shot to shot.
  - You wasted a generation and want to change the right thing next.
not_for:
  - "You want the video made or edited: this only plans, so use your video AI such as Runway, Kling or Veo."
  - "You have no video idea yet: write a one-line idea first, or ask a teammate for a brief."
  - "You need to check ad copy or script claims: this plans shots, so ask a person to review the script."
you_give:
  - A one-line video idea or script
  - Platform and length (optional)
  - A failing prompt or a description of a bad clip (optional)
you_get:
  - A shot list file
  - One ready prompt per shot
  - A diagnosis of a failing prompt
  - One change to make before the next try
how_to_use:
  - Open Claude, ChatGPT or Gemini. Upload SKILL.md together with its references folder (the roles, templates, model prompting and unslop files), because the crew steps read them. If your AI cannot take files, paste each one in. No code or paid tool is needed.
  - Type your video idea in one line. Add the platform, length and video model if you know them.
  - Answer up to three short questions. For a real product or person, share a photo.
  - Read the shot list. Check that each shot has one action and one camera move.
  - Copy one prompt per shot into your video tool. It plans only, so it will not make the video.
  - If a clip fails, paste the prompt or describe the clip. Make the one change it names, then try again.
output_sample:
  input:
    - Your video idea in one line
    - Platform and length (optional)
    - A photo of your real product or person (optional)
    - A prompt that is failing, or a description of a bad clip (optional)
  output:
    - name: SHOT_LIST.md
      contains: "The full plan: crew notes, a shot table, and a reroll plan for each shot."
    - name: Director section
      contains: The logline, the intent, a beat sheet with timings, and the hook.
    - name: Continuity bible
      contains: Fixed descriptions of each character, prop and place, pasted word for word into every shot.
    - name: Shot table
      contains: Each shot with its size, lens, angle, one camera move, lighting and length.
    - name: Prompt block per shot
      contains: One copy-paste prompt for each shot, plus a negative prompt where the model supports it.
    - name: Reroll plan
      contains: The most likely failure for each shot and what to change if it happens.
    - name: Fix or Review result
      contains: The problems in a failing prompt with a rewrite, or the one change to make before the next try.
