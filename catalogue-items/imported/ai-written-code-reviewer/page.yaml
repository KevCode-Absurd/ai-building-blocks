thinking: high
thinking_why: It reads the code closely to find hidden weak spots.
new_slug: ai-written-code-reviewer
name: AI-written code reviewer
summary: Check AI-written code before you ship it. Get the real risks, where they are in the code, and the smallest fix for each.
job: test-and-fix-code
headline: AI-written code reviewer
subhead: "Code that runs but feels fragile gets a plain risk review: what will hurt later, why, and the smallest fix for each. It looks at what rapid AI-assisted coding often leaves behind and ignores cosmetic nitpicks."
explain: |
  Code that runs but feels fragile gets a plain risk review: what will hurt later, why, and the smallest fix for each. It looks at what rapid AI-assisted coding often leaves behind and ignores cosmetic nitpicks.

  It starts with a quick scan: file count, language, entry points and red flags such as hardcoded secrets, bare excepts and leftover TODOs. Then it checks seven areas for risks it can point to in the code. It never invents findings. It does not rewrite your code to show off. You get each issue with its location, why it matters and a minimal fix, so you can decide what to do before launch or team handoff.
when:
  - An AI built your prototype and you want to ship it for real.
  - The code works but you are afraid to change it.
  - You are handing the project to another developer.
  - You want security and upkeep risks flagged before launch.
not_for:
  - "You only need a security check: use a dedicated security audit or ask a security engineer."
  - "You have one small snippet with a single bug: ask your AI to fix that bug directly."
  - "You want your code rewritten or restyled: ask your AI for a rewrite, since this review only flags risks and small fixes."
you_give:
  - The source code, as files or pasted
  - What the system does and its scale (optional)
  - Your language and framework (optional)
you_get:
  - A quick scan summary
  - Risks with file and line locations
  - Why each one matters
  - The smallest fix for each
how_to_use:
  - Open a new chat in Claude, ChatGPT or Gemini.
  - Paste the skill instructions first.
  - Paste your code under them. For many files, upload them if your AI allows it.
  - Add what the system does and how many people use it (optional), plus your language and framework (optional).
  - Read the Executive Summary first, then fix the Critical Issues before you ship.
  - Ask your AI to explain any finding you do not follow.
output_sample:
  input:
    - Your source code, as files or pasted text
    - What the system does and how many people use it (optional)
    - Your language and framework (optional)
  output:
    - name: Audit Report header
      contains: The files reviewed, the assumptions made, and quick stats on file count, lines of code and language.
    - name: Executive Summary
      contains: A short read-first view of the biggest risks and whether the code is ready for production.
    - name: Critical Issues
      contains: Problems to fix before production, each with its location, why it matters and a copy-paste fix.
    - name: High-Risk Issues
      contains: Serious problems that are less urgent, with location, reason and recommended change.
    - name: Maintainability Problems
      contains: Messy or inconsistent code that will make later changes slow or risky.
    - name: Production Readiness Score
      contains: A score for how ready the code is to ship, with the reasons behind it.
    - name: Refactoring Priorities
      contains: The order in which to fix things, starting with what matters most.
