thinking: medium
thinking_why: It weighs language clues and says when it cannot tell.
new_slug: ai-written-text-detector
name: AI-written text detector
summary: Check if AI wrote a document. Paste text or add a file and get an honest lean, the wording clues behind it, and a clear note when it cannot tell.
job: write-and-tell-stories
headline: AI-written text detector
subhead: Paste a document. Get an honest estimate of whether AI wrote it, with the wording clues behind it. Bring a document as a file, link or pasted text.
explain: |
  An honest estimate of whether AI wrote a document, with the wording clues behind it and a clear "cannot tell" when the document is not suited to testing. It reads style only. It cannot prove who wrote something.

  You send a file or pasted text to a detection service. It returns a lean of AI, human or unsure, a probability between 0 and 1, the phrases and patterns it flagged, such as stock openers and sentences of the same length, and its reasoning. Forms, tables and scans are refused instead of guessed. Treat the result as one signal for triage, never a verdict, because people write plainly and AI can too. It needs an API key for the service.

  Licence: this copy is credited under the Apache 2.0 licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to Sketchjar and sickn33.
when:
  - You teach and want a first look at a suspicious student essay.
  - You review inbound articles or guest posts and need to triage them.
  - You read CVs or cover letters and want to flag, not reject, AI drafts.
  - You want to see which phrases make a text read like AI.
not_for:
  - "You would use the result alone to grade, hire, publish or discipline someone: it can wrongly flag non-native English, templated, coached or accessibility-assisted writing, so never make it the only basis for a decision."
  - "You need proof of who wrote a document: no tool can give that, so ask the writer to explain their work in person."
  - "You want to know if a document is fake or edited: use a document check that looks at the file itself, not its style."
  - "Your document is a form, table, payslip or scan: the service refuses these, so read it by hand."
you_give:
  - A document as a file, link or pasted text
  - An API key for the Stipple detection service. We cannot say if it is free or paid, or what the allowance is, so check Stipple's current terms first
  - Who will read the result (optional)
you_get:
  - A lean of AI, human or unsure
  - A probability score, labelled as uncalibrated
  - The flagged phrases and patterns
  - A note on what the result cannot show
how_to_use:
  - "Before you start: this sends the whole document to Stipple, an outside service. We do not know its cost, free allowance or how long it keeps documents. Check Stipple's current terms and privacy rules on stipple.sh before you go on."
  - Get consent from the writer first. Your document is sent to a hosted third party, and we do not know how long Stipple keeps it. Read its privacy rules, and remove private details you do not need.
  - Open an AI that can run a web request, such as Claude with code tools. Paste the skill instructions.
  - Get an API key from stipple.sh. Keep it out of the chat and out of shared files, and never paste it into the skill text. Store it where your AI's code tool can read it, such as an environment variable. We have not tested Stipple's endpoint or its response fields, so expect to fix a detail or two. Then give your AI the file, link or pasted text.
  - First check whether the reply says applicable is false. That means Stipple refused the document because it is not prose, such as a form, table or scan. Stop there. Do not read a lean from a refused document. Otherwise read the lean, the flagged phrases and the limits note.
  - Treat the result as one signal. If the lean is ai or unsure, keep the original file and talk to the writer about how they wrote it before you act. If the question is whether the file was faked or edited, use a document check that looks at the file itself.
  - If the result is unsure or cannot tell, do not treat it as a no. Talk to the writer, or use a document check that looks at the file itself.
  - Before any decision, keep the original document, write down the result and what the writer said, and give the writer a way to appeal.
output_sample:
  input:
    - Your document as a file, link or pasted text
    - Your Stipple API key
    - Who will read the result (optional)
  prerequisites:
    - An AI that can run a web request, or a way to send one yourself
    - A Stipple API key
    - Consent from the writer to send their document to a third party
  output:
    - name: Provider AI-style score
      contains: A number from 0 to 1 with the lean of ai, human or unsure, marked as uncalibrated.
    - name: Prose ratio
      contains: How much of the document is real prose that can be tested.
    - name: Linguistic tells
      contains: The phrases and patterns flagged, such as stock openers, even sentence length and low variety.
    - name: Reasoning
      contains: Why the service reached its lean.
    - name: Limitations
      contains: A note on what the score cannot show, including noise and false flags.
