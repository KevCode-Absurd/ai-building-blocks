thinking_why: It follows set checks and fills in complaint templates.
new_slug: amazon-brand-protection-planner
name: Amazon brand protection planner
summary: Check your Amazon listings for hijackers, fakes and price breaks. Get a risk rating and complaint letters ready for Brand Registry.
job: run-your-store
headline: Amazon brand protection planner
subhead: A set of checks and ready complaint templates to protect your Amazon brand from hijackers, fakes and sellers breaking your price rules (your minimum advertised price, or MAP, is the lowest price you allow sellers to show). It works to risk levels, so you know what needs action in 24 hours and what only needs watching.
explain: |
  A set of checks and ready complaint templates to protect your Amazon brand from hijackers, fakes and sellers breaking your price rules (your minimum advertised price, or MAP, is the lowest price you allow sellers to show). It works to risk levels, so you know what needs action in 24 hours and what only needs watching.

  You give the brand name and listings. It does not watch Amazon for you. It checks four signals in the data you paste in: new sellers appearing on your listing, prices below your minimum, review wording that hints at counterfeits, and your trademark used in other sellers' titles. Each gets a risk rating of high, medium or low. It supplies a Brand Registry complaint, a cease and desist letter, a MAP notice and a guide to making a test buy for evidence. Check each letter with a lawyer before sending.
when:
  - Another seller has suddenly joined your listing.
  - Reviews say the product is fake or different from the photos.
  - A reseller is selling below your minimum price.
  - You need a complaint ready to send to Amazon.
not_for:
  - "You need legal advice or a final call on a lawsuit: ask a lawyer before you send any letter."
  - "You want live alerts on your listings: this skill has no data feed, so use a paid Amazon monitoring tool."
  - "You sell on Shopify or your own site: use a plain takedown request to the host or platform instead."
you_give:
  - Your brand name and trademark details
  - Your listing identifiers
  - Your minimum advertised price (optional)
  - Seller names you already suspect (optional)
you_get:
  - Risk ratings for hijackers, prices, fakes and trademark use
  - What to do next for each level
  - Brand Registry and cease and desist templates
  - A test buy guide for evidence
how_to_use:
  - Gather your brand name, trademark number and the listing IDs (ASINs) you want to protect. Add your minimum price and approved sellers if you have them.
  - Note that the skill has no data feed, sends no alerts and does not watch your listings. It only checks the seller, price and review details you bring.
  - Open the skill in an AI that can run code. The detector script runs only on built-in sample data. Ask your AI to open scripts/detector.py, find get_demo_data(), and replace the brand, listings, sellers and review text there with yours before it runs. Give one entry per listing: its ASIN, title, price, and each seller with their ID, name and price, plus the review text.
  - A review that says fake is weak evidence. Confirm with a test buy before you send any complaint.
  - Ask your AI to run detector.py on your details. Read the risk rating for each listing. High means act within 24 hours.
  - "Before you run the templates script, replace the sample brand, seller and contact details in its main() with yours. Then run it for the letter you need: complaint, cease, map or testbuy. When a listing rates high, send the Brand Registry complaint first. Use the cease and desist letter only if you know who the seller is."
  - Have a lawyer check each letter before you send it. Treat the sample report as made-up example data.
output_sample:
  input:
    - Your brand name and trademark number
    - Your listing IDs (ASINs) to protect
    - Your minimum advertised price (optional)
    - Seller IDs you allow to sell your brand (optional)
  prerequisites:
    - An AI that can run code, to use the detector and template scripts
    - Seller, price and review data from your own checks, since the skill has no data feed
  output:
    - name: Brand Protection Report
      contains: Risk ratings per listing for unauthorized sellers, prices below your minimum, and review signs of fakes.
    - name: High risk alerts
      contains: Listings that need action within 24 hours, with seller count, lowest price and the suggested next step.
    - name: Counterfeit signals
      contains: A count of reviews that say fake or not authentic, with advice on whether to make a test buy.
    - name: Brand Registry complaint
      contains: A complaint template to report a violation to Amazon.
    - name: Cease and desist letter
      contains: A letter template for contacting a seller directly.
    - name: Test buy report
      contains: A guide and template to record evidence when you buy from a suspect seller.
    - name: MAP notice
      contains: A notice template for a seller who prices below your minimum advertised price.
