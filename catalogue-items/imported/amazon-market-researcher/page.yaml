thinking: medium
thinking_why: It plans a narrow data request, then reads the results.
new_slug: amazon-market-researcher
name: Amazon market researcher
summary: Give it a product or category. Get Amazon sales rank, reviews and
  seller data in a report. Collects data from websites.
job: study-competitors
headline: Amazon market researcher
subhead: "A research report on an Amazon product or category built from live
  data: search results, rankings, Best Sellers, New Releases, seller catalogues
  and reviews. Each point comes with the source link so you can check it."
explain: |
  A research report on an Amazon product or category built from live data: search results, rankings, Best Sellers, New Releases, seller catalogues and reviews. Each point comes with the source link so you can check it.

  You set a narrow question, a marketplace and a scope. The skill turns it into read-only data requests through the Pangolinfo service, then compares a small set of named products or pulls out review themes with evidence. It never invents tool names. It cannot place orders, contact sellers or crawl broadly. The service needs your own API key, kept in your tool's secret settings, and it may use plan credits.
when:
  - You are sizing up a product niche before you invest in stock.
  - You want to compare a few named competitors on price and reviews.
  - You need review complaints and praise sorted into themes.
  - You want Best Sellers or New Releases data with sources.
you_give:
  - A product, category or a short list of named products
  - The Amazon marketplace
  - Your research goal
  - A Pangolinfo API key and credits
you_get:
  - Structured data on products, rankings and sellers
  - Review themes backed by evidence
  - A comparison of the products you named
  - Source links for each finding
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and use your Pangolinfo API key.
