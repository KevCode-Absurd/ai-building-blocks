thinking: medium
thinking_why: It plans a narrow data request, then reads the results.
new_slug: amazon-market-researcher
name: Amazon market researcher
summary: Research an Amazon product or category with source links. It reads website data through Pangolinfo, a paid service that needs your own key.
job: study-competitors
headline: Amazon market researcher
subhead: "Give it a product, keyword or category on Amazon. It reads live data through the Pangolinfo service and builds a short report. Every point comes with a source link so you can check it."
explain: |
  This skill was written by Pangolinfo, the company that sells the data service it uses, and shared in sickn33's collection. It is not AI Blocks' own work.

  A research report on an Amazon product or category built from live data: search results, rankings, Best Sellers, New Releases, seller catalogues and reviews. Each point comes with the source link so you can check it.

  You set a narrow question, a marketplace and a scope. The skill turns it into read-only data requests through the Pangolinfo service, then compares a small set of named products or pulls out review themes with evidence. It never invents tool names. It only reads data. It cannot place orders, contact sellers or crawl beyond the documented service. Amazon's conditions and Pangolinfo's terms still apply to the data you collect. The service needs your own API key, kept in your tool's secret settings, and it may use plan credits.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to Pangolinfo and sickn33.
when:
  - You are sizing up a product niche before you buy stock.
  - You want to compare a few named competitors on price, rank and reviews.
  - You need review complaints and praise sorted into themes.
  - You want Best Sellers or New Releases data with sources.
not_for:
  - "You want to buy, sell or change anything on Amazon: do it yourself in Seller Central, because this skill only reads data."
  - "You have no clear product, marketplace or goal yet: write down one product or keyword first, then come back."
  - "You want to crawl all of Amazon or get past access limits: use Amazon's own tools or a person who can check the rules."
you_give:
  - A product, keyword, category or short list of named products
  - The Amazon marketplace, such as amazon.com
  - Your research goal
  - A Pangolinfo API key with credits
  - A delivery ZIP code (optional)
you_get:
  - An evidence table with a source link and time for each row
  - A comparison of the products you named
  - Review themes backed by short excerpts
  - A list of missing data and what to query next
how_to_use:
  - Sign up with Pangolinfo and get an API key. Plan credits may be used.
  - Connect the Pangolinfo MCP bridge in your AI tool. Check the setup guide on the official Pangolinfo site first. Pin the package to an exact version in the setup, as the skill file shows, rather than running the newest one. Keep the key in your tool's secret settings, never in chat.
  - Check your plan's credit cost per request before the first run, so you know what a search will use.
  - Open a chat and paste this skill. Ask your AI to list the bridge's tools first, and compare them with the tools named in the skill. If they do not match, stop and check the setup guide before you run anything. Say your product or keyword, marketplace and goal.
  - If your AI cannot list the bridge's tools, or the list comes back empty, stop. The bridge is not connected. Check your key and the setup guide. Do not let your AI guess tool names.
  - Start small, with no more than three products or one page of results on the first run, so credit use stays low and predictable. Widen only after you check the first result.
  - Check that each row matches the product and marketplace you meant. Treat empty fields as gaps.
  - Use the table to plan your next step. Check your margin with the Amazon unit profit checker, or pick search terms with the Amazon keyword picker.
next: [amazon-unit-profit-checker, amazon-keyword-picker]
output_sample:
  input:
    - A product, a keyword, a category or a short list of named products
    - The Amazon marketplace, such as amazon.com
    - Your research goal, such as comparing prices or finding review complaints
    - A delivery ZIP code (optional)
  prerequisites:
    - A Pangolinfo account with an API key and plan credits
    - An AI tool that can connect to an MCP bridge (a link between your AI and a data service)
  output:
    - name: Evidence table
      contains: "One row per target, with these columns in order: input, source link, retrieval time, main fields, missing fields."
    - name: Product comparison
      contains: Price, rating, review count and Best Sellers Rank for each product you named, on the same marketplace.
    - name: Review themes
      contains: Repeated praise and complaints from reviews, with short excerpts and review IDs or links.
    - name: Data gaps
      contains: Empty results, missing fields and failed requests, listed as gaps and not as findings.
    - name: Facts, calculations and opinion
      contains: Returned values kept apart from math on those values and from the AI's own reading.
    - name: Follow-up query
      contains: A suggested next request when the evidence is thin.
