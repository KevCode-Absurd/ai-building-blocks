thinking: medium
thinking_why: Finding real causes takes honest reflection.
new_slug: analysis-lessons-review-writer
name: Analysis lessons review writer
summary: Write a data analysis retrospective in one sitting. Compare the plan to what happened, find root causes, and set actions with owners.
job: track-numbers
headline: Analysis lessons review writer
subhead: A short written review after a data project that records what worked, what slipped and why, and who does what next time. Do it within a week, while the details are fresh.
explain: |
  A short written review after a data project that records what worked, what slipped and why, and who does what next time. Do it within a week, while the details are fresh.

  You set a time box of 30 minutes alone or 60 with a team. Then compare the actual timeline, scope and effort with the plan. List at least two things that went well, because those need repeating. For each problem, ask why five times to find the real cause, not the symptom. Decide where each lesson belongs: a template, a checklist, a reference page or team notes. Actions get owners and dates, and reusable lessons go into a log.
when:
  - You just finished a big analysis and want to learn from it.
  - A project ran late or missed the mark and you need to know why.
  - Your team keeps repeating the same mistakes.
  - You want to turn lessons into templates and checklists.
not_for:
  - "Your project is still running: finish it first, then run the review within a week."
  - "You need to explain one data error that reached a client: write a short incident note with a person who saw it, not a full review."
  - "You only want to record one lesson: add a line to your team notes instead."
you_give:
  - The project name, scope and timeline
  - The original plan or brief
  - Who took part
  - What went wrong or slowed you down (optional)
you_get:
  - A review file with what went well, what went wrong, the root cause of each problem, and action items with owners and dates
  - A learnings log file with short entries, each marked as a template, checklist, reference page or team habit
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text. No code or paid tool is needed.
  - Paste your project name, scope, timeline and original plan.
  - Say who took part. Add what went wrong, if you know.
  - Ask your AI to run the review. Set 30 minutes for one person or 60 for a team.
  - Check each root cause. It should explain the problem, not just repeat it.
  - Give every action an owner and a date. Save the lessons you will reuse in your log.
  - Next, send the actions to their owners and put the review in your team's shared folder. Check progress at your next team review.
output_sample:
  input:
    - Your project name, scope and timeline
    - Your original plan or brief
    - Who took part, alone or as a team
    - What went wrong or slowed you down (optional)
  prerequisites:
    - An AI that can read pasted text or files
  output:
    - name: retrospective_template.md
      contains: What went well, what went wrong, the root cause of each problem, and action items with owners and due dates.
    - name: learnings_log_template.md
      contains: Short entries for lessons worth reusing, each marked for a template, checklist, reference page or team norm.
