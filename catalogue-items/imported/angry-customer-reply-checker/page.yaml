thinking: medium
thinking_why: It tests a draft against the message and your rules.
new_slug: angry-customer-reply-checker
name: Angry customer reply checker
summary: Check your reply to an angry customer before you send it. Paste their message and your draft to catch bad promises and tone, with a fixed draft.
job: help-customers
headline: Angry customer reply checker
subhead: A reply to an upset customer can calm things down or make them worse. Paste the complaint and your draft, and you get a clear list of what works and what will backfire, plus a repaired version you can send.
explain: |
  A reply to an upset customer can calm things down or make them worse. Paste the complaint and your draft, and you get a clear list of what works and what will backfire, plus a repaired version you can send.

  The skill reads your draft as a second pair of eyes. It lists every point the customer raised and marks each as answered, partly answered or missed. It lists every promise you made and checks it against the policy you supplied. It compares facts such as dates and amounts with the original message. It then flags blame, defensive phrases, empty apologies and risky wording, and checks that the reply ends with a next step, who does it and by when.
when:
  - You wrote a reply to a refund demand and want a check before you press send.
  - A customer's message made you angry and you fear your draft sounds sharp.
  - You are not sure you are allowed to promise what you just offered.
  - A new team member drafts replies and you want a safety net.
not_for:
  - "The customer mentions injury, harm, legal action or a regulator: get advice from a lawyer or your insurer before you reply."
  - "You need to decide whether to give a refund: ask the person in your business who approves refunds, then check the reply here."
  - "You have no draft yet and want to start from nothing: write a short first draft yourself, then paste it in."
  - "You have no draft and want a reply written for you: use the Angry customer reply writer."
you_give:
  - The customer's message, in full
  - Your draft reply
  - Your policy or a list of what you can offer
  - Order or case facts (optional)
you_get:
  - Each customer point marked answered or missed
  - Each promise checked against your rules
  - Tone flags with the exact words quoted
  - A repaired draft with a clear next step
how_to_use:
  - Open your AI tool, such as Claude, ChatGPT or Gemini, and paste in the skill instructions.
  - Paste the customer's message in full, then your draft reply.
  - Paste your refund or service policy, or a list of what you can offer. Add order facts if you have them.
  - Read the verdict and the problems first. Check any line marked as needing your decision.
  - Make those decisions, then send the repaired draft. No code, files or paid tools are needed.
output_sample:
  input:
    - The customer's message, pasted in full
    - Your draft reply
    - Your policy or a list of what you can offer (if you have none, promises are marked not checked)
    - Order or case facts, such as dates and amounts (optional)
  output:
    - name: Verdict
      contains: Send as is, send after fixes, or hold and decide first, with the main reason in one line.
    - name: Checks table
      contains: Each point the customer raised, marked answered, partly answered or missed in your draft.
    - name: Problems
      contains: A numbered list, most serious first, with the exact words quoted, why they matter and the fix.
    - name: Repaired draft
      contains: Your draft fixed using only your facts and rules, with open choices marked as decisions for you.
    - name: Needs your decision
      contains: The offers or facts the skill could not confirm from what you gave it.
