thinking: high
thinking_why: Antenna design balances many linked limits.
new_slug: antenna-designer
name: Antenna designer
summary: Design an antenna or array in MATLAB for your frequency and goal. Get the pattern, impedance and return loss checked, plus files for printed boards.
job: build-software
headline: Antenna designer
subhead: Tell it the frequency and what the antenna must do, and you get a working design with its radiation pattern, impedance and fit checked. It can cover a single antenna, a circuit board antenna or a whole array.
explain: |
  Tell it the frequency and what the antenna must do, and you get a working design with its radiation pattern, impedance and fit checked. It can cover a single antenna, a circuit board antenna or a whole array.

  The skill drives MATLAB's Antenna Toolbox, so you need MATLAB with that toolbox. For standard types such as dipoles, patches and horns, it picks a catalogue design and analyses gain, beamwidth and return loss. For odd shapes it builds a custom design from basic shapes. For printed boards it sets up the layers and can export files for manufacture. For arrays it handles beam steering and grating lobes. It can also optimise size for gain or bandwidth.

  Licence: BSD 2-Clause, as the LICENSE.md file says, with one extra condition: you may use it only together with MathWorks products such as MATLAB. The skill file also links MathWorks' own reuse licence. MATLAB and Antenna Toolbox are paid products from MathWorks.
when:
  - You must design a patch antenna for a specific band.
  - You want to see the pattern and return loss before building anything.
  - You need a printed antenna ready for board fabrication files.
  - You are tuning an array to steer a beam.
not_for:
  - "You need reflector antennas, reflectarrays, installed antennas or radar cross section (RCS) work: use the MathWorks skill matlab-analyze-antenna-structures."
  - "You need matching networks, measured antenna data, radio wave propagation or SAR: use the MathWorks skill matlab-integrate-antenna."
  - "You do not have MATLAB with Antenna Toolbox: ask an RF engineer, or use a free antenna simulator."
you_give:
  - Target frequency or band
  - Goals such as gain, bandwidth or size
  - Antenna type, if you have one in mind (optional)
  - Board material (optional)
you_get:
  - A designed antenna or array in MATLAB
  - Pattern, impedance and return loss plots
  - Fabrication files for printed designs (optional)
  - Optimised dimensions
how_to_use:
  - Open an AI that can run MATLAB code. You need MATLAB with Antenna Toolbox installed.
  - Paste the skill text, or upload the skill folder if your AI accepts files.
  - Tell it your frequency and goals. Add the antenna type and board material if you know them.
  - "Check the plots and numbers it returns: return loss, gain and beamwidth."
  - Ask for changes or an optimised version, then ask for Gerber files if you plan to print the board.
  - Before you order a board, have an RF engineer review the pattern, return loss and board layers. Build one test board and measure it before you make more.
output_sample:
  input:
    - Your target frequency or band
    - Your goals, such as gain, bandwidth or size
    - The antenna type you have in mind (optional)
    - Your board material (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with Antenna Toolbox installed
  output:
    - name: Catalog antenna design
      contains: A standard antenna such as a dipole, patch or horn, sized to your frequency, with substrate set first.
    - name: Analysis
      contains: Impedance, return loss, 3D pattern and 2D cuts, with gain and beamwidth reported with units.
    - name: Custom or PCB antenna
      contains: A custom shape or layered board antenna with its feed set, ready to mesh and analyse.
    - name: Array design
      contains: A linear, rectangular, circular or infinite array with beam steering, tapering and coupling checks.
    - name: Gerber files
      contains: Fabrication files for a printed antenna, written when you ask for board output.
    - name: Optimised dimensions
      contains: Antenna sizes tuned for gain, bandwidth or sidelobe level, checked with a full analysis sweep.
