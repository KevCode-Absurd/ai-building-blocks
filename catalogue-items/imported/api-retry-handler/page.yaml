when:
  - Your script gets 429 errors from a payment, AI or code hosting service.
  - Retries sometimes create duplicate orders or messages.
  - A failing service takes your whole app down with it.
  - You need to respect the wait times a service sends.
not_for:
  - "You need to send a payment or order that changes data and the API has no way to stop repeats: ask the API's support or check its docs first, or have a person check each retry."
  - "You run many copies of your app and need one shared limit: use a shared limiter built on a store like Redis, not this single-process code."
  - "Your call hangs and never answers: set a request timeout in your code. Retries only cover errors the API sends back."
you_give:
  - The API you call
  - Your language
  - How costly a repeated call would be
  - Rate limits from its docs (optional)
you_get:
  - Retry and backoff code
  - Rules for which errors to retry
  - Support for wait-time headers
  - Safe handling of repeated actions
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill's instructions.
  - Tell your AI which API you call and which language you use.
  - Say how bad a repeated call would be, for example a second payment or a second email.
  - Add the rate limits from the API docs if you have them (optional).
  - Read the result. Check that actions which change data are not retried without a repeat-safe key.
  - Run and test the code in your own project. Your AI can only run it if it has code tools. The code sets a timeout on each call, so a hung call stops with an error and is not retried. Change the number to fit your API.
  - Wire the retry function into one real API call and log each retry. For long outages, add a circuit breaker (a switch that stops calls for a while). No circuit breaker skill is included here, so ask your AI to write one.
  - Next, build the full connector around it with the API connector builder, or test it with the API test suite builder.
next: [api-rate-limit-adder, api-test-suite-builder]
output_sample:
  input:
    - The API you call
    - Your programming language
    - How costly a repeated call would be
    - Rate limits from the API docs (optional)
  prerequisites:
    - An AI that can run code and read your project files helps, but you can also paste the code into your project yourself
    - The TypeScript code uses the built-in fetch (Node 18 or newer, or a browser). The Python code needs the httpx package
  output:
    - name: Response sorting
      contains: A rule for which errors to stop on and which to retry, such as rate limits, timeouts and server faults.
    - name: Wait time reader
      contains: Code that reads the Retry-After header first, then falls back to growing waits with random jitter.
    - name: Retry loop
      contains: Code that retries up to a set number of times and stops when the total time budget runs out.
    - name: Safe repeat check
      contains: A guard that only retries actions that are safe to repeat, unless the API gives a stable repeat-safe key.
    - name: Request limiter
      contains: A token bucket that holds back your own requests before the API has to say slow down.
    - name: Notes and limits
      contains: Plain notes on what the code does not cover, such as many app copies and hung calls.
