thinking: medium
thinking_why: Retry rules need care to avoid doubled actions.
new_slug: api-retry-handler
name: API retry handler
summary: Get API retry code that waits, backs off and retries when an API says slow down, without sending the same action twice. Name your API and language.
job: build-software
headline: API retry handler
subhead: Code that handles an API saying slow down, without crashing your app or sending the same action twice. Name the API and you get a retry layer that is safe, bounded and easy to read.
explain: |
  Code that handles an API saying slow down, without crashing your app or sending the same action twice. Name the API and you get a retry layer that is safe, bounded and easy to read.

  The skill first sorts each reply. Bad requests and permission errors are final and never retried. Rate limits, timeouts and server faults are retried. Next it reads the delay hints the service sends, such as the Retry-After header or a reset time, before it makes up its own wait. If there is no hint, it uses growing waits with a little random jitter and a hard cap on attempts. It also checks that repeating the action is safe.

