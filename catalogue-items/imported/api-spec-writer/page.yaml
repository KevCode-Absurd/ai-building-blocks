thinking: medium
thinking_why: It asks a few questions, then fills a strict format.
new_slug: api-spec-writer
name: API spec writer
summary: Describe your API or paste your route code. You get a complete OpenAPI or Swagger spec file, ready for docs, SDKs and partners.
job: build-software
headline: API spec writer
subhead: A full, valid OpenAPI or Swagger file for your API, ready to feed your docs and client libraries. Describe the API in words, or paste your route code, and the file is written for you. Details only you know, such as a contact email or server address, are marked and listed so you can fill them in.
explain: |
  A full, valid OpenAPI or Swagger file for your API, ready to feed your docs and client libraries. Describe the API in words, or paste your route code, and the file is written for you. Details only you know, such as a contact email or server address, are marked and listed so you can fill them in.

  The skill asks a few questions first: OpenAPI 3 or Swagger 2, YAML or JSON, what the API does, the endpoints, the sign-in type and the main data shapes. If you paste code from Express, FastAPI, Django or Spring, it reads the endpoints itself and does not ask what you already showed. It then builds the paths, parameters, request and response shapes, security schemes, tags and example servers. A partial spec is merged, not overwritten.

  Licence: CC BY 4.0 applies to this copy, as its LICENSE-CONTENT file says. Reuse it with credit to LambdaTest and sickn33. The author's own file header says MIT, which also allows reuse with credit.
when:
  - You have working endpoints but no documentation file.
  - You need a spec so tools can generate client libraries.
  - A partner asks for your API in OpenAPI format.
  - Your old Swagger 2 file needs to move to version 3.
not_for:
  - "Your framework can already build a spec from code on its own: use that built-in generator instead, so the file stays in step with your code."
  - "Your API is internal and nobody reads or calls it: skip the spec and keep a short note for your team."
  - "You only need a plain-language guide for people, not a machine-readable file: ask a technical writer or write a short README."
you_give:
  - A description of the API, or your route code
  - Output format and spec version
  - Sign-in type
  - A partial spec to extend (optional)
you_get:
  - A complete OpenAPI or Swagger file
  - Endpoints with request and response shapes
  - Security setup
  - Reusable data schemas
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill instructions into a new chat.
  - Describe your API in plain words, or paste your route code. Express, FastAPI, Django, Spring and Rails code all work.
  - "Answer the few questions it asks: spec version, file format, sign-in type and main data shapes. It skips what you already told it."
  - Check the endpoint table at the end against your real API. Fix any wrong path or field name.
  - Save the spec as a .yaml or .json file. This skill needs no code running. To check the file, paste it into a validator such as Spectral.
  - The spec is a draft. Check it against the live API before you send it to partners or publish it.
  - "At the end the skill offers to write API test cases. That offer needs the separate API Test Case Generator skill, which is not in this item. If you say yes without it, your AI will tell you it is missing. Stop after the spec, or use the API test suite builder for tests."
next: [api-test-suite-builder, api-contract-tester]
output_sample:
  input:
    - A plain description of your API, or your route code
    - OpenAPI 3 or Swagger 2, and YAML or JSON
    - The sign-in type your API uses
    - A partial spec to extend (optional)
  output:
    - name: API spec file
      contains: The full OpenAPI or Swagger file in YAML or JSON, with info, servers, tags, paths and no placeholder comments.
    - name: Paths and parameters
      contains: Each endpoint with its path, query and header inputs, request body and a unique operation name.
    - name: Responses
      contains: Success and error replies for each endpoint, with shared error replies reused instead of repeated.
    - name: Schemas
      contains: Reusable data shapes with required fields, formats and an example on each one.
    - name: Security schemes
      contains: Your sign-in method defined once and applied to every endpoint that needs it.
    - name: Summary table
      contains: A short table listing every endpoint the spec now covers.
