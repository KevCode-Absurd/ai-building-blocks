thinking: high
thinking_why: It chains several design methods and needs your input at each phase.
new_slug: app-polish-guide
name: App polish guide
summary: Fix a clunky app that already works. Give your AI the app and its users. You get a phased app UX improvement plan, saved so you can resume later.
job: build-product
headline: App polish guide
subhead: Describe your app, who uses it and where they get stuck. Your AI works through nine phases in order and asks you before each decision. You get a saved plan with fixes in priority order.
explain: |
  A shipped app that works but feels rough, turned into one that fits its job, flows without friction, reads clearly and persuades honestly. You get a step-by-step plan, not a one-off list.

  The skill runs nine phases in a set order: re-anchor on the job the app is hired for, remove friction, polish the look and small moments, sharpen the words, persuade honestly, then finish with a harsh review that cuts what is not needed. It asks you questions at each decision and saves the answers in docs files for customer, design, positioning and plan, so you can stop and resume later. It covers the product experience only. Code, tests and hardening belong to other skills.
when:
  - Your app works but users say it feels clunky.
  - New users get lost in onboarding or on a key screen.
  - Your in-app wording is vague, bossy or unclear.
  - You can't tell which fix to make first.
not_for:
  - "You want code fixes, tests or hardening: use the Legacy code cleanup planner, from the same author, or the tech debt prioritiser."
  - "You have no app yet: build a first version with the Bundled React app builder, then come back when you have users."
  - "You only need to fix one leaking sign-up or checkout flow: use the conversion problem finder."
you_give:
  - A short description of your app, or screenshots of its screens
  - Who uses it and what they use it for
  - Where users get stuck or complain
  - Your docs folder (optional)
you_get:
  - A nine-phase plan for improving your app, in a set order
  - Friction fixes ranked by priority
  - Clearer in-app wording
  - Saved docs files you can pick up again in a later session
  - A final review that cuts what is not needed
how_to_use:
  - Plan for several sessions. The nine phases take more than one sitting, and the first phase (the job your app is hired for) must be confirmed before anything else.
  - Open Claude, ChatGPT or Gemini. Paste the skill, or upload its folder if your AI takes files.
  - Each phase uses its own method skill. If your AI does not have it, the skill offers to install it with "npx skills add" (free). That command downloads third-party code from the author's GitHub collection (wondelai/skills), so look at it before you say yes. If you decline, it runs the phase from its short built-in brief instead and tells you so.
  - Tell your AI about your app, its users and where they get stuck.
  - Answer its questions at each phase. It asks before it decides anything.
  - Check each phase's notes before you move on. The first phase is a gate, so confirm the job your app is hired for.
  - Saving the docs files needs an AI that can write files. In a plain chat, copy each file into your own docs folder.
  - Finish with the review. Then work through the fix list in IMPROVE-APP-PLAN.md from the top, and keep the backlog of tests to run in docs/EXPERIMENTS.md.
output_sample:
  input:
    - A short description of your app, or its screens
    - Who uses it and what job it does for them
    - Where users get stuck or complain
    - Your docs folder (optional)
  prerequisites:
    - An AI that can read and write files in a docs folder, so your plan saves between sessions
  output:
    - name: CUSTOMER.md
      contains: The job your app is hired for and where it falls short, extended with what you decide.
    - name: DESIGN.md
      contains: Friction found, errors to design out, and visual and small-moment fixes you agreed.
    - name: POSITIONING.md
      contains: Your sharpened in-app wording and the honest ways you chose to persuade at decision points.
    - name: IMPROVE-APP-PLAN.md
      contains: The phase-by-phase plan, with fixes in priority order and the status of each phase.
    - name: Final review cuts
      contains: A blunt review at the end that lists what to remove or simplify.
