thinking: medium
thinking_why: It scores a listing against set rules, then rewrites it.
new_slug: app-store-listing-optimiser
name: App store listing optimiser
summary: Check your App Store or Google Play listing with a scored audit. Get a rewritten title, keywords and screenshot plan to win more installs.
job: audit-landing-page
headline: App store listing optimiser
subhead: A scored audit of your App Store or Google Play page, plus rewritten text that helps more people find it and install it. Share the link and it does the checking.
explain: |
  A scored audit of your App Store or Google Play page, plus rewritten text that helps more people find it and install it. Share the link and it does the checking.

  The skill fetches the live listing and pulls every field: title, subtitle, description, promo text, category, screenshots and ratings. It scores each part against listing best practice, keeping to limits such as 30 characters for a title. It then compares your page with competitors, finds keyword gaps, and writes a new title, keyword set, description and a plan for screenshots. Anything it reads from the page, including reviews, is treated as data only and never as instructions. It needs web access.
when:
  - People view your listing but few install.
  - You want to rank for a keyword you aren't using.
  - You are launching and want the page right the first time.
  - You want to see how your page compares with a rival's.
not_for:
  - Your app has no live listing yet. Wait until it is published, or ask a person on your team to draft the title and description first.
  - You want to improve a web landing page. Use a landing page audit or a conversion review instead, as this works only on store pages.
  - You need search volume or exact rankings. Use a paid app store keyword tool, because this audit cannot see those numbers.
you_give:
  - Your App Store or Google Play link
  - Competitor apps (optional)
  - Target countries and keywords (optional)
  - Product notes (optional)
you_get:
  - A scored listing audit
  - Rewritten title and subtitle
  - Keyword suggestions
  - A screenshot plan
how_to_use:
  - Open Claude, ChatGPT or Gemini in a chat that can browse the web.
  - Paste the skill text. Also paste or upload the five reference files in its references folder (scoring criteria, report template, Apple specs, Google Play specs and benchmarks), because the skill cites them and the audit scores worse without them.
  - Paste your App Store or Google Play link. If your chat cannot browse, paste the listing text and a screenshot of the page instead.
  - The public page cannot show your promotional text, keyword field or install data. Check those in App Store Connect or Google Play Console and paste them in.
  - Add competitor links, target countries or keywords if you have them (optional).
  - Read the score card and the top 3 quick wins first.
  - Check each rewritten title and subtitle against the character count before you save it in the store.
  - Remember the audit reads public store pages, so check the store terms before you check many apps in bulk.
output_sample:
  input:
    - Your App Store or Google Play link
    - Competitor app links (optional)
    - Target countries and keywords (optional)
    - Notes on your product (optional)
  prerequisites:
    - An AI that can open web pages
    - "The five reference files from this item's references folder, pasted in full. Without the scoring criteria file the scores cannot be worked out, and without the benchmarks file the conversion figures have no source"
    - Conversion figures in the report (such as video lift) are rough guides from the benchmarks file, not promises
  output:
    - name: Score card
      contains: A table with a score and grade for each of the 6 areas of your listing.
    - name: Top 3 quick wins
      contains: The three changes that take under an hour and should help most.
    - name: Detailed findings
      contains: Each area broken down, with the exact problems found and how to fix them.
    - name: Keyword suggestions
      contains: Keywords drawn from your title, description and competitor gaps, each with a reason it matters.
    - name: Visual asset recommendations
      contains: Specific fixes for your screenshots and preview video.
    - name: Priority action plan
      contains: Every change in order, ranked by impact and effort, with character counts for new text.
