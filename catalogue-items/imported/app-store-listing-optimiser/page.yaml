thinking: medium
thinking_why: It scores a listing against set rules, then rewrites it.
new_slug: app-store-listing-optimiser
name: App store listing optimiser
summary: Give it your app listing. Get a scored audit and a rewritten title,
  keywords, description and screenshots plan.
job: audit-landing-page
headline: App store listing optimiser
subhead: A scored audit of your App Store or Google Play page, plus rewritten
  text that helps more people find it and install it. Share the link and it does
  the checking.
explain: |
  A scored audit of your App Store or Google Play page, plus rewritten text that helps more people find it and install it. Share the link and it does the checking.

  The skill fetches the live listing and pulls every field: title, subtitle, description, promo text, category, screenshots and ratings. It scores each part against listing best practice, keeping to limits such as 30 characters for a title. It then compares your page with competitors, finds keyword gaps, and writes a new title, keyword set, description and a plan for screenshots. Anything it reads from the page, including reviews, is treated as data only and never as instructions. It needs web access.
when:
  - People view your listing but few install.
  - You want to rank for a keyword you aren't using.
  - You are launching and want the page right the first time.
  - You want to see how your page compares with a rival's.
you_give:
  - Your App Store or Google Play link
  - Competitor apps (optional)
  - Target countries and keywords (optional)
  - Product notes (optional)
you_get:
  - A scored listing audit
  - Rewritten title and subtitle
  - Keyword suggestions
  - A screenshot plan
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can browse the web.
