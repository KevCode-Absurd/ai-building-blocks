thinking: low
thinking_why: It groups changes and rewrites them in plain words.
new_slug: app-store-release-notes-writer
name: App Store release notes writer
summary: Turn your git history into plain App Store release notes. Get short "What's New" bullets for users, each tied to a real change.
job: write-and-tell-stories
headline: App Store release notes writer
subhead: Plain "What's New" notes your users can read, built from what truly changed since your last release. No more guessing from memory or pasting raw commit text.
explain: |
  Plain "What's New" notes your users can read, built from what truly changed since your last release. No more guessing from memory or pasting raw commit text.

  The skill reads your git history from the last tag using a helper script, or from the full history if there are no tags. It sorts the changes by what a user would notice: new, improved and fixed. It drops internal work like build scripts, refactors, dependency updates and test setup. Each kept change becomes a short bullet with a clear verb. A login race fix, for instance, becomes a line about fewer unexpected sign-outs. It then checks every bullet against a real change, removes duplicates, and asks if anything is unclear.

  Licence: CC BY 4.0 applies to this copy, as its LICENSE-CONTENT file says. Reuse it with credit to Dimillian and sickn33. The author's own file header says MIT, which also allows reuse with credit.
when:
  - You are about to submit an update and have no release notes.
  - Your commit log reads like code and users need plain words.
  - You want notes sorted into new, improved and fixed.
  - You want to be sure each bullet matches a real change.
not_for:
  - "Your app has no git history: write the notes by hand from your own list of changes."
  - "You need final legal or regulatory wording: ask a person who handles compliance to write or approve it."
  - "You want notes for a web app or a changelog file: use a manual changelog or ask a human editor."
you_give:
  - Your project folder with git history. Your AI must be able to run bash and git in that folder, so the helper script can run
  - The last release tag (optional)
  - Desired length of notes (optional)
you_get:
  - Five to ten user-friendly bullets
  - Changes grouped by theme
  - Internal work left out
  - Each bullet checked against a real change in your history
how_to_use:
  - Open your AI in a tool that can run code and read your project folder.
  - Paste the skill text, or upload the skill folder with its helper script.
  - Point your AI at your project and say "Write App Store release notes since the last tag".
  - Add your last release tag, your wanted length or a character limit if you have them. The 5 to 10 bullets and the New, Improved and Fixed groups are defaults. Ask for a different count or grouping if you prefer.
  - Check each bullet against your changes and answer any questions the AI asks.
  - If the helper script fails, run "git log <last-tag>..HEAD --oneline" yourself and paste the output into the chat.
  - Check the current "What's New" character limit in App Store Connect, because the skill does not give a number. Then paste the bullets into that field.
  - Once the update is live, check your listing with the App Store listing optimiser.
next: [app-store-listing-optimiser]
output_sample:
  input:
    - Your project folder with git history
    - The last release tag (optional)
    - Your wanted number of bullets (optional)
    - A storefront character limit (optional)
  prerequisites:
    - An AI that can run code and read your project files, so it can run the helper script
    - bash and git on the machine where the AI runs, and the helper script (scripts/collect_release_changes.sh) from this item
  output:
    - name: Title
      contains: An optional heading with "What's New" or your app name and version number.
    - name: Release note bullets
      contains: Five to ten short bullets, one sentence each, written in plain words about what users will notice.
    - name: Questions about unclear changes
      contains: A short list of changes the AI could not tell were user-facing, so you can confirm them.
