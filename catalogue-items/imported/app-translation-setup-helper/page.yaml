thinking: medium
thinking_why: It scans code for text and applies standard patterns.
new_slug: app-translation-setup-helper
name: App translation setup helper
summary: Find the hardcoded text in your app and set it up for translation. Get a table of strings, locale files per language and a right-to-left checklist.
job: build-websites
headline: App translation setup helper
subhead: Point it at your React, Next.js, Vue or Python app and say which languages you want. It finds text typed straight into screens, proposes a key for each, and sets up a locale folder per language. It does not translate the text.
explain: |
  This is an app translation setup helper, sometimes called i18n setup. Before anyone can translate your app, its text must live in files, not inside the code. This skill does that move.

  It scans your project for hardcoded text and lists each string with its file, line and a proposed key. It sets up one folder per language, with files split by feature such as common, auth and errors. It shows the right code pattern for your framework and one before and after you can check.

  It also covers plural forms, dates and numbers, text that grows longer in some languages, and the changes right-to-left languages like Arabic and Hebrew need. It leaves the translated values blank. For the translation itself, use the Translator.
when:
  - You plan to launch your app in new countries and its text is typed into the screens.
  - A translator asks you for files they can edit, and you have none.
  - You need Arabic or Hebrew support and do not know what changes in the layout.
  - You added a language and some screens still show English.
not_for:
  - "Your app will only ever use one language: you do not need this yet."
  - "You want the text translated: use the Translator, or the Article translator for long pieces."
  - "You want finished translations checked for changed numbers or names: use Check translation parity across three languages."
you_give:
  - Your project folder
  - The languages you want, such as English plus Turkish and Arabic
  - Your framework, if your AI cannot tell (optional)
  - Existing translation files (optional)
you_get:
  - A table of hardcoded strings with file, line and a proposed key
  - A locale folder layout, one folder per language
  - Code for your framework, with one before and after
  - A right-to-left checklist when it applies
  - A next step and a list of strings it was unsure about
how_to_use:
  - Use an AI that can read and edit your project files, such as Claude Code or Codex. Add this skill with its checker script.
  - Tell it your languages and framework. If your AI can run Python, ask it to run the checker script first.
  - Read the table of strings. Remove anything that is not text a user sees.
  - Check the one before and after. Ask your AI to apply the change to one screen, then to the rest.
  - Send the locale files to a translator, or to the Translator, to fill in the blank values. Have a native speaker check right-to-left layouts.
output_sample:
  input:
    - Your project folder
    - The languages you want to support
    - Your framework (optional)
    - Existing translation files (optional)
  prerequisites:
    - An AI that can read and edit your files
    - Python 3 to run the checker script (optional)
  output:
    - name: Hardcoded strings table
      contains: Each string with its file, line, proposed key and the file the key goes in.
    - name: Locale file structure
      contains: One folder per language, with files split by feature such as common, auth and errors.
    - name: Before and after
      contains: One component changed from typed text to a translation key, with its locale entries.
    - name: Right-to-left checklist
      contains: Which styles and icons to change for Arabic or Hebrew, by file.
    - name: Next line
      contains: What to do first, and the strings it was unsure about.
works_best_with: Claude Code or Codex with your project open, because they can run the checker and edit files. Send the result to the Translator for the actual translations.
terms:
  i18n: Short for internationalization. Making an app ready to be translated.
  locale: A language plus a region, such as en-US or tr-TR.
  translation key: A short name in the code, such as common.save, that points to the text in a language file.
  right-to-left: Languages such as Arabic and Hebrew that read from the right, so layouts must flip.
