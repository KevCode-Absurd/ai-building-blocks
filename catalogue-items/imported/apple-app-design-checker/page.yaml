thinking: medium
thinking_why: It compares your design against a set of known rules.
new_slug: apple-app-design-checker
name: Apple app design checker
summary: Check your iPhone, iPad or Mac app design against Apple's design rules. Get a list of fixes for color, type, icons and accessibility.
job: design-work
headline: Apple app design checker
subhead: A list of what to fix so your iPhone, iPad or Mac app design matches Apple's own design rules. Show it a design and you get findings tied to the principle behind each one.
explain: |
  A list of what to fix so your iPhone, iPad or Mac app design matches Apple's own design rules. Show it a design and you get findings tied to the principle behind each one.

  The skill checks your design against Apple's Human Interface Guidelines foundations. It looks at whether content leads over decoration, whether system colours and fonts are used, and whether the design works with VoiceOver, large text and reduced motion. It reviews icons, branding, colour contrast, privacy prompts, motion and right-to-left support. It starts by reading any design notes you keep, so it asks only what is missing. Detailed topic files back each point, such as accessibility, colour and app icons.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. Credit goes to Raintree Technology and sickn33.
when:
  - You are designing a first iPhone app and want to avoid rejection.
  - Your app feels off compared with Apple's own apps.
  - You need to check accessibility before release.
  - You are bringing an Android design over to iOS.
not_for:
  - "You are designing an Android or web app: use a checker made for that platform, or ask a designer who knows it."
  - "You need proof your app is accessible: test it with VoiceOver and large text on a real device, or hire a tester who uses assistive tech."
  - "You want to know if Apple will approve your app: read App Store Review Guidelines or submit a build to TestFlight."
you_give:
  - Screenshots or a description of your design. Findings cite a guideline file only if you paste or upload those files. Otherwise your AI should say the finding comes from general knowledge
  - Target device and OS
  - Design notes (optional)
  - Your app's main purpose
you_get:
  - Findings grouped by principle
  - Fixes for colour, type and icons
  - Accessibility gaps
  - Privacy and permission notes
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat. No code running or paid tool is needed.
  - The skill has 18 reference files on topics such as accessibility and colour. Pasting the skill text does not include them. Without them, findings come from general knowledge. Paste the files you want checked, or upload the whole folder.
  - Add screenshots of your design, or describe each screen in a few lines.
  - Say which device and system version you are building for, and what the app is for.
  - Add your brand rules or design notes if you have them (optional).
  - Read the findings and fix the ones tied to accessibility and privacy first.
  - Test the fixed design on a real device with VoiceOver and large text turned on.
output_sample:
  input:
    - Screenshots or a short description of your design
    - The device and system you are building for
    - Your design notes or brand rules (optional)
    - What your app is for
  output:
    - name: Findings by principle
      contains: Each problem is tied to one of Apple's design principles, such as content first, accessibility or privacy.
    - name: Reference file and section
      contains: Each finding names the guideline file it comes from, such as accessibility.md or color.md, when you gave your AI those files. Without them it says the finding is from general knowledge.
    - name: Fixes for color, type and icons
      contains: Plain changes for system colors, text styles, SF Symbols and app icon problems.
    - name: Accessibility impact
      contains: What a problem means for contrast, large text and VoiceOver users.
    - name: Platform differences
      contains: Notes on where advice changes between iPhone, iPad and Mac.
    - name: Code patterns
      contains: Short SwiftUI, UIKit or AppKit examples for the fixes, where they help.
