thinking: medium
thinking_why: It checks a design against many written rules.
new_slug: apple-interface-reviewer
name: Apple interface reviewer
summary: Check your iOS or Mac screen against Apple's design rules, with contrast and tap target checks, a score and a fix list for Liquid Glass too.
job: design-work
headline: Apple interface reviewer
subhead: An audit of your iOS, macOS, watchOS or visionOS screen against Apple's design guidelines, including the newer Liquid Glass look. You get a scored report with measured fixes.
explain: |
  An audit of your iOS, macOS, watchOS or visionOS screen against Apple's design guidelines, including the newer Liquid Glass look. You get a scored report with measured fixes.

  You describe or share the screen and say which platform it is for. The skill then uses a small script to measure what can be measured. It checks text contrast against the 4.5 to 1 target, flags tap targets below 44 by 44 points, and scores a batch of elements from 100, dropping ten for each violation. It fills a standard audit template, and can design from scratch by choosing the platform's navigation pattern first, then type and system colour. It also asks whether text stays readable on glass surfaces.
when:
  - You want to know if your text is readable on a glass background.
  - A reviewer says your tap targets are too small.
  - You are starting a new Apple app and want the right layout.
  - You need a score and a list to hand to a developer.
not_for:
  - "You design web pages or Android apps: use a web or Material Design checklist, since Apple's rules do not apply there."
  - "You want reusable colour and spacing tokens: use the design system file writer, which builds component systems, not Apple rule checks."
  - "You need to test real users or build personas: talk to a few real users instead."
you_give:
  - A screen image, mockup or description
  - The target platform
  - The app category
  - Colour values and sizes (optional)
you_get:
  - A scored audit report
  - Contrast and tap target measurements
  - Platform-specific layout advice
  - A prioritised fix list
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. Use an AI that can run Python 3 if you want the exact score.
  - Say which platform the screen is for and your app category. Share the screen as an image, or describe it.
  - Add text colours, background colours and button sizes if you know them. Name each element.
  - "For the score, ask your AI to save them as audit.json and run: python3 scripts/hig_checker.py batch audit.json. Upload the skill folder so the script is there."
  - If your AI cannot run code, ask it to work the contrast and size checks by hand. It will tag those as less certain.
  - Read the bottom line first. Fix the red items, then test any glass surfaces on a real device.
output_sample:
  input:
    - A screen image, mockup or written description
    - "Your target platform: iOS, macOS, watchOS or visionOS"
    - Your app category, such as utility, productivity or game
    - Text and background colours, and button sizes (optional)
  prerequisites:
    - Python 3, only if you want the exact score from the check script
    - An AI that can run code and read files, for the script run (otherwise it works by hand)
  output:
    - name: Bottom line
      contains: One line on compliance status and the score out of 100, with how many fixes you need before release.
    - name: Contrast check
      contains: The measured contrast ratio for each text colour pair, tested against the 4.5 to 1 target for normal text.
    - name: Tap target check
      contains: The size of each button or control, tested against the 44 by 44 point minimum.
    - name: HIG audit report
      contains: The filled audit template, with manual checks such as VoiceOver labels, Dynamic Type and Reduce Transparency.
    - name: Fix list
      contains: Each fix with what to change, why it fails, and how to do it, tagged by how sure the check is.
    - name: Liquid Glass check
      contains: Whether text stays readable on glass surfaces, and what to test on a real device.
