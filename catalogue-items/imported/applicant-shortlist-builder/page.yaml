thinking: high
thinking_why: It must score fairly and back every score with evidence.
new_slug: applicant-shortlist-builder
name: Applicant shortlist builder
summary: Build a fair applicant shortlist from your job post and resumes. Get candidates ranked on the job's needs, with evidence and reply drafts.
job: hire-people
headline: Applicant shortlist builder
subhead: A ranked shortlist of the people worth calling, scored only on what the job needs, with reply drafts ready. It turns a full inbox of applications into a short list you can act on today.
explain: |
  A ranked shortlist of the people worth calling, scored only on what the job needs, with reply drafts ready. It turns a full inbox of applications into a short list you can act on today.

  This is Anthropic's hiring-screener skill under the Apache 2.0 licence, used without changes to its method. It will not score anyone until there is a rubric, which is the list of skills and experience in the job post. If you have no rubric, it builds one with you first. Each candidate is scored only against those points. Name, age, gender, photo, address, school prestige, gaps and resume looks are never used. It reads applications from your hiring inbox or uploaded files, pulls out only evidence that matters for the role, ranks people, and drafts replies and interview scheduling.
when:
  - Fifty applications arrived and you have an hour.
  - You want your hiring choices to be fair and easy to explain.
  - The best field worker has the worst-formatted resume.
  - You need polite replies to people you won't interview.
not_for:
  - Your job post has no stated needs yet. Write the post and rubric first with the Job post builder, or list the must-have skills yourself.
  - You need to judge who to hire on gut feel or culture fit. This tool only scores the written job needs, and you make the final choice.
  - You only need one email to a single applicant. Write it by hand, or ask your AI for one plain reply.
you_give:
  - The job post or a rubric
  - Resumes or access to the hiring inbox
  - How many people you want on the shortlist
  - Tone for replies (optional)
you_get:
  - A rubric if you lack one
  - A ranked shortlist with evidence
  - Fairness notes on what was ignored
  - Draft replies and interview invites
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste your job post. If you have no rubric, answer the questions as your AI builds one with you.
  - Upload the resumes, or connect your hiring inbox if your AI can read it.
  - Check the ranked shortlist and the quoted evidence. Look at the cannot assess group before you reject anyone.
  - Read the draft replies. Say yes before anything is sent, or copy them and send them yourself.
  - AI ranking of job applicants is regulated in some places, such as New York City's rules on automated hiring tools and the EU's AI rules for hiring. These can need a bias audit, a notice to applicants or a human review. Check the rules where you hire before you rely on a shortlist.
  - Hiring rules differ by country and state. Keep your own record of why each person was ranked, and have an HR adviser check your process if you are unsure.
  - Optional tools like Gmail, Calendar, Gusto, DocuSign and Trello need your own account. The skill works without them.
  - Next, rework a thin job post with the Job post writer, or check an offer letter or contract with the Contract reviewer.
next: [job-post-writer, contract-reviewer]
output_sample:
  input:
    - Your job post or a rubric (the list of skills and experience the job needs)
    - Resumes as files, or access to your hiring inbox
    - How many people you want on the shortlist
    - The tone you want for replies (optional)
  prerequisites:
    - Gmail and Google Calendar are optional, and need your own accounts
    - Gusto, DocuSign and Trello are optional, and need your own accounts, maybe a paid plan
    - Without them, upload resumes and send the drafted replies by hand
  output:
    - name: Rubric
      contains: The skills and experience from your job post, with a weight for each, built with you if you have none.
    - name: Ranked shortlist
      contains: Each candidate scored on each rubric point, with a quoted line from their resume behind every score.
    - name: Bands
      contains: Candidates sorted into interview, maybe, no, and cannot assess, with a note where a missing fact lowered a score.
    - name: Fairness notes
      contains: What was ignored on purpose, such as name, age, photo, address, school and resume looks.
    - name: Draft replies
      contains: An interview invite, a hold note and a decline for each candidate, listed by name. Nothing sends without your yes.
    - name: Interview schedule
      contains: Two or three open times per candidate, shown for your approval before any invite goes out.
    - name: Onboarding checklist
      contains: Paperwork, access, equipment, first-week plan and a 30-day check-in for the person you hire.
