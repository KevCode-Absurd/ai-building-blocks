thinking: low
thinking_why: It follows a short connect routine.
new_slug: arduino-connector
name: Arduino connector
summary: Connect your Arduino board to MATLAB over USB. Find the board, pick the port and get a working connection, with you in charge of each step.
job: build-software
headline: Arduino connector
subhead: Your Arduino board found, set up and connected to MATLAB, with you kept in the loop at every step. You plug it in and the skill handles the checking.
explain: |
  Your Arduino board found, set up and connected to MATLAB, with you kept in the loop at every step. You plug it in and the skill handles the checking.

  It always runs two commands to find boards: arduinolist and serialportlist. Both are required, because the first can miss boards that lack the support package firmware. It shows you both results. If nothing turns up, it will not try every port. It asks you whether the board is plugged in, then guides you through your operating system's tools to find it. It never guesses a port or board type. It covers USB connections only, and not Bluetooth, wifi or Simulink workflows.
when:
  - You want to read sensors from an Arduino inside MATLAB.
  - MATLAB doesn't list your board and you don't know why.
  - You have several boards and need the right port.
  - You are starting a hardware project and need a working connection.
not_for:
  - "You need Bluetooth or wifi links, or Simulink hardware tests: this skill covers USB only, so use the MathWorks help pages for those."
  - "Your Arduino IDE or MATLAB support package is not installed yet: install it first with MathWorks' own install steps, then come back."
  - "You want a custom library for a part MATLAB does not support: that needs a custom library step, not this connection check."
you_give:
  - An Arduino connected by USB
  - MATLAB with the Arduino support package
  - Board model (optional)
you_get:
  - A list of boards and ports found
  - The right board and port chosen
  - A working arduino object in MATLAB
  - Clear steps if no board is found
how_to_use:
  - Plug your Arduino into your computer with a USB cable that carries data.
  - Open an AI that can run MATLAB commands. Paste in this skill, or add its folder if your AI takes files.
  - "Tell your AI what you want, for example: connect my Arduino, or read a sensor."
  - Check the board and port lists it shows you. Tell it which port to use.
  - Confirm the libraries it suggests, or ask for more.
  - Read the connection message. Then move on to your task, such as blinking an LED or reading a sensor.
  - To reconnect later, clear the arduino object first. For a sensor MATLAB does not support, pair this with the Arduino sensor library builder.
output_sample:
  input:
    - An Arduino board plugged in by USB
    - Which port or board you want to use (optional)
    - The task you want to do next, like reading a sensor (optional)
  prerequisites:
    - An AI that can run MATLAB commands
    - MATLAB with the Arduino support package installed
    - A USB cable that carries data, not just power
    - MATLAB is a paid MathWorks product, so you need a licence for it
    - Use it only with MathWorks products such as MATLAB, as the licence says (BSD 2-Clause plus MathWorks reuse terms)
  output:
    - name: Board and port lists
      contains: The results of arduinolist and serialportlist, shown to you side by side.
    - name: No board found help
      contains: Questions and checks for your operating system if nothing shows up, then it waits for your reply.
    - name: Port and board choice
      contains: A question asking you which port to use and, if you know it, the board type.
    - name: Library list
      contains: The default libraries plus any extra ones the skill picked from your request, with the reason.
    - name: arduino connection call
      contains: The arduino call built from your port, board and libraries, run once.
    - name: Connection confirmation
      contains: A one-line message naming the board, port and libraries, or the exact error with one or two fixes.
