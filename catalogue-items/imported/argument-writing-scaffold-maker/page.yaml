thinking: low
thinking_why: It fills a known frame with your topic.
new_slug: argument-writing-scaffold-maker
name: Argument writing scaffold maker
summary: Make an argument writing scaffold for any claim or question. Pick Toulmin, PEEL or CER and get prompts, sentence starters and a model answer.
job: teach-and-train
headline: Argument writing scaffold maker
subhead: A fill-in frame that helps a learner build an argument from a claim or question. Pick the framework and you get labelled sections, guiding prompts, sentence starters and a worked model.
explain: |
  A fill-in frame that helps a learner build an argument from a claim or question. Pick the framework and you get labelled sections, guiding prompts, sentence starters and a worked model.

  The skill uses three common frames. Toulmin names the claim, evidence, reasoning, backing, limits and a reply to opposing views. PEEL gives point, evidence, explain and link for paragraphs. CER is claim, evidence and reasoning, popular in science. It adjusts for the learner's level and subject, because a historical argument is built differently from a science one or a literary one. Weaker writers get more support and stronger writers get less. Teachers can make one in about three minutes.
when:
  - Your class writes opinion paragraphs that state a view with no proof.
  - You teach science and need claim, evidence and reasoning sheets.
  - A student cannot start an essay and needs a frame to fill in.
  - You need a model answer to show how the frame works.
not_for:
  - "You need a research paper built on primary sources: use a full writing guide or ask your subject teacher."
  - "You want to mark finished drafts: give feedback by hand, since this makes frames, not marks."
  - "You want a story, poem or other non-argument text: use a plain lesson plan for that genre."
you_give:
  - A claim or question
  - Subject and year level
  - Preferred framework, or let it choose
  - Sample student writing (optional)
you_get:
  - A labelled scaffold with prompts
  - Sentence starters for each part
  - An annotated model answer
  - Adjusted support for the level
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the prompt from the skill file. No code or paid tool is needed.
  - Type your claim or question, the year group and how well they write, and the frame you want.
  - Add the subject and any sources students can use (optional).
  - Read the scaffold and the model answer. Check any evidence it gives, since your AI can get facts wrong. If you gave no sources, replace any sample evidence with real, checked sources before you hand anything out.
  - Fix anything that does not fit your class, then hand it out.
  - After class, use the Differentiation section to adjust the frame for weaker and stronger writers, and check the finished drafts with the written feedback checker.
output_sample:
  input:
    - The claim or question your students will argue
    - Year group and how well they write now
    - "The frame to use: Toulmin, PEEL, CER, historical or balanced"
    - Subject area (optional)
    - Evidence or sources students can use (optional)
  output:
    - name: The Scaffold
      contains: Labelled sections for your chosen frame, with a prompt and sentence starters for each part.
    - name: Annotated Model
      contains: A short model argument with notes showing what each part does.
    - name: Common Weaknesses at This Level
      contains: The usual mistakes learners make at this level and what to say about them.
    - name: Differentiation
      contains: Ways to give weaker writers more help and stronger writers less.
