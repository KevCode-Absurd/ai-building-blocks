new_slug: argument-writing-scaffold-maker
name: Argument writing scaffold maker
summary: Give it a claim or question. Get a fill-in frame using Toulmin, PEEL or
  CER that helps learners build an argument.
job: teach-and-train
headline: Argument writing scaffold maker
subhead: A fill-in frame that helps a learner build an argument from a claim or
  question. Pick the framework and you get labelled sections, guiding prompts,
  sentence starters and a worked model.
explain: |
  A fill-in frame that helps a learner build an argument from a claim or question. Pick the framework and you get labelled sections, guiding prompts, sentence starters and a worked model.

  The skill uses three common frames. Toulmin names the claim, evidence, reasoning, backing, limits and a reply to opposing views. PEEL gives point, evidence, explain and link for paragraphs. CER is claim, evidence and reasoning, popular in science. It adjusts for the learner's level and subject, because a historical argument is built differently from a science one or a literary one. Weaker writers get more support and stronger writers get less. Teachers can make one in about three minutes.
when:
  - Your class writes opinion paragraphs that state a view with no proof.
  - You teach science and need claim, evidence, reasoning sheets.
  - A student struggles to start an essay.
  - You need a model answer to show how the frame works.
you_give:
  - A claim or question
  - Subject and year level
  - Preferred framework, or let it choose
  - Sample student writing (optional)
you_get:
  - A labelled scaffold with prompts
  - Sentence starters for each part
  - An annotated model answer
  - Adjusted support for the level
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
