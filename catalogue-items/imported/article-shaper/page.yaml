thinking: medium
thinking_why: It builds a draft in steps and checks each one.
new_slug: article-shaper
name: Article shaper
summary: Turn a messy pile of notes into an article, one paragraph at a time. Pick your opening, and your AI builds the rest with you.
job: write-and-tell-stories
headline: Article shaper
subhead: A finished article built one paragraph at a time from a messy pile of notes, quotes and half ideas. You stay in charge of the angle, and the AI does the sorting and drafting.
explain: |
  A finished article built one paragraph at a time from a messy pile of notes, quotes and half ideas. You stay in charge of the angle, and the AI does the sorting and drafting.

  It starts by reading everything and asking what your reader already knows. Then it offers two or three different openings, each pointing to a different main idea, and you pick one. From there it asks what the reader needs to hear next, pulls the matching material from your pile, and adds each agreed paragraph to the file straight away. It also checks that no idea is used before the reader has met it.
when:
  - You have a folder of notes and no idea how to turn them into one piece.
  - You get stuck at the first sentence and need options to react to.
  - You want an article that sounds like a conversation, not a lecture.
  - You keep writing paragraphs that rely on terms you never explained.
not_for:
  - "You need a short post or a quick caption: write it yourself or ask your AI for one draft in a single go."
  - "You already have a finished draft that only needs edits: ask your AI for a plain edit or proofread instead."
  - "You have no notes yet and need ideas first: talk the topic through with your AI or a colleague, then come back."
you_give:
  - A file of raw notes, quotes or fragments
  - A description of who will read it
  - Where to save the article (optional)
you_get:
  - Two or three candidate openings
  - An article file that grows paragraph by paragraph
  - A check that each idea is explained before it is used
  - Leftover material you did not need
how_to_use:
  - Put your raw notes in one markdown or text file. Messy is fine. A transcript works too. An AI that can open files makes this easiest. Otherwise you paste the notes in.
  - Open your AI and paste in the skill text. If your AI cannot read files, paste your notes into the chat.
  - Tell it who will read the article and where to save it.
  - Say what your reader already knows. Then pick one of the openings it offers, or mix them.
  - Approve each paragraph in turn. Push back when a paragraph does not earn its place.
  - Say when the article is done. Your notes file stays unchanged.
  - Then edit the draft with a plain proofread, and format it for where it will be published.
output_sample:
  input:
    - A file of raw notes, quotes or fragments
    - A short description of who will read the article
    - Where to save the article (optional)
  prerequisites:
    - An AI that can read and write files, or a chat where you paste your notes and copy each paragraph out
  output:
    - name: Prerequisites list
      contains: What your reader already knows, agreed with you before any writing starts.
    - name: Candidate openings
      contains: Two or three openings, each pointing to a different main idea, for you to pick or mix.
    - name: Article file
      contains: The article itself, with each agreed paragraph or block added as soon as you approve it.
    - name: Grounding check
      contains: A running list of ideas the reader has met, so no paragraph leans on an idea not yet explained.
    - name: Gap notes
      contains: Places where your notes lack an example or fact, so you can add one or cut the section.
next: [article-formatter, article-beat-planner]
