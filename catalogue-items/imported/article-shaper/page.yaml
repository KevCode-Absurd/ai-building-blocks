thinking: medium
thinking_why: It builds a draft in steps and checks each one.
new_slug: article-shaper
name: Article shaper
summary: Give it raw material. Get it shaped into an article, paragraph by paragraph.
job: write-and-tell-stories
headline: Article shaper
subhead: A finished article built one paragraph at a time from a messy pile of
  notes, quotes and half ideas. You stay in charge of the angle, and the AI does
  the sorting and drafting.
explain: |
  A finished article built one paragraph at a time from a messy pile of notes, quotes and half ideas. You stay in charge of the angle, and the AI does the sorting and drafting.

  It starts by reading everything and asking what your reader already knows. Then it offers two or three different openings, each pointing to a different main idea, and you pick one. From there it asks what the reader needs to hear next, pulls the matching material from your pile, and adds each agreed paragraph to the file straight away. It also checks that no idea is used before the reader has met it.
when:
  - You have a folder of notes and no idea how to turn them into one piece.
  - You get stuck at the first sentence and need options to react to.
  - You want an article that sounds like a conversation, not a lecture.
  - You keep writing paragraphs that rely on terms you never explained.
you_give:
  - A file of raw notes, quotes or fragments
  - A description of who will read it
  - Where to save the article (optional)
you_get:
  - Two or three candidate openings
  - An article file that grows paragraph by paragraph
  - A check that each idea is explained before it is used
  - Leftover material you did not need
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
