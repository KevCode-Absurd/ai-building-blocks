new_slug: asp-net-web-app-builder
name: ASP.NET web app builder
summary: Describe the web app or API. Get ASP.NET Core code that follows current
  official guidance.
job: build-websites
headline: ASP.NET web app builder
subhead: "ASP.NET Core code that matches what Microsoft recommends now, not what
  old tutorials show. Tell the AI what you are building and it first picks the
  right style: Blazor, Razor Pages, MVC, a minimal API or controller-based API."
explain: |
  ASP.NET Core code that matches what Microsoft recommends now, not what old tutorials show. Tell the AI what you are building and it first picks the right style: Blazor, Razor Pages, MVC, a minimal API or controller-based API.

  It then checks your .NET version and loads only the guidance that fits the job, so the answer isn't cluttered. It covers how the app starts, the request pipeline, dependency injection, settings, login and permissions, live updates with SignalR, gRPC, background work, testing and speed. You can use it to start a new app, review one, or refactor an old one. You need the .NET SDK to run the result.
when:
  - You are starting a new .NET web app and can't decide between Blazor, MVC and
    Razor Pages.
  - Your Program.cs has grown messy and you want it cleaned up.
  - You need login and role checks added to an existing API.
  - You want a code review of an ASP.NET project against current guidance.
you_give:
  - A description of the app or API
  - Your .NET version and current project files (optional)
  - Login, data and hosting needs
you_get:
  - A recommended app style with reasons
  - ASP.NET Core code for the feature
  - A clean startup and pipeline setup
  - Notes on tests, speed and security
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read your project files.
