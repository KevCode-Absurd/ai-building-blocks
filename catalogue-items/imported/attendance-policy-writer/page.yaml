thinking: medium
thinking_why: Rules must be clear and match local law.
new_slug: attendance-policy-writer
name: Attendance policy writer
summary: Write an attendance policy for your team. Give it your shifts and country. You get lateness, overtime and absence rules to review.
job: hire-people
headline: Attendance policy writer
subhead: Give it your shifts and country. Get clear lateness, overtime and absence rules to review. Not legal advice. Bring shift patterns and industry. Use the result to plan your next step.
explain: |
  A draft attendance policy in plain words that managers can follow and staff can understand. Describe your shifts, your country and your industry, and the AI writes rules for clocking in, lateness, breaks, overtime, absences and no-call, no-show cases.

  It can also design how overtime is worked out and approved, set time-tracking system rules such as rounding and buddy-punch prevention, build a points system for repeated lateness, and write the message announcing the change. It points out common mistakes, like rules that clash with local labour law. This is a draft for review, not legal advice, so have an expert check it.
when:
  - Staff keep arriving late and you have no written rule to point to.
  - You are setting up a time clock and need rounding and overtime settings.
  - Your overtime pay is disputed because the rule is vague.
  - You need a short note telling staff about a policy change.
not_for:
  - "You need legal sign-off on the final rules: take the draft to an employment lawyer or HR adviser in your country."
  - "You want to fix payroll errors in past pay runs: ask your payroll provider or accountant to check those records."
  - "You need a policy for performance or conduct problems: write that with your HR adviser, not as an attendance rule."
you_give:
  - Shift patterns and industry
  - Country or region
  - Current pain points, such as lateness or overtime
  - Time system you use (optional)
you_get:
  - A draft attendance policy
  - Overtime and approval rules
  - Time-tracking system settings
  - A staff announcement and a manager guide
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Describe your shifts, your industry and your country or region.
  - Say what hurts most, such as lateness, overtime disputes or no-shows.
  - Ask for the policy first. Then ask for overtime rules, time clock settings, the staff message and the manager guide.
  - Check the draft against your local labour law. Have a lawyer or HR adviser review it before you share it.
output_sample:
  input:
    - Your shift patterns and industry
    - Your country or region
    - Your main problems, such as lateness or overtime
    - The time clock or system you use (optional)
  output:
    - name: Attendance policy draft
      contains: Plain rules for clocking in, lateness, breaks, absences and no-call, no-show cases.
    - name: Overtime rules
      contains: How overtime is worked out and who approves it, matched to your country's labour rules.
    - name: Time-tracking settings
      contains: Suggested rules for rounding, buddy-punch prevention and approving timesheet edits.
    - name: Points system
      contains: A way to track repeated lateness, with clear steps as the count grows.
    - name: Staff announcement
      contains: A short message telling your team what is changing and when.
    - name: Manager guide
      contains: Steps for handling exceptions and talking to someone about lateness.
