thinking: high
thinking_why: Tools disagree, so it must weigh messy data.
new_slug: attribution-model-chooser
name: Marketing channel credit analyst
summary: Share sales and channel data. Get a credit model, an explanation of report gaps or code to link visits with sales.
job: read-ad-results
headline: Marketing channel credit analyst
subhead: Share the business, sales cycle, channel reports and conversion records. It compares ways to give channels credit, checks overlaps and gaps, and recommends how to test the result. If you control the site and want to build, it can add links between visits, bookings and sales with the right access. Get a readout or implementation; credit estimates alone do not prove what caused a sale.
explain: |
  A clear answer to which marketing effort caused your sales, and what to do when your tools disagree. Share your channels, sales cycle and the numbers each tool reports.

  The AI explains what attribution can and cannot tell you, compares first-touch, last-touch and multi-touch models for your case, and sets out three ways to measure: platform reports, tracking models and tests. It adds the cheap trick of asking buyers how they heard of you. Then it works through reconciling the conflicting numbers and names the blind spots. If you control the site or app, it also covers building your own first-party tracking.
when:
  - Google Analytics and your ad platform both claim the same sale.
  - You don't know which channel to cut when budget shrinks.
  - Your sales cycle is long and last-click gives a wrong picture.
  - You want to track customers across your own site and app.
not_for:
  - "You need event tracking, UTM tags or GA4 set up: use an analytics setup guide or ask your developer."
  - "You need ad pixels or conversion tracking fixed on Meta or Google Ads: set that up in the ad platform first."
  - "You want pipeline or CRM revenue reports: use your CRM's own reports or a revenue operations specialist."
you_give:
  - Your channels and monthly spend
  - Your sales cycle and business type
  - Numbers from each tool you use
  - Your main conversion goal
you_get:
  - A recommended attribution model with reasons
  - A way to settle conflicting numbers
  - A short list of blind spots
  - A first-party tracking plan (optional)
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Tell it your channels, monthly spend, sales cycle and business type.
  - Paste the numbers each tool reports for the same dates, such as Google Analytics and your ad platforms.
  - Read the readout. Check the source of truth and the gaps before you move any budget.
  - Ask for the first-party tracking plan only if you control your site and have an analytics account and webhook access. Skip it otherwise.
  - That part names tools such as PostHog and a booking tool such as SavvyCal or Calendly. Each may need a paid plan, so check their pricing. It also needs a developer to set up the tracking.
  - Before you move any budget, run a holdout test on your biggest channel to check what the model says.
output_sample:
  input:
    - Your channels and monthly spend
    - Your sales cycle and business type
    - The numbers each tool reports for the same period
    - Your main conversion goal
  prerequisites:
    - "For the optional first-party tracking plan: control of your site or app, an analytics account and webhook access"
  output:
    - name: The question
      contains: The exact question you want answered, written in one line so the readout stays focused.
    - name: Source of truth
      contains: Which data source to trust first, and why it wins over the others.
    - name: What each source says
      contains: The numbers each tool reports side by side, and why they differ.
    - name: Model comparison (for long cycles)
      contains: How first-touch, last-touch and multi-touch models would credit your channels, shown only when your sales cycle is long.
    - name: Confidence & gaps
      contains: How sure the answer is, plus blind spots like dark social and direct traffic.
    - name: Recommendation
      contains: The attribution model to use, with reasons, and the next steps to take.
