output_sample:
  input:
    - The public account or page link and the platform
    - Your Apify token, saved in a .env file
    - A cap on how many results to collect
    - A format choice, quick answer, CSV or JSON (optional)
  prerequisites:
    - An Apify account, which charges per run
    - An AI that can run commands
    - Node.js 20.6 or newer
  output:
    - name: Data file
      contains: The public records collected, as CSV or JSON, saved with a dated file name.
    - name: Quick answer
      contains: The top 5 records shown in chat, so you can check the data first.
    - name: Run report
      contains: The Actor used, the number of records collected and where the file is.
    - name: Audience summary
      contains: Who the audience seems to be, their interests and engagement, with each guess labelled.
    - name: Next steps
      contains: Ideas for deeper analysis, such as splitting the audience into groups.
terms:
  - term: Actor
    meaning: A ready-made data collector on the Apify service, built for one site or task.
  - term: Apify token
    meaning: A private key that lets your AI run Actors on your account. Keep it secret.
  - term: Engagement quality
    meaning: Whether likes and comments look like real interest, not bots or giveaways.
