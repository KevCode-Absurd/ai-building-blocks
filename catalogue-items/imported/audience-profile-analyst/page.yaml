thinking: medium
thinking_why: It gathers figures, then reads the pattern behind them.
new_slug: audience-profile-analyst
name: Audience profile analyst
summary: Find who follows a brand or creator and how real their engagement looks. Get a public data file and a plain summary. Collects data from websites.
job: understand-customers
headline: Audience profile analyst
subhead: Give it a public Facebook, Instagram, YouTube or TikTok account. Your AI collects public follower or comment data with an Apify scraper, saves it to a file and writes up the patterns it sees in who follows, what they engage with and how real the engagement looks.
explain: |
  An audience analysis tells you who is really behind the numbers on a social account. It helps you check a competitor, vet an influencer or back up a pitch with facts.

  The skill picks a ready-made data collector on Apify, called an Actor. It reads what that Actor needs, asks how you want the results saved, runs it and then summarises what came back. The summary covers who the audience seems to be, what they engage with and whether the engagement looks real.

  These Actors return public profile fields and comments, not verified age or gender. Any demographic read is an inference, and the summary labels it that way. It reports patterns across the group, not facts about named people. You need an Apify account, which charges per run, plus Node.js and a command line tool. It suits people comfortable with a terminal.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. Credit goes to sickn33, who collected it.
when:
  - You want to know who follows a competitor before you copy their content.
  - You are choosing an influencer and need to see if their audience looks real.
  - You need audience facts for a pitch or a brand deck.
  - You want to compare the commenters on two platforms for the same brand.
not_for:
  - You want a sponsorship fit check on one creator, with a fit rating. Use the Creator audience checker.
  - The account is private, or the platform's terms forbid scraping it. Use the platform's own audience insights instead.
  - You want facts about named people. This reports patterns for the group and never builds profiles of individuals.
  - You will not set up Apify, Node.js and a token. A pasted sample of public comments in a plain chat can work as a rough read.
you_give:
  - The public account or page link
  - The platform, one of Facebook, Instagram, YouTube or TikTok
  - Your Apify account token, saved in a file called .env and never pasted into chat
  - A cap on how many results to collect
  - A file format, quick answer in chat, CSV or JSON (optional)
you_get:
  - A data file of the public records collected, if you ask for one
  - A count of records and the file location
  - A plain summary of who the audience seems to be and what they engage with
  - An engagement read on how real it looks, with the signs it used
  - Notes on what the data cannot show and suggested next steps
how_to_use:
  - Pick one public account and one platform. Decide what you want to learn, such as who engages or whether comments look real.
  - Create an Apify account and an API token. Save the token in a file called .env as APIFY_TOKEN=your token. Do not paste it into chat. Apify charges for runs, so check the Actor's price first.
  - Use an AI that can run commands, such as Claude Code. Install Node.js 20.6 or newer. Read the Actor's settings on its public page at apify.com, so your token never goes on a command line. Your Apify account needs credit before the run starts.
  - Before each run, check that the platform's terms allow collecting this data, and check the privacy rules where you and the audience live, such as GDPR in the EU. Also check that the Actor your AI picks still exists on apify.com. The export will hold personal data about followers, so decide where you will keep it and set a date to delete it before you run.
  - Paste the skill and give your account link, platform and a small cap, such as 100 results, to start.
  - Ask your AI to name the Actor it picked and what the run will cost before it runs. Try the quick answer first, which shows the top 5 results, to check you have the right data.
  - Run the full export, then read the summary. Treat age, gender and location as guesses, and do not accuse a creator of faking engagement on counts alone. Then delete or lock the exported file, because it holds personal data about followers.
how_it_works:
  - title: Choose the Actor
    text: It matches your platform and goal to a ready-made Apify Actor from its table.
  - title: Read the Actor's inputs
    text: It fetches the Actor's settings and the fields it returns, so the run is set up right.
  - title: Ask how to save it
    text: It asks for a quick answer in chat, a CSV file or a JSON file, and how many results.
  - title: Run the collection
    text: It runs the script with your token, waits for it and saves the data.
  - title: Summarise the audience
    text: It reports the record count, the file and the patterns it sees, and labels each guess.
output_shape: |
  RUN          <Actor used, platform, cap, records collected, file path>
  AUDIENCE     <who they seem to be, marked as inferred: places, interests, languages>
  ENGAGEMENT   <likes and comments against followers, repeat commenters, generic comments, with the counts used; a rough read, not proof>
  PATTERNS     <what they talk about, what content gets a response>
  LIMITS       <what public data cannot show, sample size>
  NEXT         <deeper analysis or groups to split by>
  MISSING      <inputs not given, or none>
