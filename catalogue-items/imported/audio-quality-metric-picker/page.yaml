thinking: medium
thinking_why: It matches each metric to the question.
new_slug: audio-quality-metric-picker
name: Audio quality metric picker
summary: Pick the right audio quality metric for loudness, noise or speech clarity, with calibrated MATLAB code and the standard to check it against.
job: build-software
headline: Audio quality metric picker
subhead: "The right way to measure a sound, chosen before any maths is done. Say what you care about: loudness, background noise, speech clarity or room echo. Made for engineers and technicians who have MATLAB with Audio Toolbox."
explain: |
  The AI picks the proper MATLAB Audio Toolbox function and standard for your sound. It does not write its own version, so the score can be checked against a named standard.

  It covers loudness, roughness, speech scores like STOI and ViSQOL, noise ratings, broadcast loudness in LUFS, reverb time and tones. It asks questions before it computes. It shows how to calibrate with your microphone's sensitivity and how to convert units. It also fixes common mistakes, such as asking for a function that does not exist. PESQ and POLQA do not exist in Audio Toolbox. The skill uses visqol(degraded, reference, fs, Mode="speech") instead. You need MATLAB.

  MathWorks' terms limit use of this skill, including changes, to MathWorks products and services. Read the included LICENSE.md and the MathWorks reuse licence (PMRL) linked in the skill header. These are product-use terms, rather than the standard BSD 2-Clause licence alone. Keep the MathWorks notices. MATLAB and Audio Toolbox are paid products.
when:
  - You need to check a broadcast file meets loudness rules.
  - A speech recording sounds muffled and you want a number for it.
  - An office's noise level has to be rated against a standard.
  - You have a microphone's datasheet and need correct sound levels.
not_for:
  - "You need live audio processing in a streaming loop: use the Live audio processing builder instead."
  - "You want to record from a microphone or run live calibration: use the Audio streamer code writer instead."
  - "You do not have MATLAB with Audio Toolbox: ask an audio engineer or use a free loudness meter for a quick check."
you_give:
  - Your sound file or recording details
  - What you want to measure
  - Microphone sensitivity (optional)
  - The standard you must meet (optional)
you_get:
  - The right function and standard for the goal
  - Calibrated MATLAB code
  - Scores for loudness, noise or speech quality
  - Unit conversions
how_to_use:
  - "This is for engineers and technicians with MATLAB. Before you start, have ready: your audio file, its sample rate, your microphone's sensitivity from its datasheet, and the standard you must meet. If you only need a quick loudness check, use a free loudness meter instead."
  - You need MATLAB with Audio Toolbox. Some functions need a newer MATLAB release. Without MATLAB, this skill cannot run.
  - First, upload the whole skill folder (SKILL.md and its references folder) to an AI that can run MATLAB, or paste the text of SKILL.md into the chat. Then type your first message and say what you want to measure, such as "Check this file against EBU R 128 loudness", and attach the file.
  - Gather your recording first, as a WAV file or another audio file MATLAB can read, and note its sample rate. Tell your AI what you want to measure and give it the file details.
  - Add your microphone sensitivity and the standard you must meet, if you have them.
  - Answer the questions your AI asks before it computes.
  - Run the MATLAB code it gives you and check each score against your target.
  - Compare each score with its named target. For example, compare integrated loudness with -23 LUFS, give or take 1 LU, under EBU R 128. Then take the loudness, noise or speech value to your spec or standard. To compare, run it again with another microphone or room.
output_sample:
  input:
    - Your sound file or recording details
    - What you want to measure, such as loudness, noise or speech quality
    - Your microphone sensitivity (optional)
    - The standard you must meet (optional)
  prerequisites:
    - MATLAB with Audio Toolbox (some functions need a newer release)
    - An AI that can run MATLAB code
  output:
    - name: Measurement goal
      contains: The goal sorted into a group, such as loudness, broadcast, noise compliance or speech quality.
    - name: Questions before computing
      contains: Short questions about your file, microphone and target standard, asked before any maths is done.
    - name: Function and standard
      contains: The Audio Toolbox function and the standard that fit your goal, with a note on any function that does not exist.
    - name: Calibration
      contains: A calibration factor worked out from your microphone sensitivity, plus advice on calibrating the whole system.
    - name: MATLAB code
      contains: Code for your chosen metric, such as loudness, noise rating, speech score, LUFS or reverb time.
    - name: Unit conversions
      contains: Conversions between units, so your numbers match the standard you are checking against.
