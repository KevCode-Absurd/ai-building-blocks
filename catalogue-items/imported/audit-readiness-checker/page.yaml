thinking: medium
thinking_why: It tests records against a set list but must judge the gaps.
new_slug: audit-readiness-checker
name: Audit readiness checker
summary: Check your records and controls for gaps before an audit. Get an audit readiness checklist with ranked findings and fixes.
job: money-and-investing
headline: Audit readiness checker
subhead: A list of control gaps found before an auditor finds them. Describe the audit you expect, such as a full financial audit or one cycle like order-to-cash.
explain: |
  A list of control gaps found before an auditor finds them. Describe the audit you expect, such as a full financial audit or one cycle like order-to-cash. Share your control documents and who owns each process. The result is a self-check, not an audit opinion.

  The AI tests each area against the basic claims auditors check. Did the transaction happen? Is everything recorded? Do you own the asset? Is it valued right? It walks through revenue and receivables, buying and payables, and fixed assets and inventory. It looks for missing approvals, weak separation of duties and records that don't tie out. You get a findings report that ranks each gap and says what to fix first.
when:
  - An external audit starts next month and you want to know your weak spots.
  - You are checking whether controls meet SOX expectations.
  - A process owner left and nobody knows if the controls still run.
  - You need an internal review of the purchase-to-pay cycle.
not_for:
  - "You need an auditor's opinion or formal SOX testing: ask your external auditor or your internal audit team to sign off."
  - "You suspect fraud: bring in a forensic accountant, since this check looks for control gaps, not wrongdoing."
  - "You only want to compare spending trends: use a simple spreadsheet review or ask your accountant."
you_give:
  - The audit scope and period
  - Control documents or a risk control matrix
  - Process owners and known risk areas
  - Sample records (optional)
you_get:
  - A gap list by process area
  - Findings ranked by risk
  - What evidence an auditor will ask for
  - A fix-first action list
how_to_use:
  - Open Claude, ChatGPT or Gemini. Upload the SKILL.md file from this item, or paste its text into the chat.
  - Gather these first: the period-end date, your AR aging report, your fixed asset register, and your purchase orders, receiving records and invoices for the three-way match. Your risk control matrix (RCM) is a table of risks and the controls that cover them. SOX is the US law on financial controls at listed companies.
  - Tell your AI the audit you expect and the period it covers.
  - Paste your control documents and name who owns each process. Add sample records if you have them.
  - Read the findings report. Fix the highest risks first.
  - Collect the evidence your AI says an auditor will ask for. Any check your AI could not run on real records should be marked as not verified.
output_sample:
  input:
    - The audit scope and period, such as a full audit or one cycle
    - Your control documents or risk control matrix
    - Who owns each process and any known risk areas
    - Sample records (optional)
  output:
    - name: Executive Summary
      contains: An overall view of how ready your controls look, with a short summary of the findings.
    - name: "Findings Detail: Issue"
      contains: The specific control gap or error found in each process area.
    - name: "Findings Detail: Risk"
      contains: What could go wrong, whether financial, regulatory or reputational.
    - name: "Findings Detail: Recommendation"
      contains: Step-by-step actions to close each gap.
    - name: "Findings Detail: Owner"
      contains: The team or department best placed to lead each fix.
