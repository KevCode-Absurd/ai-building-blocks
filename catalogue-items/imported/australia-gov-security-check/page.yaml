new_slug: australia-gov-security-check
name: Australian government security checker
summary: Describe your system and its data level. Get which ISM controls apply,
  your gaps and what assessors will ask.
job: check-contracts
headline: Australian government security checker
subhead: "An answer to which Australian Government security rules apply to your
  system, and where you fall short. Say what you run, where it is hosted and how
  sensitive the data is, such as OFFICIAL: Sensitive."
explain: |
  An answer to which Australian Government security rules apply to your system, and where you fall short. Say what you run, where it is hosted and how sensitive the data is, such as OFFICIAL: Sensitive. The AI maps this to the Information Security Manual (ISM) from the Australian Signals Directorate.

  You get gap tables with control numbers, status and the evidence needed. It also sets out the steps to authorise a system and prepare for an IRAP assessment. It writes security documents that cite the ISM. Hardening answers always cover patching and a cloud checklist. It shows the date it was last checked, so confirm against the current ISM.
when:
  - You sell software to an Australian agency and must show security controls.
  - You are preparing for an IRAP assessment.
  - Your cloud system needs authorisation to hold government data.
  - You need security documents that cite the right ISM controls.
you_give:
  - A description of the system and hosting
  - The data classification level
  - Current controls and documents (optional)
  - Your role, such as agency or supplier
you_get:
  - Applicable ISM controls
  - A gap analysis table
  - An authorisation pathway
  - What assessors will ask for
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
