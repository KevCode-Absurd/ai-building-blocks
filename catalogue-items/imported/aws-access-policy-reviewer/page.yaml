thinking: medium
thinking_why: It reviews rules against least access.
new_slug: aws-access-policy-reviewer
name: AWS access policy reviewer
summary: Give it your IAM policies. Get risky permissions found and tighter
  versions that grant only what is needed.
job: secure-code
headline: AWS access policy reviewer
subhead: Give it your IAM policies. Get risky permissions found and tighter
  versions that grant only what is needed. Bring iAM policies as JSON, or
  account access. Use the result to plan your next step.
explain: |
  Your AWS permission policies checked for risks and rewritten to allow only what each user or service needs. Paste IAM policies or point the AI at an account, and it flags wildcard permissions, users without multi-factor login, old access keys, unused roles and risky trust settings.

  For each finding, you get a tighter version. It includes ready-made patterns: access to a single S3 bucket, policies that require MFA, access limited by time and access limited by IP address. It ends with a hardening checklist and shows how to automate the checks. Reviewing a live account needs the AWS command line and read access to IAM.
when:
  - A policy has Action star and Resource star and nobody remembers why.
  - You are tidying an AWS account before a security review.
  - A developer needs access to one bucket and nothing else.
  - You want to enforce MFA for everyone who logs in.
you_give:
  - IAM policies as JSON, or account access
  - What each user or role must do
  - Compliance rules you follow (optional)
you_get:
  - A list of risky permissions
  - Least-privilege replacement policies
  - MFA and key rotation checks
  - A hardening checklist
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your project files.
