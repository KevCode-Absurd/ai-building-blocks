new_slug: aws-resource-inventory-reader
name: Read AWS resource inventory
summary: Read your AWS resource inventory with read-only commands. Ask about EC2, S3, RDS and more, and get a short table plus a note on gaps.
job: connect-tools
headline: Read AWS resource inventory
subhead: Ask a plain question about your AWS setup, like which servers are running. Your AI runs read-only AWS commands and shows the answer in a short table. It never changes anything and never shows secret values.
explain: Bring a scoped AWS question and read access. Get filtered facts with clear gaps and limits.
when:
  - You want to know which EC2 servers are running in one region.
  - You need a list of S3 buckets, databases or Lambda functions before a review.
  - You are checking who has MFA turned on or which roles exist.
  - You want to find everything tagged for production.
not_for:
  - "You want to create, change or delete AWS resources: use the AWS console or your cloud engineer. This skill only reads."
  - "You need to audit many AWS accounts at once: ask your cloud admin for a cross-account report. This skill checks one account at a time."
  - "You need the value of a secret or a parameter: read it yourself in AWS with the right access. This skill shows names and details only. It also leaves out Lambda environment variables, which can hold secrets."
you_give:
  - Your question about AWS resources.
  - The AWS account or profile to use.
  - The region to check (optional).
  - A tag, name or state to filter by (optional).
you_get:
  - A count of what was found.
  - A short table with the useful details for each resource.
  - The account and region the answer covers.
  - A note on gaps, such as missing permissions or empty regions.
how_to_use:
  - Use an AI that can run commands on your computer, and make sure the AWS CLI is installed and signed in. Use a read-only role or profile for the sign-in, so the AI cannot change anything even by mistake.
  - Add the skill folder to your AI tool, or paste the SKILL.md text into the chat.
  - "Ask your question and name the account and region, for example: list running EC2 instances in eu-west-1."
  - Check the account and region at the top of the answer before you trust it.
  - Read the gaps and limits note, then ask for a narrower filter if the list is long.
  - Pass the resource table to your cloud admin. Or use it as the starting list for the Cloud bill waste finder or the Cloud misconfiguration finder.
output_sample:
  input:
    - Your question, such as which EC2 instances are running
    - The AWS account or profile to use
    - The region to check (optional)
    - Filters such as a tag, a name or a state (optional)
  prerequisites:
    - An AI that can run commands on your computer
    - The AWS CLI installed and signed in
    - Permission to read the resource details you ask about
  output:
    - name: Account and region check
      contains: The account and region the answer comes from, so you know where the facts apply.
    - name: Count line
      contains: How many resources were found, with an offer to filter when the list is long.
    - name: Resource table
      contains: A short table with the useful fields for each resource, such as ID, type, state and name.
    - name: Gaps and limits
      contains: Missing permissions, empty regions and anything the query could not see.
    - name: Next filter offer
      contains: A prompt to narrow the list by state, type or tag.
how_it_works:
  - title: Fix identity and scope
    text: Resolve the service, filters, account and region before selecting commands.
  - title: Query metadata only
    text: Use relevant read operations and filtered fields; exclude secret and parameter values.
  - title: Explain the result
    text: Summarize counts and useful fields, retaining permission and regional coverage limits.
thinking: medium
thinking_why: It weighs your evidence and follows a specific method.
next: [cloud-bill-waste-finder, cloud-misconfiguration-finder]
