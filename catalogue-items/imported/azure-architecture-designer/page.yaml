new_slug: azure-architecture-designer
name: Azure architecture designer
summary: Describe your app. Get an Azure design with setup templates, a pipeline
  and cost cuts.
job: ship-and-host
headline: Azure architecture designer
subhead: An Azure design for your app, with Bicep setup templates, a deployment
  pipeline and ways to lower the bill. Say what you are building, your traffic,
  budget, team skills, compliance needs and which region your data must stay in.
explain: |
  An Azure design for your app, with Bicep setup templates, a deployment pipeline and ways to lower the bill. Say what you are building, your traffic, budget, team skills, compliance needs and which region your data must stay in.

  The AI picks services such as App Service, Functions, Cosmos DB or Kubernetes (AKS) to match your size, from a web app under 100 dollars a month to microservices in the low thousands. It generates Bicep, builds an Azure DevOps pipeline, runs a cost review and finishes with a security check. Helper Python scripts back each step. Deploying needs an Azure account.
when:
  - You are launching on Azure and don't know which services to pick.
  - Your monthly Azure cost is higher than planned.
  - You need repeatable templates for staging and production.
  - A rule requires your data to stay in one region.
you_give:
  - App type and expected traffic
  - Monthly budget
  - Compliance and region needs
  - Team size and Azure experience
you_get:
  - An Azure architecture recommendation
  - Bicep templates
  - An Azure DevOps pipeline
  - Cost review and security review
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code.
