thinking: medium
thinking_why: It follows set patterns and tailors them to your app.
new_slug: azure-architecture-designer
name: Azure architecture designer
summary: Get an Azure architecture design for your app, with Bicep templates, a deployment pipeline and cost-saving tips. Give it your traffic and budget.
job: ship-and-host
headline: Azure architecture designer
subhead: An Azure design for your app, with Bicep setup templates, a deployment pipeline and ways to lower the bill. Say what you are building, your traffic, budget, team skills, compliance needs and which region your data must stay in.
explain: |
  An Azure design for your app, with Bicep setup templates, a deployment pipeline and ways to lower the bill. Say what you are building, your traffic, budget, team skills, compliance needs and which region your data must stay in.

  The AI picks services such as App Service, Functions, Cosmos DB or Kubernetes (AKS) to match your size, from a small, low-cost web app to microservices. It generates Bicep, builds an Azure DevOps pipeline, runs a cost review and finishes with a security check. Helper Python scripts back each step. Deploying needs an Azure account. This is a starting design, not a compliance sign-off. If you hold health or personal data, ask a qualified compliance adviser to review it.
when:
  - You are launching on Azure and don't know which services to pick.
  - Your monthly Azure cost is higher than planned.
  - You need repeatable templates for staging and production.
  - A rule requires your data to stay in one region.
not_for:
  - "Your app runs on AWS or Google Cloud: ask an AWS or GCP architect, or use an AWS or GCP design skill. This one only covers Azure."
  - "You only want to fix a failed deployment today: read the error in the Azure portal or ask a person on your team to help."
  - "You need exact prices: use the Azure pricing calculator. Cost figures here are rough guides, not quotes."
you_give:
  - App type and expected traffic
  - Monthly budget
  - Compliance and region needs
  - Team size and Azure experience
you_get:
  - An Azure architecture recommendation
  - Bicep templates
  - An Azure DevOps pipeline
  - Cost review and security review
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text. It works best in an AI that can run code. The three Python helper scripts (architecture_designer.py, bicep_generator.py and cost_optimizer.py) are in this item's scripts folder, so upload the folder with them. If your AI cannot run code, it can still follow the steps and write the design, the Bicep and the cost review by hand, but the results will be less exact.
  - The pasted skill text alone cannot run architecture_designer.py, bicep_generator.py or cost_optimizer.py. You need the uploaded scripts folder and an AI that can run code. Without them, your AI does the steps by hand.
  - Describe your app, your users, your monthly budget, your compliance needs and your region.
  - Read the recommended pattern first. Check it fits your team's skills before you ask for templates.
  - Ask for the Bicep templates and the pipeline. You need an Azure account to deploy them.
  - For a cost review, export your current resources as a JSON file from the Azure portal or Azure CLI. Paste it in.
  - Treat every dollar figure as a rough guide. The example numbers are made up. Check costs in the Azure pricing calculator before you put them in a budget.
  - Before go-live, run the pricing calculator again and work through the security review checklist.
  - Then set up the build and deploy steps with the CI/CD pipeline setup or the Terraform setup builder if you prefer Terraform.
  - The result has six parts in a fixed order. They are the recommendation, Bicep templates, pipeline, cost review, security review and deployment fixes. Each is a short section, and the templates are files.
  - Some services it may pick, such as Front Door, Azure SQL and AKS, are paid and have no free tier. The Bicep example uses the low-cost B1 plan, so check the plan size before you deploy.
output_sample:
  input:
    - What you are building, such as a web app or a data pipeline
    - Expected users and requests per second
    - Monthly budget
    - Compliance needs and the region your data must stay in
    - Team size and Azure experience
  prerequisites:
    - An AI that can run code, to use the helper scripts
    - An Azure account, only if you deploy the templates
  output:
    - name: Order of the result
      contains: "Six parts, in this order: the architecture recommendation, the Bicep templates, the pipeline, the cost review, the security review and the deployment fixes."
    - name: Architecture recommendation
      contains: The pattern that fits your size, the list of Azure services, a rough monthly cost and the trade-offs.
    - name: Bicep templates
      contains: Setup files for your app, with secure defaults such as managed identity and Key Vault.
    - name: CI/CD pipeline
      contains: A GitHub Actions or Azure DevOps pipeline that deploys the Bicep templates.
    - name: Cost review
      contains: Monthly cost by service, ways to right-size, and possible savings ranked by priority.
    - name: Security review
      contains: A checklist for identity, secrets, network, encryption, monitoring and compliance before you go live.
    - name: Deployment fixes
      contains: Commands to check a failed deployment and the common causes.
