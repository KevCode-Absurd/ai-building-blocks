thinking: medium
thinking_why: It follows known patterns but writes real code.
new_slug: backend-builder
name: Backend builder
summary: Describe what your service must do and get API routes, database fixes and login code. A backend builder for Express, Fastify or Koa.
job: build-software
headline: Backend builder
subhead: "The server side of an app: API routes, database design and secure login, written for what your service must do. Start from an OpenAPI file or a schema, and the AI scaffolds route handlers, input checks and types."
explain: |
  The server side of an app: API routes, database design and secure login, written for what your service must do. Start from an OpenAPI file or a schema, and the AI scaffolds route handlers, input checks and types.

  It also reviews your database for slow queries and helps plan changes safely, tests an API under load by setting how many users and for how long, and runs a security pass over login and common attack points. It includes standard response formats, error shapes and status code rules so your API stays consistent. Three Python helper scripts do the scaffolding, migration analysis and load testing. You need a way to run code.
when:
  - You have an API plan and need routes without writing each by hand.
  - A page is slow and you suspect the database.
  - You want to know if your API survives fifty users at once.
  - You need login added and want it hardened.
not_for:
  - "You only need a web page or app screen: use a frontend tool or a web developer, as this one only builds the server side."
  - "You have no API plan and no database yet: write a short list of what your service must do first, or ask a developer to sketch it."
  - "You want to load test a service you do not own: do not. Get written permission first, or test your own copy."
you_give:
  - An API spec or a description of the service
  - Database schema as a .sql file (optional)
  - Language or framework, such as Express
  - Load targets (optional)
you_get:
  - API route handlers and validation
  - Database analysis and migration notes
  - Load test results
  - Security hardening steps
how_to_use:
  - Open a chat with an AI that can run code and read your files, and add the skill folder.
  - Paste your API plan or describe what your service must do. Say which framework you use.
  - Ask for routes first. Read the files it writes before you use them.
  - Add your database schema as a .sql file if you want a speed check. The tool reads the file, not a live database. Ask for migration files, then try them on a copy first.
  - Only run a load test on a system you own or have written permission to test. Use a staging copy, and never test a live login page without approval.
  - Next, read the files it wrote, run your tests, and review the security steps with someone who knows backends before you ship.
output_sample:
  input:
    - Your API plan as an OpenAPI file, or a plain description of the service
    - Your database link or schema files (optional)
    - The framework you use, such as Express, Fastify or Koa
    - Your load test target, such as users and seconds (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Python on your computer to run the three helper scripts
  output:
    - name: Route handlers
      contains: One file per API route, with the code that answers each request.
    - name: Validation middleware and types
      contains: Checks on request bodies, query values and paths, plus TypeScript types.
    - name: Schema analysis and migration files
      contains: Missing indexes, slow query risks and migration files you can apply or undo.
    - name: Load test results
      contains: Requests per second, response time spread, error counts and advice on scaling.
    - name: Security hardening steps
      contains: Fixes for login, rate limiting and input checks, with tests to confirm they work.
next: [api-test-suite-builder, api-security-checker, code-change-reviewer]
