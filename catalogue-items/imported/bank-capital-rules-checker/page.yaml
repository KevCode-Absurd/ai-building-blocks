thinking: high
thinking_why: It applies detailed capital rules and needs careful judgment.
new_slug: bank-capital-rules-checker
name: Bank capital rules checker
summary: Check a bank's capital and liquidity ratios against Basel III minimums. Get a pass or shortfall table with headroom for each limit.
job: check-contracts
headline: Bank capital rules checker
subhead: Give it a bank's capital, risk-weighted assets and liquid assets. It works out the CET1, Tier 1, total capital, Tier 1 to exposure and liquidity ratios, then compares each with its Basel III limit. You get a table showing pass or shortfall and how much room is left.
explain: |
  Basel III is the set of global bank rules on how much capital and liquid cash a bank must hold. A basic capital adequacy check needs a few figures and a lot of care. This bank capital rules checker does the maths in order and shows each formula, so a risk team can follow it.

  You bring the capital pieces (CET1, Additional Tier 1 and Tier 2), the risk-weighted assets or the asset mix, and the liquid assets and 30-day cash outflows. The AI works out each ratio with a script, adds the capital buffers on top of the minimums, and compares each result with its limit. It can also show how a simple loss would move the ratios.

  Risk weights differ by country. The weights in this skill are general Basel III ranges. Use your own regulator's table, and treat the result as a check for your compliance team, not a filing.
when:
  - You need a quick check that a bank meets its CET1 minimum plus buffers.
  - A risk team must show how much room it has above its capital buffers.
  - You are studying how a shift in asset mix changes risk-weighted assets.
  - You want to see how a loss of a set size would move the ratios.
not_for:
  - "You need to file a regulatory return or sign off on compliance: use your regulator's own rules and a qualified compliance officer. This is a simplified check."
  - "You want to check the IT side of a financial firm, such as DORA: use the Financial IT resilience checker."
  - "You are checking payment-card or SWIFT security, not capital: use the Card payment security checker or the Bank messaging security checker."
you_give:
  - Capital figures for CET1, Additional Tier 1 and Tier 2, on one date
  - Risk-weighted assets, or your exposures by asset class with amounts
  - High-quality liquid assets and expected net cash outflows over 30 days
  - Total exposure, to check Tier 1 against it (optional)
  - The capital buffers your regulator sets, and its risk-weight table (optional)
you_get:
  - CET1, Tier 1 and total capital ratios
  - Tier 1 to total exposure ratio and liquidity coverage ratio
  - A pass or shortfall for each limit, with headroom
  - A list of the figures used, anything missing and the risk-weight table applied
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill. Use an AI that can run Python if you can, as the skill includes a script for the maths.
  - Paste your figures in one currency and one date. Name the regulator whose buffers apply. The risk weights in the skill are illustrative: replace them with your regulator's table before you rely on any figure.
  - If your AI cannot run Python, it works the sums step by step and shows each formula. Check the sums yourself in a spreadsheet.
  - If a figure is missing, say so. The AI should mark it MISSING and skip that ratio, not guess. If you do not know the regulator or the buffers, the AI should ask you. If you still cannot say, it checks CET1 against the 4.5% base minimum only and marks it "buffers not applied". It never applies a default buffer.
  - Check the inputs list in the result first. Then read the table, starting with any shortfall.
  - Give the result to your compliance officer to check against your regulator's own rules before you rely on it.
output_sample:
  input:
    - Capital figures for CET1, Additional Tier 1 and Tier 2
    - Risk-weighted assets, or exposures by asset class
    - Liquid assets and 30-day net cash outflows
    - Total exposure and your regulator's buffers (optional)
  prerequisites:
    - Your regulator's risk-weight table, if it differs from the general Basel III ranges (optional)
    - An AI that can run Python, for the script (optional)
  output:
    - name: Compliance table
      contains: Each ratio with its formula, minimum, your value, pass or shortfall and headroom.
    - name: Inputs used
      contains: Every figure you gave and the risk-weight table that was applied.
    - name: Missing and assumptions
      contains: Any figure marked MISSING, and any assumption made, so nothing is guessed.
    - name: Caveat
      contains: A note that this is a simplified check and a compliance officer must review it.
how_it_works:
  - title: Collect the figures
    text: Asks for capital, risk-weighted assets, liquid assets and outflows. It marks missing figures MISSING.
  - title: Apply risk weights
    text: Weights each asset class from your regulator's table, or the general Basel III table, labelled illustrative.
  - title: Work out the ratios
    text: Uses the script for CET1, Tier 1, total capital, Tier 1 to exposure, liquidity coverage and net stable funding.
  - title: Add the buffers
    text: Adds the conservation buffer and any countercyclical or large-bank buffer to the CET1 minimum.
  - title: Compare with limits
    text: Marks each ratio pass or shortfall and shows the headroom in points.
  - title: Run simple scenarios
    text: Shows how a loss of a set size moves the capital ratios, if you ask for it.
output_shape: |-
  COMPLIANCE TABLE
    <measure> | <formula> | minimum <x%> | bank <x%> | <pass | shortfall | MISSING> | headroom <points>

  INPUTS USED
    <figure>: <value> | risk-weight table: <source>

  MISSING AND ASSUMPTIONS
    <item>

  CAVEAT
    Simplified check. Not a regulatory filing. Review with your compliance officer.
works_best_with:
  tools:
    - name: Claude
      why: Follows a long formula chain carefully and can run the included script.
    - name: ChatGPT
      why: Can run Python for the ratio maths if code running is on.
  inputs:
    - Your regulator's current capital buffer rules
    - Your exposure list as a spreadsheet, with an amount and risk weight per row
    - The last quarter's figures, to compare against
terms:
  - term: CET1
    meaning: Common Equity Tier 1. The highest quality capital, mostly shares and retained profit.
  - term: Risk-weighted assets
    meaning: Your assets, each scaled by how risky it is. Riskier assets count for more.
  - term: LCR
    meaning: Liquidity coverage ratio. Liquid assets divided by expected cash outflows over 30 days.
  - term: Headroom
    meaning: How far a ratio sits above its minimum.
