thinking: medium
thinking_why: It runs a set simulation method and checks it is stable.
new_slug: battery-cycling-simulator
name: Battery cycling simulator
summary: Describe a battery and a charge plan. Get simulated voltage curves,
  tested for solver error and compared with real data.
job: research-topics
headline: Battery cycling simulator
subhead: Simulated voltage curves for a lithium-ion cell going through charge,
  discharge and rest steps. The skill also checks that the numbers are not just
  solver error.
explain: |
  Simulated voltage curves for a lithium-ion cell going through charge, discharge and rest steps. The skill also checks that the numbers are not just solver error. Describe the cell and the charging plan, such as a C-rate protocol. It runs real PyBaMM experiments with the single particle model or the fuller DFN model.

  It records where the parameter set came from. It repeats each run at three numerical resolutions to test mesh and solver sensitivity. Then it compares the predicted voltage with measured cycling data. It does not control a real battery cycler or set safe limits for hardware. You need Python 3.12 and a PyBaMM install with pinned versions.
when:
  - You want to predict how a cell's voltage behaves at a new charge rate.
  - You need to check a model against lab cycling data.
  - A result changes when you tweak the mesh and you don't trust it.
  - You need a record of which parameters you used.
you_give:
  - Cell type and parameter set
  - Charge, discharge and rest protocol
  - Measured voltage data (optional)
  - Choice of SPM or DFN model
you_get:
  - Simulated voltage and charge curves
  - Mesh and solver sensitivity checks
  - A comparison with measured data
  - A record of parameter sources
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code.
