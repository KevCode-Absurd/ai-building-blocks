thinking: medium
thinking_why: It follows set steps for each test data type.
new_slug: battery-health-feature-extractor
name: Battery health feature extractor
summary: Turn battery cycling test data into health and wear features for state of health and life prediction models in MATLAB.
job: build-software
headline: Battery health feature extractor
subhead: Give it battery test data. Get health and wear features ready for life prediction. It is for battery test engineers who already work in MATLAB. Bring battery cycling or test data. You then feed the features into your own life prediction model.
explain: |
  Health and wear numbers pulled out of battery test data, ready for models that estimate state of health or predict remaining life. Give it cycling files and it produces more than 165 features, from simple statistics per charge or discharge segment to differential curves that show electrode aging.

  These curves are incremental capacity (dQ/dV), differential voltage (dV/dQ) and differential temperature (dT/dV), and the skill also pulls peak features from them. It uses five functions from MATLAB's Predictive Maintenance Toolbox, handles segmenting the data, and can process many files in a batch. It asks whether to stop or continue before moving to the next stage. You need MATLAB and that toolbox.
when:
  - You have months of cycling data and need inputs for a life prediction model.
  - You want to see capacity fade through differential curves.
  - You must process fifty test files the same way.
  - You need statistics from a partial charge segment.
not_for:
  - "You want to simulate a battery or build a Simulink battery model: use a simulation tool in MATLAB or Simulink instead."
  - "Your data comes from fuel cells, supercapacitors or other sensors: use a general signal processing tool instead."
  - "You want to train the prediction model or make charts: use your own machine learning tool, then bring the features from this one."
you_give:
  - Battery cycling or test data
  - Which cycling phase to use
  - Batch of files (optional)
  - Your prediction goal, such as SOH or RUL
you_get:
  - A table of battery features
  - Differential curves
  - Peak features from the curves
  - A batch pipeline for many files
how_to_use:
  - Open an AI that can run MATLAB code. You need MATLAB and the Predictive Maintenance Toolbox.
  - Paste the skill into the chat, or add the skill folder to your AI tool.
  - Share your cycling data and say what you want to predict, such as state of health or remaining life.
  - Tell your AI which cycling phase to use and which column is which, if the names are not clear.
  - Check the feature table. The AI stops to ask only if column names, a cycle or the phase is unclear.
  - Use the features in your own model, or ask for the batch version to run many files.
output_sample:
  input:
    - Your battery cycling test data, as a MATLAB table or file
    - Which cycling phase to use, such as charge or discharge
    - Which column holds voltage, current, time and temperature
    - Several test files for a batch run (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with the Predictive Maintenance Toolbox
    - Use it only with MathWorks products such as MATLAB, as the licence says (BSD 2-Clause plus MathWorks reuse terms)
  output:
    - name: Cycling feature table
      contains: More than 165 features per cycle, from simple statistics to cumulative values, ready for health or life models.
    - name: Measurement statistics
      contains: Statistics and cumulative values for one full or partial charge or discharge segment.
    - name: Differential curves
      contains: Incremental capacity, differential voltage and differential temperature curves that show electrode aging.
    - name: Curve peak features
      contains: Peak features pulled from the differential curves.
    - name: Batch pipeline
      contains: MATLAB code that runs the same extraction over many test files.
