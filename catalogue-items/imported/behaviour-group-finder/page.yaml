thinking: high
thinking_why: Choosing and naming useful groups takes judgment on top of the math.
new_slug: behaviour-group-finder
name: Behaviour group finder
summary: Find customer groups by behaviour in your data. Give it user data and a goal. You get a profile and a plan for each group.
job: track-numbers
headline: Behaviour group finder
subhead: Natural customer groups found in your data and described in a way you can act on. Say what decision the groups should inform, such as a campaign, a roadmap or a retention plan, and the AI picks three to seven behaviours to compare.
explain: |
  Natural customer groups found in your data and described in a way you can act on. Say what decision the groups should inform, such as a campaign, a roadmap or a retention plan, and the AI picks three to seven behaviours to compare.

  Your AI runs k-means clustering (a way to sort users into groups) in its own code. That same code checks the groups are truly different with a silhouette score (how clearly the groups separate) above 0.3, and that they make business sense. A helper script does not cluster. It only profiles the groups that already have labels, by how far above or below average each one sits on each trait. Each group gets a strategy: retain and expand, monetise, activate, win back or sunset. You need user-level data and a way to run Python.

  This is an imported copy of Nimrod Fisher's segmentation-analysis skill, shared under the MIT licence. We changed step 3 to say that your AI runs the clustering in its own code, because the helper script only profiles groups that already have labels.
when:
  - Marketing wants different messages for different customers and has no groups.
  - You suspect your best customers share a pattern.
  - Churn is rising and you need to spot at-risk users.
  - Your current customer segments feel arbitrary.
not_for:
  - "You have fewer than about 100 users per group you expect, or no user-level data: use simple rule-based groups, such as recent, frequent and high spend, instead."
  - "You only want to check one idea, such as whether paying users churn more: a simple chart in a spreadsheet is enough."
  - "You have no way to run code and a large data file: ask an analyst to run k-means in Python, then use segmentation_runner.py to profile the labelled groups."
you_give:
  - User-level data with behaviour and plan details
  - What the groups will be used for
  - Variables you think matter (optional)
you_get:
  - Customer groups found in the data
  - A profile for each group
  - A validity check on the groups
  - A recommended strategy per group
how_to_use:
  - Open Claude, ChatGPT or Gemini with a mode that can run code and upload files.
  - Remove names, emails and other personal details from your data first. Use user IDs instead, and check your AI provider's data terms before you upload.
  - Paste this skill, then upload your user data file.
  - Say what the groups will be used for, such as a campaign, a roadmap or a retention plan.
  - Add the traits you think matter (optional). Your AI picks three to seven if you do not.
  - Ask your AI to save each user's group label as a new column in your data file, for example one called segment. The helper script needs that column. It runs with --segment-col for that column and --metric-col for the number you want compared, such as revenue.
  - Check the group profiles. Ask whether you would treat each group differently, and rerun with other traits if not.
  - Next, test one group with a small campaign or a retention email. Compare its results with the group profile.
next: [email-segment-builder, churn-risk-finder]
output_sample:
  input:
    - Your user-level data, with details like plan type and behaviour such as sessions, spend and last visit
    - The decision the groups should help with, such as a campaign, a roadmap or a retention plan
    - Any groups you already use (optional)
  prerequisites:
    - An AI that can run Python code and read your data file, with pandas and scikit-learn for the clustering step. The helper script itself needs only your CSV, the segment column and one number column.
  output:
    - name: segmentation_runner.py
      contains: The script that profiles each group against the overall average. The AI's own code does the k-means run and the charts.
    - name: segmentation_approaches.md
      contains: A guide to when k-means, RFM or rule-based groups fit best, and how to read the results.
    - name: segment_profile_template.md
      contains: One profile per group, about half a page each, with these fields. Size, defining traits, a name, a recommended strategy and the metric to track.
