thinking: medium
thinking_why: It weighs a few options against your data.
new_slug: big-data-tool-chooser
name: Big data tool chooser
summary: Find the right MATLAB tool for files too big for memory. Give it your file details. You get one clear path and code for your big data task.
job: build-software
headline: Big data tool chooser
subhead: "One clear MATLAB path for working with files too big for memory, not a menu of options. Describe your data: CSV, Parquet, text or spreadsheet files, how many and how big, and what you want to do with them."
explain: |
  One clear MATLAB path for working with files too big for memory, not a menu of options. Describe your data: CSV, Parquet, text or spreadsheet files, how many and how big, and what you want to do with them.

  The AI runs a pre-flight check and follows a decision flowchart. Continuous data across files points to a datastore with tall arrays. Files to process one at a time point to a datastore with transform. Parquet can be handled per row group. It also covers running reads in parallel, when mapreduce is actually needed, formats with no built-in datastore, and how to write a custom datastore. You need MATLAB.

  Licence: this is a copy of MathWorks' public skill matlab-choose-big-data-solution, under BSD 2-Clause (see LICENSE.md). The skill file also links MathWorks' own reuse licence, which means you may use it only with MathWorks products such as MATLAB.
when:
  - readtable crashes with an out-of-memory error.
  - You have a folder of two hundred CSV files to treat as one dataset.
  - You want to speed up a loop over many files.
  - Your data is in a format MATLAB can't read in chunks.
not_for:
  - "Your data is in a MAT file: use matfile in MATLAB, which reads parts of a MAT file without loading it all."
  - "Your file fits in memory: use readtable or parquetread in MATLAB, no big data tool needed."
  - "You do not have MATLAB: ask a data person for a tool that fits your setup, since this skill only picks MATLAB tools."
you_give:
  - File type, count and total size
  - What you want to compute
  - Your MATLAB setup and available memory
  - Whether files are one dataset or independent
you_get:
  - One recommended approach with reasons
  - Working MATLAB code for it
  - Parallel settings if they help
  - A custom datastore outline (if needed)
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on this page.
  - It works best when your AI can run MATLAB.
  - Run the code in MATLAB on a small slice of your files first and check the result. Then run it on everything. For reading and writing files, pair it with the Data file reader and writer or the DuckDB big file query helper.
next: [data-file-reader-and-writer, duckdb-big-file-query-helper]
output_sample:
  input:
    - File type, such as CSV, Parquet, text or spreadsheet
    - How many files you have and how big they are
    - What you want to work out from the data
    - Your MATLAB setup and memory (optional)
  prerequisites:
    - MATLAB, ideally with an AI that can run it
    - Parallel Computing Toolbox (paid add-on), only if you want parallel reads
    - Database Toolbox (paid add-on), only for the DuckDB path
    - Vehicle Network Toolbox (paid add-on), only for MDF files
    - MATLAB Parallel Server and a Hadoop or Spark cluster, only for the mapreduce path
    - MATLAB is a paid MathWorks product, so you need a licence
    - Use it only with MathWorks products such as MATLAB, as the licence says (BSD 2-Clause plus MathWorks reuse terms)
  output:
    - name: Pre-flight check
      contains: A quick test of file size against memory to see if you need a big data tool at all.
    - name: Recommended path
      contains: One chosen approach from the decision flowchart, with the reasons it fits your data.
    - name: MATLAB code
      contains: Working code for the chosen path, such as a datastore with tall arrays or with transform.
    - name: Parallel settings
      contains: Settings for running reads in parallel, only when they help your case.
    - name: Custom datastore outline
      contains: A plan for reading chunks of formats with no built-in datastore, only if you need it.
