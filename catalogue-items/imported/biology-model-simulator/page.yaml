thinking: medium
thinking_why: It picks a solver and runs set analyses.
new_slug: biology-model-simulator
name: Biology model simulator
summary: Run your SimBiology model forward in time, test what-if doses and find which settings move the result most. Needs MATLAB with SimBiology.
job: build-software
headline: Biology model simulator
subhead: Run your SimBiology model forward in time and see what changes when you tweak a dose, a rate or a starting level. You also learn which settings move the result most, so you know where to spend your effort.
explain: |
  Run your SimBiology model forward in time and see what changes when you tweak a dose, a rate or a starting level. You also learn which settings move the result most, so you know where to spend your effort.

  The skill covers smooth ODE runs and random-event runs, plus what-if scenarios, dose-response sweeps and factorial designs. For influence, it runs global sensitivity methods such as Sobol and Morris. It follows a few hard-won rules: use element-wise operators in observables, and log the states that observables depend on. It works inside MATLAB with SimBiology installed.

  Scenario results come as a table with one row per run: run ID, dose, parameter values and the final value of each output species. The sensitivity list ranks each parameter with its first-order and total-order index.

  Licence: BSD 2-Clause, plus a MathWorks term in the LICENSE file. You may use it only together with MathWorks products such as MATLAB.
when:
  - You want to see how your model behaves over time under a new dose.
  - You need to compare several what-if cases side by side.
  - Gene expression noise matters and you need stochastic runs.
  - You must find out which parameters drive the output most.
not_for:
  - "You need to build the model or lay out its diagram: use SimBiology model builder tools in MATLAB, since this skill only runs a model that already exists."
  - "You want to fit parameters to your own data, or work out AUC or Cmax: do that in SimBiology's fitting tools, then bring the fitted model here."
  - "You have no MATLAB or SimBiology licence: ask a colleague who has one to run it, as this skill cannot run without both."
you_give:
  - A SimBiology model
  - The scenarios or ranges to test
  - Run length and output species
  - Whether you want stochastic runs (optional)
you_get:
  - Time-course results for each case
  - Dose-response or sweep tables
  - Plots of the runs
  - A ranked list of influential parameters
how_to_use:
  - Check first that MATLAB and the SimBiology toolbox are installed and licensed. Both are paid products.
  - Download the skill folder. Copy it into your MATLAB project at .claude/skills/simbiology-simulate-model/. Your AI then runs the addpath line at the top of the skill, with your project folder in place of WORKSPACE_ROOT.
  - Open your AI in a tool that can run MATLAB code. Paste in the skill instructions.
  - Tell your AI where your model file is, which cases to test and which species to watch.
  - Ask for a plain run first. Check the plots look sensible before you ask for sweeps or sensitivity.
  - Read the ranked list of influential settings. Spend your effort on the top ones.
  - Next, fit or measure the top-ranked settings with the Biology model fitter. Use the Biology model builder if the model's structure needs to change.
output_sample:
  input:
    - Your SimBiology model (a .sbproj file or a model already open in MATLAB)
    - The doses, rates or starting levels you want to test
    - How long to run and which species to watch
    - Whether you want random-event (stochastic) runs (optional)
  prerequisites:
    - MATLAB with the SimBiology toolbox installed and licensed (both are paid)
    - An AI that can run MATLAB code
    - The skill's scripts folder copied into your project, so the helper scripts can be found
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: Basic simulation
      contains: Time-course results for your model, with a quick plot of each species over time.
    - name: Scenario results
      contains: One run per what-if case, with a table that maps each run to its dose or setting.
    - name: Dose sweep and factorial tables
      contains: Results for each dose level, or each mix of dose and parameter value, side by side.
    - name: Stochastic runs
      contains: Single or repeated random-event runs, for models where noise matters such as gene expression.
    - name: Sensitivity analysis
      contains: A ranking of which parameters move the result most, using Sobol, Morris or local methods.
