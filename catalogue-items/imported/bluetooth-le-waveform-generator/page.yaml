thinking: medium
thinking_why: It follows a set API.
new_slug: bluetooth-le-waveform-generator
name: Bluetooth LE waveform generator
summary: Generate a Bluetooth LE waveform in MATLAB with the right functions. Name the packet type or test and get working code for LE1M, LE2M, LE500K or LE125K.
job: build-software
headline: Bluetooth LE waveform generator
subhead: Get Bluetooth Low Energy PHY waveforms built with the right MATLAB functions, so you stop debugging invented API calls. You name the packet type or test, and the skill picks a matching pattern.
explain: |
  Get Bluetooth Low Energy PHY waveforms built with the right MATLAB functions, so you stop debugging invented API calls. You name the packet type or test, and the skill picks a matching pattern.

  It starts from a routing table that maps your request to a pattern: single mode, all-mode comparison, direction finding with CTE, RF-PHY compliance, WLAN coexistence, transmit measurements, RSSI location, bit error rate, multi-packet bursts, spectrum views, whitening or full impairments. If you are vague, it defaults to LE1M with a 37-byte payload on channel 37. It covers the LE1M, LE2M, LE500K and LE125K modes. It needs the Bluetooth Toolbox.

  Licence: one licence governs this copy, BSD 2-Clause (see LICENSE.md). It adds that you may use it only with MathWorks products such as MATLAB. The link to MathWorks' reuse terms in the skill file is MathWorks' own page, not a second licence. Credit goes to MathWorks.
when:
  - You need a Bluetooth LE packet waveform for a test.
  - You want to compare the four PHY modes side by side.
  - You are working on angle of arrival or departure.
  - You must check bit error rate across noise levels.
not_for:
  - "You need Classic Bluetooth (BR/EDR): use bluetoothWaveformGenerator in MATLAB instead."
  - "You need Channel Sounding for ranging or distance: use bleCSWaveform in MATLAB R2024b or later."
  - "You need link-layer or network simulation: use bluetoothLENode in MATLAB. For radio path loss, use bluetoothPathLoss."
  - You have no radio or MATLAB experience. This is for engineers, so ask one to run it for you. The licence also limits use to MathWorks products.
you_give:
  - The packet type or PHY mode to generate, such as LE1M, LE2M, LE500K or LE125K
  - Payload size and channel (optional)
  - The test you plan to run, such as BER, direction finding or compliance
  - MATLAB R2022a or later with the Bluetooth Toolbox, and an AI tool that can run MATLAB code
you_get:
  - MATLAB code that builds your Bluetooth LE waveform with the right functions
  - A matching receiver or measurement step, such as decoding, angle estimates or power checks
  - Plots such as the spectrum or the bit error rate curve
  - A pass or fail check for round-trip decode tests
  - "Sensible defaults when your request is vague: LE1M, 37-byte payload, channel 37"
  - "A clear next step: feed the waveform into a receiver, a BER loop or an RF-PHY test"
how_to_use:
  - "Before you start, decide four things to tell your AI: the PHY mode (LE1M, LE2M, LE500K or LE125K), the payload length, the channel and the test type."
  - Open an AI tool that can write and run MATLAB code. You need MATLAB R2022a or later with the Bluetooth Toolbox. MATLAB and the Bluetooth Toolbox are paid MathWorks products, and you need your own licence for each. No API key is needed.
  - Add this skill to your AI tool, or paste the SKILL.md text into the chat.
  - Say which packet type or PHY mode you want and what you plan to test. Add payload size and channel if you know them.
  - Run the code it gives you in MATLAB and check the plots and the round-trip check.
  - "Use the waveform next: send it to the receiver, run a BER loop over noise levels, or try an RF-PHY test waveform."
next: [bluetooth-network-simulator]
output_sample:
  input:
    - The packet type or PHY mode, such as LE1M or LE2M
    - The test you plan to run, such as BER, direction finding or RF-PHY
    - Payload size and channel (optional)
  prerequisites:
    - MATLAB R2022a or later with the Bluetooth Toolbox
    - An AI tool that can write and run MATLAB code, not just a chat
    - Use it only with MathWorks products such as MATLAB, as the licence says (BSD 2-Clause plus MathWorks reuse terms)
  output:
    - name: Waveform generation code
      contains: MATLAB code that builds the packet waveform with bleWaveformGenerator, using the pattern that matches your request.
    - name: Receiver or measurement step
      contains: Code that decodes the waveform or measures it, such as bleIdealReceiver, angle estimates, power or bandwidth.
    - name: Plots
      contains: Figures such as the spectrum or the bit error rate curve, when your test calls for them.
    - name: Round-trip check
      contains: An assert that confirms the decoded bits match the bits you sent, for decode tests.
    - name: Defaults used
      contains: "The choices made when your request was vague: LE1M, a 37-byte payload and channel 37."
