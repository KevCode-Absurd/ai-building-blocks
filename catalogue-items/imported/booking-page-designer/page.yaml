thinking_why: It balances more bookings against better-qualified ones.
new_slug: booking-page-designer
name: Booking page designer
summary: Describe your calls or appointments. Get a booking flow with open
  times, qualifying questions, prep emails and follow-up.
job: sell-and-negotiate
headline: Booking page designer
subhead: A booking flow that sets up good calls instead of cold demos. You get
  open times, a short set of questions, prep emails for your team and a
  follow-up sequence, all matched to who is booking.
explain: |
  A booking flow that sets up good calls instead of cold demos. You get open times, a short set of questions, prep emails for your team and a follow-up sequence, all matched to who is booking.

  The skill argues for three to five well-chosen form fields, since long forms lose most people before they book. It routes high-fit leads to senior people and sends others down a lighter path. It briefs the rep before each call so no one starts blind. It also tells you when a booking page is the wrong tool. It suits a first scheduler or a rebuild of a weak one.
when:
  - You are setting up a scheduler for the first time.
  - Your booking form is too long and people drop off.
  - Reps join calls knowing nothing about the lead.
  - You want good leads routed to your best people.
you_give:
  - What the calls are for
  - Who books and how you tell good fits
  - Your team's availability
  - Your current booking tool (optional)
you_get:
  - A booking flow with availability rules
  - Three to five qualifying questions
  - Prep briefs for the rep
  - Reminder and follow-up emails
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
