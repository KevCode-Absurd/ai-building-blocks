thinking: high
thinking_why: It weighs many signs of repayment risk.
new_slug: borrower-credit-memo-writer
name: Borrower credit memo writer
summary: Write a credit memo from a borrower's accounts. See if they can repay, how much debt they can carry, and how much covenant room they have.
job: money-and-investing
headline: Borrower credit memo writer
subhead: Give it three or more years of a borrower's accounts and the loan details. It works out the key ratios, stresses them, and checks covenant room. You get a credit memo that ends in a clear recommendation.
explain: |
  A credit memo that answers one question with evidence: can this borrower pay the money back through a bad year, and what protects the lender if not. It is written from the borrower's own accounts.

  The skill first sets the loan context, covering facility type, amount, term, security and purpose. It uses at least three years of financials and computes ratios with code instead of by eye, because the trend matters more than any one figure. It stress tests sales, margins and interest rates, and checks debt service stays above 1.0. It also tests covenant headroom and audits how terms like EBITDA are defined.
when:
  - You must write a credit memo for a loan request.
  - You need to know how much debt a company can carry.
  - A covenant package needs its headroom checked.
  - You want to see if debt payments hold up when sales fall or rates rise.
not_for:
  - "You need to rule on a small loan or a consumer loan: use your lender's own scorecard or ask a credit officer, as this memo needs three years of company accounts."
  - "The answer to can they repay is no: work out a restructuring plan with a debt adviser first, then come back for a memo on the new terms."
  - "You want to value a company for a sale or an investment: use a valuation method, not a lending memo."
you_give:
  - Three or more years of the borrower's financial statements
  - Loan type, amount, term, security and what the money is for
  - Existing debt list with its covenants
  - Projections (optional)
  - Bank statements and receivables aging reports (optional)
you_get:
  - A ratio table with trends over the years
  - Stress test results for lower sales, lower margins and higher rates
  - Covenant headroom check, including how terms like EBITDA are defined
  - A written credit recommendation with ranked risks and protections
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. Pick one that can run code, so the ratios are worked out by a script.
  - Paste the skill text. Also upload scripts/calculate.py and references/covenant-guide.md from the skill folder, since the ratios are worked out by that script. Then add the borrower's financial statements and the loan details.
  - Add the existing debt list and covenants. Add projections if you have them.
  - Ask for the credit memo. If something is missing, your AI should ask for it and not guess.
  - "Check the ratio table against the accounts. DSCR is debt service coverage: cash left after costs, divided by interest plus principal due."
  - Compare the rules of thumb (such as debt under 3.0 times EBITDA) with your own lender's credit policy before you use the memo.
  - Send the memo to a credit officer for sign-off. It is a draft, not a lending decision.
output_sample:
  input:
    - Three or more years of the borrower's financial statements
    - Loan type, amount, term, security and what the money is for
    - Existing debt list with its covenants
    - Projections (optional)
    - Bank statements and receivables aging reports (optional)
  prerequisites:
    - An AI that can run code, so the ratios are worked out by a script and not by eye
  output:
    - name: Recommendation
      contains: Approve, decline or restructure, with amount, term, pricing guidance and conditions to meet before funding.
    - name: Borrower Analysis
      contains: The business, its management, its industry and the evidence behind each of the 5 Cs of credit.
    - name: Financial Analysis
      contains: A ratio table for past, projected and stressed years, with the math checked by code.
    - name: Risks & Mitigants
      contains: Ranked risks, each paired with a real protection for the lender.
    - name: Security & Documentation
      contains: The collateral, the proposed covenants and why each has the headroom it has.
