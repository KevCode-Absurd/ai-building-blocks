thinking: low
thinking_why: It sorts your notes into set groups.
new_slug: brain-dump-organizer
name: Brain dump organizer
summary: Turn a messy brain dump into a sorted list of projects, ideas and tasks, in your own words, with nothing dropped and clear offers of help.
job: organise-work
headline: Brain dump organizer
subhead: Paste a messy stream of thoughts and get it sorted into a clean, usable list with nothing lost. Tasks, ideas and notes each land in their place, still in your own words.
explain: |
  Paste a messy stream of thoughts and get it sorted into a clean, usable list with nothing lost. Tasks, ideas and notes each land in their place, still in your own words.

  The skill runs without asking permission when it spots a long, mixed block of text. Five rules apply every time: capture everything, keep your voice, match the output size to the input, sort into four sections, and let you prune later. A five-item dump will not get an elaborate structure. Casual phrasing stays casual, so "build something crazy with AI" is not turned into corporate language.
when:
  - Your head is full and you need it out on paper.
  - You pasted a wall of mixed notes and need them sorted.
  - After a meeting you have scattered tasks and ideas.
  - You want a to-do list without losing the odd idea.
not_for:
  - You have one clear task. Just do it, or add it to your own task manager.
  - You need a formal project plan with dates and owners. Use a project tool such as Asana or Trello.
  - You want a tidy, formal rewrite of your notes. This keeps your casual words, so ask your AI for an edit instead.
  - "You want a top three for the week and a count that proves nothing was dropped: use the Brain dump sorter."
you_give:
  - A messy block of text or dictation
  - Anything you want treated as urgent (optional)
  - Preferred format (optional)
you_get:
  - Four clear sections of actions, ideas and notes
  - Your original wording preserved
  - Nothing dropped
  - Output sized to match your input
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste your messy notes, or dictate them. You do not need to tidy them first.
  - Answer the one question it may ask, if a single item could be a task or a project.
  - Check the sections. Nothing should be missing, and the wording should still sound like you.
  - Pick which offer from How I Can Help it should do next. It waits for your pick.
  - Connections only looks at files if your AI can see them (Claude Code, or a project with files attached). In a plain chat it says no workspace is available, and the rest of the sort still works. To turn it off, tell your AI not to look at your files.
output_sample:
  input:
    - A messy block of text or dictation, typed or pasted
    - Files or a project your AI can see (optional)
  prerequisites:
    - An AI that can read your files or project, only if you want the Connections section filled in
  output:
    - name: Projects & Ideas
      contains: Related items grouped under project names in your words, with open questions and decisions kept inside each project.
    - name: Tasks
      contains: A flat list of actions, plus decisions and open questions, each linked to its project when it has one.
    - name: Connections
      contains: Real matches between your dump and existing files, or a plain note that none were found or no files were visible.
    - name: How I Can Help
      contains: Specific offers that say what would be made and where it would go, ending with a question on which to start.
    - name: What I heard
      contains: For a dump of five items or fewer, a short list used in place of the four sections.
