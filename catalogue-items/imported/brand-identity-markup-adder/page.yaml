thinking: low
thinking_why: It fills a fixed markup template.
new_slug: brand-identity-markup-adder
name: Brand identity markup adder
summary: Add your brand details to your Shopify theme as markup that search tools can read. Previews the snippet before it writes.
job: build-websites
headline: Brand identity markup adder
subhead: Add machine-readable brand details to your Shopify store. They help search tools and AI shopping assistants link your store to your official profiles. No tool is promised to use them. This changes your live theme, so it previews first.
explain: |
  Add machine-readable brand details to your Shopify store. They help search tools and AI shopping assistants link your store to your official profiles. No tool is promised to use them. This changes your live theme, so it previews first.

  The skill builds an Organization JSON-LD block from your shop data. It includes your official social profiles and public pages such as Wikipedia, plus a contact point. It then places the block in your theme. The preview mode is on by default and shows the snippet and where it will go before anything is written. You need a logged-in Shopify CLI session with theme read and write access.
when:
  - You want your brand details in a form search tools and AI assistants can read.
  - Resellers or copycats use your brand name.
  - You want your social and public profiles linked to your site.
  - You need a contact point that machines can read.
not_for:
  - "You have no live Shopify online store or no theme write access: ask your developer to add the markup by hand in the theme editor."
  - "You want to fix other store problems, such as missing product details: this item only adds brand identity markup."
  - "You do not have official profile links to add: gather them first, because a wrong link hurts trust."
you_give:
  - Your store domain
  - Logo URL (optional)
  - Official social and public page links
  - A logged-in Shopify CLI session with theme access
you_get:
  - An Organization JSON-LD snippet
  - A preview of the theme change
  - The snippet added to your theme
  - A check that it reads correctly
how_to_use:
  - Duplicate your live theme in Shopify first, so you can roll back.
  - Log in to Shopify CLI for your store. Your AI needs to run commands for this skill.
  - Paste the skill into your AI. Give it your store domain, official profile links, and your logo link and support email if you have them.
  - Leave preview mode on for the first run. Read the snippet and the one line it adds to theme.liquid.
  - Paste the previewed snippet into a structured data validator, such as Google's Rich Results Test. Fix anything it flags before you go on.
  - If it looks right, ask your AI to run it again with preview off. This writes to your live theme straight away, which is why you duplicated it first.
  - Then check your live store: the snippet loads in the page head and the validator passes. If it fails, restore the duplicated theme.
output_sample:
  input:
    - Your store domain
    - Your logo link (optional)
    - Links to your official social profiles and public pages, such as Wikipedia
    - Your support email and phone (optional)
  prerequisites:
    - An AI that can run Shopify CLI commands
    - A logged-in Shopify CLI session with theme read and write access
  output:
    - name: Organization JSON-LD block
      contains: Your brand name, store link, logo, official profile links and a support contact point, in a format machines can read.
    - name: snippets/agentic-organization-schema.liquid
      contains: A new theme file that holds the brand markup, kept apart from your other theme code.
    - name: layout/theme.liquid change
      contains: One managed line in the page head that loads the new snippet, shown as a before and after diff.
    - name: Outcome summary
      contains: Whether the files were written, any errors, and the output file name.
