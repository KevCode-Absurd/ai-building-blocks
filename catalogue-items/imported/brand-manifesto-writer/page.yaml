thinking: medium
thinking_why: It needs a strong point of view and careful word choice.
new_slug: brand-manifesto-writer
name: Brand manifesto writer
summary: Write a brand manifesto that says what your brand believes and fights against. You get a full version and a short one for your site or wall.
job: write-and-tell-stories
headline: Brand manifesto writer
subhead: A manifesto that says what your brand believes, what it fights against and what it wants the world to look like. It gives your team and customers something to rally around.
explain: |
  A manifesto that says what your brand believes, what it fights against and what it wants the world to look like. It gives your team and customers something to rally around.

  The skill asks about your core belief, the thing you refuse to accept, who shares your worldview, the change you want, the tone and where it will be used. The tone can be a war cry, a love letter, a quiet conviction or a provocation. You get a full version of 300 to 500 words, with an opening declaration that states the one thing you believe, plus shorter cuts for other uses.
when:
  - Your team needs a shared statement of what you stand for.
  - Your marketing sounds like everyone else's.
  - You are launching a brand with a strong point of view.
  - You want a short version for a website or poster.
not_for:
  - "You need product ads or launch copy: build your brand strategy first, then write the copy with your AI."
  - "You want a plain mission statement: write one or two clear lines yourself, then check them with your team."
  - "You only need a short brand story about how you began: write the origin story first, then come back for the manifesto."
you_give:
  - What your brand believes
  - What it is fighting against
  - Who it is for
  - Tone and where it will be used
you_get:
  - A full manifesto of 300 to 500 words
  - Shorter versions for other uses
  - An opening declaration
  - Tone matched to your choice
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill instructions. No code, files or paid tools are needed.
  - Add any brand notes you already have, such as your strategy, story or voice. This step is optional.
  - "Answer the questions: your core belief, what you fight against, who it is for, the change you want, the tone and whether it is for your team or customers."
  - "Pick a tone: war cry, love letter, quiet conviction or provocation."
  - Read both versions. Cut any line a competitor could have written, then ask your AI to rewrite it.
output_sample:
  input:
    - What your brand believes at its core
    - What your brand is fighting against
    - Who shares your worldview
    - The change you want to see
    - The tone and where it will be used
  prerequisites:
    - Your brand context or strategy notes, if you have them (optional)
  output:
    - name: Opening declaration
      contains: One or two bold lines that state the single belief your brand stands on.
    - name: The problem
      contains: Two or three paragraphs that name what is wrong with the status quo.
    - name: The belief
      contains: Two or three paragraphs on what your brand believes instead and the world it wants.
    - name: The people
      contains: One paragraph on who this is for, described by their beliefs, not their age or job.
    - name: The commitment
      contains: One paragraph on what your brand will never compromise on, even when it is hard.
    - name: The closing line
      contains: A short call or declaration, ready to print on a wall.
    - name: Short manifesto
      contains: A 100 to 150 word version for a website page, onboarding or poster.
