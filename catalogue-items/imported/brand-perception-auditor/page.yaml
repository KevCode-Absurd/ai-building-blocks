thinking: high
thinking_why: It reads many small signals and judges what they add up to.
new_slug: brand-perception-auditor
name: Brand perception auditor
summary: Find the mixed signals in your brand audit. Give it your brand, audience and copy samples. You get a ranked list of changes to close the perception gap.
job: brand-file
headline: Brand perception auditor
subhead: A list of mixed signals your brand sends, and the changes that close the gap between what you mean and what people feel. It looks at how your look, words and behaviour land with your audience.
explain: |
  A list of mixed signals your brand sends, and the changes that close the gap between what you mean and what people feel. It looks at how your look, words and behaviour land with your audience.

  The skill gathers context about your market and who you serve. It then reviews your visual, verbal and behavioural identity for what each part signals about trust and status, and where those signals clash. Ideas from psychology are treated as lenses to check, not proof, so verify any claim before you use it in public. It leans on your own audience research and verified product facts.
when:
  - Customers say your brand feels off but can't say why.
  - Your price and your look don't match.
  - You plan to reposition and need to see the current gap.
  - You want to shift how much trust your messaging earns.
not_for:
  - "You have no audience research or product facts yet: run a few customer interviews first, then come back."
  - "You only want a new logo or color palette: ask a designer, because this audit looks at look, words and behavior together."
  - "You need proof that a message will raise sales: run a real test with your audience, since this gives ideas to check, not proof."
you_give:
  - A description of your brand and its audience
  - Samples of copy, visuals and packaging
  - Audience research (optional)
  - The perception you want
you_get:
  - A list of mixed signals
  - Where look, words and behaviour disagree
  - Changes to close the gap
  - Priorities for what to fix first
how_to_use:
  - "Gather first. Required: a short description of your brand and who it is for, and the perception you want. Also helpful: samples of your copy (homepage, emails, ads), pictures of your visuals and packaging, and any customer quotes or research. If you have no audience research, run a few customer interviews first, and then come back."
  - Open Claude, ChatGPT or Gemini and paste in the skill text. Then paste what you gathered.
  - Answer any question it asks about your intended position.
  - "It works in five steps, and you can check each one. 1. Write the three words a customer would use to describe you today. 2. Write the three words you want them to use. 3. Find the biggest clash between your look, your words and what you do. 4. Pick the smallest change that fixes it. 5. Check that the change holds on your website, packaging, emails and support."
  - Read the clashes and check any claim from psychology before you use it in public.
  - Fix the top change first. Then test it with real customers. To clean up the words, use the Honest persuasion editor.
next: [honest-persuasion-editor]
output_sample:
  input:
    - Your brand description and the audience you serve
    - Samples of your copy, visuals and packaging
    - The perception you want people to have
    - Your own audience research or customer quotes (optional)
  output:
    - name: Current brand schema
      contains: The impression your audience is likely forming from your look, words and behavior today.
    - name: Intended position
      contains: The perception you want, stated in the same terms so the two can be compared.
    - name: Largest mismatch
      contains: The strongest conflict between your visual, verbal and behavioral signals.
    - name: Smallest useful correction
      contains: The one change most likely to move perception, with a size of fix based on the gap.
    - name: Cross-touchpoint check
      contains: Whether the new position holds everywhere your audience meets your brand.
    - name: Quality check
      contains: A short check that the change feels more credible, not just prettier.
output_shape: |
  Current brand schema: <one sentence, with one word per touchpoint>
  Intended position: <one sentence in the same terms>
  | Signal | Layer | Conflict | Proposed change | Effort | First test question |
  Largest mismatch: <the signal, why it matters>
  Cross-touchpoint check: <each touchpoint: conflicting / fixed / needs its own change>
  Quality check: <credible, not just prettier: yes or no, and why>
  (Effort in the table is small, medium or large.)
terms:
  - term: brand schema
    meaning: The picture of your brand that sits in a customer's mind, built from what they have seen and heard.
  - term: halo effect
    meaning: When one strong good or bad signal colours how people read everything else about you.
