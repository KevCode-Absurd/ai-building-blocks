thinking: medium
thinking_why: It organises a finished identity into a reference.
new_slug: brand-style-guide-writer
name: Brand style guide writer
summary: Write a brand style guide from your logo, colours, fonts and voice notes. You get eight sections other people can follow without guessing.
job: brand-file
headline: Brand style guide writer
subhead: Hand your brand over to a designer, agency or new hire and have them get it right the first time. This builds the reference document that settles every "is this allowed?" question.
explain: |
  Hand your brand over to a designer, agency or new hire and have them get it right the first time. This builds the reference document that settles every "is this allowed?" question.

  You bring your logo, colours, fonts and voice notes. The skill organises them into eight sections: story, logo rules, colour, type, imagery, voice, layout and examples. Each part states what is required, what is flexible and what is banned, with spacing and sizing rules written out. It is made for brands that already have a finished look. If you have no look yet, build that first. It can also audit an old guide for holes and clashes.
when:
  - You finished a rebrand and need a guide to hand to vendors and partners.
  - Your brand exists but nothing is written down, so every freelancer guesses.
  - A new team member keeps asking which blue and which font to use.
  - Your current style guide has gaps and you want to find them.
not_for:
  - Your brand look is not designed yet. Finish the logo, colours and fonts first, then come back to write the guide.
  - You only need a guide to how your brand sounds. Write a short voice document instead, then add it here later.
  - You want ready-made buttons and page parts for a website or app. Ask a developer or designer to build a design system.
you_give:
  - Your logo files and variants
  - Colours and fonts in use
  - Notes on voice and tone
  - Examples of the brand in real use (optional)
  - Rules on what is required or forbidden (optional)
you_get:
  - An eight-section brand style guide
  - Logo clear space and misuse rules
  - Colour and type specifications
  - Voice and imagery guidance
  - A list of gaps if you asked for an audit
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini and paste the full skill instructions.
  - Attach your logo files, or paste your colour codes, font names and voice notes. Add any examples of the brand in use.
  - Say if you want a new guide built or an old guide audited for gaps. For an audit, attach the old guide.
  - "Tell your AI which format you need: a document, a web page or a Notion page."
  - Read the result and fill any gaps it marks. Add real examples to each rule, then share the guide with your team.
output_sample:
  input:
    - Your logo files and variants
    - Your colours and fonts
    - Your voice and tone notes
    - Examples of your brand in real use (optional)
    - Your rules on what is required, flexible or banned (optional)
  prerequisites:
    - "A finished brand look: logo, colours, fonts and image style"
    - An AI that can read your attached files (optional, you can paste text instead)
  output:
    - name: Story
      contains: Why the brand exists, its mission, values, audience and what it rejects.
    - name: Logo system
      contains: Every logo version with clear space, minimum sizes, allowed colour uses and banned uses.
    - name: Color
      contains: Main, second and neutral colours with codes, allowed and banned pairings, and contrast notes.
    - name: Typography
      contains: Fonts, sizes, weights, line spacing, fallback fonts and banned type treatments.
    - name: Imagery and illustration
      contains: Photo and illustration style, icon rules and the kinds of images never to use.
    - name: Voice and tone
      contains: How the brand sounds, how tone shifts by context, words to use and avoid, with good and bad examples.
    - name: Applications
      contains: How the brand looks on web, email, social, print, packaging, signs and internal documents.
    - name: Dos and don'ts
      contains: Quick, scannable right and wrong examples for logo, colour, type, layout and voice.
