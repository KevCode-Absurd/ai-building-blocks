thinking: low
thinking_why: It collects a few choices into a style file.
new_slug: brand-style-setup-wizard
name: Brand style setup wizard
summary: Set up your brand style once with ten questions. Your colours and fonts are saved and reused when you convert Markdown to HTML.
job: brand-file
headline: Brand style setup wizard
subhead: Answer ten questions once. Get your colours, fonts and style saved for every page that follows. Use it before you convert Markdown to HTML, so every page comes out in your brand.
explain: |
  Set your colours, fonts and look once, and have every page you convert afterwards come out in your brand instead of plain defaults.

  The wizard asks ten questions: where files are saved, your main colours, fonts and similar choices. It saves the answers to a config file. Later conversions of notes into documents, reviews or slides read that file and apply the same twelve style values. A built-in checker tests that your text and background colours are readable under the WCAG AA standard, and it can build a matching palette from one colour. It needs Python on your computer and makes no AI calls. You can set a project-level override or reset it.
when:
  - You convert Markdown into HTML documents and want them to match your brand.
  - You want one saved style that every converted page and slide deck reuses.
  - You chose a brand colour and need to know if the text on it is readable.
  - One project needs a different look from your usual default.
not_for:
  - "You need a full design token system: use a design tool or your existing brand kit."
  - "You want to design or edit anything that is not Markdown converted to HTML: use your design tool instead."
  - "You want a full accessibility audit of a page: use a dedicated accessibility checker. This only checks text contrast."
you_give:
  - Answers to ten setup questions: save folder, main colour, accent colour, heading font, body font, look, code theme, contents style, company name and logo
  - A main brand colour (optional)
  - Font choices (optional)
  - A folder for saved output (optional)
you_get:
  - A saved brand style config
  - A matching colour palette
  - A contrast check against WCAG AA
  - Style applied to later conversions
  - Project-level overrides
how_to_use:
  - You need Python 3 and a terminal (or an AI that can run code). Nothing else is needed. Have your main colour, fonts, company name and logo link ready for the ten questions.
  - Download the skill folder and the Markdown to HTML converters. The converters are separate items on AI Blocks, and they are not in this folder: Markdown to web page maker (md-document), Code review page maker (md-review) and Markdown slide deck maker (md-slides). The wizard shows nothing by itself. The converters read your saved style.
  - Run onboard.py in a terminal, or ask an AI that can run code to run it. Answer the ten questions.
  - For a fast start with default choices, run onboard.py with the --defaults option.
  - To change one value, use --set, for example --set brand.primary=#FF6B35. Use --reset to start over.
  - If the contrast check fails, pick a darker main colour and run it again.
  - Next, run one converter on a short sample Markdown file to confirm your saved style is applied. Then convert your real pages.
next: [markdown-to-web-page-maker, markdown-slide-deck-maker, code-review-page-maker]
output_shape: |
  design-system.json
    version, skill, default_output_dir
    brand: primary, accent, bg, text
    typography: heading_font, body_font, scale_ratio
    design_style: editorial | technical | minimal | playful
    code_theme: light | dark | auto
    toc: behavior, max_depth
    company_name, logo_url
    derived_palette: twelve --md-* colour values
    setup_completed_at
  Contrast check: <pass or fail for body text and links at 4.5 to 1>
output_sample:
  input:
    - Your main brand colour and an accent colour (optional)
    - Your heading and body fonts from Google Fonts
    - "Your look: editorial, technical, minimal or playful"
    - Where to save converted files
    - Your company name and logo link (optional)
  prerequisites:
    - Python 3 on your computer, with no extra installs
    - An AI that can run code, or a terminal you can type in
    - The Markdown to HTML converters, so they can read the saved file
  output:
    - name: design-system.json
      contains: Your ten answers, saved once for all later conversions. It can be global or set for one project.
    - name: derived_palette
      contains: "Twelve colour values built from your brand: background, surface, border, text, muted text, accent, soft accent, code background, links, success and warning."
    - name: Contrast check
      contains: A pass or fail for body text and link colour against the 4.5 to 1 AA level. It will not save on a fail.
    - name: Project override
      contains: An optional file in your project folder that replaces the global style for that project only.
