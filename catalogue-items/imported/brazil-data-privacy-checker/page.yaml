thinking: medium
thinking_why: It applies a set law to your facts.
new_slug: brazil-data-privacy-checker
name: Brazil data privacy checker
summary: Check your LGPD compliance for Brazil. Describe how you handle personal data and get a gap table, legal bases and a fix plan.
job: check-contracts
headline: Brazil data privacy checker
subhead: A clear list of what Brazil's data protection law, the LGPD, asks of you, where you fall short, and what to fix first. It matters because fines can reach two percent of Brazilian revenue.
explain: |
  A clear list of what Brazil's data protection law, the LGPD, asks of you, where you fall short, and what to fix first. It matters because fines can reach two percent of Brazilian revenue.

  You describe what personal data you collect, why, where it goes and who sees it. The skill matches each use to a legal basis, checks sensitive data rules, and works out rights requests, breach reporting and when you need a data officer. Gaps go into a table with priority and action. It cites the law by article and notes where GDPR differs. It is guidance, not legal advice, so have a lawyer review it.
when:
  - You sell to customers in Brazil and are unsure what the law requires.
  - You need to pick a legal basis for a new way of using customer data.
  - You had a data leak and need to know who to tell and when.
  - You must send data out of Brazil and need to know the rules.
not_for:
  - "You only deal with EU or Portugal customers and need GDPR advice: ask a privacy lawyer in that region."
  - "You need rules for banking, health or other sector law: ask a lawyer who knows that sector."
  - "You need legal advice you can rely on or a signed opinion: take the result to a Brazilian data protection lawyer."
you_give:
  - A description of the personal data you hold
  - Why you collect it and who receives it
  - Where data is stored or sent, including the countries it goes to and which contracts or transfer rules you already use for each
  - Your current privacy policy (optional)
you_get:
  - A gap table with priority and action
  - Legal basis for each data use
  - Step-by-step rights request workflow
  - Breach notification checklist
  - Penalty exposure notes
how_to_use:
  - "Confirm before use: the skill carries several dated 2026 items that we have not checked. They are Brazil-EU mutual adequacy (January 2026), Lei 15.352/2026, Consulta Pública 1/2026 (closing 26 October 2026) and a reported R$153.7 million fine on ByteDance/TikTok. Confirm each on anpd.gov.br, the Diário Oficial da União or the EU Official Journal. Do not quote the fine or rely on the adequacy claim until you have. Until then, keep standard contractual clauses for every transfer."
  - Open Claude, ChatGPT or Gemini. Paste the skill text into the chat. No code or paid tool is needed.
  - Before anything else, list each country you send data to. Check ANPD's adequacy list on anpd.gov.br for each one, and read the transfer notes only after that.
  - Gather first: your company's revenue for the last financial year (the fine cap is 2% of Brazil revenue), a list of the data types you hold and where each comes from, and your current contracts for each country you send data to.
  - Describe the personal data you hold, why you collect it, where it is stored and who receives it.
  - "Say what you need: a gap check, a legal basis, a rights request plan, a breach plan or a transfer check."
  - Read the gap table first. Fix the high priority rows first.
  - Send your lawyer the gap table, the legal basis list and the transfer notes. Mark which items need their sign-off. First confirm each dated rule or fine on the ANPD website or in the Diário Oficial, because they change and the skill's dates are not checked by us.
  - Write each open item from the gap table in a log with an owner and a date. Run the check again after ANPD publishes the result of its sanctioning-rules consultation (the skill lists it as closing on 26 October 2026).
next: [privacy-policy-drafter, privacy-impact-assessment-writer]
output_sample:
  input:
    - A description of the personal data you collect and why
    - Where the data is stored and who receives it
    - Your current privacy policy (optional)
    - Your question, such as a gap check, a breach or a data transfer
  output:
    - name: Gap assessment table
      contains: Each LGPD requirement with your current state, the gap, a priority and a recommended action, with article citations.
    - name: Legal basis analysis
      contains: The legal basis that fits each way you use data, with extra checks for sensitive data.
    - name: Data subject request workflow
      contains: Step-by-step handling of rights requests from people, with timelines.
    - name: Breach response checklist
      contains: An incident timeline and a checklist for telling the data authority and affected people.
    - name: Penalty exposure table
      contains: The fines and other sanctions that could apply to your gaps, citing Art. 52.
    - name: LGPD and GDPR notes
      contains: Where Brazil's law is like GDPR and where it differs.
