thinking: low
thinking_why: It is a set of standard formulas.
new_slug: breakeven-point-calculator
name: Breakeven point calculator
summary: Give it your prices and costs. Get the breakeven volume, margin of
  safety and the effect of price changes.
job: run-your-store
headline: Breakeven point calculator
subhead: Find the sales volume where you stop losing money, and see how much
  room you have before you do. Then test what a price change or cost change does
  to profit.
explain: |
  Find the sales volume where you stop losing money, and see how much room you have before you do. Then test what a price change or cost change does to profit.

  You give prices, variable costs and fixed costs. The skill works out the profit per unit, the breakeven in units and in revenue, the volume needed for a target profit, and your margin of safety. It checks whether costs are split fairly, since items like overtime hide variable costs inside fixed ones. It also handles step costs, product mixes and one-off orders, where the answer depends on spare capacity. Use real history if you have it.
not_for:
  - "You need figures for tax or financial reports: ask your bookkeeper or accountant, because this is a planning tool."
  - "You have no cost data yet: gather your costs first, or use the Product profit analyst once you have revenue and costs by product."
  - "You want margins per order after ads and fees: use the Store profit margin calculator."
when:
  - You are setting a price and need to know how many sales cover your costs.
  - A customer wants a discount order and you need the lowest price that still
    pays.
  - You are about to rent a bigger space and want to see the new breakeven.
  - You hit your breakeven volume but still lost money and want to know why.
you_give:
  - Selling price per unit
  - Variable cost per unit
  - Fixed costs for the period
  - Target profit (optional)
  - Past sales and cost history (optional)
you_get:
  - Breakeven in units and revenue
  - Margin of safety
  - Volume for your target profit
  - Effect of price and cost changes
  - Notes on the assumptions used
how_to_use:
  - "Gather three things first: your selling price per unit, your variable cost per unit, and a list of fixed costs by line item for the period. Add 12 months of sales by product if you have them."
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. The skill works as pasted text alone. The Python script (scripts/calculate.py) and the reference file (references/cvp-patterns.md) are in this item, and they are optional extras. If your chat cannot run code, your AI does the sums itself and shows each formula. Check them in a spreadsheet.
  - Paste your numbers. Say whether you want the breakeven, a target profit, or the effect of a price or cost change.
  - Read the breakeven in units and in revenue, then the margin of safety. Check that the costs are split fairly between variable and fixed.
  - Ask for a price or cost change, and compare the new breakeven with the old one.
  - Next, check your margin on each order with the Store profit margin calculator, or compare products with the Product profit analyst.
next: [store-profit-margin-calculator, product-profit-analyst]
output_sample:
  input:
    - Selling price per unit
    - Variable cost per unit
    - Fixed costs for the period, by line item
    - Target profit (optional)
  prerequisites:
    - A chat AI. Running code is optional and only needed for the Python script
  output:
    - name: Cost structure
      contains: Your costs split into fixed, variable and step costs, with how each split was decided.
    - name: Breakeven
      contains: Breakeven in units and in revenue, with a description of the profit against volume chart, including any steps.
    - name: Decision answer
      contains: The specific question you asked, answered with the working shown.
    - name: Risk profile
      contains: Margin of safety, operating leverage and a table of what happens if price, volume or variable cost move.
terms:
  - term: contribution margin
    meaning: What each sale leaves after its own variable costs, to pay fixed costs and then profit.
  - term: margin of safety
    meaning: How far your sales can fall before you stop making a profit.
  - term: operating leverage
    meaning: How much your profit swings when sales change, because of your fixed costs.
