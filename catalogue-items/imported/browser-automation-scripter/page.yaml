thinking: medium
thinking_why: It writes and runs code, then fixes what breaks.
new_slug: browser-automation-scripter
name: Browser automation scripter
summary: Tell your AI what to click or check in a web browser. It writes and runs Playwright code, then gives you results and screenshots.
job: test-and-fix-code
headline: Browser automation scripter
subhead: Say what you want done in a web browser and get working Playwright code, run for you, with the results and screenshots. Good for checking a site, filling forms or testing a page.
explain: |
  Say what you want done in a web browser and get working Playwright code, run for you, with the results and screenshots. Good for checking a site, filling forms or testing a page.

  The skill first looks for running local sites and asks which one to use if there are several. It writes a fresh script in a temporary folder, never inside the skill, and opens a visible browser window so you can watch. The web address sits at the top of the script so you can change it. It runs the script and reports what happened. It needs Node.js and Playwright installed on your computer.
when:
  - You want to click through your site and confirm a flow works.
  - You need to fill the same web form many times.
  - You want screenshots of a page at different screen sizes.
  - You need to check that your local site loads without errors.
not_for:
  - "You want to scrape other people's websites: use a manual check or ask the site owner for the data."
  - "You would fill a live form that sends real emails or messages: test on a staging copy or check it by hand."
  - "You want a full test suite for your developers: ask your developer to set up tests in your site's own code."
you_give:
  - A plain description of what to do in the browser
  - The web address, or a local site running
  - Form values or login details for testing (optional)
you_get:
  - A Playwright script written for the task
  - The script run in a visible browser
  - A report of what happened
  - Screenshots of the result
how_to_use:
  - Use an AI that can run code on your computer, such as Claude Code. A plain chat window cannot run it.
  - Install the skill and run its setup step once. This installs Playwright and a browser.
  - Tell your AI what to do in the browser and give the web address. If you have a local site running, say so.
  - If it finds more than one local site, pick the one to use.
  - Watch the browser window while the script runs. Then read the results and open the screenshots.
  - Change the web address at the top of the script if you want to run it on another page.
  - Check the screenshots by hand before you share them. Pass any failing step to your developer or web host to fix.
output_sample:
  input:
    - What you want done in the browser, in plain words
    - The web address, or a local site that is running
    - Form values or test login details (optional)
  prerequisites:
    - An AI that can run code on your computer
    - Node.js and Playwright installed on your computer (the skill has a setup step)
  output:
    - name: Playwright script
      contains: A fresh script saved in a temporary folder, with the web address at the top so you can change it.
    - name: Visible browser run
      contains: The script runs in a browser window you can watch.
    - name: Results report
      contains: A list of steps with pass or fail, any error messages your AI saw, and the screenshot file names.
    - name: Screenshots
      contains: Images of the page saved during the run, such as at different screen sizes.
