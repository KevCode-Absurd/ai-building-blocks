thinking: medium
thinking_why: It converts by set rules and fixes odd cases.
new_slug: browser-test-migrator
name: Browser test migrator
summary: Move your Cypress or Selenium tests to Playwright, one file at a time. It sizes the job first, then converts and checks each file.
job: test-and-fix-code
headline: Browser test migrator
subhead: Move an old Cypress or Selenium test suite to Playwright without rewriting it all by hand. You get the tests converted one file at a time and can check each step.
explain: |
  Move an old Cypress or Selenium test suite to Playwright without rewriting it all by hand. You get the tests converted one file at a time and can check each step.

  The skill first detects which framework you use by scanning folders and project settings. It counts the test files, custom commands and fixtures, and rates the effort as small, medium or large. Small suites convert in order, medium ones in batches of five, and large ones go in parallel. Each file is changed using a mapping table, for example turning a visit call into a page goto call and a get into a locator. Playwright is set up first if it is missing.
when:
  - Your Cypress tests are slow and you want to move to Playwright.
  - You have old Selenium tests that nobody wants to maintain.
  - You want to convert one test file as a trial first.
  - You need an estimate of how big the migration is before you start.
not_for:
  - Your tests run on Jest, Mocha or Vitest. Keep them there, or ask a developer to port them by hand.
  - Your project has no Node setup. Set up Node first, or ask a developer to install Playwright for you.
  - You want to write new tests, not convert old ones. Write them in Playwright from the start.
you_give:
  - Your existing Cypress or Selenium test folder
  - Which framework it is (optional)
  - One file to start with (optional)
you_get:
  - A migration size assessment
  - Converted Playwright test files
  - Playwright setup if missing
  - Notes on commands that needed manual work
how_to_use:
  - Open your AI in a tool that can read your project folder and run commands. Playwright tests need Node installed.
  - Paste this skill into the chat. Say which framework you use, or let it find out.
  - Ask for the size assessment first. Check the file count and effort rating.
  - Start with one test file. Check the converted version and the test run result.
  - Then convert the rest. Small suites go in order. Medium ones go in groups of five.
  - Review the manual work list. Say yes or no before it deletes any old files.
output_sample:
  input:
    - Your Cypress or Selenium test folder
    - Which framework it is (optional)
    - One test file to start with (optional)
  prerequisites:
    - An AI that can read your project files and run commands
    - Node installed on your computer
    - Playwright, which the skill sets up if it is missing
  output:
    - name: Migration Assessment
      contains: Counts of test files, custom commands and fixtures, plus a small, medium or large effort rating.
    - name: Converted Playwright test files
      contains: Each old test rewritten with Playwright commands and sturdier locators, checked by a test run.
    - name: Converted commands and helpers
      contains: Cypress custom commands and Selenium page objects rewritten as Playwright fixtures or helper functions.
    - name: Conversion summary
      contains: Files converted and total tests moved.
    - name: Manual work list
      contains: Tests that could not be converted on their own and need a person.
    - name: Cleanup changes
      contains: Removed old dependencies and configs, plus updated CI and README. It asks you before deleting anything.
    - name: Before and after comparison
      contains: Test run results from the old suite next to the new one.
