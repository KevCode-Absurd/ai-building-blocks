job: test-and-fix-code
headline: Browser test setup builder
subhead: Point it at your project. Get Playwright installed with a config, a
  sample test and a CI file. Bring your project folder. Use the result to plan
  your next step.
explain: |
  Playwright installed and ready to run in your project in one pass: a config, a folder layout, a sample test and a CI file that runs it on every change.

  The skill scans your project to see what you use, such as React, Next.js, Vue or Angular, whether you write TypeScript, and whether tests or CI already exist. It installs Playwright if needed, then writes a config that fits your framework, including the dev server, the base address, retries on CI and screenshots on failure. It adds one working example test and a GitHub Actions workflow. It needs Node.js and npm.
when:
  - You have no browser tests yet and want a clean start.
  - You use Next.js or Vite and want the right config without reading docs.
  - You want tests to run automatically on every pull request.
  - Your current Playwright setup is a mess and you want a fresh baseline.
you_give:
  - Your project folder
  - Your framework, if the skill cannot detect it (optional)
  - Your CI preference (optional)
you_get:
  - Playwright installed
  - A config matched to your framework
  - A folder structure
  - A working sample test
  - A CI workflow file
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read your project files.
