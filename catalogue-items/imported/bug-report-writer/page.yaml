thinking: low
thinking_why: It sorts rough notes into a set template.
new_slug: bug-report-writer
name: Bug report writer
summary: Turn a messy error log, voice note or screenshot into a clear GitHub issue with steps to repeat, impact and proof, ready to file.
job: build-software
headline: Bug report writer
subhead: Paste your error log, notes or a voice transcript. Your AI turns it into a GitHub issue with steps to repeat, expected and actual results, and a severity rating. Anything it cannot tell from your notes is marked as unknown.
explain: |
  A messy error log, a voice note or a screenshot becomes a clean GitHub issue someone can act on in minutes.

  The skill fills a fixed layout: a one-line summary, environment, numbered steps to repeat, expected result, actual result, error text, visual evidence, impact and extra context. It pulls facts out of casual speech and labels anything missing or guessed rather than inventing it. Sensitive values become placeholders such as a project name tag. Severity runs from critical to low, based on impact. It saves the draft as a dated markdown file and does not post the issue publicly unless you say so.
when:
  - You have a raw error log and need a proper issue from it.
  - A teammate sent a rambling voice note about a bug.
  - You have a screenshot of the problem and no write-up.
  - Your bug reports keep coming back with questions.
not_for:
  - "You want a new feature or have a how-to question: use your project's discussion board or a support ticket."
  - "You need to find the cause of the bug: ask a developer to debug it, or paste the code and error into your AI."
  - "You want the issue posted for you: this skill only saves a draft, so paste it into GitHub yourself."
you_give:
  - Error logs, notes or a voice transcript
  - Screenshots or short recordings (optional)
  - The product, region or version (optional)
you_get:
  - A GitHub issue draft with a one-line summary and steps to repeat
  - Expected and actual results side by side
  - A severity rating with a short reason
  - Placeholders for sensitive details such as project names and user IDs
  - A draft saved as a dated markdown file, if your AI can save files
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste your error log, note or transcript. Add the product and version if you know them.
  - Answer any questions about missing details. If you don't know, say so and it will mark them as unknown.
  - Read the draft. Check the steps to repeat and the severity rating. Steps you did not give are marked unknown, not guessed.
  - The source collection labels this skill "risk critical". It only writes text and changes nothing, but a wrong bug report can send your team the wrong way, so check it before you file it.
  - Save the dated file. If your AI cannot save files, copy the text into one yourself.
  - Paste the draft into your project's issue tracker yourself. Check the severity with your team before you file it.
output_sample:
  input:
    - Error logs, rough notes or a voice transcript
    - Screenshots or short recordings (optional)
    - The product, region or version (optional)
  output:
    - name: Summary
      contains: A one-line description of the bug.
    - name: Environment
      contains: Product, region or version, and browser or OS, with unknown details labeled as unknown.
    - name: Reproduction Steps
      contains: Numbered steps someone can follow to see the bug.
    - name: Expected Behavior and Actual Behavior
      contains: What should happen next to what really happens.
    - name: Error Details
      contains: The error message or code, copied as given.
    - name: Visual Evidence
      contains: Pointers to your screenshots or recordings, with no made-up links.
    - name: Impact
      contains: A severity of Critical, High, Medium or Low, with a short reason.
    - name: Additional Context
      contains: Any other useful detail from your notes.
    - name: Dated markdown file
      contains: The full draft saved as a file named with the date and a short description.
