thinking: medium
thinking_why: It weighs several risks and picks a first test.
new_slug: build-risk-reviewer
name: Build risk reviewer
summary: Check a product idea before you build it. Describe it and get the biggest risks, the smallest test to run first, and a clear continue or stop call.
job: test-an-idea
headline: Build risk reviewer
subhead: Find out if what you plan to build is worth building, before you write any code. You get the biggest risks named and the smallest test to try first.
explain: |
  Find out if what you plan to build is worth building, before you write any code. You get the biggest risks named and the smallest test to try first.

  The skill restates your idea in one sentence: who it is for, the job they need done and what they do now. It then checks the main risks: real demand, fit with their workflow, willingness to switch, how people will find it, pricing, data access and running costs. It prefers specific doubts to vague brainstorming. It proposes one small test, like a buyer chat, a landing page or a manual version. If risk is low it moves on to build with the assumptions written down. If high, it says stop.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to bin1874 and sickn33.
when:
  - You are about to ask an AI to build an app and are unsure anyone wants it.
  - A feature sounds good but you cannot say why users would switch.
  - You have a side project idea and want a cheap way to test it.
  - You need to write down your assumptions before building.
not_for:
  - "You already have paying users or a clear written spec: skip the review and start building, or talk to your customers."
  - "You need real market research or proof of demand: talk to buyers yourself or hire a researcher, because this only surfaces doubts."
  - "You need legal, financial or expert advice on the idea: ask a qualified person."
you_give:
  - What you plan to build
  - Who you think will use it
  - What they use today (optional)
  - How you plan to reach them (optional)
you_get:
  - The build bet in one sentence
  - The biggest risks
  - The smallest validation test
  - A continue or stop call
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. It needs no code, files or paid tools.
  - Gather first: who the buyer is, what they do today to solve the problem, a rough idea of what they would pay, and how you would reach them.
  - Describe what you plan to build and who it is for. Add what they use today and how you will reach them, if you know.
  - Read the risks it names. Check that each one is a real doubt about your idea, not a generic list.
  - Run the smallest test it suggests before you build anything.
  - If it says stop, do the smaller test first. If it says continue, keep the written assumptions and start building.
  - Next, plan the first version with the SaaS MVP roadmap planner, or plan the buyer chats with the User research planner.
next: [saas-mvp-roadmap-planner, user-research-planner]
output_shape: |
  BUILD BET     <one sentence: who, the job, what they use today>
  MAIN RISKS    <the top three, ranked by how much each could sink the build>
  SMALLEST TEST <one cheap step to run before building>
  CALL          <continue with assumptions written down, or stop and run a smaller test>
output_sample:
  input:
    - What you plan to build
    - Who you think will use it
    - What they use today (optional)
    - How you plan to reach them (optional)
  output:
    - name: Build bet
      contains: One sentence naming the user, the job they need done and what they use today.
    - name: Main risks
      contains: Specific doubts about demand, workflow fit, switching, reaching buyers, pricing, data access and running effort.
    - name: Smallest test
      contains: One cheap step to try before building, such as a buyer chat, landing page, manual version or paid pilot.
    - name: Continue or stop call
      contains: Build with your assumptions written down, or run a smaller test first if the risk is high.
