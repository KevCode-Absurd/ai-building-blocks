thinking: high
thinking_why: Option rules and pricing conflicts need careful logic.
new_slug: build-your-own-product-designer
name: Build-your-own product designer
summary: Plan a build-your-own product tool people finish. Get the options to show, smart defaults, option rules, live pricing and a save plan.
job: build-product
headline: Build-your-own product designer
subhead: A plan for a build-your-own product tool that people finish, not abandon. It covers the choices to show, the rules between them, live pricing, checks and saving.
explain: |
  A plan for a build-your-own product tool that people finish, not abandon. It covers the choices to show, the rules between them, live pricing, checks and saving.

  The skill points to the two common failures: showing every option at full detail, which freezes buyers, and calling three fixed bundles "custom". Its fix is smart defaults that give a sensible start, rules that block invalid combinations and say why, a way into deeper options for those who want them, and a price that updates as they choose. It also decides which options deserve to be shown at all, and when plain bundles are the better answer.
when:
  - You are scoping a configurator for the first time.
  - Your current builder has many people quitting halfway.
  - You need rules that stop customers picking combinations that cannot be made.
  - You are not sure which options to show and which to hide.
not_for:
  - "You only have a few fixed sets of choices: sell plain bundles on a normal product page instead."
  - "You need the tool built and coded: hand this plan to a developer or a configurator app."
  - "You want to fix a normal checkout that people quit: review the cart and checkout steps with a person, not this plan."
you_give:
  - The product and all its options
  - Which combinations are not allowed
  - Pricing rules
  - Current drop-off data (optional)
you_get:
  - A shortlist of options to show
  - Smart default choices
  - Rules for blocking invalid combinations
  - A live pricing approach
  - Save and share ideas
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text. No code or paid tool is needed.
  - Paste your product and the full list of options.
  - Add the pairs of options that cannot go together, and your price table.
  - Add your drop-off data if you have it (optional).
  - "Ask for the plan in this order: list the options, set the defaults, write the rules for invalid combinations, price each choice, then define save and add-to-cart. Check that each rule has a clear message the buyer would understand."
  - Next, give the plan to your developer or builder tool. Test it first by handing the build to a stranger in your target audience. Check that they reach a buyable build in under 5 minutes.
output_sample:
  input:
    - Your product and all its options
    - Pairs of options that cannot go together
    - Your price table and pricing rules
    - Your drop-off data from the current builder (optional)
  output:
    - name: Option shortlist
      contains: The choices worth showing up front, and the ones to hide behind a deeper customise step.
    - name: Default configuration
      contains: A sensible starting build so buyers begin with something that works.
    - name: Constraint rules
      contains: Each rule that blocks a bad combination, with the message the buyer sees explaining why.
    - name: Pricing approach
      contains: How the price updates as people choose, and how the cost of each choice is shown.
    - name: Save and share choice
      contains: How buyers keep, return to and share their build, and which method fits your product.
    - name: Bundles check
      contains: A view on whether plain bundles would serve you better than a full builder.
