thinking: medium
thinking_why: Wrong prices cost money, so it checks limits.
new_slug: bulk-price-changer
name: Bulk price changer
summary: Change prices for a whole Shopify collection or tag at once, with a floor and ceiling. Preview every old and new price before it goes live.
job: set-prices
headline: Bulk price changer
subhead: Change prices across a whole collection or tag in one go, within a floor and a ceiling you set. It edits live prices, so preview first.
explain: |
  Change prices across a whole collection or tag in one go, within a floor and a ceiling you set. It edits live prices, so preview first.

  You name a collection or product tag, then say whether to adjust by percent or by a fixed amount. A negative value means a discount. Minimum and maximum prices keep any variant from going too low or too high. The skill can run in preview mode that lists every change without applying it. Use it for storewide sales, ending a promotion, passing on a supplier increase or aligning prices. It works through Shopify, so you need the CLI signed in with permission to read and write products.
when:
  - You are running a ten percent sale on one collection.
  - A promotion ended and prices must go back.
  - Your supplier raised costs and you need to pass that on.
  - You want to see every price change before it goes live.
not_for:
  - "You want to change one product's price: edit it in the Shopify admin product page."
  - "You want prices set from your cost and a target margin: use a costing spreadsheet or a pricing tool."
  - "You cannot sign in to Shopify with a command line tool: change prices in the Shopify admin or with a CSV import."
you_give:
  - Your store address
  - A collection or product tag
  - Percent or fixed adjustment and amount
  - Minimum and maximum price (optional)
you_get:
  - A preview of old and new prices
  - Updated prices on every variant
  - Price limits applied
  - A summary of what changed
how_to_use:
  - Use an AI that can run commands and sign in to Shopify, such as Claude Code, Cursor, Codex or Gemini CLI. A normal chat window cannot change your store.
  - Sign in to your store with the Shopify CLI first. Your login needs permission to read and write products.
  - Give your AI the skill and tell it your store address, the collection or tag, and the percent or fixed change. Add a lowest and highest price if you want limits.
  - The skill always starts with a preview and changes nothing. Check the CSV of old and new prices against what you expect, and check it lists every variant.
  - Say a clear yes to apply the change only when the preview looks right. If you change anything, ask for a new preview first. Prices go live at once and there is no bulk undo.
  - Open a few products in the Shopify admin to check the new prices. Errors are logged but do not stop the run.
output_sample:
  input:
    - Your store address
    - A collection or a product tag
    - Percent or fixed change, and the amount (a minus sign means a discount)
    - Lowest and highest allowed price (optional)
    - Your yes to apply, given after you check the preview
  prerequisites:
    - An AI that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI
    - Shopify CLI signed in to your store
    - Permission to read and write products
  output:
    - name: Preview run
      contains: A list of each variant with its old and new price, shown before anything is changed.
    - name: price_changes_<date>.csv
      contains: One row per variant with product ID, variant ID, SKU, title, old price and new price.
    - name: Live price update
      contains: New prices written to every variant in the collection or tag, kept within your lowest and highest price.
    - name: Outcome summary
      contains: A short count of what changed and how many errors came back.
