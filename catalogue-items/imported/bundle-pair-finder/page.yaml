thinking: medium
thinking_why: It counts patterns, then picks the useful ones.
new_slug: bundle-pair-finder
name: Bundle pair finder
summary: Find which products your Shopify customers buy together. Get ranked pairs from real orders to plan bundles and cross-sells.
job: run-your-store
headline: Bundle pair finder
subhead: Find which products your customers already buy together, so your bundles and cross-sells start from real orders, not hunches. It only reads data and changes nothing.
explain: |
  Find which products your customers already buy together, so your bundles and cross-sells start from real orders, not hunches. It only reads data and changes nothing.

  The skill looks at your Shopify orders over a set window, 180 days by default. For every order with two or more products, it counts pairs, or triples if you ask. It scores each combination by support (how many orders), confidence (how often B follows A) and lift (how much more often they sell together than by chance). You can limit by collection and set a minimum count. You need the Shopify CLI signed in with read access to orders and products.
when:
  - You want to design a bundle that people already want.
  - You need ideas for "frequently bought together" suggestions.
  - You want to know which products sell together by more than chance.
  - You are planning a promotion and need product pairings.
not_for:
  - "Your store has few orders with more than one product: use a longer order window, or plan bundles by hand from what you know about your buyers."
  - "You want to change prices, bundles or products in your store: this only reads orders, so make those changes yourself in Shopify admin."
  - "You have no Shopify store or no access to its orders: pull an order export from your sales tool and look for repeat pairs by hand."
you_give:
  - Your store address
  - How many days of orders to look at (optional)
  - A collection to focus on (optional)
  - Pair or triple size (optional)
you_get:
  - A ranked list of product pairs or triples
  - Support, confidence and lift scores
  - Bundle candidates
  - Cross-sell ideas
how_to_use:
  - Check that you have the Shopify CLI signed in to your store with read access to orders and products.
  - Open an AI that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot reach your store.
  - Paste the skill and give your store address. Add days, a collection or triples if you want them.
  - Check the order count first. If few orders had two or more products, run it again with a longer window.
  - Use the top pairs to plan bundles by hand. Pairs with high lift are the strongest ideas. A store with over 250 orders in the window needs several passes, so the run takes longer.
  - Next, check the pairs against the Top product ranker, then build the bundle or cross-sell offer from the CSV.
output_sample:
  input:
    - Your store address
    - How many days of orders to look at (optional)
    - A collection to focus on (optional)
    - Pair or triple size (optional)
  prerequisites:
    - An AI that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI
    - Shopify CLI signed in to your store with read access to orders and products
  output:
    - name: Summary
      contains: How many days and orders were checked, how many pairs were found, and how many met the minimum order count.
    - name: Top pairs by lift
      contains: Ranked product pairs, each with its order count, lift and how often one follows the other.
    - name: Bundle candidates
      contains: Pairs that sell together often and by more than chance, as ideas for bundles.
    - name: fbt_pairs CSV file
      contains: One row per pair with product names, support, confidence both ways, lift and average combined price.
