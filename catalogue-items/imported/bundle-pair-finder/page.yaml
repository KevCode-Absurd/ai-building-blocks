new_slug: bundle-pair-finder
name: Bundle pair finder
summary: Run it on your orders. Get the product pairs and triples people buy
  together, as ideas for bundles and cross-sells.
job: run-your-store
headline: Bundle pair finder
subhead: Find which products your customers already buy together, so your
  bundles and cross-sells start from real orders, not hunches. It only reads
  data and changes nothing.
explain: |
  Find which products your customers already buy together, so your bundles and cross-sells start from real orders, not hunches. It only reads data and changes nothing.

  The skill looks at your Shopify orders over a set window, 180 days by default. For every order with two or more products, it counts pairs, or triples if you ask. It scores each combination by support (how many orders), confidence (how often B follows A) and lift (how much more often they sell together than by chance). You can limit by collection and set a minimum count. You need the Shopify CLI signed in with read access to orders and products.
when:
  - You want to design a bundle that people already want.
  - You need ideas for "frequently bought together" suggestions.
  - You want to know which products sell together by more than chance.
  - You are planning a promotion and need product pairings.
you_give:
  - Your store address
  - How many days of orders to look at (optional)
  - A collection to focus on (optional)
  - Pair or triple size (optional)
you_get:
  - A ranked list of product pairs or triples
  - Support, confidence and lift scores
  - Bundle candidates
  - Cross-sell ideas
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin.
