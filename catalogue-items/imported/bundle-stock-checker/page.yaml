thinking: low
thinking_why: It compares stock counts by set rules.
new_slug: bundle-stock-checker
name: Bundle stock checker
summary: Check your Shopify bundles for missing parts. Find bundles that show in stock but can't ship, and see how many you can really sell.
job: run-your-store
headline: Bundle stock checker
subhead: Find bundles that look in stock on your storefront but cannot be shipped because one part ran out. It only reads data and changes nothing.
explain: |
  A bundle can only be sold as often as its scarcest part allows. The skill names that bottleneck part for each bundle, and flags every bundle that part blocks.

  The skill goes through every product marked as a bundle, using Shopify's own bundle setup or a metafield that lists the component variants and quantities. For each part it compares stock on hand against what one bundle needs. An optional safety buffer treats a part as out when stock minus the buffer falls short. It reports which bundles are at risk and how many you can truly sell. You need the Shopify CLI signed in with read access to products and inventory.
when:
  - A customer bought a bundle that you could not ship.
  - You want to check every bundle before a big sale.
  - One component is running low and you need to know which bundles it affects.
  - You want a safety buffer so parts do not hit zero.
not_for:
  - "You have single products with no bundle setup: use the restock-list-builder skill, or check stock in your Shopify admin."
  - "You want to change stock counts or hide a bundle: this only reads data, so make those changes in Shopify yourself."
  - "Your store is not on Shopify: ask a person on your team to compare parts by hand, since this needs Shopify access."
you_give:
  - Your store address
  - "Where your bundle parts are listed: Shopify's own bundle setup, or a bundle metafield (Settings, then Custom data, then Products) holding a list such as [{\"variantId\": \"[VARIANT ID]\", \"quantity\": [NUMBER]}]"
  - A safety stock number (optional)
  - Whether to check active products only (optional)
you_get:
  - Each bundle checked part by part
  - Bundles that cannot be fulfilled
  - How many bundles you can really sell
  - The part that is the bottleneck
how_to_use:
  - Install the Shopify CLI on your computer. It is free. Use an AI tool that can run code, such as Claude Code, Cursor, Codex or Gemini CLI. Some of these need a paid plan, so check the tool's pricing first.
  - Sign in with the store auth command. Give it your store address and the read_products and read_inventory scopes.
  - Paste this skill into your AI. Add your store address, and your bundle metafield namespace and key if you use them.
  - Add a safety stock number or active-only setting if you want one (optional).
  - Let your AI run the checks. It only reads data and changes nothing. It counts on-hand stock minus your safety stock. A part that Shopify does not track is listed for review, since it could make the count too high.
  - Open the bundle_availability CSV. Fix the broken bundles first, starting with the bottleneck part. To restock it, use restock-list-builder. To fix a wrong count, use stock-count-updater.
  - This skill was not run on a live store for this catalogue. Before you trust the first result, spot-check two bundles by hand in your Shopify admin. This is an MIT-licensed copy of the upstream skill from 40rty AI.
output_sample:
  input:
    - Your store address
    - The place where your bundle parts are listed (optional)
    - A safety stock number (optional)
    - Whether to check active products only (optional)
  prerequisites:
    - An AI that can run code, such as Claude Code, Cursor, Codex or Gemini CLI
    - The Shopify CLI signed in with read access to products and inventory
  output:
    - name: Run summary
      contains: Counts of bundles checked, fully buildable, low on parts, and broken, plus the top broken bundles and their bottleneck part.
    - name: bundle_availability CSV
      contains: One row per bundle with how many you can build, the bottleneck part, what it needs, and what you have.
    - name: Status column
      contains: Marks each bundle as fully buildable, constrained, or broken, so you can see which need action first.
    - name: Error notes
      contains: Bundles skipped for bad setup, deleted parts, or untracked stock, with a short reason for each.
