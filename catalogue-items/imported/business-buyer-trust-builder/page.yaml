thinking_why: It fits a trust plan to a long sales cycle.
new_slug: business-buyer-trust-builder
name: Business buyer trust builder
summary: Say who buys from you. Get a plan for thought leadership and trust with slow, careful business buyers.
job: plan-strategy
headline: Business buyer trust builder
subhead: Say who buys from you. Get a plan for thought leadership and trust with slow, careful business buyers.
explain: |
  A brand plan for selling to companies, where buyers are careful, slow and spending money that is not theirs. Trust matters more than hype.

  You describe your product, ideal customer, the people on the buying committee, your sales cycle, your current presence and competitors. The skill builds a system for each kind of buyer in the group, from the champion who wants to try it to the one who signs the cheque and the one who checks security. It covers positioning, thought leadership, proof and staying visible during cycles that can last over a year. The plan combines logical reasons with the reassurance buyers need.
when:
  - You sell to businesses and deals take months.
  - Several people must agree before anyone buys from you.
  - You want to build authority in a crowded category.
  - You need content that keeps you visible during a long sales cycle.
you_give:
  - Your product or service
  - Your ideal customer profile
  - The roles on the buying committee
  - Sales cycle length
  - Competitors you face
you_get:
  - A B2B brand positioning
  - Messages for each buyer role
  - A thought leadership plan
  - Proof and trust assets
  - A plan to stay visible during long cycles
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
