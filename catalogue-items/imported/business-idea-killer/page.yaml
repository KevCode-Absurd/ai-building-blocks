thinking: high
thinking_why: It has to hunt for the fatal flaw, not just agree.
new_slug: business-idea-killer
name: Business idea killer
summary: Give it a business idea. Get the one fact that kills it, or the
  cheapest test it still has to pass.
job: test-an-idea
headline: Business idea killer
subhead: Before you spend money or weeks, find the one fact that kills your
  idea. If it survives, you get the cheapest test it still has to pass.
explain: |
  Before you spend money or weeks, find the one fact that kills your idea. If it survives, you get the cheapest test it still has to pass.

  The skill acts like a pathologist, not a cheerleader. If you keep a list of past rejected ideas, it checks that first: the same niche means dead, and a matching failure pattern becomes a strong warning to test. Otherwise it runs named kill checks and ends in a hard verdict. DEAD comes with the pattern that killed it. SURVIVED comes with one cheap test that could still end it. It can start your kill list file if you allow it.
when:
  - You have a new business idea and want honest feedback.
  - You want to know if you should build something before you spend time.
  - You have many ideas and need a fast way to rule out the weak ones.
  - You want a cheap test to run before committing.
you_give:
  - Your business idea in a few lines
  - Who you plan to sell to
  - Your list of past rejected ideas (optional)
you_get:
  - "A verdict: dead or survived"
  - The kill pattern named, if dead
  - The cheapest remaining test, if survived
  - A row for your kill list
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can search the web.
