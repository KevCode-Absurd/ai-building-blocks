thinking: high
thinking_why: It has to hunt for the fatal flaw, not just agree.
new_slug: business-idea-killer
name: Business idea killer
summary: "Test a business idea before you build it. Get a clear verdict: dead, with the reason, or survived, with the cheapest test left to run."
job: test-an-idea
headline: Business idea killer
subhead: Before you spend money or weeks, find the one fact that kills your idea. If it survives, you get the cheapest test it still has to pass.
explain: |
  Before you spend money or weeks, find the one fact that kills your idea. If it survives, you get the cheapest test it still has to pass.

  The skill acts like a pathologist, not a cheerleader. If you keep a list of past rejected ideas, it checks that first: the same niche is a strong sign it is dead, unless the offer, buyer or market has changed since, and a matching failure pattern becomes a strong warning to test. Otherwise it runs named kill checks and ends in a hard verdict. DEAD comes with the pattern that killed it. SURVIVED comes with one cheap test that could still end it. It can start your kill list file if you allow it. It is a thinking aid, not a forecast, and it does not give legal, tax or money advice. Licence: this skill follows the MIT licence in its original header and the included LICENSE file. Keep the source notices and author credits. We also retain the collection's LICENSE-CONTENT file.
when:
  - You have a new business idea and want honest feedback.
  - You want to know if you should build something before you spend time.
  - You have many ideas and need a fast way to rule out the weak ones.
  - You want a cheap test to run before committing.
not_for:
  - Your idea already has paying customers. Use Market size estimator to size the market instead.
  - You need legal, tax or money advice. Talk to a lawyer or an accountant.
  - You want help planning the build. Run this first, then plan only if the idea survives.
you_give:
  - Your business idea in a few lines
  - Who you plan to sell to
  - Your list of past rejected ideas (optional)
you_get:
  - "A verdict: dead or survived"
  - The kill pattern named, if dead
  - The cheapest remaining test, if survived
  - A row for your kill list
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - "Gather three things first: the price you plan to charge, who will buy, and what the customer gets. Then describe your idea in a few lines with those details."
  - Paste your kill list if you have one. If not, say yes or no to starting one.
  - Answer the questions. Your AI asks you to look in the Meta Ad Library yourself and report back what you see.
  - Read the verdict. It is the last block of the answer, and it names the one sentence that decided it. If the idea survived, run the one test it names before you spend anything. A survived verdict is not a green light to build.
  - Next, plan that one test with the Five-day idea test planner, or talk to buyers with the Customer interview coach.
next: [five-day-idea-test-planner, customer-interview-coach]
output_sample:
  input:
    - Your business idea in a few lines
    - Who you plan to sell to
    - The price you plan to charge (optional)
    - Your kill list file, REJECTION.md (optional)
  prerequisites:
    - A browser, so you can check the Meta Ad Library yourself
    - Your OK for your AI to start a kill list file (optional)
  output:
    - name: Kill-list check
      contains: Whether your idea matches a past rejected idea or a failure pattern you have seen before.
    - name: Five filters
      contains: A yes or no on real pain, buyer with money, proven demand, legal to charge, and a moat.
    - name: Free-AI test
      contains: Whether one prompt to a top AI makes the whole product for free.
    - name: Live-market check
      contains: "A checklist for the Meta Ad Library: active advertisers, age of the oldest ad, and three traps."
    - name: Verdict
      contains: Dead or survived, the kill pattern, the one deciding sentence, the evidence, and the next test.
    - name: Kill-list row
      contains: A one-line entry for your kill list, saved to the file only if you agree.
