thinking: medium
thinking_why: It runs the numbers and weighs risk.
new_slug: business-investment-analyst
name: Business investment analyst
summary: Give it a purchase's cost and savings. Get payback time, return and value in today's money (ROI, NPV and IRR), risks and a clear answer.
job: money-and-investing
headline: Business investment analyst
subhead: "Work out whether a business purchase pays off: payback time, return and risk, with a clear recommendation and the assumptions behind it. It is for business spending, not personal stocks."
explain: |
  Work out whether a business purchase pays off: payback time, return and risk, with a clear recommendation and the assumptions behind it. It is for business spending, not personal stocks.

  You describe the item, such as equipment, a hire, software, space or a vendor contract, plus its cost, life span and expected savings or extra revenue. The skill calculates ROI, payback, NPV and IRR, then tests an upside and a downside case. It states every assumption and flags what could go wrong. You can compare several options side by side. Partial data is fine, as long as it is labelled. It does not give personal investing advice.
when:
  - You are deciding whether to buy a machine or software.
  - You are weighing a new hire against another use of the same money.
  - You have three options and need to see them side by side.
  - You want a payback figure to show your boss or partner.
not_for:
  - "You want advice on personal stocks or your own savings: talk to a licensed financial adviser, as this tool only covers business spending."
  - "You need a startup runway, burn rate or fundraising plan: use a CFO or finance adviser, not this one."
  - "You want to value a whole company from its financial statements: use a financial analyst or a valuation tool."
you_give:
  - What the investment is and its upfront cost
  - Expected savings or extra revenue
  - Ongoing costs
  - Alternatives or your cost of capital (optional)
you_get:
  - Payback, ROI, NPV and IRR
  - Upside and downside scenarios
  - A clear recommendation
  - Assumptions and risks flagged
  - A comparison table for several options
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code or files are needed.
  - Gather the upfront cost, the useful life, the expected savings or extra revenue, the ongoing costs, and any alternatives or your cost of capital.
  - Paste those details and ask whether the purchase is worth it. If a number is missing, it should ask you, not guess.
  - Read the payback, ROI, NPV and IRR, then the upside and downside cases. The downside case assumes projections miss by 40%.
  - Check each assumption it flags in red. Then take the recommendation to a finance professional before you commit money.
output_sample:
  input:
    - What you plan to buy, such as equipment, a hire, software, space or a vendor contract
    - The upfront cost and how long it will last
    - Expected savings or extra revenue per month or year
    - Ongoing costs such as upkeep, fees or salary
    - Other options or your cost of borrowing (optional)
  output:
    - name: Recommendation
      contains: "A clear call at the top: proceed, proceed with conditions, or do not proceed."
    - name: The numbers
      contains: A table with total investment, yearly net cash flow, payback, 3-year ROI, NPV, IRR and a score out of 30.
    - name: Key assumptions
      contains: Every assumption used, each tagged by how sure it is, so weak guesses stand out.
    - name: Upside case
      contains: How the result looks if things go 20% better than planned.
    - name: Downside case
      contains: How the result looks if things go worse than planned.
    - name: Risks to watch
      contains: The main risks, each with a way to reduce it.
    - name: Next step
      contains: One action to take before you commit any money.
