thinking: high
thinking_why: It asks questions and checks that every block fits the others.
new_slug: business-model-canvas-builder
name: Business model canvas builder
summary: Build a business model canvas for your business. Give it your offer, customers and income. You get nine blocks and a list of gaps to fix.
job: plan-strategy
headline: Business model canvas builder
subhead: Describe your business, who buys from you and how you earn money. It fills the nine blocks of a Business Model Canvas, starting with the match between your offer and your customers. You get the canvas, a cost and revenue consistency check and a list of gaps to fix.
explain: |
  A nine-block Business Model Canvas for your business, checked so that customers, value, costs and revenue all line up.

  The skill follows Osterwalder's method. It begins by locking your value proposition to your customer segments, since the rest depends on that match. Then it builds channels, customer relationships, key activities, resources and partners. A last pass checks consistency: every key activity must show up in the cost structure, and revenue streams must fit the segments. Use it to design a new business, audit an existing one, or test the logic before a pivot.
when:
  - You are designing a new business and need the whole model on one page.
  - You want to check whether your costs and revenue really fit your customers.
  - You are thinking about a pivot and need to test the logic.
  - Your business feels fine but profit is thin and you cannot see why.
not_for:
  - "You need market proof that people will buy: talk to real customers or run a small test first."
  - "You need a profit and loss forecast or cash plan: build it in a spreadsheet or ask an accountant."
  - "You need legal advice on company structure: ask a lawyer or an accountant."
you_give:
  - A description of your business
  - Who your customers are
  - How you earn money
  - Main costs (optional)
you_get:
  - A nine-block canvas
  - Value and customer match check
  - Cost and revenue consistency check
  - A list of gaps to fix
how_to_use:
  - Gather your customer types, your prices, and your main cost figures before you start.
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code, files or paid tools are needed.
  - Describe your business, who buys from you and how you earn money. Add your main costs if you know them.
  - Answer any questions your AI asks. It works in three rounds: your offer and customers, the rest of the canvas, then a cost and revenue check. It is done when the canvas has all nine blocks and the check finds no clash.
  - "Check the first two blocks: does your offer really match your customers? Fix this before you go on."
  - Read the consistency check and the gaps list. Fix each gap, then ask your AI to check again.
  - Next, test the riskiest block in five customer conversations, or hand the cost block to a spreadsheet.
output_sample:
  input:
    - A description of your business
    - Who your customers are
    - How you earn money
    - Your main costs (optional)
  output:
    - name: Value proposition and customer segments
      contains: What you offer and who it is for, checked so the two match before anything else is filled in.
    - name: Channels and customer relationships
      contains: How customers find you, buy from you and stay in touch with you.
    - name: Key activities, resources and partners
      contains: The work you must do, what you need to do it, and who helps you.
    - name: Cost structure and revenue streams
      contains: What you pay for and how you earn, with each key activity matched to a cost.
    - name: Consistency check
      contains: A check that costs, activities and income fit your customers and your offer.
    - name: Gaps to fix
      contains: A list of places where the nine blocks do not fit together.
