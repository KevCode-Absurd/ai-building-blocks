thinking_why: Modelling a domain needs real judgment about where concepts split.
new_slug: business-model-code-designer
name: Business model code designer
summary: Describe your business rules. Get areas, shared terms and clusters of data that map to your code. Uses domain-driven design.
job: build-software
headline: Business model code designer
subhead: Describe your business rules. Get areas, shared terms and clusters of data that map to your code. Uses domain-driven design.
explain: |
  Your code starts to match how your business really talks. Describe your rules, and you get a map of the separate areas of the business, the exact words each area uses, and the clusters of data that must change together. Each area becomes its own boundary in the code, so one team's change does not break another's.

  The method is domain-driven design. It begins with a shared vocabulary that you and the code both use. Then it finds the boundaries, picks the core area worth the most effort, and sets how areas talk to each other. It ends with a score out of 10 and a list of the checks that failed.
when:
  - Your code uses technical names and nobody in the business recognises them.
  - You need to split a big system into smaller services and do not know where the lines go.
  - Business rules are scattered across many files and keep going out of sync.
  - You want a plain check of how well your model fits the business.
you_give:
  - A description of your business rules and processes
  - The words your team uses for key things
  - Your current code or system layout (optional)
  - Which part of the business matters most (optional)
you_get:
  - A shared glossary of business terms
  - A map of separate business areas and their borders
  - Groups of data that belong together
  - The core area to focus on
  - A score out of 10 with failing checks
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
