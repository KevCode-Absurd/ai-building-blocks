thinking: medium
thinking_why: It matches principles to your case.
new_slug: buyer-psychology-advisor
name: Buyer psychology advisor
summary: Find the buyer psychology that fits your page or offer. Get a short list of mental models and honest changes to try on your pricing or headline.
job: understand-customers
headline: Buyer psychology advisor
subhead: Describe the page, offer or price you want to improve and where people hesitate. It picks the mental models and buying biases that apply, such as anchoring or loss aversion. You get a short list of models, a plain explanation of each, specific changes to try and rules for using them honestly.
explain: |
  You pick up a short list of mental models that fit your page or offer, plus a way to use each one without tricking anyone. Describe what you are selling and where people hesitate, and you get the models that apply, why they work on people, and a concrete change to make.

  The skill covers thinking tools such as first principles and jobs to be done, and buying biases such as anchoring, social proof and loss aversion. For each model it explains the idea in plain words, gives one marketing use, and adds a note on keeping it honest. If you have a product context file, it reads that first so advice fits your audience.
when:
  - Your pricing page gets views but few buyers and you want to know why.
  - You want to test a new headline and need ideas rooted in how people decide.
  - A competitor wins on trust and you want to close the gap fairly.
  - You are planning an offer and want to check it against known buying habits.
not_for:
  - "You need legal or ad-rule checks on your claims: ask a lawyer or read the ad platform's own rules."
  - "You want exact price points or a full pricing plan: use the SaaS pricing strategist, since this one only shows how buyers react to price."
  - "You want finished page copy written: use the Page copywriter, then come back to check it against these models."
you_give:
  - A page, offer or price you want to improve
  - Your audience and where they hesitate
  - A product context file (optional)
you_get:
  - The mental models that fit your case
  - A plain explanation of each one
  - Specific changes to try on your page
  - Guidance for using each one honestly
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text into a new chat. No code or paid tool is needed.
  - Gather the page or price text, who buys, and the point where people drop off. If you use an agent tool that reads .agents/product-marketing.md, say so.
  - Paste your page text, offer or price. Say who buys and where they hesitate.
  - "Ask for four sections: models that fit, why each works, one change per model, and an honest use note."
  - Add your product context file if you have one (optional). It helps the advice fit your buyers.
  - Read the models it picks. Check that each one fits what you see in real buyers.
  - Pick one or two changes and test them on your page. Keep the honest use notes in mind.
output_sample:
  input:
    - Your page, offer or price, pasted as text
    - Your audience and where they hesitate
    - Your product context file (optional)
  output:
    - name: Models that fit
      contains: A short list of mental models or buying biases that match your page, offer or price.
    - name: Why it works
      contains: A plain explanation of the idea behind each model and how it shapes a buyer's choice.
    - name: Marketing application
      contains: One specific change to try on your page for each model.
    - name: Honest use note
      contains: A short rule for using each model fairly, without tricking anyone.
