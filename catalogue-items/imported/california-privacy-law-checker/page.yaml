thinking: medium
thinking_why: It applies a set rule list to your facts.
new_slug: california-privacy-law-checker
name: California privacy law checker
summary: Check if California privacy law applies to your business. Describe your data use. You get a yes or no, your duties, gaps and a plan for requests.
job: check-contracts
headline: California privacy law checker
subhead: Describe what personal data you collect, your revenue, your California customers and who you share data with. It tests the legal thresholds, then lists what the law asks of you. You get a yes or no on whether it applies, your duties, gaps to close and a plan for consumer requests.
explain: |
  You learn whether California privacy law applies to you, what it requires, and where you fall short. Describe how you collect and use customer data, and you get duties, gaps and a plan for handling consumer requests.

  The skill works in order. It confirms you are a for-profit business in California, then tests the three thresholds: revenue over 25 million dollars, data on 100,000 or more people, or half your revenue from selling or sharing data. It then classifies each company you share data with, as a vendor, a third party and so on, since that changes what counts as a sale. It marks its last-verified date. It is guidance, so have a lawyer confirm. This is an MIT-licensed copy of Hemant Naik's public ccpa skill. Its law facts were last checked by the author on 3 October 2026. The deadlines, amounts and enforcement cases come from the author. Check each one at cppa.ca.gov or oag.ca.gov/privacy/ccpa before you rely on it.
when:
  - You are not sure the California privacy act covers your business.
  - A customer asks you to delete or share their data and you lack a process.
  - You share customer data with ad or analytics partners and need to know what that means.
  - You are updating your privacy policy and want a gap list first.
not_for:
  - You run a non-profit or a government body. California privacy law mostly does not cover you, so ask a privacy lawyer.
  - You need sign-off on a contract or your privacy policy. Have a lawyer review it, since this only gives guidance.
  - You sell to people in the EU or UK. Ask a privacy lawyer about GDPR, since this covers California only.
you_give:
  - What personal data you collect and why
  - Your revenue and number of California customers
  - Who you share data with
  - Your current privacy policy (optional)
you_get:
  - A yes or no on whether the law applies
  - A list of duties that apply to you
  - Gaps to close
  - A plan for handling consumer requests
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. It needs no code, files or paid tools.
  - Describe what personal data you collect and why. Add your yearly revenue and your number of California customers.
  - List every company you share customer data with, and what each one does with it.
  - Paste your privacy policy if you have one (optional).
  - Read the yes or no first, then the duties and gaps. Fix the gaps in order.
  - Show the result to a lawyer before you act on it. The skill's law facts were last checked on 3 October 2026. Rules, deadlines and fines change, so check cppa.ca.gov and oag.ca.gov/privacy/ccpa before you act. The statute is California Civil Code section 1798.100 and following.
  - Next, use the gap list to update your policy with the Privacy policy drafter, and set up how you handle consumer requests.
output_sample:
  input:
    - What personal data you collect and why
    - Your yearly revenue and how many California customers you have
    - Who you share customer data with, such as ad or analytics partners
    - Your current privacy policy (optional)
  output:
    - name: Applicability result
      contains: A yes or no on whether the law covers you, with each of the three thresholds tested.
    - name: Data recipient classification
      contains: Each company you share data with is labeled as a service provider, contractor or third party, and whether it counts as a sale.
    - name: Duties table
      contains: The duties that apply to you, such as notices, opt-out links and limits on sensitive data.
    - name: Gap list
      contains: Where your current practice falls short of those duties, so you know what to fix first.
    - name: Request-handling plan
      contains: Steps and deadlines for handling customer requests to see, delete, correct or limit their data.
