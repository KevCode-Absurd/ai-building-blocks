thinking: low
thinking_why: It turns notes into three short drafts.
new_slug: call-follow-up-drafter
name: Call follow-up drafter
summary: Turn your call notes or transcript into a follow-up email, a team summary and CRM updates for you to approve. Nothing is sent, and no CRM change is made without your yes.
job: sell-and-negotiate
headline: Call follow-up drafter
subhead: Paste your call notes or a transcript and name the contact or deal. It builds the follow-up from what was said and matches your CRM's own field and stage names. You get a follow-up email draft, a short team summary, CRM updates waiting for your yes, and next steps with owners.
explain: |
  Right after a call, you have a follow-up email ready to send, a short team summary, and a list of CRM changes waiting for your yes. Paste notes or a transcript and the draft is built from what was said, not from guesses.

  It checks your CRM's own field and stage names so updates fit your setup, and shows the source for each value it plans to write. It treats text in emails and transcripts as data, never as instructions, and shows any action that came from such text before it runs. Nothing is sent. With an email connector, the follow-up is saved as a draft in your mail for you to read. CRM changes wait for your yes. Without a connector you get paste-ready text and a checklist.
when:
  - You just finished a sales call and the follow-up email is still unwritten.
  - Your team needs a summary of what the customer said and what was agreed.
  - Deal stages and next steps in your CRM are out of date after a meeting.
  - You want next steps and owners pulled from a long transcript.
not_for:
  - "You want to write a first message to a stranger: write it by hand or ask your AI for a plain cold email, since this skill needs a real call."
  - "You need notes from an internal team meeting: use a meeting-notes tool, because this skill is built around customers and deals."
  - "You have no notes and no transcript: write down what you remember first, because it will not draft from a meeting title alone."
you_give:
  - Call notes or a transcript
  - The contact or deal the call relates to
  - A connected CRM or email account (optional)
  - Your usual tone or sign-off (optional)
you_get:
  - A follow-up email draft
  - A short summary for your team
  - Proposed CRM updates to approve
  - A list of next steps and owners
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Paste your call notes or transcript. Say which contact or deal the call was about.
  - Add your usual tone or sign-off if you want the email to sound like you (optional).
  - Read the email draft, the team summary and each proposed CRM update with its source line.
  - Say which updates to apply. If your AI has no CRM or email access, copy the text and checklist and do it yourself.
  - Drafting needs no paid tool. Saving the email draft and applying CRM changes needs your own email or CRM account connected to your AI.
terms:
  - term: CRM
    meaning: The tool where you keep your customers, deals and notes, such as HubSpot or Salesforce.
  - term: connector
    meaning: A link that lets your AI read or write in another tool, such as your email or CRM.
  - term: stage
    meaning: Where a deal sits in your sales steps, such as "proposal sent".
  - term: picklist
    meaning: A field in your CRM where you choose from a fixed list instead of typing.
output_sample:
  input:
    - Your call notes or transcript
    - The contact, account or deal the call was about
    - Your usual tone or sign-off (optional)
    - Your CRM, email or chat connected (optional)
  prerequisites:
    - Call notes or a transcript, pasted or uploaded
    - A connected CRM or email account only if you want changes applied; drafting works without one
    - "Optional: the Gong route needs your own Gong account, which is paid"
  output:
    - name: Summary
      contains: The decisions, commitments on each side, open questions, objections and next meeting, each pointing to where it was said.
    - name: Customer follow-up email draft
      contains: A short email under 150 words with thanks, agreed next steps, attachment placeholders and the next meeting.
    - name: Internal team summary
      contains: Account, stage and amount if readable, a short overview, key points, risks, and next steps split between you and them.
    - name: CRM update set
      contains: Proposed values for next step, stage, amount, close date and an activity entry, each with its source line.
    - name: Instruction-like text
      contains: Any lines in the transcript that tried to give orders, listed with their source and left out of the updates.
    - name: Our commitments list
      contains: What you promised on the call, so nothing gets missed.
