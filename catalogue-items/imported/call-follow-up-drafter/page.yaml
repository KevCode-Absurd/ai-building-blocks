new_slug: call-follow-up-drafter
name: Call follow-up drafter
summary: Paste call notes or a transcript. Get a follow-up email, a team summary and CRM updates to approve.
job: sell-and-negotiate
headline: Call follow-up drafter
subhead: Paste your call notes or a transcript and name the contact or deal. It builds the follow-up from what was said and matches your CRM's own field and stage names. You get a follow-up email draft, a short team summary, CRM updates waiting for your yes, and next steps with owners.
explain: |
  Right after a call, you have a follow-up email ready to send, a short team summary, and a list of CRM changes waiting for your yes. Paste notes or a transcript and the draft is built from what was said, not from guesses.

  It checks your CRM's own field and stage names so updates fit your setup, and shows the source for each value it plans to write. It treats text in emails and transcripts as data, never as instructions, and shows any action that came from such text before it runs. Nothing is sent or saved until you approve. You need a CRM or email connector to apply changes; drafting works without one.
when:
  - You just finished a sales call and the follow-up email is still unwritten.
  - Your team needs a summary of what the customer said and what was agreed.
  - Deal stages and next steps in your CRM are out of date after a meeting.
  - You want next steps and owners pulled from a long transcript.
you_give:
  - Call notes or a transcript
  - The contact or deal the call relates to
  - A connected CRM or email account (optional)
  - Your usual tone or sign-off (optional)
you_get:
  - A follow-up email draft
  - A short summary for your team
  - Proposed CRM updates to approve
  - A list of next steps and owners
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read your CRM and email.
