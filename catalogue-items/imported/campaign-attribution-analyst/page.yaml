thinking: medium
thinking_why: It runs set calculations, then explains what they mean.
new_slug: campaign-attribution-analyst
name: Campaign attribution analyst
summary: Find which channels earn credit for sales, where buyers drop out and what each campaign returned. Run campaign attribution analysis on your JSON data.
job: read-ad-results
headline: Campaign attribution analyst
subhead: Give it your customer paths to purchase, funnel stage counts and campaign spend as JSON. Three small scripts spread sales credit across channels under several attribution models, find the biggest funnel drop and work out returns. You get attribution by channel, drop-off by stage, ROI per campaign and suggestions.
explain: |
  You see which channels earn credit for sales, where buyers drop out of your funnel, and what each campaign returned. Give it your campaign data as JSON and three small scripts do the maths the same way every time.

  One script spreads credit across touchpoints in each customer path to purchase under several attribution models. Another counts how many people move between funnel stages and flags the biggest drop. The third works out return on spend, cost per lead and cost per customer for each campaign. They use plain Python with no extra packages and no outside calls. You need Python and data shaped like the sample files.
when:
  - Customers touch email, search and social before buying and you cannot tell which one deserves credit.
  - Half your visitors vanish between two funnel stages and you want to know which.
  - You need a return-on-spend table to defend next quarter's budget.
  - You want results that repeat exactly when the same data is run again.
not_for:
  - "You run one channel and have no customer path data: use that platform's own reports, such as Meta Ads Manager or Google Ads."
  - "You have no way to run Python and cannot paste numbers by hand: ask an analyst or use a spreadsheet for simple ROI sums."
  - "You need to know if a result is statistically sound: use a stats tool or ask an analyst, since the scripts only describe your data."
you_give:
  - Customer paths to purchase with channels and timestamps
  - Funnel stage names and counts
  - Campaign spend, revenue, clicks and leads
  - Python on your computer
you_get:
  - Attribution results by channel
  - Funnel drop-off rates by stage
  - ROI and cost per lead for each campaign
  - Suggestions on what to change
how_to_use:
  - "Save your data as JSON files in the shape shown in the skill: customer paths, funnel counts and campaigns."
  - Open an AI that can run Python and read files. Upload the skill folder and your data.
  - Ask it to run the attribution, funnel and ROI scripts on your data.
  - Ask it to compare at least three attribution models, not just one.
  - Ask it to explain the results and suggest changes. The scripts give numbers. Your AI writes the suggestions.
  - The report only describes your data. It runs no significance tests, so do not treat the numbers as proven. The ROI script's benchmarks are generic industry ranges. Replace them with your own past figures before you call a campaign weak.
  - Next, take the top channel and the worst funnel stage into a budget decision, and test the change with the Test plan writer.
output_sample:
  input:
    - Customer paths to purchase, with channel and time for each touch, as a JSON file
    - Funnel stage names and the count of people at each stage
    - Campaign name, channel, spend, revenue, clicks, leads and customers
    - How many days before a touch loses half its credit (optional)
  prerequisites:
    - An AI that can run Python code and read your files, or Python on your own computer
    - Your data saved as JSON in the shape shown in SKILL.md
  output:
    - name: Attribution by channel
      contains: Credit and revenue for each channel under first-touch, last-touch, linear, time-decay and position-based models.
    - name: Funnel analysis
      contains: Conversion and drop-off rate between each stage, the biggest drops, and the overall funnel conversion rate.
    - name: Campaign ROI table
      contains: ROI, ROAS, cost per acquisition, cost per lead, customer cost, click rate and lead-to-customer rate per campaign. Revenue minus ad spend is shown, not full profit, and a campaign with no spend shows n/a instead of 0.
    - name: Underperformer flags
      contains: Campaigns that fall below the benchmark values built into the ROI script.
    - name: Suggestions
      contains: Your AI reads the three results and says what to change. The scripts only give numbers.
