thinking: medium
thinking_why: It maps steps and finds where people drop off.
new_slug: candidate-experience-improver
name: Candidate experience improver
summary: Describe your hiring steps. Get a map of the candidate path, friction
  points and messages per stage.
job: hire-people
headline: Candidate experience improver
subhead: Describe your hiring steps from application to offer, the roles you
  hire for and any drop-off numbers. It reviews each step for how long it takes
  and how the candidate feels. You get a map of the candidate path, the top
  friction points, message drafts per stage and a short survey.
explain: |
  You see exactly what candidates go through in your hiring process and where they give up. Describe your steps, and you get a map of the candidate path from first look to offer or rejection, with the friction points marked and a message for each stage.

  The skill reviews the application form, screening, interviews, updates, offers and rejections. For each, it asks how long it takes, what the candidate feels and what they hear from you. It then suggests fixes such as shorter forms, clearer timelines, structured interviews that respect time, and kind rejection notes. It also gives a way to measure with short surveys and checks for bias and access problems.
when:
  - Strong candidates drop out halfway through your process.
  - Candidates complain about silence after interviews.
  - You are hiring many people for the same role and want a smoother flow.
  - You want rejection messages that protect your reputation.
you_give:
  - Your hiring steps from application to offer
  - Role types you hire for
  - Drop-off numbers or candidate feedback (optional)
  - Your company tone (optional)
you_get:
  - "A candidate path map: a table with one row per stage, showing wait time, how the candidate feels and what they hear from you"
  - "The top three friction points, one short paragraph each with a fix"
  - "A short message draft for each stage, from acknowledgment to rejection"
  - "A short survey of about five questions for each stage"
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill. It runs in any AI chat. No paid tool or API key is needed.
  - Before you start, write down how long each stage takes and how many candidates leave at each one, if you know. Your AI asks for these if they are missing, and says so when it has to guess.
  - Send your hiring steps from application to offer, the roles you hire for, and your drop-off numbers if you have them.
  - Ask for the candidate path map first. Check each stage's wait time and how the candidate feels.
  - Then ask for the stage messages and the survey. Edit the messages so they sound like your company.
  - Next, take the top friction point into the Candidate message drafter or the Hiring interview designer. Run the survey after each stage for a month, then check the map again.
not_for:
  - "You want to write the message to one candidate: use Candidate message drafter."
  - "You want to design the interview itself: use Hiring interview designer."
  - "You want to compare finalists fairly: use Fair candidate comparer."
output_sample:
  input:
    - Your hiring steps, from application to offer
    - The roles you hire for
    - Drop-off numbers or candidate feedback (optional)
    - Your company tone (optional)
  output:
    - name: Candidate path map
      contains: Each stage from application to offer or rejection, with its wait time and how the candidate feels.
    - name: Top friction points
      contains: The few places candidates wait, get confused or leave, with a fix for each.
    - name: Stage messages
      contains: Drafts for acknowledgment, interview prep, updates, offers and rejections.
    - name: Candidate survey
      contains: A short survey to measure how the process feels at each stage.
