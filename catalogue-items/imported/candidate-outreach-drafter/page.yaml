thinking: medium
thinking_why: Good outreach needs a fresh angle for each person.
new_slug: candidate-outreach-drafter
name: Candidate outreach drafter
summary: Write personal candidate outreach messages that get replies. Give it the role and the person. You get a first message, follow-ups and reply templates.
job: hire-people
headline: Candidate outreach drafter
subhead: Describe the role, what makes it appealing, the person you want and the channel you will use. It leads with what matters to the candidate and asks for one small step. You get a personal first message, a four-step follow-up sequence, a closing message and reply templates.
explain: |
  Personal first messages that get replies, plus follow-ups to send after. Describe the role and the person you want, and you get a short opening note, a four-touch sequence and a polite last message.

  Each draft leads with what matters to the candidate, names something specific from their background and asks for one small step, like a 15-minute chat. It sets length by channel: under about 400 characters for LinkedIn messages and around 100 to 150 words for email. It keeps the tone human, not stiff, and fits it to the platform. It stops after four touches. It also has notes on handling replies and on sending from the hiring manager. The percentages in the skill file are the author's own and are not checked. Do not repeat them to a candidate.
when:
  - You found a strong person on LinkedIn or GitHub and need a first message.
  - Your cold messages get no replies.
  - You want a follow-up plan that does not feel pushy.
  - A candidate replied with a question about pay or remote work and you need a response.
not_for:
  - You want to mass mail an unknown list. Post the job on a job board instead, because this needs a real person to write to.
  - You have no signal about the person, such as a profile, project or post. Ask a recruiter to run a search first, then come back.
  - You need to write the job post itself. Write the job ad first, or ask a recruiter to help, then use this for the outreach.
you_give:
  - The role and what makes it appealing
  - A profile or notes on the person
  - The channel you will use
  - A hiring manager name to send as (optional)
you_get:
  - A personal first message
  - A four-step follow-up sequence
  - A closing message
  - Reply templates for common questions
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill. No code, files or paid tools are needed for the drafting. Sending an InMail needs a paid LinkedIn Recruiter or Premium account. Without one, use a plain connection note or email.
  - Paste the role and what makes it appealing. Add the person's profile or your notes on their work.
  - Say which channel you will use, such as LinkedIn or email. Add the hiring manager's name if they will send it (optional). If you do, the hiring manager must read and approve the message first, and they answer the replies. Never send in someone's name without their yes.
  - Tell your AI the tone you want, such as professional, casual or technical. If you say nothing, it uses a friendly, professional tone.
  - Read the first message. Check that the personal detail about the person is true, then send it.
  - Send the follow-ups on the days listed in the sequence. Stop after the fourth touch.
  - When someone replies with interest, send the role brief and book a call within 48 hours. The response playbook in the result has a reply for each other answer. The full reply templates and message patterns are in five reference files. Attach the whole folder or paste those files in too. If you paste only the skill text, you still get the messages and the sequence, but the reply templates are shorter.
output_sample:
  input:
    - The role and what makes it appealing
    - A profile or notes on the person
    - The channel you will use, such as LinkedIn or email
    - The hiring manager's name to send as (optional)
  output:
    - name: Sequence Overview
      contains: A table of the four touches with the day, channel and purpose of each.
    - name: Touch 1
      contains: The first message, ready to send, with slots for details about the person.
    - name: Touch 2
      contains: A follow-up that adds a new angle instead of repeating the first note.
    - name: Touch 3
      contains: A follow-up on a different channel that lightly mentions your earlier message.
    - name: "Touch 4: Breakup"
      contains: A polite last message that leaves the door open with no guilt.
    - name: Response Playbook
      contains: Reply templates for interested, not now, pay questions and objections.
