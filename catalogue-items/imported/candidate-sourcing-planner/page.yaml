thinking: medium
thinking_why: It ranks channels for one role using a set method.
new_slug: candidate-sourcing-planner
name: Candidate sourcing planner
summary: Plan where to find candidates for one role. Give it a role and a candidate profile. You get ranked channels, target companies and a weekly plan.
job: hire-people
headline: Candidate sourcing planner
subhead: A plan for where to find the right people and how to spend your time looking. Give a role and a candidate profile, and you get ranked places to search, target companies and communities, and a week-by-week schedule.
explain: |
  A plan for where to find the right people and how to spend your time looking. Give a role and a candidate profile, and you get ranked places to search, target companies and communities, and a week-by-week schedule.

  The skill needs a candidate profile first and will not guess one. If none exists it tells you to build it. Then it ranks channels for this specific role: professional networks, org charts, code sites, regional networks and communities, and says which suit seniority and location. It lists companies where similar people work and sets an order of attack. Check your own notes for preferred channels and templates.
when:
  - You have an open role and no idea where to start looking.
  - Job posts alone are not bringing in good candidates.
  - You need to hire in a new country or a niche field.
  - You want a schedule you can hand to a recruiter helping you.
not_for:
  - "You need many hourly or high-volume hires fast: post the jobs on job boards or ask a staffing agency."
  - "You have no candidate profile yet: build that first, because this plan will not guess one."
  - "You want the messages to send candidates: write the outreach separately once the plan is done."
you_give:
  - The role name or job description
  - A candidate profile for the role
  - Location and seniority
  - Your preferred channels (optional)
you_get:
  - Ranked sourcing channels for the role
  - Target companies and communities
  - A week-by-week action plan
  - Notes on what to do first
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text from this page. It looks for saved company notes and a role folder that a chat does not have, so paste your own company notes and candidate profile instead.
  - Paste your job description or role name. Add the location and seniority.
  - Paste your candidate profile. If you have none, build one first.
  - Add your preferred channels and company notes (optional).
  - Read the plan. Check that the top channels fit your role and location.
  - Before you search or contact anyone, check each platform's terms and the personal-data rules where your candidates live. Org-chart sites and X-Ray searches are fine to read by hand but not to scrape in bulk. Paid data tools need their own licence.
  - Next, write the messages with the candidate outreach drafter once the plan is set.
next: [candidate-outreach-drafter, ideal-candidate-profiler, talent-pool-mapper]
output_sample:
  input:
    - Your role name or job description
    - Your candidate profile for the role
    - Location and seniority
    - Your preferred channels and company notes (optional)
  prerequisites:
    - A candidate profile for the role, saved as persona.md
    - An AI that can read and save files, or paste the files into a chat
    - A paid plan for tools like LinkedIn Recruiter, RocketReach, Apollo or ZoomInfo, only if you want to use them
  output:
    - name: Candidate Persona Summary
      contains: A short description of the person you want to hire, taken from your candidate profile.
    - name: Channel Strategy
      contains: Three tables of channels in priority order, each with approach, expected yield and weekly time.
    - name: Target Companies
      contains: Companies where similar people work, grouped as direct competitors, adjacent companies and transferable talent sources.
    - name: Search Strings
      contains: Ready-to-use search strings for each platform you plan to use.
    - name: Weekly Plan
      contains: What to do each week, starting with the companies most likely to say yes.
    - name: Success Metrics
      contains: Targets for pipeline size, response rate and time to fill.
    - name: Risks & Mitigations
      contains: Likely problems in this search and a backup plan for each.
