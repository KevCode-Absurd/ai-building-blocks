job: build-software
headline: Car safety test scenario maker
subhead: Name the Euro NCAP test you care about and get its driving scenario
  built, varied, plotted and scored. The skill creates the starting scenario for
  the test, makes variants from it, and moves the scenarios between two
  simulators.
explain: |
  Name the Euro NCAP test you care about and get its driving scenario built, varied, plotted and scored. The skill creates the starting scenario for the test, makes variants from it, and moves the scenarios between two simulators.

  It picks the right route by protocol year. For 2023 it uses the standalone scenario call with prefixes like SA AEB. For 2026 it sets up an assessment object, can set a custom vehicle under test, then builds the scenario. After that you can plot single or grouped scenarios, translate them between drivingScenario and RoadRunner, compute scores and export reports. You need MATLAB with the automated driving tools and the NCAP support package.
when:
  - You need a Euro NCAP car-to-car braking test set up in simulation.
  - You want many variants of one test to check how sturdy your braking system
    is.
  - You must move a scenario between two simulators.
  - You need NCAP scores and a report from your results.
you_give:
  - The Euro NCAP test name and protocol year
  - MATLAB with the driving and NCAP support packages
  - A custom vehicle under test (optional)
  - Variation settings (optional)
you_get:
  - A seed scenario for the named test
  - Generated variants
  - Plots of scenario descriptors
  - Translated scenarios for another simulator
  - NCAP scores and exported reports
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with the Euro NCAP support package.
