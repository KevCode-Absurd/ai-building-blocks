new_slug: cash-forecast-builder
name: Cash forecast builder
summary: Give it your invoices, bills and fixed costs. Get a 30, 60 and 90 day
  cash forecast with risks named.
job: track-numbers
headline: Cash forecast builder
subhead: "A 30, 60 and 90 day cash forecast that answers the question: will I
  make payroll next month? You get a short chat summary and an Excel workbook,
  with named risks next to the numbers."
explain: |
  A 30, 60 and 90 day cash forecast that answers the question: will I make payroll next month? You get a short chat summary and an Excel workbook, with named risks next to the numbers.

  The skill pulls your bank balance, unpaid invoices, bills and fixed costs from whatever you have connected, such as accounting, payments or Shopify. If nothing is connected it takes a CSV. It forecasts money in and out for each window and widens or narrows the range based on how late each customer usually pays. Risks are named, like one slow customer owing a large invoice. If two ledgers are connected, it asks which is the main one.
when:
  - You are unsure you can cover payroll in six weeks.
  - A large customer pays late and you want to see the effect on cash.
  - You need a forecast for a bank or investor conversation.
  - You are planning a big purchase and want to know when it is safe.
you_give:
  - Connected accounting or payment tools, or a CSV
  - Current bank balance
  - Unpaid invoices and bills
  - Fixed costs and payroll dates
you_get:
  - A 30, 60 and 90 day cash forecast
  - Confidence ranges per period
  - Named risk flags
  - An Excel workbook to keep
  - A short chat summary
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your accounts and files.
  - Where the skill points to ../../shared/, use the shared folder inside it. We
    copied it in so the skill works on its own.
