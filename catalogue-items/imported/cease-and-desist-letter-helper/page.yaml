thinking: high
thinking_why: Tone and timing can change what happens next.
new_slug: cease-and-desist-letter-helper
name: Cease-and-desist letter helper
summary: Draft a cease-and-desist letter to stop someone copying your work, or get an options memo for a letter you received. A lawyer should review it.
job: check-contracts
headline: Cease-and-desist letter helper
subhead: Either a draft demand letter for someone copying your work, or a plain options memo for a letter you received. Describe the infringement or paste the letter, and you get a first version a lawyer can review and finish.
explain: |
  Do not send any draft from this skill until a lawyer has reviewed it. A letter that asserts legal rights and threatens a lawsuit can cause real harm if it is wrong.

  Either a draft demand letter for someone copying your work, or a plain options memo for a letter you received. Describe the infringement or paste the letter, and you get a first version a lawyer can review and finish.

  It has two modes. Sending mode works out who the right target is, what they did, your relationship with them and what you want, then drafts a letter at the firmness your enforcement approach calls for, with a check before delivery. Receiving mode reads the letter, assesses the claim, notes your exposure and lays out choices with a recommendation. Every draft carries a "draft for attorney review" header. It needs your enforcement approach first. The original skill expects a setup step from its ip-legal plugin (a setup interview and a config file). That plugin is not included here. If your AI has no saved setup, it asks you the setup questions in the chat, and you answer them there. It is not legal advice, and a letter is a legal step, so have a lawyer review it before it goes out.
when:
  - A competitor is using your logo or text and you want to demand they stop.
  - You received a threatening letter and do not know your options.
  - You need a draft to bring to your lawyer rather than starting blank.
  - You want to decide between ignoring, negotiating or fighting a claim.
not_for:
  - "You want to push back on a customer or partner without a manager or lawyer signing off first: talk to your lawyer before any letter goes out."
  - "The copying happens only on a marketplace or platform: use that platform's takedown form first, as it is faster than a letter."
  - "You need legal advice you can rely on or a letter ready to send: hire a licensed lawyer to review and sign it."
  - "The other party or the copying is in a country where your rights are not registered: the draft assumes the places you name, mostly the US. Tell your AI and your lawyer before drafting."
you_give:
  - A description of the infringement, or the letter you received
  - Who the other party is and your history with them
  - What you want them to do
  - Your enforcement approach (set up once)
you_get:
  - A draft cease-and-desist letter
  - Or an options memo on a letter you received
  - A recommended response
  - A checklist before sending or replying
how_to_use:
  - "In plain chat, answer three setup questions first. How firm do you want to be? Who must approve a letter? Where are your rights registered? Your AI uses your answers in place of the plugin setup that the original skill expected."
  - "Have your enforcement approach ready: how firm you want to be, who must approve a letter, and where your rights are registered. If your AI has no saved setup, it will ask you for these in the chat."
  - Open your AI tool that can read files and make Word documents. Add the skill and say whether you are sending a letter or got one.
  - Describe what happened, or paste the letter you received. Add who the other party is and what you want.
  - Read the draft in the chat. Fix anything marked VERIFY or CITE.
  - Look up court and trademark records yourself. These lookups are optional. Westlaw is a paid service, PACER charges per page, and a marketplace brand portal needs an account. If you skip them, the draft still works, with citations left as placeholders to check.
  - Give the draft to your lawyer. This is not legal advice, and you must not send the draft unreviewed.
  - "What we changed from Anthropic's original: a plain name, no plugin needed, and a chat path for the setup questions. The letter method is theirs."
output_sample:
  input:
    - A description of what the other party did, or the letter you received
    - Who the other party is and your history with them
    - What you want them to do (send mode)
    - Your enforcement approach, set up once in the setup interview
  prerequisites:
    - An AI that can read your files and save a Word document
    - The setup interview done first, so your enforcement approach and approval steps are saved
    - Manual lookups for court records and trademark records, which may need accounts
  output:
    - name: Draft letter (send mode)
      contains: A cease-and-desist letter in letter format, firm to the level your enforcement approach calls for.
    - name: Counterparty diligence
      contains: A check on who the other party is and whether they are the right target.
    - name: Pre-delivery gate
      contains: Checks and approvals to clear before the letter goes out, including who must sign off.
    - name: C&D Received triage memo (receive mode)
      contains: The claim, how strong it looks, your exposure, and options from complying to fighting, with a recommendation.
    - name: Deadlines and immediate actions
      contains: Dates to calendar and the first steps to take after reading the letter.
    - name: checklist.md
      contains: "A post-send list: cites verified, approver signed, delivery proof kept, compliance date set."
