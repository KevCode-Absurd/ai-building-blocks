job: check-contracts
headline: Cease-and-desist letter helper
subhead: Either a draft demand letter for someone copying your work, or a plain
  options memo for a letter you received. Describe the infringement or paste the
  letter, and you get a first version a lawyer can review and finish.
explain: |
  Either a draft demand letter for someone copying your work, or a plain options memo for a letter you received. Describe the infringement or paste the letter, and you get a first version a lawyer can review and finish.

  It has two modes. Sending mode works out who the right target is, what they did, your relationship with them and what you want, then drafts a letter at the firmness your enforcement approach calls for, with a check before delivery. Receiving mode reads the letter, assesses the claim, notes your exposure and lays out choices with a recommendation. It needs a practice profile set up first. It is not legal advice.
when:
  - A competitor is using your logo or text and you want to demand they stop.
  - You received a threatening letter and do not know your options.
  - You need a draft to bring to your lawyer rather than starting blank.
  - You want to decide between ignoring, negotiating or fighting a claim.
you_give:
  - A description of the infringement, or the letter you received
  - Who the other party is and your history with them
  - What you want them to do
  - Your enforcement approach (set up once)
you_get:
  - A draft cease-and-desist letter
  - Or an options memo on a letter you received
  - A recommended response
  - A checklist before sending or replying
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - Where the skill points to /ip-legal:cold-start-interview, use the
    setup-interview folder inside it. We copied it in so the skill works on its
    own.
