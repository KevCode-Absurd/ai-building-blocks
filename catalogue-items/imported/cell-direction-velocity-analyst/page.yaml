job: research-topics
headline: Cell direction velocity analyst
subhead: Single-cell data tells you which way cells seem to be heading, how far
  along they are, and which genes push them. Give it counts with spliced and
  unspliced reads, and you get arrows on the cell map, a timeline for each cell,
  and ranked driver genes.
explain: |
  Single-cell data tells you which way cells seem to be heading, how far along they are, and which genes push them. Give it counts with spliced and unspliced reads, and you get arrows on the cell map, a timeline for each cell, and ranked driver genes.

  The skill uses scVelo to estimate how expression is changing from the balance of spliced and unspliced reads. It supports a steady-state model and a dynamical model with latent time, and draws gene phase plots. It is strict about meaning: the arrows are model estimates, not observed movement or proof of cell fate. It works in an isolated Python setup and needs no API key.
when:
  - You have single-cell data and want to see the direction of cell change.
  - You need the genes that drive a branching path.
  - You want a pseudo-time order for cells in a trajectory.
  - You are checking if a model fits before trusting its arrows.
you_give:
  - A single-cell file with spliced and unspliced counts
  - Cell type labels and a cell map embedding
  - Python set up with scVelo
  - Genes of interest (optional)
you_get:
  - Velocity arrows on a cell map
  - A latent time value per cell
  - Ranked driver genes
  - Phase portraits for chosen genes
  - Notes on what the results do not prove
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code.
