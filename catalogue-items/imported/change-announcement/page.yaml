thinking: medium
thinking_why: It sizes the change, then drafts each message to match.
new_slug: change-announcement
name: Internal change announcement writer
summary: Write your internal change announcement for a re-org, tool switch or layoff. You get the message, an FAQ, manager talking points and a send plan.
job: lead-people
headline: Internal change announcement writer
subhead: "The full message package for a re-org, tool change or layoff: the announcement, an FAQ, talking points for managers and a calendar of follow-ups. It is written for staff, not customers, and settles when to speak, in what order and what to leave unsaid."
explain: |
  The full message package for a re-org, tool change or layoff: the announcement, an FAQ, talking points for managers and a calendar of follow-ups. It is written for staff, not customers, and settles when to speak, in what order and what to leave unsaid.

  The skill sets the size of the change first so the tone matches, since cheerful wording on a job cut backfires. Managers hear first and get answers, because staff trust their own manager most. The FAQ answers what people really ask, like pay, reporting lines and whether more cuts are coming. It sets five to seven touchpoints rather than one post. It works through a fixed change model.
when:
  - You are about to announce a re-org and want the words and order ready.
  - Managers will get questions on day one and need answers.
  - A tool switch is coming and people are unhappy.
  - You must announce layoffs and need a careful, honest message.
not_for:
  - "You are writing to customers or the press: ask a marketing writer or use a marketing skill, not this one."
  - "The change is not decided yet: settle the decision with your leadership team first, then come back to write the message."
  - "You need the legal text of a new policy or layoff terms: ask your HR lead or a lawyer to write it."
you_give:
  - What is changing, why and when
  - Who is affected and how many
  - Your leadership team and channels
  - Facts you cannot share yet
you_get:
  - The main announcement
  - An FAQ with answers to hard questions
  - Talking points for managers
  - A calendar of follow-up messages
how_to_use:
  - Open your AI chat and paste in the skill text from this page.
  - "Fill in a short brief: change type, size, effective date, who is affected, your channels and what you cannot share yet."
  - Tell your AI to run the skill one question at a time. If it cannot run code, ask it to write each part directly from your brief.
  - Check the announcement against the eight mistakes in the skill. Fix any it finds.
  - Name the leader who will sign the message. Confirm they will be at the town hall.
  - Send any layoff or policy message to legal and HR for review before you share it.
output_sample:
  input:
    - What is changing, why and when
    - "How big the change is: low, medium, high or disruptive"
    - Who is affected, in groups such as managers, affected team and everyone else
    - The channels you can use, such as email, chat, town hall or manager 1:1
    - Facts you cannot share yet (optional)
  prerequisites:
    - A decision that is already made and signed off by a sponsor
    - Legal and HR review of any layoff or policy message before you send it
    - "Code running is optional: the skill has scripts, but you can paste the details into a chat instead"
  output:
    - name: Pre-communication
      contains: The early brief for managers and leaders, sent before the main announcement so they can answer questions.
    - name: Primary announcement
      contains: The main message, with a tone that fits the size of the change and a named leader.
    - name: FAQ
      contains: Answers to the questions staff will ask, such as pay, reporting lines, timing and why now.
    - name: Manager talking points
      contains: What front-line managers say and how they handle questions they cannot answer.
    - name: Touchpoint calendar
      contains: Seven follow-up messages with timing, channel, owner and key message, plus gaps and channel mismatches.
    - name: Follow-up message
      contains: A later note that checks how people are coping and reinforces the change.
    - name: Anti-pattern check
      contains: A check of the draft against eight common mistakes, any one of which means do not send.
