thinking: high
thinking_why: It must trace real use of the code, then prove one claim.
new_slug: change-impact-checker
name: Change impact checker
summary: Check what a code change could break outside its own diff. You get a list of risks and one proof that the change is safe.
job: test-and-fix-code
headline: Change impact checker
subhead: Before you ship a change, you learn what it could break outside its own diff, and you get one piece of proof that it is safe.
explain: |
  Before you ship a change, you learn what it could break outside its own diff, and you get one piece of proof that it is safe. Describe the change and the skill goes past listing callers, which a search does in a second.

  It asks you to doubt your own write-up and rate each key fact on a ladder: you said so, you pointed to the file and line, you traced it, you ran it, you saw it live. It then looks for hidden users such as stored data, payloads, config, other apps reading a client, and prompt files. Run it before design, since a claim like "this already handles that" is only a guess until checked. Licence: this copy is from sickn33's collection, whose written content is CC BY 4.0 (see LICENSE-CONTENT). The skill file's own header says MIT, set by the original author stas4000. Both let you reuse it if you keep the credit.
when:
  - You are about to edit a shared API, config file or stored data format.
  - A small diff feels risky and you cannot say why.
  - A ticket says the code already does X and you plan around that.
  - You want a blast radius before a multi-file change.
not_for:
  - "You only changed docs, comments or styling: skip the check and just review the diff with a teammate."
  - "You need a full test run in a live setup: use your own test environment, because this skill only checks the change you describe."
  - "You have no access to the code or the diff: ask a developer who knows the project to look first."
you_give:
  - The change or planned change, as a diff or commit range
  - Access to the code, including the repo paths to search and the lockfile
  - The claim the change depends on (optional)
you_get:
  - A list of things that could break
  - The facts the change depends on, each rated for strength
  - One proof that the change is safe
  - A note on where checking stopped
how_to_use:
  - Open your AI tool. Use one that can read your project files, and run code if you want the proof step.
  - "Gather first: the diff or commit range, the path to your lockfile, and the paths of any other repos or apps that use this code."
  - Paste the skill text, or upload the skill folder.
  - Describe the change, or paste the diff. Add the claim it depends on, if you have one.
  - Let your AI list the risks and rate each key fact. Check that every risk names a real file and line.
  - Run the proof script in a local or test setup, never on live data. Then fix what it found and run the proof again on the final change. Note the result in your pull request. Next, fix the risks that were confirmed, then attach the proof result to the pull request. To check the tests themselves, use test-suite-auditor.
output_sample:
  input:
    - A short description of the change, or the diff itself
    - Access to your code files
    - The claim the change depends on (optional)
  prerequisites:
    - An AI that can read your project files and run code, for the proof step
  output:
    - name: Facts the change depends on
      contains: The one or two facts that make the change safe, each rated on the five-step ladder from said so to seen live.
    - name: Confirmed risks
      contains: Things that could break outside the diff, each with a real file and line.
    - name: Cleared risks
      contains: Risks you can rule out, each with the search that was run.
    - name: Proof script
      contains: A small script or test that runs the real code, plus what happened when it ran.
    - name: Where checking stopped
      contains: Any fact marked unproven, and what was not checked.
