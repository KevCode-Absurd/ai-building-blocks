thinking: medium
thinking_why: It must think through what could go wrong.
new_slug: change-request-writer
name: Change request writer
summary: Write a change request for a system or process change. Get impact, risks, a rollback plan and who to tell, ready for approval.
job: document-work
headline: Change request writer
subhead: A formal change request for a system or process change, with impact, risks, rollback steps and who to tell. Describe the change and you get a document ready for approval.
explain: |
  A formal change request for a system or process change, with impact, risks, rollback steps and who to tell. Describe the change and you get a document ready for approval.

  The request follows four stages: assess what is changing, who is affected and how big the change is; plan communication, training, support and timeline; execute with a clear why, then monitor adoption; and sustain by measuring and reinforcing. It sets the why before the what, names what people lose as well as gain, and gives a clear way to ask questions. The output has a title, priority, status, description, business case, risks, rollback and approvals.
when:
  - IT or your boss needs a change request before you can touch a system.
  - You are retiring a process and want to show you thought it through.
  - You must list risks and a rollback in one place.
  - A change touches several teams and you need to name who to inform.
not_for:
  - "You are fixing an outage that is already live: follow your team's incident process, then write the change record after."
  - "You are making a small routine tweak to a setting: use your team's standard change procedure instead."
  - "You need a plan for how people will adopt a new way of working: ask your manager or a change lead, as this only covers one change record."
you_give:
  - A description of the change
  - Who is affected
  - Dates and constraints
  - Reasons for the change (optional)
you_get:
  - A structured change request
  - An impact and risk assessment
  - A rollback plan
  - A communication and training plan
  - A list of people to tell
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text, then describe the change in a few lines.
  - Add who is affected, how many people, and the planned date. Name who can roll it back if you know.
  - Read the risks and the rollback plan first. Fix anything that does not match your real setup.
  - Fill in any gaps your AI marked as missing, then send the request for approval.
output_sample:
  input:
    - A short description of the change
    - Who is affected, and roughly how many people
    - Planned date and any limits on timing
    - Why the change is needed (optional)
    - Who can roll it back (optional)
  output:
    - name: Header
      contains: Title, requester, date, priority and status of the request.
    - name: Description
      contains: What is changing and why.
    - name: Business Justification
      contains: Why the change is needed, such as cost, rules, speed or lower risk.
    - name: Impact Analysis
      contains: A table rating the effect on users, systems, processes and cost.
    - name: Risk Assessment
      contains: A table of risks with likelihood, impact and how to reduce each one.
    - name: Implementation Plan
      contains: Steps with an owner, a date and what each step depends on.
    - name: Communication Plan
      contains: Who to tell, what to say, how and when.
    - name: Rollback Plan
      contains: When to roll back, the steps to do it, and how to check it worked.
    - name: Approvals Required
      contains: A table of who must approve, their role and status.
