thinking: medium
thinking_why: It adapts a set change model to your situation.
new_slug: change-rollout-planner
name: Change rollout planner
summary: Plan a change rollout for a re-org, tool switch or pivot. Get stage steps, messages for each group and answers to pushback.
job: lead-people
headline: Change rollout planner
subhead: A re-org or tool switch gets a rollout plan, message templates and a plan for pushback, so people actually adopt it. Most changes fail in the rollout, not the design, and this plan is built around the stages people go through.
explain: |
  A re-org or tool switch gets a rollout plan, message templates and a plan for pushback, so people actually adopt it. Most changes fail in the rollout, not the design, and this plan is built around the stages people go through.

  It uses a fast-moving version of the ADKAR model. First, awareness: explain why, honestly, before what. Then desire: answer what is in it for each group, since understanding does not create buy-in. Next come knowledge, ability and reinforcement. It suggests short founder videos over formal documents, names common mistakes at each stage, and gives you wording for each group. It also covers resistance and change fatigue. This is Alireza Rezvani's change-management skill, shared under the MIT licence and adapted from Prosci's ADKAR model.
when:
  - You are moving the team to a new CRM and expect complaints.
  - A strategy pivot is coming and people may not trust it.
  - Your last change faded after two weeks.
  - You need to tell different groups different things about the same change.
not_for:
  - "You only need to tell people about a small task change with no people impact: send a short announcement or use a simple project plan."
  - "You need a task list with owners and deadlines for building the new system: use a project plan, not this."
  - "You want to decide whether to make the change at all: talk it through with your team or an advisor first."
you_give:
  - What is changing and why
  - Who is affected and how they feel
  - Your timeline
  - Past changes that went badly (optional)
you_get:
  - A stage-by-stage rollout plan
  - Message templates for each group
  - Answers to likely pushback
  - Ways to keep the change in place
how_to_use:
  - Start a chat in Claude, ChatGPT or Gemini. Add the skill, or paste the text of SKILL.md into the chat.
  - Paste your answers to the four questions under "What you give it": what is changing and why, who is affected and how they feel, your timeline, and past changes that went badly (optional).
  - Ask for the rollout plan. Read the stage plan and the communication sequence first.
  - Next, write the actual announcement with the Change announcement skill. Then run the week 2 and week 4 check-ins from the communication sequence.
output_sample:
  input:
    - What is changing and why
    - Who is affected and how they feel
    - Your timeline
    - Past changes that went badly (optional)
  output:
    - name: Change type and timeline
      contains: Which kind of change this is (process, org, pivot or culture) and how long full adoption usually takes.
    - name: Stage plan
      contains: Steps for awareness, desire, knowledge, ability and reinforcement, with what to say and do at each one.
    - name: Communication sequence
      contains: A dated order of announcements and check-ins that fits your type of change.
    - name: Message templates
      contains: Wording for each group affected, covering the why and what is in it for them.
    - name: Pushback answers
      contains: Common objections, what each one signals, and a suggested reply.
    - name: Change fatigue check
      contains: Warning signs of tired teams, and what to pause or say is not changing.
    - name: Red flags
      contains: Mistakes to avoid, such as a Friday announcement or leaders skipping the change.
