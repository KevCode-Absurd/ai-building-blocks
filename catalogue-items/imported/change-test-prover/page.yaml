thinking: high
thinking_why: It loops between mutating code and writing tests until they bite.
new_slug: change-test-prover
name: Change test prover
summary: Check that your Python change is really tested. Give it your fix and get tests that fail when the change breaks, proven by mutation testing.
job: test-and-fix-code
headline: Change test prover
subhead: Tests that fail whenever your Python change is broken, proven by deliberately breaking the code. Give it a change and the skill checks it is actually tested, not just passing.
explain: |
  Tests that fail whenever your Python change is broken, proven by deliberately breaking the code. Give it a change and the skill checks it is actually tested, not just passing.

  It works in a clear order. It defines what should be true before coding, then makes small edits, called mutants, to each changed line. If your tests still pass, the mutant survived and the test is weak. It adds tests until every mutant is caught, then reports which tests fail on the old code. Passing tests alone prove little, because a change can be wrong and the tests still pass. The author gives a figure for this that has not been checked, so we leave it out. It needs Python, pytest, git, a runner fetched from GitHub (so internet access on the first run) and pytest-cov. Licence: the licence file in this folder (LICENSE-CONTENT) says CC BY 4.0, and that is the licence we apply to this copy. The skill's own header says MIT, from its original author, Tim Richardson. Both allow reuse with credit, so keep the credit. The runner it fetches has its own licence on GitHub.
when:
  - You finished a Python fix and want proof it is tested before saying done.
  - Coverage looks high but you do not trust the tests.
  - A reviewer asks if your change is covered.
  - You want to know which new tests would have failed before the fix.
not_for:
  - "You want to review a whole test suite for gaps, flaky tests and slow tests: use the Test suite auditor (test-suite-auditor)."
  - "Your project is not Python, or it does not use pytest: use a mutation testing tool made for your language."
  - "You want to know if the code is correct. Killed mutants only show the tests notice a change: ask a person to review the logic."
you_give:
  - A Python project with pytest, on a computer with internet access for the first run (the runner is fetched from GitHub)
  - The change, as uncommitted work or a branch
  - The base revision to compare with (optional)
  - A time budget for the check (optional)
you_get:
  - A list of mutants killed and survived
  - New tests that catch the survivors
  - Tests that fail on the old code
  - Evidence the change is safe to trust
how_to_use:
  - Open your AI in a place where it can run code and read your Python project. A chat window with no file access will not work. The first run downloads a runner from GitHub with uvx, so you need internet access. It is free, but it is outside code that runs on your computer, so read it first. Needs Python 3.12 or newer, git, pytest-cov and pytest-randomly.
  - "Paste the skill text. Say which change to check: your uncommitted work, or a branch to compare with main."
  - Let it write the check first, then run the mutation check. It fetches a runner from GitHub, so review that runner before first use. The skill pins it to tag v0.3.0, commit 07608b3b9e4e359bc0b93b3eca94bb78d67e369e of timini/agentic-verification. On GitHub, open that commit, check it matches the tag, and read the code in the runner folder. Look for network calls and writes outside your project.
  - Read the verdict. If it says gaps, let your AI add tests for each surviving mutant. It stops after three rounds.
  - Check the final report. Look at which new tests fail on the old code, and read any mutants it left for you to judge.
output_sample:
  input:
    - Your Python project that uses pytest
    - Your change, as uncommitted work or a branch
    - The base revision to compare with (optional)
    - A time limit in minutes for the check (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Internet access on the first run, to fetch the runner from GitHub
    - Python 3.12 or newer, git, and pytest-cov in your project
    - pytest-randomly, to check that test order does not matter
  output:
    - name: Verdict
      contains: One of verified, gaps, incomplete or no change, with a short reason.
    - name: Success criteria
      contains: One to three lines on what must be true, and which tests check each one.
    - name: Mutant results
      contains: How many mutants were killed out of those run on the changed lines, and which changed lines no test runs.
    - name: New tests
      contains: Tests added to catch surviving mutants, each confirmed to fail on a broken copy of your code.
    - name: Base check
      contains: The tests that pass on your change and fail on the old code.
    - name: What is left
      contains: Surviving mutants with a reason, anything not assessed, and the fast check command.
    - name: report.md
      contains: The full run report, saved in the .test-suite-audit folder of your project.
