thinking: high
thinking_why: Judging softer traits fairly is hard and needs care.
new_slug: character-assessment-plan
name: Character and habits assessment planner
summary: Plan how to assess a trait like curiosity or resilience. You get an observation guide, a student reflection tool and feedback wording.
job: teach-and-train
headline: Character and habits assessment planner
subhead: A plan for judging a personal quality, like curiosity or persistence, without turning it into a grade that hurts the learner. You name the trait and the age band, and you get a way to collect evidence from several angles.
explain: |
  A plan for judging a personal quality, like curiosity or persistence, without turning it into a grade that hurts the learner. You name the trait and the age band, and you get a way to collect evidence from several angles.

  The skill writes a plain definition of the trait, then lists what an adult would actually see when it shows up. It picks who should give evidence: the teacher, the student, a parent or a peer. It spreads observations across different settings and times, so one bad day cannot decide the result. It also drafts feedback wording that supports growth and keeps the learner's motivation intact. It is a teaching aid and gives no medical or psychological advice.
when:
  - You teach a trait like resilience and have no fair way to see whether students are growing in it.
  - Your report cards need a note on curiosity or teamwork, and you want proof behind it.
  - You want students to reflect on a trait without feeling judged.
  - Several staff observe one class and need a shared way to record what they see.
not_for:
  - "You need a grade for a school subject: use a criterion rubric, which scores skills that build step by step."
  - "You want one test score for a trait: this plan gathers evidence from several people over time, so it will not give one number."
  - "You need a medical or psychological assessment: ask a qualified professional. This plan is a teaching aid only."
you_give:
  - The trait you want to assess
  - A one sentence definition of it
  - The age band of your learners
  - When and how assessment happens
  - Any observations you already have (optional)
you_get:
  - A list of what to look for at each level
  - An evidence plan using several observers
  - Prompts for student self-reflection
  - Feedback wording that keeps motivation up
how_to_use:
  - Pick one trait and one age band. Write a one sentence definition that starts with "The ability to".
  - "Gather the band descriptors for that trait first. Paste the things a teacher notices at that age band (observation indicators), not \"I can\" statements. The plan turns them into things an adult can see. The bands run A to F by age: A is 5 to 7, B is 8 to 10, C is 10 to 12, D is 12 to 14, E is 13 to 15 and F is 15 to 17."
  - Open your AI in Claude, ChatGPT or Gemini and paste the skill text. No code or paid tool is needed. The skill is a CC BY-SA 4.0 copy of Gareth Manning's dispositional-knowledge-assessment-designer, so anything you share that is based on it must carry the same licence and credit.
  - Keep observation notes and reflections about children to school staff. Share them with families only as your school allows, and get consent where your school requires it.
  - Paste your trait, definition, age band, band descriptors and when assessment happens. Add your school's feedback setup if you have one (optional).
  - Read the plan. Check that each thing to look for is something an adult can really see, then change any that are vague.
  - Use the plan over several weeks and in more than one setting. Then use the Synthesis Guide to bring the evidence together.
  - "The plan comes back as headed sections: observation protocol, student self-reflection tool, parent input guide, synthesis guide and developmental conversation guide."
output_sample:
  input:
    - The trait you want to assess, such as agency or curiosity
    - A one sentence definition that starts with "The ability to"
    - The age band of your learners
    - 'The band descriptors: the things a teacher notices at that band'
    - When and how assessment happens, such as an end of term review
  prerequisites:
    - The band descriptors for your trait and age band, written before you start
  output:
    - name: Observation Protocol
      contains: What to look for in class, who watches, and in which settings and times, so one bad day does not decide.
    - name: Student Self-Reflection Tool
      contains: Prompts that help the learner look at their own growth in the trait, without feeling judged.
    - name: Parent/Caregiver Input Guide (Optional)
      contains: Questions for a parent or caregiver about what they see at home.
    - name: Synthesis Guide
      contains: How to bring evidence from teacher, student and family together into one fair picture.
    - name: Developmental Conversation Guide
      contains: How to talk with the learner about the result in a way that supports growth.
    - name: Integration with Feedback Structures
      contains: How the plan fits into your school's existing review or feedback session.
    - name: Time and Workload Estimate
      contains: A rough view of the time the plan asks of teachers, students and families.
