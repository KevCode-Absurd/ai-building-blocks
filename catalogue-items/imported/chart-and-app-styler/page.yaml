job: build-software
headline: Chart and app styler
subhead: MATLAB charts and apps that use one clean set of colours, with dark
  mode that works. You give it your figures or app, and it sets palettes,
  colormaps and themes the way MATLAB expects, instead of scattering colour
  values through your code.
explain: |
  MATLAB charts and apps that use one clean set of colours, with dark mode that works. You give it your figures or app, and it sets palettes, colormaps and themes the way MATLAB expects, instead of scattering colour values through your code.

  It keeps brand colours in one struct. It uses colororder for series that are categories and colormap for smooth gradients, and never mixes them up. For apps built with uifigure it uses the newer theme tools: dark mode through lightness flipping, a callback that reacts when the system theme changes, and uistyle for conditional colours in tables and trees. It can also bring in a palette from Material Design, Adobe Color or Tailwind. MATLAB is required.
when:
  - Your MATLAB plots all look default blue and orange and you want your brand
    colours.
  - Your app needs a dark mode that follows the user's system setting.
  - You want a table to highlight rows that cross a threshold.
  - You have a colour scheme from a design tool and need it inside MATLAB.
you_give:
  - Your MATLAB figures or app code
  - Your brand or palette colours (optional)
  - Whether you want dark mode
  - The kind of data (categories or continuous)
you_get:
  - A central colour struct
  - Chart series colours set the right way
  - A colormap for continuous data
  - Dark mode and theme handling for your app
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB.
