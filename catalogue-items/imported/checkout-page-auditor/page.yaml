thinking: medium
thinking_why: It walks a set list of checks and ranks what it finds.
new_slug: checkout-page-auditor
name: Checkout page auditor
summary: Check your checkout page for fixes. Give it your cart flow and get a ranked list for guest checkout, form fields, wallets and surprise costs.
job: run-your-store
headline: Checkout page auditor
subhead: A ranked fix list for your cart and checkout, so shoppers who already want the item can pay without a fight. You share your flow, and each problem comes with the change to make and the study behind it.
explain: |
  A ranked fix list for your cart and checkout, so shoppers who already want the item can pay without a fight. You share your flow, and each problem comes with the change to make and the study behind it.

  It checks rules in order. Can people buy as a guest? Do you ask only for the fields you need? Do errors show next to the field? Are item price, shipping and tax shown before the pay click? It also looks at a coupon box hidden until asked, wallets placed high on mobile, and trust wording near the pay button. Fixes are ranked by how close they sit to payment.
when:
  - Shoppers add to cart but few finish paying.
  - You want to know if a forced account is costing you orders.
  - Your coupon box sends people off to hunt for codes.
  - You need to know what to fix first, not a giant list.
not_for:
  - "You want to improve your product page, such as reviews or sold-out sizes: fix that on the product page itself, not here."
  - "You want to change how your price is worded: ask your AI to review your pricing text on its own."
  - "You want to win back shoppers who left: write a cart reminder email, because this checks the checkout page only."
you_give:
  - Your cart and checkout flow, as a link, screenshots or a walkthrough
  - The list of form fields
  - When shipping and tax appear
  - Payment wallets you offer (optional)
you_get:
  - A ranked table of issues
  - The exact change for each
  - The study effect for each fix
  - Common mistakes to avoid
  - A note on what already works
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the checkout auditor instructions.
  - Paste your checkout link, screenshots or a short walkthrough of each step.
  - Add your form fields, when shipping and tax appear, and any wallets you offer.
  - Read the ranked table. Some fixes cite a study and some are practitioner tips, so check the label on each row.
  - Make the top two or three changes, then measure before you take the next ones.
output_sample:
  input:
    - Your cart and checkout flow, as a link, screenshots or a walkthrough
    - Your list of form fields
    - When shipping, tax and the total show
    - Wallets you offer, such as Apple Pay (optional)
  output:
    - name: Ranked audit table
      contains: Each issue with the change to make, the measured effect, and the source, ranked by how close it sits to payment.
    - name: Source label
      contains: Each fix is marked as backed by a cited study or as a practitioner tip with no study on file.
    - name: Common mistakes
      contains: A short list of errors to avoid, such as forcing an account or showing a wall of lock icons.
    - name: What already works
      contains: A closing note on what your checkout already does right.
