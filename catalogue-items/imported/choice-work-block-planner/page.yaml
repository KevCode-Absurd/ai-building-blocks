thinking: medium
thinking_why: It balances freedom and structure in a time block.
new_slug: choice-work-block-planner
name: Choice work block planner
summary: Plan a choice-based work block for your class. Give it your real time and activities. You get a timed work cycle plan for independent work.
job: teach-and-train
headline: Choice work block planner
subhead: A plan for a long, uninterrupted stretch where students pick their own work and stay focused. You tell it how much time you really have and what is on offer, and you get a block that works in a real timetable.
explain: |
  A plan for a long, uninterrupted stretch where students pick their own work and stay focused. You tell it how much time you really have and what is on offer, and you get a block that works in a real timetable.

  The skill sets the length of the block so it is long enough for deep work, and plans how the session opens and closes. It lays out the choices on the shelves or stations, how students record what they chose, and how you can watch and give short lessons without breaking the focus of others. It also covers what to do when a child struggles to choose, and how to treat interruptions.
when:
  - You want to try a Montessori style work period but your schedule is tight.
  - Students hop between tasks and never settle into one.
  - You are unsure how to run small lessons while others work alone.
  - You need a way to track what each student chooses.
not_for:
  - "You want whole-class direct teaching: use a standard lesson plan instead."
  - "Your block is under about 60 minutes: use a standard lesson plan, since a work cycle needs a long block."
  - "You only need to set up shelves and stations: use the prepared-environment-designer skill."
you_give:
  - The real length of your time block
  - The activities students can choose from
  - Student age or level (optional)
  - Room set up and rules you already have (optional)
you_get:
  - A timed block plan
  - A choice menu for the shelves or stations
  - Notes on how to open and close the session
  - Ways to support students who struggle to choose
how_to_use:
  - "Licence: this skill is by Gareth Manning, under CC BY-SA 4.0. Keep the credit, and share any changes you publish under the same licence."
  - Open Claude, ChatGPT or Gemini. Paste in the full skill text from the SKILL.md file in this item. It has fields in double curly brackets, such as {{available_time}} and {{learning_activities}}. Your AI fills each one from what you say next.
  - Tell your AI the real length of your time block.
  - List the activities students can choose from. Add class size, age and your worries if you like. Anything you skip is marked not provided.
  - The research names and timings in the skill, such as how long settling takes, are the original author's summary and are not checked. Do not quote them to parents or staff as confirmed findings.
  - Read the plan. Check that the timing fits your real timetable.
  - Adjust anything that does not fit your room. Two related skills by the same author (prepared-environment-designer for shelves and three-part-lesson-designer for short lessons) are not in this library yet. For now, ask your AI to plan your shelves and short lessons from the plan.
  - Next, record what students do with the Learning documentation planner.
next: [learning-documentation-planner]
output_sample:
  input:
    - The real length of your time block
    - The activities students can choose from
    - Student age or level (optional)
    - Class size (optional)
    - Your current routines and worries (optional)
  output:
    - name: Work Cycle Structure
      contains: The full block laid out in time, with the teacher's role in each phase.
    - name: Opening Routine
      contains: How to start the session and help students settle into their choices.
    - name: Work Period
      contains: How the long stretch of independent work runs and what students do.
    - name: Teacher Observation Protocol
      contains: How to watch students and give short lessons without breaking others' focus.
    - name: Materials Rotation and Choice Management
      contains: How to manage the choices on offer and help students who struggle to choose.
    - name: Closing Routine
      contains: How to end the session and have students record what they did.
    - name: Transition Management
      contains: How to move students in and out of the block smoothly.
    - name: Building the Routine Over Time
      contains: How to grow the work cycle step by step over several weeks.
    - name: Addressing Common Concerns
      contains: Answers to the worries you shared, such as off-task students or easy choices.
