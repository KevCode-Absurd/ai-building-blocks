thinking: high
thinking_why: Each claim needs separate sourcing and weighing.
new_slug: claim-fact-checker
name: Claim fact-checker
summary: Check each claim in a text against trusted sources. You get a verdict and confidence score for every claim, so you can fact check before you publish.
job: think-and-decide
headline: Claim fact-checker
subhead: Paste a text and get a verdict on each claim in it, with a confidence score and the sources behind it. Instead of one true or false for the whole piece, you see exactly which sentence holds up and which does not.
explain: |
  Paste a text and get a verdict on each claim in it, with a confidence score and the sources behind it. Instead of one true or false for the whole piece, you see exactly which sentence holds up and which does not.

  It first splits the text into single checkable statements and drops opinions. It labels each as a number, a date, a science finding or a definition, then looks for the best source type: official data for statistics, journals for research, records for history. Each claim is compared against at least two independent sources. Verdicts run from true to false, with unverifiable as its own result. It only cites pages it actually opened. It is a first check, not a ruling: open the sources for any claim you will rely on.
when:
  - You are about to publish a post and want its facts checked.
  - A colleague sent a statistic and you doubt it.
  - You want to check an AI answer before you rely on it.
  - You need to know which parts of an article are weak.
not_for:
  - "You need a legal, medical or money decision: ask a qualified professional, and use this only to find claims to raise with them."
  - "You need a live figure, like a price or case count: check the source site yourself, since this only checks against a stated date."
  - "You want to judge opinions or predictions: this skips them, so ask a colleague or an editor to weigh them."
you_give:
  - The text or statement to check
  - Claims to focus on (optional)
  - Preferred report format (optional)
you_get:
  - A list of separate claims
  - A verdict for each
  - A confidence score
  - Source links
  - An overall summary
how_to_use:
  - Open Claude, ChatGPT or Gemini and turn on web search. This skill needs it to look up sources.
  - Paste the skill instructions into the chat.
  - The skill only cites sources it actually opened. If a source cannot be reached, the claim is marked Unverifiable and no link is made up. If your AI has no web search, use this only to list the claims you need to check yourself.
  - Paste the text you want checked. Add any claims to focus on, or a report format (optional).
  - Read the verdicts and confidence scores. Check that the chat lists the pages it searched, and open the source links for any claim you plan to rely on.
  - Fix or remove claims marked False, Mostly False or Unverifiable before you publish.
  - For claims cleared as True, have an editor or subject expert read the final piece before it goes out.
output_sample:
  input:
    - The text or statement to check
    - Claims to focus on (optional)
    - Preferred report format (optional)
  prerequisites:
    - An AI that can search the web, with web search turned on
  output:
    - name: Extracted claims
      contains: Each checkable statement from your text on its own line, with its type, such as statistical, historical or scientific.
    - name: Not checkable list
      contains: Opinions and unfalsifiable statements that were set aside, noted so you know they were skipped.
    - name: Verdicts
      contains: "One verdict per claim: True, Mostly True, Half True, Mostly False, False or Unverifiable."
    - name: Confidence scores
      contains: A score from 0.0 to 1.0 for each claim, with a short reason.
    - name: Evidence and source links
      contains: What the sources say for each claim, and where to read them.
    - name: Overall assessment
      contains: A short summary of how accurate the whole text is.
