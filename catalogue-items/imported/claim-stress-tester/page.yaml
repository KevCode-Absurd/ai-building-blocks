thinking: high
thinking_why: It must try to prove itself wrong before it answers.
new_slug: claim-stress-tester
name: Claim stress tester
summary: Test a hard question before you act on it. Get a clear guess, a fair attempt to break it, the evidence and a final answer with doubts marked.
job: think-and-decide
headline: Claim stress tester
subhead: Give your AI a hard question where a wrong answer costs you. It picks a guess, tries hard to break it, and checks the evidence. You get an answer that was tested, with the doubts shown.
explain: |
  For a tough question where a wrong answer costs you, this makes the AI commit to a guess, then try hard to prove itself wrong before it gives a final answer. You see the guess, the test, the evidence and the answer that survived.

  It starts by choosing a mode. A live outage gets quick action. A simple fact gets a short answer. A vague question gets one round of clarifying questions. Only high stakes or why-is-it-broken questions run the full five stages: state a hypothesis that could be proven wrong, try to break it, gather evidence, judge it, and report what remains uncertain. The rule is that no answer is allowed without a stated way it could fail.
when:
  - You must decide something important and your first idea may be wrong.
  - A system is failing and you need to know the real cause.
  - You suspect an AI answer sounds sure but has no proof.
  - You want the uncertain parts marked, not hidden.
not_for:
  - "You need a quick fact or a rough estimate: just ask your AI directly, no protocol needed."
  - "A live outage is happening now: act first with a safe rollback, then test the cause after things are stable."
  - "You want a finished decision memo or test plan: use this result as the input, then write that document in a normal chat."
you_give:
  - The question or problem
  - What you already know or tried
  - The cost of being wrong (optional)
  - Data or logs (optional)
you_get:
  - A testable first guess
  - An attempt to disprove it
  - Evidence for and against
  - A tested answer with uncertainty marked
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text from this page. No code, files or paid tools are needed.
  - Before you type, write down the question, what you already know or tried, and what a wrong answer would cost. The skill depends on these details.
  - Type your question and add those details.
  - Paste any logs or data if you have them (optional).
  - Read the mode your AI picks. If it is a simple or urgent question, expect a short answer, not five stages.
  - Check the strongest attack and the list of what remains uncertain before you act on the answer.
  - Take the result into a decision memo or a test plan, and run the checks it lists.
output_sample:
  input:
    - Your question or problem
    - What you already know or have tried
    - The cost of being wrong (optional)
    - Data or logs (optional)
  output:
    - name: Mode choice
      contains: "Which route the question takes: act fast, short answer, one round of questions, or the full five stages."
    - name: Hypothesis
      contains: A first guess written so that something could prove it wrong.
    - name: Strongest attack
      contains: The best attempt to break the guess, with what would show it is false.
    - name: Evidence
      contains: Facts for and against the guess, checked against what you gave it.
    - name: Conclusion
      contains: The answer that survived, with a confidence level.
    - name: What remains uncertain
      contains: The parts the AI could not confirm and what to check next.
