thinking: medium
thinking_why: It checks many linked files against strict rules.
new_slug: class-roster-file-checker
name: Class roster file checker
summary: Give it a OneRoster CSV set. Get broken links, bad encodings and
  manifest errors found, with fixes.
job: work-with-files
headline: Class roster file checker
subhead: Find out why a student roster upload gets rejected before you send it.
  Give it your OneRoster CSV files, and it lists broken links between files, bad
  text encodings and manifest errors, each with a fix.
explain: |
  Find out why a student roster upload gets rejected before you send it. Give it your OneRoster CSV files, and it lists broken links between files, bad text encodings and manifest errors, each with a fix.

  It checks that the manifest sits at the top of the zip, names the right version, and lists every file in the bundle, no more and no less. It confirms the bundle is either a full snapshot or a set of changes, never a mix. It then follows the links across files and finds orphans, such as an enrolment pointing at a missing user. It also strips hidden characters at the start of files that cause import errors.
when:
  - Clever or ClassLink rejected your roster zip and gave a vague error.
  - You want to catch orphan enrolments before a nightly sync.
  - Your export has strange characters at the start of files.
  - You need a check that runs before every upload.
you_give:
  - Your OneRoster zip or CSV folder
  - The OneRoster version
  - Whether it is a full or change bundle
  - The error message you got (optional)
you_get:
  - A list of errors by file and row
  - Broken links and orphan records
  - Manifest problems
  - Encoding fixes
  - Steps to repair the bundle
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read files.
