thinking: medium
thinking_why: It suggests low-cost changes based on design research.
new_slug: classroom-nature-layout-planner
name: Classroom nature layout planner
summary: Plan a calmer classroom with light, layout and plant ideas. Describe your room and what feels off, and get a staged plan that fits your budget.
job: teach-and-train
headline: Classroom nature layout planner
subhead: Ideas to make your room calmer using light, plants, natural materials and views, scaled to your budget. You describe the room and what feels off, and you get a plan you can do in stages.
explain: |
  Ideas to make your room calmer using light, plants, natural materials and views, scaled to your budget. You describe the room and what feels off, and you get a plan you can do in stages. It is not medical advice.

  Any named study or percentage in the plan comes from the AI's memory. Check it at the original source before you use it.

  The skill looks at what you have now: windows, lighting, surfaces and any plants. It asks what you want, such as better focus or less restlessness. It then suggests ways to bring in daylight, move desks toward views, add plants that suit your rules, use wood and soft colours, and bring in nature sounds or images when real plants are not allowed.
when:
  - Your room feels harsh and students are restless.
  - You cannot keep live plants but want a natural feel.
  - You have almost no money to spend.
  - You want a quiet corner that helps students settle.
not_for:
  - "You need curriculum design or a behaviour policy: this item only changes the room, so plan those with your team."
  - "You need a school-wide policy or a building plan: ask your head teacher or a facilities manager."
  - "A student has medical or sensory needs that need expert advice: ask your school SENCO or an occupational therapist."
  - "You want lessons held outdoors: plan them yourself or with a colleague, as this item only changes the room."
you_give:
  - A description of the room
  - What you want to improve
  - Budget level (optional)
  - Restrictions such as no live plants (optional)
  - Sensory needs in the class (optional)
you_get:
  - A staged redesign plan
  - Light and layout changes
  - Plant and natural material ideas
  - Options that fit your budget
how_to_use:
  - Write a short description of your room. Add the windows, lights, floor, walls and any plants.
  - Say what you want to improve, such as focus or a calmer feel. Add your budget and any plant or landlord rules.
  - Open Claude, ChatGPT or Gemini and paste in the skill. Then paste your room details. A photo or sketch can help if your AI can read images.
  - Read the ranked changes first. The plan has a ranked list of changes with a cost level for each, then a staged plan, and it is short enough to read in a few minutes. Pick the free ones to try this week.
  - Check the free changes against your school's sensory and allergy policy before you make the first change, and check the plan against your school rules before you buy anything. Ask your SENCO about students with sensory needs.
  - Any study or figure in the plan comes from your AI's memory and is not checked. Look up the original source before you share it with staff or parents.
  - Take the ranked changes and cost levels to your head teacher or facilities manager for any later-phase change that needs approval.
  - Next, for lessons outdoors use outdoor-lesson-sequence-planner. To build a sense of belonging in the room, use classroom-belonging-planner. This is a CC BY-SA 4.0 copy of Gareth Manning's biophilic-learning-environment-designer, so keep the credit and the same licence on anything you share.
output_sample:
  input:
    - "A description of your room: size, layout, windows, lighting, surfaces and any plants"
    - What you want to improve, such as focus or a calmer feel
    - Your budget level (optional)
    - Rules such as no live plants or limited wall space (optional)
    - Sensory needs in your class (optional)
  output:
    - name: Assessment of Current Space
      contains: What the room has now, and which parts help or hurt your goal.
    - name: Priority Changes (Ranked by Impact)
      contains: The changes to make first, with the reason for each and its cost level.
    - name: Sensory Design Map
      contains: How light, sound, texture and sight work in the new layout, zone by zone.
    - name: Implementation Plan
      contains: Steps in stages, from free changes to ones that need money or approval.
    - name: Considerations for Specific Needs
      contains: Notes for sensory needs, plant rules and shared rooms.
