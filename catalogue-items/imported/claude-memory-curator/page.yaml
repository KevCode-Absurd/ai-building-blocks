thinking: medium
thinking_why: It reviews notes against a set method.
new_slug: claude-memory-curator
name: Claude memory curator
summary: Review your Claude Code memory notes. Keep the good ones, turn repeated lessons into rules and cut stale entries from your memory file.
job: set-up-ai
headline: Claude memory curator
subhead: Claude Code saves notes about your project as it works. This skill reviews those notes. Good ones become firm rules and stale ones get cut.
explain: |
  Claude Code keeps notes about your project as it works. This reviews those notes so the good ones become firm rules, and the stale ones get cut. You end up with a shorter, sharper memory file that Claude reads each session.

  The review reads your MEMORY.md file and sorts its entries into those worth keeping, those that repeat, and those that are out of date. Repeated lessons move into CLAUDE.md or the rules folder, where they load every time. Recurring fixes can be turned into a standalone skill. A status view shows line counts and topic files, since only the first lines of the memory file load automatically. There are commands for review, promote, extract, status and saving a note on purpose. This is an MIT-licensed copy of Alireza Rezvani's self-improving-agent skill.
when:
  - Your memory file has grown long and Claude seems to ignore the end.
  - The same lesson keeps showing up in your notes and you want it as a rule.
  - Old notes no longer match your project.
  - You want to turn a fix you repeat into a reusable skill.
not_for:
  - Your project is new and the memory file is empty. Wait until Claude has saved some notes first.
  - You already know the rules you want. Write them straight into CLAUDE.md instead.
  - You use a chat AI that cannot read your project files. Paste a few notes and ask a person on your team to review them.
you_give:
  - Your project's memory file (MEMORY.md)
  - Your CLAUDE.md file and rules folder
  - Which notes matter most (optional)
you_get:
  - A review that sorts each note into keep, merge or delete
  - Repeated lessons moved into CLAUDE.md or the rules folder
  - A standalone skill built from a fix you repeat
  - A memory health summary with line counts and advice
how_to_use:
  - Before you start, check you have Claude Code v2.1.32 or later with auto-memory turned on. Open Claude Code in your project and run the two plugin commands in the skill's Installation section (/plugin marketplace add, then /plugin install). They pull from the original alirezarezvani/claude-skills repo on GitHub, not from this copy. There is no Codex install script in this copy, so the Codex route is not available here. In Codex you can copy the skill folder in by hand.
  - Run /si:memory-review. Read the keep, merge and delete lists.
  - Save a copy of MEMORY.md before you promote or delete anything, since a promote removes the note from that file.
  - Run /si:promote on a note you want as a firm rule. Say yes before it writes anything. Then open CLAUDE.md or the rules file and check the new rule reads right.
  - Run /si:extract on a fix you keep repeating to turn it into a skill.
  - Run /si:memory-status to check line counts. Only the first 200 lines of the memory file load each session. After a promote, run it again to confirm the memory file got shorter.
  - This needs a tool that can read and edit your project files, such as Claude Code.
output_sample:
  input:
    - Your project's memory file (MEMORY.md)
    - Your CLAUDE.md and rules folder
    - Which notes matter most (optional)
  prerequisites:
    - Claude Code with auto-memory turned on
    - An AI that can read and change your project files
  output:
    - name: Memory review
      contains: A table with one row per note and the columns note, decision (keep, merge or delete) and reason.
    - name: Promotion candidates
      contains: Notes that keep coming back, ready to move into CLAUDE.md or the rules folder.
    - name: Stale entries
      contains: Notes that point to deleted files or old habits, marked for removal.
    - name: Promoted rules
      contains: Approved notes written into CLAUDE.md or a rules file, then removed from the memory file.
    - name: Extracted skill
      contains: A standalone skill folder built from a fix that keeps repeating.
    - name: Memory status
      contains: Line counts, topic files and advice, since only the first 200 lines load each session.
