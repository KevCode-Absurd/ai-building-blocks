thinking_why: It follows accounting rules with a few judgment calls.
new_slug: cleanup-liability-calculator
name: Cleanup cost liability calculator
summary: Give it an asset and its cleanup cost. Get the liability, yearly
  interest cost and journal entries worked out.
job: money-and-investing
headline: Cleanup cost liability calculator
subhead: If you must clean up or remove an asset later, the cost counts today.
  You give the asset and the estimated cleanup cost, and you get the liability,
  the yearly interest cost and the journal entries for each year.
explain: |
  If you must clean up or remove an asset later, the cost counts today. You give the asset and the estimated cleanup cost, and you get the liability, the yearly interest cost and the journal entries for each year.

  First it checks that a real obligation exists, from law or contract. You supply the expected retirement date, the cost in today's money and an inflation rate. It inflates that cost to the future date, then discounts it back using your credit adjusted rate to get the starting liability. That amount is added to the asset's cost and spread over its life. Each year the liability grows by an accretion charge.
when:
  - You own equipment that must be removed or restored at the end of its life.
  - An auditor asks how you set the decommissioning liability.
  - You need the yearly accretion expense for your books.
  - You want the entry for when the real cleanup cost differs from the estimate.
you_give:
  - The asset and its legal obligation
  - Estimated cleanup cost in today's money
  - Expected retirement date
  - Inflation rate and discount rate
you_get:
  - Starting liability at present value
  - The amount added to asset cost
  - A yearly accretion schedule
  - Depreciation of the added cost
  - Journal entries including settlement
how_to_use:
