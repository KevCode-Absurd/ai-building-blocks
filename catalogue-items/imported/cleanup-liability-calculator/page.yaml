thinking: medium
thinking_why: It follows accounting rules with a few judgment calls.
new_slug: cleanup-liability-calculator
name: Cleanup cost liability calculator
summary: Work out your cleanup cost liability for an asset. Give it the cost and retirement date. You get the yearly interest and journal entries.
job: money-and-investing
headline: Cleanup cost liability calculator
subhead: If you must clean up or remove an asset later, the cost counts today. You give the asset, the cleanup cost and the retirement date. You get the starting liability, the yearly interest cost and the journal entries.
explain: |
  If you must clean up or remove an asset later, the cost counts today. You give the asset and the estimated cleanup cost, and you get the liability, the yearly interest cost and the journal entries for each year.

  First it checks that a real obligation exists, from law or contract. You supply the expected retirement date, the cost in today's money and an inflation rate. It inflates that cost to the future date, then discounts it back using your credit adjusted rate to get the starting liability. That amount is added to the asset's cost and spread over its life. Each year the liability grows by an accretion charge.
when:
  - You own equipment that must be removed or restored at the end of its life.
  - An auditor asks how you set the decommissioning liability.
  - You need the yearly accretion expense, the interest that builds on the liability, for your books.
  - You need a clear schedule of the liability for each year until retirement.
not_for:
  - "You have no law or contract that forces the cleanup: ask your accountant about a provision under IAS 37 or ASC 450 instead."
  - "You need the liability shown in your financial statements: ask your accountant, or use the statement preparation skill if you have it."
  - "You want a quick guess with no accounting rules: use a simple spreadsheet that adds the cost and divides by the years."
you_give:
  - The asset and the law or contract that forces the cleanup
  - Estimated cleanup cost in today's money
  - Expected retirement date
  - Expected cost inflation rate
  - "Discount rate, which is the credit-adjusted risk-free rate: a risk-free rate raised for your own credit risk"
you_get:
  - The starting liability at present value
  - The amount added to the asset's cost
  - A yearly schedule of the liability growing
  - Yearly depreciation of the added cost
  - Journal entries for the start and each year
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Paste the asset, the law or contract behind the cleanup, the cost in today's money and the retirement date.
  - Add your inflation rate and your discount rate. If you do not know the discount rate, ask your accountant.
  - Read the yearly table first. Check that the last year's balance matches the future cost.
  - Check the journal entries with your accountant before you post them. Running the script needs an AI that can run Python.
output_sample:
  input:
    - The asset and the law or contract that forces the cleanup
    - Estimated cleanup cost in today's money
    - Expected retirement date
    - Expected cost inflation rate
    - Your discount rate (credit-adjusted risk-free rate)
  prerequisites:
    - An AI that can run Python, if you want the script to do the math (optional)
  output:
    - name: Initial Setup
      contains: The total future cleanup cost and the present value booked on day one.
    - name: Annual Table (Rollforward)
      contains: Each year's beginning balance, accretion, depreciation and ending balance.
    - name: Journal Entries
      contains: The entry for first recognition and the entries that repeat each year.
