thinking: medium
thinking_why: It spots known code smells and applies set fixes.
new_slug: code-cleanup-planner
name: Code cleanup planner
summary: Find the messy spots in your code and fix them in small, safe steps. A code cleanup planner that keeps your code working the same way.
job: test-and-fix-code
headline: Code cleanup planner
subhead: Messy code gets a short list of named problems and a safe order for fixing them. The code ends up easier to read and change, and it still does the same thing.
explain: |
  Messy code gets a short list of named problems and a safe order for fixing them. The code ends up easier to read and change, and it still does the same thing.

  It scans for long functions, deep nesting, copied logic, unexplained hard-coded numbers, dead code and bloated parameter lists, and says where each one is and why it hurts. Each problem gets a matching move, such as extract a function, rename, simplify a condition or name a constant. The moves are put in a sequence of small steps, applied one at a time. Tests run after each step, and it writes simple tests first if none exist.
when:
  - A function has grown to three hundred lines and nobody wants to touch it.
  - You inherited code with copied blocks all over.
  - You want cleanup done without changing behavior.
  - You need a plan to tidy a file before adding a feature.
not_for:
  - Your code is generated or vendored, like protobuf stubs or database migrations. Skip those files and leave them as they are.
  - Your code is a hand-tuned hot path where speed matters. Check with the person who owns it before changing it.
  - You want to add a new feature or change what the code does. Do that as a separate step, a person or your usual coding AI can help.
you_give:
  - The code to clean up
  - Your test command (optional)
  - Areas to leave alone (optional)
you_get:
  - A list of code problems with locations
  - A matching fix for each
  - A safe order of steps
  - Tests run after each change
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the full text of this skill into the chat.
  - Paste the code you want cleaned up. Add a goal, such as fewer nested ifs, if you have one.
  - Add your test command and any files to leave alone (optional).
  - Read the list of problems and the plan first. Approve it before any change is made.
  - Check that the tests pass after each step. A chat AI cannot run your tests, so run them yourself or use an AI that can run code.
output_sample:
  input:
    - The code you want cleaned up
    - A goal, such as fewer nested ifs or better names (optional)
    - Your test command (optional)
    - Files or areas to leave alone (optional)
  prerequisites:
    - An AI that can read your code files and run tests, for best results
  output:
    - name: Code smell list
      contains: Each problem found, such as a long function or copied logic, with its location and why it hurts.
    - name: Refactoring choices
      contains: The matching move for each problem, with the trade-offs and the gain you can expect.
    - name: Change order
      contains: A safe sequence of small steps, so each change can be checked and undone alone.
    - name: Refactored code
      contains: Your code changed one step at a time, with the same public behavior as before.
    - name: Test results
      contains: Test results after each step, with simple new tests if you had none.
    - name: Change summary
      contains: Each change, the problem it fixed and next steps, ready to use as a commit message.
