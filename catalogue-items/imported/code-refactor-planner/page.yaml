thinking: medium
thinking_why: It matches code smells to known moves and you review the changes.
new_slug: code-refactor-planner
name: Code refactor planner
summary: "Find code smells and get a code refactor plan: named moves to apply in small safe steps, with tests passing and behavior unchanged."
job: test-and-fix-code
headline: Code refactor planner
subhead: Messy code turns into a list of named moves you can apply one at a time, with tests passing after each. Nothing about what the code does should change.
explain: |
  Messy code turns into a list of named moves you can apply one at a time, with tests passing after each. Nothing about what the code does should change.

  The rule is that refactoring is not rewriting. Each move is one small structural change: verify tests pass, change one thing, verify again. The skill looks for known code smells, then picks the matching move from a catalog, such as extracting a function, replacing a conditional with polymorphism or removing duplication. Quality is scored out of ten from eight quick checks, so you can see progress. Big all-at-once rewrites are avoided because you cannot tell what broke.
when:
  - A class does five jobs and is hard to test.
  - You need to improve code without risking new bugs.
  - A review said the code smells but gave no steps.
  - You want a clear before-and-after quality score.
not_for:
  - Your code has no tests and you can't add any. Write a few basic tests first, or ask a developer to review it by hand.
  - The code will be deleted soon. Leave it alone, it is not worth the time.
  - You want to change what the code does or add a feature. Do that as a separate step, not in a refactor.
you_give:
  - The code to improve
  - Your test command (optional)
  - Parts that must not change (optional)
you_get:
  - Code smells with locations
  - A named move for each smell
  - A step-by-step order
  - A quality score out of ten
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code running or paid tool is needed.
  - Paste the skill instructions into the chat. The skill also uses six reference files that ship in this item's references folder. Paste or attach them with it. If you cannot, say so: it then works from the main text alone and is less exact.
  - Paste the code you want to improve. Add your test command and any parts that must not change (optional).
  - Read the smells and score first. Check that each named move fits your code.
  - No tests yet? Ask it first for a few simple tests that pin down what the code does today. Run them and make sure they pass before the first move.
  - Apply one move at a time. Run your tests after each move, and stop if one fails.
  - Ask for a new score when you finish.
  - Expect the first reply to be the smell list and the score. Reply by choosing one move to apply, then run your tests.
output_sample:
  input:
    - The code you want to improve
    - Your test command (optional)
    - Parts that must not change (optional)
  prerequisites:
    - Tests that pass before you start, or a way to add a few
  output:
    - name: Current score
      contains: A quality score out of ten, based on eight quick checks, with the smells pulling it down. The reply opens with this, then the smell table, then the ordered steps and the path to 10/10.
    - name: Code smells
      contains: A table with one row per smell found, in this order of columns, location, smell name, and the move that fixes it.
    - name: Named moves
      contains: The matching refactoring move for each smell, such as extracting a function or removing duplication.
    - name: Step order
      contains: The moves in a safe order, one small change at a time, with a test run after each.
    - name: Path to 10/10
      contains: The specific moves needed to raise the score to ten.
