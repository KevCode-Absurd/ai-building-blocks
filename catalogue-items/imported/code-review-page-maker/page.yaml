thinking: low
thinking_why: It converts text into a page with set parts.
new_slug: code-review-page-maker
name: Code review page maker
summary: Turn a markdown code review into one HTML review page. Diffs sit beside severity-tagged comments, with a jump menu and a named reviewer.
job: work-with-files
headline: Code review page maker
subhead: A markdown code review becomes one HTML page that is easy to scan. You get a jump menu, diffs on one side, comments on the other, severity tags such as blocker and major, and the reviewer named at the bottom.
explain: |
  A markdown code review becomes one HTML page that is easy to scan. You get a jump menu, diffs on one side, comments on the other, severity tags such as blocker and major, and the reviewer named at the bottom.

  Three small Python tools run in order. The first pulls the diff blocks out of your markdown. The second finds the callouts like blocker or major and attaches each to the closest diff chunk. The third builds the two-column page using your design settings. It will refuse input under 100 lines, input without diffs, and projects with no design system set up, and will tell you where to send those instead.
when:
  - You wrote a long review and want to share it as a clean page.
  - Your pull request notes have diffs and severity callouts.
  - You want reviewers to jump straight to blockers.
  - Plain markdown reviews are hard for your team to read.
not_for:
  - "Your notes have no diff blocks, or are a long report: use the md-document tool in the same toolset, or share the markdown as it is."
  - "You want slides from your markdown: use the md-slides tool in the same toolset."
  - "Your review is under 100 lines: keep it as plain markdown or paste it in a pull request comment thread."
you_give:
  - A markdown code review with diff blocks and severity callouts (BLOCKER, MAJOR, MINOR or NIT)
  - The name of the reviewer who signs off
  - A page title, such as your pull request title
  - Your design system, already set up with the design system step
  - Python 3 on your machine
you_get:
  - One HTML review page
  - Two-column diff and comment layout
  - Severity tags
  - A jump menu
how_to_use:
  - Set up your design system first. The tool will not run without it.
  - Download the skill folder and open it in an AI that can run Python code and save files.
  - Give your AI the markdown review, the reviewer name and the page title.
  - "Ask your AI to run the three steps in order: pull out the diffs, find the comments, then build the page."
  - Open review.html in your browser. Check that each comment sits next to the right diff and each severity tag is right.
  - Share the HTML file with your reviewers. If your input has no diffs or is only prose, use md-document instead.
output_sample:
  input:
    - Your markdown code review with diff blocks
    - Severity callouts marked BLOCKER, MAJOR, MINOR or NIT
    - The name of the person who signs off on the review
    - The page title, such as your pull request title
  prerequisites:
    - An AI that can run Python 3 code and save files
    - Your design system set up first, or the tool refuses to run
    - A review of at least 100 lines
  output:
    - name: hunks.json
      contains: The diff blocks pulled out of your markdown, ready for the next step.
    - name: annotations.json
      contains: Each severity callout, attached to the closest diff block before it.
    - name: review.html
      contains: One page with diffs on the left, comment cards on the right, and a reviewer footer.
    - name: Jump menu
      contains: A list at the top of every finding with its severity tag, a short preview and a link.
    - name: Approval bar
      contains: A green note that says no findings were flagged, shown only when there are LGTM marks and no severity callouts.
    - name: General comments
      contains: Comments not tied to any diff block, shown in their own section at the bottom.
