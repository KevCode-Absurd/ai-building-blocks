thinking: medium
thinking_why: It checks code against a known list and ranks what it finds.
new_slug: code-security-reviewer
name: Code security reviewer
summary: Check your Python, JavaScript, TypeScript or Go code for security gaps. Get a ranked code security review with a fix for each gap.
job: secure-code
headline: Code security reviewer
subhead: A ranked list of security gaps in your Python, JavaScript, TypeScript or Go code, each with a fix. You can also use it to write new code that is safe from the start.
explain: |
  A ranked list of security gaps in your Python, JavaScript, TypeScript or Go code, each with a fix. You can also use it to write new code that is safe from the start.

  It first finds which languages and frameworks your project uses, front end and back end. Then it loads the matching security notes for each one, reading all that apply, including the general one for the language. With those in hand it reviews your code against that framework's known risks. If you ask for it, you get a written report with the most serious items first and a suggested change for each.
when:
  - You are shipping a web app and want a security check.
  - You want new code written with safe defaults.
  - You use a framework and are unsure of its security traps.
  - You need a short report of what to fix first.
not_for:
  - "You want a general code review or help fixing a bug: ask your AI directly, as this skill only covers security."
  - "You need proof your app is safe before it handles sensitive data: hire a professional penetration tester."
  - "Your code is in a language other than Python, JavaScript, TypeScript or Go: ask a developer who knows that language."
you_give:
  - Your code or project folder
  - The frameworks in use (optional)
  - Whether you want a full report (optional)
you_get:
  - Languages and frameworks found
  - Security gaps ranked by seriousness
  - A fix for each gap
  - Safer code for new work
how_to_use:
  - Open Claude, ChatGPT or Gemini. Use a tool that can read your project files, or paste the code you want checked.
  - Gather the list of frameworks you use, how you deploy (on your machine, hosted, or behind a TLS proxy), and any project security notes or rules to override.
  - Attach the whole skill folder, or paste the skill text and each reference file for your framework. The framework rules live in the references folder, so without them the review is general.
  - Say that you want a security review. Add your project folder or code, and name your frameworks if you know them.
  - Say where the report file should be saved, or let your AI pick a place.
  - Read the report. The most serious findings come first.
  - Ask your AI to fix one finding at a time. Run your tests after each fix.
  - This is OpenAI's security best practices skill under the Apache 2.0 licence. The text is theirs, not written for this library.
output_sample:
  input:
    - Your code or project folder
    - The frameworks you use (optional)
    - Whether you want a full written report (optional)
    - Where to save the report (optional)
  prerequisites:
    - An AI that can read your project files, or code pasted into the chat
  output:
    - name: Languages and frameworks found
      contains: The languages and frameworks your project uses, front end and back end, with the evidence for each.
    - name: security_best_practices_report.md
      contains: A written report with a short summary at the top and findings grouped by how serious they are.
    - name: Numbered findings
      contains: Each gap has a number and the file and line numbers where it appears. Critical ones add a one-sentence impact.
    - name: Suggested fixes
      contains: One fix per finding, with a short comment on why the safer way matters, offered after you read the report.
    - name: Secure-by-default code
      contains: New code written with safe defaults, when you ask for new work instead of a review.
