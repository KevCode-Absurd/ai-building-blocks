thinking: medium
thinking_why: It must change structure without changing what the code does.
new_slug: code-simplifier
name: Code simplifier
summary: Point it at code that works but is hard to read. Get a simpler version
  that behaves the same.
job: test-and-fix-code
headline: Code simplifier
subhead: Code that works but is hard to read becomes simpler and behaves exactly
  the same. The test is whether a new teammate would understand the new version
  faster.
explain: |
  Code that works but is hard to read becomes simpler and behaves exactly the same. The test is whether a new teammate would understand the new version faster.

  Shorter is not the goal. It looks for deep nesting, long functions, unclear names and duplication, then makes small changes: flatter conditions, clearer names, merged repeats. It does this after the feature works and tests pass, never before you understand the code. It skips code that is already clean or where the simpler version would be measurably slower. Tests run after changes to confirm nothing moved.
when:
  - A feature works but the code feels heavy.
  - A reviewer flagged deeply nested logic.
  - A merge left duplicate logic across files.
  - Code written in a hurry needs tidying before others read it.
you_give:
  - The code to simplify
  - Tests that prove it still works (optional)
  - Any speed limits to respect (optional)
you_get:
  - A simpler version of the code
  - A list of what changed and why
  - Confirmation behavior is unchanged
  - Places left alone on purpose
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read your project files.
