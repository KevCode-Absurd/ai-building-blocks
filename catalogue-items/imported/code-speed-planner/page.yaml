thinking: high
thinking_why: It must reason about cost before writing any code.
new_slug: code-speed-planner
name: Code speed planner
summary: Before it writes loops or queries, it states the best approach and
  cost. Get code that avoids slow patterns.
job: build-software
headline: Code speed planner
subhead: Code that avoids slow patterns from the start. Before it writes a loop
  or a query, it states the best approach and what it will cost, so O(n squared)
  work and N+1 queries do not reach production.
explain: |
  Code that avoids slow patterns from the start. Before it writes a loop or a query, it states the best approach and what it will cost, so O(n squared) work and N+1 queries do not reach production.

  It acts as a gate for anything that touches many items: loops inside loops, a search inside a loop, an await inside a map over independent items, or one query per row. For each, it names a better structure, like a hash lookup, a sort once, a batch or a join. It can also audit existing code or a pull request for these known traps, including AI-written code that looks neat but hides slow steps.
when:
  - A page gets slower as your data grows.
  - Your code runs one database query per item.
  - You are reviewing code that has a loop inside a loop.
  - You want speed checked before code is written.
you_give:
  - The task or the code to review
  - Typical data size (optional)
  - The language and database (optional)
you_get:
  - The best approach with its cost
  - Slow patterns found
  - Faster replacements
  - Code that avoids those patterns
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your project files.
