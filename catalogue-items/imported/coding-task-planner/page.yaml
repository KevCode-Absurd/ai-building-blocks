job: build-software
headline: Coding task planner
subhead: A short plan you can act on, produced before anyone touches the code.
  It lists what is in scope, what is not, and an ordered checklist from
  discovery to rollout.
explain: |
  A short plan you can act on, produced before anyone touches the code. It lists what is in scope, what is not, and an ordered checklist from discovery to rollout.

  It works read-only. It skims your README, docs and the files most likely to change, and notes the language, tests and deployment. It asks at most one or two questions, and only if it cannot plan without the answer. Otherwise it makes an assumption and says so. The plan opens with a short paragraph on the approach, then six to ten atomic items, verb first, covering changes, tests and open questions.
when:
  - You have a vague task and need a plan before starting.
  - You want to hand a clear checklist to a teammate or agent.
  - You are unsure what a feature will touch.
  - You need to decide the order of work.
you_give:
  - The task in your own words
  - Repo access
  - Limits on time or tools (optional)
you_get:
  - A short intent paragraph
  - In-scope and out-of-scope lists
  - An ordered action checklist
  - Test steps and open questions
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your project files.
