thinking: low
thinking_why: It checks a short draft against a fixed list.
new_slug: cold-email-pre-send-checker
name: Cold email pre-send checker
summary: Check your cold email before you send it. It tests claims about the prospect, checks legal basics and gives you a tighter version.
job: write-emails
headline: Cold email pre-send checker
subhead: A careful second opinion on a cold email before you hit send. It tests every claim about the prospect against their real page, checks legal basics, and returns a tighter version.
explain: |
  A careful second opinion on a cold email before you hit send. It tests every claim about the prospect against their real page, checks legal basics, and returns a tighter version.

  You paste the draft, plus the text of the pages it refers to. If it has a web tool it can fetch them. Each statement about them is marked supported, unsupported or not checked, with the evidence quoted. It also asks you to confirm any result or client you mention is true. It then checks the legal basics for the sender's and recipient's countries. If no prospect text is available after one ask, those claims stay marked as not checked.
when:
  - You wrote a personalized opener and want to be sure it is accurate.
  - You are emailing a country with strict rules.
  - You claim a client result and need it checked.
  - A cold email feels long and you want it tighter.
not_for:
  - "You are writing a newsletter or a bulk campaign: use your email tool's own compliance checks, and have a lawyer review the setup."
  - "You are replying to someone who already wrote back: send a normal reply, as there is nothing to test."
  - "You need legal advice: ask a lawyer or read your regulator's guidance, as this only checks basics."
you_give:
  - The draft with subject and body
  - Text from the prospect's page
  - Proof for your claims (optional)
  - Sender and recipient countries (optional)
you_get:
  - A claim-by-claim check
  - Legal basics notes
  - Flags on unproven statements
  - A tighter rewrite
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste your draft email, with the subject line and body.
  - Paste the text from the prospect's page. If your AI can browse the web, you can give it the link instead.
  - Add proof for any result or client you mention, and say which countries you and the recipient are in (optional).
  - Read the verdict and the claims table first. Fix anything marked unsupported or needs proof.
  - Use the tightened version, fill in every [CONFIRM] note, then send it yourself.
output_sample:
  input:
    - Your draft cold email, with subject and body
    - Text from the prospect's page (or let your AI fetch it, if it can browse)
    - Proof for any result or client you mention (optional)
    - Your country and the recipient's country (optional)
  output:
    - name: Verdict
      contains: "One line: send as is, send after fixes, or do not send, with the main reason."
    - name: Claims table
      contains: Each claim about the prospect or you, with quoted evidence or a status like unsupported, not checked or needs proof.
    - name: Issues
      contains: A numbered list, most serious first, with the exact words from your draft, why it matters and the fix.
    - name: Tightened version
      contains: Your draft with unsupported claims removed or marked to confirm, one ask and plain words.
    - name: Before you send
      contains: What you must confirm or add, such as postal address, opt-out line and proof for claims.
