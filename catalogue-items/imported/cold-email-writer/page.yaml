thinking: medium
thinking_why: It follows a set format but tailors each message.
new_slug: cold-email-writer
name: Cold email writer
summary: Name your buyer and offer. Get cold emails, follow-ups and a sending
  setup that gets replies.
job: write-emails
headline: Cold email writer
subhead: Cold emails that read like a sharp person wrote them, plus follow-ups
  and a sending setup that keeps you out of spam. The goal is replies that turn
  into meetings.
explain: |
  Cold emails that read like a sharp person wrote them, plus follow-ups and a sending setup that keeps you out of spam. The goal is replies that turn into meetings.

  It asks who you are writing to, what outcome you want, what value you offer, your proof, and any signal such as funding, hiring or a recent post. If you have little, it still writes and tells you what would make it better. It then covers the follow-up sequence, how to work with other channels, and how to handle replies. It checks your product marketing notes first, so you do not repeat yourself.
when:
  - You are starting outbound sales and need your first sequence.
  - Your emails get opens but no replies.
  - You have a buyer list and a clear offer.
  - You need follow-ups that do not sound pushy.
you_give:
  - Who you are writing to
  - Your offer and proof
  - The outcome you want
  - Research signals on the prospect (optional)
you_get:
  - Cold emails to send
  - Follow-up messages
  - Subject line options
  - Sending setup advice
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
