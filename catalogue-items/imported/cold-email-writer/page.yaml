thinking: medium
thinking_why: It follows a set format but tailors each message.
new_slug: cold-email-writer
name: Cold email writer
summary: Write cold emails, follow-ups and a safe sending setup. Give it your buyer and offer, and get a cold email sequence built to win replies.
job: write-emails
headline: Cold email writer
subhead: Cold emails that read like a sharp person wrote them, plus follow-ups and a sending setup that keeps you out of spam. The goal is replies that turn into meetings.
explain: |
  Cold emails that read like a sharp person wrote them, plus follow-ups and a sending setup that keeps you out of spam. The goal is replies that turn into meetings.

  It asks who you are writing to, what outcome you want, what value you offer, your proof, and any signal such as funding, hiring or a recent post. If you have little, it still writes and tells you what would make it better. It then covers the follow-up sequence, how to work with other channels, and how to handle replies. It checks your product marketing notes first, so you do not repeat yourself.
when:
  - You are starting outbound sales and need your first sequence.
  - Your emails get opens but no replies.
  - You have a buyer list and a clear offer.
  - You need follow-ups that do not sound pushy.
not_for:
  - "You write emails to customers or sign-ups you already have: use the emails skill, which covers lifecycle email."
  - "You need a list of prospects first: use the prospecting skill to build and check the list, then come back."
  - "You want a call script or voicemail: use the sales-enablement skill."
you_give:
  - Who you are writing to
  - Your offer and proof
  - The outcome you want
  - Research signals on the prospect (optional)
you_get:
  - Cold emails to send
  - Follow-up messages
  - Subject line options
  - Sending setup advice
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. If you have a product marketing notes file, add it too.
  - Tell your AI who you are writing to, what you want, your offer and your proof.
  - Add any signals about the prospect, like funding, hiring or a recent post (optional).
  - Read the emails aloud. Cut any line that sounds like marketing copy.
  - Before you send, set up a separate sending domain and check your list. This needs a paid sending tool such as Instantly, lemlist or Outreach.
  - Turn off open tracking and watch replies. When someone replies, stop every other message to them.
output_sample:
  input:
    - Who you are writing to, with their role and company
    - What you want from them, such as a reply or a meeting
    - Your offer and the problem it solves for them
    - Your proof, such as a result or case study
    - Signals about the prospect, like funding or hiring (optional)
  prerequisites:
    - A tool to send the emails, such as Instantly, lemlist or Outreach. These are paid tools, so check their plans.
    - A separate sending domain, set up before the first send
  output:
    - name: Cold email
      contains: A short first email in a peer voice, with one personal opening tied to the problem and one easy ask.
    - name: Subject lines
      contains: A few short, lowercase subject lines that look like they came from a colleague.
    - name: Follow-up sequence
      contains: Three to five emails with growing gaps, each adding a new angle, ending in a breakup email.
    - name: Sending setup advice
      contains: Steps for secondary domains, list checks, tracking off, and an opt-out line with your postal address.
    - name: Channel plan
      contains: How LinkedIn, calls and email fit together, with all channels stopping once the prospect replies.
    - name: Reply handling guide
      contains: How to sort replies, answer fast, and book a meeting with two proposed times.
    - name: Gaps note
      contains: What extra detail would make the emails stronger, if you gave little to start with.
