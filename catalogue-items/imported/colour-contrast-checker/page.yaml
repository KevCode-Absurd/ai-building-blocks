thinking: low
thinking_why: It calculates ratios and follows fixed rules.
new_slug: colour-contrast-checker
name: Colour contrast checker
summary: Check your CSS colour tokens for readability in light and dark mode. Get each failing pair with the closest colour that passes WCAG.
job: design-work
headline: Colour contrast checker
subhead: Give your AI your CSS colour tokens. It checks each text and background pair in light and dark mode against WCAG 2.2 AA, and suggests the closest colour that passes. Fix a token once and it is fixed everywhere.
explain: |
  Low contrast is cheaper to fix in the colour token than on each screen. This checker works on your colour variables, so one change fixes every place they are used. It is a contrast checker for design tokens, not for screenshots.

  A small Node script, shipped as text in the skill's references folder, reads your --color-* CSS variables. It pairs text colours with backgrounds by name, and measures each pair in the light theme and in dark mode. Normal text needs 4.5 to 1. Large text, borders, icons and focus rings need 3 to 1. For a failing pair it keeps the hue and moves the lightness the least it can. It also suggests one value that passes on every background that token sits on.

  It measures tokens, not pixels. Text on photos or gradients, and colours with opacity, need a look on screen. The script prints in Spanish, so the skill file includes a table of what the words mean. Licence: this skill follows the MIT licence in its original header and the included LICENSE file. Keep the source notices and author credits. We also retain the collection's LICENSE-CONTENT file.
when:
  - You are about to approve a new colour palette.
  - Your dark mode text is hard to read.
  - An accessibility audit flagged low contrast and you want the fix in one place.
  - You added a brand colour and need to know where it fails.
not_for:
  - "Your text sits on photos, gradients or see-through colours: check those by eye on the screen, because this reads tokens only."
  - "You need a full accessibility audit: contrast is only one part of WCAG, so ask an accessibility specialist to sign off before you publish."
  - "You have one brand colour and no tokens yet: use design-token-builder first, then check the result here."
  - "You want to check a whole page, not just colours: use page-design-standards-checker."
you_give:
  - Your CSS file with colour variables, such as src/styles/tokens.css
  - Your dark mode colours, in the same file (optional)
  - A note on which tokens are text and which are backgrounds, if your names are unusual (optional)
you_get:
  - A pass or fail line for each text and background pair, with its ratio
  - Separate results for light and dark mode
  - The closest passing colour for each failure, with the same hue
  - One value per token that passes on every background
  - A list of where each token is used, and what to check by eye
how_to_use:
  - Open an AI that can run code and read your project files, such as Claude Code. Without one, use step 5.
  - Add the whole skill folder, including references, which holds the script. The script is text inside references/contraste-checker.md. Your AI must save it as a file named contraste.mjs before it can run, so do not skip that step.
  - Ask it to check your colour tokens, and point it at your CSS file. It needs Node 18 or newer. The script prints in Spanish. That is expected. The skill file has a table that translates each key word (for example, sugerencia para means suggestion for, modo oscuro means dark mode), and your AI will explain the results in English.
  - Read the fail lines first. For each, choose to darken the token, keep the colour for large text only, or add a new text token.
  - No code tools? Paste each text colour with its background as hex codes. Your AI works the ratios by hand and shows its numbers. Check close calls in a contrast tool.
  - Approve one change at a time, then ask it to run the check again to show the pair passes.
how_it_works:
  - title: Read the tokens
    text: It finds your --color-* variables in hex, rgb, hsl or oklch, and splits the default theme from dark mode.
  - title: Pair text with backgrounds
    text: It matches tokens by name, such as text over background or surface. You can give it the pairs yourself.
  - title: Measure each pair
    text: It works out the contrast ratio for each pair in each theme against the WCAG 2.2 AA minimums.
  - title: Suggest a fix
    text: For each failure it keeps the hue and finds the nearest lightness that passes, plus one value that passes everywhere.
  - title: Check what the script cannot see
    text: It lists images, gradients, opacity and hard-coded colours for you to check on screen.
  - title: Report and ask first
    text: It gives a table of fixes and changes nothing until you agree.
output_shape: |-
  Light theme
    <OK or NO> <ratio>:1 (min <4.5 or 3>) <text token> <hex> on <background token> <hex>
      suggestion for <token>: <colour> (<hex>) -> <new ratio>:1
  Dark mode
    <same lines>
  One value per token: <token> -> <hex>, passes on <n> backgrounds (worst case <ratio>:1)
  Report
    | Pair | Now | Minimum | Suggestion | Where it is used |
  Check by eye: <images, gradients, opacity, hard-coded colours>
  Next step: <apply the fix, then run the check again>
output_sample:
  input:
    - Your CSS file with colour variables
    - Pairs to check, if your token names are unusual (optional)
  prerequisites:
    - An AI that can run code and read your files (Node 18 or newer)
    - The skill's references folder, which holds the script
  output:
    - name: Light theme results
      contains: A pass or fail line per pair with its ratio, the minimum and a suggested colour.
    - name: Dark mode results
      contains: The same lines, measured in dark mode.
    - name: One value per token
      contains: A single colour for each failing token that passes on every background it sits on.
    - name: Report table
      contains: Each pair with its current ratio, the minimum, the suggestion and where the token is used.
    - name: Check by eye
      contains: Images, gradients, opacity and hard-coded colours that the script cannot measure.
works_best_with:
  tools:
    - name: Claude Code
      why: It can read your project files, run the script and apply the fix once you agree.
    - name: Any AI that can run Node
      why: The script needs Node 18 or newer. A plain chat AI can do the hand-worked version.
  inputs:
    - A screenshot of your dark mode
    - A list of hard-coded colours outside your tokens
    - The pairs you already know are a problem
terms:
  - term: WCAG 2.2 AA
    meaning: A web accessibility standard. It asks for 4.5 to 1 contrast for normal text and 3 to 1 for large text and icons.
  - term: Contrast ratio
    meaning: How far apart two colours are in brightness. A higher number is easier to read.
  - term: Token
    meaning: A named colour in your CSS, such as --color-text, used in place of a raw colour code.
  - term: Hue
    meaning: The colour family, such as blue or green. Keeping it means the fix still looks like your brand.
