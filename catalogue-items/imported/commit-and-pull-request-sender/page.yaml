thinking: low
thinking_why: It runs a fixed git sequence.
new_slug: commit-and-pull-request-sender
name: Commit and pull request sender
summary: Say the word. Get your changes committed, pushed and opened as a GitHub
  pull request in one go.
job: ship-and-host
headline: Commit and pull request sender
subhead: Say the word. Get your changes committed, pushed and opened as a GitHub
  pull request in one go. Bring your changes in a git repo. Use the result to
  plan your next step.
explain: |
  Your changes get committed, pushed and opened as a GitHub pull request in one go. You say the word and review the result.

  It first checks that the GitHub CLI is installed and signed in, and stops with clear instructions if not. It makes a branch name when you are on the main branch, writes a terse commit message and a pull request title that covers the whole diff. It then looks for your repository's pull request template and uses it. If it finds more than one, it stops and asks which one. With no template, it falls back to a simple body. It needs the gh tool.
when:
  - You finished a change and want it up for review fast.
  - Your repo has a pull request template you keep forgetting to fill.
  - You are on the main branch and need a new branch made.
  - You want a clear title and body without writing them yourself.
you_give:
  - Your changes in a git repo
  - The GitHub CLI signed in
  - Your go-ahead to push
  - A branch name (optional)
you_get:
  - A new branch
  - A commit
  - A pushed branch
  - An open pull request with the link
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run git and the GitHub CLI.
