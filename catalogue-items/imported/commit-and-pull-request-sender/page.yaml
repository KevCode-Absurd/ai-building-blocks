thinking: low
thinking_why: It runs a fixed git sequence.
new_slug: commit-and-pull-request-sender
name: Commit and pull request sender
summary: Commit your changes, push them and open a GitHub pull request in one go. Give it a git repo and a signed-in GitHub CLI. You get a PR link.
job: ship-and-host
headline: Commit and pull request sender
subhead: Say the word. Get your changes committed, pushed and opened as a GitHub pull request in one go. Bring your changes in a git repo. Use the result to plan your next step.
explain: |
  Your changes get committed, pushed and opened as a GitHub pull request in one go. You say the word and review the result.

  It first checks that the GitHub CLI is installed and signed in, and stops with clear instructions if not. It makes a branch name when you are on the main branch, writes a terse commit message and a pull request title that covers the whole diff. It then looks for your repository's pull request template and uses it. If it finds more than one, it stops and asks which one. With no template, it falls back to a simple body. It needs the gh tool. This is OpenAI's commit-and-pull-request skill under the Apache 2.0 licence, copied as it is apart from the name.
when:
  - You finished a change and want it up for review fast.
  - Your repo has a pull request template you keep forgetting to fill.
  - You are on the main branch and need a new branch made.
  - You want a clear title and body without writing them yourself.
not_for:
  - "You want to review your changes before anything is pushed: use plain git and check each step yourself."
  - "The GitHub CLI (gh) is not installed and you will not install it: open the pull request by hand on GitHub."
  - "Your repo holds secrets or files you did not mean to share: clean them up first, then commit by hand."
you_give:
  - Your changes in a git repo
  - The GitHub CLI signed in
  - Your go-ahead to push
  - A branch name (optional)
you_get:
  - A new branch
  - A commit
  - A pushed branch
  - An open pull request with the link
how_to_use:
  - Open your AI in a tool that can run git and shell commands, such as Claude Code. A plain chat window cannot do this.
  - Check that the GitHub CLI is installed and signed in. The skill tests this first and stops with instructions if it is not.
  - Paste the skill and say you want to commit, push and open a pull request.
  - Look at the list of changed files when your AI shows it. Stop it if you see secrets or files that do not belong.
  - Let it commit, push and open the pull request. It starts a new pull request as a draft.
  - Open the link, read the title and body, then mark the pull request ready when you are happy.
  - If the push or the pull request fails, run gh auth status to check you are signed in, then ask your AI to run it again.
  - Next, have the change reviewed, for example with the Bug and security code reviewer.
output_sample:
  input:
    - Your changes in a git repo
    - Your clear request to commit, push and open a pull request
    - A branch name (optional)
  prerequisites:
    - An AI that can run git and shell commands
    - The GitHub CLI (gh) installed and signed in
  output:
    - name: Branch
      contains: A new branch if you were on main, master or the default branch. Otherwise your current branch is kept.
    - name: Commit
      contains: One short commit message that holds all your staged changes.
    - name: Pushed branch
      contains: Your branch sent to GitHub with tracking set up.
    - name: Pull request title
      contains: A title in the form type, optional scope, then a short summary of the whole change.
    - name: Pull request body
      contains: Why the change was made first, then what changed. It follows your repo's template if there is one.
    - name: Pull request link
      contains: A new draft pull request, or your existing pull request updated in place, with its link.
