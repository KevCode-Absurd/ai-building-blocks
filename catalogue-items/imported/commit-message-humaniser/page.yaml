thinking: low
thinking_why: It rewrites a short line.
new_slug: commit-message-humaniser
name: Commit message humaniser
summary: Rewrite a commit message so it sounds like a careful engineer wrote it. Cuts AI filler and keeps the Conventional Commits format.
job: write-and-tell-stories
headline: Commit message humaniser
subhead: A commit message that reads like a careful engineer wrote it at the end of a real day, with no AI filler. It keeps the Conventional Commits format.
explain: |
  A commit message that reads like a careful engineer wrote it at the end of a real day, with no AI filler. It keeps the Conventional Commits format.

  It strips marketing words such as comprehensive, powerful, enhance and smoothly, and the habit of starting with "This commit". The subject uses the form type, optional scope, then a short command like add, fix or move, kept to about 50 characters and never past 72. No trailing period. A body appears only when the subject cannot carry the why, such as breaking changes, migrations or security context. It leads with why, not just what. Licence: this copy is from sickn33's collection, whose written content is CC BY 4.0 (see LICENSE-CONTENT). The skill file's own header says MIT, set by the original author MohamedAbdallah-14. Both let you reuse it if you keep the credit.
when:
  - Your AI wrote a commit message full of buzzwords.
  - You want messages in Conventional Commits style.
  - A subject line runs far past 72 characters.
  - You want your history to read like a person wrote it.
not_for:
  - "You need a squash-merge title for a pull request: write it by hand from the PR summary, since this skill works on one commit."
  - "You have no diff and no idea why the change was made: ask your AI to read the diff first, or write the body yourself."
  - "You want your AI to run git commit for you: copy the result and run the command yourself, as this skill only writes the text."
you_give:
  - The commit message to rewrite
  - The staged changes (optional)
  - Your project's casing style (optional)
you_get:
  - A plain subject line
  - A short body only if needed
  - Conventional Commits format
  - Filler words removed
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini and paste the skill instructions. No code running or files are needed.
  - Paste the commit message you want to fix.
  - Add the staged diff and your casing rule if you have them.
  - Ask for a subject-only rewrite first. Ask for a body only if the why is still unclear.
  - Check the result. If it is missing the why, add it or answer your AI's question.
  - Copy the message into git commit, or save it to a file and use git commit -F.
  - Next, check how it reads with git log --oneline. For a squash-merge title, write it from the pull request summary instead.
output_sample:
  input:
    - The commit message you want to rewrite
    - The staged changes or diff (optional)
    - Your project's casing or style rule (optional)
    - The issue number to link (optional)
  output:
    - name: Subject line
      contains: One line in type, optional scope and a short command form, aimed at 50 characters and never past 72.
    - name: Body
      contains: "Only when needed: the why, breaking changes, migrations or security notes, wrapped at 72 characters."
    - name: Refs line
      contains: An issue link such as Closes or Refs, added at the end when you give a number.
    - name: Breaking change note
      contains: A BREAKING CHANGE line, written out only when the change really breaks users.
