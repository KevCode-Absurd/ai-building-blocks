thinking: medium
thinking_why: It builds a plan from your audience.
new_slug: community-growth-planner
name: Community growth planner
summary: Say who your community is for. Get a plan to start it, grow it and turn
  members into advocates.
job: grow-social
headline: Community growth planner
subhead: A plan to start a community, grow it and turn members into people who
  speak up for you. It ties what members enjoy to results your business can
  measure.
explain: |
  A plan to start a community, grow it and turn members into people who speak up for you. It ties what members enjoy to results your business can measure.

  It first asks what your product does, which platform you use, such as Discord, Slack, Circle or Reddit, what stage you are at, your main goal and who your ideal member is. The goal can be retention, support savings, product feedback or word of mouth. Missing details are assumed and flagged. It then builds strategy principles, a launch approach, ways to keep activity going and a path from new member to advocate. It reads your product marketing notes first if you have them.
when:
  - You want to launch a community around your product.
  - Your group has 50 members and has gone quiet.
  - You want fewer support tickets through peer help.
  - You need a way to find and reward your best members.
you_give:
  - Your product or brand
  - The community platform
  - Current stage and size
  - Your main goal
  - Your ideal member
you_get:
  - A community strategy
  - A launch plan
  - Ways to keep members active
  - A path from member to advocate
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
not_for:
  - You want a small, time-boxed test with a cost cap and a stop rule. Use the Community growth experiment planner.
  - Your members are developers and you need channels, welcome text and rules. Use the Developer community builder.
  - You want reward sizes and an invite-to-payout flow. Use the Referral program designer.
output_sample:
  input:
    - What your product or brand does and who uses it
    - The platform you use or are thinking about, such as Discord, Slack, Circle or Reddit
    - Your stage and size, from pre-launch to established
    - Your main goal, such as retention, fewer support tickets, feedback or word of mouth
    - Your product marketing notes (optional)
  output:
    - name: Community strategy doc
      contains: Platform choice, the identity members share, the weekly core loop and a 90-day launch plan.
    - name: Channel architecture
      contains: Each channel or category with its purpose and posting guidelines.
    - name: New member welcome path
      contains: A pinned welcome post, a DM template and first-week prompts.
    - name: Community ritual calendar
      contains: Weekly and monthly threads, calls and challenges that build a habit.
    - name: Ambassador program brief
      contains: Who to pick, the benefits, an outreach template and how to track results.
    - name: Health audit report
      contains: Your current numbers, a diagnosis and the top three things to fix.
