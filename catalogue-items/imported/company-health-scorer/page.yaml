thinking: medium
thinking_why: It scores set areas, then ranks fixes.
new_slug: company-health-scorer
name: Company health scorer
summary: Score your company health across eight areas with a clear colour for each. See which problem to fix first and which numbers are missing.
job: lead-people
headline: Company health scorer
subhead: Give it your stage and key numbers from each team. It scores eight areas green, yellow or red against stated thresholds for your stage. Unknown inputs are flagged, not guessed. You get the numbers behind each colour and a list of what to fix first.
explain: |
  A traffic-light score for your company across eight areas, so you see which problem to fix first instead of guessing. Each area is judged against stated thresholds, not a feeling.

  The areas cover money, revenue, product, engineering, people, operations, security and market. For each one, Claude uses a few key measures and a green, yellow or red band. Runway thresholds depend on your stage. For example, runway is red under 12 months at Seed and under 6 months at Series A and B. Net revenue retention under 100 percent is red. Burn compared to new revenue and customer concentration get the same treatment. You can paste numbers, answer questions, or run the bundled Python script for a guided score. You can also ask for one area only and go deeper there.
when:
  - You want one view of how the whole company is doing, not just revenue.
  - A board or investor meeting is coming and you need to know your weak spots.
  - You suspect a problem in one team but have no number to show it.
  - You want to repeat the check each quarter and compare.
not_for:
  - "You want a forecast of what will happen next: build a financial model or ask your finance lead, because this scores only the numbers you supply."
  - "You already track one team's problem with a clear number: do a single-team review instead of scoring the whole company."
  - "You want to fill gaps by guessing: gather the real numbers first, because missing data is shown as unscored, not estimated."
you_give:
  - Key numbers from each team
  - Company stage
  - The area to deep dive on (optional)
you_get:
  - A traffic-light score for eight areas
  - The numbers behind each colour
  - A list of what to fix first
  - A saved score to compare next quarter
how_to_use:
  - Pick your company stage first, such as Seed or Series A. Stage sets the thresholds. Each area's 1 to 10 score is the average of its metric scores. Green is 7 to 10, yellow 4 to 6 and red 1 to 3.
  - "Gather key numbers for each area, as metric, value, unit and date: money (runway, burn, margin), revenue (retention, churn, pipeline), product (NPS, usage), engineering (deploys, incidents), people (attrition, engagement), operations, security and market."
  - Open Claude, ChatGPT or Gemini and paste the skill. Then paste your stage and numbers. Missing numbers are fine, they are marked as data needed.
  - Or run the Python scorer if your AI can run code. It asks for each metric and prints the scored dashboard.
  - Read the dashboard. Check each colour against the number and threshold shown beside it.
  - Start with the top priorities. Give each one an owner and a date.
  - Save the result and run it again next quarter to compare.
  - If the benchmark file or the Python script is not available in your AI, it uses the thresholds written in the skill and tells you.
output_sample:
  input:
    - Your company stage, such as Seed or Series A
    - Key numbers for each area, such as runway, retention, attrition and incidents
    - The one area you want to look at closely (optional)
  prerequisites:
    - An AI that can run Python code, only if you want the guided scorer script (optional)
    - The benchmark reference file, for stage thresholds
  output:
    - name: Dashboard header
      contains: Company name, date, stage, overall score out of 10 and whether the trend is improving, stable or declining.
    - name: Dimension scores
      contains: One line for each of eight areas with a colour, a score and the key numbers behind it.
    - name: Top priorities
      contains: The weakest areas ranked, each with the reason and a suggested action and owner.
    - name: Watch list
      contains: Knock-on risks, such as how a people problem can slow engineering and then hurt revenue.
    - name: Data gaps
      contains: Metrics you did not supply, marked as data needed and left out of the score.
