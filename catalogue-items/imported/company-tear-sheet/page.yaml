thinking: medium
thinking_why: It collects facts and lays out one page.
new_slug: company-tear-sheet
name: Company one-page tear sheet maker
summary: "Name a company. Get a one-page Word tear sheet with financials, ratios and a business summary, shaped for your reader, from free public data."
job: money-and-investing
headline: Company one-page tear sheet maker
subhead: Name a company and say who will read the sheet, such as an analyst, a banker, a deal team or a sales team. Your AI pulls free public data and builds a dense one-page Word profile. Every figure has a source and a date, and gaps say Not disclosed.
explain: |
  A tear sheet is a one-page company profile that a manager, client or deal team can read in a minute. This skill builds one as a Word file, with the numbers, ratios and a short business summary.

  The layout changes with the reader. An equity research sheet leads with valuation and consensus. An investment banking sheet leads with comparable companies and deals. A corporate development sheet looks at fit and integration. A sales sheet looks at the company's priorities and what to say in the first meeting.

  It uses free sources only, so some rows will be missing. For a US company the figures come from SEC filings. For an Indian company it uses delayed Yahoo Finance data and the company's own filings, which you can paste in. It never fills a gap from memory. The Yahoo Finance data comes from an unofficial reader that is meant for personal use, so it may break or be wrong and is not client-grade. The data is end of day or delayed, and the sheet is not investment advice.
when:
  - You need a one-page snapshot of a listed company for a meeting.
  - A client asked for numbers and a short business note on a company.
  - You are preparing the first page of a longer research pack.
  - You want a quick profile of a prospect before a sales call.
not_for:
  - You want a PowerPoint slide for a pitch book. Use the company strip profile slide maker.
  - You want a valuation or a fair price. Use the company fair value modeler.
  - You will send the sheet to a client as it is. The price data comes from yfinance, which is for personal use only. Check the figures against filings or a licensed source first, or label the sheet internal.
  - You need live prices or a document a client will trade on. Free data is end of day or delayed, so use a licensed data terminal.
  - The company is outside the US or India. Free data is thin there, so use the company's investor relations pages and paste in its annual report. Indian companies do work, from delayed Yahoo data and the annual report figures you paste in.
you_give:
  - The company name or ticker
  - The reader, such as equity research, investment banking, corporate development or sales
  - Comparable companies you want shown (optional)
  - Page length or layout (optional)
  - The company's annual report or results, for an Indian or private company (optional)
  - A free Alpha Vantage key for consensus estimates (optional)
you_get:
  - A one-page Word tear sheet for your reader
  - Key financials for three years, with growth
  - A short business summary and valuation snapshot
  - A source and date on every figure
  - Not disclosed marks wherever data was missing
how_to_use:
  - The free price and snapshot data comes from yfinance, an unofficial reader for personal use. For a sheet that goes to a client, check the figures against filings or use a licensed data source, or label the sheet internal.
  - Use an AI that can run code and reach the web, such as Claude Code. The skill builds the Word file with a command line tool called officecli, which must be installed. In a plain chat, ask for the sheet as text and paste it into Word.
  - Open the skill and name the company. Say who the reader is. If you skip this, it will ask. Consensus estimates need a free Alpha Vantage key, which allows 25 requests a day. Without one, that row says Not disclosed.
  - For an Indian or private company, paste the annual report figures. Free sources have little on them.
  - Read the Not disclosed marks first. Fill them from the company's filings if you need them.
  - Check the figures and dates against the latest results. Note that the price data is delayed.
  - Put the sheet in your pack only after you have checked it. Refresh it after each results release. To value the company, use the company fair value modeler. For a pitch slide, use the company strip profile slide maker.
  - The run order is: confirm the reader, pull the filings and price data, save each figure with its source and date, build the Word file, then check every figure against its source.
output_sample:
  input:
    - The company name or ticker
    - The reader (equity research, investment banking, corporate development or sales)
    - Comparable companies (optional)
    - Annual report figures for an Indian or private company (optional)
  prerequisites:
    - An AI that can run code and reach the web
    - The officecli tool installed, to build the Word file. If it cannot be installed, ask for the sheet as text and paste it into Word.
    - A free Alpha Vantage key, only if you want consensus estimates (optional)
  output:
    - name: Header banner
      contains: Company name, ticker, headquarters, employees, market cap, share price and as-of date. An Internal draft label stays here until the figures are checked against filings or a licensed source.
    - name: Business overview
      contains: What the company does, its segments and its position in its market.
    - name: Financial summary
      contains: Three years of revenue, margins, profit and growth in one table, with units in the header.
    - name: Valuation snapshot
      contains: Trailing and forward multiples, and comparable companies where the reader needs them.
    - name: Reader-specific section
      contains: Consensus for research, deals for banking, fit for corporate development, or conversation starters for sales.
    - name: Footer
      contains: Data sources, retrieval date, a note that yfinance data is delayed and for personal use only, and a line that it is for information only and not investment advice.
works_best_with:
  tools:
    - name: Claude Code
      why: Pulls the data, builds the Word file and checks it before you open it.
  inputs:
    - A free Alpha Vantage key, for consensus on one company at a time
    - Annual report figures, for companies outside the US
terms:
  - term: Tear sheet
    meaning: A dense one-page profile of a company.
  - term: Consensus
    meaning: The average of analyst forecasts.
  - term: Comparable companies
    meaning: Similar listed firms used to judge a company's valuation.
  - term: Lakh and crore
    meaning: Indian units. A lakh is 100,000 and a crore is 10,000,000.
