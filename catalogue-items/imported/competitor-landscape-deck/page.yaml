# Modified by AI Blocks on 2026-10-24: method/copy repair.
thinking: medium
thinking_why: It compares peers and pulls out a view.
new_slug: competitor-landscape-deck
name: Competitor landscape deck
summary: Build a competitor landscape deck for your market. Get an approved slide outline first, then a sourced, side by side comparison deck.
job: plan-strategy
headline: Competitor landscape deck
subhead: A clear competitor comparison with matched metrics, dated sources and an approved slide plan.
explain: |
  A slide deck that shows where a company sits among its rivals, with a side by side comparison and a clear takeaway. The work runs in two phases, so you agree the plan before any slides are built.

  Claude first asks what you want: one company with rivals around it, or several companies compared as equals. It confirms the exact competitor set, researches, and shows an outline for approval. It then builds the deck in PowerPoint or as a file in chat. It uses the market you name and keeps each company's own fiscal year and currency. It names gaps that have no equivalent instead of swapping in a stand-in measure. Indian conventions, such as the April to March fiscal year and lakh and crore, apply only when you pick India.
when:
  - You are presenting a company's market position to a client or board.
  - You need a side by side view of three to six rivals.
  - A deal team wants to see the competitive field before a decision.
  - You want the deck outline approved before the slides are made.
not_for:
  - "You only need one number, such as a rival's revenue: look it up in the company's filings or ask your AI a plain question."
  - "You want a written memo, not slides: ask your AI for a short memo with the same sourced comparison."
  - "You have no list of rivals and no market in mind: pick the market and the companies first, then come back."
you_give:
  - The target company
  - The competitors in scope
  - What the deck is for
  - Your PowerPoint template (optional)
you_get:
  - An approved outline
  - A competitive landscape deck
  - Side by side comparison slides
  - A closing slide on what it means
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill, or upload the skill folder if your AI takes files.
  - Name the company or the group to compare, the competitors, your market and who the deck is for.
  - Answer the scope questions, then read the outline. If your AI has no question tool, answer all the scope questions in one plain chat message. Ask for changes until you approve the outline.
  - Check that every number has a dated source and that all companies use the same period.
  - Say yes to build the deck. A PowerPoint file needs an AI that can make files, or the PowerPoint add-in. Without one, ask for the slide text as tables and paste it into your own slides.
  - Open the deck and check titles, charts and tables before you share it. Any figure or scenario odds in the skill's templates are placeholders. Each number in your deck needs its own dated source, and you set any scenario odds.
  - Before it goes out, have someone else check each sourced figure and its date. Then refresh the numbers and the dates of the sources. A short written memo that goes with the deck helps people who read it without you.
output_sample:
  input:
    - The company you want to place among rivals, or the group to compare as equals
    - The competitors in scope, or a request to suggest a set
    - Who the deck is for and how deep it should go
    - Your market or country, if it matters
    - Your PowerPoint template or competitor data file (optional)
  prerequisites:
    - An AI that can make a PowerPoint file, or a PowerPoint add-in
    - Web access or your own sources for company numbers (the deck needs them)
  output:
    - name: Scope answers
      contains: Your choices on scope, competitor set, audience and depth, and whether you need investment scenarios.
    - name: Slide outline
      contains: Proposed slide titles with one-line notes on what each slide holds, for you to approve before any slides are built.
    - name: Market context slides
      contains: Market size, growth and drivers, each with a dated source.
    - name: Target company and competitor profiles
      contains: A metrics table and a short strengths, weaknesses and strategy table for each company.
    - name: Positioning slide
      contains: A 2x2 matrix, radar chart or tier diagram that shows where each company sits.
    - name: Comparison slide
      contains: Matched metrics for every competitor in one table, with the same period and definition.
    - name: Strategic synthesis
      contains: Moat ratings, lasting strengths, weak spots, and bull, base and bear cases if you asked for them.
