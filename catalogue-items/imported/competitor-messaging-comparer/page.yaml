thinking: medium
thinking_why: It gathers public pages and compares them.
new_slug: competitor-messaging-comparer
name: Competitor messaging comparer
summary: Compare how your rivals pitch themselves and find the messages nobody owns. Get a competitor messaging comparison with content gaps from public pages.
job: study-competitors
headline: Competitor messaging comparer
subhead: A side by side look at how your rivals describe themselves, what content they publish and where they have gone quiet. You can see which claims are crowded and which message nobody owns.
explain: |
  A side by side look at how your rivals describe themselves, what content they publish and where they have gone quiet. You can see which claims are crowded and which message nobody owns.

  You name the competitors and, if you wish, say what you sell and what makes you different. Claude reads their home pages, product and pricing pages, blogs, social profiles, recent news and review themes. It can add job postings as a hint of direction. It compares positioning, messaging, content mix, recent launches and pricing where public. The brief ends with gaps you can use. It reads only public web pages and needs web search to run. Paid SEO, social listening or alert tools are optional extras. Before it reads any page, it checks the site's terms and does not log in or get past a paywall. This is Anthropic's competitive-brief skill with a plainer name, used under the Apache 2.0 licence.
when:
  - You are rewriting your homepage and want to stand out from rivals.
  - A competitor just launched and you need to know how they pitch it.
  - Your content team wants topics rivals have missed.
  - You need a competitive brief before a planning meeting.
not_for:
  - "You need one quick fact about a rival, such as a price: search their site or ask a person on your sales team."
  - "You need a one-page sales sheet to use on calls: ask your AI for a battlecard after the brief is done."
  - "You need private data, such as rival traffic or revenue: use a paid research tool, because this reads public pages only."
you_give:
  - One or more competitor names
  - What you sell and to whom (optional)
  - Your key differences (optional)
  - Focus areas, such as messaging or pricing (optional)
you_get:
  - A positioning comparison
  - A messaging and content review
  - Recent news and launches
  - A list of gaps to use
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick a chat that can search the web, as the skill needs it to read rival pages.
  - Paste the skill text into the chat. Check each rival site's terms first. Do not give the AI logins and do not ask it to get past a paywall.
  - Type the names of your competitors. Add what you sell and how you differ if you like (optional).
  - Say which areas matter most, such as messaging or pricing (optional). If you skip this, it covers all areas.
  - Check the sources for any claim you plan to act on. Treat figures without a source as unconfirmed.
  - Reply with one of the follow-up offers at the end, such as a battlecard or new messaging.
output_sample:
  input:
    - The names of one or more competitors
    - What you sell and to whom (optional)
    - Your key differences (optional)
    - Focus areas, such as messaging or pricing (optional)
  prerequisites:
    - An AI that can search the web
  output:
    - name: Executive Summary
      contains: A short view of the competitive landscape, with your biggest opportunity and your biggest threat.
    - name: Competitor Profiles
      contains: "For each rival: overview, messaging, product positioning, content strategy, strengths and weaknesses."
    - name: Messaging Comparison Matrix
      contains: A table comparing tagline, target buyer, differentiator, tone and core promise across you and your rivals.
    - name: Content Gap Analysis
      contains: Topics, formats and keywords your rivals cover that you do not, and the reverse.
    - name: Opportunities
      contains: Positioning gaps, unclaimed message angles and audiences your rivals underserve.
    - name: Threats
      contains: Where rivals are strong, trends that favor them and recent moves that could shift the market.
    - name: Recommended Actions
      contains: Three to five steps, split into quick wins and longer-term moves.
