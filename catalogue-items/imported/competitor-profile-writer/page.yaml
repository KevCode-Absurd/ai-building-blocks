thinking: high
thinking_why: It must read each site and judge how rivals position themselves.
new_slug: competitor-profile-writer
name: Competitor profile writer
summary: Give it competitor links and your product. Get a competitor profile for each rival with positioning, pricing, features and sources for every claim.
job: study-competitors
headline: Competitor profile writer
subhead: A structured profile for each competitor, built from their own site and public data, with facts kept separate from opinion. Every claim traces back to a source page, a review or an SEO figure.
explain: |
  This skill text is copied unchanged from its MIT-licensed source. Only the name is ours.

  Use it to learn how your rivals sell, what they charge and what their customers say, without reading every site yourself. Each profile keeps three things apart: what the page says, what the AI reads into it, and what it means for you.

  You give Claude a list of competitor links, your product, and how deep to go: a quick scan or a full profile. It crawls each site for positioning, pricing, features and content. If an SEO data tool is connected, such as DataForSEO, Ahrefs or Semrush, it adds search and traffic numbers. If not, it falls back to plain page fetching. It keeps what was observed, what was reported and what was inferred visibly apart, and it reads your product notes first if you have them.
when:
  - You have ten competitor links and no time to read each site.
  - A new rival appears and you need a profile today.
  - You are starting a positioning project and need the field mapped.
  - You want pricing and positioning side by side for every rival.
not_for:
  - "You want comparison or alternative pages for your own site: use a page-writing skill after the profiles are done, not this one."
  - "You need a sales battle card for your team: build one from the finished profiles with a sales enablement skill."
  - "You want to research companies you plan to sell to: use a prospecting skill, since this one studies rivals."
you_give:
  - Competitor website links
  - Your product description
  - "Depth: quick or deep"
  - Focus areas (optional)
you_get:
  - A profile for each competitor
  - Positioning and pricing notes
  - Search and traffic data when available
  - Sources for every claim
how_to_use:
  - First, check each competitor site's terms and its robots.txt file (add /robots.txt to the web address). Do this before any tool reads the site. Check the terms of G2, Capterra and any other review site before pulling reviews. Skip a site that forbids automated reading and paste the text in by hand.
  - Open Claude, ChatGPT or Gemini in a chat that can browse the web, and paste in the skill.
  - Only Claude with connected tools (MCP access) can run the Firecrawl and DataForSEO steps. ChatGPT and Gemini cannot, unless you connect the same tools. Without them, the skill reads the pages your AI can open and marks search and traffic numbers as unavailable.
  - "No keys? The paste-in route works with no keys and gives page-fetch data only. The steps: 1) paste the skill, 2) paste your competitor links and your product line, 3) pick quick or deep, 4) let your AI read each page it can open, 5) check every claim marked inferred against its source page."
  - Paste your competitor links, one per line, and one line on what your product does.
  - "Say how deep to go: quick scan for key facts, or deep profile for full research."
  - Say if you have a Firecrawl key or an SEO tool connected. DataForSEO, Ahrefs and Semrush are paid, and Firecrawl needs its own key. Without them it reads pages directly.
  - Read each profile. Check pricing and any claim marked as inferred against the source page before you use it.
  - Next, turn the finished profiles into a sales battle card with Competitor battle card builder, or into comparison pages for your own site with a page-writing skill.
output_sample:
  input:
    - Links to the competitor websites
    - A short description of your product (optional if your product notes exist)
    - "Depth: quick scan or deep profile"
    - Focus areas such as pricing or positioning (optional)
  prerequisites:
    - An AI that can fetch web pages
    - A Firecrawl key and an SEO data tool such as DataForSEO, Ahrefs or Semrush (optional, paid, for richer data)
  output:
    - name: At a Glance
      contains: The key facts about the competitor in one short block, with anything not found marked unknown.
    - name: Positioning & Messaging
      contains: How the competitor describes itself, who it targets and the claims it leads with.
    - name: Product & Features
      contains: Core capabilities, standout differences, integrations and signs of where the product is heading.
    - name: Pricing
      contains: Plans and prices as shown on the pricing page, with notes on what is hidden or unclear.
    - name: Customers & Social Proof
      contains: Named customers, reviews and proof the competitor shows.
    - name: SEO & Content Strategy
      contains: Search and traffic data when a tool is connected, plus what content the site publishes.
    - name: Strengths & Weaknesses
      contains: Where the competitor is strong and weak, kept apart from the plain facts.
    - name: Competitive Implications for Your Product
      contains: What each finding means for you, with a source for each claim.
