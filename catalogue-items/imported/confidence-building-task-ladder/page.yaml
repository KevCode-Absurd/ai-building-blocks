thinking: medium
thinking_why: Each step must be hard enough to matter and easy enough to win.
new_slug: confidence-building-task-ladder
name: Confidence-building task ladder
summary: Give it a skill students avoid. Get a ladder of small wins that builds
  confidence. Not medical advice.
job: teach-and-train
headline: Confidence-building task ladder
subhead: A ladder of small, achievable tasks that rebuilds a student's belief
  that they can do a skill they avoid. Each step is a real win, not a pep talk.
explain: |
  A ladder of small, achievable tasks that rebuilds a student's belief that they can do a skill they avoid. Each step is a real win, not a pep talk.

  You describe the skill, the year group and what the student does instead, such as writing one sentence then stopping. Claude builds the ladder from the four things that shape this belief: doing the task successfully, seeing a similar peer succeed, hearing credible encouragement and handling the feeling of stress. It avoids empty praise, slogans and reward charts. Tasks start just inside what the student can already do and rise in small steps. This is classroom support, not medical or mental health advice.
when:
  - A student says they can't write, do maths or speak up and stops trying.
  - You want an alternative to telling them to try harder.
  - A learner avoids a skill by asking for help straight away.
  - You need a gentle plan for a few weeks.
you_give:
  - The skill the student avoids
  - Year group
  - What the student does instead
  - Their strengths and past attempts (optional)
you_get:
  - A step-by-step ladder of tasks
  - Wording for feedback that builds belief
  - Ways to show peer success
  - Signs to watch for progress
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
