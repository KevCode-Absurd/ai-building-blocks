thinking: medium
thinking_why: It plans a structure, then sets it up.
new_slug: confluence-space-builder
name: Confluence space builder
summary: Say what your team needs. Get a Confluence space set up with page
  templates, permissions and a clear layout.
job: organise-work
headline: Confluence space builder
subhead: A well organised Confluence space for your team, with page templates,
  access rules and a layout people can find their way around. It takes a blank
  space and gives it structure.
explain: |
  A well organised Confluence space for your team, with page templates, access rules and a layout people can find their way around. It takes a blank space and gives it structure.

  You say what your team needs, such as meeting notes, project pages or a knowledge base. Claude plans the page tree, writes templates, and sets permissions by group. If the Atlassian connector is on, it can create and update pages, search with CQL and read comments, using the correct page format. Creating the space itself is not possible through the connector, so you make that in Confluence first or use its web interface. It needs a Confluence account.
when:
  - Your team's documents are scattered and nobody can find anything.
  - You are starting a new project and need a ready-to-use space.
  - You want standard meeting notes and decision templates.
  - You need to control who can see and edit which pages.
you_give:
  - What your team documents
  - Team and group names
  - Confluence access via the Atlassian connector
  - Existing pages to reorganise (optional)
you_get:
  - A page tree plan
  - Page templates
  - Permission suggestions
  - Pages created or updated in Confluence
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can connect to Confluence.
