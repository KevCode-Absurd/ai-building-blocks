thinking: medium
thinking_why: It plans a structure, then sets it up.
new_slug: confluence-space-builder
name: Confluence space builder
summary: Plan and set up a Confluence space for your team. Get a page tree, templates and permission advice, with pages created in Confluence if connected.
job: organise-work
headline: Confluence space builder
subhead: A well organised Confluence space for your team, with page templates, access rules and a layout people can find their way around. It takes a blank space and gives it structure.
explain: |
  A well organised Confluence space for your team, with page templates, access rules and a layout people can find their way around. It takes a blank space and gives it structure.

  You say what your team needs, such as meeting notes, project pages or a knowledge base. Claude plans the page tree, writes templates, and sets permissions by group. If the Atlassian connector is on, it can create and update pages, search with CQL and read comments, using the correct page format. Creating the space itself is not possible through the connector, so you make that in Confluence first or use its web interface. It needs a Confluence account.
when:
  - Your team's documents are scattered and nobody can find anything.
  - You are starting a new project and need a ready-to-use space.
  - You want standard meeting notes and decision templates.
  - You need to control who can see and edit which pages.
not_for:
  - "You only need one shared document: use a plain Confluence page instead."
  - "Your space already works well: keep it and fix single pages by hand."
  - "You want the space itself created for you: make it in Confluence first, because the connector cannot do that."
you_give:
  - What your team documents
  - Team and group names
  - Confluence access via the Atlassian connector
  - Existing pages to reorganise (optional)
you_get:
  - A page tree plan
  - Page templates
  - Permission suggestions
  - Pages created or updated in Confluence
how_to_use:
  - Make an empty space in Confluence first. Your AI cannot create the space itself.
  - Paste the skill into your AI chat. Turn on the Atlassian connector if you want pages created for you.
  - The two Python scripts in the skill folder (space_structure_generator.py and content_audit_analyzer.py) are optional and need Python 3 on your computer. The first reads a JSON file with name, size, type (engineering, product, marketing or project) and projects. The second reads a JSON list of pages with title, last_modified, view_count, author, labels and word_count. Without Python, your AI plans the tree and reviews the page list by hand.
  - Describe what your team documents. Add your team and group names, and any pages you want to reorganise (optional).
  - Read the page tree plan your AI shows you. Ask for changes, then say yes before it creates any page.
  - Set the permissions in your space settings in Confluence. Your AI cannot do this step.
  - Open the space and check the homepage loads. Create a test page from each template.
  - Next, ask for a content health audit of the space. It lists the pages to archive or update, so fix the oldest and most visited first.
output_sample:
  input:
    - What your team writes down, such as meeting notes or project pages
    - Your team and group names
    - A short brief on how your team works
    - Your existing pages to reorganise (optional)
  prerequisites:
    - A Confluence account and an empty space you made in Confluence
    - The Atlassian connector turned on in your AI, to create pages (optional)
  output:
    - name: Page tree plan
      contains: A layout of parent and child pages, no more than three levels deep, for you to approve first.
    - name: Page templates
      contains: Ready-to-use pages for meeting notes, project overviews, decision logs and retrospectives, with placeholders.
    - name: Permission suggestions
      contains: Who should view, edit, create and administer, based on your space type. You set these in Confluence.
    - name: Created or updated pages
      contains: The pages added to your space through the connector, once you approve the plan.
    - name: Content health notes
      contains: Stale, orphaned and low-use pages to archive or update, if you share a page list.
