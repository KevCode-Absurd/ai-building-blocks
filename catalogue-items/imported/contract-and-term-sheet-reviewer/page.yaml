thinking: high
thinking_why: Legal terms need careful reading. It is not legal advice.
new_slug: contract-and-term-sheet-reviewer
name: Contract and term sheet reviewer
summary: Check a contract or term sheet before you sign. Get risky clauses flagged, explained in plain words, with a clear line on when to call a lawyer.
job: check-contracts
headline: Contract and term sheet reviewer
subhead: Paste a contract or term sheet. Get the risky terms flagged, plain-English meaning and when to call a lawyer. Bring the contract or term sheet text.
explain: |
  A read of your contract or investment term sheet with risky terms flagged, each explained in plain English, and a clear signal for when you should pay a lawyer. You know what you are agreeing to before you sign.

  It first asks a few questions about your company and the deal. Then it reviews the document clause by clause for service agreements, software terms, NDAs, data agreements and hiring contracts. For term sheets it decodes items like valuation, liquidation preference and board control. It also checks who owns your intellectual property and whether rules such as health privacy or GDPR apply. It is general guidance, not legal advice.
when:
  - An investor sent a term sheet and you do not know what it means.
  - A customer's contract landed in your inbox and you need to know what's risky.
  - You are unsure whether your IP assignments are in order.
  - You need to decide if a deal is worth an outside lawyer's fee.
not_for:
  - "You already signed and have a dispute or a court case: go straight to a licensed lawyer."
  - "You need advice you can rely on to sign a binding deal: use this to prepare questions, then hire a lawyer."
  - "You need exact legal limits for your country or deal size: ask a local lawyer, since the usual figures here are only starting points."
you_give:
  - The contract or term sheet text
  - Your company stage and business
  - Which side you are on
  - Your country and industry (optional)
you_get:
  - Flagged risky terms with plain meaning
  - Suggested changes
  - Term sheet breakdown
  - When to call a lawyer
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste your contract or term sheet as plain text. Add your company stage, your side of the deal, and your country (optional).
  - Ask your AI to review it. It needs no code for a normal review.
  - Read the Bottom Line and The Risks first. Pick the worst three clauses to push back on.
  - Bring the counter-proposals and lawyer action items to a licensed lawyer before you sign. For a term sheet, have the lawyer read the whole document before you negotiate, not only the flagged clauses.
  - Expect five short sections, under 800 words in all. For a term sheet, a sixth section with the score is added only if the script was run.
  - "Optional: the 0 to 100 term sheet score and the clause scanner come from two Python scripts. Workflows 1 and 2 in the skill need them, so they need an AI that can run code, or Python 3 on your own computer. The score comes from simple pattern checks. It is a rough guide, not a legal judgement, and never a reason to sign or not sign. For the term sheet script, the skill lists the fields your AI puts in the input file."
  - What it does not check - whether a clause can be enforced in your country or state, how a signed version differs from the draft, and the full story of the negotiation. A lawyer covers those.
output_sample:
  input:
    - Your contract or term sheet, pasted as plain text
    - Your company stage and what your business does
    - Which side of the deal you are on
    - Your country and industry (optional)
  prerequisites:
    - "Optional: an AI that can run Python 3 code, only if you want to use the two bundled scripts"
  output:
    - name: Bottom Line
      contains: "One call on the deal: sign, negotiate, or do not sign."
    - name: The Risks
      contains: The three most serious problems in the document, each explained in plain words.
    - name: Counter-Proposals
      contains: Specific wording you can send back to ask for fairer terms.
    - name: Outside Counsel Action Items
      contains: The questions and points to bring to a lawyer.
    - name: Your Decision
      contains: The choice only you can make as the founder.
    - name: Founder-friendliness score
      contains: For term sheets, a score from 0 to 100 with flags on each clause (needs the script).
