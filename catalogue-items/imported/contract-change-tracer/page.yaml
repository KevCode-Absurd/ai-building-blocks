thinking: medium
thinking_why: It has to line up several versions and trace each clause.
new_slug: contract-change-tracer
name: Contract change tracer
summary: Trace how a contract changed across its amendments. See each change in date order and the latest wording of any clause. Not legal advice.
job: check-contracts
headline: Contract change tracer
subhead: Give it a contract and its amendments. Get what changed and each clause's latest wording. Not legal advice. Bring the base contract. Use the result to plan your next step.
explain: |
  A clear record of how a contract changed over time: what each amendment did, and the wording that rules today for any clause you ask about. You stop flipping between five PDFs to learn what the deal now says.

  You give it the base agreement and every amendment. It puts them in date order and reads each one. In summary mode it lists changes amendment by amendment with section numbers, then states the net current position and items to watch. In trace mode you name a clause and it shows the original text, each change to it, and the controlling language now. Every point cites a section. It is a first pass, not legal advice. This is Anthropic's amendment-history skill from claude-for-legal (github.com/anthropics/claude-for-legal), used under the Apache 2.0 licence. For this catalogue we removed the plugin-only parts, such as slash commands, folders and links to other skills, so it runs in a plain chat.
when:
  - A vendor deal has three amendments and nobody knows which terms apply.
  - You are taking over a client account and need to know its current contract.
  - Someone claims a clause was changed and you need to check.
  - You are preparing for a renewal and need the live wording.
not_for:
  - "You want new amendments drafted: ask a lawyer, because this tool only reads what exists."
  - "You want the current contract checked against your own rules: ask a lawyer or use a contract review step, since this tool only looks at history."
  - "Two amendments conflict and you need to know which one wins: take it to a lawyer, because this tool flags the conflict but does not decide it."
you_give:
  - The base contract
  - All amendments and side letters
  - Clause to trace (optional)
  - Which side you are on (optional)
you_get:
  - Changes in date order
  - Net current state of the deal
  - Clause history with section cites
  - Watch items
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill instructions.
  - Make sure every amendment, addendum and side letter is included. A missing document makes the net current state wrong.
  - Upload the base contract and every amendment. You can also paste the text. No code, web access or paid tool is needed.
  - Name a clause to trace, such as indemnity. Skip this to get a summary of all changes.
  - Check the order of the documents the AI used. Fix it if it guessed wrong.
  - Check each quote and section number against your files before you rely on it.
  - Copy the watch items into a short note for your lawyer, with the section number of each one.
  - Next, check the current contract against your own rules with Contract risk reviewer.
output_sample:
  input:
    - Your base contract
    - Every amendment, addendum and side letter
    - A clause to trace, such as indemnity or termination (optional)
  prerequisites:
    - Files you can upload or paste as text, such as PDFs
  output:
    - name: Header
      contains: The other party, the agreement type, the base date, the number of amendments and the date of the last change.
    - name: What changed, in date order
      contains: For each amendment, its purpose and each material change with section numbers, in plain words.
    - name: Net current state
      contains: A table of each clause, where it stands now, its section and when it last changed.
    - name: Provision trace
      contains: "For one named clause: the original quote, each change as was and now, and what changed in practice."
    - name: Current controlling language
      contains: The exact latest wording of the clause, with its section and source document, plus a plain summary.
    - name: Watch items
      contains: Conflicts, shifted section numbers or odd party changes found between documents, each with a section reference.
