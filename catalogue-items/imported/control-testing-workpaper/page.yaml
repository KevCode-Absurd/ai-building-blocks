thinking: high
thinking_why: Audit work follows strict rules.
new_slug: control-testing-workpaper
name: Control testing workpaper builder
summary: "Build a SOX control testing workpaper: get a sample size, selected items, test steps and a rating for any gap. Review it before audit use."
job: track-numbers
headline: Control testing workpaper builder
subhead: A test sample, a filled workpaper and a rating for any gap, ready for a control test in your SOX program. It saves the hours spent working out sample sizes and formatting evidence.
explain: |
  A test sample, a filled workpaper and a rating for any gap, ready for a control test in your SOX program. It saves the hours spent working out sample sizes and formatting evidence.

  You name a control area such as revenue, purchasing to payment, IT general controls or month-end close. The skill sets the sample size from the control's frequency and risk, then selects items with a method you can defend. It builds a workpaper with the control, steps, evidence and conclusion. If something fails, it classifies the deficiency as a control deficiency, significant deficiency or material weakness, and writes the assessment. It supports your judgment and is not audit advice.
when:
  - Quarterly testing is coming and you need a sample for a control.
  - You need a workpaper template for a new control.
  - A test found an exception and you must rate how serious it is.
  - You are new to SOX 404 and want a worked starting point.
not_for:
  - "You need work an external auditor can rely on: have a qualified auditor review it, or use your auditor's own testing program."
  - "You have no population list yet: ask your finance team for the full list of items first, because this skill will not make up items."
  - "You want a control matrix written for your company: ask your finance team for the SOX 404 controls matrix, then bring one control here."
you_give:
  - The control and its area
  - How often it runs
  - The population list
  - Risk level (optional)
you_get:
  - Sample size and selected items
  - Testing workpaper
  - Deficiency classification
  - Control assessment write up
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Say which control area you want to test and the period, such as a quarter or a year.
  - Paste or upload your real population list. If you have none, get it from your finance team first.
  - Add how often the control runs and its risk level, if you know them. Have your SOX 404 controls matrix to hand, and make sure the population has a date, reference, amount and owner for each item.
  - Your AI uses only the items you give it and flags gaps. If it cannot pick a truly random sample, it should use a fixed interval and say so.
  - Check the sample, the test steps and the rating against your own control documents.
  - Have a qualified finance or audit professional review the workpaper, and confirm any deficiency rating, before it goes in any audit file.
  - Next, give the signed workpaper to your internal audit team or your external auditor, and log any deficiency in your remediation tracker.
output_sample:
  input:
    - The control area to test, such as revenue, purchase to pay, payroll or IT general controls
    - The testing period, such as a quarter or a year
    - The real population list for the control, as a file or pasted rows
    - How often the control runs and its risk level (optional)
  prerequisites:
    - The real list of items the control covered in the period, because the skill should not invent items
  output:
    - name: Control matrix
      contains: The key controls for the area, with type, frequency, key or non-key, risk and the assertion each one covers.
    - name: Sample size
      contains: How many items to test, based on how often the control runs, its risk and any past issues.
    - name: Sample selection
      contains: The items picked from your list, the selection method used and the reason for any targeted picks.
    - name: Testing workpaper
      contains: Control details, test objective, test steps, expected evidence, a results table, exceptions and sign-off lines.
    - name: Common test steps
      contains: Ready-made test steps for the control area, such as approvals, three-way match or access reviews.
    - name: Deficiency evaluation
      contains: A rating of each gap as a deficiency, significant deficiency or material weakness, with the reasoning.
    - name: Remediation suggestions
      contains: Suggested fixes for any gaps found in testing.
