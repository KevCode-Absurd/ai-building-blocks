new_slug: conversion-page-style-guide
name: Conversion page style guide writer
summary: Describe the action you want. Get a style guide for a page that removes
  friction and builds trust.
job: design-work
headline: Conversion page style guide writer
subhead: A style guide for pages that push people toward one action by cutting
  friction and building trust. Designers and developers can follow it without
  guessing, and your pages end up consistent.
explain: |
  A style guide for pages that push people toward one action by cutting friction and building trust. Designers and developers can follow it without guessing, and your pages end up consistent.

  You describe the action you want, such as buying or booking. The skill writes the mission, brand notes, style foundations, accessibility rules and writing tone. Then it lists do and don't rules, component by component, and quality gates a page must pass before launch. It also gives sample rule wording so the guide stays checkable, for example how many clicks a task may take. The result is a document your team can reuse across pages.
when:
  - Each page on your site looks and reads differently.
  - You are hiring a designer and need to explain what you expect.
  - Visitors drop out at forms and you suspect friction.
  - You want accessibility and trust rules written down once.
you_give:
  - The action you want visitors to take
  - Your brand voice and colours
  - Your audience
  - Existing pages for reference (optional)
you_get:
  - Style guide document
  - Do and don't rules
  - Component rules
  - Accessibility and tone rules
  - Launch checklist
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
