thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-acreadiness-assess
name: Agent readiness dashboard builder
summary: Run an agent readiness check on your repo and get a dashboard of what stops coding agents from working well, with a fix plan.
job: set-up-ai
headline: Agent readiness dashboard builder
subhead: Give your AI access to your code repo. It runs the AgentRC readiness scan and builds one web page from the results. The page shows your score, each weak spot and a fix plan.
explain: |
  Source: an MIT-licensed copy of the acreadiness-assess skill from github/awesome-copilot (commit 613efc8). We only gave it a plain name.
not_for:
  - "You cannot run Node 20 or newer, or cannot share the repo with an outside tool: ask a developer to run the scan, or skip it."
  - "You want a quick, plain report with no custom look: run the built-in agentrc readiness command with its visual option instead."
  - "You want to write the agent instruction files themselves: use the acreadiness-generate-instructions skill after this check."
how_to_use:
  - Before you start, check your company's rules with IT. The scan reads your repo files, and a cloud AI tool may send them off your machine. You can run it on a copy of the repo with the secrets taken out.
  - Use an AI that can run code and edit files in your repo, such as Claude Code or GitHub Copilot. A plain chat window will not work.
  - Check that Node 20 or newer is installed. Your AI can run node --version to confirm. The scan downloads AgentRC from GitHub with npx, so it needs web access. Pick a release tag or commit from github.com/microsoft/agentrc before you start. If unsure, use the newest tag on github.com/microsoft/agentrc/releases that is not marked pre-release. Do not run the scan without a pin. If you cannot choose one, stop and ask a developer. The scan downloads and runs code from GitHub, and a pin makes sure you know which version runs. The scan does not skip .env files, keys or other secrets, so remove them from the repo copy or skip this scan. The scan reads your repo files and passes them, and the scanner output, to your AI tool. Check that this is allowed before you run it on private code.
  - Install the skill using your AI tool's steps for adding skills. The ai-readiness-reporter agent is optional. If you do not have it, your AI builds the page from report-template.html itself.
  - Ask your AI to run the acreadiness-assess skill. Add your policy file if you have one.
  - Open reports/index.html in your browser and read the fix-first list.
  - Next, run the acreadiness-generate-instructions skill to fix the top gaps.
output_sample:
  input:
    - Your code repository, open in your AI tool
    - A policy file or package (optional)
    - The per-area option, if you want scores for each part of the repo (optional)
  prerequisites:
    - An AI that can run code and read and write files in your repo
    - Node 20 or newer installed
    - Web access, so the scan can fetch the AgentRC tool
    - "The ai-readiness-reporter custom agent (optional: if it is missing, your AI builds the page from report-template.html)"
  output:
    - name: reports/index.html
      contains: One static dashboard file that opens in a browser, with all styling built in.
    - name: Maturity level and score
      contains: Your overall score, grade and maturity level, and the pass rate against the threshold.
    - name: Pillar breakdown
      contains: Nine pillars, each with what it measures, why it matters for AI, its current state and a fix.
    - name: Extras
      contains: Bonus checks shown on their own. They never change your score.
    - name: Active policy
      contains: Any policy in use, with criteria that were turned off or changed, and the thresholds.
    - name: Prioritised remediation plan
      contains: Fixes sorted into Fix First, Fix Next and Plan.
    - name: Chat summary
      contains: Your maturity level, score, three lowest pillars and the best next step.
when:
  - You want to know how ready your repo is for coding agents.
  - You are about to add AI coding tools to a team project.
  - Your company has its own rules and you want to score against them.
  - You want a before and after check once you have fixed things.
you_give:
  - Your code repository, open in your AI tool
  - A policy file or package for your own scoring rules (optional)
  - A request for scores by area of the repo (optional)
you_get:
  - A dashboard file at reports/index.html that opens in any browser
  - Your score, grade and maturity level
  - A look at nine areas, with what to fix in each
  - A fix list sorted by what to do first
  - A short summary in chat
