thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-aws-cost-optimize
name: AWS resource cost reviewer
summary: Find where your AWS setup wastes money. Get an AWS cost optimization review with fixes, saved as GitHub issues you can track.
job: ship-and-host
headline: AWS resource cost reviewer
subhead: "Point it at your AWS account and your infrastructure files. It checks what is running, how much it is used and what it costs, then lists the savings. After you say yes, it opens one GitHub issue per saving and one tracking issue."
explain: |
  Cost problems hide in idle servers, oversized databases and storage nobody cleans up. This AWS cost review reads your infrastructure files and the resources running in your account. It checks the last 7 days of usage before it suggests a change.

  Each saving gets a priority score from its value, risk and effort, so you start with the easy wins. It shows a summary first and waits for your yes before it creates anything in GitHub.

  If it cannot fetch usage or billing data, treat the savings as estimates and check them.
when:
  - "Your AWS bill went up and you do not know why."
  - "You want a list of savings your team can track in GitHub."
  - "You are about to scale an app and want to trim waste first."
  - "You use Terraform, CloudFormation or CDK and want each saving tied to those files."
not_for:
  - "Your AWS account has no running resources, or you only have read access to nothing: there is nothing to review, so wait until something is deployed."
  - "You want a quick one-off look at your bill: use the AWS Cost Explorer page in your AWS console instead."
  - "You have no AWS command line set up or no GitHub link: ask a developer to set these up first, or use the console to review costs by hand."
you_give:
  - "Your infrastructure files, such as Terraform, CloudFormation or CDK (the skill stops without them)"
  - "Read access to your AWS account through the AWS command line"
  - "The GitHub repository that should get the issues"
  - "Your yes or no after the summary, before any issue is created"
you_get:
  - "A cost summary: resources reviewed, current monthly cost and possible monthly savings"
  - "One GitHub issue per saving, with the saving, risk, effort, usage evidence and steps to check"
  - "One tracking issue with a diagram of your resources, a ranked checklist and success goals"
how_to_use:
  - Use an AI that can run code and read your files, such as Claude Code. A plain chat window cannot run AWS commands.
  - Set up the AWS command line and sign in. Check it works by running aws sts get-caller-identity.
  - Connect your AI to GitHub, and tell it which repository should get the issues.
  - Put your Terraform, CloudFormation or CDK files where your AI can read them. The skill stops if it finds none.
  - Ask your AI to follow this skill. Read the cost summary it shows you, then say yes to post the issues.
  - Check the savings numbers. If usage or billing data could not be fetched, treat the savings as unverified estimates. Cost Explorer may charge a small fee per request.
output_sample:
  input:
    - Your AWS account, signed in through the AWS command line
    - Your GitHub repository to post the issues to
    - Your infrastructure files, such as Terraform or CloudFormation (needed, the skill stops without them)
  prerequisites:
    - An AI that can run code and read your files
    - AWS command line set up and signed in
    - A GitHub connection (MCP server) that can create issues
    - Cost Explorer turned on in your AWS account
  output:
    - name: Cost summary
      contains: Resources reviewed, current monthly cost, possible savings, and the top items, shown to you before anything is posted.
    - name: Individual optimization issues
      contains: One GitHub issue per fix, with savings, risk, effort, evidence from usage data, commands, and checks to run.
    - name: EPIC issue
      contains: One master issue with an overview, a diagram of your resources, a ranked checklist linking each fix, and success goals.
