thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-azure-pricing
name: Azure price estimate researcher
summary: Get current Azure pricing for the services you name. You get retail prices and a monthly estimate with its assumptions shown.
job: ship-and-host
headline: Azure price estimate researcher
subhead: Name the Azure services you need, the region and how much you will use them. Your AI looks up current retail prices and works out a monthly and yearly cost. It shows the assumptions so you can check them.
not_for:
  - "You need a binding quote or an invoice: use the Azure Pricing Calculator or your Azure billing account."
  - "You want prices for AWS, Google Cloud or another non-Azure cloud: check that provider's own price page."
  - "You need to see what you already spend on Azure: open Cost Management in your Azure account."
how_to_use:
  - Use an AI that can browse the web or call web addresses. Without that it cannot get live prices.
  - Paste the skill into a chat, or add it to your AI tool as a skill.
  - List the services, region, size and monthly usage. If you are unsure of a size, say so and your AI will ask.
  - Check the price table and the assumptions. Fix any wrong region or usage number and ask for a new estimate.
  - If the live price lookup fails, your AI may fall back on a saved snapshot of Copilot Studio rates from the import date. It should say so. Confirm those rates on Microsoft's billing page before you budget.
  - For a binding quote, copy the lines into the Azure Pricing Calculator.
  - Next, share the assumptions list with whoever owns the budget before spend is approved, and ask for a new estimate when your usage numbers change.
output_sample:
  input:
    - The Azure services you need, such as virtual machines or storage
    - Your region, such as East US
    - The size or SKU, if you know it (optional)
    - How much you will use each month, such as hours or gigabytes
    - "Copilot Studio only: agent type, users, and chats per month (optional)"
  prerequisites:
    - An AI that can open web pages, such as prices.azure.com
    - No Azure account or login is needed
  output:
    - name: Price table
      contains: Each service, SKU and region with its unit price, price type and unit of measure.
    - name: Monthly and yearly estimate
      contains: Unit price times your usage, shown for each line and as a total.
    - name: Price type comparison
      contains: Pay-as-you-go next to reservation, savings plan or spot prices, where they exist.
    - name: Copilot Studio credit estimate
      contains: Credits by feature, total credits and the cost in USD, when you ask about Copilot Studio.
    - name: Assumptions
      contains: The filters used, the region, the currency and the usage figures behind the estimate.
when:
  - Your boss asks what a virtual machine would cost to run in East US.
  - You want to compare two sizes or two regions before you choose.
  - You need a rough monthly budget for a new app before you build it.
  - You are planning a Copilot Studio agent and want to estimate its monthly credits.
you_give:
  - The Azure services you want priced
  - The region for each one, such as East US or West Europe
  - The size or SKU, if you know it (optional)
  - Your expected usage per month, such as hours, gigabytes or number of chats
  - Your currency, if not US dollars (optional)
you_get:
  - A table of current retail prices for each service
  - A monthly and yearly estimate for your usage
  - A comparison of pay-as-you-go with reserved, savings plan and spot prices where they exist
  - A list of the assumptions behind the numbers
