thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-azure-resource-health-diagnose
name: Azure service health investigator
summary: Find out why an Azure resource is unhealthy. Give it the resource name and symptoms. You get log findings and a fix plan by priority.
job: ship-and-host
headline: Azure service health investigator
subhead: Give your AI the name of an Azure resource and what is going wrong. It checks the resource's health and reads its logs. You get a ranked list of problems and a plan to fix them.
not_for:
  - "Your app runs on AWS, Google Cloud or another host: use that provider's own monitoring and health pages."
  - "Your resource is not deployed yet: there are no logs to read, so check your deployment template or ask a cloud engineer."
  - "You want your AI to fix things on its own: this skill gives commands to review, and you run them yourself."
how_to_use:
  - Before you start, connect the Azure MCP server to your AI and sign in to Azure. You need read access to the resource and its logs.
  - Use an AI tool that can run tools, such as Claude with MCP. A plain chat window cannot read your Azure logs.
  - "Paste the skill into the chat. Then give the resource name and your symptoms, for example: App Service returns 500 errors since Tuesday."
  - If several resources share the name, tell your AI which subscription or resource group to use.
  - Read the health summary and the ranked issues. Answer yes if you want the full report.
  - Check each command before you run it. The fix commands change live resources, so test them first and keep the undo step ready.
output_sample:
  input:
    - The name of your Azure resource
    - Its resource group or subscription (optional)
    - A short note on the symptoms, such as errors or slow pages
  prerequisites:
    - An AI that can use the Azure MCP server (a tool link to Azure)
    - A signed-in Azure account with read access to the resource and its logs
    - A resource that is already deployed and running
  output:
    - name: Health assessment summary
      contains: A short on-screen recap of resource status, issue counts by severity, top issues and the plan size, ending with a yes or no question.
    - name: Executive summary
      contains: A brief overview of the resource's health and the key findings.
    - name: Health metrics
      contains: Availability, performance, error rate and resource use over the last day.
    - name: Issues identified
      contains: Each problem ranked critical, high, medium or low, with root cause, impact and the action to take.
    - name: Remediation plan
      contains: "Fix steps in three phases with Azure CLI commands: immediate, short-term and long-term."
    - name: Monitoring recommendations
      contains: Alerts to set up, dashboards to build and how often to run health checks.
    - name: Validation steps
      contains: A checklist to confirm the fix worked in logs, speed and app behaviour.
    - name: Prevention measures
      contains: Ideas to stop the same problem coming back.
when:
  - Your App Service has returned errors since a certain day and you do not know why.
  - A database or storage account feels slow and you need evidence before you act.
  - You need a written health report on one Azure resource for your team.
  - An alert fired and you want the likely cause and a fix order.
you_give:
  - The name of your Azure resource
  - Its resource group or subscription (optional)
  - A short note on the symptoms and when they began
you_get:
  - A health status for the resource, with the issues ranked by severity
  - Log findings that show where errors and slowdowns come from
  - A likely root cause for each major issue
  - A fix plan in three phases, with commands, checks and ways to undo each change
  - Alert and dashboard ideas to catch the problem sooner
