thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-azure-resource-visualizer
name: Azure resource relationship mapper
summary: Get an Azure architecture diagram of your resource group, with each resource and how they connect. Needs read access to Azure.
job: ship-and-host
headline: Azure resource relationship mapper
subhead: Give your AI the name of an Azure resource group. It reads every resource and works out how they connect. You get a markdown file with a diagram you can share.
not_for:
  - "You want to change, fix or delete Azure resources: use the Azure Portal or your infrastructure-as-code tool, because this only reads."
  - "You have no Azure login or read access to the group: ask your Azure admin for read access first."
  - "You only need a diagram of a system you have not built in Azure yet: sketch it by hand or in a diagram tool."
how_to_use:
  - Use an AI that can run the Azure CLI (az) or Azure MCP tools, and sign in to Azure first. A plain chat window cannot read your resources.
  - Paste the skill into your AI, or load the skill folder if your tool supports it.
  - Tell your AI the resource group name. If you do not know it, ask it to list your groups and pick one.
  - Let it read the resources. It only reads and does not change anything in Azure. It does read resource settings, such as names, addresses and network rules, and sends them to your AI tool, so check that this is allowed for your account.
  - Open the new markdown file in a viewer that shows Mermaid diagrams.
  - Check the diagram against the live resource group before you share it with your team. Remove secrets, keys, IP addresses and any names you would not want outside the team first.
  - Next, use the map in an architecture review, or to plan a clean-up of resources nobody uses.
output_sample:
  input:
    - The name of your Azure resource group (or ask your AI to list them)
    - An Azure login with read access to that group
  prerequisites:
    - An AI that can run the Azure CLI (az) or use Azure MCP tools
    - Read access to the resource group in your Azure account
  output:
    - name: Header
      contains: The resource group name, subscription and region.
    - name: Summary
      contains: Two or three short paragraphs on what the architecture does.
    - name: Resource Inventory
      contains: A table of every resource with its type and key settings.
    - name: Architecture Diagram
      contains: A Mermaid diagram that groups resources by layer and labels each connection.
    - name: Relationship Details
      contains: Plain notes on the main connections and data flows.
    - name: Notes
      contains: Things worth noting, possible issues and suggestions.
when:
  - A new teammate needs to see how your Azure setup fits together.
  - You are writing architecture docs for a system that already runs.
  - You need a clear picture before a review or a clean-up.
  - You inherited a resource group and no one knows what is in it.
you_give:
  - "The name of your Azure resource group (optional: your AI can list them for you)"
  - An Azure login with read access to that group
you_get:
  - A markdown file named after your resource group, ending in -architecture.md
  - A table of every resource with its type and key settings
  - A Mermaid diagram grouped by network, compute, data and security
  - Short notes on each connection and anything that looks off
