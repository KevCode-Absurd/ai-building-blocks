thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-azure-well-architected-review
name: Azure workload practice reviewer
summary: Review your Azure setup against the five Well-Architected pillars. Get risk-ranked findings, fixes, and GitHub issues you can track.
job: ship-and-host
headline: Azure workload practice reviewer
subhead: "Share your infrastructure files and give your AI read access to your Azure subscription. It compares the files with what is live, checks the five Well-Architected pillars and rates each gap. After you say yes, it opens one GitHub issue per gap."
explain: |
  Azure setups drift. Someone changes a setting in the portal and the files no longer match what is running. This Azure Well-Architected review lists your live resources, compares them with your Bicep, Terraform or ARM files and flags the differences.

  It then checks reliability, security, cost, operations and performance, and rates each finding High, Medium or Low. It asks which subscription or resource group is in scope before it starts.

  It shows a summary and waits for your yes before it creates issues. Each issue has a fix, an Azure command line fallback and a checklist.
when:
  - "You are about to launch a workload on Azure and want a second look."
  - "Your Azure setup was changed by hand and you suspect it no longer matches your files."
  - "A customer or auditor asks how your Azure setup handles security and backups."
  - "You want review findings your team can track in GitHub."
not_for:
  - "Your stack is not on Azure: ask a person who knows your cloud, or use that cloud's own review tool."
  - "You only want a fast list of tips: use Azure Advisor in the Azure portal."
  - "You want a check of app code only, with no infrastructure: ask a developer for a code review."
you_give:
  - "Your repository with Bicep, Terraform or ARM files"
  - "The Azure subscription or resource group to review"
  - "Read access to Azure (Reader or Security Reader)"
  - "The GitHub repository that should get the issues"
  - "Your yes or no after the summary, before any issue is created"
you_get:
  - "A diagram of the Azure services found in your files and live resources"
  - "A list of differences between your files and what is live"
  - "A check of five pillars, with each finding rated High, Medium or Low"
  - "One GitHub issue per finding, with the fix in Bicep, a command line fallback and a checklist"
  - "One tracking issue with a table by pillar, a ranked checklist and success goals"
how_to_use:
  - Use an AI that can run commands and read your files. A plain chat cannot run the Azure commands this skill needs.
  - Sign in to Azure CLI with Reader or Security Reader access. Connect GitHub so your AI can create issues.
  - Open your repository with the infrastructure files. Tell your AI which subscription or resource group to review.
  - Ask your AI to follow this skill. It lists your files and live resources, then reviews each pillar.
  - Read the summary it shows. Answer yes to create the GitHub issues. Any other answer prints the findings as text and stops.
  - Fix the High risk items first, then work down the EPIC checklist.
output_sample:
  input:
    - Your repository with Bicep, Terraform or ARM files
    - The Azure subscription or resource group to review
    - Read access to Azure (Reader or Security Reader)
    - Your answer to a yes or no question before issues are created
  prerequisites:
    - An AI that can run code and commands
    - Azure CLI signed in to your account
    - A GitHub connection (GitHub MCP server) that can create issues
  output:
    - name: Architecture diagram
      contains: A Mermaid diagram of the Azure services found in your files and your live resources.
    - name: Drift findings
      contains: Resources that exist in Azure but not in your files, or the other way round.
    - name: Pillar review
      contains: Checks for reliability, security, cost, operations and performance, with each finding marked High, Medium or Low risk.
    - name: Review summary
      contains: Counts of findings by risk, the top high-risk items, and a question asking if you want issues created.
    - name: Finding issues
      contains: One GitHub issue per finding with a description, a fix in Bicep, an Azure CLI fallback and a check list.
    - name: EPIC issue
      contains: A tracking issue with a pillar table, the diagram, a ranked checklist and the success goals.
