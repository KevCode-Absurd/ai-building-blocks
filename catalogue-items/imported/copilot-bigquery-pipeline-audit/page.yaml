thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-bigquery-pipeline-audit
name: BigQuery pipeline cost safety reviewer
summary: Check your BigQuery pipeline for cost risks before you run it. Get a pass or fail report with the exact functions to fix.
job: ship-and-host
headline: BigQuery pipeline cost safety reviewer
subhead: Give your AI your Python and BigQuery pipeline code. It checks cost, re-run safety and error logging. You get a report that names the functions to change.
not_for:
  - Your pipeline does not use BigQuery. Use a review made for your own database or tool, or ask a data engineer.
  - You want to check one ad hoc SQL query. Run a dry run in the BigQuery console to see how much data it scans.
  - You want your Python code rewritten. This review suggests small fixes only, so ask your AI to apply the patches after.
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text, or upload the skill file.
  - Paste your pipeline code, or upload the files. Add your config, schemas, date range and environment if you have them.
  - Ask your AI to audit the pipeline with this skill.
  - Read the Final section first. Apply the patch list in order, starting with the highest risk.
  - Run the pipeline in dry run mode to check the fixes before you run it for real.
output_sample:
  input:
    - Your pipeline script or scripts (Python files)
    - Your config file or command line flags (optional)
    - Your target table schemas (optional)
    - The date range and environment you plan to run (optional)
  prerequisites:
    - An AI that can read your code files, or code you can paste into a chat
  output:
    - name: A) Cost exposure
      contains: Every BigQuery job and outside call, the worst-case job count, and missing byte limits on queries.
    - name: B) Dry run and execution modes
      contains: Whether a dry run mode exists, and whether prod needs a clear confirmation.
    - name: C) Backfill and loop design
      contains: Whether queries run once per date or entity, whether dates are capped, and whether a re-run is safe.
    - name: D) Query safety and scan size
      contains: Partition filter, SELECT star, join and costly function checks, with a SQL fix for each failure.
    - name: E) Safe writes and idempotency
      contains: Every write, whether a re-run makes duplicates, and the dedupe key to use.
    - name: F) Observability
      contains: Whether failures stop the run, what each job logs, and whether a run summary and run ID exist.
    - name: Final
      contains: A pass or fail per section, a patch list by risk, and the top 3 cost risks if it fails.
when:
  - You are about to deploy a Python and BigQuery pipeline.
  - You are about to re-run or backfill many dates and want to avoid a big bill.
  - A pipeline made duplicate rows after a crash and a re-run.
  - You need to review a teammate's data script before it goes to production.
you_give:
  - Your pipeline script or scripts
  - Your config file or command line flags (optional)
  - Your target table schemas (optional)
  - The date range and environment you plan to run (optional)
you_get:
  - A pass or fail verdict for each of six checks, A to F.
  - The exact functions and lines that put cost or data at risk.
  - Small SQL and code fixes, not a rewrite.
  - A patch list in order of risk.
  - The top 3 cost risks with a worst-case job count, if the pipeline fails.
