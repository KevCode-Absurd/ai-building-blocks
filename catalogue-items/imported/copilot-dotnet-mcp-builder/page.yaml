thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-dotnet-mcp-builder
name: C# MCP server implementation helper
summary: Build a C# MCP server with the current 2.x packages. Give your .NET project and the tools to expose, and get working server code.
job: connect-tools
headline: C# MCP server implementation helper
subhead: Give your AI your C# project and the tools you want to expose. It writes MCP server code with the current 2.x packages. This page is for .NET developers, not business users.
not_for:
  - "You write MCP servers in Python, TypeScript or another language: use that language's official MCP guide instead."
  - "You are not a .NET developer and want to connect a tool without code: ask a developer, or use a ready-made MCP server."
  - "You only want to rename a tool method or fix a small bug: edit the file by hand, you do not need this skill."
how_to_use:
  - Open an AI that can read your project files, such as Claude Code. A plain chat works if you paste the code in.
  - Paste the skill text, or add the skill folder, and say you want an MCP server in C#.
  - Give your project, the tools to expose, and STDIO or HTTP.
  - Run dotnet build on the result. This needs the .NET SDK on your machine.
  - Check that every tool class has its registration line in Program.cs.
  - If something fails, paste the error and ask your AI to check the stuck list in the skill.
output_sample:
  input:
    - Your C# project, or a note that you are starting a new one
    - The tools, prompts or resources you want to expose
    - Whether the server runs locally (STDIO) or over the web (HTTP)
    - Your .NET version (optional)
  prerequisites:
    - The .NET SDK installed to build the code
    - An AI that can read and write project files, for best results
  output:
    - name: Project file
      contains: The .csproj with the current stable 2.x ModelContextProtocol packages, not an old preview version.
    - name: Program.cs
      contains: Server setup with the chosen transport and the registration line for each tool, prompt or resource.
    - name: Tool class
      contains: A class marked as an MCP tool type, with described methods and parameters the AI client can read.
    - name: Prompt or resource classes
      contains: Extra classes, only if you asked for prompts or resources, each with its own registration line.
    - name: Build check and notes
      contains: A dotnet build result and warnings to fix, such as deprecated roots, sampling or logging use.
when:
  - You want to expose your C# code as tools an AI app can call.
  - Your MCP server code uses an old preview package and will not build.
  - Your STDIO server breaks because something writes to the console.
  - Your web server returns a 404, or your tool does not show up.
you_give:
  - Your C# project files, or a note that it is a new project
  - The tools, prompts or resources you want to expose
  - "Where it runs: your own machine (STDIO) or on the web (HTTP)"
  - Your .NET version (optional)
you_get:
  - Server code that uses the current stable 2.x packages
  - A Program.cs with the registration line for every tool you add
  - Tool classes with descriptions the AI client can read
  - A fix list for common errors such as 404s, missing tools and console output problems
