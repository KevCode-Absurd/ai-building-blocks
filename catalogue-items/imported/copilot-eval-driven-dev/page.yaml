thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-eval-driven-dev
name: AI app evaluation planner
summary: Set up an AI app evaluation for your Python LLM app. Get test cases, scoring rules and a pass or fail run you can repeat after each change.
job: set-up-ai
headline: AI app evaluation planner
subhead: "Share your Python app that calls an LLM and say what good looks like. It adds markers to your code, records one real run, then builds test cases and scoring rules. You get a pass or fail score you can repeat after every change."
explain: |
  Changing a prompt or a model can quietly make your app worse. This AI app evaluation planner builds a repeatable test so you can see it. You write down what the app must do well, and the skill turns that into checks you can score.

  It marks up your app so each run records what it reads and what it answers. It runs the app once the way a real user would and checks that the recording works. Then it adds scoring rules, such as an LLM judge or a similarity score, and a set of test cases.

  Running pixie test gives a score for each case and an action plan for the weak spots. Scoring with an LLM costs money, so keep the test set small at first.
when:
  - "You changed a prompt or model and want to know if the app got better or worse."
  - "Your Python app calls an LLM and has no tests."
  - "You want a pass or fail check before each release."
  - "You need a list of weak spots to fix, based on scores."
not_for:
  - Your app makes no LLM calls. Write plain unit tests instead.
  - You want a quick one-off check of a single answer. Read the output yourself or write a simple unit test.
  - Your app is not written in Python. This skill only works on Python 3.10+ projects.
you_give:
  - "Your Python app code that calls an LLM"
  - "What good behavior looks like for your app"
  - "Test data your app reads, such as database rows or API replies (optional)"
  - "A working LLM API key for your app"
you_get:
  - "Eval criteria: what your app must do well, written as checks you can score"
  - "Your app code marked so each run records its data and answers"
  - "One recorded run that proves the setup works"
  - "Scoring rules and a test set with inputs and the data for each case"
  - "A pass or fail result and a score for each case"
  - "An action plan for the weak spots the scores show"
how_to_use:
  - Use an AI that can read your project files, edit code and run commands. A plain chat window is not enough.
  - Check you have Python 3.10 or newer, the pixie-qa package, and a working LLM API key. Scoring with an LLM costs money.
  - Give your AI the skill and your project folder. Say what your app should do well.
  - "Let it work through the steps: set criteria, mark up the app, run it once, add scorers, build the dataset."
  - Run pixie test and read the scores. Fix any setup errors first.
  - Read the action plan and make the fixes. Run pixie test again to compare.
output_sample:
  input:
    - Your Python app code that calls an LLM
    - What good behavior looks like for your app
    - Test data your app reads, like database rows or API replies (optional)
  prerequisites:
    - An AI that can read your files, edit code and run commands
    - Python 3.10 or newer
    - The pixie-qa package installed
    - A working LLM API key for your app
  output:
    - name: Eval criteria
      contains: What your app must do well, based on its code and its users, written as checks you can score.
    - name: Instrumented app
      contains: Your app code marked so each run records the data it reads and the answers it gives.
    - name: Runnable
      contains: A small entry point that runs your app the way a real user would, with real LLM calls.
    - name: Reference trace
      contains: One recorded run, checked to confirm the app and the markers work before you build more.
    - name: Evaluators
      contains: The scoring rules that judge each answer, such as an LLM judge or a similarity score.
    - name: Dataset
      contains: Test cases with the inputs and the data the app should see for each one.
    - name: pixie test results
      contains: A pass or fail result and a score for each test case.
    - name: Action plan
      contains: A list of fixes for the weak spots the scores show, in plain steps.
