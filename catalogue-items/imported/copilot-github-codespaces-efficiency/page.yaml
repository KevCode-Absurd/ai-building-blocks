thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-github-codespaces-efficiency
name: Codespaces startup and cost reviewer
summary: Find what slows your Codespaces startup and drives up spend. Get the top 3 fixes for your dev container, machine size, prebuilds and idle timeout.
job: ship-and-host
headline: Codespaces startup and cost reviewer
subhead: Share your dev container setup, and your AI checks it for slow startup and wasted spend. It returns up to three fixes, ranked by savings. Each fix is checked so it does not remove tools your team needs.
not_for:
  - "You want a spend report: use the billing page in your GitHub settings, which shows what you were charged."
  - "Your repo does not use Codespaces and has no dev container: this skill has little to check, so set up a basic dev container by hand first."
  - "You need to change org-wide Codespaces rules: ask your GitHub org owner, since this skill keeps repo fixes apart from org settings."
how_to_use:
  - Use an AI that can run commands and read your repo, and install the GitHub CLI (gh) on that machine.
  - Sign in with gh, using an account with admin access to the repo. Without it, machine and prebuild tips are marked unverified.
  - Paste the skill into your AI, or add the skill folder, and ask it to audit your Codespaces setup.
  - Read the Waste sources and the three fixes. Check each fix against tools your team uses daily.
  - Apply one fix at a time in your repo, then start a test Codespace to confirm it builds.
  - Remember that GitHub bills Codespaces use, so test Codespaces may add a small cost.
output_sample:
  input:
    - Your repo with its .devcontainer folder
    - Your list of current Codespaces (optional)
    - Your usage patterns, such as how long sessions run (optional)
  prerequisites:
    - An AI that can run commands and read your repo files
    - The GitHub CLI (gh) signed in to your GitHub account
    - Repo admin access for machine and prebuild checks (without it, those tips are marked unverified)
    - A GitHub plan that bills Codespaces use
  output:
    - name: Waste sources
      contains: The top things that slow startup or raise cost, such as a heavy image, too many features or a large machine.
    - name: Proposed fixes
      contains: Up to three changes backed by what the audit found, ranked by estimated monthly savings.
    - name: Validation
      contains: Whether each fix was proven in a live test Codespace, checked from files only, or still carries risk.
    - name: Impact
      contains: Expected and measured change in startup time, monthly spend and resource use.
when:
  - Your Codespaces take too long to start.
  - Your monthly Codespaces bill is higher than you expected.
  - You want to pick the right machine size or idle timeout.
  - You are setting up a dev container for the first time.
you_give:
  - Your repo with its .devcontainer folder
  - Your current Codespaces list (optional)
  - Notes on how long your team's sessions usually run (optional)
you_get:
  - A list of what makes startup slow or costs high
  - Up to three fixes, ranked by estimated monthly savings
  - A note on which fixes were tested and which were not
  - Expected change in startup time, spend and resource use
