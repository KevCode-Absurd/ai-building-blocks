thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-migrating-oracle-to-postgres-stored-procedures
name: Oracle stored procedure migrator
summary: Convert Oracle PL/SQL stored procedures into PostgreSQL PL/pgSQL, one file per procedure, with signatures kept and behavior changes listed.
job: build-software
headline: Oracle stored procedure migrator
subhead: Give it your Oracle stored procedures and table definitions. It translates each one into PostgreSQL code, keeps the names and parameters the same, and picks a sort order on purpose. You get one PostgreSQL file per procedure and a list of what to check.
explain: |
  Oracle stored procedures use syntax that PostgreSQL does not accept. A search and replace misses the quiet differences, such as sorting order and how types are matched. This skill translates each procedure and keeps the logic and the method signature as they were.

  It reads the Oracle procedure and the table and view definitions it depends on. It then translates the syntax into PostgreSQL's PL/pgSQL language. It keeps parameters that follow a table column's type, uses plain types for output values passed on to other procedures, and leaves error handling and rollbacks unchanged. It chooses text sort order on purpose. It uses the binary sort order only when Oracle did, and a named locale sort order when Oracle used a language sort. It flags UNION ALL queries for a plan check, because they can slow down on PostgreSQL. It uses the orafce add-on when that makes the code clearer.

  It does not move data or table structure. It only moves procedures and functions.
when:
  - You are moving an Oracle database to PostgreSQL and have stored procedures to convert.
  - A procedure uses Oracle-only syntax that fails on PostgreSQL.
  - You want results to sort the same way after the move.
  - You want each migrated procedure in its own file for review.
not_for:
  - "You need to move the data or table structure: this skill only converts procedures and functions."
  - "You are converting application code that calls the database: use the Oracle to Npgsql code migrator."
  - "You want to check migrated work for risks: use the Oracle migration risk reviewer."
  - "You have not listed which procedures and tables exist yet: plan first with the Oracle to Postgres migration planner."
you_give:
  - The Oracle stored procedures or functions to convert
  - The Oracle table and view definitions they use
  - The PostgreSQL table and view definitions for the target
  - Your project name, for the output folder
  - The sort order Oracle used for text, if it set one (optional)
you_get:
  - One PostgreSQL PL/pgSQL file per procedure, in its own folder
  - The same procedure names and parameters as before
  - A list of changes in behavior, such as sort order or UNION ALL plans
  - A short checklist to test each procedure before you deploy
how_to_use:
  - Collect the Oracle procedures and the table and view definitions they use. Collect the PostgreSQL table and view definitions too.
  - Open an AI that can read and write your project files, such as Claude Code or Copilot in your editor. Paste this skill.
  - Tell it your project name and where the files are. If your files are not in the .github/oracle-to-postgres-migration folders, give it the paths.
  - Ask it to convert one procedure first. Check the sort order choice and any type changes it lists.
  - Run the new procedure against a test PostgreSQL database and compare its results with Oracle's on the same data.
  - Convert the rest, then review each flagged behavior change before you deploy.
how_it_works:
  - title: Read the Oracle source
    text: It reads the procedure and the Oracle table and view definitions it needs to resolve types.
  - title: Translate the syntax
    text: It converts Oracle-only syntax to PostgreSQL, keeps the logic and signature, and leaves error handling and rollbacks alone.
  - title: Choose the sort order
    text: It uses binary sorting only when Oracle used it, and a named locale when Oracle used a language sort.
  - title: Check UNION ALL
    text: It flags each UNION ALL query so you can check the plan, since combined branches can run slowly.
  - title: Write the file
    text: It saves each procedure in its own file under the project's PostgreSQL Procedures and Functions folder.
output_shape: |
  Procedure: <name>
  Source: <Oracle file>
  Output: <PostgreSQL file path>
  Translated
    <list of Oracle syntax changed>
  Kept the same
    <signature, parameter types, error handling>
  Sort order
    <binary, locale name or not used, and why>
  Check before deploy
    <UNION ALL plan, orafce use, any open question>
output_sample:
  input:
    - The Oracle stored procedures or functions to convert
    - The Oracle table and view definitions they use
    - The PostgreSQL table and view definitions for the target
    - Your project name
  prerequisites:
    - An AI that can read and write files in your project
    - A PostgreSQL test database to run the results against
  output:
    - name: Migrated procedure file
      contains: The procedure in PostgreSQL PL/pgSQL, with the same name and parameters as the Oracle version.
    - name: Output folder layout
      contains: One file per procedure, in a folder named for your project and package.
    - name: Translation notes
      contains: Which Oracle syntax was changed, and what was kept the same on purpose.
    - name: Sort order decision
      contains: Which text sort order was chosen and why, based on how Oracle sorted.
    - name: UNION ALL flags
      contains: Queries to check for slow plans on PostgreSQL.
    - name: Pre-deploy checklist
      contains: Tests to run and behavior changes to review before you use the procedure.
works_best_with:
  tools:
    - name: Claude Code or Copilot in your editor
      why: They can read your Oracle files and write each PostgreSQL file in place.
    - name: A PostgreSQL test database
      why: You need one to compare results with Oracle before you deploy.
  inputs:
    - Sample input values and the results Oracle gives
    - A list of which other procedures call this one
    - The list of PostgreSQL add-ons you have installed, such as orafce
terms:
  - term: PL/SQL and PL/pgSQL
    meaning: The languages for stored procedures in Oracle and PostgreSQL.
  - term: Stored procedure
    meaning: Code saved inside the database that runs when you call it.
  - term: Collation
    meaning: The rule that sets how text is sorted and compared.
  - term: orafce
    meaning: A PostgreSQL add-on that adds many Oracle-style functions.
