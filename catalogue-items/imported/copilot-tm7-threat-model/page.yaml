thinking: high
thinking_why: It compares evidence and checks changes against the goal.
new_slug: copilot-tm7-threat-model
name: Microsoft threat model file builder
summary: Turn your system description into a .tm7 file with STRIDE threats. It opens in Microsoft's Threat Modeling Tool, which runs on Windows only.
job: secure-code
headline: Microsoft threat model file builder
subhead: Describe your system, its data stores, outside parties and data flows. Your AI builds a threat model file for the Microsoft Threat Modeling Tool. It adds STRIDE threats for each flow.
explain: |
  The result is a first draft for your team's security review. It is not a complete threat assessment, and a person must check every threat.
not_for:
  - "You do not need a .tm7 file: ask your AI for a plain STRIDE threat table instead."
  - "You use a different threat modeling tool: use that tool's own file format, since this one only writes .tm7."
  - "You only want to read or review a model: open it in the Microsoft Threat Modeling Tool itself, which runs on Windows."
how_to_use:
  - This is the MIT-licensed tm7-threat-model skill from github/awesome-copilot (commit 613efc8, copied on 2026-10-21), with a plainer name. Its file structure has not been tested by this catalogue.
  - First, on a Windows computer, open the bundled assets/example-minimal.tm7 in the Microsoft Threat Modeling Tool. If your version of the tool cannot load it, stop here, because a file your AI builds from it will fail too.
  - Use an AI that can create a file you can download. Paste the skill into the chat, or upload the skill folder.
  - Describe your system in a few lines. Name each part, each data store, each outside party and each data flow.
  - Ask your AI to build the .tm7 file. Add your trust boundaries if you have them.
  - Download the file and open it in the Microsoft Threat Modeling Tool v7.3 or newer on Windows. Check that the diagram shows every part and flow you gave. Write down any error message the tool shows.
  - We have not checked the file in every version of the tool. If the tool says the file is corrupted, tell your AI the exact message and ask it to fix the file. The skill's own check is a text checklist the AI runs on the file. It cannot open the file in Microsoft's tool, so only your test in the tool counts. If the file still will not open after a fix or two, ask for a plain STRIDE threat table instead.
  - Review each threat in the tool. Set its state and write a mitigation.
  - Next, export the threat list for your security review and track each mitigation in your task tracker. The tool runs on Windows only. If you are not on Windows, ask your AI for a plain STRIDE threat table instead.
output_sample:
  input:
    - "A list of your parts: apps, services and functions"
    - Your data stores and the outside users or systems that talk to you
    - The data flows between them, and which way each one goes
    - Your trust boundaries, such as internet to internal network (optional)
  prerequisites:
    - Microsoft Threat Modeling Tool v7.3 or newer, installed on Windows, to open the result
    - An AI that can save a file you can download
  output:
    - name: The .tm7 file
      contains: One continuous XML file with no XML declaration, built to open in the Microsoft Threat Modeling Tool. Not yet checked in any version of the tool, so check that it opens before you rely on it.
    - name: Stencils
      contains: Each process, data store and outside party as a shape with a unique ID and a place on the diagram.
    - name: Trust boundaries
      contains: Boundary shapes drawn around the parts that sit in the same zone of trust.
    - name: Data flows
      contains: Lines linking your shapes, each tied to a real source and target.
    - name: Threat instances
      contains: STRIDE threats for each interaction, linked to the flow they apply to.
    - name: Checklist result
      contains: A check against the common mistakes that stop the tool from opening the file.
when:
  - You need a threat model file for a new app or service before a security review.
  - Your team already uses the Microsoft Threat Modeling Tool and wants a first draft to edit.
  - You have an architecture sketch and want it turned into a diagram with threats.
  - You need to change an existing .tm7 file, such as adding a data store.
you_give:
  - A list of your apps, services and functions
  - Your data stores, such as databases, caches and queues
  - The users and outside systems that connect to you
  - The data flows between all of these, with the direction of each
  - Your trust boundaries (optional)
  - An existing .tm7 file to change (optional)
you_get:
  - A .tm7 file built for the Microsoft Threat Modeling Tool v7.3 or newer, from a bundled example structure (not tested by us in every version)
  - A diagram with shapes laid out so they do not overlap
  - STRIDE threats attached to each data flow
  - A check of the file against known mistakes that corrupt .tm7 files
