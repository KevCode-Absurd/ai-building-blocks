thinking: medium
thinking_why: It picks a framework, then writes variants.
new_slug: copywriting-framework-writer
name: Copywriting framework writer
summary: Write marketing copy in AIDA, PAS or BAB form from your offer. Get tone options, A/B variants and clearer calls to action to test.
job: write-ad-copy
headline: Copywriting framework writer
subhead: Marketing copy written in a proven structure, AIDA, PAS or BAB, in the tone you pick, with A/B variants and stronger calls to action. You see the same offer in different shapes and choose the best.
explain: |
  Marketing copy written in a proven structure, AIDA, PAS or BAB, in the tone you pick, with A/B variants and stronger calls to action. You see the same offer in different shapes and choose the best.

  You describe your offer, audience and goal. The skill picks a framework to fit: attention to action for emails, problem and agitation for pain-led pages, before and after for results. It writes the copy in your tone and gives two or more variants to test. Calls to action are written to be specific. Examples cover a landing page hero and an email sequence. Edge cases cover short copy and unclear offers.
when:
  - You need a hero section and want a few versions to test.
  - You are writing an email sequence and want a clear structure.
  - Your ad copy sounds flat and you want a different angle.
  - You can't decide which style fits your offer.
not_for:
  - "You need ad or health, money or legal copy to publish as is: have a person with that expertise review it first."
  - "Your offer is still unclear: write down what you sell, who it is for and the goal first, then come back."
  - "You need a full brand voice guide: write one by hand or ask a copywriter."
you_give:
  - Your offer and price
  - Your audience
  - The tone you want
  - The goal of the copy
you_get:
  - Copy in the chosen framework
  - Tone options
  - A/B variants
  - Call to action options
how_to_use:
  - Before you start, gather these: your price, your shipping and guarantee terms (only if you offer them), real customer quotes you have permission to use, and any rules for your field (health, money or legal). The copy should use only these facts.
  - Open Claude, ChatGPT or Gemini and paste in this skill's instructions. It is a general MIT-licensed skill by Burhan Sebin, not tuned for one kind of business, so add the rules of your field yourself.
  - Describe your offer, your audience, your goal and where the copy will run.
  - Add your tone, and any limits such as character counts or required phrases (optional).
  - Read the framework your AI picked. Ask for a different one if it does not fit.
  - Check every claim and number in the copy. Replace any placeholder with a real fact before you publish.
  - Test the A/B variants against each other and keep the one that works.
  - Next, write down which variant won, and reuse its headline and call to action in your next channel. You can also pair the copy with a simple landing page test.
output_sample:
  input:
    - Your product or service, and the price if you have it
    - Your goal, such as signups, sales or traffic
    - Your audience and their main pain or wish
    - Where the copy will run, such as a landing page, email or ad
    - Your brand voice or limits like word counts (optional)
  output:
    - name: Chosen framework
      contains: The framework picked (AIDA, PAS, BAB or 4Ps) and a short reason it fits your goal and audience.
    - name: Copy draft
      contains: The copy written in that framework's order, in your tone, for the channel you named.
    - name: Call to action
      contains: A specific, benefit-led call to action matched to how much you are asking the reader to commit.
    - name: A/B variants
      contains: At least two different versions of the headline, subheadline and call to action.
    - name: Variant hypothesis
      contains: A note on what each variant tests, so you know what to compare.
