thinking_why: It builds a fixed folder layout.
new_slug: course-exercise-scaffolder
name: Course exercise scaffolder
summary: Describe your course section. Get exercise folders with problems, solutions and explainers that pass linting.
job: build-software
headline: Course exercise scaffolder
subhead: Describe your course section. Get exercise folders with problems, solutions and explainers that pass linting.
explain: |
  A folder tree for a course section, filled with problem, solution and explainer files that pass your lint checks. You skip the hand made folders and start writing the teaching content.

  You describe the section and its exercises, or hand over a plan. The skill names directories to the required pattern, picks the right exercise variant, and creates the needed files in each folder. It follows the lint rules so errors do not appear later, and it covers moving or renaming exercises without breaking links. You can stub every exercise from a plan in one pass. It is built for code-based courses and needs a project folder you can write to.
when:
  - You are starting a new course section with ten exercises.
  - You have a lesson plan and want stub files made for it.
  - Linting fails because folders or files are named wrong.
  - You need to rename an exercise without breaking the order.
you_give:
  - Section name and exercise list
  - Your course folder
  - Exercise type for each (optional)
  - Lesson plan (optional)
you_get:
  - Exercise folders
  - Problem, solution and explainer stubs
  - Lint-passing structure
  - Rename and move steps
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code.
