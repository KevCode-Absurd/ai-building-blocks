thinking: high
thinking_why: It balances order across subjects and years.
new_slug: course-scope-sequence
name: Course scope and sequence planner
summary: Plan a course scope and sequence that shows what to teach and in what order, so each year builds on the last. Flags gaps before students hit them.
job: teach-and-train
headline: Course scope and sequence planner
subhead: A scope and sequence that shows what to teach and in what order across a year or programme, so each topic builds on what came before.
explain: |
  A scope and sequence that shows what to teach and in what order across a year or programme, so each topic builds on what came before. Gaps and jumps in difficulty show up before students hit them.

  You give the subject, years and learning goals. The skill maps prerequisites, diagnoses how the knowledge is built, and sets sequencing limits. It proposes an order with reasons, then flags prerequisite violations and checks coherence up and across the programme. It lists principles used and marks where the teacher should decide. A confidence note says how sure it is. The result is a plan you adjust, not a final timetable.
when:
  - You are designing a new programme and need the order of units.
  - Students arrive in year two missing key ideas.
  - You are rebuilding a subject and want to check progression.
  - You want to show colleagues why topics appear where they do.
not_for:
  - "You plan one lesson or a single unit: use the Backwards design unit planner, or ask your AI to draft the lesson directly."
  - "You need a dated timetable with room and staff slots: use your school's timetable tool, as this gives an order, not a calendar."
  - "You want to write tests or marking guides for a course: ask your AI to draft the assessment once you have your order."
you_give:
  - Subject and year levels
  - Learning goals
  - Current topic list (optional)
  - Time available per unit
you_get:
  - Prerequisite map
  - Recommended sequence with reasons
  - Prerequisite violations
  - Coherence checks
  - Questions for teacher judgment
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code or paid tool is needed.
  - Paste your subject, your year groups or bands, and the goals students should reach.
  - A few short terms you may see in the result. LT is a learning target. KUD means know, understand, do. T1, T2 and T3 are three kinds of knowledge: T1 builds step by step, T2 can be taught in more than one order, and T3 is about habits and ways of being.
  - Add your current topic list if you have one (optional), and the time you have per unit.
  - Ask for the sections in order, from the prerequisite map to the design flags.
  - Read the prerequisite violations first, then answer the teacher-decision questions.
  - Ask your AI to redo the order with your answers, then check it with your colleagues. Treat any research the plan cites as background to verify, not proof.
next: [backwards-unit-planner, skill-progression-map-builder]
output_sample:
  input:
    - Your subject or programme name and a short description
    - Your year groups or bands (for example Years 1 to 13)
    - The goals students should reach by the end
    - Your current units or skills (optional)
  output:
    - name: Confidence Level
      contains: A short note on how sure the plan is, based on what you gave it.
    - name: Prerequisite Map
      contains: Which ideas must be learned before others, shown as a chain.
    - name: Knowledge Architecture Diagnosis
      contains: How the subject's knowledge builds, such as step by step or in separate strands.
    - name: Sequencing Constraints
      contains: The limits that fix the order, such as what must come first.
    - name: Recommended Sequence with Rationale
      contains: The proposed order of topics across bands, with a reason for each placement.
    - name: Prerequisite Violations
      contains: Places where a topic appears before the ideas it needs.
    - name: Coherence Checks
      contains: Checks that learning builds up through the years and links across strands.
    - name: Sequencing Principles
      contains: The ideas used to set the order.
    - name: Teacher Discretion Flags and Questions
      contains: Points where a teacher should decide, with questions to help.
    - name: Design Flags and Recommendations
      contains: Gaps and fixes to consider before you adopt the plan.
