thinking: medium
thinking_why: It plans each stage of a partnership.
new_slug: creator-partnership-planner
name: Creator partnership planner
summary: "Plan your creator partnership: find and vet creators, set fair deals, write the brief and track results. Give it your product, price and budget."
job: grow-social
headline: Creator partnership planner
subhead: A plan to find creators, agree deals, brief them and measure what the partnership earns. You get a repeatable way to run influencer, ambassador and sponsorship work.
explain: |
  A plan to find creators, agree deals, brief them and measure what the partnership earns. You get a repeatable way to run influencer, ambassador and sponsorship work.

  You say what you sell. The skill covers where to find and vet partners, how to write outreach, and how to structure a deal across flat fee, commission or free product. It adds the disclosure rules you must follow, a creative brief template, and how to track return. It also covers ambassador programs and sponsorships of newsletters, podcasts and videos. A run of show checklist takes you from sourcing to the post campaign review.
when:
  - You want to work with creators and have never done it.
  - You paid an influencer and can't tell if it worked.
  - You need a brief to send to a creator.
  - You want to start an ambassador program.
not_for:
  - "You want one organic post and have no budget: post it yourself, or ask a friend to share it."
  - "You need to set up affiliate or referral payouts: use a referral program tool or set the payout rules in your own store."
  - "You want to build advocacy inside an online community: use a community marketing plan, not a paid creator plan."
you_give:
  - Your product and price
  - Your audience
  - Budget
  - Platforms of interest (optional)
you_get:
  - Partner search and vetting steps
  - Outreach messages
  - Deal structure
  - Creative brief
  - Measurement plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. This one plans a whole partnership program. To only build a shortlist, use the influencer shortlist builder. To only check one creator's audience, use the creator audience checker. Tools like SparkToro for audience checks are usually paid.
  - Tell your AI what you sell, your price, your audience and your budget.
  - Say which platforms you want, or leave this out and let it suggest some.
  - Read the plan. Check the creator vetting steps and the disclosure rules first. Treat the pay ranges as rough starting points to negotiate from, not market data.
  - Send the brief and outreach messages to your shortlist, then follow the checklist through to the review.
output_sample:
  input:
    - What you sell and its price
    - Your audience
    - Your budget, and whether it is cash or free product
    - The platforms you care about (optional)
    - Your product marketing notes, if you have them (optional)
  prerequisites:
    - A chat AI such as Claude, ChatGPT or Gemini. No code or paid tool is needed. The audience tools it names, such as SparkToro, are optional and usually paid.
  output:
    - name: Finding and vetting partners
      contains: Where to look for creators and the checks to run before you reach out.
    - name: Outreach
      contains: Message ideas for first contact with a creator.
    - name: Structuring the deal
      contains: How to choose between a flat fee, commission or free product, with pay guides.
    - name: Disclosure and compliance
      contains: The rules for labelling paid posts so the partnership stays legal.
    - name: The creative brief
      contains: A template you send to the creator so they know what to make.
    - name: Measurement and ROI
      contains: How to track results and judge what the partnership earned.
    - name: Ambassador program design
      contains: How to set up a longer-term ambassador program, if you want one.
    - name: Run-of-show checklist
      contains: Steps from sourcing and outreach to execution and the post-campaign review.
