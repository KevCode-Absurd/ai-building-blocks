thinking: medium
thinking_why: It samples posts, then reads what drives them.
new_slug: creator-profile-teardown-writer
name: Creator profile teardown writer
summary: "Break down a creator profile teardown in one pass: get positioning, content themes, top posts and tests to run. Needs a ScrapeCreators key."
job: study-competitors
headline: Creator profile teardown writer
subhead: Give it a social account. Get its positioning, content themes, top posts and what to test. Collects data from websites. Bring the account link. Use the result to plan your next step.
explain: |
  A breakdown of a social account: how it positions itself, which themes it returns to, which posts beat the average, and what you can test yourself. You learn from what works without copying it.

  You name an account. The skill reviews the profile and recent posts, then writes up positioning, content pillars and outlier posts, with the hooks and formats behind them. It reads audience reactions in comments. A section lists what to steal and a separate section lists what not to copy, because your voice differs. It ends with tests to run on your own account. It collects data from websites, so results depend on what is public.
when:
  - A competitor's account is growing and you want to know why.
  - You are choosing a content style for your own profile.
  - You need hook ideas that already work in your niche.
  - You are researching a creator before a partnership.
not_for:
  - "You want data on your own account: use the analytics tool built into that app, such as Instagram Insights or TikTok Analytics."
  - "The account is private: your AI can only read public posts, so ask the owner to share their numbers."
  - "You want to check one post only: read that post and its comments yourself, a full teardown is too much."
you_give:
  - The account link
  - Your own niche and goals
  - Time period to review (optional)
  - Competitor list (optional)
you_get:
  - Positioning summary
  - Content pillars
  - Outlier posts and why they worked
  - Hooks and formats to try
  - Tests for your account
how_to_use:
  - Get a ScrapeCreators API key from scrapecreators.com. This is a paid service, so check their site for current prices.
  - Open an AI that can run code, such as Claude with code tools, and set your key as SCRAPECREATORS_API_KEY.
  - Paste the skill text into the chat.
  - Add the account link, your niche and your goals. Add a time period if you want one.
  - Read the Outlier Posts first. The skill shows what the evidence suggests, not proof of cause.
  - Pick one or two items from Tests for Us and run them on your own account.
output_sample:
  input:
    - The account link
    - Your own niche and goals
    - Time period to review (optional)
  prerequisites:
    - An AI that can run code and use the web
    - A ScrapeCreators API key, set as SCRAPECREATORS_API_KEY
  output:
    - name: Positioning
      contains: Who the account serves, the promise it makes, and the voice it uses.
    - name: Content Pillars
      contains: A table of the themes it returns to, with evidence and example posts.
    - name: Outlier Posts
      contains: A table of posts that beat the average, with the metric, why it matters and the pattern.
    - name: Hooks and Formats to Steal
      contains: Hooks and post formats that seem to work and are worth adapting.
    - name: What Not to Copy
      contains: Parts of the account that will not suit your voice or situation.
    - name: Tests for Us
      contains: A numbered list of tests to run on your own account.
