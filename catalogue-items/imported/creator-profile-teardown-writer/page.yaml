job: study-competitors
headline: Creator profile teardown writer
subhead: Give it a social account. Get its positioning, content themes, top
  posts and what to test. Collects data from websites. Bring the account link.
  Use the result to plan your next step.
explain: |
  A breakdown of a social account: how it positions itself, which themes it returns to, which posts beat the average, and what you can test yourself. You learn from what works without copying it.

  You name an account. The skill reviews the profile and recent posts, then writes up positioning, content pillars and outlier posts, with the hooks and formats behind them. It reads audience reactions in comments. A section lists what to steal and a separate section lists what not to copy, because your voice differs. It ends with tests to run on your own account. It collects data from websites, so results depend on what is public.
when:
  - A competitor's account is growing and you want to know why.
  - You are choosing a content style for your own profile.
  - You need hook ideas that already work in your niche.
  - You are researching a creator before a partnership.
you_give:
  - The account link
  - Your own niche and goals
  - Time period to review (optional)
  - Competitor list (optional)
you_get:
  - Positioning summary
  - Content pillars
  - Outlier posts and why they worked
  - Hooks and formats to try
  - Tests for your account
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and use your ScrapeCreators key.
