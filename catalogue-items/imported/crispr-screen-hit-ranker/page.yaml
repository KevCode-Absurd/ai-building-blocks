thinking: medium
thinking_why: It follows a standard pipeline and reads the quality results.
new_slug: crispr-screen-hit-ranker
name: CRISPR screen hit ranker
summary: Rank genes from your CRISPR screen with MAGeCK. Give it guide counts or reads. You get QC checks and a hit list with effect sizes and FDR.
job: research-topics
headline: CRISPR screen hit ranker
subhead: A quality-checked ranked list of genes from a pooled CRISPR screen, with effect sizes and false discovery rates. You see which genes truly rise or fall between conditions and whether the data can be trusted.
explain: |
  A quality-checked ranked list of genes from a pooled CRISPR screen, with effect sizes and false discovery rates. You see which genes truly rise or fall between conditions and whether the data can be trusted.

  You give it guide read counts or raw sequencing reads. The skill validates the guide library and the comparisons you want to make. It then measures replicate agreement and library quality before testing. MAGeCK runs the count and test steps for knockout, CRISPRi or CRISPRa screens, in enrichment or depletion contrasts. Output is a gene ranking with effect size and FDR. It needs command line tools and Python installed. Public dependency lookups belong in a different skill.
when:
  - You finished a knockout screen and have a count table.
  - You need to check replicate quality before trusting hits.
  - You want to compare treated and control cells.
  - You have raw reads and must produce counts first.
not_for:
  - "You want to design guides or find what a gene does from one hit: this skill only analyzes screens, so use a guide design tool or lab follow-up."
  - "You only need existing public dependency scores for a gene: use a DepMap lookup, which needs no new analysis."
  - "You cannot run command line tools or install MAGeCK: ask a bioinformatics colleague to run it, or use a core facility."
you_give:
  - Guide count matrix or FASTQ files
  - Guide library file
  - Sample groups and comparison
  - MAGeCK installed
you_get:
  - Library and replicate QC
  - Ranked gene hit list
  - Effect sizes and FDR
  - Commands used
how_to_use:
  - This needs a bioinformatics setup. It fits lab researchers and bioinformaticians with a finished pooled CRISPR screen. If you do not have one, ask a colleague to run it.
  - Install MAGeCK 0.5.9.5 and Python on a computer your AI can use. Check that mageck --version works.
  - Put your guide library, count table or FASTQ files, and sample names in one folder.
  - Paste the skill into your AI. Say which samples are control and which are treated.
  - Ask your AI to run the count step first if you only have reads, then the QC step.
  - Read the QC flags before you trust any hits. Fix or explain weak replicates.
  - Run the test step, then check that several guides agree for your top genes.
  - Next, pick the top genes whose guides agree and plan a follow-up check in the lab, such as a new guide set or a single-gene knockout. Treat the ranking as a shortlist, not proof.
output_sample:
  input:
    - Your guide count table, or FASTQ read files
    - Your guide library file (guide ID, sequence, gene)
    - Which samples are control and which are treated
    - Your negative-control guide IDs (optional)
  prerequisites:
    - An AI that can run command line tools and Python 3.10 or newer
    - MAGeCK 0.5.9.5 installed, with NumPy and SciPy
    - Sequencing reads already collected from your pooled screen
  output:
    - name: counts.count.txt
      contains: The guide count table made from your reads, only when you start from FASTQ files.
    - name: qc.json
      contains: Library representation, zero fractions, Gini values and replicate correlations, with flags to review.
    - name: report.json
      contains: File checksums, MAGeCK version, exact arguments, normalization used, warnings, and each gene's direction, FDR, log2 fold change and rank.
    - name: screen.gene_summary.txt
      contains: The full gene ranking from MAGeCK, for enriched and depleted genes.
    - name: screen.sgrna_summary.txt
      contains: Results for each guide, so you can check that guides for a top gene agree.
    - name: Interpretation
      contains: A short note on which genes rise or fall, and whether the data can be trusted.
terms:
  - term: MAGeCK
    meaning: Free software that ranks genes from pooled CRISPR screens.
  - term: RRA
    meaning: The method MAGeCK uses to rank genes from how their guides rank.
  - term: FDR
    meaning: The share of hits you would expect to be false alarms at that cut-off.
  - term: Log2 fold change
    meaning: How much a guide or gene count went up or down between conditions. Each step of 1 is a doubling or halving.
  - term: Gini
    meaning: A score for how unevenly the guides are represented. A high score means a few guides dominate.
