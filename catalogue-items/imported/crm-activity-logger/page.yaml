thinking: low
thinking_why: It fills a fixed record from your notes.
new_slug: crm-activity-logger
name: CRM activity logger
summary: Log a call, meeting or email in your CRM without typing it. Give a short description. You get a draft entry to review, saved when you say so.
job: sell-and-negotiate
headline: CRM activity logger
subhead: A call, meeting or email logged to the right account, contact and deal in your CRM, shown to you first and saved only when you say so.
explain: |
  A call, meeting or email logged to the right account, contact and deal in your CRM, shown to you first and saved only when you say so. It turns a quick description or transcript into a clean entry.

  First it checks you have permission to write. Then it finds the matching records, drafts the entry from what you said, and shows it with its sources. You review, then it saves and checks that the record landed. It can also read mode: ask what is logged on an account and see recent activity. It needs a connected CRM. If no write access exists, it hands you the text to paste yourself.
when:
  - You just finished a call and don't want to type it into the CRM.
  - You have a meeting transcript to log against a deal.
  - You want to see what has been logged on an account.
  - Your team forgets to log emails to prospects.
not_for:
  - "You want to plan a future meeting or a to-do: make a task in your CRM instead."
  - "Your AI cannot write to your CRM: use the paste-ready entry this skill gives you and add it yourself."
  - "You want to change a deal's stage or next step: edit the deal in your CRM by hand."
you_give:
  - Description or transcript of the interaction
  - Account or contact name
  - Connected CRM
  - Date and outcome (optional)
you_get:
  - Matched account, contact and deal
  - Drafted activity entry
  - Preview before saving
  - Saved record check
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on this page.
  - It works best when your AI can read and write to your CRM.
output_sample:
  input:
    - A short description of the call, meeting or email, or a transcript
    - The account or contact name
    - When it happened (optional)
    - The outcome or next step (optional)
  prerequisites:
    - A CRM connected to your AI, to find records and save the entry (without it you get paste-ready text)
  output:
    - name: Matched records
      contains: The account, contact and open deal the conversation belongs to, with links. You are asked if more than one fits.
    - name: Drafted entry
      contains: A subject, type, date, three to six bullet summary and the related records, shown as it will be saved.
    - name: Saved activity
      contains: The entry saved as a completed activity once you ask for it, or paste-ready text if writing is off.
    - name: Check of the saved record
      contains: A re-read of the record confirming its subject, date, related records and link.
    - name: Recent activity list
      contains: In read mode, the last 20 or so activities on an account, newest first, with a note on gaps over 14 days.
