thinking: low
thinking_why: It makes one small, shown change.
new_slug: crm-deal-updater
name: CRM deal updater
summary: Update a deal in your CRM by saying what changed. See the before and after, accept it, and get the saved record link.
job: sell-and-negotiate
headline: CRM deal updater
subhead: Changing a deal in your CRM stops being a guessing game. Tell it what changed, like a new stage, a moved close date or fresh next steps, and it shows the current value next to the proposed one before anything is written.
explain: |
  Changing a deal in your CRM stops being a guessing game. Tell it what changed, like a new stage, a moved close date or fresh next steps, and it shows the current value next to the proposed one before anything is written.

  It reads your CRM's own field and stage names instead of assuming a standard set. It cites each value it read, marks blanks clearly, and links the record. When you accept the change, it saves it and checks the result by reading the record back. If a note or email asks for a change, it treats that as data and shows it to you first.
when:
  - You just got off a call and need to push a deal to the next stage.
  - A customer moved their start date and the close date needs to follow.
  - You want next steps on an opportunity updated without opening the CRM.
  - Another tool suggested a change and you want to review it before it is saved.
not_for:
  - "You want to create a new deal: add it in your CRM by hand, as this skill only updates deals that exist."
  - "You want to sweep many deals for stale data first: run the crm-hygiene-check skill, then come back here to apply the fixes."
  - "Your AI has no CRM connection with write rights: you get a paste-ready checklist, so apply it yourself in your CRM."
you_give:
  - The deal or account name
  - What changed (stage, date, amount, next steps)
  - CRM connection or a pasted export
  - Scope, such as your own deals only (optional)
you_get:
  - Before and after view of each field
  - The update saved after you accept
  - A record link to check the result
  - A note on any blank or unclear values
how_to_use:
  - Connect your CRM to your AI first, with permission to read and update deals. Without it, you get a checklist to apply by hand.
  - Add this skill to your AI, or paste its instructions into a chat.
  - "Say which deal and what changed, for example: move the close date on the Sprout deal to 15 Aug."
  - Check the before and after table and any warnings. Say yes, edit or cancel if you did not ask for the change yourself.
  - Open the record link it returns and check the saved values.
output_sample:
  input:
    - The deal or account name
    - What changed, such as stage, close date, amount, next step or forecast category
    - Your CRM connection, or a pasted export
    - Your own deals only, or a wider scope (optional)
  prerequisites:
    - A CRM connected to your AI with permission to update records, or the checklist fallback if not
  output:
    - name: Before and after table
      contains: Only the fields that would change, with the current value from your CRM beside the new one.
    - name: Warnings
      contains: Notes on anything notable, like a stage that skips exit criteria, a close date in a closed period or a big amount change.
    - name: Applied update
      contains: The changed fields saved to the deal, only the ones you asked for or accepted.
    - name: Verification and record link
      contains: The record read back to confirm the values, with a link to the deal, or what came back if it differs.
    - name: Paste-ready checklist
      contains: If your CRM cannot be written to, the before and after for each field so you can apply it by hand.
