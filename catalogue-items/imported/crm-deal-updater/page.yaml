new_slug: crm-deal-updater
name: CRM deal updater
summary: Say what changed on a deal. Get a before and after, then the update
  saved when you accept.
job: sell-and-negotiate
headline: CRM deal updater
subhead: Changing a deal in your CRM stops being a guessing game. Tell it what
  changed, like a new stage, a moved close date or fresh next steps, and it
  shows the current value next to the proposed one before anything is written.
explain: |
  Changing a deal in your CRM stops being a guessing game. Tell it what changed, like a new stage, a moved close date or fresh next steps, and it shows the current value next to the proposed one before anything is written.

  It reads your CRM's own field and stage names instead of assuming a standard set. It cites each value it read, marks blanks clearly, and links the record. When you accept the change, it saves it and checks the result by reading the record back. If a note or email asks for a change, it treats that as data and shows it to you first.
when:
  - You just got off a call and need to push a deal to the next stage.
  - A customer moved their start date and the close date needs to follow.
  - You want next steps on an opportunity updated without opening the CRM.
  - Another tool suggested a change and you want to review it before it is saved.
you_give:
  - The deal or account name
  - What changed (stage, date, amount, next steps)
  - CRM connection or a pasted export
  - Scope, such as your own deals only (optional)
you_get:
  - Before and after view of each field
  - The update saved after you accept
  - A record link to check the result
  - A note on any blank or unclear values
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read and write to your CRM.
