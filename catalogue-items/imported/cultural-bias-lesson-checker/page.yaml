thinking: medium
thinking_why: It must spot assumptions the writer cannot see.
new_slug: cultural-bias-lesson-checker
name: Cultural bias lesson checker
summary: Check a lesson for cultural bias before you teach it. Paste the task and say who it is for. You get hidden assumptions and ways to adapt it.
job: teach-and-train
headline: Cultural bias lesson checker
subhead: A lesson built in one country can quietly fail in another. Paste a task or teaching practice and say who will use it, and you get a check for cultural bias and hidden assumptions.
explain: |
  A lesson built in one country can quietly fail in another. Paste a task or teaching practice and say who will use it, and you get a check for cultural bias and hidden assumptions.

  It looks at what the task takes for granted: examples, values, ways of speaking up in class, views of the teacher's role and how success is judged. It compares those with the culture the task came from and the culture of your learners. Concerns you name get extra attention. You get a verdict on how well the task fits, plus changes that keep the learning goal while fitting your learners. It draws on work by Henrich, Heine and Norenzayan (2010), Tobin, Wu and Davidson (1989), Alexander (2001) and Stigler and Hiebert (1999).
when:
  - You are using a lesson from another country with your class.
  - A teaching method that worked elsewhere is not landing with your learners.
  - You want to review a resource before it goes into your curriculum.
  - A research finding is being treated as true for every classroom.
not_for:
  - You have already run this task well with this class. Trust what you know about your students instead.
  - You need a full new lesson built around your learners' culture. Ask a colleague who knows the community, or write it with them.
  - You want a check on spelling, facts or reading level. Use a plain proofreading step in your AI chat.
you_give:
  - The task, lesson or practice
  - Who it is for and where
  - Where it was first made (optional)
  - Year group and subject (optional)
  - Specific concerns (optional)
you_get:
  - A list of cultural assumptions in the task
  - How well it fits your learners
  - Adapted versions of weak parts
  - Questions to ask your students or colleagues
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code or paid tool is needed.
  - Paste your task or lesson in full.
  - Say who your learners are and where you teach. Add any worries you have, and where the task came from if you know.
  - This is an imported skill and was not tested in this catalogue. Its output is an unverified AI reading, not research.
  - Read the Honest Caveats section before you share any assumption with colleagues or parents.
  - Ask the AI to label which claims come from a named study and which are its own reading. Check the named studies yourself before you use a claim.
  - Read each assumption the AI lists. Talk it over with a colleague or with your students.
  - Pick one adapted version and try it with your class. Change the whole unit only after it works.
  - The cultural claims in the example are the AI's own reading. Check them against the cited studies and do not take them as findings. Ask the AI to say which claims come from a named study and which are its own inference.
  - Treat the regional examples as ideas to check. Your own students may be different. Cultural patterns describe tendencies across groups, not any one student.
  - Before you quote a finding to colleagues or parents, read the original study named in the result.
next: [overloaded-lesson-checker, culturally-responsive-lesson, classroom-belonging-planner]
output_sample:
  input:
    - The task, lesson or teaching practice, pasted in full
    - Who will use it, and where
    - Where the task was first made (optional)
    - Year group and subject (optional)
    - Any worries you have about cultural fit (optional)
  output:
    - name: Cultural Assumptions Identified
      contains: The things the task takes for granted, such as values, speaking up in class, the teacher's role and how success is judged.
    - name: Adaptation Suggestions
      contains: Changes to the weak parts that keep the learning goal and fit your learners better.
    - name: Alternative Approaches From Other Traditions
      contains: Other ways of teaching the same goal, drawn from different cultures and school traditions.
    - name: What Transfers Well
      contains: The parts of the task that should work fine for your learners as they are.
    - name: Honest Caveats
      contains: Limits of the check, and what you should confirm with your own students and colleagues.
