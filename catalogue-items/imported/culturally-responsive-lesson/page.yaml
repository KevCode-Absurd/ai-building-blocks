thinking: medium
thinking_why: It reworks a lesson around who is in the room.
new_slug: culturally-responsive-lesson
name: Culturally responsive lesson rewriter
summary: Paste a lesson and describe your learners. Get a rewrite that draws on their backgrounds, communities and lived experience.
job: teach-and-train
headline: Culturally responsive lesson rewriter
subhead: Paste a lesson and describe your learners. Get a rewrite that draws on their backgrounds, communities and lived experience.
explain: |
  A lesson that uses your students' own backgrounds is easier to care about and to remember. Paste a lesson and describe your learners, and you get a rewrite that draws on their communities and lived experience.

  It looks at the examples, texts and viewpoints in your current version, then swaps or adds ones your students will recognise. The learning goal stays the same. It can account for your school setting, how you teach now, and your own background and comfort with this approach. The method follows well-known work on culturally relevant and sustaining teaching.
when:
  - Your textbook examples do not match your students' lives.
  - You teach a mixed class and want content that includes everyone.
  - A required topic feels distant to your learners.
  - You want to move beyond a single point of view in a unit.
you_give:
  - The lesson or learning objective
  - Description of your students and community
  - Subject and year group (optional)
  - How you teach it now (optional)
  - School context (optional)
you_get:
  - A rewritten lesson with familiar examples
  - Added texts and viewpoints
  - Questions that connect to students' lives
  - Notes on what changed and why
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
