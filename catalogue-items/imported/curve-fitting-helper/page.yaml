thinking: medium
thinking_why: It tries several fit types and compares them.
new_slug: curve-fitting-helper
name: Curve fitting helper
summary: Fit a curve or surface to your x and y data, compare fit types, drop bad readings and get MATLAB code to repeat the curve fitting.
job: build-software
headline: Curve fitting helper
subhead: Finding the right curve for your data is slow when you try every model by hand. Give it x and y values and it guides you through fitting a curve or surface in MATLAB's Curve Fitter app, then hands back code to repeat the work.
explain: |
  Finding the right curve for your data is slow when you try every model by hand. Give it x and y values and it guides you through fitting a curve or surface in MATLAB's Curve Fitter app, then hands back code to repeat the work.

  You start by choosing data, then try fit types like regression, interpolation, smoothing and splines. It helps you read the plots and the numbers, exclude outliers by sight, and compare several fits in one session. When you are happy, you can export a figure, generate MATLAB code, save fits to the workspace or send a fit to a Simulink lookup table. It needs MATLAB and the Curve Fitting Toolbox.
when:
  - You have measured data and do not know which model fits it.
  - A few bad readings are pulling your fit off and need removing.
  - You want to compare a polynomial, a spline and a custom equation side by side.
  - You need a fitted curve as a Simulink lookup table.
not_for:
  - "You already know the fit type and want code only: write it yourself with fit(), fittype() and fitoptions() in MATLAB."
  - "You need a quick smooth or interpolation: use base MATLAB functions such as interp1, spline or smoothdata."
  - "You want statistical modeling or machine learning: use MATLAB's Statistics and Machine Learning Toolbox instead."
you_give:
  - Your x and y data, or x, y and z for a surface
  - MATLAB with the Curve Fitting Toolbox
  - A model idea or equation (optional)
  - A saved session file (optional)
you_get:
  - A fit with its numbers and plots
  - Outliers excluded with a reason
  - A comparison of fit types
  - Generated MATLAB code and exports
how_to_use:
  - Check that you have MATLAB with the Curve Fitting Toolbox. Your AI needs to be able to run MATLAB, or you follow its steps in the Curve Fitter app.
  - Open your AI and paste the skill text from this page, or add the skill file.
  - Paste your x and y data, or x, y and z for a surface. Add a model idea if you have one.
  - Ask it to try fit types and compare them. Tell it which readings look wrong so it can exclude them.
  - Read the numbers and plots it reports. Then ask for the MATLAB code, a figure or a Simulink lookup table.
output_sample:
  input:
    - Your x and y data, or x, y and z for a surface
    - A model idea or equation (optional)
    - A saved session file (optional)
  prerequisites:
    - MATLAB with the Curve Fitting Toolbox
    - An AI that can run MATLAB, or you run the steps in the Curve Fitter app yourself
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: Fit and formula
      contains: The chosen fit type, its formula, and the coefficients with their confidence intervals.
    - name: Goodness-of-fit numbers
      contains: SSE, R-square, adjusted R-square, RMSE and DFE, reported as numbers without a quality verdict.
    - name: Fit status
      contains: Whether the fit finished as Complete, Warning, Error or Incomplete, with any messages.
    - name: Plots
      contains: The fit plot, with residuals, contour and prediction bounds added when they apply.
    - name: Fit comparison
      contains: Several fits kept side by side in one session so you can compare their numbers.
    - name: Exports
      contains: A figure, generated MATLAB code, fits saved to the workspace, a Simulink lookup table or a saved session.
