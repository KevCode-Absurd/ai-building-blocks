thinking: medium
thinking_why: It fills a seven-part story frame from your answers.
new_slug: customer-as-hero-message-planner
name: Customer-as-hero message planner
summary: "Turn your brand details into a clear customer-as-hero message: a seven-part brand script, one-liner and elevator pitch, built on StoryBrand."
job: write-and-tell-stories
headline: Customer-as-hero message planner
subhead: Customers pick what they understand fastest. Describe your brand and this builds a clear message where your customer is the hero and you are the guide.
explain: |
  Customers pick what they understand fastest. Describe your brand and this builds a clear message where your customer is the hero and you are the guide. You end up with website copy, an elevator pitch and a one-liner.

  It uses the seven parts of the StoryBrand method: a character with one clear want, a problem, a guide, a plan, a call to action, and the stakes of success and failure. It names the problem at three levels: outer, inner and why it is wrong. It scores existing copy out of 10 against a quick check and tells you which changes would raise the score. The one-liner must pass a test: clear and repeatable after one hearing.
when:
  - Visitors land on your homepage and do not know what you do.
  - Your team describes the company five different ways.
  - You are writing a landing page or email sequence and need a clear spine.
  - You need a one-line answer to "what do you do?"
not_for:
  - "Your homepage already has tested copy that converts: keep it, and change one line at a time instead."
  - "Your copy makes legal, medical or financial claims: have a compliance reviewer or lawyer check it before you publish."
  - "You only want a memorable idea or slogan: ask a copywriter, or use a plain brainstorm with your AI."
you_give:
  - What you sell and who buys it
  - The problem your customer faces
  - Current homepage or pitch copy (optional)
  - Your proof, such as results or testimonials (optional)
you_get:
  - A score of your current copy out of 10, with fixes
  - A brand script in seven parts
  - A one-liner first, then an elevator pitch
  - Homepage and landing page copy
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the SKILL.md text. No code or paid tools are needed.
  - Gather first: what you sell, the customer role who buys it, the problem they face, your current homepage or pitch copy, and any proof you can check (results, reviews, case studies). If you have no proof you can check, say so and leave it out.
  - Tell your AI what you sell, who buys it and the problem your customer faces.
  - Add your current homepage or pitch copy and your proof if you have them. Say if you have none.
  - Read the score, then the brand script. Check that the customer is the hero and you are the guide.
  - Replace any placeholder such as [your real figure] with a true fact. Do not publish proof you cannot verify. If you have no proof, leave the proof line out and show a plain process instead.
  - Use the one-liner, pitch and website copy once you are happy with the script.
  - Next, put the one-liner and pitch on your homepage and in your profiles. Then use the skill's email sequence notes to plan your follow-up emails.
output_sample:
  input:
    - What you sell and who buys it
    - The problem your customer faces
    - Your current homepage or pitch copy (optional)
    - Your proof, such as results or testimonials (optional)
  output:
    - name: Current copy score
      contains: A score out of 10 for your existing copy, with the changes needed to reach 10.
    - name: Brand script
      contains: "Your message in seven parts: the customer, their problem, you as guide, a plan, a call to action, and the stakes."
    - name: Three levels of the problem
      contains: The outer problem, the inner feeling it causes, and why it is wrong.
    - name: One-liner
      contains: One sentence checked to be clear and easy to repeat after hearing it once.
    - name: Elevator pitch
      contains: A short spoken pitch built from the brand script.
    - name: Website copy
      contains: Homepage and landing page copy that follows the script.
