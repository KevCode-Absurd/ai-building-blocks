thinking: medium
thinking_why: It scores with set rules but needs sensible cutoffs.
new_slug: customer-churn-risk-scorer
name: Shopify customer loss risk scorer
summary: Run it on your Shopify orders. Get each repeat customer scored 0 to 100 for how overdue their next order is.
job: run-your-store
headline: Shopify customer loss risk scorer
subhead: Customers rarely announce they are leaving. They just stop buying. This reads your Shopify orders and scores every repeat customer from 0 to 100 for the risk of losing them, based on how overdue they are. It needs a signed-in Shopify command-line session with the listed read permissions.
explain: |
  A fixed rule like "no order in 90 days" treats every customer the same. Someone who buys every month is gone at 90 days. Someone who buys twice a year is not. This scorer uses each customer's own gap between orders.

  For every customer with at least two orders in your window, it works out their average gap. It then divides the days since their last order by that gap. A ratio of 1 means they are right on time. A ratio of 2 means twice as late as usual. The ratio becomes a score from 0 to 100 and a group: Active, Cooling, At Risk or Likely Churned.

  It reads data only and changes nothing. It shows past spend for the late customers, not a forecast of lost sales. It cannot score customers with one order.
when:
  - You want to know who to email for a win-back this week.
  - Repeat buyers have gone quiet and you cannot tell who matters most.
  - You sell something people reorder, and you want to catch lapses early.
  - You are choosing which customers to call before a sale.
not_for:
  - Most of your customers buy once. There is no rhythm to measure, so use the Shopify customer segment builder instead.
  - You sell subscriptions or software. Use the Customer cancellation risk finder, which reads usage, support and billing data.
  - You want to tag lapsed customers and export a list by a fixed number of days. Use the Lapsed customer finder.
you_give:
  - Your store address, such as mystore.myshopify.com
  - Read access to your orders and customers
  - How many days of orders to read (optional, 365 if you do not say)
  - The minimum orders and the At Risk cut-off (optional)
you_get:
  - A 0 to 100 churn score for each repeat customer
  - "A group for each: Active, Cooling, At Risk or Likely Churned"
  - Each customer's usual gap and days since last order
  - Past spend of the late customers
  - A CSV you can export
how_to_use:
  - Use an AI tool that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI. Give it the skill.
  - Sign in to your store with the Shopify CLI. Allow it to read orders and customers. The skill has the exact sign-in command.
  - Tell your AI your store address. Change the number of days only if your customers reorder less often than once a year.
  - Read the customers not scored. If most have one order, ask for a longer window.
  - Check three or four customers you know by hand. If their scores look wrong, change the At Risk cut-off and run it again.
  - No command tool? Export your orders from the Shopify admin and paste them in. The skill will still score them.
how_it_works:
  - title: Read your orders
    text: It pulls orders for the window you pick, page by page, and skips guest orders with no customer.
  - title: Work out each customer's gap
    text: The days between a customer's first and last order, divided by the orders minus one.
  - title: Compare with today
    text: Days since their last order, divided by their gap, gives the overdue ratio.
  - title: Score and group
    text: The ratio becomes a score of 0 to 100. The groups are Active, Cooling, At Risk and Likely Churned.
  - title: Add contact details
    text: For the late groups only, it fetches email and tags so you can act on the list.
  - title: Report with limits
    text: It shows past spend, counts customers it could not score, and warns if the window is too short.
output_shape: |
  CHURN RISK REPORT (<days> days)
  Repeat customers scored: <n>   Not scored: <n>
  Active / Cooling / At Risk / Likely Churned: <count and percent each>
  Spend in window of late customers: <amount>
  Top late customers by spend: <name, email, score, last order, spend>
  CSV: <customer, orders, spend, average gap, days since last order, ratio, score, group>
output_sample:
  input:
    - Your store address
    - Read access to orders and customers
    - How many days of orders to read (optional)
    - Minimum orders and the At Risk cut-off (optional)
  prerequisites:
    - An AI tool that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI
    - Shopify CLI signed in with permission to read orders and customers
    - Customers who buy more than once
  output:
    - name: Churn risk report
      contains: Counts and percentages for each group, and how many customers could not be scored.
    - name: Spend of late customers
      contains: What At Risk and Likely Churned customers spent in the window. Past spend, not a forecast.
    - name: Top late customers
      contains: The highest spenders in the late groups, with score, last order date and email.
    - name: churn_risk CSV
      contains: One row per customer with orders, spend, usual gap, days since last order, ratio, score and group.
works_best_with:
  tools:
    - name: Claude Code, Cursor, Codex or Gemini CLI
      why: They can run Shopify CLI on your machine to read your orders for you.
  inputs:
    - A window at least twice as long as your customers' usual gap between orders.
    - Your own list of best customers, to check that the scores look right.
terms:
  - term: Overdue ratio
    meaning: Days since last order, divided by the customer's usual gap. 2 means twice as late.
  - term: Churn
    meaning: When a customer stops buying from you.
  - term: Guest order
    meaning: An order placed without a customer account, so it cannot be linked to a person.
