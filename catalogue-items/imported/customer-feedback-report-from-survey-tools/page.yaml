thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: customer-feedback-report-from-survey-tools
name: Customer feedback report from survey tools
summary: Turn survey comments into a customer feedback report with themes, counts, quotes and next steps. Works with Delighted, GatherUp, Gleap or Simplesat.
job: help-customers
headline: Customer feedback report from survey tools
subhead: Connect Delighted, GatherUp, Gleap, or Simplesat and choose a date range. It gathers recent feedback and groups the comments by topic. You get repeated problems, feature requests, praise, and suggested actions with counts and sample quotes.
when:
  - You review customer feedback each week or month and want themes, not a pile of comments.
  - You use at least one of Delighted, GatherUp, Gleap or Simplesat.
  - A product or support lead asks what customers complain about most.
  - You need quotes and counts for a team meeting or a product plan.
not_for:
  - "You have one comment to answer: reply to it yourself, or ask your AI to draft a reply."
  - "You want to sort raw support tickets: use your help desk tool, which tracks each ticket."
  - "You use none of Delighted, GatherUp, Gleap or Simplesat: paste your comments into your AI and ask for themes by hand."
you_give:
  - A date range, such as the last 7 to 30 days.
  - At least one linked account from Delighted, GatherUp, Gleap or Simplesat.
you_get:
  - A count of feedback items and the share that is positive, neutral and negative.
  - A table of top themes with counts and example quotes.
  - A list of urgent issues and ranked feature requests.
  - Positive quotes you can share with your team.
  - Suggested product, process and help content changes.
how_it_works:
  - title: Gather recent feedback
    text: Read feedback from the connected services for the chosen dates.
  - title: Group common themes
    text: Sort comments into problems, usability, pricing, support, praise, and feature requests.
  - title: Write the report
    text: Show theme counts, sample quotes, urgent concerns, and proposed product or help content changes.
works_best_with:
  tools:
    - name: Delighted, GatherUp, Gleap, or Simplesat
      why: Live lookups need Composio CLI access and connected accounts for these services.
how_to_use:
  - Add the downloaded folder to an AI that can read skill files and run commands.
  - Install Composio CLI and link your accounts. Your AI will ask you to link any that are missing.
  - Ask your AI to run the Customer feedback report from survey tools and give it a date range.
  - Check the theme counts and quotes against a few raw comments.
  - Copy the Recommendations into your product backlog or team notes. The skill sends nothing and changes no accounts.
output_sample:
  input:
    - A date range, such as the last 7 to 30 days
    - "At least one connected account: Delighted, GatherUp, Gleap or Simplesat"
  prerequisites:
    - An AI that can run commands, with Composio CLI installed
    - Your survey accounts linked in Composio
  output:
    - name: Header
      contains: The period, the sources pulled from and the total number of feedback items.
    - name: Overall Sentiment
      contains: The share of positive, neutral and negative feedback, plus NPS and CSAT scores when the tools give them.
    - name: Top Themes
      contains: A table of themes with count, sentiment, trend and one example quote each.
    - name: Critical Issues
      contains: Feedback that needs quick attention, with counts and why it is serious.
    - name: Feature Requests
      contains: Requests ranked by how often they come up, each with a sample quote.
    - name: Wins
      contains: Positive quotes worth sharing, each with its source.
    - name: Recommendations
      contains: Product changes, process fixes and help content gaps that follow from the top themes.
