thinking: low
thinking_why: It repeats one fixed step.
new_slug: customer-note-bulk-adder
name: Customer note bulk adder
summary: Add the same note to many Shopify customer records at once. Preview the list first, then add the note to each match. This changes live data.
job: run-your-store
headline: Customer note bulk adder
subhead: Adding the same note to fifty customer records by hand is slow and easy to get wrong. Give it a customer filter and a note and it adds the note to every matching Shopify customer in one go.
explain: |
  Adding the same note to fifty customer records by hand is slow and easy to get wrong. Give it a customer filter and a note and it adds the note to every matching Shopify customer in one go.

  You choose the filter, such as a tag or a minimum spend. It runs a dry run first by default, listing who would be changed so you can check the list. The note is added above the existing note, with a date at the start, unless you choose to replace it, which wipes the old text. Notes are for staff only and customers never see them. This changes live customer data and needs Shopify write access. The log file lists customer names and emails, so keep it private. This is 40rty AI's customer-ops skill, shared under the MIT licence.
when:
  - You finished a campaign and want to flag everyone who received it.
  - You imported customers and want to record where they came from.
  - You want a VIP note on every customer above a spend level.
  - Support needs context added to a group of accounts.
not_for:
  - "You want to remove or overwrite notes across many customers: keep append on, or edit those records by hand in Shopify admin."
  - "You only want to group customers: add a customer tag in Shopify admin instead, because tags are built for segments."
  - "You do not have write access to the store: ask the store owner to run it or to give you access first."
you_give:
  - Your Shopify store with write access
  - A filter such as a tag or spend level
  - The note text
  - Append or replace choice (optional)
you_get:
  - A preview list of matching customers
  - The note added to each record
  - A time stamp on each note
  - A result report with any failures
how_to_use:
  - Use an AI that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot change your store.
  - "Sign in first with the Shopify CLI, for example: shopify store auth --store your-store.myshopify.com --scopes read_customers,write_customers. If your CLI version does not know that command, check the Shopify CLI docs for the current sign-in. Ask for customer read and write access."
  - Customer names and emails are protected customer data. If your AI gets no emails or a refusal, ask the store owner to approve protected customer data access in Shopify's app settings.
  - Try it on a development or test store first if you have one.
  - "Give your AI the SKILL.md file and say: follow this skill. Add your store, your filter, such as tag:vip, and your note, such as 2026-04-11: VIP spend tier."
  - Test on a small filter first, such as one tag with a handful of customers, before you run a broad spend filter.
  - Leave dry run on for the first pass. Check the list of matching customers and the notes they would get.
  - Run it again with dry run off. Keep append on unless you mean to wipe old notes.
  - Open the annotation log CSV and check the results and any errors. Save it with the campaign record, and use the same filter later to check the notes are in place.
output_sample:
  input:
    - Your store address, such as mystore.myshopify.com
    - A customer filter, such as a tag or a minimum spend
    - The note text to add
    - Append or replace choice (optional)
    - Dry run on or off (optional)
  prerequisites:
    - An AI that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI
    - Shopify CLI signed in to your store with customer read and write access
  output:
    - name: Dry-run preview
      contains: The customers that match your filter and the note each one would get, with nothing changed yet.
    - name: Start banner and step lines
      contains: The store name, start time, and one line per step showing the settings used and the result.
    - name: Outcome summary
      contains: How many customers matched, how many notes were updated, and how many errors came up.
    - name: annotation_log CSV
      contains: One row per customer with ID, name, email, the old note and the new note.
