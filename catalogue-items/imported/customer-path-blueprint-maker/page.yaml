thinking: medium
thinking_why: It follows a set map format but needs judgment on where the friction sits.
new_slug: customer-path-blueprint-maker
name: Customer path blueprint maker
summary: Describe your customer and their goal. Get a map of each step with
  touchpoints, feelings, friction and the systems behind it.
job: understand-customers
headline: Customer path blueprint maker
subhead: Teams often disagree about what the customer experience is. Describe
  your customer and their goal and you get a step-by-step map plus a service
  blueprint showing what happens behind the scenes at each step.
explain: |
  Teams often disagree about what the customer experience is. Describe your customer and their goal and you get a step-by-step map plus a service blueprint showing what happens behind the scenes at each step.

  For each stage it lists the touchpoints, what the customer does, what they feel, and where friction or drop-off happens. The blueprint adds the staff actions, handoffs and systems out of the customer's sight, so you can see where a poor experience starts. It works best with one map per customer type, real research, and input from support, operations and engineering. It ends with the biggest gaps and opportunities.
when:
  - Sales, support and product each describe the customer experience differently.
  - Customers drop off and you do not know at which step.
  - You are designing a new service and need the whole picture.
  - You want a shared view for a planning session.
you_give:
  - The customer type and their goal
  - Existing research, tickets or analytics
  - What each team does at each step (optional)
you_get:
  - A stage by stage map with touchpoints and emotions
  - Friction and drop-off points
  - A service blueprint with behind-the-scenes steps
  - Ranked opportunities
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
not_for:
  - You want a quick seven-stage map with no behind-the-scenes layer. Use the Customer path mapper.
  - You want to map your own staff's experience, like onboarding or exit. Use the Employee experience map builder.
  - You want to see what your best customers did before they bought. Use the Buying path rebuilder.
output_sample:
  input:
    - The customer type you want to map, and what they want to achieve
    - Research on that customer, such as interviews, tickets, survey results or analytics
    - Notes on what each team does at each step (optional)
  prerequisites:
    - One customer type per map, not all customers at once
    - Someone from support, operations or engineering to check the behind-the-scenes steps
  output:
    - name: Path map
      contains: Each phase and step with its touchpoint, goal, thoughts, emotion, pain points and opportunities.
    - name: Service blueprint additions
      contains: For each phase, what staff do in view, what happens out of view and which systems are involved.
    - name: Critical friction
      contains: The moments where the experience keeps failing, each with the evidence behind it.
    - name: Quick wins and strategic bets
      contains: Low-effort fixes and bigger changes, each with effort and impact.
    - name: Cross-team disconnects
      contains: Places where what customers see and what happens behind the scenes do not match.
