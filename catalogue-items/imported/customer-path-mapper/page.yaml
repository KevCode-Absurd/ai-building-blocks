thinking: low
thinking_why: It fills a standard journey layout from your description.
new_slug: customer-path-mapper
name: Customer path mapper
summary: Describe your product and customer. Get a stage by stage map with
  feelings, pain points and fixes.
job: understand-customers
headline: Customer path mapper
subhead: See your product through the buyer's eyes, from first hearing about it
  to telling a friend. Describe your product and customer and you get a stage by
  stage map with what they feel, where they get stuck and what to fix.
explain: |
  See your product through the buyer's eyes, from first hearing about it to telling a friend. Describe your product and customer and you get a stage by stage map with what they feel, where they get stuck and what to fix.

  It begins with one specific buyer and the job they want done. Then it walks seven stages: awareness, consideration, acquisition, onboarding, engagement, retention and advocacy. For each stage it lists touchpoints, actions, thoughts, emotions, pain points and improvement ideas. If you give it interviews, survey results, analytics or support tickets, it reads those first. You can also give a website link so it understands the product.
when:
  - You want to find where new customers get frustrated.
  - You are improving onboarding and need to see the whole experience.
  - You need a map for a team workshop.
  - You want to know what makes customers recommend you.
you_give:
  - Your product and target customer
  - Interviews, surveys or tickets (optional)
  - A website link (optional)
you_get:
  - A map of seven stages
  - Touchpoints, thoughts and emotions per stage
  - Pain points
  - Improvement ideas for each stage
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
not_for:
  - You also need the staff actions and systems behind each step. Use the Customer path blueprint maker.
  - You want separate cart and email flows for new, returning and loyal buyers. Use the Customer stage flow mapper.
  - You already have interview notes and want the patterns in them. Use the Customer interview synthesizer.
output_sample:
  input:
    - Your product and the one customer you want to map
    - Interview notes, survey results, analytics or support tickets (optional)
    - A link to your website (optional)
  prerequisites:
    - An AI that can open web links, if you give a website link
  output:
    - name: Persona
      contains: One specific buyer and the job they want done.
    - name: Path stages
      contains: Seven stages from awareness to advocacy, each with touchpoints, actions, thoughts, emotions, pain points and opportunities.
    - name: Critical moments
      contains: The first moment of real value, the points where buyers commit or leave, and the main reasons they quit.
    - name: Path map table
      contains: One table with stage, touchpoint, action, emotion, pain point and opportunity.
    - name: Prioritised improvements
      contains: The pain points that matter most, quick wins and bigger investments.
