thinking: medium
thinking_why: The tone has to fit the person and the news.
new_slug: customer-reply-drafter
name: Customer reply drafter
summary: Draft a customer reply in the right tone for a hard message. Describe the situation and get the draft plus notes on what to check before you send.
job: help-customers
headline: Customer reply drafter
subhead: A hard customer message is easier to answer when the draft is done and the checks are listed. Describe the situation and you get a reply in the right tone, plus notes on what to check before you send it.
explain: |
  A hard customer message is easier to answer when the draft is done and the checks are listed. Describe the situation and you get a reply in the right tone, plus notes on what to check before you send it.

  It reads the context: who the customer is, the kind of situation (question, outage, bad news, declined request, billing error), how urgent it is, the channel and how senior the reader is. If tools are connected it looks up account background. Then it drafts for that audience, with the news placed where it should go and the next step clear. The notes flag facts to verify, promises to avoid and anything to run past a colleague.
when:
  - A customer is angry about a delay and you need the right words.
  - You must say no to a feature request without losing the account.
  - An outage hit a key customer and they want updates.
  - A billing error needs a quick, calm fix.
not_for:
  - "You face a legal dispute or a threat to sue: take it to your legal team before you reply."
  - "The customer wants a refund or a policy exception: ask a manager to approve it first, then write the reply."
  - "You only need a one-line thank you: write it yourself, it will be faster."
you_give:
  - A description of the situation
  - The customer's name and history (optional)
  - Channel, such as email, chat or ticket (optional)
  - Facts you can share (optional)
you_get:
  - A draft reply in a fitting tone
  - Notes on what to verify
  - Points to avoid promising
  - An alternative shorter version
how_to_use:
  - Add the skill to Claude, ChatGPT or Gemini, or copy the full skill file and paste it into a new chat.
  - Take out card or account numbers and full names before you paste anything, and check your company's rules on sharing customer data with an AI tool.
  - Describe the situation in a few lines. Say who the customer is, what happened and how urgent it is.
  - Add the channel and any facts you can share. Add past messages if you have them.
  - Read the draft and the internal notes. Check each fact before you send.
  - Ask for a shorter or warmer version if you need one.
  - If your AI is linked to your email, chat, CRM or help desk, it can look up past messages itself. If not, paste what you know.
output_sample:
  input:
    - A short description of the customer situation
    - The customer's name and history (optional)
    - The channel, such as email, chat or ticket (optional)
    - Facts you are allowed to share (optional)
  prerequisites:
    - "Optional: an AI that can read your email, chat, CRM or help desk, so it can look up past messages and account details"
  output:
    - name: Draft Response
      contains: The reply to the customer, in a tone that fits the situation, the channel and the reader.
    - name: Notes for You (internal, do not send)
      contains: Facts to verify, promises to avoid and anything to run past a colleague before you send.
    - name: Quality checks
      contains: A last pass on the draft for tone, clarity, a clear next step and no risky promises.
    - name: Shorter version
      contains: A shorter version of the same reply, offered after the first draft.
