thinking: medium
thinking_why: It merges sources and rewrites to fit the job.
new_slug: cv-writer
name: CV writer
summary: Turn your LinkedIn, old CVs and a job post into a CV tailored to that job, ready to paste, with a report on what could trip applicant filters.
job: work-with-files
headline: CV writer
subhead: A CV you can paste straight into FlowCV, Canva, Google Docs or Word, aimed at one specific job post. It comes with a report of anything that could trip up applicant tracking filters.
explain: |
  A CV you can paste straight into FlowCV, Canva, Google Docs or Word, aimed at one specific job post. It comes with a report of anything that could trip up applicant tracking filters.

  You share your background from LinkedIn, GitHub, a portfolio or old CVs. The skill merges them, then matches your wording to the job description. It adapts tone to your seniority and rewrites stiff lines so they sound like a person. It never invents titles, dates, degrees or numbers. If you say you grew sales a lot, it asks for the real figure. A checklist shows what is missing, and any rewording is flagged so you can approve it.
when:
  - You are applying for a job and need your CV tailored to its posting.
  - Your CV lives in three places and needs to become one clean version.
  - You are changing careers and need your past work reframed.
  - You want to know why your CV keeps getting auto-rejected.
not_for:
  - "You need a cover letter: write it by hand or ask your AI for one in a separate chat, since this skill only makes the CV."
  - "The job needs a portfolio or a formal application form: build the portfolio yourself or fill in the form by hand."
  - "You want to add skills or jobs you do not have: this skill will not invent them, so gain the experience first."
you_give:
  - Your background, CV or profile links
  - The job description
  - Target format such as Canva or Word (optional)
  - Real figures for your results (optional)
you_get:
  - Paste-ready CV text
  - Applicant filter flaw report
  - Missing information checklist
  - Notes on any reworded lines
how_to_use:
  - "Gather your background in one place: LinkedIn text, old CVs, and links to your GitHub or portfolio. Paste the text if your AI cannot open links."
  - Open a chat in Claude, ChatGPT or Gemini and paste in the skill instructions. Then add your background.
  - Paste the job post and say which tool you will use, such as FlowCV, Canva, Google Docs or Word.
  - Answer the questions about real figures. If you do not know a number, say so. The skill will not make one up.
  - Check the change notes and the flaw report. Approve or undo each reworded line.
  - Paste the final CV into your chosen tool. Next, write a cover letter for the same job post in a separate chat.
output_sample:
  input:
    - "Your background: LinkedIn text, GitHub or portfolio links, or old CVs"
    - The job post you are applying for
    - The tool you will paste into, such as FlowCV, Canva, Google Docs or Word (optional)
    - Real figures for your results, such as sales growth (optional)
  prerequisites:
    - An AI chat that can read pasted text or uploaded files
    - Web access if you want it to read links (otherwise paste the text)
  output:
    - name: Paste-ready CV
      contains: Plain text CV in the layout of your chosen tool, matched to the wording of the job post.
    - name: ATS flaw report
      contains: Anything in the CV that could trip up applicant tracking filters, with a fix for each.
    - name: Missing-info checklist
      contains: Details the skill needs from you, such as real figures, dates or titles it could not find.
    - name: Change notes
      contains: Every line that was materially reworded, so you can approve or undo it.
