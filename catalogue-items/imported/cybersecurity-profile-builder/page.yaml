new_slug: cybersecurity-profile-builder
name: NIST cybersecurity profile builder
summary: Say how you handle security now and your goals. Get a profile against the NIST framework (a US security standard), with gaps and steps.
job: secure-code
headline: NIST cybersecurity profile builder
subhead: Share what you do now, where you want to be and the proof you have. It maps them to version 2.0 of the NIST Cybersecurity Framework (a US security standard) and compares the two. You get a list of gaps and what to do first. Missing proof stays unknown. This is not a certification.
explain: |
  A written picture of where your security stands now, where you want it to be, and the steps between. It follows the NIST Cybersecurity Framework, a widely used framework from NIST.

  You describe your current setup and goals. The skill works through the six areas of the framework: Govern, Identify, Protect, Detect, Respond and Recover. It builds a current profile and a target profile, then lists gaps by area with a priority for each. It rates your implementation tier (a measure of how your risk practices are set up, not a maturity score) and turns the gaps into an action plan sorted by effort and impact. It can also map controls to ISO 27001 or CIS Controls. It assumes the 2.0 version unless you ask for the older one.

  Control mappings to ISO 27001, CIS Controls and NIST SP 800-53 are approximate. Check them against the NIST, ISO and CIS sources before you use them.

  The result is guidance, not an audit or legal advice. It cannot see your systems, so every rating comes from what you tell it. Have a qualified security professional check it before you rely on it for a regulator, insurer or contract. This is Hemant Naik's NIST CSF skill, shared under the MIT licence.
when:
  - A client or insurer asks how your security lines up with NIST.
  - You need a plan to improve security but do not know where to begin.
  - You are preparing for an audit and need a gap list.
  - You want your controls mapped to another standard such as ISO 27001.
not_for:
  - "You need proof for an insurer or regulator: hire a qualified assessor, because this gives guidance and is not an audit."
  - "You want ISO 27001 or CIS certification work: use a certification specialist, since this only maps controls and does not certify."
  - "You want to write one policy document with no gap review: ask a security consultant or write it by hand."
you_give:
  - A description of your security today
  - Your goals or target level
  - Framework version (optional)
  - Standards to map to (optional)
you_get:
  - Current and target profile
  - Gap table with priorities
  - Implementation tier rating
  - Step by step action plan
how_to_use:
  - "Gather what you have first: current security policies, a list of your systems and data, and any recent incident or audit findings."
  - "Open Claude, ChatGPT or Gemini and paste in the skill text. No code, web access or paid tool is needed. The skill also relies on three reference files in its folder: the CSF 2.0 categories, the 1.1 to 2.0 mapping and the implementation tiers. Paste them in too, or upload the folder."
  - Do not paste passwords, IP addresses, client data or unredacted incident reports into a consumer AI tool. Describe them in general terms instead.
  - Describe your security today and your goals in a few lines. Add your industry and size, and say if you want CSF 2.0 or 1.1.
  - Start with one area, such as Govern, then do the rest one area at a time. A first pass of one area is usually a short chat. All six areas take several rounds of answering questions.
  - Check the gap table. Fix any row that does not match what you really do.
  - Ask for the action plan, and for a mapping to ISO 27001 or CIS Controls if you need one.
  - Share the gap table with whoever owns security in your business, and agree the first three actions.
  - Use the plan to write your policies. Ask your AI to draft a policy for each area, such as access control or incident response.
next: [incident-runbook-writer, security-incident-triager]
output_sample:
  input:
    - A short description of your security today
    - Your goals or target level
    - Your industry and company size
    - Framework version, CSF 2.0 or 1.1 (optional)
    - Standards to map to, such as ISO 27001 or CIS Controls (optional)
  output:
    - name: Current Profile
      contains: A table of each subcategory with its current state, rated from not implemented to fully implemented.
    - name: Target Profile
      contains: The state you want for each subcategory, based on your goals, risk appetite and any legal duties.
    - name: Gap assessment table
      contains: Function, category, subcategory, current and target state, gap and a High, Medium or Low priority.
    - name: Tier assessment
      contains: A tier rating from 1 to 4 for each dimension, with the reason for each rating.
    - name: Implementation roadmap
      contains: Actions with owner, effort, risk reduction and timeline, grouped into quick wins and longer steps.
    - name: Control mapping (optional)
      contains: Your CSF subcategories matched to NIST SP 800-53, ISO 27001 or CIS Controls.
