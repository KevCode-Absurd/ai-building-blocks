thinking: low
thinking_why: It groups orders by age.
new_slug: daily-fulfillment-digest-writer
name: Daily fulfillment digest writer
summary: Get a daily list of your open Shopify orders grouped by age, with held orders flagged, so you can see which orders are late.
job: run-your-store
headline: Daily fulfillment digest writer
subhead: Each morning you see every unshipped order sorted by how long it has waited, with stuck ones called out. No more scrolling the Orders page to find what is going late.
explain: |
  Each morning you see every unshipped order sorted by how long it has waited, with stuck ones called out. No more scrolling the Orders page to find what is going late.

  The skill pulls all unfulfilled and partly fulfilled orders from Shopify, oldest first. It sorts them into age groups, by default up to 1 day, 1 to 3 days, 3 to 7 days and over 7 days, and you can change those cut points. For each order it checks whether the shipment is on hold and lists those in their own section. It only reads data and changes nothing, so it is safe to run daily. Your AI needs access to your Shopify store.
when:
  - You start your day wanting to know which orders are overdue.
  - A customer asks where their order is and you need to spot delays fast.
  - You run a small team and need a morning list of what to ship first.
  - You want to catch held orders before customers complain.
not_for:
  - "You need to place or release a hold on an order: use the Order hold manager skill."
  - "You have no way to give your AI access to your Shopify admin: check orders by hand on the Orders page."
  - "You want to track orders that already shipped: use the shipping and carrier tracking in your Shopify admin."
you_give:
  - Your store address
  - Age cut points in days (optional)
  - Whether to include held orders (optional)
you_get:
  - Open orders grouped by age
  - Held orders section
  - Oldest orders listed first
  - Counts per age group
how_to_use:
  - Use an AI tool that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot reach your store.
  - Sign in to your store with the Shopify CLI first. Your sign-in needs permission to read orders.
  - Give your AI the skill and your store address. Add your own age cut points if you want them (optional).
  - Read the age table first. Start with the oldest group.
  - Check the held orders list. Then fix those orders in Shopify, or use the Order hold manager skill.
next: [order-hold-manager]
output_sample:
  input:
    - Your store address
    - Age cut points in days (optional)
    - Whether to show held orders (optional)
  prerequisites:
    - An AI tool that can run commands and is signed in to your Shopify store
    - Permission to read orders on your store
  output:
    - name: Start banner
      contains: The store address and the time the digest began.
    - name: Step log
      contains: One line per step showing what was asked and how many results came back.
    - name: Fulfillment Age Digest
      contains: A table of order counts for each age group, with the oldest order in each group.
    - name: Orders On Hold
      contains: A table of held orders with their hold status, shown only when you ask for holds.
    - name: Outcome summary
      contains: Total open orders, counts per age group, number on hold and number of errors.
