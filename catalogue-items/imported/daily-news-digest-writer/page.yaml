thinking: medium
thinking_why: It gathers pages, then picks the items worth your time.
new_slug: daily-news-digest-writer
name: Daily news digest writer
summary: Give it the news sites you follow. Get one daily Markdown digest of the best 20 items, with short summaries and links. It reads web pages.
job: think-and-decide
headline: Daily news digest writer
subhead: List the sites you follow and the topics you want. It fetches each one, scores the items, drops repeats and weak ones, and writes one daily report with a short summary and link for each item.
explain: |
  Checking ten sites every morning takes time, and most of what you read is not worth it. This daily news digest writer reads the sites you choose and hands you one Markdown report with the best 20 or so items. Each item has a short summary, three key points and a link.

  You rank your sources by how much you trust them. A main agent fetches the most trusted ones first. Helper agents read the pages and score each item. If there are not enough good items, it moves to the next group of sites. A cache remembers what it has reported, so you do not see the same story twice.

  It fetches pages from other websites. Before each run it checks that you approved the site, skips login and paywalled pages, and does not work around blocks. It uses more time and AI usage than most skills, so start with a short list.
when:
  - You follow ten tech or industry sites and want one morning summary.
  - Your team needs a daily reading list on a niche topic.
  - You want to watch competitors' blogs without opening each one.
  - You want a fresh digest that leaves out what you already read.
not_for:
  - A site's rules forbid automated reading, or the pages need a login or payment. Read those yourself, or use the site's own email digest.
  - You want a digest of your own emails, chats and meetings. Use the Activity digest writer.
  - You want one deep report on a single topic with sources checked. Use the Cited research report writer.
  - You only need a list of links. Your own RSS reader does that for free.
you_give:
  - The site addresses you follow, ranked by how much you trust them
  - Topics to keep and topics to leave out (optional)
  - How many items you want, 20 by default (optional)
  - Permission to fetch each site, after you check its rules
you_get:
  - A daily Markdown report of the best items, ranked by score
  - A summary, three key points, keywords and a link for each item
  - A note on sources that were skipped or blocked
  - A cache file so repeats stay out
how_to_use:
  - Check each site's terms and robots.txt, and drop any that forbid automated reading. Choose sites with open pages and feeds.
  - Open an AI that can fetch web pages. Claude Code or a similar tool can also run helper agents. In a plain chat, paste article links or text instead.
  - Paste the skill and your list of sites, ranked as tier 1, 2 and 3. Add your topics.
  - Run it once on three or four sites. Read the report and check that every link opens and the summary matches the page.
  - Tell it which items were weak and which sources to drop, then run the full list.
  - To get it daily, run it on a timer in a tool that can do that. A plain chat will not run on its own.
how_it_works:
  - title: Set up
    text: It reads your sources and the cache, and checks each site against the rules you approved.
  - title: Fetch in waves
    text: Tier 1 sites first. It adds tier 2, then sites needing a browser, only if it needs more items.
  - title: Score each item
    text: Helpers return a summary, key points and a quality score from 1 to 5 for each item.
  - title: Clean and rank
    text: It removes repeats and anything reported before, then keeps the top items by score and trust.
  - title: Write the report
    text: It saves one Markdown file per day, with notes on anything skipped.
  - title: Update the cache
    text: It records the links it used, so tomorrow's digest has new items.
output_shape: |
  Daily News Report (<date>)
  Curated from <N> sources, containing <M> items
  Notes: <skipped sources and why>

  1. <title>
  Summary: <2 to 4 lines>
  Key points: <three points>
  Source: <link>
  Keywords: <keywords>
  Score: <1 to 5>

  <repeated for each item>
output_sample:
  input:
    - The site addresses you follow, ranked by trust
    - Topics to keep and leave out (optional)
    - How many items you want (optional)
  prerequisites:
    - An AI that can fetch web pages, or article text you paste in
    - Permission to read each site, after checking its terms and robots.txt
    - A browser tool and helper agents (optional, for JavaScript sites and speed)
  output:
    - name: YYYY-MM-DD-news-report.md
      contains: The daily digest with a ranked list of items, each with summary, key points and link.
    - name: Report notes
      contains: Sources that were skipped, blocked or not fetched, with the reason for each.
    - name: cache.json
      contains: Links and fingerprints of reported items, so repeats stay out of the next digest.
    - name: sources.json
      contains: Your sources by tier, with any that were switched off and why.
works_best_with:
  tools:
    - name: Claude Code
      why: It can run helper agents in parallel, connect a browser tool and run on a timer.
    - name: Any chat AI with web access
      why: Works in serial mode, one site at a time, for a short list.
  inputs:
    - A list of sites that offer RSS feeds
    - A one line description of who reads the digest
terms:
  - term: Helper agent
    meaning: A smaller AI worker that does one job, such as reading a few web pages, and reports back.
  - term: robots.txt
    meaning: A file on a website that says which pages automated tools may read.
  - term: Headless browser
    meaning: A browser with no window, used to read pages that only show their content after scripts run.
