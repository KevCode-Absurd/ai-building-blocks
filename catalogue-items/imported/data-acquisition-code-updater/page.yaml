thinking: medium
thinking_why: Each old call maps to a new pattern.
new_slug: data-acquisition-code-updater
name: Data acquisition code updater
summary: Update old MATLAB data acquisition code to the current DataAcquisition interface. Paste your script and get a ported version with a list of changes.
job: build-software
headline: Data acquisition code updater
subhead: Give it old session-based data acquisition code. You get it ported to the current interface, with a table of every changed call.
explain: |
  Old MATLAB scripts that talk to measurement hardware get ported to the current DataAcquisition interface, so they stop breaking on new releases. Error messages about missing wait or Data fields usually point to this exact problem.

  The skill swaps the old session calls for their modern equivalents: daq("ni") for createSession, addinput for channel adds, ScansAvailableFcn for the data listener, and preload plus write for queued output. It works in a fixed order and checks after each step, because failures here are often silent. It also covers new scripts that mix triggers, callbacks and continuous capture. It is built around National Instruments hardware. Simple one channel captures do not need it.

  MathWorks' terms limit use of this skill, including changes, to MathWorks products and services. Read the included LICENSE.md and the MathWorks reuse licence (PMRL) linked in the skill header. These are product-use terms, rather than the standard BSD 2-Clause licence alone. Keep the MathWorks notices.
when:
  - Your lab script worked years ago and now errors on a new MATLAB release.
  - You see an error that wait is undefined for a DataAcquisition object.
  - You need to replace DataAvailable listeners with the new callbacks.
  - You are writing a new script with triggers and continuous streaming.
not_for:
  - Your script only reads one channel once. Rewrite the few lines by hand using the MATLAB documentation.
  - Your hardware is not from National Instruments. Check the maker's own MATLAB support pages first.
  - Your script does not use Data Acquisition Toolbox. Ask a MATLAB developer or your AI for general help instead.
  - You do not use MATLAB. The licence allows use only with MathWorks products.
you_give:
  - Your old MATLAB script
  - The MATLAB release you use (optional)
  - Your hardware details (optional)
  - The error message (optional)
you_get:
  - Ported script on the modern interface
  - A table of changed calls, with the old call, the new call and the line
  - Fixes for callback and output queue code
  - Checks to confirm it still works
how_to_use:
  - Add the skill to your AI with the buttons on this page, or paste the full skill file into a chat. To run the checks you need MATLAB with Data Acquisition Toolbox and an NI device. With only the old script, you still get the ported code and the change table.
  - Paste your old MATLAB script. Add your MATLAB release, hardware and error message if you have them.
  - Read the table of changed calls first. Check each one makes sense for your hardware.
  - If your AI can run MATLAB with Data Acquisition Toolbox, ask it to run the checks. If not, run them yourself.
  - Before any live test, check what your script writes to. Analog and digital outputs can drive connected equipment. Check the wiring and voltage limits, and try it on a safe load or with the equipment disconnected.
  - Run a short live test on your hardware before you start a full-length run.
  - Compare its output with a run of the old script before you trust a full-length acquisition.
next: [matlab-test-runner, matlab-code-reviewer]
output_sample:
  input:
    - Your old MATLAB data acquisition script
    - The MATLAB release you use (optional)
    - Your hardware details (optional)
    - The error message you see (optional)
  prerequisites:
    - MATLAB with Data Acquisition Toolbox, if you want your AI to run the checks
  output:
    - name: Ported script
      contains: Your code rewritten with the current DataAcquisition interface in place of the old session calls.
    - name: Old call to new call table
      contains: Each old call that changed, next to the new call that replaces it.
    - name: Callback and output queue fixes
      contains: Updated listener code and queued output code, rewritten to use the new callbacks, preload and write.
    - name: Checks list
      contains: Short checks to confirm the ported script still runs the same, marked pass or fail.
