thinking: low
thinking_why: It fills a fixed template from facts you give it.
new_slug: data-catalog-entry-writer
name: Data catalog entry writer
summary: Write a data catalog entry for any table. Give it the schema and owner. You get column meanings, quality notes, sources and access rules.
job: document-work
headline: Data catalog entry writer
subhead: A plain, complete entry that tells anyone what a table is, who owns it, how good it is and who may use it. It ends the repeated questions about what a column means.
explain: |
  A plain, complete entry that tells anyone what a table is, who owns it, how good it is and who may use it. It ends the repeated questions about what a column means.

  The skill pulls the technical facts first: columns, types, keys and row counts. It then asks the owner for the business purpose, how critical it is and known uses. Each column gets a one sentence description with example values and rules. It checks completeness, freshness and duplicates, records where the data comes from and what depends on it, and adds access level, sensitive data tags and retention. The result follows a fixed template, so entries look the same across tables.
when:
  - A new table has just shipped and nobody knows what is in it.
  - Analysts keep asking you what the same columns mean.
  - An audit asks for documentation on sensitive data.
  - A new hire needs to learn what data you have.
not_for:
  - "You have a one-off scratch table or an unpublished draft: skip the entry and add a short note in the file or sheet."
  - "Your team has no data catalog: put the entry on a wiki page or in a shared data dictionary instead."
  - "You need the table built or fixed: ask your data engineer, since this only writes the documentation."
you_give:
  - Table schema or database export
  - Name of the data owner
  - Upstream sources and downstream reports
  - Privacy and retention rules (optional)
you_get:
  - Column by column descriptions
  - Quality notes
  - Source and dependency map
  - Access and sensitivity details
how_to_use:
  - Open your AI chat and paste the skill instructions.
  - Paste your table schema or export. Add the owner's name and the sources and reports linked to the table.
  - Answer the questions about purpose, how critical the table is and who uses it.
  - Check the quality figures. Anything your AI could not check from the data should read "not measured".
  - Send the finished entry to your catalog owner or data team lead to review, then publish it.
  - The script needs an AI that can run code and reach your database. Without that, paste the schema yourself.
output_sample:
  input:
    - Your table schema or database export
    - The name of the data owner
    - Where the data comes from and which reports use it
    - Your privacy and retention rules (optional)
  prerequisites:
    - An AI that can run code, if you want it to pull the schema and basic stats from your database
    - Time with the data owner to answer a few questions about purpose and use
  output:
    - name: scripts/catalog_extractor.py
      contains: A script that pulls the schema and basic stats from a database table.
    - name: assets/catalog_entry_template.md
      contains: The finished entry, ready to submit to your catalog.
    - name: Technical details
      contains: Column names, types, keys and row count taken from the table.
    - name: Business context
      contains: Display name, purpose, owning team, how critical the table is and known uses.
    - name: Column descriptions
      contains: One plain sentence per column, with example values and any rules.
    - name: Quality notes
      contains: Completeness, freshness and duplicate rate, plus known issues and how they affect later use.
    - name: Lineage
      contains: Where the data comes from and which dashboards, models or reports depend on it.
    - name: Governance
      contains: Access level, sensitive data tags, compliance tags, retention policy and how to request access.
