thinking: low
thinking_why: It picks a chart and draws it.
new_slug: data-chart-drawer
name: Data chart drawer
summary: Turn your data into a clean chart. Give it a file or pasted rows and get a chart image or interactive plot, with the right chart type picked for you.
job: track-numbers
headline: Data chart drawer
subhead: A clear chart that fits your data and your reader, saved as an image or an interactive plot. It picks the chart type for you if you are not sure which fits.
explain: |
  A clear chart that fits your data and your reader, saved as an image or an interactive plot. It picks the chart type for you if you are not sure which fits.

  You share the data as a file, pasted rows or query results, and say what the chart is for: a report, a slide or exploring. The skill loads it into a table, tidies types and gaps, and chooses between line, bar, scatter and others based on what you are comparing. It then builds the chart in Python with readable labels, sensible axes and accurate scales, and adjusts to the audience. You can ask for edits in plain words. It needs Python with a plotting library installed.
when:
  - You have a spreadsheet and need a chart for a slide by tomorrow.
  - You do not know whether a line or bar chart fits your data.
  - You want an interactive plot someone can hover over.
  - Your current chart looks cluttered and needs to be cleaner.
not_for:
  - "You need a live dashboard that updates by itself: use a dashboard tool such as Looker Studio or Power BI."
  - "Your data is huge, with millions of rows: use a BI tool, or ask a data person to prepare a smaller summary first."
  - "You want a quick table of totals, not a picture: use a spreadsheet such as Google Sheets or Excel."
you_give:
  - Your data, file or pasted rows
  - What you want to show
  - Chart type (optional)
  - Who will see it (optional)
you_get:
  - Chart image or interactive plot
  - Chart type recommendation
  - The code that made it
  - Edits on request
how_to_use:
  - Open an AI that can run Python code, such as Claude with code execution, ChatGPT with its data analysis tool, or Claude Code. Some of these need a paid plan.
  - Paste the skill, then upload your file or paste your rows. Check your AI tool's data settings before you upload customer, staff or other private rows, or remove those columns first.
  - Say what the chart should show and who will see it. Add a chart type only if you have one in mind.
  - Check the chart type it picks and read the title and axes. Ask for changes in plain words.
  - Save the PNG and the code. The skill saves the PNG in the AI's working folder; in a chat tool, download it from the chat. Say "interactive" if you want a plot you can hover over.
  - Next, drop the chart into your slide or report, and keep the code so you can redraw it when the numbers change.
output_sample:
  input:
    - Your data as a file (CSV or Excel), pasted rows, or a question for your data source
    - What you want the chart to show
    - Chart type, if you have one in mind (optional)
    - Who will see it, such as your team, a boss or clients (optional)
  prerequisites:
    - An AI that can run Python code and has a plotting library
    - Say "interactive" if you want a chart you can hover and zoom
  output:
    - name: Chart type recommendation
      contains: A short reason why the chosen chart fits your data, given only if you did not pick a type.
    - name: Chart PNG
      contains: One chart saved as an image at 150 dpi, with a clear title, labeled axes and readable numbers.
    - name: Interactive plot
      contains: A chart you can hover over and zoom, made with plotly when you ask for interactive.
    - name: Python code
      contains: The code that drew the chart, so you or your AI can change it.
    - name: Suggested variations
      contains: Ideas for other chart types, groupings or date ranges to try next.
