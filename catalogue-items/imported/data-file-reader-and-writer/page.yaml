new_slug: data-file-reader-and-writer
name: Data file reader and writer
summary: Read or save a CSV, Excel, JSON or Parquet file in MATLAB without silent damage. Get working code, import options and corruption checks.
job: work-with-files
headline: Data file reader and writer
subhead: Your CSV, Excel, JSON, Parquet or XML file loads correctly in MATLAB and saves back the way you need, with no silent damage. Many import bugs do not show errors, they just change your numbers.
explain: |
  Your CSV, Excel, JSON, Parquet or XML file loads correctly in MATLAB and saves back the way you need, with no silent damage. Many import bugs do not show errors, they just change your numbers.

  The skill uses the right import options for each file type and sets delimiters, locales and encodings. European files with comma decimals and semicolon separators are handled. After loading, it checks for corruption such as stray NaN values, 65535 placeholders and numbers turned into text. It decodes misleading error messages, reads from URLs and compressed files, handles awkward JSON keys, and swaps old fopen code for modern readlines and writelines. It needs MATLAB. Big files and database work go elsewhere.
when:
  - A CSV opens with garbled columns or wrong decimals.
  - MATLAB says file not found but the file is right there.
  - You need data pulled from a web address into a table.
  - Old file reading code needs updating to modern commands.
not_for:
  - "Your file is too big for memory: use a tall array or datastore in MATLAB, or a database tool."
  - "You need to query a database over ODBC or JDBC: use MATLAB's database tools instead."
  - "You want to read images or audio: use MATLAB's own image or audio read commands."
you_give:
  - The file or its address
  - What you want to read or save
  - The error message (optional)
  - Locale or encoding details (optional)
you_get:
  - Working read or write code
  - Import options set for your file
  - Corruption checks on loaded data
  - Explanation of any error
how_to_use:
  - Check your MATLAB release. Some functions need R2019a or later.
  - Open your AI and paste this skill's instructions.
  - Add your file path or web address, and say whether you want to read or save.
  - Paste the error message and any locale details if you have them.
  - Run the code in MATLAB, or let your AI run it if it can.
  - Read the corruption checks before you trust the numbers. If your AI uses the Parquet datastore workaround, nulls become 0, so confirm that is fine for your data.
output_sample:
  input:
    - The file path or web address of your data file
    - "What you want to do: read it or save it, and in which format"
    - The error message you see (optional)
    - Locale or encoding details, such as comma decimals (optional)
  prerequisites:
    - MATLAB, which is a paid product, and an AI that can run it
    - Your MATLAB release, since some functions need R2019a or later
  output:
    - name: Import code
      contains: Working MATLAB code that reads or writes your file with the right delimiter, locale and encoding.
    - name: Import options
      contains: A short list of the settings chosen for your file, such as delimiter, decimal sign and variable types.
    - name: Corruption checks
      contains: A pass or fail list for stray NaN values, 65535 placeholders and numbers read as text.
    - name: Error explanation
      contains: A plain reading of any misleading error message and the real cause behind it.
    - name: Modern replacement code
      contains: Old fopen and fgetl code rewritten with readlines and writelines, when your code uses them.
