thinking: medium
thinking_why: It picks the point, then shapes the numbers around it.
new_slug: data-story-writer
name: Data story writer
summary: Turn your numbers into a data story with a clear point, proof and next step. Built for decks and reports that need a decision from the room.
job: work-with-files
headline: Data story writer
subhead: "Your numbers turn into a story a room can follow: what happened, why it matters and what to do next. The aim is a decision, not a pile of charts."
explain: |
  Your numbers turn into a story a room can follow: what happened, why it matters and what to do next. The aim is a decision, not a pile of charts.

  The skill sets the structure first: a setup, a rising tension where the data surprises, and a resolution with a clear ask. It matches chart choices to the point of each slide, puts the main finding in the headline, and uses comparisons and annotations so readers see the shift without squinting. It adjusts the depth for executives, investors or non technical staff. All figures are checked against your source data before they go in. Useful for quarterly reviews, board decks and written reports. The example stories in the skill file use placeholders, never real figures, so any number in your result comes from your data. This is sickn33's data-storytelling skill, shared under the CC BY 4.0 licence.
when:
  - You must present quarterly results to executives.
  - Your analysis is correct but nobody acts on it.
  - You are building an investor update with data.
  - You need to explain a trend to people who do not read charts.
not_for:
  - "You need to clean messy raw data first: use an analyst or a spreadsheet tool, then come back with the clean numbers."
  - "You want a live dashboard that updates by itself: use a BI tool such as Looker Studio or Power BI."
  - "You need a formal statistical test or a forecast you can defend: ask an analyst to run it."
you_give:
  - Your numbers or analysis
  - Who the audience is
  - The decision you want from them
  - Format, deck or report (optional)
you_get:
  - Story outline
  - Headline findings
  - Chart suggestions
  - Recommendation and next step
how_to_use:
  - Add the skill to your AI with the buttons on this page, or paste the full skill file into a chat. The example stories in the skill use [bracketed] placeholders instead of real figures. Your AI fills them only from your data.
  - Gather the metric, the time period, the baseline or target, and the decision you want from the audience. Paste your numbers, or attach your spreadsheet if your AI can read files. Tell your AI which columns hold the dates, the values and the groups.
  - Tell your AI who the audience is and the decision you want from them.
  - "Ask for a deck outline or a written report. Your AI picks a story shape: problem and solution, trend, or comparison."
  - Read the draft. Your AI should flag any number it cannot trace to your data. Fix or cut those before you present.
  - Use the "Call to Action" section as the close of your deck, then build the slides in your presentation tool. For live charts, move to a BI tool.
output_sample:
  input:
    - Your numbers or analysis, pasted or as a spreadsheet
    - Who the audience is
    - The decision you want from them
    - Deck or written report (optional)
  prerequisites:
    - An AI that can read your files, if your numbers are in a spreadsheet. Otherwise paste them into the chat.
  output:
    - name: Headline
      contains: One sentence that puts the main finding first, with a number and what it means for the business.
    - name: Context
      contains: The starting point and baseline, so readers know what the numbers are measured against.
    - name: Discovery and deep dive
      contains: The key pattern in your data, the likely cause, and any caveats about what the numbers cannot prove.
    - name: Chart suggestions
      contains: Which chart fits each slide or section, and what to highlight or label so the shift is easy to see.
    - name: Recommendation and impact
      contains: The action you propose, the expected effect with assumptions shown, and any risks.
    - name: The ask
      contains: The specific decision needed from your audience and the next steps.
