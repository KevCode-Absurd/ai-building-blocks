thinking: high
thinking_why: Data trade-offs are subtle and depend on your load and failure needs.
new_slug: data-system-designer
name: Data system designer
summary: Describe what your app stores and how it is used. Get a data system design review with picks for storage, copies, splitting and consistency.
job: build-software
headline: Data system designer
subhead: A reasoned set of choices for how your app stores, copies, splits and protects its data, with the trade-off behind each. It is based on the ideas in the book Designing Data-Intensive Applications.
explain: |
  A reasoned set of choices for how your app stores, copies, splits and protects its data, with the trade-off behind each. It is based on the ideas in the book Designing Data-Intensive Applications.

  You describe what you store, how it is read and written, and what must never go wrong. The skill covers seven areas: data models, storage engines, copies across servers, splitting data across machines, transactions and isolation, derived data such as caches and search, and failure handling. It scores your design from 0 to 10 using seven yes or no checks (each pass is worth about 1.4 points), shows which failed, such as unknown isolation level or an untested failover, and lists what to fix to reach 10.

  The score is a judgement against those seven checks, based on the answers you give. It is not a benchmark or a measurement of your system. Test any pick on your own data and have an experienced engineer review it before you rely on it. This is Wondel.ai's Designing Data-Intensive Applications skill, shared under the MIT licence.
when:
  - You are choosing between SQL and NoSQL for a new product.
  - You worry about replication lag or hot spots in your database.
  - You want a review of a data design before it ships.
  - You need to explain data trade-offs to teammates.
not_for:
  - "You run one small app on one database with no scaling or consistency questions: keep your current database and skip the review."
  - "You need the overall app layout, not the data layer: ask a system design skill or a senior engineer instead."
  - "You want to make your services survive outages: use a resilience review, not this data design skill."
you_give:
  - What your app stores
  - Read and write patterns
  - Consistency and uptime needs
  - Your current design (optional)
you_get:
  - Recommended storage and replication
  - Splitting and consistency choices
  - Score out of 10 with failed checks
  - Fix list to improve
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tool is needed.
  - Write your brief first as a short list: the data you store, your top three read and write patterns, and the one failure that must never happen. Add your uptime needs and your current design if you have one.
  - Give your AI the brief. It asks for anything missing, such as how much you read compared with write, or what your database does by default.
  - It then marks each of the seven checks pass or fail, with one line of evidence from your brief.
  - It gives its picks for storage, copies, splitting and consistency, with the trade-off for each.
  - Read the score and the failed checks first.
  - Work through the fix list, starting with the checks that failed. Ask your AI to score again after each change.
output_sample:
  input:
    - What your app stores, in plain words
    - How often you read and write it
    - What must never go wrong, and your uptime needs
    - Your current design (optional)
  output:
    - name: Storage and replication
      contains: The data model and storage engine that fit your reads and writes, and how to copy data across servers.
    - name: Partitioning
      contains: How to split data across machines, and how to avoid hot keys.
    - name: Isolation and consistency
      contains: The transaction isolation level and consistency choices that suit your needs, with the trade-off for each.
    - name: Score out of 10
      contains: A score from 0 to 10 from seven yes or no checks on data model, storage, copies, splitting, isolation, derived data and failures. About 1.4 points for each pass, shown as a table of pass or fail with one line of evidence for each check.
    - name: Failed checks
      contains: Each failed check in one or two lines, such as an unknown isolation level or an untested failover, with why it matters.
    - name: Fix list
      contains: A short numbered list of changes, in order, needed to reach 10 out of 10.
