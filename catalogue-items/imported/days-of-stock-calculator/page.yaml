thinking: low
thinking_why: It compares stock with fulfilled units at each location.
new_slug: days-of-stock-calculator
name: Days of stock calculator
summary: Compare available stock with each location's fulfilled units. Get days of cover, low-stock flags and collection gaps.
job: run-your-store
headline: Days of stock calculator
subhead: Estimate stock cover at each location from available stock and fulfilled units. See missing records before using the numbers.
explain: |
  See available stock, fulfilled units and estimated days of cover for each variant and location. Missing records are marked so they cannot look like zero sales.

  Your AI reads Shopify orders created in your chosen window, 30 days by default. It counts successful fulfilments made before the window ends and joins them to their actual locations. Current available stock divided by that daily rate gives estimated cover. This is not a physical stock count or a forecast of future demand.

  The skill includes local scripts that write JSON and CSV reports. They make no store changes. The sell-through figure is a labelled proxy using current available stock, not inventory receipts. The 14-day alert is an adjustable default. Check it against your supplier lead times. AI Blocks checked API fields in the official documentation but has not run this against a live store.
when:
  - You plan next week's purchase orders and need a reorder list.
  - A bestseller may run out before restock arrives.
  - You want to compare stock health across locations.
  - You manage one supplier's products and want to check only those.
not_for:
  - "You need a live stock count: use a manual count or your POS report."
  - "You want totals across several stores: this reads one store at a time, so run it once per store and add the results yourself."
  - "You want to clear slow stock: this flags it, but you decide the markdown yourself."
you_give:
  - Your store address
  - Sales window in days (optional)
  - Alert threshold in days (optional)
  - Supplier filter (optional)
you_get:
  - Days of stock per item and location
  - A labelled sell-through proxy
  - Flagged low stock items
  - Missing-record notes for reorder planning
how_to_use:
  - Open an AI that can run code and use the Shopify CLI, such as Claude Code, Cursor, Codex or Gemini CLI.
  - "Sign in to your store first. Run the Shopify CLI command: shopify store auth --store your-store.myshopify.com --scopes read_products,read_orders,read_inventory"
  - Add the full skill folder, including its scripts. Give your store address, window, alert level and supplier filter.
  - Ask your AI to collect all pages and run the local analyser. Keep the snapshot and reports in your approved working folder.
  - Check the critical list first. Then open the CSV and compare low items with your supplier lead times.
  - Use a 90-day window for slow or seasonal products. The default is 30 days. Shopify may limit older order history, so check that orders older than the window come back before you trust a 90-day run.
  - Take the flagged items to your supplier lead times. Use the Dead stock finder for items that did not sell.
next: [dead-stock-finder, reorder-quantity-planner]
output_sample:
  input:
    - Your Shopify store address
    - Sales window in days (optional)
    - Alert level in days (optional)
    - One supplier to focus on (optional)
  prerequisites:
    - An AI that can run code and use the Shopify CLI
    - Read access to products, orders and inventory in your Shopify store
  output:
    - name: Start banner
      contains: Your store, the order window, stock read time and collection status.
    - name: Step log
      contains: One line per step showing what was read and how many results came back.
    - name: Summary
      contains: Location rows checked, low-stock flags and incomplete rows, with collection gaps.
    - name: Critical list
      contains: Each product under your alert level, with its SKU, days of stock left and daily sales.
    - name: velocity.csv and velocity.json
      contains: One CSV row per variant and location, with available stock, fulfilled units, daily rate, cover, a sell-through proxy and status. JSON adds collection notes.
