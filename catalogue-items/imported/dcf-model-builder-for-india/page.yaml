headline: DCF model builder for India
subhead: Name a listed Indian company. Get a discounted cash flow Excel model with WACC, sensitivities and a summary.
explain: |
  An Excel valuation model for a listed Indian company, with projected cash flows, a worked out discount rate, sensitivity tables and a summary. Indian reporting quirks are handled so numbers do not end up wrong.

  Two rules guard against common mistakes. Fiscal years run April to March, so FY2025 ends 31 March 2025 and periods are labelled with their months. Money is shown in lakh and crore, and the skill divides by 10,000,000 in a live formula because the usual Excel crore format is wrong by 100 times. It builds the model from company filings and any data connection you have, and states plainly where India has no equivalent input. You need Excel to open the result.
when:
  - You want to value a company listed on NSE or BSE.
  - You are checking whether a stock looks cheap or expensive.
  - You need a clear model with sensitivity to growth and discount rate.
  - A finance course or review needs a full DCF on an Indian firm.
you_give:
  - Company name or ticker
  - Financial statements or filings (optional)
  - Assumptions on growth and margins (optional)
  - Your own view of risk (optional)
you_get:
  - Excel DCF workbook
  - Discount rate working
  - Sensitivity tables
  - Summary of valuation
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and read files.
