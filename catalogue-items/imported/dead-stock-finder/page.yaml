thinking: low
thinking_why: It matches stock levels to order dates.
new_slug: dead-stock-finder
name: Dead stock finder
summary: Find Shopify products with stock on the shelf but no sales in 90 days. Get a list with units and cost value, ready for a clearance plan.
job: run-your-store
headline: Dead stock finder
subhead: Give it your Shopify store and a look-back window, 90 days by default. It compares what is on your shelves with what sold, then lists products that did not sell at all. You get a CSV with units and cost value for each.
explain: |
  Dead stock is stock you own that has not sold. It ties up cash and shelf space. This dead stock finder shows which Shopify products fit, so you can decide what to discount, return to the supplier or stop reordering.

  Your AI reads your inventory counts and your orders for the window you pick. It builds a list of variants that sold, then flags every variant with stock that is not on that list. You can set a minimum quantity and narrow the check to one vendor.

  It ranks the list by cost value, so the biggest sums of tied-up cash come first. It only reads your store. It does not tag, discount or change anything.
when:
  - Your storeroom is full and you need to know what to clear first.
  - You plan a clearance sale and want a list of what has not moved.
  - You are deciding which products to stop reordering.
  - A supplier review needs their unsold lines listed.
not_for:
  - A product launched inside the window. It has had no time to sell, so it will show up here by mistake.
  - Slow movers that still sell now and then. Use the Days of stock calculator to see how long they will last.
  - You want stock sorted by how long it has sat. Use the Stock age report builder.
  - You want the products tagged or discounted. This only reads. Use the Product tag bulk editor after you review the list.
you_give:
  - Your Shopify store address, like mystore.myshopify.com
  - Look-back window in days (optional, default 90)
  - Minimum stock to count (optional, default 1)
  - A vendor name to check on its own (optional)
you_get:
  - A list of products with stock and no sales in your window
  - Units on hand and cost value for each product
  - A total of the cash tied up in dead stock
  - A CSV file you can sort and share
how_to_use:
  - Connect your AI to your Shopify store with read-only access. It needs permission to read products, orders and inventory. No connection? Export your inventory and orders as CSV files and paste them in.
  - Open the skill in Claude, ChatGPT or Gemini, or paste it in. Give it your store address and your look-back window.
  - If your window is longer than 60 days, check that your access includes read_all_orders. Shopify returns only the last 60 days of orders without it.
  - Check the top of the report for the settings used and any note about orders that were cut short or items with no cost.
  - Read the top 10 by cost value. Open two of them in Shopify and confirm they really did not sell.
  - Decide what to do with the list. Tagging, discounts or a clearance collection are separate steps you approve one at a time.
output_sample:
  input:
    - Your Shopify store address
    - Look-back window in days, minimum stock and vendor (optional)
  prerequisites:
    - Read-only access to your Shopify products, orders and inventory, or exports of each as CSV
    - The read_all_orders permission if your window is longer than 60 days
    - An AI that can run code, to run the commands in this skill
  output:
    - name: Dead stock report
      contains: Items with stock, items with no sales, the percent that is dead, and the estimated cash value.
    - name: Top dead stock by value
      contains: The biggest items first, each with product, SKU, units on hand and value.
    - name: dead_stock_<date>.csv
      contains: One row per variant with SKU, vendor, quantity, window checked, unit cost and total cost value.
    - name: Settings and notes
      contains: The window, minimum quantity and vendor used, plus any orders cut short or items with no cost.
works_best_with:
  tools:
    - name: Claude or ChatGPT with a Shopify connection
      why: It can read your store directly, so you skip the exports.
    - name: Any good chat AI
      why: Works from pasted inventory and order exports if you have no connection.
  inputs:
    - A longer window, such as 180 or 365 days, for products that sell all year
    - Unit cost for each product, so the cash tied up is right
terms:
  - term: Dead stock
    meaning: Stock on your shelf that has had no sales in the window you chose.
  - term: Variant
    meaning: One version of a product, such as a size or colour, with its own stock count.
  - term: SKU
    meaning: The code you give each variant so you can tell it apart.
