thinking: high
thinking_why: It must compare sources and tie claims to evidence.
new_slug: deal-competitor-playbook-builder
name: Deal competitor playbook builder
summary: Name a rival and the deal. Get a plan to win it, plus your win and loss
  patterns.
job: sell-and-negotiate
headline: Deal competitor playbook builder
subhead: Name the rival and the deal you are in. It reads their public pages for
  launches, pricing and news, and your past deals against them if you connect
  your CRM. You get a plan for winning this deal, their strengths and gaps, and
  the patterns behind your wins and losses.
explain: |
  Before you meet a buyer who is also talking to a rival, get a plan for how to win: where the rival is strong, where it is weak, and what your past wins and losses against it show.

  Name the competitor. The skill reads public pages for launches, pricing changes and news, and if connected pulls your closed deals tagged with that competitor, loss reasons and call transcripts or emails. It states what it could not verify. It then writes the play for the deal at hand, plus patterns across the book such as when you tend to win. It can also set up a weekly digest of competitive changes and a team battlecard.
when:
  - A prospect says they are also looking at a rival.
  - You want to know why you lose deals to one competitor.
  - Your team needs a shared battlecard.
  - You want a weekly note on what rivals changed.
you_give:
  - The competitor name
  - The deal or situation
  - CRM data or closed deal export (optional)
  - Call notes (optional)
you_get:
  - Plan for winning the deal
  - Win and loss patterns
  - Competitor strengths and gaps
  - Battlecard or weekly digest (optional)
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can search the web and read your CRM.
