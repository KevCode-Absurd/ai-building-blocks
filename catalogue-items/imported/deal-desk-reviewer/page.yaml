thinking: high
thinking_why: It weighs money, risk and terms before it advises.
new_slug: deal-desk-reviewer
name: Deal desk reviewer
summary: Give it a deal with a big discount or redlined terms. Get margin, risky
  terms and a verdict.
job: sell-and-negotiate
headline: Deal desk reviewer
subhead: Give it the deal size, discount, tier and any redlined contract terms.
  It scores margin, risk and fit out of 100 and lands on approve, review,
  escalate or decline. You get the margin after discount, risky terms with
  counters, and who should sign off.
explain: |
  A big discount request or a customer's redlined contract gets a score, a clear verdict and the right approver. It never approves on its own, so a person always signs off.

  Three tools do the work. A deal scorer rates margin, risk, strategic value, fit and term shape from 0 to 100 and lands on approve, review, escalate or decline. A router maps discount size, deal size and tier to the approver chain, from account exec up to the CFO or CRO, with an estimated number of days. A terms checker catches ten risky patterns such as uncapped indemnity, most favoured customer clauses, missing data agreements and net 60 payment, each with a standard counter. It runs Python scripts.
when:
  - Sales asks for a discount above their authority.
  - A customer sent back the contract with edits.
  - You need margin after discount for a CFO review.
  - You want a consistent way to route approvals.
you_give:
  - Deal size, discount and tier
  - Cost or margin details
  - Contract terms or redline
  - Your discount policy (optional)
you_get:
  - Deal score and verdict
  - Approver chain and timing
  - Risky terms with counters
  - Margin after discount
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code.
