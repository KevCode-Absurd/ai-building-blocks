thinking: high
thinking_why: It must judge risk from partial and mixed signals.
new_slug: deal-health-reviewer
name: Deal health reviewer
summary: Name a deal. Get a health score, ranked risks, qualification gaps and
  next actions.
job: sell-and-negotiate
headline: Deal health reviewer
subhead: Name a deal and paste the CRM record, recent emails or call notes. It
  checks the signals against your stage rules and qualification method. You get
  a health score with the reasons behind it, a ranked list of risks, the gaps in
  qualification and the next actions worth taking.
explain: |
  One deal, one honest read. You get a health score, a list of risks, the gaps in how the deal was qualified, and the next actions worth taking. It shows where the deal really stands, not just the stage your CRM claims.

  It pulls signals from the CRM record, recent emails, call transcripts and internal chat, then checks each against your stage rules and qualification method such as BANT or MEDDIC. Every signal is tied to its source, and blank fields are labelled blank. If a tool is not connected, it works from what you paste in and tells you what it could not see.
when:
  - You are about to forecast a deal and want to know if it will really close.
  - A deal has gone quiet and you need to see what changed.
  - Your manager asks for a deal review and you have an hour to prepare.
  - You suspect the CRM stage is ahead of what the buyer has actually agreed to.
you_give:
  - Deal or account name
  - CRM record, export or pasted deal details
  - Recent emails or call transcripts (optional)
  - Your qualification method (optional)
you_get:
  - Health score with the reasons behind it
  - Ranked list of risks
  - Qualification gaps
  - Recommended next actions
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your CRM, email and calendar.
