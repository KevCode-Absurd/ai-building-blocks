thinking: medium
thinking_why: It compares the deal to what the next stage needs.
new_slug: deal-next-stage-gap-finder
name: Deal next-stage gap finder
summary: Find what is missing to move a deal to the next stage or to close. You get each gap with an owner, a due date and the shortest path.
job: sell-and-negotiate
headline: Deal next-stage gap finder
subhead: Name a deal and say whether you want the next stage or the close. It reads the CRM record, contact roles, emails and open commitments against your stage exit rules. You get the missing items, an owner and due date for each, and the shortest path to close.
explain: |
  Know exactly what stands between this deal and the next stage. You get a gap list measured against your stage exit rules and qualification method, with who should do each task and by when, plus the shortest path to close.

  Where a deal review scores today's position, this looks forward. It reads the CRM record, contact roles, recent emails, open commitments from calls and blockers raised in chat. Then it compares what is proven with what your stage needs. It only reads and suggests. Any record changes it proposes come with evidence, and you choose which ones to apply.
when:
  - A deal has sat in one stage for weeks and you need to move it.
  - You want a clear to-do list before your next call with the buyer.
  - You need to know what is missing before you can commit the deal in the forecast.
  - A new rep inherits a deal and needs to know what is left to do.
not_for:
  - "You want a score of where the deal stands today: use the deal-review skill first."
  - "The deal has no stage exit rules or no contact list yet: write those down first, or ask your sales lead for them."
  - "You want a CRM record changed now: ask your AI to update the opportunity or log the activity instead."
you_give:
  - Deal name or ID
  - "Target: next stage or close"
  - CRM details or pasted notes
  - Your stage exit criteria (optional)
you_get:
  - List of missing items for the next stage
  - Owner and due date for each gap
  - Shortest path to close
  - Suggested record updates with evidence
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on this page.
  - It works best when your AI can read your CRM, email and calendar.
output_sample:
  input:
    - Your deal name or ID
    - Whether you want the next stage or the close
    - "Your CRM details or pasted notes: stage, close date, contacts, last five activities"
    - Your stage exit rules (optional)
  prerequisites:
    - A CRM, email or chat connected to your AI is best, but pasted notes work too
  output:
    - name: Short answer
      contains: One or two sentences on what must happen for the deal to advance and where the critical path runs.
    - name: Gap table
      contains: Each missing item with its owner, what it blocks and the evidence behind it.
    - name: Already in motion
      contains: Items under way with expected landing dates, so you do not ask for them again.
    - name: Sequenced path
      contains: Steps in order with who does each and by when, plus the earliest credible close date.
    - name: Suggested CRM updates
      contains: Proposed changes such as next step or close date, each shown with evidence for you to accept or skip.
