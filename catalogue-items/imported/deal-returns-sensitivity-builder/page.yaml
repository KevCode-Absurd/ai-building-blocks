thinking: medium
thinking_why: It runs many scenarios through a set model.
new_slug: deal-returns-sensitivity-builder
name: Deal returns sensitivity builder
summary: Give it deal terms. Get IRR and MOIC tables across entry price, debt,
  exit price and hold time.
job: money-and-investing
headline: Deal returns sensitivity builder
subhead: "Enter the deal: entry EBITDA and multiple, net debt, growth, margins
  and exit year. It builds the base case with live formulas, then changes one
  assumption at a time. You get a returns model, an IRR table, a MOIC table and
  notes on which assumptions matter most."
explain: |
  Tables that show what a deal returns if the price, the debt or the exit changes. You get IRR and MOIC grids across entry multiple, debt level, exit multiple and hold period, so you can see which assumption matters most.

  You start by entering the deal: entry EBITDA, entry multiple, net debt, growth, margins, debt terms and exit year. The model builds the base case with live formulas, then runs the two-way sensitivities. It is set up for Indian markets: April to March fiscal years, and lakh and crore units, with a built-in check against a 100x crore label error. It needs a spreadsheet to build in.
when:
  - You are weighing a bid and need to know how much price headroom you have.
  - Your lender wants to see returns at different debt levels.
  - You want to show an investment committee what happens if the exit multiple
    falls.
  - You are comparing a three-year and a five-year hold.
you_give:
  - Entry EBITDA and multiple
  - Net debt and debt terms
  - Growth and margin assumptions
  - Exit year and exit multiple range
  - Fees and costs (optional)
you_get:
  - Base-case returns model
  - IRR sensitivity table
  - MOIC sensitivity table
  - Notes on which assumptions drive the result
how_to_use:
  - Paste the skill instructions into a chat with an AI that can build a
    spreadsheet. The India helper files it mentions are not included, so the
    rules in the skill are what it uses.
  - Give it the deal terms listed on this page. Say which fiscal year the exit
    falls in.
  - Check the base case first. Then read the IRR and MOIC tables and the notes
    on which assumptions drive the result.
  - Confirm tax treatment with a tax adviser before you rely on after-tax
    returns.
not_for:
  - Your deal is outside India or your company uses calendar years. This skill assumes April to March years and lakh and crore.
  - You only need to know whether a requested EBITDA addback fits your deal cap. Use the Deal EBITDA addback checker.
  - You want a model that someone else built checked for errors. Use the Financial Analyst agent.
output_sample:
  input:
    - Entry EBITDA and the entry multiple (EV to EBITDA)
    - Net debt, senior debt and any other debt, with rates and paydown terms
    - Revenue growth, EBITDA margin, capex and working capital assumptions
    - Exit year and the range of exit multiples to test
    - Fees and deal costs (optional)
  prerequisites:
    - A spreadsheet tool such as Excel to build the workbook in
  output:
    - name: Base-case returns
      contains: Entry value, equity put in, exit value, exit equity, MOIC, IRR and cash-on-cash.
    - name: Returns waterfall
      contains: How much of the return comes from EBITDA growth, the multiple, debt paydown and fee drag.
    - name: Sensitivity tables
      contains: IRR and MOIC grids for entry against exit multiple, growth, debt level and hold period.
    - name: Scenario analysis
      contains: Bull, base and bear cases side by side.
    - name: Excel workbook
      contains: Assumptions, returns calculation, sensitivity tables and scenario summary, with live formulas.
    - name: One-page returns summary
      contains: The headline returns, set up for an investment committee deck.
