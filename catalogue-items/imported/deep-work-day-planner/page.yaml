thinking: low
thinking_why: It fits tasks into set time blocks.
new_slug: deep-work-day-planner
name: Deep work day planner
summary: "Plan a deep work day: give it your tasks and fixed times, and get a time-blocked schedule with focus hours protected and shallow work boxed in."
job: organise-work
headline: Deep work day planner
subhead: Give it today's tasks with rough minutes, plus your start time, end time and lunch. It marks each task deep or shallow and puts deep work early in blocks of at least 90 minutes. You get a time-blocked schedule and a log of your focus hours.
explain: |
  A day built around your best focus hours. Give it your task list with rough minutes and it returns a schedule with deep work placed early in blocks of at least 90 minutes, and shallow tasks batched into two short windows.

  It labels each task as deep or shallow and shows how much of your day is shallow. For each shallow item it asks: how long would it take to train a smart new graduate to do this? It adds buffers after hard blocks and refuses to book more than four hours of deep work. Small Python scripts handle the scheduling and keep a log of focus sessions, so your weekly deep-hours total is counted, not guessed.
when:
  - Your calendar is full of meetings and you cannot get real work done.
  - You have ten tasks and no sense of which deserve your sharpest hours.
  - You want to count how many hours a week you truly focus.
  - Email and chat eat your mornings and you want them boxed into set times.
not_for:
  - "You plan for a team or a sprint: use your project tool's capacity view, since this plans one person's day."
  - "You only need to pick what matters today: write a short list of three tasks by hand, then come back to block the time."
  - "You want a long-term goal plan: use a simple weekly review with a person you trust, as this only plans one day."
you_give:
  - Today's tasks with rough minutes for each
  - Your day's start time and hard end time
  - Your lunch time or other fixed commitments
  - Deep or shallow tags on tasks (optional)
  - Your weekly deep-hours target (optional)
you_get:
  - A schedule table with start time, end time, task and a deep or shallow label for each block
  - Totals for your deep hours and shallow hours
  - A question for each shallow task to help you cut or hand it off
  - A focus-hours log with your weekly total and streak
  - An end-of-day shutdown checklist
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - List today's tasks with rough minutes. Add your start time, hard end time and lunch. Meetings and fixed times go in as busy time.
  - Mark any task you know is deep or shallow by adding the word after it (optional).
  - Check the shallow audit first. If it says over budget, cut or hand off tasks before you plan.
  - Read the schedule. If deep work passes four hours, defer a task as it suggests.
  - Running the scripts needs an AI that can run Python 3 code on your computer, with no installs. Upload the three files from the scripts folder with the skill. The focus log is saved as a small file on your computer (~/.deep-work/sessions.json).
  - "Pasting only the skill text into a plain chat gives you the same rules worked by hand, with no scripts. Keep the focus log yourself in a note or spreadsheet: date, minutes and task for each block, then add up the week."
  - Next, after each focus block, log it, and at the end of the day run the shutdown checklist. If you have not chosen what matters today, pick your top tasks first, then plan the blocks.
output_sample:
  input:
    - Today's tasks with rough minutes for each
    - Your day's start time and hard end time
    - Your lunch time or other fixed times (optional)
    - Deep or shallow tags on tasks (optional)
    - Your weekly deep-hours target (optional)
  prerequisites:
    - An AI that can run Python 3 code, with no installs needed. Without it, ask your AI to do the same steps by hand.
  output:
    - name: Shallow work audit
      contains: Each task marked deep or shallow, your shallow share against the budget, and a question to cut each shallow task.
    - name: Time-blocked schedule
      contains: Start time, end time, task and deep or shallow label for each block, with buffers and a fixed lunch.
    - name: Deep and shallow totals
      contains: Your planned deep hours and shallow hours for the day.
    - name: Refusal notes
      contains: What to defer if deep work passes four hours, or what to drop if shallow work passes your end time.
    - name: Focus-hours log
      contains: Each focus session you log, this week's deep hours against your target, and your streak of days.
    - name: Shutdown checklist
      contains: An end-of-day routine to capture open loops and close the day.
