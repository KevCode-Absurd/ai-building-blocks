thinking: high
thinking_why: The rules are dense and tie to many linked controls.
new_slug: defense-contractor-security
name: Defense contractor security checker
summary: Share your contract and system details. Check current CMMC sources,
  identify gaps and flag missing evidence.
job: check-contracts
headline: Defense contractor security checker
subhead: Share your contract, data and system details; get a current CMMC
  check, evidence gaps, and open questions.
explain: |
  Share the contract clauses and system boundary. The skill checks current DoD sources, maps evidence to practices and marks unknowns.

  It checks current DoD sources and the contract before mapping CMMC requirements to your system boundary. You get evidence gaps and draft planning notes for your security plan and milestones. It can help scope controlled unclassified information and review subcontract terms. Have a qualified assessor confirm decisions.
when:
  - You won a subcontract and the prime says you need CMMC.
  - You must decide what counts as controlled information in your systems.
  - An assessment is coming and you have no security plan written.
  - You need a list of gaps with owners before you spend on fixes.
you_give:
  - Contract type and data you handle
  - Description of your systems and network
  - Current security controls
  - Target CMMC level (optional)
you_get:
  - A supported level assessment or a list of missing evidence
  - Gap table by practice
  - System security plan sections
  - Action and milestone plan
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
