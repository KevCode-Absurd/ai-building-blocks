thinking: high
thinking_why: Jurisdiction and licence calls need careful reasoning.
new_slug: defense-export-rules-checker
name: Defense export rules checker
summary: Check if your defense product or data is under ITAR, which licences you need and how to stay compliant. Describe the item and the buyer.
job: check-contracts
headline: Defense export rules checker
subhead: Find out whether your product or data is controlled under US arms export rules, and what you must do about it. Describe the item and who will receive it, and you get a classification, the licences that apply and the steps to stay compliant.
explain: |
  Find out whether your product or data is controlled under US arms export rules, and what you must do about it. Describe the item and who will receive it, and you get a classification, the licences that apply and the steps to stay compliant.

  It works through the jurisdiction test: match the item to the US Munitions List, then fall back to the commercial rules if it does not fit. From there it covers company registration, licence forms, technical assistance and manufacturing agreements, brokering, and sharing technology with foreign employees. It can also walk you through a voluntary disclosure. It is an AI guide, so confirm real decisions with trade counsel.

  Fees, penalty amounts, country lists and rule-change notes in the skill file are the author's dated notes and have not been verified here. Check each on the DDTC site or in the Federal Register before you use it, and say "not confirmed" if you cannot. A wrong answer here can mean an illegal export, so do not ship or share data on this result alone. This is Hemant Naik's ITAR skill, shared under the MIT licence.
when:
  - You want to sell a component overseas and are not sure it is controlled.
  - A foreign national joins your team and will see technical data.
  - You need to know which licence form fits your deal.
  - You found a possible violation and need to know how to report it.
  - You want a starting point to bring to trade counsel. The result is not a classification you can rely on to ship or share data.
not_for:
  - "You need a final legal call or a formal Commodity Jurisdiction ruling: ask trade counsel, or file a request with the State Department's DDTC."
  - "Your item is a normal commercial product with no military use: check the Commerce Department's export rules (EAR) with a trade adviser instead."
  - "You need an official, current fee or country list: read the DDTC website and the Federal Register, because this skill may be out of date."
you_give:
  - Description of the item or technical data
  - Destination country and end user
  - Your registration status (optional)
  - Details of any foreign persons involved (optional)
you_get:
  - Jurisdiction and classification analysis
  - Licence or agreement needed
  - Compliance checklist
  - Disclosure steps if relevant
how_to_use:
  - "Gather first: the item's USML category if you know it, the commodity classification, the buyer's country and end-user statement, and any foreign persons who will have access."
  - "Warning: do not paste controlled technical data, drawings or specifications into a public AI tool. That could itself be an unauthorised export. Use a tool your organisation has approved for controlled data, or describe the item in general terms only."
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, web access or paid tool is needed.
  - Describe your item or technical data. Say which country it goes to and who the end user is.
  - Add your registration status and any foreign persons who will see the data, if you know them.
  - Read the classification first. Check it names a category and rule section.
  - Check any fees, country lists and recent rule changes on the official DDTC site and the Federal Register.
  - Take the result to trade counsel before you ship, share data or file a disclosure. If you also hold a defense contract, check your security readiness with the Defense contractor security checker.
output_sample:
  input:
    - A description of your item or technical data
    - The destination country and who will use it
    - Your DDTC registration status (optional)
    - Details of any foreign persons involved (optional)
  output:
    - name: Jurisdiction and classification
      contains: Walks through the US Munitions List test, then the commercial rules fallback, with the rule section cited.
    - name: Licence or agreement needed
      contains: Names the form or agreement that fits your deal, such as an export licence or a technical assistance agreement.
    - name: Registration guidance
      contains: Says whether you must register with DDTC and the steps to do it.
    - name: Compliance checklist
      contains: Lists requirements, status and gaps, including foreign national access and a technology control plan.
    - name: Disclosure steps
      contains: Explains how to report a possible violation, with the factors that raise or lower penalties.
