thinking: low
thinking_why: It averages dates by carrier.
new_slug: delivery-time-analyzer
name: Delivery time analyzer
summary: Find which carrier is slow. This delivery time analyzer gives the average days from shipment to delivery for each carrier, from your Shopify orders.
job: run-your-store
headline: Delivery time analyzer
subhead: Average days from shipment to delivery, split by carrier, so you can see which carriers are slow. It reads your fulfilled Shopify orders and measures the time from when the fulfilment was created to when it was delivered.
explain: |
  Average days from shipment to delivery, split by carrier, so you can see which carriers are slow. It reads your fulfilled Shopify orders and measures the time from when the fulfilment was created to when it was delivered.

  You set the store, the look-back window (30 days by default), a minimum number of orders per carrier so tiny samples do not mislead, and optionally a single fulfilment location. Output is a readable table or JSON. It needs a signed-in Shopify command line session with permission to read orders. It only reads data and changes nothing in the store.
when:
  - Customers complain about late parcels and you do not know which carrier is at fault.
  - You are deciding whether to switch carriers.
  - You want to check delivery promises on your product pages against real data.
  - One warehouse seems slower than another.
not_for:
  - "You need live status for one parcel: use the carrier's own tracking page."
  - "Your store ships few orders per carrier: a small sample gives averages you cannot trust, so check a few orders by hand."
  - "You do not use Shopify: this reads Shopify orders only, so use a spreadsheet of your ship and delivery dates instead."
you_give:
  - Shopify store domain
  - Look-back period in days (optional)
  - Minimum orders per carrier (optional)
  - Fulfilment location (optional)
  - Shopify command line access to read orders
you_get:
  - Average delivery days per carrier
  - Order count behind each average
  - Slowest and fastest carriers
  - Table or JSON output
how_to_use:
  - Check that your AI can run code and use the Shopify command line. Install the command line first if you do not have it.
  - Sign in to your store with permission to read orders. This skill only reads data and changes nothing.
  - Paste the skill into your AI. Give your store domain, plus the days back, minimum orders and location if you want them.
  - Check the table. Ignore carriers with few orders, and note how many orders had no delivery date.
  - Open the CSV file to see each shipment, then use the averages to decide whether to change carrier.
output_sample:
  input:
    - Your Shopify store domain
    - How many days back to look (optional, 30 by default)
    - Minimum orders per carrier (optional, 5 by default)
    - One fulfilment location (optional)
    - Table or JSON output (optional)
  prerequisites:
    - An AI that can run code and the Shopify command line
    - A signed-in Shopify session that can read orders
  output:
    - name: Summary table or JSON
      contains: Orders checked, orders with delivery dates, and each carrier's order count, average, fastest and slowest days.
    - name: delivery_analysis CSV file
      contains: One row per shipment with order name, carrier, shipped date, delivered date and days in transit.
    - name: Excluded carriers note
      contains: Carriers with too few orders are left out of the averages.
    - name: In transit count
      contains: Orders with no delivery date yet are left out of averages and counted as in transit.
