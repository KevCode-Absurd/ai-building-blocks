thinking: low
thinking_why: It averages dates by carrier.
new_slug: delivery-time-analyzer
name: Delivery time analyzer
summary: Compare fulfilment-to-delivery times by carrier and location. Get averages, order counts and missing-date notes.
job: run-your-store
headline: Delivery time analyzer
subhead: See days from when Shopify logs a shipment to its recorded delivery. Filter by where it shipped from. Check how many orders each average covers.
explain: |
  See average, shortest and longest elapsed times by carrier. The measure starts when Shopify creates the fulfilment, which may be before carrier pickup. It can include warehouse handling and does not prove who caused a delay.

  The window selects orders created in that period, not every shipment sent then. A location filter is applied to the actual fulfilments before averages are calculated. The minimum counts distinct orders, even when an order has several shipments. It is a display setting, not a test of statistical significance.

  Add the full skill folder so your AI can collect the records and run its local scripts. You get JSON and CSV reports with missing dates and other gaps. A missing delivery date is not labelled as a parcel in transit. The skill changes nothing in the store. AI Blocks checked API fields in the official documentation but has not run this against a live store.
when:
  - Customers report late parcels and you want to compare the recorded times.
  - You are deciding whether to switch carriers.
  - You want to check delivery promises on your product pages against real data.
  - One warehouse seems slower than another.
not_for:
  - "You need live status for one parcel: use the carrier's own tracking page."
  - "Your store ships few orders per carrier: a small sample gives averages you cannot trust, so check a few orders by hand."
  - "You do not use Shopify: this reads Shopify orders only, so use a spreadsheet of your ship and delivery dates instead."
you_give:
  - Shopify store domain
  - Look-back period in days (optional)
  - Minimum orders per carrier (optional)
  - Fulfilment location (optional)
  - Shopify command line access to read orders
you_get:
  - Average delivery days per carrier
  - Order count behind each average
  - Slowest and fastest carriers
  - CSV rows for the collected, filtered fulfilments, plus a JSON report
how_to_use:
  - Check that your AI can run code and use the Shopify command line. Install the command line first if you do not have it.
  - Sign in to your store with permission to read orders. This skill only reads data and changes nothing.
  - Add the full skill folder, including scripts. Give your store domain, window, minimum orders and optional location.
  - Check the table. Ignore carriers with few orders, and note how many orders had no delivery date.
  - Open the CSV file to see each shipment, then use the averages to decide whether to change carrier.
  - Pair the result with the WISMO bulk status report to see if slow carriers drive "where is my order" tickets. Run it again each month and before any carrier change.
output_sample:
  input:
    - Your Shopify store domain
    - How many days back to look (optional, 30 by default)
    - Minimum orders per carrier (optional, 5 by default)
    - One fulfilment location (optional)
    - Table or JSON output (optional)
  prerequisites:
    - An AI that can run code and the Shopify command line
    - A signed-in Shopify session that can read orders
  output:
    - name: Summary table or JSON
      contains: Each carrier's distinct order count, fulfilment count, average, shortest and longest elapsed days, with coverage notes.
    - name: delivery_analysis CSV file
      contains: One row per filtered fulfilment with location, carrier, creation date, delivery date, elapsed days and status.
    - name: Excluded carriers note
      contains: Carriers with too few orders are left out of the averages.
    - name: Missing delivery dates
      contains: Fulfilments without a delivery date are counted as missing dates and excluded from averages. Their transit status is unknown.
