thinking: high
thinking_why: Picking a method depends on the sales pattern.
new_slug: demand-forecast-planner
name: Demand forecast planner
summary: Turn your past sales into a demand forecast. It picks the method that fits your sales pattern and shows how far off the forecast tends to be.
job: plan-supply-chain
headline: Demand forecast planner
subhead: A sales forecast you can trust, with a measure of how wrong it tends to be. Give it your past sales and you get a projection, the method that fits best, and a way to track error over time.
explain: |
  A sales forecast you can trust, with a measure of how wrong it tends to be. Give it your past sales and you get a projection, the method that fits best, and a way to track error over time.

  It starts by asking what decisions depend on the forecast, how far ahead you plan, and how much history you have. Two years is ideal. Then it looks at patterns: steady, seasonal, trending, intermittent or driven by promotions, and treats new and mature products differently. It tests several methods against held-back data, compares their error, and picks one. It explains what to do with outside factors such as weather and events.
when:
  - You plan purchasing from a gut feel and want numbers behind it.
  - Sales are seasonal and last year's total is a poor guide.
  - You launched a product and have only a few weeks of data.
  - You want to know whether your current forecast is biased high or low.
not_for:
  - "You have fewer than about 12 periods of sales history: use a simple moving average in a spreadsheet instead."
  - "You are launching a new product with no sales yet: use a planner's own estimate, then switch to this once sales come in."
  - "You only need to know how much stock to hold for one item: a simple reorder rule or your supplier's advice will be quicker."
you_give:
  - Sales history by product or period
  - Planning horizon
  - Promotions or events (optional)
  - Current forecast method and accuracy (optional)
you_get:
  - Forecast for the horizon
  - Best-fit method and why
  - Accuracy comparison
  - Error tracking routine
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Paste your past sales by product and period. Two years of history is best.
  - Tell your AI how far ahead you plan and what decisions the forecast feeds. Add promotion dates if you have them.
  - Answer any questions it asks about your sales pattern, such as seasonal or one-off spikes.
  - Check the method it picked and the error figures. Treat any target accuracy numbers as starting points to test against your own history.
  - If you want it to test several methods on held-back data, use an AI that can run code. It uses free Python packages such as statsmodels. The skill also names paid planning software, which you do not need.
  - Next, use the forecast in your reorder and purchasing plan. Each month, compare the forecast with what sold and track the error.
output_sample:
  input:
    - Your past sales by product and period
    - How far ahead you plan (daily, weekly or monthly)
    - Your promotion and event dates (optional)
    - Your current forecast method and how accurate it is (optional)
  prerequisites:
    - An AI that can run code, for the best results with testing and charts
  output:
    - name: Executive Summary
      contains: Current forecast accuracy, what changed from the last forecast, and the main assumptions and risks.
    - name: Demand Forecast by Segment
      contains: A table by product, place and period with the statistical forecast, adjusted forecast, last actuals, error and bias. All figures come from your data.
    - name: Forecast Assumptions
      contains: Your promotion calendar, market trends, product launches and known supply limits.
    - name: Accuracy Metrics
      contains: Error by category, bias, tracking signals and forecast against actual results.
    - name: Action Items
      contains: Items to review, overrides needed, data problems and ways to improve the process.
