thinking: low
thinking_why: It runs scans and reads the output.
new_slug: dependency-risk-scanner
name: Dependency risk scanner
summary: Scan your project's packages for known security holes. Get a risk report, a parts list (SBOM) and a licence check, with fixes.
job: secure-code
headline: Dependency risk scanner
subhead: Point it at your project. Get known weak spots in packages found, plus a parts list and license check. Bring project folder with manifest and lock files. Use the result to plan your next step.
explain: |
  A list of the weak spots in the packages your project uses, plus a parts list and a licence check. Point it at your project and it finds your manifest files, reads lock files to see indirect packages too, and checks each version against public vulnerability databases.

  It compares licences to your policy and warns about ones that force you to open your own code. It then writes a software bill of materials in CycloneDX or SPDX format and a report sorted by severity. Last, it suggests the smallest upgrades that fix each problem without breaking things. It names the right audit tool for your language, such as npm audit or pip-audit, and can fit into your build checks.
when:
  - Security asks for a software bill of materials.
  - A new vulnerability is in the news and you need to know if you use it.
  - You want checks on every build to catch bad packages early.
  - You need to know which package has a licence that conflicts with yours.
not_for:
  - Your project has no manifest or lock file. Add one first, or ask a developer to list the packages by hand.
  - Your company already pays for a scanner under contract. Use your vendor's scanner so the results match what your auditors see.
  - You want to test a live site or server for attacks. Hire a security tester, since this only reads package lists.
  - You need a legal ruling on a licence. The licence flags are a starting point, so have a lawyer review any copyleft or conflicting licence before you ship.
you_give:
  - Project folder with manifest and lock files
  - Licence policy (optional)
  - Build system you use (optional)
you_get:
  - Vulnerability report by severity
  - Licence compliance flags
  - Software bill of materials
  - Minimum upgrades to fix problems
how_to_use:
  - Open your AI in a tool that can run code and read files. Give it internet access.
  - Paste this skill into the chat, or load the skill folder. Install the audit tool for your language first, such as npm audit for Node or pip-audit for Python.
  - Point it at your project folder, or at one manifest file.
  - Add your licence policy and build system if you have them. Confirm your project's licence policy first. Without one, the licence check cannot say much.
  - Run the audit command for your language, for example npm audit --json for Node or pip-audit -r requirements.txt for Python, and let your AI read the result.
  - Your AI will propose changes to your manifest and lock files as a diff. Approve each one before it writes anything. It must never write a file without your yes.
  - Read the report from the top. Fix Critical and High items first.
  - Run your tests after any upgrade it suggests. Upgrades can break things. Check each CVE ID and fixed version against NVD or OSV before you change a package.
  - Next, send the bill of materials to your security person, and log each upgrade before you merge it.
output_sample:
  input:
    - Your project folder with manifest and lock files
    - Your licence policy (optional)
    - The build system you use (optional)
    - A path to one manifest file, if you do not want a full scan (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Internet access, so your AI can check public advisory databases
    - The audit tool for your language, such as npm audit or pip-audit, installed
    - A paid Snyk account, only if you want to use Snyk
  output:
    - name: Dependency tree
      contains: Every direct and indirect package found, with versions, and any package used in code but missing from the manifest.
    - name: Vulnerability report
      contains: Known problems sorted by severity, with CVE numbers, the package path, and the fixed version if one exists.
    - name: Licence check
      contains: Each package's licence compared with your policy, with flags for copyleft, missing and conflicting licences.
    - name: Software bill of materials
      contains: A full parts list of your packages in CycloneDX or SPDX format.
    - name: Fix suggestions
      contains: The smallest upgrades that clear each problem, updated manifest files where possible, and notes where no fix exists.
