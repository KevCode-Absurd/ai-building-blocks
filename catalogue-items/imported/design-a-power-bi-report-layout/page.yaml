how_it_works:
  - title: Define decisions and data
    text: Connect the audience’s questions to metric definitions, data grain and report constraints.
  - title: Choose visuals and interactions
    text: Specify chart roles, filter scope, drill-through, navigation and mobile stacking.
  - title: Specify validation
    text: Check readable labels, alternative text, keyboard use and realistic user tasks.
