thinking: medium
thinking_why: It judges a design from what it sees.
new_slug: design-feedback-giver
name: Design feedback giver
summary: Share a mockup or Figma link. Get feedback on usability, hierarchy and
  consistency, with fixes.
job: design-work
headline: Design feedback giver
subhead: Share a mockup or Figma link. Get feedback on usability, hierarchy and
  consistency, with fixes. Bring figma link, screenshot or description. Use the
  result to plan your next step.
explain: |
  Straight feedback on a design, in the order a user would meet it. Share a Figma link, screenshot or description and you get a critique that covers first impression, usability, hierarchy and consistency, each with a specific fix.

  It starts with the two-second test: what the eye hits first, what feeling it gives and whether the purpose is clear. Then it asks if a person can reach their goal and whether navigation makes sense. It checks the visual order, spacing and style consistency. You tell it what stage the work is at and who it is for, so the advice fits an early sketch or a final screen. You can ask it to focus on mobile or one flow.
when:
  - You have a mockup and want a second pair of eyes before review.
  - Your team debates a layout and needs a neutral opinion.
  - You want to test a flow on mobile before building it.
  - A stakeholder says it feels off and you need to name why.
you_give:
  - Figma link, screenshot or description
  - What it is and who it is for
  - "Stage: exploring, refining or final"
  - Focus area (optional)
you_get:
  - First-impression read
  - Usability issues
  - Hierarchy and consistency notes
  - Fixes ranked by importance
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can open images or Figma links.
