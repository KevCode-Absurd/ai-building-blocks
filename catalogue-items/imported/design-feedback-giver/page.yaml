thinking: medium
thinking_why: It judges a design from what it sees.
new_slug: design-feedback-giver
name: Design feedback giver
summary: Get design feedback on a mockup, Figma link or screenshot. You get usability, hierarchy and consistency notes, plus fixes ranked by impact.
job: design-work
headline: Design feedback giver
subhead: Share a mockup or Figma link. Get feedback on usability, hierarchy and consistency, with fixes. Bring figma link, screenshot or description. Use the result to plan your next step.
explain: |
  Straight feedback on a design, in the order a user would meet it. Share a Figma link, screenshot or description and you get a critique that covers first impression, usability, hierarchy and consistency, each with a specific fix.

  It starts with the two-second test: what the eye hits first, what feeling it gives and whether the purpose is clear. Then it asks if a person can reach their goal and whether navigation makes sense. It checks the visual order, spacing and style consistency. You tell it what stage the work is at and who it is for, so the advice fits an early sketch or a final screen. You can ask it to focus on mobile or one flow.
when:
  - You have a mockup and want a second pair of eyes before review.
  - Your team debates a layout and needs a neutral opinion.
  - You want to test a flow on mobile before building it.
  - A stakeholder says it feels off and you need to name why.
not_for:
  - "You need proof that real people can use it: run a usability test with real users."
  - "You need a formal accessibility audit: hire an accessibility specialist. This only gives a quick check of contrast, touch size and text."
  - "You only have a rough idea and no design yet: sketch it first, then share the sketch."
you_give:
  - Figma link, screenshot or description
  - What it is and who it is for
  - "Stage: exploring, refining or final"
  - Focus area (optional)
you_get:
  - First-impression read
  - Usability issues
  - Hierarchy and consistency notes
  - Fixes ranked by importance
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill's instructions.
  - Share your design. Add a screenshot, a Figma link or a short written description.
  - Say what the design is, who it is for and what stage it is at. Add a focus area if you have one.
  - Read the Priority Recommendations first. Then check the Usability table for critical issues.
  - If your AI cannot open Figma links, paste a screenshot instead. Fix the top three items, then ask for a second round.
output_sample:
  input:
    - Your Figma link, screenshot or a written description of the design
    - What the design is and who it is for
    - "The stage: exploring, refining or final"
    - A focus area, like mobile or one flow (optional)
  prerequisites:
    - An AI that can open images (for screenshots)
    - Figma access for your AI if you share a Figma link (optional, you can paste a screenshot or description instead)
  output:
    - name: Overall Impression
      contains: "A one or two sentence first reaction: what works and the biggest chance to improve."
    - name: Usability
      contains: A table of issues, each marked critical, moderate or minor, with a fix.
    - name: Visual Hierarchy
      contains: What the eye hits first, how it moves through the layout, and whether the right things stand out.
    - name: Consistency
      contains: A table of type, spacing and color mismatches, each with a fix.
    - name: Accessibility
      contains: A quick read on color contrast, touch target size and text readability.
    - name: What Works Well
      contains: The parts of the design to keep.
    - name: Priority Recommendations
      contains: The top three changes in order, with why and how for each.
