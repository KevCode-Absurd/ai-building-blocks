thinking: medium
thinking_why: It reads many visual cues and fits them to a fixed profile.
new_slug: design-style-analyst
name: Design style analyst
summary: Share screenshots or links of designs you like. Get a design style profile with colors, type, feel and effects that you can reuse on new pages.
job: design-work
headline: Design style analyst
subhead: A reusable profile of a look you like. Share screenshots or links to designs you admire and you get a structured file with the colours, type, spacing, overall feel and any special effects, which you can then use to guide new designs.
explain: |
  A reusable profile of a look you like. Share screenshots or links to designs you admire and you get a structured file with the colours, type, spacing, overall feel and any special effects, which you can then use to guide new designs.

  It has three parts. The design system covers measurable values: colour, type, spacing, shape and motion. The design style covers the feel: mood, composition, imagery and brand voice. Visual effects cover things like canvas or 3D scenes, particles, shaders and scroll animation. The three work in three phases: see the schema, extract a profile from references, or generate a design from a profile plus your content. The skill installs a few helper packages from the web (npm install) when it measures colors. This is zanwei's design-dna skill, shared under the MIT licence.
when:
  - You love a competitor's site and want to capture its look, not copy its code.
  - You need to brief a designer using real examples.
  - You want new pages to match a style from several references.
  - You have a saved style file and want a page made from it.
not_for:
  - "You want to copy a competitor's exact layout or assets: hire a designer, or make your own version from the profile."
  - "You already have a brand guide: use the brand guide, because it holds your own rules."
  - "You only want a quick opinion on a design: ask your AI to describe it in chat, with no profile."
you_give:
  - Screenshots or links of reference designs
  - Your content for the new page (optional)
  - Saved style profile (optional)
you_get:
  - Design token set
  - Written style description
  - Visual effects notes
  - Structured style file
  - Design made from the profile (optional)
how_to_use:
  - Add the whole skill folder (the SKILL.md file, the references folder and the scripts folder) to your AI tool, for example in Claude Code, or upload the zip. A pasted SKILL.md alone has no schema file and no color script. For screenshot files the skill then measures colors exactly. That needs Node.js and an AI that can run code. Without them, it can only estimate colors by eye, and they can be off.
  - A link with no screenshot only gets colors estimated by eye. Give it screenshot files when exact colors matter.
  - Add your screenshots or links. Say you want a style profile.
  - Read the profile. Fix any value that looks wrong, then ask for changes.
  - To make a page, paste your content and the profile, and ask for a design.
  - Only let it fetch logos, photos or text from a link you own or have the right to use. For another brand's look, it recreates the style from the profile and never copies their assets. Check that anything it fetched is licensed for your use before you reuse it.
  - Save the Design DNA file. Next time, paste it with your content to make a new page, or give it to your designer next to your brand guide.
output_sample:
  input:
    - Screenshots or links of designs you like
    - Your content for a new page (optional)
    - A style profile you saved before (optional)
  prerequisites:
    - Node.js on your computer, only if you want exact color measurement from screenshot files (the skill runs npm install for its own helper scripts)
    - An AI that can run code and read files, for the color measurement step
    - Rights to reuse any images or assets the AI fetches from a link
  output:
    - name: design_system
      contains: Measured values for color, type, spacing, layout, shape, shadows, motion and components.
    - name: design_style
      contains: The mood, visual language, composition, imagery, interaction feel and brand voice of the look.
    - name: visual_effects
      contains: Notes on canvas, 3D, particles, shaders and scroll effects, with each effect marked on or off.
    - name: Design DNA JSON
      contains: One structured file with all three parts filled in, ready to reuse.
    - name: Generated design
      contains: A self-contained web page built from your profile and your content, if you ask for one.
    - name: Color check report
      contains: A pass or fail score of the new design's colors against the measured colors.
