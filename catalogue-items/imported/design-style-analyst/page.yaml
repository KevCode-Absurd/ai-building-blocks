thinking: medium
thinking_why: It reads many visual cues and fits them to a fixed profile.
new_slug: design-style-analyst
name: Design style analyst
summary: Share screenshots or links of designs you like. Get their colors, type,
  feel and effects as a profile you can reuse.
job: design-work
headline: Design style analyst
subhead: A reusable profile of a look you like. Share screenshots or links to
  designs you admire and you get a structured file with the colours, type,
  spacing, overall feel and any special effects, which you can then use to guide
  new designs.
explain: |
  A reusable profile of a look you like. Share screenshots or links to designs you admire and you get a structured file with the colours, type, spacing, overall feel and any special effects, which you can then use to guide new designs.

  It has three parts. The design system covers measurable values: colour, type, spacing, shape and motion. The design style covers the feel: mood, composition, imagery and brand voice. Visual effects cover things like canvas or 3D scenes, particles, shaders and scroll animation. The three work in three phases: see the schema, extract a profile from references, or generate a design from a profile plus your content.
when:
  - You love a competitor's site and want to capture its look, not copy its code.
  - You need to brief a designer using real examples.
  - You want new pages to match a style from several references.
  - You have a saved style file and want a page made from it.
you_give:
  - Screenshots or links of reference designs
  - Your content for the new page (optional)
  - Saved style profile (optional)
you_get:
  - Design token set
  - Written style description
  - Visual effects notes
  - Structured style file
  - Design made from the profile (optional)
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
