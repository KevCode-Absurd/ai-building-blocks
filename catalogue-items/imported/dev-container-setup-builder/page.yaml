new_slug: dev-container-setup-builder
name: Dev container setup builder
summary: "Set up a dev container for your project. You get a .devcontainer folder with tools for your languages and saved settings. Needs the base template files, which are not included."
job: build-software
headline: Dev container setup builder
subhead: Give your AI your project folder. It finds your project name and languages, then writes the dev container files. You get a workspace that sets up the same way each time. Read this first. The container gets extra network rights (NET_ADMIN) and installs three outside plugin collections, so you must trust what you approve. The base template files are not included, and nothing is written until you supply them.
explain: |
  A .devcontainer folder that opens your project in the same clean, sandboxed workspace every time, with Claude Code and the right language tools already installed. No more "works on my machine".

  The skill looks at your project first. It reads package.json, pyproject.toml, Cargo.toml or go.mod to find the project name, and checks file types to detect your languages. Then it writes the configuration: a Dockerfile, the container settings, and volumes that keep your command history and tool settings between rebuilds. It is meant for development only, not for production deployment. If you already have a working dev container, it is better to edit that one by hand.

  Setting it up is a trust decision. The container gets extra network rights (NET_ADMIN) and installs three outside plugin collections, so read what you approve. It is a sandbox only in the sense that your project runs in a container, not a guarantee of safety.

  Licences, file by file. The skill text (SKILL.md) is under CC BY 4.0, from the LICENSE-CONTENT file. It was first written in the vibeship-spawner-skills project (Apache 2.0) and reached us through sickn33's collection. The two reference files in the references folder are under CC BY-SA 4.0, from the UPSTREAM-LICENSE.txt file. The base template files are not included, so no licence from this item covers them. Check the licence in the trailofbits/skills repository before you use them. Keep the credit if you share any of it.
when:
  - You want a safe sandbox for running an AI coding agent on your code.
  - New teammates lose a day installing tools before they can run the project.
  - Your project uses more than one language and the setup is fiddly.
  - You need your shell history and settings to survive when the container is rebuilt.
not_for:
  - "You already have a working dev container and only need a small change: edit the files by hand."
  - "You want to deploy your app to production: use your hosting provider's container steps, as this is for development only."
  - "You have a general Docker question: ask your AI directly or read the Docker docs."
you_give:
  - Your project folder
  - The languages or tools you use (optional)
  - Anything the container must install (optional)
  - Ports your app needs open (optional)
you_get:
  - A .devcontainer folder with all config files
  - A Dockerfile with your language tools
  - Saved volumes for history and settings
  - A short note on how to open it
how_to_use:
  - "Before you start: the skill cannot run without its base template files, and they are not included here. If they are missing, it stops, says so and writes nothing. Get them first (see the third step)."
  - Open your project folder in an AI that can read and write files, such as Claude Code. A plain chat can only give you the file text to copy.
  - "Paste the skill and say: set up a devcontainer for this project. Add any languages or ports you need."
  - First get the base template files. They are not included here. They live in the same skill folder of the trailofbits/skills repository on GitHub (a Dockerfile, devcontainer.json, post_install.py, .zshrc and install.sh). Give them to your AI. If it has none, it stops and says so, and writes nothing.
  - Before you accept the files, read them. The skill asks you to approve three things one by one. The container gets extra network rights (NET_ADMIN). It installs plugin collections from other people (anthropics/skills, trailofbits/skills and trailofbits/skills-curated). The deletion of your existing .venv folder is off by default and only goes in if you say yes.
  - Open the project in VS Code and choose Reopen in Container. Or run devcontainer up --workspace-folder . in your terminal.
  - Once it opens, run your tests and build to confirm it works. Then commit the .devcontainer folder so teammates get the same setup.
output_sample:
  input:
    - Your project folder, with files like package.json, pyproject.toml, Cargo.toml or go.mod
    - Languages or tools you want added (optional)
    - Ports your app needs open (optional)
  prerequisites:
    - An AI that can read your project files and write new files
    - VS Code with the Dev Containers extension, or the devcontainer command line tool, and Docker to open the result
  output:
    - name: Dockerfile
      contains: The build steps for the container, with Python and Node tools plus the helper tools your project needs.
    - name: devcontainer.json
      contains: "The container settings: editor add-ons, saved volumes, and the setup commands that run after the container is created."
    - name: post_install.py
      contains: The script that finishes setup once the container is created.
    - name: .zshrc
      contains: Your shell settings inside the container.
    - name: install.sh
      contains: A helper that adds the devc command for managing the container.
    - name: Start instructions
      contains: A short note on how to open the project in the container.
