thinking: medium
thinking_why: It fits known community methods to your audience.
new_slug: developer-community-builder
name: Developer community builder
summary: Describe your developers. Get a plan for channels, onboarding and
  events that grows a Discord or forum.
job: grow-social
headline: Developer community builder
subhead: Describe your developers. Get a plan for channels, onboarding and
  events that grows a Discord or forum. Bring a short description of your
  developers. Use the result to plan your next step.
explain: |
  A plan for a developer community that people actually join and stay in, covering where it lives, how it is laid out and how new members get started.

  The skill begins with who your developers are, where they already talk, and how they write to each other. Then it compares platforms such as Discord, Slack, GitHub Discussions, Discourse and Circle, and picks one that fits your audience. It lays out channels with clear purposes, welcome steps for new members, rules, moderation habits, and events and programmes that keep people returning. You can use it for a new community or to fix one that has gone quiet.
when:
  - You are launching a Discord or forum for the people who use your product.
  - Your community has members but almost nobody posts.
  - You cannot decide between Discord, Slack and a forum.
  - New members join, look around and leave because they do not know where to
    start.
you_give:
  - A short description of your developers
  - Your product and what it does
  - Platforms you already use (optional)
  - Your team's time for moderation
you_get:
  - A platform recommendation with reasons
  - A channel layout with the purpose of each
  - A new-member welcome flow
  - Community rules and moderation guidance
  - An events and engagement calendar
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
