thinking: medium
thinking_why: It chooses a diagram type, then lays it out with set rules.
new_slug: diagram-maker
name: Dark-theme diagram maker
summary: Describe a system, process or idea. Get a dark-theme diagram as an SVG file (an image that stays sharp at any size).
job: design-work
headline: Dark-theme diagram maker
subhead: Bring the parts, links or steps to show. It chooses a diagram type, plans the layout and writes one SVG file (an image that stays sharp at any size) with local styles. It checks spacing and can make a high-resolution PNG with the required tool. Fonts may use a remote import or system fallback, so appearance can vary. Unrendered files still need a visual check.
explain: |
  A clean SVG diagram in a dark theme, saved as one file you can open in any browser, drop into slides or edit later. The styles are built in. It loads the JetBrains Mono font from Google Fonts, so it needs internet access to show that font.

  Pick from nine types: architecture, flowchart, sequence, structure (classes, ER, org charts), mind map, timeline, illustrative, state machine and data flow. The skill uses a fixed colour system so meaning stays consistent: cyan for front-end and user-facing parts, green for back-end services, violet for storage, amber for cloud and infrastructure. Describe your system, process or idea in words, and it chooses a fitting type and lays out the boxes, arrows and labels. Check the result against what you meant, since the AI draws what you describe and may miss a link. This is Jim Liu's baoyu-diagram skill, shared under the MIT licence.
when:
  - You need an architecture picture for a document and have no design tool open.
  - You want a flowchart of a process your team follows.
  - Messages between services are hard to explain in text, so you want a sequence diagram.
  - You need a mind map or timeline that looks tidy without drawing by hand.
not_for:
  - "You need a chart of numbers or a spreadsheet view: use a chart tool or Google Sheets instead."
  - "You want a light, print-ready or brand-styled diagram: draw it by hand or in a design tool, since this skill only makes a dark theme."
  - "You need a photo, logo or detailed illustration: ask a designer or use an image tool instead."
you_give:
  - A description of the system, process or idea
  - The diagram type you want (optional)
  - Names of the parts to include
  - Labels or groupings you care about (optional)
you_get:
  - One self-contained SVG file
  - A diagram type chosen to fit your content
  - Colour-coded boxes, arrows and labels
  - A file you can edit or embed
how_to_use:
  - Open your AI tool. Use one that can run code and save files. A plain chat can write the SVG text, but cannot make the PNG.
  - Paste the skill, or upload its folder if your AI takes files.
  - Describe your system, process or idea. List the parts to include. Name a diagram type if you have a preference.
  - 'Example: say "A shop site calls an API, which reads orders from a database and sends emails through a queue." Your AI picks an architecture diagram and saves a .svg file plus a matching @2x .png.'
  - Open the SVG in a browser. Check that no text spills out of a box and no arrows cross labels. Ask for fixes. Then drop the SVG or PNG into a document or slide deck, or ask your AI to change labels or layout and save a new version.
  - "Know the limits: the SVG loads the JetBrains Mono font from Google Fonts, so it needs internet to show that font. The PNG step needs bun or npx installed, and npx downloads bun from the web. Without either you still get the SVG. Skip the PNG."
  - Next, paste the PNG into a slide deck or a document. Send the SVG to a designer if you want a brand-styled version.
output_sample:
  input:
    - A plain description of your system, process or idea
    - The names of the parts to include
    - The diagram type you want (optional)
    - Labels or groupings you care about (optional)
  prerequisites:
    - An AI that can run code and save files, to write the SVG and PNG
    - Bun or npx installed, to make the PNG
    - Internet access to load the JetBrains Mono font when you view the SVG
  output:
    - name: Diagram SVG
      contains: One standalone dark-themed diagram with colour-coded boxes, arrows, labels, a legend and a title block.
    - name: Diagram PNG at 2x
      contains: A sharper picture version of the same diagram, saved next to the SVG, ready for slides or documents.
