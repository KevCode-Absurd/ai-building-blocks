thinking: low
thinking_why: It applies a short set of pricing rules to your product.
new_slug: digital-product-pricer
name: Digital product pricer
summary: Set the price for your course, ebook or template. Get the digits, lead magnet wording and launch offer for your digital product pricing.
job: set-prices
headline: Digital product pricer
subhead: The exact price digits, labels and launch discount for a course, ebook or other digital product. Digital goods have no materials cost to hint at quality, so the price itself carries more weight.
explain: |
  The exact price digits, labels and launch discount for a course, ebook or other digital product. Digital goods have no materials cost to hint at quality, so the price itself carries more weight.

  First, it classifies your product as bought for pleasure or for practical use. Then it applies a short set of rules. An unknown seller should use a rounded price, such as $100 rather than $97. A buyer who already tried a sample can see a just-below price. Pre-orders far out get a bonus instead of a percentage off. Lead magnets are "for $0", never "FREE". Pick-your-price offers use three or four fixed options, not pay what you want.
when:
  - You are about to price your first course or ebook and cannot choose between $97 and $100.
  - You plan a pre-order and are unsure if you should discount or add a bonus.
  - Your free download page uses the word FREE and you wonder if that hurts.
  - You want to offer a few price tiers and need to set them well.
not_for:
  - You sell a membership or monthly plan. The skill points to a subscription pricing skill that is not in this library yet, so use a simple tier table of your own.
  - You do not yet know how much people will pay. Ask 5 to 10 likely buyers first, because this skill sets digits and wording, not demand.
  - You sell a physical product. Shipping and materials change the price signals, so do not use this page for it.
you_give:
  - What you sell and your planned price
  - Whether you are an individual or a known publisher
  - If buyers get a sample first
  - Launch date and any offer idea (optional)
you_get:
  - The price digits to use
  - Wording for lead magnets and offers
  - A pre-order bonus or discount choice
  - Pick-your-price tier levels
  - A short reason for each choice
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text from this page into the chat.
  - "Gather your numbers first: planned price, launch date, weeks until launch, and whether buyers get a free sample."
  - Tell your AI what you sell and whether you are an individual or a known publisher.
  - Read each price choice and its reason. Ask your AI to explain any you doubt.
  - Before you change your full price, test it. Compare two prices on your launch page for a fixed period, record sales at each, and keep the one that sold more.
output_sample:
  input:
    - What you sell and the price you plan
    - Whether you are an individual or a known publisher
    - Whether buyers try a free sample first
    - Your launch date and how far away it is
    - Any offer idea, such as a pre-order or pick-your-price (optional)
  output:
    - name: Price
      contains: The price digits to use, rounded or just-below, with the reason for the choice.
    - name: Sale/upgrade price
      contains: A just-below price for launch week or an upgrade, if it fits your product.
    - name: Pre-order offer
      contains: A bonus or a discount, picked by how far away the launch is.
    - name: Lead magnet wording
      contains: Wording for your free download that says "for $0" instead of "FREE".
    - name: Participative pricing
      contains: Three or four fixed price options instead of pay what you want.
    - name: Why
      contains: One short line of reasoning for each choice above.
