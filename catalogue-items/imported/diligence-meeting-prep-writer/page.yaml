thinking: medium
thinking_why: It tailors questions to the situation.
new_slug: diligence-meeting-prep-writer
name: Diligence meeting prep writer
summary: "Prep for a diligence meeting: give the meeting type and company, and get ranked questions, benchmarks and red flags to probe on one page."
job: money-and-investing
headline: Diligence meeting prep writer
subhead: A question list for a diligence meeting, ordered by priority, with the red flags to probe. You walk in knowing what to ask and what a weak answer sounds like.
explain: |
  A question list for a diligence meeting, ordered by priority, with the red flags to probe. You walk in knowing what to ask and what a weak answer sounds like.

  Start by naming the meeting type: management presentation, expert call, customer reference, advisor check-in or site visit. Add who attends, which area you are focused on, what you already know from the data room, and your main worries. The skill then builds the questions by topic. For a management meeting those include business overview, revenue and growth, competitive position, and operations. Early questions warm the room up, and later ones go after the numbers. Benchmarks help you judge the answers.
when:
  - You have a management presentation with a target company next week.
  - You are about to speak with a customer reference and need sharp questions.
  - The data room raised concerns and you want to test them live.
  - A teammate will lead the call and needs a briefing sheet.
not_for:
  - "You need a final investment decision: ask a senior advisor or write a full diligence memo."
  - "You have no documents or data room access: first ask the company for its basic files, then come back."
  - "You want a script to read word for word: use your own judgment, since this gives a guide, not a script."
  - "You plan to ask an expert or customer for confidential or inside information: don't. Follow your firm's and the expert network's rules."
you_give:
  - The meeting type and attendees
  - The company and its sector
  - What you already learned from documents
  - Your biggest concerns (optional)
you_get:
  - Questions grouped by topic and priority
  - Warm-up questions to open the meeting
  - Benchmarks to compare answers against
  - Red flags to listen for
  - Follow-up probes
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini and paste in the skill text. It needs no code, files or paid tools.
  - "Say which meeting it is: management presentation, expert call, customer reference, advisor check-in or site visit."
  - Add who attends, your focus area, what you know from the data room, and your main worries.
  - Check the benchmarks. Ask your AI for the source of each one, and mark any number without a source as to verify.
  - Pick your must-ask questions and print the one-page prep sheet.
  - "End the meeting by asking: what haven't we asked that we should? Afterwards, write up your notes and send the follow-up request to the company."
output_sample:
  input:
    - The meeting type, such as management presentation, expert call or customer reference
    - Who attends from the company or a third party
    - Your focus area, such as financial, commercial, operational or tech
    - What you already know from the CIM or data room (optional)
    - Your main concerns (optional)
  output:
    - name: Meeting logistics
      contains: Who attends, when and where it happens, and how long it runs.
    - name: Objectives
      contains: The top three things you need to learn from this meeting.
    - name: Question list
      contains: Ranked questions grouped by topic, with the must-asks starred, kept to 15 to 20.
    - name: Benchmarks
      contains: Key numbers to compare answers against, such as growth rates and margins, with the source of each.
    - name: Red flags
      contains: Specific items to probe, like gaps in the CIM, customer concentration or team departures.
    - name: Follow-up items
      contains: What to ask the company to send after the meeting.
