thinking: medium
thinking_why: It applies set copy frameworks to your offer.
new_slug: direct-response-copywriter
name: Direct response copywriter
summary: Describe your offer. Get headlines, emails, calls to action or a full
  sales page that sells.
job: write-landing-page
headline: Direct response copywriter
subhead: Describe your offer. Get headlines, emails, calls to action or a full
  sales page that sells. Bring a description of your offer. Use the result to
  plan your next step.
explain: |
  Copy that reads like a person talking and still pushes the reader to act: headlines, emails, calls to action or a full sales page.

  The method treats the headline as most of the job. Its main formula is an action, a specific result, and a timeframe or contrast, as in "days, not weeks". It also teaches story headlines and specific-fact headlines drawn from famous ads. The voice rule is simple: write to a smart friend who is sceptical but curious, and back every claim with a detail. Describe your offer, your buyer and what they get, and you get drafts built on those principles.
when:
  - Your sales page gets visits but few sign-ups.
  - You need ten headline options for one offer.
  - A launch email sequence has to be written by Friday.
  - Your current copy sounds like a brochure, not a person.
you_give:
  - A description of your offer
  - Who it is for
  - The main result buyers get
  - Proof such as numbers or testimonials (optional)
  - "The format you need: headline, email or page"
you_get:
  - Headline options built from proven formulas
  - Email or page copy in a natural voice
  - Calls to action
  - A reason behind each copy choice
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
