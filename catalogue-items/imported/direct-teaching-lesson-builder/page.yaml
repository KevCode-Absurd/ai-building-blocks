thinking: medium
thinking_why: It follows a fixed lesson order and fills in each part.
new_slug: direct-teaching-lesson-builder
name: Direct teaching lesson builder
summary: Build a direct teaching lesson plan from one skill. You get a lesson that moves from teacher modelling to guided practice to independent work.
job: teach-and-train
headline: Direct teaching lesson builder
subhead: A lesson plan where the teacher shows the skill first, the class tries it together next, and then each learner does it alone. This gradual hand-over, backed by research on explicit instruction, helps new skills stick.
explain: |
  A lesson plan where the teacher shows the skill first, the class tries it together next, and then each learner does it alone. This gradual hand-over, backed by research on explicit instruction, helps new skills stick.

  You give the skill to teach, the learners' age and prior knowledge, and how much time you have. The skill builds three stages: I do (the teacher models and thinks aloud), We do (guided practice with prompts and quick checks), and You do (independent work). It sizes each stage to your lesson time. It draws on work by Rosenshine, Archer and Hughes, and Hattie. Use it for maths methods, writing steps, science procedures or any clear skill.
when:
  - You need to teach a step-by-step skill and want a tight lesson structure.
  - Learners nod along but cannot do the task alone afterwards.
  - You are planning a short lesson with a fixed time limit.
  - A new teacher needs a clear model to build lessons from.
not_for:
  - "You want open-ended discussion or debate: plan that with a simple list of questions, as this lesson is built for teaching one clear skill."
  - "Your learners already do the skill well on their own: skip the lesson and give them harder practice tasks."
  - "You only want quick questions to check learning: write those by hand or use a checking-for-understanding tool."
you_give:
  - The skill or concept to teach
  - Learner age or year group and prior knowledge
  - The lesson length
  - Known misconceptions (optional)
you_get:
  - A three-stage I do, We do, You do lesson
  - Teacher talk and thinking-aloud prompts
  - Guided practice tasks
  - Independent practice tasks
  - Quick checks for understanding
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill instructions from the SKILL.md file into the chat. The skill is Gareth Manning's work under CC BY-SA-4.0, so anything you build from it must keep that licence.
  - Add the skill to teach, your learners' age and what they know, and the lesson length in minutes.
  - Add common mistakes and your success measure if you have them.
  - Read the plan. Check that the stage times add up to your lesson length and that the think-aloud sounds like you.
  - Fix any task that is too easy or too hard, then use the plan. To go further, pair it with Think-aloud script writer, Understanding check picker or Worked example to practice sequence builder.
output_sample:
  input:
    - The skill you want to teach
    - Your learners' age or year group and what they know
    - How many minutes the lesson lasts
    - Mistakes learners often make (optional)
    - Your success measure for the lesson (optional)
  output:
    - name: Prerequisites
      contains: What learners must already know before this lesson can work.
    - name: I Do
      contains: The teacher's scripted explanation and think-aloud, with a time guide for this stage.
    - name: We Do
      contains: Guided practice tasks, teacher prompts and quick checks that learners are following.
    - name: You Do
      contains: Independent practice tasks with points where the teacher checks progress.
    - name: Differentiation Notes
      contains: Ways to help learners who need more support and to stretch those who are ready.
