new_slug: discount-payoff-calculator
name: Discount payoff calculator
summary: "Run it on your discounts. Get the real return of each code: extra
  revenue against what the discount cost."
job: run-your-store
headline: Discount payoff calculator
subhead: "The true return on every discount you run: the revenue it brought in
  set against what the discount cost you. Some codes pay for themselves, and
  others only give margin away."
explain: |
  The true return on every discount you run: the revenue it brought in set against what the discount cost you. Some codes pay for themselves, and others only give margin away.

  The skill reads all your discount codes and automatic discounts in your Shopify store, then keeps those used at least a minimum number of times in your chosen window (90 days by default). For each one, it pulls the orders and works out revenue, order count, average order size and money given away. It only reads data, so it is safe to run anytime. It needs a signed-in Shopify CLI with read access to orders and discounts. Output comes as a table or JSON.
when:
  - You run many codes and do not know which ones are worth it.
  - Your margins feel thin and you suspect discounts are the cause.
  - You want to retire the codes that cost more than they earn.
  - You need numbers for a talk with your team about promotions.
you_give:
  - Your Shopify store domain
  - How many days back to look
  - The minimum number of uses to count a discount (optional)
  - A signed-in Shopify CLI with read access
you_get:
  - Revenue and order count per discount
  - Average order value per discount
  - The cost of each discount
  - A ranking of which ones paid off
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin.
