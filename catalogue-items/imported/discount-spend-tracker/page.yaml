thinking: low
thinking_why: It adds up discount totals over time.
new_slug: discount-spend-tracker
name: Discount spend tracker
summary: Pick a time range. Get total discount dollars by week or month, split
  by discount type and code.
job: run-your-store
headline: Discount spend tracker
subhead: A clear total of how much money your store gave away in discounts, by
  week, month or quarter, split by code and by type. You can see if discounting
  is growing before it hurts margin.
explain: |
  A clear total of how much money your store gave away in discounts, by week, month or quarter, split by code and by type. You can see if discounting is growing before it hurts margin.

  Pick a bucket size and how many periods to look back (12 months by default). The skill pulls all paid orders in that window from your Shopify store and adds up the discount amounts in each bucket. The top codes get their own lines, and the rest are grouped as other. You choose whether to count shipping discounts. It is read-only and safe to run any time. It needs a signed-in Shopify CLI with permission to read orders.
when:
  - Your finance team asks how much you spent on discounts last quarter.
  - You suspect discounting went up during a sale season.
  - You want to see which codes cost the most.
  - You are setting a yearly promotion budget.
you_give:
  - Your Shopify store domain
  - "Bucket size: week, month or quarter"
  - How many periods to look back
  - How many top codes to list separately (optional)
  - Whether to include shipping discounts (optional)
you_get:
  - Total discount dollars per period
  - A split by discount type
  - The top codes named individually
  - A trend you can compare across periods
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin.
