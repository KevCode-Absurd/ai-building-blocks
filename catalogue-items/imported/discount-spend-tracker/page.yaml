thinking: low
thinking_why: It adds up discount totals over time.
new_slug: discount-spend-tracker
name: Discount spend tracker
summary: Track discount spend by week, month or quarter. See total dollars given away in your Shopify store, split by discount code and type.
job: run-your-store
headline: Discount spend tracker
subhead: A clear total of how much money your store gave away in discounts, by week, month or quarter, split by code and by type. You can see if discounting is growing before it hurts margin.
explain: |
  A clear total of how much money your store gave away in discounts, by week, month or quarter, split by code and by type. You can see if discounting is growing before it hurts margin.

  Pick a bucket size and how many periods to look back (12 months by default). The skill pulls all paid orders in that window from your Shopify store and adds up the discount amounts in each bucket. The top codes get their own lines, and the rest are grouped as other. You choose whether to count shipping discounts. It is read-only and safe to run any time. It needs a signed-in Shopify CLI with permission to read orders.
when:
  - Your finance team asks how much you spent on discounts last quarter.
  - You suspect discounting went up during a sale season.
  - You want to see which codes cost the most.
  - You are setting a yearly promotion budget.
not_for:
  - "You want to know if one discount earned back its cost: use the discount-roi-calculator, since this only totals what you gave away."
  - "You need orders that are not paid, such as pending or refunded ones: this counts paid orders only, so check them in your Shopify admin."
  - "You want to change or end a discount: this only reads orders, so make the change in your Shopify discounts page."
you_give:
  - Your Shopify store domain
  - "Bucket size: week, month or quarter (optional, month by default)"
  - How many periods to look back (optional, 12 by default)
  - How many top codes to list separately (optional)
  - Whether to include shipping discounts (optional)
you_get:
  - Total discount dollars per period
  - A split by discount type
  - The top codes named individually
  - A trend you can compare across periods
how_to_use:
  - Sign in to Shopify CLI for your store with permission to read orders, using its auth command, before the first run. This skill needs an AI that can run code.
  - Paste the skill into your AI, or open the skill folder in your AI tool.
  - Give your store domain. Add the bucket size and how many periods to look back if you want to change the defaults.
  - Add the number of top codes and whether to count shipping discounts, if you want to change the defaults.
  - Check the summary and the CSV file. Look at the latest period against the one before it.
  - Use the Discount payoff calculator on any code that looks costly.
output_sample:
  input:
    - Your Shopify store domain
    - "Bucket size: week, month or quarter"
    - How many periods to look back (optional)
    - How many top codes to list on their own (optional)
    - Whether to count shipping discounts (optional)
  prerequisites:
    - An AI that can run code and use the Shopify CLI
    - A signed-in Shopify CLI session that can read orders
  output:
    - name: Summary
      contains: Total discount cost, average per period, and the latest period compared with the one before.
    - name: By bucket
      contains: Discount cost for each week, month or quarter, split into cart and shipping discounts.
    - name: By discount type
      contains: Spend and share for code, automatic, manual and shipping discounts.
    - name: Top codes
      contains: The costliest codes with spend and share, and the rest grouped as other.
    - name: discount_cost_trend CSV file
      contains: One row per bucket and code with type, order count, cart, shipping and total discount, and currency.
