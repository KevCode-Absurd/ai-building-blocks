job: check-contracts
headline: Dispute timeline builder
subhead: A dated timeline of what happened in a dispute, built from your emails
  and documents, with the most important events marked. It gives you a first
  working version to check, not legal advice.
explain: |
  A dated timeline of what happened in a dispute, built from your emails and documents, with the most important events marked. It gives you a first working version to check, not legal advice.

  The skill reads the case notes if they exist, then goes through your sources and pulls out every dated event. It merges duplicates and tags each event with its sources. Each one is marked red, yellow or grey for how much it matters to the case theory. Unreachable documents are listed as gaps. Before finalising, it asks you to scan the red entries for mistakes. It also asks if any papers came from legal disclosure, as their use can be limited.
when:
  - A contract dispute has dozens of emails and you need the order of events.
  - You must brief a lawyer and want the facts laid out clearly.
  - You are building the facts section of a letter or brief.
  - You want to spot gaps in your records.
you_give:
  - Emails, letters and documents about the dispute
  - Your view of the main issue
  - Any key date or fact you already know (optional)
  - Whether any papers came from legal disclosure
you_get:
  - A dated timeline with sources
  - Events marked by importance
  - A list of gaps and missing documents
  - A version history when you update it
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your saved legal setup notes and your
    files.
  - Where the skill points to /litigation-legal:cold-start-interview, use the
    setup-interview folder inside it. We copied it in so the skill works on its
    own.
