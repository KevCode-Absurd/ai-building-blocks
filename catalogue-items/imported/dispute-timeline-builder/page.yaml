thinking: medium
thinking_why: It pulls dates from many files and removes repeats.
new_slug: dispute-timeline-builder
name: Dispute timeline builder
summary: Build a dispute timeline from your emails and documents. Get dated events, merged duplicates and key moments marked. A first check, not legal advice.
job: check-contracts
headline: Dispute timeline builder
subhead: A dated timeline of what happened in a dispute, built from your emails and documents, with the most important events marked. It gives you a first working version to check, not legal advice.
explain: |
  A dated timeline of what happened in a dispute, built from your emails and documents, with the most important events marked. It gives you a first working version to check, not legal advice.

  The skill reads the case notes if they exist, then goes through your sources and pulls out every dated event. It merges duplicates and tags each event with its sources. Each one is marked red, yellow or grey for how much it matters to the case theory. Unreachable documents are listed as gaps. Before finalising, it asks you to scan the red entries for mistakes. It also asks if any papers came from legal disclosure, as their use can be limited.

  Deadlines and rules in the skill come from the AI's general knowledge and are tagged "verify". Check them with a lawyer. This is Anthropic's chronology skill from its claude-for-legal collection, shared under the Apache 2.0 licence.
when:
  - A contract dispute has dozens of emails and you need the order of events.
  - You must brief a lawyer and want the facts laid out clearly.
  - You are building the facts section of a letter or brief.
  - You want to spot gaps in your records.
not_for:
  - "You need legal advice or a view on who will win: ask a lawyer, because this only lays out the facts."
  - "Your papers came from legal disclosure and you have not checked the rules on their use: confirm permission first, or ask your lawyer."
  - "You only have one or two documents: read them yourself and write the dates down by hand."
you_give:
  - Emails, letters and documents about the dispute
  - Your view of the main issue
  - Any key date or fact you already know (optional)
  - Whether any papers came from legal disclosure
you_get:
  - A dated timeline with sources
  - Events marked by importance
  - A list of gaps and missing documents
  - A version history when you update it
how_to_use:
  - Gather first: PDFs, saved emails (.eml), Word files (.docx) and text files (.txt) about the dispute. Export emails so the dates show. Note which papers, if any, came from legal disclosure. Then open your AI tool. Use one that can read files, such as Claude. Add the skill, or paste its instructions into a chat. If you have no saved case folder, that is fine. It works from the files you upload and your one-line description of the issue.
  - Tell your AI if any papers came from legal disclosure. It will ask, and it will warn you if their use may be limited.
  - Upload your emails and documents. Say in one or two lines what the main issue is.
  - Ask it to build the timeline. If you have case notes, add them too. Say if you want a working, statement-of-facts or witness version.
  - Read the red entries and fix anything it got wrong. It will ask you to do this before it finishes.
  - The dates and events come only from the files you uploaded. Anything from the web or the AI's own memory is tagged "verify". Check those first. Any deadline, time limit or rule about disclosed papers is the AI's general knowledge, so confirm it with a lawyer before you rely on it.
  - Check each red entry against its source document before you use it in a letter, a brief or a lawyer briefing. The timeline is a working draft. It does not replace a lawyer's review. Use the checked red entries as the facts section of a letter or brief, or hand the timeline to your lawyer.
output_sample:
  input:
    - Your emails, letters and documents about the dispute
    - Your view of the main issue in the case
    - Any key date or fact you already know (optional)
    - Whether any papers came from legal disclosure
  prerequisites:
    - An AI that can read your files
    - Your saved case notes (matter.md), if you have them
    - A setup file listing where your documents are kept (optional)
  output:
    - name: Chronology
      contains: A dated table of events, with the sources for each and a red, yellow or grey tag for importance.
    - name: Key events
      contains: A short write-up of each red event, with its date, what happened and why it matters.
    - name: Gaps
      contains: Documents the AI could not open or read, and periods where your records are thin.
    - name: Version
      contains: The version number and a summary of what changed since the last version.
    - name: Statement-of-facts version (on request)
      contains: A plain list of facts in date order, ready to adapt for a brief.
    - name: Witness version (on request)
      contains: A timeline cut down to the events one named person was involved in.
