thinking: medium
thinking_why: It scans for known slow patterns and proposes fixes.
new_slug: django-speed-reviewer
name: Django speed reviewer
summary: Find slow queries and N+1 problems in your Django code. Get each issue proved by reading the code, with the fix to apply.
job: test-and-fix-code
headline: Django speed reviewer
subhead: A list of real performance problems in your Django code, each proved by reading it, with the change that fixes it. It will not invent issues to look thorough, and zero findings is a fine result.
explain: |
  A list of real performance problems in your Django code, each proved by reading it, with the change that fixes it. It will not invent issues to look thorough, and zero findings is a fine result.

  The skill ranks problems by impact. N+1 queries and unbounded querysets come first, because they break at scale. Next come missing indexes and write loops. Minor patterns are skipped. Before reporting anything, it traces the data flow, checks for existing fixes and thinks about data volume. A finding marked critical must really be critical, or it is downgraded or dropped. It reads your code and does not need a running site. It does not measure runtime, so confirm any gain with a profiler. The code it reads may be private, so only paste what you are allowed to share.

  This is a copy of the django-perf-review skill from sickn33's collection. Licence: this skill follows the Apache-2.0 licence in its original header and the included LICENSE file. Keep the source notices and author credits. We also retain the collection's LICENSE-CONTENT file.
when:
  - A page gets slower as your data grows.
  - You suspect an N+1 query behind a slow list view.
  - Your server runs out of memory when loading big tables.
  - You want a trusted review without a pile of maybe-issues.
not_for:
  - "What it cannot see: your settings, caching layers, database query logs or the live site. Findings stop at what the code shows."
  - "You need measured timings from a running site: use a profiler such as django-debug-toolbar."
  - "You want to test how your site handles heavy traffic: use a load testing tool, since this review only reads code."
  - "Your code is not Django, or the slowness is not from the database: ask a developer to look at that part."
you_give:
  - Your Django views, models and queries
  - Your Django and Django REST framework versions, and your database (such as PostgreSQL or SQLite)
  - The slow page or endpoint (optional)
  - Rough data sizes (optional, the review will not guess them)
you_get:
  - Confirmed performance issues ranked by impact
  - The code location of each
  - A concrete fix such as select_related or an index
  - A clear statement if nothing serious was found
how_to_use:
  - Open your AI tool. Paste in the skill text, or upload the skill folder if your tool takes files.
  - Add your Django views, models, serializers and templates for the slow area. Share the whole project if your AI can read files. It reads code only and assumes the Django ORM, and Django REST framework if you use it.
  - Tell your AI your Django version, whether you use Django REST framework, and which database you run. The findings depend on them.
  - Say which page or endpoint is slow, and roughly how many rows your biggest tables have. Both are optional but help.
  - 'Ask your AI: "Review this Django code for N+1 queries, unbounded querysets, missing indexes and write loops, using the django-perf-review rules in this skill. Report only problems you can prove from the code."'
  - Read each finding and check the evidence matches your code. Fix the top one first, then run the review again.
  - To confirm the gain, time the page before and after with a profiler such as django-debug-toolbar.
  - Next, ask your AI for a fix pass on the top findings, one at a time, and run your tests after each.
output_sample:
  input:
    - Your Django views, models and queries
    - The slow page or endpoint (optional)
    - Rough data sizes (optional)
  prerequisites:
    - An AI that can read your project files, or code you can paste into a chat
  output:
    - name: Summary
      contains: The count of confirmed issues, split by Critical and High.
    - name: Finding heading
      contains: An ID, the problem type and its severity, such as an N+1 query marked Critical.
    - name: Location
      contains: The file and line number where the problem sits.
    - name: Issue
      contains: A short plain description of what is slow and why.
    - name: Validation
      contains: "The steps taken to prove it: data flow traced, existing fixes searched, table size and hot path checked."
    - name: Evidence
      contains: The code as it is now.
    - name: Fix
      contains: The changed code, such as select_related, an index or a bulk write.
    - name: No issues message
      contains: If nothing is found, a line saying which files were reviewed and what was checked.
