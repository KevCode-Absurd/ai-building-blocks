thinking: medium
thinking_why: It follows known container patterns.
new_slug: docker-setup-builder
name: Docker setup builder
summary: Get a smaller, safer Dockerfile and compose file for your app. Use it to fix a slow build, a huge image or weak container security.
job: ship-and-host
headline: Docker setup builder
subhead: Point it at your app. Get a lean, safe Dockerfile and compose file that run your project. Bring your project or existing Dockerfile. Use the result to plan your next step.
explain: |
  A lean, safer Dockerfile and compose file for your project, which usually means smaller images, faster builds and fewer security holes.

  The skill offers three jobs. Optimize looks at a Dockerfile for size, speed and layer caching, using multi-stage builds to cut what ships. Compose creates or improves your docker-compose file with good defaults. Security audits a Dockerfile or running container for risks. It is a set of firm choices about how to build containers, not a Docker tutorial. Use it when a build is slow, an image is huge, or you simply want a sound setup for a new project.
when:
  - Your Docker build takes minutes every time you change one line.
  - Your image is over a gigabyte and you do not know why.
  - You want to know if your Dockerfile has security problems.
  - You need a first Dockerfile for a Node or Python app.
not_for:
  - "You need a Kubernetes setup or a CI pipeline: ask a DevOps engineer or use a tool built for that job, because this only covers Dockerfile and compose files."
  - "You want to learn Docker from scratch: read the official Docker getting started guide first, since this makes firm choices and does not teach."
  - "You need to scan your app code for security flaws: use a code security review by a person, since this only checks container settings."
you_give:
  - Your project or existing Dockerfile
  - Your language and framework
  - Whether it is for development or production
  - Services your app depends on (optional)
you_get:
  - An optimised Dockerfile
  - A compose file
  - A security audit with fixes
  - Notes on what changed and why
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Paste your Dockerfile, or describe your project, language and framework. A project without a Dockerfile needs its main files too (package.json or requirements.txt, and how it starts).
  - "Say which job you want: optimize, compose or security. Say if it is for development or production."
  - Add any services your app needs, such as a database (optional).
  - Read the result and check the notes on what changed. Then build the image to test it.
  - Next, run the compose file and confirm the healthchecks pass. Fix any audit finding it listed, then run the audit again.
  - The analyzer and validator scripts only run if your AI can run code. Without that, you still get the files and the audit.
output_sample:
  input:
    - Your existing Dockerfile, or your project files
    - Your language and framework
    - Whether it is for development or production
    - Services your app needs, such as a database or cache (optional)
  prerequisites:
    - An AI that can run code, only if you want the Dockerfile analyzer and compose validator scripts to run
  output:
    - name: Optimized Dockerfile
      contains: A rewritten Dockerfile with multi-stage build, ordered layers, a non-root user, and a comment on each choice.
    - name: Size reduction estimate
      contains: A short note on how much smaller the new image should be.
    - name: docker-compose.yml
      contains: Your services with healthchecks, named networks, named volumes, pinned versions and dev and prod notes.
    - name: .env.example
      contains: Every environment variable the compose file needs, with a note on each.
    - name: .dockerignore
      contains: A list of files kept out of the build, such as .git, node_modules and .env.
    - name: Security audit report
      contains: Findings counted by severity from critical to low, each with a fix.
