thinking: medium
thinking_why: It sets up reading, indexing and answering.
new_slug: document-qa-builder
name: Document question answerer builder
summary: Build a document question answerer in Python. Give it your files. Get code that answers questions and shows the source passages it used.
job: build-software
headline: Document question answerer builder
subhead: Working code that lets you ask questions about your own documents and get answers that show which pages they came from. This is the common retrieval-augmented generation setup.
explain: |
  Working code that lets you ask questions about your own documents and get answers that show which pages they came from. This is the common retrieval-augmented generation setup.

  It uses LlamaIndex, a framework for connecting language models to private data. The code loads your files, with more than 300 connectors for sources like PDFs, Notion and databases, then splits and indexes them. When you ask a question, it finds the best passages, passes them to the model and returns the answer with the source passages attached. It suits knowledge bases, internal chatbots and data extraction. It needs Python, the LlamaIndex package and an API key for a model provider. Licence: MIT (see the LICENSE file). This is Orchestra Research's LlamaIndex skill, copied as it is. We only changed the plain-English page text and a few safety notes.
when:
  - You want a chatbot that answers from your company handbook.
  - You have hundreds of PDFs and need to ask questions across all of them.
  - Answers must show their sources so people can check them.
  - You want to pull structured facts from a pile of documents.
not_for:
  - "You only need to search for exact words in your files: use a plain keyword search tool, such as your computer's file search."
  - "You want to summarise one short file: paste it into Claude, ChatGPT or Gemini and ask for a summary."
  - "You only need a place to store vectors: use Chroma on its own."
you_give:
  - Your documents or data sources, such as PDFs, Word files, text files or web pages
  - The kind of questions you expect people to ask (optional)
  - A model provider API key, such as one from OpenAI or Anthropic
you_get:
  - Python code for a document Q&A app
  - An index built from your files
  - Each answer as text, followed by the source file name and the passage it used, for every passage
  - Setup instructions
how_to_use:
  - Check that your AI can run Python code, or that Python is set up on your computer. You also need an API key from a model provider. Using the model costs money per question. Pinecone and LlamaCloud, which the skill also names, are optional paid accounts.
  - Install the package with pip install llama-index.
  - Save your API key as an environment variable. Never paste it into the code.
  - Put your files in a folder named data.
  - Run the short starter example from the skill. Ask one question about your files. The starter example prints only the answer, not the source passages.
  - To see the sources, use the "Document Q&A system" snippet in the skill. It prints each source file name and the passage text. Check the passages match what the answer says. If you scrape web pages, get the site owner's permission first.
  - If an answer is not backed by its passage, try smaller chunks or retrieve more passages, then check again before you share the tool with others.
  - The text of your files is sent to your model provider with each question. Do not use private or sensitive files until you have checked the provider's terms.
  - Next, add the optional chat engine so it remembers earlier questions, or ask your AI to add a test that checks each answer against its source passage.
output_sample:
  input:
    - Your documents, such as PDFs, Word files, text files or web pages
    - The kind of questions you expect people to ask
    - A model provider API key, such as one from OpenAI or Anthropic
  prerequisites:
    - An AI that can run Python code, or Python set up on your own computer
    - The llama-index package installed
    - An API key for an AI model provider
    - "Optional: Pinecone and LlamaCloud need their own accounts and keys, and may cost money"
  output:
    - name: Install step
      contains: The pip command that installs the llama-index starter package, or the smaller core package with the parts you pick.
    - name: Document loader
      contains: Code that reads your files from a folder, with options for web pages, GitHub and databases.
    - name: Vector index
      contains: Code that splits your files into passages and builds a searchable index, which you can save and load again.
    - name: Query engine
      contains: Code that takes a question, finds the best passages and returns an answer, with streaming if you want it.
    - name: Source passages
      contains: The passages behind each answer, so a person can check where it came from.
    - name: Chat engine (optional)
      contains: A version of the question answerer that remembers earlier questions in the same chat.
