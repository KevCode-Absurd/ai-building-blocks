thinking: medium
thinking_why: It follows set import and cleanup steps for each sensor type.
new_slug: driving-data-importer
name: Driving data importer
summary: Load recorded GPS, camera and lidar driving data into MATLAB, sync it and clean it up, ready to build driving scenarios from your recording.
job: build-software
headline: Driving data importer
subhead: Recorded driving data loaded, lined up in time and cleaned, ready for building driving scenarios in MATLAB. It handles GPS, camera, lidar and tracked-object data from common sources.
explain: |
  Recorded driving data loaded, lined up in time and cleaned, ready for building driving scenarios in MATLAB. It handles GPS, camera, lidar and tracked-object data from common sources.

  The skill maps raw files into the right scenario builder objects: GPS, camera, lidar, actor tracks, trajectories and lane data. It accepts datasets like KITTI, nuScenes and Waymo, ROS bags, MAT, CSV and video. It also attaches mounting position, angles and camera settings, syncs sensors with different sample rates, corrects time offsets, trims segments and sets a common time zero. It will not open the Driving Log Analyzer unless you ask or report a sync problem. It needs MATLAB with the matching toolboxes.

  This is MathWorks' skill. The licence that applies is the LICENSE file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE file.
when:
  - You have a KITTI or ROS bag recording and want to build a scenario from it.
  - Camera and lidar timestamps do not match.
  - You need to crop one segment out of a long recording.
  - Your sensors use different sample rates and must share a timeline.
not_for:
  - "You want to build a scenario or export to RoadRunner or OpenSCENARIO: use the scenario builder skill in MATLAB, which takes over after this import."
  - "You only want to look at or replay a recording: open the Driving Log Analyzer app in MATLAB yourself. This skill does not open it unless you ask."
  - "You have no MATLAB with Automated Driving Toolbox: ask a colleague who has it, because this skill needs code run in MATLAB. Both are paid MathWorks software."
  - "You are not an engineer who works with sensor recordings, or you do not use MathWorks products: this is a tool for automated driving engineers, and its licence (see LICENSE.md) allows use only with MathWorks products."
you_give:
  - Your raw recording files
  - The dataset type, such as KITTI or ROS bag
  - Sensor mounting details (optional)
  - MATLAB with the scenario builder tools
you_get:
  - Data wrapped into scenario builder objects
  - Sensors synced to one timeline
  - Time offsets corrected
  - A saved dataset ready for scenario building
how_to_use:
  - Open an AI that can run MATLAB code, with MATLAB and Automated Driving Toolbox installed.
  - Give your AI this skill and say you want to import driving data.
  - Point it to your recording folder and say which dataset type it is. Check first whether the recording comes with annotations (labelled boxes or tracks for other cars and people), which short clips often do and long drives often do not. If they exist it uses them directly. If not, it has to build actor tracks from the lidar, which takes longer.
  - Add calibration files and sensor mounting details if you have them.
  - If your annotations or timestamps are laid out in a way the skill cannot read, it should ask you how, not guess. Tell it where the timestamps are kept.
  - Check the data summary it prints before you go on: dataset and recording name, duration, each sensor with its sample count and rate, whether annotations exist, and which calibration is available. Fix any missing sensor or wrong frame.
  - Ask it to sync, trim or fix time offsets, then save the result for scenario building. It saves the wrapped objects to a file such as sandbox/<dataset>_wrapped.mat. Open that file in MATLAB to check it loads.
output_sample:
  input:
    - Your raw recording files, such as a KITTI folder, a ROS bag, MAT, CSV or video
    - The dataset type, such as KITTI, nuScenes, Waymo or ROS bag
    - Calibration files and sensor mounting details (optional)
    - The part of the recording you want to keep (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with Automated Driving Toolbox and any toolboxes your sensors need
  output:
    - name: Data summary
      contains: Dataset name, recording, duration, each sensor with its sample count and rate, whether annotations exist, and which calibration is available.
    - name: GPSData
      contains: Your GPS or GNSS track wrapped as a scenario builder object.
    - name: ActorTrackData
      contains: Tracks of other vehicles and people, from your annotations or computed from lidar when none exist.
    - name: CameraData
      contains: Your camera frames wrapped as an object, with mounting position, angles and camera settings attached.
    - name: LidarData
      contains: Your lidar point clouds wrapped as an object, with mounting position and angles attached.
    - name: Synchronized dataset
      contains: All sensors on one timeline, with time offsets fixed, segments trimmed and a common time zero.
