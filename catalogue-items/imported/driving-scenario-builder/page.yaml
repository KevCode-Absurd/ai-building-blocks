new_slug: driving-scenario-builder
name: Driving scenario builder
summary: Turn recorded GPS, camera and lidar drive data into a driving scenario you can replay in RoadRunner. Built in MATLAB with Scenario Builder.
job: build-software
headline: Driving scenario builder
subhead: A simulation-ready driving scene, built from real drives instead of drawn by hand. Feed in recorded GPS, camera, lidar and tracked vehicles, and you get roads, other vehicles and their paths that a simulator can replay.
explain: |
  Who this is for: engineers who run MATLAB, with the paid Scenario Builder add-on from MathWorks. MATLAB and RoadRunner are paid MathWorks products too, and the licence lets you use this skill only with MathWorks products. There is no free version of this skill. If that is not you, ask an engineer who does, or pick a simpler tool.

  A simulation-ready driving scene, built from real drives instead of drawn by hand. Feed in recorded GPS, camera, lidar and tracked vehicles, and you get roads, other vehicles and their paths that a simulator can replay.

  The skill works inside MATLAB with the Scenario Builder support package. It first checks that the package is installed. Then it cleans and aligns the sensor streams, tracks the other vehicles, places the car on a map using lane lines, and builds the scene. RoadRunner is the default export. It can also write OpenSCENARIO, OpenDRIVE or a road surface file, add signs and trees, and pull out events such as cut-ins and hard brakes.

  This is MathWorks' skill. The licence that applies is the LICENSE file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE file.
when:
  - You have a recorded drive and want to replay it in a simulator.
  - You need real cut-ins and near-misses turned into test scenarios.
  - You must show scenario coverage from real data for a safety standard.
  - You want a road surface file from lidar for vehicle testing.
not_for:
  - "Your data still needs importing, syncing or timestamp fixes: run Driving data importer first, then come back."
  - "You have no recorded drive and want to make up a path: use MATLAB's waypointTrajectory to draw one by hand."
  - "You do not have MATLAB with the Scenario Builder support package: ask an engineer who does, or pick a simpler tool."
  - "You do not use MathWorks products: the licence allows use only with them."
you_give:
  - Recorded GPS, camera or lidar data
  - Tracks of other vehicles (optional)
  - Target format, such as RoadRunner or OpenSCENARIO
  - MATLAB with Scenario Builder installed
you_get:
  - A driving scenario ready for simulation
  - Exported scene and scenario files
  - Extracted critical events from the drive
  - Road surface or map additions (optional)
how_to_use:
  - This is for engineers. If you are not a MATLAB user, ask one to run it. Check you have MATLAB with the Scenario Builder support package. It is a paid MathWorks product. Add RoadRunner if you want that export.
  - Open an AI that can write and run MATLAB code, and paste in the skill.
  - "Gather first: your GPS file with timestamps, camera data and its intrinsics (the lens settings) with the camera mounting height, lidar data if you have it, and a track file for the other vehicles if you have one. Give your AI these files and say which format you want, such as RoadRunner or OpenSCENARIO."
  - "The run produces a data format table, a progress table with plots, trajectory plots, and the exported scene and scenario files in the format you chose. Check the data format table it shows first. Fix any timestamp or axis problem it flags."
  - Tell it the paths to RoadRunner when it asks, and check the plots at each step.
  - Open the exported files in your simulator and replay the drive. Then run test scenarios from them, or feed the events into a safety coverage report. Driving scenario simulator can replay them.
terms:
  - term: RoadRunner
    meaning: MathWorks software that builds and edits 3D roads and driving scenes for simulators.
  - term: OpenSCENARIO
    meaning: An open file format that describes how cars and other actors move in a test.
  - term: OpenCRG
    meaning: An open file format for the bumps and texture of a road surface.
  - term: Scenario Builder
    meaning: A paid MathWorks add-on that turns recorded drive data into driving scenarios.
output_sample:
  input:
    - Your recorded GPS data, with timestamps
    - Your camera or lidar data (optional)
    - Tracks of other vehicles (optional)
    - The format you want, such as RoadRunner, OpenSCENARIO, OpenDRIVE or OpenCRG
  prerequisites:
    - MATLAB with the Scenario Builder support package for Automated Driving Toolbox (paid, from MathWorks)
    - RoadRunner installed, if you export to RoadRunner
    - An AI that can write and run MATLAB scripts
    - Data already imported and synced, using Driving data importer if not
  output:
    - name: Format table
      contains: A check of your data against what Scenario Builder expects, with timestamp scale and any flips or fixes needed.
    - name: Ego and actor trajectories
      contains: Smoothed paths for your car and the other vehicles, built from GPS and tracks.
    - name: Road or scene
      contains: A road built from a map or from lane lines, with optional signs, trees and buildings.
    - name: Exported scenario files
      contains: The scene and scenario in your chosen format, ready to replay in a simulator.
    - name: Scenario events
      contains: Moments pulled from the drive, such as cut-ins, hard brakes and near-misses (optional).
    - name: Road surface file
      contains: An OpenCRG road surface made from lidar, for vehicle testing (optional).
    - name: Progress table
      contains: A list of the steps taken, shown as the work runs, with plots to check each one.
