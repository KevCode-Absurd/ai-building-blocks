thinking: medium
thinking_why: It sequences actors and conditions into one scenario.
new_slug: driving-test-scenario-writer
name: Driving test scenario writer
summary: Turn a traffic event into a RoadRunner scenario. Get MATLAB code with actors, routes and triggers for a cut-in or pedestrian crossing test.
job: build-software
headline: Driving test scenario writer
subhead: For advanced users with MATLAB and a licensed RoadRunner install. Describe a traffic event in words and get a RoadRunner scenario written as code. A car cuts in, a pedestrian crosses, a lead vehicle brakes hard.
explain: |
  Describe a traffic event in words and get a RoadRunner scenario written as code. A car cuts in, a pedestrian crosses, a lead vehicle brakes hard. Each one becomes actors, routes and trigger logic you can run and change.

  The skill works through the roadrunnerAPI in MATLAB. It first confirms a RoadRunner session is open. Then it adds vehicles and pedestrians, sets their routes and waypoints, and places them on roads by anchor or map position. Next it writes the scenario logic as phases, conditions and actions. Last, it checks the structure before you simulate. Scenes, road shapes and simulation runs are handled by other skills.

  This is MathWorks' skill. The licence that applies is the LICENSE file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE file.
when:
  - You need a cut-in or lead-brake test for an automated driving system.
  - You want a pedestrian crossing set up without clicking through the editor.
  - You plan many variations of one traffic event.
  - You want the scenario checked before you simulate.
not_for:
  - "You need to open or connect RoadRunner: open RoadRunner from MATLAB yourself first, as this skill needs a session already running."
  - "You want to import a map or scene: use the Road scene importer first, since this skill does not do it."
  - "You want to draw roads, lanes or junctions: use the Road map author or draw them in RoadRunner. To run the scenario, use Driving scenario simulator."
  - "You do not use MathWorks products: the licence allows use only with them."
you_give:
  - A plain description of the traffic event
  - The road or scene to use
  - Actor types and speeds (optional)
  - Trigger conditions (optional)
you_get:
  - MATLAB code that builds the scenario
  - Actors with routes and waypoints
  - Phase logic with conditions and actions
  - A structure check before simulation
how_to_use:
  - This needs MATLAB, a licensed RoadRunner install and a live roadrunnerAPI session, so it suits engineers, not general ops staff. The skill does not name the MATLAB or RoadRunner versions it was written for, so ask your AI to check its code against your release before you run it. Open RoadRunner from MATLAB and load the scene you want. The skill that connects to RoadRunner is not in this library, so open it yourself. To import a scene first, use the Road scene importer. To draw roads, use the Road map author.
  - Give your AI the skill text and describe the traffic event in plain words.
  - Add actor types, speeds and trigger conditions if you have them. Have the scene name, the actor types, their speeds and the intended outcome (collision, near-miss or safe pass) ready first.
  - Let your AI run the MATLAB code it writes, or copy it into MATLAB yourself.
  - Read the summary and the structure check before you change anything.
  - Run the simulation yourself when you are ready. This skill does not start it. Use the Driving scenario simulator to run it.
output_sample:
  input:
    - A plain description of the traffic event
    - The scene to use
    - Actor types and speeds (optional)
    - Trigger conditions (optional)
  prerequisites:
    - MATLAB and RoadRunner, both licensed and installed
    - An AI that can run MATLAB code
    - A RoadRunner session already open and connected
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: Scenario setup
      contains: Code that opens your scene and starts a new scenario in RoadRunner.
    - name: Scene check
      contains: A survey of the scene to find valid lane positions before actors are placed.
    - name: Actors
      contains: Vehicles and pedestrians added to the scenario and placed on roads.
    - name: Routes
      contains: Routes and waypoints for actors that need to move along a path.
    - name: Phase logic
      contains: Phases, conditions and actions that set when each event starts.
    - name: Validation and summary
      contains: A structure check, then a short report with the scenario name, the actors and their roles, the phases, the validation result and any open issues. It does not run the simulation.
