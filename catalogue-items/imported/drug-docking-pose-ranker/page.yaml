thinking: high
thinking_why: Reading docking confidence correctly takes expert judgement.
new_slug: drug-docking-pose-ranker
name: Drug docking pose ranker
summary: Rank predicted drug docking poses for a protein and a small molecule by model confidence, with checks to run on each pose before you trust it.
job: research-topics
headline: Drug docking pose ranker
subhead: Give it a protein and a small molecule. It sets up DiffDock and ranks the likely ways the molecule could sit in the protein. You also get checks to run on each pose and a plain note on what the scores mean.
explain: |
  Predicted ways a small molecule could sit in a protein, ranked and labelled with how far to trust them. Give it a protein and a molecule, and you get candidate binding poses with confidence scores and checks on each.

  The skill runs DiffDock, a published docking model, from its official code. It sets up the exact environment the model needs, runs one pair or a batch, and can try several protein shapes. It states plainly that confidence is not a measured probability and not binding strength. Sorting a large library by score is treated as rough triage, not finding hits. You need a GPU-ready setup. The pretrained docking run, Docker, GNINA and the hosted demo were not run in the skill's own review, so those steps are untested recipes.
when:
  - You want likely binding poses for one protein and one molecule.
  - You have a batch of molecules to dock against one target.
  - You want a quick pose check before you spend lab time.
  - You are unsure what a docking confidence score really means.
not_for:
  - "You want binding strength or potency: DiffDock does not predict affinity, so use a separate scoring step such as GNINA, then lab tests."
  - "You want proof that a molecule does not bind: low confidence is not evidence of no binding, so check poses with PoseBusters and a chemist."
  - "You want to dock large biomolecules, covalent bonds or metal binding: ask a computational chemist, because this skill covers small molecules only."
  - "You have no CUDA GPU and only a protein sequence: sequence folding needs a GPU, so use a hosted GPU machine or ask for a PDB structure first. A PDB file can run on a CPU, slowly."
you_give:
  - Your protein as a PDB file or a full amino-acid sequence
  - Your molecule as a SMILES string or a ligand file (SDF, MOL2, PDB or PDBQT)
  - A computer with a GPU, or the DiffDock Docker image, and room for model downloads (the pretrained docking, Docker and GNINA steps are untested recipes)
  - Extra protein shapes, one row each (optional)
you_get:
  - Ranked poses, each with a confidence score
  - A high, moderate or low reading for each score
  - Checks to run on every pose you plan to keep
  - Commands to set up DiffDock and run one pair or a batch
  - A plain note on what the scores cannot show
how_to_use:
  - Before you start: you need an NVIDIA GPU with CUDA for the best path, plus disk space for the model downloads. The setup, Docker, pretrained docking and GNINA commands were not run when this item was reviewed, so expect to debug them.
  - Use an AI that can run code and read files, on a computer with a GPU. Or use the DiffDock Docker image.
  - Give your AI the skill, your protein file or sequence, and your molecule.
  - Ask it to set up DiffDock v1.1.3 and run one pair or a batch. Treat the setup and docking commands as untested recipes, as noted above, and be ready to fix errors.
  - Check that every complex finished. Match the output names to your input list.
  - Read the confidence bands, then run the pose checks on each pose you keep.
  - Use independent validation before you act on a result.
output_sample:
  input:
    - Your protein as a PDB file or a full amino-acid sequence
    - Your small molecule as a SMILES string or an SDF, MOL2, PDB or PDBQT file
    - A CSV of complexes, if you want to dock a batch (optional)
    - Extra protein shapes, one row each (optional)
  prerequisites:
    - A computer with a strong graphics card (GPU) that can run DiffDock
    - The DiffDock v1.1.3 code and its environment, or its Docker image
    - Disk space and internet to download the model weights on first use
    - An AI that can run code and read files
    - Acceptance that the pretrained docking, Docker, GNINA and hosted-demo steps are untested recipes
  output:
    - name: rank1.sdf
      contains: A copy of the top-ranked pose for each complex.
    - name: rank<N>_confidence<score>.sdf
      contains: One file per predicted pose, ranked, with the model confidence score in the file name.
    - name: Confidence reading
      contains: Each score placed in a high, moderate or low band, with a reminder that it is not a probability.
    - name: poses.csv
      contains: Every parsed pose and its score in one table, made by the results helper.
    - name: Pose checks
      contains: A checklist for identity, stereochemistry, geometry, strain and clashes to run on each pose you keep.
    - name: Run commands
      contains: The setup, single pair, batch and config commands to run DiffDock.
