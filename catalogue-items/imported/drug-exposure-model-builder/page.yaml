thinking: high
thinking_why: Choosing and checking the model takes careful reasoning.
new_slug: drug-exposure-model-builder
name: Drug exposure model builder
summary: Turn your drug concentration-over-time data into fitted exposure models, AUC and dose scenarios for research. Not for patient dosing.
job: research-topics
headline: Drug exposure model builder
subhead: Give it concentration-over-time data. Get fitted drug exposure models, research dose scenarios and a clear write-up of what holds. None of it is a dose for a patient. Bring concentration-time data with units. Use the result to plan your next step.
explain: |
  Concentration-over-time numbers turned into fitted drug models, exposure measures and a write-up that says what the data does and does not support. This is exploratory research work. It does not give a dose for a patient.

  The skill makes you fix the basics first: which compound, what matrix, units, the exposure measure, and how to handle values below the assay limit. It then separates the structure model, the residual error and any covariates. It checks whether parameters can really be told apart, using sensitivity and multiple starts. The Python scripts need only NumPy and SciPy. They cover dose simulation, exposure-response, bioequivalence planning and interaction screening.
when:
  - You have concentration-time data and want fitted PK curves.
  - You are planning a bioequivalence study and need sample sizes.
  - You want to screen a drug interaction risk early.
  - You must write up modelling assumptions clearly.
not_for:
  - "You need a dose for a real patient: ask a qualified pharmacometrician or your clinical pharmacist. The monitoring and dose-scenario outputs are research examples, not for setting any patient's dose."
  - "You need full population model fitting or a regulatory submission: use NONMEM or Monolix, which you license separately."
  - "You have no concentration-time data yet: plan your sampling with your study team first, then come back."
you_give:
  - Concentration-time data with units
  - Dose history and sample times
  - The question you want answered
  - Assay limit and covariates (optional)
you_get:
  - Fitted PK or PD models
  - AUC and other exposure measures
  - Regimen simulations
  - A write-up of assumptions and limits
how_to_use:
  - Start here. Get your concentration-time file with units, your dose history and your question ready. Use an AI that can run code, such as Claude with code running turned on. The scripts need Python 3.12 or newer, NumPy 2 and SciPy. They need no internet.
  - 'Open the skill folder and give your AI the SKILL.md file. Say: "Follow this skill on my data."'
  - Upload your concentration-time file. Tell your AI the units, the dose history, the sample times and your question.
  - Add your assay limit and any covariates, if you have them. Say how to treat values below the limit.
  - Read the findings first, then the fits. Check the units and assumptions before you use any result.
  - Treat dose results as research scenarios only. Take clinical questions to a qualified pharmacometrician.
terms:
  - term: AUC
    meaning: The total drug exposure over time. It is the area under the concentration curve.
  - term: Cmax
    meaning: The highest concentration seen.
  - term: Half-life
    meaning: How long the concentration takes to fall by half. The skill's name for the slope it fits is lambda_z.
  - term: Clast
    meaning: The last measured concentration.
  - term: MSM
    meaning: The mechanistic static model, a way to screen drug interaction risk.
output_sample:
  input:
    - Your concentration-time data with units
    - Your dose history and sample times
    - The question you want answered
    - Your assay limit and covariates (optional)
  prerequisites:
    - An AI that can run code
    - Python 3.12 or newer with NumPy 2 and SciPy installed
  output:
    - name: Non-compartmental analysis
      contains: Exposure measures such as AUC, Cmax and half-life, worked out from your concentration-time data.
    - name: Compartmental fit
      contains: A fitted model for each subject, with parameter estimates and checks on whether they can be told apart.
    - name: Regimen simulation
      contains: Simulated concentration curves for the dosing schedules you want to compare.
    - name: Exposure-response result
      contains: How the effect changes with exposure, including QT screening where it applies.
    - name: Bioequivalence plan
      contains: Sample size and design checks for a bioequivalence study.
    - name: Interaction screen
      contains: An early read on drug interaction risk, with assumptions stated.
    - name: Findings and write-up
      contains: A plain account of assumptions, limits and what the data does and does not support.
