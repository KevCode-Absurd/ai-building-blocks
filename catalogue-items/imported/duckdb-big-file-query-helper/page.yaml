job: build-software
headline: DuckDB big file query helper
subhead: Large CSV, Parquet and JSON files queried in place from MATLAB, with no
  giant loading step. You get SQL answers fast, and only the reduced result
  lands in memory.
explain: |
  Large CSV, Parquet and JSON files queried in place from MATLAB, with no giant loading step. You get SQL answers fast, and only the reduced result lands in memory.

  The skill uses DuckDB through the Database Toolbox. On load it audits your code for the slow habit of reading a file into MATLAB, writing it to a database, then querying it. It sends you straight to reading the file with SQL instead. It covers in-memory and file databases, filtering, grouping, deduplicating, cleaning and sampling at the source, and saving to a .duckdb file for repeat use. It also says when not to use it: small files, or number-heavy work better done in MATLAB afterwards.
when:
  - Your file is too big for readtable.
  - Your code loads a CSV only to write it to a database.
  - You need to filter and group a large Parquet file before analysis.
  - You want to profile a dataset before deciding what to load.
you_give:
  - Paths to CSV, Parquet or JSON files
  - The question or summary you need
  - Existing MATLAB code to review (optional)
  - MATLAB with Database Toolbox
you_get:
  - SQL queries that run on the files directly
  - A reduced table ready for MATLAB
  - A review of slow loading patterns
  - A saved .duckdb file for repeat use (optional)
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB R2026a or later with Database
    Toolbox.
