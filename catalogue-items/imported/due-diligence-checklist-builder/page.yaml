thinking: medium
thinking_why: It tailors a standard list to the deal.
new_slug: due-diligence-checklist-builder
name: Due diligence checklist builder
summary: Build a due diligence checklist for your deal. Get a request list by workstream with status tracking and a red flag log, set for Indian deals.
job: money-and-investing
headline: Due diligence checklist builder
subhead: A diligence request list shaped to your deal, split by workstream, with a status column and a place for red flags. You describe the target and sector, and you get a list you can send to the other side and track.
explain: |
  A diligence request list shaped to your deal, split by workstream, with a status column and a place for red flags. You describe the target and sector, and you get a list you can send to the other side and track.

  The skill starts by asking five things: the company and model, the deal type, size, known worries and timeline. It then builds checklists for each area, such as financial, legal, tax, commercial, operations and people, with items picked for the sector. Examples include quality of earnings, debt-like items and customer concentration. This version follows Indian conventions: an April to March year and lakh and crore units, labelled clearly to avoid 100 times errors.
when:
  - You are about to buy or invest in a company and need a request list.
  - You want one tracker the deal team can update.
  - You want sector-specific questions, not a generic list.
  - You need Indian fiscal year and currency handled right.
not_for:
  - "You only want a quick screen of a deal: ask your AI for a short list of top risks, or talk to your adviser first."
  - "Your deal is already past diligence: use a plain tracker in a spreadsheet for the items still open."
  - "Your target is outside India and you need US or UK rules: use a general checklist and add your own local tax and law items."
  - "You need legal, tax or accounting advice on the deal: this list asks the right questions but does not answer them. Take it to your lawyer and accountant."
you_give:
  - Target company, sector and model
  - Deal type and size
  - Known concerns
  - Target timeline
you_get:
  - Checklists by workstream
  - Status tracking columns
  - Red flag notes
  - Priority items for your main concerns
how_to_use:
  - Add this skill to Claude, ChatGPT or Gemini from this page. If you cannot add it, copy the full skill file shown at the bottom of this page and paste all of it in.
  - Tell your AI the target company, sector, deal type, deal size, known worries and timeline.
  - Say what file you want. A spreadsheet with one tab per workstream is the default. If your AI cannot make files, ask for tables.
  - Check the top priority items first. P0 items gate the offer letter or close, so chase those first. Remove any that do not fit your deal.
  - The list comes from your description only. Compare it with what is in the real data room, and have your adviser check it, before you send it to the seller.
  - "When the red flag summary is done, take it to Investment committee memo drafter to write up the deal. Use Acquisition due diligence planner to plan the wider process, or Startup due diligence reviewer if the target is a startup."
  - Send the list to the other side. Update the status column as items arrive, and log each red flag. Take open red flags into your price and terms talks and the investment committee memo, and reuse the tracker for items due after signing.
output_sample:
  input:
    - Target company name, sector and business model
    - Deal type, such as acquisition, add-on or growth equity
    - Deal size
    - Known worries, such as customer concentration (optional)
    - Target date for the offer letter or close
  prerequisites:
    - An AI that can make a spreadsheet file, or one that can print tables you copy into Excel
    - Nothing else to run it. The skill carries only two India rules (April to March fiscal year, lakh and crore). The fuller India convention files it was built with are not in this item, so check other India points, such as tax and company law, with your adviser
  output:
    - name: Workstream checklists
      contains: Request items for financial, commercial, legal, operations, people, technology and environmental review, picked for your sector.
    - name: Status tracker
      contains: Each item with workstream, priority, status, owner and notes, moving from Not Started to Complete or Red Flag.
    - name: Red flag summary
      contains: Each problem found, its workstream, how serious it is, how to fix it and the effect on price or terms.
    - name: Summary dashboard
      contains: Percent complete by workstream, items still open and open red flags.
    - name: Weekly status update
      contains: A short update the deal team can send each week.
    - name: Sector additions
      contains: Extra items for your sector, such as recurring revenue quality for software or payor mix for healthcare.
