thinking: medium
thinking_why: It gathers set figures, then explains what they mean.
new_slug: earnings-preview-writer
name: Earnings preview writer
summary: "Get an earnings preview for any stock ticker: report date, what analysts expect, past beats and misses, and what to watch. Needs code and web access."
job: money-and-investing
headline: Earnings preview writer
subhead: A pre-earnings briefing for one stock, built from live data. Give a ticker and you get the report date, what analysts expect, how the company has beaten or missed before, and what to watch.
explain: |
  A pre-earnings briefing for one stock, built from live data. Give a ticker and you get the report date, what analysts expect, how the company has beaten or missed before, and what to watch.

  The skill uses the yfinance Python package, and installs it if missing. A single script pulls the calendar, estimate tables for earnings and revenue, past surprise history, recent price action and key company facts. It turns these into a short readable brief. The data comes from Yahoo Finance through yfinance, an unofficial package that is not made by Yahoo. It reads Yahoo's web pages, so it can break or be limited without notice and may not suit Yahoo's terms. It is for research only and is not financial advice. You need Python, an internet connection and the ability to install a package.
when:
  - A company reports next week and you want a quick prep sheet.
  - You want to see how often it has beaten estimates.
  - You need the consensus numbers in one place.
  - You hold a stock and want to know what moves it on results.
not_for:
  - The company has already reported. Use earnings-recap to read the results instead of a preview.
  - The company is private or listed outside the US. Yahoo Finance data may be missing, so check the company's own investor page.
  - You want advice on whether to buy or sell. This brief shows what the street expects. Talk to a licensed adviser.
you_give:
  - A stock ticker, or a company name you confirm with the exact ticker
  - Python with internet access
  - Specific metrics to watch (optional, say them before you run the skill)
you_get:
  - The expected report date
  - Analyst estimates for earnings and revenue
  - Past surprise history
  - A short list of what to watch
how_to_use:
  - Open an AI that can run Python and get online, such as Claude with code tools turned on.
  - Paste in this skill, or upload its folder.
  - 'Type the exact ticker, for example: "Write an earnings preview for [TICKER]." Add any metrics you care about (optional). If you give a company name, check the ticker your AI picks before it fetches anything. Several companies have similar names.'
  - Let it install yfinance if asked. This is a free tool that reads Yahoo Finance data.
  - Read the brief. Check any line with missing data, since Yahoo may lack some figures.
  - If the install is refused or Yahoo returns no data, get the report date and estimates from the company's own investor relations page and paste them in for your AI to summarise. Or run it again later.
  - The estimates are a snapshot from the moment you run it. Run it again closer to the report date.
  - After the company reports, use earnings-recap to compare the results with this brief.
terms:
  - term: Consensus
    meaning: The average of what analysts expect the company to report.
  - term: Surprise %
    meaning: How far the real result landed above or below the consensus, as a percent.
  - term: Whisper number
    meaning: An unofficial guess of the result that circulates among traders. This skill does not use it. It shows only the published consensus.
output_sample:
  input:
    - A stock ticker or company name
    - Specific metrics to watch (optional)
  prerequisites:
    - An AI that can run Python code and get online
    - Permission to install the yfinance package, which the skill installs if missing
  output:
    - name: Date and context
      contains: Company, sector, report date, whether it reports before the open, during the session or after the close (or that the time is not confirmed), current price, recent price moves and market cap.
    - name: Consensus estimates
      contains: A table of expected earnings per share and revenue with low, high, analyst count, year-ago value and growth.
    - name: Beat/miss track record
      contains: The last four quarters of estimated against actual earnings, with surprise percent, a beat count and the average surprise.
    - name: Analyst sentiment
      contains: How many analysts rate it buy, hold or sell, plus price targets and the gap from the current price.
    - name: What to watch
      contains: The few things the market will focus on, such as growth, margins and sharp line item changes.
    - name: Overall read and caveats
      contains: A short view of the setup, framed as what the street expects, with notes on data limits.
