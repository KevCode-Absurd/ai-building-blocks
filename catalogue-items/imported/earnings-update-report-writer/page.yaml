thinking: high
thinking_why: It must weigh results against estimates and explain why.
new_slug: earnings-update-report-writer
name: Earnings update report writer
summary: Write an earnings update report for a company you already cover. Get an 8 to 12 page note on the beat or miss, new estimates and your thesis.
job: money-and-investing
headline: Earnings update report writer
subhead: "An 8 to 12 page note on a company's new quarter, written for readers who already know the stock. It focuses on what is new: the beat or miss, changed estimates, and whether the thesis still holds."
explain: |
  An 8 to 12 page note on a company's new quarter, written for readers who already know the stock. It focuses on what is new: the beat or miss, changed estimates, and whether the thesis still holds.

  Target length is 3,000 to 5,000 words, with one to three summary tables and 8 to 12 charts, ready within a day or two of results. The skill follows institutional research habits and sets the text in Times New Roman unless told otherwise. This version is built for Indian markets. It labels periods by an April to March year, such as Q3 FY26, and uses crore and lakh correctly, so you avoid a 10 times unit error.
when:
  - A covered company reported last night and clients expect a note.
  - You need a fast update on an estimate change.
  - You want a clear beat or miss section with charts.
  - You cover Indian listed companies.
not_for:
  - "You need a first report on a company you do not cover yet: write an initiation report with a person or another skill, as this one assumes the reader knows the stock."
  - "You want a quick take or flash note within minutes: write a short summary by hand, as this one makes a full 8 to 12 page report."
  - "You cover US companies and need SEC filings: this version is built for Indian markets, with April to March years and crore units."
you_give:
  - Company name and quarter
  - Reported results and consensus
  - Your prior estimates and rating
  - Style preferences (optional)
you_get:
  - An 8 to 12 page earnings update
  - Summary tables and 8 to 12 charts
  - Updated estimates and thesis check
  - Beat and miss analysis
how_to_use:
  - Open Claude, ChatGPT or Gemini with web search turned on. You also need an AI that can read files and run code to build charts and the Word file.
  - Paste the skill text into the chat, or upload the skill folder.
  - "Gather first: the exchange results filing from BSE or NSE, the investor presentation, the call transcript, and your consensus source."
  - Add your prior estimates, rating and price target. Name the company and the quarter, such as Q3 FY26.
  - Ask your AI to write the earnings update. Check the dates of the results and transcript match the latest quarter.
  - Check every number, unit and source link before you share it. This is a draft, not investment advice.
  - Before you start, know this. Do not share the rating or price target until a named compliance reviewer has signed off. This skill does not write SEBI disclosures. You must supply your firm's disclosure text.
  - Next, send the draft to your compliance reviewer before you publish. A rating and price target are regulated in India (SEBI research analyst rules). Add the disclosure text your firm uses.
output_sample:
  input:
    - Company name and the quarter, such as Q3 FY26
    - The results release, investor presentation and call transcript
    - Consensus estimates and where they came from
    - Your prior estimates, rating and price target
    - Style preferences (optional)
  prerequisites:
    - An AI that can search the web and read files
    - An AI that can run code, to build the charts and the Word file
    - "Optional: consensus figures from a paid source such as Bloomberg or FactSet, or numbers you paste in"
  output:
    - name: Page 1 summary
      contains: The rating, price target and key takeaways, led by whether the company beat or missed estimates.
    - name: Results analysis
      contains: Each key metric against estimates, with the size of the gap and the reason for it.
    - name: Key metrics and guidance
      contains: Segment trends, margins and any change in company guidance.
    - name: Updated thesis
      contains: Whether your investment case still holds after the quarter.
    - name: Valuation and estimates
      contains: Old and new forward estimates side by side, with what changed and why.
    - name: Charts and summary tables
      contains: 8 to 12 charts and 1 to 3 summary tables, each with a source line.
    - name: Sources and references
      contains: Every document used, with date and clickable link.
    - name: Appendix (optional)
      contains: Extra detail that does not fit in the main pages.
