thinking_why: It builds scenarios from known figures.
new_slug: earnings-week-briefing-writer
name: Earnings week briefing writer
summary: Name a company about to report. Get what to watch, scenario cases and
  the numbers that matter.
job: money-and-investing
headline: Earnings week briefing writer
subhead: What to watch before a company reports, set out as scenarios so the
  result does not catch you off guard. Name the company and you get the numbers
  that matter and how each outcome could land.
explain: |
  What to watch before a company reports, set out as scenarios so the result does not catch you off guard. Name the company and you get the numbers that matter and how each outcome could land.

  The skill starts with context: the quarter, consensus revenue and earnings per share found by web search, the date and time of release, and anything said on the last call. It then builds a watch list tied to this company, including segment revenue, margins, free cash flow and guidance against consensus. It sets out bull, base and bear cases. Indian conventions apply: an April to March year, and crore and lakh units with careful labels.
when:
  - Results are due soon and you want a one-page plan.
  - You need bull, base and bear cases written down.
  - You want the guidance numbers that could swing the share price.
  - You follow Indian companies and need fiscal labels right.
you_give:
  - Company name and quarter
  - Consensus numbers (optional)
  - Your view or position (optional)
  - Segments you care about (optional)
you_get:
  - A what-to-watch list
  - Scenario cases
  - Consensus estimates and results date
  - Key metrics and guidance checks
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
