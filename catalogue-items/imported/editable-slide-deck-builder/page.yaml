thinking: high
thinking_why: It plans the story, then each slide layout, then checks them.
new_slug: editable-slide-deck-builder
name: Editable slide deck builder
summary: Build an editable PowerPoint deck from your story and sources. Every title, table and chart stays editable, and you get a quality check.
job: work-with-files
headline: Editable slide deck builder
subhead: A PowerPoint file where every title, label, table and chart can be edited, not pasted in as a picture. You give your story and sources, and you get a deck plus a quality check.
explain: |
  A PowerPoint file where every title, label, table and chart can be edited, not pasted in as a picture. You give your story and sources, and you get a deck plus a quality check.

  The skill plans the story first, then picks a design direction, then writes an exact layout for each slide. It builds the file from real PowerPoint objects. Images may support a slide but never replace text, data or diagrams. You can show it a reference deck to learn the structure, without copying its files. A final review checks layout, file structure and accessibility. For changing an existing file, another skill is better.

  When it looks up a design style, it may fetch public design pages over the internet. It reads them as reference only and never sends your files or text out. It falls back to a built-in style if a page looks wrong.

  Licence: one licence applies to this copy, CC BY 4.0, as the LICENSE-CONTENT file says. That file governs. The author's own file header (kimtth) says MIT for the original. Both allow reuse with credit, so keep the credit to kimtth and sickn33.
when:
  - You need a new deck that colleagues can edit later.
  - You have data and a story and want slides with real charts.
  - You want an existing deck reviewed for layout and access problems.
  - You want a deck planned before any slides are made.
not_for:
  - "You want to change, fill in or fix an existing PowerPoint file: use a skill that edits existing PowerPoint files, such as @pptx-official, the PowerPoint skill this one points to."
  - "You only need a quick outline or talking points: ask your AI for a plain list and skip building a file."
  - "You want a deck made of slide pictures or screenshots: this builds real text, tables and charts, not images."
you_give:
  - Your main message and audience
  - Source facts, data and figures
  - A reference deck (optional)
  - Brand colours and fonts (optional)
you_get:
  - A PowerPoint file with editable content
  - A slide-by-slide layout plan
  - A story outline
  - A quality and accessibility check
how_to_use:
  - Pick a tool that can run Python, such as an AI coding assistant like Claude Code or Codex. Your AI writes and runs the python-pptx builder script, so you do not need to code. It needs Python and the python-pptx library. The skill ships no ready-made builder program, so your AI has to write a short python-pptx script for your deck first. A chat that cannot run code can only plan the deck.
  - "Build path: install Python 3 and the library with pip install python-pptx. Your AI writes the builder script first, then runs it to save the .pptx file."
  - Paste this skill into your AI. Then give it your main message, your audience, your source facts and figures, and any brand colours or fonts.
  - Pick a story structure when your AI asks. It will not pick one for you.
  - Check the story plan and slide layouts before the file is built. Fix anything that looks wrong.
  - Image or design services are optional. They need their own account, and your AI should ask before sending anything out.
  - After the build, open the audit results. Fix the failed checks that hide or cut off content first (overlaps, text too small, tables that overflow), then the accessibility ones. Ask your AI to re-run the audit after your edits, then share the file so others can edit it. For later changes to the finished file, use @pptx-official.
output_sample:
  input:
    - Your main message and who the deck is for
    - Your source facts, data and figures
    - A reference deck to learn the look from (optional)
    - Your brand colours and fonts (optional)
    - Your choice of story structure
  prerequisites:
    - An AI that can run code and save files, with Python and the python-pptx library
    - An image or design service is optional and needs its own account
  output:
    - name: Deck summary
      contains: The story structure you chose, the design style, the sources used and any assumptions you approved.
    - name: Slide specification
      contains: "An exact layout for every slide: where each text box, shape, line, table and image sits."
    - name: PPTX file
      contains: The finished PowerPoint deck, built from real editable objects, with alt text and reading order.
    - name: Build manifest
      contains: A record of how the file was built, saved next to the deck.
    - name: Audit records
      contains: Checks for overlaps, small text, margins, table fit, editability and accessibility, with any problems left over.
    - name: Source manifest
      contains: Each fact, number and chart value matched to its source.
