job: plan-supply-chain
headline: Electronics parts sourcing planner
subhead: Give it your parts list. Get a plan for scarce parts, long lead times and leftover stock.
explain: |
  A plan for the parts that can stall your build: scarce chips, long lead times and leftover stock. Give it your parts list and manufacturing setup, and you get a sourcing plan with the risky items picked out.

  The skill first learns how you build, as OEM, ODM or contract maker, your volume, and whether your supply is single-sourced or spread out. It looks at your component mix, such as chips, memory, passives and custom parts, and at suppliers, distributors and consignment. It then tackles allocation, lead time swings, excess and obsolete stock, end-of-life parts and cost targets. It suggests second sources and buffer stock for the riskiest lines.
when:
  - A key chip has a 40 week lead time.
  - You hold stock of a part that is going out of date.
  - You depend on one supplier for a critical part.
  - You are planning volume for a new product launch.
you_give:
  - Your bill of materials or parts list
  - Product type and volume
  - Current supplier setup
  - Known shortages or cost targets (optional)
you_get:
  - A list of high-risk parts
  - Sourcing options and second sources
  - A plan for excess and obsolete stock
  - Lead time and buffer advice
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
