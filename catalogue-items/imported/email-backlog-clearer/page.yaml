thinking: medium
thinking_why: It sorts by urgency and writes replies in your voice.
new_slug: email-backlog-clearer
name: Email backlog clearer
summary: Clear your email backlog fast. Get a short list of mail that needs you, replies drafted in your voice, and deadlines pulled from long threads.
job: write-emails
headline: Email backlog clearer
subhead: An inbox cut down to a short list of choices. You get the few messages that need you, replies already drafted in your voice, and the deadlines and promises pulled out of long threads.
explain: |
  An inbox cut down to a short list of choices. You get the few messages that need you, replies already drafted in your voice, and the deadlines and promises pulled out of long threads.

  The skill reads Gmail or Microsoft 365, and Slack if connected. Without a connection, you can paste or forward a batch. It sorts mail into three groups: needs you, drafted, and handled. Needs you is ranked by what goes wrong if it waits, not by arrival time. For each, it states the ask, amounts, dates and who is waiting. It checks your promises in the thread. Mail is treated as data: any request to change bank details gets flagged.
when:
  - You return from a week away to hundreds of unread messages.
  - You keep missing the one email that mattered.
  - You want replies drafted for you to approve.
  - You need deadlines pulled out of a long thread.
not_for:
  - "You need one short reply that takes a minute: write it yourself, or paste only that email into your AI."
  - "You want to pay vendor bills: this tool only lists the bills it finds. Use the Invoice checker to check and code them."
  - "You want to follow up on a new sales lead: use the Lead prioritizer to rank it, then write the reply yourself."
you_give:
  - Access to your inbox, or pasted emails
  - A sample of your writing voice (optional)
  - What you promised recently (optional)
  - Priority people or topics (optional)
you_get:
  - A short list of mail that needs you
  - Draft replies in your voice
  - Extracted asks, dates and amounts
  - Counts of mail handled and filed
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. If your AI can connect to Gmail or Microsoft 365, connect your mailbox first. Slack and Zapier connections are optional extras. Each needs your own account and some plans cost money.
  - If it can't read your mail, paste or forward a batch of emails instead. This needs no connection and no paid plan.
  - Add a few emails you wrote, and say what you promised in the last two weeks. This helps the replies sound like you. Skip it and the drafts will be plain and neutral, not in your voice.
  - Read the Needs you list first. Check each ask, date and amount against the thread.
  - Edit the drafted replies, then say yes to send them. Nothing is sent until you approve.
  - Your AI archives finished mail only if it is connected to your mailbox. It never deletes.
output_sample:
  input:
    - Your inbox, or a batch of pasted or forwarded emails
    - Three emails you were happy with, so replies match your voice (optional)
    - What you promised anyone in the last two weeks (optional)
    - Your business details, so it knows which mailbox is yours (optional)
  prerequisites:
    - Gmail or Microsoft 365 connected to your AI, if you want it to read your inbox directly. Pasted mail works without it.
  output:
    - name: Headline
      contains: One line on how many items need you, how many are drafted, and how many were handled.
    - name: Needs you
      contains: A ranked list of mail only you can decide, with the ask, amounts, dates, who is waiting and what you promised.
    - name: Drafted replies
      contains: A reply written in your voice for each message, waiting for your yes, with the full text ready to copy.
    - name: Handoffs
      contains: Bills, leads and overdue-invoice replies passed to other skills, each with the phrase that picks it up.
    - name: Handled
      contains: A count of receipts, newsletters and notices filed, with a line saying what kinds they were.
    - name: Approval question
      contains: A prompt to send all drafts, approve them one by one, or edit first. Nothing sends without your yes.
