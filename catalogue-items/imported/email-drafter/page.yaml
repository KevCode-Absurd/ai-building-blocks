thinking: low
thinking_why: One short message needs little planning.
new_slug: email-drafter
name: Email drafter
summary: Write one clear email with a subject line, short body and a single ask. Give it who it is for and what you need. Fits cold, follow-up and support emails.
job: write-and-tell-stories
headline: Email drafter
subhead: One clear email, written for the person who will read it. Say who it is for and what you need, and you get a subject line, body and call to action in the right tone.
explain: |
  One clear email, written for the person who will read it. Say who it is for and what you need, and you get a subject line, body and call to action in the right tone.

  The skill works in six steps. First, pin down the type of email, such as outreach, follow-up or support reply, and the goal. Second, size up the reader and set the tone. Third, write a specific subject line under 60 characters. Fourth, build the body: a short hook, two or three tight paragraphs, then one ask. Fifth, add a sign-off to match. Sixth, check it against a list before handing it back.
when:
  - You need a cold email that gets a reply.
  - You are writing a hard follow-up and want the tone right.
  - You must answer an upset customer.
  - You have the points but not the words.
not_for:
  - "You want a run of follow-up emails over several weeks: use sales-email-sequences, not a single draft."
  - "Your email holds contract terms, NDA wording or legal promises: get a lawyer or another person to review it before you send."
  - "You need a long newsletter or a blog post: write it in your AI as a normal chat, with the topic and your readers named."
you_give:
  - Type of email
  - Who it is for
  - What you want to happen
  - Key points and tone (optional)
you_get:
  - A subject line
  - A complete email draft
  - One clear call to action
  - A quick checklist review
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page. No code, files or paid tools are needed.
  - Tell your AI the email type, who it is for, what you want to happen, and the tone. Add key points if you have them.
  - Read the draft and check every number, promise, discount and product claim against your real facts. Delete any detail you did not give it.
  - Ask for changes, such as shorter, warmer or a different ask. Keep one ask per email.
  - Paste the final email into your email app and send it. For follow-ups over several weeks, use sales-email-sequences.
output_sample:
  input:
    - The type of email, such as cold outreach, follow-up, support reply, internal update or meeting request
    - "Who it is for: name, job and company if you know them"
    - What you want to happen after they read it
    - Key points to include (optional)
    - The tone you want, such as formal, casual, empathetic or urgent (optional)
  output:
    - name: Subject line
      contains: A specific subject under 60 characters that names a clear benefit or context point.
    - name: Email body
      contains: A short opening hook, then two or three tight paragraphs of the core message.
    - name: Call to action
      contains: One clear ask at the end, such as a time for a call or a reply.
    - name: Sign-off and signature
      contains: A closing line that matches the tone, then your name, title and contact details.
    - name: Checklist review
      contains: A quick check of subject, tone, single ask, word count and any placeholders left unfilled.
