thinking: low
thinking_why: It makes small edits and keeps your wording.
new_slug: email-mistake-fixer
name: Email mistake fixer
summary: Fix typos and grammar in your email draft without changing your voice. Get a change list back, and clean tracking bits from links if you ask.
job: write-emails
headline: Email mistake fixer
subhead: Your email, with small errors fixed and your voice left alone. Paste a draft and get a corrected copy that still sounds like you and promises the same things.
explain: |
  Your email, with small errors fixed and your voice left alone. Paste a draft and get a corrected copy that still sounds like you and promises the same things.

  The skill makes two passes. The first fixes only plain mistakes: doubled words, wrong a or an, subject and verb mismatch, mixed-up words like your and you're, and stray caps or punctuation. It leaves fragments, contractions, casual greetings and slang alone, since those are choices. If unsure, it flags the doubt in a note. Names, numbers, dates and quotes never change. The second pass runs only if you ask. It strips known tracking tags from links and keeps every other part, so links still work.
when:
  - You want a last check before pressing send.
  - You do not want an editor to rewrite your tone.
  - You want tracking tags removed from links in a message.
  - You have a long message and typos slip by.
not_for:
  - "You want a new tone, a shorter email or a full rewrite: ask your AI for a rewrite in plain chat instead, and say the style you want."
  - "You need someone to check the facts, dates or timing in the email: have a colleague read it before you send."
  - "You want the email sent or scheduled: send it yourself from your email app, since this only edits text."
you_give:
  - Your draft email
  - Whether to clean links (optional)
  - Any words or names to leave alone (optional)
you_get:
  - The corrected email
  - A list of what was changed
  - Notes on things you may want to check
  - Cleaned links (only if asked)
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini and paste the skill instructions first.
  - Paste your draft email under the instructions.
  - Say if you want links cleaned. Add any names or words to leave alone.
  - Read the Changes made and Left alone lists. Check anything you disagree with.
  - Copy the corrected draft into your email app. Re-enter any link marked [REDACTED], then send it yourself.
output_sample:
  input:
    - Your draft email
    - Whether to clean tracking bits from links (optional)
    - Names or words to leave alone (optional)
  output:
    - name: Corrected email
      contains: Your draft with small mistakes fixed, in the same layout it arrived in.
    - name: Changes made
      contains: One line for each change, such as a doubled word or a wrong a or an.
    - name: Left alone
      contains: Things judged to be your voice, plus any link it was unsure about, so you can decide.
    - name: Cleaned links
      contains: Links with known tracking tags removed and every other part kept. Only appears if you ask.
