thinking: medium
thinking_why: It links design choices to a goal, which takes some judgement.
new_slug: emotion-led-design-brief-writer
name: Emotion-led design brief writer
summary: Write a design brief from the feeling you want. Get colour, type, imagery and layout choices a designer can use, with reasons for each.
job: design-work
headline: Emotion-led design brief writer
subhead: A design brief that starts with the feeling you want people to have, then picks colour, type, imagery and layout to support it. Name the feeling, such as calm, trust or urgency, and get specific choices you can hand to a designer.
explain: |
  A design brief that starts with the feeling you want people to have, then picks colour, type, imagery and layout to support it. Name the feeling, such as calm, trust or urgency, and get specific choices you can hand to a designer.

  The skill first asks about your audience, their culture and state of mind, your goal, and brand or accessibility limits. It sets the target emotion, then maps colour by audience and category, since colour feelings vary across cultures. It continues with type, spacing, image style and layout. The research it cites is marked as ideas to test with your own audience before you rely on it.
when:
  - Your page looks fine but does not feel right.
  - You are briefing a designer and need more than "make it pop".
  - You want a premium look for one launch and calm for another.
  - You sell to people from different cultures.
not_for:
  - "You need a full brand identity with logo, name and rules: hire a brand designer."
  - "You have no idea who your audience is: do some audience research or user testing first, then come back."
  - "You want proof that a colour will raise sales: run a test with your own audience, as this gives ideas to try, not proof."
you_give:
  - The feeling you want
  - Your audience
  - Brand and accessibility limits
  - The platform, such as web or packaging (optional)
you_get:
  - A colour direction with reasons
  - Type and spacing guidance
  - Image style guidance
  - A layout approach in a short brief
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tool is needed.
  - Say the feeling you want, such as calm, trust or urgency.
  - Describe your audience, your goal, and any brand or accessibility limits.
  - Answer any question your AI asks about culture or audience. It will ask if the feeling is unclear.
  - Read the brief. It has six headed sections: target emotion, colour, type, spacing, imagery and an accessibility check. Check the contrast of your text and buttons.
  - Take the brief to your designer. Test the emotion and colour choices with 5 to 10 real people from your audience, and check text contrast before launch. Pair it with Page copywriter for the words, and Everyday usability reviewer to check the design afterwards.
output_sample:
  input:
    - The feeling you want, such as calm, trust or urgency
    - Who your audience is, including culture and state of mind
    - Your goal for the design
    - Brand and accessibility limits (optional)
    - The platform, such as web or packaging (optional)
  output:
    - name: Target emotion
      contains: The one main feeling the design must create, and who it is for.
    - name: Colour direction
      contains: Colour choices matched to your audience and culture, with a reason for each.
    - name: Typography
      contains: Type style that fits the feeling and stays easy to read.
    - name: Spacing and hierarchy
      contains: How whitespace and layout order reduce effort and guide the eye.
    - name: Imagery
      contains: The kind of images that support the feeling and fit your audience.
    - name: Accessibility and ethics check
      contains: A check that text contrast, culture and honesty of the visuals hold up.
