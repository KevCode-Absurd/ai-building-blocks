thinking: medium
thinking_why: It plans a path of feelings, then checks the flow.
new_slug: emotional-arc-mapper
name: Emotional arc mapper
summary: Give it a story, page or campaign. Get the feeling you want at each
  step, from attention to action.
job: write-and-tell-stories
headline: Emotional arc mapper
subhead: A step-by-step map of the feeling you want at each point of a page, ad,
  story or campaign, from first attention to action. Give it the piece and the
  reader, and you get an arc to write against.
explain: |
  A step-by-step map of the feeling you want at each point of a page, ad, story or campaign, from first attention to action. Give it the piece and the reader, and you get an arc to write against.

  The skill asks where the reader starts emotionally, where they should end, what you want them to do, and any channel or ethical limits. Then it sequences the feelings, such as tension, recognition, hope and confidence, and matches each stage to a section of your content. It treats emotion and reasoning as working together. The research notes are labelled as ideas to test. It checks the pacing so the ask arrives after the trust.
when:
  - Your landing page lists claims but does not pull people in.
  - You are outlining a pitch and want the right order.
  - You want an email series to feel like a story.
  - You want to check an ad for emotional gaps.
you_give:
  - The content or campaign
  - Reader's starting and ending feeling
  - The action you want
  - Channel, length and brand voice (optional)
you_get:
  - An emotional arc, step by step
  - Feelings matched to content sections
  - Pacing advice
  - Where to place the ask
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
