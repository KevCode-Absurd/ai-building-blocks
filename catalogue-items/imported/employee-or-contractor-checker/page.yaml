thinking: high
thinking_why: The tests are fact-heavy and differ by place.
new_slug: employee-or-contractor-checker
name: Employee or contractor checker
summary: Check if a worker should be an employee or a contractor. Describe the job and get the tests that apply and the risk flags. Not legal advice.
job: hire-people
headline: Employee or contractor checker
subhead: Describe how someone will work for you. Your AI runs the employee or contractor tests for your place. You get the risk points marked, and what to fix before work starts.
explain: |
  A first read on whether a person should be treated as an employee or a contractor, with the risk points marked. Describe how they will work for you, and you get the tests that apply and where your plan does not fit. This is not legal advice. For existing relationships, talk to a lawyer.

  The skill uses what you give and asks only about gaps. It runs the classification tests for the place involved, then flags where real working life clashes with the contractor label. Examples are your tools, set hours, working in a team, working only for you, and pay by project. Use it before the work starts.

  Credit: this is Anthropic's worker-classification skill from its claude-for-legal collection, copied as it is under the Apache 2.0 licence (see the LICENSE file). We only gave it a plain name.
when:
  - You want to hire a freelancer for six months.
  - You have a recruiter who works only for you.
  - A role looks more like a job than the contract says.
  - You are about to draft a contractor agreement.
not_for:
  - The person already works for you. Talk to an employment lawyer, because this check is only for work that has not started.
  - You need a final legal ruling or a signed opinion. Ask an employment lawyer, because this gives a first read only. For a close call, book a single consultation.
  - You need a contract written. Ask a lawyer or use a contract template, because this does not draft agreements.
you_give:
  - How the person will work day to day
  - Where the person will do the work
  - Who sets their hours, and who supplies tools
  - How they are paid, and whether they work for others
  - Your contract draft (optional)
you_get:
  - The tests that apply in your place
  - Flags where the plan looks like employment
  - Questions to settle before starting
  - A short summary of the risk areas
how_to_use:
  - "In Claude, ChatGPT or Gemini, paste the skill, then say: skip the config file; ask whether the work has already started and stop if it has; gather the facts; look up the tests for my country or state; apply each test to my facts; flag the gaps and give a bottom line, the points for a lawyer and the next steps. Tag every law as unverified."
  - "Warning: without a legal research tool, the tests, laws and cases it names come from the AI's memory and may be wrong. Check each one on the official government site before you act on the bottom line."
  - "Places covered: the skill has no fixed list of countries or states. It looks up the tests for the place you name, and its examples lean on the US (such as California). Say your country or state, and treat anything outside the US as less certain."
  - "Start with three facts: the role and daily work, the hours and tools, and the pay and place. Then paste your answers about the rest."
  - The legal research step works best with a paid tool like Westlaw or CourtListener. Without one, ask your AI to tag every cited law as unverified, then check each one on the official government site before you rely on it.
  - Read the bottom line and the flagged items first.
  - Take the red flags to an employment lawyer before you sign anything. For a close call, a single consultation with an employment lawyer is the cheaper next step.
  - In Claude Code only, you can paste the full skill as it is. It uses a saved config file that exists only there. The full skill file is long (about 400 lines); the steps above are the short version.
output_sample:
  input:
    - How the person will work day to day
    - Where they will do the work
    - Who sets their hours, and who supplies tools
    - How they are paid, and whether they work for others
    - Your contract draft (optional)
  prerequisites:
    - An AI chat such as Claude, ChatGPT or Gemini
    - A legal research tool like Westlaw or CourtListener (optional, paid). Without one, check every cited law yourself.
  output:
    - name: Bottom line
      contains: A short verdict on whether the plan looks like a contractor, an employee, or is unclear.
    - name: Classification
      contains: The label the facts support, and how it compares with the label you wanted.
    - name: Test results
      contains: One block per test that applies in your place, with how each fact scores.
    - name: Gap analysis
      contains: The points where real working life clashes with the contractor label.
    - name: Escalation
      contains: Which flagged items to take to an employment lawyer before you sign.
    - name: Next steps
      contains: What to settle or change before the work starts.
how_it_works:
  - title: Check the work has not started
    text: Asks first whether the person already works for you. If yes, it stops and points you to an employment lawyer.
  - title: Gather the facts
    text: Asks about day-to-day work, hours, tools, pay and other clients, and only about what you have not said.
  - title: Find the tests for your place
    text: Looks up the employee or contractor tests for your country or state and tags each source.
  - title: Apply the tests
    text: Scores your facts against each test and marks where real working life clashes with the contractor label.
  - title: Flag and hand back
    text: Gives a bottom line, the flagged items to take to a lawyer, and what to settle before work starts.
