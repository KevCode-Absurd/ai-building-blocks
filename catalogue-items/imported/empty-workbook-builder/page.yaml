thinking: low
thinking_why: It builds from a fixed list of fields.
new_slug: empty-workbook-builder
name: Empty workbook builder
summary: Turn a field list you already agreed into an empty Excel workbook or CSV, with clean headings and formats. Use it for a manual register or template.
job: work-with-files
headline: Empty workbook builder
subhead: A tidy, empty Excel or CSV file built only from the fields you have already agreed, with no made-up rows and no extra dashboards. You hand it the list, and you get a workbook ready to fill in by hand or import.
explain: |
  A tidy, empty Excel or CSV file built only from the fields you have already agreed, with no made-up rows and no extra dashboards. You hand it the list, and you get a workbook ready to fill in by hand or import.

  It acts as a helper for other skills. It does not decide which fields you need. It takes the confirmed list and sets columns, headings, formatting and entry rules. Because the workbook and CSV come from the same list, they always match. Use it for registers, templates or importable tables.
when:
  - You agreed a field list and now need a real file.
  - You want a register your team fills in by hand.
  - You need a CSV for a data import.
  - You want a template without sample data.
not_for:
  - "You still need to decide which fields to track: work that out first with your team or the skill that makes your field list."
  - "You want a dashboard, charts or sample rows: build those by hand in Excel or Google Sheets."
  - "You only need to fix dates or column widths in a file you already have: ask your AI to do that fix directly."
you_give:
  - The confirmed field list
  - "File type: Excel or CSV"
  - Column rules (optional)
  - Sheet name (optional)
you_get:
  - An empty formatted workbook
  - A matching CSV (optional)
  - Clear column headings
  - No invented rows
how_to_use:
  - Have your confirmed field list ready. If you don't have one yet, make it first with a skill that decides your fields, such as the Database schema planner, then paste the list here.
  - Open your AI. Use one that can run code and save files, like Claude or ChatGPT with file tools on. Making an .xlsx file often needs a paid plan or a tool with file access. On a free chat without file tools, ask for the CSV as plain text and paste it into a text file or Excel yourself.
  - Paste the skill, then paste your field list and say if you want Excel or CSV.
  - Add any column rules, such as which columns are dates or pick-lists. Add a sheet name if you want one.
  - Open the file and check the headings, order and formats. Ask your AI to fix anything that is off.
  - Fill it in by hand, or import the CSV into your other tool. After the import, check the first 5 rows to see that dates and numbers landed in the right columns.
output_sample:
  input:
    - Your confirmed field list
    - "The file type you want: Excel or CSV"
    - Rules for each column, such as dates or choices (optional)
    - A sheet name (optional)
  prerequisites:
    - An AI that can run code and save files, so it can make the .xlsx or CSV file
  output:
    - name: Empty workbook (.xlsx)
      contains: One sheet with your fields as column headings, no rows of data, and entry rules where you asked for them.
    - name: Header row formatting
      contains: Bold headings, a frozen top row, a filter on the headings, and sensible column widths.
    - name: Column formats
      contains: Date format on date fields, number format on number fields, and wrapped text on long-text fields.
    - name: Matching CSV (optional)
      contains: A CSV file with the same headings in the same order as the workbook.
