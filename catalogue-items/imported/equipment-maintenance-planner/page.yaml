thinking_why: It weighs repair cost against downtime.
new_slug: equipment-maintenance-planner
name: Equipment maintenance planner
summary: Give it your machines and repair history. Get a service schedule and
  spare parts list that cut breakdowns.
job: plan-supply-chain
headline: Equipment maintenance planner
subhead: A service schedule for your machines, plus a spare parts list sized to
  what actually fails. The aim is fewer surprise breakdowns and less money spent
  on repairs that could have been avoided.
explain: |
  A service schedule for your machines, plus a spare parts list sized to what actually fails. The aim is fewer surprise breakdowns and less money spent on repairs that could have been avoided.

  It starts by asking which machines matter most, how old they are, how often they fail and what a stoppage costs. Then it sorts each machine into one of four approaches: run until it breaks, fixed-interval service, condition-based checks, or predictive monitoring. It uses failure and repair figures such as mean time between failures and mean time to repair, and ranks machines by risk. The result is a plan with tasks, intervals and the parts to keep on the shelf.
when:
  - Your key machines keep breaking at bad times and you want a plan to stop it.
  - You service everything on the same calendar and suspect some of it is wasted
    effort.
  - You need to decide which spare parts are worth holding in stock.
  - You are moving from fix-when-broken to planned servicing and need a starting
    schedule.
you_give:
  - List of machines with age and condition
  - Repair and downtime history
  - Cost of a stoppage per hour or day
  - Current service routine (optional)
  - Maintenance software you use (optional)
you_get:
  - Service plan per machine
  - Ranked list of risky equipment
  - Spare parts list
  - Failure and repair time figures
  - Simple goals to track
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
