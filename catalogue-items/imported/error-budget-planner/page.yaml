thinking: medium
thinking_why: It turns user needs into numbers and alert rules.
new_slug: error-budget-planner
name: Error budget planner
summary: Plan your service level targets, monthly error budget and alert rules from what users feel. Give it your service name and purpose.
job: ship-and-host
headline: Error budget planner
subhead: Name your service. Get service level targets, error budgets and alert rules that match what users feel. Bring name and purpose of the service. Use the result to plan your next step.
explain: |
  Reliability targets for your service, written as numbers a team can act on: how much downtime users will put up with, how much of it you can spend, and when to raise an alarm.

  You name the service and what users do with it. The skill picks service level indicators that match what users feel, such as success rate and response time, then sets targets for each. From a target it works out the error budget, the amount of failure you can afford in a month. It then writes alert rules that fire when the budget burns too fast. It also suggests a dashboard, and asks you to check targets against real data first.
when:
  - You run a service and have no clear promise on how reliable it should be.
  - Your alerts fire constantly and nobody trusts them.
  - Your team argues about shipping features versus fixing stability.
  - You need a dashboard that shows reliability against a target.
not_for:
  - "You only want basic uptime checks with no reliability target: set up a simple ping monitor in your hosting tool instead."
  - "You have no access to service numbers like success rate or response time: collect a few weeks of data first, or ask your engineer."
  - "You need a legal uptime promise for a customer contract: ask a lawyer and your team lead to agree the terms."
you_give:
  - Name and purpose of the service
  - Current uptime and speed numbers (optional)
  - What users most care about
  - Monitoring tools you use (optional)
you_get:
  - Service level indicators and targets
  - Error budget per month
  - Alert rules for fast and slow burn
  - Dashboard outline
  - Reporting routine
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code running or paid tool is needed.
  - Paste the skill instructions into the chat.
  - "Gather these numbers first, from your monitoring tool, hosting dashboard or logs: the success rate of requests, response time at the 50th and 99th percentile, and the number of requests per day. Add your service name, what it does and what users care about most. If a number is missing, the AI marks it as missing and does not invent one."
  - Add your current uptime and speed numbers, if you have them. The budget is worked out as (1 - target) x minutes in the month, so a 99.9% target over 30 days leaves 43.2 minutes. You can check the numbers yourself.
  - Check each target against real data before you share it. Ask your team to agree on the targets.
  - The example alert rules use burn rates of about 14 over 1 hour and about 6 over 6 hours. These are common starting values from Google's SRE workbook. Do not copy them blindly. Adjust them to your own data and team.
  - Turn the alert rules into your monitoring tool's format and build the dashboard.
  - "What next: hold a short review with the people who own the service and agree the targets. Then set the alerts up with the Uptime and alert setup planner or the Logging and alerts setter. Write down who responds with the Incident runbook writer."
next: [uptime-and-alert-setup-planner, logging-and-alerts-setter, incident-runbook-writer]
output_shape: |
  A table of: indicator | target | error budget in minutes per month | alert threshold (burn rate and time window)
  Then two alert rules (fast burn and slow burn), a dashboard outline and a review routine. Expect about one to two pages.
output_sample:
  input:
    - Your service name and what it does
    - What users care about most
    - Your current uptime and speed numbers (optional)
    - The monitoring tools you use (optional)
  prerequisites:
    - Access to service numbers such as success rate and response time, so targets can be checked against real data
  output:
    - name: SLIs and targets
      contains: The measures that match what users feel, such as success rate and response time, each with a target.
    - name: Error budget per month
      contains: How much failure you can afford each month, worked out from each target.
    - name: Alert rules
      contains: Rules that fire when the budget burns fast or slow, so alerts point to real problems.
    - name: Dashboard outline
      contains: A suggested layout showing each measure against its target.
    - name: Review routine
      contains: How and when your team checks the targets and budget together.
