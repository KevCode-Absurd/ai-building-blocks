thinking: medium
thinking_why: It pulls scattered facts into one brief a busy person can act on.
new_slug: escalation-brief-writer
name: Escalation brief writer
summary: Turn a stuck customer issue into an escalation brief for engineering or leadership, with impact, what was tried and a clear ask.
job: help-customers
headline: Escalation brief writer
subhead: Give it a stuck customer issue and what you know so far. It checks whether the issue needs escalating, then writes one brief for the right team. The brief shows impact, what was tried and what you need.
explain: |
  One page that gets a stuck customer issue noticed by engineering, product or leadership, with everything they need so nobody has to come back with questions.

  You describe the problem and who it hits. The skill first checks whether it truly needs escalating or can stay in support. Then it gathers the timeline, what was already tried and the exact steps to reproduce. It scores business impact on breadth, depth, duration, revenue at risk and deadline pressure, and picks the right target: second-line support, engineering, product, security or leadership. The brief opens with a clear ask and ends with next steps and who owns them.
when:
  - A bug has gone past normal support and engineers need the full picture.
  - Several customers report the same fault and you need to show the pattern.
  - A key account threatens to leave and leadership must decide fast.
  - Your escalations keep bouncing back for missing detail.
not_for:
  - "The issue has a known workaround or is a setup problem: solve it in support first, and share the fix with the customer."
  - "The customer only needs guidance or training: answer in the ticket, with no escalation."
  - "You suspect a data leak or unauthorized access: tell your security team right away, then write the brief."
you_give:
  - A short description of the issue
  - The customer or account name (optional)
  - Ticket history and fixes already tried
  - Revenue or contract at risk (optional)
  - Error messages, screenshots or logs (optional)
you_get:
  - An escalation brief that opens with a clear ask
  - Reproduction steps for bugs
  - An impact summary covering who is hit, how badly and for how long
  - A suggested team to send it to
  - A deadline and next steps
  - Offers to draft a customer update or set a follow-up
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Copy the skill instructions and paste them into a new chat.
  - Paste your issue description, ticket history and anything you already tried.
  - Add the customer name and revenue at risk if you have them. If a detail is missing, your AI should ask or mark it missing.
  - Check the brief for facts and numbers. Fix anything wrong, then send it to the team it names.
  - Ask for a customer update or a follow-up reminder if you want one.
output_sample:
  input:
    - A short description of the issue
    - The customer or account name (optional)
    - Ticket history and fixes already tried
    - Revenue or contract at risk (optional)
  prerequisites:
    - "Optional: an AI that can read your help desk, chat or CRM. Without one, paste the details in yourself."
  output:
    - name: Header
      contains: A one-line summary, severity, target team, who reported it and the date.
    - name: Impact
      contains: Who is affected, what they cannot do, revenue at risk and how long it has gone on.
    - name: Issue Description
      contains: A short, clear account of the problem in 3 to 5 sentences.
    - name: What's Been Tried
      contains: Each troubleshooting step and what happened.
    - name: Reproduction Steps
      contains: Numbered steps for a bug, with expected result, actual result and environment.
    - name: Customer Communication
      contains: The last update sent, what the customer expects and the risk of further escalation.
    - name: What's Needed
      contains: The specific ask and the deadline for an answer or update.
    - name: Supporting Context
      contains: Related tickets, internal threads, logs and documents.
