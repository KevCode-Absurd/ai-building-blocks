thinking: low
thinking_why: It fetches listed facts and tabulates them.
new_slug: etsy-search-results-collector
name: Etsy search results collector
summary: "Pull an Etsy search results scraper table for any keyword: rank, price, ratings, ad or organic, and the shop behind each listing."
job: run-your-store
headline: Etsy search results collector
subhead: Give it a keyword, a phrase or a category. It pulls the live Etsy search results into a table. You see rank, price, ratings, badges, ads and shops in one view.
explain: |
  A table of what is ranking on Etsy for a keyword right now: position, price, rating, badges, ad or organic, and the shop behind each listing. It is a quick view of your market without scrolling pages by hand.

  You name a keyword or category and how many pages to pull. The skill runs a ready-made scraper on Apify through an MCP connection and returns each row. It needs an Apify account and token, which you add yourself, and it asks before spending credits on large page counts. Filters like best seller, star seller, free shipping and ship-to country are optional. The rows are then ready to compare and to feed into shop checks.
when:
  - You want to see who owns page one for a keyword.
  - You are pricing a new product against what already sells.
  - You need a list of competitor shops to study.
  - You want to tell paid ads from organic results.
not_for:
  - "You want sales counts or shop revenue: search rows cannot show them, so use the Etsy shop sales history skill instead."
  - "You want data from many stores, not just Etsy: ask for the Apify ecommerce skill, which covers more marketplaces."
  - "You have no Apify account or do not want to pay for runs: look at Etsy search pages by hand instead."
you_give:
  - A keyword, phrase or category page link
  - How many pages to pull
  - Your Apify account token
  - Filters such as free shipping or ship-to country (optional)
you_get:
  - Each listing with its rank and price
  - Star rating, review count and badges
  - A mark for ad or organic slots
  - The shop name and link behind each slot
how_to_use:
  - Open an AI that can connect to outside tools through MCP, such as Claude, and paste in this skill.
  - Add the Apify connection in your AI's settings with your own token. Never paste the token into the chat.
  - This is scraping. Etsy's terms of service may limit automated collection, so read them before you run it.
  - Give your keyword. Start with one page.
  - Say yes when your AI asks before spending credits. Each run is billed by Apify, and more pages cost more. Check the current price on the scraper's Apify page first, then run one page before you ask for many.
  - Check the table. Ask for price bands, ad counts or shops with the most page-one slots.
output_sample:
  input:
    - A keyword, market phrase or category page link
    - How many pages to pull (one page is the default)
    - Filters like free shipping or ship-to country (optional)
  prerequisites:
    - An Apify account and token
    - An AI that can connect to Apify through MCP (a link between your AI and outside tools)
    - Credits on your Apify account, since each run is billed
  output:
    - name: Listing rows
      contains: One row per listing with keyword, page, position, title, link and listing ID.
    - name: Price and rating fields
      contains: Shown price and currency, star rating and review count, and whether Etsy rounded the count.
    - name: Badge fields
      contains: Flags for best seller, popular now, star seller, Etsy's Pick and free shipping.
    - name: Ad marker
      contains: Whether each slot is sponsored, or unknown when Etsy does not say.
    - name: Shop fields
      contains: Shop name, shop ID and shop link for the seller of each listing.
