thinking: high
thinking_why: Rules depend on role, scope and risk class, so it reasons through each.
new_slug: eu-ai-act-readiness-checker
name: EU AI Act readiness checker
summary: Check your AI systems against the EU AI Act. Get a first read of your risk level, duties and gaps, plus a 90 day plan. Not legal advice.
job: check-contracts
headline: EU AI Act readiness checker
subhead: Describe your AI systems. Get a first read of your risk level, duties and gaps under the EU AI Act. Bring list of AI systems and what each is used for. Use the result to plan your next step.
explain: |
  A first-pass readiness review of your AI systems against the EU AI Act: what you run, your role for each, which duties may apply and where evidence is missing. It is triage, not a legal opinion. This copy is the author's MIT-licensed skill with only a plain name added. Its text, sources file, checker script and template are unchanged.

  It builds an inventory with one row per system, then checks the rows for gaps with a small Python script. It screens for banned uses, checks transparency rules, high-risk categories and rules for general-purpose models. It notes its sources and the date it checked them. The amending act number (Regulation (EU) 2026/1744) and the as-of date written in the skill (2026-08-09) come from the original author. They have not been checked here, so treat them as unverified. Ask your AI to confirm them on EUR-Lex, and to show the date it checked next to each one, before you rely on any date. Any date it could not confirm should be marked unverified. The output is a gap register with owners and target dates, a 30, 60 and 90 day plan, and a list of questions that need a qualified lawyer.
when:
  - You use AI in products or HR and need to know what the EU Act means for you.
  - You have no inventory of the AI tools your company runs.
  - Your board has asked how ready you are for the rules.
  - You need a plan for the next 90 days before talking to counsel.
not_for:
  - "You need a legal opinion or a compliance sign-off: ask a qualified EU lawyer, because this gives a first read only."
  - "You have questions on scope, exemptions or risk class: send them to qualified EU counsel, using the questions list this skill writes."
  - "You need to file a registration or contact a regulator: a lawyer must review and approve that step."
  - "Your AI cannot browse or run code: use only the checklist file in the skill folder to list your systems and write questions for counsel, and skip the gap register."
you_give:
  - List of AI systems and what each is used for
  - Your role for each one, such as builder or user
  - Countries where it is used
  - Existing risk, privacy and security documents (optional)
you_get:
  - AI system inventory
  - Gap register with owners and dates
  - Separate notes on banned uses, transparency and high-risk
  - 30, 60 and 90 day plan
  - Questions for counsel
how_to_use:
  - Start here, in this order: fill in the inventory CSV, run the checker on it, then ask for the gap register and the 90 day plan. Gather first the list of your AI systems, your role for each and the countries where each is used.
  - Open an AI that can browse the web and run Python code, such as Claude with code and web search turned on, or ChatGPT with code running and browsing on. These features may need a paid plan on some AI apps, so check yours. A free chat without both cannot check the law or run the inventory checker.
  - Upload the whole skill folder, not just the text. The AI needs the checklist, the sources file and the checker script. Say you want an EU AI Act readiness check.
  - Fill in the blank inventory template in the folder (assets/ai-system-inventory-template.csv) with your AI systems, your role for each, and the countries where they are used.
  - Run the checker on the filled inventory. It flags missing fields only, and does not classify anything.
  - Add your risk, privacy and security documents if you have them (optional). Then ask for the gap register and the 30, 60 and 90 day plan.
  - Check the inventory and gap register with each system owner. Fix any wrong facts.
  - Ask your AI to confirm every legal date and the amending act on EUR-Lex, and to show the date it checked next to each, before you plan around them. Treat any it could not confirm as unverified.
  - Send the questions list to a qualified EU lawyer before you act on any risk class. The gap register is a planning list, not a compliance sign-off.
output_sample:
  input:
    - A list of your AI systems and what each is used for
    - Your role for each system, such as builder or user
    - The countries where each system is used
    - Your existing risk, privacy and security documents (optional)
  prerequisites:
    - An AI that can run Python code, to check the inventory file
    - An AI that can read current EU legal sources online, to check dates and rules
  output:
    - name: Sources and assumptions
      contains: The date you ran it, the legal sources checked, your assumptions and the limits of the review.
    - name: AI system inventory
      contains: One row per system with its EU link, your role, use, risk guess, and when to review again.
    - name: Gap register
      contains: Each rule or topic, the evidence you have, the gap, its priority, an owner, a target date and a check.
    - name: Banned use screen
      contains: Any use that may be banned, with a note to pause and call a lawyer.
    - name: Transparency, high-risk and general-purpose model sections
      contains: Separate notes on what users must be told, high-risk duties and rules for general-purpose models.
    - name: 30, 60 and 90 day plan
      contains: Actions in order, with owners, what must come first, and proof that each is done.
    - name: Questions for counsel
      contains: Short fact summaries and clear questions for a qualified EU lawyer.
