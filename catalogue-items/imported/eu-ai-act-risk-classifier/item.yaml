    used: "Copied under the MIT licence. We gave it a plain name, split the single risk tier into a risk class plus the Article 50 and Article 4 duties on top, rebuilt the obligation tracker so each Article 50 duty goes to the provider or deployer the Act names, corrected the Article 43 conformity routes for biometric systems, and updated every date and Article 5 list to the AI Act as amended by the Digital Omnibus on AI (Regulation (EU) 2026/1744), checked against the Commission's AI Act Service Desk. We added Before you start and After this sections that link to other AI Blocks steps. AI Blocks: Corrected Chapter/Section labels and Article ranges, separated penalties from final provisions, and corrected Annex II/IV descriptions and the new Annex XIV entry using Commission primary sources. Kept the already-correct amended Article 113 dates; this is a scoped structure check. AI Blocks also restored Annex IV point 4 on metric appropriateness in the bundled planner and aligned its nine-point numbering and next-step references with the official Annex."
