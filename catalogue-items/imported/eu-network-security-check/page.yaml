thinking: medium
thinking_why: It sorts your type first, then lists set duties.
new_slug: eu-network-security-check
name: EU network security rules checker
summary: Check if the EU NIS2 security law covers your company. Get your category, security duties, reporting deadlines and gaps in one plain result.
job: check-contracts
headline: EU network security rules checker
subhead: Describe your company. Get whether NIS2 covers you, your security duties, reporting deadlines and gaps. Bring sector and services you offer. Use the result to plan your next step.
explain: |
  A clear answer on whether the EU NIS2 security law covers your company, and what that means in practice: your category, the ten risk measures, reporting deadlines and the gaps to close.

  It checks three things in order: whether your sector is listed, whether you pass the size threshold, and whether you count as essential or important. Getting this wrong is the most common and costly mistake. It then covers board duties, the ten required security measures, and the incident clock for early warning, notification and final report. It builds a gap table and shows fine exposure using your own figures.

  This is a readiness check. It does not replace your national register or a lawyer.

  Source and currency: this is an MIT-licensed copy of the NIS2 skill by Hemant Naik, dated September 2026 by its author. We have not checked its legal status, so check every date and country status with your national authority.
when:
  - You are unsure whether NIS2 applies to your company.
  - You need to know your deadlines if a security incident happens.
  - Your board must approve security measures and wants a checklist.
  - You want a gap table against the ten required measures.
not_for:
  - "You need legal advice or a formal audit: ask a qualified lawyer or an accredited security assessor."
  - "You are a bank, insurer or other financial firm: check the EU DORA rules instead, which this skill only compares."
  - "You need the exact national law for one country: read that country's official register and law, as local rules differ."
you_give:
  - Sector and services you offer
  - Employee count, turnover and balance sheet
  - Countries where you operate
  - Current security measures (optional)
you_get:
  - "Verdict: essential, important or out of scope"
  - Gap table by measure
  - Incident reporting timeline
  - Board duty checklist
  - Fine exposure estimate
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text from this page. No code or paid tool is needed.
  - "Describe your company: sector, services, staff, turnover, balance sheet and the EU countries you work in."
  - Add your current security measures if you have them. Say if an incident has happened and when you found out.
  - Ask for your classification first. Check that the sector and size facts are right before you go on.
  - Ask for the gap table, reporting timeline and fine estimate. Then check your national law and register before you act. The skill's notes on which countries have passed their national law, and the dates in them, are the author's and are unchecked. Confirm each with your national authority on the day you use it.
  - Hand the gap table to your board or IT lead, and bring the open items to a lawyer.
  - "Optional follow-ups you can ask for are the ten measures in more detail (Article 21), the technical rules for digital service providers (Implementing Regulation 2024/2690), and a map to ISO 27001. These come from three reference files in the skill folder: article-21-measures.md, implementing-reg-2024-2690.md and iso27001-nis2-mapping.md. If you pasted only the skill text, attach or paste those files too, or the follow-ups will not work."
output_sample:
  input:
    - Your sector and the services you offer
    - Your employee count, turnover and balance sheet total
    - The EU countries where you operate
    - Your current security measures (optional)
    - The time a security incident began (optional)
  output:
    - name: Entity classification
      contains: Three checks on sector, size and category, ending in essential, important or out of scope, with what that means for oversight.
    - name: Governance duties
      contains: A board-ready checklist of management duties under Article 20, including approving measures and training.
    - name: Gap assessment table
      contains: Each of the ten Article 21 security measures with current state, gap, priority and recommended action.
    - name: Incident reporting timeline
      contains: Deadlines for the early warning, notification and final report, worked out from the time you became aware.
    - name: Penalty exposure
      contains: Possible fines under Article 34, worked out with your own turnover figures.
    - name: Remediation roadmap
      contains: Quick wins within 30 days and bigger fixes within six months, in priority order.
