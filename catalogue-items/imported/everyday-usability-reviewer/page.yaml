thinking: medium
thinking_why: It applies a known set of principles to what you show it.
new_slug: everyday-usability-reviewer
name: Everyday usability reviewer
summary: Find what confuses people on your screen or product, and get fixes. This usability review scores it out of 10 using Don Norman's principles.
job: design-work
headline: Everyday usability reviewer
subhead: A list of exactly what confuses people in your product or screen, with fixes. It tells you why users press the wrong thing, miss a feature or cannot tell whether an action worked.
explain: |
  A list of exactly what confuses people in your product or screen, with fixes. It tells you why users press the wrong thing, miss a feature or cannot tell whether an action worked.

  It uses Don Norman's ideas. It checks the two gaps every user crosses: working out how to act, and understanding what happened afterward. Then it tests five things: can people find what to do, can they see the result, can they recover from errors, do controls match what they affect, and do limits block wrong moves. Each passed check earns 2 points, for a score out of 10. Fixes use clear cues, natural layouts, constraints and visible feedback.
when:
  - Users keep asking how to do something your screen already allows.
  - People click the wrong button or give up halfway through a form.
  - You are reviewing a design before it goes to developers.
  - A physical product or device gets blamed for user mistakes.
not_for:
  - "You want a review of visual style or brand look: ask a designer, since this checks how easy it is to use."
  - "You need proof of what real users do: use the Usability test runner, or run a short test with five real users instead. The score here is your AI's judgement, not a measured result."
you_give:
  - Description or screenshot of the product or screen
  - The task users try to do
  - Complaints or support questions (optional)
you_get:
  - Score out of 10
  - List of confusing points with causes
  - Fixes for cues, limits and feedback
  - Error recovery suggestions
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text into a new chat. It needs no code, files or paid tools.
  - "Gather first: a description or screenshot of your screen or product, the one task users try to do, and any support complaints. The review comes back as a score, the failing checks, up to five confusing points and fixes, about one page."
  - Describe your screen or product in a few lines, or attach a screenshot.
  - Say the task users are trying to do. Add complaints or support questions if you have them.
  - Ask your AI to list the task, walk each step through the seven stages of action, and mark each of the five checks pass or fail.
  - Read the score and the failing checks first. Then pick the fixes that match your top complaints. Turn each failing check into one fix, make the change, and run the review again to see if the score rises. This is an MIT-licensed skill imported from Wondel.ai, adapted from wondelai/skills.
output_sample:
  input:
    - A description or screenshot of your product or screen
    - The task users try to do
    - Complaints or support questions (optional)
  output:
    - name: Score
      contains: Comes first. A score out of 10, with 2 points for each of the five checks your design passes. It is your AI's judgement, so check it against real users.
    - name: Failing checks
      contains: "The checks that lost points: finding what to do, seeing results, fixing errors, matching controls, and limits."
    - name: Confusing points
      contains: Up to five spots where users get lost, with the reason each one confuses them.
    - name: Fixes
      contains: Changes grouped under cues, limits and feedback, so users know what to do and what happened.
    - name: Error recovery
      contains: Ways to stop common mistakes and help users undo them.
