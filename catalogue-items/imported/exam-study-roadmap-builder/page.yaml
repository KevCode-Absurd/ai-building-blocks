thinking: medium
thinking_why: It ranks topics by weight and likelihood.
new_slug: exam-study-roadmap-builder
name: Exam study roadmap builder
summary: Turn your syllabus, past papers or notes into an exam study roadmap. You get topics ranked by marks and how often they appear.
job: think-and-decide
headline: Exam study roadmap builder
subhead: Give it your syllabus, past papers or notes. Get a ranked roadmap of what to study first for the best score. Bring syllabus, past papers or notes. Use the result to plan your next step.
explain: |
  A ranked plan of what to study first for the most marks, built from your own syllabus, past papers or notes.

  It sorts topics from easy to hard: definitions first, then explanations and calculations, then proofs and design questions last. Each likely question gets a probability score from how often it appears, how recently, how heavy its unit is and how many marks it carries. Your time sets the mode, from a 1 to 2 hour emergency list to a multi-day schedule with mock papers. A guardrail keeps it inside your syllabus and flags anything outside it. Scores are estimates and cannot promise what appears on the exam.
when:
  - Your exam is close and you do not know where to start.
  - You have several years of past papers and want to see what repeats.
  - You need a plan for a set number of hours, from two to many days.
  - You want flashcards or practice for one question type, such as MCQs or numericals.
not_for:
  - "You have essays or coursework with no exam date: use a plain outline and a deadline list instead."
  - "You have a question about your grade or how marks are given: ask your course tutor or read the official marking guide."
  - "You want a promise of what will be on the exam: no tool can give that, so treat the scores as guesses."
you_give:
  - Syllabus, past papers or notes
  - Subject and course code
  - Hours you have before the exam
  - Question types you want to focus on (optional)
you_get:
  - Ranked study roadmap
  - Probability score per question
  - Plan sized to your time
  - Flashcards or practice questions
  - Flags for out-of-syllabus items
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. This skill needs no code, web access or paid tool.
  - Paste your syllabus, past papers or notes. If your AI can take files, upload them instead.
  - Say your subject, your course code and how many hours you have left.
  - Say if you want one question type only, such as MCQs, flashcards or a mock paper.
  - Check that the course code is right and that every topic matches your syllabus. The topic chances and readiness percentages are estimates from the papers you gave it, not a forecast of your exam or your mark.
  - Start with the easy topics at the top of the roadmap and work down.
output_sample:
  input:
    - Your syllabus, past papers or notes
    - Your subject and course code
    - The hours you have before the exam
    - Question types to focus on, such as MCQs or numericals (optional)
  output:
    - name: Full roadmap
      contains: Topics ranked by marks, in order from easy to medium to hard, sized to the hours you have.
    - name: Probability score
      contains: A score for each likely question, based on how often and how recently it appears, unit weight and marks.
    - name: Theory, numerical, MCQ, coding or lab notes
      contains: Short notes for the question type you pick, each tied to a syllabus unit.
    - name: Flashcards
      contains: Quick cards for the topics you need to memorise.
    - name: Predicted exam paper
      contains: A mock paper built from the likely questions, for timed practice.
    - name: Exam readiness dashboard
      contains: A self-check of how ready you are by topic, as a rough guide.
    - name: Out-of-syllabus flags
      contains: A list of anything in your files that falls outside the syllabus.
