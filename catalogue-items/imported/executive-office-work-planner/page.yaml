thinking: high
thinking_why: It follows a set method with a few checks.
new_slug: executive-office-work-planner
name: Executive office work planner
summary: Share leadership work and decision limits. Get clear priorities, briefs, handover notes, and questions for the right owner.
job: organise-work
headline: Executive office work planner
subhead: Share the leadership task, decision limits, and relevant records. It sorts the facts, lays out choices, and checks who owns the next call. You get a brief, priority plan, or handover note that helps the leader decide.
you_give:
  - The accountable leader, task, authority limits, relevant records, and any confirmed commitments.
you_get:
  - A task-matched briefing, information route, calendar review, or decision and handover record.
how_it_works:
  - title: Name the accountable owner
    text: Confirm who decides and what work has already been delegated.
  - title: Sort evidence and routes
    text: Keep facts, reported concerns, assumptions, and unknowns separate. Send sensitive matters through protected channels.
  - title: Prepare options and records
    text: Explain trade-offs and keep only decision-relevant records. A recommendation is not an approved decision.
  - title: Check real commitments
    text: Create tasks only for accepted actions with an owner and grounded due date. Review any external changes before making them.
works_best_with:
  tools:
    - name: A chat AI that can read the bundled reference files
      why: Use the supplied references and templates for the chosen task. Scripts are optional unless that task specifically needs them.
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on this page.
