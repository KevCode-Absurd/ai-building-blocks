thinking: high
thinking_why: It models default risk with many judgment calls.
new_slug: expected-credit-loss-calculator
name: Expected credit loss calculator
summary: Estimate expected credit losses with a simplified IFRS 9 or CECL method from your loan list. Get the allowance, stages and journal entry to review.
job: money-and-investing
headline: Expected credit loss calculator
subhead: Give it loan data. Get a simplified expected credit loss estimate under IFRS 9 or CECL, for an accountant to review. Have your loan or receivable list ready, with a balance and days past due for each line.
explain: |
  A simplified estimate of expected credit losses for your loans or receivables, using the IFRS 9 or CECL approach, with a draft number for the loss allowance. It does not fully meet either standard, so a qualified accountant must review it before you use any figure.

  It groups assets that behave alike, then puts each in a stage: performing, higher risk since the start, or credit-impaired. It estimates three inputs: probability of default, loss if default happens, and the amount exposed. These are multiplied and discounted to today's value. Base, upside and downside economic scenarios are weighted by their likelihood. For trade receivables it offers a simpler approach. It ends with the journal entry that books the allowance.
when:
  - You are closing the books and need a loan loss provision.
  - Your receivables are aging and you must estimate what you will not collect.
  - You are moving from incurred loss to expected loss reporting.
  - An auditor wants to see how you built your allowance.
not_for:
  - "You need a legal write-off or a tax reserve: ask your accountant, as this gives an accounting estimate only."
  - "You want to post the journal entry without review: have a qualified accountant check the numbers first."
  - "You only want a quick look at which credit risks exist: list them with a person who knows your lenders or customers first."
you_give:
  - "Loan or receivable list, one row per item: balance, days past due, asset type, start date and a default flag or rating"
  - Past losses or default history, if you have it
  - Asset type and accounting standard
  - Economic scenarios and weights (optional)
you_get:
  - Expected loss per group
  - Stage assignments
  - Scenario-weighted total
  - Journal entry for the allowance
  - Notes on method for audit
how_to_use:
  - Use an AI that can run code and read files, such as Claude Code. A chat window can do a small case by hand, but cannot run the calculation script.
  - Download the skill folder, with its scripts folder, and open it in your AI.
  - Save your list as a CSV file with one row per loan or receivable. Include balance, days past due, asset type, start date and a default flag or rating.
  - Tell your AI the standard (IFRS 9 or CECL), the reporting date, and your base, upside and downside scenarios with their weights.
  - Ask it to follow the skill and use the functions in scripts/calculate.py for every figure. Do not let it work out the sums in text. The script does not read files, so your AI reads the CSV and passes the numbers to each function.
  - Check the allowance, the stage for each group and the journal entry. Send them to your accountant or auditor before you book anything.
output_sample:
  input:
    - Your loan or receivable list with balances
    - Your default history or credit ratings
    - The asset type and the accounting standard (IFRS 9 or CECL)
    - Your economic scenarios and their weights (optional)
  prerequisites:
    - An AI that can run code and read your files, to use the calculation script
  output:
    - name: The Portfolio
      contains: Total amount at risk and a split of your assets across stage 1, 2 and 3.
    - name: The Provision
      contains: The total loss allowance and the coverage ratio, which is the allowance divided by the amount at risk.
    - name: Sensitivity & Scenarios
      contains: How the loss changes if the chance of the downside economic scenario goes up by 10%.
    - name: Journal entry
      contains: The entry that books the loss allowance.
