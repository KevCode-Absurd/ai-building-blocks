thinking: medium
thinking_why: It compares tools against your needs.
new_slug: experiment-tool-picker
name: Experiment tool picker
summary: Pick the right experiment tool for your team and traffic. Get a firm choice, a plan to switch tools, and advice on when two tools are fine.
job: plan-ad-tests
headline: Experiment tool picker
subhead: A firm choice of testing tool for your team, a migration plan if you already picked the wrong one, and a view on when running two tools is fine.
explain: |
  A firm choice of testing tool for your team, a migration plan if you already picked the wrong one, and a view on when running two tools is fine.

  You describe your team, traffic and data setup. The skill works through seven questions: where the data lives, how sound the statistics are, AI assistant support, feature flag fit, analytics depth, access control and cost shape. It compares Statsig, PostHog, GrowthBook, Optimizely, Amplitude, Eppo and Kameleoon, and states strengths, gotchas and the ideal customer for each. Where tools overlap, it advises on consolidating or coordinating them.
when:
  - You are picking a testing tool for the first time.
  - Your current tool is too costly or too limited and you consider switching.
  - Two teams run different tools and you wonder if you should merge.
  - You need rules on who can launch tests and read data.
not_for:
  - "You need to design a test or set sample sizes: use the experiment-design skill, not this one."
  - "You want to read results from a test that has finished: use the experimentation-analytics skill."
  - "You only need to run feature flags day to day: use the feature-flagging skill, or ask your engineers."
you_give:
  - Team size and who runs tests
  - Monthly traffic or event volume
  - Where your data lives, such as a warehouse
  - Tool you use now (optional)
  - Budget range (optional)
you_get:
  - Recommended tool with reasons
  - Strengths and gotchas per tool
  - Migration plan
  - Advice on using multiple tools
  - Governance setup
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the full skill text. No code or paid tool is needed.
  - "Write a short brief: team size, who runs tests, monthly traffic, and where your data lives."
  - Add your current tool and budget if you have them. Say so if you do not.
  - Ask your AI to pick one tool and explain why.
  - Check that the pick matches your data setup. Then ask for a migration plan or a governance setup if you need one.
  - Check current prices on each vendor's own site before you decide.
output_sample:
  input:
    - Your team size and who runs tests
    - Your monthly traffic or event volume
    - Where your data lives, such as a data warehouse
    - The tool you use now (optional)
    - Your budget range (optional)
  output:
    - name: Recommended tool
      contains: One firm pick for your team, with the reasons it fits and the gotchas to watch.
    - name: The 7 considerations
      contains: Your answers on data location, statistics, AI assistant support, feature flags, analytics, access control and cost.
    - name: Platform comparison
      contains: Strengths, gotchas and ideal customer for Statsig, PostHog, GrowthBook, Optimizely, Amplitude, Eppo and Kameleoon.
    - name: Migration patterns
      contains: Steps to move off your current tool, if you already chose one that does not fit.
    - name: Multi-platform view
      contains: Whether running two tools is justified for you, and how to keep them in step.
    - name: Governance and team fit
      contains: Who can launch tests, who can read data, and how changes move between environments.
    - name: Cost reality
      contains: How each pricing shape treats your usage, and what to say to finance.
