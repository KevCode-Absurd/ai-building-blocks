thinking: medium
thinking_why: It must respond to what you actually understood.
new_slug: explain-it-first-tutor
name: Explain-it-first tutor
summary: Explain an idea in your own words first. Your AI then checks it and builds on what you said. A study tutor for real understanding, not stock lessons.
job: teach-and-train
headline: Explain-it-first tutor
subhead: A study session where you speak first. You explain a concept in your own words, and the AI works from what you actually said, instead of reading you a stock lesson.
explain: |
  A study session where you speak first. You explain a concept in your own words, and the AI works from what you actually said, instead of reading you a stock lesson.

  You name the topic and your level. The AI asks you to explain it before it says anything. Then it checks your answer, points out what is right, and finds gaps or mixed-up ideas. Next it builds on your version with questions that make you think further. It rests on research showing that explaining an idea to yourself improves understanding more than re-reading. It works well for revision and for homework you want to understand, not just finish.
when:
  - You reread notes but still cannot say what a topic means.
  - You want to test whether you really understand before an exam.
  - You get lessons from AI that skip what you already know.
  - You are stuck on a problem and cannot say where the confusion starts.
not_for:
  - "You need a fast answer or want to finish homework quickly: ask your AI for a direct explanation instead."
  - "You want to practise recalling facts from memory: use the Retrieve-first gate, or make flash cards with a friend."
  - "You are stuck on an error and cannot say what went wrong: ask a teacher or tutor to walk through it with you."
you_give:
  - Topic or problem
  - Course, level or goal for the session
  - Your own explanation, typed when asked
you_get:
  - Feedback on your own explanation
  - List of gaps and mix-ups
  - Follow-up questions
  - Teaching that builds on your words
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Copy the System Prompt section from the skill and paste it into a new chat as your first message.
  - Type your topic or problem, then your course, level or goal.
  - Wait for the AI to ask you to explain. Write it in your own words, even if you are unsure.
  - Read the feedback on your gaps. Answer the follow-up questions one at a time.
  - When you finish, try the Transfer bridge or the Teach-back evaluator to test what you learned.
output_sample:
  input:
    - The topic or problem you are working on
    - Your course, level or goal for the session
    - Your own explanation of the topic, typed when your AI asks for it
    - Your age or stage (optional)
  output:
    - name: Your explanation prompt
      contains: A request for you to explain the topic in your own words before the AI says anything.
    - name: Feedback on your explanation
      contains: What you got right, and where your explanation has gaps or mixed-up ideas.
    - name: Follow-up questions
      contains: Questions that push you to think further, built from what you actually said.
    - name: Teaching that builds on your words
      contains: A short explanation that starts from your version and fills in what is missing.
    - name: Session reflection
      contains: A short look back at what you now understand and what is still shaky.
