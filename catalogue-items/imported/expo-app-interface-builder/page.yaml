thinking: medium
thinking_why: It follows Expo guides for each part of the app.
new_slug: expo-app-interface-builder
name: Expo app interface builder
summary: Describe your mobile app screens. Get Expo Router screen files with native tabs, styling, motion and a color theme you can run in Expo Go.
job: build-software
headline: Expo app interface builder
subhead: Describe the screens and how people move between them. It writes the Expo Router files, sets up native tabs, adds styling and motion, and lists the packages to install. The result looks like a real phone app, not a web page.
explain: |
  Expo is a toolkit for building iPhone and Android apps with React Native. This Expo app interface builder writes the screens for it. You describe the screens, and your AI turns them into files that follow Expo's own guidance.

  It sets up the folder of routes (each file is one screen), the layout files, and a bottom tab bar that uses the phone's own tabs. It adds smooth entry and exit motion, native switches and pickers, search bars and sheets that slide up. It keeps colors in one theme file that follows light and dark mode.

  What sets it apart is the rule set. It follows the guide's rules, such as routes only in the app folder, kebab-case file names, no legacy packages and a safe-area fix on every scroll view.

  Many of the polish features, such as SF Symbols and liquid glass, work on iPhone first. Test on a real phone.

  Licence: one licence applies to this copy, CC BY 4.0, as the LICENSE-CONTENT file says. That file governs. The skill file's own header (Expo) says MIT for the original. Both allow reuse with credit, so keep the credit to Expo and sickn33.
when:
  - You are starting an Expo app and need the screens and navigation set up.
  - Your tab bar looks like a web page, not a phone app.
  - You want smooth entry and exit motion on a list or card.
  - You need a search bar, a sheet that slides up or a native date picker.
not_for:
  - Your app is web only or not built with Expo. Use the React app structure planner for a web app.
  - You need server routes that keep secret keys safe. Use the Expo API route builder.
  - You need to move an existing app to a newer Expo version. Use the Expo upgrade helper.
  - You need fetching, caching and offline data code. Use the Mobile data fetching coder.
you_give:
  - A description of the screens and how people move between them
  - Your Expo project, new or existing
  - The look you want, such as colors or style (optional)
  - Data the app must keep on the phone, such as settings (optional)
you_get:
  - Expo Router screen files in an app folder
  - Layout files that set up stacks and native tabs
  - A color theme file that works in light and dark mode
  - Motion, native controls, search and sheets where you asked for them
  - The list of packages to install
how_to_use:
  - "Know this before you start. The code examples call handlers that are not written for you: handleSharePress, handleBlockPress, handleCopyPress and handleDeletePress in the skill, and handlePress, handleAdd and handleSettings in the visual effects note. Write each one, or replace it with a real action, before the screens run."
  - Before any code is written, ask your AI to check three imports against your Expo SDK version in the current Expo docs: native tabs (expo-router/unstable-native-tabs), Color from expo-router, and expo-router/react-navigation.
  - Open Claude Code, or any AI that can read and write your project files. Paste in this skill, or add the whole folder, so it can open the notes for each area. Tell it your Expo SDK version and Node version first, since the code depends on them.
  - Gather your screens. Describe each one in a line or two and say how people move between them. Say whether you have a project already.
  - Ask your AI to create the route files, then the layouts for stacks and tabs.
  - Ask it to add the theme file and install the packages it lists.
  - Run the app with npx expo start and the Expo Go app on your phone. You only need a custom build for features Expo Go lacks.
  - Check each screen on a real phone. Look at the tab bar, the top bar, the scroll behavior and dark mode. The code examples in the skill are patterns. Some call handlers (such as handleCopyPress or handleDeletePress) that you must write yourself before they work. Some imports, such as native tabs and Color from expo-router, depend on your Expo SDK, so check them against the current Expo docs.
  - Ask for fixes screen by screen. Then connect your real data with the Mobile data fetching coder.
how_it_works:
  - title: Plans the routes
    text: Lays out the app folder, with one file per screen and groups for tabs, following Expo's route rules.
  - title: Sets up navigation
    text: Builds stack layouts and native tabs, with modals and sheets where the flow needs them.
  - title: Builds the screens
    text: Writes each screen with a scroll view that respects the safe area, native controls and a proper title.
  - title: Styles with a theme
    text: Keeps colors in one theme file that follows light and dark mode, and uses the guide's rules for spacing and shadows.
  - title: Adds motion
    text: Adds entering and exiting animations with Reanimated, plus search, gradients and icons when you ask.
  - title: Checks the rules
    text: Checks the files against the library and code style rules and removes old route files after a move.
output_shape: |
  FILE TREE
  app/_layout.tsx | app/(<group>)/_layout.tsx | app/(<group>)/<screen>.tsx
  theme/colors.ts
  PACKAGES TO INSTALL
  <package list, with the install command>
  SCREENS
  <file name>: <what it shows and what it links to>
  TRY IT
  npx expo start, then open the app in Expo Go
  OPEN QUESTIONS
  <anything you did not say>
output_sample:
  input:
    - A description of each screen and how people move between them
    - Your Expo project, new or existing
    - The look you want (optional)
    - Data to keep on the phone (optional)
  prerequisites:
    - An AI that can read and write your project files
    - Node installed, and the Expo Go app on your phone to try the result
  output:
    - name: app/_layout.tsx
      contains: The root layout, including the native tab bar and the light and dark theme.
    - name: app group layout files
      contains: A stack layout inside each tab, with header options and screen titles.
    - name: Screen files
      contains: One file for each screen you described, with a scroll view and native controls.
    - name: theme/colors.ts
      contains: One place for your colors, set to follow light and dark mode.
    - name: Package list
      contains: The packages to install and the command to run.
    - name: Try-it steps
      contains: How to start the app and check it in Expo Go.
works_best_with:
  tools:
    - name: Claude Code
      why: It can write the files into your project and run the start command.
    - name: Expo Go
      why: It runs your app on your phone while you build, with no custom build step.
  inputs:
    - A sketch or a list of your screens
    - Your brand colors
    - The iPhone and Android versions you must support
terms:
  - term: Expo Router
    meaning: A way to build app navigation from files. Each file in the app folder is a screen.
  - term: Native tabs
    meaning: A tab bar drawn by the phone itself, so it looks and feels like other apps on that phone.
  - term: Expo Go
    meaning: A free app that runs your Expo project on your phone while you build it.
  - term: Safe area
    meaning: The part of the screen not covered by the notch, clock or home bar.
