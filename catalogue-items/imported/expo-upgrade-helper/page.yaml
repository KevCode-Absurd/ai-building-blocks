thinking: medium
thinking_why: It follows upgrade notes and fixes errors.
new_slug: expo-upgrade-helper
name: Expo upgrade helper
summary: Upgrade your Expo app to a newer SDK and fix broken packages. Give it your current and target Expo version. You get ordered steps and code fixes.
job: build-software
headline: Expo upgrade helper
subhead: Tell it the Expo version you are on and the one you want. It walks the upgrade step by step, stops before anything that deletes files, and fixes the packages that break.
explain: |
  Your Expo app moved to a newer SDK, with broken packages fixed and old code patterns swapped out, so it builds and runs again.

  Warning before you start: two steps delete files. One removes node_modules and .expo. The other, prebuild --clean, deletes and rebuilds your ios/ and android/ folders, so any hand edits there are lost. Save your project in git and back up ios/, android/, patches/ and app.json first. Your AI must get your clear yes before either step.

  The skill follows a step-by-step upgrade, then deals with version-specific changes using its notes. These cover React 19 changes, the New Architecture, the React Compiler, native tabs, moving from the old audio and video package to the new ones, and moving navigation imports to Expo Router. It can also install preview releases when you want to try a beta. Dependency mismatches are fixed with Expo's own install tool.

  Licence: one licence applies to this copy, CC BY 4.0, as the LICENSE-CONTENT file says. That file governs. The skill file's own header (Expo) says MIT for the original. Both allow reuse with credit, so keep the credit to Expo and sickn33.
when:
  - A new Expo release is out and your app is several versions behind.
  - Packages fail to install after you bump the version.
  - You still use the old audio or video package and need to switch.
  - You want to test a beta before it goes stable.
not_for:
  - "Your app is not built with Expo: use the upgrade guide for your own framework, or ask a developer."
  - "You only want to add a new feature to your app: ask your AI directly, or follow the docs for that one package."
  - "You cannot back up your project first: stop and save a copy before you run anything, or ask a developer to do the upgrade."
you_give:
  - Current Expo version
  - Target version
  - Package list or package file
  - Errors from a failed upgrade (optional)
you_get:
  - Ordered upgrade steps
  - Fixes for broken dependencies
  - Code changes for new React and navigation patterns
  - Migration of audio and video code
how_to_use:
  - Check that the target Expo version is a final release on expo.dev/changelog. If it is a preview or beta, stop unless you want to test a preview on a branch.
  - Save your project in git first. Back up ios/, android/, patches/ and app.json. Some steps delete files and folders.
  - Open your AI in a tool that can run commands and edit your project. Paste this skill into it.
  - Tell it your current Expo version and the version you want. Add your package.json and any error messages.
  - "Let it run the upgrade steps one at a time. Check the result of each step before you move on. Two steps delete files: rm -rf node_modules .expo, and npx expo prebuild --clean, which rebuilds the ios/ and android/ folders. Your AI must stop and get your clear yes before it runs either one."
  - Run your app and test camera, audio, video and navigation. Fix anything the checklist flags.
  - "What next: run your app's test suite, build each platform once, and check on a real device before you ship. Mobile app release shipper can take it from there."
output_shape: |
  One report, with these parts in this order:
  1. UPGRADE STEPS  the ordered commands, each marked if it deletes files
  2. DEPENDENCY FIXES  package versions that match the target, excluded packages and old patches to review
  3. BREAKING CHANGES CHECKLIST  removed features, moved imports and native changes to check
  4. PREBUILD AND CACHE STEPS  only if the project has ios/ and android/ folders
  5. HOUSEKEEPING EDITS  settings and config files to delete or trim
  6. CODE MIGRATIONS  updated code for React 19, the New Architecture, Expo Router and the move from expo-av
output_sample:
  input:
    - Your current Expo version
    - The Expo version you want to reach
    - Your package list (package.json)
    - Any errors from a failed upgrade (optional)
  prerequisites:
    - An AI that can run commands and edit your project files
    - Your project saved in git, with a backup of ios/, android/, patches/ and app.json
  output:
    - name: Upgrade steps
      contains: The order to install the new Expo version, fix packages, run the health check and clear caches.
    - name: Dependency fixes
      contains: Package versions that match your new Expo version, plus a review of excluded packages and old patches.
    - name: Breaking changes checklist
      contains: Removed features, moved imports and native changes to check in your app after the upgrade.
    - name: Prebuild and cache steps
      contains: Commands to rebuild native folders and clear caches, only if your project has ios/ and android/ folders.
    - name: Housekeeping edits
      contains: Settings and config files you can delete or trim, such as sdkVersion, babel and metro defaults.
    - name: Code migrations
      contains: Updated code for React 19, the New Architecture, Expo Router, and the move from expo-av to expo-audio and expo-video.
