thinking: medium
thinking_why: It follows a set list of places where secrets leak.
new_slug: exposed-secrets-finder
name: Exposed secrets finder
summary: Find exposed API keys and private files on your own live website with this secrets finder. You get a report of what visitors can read, with fixes.
job: secure-code
headline: Exposed secrets finder
subhead: A report of keys, tokens and private files that anyone can read on your live website, with a fix for each. It finds the leaks before a stranger does.
explain: |
  A report of keys, tokens and private files that anyone can read on your live website, with a fix for each. It finds the leaks before a stranger does.

  The check is read-only and only fetches what the server already gives every visitor. It scans your JavaScript files for hardcoded keys and tokens, looks in page markup, meta tags and comments, and tests for reachable source, config and deploy files that were never meant to be public. Findings are tied to known security categories for hardcoded credentials and sensitive data. Use it only on sites you own or have permission to assess.
when:
  - You are about to ship and want to check nothing sensitive is in the browser code.
  - A developer might have pasted an API key into front-end code.
  - You want to know if config or source files are reachable by URL.
  - A review asks for proof that secrets are not exposed.
not_for:
  - "You do not own the site or lack written permission to test it: ask the owner for permission first, or do not scan it."
  - "You want to test for hacks like injection or broken logins: hire a security tester or use a full web security testing guide."
  - "You want to scan your code files or git history for keys: use a secret scanner on your code repository instead."
you_give:
  - Address of a site you own or may test
  - Written permission if it is a client site
  - Known key formats to look for (optional)
you_get:
  - List of exposed secrets and files
  - Where each one was found
  - Risk level per finding
  - Fix steps, including rotating keys
how_to_use:
  - Open an AI that can run commands and has curl. A plain chat cannot do this. Paste in this skill.
  - Give it the web address of a site you own, or have written permission to test.
  - Tell it to run the checks. It only reads pages that any visitor can open.
  - Read the report. Fix the Critical items first.
  - Replace every exposed key with a new one. Removing a leaked key is not enough.
output_sample:
  input:
    - The web address of a site you own or may test
    - Written permission, if it is a client site
    - Key formats you want checked (optional)
  prerequisites:
    - An AI that can run commands, with curl available
    - The exact hostnames you are allowed to test
  output:
    - name: Header findings
      contains: Missing or weak security headers and open cross-site access settings, with the risk of each.
    - name: HTML findings
      contains: Keys, tokens and notes found in page text, meta tags, hidden fields and comments.
    - name: JavaScript findings
      contains: Hardcoded keys and passwords found in script files and source maps.
    - name: Exposed files
      contains: Config, source and deploy files that visitors can open by address, such as .env files.
    - name: Severity ratings
      contains: Each finding rated Critical, High, Medium or Low by how much harm it could do.
    - name: Fix list
      contains: Steps in order of priority, including which secrets must be replaced, not just removed.
