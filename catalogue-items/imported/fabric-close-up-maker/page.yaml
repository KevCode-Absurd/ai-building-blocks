thinking: low
thinking_why: It follows a set prompt recipe for each close-up.
new_slug: fabric-close-up-maker
name: Fabric close-up maker
summary: Give it a clothing photo. Get close-ups of fabric, stitching and weave
  for the product page. Your image model draws them.
job: product-photos
headline: Fabric close-up maker
subhead: Close-up fabric shots for a clothing product page, made from the photo
  you already have. Buyers see the weave, stitching and collar detail that
  proves quality, without a macro lens or a photo studio.
explain: |
  Close-up fabric shots for a clothing product page, made from the photo you already have. Buyers see the weave, stitching and collar detail that proves quality, without a macro lens or a photo studio.

  You give one garment image and pick the area: collar, cuff, hem, buttons, zip, pocket, embroidery, print or fabric weave. The skill writes a prompt that zooms into that part and keeps the colors and thread direction true to the garment, then sends it to an image model. You can add a reference image to copy an angle and lighting. It uses the dlazy command line tool, which needs an account and credits.
when:
  - Your product page has no detail images and you suspect that costs sales.
  - You want 2 or 3 close-ups per garment without extra photography.
  - You want your detail shots to match the angle of a reference image.
  - You need weave or stitching visible for a premium product.
you_give:
  - A clothing photo
  - The area to zoom into
  - Reference detail image (optional)
  - dlazy tool and credits
you_get:
  - Macro close-up image of the chosen area
  - Prompt used, for repeat runs
  - Several area options per garment
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and use your own image model key
    (OpenAI, Gemini, fal or Replicate).
