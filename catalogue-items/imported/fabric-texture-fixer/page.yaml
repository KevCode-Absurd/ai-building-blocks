thinking: low
thinking_why: It follows a set edit recipe using your sharp photo as the guide.
new_slug: fabric-texture-fixer
name: Fabric texture fixer
summary: Fix blurry fabric in a clothing photo. Give it your photo and a sharp product shot. Get rebuilt texture, not proof of quality.
job: product-photos
headline: Fabric texture fixer
subhead: A blurry garment photo repaired so the fabric looks real and sharp, while the model, pose and layout stay untouched. Knits that turned to mush when zoomed in get their texture back.
explain: |
  A blurry garment photo repaired so the fabric looks real and sharp, while the model, pose and layout stay untouched. Knits that turned to mush when zoomed in get their texture back.

  You give two images: the photo to fix, and a clear product photo of the same item that shows the true fabric. The skill writes a prompt telling the image model to rebuild the surface from the clear photo: cable ridges, jacquard relief, fibre fuzz and the dark folds. Faces, hair and background are left alone. It is a finishing pass for AI-made or low quality fashion images, and it uses the dlazy command line tool with credits. The image model can invent texture the real garment does not have, so do not use the result as proof of fabric quality on a product page.
when:
  - Your AI-generated clothing photo looks fine small and mushy when zoomed.
  - A supplier image shows the garment but the fabric is blurred.
  - You have a sharp flat-lay and want the on-model shot to match.
  - You need a finishing pass before a product page goes live.
not_for:
  - "Your garment has the wrong shape or a broken structure: make the photo again, because this only fixes the fabric surface."
  - "You want to swap one fabric for another: use the fabric swap sample maker."
  - "Your photo is very low resolution: take a new photo or ask your supplier for a better one."
you_give:
  - The blurry garment photo
  - A clear product photo of the same item
  - Your dlazy account with credits (each run costs credits; the sample run used 60 for one 1024 by 1536 image)
you_get:
  - Enhanced image with clear fabric texture
  - Same model, pose and background
  - Prompt used for repeat runs
how_to_use:
  - Check both photos show the same item. Each file should be over 400 by 400 pixels and between 20KB and 15MB. The skill file is written in Chinese. Your AI can read it and answer in English.
  - Use an AI that can run code. You also need the dlazy tool set up with credits. Chat alone will only write the prompt.
  - Give your AI both photos, with the blurry one first, and the garment type. Results save to one default path, docs/material-enhancement/output-<sku>-enhanced.jpg, apart from your original.
  - Ask it to follow this skill. It writes the prompt and runs the image model. Ask for two variants with --batch 2, because the default is one image.
  - Compare each result with your sharp photo. Check the face, background and colour did not change.
  - The image model can invent texture the real garment does not have. Before you publish, check the result against the real item. Do not use it to prove fabric quality, and do not show detail your customers will not receive. Say the image is AI-made where your store or the law requires it.
  - If the result is only sharper, ask your AI to add the fix-up line and run it again.
  - Then use the fabric swap sample maker if you want to try a different fabric, or the product photo retoucher for light and wrinkles.
output_sample:
  input:
    - Your blurry photo of the garment on a model
    - A sharp product photo of the same item, flat or close up
    - The type of garment, such as a chunky knit sweater
  prerequisites:
    - An AI that can run code and the dlazy command line tool
    - Credits for the dlazy image model
  output:
    - name: Texture enhancement prompt
      contains: The written instructions that tell the image model which fabric details to rebuild and what to leave alone.
    - name: Enhanced image
      contains: One JPG at the size of your photo, with clear fabric texture and the same model, pose and background.
    - name: Second variant
      contains: A second version from the batch, so you can pick the more believable fabric.
    - name: Saved file
      contains: The result is saved as output-<sku>-enhanced.jpg in docs/material-enhancement, apart from your original, so you can compare the two.
    - name: Fix-up lines
      contains: Extra sentences to add to the prompt if the result is only sharper, changed colour, or altered the face.
