new_slug: facebook-ad-library-collector
name: Facebook ad library collector
summary: Give it a brand or keyword. Get its live Facebook ads from the public
  Ad Library. Collects data from websites.
job: study-competitors
headline: Facebook ad library collector
subhead: Give it a brand or keyword. Get its live Facebook ads from the public
  Ad Library. Collects data from websites. Bring a brand name, Page link or
  keyword. Use the result to plan your next step.
explain: |
  A spreadsheet of every ad a competitor is running on Facebook and Instagram, with the creative links and start dates, so you can see which ads have stayed live the longest. Long-running ads usually mean they make money.

  You give it a Page link or a keyword. For a Page, it uses the page URL. For a keyword, it builds a public Ad Library search link with your country, words and active status. It then runs an Apify scraper and returns one row per ad. For political ads it also pulls the reach and spend figures that are disclosed. It needs an Apify account and token, and the scraper charges per result.
when:
  - You want to see what ads a rival brand is running right now.
  - You are testing a product idea and want to know who already advertises for
    the same keyword.
  - You need a list of long-running ads to copy angles from.
  - You want video and image links from a competitor to save for a swipe file.
you_give:
  - A brand name, Page link or keyword
  - Country and active or inactive status
  - Apify account token
  - A cap on how many ads to pull (optional)
you_get:
  - One row per ad
  - Creative and video links
  - Start dates and run length
  - Disclosed reach and spend for political ads
  - A sorted export you can open in a spreadsheet
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and use your Apify token.
