thinking_why: It fetches public ads and lists them.
new_slug: facebook-ad-library-collector
name: Facebook ad library collector
summary: Find the live ads any brand runs on Facebook and Instagram. Give it a Page link or keyword and get one row per ad from the Ad Library.
job: study-competitors
headline: Facebook ad library collector
subhead: Give it a brand or keyword. Get its live Facebook ads from the public Ad Library. It runs a paid third-party Apify scraper on Meta's public Ad Library, which may not fit Meta's terms, so check them first. Use the rows for a swipe file or a teardown.
explain: |
  A spreadsheet of every ad a competitor is running on Facebook and Instagram, with the creative links and start dates, so you can see which ads have stayed live the longest. Long-running ads may be working, but run length is a guess, not proof.

  You give it a Page link or a keyword. For a Page, it uses the page URL. For a keyword, it builds a public Ad Library search link with your country, words and active status. It then runs an Apify scraper and returns one row per ad. For political ads it also pulls the reach and spend figures that are disclosed. It needs an Apify account and token, and the scraper charges per result. It is a scraper run by a third party, so check Meta's Ad Library terms before you use it.

  This copy is the community skill as its author wrote it, shared in sickn33's collection. We only gave it a plain name. The original is at github.com/harshmaur/apify-facebook-ads-library-scraper.

  Licence: CC BY 4.0 (see the LICENSE-CONTENT file). Credit goes to harshmaur, who wrote the skill, and to sickn33, who shared it.
when:
  - You want to see what ads a rival brand is running right now.
  - You are testing a product idea and want to know who already advertises for the same keyword.
  - You need a list of long-running ads to study angles from.
  - You want video and image links from a competitor to save for a swipe file.
not_for:
  - "You want to create, pause or measure your own Facebook ads: use Meta Ads Manager or the Meta Marketing API with your own account."
  - "You want to turn the rows into a swipe file or a write-up: use the competitor ad swipe file builder or the competitor ad teardown writer."
  - "You want TikTok or Google ads: this only reads the Meta Ad Library, so use that platform's own public ad library."
  - "You need exact spend or reach for normal ads: Meta only shares these for political and issue ads, and some EU and UK ads."
you_give:
  - A brand name, Page link or keyword
  - Country and active or inactive status
  - Apify account token
  - A cap on how many ads to pull (optional)
you_get:
  - One row per ad
  - Creative and video links
  - Start dates and run length
  - Disclosed reach and spend for political ads
  - A sorted export you can open in a spreadsheet
how_to_use:
  - Before you run anything, read Meta's Ad Library terms. This scraper may not fit them, and your AI should stop until you say yes. Apify prices change, so check apify.com/pricing too.
  - Open your AI. Use one that can run code, such as Claude with code tools. You also need an Apify account and token.
  - Paste the skill, or upload its folder, and say "Follow this skill".
  - Give it a Page link or a keyword. Add the country and whether you want active ads.
  - Set a cap on ads, for example 200. Check the cost estimate before a big run.
  - Read the report. Look at the longest-running ads first, and open their links to see the creative.
  - Treat long-running ads as a guess about what works, not proof.
  - This is a paid third-party scraper. Check Meta's Ad Library terms before you use the data. Use it to study ads, not to copy them.
  - Next, save the best rows in a swipe file or write a teardown.
output_sample:
  input:
    - A brand's Facebook Page link, or a keyword
    - Country and active or inactive status
    - Your Apify token
    - A cap on how many ads to pull (optional)
  prerequisites:
    - An Apify account and token
    - An AI that can run code or use the Apify tool
    - Credit on your Apify account, because it charges per ad
  output:
    - name: Ad rows
      contains: One row per ad with the Page name, ad text, headline, call to action, link and platform.
    - name: Creative links
      contains: Image and video links for each ad, plus a link to the ad in the Ad Library.
    - name: Dates and run length
      contains: Start date, end date, days live and a flag for ads running over 30 days.
    - name: Disclosed numbers
      contains: Spend, impressions and reach ranges when Meta shares them. Other rows stay empty.
    - name: Audience details
      contains: Age range, gender and countries for EU and UK ads, when you ask for ad details.
    - name: Report
      contains: Ad count, how many are active, the longest-running ads with links, and common formats.
