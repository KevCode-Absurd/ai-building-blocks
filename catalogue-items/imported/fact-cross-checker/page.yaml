thinking: high
thinking_why: It compares many sources and weighs where they disagree.
new_slug: fact-cross-checker
name: Fact cross-checker
summary: Fact-check a claim against several independent sources. You get an evidence table with confidence levels, conflicts and open gaps.
job: think-and-decide
headline: Fact cross-checker
subhead: A claim checked against several independent sources, with a table that shows what supports it, what contradicts it and where the evidence runs out. You stop trusting the first search result.
explain: |
  A claim checked against several independent sources, with a table that shows what supports it, what contradicts it and where the evidence runs out. You stop trusting the first search result.

  The skill sets a small search budget first, about six searches and six page opens. It then uses at least two different search tools and prefers primary documents over summaries. Articles that all trace back to one origin count once. Each claim gets a confidence level of low, medium or high, and is marked as sourced or inferred. Pages it reads are treated as evidence only, never as instructions. It stops when another search is unlikely to add anything new.

  Licence: this copy is credited under the Apache 2.0 licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to sandbaseai and sickn33.
when:
  - You read a statistic in an article and need to know if it is true.
  - You are about to put a claim in a report and want proof behind it.
  - Two sources disagree and you need to see why.
  - You want to know which parts of a story rest on one source only.
not_for:
  - "You need one simple fact that a single official source answers: look it up on that source yourself."
  - "You want to check claims an earlier AI run made: paste that run's claims and its sources into this skill, or have a person review it."
  - "Your topic is private or must not be searched online: ask a qualified person, and do not paste it here."
you_give:
  - The claim or question to check
  - How deep to go (optional)
  - Sources you already trust (optional)
  - Anything you do not want searched (optional)
you_get:
  - An evidence table linking each claim to sources
  - A confidence level per claim
  - A list of conflicts between sources
  - A list of gaps still open
how_to_use:
  - Open Claude, ChatGPT or Gemini in a mode that can search the web and open pages. The skill needs at least two different search tools, such as web search plus a page reader or a second search source, and works to a budget of about six searches and six page opens. With only one tool, the table is a partial check and says so under gaps, so do not share it as complete.
  - The validator step is optional. The validator script and report-schema.md are only for that code step.
  - Paste the skill text from this page into the chat. If you want the validator step, also attach references/report-schema.md and scripts/validate_report.py. Without them, skip that step and ask for the table in plain text.
  - Type the claim you want checked, word for word. Add links to any sources you already trust, how deep to go, and any topics that must not be searched.
  - The result is a table with one row per claim: the claim, the source IDs, which sources support it and which contradict it, whether it is sourced or an inference, its confidence (low, medium or high) and whether sources conflict. A list of gaps follows. Read the table by confidence first. Then read the conflicts and gaps before you use the claim.
  - Click the cited links yourself for anything important. The check shows how well sources agree. It does not prove a claim is true.
  - Running the validator (scripts/validate_report.py) needs an AI that can run code, plus Python 3. It needs no API key. Without code, ask for the table in plain text.
  - Carry each claim into your final report with its confidence level and conflicts beside it.
  - For a claim that can change (prices, laws, news), write down the search date and run the check again on a date you set. About six searches can be too few for a high-stakes claim, so ask for a deeper check.
output_sample:
  input:
    - The claim or question you want checked
    - How deep to go (optional)
    - Sources you already trust (optional)
    - Anything you do not want searched (optional)
  prerequisites:
    - An AI that can search the web and open pages, with at least two different search tools
    - An AI that can run code, only if you want the report file checked by the bundled validator
  output:
    - name: Question and budget
      contains: The exact claim being checked and the search limit, about six searches and six page opens.
    - name: Evidence ledger (research-report.json)
      contains: Each claim linked to its sources, marked as supporting or contradicting, as sourced or inferred, with a confidence level.
    - name: Sourced synthesis
      contains: Findings sorted by confidence, with each citation next to its claim and sourced facts kept apart from inference.
    - name: Conflicts
      contains: Places where sources disagree, so you can see why.
    - name: Gaps and failed searches
      contains: What could not be confirmed, which search tools were unavailable, and the search date for time-sensitive claims.
