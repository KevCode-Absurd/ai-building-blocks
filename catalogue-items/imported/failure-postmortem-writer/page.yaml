thinking: medium
thinking_why: It follows a set review method on your account of events.
new_slug: failure-postmortem-writer
name: Failure postmortem writer
summary: Write a blame-free postmortem after a missed target, failed launch or outage. Get a five whys chain, root cause and dated action list.
job: think-and-decide
headline: Failure postmortem writer
subhead: A review of a miss that finds the cause in your process, not a person to blame, and ends with changes that will actually happen.
explain: |
  A review of a miss that finds the cause in your process, not a person to blame, and ends with changes that will actually happen. It works for a missed target, a failed launch or an outage.

  You start by stating the gap exactly: what you expected, what came out, and the cost. Then it runs a proper five whys. Each answer must go deeper than the last, until you reach something a specific change can fix. The skill separates the root cause from factors that only made things worse, and warns against two traps, the blame session and the vague promise to do better. Each action gets an owner and a date.
when:
  - You missed a quarterly number and the team keeps blaming one deal.
  - A project failed and the same problem could happen again.
  - You need to write up an incident for leadership.
  - A past review ended with vague actions and nothing changed.
not_for:
  - "You had one small miss that a quick fix solves in a day: talk it over in a short team check-in instead."
  - "You want to pick between options before you act: use a simple pros and cons list, or ask a trusted colleague."
  - "You want someone held to account for a mistake: handle that in a private talk with their manager, not in this review."
you_give:
  - What you expected and what happened
  - The impact in numbers
  - Timeline and who was involved
  - Any notes or data from the time (optional)
you_get:
  - An exact event statement
  - A five whys chain to the root cause
  - Contributing factors listed apart from the root cause
  - Action items with owners
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text from this page into a new chat.
  - "Describe the miss: what you expected, what happened, the cost, the timeline and who was involved. Add notes if you have them (optional)."
  - Read the five whys. If an answer blames a person, ask your AI to go one level deeper into the process.
  - Check that every action has a name, a date and a way to verify it. Ask for fixes if any are vague.
  - Bring the change register to your next team or leadership review, and check it again on the verification date.
output_sample:
  input:
    - What you expected and what actually happened
    - The impact, in numbers if you have them
    - A timeline and who was involved
    - Notes or data from the time (optional)
  output:
    - name: Event summary
      contains: The event name, what was expected, what happened and the cost, stated exactly.
    - name: Timeline
      contains: Dated points showing what happened or what was visible at each stage.
    - name: 5 Whys
      contains: Five linked questions, each answer going deeper, ending at a cause a specific change can fix.
    - name: Root cause and contributing factors
      contains: One sentence for the root cause, and a separate list of things that made it worse.
    - name: Warning signs missed
      contains: Signals that were visible earlier and why nobody acted on them.
    - name: In your control and out of your control
      contains: Two lists that split what you can change from what you can only prepare for.
    - name: Change register
      contains: A table of actions, each with an owner, a due date and a way to check it worked.
    - name: Verification date
      contains: The date you will check that the changes happened and worked.
