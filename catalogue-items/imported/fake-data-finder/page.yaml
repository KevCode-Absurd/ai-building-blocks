thinking: medium
thinking_why: It clicks through the page and traces each value to its source.
new_slug: fake-data-finder
name: Fake data finder
summary: Find fake data on a live page. Give it your URL and get a report that marks each number as real, mocked, hardcoded, made by AI or broken.
job: test-and-fix-code
headline: Fake data finder
subhead: A page audit that tells you which numbers on screen come from a real source and which are made up. It matters before you show an app built with AI to a customer or investor.
explain: |
  A page audit that tells you which numbers on screen come from a real source and which are made up. It matters before you show an app built with AI to a customer or investor.

  You give a live URL. A browser walks the page, takes a full screenshot, and lists every heading, button, card, stat and table cell. With your approval it clicks tabs and safe buttons, and watches network calls and console errors. Each value is labelled real, mocked, hardcoded, generated or broken. Warning signs include round numbers, clustered timestamps and values that never change. You confirm ownership and which actions are allowed before it starts.

  Licence: for reuse, follow the MIT licence the author names in the skill file header. That covers the skill text. Our LICENSE-CONTENT file (CC BY 4.0) covers only the rest of this page. Credit CodeShuX and sickn33 if you reuse it.
when:
  - You built a dashboard with an AI tool and are unsure what is connected.
  - A contractor delivered an app and you need a check before you pay.
  - A page looks too tidy, with every metric a round number.
  - You are about to demo an early product and want no surprises.
not_for:
  - "You do not own the app or cannot test it: ask the owner for a staging copy or a test account first."
  - "You want to test a whole site: this checks one page per run, so run it again for each page."
  - "You want to check code that is not live yet: ask a developer to review the code, or put it online on a test site first."
you_give:
  - The live page URL
  - Login details for a test account, if needed
  - Which actions are safe to click
  - Your suspicions about the page (optional)
you_get:
  - "A value-by-value report: real, mocked, hardcoded or broken"
  - Screenshots of the page
  - Notes on network and console problems
  - A short fix list
how_to_use:
  - Use an AI that can run code and open a browser with Playwright, such as Claude Code or Codex with Playwright installed. Those tools usually need a paid plan or API access, and you must install Playwright before the first run. A plain chat window cannot do this.
  - Give your AI the skill file by hand, as a normal skill. We do not offer it as a one-click plugin for Claude or Codex, because it drives a real browser and can click real buttons. Then give it your page link.
  - Run it on a staging copy or a test account first. It can click and submit real controls if the approval steps are skipped, so never point it at live customer data.
  - Say whether the page is public or needs a login. Offer a test account, never your real one.
  - Name the buttons and forms that are safe to click. Say which are off limits.
  - Your AI must ask before every click or form submit. Check each action it proposes against your safe list, and say no to anything on live customer data.
  - Read the report. Fix the hardcoded and mock values by connecting the real data source, then run it again on a fresh test account with no data. Pair the fixes with the test writer or code reviewer you already use. After the fixes, re-run the audit on a fresh test account and compare the two reports.
output_sample:
  input:
    - The link to your live page
    - Login details for a test account (optional)
    - Which buttons and forms are safe to click
    - Read-only database access (optional)
    - Any parts you know are made by AI on purpose (optional)
  prerequisites:
    - An AI that can run code and drive a browser with Playwright
    - Permission to test the page, ideally on a test copy
  output:
    - name: Summary table
      contains: How many values were marked real, mock, AI-made, hardcoded, broken or unknown.
    - name: Findings per section or tab
      contains: Each value with its verdict, where it came from, how serious it is and what to do.
    - name: Console errors and network failures
      contains: Errors the page threw and calls to its servers that failed.
    - name: Buttons that do nothing
      contains: Controls that were clicked and sent no request.
    - name: Suspicious patterns
      contains: Signs of seeded data, such as round numbers, clustered times or too few different values.
    - name: Follow-up questions
      contains: Questions for you to settle values the audit could not decide.
