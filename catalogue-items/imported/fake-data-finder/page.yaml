thinking: medium
thinking_why: It clicks through the page and traces each value to its source.
new_slug: fake-data-finder
name: Fake data finder
summary: Give it a live page. Get a report of which numbers are real, mocked,
  hardcoded or broken.
job: test-and-fix-code
headline: Fake data finder
subhead: A page audit that tells you which numbers on screen come from a real
  source and which are made up. It matters before you show an app built with AI
  to a customer or investor.
explain: |
  A page audit that tells you which numbers on screen come from a real source and which are made up. It matters before you show an app built with AI to a customer or investor.

  You give a live URL. A browser walks the page, takes a full screenshot, and lists every heading, button, card, stat and table cell. With your approval it clicks tabs and safe buttons, and watches network calls and console errors. Each value is labelled real, mocked, hardcoded, generated or broken. Warning signs include round numbers, clustered timestamps and values that never change. You confirm ownership and which actions are allowed before it starts.
when:
  - You built a dashboard with an AI tool and are unsure what is connected.
  - A contractor delivered an app and you need a check before you pay.
  - A page looks too tidy, with every metric a round number.
  - You are about to demo an early product and want no surprises.
you_give:
  - The live page URL
  - Login details for a test account, if needed
  - Which actions are safe to click
  - Your suspicions about the page (optional)
you_get:
  - "A value-by-value report: real, mocked, hardcoded or broken"
  - Screenshots of the page
  - Notes on network and console problems
  - A short fix list
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and open a browser.
