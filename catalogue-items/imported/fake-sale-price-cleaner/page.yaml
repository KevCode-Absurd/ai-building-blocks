thinking: low
thinking_why: It applies one price rule to many products.
new_slug: fake-sale-price-cleaner
name: Fake sale price cleaner
summary: Remove old strikethrough prices from your Shopify store when there is no real discount. Dry run first, with a CSV of every change.
job: set-prices
headline: Fake sale price cleaner
subhead: A Shopify store where strikethrough prices only show when there is a real discount. It removes old compare-at prices that no longer mean anything, which keeps your pricing honest.
explain: |
  A Shopify store where strikethrough prices only show when there is a real discount. It removes old compare-at prices that no longer mean anything, which keeps your pricing honest.

  The skill reads your variants through the Shopify CLI. It finds two kinds of problem: compare-at prices that are at or below the selling price, and compare-at prices that have sat unchanged past an age limit, 90 days by default. The age rule is off unless you turn it on, because any edit to a product resets the date it uses. You can limit the run to one collection or tag. It starts as a dry run and writes a CSV of every change first, so you can undo them. A live run clears the old values and does not keep them in Shopify. You need store access.
when:
  - Your store shows crossed-out prices that have been there for a year.
  - A product page shows a sale price higher than the old price.
  - You want to meet rules on fair price claims.
  - You are cleaning up after a sale ended.
not_for:
  - "You are running a sale right now: skip the cleaner, or turn off the age rule so live sale prices stay."
  - "You want to change selling prices, not remove old crossed-out ones: edit prices in Shopify admin or a bulk price editor."
  - "Your AI cannot reach your Shopify store with the Shopify CLI: ask a person with store access to run it."
you_give:
  - Your store domain
  - Shopify CLI access with product read and write rights
  - Age limit in days (optional)
  - A collection or tag to limit the run (optional)
you_get:
  - A dry-run list of affected variants
  - A CSV backup of old values
  - Cleared compare-at prices on a live run
  - A count of what changed
how_to_use:
  - Open an AI that can run code and use the Shopify CLI. Sign in to your store with product read and write access.
  - Paste this skill and give your store domain. Add a collection or tag to limit the run (optional).
  - Start with a dry run. This is the default, and nothing changes in your store.
  - Open the CSV and check every row. Old values are not kept in Shopify, so this file is your only way back. Do not run live until you have read it.
  - Leave the age rule off unless you mean to use it. It is off by default. It uses the date the variant was last updated, not the date the old price was set. Any edit to the product resets that date, so a live sale price can be cleared by mistake. Never turn it on during a sale.
  - Run it live only when the CSV looks right. Then check 5 to 10 products on your store.
  - Keep the CSV. It is the only way to restore a price. To bring one back, open the product in Shopify admin, open the variant, and type the old value from the CSV into the Compare-at price box. Check the box name against your admin, as Shopify changes its menus.
  - Fair price rules differ by country. This tool removes strikethrough prices that show no real discount, but it does not check that your remaining sale claims are lawful. Ask an adviser if you are unsure.
output_sample:
  input:
    - Your store domain
    - An age limit in days (optional)
    - A collection or tag to limit the run (optional)
  prerequisites:
    - An AI that can run code and the Shopify CLI
    - Shopify CLI sign-in with permission to read and write products
  output:
    - name: Dry-run summary
      contains: A count of variants checked and how many would be cleared, split by no-discount and old prices.
    - name: compare_at_cleanup CSV
      contains: One row per variant with price, the old compare-at price, the rule matched and the change status.
    - name: Live run changes
      contains: Compare-at prices cleared to empty on matching variants, only after you turn off dry run.
    - name: Final summary
      contains: Counts of variants checked, cleared by each rule, total cleared and errors, plus the CSV file name.
