thinking: low
thinking_why: It turns one description into a prompt with ready-made templates.
new_slug: fashion-scene-image-maker
name: Fashion scene image maker
summary: Describe a scene, with or without a reference photo. Get an image or a new pose. Your image model draws it.
job: make-images
headline: Fashion scene image maker
subhead: Describe a scene, with or without a reference photo. Get an image or a new pose. Your image model draws it.
explain: |
  A fashion image from one sentence, or a changed version of a photo you already have. Claude writes the prompt, and your image model such as ChatGPT or Gemini draws it.

  The skill breaks every picture into five slots: the person, the clothes, the setting, the camera view and framing, and the mood and light. You fill each one and it joins them into a clean prompt with an aspect ratio. With a reference photo it also supplies ready-to-copy edit lines to swap the model, change the pose or change the outfit while keeping the rest. Claude cannot draw the picture itself, so you need an image tool. Its word list is in Chinese.
when:
  - You need a lookbook shot and have no photo yet.
  - You want the same model in a different pose.
  - You want to try a new outfit on an existing photo.
  - You want a cafe, street or home scene for a product page.
you_give:
  - A short description of the person, clothes and setting
  - Camera view and framing, such as waist-up
  - Mood and light
  - A reference photo (optional)
  - An image tool to draw it
you_get:
  - A five-slot image prompt
  - Aspect ratio and size settings
  - Edit lines for model, pose or outfit changes
  - A prompt ready to paste into your image tool
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and use your own image model key (OpenAI, Gemini, fal or Replicate).
