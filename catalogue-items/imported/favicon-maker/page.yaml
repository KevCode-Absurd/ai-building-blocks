thinking: low
thinking_why: It resizes one image by fixed steps.
new_slug: favicon-maker
name: Favicon maker
summary: Turn one logo file into a full favicon set for your website. It saves the icons in the right folder and adds the link tags to your site.
job: build-websites
headline: Favicon maker
subhead: The small icons browsers show in tabs, made from one logo file, saved in the right folder and linked in your HTML. One command replaces an hour of resizing.
explain: |
  The small icons browsers show in tabs, made from one logo file, saved in the right folder and linked in your HTML. One command replaces an hour of resizing.

  The skill checks that your source image exists and is a supported type: PNG, JPG, SVG, WEBP or GIF. It looks at your project to find the framework, such as Next.js, Rails, Astro, Hugo or Vite, and picks the right static folder. It then uses ImageMagick to create each size, including the Apple touch icon and the sizes for Android, and copies an SVG as well if you gave one. Finally it adds the link tags to your HTML head. You need ImageMagick installed.
when:
  - You just finished a site and the tab shows a blank icon.
  - You have a logo and no idea which sizes browsers want.
  - You switched frameworks and need icons in the new folder.
  - Your phone home screen icon looks blurry.
not_for:
  - "You want to keep the icons your site already has: leave them as they are, because this skill replaces existing favicon tags."
  - "You need a new or redesigned logo: use a design tool or ask a designer, because this only resizes the image you give it."
  - "You cannot run code or install ImageMagick: ask a developer to run it, or use a free online favicon site."
you_give:
  - A logo image file
  - Your project folder
  - ImageMagick installed
you_get:
  - A full set of favicon files
  - Icons placed in the correct folder
  - Link tags added to your HTML
  - A list of files created
how_to_use:
  - Use an AI tool that can run code and save files in your project folder. ImageMagick version 7 or newer must be installed on your computer.
  - "Save your work first: commit it in Git or copy the project folder. The skill runs commands (magick, cp, mkdir) on your computer. It replaces old icon files, rewrites site.webmanifest and removes old icon link tags from your layout file."
  - Open the SKILL.md file and paste its full text into your AI tool.
  - "Tell your AI the path to your logo file, for example: logo.png."
  - Let it check your project, then confirm the folder it picks for the icons.
  - Check the list of files it made and open your site to see the new tab icon.
  - If it could not find your layout file, copy the link tags it gives you into your HTML head.
output_sample:
  input:
    - Your logo image file (PNG, JPG, SVG, WEBP or GIF)
    - Your project folder, so it can find your framework and layout file
  prerequisites:
    - An AI tool that can run code and save files
    - ImageMagick version 7 or newer installed on your computer
  output:
    - name: favicon.ico
      contains: One icon file holding the 16, 32 and 48 pixel sizes for browser tabs.
    - name: favicon-96x96.png
      contains: A 96 pixel square PNG icon.
    - name: apple-touch-icon.png
      contains: A 180 pixel icon used when someone saves your site to an Apple home screen.
    - name: web-app-manifest-192x192.png and web-app-manifest-512x512.png
      contains: Two larger icons for Android and installed web apps.
    - name: favicon.svg
      contains: A copy of your logo, made only when your source file is an SVG.
    - name: site.webmanifest
      contains: Your app name, the two large icons and the theme settings. Existing colors are kept.
    - name: Updated layout file
      contains: Favicon link tags added to your HTML head, or the icons block in the Next.js metadata.
    - name: Summary
      contains: The framework found, the folder used, the files made, the app name and any files overwritten.
