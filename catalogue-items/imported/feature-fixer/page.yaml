thinking: medium
thinking_why: It scopes the area, finds the cause and fixes it.
new_slug: feature-fixer
name: Feature fixer
summary: Fix a broken feature or module in your code. Your AI traces it end to end, finds the cause, repairs it and runs tests on nearby code.
job: test-and-fix-code
headline: Feature fixer
subhead: Name a feature that is broken and say what goes wrong. Your AI maps the feature and its links, writes a diagnosis, and only then fixes it. You get a fixed feature, test results and a log of every change.
explain: |
  A broken feature traced from one end to the other, repaired, and tested, without side effects on the rest of the app. It suits cases where a whole module is off, not one bug.

  The skill works in five phases in strict order. It fixes the scope, traces the code path, then diagnoses what is wrong. A rule blocks any fix until the diagnosis is finished. After that it makes the changes, then verifies them with tests and checks that nearby features still work. It tells you when your problem is only a single bug, so a lighter debugging approach fits better. The report lists what it found, what it changed and what it left alone.
when:
  - Your checkout flow half works and nobody knows why.
  - You were told to make the export module work properly.
  - Several bugs sit in one area and fixing them one by one keeps failing.
  - You want a fix that does not break other parts of the app.
not_for:
  - "You have one bug with one clear symptom: use the bug diagnoser."
  - "You have no access to the code or cannot run tests: ask a developer to check the feature with you first."
  - "The feature needs a full redesign: talk with your team about a rebuild before you patch anything."
you_give:
  - The name or folder of the feature
  - What is broken, in your words
  - The path to your code project
  - The command that runs your tests
  - Error logs or error messages (optional)
  - The range of recent commits that may have caused it (optional)
you_get:
  - A map of the feature's files and what it connects to
  - A diagnosis with a risk label on each issue, written before any change
  - Fixes made one at a time, each checked with a test
  - Test results for the feature and for the code that uses it
  - A list of every change made
how_to_use:
  - Use an AI that can read your project files and run commands, like a coding assistant in your terminal or editor. A plain chat window cannot run your tests.
  - Gather your project folder path, your test command, any error logs and the recent commit range if you know it.
  - Keep secrets out of the chat. The skill checks your .env file and service keys. Ask it to confirm each key is set without printing the value, and to test keys against test accounts, never your live production services.
  - Paste the skill into your AI, then name the feature and describe what is broken. The skill mentions three companion skills (systematic debugging, verification before completion and scope). You do not need them. Your AI can follow the five phases without them.
  - Read the diagnosis report before you let it change anything. Check that the causes make sense.
  - Let it fix one issue at a time. If three fixes in a row cause new problems, it stops and asks you whether to rethink the design.
  - Read the completion report. Check the feature by hand if it has a screen.
  - Before you merge, ask a second developer to read the change log, and run your full test suite.
output_sample:
  input:
    - The name or folder of the broken feature
    - What is broken, in your words
    - Access to your code and tests
    - Steps to reproduce the problem (optional)
  prerequisites:
    - An AI that can read your project files and run commands, such as tests and git
  output:
    - name: Feature scope
      contains: The main folder, the files that other code uses, the files used only inside the feature, and file and line counts.
    - name: Dependency map
      contains: What the feature relies on, what relies on it, and the environment variables and config files it needs.
    - name: Diagnosis report
      contains: Each issue with a risk label, file and line, confirmed cause, and the results of the feature's tests.
    - name: Fix log
      contains: One entry per fix with the file, the issue, the change made and the test result.
    - name: Completion report
      contains: Files changed, fixes made, test totals, regressions found, and a check of each file that uses the feature.
