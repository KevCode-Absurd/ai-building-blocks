new_slug: feature-priority-scorer
name: Feature priority scorer
summary: Rank your feature list with a RICE score and see what fits your team's capacity. Also get interview themes and a requirements template.
job: build-product
headline: Feature priority scorer
subhead: Your feature list ranked by a score, not by who asked loudest. You also get interview themes and a requirements template to start writing the spec.
explain: |
  Your feature list ranked by a score, not by who asked loudest. You also get interview themes and a requirements template to start writing the spec.

  The RICE tool takes a CSV where each feature has reach, impact, confidence and effort, and scores it as reach times impact times confidence, divided by effort. With a team capacity figure, it shows what fits in the quarter. A second script reads a customer interview transcript and pulls out pain points, requests and quotes. Templates in the references folder help write the requirements document after that. The scripts need Python. A sample file shows the format.
when:
  - You have 30 feature ideas and room for six.
  - Stakeholders disagree on what to build first.
  - You finished customer calls and need the main points.
  - You are ready to write a requirements document.
not_for:
  - "You have one decision and no list of options: talk it through with your team instead."
  - "You have no reach estimates for your features: run a few customer calls first, then score."
  - "You need a full product roadmap with dates: use a roadmap session with your team and engineers."
you_give:
  - A feature list with reach, impact, confidence and effort
  - Team capacity for the period, in person-months (the default is 10)
  - Interview transcripts (optional)
  - The problem you are solving
you_get:
  - Features ranked by RICE score
  - A shortlist that fits your capacity
  - Pain points and quotes from interviews
  - A requirements template
how_to_use:
  - Open an AI that can run Python 3 code, such as Claude Code, and upload the skill folder. The scripts need only Python 3. If your AI cannot run code, paste in the skill text and it will score the features by hand with the same formula.
  - Ask it to make the sample CSV file, so you can see the format.
  - Replace the sample rows with your own features. Add reach, impact, confidence and effort for each.
  - Ask it to run the scoring with your team capacity in person-months, and read the ranked list.
  - Check the top picks against your goals and ask your team if they agree.
  - Save the ranking as a CSV or JSON file, add it to your roadmap or spreadsheet, and check the top picks with the people who asked for them. Then write the spec for the winner.
  - To analyze a customer call, upload the transcript and ask for the pain points, requests and quotes. For many calls at once, use the customer interview synthesizer.
output_sample:
  input:
    - Your feature list as a CSV file, with reach, impact, confidence and effort for each feature
    - Your team capacity for the period
    - A customer interview transcript (optional)
    - The problem you are solving
  prerequisites:
    - An AI that can run Python code and read files
  output:
    - name: RICE ranking
      contains: Each feature with its RICE score, from highest to lowest.
    - name: Portfolio analysis
      contains: A view of quick wins against big bets, and where effort piles up.
    - name: Quarterly roadmap
      contains: The features that fit inside the team capacity you gave.
    - name: JSON or CSV export
      contains: The same ranking in a file you can open in a spreadsheet or other tool.
    - name: Interview analysis
      contains: Pain points, feature requests, themes, sentiment and notable quotes from one transcript.
    - name: PRD templates
      contains: Requirements document templates for complex features, simple features, early ideas and agile epics.
next: [feature-spec-writer, customer-interview-synthesizer]
