thinking: medium
thinking_why: It tests against a fixed list of success criteria.
new_slug: federal-accessibility-checker
name: Federal accessibility checker
summary: Check your site, app or documents against Section 508. Get a list of accessibility gaps, a fix plan and notes for your conformance report.
job: check-contracts
headline: Federal accessibility checker
subhead: Describe your site, app or documents. Your AI checks them against Section 508 and WCAG 2.0 AA. You get gaps, a fix plan and draft report notes.
explain: |
  A list of where your website, app or documents fall short of Section 508, what to fix first, and notes you can use in an accessibility conformance report. It is built for US federal work and for vendors who sell to agencies.

  The skill uses the Revised Section 508 Standards and WCAG 2.0 Level AA. It cites the exact success criterion for every finding, such as 1.4.3 for contrast. The output fits the task: a section-by-section table for a VPAT, an issue table for an audit, a phased plan with owners for fixes, or draft purchasing clauses. It also covers testing methods and screen reader checks. It is guidance, not a legal ruling.
when:
  - You sell software to a federal agency and need a VPAT.
  - A buyer asks whether your site meets Section 508.
  - You want a phased plan to fix accessibility issues.
  - You need accessibility language for a purchase request.
not_for:
  - "You need a legal ruling or formal certification: hire a qualified accessibility auditor or counsel."
  - "Your work is not for a US federal agency: check first whether Section 508 applies, as ADA or other rules may fit better."
  - "You need your site tested by real tools and screen readers: run a scan like axe or WAVE yourself, or hire a tester."
you_give:
  - A description or URL of the site, app or document
  - Who uses it and who buys it
  - Known issues or earlier audit results (optional)
  - Deadline (optional)
you_get:
  - Gaps tied to WCAG criteria
  - A priority fix plan
  - Draft conformance report remarks
  - Procurement wording if needed
how_to_use:
  - "Gather first: the site or document address, who uses it, which agency buys it, any earlier audit results, and your deadline."
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Describe your site, app or document. Say who uses it and who buys it. Add earlier audit results and your deadline if you have them.
  - "Ask for outputs in this order. First the gap table. Then the issue table. Then the fix plan. Ask for VPAT notes or purchase wording last, only if you need them."
  - Read each result and check every criterion against your real product. Your AI works from your description and does not run tests.
  - Treat any suggested fix deadlines as examples. Agree the real ones with the agency.
  - "Confirm these before you rely on them: the 30-day VPAT timing and the FAR clause 52.239-2 reference in the procurement part are the author's and are unverified. Check them with the contracting officer or on section508.gov. Check any law dates the result gives on ada.gov or section508.gov too. The skill also says its note on how much automated tools catch is not sourced."
  - Then fix the gaps with the WCAG accessibility fixer, and run a scan with a tool such as axe or WAVE.
output_sample:
  input:
    - A description or link for your site, app or document
    - Who uses it and who buys it
    - Known issues or earlier audit results (optional)
    - Your deadline (optional)
  output:
    - name: Gap table
      contains: Each WCAG 2.0 criterion with a red, yellow or green status, gap notes and a priority.
    - name: Issue table
      contains: "For audits: the criterion, the problem, the element affected and how to fix it."
    - name: Remediation plan
      contains: Phased fixes with an owner, effort and timeline for each issue.
    - name: VPAT remarks
      contains: Draft conformance level and remarks for each criterion, ready to paste into your report.
    - name: Procurement clauses
      contains: Draft purchasing language that cites Section 508 and WCAG 2.0 AA, if you need it.
