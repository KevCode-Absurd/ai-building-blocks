job: check-contracts
headline: Federal cloud approval planner
subhead: "A FedRAMP path for your cloud service: what level you aim for, which
  documents you need, and which gaps to close before you start. It saves months
  of guessing."
explain: |
  A FedRAMP path for your cloud service: what level you aim for, which documents you need, and which gaps to close before you start. It saves months of guessing.

  The skill reflects the current rules, including the new certification classes and the faster 20x route built on key security indicators. You describe your service, customers and cloud setup. It checks readiness, defines the system boundary, maps NIST 800-53 controls, and lists the papers: the system security plan, assessment plan, assessment report, and the plan of action and milestones. It then covers ongoing monitoring after approval. Rules change often, so check dates against official FedRAMP pages.
when:
  - A federal agency wants to buy your SaaS and asks about FedRAMP.
  - You do not know which authorization level fits your product.
  - You need to know what documents to write first.
  - You are authorized already and need a monitoring routine.
you_give:
  - A description of your service
  - Your cloud provider setup
  - Target customers and data types
  - Current security documents (optional)
you_get:
  - A recommended authorization path
  - A gap list
  - A document checklist
  - A control mapping
  - Monitoring steps
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
