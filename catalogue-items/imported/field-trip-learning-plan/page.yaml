thinking: medium
thinking_why: It adds reflection and transfer around the experience.
new_slug: field-trip-learning-plan
name: Field trip learning cycle planner
summary: Turn a field trip, simulation or practical into lasting learning. Get a before, during and after plan for your field trip lesson.
job: teach-and-train
headline: Field trip learning cycle planner
subhead: A before, during and after plan that turns a trip, simulation or practical activity into learning that sticks. Students come back with understanding, not just a good day out.
explain: |
  A before, during and after plan that turns a trip, simulation or practical activity into learning that sticks. Students come back with understanding, not just a good day out.

  You give the learning objective and the type of experience. The plan builds on well-known work on learning from experience: prepare students with questions and prior knowledge, run the activity with set tasks to observe or record, then reflect afterwards on what happened, why and what to do differently. It ends with a way to apply the lesson to new cases and a simple check of what they learned. You can add age group, subject and available time.
when:
  - You have a field trip booked and want it tied to the curriculum.
  - You plan a role play or simulation and need a debrief.
  - A practical lesson ends in a fun mess with nothing learned.
  - You need a plan that fits a short time slot.
not_for:
  - "You only run a short activity with no time after it: use a simple five-minute debrief instead."
  - "You want a long community project with real service: use the service-learning-project-designer."
  - "You want a run of lessons held outdoors: use the outdoor-learning-sequence-designer."
you_give:
  - The learning objective
  - The type of experience, such as a trip or simulation
  - Student age or year (optional)
  - Subject area (optional)
  - Time available (optional)
you_get:
  - Pre-activity preparation
  - Tasks for during the activity
  - A reflection and debrief plan
  - A check of what was learned
how_to_use:
  - Write down your learning objective in one or two sentences.
  - Note the kind of experience, such as a trip, role play or simulation.
  - Add the class age, subject and time slot if you know them (optional).
  - Paste the skill into Claude, ChatGPT or Gemini, then paste your notes. No code or files are needed. The skill has blank slots near the end, in double curly brackets, such as the learning objective. Fill them in before you paste, or leave them and tell your AI to fill them from your notes.
  - Check that each phase fits your time. Ask your AI to shorten any phase that runs long.
  - Print the plan and take it with you on the day.
output_sample:
  input:
    - Your learning objective
    - The kind of experience, such as a trip or simulation
    - Student age or year (optional)
    - Time available (optional)
    - Subject and what students already know (optional)
  output:
    - name: Phase 1 Experience
      contains: What students do, see and record during the activity, with set tasks and timing.
    - name: Phase 2 Reflection
      contains: Questions that help students think about what happened and why.
    - name: Phase 3 Conceptualisation
      contains: How students link what they saw to the key ideas in your objective.
    - name: Phase 4 Application
      contains: A task that uses the lesson in a new case, plus a check of what was learned.
    - name: Transitions Between Phases
      contains: Short notes on how to move students from one phase to the next.
