thinking: medium
thinking_why: It compares slides and judges the writing.
new_slug: finance-deck-quality-checker
name: Finance deck quality checker
summary: Check a client deck for number mismatches, weak wording and format slips, slide by slide, before you send it. Read only, no edits.
job: work-with-files
headline: Finance deck quality checker
subhead: A slide-by-slide check of a client presentation that finds numbers that do not match, loose wording and formatting slips before the client sees them. It only reads, and changes nothing.
explain: |
  A slide-by-slide check of a client presentation that finds numbers that do not match, loose wording and formatting slips before the client sees them. It only reads, and changes nothing.

  You provide the deck. The skill reads every slide and keeps track of which slide each line came from. It then checks four things: whether figures agree across slides and with each other, whether the story and claims are consistent, whether the language is clear and professional, and whether the formatting is uniform. Every finding names the slide and shows the conflict, such as a $500M figure that appears as $450M elsewhere. It uses Indian conventions: April to March fiscal years and lakh and crore units.
when:
  - A pitch deck goes to a client in an hour.
  - You edited numbers on one slide and fear you missed another.
  - Different team members wrote different sections of one deck.
  - You want a second reviewer for a board presentation.
not_for:
  - "You need sign-off on audited filings or legal documents: use a human finance reviewer."
  - "Your deck has almost no numbers to check: ask a colleague for a quick read instead."
  - "You want your AI to fix the slides for you: this checker only reports, so make the edits yourself."
you_give:
  - The slide deck as a PowerPoint file, or open in the add-in
  - The audience (optional)
  - Key figures that must match (optional)
  - Your fiscal year end (April to March in India), and the currency and unit, such as rupees in lakh or crore. Confirm these before the check starts
you_get:
  - A list of number mismatches by slide
  - Wording and claim issues
  - Formatting inconsistencies
  - A priority order for fixes
how_to_use:
  - Paste the skill into your AI. Use Claude or another AI that can read files and run code.
  - Upload your deck as a PowerPoint file in chat, or open it in the PowerPoint add-in. In chat, the AI reads the file and writes each slide's text, with slide numbers, to a working file. It needs to run Python for the number check.
  - Say who the deck is for and list any key figures that must match (optional).
  - Read the critical findings first. Fix those slides in your own file.
  - Run the check again after your edits to confirm the mismatches are gone.
  - For a wording and structure review of a pitch deck, use the pitch deck 10/20/30 checker.
output_sample:
  input:
    - Your client deck as a PowerPoint file, or open in the PowerPoint add-in
    - Who the deck is for (optional)
    - Key figures that must match across slides (optional)
  prerequisites:
    - An AI that can read a PowerPoint file, or the PowerPoint add-in
    - An AI that can run code, to run the number-checking script
  output:
    - name: Critical findings
      contains: Number mismatches, factual errors and claims the data does not support, each with the slide numbers and the conflicting values.
    - name: Important findings
      contains: Language slips, missing chart sources and terms used in different ways for the same thing.
    - name: Minor findings
      contains: Font sizes, spacing, number format drift and date format drift to polish.
    - name: Fix order
      contains: A short list that puts criticals first, so you know what to fix before the client sees the deck.
next: [pitch-deck-checker-10-20-30]
