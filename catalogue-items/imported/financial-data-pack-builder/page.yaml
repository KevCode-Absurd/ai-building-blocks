thinking: medium
thinking_why: It extracts numbers and standardises them.
new_slug: financial-data-pack-builder
name: Financial data pack builder
summary: Turn a deal document or filing into a financial data pack in Excel. Get statements, source pages and balance checks in one standard layout.
job: money-and-investing
headline: Financial data pack builder
subhead: Give it a deal document, annual report or filing. It pulls the income statement, balance sheet and cash flow into a standard Excel workbook. Every figure shows its source page, and the checks show whether the statements balance.
explain: |
  A clean Excel data pack with income statement, balance sheet and cash flow pulled from a deal document or filing, with every number traced to its page. It follows the layout used in private equity and banking.

  The skill reads the source and puts each figure into a standard template. Rules cover formats, such as currency with negatives in brackets, and totals as live formulas rather than typed values. It checks that assets equal liabilities plus equity, that subtotals add up, and that cash flow ties to the balance sheet. It uses Indian conventions: April to March fiscal years, and crore figures divided in a formula. It builds the workbook through the spreadsheet skill.
when:
  - You have a 100-page offering document and need the numbers in Excel.
  - Your team needs a data pack before a deal meeting.
  - You want a source page next to every figure.
  - You need several years side by side in one standard layout.
not_for:
  - "You only need a simple ratio or a quick sum: do it in a spreadsheet yourself."
  - "You already have a finished data pack: edit it by hand or ask your AI to review it."
  - "You have no deal document or filing to read: gather the source first, then run this."
you_give:
  - The deal document, annual report or filing
  - The periods to include
  - Company name and currency
  - A template to follow (optional)
you_get:
  - An Excel workbook with income statement, balance sheet and cash flow
  - Totals that are live formulas, not typed numbers
  - A source page for each figure
  - Checks that show whether the statements balance
how_to_use:
  - Open Claude, ChatGPT or Gemini. Use one that can read files and save spreadsheets.
  - Paste the skill text into the chat, or upload the skill folder.
  - Upload your deal document or filing. Say which periods and which currency you want.
  - Tell your AI to follow the skill and build the Excel data pack.
  - Open the workbook. Check the balance sheet check first, then spot-check a few figures against their source pages.
  - If the pack has Base or Downside cases, treat those figures as the AI's
    assumptions. Check and change them, and keep the "Assumption" label.
  - Next, send the checked workbook to your team before the deal meeting.
output_sample:
  input:
    - Your deal document, annual report or filing
    - The periods you want to include
    - Company name and currency
    - A template to follow (optional)
  prerequisites:
    - An AI that can read files and save Excel spreadsheets
    - "The skills india-market-conventions, india-market-data and xlsx, which this skill loads. They are not in this folder, so install them first"
  output:
    - name: Executive Summary
      contains: Key figures and highlights from the company, set out for a first read.
    - name: Historical Financials
      contains: The income statement across your chosen periods, with totals as live formulas and a source page for each figure.
    - name: Balance Sheet
      contains: Assets, liabilities and equity by period, with a check that assets equal liabilities plus equity.
    - name: Cash Flow Statement
      contains: Operating, investing and financing cash flows, tied to the changes in the balance sheet.
    - name: Operating Metrics
      contains: Business measures taken from the source, such as volumes or margins, in a standard layout.
    - name: Market Analysis
      contains: Market facts from the source document, kept short and referenced.
    - name: Investment Highlights
      contains: The main points for a deal meeting, taken from the source.
