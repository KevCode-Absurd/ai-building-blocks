thinking: high
thinking_why: It weighs many linked EU rules and supplier terms.
new_slug: financial-it-resilience-checker
name: Financial IT resilience checker
summary: Check your finance firm against DORA. Give it your firm and IT suppliers. You get gaps, incident reporting steps and supplier contract checks.
job: check-contracts
headline: Financial IT resilience checker
subhead: Tell your AI about your finance firm and its IT suppliers. It checks current DORA sources and lists your gaps. It also shows what evidence and incident facts you still need.
explain: |
  Share your firm, systems and supplier details. The skill checks current DORA sources, maps evidence and lists missing incident facts.

  You describe your firm and the IT suppliers you use. The skill checks current DORA texts and standards, separates DORA from NIS2, and records source links and dates. Incident classification stays open when required facts are missing.

  This is a copy of a third-party DORA skill. Its answers are not legal advice. The skill points to current EUR-Lex texts and tells you to check them, so confirm each source and date it gives before you use it.

  Licence: MIT, as the LICENSE file says. Credit goes to Hemant Naik.
when:
  - You run a bank, insurer or payments firm in the EU and must meet DORA.
  - A cloud supplier contract needs checking against the required clauses.
  - You need to know when and how to report an IT incident.
  - Your board wants a readiness gap list.
not_for:
  - "Your firm is outside DORA scope: ask a lawyer, or look at NIS2 guidance for your sector."
  - "You need legal advice or a sign-off for your regulator: use a qualified lawyer or an accredited assessor."
  - "You want one incident classified from an outage time alone: gather all the incident facts first, or ask your regulator."
you_give:
  - Your firm type and size
  - A list of IT suppliers and what they do
  - Existing policies and contracts (optional)
  - Past incidents (optional)
you_get:
  - A DORA gap analysis
  - Incident reporting steps
  - Supplier contract checks
  - A register of information outline
  - Priority actions
how_to_use:
  - Before you start, gather your supplier list, the contract clauses that cover each one, and the facts of any incident. Without the incident facts the skill will not classify it.
  - Open Claude, ChatGPT or Gemini. Use one that can browse the web, so it can check current DORA texts.
  - Paste the skill instructions into the chat, or upload the skill folder if your AI accepts files.
  - "Describe your firm: its type, size and the services it runs."
  - List your IT suppliers and what each one does. Add contracts, policies and past incidents if you have them.
  - Check the source links and dates in the answer before you rely on them.
  - Share the gap list with your compliance lead or lawyer before you act on it.
  - Then review your riskiest suppliers one by one with the vendor risk reviewer, and write an incident runbook.
output_sample:
  input:
    - Your firm type and size
    - A list of your IT suppliers and what each one does
    - Your policies and supplier contracts (optional)
    - Your past incidents (optional)
  prerequisites:
    - An AI that can check the web, so it can confirm current DORA texts on EUR-Lex
  output:
    - name: Source check
      contains: The official links and the dates checked for each DORA text used.
    - name: Gap analysis
      contains: "A table by phase: governance, incidents, testing and third-party risk, with status and evidence still needed."
    - name: Incident reporting steps
      contains: The three report stages with deadlines, plus the incident facts still missing before it can be classified.
    - name: Supplier contract checks
      contains: Which required contract clauses each ICT supplier agreement covers and which it lacks.
    - name: Register of Information outline
      contains: The fields to fill in for each ICT service arrangement, such as provider, service type and data location.
    - name: Priority actions
      contains: The gaps to fix first, in order.
next: [vendor-risk-reviewer, incident-runbook-writer, supplier-risk-scorecard-builder]
