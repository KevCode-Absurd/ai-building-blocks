name: Financial IT resilience checker
summary: Describe your finance firm and IT suppliers. Get DORA gaps, incident reporting steps and supplier contract checks.
job: check-contracts
headline: Financial IT resilience checker
subhead: Describe your finance firm and IT suppliers. Get DORA gaps, incident reporting steps and supplier contract checks.
explain: |
  A gap list against the EU's DORA rules for IT resilience, with incident reporting steps and a check of your supplier contracts. It tells you what a finance firm in the EU must have in place and what is missing.

  You describe your firm and the IT suppliers you use. The skill walks through the rule chapters in order: the risk management framework, incident classification and reporting, resilience testing including threat-led tests, third-party risk, the register of information, and the contract terms every critical supplier must accept. It keeps DORA separate from NIS2 and cites the actual articles and technical standards. Rules apply from 17 January 2025. It is guidance for planning, not legal advice.
when:
  - You run a bank, insurer or payments firm in the EU and must meet DORA.
  - A cloud supplier contract needs checking against the required clauses.
  - You need to know when and how to report an IT incident.
  - Your board wants a readiness gap list.
you_give:
  - Your firm type and size
  - A list of IT suppliers and what they do
  - Existing policies and contracts (optional)
  - Past incidents (optional)
you_get:
  - A DORA gap analysis
  - Incident reporting steps
  - Supplier contract checks
  - A register of information outline
  - Priority actions
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
