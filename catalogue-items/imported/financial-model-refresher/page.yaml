thinking: medium
thinking_why: It changes linked numbers and checks the effects.
new_slug: financial-model-refresher
name: Financial model refresher
summary: Update your financial model after earnings or new guidance. See what moved in your estimates, what it does to value, and the biggest changes.
job: money-and-investing
headline: Financial model refresher
subhead: An existing model brought up to date after earnings, new guidance or a market move, with the biggest changes to estimates pointed out. You see what moved and why.
explain: |
  An existing model brought up to date after earnings, new guidance or a market move, with the biggest changes to estimates pointed out. You see what moved and why.

  First you say what triggered the update: a results release, new guidance, a change in your own view, a macro shift or an event like an acquisition. The skill plugs in the new actuals and compares each line to your prior estimate, showing the gap and a note. It then adjusts forward estimates, flows the changes through the statements, and flags the lines with the largest revisions. It follows Indian conventions: April to March fiscal years and lakh and crore units.
when:
  - A company just reported quarterly results.
  - Management raised or cut guidance.
  - Interest rates or currency moved and your forecast is stale.
  - You need a short note on what changed in your numbers.
not_for:
  - "You have no earlier model for the company: build one first, then come back to update it."
  - "You want to rebuild the model from scratch: start a new model instead of using this one."
  - "You plan to share the rating or price target with clients: get a compliance check first, as this is for your own analysis."
you_give:
  - The current model file (Excel is best), with the prior estimate lines you want compared
  - New results, guidance or the event, and where the numbers come from (results release, guidance text)
  - Your view on what changed (optional)
you_get:
  - Updated actuals
  - A prior versus new estimate table
  - Revised forecasts
  - Largest changes flagged
  - A short change summary
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text from this page.
  - "Say what triggered the update: results, guidance, a macro move or an event."
  - Paste your current model, or upload the file if your AI can read files.
  - Add the new results or guidance. Add your own view if you have one (optional).
  - Check the actuals table first. Confirm each actual against the company's results release before you read the valuation. Anything marked not provided was not found, so add it yourself. Then read the flagged changes and the summary.
  - Treat the rating and price target as your own working view until a compliance check is done.
  - Next, compare your new estimates with consensus. Then write the note with the earnings update report writer, and re-check the value with the valuation method comparer.
output_sample:
  input:
    - Your current financial model file
    - The new results, guidance or event
    - Your own view on what changed (optional)
  prerequisites:
    - An AI that can read your model file, or numbers pasted into the chat
  output:
    - name: Update trigger
      contains: "What caused the update: results, guidance, a macro move or an event."
    - name: Actuals table
      contains: Each line with your prior estimate, the actual, the gap and a short note.
    - name: Segment and balance sheet updates
      contains: New segment results, cash and debt, share count, capex and working capital changes.
    - name: Forward estimates table
      contains: Old and new estimates for this year and next year, with the change and the reason.
    - name: Valuation impact
      contains: Prior and updated value from each method, and the price target.
    - name: Estimate change summary
      contains: One paragraph on what changed, why, and whether it matters or is noise.
    - name: Rating and price target
      contains: Whether to keep or change the rating, the new target and the upside or downside.
next: [valuation-method-comparer]
