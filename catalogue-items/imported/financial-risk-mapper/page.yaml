thinking: medium
thinking_why: It lists risks and judges their size.
new_slug: financial-risk-mapper
name: Financial risk mapper
summary: Size the risks to your money in one pass. Get a financial risk assessment with VaR, stress tests and ways to limit each risk.
job: money-and-investing
headline: Financial risk mapper
subhead: A list of the threats to your money, each sized in cost and likelihood, with stress tests and steps to limit them. It turns a vague worry into numbers you can act on.
explain: |
  A list of the threats to your money, each sized in cost and likelihood, with stress tests and steps to limit them. It turns a vague worry into numbers you can act on.

  You say whether you care about portfolio, credit or operational risk and over what time span. The skill works in order: identify, measure, reduce, monitor. For a portfolio it calculates value at risk at 95% and 99% confidence and explains it in plain words. It runs stress cases such as a rate spike or a sector crash. For counterparties it reviews default risk with models like the Altman Z-score. Each risk gets a fix and a way to track it. It is not investment advice.
when:
  - You want to know how much your portfolio could lose in a bad day.
  - A customer or supplier looks shaky and you need to size your exposure.
  - Your lender asks for a risk review.
  - You need stress cases for a board paper.
not_for:
  - "You want a buy or sell call or personal investment advice: talk to a licensed financial adviser."
  - "You want to value a stock or business: use an investment analysis step, not this risk review."
  - "You need to place hedges or trade derivatives: ask a qualified professional and check your own risk limits first."
you_give:
  - Your positions, exposures or counterparties
  - Time horizon
  - Price history or credit ratings (optional)
  - Liquidity figures (optional)
you_get:
  - A ranked risk register
  - VaR at two confidence levels
  - Stress test results
  - Mitigation steps
  - A monitoring plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - "Say which risk you care about: portfolio, credit or operational. Add your time horizon."
  - Paste your positions or counterparties. Add price history or credit ratings if you have them.
  - Ask for the risk dashboard. Code running helps the VaR figures, so use a chat that can run code if you can.
  - Check the top three risks and stress cases against what you know. Treat the hedging ideas as general information and show them to a qualified professional before you act.
output_sample:
  input:
    - Your positions, exposures or counterparties
    - Your time horizon, such as one day or one year
    - Price history or credit ratings (optional)
    - Liquidity figures (optional)
  prerequisites:
    - An AI that can run code, if you want the VaR figures calculated by the skill's script
  output:
    - name: Executive Summary
      contains: Your top three risk exposures and whether you are within or over your risk limits.
    - name: VaR Analysis Table
      contains: Value at Risk at 95% and 99% confidence, explained in plain words.
    - name: Stress Test Results
      contains: Each bad-case scenario, such as a rate spike or sector crash, next to its estimated loss.
    - name: Concentration report
      contains: Where you are too heavily invested in one area.
    - name: Mitigation Plan
      contains: Hedging ideas, diversification steps and how much cash reserve to hold.
