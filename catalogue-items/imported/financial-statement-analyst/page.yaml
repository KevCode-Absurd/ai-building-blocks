thinking: medium
thinking_why: It applies standard methods to your data.
new_slug: financial-statement-analyst
name: Financial statement analyst
summary: Give it your numbers. Get ratio analysis, a valuation, budget variances
  and a rolling forecast.
job: money-and-investing
headline: Financial statement analyst
subhead: Give it your numbers. Get ratio analysis, a valuation, budget variances
  and a rolling forecast. Have your income statement, balance sheet and cash flow
  ready, with the period and currency.
explain: |
  Your numbers read back to you: ratios that show how healthy the business is, a value estimate, how actuals compare with budget and a forecast that rolls forward.

  The skill checks your data first for gaps or odd values. It then computes ratios in five groups: profitability, liquidity, debt, efficiency and valuation. It builds a DCF with WACC and terminal value, and sanity-checks the result against implied multiples. A budget variance table marks each gap as favorable or unfavorable and explains the large ones. A driver-based rolling forecast adds base, bull and bear cases. Summaries state what is material, with a goal of forecasts within 5% on revenue.
when:
  - You want to know whether margins and cash position are healthy.
  - Actual spend differs from budget and you need to explain it.
  - You need a rolling forecast for the next four quarters.
  - You are valuing a business and want a sanity-checked DCF.
you_give:
  - Income statement, balance sheet and cash flow, with the period and currency. Ratios need revenue, cost of goods sold, debt, cash and shares. The valuation needs growth and discount-rate assumptions. Variances need budget lines by department
  - Budget figures (optional)
  - Industry or peer benchmarks (optional)
  - Forecast assumptions (optional)
you_get:
  - Ratio analysis with trends
  - A DCF with a sensitivity table
  - A budget variance report
  - A rolling forecast with scenarios
how_to_use:
  - Use an AI that can run Python 3 and read files, such as Claude Code. Put the whole skill folder in your project, with its scripts and assets folders. The scripts use only the Python standard library.
  - Run each script on the sample file first, to see the format. For example, python scripts/ratio_calculator.py assets/sample_financial_data.json.
  - Make a JSON file with your own numbers in the same shape as the sample, either one flat file per tool or one nested file for all four.
  - Ask your AI to run the ratio calculator, the DCF, the budget variance analyzer and the forecast builder on your file. Check the data warnings first.
  - Read the results. Check the DCF against peer multiples, and run the forecast again after each month's actuals.
  - A valuation depends on its assumptions. Have a qualified adviser review it before any investment decision.
not_for:
  - You need to make a live investment decision. The DCF and forecast are working estimates, so have a qualified adviser review them first.
  - You run an online store and want a 36-month model from ad spend and costs. Use the Store financial model builder.
  - You want a monthly budget against actuals by team. Use the Budget, forecast and cash gap review.
  - You are weighing a private equity deal in India and want IRR tables. Use the Deal return sensitivity modeler.
output_sample:
  input:
    - Your income statement, balance sheet and cash flow statement
    - Budget figures to compare with actuals (optional)
    - Peer or industry benchmarks (optional)
    - Your forecast assumptions (optional)
  prerequisites:
    - An AI that can run Python, to use the bundled calculators
  output:
    - name: Ratio analysis
      contains: Profitability, liquidity, debt, efficiency and valuation ratios, with how to read each trend.
    - name: DCF valuation
      contains: A value estimate from cash flows, with a table that varies the discount and growth rates. The value depends on the assumptions you give.
    - name: Budget variance report
      contains: Each gap marked favorable or unfavorable, with the large ones explained.
    - name: Rolling forecast
      contains: A driver-based forecast with a 13-week cash view and base, bull and bear cases. The 5% revenue accuracy figure is a goal to track, not a promise.
    - name: Executive summary
      contains: A short summary of half a page or less, in plain words. It gives the three to five findings that matter most, the biggest variances and what to check next.
