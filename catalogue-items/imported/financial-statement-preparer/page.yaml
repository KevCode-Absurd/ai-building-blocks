new_slug: financial-statement-preparer
name: Financial statement preparer
summary: Give it a trial balance. Get a balance sheet, income statement and cash
  flow statement.
job: money-and-investing
headline: Financial statement preparer
subhead: A trial balance turns into a balance sheet, an income statement and a
  cash flow statement that agree with each other. That matters at month end,
  when the books must close and the numbers must tie.
explain: |
  A trial balance turns into a balance sheet, an income statement and a cash flow statement that agree with each other. That matters at month end, when the books must close and the numbers must tie.

  It starts by checking that debits equal credits and that every account sits in the right class. Then it asks which reporting framework you use, such as IFRS or GAAP, and whether accruals and deferrals are booked. It maps each account to a statement line, builds the income statement, then the balance sheet, then the cash flow using the indirect method. Last, it confirms net income lands in retained earnings.
when:
  - You are closing the books and need financial statements from a raw trial
    balance.
  - Your trial balance may not balance and you want the errors found first.
  - You need a cash flow statement and do not know how to build one from the
    other two.
  - You must report under IFRS, GAAP or a tax basis and want the right layout.
you_give:
  - Full trial balance
  - Reporting framework (IFRS, GAAP or tax basis)
  - Reporting period
  - List of accruals and deferrals already booked (optional)
  - Recent asset purchases or disposals (optional)
you_get:
  - Income statement
  - Balance sheet
  - Cash flow statement using the indirect method
  - List of balance and classification errors
  - Adjusting entries still needed
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
