thinking_why: It maps accounts into standard statements.
new_slug: financial-statement-preparer
name: Financial statement preparer
summary: Turn a trial balance into a balance sheet, income statement and cash flow statement that tie, and find errors before you close the books.
job: money-and-investing
headline: Financial statement preparer
subhead: A trial balance turns into a balance sheet, an income statement and a cash flow statement that agree with each other. That matters at month end, when the books must close and the numbers must tie.
explain: |
  A trial balance turns into a balance sheet, an income statement and a cash flow statement that agree with each other. That matters at month end, when the books must close and the numbers must tie.

  It starts by checking that debits equal credits and that every account sits in the right class. Then it asks which reporting framework you use, such as IFRS or GAAP, and whether accruals and deferrals are booked. It maps each account to a statement line, builds the income statement, then the balance sheet, then the cash flow using the indirect method. Last, it confirms net income lands in retained earnings.
when:
  - You are closing the books and need financial statements from a raw trial balance.
  - Your trial balance may not balance and you want the errors found first.
  - You need a cash flow statement and do not know how to build one from the other two.
  - You must report under IFRS, GAAP or a tax basis and want the right layout.
not_for:
  - "You need an audit or a qualified accountant's sign-off: ask an accountant, because these statements are unaudited drafts."
  - "You need a tax filing: have a tax professional review it first, since this is not tax advice."
  - "You want to read and judge the results: use financial-analysis, if you have it, or ask your accountant."
you_give:
  - Full trial balance
  - Reporting framework (IFRS, GAAP or tax basis)
  - Reporting period
  - List of accruals and deferrals already booked (optional)
  - Recent asset purchases or disposals (optional)
you_get:
  - Income statement
  - Balance sheet
  - Cash flow statement using the indirect method
  - List of balance and classification errors
  - Adjusting entries still needed
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Paste your full trial balance. A spreadsheet export works well.
  - Tell your AI the reporting framework (IFRS, GAAP or tax basis) and the reporting period.
  - Add any accruals, deferrals, asset purchases or sales you have already booked.
  - Check the error list first. Fix any balance problems, then review the three statements.
  - Give the draft to a qualified accountant before you use it outside your business.
output_sample:
  input:
    - Your full trial balance
    - Your reporting framework (IFRS, GAAP or tax basis)
    - Your reporting period
    - Accruals and deferrals already booked (optional)
    - Recent asset purchases or sales (optional)
  prerequisites:
    - An AI that can run Python if you want it to use the calculation script (optional)
  output:
    - name: Income Statement
      contains: Revenue, cost of goods sold, expenses and net income for the period.
    - name: Balance Sheet
      contains: A snapshot of assets, liabilities and equity, with net income carried into retained earnings.
    - name: Statement of Cash Flows
      contains: Operating, investing and financing activities, built with the indirect method starting from net income.
    - name: Notes to the Statements
      contains: A short note on big changes in line items and anything unusual.
