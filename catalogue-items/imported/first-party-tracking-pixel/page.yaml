thinking: high
thinking_why: It sets up code, data storage and privacy choices that are hard to undo.
new_slug: first-party-tracking-pixel
name: First-party tracking pixel builder
summary: Answer a few questions about your site. Get a tracking script and
  database that keep your visit data in your own hands.
job: track-numbers
headline: First-party tracking pixel builder
subhead: Your site gets its own tracking script, a collector that receives the
  events, and a Postgres database you control. Visit data, page clicks, campaign
  tags and conversions stay in your hands instead of a third party's.
explain: |
  Your site gets its own tracking script, a collector that receives the events, and a Postgres database you control. Visit data, page clicks, campaign tags and conversions stay in your hands instead of a third party's.

  Before building anything, it asks one set of questions: which platforms you already use, where you host, and how you handle consent. It saves your answers to a config file and shows it back for approval. Then it builds the pixel, the endpoint and the tables for raw clickstream, an identity graph and conversion events. It does not replace ad-platform pixels, and it skips mobile apps. You need hosting and a database account.
when:
  - You want to own your analytics data instead of sending it all to GA4.
  - You need campaign tags and click IDs saved with each visit.
  - You want to link anonymous visits to known customers in your own database.
  - You need tracking that respects consent choices.
you_give:
  - Platforms and hosting you already use
  - Your website address
  - Consent and privacy rules you follow
  - Events you want to record
  - Existing analytics tools (optional)
you_get:
  - Tracking script for your site
  - Event collector endpoint
  - Postgres tables for visits, identities and conversions
  - Config file listing your choices
  - Setup steps for your hosting
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code, and use your own hosting and
    Postgres database accounts.
