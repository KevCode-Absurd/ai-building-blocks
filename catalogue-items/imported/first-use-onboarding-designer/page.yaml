thinking: medium
thinking_why: It designs a flow around one early win.
new_slug: first-use-onboarding-designer
name: First-use onboarding designer
summary: Design a first-use onboarding flow around one early win. Give it your product and users. You get fewer setup steps and a habit cue.
job: build-product
headline: First-use onboarding designer
subhead: An onboarding flow built around one early win, so new users feel capable fast and come back the next day. It cuts setup and adds a habit hook.
explain: |
  An onboarding flow built around one early win, so new users feel capable fast and come back the next day. It cuts setup and adds a habit hook.

  You name the first win the person should reach. The skill then trims every field, choice and feature that stands in the way. Next it picks one small action that gives the user a sense of ownership. It ties the product to a cue in their day, such as a morning routine, and reflects their progress back so they see themselves as someone who uses it well. A readiness check changes the path: new users get a shorter route, experienced users get depth sooner.
when:
  - People sign up but never come back after the first session.
  - Your setup asks for too much before showing any benefit.
  - You want a habit loop built into the first week of use.
  - You need onboarding paths for beginners and experienced users.
not_for:
  - "You want to win back users who already left: use a lifecycle email series or ask a person on your team who owns retention."
  - "You are fixing a pricing page or checkout: use a pricing page review or a simple A/B test instead."
  - "You have no clear first win yet: talk to five users first, then come back with what they say they wanted."
you_give:
  - What your product does
  - Who your users are and what they want
  - The first win you want them to reach
  - Time and platform limits (optional)
you_get:
  - Onboarding flow with a reason for each step
  - First-win definition
  - Habit cue and return trigger
  - Different paths by user readiness
  - List of setup steps to cut
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed. The skill names three skills to run first and three to run after. They are optional. Instead of them, tell your AI who your customer is, what job they hire the product for, and what would persuade them without pressure.
  - Describe your product and who uses it.
  - Say what the first win should be. If you are not sure, your AI will ask.
  - Add time or platform limits (optional).
  - Read the flow. Check that each step leads to the first win and that the cut list matches what you can remove.
  - Take the first-win definition into your product plan, then test the flow with about five new users. Watch where they stall.
  - The research names inside the skill text are the author's background and are not checked. Do not quote them as proof.
output_sample:
  input:
    - What your product does
    - Who your users are and what they want
    - The first win you want them to reach
    - Time and platform limits (optional)
  output:
    - name: First-win definition
      contains: The smallest success that proves your product has value, in one clear line.
    - name: Onboarding flow
      contains: Each step in order, with the reason it is there.
    - name: Cut list
      contains: Setup fields, choices and feature tours to remove before the first win.
    - name: Ownership action
      contains: One small task the user does themselves, so they feel invested.
    - name: Habit cue and return trigger
      contains: A link to a routine in the user's day, and a prompt to come back.
    - name: Readiness paths
      contains: A shorter route for new users and a deeper route for experienced users.
    - name: Quality check
      contains: A check that the flow is clear, helpful and not pushy.
