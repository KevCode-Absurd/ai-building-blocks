thinking: high
thinking_why: It must tell real progress from repeated guesses.
new_slug: fix-loop-breaker
name: Fix loop breaker
summary: Stop your AI from patching the same bug over and over. Get a three-try repair plan, proof the fix works and a tested way to undo it.
job: test-and-fix-code
headline: Fix loop breaker
subhead: When your AI keeps patching the same bug and nothing changes, this gives it a strict way to stop guessing. You get a repair with proof that it worked and a tested way back.
explain: |
  When your AI keeps patching the same bug and nothing changes, this gives it a strict way to stop guessing. You get a repair with proof that it worked and a tested way back.

  Before any edit, it records the bug, the exact command that shows it, and how to undo the change. Then it allows three attempts only. Each attempt needs a single cause, a prediction, the changed files, a quick check and a check on the real path, such as the deployed app. A fix counts only if the check can also fail on a known bad state. If the bug cannot be reproduced, it stops and says so.
when:
  - Your AI agent keeps trying similar patches and the same error comes back.
  - A small test passes but the live app still fails.
  - You need proof that a fix works, not only a claim.
  - You want a rollback that has been tested before you trust a change.
not_for:
  - "You have a one-shot edit and one check already covers the whole behavior: make the edit and run that check, no extra steps needed."
  - "You cannot reproduce the bug at all: first get a command or steps that show it fail, or ask a developer to help, before any repair."
  - "You only want to find the cause and not change code: ask your AI to investigate and report, or ask a developer to review the logs."
you_give:
  - Description of the bug
  - Command or steps that show the failure
  - Repo or project access
  - Rollback method (optional)
you_get:
  - Repair contract with baseline result
  - Log of up to three attempts with evidence
  - Check that fails on bad state and passes on the fix
  - Tested rollback
  - "Final status: PROVEN, INCONCLUSIVE or BLOCKED"
how_to_use:
  - Open your AI in a tool that can run code and read your project files, such as Claude Code, Codex CLI, Cursor or Gemini CLI.
  - Paste the skill into the chat, or add its folder to your project.
  - Describe the bug and paste the command or steps that show the failure.
  - Tell your AI to follow the skill and stop after three attempts. The skill's scripts/fingerprint.py helper is optional.
  - Check the final status. Only trust the fix if it says PROVEN and lists the checks it ran. INCONCLUSIVE means a decisive check is missing. BLOCKED means the three tries are used up.
  - Confirm before it changes anything in a live or production setup.
  - After PROVEN, keep the cleaned evidence records and the tested undo command with the change. After BLOCKED, get the missing observation, such as a log or steps that show the failure, then start again.
  - To find the cause first, use the bug root cause finder.
output_sample:
  input:
    - A short description of the bug
    - The command or steps that show the failure
    - Access to your project files
    - How to undo the change (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - A copy of the project you can safely test on
  output:
    - name: Repair contract
      contains: The exact bug, the command that shows it, the starting result and the way to undo the change.
    - name: Attempt log
      contains: Up to three attempts, each with one cause, a prediction, changed files and the check results.
    - name: Failure fingerprint
      contains: A stable record of what the system did, used to spot when the same failure keeps coming back.
    - name: Real-path check
      contains: Proof the fix works where it matters, such as the live app, not only in a small test.
    - name: Negative control
      contains: A run on a copy with the bug put back, showing the check can fail.
    - name: Rollback test
      contains: Proof the undo steps restore the old behavior on a separate copy.
    - name: Final status
      contains: "One verdict: proven, inconclusive or blocked, with commands, results and gaps left."
