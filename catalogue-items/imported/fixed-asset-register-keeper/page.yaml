thinking: medium
thinking_why: It follows standard asset rules with some judgment.
new_slug: fixed-asset-register-keeper
name: Fixed asset register keeper
summary: Decide what to capitalise, build a yearly depreciation schedule and check impairment for your fixed asset register, with journal entries for each asset.
job: money-and-investing
headline: Fixed asset register keeper
subhead: Give it your purchases, disposals and your own depreciation rules. It rules on what to capitalise, builds the yearly schedule and checks for impairment. The rules follow IFRS (IAS 16 and IAS 36) and US GAAP (ASC 360), so tell it which one you use. Have a qualified accountant check the result.
explain: |
  A fixed asset register that stays accurate, with clear rulings on what to capitalise, how much to depreciate each year and when an asset has lost value.

  For each purchase, it decides which costs go on the balance sheet, such as price, delivery and set-up. Training and repairs are expensed. It builds the depreciation schedule from your rules for life and scrap value. Big parts like engines or roofs are depreciated on their own where needed. It tests for impairment when warning signs show up, works out the gain or loss on disposals, and writes the journal entries. Last, it rolls the register forward so it ties to the ledger.
when:
  - You bought equipment and are unsure whether to capitalise or expense it.
  - You need a yearly depreciation schedule for a set of assets.
  - An asset is idle or damaged and you suspect it has lost value.
  - You sold or scrapped an asset and need the gain or loss and the entries.
not_for:
  - "You need tax depreciation or the book-versus-tax gap: use your tax adviser, as this skill covers book accounting only."
  - "You need to account for a lease or a right-of-use asset: use a lease accountant or a lease accounting tool, as this page does not cover leases."
  - "You want a final ruling with no review: ask a qualified accountant to check it against your framework and local tax rules."
you_give:
  - Your list of purchases or disposals, with costs and dates
  - Your capitalisation threshold and useful life rules
  - Your residual value and depreciation method (optional)
  - Your opening register balances (optional)
you_get:
  - A capitalise or expense ruling for each item, with reasons
  - A yearly depreciation schedule
  - An impairment check for assets with warning signs
  - Journal entries for each ruling
  - A register rollforward that ties to the ledger
how_to_use:
  - Use an AI that can run Python and read files, such as Claude Code, and give it the whole skill folder. It needs scripts/calculate.py for the depreciation and gain or loss sums and references/useful-life-guide.md for typical lives. In a plain chat, paste the skill text and tell your AI to write and run its own Python for those sums.
  - Say which framework you use, IFRS or US GAAP, and paste your purchases or disposals with costs and dates.
  - Paste your capitalisation threshold, useful lives and residual value rules. Add opening balances if you have them.
  - Check each ruling and the rollforward against your ledger before you book anything.
  - Treat the result as a starting point. Ask a qualified accountant to check it against your framework and local tax rules.
  - Then book the entries with the journal entry preparer, and check deferred tax with the deferred tax calculator.
output_sample:
  input:
    - Your list of purchases or disposals, with costs and dates
    - Your capitalisation threshold and useful life rules
    - Your residual value and depreciation method (optional)
    - Your opening register balances (optional)
  prerequisites:
    - An AI that can run code, to work out the depreciation and gain or loss figures
  output:
    - name: Conclusion
      contains: The capitalise or expense ruling, or the disposal or impairment outcome, with the standard it follows.
    - name: Computation
      contains: The depreciation schedule, or the gain or loss on disposal, or the impairment working.
    - name: Entries
      contains: Full journal entries for each ruling, ready for your accountant to review.
    - name: Register Impact
      contains: How the register rollforward moves, so closing balances tie to the ledger control accounts.
terms:
  - term: CIP
    meaning: Construction in progress. The cost of an asset you are still building, not yet in use and not yet depreciated.
  - term: ARO
    meaning: Asset retirement obligation. What you must pay later to remove or restore an asset, added to the asset's cost today.
  - term: IAS 23
    meaning: The IFRS rule that lets you add borrowing costs to the cost of an asset that takes a long time to build.
