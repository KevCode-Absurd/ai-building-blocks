thinking: medium
thinking_why: It sorts the cause by a set list, then fixes it.
new_slug: flaky-test-fixer
name: Flaky test fixer
summary: Find why your Playwright test is flaky and get it fixed. Give it a failing test and it finds the cause, fixes it and proves it stays stable.
job: test-and-fix-code
headline: Flaky test fixer
subhead: A failing or flaky Playwright test gets its cause found and fixed, instead of being retried until it passes. You end with a test you can trust in CI.
explain: |
  A failing or flaky Playwright test gets its cause found and fixed, instead of being retried until it passes. You end with a test you can trust in CI.

  It reruns the test to see the error. If it passes, it runs it many times, then in parallel, to force the flake out. It records a trace and sorts the failure into one of four groups: timing, test isolation, environment, or infrastructure. Each group has its own check, such as running the test alone to see whether other tests interfere. Then it applies the matching fix and runs the burn-in again to prove the test is stable.
when:
  - A test passes on your machine but fails in CI.
  - A test fails now and then with no code change.
  - A test only fails when the whole suite runs.
  - You are tempted to add retries and want the real fix instead.
not_for:
  - "Your test fails every time because of a real bug in your app: fix the app code first, or ask a developer."
  - "You use unit tests or another test tool, not Playwright: use your own test runner's debug output, or ask a developer."
  - "You only want the test to go green fast: this skill fixes the cause, so for a quick stopgap add a retry in your CI settings."
you_give:
  - Test file path, test name or a description of the failure
  - Access to your Playwright project
  - CI logs or traces (optional)
you_get:
  - Reproduction of the failure
  - Cause sorted into one of four types
  - Fix applied to the test
  - Repeat-run results showing it is stable
how_to_use:
  - Use an AI that can run commands and read your project, such as Claude Code. Put the whole skill folder in your project, so it can read flaky-taxonomy.md. A chat window cannot run Playwright.
  - Tell your AI the test file path, the test name, or what goes wrong. Say "Follow the flaky test fixer skill." Add CI logs or traces if you have them.
  - Let it rerun the test, repeat it, and record a trace. Ask it to name the cause before it edits anything.
  - Check the diff. A retry is a last resort, added only after the cause is found and only for infrastructure problems. A fix that only adds retries is not a fix.
  - When the test passes 10 of 10 runs, commit the fix with the trace as evidence and run the full suite in CI. If the flake comes back, send the new trace and run the skill again.
output_sample:
  input:
    - Your test file path, test name or a short description of the failure
    - Access to your Playwright project
    - Your CI logs or traces (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Playwright already set up in your project
  output:
    - name: Root cause
      contains: "The cause sorted into one of four groups: timing, test isolation, environment or infrastructure, with the specific issue named."
    - name: Fix applied
      contains: The change made to the test, shown as a diff.
    - name: Verification result
      contains: The result of repeat runs of the test, to show whether it is now stable.
    - name: Prevention recommendation
      contains: Suggested config and habits to stop the same flake coming back, such as tracing on first retry.
next: [fix-loop-breaker, bug-root-cause-finder]
