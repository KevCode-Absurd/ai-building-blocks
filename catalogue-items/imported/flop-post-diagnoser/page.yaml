thinking: medium
thinking_why: It sorts the failure type first, then picks the fix.
new_slug: flop-post-diagnoser
name: Flop post diagnoser
summary: Find out why your X or LinkedIn post flopped. Paste the post and its numbers to learn if it was unseen, skipped or ignored, and get one fix.
job: grow-social
headline: Flop post diagnoser
subhead: A clear answer on why one X or LinkedIn post did badly, and what to change next time. It separates the three ways a post fails, because each needs a different fix.
explain: |
  A clear answer on why one X or LinkedIn post did badly, and what to change next time. It separates the three ways a post fails, because each needs a different fix.

  You paste the post with its impressions, likes, comments and reposts. If a post was barely shown, rewriting the hook will not help, so it checks timing, gaps since your last post, links and falling reach. If it was seen but not clicked, it reviews the first line. If people read it but did not react, it looks at the point and the ask. Without impressions it tells you it cannot diagnose and offers only a read-through of the writing.
when:
  - A post you were proud of got almost no reaction.
  - You do not know if people never saw it or just ignored it.
  - You are about to rewrite a post and want to know what to fix.
  - You want one specific post reviewed, not your whole account.
not_for:
  - "You want your whole account reviewed: ask a person who knows social media, or look at your platform's own analytics."
  - "You cannot get impressions for the post: the skill can only read the writing, so ask a friend for honest feedback instead."
  - "You want a new post written from scratch: write the draft yourself or ask your AI for a plain first draft."
you_give:
  - Post text
  - Impressions, likes, comments and reposts
  - Platform (X or LinkedIn)
  - What you normally get on a post (optional)
you_get:
  - "Verdict: not seen, skipped or ignored"
  - Evidence from your numbers
  - Specific changes to try
  - Honest note when numbers are missing
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - Paste your post text. Add its impressions, likes or reactions, comments and reposts.
  - Say which platform it was on. Say what a normal post gets for you, if you know.
  - Read the failure type first. Check the evidence matches your numbers.
  - Try the one change on your next post. Do not rewrite the old post unless the verdict says the writing was the issue.
output_sample:
  input:
    - Your post text
    - Its impressions, likes or reactions, comments and reposts
    - The platform, X or LinkedIn
    - What a normal post of yours gets (optional)
  output:
    - name: Failure type
      contains: Whether the post was barely shown, seen and skipped, or read but not acted on.
    - name: Evidence
      contains: The numbers you gave, set against what you say is normal for your account.
    - name: What this rules out
      contains: The parts that are fine, such as a hook that did not need a rewrite.
    - name: Writing check
      contains: A look at the first line, buried detail and the ask, only when people saw the post and scrolled.
    - name: Variance note
      contains: An honest line if the post may simply have had a bad day.
    - name: One change
      contains: A single thing to do differently next time and whether it will matter a lot or a little.
