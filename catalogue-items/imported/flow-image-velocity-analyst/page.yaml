thinking: medium
thinking_why: It follows a set method but needs care when it rejects bad vectors.
new_slug: flow-image-velocity-analyst
name: Flow image velocity analyst
summary: Turn pairs of flow images into velocity maps. Bad vectors are found and fixed, then you get vorticity and turbulence numbers. Needs Python.
job: research-topics
headline: Flow image velocity analyst
subhead: Pairs of flow images become velocity fields, with bad vectors found and fixed and vorticity and turbulence numbers worked out. It turns particle photos into measured fluid motion.
explain: |
  Pairs of flow images become velocity fields, with bad vectors found and fixed and vorticity and turbulence numbers worked out. It turns particle photos into measured fluid motion.

  Using the OpenPIV Python package, it prepares the images, runs cross-correlation over small windows and checks each vector for signal quality. It flags outliers, replaces them, smooths the field and converts pixels to real units using your scale and time gap. Then it derives vorticity, strain rate and turbulence statistics. It also helps you tune window size and overlap. It measures flow; it does not simulate it. You need Python.
when:
  - You have laser or camera images of a flow and need velocity maps.
  - Your vector field has spurious arrows and you need them cleaned.
  - You need vorticity or turbulence statistics from experiment data.
  - You are choosing window sizes for your image pairs.
not_for:
  - "You want to simulate flow, not measure it: use a CFD tool or a CFD specialist instead."
  - "You have no Python, or your AI cannot run code: ask a lab colleague to run the analysis, or use a ready PIV program."
  - "You have a single image, not a pair taken a known time apart: take a second frame first, because the method needs two."
you_give:
  - Image pairs
  - Time gap between frames
  - Pixel to millimetre scale
  - Flow type or expected speed (optional)
you_get:
  - Velocity field
  - Flagged and replaced bad vectors
  - Vorticity and strain rate
  - Turbulence statistics: mean and spread of the speeds (u_mean, v_mean, rms_u, rms_v, tke). Here tke is spatial variance of one frame, not full turbulent kinetic energy
  - Plots and a parameter log
how_to_use:
  - Install the openpiv package in Python with uv pip install openpiv. Your AI must be able to run code and save files.
  - Paste the skill into your AI chat, or upload the skill folder if your tool takes files.
  - Add your image pairs, the time gap between frames and the pixel to millimetre scale.
  - Ask your AI to run the analysis and show vector_field.png. Check that the arrows look right before you trust the numbers.
  - If you see stray arrows, ask your AI to change the window size or overlap and run it again.
  - Next, plot or compare vectors.txt and params.npz in your own tools, or against your CFD results. If the vector field is sparse, run it again with a different window size or overlap. To plan a simulation to compare with, use the fluid flow simulation planner.
output_sample:
  input:
    - Your pairs of flow images (frame A and frame B)
    - The time gap between the two frames
    - The scale, in pixels per millimetre
    - The flow type or expected speed (optional)
  prerequisites:
    - An AI that can run Python code and save files
    - Python 3.10 or newer with the openpiv package installed
  output:
    - name: vectors.txt
      contains: A tab-separated table of position, velocity, a flag for bad vectors and a mask value for each point.
    - name: params.npz
      contains: The full velocity field, signal quality, window settings, scale, time gap and the OpenPIV version used.
    - name: vector_field.png
      contains: The velocity arrows drawn over your first image, so you can check the field by eye.
    - name: Vorticity and strain rate
      contains: Spin and stretch values worked out from the cleaned velocity field.
    - name: Turbulence statistics
      contains: Averages and fluctuation measures worked out from the measured velocities.
