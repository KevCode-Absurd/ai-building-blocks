thinking: low
thinking_why: It only changes how answers are shaped.
new_slug: focus-friendly-answers
name: Focus-friendly answer style setter
summary: Set up focus-friendly answers once. Your AI then gives the next action first, short numbered steps and time estimates in every reply.
job: set-up-ai
headline: Focus-friendly answer style setter
subhead: Every reply from your AI starts with the next thing to do, then numbered steps with time estimates. It is written for readers who lose track in long answers, such as people with ADHD.
explain: |
  Every reply from your AI starts with the next thing to do, then numbered steps with time estimates. It is written for readers who lose track in long answers, such as people with ADHD.

  Once switched on, it stays on for the whole session until you say normal mode. The first line is always an action or a command. Multi-step work becomes short numbered steps, one action each, with the fewest steps that still work. It repeats where you are so you do not hold state in your head, gives real time estimates instead of vague ones, cuts tangents, and shows small wins as they happen.
when:
  - Long AI answers make you lose your place or give up.
  - You freeze on where to start a task.
  - You want time estimates you can plan around.
  - You want to see progress as you work through a list.
not_for:
  - 'You want a long, full explanation of a topic: say "explain" or "walk me through" in your request, or switch to normal mode.'
  - "You need a formal report or a polished document: turn the style off and ask your AI in its normal style."
  - "You want your AI to change its tools, settings or what it can do: this only changes how replies are written."
you_give:
  - Your usual request or task
  - A trigger to switch the style on
  - A phrase to turn it off (optional)
you_get:
  - Next action as the first line
  - Numbered steps with one action each
  - Time estimate for each step
  - Recap of where you are
  - Visible progress markers
how_to_use:
  - Open a new chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the full skill text into the chat as your first message.
  - "Type \"turn on /i-have-adhd mode\" (the slash form only works in tools that support custom commands), then your request. For example: Summarize the plan as numbered next actions with time estimates."
  - Do the first numbered step. Then reply with the result or say done, and your AI gives the next step.
  - To turn it off, type "stop adhd mode" or "normal mode". Your AI confirms in one line.
  - If your AI forgets the style in a long chat, paste the skill text again.
output_sample:
  input:
    - Your usual request or task
    - "The trigger to switch the style on: /i-have-adhd"
    - 'A phrase to turn it off: "stop adhd mode" or "normal mode" (optional)'
  output:
    - name: Next action first
      contains: The first line of each reply is something you can do now, such as a command or a file to open.
    - name: Numbered steps
      contains: Multi-step work comes as the fewest steps that work, with one action in each step.
    - name: Time estimates
      contains: Each piece of work gets a real time guess, not a vague one like "some work".
    - name: Where you are
      contains: Each reply restates which step you are on and what comes next, so you do not have to remember.
    - name: Visible wins
      contains: What now works is shown in plain terms, with a way to try it.
    - name: One next action
      contains: If anything is left open, the reply ends with one thing you can do in under two minutes.
