thinking: low
thinking_why: Sorting files follows simple, repeatable rules.
new_slug: folder-tidier
name: Folder tidier
summary: Tidy a messy folder with a clear plan. Your AI finds duplicate files and lists every move first. Nothing changes until you say yes.
job: organise-work
headline: Folder tidier
subhead: Point it at a messy folder. Get a clean folder plan and the duplicates it found. Files move only when you say yes. Back the folder up first.
explain: |
  A messy folder becomes a clear plan for how it should be organised, with duplicates listed. Nothing moves until you approve it.

  It first asks which folder, what annoys you most, and what to leave alone. Then it scans file types, dates and names, finds exact duplicates, and spots old files you may not need. It suggests a folder structure that fits what you actually have, plus a naming pattern. You see the full list of planned moves and renames. After you say yes, it carries them out and gives a summary. You can choose a light tidy or a full clean-up.

  This is a renamed copy of the community file-organizer skill, with a backup step and a move log added. It has no code-project rules, so do not use it on a live code project.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. Credit goes to the original authors.
when:
  - Your Downloads folder is full of files you cannot find.
  - You suspect many duplicates are taking up space.
  - You are archiving old projects and want them sorted first.
  - You are starting a new project and want a clean structure.
not_for:
  - "You only need to find one file: use your computer's search or a file-search app instead."
  - "You want to tidy shared, work server or system folders: ask the person who owns them, or tidy a copy first."
  - "You want a backup of your files: use a backup tool first, then tidy."
you_give:
  - Folder to tidy
  - Main problem (finding files, duplicates, no structure)
  - Files and folders to leave alone
  - "How far to go: light or full clean-up"
you_get:
  - Summary of what is in the folder
  - List of duplicate files
  - Proposed folder structure and naming rules
  - Move plan to approve
  - Report after the changes
how_to_use:
  - Open an AI that can read and move files on your computer. Or paste the skill into a chat to get the plan only.
  - Say which folder to tidy, what annoys you most, and what to leave alone.
  - Back up the folder first, or work on a copy. Moves are not undone for you.
  - Tell it to show the plan first and not delete anything.
  - Read the duplicate list and the planned moves. Ask for changes until you are happy.
  - Say yes to start the moves. Deleting needs its own separate yes.
  - The skill writes each move to a log file in the folder, as old path and new path. If something lands in the wrong place, use the log to move it back by hand.
  - Check the summary at the end, then keep up the habits it suggests. Pair the tidy with a backup tool, and set a monthly reminder to run the maintenance habits.
output_sample:
  input:
    - The folder you want to tidy
    - Your main problem, such as can't find files or duplicates
    - Files and folders to leave alone (optional)
    - "How far to go: light tidy or full clean-up"
  prerequisites:
    - An AI that can read your files and run commands on your computer, to do the moves. In a plain chat it can only write the plan.
  output:
    - name: Current state summary
      contains: How many files and folders you have, the file types, sizes, date ranges and the main problems.
    - name: Duplicate list
      contains: Each set of matching files with paths, sizes and dates, and which one to keep.
    - name: Organization plan
      contains: The proposed folder tree, the planned moves and renames, and any files that need your decision.
    - name: Approval check
      contains: A yes, no or modify question. Nothing moves and nothing is deleted before you answer.
    - name: Completion summary
      contains: The new folder tree, what changed, and the space freed by removing duplicates.
    - name: Maintenance tips
      contains: Weekly, monthly and yearly habits to keep the folder tidy, with a few commands for your setup.
