thinking: low
thinking_why: It reacts to one short answer.
new_slug: follow-up-question-writer
name: Follow-up question writer
summary: Give it what a student just said. Get follow-up questions that push their thinking further, with the exact words to say and when to use each.
job: teach-and-train
headline: Follow-up question writer
subhead: Give it what a student just said. Get follow-up moves that push their thinking further. Bring what the student said. Use the result to plan your next step.
explain: |
  After a student says something half right or surprising, you get follow-up questions that push their thinking further, so you are not stuck saying "good, anyone else?".

  You give the student's exact words, what you want the class to understand and the topic. The skill offers a few moves drawn from research on classroom talk: asking them to say more, to give evidence, to build on a classmate's idea, to disagree respectfully, or to connect it to the lesson goal. Each comes with the exact words to say and a note on when to use it. Level and confidence of the student shape how they are phrased.

  Licence: CC BY-SA 4.0, as the LICENSE file says. Credit Gareth Manning if you reuse it, and share any changes under the same licence.
when:
  - A student gives a thin answer and you want to draw out more.
  - A student says something wrong in an interesting way and you want to use it.
  - You want the class to build on each other's ideas.
  - You run discussion lessons and want better questions ready.
not_for:
  - "You need a whole lesson plan: plan the lesson yourself first, then come back with a student answer you want to explore."
  - "The student's answer is simply wrong and needs reteaching: use a simple check-for-understanding question, then teach the idea again."
  - "You want to mark or grade written work: give feedback on the work itself, not a spoken follow-up."
you_give:
  - What the student said
  - What you want students to understand
  - Subject and topic
  - Age group and student confidence (optional)
you_get:
  - Several follow-up questions in your voice
  - Why each move works
  - When to use each one
  - Prompt for the whole class to join in
how_to_use:
  - Before you start, gather the student's exact words, what you want students to understand, and the subject, topic and year group.
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text, then paste your details.
  - Read the moves. Pick one that fits your class and rewrite it in your own voice. They are drafts.
  - Try the move in your lesson. Then use the Move Selection Guide to plan the next question.
output_sample:
  input:
    - What the student said, in their exact words
    - What you want students to understand
    - Subject and topic
    - Age group and how confident the student is (optional)
    - "Your view of the answer: right, partly right, wrong, unclear or thin (optional)"
  output:
    - name: Recommended Moves
      contains: Three to five follow-up moves, each with a type label, the exact words to say and why it works.
    - name: Move Selection Guide
      contains: When to pick each move, based on your goal, the student and the stage of the lesson.
    - name: Moves to Avoid Here
      contains: Common responses that would shut the talk down or miss the point in this case.
