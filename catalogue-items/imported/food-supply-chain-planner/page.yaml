thinking: medium
thinking_why: Food safety and freshness limits shape every step.
new_slug: food-supply-chain-planner
name: Food supply chain planner
summary: Plan shelf life, safe handling, tracing and cold storage for your food or drink business. Give it your products and sales channels to get a ranked plan.
job: plan-supply-chain
headline: Food supply chain planner
subhead: A supply chain plan for a food or drink business that covers shelf life, safe handling, traceability and cold storage. It aims to cut waste while keeping to food safety rules.
explain: |
  A supply chain plan for a food or drink business that covers shelf life, safe handling, traceability and cold storage. It aims to cut waste while keeping to food safety rules.

  First it asks about your products, how fast they spoil, temperature needs, and how you sell, whether to shops, restaurants or online. It checks rules and certifications such as FSMA, HACCP and allergen control. Then it plans stock rotation, cold chain steps, recall tracing depth and how to handle demand peaks and promotions. You get a plan that shows where spoilage and delays happen and what to change first.
when:
  - Too much of your stock spoils before it sells.
  - You need a recall tracing process that works in hours.
  - You are adding cold storage or a new distribution centre.
  - A retailer is asking for certifications and you need a plan.
not_for:
  - "You need a food safety audit or legal sign-off: use a certified food safety consultant or your regulator."
  - "You want to decide how much stock each shop gets: this plan does not cover that, so ask your retail or planning lead."
  - "You run a non-food supply chain with no spoilage or safety rules: use a general supply chain review with your logistics team."
you_give:
  - Product list and shelf life
  - Temperature needs
  - Sales channels
  - Certifications or rules you must meet
  - Current waste levels (optional)
you_get:
  - Shelf-life and rotation plan
  - Cold chain checkpoints
  - Traceability setup
  - Waste reduction steps
  - Priority list of changes
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. It needs no code, files or paid tools.
  - Answer the questions about your products, shelf life, temperatures, sales channels and rules. Skip what you do not know.
  - Read the plan. Check each limit and shelf-life figure against FDA, FSMA, GFSI or your retailer's own specification. The percentages and temperatures in the skill are typical figures, not your rules.
  - You can ignore the Python blocks in the skill. They are reference code and are not needed in a chat.
  - Start with the top items on the ranked change list.
  - Take the top three changes to your weekly stock and cold-chain review. Plan promotion stock with the promotion and stock planner, and use the expiry date stock manager for markdown timing.
  - Have a certified food safety consultant or your regulator review the plan before you rely on it for compliance.
output_sample:
  input:
    - Your product list with shelf life and temperature needs
    - Your sales channels, such as shops, restaurants or online
    - Certifications or rules you must meet
    - Your current waste levels (optional)
  output:
    - name: Executive Summary
      contains: Your product groups, key supply chain measures, food safety status and the main changes planned.
    - name: Freshness & Waste Metrics
      contains: A table by product group of shelf life, days of stock, waste, near-expiry value and first-expired-first-out use.
    - name: Supply Chain Performance
      contains: On-time, in-full delivery, stock turns, waste rate, fill rate and cold chain checks against your targets.
    - name: Food Safety Status
      contains: Hazard plan status, mock recall time, supplier audits, certifications and inspection results.
    - name: Promotional Performance
      contains: Promotions by month with forecast accuracy, stockouts and excess stock.
    - name: Action Items
      contains: A ranked list of changes to make first, such as cutting waste or fixing cold chain gaps.
