thinking: medium
thinking_why: It follows strict style rules while it writes.
new_slug: forceful-prose-writer
name: Forceful prose writer
summary: Give it a topic or a draft. Get forceful prose writing with strong verbs, no filler and none of the usual AI habits.
job: write-and-tell-stories
headline: Forceful prose writer
subhead: "Clean, concrete writing with no filler and none of the usual AI habits: no friendly assistant tone, no empty openers, no stock phrases. Use it for essays and rewrites that need weight."
explain: |
  Clean, concrete writing with no filler and none of the usual AI habits: no friendly assistant tone, no empty openers, no stock phrases. Use it for essays and rewrites that need weight.

  You start a request with a short line to switch it on. Then you can set the register, such as literary, journalistic or cold, plus density, how sharp the voice is and length. The skill treats its style rules as a contract and counts breaking them as a failure. It favours strong verbs and images over adjectives, avoids sales rhythm, and returns only the prose with no comment on itself.
when:
  - Your draft reads like a chatbot wrote it.
  - You want an essay with a firm, confident voice.
  - You need a rewrite that cuts filler and keeps the point.
  - You want to try the same piece in a cooler or hotter tone.
not_for:
  - "You need a factual report or content that cites sources: ask a human editor or a research tool, since this skill does not check facts."
  - "You want a warm, friendly or chatty tone: write it yourself or ask your AI for a plain, casual draft."
  - "You need your own brand voice: run a separate edit pass after, or share a sample of your voice with your AI."
you_give:
  - Topic or draft
  - Register (literary, journalistic, cold)
  - Density, heat and length settings (optional)
you_get:
  - Finished prose, nothing else
  - Concrete wording with strong verbs
  - Version in the voice you picked
  - Rewrite that removes stock phrases
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - "Paste the skill text first. Then start your request with the line: Apply the Beautiful Prose skill. Beautiful Prose is this skill's original name, and the skill text expects that exact line."
  - "On the next lines, add your settings if you want them, such as REGISTER: cold_steel or LENGTH: short."
  - Add your topic, or paste your draft. Say who it is for and how long it should be.
  - Read the result. Check facts and names yourself, because the skill does not verify claims. Anglo-Saxon words are short, plain ones like "burn" or "hard". Latinate words are longer, like "combustion" or "difficult". The skill prefers the short ones.
  - Run a separate edit pass if the piece must match your brand voice, with the brand voice rewriter. Run the claim fact-checker over anything that states facts.
output_sample:
  input:
    - Your topic, or a draft to rewrite
    - "The register you want: founding_fathers, literary_modern, cold_steel or journalistic (optional)"
    - "Density: lean, standard or dense (optional)"
    - "Heat: cool, warm or hot (optional)"
    - "Length: micro, short, medium or long (optional)"
  output:
    - name: Prose
      contains: Plain text writing in the register you chose, with no headings or bullets unless you asked for them.
    - name: No commentary
      contains: The skill adds no notes, no thanks and no talk about the piece, so you get the writing only.
next: [brand-voice-rewriter, claim-fact-checker]
