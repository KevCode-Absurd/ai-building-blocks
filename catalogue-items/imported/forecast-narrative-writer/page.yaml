thinking: medium
thinking_why: It summarizes deal data into a clear story.
new_slug: forecast-narrative-writer
name: Forecast narrative writer
summary: "Turn your CRM pipeline into a forecast narrative for your review or 1:1: commit, best case, pipeline, what changed and where the risk is."
job: sell-and-negotiate
headline: Forecast narrative writer
subhead: "A forecast story you can say out loud in a review or 1:1: the number, the deals behind it, what changed since last week and where the risk sits."
explain: |
  A forecast story you can say out loud in a review or 1:1: the number, the deals behind it, what changed since last week and where the risk sits. It is split into commit, best case and pipeline.

  It connects to your CRM or reads an uploaded pipeline export. It maps stages to the three buckets, using the CRM's forecast field if one exists, and pulls open deals closing in the period. Each deal named links to its record. It compares with last week's notes if you paste them, so changes stand out. Missing data is marked as blank, not guessed. Scope stays on your own deals unless you say otherwise.
when:
  - You have a forecast call tomorrow and need your talking points.
  - Your manager asks what moved since last week.
  - You need a quick view of which deals are at risk.
  - You want to pitch commit and best case with deal names behind each.
not_for:
  - "You need to lock the number into your company's forecasting tool: submit it there, this only writes the story and keeps categories honest."
  - "You want to know what happens to the number if one deal slips: ask a teammate who owns the forecast, or review the whole pipeline with the Sales pipeline deal priority reviewer."
  - "You have no CRM access and no pipeline export: pull a deal list from your CRM first, then come back."
you_give:
  - CRM access or a pipeline export
  - Period, such as this quarter
  - Last week's narrative (optional)
  - Rep or team scope (optional)
you_get:
  - Closed won, commit, best case and pipeline totals with deal counts
  - A one-line note for each commit and best case deal, linked to its record
  - What changed since last time, if you share last week's notes
  - Risk to commit, with the deal, the risk and a way to reduce it
  - The asks to bring to your manager or leader
  - Suggested forecast category changes you can accept or skip
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill's instructions.
  - Connect your CRM if your AI allows it. If not, upload your pipeline export as a file.
  - Say the period and who it covers, such as "my forecast for this quarter".
  - Paste last week's narrative if you have it, so the changes section can show what moved.
  - Check the deal lines and risks against your own view before the call.
  - Say yes to any category changes you want. Without CRM write access, you get a checklist to apply yourself.
  - Send the commit list to your manager before the call. Keep this week's narrative to paste in next week.
output_sample:
  input:
    - Your CRM connection or a pipeline export file
    - The period, such as this quarter
    - Last week's narrative (optional)
    - The rep or team to cover (optional)
  prerequisites:
    - An AI that can read your CRM, or a pipeline export you can upload or paste
  output:
    - name: Number table
      contains: Closed won, commit, best case and pipeline, each with amount and deal count, with the commit total in bold.
    - name: Changes since last time
      contains: Deals that moved up, slipped, were won or lost, or a note that there was no earlier snapshot.
    - name: Commit and best case deals
      contains: One line per deal on where it stands, what is needed to close and any risk, each linked to its record.
    - name: Risk to commit
      contains: Each deal at risk, the specific risk and a way to reduce it.
    - name: Asks
      contains: Help you need from leaders, such as exec support, resourcing or unblocking a deal.
    - name: Category changes (optional)
      contains: Before and after forecast categories for deals that should move, with the evidence for each.
next: [weekly-sales-pipeline-reviewer]
