thinking_why: It lists scores Shopify already made.
new_slug: fraud-review-queue-builder
name: Fraud review queue builder
summary: Build a fraud review queue for your Shopify orders. Get recent orders ranked by risk, with the warning signs Shopify flagged on each one.
job: secure-code
headline: Fraud review queue builder
subhead: A list of recent Shopify orders ranked by fraud risk, with the warning signs shown for each, so a person can check them by hand.
explain: |
  A list of recent Shopify orders ranked by fraud risk, with the warning signs shown for each, so a person can check them by hand. It only reads data and changes nothing in your store.

  You set how many days to look back, the lowest risk level to include and a minimum order value. It asks Shopify for matching orders, then sorts them with the highest risk first and larger orders ahead of smaller ones. Each row shows Shopify's own flags, such as mismatched billing and shipping details. The scores are advice from Shopify, not a final verdict. You need a Shopify store login with read access to orders.
when:
  - You want one list of risky orders to check each morning.
  - You are seeing chargebacks and want to catch orders earlier.
  - You need to review only high-value orders at risk.
  - You want a safe way to look without changing anything.
not_for:
  - "You want orders cancelled or blocked for you: this only reads data, so set up Shopify's own fraud filters or cancel by hand in your Shopify admin."
  - "You want to tag or hold risky orders: this skill changes nothing, so tag or hold them yourself in your Shopify admin."
  - "You want to judge a single order by gut feel: open that order in Shopify and read its risk details there."
you_give:
  - Store address
  - Days to look back
  - Minimum risk level (optional)
  - Minimum order value (optional)
  - Shopify login with order read access
you_get:
  - Orders ranked by risk
  - Fraud signals for each order
  - Order values and dates
  - Readable or JSON output
how_to_use:
  - Use an AI that can run commands, such as Claude Code, with the Shopify command line tool installed.
  - Sign in to your store with read access to orders. Run this command, shopify store auth --store your-store.myshopify.com --scopes read_orders
  - Paste the skill into your AI and give it your store address. Say how many days to look back (the default is 7). The minimum risk level is high unless you say otherwise, and the minimum order value is 0 unless you set one.
  - Open the ranked list each morning. Check the flagged orders by hand in your Shopify admin before you cancel or hold anything.
  - Orders from repeat customers can be false alarms, so look at their history first. The minimum order value is 0 unless you set one. A figure such as $50 is only a starting point to test on your own orders.
  - To set up automatic rules, use the fraud rules setter. To follow up on lost disputes, use the chargeback customer tagger.
output_sample:
  input:
    - Your store address
    - How many days back to look
    - The lowest risk level to include (optional)
    - The smallest order value to include (optional)
    - Whether you want a readable report or JSON (optional)
  prerequisites:
    - A Shopify login with read access to orders
    - An AI that can run Shopify CLI commands
  output:
    - name: Start banner
      contains: Shows the skill name, your store and the time the run began.
    - name: Step log
      contains: One line per step with what was asked and how many orders came back.
    - name: Summary report
      contains: Counts of orders reviewed by risk level, then the high risk orders with their warning signs.
    - name: risk_report_<date>.csv
      contains: One row per order with risk level, price, customer, warning signs, payment status and fulfillment status.
    - name: JSON summary (optional)
      contains: The same counts in JSON, with the name of the CSV file.
next: [fraud-rules-setter, chargeback-customer-tagger]
