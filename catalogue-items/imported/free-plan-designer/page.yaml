thinking: high
thinking_why: Limits and pricing trade off against each other.
new_slug: free-plan-designer
name: Free plan designer
summary: Describe your product. Get a free tier with limits that win paid users
  without anger or abuse.
job: plan-strategy
headline: Free plan designer
subhead: A free tier for a developer product with limits that let people build
  real things and still lead many of them to pay. It avoids both stingy limits
  and ones that invite abuse.
explain: |
  A free tier for a developer product with limits that let people build real things and still lead many of them to pay. It avoids both stingy limits and ones that invite abuse.

  It first compares four models: free trial, free tier, freemium and open core, and picks the one that suits how you sell. Then it sets limits on usage, projects, seats and features, based on when a hobby project turns into a paid one. It checks for abuse risks and for limits that feel like traps. Last, it sets up the upgrade message and tracks what to watch after launch.
when:
  - You are launching a developer tool and must decide what to give free.
  - Your free users never pay, or they leave angry about limits.
  - You think people are abusing your free plan.
  - You are choosing between a trial and a permanent free tier.
you_give:
  - What your product does
  - How you sell (self-serve or sales-led)
  - Costs per free user
  - Paid plan prices
  - "Who uses it: hobbyists or companies (optional)"
you_get:
  - Model recommendation
  - Free tier limits with reasons
  - Abuse risks and guards
  - Upgrade trigger points
  - Metrics to track
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
