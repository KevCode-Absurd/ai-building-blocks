thinking: medium
thinking_why: It scores ideas, then outlines the best.
new_slug: free-tool-idea-planner
name: Free tool idea planner
summary: Find a free calculator or tool idea that brings in leads. Give it your buyers and goal. You get scored ideas, a pick and a build plan.
job: build-product
headline: Free tool idea planner
subhead: Describe your buyers. Get free calculator or tool ideas that bring leads, with a build plan. Bring your product and who buys it. Use the result to plan your next step.
explain: |
  Ideas for a free calculator or small tool that brings in leads and search traffic, plus a plan to build it and a check that it is worth the effort.

  It asks about your product, buyers and goal, then lists tool types that fit, such as calculators, generators, graders and checkers. Each idea is tested against four rules: it solves a real problem, it connects to what you sell, it stays simple, and expected lead value beats build and upkeep cost. For the winner, it covers the page, the data capture, how people find it and what happens after they use it.
when:
  - You want a free calculator that people will search for.
  - You need leads but ads are costly.
  - You have a few tool ideas and need to pick one.
  - You want to know if a free tool is worth the build time.
not_for:
  - "You want a downloadable ebook, checklist or template: use a lead magnet planner, or write the guide yourself."
  - "You already know the tool and only need it built: hire a developer or use a no-code form tool such as Typeform or Tally."
  - "You want to improve the page the tool sits on: use a landing page review instead."
you_give:
  - Your product and who buys it
  - "Your goal: leads, traffic or awareness"
  - Build skills and time available
  - Budget for promotion (optional)
you_get:
  - Several tool ideas that fit your buyers
  - Score for each against four rules
  - Pick with reasons
  - Build plan
  - Promotion and follow-up plan
how_to_use:
  - "Gather five things first: your product, who buys it, your goal, your build time and skills, and your promotion budget."
  - Open Claude, ChatGPT or Gemini and paste the skill instructions into a new chat.
  - Paste your five answers. If you have a product summary or brand notes, paste those too.
  - Read the scored ideas. Check that the top pick fits what you sell and that you can build it in the time you have.
  - Ask your AI to adjust the build plan to your budget, then start with the smallest first version.
  - This works in a plain chat. It needs no code, files or paid tools. The no-code tools it names, such as Outgrow, Involve.me, Typeform and Bubble, have paid plans.
output_sample:
  input:
    - Your product and who buys it
    - "Your goal: leads, traffic or awareness"
    - Your build skills and time
    - Your promotion budget (optional)
  output:
    - name: Tool ideas
      contains: Several free tool ideas that fit your buyers, such as calculators, generators, graders or checkers.
    - name: Evaluation scorecard
      contains: Each idea rated 1 to 5 on eight factors, like search demand, buyer match and build effort, with a total.
    - name: Pick and reasons
      contains: The top idea, plus why it won and whether it is a strong, promising or weak candidate.
    - name: Build plan
      contains: A small first version, what to skip at first, and whether to build it, use a no-code tool or embed one.
    - name: Lead capture plan
      contains: How much of the tool to gate, and what to ask for in return.
    - name: Promotion and follow-up
      contains: Search phrases for the tool page, ways to earn links, and what happens after someone uses it.
