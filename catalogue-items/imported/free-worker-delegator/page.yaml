new_slug: free-worker-delegator
name: Free worker delegator
summary: Hand off routine coding. Get free helper models doing scout, code and test jobs while Claude reviews.
job: build-software
headline: Free worker delegator
subhead: Hand off routine coding. Get free helper models doing scout, code and test jobs while Claude reviews.
explain: |
  Routine coding jobs go to free helper models, while Claude plans the work, checks it and merges the result. This keeps your paid usage for the thinking.

  It uses the opencode command line tool to run disposable workers. Each worker has a role: a scout to read code, a coder to write it, a tester to check it. You can send one worker out or a group in parallel. Claude reads their output before anything is kept. Set up takes some work: you install Node and opencode, log in, and copy a few command files. Do not send private code or secrets, because the free workers run on opencode's servers.
when:
  - You spend heavily on tokens for grunt work like searching code.
  - You have several small tasks that can run side by side.
  - You want a test writer that does not use your main quota.
  - You want Claude to review code that other models wrote.
you_give:
  - Coding tasks to delegate
  - Node.js and the opencode tool installed
  - An opencode account
  - Project folder access
you_get:
  - Scout, coder and tester jobs run by free workers
  - Parallel runs for separate tasks
  - Claude's review of each result
  - Run logs
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code, use git and the opencode tool.
