thinking: low
thinking_why: It moves orders by set rules.
new_slug: fulfillment-location-rerouter
name: Fulfillment location rerouter
summary: Move open Shopify orders from one warehouse to another. Preview first, then confirm. Use it to reroute fulfillment when a location is full or closing.
job: run-your-store
headline: Fulfillment location rerouter
subhead: Give it your store, the location to move orders from and the location to move them to. It finds the open orders and shows what would move. Nothing changes until you confirm.
explain: |
  Open Shopify orders are moved from one warehouse to another, for example when a location is full or a region needs different routing. This changes live orders, so it previews first.

  You name the source and destination locations, and optionally list specific orders. It finds the open fulfilment orders at the source and, in preview mode, shows exactly which would move. Preview is on by default. Only when you confirm does it move them, which changes who picks and ships each order. You must check that the destination can fulfil the items. It needs Shopify login with order and fulfilment write access.
when:
  - One warehouse is overloaded and another has room.
  - A location is closing and its open orders need a new home.
  - You want to send orders to a site closer to the buyer.
  - You want to see which orders would move before you change anything.
not_for:
  - "You need to move stock between locations: this does not move inventory, so transfer stock in Shopify Admin first."
  - "You want to check stock levels at the new location: check them in Shopify Admin before you move orders."
  - "You need to move just one or two orders: change the location by hand in Shopify Admin."
you_give:
  - Your store address, like mystore.myshopify.com
  - The ID of the location to move orders from (find it in Shopify Admin under Settings, then Locations; it is the number in the page address)
  - The ID of the location to move orders to. Both must be active locations that can fulfil orders
  - Specific order numbers (optional)
you_get:
  - A preview of the orders that would move
  - A confirm step before any change
  - Open orders moved to the new location
  - A summary on screen and a CSV log of every order
how_to_use:
  - Before you start, test the whole flow on a development store first. If the preview list does not match the orders you see at the source location in Shopify Admin, stop and do not type yes. Ask your AI to check the list again, or move the orders by hand.
  - Use an AI that can run commands, such as Claude Code, Codex or Gemini CLI. A plain chat window cannot change your store.
  - Sign in to your store with the Shopify CLI. Allow read_orders and write_fulfillments access. Check the sign-in command against the Shopify CLI help first (run shopify store auth --help). If the help shows a different command or scope names, use what the help says. Try it on a test store if you have one.
  - Paste the skill and give your store address, the source location ID and the destination location ID. Add order numbers if you want only some orders moved.
  - Run the preview first. The search the skill uses to find orders was not tested on a live store. Check that the preview list matches the orders you expect at the source location in Shopify Admin before you type yes.
  - Check that the destination has stock for every item. This step is required. This skill does not move stock, so transfer it first in Shopify Admin if it is short.
  - Tell your AI to go ahead by typing yes. The skill must not move any order until you do. Then open the CSV log and check for errors.
  - "After the move, spot-check a few orders in Shopify Admin. Then reconcile the CSV log against your counts: the number moved plus the errors should equal the number of orders you saw at the source, and the source location should show no open orders left from that list."
output_sample:
  input:
    - Your store address
    - The location to move orders from
    - The location to move orders to
    - Specific order numbers (optional)
  prerequisites:
    - An AI that can run Shopify CLI commands
    - A Shopify login with read_orders and write_fulfillments access
  output:
    - name: Preview list
      contains: The open orders at the source location that would move, shown before anything changes. Preview is on by default.
    - name: Move step
      contains: Each confirmed order is reassigned to the new location, and any order that fails is skipped and noted.
    - name: Outcome summary
      contains: Counts of orders at the source, orders moved and errors, shown on screen when the run ends.
    - name: routing_log CSV
      contains: One row per order with order name, fulfillment order ID, source, destination and status.
