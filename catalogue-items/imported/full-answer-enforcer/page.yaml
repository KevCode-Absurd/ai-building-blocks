thinking: low
thinking_why: It is a short rule set, not a method.
new_slug: full-answer-enforcer
name: Full answer enforcer
summary: Get a full file or long list with every line written. This full answer enforcer stops placeholders, skipped parts and half answers.
job: set-up-ai
headline: Full answer enforcer
subhead: When you ask for a full file or list, you get every line. No "rest of code here", no stubs and no "let me know if you want more".
explain: |
  When you ask for a full file or list, you get every line. No "rest of code here", no stubs and no "let me know if you want more".

  The skill bans a list of shortcuts: placeholder comments in code, skeletons in place of real code, "for brevity" and skipped sections. It counts the pieces you asked for, builds each one completely, then compares the count before sending. If an answer is too long for one reply, it breaks cleanly at the end of a function or file and continues, instead of squeezing the rest. It won't invent files or keys it doesn't have.
when:
  - Your AI keeps cutting code short with comments like "same as above".
  - You need a whole file, not a snippet.
  - You asked for a long list and keep getting half of it.
  - You need long output split cleanly into parts.
not_for:
  - "You only need a short answer or a small snippet: ask your AI in a normal message instead."
  - "Your AI has not seen the files you want rewritten: share them first, because it will not invent missing code."
  - "You want a quick outline or skeleton: ask for that directly, and say a skeleton is fine."
you_give:
  - Your request for the full output
  - Source files or context
  - Number of items you expect (optional)
you_get:
  - Complete files or lists with nothing skipped
  - No placeholders or TODO stubs
  - Clean continuation chunks for long answers
  - Final check against what you asked for
how_to_use:
  - Open a new chat in Claude, ChatGPT or Gemini. No code running, web access or paid tool is needed.
  - Paste the full text of the skill into the chat, then send it.
  - In your next message, ask for the full file or list. Paste your source files or notes. Say how many items you expect, if you know.
  - If the answer is long, your AI will split it at a clean break. Reply "continue" to get the next part.
  - Count the items in the result and compare them to your request. Look for any "rest of code" or TODO lines before you use it.
  - If something is missing, say which item and ask your AI to write it in full.
output_sample:
  input:
    - Your request for a full file, list or set of items
    - Your source files or notes (optional)
    - How many items you expect (optional)
  output:
    - name: Complete deliverables
      contains: Every file, function, section or list item you asked for, written out in full with no placeholders.
    - name: Continuation chunks
      contains: When a reply is too long, clearly labeled parts that stop at a clean break and pick up from there.
    - name: Final check
      contains: A last pass that compares what you asked for against what was written, and adds anything missing.
    - name: Missing input note
      contains: A plain note about any file or detail your AI could not see, instead of made-up code.
