thinking: high
thinking_why: It links many tools into one path matched to the buyer.
new_slug: funnel-flow-planner
name: Funnel flow planner
summary: Plan your funnel flow from landing page to lead magnet, emails and sale. Give it your audience and offer. You get one path per audience.
job: make-offer
headline: Funnel flow planner
subhead: A map of how visitors move from landing page to lead magnet to emails to a sale, with the right path for each audience. Your tools work as one system, not separate pieces.
explain: |
  A map of how visitors move from landing page to lead magnet to emails to a sale, with the right path for each audience. Your tools work as one system, not separate pieces.

  It starts by splitting audiences and stages: who they are and how ready they are to buy. Each entry point gets its own flow. A calculator visitor and a newsletter reader should not get the same emails. It maps your existing tools, such as chatbot, quiz, magnet and demo button, onto that flow, then plans the follow-up sequence and the offer at the end. Test ideas are listed so you can improve it over time.
when:
  - You have a chatbot, quiz and lead magnet that all work alone.
  - Conversions are flat although each tool gets some use.
  - Everyone gets the same email sequence no matter how they arrived.
  - You are setting up your first funnel and need the structure.
not_for:
  - You have no traffic or email list yet. Start with a plain landing page and a simple signup form first.
  - You only need one email or one page written. Ask your AI to write just that piece, not a full funnel map.
  - You want to design one tool, such as a quiz or a calculator. Build that tool on its own first, then come back to link it in.
you_give:
  - Your audience groups
  - Your offer and price
  - Tools and pages you already have
  - Traffic sources
  - Current conversion numbers (optional)
you_get:
  - Audience and stage segments
  - Entry points with their paths
  - Follow-up sequence per path
  - Offer placement
  - Tests to run next
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text from this page into the chat.
  - Add your audience groups, your offer and price, your tools and pages, and your traffic sources.
  - Add your current conversion numbers if you have them.
  - "Check each path: does each audience get its own entry point and its own emails? Ask your AI to fix any that share one path."
  - Pick the first test from the list and run it before you change anything else.
output_sample:
  input:
    - Your audience groups and how ready each is to buy
    - Your offer and price
    - The tools and pages you already have
    - Where your visitors come from
    - Your current conversion numbers (optional)
  output:
    - name: Audience and stage segments
      contains: Each audience group, matched to how ready its people are to buy.
    - name: Entry points
      contains: Where each group lands and which path it gets sent down.
    - name: Tool mapping
      contains: Where your chatbot, quiz, lead magnet and other tools fit on each path.
    - name: Follow-up sequence
      contains: The emails for each path, matched to the audience and stage.
    - name: Offer placement
      contains: Where the offer appears on each path and what it says.
    - name: Measurement and tests
      contains: What to track across the whole funnel and which tests to run first.
