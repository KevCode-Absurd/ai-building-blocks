thinking: high
thinking_why: It checks you against legal articles and has to judge each answer.
new_slug: gdpr-audit-prep-coach
name: GDPR audit prep coach
summary: Get a GDPR audit prep check before a review. Name your scope, answer six article-based questions and see the privacy gaps to fix first.
job: secure-code
headline: GDPR audit prep coach
subhead: Before a privacy review lands, you hear the hard questions first. Name the scope, such as a product, a team or a data flow, and you get six pointed questions, each tied to a GDPR article.
explain: |
  Before a privacy review lands, you hear the hard questions first. Name the scope, such as a product, a team or a data flow, and you get six pointed questions, each tied to a GDPR article. Your answers turn into a list of gaps to fix.

  The questions press on the records of processing and when they were last updated, the lawful basis for each purpose, the impact assessment for risky processing, and similar proof an auditor would ask to see. Each one says what good evidence looks like, so you know if your answer would hold up. It suits an annual audit, a post-breach check or buyer due diligence.
when:
  - An internal privacy audit is due next month and you want to find holes first.
  - You are about to launch something that handles personal data in a new way.
  - You had a data breach and need to check what a regulator will ask.
  - A buyer is reviewing your privacy setup as part of a deal.
not_for:
  - "You need legal advice or a formal sign-off: talk to your data protection officer or a privacy lawyer."
  - "Your product holds no personal data from people in the EU: you do not need a GDPR check."
  - "You want a check of general security controls, not privacy law: use a security audit with your IT lead."
you_give:
  - The scope to review
  - Your record of processing (optional)
  - Lawful basis notes for each purpose (optional)
  - Past impact assessments (optional)
you_get:
  - Six questions tied to GDPR articles
  - What evidence would satisfy each one
  - A list of gaps ranked by risk
  - Fix steps before the review
next: [privacy-impact-assessment-writer]
how_to_use:
  - Open your AI chat and paste the skill text from this page.
  - "Name your scope, such as a product, a team or a data flow. Pull your records first: record of processing, lawful basis notes, impact assessments, request log, transfer assessments and breach log. No scripts or API keys are needed."
  - Answer the six questions one at a time. Say so when you have no proof for an answer.
  - Read the verdict and the top 3 actions. Fix the red items first.
  - Take any item marked for outside counsel to your DPO or a privacy lawyer.
output_sample:
  input:
    - The scope to review, such as a product, a team or a data flow
    - Your record of processing and when it was last updated (optional)
    - Your lawful basis notes for each purpose (optional)
    - Your past impact assessments and your breach log (optional)
  prerequisites:
    - "An AI chat. The skill lists scripts, but you do not need them: answer in the chat."
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: The six questions
      contains: Six pointed questions, each tied to a GDPR article, on records, lawful basis, impact assessments, requests, transfers and breaches.
    - name: Article 30 RoPA status
      contains: When your record of processing was last updated and whether all required parts are there.
    - name: Article 6 lawful basis
      contains: Which activities have a clear lawful basis and which claim legitimate interests without a written assessment.
    - name: Article 35 DPIA quality
      contains: Which risky activities need an impact assessment and whether each one is complete.
    - name: Data subject rights, transfers and breaches
      contains: How fast you answer requests, how you cover non-EU transfers, and whether your breach log is complete.
    - name: Verdict
      contains: A rating of ready, gaps found or not ready.
    - name: Top 3 actions
      contains: Three next steps, each with an owner and a timeline tied to an article.
    - name: Outside counsel required
      contains: Points where the law is unclear and you should ask a lawyer.
