thinking: medium
thinking_why: It scans for set risks and then writes them up.
new_slug: gdpr-privacy-checker
name: GDPR privacy checker
summary: Point it at your code and data use. Get privacy risks, an impact
  assessment and a tracker for data requests.
job: secure-code
headline: GDPR privacy checker
subhead: Find privacy problems in your code before a regulator or a customer
  does. Point it at a project folder and it scans for personal data like emails,
  phone numbers, IP addresses, health data and card numbers.
explain: |
  Find privacy problems in your code before a regulator or a customer does. Point it at a project folder and it scans for personal data like emails, phone numbers, IP addresses, health data and card numbers. It also flags risky habits such as logging personal data, missing consent and keeping data forever.

  Two more tools sit beside the scanner. One builds a data protection impact assessment for a processing activity. The other tracks data subject requests, such as access or deletion, against the legal deadline. It covers EU rules and the German federal law. The scanner needs Python, and its output can feed a build check.
when:
  - You are shipping a feature that stores user data and want a privacy check
    first.
  - A customer asks for proof you handle personal data properly.
  - You need an impact assessment for a high-risk activity.
  - People are sending deletion or access requests and you need to track
    deadlines.
you_give:
  - Your project folder
  - A description of the data you process
  - Details of the processing activity (optional)
  - Data request log (optional)
you_get:
  - A scan report of personal data and risky code
  - A draft impact assessment
  - A tracker for data subject requests
  - Fixes ranked by risk
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and read your project files.
