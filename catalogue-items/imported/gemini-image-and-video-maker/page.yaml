thinking: low
thinking_why: Gemini draws the picture; the skill picks the model and checks cost.
new_slug: gemini-image-and-video-maker
name: Gemini image and video maker
summary: Make images or short videos with Google Gemini from a plain description. Add reference images for on-brand results. You approve each cost first.
job: make-images
headline: Gemini image and video maker
subhead: Images and short videos from Google Gemini, started by a plain description. Hand over a picture idea and, if you have them, reference images such as a logo, a face or a product shot.
explain: |
  Images and short videos from Google Gemini, started by a plain description. Hand over a picture idea and, if you have them, reference images such as a logo, a face or a product shot. It picks the right model for the job: a fast draft, a standard image, a high quality image, or video.

  You can link a folder of references once and reuse it for on-brand results. A still image can also be animated. Each run saves a small log file next to the result so you know how it was made. It needs a Gemini API key, and usage is billed by Google. Google's prices change, so the skill quotes the current price before every call and you approve each one. Check Google's price page and set a spend limit on your key before you start.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to AntonioCardenas and sickn33.
when:
  - You need a thumbnail or hero image that matches your brand look.
  - You want to animate a still product photo into a short clip.
  - You have reference images and want new pictures in the same style.
  - You want a quick draft first, then a better version of the one you like.
not_for:
  - "You want free or offline image tools: use a free image maker, since every Gemini call here is billed by Google."
  - "You have no Gemini API key or no budget for per-call billing: get a key and set a budget first, or use a design tool you already pay for."
  - "You need the exact same image again: this skill cannot promise it, so keep the saved file and its log instead."
you_give:
  - A description of the image or video
  - Reference images (optional). Gather the file paths of your logo, face or product photos first, or the name of a saved reference set
  - A Gemini API key
  - The quality level you want (optional)
you_get:
  - Generated images or short video files
  - A model picked for the task
  - A saved log of each run
  - Reusable reference sets for later
how_to_use:
  - Get a Gemini API key from Google AI Studio. Billing must be on, because every image and video costs money, and videos cost more than images. Look up Google's current prices first. Set a budget alert or spend cap on the Google Cloud project your key belongs to (Google's billing help shows where), so one long session cannot run up a large bill. Keep the key private and out of any shared folder.
  - Use an AI that can run code and save files, such as Claude Code or Gemini in a coding tool. Chat-only windows will not work.
  - Give your AI this skill. Let it install the google-genai package if it is missing, and set GEMINI_API_KEY in a .env file.
  - Describe the image or video. Name your reference images or reference set if you want an on-brand look.
  - Read the price your AI quotes and approve it. Each run needs its own approval.
  - Check the saved image or video and its .json log in the generations folder. Ask for changes to one thing at a time.
  - Next, check the result against your brand guide before you publish it, and save the approved version in your asset folder.
output_sample:
  input:
    - Your description of the image or video
    - Reference images such as a logo, a face or a product shot (optional)
    - A saved reference set for on-brand work (optional)
    - Your Gemini API key
  prerequisites:
    - An AI that can run code and files on your computer
    - A Google Gemini API key from Google AI Studio, with billing on
    - The google-genai Python package, installed with your OK
  output:
    - name: Model choice
      contains: "The model picked for your job: fast draft, standard image, high quality image, or video."
    - name: Price quote and approval
      contains: The current price for the chosen model, which you must approve before each single call.
    - name: Generated image or video
      contains: The new file, saved in the generations folder of your project.
    - name: JSON log file
      contains: A small file next to the result with the exact prompt, model, references, cost and time.
    - name: Reference sets
      contains: Folders of your logos and photos, copied or linked, that you can reuse for on-brand results.
