thinking: medium
thinking_why: Gemini does the searching; you set the question and check the sources.
new_slug: gemini-research-report-writer
name: Gemini research report writer
summary: Run a Gemini deep research report on any question. You get a long, cited report saved as a file. Needs Python and a paid Gemini API key.
job: research-topics
headline: Gemini research report writer
subhead: A long research report with cited sources, written while you do something else. You give a question and Google Gemini's research mode plans the search, reads the pages and writes the report.
explain: |
  A long research report with cited sources, written while you do something else. You give a question and Google Gemini's research mode plans the search, reads the pages and writes the report. The skill starts the job, checks on it, and collects the finished text.

  Before anything runs, it shows you the exact question, the cost range (about $2 to $5 per run, an estimate and not a spending limit) and where the file will be saved. It only starts after you agree, because the question goes to Google. It suits market scans, literature reviews and competitor checks where a quick web search falls short. It needs Python and a paid Gemini API key.
when:
  - You need a market or competitor scan with sources you can check.
  - A quick web search will not cover a topic you must understand.
  - You want a literature review draft to react to.
  - You want research running in the background while you work.
not_for:
  - "You need a quick fact or a short answer: use a plain web search or a normal chat with your AI."
  - "Your question holds private or confidential material, such as customer data or passwords: remove it first, or do the research by hand."
  - "You cannot run code or pay for a Gemini API key: ask your AI to search the web in a normal chat instead."
you_give:
  - Your research question
  - A Gemini API key from Google AI Studio
  - A report layout, like a list of section headings (optional)
  - A place to save the report (optional)
you_get:
  - A long report with cited sources
  - A cost and query summary before it starts
  - Progress updates while it runs
  - The finished report saved as a file
how_to_use:
  - Get a Gemini API key from Google AI Studio. Set it on your computer as GEMINI_API_KEY. Never paste it into a chat.
  - Open an AI that can run code, such as Claude Code, and give it the skill folder. In the folder, ask it to run pip install -r requirements.txt.
  - Tell your AI your research question and any layout you want. Remove private details first.
  - Check the question, the cost range and the save location it shows you. If you gave no place to save, ask your AI where it will save the file. Say yes only if all three are right.
  - Wait 2 to 10 minutes. Your AI can stream progress, or check status or wait using the job ID it gives you.
  - Read the report and check key claims against the original sources. Ask for a follow-up on any point that needs more.
output_sample:
  input:
    - Your research question
    - Your Gemini API key from Google AI Studio
    - A report layout you want, like section headings (optional)
    - A place to save the report (optional)
  prerequisites:
    - An AI that can run code on your computer
    - Python 3.8 or newer
    - A paid Gemini API key, saved as GEMINI_API_KEY
    - The httpx package, installed from requirements.txt
  output:
    - name: Approval summary
      contains: The exact question, the fact it goes to Google, the expected cost range and where the file will be saved.
    - name: Progress updates
      contains: Live status while the research runs, or a job ID you can check later with status or wait.
    - name: Research report
      contains: A long markdown report built from many searches, with cited sources, in your layout if you gave one.
    - name: Saved report file
      contains: The finished report stored in the place you chose.
    - name: Follow-up report
      contains: An extra report on one point, built on the earlier research when you ask for more.
