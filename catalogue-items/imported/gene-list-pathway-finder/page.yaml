thinking: medium
thinking_why: It picks a method for the data, runs it and interprets the results.
new_slug: gene-list-pathway-finder
name: Gene list pathway finder
summary: Find the pathways that stand out in your gene list or ranked gene table. Get a pathway enrichment analysis with plain-terms results and report-ready tables.
job: research-topics
headline: Gene list pathway finder
subhead: A list of genes becomes a short answer about which biology stands out. Give it a list of significant genes or a full ranked table, and it finds the pathways and gene sets that show up more than chance allows.
explain: |
  A list of genes becomes a short answer about which biology stands out. Give it a list of significant genes or a full ranked table, and it finds the pathways and gene sets that show up more than chance allows.

  The first choice is the method. A thresholded hit list goes through over-representation testing. A full ranked table goes through GSEA, which keeps the ranking. It also covers per-sample scores. It then guides database choice, background gene sets, ID fixes and removing near-duplicate results. Results come as tables and figures you can use in a paper. It needs Python with several scientific packages, and online lookups need a network.
when:
  - You have a list of differentially expressed genes and ask what they have in common.
  - You have a ranked result table and want GSEA done properly.
  - Your pathway results look repetitive and need cleaning up.
  - You are unsure whether to use a hit list or a ranked list.
not_for:
  - "You have no gene list yet and only raw sequencing reads: ask a bioinformatician or run your usual alignment and differential expression pipeline first."
  - "You want to find which genes changed between groups: run a differential expression tool first, then bring the result here."
  - "You cannot run Python and have no one who can: ask a bioinformatician to run it, or use a web tool such as Enrichr by hand."
you_give:
  - A gene list or a ranked gene table
  - Your species
  - Your preferred gene set database (optional)
  - A background gene list (optional)
you_get:
  - Enriched pathways and gene sets
  - A method choice with reasons
  - Cleaned, deduplicated results
  - Tables and plots for a report
how_to_use:
  - Open your AI in a tool that can run Python code. It needs Python 3.12 or newer with gseapy, numpy, pandas and matplotlib.
  - Paste the skill into the chat, or upload the skill folder if your AI accepts files.
  - Add your gene list or ranked table, and tell it your species. Add a database or background list if you have one.
  - Check the method it picks. A short hit list uses over-representation. A full ranked table uses GSEA.
  - Know where your data goes. Online methods such as Enrichr and g:Profiler send your gene list to outside services. A local GMT file keeps your data on your machine.
  - Read the cleaned results and plots, and check the gene ID notes before you use anything in a report.
output_sample:
  input:
    - Your gene list, or a full ranked table of genes with scores
    - Your species
    - The gene set database you prefer (optional)
    - A background gene list for the hit-list method (optional)
  prerequisites:
    - An AI that can run Python code
    - Python 3.12 or newer with gseapy, numpy, pandas and matplotlib installed
    - Network access for online lookups, or a local GMT file for offline use
  output:
    - name: Method choice
      contains: Whether your data suits over-representation testing or ranked GSEA, with the reasons.
    - name: Gene ID check
      contains: Your gene names mapped to the form the chosen database expects, with any that failed to map.
    - name: Enrichment results table
      contains: Each pathway or gene set with its adjusted p-value, overlap or score, and the genes behind it.
    - name: Reduced results
      contains: The same results with near-duplicate pathways merged or removed so the list is easier to read.
    - name: Plots
      contains: Dotplots and enrichment maps of the top pathways, ready for a report or paper.
    - name: Interpretation
      contains: A short plain-language reading of which biology stands out and what to be careful about.
