thinking: medium
thinking_why: It checks code against a fixed rule list.
new_slug: generated-code-reviewer
name: Generated code reviewer
summary: Check code your AI just wrote for clean-code slips, repeated logic and common AI mistakes before it ships. Get fixes or a list of findings.
job: test-and-fix-code
headline: Generated code reviewer
subhead: Code your AI just wrote gets a second pass before it ships. The review checks for clean-code slips, repeated logic, needless complexity and the mistakes AI tools tend to make, like extra layers nobody asked for.
explain: |
  Code your AI just wrote gets a second pass before it ships. The review checks for clean-code slips, repeated logic, needless complexity and the mistakes AI tools tend to make, like extra layers nobody asked for.

  It works in three modes. Guard mode checks a fresh diff and fixes problems before you see it. Live mode applies the rules while code is being written, then runs a checklist. Review mode scores and critiques files you point at. Detailed rules sit in reference files and are read when needed. It does not replace your linter, formatter or tests. It adds the judgement those tools miss. No setup or key is needed.
when:
  - An AI tool just wrote a large change and you want it checked before commit.
  - You want to review a file or diff against clear clean-code rules.
  - Your generated code keeps growing duplicate helper functions.
  - You want rules applied during a risky edit, not only after.
not_for:
  - "You want to run tests or catch style errors: use your own linter, formatter or test runner."
  - "You have a question about ideas, prose or data analysis: ask your AI directly, since this only reviews code."
  - "You want a score or grade for your code: it lists findings and does not give a quality score."
you_give:
  - The changed code or files
  - The language or project style (optional)
  - Your lint and test setup (optional)
  - Which mode you want (optional)
you_get:
  - Fixes for rule violations
  - A structured list of findings
  - A self-check list before delivery
  - Notes on repeated or needless code
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code running, web access or paid tool is needed.
  - Paste the code or diff your AI just wrote. Add the language or project style if you know it.
  - Pick a mode. Say "guard" to get fixes, "live" to apply the rules while writing, or "review" to get a list of findings.
  - Read the results. Check each fix still does what you wanted.
  - Run your own linter and tests after. This skill does not replace them.
output_sample:
  input:
    - The code or files your AI just wrote or changed
    - The language or project style (optional)
    - "Which mode you want: guard, live or review (optional)"
  output:
    - name: Fixed code
      contains: In guard and live mode, your code with rule violations fixed before you see it.
    - name: Findings report
      contains: In review mode, a structured list of problems found in the files you point at, with no score.
    - name: Self-check before delivery
      contains: A checklist run against the final code to confirm the rules were met.
    - name: Repeated or needless code notes
      contains: Duplicate helpers, extra layers and features nobody asked for that were found or removed.
