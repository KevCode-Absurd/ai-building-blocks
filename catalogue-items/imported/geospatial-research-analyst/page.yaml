thinking_why: It picks methods across many map tools, then runs them.
new_slug: geospatial-research-analyst
name: Geospatial research analyst
summary: Give it map files, satellite images or location data. Get a geospatial analysis with code, maps and result tables you can rerun.
job: research-topics
headline: Geospatial research analyst
subhead: Give it map files, satellite images or location data, and a question. It checks your data first, picks a method, runs it and saves the maps and tables. You get results and code you can rerun.
explain: |
  Maps and satellite data turned into a worked analysis you can follow. Give it location data, rasters, vector files or satellite imagery and a question, such as how land cover changed or where terrain gets steep, and it builds the workflow and runs it on your files. The code in the skill is a template for your own data. Steps that use Earth Engine, CDS, desktop GIS or a graphics card are not run by default.

  A few terms: a CRS (coordinate reference system) says how map positions are measured. A raster is a grid of values, like a photo or an elevation map. A vector file holds points, lines and shapes. Nodata marks cells with no valid reading. Earth observation means data from satellites.

  It starts by checking where each input came from and what coordinate system it uses. Then it picks the right path: vector or raster GIS, remote sensing, spatial statistics, terrain, road or network analysis, or machine learning on Earth observation data. Reference notes are loaded only for the task at hand. It needs Python with GeoPandas and Rasterio, and some paths need extra packages or service logins.
when:
  - You have satellite images and want to measure change over time, such as land cover or plant growth.
  - You have a map layer and want to test for spatial patterns, like which zones have more points.
  - You have elevation data and need slope, aspect or hillshade.
  - You need a driving route or travel time between two places.
not_for:
  - "You only need a quick chart or a single lookup: use a spreadsheet such as Google Sheets, or a desktop map tool like QGIS."
  - "Your AI cannot run Python code or save files: ask a GIS analyst, or use QGIS to do the steps by hand."
  - "You need traffic as it is right now or a legal survey: use a live traffic service or a licensed surveyor."
you_give:
  - Your map, raster or location files
  - The question you want answered
  - The area and dates you care about (optional)
  - Logins for imagery services such as Earth Engine or CDS (optional)
you_get:
  - "A short record of each input: source, date, coordinate system and units"
  - The method used, with the reason it fits your question
  - Result tables with units
  - Saved maps and map files
  - Python code you can rerun
how_to_use:
  - Use an AI that can run Python code and save files. A plain chat window can only plan the steps.
  - Install Python 3.12 or newer (the skill's install notes use 3.13) and the packages the skill lists, in a fresh environment. Add extra tools only if your task needs them. The skill's code is a template for your own files. Earth Engine, CDS, desktop GIS and graphics-card steps are not run unless you set them up and ask for them.
  - Upload your files and describe your question, area and dates. Say which coordinate system each file uses, if you know.
  - Ask your AI to check each input's source, coordinate system and units before it runs anything.
  - Review the results table and the limits note. Check the maps against what you know of the area.
  - Keep the saved code, the input record and the limits note with your results. When you are ready to share, ask your AI to write up the findings, with the limits stated.
  - Free open data works for most tasks. Earth Engine, CDS and paid imagery need an account. Route and place lookups use public services that limit how many requests you can send.
output_sample:
  input:
    - Your map, raster or location files
    - The question you want answered
    - The area and dates you care about (optional)
    - Logins for imagery services (optional)
  prerequisites:
    - An AI that can run Python code and save files
    - Python 3.12 or newer (the skill's install notes use 3.13) with GeoPandas, Rasterio, NumPy and PyProj installed
    - A login for Earth Engine, CDS or paid imagery, only if you use those sources
  output:
    - name: Data record
      contains: Where each input came from, its date, coordinate system, units and any mask or nodata notes.
    - name: Method
      contains: The analysis path chosen, such as raster GIS, remote sensing, terrain or network analysis, and why.
    - name: Code
      contains: Python scripts you can rerun on the same or new data.
    - name: Results table
      contains: The numbers that answer your question, with units and the valid-data area used.
    - name: Saved maps and files
      contains: Output rasters or map layers that keep the coordinate system, transform and mask.
    - name: Limits and checks
      contains: What the result cannot show, and what to check, such as accuracy on held-out areas.
