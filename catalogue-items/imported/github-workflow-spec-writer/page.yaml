new_slug: github-workflow-spec-writer
name: Document a GitHub workflow contract
summary: Turn a GitHub Actions workflow file into a written spec of its jobs, triggers, secrets and failure paths, with gaps flagged for your team.
job: document-work
headline: Document a GitHub workflow contract
subhead: Paste a GitHub Actions workflow file. Your AI reads it and writes a spec of what the workflow does. Anything the file does not show is marked as unknown.
explain: Bring a workflow file. Trace jobs, inputs and gates, then get a written contract with gaps called out.
when:
  - A new teammate needs to understand a deploy workflow before changing it.
  - You are about to edit a workflow and want a record of how it behaves now.
  - An auditor or manager asks what a workflow can access and approve.
  - You inherited a repo and no one knows what its automation does.
not_for:
  - "You need a new workflow written from scratch: ask your AI to draft one, or ask a developer."
  - "Your workflow file is short and clear: add comments in the YAML file or a short README instead."
  - "You want to fix a broken workflow: use your CI logs and a developer, since this skill only documents."
you_give:
  - Your workflow YAML file, pasted into the chat.
  - Reusable workflows or actions it calls (optional).
  - Owners, required approvals and rules that are not in the file (optional).
you_get:
  - A spec file with a job dependency table and a flow diagram.
  - Lists of inputs, outputs, secrets and variables by name.
  - Timeout, permission and failure-path notes.
  - A list of unknowns for your team to confirm.
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste your workflow YAML below them. Add called workflows if you have them.
  - Add any owners or approval rules that the file does not show.
  - Read the unknowns list and ask the right owner to fill each gap.
  - Save the result as a markdown file in your repo, in a spec folder. No code needs to run.
output_sample:
  input:
    - Your GitHub Actions workflow file (YAML)
    - Any reusable workflows or actions it calls (optional)
    - Owners, required approvals and rules that are not in the file (optional)
  output:
    - name: Workflow Overview
      contains: The purpose of the workflow, the events that start it and the environments it targets.
    - name: Execution Flow Diagram
      contains: A Mermaid diagram showing how the trigger and jobs connect, including parallel jobs.
    - name: Jobs & Dependencies
      contains: A table of each job with its purpose, what it waits on and where it runs.
    - name: Requirements Matrix
      contains: Functional, security and performance requirements with IDs and checks you can test.
    - name: Input/Output Contracts
      contains: Inputs, outputs, secrets and variables, listed by name and purpose.
    - name: Execution Constraints
      contains: Timeouts, concurrency limits, runner needs, network access and permissions.
    - name: Error Handling Strategy
      contains: What happens on build, test or deploy failure, and how to recover.
    - name: Quality Gates
      contains: The checks and approvals the workflow enforces, and when they can be skipped.
how_it_works:
  - title: Read the actual workflow
    text: Trace event/path/branch filters, jobs, dependencies and conditional execution.
  - title: Extract the contracts
    text: Record inputs, outputs, artifacts, permissions, secrets by name and runtime constraints.
  - title: Describe verification
    text: Map quality/approval gates and error paths to acceptance checks without inventing absent targets.
thinking: medium
thinking_why: It weighs your evidence and follows a specific method.
