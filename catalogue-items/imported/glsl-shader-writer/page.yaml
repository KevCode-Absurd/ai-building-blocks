job: build-websites
headline: GLSL shader writer
subhead: A visual effect, described in words, turned into working vertex and
  fragment shaders. Say what you want to see, such as a ripple, a glow or a
  blur, and you get GLSL code made to run fast on the GPU.
explain: |
  A visual effect, described in words, turned into working vertex and fragment shaders. Say what you want to see, such as a ripple, a glow or a blur, and you get GLSL code made to run fast on the GPU.

  The code follows the standard pipeline: the vertex shader moves points into screen space, and the fragment shader colours each pixel. It uses uniforms for values you control, varyings to pass data between stages, and vector tricks like swizzling to keep maths short. It suits WebGL, Three.js and game engines, including post-processing effects and procedural textures. You need a way to run shaders to see results.
when:
  - You want a custom effect in a Three.js scene.
  - Your shader runs slowly and needs tuning.
  - You want to add bloom, blur or colour correction to a render.
  - You want a procedural texture with no image files.
you_give:
  - A description of the effect
  - Your engine or framework
  - Inputs you want to control
  - Performance target (optional)
you_get:
  - A vertex shader
  - A fragment shader
  - Uniform names to adjust the effect
  - Notes on speed and compatibility
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
