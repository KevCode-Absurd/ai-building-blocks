thinking: medium
thinking_why: It follows set steps with a few choices.
new_slug: gnss-position-calculator
name: GNSS position calculator
summary: Turn RINEX satellite files into GNSS receiver positions. Pick satellite groups, check DOP and scatter, and compare one group against several.
job: build-software
headline: GNSS position calculator
subhead: Give it RINEX satellite data. Get receiver positions worked out from chosen satellite groups. Bring a RINEX 3 observation file and its navigation file. Compare one satellite group against several.
explain: |
  Where a receiver was, worked out from satellite data you already have. Give it RINEX observation and navigation files and it calculates positions using pseudoranges from GPS, GLONASS, Galileo, BeiDou, QZSS, NavIC and SBAS.

  You can pick which satellite groups to use and compare a single group against several. It also reports dilution of precision and satellite geometry, so you can judge solution quality. You can test options such as the elevation mask, signal strength cutoff and corrections to see their effect. It handles RINEX version 3 only, not carrier-phase methods. It needs MATLAB with the Navigation Toolbox, release R2026a or newer. Both are paid MathWorks products.

  Licence: BSD 2-Clause plus a MathWorks term, as the LICENSE.md file says. You may use it only with MathWorks products. The skill file links MathWorks' own reuse licence page, which says the same.
when:
  - You logged satellite data and need receiver positions from it.
  - You want to see if adding Galileo improves accuracy.
  - You are teaching how satellite positioning works.
  - You need to test how an elevation mask changes your result.
not_for:
  - "You need centimetre-level carrier-phase positioning (RTK or PPP): use a dedicated RTK or PPP tool, as this skill only uses pseudoranges."
  - "Your files are RINEX version 4: convert them to version 3 first, or use a tool built for version 4."
  - "You want to combine GNSS with motion sensor (IMU) data: use MATLAB's inertial sensor fusion tools or an INS filter."
you_give:
  - RINEX 3 observation file
  - RINEX 3 navigation file
  - Satellite systems to use
  - Processing options (optional)
you_get:
  - Receiver position solutions
  - Dilution of precision values
  - Single versus multi-system comparison
  - MATLAB code you can rerun
how_to_use:
  - Open an AI that can run MATLAB code. You need MATLAB with the Navigation Toolbox, release R2026a or newer.
  - Paste the skill into the chat, or load the skill folder.
  - Add your RINEX 3 observation and navigation files. Say which satellite systems to use.
  - Set the elevation mask and signal strength cutoff you want, or ask your AI to use the defaults.
  - Check the file summary and the DOP values first. Weak geometry means the positions are less reliable.
  - Rerun with another satellite group or mask, then compare. Add a known true position to measure the error.
  - What next. Pick the satellite group with the lowest DOP and the smallest scatter, and say which mask you used. To test your setup against made-up signals, use the GNSS signal generator.
output_sample:
  input:
    - Your RINEX 3 observation file
    - Your RINEX 3 navigation file
    - Which satellite systems to use, such as GPS or GPS plus Galileo
    - Elevation mask and signal strength cutoff (optional)
    - A known true position to compare against (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with the Navigation Toolbox, release R2026a or newer
  output:
    - name: File check
      contains: The RINEX version and the satellite systems and observation codes found in your files, checked before anything else runs.
    - name: Position solutions
      contains: A receiver position for each epoch, worked out from the satellite groups you chose.
    - name: Dilution of precision
      contains: DOP values per epoch, with a note when geometry is weak.
    - name: Quality metrics
      contains: Scatter RMS, satellite count and the number of epochs skipped.
    - name: Comparison plots
      contains: Labelled figures that compare one satellite group against several.
    - name: Ground truth comparison
      contains: The error against a known true position, only if you supply one.
