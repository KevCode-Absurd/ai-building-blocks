thinking: high
thinking_why: Positioning needs real judgement about your market.
new_slug: go-to-market-positioning-planner
name: Go-to-market positioning planner
summary: Plan your go-to-market positioning. Give it your product and rivals. You get an ideal buyer, a positioning statement, battlecards and launch steps.
job: plan-strategy
headline: Go-to-market positioning planner
subhead: A launch plan that starts from the buyer, not the feature list. Give it your product and your rivals and you get a clear position, a go-to-market plan and launch steps in order.
explain: |
  A launch plan that starts from the buyer, not the feature list. Give it your product and your rivals and you get a clear position, a go-to-market plan and launch steps in order.

  It begins by defining the ideal customer from your best customers, those with the highest lifetime value. Then it builds positioning, sizes up competitors, and plans the launch. It also covers what your sales team needs and notes on entering new countries. Scripts handle some of the scoring. The result is a plan you can hand to a team, written around why the right buyer picks you over the options.
when:
  - You are launching a product and cannot explain why you beat the alternatives.
  - Your messaging sounds like every competitor's.
  - You need a launch checklist with owners and timing.
  - You want to enter a new market and need a plan.
not_for:
  - "Your product has no customers or interviews yet: talk to 10 likely buyers first, then come back with their notes."
  - "You already have a launch plan and need to run it: use the launch-strategy skill, which is not in this library yet."
  - "You only need one ad or one page of copy: write it directly with your AI, using your product facts."
you_give:
  - Product description
  - Main competitors
  - Customer data (optional)
  - Launch date and budget (optional)
you_get:
  - An ideal customer profile
  - A positioning statement
  - Competitor comparison
  - A go-to-market and launch plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the full skill text.
  - Add your product description, your main rivals with their websites, and any customer interview notes or win and loss data.
  - Add your launch date and budget if you have them (optional).
  - "Ask for the part you need: the ideal customer, positioning, battlecards, a launch plan or a new market plan."
  - Check the result. Every dollar figure, timeline and target in the skill is an example. Replace each one with your own data.
  - Test the positioning with customers before you launch.
output_sample:
  input:
    - Your product description
    - Your main rivals and their websites
    - Notes from 10 or more customer interviews, or your win and loss data (optional)
    - Your launch date and budget (optional)
  prerequisites:
    - An AI that can read files helps, since the skill points to reference files. A plain chat works too.
  output:
    - name: ICP definition
      contains: Your ideal customer from your best customers, with company traits, tools used, buyer roles and an A to D fit score.
    - name: Positioning statement
      contains: A short statement of who it is for, what it does and how you differ from the alternatives.
    - name: Messaging hierarchy
      contains: Headline, subhead, benefits, features and proof, ordered from most to least important.
    - name: Battlecards
      contains: "For each rival: their claims, strengths, weaknesses, your edge, when you win or lose, and replies to objections."
    - name: Launch plan
      contains: Launch tier, steps in order, a launch day checklist and the numbers to watch.
    - name: Sales enablement kit
      contains: Outline for a sales deck, one-pagers, a demo script and email templates.
    - name: International entry plan
      contains: Steps to enter a new country, including a checklist for translating and adapting your site and pricing.
