thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: gorgias-and-hubspot-contact-check
name: Gorgias and HubSpot contact check
summary: Check your Gorgias and HubSpot contacts. Find customers missing from your CRM and fields that do not match, with fixes to review.
job: organise-work
headline: Gorgias and HubSpot contact check
subhead: Connect Gorgias and HubSpot and ask for a contact check. It matches customer email addresses from recent support tickets to your contact records. You get missing contacts, conflicting names or fields, and suggested fixes to review.
when:
  - Your support team talks to customers who may not be in your CRM.
  - You are about to clean up HubSpot and want to know which contacts are missing or out of date.
  - Names or emails on support tickets do not match what sales sees.
not_for:
  - "You want records created or synced for you: this only reports gaps, so use a sync tool or fix them by hand in HubSpot."
  - "You have no way to connect Gorgias and HubSpot to your AI: do a manual review of a ticket export against your HubSpot contact list."
  - "You want to find CRM contacts who never wrote to support: this only counts them, so use a HubSpot list or report."
you_give:
  - Recent Gorgias customer email addresses and names.
  - HubSpot contact records for comparing those fields.
you_get:
  - List missing contacts and mismatches with suggested fixes. This review does not sync records itself.
how_it_works:
  - title: Collect customer records
    text: Read recent Gorgias tickets and collect unique customer email addresses and names.
  - title: Match HubSpot contacts
    text: Look up each email in HubSpot and compare the fields found in both tools.
  - title: Explain the gaps
    text: List missing contacts and mismatches with suggested fixes. This review does not sync records itself.
works_best_with:
  tools:
    - name: Gorgias and HubSpot
      why: Live lookups need Composio CLI access and connected accounts for these services.
how_to_use:
  - Open an AI that can run Composio CLI commands. This check needs code running and live access to your accounts.
  - Link your accounts. If the AI says Gorgias or HubSpot is not connected, run the link command it gives you, then try again.
  - Ask the AI to run the Gorgias and HubSpot contact check. Say how far back to look, for example the last 30 days of tickets.
  - Let it list your recent tickets, then look up each customer email in HubSpot.
  - Read the report. Fix the contacts missing from HubSpot first, then the mismatched fields.
  - Make any changes in HubSpot yourself. This check does not change any records.
output_sample:
  input:
    - Recent Gorgias tickets with customer emails and names
    - Your HubSpot contact records, looked up by email
  prerequisites:
    - An AI that can run Composio CLI commands
    - Gorgias and HubSpot accounts linked through Composio
  output:
    - name: In Gorgias but not in HubSpot
      contains: A table of customers with tickets but no CRM record, with ticket counts and first and last contact dates.
    - name: Data mismatches
      contains: A table of contacts found in both tools where a field differs, with a suggested value to keep.
    - name: In HubSpot with no tickets
      contains: A count of CRM contacts who never filed a ticket. This is for information only.
    - name: Health score
      contains: The share of contacts in sync, the number missing from the CRM, the mismatch count, and an overall rating.
    - name: Recommendations
      contains: Specific actions to fix the gaps you found.
next: [gorgias-and-hubspot-customer-brief, crm-hygiene-auditor]
