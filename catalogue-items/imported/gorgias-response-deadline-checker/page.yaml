thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: gorgias-response-deadline-checker
name: Gorgias response deadline checker
summary: Check your open Gorgias tickets against your reply targets. See which are late or at risk, how long is left, and what to do next.
job: help-customers
headline: Gorgias response deadline checker
subhead: Connect Gorgias and share your reply and resolution targets. It compares ticket timestamps with those limits. You get late and at-risk tickets, time remaining, suggested actions, and a score out of 100 for meeting response targets.
when:
  - You want a weekly check of open Gorgias tickets against your reply targets.
  - Your team feels behind and you need to see which tickets are late first.
  - You are about to end a shift and want to catch tickets close to their limit.
  - You want one score for how well the team meets its response targets.
not_for:
  - "You run live chat queues: check them in your chat tool's own reports, since this reads Gorgias tickets only."
  - "You use a helpdesk other than Gorgias: paste the ticket times into your AI and ask it to compare them with your targets."
  - "You need replies sent or tickets changed: ask a teammate or use Gorgias itself, since this only reads and reports."
you_give:
  - Your reply and resolution time targets.
  - Gorgias ticket messages with timestamps and current status.
you_get:
  - A list of tickets that are late, at risk or on track, each with its time elapsed.
  - The time left on each at-risk ticket.
  - A health score out of 100 for meeting your targets.
  - Suggested next steps for late tickets and who to ping.
how_it_works:
  - title: Set response targets
    text: Use your stated reply and resolution limits. Review any suggested defaults before relying on them.
  - title: Compare ticket times
    text: Read open ticket threads and compare customer and staff timestamps with each target.
  - title: Show deadline risks
    text: Group late, at-risk, and on-track tickets with times, next steps, and response target scores.
works_best_with:
  tools:
    - name: Gorgias
      why: Live lookups need Composio CLI access and connected accounts for these services.
how_to_use:
  - Install the Composio CLI and link your Gorgias account. Your AI will ask you to run composio link gorgias if it is not linked. Gorgias is a paid help desk. Composio may charge for use, so check its pricing before the first run.
  - Add the downloaded folder to an AI that can read skill files and run commands.
  - Ask your AI to run the SLA monitor skill.
  - Give your reply and resolution targets. Skip this to use the defaults, which are set by priority from P0 to P3. Check they match your own rules.
  - Read the late tickets first, then the at-risk ones. The skill only reads tickets. It never sends replies or changes anything.
  - Next, pass late P0 and P1 tickets to the assigned agent, or the team lead if no one is assigned. Run the check again daily or weekly to see if the score improves.
output_sample:
  input:
    - Your reply and resolution time targets (optional, defaults are used if you skip this)
    - Your open and pending Gorgias tickets, read through a connected account
  prerequisites:
    - An AI that can read skill files and run commands
    - The Composio CLI installed, with your Gorgias account linked
    - Check Composio's site for any cost, as this page does not list one
  output:
    - name: Breached tickets
      contains: A table of tickets past their target, with subject, customer, target, time elapsed and how far over.
    - name: At risk tickets
      contains: A table of tickets with over 75% of their target used, showing time left.
    - name: On track tickets
      contains: A table of tickets still within limits, with target, time elapsed and time remaining.
    - name: SLA health score
      contains: A score out of 100, the average of two shares, first replies on time and resolutions on time, plus average response time.
    - name: Recommendations
      contains: Next steps for breached tickets and which agents to ping.
