thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: gorgias-shift-handover-writer
name: Gorgias shift handover writer
summary: Write a Gorgias shift handover note from your open tickets. You get urgent tickets, waiting replies, work in progress and blockers for the next agent.
job: help-customers
headline: Gorgias shift handover writer
subhead: Connect Gorgias before a shift change or ticket handover. It checks open work and reads the threads needing attention. You get a handover note covering urgent tickets, customer replies, work in progress, recent fixes, and unresolved blockers.
when:
  - You use this tool for customer support and need help with this task.
not_for:
  - "You need to hand over one ticket only: add a short note on that ticket in Gorgias, or tell the next agent yourself."
  - "You have no Gorgias account or no Composio access: copy the ticket list into a note and ask a person to write the handover."
  - "You want a report on past support work: use a Gorgias report, since this skill covers only the last few hours."
you_give:
  - Your open and pending Gorgias tickets (the AI reads them once Gorgias is connected)
  - Which tickets are urgent or have new customer replies (optional, the AI picks them from the tickets if you skip this)
you_get:
  - A handover note with urgent tickets, waiting replies, work in progress and recent fixes
  - The last action and next step for each ticket
  - A list of blockers and open questions for a manager
  - Background notes so the next agent can start fast
how_it_works:
  - title: Read active work
    text: Find open and waiting tickets. Read urgent threads and recent customer replies.
  - title: Separate waiting states
    text: Group tickets by immediate action, waiting on customers, work in progress, and recent resolution.
  - title: Write handover notes
    text: Show the last action, next step, blockers, and useful context for the incoming person.
works_best_with:
  tools:
    - name: Gorgias
      why: Live lookups need Composio CLI access and connected accounts for these services.
how_to_use:
  - Add the downloaded folder to an AI that can run commands and read skill files.
  - Say "Run the Gorgias shift handover writer" when your shift ends.
  - This skill needs Composio CLI and a connected Gorgias account. Check the Composio and Gorgias sites for their prices.
  - If your AI says Gorgias is not connected, run the link command it shows, then ask again.
  - Read the note and fix anything wrong, such as the owner or the next step.
  - Send the note to the next agent. Approve any change to tickets or accounts before it happens.
output_sample:
  input:
    - Your open and pending Gorgias tickets (read for you once Gorgias is connected)
    - The full message thread of urgent tickets (read for you)
  prerequisites:
    - An AI that can run Composio CLI commands
    - A Composio account with Gorgias connected
  output:
    - name: Needs Immediate Attention
      contains: A table of tickets with time pressure, upset customers or VIP accounts, with last action and what is needed.
    - name: Awaiting Customer Response
      contains: A table of tickets waiting on the customer, with the wait time and what to do if there is no reply.
    - name: In Progress
      contains: A table of tickets being worked now, with current status and the next step.
    - name: Recently Resolved (last 4h)
      contains: A table of tickets closed in the last four hours and how each was fixed.
    - name: Open Questions / Blockers
      contains: Issues needing a manager, known bugs hitting many tickets, and fixes waiting to go live.
    - name: Notes
      contains: Any extra background the next agent needs to pick up the work.
