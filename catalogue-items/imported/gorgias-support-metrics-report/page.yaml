headline: Gorgias support metrics report
subhead: Connect Gorgias and choose the dates you want to review. It gathers ticket records and samples detailed threads for response times. You get counts, issue groups, trends, and timing measures, with an optional Google Sheets export. Check the sample limits before sharing.
