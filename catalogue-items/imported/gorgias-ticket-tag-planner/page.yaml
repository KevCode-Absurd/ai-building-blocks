summary: Share a ticket or queue. Get suggested tags, confidence levels, and reasons before changes.
job: help-customers
headline: Gorgias ticket tag planner
subhead: Give it a Gorgias ticket number or a batch of untagged tickets. It reads your existing tags and each message. You get suggested tags with reasons and confidence levels, ready to review before applying them.
when:
  - You use this tool for customer support and need help with this task.
