  - A ticket number or a batch of untagged tickets.
  - Access to the current tag list and messages in Gorgias.
you_get:
  - Show the tag table and ask which changes you want to apply.
how_it_works:
  - title: Read your tag list
    text: Read the tags already set up in Gorgias so suggestions use your own labels.
  - title: Match messages to tags
    text: Read the ticket topic, issue, urgency, and customer group. Explain each suggested label.
  - title: Review proposed changes
    text: Show the tag table and ask which changes you want to apply.
