thinking: medium
thinking_why: It applies known patterns to your data shape.
new_slug: graphql-schema-designer
name: GraphQL schema designer
summary: Design a GraphQL schema from your data. Get types, resolvers that avoid slow repeat queries, cursor paging and limits on costly queries.
job: build-software
headline: GraphQL schema designer
subhead: Describe your data and get a GraphQL API plan you can build from. You receive a full schema, plus resolver code that avoids the slow trap of one database call per item.
explain: |
  Describe your data and get a GraphQL API plan you can build from. You receive a full schema, plus resolver code that avoids the slow trap of one database call per item.

  It starts by modelling real entities as types, inputs, enums and interfaces. Queries are named for things, mutations for actions. Long lists use cursor paging with edges, nodes and page info. Resolvers use DataLoader so fifty posts and their authors cost two lookups, not fifty-one. Other list fields, such as tags, need their own loader too. This skill is MIT licensed. It is imported from Burhan Sebin's collection, with only a plain name added. It adds subscriptions for live data, limits on query depth and cost, field-level access rules, and options for Apollo Federation and persisted queries.
when:
  - You are starting a new API and need a schema design.
  - Your API is slow because each list item triggers its own query.
  - You need cursor paging for long lists.
  - You need to stop expensive queries from overloading the server.
not_for:
  - "You only need a REST API: use a plain REST design with your web framework, since GraphQL adds work you won't use."
  - "You want to run queries against a GraphQL API that already exists: use the API's own docs and a client such as Apollo Studio."
  - "You need to tune a slow database: look at your indexes and query plans first, as the schema may not be the cause."
you_give:
  - Your entities and how they relate
  - The reads and writes you need
  - Your server framework (optional)
  - Auth rules (optional)
you_get:
  - A complete GraphQL schema
  - Resolver code with batching
  - Paging for list fields
  - Advice on depth and cost limits (described, not coded in the sample)
how_to_use:
  - Gather these first. Your list of entities with their fields, the reads and writes you need, and your server choice (for example Apollo Server).
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - "Describe your data: the things you store, how they link, and the reads and writes you need."
  - Name your server, such as Apollo Server, and say if you want schema-first or code-first output (optional).
  - Add your auth rules, such as who may edit or delete (optional).
  - Read the schema first. Check which fields can be empty and that the names fit your data.
  - The sample code does not include depth or cost limits. The skill describes them, and you add them in your server before you go live.
  - Copy the code into your project to run it. Your AI chat can't run it for you. Test it in Apollo Studio.
  - The sample code includes sign-in and owner checks on the edit and delete actions, and a fixed list of tables and columns for the paging SQL. Keep those checks when you adapt the code, and add the same to every new edit or delete action. The subscription example needs a pub/sub setup in your server.
output_sample:
  input:
    - Your entities and how they relate
    - The reads and writes you need
    - Your server framework (optional)
    - Your auth rules (optional)
  prerequisites:
    - Any AI chat is enough to get the schema and resolver code
    - A Node.js project and database if you want to run the code
  output:
    - name: schema.graphql
      contains: Types, enums, inputs, queries, mutations, subscriptions and paging types for each list, written in GraphQL schema language.
    - name: resolvers.js
      contains: Resolver code for each field, with batched lookups so a list and its authors need only two database calls.
    - name: Pagination module
      contains: Reusable cursor paging code that returns edges, nodes and page info, and caps the page size.
    - name: Subscriptions
      contains: Live event fields, such as new comments, with advice to refetch data when a client reconnects.
    - name: Security and limits
      contains: Query depth and cost limits, field-level access checks and notes on persisted queries.
    - name: Federation notes
      contains: Advice on splitting the schema across services, only if your API spans more than one.
