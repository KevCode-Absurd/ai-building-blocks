new_slug: growth-loop-designer
name: Growth loop designer
summary: Describe your product and users. Get the growth loops that fit, ranked,
  and how to start the first.
job: plan-strategy
headline: Growth loop designer
subhead: Describe your product, who uses it and where growth comes from today.
  It checks the product against five loop types, where sharing, usage,
  teammates, posted content or referrals bring the next users in. You get the
  loops that fit, ranked, how each one works, its strengths and weak points, and
  how to start the first.
explain: |
  Growth that feeds itself, matched to your product. Describe the product and who uses it, and you get the loops that fit, ranked, with the first one worth starting.

  It checks your product against five types. In a viral loop, shared content brings new people in. A usage loop grows as people use the product. A collaboration loop pulls in teammates. A user-generated loop builds on content people post. A referral loop rewards invites. For each, it names the mechanism, the strength, the main challenge and a known example. The aim is less spend on paid ads and more product-led growth.
when:
  - Paid ads cost too much and you want growth that compounds.
  - You are not sure if referrals or sharing fit your product.
  - You are comparing how rivals grow.
  - You need a plan for the first loop to test.
you_give:
  - Your product description
  - Who uses it and how
  - Current growth sources
  - Your team size (optional)
you_get:
  - Loop types that fit your product
  - Mechanism of each loop
  - Strengths and challenges
  - How to start the first loop
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
