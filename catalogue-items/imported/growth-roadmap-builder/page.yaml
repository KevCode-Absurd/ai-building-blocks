thinking: high
thinking_why: It weighs five growth levers against your stage and numbers.
new_slug: growth-roadmap-builder
name: Growth roadmap builder
summary: Find the growth lever that pays most for your online shop. Give it your numbers and get a ranked list and a 90 day growth roadmap.
job: run-your-store
headline: Growth roadmap builder
subhead: "Tell it your platforms, monthly revenue, margin, and what you know about customer cost and order size. It checks the health of those numbers, then scores five growth levers: traffic, conversion, bigger orders, repeat buyers and expansion. You get the lever that pays most right now, a verdict on new channels or products, and a 90 day roadmap."
explain: |
  If your online shop has stalled, you probably do not need more of everything. You need the one fix that pays most right now. This skill checks your numbers first: cost to win a customer, lifetime value, average order size and margin per sale. Then it scores five growth levers: more traffic, better conversion, bigger orders, more repeat buyers, and expansion.

  It also uses the Ansoff Matrix, adjusted for shops, to compare selling more on your current channel, adding channels like Amazon or TikTok Shop, adding products, or entering new markets. The result is a ranked list of moves and a 90 day roadmap with steps in order. No code or API key is needed.
when:
  - Your shop has been flat for a few months and you do not know why.
  - You are choosing between adding a new sales channel and launching new products.
  - You want a 90 day plan with a clear order of work.
  - You are not sure whether to spend on ads, email or your product page first.
not_for:
  - "Your shop has no sales yet: the unit numbers need real orders, so start with a simple launch plan or talk to a mentor first."
  - "Your checkout is broken or visitors can't buy: fix that first, then come back for a growth plan."
  - "You only want ad copy or a marketing plan: use a marketing strategy tool, since this one picks what to do, not how."
you_give:
  - Your platform or platforms, such as Shopify, Amazon or Etsy
  - Monthly revenue and margin
  - Customer cost and order size, if you know them
  - Your target and timeframe
  - Email list and social following size (optional)
you_get:
  - A health check of your shop numbers
  - The growth lever that pays most right now
  - A channel or product expansion verdict
  - A 90 day roadmap with steps in order
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the full skill text. No code, files or paid tools are needed.
  - "Add your shop details: platforms, monthly revenue, margin and your goal with a time frame."
  - Add your cost to win a customer, average order size, email list and social following if you know them. Skip what you don't know.
  - Read the health check first. Check that the numbers match your own records, and fix any that are wrong.
  - Ask your AI to redo the plan if you change a number. Your own numbers matter more than any benchmark in the result.
  - Start with Priority 1 and work through the 90 day roadmap in order.
output_sample:
  input:
    - Your shop platform or platforms, such as Shopify, Amazon or Etsy
    - Your monthly revenue and profit margin
    - Your cost to win a customer and average order size (optional)
    - Your goal and the time you have to reach it
    - Your email list and social following size (optional)
  output:
    - name: Business Snapshot
      contains: Your platforms, revenue, margin and goal, as you gave them.
    - name: Unit Economics Health Check
      contains: Cost to win a customer, customer lifetime value, order size and margin, each rated against a benchmark.
    - name: Growth Equation Diagnosis
      contains: Which part of your sales math is holding growth back.
    - name: E-Commerce Ansoff Matrix
      contains: "Your options: sell more on your channel, add channels, add products or enter new markets."
    - name: Growth Opportunity Matrix
      contains: The five growth levers scored and ranked for your stage.
    - name: Top 3 Growth Priorities
      contains: The three best moves, each with the reason and the steps to take.
    - name: Channel Expansion Assessment
      contains: A verdict on whether you are ready to add a new sales channel (if it applies).
    - name: Product Expansion Assessment
      contains: A verdict on adding new products (if it applies).
    - name: 90-Day Growth Roadmap
      contains: Work in order across days 1 to 30, 31 to 60 and 61 to 90.
    - name: KPIs & Tracking
      contains: The numbers to watch to see if the plan works.
