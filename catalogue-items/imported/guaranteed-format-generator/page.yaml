thinking: medium
thinking_why: It sets format rules for a local model.
new_slug: guaranteed-format-generator
name: Guaranteed format generator
summary: Say what shape each answer must take. Get Python code that makes a local AI model return valid JSON, a fixed choice or matching text.
job: build-software
headline: Guaranteed format generator
subhead: Tell it the shape your answers must have, such as JSON fields, a list of allowed labels or a text pattern, and which local model you run. It writes Python code that uses the Outlines library to block anything that breaks that shape, plus setup steps for your model.
explain: |
  Asking a model nicely for JSON works most of the time, and then your script crashes on the one reply that does not. This guaranteed format generator takes another route. It uses a Python library called Outlines that limits which words the model can pick at each step. A reply can only fit the shape you set.

  You describe the shape once. It can be a Pydantic class (a Python class that lists your fields and their types), a JSON schema, a list of allowed answers or a regex pattern. The skill writes the code to load a model you run yourself, through Transformers, llama.cpp or vLLM, and to generate against that shape.

  What sets it apart is that the format is enforced while the model writes, so you do not need retry loops for format errors. The content can still be wrong, so check it on a sample.

  You need Python and a model that runs on your own machine or server.
when:
  - Your script keeps crashing because the model returned broken JSON.
  - You need every answer to be one of a fixed set of labels, such as positive, negative or neutral.
  - You are pulling names, dates or emails out of text and need typed fields every time.
  - You run a local model and want a fixed format without retries.
not_for:
  - You use a hosted model such as OpenAI or Anthropic through an API. Use the Structured data extractor or the AI data extractor builder.
  - You want free text, such as a summary or an email. Ask your AI directly. No shape is needed.
  - You cannot run Python or a local model. Use the AI data extractor builder, or ask your AI to return a table you copy.
  - A retry loop that checks the format is good enough for you. It is simpler to set up than this.
you_give:
  - The exact shape each answer must take, such as the fields and their types
  - Two or three sample texts to run it on
  - Which local model or backend you use, such as Transformers, llama.cpp or vLLM
  - Your Python setup and whether you have a GPU (optional)
you_get:
  - A Pydantic class, JSON schema or choice list for your format
  - Python code that loads your model and generates against that shape
  - Setup steps for your model backend
  - A short sample check that shows the output type
  - Tips to keep it fast
how_to_use:
  - Open an AI that can run Python, such as Claude Code, or open any chat AI and run the code yourself. Paste in this skill.
  - Say what shape you need and paste two or three sample texts. Name your model and backend. If you have none, ask for the small Phi-3-mini model.
  - Install the older release the code was written for: pip install "outlines>=0.1,<0.2" transformers. Newer releases changed the calls. If you use one, ask your AI to rewrite the code from that version's docs, and give it the output of pip show outlines.
  - Run the first example on one sample. Look at the type it returns and the values inside.
  - Run your samples, and check the content by eye. A valid shape does not mean a right answer. Then add more fields or limits.
  - Log every sample where the content is wrong. Tighten the type, enum or limit that let it through, and run again on 20 or more real samples before you use it for real work.
how_it_works:
  - title: Fixes the shape
    text: Turns your description into a Pydantic class, a list of choices or a regex pattern.
  - title: Picks the generator
    text: Chooses the generator for choice, JSON, regex or number output.
  - title: Loads your model
    text: Writes the code for Transformers, llama.cpp or vLLM, with the GPU settings that fit.
  - title: Blocks bad words
    text: Outlines turns your shape into rules that remove words that would break it at every step.
  - title: Tightens the shape
    text: Uses specific types, limits and enums so the model has fewer ways to be wrong.
  - title: Checks a sample
    text: Runs your samples and shows the type and values it returned.
output_shape: |
  FORMAT
  <Pydantic class / choice list / regex> with <fields and limits>
  SETUP
  pip install <packages> | model: <name> | backend: <name>
  CODE
  <file name>: <what it does>
  SAMPLE RUN
  Input: <your text> | Result type: <type> | Result: <values>
  NOTES
  <speed tip> | <what to check by eye>
  OPEN QUESTIONS
  <anything you did not give>
output_sample:
  input:
    - The shape each answer must take
    - Two or three sample texts
    - Your local model and backend
    - Your Python setup (optional)
  prerequisites:
    - Python installed
    - A model you can run locally, such as one from Hugging Face
    - A GPU for larger models (optional)
  output:
    - name: Format definition
      contains: A Pydantic class, choice list or regex pattern for the shape you described.
    - name: Generation code
      contains: Python that loads your model and returns results in that shape.
    - name: Setup steps
      contains: The install commands and model settings for your chosen backend.
    - name: Sample run
      contains: The result for each sample text, with its type, so you can check it.
    - name: Speed tips
      contains: How to reuse the generator and pick a backend for more throughput.
works_best_with:
  tools:
    - name: Claude Code
      why: It can run the Python code and show you the sample results.
    - name: Hugging Face
      why: It hosts the open models you load through Transformers.
  inputs:
    - Real examples of the messy text you need to read
    - A short list of the labels or fields, with a one-line meaning for each
    - The model name and version you run
terms:
  - term: Outlines
    meaning: An open source Python library that makes a model follow a format while it writes.
  - term: Pydantic
    meaning: A Python tool where you list your fields and their types in a class.
  - term: Regex
    meaning: A short pattern that describes text, such as the layout of a phone number.
  - term: Local model
    meaning: An AI model that runs on your own computer or server, not through a company's website.
