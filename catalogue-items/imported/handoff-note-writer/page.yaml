thinking: low
thinking_why: It sums up a chat in a set format.
new_slug: handoff-note-writer
name: Handoff note writer
summary: Finish or pause a chat. Get a short handoff note that another AI can
  carry on from.
job: organise-work
headline: Handoff note writer
subhead: Ask for a handoff when a long chat is done. It boils the work down to
  what is done, what is open and what comes next, pointing to files by path
  instead of copying them. You get a short note, the open items and the skills
  the next session should use.
explain: |
  A short note that lets a fresh AI chat carry on exactly where this one stopped. Long chats get slow and messy. Instead of pasting it all into a new one, ask for a handoff.

  The note sums up the state of the work, what is done, what is open, and what to do next. It points to plans, issues or files by path or link instead of copying them. It lists which skills the next assistant should call. It strips out passwords, keys and personal details. If you say what the next session is for, the note is tuned to that. It saves to a temp folder, not your project.
when:
  - Your chat is long and the AI has started losing track.
  - You want to switch to a new session without re-explaining everything.
  - You are passing a half-finished task to another AI or teammate.
  - You need to stop for the day and pick up cleanly tomorrow.
you_give:
  - The finished or paused chat
  - What the next session will be used for (optional)
  - Links or file paths for related plans and tickets (optional)
you_get:
  - A compact handoff note
  - A list of open items and next steps
  - Pointers to related files instead of copied text
  - Skills the next session should use
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
