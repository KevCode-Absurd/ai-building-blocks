thinking: medium
thinking_why: It counts and compares, then explains the trends.
new_slug: headcount-and-turnover-reporter
name: Headcount and turnover reporter
summary: Give it your people data. Get headcount, turnover and team health
  reports with a metrics table and trends.
job: hire-people
headline: Headcount and turnover reporter
subhead: "Upload a spreadsheet of employees with team, level, location and
  dates, plus exits if you have them. Pick the report: headcount, turnover,
  representation or org health. You get a summary of findings, a metrics table
  with trends, detail by team or level, recommended actions and a note on
  method."
explain: |
  A report on who works for you and who is leaving, built from your own people data. Pick the type: headcount, turnover, representation, or org health. Upload a spreadsheet or describe the data.

  The skill starts by asking what question you are trying to answer. Then it works out the numbers: headcount by team, location and level, average time in role, voluntary and involuntary exits, regretted exits, manager span of control, and signs someone may leave. Every report has a short summary, a metrics table with trends, the detail, recommended actions, and a note on how each figure was calculated. Use your own data only, and treat small groups carefully to protect privacy.
when:
  - Leadership wants a headcount snapshot by team and location.
  - You suspect one team has high turnover and want to see the numbers.
  - You need to report on representation across levels.
  - You want to find managers with too many direct reports.
you_give:
  - A spreadsheet of employees with team, level, location and dates
  - Exit dates and reasons, if you have them
  - The question you want answered
  - Manager names or IDs (optional)
you_get:
  - A summary of the main findings
  - A metrics table with trends
  - Detail by team, level or location
  - Recommended actions and a method note
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read a people data file you
    upload.
