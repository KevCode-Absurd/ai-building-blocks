name: Headcount forecast builder
summary: Give it past headcount and goals. Get a forecast of hires and exits with a clear method and a range of error.
job: hire-people
headline: Headcount forecast builder
subhead: Give it past headcount and goals. Get a forecast of hires and exits with a clear method and a range of error.
explain: |
  A forecast of how many people you will have, how many will leave, and how many you need to hire, with an honest range instead of a single guess. Planners and finance teams get a number they can trust and a clear reason for it.

  First it helps you choose a method that fits your data: a trend line, a driver-based model tied to revenue or workload, or a statistical approach. It forecasts headcount, exits by team and tenure, and hiring demand, adds seasonal swings, and accounts for known events like a launch. It reconciles the top-down target from finance with bottom-up requests, backtests last year's forecast, and shows the confidence range in plain terms.
when:
  - Finance asks how many hires you need next year.
  - You need to predict exits by team and not just overall.
  - Your last forecast missed and you want to know why.
  - Leadership's target and the team's requests do not match.
you_give:
  - Past headcount and exit data by month or quarter
  - Growth goals or business drivers
  - Known future events such as launches or new offices
  - Your last forecast to check against (optional)
you_get:
  - A headcount and exit forecast
  - A hiring demand number by team
  - The method used and why
  - A range showing how sure the forecast is
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
