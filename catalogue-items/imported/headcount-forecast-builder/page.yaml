thinking: high
thinking_why: Forecast method choices change the answer.
new_slug: headcount-forecast-builder
name: Headcount forecast builder
summary: Forecast headcount, exits and hires needed from your past numbers. Get the method used, a low and high range and a check on last year's miss.
job: hire-people
headline: Headcount forecast builder
subhead: "Give it past headcount and exits by month, your growth goals and any known events such as a launch. It picks a method that fits your data and builds the forecast. You get headcount, exits and hires needed by team, the method used and a low to high range."
explain: |
  A headcount forecast that shows how many people you will have, how many will leave and how many you need to hire, with a range and not one guess. Planners and finance teams get a number they can defend.

  The skill first checks how much history you have. With under 12 months, it says so and gives a simple range instead of pretending to see seasonal swings. Then it picks the simplest method that fits: a trend line, a driver-based model tied to revenue or workload, or a statistical method. It explains the choice in a line or two.

  It tests the method on your recent past, so you can see how far it would have missed. It then compares the result with the target from finance and shows the gap and why it exists.
when:
  - Finance asks how many hires you need next year.
  - You need to predict exits by team and not just for the whole company.
  - Your last forecast missed and you want to see where it went wrong.
  - The target from leadership and the requests from teams do not match.
not_for:
  - "You have less than a year of headcount history: use the Headcount plan builder, which works from goals and budget, then forecast once you have more data."
  - "You are deciding on one hire: use the Headcount business case builder."
  - "You want best, base and worst futures for a plan you already have: use the Headcount scenario planner."
  - "You want a report on the past, not a forecast: use the Headcount and turnover reporter."
you_give:
  - Past headcount and exits by month or quarter, ideally 12 months or more
  - The period you want to forecast, such as the next 12 months
  - Growth goals or business drivers, such as revenue targets (optional)
  - Known events such as launches or new offices (optional)
  - Your last forecast, to check against what happened (optional)
you_get:
  - A forecast of headcount, exits and hires needed, each with a low to high range
  - Hiring demand by team
  - The method used and why it fits your data
  - A back-test showing how far the method would have missed
  - The gap between the finance target and your bottom-up number
how_to_use:
  - Open Claude, ChatGPT or Gemini. A spreadsheet upload helps. No paid tool is needed.
  - Paste the skill text, then upload or paste your monthly headcount and exits.
  - Tell it the period to forecast, your goals and any events. Say what you do not have.
  - Read the method note first. If it says your history is too short, trust that and use the range as a guide only.
  - Check the first period against your own records, then share the ranges with finance.
  - Ask it to give you the tables as a spreadsheet if your AI can make files.
output_sample:
  input:
    - Past headcount and exits by month or quarter
    - The period to forecast
    - Growth goals, known events and your last forecast (optional)
  output:
    - name: Method and why
      contains: The method chosen, the data used and any data problems it found.
    - name: Forecast by period
      contains: Headcount, expected exits and hires needed for each month or quarter, as low, mid and high.
    - name: Hiring demand by team
      contains: Exits, growth and hires needed for each team.
    - name: Back-test
      contains: How far the method would have missed on recent periods, or a note that history is too short.
    - name: Gap to target
      contains: The finance target against your bottom-up number, and where they differ.
    - name: Assumptions and next refresh
      contains: What the forecast relies on and when to update it.
how_it_works:
  - title: Check the history
    text: It counts your periods and flags gaps. Under 12 months, it says the forecast will be rough.
  - title: Choose a method
    text: It picks a trend, driver-based or statistical method and explains why in a line or two.
  - title: Back-test
    text: It hides your latest periods, forecasts them and compares with what happened.
  - title: Build the forecast
    text: It forecasts headcount, exits and hires needed, and adds known events.
  - title: Show the range
    text: It gives low, mid and high cases, and shows the gap to the finance target.
terms:
  - term: Back-test
    meaning: Forecast a past period you already know, then compare with what happened.
  - term: Driver-based
    meaning: Headcount is tied to something that causes it, such as revenue or order volume.
  - term: Top-down and bottom-up
    meaning: Top-down is the target from leaders. Bottom-up is what teams say they need.
