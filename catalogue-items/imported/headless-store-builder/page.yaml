thinking: high
thinking_why: A custom storefront has many linked design and code choices.
new_slug: headless-store-builder
name: Headless store builder
summary: Build a custom Shopify storefront with Hydrogen. Get the project, home, product and collection pages, product queries and Oxygen deploy steps.
job: build-websites
headline: Headless store builder
subhead: Give it your Shopify store domain, design idea and page list. Your Storefront API token goes only in your .env file. It sets up a Hydrogen project, a custom React storefront that talks to your Shopify store behind the scenes. You get the project, pages for home, product and collection, the product queries and deploy steps for Oxygen.
explain: |
  A custom online storefront that loads fast and looks exactly how you want, connected to your Shopify store behind the scenes. Instead of using a theme, you build the front end yourself with React and Shopify's Hydrogen framework, then host it free on Shopify's Oxygen.

  The skill walks through creating a Hydrogen app, understanding its folders and routes, and setting up environment values like your store domain and Storefront API token. It covers fetching products and collections with GraphQL, using ready-made commerce components for carts and product pages, and deploying to Oxygen. It also covers bringing your own stack. You need Node.js, React knowledge and a Shopify store.
when:
  - A theme limits the design you want for your shop.
  - Your store is slow and you want faster page loads.
  - You want a custom React front end on top of Shopify.
  - You plan to deploy a storefront to Shopify's own hosting.
not_for:
  - "You want a quick shop on a standard look: use a Shopify theme, which needs no code."
  - "Your team does not know React or Node.js: use a Shopify theme, or hire a developer."
  - "You only want to change a few words or colors: edit your current theme in Shopify admin."
you_give:
  - Your Shopify store domain
  - Your Storefront API token (keep it in your .env file, never in the chat)
  - Your design idea and page list
  - Whether you use JavaScript or TypeScript
you_get:
  - A new Hydrogen project setup
  - Pages for home, product and collection
  - GraphQL queries for your products
  - Deploy steps for Oxygen
how_to_use:
  - "First run, in order: create the project, fill in your .env file, run npm run dev, check that the home, product and collection pages load, then deploy to Oxygen."
  - Before you start, get your Storefront API token. In Shopify admin, install the Headless channel and create a storefront. Copy the token from there.
  - Keep the token in your .env file. Never paste it into a chat.
  - Paste this skill into Claude, ChatGPT or Gemini. Add your store domain, design idea, page list and JavaScript or TypeScript.
  - Read each command before you run it, and run it only inside your project folder. This needs Node.js 18 or newer, so use an AI that can run code or run them yourself.
  - The code samples are written for the @remix-run/react and @remix-run/cloudflare packages. Newer Hydrogen projects import the same names from react-router. Check your package.json and switch the imports to match.
  - This skill has no working customer sign-in or multi-currency code. Use Shopify's hosted Customer Account login, and take any localization code from Shopify's current docs. Never build a form that collects customer passwords yourself.
  - Check that the home, product and collection pages load. If a code sample fails, ask your AI to match it to the router package your project uses.
  - Run the deploy steps to put your storefront on Oxygen.
  - After the storefront loads, run the speed-budget-and-sale-check item to test page speed before launch. When you are ready to go live, use the site-go-live-runbook-writer item to write your launch steps.
output_sample:
  input:
    - Your Shopify store domain
    - Your Storefront API token (kept in .env, not pasted)
    - Your design idea and page list
    - JavaScript or TypeScript (your pick)
  prerequisites:
    - Node.js 18 or newer on your computer
    - Some React knowledge
    - An AI that can run code, or a developer to run the commands
    - A Shopify store
  output:
    - name: What a finished reply looks like
      contains: A file tree for the new project, the commands to run in order, the route files it wrote, and a short list to check first, which is the .env values, the three pages loading and the router imports.
    - name: Hydrogen project
      contains: A new storefront app made with the Hydrogen setup command, using the template and language you pick.
    - name: .env file
      contains: Your session secret, Storefront API token and store domain, kept out of the chat.
    - name: Home page route
      contains: The front page of your storefront, saved as _index.tsx.
    - name: Product page route
      contains: A page that loads one product by its handle, with price, image and an add to cart button.
    - name: Collection page route
      contains: A page that loads a collection and lists its first 24 products.
    - name: Cart route
      contains: Code to add, update and remove cart lines.
    - name: GraphQL queries
      contains: The requests that fetch your products and collections from Shopify.
    - name: Oxygen deploy steps
      contains: The commands to link your store and deploy, plus where to set environment variables.
