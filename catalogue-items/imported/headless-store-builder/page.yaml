thinking: high
thinking_why: A custom storefront has many linked design and code choices.
new_slug: headless-store-builder
name: Headless store builder
summary: Build a TypeScript Shopify storefront from a pinned Hydrogen starter. Get home, product, collection, search and cart pages, plus build and launch checks.
job: build-websites
headline: Headless store builder
subhead: Describe your shop. Start with a pinned React Router storefront and clearly labelled demo products. Connect a real Shopify store only when its owner is ready.
explain: |-
  Build a custom Shopify front end from one pinned TypeScript starter. It includes home, product, collection, search and cart pages. The package file and lockfile keep the checked versions together. The project script creates a new folder and leaves existing projects alone.

  Start with fictional products from mock.shop and a visible demo label. No account or token is needed for this route. On 28 October 2026, the starter passed typecheck, GraphQL checks, a production build, 15 existing local mocked tests and six local page/cart API checks. That does not prove a real payment, customer login, deployment or speed score. Recheck after changing the code.

  A real store needs its owner to connect the intended storefront and keep private tokens outside chat and source control. Customer accounts use Shopify-hosted login. Hosting terms, markets, cart-line changes and checkout need their own checks before launch. The example below describes a real-store handover after the owner supplies the setup.
when:
  - A theme limits the design you want for your shop.
  - Your store is slow and you want faster page loads.
  - You want a custom React front end on top of Shopify.
  - You plan to deploy a storefront to Shopify's own hosting.
not_for:
  - "You want a quick shop with a standard design: use a Shopify theme."
  - "You cannot work with TypeScript, Node.js and project files: use a theme or a developer."
  - "You need a store already verified for real payments, customer login or every market: those checks still need the actual store configuration."
you_give:
  - Your design brief, page list and approved brand assets
  - A new project folder, or existing code to assess a migration
  - Demo or real-store mode; for a real store, its domain and intended environment
  - The owner handles credentials and any sign-in outside chat
you_get:
  - A pinned TypeScript storefront with home, product, collection, search and cart pages
  - The package file, lockfile and local GraphQL checker
  - Actual build results, or clear Not run labels and the remaining commands
  - Owner-run store connection and Oxygen deployment steps
how_to_use:
  - Download the skill folder. Read its create-project script, then run it with a new project folder path. It never overwrites an existing folder.
  - In that project, run npm ci --ignore-scripts --no-audit --no-fund, npm run typecheck and npm run build in order. Stop at the first failure.
  - Run npm run dev. The starting project uses fictional mock.shop products and shows a demo label.
  - Give your AI the design brief, approved assets and requested changes. Use the created route files; do not paste the old Remix examples into them.
  - Run the build checks again after changes. Check product variants, cart changes, keyboard use and small screens. Mark checks you could not run as Not run.
  - The owner connects a real store and keeps private tokens outside chat. Check the intended products, currency, cart and checkout before launch. Customer login needs the hosted OAuth setup.
  - Review the destination, secret settings, hosting terms and actual check results before authorising deployment. In a normal chat, get the plan and commands; do not treat them as executed.
output_sample:
  input:
    - Your Shopify store domain
    - Your Storefront API token (kept in .env, not pasted)
    - Your design idea and page list
    - TypeScript for the pinned starter; other targets need separate work and checks
  prerequisites:
    - Node.js 22.12 or later in the 22 release line, or Node.js 24
    - Some React knowledge
    - An AI that can run code, or a developer to run the commands
    - A Shopify store
  output:
    - name: What a finished reply looks like
      contains: The project path, changed files, pinned versions, commands and actual check results. Checks that could not run are marked Not run.
    - name: Hydrogen project
      contains: A TypeScript React Router storefront from the pinned Shopify template, with an exact package file and lockfile.
    - name: .env file
      contains: MOCK_SHOP=1 for the demo. For a real store, the owner supplies the domain, private token and any required session secret outside chat.
    - name: Home page route
      contains: The home page of the storefront, saved as app/routes/home.tsx.
    - name: Product page route
      contains: A page that loads one product by its handle, with price, image and an add to cart button.
    - name: Collection page route
      contains: A page that loads a collection and lists its first 24 products.
    - name: Cart route
      contains: Code to add, update and remove cart lines.
    - name: GraphQL queries
      contains: The requests that fetch your products and collections from Shopify.
    - name: Oxygen deploy steps
      contains: The commands to link your store and deploy, plus where to set environment variables.
