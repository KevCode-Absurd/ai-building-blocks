thinking: medium
thinking_why: It picks a mindset first, then drafts and compares angles.
new_slug: headline-option-writer
name: Headline option writer
summary: Give it your reader and goal. Get several headline angles that earn the
  click without clickbait or false promises.
job: write-ad-copy
headline: Headline option writer
subhead: Tell it who the headline is for, what they should do next, the channel
  and your provable facts. It writes several headlines for that reader, each
  from a different angle. You get the headlines, why each should work, a pick,
  and a check that no claim goes past your facts.
explain: |
  A set of headline options aimed at one reader, each using a different angle, so you can pick or test the best. Good headlines get noticed because they feel relevant and leave a small gap the reader wants to close. Bad ones promise too much.

  The skill first asks who the reader is, how aware they are of the problem, what you want them to do, where the headline will run, and any length limit. It then picks the mental state needed and writes headlines using different mechanisms, such as contrast, a specific number, a question or a surprising fact. Every line is checked against what you can prove, so there is no clickbait.
when:
  - Your ad or email subject line gets ignored.
  - You are writing a landing page hero and want several angles.
  - You want options for an A/B test.
  - You need a headline that fits a tight character limit.
you_give:
  - Who the headline is for
  - What you want them to do
  - The channel, such as ad, email or page
  - Facts you can prove about the offer
  - Brand voice and length limits (optional)
you_get:
  - Several headlines with different angles
  - A note on why each should work
  - A pick for the best fit
  - A check that no claim goes beyond your facts
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
