thinking: medium
thinking_why: It applies set rules to your data flows.
new_slug: health-data-privacy-checker
name: Health data privacy checker
summary: Check your health app or clinic against HIPAA. Get a list of gaps, safeguards to add and draft notices or agreements. A first-pass HIPAA check.
job: check-contracts
headline: Health data privacy checker
subhead: A first check of whether your handling of patient information meets HIPAA, with gaps listed and fixes drafted. Say how your app, clinic or process uses health data.
explain: |
  This is an imported copy of the MIT-licensed hipaa-compliance skill by Hemant Naik (source link in the credits). We gave it a plain name. It is not a legal tool and it is not affiliated with the author.

  A first check of whether your handling of patient information meets HIPAA, with gaps listed and fixes drafted. Say how your app, clinic or process uses health data. The skill works out whether you are a covered entity or a business associate, then checks the privacy rule, the security rule and breach notification.

  For software, it reviews technical safeguards such as encryption, access control and audit logs. For paperwork, it reviews policies and consent forms. It can then draft privacy notices, business associate agreements, risk assessments, policies and breach letters. Plain-language explanations are available for any rule. Every answer carries a reminder that this is information, not legal advice, so check with a HIPAA attorney before you rely on it.
when:
  - You are building an app that stores patient data and need to know the rules.
  - A client asks if you are HIPAA compliant and you are not sure.
  - You need to draft a business associate agreement.
  - You want to prepare for a security risk assessment.
not_for:
  - "You need a formal risk analysis or a legal ruling on compliance: use a HIPAA attorney or an accredited assessor."
  - "You need to test your system for technical flaws: use a security scanning tool or a penetration tester."
  - "Your data has no link to health care or patients: use a general privacy policy template or ask a privacy lawyer."
  - "Your rules are not US HIPAA, such as EU or UK health data: use the GDPR privacy checker instead."
you_give:
  - A description of your health data use or system
  - Existing policies, notices or architecture notes
  - Who handles the data
  - Your role, such as provider, vendor or developer
you_get:
  - A list of compliance gaps
  - Safeguards to add
  - Draft notices, agreements or policies
  - Plain explanations of the rules that apply
how_to_use:
  - "Open Claude, ChatGPT or Gemini. Paste in the skill instructions (SKILL.md) together with the four files in the references folder: privacy-rule, security-rule, breach-notification and templates. Or upload the whole folder if your AI takes files. The checks and drafts rely on those four files. No code or paid tool is needed."
  - "Gather first: your role, the data flows (where health data comes in, is stored and goes out), your existing policies, and who has access."
  - Describe your app, clinic or process. Say your role and who handles the health data. Use placeholders such as [PATIENT NAME] or [RECORD ID]. Never paste real patient names, IDs or record numbers into Claude, ChatGPT or Gemini.
  - "Start with a first message like this: My role is [provider, vendor or developer]. Our app or clinic does [what it does]. Health data comes in through [source], is stored in [place] and goes out to [who]. These people have access: [roles]. Our current policies are [list, or none]. Use placeholders, never real patient details."
  - Paste any policies, notices or architecture notes you have (optional).
  - Read the gap table first. Fix the high risk items before the rest.
  - Ask for any drafts you need, such as a business associate agreement or privacy notice.
  - Have a HIPAA attorney check the result before you rely on it. Rules and enforcement cases change, so check any date or fine it quotes at hhs.gov first.
output_sample:
  input:
    - A short description of your app, clinic or process and how it uses health data
    - Your role, such as provider, vendor or developer
    - Existing policies, notices or architecture notes (optional)
    - Who handles the data (optional)
  output:
    - name: HIPAA Compliance Review
      contains: Your scope, the rules that apply, what is done well, and a table of issues with rule, risk level and fix.
    - name: HIPAA Technical Assessment
      contains: For software, the data in scope and a checklist of administrative, physical and technical safeguards with notes for your setup.
    - name: Action items
      contains: A prioritized list of fixes to make first.
    - name: Draft documents
      contains: On request, a privacy notice, business associate agreement, policy, risk assessment template or breach letter with placeholders to fill.
    - name: Plain-language explanation
      contains: On request, a short explanation of any HIPAA rule that applies to you.
    - name: Disclaimer
      contains: A reminder that this is information, not legal advice, and a HIPAA attorney should confirm.
next: [gdpr-privacy-checker, privacy-policy-drafter]
