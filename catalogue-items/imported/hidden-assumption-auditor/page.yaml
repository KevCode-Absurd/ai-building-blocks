thinking: high
thinking_why: It must separate fact from belief and rebuild the argument.
new_slug: hidden-assumption-auditor
name: Hidden assumption auditor
summary: Describe a decision or idea. Get its hidden assumptions sorted by how
  fragile they are, then a rebuilt conclusion.
job: think-and-decide
headline: Hidden assumption auditor
subhead: A decision or idea tested against the things you have not questioned.
  Most plans rest on beliefs that feel like facts. This skill digs them out,
  labels them, and rebuilds your conclusion using only what holds up.
explain: |
  A decision or idea tested against the things you have not questioned. Most plans rest on beliefs that feel like facts. This skill digs them out, labels them, and rebuilds your conclusion using only what holds up.

  It works in five phases. First it checks that you are solving the right problem. Then it surfaces 8 to 12 hidden assumptions across three depths. Each gets one of four labels: fact, convention, belief or interest-driven. It scores every assumption for how fragile and how important it is, and names the three most dangerous. It ends by rebuilding the conclusion from verified premises and showing how your thinking shifted. It replies in English or Chinese, whichever you write in.
when:
  - You are about to make a big career, money or business decision.
  - A plan feels solid but you cannot say why.
  - You want to stress-test a product idea before building it.
  - Someone says it has always been done this way and you want to check.
you_give:
  - The decision, idea or belief to test
  - Context and what is at stake
  - What you have already tried or decided (optional)
you_get:
  - A list of hidden assumptions, labelled by type
  - A fragility and impact ranking
  - The three most dangerous assumptions
  - A rebuilt conclusion from verified premises
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
