thinking: high
thinking_why: It must compare sources and judge how fresh each one is.
new_slug: hiring-market-researcher
name: Hiring market researcher
summary: Name a role and a place. Get a hiring market research report with pay ranges, talent supply and how hard the hire will be, from public web pages.
job: hire-people
headline: Hiring market researcher
subhead: A clear picture of the job market for one role in one place, so you know what to offer and how long it will take.
explain: |
  A clear picture of the job market for one role in one place, so you know what to offer and how long it will take. Name the role, level and location. The skill gathers public pay data from sources like job postings, salary sites and surveys, and tells you which ones to trust most.

  It breaks pay into base, bonus, equity and sign-on, and splits it by city, company stage and seniority. It estimates talent supply from pool sizes, candidates open to offers and application volume, and demand from open roles and posting growth. The ratio tells you if candidates or employers hold the power, and how hard the hire will be. It reads public web pages only.
when:
  - You need to set a salary range for a role you have not hired before.
  - A hiring manager thinks the budget is enough and you disagree.
  - You want to know if talent for a role is scarce in your area.
  - You are deciding whether to hire locally or remote.
not_for:
  - "You have hired this role before: start with your own offers and pay data, then use this to check the market."
  - "You need a live view of offers being made this week: ask a recruiter who is placing this role now."
  - "You need exact pay from paid surveys like Radford, Mercer or Carta: buy that data or ask your HR lead, as this skill only reads public pages."
you_give:
  - The role title and seniority
  - The location or remote policy
  - Your budget range (optional)
  - Company stage and size (optional)
you_get:
  - Pay ranges split by component and level
  - A supply and demand read
  - A hiring difficulty rating
  - Advice you can bring to the hiring manager
how_to_use:
  - Open Claude, ChatGPT or Gemini with web search turned on. Paste in the skill instructions.
  - Type the role, seniority and place. Add your budget and company stage if you have them.
  - Tell it which sources you can use, such as paid pay surveys, or paste in numbers you already have. It does not scrape. It reads public pages only. Never give it a login. Pool sizes come only from numbers you paste or pages you can open without a login. Respect each site's terms.
  - Read the summary first. Check the date and source of each pay range.
  - Treat pool sizes and pay ranges as estimates. Check them with a recruiter before you set an offer.
output_sample:
  input:
    - The role title and seniority
    - The location or remote policy
    - Your budget range (optional)
    - Company stage and size (optional)
  prerequisites:
    - An AI that can search the web
    - Pool-size numbers you paste in yourself, or pages you can open without a login (optional)
  output:
    - name: Executive summary
      contains: Three to five key findings, a hiring difficulty rating and the top recommendation.
    - name: Compensation landscape
      contains: Pay ranges by level, split into base and total pay, with place differences and how your budget compares.
    - name: Supply and demand analysis
      contains: Estimated talent pool size, competing open roles, whether candidates or employers hold the power, and the trend.
    - name: Competitive landscape
      contains: Companies hiring for similar roles, how their pay and employer brand compare, and where you can stand out.
    - name: Recommendations
      contains: Advice on where to source, how to position pay, how long to expect, and what risks to plan for.
