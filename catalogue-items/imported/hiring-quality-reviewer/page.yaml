job: hire-people
headline: Hiring quality reviewer
subhead: A way to learn whether a hire was good and what to change next time.
  When a search ends, you usually move on. This skill closes the loop with
  surveys, a review and a plan for the new person's first days.
explain: |
  A way to learn whether a hire was good and what to change next time. When a search ends, you usually move on. This skill closes the loop with surveys, a review and a plan for the new person's first days.

  It sets up check-ins at 30, 60 and 90 days to measure the hiring manager's satisfaction, ramp-up time and whether you would hire the person again. It writes a short survey on how the process felt for the manager and another for candidates. It runs a look back on the search, comparing sources and interviewers to see which predicted good hires. It also sets up a silver medalist list for near misses and a pre-boarding checklist for start day.
when:
  - A search just closed and you want to know what worked.
  - You want to learn which source or interviewer predicts strong hires.
  - You need a short survey for hiring managers or candidates.
  - A new hire starts soon and you want a clean first-day plan.
you_give:
  - Details of the finished search
  - Hiring manager and new hire feedback, if you have it
  - Source of hire and interview scores (optional)
  - Start date
you_get:
  - Survey questions for managers and candidates
  - A look back on the search
  - A 30, 60 and 90 day check-in plan
  - A pre-boarding checklist
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
