thinking: medium
thinking_why: It turns a vague ask into a clear plan.
new_slug: hiring-search-brief-writer
name: Hiring search brief writer
summary: Write a hiring search brief for a hard-to-fill role. Get target companies, channels, a timeline and risks to agree on before you start sourcing.
job: hire-people
headline: Hiring search brief writer
subhead: A one page plan to agree on before you start looking for candidates. Many searches fail because the recruiter and the hiring manager never agreed on who to find, where, how fast or what a good result looks like.
explain: |
  A one page plan to agree on before you start looking for candidates. Many searches fail because the recruiter and the hiring manager never agreed on who to find, where, how fast or what a good result looks like. This brief puts all of that on paper first.

  Give it the role and what the manager asked for. It sets out the target companies and profiles, picks the mix of channels such as direct outreach, referrals, ads or an agency, and recommends whether to run the search contingent, retained or in-house. It adds a timeline with milestones, success measures, and the main risks, like a thin market or a pay mismatch.
when:
  - A hiring manager gives you a vague brief and expects fast results.
  - You need to decide between an agency and an in-house search.
  - The role is hard to fill and you want to set expectations early.
  - A search is stuck and you need to change the approach.
not_for:
  - "You hire many people for a standard role: post it on a job board and run it through your applicant tracking system."
  - "You need to screen or rank candidates you already have: ask a recruiter or the hiring manager to review them with a simple scorecard."
  - "You only need the job ad text: write the ad yourself or ask your AI for a plain job post."
you_give:
  - The role and what the hiring manager wants
  - Location and pay range
  - Deadline
  - Budget for ads or agencies (optional)
  - Whether the search is confidential (optional)
you_get:
  - A search brief to align the manager
  - Target companies and candidate profiles
  - A channel mix and timeline
  - A risk list and questions for the manager
how_to_use:
  - Gather the hiring manager's brief, the location, the pay range and the deadline.
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - "Paste your details and ask: turn this hiring manager brief into a structured search strategy for your role, with target market, channels and timeline."
  - Ask your AI for a one page search brief and a list of questions to ask the hiring manager.
  - Check the pay range, location and must-haves with the manager, then agree on the brief in writing before you start sourcing.
output_sample:
  input:
    - The role and what the hiring manager asked for
    - Location and pay range
    - Deadline for the hire
    - Budget for ads or agencies (optional)
    - Whether the search is confidential (optional)
  output:
    - name: Search brief
      contains: A one page plan for the hiring manager and recruiter to agree on before sourcing starts.
    - name: Target companies and profiles
      contains: The kinds of companies and candidates to look at, based on the role and the market.
    - name: Channel mix
      contains: Which channels to use, such as direct outreach, referrals, ads or an agency, and why.
    - name: Search approach
      contains: A view on whether to run the search contingent, retained or in-house.
    - name: Timeline
      contains: Milestones for the search, with a checkpoint to review if it is working.
    - name: Success measures
      contains: What done looks like for this search.
    - name: Risks and manager questions
      contains: Likely problems such as a thin market or pay mismatch, and questions to ask the manager.
