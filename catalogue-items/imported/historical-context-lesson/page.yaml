thinking: medium
thinking_why: It sequences practice steps for a hard skill.
new_slug: historical-context-lesson
name: Historical context lesson builder
summary: Give it a source and its period. Get a lesson series that teaches learners to use the time and place as evidence.
job: teach-and-train
headline: Historical context lesson builder
subhead: Give it a source and its period. Get a lesson series that teaches learners to use the time and place as evidence.
explain: |
  A lesson series that teaches learners to ask what was happening when a historical source was made, then use the answer as evidence. Many students read a document as if it were written today. Others know the background but never use it. This series fixes both.

  It describes what weak, partial and strong use of context looks like for your age group. Then it lays out teaching steps where you model the thinking first, work through a source together, and then let learners try alone. It adds prompts about time, place and audience, common mistakes and marking signs. It also checks whether the gap is missing background knowledge or a missing skill.
when:
  - Students read old documents as though written today.
  - Learners know the background facts but do not use them when reading.
  - You are planning a unit built around primary sources.
  - You want a way to see if the problem is knowledge or skill.
you_give:
  - The topic or period
  - Learners' age or year group
  - What students do or miss now
  - Documents you will use (optional)
  - What background they already know (optional)
you_get:
  - A progression from weak to strong use of context
  - Teaching steps from modelled to independent
  - Prompts about time, place and audience
  - Signs of progress to check
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
