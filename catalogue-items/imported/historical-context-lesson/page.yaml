thinking: medium
thinking_why: It sequences practice steps for a hard skill.
new_slug: historical-context-lesson
name: Historical context lesson builder
summary: Build a historical context lesson series that teaches students to use time, place and audience as evidence when they read a source.
job: teach-and-train
headline: Historical context lesson builder
subhead: A lesson series that teaches learners to ask what was happening when a historical source was made, then use the answer as evidence. Many students read a document as if it were written today.
explain: |
  A lesson series that teaches learners to ask what was happening when a historical source was made, then use the answer as evidence. Many students read a document as if it were written today. Others know the background but never use it. This series fixes both.

  It describes what weak, partial and strong use of context looks like for your age group. Then it lays out teaching steps where you model the thinking first, work through a source together, and then let learners try alone. It adds prompts about time, place and audience, common mistakes and marking signs. It also checks whether the gap is missing background knowledge or a missing skill.

  Credit: Gareth Manning, education-agent-skills. The skill file also names Sean Hu as contributor. Licence: CC BY-SA 4.0. We renamed it and rewrote the page text. The prompt itself is unchanged.
when:
  - Students read old documents as though written today.
  - Learners know the background facts but do not use them when reading.
  - You are planning a unit built around primary sources.
  - You want a way to see if the problem is knowledge or skill.
not_for:
  - "You want to teach students to check who made a source and why: use a sourcing lesson builder first, or a short talk with your class."
  - "Your students know nothing about the period yet: teach the background first, then come back to this."
  - "You want a single quick quiz or one-off worksheet: write a short set of questions by hand instead."
you_give:
  - The topic or period
  - Learners' age or year group
  - What students do or miss now
  - Documents you will use (optional)
  - What background they already know (optional)
you_get:
  - A progression from weak to strong use of context
  - Teaching steps from modelled to independent
  - Prompts about time, place and audience
  - Signs of progress to check
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Copy the Prompt section from the skill file and paste it into a new chat.
  - "Fill in the three required items: your topic, your students' level and what they do now."
  - Add your documents and what students already know, if you have them.
  - Send it and read the Contextualisation Instruction Plan it returns.
  - Check the Assessment Indicators to see if the gap is missing knowledge or a missing skill, then adjust the teaching steps for your class.
  - Use it in this order: pick sources first (History source set picker), then run this lesson, then practise reading in detail (History close reading).
output_sample:
  input:
    - The topic, period or question your students are studying
    - Your students' age or year group and how much practice they have had
    - What students do now, or fail to do, when they place a source in its time
    - The documents you will use (optional)
    - What background they already know about the period (optional)
  output:
    - name: Contextualisation Progression
      contains: A step-by-step picture of weak, partial and strong use of context, written for your age group.
    - name: Explicit Instruction Sequence
      contains: Teaching steps that move from you modelling the thinking, to working a source together, to learners trying alone.
    - name: Contextualisation Prompts
      contains: Questions about time, place and audience that learners ask of a source.
    - name: Common Failure Patterns
      contains: Mistakes students often make with context, and what to do when you see them.
    - name: Assessment Indicators
      contains: Signs that show whether learners are improving, and whether the gap is knowledge or skill.
next: [history-close-reading, history-think-aloud, history-source-set-picker]
