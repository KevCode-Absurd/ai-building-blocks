thinking: medium
thinking_why: It sequences practice steps for a hard skill.
new_slug: history-close-reading
name: Close reading lesson builder for history
summary: Build a close reading lesson series for history. Give it a topic and a source. You get steps that teach students to read word choice, tone and bias.
job: teach-and-train
headline: Close reading lesson builder for history
subhead: A lesson series that teaches learners to read a history source for how it says things, not only what it says. Students often summarise a document and stop.
explain: |
  A lesson series that teaches learners to read a history source for how it says things, not only what it says. Students often summarise a document and stop. Here they learn to treat word choice, tone and claims as clues to the writer's view.

  The plan lays out three levels: a learner who just pulls out facts, one who spots emotive words but does not connect them to the author, and one who ties specific language to the writer's position and purpose. It then gives a modelled think-aloud, a shared practice task and an independent task. It adds prompts for analysing language, typical mistakes, and marking indicators. It also explains how history reading differs from literary reading.
when:
  - Students summarise sources without commenting on the language.
  - You want learners to notice loaded words and what they reveal.
  - You teach history and literature and need to separate the two skills.
  - You are building a unit on bias in primary sources.
not_for:
  - "You teach literary texts: use your usual literature close reading unit, since history reading asks who wrote it and why."
  - "Your students cannot yet say who wrote a source: teach sourcing first with a short class task, then come back."
  - "You only want a summary of a document: ask your AI for a plain summary instead."
you_give:
  - The topic
  - Learners' age or year
  - What students do now when they read sources
  - Documents you plan to use (optional)
  - Prior close reading teaching (optional)
you_get:
  - Three levels of close reading with signs of each
  - A modelled, shared and independent teaching sequence
  - Prompts on word choice and tone
  - Common mistakes and marking indicators
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat.
  - Add your topic, your students' year, and what they do now when they read a source.
  - Add the documents you plan to use, or describe them (optional).
  - Read the three levels first. Check they match what you see in your class.
  - "Use the teaching sequence in order: model it, practise together, then set the independent task."
  - Mark student work against the assessment indicators.
output_sample:
  input:
    - Your history topic, period or question
    - Your students' age or year and their close reading experience
    - What students do now when they read a source
    - The type of source, such as a speech or letter (optional)
    - The documents you plan to use (optional)
  output:
    - name: Close Reading Progression
      contains: Three levels of close reading, from pulling out facts to tying word choice to the writer's view, with signs of each.
    - name: Explicit Instruction Sequence
      contains: A modelled think-aloud, a shared practice task and an independent task, in teaching order.
    - name: Language Analysis Prompts
      contains: Questions that help students look at word choice, tone and claims as clues to the writer's view.
    - name: Common Failure Patterns
      contains: Typical mistakes students make when reading closely, and how to spot them.
    - name: Assessment Indicators
      contains: Signs you can mark against to see which level a student has reached.
