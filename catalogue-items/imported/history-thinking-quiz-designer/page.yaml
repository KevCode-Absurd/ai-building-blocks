thinking: medium
thinking_why: It matches checks to specific skills.
new_slug: history-thinking-quiz-designer
name: History thinking quiz designer
summary: Design a history thinking quiz that shows how your students source, read, place and compare evidence. Give your skills and topic. Get short tasks.
job: teach-and-train
headline: History thinking quiz designer
subhead: "Short tasks that show how your learners actually think about historical evidence, not just what facts they remember. Pick the skills you teach: checking who wrote a source, reading its language, placing it in its time, or comparing it with other accounts."
explain: |
  Short tasks that show how your learners actually think about historical evidence, not just what facts they remember. Pick the skills you teach: checking who wrote a source, reading its language, placing it in its time, or comparing it with other accounts.

  Each task gives students a short source, like a painting description or a poster, and a prompt where their answer reveals their approach. If your AI writes a source itself, it should label it "written for this task". Check every author, date and archive against a real collection before use. For each task the skill explains what a weak, partial and strong answer looks like, and what that tells you about what to teach next. It adds validity notes, so you know when a task may measure reading level instead of historical thinking.

  Credit: Gareth Manning, education-agent-skills. The skill file also names Sean Hu as contributor. Licence: CC BY-SA 4.0. If you share tasks you adapt from this, credit the author and share them under the same licence. We renamed it and rewrote the page text. The prompt itself is unchanged.
when:
  - You want to know which history skill your class lacks before teaching.
  - You need a quick check after a unit on sources.
  - Students pass fact tests but struggle to argue from evidence.
  - You want an assessment that does not just reward memory.
not_for:
  - "You only want to test recall of dates and facts: write a simple fact quiz yourself, or use a standard quiz tool."
  - "Your learners have not met source analysis yet: teach sourcing first, then come back to check it."
  - "You want a full lesson, not a check: plan the lesson yourself, then use this to test what stuck."
you_give:
  - The skills you teach
  - Topic and age group
  - Sources or artefacts you could use (optional)
  - How much time the task should take (optional)
you_get:
  - A set of short historical thinking tasks
  - What strong, partial and weak answers look like
  - What each answer tells you to teach
  - Notes on fairness and validity
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code or paid tool is needed.
  - "Tell your AI which skills to check: sourcing, close reading, contextualisation, corroboration, or all four."
  - Add your students' age group and level, and what you want to learn from the check.
  - Add your topic, format and time limit if you have them (optional).
  - Read each task and its answer guide. Each set ends with a "Check before use" line. If the AI wrote a source itself, it can still slip in a made-up author, date or archive. Check each one against a real collection, or swap in a real source, before students see it.
  - Use the weak, partial and strong answer notes to plan what to teach next. To check whether the tasks are fair, run them through the Assessment fit and fairness checker. To mark answers, use the Marking rubric writer.
  - Timing: one task takes about 7 minutes. A set of two or three takes about 15 to 20 minutes, which is what it plans for if you give no time limit. Start with a single task.
output_sample:
  input:
    - The history skills you want to check, such as sourcing or contextualisation
    - Your students' age group and level
    - What you want to learn from the check
    - Your topic, format and time available (optional)
  output:
    - name: Task 1
      contains: A short task built on a source, with a prompt that shows how the student thinks.
    - name: Task 2
      contains: A second task aimed at another chosen skill, with its own artefact and prompt.
    - name: Scoring Guide
      contains: For each task, a three-level guide to a basic, partial and full answer.
    - name: Diagnostic Value
      contains: What weak, partial and strong answers look like, and what each tells you to teach next.
    - name: Validity Notes
      contains: Warnings about where a task may measure reading level or background knowledge instead of historical thinking.
