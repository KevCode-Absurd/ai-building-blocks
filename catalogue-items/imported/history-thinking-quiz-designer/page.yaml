thinking: medium
thinking_why: It matches checks to specific skills.
new_slug: history-thinking-quiz-designer
name: History thinking quiz designer
summary: Say which history skills you teach. Get short checks that show how your
  learners source, read, place and compare evidence.
job: teach-and-train
headline: History thinking quiz designer
subhead: "Short tasks that show how your learners actually think about
  historical evidence, not just what facts they remember. Pick the skills you
  teach: checking who wrote a source, reading its language, placing it in its
  time, or comparing it with other accounts."
explain: |
  Short tasks that show how your learners actually think about historical evidence, not just what facts they remember. Pick the skills you teach: checking who wrote a source, reading its language, placing it in its time, or comparing it with other accounts.

  Each task gives students a real artefact, like a painting or a poster, and a prompt where their answer reveals their approach. For each task the skill explains what a weak, partial and strong answer looks like, and what that tells you about what to teach next. It adds validity notes, so you know when a task may measure reading level instead of historical thinking.
when:
  - You want to know which history skill your class lacks before teaching.
  - You need a quick check after a unit on sources.
  - Students pass fact tests but struggle to argue from evidence.
  - You want an assessment that does not just reward memory.
you_give:
  - The skills you teach
  - Topic and age group
  - Sources or artefacts you could use (optional)
  - How much time the task should take (optional)
you_get:
  - A set of short historical thinking tasks
  - What strong, partial and weak answers look like
  - What each answer tells you to teach
  - Notes on fairness and validity
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
