name: Hotel and restaurant buying planner
summary: Give it what you buy. Get a sourcing plan, a supplier shortlist and
  negotiation points to cut costs.
job: plan-supply-chain
headline: Hotel and restaurant buying planner
subhead: A buying plan for your hotel or restaurant that lowers what you pay
  without hurting what guests get. You come away with a supplier shortlist and
  the points to raise when you negotiate.
explain: |
  A buying plan for your hotel or restaurant that lowers what you pay without hurting what guests get. You come away with a supplier shortlist and the points to raise when you negotiate.

  It starts by sizing up your property, your spend and your current suppliers. Then it splits spend into groups: food and drink, cleaning and guest supplies, linens and uniforms, equipment and services. For each group it picks a sourcing approach, such as one main supplier, a group buying deal or local producers. It compares contract types, scores suppliers on price, quality and reliability, and lays out negotiation points and a savings target for each category.
when:
  - Your food costs keep rising and you are not sure which suppliers are
    overcharging.
  - You run several sites and want to buy as one group.
  - A key supplier contract is coming up for renewal.
  - You want sustainability goals reflected in what you buy.
you_give:
  - Property type and size
  - Annual spend by category
  - Current suppliers and contract terms
  - Goals such as cost, quality or sustainability (optional)
you_get:
  - A sourcing plan by spend category
  - A supplier shortlist with scoring
  - Negotiation points for each contract
  - A savings target and action list
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
