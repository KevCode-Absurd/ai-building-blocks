thinking: medium
thinking_why: A policy needs careful limits and plain wording.
new_slug: hr-ai-use-policy-writer
name: HR AI use policy writer
summary: Write an HR AI use policy for hiring. Describe how you use AI. Get a policy draft, a bias check plan and a staff notice. Not legal advice.
job: hire-people
headline: HR AI use policy writer
subhead: A written rulebook for how your HR team may use AI, plus the notices people need to see. Describe how AI touches hiring and people decisions and get a policy, a bias check plan and a plain-language staff notice.
explain: |
  A written rulebook for how your HR team may use AI, plus the notices people need to see. Describe how AI touches hiring and people decisions and get a policy, a bias check plan and a plain-language staff notice. It is not legal advice, so have counsel review it.

  The skill drafts the policy and requires a person to review any AI-assisted decision with real consequences, such as hiring or firing. It builds a review step to run before any new HR AI tool is adopted and a vendor questionnaire on training data and fairness. It adds an escalation path for people who want to challenge a decision, documentation rules, candidate disclosures and training points for HR staff.
when:
  - Your team already uses AI to screen résumés and has no written rules.
  - A new law on automated hiring tools applies to you and you need a plan.
  - You must tell candidates in plain words that AI is part of the process.
  - Managers keep asking what they may and may not do with AI.
not_for:
  - "You need legal sign-off for your state or country: ask an employment lawyer, since this draft does not replace counsel."
  - "You need to write a job post or screen real candidates: do that work yourself or with a hiring tool, as this only writes rules."
  - "You want a ruling on one hiring decision: ask your HR lead or counsel, because this skill writes policy and does not judge single cases."
you_give:
  - How and where HR uses AI today, by hiring stage
  - The decisions AI helps with, such as shortlisting or ranking
  - Your country or state
  - Tools or vendors in use (optional)
  - Existing HR policies (optional)
you_get:
  - An AI use policy draft
  - A bias and risk check outline
  - A candidate and staff disclosure notice
  - A vendor review checklist
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - Describe how HR uses AI today, such as résumé screening. Add your country or state.
  - Add your tools and current policies if you have them.
  - Ask for the policy, the bias check plan, the vendor questions and the notice.
  - Check that each big decision names a person who reviews it.
  - Send the draft to an employment lawyer for your area before you use it.
output_sample:
  input:
    - How and where your HR team uses AI today
    - Your country or state
    - The tools or vendors you use (optional)
    - Your current HR policies (optional)
  output:
    - name: AI use policy
      contains: Rules for how HR may use AI in hiring and performance decisions, with a human review step for big decisions.
    - name: Bias and risk check plan
      contains: A way to test an AI hiring tool for unfair results, and how often to test again.
    - name: Tool adoption review
      contains: Steps HR must follow before it adopts any new AI tool.
    - name: Vendor questions
      contains: A checklist on training data, testing and fairness to put to the tool maker.
    - name: Candidate and staff notice
      contains: A plain-words note telling people where AI is used in decisions about them.
    - name: Challenge and escalation path
      contains: How a person can contest an AI-assisted decision and who handles it.
    - name: Records and training points
      contains: What HR must write down about AI-assisted decisions, and what staff should learn.
