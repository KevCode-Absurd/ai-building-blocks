thinking: high
thinking_why: It plans many linked experiments and keeps the trail.
new_slug: hypothesis-tree-optimizer
name: Hypothesis tree optimizer
summary: Improve a project step by step with a hypothesis tree optimizer. Give it a goal and a scoring command. You get tested changes and a full log.
job: research-topics
headline: Hypothesis tree optimizer
subhead: Give it a project, a goal and a command that scores results. It tests many ideas one at a time in clean copies of your project. You get the changes that passed, plus a record of every try.
explain: |
  A steady way to improve a piece of work by testing many ideas and remembering every result. Give it something you can change, a goal and a way to score it, and it runs experiments one after another while keeping a ranked tree of ideas.

  It first pins down four things: the starting material, the goal, a fast scoring command for the search, and a separate held-out test used only before accepting a change. It writes each idea as a node, tests it in a fresh copy so files stay clean, records the evidence and prunes dead ends. A bundled Python tool does the bookkeeping. You need Python 3.10 and Git. It suits model training, agent tuning and prompt improvement.
when:
  - Your agent or prompt passes only some tests and you want it to get better step by step.
  - You are tuning a training recipe and have lost track of what you tried.
  - You have a script that scores results and want many experiments run for you.
  - You need an honest record of what worked and what failed.
not_for:
  - "You want one quick fix to a single file: ask your AI to make the change by hand and run your tests yourself."
  - "Your project has no repeatable score, or you cannot put it under Git: set up a scoring command first, or ask a person to review the work."
  - "You want a one-off research answer from the web: use a normal chat with web search instead."
you_give:
  - The project or file to improve, kept under Git
  - Your goal, and whether a higher or lower score is better
  - A command that scores a candidate and runs fast
  - A separate held-out test, used only before a change is accepted (optional)
  - An AI provider key, for fully automatic runs (optional)
you_get:
  - A tree of ranked ideas, each with its status
  - The score from every experiment
  - A log of what worked and what failed
  - An improved version of your project, plus a final report
how_to_use:
  - Open your AI tool and add the skill folder, or paste in the skill file. It needs an AI that can run code and use files.
  - Check that Python 3.10 or newer and Git are on your computer, and that your project is under Git.
  - Tell your AI your goal, which direction is better, and your scoring command. Add a held-out test if you have one.
  - Let it run the loop. It lists ideas, tests each in a clean copy, and records every score.
  - Read the tree and the final report. Check that each accepted change also beat the held-out test.
  - Automatic runs that call an AI by themselves need a provider key and network access. The bundled tracking tool works without them.
output_sample:
  input:
    - Your project or file to improve, kept under Git
    - Your goal and which direction is better
    - A command that scores a candidate
    - A separate held-out test, used only before a change is accepted (optional)
  prerequisites:
    - An AI that can run code and keep files between steps
    - Python 3.10 or newer and Git
    - An AI provider key and network access, only if you want fully automatic runs
  output:
    - name: Hypothesis tree
      contains: Ranked ideas, each with its status, the insight it produced, and a pointer to the version that tested it.
    - name: Experiment evidence
      contains: The score from each isolated experiment, written down before any idea is kept or dropped.
    - name: Pruned branches
      contains: Dead ends marked as closed, with the reason, so nobody tries them again.
    - name: Held-out check
      contains: The comparison on the separate test that decides if a change is accepted.
    - name: Improved project
      contains: Your code or file with the accepted changes only.
    - name: Final report
      contains: What worked, what failed, and what to try next, built from the report template.
