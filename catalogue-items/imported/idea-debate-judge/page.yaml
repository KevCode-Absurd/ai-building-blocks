thinking: medium
thinking_why: It plays two sides and then weighs both.
new_slug: idea-debate-judge
name: Idea debate judge
summary: Give it an idea. Get a three-round debate between a fan and a critic,
  then a clear verdict.
job: think-and-decide
headline: Idea debate judge
subhead: A verdict on your idea after both sides have argued it. Give it a
  concept, feature or project and get a three-round debate between a supporter
  and a critic, then a judge's summary.
explain: |
  A verdict on your idea after both sides have argued it. Give it a concept, feature or project and get a three-round debate between a supporter and a critic, then a judge's summary.

  In round one, the supporter makes the strongest case and the critic names the biggest risks. In round two, each answers the other's points. In round three, both give closing statements. The rules say neither side may simply agree or disagree; each must argue from logic, market facts and how hard it is to build. A neutral orchestrator then steps in as judge and writes a summary with the key arguments and a clear call on whether to go ahead, with what to watch.
when:
  - You have a new idea and cannot tell if it is worth your time.
  - You must choose between product features and want the best arguments for
    each.
  - You want to test an assumption before you start building.
  - Your own view is too one-sided and you need the other case.
you_give:
  - The idea in a few sentences
  - Who it is for (optional)
  - Constraints such as time or budget (optional)
you_get:
  - A three-round debate transcript
  - Strongest points for and against
  - A judge's summary and verdict
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
