thinking: medium
thinking_why: It opens up options first, then narrows to the best one.
new_slug: idea-sharpener
name: Idea sharpener
summary: Turn a rough idea into a one-page concept. Your AI widens your options, tests them and cuts them to one clear direction to act on.
job: test-an-idea
headline: Idea sharpener
subhead: A rough idea turned into a one-page concept worth acting on. Share what you have and it widens your options, tests them hard and cuts them down to one clear direction.
explain: |
  A rough idea turned into a one-page concept worth acting on. Share what you have and it widens your options, tests them hard and cuts them down to one clear direction.

  The first stage restates your idea, asks pointed questions and creates variations. The second stage groups the options, stress-tests them and brings hidden assumptions into the open. The third stage writes a markdown page with the problem, the recommended direction, key assumptions, the smallest first version and a list of things you will not do. It asks before saving the file into your project. It works as a back-and-forth chat, so expect to answer questions along the way.
when:
  - You have a vague idea and need to know what it really is.
  - You want to compare a few versions of a plan before picking one.
  - You fear a plan has hidden weak spots and want them found.
  - You need a short page to share with a partner or developer.
not_for:
  - "You do not know what you want yet: talk it through with a friend or a coach first, then come back with a rough idea."
  - "You already picked a direction and need a full spec: write the spec with your AI or a developer."
  - "You want a market size, sales forecast or price test: use real customer research instead."
you_give:
  - Your rough idea
  - Who it is for (optional)
  - Limits on time, money or skills (optional)
  - Answers to its sharpening questions
you_get:
  - Variations of the idea
  - A list of assumptions to check
  - A one-page concept
  - A not-doing list to keep scope tight
how_to_use:
  - "Before you start, have three things ready: who the idea is for, how you will know it worked, and any limit on time or money."
  - Open Claude, ChatGPT or Gemini. Paste the skill text into a new chat. No code or paid tool is needed. In a plain chat, the skill's file reads and question pop-ups do not run, so ask your AI to ask the questions in plain text and write the one-pager in the chat.
  - This copy does not include the skill's three extra files (frameworks, refinement criteria and examples). The shorter version in the skill text is intended.
  - Type your rough idea. Answer the 3 to 5 questions it asks. It will not go on until it knows who the idea is for and what success looks like.
  - Read the 5 to 8 variations. Say which ones you like and which you do not.
  - Read the directions it compares and the assumptions it names. Push back if something feels wrong.
  - Ask for the one-page concept. If your AI can save files, it will ask before saving. Otherwise copy the page into your own notes.
  - Test the top item on the Key Assumptions list with real people before you build. Send the Not Doing list to your developer or partner.
output_sample:
  input:
    - Your rough idea, in a few lines
    - Who it is for (optional)
    - Limits on time, money or skills (optional)
    - Your answers to its 3 to 5 questions
  prerequisites:
    - An AI chat you can talk back and forth with
    - "Optional: an AI that can save files, if you want the page saved"
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: Problem Statement
      contains: Your idea restated as one "How Might We" sentence.
    - name: Recommended Direction
      contains: The direction it picked and why, in two or three short paragraphs.
    - name: Key Assumptions to Validate
      contains: A checklist of things you are betting on, each with a way to test it.
    - name: MVP Scope
      contains: The smallest first version that tests your main bet, with what is in and out.
    - name: Not Doing (and Why)
      contains: Good ideas you will skip for now, each with a reason.
    - name: Open Questions
      contains: Questions to answer before you start building.
