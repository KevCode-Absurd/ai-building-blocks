thinking: high
thinking_why: It argues against the idea from several sides.
new_slug: idea-stress-test-panel
name: Idea stress-test panel
summary: Give it your idea. Get a blunt panel review of what is weak, with what
  to fix before you build.
job: test-an-idea
headline: Idea stress-test panel
subhead: A blunt review of your idea from five angles before you spend time or
  money on it. Claude tends to agree with you, so this one is built to push
  back, then a judge makes one call.
explain: |
  A blunt review of your idea from five angles before you spend time or money on it. Claude tends to agree with you, so this one is built to push back, then a judge makes one call.

  You answer three or four questions: what it is, who pays and how, your edge and your limits. Five reviewers then go to work: the Critic, the Champion, the Analyst, the Investigator and the Customer. None may hedge or be polite. A judge weighs them and gives a single verdict with what to fix first. Small Python helper scripts build the brief and compute the verdict. They use no outside services. It works in Claude Code and on Claude.ai.
when:
  - You are about to build a product and want to hear what is wrong with it
    first.
  - Friends keep saying your idea is great and you do not trust it.
  - You need to know if customers would really pay.
  - You want a fast reality check before you quit a job or spend savings.
you_give:
  - The idea in one or two sentences
  - Who it is for and how it makes money
  - Your skills, audience or assets
  - Budget and timeline
you_get:
  - Five reviews from different angles
  - What is weak and why
  - A single judge's verdict
  - A short list of fixes before you build
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
