thinking: high
thinking_why: It argues against the idea from several sides.
new_slug: idea-stress-test-panel
name: Idea stress-test panel
summary: Stress test your business idea before you build it. Five reviewers push back, then a judge says go, reshape or kill, with a 48-hour test.
job: test-an-idea
headline: Idea stress-test panel
subhead: A blunt review of your idea from five angles before you spend time or money on it. Claude tends to agree with you, so this one is built to push back, then a judge makes one call.
explain: |
  A blunt review of your idea from five angles before you spend time or money on it. Claude tends to agree with you, so this one is built to push back, then a judge makes one call.

  The five reviewers are AI role-plays, not real buyers. The 48-hour test is where real market data comes from.

  You answer three or four questions: what it is, who pays and how, your edge and your limits. Five reviewers then go to work: the Critic, the Champion, the Analyst, the Investigator and the Customer. None may hedge or be polite. A judge weighs them and gives a single verdict with what to fix first. Small Python helper scripts build the brief and compute the verdict. They use no outside services. It works in Claude Code and on Claude.ai.
when:
  - You are about to build a product and want to hear what is wrong with it first.
  - Friends keep saying your idea is great and you do not trust it.
  - You need to know if customers would really pay.
  - You want a fast reality check before you quit a job or spend savings.
not_for:
  - "You want to be asked questions until your plan is clear, with no verdict: ask your AI to interview you one question at a time instead."
  - "You need a board memo for a company with many staff: use a real advisor or your leadership team."
  - "Your idea is already live and you have sales data: look at your own numbers or talk to your customers."
you_give:
  - The idea in one or two sentences
  - Who it is for and how it makes money
  - Your skills, audience or assets
  - Budget and timeline
you_get:
  - Five reviews from different angles
  - What is weak and why
  - A single judge's verdict
  - A short list of fixes before you build
how_to_use:
  - Open Claude Code for the full version. It runs all five reviewers at once and can search the web for the Investigator.
  - Add the skill, then type /roast and your idea. Answer the three or four questions it asks, in one go.
  - Check the brief it writes. Fix anything thin, because all five reviewers read the same brief.
  - Read the five reviews, then the verdict and the 48-hour test. Run the test before you build anything.
  - On Claude.ai or another chat app, paste the skill and ask your AI to play the five reviewers one after another. Turn on web search for the Investigator, or paste in competitor facts yourself.
  - "After the test: if it passes, build the smallest version. If it fails, take the reshape advice or drop the idea, then run the panel again on the new version."
output_sample:
  input:
    - Your idea in one or two sentences
    - Who it is for and how it makes money
    - Your skills, audience or assets (your edge)
    - Your budget and how fast you need the first sale
  prerequisites:
    - An AI that can run several reviewers at once and search the web, such as Claude Code, for the full version
    - Python on your computer, only if you want to run the three helper scripts
  output:
    - name: Shared brief
      contains: One paragraph with your idea, buyer, price, edge and limits, plus a note on anything still missing.
    - name: The Critic
      contains: The fatal flaws and the fastest way the idea dies, with a score from 1 to 10.
    - name: The Champion
      contains: The strongest case for the idea and its biggest upside, with a score from 1 to 10.
    - name: The Analyst
      contains: Whether the logic and the money work from first principles, with a score from 1 to 10.
    - name: The Investigator
      contains: Competitors, demand signals and what similar products charge, from web search, with a score from 1 to 10.
    - name: The Customer
      contains: A first-person reaction from your buyer on whether they would pay, with a score from 1 to 10.
    - name: The Verdict
      contains: Go, reshape or kill, with confidence, why, biggest risk, biggest upside and a money read.
    - name: The cheapest 48-hour test
      contains: The smallest test of your riskiest assumption, with a cost and a clear pass or fail line.
