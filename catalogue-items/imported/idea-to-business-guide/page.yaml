thinking: high
thinking_why: It runs a long chain of decisions that depend on one another.
new_slug: idea-to-business-guide
name: Idea to business guide
summary: Test a business idea step by step. You get a proven customer, a clear position, a price and the first market to win, saved as short files.
job: test-an-idea
headline: Idea to business guide
subhead: A step-by-step path from a raw idea to a business you can defend. You get a tested customer, a clear position, a price and the first market to win, each saved as a short document.
explain: |
  A step-by-step path from a raw idea to a business you can defend. You get a tested customer, a clear position, a price and the first market to win, each saved as a short document.

  It runs ten phases in order. First, the job the customer hires you for. Then a check that the problem is real, by talking to buyers. Then tests with five customers and a small first product. Then strategy, positioning, an offer, pricing and the first segment to win. A tracker file records progress so you can pause and resume. At each phase it asks you to decide, then you approve the draft before it is saved.
when:
  - You have a business idea and no clear path from here.
  - You want proof of demand before you spend money building.
  - You need a price and offer, and do not know what people will pay.
  - You come back to the idea each week and want your progress saved.
not_for:
  - "Your business already has paying customers: use a growth or fix-it guide for sales and operations, not this idea test."
  - "You want to build the product, app or website: use a build tool for that step, since this guide stops at the plan."
  - "You want one method on its own, like customer interviews: run that single skill directly, not all ten phases."
you_give:
  - Your business idea
  - Who you think the customer is
  - Your skills, budget and time (optional)
  - Notes from customer conversations (optional)
you_get:
  - A customer document
  - An experiments log
  - A strategy and positioning document
  - An offer and pricing plan
how_to_use:
  - Gather your idea in a few sentences, your guess at the customer, and any interview notes (optional).
  - Use an AI tool that can read and write files, such as Claude Code or Claude with file access. File access may need a paid plan of that AI tool. The skills themselves are free.
  - "Add the ten skills this guide runs, one command each: npx skills add wondelai/skills/<name> --global, for jobs-to-be-done, mom-test, design-sprint, lean-startup, good-strategy-bad-strategy, blue-ocean-strategy, obviously-awesome, hundred-million-offers, monetizing-innovation and crossing-the-chasm. Then add this skill to the same project. If you skip a skill, the guide runs that phase from a short built-in method instead."
  - Ask your AI to follow this skill and start at the intake questions.
  - Answer each question, then approve each draft before it is saved to the docs folder.
  - Come back later and say you want to resume. The tracker file shows where you stopped.
output_sample:
  input:
    - Your business idea in a few sentences
    - Who you think the customer is
    - Your skills, budget and time (optional)
    - Notes from customer conversations (optional)
  prerequisites:
    - An AI that can read and write files in a project folder
    - The ten skills this guide runs, added with npx skills add
    - Time for several sessions, since this is a long guide and not a one-shot answer
  output:
    - name: docs/CUSTOMER.md
      contains: The job your customer hires you for, plus what you learned from real customer conversations.
    - name: docs/EXPERIMENTS.md
      contains: The tests you ran with five customers and what they showed.
    - name: docs/PRODUCT.md
      contains: The smallest first product (MVP) and the riskiest assumption it tests.
    - name: docs/STRATEGY.md
      contains: The one critical challenge, the open space you can own, and the first market segment to win.
    - name: docs/POSITIONING.md
      contains: How you explain what you are and what makes you different, in 30 seconds.
    - name: docs/OFFER.md
      contains: Your offer and your price, based on what customers say they will pay.
    - name: docs/CREATE-BUSINESS-PLAN.md
      contains: A progress tracker with the status of every phase, key decisions and next actions, so you can pause and resume.
