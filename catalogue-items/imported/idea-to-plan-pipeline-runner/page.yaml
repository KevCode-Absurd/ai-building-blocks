thinking: high
thinking_why: Each of five phases feeds the next and needs real research.
new_slug: idea-to-plan-pipeline-runner
name: Idea to plan pipeline runner
summary: Give it a raw idea. Get clarifying questions, research, a product brief
  and a phased plan, as four files.
job: build-product
headline: Idea to plan pipeline runner
subhead: Give it a raw idea. Get clarifying questions, research, a product brief
  and a phased plan, as four files. Bring your raw idea or problem statement.
  Use an AI that can search the web and save files.
explain: |
  Four files that take a raw idea to something you can start building on Monday: clarifying questions, deep research, a product brief and a phased plan. It was made for founders and hobbyists as well as product managers.

  It first sorts your idea by size, from weekend tool to marketplace, and by how technical you are, so the depth and word choice fit. Then it asks questions, researches the market and competitors, writes the product brief and builds a phased plan. Each step feeds the next, and the plan ends with kill criteria, which are the signs that you should stop. Research can include customer jobs and strengths and weaknesses of rivals.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to Slashworks-biz and sickn33.
when:
  - You have an idea but no clue what to research first.
  - You want to know if the market is crowded before you build.
  - You need a product brief to hand to a developer.
  - You want clear signs for when to stop a project.
you_give:
  - Your raw idea or problem statement
  - Your technical level
  - Answers to clarifying questions
  - Budget and time limits (optional)
you_get:
  - A clarifying questions file
  - A research file on market and competitors
  - A product brief
  - A phased plan with stop criteria
how_to_use:
  - You need an AI that can search the web and save files. The skill file says WebSearch and WebFetch. That means your AI's own web search and page reading, and any tool with those works. No paid service or key is needed beyond your AI plan.
  - Add the skill to your AI. In Claude, upload it as a skill in your settings. In ChatGPT, add the files to a project. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat.
  - Give your AI your raw idea and say how technical you are. It sorts the idea by size and writes a questions file.
  - Answer every question before research starts. If you skip some, it must say which assumptions it made.
  - Let it research and write the product brief, then the phased plan. It works best when your AI can search the web and save files. If yours cannot, it should go on only with the assumptions it states, and mark every number it could not source as [assumption]. Check every number in the research against its source.
  - Save the four files in order: questions, research, brief, plan. Review the stop criteria after the first phase.
  - Next, hand the brief to the Idea to dev brief writer or the Product requirements writer.
not_for:
  - You want a quick gut-check, not four files. Use the Idea sharpener.
  - You already know what to build and only need requirements. Use the Product requirements writer.
  - You need a short brief a developer can build from. Use the Idea to dev brief writer.
output_sample:
  input:
    - Your raw idea or problem, in a few sentences
    - How technical you are
    - Your answers to the clarifying questions
    - Budget and time limits (optional)
  prerequisites:
    - An AI that can search the web and save files
  output:
    - name: questions.md
      contains: Four to 18 clarifying questions, grouped by who and pain, scope, and constraints and goals.
    - name: research.md
      contains: Problem check, market size with sources, competitors, strengths and weaknesses, first-100-users channels, risks and insights.
    - name: PRD.md
      contains: The problem statement, named personas, ranked customer jobs, non-goals and success measures.
    - name: plan.md
      contains: A step-by-step user flow, platform and tool picks, a phased build with stop criteria, and the next few actions.
