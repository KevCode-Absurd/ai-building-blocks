thinking: high
thinking_why: It runs many separate arguments and weighs them against each other.
new_slug: idea-trial-jury
name: Idea trial jury
summary: Put your plan on trial. A prosecutor, a defender and 12 jurors argue it, then give a verdict and what would flip it.
job: think-and-decide
headline: Idea trial jury
subhead: Give it a plan or claim. Get a verdict from a prosecutor, a defender and 12 jurors, plus what would flip it. Bring the idea, plan or claim. Use the result to plan your next step.
explain: |
  A verdict on your plan, argued like a court case, for the times when Claude agrees with everything you say. A prosecutor builds the case against it, a defender builds the case for it and a jury of twelve independent Claudes votes without seeing each other.

  You play no part in the argument. The skill acts as clerk, keeps the record and never softens the result. A Python script handles the bookkeeping, with a quick mode and a juror count. You get the vote count, the reasons and what facts or changes would flip the verdict. It suits a plan, a purchase, a post, a code approach or a claim. It needs Python and the ability to run subagents.

  Licence: the written text of this skill is shared under CC BY-4.0 (the LICENSE-CONTENT file). The "MIT" line in the SKILL.md header is the original author's own note (Alex Chen). Keep the credit to the author.
when:
  - You keep getting yes from AI and want a real challenge.
  - You are deciding whether to make a big purchase or change.
  - You want to know how a claim holds up before posting it.
  - You need an outcome from many views, not one.
not_for:
  - "You need legal, medical or financial advice: ask a qualified human adviser, because the jury is made of AI models."
  - "Your idea has no details yet: write down your goal, numbers and limits first, or talk it through with a trusted person."
  - "You have no Claude Code or Python 3: ask your AI for a plain list of pros and cons instead."
you_give:
  - Your idea, plan or claim
  - Facts the court should know, like numbers, budget and timeline (optional)
  - Number of jurors from 3 to 12, or quick mode (optional)
you_get:
  - The case for and the case against
  - A jury vote count with reasons
  - A clear verdict
  - What would flip the decision
how_to_use:
  - Open Claude Code and add this skill. It needs Python 3 and the ability to start helper agents.
  - Type /court, then your idea. Add facts such as numbers, budget and what you have tried.
  - Add --quick for 6 jurors. It runs fewer helper calls and uses less of your plan.
  - Approve the plan size your AI shows you, then let the trial run.
  - Read the verdict, the vote table and the conditions for acquittal in VERDICT.md.
  - To retry, change your plan using those conditions and run /court again.
  - Next, turn the conditions into a dated test, or save the verdict as a decision note. It pairs with the Idea validation analyst.
output_sample:
  input:
    - Your idea, plan or claim, in your own words
    - Facts the court should know, like numbers, budget and timeline (optional)
    - Number of jurors from 3 to 12, or quick mode (optional)
  prerequisites:
    - Claude Code, which can start helper agents
    - Python 3 on your computer
    - "Room on your Claude plan: a full trial uses 17 helper calls, and quick mode uses 11"
  output:
    - name: case.md
      contains: Your idea in one sentence, plus every fact you gave, with no opinion added.
    - name: Opening arguments
      contains: The prosecutor's case against your idea and the defense's case for it.
    - name: Rebuttals
      contains: Each side answers the other side's strongest points.
    - name: Jury votes
      contains: One vote with reasons from each juror, who never sees the other jurors.
    - name: Judge's sections
      contains: The judge's reading of the trial and the conditions for acquittal.
    - name: VERDICT.md
      contains: The verdict line, the vote table, and the changes or facts that would flip the result.
