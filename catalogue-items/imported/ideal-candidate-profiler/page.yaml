thinking: high
thinking_why: It infers motives and habits that the job post never states.
new_slug: ideal-candidate-profiler
name: Ideal candidate profiler
summary: "Turn a job description into an ideal candidate profile: their motives, where they spend time and how to reach them. Built for sourcing and outreach."
job: hire-people
headline: Ideal candidate profiler
subhead: "A picture of the person you want to hire that goes beyond the job description. Give it a job description and get a profile of who fits, what moves them, where they spend time and how to reach them."
explain: |
  A picture of the person you want to hire that goes beyond the job description. Give it a job description and get a profile of who fits, what moves them, where they spend time and how to reach them.

  A job description lists what the company needs. A profile describes the person. The skill fills in career path, years of experience, education patterns and kinds of companies they came from. It adds their main and related skills, tools and what they are learning now. It then covers what attracts them to a move and what puts them off. Last it lists where they gather online and offline, and what message would catch their attention, for use in sourcing outreach.
when:
  - Your job post gets many applicants and none are right.
  - You are a recruiter hunting for a hard-to-find role.
  - You need outreach that speaks to what the person cares about.
  - You want to know which communities to search for a role.
not_for:
  - "You want to screen or rank named people: use a structured interview and your own hiring checklist, not a persona."
  - "You need the job post itself rewritten: ask a recruiter or writer to redraft it from your notes."
  - "You want to treat the result as fact about real people: check it against your past hires and your hiring manager first."
you_give:
  - The job description
  - Your company type and culture
  - A great past hire as an example (optional)
  - Pay and location limits (optional)
you_get:
  - A candidate persona
  - Motivators and turn-offs
  - Places they spend time
  - Outreach angles to try
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. It needs no code and no paid tool.
  - Paste your job description. Add your company type and culture.
  - Add a great past hire as an example, and any pay or location limits, if you have them.
  - Ask your AI to build the candidate persona.
  - Read the result with your hiring manager. Fix anything that does not match your real hires.
  - Use the outreach themes and community list to plan your sourcing. Leave out age, family status and other protected traits.
  - Check before use. The persona is an assumption. Test it against your past hires and real market data. It is not evidence about any named person.
output_sample:
  input:
    - Your job description
    - Your company type and culture
    - A great past hire as an example (optional)
    - Pay and location limits (optional)
  output:
    - name: Who They Are
      contains: A short story of one typical candidate, with their day, what they care about and their career.
    - name: Professional Profile
      contains: Likely titles, years of experience, career path, education, company types and industries.
    - name: Technical Identity
      contains: Core skills, tools, what they are learning now, and skills that often come with their main ones.
    - name: What Motivates Them
      contains: What attracts them, what pushes them to leave, how they judge offers and what turns them off.
    - name: Where to Find Them
      contains: Online platforms, communities, events and content they use, ranked by how likely they are to be there.
    - name: How to Engage
      contains: Best first channel, message themes that fit, mistakes to avoid and good timing.
    - name: Counter-Offer Risk
      contains: How likely their current employer is to counter, and how to reduce that risk.
    - name: Alternative Personas
      contains: One or two other backgrounds that could fill the role.
