new_slug: ignition-delay-simulator
name: Ignition delay simulator
summary: Give it a fuel mix, heat and pressure. Get an ignition delay with
  checks that the result is sound.
job: track-numbers
headline: Ignition delay simulator
subhead: Give it a fuel mix, heat and pressure. Get an ignition delay with
  checks that the result is sound. Bring a reaction model file and its source.
  Use the result to plan your next step.
explain: |
  A calculated ignition delay for a fuel mix at a set temperature and pressure, with checks that show whether the number can be trusted. It simulates a closed, sealed, uniform gas mixture using the Cantera chemistry library.

  You pick the reaction model first and confirm it covers your fuel and conditions. Then you choose constant volume or constant pressure to match the real experiment and enter units in kelvin, pascals, seconds and mole amounts. A template file holds your conditions. The helper defines ignition by temperature rise and heating-rate peak, so the result is exact. A finished run proves only that the math ran, not that the model fits your fuel. It needs Python, Cantera and NumPy.
when:
  - You need the time a fuel mix takes to ignite at engine-like conditions.
  - You are comparing simulation with shock tube measurements.
  - You want to check that a reaction model suits your fuel.
  - A result looks odd and you suspect two-stage ignition.
you_give:
  - A reaction model file and its source
  - Fuel and oxidizer mix in moles
  - Starting temperature and pressure
  - Constant volume or constant pressure choice
you_get:
  - An ignition delay time
  - The exact definition used for ignition
  - The normalized starting mix
  - Notes on whether the result is reliable
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run Python code.
