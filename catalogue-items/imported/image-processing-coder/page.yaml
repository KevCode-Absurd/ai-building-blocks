thinking: medium
thinking_why: It picks the right method for each image task.
new_slug: image-processing-coder
name: Image processing coder
summary: Describe what you want done to your images. Get MATLAB image processing code that cleans, splits, counts or measures them.
job: build-software
headline: Image processing coder
subhead: Say what to do to your pictures. Get MATLAB code that enhances, segments, counts or measures them. Bring a sample image or a description of it. Use the result to plan your next step.
explain: |
  Working MATLAB code that cleans up, splits, counts or measures what is in your pictures, so you skip hours of trial and error with the Image Processing Toolbox. MATLAB and the Image Processing Toolbox are paid products from MathWorks, so check for a MathWorks trial or a school or work licence before you start.

  You describe the image problem in plain words, such as dark, noisy, blurry or uneven light. The skill first picks the right method for the task, then writes code with the right data types and row and column order, since mistakes there ruin results quietly. It covers file input and output, filtering, thresholding, morphology, measurement, colour, transforms and quality scores. Medical, hyperspectral and inspection jobs get passed to other skills.
when:
  - You have a folder of microscope photos and need the cells counted.
  - Your scans are dark or uneven and you need them cleaned before analysis.
  - You need to measure the size of objects in a set of pictures.
  - You want to align or stitch several images into one.
  - You are unsure which MATLAB function suits your image problem.
not_for:
  - "You work with DICOM or NIfTI medical scans: use the Medical scan reader instead."
  - "You have hyperspectral data or factory defect inspection: use the Spectral image analyst or the Machine vision inspector builder."
  - "You need point clouds, 3-D reconstruction, video stabilization or code generation: use Computer Vision Toolbox or MATLAB Coder directly."
you_give:
  - A sample image or a description of it
  - What you want done to it
  - Your MATLAB setup and toolbox list (optional)
you_get:
  - MATLAB code you can run
  - The method chosen and why
  - Notes on data types and image size
  - Measurements or masks from your images
how_to_use:
  - Open your AI chat and paste in this skill's instructions, or load the skill folder if your AI tool supports files.
  - Describe your image problem in plain words, such as dark, noisy, blurry or uneven light.
  - "Gather first: your MATLAB release and toolbox list, how many images are in the folder, and the pixel size or the known size of one object in your images. Add a sample image or a short description of it, plus what you want done, such as counting cells about 15 pixels wide."
  - "Run the code in MATLAB. You need MATLAB and the Image Processing Toolbox for it to work, and both are paid licences. Some tasks need more paid toolboxes: matching features to align images needs the Computer Vision Toolbox, and deep learning needs the Deep Learning Toolbox. Ask your AI which toolboxes your task needs before you start. Only some AI tools can run MATLAB for you. In a plain chat, paste the code into MATLAB yourself and tell the AI what happened."
  - Check the figures and counts against a few images you know well, then run the whole folder.
  - Check the counts or masks against hand counts on a few images. Then export them to a spreadsheet or report. For medical scans, inspection or very large images, use the Medical scan reader, Machine vision inspector builder or Huge image processor.
next: [huge-image-processor, medical-scan-reader, image-viewer-builder]
output_sample:
  input:
    - A sample image, or a plain description of it
    - What you want done, such as count, measure, clean up or align
    - Any known sizes, such as how wide each object is (optional)
    - Your MATLAB version and toolbox list (optional)
  prerequisites:
    - MATLAB with the Image Processing Toolbox
    - An AI that can run MATLAB code, or that you can paste code from into MATLAB
  output:
    - name: Method choice
      contains: The method picked for your task and the reason it fits your image problem.
    - name: MATLAB code
      contains: A script that reads your images, processes them and writes or shows the result.
    - name: Data type and size notes
      contains: Which data types and row and column order the code uses, so results stay correct.
    - name: Masks or measurements
      contains: The masks, counts or measurements the code produces from your images.
    - name: Figures
      contains: Plots that show the image before and after, so you can check the result.
