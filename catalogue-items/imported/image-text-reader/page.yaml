thinking: medium
thinking_why: It tries preprocessing steps until the text reads well.
new_slug: image-text-reader
name: Image text reader
summary: Read text from a photo of a sign, meter or receipt with MATLAB. Hard images get cleaned up first. Needs paid MATLAB and the Computer Vision Toolbox.
job: build-software
headline: Image text reader
subhead: The text from a sign, meter, label or receipt photo, read out in a form you can copy. Hard images get cleanup first, so a glare-covered display or a skewed label still gives usable words.
explain: |
  Start here: give it a photo of a sign, meter, label or receipt. You get the text back, plus a script that repeats the job. You need paid MATLAB and its Computer Vision Toolbox, and your AI must be able to run MATLAB code. No MATLAB? Paste the photo into your AI chat or use a free phone scanner app instead.

  Licence: BSD 2-Clause, as LICENSE.md says. It lets you use this skill only with MathWorks products, so it is not for use with other tools.

  It cleans up hard images first, so a display with glare or a skewed label still gives usable words. It runs in MATLAB with the Computer Vision Toolbox and two add-on support packages, all of which need a MathWorks licence.

  The skill looks at the picture first and writes a short plan before any code runs. It then picks a text finder, cleans the image, and runs recognition. It tries at most two cleanup recipes, then stops and asks you rather than guessing. It sets the layout mode whenever you give it a box. Handwriting, fancy lettering and CAPTCHAs are named as things it cannot read.
when:
  - You already have paid MATLAB with the Computer Vision Toolbox and want to read text from photos.
  - You photographed a meter or display and need the number typed out.
  - You have scans of printed labels and want the serial numbers as text.
  - A photo of a sign has glare or a busy background that breaks reading.
  - You need text pulled from a whole folder of images.
  - You want text in more than one language read from the same picture.
not_for:
  - "You need to read handwriting, cursive, fancy lettering or CAPTCHAs: type it by hand, because this skill cannot read them."
  - "You do not have MATLAB with the Computer Vision Toolbox: use a free phone scanner app or paste the photo into your AI chat to read it."
  - "You need tables or full page layouts pulled from documents, or text from live video: use a dedicated document tool instead."
you_give:
  - The image or a folder of images
  - Which part holds the text, if known (optional)
  - The language of the text (optional)
you_get:
  - The recognised text
  - A short plan describing the image and the cleanup chosen
  - Confidence checks on each result
  - MATLAB code to repeat the job
how_to_use:
  - "Check you have paid MATLAB, the Computer Vision Toolbox, and the two support packages for text detection and OCR language data. Licence: this skill is BSD 2-Clause, and you may use it only with MathWorks products."
  - Open an AI tool that can run MATLAB code and paste in this skill.
  - Give it your image or folder. Add the text area and language if you know them (optional).
  - Read the short plan it writes first. It looks at your image before any code runs.
  - Type in what the text really says if you can. Without it, the error figures (CER and WER, the share of letters and words read wrong) only show that MATLAB agrees with the AI's own reading of the image. They do not prove the text is right.
  - Each word gets a confidence score from 0 to 1, which is how sure MATLAB is. Treat any word below 0.6 as unverified until you have checked it against the image.
  - If it is unsure, it asks you to confirm the text. Answer so it can tune the cleanup.
  - Next, re-run the saved MATLAB file on a whole folder of images, and compare the decision log between runs. The decision log records how the image was judged and what cleanup was chosen. Send the checked text to a spreadsheet or your records.
  - "Where the files go: the AI saves the re-runnable MATLAB file (named ocr_pipeline_ plus a short description of the image) and decision_log.txt in your MATLAB working folder. Keep both with your results. To tidy the text into a clean sheet, use the messy-spreadsheet-cleaner item. If the photo is too dark or uneven to read, run image-processing-coder first."
output_sample:
  input:
    - Your image, or a folder of images
    - The part of the image that holds the text (optional)
    - The language of the text (optional)
    - The text you know the image should say (optional, to check accuracy)
  prerequisites:
    - An AI that can run MATLAB code
    - A paid MATLAB licence with the Computer Vision Toolbox
    - The Text Detection Using Deep Learning and OCR Language Data support packages
  output:
    - name: OCR Plan
      contains: Two lines on what the image shows and what makes it hard, plus the cleanup and reading strategy chosen.
    - name: Preprocessing and detection
      contains: The cleaned image and the text areas found, using the cleanup recipe that worked best.
    - name: Recognised text
      contains: The words read from the image, each with a confidence score so you can spot weak reads.
    - name: Accuracy check
      contains: Character and word error rates, which only mean something when compared with text you supply.
    - name: MATLAB pipeline file
      contains: Saved code that repeats the same steps on other images.
    - name: Results block
      contains: A success or failed summary shown after the files are saved to disk.
