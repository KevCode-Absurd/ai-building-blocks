thinking: high
thinking_why: Rules vary by country and each answer needs careful reasoning.
new_slug: import-export-paperwork
name: Import and export paperwork advisor
summary: Check tariff codes, duty options and documents for an import or export. Give your goods and route. You get a source-based paperwork review.
job: check-contracts
headline: Import and export paperwork advisor
subhead: Share product, origin, route and value; get a source-based tariff review, duty options, and the facts still needed.
explain: |
  Share the product, origin, route and value. The skill checks current official sources and shows supported codes, duties and unknowns. Confirm shipment decisions with a licensed broker.

  The skill sorts your goods by the Harmonized System, working through the General Rules of Interpretation in strict order. It points out common mistakes, such as classing a multi-function device by its priciest part. It picks a fitting Incoterm and lists the documents: commercial invoice, packing list, certificate of origin, bill of lading, and the US security filing and entry summary where they apply.

  Source note: shared by sickn33 in agentic-awesome-skills. The skill file says it began in ai-evos/agent-skills. Licence: CC BY-4.0 (LICENSE-CONTENT). Dollar amounts, rates and deadlines in the skill are indicative examples, so check each one with the customs authority.
when:
  - You are shipping a new product abroad and need its tariff code.
  - You are unsure which trade terms to put in a sales contract.
  - Customs held your shipment and asked for papers you lack.
  - You want to know which free trade deal might cut your duty.
  - You need a checklist of documents before a first import.
not_for:
  - "You need a final customs declaration filed or a seizure answered: use a licensed customs broker."
  - "You need legal advice on sanctions, export licences or a penalty notice: ask a trade lawyer."
  - "You want a firm tariff rate with no checking: confirm it on the official tariff site of the importing country."
you_give:
  - A description of the goods, with a material breakdown by weight or percentage and what each part does
  - The origin and destination countries
  - The value and sale terms (optional)
  - Any papers you already have (optional)
you_get:
  - A supported tariff code or the facts still needed
  - Duty options to check
  - A document list with sources and check dates
  - Trade term suggestions
  - Common mistakes to avoid
how_to_use:
  - Open Claude, ChatGPT or Gemini with web search turned on.
  - Paste the skill instructions into the chat.
  - Add your goods, materials, use, origin, destination, value and transport mode.
  - Read Open questions first and send the missing facts.
  - Open each official source link and confirm the code and rate yourself. Check any penalty amount or filing deadline in the result against the customs authority's current guidance. The amounts in the skill may be out of date.
  - Share the result with a licensed customs broker before you ship.
output_sample:
  input:
    - A description of your goods, with materials, function and use
    - The origin and destination countries and the transport mode
    - The value and sale terms (optional)
    - Any papers you already have (optional)
  prerequisites:
    - An AI that can search the web, so it can check official tariff sources
  output:
    - name: Supported codes
      contains: The tariff code the evidence supports, with the reasoning for it, or the facts still needed to pick one.
    - name: Duty options
      contains: Possible duty rates and free trade deals that might cut the duty, to confirm on the official tariff site.
    - name: Documents
      contains: The papers your route needs, each with its official source link and the date it was checked.
    - name: Trade terms
      contains: A suggested Incoterm for your sale and what it means for who pays and who carries risk.
    - name: Common mistakes
      contains: Errors to avoid in classing and valuing your goods and in filling in forms.
    - name: Open questions
      contains: Anything unresolved, missing or in conflict between sources, marked as not confirmed.
