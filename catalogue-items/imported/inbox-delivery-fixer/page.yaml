thinking: medium
thinking_why: It follows set steps but needs your setup details.
new_slug: inbox-delivery-fixer
name: Inbox delivery fixer
summary: Share your sending domain. Get checks on your email sender records (SPF, DKIM and DMARC) and a staged repair plan.
job: write-emails
headline: Inbox delivery fixer
subhead: It checks the three records that prove your email is really from you (SPF, DKIM and DMARC). You get the settings to change at your domain host and steps to review. Good setup cannot promise inbox delivery.
explain: |
  A setup and repair plan so your emails reach the inbox, not the spam folder. You get the exact records to add for SPF, DKIM and DMARC, plus a way to watch your sender reputation.

  The skill works from three pillars. First is authentication, the three DNS records that prove mail really comes from you. Then comes reputation, which builds on clean lists and steady sending. Last is content and monitoring. It asks for your domain, your email provider, your current records and your volume. It then checks what is missing, sets a safe order to switch DMARC from watching to blocking, and gives a pre-launch check before you send more.
when:
  - You set up email on a new domain and want it trusted from day one.
  - Customers say your emails never arrive.
  - You want to stop people faking your domain in scam emails.
  - You are switching email providers and want no gap in delivery.
  - Your spam complaints or bounces have started to climb.
not_for:
  - "You need the email text written: use an email writing tool or write it yourself, since this fixes delivery, not content."
  - "You send spam from your account without meaning to: reset your passwords and ask your email provider to check for a break-in."
  - "You only need help with DNS settings in general: ask your domain host's support team."
you_give:
  - Your sending domain or domains
  - Your email provider
  - Your current DNS records (optional)
  - Daily volume, split between marketing and transactional
  - Bounce and complaint rates, if known (optional)
you_get:
  - The SPF, DKIM and DMARC records to add
  - A staged DMARC rollout plan
  - A reputation monitoring routine
  - A list of likely causes of spam placement
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Add your sending domain, your email provider and your daily volume.
  - Paste your current DNS records if you have them. If not, say so and your AI will list what to look up.
  - Add the records your AI gives you at your domain host. Start DMARC in watch mode, not blocking.
  - Check your DMARC reports for 2 to 4 weeks, then move to stricter settings in the order your AI gives.
  - The logo step (BIMI) is optional. It needs a trademarked logo and a paid certificate with a yearly cost.
output_sample:
  input:
    - Your sending domain or domains
    - Your email provider or sending tool
    - Your current DNS records (optional)
    - Your daily email volume, marketing and transactional
    - Your bounce and spam complaint rates (optional)
  prerequisites:
    - Access to your domain's DNS settings, to add the records
    - A way to check DNS records, such as a command line or a free web checker (optional)
  output:
    - name: Domain inventory
      contains: Every domain that sends your email.
    - name: Authentication status
      contains: Whether SPF, DKIM and DMARC are set up and correct for each domain.
    - name: Sender inventory
      contains: Each service that sends mail for you and how it is set up.
    - name: Reputation status
      contains: How major mailbox providers see you, where this can be measured.
    - name: List hygiene
      contains: Your bounce rate, complaint rate and how people sign up.
    - name: Findings
      contains: The problems found, in order of what to fix first.
    - name: Roadmap
      contains: The SPF, DKIM and DMARC records to add, the DMARC rollout steps and the optional logo step.
    - name: Monitoring setup
      contains: What to watch, where to watch it and who gets alerts.
