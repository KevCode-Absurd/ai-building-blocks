thinking: medium
thinking_why: It sorts many messages and drafts replies.
new_slug: inbox-triager
name: Inbox triager
summary: "Triage your inbox with AI: sort recent email, check new senders and get reply drafts in your voice. It never sends a thing."
job: organise-work
headline: Inbox triager
subhead: Your recent email sorted by what needs you, with new senders checked and reply drafts waiting. It never sends anything, so you stay in control of every message.
explain: |
  Your recent email sorted by what needs you, with new senders checked and reply drafts waiting. It never sends anything, so you stay in control of every message.

  The skill reads the files made by the inbox setup skill: your sorting scheme and reply voice, plus optional rate cards or evaluation rules. It then classifies each new message, looks up unknown senders, and writes a recommendation for each one: reply, decline, delegate or ignore. Drafts follow your tone and your hard rules. It ends with a short report in the format you chose. It stops with a clear message if the required setup files are missing. Run it once or a few times a day.
when:
  - You come back from a day away and have 200 unread emails.
  - You want unknown senders checked before you answer.
  - You want reply drafts in your voice to approve or edit.
  - You want a short morning summary of what matters.
  - You need pitches and requests judged against your own rules.
not_for:
  - You have not run the inbox setup yet. Run the inbox setup skill first, because this skill stops without its files.
  - You share an inbox with a team. Use a plain triage prompt in your AI and go through the messages by hand.
  - You want email sent for you. This skill only writes drafts, so send them yourself or ask a person to help.
you_give:
  - Access to your recent emails
  - The setup files from the inbox rules interviewer
  - How often you want it to run (optional)
you_get:
  - Messages sorted into your categories
  - Background on new senders
  - A recommendation for each message
  - Draft replies, never sent
  - A short report
how_to_use:
  - Check first that your AI is connected to your email (Gmail, Outlook or IMAP). The skill stops if it is not.
  - Check that your Email folder has the sorting scheme and reply voice files from the inbox setup skill.
  - Paste the skill into your AI, or upload the skill folder.
  - Say "triage my inbox". Add how far back to look if you want.
  - Read the report first, then open your reply drafts. Edit and send the ones you want yourself.
output_sample:
  input:
    - Access to your recent email through an email connector
    - Your sorting scheme and reply voice files from the inbox setup
    - Your rate card and evaluation rules (optional)
    - How far back to look (optional)
  prerequisites:
    - An AI that can read your email, such as through a Gmail, Outlook or IMAP connector
    - The files made by the inbox setup skill, saved in your Email folder
    - An AI that can save files
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: Overview
      contains: Two or three sentences on what came in and whether anything is urgent.
    - name: Stats
      contains: Counts of emails processed, drafts made, items that need action and items skipped.
    - name: Action Needed
      contains: Overdue items, decisions, drafts to review and deadlines.
    - name: Quick Reference
      contains: One line per email, in order by sender, with a short summary and a recommendation.
    - name: Detailed Cards
      contains: Opportunities, active threads and flags, each with the sender, subject, category, advice and key context.
    - name: Footer
      contains: When the report was made and a summary of what changed in your files.
    - name: Reply drafts
      contains: Replies in your voice saved in your email app, never sent.
    - name: Triage log
      contains: A dated file in your Email folder that records this run.
