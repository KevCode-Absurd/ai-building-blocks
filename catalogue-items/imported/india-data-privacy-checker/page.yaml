thinking: medium
thinking_why: It applies a set law to your facts.
new_slug: india-data-privacy-checker
name: India data privacy checker
summary: Describe your India data use. Check current Act and Rules sources,
  map possible duties and list facts to confirm.
job: check-contracts
headline: India data privacy checker
subhead: Share your data use, purpose and role in India; get a dated map of
  possible duties and open questions.
explain: |
  Share your data, purpose and role. The skill checks current Indian sources, maps possible duties by start date and flags unknowns.

  The skill checks the 2023 Act and 2025 Rules, which have phased start dates. It uses terms such as data fiduciary and data principal. You describe how you collect and use data, and it maps supported provisions and gaps by effective date.
when:
  - You collect customer data in India and need to know your duties.
  - You already follow GDPR and want to see what differs in India.
  - You must write a consent notice that meets Indian rules.
  - You want a gap list for the phased start dates.
  - A client asks how you protect personal data of people in India.
you_give:
  - How you collect, store and share personal data
  - Where your users and servers are
  - Your current privacy notice and consent forms (optional)
  - Any children's data you handle (optional)
you_get:
  - Possible duties with official sources and effective dates
  - Gaps against your current practice
  - A prioritised fix plan
  - Notes on how it differs from GDPR
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
