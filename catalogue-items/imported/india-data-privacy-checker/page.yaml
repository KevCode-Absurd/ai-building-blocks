thinking: medium
thinking_why: It applies a set law to your facts.
new_slug: india-data-privacy-checker
name: India data privacy checker
summary: Check your India data privacy duties under the DPDP Act and Rules. Get possible duties by start date, gaps in your practice and facts to confirm.
job: check-contracts
headline: India data privacy checker
subhead: Share your data use, purpose and role in India; get a dated map of possible duties and open questions.
explain: |
  Share your data, purpose and role. If your AI can browse the web, the skill checks official Indian sources, maps possible duties by start date and flags unknowns. If it cannot browse, you get a list of unknowns, not confirmed duties.

  The skill works from the 2023 Act and 2025 Rules, which have phased start dates. Section numbers, penalty amounts and dates in the skill file are not verified by us. Match each one to the official notices before you rely on it. It uses terms such as data fiduciary and data principal. You describe how you collect and use data, and it maps supported provisions and gaps by effective date.
when:
  - You collect customer data in India and need to know your duties.
  - You already follow GDPR and want to see what differs in India.
  - You must write a consent notice that meets Indian rules.
  - You want a gap list for the phased start dates.
  - A client asks how you protect personal data of people in India.
not_for:
  - "You need legal advice or a final compliance sign-off: ask a qualified lawyer in India."
  - "Your records are on paper only and never turned digital: the Act does not cover them, so no check is needed."
  - "You only need EU rules: ask a privacy lawyer or use the official GDPR text, as this checks India's law."
you_give:
  - How you collect, store and share personal data, ideally as a simple data-flow map (what is collected, where it is stored, who receives it)
  - Where your users and servers are
  - Your current privacy notice and consent forms (optional)
  - Any children's data you handle (optional)
you_get:
  - Possible duties with official sources and effective dates
  - Gaps against your current practice
  - A prioritised fix plan
  - Notes on how it differs from GDPR
how_to_use:
  - Open Claude, ChatGPT or Gemini. Use one that can browse the web, so it can check current Gazette dates and other official sources. Without web access the result is only a list of unknowns, because the skill will not state a duty as confirmed.
  - Paste the skill instructions into the chat, or upload the skill folder if your AI accepts files.
  - "Before you start, write a simple data-flow map: what personal data you collect, where it is stored, and who receives it (staff, vendors, other countries). Paste it in. It saves guesswork on the first run."
  - Describe how you collect, store and share personal data. Say who your users are and where your servers are.
  - Add your privacy notice and consent forms if you have them. Mention any children's data.
  - Read the source list and dates first. Record the web address and the date you checked each source. Answer any questions about missing facts.
  - Check the duties, gaps and fix plan with a qualified lawyer before you act.
  - Take the fix plan into your privacy notice drafting and your handling of user rights requests.
output_sample:
  input:
    - How you collect, store and share personal data
    - Where your users and servers are
    - Your current privacy notice and consent forms (optional)
    - Any children's data you handle (optional)
  prerequisites:
    - An AI that can look up current official sources on the web, or official links you paste in yourself
  output:
    - name: Source check
      contains: The official Act, Rules and notices used, with links and the date each was checked.
    - name: Role and facts
      contains: Your likely role, your data, your purpose and the facts still missing.
    - name: Possible duties
      contains: Duties that may apply to you, each tied to a section or rule and its start date.
    - name: Gap analysis
      contains: Where your current practice falls short, including children's data and Significant Data Fiduciary checks if they apply.
    - name: DPDPA vs GDPR notes
      contains: Main differences for teams that already follow GDPR.
    - name: Fix plan
      contains: Gaps in order of priority, with questions to confirm with counsel.
