name: India data privacy checker
summary: Describe how you handle personal data in India. Get your duties, gaps and a plan under the DPDP Act.
job: check-contracts
headline: India data privacy checker
subhead: Describe how you handle personal data in India. Get your duties, gaps and a plan under the DPDP Act.
explain: |
  A clear read of what India's data protection law asks of you, where you fall short, and what to fix first. It fits Indian companies and any company handling data about people in India.

  The skill works from the 2023 Act and the 2025 Rules, with a full compliance date of 13 May 2027. It uses the law's own words: data fiduciary, data principal, consent manager. It stresses the points that surprise people used to GDPR: it covers digital data only, and has just two lawful bases, consent and a closed list of legitimate uses, with no general balancing test. You describe how you collect and use data, and it maps duties and gaps.
when:
  - You collect customer data in India and need to know your duties.
  - You already follow GDPR and want to see what differs in India.
  - You must write a consent notice that meets Indian rules.
  - You want a gap list before the 2027 deadline.
  - A client asks how you protect personal data of people in India.
you_give:
  - How you collect, store and share personal data
  - Where your users and servers are
  - Your current privacy notice and consent forms (optional)
  - Any children's data you handle (optional)
you_get:
  - A list of your duties under the law
  - Gaps against your current practice
  - A prioritised fix plan
  - Notes on how it differs from GDPR
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
