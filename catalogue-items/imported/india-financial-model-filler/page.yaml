thinking: medium
thinking_why: It fills linked sheets and checks they balance.
new_slug: india-financial-model-filler
name: Statement model template filler for India
summary: Fill a blank income statement, balance sheet and cash flow template for an Indian company, with April to March years and crore units done right.
job: money-and-investing
headline: Statement model template filler for India
subhead: Give it a blank three-statement model and the company's results. It fills each tab with live formulas, links the three statements and checks that the balance sheet balances. Gaps are listed, not guessed.
explain: |
  This is a three-statement model filler for Indian companies. You bring an Excel template with an income statement, a balance sheet and a cash flow statement. It fills in the numbers and links them, so a change in one place flows through the rest.

  It sets Indian years first. FY2025 ends on 31 March 2025, and each quarter shows its months. It also avoids a common Excel trap. One common number format shows millions under a crore label, so the figure is 10 times too big. This skill divides by 10,000,000 in a live formula instead.

  It works one statement at a time and stops for you to confirm. After the income statement, it checks the totals. After the balance sheet, it checks that assets equal liabilities plus equity. After cash flow, it checks that ending cash matches the balance sheet. Anything it cannot fill goes on a gap list.
when:
  - You have a blank three-statement template and need it filled from an annual report.
  - Your model mixes lakh and crore and the totals look wrong.
  - Your years are labelled by calendar year, and you need April to March labels.
  - The balance sheet does not balance and you suspect broken links between tabs.
not_for:
  - You have no template yet and want a full valuation. Use the DCF model builder for India instead.
  - You already have a finished model and want it checked for unit and year errors. Use the India modeling rules checker.
  - Your AI cannot run commands or edit files. The build uses a command-line tool, so a plain chat will only give you instructions.
  - The company is not Indian. The year, unit and tax rules here are for India.
you_give:
  - A blank or part-filled model template (.xlsx) with income, balance sheet and cash flow tabs
  - The company's results, such as the annual report or an NSE or BSE filing
  - The years or quarters to cover, such as FY2023 to FY2025
  - Your own growth and margin assumptions (optional)
you_get:
  - A filled model saved as a new file, with live formulas
  - Period labels like FY2025 (ends 31 Mar 2025)
  - Crore figures from a live divide-by-10,000,000 formula
  - A balance check and cash tie-out for every period
  - A gap list of cells it could not fill
how_to_use:
  - Use an AI that can run commands and read your files, such as Claude Code. Install the officecli tool first.
  - Open the skill. Give your AI the template and the company's results files, and tell it which years to fill. The US-only parts of the skill, the SEC filing guide and the 80% tax loss limit, are skipped for Indian companies.
  - Check the tab map it shows you before it touches any cell. Fix the mapping if a tab is read wrongly.
  - Approve each statement in turn, starting with historicals, then income statement, then balance sheet, then cash flow.
  - Open the Checks tab. Every balance and cash check should pass before you use the model.
  - Read the gap list. Fill those cells from the filing yourself, then move on to valuation.
output_sample:
  input:
    - A model template (.xlsx) with income statement, balance sheet and cash flow tabs
    - The company's annual report or results filing
    - The periods to fill, such as FY2023 to FY2025
    - Your growth and margin assumptions (optional)
  prerequisites:
    - An AI that can run commands and edit files
    - The officecli tool installed
  output:
    - name: Filled model (.xlsx)
      contains: Your template with historical figures and live formulas for projections, saved as a new file.
    - name: Period labels
      contains: Years labelled by fiscal year, such as FY2025, with quarters showing their months.
    - name: Crore columns
      contains: Figures in crore, made by dividing by 10,000,000 in a formula, never by a number format.
    - name: Balance and cash checks
      contains: A pass or fail for assets against liabilities plus equity, and for cash, in every period.
    - name: Change list
      contains: What was filled on each tab, so you can review it fast.
    - name: Gap list
      contains: Each cell it left as MISSING, with the reason and where to find the number.
works_best_with:
  tools:
    - name: Claude Code
      why: Can run officecli, edit the workbook and check it in one session.
    - name: Excel
      why: Lets you open the filled model and review the formulas yourself.
  inputs:
    - The company's own results filing, not a data site summary
    - Last year's version of the model, if you have one
    - Your own forecast drivers
terms:
  - term: Three-statement model
    meaning: An income statement, balance sheet and cash flow statement linked in one workbook.
  - term: Crore
    meaning: An Indian unit. One crore is 10,000,000.
  - term: Fiscal year
    meaning: In India it runs April to March. FY2025 ends 31 March 2025.
  - term: officecli
    meaning: A command-line tool that builds Excel files. It must be installed first.
