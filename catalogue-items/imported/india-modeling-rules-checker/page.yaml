# Adapted from the Apache-2.0 source: corrected Excel scale labels and the stated crore error factor.
thinking: medium
thinking_why: It applies a fixed list of rules, then judges the fit.
new_slug: india-modeling-rules-checker
name: India modeling rules checker
summary: Give it an Indian company model. Get April to March years, crore units,
  Ind AS and listing rules checked.
job: money-and-investing
headline: India modeling rules checker
subhead: "Your Indian company model checked for the quiet mistakes that make
  numbers wrong: fiscal years, crore units, accounting standards and listing
  rules. You get a list of faults and the fix for each."
explain: |
  Your Indian company model checked for the quiet mistakes that make numbers wrong: fiscal years, crore units, accounting standards and listing rules. You get a list of faults and the fix for each.

  The biggest trap is units. In Excel, each trailing comma in a number format divides by a thousand, so no comma pattern gives crore. Two commas scale to millions; under a crore heading, the displayed value is ten times the correct crore figure. The skill checks for that and for bare calendar years where April to March years belong. It also reviews Ind AS conventions and listing-related expectations. Items with no Indian equivalent, like some consensus data, are named as missing, never replaced by a look-alike.
when:
  - A colleague built a model and the figures look off by a large factor.
  - You are about to send a model to a client or investor.
  - You need to confirm fiscal year labels are right.
  - You are moving a model from a US layout to an Indian one.
  - You want a review checklist for Indian financial files.
you_give:
  - The model file or its key sheets
  - The company and reporting periods
  - The intended audience (optional)
you_get:
  - A list of unit and label errors
  - Fixes for number formats
  - Ind AS and listing checks
  - A list of data that has no Indian equivalent
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
