new_slug: industrial-crt-image-direction
name: Plan an archival CRT image
summary: "Plan an archival CRT image: give your subject and get a prompt for dark, grainy, scanline-soft stills, plus checks for identity and clarity."
job: make-images
headline: Plan an archival CRT image
subhead: Give it a subject and, if you have one, a reference image. It writes a prompt for a dark, soft, old-screen look. You also get checks to run on the image.
explain: Bring a subject and reference image. Choose the capture view, then get a prompt and checks.
when:
  - You need an image that looks like a recovered tape from a technical archive.
  - You have a subject and want a moody, near-black-and-white look.
  - Your first image looks too clean and needs the flaws of an old screen.
  - You want to check that the subject still looks right after the heavy styling.
not_for:
  - "You want a bright, colorful or glossy product shot: ask your AI for a plain studio photo prompt instead."
  - "You need to follow a named brand's locked visual rules: use that brand's own style guide."
  - "You want a finished video: this gives a still-image prompt, so use a video tool and its own guide."
you_give:
  - Your subject and the details that must stay recognizable.
  - What the image will be used for.
  - A reference image (optional).
  - Your choice of CRT-screen view or real-camera view (optional).
you_get:
  - One still-image prompt with framing, a single main light and the signal flaws named.
  - A numbered checklist for subject, anatomy, shapes and labels.
  - A short list of limits to note, such as text the image tool drew badly.
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Type your subject, the details that must stay, and what the image is for.
  - Say if you want the CRT-screen view or the real-camera view. Attach a reference image if you have one.
  - Copy the prompt into your image tool. It needs an image tool that can make pictures.
  - If you gave a reference, attach the image itself in that tool. A text description is not enough.
  - Run the checklist on the result. If two tries fail, change the shot rather than add more darkness.
output_sample:
  input:
    - Your subject, such as an object, person or place
    - The details that must stay recognizable
    - What the image is for
    - A reference image (optional)
    - Your choice of CRT-screen view or real-camera view (optional)
  prerequisites:
    - An image tool to make the picture. This skill writes the prompt but does not make the image.
  output:
    - name: Capture view
      contains: Your pick between an image shown on a CRT screen and a real scene filmed by an old analog camera.
    - name: Prompt block
      contains: One still-image prompt with the subject, framing, one main light, black space and the recording flaws.
    - name: Identity and clarity checklist
      contains: Numbered checks for the subject, anatomy, object shapes and any labels, to run on the image.
    - name: Open limitations
      contains: A short list of anything the image tool could not do, or facts still missing.
how_it_works:
  - title: Choose the capture layer
    text: Distinguish an image shown on a CRT from a real scene recorded by an analog camera.
  - title: Build the frame
    text: Name the subject, geometry, dominant practical light, negative space and recording defects.
  - title: Review identity and clarity
    text: Check anatomy, object geometry and necessary labels before assessing the archival treatment.
thinking: medium
thinking_why: It weighs your evidence and follows a specific method.
