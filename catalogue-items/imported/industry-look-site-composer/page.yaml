thinking: medium
thinking_why: It applies known layout patterns for each industry.
new_slug: industry-look-site-composer
name: Industry-look site composer
summary: Make your site look like your industry. Give it your type of site and get composition notes for a store, restaurant or maker site.
job: build-websites
headline: Industry-look site composer
subhead: Name your kind of site, such as a store, a restaurant or a parts maker. Get notes on page layout, how much to show on each page and how the menu should work, so the site looks like it belongs to your field.
explain: |
  Page layouts that look like they belong to your type of business, so a shop looks like a shop and a restaurant looks like a restaurant, not a generic software landing page. A site can be clean and still feel off for its field.

  The skill decides which modules go where, how dense a page should be, how much of the catalogue shows at once, and how navigation is set up for that kind of site. It works best when fed the output of a competitor experience audit, so you build to the standard of your field. It does not set brand identity, build single components or handle accessibility; other skills do that.
when:
  - You are building a site in an industry you have not worked in before.
  - Your site is tidy but still looks generic for its category.
  - You have a competitor review and need to turn it into a layout.
  - You are building a demo that must look like a real store or firm.
  - Visitors expect certain sections and yours lacks them.
not_for:
  - "You want to tweak colours, fonts or spacing: use the Page design standards checker, which handles day-to-day visual choices."
  - "You need to build one button, card or form: ask your AI to build that single part. This skill plans whole pages."
  - "You want to judge your competitors first: look at a few competitor sites and write down what they share, then bring your notes here."
you_give:
  - Your site shape, picked from the ten allowed shapes (ecommerce-catalog, ecommerce-standout, hospitality-food, hospitality-experience, b2b-manufacturer, local-service-booking, directory-marketplace, inventory-listing, subscription-app, institution-mission)
  - Your industry or type of site
  - A competitor audit (optional)
  - Your product or catalogue size
  - Your brand direction (optional)
you_get:
  - Page layouts for your industry
  - Module placement and density guidance
  - Navigation and merchandising rules
  - A list of what visitors expect to see
how_to_use:
  - "Know this first: the skill names companion skills (information-architecture, frontend-component-build and accessibility-audit) that are not in this library. Where it hands work to them, that work goes to your designer or developer, as the hand-off list."
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code running or paid tool is needed.
  - Say what kind of site you are building, for example a small restaurant, a store or a parts maker.
  - Match your site to one shape and use its file in the references folder. A store with products to browse uses shape-ecommerce-catalog. A store with a distinctive brand angle uses shape-ecommerce-standout. A restaurant or cafe uses shape-hospitality-food. A hotel, venue or experience uses shape-hospitality-experience. A parts maker or industrial seller uses shape-b2b-manufacturer. A booking business such as a salon or repair service uses shape-local-service-booking. A directory or marketplace uses shape-directory-marketplace. Listings such as cars or homes use shape-inventory-listing. A subscription app uses shape-subscription-app. A charity, school or nonprofit uses shape-institution-mission.
  - Add your competitor audit if you have one, plus the size of your catalogue or menu. No audit? Name your type of site and say you have no audit. It then works from its notes for each type of site. The Competitor site experience auditor and the Page design standards checker are in this library. The companion skills information-architecture and frontend-component-build are not. If you do not have an audit, use the matching references/shape-*.md file, such as shape-ecommerce-catalog.md, as your audit substitute. The checklist you get is then general, so check it against two or three real competitor sites before you build.
  - "It writes a notes file named composition-[site-shape]-[brand-slug].md, or gives the notes in the chat. Check its five sections: the site shape, the build decisions, the conventions checklist, the wedge and the hand-off list. Add every convention marked absent to your plan."
  - Pass the hand-off list to your designer, or to the design and component skills, to build the pages.
  - "Trust signals must be real. Show only reviews, certifications, client logos, licences and insurance you can prove. In a demo, label any placeholder as a sample so no one reads it as real."
output_sample:
  input:
    - Your industry or type of site, such as store, restaurant or maker
    - A competitor audit result (optional)
    - How big your product list or menu is
    - Your brand direction (optional)
  prerequisites:
    - Competitor-experience-audit result, if you want to build to a measured standard (optional)
    - An AI that can write a markdown file, or just paste the notes from chat
  output:
    - name: Site shape and experience bar
      contains: Which type of site you are building and which audit, if any, the notes follow.
    - name: Dimension-by-dimension build decisions
      contains: Choices for the main task, layout and density, product or menu display, navigation, brand tone and trust signals.
    - name: Synthesis checklist
      contains: Each expected convention for your type of site, marked present, absent or handed to another skill.
    - name: The wedge
      contains: The gap in your field's sites that your build can use to stand out, if the audit found one.
    - name: Hand-off list
      contains: What the component, design and creative skills need from these notes to build the pages.
