thinking: medium
thinking_why: It analyses the content, suggests layouts and styles, then draws one.
new_slug: infographic-maker
name: Infographic maker
summary: Turn your report or key points into an infographic. Your AI picks a layout and style to fit, then draws and saves the image.
job: make-images
headline: Infographic maker
subhead: An infographic where the layout and look match the message, built from your own content. You pick how the information is arranged and the visual style separately, and any layout can pair with any style.
explain: |
  An infographic where the layout and look match the message, built from your own content. You pick how the information is arranged and the visual style separately, and any layout can pair with any style.

  The skill reads your content, then suggests a layout, such as a timeline, comparison or steps, and a style. It asks short questions if choices are unclear. When it is time to draw, it picks an image tool in this order: one you name, one saved in your settings, then whatever the host offers. It saves the finished image. It works in several AI hosts, and falls back to numbered plain-text questions when no question tool exists.
when:
  - You have a report and need a one-page visual from it.
  - You want to try one set of facts in several styles.
  - You need a timeline or steps diagram for a post.
  - You are unsure which layout suits your content.
  - You want infographics that match across a series.
not_for:
  - "You need exact charts or data-heavy tables: use a chart tool such as Google Sheets or Excel."
  - "Your AI cannot make images and you have no image tool: ask a designer, or use a tool like Canva."
  - "You only want a short written summary: ask your AI for a plain summary instead."
you_give:
  - Your content or key points
  - A layout or style preference (optional)
  - Image size or platform (optional)
  - A preferred image tool (optional)
you_get:
  - A suggested layout and style
  - The infographic image
  - Options to change either one
  - A saved file
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. Or upload the skill folder if your AI accepts files.
  - Paste your content or key points. Say the layout, style, size or image tool you want, if you have a view.
  - Check the layout and style your AI suggests. Answer its short questions or pick another option.
  - Your AI writes the drawing instructions, then makes the image. This step needs an image tool, such as ChatGPT's image maker or an AI agent with an image tool and file access. Some need an account, login, API key or payment. A chat with no image tool gives you only the drawing instructions, which you can paste into an image maker yourself.
  - The skill file mentions settings such as EXTEND.md and tool names for coding agents. You can ignore them. When your AI asks you to pick a layout, style or image tool, just choose from the options it shows.
  - Look at the image. Ask for a different layout or style if it does not fit, then save the file.
  - If any words in the image are wrong, ask your AI to make it again rather than editing the picture. Then place the PNG in your post, slide or report.
output_sample:
  input:
    - Your content or key points, pasted or as a file
    - A layout or style you like (optional)
    - Image size or platform (optional)
    - An image tool you prefer (optional)
  prerequisites:
    - An AI that can make images, or a way to run an image tool. Some image tools need an account, login, API key or payment. Check which one you have before you start.
  output:
    - name: source file
      contains: A saved copy of the content you gave it.
    - name: analysis.md
      contains: What your content is about and which layouts and styles could suit it.
    - name: structured-content.md
      contains: Your content cut into clear sections, ready to place in the layout.
    - name: prompts/infographic.md
      contains: The final drawing instructions sent to the image tool, with your chosen layout and style.
    - name: infographic.png
      contains: The finished infographic image.
    - name: Output summary
      contains: Topic, layout, style, size, language, image tool used, and where the files are saved.
