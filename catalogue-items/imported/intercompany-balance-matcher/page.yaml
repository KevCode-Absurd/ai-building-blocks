name: Intercompany balance matcher
summary: Give it each entity's balances. Get mismatches found, settlement netted
  and elimination entries drafted.
job: money-and-investing
headline: Intercompany balance matcher
subhead: Your group's internal balances matched across entities, with each
  mismatch traced, settlements netted and elimination entries drafted. That
  clears the way for a clean consolidation at month end.
explain: |
  Your group's internal balances matched across entities, with each mismatch traced, settlements netted and elimination entries drafted. That clears the way for a clean consolidation at month end.

  The skill starts with a map of who trades with whom: goods, services, royalties, loans, dividends. It checks each flow has a signed agreement and an arm's length price. Both sides must book in the same period. Mismatches are worked in a fixed order: timing, exchange rate, missing entry, then price dispute. It then supports netting of cash settlements and prepares the elimination entries. Old unsettled balances are flagged because tax authorities look at them.
when:
  - Two group companies show different amounts for the same balance.
  - You are closing the month and need elimination entries.
  - You want to net many internal payments into fewer cash moves.
  - A new internal service needs a pricing and booking setup.
  - Old internal balances keep piling up unsettled.
you_give:
  - Each entity's intercompany balances
  - The entity map and transaction types
  - Your matching tolerance policy (optional)
  - Exchange rates used
you_get:
  - A list of mismatches with causes
  - A netting and settlement plan
  - Draft elimination entries
  - Notes on pricing and agreements
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
