thinking: low
thinking_why: It writes short lines from a set voice.
new_slug: interface-microcopy-writer
name: Interface microcopy writer
summary: Write clear button labels, error messages, empty states and toasts for your app. Give it a screen and get friendly, polite interface microcopy.
job: design-work
headline: Interface microcopy writer
subhead: The small words in your product, button labels, error messages, empty states and toasts, written in a friendly, polite voice. Give it a screen and get text that tells people what will happen and how to move on.
explain: |
  The small words in your product, button labels, error messages, empty states and toasts, written in a friendly, polite voice. Give it a screen and get text that tells people what will happen and how to move on.

  The skill applies a short rule set. Buttons name the action, so "Save changes", not "Submit". Errors help and never blame. Empty states invite the next step. Money messages stay calm. One term is used for each idea across the product. It follows your voice notes or design language if you paste them in, so the voice matches. It handles one language per run and does not cover long content, full feedback design, or defining a brand voice.

  Licence: the one licence for the written text of this skill is CC BY-4.0 (the LICENSE-CONTENT file). The "MIT" line in the SKILL.md header is the original author's own declaration for their own code repo, not the licence for this text. Keep the credit to the author.
when:
  - Your error messages say "Invalid input" and nothing more.
  - You have a new screen and need every label and message.
  - Empty screens look cold and confuse new users.
  - Words for the same thing change between pages.
  - You need a polite, casual tone in payments or account steps.
not_for:
  - "You need blog posts, help docs or marketing pages: write those yourself or ask your AI for long-form copy."
  - "You need the whole feedback design, not only the words: work with a designer on loading, success and error states."
  - "You need your brand voice defined first: write a short voice guide before you run this."
you_give:
  - The screen or flow and what it does
  - The product's voice or design language (optional)
  - The language to write in
you_get:
  - Button labels
  - Error messages that help
  - Empty state text
  - Toast messages
  - A consistent term list
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill instructions into a new chat. No code or paid tool is needed.
  - "Have these ready: the screen name, what each button or action does, the language, and any voice notes. Describe your screen or flow and what it does. Say which language to write in."
  - Your AI works in this order. It lists every state the screen has (button, error, empty state, toast), writes one line for each state, then checks the term list against your earlier screens.
  - Paste your voice notes or design language if you have them (optional). Without them, the skill uses a casual but polite voice. If your notes clash with its rules, your notes win and it tells you where.
  - The skill file's "risk: critical" line is the source collection's own label. This skill only drafts text. It changes nothing in your product.
  - Read each line. Check that every button says what will happen and every error says what to do next.
  - Use the same word for the same idea across your screens. Fix any line that blames the user.
  - Next, save the approved term list in your design notes so new screens reuse the same words. Pair it with a short voice guide (brand-voice-guide-builder), and re-run this on each new screen so the wording stays consistent.
output_sample:
  input:
    - The screen or flow and what it does
    - Your product's voice or design language (optional)
    - The language to write in
  output:
    - name: Primary copy
      contains: The exact text to show on the screen, such as button labels, error messages, empty states and toasts.
    - name: Variants
      contains: Other versions of a line when the context changes, such as a different error cause.
    - name: Do's and Don'ts
      contains: Short tips for this screen, so your team keeps the same tone when it adds more text.
