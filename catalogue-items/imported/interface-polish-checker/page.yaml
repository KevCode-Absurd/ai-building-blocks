thinking: low
thinking_why: It checks code against a short list of rules.
new_slug: interface-polish-checker
name: Interface polish checker
summary: Find spacing, type and layout slips in your page or component code. Get each one quoted with a short reason and a code fix.
job: build-websites
headline: Interface polish checker
subhead: A list of spacing, type and layout slips in your page or component code, each with a reason and a fix. It cleans up the rough edges that make an interface look unfinished.
explain: |
  A list of spacing, type and layout slips in your page or component code, each with a reason and a fix. It cleans up the rough edges that make an interface look unfinished.

  Give it a file and it checks against a firm baseline. For each problem it quotes the exact line, says in one short sentence why it matters, and offers a code-level fix. The baseline leans on Tailwind defaults, uses motion libraries only when script animation is needed, and respects your existing design, accessibility needs and framework choices. It is aimed at quick clean-up passes, not redesigns.

  Licence: the written text of this skill is shared under CC BY-4.0 (the LICENSE-CONTENT file). The "MIT" line in the SKILL.md header is the original author's own note. Keep the credit to the author.
when:
  - A page works but looks slightly off and you cannot say why.
  - You want a fast review before a launch.
  - Heading sizes and spacing are inconsistent across components.
  - AI-generated UI code needs tidying.
  - You want specific line-level fixes, not general advice.
not_for:
  - "You want a full redesign or a new design system: work with a designer instead, this only does a quick clean-up pass."
  - "Your code is not a web interface using Tailwind CSS: ask a developer who knows your stack, as the rules assume Tailwind."
  - "You need a check for bugs, speed or security: use a code review by a developer, as this only covers how the interface looks and feels."
you_give:
  - The page or component file
  - Your framework and styling setup
  - Any design rules to keep (optional)
you_get:
  - A list of violations with quoted lines
  - A short reason for each
  - A concrete code fix
  - Cleaner spacing and type
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code running, web access or paid tool is needed.
  - "Paste the skill text into the chat, then write: Apply this baseline to the file below. (The /baseline-ui slash form only works in tools that support custom commands.)"
  - Paste your page or component code below it. Add your framework and any design rules to keep.
  - Read each quoted line, the reason and the fix. Skip any fix that clashes with your existing design.
  - Apply the fixes you agree with, then paste the updated code and run the check again. Have a developer apply the fixes inside your project and test the page. Do not paste fixes in blindly.
output_sample:
  input:
    - Your page or component file
    - Your framework and styling setup (optional)
    - Any design rules you want kept (optional)
  output:
    - name: Violations
      contains: Each rule break, with the exact line or snippet quoted from your file.
    - name: Why it matters
      contains: One short sentence for each violation on why it hurts the interface.
    - name: Fix
      contains: A code-level change you can paste in to correct that line.
