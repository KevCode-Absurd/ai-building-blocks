thinking: medium
thinking_why: It judges craft details against known principles.
new_slug: interface-polish-reviewer
name: Interface polish reviewer
summary: Give it a screen or component. Get notes on animation, feel and small
  details that make it feel finished.
job: design-work
headline: Interface polish reviewer
subhead: "Notes on the feel of your screen: how it moves, responds and handles
  small details, so it reads as finished and cared for. Give it a screen or
  component and get craft-level feedback."
explain: |
  Notes on the feel of your screen: how it moves, responds and handles small details, so it reads as finished and cared for. Give it a screen or component and get craft-level feedback.

  The skill reviews motion quality, easing, durations and how physical an interaction feels. It looks at feedback on press and hover, subtle states, and whether each choice suits the product. It works with React, Tailwind, CSS and Framer Motion. It reads a longer guide before it starts. It treats its advice as judgement, not law: your brand system, platform habits and requirements come first, and you should test on real devices.
when:
  - Your interface works but feels stiff or flat.
  - Animations feel too slow, too fast or too bouncy.
  - You want a design critique before shipping a feature.
  - Buttons and menus lack feedback when used.
  - You are choosing between two motion approaches.
you_give:
  - The screen, component or code
  - The framework you use
  - The feeling you want (optional)
you_get:
  - Notes on motion, easing and timing
  - Feedback and state suggestions
  - Small detail fixes
  - A priority order for changes
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
