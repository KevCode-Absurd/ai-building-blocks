thinking: medium
thinking_why: It audits the look first, then applies targeted fixes.
new_slug: interface-upgrader
name: Interface upgrader
summary: Upgrade a generic-looking website or app without a rewrite. It finds stock design patterns and weak spots in your code, then fixes them in place.
job: build-websites
headline: Interface upgrader
subhead: An existing site or app improved where it looks generic, without a rewrite or a change to how it works. It finds the stock patterns and weak spots and fixes them in place.
explain: |
  An existing site or app improved where it looks generic, without a rewrite or a change to how it works. It finds the stock patterns and weak spots and fixes them in place.

  The skill first scans your code to learn the framework and styling. It then audits for flat, template-like design, poor spacing, and missing states such as loading, empty and error. It applies targeted upgrades while keeping routes, data flow, accessibility and tests intact. It does not move you to a new framework or rework your structure. You should check the result in your actual app on several screen sizes and browsers.

  Credit: Leonxlnx wrote the skill (taste-skill on GitHub), and sickn33 shared it in the agentic-awesome-skills collection. Licence: CC BY-4.0 (LICENSE-CONTENT).
when:
  - Your app works but looks like every other AI-built site.
  - Pages feel flat and have no loading or error states.
  - You want a visual refresh without touching the architecture.
  - Spacing and hierarchy are uneven across screens.
  - You need to modernise the look before a demo.
not_for:
  - "You are starting a new site or app from nothing: build it fresh with your AI or a designer, then use this to polish it."
  - "You want to move to a new framework or change how pages are laid out: hire a developer, because this skill keeps your structure."
  - "You only have a screenshot and no code: ask a designer for feedback, since this skill works on project files."
you_give:
  - Access to your site or app code
  - Pages or screens to focus on
  - Anything that must not change (optional)
you_get:
  - A list of generic patterns found
  - Targeted code changes
  - Added loading, empty and error states
  - Better spacing and hierarchy
how_to_use:
  - Open your AI tool where it can read your project files, such as Claude Code or Cursor. Both are paid tools. A free option is a plain chat with your code pasted in.
  - Paste the full skill text into the chat (the Design Audit, Upgrade Techniques and Fix Priority sections are the core). Then name the project folder.
  - Tell your AI which pages to improve, and what must not change.
  - Let it scan and list the generic patterns it found. Read the list before it changes anything.
  - Check the result in your real app on a phone, a laptop and more than one browser. Make sure no placeholder name, number or date is left on a live page.
  - Next, have the owner check every changed screen before launch. Pair the result with a copy review.
output_sample:
  input:
    - Your site or app code
    - The pages or screens to focus on
    - Anything that must not change (optional)
  prerequisites:
    - An AI that can read and edit your project files
  output:
    - name: Scan
      contains: The framework and styling method your project uses, and the design patterns already in place.
    - name: Diagnosis
      contains: A list of generic patterns, weak points and missing states found in type, color, layout, content and icons.
    - name: Targeted fixes
      contains: Code changes made in your existing stack to improve type, layout, motion and surfaces.
    - name: Added states
      contains: Loading, empty and error states for screens that lacked them.
    - name: Fix priority order
      contains: The changes applied in order, so the biggest visual gains come first.
