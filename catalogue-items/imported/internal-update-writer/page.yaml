thinking: low
thinking_why: It fills a set format with the facts you give it.
new_slug: internal-update-writer
name: Internal update writer
summary: "Write an internal update from your facts: a team update, newsletter, FAQ answer or status report, in a clear format your readers can scan fast."
job: organise-work
headline: Internal update writer
subhead: A team update, newsletter, FAQ answer, status report, leadership update or incident note, written from the facts you give. Four format guides cover these. Status reports, leadership updates and incident notes use the general one.
explain: |
  A team update, newsletter, FAQ answer, status report, leadership update or incident note, written from the facts you give. The result reads as it should for that audience.

  The skill first names what kind of message you need. It then loads the matching guide. Only four guides exist: 3p-updates (progress, plans and problems for team updates), company-newsletter, faq-answers and general-comms. Status reports, leadership updates, project updates and incident notes all use general-comms. It fits your facts into that structure, keeps the points short and puts the key message first. Use it when you spend too long on the same kinds of messages.

  Source note: this is a copy of the internal-comms skill from Anthropic's public skills repository, shared under the Apache 2.0 licence (the LICENSE.txt file). The format guides in the examples folder come from that skill. What this version adds: a plain name, a staff-only limit, the not-for guidance and the how-to steps. The skill text and the four guides are unchanged.
when:
  - You write a weekly team update and want it faster.
  - You must report an incident to the company.
  - Leadership wants a short update on project status.
  - You are producing a company newsletter.
  - You need clear answers to common staff questions.
not_for:
  - "You need a message to customers or the public: write it yourself or ask a PR or support lead, since this skill is for staff only."
  - "You have no facts yet, only a vague idea: gather progress, plans and problems first, or ask the project owner."
  - "You want a long report, slide deck or meeting notes: use a document tool or a note taker, not this skill."
you_give:
  - The facts, progress and problems
  - The type of message and its audience
  - Dates and owners (optional)
you_get:
  - A finished update in the right format
  - Key points up front
  - Plans and problems clearly separated
  - A tone suited to the audience
how_to_use:
  - "Gather your facts: what is done, what is next and what is stuck. Add dates and owners if you have them."
  - Open Claude, ChatGPT or Gemini. Give it the skill and the examples folder, because the format guides live there. In Claude you can add the whole folder as a skill (zipped). In other tools, upload the guide files one by one, or paste the guide you need after the skill text. If your company has its own templates, paste those instead, since these guides are only defaults. The four guides are 3p-updates, company-newsletter, faq-answers and general-comms. Pasting only the skill text leaves them out.
  - Say what kind of message you need and who will read it. Paste your facts.
  - "For a status report, ask for these sections: headline, what changed, impact, next action, owner and date. For an incident note, ask for: headline, what happened and when, who or what was affected, what was done, next action, owner and date. Use only facts you gave, and mark anything missing as [MISSING]."
  - Read the draft. Check every date, name and claim against your facts, and fix anything that is off.
  - Send it where your readers look. Updates go to your team channel, leadership notes by email, incident notes to the incident log. Reuse the same format next time. For an incident note, also log it in your incident record. To go further, pair a status report with a leadership update.
output_sample:
  input:
    - "The facts: what got done, what comes next and what is stuck"
    - The type of message, such as a team update, newsletter, FAQ answer or incident note
    - Who will read it
    - Dates and owners (optional)
  output:
    - name: Finished update
      contains: A short message in the format for your message type, with the key point first.
    - name: Progress, Plans, Problems sections
      contains: For team updates, your facts split into what is done, what is next and what is blocked.
    - name: Newsletter draft
      contains: For company newsletters, your news fitted into a newsletter layout.
    - name: FAQ answer
      contains: For common staff questions, a clear answer in the format the FAQ guide sets.
    - name: General update
      contains: For anything else, such as status or incident notes, a plain structured message for your audience.
