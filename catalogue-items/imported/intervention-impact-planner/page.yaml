thinking: high
thinking_why: It must test ideas for knock-on effects.
new_slug: intervention-impact-planner
name: Intervention impact planner
summary: Give it a systems analysis and ideas for action. Get each ranked by
  impact, with side effects and better options.
job: teach-and-train
headline: Intervention impact planner
subhead: Your plan to fix a problem gets tested before you act on it. Give it
  the systems analysis you already have and the action you are leaning toward.
explain: |
  Your plan to fix a problem gets tested before you act on it. Give it the systems analysis you already have and the action you are leaning toward. It places that action on the twelve places to intervene described by Donella Meadows, from tweaking numbers at the bottom to changing goals and beliefs at the top.

  Then it hunts for knock-on effects: fixes that fail later, relief that hides the real cause, and limits that stall growth. You get two or three better or reworked options that act higher up the ladder, each with its side effects spelled out. Add your time, budget and reach, and the options stay realistic.
when:
  - You have a plan for a tough problem and want to know if it will really work.
  - Your first fix feels obvious and you suspect it only treats symptoms.
  - You finished a systems analysis and now need to choose what to do.
  - You need to compare several actions and see which one has the most impact.
you_give:
  - Your systems analysis or a description of the problem
  - The action you are considering
  - Limits on time, budget and reach (optional)
  - Context such as school, team or community (optional)
you_get:
  - Your action placed on the ladder of places to intervene
  - A list of likely side effects and delayed backlash
  - Two or three better or refined options
  - A ranking by impact
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
not_for:
  - "You have not yet looked at why the problem keeps happening. Start with the Event-to-pattern iceberg builder, then bring its result here."
  - "You are not sure what you can really change. Use the Control and influence circles map first, then test your action here."
  - "You need a task list with dates and owners. This tool weighs ideas and does not schedule them."
output_sample:
  input:
    - Your systems analysis, or a short description of the problem and what keeps it going
    - The action you are thinking of taking
    - Your limits on time, budget, authority and reach (optional)
    - Age range and setting, such as a school or community group (optional)
  output:
    - name: Place on the ladder
      contains: Where your action sits on the twelve places to intervene, and what it leaves untouched.
    - name: Unintended Consequence Analysis
      contains: Side effects such as fixes that fail, plus the loops your action may trigger.
    - name: Response Options
      contains: Two or three options at different levels, each with its effect, risk and how doable it is.
    - name: Proportionality Check
      contains: Whether each option fits what you can influence, or puts a load on you that belongs elsewhere.
    - name: Do Less Harm Check
      contains: Whether watching and naming the problem is wiser than acting now.
    - name: Recommended Next Step
      contains: One specific first action or decision.
