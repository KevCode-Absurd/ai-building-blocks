thinking: medium
thinking_why: It follows a set research method fitted to your question.
new_slug: interview-and-research-planner
name: Interview and research planner
summary: Describe your research question. Get a plan with recruiting, interview
  guide, synthesis steps and next product decisions.
job: understand-customers
headline: Interview and research planner
subhead: A research plan you can run next week, from the question to the
  decision it should change. Describe what you need to learn and who you can
  reach.
explain: |
  A research plan you can run next week, from the question to the decision it should change. Describe what you need to learn and who you can reach. The skill works in six phases. It first rewrites weak questions into specific, open ones that a decision depends on. Then it picks a method that fits, such as interviews, field visits or diary studies, and plans who to recruit and how many.

  It drafts the interview guide, sets up note taking, and lays out how to turn raw notes into patterns. It finishes by linking findings to the product choices they should drive, so research does not end up in a deck nobody reads.
when:
  - You want to talk to customers but do not know what to ask.
  - Something is not working and your numbers do not explain why.
  - You are about to invest in a new feature and want proof first.
  - Your team has drifted from users and needs fresh contact.
you_give:
  - Your research question or the decision behind it
  - Who you can reach (customers, prospects, lapsed users)
  - Your timeline and budget
  - Earlier research (optional)
you_get:
  - A sharper version of your research questions
  - A recruiting plan with numbers
  - An interview guide
  - Steps for turning notes into findings
  - A list of product decisions the findings should inform
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
not_for:
  - "You want to test a working design or prototype. Use the Small usability test planner."
  - "You have a business idea and no product yet. Use the Customer discovery interview planner."
  - "You need numbers, such as how many people do something. Interviews give reasons, not counts. Use your analytics or a survey instead."
  - "You only want help picking a method and a sample size. The User research planner does that. This one goes on to the interview guide and the write-up."
output_sample:
  input:
    - The research question, or the decision it should change
    - Who you can reach, such as current customers, prospects or lapsed users
    - Your timeline and budget
    - Who needs the findings, and any earlier research (optional)
  prerequisites:
    - A way to reach real people for 5 to 15 interviews
    - A way to record sessions, with each person's consent
    - "Optional: recruiting platforms such as UserInterviews and Respondent, which charge fees"
  output:
    - name: Research plan (research-plan-[topic].md)
      contains: Sharper questions, the chosen method, who to recruit and how many, and the timeline.
    - name: Interview guide (interview-guide-[topic].md)
      contains: A friendly opening, open questions, follow-up probes and a close.
    - name: Recruiting plan
      contains: Who to include and leave out, where to find them, pay, and extra sign-ups for no-shows.
    - name: Synthesis steps
      contains: How to turn notes into themes and insights, and how to tell a pattern from a one-off remark.
    - name: Findings template (research-findings-[topic].md)
      contains: Top insights with quotes, themes, outliers and next steps, to fill in after the sessions.
    - name: Sharing plan
      contains: Which format reaches which person, so the findings change a decision.
