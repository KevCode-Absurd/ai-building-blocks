thinking: medium
thinking_why: It builds clear rating rules from the skills you need.
new_slug: interview-scorecard-builder
name: Interview scorecard builder
summary: Build an interview scorecard for each hiring stage. Get rating guides, questions with probes and a phone screen script that keep ratings tied to evidence.
job: hire-people
headline: Interview scorecard builder
subhead: Interviewers who rate on evidence instead of gut feel. Give it your interview stages and the role. It builds one scorecard per stage, each with three to five skills.
explain: |
  Interviewers who rate on evidence instead of gut feel. Give it your interview stages and the role. It builds one scorecard per stage, each with three to five skills. Every skill gets a plain definition, what a 1 to 5 rating looks like in real behaviours, two or three questions with follow-up probes, and a field to write down what was observed.

  Company values appear in every stage with different prompts, so you can see trends across the loop. A separate box captures instinct without letting it outweigh the evidence. You also get a phone screen script and tips so that a 3 means mixed signals, not a shrug.
when:
  - Your interviewers give vague ratings like good vibe or not sure.
  - You are setting up interviews for a new role and need forms fast.
  - Hiring debriefs end in arguments because nobody wrote down evidence.
  - You want one consistent rating scale across all your interviewers.
not_for:
  - "You hire one person and have no panel: write the phone screen script on its own, or ask a colleague to sit in."
  - "You want to judge a CV or application before any interview: use a simple checklist of the must-have skills from the job ad."
  - "You need the Job Match Score: it is only worked out inside Teamtailor, so this page can only set up the kits for it."
you_give:
  - Your interview stages for the role
  - The role's must-have skills and values
  - Your rating scale, if you have one (optional)
  - The phone screen topics (optional)
you_get:
  - One scorecard per stage
  - Rating guides with observable behaviours
  - A bank of questions with follow-up probes
  - A phone screen script
  - A debrief checklist
  - A separate gut feeling field
  - Calibration exercises for interviewers
how_to_use:
  - Gather the role title, your interview stages, the must-have skills and your company values. Anything you leave out, the skill marks as MISSING instead of guessing.
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. Also paste references/scorecard-templates.md, which has full example scorecards to work from. A plain chat cannot open the references folder by itself. Without it the skill still works, from its own instructions.
  - Add the role, your interview stages, and the must-have skills and values.
  - Add your own rating scale and phone screen topics if you have them.
  - Ask for the scorecards, then the phone screen script.
  - Check that every stage ends with a recommendation and debrief notes, and that each rating guide names things an interviewer can see or hear.
  - Read each rating guide and check it fits your role before you share it with interviewers.
  - Next, run a short calibration session with your interviewers using the exercises, before the first interview. After each candidate, use the debrief checklist.
  - Last, and only if you use Teamtailor, ask for teamtailor-setup.md. The Job Match Score is a score Teamtailor works out from your interview ratings, and it needs a paid Teamtailor account.
output_sample:
  input:
    - Your interview stages for the role
    - The role's must-have skills and company values
    - Your rating scale, if you have one (optional)
    - The phone screen topics (optional)
  prerequisites:
    - Teamtailor, a paid hiring tool, only if you want the teamtailor-setup.md step. The scorecards work without it.
  output:
    - name: Scorecards
      contains: One scorecard per interview stage, each with three to five skills and a stage rating from 1 to 5.
    - name: Competency rubric
      contains: A plain definition of each skill and what each rating looks like in real behaviour.
    - name: Questions with probes
      contains: Two or three questions per skill, each with follow-up probes and a field to note what you saw.
    - name: Gut feeling field
      contains: A separate box for instinct, so it never outweighs the evidence.
    - name: Screening Guide
      contains: A timed phone screen script with a pre-screen checklist, questions, role pitch and logistics.
    - name: Calibration Exercises
      contains: Short exercises that help interviewers rate the same way.
    - name: teamtailor-setup.md
      contains: Steps to set up the kits and stages in Teamtailor, if you use it.
