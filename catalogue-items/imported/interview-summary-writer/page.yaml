thinking: low
thinking_why: It sorts what was said into a fixed template.
new_slug: interview-summary-writer
name: Interview summary writer
summary: Turn a customer interview transcript into a one-page summary with needs, satisfaction, key quotes and action items your team can use.
job: understand-customers
headline: Interview summary writer
subhead: "A one-page summary of a customer interview that your team will really read. Paste the transcript or attach the file. The skill reads it all first, then fills a fixed template: who was interviewed, what they use today, what they like, what frustrates them, and surprising quotes."
explain: |
  A one-page summary of a customer interview that your team will really read. Paste the transcript or attach the file. The skill reads it all first, then fills a fixed template: who was interviewed, what they use today, what they like, what frustrates them, and surprising quotes.

  Each like and problem is framed as a job the customer is trying to get done, with the outcome they want, how much it matters to them and how satisfied they are. It ends with action items that carry a date and an owner. The wording stays simple, so anyone on the team can follow it. The summary is saved as a markdown file in your workspace.
when:
  - You just finished a customer call and have a long transcript.
  - You need to share interview findings with people who were not there.
  - You are running many interviews and want the same format each time.
  - You want follow-up actions captured with owners and dates.
not_for:
  - "You have many interviews or survey answers and want themes across them: use hidden-theme-finder on all the notes together, not this single-interview summary."
  - "You only have notes and no transcript: write up the notes first, or ask the person who ran the call for a transcript."
  - "You need a full research report with a plan and sample size: ask a researcher, since this skill only summarizes one call."
you_give:
  - The interview transcript, pasted or as a file
  - The product or area you are exploring
  - Names and roles of the participants (optional)
you_get:
  - A one-page interview summary
  - Likes and problems framed as jobs with satisfaction levels
  - Key insights and notable quotes
  - Action items with dates and owners
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste your transcript, or attach it as a file if your AI can read files.
  - Tell your AI the product or area you are exploring, and the names and roles of the people on the call if you have them.
  - Read the summary. Check that any missing detail shows as a dash, that importance and satisfaction read "not stated" unless the customer said it, and that the quotes match what was said.
  - Copy the action items into your team tracker. Use the Key Insights when you map customer problems and opportunities.
  - Save the summary as a markdown file if your AI can save files, or copy it into your own notes.
output_sample:
  input:
    - Your interview transcript, pasted or attached as a file
    - The product or area you are exploring
    - Names and roles of the people on the call (optional)
  output:
    - name: Date, Participants, Background
      contains: When the call happened, who took part and their roles, and a short background on the customer.
    - name: Current Solution
      contains: What the customer uses today to get the job done.
    - name: What They Like About Current Solution
      contains: Each job they get done well, with the outcome they want, its importance and how satisfied they are.
    - name: Problems With Current Solution
      contains: Each job that goes badly, with the outcome they want, its importance and their satisfaction level.
    - name: Key Insights
      contains: Unexpected findings and notable quotes from the call.
    - name: Action Items
      contains: Follow-ups, each with a date, an owner and the action to take.
