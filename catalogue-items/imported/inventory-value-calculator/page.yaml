thinking: low
thinking_why: It applies set costing formulas.
new_slug: inventory-value-calculator
name: Inventory value calculator
summary: Value your inventory with FIFO or weighted average cost. Get cost of goods sold, closing stock and write-downs for slow or damaged items.
job: run-your-store
headline: Inventory value calculator
subhead: Give it your purchases, stock counts and costs. It values your stock with FIFO or weighted average cost and shows the maths. You get cost of goods sold, closing stock and a list of write-downs.
explain: |
  Stock that is valued the way an auditor expects, with the maths shown. Give it your purchases, counts and costs. You pick or confirm a cost method, FIFO or weighted average, and it works out the cost of goods sold and the closing stock. It adds freight, duties and a fair share of production overhead, and leaves out waste and selling costs.

  Then it tests each item against net realizable value, which is selling price less cost to finish and sell, and flags write-downs. An age-and-movement table suggests provisions for slow or dead stock. Count differences above your limit get investigated. The result is a valuation memo with adjusting journal entries.
when:
  - You are closing the year and must value your stock.
  - You think some items are worth less than you paid for them.
  - Prices rose and you want to see how FIFO changes your profit.
  - Your book stock and your physical count do not match.
not_for:
  - "You file tax returns or need audited accounts: ask a qualified accountant to review the result first."
  - "You run a services business with no stock: use your normal bookkeeping or ask your accountant."
  - "You want to track stock levels day to day: use your store's stock system or a simple spreadsheet."
you_give:
  - Purchase records with item, date, quantity and unit cost
  - Opening stock and current counts
  - Your cost method, FIFO or weighted average (optional)
  - Selling prices and costs to sell (optional)
  - Freight and import duty paid on purchases (optional)
you_get:
  - A stock valuation schedule by category
  - Cost of goods sold for the period
  - A list of items to write down
  - A slow-stock provision table by age and movement
  - Adjusting journal entries
how_to_use:
  - Save your purchases and counts as a CSV or spreadsheet with named columns (item, date, quantity, unit cost, freight, duty, count quantity and selling price).
  - Open Claude, ChatGPT or Gemini. Pick one that can run code, so the maths is checked by script. Running code may need a paid plan, so check yours first.
  - Upload the whole skill folder, including scripts/calculate.py. If you can only paste text, paste the skill text and the script too, or ask the AI to do the sums step by step and show its working.
  - Add your purchase records, opening stock and counts. Ask the AI to run calculate.py on them.
  - Say which cost method you use, FIFO or weighted average. If you are unsure, ask your AI to compare both.
  - Add selling prices and costs to sell if you have them, so it can test for write-downs.
  - Check the valuation totals and the write-down flags against your own records.
  - Ask your accountant to review the result before you use it in your books.
output_sample:
  input:
    - Your purchase records with quantities and costs
    - Your opening stock and current counts
    - Your cost method, FIFO or weighted average (optional)
    - Selling prices and costs to sell (optional)
  prerequisites:
    - An AI that can run code, so the maths is checked by script. This can need a paid plan on Claude, ChatGPT or Gemini.
    - The skill folder with scripts/calculate.py, uploaded or pasted
  output:
    - name: Method & Inputs
      contains: The cost method, how overhead is added to stock, and the normal capacity used.
    - name: Computation
      contains: A stock valuation schedule by category, with the maths checked by code.
    - name: NRV/Obsolescence
      contains: Items tested against selling price less costs to finish and sell, with write-downs and a slow-stock provision table.
    - name: Entries
      contains: Adjusting journal entries for write-downs and count differences.
