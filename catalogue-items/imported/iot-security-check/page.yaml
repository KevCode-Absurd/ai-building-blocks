thinking: medium
thinking_why: It sorts the product, then lists set duties.
new_slug: iot-security-check
name: Connected product security checker
summary: Check what the EU Cyber Resilience Act means for your connected product. Get its risk class, CE marking route, security duties and reporting steps.
job: secure-code
headline: Connected product security checker
subhead: A plain answer to what the EU Cyber Resilience Act means for your connected product. Describe what it is, whether it is hardware, software or an app, and who sells it.
explain: |
  A plain answer to what the EU Cyber Resilience Act means for your connected product. Describe what it is, whether it is hardware, software or an app, and who sells it. The skill decides if it counts as a product with digital elements, sorts it into the default group, Class I or Class II, and names the route to CE marking.

  It then lists the security duties you carry: secure design, a support period, a software parts list, vulnerability handling and reporting to authorities. Reporting rules are already in force, and the full set applies from December 2027. Your role matters too, whether maker, importer or distributor. This is guidance, not legal advice.
when:
  - You sell a smart device or app in Europe and do not know your duties.
  - You need to know if your product needs outside testing or self-assessment.
  - A customer asks for a software parts list and you have none.
  - You must know how and when to report a security flaw.
not_for:
  - Your product is a medical device, car part, aircraft part or military item. Other EU rules cover these, so ask a qualified assessor.
  - You need legal advice or a formal conformity check. Hire a lawyer or a notified body, since this gives guidance only.
  - You sell only outside the EU. The Act covers products sold in the EU, so check the rules where you sell.
you_give:
  - A description of your product and how it connects
  - "Your role: maker, importer or distributor"
  - Where it is sold
  - What data it handles (optional)
you_get:
  - Your product's risk class
  - The route to CE marking
  - A list of security duties
  - What a software parts list needs
  - Reporting steps and deadlines
how_to_use:
  - This is an imported MIT-licensed copy. Its author last checked it on 2026-09-14, and we have not checked it again, so some dates and rule numbers may have changed.
  - Gather first. Write down your product's parts (hardware and software), how it connects, the countries you sell in, your role, and any software parts list you already have.
  - Open a chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the full SKILL.md text into the chat, then the two reference files it reads, references/essential-requirements.md and references/conformity-assessment.md. Without them the answer has less detail on duties and routes.
  - "Describe your product, how it connects, where you sell it and your role: maker, importer or distributor."
  - Read the answer. It gives your scope, class, route and a summary of duties, in that order, usually in a page or two. It is a draft for your assessor, not the full skill text.
  - Treat the answer as a draft for your assessor, not a decision on your product class. Do not file any ENISA report based on it without checking the current steps on the reporting platform itself.
  - Check every date, rule number and class list against EUR-Lex and the ENISA site before you act on them. The skill's own check date is 2026-09-14, and we have not checked it again.
  - Next, take the Key Obligations Summary to a notified body or a qualified assessor. The class decision, the CE marking route and your reporting steps need a lawyer or assessor to sign off.
output_sample:
  input:
    - A description of your product and how it connects
    - "Your role: maker, importer or distributor"
    - Where the product is sold
    - What data it handles (optional)
  output:
    - name: Scope Determination
      contains: Says whether your product is in scope of the Act, or excluded and why.
    - name: Product Class
      contains: Places your product in the default, Class I or Class II group.
    - name: Applicable Annex
      contains: Names the Annex III or Annex IV item that fits your product, if any.
    - name: Organisation Role
      contains: Confirms if you count as maker, importer or distributor.
    - name: Conformity Assessment Route
      contains: Says if you can self-assess or need a third-party notified body.
    - name: Key Obligations Summary
      contains: Lists your security duties, software parts list needs, support period and reporting steps.
