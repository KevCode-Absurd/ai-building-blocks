thinking: high
thinking_why: Who owns the work is easy to give away by accident.
new_slug: ip-clause-checker
name: IP clause checker
summary: Check the IP clauses in a contract for ownership gaps, licence limits and indemnity risks. Get findings ranked by risk. Not legal advice.
job: check-contracts
headline: IP clause checker
subhead: The intellectual property clauses in a contract read for you, ranked by risk. Share the agreement as a file, link or pasted text. The skill first asks which side you are on for IP, since it differs per document.
explain: |
  The intellectual property clauses in a contract read for you, ranked by risk. Share the agreement as a file, link or pasted text. The skill first asks which side you are on for IP, since it differs per document. For employment, consulting and work-for-hire deals it runs an assignment gap check before anything else, because missing ownership transfers are hard to fix later.

  Each clause is explained, compared with market norms and with your preferred position, then rated. It also checks that clauses agree with each other and notes local rules on moral rights, work-for-hire and implied licences. Unclear wording is flagged for a lawyer. It is a first check, not legal advice.
when:
  - A contractor or vendor sent a contract and you want a first read on who owns the work.
  - You are signing an employment agreement and want to check the IP terms.
  - You license your code or content and need to see what you grant.
  - You want a list of questions for your lawyer before the review.
not_for:
  - "You need legal advice on a high-value or disputed deal: hire a lawyer, and use this only to prepare your questions."
  - "You want to review a whole contract, not just the IP terms: read it with a lawyer or your usual contract review step."
  - "You have no way to run the setup interview first: the check needs your practice profile, so do the interview before you start."
you_give:
  - The agreement, as a file, link or pasted text
  - Which side you are on for IP
  - Your preferred positions, if you have them (optional)
  - Your jurisdictions (optional)
you_get:
  - An assignment gap check
  - Clause-by-clause findings by risk level
  - Cross-clause consistency flags
  - A note on local legal differences
  - Questions for a lawyer
how_to_use:
  - This is a first check, not legal advice. Have a lawyer sign off before you sign or redline.
  - Run the setup interview first. It saves your practice profile, which this skill needs. Without it, the skill stops and asks you to run it.
  - Open your AI and paste in the skill. If you use Claude, it works best with a tool that can read files.
  - Share the agreement as a file, link or pasted text. Say which side you are on for IP in this document.
  - Read the Bottom line and the Assignment gap check first. Then work through the clauses from highest risk down.
  - Take any unclear clause to a lawyer. If no legal research tool is connected, do not rely on case or law citations until a lawyer checks them.
output_sample:
  input:
    - The agreement, as a file, link or pasted text
    - "Which side you are on for IP: giving rights, receiving them, or both"
    - Your practice profile, made by the setup interview
    - Your preferred positions on IP terms (optional)
  prerequisites:
    - An AI that can read your files, to load the practice profile
    - The setup interview finished first, so your practice profile exists
    - A lawyer to sign off before you sign or redline
  output:
    - name: Bottom line
      contains: A short verdict on the IP risk in this agreement and what to do first.
    - name: Assignment gap check
      contains: Whether ownership of the work truly passes to you, such as wording that promises a transfer later and does not make one now.
    - name: Clauses by severity
      contains: Each IP clause explained, compared with market norms and your position, rated by risk, with suggested redline wording where it helps.
    - name: Cross-clause consistency
      contains: Places where one clause conflicts with another, such as a licence that cuts against an ownership clause.
    - name: Jurisdiction note
      contains: Local rules that may change the result, such as moral rights, work-for-hire and implied licences.
    - name: Approval routing
      contains: Who should review or approve the points that need a lawyer's decision.
    - name: Next steps
      contains: A short list of choices for what to do with the memo.
