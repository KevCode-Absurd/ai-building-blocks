thinking: medium
thinking_why: It follows Apple rules but makes design choices.
new_slug: iphone-screen-designer
name: iPhone screen designer
summary: Design iPhone app screens that feel native, from onboarding to paywalls. Your AI checks them on small and large phones, in light and dark mode.
job: design-work
headline: iPhone screen designer
subhead: iPhone screens that look and behave like they belong on an iPhone, not like a website squeezed into an app. Describe the screens you need, such as onboarding, settings, a paywall or a list with a detail view.
explain: |
  iPhone screens that look and behave like they belong on an iPhone, not like a website squeezed into an app. Describe the screens you need, such as onboarding, settings, a paywall or a list with a detail view. The skill applies Apple conventions: back buttons where people expect them, tab bars instead of hamburger menus, sheets, text that grows with accessibility settings, and native-style lists and forms.

  It works with SwiftUI, UIKit, React Native, Expo or Flutter, and it checks the result on both small and large phone sizes. A paid design library can be connected for reference screens, but only if you ask for it. The skill works fine without any account.
when:
  - Your app screens feel like a web page in an app shell.
  - You are building a settings screen, paywall or onboarding flow.
  - You need to check a layout on small and large iPhones.
  - You build in Flutter or React Native and want it to feel native.
not_for:
  - "You build for Android first or for the web only: use a design skill made for that platform, or a web designer."
  - "You design for iPad or Mac: this covers iPhone only, so use Apple's own iPad guidelines or ask a designer."
  - "You need App Store approval: the paywall notes are guidance only, so read Apple's current review rules before you submit."
you_give:
  - A description of the screens and what each does
  - Your framework, such as SwiftUI or React Native
  - Any existing code or mockups (optional)
  - Brand colours or fonts (optional)
you_get:
  - Native-feeling screen designs or code
  - Correct navigation, lists, forms and sheets
  - A size check on small and large phones
  - A list of places that break Apple conventions
next: [developer-handoff-spec-writer]
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill, or upload its folder if your AI takes files.
  - Describe each screen and what it does. Name your framework, such as SwiftUI, React Native, Expo or Flutter.
  - Add your existing code, mockups, colours or fonts if you have them.
  - Say if your AI can run code or a simulator. Without one, it will tell you what it could not check.
  - Read the check results first. Ask for fixes, then check again.
  - Next, hand the screen code or designs to a developer, and run the simulator check on a real build.
  - Only ask for the UXKIN link if you want real app screens as reference. It needs a paid UXKIN plan.
output_sample:
  input:
    - A description of the screens and what each one does
    - Your framework, such as SwiftUI or React Native
    - Your existing code or mockups (optional)
    - Your brand colours or fonts (optional)
  prerequisites:
    - An AI that can run code or a simulator, if you want the size checks done for real
    - A UXKIN plan, only if you want real app screens as reference (optional)
  output:
    - name: Screen designs or code
      contains: Each screen built with native navigation, lists, forms and sheets, matching your framework and existing style.
    - name: Layout decisions
      contains: A short list per screen on tabs, sheets, safe areas and controls, and why each was chosen.
    - name: Moments that need care
      contains: How permissions, onboarding, paywalls, and empty, loading and error states are handled.
    - name: Size and mode check
      contains: Results for a small and a large iPhone, light and dark mode, and the largest text size.
    - name: Gaps and unchecked items
      contains: Places that break Apple conventions, and anything your AI could not check, such as no simulator.
