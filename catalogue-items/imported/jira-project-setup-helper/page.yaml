headline: Jira project setup helper
subhead: Jira that matches how your team really works. Say how your team plans
  and ships, Scrum or Kanban, and what you want to track. The skill picks a
  project type, then proposes issue types, a workflow with the right statuses
  and transitions, fields and permissions.
explain: |
  Jira that matches how your team really works. Say how your team plans and ships, Scrum or Kanban, and what you want to track. The skill picks a project type, then proposes issue types, a workflow with the right statuses and transitions, fields and permissions.

  It writes JQL searches from plain language, such as high priority bugs assigned to me, with a script that checks the syntax. It builds dashboard filters and automation rules for routine moves. Through the Atlassian connection it can create and search issues, but projects themselves must be made in the Jira web screen or with its REST interface. You need a Jira account and connector access.
when:
  - You are starting a new team and need a Jira project that fits.
  - Your board has statuses nobody uses and it confuses everyone.
  - You need a query that finds overdue work across projects.
  - You want rules that move or assign tickets for you.
you_give:
  - "How your team works: Scrum, Kanban or other"
  - What you want to track and report
  - Your current setup and pain points (optional)
  - Jira access through the Atlassian connector
you_get:
  - A project and workflow design
  - Ready JQL queries
  - Dashboard and filter ideas
  - Automation rules
  - Steps for what to set up by hand
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can connect to Jira.
