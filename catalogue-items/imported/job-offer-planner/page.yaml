thinking: high
thinking_why: Pay, risk and the candidate's options all pull against each other.
new_slug: job-offer-planner
name: Job offer planner
summary: Give it the role and what the candidate wants. Get an offer package, a
  negotiation plan and call scripts.
job: hire-people
headline: Job offer planner
subhead: An offer that has a real chance of being accepted, with a plan for the
  conversation after it. Give it the role, your budget limits and what the
  candidate has said they want.
explain: |
  An offer that has a real chance of being accepted, with a plan for the conversation after it. Give it the role, your budget limits and what the candidate has said they want. The skill builds the full package: base, bonus, equity, sign-on, benefits, relocation, title, start date and flexibility.

  When base pay is capped it suggests other levers, such as a faster review, a year-one guaranteed bonus or a shorter equity cliff. It then plans the negotiation: what you can give, what you hold, and how to respond to likely counters. You also get call scripts for presenting the offer and closing, so you can handle objections calmly.
when:
  - Your top candidate wants more than your budget allows.
  - You must write an offer and are not sure what to include.
  - A candidate has a competing offer and you need to respond fast.
  - You want a script for the offer call.
you_give:
  - The role and salary range
  - The candidate's expectations and other offers
  - Your constraints on pay and equity
  - Your must-win points (optional)
you_get:
  - A full offer package
  - Creative options when pay is capped
  - A negotiation plan with fallbacks
  - Scripts for the offer call and closing
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tool is needed.
  - "Paste what you know: the role and pay range, your budget limits, what the candidate asked for and any rival offers."
  - Paste your own market pay data with its source and date, if you have it. Ask for the offer package first. Check each part against your real budget.
  - Before you plan any concessions, compare the offer with what current staff in the same role earn, and check your local rules on asking about past pay. The skill flags both, but the check is yours.
  - Ask for the negotiation plan and the call scripts. Change anything you would not say out loud.
  - Use only figures you can source when you talk to the candidate. Do not quote statistics you cannot check.
  - Once the package is agreed, use the Offer letter drafter to write the letter.
not_for:
  - "You only need the letter itself. Use the Offer letter drafter."
  - "You already have a letter and want its legal terms checked. Use the Offer letter and non-compete checker."
  - "You have not picked a candidate yet. Compare your finalists with the Fair candidate comparer first."
output_sample:
  input:
    - The role, level and pay range
    - What the candidate has said they want, and any other offers they hold
    - Your limits on pay and equity
    - The points you must win (optional)
    - Market pay data for the role (optional)
  output:
    - name: Candidate context
      contains: Current pay if known, what they asked for, rival offers, what drives them and likely doubts.
    - name: Proposed package
      contains: A table of base, bonus, equity, sign-on and totals, with where each sits against the market.
    - name: Negotiation strategy
      contains: Both sides' fallback options, the order of concessions, your limits and your walk-away point.
    - name: Counter-offer defense
      contains: The likely counter from their current employer and how to respond.
    - name: Closing plan
      contains: Dates for the call, the written offer and the deadline, who talks to them, and a backup candidate.
    - name: Risk table
      contains: Each risk rated high, medium or low, with an action.
    - name: Call scripts
      contains: Words for the verbal offer and the written offer, in order.
