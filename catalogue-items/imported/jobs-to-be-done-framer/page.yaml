thinking: high
thinking_why: It has to separate what customers say from the job they are really hiring for.
new_slug: jobs-to-be-done-framer
name: Jobs-to-be-done framer
summary: Find the job your customers hire your product to do. Give it a problem. You get job statements, struggling moments and hire and fire reasons.
job: understand-customers
headline: Jobs-to-be-done framer
subhead: A way to stop guessing what customers want by asking what job they hired your product to do. Give it a product or customer problem.
explain: |
  A way to stop guessing what customers want by asking what job they hired your product to do. Give it a product or customer problem. The skill separates three things teams often mix up: a list of feature requests, a decorative persona, and a real job.

  It writes job statements in the form: when this, I want that, so I can get this. It finds struggling moments, the points where people give up on their current choice, and the reasons they hire and fire a solution. It tests each statement against a product decision your team is debating. It also warns about when this method becomes empty ceremony, so the output serves discovery, priorities and positioning.
when:
  - Your roadmap is a long list of feature requests with no pattern.
  - Your personas are cute but do not help you choose what to build.
  - You want to understand why customers switch away from you.
  - You need sharper positioning for a product.
not_for:
  - "You need a full customer profile with buying habits and demographics: use a customer research step or a short survey of your own buyers."
  - "You want feature ideas or a build list: talk to your team and customers first, then bring the real decision here."
  - "You have no product or customer problem yet and only a broad idea: start by talking to five people who have the problem."
you_give:
  - A product or customer problem
  - Interview notes or research (optional)
  - A decision your team is debating (optional)
  - Who your customers are (optional)
you_get:
  - Job statements
  - Struggling moments
  - Hire and fire reasons
  - A test of the framing against your decision
  - Notes on how to use the jobs in priorities and positioning
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text into a new chat.
  - Gather first the recent customer moments where they chose or left a product, the product decision you are debating, and who the customers are. Paste your product or customer problem with those.
  - Ask your AI to work in this order. Clarify the problem, draft the job statements, find the struggling moments, then test each job against your decision.
  - Read the job statements first. Check that each one describes a real moment, not a feature request.
  - Look at the decision test. Use the hire and fire reasons to shape your priorities and how you describe the product.
  - Bring the result to your next prioritisation or positioning meeting, and test it against real customer calls. For positioning, use the Product positioning planner next. For the roadmap, use the Roadmap update writer.
next: [product-positioning-planner, roadmap-update-writer]
output_sample:
  input:
    - A product or customer problem
    - Interview notes or research (optional)
    - A decision your team is debating (optional)
    - Who your customers are (optional)
  output:
    - name: Job statements
      contains: "Each job written as: when this happens, I want this, so I can get this."
    - name: Struggling moments
      contains: The points where people give up on what they use now and look for something new.
    - name: Hire and fire criteria
      contains: Why people pick a solution, and why they drop it, which are often different.
    - name: Functional, emotional and social dimensions
      contains: What each job means in practical, personal and public terms.
    - name: Decision test
      contains: A check of the job framing against the product decision your team is debating.
    - name: Use in priorities and positioning
      contains: Notes on how to use the jobs to rank work and to shape how you describe the product.
