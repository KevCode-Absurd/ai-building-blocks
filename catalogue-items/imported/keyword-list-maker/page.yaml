thinking: low
thinking_why: It follows strict output rules on one text.
new_slug: keyword-list-maker
name: Keyword list maker
summary: "Paste any text and get a keyword list for SEO or tags: one line of up to 50 ranked keywords, ready to copy into your site."
job: get-found-in-search
headline: Keyword list maker
subhead: "One clean line of up to fifty keywords from any text you paste. The output is machine-ready: lowercase, comma separated, ranked from most to least relevant, with no numbers, bullets, notes or full stop at the end."
explain: |
  One clean line of up to fifty keywords from any text you paste. The output is machine-ready: lowercase, comma separated, ranked from most to least relevant, with no numbers, bullets, notes or full stop at the end.

  The list mixes single words with phrases of two to four words and removes duplicates and near matches. It covers the main subjects and ideas in the text, not filler. Use it for SEO fields, tags, metadata and search indexing. Short or thin text is handled by a fallback rule, so you get fewer, truer keywords instead of padding. Because the format never changes, you can feed the line straight into another tool.
when:
  - You have a blog post and need tags for your CMS.
  - You want a keyword field for a product page.
  - You need metadata for a batch of documents.
  - You want a quick check of which topics a text really covers.
not_for:
  - "You want a short summary of your text: ask your AI for a summary instead, since this makes keywords only."
  - "You need to know how often people search each keyword: check a search tool such as Google Keyword Planner, as this list uses no search data."
  - "You need keywords in a table or with notes: ask your AI directly, because this gives one plain line and nothing else."
you_give:
  - The text to extract keywords from
  - The purpose, such as SEO or tags (optional)
  - A cap lower than 50 (optional)
you_get:
  - One comma-separated line of up to 50 keywords
  - Ranked by relevance
  - Lowercase and without duplicates
  - A mix of words and short phrases
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill instructions into the chat.
  - On the next message, paste the text you want keywords for.
  - Say what the list is for, such as SEO or tags. Add a limit if you want fewer than 50 (optional).
  - Copy the one-line result into your tags field, SEO field or product keyword box.
  - Check the keywords against real search data before you publish.
output_sample:
  input:
    - The text you want keywords for
    - What the keywords are for, such as SEO or tags (optional)
    - A lower limit than 50 keywords (optional)
  output:
    - name: Keyword line
      contains: One line of up to 50 keywords, lowercase and separated by commas, with no numbers, bullets, notes or full stop.
    - name: Ranking order
      contains: The main topic of your text comes first, then key terms, tools and names, then common searches and side topics.
    - name: Keyword mix
      contains: Single words and phrases of two to four words, with repeats and near matches removed.
