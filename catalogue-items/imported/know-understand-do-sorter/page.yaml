thinking: medium
thinking_why: It sorts content by type before it picks how to test.
new_slug: know-understand-do-sorter
name: Know, understand, do sorter
summary: Sort your unit into what students know, understand and do, then match each part to a test type. Paste your unit to get a know, understand, do chart.
job: teach-and-train
headline: Know, understand, do sorter
subhead: "A teaching unit sorted into three clear columns: what students will know, understand and be able to do. Paste your unit description, project brief or competencies and give the learner stage."
explain: |
  A teaching unit sorted into three clear columns: what students will know, understand and be able to do. Paste your unit description, project brief or competencies and give the learner stage. Every item in the chart is labelled by type of knowledge. Hierarchical knowledge is facts and steps that build on each other. Horizontal knowledge is ideas that stand in separate areas, each judged by how well you analyse it. Dispositional knowledge is habits and attitudes that show over time.

  Each label links to the kind of test that fits it, for example recall for facts, explanation for ideas and performance for skills. The design draws on Understanding by Design and research on feedback and motivation. Treat that research as the author's reading, not settled fact. It keeps tests low-pressure so students feel supported, not judged. You can feed in existing learning targets and your school's competency list.
when:
  - You are planning a new unit and want clear targets.
  - Your tests do not match what you taught.
  - You need to explain your unit to colleagues in one chart.
  - A unit mixes facts, big ideas and skills and you need to separate them.
not_for:
  - "You plan a single lesson: write the lesson aims by hand, or ask your AI for a simple lesson plan."
  - "Your content has no clear split between facts, ideas and skills: talk it through with a colleague first, then come back."
  - "You need marking rubrics or full tests: use this chart first, then build the rubric or test as a separate step."
you_give:
  - A unit description or project brief
  - The learner stage or age range
  - Existing learning targets (optional)
  - Your school's competency framework (optional)
you_get:
  - A know, understand and do chart
  - Knowledge type labels
  - Matching assessment types
  - Notes on keeping assessment low-pressure
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill instructions into the chat. In the prompt, replace the bracketed fields with your own details. Type your unit description where it says curriculum input, and your learner stage where it says learner stage. Add your learning targets or competency list if you have them.
  - The result has three columns, Know, Understand and Do. Each item carries a knowledge label and a matching test type.
  - Read the chart. Check that each item sits in the right column and that each test type fits.
  - Fix any item that looks misplaced, then ask your AI to redo that part.
  - "Next, write a marking rubric for the Do: Skills items with the Marking rubric writer. For the Do: Dispositions items, plan how you will watch for the habit over several weeks."
output_sample:
  input:
    - Your unit description, project brief or competency
    - The learner stage or age range
    - Your existing learning targets (optional)
    - Your school's competency framework (optional)
  output:
    - name: Know
      contains: Facts and steps that build on each other, each labelled by knowledge type.
    - name: Understand
      contains: Big ideas that sit in separate areas, each labelled by knowledge type.
    - name: "Do: Skills"
      contains: What students can perform, with the skill type named.
    - name: "Do: Dispositions"
      contains: Habits and attitudes students build, with low-pressure ways to notice them.
    - name: Assessment Routing Plan
      contains: The test type that fits each item, such as recall, explanation or performance.
    - name: Sequencing Notes
      contains: Which items to teach first and which depend on others.
    - name: Gap Analysis
      contains: What your unit or targets leave out or do not match.
    - name: Design Flags
      contains: Warnings about items that are hard to test fairly.
