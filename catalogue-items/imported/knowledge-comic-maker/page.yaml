thinking: medium
thinking_why: It plans the story and panels, then follows set steps to draw them.
new_slug: knowledge-comic-maker
name: Knowledge comic maker
summary: Turn a topic or story into a knowledge comic with a script, panel layouts and drawn pages in the art style and tone you pick.
job: make-images
headline: Knowledge comic maker
subhead: A finished comic that teaches a topic or tells a story, planned panel by panel and drawn page by page. Give it the subject. The skill asks you to choose an art style and a tone, then writes a script and lays out each page.
explain: |
  A finished comic that teaches a topic or tells a story, planned panel by panel and drawn page by page. Give it the subject. The skill asks you to choose an art style and a tone, then writes a script and lays out each page.

  Every picture gets its own saved prompt file before anything is drawn, so you can review and reuse them. Images come from whichever image tool your setup has, such as a built-in image generator. The skill will not draw with code or paint over text on a bitmap, because that breaks the look. You need an image generator available. Output is a set of pages you can publish or share.
when:
  - You want to explain a hard idea to readers who skim text.
  - You have a story and need it as a comic.
  - You want a consistent art style across many pages.
  - You need a teaching handout that people will read.
not_for:
  - "You need one infographic or a single image: ask your AI image tool directly."
  - "You only want a text handout or summary: use a plain document instead."
  - "You have no image tool, or no way to run code: you will get the script and prompts but no drawn pages."
you_give:
  - A topic, story or source text
  - Preferred art style and tone
  - Page count or length (optional)
  - Access to an image generator
you_get:
  - A panel-by-panel script
  - Page layouts
  - Saved image prompts
  - Drawn comic pages
how_to_use:
  - Open an AI that can run code and use an image tool. Check that bun or npx is installed. The image tool may need a paid account or API key, and each drawn page can cost credits, so check its price first.
  - Add the skill to your AI, or paste its instructions into the chat.
  - Say what the comic is about. Paste your story or source text if you have it.
  - On first run, answer the one-time setup questions. They save your preferences.
  - Pick an art style and a tone when asked. Add a page count if you want a set length.
  - Read the script and prompt files before the pages are drawn. Ask for changes, then let it draw.
  - Find everything in the comic/ folder under a short name for your topic. Share the merged PDF, or post the page images one by one. Redraw any weak page by asking for that page number.
output_sample:
  input:
    - Your topic, story or source text
    - Your pick of art style and tone
    - Page count or length (optional)
    - Your preferred image tool (optional)
  prerequisites:
    - An AI that can run code, with bun or npx installed
    - An image tool your AI can use, which may need a paid account or API key
    - A one-time preferences setup (EXTEND.md) that runs before any analysis
  output:
    - name: Analysis
      contains: What your topic or story is about, who it is for, and the points the comic must teach.
    - name: Storyboard
      contains: The page list and the panels on each page, with the story beat for each panel.
    - name: Character and style notes
      contains: How the cast and the chosen art style and tone stay the same on every page.
    - name: Image prompt files
      contains: One saved prompt per picture, written before drawing so you can review and reuse it.
    - name: Comic pages
      contains: The drawn pages, one image per page, ready to share or publish. Pages are portrait (3:4) unless you ask for another shape.
    - name: Merged PDF
      contains: All pages in one PDF named after your topic, saved with the script and prompt files in comic/ under your topic name.
