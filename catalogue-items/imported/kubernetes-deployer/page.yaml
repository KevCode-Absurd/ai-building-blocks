thinking: medium
thinking_why: It follows known manifest patterns for your app.
new_slug: kubernetes-deployer
name: Kubernetes deployer
summary: Give it your app. Get manifests, Helm charts and autoscaling so it runs
  on Kubernetes.
job: ship-and-host
headline: Kubernetes deployer
subhead: Your app, running on Kubernetes, with the config files to prove it.
  Give the container image, how many copies you want and how much CPU and memory
  each may use.
explain: |
  Your app, running on Kubernetes, with the config files to prove it. Give the container image, how many copies you want and how much CPU and memory each may use. The skill first confirms your kubectl points at the right cluster and namespace. It then writes the deployment, service and ingress files, including health probes and TLS for your domain.

  After applying them it watches the rollout and checks every pod came up healthy. Then it adds autoscaling so replicas grow and shrink with load. For apps with several environments it packages everything into a Helm chart with values per environment. You need kubectl access to a real cluster, and it can run commands against it.
when:
  - You have a container image and need it running in production on Kubernetes.
  - You want the app to add copies automatically when traffic spikes.
  - You run staging and production and want one Helm chart with different
    settings for each.
  - You need a domain with HTTPS pointing at your service.
you_give:
  - Container image name and tag
  - Number of replicas and resource limits
  - Health check path
  - Domain name for ingress
  - Target cluster and namespace
you_get:
  - Deployment, service and ingress manifests
  - A rollout check after apply
  - Autoscaling rules
  - A Helm chart with per-environment values (optional)
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read your project files.
