thinking_why: It runs set tests and reports the numbers.
new_slug: language-model-benchmark-runner
name: Language model benchmark runner
summary: Run your language model through 60 or more standard benchmarks like MMLU and GSM8K. Get a score table you can compare with other models.
job: build-software
headline: Language model benchmark runner
subhead: Scores for your model on the same tests everyone else uses, so you can compare it with other models fairly. Point the skill at a model, such as one from Hugging Face, and pick tasks from the 60 or more in EleutherAI's open test suite.
explain: |
  Scores for your model on the same tests everyone else uses, so you can compare it with other models fairly. Point the skill at a model, such as one from Hugging Face, and pick tasks from the 60 or more in EleutherAI's open test suite. These include MMLU for knowledge, GSM8K for maths and HumanEval for code.

  It writes the command, sets batch size and device, runs it and gathers the results into one table. Because the prompts and metrics are fixed, a score from your run lines up with published ones. You need Python, the lm-eval package and a GPU for larger models.
when:
  - You fine-tuned a model and want to know if it got better or worse.
  - You are choosing between two open models for a project.
  - You want to compare your model with published leaderboard numbers.
  - You need a repeatable evaluation to run after every training change.
not_for:
  - You want to judge fairness, cost or how well a model holds a chat. Use HELM, a broader open test suite, or a person who reads sample answers.
  - You have no GPU or Python setup. Test an API model instead, or ask someone on your team to run it.
  - You need a test built on your own business tasks. Write a small custom test set from real examples, or ask an engineer to add a custom task.
you_give:
  - The model name or path
  - Which benchmarks to run
  - Access to a GPU machine
  - A past results file to compare with (optional)
you_get:
  - The exact run command
  - Scores per benchmark
  - A results table
  - Notes on how to compare across models
how_to_use:
  - "Gather what you need first: your model name or path, a computer with a GPU, Python, and the list of benchmarks to run."
  - Install the test tool by running pip install lm-eval on that computer.
  - Paste the skill into your AI and tell it your model and benchmarks. Ask for the run command first.
  - "Run the command. Your AI must run code, or you run it yourself and paste the results back. Plan for time: MMLU takes about 2 hours for a 7B model on one A100 GPU."
  - For HumanEval, turn on code execution, or the test will not run. It runs code the model wrote, so do it only in an isolated sandbox or container, not on a machine with private files or keys.
  - Ask your AI to build the results table and flag any score that looks far from published numbers.
  - Next, compare your scores with the published leaderboard numbers. After each training change, run the same command again and compare with your last run.
output_sample:
  input:
    - Your model name or the path to your model files
    - The benchmarks you want to run, such as MMLU or GSM8K
    - A computer with a GPU and Python
    - Scores from an earlier run to compare with (optional)
  prerequisites:
    - An AI that can run code, or a computer where you can run commands yourself
    - Python with the lm-eval package installed
    - A GPU for larger models
    - Code execution turned on for HumanEval
  output:
    - name: Run command
      contains: The exact lm_eval command with your model, tasks, device, batch size and number of examples per question.
    - name: Results file
      contains: A JSON file with the score and error margin for each benchmark, plus the settings used.
    - name: Comparison table
      contains: One row per model and one column per benchmark, so you can read scores side by side.
    - name: Training progress chart
      contains: A line chart of scores across saved checkpoints, if you track a model as it trains.
    - name: Comparison notes
      contains: Tips to match published scores, such as using the same example count and task names.
