thinking: high
thinking_why: It covers many risk areas in one pass.
new_slug: launch-legal-reviewer
name: Launch legal reviewer
summary: Check a product plan against each legal area before you ship. Get a launch legal review memo plus a safe note for your ticket. Not legal advice.
job: check-contracts
headline: Launch legal reviewer
subhead: A review memo that checks your product plan against each legal area your team cares about, before you ship. Share the plan, a PRD, a Drive link or a ticket.
explain: |
  A review memo that checks your product plan against each legal area your team cares about, before you ship. Share the plan, a PRD, a Drive link or a ticket. The skill reads your team's own framework and risk settings, then goes through every category one by one and rates each finding against what really blocks a launch in your company.

  Novel questions are flagged clearly. The memo follows your house format, and a summary can be posted to the ticket. It can pass marketing claims to the Marketing claims checker, and deeper risk questions to the Feature legal risk assessor. It is a first check, not legal advice, and a qualified lawyer should review the result. It needs your setup file filled in.
when:
  - Product wants to know if a feature can ship next week.
  - You received a PRD and need a legal issues list by category.
  - You need to see which concerns are blockers and which are minor.
  - You want a consistent memo format across launches.
not_for:
  - "You only need to check ad or marketing copy: use the Marketing claims checker, not this one. This review covers every legal area, and the Marketing claims checker covers only the claims in your copy."
  - "You need one risk studied in depth: use the Feature legal risk assessor, since this review gives each area only a first check."
  - "Your launch is in a sector with its own rules, such as children's products, health or finance, or is outside the US: the base eight areas are not enough. The skill adds a sector overlay for these, so name the sector. Have a local lawyer check the result."
  - "You need a final legal opinion or sign-off: ask a qualified lawyer. This memo is a first check."
you_give:
  - The product plan or PRD
  - Your team's legal review framework
  - Risk calibration settings
  - A ticket ID (optional)
you_get:
  - A category by category review memo
  - Each finding rated for risk
  - Flags on new or unclear issues
  - A summary for the ticket
how_to_use:
  - Before you start, know that a lawyer must review any Clear to ship call. This memo is a first check, not sign-off.
  - Open your AI tool and add the skill. Use one that can read files. The skill reads a setup file named CLAUDE.md in the product-legal folder of your Claude settings, so your AI needs to reach that folder. A legal research tool is optional, and Westlaw is paid while CourtListener is free.
  - "Fill in your team's legal setup file first. It needs three things: the legal areas to check, what counts as a blocker and what is only a note, and the format you want the memo in. The folder includes a setup interview that asks for these. The skill stops if placeholders remain."
  - Paste your PRD, Drive link or ticket ID. Add related documents if you have them.
  - Ask your AI to run the launch review. It checks each legal area in turn and rates each finding.
  - Read the bottom line and any flagged new questions. Send those to a lawyer. If you are not a lawyer, do not treat a Clear to ship call as sign-off until a lawyer has reviewed the memo.
  - Keep the full memo private. Post only the safe tracker note to your ticket, then run the Marketing claims checker on your marketing copy and run the Feature legal risk assessor on any deep risk. Check every legal citation in the memo against the official source before you rely on it.
output_sample:
  input:
    - Your product plan, PRD, Drive link or ticket ID
    - Your team's legal setup file (CLAUDE.md) with your framework and risk settings, filled in before you start
    - Related documents for the launch (optional)
    - Your ticket tracker connection (optional)
  prerequisites:
    - An AI that can read your files, including the setup file filled in with no placeholders left
    - Your team's legal framework and risk settings written into that setup file
    - "Optional: a legal research tool such as Westlaw (paid) or CourtListener (free)"
  output:
    - name: Launch review memo
      contains: The full private memo in your house format, for people inside the legal circle only.
    - name: Bottom line
      contains: "A clear call: clear to ship, ship with conditions, blocked, or needs escalation."
    - name: Findings by category
      contains: Each legal area in your framework, with what was found, a risk rating and the reason.
    - name: Action items
      contains: What must change before launch, with who owns it and by when.
    - name: Escalations
      contains: New or unclear questions that need a lawyer's judgment.
    - name: Notes for next time
      contains: Points worth remembering for the next launch review.
    - name: Citation check
      contains: A check on the sources the memo relies on.
    - name: Safe to post to tracker
      contains: A short, non-private comment with status, conditions, owners and deadlines, and no legal reasoning.
