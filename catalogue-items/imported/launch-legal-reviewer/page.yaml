thinking: high
thinking_why: It covers many risk areas in one pass.
new_slug: launch-legal-reviewer
name: Launch legal reviewer
summary: Give it your product plan. Get a memo that checks each legal area
  before you ship. First check, not legal advice.
job: check-contracts
headline: Launch legal reviewer
subhead: A review memo that checks your product plan against each legal area
  your team cares about, before you ship. Share the plan, a PRD, a Drive link or
  a ticket.
explain: |
  A review memo that checks your product plan against each legal area your team cares about, before you ship. Share the plan, a PRD, a Drive link or a ticket. The skill reads your team's own framework and risk settings, then goes through every category one by one and rates each finding against what really blocks a launch in your company.

  Novel questions are flagged clearly. The memo follows your house format, and a summary can be posted to the ticket. It can pass marketing claims or deeper risk questions to related skills. It is a first check, not legal advice, and a qualified lawyer should review the result. It needs your setup file filled in.
when:
  - Product wants to know if a feature can ship next week.
  - You received a PRD and need a legal issues list by category.
  - You need to see which concerns are blockers and which are minor.
  - You want a consistent memo format across launches.
you_give:
  - The product plan or PRD
  - Your team's legal review framework
  - Risk calibration settings
  - A ticket ID (optional)
you_get:
  - A category by category review memo
  - Each finding rated for risk
  - Flags on new or unclear issues
  - A summary for the ticket
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your saved product legal setup notes and
    your files.
  - Where the skill points to /product-legal:cold-start-interview, use the
    setup-interview folder inside it. We copied it in so the skill works on its
    own.
