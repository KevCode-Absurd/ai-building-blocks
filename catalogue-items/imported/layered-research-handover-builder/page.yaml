thinking: high
thinking_why: It follows a set method with a few checks.
new_slug: layered-research-handover-builder
name: Layered research handover builder
summary: "Turn your research notes and sources into a layered research handover: a short summary that links to deeper analysis and evidence files."
job: document-work
headline: Layered research handover builder
subhead: Share your research question, notes, sources, and who will read the work. It separates the main findings from deeper analysis and source records. You get a linked research folder so readers can start with the summary and inspect the evidence when needed.
not_for:
  - "You only need a quick answer to one question: ask your AI directly, no folder needed."
  - "You have a one-off lookup or calculation: just run it and keep the answer, no handover needed."
  - "Your source material is already the final product and needs no summary: share it as it is."
you_give:
  - A research question, audience, notes, source evidence, and a destination folder.
you_get:
  - A research index, findings summary, topic analyses, evidence records, and coverage notes.
how_it_works:
  - title: Separate the layers
    text: Keep the index for finding files. Put findings in the summary, reasoning in the analysis, and source facts in evidence records.
  - title: Connect findings to evidence
    text: Link each summary to the right analysis files. Link the analysis to the records behind it.
  - title: Check the handover
    text: Check the entry point, paths, and gaps. Make sure each file makes sense on its own. Treat the bundled checker as a helper.
works_best_with:
  tools:
    - name: A chat AI that can read the bundled reference files
      why: Use the supplied references and templates for the chosen task. Scripts are optional unless that task specifically needs them.
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat. The skill reads four reference files in its folder, so keep the folder together.
  - Give your AI your research question, your notes and sources, who will read the work, and a folder to save into.
  - Ask your AI to follow this skill. It drafts the one-file summary first, links it to one file per topic, and links each topic file to evidence files (source excerpts, data, method notes). It repeats until no gaps are left.
  - Open 00-index.md and the summary first. Click through to a topic file and an evidence file to check the links work and each file makes sense alone.
  - Read the coverage notes for gaps. Fill them, then ask your AI to update the links.
  - Share the index and the summary with readers first. Send the evidence files only to people who want to check the sources.
output_sample:
  input:
    - Your research question
    - Your notes and source material
    - Who will read the work
    - A folder to save the files in
  prerequisites:
    - An AI that can read the skill's reference files
    - An AI that can create files in a folder, or you copy the text out yourself
    - Python 3.9 and a shell only if you want the optional checker script
  output:
    - name: 00-index.md
      contains: A map of the project that helps readers find files, with no findings in it.
    - name: 01-summary/
      contains: One file with the research question, key findings and main implications, linking to the analysis files.
    - name: 02-analysis/
      contains: One file per topic, such as market or risk, each readable alone and linking to evidence.
    - name: 03-dossiers/
      contains: A flat set of files with source excerpts, raw data, transcripts and method notes.
    - name: SOURCES section
      contains: A closing list in every file of the paths below it and what you will find there.
    - name: artifact-inventory.md
      contains: A tracker of which files exist at each layer, so gaps are easy to spot.
