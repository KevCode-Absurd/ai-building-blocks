new_slug: lead-handoff-designer
name: Lead handoff designer
summary: Describe your sales process. Get lead scoring, stages and handoff rules
  from marketing to sales.
job: sell-and-negotiate
headline: Lead handoff designer
subhead: The rules that tell marketing, sales and customer success when a lead
  is ready to pass on, written down before you automate anything. Describe your
  sales process, deal size and tools.
explain: |
  The rules that tell marketing, sales and customer success when a lead is ready to pass on, written down before you automate anything. Describe your sales process, deal size and tools. The skill builds a lead scoring model, defines each stage from new lead to closed deal, and sets handoff rules with a time limit and an owner for every step.

  It works from a few principles: one system of record, definitions before automation, and a tracked handoff at every transfer, since each one can leak leads. It also covers fixing definitions when sales will not work what marketing calls qualified. It starts with whatever you can tell it.
when:
  - Marketing says leads are good and sales says they are not.
  - Leads sit untouched for days before anyone calls.
  - You are setting up your CRM and need stage definitions.
  - You want a speed-to-lead target and a way to track it.
you_give:
  - How you sell, self-serve or sales-led
  - Average deal size and sales cycle
  - Your CRM and marketing tools
  - How leads are handled today
you_get:
  - A lead scoring model
  - Stage definitions
  - Handoff rules with time limits
  - Metrics to track each handoff
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
