thinking: high
thinking_why: Rules must fit together without gaps.
new_slug: lead-handoff-designer
name: Lead handoff designer
summary: Design lead scoring, stage definitions and marketing-to-sales handoff rules before you automate. Give it your sales process, deal size and tools.
job: sell-and-negotiate
headline: Lead handoff designer
subhead: The rules that tell marketing, sales and customer success when a lead is ready to pass on, written down before you automate anything. Describe your sales process, deal size and tools.
explain: |
  The rules that tell marketing, sales and customer success when a lead is ready to pass on, written down before you automate anything. Describe your sales process, deal size and tools. The skill builds a lead scoring model, defines each stage from new lead to closed deal, and sets handoff rules with a time limit and an owner for every step.

  It works from a few principles: one system of record, definitions before automation, and a tracked handoff at every transfer, since each one can leak leads. It also covers fixing definitions when sales will not work what marketing calls qualified. It starts with whatever you can tell it.
when:
  - Marketing says leads are good and sales says they are not.
  - Leads sit untouched for days before anyone calls.
  - You are setting up your CRM and need stage definitions.
  - You want a speed-to-lead target and a way to track it.
not_for:
  - "You are a single seller with no CRM: use a simple spreadsheet of leads and follow-up dates instead."
  - "You need cold outreach emails: use a cold email writer, not this skill."
  - "You need nurture emails for leads who are not ready: use an email drip campaign tool instead."
you_give:
  - How you sell, self-serve or sales-led
  - Average deal size and sales cycle
  - Your CRM and marketing tools
  - How leads are handled today
you_get:
  - A lead scoring model
  - Stage definitions
  - Handoff rules with time limits
  - Metrics to track each handoff
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code or paid tool is needed to run it.
  - Describe how you sell, your deal size, your sales cycle and the tools you use.
  - Say what is going wrong today, such as slow follow-up or leads sales rejects. Start there.
  - Have ready your current lead volume, your current MQL definition (marketing qualified lead) and any response-time promises you already make. If you have past won and lost leads, add them, so the scoring can be tested. Without that history, start with fit and engagement points only.
  - Treat any benchmark it quotes, such as conversion rates or response-time figures, as a rough rule of thumb. Compare against your own past numbers.
  - Read each document it gives you. Check that every stage and handoff has an owner and a time limit.
  - Fix anything that does not match how your team works. Then build it in your CRM.
  - The skill names enrichment tools such as Clay, Apollo and ZoomInfo. These are paid services that need their own accounts. You can skip them.
  - Next, use the Cold email writer for the outreach your reps send, and the Pricing strategist if pricing is part of the deal desk.
output_sample:
  input:
    - "How you sell: self-serve, sales-led or a mix"
    - Your average deal size and how long a sale takes
    - Your CRM, marketing and scheduling tools
    - How leads are handled today and what goes wrong (optional)
  output:
    - name: Lifecycle stage document
      contains: Each stage from new lead to closed deal, with entry and exit rules, owners and time limits.
    - name: Scoring specification
      contains: Fit and engagement points for a lead, and the score that makes a lead ready for sales.
    - name: Routing rules document
      contains: Who gets each lead, how it is assigned, and what happens when no one picks it up.
    - name: Pipeline configuration
      contains: Deal stages, required fields and the automation triggers that move a deal forward.
    - name: Metrics dashboard spec
      contains: The numbers to track at each handoff, where the data comes from and the targets to aim for.
