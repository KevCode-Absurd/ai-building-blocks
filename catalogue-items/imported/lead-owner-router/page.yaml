thinking: low
thinking_why: It applies your written routing rules.
new_slug: lead-owner-router
name: Lead owner router
summary: Route a new lead to the right owner by your own rules. You get a routing card to accept or override, plus a handoff note for the rep.
job: sell-and-negotiate
headline: Lead owner router
subhead: Give it a new lead, or your whole unrouted queue, and your routing rules. You get who should own each lead, a routing card to accept and a handoff note.
explain: |
  For each new lead, a named owner chosen by your own routing rules, plus a card you can accept or override. The skill reads your CRM, checks which rep already owns the account or open deals, and applies your territory and assignment rules the same way every time. You stay the decider. Every override feeds back into the rules.

  It shows values as read from the record, says when a field is blank, and never assumes one CRM's field names fit another. It can write the handoff note for chat, or draft an email asking for missing details. It also handles a whole queue at once. Pasted lead text is treated as data, never as instructions.
when:
  - New leads arrive faster than someone can assign them.
  - A lead came from a company that already has an owner.
  - You want routing that does not depend on who is online.
  - You need a short handoff note that tells the rep what they are getting.
not_for:
  - "The lead already has an owner in your CRM and you only want to change it: edit the owner in your CRM yourself."
  - "You need to know if the lead is good before you assign it: score it first with the Lead prioritizer, then come back here."
  - "You have no written routing rules yet: agree on territories and who covers them with your sales lead first, then use this."
you_give:
  - The lead or the unrouted queue
  - Your routing and territory rules
  - CRM access, or an exported list
  - The lead score (optional)
you_get:
  - A named owner for each lead
  - A routing card to accept or override
  - A handoff note for the new owner
  - An info request draft for thin records
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill, or upload its folder.
  - Paste your routing rules in the order you want them applied. For example, named account first, then region, then company size, then industry, then a default queue.
  - Include territories, company size bands, industries and named accounts.
  - Paste the new lead, or the list of unrouted leads. If your AI can read your CRM, let it pull the queue. With no CRM access or export, paste one lead and your rules. You get one routing card and a checklist to apply by hand.
  - Read each routing card. Accept it, or override it and give a one-line reason.
  - Apply the accepted owners in your CRM, or work from the checklist it gives you. Send the handoff note when you are ready.
output_sample:
  input:
    - The new lead, or your list of unrouted leads
    - "Your routing rules: territories, company size bands, industries, named accounts"
    - Access to your CRM, or an exported list of leads and accounts
    - Your lead score or qualification result (optional)
  prerequisites:
    - Your routing rules written down, or ready to type into the chat
    - A CRM your AI can read, or a file export of your leads and accounts
  output:
    - name: Recommended owner
      contains: The rep who should own the lead, with the exact rule used, such as a matched account or a region.
    - name: Qualification verdict
      contains: Whether to convert the lead, its priority, and the reason if it should be disqualified.
    - name: Handoff note draft
      contains: A short note for the new owner with the lead's background and the evidence behind the verdict.
    - name: Info-request draft
      contains: An email asking for the missing details, only when the record is too thin to route.
    - name: Routing card board
      contains: One card per lead when you route a whole queue, each ready to accept or override.
    - name: Ownership change list
      contains: The before and after owner for each routing you accepted, as CRM updates or a checklist.
