thinking: medium
thinking_why: It reads many sources and picks what matters.
new_slug: legal-daily-and-incident-briefer
name: Legal daily and incident briefer
summary: Pick a daily scan, a topic or an incident. Get a short briefing from
  your email, calendar and files. Not legal advice.
job: check-contracts
headline: Legal daily and incident briefer
subhead: Pick a daily scan, a topic or an incident. Get a short briefing from
  your email, calendar and files. Not legal advice. Bring the question or
  situation (for topic or incident). Use the result to plan your next step.
explain: |
  A short legal briefing built from your own email, calendar and files, in whichever of three forms you need. The daily brief scans for contract requests, compliance questions, counterparty replies and urgent items so you start the morning knowing what needs you. The topic brief researches one legal question.

  The incident brief covers a fast-moving situation, pulling the facts you have into one view. Pick the mode, or let it ask. It only uses sources you have connected, and says so when one is missing. These briefs support your work and are not legal advice, so have a qualified lawyer check anything you act on.
when:
  - You want a morning list of what needs legal attention.
  - A manager asked a legal question and you need a quick topic summary.
  - A data issue just broke and you need the facts in one place.
  - You are covering for a colleague and need to catch up fast.
you_give:
  - "Which mode: daily, topic or incident"
  - The question or situation (for topic or incident)
  - Access to email, calendar or files
  - Your priorities (optional)
you_get:
  - A short briefing
  - Items sorted by urgency
  - Sources the summary used
  - Open questions for a lawyer
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your email, calendar and files.
