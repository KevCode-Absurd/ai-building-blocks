thinking: medium
thinking_why: It follows a set notice format and fills in your facts.
new_slug: legal-hold-notice
name: Records preservation notice drafter
summary: Draft a legal hold notice that tells staff which records to keep when a dispute is likely. Also refresh or release it. A first draft for a lawyer.
job: check-contracts
headline: Records preservation notice drafter
subhead: A notice telling staff which records they must keep when a dispute is likely, written as a first draft for a lawyer to review. Tell it about the matter.
explain: |-
  Draft a notice telling staff which records to keep when a dispute is likely. Give the matter facts, forum, people, date range and systems. In a normal chat, get draft text and a proposed log entry for your legal team. A Word tool can make a file. No plugin is needed for this drafting route.

  The plugin route can read an existing matter workspace, after its intake and conflicts checks. Both routes keep attorney review and current-source checks. A draft does not issue or release a hold, preserve records, change retention settings or update a real matter log. Status covers only the records supplied. The example below shows the plugin route with Word and file access.
when:
  - A customer threatened a lawsuit and you must stop records being deleted.
  - The scope of a case grew and staff need an updated notice.
  - An employee on the hold list has left the company.
  - The matter settled and you need to release the hold.
not_for:
  - "You plan to send a notice or release records without legal review: have the authorised legal team approve the action first."
  - "You need a company-wide retention policy: ask your lawyer or records manager; this draft covers one matter."
you_give:
  - The dispute, key facts and forum whose rules apply
  - The people and teams who hold records
  - The date range, systems, legal contact and proposed signer
  - Any existing notice, house template and counsel instructions
  - For plugin operations, a matter logged after intake; for status, the records to review
you_get:
  - Draft notice text, or a Word file if your AI has a Word tool
  - A draft refresh or proposed release for legal review
  - A proposed log entry marked draft until an authorised person confirms the actual event
  - A status summary limited to the records supplied
how_to_use:
  - In a normal chat, paste this skill and the matter facts. Ask for a draft first notice, refresh, proposed release or status summary. No slash command is needed.
  - Use the plugin route only if claude-for-legal and its matter workspace are available. Complete its intake and conflicts check before any issue, refresh or release.
  - Ask the AI to mark missing facts and rules it could not check. Word files need a Word tool; a normal chat can return text.
  - Read the draft and proposed log entry. Have the legal team confirm scope, custodians, the current rules and any privilege marking.
  - The authorised legal team handles issuance, preservation and release. A draft alone changes none of these. Record actual dates only after the completed action is confirmed.
output_sample:
  input:
    - The matter name and the key facts of the dispute
    - The people and teams who hold records
    - The date range and the systems involved
    - Your matter log and your house-style notes file
    - "Which job to run: issue, refresh, release or status"
  prerequisites:
    - An AI that can read your saved legal setup files and make Word files
    - A matter already added to your matter log
    - Your house-style notes file with your hold template pointer
  output:
    - name: legal-hold-v1.docx
      contains: The first hold notice, with scope, people, date range and systems, in your house style.
    - name: Next version of the notice
      contains: A refreshed notice with scope changes, and a flag on any person who has left.
    - name: Release notice
      contains: A notice ending the hold, with the release date and what to do with the records.
    - name: Log update
      contains: The hold fields in your matter log, with a history entry and the next refresh date.
    - name: Legal Hold Status report
      contains: "A report across all matters: active holds, holds needing attention and recently released holds."
