thinking: high
thinking_why: It must spot cases where a template is unsafe.
new_slug: legal-inquiry-reply-drafter
name: Legal inquiry reply drafter
summary: Draft a reply to a legal request, like a data access request or subpoena, and see when a lawyer must review it before you send.
job: check-contracts
headline: Legal inquiry reply drafter
subhead: Name the request, such as a data access request or an NDA request. You get a draft reply and a flag when a lawyer must review it.
explain: |
  A first draft of the reply to a common legal request, with a clear signal when a lawyer must look before it goes out. Name the request type: data subject request, discovery hold, vendor question, NDA request, privacy question, subpoena or insurance notice. The skill finds your saved template for that type, fills in the details and adds escalation triggers.

  If the type is unclear, it asks and shows the options. You can also use your own template. It saves time on repeat requests while keeping the sensitive ones in front of the right person. Replies are drafts only and not legal advice, so a qualified person should check them. No reply templates come with this item, so bring your own or use the default structure the skill offers. The skill includes a starting structure for a data request reply and for an NDA request reply. It is a copy of Anthropic's legal-response skill under the Apache 2.0 licence. What changed here: the plain name, the page text, a note that no templates come with it, a default structure for data and NDA replies, and extra lawyer-review rules for subpoenas and regulator letters.
when:
  - Someone has asked to see or delete their personal data.
  - A business team wants an NDA and keeps asking the same questions.
  - A vendor sent a legal question your team answers often.
  - A subpoena arrived and you need a first framework only. A lawyer must review it before any reply goes out.
not_for:
  - "You need legal advice or a final answer on a risky case: ask a qualified lawyer, because this only writes a first draft."
  - "You want to review or mark up a contract: read it with a lawyer, since this tool replies to requests and does not check contract terms."
  - "You have no reply templates and want a finished letter: ask a lawyer for an approved template first, or use the draft structure this tool offers as a starting point."
you_give:
  - The type of request
  - The request itself or its details
  - Your reply templates (optional)
  - Facts specific to this case
you_get:
  - A draft reply
  - Details filled into your template
  - Escalation flags
  - A note on what a lawyer must check
how_to_use:
  - Before you paste anything, do not put privileged, personal or confidential case details into a public AI chat unless your organisation has approved that tool.
  - Open a chat in Claude, ChatGPT or Gemini. Paste in the text of SKILL.md from this item's folder, or upload the folder if your AI takes files. The full skill is in SKILL.md, not on this page.
  - Say which type of request it is, such as data access request, NDA request, subpoena or vendor question.
  - Paste the request and your reply template for that type (optional). Add the facts of this case. For a data request, give who asked, what they asked for, which law applies and the deadline. For an NDA, give the other party, the purpose and whether it runs one way or both.
  - Subpoenas and letters from a regulator or from law enforcement always need a lawyer first. Do not send any draft for these before a lawyer has read it.
  - Read the escalation check first. If it flags a risk, send the draft to a lawyer before anything else.
  - Check the draft reply and fill any gaps it marks. Have a qualified person approve it, then send it.
output_sample:
  input:
    - The type of request, such as a data access request, NDA request or subpoena
    - The request itself or its key details
    - Your saved reply templates (optional)
    - Facts about this case, such as names and dates
  prerequisites:
    - An AI that can read your reply templates, if you have them
    - A qualified person to review the draft before it goes out
  output:
    - name: Escalation Check
      contains: A list of warning signs found in this request and whether a lawyer must look before you reply.
    - name: Generated Response
      contains: The draft reply, with your details filled into the template for this type of request.
    - name: Follow-Up Actions
      contains: The usual next steps after you send the reply, taken from the template.
    - name: Notes
      contains: What a lawyer should check, missing details, and where the draft departs from your template.
