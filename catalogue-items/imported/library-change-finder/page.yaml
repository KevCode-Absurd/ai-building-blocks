thinking: medium
thinking_why: It runs a tool and then reads the results.
new_slug: library-change-finder
name: Library change finder
summary: Find which Python library changes came after your AI's training cutoff and where your code uses them. Get optional notes for AGENTS.md or CLAUDE.md.
job: test-and-fix-code
headline: Library change finder
subhead: AI models write code from what they learned before a cutoff date. If your project pins newer library versions, the model may use old methods.
explain: |
  AI models write code from what they learned before a cutoff date. If your project pins newer library versions, the model may use old methods. This finds the gap in your Python project and shows where your code is affected.

  It reads your lockfile, checks the model's cutoff, and lists which pinned libraries changed their interfaces since then. Then it points to the files in your code that call those changed parts. The scan does not change your project files. It writes only to its own git-ignored .since-cutoff folder and a local cache. If you want, it previews short notes for your AGENTS.md or CLAUDE.md and writes them only after you agree. It needs the small since-cutoff tool, which it asks before downloading.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to Mohammad Hijjawi and sickn33.

  Cost: the scan and the notes are read-only except for the notes block, and they cost nothing. The optional run test is paid. It sends prompts to a model provider and uses your credits.
when:
  - Your AI keeps calling library functions that no longer exist.
  - You upgraded packages and want to know what the AI may get wrong.
  - You want a standing note in your repo about changed library behaviour.
  - You maintain a Python project and use a coding agent daily.
not_for:
  - "Your project is not written in Python: this tool only reads Python projects, so check the library release notes yourself."
  - "You need to know if a library behaves differently behind the same function names: it only compares names and settings, so read the changelog and run your tests."
  - "You want to fix broken code right now: this finds likely causes, so paste the error into your AI and ask for a fix."
you_give:
  - A Python project with pinned dependencies
  - The AI model you use
  - Permission to run the since-cutoff tool
  - A yes or no on writing notes (optional)
you_get:
  - The model's cutoff and affected libraries
  - Changed interfaces your code uses
  - The files that use them
  - A previewed notes block for AGENTS.md or CLAUDE.md
how_to_use:
  - Open your AI tool in your Python project folder. It needs to run commands and read files, as in Claude Code, Codex, Cursor or Gemini CLI.
  - Paste this skill into the chat and tell your AI which model you use.
  - Say yes when it asks to download the since-cutoff tool. It reads your files and does not run your code.
  - Read the summary. Check each changed library and the files that use it.
  - The skill can also run an optional test, since-cutoff run, to see which changes your model gets wrong. That test sends prompts to the model company you pick and uses your credits or plan allowance. It never sends your source code. Say no unless you want it. The cost is not shown in advance and depends on the model and how many changes it tests. If you say yes, pick the cheapest model and a few libraries first, and check your provider's usage page afterward.
  - Ask for the notes preview if you want them. Read the diff, then say yes to write it into AGENTS.md or CLAUDE.md.
  - Then ask your AI to update the flagged calls or pin the library version, and run the scan again to check.
  - If the scan reports missing items, such as no lockfile, create one with your package tool (for example uv lock) or pin versions in requirements.txt, then run the scan again.
output_shape: |-
  Model and cutoff: <model name, cutoff date>
  | Library | Pinned version | Changed since cutoff | Changed API your code uses | Files |
  Notes preview: <diff for AGENTS.md or CLAUDE.md, shown before any write>
  MISSING: <anything the scan could not read, such as no lockfile>
output_sample:
  input:
    - Your Python project folder with pinned library versions
    - The AI model you use, such as a Claude or OpenAI model
    - Your OK to download and run the since-cutoff tool
    - Your yes or no on writing notes into your project (optional)
  prerequisites:
    - An AI that can run commands and read your project files
    - Internet access, so the tool can fetch library releases and model dates
    - "For the optional since-cutoff run test only: an account with a model provider, and credits or plan allowance to spend"
    - The uv tool, which runs since-cutoff for you
  output:
    - name: Model and cutoff
      contains: The AI model name and the date its training knowledge ends.
    - name: Changed libraries
      contains: Each pinned library that changed its public interface since that date, with the old and new versions.
    - name: Changed APIs your code uses
      contains: The functions, classes or settings that were renamed, moved or removed, and that your code calls.
    - name: Files that use them
      contains: The files in your project that call each changed part.
    - name: Notes preview
      contains: A short diff of the notes block for AGENTS.md or CLAUDE.md, shown before anything is written.
    - name: AGENTS.md or CLAUDE.md block
      contains: One marked block of short notes on changed libraries, written only after you agree.
