new_slug: link-preview-fixer
name: Link preview fixer
summary: Share a link that looks wrong. Get the tags and image fixes so it shows a rich card everywhere.
job: build-websites
headline: Link preview fixer
subhead: Share a link that looks wrong. Get the tags and image fixes so it shows a rich card everywhere.
explain: |
  When you share a link and it shows a bare URL or the wrong picture, this finds why and gives you the fix. Your pages then show a proper card on Facebook, LinkedIn, X, WhatsApp, Telegram, Slack and Discord.

  It starts with the raw HTML to see which tags exist. Then it supplies a complete set of Open Graph and Twitter tags, with absolute image addresses. The image check covers 1200 by 630 pixels, a size under 8 MB, and public access with no login. It adds notes for each platform, because each reads tags a little differently. Finally it shows how to test with each platform's own preview checker.
when:
  - A link you shared shows no image or the wrong title.
  - You launched a new page and want sharing to look right.
  - Your blog posts all show the same preview.
  - A platform shows an old card even after you changed the page.
you_give:
  - The page link or its code
  - The platform that looks wrong
  - Your site framework (optional)
  - The image you want shown (optional)
you_get:
  - The cause of the broken preview
  - A ready set of sharing tags
  - An image size and access checklist
  - Platform-specific notes
  - Steps to test and refresh the preview
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read your project files.
