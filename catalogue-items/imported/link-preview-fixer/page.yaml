thinking: low
thinking_why: The fixes follow known tag rules.
new_slug: link-preview-fixer
name: Link preview fixer
summary: Fix a link preview that shows a bare URL or the wrong picture. Get the sharing tags and image fixes so your link preview shows a rich card.
job: build-websites
headline: Link preview fixer
subhead: When you share a link and it shows a bare URL or the wrong picture, this finds why and gives you the fix. Your pages then show a proper card on Facebook, LinkedIn, X, WhatsApp, Telegram, Slack and Discord.
explain: |
  When you share a link and it shows a bare URL or the wrong picture, this finds why and gives you the fix. Your pages then show a proper card on Facebook, LinkedIn, X, WhatsApp, Telegram, Slack and Discord.

  It starts with the raw HTML to see which tags exist. Then it supplies a complete set of Open Graph and Twitter tags, with absolute image addresses. The image check covers 1200 by 630 pixels, a size under 8 MB, and public access with no login. It adds notes for each platform, because each reads tags a little differently. Finally it shows how to test with each platform's own preview checker.
when:
  - A link you shared shows no image or the wrong title.
  - You launched a new page and want sharing to look right.
  - Your blog posts all show the same preview.
  - A platform shows an old card even after you changed the page.
not_for:
  - "Your page has no public web address yet: put it online first, then run this. Platform checkers cannot read a page they cannot reach."
  - "Your tags are added by JavaScript in the browser: ask your developer to move them into the page's HTML first, then use this to check them."
  - "You want a new share image designed: use a design tool or a designer, then come back to check the size and link."
you_give:
  - The page link or its code
  - The platform that looks wrong
  - Your site framework (optional)
  - The image you want shown (optional)
you_get:
  - The cause of the broken preview
  - A ready set of sharing tags
  - An image size and access checklist
  - Platform-specific notes
  - Steps to test and refresh the preview
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Add your page link and say which platform shows the wrong preview. Paste your page code too if you can.
  - Say which framework your site uses and where your share image is kept (optional).
  - Read the cause first. Then copy the tag block into your page and fix any image problems on the checklist.
  - Publish the change. Paste your link into each platform's checker to refresh the preview. Check each platform's current docs, as image rules can change.
  - Your AI cannot open links itself unless it has web access. If it cannot, paste your page code in.
  - The code helper in the skill is for a Next.js site. It stops with an error if you have not set your real site address, so links never point at a placeholder domain. On any other site, your AI writes the same tags by hand.
  - After every deploy, check the link again in each platform's checker, and note any platform that still shows an old card. X's older card checker may be retired. If it fails, post the link in a draft to see the card.
output_sample:
  input:
    - Your page link or its code
    - The platform that looks wrong
    - Your site framework (optional)
    - The path to the image you want shown (optional)
  prerequisites:
    - A page that is live on the public web, so the platform checkers can read it
    - An AI that can read your page code, or code you can paste in
  output:
    - name: Why previews break
      contains: The likely cause of your broken preview, matched against common problems like missing tags or relative image links.
    - name: Sharing tag block
      contains: A full set of Open Graph and Twitter tags with absolute image links, written for your framework.
    - name: OG image checklist
      contains: Size, file weight, secure link, file name and public access checks for your share image.
    - name: Platform-specific notes
      contains: One short note each for Facebook, X, LinkedIn, WhatsApp, Telegram, Slack and Discord.
    - name: Debugging steps
      contains: How to check your raw page code for the tags and test them in each platform's own checker.
    - name: Social metadata checklist
      contains: A tick list to confirm tags, image and cache refresh are done on every platform.
