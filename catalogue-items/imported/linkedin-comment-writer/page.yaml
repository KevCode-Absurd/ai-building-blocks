thinking: low
thinking_why: It writes a short piece from a clear rule.
new_slug: linkedin-comment-writer
name: LinkedIn comment writer
summary: Paste a LinkedIn post and get a short comment that adds something new, in your voice. Use it to write LinkedIn comments that get read.
job: grow-social
headline: LinkedIn comment writer
subhead: Paste a post. You get a comment that adds something new instead of agreeing, in your voice, or a plain "skip this one" if you have nothing to add.
explain: |
  A short LinkedIn comment that adds something the post did not have, written in your voice. It replaces the "Great post!" that nobody reads.

  First it helps you decide whether to comment at all. Then it finds the gap in the post: what is missing, assumed or too general. Next it picks one of five shapes: a counterexample, an extension, a specific case, an honest disagreement about the idea, or a real question. It keeps the comment short and standalone, and removes any pitch. The same method works when you reply on someone else's thread. It never posts for you.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to prateeks367 and sickn33.
when:
  - You want to get noticed by people you admire without sounding fake.
  - Your comments get no replies.
  - You have a view on a post but cannot find the words.
  - You are tempted to just write "agree" and move on.
not_for:
  - "You want to write your own LinkedIn post: write it yourself, or ask your AI for a draft from your own idea."
  - "You want a comment that sells or links to your offer: this skill will not write one. Send a direct message instead."
  - "You have nothing to add to the post: skip it. The skill will say so rather than write filler."
you_give:
  - The post text
  - Your own experience or view
  - Your name, role and goal on LinkedIn (optional)
  - A sample of your writing (optional)
you_get:
  - A comment that adds something new
  - The gap it found in the post
  - A choice of comment shape
  - A comment of two to four sentences, ready to paste
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tool are needed.
  - Paste the full text of the LinkedIn post. The skill works from pasted text only, so a link or a screenshot will not do.
  - Add your own view or experience in a line or two. Add your role and a writing sample if you have them.
  - Read the gap it found. If it says skip, skip the post.
  - Check the comment is short, stands alone and has no pitch. Then post it yourself, as the skill never posts for you.
  - After you post, check for replies the next day and answer them. If the gap you found is a point you can make well, keep it as an idea for your own post.
  - The skill also mentions an optional VoiceMoat connector. It needs a paid Pro or Enterprise plan and a sign-in, and it sends post text to voicemoat.com. The skill works fully without it, needs no account and makes no network calls on its own.
output_sample:
  input:
    - The text of the LinkedIn post
    - Your own experience or view on it
    - Your name, role and goal on LinkedIn (optional)
    - A sample of your writing (optional)
  output:
    - name: Comment or skip
      contains: A call on whether you have anything real to add, or a plain "skip this one".
    - name: The gap
      contains: What the post assumed, left out or got right for an unstated reason, and which kind it is.
    - name: Comment shape
      contains: "One of five shapes: counterexample, extension, specific, honest disagreement or real question."
    - name: The comment
      contains: Two to four sentences that stand alone, lead with substance and carry no pitch or link.
