thinking_why: It picks a hook pattern and fills it in.
new_slug: linkedin-hook-post-writer
name: LinkedIn hook post writer
summary: Give a topic and angle. Get a LinkedIn post built on a tested opening
  line for your goal.
job: grow-social
headline: LinkedIn hook post writer
subhead: "A LinkedIn post that opens with a line chosen for what you want it to
  do: draw comments, reposts, likes or saves. You pick the goal first and the
  opening follows."
explain: |
  A LinkedIn post that opens with a line chosen for what you want it to do: draw comments, reposts, likes or saves. You pick the goal first and the opening follows.

  The skill holds 16 tested opening formulas, each matched to an engagement goal. You give it a topic, an angle and who you are talking to. It selects a formula, drafts the post with current formatting rules, such as keeping the hook above the fold. Then it scrubs wording that sounds machine-written and hands you the result. It warns against picking a hook just because its raw reach number is bigger.
when:
  - You have a story but your first line is weak.
  - You want more comments, not just views.
  - Your drafts sound like every other AI post.
  - You need a post ready within ten minutes.
you_give:
  - Your topic
  - Your angle or point of view
  - "Your main goal: comments, reposts, likes or saves"
  - Your audience (optional)
  - Real facts or numbers you can use (optional)
you_get:
  - A drafted post
  - The opening formula used and why
  - Formatting set for the feed
  - A cleaned version without AI tells
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
