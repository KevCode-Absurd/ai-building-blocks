thinking: medium
thinking_why: It writes short messages in your voice with set rules.
new_slug: linkedin-outreach-plan
name: LinkedIn comment and outreach planner
summary: Plan LinkedIn outreach that starts with comments. Get a weekly commenting list, short connection notes and a safe pace. You send every message.
job: grow-social
headline: LinkedIn comment and outreach planner
subhead: A plan to grow your reach on LinkedIn by commenting first and reaching out second, and every message is sent by you. Tell it who you want to reach and it builds the list and the notes.
explain: |
  A plan to grow your reach on LinkedIn by commenting first and reaching out second, and every message is sent by you. Tell it who you want to reach and it builds the list and the notes.

  It makes a short roster of people worth engaging, then drafts comments that carry a point only your own view could add. Connection notes and direct messages each include one line written for that person. It sets a safe pace so your volume does not look like spam, and plans one follow-up a week later, only if you have something new. It avoids engagement pods and never sends anything for you.
when:
  - You want to meet ten people in your field this month.
  - You need a connection note that gets accepted.
  - You are not sure how many messages are safe to send.
  - You want to grow through comments instead of cold pitching.
not_for:
  - "You want cold email or a sales pitch: write it with a cold email tool or a salesperson, since this plan covers LinkedIn only."
  - "You want to post your own content: write the post yourself or with a LinkedIn post writer, since this plan only covers comments and messages."
  - "You want a tool that sends messages for you: send each one by hand, because automated sending breaks LinkedIn's rules."
you_give:
  - Who you want to reach
  - Your goal
  - Your background in a sentence
  - Weekly time or message volume
  - People or companies you already follow (optional)
you_get:
  - A commenting roster
  - Connection request notes
  - Direct message drafts
  - A weekly pace you can keep
  - A follow-up rule
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. Scripts need an AI that can run code. Without it, your AI follows the same rules by hand.
  - Tell it who you want to reach, your goal, your background in a sentence and how much time you have each week.
  - Ask for a commenting roster first. Name 8 to 12 accounts you already read, or let it suggest the kinds to look for.
  - Write your own comments from the roster. The plan will not write them for you.
  - Check your invitation volume before you write notes. Then ask for one note per person, with a line about them.
  - Send each message yourself. Comment for two weeks before you invite.
output_sample:
  input:
    - Who you want to reach
    - Your goal
    - Your background in a sentence
    - Weekly time or message volume
    - People or companies you already follow (optional)
  prerequisites:
    - An AI that can run code, to use the three small scripts (without code, your AI can follow the same rules by hand)
  output:
    - name: Comment roster
      contains: 8 to 12 accounts worth reading, with size tier, and a weekly plan that fits your daily minutes.
    - name: Volume check
      contains: A safe, tight or over verdict on your invitations, pending requests, acceptance rate and time.
    - name: Connection note
      contains: One short note for one person, with a line only they could get, and no ask.
    - name: Direct message or InMail
      contains: One message for one person with a specific line, a reason and one small ask.
    - name: Outreach order
      contains: Comment for two weeks, then invite, then ask once after they accept.
    - name: Follow-up rule
      contains: One follow-up a week later, only if you have something new to say.
