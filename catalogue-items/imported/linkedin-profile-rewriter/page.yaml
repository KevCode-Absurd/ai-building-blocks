thinking: medium
thinking_why: It rewrites each section with set checks.
new_slug: linkedin-profile-rewriter
name: LinkedIn profile rewriter
summary: Fix your LinkedIn profile headline, About section and experience bullets. Get a scored audit and a rewrite that puts your best point first.
job: grow-social
headline: LinkedIn profile rewriter
subhead: A LinkedIn profile that tells people why to contact you. You describe yours and get a sharper headline, About section and experience bullets, fixed in the order that pays off most.
explain: |
  A LinkedIn profile that tells people why to contact you. You describe yours and get a sharper headline, About section and experience bullets, fixed in the order that pays off most.

  It starts with an audit, then rewrites only the parts that earn their keep. The headline puts your strongest point first. The About section is written in first person, with the key message above the "see more" cut. Experience bullets use your real facts, never invented titles or numbers. It also looks at the banner, Featured section and recommendations. Nothing is scraped, so you paste in what your profile says.
when:
  - Your profile gets views but no messages.
  - You are changing roles and need your story rewritten.
  - You are unsure what your About section should say.
  - Your headline is just a job title.
not_for:
  - "You need a post plan or posting schedule: use a LinkedIn content planner, since this only fixes your profile."
  - "You need a CV for a recruiter or job application: use a CV rewrite tool or a career coach."
  - "You have no real results yet: write plain, honest bullets about your work first, then come back."
you_give:
  - Your current profile text
  - Who you want to attract
  - Your goal, such as a job or clients
  - Real results you can prove
you_get:
  - A profile audit
  - A rewritten headline
  - A new About section
  - Stronger experience bullets
  - Notes on Featured, banner and recommendations
how_to_use:
  - Open Claude, ChatGPT or Gemini. Attach SKILL.md and its scripts folder if your AI takes files and can run code. If it can only take pasted text, paste SKILL.md and use the hand-scoring route in the last step.
  - Paste your profile text, section by section. Add who you want to reach and your goal.
  - Add real results you can prove. Your AI should not invent any. Check every number and claim against your own records before you publish.
  - Fix the quick wins from the audit first, then take the new headline.
  - "Check the About section: your main point and call to action must sit above the see more cut. Where the cut falls changes with the screen, so check it on your own profile on a phone and a laptop."
  - The scoring scripts need an AI that can run code. If yours can't, ask it to score and rewrite by hand. You then see the same five headline scores (audience, outcome, proof, searchability, clarity), and the profile checklist worked in the same order.
output_sample:
  input:
    - Your current profile text, section by section
    - Who you want to attract
    - Your goal, such as a job or clients
    - Real results you can prove (optional)
  prerequisites:
    - An AI that can run code, to use the three scoring scripts. Without it, your AI can still do the rewrite by hand.
  output:
    - name: Profile audit
      contains: A score out of 100 across 14 checks, with fixes ranked by points gained per hour.
    - name: First-hour plan
      contains: The quick fixes to do first, often Featured, Open To and skills.
    - name: Headline
      contains: A rewritten headline scored on audience, outcome, proof, searchability and clarity, within the 220 character limit.
    - name: About section
      contains: A first-person About section with your key message and call to action placed above the see more cut.
    - name: Experience bullets
      contains: Duty lists turned into outcomes, using only facts you gave.
    - name: Featured and recommendations notes
      contains: Advice on what to pin and how to ask for two specific recommendations.
