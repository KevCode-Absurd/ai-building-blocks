thinking: low
thinking_why: It scores against a fixed checklist.
new_slug: listing-completeness-scorer
name: Listing completeness scorer
summary: Score each active Shopify product on missing descriptions, images, SEO, weight, barcode and cost. Get a product data completeness report, worst first.
job: run-your-store
headline: Listing completeness scorer
subhead: Every product in your store scored on how complete its data is, worst first, so you know exactly what to fix. It only reads, and changes nothing in your shop.
explain: |
  Every product in your store scored on how complete its data is, worst first, so you know exactly what to fix. It only reads, and changes nothing in your shop.

  It pulls your products from Shopify and checks seven things: description, images, search settings, weight, barcode, cost and extra fields. Each product gets a score from a fixed scoring guide. The list is ordered with the most incomplete products at the top. You can then work through the gaps in batches. It tracks the session and reports errors plainly if a request fails. It needs access to your store's API.
when:
  - Your catalogue has gaps and you do not know where.
  - You want to fix search settings before a sale.
  - Shipping quotes break because product weights are missing.
  - You are cleaning up after importing hundreds of products.
not_for:
  - "You have fewer than about 20 products: check them by hand in a spreadsheet instead."
  - "You want to fix the gaps for you: this only reads your store, so edit products in Shopify admin or by hand."
  - "You do not use Shopify: this reads the Shopify admin, so use a spreadsheet check of your own product list."
you_give:
  - Access to your Shopify store
  - Which products to check, if not all (optional)
  - Which fields matter most to you (optional)
you_get:
  - A completeness score for each product
  - The missing fields on each product
  - A list ordered worst first
  - Totals for each type of gap
how_to_use:
  - Open an AI that can run code and use the Shopify CLI, such as Claude Code. A plain chat window cannot reach your store. Claude Code needs a paid Claude plan or API credits. The Shopify CLI is free, but you need a Shopify store and staff or app access with permission to read products.
  - Sign in to your store with read-only product access. Cost data may also need permission to read inventory.
  - Paste the skill into your AI. Give it your store address.
  - Add the status to check and any required metafields, if you want them (optional). By default only active products are scored. Ask for draft or all products if you want those too.
  - Open the report and the CSV. Fix the lowest scores first, starting with missing descriptions and images.
  - Run it again after a clean-up to see if your average score went up. Re-run it monthly, and use the CSV to plan a bulk edit in Shopify admin for the weakest products.
output_sample:
  input:
    - Your Shopify store address
    - "Which products to check: active, draft or all (optional)"
    - Metafields you require on every product (optional)
  prerequisites:
    - An AI that can run code and use the Shopify CLI
    - Read access to your store's products
    - Permission to read product cost, which may need the inventory read scope
  output:
    - name: Start banner
      contains: The skill name, your store address and the start time.
    - name: Step progress lines
      contains: One line per step showing what was asked and how many products came back.
    - name: Completeness report
      contains: Products scored, average score, and counts of products below 50, from 50 to 79, and 80 or more.
    - name: Lowest scoring products
      contains: The worst products with their score out of 100 and the fields each one is missing.
    - name: completeness CSV file
      contains: One row per product with its score, image count and yes or no for each checked field.
