thinking: medium
thinking_why: It searches, then groups papers by theme.
new_slug: literature-review-finder
name: Literature review finder
summary: Find the key papers for your literature review. Give it a topic and get real studies from PubMed and OpenAlex, sorted by theme in a Word guide.
job: think-and-decide
headline: Literature review finder
subhead: A starting set of real academic papers on your topic, found from free databases and sorted by theme. You can trust each paper because it was found in this session.
explain: |
  A starting set of real academic papers on your topic, found from free databases and sorted by theme. You can trust each paper because it was found in this session.

  It asks three questions first: how specific your question is, which framework fits, and how deep to go. It picks PICO for clinical questions, SPIDER for social ones, or a problem-solution-evaluation split for technology. It then searches PubMed and OpenAlex, which need no key, and can add Consensus if connected. It tracks searches run, unique papers and papers kept, and only cites what came back. It retries failures gently and tells you when it stops.
when:
  - You are new to a field and need the main papers fast.
  - You have a clinical question and want a structured search.
  - You need a reading list before writing a proposal.
  - You want a search record you can show your supervisor.
not_for:
  - "You only want a quick list of papers on one topic: run a plain search in PubMed or Google Scholar instead."
  - "You need a finished, written literature review: this gives a reading guide, so write the review yourself or with your supervisor."
  - "Your AI cannot run code or make Word files: ask for a plain chat list of papers, or use a tool that can run code."
you_give:
  - Your research topic or question
  - Your field
  - How deep you want to go
  - Date or study type limits (optional)
you_get:
  - A search plan with framework
  - Papers found, deduplicated
  - Papers grouped by theme
  - Counts of searches and papers
  - A note on any search failures
how_to_use:
  - Use an AI that can run code and reach the web, such as Claude with code execution. The Word file needs Node.js and the docx package.
  - Paste the skill into the chat, or load the skill folder if your AI tool supports it.
  - Say what your topic is, and add your field. Answer the three short questions it asks about how specific your question is, which framework fits, and how deep to go.
  - Check the recon summary and the framework it proposes. Confirm the sub-areas and the depth before it runs the full searches.
  - Open the Word guide. Start with the Start Here list, then use the bibliography to find papers for your proposal or literature section.
output_sample:
  input:
    - Your research topic or question
    - Your field
    - "How deep you want to go: 5, 10 or 20 searches"
    - Date or study type limits (optional)
  prerequisites:
    - An AI that can run code, with Node.js and the docx package, to make the Word file
    - An AI that can reach the web, to search PubMed and OpenAlex
    - "A Consensus plan (optional, paid): only if you want Consensus added to the search"
  output:
    - name: Search plan
      contains: The framework chosen for your question (PICO, SPIDER or a split by problem, solution and evaluation) and the sub-areas to search.
    - name: research_guide Word file
      contains: A Word guide that orients you in the field, with themes, key papers and links to each paper.
    - name: Papers grouped by theme
      contains: Papers found in this session, with no repeats, sorted under the themes of your topic.
    - name: Start Here list
      contains: The papers to read first if you are new to the field.
    - name: Bibliography
      contains: Every paper cited in the guide, with authors, year, journal and link.
    - name: Audit line
      contains: How many searches ran, how many unique papers came back, how many were cited, and which search sources were used.
