thinking: medium
thinking_why: The steps are set, but sizing the run to your computer takes care.
new_slug: litgpt-model-trainer
name: LitGPT model trainer
summary: Train a small open model on your own examples with LitGPT. Get download, LoRA tuning and chat commands sized to your GPU.
job: build-software
headline: LitGPT model trainer
subhead: A small open model, downloaded, trained on your examples and ready to chat with, without writing training code from scratch. You pick the model and data and get working commands.
explain: |
  A small open model, downloaded, trained on your examples and ready to chat with, without writing training code from scratch. You pick the model and data and get working commands.

  It uses LitGPT, a clean library with more than 20 model designs, including Llama, Gemma, Phi, Qwen and Mistral. For one graphics card it suggests LoRA, a light method that fits in about 16 GB, and small models such as Phi-2 that use 8 to 12 GB. Full tuning of a 7B model needs 40 GB or more. It also covers pretraining from scratch and viewing logs. You need Python and a GPU.
when:
  - You want a small model that answers in your tone or format.
  - You have a single GPU and need a method that fits.
  - You want to learn how model designs differ by training one.
  - You have a set of question and answer examples ready.
not_for:
  - "You have no GPU or cannot run Python: use a hosted fine-tuning service, or ask a developer to run it for you."
  - "You only want to use a model, not train one: chat with it in Claude, ChatGPT or Gemini."
  - "You need to train a model above 70B across many machines: use Megatron-Core, as the skill itself advises."
you_give:
  - The model you want to start from
  - Your training examples
  - Your GPU memory
  - Your goal for the model
you_get:
  - Download commands for the model
  - A tuning command sized to your GPU
  - Settings for LoRA or full tuning
  - Steps to chat with the result
  - How to watch training logs
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill.
  - Tell your AI which model you want, how much GPU memory you have and what the model should do.
  - Paste or describe your training examples. Your AI will put them in the right JSON format.
  - For gated models like Meta-Llama, sign in to Hugging Face, accept the licence and give your access token first.
  - Run the commands your AI gives you on your own computer. This needs Python, LitGPT and a GPU. A chat window cannot run them for you, so paste any error back and ask for a fix.
  - Two helper scripts named in the skill are not in this folder. Your AI will tell you what to do by hand for the dataset and GGUF steps.
  - Check that your tuned model appears in the out folder, then try the chat steps.
output_sample:
  input:
    - The small open model you want to start from
    - Your training examples, as question and answer pairs
    - How much memory your GPU has
    - What you want the model to do
    - A Hugging Face account and access token (only for gated models like Meta-Llama)
  prerequisites:
    - An AI that can run Python code, on a computer with a GPU
    - LitGPT installed with pip
    - A Hugging Face account and accepted licence, for gated models
  output:
    - name: Download command
      contains: The litgpt download command for your chosen model, which saves it to the checkpoints folder.
    - name: Dataset file
      contains: Your examples saved as a JSON file with instruction, input and output fields.
    - name: Fine-tuning command
      contains: A LoRA or full tuning command with settings sized to your GPU memory.
    - name: Training logs
      contains: How to watch progress in the logs file or in TensorBoard while training runs.
    - name: out/finetune/
      contains: The folder where checkpoints are saved, including the final tuned model.
    - name: Merged model folder
      contains: Optional folder made by the merge command, with LoRA changes folded into the base model.
    - name: Chat steps
      contains: Short Python steps to load your tuned model and ask it questions.
