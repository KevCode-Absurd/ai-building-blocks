new_slug: litgpt-model-trainer
name: LitGPT model trainer
summary: Pick a small open model and your data. Get it downloaded, trained on your examples and ready to chat with.
job: build-software
headline: LitGPT model trainer
subhead: Pick a small open model and your data. Get it downloaded, trained on your examples and ready to chat with.
explain: |
  A small open model, downloaded, trained on your examples and ready to chat with, without writing training code from scratch. You pick the model and data and get working commands.

  It uses LitGPT, a clean library with more than 20 model designs, including Llama, Gemma, Phi, Qwen and Mistral. For one graphics card it suggests LoRA, a light method that fits in about 16 GB, and small models such as Phi-2 that use 8 to 12 GB. Full tuning of a 7B model needs 40 GB or more. It also covers pretraining from scratch and viewing logs. You need Python and a GPU.
when:
  - You want a small model that answers in your tone or format.
  - You have a single GPU and need a method that fits.
  - You want to learn how model designs differ by training one.
  - You have a set of question and answer examples ready.
you_give:
  - The model you want to start from
  - Your training examples
  - Your GPU memory
  - Your goal for the model
you_get:
  - Download commands for the model
  - A tuning command sized to your GPU
  - Settings for LoRA or full tuning
  - Steps to chat with the result
  - How to watch training logs
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run Python code on a computer with a GPU.
