thinking: high
thinking_why: Active testing needs careful scoping and judgement.
new_slug: live-app-security-tester
name: Live app security tester
summary: Run a safe security scan on your own staging web app or API. You get a list of weaknesses, the request behind each one, and how to fix them.
job: secure-code
headline: Live app security tester
subhead: A list of weaknesses found in a running web app or API that you own, found by safe probing from the outside. You get a report with how to fix each one.
explain: |
  A list of weaknesses found in a running web app or API that you own, found by safe probing from the outside. You get a report with how to fix each one.

  You set the target and scan rules first. If the app has a login, you supply a valid test account or token. The scan uses tools such as OWASP ZAP, Burp or Nuclei to crawl, then probe the app. Each finding is sorted by type and severity score. The report gives the page, the request and the fix. You can then schedule it nightly against staging. Always scan staging, never production, since probes can change data.
when:
  - You are about to launch and want an outside check on your app.
  - You own an API and want to find exposed endpoints.
  - You want a regular nightly scan against your test site.
  - A customer asked for a security test report.
not_for:
  - "You want to test your live production site: scan a staging copy instead, because probes can change or break data."
  - "You do not own the site or have written permission to test it: do not scan it, and ask the owner for approval."
  - "You need a formal audit or compliance report: hire a managed penetration test provider."
you_give:
  - The address of your app or API
  - Proof that you own it or may test it
  - A test login or token (optional)
  - What is out of scope (optional)
you_get:
  - Findings by type and severity
  - The request that triggered each issue
  - Fix advice for each finding
  - A report you can share
  - A schedule for repeat scans
how_to_use:
  - Set up a staging copy of your app. Never point this at your live site.
  - Pick your scanner. OWASP ZAP and Nuclei are free. Burp Suite Professional or Enterprise is paid and needs a licence.
  - Open Claude, ChatGPT or Gemini and paste the skill. Use an AI that can run code, such as in Claude Code or a similar tool.
  - Give it your staging address, proof you may test it, and what is out of scope. Add a test login or token if the app needs one.
  - Ask for a passive scan first. Approve the active scan only after you check the scope.
  - Read the findings and check the evidence for each one. The examples in the skill are illustrations, not real results. Mark each confirmed false positive and keep it out of the next scan's baseline, so the repeat-scan comparison stays accurate.
  - Next, sort the findings by severity and fix the worst first. Run the scan again and compare it with the last one. Pair it with a code-level review, such as the Code security reviewer.
output_sample:
  input:
    - The address of your staging app or API
    - Proof that you own it or may test it
    - A test login or token (optional)
    - What is out of scope (optional)
  prerequisites:
    - An AI that can run code and tools such as Docker
    - A scanner such as OWASP ZAP or Nuclei (both free), or Burp Suite (paid)
    - A staging copy of your app, not the live site
  output:
    - name: Scope and scan policy
      contains: "The target, the paths that are in scope and the scan type chosen: passive, active or API."
    - name: Findings report
      contains: Each weakness with its type, severity, confidence, web address, CWE number and OWASP category.
    - name: Evidence
      contains: The request and response that show each issue, so you can check it is real.
    - name: Fix advice
      contains: Plain steps to fix each finding.
    - name: Report file
      contains: The full report as HTML, JSON or SARIF to share or load into an issue tracker.
    - name: Repeat scan schedule
      contains: A plan to rerun the scan, such as nightly on staging, and compare results over time.
