thinking: medium
thinking_why: It matches a new objection to past wins.
new_slug: live-objection-responder
name: Live objection responder
summary: "Paste what the buyer said to get a live objection response: what it really means, a reply that has worked before, and proof to use."
job: sell-and-negotiate
headline: Live objection responder
subhead: When a buyer says "too expensive" or "we're talking to a rival", you need an answer now. Paste what they said and get what they likely mean, a reply that has worked before and proof to back it.
explain: |
  When a buyer says "too expensive" or "we're talking to a rival", you need an answer now. Paste what they said and get what they likely mean, a reply that has worked before and proof to back it.

  It first checks what you know about the deal, then sorts the objection into what is really being said, such as price, trust, timing or a rival's pull. It then gathers your own evidence: past wins and losses, direct customer quotes, case studies and security or ROI documents. Finally it builds a reply using that evidence, grounded in your history rather than generic scripts.
when:
  - A prospect just said you cost too much.
  - A buyer is comparing you with a named competitor.
  - You are on a call and need a response in minutes.
  - You want a reply built on real customer quotes.
not_for:
  - "You need a reply to a renewal or a pre-sale feature question: ask a teammate who knows the account, or write a plain answer from your product notes."
  - "You want a full email written in your voice: ask your AI to draft the email after you have the reply from this skill."
  - "You have no deal details and no history to share: expect a general answer, and gather the deal notes first."
you_give:
  - The objection in the buyer's words
  - What you know about the deal
  - Win and loss notes (optional)
  - Customer quotes and case studies (optional)
you_get:
  - What the objection really means
  - A reply that fits the deal
  - Proof points to use
  - Evidence from your own history
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini and paste in this skill's instructions.
  - Paste the objection exactly as the buyer said or wrote it.
  - "Add what you know about the deal: stage, size, who is involved and what the buyer has said they want."
  - Paste, in this order: the objection, then the deal stage and size, then any win and loss notes or customer quotes. Add case studies if you have them. If your AI can read your CRM or call notes, let it pull them. If not, paste them by hand. The skill works with only the objection and the deal facts, but the reply is then more general.
  - Any proof point you did not supply is marked NEEDS YOUR VETTED SOURCE. Fill it from your own approved material, or leave it out.
  - Read the reply and check each proof point against its source before you use it with the buyer.
  - If the objection came by email, ask your AI to draft the reply email from the response.
output_sample:
  input:
    - The objection in the buyer's words, or the email or call excerpt where it came up
    - What you know about the deal, such as stage, size and who is involved
    - Win and loss notes (optional)
    - Customer quotes, case studies or ROI documents (optional)
  prerequisites:
    - A CRM or call notes your AI can read, or the same details pasted into the chat (optional)
  output:
    - name: What's underneath it
      contains: One or two sentences on the real concern, and whether it is an objection or a move to get a lower price.
    - name: The response
      contains: A talk track of three to five sentences that acknowledges the buyer, uses their own goals and one proof point, and ends with a question.
    - name: Proof points to have ready
      contains: Quotes, case studies or metrics that answer the concern, each with its source.
    - name: If it's a competitor
      contains: Where the rival is strong, where this buyer's needs differ, and a question that shows the difference.
    - name: What history says
      contains: How often this objection shows up in wins and losses, and what winning reps did next.
    - name: The don't list
      contains: Responses that tend to lose this deal, such as overdiscounting, listing features or arguing the point.
