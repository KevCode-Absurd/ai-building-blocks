thinking: high
thinking_why: Training choices need careful reasoning about limits.
new_slug: llm-fine-tuning-guide
name: LLM fine-tuning guide
summary: Plan a fine-tuning run for your GPU. Give your model and goal. You get Unsloth code sized to your memory, with a fixed chat template and export.
job: build-software
headline: LLM fine-tuning guide
subhead: Say your model and GPU. You get a fine-tuning plan and Unsloth code sized to your memory, ready to export.
explain: |
  A fine-tuning plan and working code for your model and your graphics card, sized to the memory you have so it does not run out halfway through. Tell it the model, the GPU and the goal.

  It works through six steps with Unsloth. First, it estimates memory before any code. Then it loads the model and fixes the chat template, a common cause of models that ignore stop tokens. It attaches LoRA adapters, runs the training, and exports to the format your runtime needs, such as GGUF. It covers QLoRA on a 16 GB GPU and reward-based methods like GRPO and DPO. You need Python and a GPU.

  Licence: the skill text in this copy is shared under CC BY 4.0, as the LICENSE-CONTENT file says. The author's own file header says Apache-2.0, which covers the author's code. Unsloth's core package is Apache-2.0, and optional parts such as its Studio app are AGPL-3.0.
when:
  - You want a model that follows your format and have one consumer GPU.
  - Training crashes with out of memory part way through.
  - Your tuned model repeats the prompt or never stops.
  - You need a file you can run locally after training.
not_for:
  - "You train across many machines or many GPUs: use plain TRL with Accelerate or DeepSpeed."
  - "You want training run in the cloud for you: use Hugging Face Jobs instead of this local plan."
  - "You want the Unsloth Desktop or Studio app with buttons: use the Unsloth installer instead."
you_give:
  - Base model
  - GPU and memory
  - Training data
  - The goal of the tuned model
  - Export target, like GGUF (optional)
you_get:
  - A memory estimate
  - Training code
  - A fixed chat template
  - A tuning run setup
  - Export steps
next: [local-ai-model-setup]
how_to_use:
  - Open an AI chat that can run Python code. Paste in the skill text. Install Unsloth first with pip install unsloth, and match the Python, PyTorch and CUDA versions to the ones on Unsloth's own install page for your GPU and driver.
  - Pick your base model and training dataset, then look up the full 40-character commit ID of each on its Hugging Face page (the "History" or "Files" view). Review that exact version and set it before you run. The code stops with a message if you do not.
  - Tell it your base model, your GPU and its memory, and what the tuned model should do.
  - Add your training data, or say what format it is in.
  - Check the memory estimate first. The figures are planning guesses, so confirm them with nvidia-smi on the first run. Resize the plan if it is too tight.
  - Before you train, check that the chat template step shows the right part of one batch masked.
  - For the GRPO example, set prompt_dataset to your own prompt dataset first. The code is not runnable until you do, and a check stops it with a message if you leave the placeholder.
  - Run the training, then ask for the export format your runtime needs.
  - Next, test the exported model on questions it has not seen, because shrinking it (quantization) can change how it behaves. Then serve it on your own computer with the Local AI model setup.
  - The result comes in the order of the six steps. A memory table comes first, then one code block for each step, then the export commands.
output_sample:
  input:
    - Your base model
    - Your GPU and how much memory it has
    - Your training data
    - What you want the tuned model to do
    - Where you will run it, like GGUF (optional)
  prerequisites:
    - An AI that can run Python code
    - A pinned commit for the model and each dataset on the Hugging Face Hub. The code stops if you do not set one
    - A GPU that can run your chosen model
  output:
    - name: Size the run
      contains: A memory estimate for your model and load mode, so the job fits your GPU before any code runs.
    - name: Load the model
      contains: Code that loads your base model in the right mode for your memory.
    - name: Fix the chat template
      contains: Code that sets the right chat template and trains only on the replies, plus a check on one batch.
    - name: Attach LoRA adapters
      contains: Code that adds small trainable layers so you tune a model without changing all of it.
    - name: Train
      contains: Training code for your goal, with a supervised example and a GRPO example.
    - name: Export
      contains: Steps to save the result as GGUF, for vLLM, or as merged 16-bit weights.
