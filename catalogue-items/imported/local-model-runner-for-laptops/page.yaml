thinking: medium
thinking_why: It picks the right model size for your hardware.
new_slug: local-model-runner-for-laptops
name: Local model runner for laptops
summary: Run an AI model on your own Mac, CPU or non-NVIDIA graphics card. Name your model and computer. You get the commands to start it.
job: build-software
headline: Local model runner for laptops
subhead: An AI model running on a Mac, a plain CPU or a non-Nvidia graphics card, with no CUDA needed. Name the model and your computer and get the commands that start it.
explain: |
  An AI model running on a Mac, a plain CPU or a non-Nvidia graphics card, with no CUDA needed. Name the model and your computer and get the commands that start it.

  It uses llama.cpp, which runs compact GGUF models from 1.5 to 8 bits. It builds for Apple Metal, AMD ROCm or plain CPU, then downloads or converts the model. You can chat in the terminal or start a server that speaks the OpenAI style, so existing apps can connect. The author says it can run several times faster than standard PyTorch on a CPU, but does not state the hardware or test conditions, so treat that as a rough claim. Your speed will differ. It explains the quantization formats so you pick one that fits your memory.
when:
  - You have an M-series Mac and want a local model.
  - Your graphics card is AMD or Intel.
  - You want a local server your apps can call.
  - You are deploying to a machine with no GPU.
not_for:
  - "You have an NVIDIA graphics card and want top speed: use vLLM or TensorRT-LLM instead."
  - "You want a hosted AI with no setup: use the chat app of your AI provider."
  - "You cannot run commands on your computer: ask a developer or IT person to set it up."
you_give:
  - The model name
  - Your computer and its memory
  - Operating system
  - Whether you want chat or a server
you_get:
  - Install and build commands
  - A model download or conversion step
  - A chat command
  - A server command and test request
  - A quantization choice that fits
how_to_use:
  - This needs a terminal and some comfort running commands. Open Claude, ChatGPT or Gemini and paste this skill into the chat. Your AI writes the commands. You run them yourself.
  - Gather first the model name, your computer and its memory (RAM, or video memory if you have a graphics card), your operating system, and about how much free disk space you have. Then tell your AI these, and whether you want chat or a server.
  - Read the commands it gives you and check the model size fits your memory.
  - Run the commands one at a time in your terminal. Your AI cannot run them for you in a normal chat.
  - Send the test request to check the server works, then point your app or any OpenAI-style client at http://localhost:8080/v1. The server listens on this computer only, so keep it that way unless you add a login.
  - Next, connect a chat app or a script to that address, and try a smaller or larger quantization if the model is too slow or too weak.
output_sample:
  input:
    - The name of the model you want to run
    - Your computer type and how much memory it has
    - Your operating system
    - Whether you want a chat or a server
  prerequisites:
    - A terminal on your computer where you can run commands
    - Enough free disk space for the model file
  output:
    - name: Install and build commands
      contains: Steps to install llama.cpp on your system, with the right build option for Mac, AMD or plain CPU.
    - name: Model download or conversion
      contains: One command to download a ready GGUF model file, or to convert a model you already have.
    - name: Quantization choice
      contains: The compression level that fits your memory, with a short note on speed against quality.
    - name: Chat command
      contains: One command to talk to the model in your terminal.
    - name: Server command
      contains: One command to start a local server that works like the OpenAI API.
    - name: Server test request
      contains: A curl request you can send to check the server answers.
