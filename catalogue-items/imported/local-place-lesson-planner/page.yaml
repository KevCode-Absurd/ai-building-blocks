thinking: medium
thinking_why: It matches set content to a local setting.
new_slug: local-place-lesson-planner
name: Local place lesson planner
summary: Name a place near your school and your content. Get a place-based lesson plan that ties the topic to the local community and its heritage.
job: teach-and-train
headline: Local place lesson planner
subhead: Lessons that start from a real place near your students and still cover your curriculum. Name the place and the content and get an inquiry plan where the place is the text.
explain: |
  Lessons that start from a real place near your students and still cover your curriculum. Name the place and the content and get an inquiry plan where the place is the text.

  It begins with what the place itself can teach, then adds several ways of knowing it. A scientist, a historian and a long-time local each see a river differently. Students visit and observe directly where they can. The plan includes a critical angle, asking who the place serves and who it leaves out, and an action step, since knowing a place brings responsibility to it. It asks about Indigenous connections and local experts, and plans around access limits.
when:
  - Your students find the topic distant and you want it to feel real.
  - There is a canal, park or building near school you could use.
  - You teach local history and want fresh sources.
  - Your class cannot visit and you need a way to still use the place.
not_for:
  - "Your topic has no real place nearby and no local source: use a standard unit plan, or ask a colleague for one."
  - "You want to redesign teaching for a culture or community you serve: use the culturally-responsive-teaching-designer."
  - "You want to start a unit from one puzzling event or phenomenon, not a place: use the phenomenon-based-unit-anchor."
you_give:
  - The curriculum content
  - The local place
  - Year group and subject
  - Indigenous connections (optional)
  - Local people who know the place (optional)
you_get:
  - What the place teaches
  - Multiple ways of knowing it
  - An inquiry sequence
  - An action step for students
how_to_use:
  - Before you start, note your year group, subject and the content to teach. Write a few lines about the place. Decide if students can visit.
  - Open Claude, ChatGPT or Gemini. Paste the skill text from this page into a new chat.
  - Paste your content and place. Add any Indigenous links and local experts you know of.
  - Read the plan. Check that the place facts are right and the local people are real and reachable.
  - Your AI can get local and Indigenous history wrong. Check each history fact with local records, and ask the local Indigenous community or a trusted source before you teach their history. The research summaries in the skill are the author's, so read the studies before you quote them to parents or leaders.
  - Edit anything that does not fit your class. Then plan a visit or a classroom version.
output_sample:
  input:
    - The curriculum content you need to teach
    - The local place, such as a river, park, building or canal
    - Year group and subject (optional)
    - Any Indigenous history or meaning the place holds (optional)
    - Local people who know the place well (optional)
  output:
    - name: What This Place Teaches
      contains: What students can learn from direct contact with this exact place.
    - name: Multiple Ways of Knowing
      contains: How a scientist, a historian and a local resident each see the place, and how to bring those views in.
    - name: Inquiry Design
      contains: A step-by-step inquiry sequence that links your curriculum content to the place.
    - name: Action Dimension
      contains: A step where students act on what they learned, plus questions on who the place serves and who it leaves out.
    - name: Community Knowledge Holders
      contains: Local people to involve and how they could help students learn.
