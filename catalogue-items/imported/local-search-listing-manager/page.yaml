thinking: medium
thinking_why: It checks many set items, then ranks the fixes.
new_slug: local-search-listing-manager
name: Local search listing manager
summary: Get a local search audit for your service business. Fix your Google Business Profile, listings and reviews so you show up in map results.
job: get-found-in-search
headline: Local search listing manager
subhead: Describe your service business and the areas you cover. Your AI checks your Google Business Profile and listings, then gives you fixes. You also get neighbourhood page drafts and review replies.
explain: |
  A local search plan for a business that serves customers at their location, like repair, heating, plumbing or cleaning. Describe your business and area and get an audit, fixes and a review plan.

  It works in four modes. The Google Business Profile audit checks relevance, closeness and prominence, with a checklist and review reply templates. The area content mode writes neighbourhood service pages. The consistency check compares your name, address and phone number across directories. The technical mode adds schema markup. It begins by gathering your services, areas, current listings and the competitors in the map results.
when:
  - You do not show up in the map results for your service.
  - Your phone number or address differs across directories.
  - You serve many towns and need a page for each one.
  - You have reviews with no reply and want drafts.
not_for:
  - "You want to rank across the whole country, not in your local area: use a general SEO audit instead."
  - "You only need schema markup for pages that are not local business pages: use a general schema markup tool."
  - "You want your business to show up in AI answers: use an AI answer visibility check instead."
you_give:
  - Your business name, address and phone number
  - The services you offer
  - The towns or neighbourhoods you serve
  - Your website and current listings (optional)
  - The local competitors in the map results (optional)
you_get:
  - A Google Business Profile audit with a ranked fix list
  - Neighbourhood service page drafts
  - A report on where your name, address and phone differ
  - Markup code for your site
  - Reply drafts for your reviews
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the contents of SKILL.md.
  - Type your business name, address, phone, services and the areas you serve.
  - "Say which job you want: a profile audit, a page for one area, a listing check, markup code or review replies."
  - Paste your current profile text or reviews if you have them.
  - Next, publish the fixes to your Google Business Profile and the main directories first. Then come back with new reviews for reply drafts, and run the name, address and phone check again.
  - "Running the listing check and page scripts needs an AI that can run code. Without it, the AI works from what you paste. The listing check does not look anything up online and needs no key or paid service. It compares what you paste in: your correct name, address and phone, and what each directory shows, which you copy from each directory yourself."
  - Check every local detail in the result and on each draft page (landmarks, streets, zip codes, years in business) before you publish. Anything you did not give your AI should be marked [VERIFY]. Add photo location tags only where the photo was really taken. A geotagging tool such as GeoImgr.com is a third-party site. Check its price and terms yourself.
output_sample:
  input:
    - Your business name, address and phone number
    - The services you offer
    - The towns or neighbourhoods you serve
    - Your website and current listings (optional)
    - The local competitors in the map results (optional)
  prerequisites:
    - An AI that can run code, only if you want it to run the listing check and page scripts. A normal chat works for the audit and drafts.
  output:
    - name: GBP audit
      contains: A pass or fail checklist for your Google Business Profile, with a ranked list of fixes.
    - name: Service area page
      contains: A draft page for one neighbourhood with headings, questions and answers, and a meta description.
    - name: NAP report
      contains: A table of directories showing where your name, address or phone differ, with fix steps.
    - name: LocalBusiness schema
      contains: A block of markup code you paste into your site so Google can read your business details.
    - name: Review responses
      contains: Reply drafts for the reviews you share, for both good and bad ones.
    - name: Full local SEO audit
      contains: All of the above in one report, when you ask for the full audit.
