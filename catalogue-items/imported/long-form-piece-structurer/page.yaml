thinking: medium
thinking_why: It picks a structure by piece type, then shapes your points to fit.
new_slug: long-form-piece-structurer
name: Long-form piece structurer
summary: Plan a long-form piece like a case study or whitepaper. Get a clear outline with word targets per section and a list of sections to cut.
job: write-and-tell-stories
headline: Long-form piece structurer
subhead: "A clear outline for one long piece, such as a case study, whitepaper, research report or ebook, where every section earns its place. It aims to stop the two common failures: stretching a short idea with filler, and piling on facts with no spine."
explain: |
  A clear outline for one long piece, such as a case study, whitepaper, research report or ebook, where every section earns its place. It aims to stop the two common failures: stretching a short idea with filler, and piling on facts with no spine.

  You name the piece type and your point. The skill sets a thesis for the opening and makes sure the body delivers it. It then sizes each section by its job, cuts any section that only adds length, and plans an ending that leaves the reader with one specific thing to do or remember. Each format gets its own shape. A case study follows a different path than a manifesto or a how-to guide.
when:
  - You must write a whitepaper and do not know how to order it.
  - Your 1,500-word post is being stretched to 5,000 and feels padded.
  - You have a pile of research and need a spine to organise it.
  - You are planning an ebook and want each chapter to justify its length.
not_for:
  - "Your piece is under about 1,500 words: write a normal blog post instead, no outline needed."
  - "You need the structure for a whole set of linked pages: use the pillar-content-architecture skill for that hub plan."
  - "You want to write the full draft now: use this outline first, then draft each section yourself or with your AI."
you_give:
  - The type of piece
  - Your main point or thesis
  - Your audience and the goal of the piece
  - Raw notes or research (optional)
you_get:
  - A section-by-section outline
  - A thesis-led opening plan
  - Word targets per section
  - A list of sections to cut
  - An ending that lands
how_to_use:
  - Open your AI tool. Paste in the skill text, or upload the skill file if your tool allows files.
  - Say what type of piece you are writing, such as a case study or whitepaper.
  - Add your main point, your audience and the goal of the piece.
  - Paste your notes or research if you have them (optional).
  - Start with the section outline, then the lede plan. If the outline does not fit your point, say what your point is in one sentence and ask for a new outline. Check each section earns its word target, then cut what is on the cut list.
  - Ask your AI to adjust any section that does not fit your point, then start drafting.
  - Draft one section at a time from the outline. When the full draft is done, check it with the Draft proofreader before you publish.
output_sample:
  input:
    - The type of piece, such as a case study or whitepaper
    - Your main point
    - Your audience and the goal of the piece
    - Your notes or research (optional)
  output:
    - name: Format fit
      contains: Which long-form format suits your point and what readers of that format expect.
    - name: Structural archetype
      contains: The overall shape chosen for the piece, such as problem and solution or layered argument.
    - name: Section outline
      contains: Each section in order, with its job in the piece.
    - name: Section weight
      contains: A word target for each section, based on how much weight it needs.
    - name: Lede plan
      contains: How to open the piece with a clear thesis the body will deliver.
    - name: Cut list
      contains: Sections that only add length and should be removed or shortened.
    - name: Closing plan
      contains: An ending that leaves the reader with one specific thing to do or remember.
