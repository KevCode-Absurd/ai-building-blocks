thinking: medium
thinking_why: It weighs gain and loss framing against your audience.
new_slug: loss-framing-writer
name: Loss framing writer
summary: Write loss framing copy that shows what waiting really costs your buyer, with real facts and no scare tactics. Get gain-framed versions to compare.
job: write-ad-copy
headline: Loss framing writer
subhead: Messaging that shows what people lose by putting off a decision, written with real facts and without scare tactics. Used well, loss framing creates honest urgency.
explain: |
  Messaging that shows what people lose by putting off a decision, written with real facts and without scare tactics. Used well, loss framing creates honest urgency. Used badly, it reads as manipulation.

  It starts with who you are talking to: their situation, how much risk they accept, and how well they trust you. It then states your goal and checks which of your claims you can back up. From there it finds where losses beat gains as a message, and writes copy about the real cost of waiting, such as lost time, money or progress. Psychology claims are treated as ideas to verify, not proof. It will not exploit fear, guess sensitive traits or invent urgency.
when:
  - Your offer has a cost to waiting, and your page only talks about benefits.
  - Your urgency copy sounds like hype and you want it to be believable.
  - You are writing a follow-up email to people who stalled.
  - You want to test a loss angle against a gain angle.
not_for:
  - Your offer has no real cost to waiting. Use a gain-framed message that shows the benefit instead.
  - Your audience does not trust you yet. Lead with proof, like reviews or results you can show, before any loss angle.
  - You need a hard deadline or a scarcity claim. Only use a real one, and ask a person on your team to confirm it is true.
you_give:
  - Your offer and its real facts
  - Who the audience is
  - What you want them to do
  - Evidence for the cost of waiting (optional)
you_get:
  - Loss-framed copy options
  - Gain-framed versions to compare
  - A check for claims that need proof
  - Notes on where to avoid pressure
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text from this page. No code, files or paid tools are needed.
  - Paste your offer, the facts you can prove, who it is for, and what you want them to do.
  - Add what you know about how much your audience trusts you, and any proof of what waiting costs.
  - Read the loss lines next to the gain lines. Pick the pair that fits your audience.
  - Check the list of claims that need proof. Remove or confirm each one before you publish.
output_sample:
  input:
    - Your offer and its real facts
    - Who the audience is and how much they trust you
    - What you want them to do
    - Proof of what waiting costs (optional)
  output:
    - name: Reference point
      contains: What your audience sees as normal today, and whether loss or gain wording fits better.
    - name: Loss-framed copy
      contains: Lines that state the real, near-term cost of waiting, kept at the lowest strength that still works.
    - name: Gain-framed versions
      contains: A matching gain line for each loss line, so you can compare and test both.
    - name: Claims to verify
      contains: Facts in the copy that need proof, and any research idea to check before you use it in public.
    - name: Pressure check
      contains: Notes on where the copy could feel like fear or fake urgency, and how to soften it.
