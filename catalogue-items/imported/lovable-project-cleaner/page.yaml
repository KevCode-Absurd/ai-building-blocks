thinking: medium
thinking_why: It checks 15 known spots and fixes each one.
new_slug: lovable-project-cleaner
name: Lovable project cleaner
summary: Clean up your Lovable project export. It removes the Lovable tagger, branding and extra notes files, so the code ships as your own.
job: build-software
headline: Lovable project cleaner
subhead: A project export with every trace of Lovable removed, so the code reads as your own before you ship or open-source it. It covers fifteen places where the tool leaves marks.
explain: |
  A project export with every trace of Lovable removed, so the code reads as your own before you ship or open-source it. It covers fifteen places where the tool leaves marks.

  The main one is a hidden dev dependency and a matching call in the Vite config. Removing both is always safe. Then it replaces the stock favicon, share image, logo and page title, and strips the Lovable link from the README. It also deletes the generated notes in the root folder, such as cleanup, deployment and development summaries. Finally, it audits the project again to make sure nothing was missed. It assumes a Vite and React project with shadcn components.
when:
  - You exported a project from Lovable and want it to look like your own work.
  - Your page title and favicon are still the generic defaults.
  - You see extra summary markdown files in the project root.
  - You are about to open-source the code and want to audit for leftovers.
not_for:
  - "Your Lovable app uses Supabase or edge functions: have a developer review that backend code by hand, because this skill does not check it."
  - "Your project is not Vite and React with shadcn components: ask a developer to clean it by hand."
  - "You only want to remove the Lovable tagger: delete that one dev dependency and its call in the Vite config yourself."
you_give:
  - The exported project folder
  - Your own name, title and icons (optional)
  - Whether to keep generated docs (optional)
you_get:
  - The tagger dependency and config call removed
  - Branding files and title replaced
  - Generated docs deleted
  - A final leftovers report
how_to_use:
  - Open your AI tool with access to your project files, such as Claude Code or Cursor. A plain chat cannot change files.
  - 'Add this skill, then say: "Clean up my Lovable project."'
  - Tell your AI which package manager you use and give your own title and icons if you have them.
  - Read the Cleaned list, then answer anything under Needs your input.
  - Run your build to check the project still works before you ship it.
output_sample:
  input:
    - Your exported Lovable project folder
    - The package manager you use, such as npm, yarn or pnpm
    - Your own name, page title and icons (optional)
    - A Vercel account, only if you want the old favicon cache cleared (optional)
  prerequisites:
    - An AI that can read and change your project files and run commands
  output:
    - name: Cleaned
      contains: Everything the skill removed or replaced, such as the tagger, config call, branding files and generated notes.
    - name: Needs your input
      contains: Items that need your choice, such as your own title, icons or any Lovable keys found.
    - name: Deferred (safe to do later)
      contains: Optional jobs that can wait, such as pruning unused packages or clearing old favicon caches.
