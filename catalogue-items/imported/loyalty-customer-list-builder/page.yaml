thinking: low
thinking_why: It ranks customers by spend and order count.
new_slug: loyalty-customer-list-builder
name: Loyalty customer list builder
summary: Find your top-spending Shopify customers, tag them, and export a loyalty customer list for a VIP offer. Preview first, then tag.
job: run-your-store
headline: Loyalty customer list builder
subhead: A list of your best customers, tagged inside Shopify and exported, ready to invite into a loyalty program or a VIP campaign. It changes live customer records, so run it in preview first.
explain: |
  A list of your best customers, tagged inside Shopify and exported, ready to invite into a loyalty program or a VIP campaign. It changes live customer records, so run it in preview first.

  You set a minimum number of orders and a minimum lifetime spend. The defaults are three orders and 200 in your store currency. It reads all matching customers, 250 at a time, and adds a tag you choose, loyalty-vip by default. Then it exports the list with names, emails, order counts and totals. A dry run shows who would be tagged without touching anything. It handles only the data. It needs a signed-in Shopify CLI.
when:
  - You want to find your top spenders and treat them differently.
  - You are launching a VIP offer and need the audience list.
  - You want customers tagged so your email tool can target them.
  - You want to test your thresholds before changing any records.
not_for:
  - "You want to give out reward points or run a loyalty program: use a loyalty app, because this only builds the list."
  - "You want to send VIP emails: use your email tool, and import the exported list there."
  - "You can't sign in to the Shopify CLI for your store: ask whoever manages your store to run it, or export customers from Shopify admin by hand."
you_give:
  - Your store domain
  - Minimum orders and spend
  - The tag name (optional)
  - Dry run or live run
you_get:
  - Qualifying customers tagged
  - An exported customer list
  - A count of who qualified
  - A preview of changes when dry run is on
how_to_use:
  - Open an AI that can run commands on your computer, such as Claude Code, and sign in to the Shopify CLI for your store. Your login needs permission to read and change customers.
  - Give it this skill and your store domain.
  - Set your minimum orders and minimum spend. Dry run is on by default, so nothing is tagged yet.
  - Check the count and the list. Change the numbers if the group looks too big or too small.
  - Run it again with dry run off to add the tag to live customer records. It tags every customer in the list, one by one, and skips anyone who already has the tag.
  - If you tagged the wrong people, ask your AI to remove the tag with Shopify's tagsRemove call, using the same tag and the customer IDs in the CSV.
  - Import the CSV into your email tool or loyalty app. The file holds customer names and emails, so store and share it under your own privacy rules and consent terms.
output_sample:
  input:
    - Your store domain
    - Minimum number of orders (the default is 3)
    - Minimum lifetime spend in your store currency (the default is 200)
    - The tag name (optional)
    - Dry run or live run
  prerequisites:
    - An AI that can run commands on your computer
    - A signed-in Shopify CLI session for your store
    - Permission to read and change customers in your store
  output:
    - name: Start banner
      contains: The skill name, your store domain and the start time.
    - name: Step updates
      contains: One line per step showing what was asked and how many customers came back or were tagged.
    - name: Outcome summary
      contains: How many VIP customers were found, how many were tagged, and how many errors came up.
    - name: loyalty_segment_<date>.csv
      contains: One row per customer with id, email, first and last name, order count, total spent, currency and the tag applied.
