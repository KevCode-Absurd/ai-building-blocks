job: plan-supply-chain
headline: Machine job scheduler
subhead: A job order for your machines that finishes everything sooner, or meets
  due dates, while keeping each job's steps in the right sequence. This is the
  classic job shop problem.
explain: |
  A job order for your machines that finishes everything sooner, or meets due dates, while keeping each job's steps in the right sequence. This is the classic job shop problem.

  First it asks about your jobs, machines, step times, setup times, due dates and limits like breakdown windows. It chooses a goal: shortest total finish time, least lateness, or a weighted mix. Then it picks a method by size. Small cases get exact solving. Mid-size ones get advanced search. Large ones get heuristic methods that give a good answer quickly. It can use a model with a disjunctive graph, where no machine runs two things at once and each job follows its route.
when:
  - You have a dozen jobs sharing a handful of machines and the order is
    guesswork.
  - Late orders keep cascading through your shop floor.
  - You want to see how much faster a better order would be.
  - Some machines go down for maintenance and you must plan around it.
you_give:
  - The list of jobs and their steps
  - Machines and processing times
  - Due dates and setup times (optional)
  - Your main goal
you_get:
  - A schedule by machine and time
  - The total finish time
  - Late jobs flagged
  - The method used and why
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code.
