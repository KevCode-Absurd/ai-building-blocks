thinking: low
thinking_why: It follows a set layout recipe, and you choose the words.
new_slug: main-product-image-designer
name: Main product image designer
summary: Turn a product photo and your selling points into a square main image with text on it, ready for a marketplace listing.
job: product-photos
headline: Main product image designer
subhead: A square main image for your product with selling-point text laid on it, built to stay readable at thumbnail size. Your image model draws it; Claude writes the instructions.
explain: |
  A square main image for your product with selling-point text laid on it, built to stay readable at thumbnail size. Your image model draws it; Claude writes the instructions.

  You give it a product photo and your selling points. It writes a detailed picture prompt: the product centred and unchanged in shape, a clean gradient background, a large headline, two small feature lines and a promo badge in a corner. Clear text keeps it legible when small. The prompt tells the model to keep stitching, shape and details identical to your photo. This is for the single main image slot, not long detail pages. It needs an image tool with credits.
when:
  - You need a marketplace main image with price or benefit text on it.
  - Your plain product photo gets few clicks in search results.
  - You want the text to stay clear when the image is small.
  - You have a product photo but no designer.
not_for:
  - "You need a long detail page with many sections: use the detail page skill from the same set, or a designer."
  - "Your product has no checked selling points or real promo: write and confirm them first, then come back."
  - "You want the photo changed, such as a new shape or colour: use your photo editor, as this skill keeps the product as is."
you_give:
  - A product photo on a plain background
  - Three or four selling points
  - A promo offer (optional)
  - Image size or ratio
you_get:
  - A picture prompt for your image model
  - A layout with headline and badges
  - Advice on keeping text legible
  - One square main image once drawn
how_to_use:
  - Set up a paid dLazy account and add credits. The image step uses it, and your AI needs to run code to call it.
  - Paste the skill into your AI, or upload its folder if your AI can use files.
  - Give it your photo, your features and your promo. Keep the headline to 10 characters and the badge to 8.
  - Let it draw three versions, then pick the one where the text is clear and correct.
  - Shrink the image to about 200 pixels wide. If you can't read the headline, shorten it and run again.
  - Upload the image to your main image slot. For a new sale, change only the badge line and run again.
output_sample:
  input:
    - Your product photo, on a plain background
    - Your product's key features, split by slash (up to 100 characters)
    - Your promo offer, split by slash (up to 100 characters)
    - Your product type, such as shoes, clothes or beauty
    - A layout reference image (optional)
  prerequisites:
    - A paid dLazy account with credits
    - An AI that can run code, to call the dLazy image tool
  output:
    - name: Picture prompt
      contains: Written instructions for the image model, with the product, background, headline, two small lines and badge.
    - name: Layout zones
      contains: A badge corner for the offer, the product at centre left, and the feature text on the right.
    - name: Colour and background choice
      contains: A background, text colour and badge colour picked to suit your product type.
    - name: Main image file
      contains: One square image with your product kept as is and the Chinese text laid on.
    - name: Fix lines
      contains: Extra lines to add to the prompt when text is garbled, too small, or covers the product.
