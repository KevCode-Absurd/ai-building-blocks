thinking: medium
thinking_why: It applies known management ideas to your team and week.
new_slug: manager-output-coach
name: Manager output coach
summary: Get a manager output coach that scores your meetings, one-on-ones and calendar from 0 to 10 and lists the changes to reach 10.
job: lead-people
headline: Manager output coach
subhead: "A tuned management routine for your team, built on Andy Grove's High Output Management. It judges every habit by one test: does it raise what your team produces?"
explain: |
  A tuned management routine for your team, built on Andy Grove's High Output Management. It judges every habit by one test: does it raise what your team produces?

  You describe your team and role. The skill scores your calendar, meetings and processes from 0 to 10 and lists the exact changes to reach 10. It looks for output measures paired with quality checks, one-on-ones owned by the team member, delegation that fits each person's experience, goals that stretch without driving pay, and a calendar built around key events. It sorts your tasks by how much output each hour creates, and flags the ones that cost output. Meetings are treated as the main tool of management.
when:
  - Your week is full of meetings and you cannot tell which matter.
  - Your one-on-ones are irregular or run by you only.
  - You track busyness instead of results.
  - You are a new manager and want a proven routine.
not_for:
  - "You have no direct reports: a manager routine will not fit, so start with a plain weekly plan of your own tasks."
  - "You want a system for the whole company: use a company-wide planning method, such as EOS (the Entrepreneurial Operating System), not this one."
  - "You want to boost your team's drive and motivation: talk to each person about what they want, rather than review meetings and tasks."
you_give:
  - Your role and team size
  - Your current calendar and meetings
  - How you measure work today
  - Goals for the quarter (optional)
you_get:
  - A score out of 10
  - A list of changes to reach 10
  - A meeting and one-on-one rhythm
  - A ranked list of high-impact tasks
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat.
  - Paste your calendar as text. Say your team size, your role, and how work is measured today.
  - Ask your AI to follow this skill. You get the score first, the list of gaps second, and the ranked tasks last.
  - Two terms are worth knowing. Task-relevant maturity means how much experience a person has with a given task, which sets how closely you check their work. Managerial leverage means the output created per hour of your time.
  - Pick the two biggest gaps for the next 30 days. Run the skill again after a month to see if the score moved.
output_sample:
  input:
    - Your role and team size
    - Your current calendar and meetings
    - How you measure your team's work today
    - Your goals for the quarter (optional)
  output:
    - name: Score
      contains: A rating from 0 to 10 for your management routine, with the reason for the score.
    - name: Gap list
      contains: The specific changes needed to move your routine from its current score to 10.
    - name: Meeting and one-on-one rhythm
      contains: A proposed weekly calendar with the meetings and one-on-ones each person needs, built around your key events.
    - name: Output measures
      contains: Ways to track your team's results, each paired with a quality check so you do not track busyness.
    - name: Ranked task list
      contains: Your tasks sorted by how much output each hour creates, with the ones that cost output flagged.
