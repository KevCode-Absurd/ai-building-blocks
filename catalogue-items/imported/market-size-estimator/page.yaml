thinking: high
thinking_why: It builds the numbers two ways and checks that they agree.
new_slug: market-size-estimator
name: Market size estimator
summary: Size your market for a pitch or plan. Give it your idea, customers and price. You get TAM, SAM and SOM worked out three ways, with sources.
job: plan-strategy
headline: Market size estimator
subhead: A market size estimate for your idea, shown as TAM, SAM and SOM and built three ways so you can see if the numbers agree.
explain: |
  A market size estimate for your idea, shown as TAM, SAM and SOM and built three ways so you can see if the numbers agree. It is useful for fundraising, planning and checking whether an idea is big enough.

  This is a sizing method, not a market research report. It gives you the numbers and how they were built. For a written report on trends and competitors, use the Market research report writer.

  Licence: the skill text is shared under CC BY 4.0. We made two changes to the original: share rates are labelled as scenario assumptions, and sample figures are replaced with bracketed placeholders. Nothing else was changed.

  TAM is the whole market if you took all of it. SAM is the part your product and region can reach. SOM is the slice you can realistically win. The skill builds these top-down from industry reports, bottom-up from customer counts times price, and by value, based on what people would pay to solve the problem. It lays out the steps, the assumptions and the sources, and explains how to cross-check the results.
when:
  - You are writing a pitch deck and need defensible market numbers.
  - You want to know whether your idea can reach a meaningful revenue.
  - Your top-down and bottom-up numbers are far apart.
  - An investor asked you to justify your TAM.
not_for:
  - "You have no customers or price yet: talk to a few likely buyers first, then come back."
  - "A current published report already gives the number you need: cite that report instead."
  - "You need a full financial forecast: use a spreadsheet or ask an accountant."
you_give:
  - Your product or idea
  - Target customers and region
  - Price or revenue per customer
  - Any industry reports you have (optional)
you_get:
  - TAM, SAM and SOM estimates
  - Top-down and bottom-up workings
  - A willingness-to-pay view
  - Assumptions and sources list
how_to_use:
  - Open your AI tool (Claude, ChatGPT or Gemini) and paste in the skill text. This is an adapted copy of the sickn33 skill under the CC BY-4.0 licence. We changed it to label share rates as scenario assumptions and to use bracketed placeholders in place of sample figures.
  - Choose a method to start. Use bottom-up (customers times price) for a business-to-business or niche product. Use value theory (what the problem costs, times what people would pay to solve it) for a new category. Then cross-check with top-down.
  - "Gather two numbers first: how many customers could buy from you, and what one customer would pay you per year. Then describe your product or idea, your target customers, your region and your price."
  - "Ask your AI to work in this order: define the market, gather data, work out TAM, then SAM, then SOM, then cross-check the three methods and list your assumptions."
  - Paste any industry reports you have (optional). If your AI can search the web, ask it to find current market data.
  - Read the three estimates and the cross-check. If they are far apart, ask your AI why.
  - Check each source and date. Treat the share rates as assumptions, and ask for a cited reason behind each one.
  - Some data providers charge for reports. Do not buy a report or share customer data unless you are allowed to.
  - The 2 to 5 percent share and 10 to 30 percent willingness to pay in the skill are starting guesses to test, not industry benchmarks. Replace them with figures you can source.
  - If your AI cannot search the web, ask it to mark every figure unverified and list the sources you must check and date yourself before you quote the numbers.
  - Then use the results. Take the SOM (the slice you can win) into a pricing check with the Pricing strategist, to test what customers will pay. Take the TAM, SAM and SOM with their sources into a Market research report writer draft.
next:
  - market-research-report-writer
  - pricing-strategist
output_sample:
  input:
    - Your product or idea
    - Your target customers and region
    - Your price or revenue per customer
    - Any industry reports you have (optional)
  prerequisites:
    - An AI that can search the web is best, so it can find current market data
  output:
    - name: Market definition
      contains: The problem, the customers, the product category, the region and the time span being sized.
    - name: Top-down estimate
      contains: TAM, SAM and SOM worked from a total market figure, with each filter and source shown.
    - name: Bottom-up estimate
      contains: TAM, SAM and SOM built from customer counts times yearly revenue per customer.
    - name: Value theory estimate
      contains: What the problem costs today, what buyers might pay to fix it, and the market that follows.
    - name: Cross-check
      contains: A comparison of the methods that explains any gap in definitions, units, groups or source dates.
    - name: Assumptions and sources
      contains: Every assumption and source, with the share rates marked as scenario assumptions to justify.
