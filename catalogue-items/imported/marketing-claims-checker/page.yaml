thinking: high
thinking_why: It must tell puffery from claims that need proof.
new_slug: marketing-claims-checker
name: Marketing claims checker
summary: Check your marketing claims before you publish. Paste your ad or page copy and get each claim sorted as fine, needs proof or cut, with safer wording.
job: check-contracts
headline: Marketing claims checker
subhead: Every claim in your ad or page copy sorted into fine, needs proof or cut, with safer wording that keeps the energy. This is a check for risk, not legal advice, and a lawyer should confirm anything high-stakes.
explain: |
  Every claim in your ad or page copy sorted into fine, needs proof or cut, with safer wording that keeps the energy. This is a check for risk, not legal advice, and a lawyer should confirm anything high-stakes.

  Paste your copy. The skill pulls out each claim and labels it: puffery, factual, comparative, implied or absolute. Puffery passes. For the rest it asks what proof exists and whether it is enough, then suggests a fix. It looks for the claims likely to draw a rival's demand letter or a regulator's inquiry, such as "best" with no basis or unproven comparisons. It reads your saved company standards first if you have set them up. The output goes claim by claim.
when:
  - Marketing wrote "the best" and you need to know if you can say it.
  - You are about to launch a landing page and want a risk pass.
  - Your ad compares you to a competitor.
  - You need to show what proof backs each claim.
not_for:
  - "You need a lawyer's sign-off on health, finance or children's product claims: use a lawyer who knows that field, and treat this check as a first pass only."
  - "You want to review a contract or terms of service: ask a lawyer, since this skill only reads marketing copy."
  - "You only want to polish tone or style: use your own editor or ask your AI for a plain edit, because this skill checks claims, not wording quality."
you_give:
  - Your ad or page copy
  - Proof you hold for key claims (optional)
  - Your company's claims standards (optional)
  - Where the copy will run
you_get:
  - A claim-by-claim table
  - A label for each claim
  - Proof needed for each
  - Safer rewrites
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill instructions into a new chat.
  - Paste your ad or page copy. Say where it will run.
  - Add any proof you hold and your company claims standards, if you have them (optional).
  - Turn on web search if your AI has it, so it can check current ad rules. This is optional.
  - Read the claim table. Fix or cut every claim marked needs proof or cut.
  - Send anything high-stakes to a lawyer. This is a risk check, not legal advice.
output_sample:
  input:
    - Your ad or page copy
    - Where the copy will run, such as a landing page, email or ad
    - Proof you hold for key claims (optional)
    - Your company's claims standards (optional)
  prerequisites:
    - An AI that can search the web, if you want it to look up current ad rules (optional)
    - Your saved company claims standards from the product legal setup, if you have them (optional)
  output:
    - name: Summary
      contains: A short overview of the copy and how risky its claims are overall.
    - name: Claim-by-claim
      contains: "Each claim with its label: puffery, factual, comparative, implied or absolute, and a call on whether it can run."
    - name: Suggested revision
      contains: Safer wording for risky claims that keeps the energy of the original.
    - name: Substantiation needed before ship
      contains: The proof you must have on file before each claim goes live.
    - name: Citation check
      contains: A check of any sources or studies the copy points to.
    - name: Disclosure overlays
      contains: Notes on disclaimers or disclosures the copy may need to carry.
    - name: Next steps
      contains: What to do with the result, such as gathering proof or sending it to a lawyer.
