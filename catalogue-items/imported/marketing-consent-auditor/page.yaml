thinking: low
thinking_why: It counts consent fields.
new_slug: marketing-consent-auditor
name: Marketing consent auditor
summary: Check which Shopify customers agreed to email and SMS marketing. Get a consent audit with counts and a CSV list. Read-only and safe to run.
job: run-your-store
headline: Marketing consent auditor
subhead: A count of how many of your Shopify customers agreed to email and SMS marketing, and how many did not. It is useful for privacy reviews and for knowing your real reachable audience.
explain: |
  A count of how many of your Shopify customers agreed to email and SMS marketing, and how many did not. It is useful for privacy reviews and for knowing your real reachable audience.

  It reads every customer record, 250 at a time, and sorts each into subscribed, unsubscribed, pending or no opt-in recorded, separately for email and text. Then it works out three numbers: customers with a recorded yes, people at risk because consent is pending, and people you cannot reach. You can check email, SMS or both. The counts show what Shopify has recorded. They are not a legal ruling on who you may contact. It only reads data and changes nothing, so it is safe to run any time. It needs a signed-in Shopify CLI with permission to read customers.
when:
  - You are preparing for a GDPR or email-law review.
  - You want to know how many customers have a recorded email yes in Shopify.
  - You plan an SMS campaign and need your opted-in count.
  - You want to find customers whose consent is still pending.
not_for:
  - "You need legal advice or proof for an audit: ask a privacy lawyer, and use your email tool's own consent records as the source of truth."
  - "Your customers are not on Shopify: check the consent export from your email or SMS tool instead."
  - "You want to change consent or send a campaign: do that in Shopify or your email tool, because this only reads data."
you_give:
  - Your store domain
  - "The channel to audit: email, SMS or both"
  - Output style, readable or JSON (optional)
you_get:
  - Consent counts by state
  - Addressable audience size
  - Pending and unreachable counts
  - A read-only report
how_to_use:
  - Open an AI that can run Shopify CLI commands, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot read your store.
  - Sign in to Shopify CLI for your store with permission to read customers.
  - Paste the skill and give it your store domain. Say if you want email, SMS or both.
  - Read the counts in the report. Then open the CSV file and spot-check a few rows.
  - The CSV holds customer emails, which are personal data. Keep it in a private folder and delete it when the review is done.
output_sample:
  input:
    - Your Shopify store domain
    - "The channel to check: email, SMS or both"
    - "Output style: readable or JSON (optional)"
  prerequisites:
    - An AI that can run Shopify CLI commands and save files
    - A signed-in Shopify CLI session with permission to read customers
    - An AI that can run code, to run the commands in this skill
  output:
    - name: Start banner
      contains: The skill name, your store domain and the start time.
    - name: Step log
      contains: One line per step with what was asked and how many results came back.
    - name: Email marketing counts
      contains: Subscribed, unsubscribed, pending and no opt-in recorded, each as a number and a percentage.
    - name: SMS marketing counts
      contains: Subscribed, unsubscribed and no opt-in recorded, each as a number and a percentage.
    - name: consent_audit_<date>.csv
      contains: One row per customer with email, SMS consent state and the date consent last changed.
