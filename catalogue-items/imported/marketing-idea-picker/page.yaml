thinking: low
thinking_why: It picks from a fixed idea list.
new_slug: marketing-idea-picker
name: Marketing idea picker
summary: Describe your product and get three to five marketing ideas picked for your stage, budget and team, with first steps for each.
job: plan-strategy
headline: Marketing idea picker
subhead: Describe your product, audience, stage, budget and what you have already tried. It picks three to five ideas from a library of 139, across content, paid ads, email, partnerships and more. You get the matched ideas, why each fits you, first steps and the effort needed.
explain: |
  Three to five marketing ideas picked for your product, stage and budget, with steps to try the ones you choose. It draws from a library of 139 ideas across the main areas.

  It asks about your product, audience and where you are now, or reads your saved marketing context. Then it picks from groups such as content and SEO, competitor pages, free tools, paid ads, community and social, email, partnerships and events. It matches the ideas to your time, money and team size, so a one-person team does not get a plan that needs ten. For each pick you get what to do first. It is written with software products in mind, but many ideas carry over.
when:
  - You have a product and no idea which channel to try first.
  - You have a small budget and need ideas that cost time, not money.
  - You want free-tool ideas such as calculators or generators.
  - Your current channel stalled and you need new options.
not_for:
  - "You want a full written plan, not a few ideas: ask for the marketing-plan skill, or write a one-page plan with a person on your team."
  - "You need help running one channel, such as ads or email: use a tool or skill built for that channel."
  - "You sell physical products: many ideas will not fit, so ask a marketer who knows your trade."
you_give:
  - Your product and audience
  - Your stage
  - Budget, time and team size
  - What you already tried (optional)
you_get:
  - Three to five matched ideas
  - Why each fits you
  - First steps for each
  - A note on the effort needed
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat. No code or paid tool is needed.
  - Also paste references/ideas-by-category.md, the full list of ideas, or upload the whole skill folder. Without it, the picker can only use the short table in the skill text.
  - Describe your product, your audience and your stage in a few lines.
  - Add your budget, your time and your team size. Say what you have already tried, if anything.
  - Answer any questions it asks. Skip the ones your saved marketing context already covers.
  - Read the three to five ideas. Pick one and ask for a longer plan for it.
output_sample:
  input:
    - Your product and who it is for
    - Your stage, such as before launch, early or growing
    - Your budget, time and team size
    - What you have already tried (optional)
    - Your saved marketing context file (optional)
  output:
    - name: Idea name
      contains: A one-line description of each picked idea.
    - name: Why it fits
      contains: How the idea connects to your product, stage and resources.
    - name: How to start
      contains: The first two or three steps to try the idea.
    - name: Expected outcome
      contains: What success looks like if the idea works.
    - name: Resources needed
      contains: The time, money and skills the idea asks for.
