thinking: low
thinking_why: It turns a brief into prompts and sizes.
new_slug: marketing-image-maker
name: Marketing image maker
summary: Plan a marketing image before you make it. Say what it is for and get the tool, a prompt to paste, the exact pixel size and a file name.
job: make-images
headline: Marketing image maker
subhead: Tell it what the image is for, where it will sit and any brand colours or size limits. It picks between an AI image model and a design tool, then writes the prompt. You get the tool to use, a prompt to paste, exact pixel size and a file name.
explain: |
  Tell it what the picture is for and it hands back a ready plan: the tool to use, the prompt to paste, the exact pixel size and the file name to save it under.

  It first asks about the goal, the place the image will sit and the size. Then it picks between an AI image model and a design tool such as Canva or Figma. It follows a set workflow for each image type, for example 1200 by 630 for a blog hero that doubles as a share image.

  Several tools it may suggest, such as Midjourney, Flux, Ideogram and Recraft, are paid or charge per image. They need an account or API key before you start. Platform image sizes change, so check each platform's own help page before you publish.
when:
  - You need a hero image for a blog post and do not know what size to ask for.
  - You want a set of social graphics that all match one brand look.
  - You are choosing between an AI image tool and a design tool for a job.
  - You need an image with readable text in it and your first tries came out garbled.
not_for:
  - "You need paid ad images with each platform's ad specs: use the ad-creative skill from the same source, or the ad rules on the platform itself."
  - "You need a video: use a video tool or a person who edits video, because this plan covers still images only."
  - "You want a full brand look from scratch: ask a designer for a logo and style guide first, then bring it here."
  - "You want a quick prompt for a blog header or social post: use the Marketing image prompt writer."
you_give:
  - What the image is for
  - Where it will be shown
  - Brand colours or style notes (optional)
  - Size or format limits (optional)
you_get:
  - A tool recommendation for the job
  - A prompt ready to paste
  - Exact dimensions and file format
  - A file naming and saving plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Say what the image is for and where it will be shown.
  - Add your brand colours, fonts or size limits if you have them (optional).
  - Check the tool it picks. Some tools need a paid plan or API key.
  - Paste the prompt into that tool, set the size it gave you, and save the file under the name it suggests.
  - If your AI can make images itself, ask it to run the prompt for you.
  - Before you publish, add alt text, check the file in the platform's preview, and confirm the size on the platform's help page. For paid ad images, take the file to the Ad creative variation planner.
output_sample:
  input:
    - What the image is for, such as a blog hero or social graphic
    - Where it will be shown, such as your website, social feed or email
    - Brand colours, fonts or logo (optional)
    - Size limits or file format needs (optional)
    - Whether you have an image tool or API key (optional)
  prerequisites:
    - An AI that can generate images, or a design tool like Canva or Figma, to make the final image
    - Some image tools need a paid plan or API key, so check the vendor's page for current prices and model names
  output:
    - name: Tool choice
      contains: Whether to use an AI image model or a design tool such as Canva or Figma, and why.
    - name: Prompt
      contains: A ready prompt to paste into the image tool, written for your goal and style.
    - name: Size and format
      contains: The exact width and height in pixels and the best file format for where the image will sit.
    - name: File name and save plan
      contains: A clear file name and where to save the image so you can find and reuse it.
    - name: Optimization tips
      contains: Steps to shrink the file for the web, and share image tags if the image is a link preview.
