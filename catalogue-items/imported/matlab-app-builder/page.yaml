thinking: medium
thinking_why: It asks questions, picks a layout, then builds it.
new_slug: matlab-app-builder
name: MATLAB app builder
summary: Describe the MATLAB app you need. Your AI asks a few questions, picks a layout and builds a working app you can run in MATLAB.
job: build-software
headline: MATLAB app builder
subhead: Describe what the app should do, who will use it, how polished it must look and who will maintain it. It picks the build route that fits how long the app must last, then builds it. You get a working MATLAB app and the route choice with reasons.
explain: |
  A working MATLAB app built from your description, with the right build route chosen for how long it must last and who will keep it up. You skip the question of where to start.

  It asks a few questions: what the app does, whether it is a quick tool or a long-term one, how polished it must look, who will maintain it, and how to save it. From the answers it picks App Designer, a code-only app, or a web-style layout with HTML. It builds the app, handles slow tasks with background jobs so the window stays responsive, and saves it in the file format you chose.
when:
  - You want a small tool so colleagues can run your analysis without code.
  - You need a MATLAB app with a polished look for a client.
  - Your team keeps editing one app and needs a clear structure.
  - A calculation takes seconds and freezes the window while it runs.
not_for:
  - "You only need a calculation with no window or buttons: ask your AI for plain MATLAB code."
  - "You want to change an app you already have: ask your AI to edit the existing files instead."
  - "You want to convert an app between .mlapp and plain text: open it in App Designer and use File > Save As."
  - "You want to use the code outside MATLAB or other MathWorks products: the licence does not allow it."
you_give:
  - What the app should do
  - Who will use it
  - How polished it must look
  - Who will maintain it
  - MATLAB release number
you_get:
  - A working MATLAB app
  - A route choice with reasons
  - Background handling for long tasks
  - Files saved in your chosen format
how_to_use:
  - Open your AI tool. Use one that can write files and run MATLAB code. Add this skill to the chat.
  - Describe the app in a few lines. Say who will use it, how polished it must look, and who will maintain it.
  - Answer its questions. Say if you want App Designer files (.mlapp or plain text) or plain code.
  - Check the route it recommends and confirm it. Then check the plan before it builds.
  - Run the built app in MATLAB and test it. If you use version control, save the plain-text files there.
  - Next, give it a look that matches your brand with the Chart and app styler, or add charts with the MATLAB chart maker.
output_sample:
  input:
    - What the app should do
    - Who will use it and who will maintain it
    - How polished it must look
    - Whether you want App Designer (.mlapp or plain text) or plain code
    - Your MATLAB release number (optional)
  prerequisites:
    - An AI that can write files and run MATLAB code
    - MATLAB installed on your computer. MATLAB is paid software, so you need a licence
    - MATLAB R2026b or later, only if you want App Designer plain-text files
    - Use it only with MathWorks products such as MATLAB. The licence (BSD 2-Clause plus MathWorks reuse terms) says so
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: Recommendation
      contains: The build route it suggests, the signals behind it, and the main trade-off, so you can confirm or change it.
    - name: Implementation plan
      contains: App name, route, save format, layout type, panel structure, key behaviors, files and the order of the build.
    - name: App files
      contains: The working MATLAB app, saved as plain code, a .mlapp file or plain-text App Designer files.
    - name: Layout
      contains: One chosen layout type, such as Dashboard, Explorer, Tabbed, Wizard or Canvas, with a line on how the screen is arranged.
