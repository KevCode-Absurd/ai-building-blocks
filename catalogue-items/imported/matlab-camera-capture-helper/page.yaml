new_slug: matlab-camera-capture-helper
name: MATLAB camera capture helper
summary: Connect a USB, webcam or GigE camera in MATLAB and capture images or video. Get listing, connect and capture code, plus what to install.
job: build-software
headline: MATLAB camera capture helper
subhead: Tell it the camera type and model, your operating system and whether you want stills or video. It lists the devices, connects through MATLAB's video input object, sets exposure and frame rate and grabs frames. You get listing, setup and capture code plus the support packages to install.
explain: |
  A camera connected and capturing in MATLAB, whether it is a laptop webcam, a USB camera or an industrial GigE model. You get code that finds the device, sets it up and grabs a still image or video.

  The skill follows a fixed order: list the devices with the hardware info call, connect through the video input object, set properties like exposure and frame rate, then grab frames. It picks the right driver name per system, such as winvideo on Windows, macvideo on Mac and linuxvideo on Linux, and uses gentl for GigE and CoaXPress cameras. It tells you which support packages to install, and it asks which frame grabber you have when it needs to.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - You plugged in a USB camera and MATLAB does not see it.
  - You need to grab a series of frames at a set rate for analysis.
  - You work with an industrial GigE camera and the setup fails.
  - You want a quick webcam snapshot in a script.
not_for:
  - "You want the webcam support package, or you use MATLAB Online: ask for the webcam function instead, since the video input tools are not there."
  - "You already have image files and only need to process them: use your usual MATLAB image tools, no camera code needed."
  - "You work with non-camera hardware such as oscilloscopes or data boards: use that device's own MATLAB toolbox or vendor guide."
you_give:
  - Camera type and model
  - Operating system
  - What to capture (stills or video)
  - MATLAB release
you_get:
  - Device listing code
  - Connection and setup code
  - Working capture code
  - A list of support packages to install
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Tell it your camera type and model, your operating system, and whether you want stills or video.
  - If you use CoaXPress or Camera Link, name your frame grabber. Your AI needs it to pick the right adaptor.
  - Install the support packages it lists. GigE, USB3 Vision and CoaXPress cameras also need the vendor's .cti file.
  - Run the listing code in MATLAB first. Check your camera appears, then run the connect and capture code.
  - Your AI can only test the code if it can run MATLAB and reach your camera. Otherwise, run it yourself and report any errors back.
  - "Expect five parts back: device listing code, connect code, capture code, clean-up code and the list of support packages to install. Install the packages first, then run the code in that order."
  - Next, save the frames to disk or pass them to your image processing code. To write up the results, use the MATLAB report builder. If a run fails with a code error, the MATLAB bug tracer can help. It will not fix camera detection problems. For a GigE camera that is not found, check first that the camera maker's GenTL producer (.cti file) is installed.
next:
  - matlab-report-builder
  - matlab-bug-tracer
output_sample:
  input:
    - Your camera type and model
    - Your operating system
    - Whether you want still images or video
    - Your MATLAB release (optional)
    - Your frame grabber name, if you use CoaXPress or Camera Link
  prerequisites:
    - MATLAB with Image Acquisition Toolbox installed
    - The matching support package, such as OS Generic Video Interface or GenICam Interface
    - For GigE, USB3 Vision and CoaXPress cameras, the vendor's GenTL producer (a .cti file)
    - An AI that can run MATLAB and reach your camera, if you want it to test the code
  output:
    - name: Device listing
      contains: Code that lists installed adaptors and the cameras MATLAB can see on each one.
    - name: Connect script
      contains: Code that opens the camera with the right adaptor for your system, with colour and region settings.
    - name: Capture script
      contains: Code that shows a live preview and grabs one snapshot or a set number of frames with timestamps.
    - name: Clean-up code
      contains: Lines that stop the preview and acquisition, then delete the camera object.
    - name: Support packages to install
      contains: The support packages and vendor producer files your camera type needs before the code will work.
