thinking: medium
thinking_why: It runs checks then judges what matters most.
new_slug: matlab-code-reviewer
name: MATLAB code reviewer
summary: Check your MATLAB code review against MathWorks standards. Give it your files. You get findings by severity, exact lines and fixes.
job: test-and-fix-code
headline: MATLAB code reviewer
subhead: "Give it your MATLAB files and any style rules your team uses. It runs the built-in code analyser, then checks against MathWorks coding standards: naming, argument blocks, function length, nesting, vectorisation and preallocation. You get findings sorted by severity, the exact lines, suggested fixes and a quality summary."
explain: |
  A written review of your MATLAB code that sorts problems by how much they matter: errors first, then warnings, then suggestions. It checks against MathWorks coding standards, not personal taste.

  It starts with the built-in code analyser, then loads the official guidelines and goes through a checklist. That list covers names for functions and variables, argument blocks, function length, nesting depth, vectorisation, preallocation and modern commands. It also catches things the analyser misses, such as subplot where tiledlayout belongs, variables that hide built-in functions like sum, and nesting deeper than three levels. Each finding gives the file, the issue and a suggested change. You need MATLAB and its connected tools.
when:
  - A teammate sent a pull request with MATLAB code and you need a review.
  - You wrote code years ago and want it brought up to date.
  - Your loops run slowly and you suspect missing preallocation.
  - You want code that follows one standard across your team.
not_for:
  - "You have a runtime error to fix: use the matlab-debug-code skill, which is not yet in this library."
  - "You want tests written for your code: use the matlab-write-tests skill, which is not yet in this library."
  - "You want your code made faster by measuring it: use the MATLAB profiler, or a teammate who knows it well."
  - "You want to use the code outside MATLAB or other MathWorks products: the licence does not allow it."
you_give:
  - The MATLAB files to review
  - Any style rules your team has (optional)
  - MATLAB release
you_get:
  - Findings sorted by severity
  - The exact lines affected
  - Suggested fixes
  - A short summary of overall quality
how_to_use:
  - Open an AI that can run MATLAB and has the MathWorks tools connected. Paste in the skill text. Connect the MATLAB tools in your AI app first, so the check_matlab_code tool and the coding guidelines are available.
  - Add the MATLAB files or the folder you want reviewed.
  - Give it the folder path and your MATLAB release before the run starts. Add your team's style rules if you have them.
  - Ask for a code review. Your AI runs the code analyser first, then checks the rest by reading the code.
  - Read the errors first, then the warnings. Apply the fixes you agree with. The review does not change your code.
output_sample:
  input:
    - Your MATLAB files or a folder of them
    - Your team's style rules (optional)
    - Your MATLAB release (optional)
  prerequisites:
    - An AI that can run MATLAB with the MathWorks tools connected
    - The check_matlab_code tool and the matlab_coding_guidelines resource
    - Use it only with MathWorks products such as MATLAB. The licence (BSD 2-Clause plus MathWorks reuse terms) says so
  output:
    - name: Static analysis
      contains: The count of errors and warnings the built-in MATLAB code analyser found in each file.
    - name: Naming
      contains: A checklist for function, class, variable and file names against MathWorks conventions.
    - name: Structure
      contains: Checks for arguments blocks, function length and nesting depth, with line numbers for problems.
    - name: Patterns
      contains: Flags for old commands like subplot or datenum, missing preallocation and loops that could be vectorised.
    - name: Suggestions
      contains: A numbered list of fixes, ordered from errors to warnings to nice-to-haves.
