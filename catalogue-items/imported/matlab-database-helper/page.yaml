thinking: medium
thinking_why: It picks the right query pattern for each task.
new_slug: matlab-database-helper
name: MATLAB database helper
summary: "Get working MATLAB database code: connect, read with filters, write and update rows, with safe passwords. Tell it your database and table."
job: build-software
headline: MATLAB database helper
subhead: Working MATLAB code that reads from and writes to your database, with safe habits built in. Tell it the database and table, and it writes the connection, the queries and the updates.
explain: |
  Database code in MATLAB is easy to get wrong. A password typed into a connection line can leak, and a query that pulls a whole table can fill your memory.

  Three rules shape everything it writes. Filters are sent to the database, so you never pull a whole table into memory just to cut it down. Passwords are saved as secrets and never typed into code. And anything that deletes or overwrites data waits for your clear yes first. It covers connecting through ODBC and saved data sources, reading rows with filters, importing with set options, and adding or changing rows. DuckDB and MongoDB have other routes. You need MATLAB with Database Toolbox, release 2021a or later.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - You need to pull only certain rows from a large table into MATLAB.
  - You want to write results back to a database after analysis.
  - Your code has a password typed into the connection line.
  - You are setting up an ODBC connection for the first time.
not_for:
  - "You work with DuckDB: use the matlab-use-duckdb skill, which is built for it."
  - "You use MongoDB, Cassandra or Neo4j: they are not relational databases, so use each tool's own MATLAB support."
  - "You only read a CSV or Excel file: use readtable or a datastore in MATLAB, no database needed."
  - "You want to use the code outside MATLAB or other MathWorks products: the licence does not allow it."
you_give:
  - Database type and connection details
  - Table and column names
  - What you want to read or change
  - MATLAB release
you_get:
  - Connection code with safe credentials
  - Filtered read queries
  - Insert and update code
  - A confirmation step before deletes
how_to_use:
  - Open your AI tool and paste in this skill, or upload its folder if your tool takes files.
  - Tell it your database type, data source name or connection string, table and column names, and MATLAB release.
  - "Say what you want: read, add, change or delete rows. Add any filter, such as only active orders."
  - Read the code it gives you. Check that passwords use secrets and filters run in the database.
  - Run it in MATLAB with Database Toolbox. Your AI can only test it if it can run MATLAB.
  - If it shows a delete or drop statement, check it carefully before you say yes.
  - Test the code on a copy of the table first. Once it works, use it on the real table. For Databricks, use the MATLAB Databricks connection skill if your library has it.
next:
  - duckdb-big-file-query-helper
  - databricks-connection-setup
output_sample:
  input:
    - Your database type, such as PostgreSQL, MySQL, SQLite, SQL Server or Oracle
    - Your data source name or connection string
    - Your table and column names
    - What you want to read, add, change or delete
    - Your MATLAB release
  prerequisites:
    - MATLAB R2021a or later with Database Toolbox
    - An AI that can run MATLAB (optional, to test the code)
    - MATLAB R2023b or later, only if you want ORM
    - MATLAB R2026a and Parallel Computing Toolbox, only for multithreaded reads and writes
    - Use it only with MathWorks products such as MATLAB. The licence (BSD 2-Clause plus MathWorks reuse terms) says so
  output:
    - name: Connection code
      contains: Code that connects with a saved data source or a connection string, with passwords kept as secrets.
    - name: Read code
      contains: A read with the filter sent to the database, so only the rows you need come back.
    - name: Write and update code
      contains: Code to add new rows, change existing rows by a filter, and write large tables in chunks.
    - name: Transaction code
      contains: Steps that save together or roll back together if one step fails.
    - name: Delete or drop SQL
      contains: The statement shown to you first. Nothing runs until you say yes.
    - name: Object mapping class
      contains: A MATLAB class tied to a table, with write, read and update calls (optional).
