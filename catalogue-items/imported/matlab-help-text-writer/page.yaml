thinking: low
thinking_why: It follows a fixed help format.
new_slug: matlab-help-text-writer
name: MATLAB help text writer
summary: Write MATLAB help text for your function in MathWorks style. Give it the file. You get a summary line, syntax lines and a See Also line.
job: build-software
headline: MATLAB help text writer
subhead: Help text for a MATLAB function that shows up properly when someone types help or doc. You hand over the function and get the comment block back in MathWorks style.
explain: |
  A MATLAB function with no help text is hard for anyone else to use. When they type help or doc, they see nothing useful. This skill writes the comment block that fixes that.

  The block follows a set order: a one-line summary at the top, a release note if needed, syntax lines, an optional example, a See Also line and an optional note. The skill sets the casing for help text, which differs from normal prose, and the rules for naming inputs in a syntax line, such as how to show flag options and name-value pairs.
when:
  - You wrote a toolbox function and it has no help text.
  - Your help comments are out of date after you added options.
  - You want your team's functions to read the same way.
  - You are about to share code and need documentation done.
not_for:
  - "You need a README or general project docs: write those by hand or ask your AI for a plain README instead."
  - "You want new MATLAB code written: this only writes help comments. It adds them to your file only after you approve the draft, and it does not change your code itself. If you prefer, paste the block in by hand."
  - "You use Live Scripts or another language: use that tool's own doc format instead."
  - "You want to use the code outside MATLAB or other MathWorks products: the licence does not allow it."
you_give:
  - The MATLAB function file
  - Related functions to link (optional)
  - An example of typical use (optional)
you_get:
  - A one-line summary
  - Syntax lines for each way to call it
  - An example (optional)
  - A See Also line
  - The whole comment block ready to paste
how_to_use:
  - Open your AI tool. Paste the skill text into the chat, or load the skill folder if your tool supports it.
  - Paste your MATLAB function file. Add related functions and an example if you have them.
  - Or, if MATLAB is installed and linked to your AI, give it the file name and let it read the file.
  - Read the help block it proposes. Check the summary line, each syntax line and the See Also links.
  - Ask for changes, then paste the block under the function line, matching the indent of your code.
  - Type help and your function name in MATLAB to check how it shows up.
  - Before you merge the change, check that every input name and option in the block matches your code, and that each See Also link points to a real function. To review the code itself, use the MATLAB code reviewer, which sorts problems in your MATLAB code by how much they matter.
output_sample:
  input:
    - Your MATLAB function, class or script file
    - Related functions to link under See Also (optional)
    - An example of typical use (optional)
  prerequisites:
    - Either MATLAB with its AI tool link connected, or the file text pasted into your chat. MATLAB is paid software
    - Use it only with MathWorks products such as MATLAB. The licence (BSD 2-Clause plus MathWorks reuse terms) says so
  output:
    - name: H1 line
      contains: A one-line summary on the first help line, in the casing MATLAB help uses.
    - name: Syntax paragraphs
      contains: One line for each way to call the function, with inputs named the MathWorks way.
    - name: Example section
      contains: A short example of typical use, added when you give one or it is clearly needed.
    - name: See Also line
      contains: Links to related functions, written in the format that help and doc expect.
    - name: Note section
      contains: An optional note for details that do not fit in the syntax lines.
    - name: Full help block
      contains: The whole comment block, shown for your review before any file is changed.
