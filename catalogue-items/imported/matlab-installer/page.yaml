thinking: low
thinking_why: It follows a fixed install script.
new_slug: matlab-installer
name: MATLAB installer
summary: Install MATLAB, Simulink and toolboxes from the command line with the MATLAB installer. Name the products and get the same setup every time.
job: set-up-ai
headline: MATLAB installer
subhead: Tell your AI your operating system, MATLAB release, install folder and product list. It shows a plan, waits for your yes, then runs the install. You need a valid MathWorks licence or account first.
explain: |
  MathWorks products installed from the command line in exactly the same way each time, so a setup that works once keeps working on any machine or server. You name the products and it handles the commands.

  It uses the MATLAB package manager, mpm. Before it starts, it needs four facts: the operating system, the MATLAB release, the install folder and the list of products or support packages. It confirms the plan with you before it runs anything. On Windows it follows strict safety rules. Scripts are written as files and run with the file option, never typed inline, and they use only plain ASCII.

  The install downloads the MATLAB package manager (mpm) from mathworks.com and then your MathWorks products. You need a valid MathWorks licence or account first, and some products cost money.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - You must set up MATLAB with several toolboxes on a new machine.
  - Your team needs the same install on every computer.
  - An install script fails on Windows with strange quote errors.
  - You want to add a toolbox to an existing MATLAB folder.
not_for:
  - "You want the graphical installer: download it from the MathWorks website instead."
  - "You have a licence or activation problem: ask MathWorks support or your licence admin."
  - "You need the MATLAB Engine API for Python, Java or C++: follow the MathWorks steps for that API."
you_give:
  - Your operating system
  - The MATLAB release you want
  - The folder to install into
  - The list of products, toolboxes or support packages
you_get:
  - An install plan for you to confirm before anything runs
  - Install scripts written as files, so Windows quotes do not break them
  - A list of installed products with their install path
  - A check result from prodcontents.json for each product
how_to_use:
  - Use an AI that can run commands on your computer. A plain chat window cannot do the install.
  - Open the skill in your AI tool, or paste its text into the chat.
  - Tell it your operating system, MATLAB release, install folder and products.
  - Read the plan it shows. Say yes only if it is right.
  - "On Windows, the install runs with admin rights (a Windows approval prompt appears) and the scripts run with PowerShell ExecutionPolicy Bypass, so they run even though your policy normally blocks scripts. Only approve it on a machine you manage. On a work or school computer, ask your IT team before you say yes."
  - "The install file the AI edits gets two extra lines: noJRE=true (no bundled Java) and caller=agent (tells MathWorks an AI started the install)."
  - "On Linux or macOS the skill points to its own steps file (reference/linux-macos-steps.md). Paste that file in too. No admin prompt is needed."
  - When it finishes, check the list of installed products and the install path.
  - "After install, open MATLAB once and sign in to activate your licence."
next:
  - matlab-package-installer
  - matlab-project-setup-helper
output_sample:
  input:
    - Your operating system (Windows, Linux or macOS)
    - The MATLAB release you want
    - The folder to install into
    - The list of products, toolboxes or support packages
  prerequisites:
    - An AI that can run commands on your computer
    - A valid MathWorks licence or account
    - Admin rights on Windows
  output:
    - name: Install plan
      contains: The operating system, release, folder and product list, shown for you to confirm before anything runs.
    - name: mpm download
      contains: The MATLAB package manager, saved to a fixed path on your machine.
    - name: Release input file
      contains: The install settings file for your release, edited with your folder and products.
    - name: Install command
      contains: The command that installs your products, run the same way each time.
    - name: Verification
      contains: A list of installed products with their install path and the prodcontents.json check result.
    - name: Release notes link
      contains: A link to the release notes for the version you installed.
