thinking: low
thinking_why: It runs a few package commands.
new_slug: matlab-package-installer
name: MATLAB package installer
summary: Install, update or remove a MATLAB package from the command line, and fix dependency errors. Give it the package name and your release.
job: build-software
headline: MATLAB package installer
subhead: Name the package. Get it installed, updated or removed, with dependency errors sorted. Bring the package name and your MATLAB release (R2026b or later).
explain: |
  MATLAB packages installed, updated or removed from the command line, with dependency errors sorted out. Name the package and say what you want done.

  The skill uses MATLAB's own package manager from release 2026b. It always turns off the prompt so scripts do not hang waiting for an answer. It uses a dry run to resolve a package name across all configured sources before it installs. It prefers a project file to list dependencies, so another person can rebuild your setup. It warns that every install is global, that names in search are case-sensitive in one form, and that forcing an install can remove other packages. It asks you before any force. Older releases use the Add-On Manager instead.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page, and the skill file now says LICENSE.md governs. Follow the LICENSE.md file.
when:
  - You need a community package and are unsure of its exact name.
  - An install fails because of a missing dependency.
  - You want your project's packages written down so a teammate can match them.
  - You need to remove a package without breaking others.
not_for:
  - "You need to install MATLAB, Simulink or a toolbox from a shell: use the standalone installer from MathWorks, or ask a person who manages your MATLAB licence."
  - "You want a list of installed toolboxes or products: run the ver command in MATLAB instead."
  - "You use a release older than R2026b: use the Add-On Manager in MATLAB instead."
you_give:
  - The package name
  - "What you want done: install, update or remove"
  - MATLAB release
  - Project folder (optional)
  - A check that you are happy for the package to install globally. Every install applies to all your projects on this machine, not only the current one.
you_get:
  - Install commands that run without prompts
  - A dry run result first
  - Dependency fixes
  - A project file entry (optional)
how_to_use:
  - Check that you have MATLAB R2026b or later. Older releases use the Add-On Manager.
  - Open an AI that can run code in MATLAB, and paste in this skill.
  - Tell it the package name and whether to install, update or remove it.
  - Read the dry run result first. Confirm it found the right package.
  - Approve the change. If a force is needed, it will ask you before it runs.
  - Check the package list to see the final result.
  - Next, write the package into your project file with the MATLAB project setup helper, so a teammate can match it.
next:
  - matlab-project-setup-helper
  - matlab-code-sharer
output_sample:
  input:
    - The package name, or part of it
    - "What you want done: install, update, remove, search or list"
    - Your MATLAB release
    - Your project folder (optional)
  prerequisites:
    - An AI that can run code in MATLAB R2026b or later
    - A MATLAB licence for that release. MATLAB itself is paid software
    - For a custom or Artifactory package source, an access token set as an environment variable. Never paste the token into the chat or into code.
    - Looking up a File Exchange package sends web requests to MathWorks, so your AI needs web access for that one step
  output:
    - name: Package check
      contains: A dry run that finds the package name in your configured sources before anything is installed.
    - name: Install, update or remove commands
      contains: Commands that run without prompts, so your script does not stop and wait for an answer.
    - name: Package list
      contains: What is installed now, with names and versions, so you can confirm the change worked.
    - name: Dependency fixes
      contains: Steps to clear errors such as a dependency that cannot be found.
    - name: Project file entry
      contains: A line in your matlab.toml file so a teammate can set up the same packages.
    - name: Warnings
      contains: Notes on risks, such as global installs or a forced install that removes other packages.
