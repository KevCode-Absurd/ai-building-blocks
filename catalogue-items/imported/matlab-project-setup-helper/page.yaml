thinking_why: It fills in a config file from set options.
new_slug: matlab-project-setup-helper
name: MATLAB project setup helper
summary: Set up a MATLAB project file. Describe your folders and get a matlab.toml with paths, dependencies and startup scripts, checked against the format rules.
job: build-software
headline: MATLAB project setup helper
subhead: "A matlab.toml file that sets up your project: its folders, search paths, dependencies and scripts that run on open or close. You describe how the project is laid out and get a file that fits."
explain: |
  A MATLAB project with the wrong paths breaks on a teammate's computer, and MATLAB does not warn you when the project file has a typo. This skill writes the file for you.

  The skill asks only for the project name, then scans your folder for what already exists. It writes a minimal draft first and shows it to you. When you edit an existing file it changes only the parts you name, and leaves the rest as it was. It checks every key against the format rules by hand, because MATLAB's openProject does not report mistakes in the file; unknown keys are silently ignored.
when:
  - You are starting a MATLAB project and want its folders on the path automatically.
  - A teammate cannot run your code because the paths are wrong.
  - You need a startup script to run each time the project opens.
  - Your project file has a typo that MATLAB does not warn about.
not_for:
  - "You want to edit an old .prj project file: this skill only writes matlab.toml, so edit the .prj in MATLAB or convert it first."
  - "You want to build the project in code with matlab.project.createProject: write those calls yourself, because this skill writes the file directly."
  - "You need to build or install a MATLAB package: use MATLAB's own package tools, not this skill."
  - "You want to use the code outside MATLAB or other MathWorks products: the licence does not allow it."
you_give:
  - The project name
  - Your folder layout
  - Dependencies and startup scripts (optional)
you_get:
  - A matlab.toml file
  - Folder and path settings
  - Dependency entries
  - A check against the format rules
  - Option to create the folders
how_to_use:
  - Open your AI in a chat that can see your project folder. Paste this skill in, or add it to your tool.
  - Tell it you want a matlab.toml, and give your project name.
  - Let it scan your folders. Read the short draft it shows you and say what to change.
  - Answer its questions about packages, shortcuts or deployment, only if you need them.
  - Ask it to check every key against the format rules, then save the file in your project root.
  - In MATLAB, run openProject and currentProject to confirm the paths are right. If the project ships as a toolbox file, use the Toolbox packager next.
  - MATLAB is a paid product. Install and license it to open the project and confirm the file loads. Converting a .prj file needs a recent MATLAB release. The skill alone cannot run MATLAB.
output_sample:
  input:
    - Your project name
    - Your project folder (so your AI can scan it for code, test and startup files)
    - Packages or reference projects your code needs (optional)
    - Shortcuts, labels or deployment targets (optional)
  prerequisites:
    - An AI that can read your project folder and write files
    - MATLAB installed and licensed, only if you want to open the project and check it loads
    - Use it only with MathWorks products such as MATLAB. The licence (BSD 2-Clause plus MathWorks reuse terms) says so
  output:
    - name: matlab.toml
      contains: The project file with the name, folders, startup and shutdown scripts, and any sections you asked for.
    - name: "[folders]"
      contains: The code folders to put on the MATLAB path and the folders that hold tests.
    - name: "[dependencies]"
      contains: MATLAB packages by version, and reference projects by path.
    - name: "[project]"
      contains: Summary, startup folder, startup and shutdown scripts, and shortcuts to scripts you use often.
    - name: Format check
      contains: A key-by-key check of the file against the format rules, since MATLAB does not warn about mistakes.
    - name: Folder creation
      contains: An offer to create any listed folders that do not exist yet.
