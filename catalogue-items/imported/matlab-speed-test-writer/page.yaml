thinking: medium
thinking_why: It picks what to measure, then follows a set test pattern.
new_slug: matlab-speed-test-writer
name: MATLAB speed test writer
summary: Get a MATLAB performance test class that times your code with repeat runs, several input sizes and a before-and-after check for slowdowns.
job: test-and-fix-code
headline: MATLAB speed test writer
subhead: Repeatable MATLAB speed tests that tell you how long code really takes, with enough runs to trust the number. Give it the code to time and get a test class ready to run.
explain: |
  Repeatable MATLAB speed tests that tell you how long code really takes, with enough runs to trust the number. Give it the code to time and get a test class ready to run.

  It uses MATLAB's performance test framework. You choose where the timer starts and stops. Fast code under ten milliseconds needs a repeat loop, precise cases need start and stop calls, and the default times the whole method. It shows how to test several input sizes with parameters, and warns about a classic mistake: using the wrong kind of parameter for values that setup needs, which causes an error. It keeps setup lean so only the code under test is measured.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - You changed an algorithm and want to prove it got faster.
  - A function seems fast on small input and slow on large input.
  - You need timing tests to run each time code changes.
  - Your timing numbers vary too much between runs to trust.
not_for:
  - "You want a quick one-off time for one line of code: use MATLAB's timeit function, no test class needed."
  - "You want to make slow code faster: ask your AI to profile it to find the slow lines first, then rewrite them."
  - "You want to measure memory use, not run time: use MATLAB's memory tools or ask your AI for a memory check."
you_give:
  - The code to time
  - Input sizes to try
  - What counts as fast enough (optional)
  - MATLAB release
you_get:
  - A performance test class
  - Timing set up for several input sizes
  - Instructions to run the tests
  - A way to compare before and after
how_to_use:
  - Before you start, list each function you want to time and the input sizes you will test, and confirm that MATLAB and its test tools are installed. Then paste your code.
  - Open Claude, ChatGPT or Gemini and paste in this skill's instructions.
  - Paste the MATLAB code you want to time. Say which input sizes to try and which MATLAB release you use.
  - Ask for a performance test class. Read it to check setup sits outside the timed part.
  - "Save the class as a .m file in MATLAB and run it with runperf. This needs a paid MATLAB licence. Your AI does not need to run MATLAB: you can run the class yourself and paste any errors back to it, or use an AI that can run MATLAB."
  - Save the first results as a baseline file and keep it in version control with your code. After each change, run the comparison code and read which tests are OK, REGRESSION or IMPROVEMENT.
  - If a test shows a regression, take that code to the MATLAB speed tuner to find the cause.
  - If the results look noisy, ask your AI to fix the setup or raise the input size, then run again.
next:
  - matlab-speed-tuner
output_sample:
  input:
    - The MATLAB function or code you want to time
    - The input sizes to try, such as small, medium and large
    - What counts as fast enough (optional)
    - Your MATLAB release
  prerequisites:
    - A paid MATLAB licence, since the tests run inside MATLAB
    - A MATLAB release that includes the performance testing framework, which is part of MATLAB's test tools
    - An AI that can run MATLAB, or you run the test class yourself
  output:
    - name: Performance test class
      contains: A MATLAB class that sets up your data, times only your code and checks the result is not empty.
    - name: Parameters
      contains: Input sizes set in setup, plus extra options such as algorithms, so each size gets its own timing.
    - name: Run commands
      contains: The runperf command, and a fixed sample count option if you want a faster run.
    - name: Results summary code
      contains: Code that prints median, standard deviation and coefficient of variation for each test, and flags results above 10% as noisy.
    - name: Baseline comparison
      contains: Code that saves a baseline, then compares later runs and marks each test as OK, REGRESSION or IMPROVEMENT.
    - name: Quality checklist
      contains: A short check that setup is outside the timer, random data is seeded and output is switched off.
