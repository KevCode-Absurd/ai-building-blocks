new_slug: medical-scan-reader
name: Medical scan reader
summary: Read DICOM, NIfTI or NRRD scans into MATLAB with the right spacing and orientation. Needs MATLAB. NRRD and slices need a paid add-on.
job: build-software
headline: Medical scan reader
subhead: Scan files from DICOM, NIfTI or NRRD loaded into MATLAB as clean volumes with the right voxel size, orientation and patient coordinates. It saves you from hand-rolling the reading code and getting the geometry wrong.
explain: |
  Scan files from DICOM, NIfTI or NRRD loaded into MATLAB as clean volumes with the right voxel size, orientation and patient coordinates. It saves you from hand-rolling the reading code and getting the geometry wrong.

  It starts by checking which MATLAB toolboxes you have, then picks the newer Medical Imaging Toolbox calls when they exist and falls back to the Image Processing Toolbox when they do not. A quick-reference table maps each task, such as reading a folder, listing series, pulling an oriented slice or reading RT contours, to the right function. It also covers anonymising DICOM files. Showing the volumes is left to other skills.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - You have a folder of CT or MR slices and need one 3D array in MATLAB.
  - You need to list the series inside a DICOM study.
  - You want a slice in a set orientation, such as coronal.
  - You want to remove common patient details from DICOM files before sharing.
not_for:
  - "You want to view or display a 3D volume: use the matlab-display-volume skill, which is not yet in this library. This one only reads and writes the data."
  - "You want to show a 2D medical image with notes on it: use the matlab-display-image skill, which is not yet in this library."
  - "You have normal photos or graphics such as PNG, TIFF or JPEG: use imread in MATLAB. This skill is also not a stand-in for a clinician reviewing the scans."
  - "You want to use the code outside MATLAB or other MathWorks products: the licence does not allow it."
you_give:
  - Paths to your DICOM, NIfTI or NRRD files
  - The MATLAB toolboxes you have installed (optional)
  - What you want out, such as a volume, slice or contours
you_get:
  - MATLAB code that reads your scans
  - Voxel data with spacing and orientation
  - A list of DICOM series
  - DICOM copies with common patient details removed, when asked
how_to_use:
  - Check that you have MATLAB and which toolboxes are installed. Type ver in MATLAB to see the list.
  - Know that the Medical Imaging Toolbox is a paid MathWorks add-on. NRRD reading, extractSlice and updateOrientation need it. Without it you can only read DICOM and NIfTI.
  - Paste this skill into Claude, ChatGPT or Gemini, or load it in an AI tool that can run MATLAB.
  - Give your AI the file path, your toolbox list and what you want out, such as a volume, a slice or contours.
  - Run the MATLAB code it writes. Check the size, spacing and orientation it prints against what you expect.
  - If you share DICOM files, ask for anonymising. It removes common patient details but may miss some, so open the copy and check it before you share.
  - You get a block of MATLAB code, then a printout of the voxel size and orientation. The library has no volume viewer skill yet. To view the volume now, ask your AI to use MATLAB's own viewers, volumeViewer or volshow.
  - This reads scan data for work, research and learning. It does not diagnose anything. Scans hold patient details, so only use files you are allowed to use, and keep them on your own computer.
output_sample:
  input:
    - The path to your DICOM folder, NIfTI file or NRRD file
    - Which MATLAB toolboxes you have (optional)
    - What you want out, such as a volume, a slice, a series list or contours
    - The slice number and view you want, such as coronal (optional)
  prerequisites:
    - MATLAB with the Image Processing Toolbox
    - The Medical Imaging Toolbox, a paid MathWorks add-on, for NRRD reading, extractSlice and updateOrientation
    - An AI that can run MATLAB, or you run the code it writes
    - Use it only with MathWorks products such as MATLAB. The licence (BSD 2-Clause plus MathWorks reuse terms) says so
  output:
    - name: Volume read code
      contains: MATLAB code that loads your folder or file with medicalVolume, or with dicomreadVolume or niftiread if you lack the add-on.
    - name: Voxel array
      contains: A 3D array of scan values, rescaled where the file allows, such as Hounsfield units for CT.
    - name: Spacing and orientation
      contains: The voxel size in mm and the orientation as text, such as transverse, coronal or sagittal.
    - name: Spatial referencing
      contains: Volume size, patient coordinate system and slice positions, taken from medicalref3d or imref3d.
    - name: Series table
      contains: A table from dicomCollection with one row per series, showing modality, description and size.
    - name: Oriented slice
      contains: One slice in the view you chose, with its position and spacing, from extractSlice.
    - name: Anonymised DICOM files
      contains: Copies of your DICOM files with patient details removed, made only when you ask.
