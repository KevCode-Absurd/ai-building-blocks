thinking: low
thinking_why: It sorts notes into three lists and flags what is missing.
new_slug: meeting-minutes-writer
name: Meeting minutes writer
summary: Turn rough meeting notes into short minutes. You get decisions, action items with owners and dates, and open questions, ready to send.
job: organise-work
headline: Meeting minutes writer
subhead: Short minutes that let someone who missed the call catch up in three minutes, and let attendees see what they owe. Paste your rough notes and get the point of the meeting first, then the detail.
explain: |
  Short minutes that let someone who missed the call catch up in three minutes, and let attendees see what they owe. Paste your rough notes and get the point of the meeting first, then the detail.

  The notes are sorted into three groups. Decisions are written as "Decided to do X", never "Discussed X". Action items need an owner and a date, and when the notes lack one, the gap is marked [unassigned] or [TBD] rather than guessed. Open questions say what blocks them and who moves next. A final check confirms every item is complete, and the minutes stay under a third of the length of the notes.

  This is a copy of a community skill written by alapha888, not an original AI Blocks skill. The licence that applies to this copy is CC BY 4.0, as the LICENSE-CONTENT file in this item says. The MIT line in the skill file is the author's own header (alapha888), and the original repository is alapha888/agent-skills-en. We copied it from sickn33's collection. Keep the credit if you reuse it. Credit goes to alapha888 and sickn33.
when:
  - You have a page of messy notes from a team call and need to send a summary.
  - Your action items keep going out without owners or dates.
  - You need to show a boss what was decided, not the full discussion.
  - You want a clear record of what is still open after a meeting.
not_for:
  - "You need a word-for-word or legal record: use a transcript tool or keep the full recording."
  - "You have no notes yet, only a live call: take notes first, or use your meeting app's built-in transcript."
  - "You want to plan the next meeting: write the agenda by hand, because this only works from notes you already have."
  - "You want a bottom line, decisions, owners, dates and open questions from rough notes in one pass: use the Rough notes to minutes writer."
you_give:
  - Raw meeting notes or a transcript
  - Attendee names (optional)
  - Known deadlines (optional)
you_get:
  - A three-line bottom line
  - A list of decisions
  - Action items with owner and date
  - Open questions with a next step
how_to_use:
  - Gather first: the attendee list, the meeting date and any deadlines already agreed.
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code, files or paid tools are needed.
  - Paste your rough notes or transcript below it. The meeting must already have happened: this works from notes you have, not from a live call. Add attendee names and known deadlines if you have them.
  - Send it and read the bottom line first. Check it matches what the meeting decided.
  - Look for [unassigned] (no owner), [TBD] (no date) and [to confirm] (any other missing detail) marks. Fill in each gap yourself, because the AI will not guess.
  - Pair it with the Rough notes to minutes writer, which does a similar job. Pick this one when you want a short bottom line, a fixed three-bucket list and a self-check on each item. Pick the Rough notes to minutes writer when you want one pass from messy notes to a full set of minutes.
  - Send the minutes to the attendees. Copy the open questions into your task list, and run the skill again when one gets an answer.
output_sample:
  input:
    - Your rough meeting notes or a transcript
    - Attendee names (optional)
    - Known deadlines (optional)
  output:
    - name: Bottom line
      contains: Up to three lines on what the meeting decided, placed at the top.
    - name: Decisions
      contains: One line for each decision, written as "Decided to do X", never "Discussed X".
    - name: Action items
      contains: Each task with an owner and a deadline. Missing ones are marked [unassigned] or [TBD].
    - name: Open questions
      contains: Each undecided issue, what blocks it, and who owns the next step.
    - name: Self-check flags
      contains: A note in the reply on any item that still lacks an owner, a deadline or a next step.
