thinking: low
thinking_why: It transcribes then summarises with a fixed format.
new_slug: meeting-notes-maker
name: Meeting notes maker
summary: Turn a meeting recording into a transcript by speaker, plus a summary, decisions and action items. A simple meeting notes maker for your audio files.
job: organise-work
headline: Meeting notes maker
subhead: Drop in a meeting recording and get back a transcript with each speaker named, plus a summary, the decisions made and the action items. You stop replaying audio to find who said what.
explain: |
  Drop in a meeting recording and get back a transcript with each speaker named, plus a summary, the decisions made and the action items. You stop replaying audio to find who said what.

  The recording is checked for format and size, cleaned of hum, clicks and echo, and levelled out. Speakers are told apart by voice. A speech-to-text tool such as Whisper or Deepgram then writes the words with timestamps. The result is grouped into topics, decisions, open questions and tasks. You choose Markdown, JSON or plain text, and can give speaker names and the main language. It needs a speech-to-text service to run.

  This is a copy of a skill by Burhan Sebin, shared under the MIT licence (the LICENSE file in this item). It was not written for this library. The original is in the seb1n/awesome-ai-agent-skills repo on GitHub.
when:
  - You recorded a sprint planning call and need a written record.
  - You joined a long call and want only the decisions and tasks.
  - You need a transcript with speaker names for a client file.
  - Your team speaks a language other than English and needs notes in it.
not_for:
  - "You need live captions during a call: use a live note-taker built into your meeting app."
  - "You have no recording, only your memory: write the notes yourself while it is fresh, or ask a teammate who took notes."
  - "You already have a typed transcript and want a short summary: paste it into your AI and ask for decisions and tasks."
you_give:
  - The meeting audio file
  - Speaker names (optional)
  - Main language
  - Output format, such as Markdown or JSON
you_get:
  - A timestamped transcript by speaker
  - A short summary
  - A list of decisions
  - Action items with owners
how_to_use:
  - Check that you can run code and upload audio files in your AI tool. Without that, you can only paste in a transcript you already have.
  - Choose a speech-to-text tool such as Whisper or Deepgram. Whisper can run on your own computer. Deepgram is a paid service and needs an API key.
  - Before you upload, make sure everyone in the meeting agreed to be recorded, and that your data rules allow sending the audio to an outside speech-to-text service. Whisper on your own computer keeps the audio with you. Deepgram and other hosted services receive it. Telling speakers apart by voice uses voiceprints, which count as biometric data in some places. Check your local privacy rules, and tell people before you do it.
  - Upload your recording. Add speaker names, the main language and the format you want. If anyone has not agreed to voice matching, tell your AI to skip it and label speakers by the names you give.
  - 'Paste this prompt with the file: "Make meeting notes from this recording. Speakers: [NAMES]. Language: [LANGUAGE]. Format: [MARKDOWN, JSON OR TEXT]." Your AI cleans the audio, writes the transcript and drafts the summary.'
  - Fill any owner or date marked [unassigned] or [TBD]. Do not leave them for your AI to guess.
  - Check speaker names, numbers and deadlines against the recording before you send the action items on.
  - Read the transcript marks for unclear parts, and fix names and tasks that look wrong.
  - Copy the action items into your task tracker or send them to the team.
output_sample:
  input:
    - Your meeting audio file (MP3, WAV, M4A, FLAC, OGG or WebM)
    - Speaker names (optional)
    - The main language of the meeting (optional)
    - "The format you want: Markdown, JSON or plain text (optional)"
  prerequisites:
    - An AI that can run code and read audio files
    - A speech-to-text tool such as Whisper or Deepgram, which may need an account or API key
  output:
    - name: Timestamped transcript
      contains: Every spoken line with a time and a speaker label, with crosstalk and unclear parts marked.
    - name: Overview
      contains: A short account of what the meeting covered.
    - name: Key Discussion Points
      contains: The main topics, grouped by theme.
    - name: Decisions
      contains: A numbered list of what the group agreed.
    - name: Action Items
      contains: Each task with its owner and any deadline mentioned.
    - name: Follow-ups
      contains: Smaller next steps and open questions after the meeting.
