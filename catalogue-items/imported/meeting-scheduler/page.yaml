thinking: low
thinking_why: It resolves times by clear rules.
new_slug: meeting-scheduler
name: Meeting scheduler
summary: Find a meeting time that works across time zones. Give it who, how long and when. You get ranked slots, then an invite once you confirm.
job: organise-work
headline: Meeting scheduler
subhead: Tell your AI who to meet, for how long and when, in plain words. It checks calendars and time zones, then offers the best times. You pick one and it sends the invite.
explain: |
  A meeting on everyone's calendar at a time that works, without the back-and-forth emails. Tell it who to meet, how long and when, in plain words.

  It pulls out the people, topic, length and limits. It looks up each person's time zone and converts the options into local times. It reads each calendar for free blocks, then ranks slots by working hours and by how few early or late times it creates. You see a grid of options with the best one marked. Once you confirm, it creates the invite with the agenda and a video link, tracks replies, and offers new slots if a key person declines. It needs calendar access.
when:
  - You need a one-hour call across India, Europe and China.
  - You want a weekly team standup set at the same local time.
  - A meeting must move and you want the next best slot found.
  - You are tired of asking five people for their free times.
not_for:
  - "You cannot give your AI calendar access: ask each person for free times, or use a simple poll tool such as Calendly."
  - "You need a person to approve every recurring meeting: set those up by hand in your calendar."
  - "You only want to convert one time between zones: use a plain time zone converter."
you_give:
  - Names or emails of the people to invite
  - Topic and length
  - Preferred days or time of day
  - Calendar access
you_get:
  - A grid of times in each person's local time
  - A recommended slot with the reason
  - A calendar invite with agenda and video link
  - Updates on who accepted or declined
how_to_use:
  - Use an AI that can connect to your Google Calendar or Outlook. Without that link, it cannot see free times. You may need to set up access in your AI's settings first.
  - Paste the skill into your chat.
  - "Write your request, for example: who to meet, how long, and which days work."
  - Check the times it shows. Real calendar data must back every slot. If a slot looks wrong, tell it.
  - Confirm one slot. It then creates the invite with the agenda and video link.
  - Ask it to track replies and find new slots if someone declines.
output_sample:
  input:
    - Names or emails of the people to invite
    - Topic and length of the meeting
    - Preferred days or time of day (optional)
    - Time zone for anyone your AI cannot look up (optional)
  prerequisites:
    - An AI that can read your calendar, such as Google Calendar or Outlook
    - Permission to create events on that calendar
    - Access set up for each calendar service you use, such as Google Calendar, Microsoft Outlook or Calendly. Some need API access or login details from you, and Calendly availability may need a paid Calendly plan
  output:
    - name: Availability matrix
      contains: Each option shown in every person's local time, with time zone labels and a flag on awkward hours.
    - name: Ranked slots
      contains: The top three times, scored on working hours and few early or late times, with the best one marked.
    - name: Recommendation
      contains: The slot it suggests and the reason, followed by a question asking you to confirm.
    - name: Calendar invite
      contains: An event with the agenda and a video link, sent only after you confirm. A Zoom, Meet or Teams link may need an account or plan of its own. The AI must never say a slot is free unless it read that person's calendar.
    - name: RSVP updates
      contains: Who accepted, replied maybe or declined, and new slots if a key person declines.
