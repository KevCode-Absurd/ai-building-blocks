thinking: high
thinking_why: It links deal terms to pro forma results.
new_slug: merger-effect-modeler
name: Merger effect modeler
summary: Model the effect of buying a company on your earnings per share. Give it both companies and deal terms, and get a merger model with cost savings cases.
job: money-and-investing
headline: Merger effect modeler
subhead: A model that shows whether buying a company adds to or cuts your earnings per share, and by how much. Give it both companies and the deal terms, and you get the price paid, how it is funded, and what happens after cost savings.
explain: |
  A model that shows whether buying a company adds to or cuts your earnings per share, and by how much. Give it both companies and the deal terms, and you get the price paid, how it is funded, and what happens after cost savings.

  It works through a purchase price table, then sources and uses of cash, then the earnings effect for different mixes of cash and stock. Cost and revenue savings are phased in over time and tested in cases. The skill is set for Indian deals: fiscal years run April to March, and amounts are in lakh and crore, with a warning about an Excel format that is off by 100 times.
when:
  - You are weighing an acquisition and need to know if it lifts earnings.
  - You want to compare paying in cash versus shares.
  - You need to test how many cost savings make the deal break even.
  - You are building an Indian deal model and want the units right.
not_for:
  - "You want to value one company on its own: use a discounted cash flow model or a peer comparison, not this."
  - "The target is private and has no earnings: use a simple valuation by revenue or assets first, then come back."
  - "You need a full legal or tax review of the deal: ask a deal lawyer or a chartered accountant."
you_give:
  - "Buyer details: share price, share count, earnings, debt and cash"
  - "Target details: price, shares and earnings"
  - Offer price and cash versus stock mix
  - Expected savings and fees
you_get:
  - A purchase price and value table
  - A sources and uses of funds table
  - Earnings per share before and after the deal
  - Savings cases and a break-even view
how_to_use:
  - The India conventions files the skill names are not in this folder. If your AI cannot load them, ask it to state the conventions it assumed and list what it could not check.
  - Open a chat with an AI that can make Excel files. Paste in this skill.
  - Add the buyer and target details, the offer price and the cash and stock mix.
  - Add your expected savings, fees and close date. If you skip something, your AI should ask or mark it missing.
  - Check that all amounts are in rupees, in lakh or crore, and that years run April to March.
  - Read the year one result and the breakeven savings first. Then look at the sensitivity tables.
  - Use the one-page summary in your pitch book or deal discussion.
output_sample:
  input:
    - "Buyer details: share price, share count, earnings, debt and cash"
    - "Target details: share price, share count and earnings or net income"
    - Offer price and the mix of cash and stock
    - Expected savings, fees and close date
  prerequisites:
    - An AI that can build and share an Excel file (otherwise you get the tables in the chat)
    - The India market conventions and market data skills, which this skill asks your AI to load first
  output:
    - name: Purchase price analysis
      contains: Offer price, premium, equity value, net debt, enterprise value and the implied multiples.
    - name: Sources and uses
      contains: Where the money comes from, and what it pays for, including fees.
    - name: Pro forma EPS
      contains: Earnings per share for years one to three, before and after the deal, with accretion or dilution.
    - name: Sensitivity tables
      contains: How the result changes with cost savings, offer premium and the cash and stock mix.
    - name: Breakeven savings
      contains: The least cost savings needed for the deal to leave year one earnings per share unchanged.
    - name: Excel workbook
      contains: Assumptions, sources and uses, pro forma income statement, summary, sensitivities and breakeven on separate tabs.
    - name: One-page summary
      contains: A short merger consequences page you can put in a pitch book.
