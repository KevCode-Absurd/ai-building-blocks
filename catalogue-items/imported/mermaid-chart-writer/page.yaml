thinking: low
thinking_why: It turns a description into diagram syntax.
new_slug: mermaid-chart-writer
name: Mermaid chart writer
summary: Describe a flow, system, database or plan and get Mermaid diagram code you can paste into GitHub, a README or a wiki, with the right chart type.
job: work-with-files
headline: Mermaid chart writer
subhead: Describe a process, system, database or project plan in words. It picks the chart type, writes the Mermaid code and tells you how to preview it. Paste the code into docs, a README or a wiki. Broken diagram code gets fixed too.
explain: |
  Mermaid is a way to draw diagrams by typing text. GitHub, GitLab, Notion and many docs sites turn that text into a picture. This skill writes the text for you, so you do not learn the syntax. You can also paste a diagram that will not render and have it fixed.

  It picks the chart type that fits your description: flowchart, sequence, entity relationship, state, Gantt, user flow, timeline and more. It keeps the chart readable with short labels and steady styling. It adds comments in the code where the syntax is tricky.

  It checks the code by reading it. It can only say the chart renders if a real renderer ran, so it tells you which check it did. It escapes labels that come from outside and leaves click scripts off.
when:
  - You need an API call flow drawn for a design doc.
  - You want a database diagram in your README without opening a drawing tool.
  - You have a project plan and need a Gantt chart for GitHub.
  - Your diagram code will not render and you want it fixed.
not_for:
  - "You need exact artwork or a brand graphic: use a drawing tool such as draw.io or Figma, since Mermaid places the boxes for you."
  - "You want a styled SVG picture to edit by hand: use the Dark-theme diagram maker."
  - "You want a chart of numbers from a spreadsheet: use the chart maker."
you_give:
  - A plain description of the process, system, database tables or plan
  - Where the diagram will be shown, such as GitHub or Notion (optional)
  - The Mermaid version, if you know it (optional)
  - The broken diagram code and its error message, if you need a fix (optional)
you_get:
  - One block of Mermaid code, ready to paste
  - The chart type chosen and why
  - Short comments on the tricky lines
  - Where to preview it and how to export a picture
  - A note on what was checked and what was not
how_to_use:
  - Start a chat and add the skill. Describe what to draw in plain words, such as the steps, the people or systems, and the tables. List each box and what it connects to.
  - Say where it will be shown, such as GitHub, Notion or a wiki. That helps it choose syntax that works there.
  - Copy the code block. Paste it into mermaid.live, or into a code block marked mermaid on GitHub, and look at the picture.
  - Check every box and arrow against what you meant. Ask for changes in plain words, such as "split step 3 in two".
  - If it will not render, paste the error back. Ask it to fix the exact line.
  - Export a PNG or SVG from the preview tool if you need a picture.
output_sample:
  input:
    - A plain description of the process, system, tables or plan
    - Where the diagram will be shown (optional)
    - The Mermaid version (optional)
    - Broken diagram code and its error, if you need a fix (optional)
  prerequisites:
    - A place to preview Mermaid, such as mermaid.live or GitHub
    - Node, only if you want it to render the diagram for you (optional)
  output:
    - name: Chart type
      contains: The type chosen, such as flowchart or sequence, with one line on why it fits.
    - name: Mermaid code
      contains: One complete code block with comments on tricky syntax, ready to paste.
    - name: Preview and export steps
      contains: Where to paste the code and how to save a PNG or SVG.
    - name: Checks
      contains: Whether the code was checked by reading or by a real render, and the version used.
    - name: Alternatives and style notes
      contains: Other chart types if one would fit better, plus colors and a short text description for screen readers.
how_it_works:
  - title: Read your description
    text: It lists the steps, actors, tables or tasks you gave. It asks once for anything missing and does not invent steps.
  - title: Choose the chart type
    text: It matches your description to flowchart, sequence, ER, state, Gantt, user flow, timeline or another type.
  - title: Write the code
    text: It writes the Mermaid with short labels, steady styling and comments on tricky syntax.
  - title: Check it
    text: It reads the syntax for errors. If it can run a renderer, it renders and notes the version.
  - title: Hand over
    text: It gives the code, the preview steps, what was checked and any better chart type.
works_best_with:
  tools:
    - name: Any good chat AI
      why: It only writes text, so any chat AI can do it.
    - name: mermaid.live
      why: A free page where you paste the code and see the picture at once.
  inputs:
    - A list of every box and what it connects to
    - Your table names and the keys that link them, for a database diagram
    - Task names, owners and dates, for a Gantt chart
terms:
  - term: Mermaid
    meaning: A way to draw diagrams by typing text, shown as pictures on GitHub and many docs sites.
  - term: Entity relationship diagram
    meaning: A picture of database tables and how they link, also called an ER diagram.
  - term: Gantt chart
    meaning: A bar chart of tasks across a timeline.
