thinking: medium
thinking_why: It follows a proven method but must pick fresh angles.
new_slug: meta-ad-copywriter
name: Meta ad copywriter
summary: Write Meta ad copy for Facebook and Instagram. Give it your offer and buyer, and get hooks, primary text, headlines and UGC scripts to test.
job: write-ad-copy
headline: Meta ad copywriter
subhead: Facebook and Instagram ad text written for the one job an ad has, which is to get the click. Describe your offer and buyer and you get hooks, primary text, headlines and UGC video scripts to test.
explain: |
  Facebook and Instagram ad text written for the one job an ad has, which is to get the click. Describe your offer and buyer and you get hooks, primary text, headlines and UGC video scripts to test.

  It first sorts the brief by funnel position and by how much the buyer knows, from unaware to most aware, and the less they know, the longer the copy. Then it picks a strategy. Sell the click uses a short caption and curiosity and sends people to an advertorial. Sell the solution shows and proves the product in the ad, then sends people to the product page. It warns against sending a viewer who has seen the product to a blind sales video.
when:
  - You are launching a cold-traffic Facebook ad and need several angles.
  - You need a UGC video script for Reels.
  - Your retargeting ads get views but few clicks.
  - You are unsure whether the ad or the landing page should do the selling.
not_for:
  - "You need a landing page, email or full sales video: write those with your AI in a separate chat, as this skill only writes ads."
  - "You want to check an ad against Meta's rules before launch: ask a person who knows Meta's ad policy to review it."
  - "You want one ad only with no testing: this skill gives 3 to 5 versions, so pick the best one yourself."
you_give:
  - Your offer and product
  - Your buyer and what they know
  - Where the ad sends people
  - Past ads that worked (optional)
you_get:
  - Primary text variations
  - Headlines and descriptions
  - Hooks to test
  - UGC or video ad scripts
  - A note on the ad strategy used
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tools are needed.
  - Describe your offer and your buyer. Say what they already know and where the ad sends people.
  - "Add past ads that worked (optional) and say which format you want: static ad, short UGC, long video or story."
  - Read the variations. Replace every placeholder, such as [X customers], with your own real numbers, names and results.
  - Check any health, weight-loss or before and after claims against Meta's ad policies before you launch.
output_sample:
  input:
    - Your offer and product
    - Your buyer and what they already know
    - Where the ad sends people
    - Past ads that worked (optional)
  output:
    - name: Ad brief
      contains: Your funnel position, how aware your buyer is, and whether the ad sells the click or the solution.
    - name: Primary text
      contains: Caption copy for the feed, built in a why, what and how order.
    - name: Headlines and descriptions
      contains: Short lines that sit under the ad image or video.
    - name: Hook variations
      contains: 3 to 5 openers, each with its own angle, such as curiosity, contrarian or social proof.
    - name: UGC and video scripts
      contains: Scripts for a short talking head, a long hook-led video or a story video, with visual notes.
