thinking: medium
thinking_why: The format is strict, but the definition needs your business rules.
new_slug: metric-definition-writer
name: Metric definition writer
summary: Share a metric and how it is worked out. Get one agreed definition as a structured file, check results and questions for the data owner.
job: document-work
headline: Metric definition writer
subhead: Share the formula or query, data sources, reporting level and edge cases. It drafts a structured definition, checks required fields and references, and adapts it to your chosen data tool. You get a structured file (YAML) and check results when the tools run. The data owner still needs to approve the meaning; a valid file does not settle business disagreements.
explain: |
  One agreed definition for a metric, written as YAML that a tool can check and your team can reuse. It gives your teams one written definition to check against when two teams run different queries for the same number.

  You give the name, the calculation, who uses it and the decision it feeds. The skill scaffolds the right YAML for a metric, dimension or entity, using a template script, and then runs a validator that checks required fields, types and references between items. It can match the exact field names the dbt Semantic Layer expects. Edge cases and known traps are written into the definition so they are not lost.
when:
  - Finance and marketing each have their own revenue query.
  - You are setting up the dbt Semantic Layer and need metric files.
  - A leader asks how churn is calculated and no one can point to a source.
  - You are writing a data catalog entry for a key model.
not_for:
  - "You need one number for a one-off question: write a plain SQL query instead."
  - "You only want a written note about a data table: add an entry to your data catalog instead."
  - "You have no agreed rule yet for how the metric is worked out: settle it with the data owner first, then come back."
you_give:
  - The metric or model name
  - The calculation as SQL, a formula or plain steps
  - Who uses it and what a good value looks like
  - Source tables (optional)
  - Existing YAML to check (optional)
you_get:
  - A filled metric, dimension or entity YAML
  - A validation report
  - dbt-ready field names
  - Notes on edge cases
how_to_use:
  - Download the skill folder and open it in an AI that can run code, such as Claude with file access.
  - "Say: use the semantic model builder skill to define my metric. Then paste the metric name, the calculation, who uses it and what a good value looks like."
  - Add your source tables and any YAML you already have (optional). Say if you need dbt Semantic Layer field names, and which dbt version.
  - Let your AI run the template script, fill in the YAML, then run the checking script. It checks fields, types and links inside one file only. Links to items in other files are not checked.
  - "The result is YAML files for the metric, dimension and entity, plus the validation report. It does not test the calculation against your real data, so run the SQL yourself."
  - Read the validation report and the edge case notes. Fix anything flagged, then get the data owner to confirm the definition.
  - Save the final files in your dbt project or data catalog. The data owner signs off the definition before anyone uses it, and the signed-off file is shared where both teams look up metrics, such as the dbt project or data catalog.
output_sample:
  input:
    - The metric or model name
    - The calculation as SQL, a formula or plain steps
    - Who uses it, what decision it informs and what a good value looks like
    - Your source tables and column names (optional)
    - Existing YAML to check (optional)
  prerequisites:
    - An AI that can run code, so it can run the template and checking scripts
    - The skill folder, which holds the scripts and reference notes
    - "Optional and possibly paid: a dbt Cloud plan, needed only if you deploy to the dbt Semantic Layer. Check yours before you plan to deploy"
  output:
    - name: assets/metric_definition.yaml
      contains: The filled metric definition, with its calculation, business context, edge cases and known traps.
    - name: assets/dimension_definition.yaml
      contains: The filled dimension definition, if you asked for dimensions.
    - name: assets/entity_definition.yaml
      contains: The filled entity definition, if you asked for entities.
    - name: Validation report
      contains: A check of required fields, types and links between items, shown in the chat.
