    used: "Copied under the MIT licence. We gave it a plain name, made temporary passwords fully random, made the bundled user tool's temporary passwords random too, and named the paid plans some steps need. We added Before you start and After this sections that link to other AI Blocks steps. We refreshed those generated sections from the catalogue inputs and next-step links. AI Blocks replaced unsafe password CSV examples with a shared Windows DPAPI credential handover helper, saved and verified before account creation. The bundled generator now quotes user fields as PowerShell literals, requires supplied licence and usage-location values, and stops on an uncertain creation or licence result. Local synthetic checks cover encryption, recovery and mocked failures; no live tenant was tested."
