thinking: high
thinking_why: A safe migration needs careful ordering and rollback thinking.
new_slug: migration-planner
name: Migration planner
summary: Plan how to retire an old system, API or feature and move users to the new one. Get a go or no-go, phased steps and a shutdown checklist.
job: build-software
headline: Migration planner
subhead: A plan to retire an old system, feature or library and move users to the new one without breaking them. Name what you want to remove and you get the decision, the steps and the dates.
explain: |
  A plan to retire an old system, feature or library and move users to the new one without breaking them. Name what you want to remove and you get the decision, the steps and the dates.

  First it tests whether you should deprecate: does it still give unique value, how many things depend on it, does a replacement exist, and what does each user pay to move. No replacement means build one first. It plans for the fact that with enough users, every quirk becomes depended on. Then it lays out announcement, moving each consumer, watching usage and the final shutdown. It also asks how you would remove a new system in three years.
when:
  - You are replacing an API and clients still call the old one.
  - You want to sunset a feature few people use.
  - Two copies of the same code exist and you must pick one.
  - You plan a new system and want its exit built in.
not_for:
  - "No replacement exists yet: build the replacement first, then come back to plan the move."
  - "The old system still gives value nobody else does: keep it running and put your effort into the new one."
  - "You only want to clean up a few unused lines of code: ask a teammate to remove them and check usage first."
you_give:
  - The system, feature or library to retire
  - What replaces it (optional)
  - Who depends on it and how many
  - Your timeline (optional)
you_get:
  - A go or no-go on deprecation
  - A phased migration plan
  - A list of users to move and effort for each
  - A shutdown checklist
how_to_use:
  - "Gather these first: the name of what you want to retire, what replaces it, who uses it (teams, apps or customers) and roughly how many, any usage logs or numbers, and your timeline. Code access helps but is optional."
  - Open a chat in Claude, ChatGPT or Gemini and paste the skill text from this page.
  - Name the system, feature or library you want to retire. Say what replaces it, if anything.
  - Add who uses it and how many, plus your timeline if you have one.
  - If your AI can read your project files, let it search for who still calls the old code. Otherwise paste in what you know.
  - Read the go or no-go first. If it says no-go, fix that gap before you use the plan.
  - For a database change, ask for the expand and contract steps. The skill also points to a separate skill called incremental-implementation, which you do not need to run it.
  - Once the plan is agreed, send the deprecation notice to every user on the list, open one ticket per user or system to move, and put the shutdown date in the team calendar.
output_sample:
  input:
    - The system, feature or library you want to retire
    - What replaces it (optional)
    - Who depends on it and how many
    - Your timeline (optional)
  prerequisites:
    - A way to see who still uses the old system, such as logs or usage numbers (optional but helpful)
    - An AI that can read your project files (optional, helps it find who depends on the old code)
  output:
    - name: Deprecation decision
      contains: A go or no-go, based on unique value, number of users, replacement and the cost of moving or staying.
    - name: Deprecation type
      contains: Whether the move is advisory (optional for users) or compulsory (with a hard deadline), and why.
    - name: Migration approach
      contains: "The pattern that fits: run both side by side, an adapter, a feature flag, or a step-by-step database change."
    - name: Phased plan
      contains: Steps from announcement to shutdown, in order, with a place for dates and owners.
    - name: Consumer list
      contains: Each user or system to move, what it touches, and the effort to move it.
    - name: Shutdown checklist
      contains: Checks before removing the old code, tests, docs and settings, including proof of zero use.
