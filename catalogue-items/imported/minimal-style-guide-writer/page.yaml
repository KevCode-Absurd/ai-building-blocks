thinking_why: It fills a set template with the style's rules.
new_slug: minimal-style-guide-writer
name: Minimal style guide writer
summary: Describe your product. Get a style guide built on space, plain type and
  few colours, with checks.
job: design-work
headline: Minimal style guide writer
subhead: A style guide for a clean, minimal interface that designers and
  engineers can use right away. Describe your product and you get fixed choices
  for type, colour, spacing and behaviour, plus rules for what to do and avoid.
explain: |
  A style guide for a clean, minimal interface that designers and engineers can use right away. Describe your product and you get fixed choices for type, colour, spacing and behaviour, plus rules for what to do and avoid.

  The foundations come first: a type scale with a main font and a display font, a palette with primary, neutral, success, warning and danger colours as named tokens, and a spacing scale of 4, 8, 12, 16, 24 and 32. Accessibility is set to WCAG 2.2 AA with clear focus states and keyboard use. Writing tone is short and confident. Rules say to use named tokens over raw values and never to use low contrast text.
when:
  - You are starting a product and have no design rules yet.
  - Your screens use random spacing and several near-identical colours.
  - You want your team to build the same-looking components.
  - You need accessibility rules written down for engineers.
you_give:
  - A description of your product
  - Brand colours or fonts (optional)
  - Platforms you build for (optional)
you_get:
  - Type, colour and spacing tokens
  - Accessibility rules
  - Do and don't lists
  - Component guidance
  - A writing tone note
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
