thinking: low
thinking_why: It counts images per product.
new_slug: missing-product-image-finder
name: Missing product image finder
summary: Find Shopify products and variants with no image or too few images before a launch. Get a list and a CSV of the gaps to fix.
job: product-photos
headline: Missing product image finder
subhead: A list of Shopify products and variants with no image, or fewer than you want, so no page goes live looking bare. Run it before a launch or a sale and fix the gaps first.
explain: |
  A list of Shopify products and variants with no image, or fewer than you want, so no page goes live looking bare. Run it before a launch or a sale and fix the gaps first.

  It reads your products and counts their images. Products with zero images are flagged, and so are those under a minimum you set. It can also check each variant for an assigned image. It flags variants that have no image assigned. It does not check whether an assigned image shows the right colour. You choose active, draft or all products. It reads data only and never changes your store, so it is safe to run any time. It needs a signed-in Shopify CLI with permission to read products.
when:
  - You are about to launch a sale and want every page to have photos.
  - A bulk import left some products blank.
  - Customers pick a colour and see the wrong picture.
  - You want a rule that every product has at least three images.
not_for:
  - "You want to check photo quality, alt text or whether a photo matches the product: review the photos yourself or ask a designer."
  - "Your AI cannot read your Shopify admin or run the Shopify CLI: check the Products list in Shopify admin by hand, sorted by image."
  - "You need to change images in bulk: this only reads and reports, so fix the gaps in Shopify admin or with an import file."
you_give:
  - Your store domain
  - The minimum number of images per product
  - Whether to check variants too
  - Product status to scan
you_get:
  - Products with no or few images
  - Variants without an assigned image
  - A readable list or JSON output
  - A count of the gaps
how_to_use:
  - Use an AI that can run the Shopify CLI on your computer, such as Claude Code or Cursor. A plain chat window cannot read your store. Paste in the skill text.
  - Sign in first with the Shopify CLI. Run shopify store auth --store your-store.myshopify.com --scopes read_products.
  - Tell your AI your store domain. Add your minimum images (10 or less, because only the first 10 images per product are counted), whether to check variants, and which product status to scan.
  - Read the summary and the list of flagged products. Fix the zero-image products first.
  - Open the CSV file to see each gap by product and variant. Note that only the first 10 images and 50 variants per product are read.
output_sample:
  input:
    - Your store domain
    - The fewest images each product should have (optional, default 1)
    - Whether to check variants too (optional, default yes)
    - "Which products to scan: active, draft or all (optional, default active)"
  prerequisites:
    - An AI that can run code and use the Shopify CLI
    - A Shopify CLI sign-in with permission to read products
  output:
    - name: Start banner
      contains: The skill name, your store domain and the start time.
    - name: Step progress lines
      contains: One line per step showing what was asked and how many results came back.
    - name: Summary report
      contains: Counts of products scanned, products with no images, products below your minimum and variants missing an image.
    - name: Products needing images
      contains: Each flagged product by title with its image count, and a note if it is below your minimum.
    - name: image_audit CSV file
      contains: One row per issue with product, handle, image count, issue, and variant details.
    - name: JSON summary (optional)
      contains: The same counts as the report in a machine-readable form, if you ask for JSON.
