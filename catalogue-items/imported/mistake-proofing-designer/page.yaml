when:
  - The same bug has bitten your team for the third time.
  - You handle money, permissions or deletion and failures are silent.
  - You are designing an API that callers keep misusing.
  - You want to find what is easy to get wrong in a module.
not_for:
  - "You have a one-off bug with no repeat: fix it and add a normal test, or ask a teammate for a code review."
  - "You need proof that a design is correct: use a security review, a domain expert or a full test plan."
  - "You want a simple reminder or checklist: write a doc, but know it is only training and will fade."
you_give:
  - The code, form or process to harden
  - The mistake that keeps happening
  - How costly it is when it does (optional)
you_get:
  - Hazards listed and ranked
  - Fixes placed on the control, warning or detection ladder
  - Concrete changes such as types or constraints
  - A note on which fixes rely only on memory
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Paste the code, form or process that keeps going wrong. Say what mistake keeps happening.
  - Add how costly the mistake is, if you know (optional).
  - Read the hazards and fixes. Your AI will propose changes first and wait for your go-ahead.
  - Approve the fixes you want, then ask your AI to write them. Check each one against real callers before you ship.
output_sample:
  input:
    - The code, form or process you want to harden
    - The mistake that keeps happening
    - How costly it is when it happens (optional)
  output:
    - name: Hazard list
      contains: Each mistake someone could make, what happens when they do, whether it is silent, and what stops it today.
    - name: Three lens check
      contains: Whether the wrong thing can fit, a wrong or incomplete set can pass, or steps can run in the wrong order.
    - name: Proposed device and rung
      contains: The fix for each hazard, and whether it is control, warning or detection.
    - name: Tradeoff note
      contains: Why a higher rung was not taken, such as the language limit or the number of callers it would break.
    - name: Docs-only flag
      contains: Any fix that relies only on someone remembering, marked as not a real mistake-proofing device.
