thinking: high
thinking_why: Routing and balancing experts is hard to get right.
new_slug: mixture-of-experts-trainer
name: Mixture of experts trainer
summary: Get starter code and settings to train a mixture of experts language model with PyTorch and DeepSpeed, sized to your GPUs and goal.
job: build-software
headline: Mixture of experts trainer
subhead: Tell it your GPUs, your goal and your training tool. It writes a sparse expert layer in PyTorch, a training setup for DeepSpeed or Hugging Face, and starting settings for experts and routing. You run it on your own GPUs.
explain: |
  A mixture of experts (MoE) model is a language model built from many small expert networks. A router picks a few experts for each word, so only part of the model runs each time. You get more capacity for the compute spent on each word.

  This skill gives you the pieces to train one: a sparse layer in PyTorch, three ways to route words, the extra loss that keeps experts evenly used, and training setups for DeepSpeed, Megatron-DeepSpeed and Hugging Face. It follows designs such as Mixtral and Switch Transformers.

  It is a starting sketch, not a finished product. Some code is marked as an outline you must complete, and every setting is a starting value to test. You need Python, several GPUs and your own training data. Check flag names against the version you install.
when:
  - You have a fixed GPU budget and want a model with more capacity than a dense model of the same compute.
  - You want to try a Mixtral-style design with 8 experts and 2 per word.
  - Your training loss is unstable, or a few experts get all the work.
  - You need to spread experts across several GPUs with DeepSpeed.
not_for:
  - You have one GPU or a small dataset. Use a dense model, or the LLM fine-tuning guide to adapt an existing one.
  - You want to train a small model from scratch to learn how it works. Use the tiny GPT trainer or the LitGPT model trainer.
  - You only need to run a finished MoE model. Use the local model runner for laptops instead.
  - You still need to set up several GPUs. Start with the multi-GPU training setup helper.
you_give:
  - Your GPUs, such as how many and what type
  - Your goal, such as a language or domain
  - Your training data, or where it lives
  - Model size and number of experts (optional)
  - Your training tool, such as DeepSpeed or Hugging Face (optional)
you_get:
  - A sparse expert layer in PyTorch
  - A training script or config for your tool
  - Install steps with versions to confirm
  - Starting values for experts, routing and loss weights
  - A short list of what to watch while it trains
how_to_use:
  - "Make sure you have Python, PyTorch and GPUs ready. Your AI writes the code but cannot train in a chat window. Rented cloud GPUs cost money by the hour, so estimate the cost before a long run."
  - Open Claude, ChatGPT or Gemini and paste this skill. If your AI can read files, give it the skill folder too.
  - Tell it your GPUs, your goal, your data and your tool. Say if you want DeepSpeed, Megatron-DeepSpeed or Hugging Face.
  - Read the setup it recommends before you run anything. Check the flag names against the DeepSpeed version you install.
  - "Before the first run, write down five things: your GPU count and type, the path to your data, the tool you chose, the cost estimate, and the exact short test command with its step count. Then run deepspeed pretrain_gpt_moe.py --help (or the entry point your checkout has) and fix any flag it does not list."
  - Run a short test first, such as a few hundred steps. Watch the loss and how evenly the experts are used.
  - If one expert gets most words or the loss jumps, tell your AI. It will suggest a change to the loss weights.
how_it_works:
  - title: Match setup to budget
    text: It picks the tool, expert count and top-k from your GPUs and goal.
  - title: Build the sparse layer
    text: It writes the router and expert networks in PyTorch.
  - title: Choose a routing rule
    text: Top-1, top-2 or expert choice, with the trade-off for each.
  - title: Add load balancing
    text: It adds the extra loss that keeps experts evenly used, and a stability loss for the router.
  - title: Set up training
    text: It writes the DeepSpeed, Megatron-DeepSpeed or Hugging Face config, including how experts spread over GPUs.
  - title: List what to watch
    text: It says what to check while training, and marks every setting as a starting value.
output_shape: |
  ## Recommended setup
  <tool, experts, top-k, and why>

  ## Code
  <sparse layer and training script or config>

  ## Settings to check
  <learning rate, loss weights, capacity factor>

  ## Install steps
  <commands and versions to confirm>

  ## What to watch
  <expert balance, loss, dropped tokens>

  ## Open questions
  <missing inputs>
