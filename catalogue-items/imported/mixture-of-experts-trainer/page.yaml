works_best_with:
  tools:
    - name: Claude Code
      why: It can read the skill's reference files and edit your training scripts on your machine.
    - name: DeepSpeed
      why: It has built-in MoE support and spreads experts across GPUs.
    - name: Hugging Face Transformers
      why: It already has Mixtral-style model code you can build on.
  inputs:
    - Your GPU count and memory
    - A small sample of your training data
    - Your current training script, if you have one
terms:
  - term: Mixture of experts
    meaning: A model made of many small networks, where only a few run for each word.
  - term: Router
    meaning: The small network that picks which experts handle each word.
  - term: Top-k
    meaning: How many experts handle each word. Mixtral uses 2.
  - term: Load balancing
    meaning: An extra loss that stops a few experts from getting all the work.
  - term: Dense model
    meaning: A normal model where every part runs for every word.
