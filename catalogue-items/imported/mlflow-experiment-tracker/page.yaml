thinking: medium
thinking_why: It adds logging to code you already have.
new_slug: mlflow-experiment-tracker
name: MLflow experiment tracker
summary: Add MLflow experiment tracking to your training code. Every run is logged and compared, so you can repeat your best model.
job: track-numbers
headline: MLflow experiment tracker
subhead: Every training run you do gets saved with its settings, scores and files, so you can see which one won and repeat it. No more folders named final_v2_really_final.
explain: |
  Every training run you do gets saved with its settings, scores and files, so you can see which one won and repeat it. No more folders named final_v2_really_final.

  The skill adds MLflow to your training code. It logs the settings you chose, such as learning rate and batch size, then the scores as training goes, then the finished model. Autologging covers common libraries in one line. After that you open the MLflow screen, sort runs by score, and compare two side by side. Good models can be named, versioned and moved from testing to production. It needs Python and a local install of MLflow.
when:
  - You have run the same model ten times and cannot remember which settings gave the best score.
  - A teammate asks you to reproduce last week's result.
  - You want to compare two model versions on the same scores.
  - You need a record of which model went live and when.
not_for:
  - "You run one quick script or a notebook and will not compare runs: a simple note of your settings and scores is enough."
  - "You have no Python setup on your machine or server: set that up first, or ask a developer to install it."
  - "You want to deploy to AWS or Azure without an account: both need your own paid account and can cost money."
you_give:
  - Your training script
  - The scores you care about
  - Where to store runs, such as a folder or a shared server (optional)
  - The machine learning library you use
you_get:
  - Training code that logs every run
  - A screen to sort and compare runs
  - Saved models with version numbers
  - A promotion path from test to production
  - Steps to repeat your best run
how_to_use:
  - Before you start, check you have a recent Python, run pip install mlflow, and install the machine learning library your script uses. Pick a small training script you already have. Tell your AI the MLflow version you installed (run pip show mlflow), because some registry commands changed between versions.
  - Paste the skill into your AI, then paste your script. Say which scores you care about and which library you use.
  - Ask your AI to add MLflow logging. It should name the experiment and give each run a clear name.
  - "You get back your edited script, plus a table or list of the logged runs with their best scores and a short summary of each run."
  - Run the script a few times with different settings. This needs an AI that can run Python, or you run it yourself.
  - Start the MLflow screen with the command mlflow ui and open http://localhost:5000. Sort runs by score and compare two.
  - After you compare runs, pick the best one and give its model a name in the model registry. On a recent MLflow, use an alias such as champion. The stage commands are for older versions only. Only if you need it, ask for the registry or deploy steps. Cloud deploy needs your own AWS or Azure account and may cost money.
next:
  - language-model-benchmark-runner
  - copilot-eval-driven-dev
output_sample:
  input:
    - Your training script
    - The scores you care about, such as accuracy or loss
    - The machine learning library you use
    - Where to store runs, such as a folder or a shared server (optional)
  prerequisites:
    - An AI that can run Python code, or a Python setup you run yourself
    - MLflow installed with pip
  output:
    - name: Tracked training script
      contains: Your code with MLflow added, logging settings, scores and the finished model for each run.
    - name: Autologging setup
      contains: One line that logs settings, scores and the model for common libraries without extra code.
    - name: Logged run record
      contains: The settings, scores, files and model saved for each run, so you can compare them.
    - name: MLflow screen
      contains: The local web page where you sort runs by score and compare two side by side.
    - name: Model registry steps
      contains: Commands to name a model, give it a version number and move it from staging to production.
    - name: Load and search commands
      contains: Code to find past runs with filters and load a saved model version to reuse it.
    - name: Deploy commands
      contains: Optional commands to serve a model locally or send it to AWS or Azure.
