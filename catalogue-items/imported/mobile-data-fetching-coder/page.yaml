thinking: medium
thinking_why: It chooses the right library and handles the edge cases.
new_slug: mobile-data-fetching-coder
name: Mobile data fetching coder
summary: "Describe the data your app needs. Get mobile data fetching code for React Native with Expo: caching, retry, offline support and safe token storage."
job: build-software
headline: Mobile data fetching coder
subhead: The code that gets data into your React Native app and keeps it working when the network is slow, gone or wrong. You end up with fetching that retries, remembers recent answers and shows something useful offline.
explain: |
  The code that gets data into your React Native app and keeps it working when the network is slow, gone or wrong. You end up with fetching that retries, remembers recent answers and shows something useful offline.

  The skill starts with plain fetch plus error handling, then picks React Query for bigger apps or SWR for simpler ones. It sets how long data stays fresh, keeps saved answers on the phone, and watches the connection to pause or resume requests. Login tokens go in secure storage, not plain files. Web addresses for development and production live in separate environment files. Secret keys stay on the server side only.

  The licence that applies to this copy is CC BY 4.0, as the LICENSE-CONTENT file in this item says. The MIT line in the skill file is the author's own header (Expo). Keep the credit if you reuse it. Credit goes to Expo and sickn33.
when:
  - Your app shows a blank screen whenever the signal drops.
  - API calls feel slow and repeat for data you already have.
  - You need to refresh login tokens without kicking people out.
  - You need different server addresses for testing and for the live app.
not_for:
  - "Your app is web only: use Expo Router data loaders, which load data for a page on the web."
  - "Your app makes no network calls: you do not need this, so skip it."
  - "You need a backend or API built: ask a developer, since this skill only writes the app side that calls it."
you_give:
  - The data your screens need and the API it comes from
  - How fresh each piece of data must be
  - Your Expo project
  - Login method, if the API needs one (optional)
you_get:
  - Fetch code with error handling
  - Caching and retry settings
  - An offline plan
  - Safe token storage code
  - Environment files for each stage
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text from this page into a new chat, then paste references/detailed-guide.md too. SKILL.md tells the AI to read that guide before it starts, because the full steps are in it. For route-level loaders on the web, also paste references/expo-router-loaders.md.
  - "Have ready: your API base URL, the login method, the list of screens with the data each one needs, and how fresh each piece of data must be. Describe them to your AI."
  - Add your login method if the API needs one (optional).
  - Share your Expo project files if your AI can read them. Otherwise paste the files that make requests.
  - "Check the result before you use it: test it with the network off, and make sure no secret key sits in app code."
  - Next, ask your AI to review the fetch and token code against your API's docs before you merge it.
  - Run the code on your own phone or emulator. Your AI can only write it, it cannot test it for you.
  - "You get one code file for each part: fetch, cache, offline, token storage and environment settings, each with a short note on what to test. Before you ship, test with the network off, test a refresh of an expired login token, and search your app code for secret keys."
output_sample:
  input:
    - The data your screens need and the API it comes from
    - How fresh each piece of data must be
    - Your Expo project
    - Your login method, if the API needs one (optional)
  prerequisites:
    - An AI that can read your project files and run code, for best results
  output:
    - name: Fetch code
      contains: Request code with error handling, using plain fetch first, then React Query or SWR as your app needs.
    - name: Caching and retry settings
      contains: How long data stays fresh, how often a failed request retries, and how saved answers are kept on the phone.
    - name: Offline plan
      contains: Code that watches the connection, pauses or resumes requests, and shows saved data when the signal drops.
    - name: Token storage code
      contains: Login token handling in secure storage, with a refresh step so people stay signed in.
    - name: Environment files
      contains: Separate .env.development and .env.production files for server addresses, with secret keys kept on the server side.
