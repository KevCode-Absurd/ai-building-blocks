thinking: medium
thinking_why: The product must stay exact, so each version needs a check.
new_slug: model-and-scene-swapper
name: Model and scene swapper
summary: Swap the model or background in a product photo and keep the clothes the same. Get ready-to-paste prompts for a model and scene swapper.
job: product-photos
headline: Model and scene swapper
subhead: "One photo of a clothed model turns into many: new models, new backgrounds, same clothes. A single shoot can then cover different ages, skin tones and settings for different markets."
explain: |
  One photo of a clothed model turns into many: new models, new backgrounds, same clothes. A single shoot can then cover different ages, skin tones and settings for different markets.

  Claude cannot draw the pictures. It writes the exact prompt, and an image model such as GPT Image does the drawing. The prompt names every detail of the garment to lock in, such as color, cut, logo and folds. Then it describes the new person, the new background, or both, and keeps the pose, camera angle and crop. You pick one of three modes: swap the person, swap the background, or swap both. You need access to an image tool.
when:
  - You have one good model photo and need versions for several countries.
  - You want the same shirt shown on a street, a studio and a beach.
  - You need an older or younger model without a new shoot.
  - An ad test needs ten looks from one source photo.
not_for:
  - "You only have a flat photo of the clothes and no model: use the Virtual try-on photo maker, or book a shoot."
  - "The garment is cropped, hidden by arms or bags, or too small in the photo: reshoot it first, because the swap will guess the missing parts."
  - "You want a real person's face or likeness on the photo: this is not for that, so get written consent and use a real photo shoot."
you_give:
  - The original model or mannequin photo
  - What to swap, the person, the background or both
  - A description of the new model or scene
  - Access to an image tool such as ChatGPT or an API key
  - Written consent from anyone whose face is in a model reference photo, and a check of your local ad rules for AI-made models
you_get:
  - A ready-to-paste image prompt for each version
  - A list of what stays locked on the clothes
  - Pose and framing instructions
  - Notes on how to check the result
how_to_use:
  - "Pick your mode: swap the person, swap the background, or swap both."
  - The skill file is written in Chinese. Your AI can read it, and you can ask it to reply in English.
  - Paste the skill into your AI and add your model photo. Say who or what the new look should be.
  - Your AI writes the prompt. It also writes the command for the image tool.
  - Run it in your image tool. This needs a dLazy account or API key, and it costs money for each image. Use the dry-run option first to see the cost.
  - Make 3 or 4 versions and pick the best one. Check the garment, the hands and the light against your real garment before you post anything.
  - If you run ads with AI models, check your local ad rules. You may need to say the models are AI-made.
  - Next, if the fabric texture looks flat, ask for a higher quality run and compare it with the first version.
next: [ai-product-photo-inspector, marketplace-photo-rule-checker]
output_sample:
  input:
    - Your model or mannequin photo
    - "Which mode you want: swap the person, the background, or both"
    - A short description of the new model or scene
    - A pose or scene reference photo (optional)
    - A face photo of the model you want to keep across items (optional)
  prerequisites:
    - An image model that can edit photos, such as GPT Image, through a dLazy account or API key
    - Image runs are paid per image, and the dry-run option shows the cost first
  output:
    - name: Mode choice
      contains: Which of the three modes fits your goal, and what must stay locked in the photo.
    - name: Image prompt
      contains: A ready-to-paste prompt that locks the garment details and describes the new person, the new scene, or both.
    - name: Alignment and hand lines
      contains: Extra lines that keep the clothes in place on the new body and fix the hands.
    - name: Image command
      contains: A command for the image tool with your photos in order, the size, the quality and the number of versions.
    - name: Check list
      contains: "What to look at in each result: garment changes, shifted clothes, hands and lighting."
