thinking: high
thinking_why: Explaining a model needs several methods and careful reading of results.
new_slug: model-decision-explainer
name: Model decision explainer
summary: Explain a trained model in MATLAB. See which inputs matter, why it made one call, and where it gets cases wrong. Works on table data.
job: build-software
headline: Model decision explainer
subhead: A clear answer to why your trained model says what it says. You see which inputs matter most, why it gave one case a certain score, and where it keeps getting things wrong.
explain: |
  A clear answer to why your trained model says what it says. You see which inputs matter most, why it gave one case a certain score, and where it keeps getting things wrong.

  The skill works in MATLAB on models trained on rows and columns of data. It matches your question to a method: ranking the inputs, showing how one input moves the result, explaining a single prediction, studying the errors, or comparing groups of people. It works with built-in models and with custom ones you wrap in a prediction function. It is not for images or text models, and it does not train or tune anything. You need MATLAB and its Statistics and Machine Learning Toolbox. Both are paid MathWorks products, so check you hold a licence first.
when:
  - Your manager asks which factors drive the model.
  - One customer got a bad score and you must explain why.
  - The model does worse on one group and you need to see how much.
  - You want to know what small change would flip a prediction.
not_for:
  - "You need to train, tune or pick features for a model: do that in MATLAB first, then come back to explain the result."
  - "Your model reads images, text or signals: this skill only works on rows and columns of data, so use a method built for that type of data."
  - "Your model predicts more than one result at once: split it into one model per result, or ask a data scientist for help."
  - "Your model was cross-validated (a partitioned model): pick one trained model to explain instead."
  - "You want to use the code outside MATLAB or other MathWorks products: the licence does not allow it."
you_give:
  - A trained model on table data
  - The data it was trained or tested on
  - The question, such as why a case or which inputs
  - Groups to compare (optional)
  - MATLAB with the Statistics and Machine Learning Toolbox
you_get:
  - A ranked list of the inputs that matter
  - A plain explanation of single predictions
  - Charts of how one input changes the answer
  - A review of the cases it got wrong
  - A comparison across groups
how_to_use:
  - Open your AI tool and paste in the skill, or load the skill folder if your tool takes files.
  - Tell it where your trained model and your data are. Say that you use MATLAB.
  - Ask one clear question, such as which inputs matter or why one case got its score.
  - Add the groups you want to compare, if you have any (optional).
  - Check the plan your AI shows you, then let it run the analysis in MATLAB.
  - Read the result and the caveats. Share the findings with whoever owns the model. If the model is weak, collect more data or retrain it outside this skill.
next: [no-code-model-trainer, neural-network-trainer]
output_sample:
  input:
    - Your trained model (built in MATLAB, or any model wrapped in a prediction function)
    - The table of data it was trained or tested on
    - Your question, such as which inputs matter or why one case got its score
    - Groups to compare (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with the Statistics and Machine Learning Toolbox
    - Use it only with MathWorks products such as MATLAB. The licence (BSD 2-Clause plus MathWorks reuse terms) says so
  output:
    - name: Ranked inputs
      contains: A table of the inputs that matter most, ordered by how much each one changes the model's answer.
    - name: Single prediction explanation
      contains: A plain account of why the model gave one chosen case its score, input by input.
    - name: Input effect charts
      contains: Charts showing how the answer moves as one input goes up or down.
    - name: Error review
      contains: The cases the model got wrong, with the likely reasons and what small change might flip each one.
    - name: Group comparison
      contains: How the model behaves for each group you chose, and where it does worse.
    - name: Caveats
      contains: Any assumption or limit that affects how far you can trust the findings, on its own line.
