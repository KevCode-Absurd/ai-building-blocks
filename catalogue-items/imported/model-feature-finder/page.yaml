thinking: high
thinking_why: Reading what the features mean takes research judgment.
new_slug: model-feature-finder
name: Model feature finder
summary: Find what ideas sit inside a language model. Train a sparse autoencoder with SAELens to get named features and test them. Needs Python and a GPU.
job: research-topics
headline: Model feature finder
subhead: A small helper network, trained on your language model, that shows which ideas its inner activity stands for. Instead of a blur of numbers, you get named features such as a place, a tone or a risky topic.
explain: |
  A small helper network, trained on your language model, that shows which ideas its inner activity stands for. Instead of a blur of numbers, you get named features such as a place, a tone or a risky topic.

  The skill uses SAELens, a Python library. It picks one layer of the model, collects activations from lots of text, and trains a sparse autoencoder to split them into features where only a few fire at once. You then look at which text lights each feature up, and test it by turning it up or down. This is for machine learning researchers and technical staff. If you do not write Python, skip it. It needs Python, a GPU for larger models, and some comfort with research code.
when:
  - You want to know what concept a layer of your model has learned.
  - You are studying whether a model holds a feature for something unsafe.
  - You want to steer a model by adjusting one named feature.
  - You need to load a ready-made feature set and look around.
not_for:
  - "You only want to look at basic activations: use TransformerLens directly, with no feature network."
  - "You want to test cause and effect by editing parts of a model: use pyvene or TransformerLens."
  - "You are not comfortable with Python or research code: ask a machine learning researcher, or browse ready-made features on Neuronpedia."
you_give:
  - A language model and the layer to study
  - A text dataset to read activations from
  - A GPU and a Python setup
  - A feature or topic you want to find (optional)
you_get:
  - Training code for the feature network
  - Named features with example text
  - Charts of which features fire
  - Steering and removal tests
  - Notes on quality checks
how_to_use:
  - "Have ready: a computer with a GPU that has enough memory for your model, a Hugging Face account if the model or dataset needs one, and a Weights & Biases account if you want run logging. Logging is on in the sample config, so switch it off if you have no account."
  - Use an AI that can run Python code on a computer with a GPU. A chat window alone cannot run this.
  - "Install the tools with pip install sae-lens transformer-lens torch. You need Python 3.10 or newer."
  - Tell your AI the model name, the layer to study and the text dataset to use. If you ran the Model internals inspector, give it that report too, so it studies the layers the report points to (optional).
  - Hugging Face and Weights & Biases accounts are optional. GPU memory needs grow with model size, so start with a small model and a ready-made feature set to check your setup.
  - Start with a ready-made feature set if one exists for your model. Train your own only if none fits.
  - "Check the quality numbers first: dead features, average active features and loss kept."
  - Read the top text for each feature, then test the ones you care about by turning them up or down.
  - Next, look up the features you care about on Neuronpedia, write down what each one seems to mean, and pass the best one to a steering or removal test.
output_sample:
  input:
    - The name of your language model
    - The layer you want to study
    - A text dataset to read activations from
    - A feature index or topic to look at (optional)
  prerequisites:
    - An AI that can run Python code
    - A GPU with enough memory for your model
    - The sae-lens and transformer-lens packages installed
  output:
    - name: Loading and analysis code
      contains: Code that loads a model and a ready-made feature set, then lists the top features for each token.
    - name: Training config and run
      contains: A setup for training your own feature network, with size, sparsity, warm-up and checkpoint settings.
    - name: Quality metrics
      contains: Average active features, share of model loss kept, dead feature share and explained variance, with target ranges.
    - name: Feature analysis
      contains: Code that scores sample texts against one feature to show what makes it fire.
    - name: Feature steering
      contains: Code that adds one feature's direction to the model to see how its writing changes.
    - name: Feature attribution
      contains: A ranked list of features that push the model toward a chosen next word.
    - name: Fixes for common problems
      contains: Settings to try for dead features, weak reconstruction, unclear features and memory errors.
