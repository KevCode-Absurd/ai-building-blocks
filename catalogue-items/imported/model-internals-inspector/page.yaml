thinking: high
thinking_why: Tracing how a model reaches an answer needs careful testing.
new_slug: model-internals-inspector
name: Model internals inspector
summary: "Look inside a GPT-style language model with this model internals inspector. See which layers and attention heads shape one answer, using Python code."
job: research-topics
headline: Model internals inspector
subhead: "Give it a language model and a question. Get a look inside it: which parts pay attention to what, and why. Made for ML researchers who write Python. Bring a GPT-style model name."
explain: |
  A look inside a language model that answers questions like which parts of it attend to which words, and which parts caused a specific answer. You get evidence, not guesses.

  The skill uses TransformerLens, a Python library that puts a hook on every step inside a GPT-style model. It loads the model, runs your prompt, and saves what happened at each layer. Then it can plot attention, trace how a fact moves through the layers, and swap pieces of one run into another to see which part matters. That swap test is called activation patching. It needs Python and is built for research use.
when:
  - You want to see which words a model attends to when it answers.
  - You are tracing why a model gets one prompt right and a near copy wrong.
  - You study circuits, such as how a model copies earlier words.
  - You need to test one change inside a model and see the effect.
not_for:
  - "You have no Python setup or research background: ask a developer or ML researcher to run it, or read the model maker's own notes instead."
  - "You want to train or study sparse autoencoders: use SAELens, a separate Python library, instead of this skill."
  - "You want to look inside a model that is not GPT-style: use nnsight or pyvene, which handle other designs."
you_give:
  - A GPT-style model name that TransformerLens supports. This skill runs only on those models, and gpt2-small is the safe starting point.
  - Two prompts to compare, one right and one wrong (optional)
  - The question about its behavior
  - A Python setup with a GPU for larger models
you_get:
  - Code that loads the model with hooks
  - Attention maps for your prompt
  - Activation patching results
  - A short reading of which layers matter
  - Next experiments to run
how_to_use:
  - Check you have what it needs first. This skill needs Python, and a GPU for larger models. Some research background helps.
  - Open an AI that can run code, or paste the skill into a chat and run the code on your own computer.
  - Give your AI the model name, your prompts and your question about the model.
  - "First run: pick gpt2-small, give it one clean prompt and one changed prompt, and ask it to run the activation patching steps from the skill. Then ask for the attention maps."
  - The Workflow 1 code ends with a matplotlib step that draws the heatmap and saves it as activation_patching.png. Install matplotlib first.
  - Read the heatmap and the table of top layers and heads. Check the caveats before you trust the result.
  - Pick one next experiment and run it to confirm what you found, such as patching single attention heads in the layers that stood out.
  - If one layer stands out, the Language model feature explorer can load or train sparse autoencoder features for it. Bring the model name, the layer and your two prompts.
output_shape: |
  ## Setup
  <model, clean and changed prompts, the metric used>

  ## Activation patching
  <layer by position heatmap, saved as activation_patching.png>

  ## Top layers and heads
  | Rank | Layer | Head or position | Effect on the metric | Method |

  ## Short reading
  <3 to 5 sentences on which parts matter, and how sure it is>

  ## Caveats
  <tokenization, LayerNorm, approximate head scores, memory>

  ## Next experiments
  <one to three tests that would confirm or break the reading>
output_sample:
  input:
    - The name of a GPT-style model
    - A clean prompt and a changed prompt that differ a little (optional)
    - The question you have about how the model behaves
  prerequisites:
    - An AI that can run Python code
    - A GPU for larger models
    - The transformer-lens and torch packages installed
    - A Hugging Face token for gated models such as LLaMA
  output:
    - name: Model loading code
      contains: Python that loads your model with hooks on every step inside it.
    - name: Activation cache
      contains: The saved values from each layer for your prompt, filtered to save memory.
    - name: Activation patching heatmap
      contains: A layer by position grid showing where swapping clean values into the changed run moves the answer.
    - name: Head contribution map
      contains: A score for each attention head showing how much it pushes the answer toward one word over another.
    - name: Induction head scores
      contains: Attention scores that point to heads which repeat a pattern seen earlier in the text.
    - name: Caveats and next steps
      contains: Notes on tokenization, LayerNorm and memory, plus the next tests worth running.
