thinking: medium
thinking_why: It follows known deployment steps with some setup choices.
new_slug: model-launch-engineer
name: Model launch engineer
summary: Turn a trained model into a live service. Give it your model file and get an API, a Docker container and deploy files to host it.
job: ship-and-host
headline: Model launch engineer
subhead: Give it a trained model. Get it running as a live service with an API and container. Bring the trained model file.
explain: |
  A trained model running as a live service that other programs can call, packaged so it starts the same way on any machine.

  The skill saves the model together with its data preparation steps. It builds a web API in FastAPI or Flask with a health check, input checks and clear error messages. A Dockerfile packs it with pinned requirements, keeping training-only tools out. For bigger loads, it writes Kubernetes files with resource limits and automatic scaling, or targets a serverless service. Last, it pushes the image, deploys and sends test requests to confirm it answers. You need Docker and a place to host.
when:
  - Your model works in a notebook and an app now needs to call it.
  - You need a health check so the host can restart the model if it hangs.
  - Traffic is growing and you need it to scale on its own.
  - You want to ship a new model version without breaking the old one.
not_for:
  - "You only need answers from a ready-made AI model: use a hosted model API from a cloud provider instead of building your own service."
  - "You have no trained model file yet: train and test the model first, or ask a data scientist to help."
  - "You want to run it on your own laptop for a quick demo: a notebook or a simple local script is enough."
you_give:
  - Your trained model file, from a source you trust (check its checksum before loading, because some model files can run code when opened)
  - The data preparation code the model needs
  - Where it will run, such as Docker, Kubernetes or serverless
  - Expected traffic and speed needs (optional)
you_get:
  - A model API with input checks
  - A Dockerfile
  - Deployment and scaling files
  - Health check and logging
  - Smoke tests after launch
how_to_use:
  - Open Claude, ChatGPT or Gemini. Use one that can run code and read your files, since this skill writes and tests code.
  - Paste the skill text, then add your model file, your data preparation code and where it will run.
  - Pick where it will be hosted. Docker on a single machine is the simplest. Use Kubernetes if you need several copies of the service, or a serverless service for light, uneven traffic. The Dockerfile and manifests in the skill assume a container, and the Kubernetes files assume a cluster. Tell your AI your choice so it writes the right files.
  - Say how much traffic you expect, if you know.
  - Before you deploy: the Dockerfile and the Kubernetes files in the skill are untested sample code. Build the image and run the smoke test yourself before you rely on them.
  - Check the API code and Dockerfile your AI writes before you build anything.
  - Build the container and deploy it. You need Docker and a hosting account, which may cost money.
  - "Smoke test it: send 3 to 5 inputs you already know the right answer for to /health and /predict. It passes when /health says the model is loaded, and every known input returns the answer you expect. Fix any failed test before real users call the service."
  - Do not expose the API to the internet until it needs an API key or sits on a private network. The sample Kubernetes service is internal-only (ClusterIP), so keep it that way until then.
  - After launch, use the Monitoring and update plan to set alerts and plan your next model release.
  - If a smoke test fails, read the log, fix the cause and rebuild. Release to a small share of users first, and watch the logs before you send everyone to it.
output_sample:
  input:
    - Your trained model file
    - The data preparation code the model needs
    - Where it will run, such as Docker, Kubernetes or a serverless service
    - Expected traffic and speed needs (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Docker installed on your machine
    - A place to host the container, and an account with it (may be paid)
    - A model file from a source you trust
  output:
    - name: app.py
      contains: The web API in FastAPI or Flask, with a health check, input checks and clear error messages.
    - name: requirements.txt
      contains: The pinned list of tools the service needs, without training-only tools.
    - name: Dockerfile
      contains: A container recipe that packs the model and API so it starts the same way anywhere.
    - name: Deployment manifests
      contains: Kubernetes files with resource limits, health probes and automatic scaling, or the setup for a serverless service.
    - name: Smoke test results
      contains: Test requests sent to the live service, with a pass or fail for each known input.
    - name: Monitoring and update plan
      contains: Suggested checks for speed and errors, and a safe way to release new model versions.
