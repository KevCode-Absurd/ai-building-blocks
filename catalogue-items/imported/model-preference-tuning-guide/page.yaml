thinking: high
thinking_why: Choosing the method and data takes careful judgment.
new_slug: model-preference-tuning-guide
name: Model preference tuning guide
summary: Tune a language model to answer your way with DPO, PPO or GRPO. Give it good and bad answer pairs. You get training code and a test against the original.
job: build-software
headline: Model preference tuning guide
subhead: A language model tuned to answer the way you prefer, taught with examples of good and bad answers. You choose the method that fits your data and compute.
explain: |
  A language model tuned to answer the way you prefer, taught with examples of good and bad answers. You choose the method that fits your data and compute.

  The skill uses the TRL library. If you have pairs of preferred and rejected answers, it sets up DPO, the simplest route. If you want the classic path, it walks through three stages: teach basic instructions, train a reward model that scores answers, then tune with PPO. It also covers GRPO for tasks with checkable answers. It adds LoRA to cut memory use and ends by testing the tuned model against the original. This is for developers and technical staff. You need Python and an NVIDIA GPU. The PPO command lines depend on your TRL version, so check them against the TRL docs before you run them.
when:
  - Your model gives answers that are correct but the wrong tone.
  - You have a pile of thumbs up and thumbs down examples.
  - You want a small model to follow your house style.
  - You need to pick between DPO, PPO and GRPO.
not_for:
  - "You only want a better tone from a chat AI: change your prompt instead. No training is needed."
  - "You have no GPU or Python setup: use a hosted fine-tuning service or ask a developer to run the training for you."
  - "You only have prompt and answer pairs, with no good or bad ranking: use plain supervised fine-tuning with the Hugging Face Trainer."
you_give:
  - The name of a base model to tune
  - A JSON or CSV file with a prompt, a chosen answer and a rejected answer on each row
  - A computer with an NVIDIA GPU and Python set up
  - The behavior you want to see (optional)
you_get:
  - Training code for the right method
  - A dataset format checklist
  - LoRA settings to save memory
  - An evaluation against the original
  - Advice on which method suits your data
how_to_use:
  - Open an AI that can run Python code on a computer with an NVIDIA GPU. A plain chat window can only explain the steps.
  - Paste the SKILL.md file into your AI, then name your base model. If your AI takes files, add the references folder too, since the PPO and GRPO details are there.
  - Add your file of prompts with chosen and rejected answers, as JSON or CSV with the columns prompt, chosen and rejected. Ask your AI to check the format first.
  - Ask your AI to pick a method. DPO is the simplest if you have answer pairs.
  - Run the training script. If the GPU runs out of memory, ask for smaller batch sizes or LoRA. The skill's rough memory guide for a 7B model is 16 GB for SFT with LoRA, 24 GB for DPO and 40 GB for PPO, so check what your GPU or rented GPU has before you start.
  - The PPO command in the skill may be out of date. Its script path and options change between TRL versions. Run it with --help first, and if it fails, ask your AI for the PPO example that matches your installed TRL version.
  - Compare the tuned model with the original on the same prompts before you use it. Then test on new prompts the model has not seen, or clean your dataset and run again.
  - When it holds up, deploy or share the saved model folder. For plain prompt and answer pairs with no good or bad ranking, use the Language model trainer instead.
next: [language-model-trainer, model-launch-engineer]
output_sample:
  input:
    - The name of a base model to tune
    - A JSON or CSV file with a prompt, a chosen answer and a rejected answer on each row
    - The tuning method you want, or your data size and GPU memory (optional)
    - The behavior you want to see (optional)
  prerequisites:
    - An AI that can run Python code
    - A computer with an NVIDIA GPU
    - The TRL, Transformers, Datasets, PEFT and Accelerate Python libraries installed
  output:
    - name: Method choice
      contains: Which of SFT, DPO, PPO or GRPO fits your data, and why.
    - name: Dataset format check
      contains: A check that each row has a prompt, a chosen answer and a rejected answer.
    - name: Training script
      contains: Python code or a command line for the method you chose, with settings filled in.
    - name: Memory settings
      contains: Smaller batch sizes, gradient checkpointing and LoRA options if your GPU runs out of memory.
    - name: Saved model folder
      contains: The tuned model, saved to the output folder you named.
    - name: Test against the original
      contains: Answers from the original and tuned model on the same prompts, so you can compare them.
