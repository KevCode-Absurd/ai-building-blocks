thinking: medium
thinking_why: The steps are fixed, but you must check quality after.
new_slug: model-size-reducer
name: Model size reducer
summary: Shrink a large language model to 4-bit with AWQ. Get a smaller copy that fits a smaller GPU and may run faster. Includes speed and quality checks.
job: build-software
headline: Model size reducer
subhead: Give it a large model. Get a 4-bit copy that fits on a smaller GPU. The skill's author reports about 3 times faster answers on recent Nvidia cards, so measure it on yours.
explain: |
  A large language model shrunk to 4-bit so it fits on a smaller GPU. The skill's author reports about three times faster answers and a small loss in quality. Those figures come from the upstream skill, not our tests, so check them on your own model.

  The skill uses AWQ, which looks at how the model behaves on sample text and protects the weights that matter most before shrinking the rest. You can load a ready-made small copy or make your own with a short Python script and a few hundred calibration samples. It compares AWQ with GPTQ and bitsandbytes so you pick the right one, and it covers serving with vLLM. Fast kernels need a recent Nvidia GPU. On an AMD GPU, the skill points to the ExLlamaV2 backend instead.
when:
  - Your model does not fit in your GPU memory.
  - Answers are too slow for a chat product.
  - You want to serve a chat model cheaply with vLLM.
  - You need to decide between AWQ, GPTQ and bitsandbytes.
not_for:
  - "You have no GPU, or an older Nvidia GPU: use GPTQ, which works on older cards, or bitsandbytes, which needs no setup step."
  - "You want to fine-tune the model afterwards: use bitsandbytes with QLoRA instead."
  - "You start a new project and want a tool that is still maintained: use vLLM llm-compressor, or MLX-LM on a Mac with Apple Silicon."
you_give:
  - The model you want to shrink
  - Your GPU type and memory
  - A small set of sample text for calibration (a few hundred short samples that look like what your model will read)
  - The model's exact name and size, and how much memory your GPU has
  - Your speed and quality targets (optional)
you_get:
  - A 4-bit version of the model
  - The script to make it
  - Serving steps for vLLM
  - Before and after speed and quality checks
  - A method comparison
how_to_use:
  - Check you have an Nvidia GPU and an AI that can run Python code. Without code running, you only get the script and steps.
  - Choose your path. To load or test an existing AWQ model, install autoawq and transformers and note the versions you use. AutoAWQ is no longer maintained, so for a new project that you plan to keep running, use vLLM llm-compressor instead.
  - Test first on a small 7B model, or load a ready-made 4-bit model, to confirm your setup works.
  - Ask your AI to make the 4-bit copy of your model with the script. Add your own sample text if your model has a special job.
  - Compare memory, tokens per second and perplexity (a score where lower is better) of the old and new model on the same test text. Check the answers read well before you use it.
  - Serve the result with vLLM if you want to use it in a chat product.
next: [vllm-model-server-setup, model-launch-engineer]
output_sample:
  input:
    - The model you want to shrink
    - Your GPU type and memory
    - A small set of sample text from your own use case (optional)
    - Your speed and quality targets (optional)
  prerequisites:
    - An AI that can run Python code on a computer with an Nvidia GPU
    - The autoawq and transformers packages installed
    - A recent Nvidia GPU for the fastest kernels
  output:
    - name: Install and load steps
      contains: How to install autoawq and load a ready-made 4-bit model to test your setup.
    - name: Quantize script
      contains: A short Python script that shrinks your model to 4-bit and saves it to a folder.
    - name: Saved model folder
      contains: The 4-bit model and its tokenizer, ready to load or serve.
    - name: Method comparison
      contains: How AWQ, GPTQ and bitsandbytes differ in speed, accuracy and setup, and which to pick.
    - name: vLLM serving steps
      contains: How to serve the 4-bit model with vLLM for chat use.
    - name: Before and after table
      contains: Memory, speed in tokens per second and perplexity for the original and the 4-bit copy.
