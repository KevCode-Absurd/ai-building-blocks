terms:
  - term: Learning rate
    meaning: How big a step the model takes each time it learns. Too high and the loss explodes.
  - term: Optimizer
    meaning: The rule that updates the model after each batch, such as AdamW.
  - term: Gradient clipping
    meaning: A cap on update size that stops one bad batch from breaking training.
  - term: Mixed precision
    meaning: Using smaller numbers in places to train faster and use less memory.
  - term: Overfit one batch
    meaning: A test where the model must learn one small batch perfectly. If it cannot, there is a bug.
