thinking: high
thinking_why: Picking settings and finding silent faults takes judgment.
new_slug: model-training-recipe-finder
name: Model training recipe finder
summary: Get starting settings, a PyTorch training loop and a loss troubleshooting checklist for your data and GPU, so you spend less time on trial and error.
job: build-software
headline: Model training recipe finder
subhead: Say what you are training, how much data you have and what hardware you use. It picks a model, sets the optimizer and learning rate, writes a PyTorch training loop and lists fixes for loss that explodes or stalls. You run and test it.
explain: |
  When a model trains badly, the fault is often in the recipe, not the model. This skill gives you a recipe: which model fits your data, which settings to start with, and a training loop that avoids common mistakes. It is a PyTorch model training guide with a fix list for when the loss goes wrong.

  It starts with a table that matches data type and data size to a model. Types covered are images, text, tables, audio, molecules, proteins and medical scans. Then it sets the optimizer, learning rate, warmup, precision and gradient clipping, and sizes the run to your compute budget with the 20-tokens-per-parameter rule.

  The checks come from public sources such as Karpathy's training advice and open code. They are starting points. You still run them on your own data and keep or drop each change. For clinical work, a qualified review is needed first.
when:
  - You are training a model in PyTorch and do not know which settings to start with.
  - Your loss goes to NaN, spikes, or stops improving.
  - You must pick a model size for a fixed GPU budget.
  - You train on proteins, molecules or medical images and want advice for that kind of data.
not_for:
  - Your model is for patient care or other clinical use. These settings are for research and need expert and regulatory review first.
  - You want to fine-tune a chat model on one GPU. Use the LLM fine-tuning guide.
  - You want full training code that loads, splits and checks your data. Use the model training builder.
  - You train in MATLAB. Use the neural network trainer instead.
you_give:
  - What you are training and on what data
  - How many samples or tokens you have
  - Your hardware and time or money budget
  - Where it fails now, such as NaN loss or slow speed (optional)
  - Your current training code (optional)
you_get:
  - A model choice with a reason and a fallback
  - A table of starting settings, each marked as a starting value
  - A PyTorch training loop sized to your setup
  - A loss troubleshooting checklist that fits your symptom
  - Next steps for testing and tracking experiments
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste this skill. If your AI can read files, give it the skill folder so it can load the reference files.
  - Say what you are training, how much data you have, and what GPU and budget you have. Add any error or odd loss curve.
  - Read the settings table. Ask about any setting you do not understand before you copy it.
  - Run the overfit-one-batch test from the checklist first. If it fails, you have a bug, so fix that before a long run.
  - Run a short training and compare the loss to the checklist. Change one thing at a time and write down each result.
  - Your AI cannot train in a chat window. You run the code in Python with PyTorch.
how_it_works:
  - title: Read your setup
    text: It reads the data type, data size, hardware and budget, and marks any missing item.
  - title: Pick the model
    text: It matches data type and size to a model, from pretrained fine-tuning to training from scratch.
  - title: Set the recipe
    text: It sets the optimizer, learning rate, warmup, precision and gradient clipping.
  - title: Write the loop
    text: It writes a PyTorch loop with clipping, mixed precision and a stop when loss explodes.
  - title: Size to your budget
    text: It uses scaling rules to match model size and data to your compute.
  - title: Build the checklist
    text: It picks the loss, speed and silent-failure checks that match what you are seeing.
