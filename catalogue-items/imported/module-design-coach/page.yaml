thinking: high
thinking_why: Good design needs weighing trade-offs across the code.
new_slug: module-design-coach
name: Module design coach
summary: "Get a module design review for the code you want to improve: a simpler interface, a clear seam and a test plan. Names the part, you get the fix."
job: build-software
headline: Module design coach
subhead: A simpler design for the part of your code you want to improve, with clear edges that make it easier to test. The goal is a lot of behavior behind a small, plain interface.
explain: |
  A simpler design for the part of your code you want to improve, with clear edges that make it easier to test. The goal is a lot of behavior behind a small, plain interface.

  The skill teaches a fixed set of words and uses them throughout: module, interface, depth, seam and adapter. It asks what a caller must know to use a piece correctly, including order of calls, errors and settings. If that list is long compared to what the piece does, the module is shallow. It then suggests where to draw the seam, what to hide, and how to test through the interface instead of through the internals.
when:
  - A piece of code needs too much explanation before anyone can use it.
  - Tests break every time you rename something inside.
  - You want to split a messy file but do not know where the line goes.
  - You are reviewing a design before it is built.
not_for:
  - "You have one small function with no reuse: a plain code review or a quick refactor is enough."
  - "You only want bugs found or style fixed in a file: ask your AI for a normal code review."
  - "You want to build a new feature from scratch: write the plan first, then come back to check the design."
you_give:
  - The code or area you want to improve
  - What callers need from it
  - Pain points, such as hard to test or hard to change
  - Language and framework (optional)
you_get:
  - A shallow or deep rating with reasons
  - A proposed interface
  - Where to place the seam
  - What to hide inside
  - A testing approach through the interface
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text from this page.
  - Paste the code you want to improve. If your AI can read files, point it at the right folder instead.
  - Say what callers need from it and what hurts, such as hard to test or hard to change.
  - Read the depth rating first. Check that the proposed interface is smaller than the one you have.
  - Ask your AI to show the seam and the test approach for the new design.
  - No code running or paid tool is needed.
output_sample:
  input:
    - The code or area you want to improve
    - What callers need from it
    - Pain points, such as hard to test or hard to change
    - Your language and framework (optional)
  prerequisites:
    - An AI that can read your project files, or code you can paste into the chat
  output:
    - name: Depth rating
      contains: Whether the module is deep or shallow, with the reasons, using the deletion test.
    - name: Proposed interface
      contains: A smaller set of methods and parameters that callers need to learn.
    - name: Seam location
      contains: Where the interface should live, and whether something really varies across it.
    - name: Hidden internals
      contains: What moves behind the interface so callers no longer need to know it.
    - name: Testing approach
      contains: How to test through the interface, with dependencies passed in and results returned.
