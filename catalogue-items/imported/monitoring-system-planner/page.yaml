thinking: high
thinking_why: It designs several linked systems for a real service.
new_slug: monitoring-system-planner
name: Monitoring system planner
summary: Describe your service. Get a plan for metrics, logs, traces, SLOs and
  alerts that you can build step by step.
job: ship-and-host
headline: Monitoring system planner
subhead: "A step-by-step plan for watching your production system: what to
  measure, what to log, how to trace requests and when to alert. You can build
  it in small pieces."
explain: |
  The plan starts with the main things your users do and what reliability each needs. Then it picks signals and sets how long data is kept. It builds the smallest set of dashboards and alerts that support your targets, each with an owner, a runbook and a rule for missing data. It checks that counts and totals line up, tests one alert in a safe environment, and measures noise before rolling out. It keeps private data, such as passwords and full request bodies, out of the logs.
when:
  - You are setting up monitoring for the first time.
  - Releases keep causing slowdowns and you cannot say why.
  - You need to agree on reliability targets with your team.
  - You want a privacy check on what your logs capture.
you_give:
  - The services and user tasks that matter most
  - Reliability goals
  - Your current alerts and how noisy they are
  - Tools in use, such as Prometheus or Grafana
  - Data you must not log
you_get:
  - A list of signals to collect
  - A phased build plan
  - Dashboards and alerts with owners
  - Runbook outlines
  - A log privacy list
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste
    the instructions into a chat.
  - "Gather first: your service names, the main things users do in each one, the alerts you have now and how often they fire with no real problem, your monitoring tools, and the data you must never log."
  - Ask your AI to follow this skill, and paste those details in.
  - "It builds the plan in four steps, each from the one before: a list of user tasks with a reliability target for each, then a list of signals with how long to keep each, then a table of dashboards and alerts with owner, runbook and missing-data columns, then a test of one alert and a count of false alarms before rollout."
not_for:
  - "You only need reliability targets and an error budget. Use the Reliability target setter."
  - "You want a ready Grafana dashboard and alert config from scripts. Use the Monitoring planner."
  - "You are watching an AI agent or an AI app. Use the AI agent monitoring planner."
  - "You cannot get at any metrics, logs or traces yet. Set up the data first, then plan."
next: [monitoring-planner, reliability-target-setter]
output_sample:
  input:
    - The services and user tasks that matter most
    - The reliability each task needs
    - The monitoring tools you already use, such as Prometheus or Grafana (optional)
    - Data you must never log, such as passwords or full request bodies
  prerequisites:
    - Access to your metrics, logs or traces, or a person who has it
    - A safe test environment where you may trigger one alert
    - "Optional: monitoring tools it names, such as Datadog, New Relic, PagerDuty and Splunk, which are usually paid"
  output:
    - name: Key user tasks and targets
      contains: The tasks to protect and how reliable each must be.
    - name: Signals and retention
      contains: What to measure, log and trace, and how long to keep each kind of data.
    - name: Dashboards and alerts
      contains: The smallest set that supports your targets, each with an owner, a runbook and a missing-data rule.
    - name: Alert checks
      contains: How to confirm counts and totals match, test one alert, and measure noise before rollout.
    - name: Log privacy list
      contains: The only fields allowed in telemetry, with passwords, prompts and full bodies kept out.
    - name: Phased build plan
      contains: Small pieces you can build one at a time.
