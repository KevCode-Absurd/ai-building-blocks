thinking: high
thinking_why: It weighs several architectures against your needs.
new_slug: multi-agent-system-planner
name: Multi-agent system planner
summary: "Plan a multi-agent system: describe your job and get a supervisor, swarm or layered design, with the trade-offs and a handoff plan."
job: build-software
headline: Multi-agent system planner
subhead: A choice of design for a team of AI agents, with the trade-offs laid out so you pick the one that fits your job. It also tells you when one agent is enough.
explain: |
  The main point is that extra agents are for splitting up the context, not for playing office roles. The skill compares three patterns: a supervisor who directs workers, a swarm that hands work sideways, and layers of managers. For each it names where it breaks: bottlenecks, drift between agents and errors that spread. It adds ways to get agreement without flattery, then recommends one design with a handoff protocol.

  Three terms it uses. Context isolation means each agent only holds the information its own part needs. The telephone game is when a supervisor re-words what a worker said and loses detail. Sycophancy is when agents just agree with each other instead of checking.

  Unverified figures: the skill file quotes a few numbers from its original author, about what drives results and what multi-agent setups cost. They have no source link, and AI Blocks does not stand behind them. Do not quote them unless you find the source.
when:
  - One agent runs out of room and loses track of earlier work.
  - Your job splits into parts that need different tools.
  - You are deciding between a supervisor and a swarm.
  - Your multi-agent test produced duplicate work and confusion.
not_for:
  - "Your job fits in one chat without losing track: use one agent, and split the work into steps by hand."
  - "You need working code for a multi-agent system: ask a developer or a coding assistant to build it from this plan."
  - "You only need to write one prompt for one task: write a clear prompt yourself, no design needed."
you_give:
  - A description of the job
  - The tools each part needs
  - Size of the inputs, such as documents or code
  - Speed and cost limits (optional)
you_get:
  - A recommended pattern with reasons
  - A comparison of all three
  - A handoff design
  - Failure risks and fixes
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat. No code or paid tool is needed.
  - Describe your job in a few lines. Say what the finished work should look like.
  - List the tools each part needs and how big the inputs are. Add speed and cost limits if you have them.
  - Ask your AI to plan the system with this skill.
  - Read the answer. Check first whether it says one agent is enough for your job.
  - Pick the pattern, then copy the handoff protocol into your build notes.
  - Next, give the plan and handoff protocol to the developer or coding assistant who will build the system. Ask them to build one agent and one handoff first, and test it before adding more.
output_sample:
  input:
    - A description of the job you want agents to do
    - The tools each part of the job needs
    - How big the inputs are, such as documents or code
    - Speed and cost limits (optional)
  output:
    - name: Recommended pattern
      contains: The one design that fits your job, with the reasons it beats the other two.
    - name: Pattern comparison
      contains: Supervisor, swarm and layered designs side by side, with where each one tends to break.
    - name: Context isolation plan
      contains: How to split the work so each agent holds only what its own part needs.
    - name: Handoff protocol
      contains: What each agent passes on, and how agents agree without just flattering each other.
    - name: Failure risks and fixes
      contains: Likely problems such as bottlenecks, drift between agents and spreading errors, each with a fix.
