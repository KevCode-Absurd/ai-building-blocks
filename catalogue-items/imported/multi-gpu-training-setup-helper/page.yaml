thinking_why: The change is small and follows a known pattern.
new_slug: multi-gpu-training-setup-helper
name: Multi-GPU training setup helper
summary: Give it your PyTorch training script. Get a multi-GPU training setup with the few added lines, a launch command and a config for your hardware.
job: build-software
headline: Multi-GPU training setup helper
subhead: Your training script running on one GPU, several GPUs or several machines, with only a handful of added lines. The same script works in all three setups.
explain: |
  Your training script running on one GPU, several GPUs or several machines, with only a handful of added lines. The same script works in all three setups.

  The skill uses Hugging Face Accelerate. You create one Accelerator object, pass your model, optimizer and data loader through its prepare call, and swap the usual backward call for the Accelerate one. You can delete the lines that move data to the GPU by hand. Then one launch command runs it. The skill also covers answering a few setup questions to make a config file, and the options for splitting memory across GPUs for big models.
when:
  - Your script runs on one GPU and you just got four.
  - You want to try mixed precision without rewriting the loop.
  - Training must run across two machines.
  - Your model is too big for one GPU's memory.
not_for:
  - Your script runs on one GPU with no speed or memory problem. Leave it as it is.
  - You need callbacks and high-level training tools. Use PyTorch Lightning instead.
  - You need to manage many machines or tune settings across runs. Use Ray Train instead.
you_give:
  - Your PyTorch training script
  - How many GPUs and machines you have
  - Whether the model fits on one GPU
  - Precision preference (optional)
you_get:
  - The script with the added lines marked
  - A launch command
  - A config file for your setup
  - Memory-saving options for large models
how_to_use:
  - Gather first the exact script file, the number of GPUs and machines, and whether the model fits on one GPU.
  - Paste your training script into Claude, ChatGPT or Gemini.
  - Say how many GPUs and machines you have, and whether the model fits on one GPU.
  - Add your precision choice if you have one (optional).
  - Ask your AI to add the Accelerate lines, mark them, and give you a launch command and a config.
  - Check that the old lines moving data to the GPU are gone.
  - Run the script on your own machines. Your AI can only test it if it can run Python code.
  - Next, run a short test on one GPU first. Then scale to all your GPUs, and compare speed and loss with the one-GPU run.
  - The skill is an imported copy under the MIT licence. It was written for Hugging Face Accelerate 1.11.0 or newer, so check your version.
output_sample:
  input:
    - Your PyTorch training script
    - How many GPUs and machines you have
    - Whether the model fits on one GPU
    - Your precision choice (optional)
  prerequisites:
    - An AI that can run Python code, if you want it to test the script
    - The accelerate, torch and transformers packages installed
    - DeepSpeed installed with pip, only if you pick DeepSpeed
    - PyTorch 1.12 or newer, only if you pick FSDP
  output:
    - name: Marked script
      contains: Your script with the added Accelerate lines marked and the manual move-to-GPU lines removed.
    - name: Launch command
      contains: One command to run the script on one GPU, many GPUs or several machines.
    - name: Config file
      contains: "Answers to the setup questions: machine type, machine count, precision and whether to use DeepSpeed."
    - name: Memory option notes
      contains: Choices such as DeepSpeed ZeRO or FSDP for models too big for one GPU.
