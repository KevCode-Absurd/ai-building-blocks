thinking: low
thinking_why: It sends your saved prompt to an image service and saves the result.
new_slug: multi-provider-image-maker
name: Multi-provider image maker
summary: Make images from a prompt with one image maker that works with many services. Pick the service and size, and get a saved image file.
job: make-images
headline: Multi-provider image maker
subhead: An image made by the image service you choose, in the size you pick, from a single prompt. The same prompt and size settings work across services, though each service has its own limits.
explain: |
  The skill runs a script that connects to many services, including OpenAI, Google, Azure, Replicate, Alibaba, MiniMax and Seedream. On first use it asks you to save your preferences: default service, model and size. Then it takes your prompt, asks for the service, model, quality and image shape, and calls the service with your own API key. Batches are possible, so you can run many prompts together. It needs Bun or Node to run and an API key for the service you pick. Each image is billed to your own account, so check that service's pricing first.

  One route works differently. The codex-cli option uses your logged-in Codex or ChatGPT subscription instead of an API key, and it is only used if you pick it. Check that your subscription's terms allow this kind of use before you rely on it, and never paste a Codex sign-in token where an OpenAI API key should go.
when:
  - You want to try the same prompt on two image services.
  - You need a batch of images in one size for a campaign.
  - Your usual service is down and you want a backup.
  - You want one command for all your image work.
not_for:
  - "You want to edit an existing photo or video: use your design tool or a photo editor instead."
  - "You need one quick mockup: use the image feature built into your AI chat or design tool."
  - "You cannot run code or get an API key for an image service: use your AI chat's own image feature."
you_give:
  - Your image prompt, typed or saved in a file
  - The image service you want to use
  - The size or shape of the image
  - An API key for that service (the service bills you for each image, so check its pricing first)
  - A reference image (optional)
you_get:
  - The generated image saved as a file
  - Your saved defaults for next time
  - Batch output for many prompts
  - Messages when a setting is missing
how_to_use:
  - Open an AI that can run code on your computer, such as Claude Code or Codex. A plain chat window cannot run the script.
  - Make sure Bun is installed. If not, your AI can run it with npx instead.
  - "Add the skill folder and say: Make an image with the image maker skill. Give your prompt, service and size."
  - On the first run, answer the setup questions. Your default service, model and size are saved for next time.
  - Add your API key for the service when asked, or set it as an environment variable first.
  - Open the image file at the path in the reply. For many images, give a batch file (a list of prompts and file names) and the number of jobs (how many images to make at the same time). A higher number is faster but sends more paid requests at once.
  - Next, open the saved file and check the image. Rerun with another service or size to compare, or give it a batch file to make many images at once. Before you drop an image into a post, deck or ad, check the service's licence terms and that it fits your brand.
terms:
  - term: EXTEND.md
    meaning: A small file where the skill saves your default service, model and size.
  - term: Batch file
    meaning: A list of prompts and file names, so the skill can make many images in one run.
  - term: Number of jobs
    meaning: How many images the skill makes at the same time in a batch.
output_sample:
  input:
    - Your image prompt, typed or saved in a file
    - The image service you want to use
    - The size or shape of the image
    - An API key for that service
    - A reference image (optional)
  prerequisites:
    - An AI that can run code, with Bun or Node installed
    - An account and API key for the image service you choose
    - A saved preferences file, which the skill sets up on first run
  output:
    - name: Preferences file (EXTEND.md)
      contains: A small file that keeps your default service, model and size, saved on first run and reused next time.
    - name: Image file
      contains: The picture made from your prompt, saved at the file path you give with --image.
    - name: Reply message
      contains: The saved file path and the service and size used, or a note about a missing setting. If the file path is missing, the image was not saved, so check the note and run it again.
    - name: Batch file (optional)
      contains: A list of prompts and file names, built from an outline and a prompts folder.
    - name: Batch images (optional)
      contains: One saved image per prompt in the batch, made in parallel with the number of jobs you set.
