thinking: high
thinking_why: It must split work into tasks with proof of done.
new_slug: multi-session-build-plan-writer
name: Multi-session build plan writer
summary: Turn a big build request into a plan stored in your repo, so a fresh AI agent can resume a multi-session build and prove each task is done.
job: build-software
headline: Multi-session build plan writer
subhead: A plan stored in your repo that any fresh agent can pick up and finish, so a big build does not die when a chat ends.
explain: |
  A plan stored in your repo that any fresh agent can pick up and finish, so a big build does not die when a chat ends.

  The skill splits what stays fixed from what changes. A contract file holds the goal, scope, tasks and the definition of done. A task file tracks status and links to evidence. A checkpoint file records the exact point to resume from. It reuses documents that already exist in your project and keeps your unrelated changes safe. A task counts as done only when there is proof, such as a passing test or a working screen. It skips this for small jobs.
when:
  - A build will take several sessions or several agents.
  - An agent said it was finished and nothing actually worked.
  - You switch tools or branches and lose track of progress.
  - You need a clean handoff to a teammate.
not_for:
  - "You can finish and check the job in one chat: skip the plan and just ask your AI to do it."
  - "Your goals are still unclear: settle what you want first with a short written brief, then come back."
  - "You only want a task list, with no proof or resume point: ask your AI for a simple checklist instead."
you_give:
  - The build request
  - Your repo
  - Existing plan or task files (optional)
  - What proof counts as done
you_get:
  - A contract file with the goal, scope, tasks and what done means.
  - A task tracker that shows status and links to proof.
  - A checkpoint file with the exact place to resume.
  - A decisions file and a validation log, kept when the work is large enough to need them.
  - Rules that count a task as done only with proof.
how_to_use:
  - Open your AI tool in a chat that can read and write your project files, such as Claude Code, Cursor or Codex.
  - Paste the skill text, then paste your build request. Add any plan or task files you already have.
  - Say what proof counts as done for this build, such as a passing test or a working screen.
  - Check the contract it writes. Fix the scope and tasks before any building starts.
  - After each work session, ask your AI to update the tasks, validation log and checkpoint.
  - "To resume, start a new chat, paste the skill, and say: read the contract and checkpoint, then do the next exact action."
output_sample:
  input:
    - Your build request, in plain words
    - Access to your repo, so your AI can read and write files
    - Existing plan, goal or task files (optional)
    - What proof counts as done, such as a passing test or a working screen
  prerequisites:
    - An AI that can read and write files in your project
  output:
    - name: IMPLEMENTATION_CONTRACT.md
      contains: The goal, scope, exclusions, tasks with stable IDs, acceptance rules and the final definition of done.
    - name: TASKS.md
      contains: The status of each task and subtask, what it depends on, and links to proof.
    - name: CHECKPOINT.md
      contains: The branch, the active task, work in progress, blockers, and the one exact next action.
    - name: DECISIONS.md
      contains: Choices that limit later work, with the options considered and the reasons.
    - name: VALIDATION.md
      contains: Each check that was run, its exact command or steps, the result, and any open gates.
