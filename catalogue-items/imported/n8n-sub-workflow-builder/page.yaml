thinking: medium
thinking_why: It splits a workflow by set rules and wires the parts.
new_slug: n8n-sub-workflow-builder
name: n8n sub-workflow builder
summary: Split a long n8n workflow into small sub-workflows with named inputs. Your parent flow gets shorter and your agents can call each piece.
job: connect-tools
headline: n8n sub-workflow builder
subhead: A long n8n workflow split into small, reusable pieces. Each piece has named inputs and a clear output, like a function, so you fix a bug once instead of in five copies.
explain: |
  A long n8n workflow split into small, reusable pieces. Each piece has named inputs and a clear output, like a function, so you fix a bug once instead of in five copies.

  The skill first searches your existing workflows for something that already does the job. If nothing fits, it builds a new sub-workflow with an Execute Workflow Trigger that lists its inputs, and a last node that returns the result. It then shows how to call it, choosing between running once for all items or once per item, and between waiting for the answer or firing and moving on. Names are chosen so others can find it later, and agents can use it as a tool.

  This is a copy of a skill by Romuald Czlonkowski (github.com/czlonkowski/n8n-skills), shared through sickn33's collection.

  The licence that applies to this copy is CC BY 4.0, as the LICENSE-CONTENT file in this item says. The MIT line in the skill file is the author's own header. Keep the credit to Romuald Czlonkowski and sickn33 if you reuse it.
when:
  - The same date-cleaning steps are copied across four workflows.
  - One workflow has grown so large that nobody wants to edit it.
  - You want an AI agent to call a workflow as a tool.
  - A teammate keeps rebuilding something you already made.
not_for:
  - "You need a brand new n8n workflow from scratch: ask your AI to build it in n8n first, then come back to split it."
  - "Your logic is used once and is short: leave it in the parent workflow, since a sub-workflow adds a step with no gain."
  - "You only want to fix a broken node or a failing credential: debug that node directly in n8n or ask a teammate who owns the workflow."
you_give:
  - The workflow or steps to split out
  - A list of your existing workflows (optional)
  - What the piece should accept and return
  - Whether the caller should wait for it
you_get:
  - A sub-workflow with a clear input and output
  - The right call settings in the parent
  - A findable name
  - A parent workflow that is shorter and simpler
how_to_use:
  - Connect the n8n MCP tools to your AI first. Check this setup before anything else. The first call your AI makes is n8n_list_workflows, so if it cannot list your workflows, the connection is not working. This needs an n8n instance you can reach (n8n Cloud is paid, or you can host it yourself) with API access turned on. This skill works best when your AI can read and create workflows in n8n.
  - Paste the skill instructions into your AI, or upload the skill folder if your tool takes files.
  - Paste the long workflow or the steps to split out. Add what the piece should accept and return, and whether the caller should wait.
  - Let your AI list your existing workflows. Check that it reuses one if a good match exists.
  - Read the plan before it builds. Approve anything that sends, writes, deletes or costs money.
  - "If it fails: if there is no MCP connection, or no workflow list comes back, fix the connection and retry from the first call. If the sub-workflow call errors, check the input names match and run the parent again."
  - Open the parent in n8n and run it once with test data to check the call settings. To let an AI agent call the new piece as a tool, use the n8n AI agent builder next. To tidy the parent flow, use the n8n workflow designer.
output_sample:
  input:
    - The long n8n workflow, or the steps you want to split out
    - A list of your existing workflows (optional)
    - What the new piece should accept and return
    - Whether the caller should wait for the answer
  prerequisites:
    - An AI that can use the n8n MCP tools, connected to your n8n
    - Permission to read your workflow list, and to create workflows in n8n
  output:
    - name: Existing workflow check
      contains: A search of your workflow names, with any sub-workflow that already does the job and will be reused.
    - name: Split decision
      contains: Which steps become a sub-workflow and which stay in the parent, with a short reason.
    - name: Execute Workflow Trigger inputs
      contains: The named, typed input fields the sub-workflow accepts, so callers and agents know what to send.
    - name: Return node
      contains: A final step that shapes the result so every caller gets the same clear output.
    - name: Parent call settings
      contains: "How the parent calls it: once for all items or once per item, and wait or not wait."
    - name: Discoverable name
      contains: A verb-first name and short description so others find the sub-workflow instead of rebuilding it.
    - name: Agent tool setup
      contains: How an AI agent can call the sub-workflow as a tool, when you ask for that.
