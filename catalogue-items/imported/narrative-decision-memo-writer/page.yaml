thinking: high
thinking_why: It follows a set method with a few checks.
new_slug: narrative-decision-memo-writer
name: Narrative decision memo writer
summary: Turn a decision and your evidence into a clear memo with options, costs, risks and a review plan, as a decision narrative, a PR/FAQ or a short brief.
job: document-work
headline: Narrative decision memo writer
explain: |
  It routes your request to one of three forms. A decision narrative fits a strategy, spending or staffing choice. A PR/FAQ fits a new product or service, written backwards from the customer's gain to the hard questions. A short brief fits a narrow question with little context. It adds the one sentence on why it chose that form. This copy is under the MIT licence (the LICENSE.md file in this item), written by Magnus Hedemark.
subhead: Share the decision, the reader, your evidence and your limits. The skill picks a short brief, a full narrative or a future-product question document. You get connected prose that keeps choices, costs, risks and gaps in view. It is adapted from a public MIT-licensed source on Amazon-style writing, not official Amazon templates.
not_for:
  - "You need an architecture decision record or an incident write-up: use the Decision record writer for an architecture decision, or the Incident postmortem writer for an outage."
  - "You need setup steps, runbooks or instructions: use the Incident runbook writer or the Developer docs writer, or write the steps as a plain checklist."
  - "You still do not know if customers want it: do the problem and demand research first, because a polished memo cannot supply missing evidence."
you_give:
  - The reader and the person who will decide.
  - The decision to make and the deadline.
  - Your evidence, with where it came from.
  - The options, including doing nothing.
  - Known costs and limits (optional).
  - Your own draft to revise (optional).
you_get:
  - A decision memo or short brief in connected prose.
  - A one-sentence reason for the form it chose.
  - A list of assumptions and evidence gaps.
  - A small test with an owner and review date, when evidence is thin.
  - A review plan with the decision owner and the questions to settle.
  - "Sections you can expect: summary, options, costs, risks, gaps and review plan."
how_it_works:
  - title: Choose the right form
    text: Respect the requested document and reader. Use only the structure and length the decision needs.
  - title: Build the argument
    text: Compare real alternatives, the current baseline, costs, risks, assumptions, and what evidence could change the call.
  - title: Revise for the reader
    text: Improve the reasoning and connected prose. Keep important limits in the main text and preserve the writer's voice.
  - title: Plan review and closure
    text: Name the decision owner and review questions. Do not claim approval, sending, or an exact page count without evidence.
works_best_with:
  tools:
    - name: A chat AI that can read the bundled reference files
      why: Use the supplied references and templates for the chosen task. Scripts are optional unless that task specifically needs them.
how_to_use:
  - Download the skill folder. Your AI needs to read its reference and template files. Or paste the instructions into a chat.
  - Tell your AI the reader, the decision owner and the deadline. A good first message puts it all in one go, for example "Memo for the leadership team. Owner is the head of operations. Decision needed by Friday. Should we move support to a new help desk tool? My evidence is below."
  - Paste your evidence and options. Say which are facts and which are guesses.
  - Read the form choice first. Ask for a different form if it misses.
  - Check the gaps list. Fill what you can, or keep the proposed test.
  - Ask for the review plan, then send the memo yourself. The skill does not send or schedule anything.
  - Once the decision is made, file the memo where your team keeps decisions, and put the review date from the plan in your calendar. If the decision is later reversed, add a short note to the memo saying what changed and why.
output_sample:
  input:
    - The reader and the decision owner
    - The decision to make, and the deadline
    - Your evidence, with sources and dates
    - The options you see, including doing nothing
    - Known costs and limits (optional)
  prerequisites:
    - A chat AI that can read the skill's reference and template files
  output:
    - name: Form choice
      contains: "One sentence on which form fits: short decision brief, decision narrative, or PR/FAQ, and why."
    - name: Memo or brief
      contains: "The problem, the baseline, the options, the proposal, costs and risks, written as connected prose. Parts by form: the decision narrative has all of these plus next checkpoint and evidence appendix; the PR/FAQ has a future press release, customer FAQ and internal FAQ; the short brief has ask and owner, context, options, recommendation and next step."
    - name: Assumptions and evidence gaps
      contains: What is fact, what is assumed, and what is missing, with how each gap affects the decision.
    - name: Test or checkpoint
      contains: When evidence is thin, a small proposed test with scope, owner, review date and what to inspect.
    - name: Review plan
      contains: The decision owner, how the memo will be read, the questions to settle, and where the outcome is kept.
    - name: Revision notes
      contains: For a revision, a short list of what changed in the reasoning and why.
when:
  - You must ask a leader to choose between two or more options.
  - You have notes and data but no clear written case.
  - A draft memo reads flat or mechanical and needs better reasoning.
  - You want a plan for how a team will read and decide on it.
