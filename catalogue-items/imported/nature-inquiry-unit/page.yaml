thinking: medium
thinking_why: It links what students can observe to the curriculum.
new_slug: nature-inquiry-unit
name: Local nature inquiry unit planner
summary: Name a nearby garden, pond or hedge. Get a unit that teaches your
  science or geography goals through it.
job: teach-and-train
headline: Local nature inquiry unit planner
subhead: Name a nearby garden, pond or hedge. Get a unit that teaches your
  science or geography goals through it.
explain: |
  A science or geography unit built around one living place near your school, such as a garden, a pond, a hedgerow or a patch of waste ground. Pupils study the real thing, and your curriculum goals get covered along the way.

  You give the place and the learning goals. The skill shapes a central question, then plans hands-on investigations that meet each goal. It uses ideas from place-based teaching: start with wonder and local contact, not worry about big problems, and let pupils find things out first hand. It can scale from one lesson to a year, and suggests local experts such as gardeners or park rangers who could visit or advise.
when:
  - You must teach a science topic and want it rooted in something pupils can
    visit.
  - Your school has a small garden or pond and no plan to use it.
  - You want pupils to ask their own questions about nature.
  - You have only a week and need a tight outdoor unit.
you_give:
  - The local place or living system
  - The curriculum goals to cover
  - Year group (optional)
  - Time frame (optional)
  - Outdoor space and local experts available (optional)
  - Gather first the goal wording from your curriculum, the outdoor space you have and a rough time frame
you_get:
  - A central inquiry question
  - Investigations tied to each goal
  - A timeline for your chosen length
  - Ideas for local experts and visits
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text, or upload the skill folder.
  - Give it the local place, the curriculum goals and the year group. Add the time frame and any outdoor space or local experts.
  - Ask for the unit in four phases. They are meeting the place, investigating, understanding and stewardship.
  - Read the central question first, then check each investigation against your goals.
  - Adjust the timeline to your term. Next, plan the longer cycle with the local nature inquiry cycle planner.
next:
  - nature-inquiry-cycle
not_for:
  - "You want a term-long cycle for children aged 5 to 12 with set stages. Use the Local nature inquiry cycle planner."
  - "Your goal is a calmer classroom with plants and light. Use the Classroom nature layout planner."
  - "You want a project that keeps going after your class moves on. Use the Plan a nature project that can continue workflow."
output_sample:
  input:
    - The local place, such as a pond, a hedge, a tree or a garden bed
    - The curriculum goal you must teach
    - Year group (optional)
    - How long you have (optional)
    - Outdoor space and local experts who could help (optional)
  output:
    - name: Driving question
      contains: One question from the place that also meets your curriculum goal.
    - name: Why this place
      contains: What this place can teach that a textbook cannot.
    - name: Inquiry design
      contains: Four phases, which are meeting the place, investigating, understanding and giving back.
    - name: Investigation Activities
      contains: What pupils do, what they record and which tools they use.
    - name: Curriculum Connections
      contains: How each goal is met through what pupils find in the place.
    - name: Ecological Literacy Outcomes
      contains: What pupils learn about how living systems work.
    - name: Stewardship Plan
      contains: Actions pupils take to care for the place, based on what they found.
