thinking: medium
thinking_why: It checks a set list of known trouble spots.
new_slug: nda-quick-checker
name: NDA quick checker
summary: Check an NDA before you sign. Get a green, yellow or red rating, the odd clauses and a next step. A screening aid, not legal advice.
job: check-contracts
headline: NDA quick checker
subhead: Give it an NDA. Get a green, yellow or red rating and the odd clauses. Have a lawyer check yellow or red. Bring the NDA as a file, link or pasted text. Use the result to plan your next step.
explain: |
  A traffic-light rating for an NDA someone else sent you, so you know in minutes whether you can sign, need a second look, or must send it to a lawyer.

  The skill checks the agreement against a screening list. It looks at whether it is one-way or mutual, how broadly it defines confidential information, how long it lasts and whether the usual exceptions are there, such as public information and independently built work. It also flags unusual terms like non-compete clauses, non-solicitation or a residuals clause. If you have no company rules, it uses common market defaults and tells you so. Yellow or red results should be checked by a lawyer.
when:
  - A prospect sends their own NDA and you need a fast first read.
  - Your team gets many NDAs and wants to sort the simple ones.
  - You want to spot odd clauses before sending it to counsel.
  - You are not sure if the term length is normal.
not_for:
  - "The NDA is part of a larger contract: send the whole contract to a lawyer."
  - "You need a signed legal opinion: ask a lawyer, because this tool only screens."
  - "You need the NDA redrafted or negotiated: ask a lawyer to mark it up."
  - "You want odd clauses quoted with their plain meaning and changes to ask for: use the NDA traffic-light checker."
you_give:
  - The NDA as a file, link or pasted text
  - Your own NDA rules (optional)
  - Which side you are on (optional)
you_get:
  - A green, yellow or red rating
  - A list of clauses that look unusual
  - Gaps against the standard checklist
  - A suggested next step
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. Skip the CONNECTORS.md and legal.local.md notes in it. You do not need them.
  - Paste the NDA text after the skill, or upload the file. A link only works if your AI can open it. (The "@$1" in the skill is a Claude Code shortcut. In a chat, ignore it.)
  - Add your own NDA rules and say which side you are on (optional). Without rules, it uses common market defaults and tells you so.
  - Read the rating first, then the issues list.
  - Green means standard terms. For yellow or red, send the NDA and the report to a lawyer.
  - This is an imported Anthropic skill under the Apache-2.0 licence, and its original name is triage-nda. It is a screening aid and not legal advice.
output_sample:
  input:
    - The NDA as a file, link or pasted text
    - Your own NDA rules (optional)
    - Which side you are on (optional)
  output:
    - name: Classification
      contains: A green, yellow or red rating that says if you can sign, need counsel, or need a full legal review.
    - name: Summary details
      contains: The parties, NDA type, term, governing law, and whether your rules or standard defaults were used.
    - name: Screening Results
      contains: A table that marks each check as pass, flag or fail, with a short note.
    - name: Issues Found
      contains: Each problem clause marked yellow or red, with why it matters and a suggested fix.
    - name: Recommendation
      contains: A plain call on whether to sign, send to counsel, or push back.
    - name: Next Steps
      contains: What to do now, including who should review the NDA.
