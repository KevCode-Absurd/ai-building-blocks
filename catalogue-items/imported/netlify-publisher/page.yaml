thinking: low
thinking_why: It follows a set deploy path.
new_slug: netlify-publisher
name: Netlify publisher
summary: Publish your website on Netlify as a preview or live deploy. Give it your project folder and get the link back, with login and build settings checked.
job: ship-and-host
headline: Netlify publisher
subhead: Your website on a live Netlify address, with the link handed back. You can publish a private preview to check first or push straight to the public site.
explain: |
  Your website on a live Netlify address, with the link handed back. You can publish a private preview to check first or push straight to the public site.

  The skill checks that the Netlify tool is signed in, and walks you through login if it is not. It looks at your project folder to find the framework and build settings. It then links the folder to an existing Netlify site or creates a new one. Finally it deploys, as a preview or production, and waits for the build, which can take a few minutes. It runs through the Netlify command line on your computer and needs a free Netlify account.
when:
  - You built a site locally and want it online today.
  - You want a preview link to show someone before going public.
  - You are not sure which build settings Netlify needs.
  - You want to update a live site after a change.
not_for:
  - "You need a database or a server that runs all the time: use a host built for that, such as a cloud server service."
  - "You want a free page for plain files with no build step: use GitHub Pages instead."
  - "You want a site that stays private: Netlify preview links are not private. Site password protection may need a paid Netlify plan, so check your plan, or use a host with built-in private access."
you_give:
  - Your web project folder
  - A Netlify account
  - Preview or production choice
  - An existing Netlify site to link (optional)
you_get:
  - A confirmed login check
  - Detected framework and build settings
  - A deployed site
  - The preview or live link
how_to_use:
  - Open your AI tool on your computer, one that can run commands and see your project folder. A plain chat window cannot do this.
  - Paste in this skill and say which folder holds your site.
  - Choose preview or production. Start with preview to check the site first.
  - Sign in to Netlify in the browser window when asked. The deploy can take a few minutes.
  - Open the preview link and check your site. Preview links are public. Netlify's site password protection may need a paid plan, so check yours before you rely on it.
  - Ask for a production deploy when you are happy, and you get your live link. If the build fails, open the logs link first and read the first error.
output_sample:
  input:
    - Your web project folder
    - Your Netlify login (a free account works)
    - Your choice of preview or live deploy
    - The name of an existing Netlify site to link (optional)
  prerequisites:
    - An AI that can run commands on your computer
    - A free Netlify account
    - Node installed on your computer
  output:
    - name: Login check
      contains: Whether you are signed in to Netlify, and the login steps if you are not.
    - name: Site link status
      contains: Whether your folder is linked to a Netlify site, or a new site was made.
    - name: Build settings
      contains: The framework found in your project, with the build command and publish folder to use.
    - name: Deploy URL
      contains: The unique link for this deploy, for checking your site.
    - name: Site URL
      contains: Your live address, shown only when you publish to production.
    - name: Logs link
      contains: A link to the Netlify dashboard where you can read the build logs.
