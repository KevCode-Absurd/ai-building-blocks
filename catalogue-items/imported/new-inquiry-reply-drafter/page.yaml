thinking: medium
thinking_why: It judges lead quality and writes a fitting reply.
new_slug: new-inquiry-reply-drafter
name: New inquiry reply drafter
summary: Answer new sales inquiries fast. Give it your leads and get each one sorted, with a draft reply and real meeting times. You approve every send.
job: write-emails
headline: New inquiry reply drafter
subhead: New enquiries answered while they are still warm. The skill reads what came in, sorts each one by how serious it looks and drafts a reply in your voice, with real meeting times offered.
explain: |
  New enquiries answered while they are still warm. The skill reads what came in, sorts each one by how serious it looks and drafts a reply in your voice, with real meeting times offered.

  It checks your inbox, CRM and website form alerts in one pass, and skips anything a person has already answered. Each enquiry is qualified and given a reply to match. Hot leads that need a human are posted to the chat channel you name, with who they are, what they asked and when. You review every draft and send it yourself, since nothing goes out unseen. Without connected tools, you can forward or paste enquiries and it works the same way.
when:
  - Leads sit in your inbox for a day before anyone replies.
  - You are on the road and cannot answer enquiries quickly.
  - You want to offer open calendar slots in your first reply.
  - Your team needs hot leads passed to a person right away.
not_for:
  - "You want to write cold emails to people who have not contacted you: use the outreach-composer."
  - "You need to log touches or update your CRM on its own: use the crm-autopilot."
  - "You want your AI to send replies without you seeing them: this tool never sends on its own, so a person must approve each draft."
you_give:
  - New enquiries (connected inbox or pasted text)
  - Your calendar availability
  - Examples of your writing voice (optional)
  - The channel for hot leads (optional)
you_get:
  - Each lead sorted by how likely it is to buy
  - A draft reply in your voice
  - Real meeting times in the reply
  - A handoff note for hot leads
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. Or upload the skill folder if your AI accepts files.
  - Connect your inbox, CRM and calendar if your AI allows it. If not, paste or forward each inquiry and say when you are free.
  - Share two or three emails you liked writing so the replies sound like you (optional).
  - Read the digest. Check each draft and any flags beside it.
  - Copy the drafts you approve and send them yourself. Nothing goes out without you.
output_sample:
  input:
    - New inquiries from your inbox, website form alerts or CRM (or forward or paste them)
    - Your calendar availability
    - Examples of emails in your voice (optional)
    - The team channel for hot leads (optional)
  prerequisites:
    - Connected Gmail or Microsoft 365, HubSpot, Google Calendar and RingEx Chat make it automatic. Without them, pasted inquiries work.
    - A Zapier account only if you want to connect a tool that is not listed.
  output:
    - name: Inquiry sort
      contains: "Each inquiry placed in one of four groups: hot, qualified, unclear or out of scope."
    - name: Draft replies
      contains: A reply under 100 words for each inquiry, in your voice, answering what they asked.
    - name: Meeting times
      contains: Two or three real open slots from your calendar, or a request for their availability if none is connected.
    - name: Hot lead handoff
      contains: A note to your team channel with who it is, what they asked, why it is hot and what to do next.
    - name: Flags
      contains: Warnings on drafts that involve a price, a date, a complaint or a request for money or access.
    - name: CRM log
      contains: A record of each contact, its source, its sort and whether the reply is still a draft.
    - name: Digest
      contains: A short status board with counts, drafts waiting for review, and the median time to a ready draft.
