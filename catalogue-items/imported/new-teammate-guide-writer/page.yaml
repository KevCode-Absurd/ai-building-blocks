thinking: medium
thinking_why: It reads the code and explains it in order.
new_slug: new-teammate-guide-writer
name: New teammate guide writer
summary: Write a codebase onboarding guide for a new engineer, tech lead or contractor. Point it at your repo and get setup steps and key files.
job: build-software
headline: New teammate guide writer
subhead: A written guide that gets a new engineer, tech lead or contractor working in your codebase without a week of questions. You point it at a repository and it writes the guide from what the code shows.
explain: |
  A written guide that gets a new engineer, tech lead or contractor working in your codebase without a week of questions. You point it at a repository and it writes the guide from what the code shows.

  A Python script first scans the project: file counts, languages, config files and folder layout. Those facts go into a template covering the stack, key files, local setup, common tasks, debugging tips and a contribution checklist. The depth changes by reader. Juniors get setup and guardrails, seniors get architecture and operations, and contractors get their scope and the edges where they connect to other systems. Python must be installed.
when:
  - A contractor starts Monday and the old docs are stale.
  - A big refactor made your README wrong.
  - You want the same onboarding pack for every service.
  - A new tech lead needs the architecture fast.
not_for:
  - "You only need to fix one line in the README: edit the README by hand."
  - "Your repository is private or unreadable to your AI: ask a current teammate to write the guide."
  - "You need a deep design review of the code: ask a senior engineer to review it."
you_give:
  - The path to your repository
  - "Who the guide is for: a junior, a senior, a tech lead or a contractor"
  - Any setup quirks you know (optional)
you_get:
  - A scan of languages, files and structure
  - A guide filled in from the template
  - Setup and common task steps
  - A debugging and contribution checklist
how_to_use:
  - Open an AI that can run code and read files. Python must be installed on your computer.
  - Give it this skill and the path to your repository. The AI reads your code, so check your company policy first if the code is confidential. The template files and the scan script come with the skill folder. If you paste only the text, also paste references/onboarding-template.md.
  - "Say who the guide is for: a junior, a senior, a tech lead or a contractor."
  - Let it scan the project, then read the guide it writes from the template. The guide follows the template order: what the project is, quick start, architecture, key files, common developer tasks, debugging, contribution rules and notes for each reader. The scan results fill the stack and key file parts.
  - Check the guide for secrets and private details copied from config files, such as passwords, keys, internal hostnames and customer data. Remove them before you share it.
  - The AI writes the setup commands from code it has only read, so do not trust them yet. Ask a new hire to run the setup steps on a clean machine and fix anything that fails.
  - Send the guide to your tech lead for review before you share it.
  - "The template has these parts: what the project is, quick start, architecture, key files, common developer tasks and a debugging guide."
next: [readme-first-run-tester]
output_sample:
  input:
    - The path to your repository
    - "Who the guide is for: a junior, a senior, a tech lead or a contractor"
    - Any setup quirks you know (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Python installed on your computer
  output:
    - name: Codebase scan
      contains: File counts, detected languages, config files and the top-level folder layout of your repository.
    - name: Stack and key files
      contains: The tools the project uses and the files a new person should read first.
    - name: Local setup
      contains: Steps to get the project running on a new machine.
    - name: Common tasks
      contains: Steps for the jobs a new teammate will do most often.
    - name: Debugging tips
      contains: Troubleshooting and ways to check that your setup works.
    - name: Contribution checklist
      contains: What to check before sending your first change.
