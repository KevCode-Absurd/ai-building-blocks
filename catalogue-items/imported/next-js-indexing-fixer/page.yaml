thinking: medium
thinking_why: It matches each indexing error to a known cause and fix.
new_slug: next-js-indexing-fixer
name: Next.js indexing fixer
summary: Fix Next.js indexing problems. Give it a Search Console error and your code. You get the canonical, sitemap, robots and redirect fixes to make.
job: get-found-in-search
headline: Next.js indexing fixer
subhead: Fixes for pages that Google will not index on your Next.js site. You bring the Search Console message and the skill maps it to a cause and a code change.
explain: |
  Fixes for pages that Google will not index on your Next.js site. You bring the Search Console message and the skill maps it to a cause and a code change.

  It starts with a table that translates each coverage status into plain meaning, such as "Crawled, not indexed" or "Duplicate, Google chose a different canonical". Then it works through the usual suspects: canonical tags set with generateMetadata, accidental noindex, sitemap routes, robots.js, redirect chains, weak internal links and pages that render too late for crawlers. It gives App Router examples for each fix. The goal is to stop wasting crawl budget on junk URLs and get the pages that matter into the index.
when:
  - Search Console says pages are "Discovered, not indexed".
  - Google picked a different canonical than the one you set.
  - You are checking sitemap and robots files before a release.
  - Old URLs return 404 and you need the right redirects.
not_for:
  - "Your site is not built with Next.js: use the Technical SEO auditor instead."
  - "You want Google to index a page for sure: no tool can promise that, so check the page content and links yourself."
  - "You want to change URLs or redirects on a live site without a review: ask a developer to check the plan first."
you_give:
  - The Search Console error or status
  - Your Next.js project code
  - A list of affected URLs (optional)
  - Your sitemap and robots setup (optional)
you_get:
  - A plain meaning of each coverage status
  - Canonical and metadata fixes
  - Sitemap and robots code
  - A redirect and internal linking plan
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. Say which Next.js version you use. The examples differ slightly for version 14 and earlier.
  - Paste the exact Search Console message and a few affected URLs.
  - Share your project files, such as app/layout.js, sitemap and next.config.js. If your AI cannot read files, paste them in.
  - Read the cause it finds before you change anything. Check why Google picked a different canonical before you change yours.
  - Run the commands it gives you in your own terminal. Your AI cannot run them in a normal chat.
  - Ask a developer to review any change to redirects or canonical rules before you publish.
  - After you deploy, check the affected URLs again in Search Console and ask Google to crawl them. Then run the Technical SEO auditor if pages are still not indexed.
output_sample:
  input:
    - The Search Console error or status, such as Crawled, not indexed
    - Your Next.js project code
    - A list of affected URLs (optional)
    - Your sitemap and robots setup (optional)
  prerequisites:
    - An AI that can read your project files works best
    - Your site live, so redirects and sitemap can be checked
  output:
    - name: Coverage status meaning
      contains: What your Search Console message means in plain words, and the usual fix for it.
    - name: Canonical audit
      contains: Canonical tags to fix, with App Router metadata and generateMetadata examples.
    - name: Noindex audit
      contains: Pages or layouts that block indexing by mistake, and how to remove the block.
    - name: Sitemap health
      contains: Checks that the sitemap loads, plus App Router sitemap code.
    - name: Rendering check
      contains: Which pages are static or dynamic, and where to add generateStaticParams.
    - name: Internal linking audit
      contains: Pages with no links pointing to them from other pages.
    - name: Redirect audit
      contains: Redirect chains to shorten, with a flat redirect example for next.config.js.
    - name: robots.txt check
      contains: Rules that block important pages, and robots.js code to replace them.
    - name: Indexing checklist
      contains: A tick list of the checks above to finish before release.
