thinking: medium
thinking_why: It matches each indexing error to a known cause and fix.
new_slug: next-js-indexing-fixer
name: Next.js indexing fixer
summary: Give it your Next.js site and a Search Console error. Get the
  canonical, sitemap and rendering fixes.
job: get-found-in-search
headline: Next.js indexing fixer
subhead: Fixes for pages that Google will not index on your Next.js site. You
  bring the Search Console message and the skill maps it to a cause and a code
  change.
explain: |
  Fixes for pages that Google will not index on your Next.js site. You bring the Search Console message and the skill maps it to a cause and a code change.

  It starts with a table that translates each coverage status into plain meaning, such as "Crawled, not indexed" or "Duplicate, Google chose a different canonical". Then it works through the usual suspects: canonical tags set with generateMetadata, accidental noindex, sitemap routes, robots.js, redirect chains, weak internal links and pages that render too late for crawlers. It gives App Router examples for each fix. The goal is to stop wasting crawl budget on junk URLs and get the pages that matter into the index.
when:
  - Search Console says pages are "Discovered, not indexed".
  - Google picked a different canonical than the one you set.
  - You are checking sitemap and robots files before a release.
  - Old URLs return 404 and you need the right redirects.
you_give:
  - The Search Console error or status
  - Your Next.js project code
  - A list of affected URLs (optional)
  - Your sitemap and robots setup (optional)
you_get:
  - A plain meaning of each coverage status
  - Canonical and metadata fixes
  - Sitemap and robots code
  - A redirect and internal linking plan
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your project files.
