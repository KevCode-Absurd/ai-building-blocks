thinking: medium
thinking_why: It writes and debugs code with set conventions.
new_slug: nextflow-pipeline-builder
name: Nextflow pipeline builder
summary: Build, run and fix a Nextflow pipeline from a plain list of data steps, or run an nf-core pipeline on your own samples.
job: build-software
headline: Nextflow pipeline builder
subhead: A Nextflow data pipeline that runs the same on your laptop, a computing cluster or the cloud. You describe the steps, and the skill writes the pipeline, runs it and fixes it when it fails.
explain: |
  A Nextflow data pipeline that runs the same on your laptop, a computing cluster or the cloud. You describe the steps, and the skill writes the pipeline, runs it and fixes it when it fails.

  Nextflow links tasks by their data, so you do not schedule anything by hand. The skill uses the modern DSL2 syntax with separate processes and modules. It can also run ready-made nf-core pipelines, set containers and resources, and write nf-test tests. To move between machines, you change a config profile, not the code. It pins software versions so results can be repeated. It is strongest in bioinformatics but suits any heavy data work.
when:
  - You need to run an nf-core pipeline on your own samples.
  - A run failed halfway and you want to resume it safely.
  - Your scripts work on one machine but must scale to a cluster.
  - You want to add tests to a pipeline module.
not_for:
  - "You have one small script or a simple shell job: run a plain script instead, as a pipeline adds setup you do not need."
  - "You cannot install Java, Nextflow or a container tool: ask a developer or your IT team to set up the machine first."
  - "You only want to read or explain existing code: paste it into your AI and ask for a plain summary."
you_give:
  - The steps your data goes through
  - Your tools and input files
  - Where it will run (laptop, cluster or cloud)
  - Error logs from a failed run (optional)
you_get:
  - A working Nextflow pipeline
  - Config profiles for each machine
  - Tests for your modules
  - A diagnosis for failed runs
how_to_use:
  - Use an AI that can run terminal commands on your own computer, such as Claude Code. A plain chat window cannot install or run Nextflow.
  - "Gather first: your input files, the reference genome and annotation if you work with DNA data, a samplesheet (a table listing your samples and their files), and the Java and container versions on your machine."
  - Make sure Java, Nextflow and a container tool such as Docker are installed on your machine.
  - Add the skill to your AI, or paste it in. Then describe your data steps, your tools and your input files.
  - "Say where it will run: laptop, cluster or cloud. Paste the error log too if a run failed."
  - Read the pipeline and the config before you run it on real data. Try the small test run first.
  - Ask your AI to add nf-test tests once the pipeline runs well.
output_sample:
  input:
    - The steps your data goes through
    - Your tools and input files
    - "Where it will run: laptop, cluster or cloud"
    - Error logs from a failed run (optional)
  prerequisites:
    - An AI that can run code in a terminal
    - Java and Nextflow installed on your machine
    - A container tool such as Docker or Singularity, for most pipelines
    - Python 3.10 or newer, only if you use the nf-core tools
  output:
    - name: main.nf
      contains: The pipeline script that links your processes and channels so data flows from one step to the next.
    - name: modules
      contains: One file per tool or step, written in DSL2 so each part can be reused and tested.
    - name: nextflow.config
      contains: Settings for containers, resources and software versions, so results can be repeated.
    - name: Config profiles
      contains: Named settings for laptop, cluster or cloud, so you change the profile and not the code.
    - name: Samplesheet and params file
      contains: The list of your samples and the settings used for a run.
    - name: nf-test files
      contains: Tests for your modules, subworkflows or pipeline, with checks on what each one should produce.
    - name: Run diagnosis
      contains: For a failed run, the cause found in the logs and the fix, with a safe way to resume.
