thinking: medium
thinking_why: Types and arguments must match exactly.
new_slug: ni-daqmx-call-translator
name: NI-DAQmx call translator
summary: Turn a NI-DAQmx C function into a working MATLAB calldaqlib call, with the right argument types, so you skip the type-error guesswork.
job: build-software
headline: NI-DAQmx call translator
subhead: A DAQmx C function turned into a correct calldaqlib call in MATLAB, with the argument types fixed. Wrong types are the usual reason these calls fail, so this saves a lot of trial and error.
explain: |
  The skill follows a short decision tree. If you named calldaqlib or a specific DAQmx function, it writes that call without second-guessing you. If you only described a need, it first checks whether the normal daq object can do it. It then checks whether the function needs a task handle or works at the device level, since calldaqlib handles task creation itself and cannot call DAQmxCreateTask. You need MATLAB and Data Acquisition Toolbox R2026a or newer, which are paid MathWorks products. You also need an NI device and the NI driver. This is a MathWorks skill, and you may use it only with MathWorks products.

  Licence: two sets of terms apply, and both say to use it only with MathWorks products such as MATLAB. One is the BSD 2-Clause licence in the LICENSE.md file in this item. The other is MathWorks' own reuse licence (PMRL), linked in the skill file header at mathworks.com/content/dam/mathworks/license/pmrl/license.md.
when:
  - You have example C code from NI and need it in MATLAB.
  - You need a driver feature the daq object does not expose, such as a reference trigger.
  - You are reading back what the NI driver actually holds.
  - A calldaqlib call gives a type error you cannot trace.
not_for:
  - "You can do the job with the daq object alone, such as setting a rate or adding a trigger: use the daq object in MATLAB directly."
  - "You need DAQmxCreateTask or DAQmxLoadTask: calldaqlib makes the task itself, so these calls cannot work. Use the daq object to build the task."
  - "You use the old Session-based DAQ interface: this skill does not cover it. Use the MATLAB documentation for that interface."
you_give:
  - The DAQmx C function or signature
  - What you want it to do
  - Your device and MATLAB release (optional)
you_get:
  - A correct calldaqlib call
  - Fixed argument types
  - A note if the daq object can do it instead
  - Why DAQmxCreateTask will not work here
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Paste the DAQmx C function or signature. Find the exact signature in the NI DAQmx C reference. Say what you want it to do.
  - Add your device name and MATLAB release if you know them (optional).
  - Copy the calldaqlib call into MATLAB. It only runs with Data Acquisition Toolbox R2026a or newer, the NI driver installed, and an NI device connected.
  - Check the returned dictionary key, and check the enum names against the NI DAQmx documentation for your driver.
  - Next, test the call on a single channel with your NI device before you wire it into a larger acquisition script. If the daq object can do the job, use it instead and drop the call.
output_sample:
  input:
    - The DAQmx C function name or signature
    - What you want the call to do
    - Your device name, such as Dev1 (optional)
    - Your MATLAB release (optional)
  prerequisites:
    - MATLAB R2026a or newer with Data Acquisition Toolbox
    - An NI device with NI drivers installed, to run the call
  output:
    - name: calldaqlib call
      contains: "The result comes in this order: a MATLAB code block with the call, a numbered list of argument mappings, then a return-value note. The code block has argument types fixed and enum names written as strings."
    - name: Argument translation
      contains: How each C argument maps to MATLAB, including the dropped task handle and output placeholders.
    - name: Return value note
      contains: How to read the result, which comes back as a dictionary keyed by device and channel name.
    - name: daq object note
      contains: A short note when the daq object can do the same job without calldaqlib.
    - name: Multi-task warning
      contains: A note that the call runs on every internal task, and what to do about the warning.
