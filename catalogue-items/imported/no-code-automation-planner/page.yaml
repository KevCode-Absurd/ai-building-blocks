when:
  - You want an email with an attachment to create a task automatically.
  - You cannot decide between Zapier and Make.
  - Your automation runs too often or sends duplicates.
  - You wonder if your growing zap should become real code.
not_for:
  - "You run very high volumes or heavy logic: ask a developer to build it in code, or use a custom build."
  - "You only want to build one simple flow in a tool you already chose: follow that tool's own template or guide."
  - "You need a tested, checked plan for sensitive data or money: have a person review it before you turn it on."
you_give:
  - The task you want to automate
  - The apps involved
  - How often it runs and how much data
  - Budget (optional)
you_get:
  - A tool recommendation with reasons
  - A trigger, filter and action layout
  - Test and naming tips
  - A sign for when to switch to code
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code running, files or web access is needed for a plan. The detailed guide in the skill folder is optional for a plan-only run. Your AI reads its sections on branching, errors, loops and schedules when you ask for those.
  - Describe the task in plain words. Name the apps, how often it runs and how much data moves.
  - Add your budget if you have one (optional). Check current prices on the Zapier or Make pricing page before you decide. They change.
  - Read the tool choice and the trigger, filter and action layout.
  - Build the flow in Zapier or Make. Test it on real sample data before you turn it on.
  - "Next: after the plan, use the test checklist in the plan to run it on sample data, then turn it on. If the flow outgrows Zapier or Make, plan it again with the n8n workflow designer."
  - If the first test passes, watch the first few real runs and read any errors in the platform's run history. If it grows or slows, run the switch-to-code check again.
next: [n8n-workflow-designer]
output_sample:
  input:
    - The task you want to automate
    - The apps involved
    - How often it runs and how much data
    - Your budget (optional)
  prerequisites:
    - A free or paid Zapier or Make account to build the plan (the AI only plans it, you build it)
  output:
    - name: Tool choice
      contains: Whether Zapier or Make fits your task better, with the reasons. Every plan comes back under the same headings - Tool choice, Trigger and filters, Actions in order, Tests and first runs, Switch-to-code check.
    - name: Trigger and filter layout
      contains: The trigger, the filters that stop unwanted runs, and the actions in order.
    - name: Naming and test tips
      contains: A clear name for the flow and how to test it on real sample data.
    - name: Switch-to-code check
      contains: Signs that your flow is too big, slow or complex for no-code and should move to code.
