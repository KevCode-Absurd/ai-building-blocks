thinking: medium
thinking_why: It drives an app with set steps and compares the results.
new_slug: no-code-model-trainer
name: No-code model trainer
summary: Train and compare machine learning models on your data table in MATLAB's Learner apps, then export the best one. No clicking through the app.
job: build-software
headline: No-code model trainer
subhead: Give your AI a data table in MATLAB and the column to predict. It trains many model types in the Classification Learner or Regression Learner app and compares them. You get the best model exported.
explain: |
  Machine learning models trained and compared in MATLAB's Classification Learner and Regression Learner apps, with the best one exported. You do it by code, so you do not click through the apps by hand.

  The skill drives the apps by code. It opens a session on your data table, creates models, trains them and selects them. It reads their accuracy figures and options such as feature selection and PCA, and opens the standard plots. Validation means part of your data is held back to test each model fairly. PCA squeezes many columns into a few combined ones, which can speed up training. For explanation, it can run partial dependence, permutation importance, Shapley and LIME. Finally it exports the chosen model, or code to rebuild it. You need MATLAB with the Statistics and Machine Learning Toolbox. This is a MathWorks skill.

  Licence: the LICENSE.md file in this item governs this copy. It is BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. The skill file header links MathWorks' upstream licence page, which also limits use to MathWorks products.
when:
  - You have a table and want to try many model types quickly.
  - You want to compare models without clicking through the app.
  - You need to explain which features drive predictions.
  - You want to export the winning model for use elsewhere.
not_for:
  - "You work with images, text or time series: use a Deep Learning Toolbox workflow or a Python workflow instead."
  - "You do not have MATLAB with the Statistics and Machine Learning Toolbox: use a Python workflow or ask a data analyst."
  - "You only need a quick chart or a simple average: use a spreadsheet instead."
you_give:
  - A data table
  - The column to predict
  - Which model types to try (optional)
  - Feature selection or tuning wishes (optional)
you_get:
  - A set of trained models
  - A comparison of their metrics
  - Explanation plots
  - The exported best model
how_to_use:
  - Check you have MATLAB with the Statistics and Machine Learning Toolbox. This skill needs an AI tool that can run MATLAB code, such as Claude Code. Without that, your AI can only write the code for you to run yourself.
  - The skill runs MathWorks helper files (.p files) that you cannot read. They come from MathWorks and run inside your MATLAB, so use them only if you trust that source.
  - "First run, in order: 1. Load your data into MATLAB as a table, with one column to predict. 2. Open your AI, add the skill folder and say: Follow this skill. Name the table, the column to predict and any model types you want. 3. Read what code your AI says it will run and confirm. 4. Say how much data to hold back for a test. 5. Let it train a few models. 6. Read the first metrics table."
  - Read the comparison of model scores. Ask for explanation plots if you want to know which features matter.
  - Next, check the best model's score on the held-out test data before you trust or export it. Then ask for explanation plots, and ask your AI to export the best model, or the code to rebuild it.
next: [model-decision-explainer, neural-network-trainer]
output_sample:
  input:
    - Your data table, loaded in MATLAB
    - The column you want to predict
    - Model types to try (optional)
    - Feature selection or tuning wishes (optional)
  prerequisites:
    - MATLAB with the Statistics and Machine Learning Toolbox (paid MathWorks software that needs a licence)
    - An AI tool that can run MATLAB code
    - Parallel Computing Toolbox for faster training (optional)
  output:
    - name: Trained models
      contains: The models you asked for, trained in Classification Learner or Regression Learner on your table.
    - name: Metrics comparison
      contains: A table with one row per model, showing model type, validation score, test score and training time, so you can see which one does best.
    - name: Standard plots
      contains: The usual app plots for the models, opened for you to check.
    - name: Explanation results
      contains: Partial dependence, permutation importance, Shapley and LIME results that show which features drive predictions.
    - name: Exported model
      contains: The chosen model sent to your workspace as a MATLAB variable, or code that rebuilds it.
