job: build-software
headline: Node.js code advisor
subhead: Choices for your Node.js project that fit your situation, with the
  reasons, instead of one default for everyone. It teaches how to think about
  the choice, so you can make the next one yourself.
explain: |
  Choices for your Node.js project that fit your situation, with the reasons, instead of one default for everyone. It teaches how to think about the choice, so you can make the next one yourself.

  The skill asks what you are building and where it will run. A decision tree then points to Hono for edge and serverless, Fastify for fast APIs, NestJS for larger teams, Express for stable older projects and Next.js routes when the front end is included. It compares cold start, library support and TypeScript support. It also covers runtime points such as native TypeScript, async patterns, project structure, security and deployment. When your answer is unclear, it asks before choosing.
when:
  - You are starting an API and cannot pick a framework.
  - Your team knows Express and you wonder if you should move.
  - You deploy to serverless and cold starts matter.
  - You want a sensible folder structure and security checklist.
you_give:
  - What you are building
  - Where it will run
  - Your team's experience
  - Existing code to keep (optional)
you_get:
  - A framework pick with reasons
  - Async and structure advice
  - A comparison on speed and library support
  - Security and deployment points
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
