new_slug: noise-level-code-helper
name: Noise level code helper
summary: Add noise to a MATLAB link simulation at the right level. Convert SNR, Eb/No and Es/No with the right code, and get noise variance for soft demodulators.
job: build-software
headline: Noise level code helper
subhead: Noise added at exactly the level you intended in a communications simulation, with SNR, Eb/No and Es/No converted the right way. Mix-ups between these measures are a common source of wrong results. For use only with MathWorks products such as MATLAB.
explain: |
  Noise added at exactly the level you intended in a communications simulation, with SNR, Eb/No and Es/No converted the right way. Mix-ups between these measures are a common source of wrong results.

  The skill sets firm rules for MATLAB code. Always give awgn an explicit signal power, never the measured option. Use unit average power if the scale does not matter, or compute the real power with mean(abs(x).^2) when it does. Always use convertSNR instead of hand formulas, since it handles coding rate, bits per symbol and oversampling. It has a pattern for OFDM links and for getting noise variance to feed a soft-decision demodulator. It needs MATLAB with the Communications Toolbox. It writes code only. Unless your AI is connected to MATLAB, it cannot run or check the code, so run it yourself in a licensed MATLAB. This is a MathWorks skill.

  Licence: the LICENSE.md file in this item governs this copy. It is BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. The skill file header links MathWorks' own reuse licence (PMRL), which is MathWorks' upstream terms and also limits use to MathWorks products.

  The result is a MATLAB code block, a list of the SNR, Eb/No and noise variance values in dB, and a note on any fixes made to your code.
when:
  - Your bit error curve is off by a few dB and you cannot see why.
  - You have an Eb/No target and need the SNR for your simulation.
  - You are adding noise after a fading channel.
  - You need the noise variance for a soft demodulator.
not_for:
  - "You need to set up a fading channel, with delay profile, Doppler or antenna arrays: build that channel first in MATLAB, then use this helper to add the noise."
  - "You do not have MATLAB with the Communications Toolbox: use a plain statistics tool or a person who knows your simulation software, as this skill only writes MATLAB code."
  - "You want a bit error curve to compare against, with no noise code needed: look up the theory curve in MATLAB with berawgn, which takes Eb/No, not SNR."
you_give:
  - Your target SNR, Eb/No or Es/No
  - Modulation, coding rate and oversampling
  - Your MATLAB simulation code (optional)
  - Whether the link is OFDM (optional)
you_get:
  - Noise code with correct power settings
  - Converted SNR values
  - Noise variance for demodulators
  - A fix for common mistakes
how_to_use:
  - Open a chat with an AI that can read MATLAB code. Paste the skill text from the skill folder. Its licence (LICENSE.md) applies in any AI tool you load it into, and it allows use only with MathWorks products, so use it only to write MATLAB code.
  - "Say what you want: add noise, convert Eb/No to SNR, or get noise variance."
  - Paste your target level, modulation, coding rate and samples per symbol. Add your code if you have it.
  - Say if the link is OFDM or uses a fading channel. Give the FFT length and active subcarriers for OFDM. Also give your MATLAB release. The OFDM conversion with convertSNR's "snrsc" mode needs R2023b or later. For R2022a to R2023a the skill gives a manual formula instead.
  - Run the returned MATLAB code in MATLAB with the Communications Toolbox. Check the noise variance variable and the SNR values in dB.
  - If your AI can run MATLAB, ask it to test the code. If not, run it yourself.
  - Next, compare your simulated bit error rate with the berawgn theory curve at the converted Eb/No. Look at the received points with scatterplot or comm.ConstellationDiagram, and measure the damage with comm.EVM.
output_sample:
  input:
    - Your target SNR, Eb/No or Es/No, in dB
    - Your modulation, coding rate and samples per symbol
    - Your MATLAB simulation code (optional)
    - Whether your link is OFDM, with FFT length and active subcarriers (optional)
    - Whether a fading channel comes before the noise (optional)
  prerequisites:
    - MATLAB with the Communications Toolbox
    - An AI that can run MATLAB, to check the result (optional)
  output:
    - name: Noise code for a unit-power signal
      contains: An awgn call with an explicit signal power, never the measured option.
    - name: SNR conversion for a coded system
      contains: A convertSNR call that turns Eb/No into SNR using bits per symbol, coding rate and oversampling.
    - name: OFDM conversion
      contains: Steps from Eb/No to per-subcarrier SNR to wideband SNR, with signal power set for your FFT size.
    - name: OFDM noise code
      contains: Code that adds noise to an OFDM link, with signal power adjusted for receive antennas and path gains.
    - name: Noise variance for soft demodulation
      contains: A noise variance value, taken from the noise step, to pass to a soft-decision demodulator.
    - name: Fixes for common mistakes
      contains: Notes on swapping the measured option, hand-made SNR formulas and wrong power scaling for correct code.
