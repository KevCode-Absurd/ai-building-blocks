new_slug: nonprofit-capital-campaign-planner
name: Plan a nonprofit capital campaign
summary: "Plan a nonprofit capital campaign: test your goal, build a gift range table from real prospects, and set a gate before you go public."
job: plan-strategy
headline: Plan a nonprofit capital campaign
subhead: Give it your project cost, your donor list and your interview notes. It tests whether your goal is real and builds a gift table from the prospects you have. It also sets leadership roles and a gate for going public.
explain: Bring the project cost, donor pipeline and interview findings. Test the goal, assign campaign roles and set a gate for the public launch.
when:
  - Your board wants a big building or endowment campaign and asks if the goal is realistic.
  - You need a gift table to show the board before anyone asks for a gift.
  - You are picking a campaign chair and committee and need to know what each role does.
  - You must decide when to go public and how to avoid clashing with your yearly appeal.
not_for:
  - "You want to plan your yearly donor mailings or email asks: use your annual appeal plan, not a campaign plan."
  - "You need the wording and ask amount for one major donor: plan that single ask on its own, after the gift table names the prospect."
  - "You have no donor list and no interview notes yet: run the feasibility interviews first, then come back."
you_give:
  - The project, its cost and your first goal
  - Your list of prospects and what each could give
  - Notes from your donor interviews (optional)
  - Board giving records (optional)
  - How many staff and volunteers can run the campaign (optional)
you_get:
  - A gift range table matched to your goal, with gaps marked
  - A view of how ready you are, and where your goal looks weak
  - Leadership roles for the chair, the committee and staff
  - A phased timeline with a gate for the public launch
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, web access or paid tool is needed. A feasibility study (15 to 30 confidential interviews with top prospects and leaders) is usually run by an outside consultant. If you run it yourself, use a neutral interviewer and a draft case for support.
  - Paste the skill text, or upload the skill folder if your AI takes files.
  - Paste your project cost, goal, prospect list and interview notes. Say what is missing.
  - Ask for the feasibility findings, then the gift table, then the phases and roles.
  - Check each tier. If the top tiers have no named prospect, the goal is not yet real. The lead gift share (about 10 to 20 percent of the goal) and the launch threshold (about 50 to 70 percent committed) are common rules of thumb. Test them against your own pipeline.
  - Take the table to your board before any donor is asked.
output_sample:
  input:
    - The project, its cost and your first goal
    - Your list of prospects, with how much each could give
    - Notes from your donor interviews (optional)
    - Board giving records and your staff and volunteer capacity (optional)
  output:
    - name: Feasibility findings
      contains: A recommended goal, leaders who could serve, fixes to the case for support, and whether your team can run the campaign.
    - name: Gift range table
      contains: Gift tiers worked back from the goal. Each tier shows its goal amount, the named prospects and the gap, so you can see which tiers have no support.
    - name: Campaign phases and timeline
      contains: The planning, quiet, public and closing phases, with named milestones.
    - name: Leadership roles
      contains: What the chair, the steering committee and the staff campaign director each do.
    - name: Public launch gate
      contains: The share of the goal that must be committed before you announce the campaign. Common practice is 50 to 70 percent, which you should check against your own pipeline.
    - name: Progress dashboard
      contains: Money committed against the goal, by phase and by tier, for board updates.
how_it_works:
  - title: Test readiness
    text: Plan confidential feasibility interviews and distinguish documented donor interest from aspirations.
  - title: Build the gift table
    text: Work backward from the goal and show which gift tiers have qualified prospects and which remain unsupported.
  - title: Stage the campaign
    text: Assign chair, cabinet and staff roles; define a quiet-phase launch gate and coordinate the public phase with annual giving.
thinking: medium
thinking_why: It weighs your evidence and follows a specific method.
