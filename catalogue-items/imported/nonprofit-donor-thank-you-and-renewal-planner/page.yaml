thinking: high
thinking_why: It weighs real records, missing facts, and choices that affect people or funding.
new_slug: nonprofit-donor-thank-you-and-renewal-planner
name: Nonprofit donor thank-you and renewal planner
summary: Share giving history and current follow-ups. Get thank-you steps, welcome messages, and plans for lapsed donors.
job: keep-customers
headline: Nonprofit donor thank-you and renewal planner
subhead: Share your giving records, thank-you process, and recent donor messages. It checks where follow-ups stop and which donors do not return. You get a thank-you plan, first-gift welcome steps, renewal timing, and separate plans for lapsed donors. US receipt rules need local review.
when:
  - Fewer first-time donors give a second gift, and you do not know why.
  - Receipts and thank-you notes go out late or sound the same for every donor.
  - You want a plan for donors who stopped giving last year or the year before.
  - Your board asks for a retention number and you have only total dollars raised.
you_give:
  - Dated giving records, current thank-you process, receipt wording, and donor contact preferences.
you_get:
  - A thank-you guide, donor contact plan, retention measures, and lapsed-donor campaign outline.
how_it_works:
  - title: Measure returning donors
    text: Compare repeat gifts and first-year donors over clear yearly periods. Keep the groups and rate definitions consistent.
  - title: Fix the first follow-up
    text: Review receipt speed and personal thanks. Plan a welcome sequence after the first gift.
  - title: Plan renewals and returns
    text: Map later contacts to giving dates and separate recently lapsed donors from longer-lapsed supporters.
works_best_with:
  tools:
    - name: A chat AI that can read your files
      why: The skill works from records and drafts you provide. Research tasks also need current, checked public sources.
  inputs:
    - Acknowledgment processes carry tax-receipt language donors rely on.
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Add a table of gifts (donor ID, gift date, amount), your current receipt and thank-you text, and your contact preferences. A CSV or spreadsheet works.
  - Ask for the retention numbers first. Then fix receipt speed, then add the first-gift welcome, then plan the lapsed-donor outreach.
  - Have an accountant or lawyer check the receipt wording for your country. The receipt rules in the skill follow US tax rules.
  - Measure retention again after one full giving cycle, and report it to your board next to total dollars raised.
not_for:
  - "You are moving new prospects toward a first gift. Use the Nonprofit donor relationship planner."
  - "You are planning a mass appeal letter and gift amounts. Use the Nonprofit annual appeal planner."
  - "You need receipt wording that meets tax rules. This gives drafts only, so have your accountant or lawyer check US receipt text."
output_sample:
  input:
    - Dated giving records, with each donor's gift dates and amounts
    - How you thank donors today, and your current receipt wording
    - Donor contact preferences
    - Recent donor messages (optional)
  output:
    - name: Retention measures
      contains: Overall and first-year donor retention, plus counts of lapsed donors, trended over years.
    - name: Stewardship matrix
      contains: Gift-size tiers matched to how and how fast you say thank you.
    - name: Donor path map
      contains: Each touch from first gift through year three, including the first 90 days.
    - name: Acknowledgment templates
      contains: A first-gift welcome, a renewal receipt, a major-gift thank-you guide and a year-end summary.
    - name: Renewal timing
      contains: Asks tied to each donor's own giving dates.
    - name: Win-back plan
      contains: Separate messages for donors who lapsed recently and those who lapsed longer ago.
