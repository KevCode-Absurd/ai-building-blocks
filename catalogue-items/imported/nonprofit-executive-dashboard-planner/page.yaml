how_it_works:
  - title: Choose decisions and measures
    text: Map candidates to strategic goals and balance mission, finance, stakeholders and organizational learning.
  - title: Define each number
    text: Specify formula, source, named owner, cadence, leading or lagging status and proposed thresholds before presenting status.
  - title: Split and operate the views
    text: Keep the executive view operational and the board view strategic; define reviews and an annual metric reset.
