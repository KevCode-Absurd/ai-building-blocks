thinking: high
thinking_why: It weighs real records, missing facts, and choices that affect people or funding.
new_slug: nonprofit-program-measurement-planner
name: Nonprofit program measurement planner
summary: "Build a nonprofit program measurement plan: pick measures, set targets and dates, and report results with clear limits. Give it your goals and records."
job: track-numbers
headline: Nonprofit program measurement planner
subhead: Share the changes your program aims to make and the records you can collect. It chooses useful measures and a realistic way to track them. You get an evaluation plan, collection calendar, and report structure that keeps missing data and limits visible.
when:
  - Your funder asks for an evaluation plan and you do not know what to measure.
  - You count people served but cannot show that anything changed.
  - You need a calendar for who collects which data and when.
  - You must write the results section of a funder or annual report.
not_for:
  - "You have no outcomes yet and need a logic model: use the Nonprofit program outcome planner first, then come back here."
  - "You are deciding whether a community needs a program at all: ask a local needs study or survey first, since this library has no needs-assessment skill yet."
  - "You want the outcomes written into a grant proposal story: use the Nonprofit grant proposal writer, and bring this plan's results to it."
you_give:
  - Your program's outcome list or logic model.
  - The records you can collect, such as attendance, enrollment and case notes.
  - Your budget and the staff time you have for data work.
  - Past numbers to use as baselines (optional).
  - How you will reach people for follow-up (optional).
  - Any survey scales you plan to use (optional).
you_get:
  - An indicator table with baselines, targets, sources and timing.
  - A named evaluation design that fits your budget.
  - A data collection calendar with an owner for each task.
  - A one-page board scorecard.
  - A funder-ready results section that shows sample size, response rate and limits.
how_it_works:
  - title: Choose useful measures
    text: Match each intended change to a clear measure that your team can afford to collect.
  - title: Set the collection plan
    text: State the baseline, target, method, timing, owner, and minimum response level before collecting data.
  - title: Report with clear limits
    text: Show the group behind each rate, sample sizes, missing follow-ups, and what the design can or cannot prove.
works_best_with:
  tools:
    - name: A chat AI that can read your files
      why: The skill works from records and drafts you provide. Research tasks also need current, checked public sources.
  inputs:
    - Reported outcomes go to funders and the board as fact.
how_to_use:
  - Gather your outcome list, your record sources and any baseline numbers before you start.
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. Then add your outcomes and details. No code or paid tool is needed.
  - Before you paste case notes or enrollment records, remove client names and other identifiers. Check your privacy policy and consent terms first.
  - If you use a validated scale, check whether it needs permission first.
  - Read the indicator table and fix any target your leaders do not agree with.
  - Check the response-rate floor and how each rate is counted before you share any results.
  - "Check before sharing: reported outcomes go to funders and the board as fact. Have a person review the report first."
output_sample:
  input:
    - Your program's intended outcomes, or a rough logic model
    - The records you already keep, such as attendance, enrollment or case notes
    - Any past numbers to use as a baseline (optional)
    - Your budget and staff time for collecting data
    - How you can reach people for follow-up (optional)
  prerequisites:
    - An outcomes list from a logic model. If you have none, run the Nonprofit program outcome planner first.
    - Permission or a license for any validated scale you want to use, since some require it
  output:
    - name: Indicator table
      contains: Each outcome with its indicators, baseline, target, data source and how often you collect it.
    - name: Evaluation design
      contains: The named design, such as pre/post, matched to your budget, with its limits stated.
    - name: Data collection calendar
      contains: Who collects what, at intake, midpoint, exit and follow-up, with the tool and the person who enters data.
    - name: Instrument list
      contains: The surveys, scales or other tools you will use, with citations for any validated scale.
    - name: Response-rate floor
      contains: The minimum follow-up response you need before results count as reportable.
    - name: Board scorecard
      contains: A one-page view of each indicator with target, actual and trend.
    - name: Funder results narrative
      contains: Results with design, sample size, response rate, how each rate is counted, and limitations.
