how_it_works:
  - title: Define required coverage
    text: List cash, sorting, floor and shift-lead roles by day-part and apply the store’s approved cash and keyholder rules.
  - title: Check the roster
    text: Match availability and certifications to the role matrix; flag a full-looking shift that lacks a qualified person.
  - title: Train and adjust
    text: Define supervised practice and sign-off checkpoints, add no-show fallback coverage and review repeated gaps quarterly.
thinking: medium
thinking_why: It weighs your evidence and follows a specific method.
