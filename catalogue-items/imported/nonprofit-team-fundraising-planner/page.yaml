new_slug: nonprofit-team-fundraising-planner
name: Plan a team fundraising campaign
summary: "Plan a team fundraising campaign: set a goal, equip captains, and draft messages that turn sign-ups into people who ask for donations."
job: plan-strategy
headline: Plan a team fundraising campaign
subhead: Bring the goal, dates and past results. Build captain tools and message drafts, then model active fundraisers and the amount each raises.
explain: Bring the goal, dates and past results. Build captain tools and message drafts, then model active fundraisers and the amount each raises.
when:
  - You are planning a walk, run, ride or online team fundraiser and want to turn sign-ups into people who ask.
  - Many people register but few raise money, and you want captain tools and message drafts.
  - You need to model how many fundraisers you need to hit a goal.
not_for:
  - "You want to sell sponsorships for the event: use the Nonprofit sponsor package planner."
  - "You need venue and event day logistics: use the Nonprofit fundraising event planner."
  - "You want one letter sent from your charity to all donors: use the Nonprofit annual appeal planner."
you_give:
  - Campaign goal, dates, historical participants and fundraising totals
  - Approved impact statements, captain capacity and incentive budget
you_get:
  - Campaign calendar and captain toolkit
  - Participant message templates and activation performance model
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - "Gather first: the goal, the dates, last year's sign-ups, the share who fundraised, the average raised per active fundraiser, captain capacity, the incentive budget and approved impact statements. Add them."
  - Ask for the model first, then the captain toolkit and message drafts.
  - Treat the conversion and final-week patterns as common patterns, not facts. Check them against your own past results.
  - Review the result and any missing facts before using it. Get consent before you name people in public recognition.
output_sample:
  input:
    - Your campaign goal and key dates
    - "Past results: sign-ups, share who raised money, average raised"
    - Your approved impact statements, such as what a set gift pays for
    - Your list of team captains (optional)
    - Your budget for prizes and recognition (optional)
  output:
    - name: Campaign timeline
      contains: A one-page list of dates for sign-ups, captain deadline, kickoff, midpoint push, final sprint, event day and thank-you window.
    - name: Team captain toolkit
      contains: One invite email for teammates, a one-page team goal worksheet, a message schedule, a few sample social posts and captain recognition tiers.
    - name: Participant coaching emails
      contains: One short email each for the nudge to personalize the page, the launch ask, the midpoint ask, the final-week ask and the donor thank-you.
    - name: Leaderboard and incentive plan
      contains: Prize or recognition tiers for people and teams, with the cost set against the extra money expected.
    - name: Revenue target model
      contains: Total raised worked out from sign-ups, share who fundraise and average raised, with your assumptions shown.
    - name: Post-campaign report
      contains: A one-page report of total raised, sign-ups, share who became active fundraisers, average per fundraiser, average per team and change from last year.
how_it_works:
  - title: Model the target
    text: Calculate revenue from participants, active-fundraiser share and average raised per active fundraiser, keeping assumptions visible.
  - title: Equip captains and participants
    text: Draft recruitment, page-personalization, launch, midpoint, final-week and thank-you materials for human use.
  - title: Measure and improve
    text: Track registration-to-fundraising conversion and per-active-fundraiser results; obtain consent for public recognition.
thinking: medium
thinking_why: It weighs your evidence and follows a specific method.
next: [nonprofit-sponsor-package-planner, nonprofit-donor-thank-you-and-renewal-planner]
