thinking: medium
thinking_why: It must test the metric against seven checks.
new_slug: north-star-metric-picker
name: North star metric picker
summary: "Pick your North Star metric: describe your product, get the one number to steer by plus 3 to 5 smaller numbers that move it."
job: track-numbers
headline: North star metric picker
subhead: One number your whole team can steer by, plus three to five smaller numbers that move it. Without this, teams chase many figures and pull in different directions.
explain: |
  One number your whole team can steer by, plus three to five smaller numbers that move it. Without this, teams chase many figures and pull in different directions.

  The skill first sorts your business into one of three games: attention (time spent), transactions (deals completed) or productivity (work done well). It then proposes a metric that reflects value to the customer, not your revenue, and tests it against what makes a good North Star. It must be a single measure, understood by all, and an early sign of long-term success. The supporting input metrics show which levers change it. An OKR is a goal, not the metric itself.
when:
  - Your team tracks twenty numbers and cannot agree which matters.
  - You are setting up a metrics plan for a new product.
  - You have a candidate metric and want to test it.
  - Revenue is your headline and you suspect it is the wrong guide.
not_for:
  - "You want to set goals or targets: use the OKR writer and review planner, which sets a goal on a metric. Pick the metric here first."
  - "You need a full list of every number to track: ask a finance or data person for a reporting plan."
  - "You want to judge ad or campaign results: use the numbers inside your ad platform, not a company-wide metric."
you_give:
  - A description of your product and customers
  - What value customers get
  - Metrics you track now (optional)
  - A candidate North Star (optional)
you_get:
  - Your business game type
  - One North Star metric
  - Three to five input metrics
  - A test of the metric against the criteria
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code, files or paid tools are needed.
  - Describe your product, your customers and the value they get. Add your current metrics and any North Star idea if you have them.
  - Read the game type first. Check that it fits how your business makes money.
  - Check the seven-criteria test. If the metric fails one, ask your AI to try another.
  - If the AI picks a metric you cannot measure yet, write down the data source or tool you would need before you adopt it.
  - Review the input metrics and name one owner for each.
  - Then turn the North Star into the goal of an OKR with the OKR writer.
output_sample:
  input:
    - A description of your product and customers
    - The value customers get from it
    - Metrics you track now (optional)
    - A North Star idea you already have (optional)
  output:
    - name: Business game
      contains: Whether your business plays the attention, transaction or productivity game, and why.
    - name: North Star metric
      contains: One customer-centred number that shows the value people get from your product.
    - name: Seven-criteria test
      contains: How the metric scores on clarity, customer focus, lasting value, vision, numbers, action and leading signs.
    - name: Input metrics
      contains: Three to five smaller numbers that are easier to move and feed the North Star.
