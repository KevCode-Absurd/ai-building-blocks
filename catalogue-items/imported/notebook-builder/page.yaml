thinking: low
thinking_why: It fills a ready template with your topic.
new_slug: notebook-builder
name: Notebook builder
summary: Turn your topic into a clean Jupyter notebook for an experiment or a tutorial. You get a ready-to-run .ipynb file with a clear structure.
job: work-with-files
headline: Notebook builder
subhead: A clean Jupyter notebook, ready to run, for either an experiment or a tutorial. It gives you a good starting structure so you spend time on the work, not the layout.
explain: |
  A clean Jupyter notebook, ready to run, for either an experiment or a tutorial. It gives you a good starting structure so you spend time on the work, not the layout.

  The skill asks which kind you need. Experiment notebooks follow a hypothesis-led flow for exploring and analysing data. Tutorial notebooks go step by step for a named audience. It first locks the goal, the reader and what done looks like. Then a helper script scaffolds the notebook from a template, which avoids hand-editing the raw file and breaking it. It can also turn rough notes or scripts into a notebook, or tidy an old one so it runs top to bottom. You need Python and Jupyter.
when:
  - You have a loose script and want it as a readable notebook.
  - You are writing a tutorial and want a clear structure.
  - An old notebook only works if cells run in a certain order.
  - You want to compare two ideas in a repeatable way.
not_for:
  - "You need a one-off chart or a data-only script with no story: use a plain Python script or a dashboard tool."
  - "You want to share results with readers who do not use code: export the notebook to HTML or PDF, or write a short report by hand."
  - "Your AI cannot run code or save files: ask a developer or data person to scaffold the notebook for you."
you_give:
  - The topic, goal and audience
  - Experiment or tutorial
  - Existing notes, scripts or a notebook (optional)
  - Python and Jupyter installed
you_get:
  - A new .ipynb file
  - A structure fitted to your goal
  - A reproducible, top to bottom flow
  - A tidied version of an old notebook (optional)
how_to_use:
  - Install Python 3.12 or newer, Jupyter and uv (uv pip install jupyterlab ipykernel). Use an AI that can run code and save files.
  - Give your AI the whole skill folder, or at least SKILL.md and the files in assets, references and scripts. It should run scripts/new_notebook.py first to make the starting notebook.
  - Say whether you want an experiment or a tutorial. Add the topic, the goal and who will read it.
  - Add your notes, scripts or old notebook if you have them (optional).
  - Let your AI build the notebook and fill in each step. Ask it to run the notebook top to bottom.
  - Open the .ipynb file in Jupyter and check that it runs. The setup paths in the skill are written for the Codex CLI, so other AI tools may need their own install step.
  - Share the file, or export it to HTML or PDF for readers who do not use code.
output_sample:
  input:
    - Your topic and goal
    - Experiment or tutorial
    - Who will read it
    - Existing notes, scripts or a notebook (optional)
  prerequisites:
    - An AI that can run code and save files
    - Python and Jupyter installed on your computer
  output:
    - name: Experiment notebook (.ipynb)
      contains: A title, then cells for the hypothesis, setup, runs, results and conclusion, ready to fill in.
    - name: Tutorial notebook (.ipynb)
      contains: A title, then cells for the goal, the audience, step-by-step lessons and checks for the reader.
    - name: Cleaned-up notebook (optional)
      contains: Your old notebook with its cells put in order so it runs from top to bottom.
    - name: Validation note
      contains: A line saying whether the notebook ran top to bottom, or how you can check it yourself.
