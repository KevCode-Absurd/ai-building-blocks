thinking: medium
thinking_why: It decides what is worth keeping and where each fact goes.
new_slug: notes-wiki-builder
name: Notes wiki builder
summary: Turn what you learned into small linked notes and an index, so your AI can find it next time. A notes wiki builder for lasting facts.
job: organise-work
headline: Notes wiki builder
subhead: Your AI remembers what it learned. Instead of one giant notes file that rots, you get small linked files and an index, so the next session finds the fact without redoing the work.
explain: |
  Your AI remembers what it learned. Instead of one giant notes file that rots, you get small linked files and an index, so the next session finds the fact without redoing the work.

  The rule is one fact per file. Each has a one-line description that recall matches against, [[links]] to related files, and a single index line. The hard part is discipline: only keep what is lasting, such as a tool that fails silently or a limit nobody wrote down. Update an existing file instead of making a near-copy. Skip routine work, since filler makes recall worse. You pick a store, either the agent's memory folder or a shared wiki folder, and compile before you close a task.

  Licence: two labels apply. The skill file keeps its author's own MIT header (5dive-ai). sickn33's collection shares it under CC BY 4.0, as the LICENSE-CONTENT file says. Both allow reuse with credit, so keep the credit to 5dive-ai and sickn33.
when:
  - You just finished research and want it available next week.
  - Your AI keeps re-learning the same hard-won fact.
  - You say "save this" and want it done in a consistent way.
  - Your single notes file is too long to be useful.
not_for:
  - "You did routine work like a restart or a one-line fix: write nothing, since filler makes recall worse."
  - "You want to turn a repeatable process into a reusable skill: write that as a skill, not a note."
  - "You need the facts checked first: have a person verify them, because this only files what you give it."
you_give:
  - What you learned or found
  - The notes folder and its index file, for example memory/ with MEMORY.md, or wiki/ with wiki/index.md. Confirm both before the first run.
  - Existing notes to update (optional)
you_get:
  - Small single-fact files
  - One-line descriptions and links
  - An updated index
  - Fewer duplicates
how_to_use:
  - "Gather the finding you want to keep. Pick where notes live: your AI's memory folder, or a shared wiki folder for your team. Confirm the folder and index file name first: usually memory/ with MEMORY.md for your AI's own notes, or wiki/ with wiki/index.md for a team. If the folder or index does not exist yet, ask your AI to create it first."
  - Paste this skill into your AI chat, or add it to your AI tool as a skill. The skill also names the skill writer and the research skills, but you do not need them.
  - Paste what you learned, or say "save this" at the end of a task. Share your existing notes if you have them.
  - Check that your AI searched for a similar note first, and updated it instead of making a copy.
  - Read the new file and the index line. Make sure the one-line description uses words you would search for.
  - After each session, check that every index line still links to a file that exists. If the facts came from research, run the "Deep research reporter" item in this library first (slug deep-research-reporter) and feed its findings in here.
  - This works best when your AI can read and save files. In a plain chat, copy the files it writes into your folder yourself.
output_sample:
  input:
    - What you learned or found, in plain words
    - "Where notes live: a memory folder or a shared wiki folder"
    - Existing notes to check for the same fact (optional)
  prerequisites:
    - An AI that can read and save files in a notes folder
  output:
    - name: Fact file
      contains: One lasting fact in its own file, with a short name, a one-line description and links to related notes.
    - name: Frontmatter
      contains: The note's name, a one-line description, and optional recheck date, replaced note, confidence and source.
    - name: Index line
      contains: One short line in the index with the title, the file name and a hook, under about 200 characters.
    - name: Updated existing file
      contains: If a note already covers the fact, it is changed instead of copied.
    - name: Skip decision
      contains: A plain call that nothing lasting came out of the task, so nothing is written.
