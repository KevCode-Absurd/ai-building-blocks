job: organise-work
headline: Notes wiki builder
subhead: Your AI remembers what it learned. Instead of one giant notes file that
  rots, you get small linked files and an index, so the next session finds the
  fact without redoing the work.
explain: |
  Your AI remembers what it learned. Instead of one giant notes file that rots, you get small linked files and an index, so the next session finds the fact without redoing the work.

  The rule is one fact per file. Each has a one-line description that recall matches against, [[links]] to related files, and a single index line. The hard part is discipline: only keep what is lasting, such as a tool that fails silently or a limit nobody wrote down. Update an existing file instead of making a near-copy. Skip routine work, since filler makes recall worse. You pick a store, either the agent's memory folder or a shared wiki folder, and compile before you close a task.
when:
  - You just finished research and want it available next week.
  - Your AI keeps re-learning the same hard-won fact.
  - You say "save this" and want it done in a consistent way.
  - Your single notes file is too long to be useful.
you_give:
  - What you learned or found
  - Where notes are stored (memory folder or wiki)
  - Existing notes to update (optional)
you_get:
  - Small single-fact files
  - One-line descriptions and links
  - An updated index
  - Fewer duplicates
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read and save files.
