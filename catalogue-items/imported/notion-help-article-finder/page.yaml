thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: notion-help-article-finder
name: Notion help article finder
summary: Find the Notion help articles that answer a customer question. You get links, key excerpts, a reply draft and gaps in your help content.
job: help-customers
headline: Notion help article finder
subhead: Give it a customer question. It searches your Notion help pages by exact title and by related words, then reads the best matches. You get links, excerpts, a reply draft and a list of gaps.
when:
  - A customer asks a question and you think the answer is already in your Notion help pages.
  - You need a quick reply that is based on your own articles.
  - You want to check whether a help article is out of date.
  - You want to spot topics your help pages do not cover yet.
not_for:
  - "You need to fix a product bug or a billing dispute: use your ticket system or ask a teammate who owns it."
  - "Your help articles are not in Notion: search that tool directly, or paste the article text into your AI and ask it to draft a reply."
  - "You want to write a new help article from scratch: write it yourself or ask your AI for a draft, then add it to Notion."
you_give:
  - The customer's question or topic.
  - Your Notion workspace with your help articles, connected through Composio.
you_get:
  - Links to the best matching Notion articles, with the date each was last updated.
  - Short excerpts from each article that answer the question.
  - A reply to the customer, drafted from those articles.
  - A list of missing or out-of-date help topics.
how_it_works:
  - title: Search the question
    text: Run composio search to find the Notion tools, then run NOTION_SEARCH_NOTION_PAGE with the exact title and then with related keywords.
  - title: Read the best matches
    text: Run NOTION_GET_PAGE_MARKDOWN on the top 3 to 5 pages and note their dates.
  - title: Draft a sourced answer
    text: Return article links, useful excerpts, a customer reply built only from those pages, and missing or outdated help topics.
works_best_with:
  tools:
    - name: Notion
      why: Live lookups need Composio CLI access and connected accounts for these services.
how_to_use:
  - Use an AI that can run commands and read files. A chat window alone will not work for live Notion search.
  - Composio is a separate service with its own plan and limits, so check its site before you start. Install the Composio CLI and link your Notion account. Your AI will ask you to run composio link notion if it is not linked.
  - Add the skill folder to your AI and ask for the Notion help article finder.
  - Type the customer's question or topic.
  - Read the excerpts and the reply draft. Check each against the linked article before you send anything.
  - Use the Gaps list to decide which help articles to write or update. Give each gap to one owner, and ask your AI for a short draft of the first missing article.
output_sample:
  input:
    - The customer's question or topic
    - Your Notion workspace, connected to the Composio tool
  prerequisites:
    - An AI that can run commands and read skill files
    - The Composio CLI installed, with your Notion account linked
    - Notion pages that hold your help content
  output:
    - name: Top Matches
      contains: The best 3 to 5 pages, each with its title, last updated date, how relevant it is, and a link.
    - name: Key excerpts
      contains: The parts of each page that answer the question, quoted as written.
    - name: How to use this
      contains: A short note under each match on how it helps answer the customer.
    - name: Suggested Response
      contains: A reply to the customer drafted from the articles found.
    - name: Gaps
      contains: Topics your help pages do not cover and articles that look out of date.
    - name: If nothing is found
      contains: Other search words to try and whether a new help article is worth writing.
