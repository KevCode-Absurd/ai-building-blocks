thinking_why: It follows a fixed file format.
new_slug: obsidian-canvas-maker
name: Obsidian canvas maker
summary: Make an Obsidian canvas file from a plain description. Get boxes, arrows and groups placed and ready to open as a mind map or flowchart.
job: organise-work
headline: Obsidian canvas maker
subhead: Describe a mind map, flowchart or project board and get a real Obsidian canvas file you can open straight away. The boxes, arrows and groups are already placed, so you only adjust the layout.
explain: |
  Describe a mind map, flowchart or project board and get a real Obsidian canvas file you can open straight away. The boxes, arrows and groups are already placed, so you only adjust the layout.

  A canvas file is plain JSON with a list of nodes and a list of edges. The skill gives every node a unique 16-character ID, sets its position and size, and picks a type such as text, note, link or group. It then draws edges between valid IDs, with labels if you want them. Before it hands the file over, it checks that the JSON parses and every edge points to a real node.
when:
  - You want to map a project plan as boxes and arrows inside your vault.
  - You have a topic outline and want it as a mind map in Obsidian.
  - An existing canvas needs three new nodes connected to what is there.
  - You want notes grouped by theme in labelled colour zones.
not_for:
  - "You want a drawing or whiteboard outside Obsidian: use a dedicated diagram tool instead."
  - "You only want a plain list of notes with no boxes or arrows: write an outline in a normal Obsidian note."
  - "You want a picture file such as a PNG or a PDF: export the canvas from Obsidian, or use a diagram tool."
you_give:
  - A description of what the canvas should show
  - The notes or text to put in the boxes
  - How things connect
  - An existing .canvas file to extend (optional)
you_get:
  - A valid .canvas file
  - Nodes with positions and sizes
  - Edges and labels
  - Groups to cluster related items
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into the chat.
  - Describe the map or flow you want. Add the text for each box and say how the boxes connect.
  - To extend a canvas, paste the contents of your existing .canvas file too (optional).
  - Ask your AI to save the result as a file ending in .canvas. If it can't save files, copy the text into a new file with that name.
  - Put the file in your Obsidian vault and open it. Drag boxes to adjust the layout.
  - If Obsidian shows an error, ask your AI to check for repeated IDs or arrows that point to missing boxes.
output_sample:
  input:
    - What the canvas should show, in plain words
    - The text or notes to put in the boxes
    - How the boxes connect
    - An existing .canvas file to add to (optional)
  prerequisites:
    - An AI that can save files, or you copy the result into a new file ending in .canvas
    - Obsidian on your computer to open the file
  output:
    - name: Nodes
      contains: Text, file, link and group boxes, each with a unique ID, a position and a size.
    - name: Edges
      contains: Arrows between boxes that point to real node IDs, with optional sides, ends and labels.
    - name: Groups
      contains: Labelled, coloured zones that hold related boxes together.
    - name: Colours
      contains: Preset colours 1 to 6 or hex colours on boxes, groups and arrows.
    - name: The .canvas file
      contains: One file in the JSON Canvas format that opens in Obsidian, checked against the skill's validation list.
