thinking: low
thinking_why: It follows a fixed file format with clear rules.
new_slug: obsidian-database-view-builder
name: Obsidian database view builder
summary: Build an Obsidian Base file for your notes. Say what to filter and show, and get table or card views with formulas and summaries.
job: organise-work
headline: Obsidian database view builder
subhead: A working Obsidian Base file that turns your notes into a table or card view, filtered and sorted the way you describe. No hand-written syntax needed.
explain: |
  A working Obsidian Base file that turns your notes into a table or card view, filtered and sorted the way you describe. No hand-written syntax needed.

  You say which notes to show, for example every note tagged task that is not done. The skill writes the filter, then adds formulas for things like days until due or an overdue flag. It sets display names for each column, chooses table or card layout, and adds summaries such as counts or averages at the bottom. It follows the Base file format closely, because small syntax slips make a view fail to load. It reads a detailed guide first and checks the finished file against it.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. Credit goes to the author, kepano, and the collection it came from.
when:
  - You track tasks in notes and want an overdue-first table.
  - You keep book or project notes and want a card gallery with ratings.
  - You need a formula column that works out days left from a due date.
  - You want totals or averages shown under a column.
not_for:
  - "You only want a plain list of notes: write a manual list or use Obsidian's built-in search instead."
  - "You already use Dataview queries and want to keep them: stay with Dataview, since this skill writes Bases files only."
  - "Your notes have no tags, folders or properties to filter on: add those first, or ask a person who knows your vault."
you_give:
  - Which notes to include, by tag, folder or property
  - The columns you want to see
  - Any calculations you need
  - A sample note with its properties (optional)
you_get:
  - A ready-to-open .base file
  - Filters that match your notes
  - Formula columns
  - Table or card views with summaries
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. Also give your AI references/detailed-guide.md from the skill folder. The steps depend on it.
  - Start small. Ask for one filter and one view first, and check that it loads in Obsidian before you ask for the full set of views.
  - Tell your AI which notes to show, which columns you want and any calculations. Paste one sample note with its properties if you can.
  - Ask for a .base file. Copy the result into a new file in your vault and name it with the .base ending.
  - Open the file in Obsidian. Check that each view loads and that the filters match your notes.
  - If a view fails or looks wrong, paste the error or a description back into the chat and ask for a fix. Then adjust columns or formulas and run it again.
  - Save a copy of the working .base file before you edit it further. Pair it with your note template so new notes get the same properties.
output_sample:
  input:
    - Which notes to include, by tag, folder or property
    - The columns you want to see
    - Any calculations you need, such as days until due (optional)
    - A sample note with its properties (optional)
  prerequisites:
    - Obsidian with the Bases feature turned on
    - An AI that can chat and write a text file
  output:
    - name: filters
      contains: The rules that pick which notes appear, such as a tag, a folder or a status that is not done.
    - name: formulas
      contains: Calculated columns, such as days until due or an overdue flag, built from your note properties.
    - name: properties
      contains: Display names that give each column a clear label.
    - name: views
      contains: One or more table or card views, each with its own filters, column order, grouping and sorting.
    - name: summaries
      contains: Totals or averages shown at the bottom of a column.
