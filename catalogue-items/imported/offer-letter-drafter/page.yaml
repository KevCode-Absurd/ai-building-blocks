thinking: medium
thinking_why: It combines pay terms with a careful tone.
new_slug: offer-letter-drafter
name: Offer letter drafter
summary: Draft an offer letter with a pay table and call talking points. Give it the role, level, location and pay. Have HR or a lawyer check it.
job: hire-people
headline: Offer letter drafter
subhead: A complete offer letter and pay package, ready for a quick review by HR or a lawyer. You give the role, level, location, pay and start date.
explain: |
  A complete offer letter and pay package, ready for a quick review by HR or a lawyer. You give the role, level, location, pay and start date. If you are missing details, the skill helps you work them out.

  It builds a pay table with base salary, equity and vesting, signing bonus, target bonus and the total for year one. Then it writes the terms: start date, who they report to, and conditions such as background checks. It also prepares talking points for the call where you share the offer, including how to answer likely pushback. Always have someone qualified check the final text before sending.
when:
  - A candidate has passed the final interview and you need the offer out today.
  - You are unsure how to combine base pay, equity and a signing bonus.
  - The hiring manager has to call the candidate and wants a short script.
  - You are setting up your first offer letter template.
not_for:
  - "You need final legal wording or your country's rules checked: use an employment lawyer or your HR platform."
  - "You have not yet agreed pay with the hiring team: settle the pay range with your manager or finance lead first."
  - "You need a contract for a freelancer or contractor: use a lawyer or a contract template from your legal adviser."
you_give:
  - The role and title
  - The level and location
  - Base pay, equity and bonus
  - Start date and hiring manager
you_get:
  - A drafted offer letter
  - A pay package table with first-year total
  - Terms and conditions text
  - Talking points for the offer call
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code or paid tools are needed.
  - Add the role, level, country or state, pay, start date and hiring manager. If you do not have a detail, say so. It is marked [TBC] and your AI will not invent pay, equity or start details.
  - Read the pay table first. Check that the first-year total adds up.
  - Read the letter and the notes for the hiring manager. Add something personal from the interview yourself.
  - Send the letter to HR or a lawyer to check before it goes to the candidate.
  - Once it is approved, send it, start the background check and onboarding steps, and log the offer in your hiring system.
output_sample:
  input:
    - The role and title
    - The level and location
    - Base pay, equity and any bonus
    - Start date and hiring manager
  output:
    - name: Compensation Package
      contains: A table of base salary, equity and vesting, signing bonus, target bonus and total first-year pay.
    - name: Terms
      contains: Start date, who they report to, location and type of employment.
    - name: Benefits Summary
      contains: Key benefits that matter to this candidate.
    - name: Offer Letter Text
      contains: The full letter, addressed to the candidate, ready for review.
    - name: Notes for Hiring Manager
      contains: Negotiation tips, pay band context and anything to flag before the offer call.
