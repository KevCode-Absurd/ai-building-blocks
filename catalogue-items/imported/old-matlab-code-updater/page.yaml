thinking: low
thinking_why: It swaps known old calls for new ones.
new_slug: old-matlab-code-updater
name: Old MATLAB code updater
summary: Update old MATLAB code that uses removed or discouraged functions. Give it your files and get current replacements, plus a list of each swap.
job: test-and-fix-code
headline: Old MATLAB code updater
subhead: Old MATLAB code rewritten with current functions, so it runs on new releases and stops giving warnings. It handles removed functions that now cause errors, and older ones that still work but have a better replacement.
explain: |
  Requires a licensed MATLAB install, ideally with MATLAB's code checker (the check_matlab_code tool). Without them the result is incomplete.

  It starts from the warnings in MATLAB's code checker. It swaps each flagged function for the modern one, in place. It also catches habits the checker misses, such as the old map container, the old array expansion helper, turning text into numbers with eval, and clearing everything at the top of a script. Examples include newer ways to read spreadsheets, handle dates and train neural networks. You need a licensed MATLAB install. Without MATLAB's code checker (the check_matlab_code tool), your AI can only spot old functions by reading the code, so it will miss some.

  This is MathWorks' skill. Licence: the LICENSE.md file in this item governs this copy. It is BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. The skill file header links MathWorks' own reuse licence, which says the same.
when:
  - Your old script errors on a new MATLAB release because a function is gone.
  - The code checker is full of warnings about discouraged functions.
  - You are migrating a lab's old analysis code.
  - A script uses clear all and eval and you want it cleaned up.
not_for:
  - "You want a general review of code quality: ask your AI for a plain code review, as this only swaps old functions."
  - "You want faster code that already works: use a MATLAB speed-tuning step, as this does not tune speed."
  - "You need to add or fix input checks on functions: use a MATLAB argument validation step, as this does not write those."
you_give:
  - The MATLAB files or code
  - The checker warnings, if you have them (optional)
  - The MATLAB release you target (optional)
  - Behaviour that must stay the same (optional)
you_get:
  - Updated code with current functions
  - "A list of each swap made: file and line, old call, new call"
  - Fixes for patterns the checker misses
  - Notes on any behaviour change
how_to_use:
  - Confirm which MATLAB release you target before you start. Some swaps only exist from a given release.
  - Open your AI tool. Paste in your MATLAB code, or upload the files.
  - Attach the skill folder (SKILL.md plus the guidance files in references), or paste SKILL.md, and ask your AI to follow it. Without MATLAB access it can still read your code and swap the old functions it knows, but it will miss some.
  - Add the checker warnings and your target MATLAB release if you have them (optional). If you do not know your release, say so. Your AI should then name the functions it is unsure about and ask you to check them in your release notes, instead of guessing.
  - Say which behaviour must stay the same, such as output format or file names.
  - Read the list of swaps and the behaviour notes before you accept the new code. Check that each new function exists in your target release, using MATLAB's documentation for that release.
  - Run the old and new code on the same inputs and compare the results. Your AI needs MATLAB access to run the code checker itself.
  - Next, use the MATLAB speed tuner for slow code, or the function argument checker writer to add input checks.
next: [matlab-speed-tuner, function-argument-checker-writer]
output_sample:
  input:
    - Your MATLAB files or code
    - The code checker warnings (optional)
    - The MATLAB release you target (optional)
    - Behaviour that must stay the same (optional)
  prerequisites:
    - An AI that can run MATLAB and its code checker, for the best results (optional)
  output:
    - name: Updated code
      contains: Your code with removed and discouraged functions swapped for current ones, edited in place.
    - name: List of swaps
      contains: "Each change made: the old call, the new call, and where it was."
    - name: Pattern fixes
      contains: Changes for habits the checker misses, such as containers.Map, bsxfun, str2num, eval and clear all.
    - name: Behaviour notes
      contains: Any place where the new function acts differently from the old one.
