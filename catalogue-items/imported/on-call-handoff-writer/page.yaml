new_slug: on-call-handoff-writer
name: On-call handoff writer
summary: Give it your shift alerts and open issues. Get a handoff note the next
  person can act on at once.
job: organise-work
headline: On-call handoff writer
subhead: A handoff note the next on-call person can read in two minutes and act
  on. It stops the usual loss of context when one shift ends and another begins.
explain: |
  A handoff note the next on-call person can read in two minutes and act on. It stops the usual loss of context when one shift ends and another begins.

  You paste in your alerts, open issues and anything you were investigating. The skill keeps only facts that are true for the shift you declare, and drops guesses. The note lists what is on fire now, what has been tried, what is waiting on someone else, and what might come up. It adds links, owners and the next step for each item, plus anything unusual coming up, like a planned release. It also helps you set up a steady routine for handoffs across the team.
when:
  - Your shift ends in an hour and an incident is still open.
  - You are new to on-call and do not know what to include in a handoff.
  - Your team's handoffs are chat messages that nobody can find.
  - You want a template every engineer uses the same way.
you_give:
  - Alerts from your shift
  - Open incidents and tickets
  - What you tried and what you found
  - Upcoming changes or risks (optional)
you_get:
  - A one-page handoff note
  - A list of open items with owners and next steps
  - Things to watch in the next shift
  - A reusable handoff template
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
