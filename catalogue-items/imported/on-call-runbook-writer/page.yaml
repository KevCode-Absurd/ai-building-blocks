thinking: medium
thinking_why: It fills a fixed template with exact steps and checks.
new_slug: on-call-runbook-writer
name: On-call runbook writer
summary: Write an on-call runbook for your service. You get numbered steps, checks, rollback and who to call, so anyone on call can fix it fast.
job: document-work
headline: On-call runbook writer
subhead: A runbook that a tired person can follow at 3am without asking anyone. You describe a service or a process and get plain, numbered steps with the checks and fixes written out.
explain: |
  A runbook that a tired person can follow at 3am without asking anyone. You describe a service or a process and get plain, numbered steps with the checks and fixes written out.

  A good runbook answers a few things quickly: what this service does, how to tell it is broken, how to fix the common failures, and who to call when the fix does not work. The skill writes each step so it can be done in order, with the exact command or screen and what a good result looks like. It adds troubleshooting trees for known problems, recovery steps, and rollback. The AI only writes the document. It does not touch your systems, but the commands in the runbook need access such as kubectl, a cloud command line or database rights. Examples in the skill use placeholder host names. Some sample steps are destructive, so test them in staging with a second person.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to BagelHole and sickn33.
when:
  - Only one person knows how to restart your main service.
  - An incident exposed that your recovery steps live in someone's head.
  - You are setting up a new service and want a runbook before launch.
  - Your old runbook is long and nobody reads it.
not_for:
  - "You need the vendor's own incident steps for a cloud or SaaS product: use the vendor's incident docs."
  - "Your service has no known failure modes yet: write a post-incident review after the first outage, then build the runbook from it."
  - "You need the AI to run commands on your systems: use a person with access, because this only writes the document."
you_give:
  - The service or process to cover
  - The commands you use, and the access each one needs
  - Your dashboards and contacts
  - Who is on call
  - Known failure modes and past incidents (optional)
you_get:
  - A numbered runbook
  - Troubleshooting steps for common failures
  - Recovery and rollback steps
  - An escalation contact list
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text. No code runs and no files are needed.
  - Describe your service. Add the commands, dashboards, contacts and any past incidents.
  - Read the runbook. Replace every placeholder host name, ID and phone number with your real ones. The sample commands in the skill (scaling to zero, a DNS change, promoting a replica, a disk cleanup) are examples only. Do not copy them into a live runbook unchanged.
  - Test it in staging first. Have someone who did not write it follow it step by step.
  - Fix any step that was unclear, then save it where your on-call team can find it.
  - Next, after each real incident, write a post-incident review with the Incident postmortem writer and update the runbook from what you learn.
next: [incident-postmortem-writer]
output_sample:
  input:
    - The service or process you want covered
    - The commands you use and the access they need
    - Your dashboards and who is on call
    - Known failure modes and past incidents (optional)
  prerequisites:
    - A staging copy of your service to test the runbook before real use
  output:
    - name: Overview
      contains: What the service does, why the runbook exists, who owns it, and how serious an outage is.
    - name: Prerequisites
      contains: A checklist of the access, tools, network and chat channel needed before you start.
    - name: Procedure
      contains: Numbered steps, each with the exact command and what a good result looks like.
    - name: Verification
      contains: Checks that confirm the fix worked, such as a health check and clean logs.
    - name: Rollback
      contains: Steps to undo the change if the fix fails or causes new problems.
    - name: Troubleshooting
      contains: A table of symptoms, likely causes and fixes for the most common failures.
    - name: Escalation
      contains: Who to call first and next, and how many minutes to wait before calling.
    - name: Related runbooks and change log
      contains: Links to linked runbooks and a dated list of edits.
