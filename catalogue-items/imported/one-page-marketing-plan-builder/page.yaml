thinking: medium
thinking_why: It fills a fixed nine-box plan from your answers.
new_slug: one-page-marketing-plan-builder
name: One-page marketing plan builder
summary: Build a one-page marketing plan with nine squares, from stranger to loyal fan. Get a score out of ten and the gaps to fix first.
job: plan-strategy
headline: One-page marketing plan builder
subhead: Your whole marketing plan on one page, from a stranger who has never heard of you to a customer who tells friends. It is a grid of nine squares, and each square has one job.
explain: |
  Your whole marketing plan on one page, from a stranger who has never heard of you to a customer who tells friends. It is a grid of nine squares, and each square has one job.

  The squares sit in three groups. Before: who you target, your message, and the media you use to reach them. During: how you capture leads, nurture them and convert them. After: how you deliver, grow the order value, and get referrals. You fill in each square with something specific. The skill then scores the plan from zero to ten by counting how many squares are specific and measurable. Most weak plans fall down in the after stage.
when:
  - Your marketing is a mix of posts and ads with no plan behind it.
  - You are launching a business and need a plan that fits on one page.
  - You want to know why customers buy once and never return.
  - You need a simple plan to share with a partner or a new hire.
not_for:
  - "You already have a tested marketing plan that works: keep it and fix only the weak spots with a person you trust."
  - "You only need ad words or a message: write that one piece in your AI chat without the full plan."
  - "You want a long report with market research: hire an analyst or run your own customer interviews first."
you_give:
  - What your business sells
  - Who your best customer is
  - What marketing you do today
  - Your budget and goals (optional)
you_get:
  - A one-page nine-square plan
  - A score out of ten
  - The weakest squares named
  - Next actions for each gap
how_to_use:
  - "Gather your notes first: your best customer type, the marketing you do now, and any sales numbers."
  - Open Claude, ChatGPT or Gemini. Paste in the skill text from this page. No code or paid tool is needed.
  - Paste your business details. Say what you sell, who buys, and what you do today.
  - Answer any questions your AI asks. If you skip a detail, it should mark that square as missing, not guess.
  - Read the score and the weakest squares. Fix the lowest square first, then ask your AI to score the plan again.
output_sample:
  input:
    - What your business sells
    - Who your best customer is
    - What marketing you do today
    - Your budget and goals (optional)
    - Your sales numbers (optional)
  output:
    - name: The 9-square grid
      contains: "One page with nine squares: target market, message, media, lead capture, nurture, conversion, experience, lifetime value and referrals."
    - name: Score
      contains: A score from 0 to 10 based on how many squares are specific and measurable.
    - name: Weakest squares
      contains: The squares that failed the check, with a short note on why each one is vague.
    - name: Next actions
      contains: One clear step for each gap, aimed at reaching a full score.
