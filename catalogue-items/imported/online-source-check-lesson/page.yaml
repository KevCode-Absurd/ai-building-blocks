thinking: medium
thinking_why: It adapts a known method to your learners.
new_slug: online-source-check-lesson
name: Online source checking lesson builder
summary: Build an online source checking lesson for your class. Teach learners to check a website or post by reading what other sources say about it.
job: teach-and-train
headline: Online source checking lesson builder
subhead: Describe your learners. Get a lesson that teaches them to check websites and posts by reading across other sources. Bring age or level of your learners. Use the result to plan your next step.
explain: |
  A lesson that teaches students to judge a website or post by leaving it and checking what others say, the way professional fact checkers do. Reading the page harder does not work. Looking across other sources does.

  You describe your learners and the kind of source, such as a news site, a social post or a health page. The skill builds a protocol around lateral reading: stop and ask who is behind it, investigate the source in a new tab, find better coverage, and trace claims back to the original. It adds practice examples, prompts for students to explain their reasoning, and a checklist students use on their own. It draws on published research on how students evaluate online information.

  This is a copy of Gareth Manning's source-credibility-evaluation-protocol (CC BY-SA 4.0, see the LICENSE file), with a plain name and a note that its sample source is made up. The method is his.
when:
  - Your students trust the first search result they see.
  - You teach media literacy and need a hands-on activity.
  - A class has to judge a viral post for a project.
  - You want a simple routine learners can repeat on any website.
not_for:
  - "You need to assess university-level sources or run primary research: use a subject-specific method or ask a librarian."
  - "You want to check one claim yourself right now: search the claim in a new tab and read two trusted sources."
  - "You need a full unit across many weeks: use this for one lesson, then plan the rest with your own team."
you_give:
  - Age or level of your learners
  - The type of source to study
  - Topics that matter to your class (optional)
you_get:
  - A lesson plan on lateral reading
  - A step-by-step checking routine
  - Practice sources and prompts
  - A way to check understanding
how_to_use:
  - "Gather three things: the age or year group of your learners, the type of source, and why they are checking it."
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code or paid tools are needed.
  - Type your three details. The source gives about 3 minutes of teacher time to get the lesson, and the checking routine takes learners 3 to 5 minutes per source in class. Add the topic and any mistakes you have seen, if you like (optional).
  - "Read what comes back: the steps, a script for you to model, red and green flags, and a student checklist."
  - Check the example source in the script. The sample in the skill uses a made-up website, trade body and study. Do not teach them as facts. Replace them with a source you have checked yourself.
  - Check the lesson against the four moves: Stop, Investigate the source, Find better coverage, Trace claims. If the AI's version drifts from them, ask it to rewrite the lesson around those four moves.
  - Print the checklist. Model the steps on one source, then let learners try it on their own.
  - Next, teach learners to check AI answers with the AI claim fact-check lesson builder.
output_sample:
  input:
    - The age or year group of your learners
    - The type of source they will check, such as a website or social post
    - Why they are checking it, such as a class project
    - The topic or a short description of the source (optional)
    - Mistakes you have seen in your class (optional)
  output:
    - name: Source Evaluation Protocol
      contains: A short set of steps for checking this type of source by leaving the page and reading other sources.
    - name: Teacher Modelling Script
      contains: Words you can say aloud while you show the steps on one example source.
    - name: Red Flags and Green Flags
      contains: Signs that a source may be weak, and signs that it may be sound.
    - name: Student Checklist
      contains: A short list learners tick off as they check a source on their own.
    - name: Known Limitations
      contains: Where the method falls short, so you know when to add something else.
next: [ai-fact-check-lesson]
