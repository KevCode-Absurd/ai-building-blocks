thinking: medium
thinking_why: It sorts your store into a type first, then applies the right rules.
new_slug: online-store-auditor
name: Online store auditor
summary: "Run an online store audit: describe what you sell and who buys. Get ranked calls on marketing channels, homepage layout, trust signals and marketplaces."
job: run-your-store
headline: Online store auditor
subhead: Describe your store. Get ranked calls on marketing channels, homepage layout, trust signals and marketplaces. Bring what you sell and who buys. Use the result to plan your next step.
explain: |
  Ranked answers to the big whole-store questions: where to spend marketing money, how to lay out the homepage, which trust signals to show, and whether to sell on a marketplace. All of them depend on what kind of store you run, so it classifies first.

  The skill asks what you sell, who buys it, how big you are and whether the product is high-tech. It uses that to pick a path, then gives calls on channel mix across social, search, comparison sites and marketplaces. It reviews homepage and category layout, carousels, recommendation labels and visual style. It also names the trust signals that work for your kind of product and says whether a marketplace listing fits your margin.
when:
  - You do not know whether Instagram or search deserves your next ad dollar.
  - Your homepage has a carousel and you wonder if it helps.
  - You are deciding whether to list on a big marketplace.
  - Customers hesitate and you need better trust signals.
not_for:
  - "You want to fix one product page: use the Product page auditor."
  - "You want to fix your cart or checkout form: use the Checkout page auditor."
  - "You need help with prices, discounts, shipping, returns or loyalty: this audit does not cover them. Use the After-purchase experience planner or the SaaS pricing strategist."
you_give:
  - What you sell and who buys, with your store link or pasted homepage text if you have it
  - Company size, and whether your product is high-tech
  - Current channels and homepage layout
  - Gross margin and your product category
you_get:
  - A store classification
  - Ranked marketing channel calls
  - Homepage and category layout advice
  - Trust signal and marketplace recommendations
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. No code or paid tools are needed.
  - Describe what you sell, who buys it, your size, channels, homepage and margin. Say so if you do not know something.
  - Read the store classification first. Check that it matches how your buyers see your product.
  - Some numbers are measured findings and some are practitioner tips. The sources are listed in reference.md in the skill folder. The warranty figure has no named authors, and the perfume and sustainability figures have no source on file, so treat them as tips and do not quote them. State a sustainability claim only if you hold evidence, and check local advertising rules first.
  - Only offer a warranty or guarantee you can honour. Check any claim against your real product results.
  - Use a human label like "Picked by our team" only if real people chose or reviewed the picks. Never put it on picks a computer made. Then work the priority table from the top, one change at a time, and use the Product page auditor or Checkout page auditor for the weak areas.
output_sample:
  input:
    - What you sell and who buys it
    - Your company size, and whether your product is high-tech
    - Your current marketing channels, homepage layout and recommendation label
    - Your gross margin (optional)
    - Any real sustainability practice, and whether you sell on a marketplace (optional)
  output:
    - name: Store classification
      contains: Whether your product is bought for enjoyment or to do a job, which drives the other calls.
    - name: Priority table
      contains: Each row has a priority, an area, a recommendation, and the rule and number behind it.
    - name: Channel mix
      contains: Where to put marketing money, based on your product type.
    - name: Layout and label calls
      contains: Carousel or grid, visual style and how to label recommended products.
    - name: Trust and marketplace calls
      contains: Which trust signals to show and whether a marketplace listing suits your margin.
    - name: What to leave alone
      contains: Parts of your store that already work, with the reason to keep them.
