thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: open-library-book-and-edition-finder
name: Open Library book and edition finder
summary: Find a book, its editions, author details and cover links from a title, author or ISBN. Uses the free Open Library catalog. No account needed.
job: research-topics
headline: Open Library book and edition finder
subhead: Share a book title, author, ISBN, or Open Library record number. It looks up the public catalog and follows links between books, editions, and authors. You get matching records and source details. Live lookups need Python, its requests package, and internet access.
not_for:
  - You run a library system, such as Koha, MARC batch work or patron records. Ask your library system vendor or admin team instead.
  - You need paid book data feeds, such as ISBNdb or Google Books. Use that provider's own service.
  - You want to manage your own Open Library reading lists or account. Do that by signing in on the Open Library site.
you_give:
  - A title, author, ISBN, or Open Library identifier, plus desired language or result limit.
you_get:
  - Book and author matches, edition details, public ratings when available, and cover links.
how_it_works:
  - title: Choose the lookup
    text: Decide whether the task is a title search, author search, ISBN match, edition list, or rating lookup.
  - title: Follow the right records
    text: Keep book works, editions, and authors distinct. Follow merged or redirected records instead of assuming a match.
  - title: Return sourced book details
    text: Show the requested fields, missing information, and original record links without claiming a book was borrowed.
works_best_with:
  tools:
    - name: Python with requests and internet access
      why: The included lookup helper needs these tools. Offline instruction checks do not prove that live catalog access works.
how_to_use:
  - Add the skill to an AI that can read it and run its helper script. The folder includes the helper.
  - The bundled helper needs Python 3.8 or later, the requests package, and internet access for live catalog lookups.
  - Check the setup first. Ask your AI to run the helper with --help. If that fails, Python or the requests package is missing.
  - Give a title, author, ISBN, or record number. Say whether you want a work, one edition, all editions, or author details. A work is a book as an idea, an edition is one printing of it, and each has its own ID.
  - Ask for source record links and missing details. An offline plan does not mean a lookup has run.
  - Next, use the work key it finds to list every edition or read the ratings. Or take the ISBN and cover links to your library or bookshelf tool.
output_sample:
  input:
    - A book title, author name or ISBN
    - An Open Library record number (optional)
    - Your language or result limit (optional)
  prerequisites:
    - An AI that can run code, with Python 3.8 or later and the requests package
    - Internet access for live lookups
  output:
    - name: Book search results
      contains: Matching books with title, authors, first year published, edition count and the work key.
    - name: Author details
      contains: Bio, dates and photo link for an author, or a list of name matches.
    - name: Work record
      contains: Description, subjects and cover link for one book across all its editions.
    - name: ISBN match
      contains: The edition your ISBN points to, with its work and author keys and cover link.
    - name: Edition list
      contains: Publisher, date and ISBN for each edition of a work, with a way to page through more.
    - name: Ratings
      contains: Average rating, star counts and how many people want to read, are reading or have read it.
