thinking: high
thinking_why: It reproduces bugs, writes patches and has to judge its own work.
new_slug: open-source-contribution
name: Open-source contribution preparer
summary: Prepare a fix for an open-source issue you don't own. Get a checked patch and a drafted pull request that waits for your approval.
job: test-and-fix-code
headline: Open-source contribution preparer
subhead: A careful way to prepare a fix for someone else's open source project, ending at a queue item that you approve. The agent never posts anything itself.
explain: |
  Setup needed before the first run. The full method needs four things that are not in the download: a private approval queue repo, a poster (the tool that sends approved items), a read-only access token and a browser tool. Without them, run only the policy and reproduction checks and post the draft yourself. You must also run the write-refusal test on your token yourself (the skill gives the command, and the agent never runs it). It should return 403, which shows the token cannot write. If it returns 422, the token can write, so stop and replace it.

  It works in gates. First it checks whether the project allows AI-assisted pull requests. Then it asks the maintainer for a go-ahead if needed, checks for duplicate work, and reproduces the bug. Only then does it write a small patch, rerun the tests, and draft a pull request with the right disclosure note. It also handles follow-ups on your own pull requests: replies to reviews, a 14-day ping and a 28-day close. It refuses unasked refactors or features in other people's repos.
when:
  - You found a bug in a project you do not maintain and want to fix it properly.
  - You need to know if a repo accepts AI-assisted pull requests first.
  - You want a ready draft but need to approve before anything is posted.
  - A maintainer has not replied to your pull request and you need a follow-up.
not_for:
  - "You maintain the repo and want a pull request reviewed: use the Bug and security code reviewer or ask a teammate."
  - "You want to update packages or lockfiles in your own project: use a dependency update skill, not this one."
  - "You want to add a new feature or refactor code in someone else's repo: this skill refuses that, so open a discussion with the maintainer first."
you_give:
  - The repo and the issue link
  - A bug you can reproduce, or permission to search open issues
  - Your approval queue details
  - Disclosure wording for the project (optional)
you_get:
  - A policy and duplicate check
  - A reproduction of the bug
  - A tested patch
  - A pull request draft held for your approval
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in. Use an AI that can run code and read the repo.
  - "What you need that is not in the download: a private approval queue repo, the queue's poster (the tool that sends approved items), a read-only token and a browser tool. Without a queue and poster, the run stops at the drafted text and you post it yourself."
  - Tell your AI the repo, the issue link and where your queue lives. Add the project's disclosure wording if you have it.
  - Let it work through each check in order. It stops at the first one that fails and tells you why.
  - Read the queue item. Check the policy, the repro and the draft text.
  - Approve the item. With a queue, the queue's poster sends the approved text. Without one, you post it yourself. The AI never posts for you.
output_sample:
  input:
    - The repo name and the issue link
    - A bug your AI can reproduce, or a request to search open issues (one of these)
    - Your approval queue details
    - The project's disclosure wording for AI help (optional)
  prerequisites:
    - An AI that can run code and read the repo
    - A private queue repo where drafts are filed for your approval
    - A read-only access token for the repo
    - A browser tool, if the bug only shows in a browser
  output:
    - name: Queue item
      contains: One markdown item for your approval queue with the gate results, the disclosure note and the exact text to post.
    - name: Policy check
      contains: What the project says about AI-assisted pull requests, with a citation, and whether work may go ahead.
    - name: Intake comment
      contains: A short note asking the maintainer for a go-ahead before any patch is written, when the project wants one.
    - name: Reproduction record
      contains: The steps and result that show the bug is real, before any fix is written.
    - name: Patch and test results
      contains: A small fix, the repo's own checks, and an independent rerun by a second reviewer.
    - name: Pull request draft
      contains: The exact text to post, with the right AI disclosure, and a hash so you can tell if it changed.
    - name: Stop report
      contains: If a gate fails, the gate, the reason, the evidence link and what would clear it. It is not filed as a queue item.
    - name: No-eligible-candidate report
      contains: If a search finds no issue that passes every gate, each candidate checked with the gate it failed and the evidence, plus what would change the result. It is not filed either.
