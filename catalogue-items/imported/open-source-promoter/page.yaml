thinking: medium
thinking_why: It matches advice to the project and its audience.
new_slug: open-source-promoter
name: Open source promoter
summary: Give it your open source project. Get a plan to win stars, users and
  contributors without sounding pushy.
job: grow-social
headline: Open source promoter
subhead: A plan to get your open source project noticed, used and contributed
  to, without coming across as pushy. Developers can smell hype, so the plan is
  built on being useful.
explain: |
  A plan to get your open source project noticed, used and contributed to, without coming across as pushy. Developers can smell hype, so the plan is built on being useful.

  The skill starts by working out who would use the project, where they spend time, what they use today and how they judge a project: stars, recent activity, docs and community. It then covers your GitHub page, a readme that answers a visitor in seconds, easy first issues for new contributors, a launch plan, and how to keep going after launch. It suggests how to talk about the project on developer forums and social channels in a way that feels like sharing, not selling.
when:
  - You built a useful tool and nobody knows it exists.
  - Your repo has stars but no contributors.
  - You are planning a launch on a developer forum.
  - Your readme gets visitors but few of them try the project.
you_give:
  - Your project and what it does
  - Who you think uses it
  - Where the project is hosted
  - Your time per week (optional)
you_get:
  - A promotion plan
  - A readme and repo page checklist
  - Contributor-friendly issue ideas
  - A launch and follow-up schedule
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
