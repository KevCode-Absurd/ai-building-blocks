thinking: low
thinking_why: It looks up official docs and reports them.
new_slug: openai-docs-guide
name: OpenAI docs guide
summary: Ask how to build with OpenAI and get current answers with links to the official docs, plus the right model for your job.
job: build-software
headline: OpenAI docs guide
subhead: Current, cited answers about building with OpenAI, pulled from the official developer docs at the moment you ask. Models and APIs change fast, so answers from memory go stale.
explain: |
  Current, cited answers about building with OpenAI, pulled from the official developer docs at the moment you ask. Models and APIs change fast, so answers from memory go stale.

  The skill searches the docs through the OpenAI developer docs server, then reads the full page before it answers. For API questions it checks the official API spec for fields and parameters. For model choices, it reads the latest model guide first and keeps any model you name. It covers products such as the Responses API, the Chat Completions API, the Apps SDK and Codex, and helps plan upgrades from one model to another, including prompt changes. It needs the docs server connected. Licence: Apache-2.0 (see the LICENSE file). Credit goes to OpenAI.
when:
  - You need to know which OpenAI model suits your task today.
  - An API call fails and you want to check required fields.
  - You plan to move to a newer model and need the migration steps.
  - You want to build a ChatGPT app and need the right starting point.
not_for:
  - "You use another AI provider such as Anthropic or Google: read that provider's own developer docs instead."
  - "You have no internet and no docs server: ask a developer on your team, or check the docs later when you are online."
  - "You want someone to write and run your whole app: use a developer or a coding assistant, and use this only to check facts."
you_give:
  - Your question about OpenAI products or the API
  - What you are building (your use case)
  - The model you use now or want (optional)
you_get:
  - An answer based on current official docs
  - Links to the pages used
  - A model recommendation
  - Migration and prompt upgrade steps
how_to_use:
  - "Gather first: your exact question, the OpenAI product or API you use, and the model you use now."
  - Use an AI agent that can run tools and reach the OpenAI developer docs server (a connection to OpenAI's official docs), such as Codex. A plain chat window cannot run the lookup tools. Agents like Codex may need their own account or paid plan.
  - The skill can run small scripts that come with it. They save a temporary copy of the Codex manual in your computer's temp folder. The agent needs permission to run commands for that. If it has none, it uses the docs server instead.
  - Connect the OpenAI docs server in your agent's settings. Check your tool's own guide for the exact steps.
  - Add this skill to your agent, or paste its text into the chat. This is an imported OpenAI skill file, written for your AI agent, not for you to read as a guide. Paste or install it, then read only the answer and its links. You get the answer, the links, then the model advice, API check and upgrade steps if your question needs them. Your agent asks you before it installs the docs server, and installing it is your choice.
  - Ask your question. Say what you are building and which model you use now, if any.
  - Check the links in the answer. Open the main page to confirm it matches what you asked.
  - If you cannot connect the docs server, ask your AI to search only official OpenAI sites. Treat the answer with more care.
  - Take any upgrade steps or API fixes to your developer. Test them in a non-production setup first.
output_sample:
  input:
    - Your question about OpenAI products or the API
    - What you are building (your use case)
    - The model you use now or want (optional)
  prerequisites:
    - An AI agent that can reach the OpenAI developer docs server
    - Web access to official OpenAI sites, as a fallback
  output:
    - name: Answer
      contains: A plain answer to your question, based on the official OpenAI docs read at the time you ask.
    - name: Citations
      contains: Links to the official doc pages the answer came from.
    - name: Model recommendation
      contains: The model that fits your use case, read from the latest model guide. A model you name is kept.
    - name: API check
      contains: The fields and parameters an API call needs, checked against the official API spec.
    - name: Upgrade steps
      contains: What to change to move to a newer model, including changes to your prompts.
