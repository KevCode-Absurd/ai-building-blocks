thinking: high
thinking_why: Optical design needs expert choices and tradeoffs.
new_slug: optical-system-designer
name: Optical system designer
summary: Build, trace and tune a lens design in MATLAB. Give it a lens spec or Zemax file and get an optical system model with tolerance results.
job: build-software
headline: Optical system designer
subhead: Describe your lens setup or share a Zemax file. Your AI builds the optical system in MATLAB, checks it, and tunes it. You skip hand-building every surface and plot.
explain: |
  Describe the lens setup you want and get a working optical model in MATLAB that has been traced, toleranced and tuned. It saves you from hand-building every surface and chart.

  The skill uses the MATLAB optics library. It builds the system from surfaces and glass catalogues, imports Zemax files, then runs the standard checks: spot diagrams, ray fans, distortion, chromatic aberration and astigmatism. It can also test coatings and polarisation, run tolerance studies to see how much error the design can take, and optimise parameters to improve the result. It covers geometric optics only, not wave optics, fibre or photonics. You need MATLAB with the optics add-on installed, which is a paid add-on. This is a MathWorks skill, copied under a licence that lets you use it only with MathWorks products.
when:
  - You are designing a camera lens and need to see its flaws, called aberrations.
  - You have a Zemax file and want to study it in MATLAB.
  - You need to know how much manufacturing error a design can take.
  - You want to tune lens spacing and curvature to shrink the spot size.
not_for:
  - You need wave optics, such as diffraction or interference. Use a wave optics tool built for that.
  - You work with fibre optics or photonics. Use a photonics design tool instead.
  - You need to clean up or analyse photos. Use an image processing tool, such as the MATLAB Image Processing Toolbox.
you_give:
  - Your lens spec or a Zemax file
  - Wavelengths and field angles
  - Focal length and aperture or F-number
  - Glass choices (optional)
  - Targets such as spot size (optional)
you_get:
  - A built optical system in MATLAB
  - Spot diagrams, ray fans and distortion plots
  - Tolerance results
  - A tuned design with the changed parameters listed
how_to_use:
  - Check you have MATLAB and the Optical Design and Simulation Library. It is a paid add-on. Note your versions.
  - Gather your wavelengths, field angles, focal length and aperture or F-number. Or find your Zemax file.
  - Open an AI that can run MATLAB code. Paste this skill, then add your details or file.
  - "Work in this order. First give the file or lens spec. Then list the wavelengths and field angles. Next name the analysis to run: spot diagrams, ray fans or distortion. Last ask for tolerances, then tuning. You get a MATLAB script and a summary of the results, such as spot size per field, distortion and tolerance findings."
  - Check the plots against your targets. Then ask your AI to run the tuning again with tighter targets.
  - Next, review the tolerance results with your optics team before you build a prototype.
output_sample:
  input:
    - Your lens spec or a Zemax file
    - Wavelengths and field angles
    - Glass choices (optional)
    - Targets such as spot size or focal length (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with the Optical Design and Simulation Library installed (a paid add-on)
  output:
    - name: Optical system
      contains: The lens built from surfaces and glass, or imported from your Zemax file, with semi-diameters set.
    - name: Analysis plots
      contains: Spot diagrams, ray fans, distortion, chromatic aberration and astigmatism for your fields and wavelengths.
    - name: Coating and polarisation results
      contains: Coating performance and Fresnel coefficients, when your task includes coatings.
    - name: Tolerance results
      contains: How much manufacturing error the design can take before it fails your targets.
    - name: Optimised design
      contains: The tuned system with the changed parameters, such as spacing and curvature, listed.
