new_slug: optical-system-designer
name: Optical system designer
summary: Describe the lens setup. Get an optical system built, traced,
  toleranced and tuned in MATLAB.
job: build-software
headline: Optical system designer
subhead: Describe the lens setup you want and get a working optical model in
  MATLAB that has been traced, toleranced and tuned. It saves you from
  hand-building every surface and chart.
explain: |
  Describe the lens setup you want and get a working optical model in MATLAB that has been traced, toleranced and tuned. It saves you from hand-building every surface and chart.

  The skill uses the MATLAB optics library. It builds the system from surfaces and glass catalogues, imports Zemax files, then runs the standard checks: spot diagrams, ray fans, distortion, chromatic aberration and astigmatism. It can also test coatings and polarisation, run tolerance studies to see how much error the design can take, and optimise parameters to improve the result. It covers geometric optics only, not wave optics, fibre or photonics. You need MATLAB with the optics add-on installed.
when:
  - You are designing a camera lens and need to see its aberrations.
  - You have a Zemax file and want to analyse it in MATLAB.
  - You need to know how much manufacturing error a design can survive.
  - You want to tune lens spacing and curvature to shrink the spot size.
you_give:
  - Lens specification or a Zemax file
  - Wavelengths and field angles
  - Glass choices (optional)
  - Targets such as spot size or focal length (optional)
  - MATLAB with the optics add-on
you_get:
  - A built optical system
  - Spot diagrams and ray fan plots
  - Tolerance analysis results
  - An optimised design with changed parameters
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with the Optical Design and
    Simulation Library.
