new_slug: optimization-problem-solver
name: Optimization problem solver
summary: Describe what to minimise and your limits. Get the problem set up,
  solved and the result checked.
job: build-software
headline: Optimization problem solver
subhead: MATLAB code for an optimisation problem that is set up properly, solved
  with a suitable solver and checked before you trust it. It avoids common traps
  like the wrong method or a bad stop.
explain: |
  MATLAB code for an optimisation problem that is set up properly, solved with a suitable solver and checked before you trust it. It avoids common traps like the wrong method or a bad stop.

  The skill first sorts your problem into a class, such as linear, quadratic or nonlinear. That decides the solver and whether the answer is global or only local. It writes the problem with optimization variables and expressions, not slow loops, then picks and tunes solver options and runs it. It reads the exit flag, constraint violations and convergence, and helps debug failures. It also spots hidden easier forms, like a nonlinear problem that is really linear. Needs MATLAB with Optimization Toolbox.
when:
  - You have an objective and constraints and need them coded in MATLAB.
  - Your solver stops with an odd exit flag and you do not know why.
  - You are unsure which solver or algorithm suits your problem.
  - Your code loops over variables and runs far too slowly.
you_give:
  - What to minimise or maximise
  - Variables and bounds
  - Constraints
  - Any existing MATLAB code (optional)
  - MATLAB with Optimization Toolbox
you_get:
  - The problem class and solver choice
  - Working MATLAB code
  - The solution
  - A check of convergence and constraint satisfaction
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with the Optimization Toolbox.
