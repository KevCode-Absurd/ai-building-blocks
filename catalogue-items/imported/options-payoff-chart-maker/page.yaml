thinking: medium
thinking_why: It follows set pricing formulas and builds a chart.
new_slug: options-payoff-chart-maker
name: Options payoff chart maker
summary: Turn your option strikes and prices into a payoff chart that shows what the trade earns or loses. Sliders let you test price, time and volatility.
job: money-and-investing
headline: Options payoff chart maker
subhead: An interactive chart of what your options trade makes or loses, drawn from the strikes and prices you already have. Drag sliders and watch the lines move.
explain: |
  An interactive chart of what your options trade makes or loses, drawn from the strikes and prices you already have. Drag sliders and watch the lines move.

  Send a text description or a broker screenshot. The skill reads the strategy type, underlying, strikes, premium, quantity, expiry and implied volatility, and fills gaps with sensible defaults. It plots a dashed line for profit at expiry and a solid line for today's theoretical value using the Black-Scholes model. Sliders change spot price, volatility and days left. Stats show max profit, max loss, break-even points and current profit or loss. It may fetch a live quote for spot price. Educational only, not advice.
when:
  - You opened a spread and want to see the risk shape.
  - You have a broker screenshot and want a clearer chart.
  - You want to see how the trade changes as time passes.
  - You need break-even prices before placing the trade.
not_for:
  - "You only hold stock and no options: use your broker's own chart or a simple profit and loss sum."
  - "You want to place or send a trade: use your broker, since this only draws a chart."
  - "You are about to make a live trading decision, or you sell naked options and carry assignment risk: check the numbers in your broker's own risk tool first. Options can lose more than you paid."
  - "You have margin or assignment questions: use your broker's own risk tool or ask your broker."
you_give:
  - Strikes and expiry
  - Premium paid or received
  - Quantity
  - Ticker and spot price (optional)
  - Implied volatility (optional)
you_get:
  - An interactive payoff chart
  - Expiry and theoretical value lines
  - Max profit, max loss and break-evens
  - Sliders for price, volatility and time
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick one that can show charts or save an HTML file.
  - Paste the skill text into the chat, or upload the skill folder.
  - "Type your trade: strategy, ticker, strikes, expiry, premium and quantity. Or add a broker screenshot."
  - Check the strategy summary. Your AI must ask for premium and quantity. Any other value you did not give, such as volatility, spot or days left, is a default guess. Replace it with your real number. Do not use the chart for a live trade while any guessed value is left.
  - Drag the sliders to see how price, volatility and time change the lines.
  - If you do not name the ticker, your AI asks you. It does not assume one. A live price quote needs a host that can run shell commands and Python with yfinance (for example Claude Code or another coding tool, not a plain chat window). The quote probe only runs for SPX, or for a ticker you ask for. For any other ticker, or without a shell, type your spot price yourself. It reads an unofficial feed from a third-party site that can change or block requests. Without it, type your spot price. Before you place or close any trade, take the break-even and max loss figures to your broker and check premium and volatility against live quotes. This is for learning, not advice. Then re-run the chart with the live premium and volatility from your broker before any decision.
output_sample:
  input:
    - Your strategy type and underlying, typed or from a broker screenshot
    - Your strikes and expiry
    - The premium you paid or received, and your quantity
    - Spot price and implied volatility (optional)
  prerequisites:
    - An AI that can show charts or save an HTML file
    - Python with yfinance, only if you want a live price quote (it fetches data from a third-party site)
    - An AI that can run code, to run the commands in this skill
  output:
    - name: Strategy summary
      contains: The strategy your AI found and how it matched each leg, plus any default values it used.
    - name: Payoff chart
      contains: A dashed line for profit at expiry and a solid line for today's Black-Scholes value.
    - name: Sliders
      contains: Controls for strikes, premium, quantity, implied volatility, days to expiry, interest rate and spot price.
    - name: Stats cards
      contains: Max profit, max loss, break-even prices and the current theoretical profit or loss at spot.
    - name: Key insight
      contains: A short note on max profit, max loss and one point worth knowing about this trade.
