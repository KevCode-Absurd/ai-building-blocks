thinking: low
thinking_why: It follows a clear batch routine.
new_slug: order-hold-manager
name: Order hold manager
summary: Place or lift fulfilment holds on many Shopify orders in one batch, with a reason your packing team sees. Preview first, as it changes live orders.
job: run-your-store
headline: Order hold manager
subhead: Pause or release many Shopify orders at once, with a reason your packing team can see. It suits fraud review, payment checks and stock shortages.
explain: |
  Pause or release many Shopify orders at once, with a reason your packing team can see. It suits fraud review, payment checks and stock shortages.

  You pick hold or release, then choose the orders by listing IDs or by a search such as a tag. You set the reason: awaiting payment, high fraud risk, wrong address, out of stock or other. You can add a staff note and a date when the hold ends on its own. The skill looks up each order's fulfilment status first and works on open ones. Preview mode shows which orders are affected. Holding delays delivery, and releasing sends orders to be packed at once. Needs Shopify CLI access.
when:
  - A batch of orders is flagged for fraud review.
  - Stock ran out and you need to pause affected orders.
  - Payment has not cleared and you want orders held.
  - The review is done and you need to release a tagged group.
not_for:
  - "Orders already fulfilled, cancelled or being packed: they cannot be held, so check their status in your Shopify admin first."
  - "You need to edit an order, refund it or change its address: do that by hand in your Shopify admin."
  - "You use a store platform other than Shopify: this needs Shopify access and will not work elsewhere."
you_give:
  - Store domain
  - Hold or release
  - Order IDs or a search filter
  - Reason and staff note
  - Auto-expiry date (optional)
you_get:
  - A preview of affected orders
  - Holds placed or released
  - The reason shown to fulfilment staff
  - A list of results per order
how_to_use:
  - Use an AI tool that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot change your store.
  - Sign in to your store with Shopify CLI. Your sign-in needs permission to read orders and manage fulfilment orders.
  - Give your AI the skill and tell it your store domain, hold or release, and the orders. List order IDs, or use a search such as tag:fraud-review.
  - Ask for a preview first. Check the table of orders and their current status.
  - If the list looks right, tell your AI to go ahead. Then read the results for each order and fix any errors.
output_sample:
  input:
    - Your store domain
    - Hold or release
    - Order IDs, or a search such as a tag
    - A reason and a staff note (optional)
    - A date when the hold ends on its own (optional)
  prerequisites:
    - An AI tool that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI
    - Shopify CLI signed in to your store
    - Permission to read orders and manage fulfilment orders
  output:
    - name: Start banner
      contains: Your store domain and the time the run began.
    - name: Step log
      contains: One line per step showing what was asked and how many orders were found or changed.
    - name: Results table
      contains: Each order with its fulfilment order ID, its status before and its status after.
    - name: Outcome summary
      contains: Counts of orders targeted, holds placed or released, orders skipped because they were already in that state, and errors.
