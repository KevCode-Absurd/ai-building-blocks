thinking: low
thinking_why: It fetches and tidies one record.
new_slug: order-lookup-assistant
name: Order lookup assistant
summary: "Give an email, phone or order number. Get the full order summary:
  items, payment, shipping and history."
job: run-your-store
headline: Order lookup assistant
subhead: "Everything about a customer's order on one screen: what they bought,
  what they paid, where it is going, tracking, refunds and history. Support
  agents answer in seconds without clicking through the Shopify admin."
explain: |
  Everything about a customer's order on one screen: what they bought, what they paid, where it is going, tracking, refunds and history. Support agents answer in seconds without clicking through the Shopify admin.

  You search by order number, email or phone. The skill makes one request to Shopify and returns up to a set number of matching orders with payment status, fulfilment status, line items, shipping address, tracking links and refund details. Output can be a readable summary or JSON for other tools. It only reads data and does not change orders. Needs a signed-in Shopify CLI session with access to orders and customers.
when:
  - A customer writes in asking where their parcel is.
  - You need to check if a refund already went out.
  - You only have an email address and need their orders.
  - A support agent needs order details during a chat.
you_give:
  - Store domain
  - Order number, email or phone
  - How many orders to return (optional)
  - Readable or JSON output (optional)
you_get:
  - Order summary with items and totals
  - Payment and fulfilment status
  - Shipping address and tracking
  - Refund details
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin.
