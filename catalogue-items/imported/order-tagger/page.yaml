new_slug: order-tagger
name: Order tagger
summary: Set your rules, such as region or order value. Get matching orders
  tagged. Changes live orders, so preview first.
job: run-your-store
headline: Order tagger
subhead: Set your rules, such as region or order value. Get matching orders
  tagged. Changes live orders, so preview first. Bring store domain. Use the
  result to plan your next step.
explain: |
  Orders tagged automatically by your own rules, so your team can filter, route and report without reading each one. Think high-value, international, first-time buyer or needs review.

  You write simple rules, each a condition and a tag: total over 500 becomes high-value, shipping country not US becomes international, risk level high becomes needs-review. The skill reads orders from your chosen window, checks each rule, skips orders already tagged and applies the rest. It starts in preview mode, listing what would be tagged, and only changes orders when you turn that off. It supports rules on order value, geography, item count, order history, payment status and fulfilment status. Needs Shopify CLI access with order write permission.
when:
  - You want international orders flagged for customs forms.
  - Fraud checks need all high-risk orders in one list.
  - You want repeat buyers tagged for a thank-you note.
  - Your packing team needs bulk orders labelled.
you_give:
  - Store domain
  - Tagging rules (condition and tag)
  - Days to look back
  - Preview or apply choice
you_get:
  - A preview list of orders to tag
  - Tags applied to matching orders
  - Skipped orders already tagged
  - A count per rule
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin and change live
    store data.
