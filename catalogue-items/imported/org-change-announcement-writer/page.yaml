thinking: medium
thinking_why: Tone matters when people worry about their jobs.
new_slug: org-change-announcement-writer
name: Org change announcement writer
summary: Write an org change announcement fast. Give it your change and audience. You get a leader message, manager talking points, a town hall script and FAQ.
job: hire-people
headline: Org change announcement writer
subhead: Describe the change. Get the leader announcement, manager talking points, town hall script and hard-question answers. Bring what is changing and why. Use the result to plan your next step.
explain: |
  All the words you need when a change hits your company: the leader announcement, manager talking points, a town hall script and answers to the hard questions. People hear the same clear story from everyone.

  You describe the change, such as a restructure, a new policy, a leadership move or a new system. The skill builds a message for each audience, from executives to managers to staff, with who tells them, how and when. It plans channels and timing, writes an FAQ and a Q&A for tough questions, and gives managers a kit for one-to-one talks. It covers rumours and how to check people understood. Have HR or legal review the text.
when:
  - You must announce a restructure or layoffs and need careful wording.
  - Managers need to explain a new policy to their teams.
  - You are rolling out a new HR system and need a communication plan.
  - A leader is leaving and people will have questions.
not_for:
  - You only need a routine update. Send a short standard notice instead.
  - You are planning layoffs. Get legal and HR review first, then use this for wording only. A lawyer should approve the final text.
  - You need to run a full change program over many months. Ask your HR lead or a change consultant for a full plan.
you_give:
  - What is changing and why
  - Who is affected
  - Company size and tone
  - Timeline
  - Known concerns or rumours (optional)
you_get:
  - Leader announcement
  - Manager talking points
  - Town hall script
  - FAQ and hard-question answers
  - Timing and channel plan
how_to_use:
  - "Write a short brief: what is changing, why, who is affected, company size, tone and timeline."
  - Add any rumours or worries you already know about (optional).
  - Open Claude, ChatGPT or Gemini. Paste the skill, then paste your brief.
  - Ask for the pieces you need, such as the leader announcement, manager talking points or town hall script.
  - Read each piece for tone. Check that it answers what this means for each person.
  - Have HR or legal review it before you send anything.
output_sample:
  input:
    - What is changing and why
    - Who is affected
    - Company size and tone
    - Timeline
    - Known concerns or rumours (optional)
  output:
    - name: Communication plan
      contains: Who hears what, from whom, through which channel and when, for each audience.
    - name: Leader announcement
      contains: An honest message from a leader that explains the why, the what and what comes next.
    - name: Manager talking points
      contains: Key messages and answers managers can use when their team asks what this means for them.
    - name: Town hall script
      contains: An opening, key messages and a path into live questions.
    - name: FAQ and hard-question answers
      contains: Common questions and tough ones, each with a model answer.
    - name: Rumour and follow-up check
      contains: Ways to listen for rumours and check that people understood the change.
