thinking: high
thinking_why: Finding truly new ideas needs deep reasoning.
new_slug: original-research-idea-generator
name: Original research idea generator
summary: Get new research ideas for your AI or computer science problem. Eight creative methods give cross-field links, reframes and a short list to test.
job: research-topics
headline: Original research idea generator
subhead: Fresh research directions that are not a small tweak of last year's paper. You get ideas from eight creative methods taken from creativity research, each fitted to your own problem.
explain: |
  Fresh research directions that are not a small tweak of last year's paper. You get ideas from eight creative methods taken from creativity research, each fitted to your own problem.

  The skill is built for computer science and AI work. It combines distant concepts, reframes the problem, borrows structure from another field, adds a constraint, flips an assumption, moves up a level of abstraction, probes the edge of what is possible and holds two opposing ideas at once. For each method it asks questions that push you past the obvious and keeps the link to your topic. It stresses real structural parallels, not surface likeness. Pair it with a planning step afterward to sort and test the ideas.
when:
  - You are stuck in one corner of your subfield.
  - You are preparing for a research retreat or ideation session.
  - You want a cross-field idea, not just a literature gap.
  - Every idea you have looks like an extension of someone else's paper.
not_for:
  - "You need a plan to sort, rank and run a batch of ideas as a project: use a project brainstorming step, then test the best ideas yourself."
  - "You need a survey of what has already been published: use a literature review step or search a paper database."
  - "You already have a clear problem and only need help to carry it out: use a tool made for that task."
you_give:
  - Your problem or research area
  - What has been tried
  - Your constraints (optional)
  - Fields you know well (optional)
you_get:
  - Ideas from eight creative methods
  - Cross-field analogies
  - Reframed versions of your problem
  - A short list worth testing
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text from this page into the chat.
  - Write your problem, what has been tried, and any limits. Add two or three fields you know well if you like.
  - Ask your AI to follow the skill and work through all eight methods.
  - Read the short list. Drop ideas that only look alike on the surface, then test the best ones.
  - The skill has a dated list of recent technology changes. Treat it as a starting point and check each line against current sources before you build on it.
  - To rank and plan the ideas you keep, use the Research idea workshop. To check what is already published, use the Literature reviewer.
output_sample:
  input:
    - Your problem or research area
    - What has been tried so far
    - Your known limits, such as data, compute or time (optional)
    - Two or three fields you know well (optional)
  output:
    - name: "Phase 1: Map the space"
      contains: Your problem restated, the usual assumptions in your subfield, and where your thinking is stuck.
    - name: Ideas from the eight methods
      contains: New directions from combining concepts, reframing, analogy, constraints, inversion, abstraction, nearby possibilities and opposing ideas.
    - name: "Phase 3: Deepened leads"
      contains: The most promising ideas worked further, with the real structural link to your topic.
    - name: "Phase 4: Evaluation"
      contains: Each lead checked for novelty and fit, ending in a short list worth testing.
next: [research-idea-workshop, literature-reviewer]
