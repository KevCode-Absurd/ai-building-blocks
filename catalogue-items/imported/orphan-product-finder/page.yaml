thinking: low
thinking_why: It counts collections per product.
new_slug: orphan-product-finder
name: Orphan product finder
summary: Find products in no collection and products in too many, so shoppers can find them. Give it your Shopify store and get a CSV report.
job: run-your-store
headline: Orphan product finder
subhead: A list of products that sit in no collection, so shoppers browsing your collections never see them, and a list of products crammed into too many collections. Fixing both makes your catalogue easier to browse.
explain: |
  A list of products that sit in no collection, so shoppers browsing your collections never see them, and a list of products crammed into too many collections. Fixing both makes your catalogue easier to browse.

  The skill scans your Shopify products, active by default, and counts the collections each one sits in. Zero means it is an orphan: no collection page shows it. Shoppers may still reach it through search, a direct link or a menu link to the product, so check your menus before you call it hidden. It reads every collection a product is in, however many there are. Above your limit, set at 10 by default, it is flagged as over-collected and likely adds clutter. It then pulls collection names and sizes so the report is readable. It only reads data and changes nothing. You choose whether to scan active, draft or all products. Needs a signed-in Shopify CLI session with product read access.
when:
  - You added products but forgot to place them in collections.
  - Your menu feels messy and some items seem lost.
  - You are tidying the catalogue before a sale.
  - You suspect a few products appear in too many places.
not_for:
  - Your store cross-lists on purpose, like a marketplace. Skip the over-collected check or raise the collection limit.
  - You want to change collections. This only reads data, so add or remove products in your Shopify admin.
  - You want to know what is in your menus. This counts collections only. It does not read menus, so a product it flags may still be linked from a menu.
you_give:
  - Store domain
  - Collection limit (optional)
  - Product status to scan (optional)
  - Readable or JSON output (optional)
you_get:
  - Products in no collection
  - Products in too many collections
  - Collection names and sizes
  - A report you can act on
how_to_use:
  - Open an AI that can run code, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot do this.
  - Sign in to Shopify CLI for your store with permission to read products.
  - Paste the skill and give your store domain. Add a collection limit or product status if you want to change the defaults.
  - Let it scan. It only reads data and changes nothing in your store.
  - Open the CSV. Fix each flagged product in Shopify admin, then run the scan again to check.
output_sample:
  input:
    - Your store domain
    - Collection limit (optional)
    - "Product status to scan: active, draft or all (optional)"
    - Readable or JSON summary (optional)
  prerequisites:
    - An AI that can run code, such as Claude Code, Cursor, Codex or Gemini CLI
    - A signed-in Shopify CLI session with permission to read products
  output:
    - name: Start banner
      contains: The skill name, your store domain and the time the scan began.
    - name: Step progress lines
      contains: One line per step showing what was asked and how many results came back.
    - name: Summary
      contains: Counts of products scanned, orphan products and over-collected products, plus a short sample of orphans.
    - name: collection_audit_<date>.csv
      contains: One row per flagged product with its ID, title, handle, status, collection count, collection names and issue.
