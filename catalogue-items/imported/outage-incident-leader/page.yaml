thinking: medium
thinking_why: It runs a fixed process but needs judgment on severity.
new_slug: outage-incident-leader
name: Outage incident leader
summary: "Run your outage with a clear plan: score how bad it is, get update templates, build a timeline, and write a blame-free incident review."
job: ship-and-host
headline: Outage incident leader
subhead: "Give it a description of your outage. It scores how bad it is, tells you who to involve and drafts your updates. After the fix, it builds a timeline and writes the review."
explain: |
  A calm plan when your service is down: how bad it is, who does what, a clear timeline and a blame-free review after the fix.

  The skill covers reliability problems like outages, slowdowns and failed deploys. It is not for security attacks. First it scores severity from SEV1 to SEV4 using users hit, revenue and service promises, and suggests who to pull in with message templates for updates. Later it turns scattered logs and chat messages into one ordered timeline and points out gaps. Finally it writes a post-incident review using root cause methods, with action items. The tools are Python scripts you can run on your own data.
when:
  - Your site just went down and nobody knows who is in charge.
  - You need to tell customers and leaders what is happening.
  - You have logs and chat threads that must become one clear timeline.
  - The fix is done and you must write the review.
not_for:
  - "You face a hack, ransomware or data theft: use your security team or an incident-response skill built for attacks."
  - "You only want to set up monitoring or alerts for a new service: use your monitoring tool's own setup guide."
  - "Your service is fine and you want a plain bug fix: ask a developer or use your normal bug tracker."
you_give:
  - A short description of the incident, and the service that is hurt
  - The share of users affected (for example 25%) and the business impact as low, medium or high
  - Timestamped events from logs or chat, one line per event with the time first
  - The team roles you have available (optional)
you_get:
  - A severity level from SEV1 to SEV4
  - A suggested response team and first actions
  - Update templates for the team, leaders and customers
  - One ordered timeline with gaps and durations
  - A blame-free incident review with follow-up actions
how_to_use:
  - Open your AI and paste the skill text. If your AI can run code, upload the skill folder with its Python scripts. If it cannot, paste the incident description, the impact numbers and the timestamped events in the chat, and ask it to work out the severity, the timeline and the review by hand. You get the same sections, but nothing is checked by a script.
  - During the outage, paste your incident description and impact numbers. Ask for the severity, the response team and the update messages.
  - Check the severity. Send the updates, and change the times and details in the templates first.
  - After the fix, paste your timestamped logs and chat messages. Ask for one ordered timeline and a list of gaps.
  - Ask for the post-incident review. Read the root cause and follow-up actions with your team before you share it.
  - Send each follow-up action to a named owner with a date, and check them at your next team meeting.
output_sample:
  input:
    - A short description of the outage
    - "Impact: users hit, revenue at risk, service promises"
    - Timestamped events from logs or chat (optional until the timeline step)
    - Team roles you have on hand (optional)
  prerequisites:
    - The three tools are Python scripts. Your AI needs to run code to use them, or it can follow the same steps by hand in chat.
  output:
    - name: Severity level
      contains: One line with the level, SEV1 to SEV4, and the reason it was chosen from users hit, revenue and service promises.
    - name: Response team and first actions
      contains: A bullet list of who to pull in and what to do in the first minutes, each with a time limit.
    - name: Communication templates
      contains: Ready-to-fill messages for the team, leaders and customers, matched to the severity.
    - name: Incident timeline
      contains: A table with time, event, source and gap columns. Your scattered logs and chat messages are put in order, with long gaps marked.
    - name: Post-incident review
      contains: A blame-free write-up with root cause methods such as 5 Whys and Fishbone.
    - name: Follow-up actions
      contains: A list of fixes to make so the same outage does not happen again.
