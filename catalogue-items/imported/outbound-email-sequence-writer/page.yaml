thinking: medium
thinking_why: It plans a sequence from audience and goal.
new_slug: outbound-email-sequence-writer
name: Outbound email sequence writer
summary: Write a cold email sequence for your prospect. You get several short emails, subject lines, personal fields and a send schedule.
job: write-emails
headline: Outbound email sequence writer
subhead: Describe your prospect. Get a multi-step email sequence with timing and personal touches. You fill in the proof and send it from your own email tool.
explain: |
  A full cold email series that earns replies and ends with a booked meeting, each message short and different from the last.

  You describe the target company type and the person you are writing to. The skill pins down their title and pains, then boils your offer to one clear outcome, such as cutting month-end close from ten days to three. It writes the series: an opening with a relevant hook, follow-ups with new angles and proof, a helpful resource email and a final breakup note. Each body is 50 to 120 words. It adds subject line options, personal fields like name, company and trigger events, and a send schedule with days, times and gaps between touches.
when:
  - You have a list of prospects and nothing to send them.
  - Your cold emails get opens but no replies.
  - You target a new job title and need fresh messaging.
  - You want a follow-up plan, not one-off emails.
not_for:
  - "You need one reply or a single message: use the Cold email writer."
  - "You only have a purchased list with no lawful basis to contact people: get consent or a lawful basis first."
  - "You need a script for a live sales call: write call notes by hand or ask your AI for a call prep plan."
you_give:
  - Target company type and person
  - Your offer and its main result
  - Proof points or case studies (optional)
  - Trigger events you can mention (optional)
you_get:
  - A multi-step email series
  - Subject line options
  - Personal fields to fill in
  - A send schedule
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text into a new chat. No code or paid tool is needed.
  - Describe the company type and the person you want to reach. Say what you sell and the result it gives.
  - Add proof points and trigger events if you have them. Use only real, checked numbers.
  - Say how many emails you want. Then ask for subject lines, personal fields and a send schedule.
  - Read each email and fill in every field. Replace any figure or case study that is not true for you.
  - Add an opt-out line and your real name and company to every email. Make sure you have a lawful basis to contact each person before you send.
  - Send from a real person's address. If a prospect replies, stop the sequence and answer by hand.
  - Load the emails into your email or sales tool. Track replies for the first week and change the weakest subject line.
output_sample:
  input:
    - The type of company and the person you are writing to
    - Your offer and the main result it gives
    - Proof points or case studies (optional)
    - Trigger events you can mention (optional)
    - How many emails you want (optional)
  output:
    - name: Persona and value statement
      contains: The person's title and pains, and your offer boiled down to one clear result.
    - name: Opening email
      contains: A short first email with a relevant hook and one ask.
    - name: Follow-up emails
      contains: Short emails that each add a new angle or proof point.
    - name: Value-add email
      contains: An email that offers a useful resource with no hard sell.
    - name: Breakup email
      contains: A final short note that closes the thread politely.
    - name: Subject line options
      contains: A few short subject line choices for the emails.
    - name: Personal fields
      contains: Fill-in fields such as name, company and trigger event.
    - name: Send schedule
      contains: The day, time and gap between each email.
