thinking: medium
thinking_why: It follows set import routes and fixes input format errors.
new_slug: outside-ai-model-importer
name: Outside AI model importer
summary: Import a PyTorch, ONNX or Keras model into MATLAB and check it gives the same answers as the original. Fixes common import errors.
job: build-software
headline: Outside AI model importer
subhead: Give it a PyTorch, ONNX or Keras model. Get it loaded into MATLAB as a checked network, with a match report you can run with predict.
explain: |
  A trained model from PyTorch, ONNX or Keras, loaded into MATLAB as a network you can run, and checked against the original so you know the results match.

  You give the model file, such as .pt2, .pt, .onnx or .keras. The skill picks the right import route for the format. It sets the input sizes and data formats, handles the PyTorch export step, and runs the import. If it fails, it helps with unsupported operators, networks left uninitialised or zero learnable parameters. Then it runs the same input through both versions and compares the outputs. It does not cover exporting out of MATLAB, training afterwards or embedded deployment. Needs MATLAB with Deep Learning Toolbox. This is a MathWorks skill.

  Licence: the LICENSE.md file in this item governs this copy. It is BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. The skill file header links MathWorks' own reuse licence (PMRL), which is MathWorks' upstream terms and also limits use to MathWorks products. So BSD 2-Clause alone does not describe your rights.
when:
  - A colleague trained a model in PyTorch and you work in MATLAB.
  - Your import throws unsupported operator warnings.
  - The imported network shows zero learnables.
  - You must prove the imported model gives the same answers.
not_for:
  - "You want to send a MATLAB network out to ONNX or PyTorch: use exportONNXNetwork or exportNetworkToPyTorch in MATLAB."
  - "You want to train or fine-tune the model after import: use a MATLAB training step, such as the matlab-train-network skill."
  - "You want to put the model on embedded hardware: use MATLAB's embedded deployment tools, such as the matlab-deploy-embedded-ai skill."
you_give:
  - The model file
  - Input size and data format
  - Your MATLAB release, and the Python and torch version if you export from PyTorch (torch 2.8 is needed)
  - A sample input (optional)
  - MATLAB with Deep Learning Toolbox
you_get:
  - A MATLAB network ready to use
  - Fixes for import errors
  - A match check against the source model
  - Notes on unsupported parts
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste this skill, or upload its folder if your AI takes files.
  - Add your model file and say what format it is. The format picks the route before anything runs. A .pt2 exported program or a traced .pt file takes the PyTorch route, an .onnx file the ONNX route, and a .keras folder the Keras route. For a .pt file, give the exact input size. If you only have PyTorch code, export it as .pt2 first.
  - Say which MATLAB release you use. Keras models need it to pick the right route.
  - Let your AI run the import. This needs MATLAB with Deep Learning Toolbox, and Python for some routes.
  - Check the layer count, the learnables count and the difference from the source model.
  - If the check passes, run predict on the imported network with a few of your own inputs. Keep the match report with the model.
  - Next, use the network in your MATLAB workflow with predict, or fine-tune it on your own data with the Neural network trainer.
output_sample:
  input:
    - Your model file (.pt2, .pt, .onnx or .keras folder)
    - The input size of your model (needed for .pt files)
    - The input data format, such as batch, channel, height, width (optional)
    - A sample input to compare the two models (optional)
  prerequisites:
    - MATLAB with Deep Learning Toolbox
    - An AI that can run MATLAB code
    - Python with torch 2.8 to export PyTorch models
    - Python with onnxruntime to compare ONNX results (optional)
  output:
    - name: Imported network
      contains: Your model loaded in MATLAB as a dlnetwork, ready to run with predict.
    - name: Import route
      contains: Which route was used for your file type, and the exact import command.
    - name: Fixes for import errors
      contains: Steps for unsupported operators, uninitialised networks and zero learnable parameters, if any came up.
    - name: Network check
      contains: The number of layers and learnable parameters, so you can see the import worked.
    - name: Numeric validation
      contains: The largest difference between your imported network and the source model on the same input.
