thinking: medium
thinking_why: It must judge which outside factors matter most.
new_slug: outside-forces-analyst
name: Outside forces analyst
summary: "Run a PESTLE analysis on your business. Get the outside forces that could help or hurt you, ranked by impact and how likely they are."
job: plan-strategy
headline: Outside forces analyst
subhead: "A list of the outside forces that can help or hurt your business, sorted into political, economic, social, technology, legal and environment. It helps you spot risks before they land."
explain: |
  A list of the outside forces that can help or hurt your business, sorted into political, economic, social, technology, legal and environment. It helps you spot risks before they land.

  You name your business, market and region. The skill goes through each of the six areas with specific prompts: tariffs and stability, interest rates and spending, population and habits, tech change, rules and licences, and climate or sustainability pressure. It judges which forces matter most for your case and which are noise. It points out which are threats and which are chances, and turns the key ones into questions to ask or actions to take. Useful before entering a market or setting yearly plans.
when:
  - You are planning to enter a new country or market.
  - You are writing yearly strategy and need the outside view.
  - A new law or tariff might change your costs.
  - Investors ask what external risks you face.
not_for:
  - You already know your market well and need a go or no-go. Use a simple market size check or a SWOT instead.
  - You want to judge your own strengths and weaknesses. Use a SWOT, which looks inside your business.
  - You need live facts, like today's tariff rates or new laws. Check the official source or ask an advisor.
you_give:
  - Your business and product
  - Market and region
  - Current strategic question
  - Known rule or market changes (optional)
you_get:
  - Forces sorted into six areas
  - Threats and chances flagged
  - The most important factors
  - Questions or actions to follow up
how_to_use:
  - "Gather first: your product description, your target region, your strategy question, and any rule or tariff changes you know about, with their sources."
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tools are needed.
  - Tell your AI your business, product, market and region.
  - Add your main strategy question, such as entering a new country.
  - Add any rule or market changes you already know about (optional).
  - The ratings and rankings are your AI's judgment from general knowledge, not live data. Check them against official sources before you decide.
  - The result opens with a one-paragraph summary of the top five ranked forces, then lists the six areas.
  - Check the top-ranked factors first. Fix any that don't fit your case, then ask your AI to update the list.
  - Pick the actions for the top factors and add them to your plan. Review the list once a year.
output_sample:
  input:
    - Your business and product
    - Your market and region
    - Your current strategy question
    - Rule or market changes you already know about (optional)
  output:
    - name: Factors by area
      contains: "Three to five outside forces for each of the six areas: political, economic, social, technological, legal and environmental."
    - name: Impact and likelihood ratings
      contains: Each factor rated High, Medium or Low for how much it matters and how likely it is.
    - name: Priority ranking
      contains: Factors ordered by impact times likelihood, so the biggest ones come first.
    - name: Threats and chances
      contains: Each key factor marked as a chance to use, a threat to avoid, or a rule to follow.
    - name: Signals to watch
      contains: Key measures or early signs to track for the most important factors.
    - name: Backup plans
      contains: Simple fallback plans for the factors that could hit hardest.
    - name: Assumptions and unknowns
      contains: What the analysis guessed and what you still need to research.
