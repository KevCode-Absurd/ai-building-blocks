new_slug: overseas-market-planner
name: Overseas market planner
summary: Name your store and goals. Get ranked countries, shipping and tax
  costs, and a phased plan to sell abroad.
job: run-your-store
headline: Overseas market planner
subhead: Name your store and goals. Get ranked countries, shipping and tax
  costs, and a phased plan to sell abroad. Bring your store and platform. Use
  the result to plan your next step.
explain: |
  A ranked list of countries to sell in next, what shipping and tax will cost, and a phased plan to get there.

  You describe your store, products, platform and current sales. The skill scores target markets on size, how easy they are to enter and how crowded they are. It compares ways to fulfil orders, such as shipping from home, using a local warehouse or a marketplace programme, and walks through VAT, import duties, registration rules and payment methods. It then builds a roadmap in stages, starting with the easiest market, and points to follow-up skills for each. It works for Amazon, Shopify, Etsy, TikTok Shop and others. Check tax rules with an adviser.
when:
  - Orders from abroad are growing and you want to do it properly.
  - You must pick your next three countries.
  - You are losing money on shipping and returns overseas.
  - You need to understand VAT and customs before shipping to the EU.
you_give:
  - Your store and platform
  - Products and monthly sales
  - Current shipping origin
  - Countries you are considering (optional)
  - Goals
you_get:
  - Countries ranked by score
  - Fulfilment options compared
  - Tax and duty overview
  - A phased expansion roadmap
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can search the web.
