thinking: high
thinking_why: Numbers must tie and the notes must be right.
new_slug: p-l-and-balance-sheet-writer
name: P&L and balance sheet writer
summary: Turn your trial balance into a P&L, balance sheet or cash flow with last period beside it and big swings flagged for your accountant.
job: track-numbers
headline: P&L and balance sheet writer
subhead: Your income statement, balance sheet or cash flow built from your books, with the prior period beside it and the big swings explained. It is ready for review by your accountant.
explain: |
  Your income statement, balance sheet or cash flow built from your books, with the prior period beside it and the big swings explained. It is ready for review by your accountant.

  You pick monthly, quarterly, annual or year to date and the period. The skill pulls data from a connected accounting system, or you paste a trial balance or upload a spreadsheet. It groups accounts, lines up this period against last period and last year, and flags changes that are large in dollars or percent so you can ask why. Reference notes cover presentation under US accounting rules and common period-end adjustments. It does not give financial advice, and a qualified professional should review before filing.
when:
  - Month-end is here and you need a P&L with comparisons.
  - You must explain why costs jumped from last quarter.
  - You have a trial balance and need formatted statements.
  - You want a first draft before your accountant reviews it.
not_for:
  - "You need filed or audited statements: have an accountant prepare and sign them. This gives a draft only."
  - "Your accounting system's own reports already cover the period: use those reports instead."
  - "You want financial advice or tax filing help: ask a qualified accountant."
you_give:
  - Period type and date
  - Trial balance or accounting data
  - Comparison period or budget (optional)
  - Account groupings (optional)
you_get:
  - Income statement, balance sheet or cash flow
  - Period-over-period comparison
  - Flagged large variances
  - Notes on adjustments to check
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Say which statement you want and the period, such as monthly for December 2024.
  - Paste your trial balance, or upload a spreadsheet. Add last period or budget numbers if you have them.
  - Add any adjustments you already know about, such as accruals.
  - Read the flagged swings first and answer the follow-up questions where you can.
  - Send the draft to your accountant to review before you use it.
output_sample:
  input:
    - "The period type: monthly, quarterly, annual or year to date"
    - The period, such as a month, quarter or year
    - Your trial balance or income statement data, pasted or in a spreadsheet
    - Last period, last year or budget numbers (optional)
    - Known adjustments or reclassifications (optional)
  prerequisites:
    - An AI that can read a spreadsheet, if you upload a file
    - A connected accounting system is optional. You can paste the numbers instead.
  output:
    - name: Income statement
      contains: Revenue and expense lines for your period, with columns for the prior period and prior year.
    - name: Variance analysis
      contains: Changes in dollars and percent for each line, split into what drove them.
    - name: Key metrics summary
      contains: A short table of the main ratios and totals for the period.
    - name: Material variance summary
      contains: The large swings, each marked for follow-up with a suggested question to ask.
    - name: Balance sheet and cash flow formats
      contains: Standard layouts and presentation rules, plus common period-end adjustments and reclassifications to check.
