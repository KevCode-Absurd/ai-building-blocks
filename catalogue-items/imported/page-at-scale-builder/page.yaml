thinking: high
thinking_why: Quality at scale needs careful design.
new_slug: page-at-scale-builder
name: Page-at-scale builder
summary: Plan many search pages from one keyword pattern and your data. You get a page template, URL plan and a small first batch to test.
job: get-found-in-search
headline: Page-at-scale builder
subhead: A page template and a rollout plan for hundreds of search pages, built so none of them read as thin or copied. You give it a keyword pattern, such as service plus city, and the data you have to fill it.
explain: |
  A page template and a rollout plan for hundreds of search pages, built so none of them read as thin or copied. You give it a keyword pattern, such as service plus city, and the data you have to fill it.

  It first checks the pattern for real search demand and who already ranks. Then it ranks your data by how hard it is to copy, from data only you hold down to public lists anyone can use. It designs one template where each page carries something unique, sets a clean folder URL structure, and recommends starting with a small batch before you publish thousands.
when:
  - You want one page for every city, tool or use case you cover.
  - You have a data set and wonder if it can power a directory.
  - You worry that near-identical pages will get ignored by search.
  - You need a plan for URLs, templates and internal links before building.
not_for:
  - "You only need a few pages, or you have no real data for each page: write one landing page by hand instead."
  - "You want to fix search problems on pages you already have: use an SEO audit, not this skill."
  - "You want to plan topics and a content calendar: use a content strategy step instead."
you_give:
  - Keyword pattern, like [service] in [city]
  - Your data source or spreadsheet
  - Your product and buyer
  - Competitor pages that rank today (optional)
you_get:
  - Page template with unique-content slots
  - URL structure plan
  - Page count and demand estimate
  - Quality checks before publishing
  - Small first-batch launch plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tool is needed. The skill's playbooks and platform guides are in the references folder, so upload the whole skill folder to get them. Pasting SKILL.md alone leaves them out.
  - Give your keyword pattern, such as [service] in [city], and say what you sell and who buys it.
  - Paste your data as a table. One row per page, with columns such as city, service, number of providers and one unique fact per row. If the data was scraped or licensed from another site, check that site's terms and get permission before it goes on your pages.
  - Add the pages that rank today for this pattern (optional).
  - Read the template and data check first. Fix any gaps in your data before you build.
  - Publish a small first batch. Check how many pages get indexed before you add more.
output_sample:
  input:
    - Your keyword pattern, such as service plus city
    - Your data source or spreadsheet, with one row per page
    - Your product and who buys it
    - Pages that rank for these terms today (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini
    - A product marketing file from earlier work (optional)
  output:
    - name: Opportunity analysis
      contains: Whether the keyword pattern has real demand, how many pages it could make, and who ranks now.
    - name: Data check
      contains: Your data ranked from hardest to copy to easiest, with what is missing.
    - name: Page template
      contains: Title and meta description patterns, a content outline, unique content slots and schema markup.
    - name: URL structure
      contains: A clean folder layout on your main site, not a subdomain.
    - name: Internal linking plan
      contains: A main category page linked to each page, with links between related pages.
    - name: Indexation plan
      contains: Which pages to publish first, which thin ones to keep out of search, and how to split sitemaps.
    - name: Pre-launch checklist
      contains: Checks for content quality, technical setup, links and indexing before you publish.
