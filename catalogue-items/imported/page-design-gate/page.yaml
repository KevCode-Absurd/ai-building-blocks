thinking: medium
thinking_why: It plans the look, builds it, then tests it.
new_slug: page-design-gate
name: Page design gate
summary: Check your page design in a real browser at phone and desktop width. Describe the page and get a built page that looks designed, not generic.
job: build-websites
headline: Page design gate
subhead: Describe your page. Get one that looks designed, checked in a real browser at phone and desktop width. Bring what the page is for and who visits. Use the result to plan your next step.
explain: |
  A page that looks designed instead of generic, and that has been opened in a real browser at phone and desktop width before it is called done.

  It starts by reading the room: who visits, what feel suits them, and one signature detail to make the page memorable. It then builds on a set floor of rules for type, colour, layout, buttons states and motion, and bans familiar AI looks like purple glow gradients and emoji icons. The last step renders the page at both sizes and keeps the work open while any hard problem remains, such as overlapping text or sideways scrolling. It needs a browser it can control.
when:
  - You asked an AI for a landing page and it looks like every other one.
  - You want proof the page works on a phone, not a guess.
  - You are about to ship a new screen and want a final check.
  - A redesign needs a clear look, not just tweaks.
not_for:
  - "Your brief pins fonts, colours or an era and you want no changes to them: keep your brand rules, since the brief wins over this skill's rules."
  - "You need a page with no visual design work, such as a data script or plain text: this skill does not apply, so skip it."
  - "You want a fast start with no design choices: use a ready-made template or your site builder's design system instead."
you_give:
  - What the page is for and who visits
  - Brand fonts or colours (optional)
  - The page code or a short brief
  - A browser the AI can open
you_get:
  - A built page with a chosen visual direction
  - Phone and desktop render checks
  - List of problems found and fixed
  - Sign-off only when hard issues are closed
how_to_use:
  - Open an AI that can run code and open a browser, such as Claude Code or Cursor. A plain chat window cannot run the browser check.
  - Paste the skill, then tell your AI what the page is for and who visits. Add your page code or a short brief.
  - Add your brand fonts or colours if you have them (optional). They override the skill's design rules.
  - Let your AI write the direction line, build the page, then run the browser check. The first run installs Playwright and Chromium.
  - Ask it to fix every failed finding and run the check again. Then open the two screenshots yourself and judge the look.
output_sample:
  input:
    - What the page is for and who visits
    - Your page code or a short brief
    - Brand fonts, colours or an era (optional)
  prerequisites:
    - An AI that can run code and open a browser
    - Python with Playwright and headless Chromium installed, or the setup the skill gives on first run
    - A page the AI can reach, as a file or a local web address
  output:
    - name: Direction line
      contains: One sentence naming the page kind, audience, vibe, type pairing, colour family and the signature detail.
    - name: Built or fixed page
      contains: Your page made on the craft floor rules for type, colour, layout, icons, states, motion and phone layout.
    - name: Gate findings
      contains: Each problem the browser check found, with its rule, screen width and the element that failed.
    - name: desktop.png
      contains: A full-page screenshot of your page at 1440 by 900.
    - name: mobile.png
      contains: A full-page screenshot of your page at 390 by 844.
    - name: Final gate result
      contains: The last pass or fail line from the gate, shown only after hard findings are fixed.
