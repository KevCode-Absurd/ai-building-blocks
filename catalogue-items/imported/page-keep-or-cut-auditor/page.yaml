thinking: medium
thinking_why: It applies a set decision rule to each page.
new_slug: page-keep-or-cut-auditor
name: Page keep-or-cut auditor
summary: Give it your site's content list. Get each page marked keep, update,
  merge, redirect or delete, with reasons.
job: get-found-in-search
headline: Page keep-or-cut auditor
subhead: "A spreadsheet-style decision for every page on your site: keep,
  update, merge, redirect or delete, each with a reason. It helps when traffic
  has dropped or you inherited a pile of old posts."
explain: |
  A spreadsheet-style decision for every page on your site: keep, update, merge, redirect or delete, each with a reason. It helps when traffic has dropped or you inherited a pile of old posts.

  It starts from your page list, search data, traffic and backlinks. Each page gets scored. Pages ranking well stay. Pages sitting on the second results page with stale facts get an update. Two pages fighting for one search get merged. Pages with no traffic but good links are redirected so the link value is not lost. The rest are cut. You review the plan before touching anything.
when:
  - You inherited a blog with hundreds of posts and no map of it.
  - Site traffic has slid and you do not know where to start.
  - Two of your pages compete for the same search.
  - You are about to redesign or move the site and want to trim first.
you_give:
  - Your site address or full page list
  - Search console export for 12 months
  - Analytics data such as sessions and sales
  - Backlink export (optional)
you_get:
  - Each page marked keep, update, merge, redirect or delete
  - Reason for each call
  - Priority order of work
  - Redirect map for pages you remove
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
