thinking: medium
thinking_why: It sets budgets and a workflow from a fixed pattern.
new_slug: page-speed-gate-builder
name: Page speed gate builder
summary: Add a page speed check to your build pipeline. It fails the build when your home page or listed URLs get slow or score low.
job: ship-and-host
headline: Page speed gate builder
subhead: A speed check that runs on every code change and blocks pages that get slow or weak, so a slow page cannot slip into your live site unnoticed.
explain: |
  A speed check that runs on every code change and blocks pages that get slow or weak, so a slow page cannot slip into your live site unnoticed.

  It writes one Lighthouse config file holding every limit, with a set of budgets for load time, layout jumps and blocking time, plus minimum scores for performance, search, accessibility and best practice. It tests the real production build, never the dev server, and takes the median of several runs so the check does not fail at random. A workflow file runs the same setup locally and in your build pipeline and saves reports. It needs Node and a build pipeline. The 200 ms limit for click response (INP) is checked through Total Blocking Time, a lab stand-in. It is not a measure of real visitors.

  Licence: two labels apply. The skill file keeps its author's own MIT header (stareezy-1). sickn33's collection shares it under CC BY 4.0, as the LICENSE-CONTENT file says. Both allow reuse with credit, so keep the credit to stareezy-1 and sickn33.
when:
  - You keep shipping changes that quietly slow the site.
  - You want a failing check when load time passes a set limit.
  - Your speed test gives a different score every run.
  - You need speed reports saved with each code change.
not_for:
  - "You only want a one-off speed test: run Lighthouse in Chrome or use PageSpeed Insights."
  - "You want to watch real visitor speed over time: use a field-data monitoring tool, not this lab check."
  - "Your site is plain static files with no build step: test it by hand with PageSpeed Insights."
you_give:
  - Your web app code
  - Your build and start commands
  - Speed limits you want (optional)
  - Where your build pipeline runs, such as GitHub Actions
you_get:
  - A single Lighthouse config with named budgets
  - A pipeline workflow file
  - Median-of-runs setup to cut flaky results
  - Saved reports for each run
how_to_use:
  - Open your AI tool in a place where it can read your project files and run code.
  - Paste this skill and tell it to add the page speed gate to your app.
  - "Say which framework you use: Next.js, Remix, Astro, SvelteKit or Vite. The skill gives exact start commands and ready lines for Next.js, SvelteKit and Vite. For Remix and Astro it gives only a general start command, so tell your AI your real start command and the line your server prints when it is ready (for example the 'listening on' line). Give it your build and start commands. List every page you want checked, not just the home page, such as a product page and a blog post. The app must build and start with those commands before the check can run."
  - The sample config uses port 3100 and pnpm commands. If you use npm or yarn, or your app starts on another port, ask your AI to change the start command, the port and the workflow file before you run anything.
  - Run the check on your computer first and read the report. The config uses whichever @lhci/cli version your package manager installs. Some audit names change between Lighthouse versions, so if a limit names an audit the report does not have, ask your AI to fix the name.
  - "Commit the config and workflow file, then open a pull request to see the check run in your pipeline. When the gate fails, open the saved report and fix the audit it flags. Do not raise the limit to make it pass. A failed gate means a real slowdown: fix the cause the report names, push again, and keep the limit. Once it passes, use the Page metadata fixer and the Page SEO optimizer for the search side."
output_sample:
  input:
    - Your web app code
    - Your build and start commands
    - Speed limits you want (optional)
    - The URLs you want checked (optional, the home page by default)
  prerequisites:
    - An AI that can read your project files and run code
    - Node installed
    - A build pipeline such as GitHub Actions
  output:
    - name: lighthouserc.cjs
      contains: One config with named budgets for load time, layout jumps and blocking time, plus minimum category scores.
    - name: package.json script
      contains: An lhci script that runs the same check on your computer and in your pipeline.
    - name: .github/workflows/lighthouse.yml
      contains: A pipeline job that builds, starts the app, runs the check and saves the reports.
    - name: Dev dependency
      contains: The @lhci/cli package added to your project to run the check.
    - name: Saved reports
      contains: HTML and JSON speed reports uploaded from each run.
    - name: Final reply
      contains: The AI lists the files it changed and the result of the first local run, so you can check them before you commit.
