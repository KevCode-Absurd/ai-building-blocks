new_slug: paid-campaign-builder
name: Paid campaign builder
summary: Name your goal and budget. Get campaign structure, targeting, bids and
  a plan to scale across Google, Meta and LinkedIn.
job: plan-ad-tests
headline: Paid campaign builder
subhead: "A paid ads plan that tells you what to launch first: campaign
  structure, audiences, bids, budget split and how to scale if it works. It
  covers Google, Meta and LinkedIn."
explain: |
  A paid ads plan that tells you what to launch first: campaign structure, audiences, bids, budget split and how to scale if it works. It covers Google, Meta and LinkedIn.

  It starts with your goal, such as leads or sales, your target cost per sale and your monthly budget. Then it asks about your offer, buyer and landing page, and whether you have past results or tracking set up. It picks the platform that fits your buyer, builds campaigns and ad groups, suggests keywords or audiences, and sets starting bids. It then lists what to test and the numbers that tell you to scale or stop.
when:
  - You are about to spend on ads and have no structure.
  - Your current ads burn budget with few sales.
  - You need to decide between Google, Meta and LinkedIn.
  - You want a test plan with clear stop and scale numbers.
you_give:
  - Goal and target cost per result
  - Monthly budget
  - Offer and landing page
  - Past ad results (optional)
you_get:
  - Campaign and ad group structure
  - Audience and keyword picks
  - Bid and budget plan
  - Test list and scaling rules
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your ad account exports.
