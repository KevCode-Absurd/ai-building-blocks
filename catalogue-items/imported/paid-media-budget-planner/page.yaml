thinking: high
thinking_why: Spend choices depend on tradeoffs between channels and risk.
new_slug: paid-media-budget-planner
name: Paid media budget planner
summary: "Plan your paid media budget: give your goal and spend, and get channel picks, a budget split, test ideas with stop and scale numbers, and what to skip."
job: plan-ad-tests
headline: Paid media budget planner
subhead: A paid media plan built on testable bets instead of habit. It tells you where your budget should go, what to test, and which spend to cut.
explain: |
  A paid media plan built on testable bets instead of habit. It tells you where your budget should go, what to test, and which spend to cut.

  Each plan starts with a clear hypothesis: who you reach, the offer, the channel, the result you measure and the size of the change. You also decide in advance what number means keep going and what means stop. It then compares channels like search, shopping, Meta, TikTok and LinkedIn by fit with your buyer, splits budget, picks audiences and bid style, and explains why platform reports overstate results. It also names what not to buy.
when:
  - You inherited ad accounts that run on autopilot.
  - You must split a budget across several platforms.
  - You are deciding whether to scale or kill a campaign.
  - You need a spend case to show your boss or investors.
not_for:
  - "You need ad copy or images made: use a creative writer or designer, since this plan does not produce ad creative."
  - "You want a deep read of past campaign results: pull your own numbers from your analytics tool or ask a performance marketer."
  - "You have no ad account or sales tracking yet: set up conversion tracking first, then come back to plan spend."
you_give:
  - Goal and monthly budget
  - Product and buyer
  - Current channels and results (optional)
  - Target cost per customer
you_get:
  - Channel picks with reasons
  - Budget split
  - Test hypotheses with stop and scale numbers
  - Audience and bid guidance
  - List of spend to avoid
how_to_use:
  - Gather your goal, monthly budget, target cost per customer, and what you sell and to whom.
  - Add your current results from each ad platform if you have them (optional).
  - Paste the skill into Claude, ChatGPT or Gemini, then paste your details. No code or paid tool is needed.
  - Read the test table first. Check that each test has a stop number and a scale number you can measure.
  - Compare any benchmarks in the plan with your own data. Treat them as rules of thumb.
  - Start with one or two tests. Review them against the stop and scale numbers before you move more budget.
output_sample:
  input:
    - Your goal and monthly budget
    - Your product and who buys it
    - Your target cost per customer
    - Your current channels and results (optional)
  prerequisites:
    - Working sales or lead tracking in your analytics tool, so you can check results against your own numbers
  output:
    - name: Test hypotheses
      contains: Each bet lists the audience, offer, channel, metric measured and size of change, with the numbers that mean stop or scale.
    - name: Channel selection
      contains: Search, shopping, Meta, TikTok, LinkedIn and others compared by fit with your buyer, with reasons for each pick.
    - name: Budget allocation
      contains: How to split spend between brand and performance, and between steady spend and tests.
    - name: Audience targeting
      contains: Who to reach with new audiences, who to retarget, and who to leave out.
    - name: Bid strategy
      contains: Which bid style fits your data today and when to change it.
    - name: What not to spend on
      contains: Spend to cut or avoid, with the reason for each.
    - name: Attribution check
      contains: Why platform reports overstate results and which number to trust when you decide.
