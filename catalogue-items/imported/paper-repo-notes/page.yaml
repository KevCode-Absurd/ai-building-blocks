thinking: high
thinking_why: It reads closely and ties each claim to evidence.
new_slug: paper-repo-notes
name: Paper and repo to structured notes
summary: Give it a paper, repo or messy notes. Get claims, methods and evidence
  sorted into a clear research folder.
job: research-topics
headline: Paper and repo to structured notes
subhead: "A tidy research folder built from whatever you have: a paper, a code
  repo, logs or messy notes. It sorts the contents into claims, methods, results
  and the evidence behind each."
explain: |
  A tidy research folder built from whatever you have: a paper, a code repo, logs or messy notes. It sorts the contents into claims, methods, results and the evidence behind each.

  The compiler accepts almost any input, from PDF and arXiv links to notebooks, experiment logs, config files and meeting notes. It reads them with its own file tools, works out what was tried and what was found, and records dead ends as well as wins. Every claim links to its evidence, so you can see where it came from. The folder is then checked for completeness. If you have nothing, it builds the folder by asking you questions.
when:
  - You finished a project and the knowledge is scattered across files.
  - You want a paper and its code turned into usable notes.
  - A teammate leaves and you need their research written down.
  - You need claims tied to the logs that prove them.
you_give:
  - Paper, repo, logs, notebooks or notes
  - Folder to save into
  - Context about the research goal (optional)
you_get:
  - Structured research folder
  - Claims linked to evidence
  - Methods and results sections
  - Record of failed attempts and decisions
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read your files and run code.
