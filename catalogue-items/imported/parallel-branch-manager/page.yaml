thinking_why: It runs fixed git steps.
new_slug: parallel-branch-manager
name: Parallel branch manager
summary: Set up a parallel branch manager for git. Each task gets its own worktree folder, free ports and clean-up, so branches stop clashing.
job: build-software
headline: Parallel branch manager
subhead: A separate working copy of your code for each task, so several features or fixes can run at once without stepping on each other. Each copy gets its own folder, branch and ports.
explain: |
  A separate working copy of your code for each task, so several features or fixes can run at once without stepping on each other. Each copy gets its own folder, branch and ports.

  It creates git worktrees with predictable names, hands each one a free port and remembers the assignment, and copies your local settings files across. It can install dependencies by reading the lock file. When you finish, it checks for unsaved changes and merged branches before removing old copies, so cleanup is repeatable and safe. It is useful when several AI agents each need a branch of their own.
when:
  - You need a quick fix while a feature branch is still open.
  - Several AI agents must work in the same project without clashing.
  - Two dev servers keep fighting for the same port.
  - Old branches pile up and you want safe cleanup.
not_for:
  - "You only want a quick look at a diff: stay on your current branch and use git diff."
  - "You have no git repo yet: start one with git init first, then come back."
  - "Your AI can't run git commands in a chat: ask a developer to run the steps, or run them yourself in a terminal."
you_give:
  - A git repo
  - Branch names and task names
  - Settings files to copy (optional)
you_get:
  - One worktree per task
  - Free port per worktree
  - Copied settings and installed dependencies
  - Safe cleanup of stale copies
how_to_use:
  - Check that your AI can run git commands and Python scripts. This skill needs code running, so use a coding tool or a chat with a terminal.
  - "Give your AI the skill folder (it holds scripts/worktree_manager.py and scripts/worktree_cleanup.py). If you only paste the instructions, ask it to run git worktree commands by hand."
  - "Tell your AI the branch name, a worktree name and the base branch. It runs: python scripts/worktree_manager.py --repo . --branch feature/new-auth --name wt-auth --base-branch main. Add --install-deps to install dependencies."
  - Check the port list it gives you, then start your app on those ports.
  - "When a task is done, merge it or open a pull request. Then run python scripts/worktree_cleanup.py --repo . --stale-days 14 to scan, and add --remove-merged to remove only worktrees that are merged and clean."
output_sample:
  input:
    - Your git repo
    - Branch names and a name for each worktree
    - The base branch to start from, such as main
    - Settings files to copy, such as .env files (optional)
  prerequisites:
    - An AI that can run git commands and Python scripts
    - Python installed on your computer
    - Git installed on your computer
  output:
    - name: Worktree folder
      contains: A separate working copy of your code on its own branch, named like wt-auth.
    - name: .worktree-ports.json
      contains: The ports given to this worktree for the app, database and cache, saved so they stay the same.
    - name: Copied settings files
      contains: Your .env files copied from the main repo into the new worktree, with a warning for any that are missing.
    - name: Installed dependencies
      contains: Packages installed from your lock file, only if you ask for it.
    - name: Cleanup report
      contains: A list of worktrees that are old, have unsaved changes or are already merged.
    - name: Safe removal
      contains: Removal of worktrees that are merged and clean, or forced only when you say so.
