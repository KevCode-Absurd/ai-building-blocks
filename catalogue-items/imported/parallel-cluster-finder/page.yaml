new_slug: parallel-cluster-finder
name: Parallel cluster finder
summary: Ask what parallel clusters you can use. Get a list, with profiles
  checked and set as default.
job: build-software
headline: Parallel cluster finder
subhead: A list of the computing clusters your MATLAB can use, with each profile
  checked and one set as the default. It answers the question of where you can
  run big jobs.
explain: |
  A list of the computing clusters your MATLAB can use, with each profile checked and one set as the default. It answers the question of where you can run big jobs.

  It lists saved cluster profiles, finds clusters on your network and cloud, and imports a profile file from an admin. Then it validates the profile to prove it connects, sets the default and removes profiles you no longer need. It covers local, job-scheduler and cloud cluster types. It does not submit jobs or open pools. You need MATLAB with Parallel Computing Toolbox.
when:
  - You do not know what parallel resources you have.
  - An admin sent you a profile file and you need to load it.
  - A job fails and you suspect a broken cluster profile.
  - You want to change which cluster runs by default.
you_give:
  - MATLAB with Parallel Computing Toolbox
  - Profile file from an admin (optional)
  - Which cluster you want as default (optional)
you_get:
  - List of available clusters and profiles
  - Validation result for each profile
  - Imported profile
  - Default cluster set
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB.
