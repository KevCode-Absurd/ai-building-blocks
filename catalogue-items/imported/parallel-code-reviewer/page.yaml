thinking: high
thinking_why: It runs several reviewers, then filters their findings.
new_slug: parallel-code-reviewer
name: Parallel code reviewer
summary: Get a code review of your git changes from four reviewers working at once. You get one short list of issues that matter, ranked, with fixes.
job: test-and-fix-code
headline: Parallel code reviewer
subhead: One short list of code issues that matter, produced by four reviewers working at the same time on your change. Noise is filtered out before you see it.
explain: |
  One short list of code issues that matter, produced by four reviewers working at the same time on your change. Noise is filtered out before you see it.

  It picks the review scope in order: files you name, then your current git changes, then a branch or commit you ask for. It reads your project notes, then sends four read-only reviewers to hunt for different problems such as behaviour regressions, security and privacy, missing tests and risky structure. The main agent then removes weak or duplicate findings, orders the rest and writes one summary. It only reviews. It never edits your files.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The author's own file header (Dimillian) says MIT. Credit goes to Dimillian and sickn33.
when:
  - You want a second look at a change before merging.
  - A large diff is too long to read line by line.
  - You want security and logic checked together.
  - You need a review without code being modified.
not_for:
  - "You have a tiny change or one small file: read it yourself or ask your AI for a quick single review."
  - "You want the problems fixed for you: this tool only reviews, so ask your AI to make the edits after you read the list."
  - "Your AI tool cannot run sub-agents (helpers that work in parallel): ask your AI for a normal one-pass code review instead."
you_give:
  - A git diff, branch, commit or file list
  - Project notes or rules (optional)
  - Areas of concern (optional)
you_get:
  - Ranked list of real issues
  - Where each one sits in the code
  - Why it matters
  - No changes to your files
how_to_use:
  - Open your AI tool in the project folder, so it can read your files and run sub-agents (helpers that work at the same time). Four reviewers use noticeably more AI usage or cost than one review, so decide before you run it on a large change.
  - Paste the skill into the chat, or load it as a skill if your tool supports that.
  - "Say what to review: file names, your current changes, or a branch or commit."
  - Add what the change should do, and any rules to follow (optional). If you skip this, your AI will guess from the code.
  - Read the ranked list. Start with Fix now. Your AI will not edit anything, so make the fixes yourself or ask in a new request.
output_sample:
  input:
    - A git diff, branch, commit or list of files
    - Project notes or rules, such as AGENTS.md (optional)
    - What the change should do, in your words (optional)
  prerequisites:
    - An AI that can read your project files and run sub-agents
  output:
    - name: Findings
      contains: Each issue with its file and line or symbol, category, severity, why it matters, a fix and a confidence level.
    - name: Open questions
      contains: Possible problems your AI could not judge because the goal of the change was unclear.
    - name: Fix now
      contains: High-severity, high-confidence issues to fix before you merge.
    - name: Fix soon
      contains: Medium issues that are likely worth fixing before merge.
    - name: Optional follow-up
      contains: Lower-severity points that can wait, plus what is safe to leave alone.
