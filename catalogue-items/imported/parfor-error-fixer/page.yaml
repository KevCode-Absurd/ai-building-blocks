thinking: high
thinking_why: Finding why a loop fails needs careful reasoning about variables.
new_slug: parfor-error-fixer
name: Parfor error fixer
summary: Fix a parfor loop that MATLAB won't run. Paste the loop or error and get the cause plus a fixed parfor loop, checked with MATLAB's code checker.
job: test-and-fix-code
headline: Parfor error fixer
subhead: A parfor loop that runs, with the exact reason the old one failed. Paste the loop or the error, and it uses MATLAB's own code checker rather than guessing the rules.
explain: |
  A parfor loop that runs, with the exact reason the old one failed. Paste the loop or the error, and it uses MATLAB's own code checker rather than guessing the rules.

  Parfor sorts each variable in the loop as sliced, reduction, broadcast or temporary, and mistakes cause errors like unable to classify. AI models often misremember these rules, so the skill runs the code analyser first and trusts that. Then it explains which variable broke the rule and rewrites the loop. It also helps convert a normal for loop into parfor. It does not tune speed. You need MATLAB.
when:
  - MATLAB says it cannot classify a variable in your parfor.
  - You want to turn a slow for loop into a parallel one.
  - A sliced or reduction variable behaves oddly.
  - You are reviewing a script that uses parfor and want it checked.
not_for:
  - "Your parfor runs but is slow: this tool does not tune speed, so time the loop and ask about pool choice or worker setup instead."
  - "Your workers need paths, toolboxes or other setup: fix the worker environment first, because this is not a variable problem."
  - "You have no MATLAB access: ask a colleague who has MATLAB to run the code checker, since this tool relies on it."
you_give:
  - The parfor loop or whole .m file
  - The error text (optional)
  - MATLAB access
you_get:
  - Plain reason for the error
  - Code checker findings
  - Fixed loop
  - Notes on variable types
how_to_use:
  - Open an AI that can run MATLAB code checks. Add this skill, or paste its text into the chat.
  - Paste your parfor loop or whole .m file. Add the error text if you have it.
  - Ask your AI to diagnose and fix the parfor. It runs the MATLAB code checker first.
  - Read the cause and the fixed loop. Check that the fix keeps the same results as your original loop.
  - Make sure the checker was run again on the fix and shows no parfor errors.
  - Then time the new loop against the old one. Ask a separate question if you need more speed.
output_sample:
  input:
    - Your parfor loop or whole .m file
    - The error text (optional)
  prerequisites:
    - An AI that can run MATLAB's code checker, such as through the MATLAB MCP tool
    - MATLAB installed
  output:
    - name: Error cause
      contains: The exact checker message and a plain reason for it, such as which variable breaks which rule.
    - name: Analyser findings
      contains: What MATLAB's code checker reported on your original loop, read before any fix is suggested.
    - name: Fixed loop
      contains: Your loop rewritten so each variable fits one type, with the same results as the original for loop.
    - name: Variable types
      contains: Notes on whether each variable is sliced, reduction, broadcast or temporary, and why it changed.
    - name: Verification result
      contains: The code checker run again on the fixed loop, confirming no parfor errors remain.
