thinking: high
thinking_why: It weighs reach, cost and risk across partner types.
new_slug: partner-deal-evaluator
name: Partner deal evaluator
summary: Check a partner deal before you sign. Describe who approached you and get a sign or pass call, the right tier, a 90-day plan and a revenue share range.
job: sell-and-negotiate
headline: Partner deal evaluator
subhead: A sign or pass decision on a partner who approached you, with the right tier, a 90-day plan and a revenue share range. It tells you if they are a real partner or after better terms.
explain: |
  A sign or pass decision on a partner who approached you, with the right tier, a 90-day plan and a revenue share range. It tells you if they are a real partner or after better terms.

  It asks four questions: does this partner bring their own demand, what tier fits (referral, reseller, OEM, services or strategic), what joint plan proves it works in 90 days, and what share makes sense before direct sales would earn more. The result includes clear stop criteria. It also helps with underperforming partners, deciding to restructure or end. It does not sign anything. You decide.
when:
  - A company asks for reseller or OEM terms and you are not sure.
  - A big name wants a strategic tie and you need to test it.
  - A consulting firm wants a share of your product revenue.
  - An existing partner underperforms and you must decide what to do.
not_for:
  - "You want to check cost and return on a partner you already signed: work it out with your own sales and cost numbers, as this tool is for the sign decision."
  - "You need a demo or technical trial for a deal already in progress: ask a sales engineer or your product lead."
  - "You want to buy the other company, not partner with it: talk to a lawyer or M&A adviser about an acquisition."
you_give:
  - Who the partner is and what they ask for
  - Their proof of demand, such as named customers they sold to in the last 12 months and the size of their sales team
  - Your product, price and margin
  - Your current partner terms (optional)
you_get:
  - Sign or pass call
  - Recommended tier
  - 90-day joint plan
  - Revenue share band with stop criteria
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. For the scripts, use an AI that can run Python code and read files.
  - Tell your AI who the partner is, what they ask for, and what they bring. Add your product, price and margin.
  - Answer its questions one at a time. It first checks whether the partner has their own customers. You must supply the partner's proof of demand and your own margin yourself. Without them, the tier call cannot be trusted, and your AI writes "unknown".
  - Without Python, your AI works through the same steps by hand in chat. The answer is less exact.
  - The skill names researchers, companies and case studies. The author did not check these. Treat them as the author's rules of thumb, not as research results.
  - Read the tier call, the 90-day plan and the revenue share range. Check them against your own numbers.
  - Put the stop criteria into the contract before you sign. You make the final call.
  - Take the tier call and revenue share band to whoever approves partner deals. Ask your sales operations or deal desk to handle pricing questions after the deal is signed.
output_sample:
  input:
    - Who the partner is and what they ask for
    - Your product, price and margin
    - Proof they bring their own customers, such as named accounts and sales team size
    - Your current partner terms (optional)
  prerequisites:
    - An AI that can run Python code, if you want the three scripts to run. Without code, your AI can still follow the steps in a chat.
  output:
    - name: Intake
      contains: The partner's type, proof of their own demand, strategic value and the commitments they have offered.
    - name: Tier call
      contains: "Which tier fits: referral, reseller, OEM, services or strategic, with the reasons and the stop criteria."
    - name: 90-day joint plan
      contains: Steps before launch, the launch plan, a mid-quarter check and the tests of success at day 90.
    - name: Revenue share band
      contains: Margin per deal direct and through the partner, a suggested share range and the break-even point.
    - name: Kill criteria
      contains: The signs that mean you should restructure or end the deal, to write into the contract.
next: [partner-profit-tester, partner-deal-terms-writer]
terms:
  - term: Reseller
    meaning: A partner that buys or sells your product to its own customers and keeps part of the price.
  - term: OEM
    meaning: A partner that builds your product into its own product and sells it under its own name.
  - term: SI-consulting
    meaning: A services firm that sets up your product for customers and may want a share of the product revenue.
  - term: Revshare
    meaning: The part of each sale you pay the partner.
  - term: MDF
    meaning: Market development funds. Money you give a partner to promote your product.
  - term: Break-even
    meaning: The sales volume at which selling through the partner earns you the same as selling direct.
