thinking: high
thinking_why: Reading patent claims is hard and mistakes are costly.
new_slug: patent-launch-risk-scanner
name: Patent launch-risk scanner
summary: Check your product for patents that could block a launch. Get a shortlist and a first claim comparison to take to a patent lawyer. Not legal advice.
job: check-contracts
headline: Patent launch-risk scanner
subhead: Describe your product and where you will sell it. Your AI picks the patents most likely to block you and compares their claims with your product. Use it to prepare before you talk to a patent lawyer.
explain: |
  A first-pass list of patents that could block your product, with a claim comparison for the most likely ones. It is a screening step before a lawyer looks, not a legal opinion.

  You describe the product, process or feature and where you will sell it. It gathers the technical detail, searches for patents if a patent tool is connected, or uses the ones you supply, then picks the two to five most plausible. For each, it compares the patent's claims against your product part by part. A result of nothing found never means clear to launch. A registered patent attorney must do the formal check.
when:
  - You are about to launch a feature and want to catch obvious patent problems.
  - A competitor holds patents in your area.
  - You are preparing for a talk with patent counsel.
  - You want to know which patents to worry about first.
not_for:
  - "You need a formal freedom-to-operate opinion or a legal ruling: hire a registered patent attorney, as this only screens."
  - "You want to know if your own idea can be patented: ask a patent attorney, because this checks other people's patents."
  - "You need to read a contract or licence: ask a lawyer, as this only looks at patent claims."
you_give:
  - Your description of the product, process or feature
  - The countries where you will sell
  - Patents you already know about (optional)
  - Your launch timing
you_get:
  - A shortlist of patents that might block your launch
  - A first comparison of each patent's claims with your product
  - Open questions to ask your patent lawyer
  - A clear note that this is not a legal opinion
how_to_use:
  - Open your AI chat and paste in the skill text. It works in Claude, ChatGPT or Gemini.
  - Paste your product description, your countries and your launch timing.
  - Add any patent numbers or text you already have. If your AI has no patent search tool, this step matters most.
  - Read the shortlist and the claim comparison. Check that each patent really matches your product.
  - Take the open questions to a registered patent attorney before you launch.
output_sample:
  input:
    - Your description of the product, process or feature, with technical detail
    - The countries where you will sell
    - Patents you already know about (optional)
    - Your launch timing
  prerequisites:
    - A patent search tool connected to your AI is best, and it may be a paid service. Without one, you paste in the patents yourself.
    - This skill was built for the Claude for Legal plugin. In a normal chat, skip the setup file and paste your details.
  output:
    - name: Subject
      contains: Your product or feature as the scan understood it, with countries and timing.
    - name: Search scope
      contains: What was searched and how, or a note that no patent tool was connected.
    - name: Patents identified
      contains: The two to five most plausible patents that could block your launch.
    - name: Claim charts, first pass
      contains: Each independent claim compared with your product part by part, with equivalents and shared-infringement risks flagged.
    - name: Open questions
      contains: What a full study would need to check, such as validity, history and licence options.
    - name: Signals
      contains: Hints that are not confirmed patents.
    - name: Recommended next steps
      contains: What to do next, with a note on how knowing about a patent affects wilful infringement.
