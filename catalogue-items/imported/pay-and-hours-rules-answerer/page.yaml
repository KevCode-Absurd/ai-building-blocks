name: Pay and hours rules answerer
summary: Ask a pay, overtime or break question and where you are. Get the rule with its source. Not legal advice.
job: hire-people
headline: Pay and hours rules answerer
subhead: Ask a pay, overtime or break question and where you are. Get the rule with its source. Not legal advice.
explain: |
  A cited answer to a pay, overtime or break question for the place you actually work. It looks up the current rule instead of quoting from memory. It is not legal advice.

  You ask something like whether a role is exempt from overtime, how meal breaks work or when final pay is due, and say the state or country. It researches that place's rules, names the source, and says when the answer is close or changing. Pay thresholds and exemption tests shift often and differ by state, so it never states them unchecked. It asks for the location if you leave it out.
when:
  - You are not sure if a role needs overtime pay.
  - An employee asks about breaks or leave.
  - You must know when final pay is due after someone leaves.
  - You are deciding how to classify a worker.
you_give:
  - Your question
  - State or country
  - Role details such as pay and duties (optional)
you_get:
  - Rule for your location
  - Source link or citation
  - Note on close calls
  - Flag if the law is changing
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can search the web for the current rule.
  - Where the skill points to /employment-legal:cold-start-interview, use the setup-interview folder inside it. We copied it in so the skill works on its own.
