thinking: medium
thinking_why: It matches amounts and explains the gaps.
new_slug: payout-reconciler
name: Payout reconciler
summary: Check your Shopify Payments payouts against the orders behind them. Find the gaps that explain a missing dollar, in one reconciliation file.
job: run-your-store
headline: Payout reconciler
subhead: Each Shopify Payments payout matched to the orders that funded it, with gaps flagged so you can trace a missing dollar. It reads data only and changes nothing.
explain: |
  Each Shopify Payments payout matched to the orders that funded it, with gaps flagged so you can trace a missing dollar. It reads data only and changes nothing.

  For every payout in the last 30 days or a range you pick, it adds up gross sales, refunds, adjustments and fees, then compares the total against the transactions behind it. Differences larger than your tolerance, one cent by default, are flagged for review. Flagged items are leads to check, not confirmed errors. You need a store on Shopify Payments, a command-line login and read access to payouts and orders. Stores on other gateways get a clear message.
when:
  - A payout is lower than you expected.
  - You close the books and must match deposits to orders.
  - Refunds or fees seem to be missing from a payout.
  - Your accountant asks for proof of what each payout covered.
not_for:
  - "Your store uses only third-party gateways: it stops with a message, so use that gateway's own dashboard to match deposits."
  - "You suspect fraud: it finds money gaps, not fraud, so use the payout detail view in your Shopify admin."
  - "You need the final books match: compare the result with the deposit records in your bookkeeping software or ask your accountant."
you_give:
  - Store address
  - Days to look back (optional)
  - Tolerance amount (optional)
  - Shopify login with payout and order access
you_get:
  - Each payout matched to its orders
  - Totals for sales, refunds, adjustments and fees
  - List of gaps over your tolerance
  - Readable or JSON output
how_to_use:
  - Check that your store uses Shopify Payments. If it does not, this skill stops with a message.
  - Use an AI tool that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot reach your store.
  - Sign in with the Shopify command-line tool, with read access to payouts and orders.
  - Ask your AI to run the payout reconciliation skill. Give it your store address, and days to look back or a tolerance if you want to change them.
  - Open the CSV file and check each flagged payout in your Shopify admin. Flags are leads, not confirmed errors.
  - Payouts still in transit are skipped. Run it again after they are paid.
  - A refund can land in the next payout, so a flag may only mean the refund fell in a different window. Check the next payout before you treat a flag as an error.
  - Match the paid total with the deposit in your bookkeeping software or send the CSV to your accountant.
output_sample:
  input:
    - Your store address
    - Days to look back (optional, 30 by default)
    - Tolerance amount (optional, one cent by default)
    - Output style, readable or JSON (optional)
  prerequisites:
    - A store that uses Shopify Payments
    - A Shopify command-line login with read access to payouts and orders
    - An AI that can run commands and reach your Shopify admin
  output:
    - name: Start banner and step log
      contains: Shows the store, the start time and what each step did as the check runs.
    - name: Payout check
      contains: For each payout, the reported net, the expected net from charges, refunds, adjustments and fees, and the difference.
    - name: Order cross-check
      contains: Candidate orders from around the payout date, pulled only for payouts that were flagged.
    - name: Summary
      contains: Counts of payouts, matches and gaps, plus the total size of the gaps and the top ones.
    - name: payout_reconciliation CSV file
      contains: One row per payout with its figures, difference, currency and a verdict of ok or discrepancy.
