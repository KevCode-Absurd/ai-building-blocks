thinking: high
thinking_why: Tuning needs careful technical reasoning.
new_slug: pcb-coupler-designer
name: PCB coupler designer
summary: Design a PCB power divider or coupler for your band and split ratio in MATLAB. You get the board model and a plotted response.
job: build-software
headline: PCB coupler designer
subhead: A power splitter or coupler designed for your band and split ratio, with its response plotted so you can see if it works. It runs in MATLAB.
explain: |
  A power splitter or coupler designed for your band and split ratio, with its response plotted so you can see if it works. It runs in MATLAB.

  It covers Wilkinson splitters, branchline and ratrace couplers, corporate dividers for arrays, directional couplers, and beamforming designs such as SIW splitters and Rotman lenses. You set the centre frequency and split. It builds the board model on your substrate, estimates the mesh and memory before the full solve, then reports S-parameters. It expects the board material to be set first. You need MATLAB with RF PCB Toolbox.

  Licence: this is MathWorks' skill, copied unchanged from MathWorks, not written for this library. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause, plus a rule that you may use it only with MathWorks products such as MATLAB. The skill file and its manifest link a different MathWorks licence page, which is MathWorks' own upstream terms. LICENSE.md supersedes it for this copy, and the MathWorks-products-only rule applies to all use.
when:
  - You need to divide a signal equally or unequally.
  - You are building a feed network for an antenna array.
  - A circuit needs a quadrature or sum and difference network.
  - You want to sample a signal with a directional coupler.
not_for:
  - "You want a filter on a PCB: use the PCB filter design skill (matlab-design-pcb-filter), not this one."
  - "You want to design a plain transmission line or a balun: use the matching MATLAB PCB skill for that part."
  - "You need to tune an existing design or join several parts into one circuit: use the MATLAB PCB optimize or circuit skills."
you_give:
  - Your centre frequency and bandwidth
  - Your split ratio
  - Your board material and conductor settings
  - The type of part you want, such as Wilkinson, branchline or ratrace (optional)
you_get:
  - Designed coupler or splitter model
  - Plotted S-parameter response
  - Mesh and memory estimate
  - Next steps for checking and tuning
how_to_use:
  - Open an AI that can run MATLAB code. You need MATLAB with RF PCB Toolbox. Both are paid licensed products.
  - Catalog couplers solve with the method of moments (MoM) by default. The finite element method (FEM) needs the IDMF solver, which runs through WSL on Windows. If it is missing, stay with MoM.
  - Set up your board material first, using the material setup skill. The design call sizes the lines for the board material it sees when you call it. If you change the board afterwards, such as the multi-layer example, check the response again and re-run the design if it moved.
  - Paste this skill into your AI. Add your centre frequency, bandwidth and split ratio.
  - Ask your AI to check the mesh and memory estimate before the full solve.
  - Read the S-parameter plots and check they meet your target across the band.
  - Tune the sizes or join the part into a larger circuit with the next skills.
output_sample:
  input:
    - Your centre frequency and bandwidth
    - Your split ratio
    - Your board material and conductor settings
    - The coupler or splitter type you want
  prerequisites:
    - MATLAB with RF PCB Toolbox, both paid licensed products
    - For FEM solves only, the IDMF solver (WSL on Windows). MoM needs nothing extra.
    - An AI that can run MATLAB code
    - Your board material set up first, using the material setup skill
  output:
    - name: Coupler or splitter model
      contains: A board model of your chosen part, such as a Wilkinson, branchline, ratrace, corporate divider or Rotman lens.
    - name: Mesh and memory estimate
      contains: A check of the mesh density and memory needed, run before the full solve.
    - name: S-parameter response
      contains: Plots of S-parameter size in dB against frequency across your band, with a legend that names each one, such as S11 or S21, so you can see if it works.
    - name: Port numbering
      contains: Which port is which on a 3-port splitter or 4-port coupler, so you read the plots right.
    - name: Next steps
      contains: Pointers to check the result with EM analysis, tune the sizes, or join it into a larger circuit.
