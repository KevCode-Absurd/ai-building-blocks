thinking: high
thinking_why: It sets limits and judges search results.
new_slug: pcb-design-optimizer
name: PCB design optimizer
summary: Tune your RF PCB filter or coupler in MATLAB for wider bandwidth, better return loss or smaller area, within the size limits you set.
job: build-software
headline: PCB design optimizer
subhead: Set a goal such as wider bandwidth or smaller area. Get PCB sizes tuned by search to meet it. Check the result with a full EM analysis before you build it.
explain: |
  PCB dimensions tuned automatically to hit a goal such as wider bandwidth, better return loss or smaller area. It runs in MATLAB. Return loss is how much signal bounces back instead of passing through, so a bigger number is better. An EM analysis is a full electromagnetic simulation of the board.

  It always starts with the toolbox's built-in optimize function rather than a hand-made loop. You set the objective, upper and lower bounds on each size and any constraints. It can run search methods such as SADEA, pattern search or surrogate optimisation, and it can use a custom objective built from the response curves. Afterwards it recommends checking the result with an EM analysis. It needs an existing design to start from, plus MATLAB with RF PCB Toolbox.
when:
  - Your filter misses its bandwidth target.
  - You want a coupler shrunk without losing performance.
  - Return loss is too weak at the band edge.
  - You need a custom goal, not a standard one.
not_for:
  - "You have no starting design yet: build one first with the MATLAB PCB RF filter designer or MATLAB PCB coupler and splitter designer, then come back."
  - "You only want to check how a design performs: use the MATLAB PCB signal loss analyzer or run an EM analysis in MATLAB, with no search."
  - "You only want to try a few sizes with no goal: loop over the S-parameter calls in MATLAB yourself."
you_give:
  - Starting PCB design in MATLAB
  - Goal such as bandwidth, return loss or area
  - Bounds on each dimension
  - Constraints
you_get:
  - Optimised dimensions
  - Run settings and method used
  - Before and after response
  - Advice to validate the result
how_to_use:
  - Open an AI that can run MATLAB code. You need MATLAB with RF PCB Toolbox.
  - Check your extra toolboxes. Pattern search and surrogate search need Global Optimization Toolbox. The SADEA methods need Antenna Toolbox.
  - Paste this skill into your AI. Then add your starting design, your goal and the lower and upper limit for each size.
  - Count the single numbers in each property you will vary. A property with several numbers needs one lower and one upper limit for every number.
  - Ask your AI to use the built-in optimize function first, not its own search loop.
  - Compare the before and after results. Look at return loss, bandwidth and area.
  - Check the final design with an EM analysis before you use it.
output_sample:
  input:
    - Your starting RF PCB design in MATLAB, such as a filter or coupler
    - "Your goal: bandwidth, return loss or area"
    - Lower and upper limits for each dimension
    - Extra limits on the response (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with RF PCB Toolbox
    - Global Optimization Toolbox, for the pattern search and surrogate methods
    - Antenna Toolbox, for the SADEA methods
  output:
    - name: Initial sizing
      contains: A first design made at your centre frequency, used as the starting point.
    - name: optimize() call
      contains: The code that sets your goal, dimension bounds, any constraints and the search method.
    - name: Optimised design
      contains: The new dimensions found by the search, shown as a PCB layout.
    - name: Before and after comparison
      contains: Return loss, bandwidth and area for the starting design next to the optimised one.
    - name: S-parameter plot
      contains: The response curves of the optimised design.
    - name: Validation advice
      contains: A reminder to check the final design with a full EM analysis.
