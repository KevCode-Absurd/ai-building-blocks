new_slug: pcb-gerber-exporter
name: PCB Gerber exporter
summary: Give it a finished PCB design. Get Gerber files with connectors, ready
  to send to a maker.
job: build-software
headline: PCB Gerber exporter
subhead: Gerber files for a finished RF board, with the right connectors
  attached and formatted for the company that will make it. It runs in MATLAB.
explain: |
  Gerber files for a finished RF board, with the right connectors attached and formatted for the company that will make it. It runs in MATLAB.

  It takes a pcbComponent or pcbStack design and writes the manufacturing set with gerberWrite. You choose RF connectors such as SMA, SMB or MMCX, including edge-launch types, and attach them so shielded analysis matches the real part. It formats output for makers such as OSH Park, Seeed or Advanced Circuits. Design and validation should be done first. You need MATLAB with RF PCB Toolbox.
when:
  - Your design is finished and you need files for a board maker.
  - You must place SMA connectors on the board.
  - A fab house wants a specific file layout.
  - You want analysis to include the connector.
you_give:
  - Finished PCB design in MATLAB
  - Connector type
  - Chosen fabrication service
  - MATLAB with RF PCB Toolbox
you_get:
  - Gerber file set
  - Connectors attached to the design
  - Fab-specific formatting
  - Ready package for ordering
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with PCB Toolbox.
