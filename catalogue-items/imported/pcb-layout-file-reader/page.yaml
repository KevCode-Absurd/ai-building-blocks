thinking_why: It reads files with fixed commands.
new_slug: pcb-layout-file-reader
name: PCB layout file reader
summary: Read a PCB layout file in MATLAB and list its nets, layers and parts. Works with Gerber, ODB++ and Allegro board files.
job: build-software
headline: PCB layout file reader
subhead: Give it a Gerber, ODB++ or Allegro file. Get its nets, layers and stack listed and ready to use. Bring a Gerber, ODB++ or Allegro file. Use the result to plan your next step.
explain: |
  A circuit board file you can finally open and inspect: its nets, layers, components, pins and copper shapes, listed in MATLAB and ready for analysis. Handy when a colleague or fab house sends a layout and you need to see what is inside before testing it.

  The skill picks the right reader by file type. Gerber files go through a layer-by-layer import with a stackup you define. ODB++ archives and Allegro board files use the board file reader, which also handles chip packages such as BGA substrates. Once loaded, you query nets and components, pull out metal polygons, or turn the board into a component for S-parameter work. It needs MATLAB and the RF PCB Toolbox.
when:
  - A fab house sends you Gerber files and you need to check the copper layers before analysis.
  - You received an Allegro board file and want a list of its nets and components.
  - You need metal shapes from a layout to reuse in your own design.
  - You want to run signal tests on a board someone else designed.
not_for:
  - "You want to save your own design as Gerber files: use the write PCB layout skill (matlab-write-pcb-layout), not this reader."
  - "You want S-parameters or other signal tests after loading the board: use the MATLAB analyze EM skill (matlab-analyze-em)."
  - "You want to build a board from simple shapes, or define materials: use matlab-assemble-pcb-layout or matlab-manage-pcb-material."
you_give:
  - A Gerber, ODB++ or Allegro file
  - The layer stackup, if the file lacks one (optional)
  - The nets or parts you care about (optional)
you_get:
  - A loaded board with its nets, layers and components listed
  - Extracted copper shapes per layer
  - A board object ready for S-parameter or power checks
  - The right reader call for your file type
how_to_use:
  - Open an AI that can run MATLAB code, with the RF PCB Toolbox installed.
  - Paste the skill text into the chat, or add the skill folder if your tool takes files.
  - Give your AI the board file. Add your stackup if it is a Gerber file. For an Allegro .brd file, give the path to extracta.exe.
  - Ask it to read the file and list the nets, layers and parts.
  - Check the lists against what you expect from the board before you go on.
  - Ask for the copper shapes or a board component if you need them next.
output_sample:
  input:
    - Your Gerber, ODB++ or Allegro board file
    - Your layer stackup, if the file has none (optional)
    - The nets or parts you want to look at (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with the RF PCB Toolbox
    - For Allegro .brd files, a local path to Cadence extracta.exe
  output:
    - name: Imported layout
      contains: The board loaded in MATLAB from a Gerber reader or the board file reader, chosen by your file type.
    - name: Layer stackup
      contains: The layers of the board in order, or a stackup you define for Gerber files.
    - name: Nets and components
      contains: Lists of net names, parts and pins that you can query one by one.
    - name: Shapes
      contains: Copper shapes from each metal layer, ready to reuse in your own design.
    - name: Board component
      contains: The imported board turned into a component you can use for S-parameter work.
