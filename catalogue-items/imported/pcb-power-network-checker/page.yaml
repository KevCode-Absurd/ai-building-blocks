thinking: high
thinking_why: Power checks need careful setup per net.
new_slug: pcb-power-network-checker
name: PCB power network checker
summary: Check your PCB power rails for voltage drop, hot spots and via current limits before you build. Pass or fail per rail against your own rules.
job: build-software
headline: PCB power network checker
subhead: Voltage drop and hot spots on your power rails, found before the board is built. Load a layout and see where copper is too thin, where a via carries too much current and which rails miss their voltage margin.
explain: |
  Voltage drop and hot spots on your power rails, found before the board is built. Load a layout and see where copper is too thin, where a via carries too much current and which rails miss their voltage margin.

  The skill lists the nets on an imported board and finds power rails by their names, guessing nominal voltage from labels like P0V8. You then set sources, loads and sense points. A DC solve runs per rail, or in a batch across all rails. Results are checked against rules you set for maximum current density, voltage margin and via current. It runs in MATLAB with the RF PCB Toolbox and needs a board imported first.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - You want to know if a 0.8 V rail drops too much before it reaches the chip.
  - A reviewer asks for proof that via currents stay under the limit.
  - You have a board with many rails and need all of them checked in one run.
  - You need to find which power nets are on an imported layout.
not_for:
  - "You need to import Gerber, ODB++ or Allegro files first: use the PCB layout file reader, then come back here."
  - "You want S-parameters or EM field results: use the PCB signal loss analyzer or run an EM analysis in MATLAB."
  - "You want crosstalk between signal traces: use the PCB trace designer."
you_give:
  - An imported PCB layout
  - The power net names or voltages (optional)
  - Source and load locations
  - Limits for drop, current density and via current
you_get:
  - A list of the power nets found
  - Voltage drop per rail
  - Current density and via current results
  - Pass or fail against your rules
how_to_use:
  - Check your tools first. This skill needs MATLAB with the RF PCB Toolbox, and both are paid licences. Your AI must be able to run MATLAB code.
  - Import your board first with the PCB layout file reader. A .brd file also needs Cadence extracta installed.
  - Collect the load current for each rail from a datasheet or your power budget. Do this before the run, because the checks depend on it.
  - Give your AI this skill, then tell it your source and load locations and your limits for drop, current density and via current. The example limits in the skill (such as 0.5 mA/mil² and 1 A) are placeholders. Replace them with your own design rules before you trust any pass or fail.
  - Each rail needs a sense point. If the net has no test point, the skill uses a resistor on the net as the sense point. Ask your AI to tell you which part it picked.
  - Ask it to list the power nets first. Confirm the rails and voltages are right, then run one rail or all rails in a batch.
  - Read the pass or fail table. Fix failing rails in your CAD tool, import the board again with the PCB layout file reader, and rerun this check.
output_sample:
  input:
    - Your PCB layout, already imported into MATLAB
    - Power net names or voltages (optional)
    - Source, load and sense locations
    - Your limits for voltage margin, current density and via current
    - Load current for each rail, from a datasheet or power budget
  prerequisites:
    - MATLAB with the RF PCB Toolbox, both paid licences
    - A PCB layout imported with the PCB layout file reader
    - Cadence extracta installed, if your file is a .brd file
  output:
    - name: Power net list
      contains: The power rails found on the board by net name, with a guessed nominal voltage for each.
    - name: Network setup
      contains: The source, load and sense points you set for each rail, so you can check them before the run.
    - name: Voltage distribution
      contains: The DC voltage across each rail and the worst voltage drop.
    - name: Current distribution
      contains: Current density in the copper and current through each via.
    - name: Design rule results
      contains: Pass or fail for each rail against your limits for current density, voltage margin and via current.
    - name: Batch summary
      contains: One row per rail with nominal voltage, minimum and maximum voltage, worst drop, peak current density, maximum via current and pass or fail.
