thinking: high
thinking_why: Tuning needs careful technical reasoning.
new_slug: pcb-rf-filter-designer
name: PCB RF filter designer
summary: Design a PCB RF filter from your pass band and rejection needs. Get a filter type, a built design and a plotted response. Needs MATLAB.
job: build-software
headline: PCB RF filter designer
subhead: Say what band you need to pass and what you need to block, and get a printed-circuit filter designed with its response plotted. You do not have to know which filter type fits.
explain: |
  Say what band you need to pass and what you need to block, and get a printed-circuit filter designed with its response plotted. You do not have to know which filter type fits.

  The skill compares the options by number of poles, size and sharpness: coupled-line, hairpin, open-loop, combline, interdigital and substrate-integrated types for bandpass, stepped-impedance for lowpass, and stub-based types for notch. It builds the chosen filter on your substrate, checks mesh and memory cost before a full solve, then plots the result. It can also pull a coupling matrix from measured data. Next steps are tuning and export. It runs in MATLAB with the RF PCB Toolbox.
when:
  - You need a bandpass filter at a set centre frequency and bandwidth.
  - You are unsure whether a hairpin or combline filter suits your size limit.
  - You need a notch to remove one unwanted signal.
  - You have measured filter data and want its coupling matrix.
not_for:
  - "You need to design a coupler or splitter: use the matlab-design-pcb-coupler skill, or ask an RF engineer."
  - "You want to tune filter sizes after the design: use the matlab-optimize-pcb-design skill."
  - "You have no MATLAB or paid RF PCB Toolbox: use a free circuit simulator, or ask a person who has the tools."
you_give:
  - Centre frequency and bandwidth
  - Stopband rejection needed
  - The substrate and metal
  - Size limits (optional)
  - Measured S-parameter data (optional)
you_get:
  - A recommended filter type with the reason
  - A designed filter object
  - A plotted frequency response
  - A mesh and memory estimate
how_to_use:
  - Check you have MATLAB and the paid RF PCB Toolbox. The skill is by MathWorks and comes under its own licence, so read that licence first.
  - Open an AI that can run MATLAB code. Paste in the skill text.
  - Give your centre frequency, bandwidth, rejection need and substrate. Add size limits or measured data if you have them.
  - Check the recommended filter type and the mesh and memory estimate before you run a full solve.
  - Look at the plotted response. If it misses your target, ask for a change or move on to tuning.
output_sample:
  input:
    - Your centre frequency and bandwidth
    - The stopband rejection you need
    - Your substrate and metal details
    - Your size limit (optional)
    - Measured S-parameter data (optional)
  prerequisites:
    - MATLAB with the paid RF PCB Toolbox
    - An AI that can run MATLAB code
    - Your substrate and conductor set up first with the matlab-manage-pcb-material skill
  output:
    - name: Recommended filter type
      contains: The filter type that fits your band, sharpness and size limit, with the reason it was chosen.
    - name: Filter object
      contains: The designed filter built on your substrate, with its dimensions and number of poles.
    - name: Mesh and memory estimate
      contains: The mesh density and memory cost, checked before you commit to a full solve.
    - name: Frequency response plot
      contains: A plot of the filter response so you can check the pass band and rejection.
    - name: Coupling matrix (optional)
      contains: A coupling matrix pulled from your measured data, only if you gave measured data.
