thinking: medium
thinking_why: It uses set formulas with checks.
new_slug: pcb-trace-designer
name: PCB trace designer
summary: Design a PCB trace for your impedance target. Get microstrip, stripline or differential pair widths, spacing and crosstalk checked in MATLAB.
job: build-software
headline: PCB trace designer
subhead: Trace widths and spacings that hit your impedance target, sized and checked in one pass. Ask for microstrip, stripline, coplanar or a differential pair and get the geometry plus crosstalk figures.
explain: |
  Trace widths and spacings that hit your impedance target, sized and checked in one pass. Ask for microstrip, stripline, coplanar or a differential pair and get the geometry plus crosstalk figures.

  The skill uses a 2D field solver by default, so loss, coupling and odd stacks come out accurate. It can auto-size a line for a target impedance at your frequency, extract resistance, inductance, capacitance and conductance per unit length from the cross-section, and model a differential pair with a nearby aggressor to read near-end and far-end crosstalk. It falls back to closed-form formulas only if you ask or the toolbox is missing. It runs in MATLAB with the RF PCB Toolbox.
when:
  - You need a 50 ohm microstrip on a given stackup.
  - You are routing a differential pair and want to know the crosstalk.
  - You want per-unit-length values to feed a circuit model.
  - You are designing a substrate-integrated waveguide line.
not_for:
  - "You only need S-parameters or fields from an existing part: use the skill named matlab-analyze-em, or ask an RF engineer."
  - "You do not have MATLAB with the RF PCB Toolbox: use your PCB tool's built-in impedance calculator, or ask your board maker for a stackup check."
  - "You want to set up substrate or metal materials only: use the skill named matlab-manage-pcb-material."
you_give:
  - Target impedance and frequency
  - Substrate and metal
  - Line type
  - Aggressor trace spacing (optional)
you_get:
  - Trace width and spacing for your impedance
  - Per-unit-length line values
  - Crosstalk figures for pairs
  - A mesh and memory check before the full solve
how_to_use:
  - Open an AI that can run MATLAB code. You need MATLAB and the RF PCB Toolbox, which are paid and need a licence.
  - Paste the skill into the chat, or load the skill folder if your AI supports files.
  - Give your target impedance, frequency, substrate, metal and line type. Add the aggressor spacing for crosstalk.
  - Check the mesh and memory estimate before you let it run the full solve.
  - Read the width, spacing and impedance first. Then check the crosstalk figures against your limit.
output_sample:
  input:
    - Your target impedance and frequency
    - Your substrate and metal
    - "The line type: microstrip, stripline, coplanar or differential pair"
    - The spacing to a nearby aggressor trace (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with the RF PCB Toolbox, both paid products that need a licence
    - Your substrate and conductor set up first, if you use custom materials
  output:
    - name: Line design
      contains: The trace width and spacing sized to hit your impedance at your frequency.
    - name: Impedance check
      contains: The impedance of the finished line, so you can compare it with your target.
    - name: Per-unit-length values
      contains: Resistance, inductance, conductance and capacitance per unit length taken from the cross-section.
    - name: Coupling matrices
      contains: How strongly traces in a pair or group couple, for use in a circuit model.
    - name: Crosstalk
      contains: Near-end and far-end crosstalk in dB for a differential pair with a nearby aggressor.
    - name: Mesh and memory check
      contains: An estimate of solver size, run before the full solve so it does not run out of memory.
