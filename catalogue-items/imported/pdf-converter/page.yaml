thinking: medium
thinking_why: It first checks what kind of PDF this is, then picks a route.
new_slug: pdf-converter
name: PDF converter
summary: Give it a PDF and the format you want. Get a faithful Markdown, HTML,
  Word or JSON copy with tables kept intact.
job: work-with-files
headline: PDF converter
subhead: Give it a PDF and the format you want. Get a faithful Markdown, HTML,
  Word or JSON copy with tables kept intact. Bring the PDF file. Use the result
  to plan your next step.
explain: |
  A PDF turned into Markdown, HTML, Word or JSON that still reads like the original, with tables intact and labels still tied to their values. It matters when plain text extraction would scramble columns or lose which number belongs to which row.

  The skill sorts the PDF first: scanned, table-heavy, slide-based, medical, academic or multi-column. It then picks a route for the output you asked for, using opendataloader-pdf as the main converter and other tools to check, run OCR or repair noisy spots. It spot-checks sections against the page, retries with better settings if needed, and only then hands over the file. It runs as a command line tool and needs installing.
when:
  - You have a table-heavy report PDF and need it in Markdown.
  - A scanned document needs OCR and then a Word copy.
  - You are feeding a PDF to an AI and need clean structured text.
  - A multi-column paper loses its reading order when you copy it.
you_give:
  - The PDF file
  - The output format you want
  - Pages to include (optional)
  - What matters most, such as tables or layout (optional)
you_get:
  - A converted file in your chosen format
  - Tables and labels kept together
  - A note on the PDF type and route used
  - Spot-check results on sample sections
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and read files.
