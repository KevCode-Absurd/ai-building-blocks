thinking_why: It follows set steps and checks each page.
new_slug: pdf-maker-and-reader
name: PDF maker and reader
summary: Read a PDF or make a new one, then check every page as an image. Catch cut-off text and layout slips in your PDF before you send it.
job: work-with-files
headline: PDF maker and reader
subhead: Read a PDF without trusting raw text alone, or make a new one and see for yourself that it looks right. The key habit is rendering pages to images and looking at them after every change, because text extraction cannot tell you about layout.
explain: |
  Read a PDF without trusting raw text alone, or make a new one and see for yourself that it looks right. The key habit is rendering pages to images and looking at them after every change, because text extraction cannot tell you about layout.

  To read, it pulls text with pdfplumber or pypdf for quick checks and renders each page to a PNG with pdftoppm for a visual look. To create, it writes the file with reportlab, then re-renders and checks alignment, spacing and legibility. Scratch files go in a temp folder and finals in an output folder with stable names. It needs Python packages and Poppler installed.
when:
  - You need a one-page PDF report with a set layout.
  - You want to check that a generated PDF has no cut-off text.
  - You need quick text from a PDF and a look at how it is laid out.
  - A PDF output keeps shifting and you need a render-and-fix loop.
not_for:
  - "You need to edit a PDF in place, such as changing a line in a signed contract: use the original file or a PDF editor."
  - "Your PDF is a scan or a photo of paper: use the Scanned PDF text reader first, because this skill reads real text only."
  - "You need a Word or slide file: ask your AI for that format instead, or export from your own app."
you_give:
  - A PDF to read, or a brief for a new one
  - Content and layout wishes for a new file
  - Output file name (optional)
you_get:
  - "The text pulled out of your PDF, as plain text, one block per page."
  - "A PNG image of each page, named by page number, so you can see the layout."
  - "A new PDF saved in output/pdf/ with a stable file name, if you asked for one."
  - A layout check after each change, with any problems named.
how_to_use:
  - Open an AI that can run code, such as Claude with code tools. Paste in the skill text.
  - Upload your PDF, or describe the PDF you want. Give the content, layout and file name.
  - Let your AI install the tools it needs. If it can't, it will tell you what is missing.
  - Ask it to render each page to an image and check it.
  - Read the page images and the check notes. Ask for fixes until no page has a defect.
  - Take the final file from output/pdf/. Before you send it to a client or a printer, open it yourself and check the page count, the page order, the numbers and any names.
  - If you need to merge, split or fill in forms, use the PDF toolkit.
output_sample:
  input:
    - A PDF to read, or a short brief for a new PDF
    - The content and layout you want in a new file
    - The file name you want (optional)
  prerequisites:
    - An AI that can run code and use files
    - Python packages reportlab, pdfplumber and pypdf
    - Poppler, a free tool that turns PDF pages into images
    - A code-running AI such as Claude Code, and permission to install the packages above
  output:
    - name: Extracted text
      contains: The text pulled from your PDF with pdfplumber or pypdf, for quick checks only.
    - name: Page images
      contains: One PNG image of each page, made with pdftoppm, so the layout can be seen.
    - name: New PDF
      contains: A PDF made with reportlab, saved in output/pdf/ with a stable, clear file name.
    - name: Layout check
      contains: A look at each re-rendered page for clipped text, overlaps, broken tables and hard-to-read type.
next: [pdf-toolkit, scanned-pdf-text-reader]
