thinking: low
thinking_why: PDF jobs follow fixed steps.
new_slug: pdf-toolkit
name: PDF toolkit
summary: Give it a PDF. Get text pulled out, pages merged, split, filled,
  redacted or checked, with the original kept safe.
job: work-with-files
headline: PDF toolkit
subhead: Do what you need to a PDF, such as pull text, merge, split, fill forms,
  redact or check it, while the original stays untouched. Each run gives you
  proof, not a promise.
explain: |
  Do what you need to a PDF, such as pull text, merge, split, fill forms, redact or check it, while the original stays untouched. Each run gives you proof, not a promise.

  The skill first confirms what you want, which pages count (human page labels often differ from physical page numbers), and whether the file is confidential. It records the source's hash and size, picks the tools you actually have, and writes new files to explicit paths. After the work it checks structure, content and how pages look, and reports hashes, page counts, tools used, OCR language and any limits. It never asks for private keys in chat. Needs PDF tools installed.
when:
  - You need to merge several PDFs in a set order.
  - You must redact names from a contract and prove the text is gone.
  - A scanned file needs searchable text with the right OCR language.
  - You need to fill a form and check the result renders.
you_give:
  - The source PDF or PDFs
  - The operation and page ranges
  - Output location and naming
  - OCR language (optional)
  - Whether the file is confidential
you_get:
  - New output files at stated paths
  - Hashes, sizes and page counts
  - An operation log
  - Checks for structure and appearance, with limits noted
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and save files.
not_for:
  - "You only want text from a scanned file. Use the Scanned PDF text reader."
  - "You want a PDF turned into Word, HTML or Markdown. Use the PDF converter."
  - "You want to write a new PDF and check each page as an image. Use the PDF maker and reader."
  - "You cannot run code or save files in your AI tool. The checks need both, so a chat-only run gives you a plan but no proof."
output_sample:
  input:
    - The source PDF or PDFs
    - What you want done, with page ranges and the order
    - Where to save the result and what to call it
    - OCR language, if the file is scanned (optional)
    - Whether the file is confidential
  prerequisites:
    - An AI that can run code and save files
    - PDF tools on your computer, such as a PDF library, a page renderer and OCR if you need it
  output:
    - name: Output files
      contains: New files at paths you can see. Your original is never overwritten.
    - name: File facts
      contains: SHA-256 hash, size, page count and encryption status for the source and each output.
    - name: Operation log
      contains: The tools, options, page mapping, OCR language, redactions and metadata changes.
    - name: Checks
      contains: Proof of structure, text and page appearance, plus what could not be checked.
    - name: Caveats
      contains: Password, signature, font, OCR or hidden-content limits you should know about.
