thinking_why: It sorts spending into a standard plan.
new_slug: personal-budget-builder
name: Personal budget builder
summary: Build a personal budget from your income and spending. Get a 50/30/20 or zero-based plan and see where your money leaks each month.
job: money-and-investing
headline: Personal budget builder
subhead: A spending plan where every dollar has a job, and a clear view of where money leaks. You get either a simple 50/30/20 split or a zero-based plan where income minus spending equals zero.
explain: |
  A spending plan where every dollar has a job, and a clear view of where money leaks. You get either a simple 50/30/20 split or a zero-based plan where income minus spending equals zero.

  The skill starts with your take-home pay and whether it is steady or variable, then your fixed bills, variable essentials, wants and your main goal, such as an emergency fund or debt payoff. It sorts a month or two of statements into categories, finds recurring or irregular charges, and treats savings as a bill paid first, not a leftover. You get a plan to review and reset each month. It is a budgeting aid, not financial advice.
when:
  - You earn variable income and need a budget that holds up.
  - Money runs out before month end and you cannot see why.
  - You want to save for a goal such as a house deposit.
  - You are paying off debt and need room for extra payments.
not_for:
  - "You need a budget for a business or company cash flow: ask an accountant or use your accounting software."
  - "You have no income figure yet: work out your monthly take-home pay first, then come back."
  - "You only want to clear debt: use a debt payoff plan, then return here for the monthly budget."
you_give:
  - Monthly take-home income
  - One to three months of statements (optional)
  - Fixed bills
  - Your main financial goal
you_get:
  - A budget by category
  - A 50/30/20 or zero-based plan
  - A list of spending leaks
  - A savings target and monthly review steps
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Tell your AI your monthly take-home pay and whether it is steady or changes.
  - Add your fixed bills and your main money goal.
  - Paste 1 to 3 months of statements if you have them (optional). Remove account numbers first.
  - Ask your AI to work in this order. First, sort each statement line into Needs, Wants or Savings. Second, work out your savings rate (monthly savings divided by income). Third, fill in the 50/30/20 comparison and show the surplus or deficit. Fourth, set category caps and a payday savings transfer.
  - Read the plan and check the category totals against your own records.
  - Use the check-in table at the end of the month, then ask your AI to reset the plan.
output_sample:
  input:
    - Your monthly take-home pay, and whether it is steady or changes
    - Your last 1 to 3 months of bank or card statements (optional)
    - Your fixed bills, such as rent, utilities, insurance and minimum debt payments
    - Your main money goal, such as an emergency fund or a house deposit
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini. No code is needed.
  output:
    - name: Budget Summary
      contains: Your income, totals for Needs, Wants and Savings, a comparison with the 50/30/20 targets, and any surplus or deficit.
    - name: Savings rate
      contains: Your monthly savings as a share of income, with a flag if it is under 10 percent.
    - name: Action Plan
      contains: The top three spending areas to cut, with a target for each, and a plan to move savings on payday.
    - name: 30-Day Check-in Template
      contains: A simple table to compare your plan with what you actually spend.
