thinking: medium
thinking_why: It follows a set method and adapts its questions or draft to your evidence.
new_slug: personal-study-notebook
name: Personal study notebook
summary: Plan your self-study and get lesson notes, quizzes with honest feedback, review dates and a progress dashboard saved in your own notes folder.
job: study-and-practice
headline: Personal study notebook
subhead: Choose a subject, goal and folder for your notes. It learns your preferences, plans short lessons and checks your answers. You get lesson notes, quiz feedback, review dates and a dashboard that keeps the next study step visible.
not_for:
  - "You need to cram for an exam next week: use a past-paper practice session with a teacher or tutor instead, since this plans slow, spaced study."
  - "You only want a quick answer to one question: ask your AI directly in a normal chat."
  - "Your AI cannot read and write files: you can still chat through lessons, but the notes folder and dashboard will not be saved."
explain: It works like a tutor that keeps its own files. Everything lives in your notes folder as plain Markdown, so you can open it in Obsidian, VS Code or any editor. Each session picks up where the last one stopped, from your profile, plan, logs and review dates.
you_give:
  - Your subject, goal, current level and weekly study time.
  - A local folder for notes and any source materials.
you_get:
  - A personal study plan and lesson notes.
  - Quiz reports and review dates.
  - A progress dashboard in Markdown or static HTML.
how_it_works:
  - title: Step 1
    text: Ask about your learning goal, preferred explanations and note format.
  - title: Step 2
    text: Plan phases and write source-based lesson notes.
  - title: Step 3
    text: Quiz each topic and update review dates, logs and the dashboard.
how_to_use:
  - Open your AI tool and use one that can read and write files in a folder. Add the skill's instructions to the chat or project.
  - You need nothing else. The skill mentions two companion skills (agent-tutor-visualize and agent-tutor-review) and some pi tool extensions (quiz, learning_log, svg_save, mermaid_lint, subagent). None are in this item, and the skill has built-in fallbacks for each. If it offers to install them with npx, that downloads code from the author's GitHub, and you can say no.
  - "Network note: if your AI can browse the web, the skill checks the author's GitHub once a day for a newer version. It reads only the version number and asks before any install. To turn it off, tell your AI at the start: skip the update check."
  - Tell it the subject you want to learn, your goal, your level and how many hours a week you have.
  - Name the folder where your notes should go. Add any books or articles you want it to teach from (optional).
  - Answer its short questions about how you like things explained. It builds your learner profile and study plan from your answers. One question is whether you want your dashboard and logs as plain Markdown tables or as a web page (HTML). Markdown is the default and needs nothing extra. The web page opens in any browser. The HTML Reader plugin for Obsidian is optional and only needed to view it inside Obsidian.
  - Read each lesson note, then take the quiz. Read the feedback and fix weak spots before moving on.
  - Come back on your review dates. Open the dashboard to see what to study next. Review the notes that are due, then move to the next topic. The progress picture in the dashboard is made by the skill in your own folder as you go, so it is not in the download.
output_sample:
  input:
    - Your subject and what you want to learn it for
    - Your current level and weekly study time
    - A folder for your notes
    - Books, articles or other source material (optional)
  prerequisites:
    - An AI that can read and write files in a folder on your computer
    - The HTML Reader plugin in Obsidian, only if you pick the web page dashboard and want to see it there (optional)
  output:
    - name: learner-profile.md
      contains: "How you learn best: the explanations that work for you, your tone and pace, and your chosen dashboard format."
    - name: Study plan
      contains: Your subject split into phases and topics, shaped by your goal, level and weekly study time.
    - name: Lesson notes
      contains: A full note for each topic in your own style, with diagrams and self-check questions.
    - name: Quiz reports
      contains: Your quiz answers marked with honest feedback, and what to fix before moving on.
    - name: Review dates
      contains: Spaced reviews scheduled so you revisit each topic before you forget it.
    - name: Session logs
      contains: A dated record of what you covered in each study session.
    - name: Dashboard
      contains: Your progress, notes due for review and the next study step, as a Markdown or static HTML page.
