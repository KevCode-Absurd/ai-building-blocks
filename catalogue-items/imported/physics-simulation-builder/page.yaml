thinking: high
thinking_why: Geometry, loads and meshing must all fit together.
new_slug: physics-simulation-builder
name: Physics simulation builder
summary: Build a finite element model of your part in MATLAB with the paid PDE Toolbox. Solve for heat, stress or vibration and get plots.
job: build-software
headline: Physics simulation builder
subhead: Describe a part and the forces or heat acting on it, and get a finite element model built, solved and plotted. It covers heat, stress and electromagnetic problems.
explain: |
  Describe a part and the forces or heat acting on it, and get a finite element model built, solved and plotted. It covers heat, stress and electromagnetic problems.

  Licence: the terms in this item's LICENSE.md apply. They are BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. The skill file links a different MathWorks page. Ignore that link and follow LICENSE.md.

  The skill follows five steps in MATLAB's PDE Toolbox. Build geometry from shapes, a STEP or STL file, or a 2D drawing. Set up the model with materials, supports, loads and starting conditions. Mesh with defaults first and refine if needed. Solve for steady, time-varying, vibration or frequency cases. Then read out fields, interpolate values and plot. It needs a recent MATLAB with the PDE Toolbox (a paid add-on).
when:
  - You need to know how hot a part gets under a heat load.
  - You want stress in a bracket from a CAD file.
  - You need the vibration modes of a simple structure.
  - You want a plot of a field across a shape.
not_for:
  - "The result will be used for a safety-critical design, such as a pressure vessel or a load-bearing part: these results are for engineering review only and are not certified. An engineer must sign off first."
  - "You need a Simulink or Simscape system model: use a Simulink or Simscape tool, since this skill only covers finite element parts."
  - "You only want a surface mesh to look at, with no solve: use your CAD or mesh software."
  - "You need a custom equation system outside heat, stress and electromagnetics: ask an engineer who can set up the older general PDE workflow."
you_give:
  - The part shape or CAD file
  - Materials
  - Loads, supports and temperatures
  - The kind of analysis wanted
you_get:
  - A built and meshed model
  - Solved results
  - Field plots
  - Derived values such as peak stress or temperature
how_to_use:
  - Check you have MATLAB R2025a or newer with the PDE Toolbox, a paid add-on. Without it the skill cannot run. Open a chat with an AI that can run MATLAB code.
  - Paste the skill text, or upload the skill folder if your AI accepts files.
  - "Gather first: the part's dimensions and their unit, the material names or properties, each load with its size and direction, which faces are fixed, and the analysis you want (stress, heat or another type)."
  - Pick one set of units and keep to it, for example metres, pascals, watts and kelvin. The toolbox has no units of its own, so a mix-up gives wrong numbers with no warning.
  - Describe your part, its materials, and the loads, fixed faces or temperatures. Say which analysis you want. Attach your CAD file if you have one.
  - Ask your AI to build, mesh, solve and plot the model, then report the key values.
  - Check the mesh quality and compare the peak values with a hand calculation before you use them in a design decision.
  - Have an engineer review and sign off the result before you act on it. Then ask your AI to refine the mesh and rerun to see if the answer changes.
  - After an engineer has signed off the numbers, send the table of derived values to the MATLAB report builder for a write-up. Use the MATLAB chart maker for clean figures.
output_sample:
  input:
    - Your part shape, as a CAD file (STEP or STL) or simple shapes with sizes
    - Materials for the part
    - Loads, fixed faces and temperatures
    - The kind of analysis you want, such as steady heat or static stress
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB R2025a or newer with the PDE Toolbox
  output:
    - name: Geometry
      contains: The part built from shapes or imported from a file, with its faces and edges identified.
    - name: Model setup
      contains: The model with materials, supports, loads and starting conditions set for your chosen analysis type.
    - name: Mesh
      contains: The part split into small elements, using default settings first and refined if needed.
    - name: Solved result
      contains: "The solution for your case: steady, time-varying, vibration or frequency."
    - name: Derived values
      contains: One table of values read from the result, such as peak stress, temperature, displacement or reaction forces, with their units.
    - name: Plots
      contains: Plots of the fields across the part, such as temperature or stress, saved as named image files.
next: [matlab-chart-maker, matlab-report-builder]
