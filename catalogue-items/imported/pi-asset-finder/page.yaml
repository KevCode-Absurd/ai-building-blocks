thinking: low
thinking_why: It runs set lookups.
new_slug: pi-asset-finder
name: PI asset finder
summary: Find a PI tag or asset by name or description and pull its history into MATLAB. Works for PI Data Archive tags and Asset Framework elements.
job: build-software
headline: PI asset finder
subhead: Give it a tag name or description. Get the matching PI data points found from MATLAB. Bring tag name, description or element name. Use the result to plan your next step.
explain: |
  Find the right data point in a PI system and pull its history into MATLAB, starting from just a tag name, a description or an asset name. It spares you from raw .NET code.

  The skill decides the route from what you give. A tag name or description goes to the PI Data Archive, using the client to look up tags and read values. An element name or template goes through Asset Framework, which finds elements and attributes and reads their history. For example, you can list every generation unit by template. It reads only, so it does not change assets or write data. It needs MATLAB with the Industrial Communication Toolbox, which are paid MathWorks products, and access to a PI server.

  Licence: this is a copy of MathWorks' skill, shared under the BSD 2-Clause licence in the LICENSE.md file. That licence adds that you may use it only with MathWorks products such as MATLAB.
when:
  - You have a tag name and need last month's values.
  - You only know part of a tag's description.
  - You want all units built from one template.
  - You need history from an asset attribute.
not_for:
  - "You need to create or change assets or templates in Asset Framework: ask your PI administrator."
  - "You need live streaming, event frames or alerts: use the PI tools your PI team already runs."
  - "You want to write data back to PI, or use PI Vision or PI Web API: use those tools directly."
you_give:
  - Tag name, description or element name
  - Server connection details
  - Time range
  - MATLAB release in use (optional)
you_get:
  - Matching tags or elements found
  - Attribute lists
  - Historical data in MATLAB
  - The right workflow for your release
how_to_use:
  - Open an AI that can run MATLAB code and reach your PI server. Without that, it can only write code for you to run.
  - Paste the skill into the chat.
  - Give a tag name, a description or an element name. Add your server name and time range.
  - Check the list of matches and confirm the right one.
  - Check the data status column, then pass the table to your analysis or report step.
output_sample:
  input:
    - A PI tag name, a tag description or part of one
    - Or an element name, template or attribute name from Asset Framework
    - The name of your PI server (and the database, for Asset Framework)
    - The time range you want (optional)
  prerequisites:
    - MATLAB with the Industrial Communication Toolbox
    - Access to a PI server
    - MATLAB R2022a or later for tag lookup, R2026a or later for Asset Framework
  output:
    - name: Matching tags or elements
      contains: A list of matches for you to confirm, with name, template and place in the asset hierarchy.
    - name: Attribute details
      contains: For a chosen element, its attributes with default unit and whether they hold time series data.
    - name: Current value
      contains: The latest reading for the chosen tag or attribute.
    - name: Historical data
      contains: A MATLAB table of timestamps, values and status for your time range, with optional aggregation.
    - name: Data quality check
      contains: A check of the status column so you can spot bad or missing readings.
