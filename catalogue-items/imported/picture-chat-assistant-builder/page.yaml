thinking: medium
thinking_why: It sets up a vision model and tunes it.
new_slug: picture-chat-assistant-builder
name: Picture chat assistant builder
summary: Set up LLaVA on your own GPU in Python to caption photos and answer follow-up questions about each image, with no per-call fee.
job: build-software
headline: Picture chat assistant builder
subhead: Give it your images and the questions you want to ask. It walks you through installing LLaVA, an open-source model that sees pictures, and running it on your own GPU. You get image captions and answers, and a chat that keeps context across questions.
explain: |
  LLaVA is a free, open-source AI model that looks at an image and talks about it. This skill helps you set up your own picture chat assistant: you ask what is in a photo, what a chart shows or what a document image says, then ask follow-ups.

  Your AI walks you through the install, picks a model size that fits your GPU memory, and writes the code for a first run. It shows the command line chat, a small web page chat, and how to keep a multi-turn conversation going. It also shows how to shrink memory use with 4-bit loading.

  It runs on your machine, so there is no fee per image. The trade-off is that you need Python and a strong GPU. The model can invent details, and it misreads small text and counts. Check its answers before you rely on them.

  This is Orchestra Research's MIT-licensed llava skill, renamed. The LLaVA code and each model's files have their own licences. Read them before any commercial use. Training your own model is optional and uses scripts from the original LLaVA project, not this folder.
when:
  - You want a bot that answers questions about product photos.
  - You need captions for a folder of images, and want to run it yourself.
  - You want to ask follow-up questions about a screenshot or chart.
  - You prefer an open model on your own GPU to a paid image service.
not_for:
  - You have no GPU. A hosted service is simpler. Without a GPU this model is far too slow.
  - You need the exact text from a scan or a receipt. Use the image text reader, since this model misreads small text.
  - You need exact counts or exact positions of objects. Answers here are approximate.
  - You want to match images to text search queries. Use the image and text matcher.
you_give:
  - Your images, such as JPG or PNG files
  - The questions you want to ask about them
  - Your GPU type and memory
  - A model size, such as 7B or 13B (optional)
you_get:
  - Install and first-run commands for your setup
  - A caption or answer for each image and question
  - A saved conversation when you ask follow-ups
  - A list of answers to double-check, such as small text or counts
  - Ideas for what to do next with the answers
how_to_use:
  - Check you have Python, git and an NVIDIA GPU with enough memory. A 7B model needs about 14 GB, or less with 4-bit loading. Your AI cannot run the model in a chat window. You run it on your own machine.
  - Open Claude, ChatGPT or Gemini and paste this skill. Tell it your GPU and the model size you want.
  - Run the install commands it gives you, then run the first command with one image and one question. The install clones the LLaVA project from GitHub. Ask your AI to name the exact release or commit it used, so you can repeat the install later. The multi-turn and web chat code are sketches. They call small helper functions (generate, ask, ask_llava) that are not defined in the skill, so your AI needs to write them from the first-run code before those steps will run.
  - Read the answer and compare it with the image. If it invents details, make your question more specific.
  - Move on to your full set of images, or start the web chat page to ask follow-ups.
  - Save the captions to a file or spreadsheet, and check a sample by eye.
how_it_works:
  - title: Check your setup
    text: It checks your GPU memory and picks a model size that fits, such as 7B in 4-bit.
  - title: Install LLaVA
    text: It gives the commands to download the project and install it.
  - title: Run a first test
    text: It runs one image with one question from the command line.
  - title: Ask in a conversation
    text: It keeps the chat history, so a follow-up like "what breed is it?" makes sense.
  - title: Add a front end
    text: It can start a small web page chat with Gradio so others can use it.
  - title: Flag weak spots
    text: It lists where the model is weak, such as small text, counting and invented details.
output_shape: |
  ## Setup check
  <GPU, memory, model size, MISSING items>

  ## Commands
  <clone, install, first run>

  ## Answers
  <one answer per question, or the conversation log>

  ## Notes
  <answers to double-check>

  ## Next steps
  <save, add a chat page, try a larger model>
output_sample:
  input:
    - Your images, such as JPG or PNG files
    - The questions you want to ask about each image
    - Your GPU type and memory
    - A model size (optional)
  prerequisites:
    - Python and git installed
    - An NVIDIA GPU with enough memory for your model size
    - A willingness to run commands on your own machine
  output:
    - name: Setup check
      contains: Your GPU, the model size that fits it, and anything missing.
    - name: Commands
      contains: The install and first-run commands for your setup.
    - name: Answers
      contains: One text answer per question, or the full conversation log for follow-ups.
    - name: Notes
      contains: Answers to double-check, such as small text, counts or details the model made up.
    - name: Next steps
      contains: Save captions to a file, add a web chat page, or try a larger model.
works_best_with:
  tools:
    - name: Claude Code
      why: It can run the install and test commands on your machine for you, when you allow it.
    - name: Hugging Face
      why: It hosts the LLaVA model files that the code downloads.
  inputs:
    - Clear, well-lit images
    - Specific questions, such as "what colour is the logo?"
    - A short list of images where you already know the right answer
terms:
  - term: LLaVA
    meaning: A free, open-source model that reads images and chats about them.
  - term: Multi-turn chat
    meaning: A chat where each question builds on the earlier ones.
  - term: VRAM
    meaning: The memory on your graphics card. The model must fit in it.
  - term: 4-bit loading
    meaning: A way to shrink the model so it uses far less VRAM, with some loss in quality.
  - term: Caption
    meaning: A short written description of an image.
