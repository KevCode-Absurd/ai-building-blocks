thinking: low
thinking_why: It rewrites one message more simply.
new_slug: plain-message-re-pitcher
name: Plain message re-pitcher
summary: Say you are lost. Get the last message said again in simple words, with
  a little context.
job: think-and-decide
headline: Plain message re-pitcher
subhead: When a reply loses you, say so and get the last message said again in
  plain words, with a little background first. It uses Simplified Technical
  English, a short-sentence style built for clarity.
explain: |
  When a reply loses you, say so and get the last message said again in plain words, with a little background first. It uses Simplified Technical English, a short-sentence style built for clarity.

  The skill is a single prompt. It asks the AI to re-pitch what it just said: give some context, write in Simplified Technical English and use the agreed terms from the project's glossary file. If the repository has more than one glossary, it follows the glossary map to the right one. The result is the same content in words a newcomer can follow. It works best in a project that already has a glossary file.
when:
  - The AI gave a long answer full of jargon.
  - A teammate joins and cannot follow earlier talk.
  - You need the same point in shorter sentences.
  - You want replies that match your project's own terms.
you_give:
  - The message you did not follow
  - A glossary file (optional)
  - How much context you need (optional)
you_get:
  - The message restated simply
  - A short context lead-in
  - Terms matched to your glossary
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
