thinking: medium
thinking_why: It reads the query step by step and explains each part.
new_slug: plain-words-sql-explainer
name: Plain-words SQL explainer
summary: Paste a SQL query and get a plain-words explanation of what it counts, which rows it keeps and what each column means. Check it against the question.
job: document-work
headline: Plain-words SQL explainer
subhead: A SQL query turned into a plain description of what it counts, which rows it keeps and what each output column means. Anyone can then check whether the query matches the question.
explain: |
  A SQL query turned into a plain description of what it counts, which rows it keeps and what each output column means. Anyone can then check whether the query matches the question.

  The skill reads the query in order. It describes the tables and how they are joined, including which join type drops or keeps rows. It rewrites each filter as a business rule, explains grouping and totals and the level they work at, and lists each output column with edge cases such as nulls or rounding. It then flags problems such as row duplication or hard-coded dates and adds questions to check. A helper script gives a first parse.

  This is Nimrod Fisher's MIT-licensed sql-to-business-logic skill, renamed. Licence: MIT (see the LICENSE file).
when:
  - A manager asks what exactly a report query measures.
  - You inherited undocumented queries and need to document them.
  - You want to check a query against the business request.
  - A new analyst needs to learn your SQL.
not_for:
  - "You want to make a slow query faster: ask a database admin or use your database's query planner."
  - "You need a new query written from a business question: ask your AI to write one, then come back to explain it."
  - "You want to fix wrong results in your data: check the source tables with the person who owns them."
you_give:
  - The SQL query
  - The business question it answers
  - Notes on what key tables and columns mean (optional)
you_get:
  - A plain description of sources and joins
  - Filters stated as business rules
  - A meaning for each output column
  - Problems flagged with check questions
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini and paste in the skill instructions from this page.
  - Paste your SQL query. Say what business question it answers.
  - Add notes on key tables, columns and status values if you have them.
  - The skill folder also holds a script and a document template. They are optional extras. In a chat, the steps in the skill give you the same document.
  - Read the join and filter sections first. Check they match the question you were asked.
  - Send the validation questions to the person who wrote the query.
  - Save the finished document in your data catalog or dbt docs, so the next person can find it.
output_sample:
  input:
    - Your SQL query, from SELECT to the end
    - The business question the query answers
    - Notes on what key tables and columns mean (optional)
    - Rules for status values, dates or currency (optional)
  output:
    - name: Purpose
      contains: What the query is meant to answer, in one or two plain sentences.
    - name: Sources and joins
      contains: Which tables are combined, and whether each join keeps or drops rows.
    - name: Filters as business rules
      contains: Each filter condition rewritten as a plain rule anyone can read.
    - name: Grouping and totals
      contains: What each total or count adds up, and at what level it works.
    - name: Output columns
      contains: The business meaning of each column, with edge cases like nulls, rounding or currency.
    - name: Issues and validation questions
      contains: Possible problems such as repeated rows or fixed dates, plus 3 to 5 questions for the query author.
next: [sql-query-launch-reviewer, plain-words-sql-writer]
