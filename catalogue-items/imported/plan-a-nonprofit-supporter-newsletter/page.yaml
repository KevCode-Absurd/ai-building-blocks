how_it_works:
  - title: Define the newsletter’s role
    text: Keep routine supporter news distinct from fundraising appeals. Choose a pace the team can sustain.
  - title: Plan content by reader group
    text: Set useful sections and story choices for donors, volunteers and general readers without inventing audience facts.
  - title: Draft and check each issue
    text: Write the template, then check sources, links, tags, mobile layout and opt-out details. Sending and list changes need separate authorized work.
