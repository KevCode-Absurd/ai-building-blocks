thinking: high
thinking_why: It works out which questions come first and why.
new_slug: plan-stress-tester
name: Plan stress-tester
summary: Stress-test your plan before you build it. Give it your idea and get rounds of tough questions, each with a suggested answer you can accept.
job: think-and-decide
headline: Plan stress-tester
subhead: A tough round of questions on your plan or idea, each with a suggested answer, so you reach a shared and settled design fast. You mostly say yes or change a few answers.
explain: |
  A tough round of questions on your plan or idea, each with a suggested answer, so you reach a shared and settled design fast. You mostly say yes or change a few answers.

  The skill maps your plan as a tree of decisions, where each choice leads to others. It asks every question whose earlier choices are already settled, in one numbered round, and phrases each so a yes accepts its recommendation. After your answers it recomputes what can now be asked and runs the next round. Where your AI has file or tool access, it looks up facts such as files or tools itself. In a plain chat it has no such access, so it asks you for those facts and says so. It should never claim to have looked something up when it did not.
when:
  - You have a rough idea and need the gaps found.
  - You want to agree on a design before starting to build.
  - You keep missing decisions that hit you later.
  - You want quick answers, not a long interview.
not_for:
  - "You need a quick yes or no on a small choice: use a plain checklist or ask a friend."
  - "You want your AI to start building now: skip this and give it a clear brief instead."
  - "You want facts looked up for you only: use a normal web search or ask your AI a direct question."
you_give:
  - Your plan or idea
  - Any constraints you already know
  - Answers to each round of questions
you_get:
  - Numbered question rounds
  - A recommended answer for each
  - A decision tree that narrows each round
  - A settled plan at the end
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page. The lookup step only works in a tool that can read files or run helper agents, such as Claude Code. In a plain chat, your AI asks you for those facts instead.
  - Describe your plan or idea in a few lines. Add any limits you already know.
  - Read the first round. Answer yes to accept a suggestion, or type a change.
  - Send your answers. Your AI then asks the next round of questions.
  - Keep going until your AI says nothing is left to decide, then confirm the plan.
  - Turn the settled plan into a task list with the Task list keeper, or into build sessions with the Multi-session build plan writer. Paste the settled plan in as your starting brief.
output_sample:
  input:
    - Your plan or idea, in a line or a few paragraphs
    - Any limits you already know, such as budget or deadline (optional)
    - Your answers to each round of questions
  output:
    - name: Question round
      contains: A numbered list of questions you can answer now, each with a title and a full question body.
    - name: Recommended answer
      contains: A suggested answer under each question, worded so a plain yes accepts it.
    - name: Next round
      contains: New questions that were waiting on your earlier answers, asked after you reply.
    - name: Shared understanding check
      contains: A final point where every branch has been covered and your AI asks you to confirm before acting.
