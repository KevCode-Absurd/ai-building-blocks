thinking: medium
thinking_why: It compares several alignment methods and settings.
new_slug: point-cloud-aligner
name: Point cloud aligner
summary: Line up two 3D scans into one point cloud. This point cloud aligner picks a method, tunes it and reports the fit. Needs MATLAB.
job: build-software
headline: Point cloud aligner
subhead: Two or more 3D scans lined up into one, with the best method chosen and tuned for your data. It is useful for building a map from lidar scans or merging overlapping captures.
explain: |
  Two or more 3D scans lined up into one, with the best method chosen and tuned for your data. It is useful for building a map from lidar scans or merging overlapping captures.

  The skill starts with plane-to-plane iterative closest point (ICP), a method that nudges one scan until it sits on the other. It measures the fit with RMSE, the average gap in the same units as your scan, and applies the result with the align tool. For scans far apart it points to global methods that estimate an initial transform. It also guides cleaning before alignment and merging after. It steers away from older transform types. It works on 3D clouds only and needs MATLAB with the Computer Vision and Lidar Toolboxes. This is a MathWorks skill, copied under a licence that lets you use it only with MathWorks products.
when:
  - Two lidar scans overlap slightly and need joining.
  - You are building a map from a long run of scans.
  - Your first alignment attempt drifts or fails.
  - You are not sure which algorithm suits your clouds.
not_for:
  - "You have flat 2-D scans: use matchScans, matchScansGrid or matchScansLine in MATLAB."
  - "You want to line up photos or other images: use imregtform or imregcorr in MATLAB."
  - "You do not have MATLAB with the Computer Vision and Lidar Toolboxes: ask a colleague who does, or use a free point cloud tool."
you_give:
  - Point cloud data from two or more scans
  - A rough starting alignment (optional)
  - Noise level or scan type (optional)
you_get:
  - Aligned and merged point clouds
  - The method chosen and its settings
  - An RMSE accuracy figure
  - Preprocessing steps used
how_to_use:
  - Open an AI chat and paste in the full text of the skill's SKILL.md file. This page only summarises it.
  - Have your scans ready before you start. Add your point clouds, or say where the files are. They should be .pcd or other files MATLAB can load as pointCloud objects. Say if they have color or a rough starting alignment.
  - Make sure your AI can run MATLAB with the Computer Vision and Lidar Toolboxes. If not, run the code it writes yourself.
  - Check the RMSE value. If it is high, ask for another method or a cleaner input.
  - Use the merge step to join the aligned scans into one cloud or a map.
output_sample:
  input:
    - Two or more 3D point clouds as MATLAB point cloud objects
    - A rough starting alignment (optional)
    - Whether your clouds have color, or how noisy they are (optional)
  prerequisites:
    - MATLAB, which is a paid program
    - The Computer Vision Toolbox and the Lidar Toolbox
    - An AI that can run MATLAB code, or you paste the code in yourself
  output:
    - name: Method choice
      contains: The registration method picked for your scans, such as plane-to-plane ICP, and why it fits.
    - name: Preprocessing steps
      contains: How the clouds are cleaned and thinned before alignment, with the settings used.
    - name: Registration code
      contains: MATLAB code that aligns the scans and gives the rigid transform between them.
    - name: RMSE value
      contains: The fit error. Compare it only between runs on the same pair of clouds.
    - name: Aligned point cloud
      contains: Your moving scan placed onto the first scan, using the align step.
    - name: Merged point cloud
      contains: The aligned scans joined into one cloud, or built up scan by scan into a map.
