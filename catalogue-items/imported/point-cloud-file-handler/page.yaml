job: build-software
headline: Point cloud file handler
subhead: Open and save 3D lidar files without guessing which function fits which
  format. The skill routes by file type and keeps the extra point details such
  as class, time and scan angle.
explain: |
  Open and save 3D lidar files without guessing which function fits which format. The skill routes by file type and keeps the extra point details such as class, time and scan angle.

  Ply and PCD files go through the basic reader, LAS and LAZ need the dedicated reader that can filter by area, class or time, and sensor recordings from Velodyne, Ouster or Hesai are read frame by frame. E57 files with several scans use indexed access, and Ibeo recordings are read by message. It also converts between formats, such as LAS to PLY. It needs MATLAB with the Lidar Toolbox.
when:
  - You have a LAS file and only want points in one area.
  - A sensor recording must be read frame by frame.
  - You need to convert point clouds from one format to another.
  - You must keep classification and timestamps while saving.
you_give:
  - The lidar file or recording
  - The format you want back
  - A region or class filter (optional)
you_get:
  - A loaded point cloud
  - Point attributes kept
  - A saved file in the new format
  - The right reader for your format
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with the Lidar Toolbox.
