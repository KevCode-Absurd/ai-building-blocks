name: Workplace policy and handbook writer
summary: Name your country and company size. Get handbook sections, a harassment policy and a privacy policy. Not legal advice.
job: hire-people
headline: Workplace policy and handbook writer
subhead: Name your country and company size. Get handbook sections, a harassment policy and a privacy policy. Not legal advice.
explain: |
  Draft workplace policies that fit your country and company size, ready for a lawyer to check. You get handbook sections, a harassment prevention policy, a privacy policy and similar documents, written in plain language.

  You start by naming where you operate and how many people you employ. The skill then picks the rules that apply, such as equal opportunity, safety, leave, background checks and whistleblower protection. It writes each policy section, flags points that vary by location, and lists questions to settle with counsel. It can also run a compliance audit checklist. It does not give legal advice.
when:
  - You are hiring your first employees and have no handbook.
  - A regulator or client asks to see your harassment policy.
  - You expanded to a new country and need local workplace rules.
  - Your old handbook is out of date and needs a rewrite.
you_give:
  - Country or region
  - Company size and industry
  - Policies you already have (optional)
  - Any recent complaint or audit request (optional)
you_get:
  - Handbook sections in plain language
  - Harassment and whistleblower policies
  - Privacy policy for staff data
  - List of points to check with a lawyer
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
