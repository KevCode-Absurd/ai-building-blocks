thinking: high
thinking_why: It must change policy text without breaking its other parts.
new_slug: policy-redraft-proposer
name: Policy redraft proposer
summary: Give it a policy gap and the current policy. Get a marked-up draft with
  small edits. Not legal advice.
job: check-contracts
headline: Policy redraft proposer
subhead: Give it a policy gap and the current policy. Get a marked-up draft with
  small edits. Not legal advice. Bring description of the gap. Use the result to
  plan your next step.
explain: |
  When a review finds your policy no longer meets a rule, this writes the fix as a marked-up draft with the smallest edits that close the gap. Nothing in your original policy is touched.

  You give it the gap and the current approved policy text. It checks the rule is still current, or warns you if it cannot. It then strikes the fewest words needed, keeps any [verify] tags on facts it could not confirm, adds comments explaining each change, and saves everything to a new dated file. The gap stays open until the policy owner applies and approves the change. It is a proposal, not legal advice.
when:
  - A gap review shows a policy clause is out of date.
  - A new rule takes effect and you need amended wording quickly.
  - You want edits your policy owner can approve line by line.
  - You need a record of why each change was proposed.
you_give:
  - Description of the gap
  - Current approved policy text
  - Text of the rule or regulation
  - Name of the policy owner (optional)
you_get:
  - Marked-up redraft with small edits
  - Comments explaining each change
  - Redraft memo in a new dated file
  - List of facts still to verify
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your saved setup notes and your policy
    files.
  - Where the skill points to /regulatory-legal:cold-start-interview, use the
    setup-interview folder inside it. We copied it in so the skill works on its
    own.
