thinking: medium
thinking_why: It follows style rules while making design choices.
new_slug: polished-interface-builder
name: Polished interface builder
summary: Build a polished interface from a short description, or review one you have. Get working React and Tailwind code with a clear look, not a stock template.
job: build-websites
headline: Polished interface builder
subhead: Describe the interface. Get a built page with careful colour, layout and motion, not a stock template look. You get code to run, then check on a phone and a desktop.
explain: |
  Ask for a page or app screen and get working front-end code with a deliberate look, not the stock template feel of centred heroes, purple gradients and rows of identical cards.

  The skill sets three dials for layout variety, motion and density, then builds to rules on type, colour, spacing and responsive behaviour. It defaults to React with Tailwind unless you name another stack. It covers loading, empty and error states, avoids fragile layouts, and checks that each part earns its place. If your brand already has a style, tell it and it follows that instead. You can also ask it to review an existing screen. This is an imported copy of a skill by Leonxlnx, shared by sickn33 under CC BY 4.0 (see LICENSE-CONTENT). This copy adds one rule to the original: every name, number and review it invents for the mock-up is marked as a placeholder to replace.
when:
  - Your landing page looks like every other AI-made site.
  - You need a dashboard that works on phone and desktop.
  - You want a review of a screen with the biggest design faults ranked.
  - You are building a React page and want motion that is not distracting.
not_for:
  - "Your brand already has a style guide or design system: give your AI that guide and follow it, or ask your designer, because this skill's look rules can clash with it."
  - "You need a finished, tested product: have a developer check the build, accessibility and real users before launch."
  - "You only want words for a page: write the copy with your AI in a plain chat, then add it here."
you_give:
  - Description of the page or app
  - Brand colours or style rules (optional)
  - Tech stack and Tailwind version (optional; your AI checks your project's package.json before it writes code)
  - Existing screen to review (optional)
you_get:
  - Working interface code
  - Choices of type, colour and spacing explained
  - Loading, empty and error states
  - Ranked list of design fixes for a review
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the full text of the skill's SKILL.md file. It is long, so use an AI that takes long text.
  - Describe the page or app you want. Name your existing project or stack first, so your AI checks your package.json before it writes code. Add your brand colours and look (calm or bold) if you have them.
  - Before any code is written, ask your AI to reply with the values it chose for the three dials (layout variety, motion, density) and the stack. Confirm or change them, then let it build.
  - To review a screen, paste its code or describe it. Ask for the biggest problems first, with a fix.
  - Read the result. Check the code runs in your project and works on phone and desktop.
  - Code running and file access help a lot. Without them, copy the code into your project yourself.
  - The names, numbers and prices in the code are placeholders to make the page look real. Replace every one with your real data before the page goes live.
  - Before launch, have a developer run the build, and check the page on a phone and a desktop. Run the Accessibility checker on it too.
output_sample:
  input:
    - Your description of the page or app
    - Your brand colours or style rules (optional)
    - Your tech stack (optional)
    - An existing screen to review (optional)
  prerequisites:
    - An AI that can run code and read your project files works best
    - A React project if you want to drop the code straight in
  output:
    - name: Interface code
      contains: Working front-end code for the page or screen, built to your description and the chosen look.
    - name: Install commands
      contains: Commands for any new packages the code needs, after your AI checks what your project already has.
    - name: State list
      contains: The loading, empty and error states built into the screen, so it does not break when data is missing.
    - name: Design choices
      contains: Short notes on the type, colour, spacing and motion picked, and why.
    - name: Ranked design fixes
      contains: "For a review: the biggest design problems in order, with an improvement you can build."
