thinking: medium
thinking_why: It extracts numbers and compares them to plan.
new_slug: portfolio-company-tracker
name: Portfolio company tracker
summary: Turn monthly or quarterly company reports into a KPI table, budget variances and red, yellow or green flags for your board.
job: money-and-investing
headline: Portfolio company tracker
subhead: Give it the Excel, PDF or CSV pack a company you back sends each month, plus the budget. It pulls out revenue, EBITDA, cash and debt, compares them with plan and the last period, and flags the misses. You get a KPI table and a board-ready summary.
explain: |
  A portfolio company tracker gives you one monthly view of how each company you back is doing against plan. Packs arrive in different layouts, so the skill reads each one and lines up the same numbers: revenue, EBITDA, cash, debt, capex and working capital. It sets them against the budget and the prior period.

  Each variance gets a colour. Green is within 5% of plan, yellow is 5% to 15% below, red is more than 15% below or close to a covenant limit. It adds a short summary and a list of questions for the company's management. It checks debt and interest cover, and it swaps in KPIs that suit the sector.

  This version follows Indian conventions. Fiscal years run April to March, and lakh and crore are written out so a figure is never off by ten times.
when:
  - Monthly packs arrive from several portfolio companies and you want one view.
  - Quarter end is near and the board wants variances to budget.
  - A company's cash is falling and you want to see it before it becomes a problem.
  - Reports mix lakh, crore and plain rupee figures and need one unit.
not_for:
  - You need a value for one company. Use the DCF model builder for India.
  - You want to check a finished model for unit and fiscal-year slips. Use the India modeling rules checker.
  - You need audited numbers or a legal reading of a credit agreement. Use your auditor and the lender's own reports.
you_give:
  - This period's financial pack, in Excel, PDF or CSV
  - The budget or plan for the same period
  - The company's sector (optional)
  - Last period's pack (optional)
  - Covenant limits from the credit agreement (optional)
you_get:
  - A KPI table for each company, actual against budget and last period
  - Red, yellow and green flags with a reason for each
  - Debt, interest cover and cash checks
  - A one-paragraph summary and questions for management
how_to_use:
  - Open Claude, ChatGPT or Gemini. Add this skill, or paste the text of SKILL.md into a new chat.
  - Attach this month's pack and the budget. Add last period's pack and the credit agreement limits if you have them.
  - Say the company's sector and the period, for example Q3 FY26 (Oct to Dec 2025).
  - Read the KPI table first. Check revenue, EBITDA and cash against the pack yourself.
  - Look at every red flag and the units. Ask for a fix if a crore figure looks off.
  - Send the summary on only after a person has checked the flags and covenant status.
how_it_works:
  - title: Read the pack
    text: It lists the sheets, the period and the unit, then pulls out revenue, EBITDA, cash, debt, capex and working capital.
  - title: Pick the KPIs
    text: It uses the financial KPIs for every company and adds sector ones, such as customers or headcount, asking you when it is unsure.
  - title: Compare with plan
    text: It sets each figure against the budget and the prior period and works out leverage and interest cover.
  - title: Flag the misses
    text: Within 5% is green, 5% to 15% below is yellow, and more than 15% below or near a covenant limit is red.
  - title: Write the summary
    text: It writes a one-paragraph view, the KPI table, the flags, covenant status and questions for management.
  - title: Show the trend
    text: With more than one period, it shows revenue, EBITDA and cash over time against the underwriting case.
output_shape: |
  Executive summary: <company> is tracking <ahead, behind or on> plan for <period>.
  KPI table: <metric> | <actual> | <budget> | <prior period> | <flag>
  Flags: <red or yellow item> and <why it matters>
  Covenant status: <ratio> against <limit>, or MISSING: covenant terms
  Questions for management: <question 1>, <question 2>
  Trend (if several periods): <revenue, EBITDA, cash over time>
output_sample:
  input:
    - The company's financial pack for the period, in Excel, PDF or CSV
    - The budget or plan for the same period
    - The company's sector (optional)
    - Last period's pack, to compare against (optional)
    - Covenant limits from the credit agreement (optional)
  prerequisites:
    - An AI that can read your files
    - Pack figures in a known unit, such as rupees, lakh or crore
  output:
    - name: Executive summary
      contains: One paragraph saying whether the company is ahead of, behind or on plan.
    - name: KPI table
      contains: Revenue, EBITDA, cash, debt, capex and working capital, set against budget and last period.
    - name: Flags
      contains: Each red or yellow item with the reason and what it could mean.
    - name: Covenant status
      contains: Debt against profit and interest cover, set against the limits you gave, or a note that terms are missing.
    - name: Questions for management
      contains: What to ask the company about each miss.
    - name: Trend view
      contains: Key figures across periods, only when you give more than one period.
works_best_with:
  tools:
    - name: Claude
      why: It reads Excel and PDF packs well and keeps long tables in order.
    - name: ChatGPT
      why: Its file upload handles spreadsheets, and it can chart a trend.
  inputs:
    - The board's own budget file, not a rebuilt copy
    - A note on which one-off items to leave out of EBITDA
    - The underwriting case for the company
terms:
  - term: EBITDA
    meaning: Profit before interest, tax, depreciation and amortisation. A quick view of trading profit.
  - term: Covenant
    meaning: A limit in a loan agreement, such as maximum debt against profit.
  - term: Lakh and crore
    meaning: Indian units. One lakh is 100,000. One crore is 10,000,000.
  - term: Variance
    meaning: The gap between the actual figure and the budget.
