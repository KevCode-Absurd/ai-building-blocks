name: After-purchase experience planner
summary: Give it your shipping, returns and loyalty setup. Get a plan for what
  happens after checkout so customers order again.
job: run-your-store
headline: After-purchase experience planner
subhead: Raise the chance that every order leads to the next one. Share your
  shipping, returns and loyalty setup and get a plan for what happens after
  checkout.
explain: |
  Raise the chance that every order leads to the next one. Share your shipping, returns and loyalty setup and get a plan for what happens after checkout.

  The plan follows tested rules. Send abandoned-cart reminders after 24 to 72 hours, never in the first hour. Put a handwritten thank-you note in the box with nothing attached. Offer paid free-shipping membership if people reorder often. Make returns free and refund when the carrier scans the parcel. Keep loyalty automatic, with one tier and a simple threshold reward. It reviews your current setup against these steps and tells you what to change.
when:
  - Customers buy once and never come back.
  - You are rewriting your returns policy.
  - You are launching a loyalty programme and want it simple.
  - Your cart reminder emails go out too soon.
you_give:
  - Return and refund policy
  - Abandoned-cart email timing
  - Box contents and inserts
  - Average order value and free-shipping threshold
you_get:
  - Review of your after-checkout setup
  - Reminder timing plan
  - Returns and refund policy suggestions
  - Loyalty programme structure
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
