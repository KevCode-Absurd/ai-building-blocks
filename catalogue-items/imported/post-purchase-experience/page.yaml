thinking: medium
thinking_why: It weighs timing and wording choices across several steps.
new_slug: post-purchase-experience
name: After-purchase experience planner
summary: Plan what happens after checkout so customers order again. Give it your returns, shipping and loyalty setup. Get a clear keep or change list.
job: run-your-store
headline: After-purchase experience planner
subhead: Raise the chance that every order leads to the next one. Share your shipping, returns and loyalty setup and get a plan for what happens after checkout.
explain: |
  Raise the chance that every order leads to the next one. Share your shipping, returns and loyalty setup and get a plan for what happens after checkout.

  The plan mixes measured findings and practitioner tips. Each rule in the skill is marked, so you can see which is which. Send abandoned-cart reminders after 24 to 72 hours, never in the first hour. Put a handwritten thank-you note in the box with nothing attached (a study backs this). Offer paid free-shipping membership if people reorder often. Make returns free † and refund when the carrier scans the parcel, unless an item needs inspection first. († marks a practitioner tip with no study behind it.) Keep loyalty automatic, with one tier and a simple threshold reward. It reviews your current setup against these steps and tells you what to change.
when:
  - Customers buy once and never come back.
  - You are rewriting your returns policy.
  - You are launching a loyalty programme and want it simple.
  - Your cart reminder emails go out too soon.
not_for:
  - "You want to fix cart layout, checkout fields or payment errors: use the Checkout page auditor, not this plan."
  - "You want more reviews or a way to handle complaints: use the Review request and reply planner."
  - "You want a referral scheme: use the Referral program designer. For a full store trust audit, use a store audit step first."
you_give:
  - Return and refund policy
  - Abandoned-cart email timing
  - Box contents and inserts
  - Average order value and free-shipping threshold
you_get:
  - Review of your after-checkout setup
  - Reminder timing plan
  - Returns and refund policy suggestions
  - Loyalty programme structure
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text from this page.
  - Paste your return policy, cart email timing, box contents, average order value and free-shipping threshold.
  - Add your loyalty setup if you have one (optional).
  - Read the plan table. Check each keep or change line against how your store really works.
  - Write the thank-you note by hand. Do not call a printed note handwritten, because customers can tell and the study tested handwritten notes.
  - Note that some rules are practitioner tips, not measured findings. The skill marks these with a dagger (†) and names the study behind the rest. The study results come from other stores, so test each change on your own orders.
  - Refund on the carrier scan by default. If return abuse is a worry, do this only for items that need no inspection, such as books, sealed goods and low-value items. Inspect items that must be checked for use or damage first, such as electronics, cosmetics and clothing.
  - "The study details and effect sizes are in reference.md in this item, with a source for each study. Two claims have no primary source and are marked as practitioner tips there: the survey claim about returns and the 3 times spend figure for paid shipping members. Do not quote an effect size you have not read in reference.md."
  - Make the top three changes first. Check your cart recovery and repeat orders again after 30 days. Then use the Returns policy designer to write the returns wording, and the Loyalty and VIP program designer for the loyalty set-up.
output_sample:
  input:
    - Your abandoned-cart email timing
    - What goes in the box, such as inserts and codes
    - "Your return policy: who pays, when you refund, drop-off options"
    - Your loyalty setup, if you have one (optional)
    - Your average order value and free-shipping threshold
  output:
    - name: Plan table
      contains: Each after-checkout element, with keep or change, the replacement, and the rule behind it.
    - name: Abandoned-cart timing
      contains: When your reminder email should go out, based on a 24 to 72 hour window.
    - name: Box and thank-you note
      contains: What to put in the box, and a note with no offer attached.
    - name: Returns and refund policy
      contains: Free return terms and when to refund, with limits for items that need checking.
    - name: Loyalty structure
      contains: One automatic tier with a simple reward after a set number of buys.
    - name: Sequence
      contains: The order to roll out changes, from confirmation to box, returns, loyalty and cart timing.
