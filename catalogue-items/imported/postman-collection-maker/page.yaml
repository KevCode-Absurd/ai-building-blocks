thinking: low
thinking_why: It converts descriptions into a fixed file format.
new_slug: postman-collection-maker
name: Postman collection maker
summary: Turn your API description or cURL commands into a Postman collection file you can import in one step, with folders and a host variable.
job: build-software
headline: Postman collection maker
subhead: Describe your API or paste cURL commands. Get a Postman collection file that imports and runs straight away.
explain: |
  A Postman collection file that imports in one click, built from a plain description of your API or from cURL commands you paste in.

  The skill pulls out each endpoint's name, method, URL, headers, authentication, body and query parameters. It puts the host in a base_url variable so you can switch between environments. It then writes a valid Collection v2.1 JSON file with folders for related requests. When something is unclear, it follows common REST habits and lists its guesses at the end so you can correct them. You can mix described endpoints and cURL in one request.

  Licence: this copy comes from the sickn33 collection under CC BY 4.0 (LICENSE-CONTENT). The skill file's own header names LambdaTest and the MIT licence. Both are open licences, and both authors are credited.
when:
  - You have a dozen cURL commands and want them organised.
  - A new teammate needs a way to try your API.
  - You are documenting an API for testers.
  - You want to switch between dev and live hosts quickly.
not_for:
  - "Your API already has an OpenAPI file: import that file into Postman directly."
  - "Your API uses GraphQL or SOAP: build those requests by hand in Postman, as this skill follows REST habits."
  - "You want automated tests or a live run of your API: write tests in Postman after you import the collection."
you_give:
  - API description or cURL commands
  - Base URL
  - Authentication type
  - Sample request bodies (optional)
you_get:
  - Postman Collection JSON file
  - Requests grouped in folders
  - Variables for host and tokens
  - List of assumptions made
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code running or paid tool is needed.
  - Paste the skill text into the chat.
  - Paste your cURL commands or describe your API. Add your base URL and sign-in type.
  - Copy the collection.json and environment.json blocks into two files.
  - In Postman, choose File, then Import, and add both files.
  - Read the assumptions list and fix anything the AI guessed wrong.
  - Do not paste real passwords, tokens or API keys into the chat. Fill them in inside Postman after you import.
  - Next, ask for an OpenAPI file of the same API, or add tests in Postman.
output_sample:
  input:
    - A plain description of your API, or one or more cURL commands
    - Your base URL (optional)
    - Your sign-in type, such as bearer token, basic or API key (optional)
    - Sample request bodies (optional)
  output:
    - name: collection.json
      contains: The Postman collection with your requests in folders, using a base_url variable and token variables.
    - name: environment.json
      contains: A Postman environment file with base_url and any tokens or keys, ready for you to fill in.
    - name: Assumptions
      contains: A list of guesses made, such as inferred methods or placeholder values, so you can correct them.
    - name: Import instructions
      contains: A short note on how to bring the files into Postman with File, then Import.
