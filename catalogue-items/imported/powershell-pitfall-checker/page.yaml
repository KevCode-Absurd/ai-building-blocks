thinking: low
thinking_why: It checks the script against known pitfalls.
new_slug: powershell-pitfall-checker
name: PowerShell pitfall checker
summary: Check your PowerShell script for operator, quoting and null mistakes. You get a list of problems and a fixed script back.
job: test-and-fix-code
headline: PowerShell pitfall checker
subhead: Paste your Windows PowerShell script. Your AI checks it against a fixed list of known traps, like missing parentheses, emoji, null checks and JSON depth. You get a list of what it found and a corrected script.
explain: |
  Catch the Windows PowerShell mistakes that make scripts fail for no clear reason, and get the corrected script back.

  The skill checks for known traps. Logical operators like -and and -or need each command wrapped in parentheses. Emoji and fancy symbols break output, so it swaps them for plain tags like [OK] and [!]. It reviews null checks, quoting, error handling and path handling, and rewrites any line that is wrong. You paste your script and get a list of what was found plus a fixed version. It is built for Windows PowerShell.
when:
  - A script runs on your machine but fails on a colleague's.
  - An if line with -or or -and acts strangely or throws a parameter error.
  - Your script output shows broken characters or an Unexpected token error.
  - You want a quick check before you share a script.
not_for:
  - "You run PowerShell 7 on Linux or macOS: use PSScriptAnalyzer, a free checker made for PowerShell."
  - "Your script is cmd or batch (.bat): ask a person who knows batch files, or use a batch linter."
  - "You need proof the script works on your machine: test it yourself in a safe place first."
you_give:
  - Your PowerShell script
  - The error message you see (optional)
  - Your Windows and PowerShell version (optional)
you_get:
  - A list of mistakes found in your script
  - A corrected version of the script
  - A plain reason for each fix
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Paste your whole script below it.
  - Add the error text and your PowerShell version if you have them.
  - Ask for the findings list first, and read it.
  - Then ask for the corrected script with a reason for each fix.
  - Test the new script in a test folder before you use it. No code running is needed.
  - Next, paste the fixed script back in. The findings list should now be empty. For a second check, run the free PSScriptAnalyzer tool.
output_sample:
  input:
    - Your PowerShell script
    - The error message you see (optional)
    - Your Windows or PowerShell version (optional)
  output:
    - name: Findings list
      contains: Each mistake found, such as missing parentheses around commands joined by -or, emoji in output, or a missing null check.
    - name: Corrected script
      contains: Your script with each wrong line rewritten, using parentheses, plain [OK] and [!] tags, and Join-Path.
    - name: Fix explanations
      contains: A plain reason for each change, so you can spot the same mistake next time.
