thinking: medium
thinking_why: It reviews a draft against many fixed checks.
new_slug: pre-publish-content-checker
name: Pre-publish content checker
summary: Give it a draft and its brief. Get checks on facts, voice, structure,
  AI sound and search readiness.
job: write-and-tell-stories
headline: Pre-publish content checker
subhead: A final check on a draft before it goes live, so errors are caught
  before readers see them. Give it the draft and the brief and get a marked list
  of problems with fixes.
explain: |
  A final check on a draft before it goes live, so errors are caught before readers see them. Give it the draft and the brief and get a marked list of problems with fixes.

  It works through six checks: does the draft match the brief, does the voice stay consistent, are the facts right, is the structure clear, does it sound written by AI, and is it ready for search and answer engines. Each check looks for a specific kind of failure rather than ticking a box. It handles single articles and AI-written drafts, and can set up a repeatable review process for a team.
when:
  - A writer hands you a draft and you must approve it today.
  - An AI-written article needs a human-sounding pass.
  - Your team publishes errors and wants a standard review.
  - You want the page checked for search before it ships.
you_give:
  - The draft
  - The content brief
  - Brand voice notes (optional)
  - Target keyword (optional)
you_get:
  - Issue list by check type
  - Facts to verify
  - Voice and structure edits
  - Publish or hold verdict
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
