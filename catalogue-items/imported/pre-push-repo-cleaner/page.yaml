thinking: medium
thinking_why: It reads each file against a set checklist.
new_slug: pre-push-repo-cleaner
name: Pre-push repo cleaner
summary: Run a pre-push repo cleaner on your project to find junk files, dead code and leaked secrets, and fix them before you publish on GitHub.
job: ship-and-host
headline: Pre-push repo cleaner
subhead: A cleaner project before it goes on GitHub. The skill reads your code file by file, fixes what it can and flags what needs your decision.
explain: |
  A cleaner project before it goes on GitHub. The skill reads your code file by file, fixes what it can and flags what needs your decision.

  It finds junk such as .DS_Store, logs, temp files, build output and installed dependencies, and with your yes takes them out of git while leaving them on your computer. Files that might be needed or might be your own work, such as a vendor folder, backups or notes, are only listed for you to decide. Then it looks for dead code, hard-coded secrets and keys, security holes and slow patterns. Small safe fixes are made straight away. Untracking files and removing secrets wait for your yes. Use it before a first push, before making a repo public or before a production release. Review its changes before you commit.
when:
  - You are about to push a project to GitHub for the first time.
  - You want to make a private repo public safely.
  - Your folder is full of logs and old test files.
  - You worry an API key is hidden somewhere in the code.
not_for:
  - "You need a full security review or a plan to replace a leaked key: ask a security professional, and change any exposed key at once."
  - "Your project has no files your AI can read and edit: use a dedicated secrets scanner on your repo instead."
  - "You only want to write or run a git push: use your normal git steps, as this checks the code and does not push it."
you_give:
  - Your project folder
  - Notes on files to keep (optional)
  - Target platform (optional)
you_get:
  - Junk files taken out of git, with a list of files for you to decide on
  - Dead code removed
  - List of leaked secrets found
  - Security and speed fixes applied
how_to_use:
  - Commit or back up your project first, so you can undo any change.
  - Open an AI that can read and edit your project files, and add your project folder.
  - Paste in the skill instructions, or say "Follow this skill".
  - Add notes on files to keep, and where you plan to publish (optional).
  - Check the list of files it plans to take out of git, and say yes or no to each one. Decide what to do with each file it lists for you, such as backups and notes.
  - Read the report. Fix any critical items first, then run the app and the tests.
  - Review every change before you commit, and change any key that was exposed.
output_sample:
  input:
    - Your project folder
    - Notes on files to keep (optional)
    - The platform you will publish to (optional)
  prerequisites:
    - An AI that can read and edit your project files
    - Code you can run, so it can check the app still starts
  output:
    - name: Files taken out of git
      contains: Junk such as logs, temp files, build output and installed dependencies, kept on your computer but no longer pushed, plus a list of files for you to decide on.
    - name: Code changes
      contains: Each file with its fixes, such as dead code removed, vague names changed and missing error handling added.
    - name: Security issues
      contains: Hard-coded keys and risky code, marked by how serious they are, with the fix made.
    - name: Scalability
      contains: Slow database patterns and missing limits found, with the changes made.
    - name: Final status
      contains: A clear ready or not ready line, plus scores for security, code quality and scalability.
