thinking: medium
thinking_why: It must spot pressure tactics and weigh the evidence.
new_slug: pressure-proof-answer-checker
name: Pressure-proof answer checker
summary: Use it when someone pushes your AI to agree or sign off. Get answers
  that separate evidence from pressure.
job: think-and-decide
headline: Pressure-proof answer checker
subhead: A way to keep your AI honest when someone pushes it to agree, sign off
  or hurry. It separates what the evidence shows from what the pressure demands.
explain: |
  A way to keep your AI honest when someone pushes it to agree, sign off or hurry. It separates what the evidence shows from what the pressure demands.

  Before replying, the AI looks for pressure patterns: forced urgency, appeals to authority, requests to certify unchecked work. If an external anti-deception tool is set up, it can call that tool, but only when you allow sharing the context, and never with private details. The answer then leads with the strongest counter-evidence, states what is unknown, and refuses to give false assurance. You get a reply you can defend later.
when:
  - A boss wants the AI to approve a risky plan before tomorrow.
  - Someone claims authority to push through weak claims.
  - You are asked to confirm work that was never tested.
  - You want your AI to stop agreeing just to be pleasant.
you_give:
  - The message or request applying pressure
  - Facts or evidence you have
  - Permission to use an external tool (optional)
you_get:
  - Reply that leads with counter-evidence
  - Clear list of what is unproven
  - Refusal of false sign-off
  - Honest next steps
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
