thinking: medium
thinking_why: It weighs how people judge price against your goal.
new_slug: price-presentation-planner
name: Price presentation planner
summary: "Plan your price presentation: give it your product and prices, and get a tier and anchor layout that shows value clearly and fairly."
job: set-prices
headline: Price presentation planner
subhead: A layout for your prices, tiers and anchors that makes value easy to see without tricks. Give it your product and prices and get a plan that is clear and fair.
explain: |
  The skill starts with who the buyer is, what you want them to choose, and your ethical limits. It sets the reference point people will compare against, then designs the tiers and the anchor price. It tests ideas like a high-priced option beside the plan you want chosen, and a split of cost into smaller units. Each idea comes with the reason it works and a way to test it. Nothing misleading is used.
when:
  - Visitors view your pricing page but pick the cheapest plan.
  - You want to introduce a third tier.
  - You need to show a large price as good value.
  - You want to test an anchor before changing live prices.
not_for:
  - "You sell one flat price with nothing to compare it to: use a plain price list."
  - "You want to prove a price effect works: run a real test, since the studies it cites need checking before you quote them."
  - "You want to hide fees or push people with fake countdowns: this skill will not do that."
  - "You must follow legal rules on how prices and fees are shown, such as in finance, travel or telecoms: check those rules with a compliance person first."
you_give:
  - Product and current prices
  - Target buyer
  - Goal, such as plan selection or upsell
  - Ethical limits or market norms (optional)
you_get:
  - Tier and anchor layout
  - Reference point to set
  - Reason each choice works
  - Test ideas
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat.
  - "Gather first: your price list with currency and billing period, your buyer segment, the option buyers would otherwise choose, and your renewal and cancellation terms."
  - Paste your product, your current prices, your target buyer and your goal.
  - Add your limits or market norms if you have them (optional).
  - "Read the plan in order: the reference point, the price structure, the tiers and anchors, the quality-signal check, then the test ideas. At each stage, check the choice against your real offer."
  - Any anchor or annual saving shown must be a real, approved price, with its renewal and cancellation terms shown.
  - Check any study the plan mentions before you quote it to others.
  - Test the layout on a draft page before you change live prices.
output_sample:
  input:
    - Your product and current prices
    - Your target buyer
    - Your goal, such as plan selection or upsell
    - Your ethical limits or market norms (optional)
  output:
    - name: Reference point
      contains: What your buyer will compare your price against, tied to a real alternative.
    - name: Price structure
      contains: Whether to show monthly, annual, per-use, bundle or tiered prices, and why.
    - name: Tier and anchor layout
      contains: Your tiers and any anchor or decoy, only where it makes the preferred option clearer.
    - name: Reasons for each choice
      contains: One plain reason why each choice should help buyers see value.
    - name: Quality signal check
      contains: A check that the layout does not make a premium offer look cheap.
    - name: Test ideas
      contains: Ways to try the layout before you change your live prices.
