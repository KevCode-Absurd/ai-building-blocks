thinking: high
thinking_why: It checks if the data is good enough before it recommends any price.
new_slug: price-test-planner
name: Price test planner
summary: Plan a price test for your online store. Give it your costs and sales history. You get a price to try, three demand cases and a test you can undo.
job: set-prices
headline: Price test planner
subhead: The best price to try next, with three outcome cases and a test you can undo. Give it your costs and sales history and it shows what the numbers can and cannot tell you.
explain: |
  The best price to try next, with three outcome cases and a test you can undo. Give it your costs and sales history and it shows what the numbers can and cannot tell you.

  The skill checks that your price, sales, traffic and promotion data are comparable. It works out margin at each candidate price and sets hard limits. It estimates how demand reacts only when the data supports it, and says so when it does not. Candidates are compared under base, low and high demand. Then it designs a controlled test with a hypothesis, guardrails, and a decision rule, plus a rollback if results disappoint.
when:
  - You want to raise a price but fear losing sales.
  - You have five price options and need to pick.
  - You need a test design your boss will approve.
  - Your sales history is noisy and you want honest limits.
not_for:
  - You have no sales history yet. Check a few similar products and run a simple manual test instead.
  - You want a price changed on your live store. This only plans. You or your team must make any change.
  - Your sales history is mostly stockouts or heavy promotions. Collect a few clean weeks first, then run it.
you_give:
  - Unit costs and fees
  - Sales history by price
  - Traffic and promotion notes
  - Price candidates
you_get:
  - Recommended price to test
  - Base, low and high cases
  - Test design with guardrails
  - Rollback plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code is needed.
  - Paste your unit costs, fees and sales history. Show the price paid on each order, not just the list price.
  - Add notes on traffic, ads and promotions, and the price options you want to compare.
  - Say your goal, such as profit, and your lowest and highest allowed price.
  - Read the Data Fitness table first. If your data is weak, expect a test plan, not a firm price.
  - Approve any change yourself. The AI will not change live prices. The skill ends with a link to Nexscope Data APIs, an optional paid service. You can ignore it.
output_sample:
  input:
    - Your unit costs and fees
    - Your sales history with the price paid on each order
    - Traffic, ads and promotion notes (optional)
    - The price options you are weighing
    - Your lowest and highest allowed price (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini. No code or paid tool is needed.
  output:
    - name: Scope and Objective
      contains: The decision, your main goal, your channels, and which inputs are confirmed, assumed or unknown.
    - name: Data Fitness
      contains: A table of checks on your data, what was found, why it matters and how to fix it.
    - name: Economics and Constraints
      contains: Profit per sale at each candidate price, and whether each one stays inside your floor and ceiling.
    - name: Elasticity Assessment
      contains: Whether your data can show how demand reacts to price, with the method, limits and doubts.
    - name: Candidate Scenarios
      contains: Expected units, revenue and profit for each price under base, low and high demand, plus risks.
    - name: Decision
      contains: A call to recommend, test or hold, the chosen price, why, and what would change it.
    - name: Experiment or Rollout Plan
      contains: Test scope, main measure, guardrails, controls, and the rules to keep, extend, stop or revert.
