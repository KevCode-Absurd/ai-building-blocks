thinking: medium
thinking_why: It runs set price methods and writes up the tiers.
new_slug: pricing-model-designer
name: Pricing model designer
summary: Pick a pricing model and price range for your SaaS. Give it your product and survey answers to get tiers that fit.
job: set-prices
headline: Pricing model designer
subhead: Choose how to charge, what to charge and how to package it. Give it your product and price survey answers and get a pricing model, a price range and good, better, best tiers.
explain: |
  Choose how to charge, what to charge and how to package it. Give it your product and price survey answers and get a pricing model, a price range and good, better, best tiers.

  The skill compares models such as seat-based, usage-based, value-based, freemium and hybrid. If you have willingness-to-pay survey answers, it runs the Van Westendorp method to find the range between too cheap and too expensive. It builds three tiers and checks them for traps such as a decoy plan, a feature dump or no reason to upgrade. It recommends a model and range; you choose the final number.
when:
  - You are launching a SaaS and need first pricing.
  - Your pricing is 18 months old and feels wrong.
  - You ran a price survey and need to read it.
  - Your tiers confuse buyers.
not_for:
  - "You need to approve a discount on one deal: use your sales lead or a deal approval step, not this skill."
  - "You want brand positioning or a new category story: use a marketing lead or a positioning workshop first."
  - "You want one final price to type in: this gives a model and a range, so you pick the number."
you_give:
  - Product and customer description
  - Price survey responses (optional)
  - Competitor prices
  - Current plans (optional)
you_get:
  - Recommended pricing model
  - Price range from survey data
  - Good, better, best tier layout
  - List of packaging problems found
how_to_use:
  - Open your AI tool. Use one that can run code and read files, such as Claude or ChatGPT with code tools on.
  - Upload the skill folder, or paste the SKILL.md text into the chat.
  - "Fill in the pricing brief first: your industry, deal size, customer count, value drivers and competitor models."
  - Ask your AI to pick the pricing model from your brief. Read the trade-offs before you move on.
  - If you have survey answers, add them next. You need at least 30 people, and 100 is better. Each person answers four questions: at what price is it too cheap, a bargain, getting expensive, and too expensive. If you have not run the survey yet, use the Willingness-to-pay survey designer to write the questions. Ask for the acceptable price range.
  - Add your feature list and ask for good, better, best tiers. Fix any packaging flags, then choose your own price.
  - Next, test the price range in the market with a small price test on new customers. Then pass the chosen tiers to your discount rules, for example your deal approval step.
output_sample:
  input:
    - Your product and customer description
    - Your price survey answers (optional)
    - Competitor prices
    - Your current plans (optional)
    - Your feature list
  prerequisites:
    - An AI that can run code, to use the three scripts
    - A short pricing brief filled in first, about 20 minutes
  output:
    - name: Pricing model ranking
      contains: Five models scored from 0 to 100 for fit, each with trade-offs.
    - name: Price range
      contains: Four price points from the survey and the range buyers accept, plus a warning if the sample is too small.
    - name: Good, better, best tiers
      contains: Your features sorted into three tiers.
    - name: Packaging flags
      contains: Problems found, such as a decoy tier, a feature dump or no reason to upgrade.
next: [willingness-to-pay-survey, price-test-planner]
