thinking: high
thinking_why: Pricing choices carry big money risk.
new_slug: pricing-strategist
name: Pricing strategist
summary: Plan your SaaS pricing with a value metric, good-better-best tiers and a price test plan. Give it your product, buyers and competitors.
job: set-prices
headline: Pricing strategist
subhead: Describe your product and buyers. Get tiers, a value metric and a test plan for your prices. Bring your product, target market and competitor prices. Then run the price test on new customers.
explain: |
  A pricing plan for your product: tiers, the unit you charge on and a way to test prices without guessing.

  The skill asks about your product type, market, how you sell, what alternatives buyers consider and how competitors charge. It also wants your conversion, ARPU and churn numbers. From this it picks a value metric, the thing price grows with, then designs good, better, best packaging and decides where to put the free plan. It adds a test plan with what to measure and how long to run it, so you can change prices with evidence.
when:
  - Your SaaS charges a flat fee and customers use it very unevenly.
  - You think your price is too low but have no proof.
  - You are adding a free or enterprise plan.
  - You need to plan a price rise.
not_for:
  - "You want to fix an in-app upgrade screen: use a paywall skill, not this one."
  - "You sell services, courses or coaching and need bonuses, guarantees or naming: use an offer-building skill instead."
  - "You want to improve how your pricing page converts: use a conversion-rate review, or ask a person who runs page tests."
you_give:
  - Product and target market
  - Current pricing (optional)
  - Competitor prices
  - Conversion, churn and ARPU numbers (optional)
you_get:
  - Pricing tiers
  - Value metric to charge on
  - Packaging and feature split
  - Price test plan
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text (SKILL.md) together with the four files in its references folder. The skill works without them, but you lose the detail on pricing models, tiers, research methods and the pricing page teardown. No code or paid tools are needed.
  - Describe your product, your buyers and how you sell. Add competitor prices.
  - Add your current price, conversion rate, churn and revenue per customer if you have them.
  - Answer any questions your AI asks. It asks once, so say so if you do not know a number.
  - Read the value metric first. Check that it grows as your customers get more value.
  - Run the price test on new customers before you change prices for existing ones. The Price test planner can set up the test.
output_sample:
  input:
    - Your product type and who it is for
    - Your current pricing (optional)
    - How competitors charge
    - Your conversion rate, churn and revenue per customer (optional)
    - "Your goal: growth, revenue or profit (optional)"
  output:
    - name: Value metric
      contains: The one thing your price should grow with, and why it matches the value buyers get.
    - name: Pricing tiers
      contains: Good, better and best plans with price points and who each plan is for.
    - name: Packaging and feature split
      contains: Which features, limits and support levels go in each tier, and where a free plan fits.
    - name: Price test plan
      contains: What to measure, how long to run the test and how to roll out a change.
    - name: Price rise plan (if needed)
      contains: Steps to raise prices, including what to do for existing customers and how to tell them.
next: [price-test-planner, paywall-designer]
