thinking: medium
thinking_why: It maps your practice to a fixed control list.
new_slug: privacy-management-audit-planner
name: Privacy management audit planner
summary: Describe how you handle personal data. Get an ISO 27701 gap list, a privacy control checklist and an audit plan for your privacy management system.
job: check-contracts
headline: Privacy management audit planner
subhead: A clear view of where your handling of personal data falls short of ISO 27701, with the controls you need and a plan to audit them.
explain: |
  The skill handles both the 2019 add-on edition and the 2025 standalone one, and picks the right one for you. It runs a gap assessment against controller, processor and shared security controls, helps write a Statement of Applicability, and supports data protection impact assessments and records of processing. It also maps the standard to GDPR, CCPA, LGPD and PIPEDA, and plans the path to certification.

  The result is a planning draft, not an audit result or legal advice. The skill itself says its transition dates (certification bodies finishing around 31 October 2026, 2019 certificates moving by 2028) and its claim that ISO 27701 is not an approved GDPR certification scheme are not sourced. Check them with your certification body and the official ISO and data protection authority sources before you rely on them. Your team must also check each gap against real evidence.

  This is an MIT-licensed import from Hemant Naik's repository (Sushegaad/Claude-Skills-Governance-Risk-and-Compliance, commit aab13e1). We added notes that mark its dates and legal claims as unsourced, and changed nothing else.
when:
  - A customer asks if you hold ISO 27701.
  - You process personal data and want to test your controls.
  - You are moving from the 2019 to the 2025 edition.
  - You need a plan before an audit.
not_for:
  - "You need a legal opinion or a certificate: ask a qualified privacy lawyer or an accredited assessor."
  - "You only need to meet GDPR and do not want ISO 27701: ask a privacy lawyer for a GDPR-only review."
  - "You want a security audit of your systems: use an ISO 27001 auditor, as this covers personal data handling only."
you_give:
  - Description of how you handle personal data
  - Whether you act as controller or processor
  - Existing ISO 27001 status (optional)
  - Target laws such as GDPR
you_get:
  - Gap list against ISO 27701
  - Privacy control checklist
  - Statement of Applicability draft
  - Audit plan
how_to_use:
  - "Before you start, write down in plain words how personal data moves through your business: what you collect, where it is kept, who sees it and who you share it with. The skill cannot work without this. The result is a planning draft, not an audit or a legal opinion."
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code or paid tool is needed.
  - Say which edition you are on (2019 or 2025), and whether you are a controller, processor or both.
  - Describe your three main flows of personal data, such as what you collect, where it is kept and who sees it.
  - Add your ISO 27001 status and the laws you must meet, if you know them (optional).
  - Ask for the gap list first. Then ask for the control checklist, the Statement of Applicability draft and the audit plan.
  - Check the results with a qualified assessor or privacy counsel before you act on them. Confirm the transition dates with your certification body, because they can change.
  - Next, take the top gaps into a remediation plan, and run the gap list again after the fixes.
output_sample:
  input:
    - A short description of how you collect, use and store personal data
    - "Your role: controller, processor or both"
    - Which ISO 27701 edition you are on, 2019 or 2025 (optional)
    - Your ISO 27001 status (optional)
    - The laws you must meet, such as GDPR (optional)
  output:
    - name: Edition and role check
      contains: Which ISO 27701 edition fits you and whether you act as controller, processor or both.
    - name: Gap analysis
      contains: Where your practice falls short of the controller, processor and shared security controls, with common gaps.
    - name: Privacy control checklist
      contains: The Annex A controls that apply to your role, ready to tick off.
    - name: Statement of Applicability
      contains: A draft listing which controls apply, which do not, and why.
    - name: Privacy risk assessment
      contains: Privacy risks in your data handling, with support for impact assessments and records of processing.
    - name: Regulatory mapping
      contains: How the standard lines up with GDPR, CCPA, LGPD and PIPEDA.
    - name: Audit and transition plan
      contains: The steps to prepare for an audit, or to move from the 2019 edition to the 2025 edition.
