thinking: medium
thinking_why: It measures each stage, then names the main constraint.
new_slug: process-bottleneck-finder
name: Process bottleneck finder
summary: Find the one stage slowing your business process. Give it your stages and times. You get a swim-lane map, cycle times and a ranked bottleneck list.
job: organise-work
headline: Process bottleneck finder
subhead: The one stage that holds your process back, named and ranked, with a likely cause. Most elapsed time in a process is waiting, not work.
explain: |
  The one stage that holds your process back, named and ranked, with a likely cause. Most elapsed time in a process is waiting, not work. This finds where the waiting piles up so you fix the right stage.

  You describe the process from start to finish. Claude draws a swim-lane map in BPMN style, then works through cycle times per stage: typical and slow-case times, the share of time spent on real work, and throughput using Little's Law. It uses Lean and Theory of Constraints ideas to rank stages by severity and gives a root-cause guess for each. Small Python tools do the math, so you need Python available.
when:
  - Onboarding, procurement or claims take far longer than anyone expects.
  - You want to speed up a process but do not know which stage to fix first.
  - You need a map of how work moves between teams.
  - You have timestamps for each stage and want to see where work waits.
not_for:
  - "You want to track tickets or tasks day to day: use a project tool such as Jira or Trello."
  - "You want to check system uptime or error rates: use a service level tool built for engineers."
  - "You need to choose which process to fix first: talk it through with your COO or leadership team, then come back."
you_give:
  - A description of the process and its stages
  - Cycle time or timestamp data per stage (optional)
  - Who owns each stage (optional)
  - Volume of work per week or month (optional)
you_get:
  - A swim-lane process map
  - A ranked list of bottlenecks
  - Cycle time figures per stage
  - A root-cause guess for each bottleneck
  - The share of time spent on real work
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick one that can run Python code and read files, such as Claude Code or a chat with file tools on.
  - Give it the whole skill folder, not only SKILL.md. The math is done by three scripts in the scripts folder (process_documenter.py, cycle_time_analyzer.py and bottleneck_detector.py). Pasting the text alone will not run them.
  - Describe one process, stage by stage. Add the owner, typical time and slow-case time for each stage.
  - Find your stage times in a ticketing system, ERP or workflow export (look for the created, started and finished timestamps). If you have no measured times yet, use rough estimates and say so. Measured times give better results.
  - Mark each stage as real work, waiting or rework. Answer any question your AI asks about handoffs and batch sizes.
  - The cut-offs it uses (real work above 25% is healthy, below 10% is waste-heavy, a stage over 2x the average, waiting over 40%, rework over 15%) are the skill's own rules of thumb, not published standards. Treat them as a guide.
  - Read the map and the ranked list. The list is a table with one row per stage: its severity, the likely cause and the action to take.
  - Take the single top bottleneck into one fix plan. Run the analysis again after the change to see if the constraint has moved.
output_sample:
  input:
    - Your process, with one line per stage and who owns it
    - Typical and slow-case time for each stage
    - Whether each stage is real work, waiting or rework
    - Your work volume per week or month (optional)
  prerequisites:
    - An AI that can run Python code, since small scripts do the math
  output:
    - name: Swim-lane process map
      contains: A text diagram with one lane per owner, so handoffs between teams are easy to see.
    - name: Normalized process file
      contains: Your stages saved in a clean, checked format that the other tools read.
    - name: Cycle-time analysis
      contains: Typical and slow-case total time, share of real work, waiting and rework, and throughput, with a health verdict.
    - name: Ranked bottleneck list
      contains: Each bottleneck with a severity level, a likely root cause and one recommended action.
    - name: Recommendation
      contains: One fix aimed at the main constraint, with no advice to speed up other stages.
