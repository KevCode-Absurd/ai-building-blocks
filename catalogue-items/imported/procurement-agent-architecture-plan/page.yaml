thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: procurement-agent-architecture-plan
name: Procurement agent architecture plan
summary: Plan procurement automation for your RFP and vendor process. Get six AI agent roles, checks on suppliers, and human sign-off on awards.
job: plan-supply-chain
headline: Procurement agent architecture plan
subhead: Give your AI your buying process and rules. It adapts a six-agent plan to your setup, with people approving the key steps. It is a plan to build from. It does not run purchases for you.
when:
  - You want to automate how your team handles RFPs, RFQs or RFIs.
  - You need a clear way to split supplier checks, scoring and messages between AI roles.
  - You must decide where people approve work before it moves on.
  - You are comparing automation ideas before you ask a developer to build.
not_for:
  - "You have one RFP and no plans to automate: score the bids by hand in a sheet, or ask a colleague to review them."
  - "You need a build-ready plan with a business case and costs: ask a developer or consultant for a build-ready plan, or ask your internal team for a review."
  - "You want an AI to pick the winning supplier: this plan only recommends. People must approve every award."
how_to_use:
  - Gather the items in the list above. Missing items are fine, but say so.
  - Open Claude, ChatGPT or Gemini and paste the skill text. No code or paid tool is needed to get the plan. The systems the plan names (a vendor database, a scoring engine, a policy engine, approval and email tools) are not in a plain chat. A developer must build or buy them, and some need paid platforms or API access.
  - "Paste your documents and rules. Ask your AI to adapt the six agent roles to your process. Ask for one document back of about two pages, with one section per agent: its job, its inputs, its outputs and where a person approves. Ask it to name who approves at each checkpoint."
  - "Check that people approve the requirements, shortlist, award and outside messages. Who approves: the requestor confirms the requirements, the procurement lead approves the shortlist, the procurement lead and the budget owner approve the award, and a named person reviews every outside message before it is sent."
  - Share the plan with your team or a developer. They must build, secure and test it before use. This skill only produces a plan. Check the systems named under connections against your own purchasing software before anything is built.
output_shape: |
  One document of about two pages with these sections, in order:
  1. Intake Agent: job, inputs, outputs, decision rules, who approves
  2. Requirements Agent: same five parts
  3. Vendor Matching Agent: same five parts
  4. Compliance Agent: same five parts
  5. Evaluation Agent: same five parts
  6. Communication Agent: same five parts
  7. Human approval points: the four checkpoints and the named approver for each
  8. Connections and metrics
output_sample:
  input:
    - Your RFx documents, such as the scope of work, specs and past contracts
    - Your approval limits and buying rules
    - Your current supplier list (optional)
    - The systems you use to buy, such as your procurement or document tools (optional)
  prerequisites:
    - You must build and test any agents yourself. This page gives a plan, not working software.
  output:
    - name: Intake Agent
      contains: Reads the request and documents, builds the RFx record, and sends work to the other agents.
    - name: Requirements Agent
      contains: Checks requirements for gaps and conflicts, and builds a weighted requirements matrix and scoring rubric.
    - name: Vendor Matching Agent
      contains: Suggests a supplier shortlist with reasons, past results, and a list of suppliers left out and why.
    - name: Compliance Agent
      contains: Checks policy, rules and insurance needs, and keeps a record of every check.
    - name: Evaluation Agent
      contains: Scores supplier answers, compares them, recommends an award, and notes where the pick is not the strongest.
    - name: Communication Agent
      contains: Drafts invitations, question replies, award and regret notices, and deadline reminders.
    - name: Human approval points
      contains: Where people confirm requirements, the shortlist, the award and every message sent outside.
    - name: Connections and metrics
      contains: The systems each agent needs, plus measures such as cycle time and compliance pass rate.
you_give:
  - Your RFx documents (the request for proposal, quote or information, as PDF, Word or pasted text), such as the scope of work, specs and past contracts.
  - "Your approval limits and buying rules, written as amounts in your own currency for each level (for example, up to [AMOUNT] goes to the team lead, above [AMOUNT] goes to the finance director)."
  - Your current supplier list (optional).
  - The systems you use to buy, such as your procurement or document tools (optional).
you_get:
  - Six agent roles, each with its inputs, results and decision rules.
  - A map of which agent hands work to which.
  - Four points where a person must approve before work moves on.
  - A list of systems each agent needs to connect to.
  - Measures to track and common mistakes to avoid.
