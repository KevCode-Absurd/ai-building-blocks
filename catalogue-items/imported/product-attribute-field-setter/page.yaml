thinking: medium
thinking_why: It defines fields, then fills them from product data.
new_slug: product-attribute-field-setter
name: Product attribute field setter
summary: Set up product attribute fields in Shopify, then fill material, care, fit and spec values from your products so AI shopping tools can match them.
job: build-websites
headline: Product attribute field setter
subhead: Product fields for material, key features, care, fit and specs, set up and filled across your Shopify catalog. Shopping tools filter best on facts stored in fields.
explain: |
  Product fields for material, key features, care, fit and specs, set up and filled across your Shopify catalog. AI shopping tools can filter on facts stored in fields. A fact that lives only in prose may be missed in a search like "machine-washable wool". How each tool works varies, and this skill cannot promise more traffic.

  Claude checks which attribute fields exist, creates the missing ones, then reads each product's title, type, options and description to fill them in. You review the plan first. It changes live store data, so it needs an authenticated Shopify CLI session with product write access. Run a preview before you apply anything.
when:
  - Shoppers ask AI tools for items by material or spec and your products never show up.
  - Your size and spec details sit in long descriptions and nowhere else.
  - You are preparing your catalog for AI shopping assistants.
  - You want the same set of attribute fields on every product.
not_for:
  - "You want to change one or two products: edit them by hand in your Shopify admin."
  - "Your account has no product write access: ask the store owner for access first, or fix the fields by hand."
  - "You want better product descriptions: use the Product description enricher instead. This item only fills fields."
you_give:
  - Your store domain
  - The facts that matter for your products, such as material, fit or care
  - Which products to include
  - Approval to write to the store after a preview
you_get:
  - A set of attribute fields on your store
  - Values filled in for each product
  - A preview of changes before they go live
  - A list of products that still lack data
how_to_use:
  - Use an AI that can run commands, such as Claude Code. A plain chat can't change your store.
  - Sign in to your store with the command shopify auth login, using your store domain.
  - Ask your AI to run this skill with dry_run set to true (the default). Nothing is written in this mode.
  - Read the planned fields and the value preview. Check that each value is true for its product.
  - Run it again with dry_run off to write the fields and values to your store.
  - Fill in any blank values by hand. The skill leaves a field empty when it is not sure.
  - Next steps: open the CSV of filled values and check a sample against your store. Then run the Product description enricher as a separate task to make the descriptions match the new fields.
output_sample:
  input:
    - Your store domain
    - Which products to include, such as a collection or a tag (optional)
    - Which attribute fields you want (optional)
  prerequisites:
    - An AI that can run Shopify CLI commands, such as Claude Code
    - A Shopify CLI login with product write access
  output:
    - name: Definitions check
      contains: Which attribute fields already exist in your store and which are missing.
    - name: Created definitions
      contains: The new fields added for material, features, care, fit and specs.
    - name: Value preview
      contains: The values the AI plans to write for each product, shown before anything goes live.
    - name: Populated values CSV
      contains: One row per value with the product, the field, the value and where it came from.
    - name: Outcome summary
      contains: Counts of fields created, values set, products changed and any errors.
