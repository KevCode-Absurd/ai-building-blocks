thinking: low
thinking_why: It follows a set prompt recipe for one photo at a time.
new_slug: product-background-swapper
name: Product background swapper
summary: Swap a white product photo background for a real-looking scene with matching light and shadow. Get a ready image prompt for your image model.
job: product-photos
headline: Product background swapper
subhead: Your plain white-background product photo placed into a believable room, desk or outdoor scene. The product stays exactly as it is. Only the surroundings change.
explain: |
  Your plain white-background product photo placed into a believable room, desk or outdoor scene. The product stays exactly as it is. Only the surroundings change.

  The method focuses on three things that make a swap look real: a contact shadow under the product, reflections from nearby surfaces, and light that comes from the same direction as in the scene. Without these the product looks like a sticker floating on a backdrop. Claude writes the scene prompt that keeps the product details fixed and describes the setting and light. Claude cannot draw the picture itself. An image model such as ChatGPT or Gemini, or an image API key, does that step.
when:
  - You have clean white-background shots and want lifestyle images for ads or listings.
  - A product photo looks flat and you want it on a table, floor or shelf.
  - You need the same product shown in several seasons or settings.
  - A stock backdrop made your product look pasted on.
not_for:
  - "You need the product's shape, color or material changed: ask a photographer or designer to reshoot or edit it."
  - "Your item is glass or mirror and you have no reference photos: keep a plain background, since the reflections will look fake."
  - "Your photo is already in a busy scene: cut out the product onto white first, or use a simple photo editor."
  - "You need a real photo of the product in a real place: book a photographer, or use a stock-photo service for the backdrop."
you_give:
  - A white-background product photo
  - The scene you want, such as a wooden desk by a window
  - Mood or time of day (optional)
  - Access to an image model
you_get:
  - A ready-to-use image prompt
  - A scene with grounded shadows and matching light
  - Notes on keeping the product unchanged
  - Tips to fix a swap that looks fake
how_to_use:
  - "Free route, in order: first check your photo specs. Second, write the prompt using the three realism rules. Third, paste the prompt and your photo into ChatGPT or Gemini. Fourth, check the shadow, the edges and that the product is unchanged. The steps below give the detail."
  - Check your photo first. It should be a jpg, png or webp file, at least 400 by 400 pixels, between 20KB and 15MB.
  - Pick your scene. Choose one that fits the product, such as a floor for shoes or a counter for beauty items.
  - Paste the skill into Claude, ChatGPT or Gemini. Add your photo, the scene and the product details.
  - Copy the image prompt it writes. Run it in an image model that accepts a photo, such as ChatGPT or Gemini. The skill's own commands use the paid dLazy tool and need an account and a way to run commands. You can skip that and run the prompt in ChatGPT or Gemini instead. Some paid tools or API keys cost money per image.
  - The skill file also lists scripts, docs/ paths and dLazy commands. They are not included here, so follow the ChatGPT or Gemini route above.
  - Check the result for a shadow under the product, matching light, clean edges and an unchanged product.
  - If it looks fake, add one of the fix lines to the prompt and run it again.
  - When you are happy, save the image under a clear name, such as shoes-desk-1.jpg, and reuse the same prompt for other products in the same category. Next, use it on your listing or ad. If the shadow looks wrong, fix it with the fix lines above, or run a background-remover on the photo first.
output_sample:
  input:
    - Your product photo on a white or plain background
    - The scene you want, such as a wooden floor by a window
    - A background photo to place the product in (optional)
    - Your product's color, material and details, so they stay the same
  prerequisites:
    - An image model, such as ChatGPT or Gemini, or an image API key
    - A paid account or API key may be needed for the image step. Check your provider's price first.
  output:
    - name: Product faithfulness line
      contains: A sentence that tells the image model to keep the shape, finish, stitching and logo exactly as in your photo.
    - name: Scene line
      contains: The surface, setting, props and light for your new background, picked to suit your product type.
    - name: Three realism rules
      contains: Instructions for a grounded contact shadow, light that matches the product, and reflections from nearby surfaces.
    - name: Image prompt
      contains: The full prompt to paste into your image model, with no text or watermark.
    - name: Fix lines
      contains: Short sentences to add when the result looks like a sticker, has a white edge, or changes the product.
    - name: Scene images
      contains: "On the free route you get one English image prompt, and a saved image file from your image model. The source skill uses 1024x1024 for square and 1024x1536 for tall scenes, and names files for the scene and variant, such as shoes-desk-1.jpg. You can ask for 2 to 4 variants. The source skill's own example picture is not included here, so the page cannot show a result."
