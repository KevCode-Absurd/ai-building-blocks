thinking: low
thinking_why: It finds gaps and fills fields by set rules.
new_slug: product-data-gap-filler
name: Product data gap filler
summary: Find Shopify products missing a barcode, SKU, vendor or product type, then fill the blanks from your own data. Preview every change before it goes live.
job: build-websites
headline: Product data gap filler
subhead: Missing barcodes, SKUs, vendors, product types and weights found and filled, so AI tools can quote an exact in-stock item. When this data is blank, a shopping agent may not be able to confirm the product is the one asked for, and may pick a rival with full data.
explain: |
  Missing barcodes, SKUs, vendors, product types and weights found and filled, so AI tools can quote an exact in-stock item. When this data is blank, a shopping agent may not be able to confirm the product is the one asked for, and may pick a rival with full data. This is the author's view, not a measured result.

  This is an imported copy of an MIT-licensed skill (see the LICENSE file). It is not an original AI Blocks skill. Credit goes to the source author, named in the credits.

  Claude scans your Shopify products and variants for blank fields. Vendor and product type are set at product level. Barcode and SKU are set per variant. You see the gaps and proposed values before anything is written. It changes live data, so you need an authenticated Shopify CLI session with product write access, and you should supply real barcodes rather than guesses.
when:
  - Your product pages show no GTIN or SKU.
  - AI shopping tools may skip your items in favour of competitors.
  - Vendor or product type is blank on many products.
  - You are cleaning up a catalog after a bulk import.
not_for:
  - "You only want a read-only check of how ready your store is: use the Shopify AI shopping readiness checker first and do not use this tool to write changes."
  - "You need to fix values that are already filled in but wrong: use the Product field bulk editor, or edit them in your Shopify admin."
  - "You do not have real barcodes from your supplier: ask your supplier first, because a wrong barcode is worse than a blank one."
you_give:
  - Your store domain
  - Barcode, SKU and vendor data you already have
  - Which products to check
  - Approval before changes go live
you_get:
  - A report of products with missing fields
  - Fields filled where data is known
  - Variant-level barcode and SKU updates
  - A list of gaps only you can fill
how_to_use:
  - "Before any real run, back up your data. In your Shopify admin, open Products and choose Export, then pick all products and the CSV for Excel option. Keep the file. If a write goes wrong, import that file again and choose to overwrite existing products with the same handle."
  - Open your AI in a tool that can run Shopify CLI commands, such as Claude Code. Install the Shopify CLI, then sign in to your store yourself with `shopify store auth --store your-store.myshopify.com --scopes read_products,write_products`. Check the command against the current Shopify CLI help, because it can change.
  - Paste the skill and give your store domain. Add your SKU and barcode file and any vendor or product type to apply.
  - Ask for a dry run first. Nothing is written in a dry run.
  - Read the change preview CSV. Check that each barcode matches the right product.
  - When the preview looks right, ask your AI to run it for real. It only fills blanks and never overwrites a value.
  - Check the outcome summary and the still-missing list, then get the missing data from your supplier.
output_sample:
  input:
    - Your store domain
    - A file with SKU and barcode pairs, from your supplier (optional)
    - The vendor name to use where it is blank (optional)
    - The product type to use where it is blank (optional)
    - A collection or tag to limit the check (optional)
  prerequisites:
    - An AI that can run Shopify CLI commands
    - A signed-in Shopify CLI session for your store
    - Access to read and change products in your store
    - An AI that can run code, to run the commands in this skill
  output:
    - name: Gap report
      contains: Products and variants with a blank vendor, product type, barcode or SKU, found by scanning your catalog.
    - name: Change preview CSV
      contains: One row per planned change, with the product, variant, field, old value and new value, before anything is written.
    - name: Product updates
      contains: Vendor and product type filled in on products where they were blank and you gave a value.
    - name: Variant updates
      contains: Barcode and SKU filled in on variants where they were blank and your file has a match.
    - name: Outcome summary
      contains: Counts of products and variants updated for each field, plus any errors.
    - name: Still-missing list
      contains: Variants with no match in your file, left blank so you can find the data.
next: [ai-shopping-readiness-checker, product-field-bulk-editor]
terms:
  - term: GTIN
    meaning: The number under a product's barcode. Shopping tools use it to tell products apart.
  - term: SKU
    meaning: Your own code for a product or variant, such as a size and colour.
  - term: JSON-LD
    meaning: Hidden product facts in your page that search and AI tools read.
