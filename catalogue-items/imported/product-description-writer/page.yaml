thinking: medium
thinking_why: It picks claims and units, then writes with set rules.
new_slug: product-description-writer
name: Product description writer
summary: Write a product description that picks the best three claims and the right units. Give it your product facts and benefits.
job: run-your-store
headline: Product description writer
subhead: "A product description built on the choices that change buying decisions: how many claims to make, which units to use, and what tone fits. The rules matter more than clever adjectives."
explain: |
  A product description built on the choices that change buying decisions: how many claims to make, which units to use, and what tone fits. The rules matter more than clever adjectives.

  Claude first sorts your product as bought for pleasure (chocolate, decor, perfume) or bought to do a job. That sets the style. Then it picks how many benefits to show, whether to say 500g or 25 servings, how to name a color, and whether a point like lab testing is worth adding. Each choice follows research on persuasion and willingness to pay. You get copy plus a short note on why each choice was made.
when:
  - You are writing or rewriting a description, title or feature bullets.
  - You are unsure how many benefits to list.
  - You cannot decide between units, such as grams or servings.
  - You need to name a color or variant in a way that sells.
not_for:
  - "You want a full page audit: use the Product page auditor, or ask a person to review the page."
  - "You need photo or video direction: brief a photographer or ask your AI for a shot list."
  - "You need discount or promotion wording: write the offer text on its own, apart from the product copy."
you_give:
  - "Product facts: materials, quantity, specs"
  - All candidate benefits
  - Your audience and how technical they are
  - Where the copy will appear and its length limit
you_get:
  - A finished description or bullet list
  - The right number of claims for the product
  - Unit and wording choices explained
  - Title and hero line options
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text. Add reference.md too if you want the sources behind each figure. It needs no code or paid tools.
  - Paste your product facts and your full list of benefits.
  - Say who buys it, how technical they are, and the length limit.
  - Read the rules table. Check each choice fits your product.
  - Only keep claims you can document, such as "lab-tested" or a branded ingredient. Cut any you cannot back up.
  - Move the cut claims to your spec table or another page. Then run the copy through the Product page auditor or A/B test the headline before you publish.
output_sample:
  input:
    - "Your product facts: materials, quantity, specs, ingredients"
    - Your full list of benefits
    - Your audience and how technical they are
    - Where the copy will appear and its length limit
  output:
    - name: Headline and body
      contains: The finished product copy, written to fit your length limit.
    - name: Rules table
      contains: Each rule your AI applied, such as three claims or units, and where it shows in the copy.
    - name: Cut list
      contains: The benefits left out, and where each one can go, such as a spec table.
