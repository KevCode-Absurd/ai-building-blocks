thinking: medium
thinking_why: Text in the picture must be readable, so it checks each block.
new_slug: product-detail-image-maker
name: Product detail image maker
summary: Turn one product photo and your selling points into detail page images with the text already on the picture, ready to upload to your listing.
job: product-photos
headline: Product detail image maker
subhead: Product detail page images with the selling points already laid out as text on the picture, ready to upload. Most image models scramble written text, so the model you pick matters more than any other setting.
explain: |
  Product detail page images with the selling points already laid out as text on the picture, ready to upload. Most image models scramble written text, so the model you pick matters more than any other setting.

  Claude takes one product photo and your selling points, then writes a prompt for each page module, such as a top banner with headline and short feature line. It keeps the product's color, weave and shape matched to your photo and plans where the text sits. The method was written for Chinese text, and we have not tested English text on the picture. Read every word the model draws. Claude cannot draw. An image model or API key does that step.
when:
  - You need a set of detail page modules for a product listing.
  - You want headlines and feature lines placed on the image.
  - Plain photos make your listing look unfinished.
  - You are launching a product with only one source photo.
not_for:
  - "You only need a clean background or a cropped photo: use a plain photo editor instead."
  - "You have no verified selling points yet: check your product facts first, or ask your supplier for the real specs."
  - "You need a full page with prices, deals or test results: write those yourself and check each one."
you_give:
  - A clear product photo
  - Your selling points and headline wording
  - The language for the text on the image
  - Access to an image model that renders text well
you_get:
  - A prompt for each detail page module
  - Text layout notes for banner and feature areas
  - Advice on choosing a model that renders text
  - Tips to keep the product true to the photo
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste this skill. Add your product photo link or file, your product type and your selling points.
  - "Keep each line short: a headline of 8 characters or fewer, a subhead of 16 or fewer, and icon text of 5 or fewer. For the size block, give your real measurements. Never let the AI make up a size table."
  - "Ask for one prompt per block: banner, icons, material, details and size. Do not ask for the whole page at once. Each block comes out as a jpg at 3:4, 1:1 or 9:16, at about 2K."
  - "The skill file is in Chinese. Its method gives text that reads cleanly: write each line into the prompt in quote marks, name the font style, say where the text sits, and tell the model the text must be clear and not garbled."
  - "Use this prompt for each block: Product detail page [block name], [aspect ratio]. Keep the product's colour, [material] and [pattern] exactly as in my photo. Set the text: large text '[HEADLINE]', small subtext '[SUBHEAD]'. Style: [background and tone], clean sans-serif font, aligned layout. All text must be clear and correct. Add no text that was not provided. Run each prompt in any image model that draws text well, such as the image maker in ChatGPT or Gemini. That is the free route to try first. The skill's own scripts use dLazy instead, which needs a paid account, an API key and about 5 credits per image. Make 2 or 3 tries per block."
  - Read every word on each picture. Fix garbled text with the fix lines. Check every claim against your verified product specs before you upload. Do not use any sample selling point as your own.
  - "Expect five finished files, one per block, in this order: banner (3:4), icon row (1:1), material (1:1), detail (1:1 or 9:16), size and specs (9:16). Name them in that order, for example sku-1-banner.jpg, so they join in the right order."
  - Join the blocks into one long image in a design tool, then upload. The sample text is for illustration only, so replace it with your own.
output_sample:
  input:
    - One clear product photo, 20KB to 15MB, at least 400 by 400 pixels
    - Your selling points in short lines, about 100 characters in all
    - Your product type, such as clothing, bags, beauty or home goods
    - Access to an image model that draws text well
  prerequisites:
    - A dLazy account, an API key and paid credits (about 5 per image), or another image model that draws text cleanly
    - An AI that can run commands, if you want it to call the image model for you
  output:
    - name: Top banner prompt
      contains: A prompt for the first screen, with a big headline, a small subhead and the product shown as in your photo.
    - name: Selling point icon row prompt
      contains: A prompt for three or four round icons, each with a short line of text under it.
    - name: Material block prompt
      contains: A prompt for a close-up of the fabric or material, with a short title and two lines of text.
    - name: Detail block prompt
      contains: A prompt for a close-up of one part of the product, with a note on how it is made.
    - name: Size and specs block prompt
      contains: A prompt for a simple size table or spec list with a title.
    - name: Fix lines
      contains: Extra sentences to add when text is garbled, overlaps the product, sits crooked or the product looks changed.
    - name: Final check list
      contains: Steps to proofread every word, join the blocks into one long image and check each claim.
