thinking: medium
thinking_why: It uses set statistics and a fixed plan format.
new_slug: product-experiment-designer
name: Product experiment designer
summary: Give it an idea to test. Get a clear hypothesis, sample size, test plan
  and how to read the result.
job: test-an-idea
headline: Product experiment designer
subhead: "A test plan you can run and trust: a clear hypothesis, the right
  sample size, and rules for when to stop and how to read the result."
explain: |
  A test plan you can run and trust: a clear hypothesis, the right sample size, and rules for when to stop and how to read the result. It keeps you from calling a winner too early.

  Claude writes the idea in If, Then, Because form. It picks one decision metric, adds guardrail metrics to catch harm, and treats other numbers as diagnostics only. A Python script works out sample size from your baseline rate, the smallest change worth detecting, confidence and power. Ideas are ranked with ICE scoring: impact, confidence and ease. It then sets stopping rules before launch and reads the outcome.
when:
  - You have several ideas to test and need to pick the order.
  - You want to know how many users a test needs.
  - A test finished and you are unsure if the result is real.
  - You need a simple hypothesis the whole team can agree on.
you_give:
  - The change you want to test
  - Your current conversion rate or average
  - The smallest improvement that would matter
  - Test results to interpret (optional)
you_get:
  - A written hypothesis
  - Primary and guardrail metrics
  - A sample size and test duration
  - ICE ranking of test ideas
  - A plain reading of the result
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code.
