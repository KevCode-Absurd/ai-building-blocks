thinking: low
thinking_why: It writes a short line per image.
new_slug: product-image-alt-text-writer
name: Product image alt text writer
summary: Write product image alt text for your Shopify store. It finds blank or file-name alt text, writes a short line for each image, and saves it after you approve.
job: build-websites
headline: Product image alt text writer
subhead: Clear alt text on every product image, so AI tools know what each one shows. Shopping agents cannot see pixels. They read the alt text to judge color, material and style, and a file name like IMG2931 tells them nothing.
explain: |
  Clear alt text on every product image, so AI tools know what each one shows. Shopping agents cannot see pixels. They read the alt text to judge color, material and style, and a file name like IMG_2931 tells them nothing.

  Claude finds product images with blank or low-value alt text. For each, it writes a short, specific line covering what the product is, its color and material, and how it is shown. The lines come from the product title, options, type and tags. Your AI does not look at the photo. Check the colour, material and view against each image before you approve. You review the lines before anything is saved. The change updates live files, so you need an authenticated Shopify CLI session with product and file write access.
when:
  - Your product images have no alt text.
  - Alt text on your store is just file names.
  - You want visual searches like "red linen midi dress" to find your items.
  - You are making your store more accessible for screen readers.
not_for:
  - Your alt text is already accurate and specific, so leave it alone.
  - You sell art, or images where a person must describe fine detail or meaning. Ask a human writer.
  - Your store is not on Shopify. Write the alt text by hand in your own site editor.
you_give:
  - Your store domain
  - Which products or images to cover
  - Style notes for how you describe products (optional)
  - Approval before the changes are saved
you_get:
  - A list of images missing good alt text
  - A short description for each image
  - Alt text saved to your store after approval
  - A summary of how many were updated
how_to_use:
  - Open an AI that can run Shopify CLI commands and sign in to your store.
  - Paste this skill and give your store domain. Add a collection or tag if you want a smaller run.
  - Ask for a dry run first. Nothing is saved on a dry run.
  - Dry run is the default. Your AI saves nothing until you say yes.
  - Read the preview table. Lines marked CHECK AGAINST PHOTO use a colour, material or view that is not in the product data. Open each image and compare. Fix any line that is wrong or vague.
  - Approve the run. Your AI saves the alt text to your live images.
  - Keep the option to rewrite existing alt text off at first. That change cannot be undone in bulk.
  - Afterward, open a few product pages on your live store to check the alt text reads right. Then run the AI shopping readiness checker again to confirm your alt text coverage improved.
output_sample:
  input:
    - Your store domain
    - A collection or product tag to limit the run (optional)
    - Whether to also rewrite file-name alt text (optional)
    - A maximum length for each line (optional)
  prerequisites:
    - An AI that can run Shopify CLI commands
    - A signed-in Shopify CLI session for your store
    - Permission to read products and write products and files
  output:
    - name: Preview table
      contains: Each image with its proposed alt text, shown before anything is saved.
    - name: Updated alt text
      contains: New alt text saved to your live product images in batches of up to 25.
    - name: Outcome summary
      contains: How many images were updated or skipped, and how many errors came up.
    - name: CSV of changes
      contains: One row per image with the product, image id, old alt text and new alt text.
