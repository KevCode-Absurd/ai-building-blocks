thinking: medium
thinking_why: It lays out stages and drafts copy.
new_slug: product-launch-planner
name: Product launch planner
summary: Plan a product launch with dated phases, channels and announcement drafts. Give it your product, audience and date, and get a plan you can run.
job: build-product
headline: Product launch planner
subhead: A launch plan with dates, channels and announcement copy, so a new product or feature gets noticed instead of slipping out quietly. Launches are treated as repeating events, not one big day.
explain: |
  A launch plan with dates, channels and announcement copy, so a new product or feature gets noticed instead of slipping out quietly. Launches are treated as repeating events, not one big day.

  Claude uses your product context if you paste it in, then asks only what is missing. It builds a phased plan covering pre-launch buzz, launch day and follow-up, picks channels such as email, Product Hunt or social, and drafts announcement messages. It also covers beta launches, waitlists and a pre-launch checklist. The result is tied to your audience and goal rather than a generic template.
when:
  - You are about to ship a product and need a plan.
  - A feature release deserves more than a changelog line.
  - You want to run a Product Hunt or beta launch.
  - You need an announcement email or post written.
not_for:
  - "You ship a small fix or a bug release: write a short changelog entry or release note instead."
  - "You want ongoing marketing after the launch is over: use the Marketing ideas skill, or ask a teammate to plan a content calendar."
  - "You need the offer itself designed, such as bonuses, guarantees or pricing: work that out first, then come back to plan the launch."
you_give:
  - What you are launching and its main benefit
  - Your target audience
  - Your target date and available channels
  - Your product context file (optional)
you_get:
  - A phased launch timeline
  - Channel recommendations
  - Announcement copy drafts
  - A pre-launch checklist
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat. No code or paid tool is needed. The tools it names, such as Navattic, Introw, SparkToro and Listen Notes, are optional and may cost money.
  - Say what you are launching and the main benefit. Add your audience, your target date and the channels you can use.
  - Paste the text of your product context file too, if you have one (optional). Your AI cannot read files on your computer. It then asks only for what is missing.
  - Answer any questions the AI asks. If you do not know something, say so and ask it to mark that part as missing.
  - Read the readiness check first. Fix any gaps before you follow the timeline or send the announcement drafts.
  - Edit the drafts so they sound like you. Check every date and claim before you publish.
output_sample:
  input:
    - What you are launching and its main benefit
    - Your target audience
    - Your target date and the channels you can use
    - Your product context file (optional)
  output:
    - name: Readiness check
      contains: A short gate that shows whether your product, page and team are ready before you announce.
    - name: Channel plan
      contains: Owned, rented and borrowed channels picked for your audience, with a reason for each.
    - name: Phased launch timeline
      contains: Steps from internal launch through alpha, beta, early access and full launch, laid out by phase.
    - name: Product Hunt plan
      contains: Advice on whether to launch there and how to prepare, if it fits your product.
    - name: Announcement drafts
      contains: Written messages for your chosen channels, such as an email or a social post.
    - name: Launch checklist
      contains: Tasks to finish before launch, on launch day and after launch.
