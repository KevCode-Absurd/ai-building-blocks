thinking: medium
thinking_why: It scores against set rules and rewrites to fit the job.
new_slug: product-manager-resume-reviewer
name: Product manager resume reviewer
summary: Check your product manager resume against ten rules. Get fixes from your own bullets and a draft tailored to the job you want.
job: hire-people
headline: Product manager resume reviewer
subhead: A PM resume reviewed line by line against ten best practices, with suggestions taken straight from your own bullet points. If you add a job posting, the feedback and rewrite are tuned to that role.
explain: |
  A PM resume reviewed line by line against ten best practices, with suggestions taken straight from your own bullet points. If you add a job posting, the feedback and rewrite are tuned to that role.

  Claude opens by naming what already works. It then goes through each practice in turn, covering things like the XYZ+S formula for bullets (what you achieved, how much, how, and the scale), keyword match, tailoring to the job and structure. For each it says what is working, what is not, and shows a better version. It finishes with a tailored resume draft you can edit.
when:
  - You are applying for product manager roles.
  - Your bullets list duties and show no results.
  - You want your resume to match a specific job posting.
  - You need a second opinion before sending applications.
not_for:
  - "You are applying for a role that is not product management: use a general resume editor or ask a recruiter in that field."
  - "You need an academic CV or a long research format: use your university career office or a CV template for that field."
  - "You want help with a cover letter or interview answers: ask your AI for that task on its own, as this only reviews a resume."
you_give:
  - Your resume text
  - A target job posting (optional)
  - Your target seniority or company type (optional)
you_get:
  - Feedback on ten best practices
  - Rewritten bullets using your own work
  - Keyword gaps against the posting
  - A tailored resume version
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code, files or paid tools are needed.
  - Paste your resume text. Add the job posting and your target level if you have them.
  - Read the feedback on all ten points. Each one shows your current text and a better version.
  - Check every number before you use it. Example figures in the skill, like percentages and dollar amounts, are placeholders. Only use figures you can prove.
  - Before you send it, list each number in the draft and confirm it against your own records.
  - Ask for the tailored draft, edit it, then paste it back for a second pass.
output_sample:
  input:
    - Your resume text
    - A job posting for the role you want (optional)
    - Your name, if you want it used in the feedback (optional)
  output:
    - name: Introduction
      contains: A friendly greeting and one or two strengths the reviewer sees right away.
    - name: Feedback on the ten practices
      contains: "For each practice: what works, what does not, quotes from your resume, and a suggested rewrite."
    - name: Keyword match
      contains: Key skills from the job posting and where your resume is missing them, if you added a posting.
    - name: Conclusion
      contains: A short summary of the top changes to make first, and an offer to review again.
