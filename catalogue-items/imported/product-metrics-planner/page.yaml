thinking: medium
thinking_why: It picks metrics that fit your stage.
new_slug: product-metrics-planner
name: Product metrics planner
summary: Say your product stage. Get the KPIs to track, a dashboard layout and
  how to read retention and adoption.
job: build-product
headline: Product metrics planner
subhead: A short list of the numbers worth tracking at your product's stage,
  laid out as a dashboard, plus a way to read retention and adoption.
explain: |
  A short list of the numbers worth tracking at your product's stage, laid out as a dashboard, plus a way to read retention and adoption. You avoid drowning in charts that do not drive decisions.

  Claude picks a framework to fit: AARRR for funnels, North Star for shared focus, or HEART for user experience quality. It then sets KPIs for your stage, whether before product-market fit, growing or mature. The dashboard has three layers: five to seven leadership metrics, product health, and per-feature use. For cohorts, it compares retention curves rather than single points and looks for drop-offs around first value.
when:
  - You are launching and do not know which metrics matter yet.
  - Your dashboard has too many numbers and no clear story.
  - You need to read cohort retention.
  - You want to know if a feature is actually being used.
you_give:
  - Your product and its stage
  - Your main business goal
  - Current metrics or cohort data (optional)
  - The analytics tool you use (optional)
you_get:
  - A chosen metric framework
  - KPIs for your stage
  - A layered dashboard layout
  - A reading of retention and adoption
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
