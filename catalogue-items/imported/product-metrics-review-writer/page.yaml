thinking: medium
thinking_why: It reads numbers and explains the causes.
new_slug: product-metrics-review-writer
name: Product metrics review writer
summary: "Turn your product numbers into a metrics review: a scorecard against targets, what moved, likely causes and next steps. Paste your figures to start."
job: build-product
headline: Product metrics review writer
subhead: A metrics review that says what moved, why it may have moved, and what to do about it. You get a scorecard against targets instead of a pile of numbers.
explain: |
  A metrics review that says what moved, why it may have moved, and what to do about it. You get a scorecard against targets instead of a pile of numbers.

  Claude takes your metrics for a week, month or quarter, or pulls them from a connected analytics tool. It compares them with the previous period and with your targets, then separates real trends from noise. It checks for known causes such as launches, outages or seasonality, and digs into sudden spikes and drops. Each finding ends with a suggested action and who might own it.
when:
  - You run a weekly or monthly product review and want it faster.
  - A metric suddenly dropped and you need possible causes.
  - You need to show progress against targets.
  - You have raw numbers and need a clear summary for leaders.
not_for:
  - "You want to read the result of one A/B test: use a proper experiment analysis step, or ask your data person for the test readout."
  - "You have no numbers yet: set up tracking in your analytics tool first, then come back with a week or month of data."
  - "You need a live dashboard that updates itself: build that in your analytics tool or Google Sheets, not in a chat."
you_give:
  - Metric values for the period
  - Previous period figures and targets
  - Recent launches, incidents or campaigns (optional)
  - A focus metric or segment (optional)
you_get:
  - A scorecard against targets
  - Trends and notable changes
  - Likely causes for spikes and drops
  - Recommended actions
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill instructions into a new chat.
  - Paste your metric values for the period, plus last period's figures and your targets. A table or a screenshot works.
  - Add recent launches, outages or campaigns, and say which metric to focus on (optional).
  - Answer any questions it asks about the time period or targets.
  - Check the scorecard against your own numbers before you share it, and test the likely causes with your team.
output_sample:
  input:
    - Your metric values for the week, month or quarter
    - Last period's figures and your targets
    - Recent launches, outages or campaigns (optional)
    - A metric or user group to focus on (optional)
  prerequisites:
    - An analytics tool connected to your AI is optional. Pasted numbers work too.
  output:
    - name: Summary
      contains: A short read of the main story that a busy leader can take in quickly.
    - name: Metric Scorecard
      contains: A table of each metric with its current value, change from last period, target and status.
    - name: Trend Analysis
      contains: How each key metric is moving, whether the change is speeding up or slowing, and which metrics move together.
    - name: Bright Spots
      contains: The metrics that are doing well and the likely reasons.
    - name: Areas of Concern
      contains: Drops, spikes and misses against target, with possible causes.
    - name: Recommended Actions
      contains: Next steps for each finding, with a suggested owner.
    - name: Context and Caveats
      contains: Known events, gaps in the data and what to check before you trust the result.
