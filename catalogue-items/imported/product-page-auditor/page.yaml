thinking: medium
thinking_why: It checks the page against a set list and ranks the fixes.
new_slug: product-page-auditor
name: Product page auditor
summary: Give it a product page. Get ranked changes to variants, social proof,
  buttons and price, each with the research behind it.
job: audit-landing-page
headline: Product page auditor
subhead: A ranked list of changes for a product page, each with the research
  behind it and the effect to expect. Layout, counts and choice design shape how
  much a product feels wanted and worth its price before anyone reads the copy.
explain: |
  A ranked list of changes for a product page, each with the research behind it and the effect to expect. Layout, counts and choice design shape how much a product feels wanted and worth its price before anyone reads the copy.

  Claude takes your page by URL, screenshot or description. It first decides if the product is bought for pleasure or to do a job. It then checks variants and sold-out options, how views and purchase counts are shown, buttons, social proof and price placement against peer-reviewed findings. Changes are ordered by likely impact.
when:
  - Your product page gets visits but few sales.
  - You are unsure how to show variants or sold-out options.
  - You wonder whether to show how many people viewed an item.
  - You are designing a new page template.
you_give:
  - A page link, screenshot or description
  - Product, price and number of options
  - View and purchase counts (optional)
  - Company size (optional)
you_get:
  - A ranked list of page changes
  - The research reason for each change
  - Expected effect of each change
  - Guidance on variants, price and proof
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
