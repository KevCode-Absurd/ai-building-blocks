thinking: medium
thinking_why: It runs many jobs and watches cost, and you choose the shared style.
new_slug: product-photo-batch-maker
name: Product photo batch maker
summary: Give it a spreadsheet of products. Get one matching photo per product,
  with a cost limit. Your image model draws them.
job: product-photos
headline: Product photo batch maker
subhead: One matching product photo for every row in your product spreadsheet,
  so a whole catalog looks like a single shoot. The hard part is keeping a big
  set consistent, so the style rules never change and only the product details
  do.
explain: |
  One matching product photo for every row in your product spreadsheet, so a whole catalog looks like a single shoot. The hard part is keeping a big set consistent, so the style rules never change and only the product details do.

  Claude splits each prompt into a fixed style block and a variable block for each item. It sets up a loop with parallel runs, retries and resume after a stop, and a cost limit that halts the run when spending hits your cap. A contact sheet helps you pick the best images. Claude cannot draw. An image model API key and its cost are needed.
when:
  - You have hundreds of products and need images in one style.
  - A run failed halfway and you want to resume it.
  - You want to cap image spend before starting.
  - You need a contact sheet to choose from.
you_give:
  - A CSV of products with descriptions
  - Source product photos
  - A visual style for the whole set
  - A spending limit and image model access
you_get:
  - A batch script with fixed style and variable parts
  - One image per product
  - Retry and resume handling
  - A cost limit
  - A contact sheet to pick from
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and use your own image model key
    (OpenAI, Gemini, fal or Replicate).
