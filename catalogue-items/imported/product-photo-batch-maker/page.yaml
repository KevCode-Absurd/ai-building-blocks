thinking: medium
thinking_why: It runs many jobs and watches cost, and you choose the shared style.
new_slug: product-photo-batch-maker
name: Product photo batch maker
summary: Turn a product spreadsheet into one matching product photo per row with a batch image script. Needs a dLazy account and credits.
job: product-photos
headline: Product photo batch maker
subhead: One matching product photo for every row in your product spreadsheet, so a whole catalog looks like a single shoot. The hard part is keeping a big set consistent, so the style rules never change and only the product details do.
explain: |
  One matching product photo for every row in your product spreadsheet, so a whole catalog looks like a single shoot. The hard part is keeping a big set consistent, so the style rules never change and only the product details do.

  Claude splits each prompt into a fixed style block and a variable block for each item. It sets up a loop with parallel runs, retries and a way to rerun the failed products, and a price check before the run. The script does not stop on its own when spending reaches a cap, so you set a total you accept and watch it yourself. It does not build a contact sheet, so you look through the images yourself. Claude cannot draw. An image model API key and its cost are needed.
when:
  - You have hundreds of products and need images in one style.
  - A run failed halfway and you want to resume it.
  - You want to see the image spend before starting.
  - You want a report of which products worked and which failed.
not_for:
  - "You want mixed visual styles in one batch: run each style as its own batch, or make single photos one at a time."
  - "You have only one or two products: ask your image tool for a single photo instead of building a batch script."
  - "You need a cost cap that stops the run on its own: this skill only shows the price check, so watch the total yourself."
you_give:
  - A CSV of products with descriptions
  - Source product photos
  - A visual style for the whole set
  - A total you are willing to spend, and image model access
you_get:
  - A batch script with fixed style and variable parts
  - One image per product
  - Retry and resume handling
  - A price check before you run
  - A report.csv marking each product ok or fail
how_to_use:
  - Open your AI tool and paste in this skill. Use one that can run commands and read your files. This is for advanced users who are happy working on the command line.
  - "Before you start: you need a dLazy account with credits. The seedream-5.0 model is the cheap default. The gpt-image-2 model costs about 6 times more and suits products where fine detail matters. These credit prices (about 5 credits per image, about 500 for 100 products) and the batch discount are the original author's figures, as copied on 2026-10-20. Check dLazy's current price list before you set a budget."
  - Give it your product CSV, your source photos and the style you want for the whole set.
  - Run one product first. Then run five more that cover dark, light and shiny items. Fix the style now, because changing it later means rerunning the whole batch.
  - Do a dry run to see the price. Write down the most you accept to spend, because the loop has no spending stop. Run the batch in chunks, such as 20 products at a time, and check your credit balance between chunks. If the running credit total reaches the cap you set, stop the batch. Then check report.csv, which has one row per product marked ok or fail, and rerun only the failed products.
  - "Check a sample of about 10% of the images by eye before you publish them. Every image must show the real product, with no added features and no changed colour. A listing photo that misleads buyers can break marketplace and ad rules, so compare each one to the item you sell. The prompt templates in the skill are in Chinese, so use this one: \"Product photo for a catalogue. Image 1 is the product: [category, colour, material, key details]. Keep its colour, material and details exactly as in image 1. [Your fixed style block, the same for every product]. Realistic commercial product photography, no text, no watermark.\""
  - Next, use report.csv to rerun the failed products, and look through the images to pick the best one for each product. The skill's last step pointed to a separate check skill (detect-task) that is not in this folder, so we replaced it with your own 10% check.
output_sample:
  input:
    - Your product list as a CSV with a code, a photo path and a short description for each product
    - One source photo per product (20KB to 15MB, over 400x400, jpg, png or webp)
    - "Your visual style for the whole set: background, light, angle and shadow"
    - A dLazy account with credits
  prerequisites:
    - An AI that can run shell commands and files
    - A dLazy account with credits, plus the dlazy command line tool
    - Prompt templates in the skill are in Chinese
  output:
    - name: manifest.csv
      contains: "Your product list with one row per product: code, photo path and description."
    - name: Fixed style block
      contains: The style text that stays word for word the same for every product in the batch.
    - name: Batch loop script
      contains: A shell loop that sends each product with its own description, runs five at a time and retries up to three times.
    - name: Price estimate
      contains: A dry run price check, multiplied by the number of products, before you run the full batch.
    - name: One image per product
      contains: A photo saved under each product code, all in the same style.
    - name: report.csv
      contains: One line per product marked ok or fail, with a count so you can rerun the failures.
