thinking: medium
thinking_why: It chooses shots by what research says helps sales.
new_slug: product-shoot-brief-writer
name: Product shoot brief writer
summary: Write a product shoot brief for your photographer. Give it your product and get a shot list for photos and video, with a reason for each shot.
job: product-photos
headline: Product shoot brief writer
subhead: Give it your product and where the pictures will run. It writes a shot list you can hand to a photographer. Each shot comes with the reason behind it.
explain: |
  A shot list for photos and video where every shot has a reason behind it. Instead of taste, the brief draws on research on what moves sales and willingness to pay. Each effect comes from one study, so treat it as a guide, not a promise.

  The studies are: Roggeveen et al. 2015 (video and willingness to pay for enjoyment products), To and Patrick 2021 (model gaze, one sun hat A/B test), Luangrath et al. 2022 (a hand touching the product, 15 experiments), Sharma and Kumar 2022 (shine), Sevilla and Townsend 2016 (empty space between products), Maille et al. 2019 (which side the product sits), Radon et al. 2021 (props) and Hagtvedt and Brasel 2017 (colour saturation). A few shots, such as slow motion and several copies of a one-job product, have no study behind them and are marked as tips. The full list with each result is in reference.md.

  The skill collects, or states as an assumption, whether your product can be held and if it is premium, whether it has one main function, and who wears it. It then sets format choices, like stills versus video, plus gaze, the sense of touching the product, and composition details such as shine, spacing, side and props. Most shots cite a measured effect. A few are marked as practitioner tips. The brief is written to hand to a photographer.
when:
  - You are briefing a photographer or video team.
  - You must decide whether a product needs video.
  - Your product images do not sell and you do not know why.
  - You need to choose between candidate hero images.
not_for:
  - "You need page layout, buttons, variants or price position: use the Product page auditor, since this only covers photos and video."
  - "You need the product description text: use the Product description writer, since this writes shots, not words."
  - "You want a studio, a photographer or lighting set up: hire a photographer, because this writes the brief but takes no photos."
you_give:
  - The product and how it is used
  - Where the visuals will run
  - Your audience and reading direction
  - Candidate images to compare (optional)
you_get:
  - A shot list with a reason for each shot
  - Photo versus video advice
  - Pose and composition notes
  - A pick between candidate images
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page. Add reference.md if you want the source for each figure. No code or paid tools are needed.
  - Have ready a product photo or spec sheet, the places the pictures will run, and which way your buyers read.
  - Tell your AI what the product is, how people use it and where the pictures will run.
  - Say who buys it and which way they read. Add candidate images if you have them (optional).
  - Check the shot list. Shots marked with a dagger are practitioner tips, not measured findings. The effect numbers come from single studies. Check them against reference.md before you quote them to a photographer or your team. If your product is both a treat and a tool, the skill gives a default: stills, one hand shot and one optional test video. Confirm the product type yourself.
  - Send the list to your photographer. Then use the Product page auditor or the Product description writer for the rest of the page.
output_sample:
  input:
    - Your product and how people use it
    - Where the visuals will run, such as product page, ads or social
    - Your audience and which way they read (left to right or right to left)
    - Candidate images to compare (optional)
  output:
    - name: Product type
      contains: Whether your product is bought for enjoyment or for a job, which decides the video or stills advice.
    - name: Shot list table
      contains: Numbered shots, each with a direction, the rule behind it and the effect it relies on.
    - name: Format advice
      contains: Whether you need video, stills or a slow-motion shot, based on your product type.
    - name: Pose and composition notes
      contains: Where the model looks, hand use, which side the product sits, shine, spacing, props and colour.
    - name: What not to do
      contains: A short list of choices to avoid for this product, such as direct gaze or a matte finish.
    - name: Image pick
      contains: Which candidate image to use and why, when you supply candidates.
