thinking: high
thinking_why: Strategy needs judgement across many trade-offs.
new_slug: product-vision-and-okr-planner
name: Product vision and OKR planner
summary: Plan quarterly OKRs for your product team. Give it your strategy type and teams. You get a cascade from company goals to each team, with alignment scores.
job: plan-strategy
headline: Product vision and OKR planner
subhead: A product vision, a quarterly plan and a chain of goals from company down to each team, all pointing the same way. You also see how well the goals line up.
explain: |
  A product vision, a quarterly plan and a chain of goals from company down to each team, all pointing the same way. You also see how well the goals line up.

  Claude generates OKRs for one of five strategy types: growth, retention, revenue, innovation or operational. It cascades them from company level to teams you name, and scores alignment both up and down and across teams. It can also help with a competitive landscape view, a vision document and a team scaling proposal. A Python script builds the cascade, so you need Python available.
when:
  - You are writing quarterly OKRs for a product organisation.
  - Team goals do not clearly support company goals.
  - You need a product vision document.
  - You want to propose adding people to a team.
not_for:
  - "You only need a single-team roadmap: use a simple roadmap doc or a planning tool your team already has."
  - "Your company has no measurable goals yet: set a few numbers first with your leadership, then come back."
  - "You need a deep competitor teardown: do that research first, then bring the notes here."
you_give:
  - Your strategy type, such as growth or retention
  - Your teams, such as Engineering and Design
  - Company goals and the product share of them
  - Competitor notes (optional)
you_get:
  - A product vision
  - Company to team OKR cascade
  - Alignment scores
  - A quarterly plan
  - A team scaling proposal (optional)
how_to_use:
  - Open Claude, ChatGPT or Gemini in a mode that can run Python code and use files. Upload the skill folder.
  - "Pick your strategy type: growth, retention, revenue, innovation or operational."
  - Give your team names and your company goals with current and target numbers. Replace any sample numbers with real ones from your analytics. The script's default run uses sample metrics (for example 100,000 to 150,000 users and "expand to 3 new markets"). These are placeholders, not your goals.
  - Ask your AI to run the OKR cascade script and show you the results.
  - Check the alignment scores. Fix any score under 60% before you share the plan.
  - Review the goals with your team leads. Change team goals to match real capacity.
  - Optional: export the plan as JSON for Lattice, Ally or Workboard. Check whether your plan with each one allows an import, because some are paid.
output_sample:
  input:
    - "Your strategy type: growth, retention, revenue, innovation or operational"
    - The names of your teams
    - Your company goals, with current and target numbers
    - How much of the company goals your product share covers (optional)
  prerequisites:
    - An AI that can run Python code, since a script builds the OKR cascade
  output:
    - name: Company OKRs
      contains: Three company objectives for your strategy type, each with key results that have current and target values.
    - name: Product OKRs
      contains: Product objectives that link to a company objective, sized by your product share.
    - name: Team OKRs
      contains: Objectives and key results for each team you named, linked to the product goals.
    - name: Alignment scores
      contains: Scores for vertical alignment, horizontal alignment, coverage, balance and an overall score.
    - name: JSON export
      contains: The full cascade as a file you can load into an OKR tool (optional).
