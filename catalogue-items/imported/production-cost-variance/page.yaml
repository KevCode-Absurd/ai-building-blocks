job: money-and-investing
headline: Production cost variance explainer
subhead: When actual production costs miss the standard, you need to know why. A
  variance report splits the gap into price, usage, labour rate and labour
  efficiency, so you can see which part is a purchasing issue and which is a
  shop floor issue.
explain: |
  When actual production costs miss the standard, you need to know why. A variance report splits the gap into price, usage, labour rate and labour efficiency, so you can see which part is a purchasing issue and which is a shop floor issue.

  You give the standard price and quantity per unit and what really happened. The skill runs the material price and usage formulas, then the labour rate and efficiency formulas, and adds fixed overhead spending and volume gaps. It marks each as favourable or unfavourable and asks the root cause questions: bad buying deal or market spike, machine downtime or poor training. The result opens with a total and the main driver.
when:
  - Month end shows production cost above budget and nobody can say why.
  - You need to tell your boss whether the overrun came from suppliers or from
    the floor.
  - You are checking whether a favourable material price hid a worse usage
    problem.
  - You are preparing a production audit and need numbers behind each gap.
you_give:
  - Standard price and quantity per unit
  - Actual price paid and quantity used
  - Standard and actual labour rate and hours
  - Overhead budget and actual spend (optional)
you_get:
  - Total variance, favourable or unfavourable
  - Material and labour variances broken out
  - Overhead variance
  - The primary driver in one line
  - Suggested root causes to check
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
