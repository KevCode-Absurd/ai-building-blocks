thinking: low
thinking_why: It reads data and reports it.
new_slug: production-error-summarizer
name: Production error summarizer
summary: Summarize recent production errors from Sentry. Ask what broke and get the top open issues with level, priority and key details in plain words.
job: test-and-fix-code
headline: Production error summarizer
subhead: Ask what broke in production and get a short, readable answer pulled straight from Sentry. No clicking through dashboards to find the issues that matter.
explain: |
  Ask what broke in production and get a short, readable answer pulled straight from Sentry. No clicking through dashboards to find the issues that matter.

  The skill uses the Sentry command line tool in read-only mode. It lists unresolved issues from the last 24 hours in the production environment, newest first, with title, level and priority. You can then open one issue to see its events and details. It never changes anything in Sentry. You need the Sentry CLI installed and signed in, and you set your access token locally, never in chat.
when:
  - You just shipped a release and want to know if new errors appeared.
  - You are on call and need the top live issues in a minute.
  - A teammate asks what went wrong overnight and you need a summary.
  - You want the key facts on one failing issue without opening the Sentry site.
not_for:
  - "You want to check code before release: Sentry only shows errors that already happened, so run your own tests first."
  - "You use a tool other than Sentry for errors: this skill only reads from Sentry, so use that tool's own dashboard."
  - "You have billing or account questions for your whole organisation: use the Sentry website directly."
you_give:
  - A question about recent errors, such as a time range or project
  - Sentry CLI installed and signed in
  - Organisation and project names (optional, usually found automatically)
you_get:
  - List of recent unresolved issues
  - Priority and level for each
  - Event details for any issue you pick
  - A short plain summary of what is going wrong
how_to_use:
  - Install the Sentry command line tool on your computer and run "sentry auth login". Set your access token on your own machine, never in chat.
  - Open an AI that can run commands, such as Claude Code or Codex, and add this skill.
  - Ask a plain question, such as "What broke in production in the last 24 hours?"
  - Read the issue list. Pick one issue by its short ID and ask for its details.
  - Check the summary against what you know. The skill only reads from Sentry and never changes anything.
  - To go further, ask your AI to explain the cause or plan a fix for the top issue.
output_sample:
  input:
    - A question about recent errors, such as "List the top 10 open issues for prod in the last 24h"
    - Your Sentry organisation and project names (optional, usually found by itself)
    - A short issue ID such as ABC-123 (optional, to look at one issue)
  prerequisites:
    - An AI that can run commands on your computer
    - The Sentry command line tool installed and signed in
    - Your Sentry access token set on your own machine, never pasted in chat
  output:
    - name: Issue list
      contains: Unresolved production issues from the last 24 hours, newest first, with title, short ID, level, priority, count and last seen.
    - name: Issue detail
      contains: The key facts on one issue you pick, including culprit, time, environment and release.
    - name: Event detail
      contains: One event from that issue, with personal details such as emails and IP addresses removed and no raw stack trace.
    - name: Plain summary
      contains: A short plain-words read on what is going wrong, or a clear line saying no issues were found.
