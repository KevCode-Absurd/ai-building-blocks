thinking: high
thinking_why: Failure patterns are subtle and depend on how your system fits together.
new_slug: production-stability-reviewer
name: Production stability reviewer
summary: Find where your service will fail in production and get fixes like timeouts, retries and circuit breakers. Score it out of 8 on stability checks.
job: ship-and-host
headline: Production stability reviewer
subhead: Find the places where your service will fall over in production, and fix them before an outage spreads. The review turns vague worry into a list of weak spots with specific fixes.
explain: |
  Find the places where your service will fall over in production, and fix them before an outage spreads. The review turns vague worry into a list of weak spots with specific fixes.

  The skill walks through eight checks: timeouts on every outside call, circuit breakers, bulkheads that isolate failures, zero-downtime deploys, deep health checks, linked logs and metrics, load tests past peak traffic, and deliberate failure testing. Each answered yes earns a point, and the score shows how exposed you are. For each gap it recommends a pattern, such as a retry with backoff or a breaker that stops a retry storm, and explains where to put it.
when:
  - Your service keeps crashing under load and you do not know which call is the cause.
  - A slow partner API has taken your whole app down before.
  - You are planning a launch and want to know how it behaves at peak.
  - You want to deploy without taking the site offline.
not_for:
  - "You need to design how your data is stored or synced across systems: ask for help from a data systems engineer or use a data design guide."
  - "You want a high-level plan for how your whole product fits together: start with a system design review instead."
  - "You only need to find bugs in your code: use a normal code review or your test suite."
you_give:
  - Description of the service and what it depends on
  - Past outages or crash reports (optional)
  - Current deploy and monitoring setup
  - Expected peak traffic
you_get:
  - Score out of 8 on stability checks
  - List of weak spots ranked by risk
  - Fixes such as timeouts, retries and circuit breakers
  - A rollout order for the changes
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page. No code running or paid tool is needed.
  - Describe your service in plain words. Say what it calls outside itself, such as partner APIs, databases or payment tools.
  - Add how you deploy and how you watch it, plus your expected peak traffic.
  - Paste any past outage notes or crash reports if you have them (optional).
  - Read the score and the failing checks first. Then ask your AI to explain any fix you do not follow.
  - "A yes on each check means this. Every outside call has a timeout. Key dependencies have circuit breakers. Each dependency has its own pool. You can deploy without downtime. Health checks test the database, cache and queue. Logs, metrics and traces are linked. You have load tested at 2 to 3 times peak. You practise failure testing."
  - "Plan the fixes in the rollout order it gives you. Start with the first failing check. The skill's references folder holds a longer guide for each area. It is not part of the pasted text, so paste or upload the file you need if you want it. Timeouts: add connect and read timeouts on every outside call. Breakers: add a circuit breaker on each key dependency. Deploys: use a rolling, blue-green or canary release."
  - Before any change reaches your live system, have an engineer review it, test it in a staging copy first, and have a rollback plan ready.
  - Some terms in the skill file are advanced, for example Universal Scalability Law, expand-contract and SLI to SLO to SLA. Ask your AI to explain any you do not know.
output_sample:
  input:
    - A description of your service and what it depends on
    - Your current deploy and monitoring setup
    - Your expected peak traffic
    - Past outages or crash reports (optional)
  output:
    - name: Stability score
      contains: One point for each of the 8 checks answered yes, shown as a score out of 8.
    - name: Failing checks
      contains: The checks that failed, ranked by risk, with a short reason for each.
    - name: Fix for each gap
      contains: A named pattern such as a timeout, retry with backoff or circuit breaker, and where to put it.
    - name: Rollout order
      contains: The order to make the changes in, so the biggest risks are fixed first.
