thinking: medium
thinking_why: It builds the question, milestones and criteria to fit together.
new_slug: project-based-unit-brief-writer
name: Project-based unit brief writer
summary: Plan a project-based learning unit. Give your topic and year group. You get a driving question, milestones and marking criteria.
job: teach-and-train
headline: Project-based unit brief writer
subhead: A student-ready project brief for a unit of work, built around one driving question that gives the whole project a purpose. Teachers get a plan they can hand out and mark against.
explain: |
  A student-ready project brief for a unit of work, built around one driving question that gives the whole project a purpose. Teachers get a plan they can hand out and mark against.

  You give the topic, learning goals, year group and how long the project runs. The skill writes a real-world scenario, spells out what students will produce, and sets milestones with checkpoints along the way. It adds assessment criteria, a teacher guide listing what to teach explicitly and when, and notes for supporting different learners. It also states its own design choices so you can change them. Based on research into project-based learning.
when:
  - You are planning a half-term project and need a strong opening question.
  - You want students to produce something real, not just answer worksheets.
  - You need clear marking criteria before the project starts.
  - You want milestones so students do not leave the work until the last week.
not_for:
  - "You only need one lesson or a recall quiz: use a worksheet or a short quiz instead."
  - "You need a full marking rubric for finished work: use the Task marking guide writer after the brief."
  - "You want to plan the whole unit from the end goal back: do that first, then bring the goal here."
you_give:
  - Topic the project covers
  - Learning goals
  - Year group
  - Project length
  - Real-world link or subject area (optional)
you_get:
  - Driving question and scenario
  - What students will make
  - Milestone schedule
  - Marking criteria
  - Teacher guide and support notes
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code, files or paid tools are needed.
  - "Add your topic, learning goals, year group and project length. Then ask your AI to follow the skill's prompt step by step: driving question, scenario, what students make, milestones, marking criteria, teacher guide."
  - Add your subject, a real-world link, class details or resources if you have them (optional).
  - Read the driving question and scenario first. If you gave no real-world link, the scenario is made up and labelled as fictional. Replace any invented local details with real local facts before you hand the brief to students. Change the question and scenario if they do not fit your class.
  - Check the Known Design Choices section and edit any choice you disagree with.
  - Next, use the Task rubric drafter for the full marking rubric. Then ask your AI to adapt the brief for your learners.
output_sample:
  input:
    - Your project topic
    - Your learning goals for students
    - Your year group
    - How long the project runs
    - Your subject, real-world link, class details or resources (optional)
  output:
    - name: Driving question
      contains: One open question that gives the whole project a purpose.
    - name: The Scenario
      contains: A real-world situation that sets up the question and who the work is for.
    - name: What You Will Produce
      contains: The product or products students make by the end of the project.
    - name: Milestones
      contains: Checkpoints through the project so students do not leave the work to the last week.
    - name: Assessment Criteria
      contains: What good work looks like, so you can mark against it.
    - name: Explicit Instruction Map (Teacher Guide)
      contains: What you should teach directly, and when in the project.
    - name: Differentiation Notes
      contains: Ways to support different learners in the same project.
    - name: Known Design Choices
      contains: The choices the skill made, so you can see them and change them.
next: [task-rubric-drafter]
