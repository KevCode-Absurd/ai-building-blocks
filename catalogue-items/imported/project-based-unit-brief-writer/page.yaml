thinking: medium
thinking_why: It builds the question, milestones and criteria to fit together.
new_slug: project-based-unit-brief-writer
name: Project-based unit brief writer
summary: Give it a topic. Get a project brief with a driving question,
  milestones and marking criteria.
job: teach-and-train
headline: Project-based unit brief writer
subhead: A student-ready project brief for a unit of work, built around one
  driving question that gives the whole project a purpose. Teachers get a plan
  they can hand out and mark against.
explain: |
  A student-ready project brief for a unit of work, built around one driving question that gives the whole project a purpose. Teachers get a plan they can hand out and mark against.

  You give the topic, learning goals, year group and how long the project runs. The skill writes a real-world scenario, spells out what students will produce, and sets milestones with checkpoints along the way. It adds assessment criteria, a teacher guide listing what to teach explicitly and when, and notes for supporting different learners. It also states its own design choices so you can change them. Based on research into project-based learning.
when:
  - You are planning a half-term project and need a strong opening question.
  - You want students to produce something real, not just answer worksheets.
  - You need clear marking criteria before the project starts.
  - You want milestones so students do not leave the work until the last week.
you_give:
  - Topic the project covers
  - Learning goals
  - Year group
  - Project length
  - Real-world link or subject area (optional)
you_get:
  - Driving question and scenario
  - What students will make
  - Milestone schedule
  - Marking criteria
  - Teacher guide and support notes
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
