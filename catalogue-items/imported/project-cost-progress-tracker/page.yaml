new_slug: project-cost-progress-tracker
name: Project cost progress tracker
summary: Check if your project is on budget and on time. Give it budget, planned work and spend. You get cost and schedule scores and a final cost forecast.
job: money-and-investing
headline: Project cost progress tracker
subhead: A clear answer to whether your project is on budget and on time, plus a forecast of what it will cost at the end. It replaces gut feel with three numbers you can defend in a meeting.
explain: |
  A clear answer to whether your project is on budget and on time, plus a forecast of what it will cost at the end. It replaces gut feel with three numbers you can defend in a meeting.

  You give the planned budget, the work scheduled by now, the work really done and the money spent. The skill works out earned value, then the cost index and schedule index. A value below 1.0 means over budget or behind. It forecasts the final cost, the gap against budget and the efficiency you need on remaining work. It also asks you to measure progress by finished work, such as half the foundation poured, not by effort spent.
when:
  - A large project is halfway through and you need an honest status.
  - Your sponsor wants a forecast of the final cost.
  - Spend looks fine but you suspect the work is behind.
  - You need to know how much harder the team must work to finish within budget.
not_for:
  - Your project has no budget or schedule yet. Set the baseline first with a budget forecast, then come back.
  - You want to judge if the project is still worth doing. Use a capital budgeting check, or ask your finance lead.
  - You only want to know how much you have spent so far. A simple spreadsheet total will do.
you_give:
  - Total budget
  - Planned value to date
  - Actual cost to date
  - Percent complete for each task or work package
you_get:
  - Cost and schedule performance indexes
  - Projected final cost and variance
  - Efficiency needed on remaining work
  - A short dashboard in plain words
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tool is needed.
  - "Prepare a small table with these columns: task, budget, planned value to date, percent complete, actual cost."
  - Paste the table into the chat. Add your total project budget.
  - Measure percent complete by finished work, such as half the foundation poured, not by hours spent.
  - Read the cost and schedule scores first. A score below 1.0 means over budget or behind.
  - Check the forecast and the corrective actions, then share the dashboard with your sponsor.
  - Next, log actual cost and percent complete each month and run the table again, so you can see the trend.
  - If your AI cannot run code, it does the sums by hand. Ask it to show each step so you can check them.
output_sample:
  input:
    - Your total budget for the project
    - The budgeted cost of work planned by today
    - The money actually spent so far
    - Percent complete for each task or work package
  output:
    - name: Key Metrics
      contains: The cost performance index and schedule performance index, each marked as over or under budget, ahead or behind.
    - name: Forecasting
      contains: Your original budget, the projected final cost, the gap between them, and an estimated finish date based on the schedule index.
    - name: To-complete performance index
      contains: The efficiency your team needs on the remaining work to finish within budget.
    - name: Corrective Actions
      contains: Short suggestions on what to change, based on where the project is trending over or behind.
