headline: Project Gutenberg book text finder
subhead: Share a title, author, or Project Gutenberg book number. It searches the catalog and retrieves a suitable text or ebook file. You get book details and readable text, with format limits shown. Live use needs Python and internet access; check reuse rights for your country.
you_give:
  - A title, author, or book number, desired language or format, and a folder for downloads.
you_get:
  - Book metadata, available files, extracted text, and a fiction or nonfiction classification where useful.
how_it_works:
  - title: Find the right book
    text: Search the catalog or read the chosen book record and available formats.
  - title: Retrieve readable text
    text: Prefer plain text, check for unexpectedly short files, and use an ebook format when needed.
  - title: Report the extraction
    text: State the source, retrieved format, text limits, and any uncertain classification. Keep original files for provenance.
