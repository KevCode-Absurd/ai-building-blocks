thinking: medium
thinking_why: It decides what is worth saving and files it.
new_slug: project-memory-keeper
name: Project memory keeper
summary: Keep project memory notes for your codebase. Your AI saves decisions, design and coding rules in a notes folder that any AI can read later.
job: build-software
headline: Project memory keeper
subhead: A folder of plain notes inside your project that records what it is, why choices were made and how code should be written. Any AI that can read files can pick it up later.
explain: |
  A folder of plain notes inside your project that records what it is, why choices were made and how code should be written. Any AI that can read files can pick it up later.

  The skill sets up a hidden folder of Markdown files for architecture, decisions and conventions, with scopes for each part of a monorepo. After a change it syncs the notes, records new decisions with the alternatives you rejected, and audits the folder for stale entries. It can also compress old notes to save space and answer questions from them. It is not a diary or a changelog. It keeps the context that normally lives in one person's head.
when:
  - You keep re-explaining the same project decisions to your AI.
  - The one person who knows why things were built that way might leave.
  - You work in a monorepo and different parts need different rules.
  - You want notes that work across several AI coding tools.
not_for:
  - "You want a log of every change: use your git history or a changelog file, since this keeps only lasting decisions."
  - "You only need your AI tool to scan a new project once: use its own built-in setup command."
  - "You want to shrink a long chat: use your AI tool's own compact command, since this works on project notes only."
you_give:
  - Access to your project folder
  - Decisions or conventions to record (optional)
  - The change you just made, for syncing notes (optional)
you_get:
  - A notes folder of architecture, decisions and conventions
  - Updated notes after each change
  - Audit of stale or missing entries
  - Compact versions for quick loading
how_to_use:
  - Open your AI coding tool in your project folder. This skill needs a tool that can read and write files.
  - Add the skill to your tool, or paste its instructions into the chat.
  - Say "lore init". It creates the .lore folder in your project and asks which AI tools you use.
  - After you change something, say "lore sync" or "record this decision in lore". Check the new note before you keep it.
  - After a batch of changes, say "lore mirror" to refresh your tool's file. Then point your AI tool at .lore/SUMMARY.md.
  - Now and then, say "lore audit" to find notes that are out of date.
output_sample:
  input:
    - Your project folder, which your AI can read and write
    - A decision or coding rule to record (optional)
    - The change you just made, so notes can be synced (optional)
    - The AI tools you use, so the right mirror files are made (optional)
  prerequisites:
    - An AI that can read and write files in your project, such as a coding assistant
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: .lore/ folder
      contains: Plain Markdown notes at the project root, split by layer, with a summary file the AI reads first.
    - name: Architecture entries
      contains: Short lines on what the project is and how it is shaped, each with an ID and date.
    - name: Decision entries
      contains: Short lines on what was chosen over other options, with the reason and the date it was added.
    - name: Convention entries
      contains: Short lines on how code should be written and what to avoid.
    - name: Audit result
      contains: A list of notes that look stale, wrong or missing, checked against the current project.
    - name: Compressed notes
      contains: Shorter versions of old notes, so your AI can load them quickly.
    - name: Platform mirror
      contains: A refreshed file for your AI tool, such as CLAUDE.md, that points to the notes.
