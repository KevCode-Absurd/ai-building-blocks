thinking: high
thinking_why: It weighs risk across several projects at once.
new_slug: project-risk-portfolio
name: Project risk and portfolio manager
summary: Score project risks by cost, balance your team's workload and get a status report leaders read in two minutes. A project risk and portfolio manager.
job: plan-strategy
headline: Project risk and portfolio manager
subhead: "A clear picture across all your projects: which risks cost the most, where people are overloaded and which projects need attention first. You end with a status report leaders can read in two minutes."
explain: |
  A clear picture across all your projects: which risks cost the most, where people are overloaded and which projects need attention first. You end with a status report leaders can read in two minutes.

  The skill scores each risk by expected money impact, which is probability times cost. For schedule risk it gives best, likely and worst estimates you can feed into a simulation tool; no script here runs the simulation. It ranks competing projects using methods such as WSJF, RICE or MoSCoW, and checks team capacity against what is planned. Each project gets a health score on several dimensions and a red, amber or green status. A responsibility matrix clarifies who decides what. It suits large, multi-team work.
when:
  - You manage several projects and must decide which gets people first.
  - Leaders ask for a status report and you have a pile of updates.
  - You need to put a dollar figure on project risks.
  - Dependencies between teams are causing surprises.
not_for:
  - "You run one small project or a single team's task list: a plain status update or a simple checklist is enough."
  - "You need a project plan for one launch with dates and tasks: ask a project manager or use a simple plan in a spreadsheet."
  - "You want live data from Jira or Confluence: those links need access and setup first, so paste your updates in by hand."
you_give:
  - List of projects with budget, dates and owners
  - Known risks with rough odds and impact
  - Team capacity and assignments
  - Audience for the report (optional)
you_get:
  - Risk register with expected cost
  - Priority ranking of projects
  - Resource load check
  - Health scores and status colours
  - Executive summary
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. If you can upload files, add the skill folder too.
  - "Gather first. For each project: name, status, priority, budget, start and planned end dates, and team. For each risk: title, category, owner, the project it affects, and a 1 to 5 rating for likelihood and for impact. Add the chance as a percent and the cost in money only if you know them. For each person: role, hours available and current workload. The sample file assets/sample_project_data.json shows the full layout."
  - Paste your project list, risks, team capacity and who the report is for. Mark anything you don't know as unknown. Do not guess odds or costs to fill gaps, or the expected-cost figures will look measured when they are not.
  - Ask for the risk register first, then the priority ranking, then the executive report.
  - If you want the health scores from the scripts, use an AI that can run code and upload your project data file.
  - Treat the benchmark targets, status colour cut-offs, health-score weights and risk formulas as starting examples. Replace them with your own rules before you share the report. Any score from the scripts is only as good as the data you give them.
  - Use the executive summary as your status update. Pair it with the Status report writer, and use the Product strategy canvas writer to decide which project gets people first.
next: [status-report-writer, people-risk-register-builder, product-strategy-canvas-writer]
output_sample:
  input:
    - Your list of projects with budget, dates and owners
    - Known risks with rough odds and cost if they happen
    - Your team's capacity and who is assigned where
    - Who will read the report (optional)
  prerequisites:
    - An AI that can run code, if you want the scripts to run on a data file
    - Your project data in the format the skill expects (a JSON file)
  output:
    - name: Portfolio health scores
      contains: A score for each project on several dimensions, with a red, amber or green status.
    - name: Risk register
      contains: Each risk scored by expected cost, which is the odds times the cost, with the top ones first.
    - name: Schedule risk estimates
      contains: Best, likely and worst duration estimates for key tasks, ready for a simulation tool. The scripts here do not run the simulation.
    - name: Priority ranking
      contains: Your projects ranked with a method such as WSJF, RICE or MoSCoW.
    - name: Resource capacity check
      contains: Where people are overloaded or free, compared with what is planned.
    - name: RACI matrix
      contains: A table showing who is responsible, accountable, consulted and informed for each task.
    - name: Executive report
      contains: A short status report with colours, risks, spend, capacity and next steps for leaders.
