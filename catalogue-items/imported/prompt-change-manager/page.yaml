thinking: medium
thinking_why: It sets up process and tracks changes.
new_slug: prompt-change-manager
name: Prompt change manager
summary: Set up prompt versioning, tests and rollback for AI features already live. Get a prompt registry, eval plan and safe deploy steps for your team.
job: set-up-ai
headline: Prompt change manager
subhead: "Treat your prompts like code: saved, versioned, tested and safe to roll back. A wording tweak that quietly breaks a feature gets caught before users see it."
explain: |
  Treat your prompts like code: saved, versioned, tested and safe to roll back. A wording tweak that quietly breaks a feature gets caught before users see it.

  The skill starts by asking how prompts are stored now, how many are live, and whether a change has ever caused a regression. It then sets up a registry with version history, an evaluation set that runs on every change, A/B tests with clear pass rules, and a deploy path with rollback. Ownership is spelled out for each prompt. It fits teams running AI features in production, not people writing one-off prompts.
when:
  - A prompt edit broke something and users noticed first.
  - Prompts are hardcoded across your codebase and nobody knows what is live.
  - You want to A/B test a new prompt without guessing.
  - Several people edit prompts and you need order.
not_for:
  - "You want to write or improve one prompt: ask your AI to rewrite it directly, or use a prompt-writing guide, since this plan is for managing many live prompts."
  - "You want to cut AI costs: compare cheaper models or plans on your own, as this plan only covers quality checks and change control."
  - "You have no AI feature live yet: write and try your first prompt by hand, then come back once real users depend on it."
you_give:
  - How prompts are stored today
  - Number of production prompts
  - AI provider and frameworks in use
  - Main pain point such as versioning or testing
  - Team size
you_get:
  - Prompt registry design
  - Versioning rules
  - Evaluation pipeline plan
  - A/B test and rollback process
how_to_use:
  - Open your AI chat and paste this skill. Use an AI that can write files and code.
  - List your live prompts in a table. Add the owner and the model for each one.
  - Answer the questions your AI asks about storage, team size, tools and your biggest pain.
  - "Work through your first week in this order: list your prompts, pick one prompt, write a starter set of 10 golden pairs (an input and the answer you expect), run the test runner once, then record the pass rate. The skill needs at least 20 pairs for basic cover, so grow the set to 20 or more before you trust the result."
  - "Then pick a mode for the rest: build the registry, build the tests, or plan how changes get approved."
  - Review the plan. Fill the golden set with real inputs and have an expert check the expected answers.
  - Next, run the tests in your build pipeline so every prompt change is checked. Then watch live prompt quality over time. The skill's Related Skills section names a pipeline builder and a monitoring designer for these. They are not in this library, so ask your AI to do these steps.
  - If you run the tests, you need an API key. Each test example calls your AI provider, so token costs apply.
output_sample:
  input:
    - How your prompts are stored today
    - How many prompts are live
    - Your AI provider and tools (optional)
    - Your main pain point, such as versioning or testing
    - Your team size and who owns prompts
  prerequisites:
    - An AI chat that can write files, YAML and code, to build the registry and test runner
    - An API key for your AI provider if you run the tests yourself, as each test example is a paid call
  output:
    - name: Registry design
      contains: A folder layout and a registry file that lists each prompt, its owner, model, versions and status.
    - name: Eval pipeline plan
      contains: Test types for each prompt, a golden set outline and pass thresholds for your use case.
    - name: Golden dataset template
      contains: A set of input and expected answer pairs, with edge cases, that define correct behavior.
    - name: Governed iteration workflow
      contains: The steps from branch to test, review, promote and monitor, with a gate at each stage.
    - name: A/B test setup
      contains: How to assign users to versions, which results to log and the success measure to set first.
    - name: Rollback playbook
      contains: How to restore the last good version and re-run tests to confirm it works.
    - name: Governance policy
      contains: A team document on who owns each prompt, who reviews changes and what must pass before launch.
