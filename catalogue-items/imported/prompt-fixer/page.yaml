thinking: medium
thinking_why: It tries known prompt fixes and picks what fits.
new_slug: prompt-fixer
name: Prompt fixer
summary: Fix a prompt that gives vague or uneven answers. Paste it in with one bad reply and get a tighter version that works more reliably.
job: set-up-ai
headline: Prompt fixer
subhead: A prompt that stops giving vague, wrong or uneven answers. You hand over the weak one and get back a tighter version that behaves the same way run after run.
explain: |
  The skill first diagnoses what is wrong: too vague, no output format, made-up facts, inconsistent runs or too long. Each problem has a matching fix, such as adding context, naming the format, telling the model to say when it is unsure, or adding examples. It then rebuilds the prompt with role, situation, constraints, instructions and target output. It can also trim wasted words to cut token use, and adapt the prompt when it works on one model but fails on another.
when:
  - Your prompt gives different answers each time you run it.
  - You need clean, structured output such as JSON and keep getting messy text.
  - The AI states wrong things with confidence.
  - Your prompt is long and costly and you want it shorter.
not_for:
  - You need live facts or data lookups. Add a search or fact-checking step first, then fix the prompt.
  - You have no prompt yet and want to write one from scratch. Describe the task to your AI and ask for a first draft.
  - The bad answers come from missing facts, not wording. Give your AI the facts to use, or ask a subject expert.
you_give:
  - The weak prompt
  - An example of a bad answer
  - What a good answer looks like
  - Which AI model you use (optional)
you_get:
  - Diagnosis of what is wrong
  - Rewritten prompt
  - Why each change helps
  - Tips to test it
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text first. Then paste your weak prompt and one bad answer it gave.
  - "Ask for the diagnosis as a table: the problem, the proof from the bad answer, and the fix. Then ask for the rewritten prompt in a code block."
  - Run the new prompt on five different inputs. Include one odd or empty input.
  - Note which answers still fail. Paste those back and ask your AI to fix the prompt again.
output_sample:
  input:
    - Your weak prompt
    - One example of a bad answer
    - What a good answer looks like (optional)
    - Which AI model you use (optional)
  output:
    - name: Diagnosis
      contains: The problem found in your prompt, such as too vague, no format, made-up facts, uneven runs or too long.
    - name: Rewritten prompt
      contains: Your prompt rebuilt with a role, the situation, rules, clear instructions and the shape of the answer.
    - name: Why each change helps
      contains: A short reason for every edit, so you can keep what works and drop the rest.
    - name: Testing tips
      contains: A checklist to try the new prompt on varied inputs, including odd or empty ones.
