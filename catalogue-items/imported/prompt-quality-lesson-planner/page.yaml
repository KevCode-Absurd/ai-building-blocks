thinking: medium
thinking_why: It builds paired prompts that show the difference.
new_slug: prompt-quality-lesson-planner
name: Prompt quality lesson planner
summary: Plan a prompt quality lesson. Students compare vague and clear prompts for your subject and see why detail changes what AI writes back.
job: teach-and-train
headline: Prompt quality lesson planner
subhead: A short sequence of lessons where students see for themselves why a detailed prompt beats a vague one. They stop treating AI as a black box and start asking better questions.
explain: |
  A short sequence of lessons where students see for themselves why a detailed prompt beats a vague one. They stop treating AI as a black box and start asking better questions.

  You give the subject, year group and what students use AI for. The skill builds a prompt anatomy lesson, then a compare-and-contrast activity with a vague prompt next to a refined one. A pricing exercise has students judge what extra detail is worth. A rewriting task lets them fix weak prompts, and a summary card lists the principles. Examples fit your subject, and you can focus on context, limits, format, role or iteration.

  The research papers named in the skill, and its credit for the pricing exercise to Kharbach, come from the original author. We have not checked them against the originals.
when:
  - Students paste a single line into AI and accept whatever comes back.
  - You want a lesson on AI literacy that uses real subject tasks.
  - You teach writing or research and want better student prompts.
  - You need a ready activity showing why wording changes results.
not_for:
  - You need students to write assessed work on their own. Use this for practice only, and set that task with no AI.
  - You want to teach what AI is or how it works. Plan that lesson yourself or write your own short talk first.
  - You need one single lesson plan for a full class period. This builds a short sequence, so trim it by hand to fit.
you_give:
  - Subject area
  - Year group and AI habits
  - What students use AI for
  - Prompt skill to focus on (optional)
  - Common student prompts (optional)
you_get:
  - Lesson sequence
  - Vague versus refined prompt examples
  - Rewriting activity
  - Student summary card
how_to_use:
  - Open Claude, ChatGPT or Gemini. You do not need code, files or a paid tool.
  - Paste the full text of SKILL.md into the chat.
  - Add your subject, your students' year group and habits, and what they use AI for. Add the optional details if you have them.
  - Ask your AI to build the prompt literacy sequence.
  - Check that the examples fit your subject. The results are what the skill should produce, not tested runs, so read them before class.
  - Check every fact the skill writes, such as dates, figures and named treaties, against your course textbook before you use it in class.
  - Use the rewritten prompts for practice only. Do not use them to produce coursework that students submit.
output_sample:
  input:
    - Your subject area
    - Your students' year group and how they use AI now
    - What students use AI for, such as research or essay help
    - The prompt skill to focus on (optional)
    - Vague prompts your students often type (optional)
  output:
    - name: Prompt Anatomy
      contains: The parts of a good prompt, such as context, task, limits, format and role, with examples from your subject.
    - name: Compare-Contrast Activity
      contains: A vague prompt beside a refined one, with questions that help students spot what changed in the answer.
    - name: The Pricing Exercise
      contains: A task where students judge what each extra piece of detail is worth, so they see when it pays off.
    - name: Prompt Rewriting Activity
      contains: Weak prompts for students to fix, with guidance on what a better version should include.
    - name: Prompt Principles Summary Card
      contains: A short card listing the main rules of a good prompt for students to keep.
