thinking: medium
thinking_why: It works through five set phases with a score check at each.
new_slug: proof-of-concept-plan
name: Pre-sales proof of concept planner
summary: "Plan a sales proof of concept before you reply to a buyer's request. Get a fit score, must-have gaps, a rival table and a trial plan."
job: sell-and-negotiate
headline: Pre-sales proof of concept planner
subhead: "Give it a buyer's requirements list and what your product can do. It scores how well you fit, lists the gaps, compares you with rivals and plans a trial with clear success checks."
explain: |
  A buyer sends a long requirements list. Do you reply, and if you do, how do you run a trial that wins? This pre-sales proof of concept planner answers both. It starts with a fit score, so you know early if the deal is worth the effort.

  You give the buyer's requirements and what your product does. It marks each requirement as full, partial, planned or a gap, and weights the must-haves most. It counts the must-have gaps and gives one call: bid, bid with a plan, or no bid. It then builds a feature table against your rivals and plans the trial in phases.

  The cut-offs are the original author's defaults, and you can change them. You can run it by hand in chat or with the included scripts if your AI can run code.
when:
  - A buyer sends a long requirements list or RFP and you must decide whether to reply.
  - You need a table that shows how you compare with rivals.
  - A customer asks for a trial and you need clear success checks.
  - You are preparing a technical proposal or a demo script.
not_for:
  - "The buyer has already chosen you and wants a contract: use the proposal or contract tools instead."
  - "You have no feature list for your product to compare with the buyer's list: write that list first, or the score means nothing."
  - "You want the written RFP answers themselves: use the RFP response builder."
  - "You want a plan for one competitor in one deal: use the Deal competitor playbook builder."
you_give:
  - The buyer's request or requirements list
  - What your product does and what it does not do yet
  - Rivals the buyer may be looking at (optional)
  - The buyer's technical setup, such as their systems and tools (optional)
  - How long the trial can run (optional)
you_get:
  - A fit score from 0 to 100 percent
  - The count of must-have gaps
  - A bid, bid with a plan, or no bid call, with the reason
  - A feature table against each rival
  - A phased trial plan with success checks and a scorecard
how_to_use:
  - Open Claude, ChatGPT or Gemini. For scoring by script, use one that can run Python and read files. In plain chat, it does the sums by hand.
  - Paste the skill text into the chat.
  - "Under it, paste the buyer's requirements and a list of what your product does and does not do."
  - Read the fit score and bid call first. If the call is no bid, decide whether to still reply.
  - Check the gap list. Each gap says whether to build, partner or leave it out. Make sure each must-have gap has a plan before you go on.
  - Use the trial plan and scorecard in your meeting with the buyer. Fill in the scorecard as the trial runs.
output_sample:
  input:
    - The buyer's requirements list or RFP text
    - What your product does and its gaps
    - Rivals the buyer may consider (optional)
    - The buyer's technical setup (optional)
    - Trial length (optional)
  prerequisites:
    - An AI that can run Python, if you want the included scripts to do the scoring (optional)
  output:
    - name: Fit score
      contains: The weighted share of requirements you meet, and the count of must-have gaps.
    - name: Bid call
      contains: Bid, bid with a plan, or no bid, with the reason.
    - name: Gap list
      contains: Each must-have gap, with a way to close it by building, partnering or declining.
    - name: Rival feature table
      contains: Your product against each rival, scored feature by feature, with differentiators and weak spots.
    - name: Trial plan
      contains: Set-up, core testing, advanced testing and review phases, each with a success check.
    - name: Trial scorecard
      contains: Five weighted areas to score as the trial runs, to support the go or no-go call.
    - name: Next steps
      contains: Three actions, each with an owner.
how_it_works:
  - title: Score the fit
    text: It marks each requirement full, partial, planned or gap. Must-haves count three times, should-haves twice.
  - title: Make the bid call
    text: One rule sets the call, based on the fit score and the must-have gap count. Low-value deals with a weak fit become no bid.
  - title: Compare with rivals
    text: It scores each feature for you and for each rival, then lists where you stand out and where you are weak.
  - title: Plan the trial
    text: It sets phases for set-up, core testing, advanced testing and review, with a success check before each move on.
  - title: Prepare the demo
    text: It makes sure the demo covers every must-have requirement, with talking points per role.
  - title: Score and propose
    text: It builds a scorecard, then a technical proposal from the results.
output_shape: |
  FIT SCORE: <percent>   MUST-HAVE GAPS: <count>
  CALL: <bid | bid with a plan | no bid> <reason>

  GAP LIST
  - <requirement>: <build | partner | decline>

  RIVAL TABLE
  | Feature | You | <Rival> | <Rival> |

  TRIAL PLAN
  <phase>: <what happens>, success check <check>

  SCORECARD (weighted)
  <area>: <weight>

  NEXT STEPS
  1. <action> (owner)

  MISSING
  - <anything you did not give>
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: It scores by hand in plain chat. An AI that runs Python can use the included scripts for the sums.
  inputs:
    - The buyer's requirements as a list or spreadsheet
    - A written list of what your product does and does not do
terms:
  - term: Proof of concept
    meaning: A short trial where the buyer tests your product on their own use case before they buy.
  - term: Must-have
    meaning: A requirement the buyer will not buy without.
  - term: Coverage score
    meaning: The weighted share of the buyer's requirements your product meets.
  - term: RFP
    meaning: A request for proposal, a document a buyer sends to vendors listing what they need.
