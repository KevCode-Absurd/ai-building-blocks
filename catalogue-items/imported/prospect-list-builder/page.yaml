thinking: medium
thinking_why: It sets filters, then qualifies each lead.
new_slug: prospect-list-builder
name: Prospect list builder
summary: Build a prospect list of accounts that fit your ideal customer, with the reason each one fits, a score and a check on every email.
job: sell-and-negotiate
headline: Prospect list builder
subhead: A list of accounts that really fit your ideal customer, with the reason each one made the cut. You can start outreach without sorting through junk contacts.
explain: |
  A list of accounts that really fit your ideal customer, with the reason each one made the cut. You can start outreach without sorting through junk contacts.

  You describe your ideal customer, and the skill picks the right path: software companies, general B2B, local small businesses or early customer discovery from public complaints. It finds accounts, looks for buying signals such as job changes or hiring, enriches the data, and verifies emails before anything goes to a sequence. Accounts are scored and sorted into tiers. It uses licensed data and never scrapes LinkedIn. Each account can get a short research note.
when:
  - You are starting outbound and need your first 100 targets.
  - You want to reach companies that show signs they are ready to buy.
  - You sell to local shops and need nearby leads.
  - Your last list had bad emails and bounced.
not_for:
  - "You need the emails, copy or follow-ups for outreach: use the cold-email skill, since this one only builds the list."
  - "You want to study rival companies: use the competitor-profiling skill instead."
  - "You need a list from LinkedIn scraping: this skill will not do that, so use Sales Navigator and a licensed data tool."
you_give:
  - Description of your ideal customer
  - What you sell and who it helps
  - Region or industry
  - How many leads you want (optional, default 25)
  - Data tools you have access to (optional)
you_get:
  - Qualified account list
  - Fit reason for each account
  - Verified contacts
  - Tier or score for each lead
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill instructions into a new chat.
  - Describe your ideal customer in a few lines, what you sell, your region or industry, and how many leads you want (default 25, or 15 for local shops).
  - Say which data tools you have, such as Apollo, ZoomInfo or Clay. These need a paid account or API key. With none, your AI can still research in the browser, but only if it has web access.
  - For early customer discovery, your AI reads only public pages such as forums, review sites, job posts and open issue threads. It cites each one and does not bulk-scrape platforms. Tools like Firecrawl or Browserbase read one company's own site and need a paid account.
  - Read the lead table. Check the fit reason and confidence on each row.
  - "Verify every email before it goes into a sequence. Sources: licensed data and public pages are fine, and LinkedIn scraping is never used."
output_sample:
  input:
    - Your ideal customer in a few lines
    - What you sell and who it helps
    - Your region or industry
    - The data tools you already use (optional)
  prerequisites:
    - An AI that can browse the web gives the best results
    - Paid data tools like Apollo, ZoomInfo, Clay or an email checker are optional and need an account or API key
  output:
    - name: Lead sheet
      contains: A table of accounts with score, company, contact, why it is a prospect, source, confidence and last verified date.
    - name: Top outreach targets
      contains: The top 3 to 5 hot leads, each with one sentence on why to reach out first.
    - name: CSV file
      contains: The same lead sheet as a file, when the list has more than 25 rows or you ask for one.
    - name: Evidence report
      contains: "For early customer discovery only: public complaints and pain signals instead of a lead table."
next: [cold-email-writer, prospect-outreach-drafter]
