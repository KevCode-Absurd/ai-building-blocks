thinking: low
thinking_why: It reads the diff and fills a fixed layout.
new_slug: pull-request-description-writer
name: Pull request description writer
summary: Write a pull request description from your committed branch. It says what changed, why, and what reviewers should check, then opens a draft on GitHub.
job: build-software
headline: Pull request description writer
subhead: A pull request description that tells the reviewer what changed, why, and what to look at first. It is written from your actual committed changes, not from memory.
explain: |
  A pull request description that tells the reviewer what changed, why, and what to look at first. It is written from your actual committed changes, not from memory.

  The skill checks that everything is committed, finds your base branch with the GitHub command line tool, then reads the commit log and full diff. It works out the purpose of the whole branch and writes a structured description covering what changed, the reason and any context a reviewer needs, such as risks and links to issues. It then opens the pull request through GitHub. You need the GitHub CLI installed and signed in.
when:
  - Your branch is ready and you dread writing the description.
  - Reviewers keep asking why a change was made.
  - The branch has many commits and you need one clear summary.
  - You want a repeatable way to open pull requests.
not_for:
  - "Your repo has a pull request template you must keep: fill the template by hand, because this skill ignores repo templates."
  - "Your change is one line or a typo fix: write a short pull request yourself, it is faster."
  - "You have uncommitted work: commit it first, then run this."
you_give:
  - A committed branch
  - GitHub CLI signed in
  - Linked issue or ticket (optional)
  - Anything reviewers should know (optional)
you_get:
  - Pull request title and body
  - Summary of what changed and why
  - Reviewer notes
  - The opened pull request
how_to_use:
  - Commit all your changes on your branch. If you have loose changes, commit them first.
  - Check that GitHub CLI is installed and signed in. Your AI needs to run git and gh commands, so use a tool that can run code.
  - Paste this skill into your AI and ask it to write the pull request for your branch.
  - Add your issue or ticket link and any notes for reviewers (optional).
  - Read the title and description it writes. Check that the reason for the change is right.
  - Let it open the draft pull request, then mark it ready when you are happy.
output_sample:
  input:
    - A branch with all changes committed
    - GitHub CLI installed and signed in
    - A linked issue or ticket (optional)
    - Notes reviewers should know (optional)
  prerequisites:
    - An AI that can run git and GitHub CLI commands
    - GitHub CLI (gh) signed in to your account
    - All changes committed before you start
  output:
    - name: Branch check
      contains: A check that changes are committed and which branch your pull request will be compared against.
    - name: Change review
      contains: A read of the commit log and full diff to work out the purpose of the whole branch.
    - name: Description body
      contains: What the change does, why it is needed, other options considered, and any context reviewers need.
    - name: Pull request title
      contains: A short title in the commit style, such as type, scope and a plain description.
    - name: Issue references
      contains: Links to related issues or tickets, written so they close or only link when merged.
    - name: Draft pull request
      contains: The pull request opened on GitHub as a draft, using the title and body above.
