thinking: medium
thinking_why: It reads the diff and judges risk.
new_slug: pull-request-risk-reviewer
name: Pull request risk reviewer
summary: Review a pull request for risk. Get issues ranked by severity, security findings and review comments you can post before you merge.
job: test-and-fix-code
headline: Pull request risk reviewer
subhead: A review of a pull request that tells you what could break, what is unsafe and what to fix first. Findings come ranked, with comments you can paste straight into the review.
explain: |
  A review of a pull request that tells you what could break, what is unsafe and what to fix first. Findings come ranked, with comments you can paste straight into the review.

  The skill pulls the diff and details using the GitHub or GitLab command line. It traces the blast radius: which files, services and users the change could affect. It scans for security problems such as injection, broken auth and exposed secrets, spots breaking changes in APIs and database schemas, and compares new code with new tests. It also checks for slow queries and links the ticket to the scope. A checklist of 30 or more items backs the report.
when:
  - A big pull request touches shared code or the database.
  - A new contributor sent a change and you want thorough feedback.
  - The change affects login, payments or personal data.
  - You want a second reader before merging.
not_for:
  - "You changed only style or wording, with no shared code: run a linter and do a quick read yourself."
  - "You have no way to run gh or glab, and no diff to paste: ask a teammate for a review instead."
  - "You want a fix written for you: ask your AI to change the code. This only reviews it."
you_give:
  - Your pull request number, or its diff
  - Your Jira or Linear ticket link (optional)
  - Your Jira or Linear access token, only for the ticket check (optional)
  - Areas you worry about (optional)
you_get:
  - Findings ranked by severity
  - Security notes
  - Breaking change warnings
  - Test coverage gap
  - Ready-to-post review comments
how_to_use:
  - Use an AI that can run commands on your computer. Install the gh tool for GitHub or glab for GitLab, and sign in.
  - Check out the pull request branch on your machine.
  - Paste this skill into your AI. Give it the pull request number.
  - Add the ticket link and token if you want the ticket check. Set the token on your machine. Do not paste it in the chat.
  - Read the MUST FIX list first. Post those comments on the pull request.
  - After the author updates the pull request, run the review again before you approve.
output_sample:
  input:
    - Your pull request number, or its diff
    - Access to the GitHub or GitLab command line, signed in
    - Your Jira or Linear ticket link (optional)
    - Your Jira or Linear access token, only for the ticket check (optional)
  prerequisites:
    - An AI that can run commands on your computer, with the gh or glab tool installed and signed in
    - The pull request branch checked out on your machine
  output:
    - name: Summary header
      contains: Blast radius level, security finding count, test coverage change and any breaking changes found.
    - name: MUST FIX (Blocking)
      contains: Problems that should stop the merge, with file and line, the risk and a suggested fix.
    - name: SHOULD FIX (Non-blocking)
      contains: Real issues that can wait, such as a missing permission check, each with a short note.
    - name: SUGGESTIONS
      contains: Smaller improvements, such as a slow query pattern, with a way to fix it.
    - name: LOOKS GOOD
      contains: Specific things the change does well, such as solid tests or a safe rollback.
    - name: Review checklist
      contains: A checklist of more than 30 items covering scope, blast radius, security, tests, breaking changes and speed.
