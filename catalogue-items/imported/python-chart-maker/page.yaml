new_slug: python-chart-maker
name: Python chart maker
summary: Turn your data into a clean Python chart. Get Matplotlib code and a saved image, or an animated or interactive plot, ready for a report.
job: work-with-files
headline: Python chart maker
subhead: A clean chart from your data, saved as an image or built as an animated or interactive plot. You get tidy labels, sensible colours and the right chart for the numbers.
explain: |
  You do not have to write any plotting code. Give your AI your numbers and say what the chart should show. It writes the Python, runs it and hands you the chart file. Steps for running the code yourself are below, in case your AI cannot run it.

  The skill writes Matplotlib code for line, scatter, bar, histogram, heatmap, contour and 3D plots, and for grids of several panels. It uses the object-based Figure and Axes style for control, with the quick pyplot style as an option. It tunes colours, labels, legends and layout, then exports to PNG, PDF or SVG at print quality. It also fits charts into notebooks or desktop apps. You need Python with Matplotlib installed.

  Licence: the skill text is from the K-Dense collection, shared in the sickn33 collection under CC BY 4.0 (LICENSE-CONTENT). The helper scripts and reference files bundled with it keep their own MIT licence (UPSTREAM-LICENSE.txt). The skill file's header links to the licence of the Matplotlib library itself, which is a separate matter.
when:
  - You have a spreadsheet of results and need a figure for a paper or report.
  - You want several related charts in one tidy grid.
  - A default plot looks messy and needs cleaning up.
  - You need a vector file for print or slides.
not_for:
  - "You need a live dashboard or web app: use a tool built for dashboards, since this makes still images and plots from Python code."
  - "You cannot run Python: use the chart tools built into Excel or Google Sheets."
  - "You only have a few numbers and want a quick bar chart: a spreadsheet's chart button is faster."
you_give:
  - Your data (CSV, table or numbers)
  - The chart type you want, or the question it should answer
  - Size, colours or style needs (optional)
  - Output format
you_get:
  - Python plotting code
  - A saved chart file
  - Styled labels and legend
  - Multi-panel layout if needed
how_to_use:
  - Open your AI tool and paste the skill text, or upload the skill folder. Pick one that can run Python code and save files, such as Claude with code running turned on. If yours cannot run code, ask it for the Python script and run the script on your own computer.
  - "Cost: code running in Claude, ChatGPT and Gemini depends on your plan and its limits, so check your plan first. Python and Matplotlib are free, so running the script yourself costs nothing. No API key is needed."
  - Add your data as a CSV file or pasted table. Say which chart you want, or what question it should answer.
  - "Say which file type you want: PNG for slides, PDF or SVG for print."
  - Open the saved chart and check the labels, colours and numbers. Ask for changes until it looks right.
  - If the code gives an error, paste the error message back into the chat and ask for a fix. The skill's common issues reference covers the usual ones.
  - Put the saved chart into your report or slides, and keep the style file so later charts match.
output_sample:
  input:
    - Your data as a CSV file, a table or pasted numbers
    - The chart type you want, or the question the chart should answer
    - Size, colours or style needs (optional)
    - The file type you want to save, such as PNG, PDF or SVG
  prerequisites:
    - An AI that can run Python code and save files
    - Python with Matplotlib installed
  output:
    - name: Plotting code
      contains: A Python script using the Figure and Axes style that draws your chart from your data.
    - name: Saved chart file
      contains: Your chart saved as a PNG, PDF or SVG, with tight margins and a white background.
    - name: Styled labels and legend
      contains: Axis labels, title, legend and colours set so the chart reads clearly.
    - name: Multi-panel layout
      contains: A grid of several charts in one figure, made only when you ask for more than one.
    - name: Style sheet (optional)
      contains: A reusable style file from the style helper, so later charts match.
