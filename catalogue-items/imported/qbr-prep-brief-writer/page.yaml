thinking: medium
thinking_why: It weighs mixed signs of how the account is doing.
new_slug: qbr-prep-brief-writer
name: QBR prep brief writer
summary: "Name a customer and get a QBR prep brief: a health read, risk signs, value delivered and a meeting agenda, from your CRM or pasted notes."
job: sell-and-negotiate
headline: QBR prep brief writer
subhead: Name a customer and get a plain read on how healthy the account is, plus a prep brief for the quarterly business review. The brief shows risk signs, the value you delivered, and a proposed agenda for the meeting.
explain: |
  Name a customer and get a plain read on how healthy the account is, plus a prep brief for the quarterly business review. The brief shows risk signs, the value you delivered, and a proposed agenda for the meeting.

  It pulls signals from your CRM, email, calendar and call notes, then compares this quarter with the last. It looks at deals, recent activity, support cases and how often you meet. Every number is shown with where it came from. Anything it cannot see, such as product usage held elsewhere, is marked as not visible instead of guessed. If you have no connected tools, a pasted account history works.
when:
  - A quarterly review with a key customer is due next week.
  - You want to know if an account is quietly going cold.
  - You need proof of value delivered before a renewal talk.
  - You are taking over an account and need a fast status.
not_for:
  - "You have a new prospect with no account history: review your open deals in your CRM, or ask a colleague for the background."
  - "You only need to know when a contract ends: check the renewal date in your CRM or contract."
  - "You want a sales deck or a pitch for a new buyer: write it by hand or with a general writing prompt, as this brief needs past account history."
you_give:
  - Customer name or ID
  - "Mode: health check or review prep"
  - CRM, email or call notes, or a pasted history (optional)
you_get:
  - Health read with risk signs
  - Value delivered this quarter
  - Trend against the last quarter
  - Meeting agenda and next steps
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Type the customer's name. Say if you want a health check or QBR prep.
  - If your AI is connected to your CRM, email and calendar, it reads them. If not, paste the account history or upload a file with the customer's row.
  - Check the health table first. Look at where each number came from.
  - Anything marked not visible was not available to your AI. Add it yourself before the meeting.
  - Review any suggested CRM updates. Apply the ones you agree with.
output_sample:
  input:
    - Customer name or ID
    - "Mode: health check (default) or QBR prep"
    - Your CRM, email, calendar or call notes, or a pasted account history (optional)
    - Period to compare, such as last quarter (optional)
  prerequisites:
    - An AI that can read your CRM, email and calendar gives the best result
    - Without those tools, paste the account history or upload a file with the customer's row
  output:
    - name: Verdict
      contains: One sentence on how healthy the account is, and the one or two things driving it.
    - name: Health table
      contains: Relationship, engagement trend, commercial, support and value delivery, each marked green, yellow or red with evidence.
    - name: Watch items
      contains: Each risk signal, why it matters and a suggested action.
    - name: Suggested CRM updates
      contains: Before and after values for any health or status fields, with the evidence for each.
    - name: Value delivered
      contains: Outcomes since the last review, in the customer's own metrics, with sources (QBR prep mode).
    - name: Adoption story
      contains: What is working and what is underused, using only facts your AI could see.
    - name: Open items
      contains: Escalations resolved or still open, and commitments from the last review.
    - name: Next phase
      contains: Expansion and renewal topics worth raising in the meeting.
    - name: Agenda and attendees
      contains: A proposed agenda, who should be in the room, and the asks for their leaders.
