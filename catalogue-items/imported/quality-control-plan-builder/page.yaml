thinking: medium
thinking_why: It uses standard charts and a fixed fix method.
new_slug: quality-control-plan-builder
name: Quality control plan builder
summary: "Turn your defect data into a quality control plan: control charts, ranked causes of defects, and steps to cut them. Needs counts or measurements."
job: plan-supply-chain
headline: Quality control plan builder
subhead: A quality plan built from your own defect data. You see control charts that show whether your process is stable, a ranked list of the biggest causes of defects, and a step-by-step plan to cut them.
explain: |
  It starts by asking what is going wrong, how bad the rates are, what a defect costs you, and how you inspect today. Then it applies standard quality methods: control charts, process capability, Pareto ranking and root cause tools. It tells you where you sit on the path from inspecting finished goods to preventing defects at the source. The plan sets targets and owners, so improvement does not stop at the report.

  Limits of this skill: charts and capability figures need enough stable data to mean anything. The sigma level and defect rate assume a normal spread, so treat them as estimates. The plan is a template. Check it against your own process and with a quality engineer before you rely on it for audits or customer promises.
when:
  - Returns or complaints are rising and you do not know the main cause.
  - You have defect counts and want to see if the process is in control.
  - You need to prepare for a customer audit or ISO review.
  - You want to move from sorting bad parts to stopping them early.
not_for:
  - "You need to check one batch only: use a simple inspection sheet or ask the supplier for a batch report."
  - "Your work is not manufacturing, such as a service or office process: map the steps with a person who runs it first."
  - "You want to cut waste and speed up flow, not defects: use lean-manufacturing or process-optimization, which are not in this library yet."
you_give:
  - Defect or inspection data
  - Description of your process
  - Target defect level (optional)
  - Current quality system or certification (optional)
you_get:
  - Control charts and stability read
  - Ranked list of main defect causes
  - Improvement plan with owners and targets
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick a mode that can run Python code, so the charts and numbers are real. Code running may depend on your plan. If your AI cannot run code, ask it for the Python script and run it yourself, or work the charts out in a spreadsheet.
  - Paste in the skill text, or upload the skill file.
  - "Paste your defect or inspection data. Have enough of it: about 20 to 25 subgroups or points in time order. Include these columns: date, subgroup, the measurement or defect count, and sample size. Add a few lines on your process and what a defect costs you."
  - Answer the questions your AI asks about your current checks and your target.
  - Read the control chart status first. Fix any one-off causes before you trust the capability numbers.
  - Pick the top item in the ranked causes. Give it an owner and a date.
  - Next, review the plan with a quality engineer. If you already run a quality system such as ISO 9001, fold the plan into it rather than running it on the side.
output_sample:
  input:
    - Your defect or inspection data, such as counts or measurements by date
    - A short description of your process
    - Your target defect level (optional)
    - Your current quality system or certification (optional)
  prerequisites:
    - An AI that can run code (Python) for the charts and capability numbers
  output:
    - name: Executive Summary
      contains: Your current quality level, the main problems found, the root causes and what to do first.
    - name: Process Capability Analysis
      contains: A table showing, for each quality measure, how well your process fits its limits.
    - name: Control Chart Status
      contains: For each process, whether it is stable, has a one-off cause, or is stable but not capable.
    - name: Pareto Analysis
      contains: Your defect types ranked from biggest to smallest, with each share of all defects.
    - name: Root Cause Analysis
      contains: The main, second and third causes behind the top defects.
    - name: Recommendations
      contains: Actions grouped as immediate, 30 days and 90 days.
    - name: Expected Benefits
      contains: Estimated gains, such as fewer defects and lower cost of quality, worked out from your own baseline and labelled as estimates, not promises.
