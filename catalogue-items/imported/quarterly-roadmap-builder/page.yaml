thinking: high
thinking_why: It weighs competing priorities and decides what to leave out.
new_slug: quarterly-roadmap-builder
name: Quarterly roadmap builder
summary: Give it your backlog and requests. Get a multi-quarter roadmap that
  balances build, improve and maintain, plus a not-doing list.
job: plan-strategy
headline: Quarterly roadmap builder
subhead: A multi-quarter roadmap you can defend in a room, plus the ranking work
  behind it. It balances new builds, improvements and upkeep, and ends with a
  list of things you are not doing and why.
explain: |
  A multi-quarter roadmap you can defend in a room, plus the ranking work behind it. It balances new builds, improvements and upkeep, and ends with a list of things you are not doing and why.

  You give it your goals, your backlog and your capacity. It works in five layers: themes tied to your goals, initiatives under each theme, how they rank, the dependencies between them, and how you share the plan. It pushes back if there is no strategy, because a roadmap without one is only a queue. Each item gets a reason, so a no or a not yet comes with an answer.
when:
  - You are planning the next quarter or the full year.
  - Some items depend on others and the order matters.
  - Stakeholders keep asking for features and you need a firm reply.
  - A missed quarter or new strategy means you must replan.
you_give:
  - Top goals or themes
  - Full backlog with one line each
  - Team capacity
  - Deadlines and constraints (optional)
you_get:
  - Roadmap by quarter and theme
  - Ranking with reasons
  - Dependency map
  - Not-doing list
  - Version for stakeholders
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
