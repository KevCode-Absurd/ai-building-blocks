job: check-contracts
headline: Quick legal sanity checker
subhead: "A one-minute answer to a quick legal question: fine, needs a look, or
  hold. You get one sentence of reasoning and, if it is not fine, the next
  step."
explain: |
  A one-minute answer to a quick legal question: fine, needs a look, or hold. You get one sentence of reasoning and, if it is not fine, the next step. It is not legal advice, and it does not replace your lawyer.

  It checks your question against a risk table your legal team has already set, covering what is usually just for information, what usually needs real work, and what usually blocks. Questions like using customer logos on a pricing page match quickly. If the question matches nothing, it says so instead of guessing. It also asks where the answer is going, so privileged advice does not leak into a wide channel.
when:
  - A teammate asks if they can use a customer logo on the website.
  - You need a fast call before sending a message that touches legal risk.
  - You want to know if a request needs a full legal review.
  - A product manager needs an answer before end of day.
you_give:
  - The question in one or two lines
  - Your risk table from the legal setup
  - Where the answer will be shared (optional)
you_get:
  - Fine, needs a look, or hold
  - One sentence of reasoning
  - Named next step when needed
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read your saved product legal setup notes.
  - Where the skill points to /product-legal:cold-start-interview, use the
    setup-interview folder inside it. We copied it in so the skill works on its
    own.
