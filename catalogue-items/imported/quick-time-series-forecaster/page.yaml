thinking: low
thinking_why: A pre-trained model does the forecast, so little judgment is needed.
new_slug: quick-time-series-forecaster
name: Quick time series forecaster
summary: Forecast your monthly sales or other numbers from a CSV. Get low and high ranges and a test on held-back data, with no model training.
job: track-numbers
headline: Quick time series forecaster
subhead: A forecast of your numbers with ranges around it, tested against data you held back, and no model training. You give it a CSV of past values and see how well it would have predicted what you already know.
explain: |
  A forecast of your numbers with ranges around it, tested against data you held back, and no model training. You give it a CSV of past values and see how well it would have predicted what you already know.

  The skill cleans the file into a regular time grid, then runs Google's TimesFM, a pre-trained forecasting model, that predicts without fitting to your data. You get a middle estimate plus low and high bands. It scores the forecast on the held-back period so you can judge trust before relying on it. It is not a tool for cause and effect. It needs Python, PyTorch and a one-time model download.
when:
  - You have monthly sales and want the next six months.
  - You need a forecast but have no time to build a model.
  - You want to see how reliable a forecast is before using it.
  - Your data has gaps or uneven dates that need tidying first.
not_for:
  - "You want to know what caused a change in your numbers: use a person who can run a proper test, because a forecast does not show cause and effect."
  - "You need a medical, clinical or physics-based forecast, such as weather or climate: use a specialist tool built for that field."
  - "You have not checked a simple baseline, such as repeating last year's values: do that first, then compare."
you_give:
  - CSV of past values with dates
  - How far ahead to forecast
  - Python with PyTorch installed
  - Extra driver columns (optional)
you_get:
  - Forecast with low and high ranges
  - Score on held-back data
  - Cleaned time series
  - Chart of past and predicted values
how_to_use:
  - Put your CSV in a folder with a date column and one or more number columns. Use one row per month, week or day, with no missing dates.
  - Open an AI that can run Python code, such as Claude with code tools. Share the skill and your CSV.
  - "Tell it the date column, the date step and how far ahead to forecast. For example: monthly dates, 12 months ahead."
  - "It checks your computer, downloads the model once, and runs a command like: python scripts/forecast_csv.py monthly_sales.csv --date-col date --freq MS --value-cols sales --horizon 12 --output forecasts.csv"
  - Open forecasts.csv. The columns are forecast, median, lower_80, upper_80, lower_60 and upper_60.
  - Check the held-back test and compare it with a simple baseline before you plan around the numbers. Treat the ranges as rough until checked on your own data.
output_sample:
  input:
    - Your CSV of past values, with a date column and one or more number columns
    - How far ahead you want to forecast
    - The date step, such as monthly or weekly
    - Extra columns that help explain the numbers (optional)
  prerequisites:
    - An AI that can run Python code
    - Python 3.10 or newer with PyTorch installed
    - Internet access and disk space for the one-time model download
  output:
    - name: forecasts.csv
      contains: The forecast, the median, and low and high ranges at 80% and 60% for each future date.
    - name: Metadata file
      contains: The forecast start date, date step, model version and settings used, saved next to the forecast.
    - name: Held-back test
      contains: How close the forecast would have been on recent data you kept hidden, so you can judge trust.
    - name: Cleaned time series
      contains: Your data on an even date grid, with gaps checked or filled only inside the history.
