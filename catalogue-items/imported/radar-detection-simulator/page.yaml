thinking: high
thinking_why: Debugging missed detections takes careful technical reasoning.
new_slug: radar-detection-simulator
name: Radar detection simulator
summary: Give it a radar datasheet. Get a simulated scene, fixes for missed
  detections and result plots.
job: build-software
headline: Radar detection simulator
subhead: A simulated radar scene built from your datasheet, with the detections
  it produces, plots, and fixes if some targets are missed. You can trust the
  result because it is checked against a hand calculation of what the radar
  should see.
explain: |
  A simulated radar scene built from your datasheet, with the detections it produces, plots, and fixes if some targets are missed. You can trust the result because it is checked against a hand calculation of what the radar should see.

  It sets up a radar data generator inside a radar scenario in MATLAB. From the specs it works out reference range through a link budget. It handles scan modes: mechanical, electronic and hybrid. It explains which coordinate frame each output is in, a common source of confusion. If your code misses detections, it checks configuration errors one by one. It is for detection-level work, not signal-level work. MATLAB with the toolboxes is needed.
when:
  - You have a radar datasheet and want to see what it would detect.
  - Your simulation misses targets and you do not know why.
  - You are comparing mechanical and electronic scanning.
  - You need detections to feed a tracker or sensor fusion test.
you_give:
  - Radar datasheet or performance needs
  - Target paths or scenario
  - MATLAB with the needed toolboxes
  - Existing radar code (optional)
you_get:
  - Working radar scenario code
  - Detections and coverage plots
  - Fixes for missed detections
  - Check against expected range
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run MATLAB with Radar Toolbox.
