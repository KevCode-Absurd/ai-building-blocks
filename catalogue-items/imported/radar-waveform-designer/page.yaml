thinking_why: Waveform choices trade off many technical limits.
new_slug: radar-waveform-designer
name: Radar waveform designer
summary: Give it radar or sonar needs. Get a chosen waveform, its settings and
  plots of how well it performs.
job: build-software
headline: Radar waveform designer
subhead: A radar or sonar waveform chosen for your needs, with its settings and
  plots showing how well it works. You see range resolution, sidelobes and how
  it copes with moving targets.
explain: |
  A radar or sonar waveform chosen for your needs, with its settings and plots showing how well it works. You see range resolution, sidelobes and how it copes with moving targets.

  You state what you need: range, resolution, speed, and whether it is radar, sonar or a combined sensor. The skill walks a decision tree to pick the waveform type, such as linear chirp, nonlinear chirp, FMCW, or phase-coded. It uses the matching MATLAB Phased Array object and avoids the usual mismatches between functions and objects. Then it plots the ambiguity function and measures sidelobe level so you can compare options side by side. MATLAB with the toolbox is required.
when:
  - You must pick between a chirp and a phase code for a new sensor.
  - Sidelobes hide weak targets and you need to lower them.
  - You want to know how a waveform handles Doppler shift.
  - You are designing an FMCW radar and need the sweep settings.
you_give:
  - Range, resolution and speed needs
  - Radar, sonar or dual use
  - MATLAB with Phased Array toolbox
  - Bandwidth or pulse limits (optional)
you_get:
  - Chosen waveform type with reasons
  - Settings for the waveform
  - Ambiguity function plots
  - Sidelobe and resolution figures
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with the Phased Array System
    Toolbox.
