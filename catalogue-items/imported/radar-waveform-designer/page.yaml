thinking: high
thinking_why: Waveform choices trade off many technical limits.
new_slug: radar-waveform-designer
name: Radar waveform designer
summary: Pick the right radar or sonar waveform for your range, resolution and speed needs. Get its settings and plots of sidelobes and Doppler.
job: build-software
headline: Radar waveform designer
subhead: A radar or sonar waveform chosen for your needs, with its settings and plots showing how well it works. You see range resolution, sidelobes and how it copes with moving targets.
explain: |
  A radar or sonar waveform chosen for your needs, with its settings and plots showing how well it works. You see range resolution, sidelobes and how it copes with moving targets.

  You state what you need: range, resolution, speed, and whether it is radar, sonar or a combined sensor. The skill walks a decision tree to pick the waveform type, such as linear chirp, nonlinear chirp, FMCW, or phase-coded. It uses the matching MATLAB Phased Array object and avoids the usual mismatches between functions and objects. Then it plots the ambiguity function and measures sidelobe level so you can compare options side by side. MATLAB with the toolbox is required. The result comes in this order: waveform choice, derived parameters, waveform settings, spectrum plot, ambiguity plots and a sidelobe check.

  Licence: BSD 2-Clause plus one MathWorks term (clause 3 in LICENSE.md). You may use this skill only with MathWorks products and services, so you need your own paid MATLAB licence and the Phased Array System Toolbox.
when:
  - You must pick between a chirp and a phase code for a new sensor.
  - Sidelobes hide weak targets and you need to lower them.
  - You want to know how a waveform handles Doppler shift.
  - You are designing an FMCW radar and need the sweep settings.
not_for:
  - "You need a full radar system simulation, with beamforming or CFAR detection: use the MATLAB Phased Array toolbox examples for those, or ask an engineer."
  - "You are working on communications signals, not sensing: use a communications toolbox or a specialist in that field."
  - "You have no access to MATLAB with the Phased Array System Toolbox: ask a radar engineer to size the waveform by hand."
you_give:
  - Your range, resolution and speed needs
  - Whether it is radar, sonar or dual use
  - Your MATLAB version, with the Phased Array System Toolbox
  - Bandwidth or pulse limits (optional)
you_get:
  - Chosen waveform type with reasons
  - Settings for the waveform
  - Ambiguity function plots
  - Sidelobe and resolution figures
how_to_use:
  - Gather first: your range, range resolution, target speed, radar or sonar, and your MATLAB release. You need paid MATLAB with the Phased Array System Toolbox. Versions. nlfmspec2freq needs R2023a. legendreseq, mlseq, apaseq and pnkcode need R2024a. shapespectrum and sidelobelevel need R2024b. radarWaveformGenerator needs R2026a. The skill's licence lets you use it only with MathWorks products.
  - Open your AI and paste the skill, or upload the skill folder.
  - Tell it your range, resolution and speed needs, and whether it is radar or sonar.
  - Answer any questions it asks about your use. It may ask about range scale, target speed and limits.
  - Run the MATLAB code it writes. Your AI needs to run MATLAB for this, or you run it yourself.
  - Check the sidelobe figure and the ambiguity plots against your needs. Ask it to try another waveform if they miss.
  - Next, give the chosen settings and plots to a radar engineer for system design, or test the waveform in a detection simulation.
  - No way to run MATLAB code? Ask your AI for the settings and plots code, run it yourself in MATLAB, and paste back the results.
next: [radar-detection-simulator, signal-spectrum-analyzer]
output_sample:
  input:
    - Your range, range resolution and target speed needs
    - Whether it is radar, sonar or dual use
    - Bandwidth or pulse limits (optional)
    - Your MATLAB version and toolbox access
  prerequisites:
    - MATLAB with the Phased Array System Toolbox
    - An AI that can run MATLAB code
    - MATLAB R2026a if you want radarWaveformGenerator, as some functions need R2023a or later
  output:
    - name: Waveform choice
      contains: The waveform type picked from the decision tree, with the reasons it fits your needs.
    - name: Derived parameters
      contains: Bandwidth, range resolution, PRF, maximum unambiguous range and maximum two-way Doppler worked out from your needs.
    - name: Waveform settings
      contains: The values to build the matching Phased Array waveform object.
    - name: Transmit spectrum plot
      contains: The spectrum of the waveform, with a mask if your case has one.
    - name: Ambiguity function plots
      contains: Plots showing how the waveform handles range and Doppler shift, including a zero-Doppler cut.
    - name: Sidelobe check
      contains: The peak sidelobe level measured and whether it meets your requirement, plus any receive weighting loss.
