name: India economy dashboard
summary: Build an India economy dashboard from dated official data. Show key measures, sources, gaps and limits.
job: track-numbers
headline: India economy dashboard
subhead: India economic data and sovereign yields with clear dates, formulas and missing-input notes.
explain: |
  A dated India macro dashboard using comparable official data. It records source definitions, periods, release dates, units and revisions. It calculates only supported growth, CPI comparisons, same-date government-curve slopes and matched-horizon expected real yields. It omits CCIL curve values when permission for the intended use is not established and names each missing input. The method does not declare a cycle phase from incomplete evidence or recommend trades.
when:
  - You need a quick view of where the economy sits in the cycle.
  - You want to know if the yield curve is flattening or steepening.
  - You are writing a market note and need clean macro charts.
  - You have to explain real rates to your team.
you_give:
  - India is the fixed market for this method
  - Time window
  - Indicators you care about (optional)
you_get:
  - Indicator dashboard
  - Yield curve and real-rate view
  - Cautious interpretation when comparable evidence is sufficient
  - Notes on missing data
