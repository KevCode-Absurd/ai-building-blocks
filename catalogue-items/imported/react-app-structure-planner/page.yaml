thinking: high
thinking_why: Structure choices affect the whole codebase.
new_slug: react-app-structure-planner
name: React app structure planner
summary: Point it at a React or React Native app. Get a clear folder layout and
  rules for what may import what.
job: build-software
headline: React app structure planner
subhead: A clear folder layout for your React or React Native app, plus simple
  rules for what may import what. Any contributor can then answer where code
  lives without asking anyone.
explain: |
  A clear folder layout for your React or React Native app, plus simple rules for what may import what. Any contributor can then answer where code lives without asking anyone.

  It organises the app into feature modules. Each module owns its own pages, components, hooks, state, types and one public entry point. Pages are folders, not single files, holding the code only they use. The skill also sorts state into server state and UI state, so you know where each belongs. The structure fits Next.js, Vite, Remix and Expo with any state or styling library. Point it at an existing app and it shows how to move toward this layout.
when:
  - Your React project has become a tangle of folders.
  - New team members keep asking where code should go.
  - Features are importing each other in a circle.
  - You are starting a React Native app and want a clean base.
you_give:
  - Your app folder or a description of it
  - Framework in use
  - Current pain points (optional)
you_get:
  - Folder layout by feature
  - Import rules between layers
  - Server state versus UI state guide
  - Steps to migrate an existing app
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your project files.
