thinking: high
thinking_why: Structure choices affect the whole codebase.
new_slug: react-app-structure-planner
name: React app structure planner
summary: Plan a React app structure your whole team can follow. Get a feature-based folder layout and clear rules for what can import what.
job: build-software
headline: React app structure planner
subhead: A clear folder layout for your React or React Native app, plus simple rules for what may import what. Any contributor can then answer where code lives without asking anyone.
explain: |
  A clear folder layout for your React or React Native app, plus simple rules for what may import what. Any contributor can then answer where code lives without asking anyone.

  It organises the app into feature modules. Each module owns its own pages, components, hooks, state, types and one public entry point. Pages are folders, not single files, holding the code only they use. The skill also sorts state into server state and UI state, so you know where each belongs. The structure fits Next.js, Vite, Remix and Expo with any state or styling library. Point it at an existing app and it shows how to move toward this layout.
when:
  - Your React project has become a tangle of folders.
  - New team members keep asking where code should go.
  - Features are importing each other in a circle.
  - You are starting a React Native app and want a clean base.
not_for:
  - "You have a small single-page app: a simple components folder is enough, so skip this plan."
  - "You only need backend or server work: ask a backend developer or use your framework's own guide."
  - "You want a visual design or a component library: use a design system tool or a UI kit instead."
you_give:
  - Your app folder or a description of it
  - Framework in use
  - Current pain points (optional)
you_get:
  - Folder layout by feature
  - Import rules between layers
  - Server state versus UI state guide
  - Steps to migrate an existing app
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Paste your folder list, or upload your project files if your AI can read them.
  - Say which framework you use, and add your pain points if you have any.
  - Read the folder layout and import rules first. Check them against your real app.
  - Ask for the migration steps. Move one feature at a time, not the whole app.
output_sample:
  input:
    - Your app folder or a short description of it
    - The framework you use, such as Next.js, Vite, Remix or Expo
    - Problems you have now (optional)
  prerequisites:
    - An AI that can read your project files works best. You can also paste a folder list into a chat.
  output:
    - name: Directory layout
      contains: A folder tree that puts each feature in its own module, with shared code kept apart.
    - name: Feature modules
      contains: What each module holds and how its single public entry file works as the contract.
    - name: Pages and screens
      contains: How each route becomes a folder holding its own component, styles and local helpers.
    - name: State rules
      contains: Where server data lives and where screen state lives, so the two never mix.
    - name: Import rules
      contains: Which layers may import which, and the rule that modules talk only through public entry files.
    - name: Framework adapter
      contains: How the layout maps onto your framework, such as Next.js, Vite, Remix or Expo.
    - name: Conventions checklist
      contains: A list of checks to run in code review so the structure holds.
    - name: Migration steps
      contains: Steps to move an existing app toward this layout.
