name: Recent topic pulse researcher
summary: Give it a topic. Get a cited briefing of what Reddit, Hacker News and the web say lately. Collects data from websites.
job: understand-customers
headline: Recent topic pulse researcher
subhead: Give it a topic. Get a cited briefing of what Reddit, Hacker News and the web say lately. Collects data from websites.
explain: |
  A cited briefing on what people have said lately about a topic, drawn from Reddit, Hacker News and the open web. X is an option if you supply an export. You see the main themes, the arguments, and where to read more.

  Searches for Reddit, Hacker News and the web run side by side, kept within polite rate limits. Results are limited to a time window you set. The skill then groups what it finds into themes, notes where people disagree, and gives links for every claim. Questions such as what do people think of this tool, or what is trending in my field, fit well. It collects data from websites, so check each site's rules.
when:
  - You need to know what people are saying about a product this month.
  - You want real user opinions before choosing a tool.
  - You are researching a competitor and need recent chatter.
  - You want links to the threads behind each point.
you_give:
  - Topic to research
  - Time window
  - Sources to include (optional)
  - X export file (optional)
you_get:
  - Briefing with main themes
  - Points of disagreement
  - Links for every claim
  - Suggested threads to read
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can search the web.
