thinking: low
thinking_why: It runs a set tool and tidies the result.
new_slug: recording-transcriber
name: Recording transcriber
summary: Turn a recording into a written transcript you can search and quote. Give it audio or video. You get text, with each speaker labelled if you ask.
job: work-with-audio
headline: Recording transcriber
subhead: Your audio or video turned into written words, with each speaker labelled if you want. You get a clean text file or structured data you can search, quote or summarise.
explain: |
  Your audio or video turned into written words, with each speaker labelled if you want. You get a clean text file or structured data you can search, quote or summarise.

  It runs a bundled script against OpenAI's transcription models, so it needs an OpenAI API key saved on your machine and Python. By default it uses a fast model for plain text. When you want to know who said what, it switches to a speaker model and returns labelled segments. Long recordings are split automatically. It checks the result for quality and segment boundaries and repeats once with a single fix if needed. Output goes into a named folder per job.
when:
  - You recorded a meeting and need minutes.
  - You have an interview and want quotes with names attached.
  - You need subtitles or searchable text for a video.
  - You have many audio files to process in one go.
not_for:
  - "You need live captions while people speak: use your meeting app's built-in captions."
  - "You need a record for court or other legal use: use a human transcriber, or have a person check every line."
  - "You have no OpenAI API key or cannot run code: ask a person or a transcription service to type it up."
you_give:
  - Your audio or video file, or several files
  - Language of the recording (optional)
  - A short clean audio sample of each known speaker, up to 4 (optional)
  - Your OpenAI API key, saved on your machine
you_get:
  - Transcript in text or JSON
  - Speaker labels (optional)
  - Output in a folder per job
how_to_use:
  - Save your OpenAI API key on your machine as OPENAI_API_KEY. Never paste it into the chat.
  - Open an AI that can run code and has Python. Give it this skill and your audio or video files.
  - Say if you want speaker labels. If you do, add a short clean audio sample for each known speaker.
  - Check the transcript for wrong words, wrong speakers and odd segment breaks. Ask for one fix if needed.
  - Find your results in the output/transcribe folder, in one folder per job. Then ask your AI to turn the transcript into minutes or a summary.
output_sample:
  input:
    - Your audio or video file, or several files
    - "The output you want: plain text or labelled speakers"
    - Language of the recording (optional)
    - A short clean audio sample of each known speaker, up to 4 (optional)
  prerequisites:
    - An AI that can run code and use Python
    - An OpenAI API key saved on your own machine, not pasted in chat
  output:
    - name: Transcript text file
      contains: The spoken words written out as plain text, made with the fast model by default.
    - name: Diarized JSON
      contains: The words split into segments, each with a speaker label, when you ask for speakers.
    - name: Job folder
      contains: One named folder per job under output/transcribe, so many files do not overwrite each other.
    - name: Quality check
      contains: A check of wording, speaker labels and segment edges, with one targeted retry if something is off.
