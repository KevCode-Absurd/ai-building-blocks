thinking: medium
thinking_why: It defines metrics clearly and builds a repeatable sheet.
new_slug: recurring-kpi-report-maker
name: Recurring KPI report maker
summary: Describe the report you want in plain words. Get the numbers pulled, a
  workbook, and a saved report to rerun.
job: track-numbers
headline: Recurring KPI report maker
subhead: Describe a report once in your own words and get the numbers pulled, a
  chat summary and an Excel workbook. The report definition is saved, so you can
  rerun it next week with one phrase.
explain: |
  Describe a report once in your own words and get the numbers pulled, a chat summary and an Excel workbook. The report definition is saved, so you can rerun it next week with one phrase.

  It first checks for a saved definition and reruns it if it exists. If not, it turns your sentence into a spec. A line like sales by location against last year, plus AR aging, hides several choices, and it settles each one. Then it pulls data from connected tools, or reads an uploaded CSV or Excel file when none are linked. You get the summary in chat plus the workbook, and the definition is stored for a schedule.
when:
  - You rebuild the same weekly numbers by hand every Monday.
  - You want sales by location, labour percent and AR in one pack.
  - You need to see the same report as last time.
  - Your numbers live in three dashboards and you want one view.
you_give:
  - Plain-words description of the report
  - Data from a connected tool or an uploaded file
  - Comparison period (optional)
you_get:
  - Chat summary of the numbers
  - Excel workbook
  - Saved report definition
  - Rerun on demand or schedule
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read your accounts and files.
  - Where the skill points to ../../shared/, use the shared folder inside it. We
    copied it in so the skill works on its own.
