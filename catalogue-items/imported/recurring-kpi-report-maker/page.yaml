thinking: medium
thinking_why: It defines metrics clearly and builds a repeatable sheet.
new_slug: recurring-kpi-report-maker
name: Recurring KPI report maker
summary: Build a recurring KPI report from one plain sentence. You get a chat summary, an Excel workbook, and a saved report you can rerun.
job: track-numbers
headline: Recurring KPI report maker
subhead: Describe a report once in your own words and get the numbers pulled, a chat summary and an Excel workbook. The report definition is saved, so you can rerun it next week with one phrase.
explain: |
  Describe a report once in your own words and get the numbers pulled, a chat summary and an Excel workbook. The report definition is saved, so you can rerun it next week with one phrase.

  It first checks for a saved definition and reruns it if it exists. If not, it turns your sentence into a spec. A line like sales by location against last year, plus AR aging, hides several choices, and it settles each one. Then it pulls data from connected tools, or reads an uploaded CSV or Excel file when none are linked. You get the summary in chat plus the workbook, and the definition is stored for a schedule.
when:
  - You rebuild the same weekly numbers by hand every Monday.
  - You want sales by location, labour percent and AR in one pack.
  - You need to see the same report as last time.
  - Your numbers live in three dashboards and you want one view.
not_for:
  - "You have a one-off question about your numbers: ask your AI directly, or pull the figure from your accounting tool."
  - "You want a live dashboard that updates by itself: use a dashboard tool such as Looker Studio or Power BI."
  - "You want the wider picture of how your business is doing: use business-snapshot-writer instead."
you_give:
  - Plain-words description of the report
  - Data from a connected tool or an uploaded file
  - Comparison period (optional)
you_get:
  - Chat summary of the numbers
  - Excel workbook
  - Saved report definition
  - Rerun on demand or schedule
how_to_use:
  - Have ready a one-line description of the report, and either a connected tool or a CSV or Excel export of your numbers.
  - Open your AI tool and add this skill. Paste the instructions into a chat if you cannot add files.
  - "Describe your report in one sentence. For example: sales by location vs last year plus AR aging, every Monday."
  - Answer the one batch of questions it asks, such as which period each run covers. Then confirm the spec once.
  - If you have no connected tools, export a CSV or Excel file from your system and upload it. This works with no account.
  - Connected tools like QuickBooks, Xero, Shopify, Stripe or Ramp each need your own paid account, and connecting them may need an API key or a plan that allows API access. Check each tool's plan. A CSV or Excel export needs none of this.
  - The skill cannot run itself on a timer. To get the report each week or month, say "same report as last time" or set a calendar reminder.
  - Check the summary and the workbook totals. Next week, say same report as last time to rerun it.
output_sample:
  input:
    - A plain-words description of the report, such as the numbers, how to group them and what to compare
    - Data from a connected tool, or a CSV or Excel file you upload
    - How often you want it, such as weekly or monthly (optional)
    - Which period each run covers, if you know it (optional)
  prerequisites:
    - An AI that can read your connected accounts or uploaded files
    - A connected tool or an exported CSV or Excel file
    - An AI that can run code to build the Excel workbook
  output:
    - name: Resolved spec
      contains: Your metrics, grouping, comparison, period and cadence in one short block, shown once for you to confirm.
    - name: Chat summary
      contains: Up to three findings, each with its number and comparison, and the biggest outlier named.
    - name: Excel workbook
      contains: A summary tab first, one tab per metric group, and a last tab with the raw pulled data.
    - name: Report page
      contains: The same report as a page with stat tiles and tables, or in the format you prefer.
    - name: Saved report definition
      contains: Your report spec with its date and cadence, so you can rerun it with one phrase.
