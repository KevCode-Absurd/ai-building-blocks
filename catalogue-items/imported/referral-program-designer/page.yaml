thinking: medium
thinking_why: It designs rewards and flow in set steps.
new_slug: referral-program-designer
name: Referral program designer
summary: Design a referral program or affiliate program for your product. Get reward sizes, an invite-to-payout flow, share messages and a launch plan.
job: grow-social
headline: Referral program designer
subhead: A referral or affiliate program designed for your product, with the rewards, the sign-up flow and a launch plan. You can see how the numbers would work before you spend on it.
explain: |
  A referral or affiliate program designed for your product, with the rewards, the sign-up flow and a launch plan. You can see how the numbers would work before you spend on it.

  It starts with what it needs to know: customer or affiliate, B2B or B2C, average customer value, current cost to win a customer, and whether people already talk about your product. Rewards are sized against your numbers, so the cost of a referral stays below the cost of other channels. It maps the steps from invite to payout and writes the share messages. Then it sets what to measure after launch, such as referral rate and conversion.
when:
  - You want existing customers to bring in new ones.
  - You are weighing a referral program against an affiliate scheme.
  - A past referral offer got little use and you want to fix it.
  - You need to know how big a reward you can afford.
not_for:
  - Your product is backend or internal-only, with little natural sharing. Put your effort into content or partnerships instead.
  - You only want more customer reviews. Use a review request plan from a person on your team, since this page is built for referral rewards.
  - You need a legal contract for affiliates. Ask a lawyer to write the terms.
you_give:
  - Product and customer type
  - Average customer value
  - Current cost to win a customer
  - Past referral attempts (optional)
you_get:
  - Program type and reward design
  - Invite to payout flow
  - Share message copy
  - Launch plan and measures
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page. No code or paid tool is needed. The referral tools it names, such as Rewardful, Tolt, Mention Me, PartnerStack and Introw, are optional and usually paid.
  - If you paste only the skill text, its reference files are left out. Your AI should ask you to paste a section, or work from the main steps.
  - Tell your AI what you sell and who buys it.
  - Add your average customer value and what it costs now to win a customer.
  - Say if you want a customer referral program, an affiliate program or both.
  - Check that the reward costs less than your other ways of winning a customer.
  - Ask for the launch plan and follow the checklist before you go live.
next: [growth-loop-designer]
output_sample:
  input:
    - Your product and who buys it
    - Whether you want a customer referral program, an affiliate program or both
    - Your average customer value
    - What it costs you now to win a customer
    - Past referral attempts (optional)
  output:
    - name: Program type
      contains: Whether a customer referral program, an affiliate program or both fits your product, and why.
    - name: Reward design
      contains: Who gets paid, what they get, and how the reward compares with your cost to win a customer.
    - name: Invite-to-payout flow
      contains: Each step from the moment a customer is asked to share to the moment the reward is paid.
    - name: Share message copy
      contains: Ready-to-use invite text and a launch email for your customers.
    - name: Launch checklist
      contains: What to build, test and announce before and during launch.
    - name: Measures for the first 30 days
      contains: The numbers to watch after launch, such as active referrers and referral conversion rate.
