thinking: medium
thinking_why: Refunds are costly to get wrong, so it checks each step.
new_slug: refund-and-reorder-processor
name: Refund and reorder processor
summary: Refund a Shopify order in full or in part, and draft a replacement order if the customer wants one. Preview the amount first. It moves real money.
job: help-customers
headline: Refund and reorder processor
subhead: A refund issued on the right order, for the right items, with a replacement draft order ready if the customer wants one. No clicking through the Shopify admin, and no guessing at amounts.
explain: |
  A refund issued on the right order, for the right items, with a replacement draft order ready if the customer wants one. No clicking through the Shopify admin, and no guessing at amounts.

  You give it the store, the order and the items to refund. It looks up the order, works out the refund for a full or partial return, and creates it. If you ask for a replacement, it drafts a new order for the same items. Because it moves real money, it has a dry run mode that shows what would happen first. It needs a logged-in Shopify command line session and permission to read and write orders.
when:
  - A customer got a damaged item and you need to refund it and ship a new one.
  - You need to refund only two items from a five item order.
  - You want to check the refund amount before any money moves.
  - You handle many refunds a week and want the same steps each time.
not_for:
  - "The order is already fully refunded: check the order's refund history in your Shopify admin, as there is nothing left to refund."
  - "The customer only wants store credit or an exchange: do that by hand in your Shopify admin, as this tool sends money back."
  - "You only need to find an order or check its status: look it up in your Shopify admin first, then come back with the order ID."
you_give:
  - Store domain
  - Order number
  - Items to refund, or full refund
  - Replacement wanted or not (optional)
  - Dry run preference (optional)
you_get:
  - Refund created on the order
  - Refund amount confirmation
  - Replacement draft order (optional)
  - Preview of changes in dry run
how_to_use:
  - Check you have a logged-in Shopify command line session for your store and permission to read and write orders. This tool needs an AI that can run commands, so a plain chat window will not work.
  - Find the order in your Shopify admin and copy its ID in the long form that starts with gid://shopify/Order/. The short order number is not enough.
  - Ask your AI to run the skill with dry run on first. Give it the store domain, the order ID and the items to refund.
  - Read the preview. Check the items, the quantities and the refund amount before you go on.
  - Ask your AI to run it again with dry run off. This moves real money and cannot be undone.
  - If you asked for a replacement, send the invoice link to your customer. The draft order is not paid or shipped until they pay.
output_sample:
  input:
    - Your store domain
    - The order ID in Shopify's long form (it starts with gid://shopify/Order/)
    - Which items and how many to refund (optional, the default is all refundable items)
    - The refund reason (optional)
    - Whether you want a replacement draft order (optional)
  prerequisites:
    - An AI that can run commands on your computer, such as Claude Code, Cursor, Codex or Gemini CLI
    - A logged-in Shopify command line session for your store
    - Permission to read and write orders
  output:
    - name: Session start banner
      contains: The skill name, your store domain and the start time.
    - name: "Step 1: Order check"
      contains: The order's payment status, each item's refundable quantity, the customer and the shipping address.
    - name: "Step 2: Refund"
      contains: The refund ID and the total amount refunded, or the errors if Shopify rejects it.
    - name: "Step 3: Replacement draft order"
      contains: The draft order name and invoice link, only when you ask for a replacement.
    - name: Outcome summary
      contains: The order name, refund ID, amount refunded, replacement draft name and error count, in plain text or JSON.
