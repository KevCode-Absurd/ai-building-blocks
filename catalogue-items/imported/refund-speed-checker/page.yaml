thinking_why: It measures time between two dates.
new_slug: refund-speed-checker
name: Refund speed checker
summary: Get the average days from return request to refund, and the returns
  that ran late.
job: run-your-store
headline: Refund speed checker
subhead: The average number of days between a return request and the refund,
  plus a list of the returns that took too long. It shows whether you keep the
  promise you make to customers.
explain: |
  The average number of days between a return request and the refund, plus a list of the returns that took too long. It shows whether you keep the promise you make to customers.

  You set the lookback period and the number of days you consider acceptable. The skill reads your Shopify returns, measures the time from request to refund for each finished one, and averages it. Any return over your limit is listed as a breach. It also checks open returns that are already past the limit and still waiting. It only reads data. It needs a logged-in Shopify command line session with order and return read access.
when:
  - Customers complain that refunds take too long.
  - You promise refunds within five days and want proof you meet it.
  - You want to find returns still stuck and overdue.
  - You are reviewing how well your support team handles returns.
you_give:
  - Store domain
  - Days to look back
  - Maximum acceptable refund days
  - Output format (optional)
you_get:
  - Average days to refund
  - List of returns that ran late
  - Open returns already overdue
  - Summary you can share with the team
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin (read only).
