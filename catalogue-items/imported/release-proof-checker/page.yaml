thinking: high
thinking_why: It gathers evidence from several systems and judges it.
new_slug: release-proof-checker
name: Release proof checker
summary: Point it at a deployed service. Get fresh proof across code, CI, database and live routes before you call it ready.
job: ship-and-host
headline: Release proof checker
subhead: Point it at a deployed service. Get fresh proof across code, CI, database and live routes before you call it ready.
explain: |
  A clear pass, fail or blocked verdict on a deployed service, backed by fresh evidence instead of a green build light. A finished pipeline does not mean the live site works, and this shows the difference.

  Before testing, you agree on the exact code version, environment, health endpoints, database version and the key routes. The skill then checks each gate one by one: the source, the build, the database migration, the running service and the critical pages. Every gate gets a recorded result with how to repeat the check. It only uses safe, approved tests and never touches production data. It stops and asks if the target is unclear.
when:
  - CI is green but you have not seen the live service working.
  - You must hand a release to operations or a client with proof.
  - A migration ran and you need to confirm the schema is right.
  - You are auditing a release before calling it ready.
you_give:
  - Code version and target environment
  - Health and readiness addresses
  - Expected database version (optional)
  - Key pages or routes to test
  - Permission limits for tests
you_get:
  - Pass, fail or blocked verdict
  - Evidence for each gate
  - Steps to repeat each check
  - List of gaps that block release
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and reach your deployed service.
