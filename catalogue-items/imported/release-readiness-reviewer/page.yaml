thinking: high
thinking_why: It traces many hidden risks across files and settings.
new_slug: release-readiness-reviewer
name: Release readiness reviewer
summary: "Check a release for deploy risks before you ship. Get a read-only report on migrations, config, secrets, rollout order and rollback."
job: ship-and-host
headline: Release readiness reviewer
subhead: "A short report listing the real reasons a release could fail on deploy. You find the missing migration, the absent setting or the wrong rollout order before users do."
explain: |
  A short report listing the real reasons a release could fail on deploy. You find the missing migration, the absent setting or the wrong rollout order before users do.

  It works read-only. It compares your change against a checklist covering database migrations, configuration, secrets, queues, caches, stored files and rollback. Each finding names the module, the evidence, the likely owner, the risk and a fix, sorted from most to least serious. Clean items are left out so the report stays short. Where evidence is unclear but the risk is high, it lists a question to confirm. Secrets are never printed, only their location and name.

  Licence: chaunsin wrote the skill as pre-release-review and marked it Apache-2.0 in the skill file's header, which covers SKILL.md. sickn33 collected it, and the LICENSE-CONTENT file in this item sets CC BY 4.0 for the written text. We only gave it a plain name. Both let you reuse it if you give credit. Credit chaunsin (author) and sickn33 (collection) on any copy you share.
when:
  - You are about to deploy and want a second pair of eyes on the risks.
  - A pull request touches database tables and config together.
  - You need a go or no-go list for a launch meeting.
  - You want to know if a rollback would actually work.
not_for:
  - "You need proof of what is live in production: check a staging environment or follow the service owner's runbook."
  - "You want someone to approve a high-risk change: ask the service owner to sign off, as this report cannot replace that."
  - "You want your AI to run migrations, deploy or fix the code: do that yourself or with your pipeline, as this review only reads."
you_give:
  - Release branch, tag or git range, from a local git clone with its history (tags are needed for the default range; gh is only needed for pull request links)
  - Deploy notes or pipeline files (optional)
  - Environment details (optional)
  - Who owns each service (optional)
you_get:
  - Ranked list of blockers and risks
  - Evidence and owner for each item
  - Recommended fix for each item
  - Questions to confirm before release
how_to_use:
  - Open your AI in a project where it can read your files and git history. Install or upload the whole skill folder, not only SKILL.md. The review reads references/checklist.md and references/report-template.md, and it needs both. If you paste only the skill text, paste those two files as well.
  - "Tell it what to review: a pull request link, a tag range like v1.2.3..HEAD, or nothing to use the last release tag. If your repo has no release tags, the review falls back to the latest 5 commits only and says so, so tag your releases or give a range for a full review."
  - Add deploy notes or pipeline files if you have them (optional).
  - Read the conclusion first, then the P0 and P1 findings.
  - Confirm each P2 item with its likely owner before you deploy.
  - Next, fix every P0 item and run the review again on the new HEAD. Then confirm the P2 items with their owners before you tag the release.
  - If your AI cannot read files, paste the diff into the chat. Expect more items under Unable to verify.
  - "Usual order: run this review before you tag, then ship-readiness-gate for the go or no-go call, then deploy-verifier after the deploy. If the release is already tagged, run deploy-verifier first and use this review on the tag range."
next: [ship-readiness-gate, deploy-verifier, release-notes-writer]
output_sample:
  input:
    - A pull request link, a release tag or a git range (optional, it picks a default range if you give none)
    - Access to your project files and git history
    - Deploy notes or pipeline files (optional)
    - Project guidance files such as AGENTS.md or CLAUDE.md (optional)
  prerequisites:
    - An AI that can read your repository and run read-only git commands
    - The GitHub command line, signed in, if you want it to read a pull request (optional)
  output:
    - name: Reviewed range
      contains: The base and head it compared, whether your working copy had unsaved changes, and any fallback it had to use.
    - name: Conclusion
      contains: One of BLOCKED, NEEDS_CONFIRMATION or NO_BLOCKER_FOUND.
    - name: P0 and P1 findings
      contains: Each blocker or serious risk with its module, evidence, likely owner, risk and recommended action.
    - name: P2 confirmation items
      contains: Lower risks and open questions you should confirm before release, listed after the serious findings.
    - name: Service deployment order
      contains: The safe order to roll out services, workers, migrations and queues. Only shown when the change touches several of them.
    - name: Unable to verify
      contains: Neutral limits, such as no access to production systems, that stopped it from checking something.
