thinking: low
thinking_why: It follows a set deploy path.
new_slug: render-publisher
name: Render publisher
summary: Deploy your app to Render from a Git repo. Get a render.yaml setup file, a Blueprint link and a list of settings left to fill in.
job: ship-and-host
headline: Render publisher
subhead: Your project live on Render, with the setup file written and the dashboard link in your hand. You do not need to learn the hosting settings first.
explain: |
  Your project live on Render, with the setup file written and the dashboard link in your hand. You do not need to learn the hosting settings first.

  It starts by asking where the code lives and whether Render should create everything the app needs, such as a database. It reads your code to find the language, start command and needed settings. Then it writes a render.yaml file, which describes the whole setup, or creates the services directly. The code must be on GitHub, GitLab or Bitbucket. Ready-made Docker images need the Render dashboard instead. You need a Render account and a pushed repository.
when:
  - Your app works on your computer and you want it online.
  - You want your hosting setup saved as a file, not clicked together.
  - Your app needs a database and a scheduled job alongside it.
  - You are new to Render and want a guided start.
not_for:
  - "Your app is only a ready-made Docker image with no Git repo: use the Render dashboard image flow, because this skill cannot create image services."
  - "Your app already runs well on another host: keep it there, or ask that host's own guide for help."
  - "Your code is only on your computer: push it to GitHub, GitLab or Bitbucket first, then come back."
you_give:
  - Project folder pushed to a Git host
  - Render account
  - Whether to create databases and extras
  - Secret settings the app needs (optional)
you_get:
  - Generated render.yaml file
  - Deployed services
  - Link to the Render dashboard
  - List of settings still to fill in
how_to_use:
  - Push your project to GitHub, GitLab or Bitbucket. Make sure you have a Render account.
  - Open your AI tool and paste in this skill. Use an AI that can run commands if you can.
  - Tell it your repo and whether Render should create a database and other extras.
  - Answer its questions. It reads your code and writes render.yaml.
  - Push the file to a branch and review it before you merge to main.
  - Open the Blueprint link, add your secret settings in Render, and check that the deploy runs.
output_sample:
  input:
    - Your project folder, pushed to GitHub, GitLab or Bitbucket
    - Your Render account
    - Whether Render should create a database and other extras
    - Secret settings your app needs (optional)
  prerequisites:
    - A Render account
    - Your code pushed to a Git host
    - An AI that can run commands (to push and check the deploy)
  output:
    - name: Codebase analysis
      contains: The language, build command, start command and settings your app needs, read from your code.
    - name: render.yaml
      contains: The setup file that lists each service, database and scheduled job for your app.
    - name: Next steps
      contains: What to do right after the file is made, including a branch to push and review before main.
    - name: Blueprint deeplink
      contains: A link that opens Render with your setup ready to create.
    - name: Deploy check
      contains: A look at the live service to confirm it started, with basic fixes if it did not.
    - name: Settings to fill in
      contains: The secret values you must add in the Render dashboard yourself.
