thinking: medium
thinking_why: It must tell odd patterns from honest refunds.
new_slug: repeat-partial-refund-spotter
name: Repeat partial refund spotter
summary: Find Shopify orders with repeat partial refunds or a high refund share. Spot fraud, product complaints and returns gaps in your recent orders.
job: run-your-store
headline: Repeat partial refund spotter
subhead: "Orders that look odd: several small refunds on one order, or a large share of the total refunded. These can point to fraud, a product complaint or a gap in how you handle returns."
explain: |
  Orders that look odd: several small refunds on one order, or a large share of the total refunded. These can point to fraud, a product complaint or a gap in how you handle returns.

  The skill reads recent partially refunded orders from Shopify and adds up every refund on each one. It flags an order when it has two or more partial refunds, or when the refunded amount passes a share of the order total that you set. Small orders under a minimum value are skipped. Each flagged order shows its refund history and notes. The list is a prompt to look closer, not a verdict. It reads data only.
when:
  - You suspect a customer keeps getting small refunds.
  - A staff member may be refunding too freely.
  - You want to find products that cause repeat complaints.
  - You review refunds each month and want a shortlist.
not_for:
  - "You want to screen orders for fraud at checkout: use order-risk-report, which looks at risk before the order ships."
  - "You need to settle one refund dispute: read that order's refund notes and talk to the customer directly."
  - "You want to change or issue refunds: this only reads data, so use your Shopify admin."
you_give:
  - Store domain
  - Days to look back
  - Number of partial refunds that counts as repeated
  - Refund share threshold (optional)
  - Minimum order value (optional)
you_get:
  - Flagged orders with refund history
  - Refund share for each order
  - Notes attached to each refund
  - Shortlist to check by hand
how_to_use:
  - Open an AI that can run code, such as Claude Code, Cursor, Codex or Gemini CLI. Paste in the skill text.
  - "Sign in to Shopify with read access to orders: shopify store auth --store your-store.myshopify.com --scopes read_orders."
  - Give your AI your store domain. Add the days to look back and any limits you want to change.
  - Let it run. It only reads data and changes nothing in your store.
  - Open the CSV and sort by refund share, highest first.
  - Read the refund notes on each flagged order before you contact any customer.
output_sample:
  input:
    - Your store domain
    - How many days back to look (90 by default)
    - Number of partial refunds that counts as repeated (2 by default)
    - Refund share that counts as high (optional, 0.5 by default)
    - Smallest order value to check (optional, 25 by default)
  prerequisites:
    - An AI that can run code and use the Shopify CLI
    - A Shopify login with read access to orders
  output:
    - name: Summary report
      contains: Counts of partially refunded orders, orders flagged for repeat refunds, orders flagged for high share, and repeat-flagged customers.
    - name: Top flagged customers
      contains: Customers with the most refunded money, with their flagged order count and refund share.
    - name: partial_refund_patterns CSV file
      contains: One row per flagged order with totals, refund count, refund share, flag reason and first and last refund dates.
