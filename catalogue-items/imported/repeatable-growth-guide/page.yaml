thinking: high
thinking_why: It chains many methods and builds one forecast from your answers.
new_slug: repeatable-growth-guide
name: Repeatable growth guide
summary: Turn lucky months into a growth plan you can repeat. Give it your business details and get a marketing plan, a sharper offer and a forecast.
job: plan-strategy
headline: Repeatable growth guide
subhead: A growth plan and forecast for a business whose good months happened by luck, built one phase at a time. Each phase produces a document that the next phase uses.
explain: |
  A growth plan and forecast for a business whose good months happened by luck, built one phase at a time. Each phase produces a document that the next phase uses.

  It works through nine areas in a fixed order: pick a niche and marketing plan, sharpen the offer, build a pipeline, add word of mouth, improve the sales page, cross to mainstream buyers, use network effects, track the one key number, and negotiate to keep value. The offer comes before channels because sending traffic to a weak offer wastes money. A tracker file records progress, so you can stop and resume another day.
when:
  - Your revenue swings from month to month and you cannot say why.
  - A conference or referral gave you a great month and you cannot repeat it.
  - You have a product people pay for but no steady way to find buyers.
  - You need a growth forecast you can defend.
not_for:
  - "You have no paying customers yet: use the Business idea validation planner to find and test your first buyers."
  - "Your offer, customer retention or daily operations are broken: run the Business turnaround planner first, then come back."
  - "Your product itself must drive the growth, such as invites or sharing inside an app: use the App retention planner."
you_give:
  - Description of your business and customers
  - Current revenue and sales figures
  - Offer and pricing details (optional)
  - Time to work through each phase
you_get:
  - Marketing plan document
  - Sharper offer document
  - Strategy and customer notes
  - Metrics plan with one key number
  - Growth forecast
how_to_use:
  - Use an AI that can read and write files in a project folder, so it can save each document and resume later. Add the skill file to the folder.
  - "In the skill file, the related guides go by the author's names: create-business is the Idea to business guide, improve-business is the Business turnaround guide, and grow-app is the App stickiness guide."
  - "The nine linked skills in the skill file, and the matching items in this library: one-page-marketing is the One-page marketing plan builder, predictable-revenue is the Outbound sales team planner, contagious is the Word of mouth planner, influence-psychology is the Honest persuasion advisor, crossing-the-chasm is the Beachhead market picker, cold-start-problem is the Network launch planner, lean-analytics is the Startup metrics picker, negotiation is the Negotiation prep coach. hundred-million-offers has no match here, so its phase runs from the skill's short built-in brief."
  - You do not have to install anything. The skill offers a command that downloads third-party skills onto your computer. Only say yes after you have read those skills. Or let your AI run each phase from its short built-in brief, and it will say so.
  - Tell your AI your revenue, customer count, main sales channel and current offer and price. It asks a few more questions once, then saves a tracker file.
  - Answer each phase's questions and approve each document before it is saved.
  - The forecast uses only the figures you gave and the baselines and targets set in the metrics phase, and it shows the numbers it used. Treat it as a projection, not a promise.
  - When GROW-BUSINESS-PLAN.md is signed off, read the Next Actions in the tracker. Start the phase that unlocks your biggest constraint.
output_sample:
  input:
    - A short description of your business and your customers
    - Your current revenue and sales numbers
    - Your offer and pricing (optional)
    - Time to work through each phase, with answers to the questions your AI asks
  prerequisites:
    - An AI that can read and write files, so it can save each document and resume later
    - The nine linked skills, installed together or pulled in one phase at a time (the full install command is optional)
  output:
    - name: MARKETING.md
      contains: Your marketing plan, with a before, during and after grid of how buyers find you and stay.
    - name: OFFER.md
      contains: A sharper offer, built before any channel work so traffic does not go to a weak offer.
    - name: METRICS.md
      contains: The one key number to track, and how each part of the plan feeds it.
    - name: GROW-BUSINESS-PLAN.md
      contains: The full growth plan, with your forecast, built from the answers and documents of every phase.
    - name: Phase notes
      contains: Notes on your outbound, word-of-mouth, mainstream buyer, network and pricing decisions, saved as you go.
next: [idea-to-business-guide, business-turnaround-guide, app-stickiness-guide]
