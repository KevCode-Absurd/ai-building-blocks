thinking: medium
thinking_why: It groups patterns, then writes drafts for you to review.
new_slug: repeated-work-skill-finder
name: Repeated work skill finder
summary: Find the tasks you repeat in your Screenpipe screen history, and get draft skills to automate them. You review each draft before you use any.
job: make-skills
headline: Repeated work skill finder
subhead: A list of tasks you do again and again, with draft skills ready to automate them. It finds the patterns in your own screen history that you stopped noticing.
explain: |
  Before you start: screen history can hold passwords, private messages and unpublished work. The cleanup of secrets is a pattern match and can miss things. If you pick a cloud model, app names and window titles leave your machine. Set Screenpipe's ignored-window list first.

  A list of tasks you do again and again, with draft skills ready to automate them. It finds the patterns in your own screen history that you stopped noticing.

  You pick a time window. The skill reads your recorded activity from Screenpipe, a program that captures what you do on your computer. It groups similar workflows, checks whether an existing skill already covers each one, and drafts a new skill or a combination when none fits. Drafts are saved for you to review, not installed. It needs Python and a running Screenpipe, plus a local or cloud language model for drafting.
when:
  - You suspect you waste hours on the same steps every week.
  - You want to turn your habits into reusable skills.
  - You use many tools and cannot see which tasks repeat.
  - You want drafts you can review before using.
not_for:
  - "You want to watch other people's screens, or your employer's: do not use this without their clear consent and a check of company policy."
  - "You have no Screenpipe history or will not install it: write the skill by hand, or describe the task to your AI and ask it to draft one."
  - "You want to hide private work from any AI: skip this, or set Screenpipe's ignored-window list first, since screen history can hold passwords."
  - "You only use a chat window with no code running: this needs Python on your computer, so ask a person on your team to set it up."
you_give:
  - Time window of activity to look at
  - Running Screenpipe program
  - Python set up on your computer
  - Language model to draft with, local or cloud
you_get:
  - List of repeated tasks found
  - Match to existing skills
  - Draft skills for new tasks
  - Notes on which are worth automating
how_to_use:
  - Install Screenpipe from its official project page, https://github.com/screenpipe/screenpipe, using the current release, and let it run. Use only Screenpipe's own install docs. The build-from-source example in the skill file was not tested, so skip it. Before it records much, set its ignored-window list so password managers, banking, HR and client apps and private browsing are skipped. Check the list covers them before you run anything.
  - Set up Python and choose your language model. A local one in LM Studio keeps data on your machine. A cloud one gets summaries of your activity with secret patterns scrubbed, but the scrub can miss things. If sign-in is on, run screenpipe auth token and set the result as SCREENPIPE_TOKEN.
  - Run the doctor check first. It tells you if Screenpipe, Python and your model are ready. Then run with --dry-run and read plan.md, which is saved in the same proposal folder. The cleanup of secrets is a pattern match and does not guarantee that private or unpublished details are removed. Window titles and app names still leave your machine if you pick a cloud model.
  - "Before a cloud run, confirm two things. Your ignored-window list covers banking, HR, password and client apps. And you accept that app names and window titles go to the cloud model you chose. If not, use a local model."
  - "Run the skill with the time window you want, such as the last week. This needs an AI that can run commands on your computer. The command looks like: python skills/autoskill/scripts/autoskill.py run --start <START DATE AND TIME> --end <END DATE AND TIME> --config skills/autoskill/config.yaml --skills-dir skills. With --dry-run it stops after grouping. Results are saved in a new folder under ~/.autoskill/proposed/ named by the time of the run, unless you pass --out."
  - Open report.md in that folder, and the drafts next to it. Review each draft, then keep only the ones worth using. Nothing is installed for you.
  - Test each draft you keep with the Skill file validator before you promote it. The AI draft is not checked automatically. Then add it to your skills folder with the promote command.
output_sample:
  input:
    - The time window of activity to look at, such as the last week
    - Your Screenpipe history, from a running Screenpipe program
    - Which language model should write the drafts, on your computer or in the cloud
    - Your Screenpipe token (optional, only if you turned on sign-in)
  prerequisites:
    - Screenpipe installed and running on your computer
    - Python 3.10 or newer with the needed packages
    - A local language model in LM Studio, or a cloud model key you choose to use
    - Network access the first time, to download the matching model
  output:
    - name: Repeated workflows
      contains: Groups of similar tasks found in your history, with the apps and window titles involved.
    - name: Matches to existing skills
      contains: For each group, whether a skill you already have covers it.
    - name: Draft skills
      contains: A new draft SKILL.md for each repeated task that no existing skill covers, saved for review.
    - name: Composition recipes
      contains: Ways to combine skills you already have when that fits better than a new skill.
    - name: report.md
      contains: A summary of what was found, what matched and what was drafted, to help you pick what to automate.
next: [skill-file-validator, skill-writer]
