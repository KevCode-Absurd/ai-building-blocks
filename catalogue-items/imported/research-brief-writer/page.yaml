thinking: low
thinking_why: It follows a short set of rules to write one paragraph.
new_slug: research-brief-writer
name: Research brief writer
summary: Turn a vague research need into one clear research brief paragraph that a deep research tool can act on without asking you questions.
job: think-and-decide
headline: Research brief writer
subhead: One clear paragraph that a deep research tool can act on without asking you anything. Vague research needs usually give vague answers, and this fixes the request before you send it.
explain: |
  One clear paragraph that a deep research tool can act on without asking you anything. Vague research needs usually give vague answers, and this fixes the request before you send it.

  The paragraph is written for a researcher who knows nothing about your project. It opens by explaining what the project is and why it exists. Then it states the single question and the decision the answer will inform. It adds all the names, dates, known facts and limits, and lists three to six numbered sub-questions. It says what to include and what to avoid, and how the answer should look. It asks for the job to be done, not just a topic.
when:
  - You want to use a deep research tool but your question is fuzzy.
  - Past research results were off topic or too general.
  - You need to brief a researcher who has no background.
  - You have several questions and need to pick one mission.
not_for:
  - "You only need a quick fact or a one-question answer: use a normal web search."
  - "You want the research done, not a brief: paste the finished brief into a deep research tool such as ChatGPT, Claude or Gemini."
  - "You have no goal or decision behind the question: talk it through with a colleague first, then come back."
you_give:
  - What you want to learn
  - Why you need it and what it informs
  - Known facts, names and dates
  - Things to include or avoid (optional)
you_get:
  - One self-contained brief paragraph
  - Numbered sub-questions
  - Stated limits and exclusions
  - Output format request
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or files are needed to write the brief.
  - Gather first: your project name, the decision this research feeds, your deadline, who the answer is for, and any sources you already know. Then describe what you want to learn and why. Say what to include or avoid.
  - Read the brief your AI writes. Check that it has one question, three to six numbered sub-questions and your limits.
  - Fix anything wrong or missing, then ask your AI to rewrite it as one paragraph.
  - Paste the brief into a deep research tool. Some of these need a paid plan or an account, so check yours first. The skill's optional DeepAPI route needs an API key and a paid service. Pasting by hand needs neither.
output_sample:
  input:
    - What you want to learn, even if it is vague
    - Why you need it and what decision it informs
    - Known facts, names and dates about your project
    - Things to include or avoid (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini
    - A deep research tool to run the brief afterward (optional)
  output:
    - name: Project explainer
      contains: One or two plain sentences on what the project is, why it exists and where things stand.
    - name: Core question and decision
      contains: The single question the research must answer and the decision the answer will inform.
    - name: Numbered sub-questions
      contains: Three to six questions, numbered inside the paragraph, that cover the core question fully.
    - name: Include and avoid limits
      contains: What sources and topics to focus on, and what to leave out.
    - name: Source and proof rules
      contains: Prefer primary sources, separate fact from guesswork, check gaps before finishing.
    - name: Output format request
      contains: Each finding needs a source link, a specific claim and a one-line reason it matters, in one markdown file.
