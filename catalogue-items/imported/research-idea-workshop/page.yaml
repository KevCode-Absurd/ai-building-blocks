thinking: high
thinking_why: It needs creative ideas and tough challenge of each.
new_slug: research-idea-workshop
name: Research idea workshop
summary: Run a research idea workshop on your topic. Get ideas built, challenged and ranked, with the hidden assumptions and a log of why you chose.
job: research-topics
headline: Research idea workshop
subhead: A structured brainstorm for your research area that builds ideas, challenges them and ranks them, ending with a log of why you chose what you chose.
explain: |
  A structured brainstorm for your research area that builds ideas, challenges them and ranks them, ending with a log of why you chose what you chose. Ideas stay proposals until evidence says otherwise.

  It keeps four jobs apart: making ideas, checking evidence, testing hypotheses and getting ethics review. First each idea is written on its own, to avoid copying the loudest one. Then a structured discussion adds options, and an adversarial round attacks the weak points. Every idea lists its hidden assumptions. A transparent scoring step ranks them, and a decision log records the reasons. Small Python tools help organise the output.

  Licence: this copy is under the MIT licence (see the LICENSE.md file in this item). It is K-Dense's skill with the name changed; the skill text is unchanged.
when:
  - You lead a lab meeting and want a fair way to pick a direction.
  - You want your ideas attacked before you invest months.
  - You need a written record of why you chose one idea.
  - You are working alone and want the group effect.
not_for:
  - "You already have a testable idea and need a hypothesis: use the Research hypothesis builder."
  - "You need a study plan or sample size: use the Study design and randomizer or the Sample size planner."
  - "You need ethics approval or clinical advice: ask your ethics board or a qualified clinician."
you_give:
  - Research area or question
  - Participants and their views (optional)
  - Criteria that matter to you
  - Existing evidence (optional)
you_get:
  - List of candidate ideas
  - Stated assumptions for each
  - Challenge notes on weak points
  - Ranked shortlist
  - Decision log
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the full text of SKILL.md into a new chat. The small helper tools are optional and need an AI that can run Python.
  - Do not paste unpublished, confidential, personal or controlled data into a public AI chat. Use a tool your institution approves, or describe the material in general terms.
  - Say your research area or question, the criteria that matter to you, and any evidence you already have.
  - Write your own ideas first, before you read any from the AI. Add the views of others if you work in a group.
  - Let it cluster the ideas, attack the weak points and list the hidden assumptions behind each.
  - Check the scoring. Change a weight if it does not match what matters to you, then ask it to rerun the ranking.
  - "Read the shortlist. It is a table with one row per idea: raw ratings, uncertainty range, how the rank changes when weights change, and a decision status. Then read the decision log. Keep the log with your project notes."
output_sample:
  input:
    - Your research area or question
    - The people taking part and their views (optional)
    - The criteria that matter to you
    - Evidence you already have (optional)
  prerequisites:
    - "Optional: Python 3.11 or newer, only if you want the small helper tools to organise the files"
  output:
    - name: Independent ideas
      contains: Each person's or round's ideas written alone, before anyone sees the others.
    - name: Clusters
      contains: The ideas grouped by theme, with minority views and odd ideas kept.
    - name: Assumptions
      contains: The hidden assumptions behind each idea, labelled so they are not mistaken for facts.
    - name: Adversarial review
      contains: Notes that attack the weak points of each idea.
    - name: Scored shortlist
      contains: Ideas ranked against your criteria. The working is shown, with the raw ratings, uncertainty ranges, weights and a check of how the ranking changes when weights change.
    - name: Decision log
      contains: What you chose, why you chose it, and what would make you revisit it.
