thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: research-literature-comparison
name: Research literature comparison
summary: Share papers on one topic. Get a map of shared findings, conflicting claims and open questions with source references.
job: study-and-practice
headline: Research literature comparison
subhead: Supply several papers and a research question. Get their relationships, disagreements and limits in one comparison. New reading suggestions need source verification; this does not replace your own reading or academic attribution.
when:
  - You need to compare several papers rather than summarize them one by one.
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read the supplied papers and verify any extra readings through search.
