thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: research-literature-comparison
name: Research literature comparison
summary: Share papers on one topic. Get a map of shared findings, conflicting
  claims and open questions with source references.
job: study-and-practice
headline: Research literature comparison
subhead: Supply several papers and a research question. Get their relationships,
  disagreements and limits in one comparison. New reading suggestions need
  source verification; this does not replace your own reading or academic
  attribution.
when:
  - You need to compare several papers rather than summarize them one by one.
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read the supplied papers and verify any extra
    readings through search.
