thinking: medium
thinking_why: It follows a layout method with some design choices.
new_slug: research-poster-maker
name: Research poster maker
summary: Make a research poster in LaTeX from your results and figures. You get a one-page PDF at your venue's size, plus a print check.
job: work-with-files
headline: Research poster maker
subhead: A printable research poster as a PDF, built in LaTeX from your results and figures. LaTeX keeps text sharp and layouts exact, so it prints well at conference size.
explain: |
  A printable research poster as a PDF, built in LaTeX from your results and figures. LaTeX keeps text sharp and layouts exact, so it prints well at conference size.

  It helps you choose between three poster packages: beamerposter for Beamer themes, tikzposter for styled blocks, and baposter for projects that already use it. It lays out columns, sets sizes and places your figures. It compiles the document, checks the PDF with Poppler and runs a print check before you send it. It can adapt a finished paper into a poster. It needs a LaTeX setup. An optional AI schematic step needs Python and an OpenRouter key.
when:
  - You need a poster for a conference next week.
  - You want to turn a finished paper into a poster.
  - Your institute gives you a LaTeX template.
  - You need a final check before sending it to print.
not_for:
  - "You have no LaTeX set up, or you need a quick draft: use PowerPoint, Google Slides or Canva instead."
  - "You need a slide deck for a talk: build slides in your usual presentation tool."
  - "You want invented charts or results: this does not make data, so run your own analysis first."
you_give:
  - Your results and key text
  - Your figures, as PDF, PNG or JPEG files
  - Your poster width, height and orientation
  - Your institute template or theme (optional)
  - Your logos and QR code target (optional)
you_get:
  - LaTeX source files
  - Compiled PDF poster
  - Print preflight check
  - Notes on layout fixes
how_to_use:
  - "Gather these first: your results text, your figure files with their sizes, your venue's poster dimensions, and any template. Your AI must be able to run LaTeX and save files, or you must have LaTeX installed yourself."
  - "Attach the skill folder to your AI, and say: \"Follow SKILL.md. Build my poster, compile it, and run the print preflight in one go.\" If your AI cannot take files, paste the text of SKILL.md into the chat instead."
  - Add your results, figures, poster size and any template.
  - Ask for a poster in beamerposter, tikzposter or baposter. Say which fits your template.
  - Open the PDF and check every edge, label and figure. Ask your AI to fix what is wrong.
  - Run the print check, then send the PDF and source files to your printer. If the print check fails, fix the item it names and run it again before you send anything.
  - Pair the poster with a short handout or a QR link to the paper, so visitors can take the details away.
output_sample:
  input:
    - Your results and key text
    - Your figures, as PDF, PNG or JPEG files
    - Your poster width, height and orientation
    - Your institute template or theme (optional)
  prerequisites:
    - An AI that can run code and save files
    - A LaTeX setup with the poster package you pick, plus Poppler for the PDF check
    - An OpenRouter key and Python, only if you want the optional AI schematic (it costs credits)
    - A baposter class file you supply yourself, only if you pick baposter
  output:
    - name: poster.tex
      contains: The editable LaTeX source with your columns, blocks, text and figures placed at the size you set.
    - name: Figures folder
      contains: Your checked figures, with notes on placed size and print resolution for pictures.
    - name: poster.pdf
      contains: The one-page poster at the exact paper size of your venue.
    - name: Compile log check
      contains: A scan of the build log for overfull boxes, warnings and missing items.
    - name: Print preflight report
      contains: Page count, page size, font embedding and picture resolution, from the review script.
    - name: Layout fix notes
      contains: What to change next, such as clipped edges, small text or figures that do not fit.
