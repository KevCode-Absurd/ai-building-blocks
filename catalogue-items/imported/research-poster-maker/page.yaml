thinking: medium
thinking_why: It follows a layout method with some design choices.
new_slug: research-poster-maker
name: Research poster maker
summary: Give it your results and figures. Get a printable research poster in
  LaTeX as a PDF.
job: work-with-files
headline: Research poster maker
subhead: A printable research poster as a PDF, built in LaTeX from your results
  and figures. LaTeX keeps text sharp and layouts exact, so it prints well at
  conference size.
explain: |
  A printable research poster as a PDF, built in LaTeX from your results and figures. LaTeX keeps text sharp and layouts exact, so it prints well at conference size.

  It helps you choose between three poster packages: beamerposter for Beamer themes, tikzposter for styled blocks, and baposter for projects that already use it. It lays out columns, sets sizes and places your figures. It compiles the document, checks the PDF with Poppler and runs a print check before you send it. It can adapt a finished paper into a poster. It needs a LaTeX setup. An optional AI schematic step needs Python and an OpenRouter key.
when:
  - You need a poster for a conference next week.
  - You want to turn a finished paper into a poster.
  - Your institute gives you a LaTeX template.
  - You need a final check before sending it to print.
you_give:
  - Results and key text
  - Figures
  - Poster size
  - Template or theme (optional)
  - LaTeX installed on your computer
you_get:
  - LaTeX source files
  - Compiled PDF poster
  - Print preflight check
  - Notes on layout fixes
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run LaTeX and save files.
