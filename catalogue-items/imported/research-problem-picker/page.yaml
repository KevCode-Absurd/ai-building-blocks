thinking: high
thinking_why: It guides a hard choice with a method.
new_slug: research-problem-picker
name: Research problem picker
summary: Pick a research problem worth your years, or find out why your project is stuck. Give it your idea. You get risks, success checks and a next step.
job: think-and-decide
headline: Research problem picker
subhead: Tell your AI your research idea, a stuck project or a big question. It asks one question at a time and tests the idea for risk and impact. The method comes from a paper by Fischbach and Walsh.
explain: |
  Help choosing a research problem worth your years, or finding out why a current project is stuck. It uses a decision tree for problem choice from a published paper by Fischbach and Walsh.

  You start in one of three ways: pitch a new idea, share a problem in a running project, or ask a strategic question. For a pitch, you give a short version, then more detail on what you want to do, how, why it would matter and the biggest risks. The skill repeats the idea back to confirm it understood, then walks you through early evaluation step by step. The talk is a conversation, with one question at a time.
when:
  - You have several project ideas and must choose one.
  - Your project has stalled and you do not know why.
  - You want to know if an idea would matter if it worked.
  - You are planning the long-term direction of a lab.
not_for:
  - "You need a go or no-go on finished data: ask a trusted colleague or your advisor to review the results."
  - "You only want papers on a topic: use a literature search tool such as PubMed or Google Scholar."
  - "You need help writing a grant or paper: write the draft yourself first, then ask your AI for edits."
you_give:
  - A 1 to 2 sentence pitch of your idea, problem or question
  - More detail on what you want to do, how, why it matters and the biggest risks
  - Your field and resources (optional)
you_get:
  - A short summary of your idea, so you can check it was understood
  - Questions that test whether the idea is worth your years
  - A clear look at your biggest risks
  - Plans for setbacks and ways around obstacles
  - Advice on which problem to pursue and what to do next
how_to_use:
  - "Open Claude, ChatGPT or Gemini and paste in the skill text. Also paste the nine reference files (01 to 09) that sit next to it in the folder, because the steps depend on them. No code is needed."
  - "Pick a start: pitch an idea, share a problem in a current project, or ask a strategic question."
  - Write the short version in 1 to 2 sentences.
  - Check the summary your AI gives back. Correct anything it got wrong.
  - Add the detail it asks for, then answer its questions one at a time.
  - Ask it to sum up the risks and your next step before you decide. For one document to keep, ask for a plan of one to two pages with the idea summary, risks, success measures, what to fix and what to keep flexible, and your next step.
output_sample:
  input:
    - A 1 to 2 sentence pitch of your idea, problem or question
    - "More detail: what you want to do, how, why it matters and the biggest risks"
    - Your field and resources (optional)
  prerequisites:
    - No files or code needed. It works in a plain chat.
    - Web search is optional. Literature checks only work if your AI can search PubMed.
  output:
    - name: Idea summary
      contains: A one-paragraph restatement of your idea or problem so you can confirm your AI understood it.
    - name: Intuition pumps
      contains: Ways to sharpen and strengthen the idea, so it moves toward more impact.
    - name: Risk assessment
      contains: The main risks in your project, rated, with ways to handle each one.
    - name: Optimization function
      contains: The success measures that show whether the project would matter if it worked.
    - name: Parameter strategy
      contains: Which one constraint to fix and which choices to keep flexible.
    - name: Decision tree and adversity plan
      contains: Key decision points, plans for setbacks, and ways to go around obstacles.
    - name: Next step
      contains: Advice on which problem to pursue and what to do first.
