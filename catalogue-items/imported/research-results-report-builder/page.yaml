thinking: low
thinking_why: It follows a fixed recipe to merge files.
new_slug: research-results-report-builder
name: Research results report builder
summary: Build one research report from many result files, with a contents list and only checked answers. Uncertain values are left out.
job: research-topics
headline: Research results report builder
subhead: One report that pulls together the results from many research files, with a contents list and only the answers that were checked. Uncertain values are left out instead of guessed.
explain: |
  It finds your outline file and reads every result file in the folder. It then asks which short fields, such as star counts, scores or release dates, to show next to each item in the contents list. A Python script is generated to join everything into a Markdown report that covers every field. Anything marked uncertain is skipped, so the report holds only what you can stand behind. It runs after an earlier research outline step.
when:
  - You gathered facts on dozens of items and need one document.
  - You want a contents list with key numbers beside each item.
  - You cannot afford guesses in a report.
  - You finished a batch of research files and want a clean summary.
not_for:
  - "You have only one item to write up: read that result file yourself, or ask your AI to summarize it in a chat."
  - "Your research is not finished yet: complete the earlier research outline step first, then come back to build the report."
  - "You need a report that keeps uncertain values with a note: this skill skips them, so review the raw result files by hand."
you_give:
  - Folder of research result files
  - Outline file for the topic
  - Choice of fields to show in contents
  - Python to run the script
you_get:
  - Single Markdown report
  - Contents list with chosen fields
  - Every field covered per item
  - Uncertain values left out
how_to_use:
  - Use an AI that can run Python and save files, such as Claude with file access. A plain chat will not run the script.
  - Give your AI the skill text and your topic folder. It must hold outline.yaml, fields.yaml and the result files.
  - "Before you start, check two things the skill does not create. fields.yaml lists your field names grouped by category, such as Basic Info: name, release_date. Each result JSON marks values it is not sure of, either by writing [uncertain] in the value or by listing the field name in an uncertain array. Values marked any other way are kept as if checked."
  - Ask it to build the research report from your folder. In Claude Code you can type /research-report. It will find your outline and read the result files.
  - Pick which short fields to show beside each item in the contents list, such as stars, scores or release dates.
  - Your AI writes generate_report.py. Read the script before it runs on your files, then let it run. Open report.md and check it before you share it.
  - "Next: compare a few items in report.md against their raw result files, and look up any field it skipped as uncertain. Then share the report, or pass it to a writing step such as a summary or brief."
output_sample:
  input:
    - A folder of research result files (JSON)
    - Your outline.yaml file for the topic
    - Your fields.yaml file that lists the fields for each item
    - Your pick of short fields to show in the contents list
  prerequisites:
    - An AI that can run Python code and save files
    - Finished research result files from the earlier research outline step
  output:
    - name: generate_report.py
      contains: The Python script that reads every result file and builds the report.
    - name: report.md
      contains: The final Markdown report, saved in your topic folder.
    - name: Table of contents
      contains: A numbered list of every item with a link and the short fields you chose.
    - name: Detailed content
      contains: Each item's fields, grouped by category, with uncertain values left out.
    - name: Other Info
      contains: Extra fields found in the result files that your fields list did not name.
