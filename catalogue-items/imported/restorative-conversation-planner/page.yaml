thinking: high
thinking_why: It must handle harm and fairness with care.
new_slug: restorative-conversation-planner
name: Restorative conversation planner
summary: Describe a conflict between students. Get steps to repair trust and relationships. Not legal or medical advice.
job: teach-and-train
headline: Restorative conversation planner
subhead: Describe a conflict between students. Get steps to repair trust and relationships. Not legal or medical advice.
explain: |
  A step-by-step plan for repairing a relationship after a conflict between students, built around naming harm and agreeing how to put it right. It does not replace school policy, and it is not legal or medical advice.

  You describe what happened, who was involved and their ages. The skill picks the right format for the size of the problem: a short restorative chat for small issues or a larger conference for serious harm. It sets the questions for the student who caused harm, the questions for those affected, and the order of speaking. It also suggests how to close with a written agreement and a check-in date, and adjusts for repeat patterns and how much time you have.
when:
  - Two students had a falling out and the usual consequence did not fix it.
  - A bullying incident needs a repair step, not only a sanction.
  - You want a script for a restorative chat before you hold it.
  - Your school is trialling restorative practice and wants a repeatable process.
you_give:
  - What happened
  - Who was involved and their roles
  - Year group or age
  - Whether this is a pattern (optional)
  - Time available (optional)
you_get:
  - The right restorative format for the situation
  - Questions for each person
  - A running order for the conversation
  - A repair agreement and check-in plan
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
