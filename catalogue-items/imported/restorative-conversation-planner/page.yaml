thinking: high
thinking_why: It must handle harm and fairness with care.
new_slug: restorative-conversation-planner
name: Restorative conversation planner
summary: Plan a restorative conversation after a conflict between students. Get questions, a running order and a repair agreement to use in school.
job: teach-and-train
headline: Restorative conversation planner
subhead: Describe a conflict between students. Get steps to repair trust and relationships. Not legal or medical advice. Bring what happened. Use the result to plan your next step.
explain: |
  A step-by-step plan for repairing a relationship after a conflict between students, built around naming harm and agreeing how to put it right. It does not replace school policy, and it is not legal or medical advice.

  The research named in the skill file (Hopkins, Morrison, Thorsborne and Blood, González) is the original author's summary. It has not been checked here, so do not quote it as proof.

  You describe what happened, who was involved and their ages. The skill picks the right format for the size of the problem: a short restorative chat for small issues or a larger conference for serious harm. It sets the questions for the student who caused harm, the questions for those affected, and the order of speaking. It also suggests how to close with a written agreement and a check-in date, and adjusts for repeat patterns and how much time you have.
when:
  - Two students had a falling out and the usual consequence did not fix it.
  - A bullying incident needs a repair step, not only a sanction.
  - You want a script for a restorative chat before you hold it.
  - Your school is trialling restorative practice and wants a repeatable process.
not_for:
  - "You face abuse, threats or a safeguarding disclosure: tell your designated safeguarding lead first, before any joint meeting."
  - "The affected student is unwilling or unsafe to meet the other: do not hold a joint meeting, and ask a trained colleague or your school counsellor for another route."
  - "You need legal, medical or disciplinary advice: ask your school leaders, your behaviour policy or a qualified professional."
you_give:
  - What happened
  - Who was involved and their roles
  - Year group or age
  - Whether this is a pattern (optional)
  - Time available (optional)
you_get:
  - The right restorative format for the situation
  - Questions for each person
  - A running order for the conversation
  - A repair agreement and check-in plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - The pasted text has fields in double curly brackets, such as {{incident_description}}, {{people_involved}} and {{student_level}}. Replace each one with your own details, or just describe the incident in the chat. For the optional fields, add what you know or write "not provided".
  - Describe what happened, who was involved and their year group. Add if it is a pattern and how much time you have (optional).
  - Read the preparation phase first. Check the affected student is willing and safe before you plan any joint meeting.
  - If there is any risk of harm, stop and talk to your designated safeguarding lead.
  - Use the questions and running order to hold the conversation, then write down the agreement.
  - Record the agreement where your school keeps behaviour records, and read it alongside your behaviour policy and any sanction.
output_sample:
  input:
    - What happened, in your own words
    - Who was involved and their roles
    - The year group or age
    - Whether this is a first time or a pattern (optional)
    - How much time you have (optional)
  output:
    - name: Restorative Protocol
      contains: "The format chosen for the problem: a short restorative chat, a conference or a circle."
    - name: Preparation Phase
      contains: What to do and check before the meeting, and who to talk to first.
    - name: The Restorative Process
      contains: The order of speaking and the questions for the student who caused harm and those affected.
    - name: Agreement Framework
      contains: How to close with a written agreement on how to put things right.
    - name: Follow-Up
      contains: A check-in plan with dates to see if the repair is holding.
    - name: If It Doesn't Work
      contains: What to try next if the conversation stalls or the harm continues.
