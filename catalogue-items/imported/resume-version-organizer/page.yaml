headline: Resume version organizer
subhead: Share your resume versions, recent changes and application list. It separates the master record from copies tailored for each role. You get a folder and naming plan, a tracker showing which copy went where and a queue of updates.
explain: Share your resume versions, recent changes and application list. It separates the master record from copies tailored for each role. You get a folder and naming plan, a tracker showing which copy went where and a queue of updates.
you_give:
  - Your resume files and the roles each one targets.
  - Application records and new achievements to add.
you_get:
  - A master-and-tailored-copy structure.
  - Clear file naming rules and a version tracker.
  - An update queue with old copies kept for reference.
how_it_works:
  - title: Step 1
    text: Identify the master record and the purpose of each tailored copy.
  - title: Step 2
    text: Set a clear folder layout and file naming pattern.
  - title: Step 3
    text: Track applications by version and list updates or copies to archive.
