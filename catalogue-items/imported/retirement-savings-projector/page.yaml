new_slug: retirement-savings-projector
name: Retirement savings projector
summary: Find out if you are on track to retire. Give it your age, savings and goal. You get a retirement savings projection and the monthly amount to close the gap.
job: money-and-investing
headline: Retirement savings projector
subhead: A projected retirement pot and the exact gap between it and the amount you need. You also see the monthly saving that would close that gap.
explain: |
  A projected retirement pot and the exact gap between it and the amount you need. You also see the monthly saving that would close that gap.

  You give your age, current savings, monthly contributions, any employer match and the yearly income you want. The skill sets the target using the 4% rule: yearly spending divided by 0.04, so $60,000 a year means about $1.5 million. It then grows your savings and contributions forward month by month, using return and inflation numbers you can change. It subtracts pension or Social Security income, works out the shortfall, and solves for the contribution needed. This is a planning tool, not financial advice.
when:
  - You want to know if you are on track to retire at your target age.
  - You are deciding how much extra to save each month.
  - You are curious what retiring early would take.
  - You want to see how a higher return or lower spending changes the answer.
not_for:
  - "You need advice on tax, a pension transfer or an annuity: talk to a licensed financial adviser."
  - "Your pension has a complex benefit formula, such as a final salary scheme: ask the scheme provider or an adviser for a statement."
  - "You only want to plan your monthly spending today: make a simple budget in a spreadsheet first."
you_give:
  - Your age and target retirement age
  - Current savings and monthly contribution
  - Yearly income you want in retirement
  - Expected pension or state benefit (optional)
  - Return and inflation assumptions (optional)
you_get:
  - A projected pot at retirement
  - The target nest egg
  - The shortfall or surplus
  - The monthly saving needed to close the gap
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Type your age, target retirement age, savings, monthly saving and the yearly income you want.
  - Add any pension or state benefit, plus your return and inflation guesses, if you have them.
  - If your AI can run Python and has the skill folder, ask it to use the included calculate.py script. If not, ask it to apply the formulas in the Technical Steps section and show each step. Check the arithmetic yourself with a simple calculator.
  - Check the gap and the monthly saving first, then look at the sensitivity table.
  - Treat the 4% rule as a rule of thumb, not a promise. It comes from US research, so change the rate and assumptions to fit your own country and account types. Retiring early may need a lower rate.
  - Next, take the gap and the monthly saving to the personal budget builder to find the money, then ask a licensed adviser about tax wrappers.
output_sample:
  input:
    - Your age and the age you want to retire
    - Your current retirement savings and monthly contribution
    - The yearly income you want in retirement, in today's money
    - Your expected pension or state benefit (optional)
    - Your return and inflation guesses (optional)
  prerequisites:
    - An AI that can run Python code, if you want it to use the included calculation script
  output:
    - name: Retirement Snapshot
      contains: Your target nest egg, projected nest egg, the gap, years left and the monthly saving needed to close it.
    - name: Projection Chart Data
      contains: The year-by-year balance from today until your retirement age.
    - name: Withdrawal Plan
      contains: A safe yearly and monthly withdrawal amount, and when the pot runs out under different return cases.
    - name: Sensitivity Table
      contains: How the result changes if you retire 2 years earlier or later, or earn 1% more or less.
