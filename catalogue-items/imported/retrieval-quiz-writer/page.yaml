thinking: low
thinking_why: It writes questions from a clear topic.
new_slug: retrieval-quiz-writer
name: Retrieval quiz writer
summary: Write a retrieval quiz for any topic. Get recall questions at easy, medium and hard levels, with answer notes, for lesson starters or revision.
job: teach-and-train
headline: Retrieval quiz writer
subhead: A set of short recall questions on one topic, ready to use as a lesson starter or revision task. Because they are low stakes, students practise pulling facts from memory, which makes them stick better than re-reading.
explain: |
  A set of short recall questions on one topic, ready to use as a lesson starter or revision task. Because they are low stakes, students practise pulling facts from memory, which makes them stick better than re-reading.

  You name the topic, the year group and how many questions you want, usually six to ten. The skill writes a mix of free recall, cued recall and recognition questions, each labelled with its type and difficulty. It spreads them across easy, medium and hard. It adds answer notes for you and says when to run the quiz after first teaching. If you list known misconceptions or how long ago the topic was taught, it aims questions at them.
when:
  - You need a five-minute starter for tomorrow's lesson.
  - A class has forgotten last term's content before revision.
  - You want low-stakes testing that is not graded.
  - You are building a revision pack with mixed difficulty.
not_for:
  - "You need a graded test or exam: write it yourself or with your exam board's materials, since these questions are low stakes."
  - "Your students know very little about the topic or have limited English: teach it again first with worked examples, then use this quiz."
  - "You want to teach a topic for the first time: plan the lesson yourself first, then run the quiz later."
  - "You want a quick quiz from your own lesson notes in one message: use the Recall quiz writer."
you_give:
  - The topic or skill
  - Year group or age
  - Number of questions
  - Time since students first learned it (optional)
  - Known misconceptions (optional)
you_get:
  - Recall questions at three difficulty levels
  - A label for each question type
  - Answer notes
  - When to use the quiz after teaching
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code or paid tool is needed.
  - Have these ready. The topic, your year group, how many questions you want, and optionally how long ago you taught it and any misconceptions you have seen.
  - Type those details after the skill text.
  - Send it. You get a set of questions with a type and difficulty for each, then answer notes and a short plan for running the quiz.
  - Check the questions match what you actually taught. Change or remove any that do not.
  - Run the quiz as a low-stakes starter. Do not grade it. Use the answer notes to correct mistakes as a class.
output_sample:
  input:
    - The topic or skill students need to recall
    - Year group or age, and what they already know
    - How many questions you want, usually 6 to 10
    - How long ago they first learned it (optional)
    - Misconceptions you have seen in the class (optional)
  output:
    - name: Questions
      contains: Recall questions on your topic, each labelled free recall, cued recall or recognition, with a difficulty level.
    - name: Answer Notes
      contains: Key points a correct answer should include, plus common wrong answers to watch for.
    - name: Implementation Script
      contains: Short steps for running the quiz in class, including when to run it after first teaching.
