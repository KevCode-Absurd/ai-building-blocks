thinking: low
thinking_why: It fills a set template with the style's rules.
new_slug: retro-style-guide
name: Retro throwback style guide writer
summary: Get a retro style guide for your product, with vintage type, bold colour pairs, rules for each part and a contrast check.
job: design-work
headline: Retro throwback style guide writer
subhead: Describe your product and who uses it. Your AI writes a retro style guide with vintage type, bold colours, spacing and rules for each part. It checks the contrast of every colour pair, so your team can build without guessing.
explain: |
  A retro mood board is not a set of rules. Without rules, one page uses a slightly different blue, the next page a different font size, and the throwback look falls apart. This skill writes a retro style guide that designers and developers can follow.

  Your AI starts with one sentence on the design idea. Then it sets the foundations. The defaults are the Macondo font for headings and short labels, a plainer font for long reading text, JetBrains Mono for code, a blue and a purple as the main colours, a white surface and spacing steps from 4 to 32. After that it writes rules for each part, such as buttons and forms, with every state: default, hover, focus, disabled, loading and error.

  Rules only this retro guide sets: Macondo stays on headings and short labels, never long text. It is used in its one regular weight only, with no fake bold. Long reading text moves to a plainer font. The blue and purple pair carries the throwback feel, with a darker blue for links in body text. Green and amber are kept to icons, borders and fills unless darkened.

  What sets it apart is the contrast check. The default blue on white is only about 3.7 to 1, and normal text needs 4.5 to 1. The guide shows the ratio for each colour pair and tells you where to darken a colour, so the vintage look stays easy to read.
when:
  - Your team has a retro mood board but no written rules.
  - Your throwback site looks different from page to page.
  - You are launching a product with a nostalgic feel and developers need exact colours, sizes and spacing.
  - A developer asks which blue and which font size to use, and nobody can say.
not_for:
  - "Your brand already has a written style guide: extend that guide, or run the Design system reviewer to check it."
  - "You want a calm, plain look for a bank or health tool: use the Minimal style guide writer."
  - "You want a two-colour print look on warm paper: use the Risograph print style guide writer."
  - "You want one vintage poster, not a rules file: use the Poster designer."
  - "You want a leather, paper or glass look instead: use the Real-world texture style guide writer."
you_give:
  - A description of your product and what it does
  - Who uses it
  - Fonts or colours you must keep (optional)
  - Screens or parts to cover first (optional)
  - Web, iOS or Android (optional)
you_get:
  - Colours, type sizes and spacing as named tokens, with a contrast ratio for each colour pair
  - Rules for each part, such as buttons and forms, with every state
  - Accessibility rules you can test, tone examples and things to avoid
  - A review checklist your team can run before shipping
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it and paste it in.
  - Paste your product description and who uses it. Add any fonts or colours you must keep, and say if it is for web, iOS or Android.
  - Answer the one round of questions it asks, or say "use the defaults". Anything you do not give is marked MISSING.
  - Check the fonts and weights. Use only the weights each font really comes in (Macondo ships in one regular weight). Keep Macondo for headings and short labels.
  - Check the colour table first. Darken any pair below 4.5 to 1 for normal text, or limit it to large text and icons.
  - Cut any rule your team will not follow. Then give the guide to your designer or developer, or paste it into your coding AI's project instructions.
how_it_works:
  - title: State the design idea
    text: It writes one sentence on the look and who it is for, before it sets any rules.
  - title: Set the foundations
    text: It sets colours as named tokens, the fonts, exact type sizes and spacing steps from 4 to 32.
  - title: Check the contrast
    text: It tests each text and background pair and flags any that fall below the 4.5 to 1 needed for normal text.
  - title: Write part rules
    text: For each part it covers the anatomy, variants, states and how it works by keyboard, mouse and touch.
  - title: Add tone and bans
    text: It adds tone examples, do and don't pairs, and notes for moving old screens to the new look.
  - title: End with a checklist
    text: It finishes with a short list your team can run in code review.
output_shape: |-
  1. Context and goals: <the design idea in one sentence, the product, who uses it>
  2. Design tokens
     | Token | Value | Use | Contrast on surface |
     | <primary> | <hex> | <where it goes> | <ratio, pass or fail> |
     Fonts: <display>, <body>, <code>
     Type steps: <name = size>
     Spacing: <steps>
  3. Parts: <button, form, card> with anatomy, variants, states, small screens
  4. Accessibility rules: <rule> and <how to test it>
  5. Tone: <voice words>, then <before> and <after> examples
  6. What not to do: <rule> and <example to avoid>
  7. Review checklist: - [ ] <check>
  Next step: <who gets the guide>
  MISSING: <anything you did not give>
output_sample:
  input:
    - Your product and what it does
    - Who uses it
    - Fonts or colours you must keep (optional)
    - Screens or parts to cover first (optional)
  output:
    - name: Context and goals
      contains: One sentence on the retro look, the product and who it is for.
    - name: Design tokens and foundations
      contains: Colours, fonts, type sizes and spacing as named tokens, with a contrast ratio for each pair.
    - name: Component rules
      contains: Anatomy, variants, states and small-screen behaviour for each part, such as buttons and forms.
    - name: Accessibility requirements
      contains: Testable rules for focus, contrast, keyboard use and touch size.
    - name: Content and tone standards
      contains: Voice words with before and after examples.
    - name: Anti-patterns
      contains: What not to build, each paired with an example.
    - name: QA checklist
      contains: A list your team can run in code review before shipping.
works_best_with:
  tools:
    - name: Any good chat AI
      why: It is text in, text out. No code or files are needed.
  inputs:
    - Your logo colours as hex codes
    - Three sites whose retro look you like, in a few words each
    - Your current CSS or Tailwind colour list, to see which tokens you already use
    - Screenshots of your existing screens
terms:
  - term: Style guide
    meaning: A written set of rules for how a product looks, so every screen matches.
  - term: Token
    meaning: A named value, such as primary blue, used in place of a raw colour code.
  - term: Contrast ratio
    meaning: How far apart two colours are in brightness. Normal text needs at least 4.5 to 1.
  - term: WCAG 2.2 AA
    meaning: A web accessibility standard. It sets that 4.5 to 1 minimum for normal text.
