thinking: high
thinking_why: Mixing drop-offs and pickups adds hard limits.
new_slug: return-pickup-route-planner
name: Return pickup route planner
summary: Give it your deliveries and returns to collect. Get routes that bring
  returns back on the same trip.
job: plan-supply-chain
headline: Return pickup route planner
subhead: Give it your deliveries and returns to collect. Get routes that bring
  returns back on the same trip. Bring delivery stops with quantities. Use the
  result to plan your next step.
explain: |
  Delivery routes that also pick up returns on the same trip, so vans drive back loaded instead of empty. That cuts miles and trips.

  You list your drop-off stops, your pickup stops, your depot and your van sizes. The skill uses the backhaul approach: each van delivers first, then collects on the way back, so the load never overflows. It checks that capacity works as the van empties and refills, and handles stops that need both a delivery and a pickup. For small jobs under about 50 stops it can aim for the best route. Larger jobs use smart search methods that give strong routes fast.
when:
  - You deliver parcels and also collect returns or empty containers.
  - Your vans often come back empty after drop-offs.
  - You run a recycling or reverse logistics round.
  - You want to cut the number of trips for returns.
you_give:
  - Delivery stops with quantities
  - Pickup stops with quantities
  - Depot location and van capacity
  - Number of vans
  - Distance or time between stops (optional)
you_get:
  - A route for each van, deliveries then pickups
  - Load checks along each route
  - Total distance or cost estimate
  - Advice on method for your job size
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code (Python).
