new_slug: return-reason-finder
name: Return reason finder
summary: Get return reasons counted by product, to find quality problems and listings that mislead.
job: run-your-store
headline: Return reason finder
subhead: Get return reasons counted by product, to find quality problems and listings that mislead.
explain: |
  A count of why customers send things back, by reason, product and SKU, so you can tell a quality problem from a listing that misleads. Reading it takes minutes instead of scrolling return emails.

  The skill reads your Shopify returns for a chosen window, 30 days by default. It adds up the reason codes, such as wrong size, damaged or not as described, and shows each product's share of all returns. It also counts your total orders in the same window, so you see a true return rate and not just raw numbers. Products with too few returns are left out. It is read-only, so nothing in your store changes. It needs permission to read orders and returns.
when:
  - Returns are climbing and you do not know which product is behind it.
  - You suspect a size chart or photo is misleading buyers.
  - A supplier says their quality is fine and you want evidence.
  - You are choosing which listing to rewrite first.
you_give:
  - Your Shopify store address
  - How many days back to look
  - Minimum returns per product to show (optional)
you_get:
  - Return reasons ranked by count
  - Return rate by product and SKU
  - Share of returns per product
  - Clues pointing to quality or listing problems
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can access your Shopify admin (read only).
