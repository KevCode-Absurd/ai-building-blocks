thinking: low
thinking_why: It follows a fixed set of steps.
new_slug: return-request-creator
name: Return request creator
summary: Open a return request in Shopify for a delivered order. Name the order, items and reason, and preview it first before it goes live.
job: run-your-store
headline: Return request creator
subhead: Give it a delivered order, the items to send back and a reason. Your AI opens a return in Shopify. This changes your live store, so preview it first.
explain: |
  A formal return opened in Shopify for a delivered order, with the right items, amounts and reason, so the warehouse and refund steps can follow. This one changes your live store, so check the details with the customer first.

  You name the order, the line items and quantities, and a reason such as wrong size, defective or not as described. If you give nothing, all fulfilled items are returned with the reason set to other. The skill checks the order has shipped, since only fulfilled orders can have a return. It can run as a dry run to preview, and you choose whether the customer gets an email. Orders not yet shipped need a cancel instead.
when:
  - A customer writes in asking to send back an item that arrived. This is for live returns on fulfilled orders only.
  - Your support team needs a tracked return, not just a refund.
  - You want the same reason on every return.
  - You want to check a return before it goes live.
not_for:
  - The order has not shipped yet. In Shopify admin, open the order, choose More actions, Cancel order, and tick restock.
  - You only need to pay the customer back. Issue a refund in Shopify admin once the returned item arrives.
  - You want a replacement sent. Open the return here, then make a replacement order in Shopify admin.
you_give:
  - The order ID
  - Which items and how many to return
  - A return reason
  - Whether to email the customer (optional)
  - A note on the reason (optional)
you_get:
  - A return record opened in Shopify
  - The items, quantities and reason saved on the return
  - A preview of the return before it goes live
  - A short report of what was created
how_to_use:
  - Use an AI that can run code and reach your Shopify admin. A plain chat window cannot do this.
  - Log in to your store and allow it to read orders and write returns (the read_orders and write_returns permissions). Check first that your login is allowed to grant them. If it is not, ask the store owner. No extra Shopify app is named in the skill.
  - Give your AI the order number, such as #1234, and ask it to look up the order through your store connection. Or open the order in Shopify admin and copy the number at the end of the page address. Your AI then builds the full ID, which is gid://shopify/Order/ followed by that number.
  - Paste the skill and give your AI the order ID, the items and the reason.
  - The preview (dry run) is on by default, so nothing is created until you say so. Check the items and quantities in the preview.
  - Check with the customer that a return is expected. The customer gets an email unless you turn it off.
  - Your AI must show you the preview and wait for your clear yes. Only then does it turn the dry run off, create the return and send any email. Then check the report for errors.
  - Once the item arrives, check it over. Then open the order in Shopify admin and use Refund to pay the customer back.
output_sample:
  input:
    - Your order ID
    - Which items and how many to return
    - A return reason, such as wrong size or defective
    - Whether to email the customer (optional)
    - A note on the reason (optional)
  prerequisites:
    - An AI that can run code and reach your Shopify admin
    - Shopify permission to read orders and write returns (read_orders and write_returns), granted when you sign in
    - A login to your store
  output:
    - name: Order check
      contains: Confirms the order has shipped and lists the shipped items with their quantities and amounts.
    - name: Dry-run preview
      contains: Shows the items, quantities and reason that would be returned, without changing your store.
    - name: Return record
      contains: The new return in Shopify, with its ID and an open status.
    - name: Session summary
      contains: The order name, return ID, number of items, status, whether the customer was emailed, and any errors.
