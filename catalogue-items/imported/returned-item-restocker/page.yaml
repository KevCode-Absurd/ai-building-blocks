thinking: medium
thinking_why: Restocking damaged items inflates your stock.
new_slug: returned-item-restocker
name: Returned item restocker
summary: Get returned items added back to stock at the right location. Changes
  live stock, so skip damaged goods.
job: run-your-store
headline: Returned item restocker
subhead: Returned items put back into available stock at the correct location,
  so your counts match the shelf. It changes live inventory, so it starts in
  preview mode and skips damaged goods.
explain: |
  Returned items put back into available stock at the correct location, so your counts match the shelf. It changes live inventory, so it starts in preview mode and skips damaged goods.

  The skill looks at returns closed in the last 14 days by default. For each returned line it adds units to the stock count at the location the return went to, and links the entry to the return record for your audit trail. Items marked defective are left out unless you say otherwise. You can limit it to chosen reasons, such as unwanted or too small, or to one location. Only run it for items that have arrived and been checked.
when:
  - Your warehouse processes returns in another system and Shopify counts are
    behind.
  - You skipped restocking for a week and need to catch up.
  - You want defective returns kept out of sellable stock.
  - You want a preview of changes before touching inventory.
you_give:
  - Your Shopify store address
  - How many days of returns to cover
  - A location to restock into (optional)
  - Return reasons to include (optional)
you_get:
  - A restock plan listing items and quantities
  - Stock added at the right location
  - Defective items left out
  - A record linking each change to its return
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin and change live
    store data.
