thinking_why: It adds up revenue by location.
new_slug: revenue-by-location-reporter
name: Revenue by location reporter
summary: Run it on your orders. Get revenue for each warehouse or fulfillment
  location, ready for a split profit view.
job: run-your-store
headline: Revenue by location reporter
subhead: Revenue split by the warehouse or fulfilment centre that shipped each
  order, so you can judge every location's profit on its own. It reads your
  Shopify data only and changes nothing.
explain: |
  Revenue split by the warehouse or fulfilment centre that shipped each order, so you can judge every location's profit on its own. It reads your Shopify data only and changes nothing.

  The skill first lists your active locations. It then pulls shipped orders for the window you choose, 30 days by default, and attaches each order's total to the location that fulfilled it. Closed fulfilment orders fill gaps, and any order with no location data goes under Unknown so totals still add up. The output shows revenue per location, ready to place beside costs for a per-site profit view.
when:
  - You ship from more than one warehouse and want a profit view for each.
  - You are deciding staffing or stock levels by site.
  - You want to see where demand is actually being fulfilled from.
  - Finance asks for revenue by location at month end.
you_give:
  - Your Shopify store address
  - How many days back to report
  - Output format, readable or JSON (optional)
you_get:
  - Revenue for each fulfilment location
  - Order counts per location
  - An Unknown line for orders without a location
  - Figures ready for a location profit view
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can access your Shopify admin.
