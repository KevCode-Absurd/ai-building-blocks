thinking: medium
thinking_why: It reads each comment and judges the right change.
new_slug: review-comment-fixer
name: Review comment fixer
summary: Point it at your open pull request. Get each reviewer comment handled
  and the code updated.
job: test-and-fix-code
headline: Review comment fixer
subhead: Every reviewer comment on your open pull request, listed and numbered,
  with the code changes made for the ones you pick. You stay in control of which
  feedback gets applied.
explain: |
  Every reviewer comment on your open pull request, listed and numbered, with the code changes made for the ones you pick. You stay in control of which feedback gets applied.

  It uses the GitHub command line, so you need to be logged in first. The skill finds the pull request for your current branch and runs a script that fetches every comment and review thread. It numbers them and writes a short note on what a fix would involve for each one. You then say which numbers to handle. Only those get changed. If the connection drops or you are logged out, it asks you to log in again and retries.
when:
  - Reviewers left a dozen comments and you want to go through them fast.
  - You want to decide which comments to act on before any code changes.
  - You are mid-branch and want feedback applied without leaving your terminal.
  - A pull request has threads across many files.
you_give:
  - A branch with an open pull request
  - A logged-in GitHub command line
  - Your choice of which numbered comments to fix
you_get:
  - A numbered list of comments and threads
  - A short summary of the fix for each
  - Code changes for the comments you choose
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run the GitHub CLI and reach your repo.
