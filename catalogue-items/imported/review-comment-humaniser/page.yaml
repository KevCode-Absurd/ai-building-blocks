thinking: low
thinking_why: It rewrites short comments.
new_slug: review-comment-humaniser
name: Review comment humaniser
summary: Give it a code review comment. Get a direct version that reads like a
  teammate wrote it.
job: write-and-tell-stories
headline: Review comment humaniser
subhead: Give it a code review comment. Get a direct version that reads like a
  teammate wrote it. Bring one or more code review comments. Use the result to
  plan your next step.
explain: |
  Code review comments rewritten to sound like a teammate: short, direct and with a fix. They get read and acted on, not skimmed past.

  Feed it a wordy comment. The skill cuts the padding, such as I noticed, I was wondering if perhaps, or small suggestion. It removes praise stuck onto every note and stops the comment from retelling the code. Each one becomes a line in the shape line number, label, problem, fix. The labels are bug, risk, nit and question, so the reader knows how urgent it is. A comment with an opinion and no fix gets a fix added. Kind words stay when aimed at the person, not as padding.
when:
  - Your review comments read like a polite robot wrote them.
  - Teammates ignore your long feedback.
  - You want to paste a draft review and tighten it.
  - A new reviewer needs a clear format to follow.
you_give:
  - One or more code review comments
  - The line numbers or files they refer to (optional)
  - The code snippet for context (optional)
you_get:
  - Rewritten comments with line number, label, problem and fix
  - Severity labels for each
  - A shorter review that is easier to act on
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
