thinking: low
thinking_why: It rewrites short comments.
new_slug: review-comment-humaniser
name: Review comment humaniser
summary: Turn a wordy code review comment into a short, direct one with the line, a severity label and a fix. A code review comment rewriter for teammates.
job: write-and-tell-stories
headline: Review comment humaniser
subhead: Paste a wordy code review comment. You get a short version that names the line, how serious it is and the fix, so your teammate acts on it.
explain: |
  Code review comments rewritten to sound like a teammate: short, direct and with a fix. They get read and acted on, not skimmed past.

  Feed it a wordy comment. The skill cuts the padding, such as I noticed, I was wondering if perhaps, or small suggestion. It removes praise stuck onto every note and stops the comment from retelling the code. Each one becomes a line in the shape line number, label, problem, fix. The labels are bug, risk, nit and question, so the reader knows how urgent it is. A comment with an opinion and no fix gets a fix added. Kind words stay when aimed at the person, not as padding. It only rewrites the wording. It does not check that the bug is real.

  Licence: MohamedAbdallah-14 wrote the skill and marked it MIT in the skill file's header. sickn33 collected it, and the LICENSE-CONTENT file in this item sets CC BY 4.0 for the written text. Both let you reuse it if you give credit. Credit MohamedAbdallah-14 (author) and sickn33 (collection) on any copy you share.
when:
  - Your review comments read like a polite robot wrote them.
  - Teammates ignore your long feedback.
  - You want to paste a draft review and tighten it.
  - A new reviewer needs a clear format to follow.
not_for:
  - You are writing about a security finding, such as auth or secrets. Write it in full sentences yourself, or ask a human reviewer.
  - You need to argue an architecture choice or welcome a new contributor. These need a real conversation, so talk to a person.
  - You want your AI to review the code and find the bugs. Ask your AI for a plain code review first, then paste its comments here.
you_give:
  - One or more code review comments
  - The line numbers or files they refer to (optional)
  - The code snippet for context (optional)
you_get:
  - Rewritten comments with line number, label, problem and fix
  - Severity labels for each
  - A shorter review that is easier to act on
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text into the chat. No code running, files or paid tools are needed.
  - Check the finding is real before you paste. The skill only rewrites wording and never checks whether the bug exists.
  - Paste one review comment. Add its file name and line number if you have them.
  - The skill only rewrites wording. It cannot see your code. If the fix depends on context, paste the diff or the code snippet too, so the rewrite does not guess.
  - "Read the reply. Each comment should look like: L42: bug: problem. Fix."
  - Check that the label is honest. A real bug must not be called a nit.
  - Paste the result into your pull request. Keep security and design comments in full sentences.
  - To find the bugs first, run a plain code review (such as the Code change reviewer), then paste its comments here.
next: [code-change-reviewer, bug-and-security-code-reviewer]
output_sample:
  input:
    - One or more code review comments
    - The file name and line numbers they refer to (optional)
    - The code snippet for context (optional)
  output:
    - name: Rewritten comments
      contains: One comment per line in the shape line number, label, what is wrong, and the fix, ready to paste into your pull request.
    - name: Severity labels
      contains: Each comment starts with bug, risk, nit or q, so the reader knows how urgent it is.
    - name: Multi-file and range format
      contains: File name before the line number when comments span files, and a line range when the issue covers several lines.
    - name: LGTM line
      contains: If the change is solid and you have nothing concrete to add, the review is just LGTM.
    - name: Full prose note
      contains: For security, architecture or onboarding comments, a short paragraph instead of a one-liner.
