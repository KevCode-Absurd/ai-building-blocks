thinking_why: It applies a few clear rules to timing and replies.
new_slug: review-request-and-reply-planner
name: Review request and reply planner
summary: Plan when to ask for reviews and how to reply to a bad one. Get a request timing, first question and reply templates for your review requests.
job: help-customers
headline: Review request and reply planner
subhead: A plan for getting more reviews and replying to bad ones in a way that wins over everyone watching. It rests on a few findings that go against common habit.
explain: |
  A plan for getting more reviews and replying to bad ones in a way that wins over everyone watching. It rests on a few findings that go against common habit.

  Ask 9 to 13 days after delivery, not at 24 hours, which cut reviews. Open with a friendly question like what did you enjoy most, before asking for a rating. Send the same request to every customer, because sending only happy ones to the public page is judged deceptive by regulators. Early at launch, ask all early buyers quickly. Keep a rating below 5.0, since it sells better. Replies to public complaints are written for the onlookers, not the angry writer.
when:
  - You are not sure when to send the review request email.
  - You got a harsh 1-star review and wonder whether to try to remove it.
  - Your average is 4.9 and you worry it looks fake.
  - A launch needs a healthy set of early reviews.
not_for:
  - "You want customers to refer friends: use a referral plan or a simple share-a-link offer, not this planner."
  - "You want help with returns, packaging or loyalty perks: set those up as a separate after-sale step, since this only covers reviews and complaints."
  - "You want to hide or remove a bad review: this plan says to leave it and reply, so ask the review site's support if a review breaks its rules."
you_give:
  - Your product and how long it takes to judge
  - Your current request timing and wording
  - Your average rating
  - A review or complaint to answer (optional)
you_get:
  - A better timing for the request
  - Wording for a review request email
  - A reply to a bad review
  - Advice on handling ratings and complaints
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on this page.
output_sample:
  input:
    - Your product and how long it takes to judge
    - Your current request timing and wording
    - Your average rating
    - A review or public complaint to answer (optional)
  output:
    - name: Solicitation plan
      contains: The trigger, the day offset, the first question and the follow-ups for your review request.
    - name: Rating policy
      contains: What to leave alone on your average, and reply wording for a negative review most buyers can ignore.
    - name: Public complaint reply
      contains: A short, warm reply that moves the talk to a private channel.
    - name: Rude complaint reply
      contains: A reply that uses humor about the situation, never about the person.
    - name: Positive review reply
      contains: A short thank-you reply you can reuse for good reviews.
