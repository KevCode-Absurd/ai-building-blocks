thinking: medium
thinking_why: It sorts requirements by set rules, then drafts answers.
new_slug: rfp-response-builder
name: RFP response builder
summary: Turn an RFP or security questionnaire into a sorted requirements list, a fit check and a bid or no-bid call. Gaps are shown, never made up.
job: sell-and-negotiate
headline: RFP response builder
subhead: A response plan for a tender or security questionnaire that shows what the buyer wants, where you are strong and whether to bid. It marks gaps openly and never invents claims.
explain: |
  A response plan for a tender or security questionnaire that shows what the buyer wants, where you are strong and whether to bid. It marks gaps openly and never invents claims.

  Paste the document. The skill splits it into sections and tags every requirement as must have, weighted or nice to have, and pulls out scoring rules and deadlines. For each requirement it rates your fit as strong, partial or gap, tied to a real proof such as a case study or certificate. It then drafts three to five win themes that tie requirements together. A win-chance estimate factors in incumbent, relationships and rival count, and ends in bid, partner or no-bid.
when:
  - An RFP lands and you must decide fast whether to bid.
  - A customer sends a long security questionnaire.
  - Your team needs one view of every must-have requirement.
  - You want win themes that are more than generic claims.
not_for:
  - "You want a free-form proposal or executive brief: write it with a proposal writer or by hand, since this tool answers the buyer's own questions in their order."
  - "You need to redline a contract after you win: use your lawyer or legal adviser."
  - "You need web copy or sales sheets for many buyers: use a marketing writing tool, not this one."
you_give:
  - The RFP, RFI or questionnaire text
  - Your case studies, certificates and proof points
  - Known competitors or incumbent (optional)
  - Deal size and relationship notes (optional)
you_get:
  - Requirements tagged by priority
  - A fit matrix with proof points and gaps
  - Three to five win themes
  - A win-chance estimate and bid call
  - Draft answers
how_to_use:
  - RFPs and security questionnaires are often confidential. Before you paste, remove client names, confidential pricing and personal details. Check that your AI provider's data terms allow business documents, and that your buyer's rules allow it.
  - Paste the RFP or questionnaire text into your AI, along with this skill's instructions.
  - "Add your proof points: case studies, certificates and references. Say where each one can be checked."
  - Answer the seven check questions the skill asks one at a time, such as whether there is an incumbent. Set your bid threshold before you see the results.
  - Let it sort the requirements, build the fit matrix and draft win themes. Read the gap audit first.
  - The canon files in the skill list the general sources it was built from (books and research). They hold no checked quotes or figures, so do not quote them as evidence.
  - Read the win-chance estimate as a rough guide only. Its default weights, the late-entry drop, the 20% no-bid line and the 70% strong-fit rule on must-haves are placeholders, not research results. Replace them with your own deal history before you rely on any bid call.
  - Next, make the bid call. If you bid, take the win themes and the fit matrix into the sales proposal writer. If not, log the reasons and the gap list for your next review.
  - This skill includes three Python scripts. They need an AI that can run code. In a plain chat, your AI can follow the same steps by hand.
output_sample:
  input:
    - The RFP, RFI or security questionnaire text
    - "Your proof points: case studies, certificates, customer references (with where each can be checked)"
    - Your draft win themes (optional)
    - "Deal context: incumbent, your relationship, number of rivals, deal size (optional)"
  prerequisites:
    - An AI that can run Python code, to use the three scripts. Without code, paste the steps into a chat and work through them by hand.
  output:
    - name: Parsed requirements
      contains: Every requirement tagged must have, weighted or nice to have, plus sections, scoring rules, deadline and format limits.
    - name: Proof-point matrix
      contains: "A table with one row per requirement and these columns: requirement, tag (must have, weighted or nice to have), fit (strong, partial or gap), proof source, and where the proof can be checked."
    - name: Win themes
      contains: Three to five buyer-side themes, showing which requirements each one runs through. Themes in fewer than two are flagged.
    - name: Gap audit
      contains: A plain list of requirements you cannot back up, left open for your team to decide.
    - name: Win-chance estimate
      contains: A percentage with a confidence range and the factors that moved it. It uses placeholder weights, so treat it as a discussion aid only.
    - name: Bid call
      contains: Bid, partner-bid or no-bid, with the named factors behind the call.
