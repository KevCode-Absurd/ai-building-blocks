new_slug: risograph-style-guide
name: Risograph print style guide writer
summary: Describe your product. Get a style guide with a two-colour print look
  on warm paper, plus rules for each part.
job: design-work
headline: Risograph print style guide writer
subhead: "A style guide for a two-colour print look on warm paper: bright pink,
  deep blue and offset shadows that feel hand printed. Your team can build pages
  that look like a risograph poster."
explain: |
  A style guide for a two-colour print look on warm paper: bright pink, deep blue and offset shadows that feel hand printed. Your team can build pages that look like a risograph poster.

  You describe the product. The skill restates the design idea in one line, then sets the foundations: warm off-white paper as the background, pink kept only for things people click, and blue for headings and the offset shadow. It fixes type sizes, a friendly sans font, spacing and tokens. It then writes rules for each component with states and variants, plus accessibility rules to WCAG 2.2 AA. It closes with tone examples, things to avoid and a review checklist.
when:
  - You want a playful print look instead of a plain web style.
  - A zine, event or creative brand needs a consistent site.
  - Developers need exact colours and spacing for the style.
  - You want pink to mean click, and nothing else.
you_give:
  - A description of your product
  - Your audience
  - Any brand colours to keep (optional)
  - Components or pages you need covered (optional)
you_get:
  - A risograph style guide
  - Colour, type and spacing tokens
  - Component rules with states
  - Accessibility checks
  - Tone examples and a review checklist
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
