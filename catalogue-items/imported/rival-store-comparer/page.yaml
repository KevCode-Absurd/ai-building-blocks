thinking: medium
thinking_why: It gathers public facts and sorts them into clear gaps.
new_slug: rival-store-comparer
name: Rival store comparer
summary: Name your top rivals and get a rival store comparison of their channels, prices and messages, plus the gaps you can win.
job: study-competitors
headline: Rival store comparer
subhead: "A side-by-side look at your top rivals: where they sell, what they charge and how they pitch their products, with the gaps you can step into."
explain: |
  A side-by-side look at your top rivals: where they sell, what they charge and how they pitch their products, with the gaps you can step into. You can see where each rival is strong and where it is thin.

  You name your main rivals and your market. The skill maps their presence on marketplaces, their own stores and social shops. It then compares positioning, messaging, pricing and product range, and how they win customers. Engagement and loyalty signs are set next to each other, and the gaps are listed. The output suggests where you could pull ahead, such as a channel they ignore or a promise they do not make. Findings depend on public information.
when:
  - A new rival appeared on Amazon and you want to know how they sell.
  - You are deciding which sales channel to enter.
  - You need to check if your prices are in line.
  - You want to find a message no one else is using.
not_for:
  - "You need real sales or traffic numbers: use a live marketplace tool or your own store reports, because this works from public pages only."
  - "You need a legal or ad-policy check: ask a lawyer or read the platform's own rules."
  - "You only want to watch one rival's price change each week: a simple saved page alert or a spreadsheet does that."
you_give:
  - Your top competitors
  - Your products and market
  - Channels you care about
  - Your own pricing and positioning (optional)
you_get:
  - Channel presence for each rival
  - Pricing and message comparison
  - Strengths and weak spots
  - Gaps you can win
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick a mode that can search the web if you can.
  - Paste the skill text into the chat.
  - Add your rivals, your products, your market and the channels you care about.
  - Add your own prices and message if you have them (optional).
  - Read the gaps first. A number should come with a public source you can open. "Not found" means no public data, so do not fill it in yourself.
output_sample:
  input:
    - Your top rivals (names or links)
    - Your products and market
    - The channels you care about, such as Amazon or Shopify
    - Your own pricing and positioning (optional)
  prerequisites:
    - An AI that can search the web and open pages works best
  output:
    - name: Competitive landscape overview
      contains: A table of who leads each channel and what gives them the edge.
    - name: Individual competitor deep dive
      contains: "For each rival: channels, positioning, pricing, products, marketing, strengths and weak spots."
    - name: Cross-platform strategy analysis
      contains: Groups rivals by how they sell, such as marketplace first or own store first.
    - name: Positioning map
      contains: A simple map placing rivals by price and quality.
    - name: Marketing strategy comparison
      contains: Side-by-side look at each rival's content, tone and ways of winning customers.
    - name: Performance benchmarking
      contains: Traffic, conversion and order-value figures only where a named public source gives them. Every other cell says "not found". No estimates are made up.
    - name: Strategic opportunities and threats
      contains: Gaps in the market, such as a channel or promise no rival owns.
    - name: Recommendations and next actions
      contains: Steps to defend your position and to pull ahead, with a 30 day to 6 month plan.
