thinking: medium
thinking_why: It follows a standard method and checks the design first.
new_slug: rna-seq-group-difference-finder
name: RNA-seq group difference finder
summary: Find which genes changed between your RNA-seq groups. Give it raw gene counts and a sample sheet. You get corrected p-values, effect sizes and plots.
job: research-topics
headline: RNA-seq group difference finder
subhead: A list of genes that really changed between your groups, with corrected p-values, effect sizes and plots, from the PyDESeq2 tool in Python. Checks come first so a bad input does not give a confident wrong answer.
explain: |
  A list of genes that really changed between your groups, with corrected p-values, effect sizes and plots, from the PyDESeq2 tool in Python. Checks come first so a bad input does not give a confident wrong answer.

  You give raw integer counts and a sample sheet. The skill makes sure samples match, uses only raw counts (not TPM or FPKM), and sets up the design and the exact comparison you want. It runs the Wald test, corrects for many tests so false hits are controlled, and shrinks effect sizes to match the model. Results come with volcano and other plots. It insists on true biological replicates, since cells or lanes from one donor do not count.
when:
  - You have counts from treated and control samples and want the changed genes.
  - You need a design with batch or other covariates.
  - A reviewer asked for corrected p-values and effect sizes.
  - You want volcano plots for a paper.
not_for:
  - "You have single-cell data and want per-cell tests: first sum counts per donor into pseudobulk, then use this skill on those totals."
  - "You have only one sample per group, or cells and lanes from one donor: get more donors first, since this needs true biological replicates."
  - "You only have TPM, FPKM or log values: go back to the raw integer counts, because this skill cannot use them."
you_give:
  - A raw counts table. The skill's script expects genes in rows and samples in columns by default. If yours has samples in rows, tell your AI to use --no-transpose
  - A sample sheet with group labels
  - The comparison to test
  - Covariates such as batch (optional)
  - Python 3.11 or newer with PyDESeq2
you_get:
  - A table of genes with changes and corrected p-values
  - Shrunk effect sizes
  - Volcano and related plots
  - Input checks and a note on what was excluded
how_to_use:
  - Use an AI that can run code. Download the skill folder and add it to your AI tool. A plain chat cannot run the script.
  - Install Python 3.11 or newer, then PyDESeq2 version 0.5.4, in a fresh environment.
  - Put your counts file and your sample sheet in one folder. Each file needs sample or gene names in its first column.
  - Ask your AI to run the script with your counts, your sample sheet, your design (for example batch plus condition), the comparison to test (for example treated against control) and an output folder.
  - Read the input checks first. Then open the corrected p-values and the plots.
  - Next, report the excluded samples and genes from the manifest with your results. To find which pathways your changed genes share, pass the signed Wald statistic from deseq2_results_unshrunken.csv to a ranked enrichment tool.
output_sample:
  input:
    - Your raw counts table, one count per gene and sample
    - Your sample sheet with a group label for each sample
    - The comparison to test, such as treated versus control
    - Batch or other covariates (optional)
  prerequisites:
    - An AI that can run code
    - Python 3.11 or newer with PyDESeq2 0.5.4 installed
  output:
    - name: deseq2_results.csv
      contains: Every gene with its effect size, Wald statistic, p-value and corrected p-value. Effect sizes are shrunk if you asked for that.
    - name: deseq2_results_unshrunken.csv
      contains: The original test table before effect sizes were shrunk.
    - name: significant_genes.csv
      contains: Genes whose corrected p-value is below your chosen cutoff.
    - name: results_sorted_by_padj.csv
      contains: All results ordered from the smallest corrected p-value to the largest.
    - name: deseq_dataset.h5ad
      contains: A snapshot of the fitted data with counts and model fields, for inspection.
    - name: analysis_manifest.json
      contains: The comparison, cutoff, shrinkage coefficient and software versions used in the run.
    - name: Volcano and MA plots
      contains: Two PNG plots of the results, made only when you ask for plots.
