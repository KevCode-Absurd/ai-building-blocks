thinking: medium
thinking_why: It builds many linked road parts from a clear layout.
new_slug: road-map-author
name: Road map author
summary: Describe the road layout. Get lanes, junctions, signs and signals built
  as a RoadRunner HD map.
job: build-software
headline: Road map author
subhead: A road network built from your description as a RoadRunner HD map file,
  with lanes, boundaries, markings, junctions, signs, signals, barriers and
  parking. You get a scene that can be used to test automated driving.
explain: |
  A road network built from your description as a RoadRunner HD map file, with lanes, boundaries, markings, junctions, signs, signals, barriers and parking. You get a scene that can be used to test automated driving.

  You describe the layout, or point to data from another map source. The skill writes MATLAB scripts that build each element through the roadrunnerHDMap tools. It uses ready methods for detecting lane direction, drawing centre lines at least one point per metre, shaping junction areas, snapping ends together and splitting loops. Code goes in .m files and runs from there. It needs MATLAB and RoadRunner.
when:
  - You need a test road for a driving simulation.
  - You are assembling a map from converted data and need the building pieces.
  - An existing map file throws errors from wrong property names.
  - You want a junction, signs and signals added to a road.
you_give:
  - A description of the road layout
  - Source map data (optional)
  - Which signs, signals or barriers to add (optional)
  - MATLAB with RoadRunner access
you_get:
  - A RoadRunner HD map (.rrhd) file
  - Lanes, boundaries and markings
  - Junctions, signs and signals
  - MATLAB scripts that built it
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with RoadRunner.
