thinking: medium
thinking_why: It builds many linked road parts from a clear layout.
new_slug: road-map-author
name: Road map author
summary: Describe a road layout and get a RoadRunner HD map built in MATLAB. For driving-software engineers with paid MathWorks tools.
job: build-software
headline: Road map author
subhead: A road network built from your description as a RoadRunner HD map file, with lanes, boundaries, markings, junctions, signs, signals, barriers and parking. You get a scene that can be used to test automated driving.
explain: |
  A road network built from your description as a RoadRunner HD map file, with lanes, boundaries, markings, junctions, signs, signals, barriers and parking. You get a scene that can be used to test automated driving.

  Cost and licence: this skill only works with paid MathWorks products (MATLAB, RoadRunner, RoadRunner Scene Builder and Automated Driving Toolbox). The LICENSE.md file in this item is BSD 2-Clause plus a rule that you may use the skill only with MathWorks products. The skill file also links MathWorks' own reuse licence, which says the same. Follow LICENSE.md. Credit goes to MathWorks.

  You describe the layout, or point to data from another map source. The skill writes MATLAB scripts that build each element through the roadrunnerHDMap tools. It uses ready methods for detecting lane direction, drawing centre lines at least one point per metre, shaping junction areas, snapping ends together and splitting loops. Code goes in .m files and runs from there. It needs MATLAB and RoadRunner. It is made for simulation and driving-software engineers, so it is not for general business use.
when:
  - You need a test road for a driving simulation.
  - You are assembling a map from converted data and need the building pieces.
  - An existing map file throws errors from wrong property names.
  - You want a junction, signs and signals added to a road.
not_for:
  - "You need a map from a source file format only, such as Lanelet2 or OpenDRIVE: use a converter for that format, then use this skill to build the pieces."
  - "You have no MATLAB or RoadRunner: ask a simulation engineer to build the road, or use a free road editor."
  - "You want to draw a road by hand with a mouse: use the RoadRunner editor directly."
you_give:
  - "Your road layout in plain words: lane count, lane width, road length and speed limit"
  - Where roads meet and what each junction looks like
  - Which signs, signals, barriers or parking to add (optional)
  - Source map file and its coordinate system (optional)
you_get:
  - A RoadRunner HD map (.rrhd) file
  - Lanes, boundaries and markings
  - Junctions, signs and signals
  - MATLAB scripts that built it
how_to_use:
  - This is for simulation and driving-software engineers who already have paid MATLAB and RoadRunner. If you run a business and do not work with these tools, do not start here.
  - Check you have MATLAB and RoadRunner. Both are paid products and must be installed and licensed before you start. Your AI must be able to run code, or you must run the scripts yourself.
  - "Gather these first: lane count, lane width in metres, road length, junction layout, speed limit, and any source file with its coordinate system."
  - Paste the skill into your AI, or add its folder if your AI takes files.
  - "Describe your road: lanes, widths, length, junctions, signs and signals. Add any source map file."
  - Ask your AI to write the MATLAB scripts and run the checks before it writes the map file.
  - "The final files are two things: the .rrhd map file and the .m scripts that built it. Save both in one project folder. A run passed when every check reports pass and the .rrhd file opens in RoadRunner. The checks cover alignment, fit and sizes, and run before the file is written."
  - "Asset paths for signs and barriers must be set by hand, because MathWorks' RoadRunner asset mapping skill is not in this library. Lane marking paths are listed in the skill. For the rest, open your RoadRunner project, find each sign or barrier in the Library Browser, and note its path from the Assets folder, such as Assets/Signs/... Give your AI that list."
  - Open the .rrhd file in RoadRunner and look at lanes, junctions and signs before you use it in a test.
  - "Next: import the finished file into RoadRunner with the Road scene importer."
next: [road-scene-importer]
output_sample:
  input:
    - Your road layout in plain words, such as lanes, width and length
    - Source map data (optional)
    - Signs, signals or barriers to add (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with the RoadRunner HD Map tools installed
  output:
    - name: Map build scripts (.m files)
      contains: MATLAB code that builds each road part with the roadrunnerHDMap tools, in the order they must be built.
    - name: Lanes and boundaries
      contains: Lanes with correct direction, shared boundaries between lanes and centre lines with enough points.
    - name: Markings
      contains: Lane line markings placed with standard marking assets.
    - name: Junctions
      contains: Junction areas shaped from the roads that meet, with road ends snapped together.
    - name: Signs, signals, barriers and parking
      contains: The extra road items you asked for, placed on the map.
    - name: Enforcement checks
      contains: Checks on alignment, spatial fit and sizes that must pass before the map file is written.
    - name: RoadRunner HD map (.rrhd)
      contains: The finished map file you can open in RoadRunner and use in driving tests.
