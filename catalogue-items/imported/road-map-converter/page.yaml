thinking: medium
thinking_why: It maps each road feature across formats and checks the result.
new_slug: road-map-converter
name: Road map converter
summary: Convert a Lanelet2 map to a RoadRunner HD map file. Give it your .osm file and get an .rrhd scene with lanes, junctions and signs.
job: build-software
headline: Road map converter
subhead: A Lanelet2 map turned into a RoadRunner HD map file you can open and simulate. It finishes only when the eight supporting files from the Road map author item are added. Without them it stops partway and lists the steps left.
explain: |
  You get an .rrhd file only after the eight supporting files from the Road map author item are added. Without them you get a partial result and a list of the steps that are blocked: centre line synthesis, closed-road splitting, endpoint snapping, height conflicts, boundary alignment and boundary deduplication. The eight files are in this library, in the Road map author item. Add that item's folder to your AI.

  This copy is an imported MathWorks skill under BSD 2-Clause plus a rule that you may use it only with MathWorks products (see LICENSE.md).

  It reads the .osm file and its lanelet relations, then builds boundaries, lanes, centre lines, junctions, barriers, signs, markings and speed limits. Boundary points are never changed, and each boundary is built once. Lane direction is worked out for every lane, never assumed. Before saving, checks run on alignment, position, extensions and completeness. It works through MATLAB script files and needs MATLAB with RoadRunner. Plain OpenStreetMap roads or OpenDRIVE files need a different route.
when:
  - You have an open-source Lanelet2 map and want it in RoadRunner.
  - You are building driving scenes from public map data.
  - A past conversion left out junctions or signs.
  - You need an .rrhd file for simulation tests.
not_for:
  - "Your file is a plain OpenStreetMap export with no lanelet relations: this tool will stop with an error, so export a Lanelet2 map instead."
  - "Your file is OpenDRIVE (.xodr): import it straight into RoadRunner, no conversion needed."
  - "You want to build a road map from scratch with no source file: use a RoadRunner authoring workflow or draw it by hand in RoadRunner."
you_give:
  - Your Lanelet2 map file (.osm)
  - Your map_projector_info.yaml file, if you have one (optional)
  - A RoadRunner project folder
  - "The eight supporting files from roadrunner-rrhd-authoring: references/splitClosedGeometry.md, synthesizeCenterLine.md, alignmentRules.md, orthogonalSplit.md, apiReference.md, deduplicateBoundaries.md, and scripts/snapConnectedEndpoints.m, resolveHeightConflicts.m"
  - Where to save the result (optional)
you_get:
  - A RoadRunner HD map (.rrhd) file
  - Lanes, junctions, signs and markings
  - Check results before saving
  - Conversion scripts you can rerun
how_to_use:
  - This is for simulation and driving-software engineers who already have paid MATLAB and RoadRunner licences. If your team does not use these tools, do not start here. Ask a simulation engineer, or import OpenDRIVE files straight into RoadRunner instead.
  - Check you have MATLAB and RoadRunner. Both are paid and must be installed and licensed before you start. The licence (BSD 2-Clause plus MathWorks terms, see LICENSE.md) lets you use this only with MathWorks products such as MATLAB.
  - Use an AI that can run MATLAB code and write files, through the MATLAB MCP tool. A plain chat window or any other code runner cannot finish this job. This copy leaves out eight supporting files from the original roadrunner-rrhd-authoring skill. Your AI should stop and ask you for them before it does the steps that need them.
  - Paste this skill into your AI and give it your .osm file, your project folder and where to save the result.
  - To finish the whole job, also add the Road map author item's folder, which holds the eight supporting files. Without it, your AI stops partway.
  - Let your AI run the steps it can. When it reaches a step that needs one of the eight missing files, it must stop and ask you for them, not guess the geometry. Once you supply them, it carries on to the end.
  - Check that the results list shows all checks passed before the file is saved.
  - Open the new .rrhd file in RoadRunner and look over lanes, junctions and signs.
  - Next, compare the junction, sign and speed-limit counts in the new .rrhd with the source .osm. Rerun the saved .m scripts after any edit. Then import the file into your scene with the Road scene importer.
next: [road-map-author, road-scene-importer]
output_sample:
  input:
    - Your Lanelet2 map file (.osm)
    - Your map_projector_info.yaml file, if you have one (optional)
    - Where to save the result (optional)
  prerequisites:
    - MATLAB with RoadRunner installed and licensed (both are paid products)
    - The eight supporting files, found in the Road map author item
    - An AI that can run MATLAB code and write script files
    - A RoadRunner project folder
    - An AI that can run code, to use the scripts that come with this skill
  output:
    - name: MATLAB script files (.m)
      contains: The conversion steps your AI wrote and ran, saved so you can rerun or edit them.
    - name: Boundaries and lanes
      contains: One boundary per road edge, lane direction worked out for each lane, and centre lines for every lane.
    - name: Junctions
      contains: Places where lanes meet, found from the map and built into the scene.
    - name: Barriers, signs, markings and speed limits
      contains: Every non-lane item found in the map, built as scene objects.
    - name: Check results
      contains: Pass or fail results for alignment, position, extensions and completeness, run before saving. They appear only after the eight supporting files are supplied. Until then your AI lists the steps it could not run.
    - name: RoadRunner HD map (.rrhd)
      contains: The finished map file, ready to open in RoadRunner for simulation. It is written only after the eight supporting files are supplied and every check passes. Otherwise you get a partial result and a list of what is left.
