thinking: low
thinking_why: It runs a short set of load steps.
new_slug: road-scene-importer
name: Road scene importer
summary: Load a map file into RoadRunner and check your driving scene by eye. Give it an RRHD or OpenDRIVE file. You get a saved scene.
job: build-software
headline: Road scene importer
subhead: A map file loaded into RoadRunner as a driving scene you can look over by eye, so you can see whether a conversion worked. Setup mistakes are caught before the import runs.
explain: |
  A map file loaded into RoadRunner as a driving scene you can look over by eye, so you can see whether a conversion worked. Setup mistakes are caught before the import runs.

  It takes an RRHD or OpenDRIVE file, copies it into the RoadRunner project folder and checks the file type and build options. Bridge detection is turned on on purpose, not left to defaults. By default it only loads the map; building the full scene is a step you ask for. It works through MATLAB script files and needs a running RoadRunner connection from the core skill. Launching the app and making maps are handled elsewhere.
when:
  - You just converted a map and want to see it in 3D.
  - You have an OpenDRIVE file to bring into RoadRunner.
  - You want asphalt, bridges or junctions set when building a scene.
  - You need to check that a converted road looks right.
not_for:
  - "You need to open RoadRunner or manage projects: use the roadrunner-core skill first."
  - "You need to turn a Lanelet2 map into RRHD: use the Lanelet2 to RoadRunner map converter."
  - "You need to write or edit road content in an RRHD file: use the RoadRunner road map builder."
you_give:
  - A map file (.rrhd or .xodr)
  - A running RoadRunner session
  - Build options such as asphalt or bridges (optional)
  - Whether to load only or also build (optional)
you_get:
  - The map imported into a RoadRunner scene
  - A copy of the file in the project folder
  - Build options applied
  - A scene ready for visual checking
how_to_use:
  - You need paid MATLAB and paid RoadRunner licences before you start. The LICENSE.md in this item is BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. The MathWorks licence page linked in the skill file (PMRL) sets the same limit. Follow LICENSE.md.
  - Open an AI that can run MATLAB code and has your RoadRunner session connected. Set that up first with the roadrunner-core skill.
  - Paste in this skill, or upload its folder.
  - Give your AI the path to your map file and say whether you want to load only or also build.
  - Tell it your asphalt, bridge or junction choices if you have any. Ask it to check if your map has closed loops.
  - Let it run the checks and the import. It reports pass or fail for each check (file location, file type and, for a build, the build options) before it imports. Fix anything the checks flag.
  - The scene is saved in your RoadRunner project folder under your map's file name.
  - "Open the saved scene, which sits in your RoadRunner project folder and is named after your map. Look over the roads by eye: that lanes run on without breaks, and that junctions and bridges look right. Only then ask for a full build."
  - "Next: if you find broken lanes or junctions, fix them in the map file with the Road map author, or rerun the Road map converter if the map came from Lanelet2. Then import again. Once the scene looks right, use it in your driving simulation tests."
terms:
  - term: RRHD
    meaning: RoadRunner HD map, the .rrhd file format that stores lanes, boundaries, junctions and signs for RoadRunner.
  - term: rrApp
    meaning: The MATLAB connection to a running RoadRunner app. The roadrunner-core skill from MathWorks sets it up; it is not in this library.
  - term: OpenDRIVE
    meaning: A common open file format (.xodr) for road networks used in driving simulation.
output_sample:
  input:
    - Your map file (.rrhd or .xodr)
    - Your RoadRunner project folder
    - Build options such as asphalt, bridges or junctions (optional)
    - Whether to only load the map or also build the scene (optional)
  prerequisites:
    - A paid MATLAB licence
    - A paid RoadRunner licence
    - An AI that can run MATLAB code and files
    - A running RoadRunner connection (the rrApp handle) from the roadrunner-core skill
  output:
    - name: Project folder copy
      contains: Your map file, copied into the RoadRunner project folder before the import runs.
    - name: Checks before import
      contains: A pass or fail on the file location, the file type and the build options.
    - name: Imported scene
      contains: Your map loaded into a new RoadRunner scene, with bridge detection on and junctions kept.
    - name: Build result
      contains: The full built scene, only when you ask for a build. Otherwise the map is only loaded.
    - name: Saved scene
      contains: A scene file named after your map, ready for you to look over by eye.
