thinking: medium
thinking_why: It loads or builds a known model type.
new_slug: robot-arm-modeler
name: Robot arm modeler
summary: Name your robot arm and get a MATLAB robot arm model, with collision shapes and checked inverse kinematics, ready for moves and reach checks.
job: build-software
headline: Robot arm modeler
subhead: A MATLAB robot arm model you can trust, so later moves and reach checks do not quietly go wrong. Name the arm, such as a UR5e, KUKA iiwa or Panda, and it builds the model.
explain: |
  A MATLAB robot arm model you can trust, so later moves and reach checks do not quietly go wrong. Name the arm, such as a UR5e, KUKA iiwa or Panda, and it builds the model.

  It picks the best source it can find: the built-in robot library first, then your URDF file, then DH parameters. Collision shapes matter, because a model without them lets a planner call a path clear when it is not. It also helps you attach a gripper, choose between the two inverse kinematics solvers, and checks each solution for exit flags, position error and smooth joint changes. You need MATLAB with the robotics toolbox.

  Licence: this copy is under BSD 2-Clause (see the LICENSE.md file in this item). The skill file also links MathWorks' own reuse licence, which means you may use it only with MathWorks products such as MATLAB. Follow the LICENSE.md file. Credit goes to MathWorks.
when:
  - You need a MATLAB model of a named arm like a UR5e or Panda for a simulation.
  - You have a URDF file and want it loaded with meshes kept.
  - You want to attach a gripper and check that the arm can reach a target.
  - You solved inverse kinematics and want proof the answer is valid.
not_for:
  - "You need collision-free path planning with RRT or CHOMP: use a motion planning tool, since this only builds and checks the model."
  - "You need a smooth trajectory between poses: use a trajectory tool, not this model builder."
  - "You have a delta robot or Stewart platform with closed loops: this does not cover them, so ask your robot maker for a model."
you_give:
  - The arm name or your URDF or DH parameters
  - Target poses to reach (optional)
  - Gripper details (optional)
  - What you plan to do next, such as animate or pick and place (optional)
you_get:
  - A MATLAB robot model (rigidBodyTree) ready to use
  - Collision and visual shapes added where they were missing
  - A tool frame at the end of the arm, with your gripper attached if you gave details
  - A table for each target pose with the solver exit flag, position error and largest joint jump
  - A note on any gaps in the model
how_to_use:
  - Open an AI that can run MATLAB. You need paid MATLAB with Robotics System Toolbox. The skill's licence lets you use it only with MathWorks products.
  - Paste the skill text into the chat, then send your first request, for example: "Load a UR5e with loadrobot, attach a gripper and check the home pose."
  - Give the arm name, or attach your URDF file or DH parameters.
  - Add target poses and gripper details if you have them (optional).
  - Say what you plan to do next, such as animate or pick and place.
  - Read the checks table and gap notes before you use the model.
  - Next, pass the model to a motion planner or a trajectory tool, such as the Robot arm motion planner.
next: [robot-arm-motion-planner]
output_sample:
  input:
    - The arm name, such as a UR5e, KUKA iiwa or Panda, or your URDF file or DH parameters
    - Target poses to reach (optional)
    - Gripper details (optional)
    - What you plan to do next, such as animate or pick and place (optional)
  prerequisites:
    - An AI that can run MATLAB
    - MATLAB with Robotics System Toolbox (the loadrobot call needs release R2019b or later)
  output:
    - name: Robot model
      contains: A MATLAB rigidBodyTree for your arm, loaded from the library, a URDF file or DH parameters.
    - name: Tool frame
      contains: A tool0 frame at the end of the arm with Z pointing outward, so poses and grippers line up.
    - name: Model setup
      contains: Collision and visual shapes added where missing, plus your gripper attached if you gave details.
    - name: Kinematics check
      contains: A forward kinematics test that shows the model behaves as expected at a known pose.
    - name: IK validation
      contains: For each target, the solver exit flag, position error and largest joint jump, so you can trust each answer.
    - name: Gap notes
      contains: A short note on anything missing or uncertain in the model.
