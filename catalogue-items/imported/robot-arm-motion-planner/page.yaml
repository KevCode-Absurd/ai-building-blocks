thinking: medium
thinking_why: It picks a planner and checks the path.
new_slug: robot-arm-motion-planner
name: Robot arm motion planner
summary: Plan a robot arm motion path in MATLAB. Give it start and goal poses. You get a collision-free path and a timed trajectory within speed limits.
job: build-software
headline: Robot arm motion planner
subhead: An arm that moves from pose A to pose B along a path that avoids obstacles, with timing that respects speed and acceleration limits. That is what you finish with, as MATLAB code you can run.
explain: |
  An arm that moves from pose A to pose B along a path that avoids obstacles, with timing that respects speed and acceleration limits. That is what you finish with, as MATLAB code you can run.

  It starts by requiring a proper robot model, because planning on a bad model gives false safe paths. You describe the obstacles as a collision world. It then helps you choose a planner: RRT for fast random search, CHOMP for smoother optimised paths. The raw path is shortened, then turned into a timed trajectory, such as time-optimal, constant speed for welding, or trapezoidal. A last check confirms the full trajectory is free of collisions. You need MATLAB with the robotics toolbox.
when:
  - You have two arm poses and need a safe path between them.
  - A tool must move at constant speed along a seam, like welding or cutting.
  - Your workspace has boxes or meshes the arm must not touch.
  - You already have waypoints and need them joined into timed moves.
not_for:
  - "You need to build or load the robot model, or solve IK and FK: use the robot kinematics skill first, then come back here."
  - "You plan paths for wheeled robots or ground vehicles: use a mobile robot navigation tool or a person who knows your platform."
  - "You want to simulate forces and torques, or turn the planner into deployable code: this skill does neither, so use a dynamics tool or MATLAB Coder."
you_give:
  - A robot model already set up in MATLAB
  - Start and goal poses or joint values
  - Obstacle shapes or an environment map (optional)
  - Speed and acceleration limits (optional)
you_get:
  - A collision-free path between your poses
  - A timed trajectory that respects limits
  - Planner choice with reasons
  - A collision check of the final motion
how_to_use:
  - Get your robot model ready in MATLAB first. If you do not have one, use the robot kinematics skill to build it.
  - Open an AI that can run MATLAB code. You need MATLAB with Robotics System Toolbox, which is a paid product. The skill's licence lets you use it only with MathWorks products.
  - Gather first: the name of your robot model variable, your start and goal poses (as joint values or as position and rotation), the obstacle shapes or map, and your speed and acceleration limits.
  - Paste the skill into your AI. Then add them.
  - Check the planner your AI picks and the reason it gives. Ask for a different one if it does not fit.
  - Read the collision check on the final timed motion before you trust the path.
  - Test the trajectory in simulation before you run it on a real arm. Review it with a person who is trained on that arm, and have an emergency stop within reach for the first run.
  - Next, build the model with the Robot arm modeler if you have not, and run a collision review before any real arm run.
next: [robot-arm-modeler]
output_sample:
  input:
    - Your robot model, already set up in MATLAB
    - Start and goal poses, or joint values
    - Obstacle shapes or an environment map (optional)
    - Speed and acceleration limits (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with Robotics System Toolbox, which is a paid product
    - A robot model from the robot kinematics skill, if you do not have one yet
  output:
    - name: Collision risk check
      contains: A note on whether obstacles exist in the workspace, so collision safety is planned in from the start.
    - name: Environment model
      contains: Your obstacles set up as a collision world the planner can use.
    - name: Planner choice
      contains: The planner picked for your task, such as RRT or CHOMP, with the reason.
    - name: Planned path
      contains: A collision-free path from your start pose to your goal pose, shortened where possible.
    - name: Timed trajectory
      contains: The path turned into timed moves that respect speed and acceleration limits, such as time-optimal or constant speed.
    - name: Collision verification
      contains: A check that the whole timed motion stays clear of obstacles.
    - name: Visualization
      contains: A plot or animation of the arm following the planned motion.
