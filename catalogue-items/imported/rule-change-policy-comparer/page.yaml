thinking: high
thinking_why: It pulls duties from rule text and matches them to policies.
new_slug: rule-change-policy-comparer
name: Rule change policy comparer
summary: Find which of your policies a changed rule touches. Paste the rule and your policy list to get a gap list of what to edit. First check only.
job: check-contracts
headline: Rule change policy comparer
subhead: "Paste in a rule that just changed and see which of your own policies it touches. You get a gap list: what the rule now asks for, what your policy says and what to edit."
explain: |
  Paste in a rule that just changed and see which of your own policies it touches. You get a gap list: what the rule now asks for, what your policy says and what to edit. This is a first check, not legal advice.

  It confirms the rule is real and current, pulls out each requirement, then matches each to your indexed policies. If you ask it to leave a section out, it does, but marks a warning on every page that follows, so nobody mistakes a partial review for a full one. It also notes when no policy covers a topic at all. A lawyer should review the result before you act.
when:
  - A regulator published a new rule and you need to know which policies it affects.
  - You must report to leadership on what has to change and in which document.
  - You want a gap list before asking outside counsel for help.
  - A rule feed flagged a major update and someone must triage it.
not_for:
  - "You need legal advice or a final sign-off: have a lawyer or outside counsel review the result before you act."
  - "The rule is only a request for comment, with no duties yet: the skill gives a short note on which policies may change later, not a full gap list."
  - "You have no policies written down yet: write or collect them first, or expect every duty to show as a new policy needed."
you_give:
  - The rule name, text or a summary
  - Your policy library or an index of it
  - Sections to leave out (optional)
  - Your sector and where you operate
you_get:
  - A list of requirements pulled from the rule
  - A gap analysis for each policy
  - Which policies need editing
  - A clear warning if scope was limited
how_to_use:
  - "Before you start: the skill reads your policy list from a folder the full Claude plugin sets up. Without that plugin, paste your policy list into the chat, with the owner of each policy."
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. It works best where your AI can read files.
  - Paste the rule name, text or a summary. If you only have part of the rule, the AI will ask before it looks anything up.
  - Add your list of policies, with the owner of each. Say if any section should be left out (optional).
  - Read the rule status line first. If the AI could not check the rule is in force, confirm that yourself before you trust any date.
  - Review each gap with the policy owner, then have a lawyer check the result before you change anything.
  - Where the skill mentions /regulatory-legal:cold-start-interview, that command exists only in the full Claude plugin. Without it, paste your policy list each time, or use the setup-interview folder to write it down once.
  - Without web or research access, the rule's status stays unverified. Check the Federal Register or ask counsel before you trust any due date.
output_sample:
  input:
    - The rule name, text or a summary
    - Your policy library or an index of it, with owners
    - Sections to leave out (optional)
    - Your sector and where you operate
  prerequisites:
    - A saved list of your policies and who owns each one
    - Web or research access to confirm the rule is still in force (optional)
  output:
    - name: Rule status banner
      contains: A warning at the top if the AI could not confirm the rule is in force, with each due date tagged.
    - name: Scope limitation warning
      contains: A warning shown if you asked to leave a section out, so nobody reads it as a full review.
    - name: Bottom line
      contains: How many gaps need action, by when, and the top three.
    - name: Summary table
      contains: Each requirement matched to a policy, the size of the gap and the owner.
    - name: Detailed diffs
      contains: "For each requirement: what the rule asks, what your policy says, the gap and the exact change needed."
    - name: New policies needed
      contains: "Requirements no policy covers, with options: draft a new policy, add a section, or decide none is needed."
    - name: No-gap requirements
      contains: The duties your policies already cover.
