thinking: medium
thinking_why: It walks a fixed roadmap and makes a few stack choices.
new_slug: saas-mvp-roadmap-planner
name: SaaS MVP roadmap planner
summary: "Plan your SaaS MVP roadmap: give it your idea and get a stack choice, build order and launch checklist you can follow step by step."
job: build-product
headline: SaaS MVP roadmap planner
subhead: "A clear route from idea to first paying customers: which tools to use, what to build in which order and what to check before going live."
explain: |
  A clear route from idea to first paying customers: which tools to use, what to build in which order and what to check before going live. It is for building the first version of a software product.

  It starts with a gut check before code. Can you state the problem in one sentence, name the exact customer and find three people who would pre-pay? If not, it says do not build yet. Then it picks a stack, such as Next.js, Postgres, a sign-in service and Stripe, and shows a project layout. It covers sign-in, billing, database design and multi-tenant setup, and ends with a launch checklist.
when:
  - You are starting a software product from scratch and need a build order.
  - You cannot decide between tools for sign-in, database and payments.
  - You want a checklist before launching to real users.
  - An early product needs a technical check.
not_for:
  - "You sell a physical product or a service, not software: use a simple plan on paper or ask a business advisor."
  - "You want to review a mature SaaS with real users: ask an engineer for a full code and security review."
  - "You only want help writing the code for one feature: ask your AI directly, with your own files pasted in."
you_give:
  - Your product idea
  - Who the customer is
  - Your coding skills or team size (optional)
  - Tools you already prefer (optional)
you_get:
  - A validation checklist
  - A recommended tool stack with reasons
  - A project structure
  - A launch checklist
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code needs to run for the plan.
  - Write your idea in one sentence and name your exact customer. Add your team size and favourite tools if you have them.
  - Ask your AI to start with the validation checklist. Answer its questions honestly. If you cannot find 3 people willing to pre-pay, hold off on building.
  - Read the stack table and folder layout. Ask it to swap any tool you dislike.
  - Build in the order it gives you. You need your own code editor and accounts, such as Stripe and hosting, for the build itself.
  - Before you launch, go through the pre-launch checklist and tick off each item.
  - Tools such as Stripe, Clerk, Vercel and Railway cost money as you grow, and the code samples are tied to certain library versions. Check prices and docs before you build.
  - Next, hand the build order to a developer or an AI coding tool, one step at a time.
next: [saas-starter-builder, saas-pricing-designer, saas-terms-check]
output_sample:
  input:
    - Your SaaS idea in one sentence
    - Who your exact customer is
    - Your coding skills or team size (optional)
    - Tools you already prefer (optional)
  prerequisites:
    - Accounts for tools you pick, such as Stripe for payments, a sign-in service and hosting. Some of these are paid.
  output:
    - name: Validation checklist
      contains: Questions about the problem, the customer and what they pay now, plus a rule on whether to build yet.
    - name: Tech stack table
      contains: A tool for each layer, such as frontend, database, sign-in, payments and email, with a reason for each.
    - name: Project structure
      contains: A folder layout for the app, with places for sign-in pages, the dashboard, marketing pages and the API.
    - name: Core database schema
      contains: Tables for users, workspaces and subscriptions, so many teams can share one app.
    - name: Sign-in and Stripe setup
      contains: Example code to protect pages and start a paid subscription checkout.
    - name: Pre-launch checklist
      contains: Checks for technical, product and marketing tasks to finish before real users arrive.
