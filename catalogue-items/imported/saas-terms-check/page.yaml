thinking: high
thinking_why: Small clauses can cost real money, so it reads closely.
new_slug: saas-terms-check
name: Software subscription terms checker
summary: Give it a software subscription contract. Get renewal traps, price
  rises, uptime and data terms flagged. A first check, not legal advice.
job: check-contracts
headline: Software subscription terms checker
subhead: "A subscription contract can cost far more over three renewals than in
  year one. Give it a software agreement and it flags the traps: auto-renewal
  windows, price rises, uptime promises and what happens to your data."
explain: |
  A subscription contract can cost far more over three renewals than in year one. Give it a software agreement and it flags the traps: auto-renewal windows, price rises, uptime promises and what happens to your data. It is a first check, not legal advice.

  It runs your standard contract review, then adds checks that matter most for subscriptions: renewal notice periods, caps on price increases, service credits, exit and data return rights, and who handles your data downstream. It warns that rules differ by place, since California, New York and the EU are not the same, and it will not quietly guess to fill gaps.
when:
  - A vendor sent a software contract and you must reply before it renews.
  - You want to know when you can cancel without paying for another year.
  - You need to confirm what happens to your data if you leave.
  - Your finance team wants price rise limits written into the deal.
you_give:
  - The subscription contract or terms
  - Your standard terms or playbook (optional)
  - Where you operate
  - Your budget or key worries (optional)
you_get:
  - Flagged renewal and price traps
  - Notes on uptime and support terms
  - Data and exit terms review
  - Suggested changes to ask for
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your own rules for what you will accept.
  - Where the skill points to /commercial-legal:cold-start-interview, use the
    setup-interview folder inside it. We copied it in so the skill works on its
    own.
