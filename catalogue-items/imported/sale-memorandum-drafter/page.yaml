thinking: medium
thinking_why: It organises large facts into a long document.
new_slug: sale-memorandum-drafter
name: Sale memorandum drafter
summary: Give it your company facts. You get a draft sale memorandum (CIM) with a clear order and story, set up for Indian deals and April to March years.
job: money-and-investing
headline: Sale memorandum drafter
subhead: The long document buyers read first when a company is for sale, drafted from your facts. It has to tell a clear story, and this gives it a set order and flow.
explain: |
  The long document buyers read first when a company is for sale, drafted from your facts. It has to tell a clear story, and this gives it a set order and flow.

  You bring what you have: management slides, three to five years of accounts, forecasts, customer data and an org chart. The draft starts with a short summary and five to seven reasons to buy. Then it covers the company, its market, products, customers, operations, financials and the deal. It is set up for Indian deals, so it uses April to March years and lakh and crore units, and says where India has no equivalent.

  This is a copy of the cim-builder skill from nighomni123/fsi-skills-india, under the Apache 2.0 licence (see the LICENSE file in this item). We edited only its India section so it works alone. The two companion India skills it was built with are not part of this item.
when:
  - You are selling a company and need a first draft of the sale document.
  - You have scattered slides and spreadsheets and need one story.
  - An advisor asked for a memorandum outline to review.
  - You want investment highlights written clearly for buyers.
not_for:
  - You are selling only some assets, or raising early funds. Use a short teaser or a pitch deck instead.
  - You need a valuation or a financial model. Ask your advisor or a finance person to build it.
  - You need the legal confidentiality page or deal terms. Ask your lawyer to write them.
you_give:
  - Management presentations
  - Three to five years of financials
  - Forecast or budget
  - Customer and org chart details (optional)
you_get:
  - A section-by-section memorandum draft
  - Seven or fewer investment highlights
  - A financial summary with correct units
  - A list of missing facts to collect
how_to_use:
  - "Gather first: three to five years of accounts as PDF or Excel with the year labels (FY, April to March), your latest forecast, management slides, and customer and org chart details if you have them."
  - Before you paste anything, check your confidentiality and NDA terms. Send financial and customer data only to an AI tool your NDA allows, because a general consumer AI tool may breach those terms. Remove or anonymise names of customers and staff first.
  - "Open Claude, ChatGPT or Gemini. Paste in the full skill text, the whole SKILL.md for this item, from this page. The two companion India skills are not part of this item, so the rules are written into the skill: years run April to March, and amounts use lakh and crore. In Excel, never use a number format with trailing commas to show crore. It shows lakh under a crore label, a 100 times error. Divide by 10000000 in a formula instead."
  - Add your slides, accounts, forecast and any customer or org chart details. Paste the text or upload the files.
  - Ask your AI to draft the memorandum. It will ask for anything missing.
  - Check each number and each year label. Indian years run April to March.
  - Tie the financial summary totals back to your source accounts before the draft goes any further. Every figure in the memorandum should match a line in the accounts.
  - The skill has no list of what has no Indian equivalent. Where a US-style item has none, your AI should say so, not swap in a stand-in.
  - Ask your AI to list the facts you still need to collect. Fill them in.
  - Have management check the facts, and your lawyer check the confidentiality page, before you share it.
  - Next, write a short anonymous teaser for first contact with buyers (anonymous-company-teaser-writer), have your advisor review the draft, and file the Excel appendix with the accounts it came from.
next: [anonymous-company-teaser-writer, sale-process-letter-drafter]
output_sample:
  input:
    - Management presentations or board decks
    - Three to five years of accounts
    - Your budget or forecast
    - Customer data and an org chart (optional)
    - Quality of earnings report (optional)
  prerequisites:
    - An AI that can write a Word file and an Excel file, if you want files instead of chat text
    - Nothing else. The India conventions are written into the skill, so you do not need the two companion India skills
  output:
    - name: Executive Summary
      contains: Company overview, five to seven investment highlights, headline financials and a short view of the deal.
    - name: Company Overview
      contains: History, what the company sells, how it earns money and what sets it apart.
    - name: Industry Overview
      contains: Market size, trends, rivals, rules and what keeps new players out.
    - name: Growth Opportunities
      contains: Ways to grow, add-on deals, better operations, technology spend and open market space.
    - name: Customers & Sales
      contains: Customer mix, top customers, how well you keep them, how you sell and your pipeline.
    - name: Operations
      contains: Team structure, key people, sites, systems and suppliers.
    - name: Financial Overview
      contains: Past results, revenue splits, profit bridge, balance sheet, cash flow and forecast, in lakh and crore.
    - name: Appendix
      contains: Detailed accounts, an anonymized customer list, product catalog and management bios.
