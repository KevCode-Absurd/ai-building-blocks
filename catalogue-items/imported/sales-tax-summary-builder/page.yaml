thinking: low
thinking_why: It adds tax lines into groups.
new_slug: sales-tax-summary-builder
name: Sales tax summary builder
summary: Build a sales tax summary from your Shopify orders. Get tax collected by state, province or rate for a filing period, ready to hand to your accountant.
job: run-your-store
headline: Sales tax summary builder
subhead: Tax collected, grouped the way you file it. Pick a period and get your sales tax split by state, province or rate, ready for whoever prepares your return.
explain: |
  Tax collected, grouped the way you file it. Pick a period and get your sales tax split by state, province or rate, ready for whoever prepares your return. This is prep for a professional, not tax advice.

  It is built for Shopify. It reads paid, partly refunded and fully refunded orders in your lookback window, ninety days by default to fit a quarter, and collects the tax lines on each. You choose to group by jurisdiction or by rate. By default it removes tax from fully refunded orders. Partly refunded orders stay in the totals and are listed on their own, so you can adjust them by hand. It sums each group and shows totals as text or JSON. It only reads data. You sign in with the Shopify command line and allow order read access.
when:
  - A quarterly filing is due and you need totals by state.
  - Your accountant asks for tax collected by rate.
  - You want to see how refunds change what you owe.
  - You sell in several regions and need a clean breakdown.
not_for:
  - "You need to know where you must collect tax: ask a tax professional or check your Shopify Tax setup."
  - "You want tax advice or the final amount you owe: this shows tax collected only, so ask your accountant."
  - "Your store is not on Shopify: copy your order tax totals into a spreadsheet and group them there."
you_give:
  - Your store domain
  - The period in days
  - Group by jurisdiction or by rate
  - Shopify read access to orders
you_get:
  - Tax collected per jurisdiction or rate
  - Fully refunded orders taken out, and partly refunded orders listed for you to adjust
  - A summary for filing prep
  - A reminder to check with a tax professional
how_to_use:
  - Open an AI that can run commands, such as Claude Code, Cursor, Codex or Gemini CLI. This skill reads your Shopify store, so a plain chat will not work.
  - Sign in with the Shopify command line and allow read access to orders.
  - Paste the skill and give your store domain. Set the number of days to match your filing period, such as 30 for monthly or 90 for quarterly.
  - Choose to group by state or province, or by tax rate.
  - Check the totals on screen, then open the CSV file it saves.
  - Next, compare the CSV totals with your Shopify tax report for the same dates. Check the partly refunded orders by hand. Then send the CSV to your accountant or tax preparer.
output_sample:
  input:
    - Your Shopify store domain
    - How many days back to look (optional, 90 is the default)
    - Group by state or province, or by tax rate (optional)
    - Whether to leave out refunded orders (optional)
    - Human-readable or JSON results (optional)
  prerequisites:
    - An AI that can run commands and read files
    - The Shopify command line, signed in to your store with read access to orders
  output:
    - name: Start banner
      contains: Shows the skill name, your store domain and the start time.
    - name: Step log
      contains: One line per step with the key settings and how many orders came back.
    - name: Summary on screen
      contains: Orders checked, total tax collected, and tax per state, province or rate with order counts.
    - name: JSON summary (optional)
      contains: The same totals as JSON, if you ask for that format.
    - name: tax_liability_<date>.csv
      contains: One row per group with jurisdiction, country, province, tax rate, order count, total tax collected and currency.
