thinking: low
thinking_why: It runs searches across set sources and lists what each returned.
new_slug: scholarly-database-searcher
name: Scholarly database searcher
summary: Search PubMed, arXiv, OpenAlex and 15 more free sources for papers, citations and open full text. Every query is shown so you can repeat it.
job: research-topics
headline: Scholarly database searcher
subhead: A literature search you can repeat and defend. Ask a research question and get papers, preprints, citations and open full text from eighteen free sources, with the exact queries shown so anyone can rerun them.
explain: |
  A literature search you can repeat and defend. Ask a research question and get papers, preprints, citations and open full text from eighteen free sources, with the exact queries shown so anyone can rerun them.

  It first turns your question into a search plan. It picks the most trusted database for the job, prefers identifiers like DOIs over loose keywords, and keeps each query small. Python scripts using only the standard library call the sources. Some of these APIs report success even when they fail, so it checks the contents, not just the status. The report says what was searched, what came back and what could not be reached. Most sources need no login. CORE full text needs a free CORE key.
when:
  - You start a literature review and need a clear record of how you searched.
  - You have a DOI and want the open access full text if it exists.
  - You need citation counts and related papers for a topic.
  - You want to check whether a journal is open access.
not_for:
  - "You need medical advice or a systematic review sign-off: ask a qualified person to check the results, and use PubMed directly for the formal search record."
  - "You need a paywalled paper: ask your library or the author, because this only finds open access full text."
  - "You want a summary or a written review of the papers: ask your AI to write it from the papers you pick after this search."
you_give:
  - Your research question or topic
  - DOIs or titles (optional)
  - Date range or field limits (optional)
  - Optional API keys for some sources
you_get:
  - A list of matching papers and preprints
  - Open access links where they exist
  - Citation data
  - The queries used, so you can repeat them
how_to_use:
  - Open an AI chat that can run Python and Bash commands (including curl) and reach the web, such as Claude Code or Codex. A consumer chat without code execution will not run this skill. Paste in the skill text.
  - Type your research question. Add a DOI, a date range or a field limit if you have one.
  - Add free API keys if you have them. Most sources need no login, but CORE full text needs a free CORE key.
  - Read the Retrieval Summary first. It tells you which sources were searched and which came back empty.
  - Check the Provenance section and save the queries. Use them to rerun the search later.
output_sample:
  input:
    - Your research question or topic
    - A DOI, PMID, arXiv ID or paper title (optional)
    - A date range or field limit (optional)
    - Free API keys to raise limits or get CORE full text (optional)
  prerequisites:
    - An AI that can run Python 3.11 or newer and reach the web
    - Network access and curl
    - A free CORE API key, only if you want CORE full text
  output:
    - name: Retrieval Summary
      contains: The question, which databases were searched, and which ones were empty or could not be reached.
    - name: Results
      contains: Matching papers and preprints, grouped by database, with identifiers, abstracts, citation data and open access links where they exist.
    - name: PubMed
      contains: Biomedical matches from PubMed, shown with the exact query that found them.
    - name: Unpaywall
      contains: Whether an open access copy of a paper exists, and the link to it.
    - name: Provenance
      contains: The endpoints, parameters, identifiers and access date, so anyone can rerun the search.
