thinking: low
thinking_why: It runs searches and pulls out text with little judgement.
new_slug: scientific-web-searcher
name: Scientific web searcher
summary: Find papers and pages on a research topic by meaning, with the text pulled out. Needs an Exa key and Python.
job: research-topics
headline: Scientific web searcher
subhead: Papers and web pages on your research topic, found by meaning, with the text pulled out of each link. It runs on Exa, a paid search service.
explain: |
  A set of papers and web pages on your topic, found by meaning instead of exact keywords, with the page text already pulled out so your AI can read it. It runs on Exa, a search service, so you need an Exa API key and Python.

  For science and technical questions it runs two passes. The first uses a scholarly bias to favour journals, preprints and trusted institutions. The second looks at a short list of academic sites. It prefers peer-reviewed work, then preprints, then government and university pages, over blogs. When you already have links, it can fetch the full text of many pages, including PDFs, in one batch.
when:
  - You are starting a literature search and want relevant papers fast.
  - You have a list of article links and need the text from all of them at once.
  - You want current findings on a technical topic without wading through blog posts.
  - You need to find preprints when no peer-reviewed version exists yet.
not_for:
  - "You want live news or the latest headlines: use a normal news search or a news site."
  - "You already have one link and only need to read it: open the page yourself or paste its text into your AI."
  - "You cannot run code or get an Exa key: ask your AI to search the web in chat, or ask a librarian for help."
  - "You need citations formatted or a reference list built: use your reference manager after you pick your sources."
you_give:
  - A research topic or question
  - Links to pages or PDFs to read (optional)
  - An Exa API key
  - Domains to prefer or avoid (optional)
you_get:
  - A ranked list of papers and pages
  - Extracted text from each link
  - Sources sorted by how scholarly they are
  - Full text of batches of URLs
how_to_use:
  - Get an Exa API key at dashboard.exa.ai. Exa is a paid service. Each search and each page fetch is billed to your account, so check its pricing and your usage limit before you run a big batch.
  - Use an AI that can run code, with Python 3.11 or newer. Add the skill folder and set your key as EXA_API_KEY.
  - "Read SKILL.md first, then references/web-search.md. Then tell your AI: \"Search Exa for [your topic], using the publication category and the two-pass academic search, and give me the ranked list with the text.\""
  - If you have links, ask it to fetch the text from all of them in one batch.
  - Check each source's type and date before you rely on it. Peer-reviewed work is stronger than preprints or blogs.
  - Next, keep the sources you trust and ask your AI to pull the full text for those. Read them before you cite anything.
  - The scripts tag every request to Exa with a header that names the K-Dense skills repo, so Exa can count usage from it. Your key and your queries still go to Exa.
  - Then add the sources you keep to your own reference manager or notes. This skill finds and reads sources. It does not format citations.
output_sample:
  input:
    - Your research topic or question
    - Links to pages or PDFs to read (optional)
    - Your Exa API key
    - Websites to prefer or skip (optional)
  prerequisites:
    - An AI that can run code, with Python 3.11 or newer
    - An Exa API key from dashboard.exa.ai, a paid service that may charge you
  output:
    - name: Search results
      contains: A list of papers and pages found by meaning, with title, link, date and a short text snippet for each.
    - name: Scholarly search pass
      contains: Results from the publication category, which favours journals, preprints and trusted institutions.
    - name: Academic domain pass
      contains: Results limited to a short list of scholarly sites such as arxiv.org and pubmed.ncbi.nlm.nih.gov.
    - name: Extracted page text
      contains: The full text of pages and PDFs from the links you give, fetched in one batch of up to 100.
    - name: Source notes
      contains: Each source is flagged as peer-reviewed, preprint, government or university page, or other, so you can check its type.
