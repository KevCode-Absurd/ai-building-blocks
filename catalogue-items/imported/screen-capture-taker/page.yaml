thinking_why: It runs one simple capture.
new_slug: screen-capture-taker
name: Screen capture helper
summary: Capture a browser page when browser capture tools are available. State clearly when desktop capture is unavailable.
job: work-with-files
headline: Screen capture helper
subhead: Capture a browser page with an available tool. Desktop capture needs a supported OS helper and may need screen permission.
explain: |
  Capture a rendered browser page when a browser screenshot tool is available. For a full desktop, app window or screen region, the system needs a working OS capture helper. macOS requires Screen Recording permission, Linux needs a supported screenshot utility, and Windows uses the supplied PowerShell helper. The result must match the capture type the tool actually returned. Browser capture does not show other apps or the full desktop.
when:
  - You want a picture of a desktop app window saved to a folder you choose.
  - Claude needs to look at your screen to help debug something visual.
  - You need a capture of one region, not the whole display.
  - You want screenshots taken the same way on Windows, Mac and Linux.
you_give:
  - What to capture (screen, app window or region)
  - A save path or file name (optional)
  - The app name for window shots (optional)
you_get:
  - A saved image file
  - The file path, so you can find it
  - A temporary copy when Claude only needs to look
  - Mac permission set up once
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can capture your screen.
