thinking: medium
thinking_why: It lists each state, then builds each one.
new_slug: screen-states-designer
name: Screen states designer
summary: "Find the empty, loading, error and offline states your screen is missing, then build each one. Use it as a screen states checklist and builder."
job: build-websites
headline: Screen states designer
subhead: "Most screens are built for the best case: lots of data, fast network, nothing breaking. Real people hit the other cases first. This skill takes a screen you are building and finds those states, then builds each one properly."
explain: |
  Most screens are built for the best case: lots of data, fast network, nothing breaking. Real people hit the other cases first. This skill takes a screen you are building and finds those states, then builds each one properly.

  It goes through a list for every screen that loads, lists, searches or saves: first use, empty, loading, partial data, error, offline, bad input, no results and success. It keeps only the ones that can happen, then writes the content and design for each, with a way out of every error. It works on its own. An optional connection to the UXKIN screen library can show how other products handle the same case.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to UXKIN and sickn33.
when:
  - Your screen only shows the version with perfect data and you need the rest.
  - A new user would see an empty list on day one and you have nothing designed for it.
  - Someone asked you to make a screen ready for real use.
  - You want to review a finished feature for missing error and offline cases.
not_for:
  - "You only need backend work or a static page with no data: use a code review or testing step instead."
  - "You want a visual redesign of the whole screen: ask a designer, or start with a plain design brief."
  - "You need exact error wording from your server: ask your backend developer for the real messages first."
you_give:
  - The screen or component, as code, a screenshot or a description
  - What data it loads or saves
  - Your design style or component library (optional)
you_get:
  - A list of states that can happen on that screen
  - Copy and layout for each state
  - Error messages with a clear next step
  - Built versions in your code
how_to_use:
  - Gather the screen, what data it loads or saves, any real error messages from your backend, and the phone and desktop widths you support.
  - Open your AI tool and paste in this skill. If it can read files, give it access to your project.
  - Paste or attach the screen you are building. Add what data it loads or saves.
  - Check the state list it writes first. Say which states matter most to you.
  - Let it build each state with your existing components and copy style.
  - Read the report at the end. Answer any open questions, such as what an error should say.
  - Test the states in your own app with slow, failed and offline requests.
  - Send the open decisions to the right person, such as the exact error wording to your backend developer, then ask your AI to update the states.
  - Next, have the changes code reviewed, and add a test for each state so it does not break later.
output_sample:
  input:
    - Your screen or component, as code, a screenshot or a description
    - What data the screen loads or saves
    - Your design style or component library (optional)
  prerequisites:
    - An AI that can read your project files, to build and check states in your code
    - The UXKIN connection and a UXKIN plan, only if you want real app examples (optional)
  output:
    - name: State list
      contains: The states that can happen on your screen, such as first use, empty, loading, error, offline and success.
    - name: Built states
      contains: Each state built with your own components and copy style, with a clear next step on every error.
    - name: State checks
      contains: How each state was triggered and checked, at phone and desktop widths.
    - name: Report
      contains: Which states were built, which were checked and how, and which need a decision from you.
