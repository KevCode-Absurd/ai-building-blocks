new_slug: screenshot-privacy-masker
name: Screenshot privacy masker
summary: Give it a screenshot. Get phone numbers, emails, keys and IDs masked on
  your own computer before you share it.
job: work-with-files
headline: Screenshot privacy masker
subhead: A copy of your screenshot with phone numbers, emails, API keys and ID
  numbers covered, ready to share or paste into a chat. The work happens on your
  own computer, so the original image is never uploaded anywhere.
explain: |
  A copy of your screenshot with phone numbers, emails, API keys and ID numbers covered, ready to share or paste into a chat. The work happens on your own computer, so the original image is never uploaded anywhere.

  A command line tool reads the text in the picture using OCR, then matches it against patterns for personal and secret data. A test run first lists what it found without changing the file, so you can see what would be hidden. Then it masks those regions and saves a new file with _masked in the name. You can edit the config to add your own patterns. It needs the privacy-mask package and Tesseract installed.
when:
  - You want to post an error screenshot in a forum without showing your email
    or keys.
  - Claude needs to read an image of your dashboard but you want private details
    hidden first.
  - You share screenshots with clients and must remove names and phone numbers.
  - You want to check what private data is in an image before sending it.
you_give:
  - A screenshot or image file
  - The privacy-mask tool and Tesseract installed
  - Custom patterns to hide (optional)
you_get:
  - A masked copy of the image
  - A list of what was detected and where
  - A dry-run report before any change
  - A short summary of regions masked
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run a local command line tool.
