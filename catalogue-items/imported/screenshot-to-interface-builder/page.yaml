thinking: medium
thinking_why: It measures the image, builds, then compares.
new_slug: screenshot-to-interface-builder
name: Screenshot to interface builder
summary: Turn a screenshot into a working screen. Give it your mockup and get matching UI built from your own parts, checked side by side.
job: build-websites
headline: Screenshot to interface builder
subhead: "A working screen that matches your screenshot or mockup, built from your project's own components and colours, then compared against the image and corrected. Pictures usually go wrong in the same ways: spacing close but off, text sizes guessed, colours picked by eye, a missing state."
explain: |
  A working screen that matches your screenshot or mockup, built from your project's own components and colours, then compared against the image and corrected. Pictures usually go wrong in the same ways: spacing close but off, text sizes guessed, colours picked by eye, a missing state. This skill measures first.

  It confirms what the image is for: an exact match, or only direction for your own style. It reads sizes and spacing from the image, builds with what the project already has, and puts the result next to the original to fix differences. If the image shows another company's product, it copies the layout pattern only, never their logo, text or pictures. It works with no account.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to UXKIN and sickn33.
when:
  - A designer sent a mockup and you need it built in your codebase.
  - You have a screenshot of a layout you like and want your own version.
  - Your first build looks close but the spacing and fonts feel wrong.
  - You want a screen to match a design export without inventing new styles.
not_for:
  - "You have no image and want a blank new layout: sketch it first, or ask your AI to plan the page in plain words."
  - "You need a pixel-perfect print or email layout: use your design tool's export or a template tool made for email."
  - "The image is blurry or cropped: get a clearer export from the designer first, or the build will be guesswork."
you_give:
  - A clear screenshot or mockup
  - Your project or component library
  - Whether to match exactly or use it as direction
  - Brand colours and fonts (optional)
you_get:
  - Code for the screen using your own parts
  - A side-by-side check against the image
  - A list of differences fixed
  - Placeholders where assets are not yours to copy
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on this page.
  - It works best when your AI can run code and open a browser.
  - Next, run your project's screenshot or visual test on the new screen, then have a design review before you merge it.
output_sample:
  input:
    - A clear screenshot or mockup
    - Your project or component library
    - Whether to match it exactly or use it as direction
    - Your brand colours and fonts (optional)
  prerequisites:
    - An AI that can run code and open a browser, so it can render the screen and compare it with your image
  output:
    - name: Image reading
      contains: The regions, widths, text sizes, colours and components the AI saw in your image, matched to parts you already have.
    - name: Built screen
      contains: Code for the layout, type, spacing, colour and details, using your own components, with hover, focus, loading, empty and error states.
    - name: Side-by-side check
      contains: The result rendered at the image width and compared region by region, fixed over up to three rounds.
    - name: Hand-off note
      contains: What was built, which parts were reused, what was added, the widths compared and any differences kept.
