thinking: medium
thinking_why: It plans the motion first, then writes the page.
new_slug: scroll-animation-site-builder
name: Scroll animation site builder
summary: Build a scroll animation website with layered depth, overlapping sections and smooth reveals. Give it your brief and images. You get one HTML file.
job: build-websites
headline: Scroll animation site builder
subhead: Describe the site. Get a scroll-driven page with layered depth, motion and smooth reveals, built in code. Bring a brief for the site. Use the result to plan your next step.
explain: |
  A scroll-driven web page where layers move at different speeds, sections overlap, text slides in and products rise between sections, built with plain CSS and JavaScript. No 3D software is needed, only flat images.

  2.5D means flat images stacked in layers that move at different speeds as you scroll, so the page looks deep without any 3D. There are six depth levels. Level 0 is the far background and level 5 is the foreground. Levels 1 to 3 run from glow and atmosphere, through mid-level decoration, to the main objects. Level 4 is text and interface. The nearer a layer is, the faster it moves.

  Before it writes code, it looks at your assets, judges which can be separated into layers, and plans the page. It draws on a list of over 45 techniques in 8 groups, such as parallax, sticky sections, clip-path reveals, curtain drops and words that light up as you scroll. It has three modes: build from scratch, add effects to an existing site, or fix slow animation. It checks performance and respects people who set reduced motion.
when:
  - You want a product launch page that feels like a premium brand site.
  - Your landing page is flat and you want sections that overlap as you scroll.
  - You have product images and need them to float between sections.
  - Your scroll animation stutters and you need it fixed.
not_for:
  - "You need a plain brochure page or a quick landing page scaffold: use a simple page template or a website builder, not this skill."
  - "You want true 3D scenes or WebGL: use a 3D tool or a web developer, since this skill only uses flat images, CSS and JavaScript."
  - "You have no images and only need written page copy: ask your AI to write the copy first, then come back with the brief."
you_give:
  - A brief for the site
  - Product or hero images
  - Brand colours and copy
  - An existing page to improve (optional)
you_get:
  - A scroll-animated page in HTML, CSS and JavaScript
  - A plan for layers and assets
  - Effects matched to each section
  - A performance and reduced-motion check
how_to_use:
  - "Open a chat with your AI and paste the skill text. Say which mode you want: build a new page, add effects to a page you have, or fix slow animation. Before you start, have a browser, a way to save a file ending in .html, and some front-end know-how or a developer to review the code. This skill needs no paid tool or API key."
  - "First time here? Pick the first mode, build a new page. Send your brief and your images first. Say which mood you want."
  - The ready-made hero section files are not in this copy. Your AI builds the hero from the markup pattern in SKILL.md and should say so.
  - Paste your brief and add your images. Use PNG with a transparent background for products and cutouts, or a flat JPEG for full-width backgrounds. Keep each file small, because large images slow the scroll. Add your brand colours and copy if you have them. Have a developer review the finished code before it goes live.
  - If your AI cannot run scripts, it checks your images and the page by eye instead, and tells you it did.
  - Read the asset audit and depth plan first. Ask for changes before the code is written.
  - Copy the HTML file your AI gives you, save it as a file ending in .html and open it in your browser.
  - Scroll the page and check it runs smoothly. Turn on reduced motion in your device settings to check the page still works.
  - Tell your AI what to change, such as which section feels flat or which effect stutters.
  - Once the page is final, check how well it converts with the landing page auditor, and check full accessibility with the accessibility checker. This skill only handles basic reduced motion.
output_sample:
  input:
    - Your brief for the site
    - Your product or hero images
    - Your brand colours and copy (optional)
    - An existing page to improve (optional)
  prerequisites:
    - An AI that can read your images
    - A browser to open the HTML file and check the motion
  output:
    - name: Asset audit
      contains: "A check of each image: whether the background is clear, which layer it suits and if it needs resizing."
    - name: Depth plan
      contains: Which element sits on which of the six depth layers, and how each layer moves as you scroll.
    - name: Technique list
      contains: A note at the top of the file naming which of the 45 techniques were used.
    - name: Single HTML file
      contains: The full page with inline CSS and JavaScript, GSAP loaded from a CDN, and comments on each section.
    - name: Accessibility and performance checks
      contains: Reduced-motion handling and speed-friendly animation rules applied to the page.
