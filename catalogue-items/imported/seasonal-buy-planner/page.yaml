thinking: medium
thinking_why: It shapes a demand curve, then splits the buy.
new_slug: seasonal-buy-planner
name: Seasonal buy planner
summary: "Plan your seasonal buy: give it last season's sales and targets. You get early and reserve order amounts, reorder triggers and markdown timing."
job: plan-supply-chain
headline: Seasonal buy planner
subhead: "A season buy plan that says how much to order up front, how much to keep in reserve, and when to mark items down. It balances two costs: running out of winners and being stuck with leftovers."
explain: |
  A season buy plan that says how much to order up front, how much to keep in reserve, and when to mark items down. It balances two costs: running out of winners and being stuck with leftovers.

  It starts by asking about your category, season length, sales and margin targets, open-to-buy budget, carry-over versus new styles and supplier lead times. Then it plans around four phases: pre-season, early, peak and late. Early sell-through tells you which styles to reorder or cut. The skill includes Python code that tests buy quantities against demand uncertainty, and plans timed markdowns to clear stock before the season ends.
when:
  - You are placing orders for next season and need a quantity for each style.
  - Last season ended with too much stock and heavy markdowns.
  - You want to know how much to hold back for reorders after launch.
  - You need a markdown calendar for the end of the season.
not_for:
  - "You are launching new products with no past sales: ask your AI for a demand forecast first, or use a similar past item as a guide."
  - "You need to split stock across stores: use a store allocation plan, which this plan does not cover."
  - "You want a forecast for next week or next month, not a whole season: use a simple forecast in a spreadsheet."
you_give:
  - Last season's weekly sales by style
  - Sell-through and markdown history
  - Sales and margin targets
  - Budget and supplier lead times
  - Season dates
you_get:
  - Initial and reserve buy quantities
  - A phase plan for the season
  - Reorder and cut triggers
  - A markdown timing plan
how_to_use:
  - Open your AI tool. Use Claude, ChatGPT or Gemini. For the code tests, pick one that can run Python.
  - Paste the skill text from this page into the chat. The code in it needs an AI that can run Python, such as Claude with code tools, ChatGPT data analysis or the free Google Colab. If yours cannot, ask it for the buy logic in plain steps and work the quantities in a spreadsheet. The skill text is long, so paste only the sections you need.
  - Add last season's weekly sales sheet. Use one row per style per week, with units sold, price, stock on hand and markdowns.
  - Answer its questions about your category, season length, budget, margin targets and supplier lead times.
  - "Check the plan. The example numbers in the code (30% demand variation, a 50% markdown rate, a 1.5x cost for running out of stock, and the random sample products) are made-up demo values. The skill should ask you for your own figures first. Do not use any buy quantity that came from the demo values."
  - Tell it your real season length. It is set once and used for the phases and the sales curve. The skill stops and asks if the markdown rate, stockout cost, demand variation or season length is missing.
  - Use the reorder and cut triggers at week 4 and the markdown plan at week 8.
  - Next, enter the buy quantities as order quantities in your buy sheet. Check the total against your open-to-buy budget, then review the plan again at week 4 and week 8.
output_sample:
  input:
    - Last season's weekly sales by style
    - Sell-through and markdown history
    - Sales, margin and budget targets
    - Season dates and supplier lead times
    - Your mix of carry-over and new styles (optional)
  prerequisites:
    - An AI that can run Python code, if you want the buy tests and simulations run for you
  output:
    - name: Executive Summary
      contains: The season, total buy, sales target, margin target and number of styles in one short view.
    - name: Financial Plan
      contains: Buy at cost and retail, markup, sales plan, sell-through goal, markdown budget and margin.
    - name: Category Mix
      contains: Buy amount, share, style count, average price and strategy for each category.
    - name: New vs. Carry-Over
      contains: How the buy splits between proven styles and new ones, with the risk of each.
    - name: Weekly Receipt Flow
      contains: When stock should arrive across the season and what each delivery is for.
    - name: Risk Assessment
      contains: The main risks, how likely and costly each is, and how to cut them.
    - name: Success Metrics
      contains: Sales, sell-through, markdown and margin checks for week 4, week 8 and season end.
    - name: Action Plan
      contains: Dated tasks with an owner, from final orders to clearance markdowns.
