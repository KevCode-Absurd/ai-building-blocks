thinking: high
thinking_why: A fresh reviewer must attack the work, then the findings must be weighed.
new_slug: second-opinion-reviewer
name: Second-opinion reviewer
summary: Get a second opinion on a plan or code change you feel sure about. A fresh reviewer lists the hardest objections, sorted by how much they matter.
job: think-and-decide
headline: Second-opinion reviewer
subhead: A set of the hardest objections to a plan or change you feel sure about, sorted by how much each one matters. In a long session, guesses quietly turn into facts.
explain: |
  A set of the hardest objections to a plan or change you feel sure about, sorted by how much each one matters. In a long session, guesses quietly turn into facts. This skill breaks that by handing your work to a fresh reviewer who has not seen your reasoning and is told to find what is wrong.

  This is an imported skill under the MIT licence. Pasting your work into a new chat to act as the reviewer is the default path. The terminal steps for a second AI tool are optional. One file it mentions, references/orchestration-patterns.md, and the agents/ reviewer folder are not included, and the five steps work without them.

  It applies only to non-trivial decisions: new branching logic, anything crossing a module boundary, claims such as "this is safe", or changes you cannot undo. Typos and renames are skipped. The reviewer sees only the artifact and the requirements, returns objections, and you decide which hold up. It is meant for the main session, since a helper cannot start another.
when:
  - You are about to commit a change that touches logic you only half understand.
  - You made an architecture choice under uncertainty and want it challenged.
  - You are about to say "this scales" and want someone to try to prove otherwise.
  - A plan has run for many messages and you suspect your assumptions have hardened.
not_for:
  - "You want a quick verdict on a finished piece of work: use the Code change reviewer, or ask your AI for a normal review."
  - "You are making a small change, like a rename, a typo fix or a file move: skip the review and just do it."
  - "You need speed more than checking, or the step is clear and has one right answer: do the task without a review."
you_give:
  - The plan, code change or claim
  - What it must achieve
  - Constraints and things already ruled out (optional)
you_get:
  - A fresh reviewer's strongest objections
  - Objections sorted by importance
  - Which points to fix and which to dismiss
  - A revised decision
how_to_use:
  - Open your AI in a chat where it can start a second, fresh reviewer and read your files. If it can't, paste the work into a new chat to act as the reviewer. Give that chat only the work itself and what it must achieve, never your own conclusion or reasoning.
  - Paste the skill's instructions into your AI.
  - Add your plan, change or claim, and what it must achieve. Add limits you already know (optional).
  - Ask your AI to follow the skill. It writes down your claim, picks the smallest piece to review, and sends it to the fresh reviewer.
  - Read the objections. Mark each one fix or dismiss, and give a reason.
  - The commands in the skill file are only for that optional other-AI step. Skip them if you do not use a terminal. The step that asks another AI tool for a view is optional. It may need a paid account or API key, and it sends your work to that tool's service. Only use it with material you may share.
  - Use the revised decision. The skill stops after a set number of rounds, so it does not loop forever.
output_shape: |
  CLAIM
  <what you are about to treat as true, and why it matters>

  OBJECTIONS (most serious first)
  1. <objection> | targets: <part of the work> | severity: <high, medium or low> | why: <reason>

  RECONCILIATION
  1. <fix, accepted trade-off or dismiss> | reason: <one line>

  REVISED DECISION
  <updated plan or change, or a note that it stands>
output_sample:
  input:
    - Your plan, code change or claim
    - What it must achieve
    - Limits and things you already ruled out (optional)
  prerequisites:
    - An AI that can start a second, fresh reviewer and read your project files
    - A paid account or API key for another AI tool, only if you want a second AI to review (optional)
  output:
    - name: Claim
      contains: What you are about to treat as true, written down plainly, with the assumptions behind it.
    - name: Reviewable unit
      contains: The smallest piece of your work, plus what it must achieve, handed to the fresh reviewer.
    - name: Reviewer objections
      contains: The strongest reasons the work may be wrong, from a reviewer who has not seen your reasoning. Each objection says which part of the work it targets, how much it matters, and why.
    - name: Reconciliation
      contains: Each objection marked as fix, accepted trade-off or dismiss (noise), with a short reason for the call. One of these labels per objection.
    - name: Revised decision
      contains: Your updated plan or change after the objections you accepted, or a note that it stands.
