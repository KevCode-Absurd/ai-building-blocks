thinking: medium
thinking_why: It runs set scans and ranks what they find.
new_slug: secure-development-checker
name: Secure development checker
summary: Scan your project for code flaws, weak packages and exposed secrets. Get a secure development check with fixes ranked by severity.
job: secure-code
headline: Secure development checker
subhead: A security scan of your project that finds code flaws, risky packages and exposed secrets, with fixes ranked by severity. Three bundled Python tools do the work and can export JSON for your build pipeline.
explain: |
  A security scan of your project that finds code flaws, risky packages and exposed secrets, with fixes ranked by severity. Three bundled Python tools do the work and can export JSON for your build pipeline.

  The code scanner looks for hardcoded keys, SQL injection, cross-site scripting, command injection and unsafe file paths. The package scanner reads npm, Python and Go dependency files and reports known CVEs, affected versions, fixed versions and an overall risk score from 0 to 100. A compliance checker tests the project against SOC 2, PCI-DSS, HIPAA and GDPR. Use it before a release, or as a pre-check before an audit. Its compliance report is not evidence for a client or an auditor.
when:
  - You are about to release and want a security check on the code.
  - A client asks whether you meet SOC 2 or GDPR basics, and you want a pre-check before a real audit.
  - You want to know which outdated packages carry known vulnerabilities.
  - You need a severity-sorted list to hand to a developer.
not_for:
  - "You need SOC 2, PCI-DSS, HIPAA or GDPR sign-off: hire a qualified auditor, because this scan is not a certification."
  - "You want to test a live running app from the outside: use the live app security tester, because this does not run dynamic (DAST) tests."
  - "You have no project files to share, or your AI cannot run Python: ask a developer to run the three scans for you."
you_give:
  - Your project folder
  - A framework to check against (optional)
  - A severity cutoff (optional)
  - Python installed
you_get:
  - Code flaw findings with locations
  - Vulnerable packages with fixed versions
  - A risk score from 0 to 100
  - A compliance gap report
  - JSON output for builds
  - "A pattern-based result: scans can miss flaws or flag things that are fine, so a developer must review each finding"
how_to_use:
  - Use an AI that can run code and read files, such as Claude with code tools. Check that Python is installed. All three scans run on your computer and need no internet, no paid service and no API key.
  - The package scan checks your packages against a small built-in list of known flaws. It does not look up a live vulnerability database. A clean result does not mean your packages are safe, so also run your package manager's audit command.
  - Add the skill to your AI, or paste its text into the chat.
  - Give your AI your project folder. Say which framework to check against and the lowest severity to show (both optional).
  - Ask it to run the code scan, the package scan and the compliance check in that order.
  - Read the results from the top. Fix critical findings first, then rerun the scans.
  - Save the JSON files if you want to use them in your build pipeline.
  - The skill file also has background notes on secret scanning tools, supply-chain checks and an OWASP quick check. They are optional. The three scans are the core of this skill.
  - The secret scanner gitleaks, which the skill suggests for CI, can need a paid licence key (GITLEAKS_LICENSE) when used in GitHub Actions for an organisation. Check the terms of each tool before you pick one.
output_sample:
  input:
    - Your project folder
    - A framework to check against, such as SOC 2 or GDPR (optional)
    - A severity cutoff, such as high (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Python installed on the computer that runs the scans
  output:
    - name: Security scanner report
      contains: Code flaws such as hardcoded secrets, SQL injection, XSS, command injection and path traversal, each with its location.
    - name: Vulnerability assessor report
      contains: Known CVE IDs with scores, affected package versions, fixed versions and an overall risk score from 0 to 100.
    - name: Compliance checker report
      contains: Gaps in access control, encryption, audit logging, authentication, security documents and build controls for the framework you pick.
    - name: security.json
      contains: The code scan results in JSON, ready for a build pipeline.
    - name: vulns.json
      contains: The package scan results in JSON, ready for a build pipeline.
    - name: compliance.json
      contains: The compliance check results in JSON, ready for a build pipeline.
