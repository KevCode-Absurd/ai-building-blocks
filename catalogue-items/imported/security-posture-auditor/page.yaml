thinking: high
thinking_why: A broad review needs many linked judgements.
new_slug: security-posture-auditor
name: Security posture auditor
summary: Describe your system. Get a scoped review of code, servers, sign-in and
  daily operations.
job: secure-code
headline: Security posture auditor
subhead: A scoped security audit of your web app, API or cloud setup, with each
  issue rated, mapped to a known standard and paired with a fix.
explain: |
  A scoped security audit of your web app, API or cloud setup, with each issue rated, mapped to a known standard and paired with a fix. You describe the system and what is in scope, and say whether you need to meet SOC 2, PCI-DSS or HIPAA.

  The audit builds a checklist from the OWASP Top 10 and CWE lists, then runs automated scans with tools such as OWASP ZAP, Trivy and Prowler. A manual pass covers sign-in flows, access roles, input checks, encryption, logging and hardcoded secrets that tools miss. Each finding gets a CVSS severity, exploitability and business impact. The report ends with a ranked remediation plan.
when:
  - You are launching a web app and want a security check across code and cloud.
  - An auditor will review you soon and you want to find gaps first.
  - You inherited a system and need to know how exposed it is.
  - You need findings tied to OWASP or CWE for a report.
you_give:
  - A description of the stack and architecture
  - Scope and environments
  - Config files or infrastructure code
  - Compliance targets (optional)
you_get:
  - A scoped audit checklist
  - Findings with severity and CWE labels
  - Business impact notes
  - A ranked fix plan
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your project files.
