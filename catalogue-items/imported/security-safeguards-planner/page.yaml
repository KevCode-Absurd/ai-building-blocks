thinking: medium
thinking_why: It scopes your size, then checks set safeguards.
new_slug: security-safeguards-planner
name: Security safeguards planner
summary: Find the security gaps in your company with a CIS Controls planner. Give it your size and tools. You get your group, a gap table and a fix order.
job: secure-code
headline: Security safeguards planner
subhead: "A short list of CIS safeguards your organisation should do first, the gaps you have today, and the order to close them. It starts with the one decision that matters most: which of three Implementation Groups you belong to."
explain: |
  A short list of CIS safeguards your organisation should do first, the gaps you have today, and the order to close them. It starts with the one decision that matters most: which of three Implementation Groups you belong to. Most small teams begin with IG1, 56 basic safeguards covering essential cyber hygiene.

  You describe your size, staff, data sensitivity and tools. The skill places you in a group, then produces a table with control, safeguard, current state, gap, priority and action. It cites the exact control and safeguard number each time. It can also map CIS controls to NIST, ISO or CMMC, and draft policies and procedures for a safeguard.
when:
  - You run a small company with little IT staff and need a clear security starting point.
  - You want to see which controls you lack before an audit.
  - Your client asks how you align with NIST and you use CIS.
  - You need a written policy for one safeguard, like software inventory.
not_for:
  - "You need a formal audit sign-off or a legal compliance decision: use an accredited assessor."
  - "You want to find bugs in your own code: ask a developer for a code review, because this plan covers company-wide security habits."
  - "You want a full certification such as ISO 27001 or SOC 2: hire a qualified auditor, since this only maps CIS safeguards to those frameworks."
you_give:
  - Your company size and how many people handle IT
  - The types of data you hold, such as customer or payment data
  - Your lists of devices, software and user accounts, if you have them (optional)
  - The security tools you use now
  - Any framework you must match, such as NIST, ISO or CMMC (optional)
you_get:
  - Your Implementation Group
  - A gap table with priorities
  - A fix order
  - Policy drafts for chosen safeguards
  - Mappings to other frameworks
how_to_use:
  - "Start here: write down how many people work in the company, how many handle IT, the kinds of data you hold, roughly how many laptops, servers, software tools and user accounts you have, and the security tools you use now."
  - Note that the skill's "last verified" date of 2026-10-03 is the original author's. This copy was imported on 2026-10-20 without a recheck.
  - Open Claude, ChatGPT or Gemini. Paste in the whole skill text (the SKILL.md file). Its first part, called How to Respond, is the part that matters most. The long tables after it are reference. No code or paid tool is needed.
  - Paste in what you wrote down. Add your asset and account lists if you have them.
  - "The full skill text is the SKILL.md file in this item. Its source is https://github.com/Sushegaad/Claude-Skills-Governance-Risk-and-Compliance/tree/main/plugins/cis-controls/skills/cis-controls . The skill folder also has reference files. The file safeguards-detail.md lists all 153 safeguards with their group, and framework-mappings.md has the full mapping tables. Without them, your AI works from the summary tables in SKILL.md, so the gap table covers the main safeguards, not all 153. Add the reference files for the full table."
  - Ask it to place you in an Implementation Group first. Check that the group fits your size and data. If you are unsure between two groups, start with the smaller one. Every group includes IG1.
  - Ask for the gap table. Read the rows with the highest priority first.
  - Ask for a fix order, then for a policy draft for any safeguard you want to write up.
  - The mappings to NIST, ISO 27001 and CMMC are general guides, not checked against the current standards. Some CMMC entries use an x as a placeholder. Have an assessor check them.
  - Have a qualified person review the result before you rely on it for an audit or legal decision.
  - Next, draft the policy for your top-priority gap, then put the fixes on your plan in the order it gave you.
output_sample:
  input:
    - "A short description of your organisation: size and how many people handle IT"
    - The kinds of data you hold, such as customer or payment data
    - The tools and security steps you use today
    - Any framework you must match, such as NIST, ISO or CMMC (optional)
  output:
    - name: Implementation Group
      contains: Which of the three groups (IG1, IG2 or IG3) fits your size, data and staff, with the reasons.
    - name: Gap assessment table
      contains: One row per safeguard with control, safeguard number, current state, gap, priority and action.
    - name: Fix order
      contains: The order to close the gaps, starting with the safeguards that matter most.
    - name: Policy or procedure draft
      contains: A short document for a safeguard you pick, with purpose, scope, requirements and who is responsible.
    - name: Framework mapping
      contains: A side-by-side table linking CIS controls to NIST CSF, ISO 27001 or CMMC, if you ask for it.
next: [security-posture-auditor, vulnerability-scan-planner]
