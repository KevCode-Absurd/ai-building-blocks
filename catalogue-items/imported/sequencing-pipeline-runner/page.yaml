thinking: high
thinking_why: It must pick, set up and check heavy pipelines.
new_slug: sequencing-pipeline-runner
name: Sequencing pipeline runner
summary: Run an nf-core sequencing pipeline on your FASTQ files or a public GEO or SRA dataset, for RNA-seq, variant calling or ATAC-seq.
job: build-software
headline: Sequencing pipeline runner
subhead: Give it your FASTQ files, or a GEO or SRA accession. It picks the right nf-core pipeline, checks your setup and runs a test first. Then it runs your data and checks the results.
explain: |
  A finished nf-core pipeline run on your sequencing data, for RNA-seq, variant calling or ATAC-seq, set up for people without a bioinformatics background. It can start from FASTQ files you have or fetch a public dataset from GEO or SRA.

  The steps run in order, with a pause for your approval at key choices. It fetches study info and asks which samples to download. A check confirms Docker, Nextflow and Java work, with fixes if not. You confirm the pipeline, then it runs the built-in test profile, which must pass. It builds the samplesheet, confirms the genome with you, runs the full job and checks the outputs. It needs a computer with those tools.
when:
  - You have RNA-seq reads and want a differential expression analysis run for you.
  - You found a public GEO dataset and want to reanalyse it.
  - You need variant calling run without learning Nextflow first.
  - Your pipeline failed and you suspect your setup.
not_for:
  - "You work with single-cell data or another data type: run the right nf-core pipeline directly, or ask a bioinformatician."
  - "You have no computer with Docker, Nextflow and Java, and cannot install them: ask your IT team or a bioinformatics core to run it."
  - "You want results ready to publish: the output needs expert review first, so ask a bioinformatician to check it."
you_give:
  - Your FASTQ files, or a GEO or SRA accession
  - "The type of analysis: RNA-seq, variant calling or ATAC-seq"
  - The reference genome, such as human or mouse
  - A computer with Docker, Nextflow and Java
you_get:
  - A check of your computer setup, with fixes for what fails
  - The right nf-core pipeline for your data, picked with your approval
  - A samplesheet that lists your samples
  - Finished pipeline results, including a MultiQC report
  - A check that the key result files exist
how_to_use:
  - Use an AI tool that can run commands in a terminal on your own computer and download files, such as Claude Code. The skill was written for Claude Code. A plain chat window cannot run this.
  - Check your computer has enough disk space, memory and time for a full run. The skill does not give disk or run-time figures, because they depend on your sample count and the pipeline. Its example cap for one run is 8 CPUs, 32 GB of memory and 24 hours. Read the chosen pipeline's own page for its needs before you start a full run.
  - Some setup fixes use sudo (admin rights). Your AI should show you each command first. Say no to any you do not understand.
  - Paste the skill into your AI. Tell it your files or your GEO or SRA accession.
  - "Approve each choice it asks about: the samples, the pipeline, the genome and the pipeline options."
  - Install Nextflow from the official install page (nextflow.io). If you use a command that downloads a script, read the script before you run it.
  - Have an expert review the results before you use them. Cite the pipeline when you publish.
  - Next, hand the gene counts or peak calls to a bioinformatician for differential expression or deeper analysis. This skill is a prototype and is not production-ready.
output_sample:
  input:
    - Your FASTQ files, or a GEO or SRA accession
    - "The type of analysis: RNA-seq, variant calling or ATAC-seq"
    - The reference genome you want to use
    - A computer with Docker, Nextflow and Java
  prerequisites:
    - An AI that can run code and download files
    - A computer with Docker, Nextflow and Java installed
    - Enough disk space, memory and time for a full run
  output:
    - name: Study info and sample choice
      contains: For a public dataset, the study details and the samples you agreed to download.
    - name: Environment check
      contains: A pass or fail on Docker, Nextflow and Java, with fixes for anything that fails.
    - name: Pipeline choice
      contains: The nf-core pipeline and version that fit your data, confirmed by you.
    - name: Test run
      contains: A small test run of the pipeline that must pass before your real data runs.
    - name: samplesheet.csv
      contains: A table that lists your samples and files in the layout the chosen pipeline needs.
    - name: Pipeline results
      contains: A MultiQC report, plus gene counts for RNA-seq, variant files for sarek, or peak calls for ATAC-seq.
    - name: Output check
      contains: A check that the run finished and that the key result files exist.
    - name: Final report
      contains: The list of files you receive, such as the MultiQC report, the gene count file or the peak calls, and a pass or fail summary of the output check.
