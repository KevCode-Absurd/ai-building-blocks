thinking: high
thinking_why: Equalizer tuning needs careful analysis.
new_slug: serdes-link-modeler
name: SerDes link modeler
summary: Describe a high-speed serial link. Get a model with equalizers tuned
  and eye diagrams plotted.
job: build-software
headline: SerDes link modeler
subhead: A working model of a high-speed serial link, with equalisation tuned
  and eye diagrams plotted. It uses MATLAB's SerDes Toolbox and covers NRZ and
  PAM links from PAM3 to PAM16.
explain: |
  A working model of a high-speed serial link, with equalisation tuned and eye diagrams plotted. It uses MATLAB's SerDes Toolbox and covers NRZ and PAM links from PAM3 to PAM16.

  Start from a target data rate and channel loss, or from a reference design such as PCIe, USB4, DDR5 or UCIe. Load a Touchstone channel file, or model crosstalk. Then tune FFE, CTLE and DFE settings, sweep parameters, and check eye height, eye width, bathtub curves and jitter parts. The skill also builds IBIS-AMI models for transmitters, receivers, redrivers and retimers, and tests them against the behavioural model. It includes rules that avoid silent setup errors.
when:
  - You are designing a PCIe or PAM4 link and need to pick equaliser settings.
  - You have measured channel S-parameters and want to see the eye.
  - You need an IBIS-AMI model to share with a partner.
  - You want to sweep data rates and compare eye margin.
you_give:
  - Target data rate and signalling type
  - Channel data or loss profile
  - MATLAB with SerDes Toolbox
  - Compliance mask or jitter budget (optional)
you_get:
  - A SerDes system model
  - Tuned equaliser settings
  - Eye diagrams and jitter breakdown
  - IBIS-AMI model files
  - Parameter sweep results
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with SerDes Toolbox.
