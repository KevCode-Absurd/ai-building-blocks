thinking: medium
thinking_why: It sets targets from known methods.
new_slug: service-target-planner
name: Service target planner
summary: Describe your service. Get service level targets, error budgets and
  alert rules that fit.
job: ship-and-host
headline: Service target planner
subhead: Service level targets that people believe in, with an error budget and
  alerts that fire at the right time. Many targets are copied numbers, like 99.9
  percent on everything, with no clear measure and no plan for when the budget
  runs out.
explain: |
  Service level targets that people believe in, with an error budget and alerts that fire at the right time. Many targets are copied numbers, like 99.9 percent on everything, with no clear measure and no plan for when the budget runs out. This skill uses the method from Google's SRE Workbook.

  It picks the right measure of how users feel the service, such as request success rate instead of CPU. It sets a target users care about and works out the error budget. It builds burn-rate alerts over several time windows, so a short spike stays quiet but a slow leak is caught. It also writes the policy for what the team does when the budget is gone.
when:
  - You are launching a service and need real reliability targets.
  - Your current targets are all 99.99 percent and your alerts are noise.
  - You need to explain what an error budget is and what happens when it is gone.
  - You want burn-rate alerts that are neither too jumpy nor too slow.
you_give:
  - The service and its users
  - Current traffic and error data
  - Existing targets (optional)
  - Alerting tool in use (optional)
you_get:
  - A chosen indicator and target
  - An error budget calculation
  - Burn-rate alert thresholds
  - An error budget policy
  - A review of common target mistakes
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
not_for:
  - "You want Prometheus rules and a dashboard layout as well. Use the Reliability target setter."
  - "You want a full plan for metrics, logs and traces. Use the Monitoring system planner."
  - "You need a customer contract with penalties. That is a legal document, so ask a lawyer. This tool sets engineering targets only."
output_sample:
  input:
    - The service and the user task you want to protect
    - About 30 days of how often it worked, such as the share of requests that succeeded
    - The window to measure over, and who owns the target
    - Existing targets and your alerting tool (optional)
  prerequisites:
    - An AI that can run Python 3 for the bundled scripts, or accept that it will work the steps by hand
  output:
    - name: Service level definition
      contains: The chosen measure, how it is counted, the target, the window and the owner.
    - name: Error budget
      contains: How much failure the target allows in the window.
    - name: Burn-rate alert thresholds
      contains: A fast alert for sudden loss and slow alerts for steady leaks, across several time windows.
    - name: Error budget policy
      contains: What the team does when the budget is spent.
    - name: Target review
      contains: Checks for common mistakes, such as a target set too high or CPU used as the measure.
