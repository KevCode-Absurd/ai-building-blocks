thinking: medium
thinking_why: It tests many layouts.
new_slug: sheet-cutting-planner
name: Sheet cutting planner
summary: Plan sheet cutting layouts that waste less steel, glass, wood or fabric. Give it your sheet size and panel list. You get patterns and a sheet count.
job: plan-supply-chain
headline: Sheet cutting planner
subhead: Cutting layouts that use the least material when you cut panels from large sheets of steel, glass, wood, fabric or paper. You list sheet size and every panel you need, with sizes and quantities.
explain: |
  Cutting layouts that use the least material when you cut panels from large sheets of steel, glass, wood, fabric or paper. You list sheet size and every panel you need, with sizes and quantities.

  Claude first asks what limits you: whether pieces can rotate, whether grain matters, blade kerf, minimum trim, and whether cuts must run edge to edge, as on a guillotine saw, in two or three stages. Then it picks the right method (a quick method for a rough count, a slower one that can waste less) and produces cutting patterns, with waste percentage and a sheet count. You can aim to minimise sheets, cost or complexity. It can handle several sheet sizes. The output is a pattern set you can send to the saw.
when:
  - You need 60 panels cut from standard 2440 by 1220 mm sheets.
  - Your offcuts are piling up and you want less waste.
  - Your saw only makes full-width cuts and you need layouts that respect that.
  - You want to compare sheet cost across two sheet sizes.
not_for:
  - "You cut odd shapes, not rectangles: use a nesting tool made for irregular shapes."
  - "You cut long bars, pipes or rolls in one length only: use a 1D cutting-stock tool."
  - "You need a waste figure that is guaranteed to be the lowest possible: ask a cutting-software vendor, as this gives a good estimate only."
you_give:
  - Sheet sizes and cost
  - Panel sizes and quantities
  - Whether rotation and grain matter
  - Blade kerf and trim limits
  - Saw type or cutting stages
you_get:
  - Cutting patterns per sheet
  - Total sheets needed
  - Waste percentage
  - Cost comparison
  - A layout that fits your saw
how_to_use:
  - Open your AI tool. Use Claude, ChatGPT or Gemini. One that can run code works best.
  - Paste the skill text, or upload the skill folder if your tool takes files.
  - Tell it your sheet size and every panel, with width, height and quantity.
  - "State your saw limits first: blade width, minimum trim, grain, turning panels, and whether cuts must run edge to edge."
  - Check the sheet count and the waste figure. Treat the waste as an estimate, not a guaranteed minimum.
  - If a panel is bigger than the sheet, your AI should stop and tell you which one. Fix that size first.
  - Check one layout against a real sheet or offcut before you cut. Then send the layouts to your saw operator, or ask for a table you can copy into a spreadsheet.
output_sample:
  input:
    - Your sheet size, and cost per sheet if you know it
    - Your panel list with width, height and quantity
    - Whether panels can be turned 90 degrees, and whether grain matters
    - "Your saw limits: blade width, minimum trim and cut type (optional)"
  prerequisites:
    - An AI that can run code gives the best results, but a chat works for small jobs
    - "Python packages numpy and pulp, if you run the code yourself"
  output:
    - name: Solution summary
      contains: The number of sheets used, the share of material used, and the method chosen.
    - name: Pattern details
      contains: A cutting diagram for each sheet showing where each panel sits.
    - name: Waste and sheet count
      contains: The waste percentage per sheet and the total sheets needed, as an estimate.
