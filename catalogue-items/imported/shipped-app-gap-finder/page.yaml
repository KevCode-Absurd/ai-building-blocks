thinking: high
thinking_why: It checks many areas and ranks what could break live.
new_slug: shipped-app-gap-finder
name: Shipped app gap finder
summary: Check your shipped app for gaps before launch. Get a score and a ranked list of database, webhook, secret and payment problems to fix.
job: secure-code
headline: Shipped app gap finder
subhead: A list of the gaps in a live app that AI-built projects often miss, found before a user or attacker finds them. It looks at the deployed product, not just the code in your editor.
explain: |
  Read this first: the audit runs an outside tool on your machine and sends your repo address and live link to a third-party service (api.commit.show). Run it only in a folder with no secrets, and only if you approve.

  It runs an outside audit of your repo and live URL using a command line tool. The checks cover database access rules, webhook handling, leaked secrets, permission grants, payment retries that could charge twice, missing indexes, monitoring and mobile use. Results are saved in a folder in the project so later sessions can read them without a re-run. It works best alongside the code-time security checks you already use, and is useful right after merging to main.

  Licence: this copy is credited under the MIT licence named in the author's own file header (see LICENSE). sickn33's collection labels it CC BY 4.0 (LICENSE-CONTENT). Credit goes to commitshow and sickn33.
when:
  - You just merged a big feature and want a check before deploy.
  - You built the app with AI and are unsure what a real launch would expose.
  - You take payments and need to know a retry cannot charge a customer twice.
  - You want a score and a to-do list for your project.
not_for:
  - "You want line-by-line security checks while you write code: use a code-time security review in your editor instead."
  - "Your repo holds unpublished or sensitive code you do not want signals sent about, or has secrets in its folder: do not run this."
  - "Your repo is private or not on GitHub: the audit reads public GitHub signals, so ask a developer to review it by hand."
  - "You build a library or command line tool: the score is only partial, so use a code review from a person."
you_give:
  - The repo folder
  - The live URL (optional)
  - Node installed to run the audit tool
  - Your stack, such as Supabase or Stripe (optional)
you_get:
  - A list of gaps by area
  - A severity ranking
  - Fix suggestions
  - A saved report for later sessions
how_to_use:
  - "Check first: your repo must be public on GitHub, and it must not hold secrets or private files. Ask your AI to list every file in the folder, hidden ones too (ls -a), and look for .env files, keys and private files. Remove or move them before you go on. The audit runs an outside npm package, pinned to commitshow@0.3.23, on your machine. What leaves your machine: the repo's address on GitHub, the public GitHub data about it, and your live link. These go to api.commit.show, a third-party service. The package itself runs with access to your local files and environment variables, so run it only in a folder with no secrets. Run it only if you approve all of that."
  - "Do not want anything sent to api.commit.show? Do not run the audit as written. The author lists a --no-network option for local-only checks. It is not tested here and it skips the live link and GitHub checks, so the score is partial."
  - "Know the limits: a result is reused for 7 days, a free anonymous run is capped at 5 per repo per day, and --refresh counts against those limits."
  - Open your AI in your project folder. It needs to run code and read files. Chat-only AI cannot run this.
  - Stop here unless approved. The next step runs an npm package that can read your local files and environment variables. Only run it in a folder with no secrets.
  - "Ask your AI to run: mkdir -p .commitshow, then npx commitshow@0.3.23 audit . --json, saving the result in .commitshow/audit.json. The first run takes 60 to 90 seconds."
  - Read the score and the top concerns. A high score is not a security sign-off; it only means these checks found no gaps. The audit sometimes flags a gap that is already fixed somewhere else, so treat each concern as a lead, not a verdict. Ask your AI to check the file named in the concern you care about before you change any code.
  - Ask for a small fix to one concern. Look at the diff and approve it before anything changes.
  - Run the audit again with --refresh after you fix a gap. The score then shows the change.
output_sample:
  input:
    - Your repo folder, with the repo public on GitHub
    - Your live app link (optional)
    - Your stack, such as Supabase or Stripe (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Node installed, so the audit tool can run
    - Your OK to run an outside npm package on your machine
  output:
    - name: Score
      contains: A 0 to 100 production-readiness score, with the change since the last audit when there is one.
    - name: Band
      contains: A label of strong, mid or early that sums up how ready the app is.
    - name: Top concerns
      contains: The biggest gaps, ordered by impact, each tagged with an area such as Security or Infrastructure.
    - name: Fix proposal
      contains: A small patch shown as a diff for the concern you pick, applied only after you approve.
    - name: .commitshow/audit.json
      contains: The full saved audit result, so later sessions can read it without a new run.
    - name: .commitshow/audit.md
      contains: A readable copy of the audit that sits next to the saved result.
