thinking: low
thinking_why: It checks each zone against one simple rule.
new_slug: shipping-rate-gap-finder
name: Shipping rate gap finder
summary: Find shipping zones in your Shopify store with no rate or only manual rates, before customers hit a dead end at checkout. Read-only.
job: run-your-store
headline: Shipping rate gap finder
subhead: A list of shipping zones in your store that have no rate, or only hand-typed flat rates. A zone with no rate quietly stops customers from checking out.
explain: |
  A list of shipping zones in your store that have no rate, or only hand-typed flat rates. A zone with no rate quietly stops customers from checking out.

  It walks every delivery profile and every zone in your Shopify store. For each one it checks for at least one valid rate. It flags zones with none, zones with only manual rates and no carrier-calculated option, and profiles that miss places you sell to. You can also set a price limit to catch rates that look like typos or are out of date. It only reads your shipping settings and changes nothing. You need a signed-in Shopify CLI session with shipping read access.
when:
  - Customers abroad say they cannot finish checkout.
  - You added a new market and are not sure shipping covers it.
  - A shipping setup was done years ago and nobody has reviewed it.
  - You suspect a flat rate is set far too high or too low.
not_for:
  - "Your store sells flat-rate shipping on purpose: run it with the manual-rate flag turned off, or skip it."
  - "You want to know how much money a missing zone costs you: pull a customer export from Shopify and sort it by country."
  - "You want to change or add shipping rates: do that in your Shopify shipping settings, since this only reads them."
you_give:
  - Your Shopify store address
  - A delivery profile name to focus on (optional)
  - A price limit to flag odd rates (optional)
  - Shopify CLI sign-in with shipping read access
you_get:
  - Zones with no shipping rate
  - Zones with only manual rates
  - Profiles missing sales regions
  - A readable or JSON report
how_to_use:
  - Open an AI that can run Shopify CLI commands, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot run it.
  - Sign in with the Shopify CLI for your store, and allow it to read shipping settings.
  - Paste this skill into your AI and give it your store address.
  - Add a profile name or a price limit if you want to narrow the check (optional).
  - Read the list of zones with no rate first. Fix those in Shopify before anything else.
  - Open the CSV to review zones with only manual rates, and decide which are on purpose.
  - Next, fix any zero-rate zones in your Shopify shipping settings, then run the audit again to confirm the flags have cleared.
output_sample:
  input:
    - Your Shopify store address
    - A delivery profile name to check on its own (optional)
    - A price limit to flag rates that look like typos (optional)
    - Whether to flag zones with only manual rates (optional, on by default)
    - "Report style: readable or JSON (optional)"
  prerequisites:
    - An AI that can run Shopify CLI commands
    - A Shopify CLI sign-in with permission to read shipping
    - An AI that can run code, to run the commands in this skill
  output:
    - name: Run summary
      contains: Counts of profiles checked, zones checked, zones with no rates, manual-only zones and rates above your limit.
    - name: Critical issues list
      contains: Each profile and zone that has no shipping rate, with the countries it covers.
    - name: shipping_rate_audit_<date>.csv
      contains: One row per zone with rate counts, manual and carrier counts, lowest and highest rate, currency and a flag.
    - name: JSON report
      contains: The same counts and issue list in JSON form, when you ask for that format.
