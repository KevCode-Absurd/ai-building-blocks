thinking: high
thinking_why: Apps mix sign-in, screens and store data, so choices ripple.
new_slug: shopify-app-builder
name: Shopify app builder
summary: Describe what your Shopify app should do. Get a Shopify app builder project with admin pages, sign-in, webhooks and extensions, plus deploy steps.
job: build-software
headline: Shopify app builder
subhead: A working Shopify app with admin screens, sign-in and extensions, built from a plain description of what it should do. You can skip the long setup reading.
explain: |
  A working Shopify app with admin screens, sign-in and extensions, built from a plain description of what it should do. You can skip the long setup reading.

  It first helps you choose the type: public app for the App Store, custom app for one store, or a sales channel. Then it sets up the project with the Shopify command line tool and a Remix template, lays out the routes, and adds sign-in through Shopify's OAuth. It builds the admin pages with Shopify's Polaris components, adds webhook handlers and any extensions, and covers the steps to deploy. You need Node, the Shopify CLI and a Partner account.
when:
  - You want an app that adds a screen to your Shopify admin.
  - You need to react to store events such as new orders.
  - You plan to list an app on the Shopify App Store.
  - You want a private tool for one store and no review process.
not_for:
  - "You only want to change your store's look or settings: use the Shopify admin theme editor or a ready-made app from the App Store."
  - "You need discount or shipping logic only: a Shopify Function is a smaller job than a full app, so ask a developer or scope that part alone."
  - "You cannot run code or install tools: ask a Shopify developer or agency to build it for you."
you_give:
  - What the app should do
  - "App type: public, custom or sales channel"
  - A Shopify Partner account
  - Node and the Shopify CLI installed
you_get:
  - A project with admin pages
  - Sign-in and permission setup
  - Webhook handlers
  - Extension code where needed
  - Deploy steps
how_to_use:
  - Open an AI that can run code and use the Shopify CLI. Check that Node.js 18 or newer is installed.
  - Paste the skill into the chat, or upload the skill folder.
  - Describe what your app should do, and say if it is public, custom or a sales channel.
  - "Let your AI run the first commands: shopify app init, then shopify app dev. Sign in to your Partner account yourself when asked. Never give your password or API secret to the AI, and use a development store, not your live store."
  - Confirm your app type with your AI before it builds anything. The code should match it. A public app and a custom app use different distribution settings.
  - Check the current Shopify CLI template and API version in Shopify's docs before you start. The skill is written for API version 2025-01 and the Remix template, which may be out of date.
  - The prisma folder in the project needs its own setup step before the app can save sign-in sessions. Ask your AI to run it and tell you what it did.
  - Check the admin pages and webhook handler on a development store before you go further.
  - When it works, run shopify app deploy. For a public app, then send it for App Store review.
output_sample:
  input:
    - What your app should do, in plain words
    - "App type: public, custom or sales channel"
    - Your Shopify Partner account details
    - Which store events it should react to, such as new orders (optional)
  prerequisites:
    - An AI that can run code and use the Shopify CLI
    - Node.js 18 or newer installed
    - A Shopify Partner account
  output:
    - name: App project folder
      contains: The Remix project made by the Shopify CLI, with app routes, extensions and a database folder.
    - name: shopify.app.toml
      contains: Your app name, permission scopes, webhook topics and optional app proxy settings.
    - name: shopify.server.js
      contains: The sign-in setup using session tokens, plus the Shopify API settings.
    - name: Admin pages
      contains: Screens in the Shopify admin built with Polaris, such as a product list or form.
    - name: webhooks.jsx
      contains: A handler that reacts to store events like new products or new orders.
    - name: Extensions
      contains: Code for admin blocks, theme blocks or other extension types your app needs.
    - name: Deploy steps
      contains: The commands to deploy, and the App Store submission steps if your app is public.
