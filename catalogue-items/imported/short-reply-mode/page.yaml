thinking: low
thinking_why: It only changes how replies are phrased.
new_slug: short-reply-mode
name: Short reply mode
summary: Get short AI replies that cut filler and keep the facts. Turn on short reply mode to save tokens and read less. Switch it off any time.
job: set-up-ai
headline: Short reply mode
subhead: Much shorter AI replies that drop filler and keep every fact, so you read less and spend fewer tokens. The upstream project claims around 75% fewer tokens, which we have not measured. Your savings will vary.
explain: |
  Once switched on, the AI writes in clipped fragments. It drops articles, pleasantries, hedging and words like "basically". It uses short words, common abbreviations and arrows to show cause and effect. Technical terms, code blocks and error messages stay exact. The mode stays on for every reply, even when you forget, until you say "stop caveman" or "normal mode". Expect a blunt style, since it is built on a joke persona. This copy comes from Alireza Rezvani's collection, which derives it from Matt Pocock's caveman skill. Both are MIT, as the LICENSE file in this item says.
when:
  - Your chat replies are long and you only need the answer.
  - You are paying per token and want to cut costs.
  - You are debugging and want findings with no preamble.
  - You are running out of room in a long conversation.
not_for:
  - "You are asking about health, legal, money or safety decisions where full caveats matter: use normal mode."
  - "You need exact wording, such as contract text or customer copy: use normal mode and ask for the full version, or ask a person to review it."
  - 'You want a full step-by-step explanation: say "normal mode" and ask again, or ask your AI for a longer answer.'
  - "You need a friendly, polished tone for emails or posts: write those in normal mode, then edit them yourself."
you_give:
  - A phrase to turn it on, such as "caveman mode"
  - Your normal questions
  - How long you want the mode to last (optional)
you_get:
  - Short, blunt replies with the facts intact
  - Exact code and error text
  - Lower token use
  - A way to switch it off
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. Turning the mode on needs no code, files or paid tools. The scripts in the skill folder (a compressor, a token estimator and a lint check) are optional and need Python. The AI chat alone is enough.
  - "Gather first: the question you want answered, any code or error text to paste exactly, and the chat tool you will use. Check that you will not use the reply for a decision that needs full caveats."
  - Paste the skill text (the text of SKILL.md) into the chat. Then type "caveman mode" to turn it on.
  - Test it: ask one simple question first. Check that the reply is short and keeps every fact before you rely on it. The mode only changes the style. Short replies are not checked for accuracy, so verify facts as you would in normal mode.
  - Ask your questions as normal. Every reply stays short until you turn it off. In a long chat the mode can fade. If replies get long again, say "caveman mode" again or paste the skill text again.
  - If a reply is too blunt, say "normal mode" to get the full version.
  - Say "stop caveman" when you are done. Replies go back to normal.
  - Next, ask for a normal-mode follow-up when you need detail, or use your usual drafting skill for polished copy.
output_sample:
  input:
    - A phrase to turn it on, such as "caveman mode" or "be brief"
    - Your normal questions, asked as you usually would
    - 'A phrase to turn it off: "stop caveman" or "normal mode"'
  output:
    - name: Short reply
      contains: Clipped answer with no filler, pleasantries or hedging, and arrows to show cause and effect.
    - name: Exact technical parts
      contains: Code blocks and error messages stay word for word, and technical terms are not changed.
    - name: Clear-speech exceptions
      contains: Security warnings, actions that cannot be undone and confusing steps are written in full sentences, then short replies resume.
    - name: Switch-off
      contains: Replies return to normal when you say "stop caveman" or "normal mode".
