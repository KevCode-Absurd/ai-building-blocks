thinking: medium
thinking_why: Cleaning steps depend on the data.
new_slug: signal-data-cleaner
name: Signal data cleaner
summary: "Clean raw signal data in MATLAB: fill gaps, remove drift and spikes, cut noise, then label and split it. You get a script you can re-run."
job: build-software
headline: Signal data cleaner
subhead: A MATLAB script that turns a raw signal into clean, labelled data ready for analysis. It saves you from inventing filters that are wrong or functions that do not exist.
explain: |
  A MATLAB script that turns a raw signal into clean, labelled data ready for analysis. It saves you from inventing filters that are wrong or functions that do not exist.

  The skill follows one order: condition the signal, load files into a datastore, label, split and frame, then hand off to training. For cleaning, it uses the standard tools: fill short gaps with interpolation, fill long gaps in oscillating signals with an AR method, and remove slow drift with a polynomial detrend, raising the order step by step. It also handles outliers and noise. It needs MATLAB with the Signal Processing Toolbox.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - Your sensor data has holes and spikes before you can analyse it.
  - The signal drifts slowly and hides what you want to see.
  - You need to label recordings for machine learning.
  - You have a folder of signal files and need one clean dataset.
not_for:
  - "You need to design a filter for a set band, a notch or a custom FIR or IIR: use the MATLAB signal filter designer."
  - "You want features from a clean signal, such as RMS or spectral values: use the signal feature extractor."
  - "You want to classify raw .wav audio and have Audio Toolbox: use audioDatastore in MATLAB instead."
you_give:
  - Your signal data, or a folder of signal files
  - The sample rate
  - The timestamp format and units, and whether the timestamps are evenly spaced
  - "The problems you see: gaps, drift, spikes or noise"
  - The file format, such as .mat or .csv
you_get:
  - "A runnable .m cleaning script with one section for each step, in order: repair gaps, remove outliers, remove drift, smooth noise, align channels, then label and split"
  - Gaps filled and drift removed
  - Outlier handling
  - Labelled, split data for training
  - Before and after plots of the signal for each cleaning step, if you ask for them
how_to_use:
  - "This suits people who already work in MATLAB. If you do not use MATLAB, do not start here. MATLAB and the Signal Processing Toolbox are paid products, so check you have both. Your AI must be able to run MATLAB code, or you run the script yourself."
  - Paste the skill into your AI, and also give it the reference files in the references folder of this item, since the steps depend on them. Open wf-repair-missing.md for gaps, wf-detrend-smooth-deoutlier.md for drift, spikes and noise, wf-align-channels.md to line up channels, and wf-load-and-split.md for a folder of files. Without them your AI may guess function names.
  - Share your data, the sample rate and the file format. Say which problem to fix first.
  - Ask for a runnable .m script with one section per step.
  - Run the script. Check a plot of the signal before and after each step.
  - "The steps, in order: 1. Repair gaps (wf-repair-missing). 2. Remove outliers and spikes. 3. Remove drift with a detrend. 4. Smooth noise (steps 2 to 4 are in wf-detrend-smooth-deoutlier). 5. Optional: put channels on one time base, then load, label and split the files."
  - "Keep this order, and fix it if a later step looks worse: fill gaps (fillmissing, or fillgaps for long gaps in a wave-like signal), then remove spikes (filloutliers or hampel), then remove drift (detrend), then smooth (smoothdata)."
output_sample:
  input:
    - Your signal data, or a folder of signal files
    - The sample rate
    - "Which problems you see first: gaps, drift, spikes or noise"
    - The file format, such as .mat or .csv
  prerequisites:
    - MATLAB with Signal Processing Toolbox installed
    - An AI that can run MATLAB code, or a way for you to run the script yourself
  output:
    - name: Runnable .m script
      contains: One saved script you can version and re-run, not just values left in the workspace.
    - name: Repair step
      contains: Fills missing samples, using interpolation for short gaps and an AR method for long gaps in oscillating signals.
    - name: Detrend, smooth and deoutlier step
      contains: Removes spikes, takes out slow drift with a polynomial fit, then smooths noise, in an order that avoids damage.
    - name: Align or resample step
      contains: Puts one or more channels on a shared, uniform time base when you need it.
    - name: Label and split step
      contains: Builds a datastore from your files, adds labels from filenames or folders, and makes train, validation and test sets.
    - name: Frame and hand-off step
      contains: Cuts long signals into frames with labels and shapes the data for training.
