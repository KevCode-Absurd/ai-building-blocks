thinking: medium
thinking_why: It trims steps by set rules.
new_slug: signup-flow-improver
name: Signup flow improver
summary: Improve your signup flow by cutting extra fields, fixing button and error wording, and getting a ranked plan to reduce drop-off. Paste your steps.
job: build-product
headline: Signup flow improver
subhead: A shorter signup flow with clearer words and a plan to cut drop-off, so more visitors become users. Every extra field costs you signups, and this finds which ones to cut.
explain: |
  A shorter signup flow with clearer words and a plan to cut drop-off, so more visitors become users. Every extra field costs you signups, and this finds which ones to cut.

  Describe your steps and what you know about where people leave. It checks each field: do you need it now, can you ask later, or can you work it out from other data? It moves value before the ask, so people see the product before they commit. It reviews social login options, button and error wording, trust cues and what happens right after signup. The result is ranked changes and test ideas for your own flow.
when:
  - Many people start your signup and few finish it.
  - Your form asks for company, role and phone on page one.
  - Trial users sign up but never reach their first useful step.
  - You are redesigning registration and want a checklist.
not_for:
  - "You want to fix what happens after people sign up: use the First-use onboarding designer or the Onboarding improver."
  - "You need a lead capture or contact form, not account creation: use a simple form review or ask a conversion specialist."
  - "You want to run the A/B test itself: use your testing tool, as this gives test ideas only and does not run them."
you_give:
  - Your current signup fields, listed step by step
  - The number of steps or screens
  - Your completion or drop-off numbers, if you know them (optional)
  - Any legal or business rules that force a field
  - What your product does (optional)
you_get:
  - A list of fields to cut or delay
  - Clearer copy for buttons and errors
  - A ranked set of changes
  - Test ideas for your signup
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text from this page into a new chat.
  - Paste your signup fields, step by step. Add your drop-off numbers and any rules that force a field.
  - Answer any question your AI asks about your flow type, such as free trial or paid account.
  - Read the field verdicts first. Each field is marked keep, defer or cut.
  - Make the quick wins, then pick one or two test ideas to try.
  - This needs no code, files or paid tools. If you want company data added at signup, that needs a paid data provider, so skip it for now.
output_sample:
  input:
    - Your signup steps and the fields on each one
    - Your completion or drop-off numbers (optional)
    - Any rules that force a field, such as legal or sales needs
    - What your product does (optional)
  output:
    - name: Audit findings
      contains: Each problem found, why it matters, the fix, and a High, Medium or Low priority.
    - name: Field verdicts
      contains: Each field marked keep, defer or cut, with a short reason.
    - name: Quick wins
      contains: Changes you can make the same day, such as clearer button text or error messages.
    - name: High-impact changes
      contains: Larger changes that take about a week, such as splitting steps or adding social login.
    - name: Test ideas
      contains: Changes worth an A/B test, like one step against many or different button words.
    - name: Form redesign (if you ask)
      contains: A suggested field set and order, with copy for labels, buttons and errors.
