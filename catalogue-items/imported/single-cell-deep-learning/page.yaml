thinking: high
thinking_why: It needs model choices and checks on results.
new_slug: single-cell-deep-learning
name: Single-cell deep learning analyst
summary: Merge single-cell datasets, remove batch effects and find cell types with scvi-tools. Give it your raw count data and get a clean shared map of cells.
job: build-software
headline: Single-cell deep learning analyst
subhead: Single-cell datasets merged, batch effects removed and cell types found with scvi-tools, the deep learning toolkit for single-cell data. Your samples then line up so real biology shows through.
explain: |
  The first thing you get is a merged, batch-corrected AnnData file with cell clusters and a map of your cells.

  An AnnData file (.h5ad) holds your cells, genes and counts in one file. Raw integer counts are the whole-number read counts straight from the sequencer, before any scaling. The latent matrix is a short list of numbers per cell that puts all your samples in one shared space.

  It starts with a model table: scVI for plain RNA integration, scANVI when you have labels, totalVI for RNA plus protein, PeakVI and MultiVI for chromatin data, and DestVI for spatial data. It points you to the matching step-by-step reference, ready scripts and notes on GPU setup and fixing errors. Tasks include batch correction, label transfer to a reference, joint analysis of several data types and a latent map of cells. You need Python, scvi-tools and ideally a GPU.
when:
  - You have samples from different labs and batch effects hide the signal.
  - You want to label new cells using a reference dataset.
  - You work with CITE-seq or multiome data.
  - You need a latent space for clustering or comparison.
not_for:
  - "Your data is bulk RNA-seq, or has no raw integer counts: use a standard scanpy or Seurat workflow instead."
  - "You have no Python setup and no way to run code: ask a bioinformatician to run the steps for you."
  - "You only want a quick look at one sample with no batches: a basic scanpy workflow is simpler."
you_give:
  - Single-cell data, often an AnnData file
  - Batch or sample information
  - Labels, if you have them (optional)
  - Python with scvi-tools
you_get:
  - The right model for your data type
  - Integrated data with batch effects reduced
  - Transferred cell type labels
  - A latent representation for downstream work
how_to_use:
  - Open an AI that can run Python code. Make sure scvi-tools is installed. Use a GPU if you have one.
  - Check that your data is an AnnData file with raw integer counts saved in adata.layers['counts'].
  - Tell your AI the name of your batch column, your data type, and any labels you have.
  - Ask your AI to run validate_adata.py first, then follow the steps for the model it picks.
  - Check the UMAP and clusters. Batches should mix, and real cell types should stay apart.
  - Open the UMAP first. If batches mix and real cell types stay apart, go on and read de.csv for marker genes. If batches stay split, ask your AI to change the model settings and run it again before you read de.csv.
  - Use the latent matrix and de.csv for your next analysis. Ask a bioinformatician to review the result before you rely on it for a decision.
output_sample:
  input:
    - Your single-cell data as an AnnData file (.h5ad) with raw integer counts
    - The name of your batch or sample column
    - Cell type labels for some cells (optional)
    - "Your data type: RNA, RNA plus protein, chromatin, multiome or spatial"
  prerequisites:
    - An AI that can run Python code
    - Python with scvi-tools installed
    - A GPU is best but not required
  output:
    - name: Model choice
      contains: The scvi-tools model that fits your data type, and the reference file that explains its steps.
    - name: validate_adata.py check
      contains: A report on whether your data has the counts and batch column the model needs.
    - name: prepared.h5ad
      contains: Your data after quality checks and selection of 2000 or more highly variable genes.
    - name: Trained model and adata_trained.h5ad
      contains: The trained model and your data with the latent matrix, a shared space with batch effects reduced.
    - name: adata_clustered.h5ad
      contains: Your data with neighbors, a UMAP and Leiden clusters added.
    - name: de.csv
      contains: Differential expression results that show marker genes for each group.
    - name: Transferred labels
      contains: Cell type labels carried from a labelled reference to your new cells, when you use scANVI.
