thinking: medium
thinking_why: It must turn a goal into clear, checkable criteria.
new_slug: single-point-rubric-builder
name: Single-point rubric builder
summary: "Turn a learning goal into a single-point rubric: one clear criterion with open columns for evidence, for self, peer or teacher feedback."
job: teach-and-train
headline: Single-point rubric builder
subhead: A one-criterion rubric with open columns where specific evidence goes, instead of a scoring scale. It gives students feedback they can act on and takes about three minutes to make.
explain: |
  A one-criterion rubric with open columns where specific evidence goes, instead of a scoring scale. It gives students feedback they can act on and takes about three minutes to make.

  You give a learning goal and a purpose: self-assessment, peer feedback, teacher feedback or planning before a task. It writes one clear criterion in the middle. The default has three columns: areas for growth on the left, the criterion in the middle and areas of strength on the right. The side columns stay open so a reader writes real evidence, not a grade. It works with or without a developmental band system.
when:
  - You want feedback on one skill, with no points and levels.
  - Students need a way to assess their own work.
  - Peers will review each other and need a simple frame.
  - You plan a task and want one clear target to hang feedback on.
not_for:
  - "You need scores or levels for a final grade: use a criterion-referenced rubric generator, because this rubric gives no points."
  - "You want a rubric with several criteria in one grid: write it by hand, since this makes one criterion at a time."
  - "You have no clear learning goal yet: write the goal first, or ask a colleague, then come back."
you_give:
  - A learning goal or target
  - "The purpose: self, peer, teacher or planning"
  - Year group or level (optional)
  - Band system if you use one (optional)
you_get:
  - One clear criterion statement
  - A three-column rubric with open evidence columns
  - A version for the stated purpose
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the full text of SKILL.md from the download, including its Prompt section. It is a plain prompt, so no code or paid tool is needed.
  - Type your learning goal, for example an 'I can...' statement.
  - "Say who will use the rubric: self, peer, teacher or planning. Add your year group, band system or task if you have them."
  - Read the criterion. Check it describes one skill in words your students know.
  - Print or share the rubric with the side columns empty. Students or teachers fill them with real evidence.
  - When the columns are full, pick one area for growth to work on before the next draft.
  - If you later need a grade, take the criterion to the learning target authoring guide or a criterion-referenced rubric generator, which the skill names as its next steps.
output_sample:
  input:
    - Your learning goal or target
    - "The purpose: self, peer, teacher or planning"
    - Your band system (optional)
    - The task the students will do (optional)
    - Whether students should write their own criterion (optional)
  output:
    - name: Criterion
      contains: One clear statement of what quality looks like for your learning goal.
    - name: Rubric
      contains: A table with the criterion in the middle and open columns for areas for growth and strength.
    - name: Criterion Design Notes
      contains: Short reasons for the wording choices in the criterion.
    - name: Usage Guidance
      contains: How to use the rubric for your stated purpose.
    - name: Known Limitations
      contains: What this rubric cannot do, such as give a grade.
    - name: Student-Generated Prompt
      contains: A prompt that helps students write their own criterion, only if you ask for it.
