thinking: medium
thinking_why: The steps are standard but order and risk calls depend on your setup.
new_slug: site-go-live-runbook-writer
name: Website launch day plan writer
summary: Share your launch scope, time and team. Get launch checks, steps to point your web address at the new site, and a rollback plan.
job: ship-and-host
headline: Website launch day plan writer
subhead: A launch day plan the whole team can follow, with checks before launch, steps to point your web address at the new site, watching after launch and a rollback plan. It stops launch day from running on memory and chat messages.
explain: |
  A launch day runbook the whole team can follow, with checks before launch, DNS cutover steps, watching after launch and a rollback plan. It stops launch day from running on memory and chat messages.

  You give the launch scope, the window, the team and roles, the rollback triggers and who tells whom what. It writes a time-ordered runbook: pre-launch verification, the go-live procedure, DNS changes, post-launch monitoring and the exact conditions for pulling back. It suits new sites, redesigns, platform moves and big releases, and it can be reused for a deploy you repeat. QA before launch and incident handling after are separate jobs.
when:
  - You are moving a site to a new host and need a safe cutover plan.
  - You are launching a redesign and the team needs clear roles.
  - A big release is planned and you need a rollback rule.
  - You deploy often and want a repeatable checklist.
not_for:
  - "You need to test the site before launch: use a QA checklist or a person who tests, then come back for the runbook."
  - "Something has already broken after launch: use an incident response plan, since this page only plans the launch."
  - "You want a write-up after launch: hold an after-action review with your team instead."
you_give:
  - What is being launched
  - Launch date, time and window
  - Team and on-call roles
  - Rollback criteria
  - Who needs updates and when
you_get:
  - A pre-launch checklist
  - Go-live steps in order
  - DNS cutover steps
  - A post-launch watch plan
  - A rollback plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in this skill. No code, files or paid tools are needed.
  - Paste what you are launching, the date and window, your team and roles, and when you would roll back.
  - Add who needs updates and when. If you are changing DNS, say so, so the runbook includes those steps.
  - Check the result. Every cutover step should have an owner and a way to confirm it worked.
  - Replace any rollback numbers with limits you choose, such as an error rate or a drop in sales.
  - Walk through the runbook with your whole team before launch day.
output_sample:
  input:
    - What is being launched
    - Launch date, time and how long the window is
    - Your team, their roles and who is on call
    - When to roll back
    - Who needs updates, and when
  output:
    - name: Launch metadata
      contains: What is launching, when, and who is involved.
    - name: Roles and responsibilities
      contains: Who leads, deploys, tests, sends updates and is on call, with what each person owns.
    - name: Pre-launch checklist
      contains: Checks at 30 days, 7 days, 1 day and 1 hour before launch.
    - name: Cutover sequence
      contains: Numbered steps, each with an owner, pre-condition, action, check, time estimate and rollback.
    - name: Rollback procedure and criteria
      contains: The steps to pull back, and the automatic and discretionary triggers for doing it.
    - name: Communication plan
      contains: Which channels to use, how often to update, and what customers and support are told.
    - name: Verification checklist
      contains: What to check in the first hour and the first day.
    - name: Stabilization plan and contacts
      contains: What to watch for the first week, plus escalation paths and on-call names.
