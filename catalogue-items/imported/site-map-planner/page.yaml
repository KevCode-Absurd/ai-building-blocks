thinking: medium
thinking_why: It structures many pages into one plan.
new_slug: site-map-planner
name: Site map planner
summary: "Plan your site map: get a page tree, menu plan, URL list and internal link map from a short brief about your business and goals."
job: build-websites
headline: Site map planner
subhead: A site map with page hierarchy, navigation, URL plan and internal links, so visitors find things and search engines follow your structure. It stops a site from growing into a pile of orphan pages.
explain: |
  A site map with page hierarchy, navigation, URL plan and internal links, so visitors find things and search engines follow your structure. It stops a site from growing into a pile of orphan pages.

  Tell it what the business does, who the audiences are and the top goals: sales, search traffic, education or support. For an existing site, it asks what is broken and which URLs need redirects. It matches the site type (SaaS, blog, shop, docs, local business) to a layout. Then it draws the hierarchy, sets URL patterns, plans the top menu and footer, and maps links between pages. Platform choice and migration notes are also covered.

  This is a copy of the MIT-licensed site-architecture skill by Corey Haines. The page text is ours.
when:
  - You are planning a new website from scratch.
  - Your menu has grown messy and visitors cannot find pages.
  - You are restructuring and must keep old URLs working.
  - You want internal links that help search rankings.
not_for:
  - You want an XML sitemap file for Google. Use an SEO auditor tool or your site platform's sitemap setting instead.
  - You only need to pick a website builder. Compare platforms on their own first, then come back to plan your pages.
  - You have a one-page site. A simple list of sections on that page is enough.
you_give:
  - What the business does and who it serves
  - Site goals
  - Current page list or URLs (optional)
  - Site type and platform
you_get:
  - A page hierarchy
  - A navigation plan
  - A URL structure
  - An internal linking map
  - Redirect notes for moved pages
how_to_use:
  - "Open Claude, ChatGPT or Gemini and paste the skill text. No code or paid tool is needed. The skill links to four reference files in the references folder of this item: site-type-templates.md, navigation-patterns.md, mermaid-templates.md and platforms-and-migration.md. In a chat that cannot open them, paste the one for your site type, and platforms-and-migration.md if you are moving platforms."
  - "Have ready: your business brief (what you do, who you serve, your top 3 goals), your site type and platform, and your current URL list if the site exists."
  - "Paste your business brief first: what you do, who you serve and your top 3 goals."
  - Add your site type and platform. If the site exists, paste your current URL list and say what is broken.
  - Answer any questions your AI asks, such as your 5 most important pages.
  - "Read the results in order: page tree, visual sitemap, URL table, navigation spec, then linking plan."
  - Check that every old URL you must keep has a redirect before you build.
  - Next, take the URL map table into your site builder or CMS. Before go-live, use the Site go-live runbook writer for launch checks.
output_sample:
  input:
    - What your business does and who it serves
    - Your top 3 goals for the site
    - Your site type and platform
    - Your current page list or URLs (optional)
    - The 5 most important pages (optional)
  output:
    - name: Page hierarchy
      contains: A text tree of every page and its URL, from the homepage down to detail pages.
    - name: Visual sitemap
      contains: A Mermaid diagram showing how pages connect and which ones sit in the header and footer.
    - name: URL map table
      contains: One row per page with its URL, parent page, menu location and priority.
    - name: Navigation spec
      contains: The ordered header items, footer columns, sidebar menu if needed, and breadcrumb notes.
    - name: Internal linking plan
      contains: Hub pages and their linked pages, cross-section links, and a check for orphan pages.
