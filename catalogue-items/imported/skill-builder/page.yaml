thinking: medium
thinking_why: It follows a set method with a few design choices.
new_slug: skill-builder
name: Skill builder
summary: Describe what your AI should learn. Get a ready skill folder with clear instructions and helper files, from this free AI skill builder.
job: make-skills
headline: Skill builder
subhead: A finished skill folder with clear instructions and helper files, built from your description of what the AI should learn. The result loads into your assistant and gives it know-how it did not have.
explain: |
  A finished skill folder with clear instructions and helper files, built from your description of what the AI should learn. The result loads into your assistant and gives it know-how it did not have.

  It starts by asking what the skill must do and with which examples. It treats the context window as shared space, so it keeps the main file short and puts the rest in separate reference files, scripts and assets that load only when needed. It also sets how rigid each part should be: free text where many approaches work, set scripts where steps are fragile. The folder is then built and checked.
when:
  - You repeat the same instructions to your AI every week.
  - You want to package a company process so the AI follows it.
  - You have a script or file format the AI keeps handling badly.
  - You want to update a skill you already made.
not_for:
  - "You only need a one-off answer: write a normal chat prompt instead."
  - "You want a different kind of result, such as a plan or a draft: ask your AI for it directly in a chat."
  - "You already have a skill that works: use it as it is and skip the rebuild."
you_give:
  - What the skill should do
  - Example tasks or documents
  - Any scripts, templates or rules to include (optional)
you_get:
  - A skill folder with a main instruction file
  - Reference files and helper scripts
  - A short description that triggers the skill
  - Notes on how to test it
how_to_use:
  - Open Claude, ChatGPT or Gemini. Add this skill from the "Add it to your AI" section on this page, or copy it and paste it into the chat.
  - Describe the job you want the skill to do. Add two or three real examples of that job.
  - Answer any questions it asks. It may ask what the skill must do and what should trigger it.
  - "Check the folder it builds: a main SKILL.md plus any reference files, scripts or assets."
  - Building real files and running scripts needs an AI that can create files and run code. In a plain chat, ask for the text of each file (SKILL.md, any reference files, and the test notes) and save each one yourself. The helper scripts and the agents metadata file are for tools that run code, so skip them in a plain chat.
  - Load the folder into your AI tool if it supports skills. If not, paste the SKILL.md text at the start of a chat.
output_sample:
  input:
    - What you want the skill to do
    - Example tasks or documents it should handle
    - Any scripts, templates or rules to include (optional)
    - The skill you want to change, if you are updating one (optional)
  prerequisites:
    - An AI that can create files and run code, to build and check the folder
  output:
    - name: SKILL.md
      contains: The main instruction file, with a short name and description that tell your AI when to use the skill.
    - name: scripts/
      contains: Helper scripts for steps that are fragile or must be done the same way each time.
    - name: references/
      contains: Longer notes, rules or schemas that your AI reads only when the task needs them.
    - name: assets/
      contains: Templates or files the skill uses in its results, such as a document layout.
    - name: agents metadata
      contains: A short description of the skill, so your AI tool can list it.
    - name: Test and iterate notes
      contains: Steps to try the skill on real tasks and improve it after each run.
