thinking: high
thinking_why: It orders steps by what each one depends on.
new_slug: skill-progression-map-builder
name: Skill progression map builder
summary: Name a skill and a year group. Get a skill progression map from first prerequisite to mastery, with checks to find where a student is stuck.
job: teach-and-train
headline: Skill progression map builder
subhead: A map of steps from first prerequisite to mastery of a skill, with checks to find where a student is stuck. You can teach in the right order and fill gaps early.
explain: |
  A map of steps from first prerequisite to mastery of a skill, with checks to find where a student is stuck. You can teach in the right order and fill gaps early.

  Licence: CC BY-SA 4.0, as the LICENSE file in this item says. Credit goes to Gareth Manning.

  You name the target skill and the student level. It lays out the stages from novice to proficient, and shows which stage must come before another. Each stage gets a way to check it, so a short diagnostic points to the exact step a learner missed. It rests on learning progression research, which describes the more advanced ways of thinking that follow one another. It suits sequencing a unit or planning support for pupils who are behind.
when:
  - You plan a unit and need to sequence the content. The skill's own time estimate for you is about 4 minutes.
  - A student fails a task and you need to find the missing step.
  - You want a short diagnostic that locates a gap.
  - You are building a curriculum for a new skill.
not_for:
  - "You need a plan for one lesson: write the lesson plan yourself or ask your AI for a simple lesson outline."
  - "You need a full year plan or whole curriculum: use the Course scope and sequence planner item."
  - "You want to grade a student's finished work: use your own marking guide or a rubric."
you_give:
  - The target skill
  - Student year group or level
  - Common misconceptions you see (optional)
  - Time available (optional)
you_get:
  - Ordered stages from prerequisite to mastery
  - Links showing what depends on what
  - Checks for each stage
  - Notes on common stuck points
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill's instructions. No code, files or paid tools are needed. The full prompt sits under the Prompt heading in SKILL.md, the skill file in this item.
  - In the pasted prompt, replace the {{target_skill}} and {{student_level}} placeholders with your own text. Replace the optional ones too, or delete those lines. Then send it as one message.
  - Type the skill you want students to reach, and their year group. Add the subject if you like.
  - Add what students know when they start, and any class data or standards you have (optional).
  - Read the map. Check that the order of stages makes sense for your students.
  - Try one diagnostic task with a real student before you use the map for the whole class.
  - Use the stuck points and teaching notes to plan your next lessons. Next, turn each stage into practice with the Practice problem set writer.
output_sample:
  input:
    - The skill students should reach by the end
    - The year group or age range
    - Where students usually start (optional)
    - The subject (optional)
    - Class data or curriculum standards (optional)
  output:
    - name: Progression Map
      contains: Ordered stages from novice to the target skill, with signs you can see in a student's work at each stage.
    - name: Prerequisite Diagram
      contains: Which stages depend on which, so you can see what must be learned first.
    - name: Common Stuck Points
      contains: Where students often stall at each stage, and why.
    - name: Teaching Implications
      contains: What to do in class based on the map, including how to use the diagnostic tasks.
