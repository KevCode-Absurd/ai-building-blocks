thinking: medium
thinking_why: It runs checks and scores results.
new_slug: skill-quality-tester
name: Skill quality tester
summary: Check a skill's structure, run its Python scripts and get a quality score with a to-do list of fixes before you ship it.
job: make-skills
headline: Skill quality tester
subhead: A score and a to-do list for a skill, after its structure is checked and its scripts are run. You find weak spots before you ship it.
explain: |
  A score and a to-do list for a skill, after its structure is checked and its scripts are run. You find weak spots before you ship it.

  Four tools run from the repo root. The validator checks front matter, required sections and folder layout against a tier. The script tester checks that Python scripts have valid syntax, standard imports, run, and print output. The quality scorer rates several dimensions and gives a letter grade with a road map of improvements. The security scorer rates risk and can run inside the quality score. You can set a minimum score so it fails a build. It needs Python only.
when:
  - You wrote a skill with scripts and want to know they run.
  - You want a letter grade and a list of what to improve.
  - You need a score gate in your build pipeline.
  - You review a library of skills and want to rank them.
not_for:
  - "You are writing a new skill: follow the write-a-skill guide in the claude-skills repo instead, since this tester's line minimums suit older skills."
  - "Your skill has no Python scripts: the script tests have nothing to run, so a careful read-through by a person is simpler."
  - "You want to check many skills at once: this tool checks one skill folder per run, so loop over your folders in a script."
you_give:
  - A skill folder
  - Python 3
  - A minimum score (optional)
you_get:
  - A structure check result
  - Script test results
  - A quality score and grade
  - An improvement road map
  - A security score
how_to_use:
  - Check that your skill folder sits in the claude-skills repo, for example at engineering/skills/your-skill. The commands expect that folder layout, so the path must match. This copy has only four tools: the validator, the script tester, the quality scorer and the security scorer. The skill's audit_skills.py tool, which checks many skills at once, is not included, so run the three commands on each folder in turn.
  - "Run the tools in this order: skill_validator.py first, then script_tester.py on a throwaway copy only, then quality_scorer.py. Because audit_skills.py is not included, loop over your folders by hand."
  - Open a terminal in the repo root, or use an AI that can run code and read files. Python 3 is all you need.
  - Run the structure check on your skill folder with the skill_validator.py script. Add the JSON flag if you want results a program can read.
  - Read the skill's Python scripts first. script_tester.py runs them, so only use it on code you trust, and run it on a throwaway copy of the folder or inside a container. Then run the script_tester.py script on that copy, then the quality_scorer.py script. Add a minimum score if you want it to fail below a bar.
  - Work through the improvement roadmap from the top. Fix one item, then run all three checks again.
  - Stop when the structure check passes, every script passes and the score meets your target. Then update the skill's README to match what you changed, and ship it.
output_sample:
  input:
    - A skill folder inside the claude-skills repo, such as one under engineering/skills
    - Python 3 on your computer
    - A minimum score to pass (optional)
    - "A tier to check against: BASIC, STANDARD or POWERFUL (optional)"
  prerequisites:
    - An AI that can run code and read files, or a terminal you run the commands in yourself
    - The claude-skills repo layout, with the skill folder at engineering/skills/<name>
  output:
    - name: Structure check
      contains: Pass or fail on front matter, required sections, folder layout and line counts, with an overall score and compliance level.
    - name: Script test results
      contains: "For each Python script: syntax, imports, a timeout-protected run, help text and output compared with expected files."
    - name: Quality score
      contains: A score from 0 to 100 and a letter grade across documentation, code quality, completeness and usability.
    - name: Tier recommendation
      contains: Whether the skill reads as BASIC, STANDARD or POWERFUL, based on its size and features.
    - name: Improvement roadmap
      contains: A ranked list of fixes to work through from the top, then re-run until you reach your target score. The scorer's JSON has the fields overall_score, letter_grade, tier_recommendation, dimensions and improvement_roadmap. The validator's JSON has overall_score, compliance_level and checks.
    - name: Security score
      contains: A risk rating for the skill, which can also be added into the quality score.
