thinking: medium
thinking_why: It scans for known dangerous patterns.
new_slug: skill-safety-auditor
name: Skill safety auditor
summary: Give it a skill before you install it. Get risky code and hidden commands flagged.
job: secure-code
headline: Skill safety auditor
subhead: Give it a skill before you install it. Get risky code and hidden commands flagged.
explain: |
  A PASS, WARN or FAIL verdict on a skill before you install it, with the risky code and hidden commands flagged. You avoid giving a stranger's script access to your machine.

  Point it at a local folder or a git repo. A Python script scans code files for command injection, code execution, hidden or encoded payloads, network sends and attempts to read keys or credentials. Each finding has a severity and a note on how to fix it. A strict mode turns every warning into a fail, and you can ask for a JSON report. It reads the files and does not run them.
when:
  - You found a skill on GitHub and want to check it before installing.
  - Your team accepts skills from outside and needs a gate.
  - A skill asks for scripts and you are unsure what they do.
  - You want a report you can attach to an approval.
you_give:
  - A skill folder or git repo link
  - Python 3
  - Strict mode choice (optional)
you_get:
  - A PASS, WARN or FAIL verdict
  - Findings by severity
  - Fix advice
  - A JSON report if requested
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and read files.
