thinking: medium
thinking_why: It must design tasks at two distances.
new_slug: skill-transfer-challenge-writer
name: Skill transfer challenge writer
summary: Give it something a learner has mastered. Get near and far challenges
  that show if it carries to new tasks.
job: teach-and-train
headline: Skill transfer challenge writer
subhead: Two challenges that show whether a learner truly understands an idea or
  only knows the one example they practised. After someone shows they have
  grasped a concept, you get a near challenge and a far challenge to test it.
explain: |
  Two challenges that show whether a learner truly understands an idea or only knows the one example they practised. After someone shows they have grasped a concept, you get a near challenge and a far challenge to test it.

  The near challenge keeps the same principle but changes the surface, like a new example from a close topic. The far challenge changes the surface and the setting, so the learner has to spot the same pattern somewhere unfamiliar. You can pick the domains yourself or let the skill choose, and set the age or level. If the learner stalls on the far task, you learn that the idea is still tied to its first context.
when:
  - A student just passed a quiz and you want to know if the idea sticks.
  - You teach one method and want proof it works outside the textbook example.
  - You are writing follow-up tasks for a lesson plan.
  - A learner gets the worked example right but fails when it looks different.
you_give:
  - The concept the learner just showed they understand
  - The context where they learned it
  - A near and a far domain to use (optional)
  - The learner's age or stage (optional)
you_get:
  - A near-transfer challenge
  - A far-transfer challenge
  - A note on what a successful answer looks like
  - Guidance on what a miss tells you
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
