thinking: medium
thinking_why: It must design tasks at two distances.
new_slug: skill-transfer-challenge-writer
name: Skill transfer challenge writer
summary: Test if a learner can use an idea in a new setting. Give it a concept they know and get a near and a far skill transfer challenge.
job: teach-and-train
headline: Skill transfer challenge writer
subhead: "Give it a concept a learner has just shown they understand. It writes two tasks: one close to what they learned and one far from it. The tasks show if the idea carries over or only works for the first example."
explain: |
  Two challenges that show whether a learner truly understands an idea or only knows the one example they practised. After someone shows they have grasped a concept, you get a near challenge and a far challenge to test it.

  The near challenge keeps the same principle but changes the surface, like a new example from a close topic. The far challenge changes the surface and the setting, so the learner has to spot the same pattern somewhere unfamiliar. You can pick the domains yourself or let the skill choose, and set the age or level. If the learner stalls on the far task, you learn that the idea is still tied to its first context.
when:
  - A student just passed a quiz and you want to know if the idea sticks.
  - You teach one method and want proof it works outside the textbook example.
  - You are writing follow-up tasks for a lesson plan.
  - A learner gets the worked example right but fails when it looks different.
not_for:
  - You want to build a skill like arithmetic or grammar. These carry over through practice, so use practice drills from your teacher or a workbook.
  - You still need to check if the learner understands the idea at all. Ask a few plain quiz questions first, then come back here.
  - You want a full lesson plan or a graded test. Write those yourself or with a teacher, then use this for the follow-up task.
you_give:
  - The concept the learner just showed they understand
  - The context where they learned it
  - A near and a far domain to use (optional)
  - The learner's age or stage (optional)
you_get:
  - A near-transfer challenge
  - A far-transfer challenge
  - A note on what a successful answer looks like
  - Guidance on what a miss tells you
how_to_use:
  - Before you start, the learner must already have shown they understand the concept, for example by passing a quiz or explaining it in their own words. Have that answer ready to paste in as the learner's prior answer.
  - Open a chat with your AI. No code, files or paid tools are needed.
  - Paste the system prompt from the SKILL.md file into the chat. It has {{placeholder}} fields. Replace each one with your concept, the original context and any optional domains, or delete the line, before you send it.
  - Type the concept the learner just understood and where they learned it.
  - Add a near domain, a far domain and the learner's age or stage if you want to choose them (optional).
  - Give the two challenges to the learner. Paste their answers back into the chat to see what they show.
  - Next, pair it with the Retrieve first gate or the Unassisted evidence checkpoint to check the idea again later.
output_sample:
  input:
    - The concept the learner just showed they understand
    - Where they first learned it, such as the subject and the examples used
    - A domain for the near challenge (optional)
    - A domain for the far challenge (optional)
    - The learner's age or stage (optional)
  output:
    - name: Near-transfer challenge
      contains: A task with the same principle but a slightly different surface, set in a close topic.
    - name: Far-transfer challenge
      contains: A task with the same principle in a different surface and setting, so the learner must spot the pattern.
    - name: What a good answer looks like
      contains: A short note on what a successful response shows about the learner's grasp of the idea.
    - name: What a miss tells you
      contains: Guidance on what a failed attempt means, such as the idea still being tied to its first context.
