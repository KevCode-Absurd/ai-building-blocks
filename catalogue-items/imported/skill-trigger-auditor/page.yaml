thinking: medium
thinking_why: It must judge how people phrase requests.
new_slug: skill-trigger-auditor
name: Skill trigger auditor
summary: Find out why a skill won't fire. Grade each skill A to F, test a sample request, and spot skills that block each other.
job: make-skills
headline: Skill trigger auditor
subhead: Give it the folder that holds your AI skills. It grades each skill from A to F on how likely it is to run. It can also show which skill a sample request would pick.
explain: |
  A graded report card for your AI skills that shows which ones will actually run when someone asks. A skill can be written well and still never fire, because its short description is vague or a sibling skill wins first. This tool catches that.

  It grades each skill from A to F on its name and description. You can also type a sample request and see which skill it would pick and why. A collisions view lists groups of skills that shadow each other. A fix option adds a clearer "use when" line to weak descriptions. It runs from the command line, so you need Node or Homebrew.

  Licence: the skill text in this copy is CC BY 4.0, as the LICENSE-CONTENT file says. The skill-issue tool you install is the original author's code, and that is MIT, which is the licence the skill file header names. Credit goes to mishanefedov and sickn33.
when:
  - A skill you wrote never seems to run and you do not know why.
  - You want to know which skill a request like "deploy to prod" will pick.
  - You have many skills and think two of them overlap.
  - You want a check that stops a pull request that adds a weak skill description.
not_for:
  - 'You want to check one skill file for quality: read its description yourself and make sure it has a clear "use when" line.'
  - "You cannot run commands on your computer: ask a teammate who can, or review each skill description by hand."
  - "You want to test how well a skill does its job: run the skill on a real task and read the result."
you_give:
  - The folder that holds your skills
  - A sample request to test (optional)
you_get:
  - An A to F grade for every skill
  - A ranked list of which skill fires for your sample request
  - A list of skills that block each other
  - Suggested "Use when" lines for weak descriptions
how_to_use:
  - Install the tool on your computer. Use npm, brew or npx, as shown in the skill file. This needs code running, so a chat window alone will not work.
  - "Run it on your skills folder, for example: skill-issue ~/.claude/skills."
  - Read the A to F grades. Start with the F and C skills.
  - "Test a request: add --why followed by your sample request in quotes. Check the margin between the top two skills."
  - Run it with --collisions to see which skills shadow each other.
  - Run it with --fix to add "Use when" lines. It edits your skill files in place, so commit or back up the folder first. Read every edit before you keep it.
  - Next, re-run the audit after you edit any flagged skill. To stop weak descriptions in future, add the --json check to your build pipeline so it fails when it finds errors.
  - The optional --llm flag judges with a local claude or codex command line tool, which must already be installed. Leave it off to stay offline.
output_sample:
  input:
    - The folder that holds your skills
    - A sample request to test, like "deploy to prod" (optional)
  prerequisites:
    - A computer where you can run commands (Node or Homebrew)
    - Skill files in SKILL.md format
  output:
    - name: Grades
      contains: An A to F grade for each skill, with a note on what is wrong, such as no description or no "use when" line.
    - name: Collisions summary
      contains: A short list of skills that are likely to block each other.
    - name: Why view
      contains: For your sample request, a ranked list of skills with scores, showing which one would fire and how close the next one is.
    - name: Collisions view
      contains: Groups of skills that shadow each other, so you can see which one wins.
    - name: Fix option
      contains: Adds a "Use when" line to weak descriptions. You should review each edit before you keep it.
    - name: JSON report
      contains: The same results in a machine-readable form, which stops a check when it finds errors.
