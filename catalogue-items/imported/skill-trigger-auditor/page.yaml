thinking: medium
thinking_why: It must judge how people phrase requests.
new_slug: skill-trigger-auditor
name: Skill trigger auditor
summary: Give it your skills. Get a grade for each on when it fires, and which
  skills block each other.
job: make-skills
headline: Skill trigger auditor
subhead: A graded report card for your AI skills that shows which ones will
  actually run when someone asks. A skill can be written well and still never
  fire, because its short description is vague or a sibling skill wins first.
explain: |
  A graded report card for your AI skills that shows which ones will actually run when someone asks. A skill can be written well and still never fire, because its short description is vague or a sibling skill wins first. This tool catches that.

  It grades each skill from A to F on its name and description. You can also type a sample request and see which skill it would pick and why. A collisions view lists groups of skills that shadow each other. A fix option adds a clearer "use when" line to weak descriptions. It runs from the command line, so you need Node or Homebrew.
when:
  - A skill you wrote never seems to run and you do not know why.
  - You want to know which skill a request like "deploy to prod" will trigger.
  - You have many skills and suspect two of them overlap.
  - You want a check that blocks a pull request with a weak skill description.
you_give:
  - The folder that holds your skills
  - A sample request to test (optional)
  - Permission to run a command line tool
you_get:
  - An A to F grade for every skill
  - A trace of which skill fires for your request
  - A list of skills that block each other
  - Suggested clearer descriptions
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your skill files.
