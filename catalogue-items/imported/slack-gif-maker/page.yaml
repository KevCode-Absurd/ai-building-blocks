thinking_why: It follows set size rules and a few animation steps.
new_slug: slack-gif-maker
name: Slack GIF maker
summary: Make a Slack GIF from a plain description. You get an animated emoji or message GIF at Slack's size, checked against Slack's limits.
job: make-images
headline: Slack GIF maker
subhead: A small animated GIF that fits Slack's limits and looks right on screen. You describe the animation, like a star spinning or a coffee cup bouncing, and get a file that uploads without trouble.
explain: |
  A small animated GIF that fits Slack's limits and looks right on screen. You describe the animation, like a star spinning or a coffee cup bouncing, and get a file that uploads without trouble.

  The skill draws each frame in Python with simple shapes, or uses an image you give it. It follows Slack's rules: 128 by 128 pixels for emoji, 480 by 480 for messages, 10 to 30 frames per second, and 48 to 128 colours. Emoji GIFs stay under about three seconds. A check step flags files that are too big, and it trims colours and frames until the file fits. You need Python with the Pillow image library.
when:
  - You want a custom emoji GIF for your team's Slack.
  - A GIF you found is too large and Slack rejects it.
  - You want to animate a logo or a photo for a message.
  - You need a short reaction animation made from a plain description.
not_for:
  - "You want a still image or logo: use an image editor or ask your AI to draw it."
  - "Your GIF is already within Slack's limits: upload it with Slack's own uploader."
  - "You need a video clip or a screen recording: use a screen recorder, then convert it with a GIF tool."
you_give:
  - A description of the animation
  - An image to animate (optional)
  - Whether it is for emoji or a message
  - Colours or style notes (optional)
you_get:
  - An animated GIF at the right Slack size
  - A check of the file against Slack's limits
  - A smaller version, only if you ask for one
how_to_use:
  - Open your AI tool. Use one that can run Python code and save files. This is not a plain-chat job: if you cannot run Python, ask someone who can.
  - Paste the skill text, or upload the skill folder.
  - Describe the animation, like a star spinning. Say if it is for emoji or a message.
  - Add an image or colour notes if you have them.
  - Your AI follows these steps. It makes a GIF builder, draws each frame, saves the file, then runs the Slack check on it.
  - Check the GIF and the Slack check result. Ask for a smaller file if it is too big.
  - To use it, upload the GIF as a custom emoji in Slack's emoji settings, or post it in a message.
output_sample:
  input:
    - A description of the animation, such as a star spinning
    - Emoji or message use
    - An image to animate (optional)
    - Colours or style notes (optional)
  prerequisites:
    - An AI that can run Python code and save files
    - Python with the pillow, imageio and numpy libraries installed
  output:
    - name: Animated GIF
      contains: The finished animation, drawn frame by frame at 128 by 128 for emoji or 480 by 480 for messages.
    - name: Slack check
      contains: A pass or fail check of the file against Slack's size, frame and colour limits.
    - name: Smaller version
      contains: "Only if you ask for it: a lighter file with fewer frames, fewer colours or smaller dimensions."
