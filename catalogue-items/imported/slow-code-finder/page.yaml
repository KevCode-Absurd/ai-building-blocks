thinking: medium
thinking_why: It runs profilers and reads their output.
new_slug: slow-code-finder
name: Slow code finder
summary: Find why your Node.js, Python or Go app is slow. Get ranked CPU, memory and database hot spots, with proof and one fix at a time.
job: test-and-fix-code
headline: Slow code finder
subhead: Point it at a slow page, endpoint or app in Node.js, Python or Go. It measures where time and memory go, ranks the causes, and shows the gain from each fix against a baseline.
explain: |
  A slow app is hard to fix by guessing. This slow code finder profiles your Node.js, Python or Go app first, then tells you which line, query or file costs the most. You see the proof before you change anything.

  It checks CPU time with flame graphs, memory growth with heap snapshots, page weight with a bundle report, and slow database queries with EXPLAIN. It also looks for the N+1 pattern, where code runs one query for every row. A small Python script scans your project for large files and heavy dependencies.

  Every fix starts from a recorded baseline and is measured again after one change. If a change does not help, you see that too. It can also write a k6 or Artillery load test so you can try a traffic spike on a test copy before launch.
when:
  - A page or endpoint is slow and you do not know which part to blame.
  - Memory use climbs for hours and you suspect a leak.
  - Your page got heavier after you added a package.
  - A sale or launch is coming and you want to load test a staging copy first.
not_for:
  - The app is only slow right after a deploy. That is a start-up problem, so check your host's settings first.
  - You need to know what size of server to buy. That is capacity planning, not profiling.
  - You want a general review of messy code. Use the Code habits reviewer instead.
  - Your slow part is a single loop you have not shipped yet. Use the Code performance planner to plan it before you write it.
you_give:
  - The project folder, or the slow endpoint, page or query
  - Your language, Node.js, Python or Go
  - A number for "slow", such as a page that takes 4 seconds (optional)
  - A target, such as under 300 ms for most requests (optional)
  - A test or staging copy where tools can run
you_get:
  - A ranked list of hot spots with file, line and measured cost
  - Evidence for the top three, such as a flame graph or a query plan
  - A before and after table for each fix
  - A load test script, if you ask for one
  - The next fix to try and a speed limit to watch
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill. If you use Claude Code, add the folder, since it ships a scan script and two guides.
  - Give it the slow endpoint, page or folder, your language, and a test copy to run on. Never point load tests at your live site.
  - Ask it to record a baseline first. Check that it has numbers for response time and memory before it changes any code.
  - Read the ranked hot spot table. Fix the top item only, then ask it to measure again.
  - If your AI cannot run code, ask for the commands, run them yourself and paste back the output. Anything marked MISSING was not measured.
  - Save the before and after table in your pull request so your team sees the gain.
how_it_works:
  - title: Record a baseline
    text: It notes response times, requests per second, error rate and memory before touching anything.
  - title: Scan the project
    text: A bundled script lists large files and counts dependencies, so heavy parts show up early.
  - title: Profile the cause
    text: It picks the right tool for the symptom, such as a flame graph, a heap snapshot or EXPLAIN on a query.
  - title: Rank by measured cost
    text: It orders hot spots by what they cost in your own run, not by a rule of thumb.
  - title: Fix one thing
    text: It changes one thing at a time, measures again and undoes it if the gain is not real.
  - title: Write the report
    text: You get the hot spot table, the proof, the fix log and the next step.
output_shape: |
  Summary
  <the slow thing, its main cause and the best fix>

  Baseline
  | metric | value |
  <P50, P95, P99, requests per second, error rate, memory>

  Hot spots
  | rank | location | cost type | measured impact | suggested fix |
  <up to 10 rows>

  Evidence
  <flame graph, heap snapshot, query plan or bundle chunks for the top three>

  Fix log
  | metric | before | after | change |
  <one table per fix>

  Next steps
  <the next fix, a test to keep the gain, a speed limit to watch>
output_sample:
  input:
    - The slow endpoint, page or project folder
    - Your language, Node.js, Python or Go
    - A target or "slow" number (optional)
  prerequisites:
    - An AI that can run code, or someone who can run the commands it gives you
    - A test or staging copy with realistic data
    - Profiling tools for your language, such as py-spy for Python or pprof for Go
  output:
    - name: Summary
      contains: The slow thing, its main cause and the best fix in three sentences.
    - name: Baseline
      contains: Response times at three levels, requests per second, error rate and memory before any change.
    - name: Hot spots
      contains: A ranked table of locations, cost type, measured impact and a suggested fix.
    - name: Evidence
      contains: The flame graph, heap snapshot, query plan or bundle list behind the top three.
    - name: Fix log
      contains: Before and after numbers for each change that was made or proposed.
    - name: Load test script
      contains: A k6 or Artillery script and how to run it, when you ask for one.
    - name: Next steps
      contains: The next fix, a test to keep the gain and a limit to watch.
works_best_with:
  tools:
    - name: Claude Code
      why: It can run the scan script and the profilers on your project and read their output directly.
    - name: ChatGPT with data analysis
      why: It can run Python for the scan and read a profile file you upload.
    - name: Any good chat AI
      why: Works as a guide if you run the commands and paste the output back.
  inputs:
    - A flame graph or profile file you already have
    - The slow query log from your database
    - Your monitoring numbers from the last week
terms:
  - term: Flame graph
    meaning: A picture of where a program spends its time, with wide bars for the slowest parts.
  - term: N+1 query
    meaning: Code that runs one extra database query for every row it loads, which adds up fast.
  - term: P95 latency
    meaning: The response time that 95 out of 100 requests beat. It shows how slow the worst cases are.
  - term: Heap snapshot
    meaning: A saved picture of what is in memory at one moment, used to find leaks.
