thinking: medium
thinking_why: It follows a strict loop of change, test and undo.
new_slug: slow-code-speeder
name: Slow code speeder
summary: Speed up slow code that times out on big inputs. Your AI makes one change at a time and runs tests before and after each one.
job: test-and-fix-code
headline: Slow code speeder
subhead: Faster code that still gives the same answers. You hand over code that works but is too slow on big inputs, and the skill cuts its time or memory cost one change at a time.
explain: |
  Its firm rule is that tests must pass before and after every change. If you have no tests, it first writes one from a sample input and the current output. Then it makes a single transformation, such as replacing a nested scan with a lookup table or running independent awaits together, and runs the tests. A failed test means the change is reverted and the work stops. It also fixes N+1 queries in common ORMs. No change goes in without proof.

  Licence: the skill file's own header (morsechimwai) says Apache-2.0. sickn33's LICENSE-CONTENT file (CC BY 4.0) applies only where no more specific upstream notice exists, so Apache-2.0 covers this skill file. Keep the Apache-2.0 notice and the credit to morsechimwai and sickn33. We replaced pointers to three skills that are not in this library with plain steps, and marked that change at the end of the file.
when:
  - A function times out when the list gets large.
  - Nested loops are slowing a report that used to be quick.
  - An ORM makes one database call per row.
  - You fear a speed-up will quietly break results.
not_for:
  - "You are writing new code and want it fast from the start: ask your AI to plan the approach first, before any code exists."
  - "Your code is wrong, not slow: fix the bug first, then come back to speed it up."
  - "You need a math-level trick such as a Bloom filter or an FFT: ask a developer, as this skill only covers common code changes."
you_give:
  - The slow code
  - Test files, or a sample input (optional)
  - The size of data that causes trouble
you_get:
  - A faster version of the code
  - A test that locks in current behaviour
  - One change at a time, each tested
  - A note on the time or memory saved
how_to_use:
  - "Have ready: an AI that can run code and read your project (such as Claude), your slow code, existing tests or a sample input, and how big the data gets. No install is needed."
  - Paste the skill text into the chat, or upload the skill file.
  - Paste your slow code. Add your tests if you have them, and say how big the data gets.
  - Let it run the tests first. If you have none, it writes one from a sample input and the current result.
  - Check each change it proposes. If a test fails, it undoes that change and stops.
  - The skill does not run benchmarks for you. Give it a typical input and the command you use to time it, or the before and after ratio will be a guess.
  - Apply the final diff only after your own tests pass.
  - Next, rerun the same timing command on the changed code. Keep the change only if it is faster, and put the before and after timings in the commit message. Then run your full test suite in your build system, or have the Parallel code reviewer check the diff.
  - For new code, plan the approach first. For math-level changes, such as a Bloom filter or an FFT, ask a developer.
next: [parallel-code-reviewer, agency-engineering-database-optimizer]
output_sample:
  input:
    - Your slow code
    - Your test files, or a sample input (optional)
    - How big the data gets when it slows down
  prerequisites:
    - An AI that can run code and read your project files, for the best results
  output:
    - name: Bottleneck
      contains: The file and line that cause most of the slowness, with one sentence on why.
    - name: Current complexity
      contains: How the time and memory cost grow now as the input gets bigger.
    - name: Transformation
      contains: The single change made, such as swapping a repeated scan for a lookup table.
    - name: New complexity
      contains: How the time and memory cost grow after the change.
    - name: Semantic risk
      contains: Anything callers might notice, such as order or error timing, or None.
    - name: Measured speedup
      contains: Before and after timing as a ratio, or a note that it is a gain in theory only.
    - name: The diff
      contains: The exact code change, ready to apply once your tests pass.
