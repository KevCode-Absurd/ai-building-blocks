thinking: high
thinking_why: It weighs evidence across many possible causes.
new_slug: slow-system-investigator
name: Slow system investigator
summary: Find why a server, container or app is slow. Get a checked list of causes and an incident report that shows the evidence for each one.
job: test-and-fix-code
headline: Slow system investigator
subhead: A short list of checked causes and a clear incident report when a server, container or app is slow or failing. Instead of running whatever commands come to mind, the skill follows a fixed method from performance expert Brendan Gregg.
explain: |
  When a server is slow, people often guess and change things. This skill checks one part at a time instead (processor, memory, disk, network) and writes down the proof for each, so you know what to fix. It gives a short list of checked causes and a clear incident report. It follows a fixed method from performance expert Brendan Gregg.

  First it uses the USE method: for each resource such as CPU, memory, disk and network, check use, saturation and errors. Then the TSA method looks at where each thread spends its time. Each finding is tied to evidence, such as command output, so you can see why a cause was ruled in or out. The last step writes a root cause report or postmortem. It works best on Linux systems where you can run the commands.

  Licence: the author's own file header (thecsdoctor) says MIT, and that covers this skill text. sickn33's LICENSE-CONTENT file (CC BY 4.0) applies only where no more specific upstream notice exists. Keep the MIT notice and credit thecsdoctor and sickn33.
when:
  - A server is slow and nobody knows why.
  - Latency jumped after a deploy or a config change.
  - Threads pile up and your app hangs.
  - You must write a postmortem and need the evidence in order.
not_for:
  - You have a bug in your app logic and nothing is slow. Read the code and debug it with a developer instead.
  - Your host is not Linux. Check the tool list first, or ask a systems engineer for the matching tools on your system.
  - You need a fix applied for you. This skill only reads at first, so ask your ops team to make changes after you approve them.
you_give:
  - A description of the slow or failing system
  - Access to run checks, or pasted command output
  - What changed recently (optional)
you_get:
  - A resource by resource checklist
  - Findings with the evidence behind them
  - The most likely root cause
  - A written incident or postmortem report
how_to_use:
  - "Have ready: a Linux machine you are allowed to operate, the right to run commands on it, and for some checks root access and the sysstat and perf tools. Tracing commands can add load to a live server. If your system is not Linux, stop here."
  - Open Claude, ChatGPT or Gemini. Paste the skill text into the chat.
  - "Describe the problem: what is slow, which host or service, when it started (date and time), and any deploy or config change just before."
  - Some checks need root access, perf or sysstat. Tracing adds load, so on a live server start with short, read-only checks and ask your ops team first. Tools such as valgrind drd and bcc can slow a live server a lot. If the load rises while you check, stop and tell your ops team.
  - Run the commands the AI lists on your server and paste the output back. If your AI can run commands itself, make it show you each command first and wait for your yes before it runs it. Allow read-only checks only. Some checks need root access, so do not give it more access than you are happy with.
  - Check the causes it ruled out and the evidence for each one.
  - Approve any fix yourself before it is applied, then ask it to re-measure.
  - "Ask for the report you need: a triage note, root cause report or postmortem."
  - Share the report with your ops or incident lead for the postmortem review, and turn each prevention action into a ticket with an owner.
output_sample:
  input:
    - A short description of the slow or failing system
    - Output from commands run on the machine, or access for your AI to run them
    - What changed recently, such as a deploy or config change (optional)
  prerequisites:
    - An AI that can run commands on the machine, or you paste the command output yourself
    - Some checks need root access, perf access or the sysstat tools
  output:
    - name: Problem statement
      contains: What is wrong, since when, who is affected, and what changed recently.
    - name: 60-second triage
      contains: Results of ten quick Linux checks, with errors and saturation read first and cleared resources listed.
    - name: USE sweep
      contains: Use, saturation and errors for each resource such as CPU, memory, disk and network, plus limits like cgroups.
    - name: TSA sweep
      contains: "Where each thread spends its time: running, waiting to run, paging, sleeping, locked or idle."
    - name: Root cause
      contains: A chain from trigger to symptom, with each link backed by a command and its output.
    - name: Fix and verify
      contains: The cheapest effective fix and a before and after measure using the same tools.
    - name: Report
      contains: A triage note, root cause report or postmortem with impact, evidence table, resolution and prevention actions.
