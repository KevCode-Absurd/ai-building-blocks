thinking: low
thinking_why: It is a short set of rules your AI follows while it works.
new_slug: small-change-keeper
name: Small change keeper
summary: Keep your AI coder to a small code change. It fixes only what you asked and lists the extra edits it held back for your approval.
job: build-software
headline: Small change keeper
subhead: An AI coder that fixes what you asked and nothing more. It stops the habit of adding extra layers, renaming files or tidying code nobody mentioned, so your review stays small.
explain: |
  An AI coder that fixes what you asked and nothing more. It stops the habit of adding extra layers, renaming files or tidying code nobody mentioned, so your review stays small.

  Three rules drive it. First, touch only the code you pointed to, and list any other changes it wants to make and wait for your answer. Second, use the simplest fix: one line if one line works, reuse what exists, add no new file or package unless needed. Third, when unsure, ask instead of assuming. The result is a smaller change that is easier to read, test and undo. Turn it on at the start of a coding session and leave it running.
when:
  - Your AI keeps rewriting files you did not mention.
  - You want a bug fix that is three lines, not thirty.
  - Pull requests from your AI are too big to review.
  - You want your AI to ask before it widens the scope.
not_for:
  - "You want a full refactor, tests or docs: ask your AI for them by name and it will do them in full."
  - "You are building a new project from scratch: a small-change rule will slow you down, so turn it off."
  - "You want an AI to find other problems in your code: ask for a review as a separate request."
you_give:
  - The change or bug you want fixed
  - The files it may touch
  - A request to turn it on for the session
you_get:
  - A minimal change limited to your request
  - A list of extra edits it held back, for your approval
  - Questions when the request is unclear
  - Smaller changes that are easier to review
how_to_use:
  - Before you start, check that your coding tool can read your project folder. This skill uses no paid service, no API key and no scraping.
  - Open your AI coding tool, or a chat if you can paste in the code.
  - Add the skill folder if your coding tool loads SKILL.md skills (Claude Code and similar tools do), or paste the skill text into the chat.
  - "Say: use this skill for the whole session."
  - Describe the bug or change, and name the files it may touch.
  - "The reply has four parts, in this order: the minimal change, the held-back edits, questions, then a checklist result. Approve or skip each held-back edit. If the list is empty, there is nothing to approve."
  - After you approve edits, run your tests and read the diff yourself. Ask for tests or a separate review by name if you want them. Then merge the change, or ask for a separate review first with the code change reviewer.
  - "If the change is still too big, say: too much, revert. The skill then offers a fix of 10 lines or fewer."
output_sample:
  input:
    - The bug or change you want, in plain words
    - The files your AI may touch
    - A request to turn the skill on for the session
  prerequisites:
    - An AI that can read your project files, such as a coding assistant
  output:
    - name: Minimal change
      contains: The smallest edit that does what you asked, using code that already exists and no new files or packages.
    - name: Held-back edits
      contains: A list of other changes your AI wanted to make and why, for you to approve or skip.
    - name: Questions
      contains: Short questions when the request is unclear, a new package seems needed or other files must change.
    - name: Moyu checklist result
      contains: A final check that the change stays in scope, adds nothing extra and is small enough to review fast.
terms:
  - term: Moyu
    meaning: "The skill's own name for its three rules: change only what was asked, pick the simplest fix, and ask when unsure."
  - term: Held-back edit
    meaning: A change your AI wanted to make but did not, because you did not ask for it.
