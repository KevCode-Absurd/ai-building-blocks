thinking: low
thinking_why: It is a short set of rules your AI follows while it works.
new_slug: small-change-keeper
name: Small change keeper
summary: Turn it on while you code. Your AI changes only what you asked for and
  picks the simplest fix.
job: build-software
headline: Small change keeper
subhead: An AI coder that fixes what you asked and nothing more. It stops the
  habit of adding extra layers, renaming files or tidying code nobody mentioned,
  so your review stays small.
explain: |
  An AI coder that fixes what you asked and nothing more. It stops the habit of adding extra layers, renaming files or tidying code nobody mentioned, so your review stays small.

  Three rules drive it. First, touch only the code you pointed to, and list any other changes it wants to make and wait for your answer. Second, use the simplest fix: one line if one line works, reuse what exists, add no new file or package unless needed. Third, when unsure, ask instead of assuming. The result is a smaller change that is easier to read, test and undo. Turn it on at the start of a coding session and leave it running.
when:
  - Your AI keeps rewriting files you did not mention.
  - You want a bug fix that is three lines, not thirty.
  - Pull requests from your AI are too big to review.
  - You want the AI to ask before it widens the scope.
you_give:
  - The change or bug you want fixed
  - The files it may touch
  - A request to turn it on for the session
you_get:
  - A minimal change limited to your request
  - A list of extra edits it held back, for your approval
  - Questions when the request is unclear
  - Smaller changes that are easier to review
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your project files.
