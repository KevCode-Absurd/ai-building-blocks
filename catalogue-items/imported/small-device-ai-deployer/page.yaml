thinking: high
thinking_why: Hardware limits and model rebuilds call for careful planning.
new_slug: small-device-ai-deployer
name: Small-device AI deployer
summary: Turn a trained AI model into C or C++ code for a small chip. Give it your model and target hardware to deploy AI to a microcontroller.
job: build-software
headline: Small-device AI deployer
subhead: A trained AI model turned into lean code that runs on a small chip, such as a microcontroller. You give the model and name the target hardware, and the skill carries it through to code you can load.
explain: |
  A trained AI model turned into lean code that runs on a small chip, such as a microcontroller. You give the model and name the target hardware, and the skill carries it through to code you can load.

  It takes models built in MATLAB, or imported from PyTorch, ONNX, TensorFlow and LiteRT, and checks they work. It can shrink them with quantization, test them inside a Simulink system model, and generate C, C++ or CUDA code for Cortex-M, A or R chips, x86 and GPUs. This needs a paid MathWorks setup: a recent MATLAB with the deep learning, coder and embedded toolboxes, plus the MATLAB agent connection for your AI.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - You have a trained network and must run it on a microcontroller.
  - Your model is too large for the memory on your device.
  - You want to test a model inside a larger system simulation first.
  - You need C code generated from a PyTorch model.
not_for:
  - You want to use the code outside MATLAB or other MathWorks products. The licence (BSD 2-Clause plus MathWorks terms) does not allow it.
  - You have no MATLAB license. Use a free route such as your chip maker's own tools, or ask an embedded engineer.
  - Your model runs fine on a laptop or server. You do not need this, so keep using the model as it is.
  - You only need to import a model into MATLAB with no chip target. Ask your AI for a plain import step instead.
you_give:
  - The trained model
  - The target chip and its memory limits
  - MATLAB with the needed toolboxes
  - Accuracy you can accept after shrinking (optional)
you_get:
  - The model checked and imported
  - A compressed version sized for the chip
  - Generated C, C++ or CUDA code
  - A system simulation of the model (optional)
how_to_use:
  - Open an AI that can run MATLAB, and set up its MATLAB connection first. This needs a paid MathWorks setup and MATLAB R2026a or newer. Your AI starts by checking your MATLAB release and installed toolboxes, then asks about your project. It writes each MATLAB step as a script file you can read.
  - Paste in the skill text, then add your trained model file. The step that imports a PyTorch, ONNX or TensorFlow model into MATLAB is a separate item, the outside AI model importer. Run it first if your model did not come from MATLAB.
  - Tell it your target chip and its memory limits. Add the accuracy drop you can accept (optional).
  - Let it pick a path and ask you before it changes or shrinks anything.
  - Check the accuracy and memory results before you load the generated code on your device.
  - Next, send the report and the generated files to the embedded engineer who will test them on the board. Rerun the accuracy and memory checks on the real board before any release.
output_sample:
  input:
    - Your trained model, from MATLAB, PyTorch, ONNX, TensorFlow or LiteRT
    - Your target chip, such as Cortex-M, Cortex-A, Cortex-R, x86 or a GPU
    - The memory limits of that chip
    - How much accuracy you can lose after shrinking (optional)
  prerequisites:
    - An AI that can drive a live MATLAB session
    - MATLAB R2026a or newer with the deep learning, coder, Embedded Coder and Simulink tools
    - A paid MathWorks license
  output:
    - name: Model check
      contains: Confirms the model was imported or rebuilt and still gives the results you expect.
    - name: Compressed model
      contains: A smaller version of the model, made by quantization, pruning or projection, sized for your chip.
    - name: Simulink system test
      contains: The model placed inside a larger system simulation, so you can test it before building code.
    - name: Report
      contains: A short report with the model check, the accuracy change against your baseline, the memory use on the chip and the list of generated files.
    - name: Generated code
      contains: C, C++ or CUDA code for your chosen chip, ready to load.
