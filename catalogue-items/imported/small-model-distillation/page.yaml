thinking_why: Matching a teacher model needs careful tuning.
new_slug: small-model-distillation
name: Small model trainer from a big one
summary: Name your large model. Get a plan and code to teach a smaller, cheaper
  model to match it.
job: build-software
headline: Small model trainer from a big one
subhead: A plan and working code to teach a small, cheap model to copy a big
  one. You name the large teacher model and the small student, and you get a
  path to keep most of the quality at a fraction of the running cost.
explain: |
  A plan and working code to teach a small, cheap model to copy a big one. You name the large teacher model and the small student, and you get a path to keep most of the quality at a fraction of the running cost.

  The skill covers the main methods. Soft targets with temperature scaling let the student learn from the teacher's full probability spread, not only its top answer. Logit distillation matches raw outputs. Response distillation trains on text the teacher wrote. A reverse KL method suits language models. It uses Python with transformers and torch, and training needs real GPU time. Expect to keep around 90 percent of performance when it goes well.
when:
  - Your large model works but costs too much to run.
  - You want an open model that handles one task as well as a paid one.
  - You need a model small enough for limited hardware.
  - You have teacher answers and want to train a student on them.
you_give:
  - The teacher model
  - The student model you want to train
  - Training data or prompts for the task
  - GPU access and a Python setup
you_get:
  - A distillation plan for your models
  - Training code with the right loss
  - Settings like temperature and loss weights
  - A way to compare student and teacher
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run Python code on a computer with a GPU.
