thinking: medium
thinking_why: It compares figures across posts and explains what worked.
new_slug: social-content-results-reader
name: Social content results reader
summary: Read social media engagement for public accounts. Get figures per post, a saved file and a short note on which posts did best.
job: grow-social
headline: Social content results reader
subhead: Engagement numbers for your social accounts and a clear read on which posts did best. You name the accounts, and the skill collects public data from Instagram, Facebook, YouTube and TikTok, then explains what worked.
explain: |
  Engagement numbers for your social accounts and a clear read on which posts did best. You name the accounts, and the skill collects public data from Instagram, Facebook, YouTube and TikTok, then explains what worked.

  It picks the right collector for the need, such as posts, reels or follower counts, and checks what inputs that collector expects. You choose the file format and name. It then runs the script, saves the results and writes a short summary of top performers and patterns. It works through Apify, a paid data service, so you need an Apify token, Node.js and a command line tool. Public data only, so private account figures will not appear.
when:
  - You want to compare your last 50 posts by engagement.
  - A client asks which reels worked best.
  - You need to track a competitor's follower growth.
  - You want a hashtag's performance in a spreadsheet.
not_for:
  - "You have not checked each platform's terms of service: scraping may break them, so read the terms before you run it."
  - "You want numbers for your own private account: use the insights tab inside Instagram, Facebook, YouTube or TikTok."
  - "You only have a few posts to compare: copy the figures by hand into a spreadsheet."
  - "You can't run code or pay for Apify: ask a person to pull the numbers for you."
you_give:
  - The accounts, posts or hashtags to analyse
  - An Apify token
  - Preferred file format and name
  - The time range (optional)
you_get:
  - Engagement figures per post
  - A saved data file
  - A ranked list of top posts
  - A short summary of what worked
how_to_use:
  - "Check setup first: you need Node.js 20.6 or newer, the mcpc tool, a .env file with your Apify token, and the run_actor.js script in the skill folder."
  - Before any run, confirm two things. You have read each platform's terms, because scraping may break them. And you have checked your Apify plan and usage limit, because each run is billed. Stop if you have not.
  - Open an AI that can run code and add this skill.
  - Say which public accounts, posts or hashtags to check.
  - Pick quick answer, CSV or JSON, and how many results you want.
  - Let your AI run the collector and read the summary it writes.
  - Check the top posts against your own numbers before you act on them.
output_sample:
  input:
    - The public accounts, posts or hashtags you want to check
    - Your Apify token (a key from your paid Apify account)
    - "The file type you want: quick answer in chat, CSV or JSON"
    - How many results you want (optional)
  prerequisites:
    - An AI that can run code on your computer
    - Node.js 20.6 or newer
    - The mcpc command line tool
    - A .env file that holds your Apify token
  output:
    - name: Quick answer
      contains: A short list of the top results shown in chat, with no file saved.
    - name: CSV file
      contains: A full export with every field the collector returns, named with the date.
    - name: JSON file
      contains: The same full export in JSON form, named with the date.
    - name: Summary of findings
      contains: How many pieces were checked, where the file is, what performed best, and what to try next.
