thinking: low
thinking_why: It runs set calculations on your numbers.
new_slug: social-media-results-analyst
name: Social media results analyst
summary: Check social media results from your post stats. Get engagement rates, platform benchmarks and top posts. Add revenue and spend to see financial ROI.
job: grow-social
headline: Social media results analyst
subhead: Compare post results and activity costs. Financial ROI appears only with attributed revenue, matching spend, and the method and window used.
explain: |
  Compare post engagement and activity costs with platform benchmarks. Financial ROI appears only when you supply measured attributed revenue, matching spend, the attribution method, and the attribution window. Likes, comments, shares, saves, and clicks are not assigned made-up dollar values.

  It first checks the data, for example that reach is above zero and dates make sense. Then it works out engagement per post and campaign totals. It calculates financial ROI only when attributed revenue, matching spend, the attribution method, and the attribution window are supplied. It compares results with benchmarks for Instagram, Facebook, TikTok and LinkedIn, picks the top and bottom posts, and checks that the numbers are possible, such as engagement under 100 percent. Python helper scripts do the calculations, so the results are the same each time.
when:
  - You have a spreadsheet of post stats and no idea what it means.
  - You need to show a client the return on a campaign.
  - You want to know if your engagement is good for your platform.
  - You are choosing what to post more of.
not_for:
  - "You want to prove paid ad sales or forecast revenue without a measured revenue source: get that from your ad platform or sales records first."
  - "You need results across many channels, not just social: use a cross-channel analytics tool or a simple spreadsheet."
  - "You want new posts written, not results checked: ask your AI to draft them in a normal chat."
you_give:
  - "Post data: reach, likes, comments, shares and dates"
  - Attributed revenue, matching spend, the attribution method, and window (optional; all are required for financial ROI)
  - The platforms involved
  - Your goal for the campaign (optional)
you_get:
  - Engagement rate for each post
  - Campaign totals and activity costs; financial ROI only when its required revenue and attribution inputs are supplied
  - Comparison with platform benchmarks
  - Top and bottom posts and what to do next
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick one that can run code and read files.
  - Paste the skill text, or upload the skill folder.
  - Add your post stats as a spreadsheet or pasted table. Say which platform they came from.
  - Add spend, revenue, method and window only if you have them. All four are needed for financial ROI.
  - Check the totals look right, then use the top and bottom posts to plan what to post next. The benchmark figures are rough averages, so compare them with your own past posts. To write the next posts, use social-post-writer or social-post-planner.
output_sample:
  input:
    - "Your post stats: reach, likes, comments, shares and dates"
    - The platform for the posts, such as Instagram or LinkedIn
    - Spend for the same period (optional)
    - Attributed revenue, how it was attributed, and the time window (optional, all needed for financial ROI)
  prerequisites:
    - An AI that can run Python code and read your files, so the numbers are worked out the same way each time
  output:
    - name: Campaign metrics
      contains: Total engagements, average engagement rate and click rate across all your posts.
    - name: Post-by-post breakdown
      contains: Engagement rate and other rates for each post, so you can compare them side by side.
    - name: Cost metrics
      contains: Cost per engagement and cost per click when you give spend and clicks.
    - name: Financial ROI
      contains: Return on spend only when revenue, spend, method and window are given. Otherwise it says what is missing.
    - name: Benchmark comparison
      contains: "How your engagement rate rates against the average for your platform: poor, average, good or excellent."
    - name: Top and bottom posts
      contains: The best and weakest posts ranked by engagement.
    - name: Recommendations
      contains: Next steps based on what worked, without guessing business return from likes or clicks.
