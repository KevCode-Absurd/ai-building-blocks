new_slug: social-media-results-analyst
name: Social media results analyst
summary: Get engagement rates, benchmarks, and financial ROI when you supply attributed revenue, matching spend, method, and window.
job: grow-social
headline: Social media results analyst
subhead: Compare post results and activity costs. Financial ROI appears only with attributed revenue, matching spend, and the method and window used.
explain: |
  Compare post engagement and activity costs with platform benchmarks. Financial ROI appears only when you supply measured attributed revenue, matching spend, the attribution method, and the attribution window. Likes, comments, shares, saves, and clicks are not assigned made-up dollar values.

  It first checks the data, for example that reach is above zero and dates make sense. Then it works out engagement per post and campaign totals. It calculates financial ROI only when attributed revenue, matching spend, the attribution method, and the attribution window are supplied. It compares results with benchmarks for Instagram, Facebook, TikTok and LinkedIn, picks the top and bottom posts, and checks that the numbers are possible, such as engagement under 100 percent. Python helper scripts do the calculations, so the results are the same each time.
when:
  - You have a spreadsheet of post stats and no idea what it means.
  - You need to show a client the return on a campaign.
  - You want to know if your engagement is good for your platform.
  - You are choosing what to post more of.
you_give:
  - "Post data: reach, likes, comments, shares and dates"
  - Attributed revenue, matching spend, the attribution method, and window (optional; all are required for financial ROI)
  - The platforms involved
  - Your goal for the campaign (optional)
you_get:
  - Engagement rate for each post
  - Campaign totals and activity costs; financial ROI only when its required revenue and attribution inputs are supplied
  - Comparison with platform benchmarks
  - Top and bottom posts and what to do next
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read your files.
