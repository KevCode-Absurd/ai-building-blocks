thinking_why: The outfit must stay the same while the scene changes.
new_slug: social-post-photo-maker
name: Social post photo maker
summary: Give it an outfit photo. Get lifestyle shots with new models, scenes
  and poses for social posts. Your image model draws them.
job: product-photos
headline: Social post photo maker
subhead: Lifestyle photos for social posts made from one outfit picture. The
  outfit stays the same, but the model, scene and pose change, so a clean
  product shot becomes a casual, real-looking post image.
explain: |
  Lifestyle photos for social posts made from one outfit picture. The outfit stays the same, but the model, scene and pose change, so a clean product shot becomes a casual, real-looking post image.

  You give the outfit photo and, if you like, a reference picture for the scene and pose. The skill writes a detailed picture prompt that locks the clothes and bags and describes the new person, place, light and angle. Then it sends the prompt to an image model, which draws the result. Claude does not draw the picture itself, so you need an image tool. The style leans to content that feels candid, with warm light and street or cafe scenes, not studio product shots.
when:
  - You have a product photo and need fresh images for social posts.
  - You want the same outfit shown on a different model.
  - You need a cafe or street scene without a real shoot.
  - Your catalogue photos look too stiff for social media.
you_give:
  - The outfit photo
  - A scene or pose reference image (optional)
  - The mood or setting you want
  - Access to an image generating tool
you_get:
  - A detailed image prompt that keeps the outfit unchanged
  - Lifestyle images with a new model and scene
  - Variations in pose and angle
  - Tips to finish the images in your image tool
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and use your own image model key
    (OpenAI, Gemini, fal or Replicate).
