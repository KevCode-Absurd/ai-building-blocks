thinking: medium
thinking_why: The outfit must stay the same while the scene changes.
new_slug: social-post-photo-maker
name: Social post photo maker
summary: Turn one outfit photo into social post photos with a new model, scene and pose. The clothes stay the same. Your image tool draws them.
job: product-photos
headline: Social post photo maker
subhead: Lifestyle photos for social posts made from one outfit picture. The outfit stays the same, but the model, scene and pose change, so a clean product shot becomes a casual, real-looking post image.
explain: |
  Lifestyle photos for social posts made from one outfit picture. The outfit stays the same, but the model, scene and pose change, so a clean product shot becomes a casual, real-looking post image.

  You give the outfit photo and, if you like, a reference picture for the scene and pose. The skill writes a detailed picture prompt that locks the clothes and bags and describes the new person, place, light and angle. Then it sends the prompt to an image model, which draws the result. Claude does not draw the picture itself, so you need an image tool. The style leans to content that feels candid, with warm light and street or cafe scenes, not studio product shots.
when:
  - You have a product photo, a dLazy account (paid, per image) and need fresh images for social posts.
  - You want the same outfit shown on a different model.
  - You need a cafe or street scene without a real shoot.
  - Your catalogue photos look too stiff for social media.
not_for:
  - "You want photos of real customers or influencers: ask them for their own photos and permission instead."
  - "You want to suggest a person endorsed or used your product: don't use this. Use honest photos or real reviews."
  - "You want to copy a real person's face without consent: skip this and hire a model or get written permission."
you_give:
  - Your outfit photo, full or nearly full body, with one person and every item clear
  - A scene or pose reference photo (optional)
  - The mood or setting you want, such as a cafe or a street at golden hour
  - A dLazy account and API key. It is a paid service, charged per image. Run a dry run first to see the cost
you_get:
  - A detailed image prompt that keeps the outfit unchanged
  - Lifestyle images with a new model and scene
  - Variations in pose and angle
  - Tips to finish the images in your image tool
how_to_use:
  - "Before you start: you need a dLazy account and API key, and each image costs money. Add --dry-run to the command first to see the cost. Use only photos you own or have the right to edit."
  - Clean your photo first. Remove filters, text and stickers, or the new image will keep them. The watermark remover skill can help, but only on your own images. Never strip another person's watermark.
  - Open your AI and paste this skill. Add the outfit photo and, if you have one, a scene reference photo.
  - Tell it the mood or scene. It lists each item you wear, then writes the picture prompt.
  - Run the prompt in your image tool. The skill's commands use the dlazy tool and an API key, which may cost money per image, so check prices first.
  - The skill file is in Chinese, with an English summary at the top. The example images it points to (in a docs folder) are not included here, so use your own outfit and scene photos.
  - Make three or four images per scene. Pick the most natural pose.
  - Check each image for swapped items, odd hands and a busy background. Add a fix line to the prompt and run again if needed.
  - Required before you post: label the images as AI-generated where the platform asks, and check the platform's rules on AI images and on paid promotion. The person in the photo is invented. Do not present them as a real customer or as someone who endorses your product.
  - Next, save each set in a folder named for the scene, pick one image to post, and note which pose and prompt worked so you can reuse them.
output_sample:
  input:
    - Your outfit photo, full or nearly full body, one person, every item clear
    - A scene or pose reference photo (optional)
    - The mood or setting you want, if you have no reference photo
    - An image model key and the dlazy tool, or another image tool
  prerequisites:
    - An AI that can run code and the dlazy command line tool
    - An API key for the image service, which may cost money per image
    - Check the dlazy site for prices before you run a batch
  output:
    - name: Outfit list
      contains: "One line for each item: top, bottom, shoes, bag and accessories, reused in every prompt."
    - name: Picture prompt
      contains: A prompt that locks the outfit, then sets the new model, scene, pose, light and camera style.
    - name: Lifestyle images
      contains: Three or four tall images per scene (1024 by 1536, jpeg, saved as output-<scene>.jpg), so you can pick the most natural pose. Post the best one to your social account.
    - name: Scene versions
      contains: The same outfit in several scenes, such as street, cafe, home, travel and commute.
    - name: Quality check
      contains: A check for missing or swapped items, hands, a candid feel and a background that steals focus.
    - name: Fix lines
      contains: Short lines to add to the prompt when an item changes, the pose is stiff or hands look wrong.
