thinking: medium
thinking_why: It plans a calendar, then writes posts.
new_slug: social-post-planner
name: Social post planner
summary: Plan a month of social media posts. Name your platforms and get a content calendar plus drafts for LinkedIn, X, Instagram, TikTok and Facebook.
job: grow-social
headline: Social post planner
subhead: A content calendar and ready-to-post drafts for LinkedIn, X, Instagram, TikTok and Facebook. You name your platforms, and the skill plans what to post and writes it.
explain: |
  A content calendar and ready-to-post drafts for LinkedIn, X, Instagram, TikTok and Facebook. You name your platforms, and the skill plans what to post and writes it.

  It starts from your story, since posts that share real experience tend to do better than posts built only around platform tricks. It then adapts format and tone to each site: longer, work-focused posts for LinkedIn, short sharp lines for X, visual hooks for Instagram and TikTok. It lays posts out on a calendar with a mix of topics. It also covers scheduling advice and a way to triage replies and comments, with a short social listening pass to find topics people care about.
when:
  - You post when you remember and want a steady plan.
  - You need a month of ideas across several platforms.
  - You have one idea and want it rewritten for each site.
  - Comments are piling up and you need a way to sort them.
not_for:
  - "You want paid ad copy: write it with an ad tool or a short brief for your ad platform, since this plans free posts only."
  - "You need a full content plan for blogs, email and search: build that strategy first, then bring one idea here to turn into posts."
  - "You want press coverage or news mentions: pitch reporters yourself or hire a PR person, since this does not write pitches."
you_give:
  - Your platforms
  - Your audience and goal
  - Your story, offers and topics
  - Posting frequency (optional)
you_get:
  - A content calendar
  - Drafted posts for each platform
  - A topic mix
  - A reply and comment triage routine
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Tell your AI which platforms you use, who you want to reach and what you want people to do.
  - Share your story, your offers and a few topics. Say how often you can post (optional).
  - Ask for a content calendar first. Check that the mix of topics fits you.
  - Ask for drafts for each platform. Edit them so they sound like you before you post.
  - "For listening, the Reddit, Hacker News and Bluesky recipes fetch live pages. That may break each site's rules, so use the official API or skip it. Some tools also need a paid plan or a key, so check before you start."
  - "You end with a 4-week calendar (posts per platform per week), then a draft for each post."
  - "The skill text is long. If your AI cuts it off, paste the sections on pillars, hooks and the content calendar first, then the rest."
  - "Next: plan the bigger picture with Content strategy planner. Before you schedule, read each draft once and cut any line that sounds like a stock AI phrase."
output_sample:
  input:
    - Your platforms, such as LinkedIn, X, Instagram, TikTok or Facebook
    - Your audience and your goal
    - Your story, offers and topics to cover
    - How often you can post (optional)
    - Any topics or words to avoid (optional)
  prerequisites:
    - Any chat AI. No code needed.
    - Social listening may need web access. Check each site's rules before you use it.
  output:
    - name: Content pillars
      contains: The few themes your posts will return to, drawn from your story and your audience.
    - name: Content calendar
      contains: A weekly plan that lays out what to post, on which day, on each platform.
    - name: Drafted posts
      contains: Ready-to-post text for each platform, with hooks that fit its length and tone.
    - name: Repurposed versions
      contains: One idea rewritten for each platform, such as a blog post turned into short posts.
    - name: Short-form video scripts
      contains: Hooks and scene-by-scene outlines for TikTok, Reels and Shorts.
    - name: Scheduling advice
      contains: When to schedule ahead, when to post live, and how to keep a queue.
    - name: Engagement routine
      contains: A short daily routine for replying to comments and sorting what needs an answer.
