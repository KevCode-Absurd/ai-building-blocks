thinking: medium
thinking_why: It reads long transcripts and pulls out the key parts.
new_slug: social-video-transcript-analyst
name: Social video transcript analyst
summary: Pull hooks, claims and quotes from social video transcripts. Give it video links and get a report of what was said and ideas to reuse.
job: research-topics
headline: Social video transcript analyst
subhead: The words spoken in social videos, pulled apart into hooks, claims, quotes and themes you can reuse. You give video links, and the skill collects the transcripts and studies what was said.
explain: |
  The words spoken in social videos, pulled apart into hooks, claims, quotes and themes you can reuse. You give video links, and the skill collects the transcripts and studies what was said.

  It works with TikTok, Instagram, YouTube, Facebook, X, LinkedIn, Rumble and Reddit video posts. Beyond summaries, it extracts the opening line of each video, the stories and examples, the objections and the calls to action. It can compare what several creators say on one topic, or turn a transcript into posts, scripts or newsletter ideas. It uses the ScrapeCreators data service, so you need an API key and the service has costs.
when:
  - You want to learn how a top creator opens their videos.
  - You need a summary of a long video without watching it.
  - You want to compare what ten creators say about one topic.
  - You want to repurpose a podcast clip into posts.
not_for:
  - "You have no ScrapeCreators API key: paste the transcript yourself into your AI, or ask a person to type it up."
  - "The video is private or needs a login: this skill only reads public posts, so copy the words by hand."
  - "The video has no spoken words or no transcript: it can only fall back on the title and caption, so watch it yourself."
you_give:
  - Links to the videos
  - "What you want from them: summary, hooks or quotes"
  - A ScrapeCreators API key
  - Other creators to compare (optional)
you_get:
  - Clean transcripts
  - A list of hooks, claims and quotes
  - Common themes across videos
  - Content ideas based on what was said
how_to_use:
  - Get a ScrapeCreators API key from scrapecreators.com. Check their site for current plans and costs before you start.
  - Open an AI that can run code and use the web, and add your key when it asks.
  - Paste the skill, then paste your video links. Say if you want a summary, hooks, quotes or ideas.
  - Check the report. Quotes are word for word, but mark any garbled lines as approximate.
  - If you reuse a creator's words, credit them and link to the video.
output_sample:
  input:
    - Links to public social videos
    - What you want from them, such as a summary, hooks or quotes
    - Other creators to compare (optional)
  prerequisites:
    - A ScrapeCreators API key, which is a paid data service
    - An AI that can run code and reach the web
  output:
    - name: TL;DR
      contains: The main themes, the strongest hooks and the best ideas to reuse.
    - name: Transcript-by-Transcript Notes
      contains: "For each video: the hook, core idea, best quote, call to action and stand-alone ideas, with its link."
    - name: Patterns Across the Set
      contains: A table of repeated themes and hook styles, with proof and example links.
    - name: Hooks Swipe File
      contains: A list of the opening lines, word for word.
    - name: Repurposing Ideas
      contains: Starter ideas for a LinkedIn post, X thread, short video script and newsletter section.
