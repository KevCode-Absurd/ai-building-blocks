thinking: medium
thinking_why: It asks the next question from your answer.
new_slug: socratic-explainer
name: Socratic explainer
summary: Learn a hard idea through questions, not a lecture. Name a topic and get a Socratic explainer that helps you work it out and remember it.
job: think-and-decide
headline: Socratic explainer
subhead: A topic you understand because you worked it out, not because someone lectured you. Name what you want to understand, and the skill teaches it in the style of Socrates, through a short back and forth of questions and small thought experiments.
explain: |
  It starts with curiosity, often by questioning an assumption or admitting it does not know. Then it builds the idea one small step at a time, using one simple analogy all the way through and asking a reflective question now and then. It avoids textbook definitions, long lists of facts and heavy jargon. It reads like a conversation, not documentation. It fits ideas that need real understanding. For a quick fact, install step or command, ask for a direct answer instead.

  Licence: this is a copy from sickn33's collection, shared under CC BY 4.0 (the LICENSE-CONTENT file). The "source: original" line in the skill file means the contributor wrote it for that collection. Keep the credit to sickn33 if you share it.
when:
  - A concept makes sense when read but you cannot explain it back.
  - You want to understand why something works, not just what it is.
  - Textbook explanations leave you lost.
  - You want to explore an abstract or philosophical idea.
not_for:
  - "You need a quick fact, a definition or a short lookup: ask your AI for a direct answer."
  - "You need install steps, setup commands or troubleshooting: ask your AI for the steps, or read the tool's own guide."
  - "You want a summary or a long list of facts: ask your AI for a plain summary instead."
you_give:
  - The topic you want to understand
  - What you already think about it (optional)
  - Your level or background (optional)
you_get:
  - A guided conversation that builds the idea
  - One simple analogy and small thought experiments
  - Questions that make you think
  - A clearer sense of how the idea fits together
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill text into the chat.
  - Say the topic in one sentence. Add what you already think about it and your level (optional).
  - Answer each question in your own words. Short guesses are fine.
  - If you feel lost, say so. The skill goes back to its analogy and simplifies.
  - When the idea is clear, try explaining it back, or test it on a real case from your own work.
  - The talk ends when you say you have got it, or when you say stop. Your AI may close with one question about the picture you now have.
output_sample:
  input:
    - The topic you want to understand, in one sentence
    - What you already think about it (optional)
    - Your level or background (optional)
  output:
    - name: Curiosity opening
      contains: A question or an admission of not knowing that starts the talk and makes you reflect on the topic.
    - name: Guided reasoning
      contains: Small observations, thought experiments and questions that build the idea one step at a time.
    - name: Single analogy
      contains: One simple comparison, kept the same all the way through, that makes the idea easy to picture.
    - name: Clarification
      contains: Short links between the steps, with gentle fixes to any wrong ideas you voiced.
    - name: Reflection
      contains: A closing question that asks what picture you have now and invites more questions.
