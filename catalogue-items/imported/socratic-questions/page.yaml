thinking: medium
thinking_why: Each question must build on the last.
new_slug: socratic-questions
name: Socratic question sequence writer
summary: Write a Socratic questioning sequence for your lesson. Give it an idea and your learners' level. You get questions that lead them to the answer.
job: teach-and-train
headline: Socratic question sequence writer
subhead: A set of questions that lets learners reach the answer themselves. You give the idea to explore, the learners' level and what they believe now, and get a planned sequence that moves them step by step.
explain: |
  A set of questions that lets learners reach the answer themselves. You give the idea to explore, the learners' level and what they believe now, and get a planned sequence that moves them step by step.

  The sequence starts at their current thinking, then moves through questions that clarify terms, probe assumptions, ask for evidence, test other views and reach a conclusion. If you know the idea you want them to reach, you can name it. The design draws on research on classroom questioning and critical thinking. It suits philosophy talks, science concepts and any lesson where telling the answer would end the thinking too early. Each question has a purpose, so you know why you ask it.
when:
  - You lead a discussion and run out of good follow-up questions.
  - You want students to find the concept themselves.
  - You teach a topic where common misconceptions get in the way.
  - You need questions pitched at the right age group.
not_for:
  - You need to teach a fixed fact or step-by-step method. Tell the answer directly with a clear explanation instead.
  - You have only a few minutes and no room for discussion. Ask one or two direct check questions instead.
  - You want to test what learners already know. Write a short quiz instead.
you_give:
  - The concept to develop
  - Learner age or level
  - What learners believe now
  - The understanding you want them to reach (optional)
you_get:
  - An ordered list of questions
  - The purpose of each question
  - Likely answers and how to follow up
  - A path to the target idea
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - Type the idea you want learners to explore.
  - Add the learners' age or level, and what they believe about the idea now.
  - Add the understanding you want them to reach, and your time limit, if you have them (optional).
  - Read the sequence you get back. Check that each question builds on the one before and fits your learners.
  - Use the opening question first. Keep the follow-up questions ready for the answers you hear.
output_sample:
  input:
    - The idea you want learners to explore
    - Learners' age or year group, and how well they know the idea
    - What learners believe about it now
    - The understanding you want them to reach (optional)
    - Minutes available for the questions (optional)
  output:
    - name: Opening Question
      contains: A first question that starts from what learners already think and invites an honest answer.
    - name: Question Sequence
      contains: Ordered questions with a type label for each, the reason for asking it, and likely learner answers.
    - name: Follow-up branches
      contains: Extra questions to use depending on how learners answer.
    - name: Facilitation Notes
      contains: Advice on running the talk, including how to handle quiet learners and heated moments.
    - name: Socratic vs. Leading
      contains: A check on which questions truly open thinking and which steer learners to your answer.
