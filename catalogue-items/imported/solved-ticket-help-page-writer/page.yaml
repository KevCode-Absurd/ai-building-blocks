thinking: low
thinking_why: It turns a known answer into a standard layout.
new_slug: solved-ticket-help-page-writer
name: Solved-ticket help page writer
summary: Give it a solved ticket. Get a help article with steps, what you should
  see, and a fix for next time.
job: help-customers
headline: Solved-ticket help page writer
subhead: "A help article customers can follow on their own, written from a
  ticket you have already solved. Paste the issue and the fix. The skill sorts
  it into the right type: how-to, troubleshooting, FAQ, known issue or
  reference."
explain: |
  A help article customers can follow on their own, written from a ticket you have already solved. Paste the issue and the fix. The skill sorts it into the right type: how-to, troubleshooting, FAQ, known issue or reference. It then writes a title in the words customers actually search, a plain opening line, numbered steps, and the exact error messages people see.

  It also adds what the screen should look like at each step, a fix for when things go wrong, and related terms so search finds the page. If a similar article exists, it tells you to update that one instead.
when:
  - The same support question keeps coming in and you want one page to point to.
  - You fixed a tricky ticket and want the answer saved for next time.
  - A bug has a workaround and customers need to see it.
  - You want help pages that read the same way every time.
you_give:
  - The solved ticket or a description of the issue
  - The steps that fixed it
  - Who is affected, such as plan or setup (optional)
  - Existing help pages to check against (optional)
you_get:
  - A ready-to-publish help article
  - Numbered steps with what you should see
  - A fix for common follow-up problems
  - Search-friendly title and keywords
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
