thinking: medium
thinking_why: It checks each step against a fixed list, then writes fixes.
new_slug: sop-and-runbook-checker
name: SOP and runbook checker
summary: Check your SOPs and runbooks for missing owners, stale pages and gaps. Get a ranked cleanup list and draft SOPs to fill what's missing.
job: document-work
headline: SOP and runbook checker
subhead: A list of the weak spots in your company procedures, with new SOPs written to fill the gaps. Give it your SOPs or a wiki export.
explain: |
  A list of the weak spots in your company procedures, with new SOPs written to fill the gaps. Give it your SOPs or a wiki export. It checks each one against the 5W2H questions: who, what, when, where, why, how and how much.

  For runbooks it also looks for a named owner, an expected time, a clear sign that a step worked, a way to roll back, and who to call if it fails. It finds pages with no inbound links, stale pages with no review date, and terms used two different ways. Scoring runs through small Python tools, and you get a cleanup list in priority order.
when:
  - Your wiki has hundreds of pages and nobody knows which are current.
  - A runbook is about to go into use and you want it checked first.
  - Your SOPs name a team instead of a person as owner.
  - You need a hygiene report on your Notion or Confluence space.
not_for:
  - "You only need one runbook checked: run runbook_validator.py on that file alone, with no wiki export."
  - "You need one process written from scratch with no existing docs: ask a process owner to walk you through it, then write it down."
  - "Your docs are PDFs or HTML pages: turn them into markdown files first, or this will not read them."
  - "You want the wiki moved to a new tool: use the import tool for that tool, since this only checks and reports."
you_give:
  - Your SOPs, runbooks or wiki export, saved as markdown files
  - Owner and last-reviewed dates in each file header (optional)
  - The processes that matter most (optional)
you_get:
  - Completeness scores for each SOP
  - A list of missing owners and stale pages
  - Orphan page and glossary problems
  - A prioritised cleanup list
  - Draft SOPs for the gaps
how_to_use:
  - "Gather these first: one folder of markdown files, with an owner line in each file header. For one runbook, a file with a heading like Step 1 for each step (or a JSON list of steps). To get new SOPs written, a short JSON file with the SOP name, owner and trigger. The scripts run on your own computer with Python 3 and need no extra packages."
  - Export your wiki as markdown files. If you only have PDF or HTML, convert them to markdown first.
  - "Run it one of two ways. Either run the scripts yourself on your own computer with Python 3, or use an AI that can run Python code, such as Claude with code tools. In the second case, upload the skill folder and your markdown files together and say: Follow SKILL.md."
  - Name the processes that matter most, if you have them.
  - "Read the cleanup list first. It lists the top 20 pages, ranked by how stale they are and how many pages link to them. Each runbook step gets a traffic light, and the runbook gets a score out of 100: 80 or more is safe to use, 60 to 79 is use with caution, under 60 is not safe. Fix the top items."
  - The checks look at structure only. A passing score is not a safety or content sign-off, because a runbook can score 100 and still give the wrong instruction. Have the process owner check the content, and have a qualified person check any regulated process.
  - The report is a markdown file. It has a health section (orphan pages, stale pages, terms used two ways, missing owners) and a top-20 cleanup table. Each runbook check adds a per-step traffic-light table with a score out of 100.
  - Review the draft SOPs with the person who owns each process before you publish them.
output_sample:
  input:
    - Your SOPs, runbooks or wiki export as markdown files
    - Owner and last-reviewed dates in the file headers (optional)
    - The processes that matter most (optional)
  prerequisites:
    - An AI that can run Python code
    - Your pages saved as markdown files, not PDF or HTML
  output:
    - name: Completeness scores
      contains: A score for each SOP against the who, what, when, where, why, how and how much questions.
    - name: Runbook checks
      contains: Whether each runbook step has an owner, expected time, success sign, rollback path and escalation contact.
    - name: KB health report
      contains: Orphan pages with no links in, stale pages with no review date, and terms used two ways.
    - name: Cleanup list
      contains: The top fixes in priority order, so you know what to repair first.
    - name: Draft SOPs
      contains: New SOPs written to fill the gaps the checks found.
