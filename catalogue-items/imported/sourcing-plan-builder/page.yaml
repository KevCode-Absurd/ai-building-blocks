thinking: medium
thinking_why: It follows a standard multi-step sourcing method.
new_slug: sourcing-plan-builder
name: Sourcing plan builder
summary: "Name a spend category and get a sourcing plan: supplier long list, quote request, scoring rules and negotiation levers for your next re-bid."
job: plan-supply-chain
headline: Sourcing plan builder
subhead: A full sourcing plan for one spend category, with supplier list, quote request, scoring rules and negotiation tactics. Name the category, its yearly spend, how important it is and who supplies it today.
explain: |
  A full sourcing plan for one spend category, with supplier list, quote request, scoring rules and negotiation tactics. Name the category, its yearly spend, how important it is and who supplies it today.

  The skill follows seven steps: profile the category, study the supply market, set the strategy, find suppliers, pick one, negotiate, then roll out. It places the category on the Kraljic grid to decide how hard to push suppliers. It lists ways to save such as bundling volume, changing specs and adding competition, and it covers should-cost thinking.

  This is a copy of a skill from kishorkukreja/awesome-supply-chain, shared under the MIT licence (see the LICENSE file).
terms:
  - term: Kraljic grid
    meaning: A four-box chart that sorts what you buy by how much it costs you and how risky the supply is.
  - term: RFx
    meaning: A request to suppliers for a quote or a proposal.
  - term: should-cost
    meaning: What a product ought to cost if you add up the supplier's materials, labor and profit.
  - term: value levers
    meaning: Ways to lower what you pay, such as bundling volume or changing the spec.
when:
  - You are about to re-bid a big category such as packaging or software.
  - You want to know how much pull you have with your suppliers.
  - You need a supplier shortlist and a quote request in one go.
  - You are preparing for a price negotiation and want levers ready.
not_for:
  - "You are making a one-off or low-spend buy: ask two or three suppliers for a quote and compare them yourself."
  - "You have not looked at your spend yet: sort out your spend data first, then come back to build the plan."
  - "You only need to compare and score suppliers you already have: use a simple scoring sheet in Google Sheets instead."
you_give:
  - The spend category
  - Yearly spend and volume
  - Current suppliers and contract terms
  - Business goals such as cost, risk or quality (optional)
you_get:
  - A seven-step sourcing plan
  - A category position on the Kraljic grid
  - A supplier long list
  - Quote request and scoring rules
  - Negotiation tactics
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. You do not need code running or any files. The Python blocks in the skill are optional reference code.
  - "Gather first: spend per supplier for the category, units bought per year, and contract end dates. Then tell your AI the spend category, yearly spend and volume, current suppliers and contract terms."
  - Add your goals, such as cost, risk or quality (optional).
  - The 50-point cut-offs in the skill's Kraljic code are placeholders. Set them from your own supply risk and profit impact scores.
  - Read the Kraljic position first. It sets how hard to push, so check it fits what you know.
  - Replace any sample numbers or rates in the plan with your own figures before you share it. The percentages and prices in the skill's code are placeholders, not benchmarks.
  - Next, send the quote request to your suppliers. Then compare their offers with supplier-scorer.
output_sample:
  input:
    - The spend category, such as packaging or software
    - Yearly spend and volume for that category
    - Your current suppliers and contract terms
    - Your goals, such as cost, risk or quality (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini. No code running is needed to get the plan.
  output:
    - name: Category profile
      contains: What you buy, what you spend, who uses it and the specs that matter.
    - name: Supply market view
      contains: Who supplies this category, what is changing in the market and where the risks sit.
    - name: Kraljic position
      contains: Where the category sits on the Kraljic grid and how hard to push suppliers as a result.
    - name: Value levers
      contains: Ways to save, such as bundling volume, changing specs and adding competition, ranked for this category.
    - name: Supplier long list
      contains: Current and new suppliers worth asking, with the criteria used to qualify them.
    - name: Quote request and scoring rules
      contains: The questions to send suppliers and the weights used to score their replies.
    - name: Negotiation approach
      contains: Tactics and levers to have ready, plus a should-cost check on the quotes.
    - name: Rollout plan
      contains: Milestones, owners and risks for contract signing, onboarding and tracking results.
