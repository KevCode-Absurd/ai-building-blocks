thinking: high
thinking_why: It runs a long loop with many agents and checks.
new_slug: spec-to-acceptance-builder
name: Spec to acceptance builder
summary: Turn a big software request into an approved spec, a controlled build and proof it works. A spec driven development workflow for AI agents.
job: build-software
headline: Spec to acceptance builder
subhead: "Give it a big software request. It writes a product spec, a technical design and pass or fail criteria, and waits for your approval. Then it builds the work in controlled steps and checks each criterion with evidence."
explain: |
  A big software request turned into a locked spec, a controlled build and proof that it works. Before any code is written, the skill freezes three documents: the product requirements, the technical design and the acceptance criteria. It checks facts itself and only asks you about real decisions.

  Code starts only after you approve those documents. Helper agents then work with clear ownership of files. When they report back, the lead agent does not take their word for it. It checks diffs, test runs and evidence against each numbered criterion. Gaps are marked TBD, ASSUMPTION or BLOCKED.

  Licence: the text of this copy is shared under CC BY 4.0, as the LICENSE-CONTENT file says. The original code and notice from Linji-x stay under MIT, and we keep that notice. Credit goes to Linji-x and sickn33.
when:
  - You have a large feature and the requirements are still fuzzy.
  - You want to approve what gets built before any code is written.
  - Several AI agents will work on one project and need clear lanes.
  - You need proof that each acceptance criterion was met. A plain chat without file access gives you the spec documents only. The build and the checking need an agent that can read your files.
not_for:
  - "You need a small bug fix or a one-file change: ask your AI to make the edit directly, no spec needed."
  - "You only want someone to read and review code or explain it: ask your AI for a plain code review instead."
  - "Your spec is already complete and approved: skip the spec stage and give your build team the plan directly."
you_give:
  - Your software request in plain words
  - Access to the project folder (repo) where the work will happen
  - Your answers to a few questions on real decisions
  - Your approval of the finished spec
you_get:
  - A product requirements document with numbered requirements
  - A technical design
  - Numbered acceptance criteria with the evidence each needs
  - A build plan that gives each agent its own files
  - A build checked against code changes and test runs
  - A final report with a table of results per criterion
how_to_use:
  - "Have ready: a project folder that is a git repository, with tests that can run, and any AGENTS.md file your agent reads. The build stage needs this."
  - Open an AI agent that can read your project files and run code, such as Codex. The build stage needs this.
  - "Put the skill folder where your agent loads skills (for Codex, its skills folder), or upload the folder to your project. Then give your request in plain words. Example: Build a job dashboard with role-based access."
  - Answer the few questions it asks. It looks up facts in your code itself and asks only about real choices.
  - Read the PRD, tech design and acceptance criteria. Say yes only when they match what you want. No code is written before that. Expect more than one round of changes before you approve, so plan for several back-and-forth sessions.
  - Let it build, then read the acceptance table and the evidence for each criterion.
  - When all criteria pass, hand ACCEPTANCE.md and the acceptance matrix to a reviewer before you merge or ship.
  - Codex or a similar agent tool may need a paid plan or an API key. Check the cost before you start.
  - In a plain chat without file access, paste the skill and your project details. You will get the spec documents, but not a checked build.
  - If the result is CHANGES_REQUESTED or BLOCKED, add a new loop for the failed criteria and run it again. Keep the approved PRD, TECH_DESIGN and ACCEPTANCE files as your record of what was agreed.
output_sample:
  input:
    - Your software request in plain words
    - Access to the project folder (repo) where the work will happen
    - Your answers to a few questions on real decisions
    - Your yes or no on the finished spec
  prerequisites:
    - An AI agent that can read your project files and run code, such as Codex
    - "Optional: an AI setup that can run several helper agents at once"
  output:
    - name: PRD.md
      contains: "The product requirements: problem, users, goals, numbered requirements, scope, assumptions and a log of your decisions."
    - name: TECH_DESIGN.md
      contains: "How it will be built: modules, data, security, failures, release and rollback, and technical decisions."
    - name: ACCEPTANCE.md
      contains: Numbered pass or fail criteria, each linked to a requirement and the evidence needed to prove it.
    - name: AGENT_PLAN.md
      contains: The build tasks, which files each agent may touch, and the checks each task must pass.
    - name: LOOP.md
      contains: The current status, each build attempt, the evidence, the judgment and the next action.
    - name: Acceptance matrix
      contains: A table of each criterion with its result, evidence and any defect or caveat.
    - name: Final report
      contains: The result first, then finished and deferred scope, risks, assumptions and suggested next steps.
