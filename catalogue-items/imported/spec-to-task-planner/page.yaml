thinking: medium
thinking_why: It breaks a spec into ordered steps.
new_slug: spec-to-task-planner
name: Spec to task planner
summary: Turn a spec in Notion into a clear implementation plan and linked tasks, with gaps and assumptions listed before work starts.
job: organise-work
headline: Spec to task planner
subhead: An implementation plan and a set of linked tasks, built straight from a spec that lives in Notion. The skill finds your spec, reads it, and notes gaps and assumptions before anything is planned.
explain: |
  An implementation plan and a set of linked tasks, built straight from a spec that lives in Notion. The skill finds your spec, reads it, and notes gaps and assumptions before anything is planned.

  It then picks the plan depth. A small change gets a quick plan. A multi-phase feature or migration gets a fuller one with phases, risks and success criteria. It finds your task database, checks its fields, and creates the tasks. Spec, plan and tasks are linked to each other, and statuses are kept current as work moves. You need the Notion connection set up.
when:
  - Your spec is in Notion and you need a plan from it.
  - You want tasks created in your Notion task board without typing them.
  - A spec has unclear points you want listed before work starts.
  - You want spec, plan and tasks to stay linked as work progresses.
not_for:
  - "Your spec is not in Notion: write the plan by hand, or paste the spec into a chat and ask your AI for a step list."
  - "You only have a quick one-off note: a short to-do list is faster than a full plan."
  - "Your AI cannot connect to Notion: copy the spec text into a chat and ask for a plan, then add tasks yourself."
you_give:
  - The name or link of the Notion spec
  - Access to your Notion workspace
  - Your task database (optional)
you_get:
  - A list of gaps and assumptions in the spec
  - A plan page, quick or full
  - Tasks created in your database
  - Links between spec, plan and tasks
  - Status updates as work moves
how_to_use:
  - "Gather first: the link to your spec, the name of your task database, and any due dates or owners you want on the tasks."
  - You need an AI tool that can connect to Notion, and a Notion login. In your tool's settings, add a Notion connection and log in when asked. Check that your AI can reach Notion before you go on.
  - "Optional, for Codex only: the skill lists the Codex commands to add the Notion connection and log in. Restart Codex after you log in."
  - Give your AI the skill and the name or link of your spec. If several pages match, pick the right one when asked.
  - Read the gaps and assumptions it lists. Answer them or fix the spec before you accept the plan.
  - Check the plan page and the new tasks in Notion. Edit anything that looks wrong.
  - Share the plan page with your team so they can see the tasks.
  - As work moves, ask your AI to update statuses and post progress notes. The plan page and the task links are where you hand work to your team. When a phase closes, ask your AI to update its status and note what is left.
output_sample:
  input:
    - The name or link of your spec in Notion
    - Access to your Notion workspace
    - The name of your task database (optional)
  prerequisites:
    - An AI tool that can connect to Notion (the Notion MCP connection)
    - A Notion workspace with a task database
  output:
    - name: Clarifications block
      contains: Gaps, unclear points and assumptions found in the spec, listed before any planning starts.
    - name: Implementation plan page
      contains: Overview, spec link, requirements summary, phases, dependencies, risks and success criteria, in a quick or full layout.
    - name: Tasks in your database
      contains: Tasks sized for one to two days, each with context, objective, acceptance criteria and dependencies.
    - name: Links between spec, plan and tasks
      contains: The plan links to the spec. Each task links to both the plan and the spec.
    - name: Status updates
      contains: Progress notes and milestone summaries, with plan and task statuses kept in step as work moves.
