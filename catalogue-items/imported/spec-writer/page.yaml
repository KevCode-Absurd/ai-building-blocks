thinking: low
thinking_why: It sums up a chat in a set format.
new_slug: spec-writer
name: Spec writer
summary: Turn a chat about a new feature into a written spec and post it to your issue tracker, ready for an AI agent to build.
job: build-software
headline: Spec writer
subhead: Talk through your idea. Get the conversation turned into a spec and posted to your issue tracker. Bring the conversation about the feature. Use the result to plan your next step.
explain: |
  A feature spec written from the conversation you already had, then posted to your issue tracker and marked ready for an agent to pick up. It does not interview you. It uses what the chat and codebase have already shown.

  First it looks at the repo and uses your own domain terms. Then it picks the best place to test the feature, preferring existing test points and aiming for as few as possible, and checks that choice with you. The spec covers the problem, the solution, a long list of user stories, implementation decisions and testing choices.
when:
  - You just talked through a feature and want it written down.
  - You need a spec in your issue tracker for an agent to build.
  - You want testing points chosen before building starts.
  - You would rather not answer a long list of questions again.
not_for:
  - "You need to fix a small bug: write a short ticket by hand or ask your AI for a quick plan in chat."
  - "You have no issue tracker or no way to give your AI access to it: ask your AI to write the spec in chat and paste it in yourself."
  - "You have not yet talked through the idea: have that chat first, since this skill does not ask you questions."
you_give:
  - The conversation about the feature, in the same chat
  - Access to your codebase so your AI can read it
  - The name of your issue tracker and a way for your AI to post to it
  - A ready-for-agent label in your tracker
you_get:
  - A spec with problem, solution and user stories
  - Implementation decisions
  - A testing plan with chosen test points
  - The spec posted to your tracker with a ready label
how_to_use:
  - Talk through the feature with your AI first, in the same chat. Say what it should do and why.
  - Paste in this skill, or add it to your AI tool as a skill. Make sure your AI can read your code and reach your issue tracker.
  - Tell your AI the name of your tracker and that your ready-for-agent label exists.
  - Ask your AI to write the spec. It will pick the test points (the places in the code that your tests call into, ideally one) and ask you to confirm them once. That one check is the only question.
  - Check the spec your AI posts. Fix anything wrong in the tracker before an agent picks it up.
  - If your AI cannot reach your tracker, ask it to print the spec and paste it in yourself.
output_sample:
  input:
    - Your chat about the feature
    - Access to your code (so your AI can read it)
    - Your issue tracker and its labels, including the ready-for-agent label
  prerequisites:
    - An AI that can read your codebase
    - An AI that can post to your issue tracker
    - A ready-for-agent label set up in your tracker
  output:
    - name: Problem Statement
      contains: The problem the user faces, told from the user's side.
    - name: Solution
      contains: How the feature solves that problem, told from the user's side.
    - name: User Stories
      contains: "A long numbered list in the form: as an actor, I want a feature, so that a benefit."
    - name: Implementation Decisions
      contains: Modules, interfaces, schema changes, API contracts and other choices made, without file paths or code.
    - name: Testing Decisions
      contains: What makes a good test, which modules get tested, and similar tests already in the codebase.
    - name: Out of Scope
      contains: What this spec does not cover.
    - name: Further Notes
      contains: Anything else worth knowing about the feature.
