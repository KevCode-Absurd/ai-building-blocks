thinking: high
thinking_why: It must measure first, then rule out guesses.
new_slug: speed-tuner
name: Speed tuner
summary: Find why your site or app feels slow. Your AI measures it, fixes the real bottleneck, and measures again to prove the speed gain.
job: test-and-fix-code
headline: Speed tuner
subhead: A slow page or feature measured, fixed at the real bottleneck, then measured again to prove the gain. The skill refuses to guess. It sets a baseline first, using Lighthouse or browser tools for repeatable tests and real user data for what people actually feel.
explain: |
  A slow page or feature measured, fixed at the real bottleneck, then measured again to prove the gain. The skill refuses to guess. It sets a baseline first, using Lighthouse or browser tools for repeatable tests and real user data for what people actually feel.

  Then it finds the true cause. For the front end it checks Core Web Vitals: largest paint under 2.5 seconds, interaction delay under 200 ms and layout shift under 0.1. For the back end it hunts for repeated database queries and slow calls. It applies one fix, verifies the result, and adds a guard so it does not slip back.
when:
  - Users say your site or app feels slow.
  - Your Core Web Vitals scores are in the red.
  - A recent change made things slower and you do not know which.
  - A page struggles with big data sets or heavy traffic.
not_for:
  - "You have no sign of a slow spot yet: leave the code alone until users or a speed report show a problem."
  - "You need a server or hosting upgrade: ask your host or a developer, since this skill changes code, not hardware."
  - "You want a new feature built: use your AI with a plain request, then come back here if it runs slow."
you_give:
  - What feels slow and where
  - The code or page involved
  - Current timings or a Lighthouse report (optional)
you_get:
  - A measured baseline
  - The real bottleneck, named
  - A targeted fix
  - Before and after numbers
  - A check to stop the slowdown returning
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text from this page.
  - Describe what feels slow and where. Add the code or page link, and any timings you already have. Also give your stack, meaning your framework, database and hosting.
  - Let your AI take a baseline first. It needs to run code, so use a setup that can run code and read your files.
  - Check the bottleneck it names before it changes anything. Ask for proof from a measurement.
  - Review the before and after numbers. Keep the fix only if they improve, and keep the guard it adds.
output_sample:
  input:
    - What feels slow and where
    - The code or page involved
    - Current timings or a Lighthouse report (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Chrome DevTools or Lighthouse for page tests (free)
    - A database that supports EXPLAIN ANALYZE, if the slowness is in queries
  output:
    - name: Baseline
      contains: The starting timings, taken before any change, from lab tests and real user data where you have it.
    - name: Bottleneck
      contains: The one real cause of the slowness, found by measuring and not by guessing.
    - name: Fix
      contains: A short summary of the code change that targets that cause.
    - name: Before and after
      contains: The same measures taken again, side by side, so you can see if the fix worked or was reverted.
    - name: Guard
      contains: A test or monitor added so the slowdown does not come back.
