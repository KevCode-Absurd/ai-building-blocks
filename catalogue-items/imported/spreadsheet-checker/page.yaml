thinking: medium
thinking_why: It profiles data and takes care not to break formulas.
new_slug: spreadsheet-checker
name: Spreadsheet checker
summary: Check a spreadsheet for odd totals, broken formulas and messy data. Your original stays safe, and you get findings with proof and a new file.
job: work-with-files
headline: Spreadsheet checker
subhead: A spreadsheet that has been inspected, cleaned or analysed without breaking your original. The skill works on a copy and records the file's fingerprint, so the source stays safe.
explain: |
  Spreadsheets hide problems: broken formulas, hidden sheets, wrong totals, odd blanks. This skill checks your file for them and answers your question about it. It works on a copy and records the file's fingerprint, so your original stays safe. It lists every sheet, then separates stored values from formulas.

  It asks what each column means before guessing at blanks, zeros, dates or IDs, and writes down its assumptions. It checks formulas and data quality, reconciles to totals you trust, and compares versions. Each finding comes with the method, filters, units and where the evidence sits. Edits go to a new file, and calculated values are labelled apart from cached ones.
when:
  - A workbook has odd totals and you need to know why.
  - Two versions of a sheet differ and you need the changes.
  - You need a summary, pivot or chart without breaking formulas.
  - A messy CSV needs repair before you can use it.
not_for:
  - "You need to change a live database or a production workbook: work in a local spreadsheet app, or ask the file's owner to make the change."
  - "Your data must not leave your machine: use a local spreadsheet app, or an AI setup that runs only on your computer."
  - "You want a forecast or a promise about future results: ask an analyst, because this checks past data and does not guarantee outcomes."
you_give:
  - The spreadsheet or CSV file
  - The question you want answered
  - Totals to reconcile against (optional)
  - Whether formatting and macros must stay (optional)
you_get:
  - A sheet inventory and scope
  - Findings with evidence locations
  - Data quality and formula issues
  - A new output file with your edits
  - Reconciliation results
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick one that can run code and read files. If your data is private, use a setup that stays on your computer.
  - Paste the skill text into the chat, or upload the skill folder if your AI accepts files. The bundled profile_table.py script only runs where the skill folder can be executed. Pasting SKILL.md gives the AI the instructions but not the script.
  - Attach a copy of your spreadsheet or CSV. Add your question and any totals you trust.
  - 'Paste this first prompt: "Follow this skill. Check my attached file and answer my question. Work on a copy. Ask me what unclear columns mean."'
  - Read the findings and the data quality notes first. Then check the new file before you use it.
  - If your AI cannot run code, it can still read the file and describe it. It will mark values as not recalculated.
  - Before you act on a finding, check the new file's totals against a figure you trust. Or give the findings to the file's owner before anyone changes the original.
output_sample:
  input:
    - Your spreadsheet or CSV file
    - The question you want answered
    - Totals you trust, to check against (optional)
    - Whether formatting, formulas and macros must stay (optional)
  prerequisites:
    - An AI that can run code and open files, for the best results
    - A copy of your file you are happy to share with that AI
  output:
    - name: Source and scope
      contains: The file path, a file fingerprint, the format, a list of every sheet, and what the check covers.
    - name: Findings
      contains: Each result with its method, filters, units, period and the place in the file where the proof sits.
    - name: Data quality and formula issues
      contains: Problems such as duplicates, blanks, odd types and inconsistent formulas, kept apart from business conclusions.
    - name: New output file
      contains: Your requested edits saved to a new workbook or table, never over the original.
    - name: Reconciliation and checks
      contains: How totals matched your trusted figures, what was recalculated and reopened, and what could not be verified.
    - name: Assumptions and limits
      contains: What your AI assumed about unclear columns, and values labelled as calculated, estimated, cached or missing.
terms:
  - term: fingerprint
    meaning: A short code made from the file. If the file changes, the code changes, so you can prove your original was not touched.
  - term: cached value
    meaning: The result a spreadsheet last saved for a formula. It may be out of date until the file is recalculated.
  - term: very hidden sheet
    meaning: A sheet hidden so well that it does not show in the normal unhide list.
