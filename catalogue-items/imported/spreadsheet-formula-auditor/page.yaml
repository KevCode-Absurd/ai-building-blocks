thinking: medium
thinking_why: It scans cells by rule, then judges what is wrong.
new_slug: spreadsheet-formula-auditor
name: Spreadsheet formula auditor
summary: Find formula errors, broken links and balance sheet gaps in your spreadsheet before anyone else does. Pick a range, a sheet or the whole model.
job: work-with-files
headline: Spreadsheet formula auditor
subhead: "A list of formula errors, broken links and model problems found in your spreadsheet before someone else finds them. You choose the depth: a selected range, a sheet, or the whole model."
explain: |
  A list of formula errors, broken links and model problems found in your spreadsheet before someone else finds them. You choose the depth: a selected range, a sheet, or the whole model.

  Every scope gets formula checks. The model scope adds financial integrity tests, such as whether the balance sheet balances, cash ties out, roll-forwards agree and the logic holds. It suits DCF, LBO, three-statement and merger models. This version follows Indian conventions: a fiscal year from April to March, and lakh and crore units, with a warning about a number format that shows a crore figure 10 times too large.
when:
  - Your model will not balance and you cannot see why.
  - You are about to send a model to a client or investment committee.
  - Numbers in a sheet look off and you want a second check.
  - You use Indian fiscal years or crore units in your reports.
not_for:
  - "You have one formula that will not work: ask your AI to fix that single formula in chat."
  - "Your file has no formulas, only typed numbers: use a quick read-through by a person, or ask your AI to summarise it."
  - "You want the model changed for you: this skill reports first and only fixes when you ask."
you_give:
  - The workbook to audit
  - "The scope: selection, sheet or whole model"
  - Which currency and fiscal year you use (optional)
you_get:
  - A list of formula errors by cell
  - Broken link and reference flags
  - Balance sheet and cash tie-out results
  - Unit and fiscal period warnings
how_to_use:
  - "Gather first: the workbook file, the scope you want, and the model type (DCF, LBO, three-statement or merger) if it is a full model."
  - Open your AI tool and paste the skill, or upload the skill folder. It needs an AI that can read spreadsheet files.
  - Upload your workbook. For Indian models (crore units, April to March year), also add the India modeling rules checker skill. The skill text refers to india-market-conventions, india-market-data and a NOT-ADAPTABLE.md file, which are not in this copy. If they are missing, the skill says so and lists what it could not check. For other models you do not need any of them.
  - Your AI should say whether it read the formulas or only the saved values. If it only saw values, formula checks are limited, so ask it to say which checks it could not do.
  - "Say the scope: selection, sheet or whole model. Add your currency and fiscal year if you have them."
  - Read the findings table. Start with the critical rows, and check the balance sheet first.
  - Tell your AI which fixes to make. It will not change anything until you ask.
  - "Next: for a single broken formula, fix it in chat. If the model needs rebuilding, hand the findings table to the Financial model builder."
output_sample:
  input:
    - Your spreadsheet file
    - "The scope: selection, sheet or whole model"
    - Your currency and fiscal year (optional)
  prerequisites:
    - An AI that can open spreadsheet files
    - "Optional: the India modeling rules checker, if you want the April to March year and lakh and crore checks. Without it the skill says what it could not check."
  output:
    - name: Summary line
      contains: "For model scope only: the model type, an overall rating, and the count of critical, warning and info findings."
    - name: Findings table
      contains: One row per issue with sheet, cell, severity, category, the problem and a suggested fix.
    - name: Formula checks
      contains: Errors, hardcoded numbers in formulas, pattern breaks, short ranges, pasted-over values, circular and broken links.
    - name: Balance sheet and cash checks
      contains: Whether assets equal liabilities plus equity and cash ties out, with the gap shown per period.
    - name: Model-type checks
      contains: Common mistakes for DCF, LBO, merger and three-statement models, plus growth, margin and edge-case flags.
    - name: Unit and fiscal warnings
      contains: Flags for mixed units, wrong fiscal period labels and lakh or crore formats that show a figure 10 times too large.
