thinking: low
thinking_why: It sorts feedback into a fixed layout.
new_slug: sprint-retro-facilitator
name: Sprint retro facilitator
summary: Run a sprint retrospective in minutes. Give it your team's feedback and get themes, a sprint check and 2 or 3 action items with owners and dates.
job: organise-work
headline: Sprint retro facilitator
subhead: "A retrospective run for you: what went well, what did not, and action items with owners and dates. Pick a format or let the skill choose."
explain: |
  A retrospective run for you: what went well, what did not, and action items with owners and dates. Pick a format or let the skill choose. Options are Start, Stop, Continue; the four Ls of liked, learned, lacked and longed for; or Sailboat with wind, anchor, rocks and island.

  If you have raw feedback from sticky notes, surveys or chat, it groups it into themes and counts how often each came up. It also checks the sprint itself: goal met or not, over or under-commitment, and blockers. The result is a ranked action table with owner, deadline and a way to tell it worked.
when:
  - The sprint just ended and the team needs a retro.
  - You have a pile of feedback notes that need sorting.
  - Past retros ended without clear actions.
  - You want a new format to keep the meeting fresh.
not_for:
  - "Your team has not shared any feedback yet: collect notes or run a short survey first, then come back."
  - "You are reviewing a one-off project, not a sprint: use a post-project review run by a person, with the project lead and key people."
  - "You want a full performance review of one person: hold a one-to-one with that person instead."
you_give:
  - Team feedback or sticky note text
  - Sprint goal and results (optional)
  - Notes from earlier retros (optional)
  - Your preferred retro format (optional)
you_get:
  - Feedback grouped into themes
  - What went well and what did not
  - A sprint performance check
  - Ranked action items with owners and dates
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Say which sprint you are reviewing, with its name and dates.
  - Paste your team's feedback. Add the sprint goal, points and last retro's actions if you have them.
  - "Pick a format: Start, Stop, Continue; the four Ls; or Sailboat. Or ask your AI to choose."
  - Read the action items. Check each has a real owner and date, then share the summary with your team.
output_sample:
  input:
    - Your team's feedback, such as sticky notes, survey answers or chat messages
    - The sprint name and dates
    - Sprint goal, points committed and points completed (optional)
    - Actions from your last retro (optional)
    - The retro format you prefer (optional)
  output:
    - name: Sprint Performance
      contains: Whether the goal was met, plus points committed against points completed.
    - name: Key Themes
      contains: Your feedback grouped into themes, with the most mentioned topics first.
    - name: Action Items
      contains: Two or three actions, each with a priority, owner, deadline and a way to tell it worked.
    - name: Carry-over from Last Retro
      contains: Each action from the last retro marked done, in progress or not started.
