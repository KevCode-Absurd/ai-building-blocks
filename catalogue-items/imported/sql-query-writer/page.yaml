thinking: low
thinking_why: Turning a clear question into SQL is a standard task.
new_slug: sql-query-writer
name: SQL query writer
summary: Turn a plain question into a working SQL query. Paste your table layout and get a clear, commented query with a plain explanation of how it works.
job: track-numbers
headline: SQL query writer
subhead: A working SQL query built from a question like which customers spent the most last quarter. The skill first works out what you want measured, which things are involved and how to group or sort the result.
explain: |
  A working SQL query built from a question like which customers spent the most last quarter. The skill first works out what you want measured, which things are involved and how to group or sort the result. It then maps your words to the tables and columns in your schema and finds the right join path, avoiding extra joins that inflate the numbers.

  It chooses the right tool: simple totals, window functions for rankings and running sums, CTEs for multi-step work, or subqueries. The SQL is formatted and commented. If a query is slow, it reads the plan and suggests indexes and restructuring.
when:
  - You have a business question and a database but no SQL skills.
  - You need a ranking or running total and are unsure how to write it.
  - A multi-step calculation needs to stay readable.
  - A query you wrote returns too many rows.
not_for:
  - "You already have a slow query and want it faster: use a query optimization skill, or ask your database admin to check indexes."
  - "You have no table or column list to share: first export your schema from your database tool, or ask whoever manages the data."
  - "You want charts or a finished report: run the query, then paste the results into a spreadsheet."
you_give:
  - Your question in plain words
  - The table and column layout
  - Your database type, such as PostgreSQL, MySQL, SQLite, SQL Server or BigQuery (optional). The examples in the skill use PostgreSQL syntax.
  - Filters or time periods
you_get:
  - A formatted SQL query
  - Notes on joins and logic
  - A plain explanation of how it works
  - Index or speed suggestions
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text from this page.
  - Paste your table and column list. Add your database type if you know it.
  - Write your question in plain words. Add any dates or filters.
  - Read the explanation and assumptions. Fix anything that does not match your data.
  - Run the query on a test copy of your data first. Check the result against a total you already know.
output_sample:
  input:
    - Your question in plain words
    - Your table and column layout
    - Your database type, such as PostgreSQL or MySQL (optional)
    - Any filters or time periods
  prerequisites:
    - A database you can run queries on, to test the result
    - An AI that can reach your database, only if you want it to check the speed plan
  output:
    - name: SQL query
      contains: A formatted query with clear names, indented clauses and comments on any tricky logic.
    - name: Plain-language explanation
      contains: What the query does, what columns and rows you will see, and how it reads your question.
    - name: Assumptions
      contains: Guesses made about your tables or data, so you can check them before you trust the result.
    - name: Speed notes
      contains: Index or rewrite ideas when the query may run slowly. Needs a database to check the plan.
