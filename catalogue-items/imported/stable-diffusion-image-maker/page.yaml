new_slug: stable-diffusion-image-maker
name: Stable Diffusion image maker
summary: Make AI images from a text prompt on your own computer, or edit your photos. Get ready-to-run Python code for Stable Diffusion.
job: make-images
headline: Stable Diffusion image maker
subhead: Images made from a text description, edits to your own photos, or code for your own image pipeline. The skill uses the Hugging Face Diffusers library with Stable Diffusion models, including SDXL and Flux.
explain: |
  Images made from a text description, edits to your own photos, or code for your own image pipeline. The skill uses the Hugging Face Diffusers library with Stable Diffusion models, including SDXL and Flux.

  It covers text-to-image, image-to-image for changing style or quality, inpainting to refill a masked area, and outpainting to extend a picture. It adds ControlNet for guiding by edges, pose or depth, and LoRA for style tuning. It writes the Python and install steps. You need a computer with a capable graphics card and some Python knowledge. If you want no GPU, it points to hosted options.
when:
  - You want pictures from a text prompt on your own machine.
  - You need to change part of a photo and keep the rest.
  - You want to guide a picture using a pose or an outline.
  - You are building a custom image generation pipeline.
not_for:
  - "You have no graphics card or Python: use a hosted tool like DALL-E 3 or Leonardo.ai, which run in a browser or by API."
  - "You want artistic, stylized pictures with no setup: use Midjourney."
  - "You need a quick edit of one photo with no code: use a simple photo editor."
you_give:
  - A text description or a source image
  - A mask for the area to change (optional)
  - A computer with a GPU and Python
  - A style or model preference (optional)
you_get:
  - Python code that generates images
  - Install steps
  - Image-to-image and inpainting setups
  - ControlNet and style tuning options
how_to_use:
  - Check that you have a computer with a graphics card and Python. If not, pick a hosted tool instead.
  - Open Claude, ChatGPT or Gemini and paste this skill. Then describe the picture you want, or attach your photo.
  - Install the packages your AI lists, starting with the pip install line for diffusers, transformers, accelerate and torch.
  - Run the text-to-image code your AI gives you. The image is saved as output.png in the folder where you run it.
  - If you see an out-of-memory error, ask your AI for the memory settings in this skill and run again.
  - Before you use an image for business, check the licence of the model you chose. Then try image-to-image, inpainting or ControlNet to refine it.
output_sample:
  input:
    - A text description of the picture you want
    - A source photo (optional)
    - A mask image marking the area to change (optional)
    - A style or model preference, such as SDXL (optional)
  prerequisites:
    - A computer with a graphics card (GPU) that can run Python
    - Python with the diffusers, transformers, accelerate and torch packages
    - An AI that can run code, or you run the code yourself
  output:
    - name: Install steps
      contains: The pip commands to set up the packages, with an optional memory-saving add-on.
    - name: Text-to-image code
      contains: A Python script that turns your prompt into an image and saves it as output.png.
    - name: SDXL version
      contains: A higher quality script that makes 1024 by 1024 images and saves memory.
    - name: Image-to-image and inpainting code
      contains: Scripts to restyle a photo or refill a masked area.
    - name: ControlNet and LoRA options
      contains: Code to guide a picture by edges, pose or depth, and to add a style.
    - name: Fixes for common problems
      contains: Code to handle out-of-memory errors, black images and slow runs.
