thinking: medium
thinking_why: Access judgments depend on each role.
new_slug: staff-access-reviewer
name: Staff access reviewer
summary: Check your Shopify staff accounts for old logins, inactive status and too much access. Get a staff access review that changes nothing.
job: secure-code
headline: Staff access reviewer
subhead: A report on which Shopify staff accounts are a risk to your store. It lists accounts with no login for a set number of days (90 by default), accounts marked inactive but still set up, and owner and collaborator accounts to review.
explain: |
  A report on which Shopify staff accounts are a risk to your store. It lists accounts with no login for a set number of days (90 by default), accounts marked inactive but still set up, and the owner and collaborator accounts, which you should review by hand. It does not read permissions, so open each flagged account in Shopify admin to see what it can do.

  The skill only reads data. It changes nothing, so it is safe to run at any time. You can include or leave out inactive accounts and the owner, and get the output as a readable list or as JSON. It is a good first step before you remove access. You need the Shopify command line, a signed-in session and permission to view staff.
when:
  - A former contractor may still have a login.
  - You want a regular check on who can get into your store.
  - Too many people have full admin access.
  - You need a list before a security review.
not_for:
  - "You want to remove or turn off access: do that in your Shopify admin after the account holder's manager agrees."
  - "You are not the store owner and lack staff permissions: ask the owner to run it or share the list."
  - "You need to check app or API access: review that in your Shopify admin, as this only covers staff accounts."
you_give:
  - Your store domain
  - How many days without login counts as stale (optional)
  - Shopify read access for staff users
you_get:
  - Staff with stale logins
  - Inactive but still active accounts
  - Owner and collaborator accounts to review
  - A readable or JSON report
how_to_use:
  - Open an AI that can run the Shopify command line, such as Claude Code. A plain chat window cannot read your store.
  - Sign in to your store with read access to staff users. You must be the owner or have staff permissions.
  - Paste the skill and give your store domain. Add your stale days number if you want one other than 90.
  - Read the summary first. Then open the CSV and sort by days since last login, longest first.
  - Check each flagged account with the person's manager. Remove access yourself in your Shopify admin.
  - The CSV holds staff names and emails. Keep it private, and delete it when the review is finished.
  - The flag called high privilege only means owner or collaborator. Open each flagged account in Shopify admin to see what it can really do.
  - Next, take the flagged accounts into the Offboarding plan builder for anyone who has left. Keep the CSV in a spreadsheet as your access review record.
output_sample:
  input:
    - Your store domain
    - Days without login that count as stale (optional)
    - Whether to include inactive accounts and the owner (optional)
    - "Report style: readable list or JSON (optional)"
  prerequisites:
    - An AI that can run the Shopify command line
    - A signed-in Shopify session with read access to staff
    - Shop owner or staff-management permission
  output:
    - name: Start banner
      contains: The skill name, your store domain and the time the review began.
    - name: Step log
      contains: One line per step showing what was asked and how many results came back.
    - name: Audit summary
      contains: Counts of total, active, inactive, stale and high-privilege accounts, plus the top flagged accounts.
    - name: staff_audit CSV file
      contains: One row per staff member with last login, days since login and flags for stale, inactive and high access.
