thinking: low
thinking_why: It filters drafts by age.
new_slug: stale-draft-order-cleaner
name: Stale draft order cleaner
summary: Find Shopify draft orders older than a set number of days and clear them after you say yes. You see a dry-run list first. Deletes can't be undone.
job: run-your-store
headline: Stale draft order cleaner
subhead: A list of Shopify draft orders older than a set number of days, and a clean-up of them if you say yes. Old drafts pile up from abandoned quotes, half-finished manual orders and retired integrations.
explain: |
  A list of Shopify draft orders older than a set number of days, and a clean-up of them if you say yes. Old drafts pile up from abandoned quotes, half-finished manual orders and retired integrations. They clutter the admin and inflate pending revenue.

  The skill finds open drafts created before your cutoff (30 days by default). The cutoff uses the created date, so a draft edited recently can still match. The dry-run list shows the last edit date so you can spot those.

  It shows them as a dry run first. Only after you confirm does it delete. Deletes are permanent and cannot be undone, so check that none are live B2B quotes waiting on a customer. You need the Shopify command line, a signed-in session and draft order read and write access.
when:
  - Your draft orders list is full of old items.
  - Pending revenue looks too high because of stale drafts.
  - You want to clear abandoned B2B quotes.
  - You want to preview before anything is deleted.
not_for:
  - You have B2B quotes still waiting for a customer to approve. Check each one by hand in your Shopify admin first, or set a longer age in days.
  - You want to remove old drafts without Shopify command line access. Delete them by hand in your Shopify admin under Draft orders.
  - You want to change or finish a draft order. Open it in your Shopify admin and edit it there.
you_give:
  - Your store domain
  - Age in days that counts as stale (optional)
  - Shopify access to read and write draft orders
you_get:
  - A dry-run list of stale drafts
  - Deletion of the ones you confirm
  - A summary of what was removed
how_to_use:
  - Use an AI that can run code and the Shopify command line. A plain chat window can't do this.
  - Sign in to your store with the Shopify command line, with permission to read and write draft orders.
  - Give your AI the skill and your store domain. Add the number of days if you don't want 30.
  - Tell your AI which tag marks your live B2B quotes (it assumes b2b-quote if you say nothing). It keeps tagged drafts out of the delete list. Answer this before the first dry run. Drafts with no tag go in a separate list for you to review by hand, and are deleted only if you pick them. Tag any live quote in Shopify first.
  - The first run is always a dry run. The delete step runs only after you say yes.
  - Read the dry-run list. It shows what would be deleted and nothing is removed yet. Look for notes, high values and open B2B quotes.
  - Say yes only when the list is right. Deletes are permanent and can't be undone.
  - Open the CSV file to see what was removed. Keep it as a record. Check it against your Shopify admin, and run the clean-up again each month.
  - Next, review any drafts left on the by-hand list in your Shopify admin. Put the clean-up on your monthly store admin checklist.
output_sample:
  input:
    - Your store domain
    - How many days old a draft must be to count as stale (optional, 30 by default)
    - Whether to run as a dry run or delete for real (optional, dry run by default)
  prerequisites:
    - An AI that can run code and the Shopify command line
    - A signed-in Shopify session with permission to read and write draft orders
  output:
    - name: Start banner
      contains: The skill name, your store domain and the start time.
    - name: Step lines
      contains: One line per step showing what it asked Shopify and how many drafts it found or removed.
    - name: Outcome summary
      contains: Counts of stale drafts found and deleted, total value cleared, and any errors.
    - name: draft_cleanup_<date>.csv
      contains: One row per draft with its name, customer, date, value and the action taken.
