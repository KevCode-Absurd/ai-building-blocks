thinking: high
thinking_why: Reading model warning signs correctly takes real statistical judgement.
new_slug: statistical-model-checker
name: Statistical model checker
summary: Check a fitted Bayesian model before you quote it. Find sampling problems, weak predictions and claims the results can't support.
job: track-numbers
headline: Statistical model checker
subhead: "Before you quote a Bayesian model's results, you learn whether they deserve trust. The check covers three separate questions: did the sampling run properly, does the model predict data like yours, and do its conclusions make sense for the claim you want to make."
explain: |
  Before you quote a Bayesian model's results, you learn whether they deserve trust. The check covers three separate questions: did the sampling run properly, does the model predict data like yours, and do its conclusions make sense for the claim you want to make.

  It counts divergences, reads R-hat and effective sample size, and looks at trace and rank plots for stuck chains. It then compares simulated data to real data, runs leave-one-out checks and flags unreliable points. It warns against common slips, such as treating comparison weights as probabilities. It works with ArviZ output, so you need Python and a fitted model.
terms:
  - term: ArviZ
    meaning: A Python tool that stores and checks the results of a Bayesian model.
  - term: R-hat
    meaning: A number that shows whether the sampling chains agree. Close to 1 is good.
  - term: ESS
    meaning: Effective sample size. How many independent draws your sampling is really worth.
  - term: LOO
    meaning: Leave-one-out. A way to score how well the model predicts data it did not see.
  - term: Pareto k
    meaning: A score for each data point that shows whether the leave-one-out check can be trusted for it.
when:
  - Your sampler reported divergences and you do not know if they matter.
  - You must pick between two models and want a fair comparison with honest uncertainty.
  - A reviewer asks whether your posterior results are reliable.
  - Your model fits the data it saw but you doubt it predicts new groups.
not_for:
  - "You have not fitted a model yet: fit one first in your own stats tool, then bring the saved results here."
  - "You only have point estimates, such as a single best-fit number: ask a statistician or use a simple fit check instead."
  - "You need a fix written into your model code: this finds likely causes and what to try, but you make the changes."
you_give:
  - Your fitted model output in ArviZ form
  - The data it was fitted to
  - What you want to claim from the model
  - Sampler settings (optional)
you_get:
  - A health report on sampling and precision
  - Notes from prediction checks
  - Model comparison with uncertainty
  - Likely causes of problems and what to try
  - A plain-words verdict on what you can claim
how_to_use:
  - Save your fitted model results in ArviZ form. Keep the data you fitted it to.
  - Open an AI that can run Python code and read files, such as Claude or ChatGPT with code tools turned on. These tools may need a paid plan.
  - "Give your AI the skill folder (SKILL.md and the two files in its references folder), then upload your saved results and data. In a plain chat, paste the SKILL.md text instead and expect a thinner check."
  - Say what you want to claim from the model, for example which effect or which model is better.
  - Work in this order. First check for divergences, which are sampling steps that went wrong. Then read R-hat and ESS, which tell you whether the chains agree and how many independent draws you have. Then look at the trace and rank plots for stuck chains. Then compare simulated data with your real data. Only then compare models.
  - Read the verdict first, then the sampling health section. Fix sampling problems before you trust any comparison.
  - Once sampling is fixed, run the comparison again. Report your claim with its limits, as the verdict states them.
  - If sampling fails, fix the model set-up before you compare models. If a reviewer needs more than the report gives, hand it to a statistician.
  - This is an imported copy of the PyMC Labs arviz-diagnostics skill (MIT licence). Only the page text is ours.
output_sample:
  input:
    - Your fitted model results saved in ArviZ form
    - The data the model was fitted to
    - The claim you want to make from the model
    - Sampler settings (optional)
  prerequisites:
    - An AI that can run Python code and read your saved model results
  output:
    - name: Sampling health
      contains: Divergence counts by chain, R-hat, effective sample size and Monte Carlo error for the numbers you plan to report.
    - name: Plot review
      contains: What trace, rank and energy plots show, such as stuck or drifting chains and clusters of divergences.
    - name: Prediction checks
      contains: How well simulated data matches your real data, and whether uncertainty looks right for new observations.
    - name: Model comparison
      contains: Leave-one-out scores with paired uncertainty, reliability of each point, and a warning if stacking weights are misread.
    - name: Likely causes and fixes
      contains: Probable reasons for any problem, such as scaling or model setup, and which fix to try first.
    - name: Verdict
      contains: A plain-words statement of what you can claim, what you can't, and what to check next.
