thinking_why: Statistics need the right method and honest limits.
new_slug: statistics-helper
name: Statistics helper
summary: Give it data and a question. Get trends, outliers, correlations and
  tests, explained in plain words.
job: track-numbers
headline: Statistics helper
subhead: "Plain-language answers from your data: what is typical, what is odd,
  what is moving and what is likely just noise. You paste a table or describe a
  metric, and get a written read of it, not a wall of numbers."
explain: |
  Plain-language answers from your data: what is typical, what is odd, what is moving and what is likely just noise. You paste a table or describe a metric, and get a written read of it, not a wall of numbers.

  It picks the right centre for the shape of your data, mean for even data and median for skewed, and often reports both so the gap shows skew. It adds spread, key percentiles and a note on outliers. For trends it uses moving averages and checks for seasonality. For comparisons it runs suitable tests and says when a result is too weak to trust. It also warns about weak claims, like treating correlation as cause.
when:
  - You have a spreadsheet of sales or usage and want to know what it says.
  - An average looks off and you suspect a few big values are pulling it.
  - You need to tell if a change between two weeks is real or random.
  - You want to explain a result to a team that does not like statistics.
you_give:
  - A data table or file
  - The question you want answered
  - What each column means (optional)
  - The time period or groups to compare (optional)
you_get:
  - A summary of typical values and spread
  - Outliers flagged with context
  - Trend and seasonality notes
  - Test results in plain words
  - Cautions about what the data cannot show
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code.
