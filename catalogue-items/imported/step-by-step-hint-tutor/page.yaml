thinking: low
thinking_why: It gives one small hint at a time.
new_slug: step-by-step-hint-tutor
name: Step-by-step hint tutor
summary: Get step-by-step homework hints that nudge first and show a full step last. Your student tries, then reflects before each bigger hint.
job: teach-and-train
headline: Step-by-step hint tutor
subhead: Help that gives a student just enough to take the next step, and no more. You share the problem and what the student has tried.
explain: |
  Help that gives a student just enough to take the next step, and no more. You share the problem and what the student has tried. The tutor starts with a nudge, then moves up through hints, only offering a bigger one after the student reflects on the last.

  The ladder has levels from a guiding question up to a worked step, based on research into step-level tutoring. The student must make a first attempt before any help appears. The tutor notes whether the mistake is about concepts, procedure or strategy, and tailors the hint to it. Language is adjusted to the learner's age. The aim is that the student does the thinking, so the learning sticks.
when:
  - Your child or student is stuck on homework and you do not want to hand over the answer.
  - You study alone and want a guide who pushes you to try first.
  - You tutor and want a consistent way to scale help up.
  - A student keeps asking for the answer instead of attempting the problem.
not_for:
  - "You need help with an essay or open-ended task: ask a person, such as a teacher or tutor, who can read the full piece."
  - "The work is due in under an hour: ask your AI for a worked example or a plain explanation instead."
  - "You want the answer checked, not a hint: ask your AI to mark the work and explain the errors."
you_give:
  - The problem or task they are stuck on
  - The student's attempt so far
  - Course, topic and level
  - The hint level reached before (optional)
  - Learner age or stage (optional)
you_get:
  - A first nudge as a question
  - Hints that grow step by step
  - A reflection prompt before each bigger hint
  - A label for the type of mistake
  - A last worked step if still needed
how_to_use:
  - Open a new chat in Claude, ChatGPT or Gemini. No paid tool, code or API key is needed.
  - Paste the full SKILL.md text into the chat as your first message.
  - "Type: Help me with this problem. Then paste the problem and what the student has tried."
  - Make sure the student tries first. The tutor will not give hints before an attempt.
  - Answer each reflection question before you ask for a bigger hint.
  - When you finish, write down the hint level reached. Use it next time as the prior hint level.
output_sample:
  input:
    - The problem or task your student is stuck on
    - What the student has tried so far
    - Course, topic and level
    - The hint level reached last time (optional)
    - Learner age or stage (optional)
  output:
    - name: First nudge
      contains: A guiding question that points the student toward the idea without giving any part of the answer.
    - name: Reflection prompt
      contains: A short question the student answers about the last hint before the tutor offers a bigger one.
    - name: Graduated hints
      contains: Hints that start with a concept, then move to a procedure, one level at a time.
    - name: Mistake type
      contains: A label saying if the error is about concepts, procedure or strategy.
    - name: Last worked step
      contains: One concrete step shown only if the student is still stuck after the other hints.
    - name: Hint level reached
      contains: A number from 0 to 5 you can note down for next time.
