thinking: medium
thinking_why: It runs stock formulas and explains the results.
new_slug: stock-and-reorder-planner
name: Stock and reorder planner
summary: Plan your stock with safety stock, reorder points and an ABC ranking, plus a check on your fulfillment costs. Give it your sales and stock numbers.
job: run-your-store
headline: Stock and reorder planner
subhead: Give it your stock and sales numbers. Get safety stock, reorder points, an ABC ranking and fulfillment cost checks. Bring product list with sales per month. Use the result to plan your next step.
explain: |
  Warehouse numbers you can act on: how much safety stock to hold, when to reorder, which items deserve the most attention, and whether your fulfilment costs are in line. No account or key is needed.

  You describe your setup, such as self-fulfilment, Amazon FBA or FBM, Walmart, a 3PL, Shopify fulfilment or dropshipping. It then runs an ABC ranking so your best sellers get tight control, calculates safety stock and reorder points from demand and lead time, and checks storage, pick and pack costs against what is normal. For FBA it looks at inventory health scores and aged stock fees. For a 3PL it points out fees worth negotiating.
when:
  - Your top sellers keep running out while slow movers fill the shelves.
  - Amazon warned you about excess inventory or storage limits.
  - Your 3PL bill feels high and you want a benchmark.
  - You must decide which products to send to FBA and which to ship yourself.
not_for:
  - "You have under 8 to 12 weeks of sales history: get a supplier forecast or wait for more sales data first."
  - "You need live stock counts from your store or warehouse system: use your own inventory tool, as this only works from numbers you paste in."
  - "You want exact Amazon fees: check Amazon's current fee page, because the cost ranges here are rough planning guides."
  - "You need a full warehouse system (WMS) or forecasting software that runs on its own: use one of those tools. For one product's demand, use the demand forecast planner."
you_give:
  - Product list with sales per month
  - Lead times from suppliers
  - Current stock levels
  - Your fulfilment model
  - Monthly fulfilment or storage costs (optional)
you_get:
  - Safety stock and reorder points per item
  - An ABC ranking of products
  - Storage and fulfilment cost checks
  - A list of items to cut or shift
  - Negotiation points for your 3PL
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - Tell your AI how you fulfill orders, how many products you have, and how many orders you ship a month.
  - Paste your product list with monthly sales, supplier lead times and current stock. Add your costs if you have them.
  - If you only have monthly totals, say so. Safety stock needs how much daily sales swing, so your AI will use a simpler estimate, such as your best day minus your average day, and mark it as a rough guide.
  - Check the ABC ranking and the reorder points. Fix any number that looks wrong, such as a lead time.
  - Take the Critical rows to whoever does your buying, and act on them first.
  - Run it again each month with fresh sales and stock numbers. Check the cost ranges against your own quotes and Amazon's current fees.
next: [reorder-quantity-planner, demand-forecast-planner]
output_sample:
  input:
    - Your fulfillment model, such as self-fulfill, Amazon FBA, FBM, Walmart, 3PL or dropshipping
    - Your product list with sales per month
    - Your supplier lead times
    - Your current stock levels
    - Your monthly storage and fulfillment costs (optional)
  output:
    - name: Current State Summary
      contains: Your orders, SKU count, turnover, days of stock, stockout rate and cost per order, each marked against a benchmark.
    - name: ABC Analysis
      contains: Your products sorted into A, B and C groups by how much revenue they bring in.
    - name: Inventory Optimization
      contains: Safety stock and reorder point for each item, plus lists of overstocked items and items at risk of running out.
    - name: Cost Analysis
      contains: A breakdown of storage, pick and pack, and shipping costs, with places you could save.
    - name: Recommendations
      contains: Actions sorted into Critical, Important and Optimization, each with its impact and expected result.
    - name: Expected Results
      contains: Where each measure is now, a target, and a rough timeline.
