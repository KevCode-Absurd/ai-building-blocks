thinking: medium
thinking_why: Bad counts hurt sales, so it confirms each change.
new_slug: stock-count-updater
name: Stock count updater
summary: Give it counts by product and location. Get live stock levels
  corrected. Wrong numbers can cause overselling.
job: run-your-store
headline: Stock count updater
subhead: Counts from your shelf, entered straight into your Shopify store. You
  list each product code, the location and the change, and the skill corrects
  live stock levels to match, logging a reason such as cycle count or damaged.
explain: |
  Counts from your shelf, entered straight into your Shopify store. You list each product code, the location and the change, and the skill corrects live stock levels to match, logging a reason such as cycle count or damaged.

  It first looks up each product code and stops if any code is not found, then shows the current quantity beside the change. A preview mode lets you see the result before anything is written. Changes can link to a purchase order or return document for your records. This does change live inventory, and wrong numbers can lead to overselling, so check the preview. It needs write access to inventory in your store.
when:
  - You finished a stock count and need the system to match the shelf.
  - A box of returns arrived back at your warehouse.
  - Damaged items must be removed from available stock.
  - A sync mix-up left several products with the wrong quantity.
you_give:
  - Your Shopify store link and access
  - A list of product codes with location and change
  - The reason for the change
  - A purchase order or document link (optional)
you_get:
  - A preview of each change
  - Updated stock levels at each location
  - A reason logged for each adjustment
  - A list of codes that were not found
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin and change live
    store data.
