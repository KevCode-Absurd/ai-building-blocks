thinking: medium
thinking_why: It must tell real drift from normal moves.
new_slug: stock-sync-error-finder
name: Stock sync error finder
summary: Get products with negative or impossible stock across your locations, a
  sign your counts have drifted.
job: run-your-store
headline: Stock sync error finder
subhead: Get products with negative or impossible stock across your locations, a
  sign your counts have drifted. Bring your Shopify store link and read access.
  Use the result to plan your next step.
explain: |
  A list of products where your inventory counts cannot be right, found before a customer finds them. It scans every active location in your Shopify store and flags items with a negative available quantity, or with more units committed to orders than you hold on hand.

  Those patterns usually point to a sync problem with a warehouse, app or channel, or to counts that drifted. You can limit the scan to certain locations, choose which of the two checks to run and include or skip products with tracking turned off. The output shows each flagged product by location so you know where to look first. It only reads data and changes nothing.
when:
  - Customers ordered items your system said were in stock.
  - You added a new warehouse or app and want to check numbers still line up.
  - Your dashboard shows minus stock on some products.
  - You want a monthly health check on inventory data.
you_give:
  - Your Shopify store link and read access
  - Specific locations to check (optional)
  - Whether to include untracked items (optional)
you_get:
  - Products with negative available stock
  - Products committed above on-hand
  - Results grouped by location
  - A short list of where to investigate
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin (read only).
