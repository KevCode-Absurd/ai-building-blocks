thinking: medium
thinking_why: It follows set checks and fills in takedown templates.
new_slug: store-brand-protection-planner
name: Store brand protection planner
summary: Check listings you collect by hand for copies of your brand. Get risk levels and takedown and cease and desist letters.
job: run-your-store
headline: Store brand protection planner
subhead: Give it your brand and the listings you find. It checks them against your brand details and returns risk levels, plus takedown and legal letters. It does not search the web or watch ads. Bring brand name and official domain. Use the result to plan your next step.
explain: |
  A way to check suspected copies of your online store or unauthorised sellers, and a ready set of letters to act on them. You give your brand name, domain and trademark number, then the listings you found. It does not search the web itself.

  It covers fake stores that copy your site, look-alike domains, unauthorised resellers found by price and image matches, ads and posts that misuse your name, and trademark abuse. Each case gets a risk level with a suggested action, such as sending a takedown notice within 24 hours for active infringement. The 24 hours is a suggested target to act on, not a legal deadline. It includes templates for copyright takedown notices and cease and desist letters. Have a lawyer review anything serious.
when:
  - A customer sent you a link to a store that looks just like yours.
  - Someone is selling your products below your price without approval.
  - You found ads using your brand name that you did not make.
  - You want a monthly routine to watch for copycats.
not_for:
  - "You need legal advice on a serious case: ask a trademark lawyer before you send any letter."
  - "You sell on a marketplace with its own brand tools: use that platform's brand registry instead."
  - "You want a live scan of the web for you: this skill needs code running, so check by hand or use a paid monitoring service."
you_give:
  - Brand name and official domain
  - Trademark number (optional)
  - Links to suspected copycats (optional)
  - Your approved resellers (optional)
you_get:
  - A monitoring checklist for your brand
  - Risk levels for each finding
  - A takedown notice template
  - A cease and desist letter template
  - A suggested action for each case
how_to_use:
  - Gather your brand name, official domain and trademark number if you have one. Add your logo link and social handles too.
  - Download the skill folder and open it in an AI that can run Python code.
  - "Follow these steps: put the folder where your AI can read it, fill in the input settings, run detector.py on your own list of suspect listings, then run templates.py for the letter you need."
  - Confirm your trademark is registered and active. The letters assume you hold the right.
  - Add your details to the input settings, then run the detector script (detector.py). It does not search the web. It checks the listing details you give it against your brand info. Run as it is, it shows demo data only.
  - Read each finding and its risk level. Check every link yourself before you act.
  - "Pick the template that fits: takedown notice, cease and desist, platform report, social report or domain complaint."
  - Have a lawyer review the letter before you send it in any serious case. Treat the 24-hour target as a suggestion, not a legal deadline.
output_sample:
  input:
    - Your brand name
    - Your official domain
    - Your trademark number (optional)
    - Your logo link and social handles (optional)
  prerequisites:
    - An AI that can run Python code, to use the detector script
    - A way to download the skill folder
  output:
    - name: Brand protection report
      contains: A list of findings such as fake stores and social media misuse, each with a risk level and a next step.
    - name: Risk levels
      contains: High, medium or low for each finding, with the action to take, such as sending a takedown notice within 24 hours.
    - name: DMCA takedown template
      contains: A copyright notice you can send to a hosting provider to remove copied content.
    - name: Cease and desist letter
      contains: A direct legal notice you can send to the party copying your brand.
    - name: Platform report
      contains: A report you can file with Shopify about an abusive store.
    - name: Social report and domain complaint
      contains: Templates to report posts and ads to social platforms, and fake domains to the registrar.
