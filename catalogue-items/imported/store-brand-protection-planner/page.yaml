job: run-your-store
headline: Store brand protection planner
subhead: Give it your brand and store. Get a check for fake stores and misuse, plus takedown and legal letters.
explain: |
  A way to find people copying your online store or selling your products without permission, and a ready set of letters to act on it. You give your brand name, domain and trademark number, and it sets up what to look for.

  It covers fake stores that copy your site, look-alike domains, unauthorised resellers found by price and image matches, ads and posts that misuse your name, and trademark abuse. Each case gets a risk level with a suggested action, such as sending a takedown notice within 24 hours for active infringement. It includes templates for copyright takedown notices and cease and desist letters. Have a lawyer review anything serious.
when:
  - A customer sent you a link to a store that looks just like yours.
  - Someone is selling your products below your price without approval.
  - You found ads using your brand name that you did not make.
  - You want a monthly routine to watch for copycats.
you_give:
  - Brand name and official domain
  - Trademark number (optional)
  - Links to suspected copycats (optional)
  - Your approved resellers (optional)
you_get:
  - A monitoring checklist for your brand
  - Risk levels for each finding
  - A takedown notice template
  - A cease and desist letter template
  - A suggested action for each case
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
