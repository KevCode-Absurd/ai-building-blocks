job: study-competitors
headline: Store product data collector
subhead: "Prices, reviews and seller details from online shops, gathered into
  one table you can sort. Give a product search or a store link, and pick from
  three jobs: track products and prices, read reviews for patterns, or find
  which sellers carry a product."
explain: |
  Prices, reviews and seller details from online shops, gathered into one table you can sort. Give a product search or a store link, and pick from three jobs: track products and prices, read reviews for patterns, or find which sellers carry a product.

  It uses the Apify scraping service, so you need an Apify token and Node.js to run it. You choose the output format and file name, it runs the collection and then summarises what it found, such as price gaps against competitors, repeated complaints in reviews or unauthorised sellers. This reads public pages from outside sites, so check the site rules and keep volumes sensible. Paid service usage may apply.
when:
  - You want to compare your prices with rivals every week.
  - You need to learn what buyers complain about in a competitor's reviews.
  - You suspect a reseller is breaking your minimum advertised price.
  - You are researching a new product and want market prices.
you_give:
  - A product search term or store link
  - Which of the three jobs to run
  - An Apify account token
  - Output format and file name (optional)
you_get:
  - A table of products and prices
  - A review file with sentiment notes
  - A list of sellers for a product
  - A short written summary
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and use your Apify token.
