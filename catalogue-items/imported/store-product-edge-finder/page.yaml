thinking: medium
thinking_why: It reads reviews and sites for patterns and turns them into choices.
new_slug: store-product-edge-finder
name: Store product edge finder
summary: Find your product's edge over rival Shopify stores. Give it competitor sites and reviews. You get their gaps, your unique value and a ranked to-do list.
job: run-your-store
headline: Store product edge finder
subhead: Find the gap between your shop and the rivals, and what to change first. You give competitor stores and, if you have them, their customer reviews and yours.
explain: |
  Find the gap between your shop and the rivals, and what to change first. You give competitor stores and, if you have them, their customer reviews and yours. You get a side-by-side comparison, a list of what buyers complain about, what makes you different and a ranked action list.

  The analysis builds up in levels. Store details alone give a basic matrix. Adding competitor reviews brings out pain points to solve. Adding your own reviews shows which of your selling points customers truly mention. It also checks price against value, brand story, visual style, trust signals and ad messaging. The end is a positioning statement and a prioritised plan.
when:
  - Your product looks like everyone else's and you need a reason to be chosen.
  - You want to turn rivals' bad reviews into your selling points.
  - You are rewriting your homepage message and need a clear angle.
  - You must decide which improvements to make first.
not_for:
  - You have few or no reviews to read. Ask a few customers directly with a short survey instead.
  - You want to fix your product page copy only. Rewrite it by hand or with a plain writing prompt in your AI.
  - You need exact sales or traffic numbers for rivals. Use a paid store research tool, since this skill only reads what you give it.
you_give:
  - Your store and product
  - Two to five competitor stores
  - Competitor reviews (optional), one per line with star rating and date
  - Your own reviews (optional), in the same format
you_get:
  - A competitor comparison matrix
  - A list of customer pain points
  - Your unique selling points
  - A positioning statement
  - A ranked list of changes
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text. You do not need to run any code.
  - Paste your store link, your category and two to five competitor store links.
  - Paste competitor reviews if you have them, one review per line with the star rating and date. Add your own reviews the same way.
  - Ask your AI to build the comparison, pain points, unique value and action plan.
  - Check the result against the rival sites yourself. Treat any impact figure as a rough guess, not a promise.
  - Take the top action on the list and test it on your homepage first. Run the analysis again after that change has been live for a few weeks.
  - To rewrite the homepage message from your new angle, use the product page auditor or the sales copy reviewer.
next: [review-insight-finder, product-page-auditor]
output_sample:
  input:
    - Your store link and product category
    - Two to five competitor store links
    - Competitor customer reviews (optional)
    - Your own customer reviews (optional)
    - Ad or social media examples (optional)
  prerequisites:
    - An AI chat that can read pasted text. Running the script is optional and needs code running.
  output:
    - name: Competitor comparison
      contains: A side-by-side table of you and each rival on price, brand story, social proof, shipping and subscriptions.
    - name: Top pain points
      contains: The most common complaints in competitor reviews, ranked by how often they come up.
    - name: Differentiation opportunities
      contains: Gaps where you can stand apart, such as shipping terms, brand story, service or guarantees.
    - name: Action plan
      contains: A ranked list of changes with high, medium or low priority and a rough impact guess.
