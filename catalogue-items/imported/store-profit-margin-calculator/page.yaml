thinking: medium
thinking_why: It combines many cost sources that may be missing.
new_slug: store-profit-margin-calculator
name: Store profit margin calculator
summary: Find your store profit margin per order and product after product cost, shipping, fees and refunds. Spot best sellers that lose money.
job: run-your-store
headline: Store profit margin calculator
subhead: The profit you really keep on each order and each product, not just sales. It starts from revenue and takes off product cost, shipping, payment fees, discounts, refunds and tax, so a best seller that loses money no longer hides.
explain: |
  The profit you really keep on each order and each product, not just sales. It starts from revenue and takes off product cost, shipping, payment fees, discounts, refunds and tax, so a best seller that loses money no longer hides.

  You pick a look-back period, 30 days by default, and group results by order, product or variant. A minimum order count keeps one-off sales from skewing the list. It reads your Shopify orders and product costs, so accuracy depends on unit costs being filled in. Products with missing costs are called out and left out of the margin math, not counted as free. Payment fees are an estimate (2.9 percent plus 30 cents by default), so treat the result as a close guide, not an exact figure. Nothing in your store is changed, so you can run it any time.
when:
  - Sales look healthy but your bank balance does not.
  - You run frequent discounts and want to know which still make money.
  - You want to drop products that cost more to sell than they earn.
  - Your accountant asks for margin by product.
not_for:
  - "You need exact numbers for tax filing or payouts, because fees are estimated: use your Shopify payments report or ask your accountant."
  - "You want to change prices or edit products: this only reads your store, so make price changes yourself in Shopify."
  - "Your products have no unit costs filled in: add costs in Shopify first, or the margins will be left out."
you_give:
  - Your Shopify store link and read access
  - Look-back period in days (optional)
  - How to group results (optional)
  - Unit costs filled in on products
you_get:
  - Net profit and margin per order
  - Net profit and margin per product
  - A split of costs and fees
  - A list of loss-making products
  - Products with missing costs flagged
how_to_use:
  - Check that your products have unit costs filled in on Shopify. Without them, margins cannot be worked out.
  - Open an AI that can connect to your Shopify admin or run code. Paste in this skill.
  - Give it your store link. Add the look-back days and grouping if you want something other than 30 days by order.
  - Let it read your orders. It changes nothing in your store.
  - Open the report. Check the list of products with missing costs first.
  - Look at the bottom margin products. Decide which to reprice or drop.
  - To change prices, use the bulk price changer. To check a price against what buyers get, use the price against value checker.
next: [price-against-value-checker]
output_sample:
  input:
    - Your Shopify store link
    - How many days to look back (optional, 30 by default)
    - "How to group results: order, product or variant (optional)"
    - The fewest orders a product needs to show up (optional)
  prerequisites:
    - Read access to your Shopify orders, products and inventory
    - An AI that can run code or connect to your Shopify admin
    - Unit costs filled in on your products
  output:
    - name: Profit report summary
      contains: Orders counted, revenue, product cost, shipping, fees, refunds, net profit and overall margin for the period.
    - name: profit_report CSV by order
      contains: One row per order with revenue, cost, shipping, discounts, fees, refunds, net profit and margin percent.
    - name: profit_report CSV by product
      contains: One row per product with units sold, revenue, cost, net profit and margin percent.
    - name: Top and bottom margin products
      contains: The products that keep the most profit and the ones that keep the least.
    - name: Unknown cost flags
      contains: Products with no unit cost, listed and left out of the margin math.
