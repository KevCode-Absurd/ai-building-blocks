name: Store profit margin calculator
summary: Run it on your orders. Get true profit per order and product after cost, shipping, fees, discounts, refunds and tax.
job: run-your-store
headline: Store profit margin calculator
subhead: Run it on your orders. Get true profit per order and product after cost, shipping, fees, discounts, refunds and tax.
explain: |
  The profit you really keep on each order and each product, not just sales. It starts from revenue and takes off product cost, shipping, payment fees, discounts, refunds and tax, so a best seller that loses money no longer hides.

  You pick a look-back period, 30 days by default, and group results by order, product or variant. A minimum order count keeps one-off sales from skewing the list. It reads your Shopify orders and product costs, so accuracy depends on unit costs being filled in. Products with missing costs are called out. Nothing in your store is changed, so you can run it any time.
when:
  - Sales look healthy but your bank balance does not.
  - You run frequent discounts and want to know which still make money.
  - You want to drop products that cost more to sell than they earn.
  - Your accountant asks for margin by product.
you_give:
  - Your Shopify store link and read access
  - Look-back period in days (optional)
  - How to group results (optional)
  - Unit costs filled in on products
you_get:
  - Net profit and margin per order
  - Net profit and margin per product
  - A split of costs and fees
  - A list of loss-making products
  - Products with missing costs flagged
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can access your Shopify admin.
