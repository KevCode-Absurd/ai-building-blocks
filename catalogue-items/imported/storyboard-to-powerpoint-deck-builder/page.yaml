thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: storyboard-to-powerpoint-deck-builder
name: Storyboard to PowerPoint deck builder
summary: Turn your content, sources and audience into a storyboard and an editable PowerPoint deck for a business talk, lesson or report.
job: work-with-files
headline: Storyboard to PowerPoint deck builder
subhead: Give your AI your content, sources and audience. It plans the story as a storyboard, checks it, then builds an editable PowerPoint deck. You render each slide and check the layout before you present.
explain: |
  This is Ved Raut's SlideSage method (MIT licence), with additions from AI Blocks. We added a finalizer script that puts a visible source line and chart units on each slide for the corporate-bright style, since the original keeps sources only in the notes. We also added a full eight-slide sample storyboard so you can test your setup. The original instructions are kept in SKILL.upstream.md.
when:
  - You have a report, lesson notes or research and need a slide deck from it.
  - You must show where each fact came from on the slides.
  - You want to plan the story before you pick a look.
  - You need a deck you can edit in PowerPoint afterward.
not_for:
  - "You only need a talk with no slides: write notes or an outline by hand, as this skill always builds a PowerPoint file."
  - "You can't run Node on your computer: ask a colleague or designer to build the deck, or make slides by hand in PowerPoint."
  - "You want a style other than corporate-bright with no review: plan to check source notes and layout on every slide yourself."
how_to_use:
  - Before you start, gather your source files. Fill in templates/brief.template.md with your audience, your goal and the one message you want them to leave with.
  - Use an AI that can run code on your computer. You need Node 18 or newer, plus Python with python-pptx for the finalizer.
  - Download the skill folder and open it in your AI tool. In that folder, run npm ci --ignore-scripts to install the packages.
  - "Test the setup first with the eight-slide sample: node scripts/validate-storyboard.mjs templates/storyboard.example.json, then node scripts/generate.mjs --in templates/storyboard.example.json --out draft.pptx. If that makes a deck, your setup works."
  - Give your AI your source text, your audience, your goal and the filled-in brief.
  - "Ask it to work in this order, with your own storyboard file in place of the sample: validate (node scripts/validate-storyboard.mjs), build (node scripts/generate.mjs --in storyboard.json --out draft.pptx), run the source-note finalizer (python launch-tools/finalize_pptx.py storyboard.json draft.pptx presentation.pptx), then render every slide. launch-tools/USAGE.md has the full commands."
  - Render every slide and look at titles, chart units, source notes and wrapped text.
  - Confirm the deck has the same number of slides as the storyboard before you present.
  - Next, write your speaker notes and export a PDF handout. For a talk with a different look, use the conference talk slide maker.
next: [conference-talk-slide-maker]
output_sample:
  input:
    - Your source text, notes or documents
    - Your audience and the goal of the talk
    - The filled-in brief (templates/brief.template.md)
    - Your chosen slide style (corporate-bright is the checked one)
  prerequisites:
    - An AI that can run code on your computer
    - Node and its npm packages installed
  output:
    - name: Brief
      contains: Your audience, goal and key message, written down before any slides are planned.
    - name: Storyboard (JSON)
      contains: One entry per slide, with its title, content and visible source note, checked before building.
    - name: PowerPoint deck (.pptx)
      contains: An editable presentation built from the storyboard in your chosen style.
    - name: Source notes
      contains: Visible source lines on slides, added by the finalizer for the corporate-bright style.
    - name: Slide check
      contains: A render of every slide and a check that the slide count matches the storyboard.
you_give:
  - Your source text, notes or documents
  - Your audience and what you want them to do or know
  - The brief, filled in from templates/brief.template.md
  - Your slide style (optional, corporate-bright is the checked one)
you_get:
  - A written brief and a slide-by-slide storyboard
  - An editable PowerPoint file
  - Visible source notes on the slides
  - A check that every slide was rendered and the slide count matches
