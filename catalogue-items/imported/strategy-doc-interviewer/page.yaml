thinking: low
thinking_why: It asks one question and adds your answer to the file.
new_slug: strategy-doc-interviewer
name: Strategy doc interviewer
summary: Write your strategy doc in your own words. This strategy doc interviewer asks one question at a time and adds each answer to the file.
job: think-and-decide
headline: Strategy doc interviewer
subhead: A strategy or planning document written in your own words, because you answer and the AI only asks. You name the document, such as principles, priorities, a vision or a ranked list.
explain: |
  A strategy or planning document written in your own words, because you answer and the AI only asks. You name the document, such as principles, priorities, a vision or a ranked list. It makes a skeleton file and asks one question at a time.

  After each answer it patches your words into the right section, never rewriting the whole file, then asks the next question or a follow-up if the answer was thin. It will not suggest content for you. That keeps the document honest, because the thinking is yours. It is a good fit for quarterly reviews or notes you will return to for years. It is not for day planning or task lists.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The skill file itself says MIT, and the original author is davidondrej. Credit goes to davidondrej and sickn33.
when:
  - You need to write down your priorities but staring at a blank page stalls you.
  - You want a quarterly review that reflects your real thinking.
  - You are defining your team's principles and want them in your voice.
  - You have tried AI drafts and found they sound like someone else.
not_for:
  - "You want a plan for today: use a day planner or a simple to-do list instead."
  - "You want the AI to draft the document for you: ask your AI to write a first draft, then edit it yourself."
  - "You need to sort a pile of tasks: use a task list tool or ask your AI to sort them by hand."
you_give:
  - The name or topic of the document
  - Answers to questions, one at a time
  - An existing skeleton to fill in (optional)
you_get:
  - A skeleton file for the document, with a header, a purpose line and one section for each part you name
  - Questions asked one by one
  - Your answers placed in the right sections
  - "A finished document in your words. Its length is whatever your answers fill: a short paragraph or list in each section."
how_to_use:
  - "Gather first: the name of the document, the sections you want in it, and any existing file you want it to patch. Back that file up first, because the AI edits it directly. Give your AI access to one folder only."
  - Open Claude, ChatGPT or Gemini and paste in the skill text. A tool that can save and edit files works best. In a plain chat that cannot write files, ask the AI to show the full updated document after each answer, and copy it into your own file.
  - Tell it which document you want, such as principles, priorities, a vision or a ranked list.
  - Answer each question in your own words. It asks only one at a time.
  - After each answer, check that the file now holds what you said. Ask for a fix if it does not.
  - If you list items, say which one is first. The AI will not guess the order.
  - When the file is full, read it once through and fix any line that does not sound like you.
  - Save the file. Read it again at your next quarterly review, and update it by changing only the sections that moved.
output_sample:
  input:
    - The name or topic of the document, such as principles or priorities
    - Your answers, one question at a time
    - A skeleton file you already started (optional)
  prerequisites:
    - An AI that can create and edit files works best. In a plain chat, ask it to show the updated file after each answer.
  output:
    - name: Skeleton file
      contains: A new document with a header, a purpose line, one empty section for each part of the document you named, and placeholders marked to be filled in.
    - name: One question at a time
      contains: A single, specific question after each answer, or a follow-up if your answer was thin.
    - name: Patched sections
      contains: Your answer placed in the right section in your own words, with earlier content left alone.
    - name: Ranked list entries
      contains: For ranked lists, one rank added at a time, only after you confirm the order.
    - name: Finished document
      contains: A complete strategy document made only from your answers, with nothing added by the AI.
