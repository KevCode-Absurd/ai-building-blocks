thinking: medium
thinking_why: It defines a data shape and checks replies.
new_slug: structured-data-extractor
name: Structured data extractor
summary: Pull names, dates and amounts out of AI replies as checked data. Get Python code that retries when a field is missing or wrong.
job: build-software
headline: Structured data extractor
subhead: Code that turns an AI's free-text reply into clean, checked data your program can use. You say which fields you want, such as name, date and amount, and get a short Python setup with the Instructor library.
explain: |
  Code that turns an AI's free-text reply into clean, checked data your program can use. You say which fields you want, such as name, date and amount, and get a short Python setup with the Instructor library.

  You define the shape of the answer with Pydantic, and each reply is checked against it. If a field is missing or the wrong type, the error goes back to the AI and it tries again, up to a limit you set. It handles nested data, lists and optional fields, can stream partial results, and works with Claude, OpenAI and other providers. You need Python, a package install and an API key for your AI provider.
when:
  - Your script breaks when the AI adds extra words around its JSON.
  - You need to pull names, dates and amounts from many documents.
  - You want wrong values caught automatically before they reach your database.
  - You may change AI provider later and want the same code to work.
not_for:
  - "You need to pull data from one or two texts by hand: use a plain prompt in your chat AI and copy the result."
  - "You don't work in Python: use a no-code tool that reads documents into a spreadsheet."
  - "The code needs a fixed list of fields. For free-form replies, use a plain prompt instead."
  - "You want a full pipeline that reads files in bulk: use the data extraction pipeline builder."
  - "You want free-form text such as a summary or an email: ask your AI directly, no data shape needed."
you_give:
  - The fields you want to extract
  - Example text to read from
  - Your AI provider and API key
  - Rules for valid values (optional)
you_get:
  - A data model for your fields
  - Extraction code with automatic retries
  - Validation rules
  - Example runs on your text
  - Optional streaming code. Streaming calls change between versions, so check them against the docs for your pinned version.
  - In the end, one Python file you can run, plus a sample run on your text so you can see the checked data
how_to_use:
  - "Your chat AI only drafts the code. It does not run it. Open Claude, ChatGPT or Gemini and paste this skill into the chat. You then run the code yourself, on your own computer, with Python and your own API key. API calls are billed by your AI provider."
  - Check you have Python 3.9 or newer. The code needs Instructor 1.x and Pydantic 2.x, so install with pins such as pip install "instructor>=1,<2" "pydantic>=2,<3".
  - List the fields you want, with a type for each, such as text, number or date.
  - Paste a sample of the text you want to read. Say which AI provider you use.
  - Add rules for valid values if you have any, such as an age range or a fixed list of choices.
  - Copy the code it writes. You need Python and an API key to run it. Run the pip install line first.
  - Test it on 10 to 20 sample documents, then load the checked results into your database or spreadsheet. Send documents that fail all retries to a person to check by hand.
  - The code uses Pydantic v2 and example model names that change often. Update the model name to one your provider offers today before you run it.
next: [data-extraction-pipeline-builder, spreadsheet-checker]
output_sample:
  input:
    - The fields you want, such as name, date and amount
    - A sample of the text to read from
    - Your AI provider and API key
    - Rules for valid values (optional)
  prerequisites:
    - An AI that can run Python code, or your own computer with Python
    - The Instructor and Pydantic packages installed
    - An API key for Claude, OpenAI or another AI provider
  output:
    - name: Installation
      contains: The pip command for Instructor and the extra package for your AI provider.
    - name: Response model
      contains: A Pydantic class listing your fields, their types, and any nested, list or optional fields.
    - name: Validation rules
      contains: Checks on values, such as allowed ranges, fixed choices and rules that compare fields.
    - name: Extraction code
      contains: A short script that sends your text to the AI and returns checked data.
    - name: Retry settings
      contains: How many times the AI is asked again, with the error sent back, when a field fails.
    - name: Streaming code (optional)
      contains: Code that shows partial results or list items as the AI writes them.
