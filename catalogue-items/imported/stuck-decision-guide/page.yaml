new_slug: stuck-decision-guide
name: Stuck decision guide
summary: Tell it what feels stuck. Get a few branching questions, then a clear
  next step you can take today.
job: think-and-decide
headline: Stuck decision guide
subhead: When you feel stuck or overwhelmed, a wall of options does not help.
  You need one small step you can take today. This skill talks you there.
explain: |
  When you feel stuck or overwhelmed, a wall of options does not help. You need one small step you can take today. This skill talks you there.

  It starts with a line that names where you are, then asks one question at a time. Each answer sends you down a different branch, so the questions fit your situation instead of a fixed list. It pulls facts out of what you already wrote before it asks, so you never repeat yourself. When it has enough, it stops asking and gives concrete steps. It also knows when to skip the questions and go straight to the answer, and it keeps the tone calm and plain.
when:
  - You have too many things on your plate and cannot pick where to start.
  - You are torn between two paths at work and keep going in circles.
  - A project stalled and you do not know why.
  - You want a next step, not a long list of advice.
you_give:
  - A short description of what feels stuck
  - Answers to a few questions as they come
  - Limits like time, money or people (optional)
you_get:
  - A few branching questions that fit your case
  - A clear next step you can do today
  - A short list of follow-up steps
  - A calm summary of where you stand
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
