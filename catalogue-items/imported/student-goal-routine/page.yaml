thinking: medium
thinking_why: It adapts a goal-setting method to your class.
new_slug: student-goal-routine
name: Student goal-setting routine builder
summary: Build a student goal-setting routine for any unit or project. You get weak and strong goal examples, checkpoints and a fill-in template.
job: teach-and-train
headline: Student goal-setting routine builder
subhead: A goal-setting routine students can actually follow, with checkpoints that keep goals alive after day one. Vague goals like 'do better' are swapped for ones students can measure and plan around.
explain: |
  A goal-setting routine students can actually follow, with checkpoints that keep goals alive after day one. Vague goals like 'do better' are swapped for ones students can measure and plan around.

  You give the unit or project, the timeframe and the type of goal. The skill writes the steps: you model setting a goal aloud, students compare weak and strong examples, then write their own using a clear goal frame and an if-then plan for when things get hard. It places monitoring checkpoints through the unit, adds a reflect-and-revise step at the end, and finishes with a fill-in template students can use straight away.
when:
  - You are starting a unit and want students to own a target.
  - Students write goals like 'try harder' that never get checked.
  - You want a short routine you can repeat every term.
  - A project runs for weeks and students lose focus midway.
not_for:
  - "You want goals for a single lesson: set one simple aim aloud with the class instead, because this routine needs a few weeks of checkpoints."
  - "Your students have very low belief in themselves as learners: start with small daily goals first, then use this routine later."
  - "You need a full plan for helping students manage their own learning: use a self-regulation scaffold tool instead, since this one only covers goal setting."
you_give:
  - The unit or project
  - Year level
  - Timeframe
  - Type of goal you want, such as skill or grade
  - Success criteria (optional)
you_get:
  - A routine from modelling to reflection
  - Weak and strong goal examples
  - If-then plans for obstacles
  - Checkpoints through the unit
  - A student template to fill in
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - Tell your AI the unit or project, the year level and how long it runs.
  - Add the goal type and your success criteria if you have them.
  - Read the weak and strong examples. Check they fit your subject and your students.
  - Print or share the student template. Use the checkpoints to plan your check-in lessons.
output_sample:
  input:
    - Your unit or project
    - Your students' year level and goal-setting experience
    - How long the goals will run
    - Type of goal, such as process, outcome or both (optional)
    - Success criteria or rubric for the task (optional)
  output:
    - name: "Step 1: Teacher Modelling"
      contains: A short script for setting a goal aloud in front of the class.
    - name: "Step 2: Weak vs. Strong Goal Examples"
      contains: Paired goals for your unit, with a note on what makes the strong one work.
    - name: "Step 3: Goal-Setting Framework"
      contains: A clear goal frame and an if-then plan for when things get hard.
    - name: "Step 4: Monitoring Checkpoints"
      contains: Set points through the unit where students check progress on their goals.
    - name: "Step 5: Reflection and Revision"
      contains: Questions students answer at the end to review the goal and choose the next one.
    - name: Student Template
      contains: A fill-in sheet with goal lines, weekly check-ins and an end-of-unit reflection.
