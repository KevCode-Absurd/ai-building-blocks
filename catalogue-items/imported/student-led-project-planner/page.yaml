thinking: medium
thinking_why: It must respect student choice and still meet goals.
new_slug: student-led-project-planner
name: Student-led project planner
summary: Turn a student's project idea into a doable plan with mentor check-ins, links to your curriculum goals and a reflection step. Student-led project planner.
job: teach-and-train
headline: Student-led project planner
subhead: A student has a project idea. You need to turn it into something doable, checked along the way, and tied to what the curriculum asks for.
explain: |
  This skill drafts the plan. Two terms from the author's framework appear in it. LT means learning target, a goal from your curriculum. A band, such as Band D, is the author's name for a developmental level; give your own year level or stage instead.

  Give it the idea, the student's level, the time they have, and the learning targets you must cover. It walks through five phases. Ideation checks whether the idea is feasible. A gap analysis lists what the student still needs to learn. Planning sets milestones. Execution adds mentor check-ins. Completion ends with a defence of the work. You also get a tracking sheet and a guide for judging whether the scope is realistic.

  Licence: CC BY-SA 4.0. This is Gareth Manning's self-determined project design protocol, copied as it is. If you share changes, share them under the same licence and credit him.
when:
  - A student brings a big idea and you are not sure it can be finished in time.
  - You need to show how a passion project meets curriculum goals.
  - You mentor several independent projects and want one common structure.
  - A project drifted and you want clearer check-in points.
not_for:
  - "The project fits in one session: just set the task and a clear finish line yourself, no plan needed."
  - "Your curriculum targets do not exist yet: write them first with the learning target authoring guide, then come back."
  - "You need a marking guide for the finished work: build one with a rubric tool, not this plan."
you_give:
  - The student's project idea
  - Year level
  - Time available
  - Curriculum targets to link to
  - Your own expertise as a mentor (optional)
you_get:
  - A five-phase project plan
  - A list of what the student needs to learn first
  - Mentor check-in points
  - A tracking sheet
  - A feasibility check for the scope
how_to_use:
  - "Gather first: the student's year level and age band, their weekly time, the curriculum targets you must cover and any work they have done in this area."
  - Open a chat with your AI and paste the skill text from the download. This page only shows a summary. The part to paste is the block under the "Prompt" heading in SKILL.md; the sections above it describe the inputs.
  - Paste the student's idea and the details above. Say how much you know about the topic (optional).
  - Read Phase 1 first, then stop. Have the mentor check the feasibility result. If the scope is too big, ask your AI to narrow it. Go on to the other phases only when the mentor agrees the scope is doable.
  - Share the plan and tracking sheet with the student. Next, run the learning target authoring guide and the coherent rubric logic builder to set targets and marking.
output_sample:
  input:
    - The student's project idea, however rough
    - The student's year level and age
    - Total time and weekly hours available
    - Your curriculum targets, if they exist (optional)
    - Your own knowledge of the topic and what the student has done before (optional)
  output:
    - name: "Phase 1: Ideation and Feasibility"
      contains: The student's idea in their words, a reality check on scope, and ways to widen or narrow it.
    - name: "Phase 2: Knowledge Gap Analysis"
      contains: What the project needs, what the student knows, what they do not, and an honest readiness view.
    - name: "Phase 3: Planning"
      contains: Milestones across the time available, linked to the curriculum targets.
    - name: "Phase 4: Execution and Monitoring"
      contains: Mentor check-in points and what to look for at each one.
    - name: "Phase 5: Completion and Defence"
      contains: How the student presents and defends the finished work, with reflection on what they learned.
    - name: Tracking System Specification
      contains: A sheet layout to track milestones, check-ins and progress against the targets.
    - name: Educator Feasibility Calibration Guide
      contains: Questions to judge whether the scope is realistic for this student and time.
    - name: Known Limitations
      contains: Where the plan may fall short and what the mentor should check by hand.
