thinking: high
thinking_why: It compares the work to each criterion and sorts the gaps.
new_slug: student-work-gap-finder
name: Student work gap finder
summary: Find the gaps in student work against your criteria. Paste the work and criteria. You get strengths, ranked gaps, next steps and a feedback script.
job: teach-and-train
headline: Student work gap finder
subhead: A piece of student work, checked against your criteria, with the exact gaps named. You see what is strong, what is missing, and which gap to tackle first.
explain: |
  A mark scheme gives a grade, not a next step. This skill names the exact gap between the work and your criteria, says what type it is (idea, method or writing) and picks the first one to fix.

  Paste the work or describe it, then add the criteria and the learning goal. The skill compares what the student did with what the criteria ask for. It lists strengths, then each gap with a plain reason it matters, and ranks the gaps so you fix the biggest one first. For each priority gap it suggests a next teaching step. It also drafts a short feedback script you can read to the student, pitched to their level.
when:
  - You have a stack of essays and need quick, specific feedback.
  - A student's work is nearly there but you cannot say what is missing.
  - You are planning small-group teaching based on what the work shows.
  - You want your feedback to name one thing to fix, not ten.
not_for:
  - "You need a grade or mark for a high-stakes exam: use your exam board's mark scheme and a trained marker."
  - "You want to check whether the student wrote it themselves: talk with the student or use your school's plagiarism check."
  - "You have no criteria or learning goal yet: write them first, even as three short bullet points, then come back."
you_give:
  - "The student work, pasted or described. Check your school's data-protection and AI-use rules first, and remove the student's name and any details that identify them."
  - The assessment criteria
  - The learning goal
  - Year level and subject
  - Notes on the student (optional)
you_get:
  - A list of strengths
  - Named gaps against the criteria
  - A priority order for the gaps
  - Next teaching steps
  - A feedback script to say aloud
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. It is plain prompt text, so it runs in any chat AI. No code or paid tools are needed. Before you paste student work, remove the student's name and check your school's data-protection and AI-use rules.
  - Paste the student's work.
  - Add your criteria and the learning goal. Add year level and subject if you can.
  - Read the strengths and gaps. Check each gap against the work itself.
  - Use the priority gap and the feedback script to talk with the student.
  - To check your feedback is clear and useful, run it through the written feedback checker. To find why a student keeps making the same mistake, use the student mistake analyser.
next: [written-feedback-checker, student-mistake-analyser]
output_sample:
  input:
    - The student's work, pasted or described
    - The assessment criteria or rubric
    - The learning goal for the task
    - Year level and subject (optional)
    - Notes on the student's past work (optional)
  output:
    - name: Strengths
      contains: What the student does well, with evidence from their own work.
    - name: Gaps Identified
      contains: Each gap against the criteria, its type (concept, method or writing), and why it matters.
    - name: Priority
      contains: Which gap to fix first and why it matters most.
    - name: Next teaching steps
      contains: A specific action to close each priority gap.
    - name: Feedback Script
      contains: A short script you can say to the student, pitched to their level.
