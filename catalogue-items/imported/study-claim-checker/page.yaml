thinking: high
thinking_why: It must spot subtle flaws and weigh how strong the evidence is.
new_slug: study-claim-checker
name: Study claim checker
summary: Check a study claim before you trust it. Give it a paper or claim. You get its biases, weak statistics and an evidence grade in plain words.
job: research-topics
headline: Study claim checker
subhead: A clear verdict on how far to trust a study or a scientific claim, in plain words. You learn what the evidence can and cannot show.
explain: |
  A clear verdict on how far to trust a study or a scientific claim, in plain words. You learn what the evidence can and cannot show.

  Give it the paper, the abstract or the claim. The skill works through an appraisal. It checks the study design, looks for bias and confounders, tests whether the statistics fit the question, and rates the strength of evidence using recognised grading ideas such as GRADE and the Cochrane risk-of-bias approach. It applies those tools to the right unit, such as a single study versus a body of work. When something is unclear, it says so instead of guessing, and it can also be used to teach critical reading.
when:
  - A news story cites a study and you want to know if it holds up.
  - You are reading a paper for work and need to judge its weak spots.
  - You teach students to question evidence.
  - Someone sends you a health claim with one study behind it.
not_for:
  - "You need to write a formal peer review of a paper: use the Manuscript peer review drafter, or ask a subject expert."
  - "You want a medical or policy decision: ask a doctor or a qualified expert, since this only grades the evidence."
  - "You have no study or claim to check, only a topic to explore: start with a plain web search or a librarian."
  - "You want a fast read of a headline or news article claim: use the Study headline claim checker."
you_give:
  - The study, abstract or claim
  - The question you want answered
  - Your background with statistics (optional)
you_get:
  - A list of biases and confounders
  - Notes on weak or misused statistics
  - An evidence-strength grade
  - A plain-language verdict
  - Questions to ask the authors
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page. The reference files in the download are bundled with the skill. If your AI cannot see them, the appraisal still works from the skill text alone.
  - "Gather first: the full paper text or abstract, the exact claim wording, and the outcome that matters to you. Paste them in, and add the question you want answered."
  - Say how much you know about statistics if you want simpler or more technical wording (optional).
  - Read the concerns first. Check that each one points to a real place in the paper.
  - If the verdict is weak, check the flagged place in the paper before you share or act on the claim.
  - Next, take each concern back to the paper and check it. If you need a formal written review, use the Manuscript peer review drafter.
  - Skip the figure step unless you want a diagram. Draw any figure by hand or in your own tool. The original figure script is not included here, needs a paid OpenRouter key and sends your prompt to a third party.
output_sample:
  input:
    - The study, abstract or claim you want checked
    - The question you want answered
    - Your background with statistics (optional)
  prerequisites:
    - An AI chat that can read your pasted text or files
    - A figure is optional and needs a paid OpenRouter key, so skip it for a normal check
  output:
    - name: Summary
      contains: A short overview of what was checked and which claim or result was looked at.
    - name: Strengths
      contains: What the study did well, so the review stays fair.
    - name: Concerns
      contains: Biases, confounders and weak statistics, sorted into critical, important and minor issues.
    - name: Specific recommendations
      contains: Practical fixes or questions to put to the authors.
    - name: Overall assessment
      contains: A plain verdict on evidence strength and what can and cannot be concluded.
next: [manuscript-peer-review-drafter, study-headline-claim-checker]
