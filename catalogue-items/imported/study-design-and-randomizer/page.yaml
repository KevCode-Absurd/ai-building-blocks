thinking: high
thinking_why: Choosing a design that answers the question is hard to reverse.
new_slug: study-design-and-randomizer
name: Study design and randomizer
summary: Plan an experiment before you collect data. Get a study design, random group assignment and run order so your results are not confounded.
job: research-topics
headline: Study design and randomizer
subhead: Plan an experiment so the results mean something. You leave with a design, a random assignment and a run order that stops hidden factors from muddying the answer.
explain: |
  Plan an experiment so the results mean something. You leave with a design, a random assignment and a run order that stops hidden factors from muddying the answer.

  You describe what you are testing, the units you have and the factors involved. The skill helps choose a design, then generates it with Python scripts. They build randomisation schedules, including permuted blocks, stratified groups and whole-cluster assignment, and layouts for factorial, screening and response-surface experiments in real-world units. It also lists the common mistakes that ruin studies, such as confounded groups and unbalanced blocks, and checks your plan against them. It needs Python.
when:
  - You are about to run a trial and need to assign people or samples to groups.
  - You want to test several factors without running every combination.
  - You worry the order of runs will bias your results.
  - A reviewer asked how you randomised.
not_for:
  - "You need to know how many people or samples to test: use the sample size planner."
  - "You already have data and want to analyse it: use the Statistical test and results writer or the Statistical data analyst."
  - "You want a quick A/B test of two email subject lines: split your list at random in your email tool, no Python needed."
you_give:
  - The question you want to test
  - The units, such as people or samples, and how many
  - The factors and their ranges
  - Any grouping variable to balance, like age (optional)
you_get:
  - A recommended study design
  - A random allocation schedule
  - A run order
  - A table of treatment combinations
  - A list of design pitfalls to avoid
how_to_use:
  - Open a chat with an AI that can run Python code, like Claude or ChatGPT with code tools turned on. Code tools may need a paid plan in some AI apps, so check yours. The scripts run on your own machine or in the AI's code tool, and need no API key or other paid service. It needs Python 3.12 or newer with numpy, pandas and pydoe 1.5.0.
  - Paste in the skill instructions, or upload the skill folder if your AI accepts files.
  - Describe your question, your units, your factors and their ranges. Add a grouping variable if you have one.
  - Pick your own seed for a real study and write it down somewhere safe. The seed 42 in the examples is for demos only. Keep future assignments hidden from the people who enrol participants.
  - Check the design it suggests and the reason it gives before you accept it. For a trial with people or animals, have a statistician or your ethics board review the plan first.
  - Save the schedule and run order files, and run your study in that order. Match each unit to its ID using the unit_id column.
  - Next, check your sample size with the sample size planner. After you collect data, use the statistical test picker.
next: [sample-size-planner, statistical-test-picker]
output_sample:
  input:
    - The question you want to test
    - The units you have, such as people or samples, and how many
    - The factors and their low and high values
    - A grouping variable to balance, like age (optional)
  prerequisites:
    - An AI that can run Python code
    - Python 3.12 or newer with numpy, pandas and pydoe 1.5.0 installed
    - Your question, the number of units and the factor ranges, ready to paste
  output:
    - name: Recommended design
      contains: The design that fits your question, with a short reason for the choice.
    - name: allocation_schedule.csv
      contains: A random assignment of each unit to a group, using permuted blocks, strata or whole clusters.
    - name: experimental_runs.csv
      contains: The treatment combinations in real units, with a randomized run order.
    - name: Treatment combinations table
      contains: Each mix of factor levels for full factorial, screening or response-surface layouts.
    - name: Pitfall check
      contains: Common mistakes such as confounded groups, unbalanced blocks and pseudoreplication, checked against your plan.
