thinking: medium
thinking_why: It follows a set method and adapts its questions or draft to your evidence.
new_slug: study-notebook-review
name: Study notebook review
summary: "Run a study notebook review: recall each old topic first, get honest feedback, and see new review dates for every lesson note that is due."
job: study-and-practice
headline: Study notebook review
subhead: Give it the lesson notes and review dates from your study notebook. It asks what you recall before showing the notes, then checks the gaps. You get feedback, fresh review dates and a mixed quiz across the topics you revisited.
not_for:
  - "You have a brand-new topic and no lesson notes yet: build the lessons first with the personal study notebook, then come back here."
  - "You want a quick one-off quiz on a topic: ask your AI for a short quiz and skip the notebook."
  - "Your notes have no review dates and no dashboard: set those up first, or this skill has no queue to read."
explain: Give it the lesson notes and review dates from your study notebook. It asks what you recall before showing the notes, then checks the gaps. You get feedback, fresh review dates and a mixed quiz across the topics you revisited.
you_give:
  - Lesson notes with a review block (interval, due date and key takeaways).
  - Your study notebook dashboard with its Up for review list.
  - Your recall answers, typed or spoken, for each topic.
  - An AI that can read and write files in your notes folder or Obsidian vault.
you_get:
  - Recall feedback for each reviewed topic.
  - Updated note review dates.
  - A mixed quiz and an updated session log.
next: [personal-study-notebook, study-review-scheduler]
how_it_works:
  - title: Step 1
    text: Read the due-note queue and ask for recall before revealing takeaways.
  - title: Step 2
    text: Judge recall and adjust the interval for each note.
  - title: Step 3
    text: Run a mixed quiz and update notes, dashboard and session log.
how_to_use:
  - Open your AI in a tool that can read and write files in your notes folder. Paste in this skill's instructions, or add the skill folder.
  - Point it to your study notes folder, or your Obsidian vault.
  - Say you want to review. It reads your Up for review list and picks the due notes.
  - Explain each topic from memory before it shows anything. Answer honestly.
  - Take the mixed quiz at the end.
  - Check that the new due dates and the session log look right.
  - Next, open the dashboard to see the updated review list. For topics marked gone, rebuild the lesson with the personal study notebook. To plan review dates for plain study cards, use the study review scheduler.
output_sample:
  input:
    - Your lesson notes, each with a review block (interval, ease, due date)
    - Your dashboard with an Up for review list
    - Your spoken or typed recall of each topic, from memory
    - Your review settings (optional)
  prerequisites:
    - An AI that can read and write files in your notes folder (an Obsidian vault)
    - Lesson notes made with the agent-tutor skill
  output:
    - name: Recall check
      contains: One prompt per due topic asking you to explain it from memory before any notes are shown.
    - name: Retention verdict
      contains: "A plain call for each topic: solid, shaky but recoverable, or gone, judged against the note's key takeaways."
    - name: Updated review block
      contains: New interval, ease and due date written into each note's review frontmatter.
    - name: Mixed mini-quiz
      contains: 5 to 8 questions across all topics reviewed today, scored against a 70% pass mark.
    - name: Dashboard review queue
      contains: The Up for review list, current and sorted by due date, with finished notes removed.
    - name: Session log entry
      contains: A review entry in the day's log file with a retention verdict for each topic.
