thinking: low
thinking_why: It matches known methods to the material.
new_slug: study-strategy-picker
name: Study strategy picker
summary: Find the best study strategies for your exam and material. Get a ranked list, habits to drop, a day-by-day study plan and a short student guide.
job: teach-and-train
headline: Study strategy picker
subhead: Study methods chosen to fit your material and goal, with steps for using them. It also names the habits to drop, such as rereading, that feel useful but do little.
explain: |
  Study methods chosen to fit your material and goal, with steps for using them. It also names the habits to drop, such as rereading, that feel useful but do little.

  Give it the task, the type of material, the time left and the kind of test. The skill ranks study strategies by how well research supports them for your case, such as retrieval practice, spacing and mixing topics. It lists what to stop doing and why, builds a study plan across your available days, and ends with a short guide written for the student to follow on their own.
when:
  - An exam is three weeks away and you do not know how to revise.
  - A student studies for hours but scores stay flat.
  - You advise students on homework and want advice you can back up.
  - You need a plan for memorising lots of facts, like cell biology.
not_for:
  - "You need practice questions or a quiz built from your notes: use a quiz maker, or ask your AI to write questions from your notes."
  - "The student has no test date or goal yet: first set one with the student or a teacher, then come back."
  - "You want help with focus, stress or motivation: talk to a teacher, tutor or school counsellor."
you_give:
  - The study task or exam
  - Material type, such as notes, diagrams or formulas
  - Time available
  - Year level and subject
  - Current study habits (optional)
you_get:
  - Ranked study strategies for your case
  - A list of habits to stop
  - A day-by-day study plan
  - A short guide the student can follow
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the prompt from the skill file into a new chat.
  - Fill in the learning task, the student's year and habits, and the material type. Add time left and test type if you know them.
  - "Ask for the four sections: strategies to stop, recommended strategies, study plan and student guide."
  - Check that the plan fits the days you really have. Ask your AI to change it if not.
  - Give the student guide to the student, or use it yourself.
output_sample:
  input:
    - The study task or exam
    - Year level and current study habits
    - "Type of material: facts, ideas, steps or a mix"
    - Time available (optional)
    - What the test looks like (optional)
  output:
    - name: Strategies to STOP Using (and Why)
      contains: Common habits, such as rereading, that feel useful but help little, each with a short reason.
    - name: Recommended Strategies (Ranked by Evidence)
      contains: Study methods ranked for your material, each with steps for using it and a time share.
    - name: Study Plan
      contains: A concrete plan across the days you have, saying what to do in each session.
    - name: Student Guide
      contains: A short guide written for the student to follow on their own.
