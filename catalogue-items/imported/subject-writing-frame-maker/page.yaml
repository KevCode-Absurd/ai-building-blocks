thinking: low
thinking_why: It applies known genre rules to your subject.
new_slug: subject-writing-frame-maker
name: Subject writing frame maker
summary: Make a subject writing frame for a lab report or history essay. Get sentence starters, a word toolkit and a model text for your class.
job: teach-and-train
headline: Subject writing frame maker
subhead: A writing frame that teaches students how a subject writes, such as a lab report conclusion or a history essay. Each subject has its own rules, and this makes them visible.
explain: |
  A writing frame that teaches students how a subject writes, such as a lab report conclusion or a history essay. Each subject has its own rules, and this makes them visible.

  Name the text type, the subject and the level. The skill builds a scaffold of sections and sentence starters, then a language toolkit with the words that subject uses, like 'the results suggest' in science. It adds an annotated model text that shows each move at work. Finally it offers versions of the frame for different needs, from more support to less, so students can drop the help as they improve.
when:
  - Students write lab reports like stories and lose marks.
  - You teach a new text type, like a historical argument, and need a model.
  - Some students need more support than others on the same writing task.
  - You want sentence starters that match the subject, not generic ones.
not_for:
  - "You want general essay structure for any subject: use the Argument structure scaffold generator, or a plain paragraph frame."
  - "You are planning a lesson on content only, with no writing task: use a simple lesson plan instead."
  - "You need to check how hard a text is to read: use the Text complexity analyser."
you_give:
  - The writing task
  - Subject
  - Year level
  - Genre or text type
  - Assessment criteria (optional)
you_get:
  - A section-by-section writing frame
  - A subject language toolkit
  - An annotated model text
  - Easier and harder versions of the frame
how_to_use:
  - Open a chat with your AI, such as Claude, ChatGPT or Gemini. No code or paid tool is needed.
  - Paste the skill text into the chat.
  - Add your writing task, the subject and your students' year level. Add the text type and marking criteria if you have them.
  - Read the frame and the model text. Check that the sentence starters fit your task.
  - Use the easier or harder version of the frame for students who need it.
output_sample:
  input:
    - The writing task students must complete
    - The subject, such as Science or History
    - Your students' year level and how well they write in this subject
    - The text type, such as a lab report (optional)
    - Your marking criteria (optional)
  output:
    - name: The Scaffold
      contains: Each section of the text, what it is for, and sentence starters students can use.
    - name: Language Toolkit
      contains: Words, connectives and cautious phrases that this subject uses in this type of writing.
    - name: Annotated Model
      contains: A short model text with notes showing each writing move at work.
    - name: Differentiation
      contains: Versions of the frame with more or less support, so students can drop the help over time.
