thinking: high
thinking_why: Deadlines are short and a wrong move is costly.
new_slug: subpoena-first-look-reviewer
name: Subpoena first-look reviewer
summary: Check a subpoena your company received. You get what it asks for, the deadlines and a plan to hand your lawyer. Not legal advice.
job: check-contracts
headline: Subpoena first-look reviewer
subhead: A first read of a subpoena your company has received, so you know what it wants and when before you call your lawyer. It is a triage aid, not legal advice.
explain: |
  A first read of a subpoena your company has received, so you know what it wants and when before you call your lawyer. It is a triage aid, not legal advice.

  Share the subpoena. The skill first looks up the rule that applies where it was issued. It then classifies the document, pulls out the key fields, and checks them against your other matters. It reviews scope, burden and privilege, drafts an objections framework, and lays out a compliance plan with the people and systems likely holding documents. It ends with a deadline calendar and a written triage you can hand to counsel.
when:
  - Your company was served and no one knows the deadline.
  - You need a summary to give outside counsel on day one.
  - You want to know which teams and systems might hold the records.
  - Several matters overlap and you need to see how this one fits.
not_for:
  - "You got a grand jury subpoena: stop and call criminal counsel at once, because this skill stops there."
  - "You need legal advice or a court filing: use your lawyer, since this only gives a first read."
  - "The subpoena is a party subpoena in a matter you already track: run it through that matter's own workflow instead."
you_give:
  - The subpoena document
  - The jurisdiction
  - Your other open matters (optional)
  - Company context or systems list (optional)
you_get:
  - A classification of the subpoena
  - Key fields and categories sought
  - A scope, burden and privilege review
  - An objections framework
  - A deadline calendar and compliance plan
how_to_use:
  - Before you start, gather the subpoena file, your litigation setup notes (CLAUDE.md) and your matter log (_log.yaml).
  - Open the skill in an AI that can read files and look things up online. Paste the subpoena or give its file path. A legal research tool such as Westlaw (paid) is optional. Free CourtListener or web search also work, and those results are tagged for you to check.
  - Say where the subpoena was issued. Add your other open matters and your systems list if you have them.
  - Read the result. Check the deadlines and the rule it found before you rely on them.
  - If the subpoena is from a grand jury, the skill stops. Call criminal counsel at once.
  - Hand the triage to your lawyer. Next, start a legal hold with /legal-hold if none is in place, or open a matter with /matter-intake.
output_sample:
  input:
    - The subpoena document, as a file or pasted text
    - Where it was issued (the court or agency)
    - Your list of open matters (optional)
    - Notes on your company, teams and systems (optional)
  prerequisites:
    - An AI that can read your files, including your saved legal setup notes
    - Your litigation setup notes (CLAUDE.md) and your matter log (_log.yaml)
    - Web access to look up the rule for where the subpoena was issued
    - "Optional: a legal research tool such as Westlaw (paid), Trellis, Descrybe or CourtListener (free)"
  output:
    - name: Key fields
      contains: Who issued it, who it was served on, what it asks for, where to comply and the dates.
    - name: Categories sought (summary)
      contains: A short list of the kinds of records the subpoena asks for.
    - name: Custodians / systems likely implicated
      contains: The people, teams and systems that may hold the records.
    - name: Portfolio cross-check
      contains: How this subpoena overlaps with your other open matters.
    - name: Scope & burden analysis
      contains: Where the requests look too broad or too costly to answer.
    - name: Privilege analysis
      contains: Which records may be protected and need care before anything is handed over.
    - name: Objections framework
      contains: Possible objections to raise, for your lawyer to confirm.
    - name: Compliance plan (if responding)
      contains: Steps to gather and produce records if you respond.
    - name: Deadlines (calendar these)
      contains: Each date you must meet, ready to put in a calendar.
    - name: Immediate actions
      contains: What to do first, such as starting a legal hold.
    - name: Recommendation
      contains: A suggested next move to bring to counsel.
    - name: Citation verification
      contains: A check that the rules and cases cited are real and current.
