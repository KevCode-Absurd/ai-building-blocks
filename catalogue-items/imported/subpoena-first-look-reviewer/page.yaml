thinking: high
thinking_why: Deadlines are short and a wrong move is costly.
new_slug: subpoena-first-look-reviewer
name: Subpoena first-look reviewer
summary: Give it a subpoena. Get what it asks for, the deadline and a plan for
  your lawyer. Not legal advice.
job: check-contracts
headline: Subpoena first-look reviewer
subhead: A first read of a subpoena your company has received, so you know what
  it wants and when before you call your lawyer. It is a triage aid, not legal
  advice.
explain: |
  A first read of a subpoena your company has received, so you know what it wants and when before you call your lawyer. It is a triage aid, not legal advice.

  Share the subpoena. The skill first looks up the rule that applies where it was issued. It then classifies the document, pulls out the key fields, and checks them against your other matters. It reviews scope, burden and privilege, drafts an objections framework, and lays out a compliance plan with the people and systems likely holding documents. It ends with a deadline calendar and a written triage you can hand to counsel.
when:
  - Your company was served and no one knows the deadline.
  - You need a summary to give outside counsel on day one.
  - You want to know which teams and systems might hold the records.
  - Several matters overlap and you need to see how this one fits.
you_give:
  - The subpoena document
  - The jurisdiction
  - Your other open matters (optional)
  - Company context or systems list (optional)
you_get:
  - A classification of the subpoena
  - Key fields and categories sought
  - A scope, burden and privilege review
  - An objections framework
  - A deadline calendar and compliance plan
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your saved legal setup notes and your
    files.
  - Where the skill points to /litigation-legal:cold-start-interview, use the
    setup-interview folder inside it. We copied it in so the skill works on its
    own.
