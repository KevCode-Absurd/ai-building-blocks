thinking: medium
thinking_why: It calculates standard measures and reads them.
new_slug: subscription-unit-economics
name: Subscription unit economics analyst
summary: Give it customer and revenue data. Get cohorts, LTV to CAC, retention
  and payback worked out.
job: money-and-investing
headline: Subscription unit economics analyst
subhead: A clear read on whether a recurring revenue business makes money on
  each customer. You see how cohorts behave, what a customer is worth against
  what they cost, and how fast you earn it back.
explain: |
  A clear read on whether a recurring revenue business makes money on each customer. You see how cohorts behave, what a customer is worth against what they cost, and how fast you earn it back.

  Give it customer and revenue data. The skill first identifies the business model, then works out the core numbers: recurring revenue by cohort, lifetime value to acquisition cost, net revenue retention and payback period. It compares each against generic rule-of-thumb ranges, which are not sourced and not specific to your sector, scores the quality of the revenue, and presents the result with the margin steps from revenue to profit. It is written for investors assessing a target, and it is set up for Indian markets (April to March fiscal years, lakh and crore units). Say up front if your numbers use a different year or currency.
when:
  - You are weighing up buying or investing in a software company.
  - You want to know if your customer acquisition spend pays back.
  - Revenue is growing but you suspect customers leave quickly.
  - You need a cohort view for a board pack.
you_give:
  - Revenue by customer or cohort over time
  - Customer acquisition spend
  - Cost of serving customers
  - Sector or business model
you_get:
  - Cohort retention tables
  - LTV to CAC ratio
  - Net revenue retention
  - Payback period
  - A revenue quality score
how_to_use:
  - Download the skill folder. In Claude, open Customize → Skills, then choose + → Create skill → Upload a skill. In ChatGPT, add the files to a project's Sources. In Gemini, make a Gem and paste the instructions. Or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - "Gather first: customer-level or cohort revenue by year, sales and marketing spend by year, your fiscal year and currency."
  - The skill mentions two helper skills (india-market-conventions and india-market-data) and a NOT-ADAPTABLE.md file. They are not included here. Without them, your AI still follows the fiscal year and lakh and crore rules written at the top of the skill. The result will not include Indian market data sources, Indian sector benchmarks or the list of what cannot be adapted to India. Your AI should say so in the output.
  - The benchmark ranges in step 3 (for example LTV to CAC above 3 is good) are common rules of thumb with no source. Check them against your own sector before you quote them.
  - Next, list the red flags as questions to send the target, using the due diligence checklist builder. To check payback alone, use the subscription payback checker.
next: [due-diligence-checklist-builder, subscription-payback-checker]
not_for:
  - "You run an online store and want repeat-purchase value. Use the store LTV payback reader."
  - "You want a quick health check of your own SaaS numbers. Use the SaaS metrics coach."
  - "You report in dollars on a calendar year. This skill is set up for Indian markets, with April to March years and lakh or crore units, so say so up front."
output_sample:
  input:
    - Revenue by customer or by sign-up group over time
    - What you spent to win customers
    - What it costs to serve them
    - Your business model, such as software subscription or recurring service
    - Raw customer-level data if you have it (optional)
  prerequisites:
    - An AI that can build Excel files, or accept tables in the chat
  output:
    - name: Business model read
      contains: Which revenue model you run, so the right measures are used.
    - name: ARR bridge
      contains: Opening recurring revenue to closing, through new, expansion, shrink and churn.
    - name: Cohort matrix
      contains: Revenue for each sign-up year, in money and indexed to year zero.
    - name: Customer economics
      contains: Cost to win a customer, lifetime value, the ratio between them and payback months.
    - name: Retention and benchmarks
      contains: Gross and net retention, checked against generic rule-of-thumb ranges, each marked as unsourced.
    - name: Revenue quality score
      contains: A 1 to 5 score for recurring share, retention, concentration, cohort stability, growth and margin.
    - name: Red flags
      contains: Areas that need more checking before you decide.
