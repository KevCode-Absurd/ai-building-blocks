new_slug: subtitle-and-transcript-maker
name: Subtitle and transcript maker
summary: Turn a meeting, interview or video into a written transcript with who said what and the time of each word. Uses ElevenLabs speech to text and your own API key.
job: work-with-audio
headline: Subtitle and transcript maker
subhead: Turn a recording into a written transcript with who said what and the time of each word. You then turn that word timing into a subtitle file. It handles meetings, interviews and videos.
explain: |
  Turn a recording into a written transcript with who said what and the time of each word. You can turn that timing into subtitles. It handles meetings, interviews and videos.

  The skill sends audio or video to ElevenLabs speech to text, which needs an account and an API key, with Python or JavaScript code. You can switch on speaker labels, word-level timestamps, language detection and key term hints for names and jargon. It handles files with separate audio channels, lists the formats it accepts, and explains how to read the response and handle errors. This page is for recorded files. The skill text also has a real-time section for live transcription, which this page does not walk you through. The skill also shows how to watch your costs.

  This is a copy of ElevenLabs' own speech to text skill, shared under the MIT licence (see the LICENSE file). It was not written by AI Blocks.
when:
  - You recorded a meeting and need minutes with names attached.
  - You need subtitles for a video.
  - A podcast episode needs a searchable transcript.
  - Product names keep getting misspelled in your transcripts.
not_for:
  - You have no ElevenLabs API key or no internet. Type the notes yourself or use a transcription tool that runs on your own computer.
  - You want live captions during a call. This page covers recorded files, so use the real-time section of the skill text with a developer instead.
  - You want a summary or meeting minutes. Get the transcript here first, then ask your AI to summarise it.
you_give:
  - An audio or video file
  - An ElevenLabs API key
  - Names and jargon to watch for (optional)
  - The language, if known (optional)
you_get:
  - A full text transcript
  - Speaker labels
  - Word-level timestamps
  - Word timing you can turn into a subtitle file
  - A request ID to track usage
how_to_use:
  - Your recording is sent to ElevenLabs servers. If it holds private or confidential talk, get the speakers' consent first and read ElevenLabs' data terms before you upload.
  - Get an ElevenLabs account and an API key. Keep the key private. Your AI may offer to run npx @elevenlabs/cli onboard init. It signs you in and stores a key for the project, so make it show you the command and say yes only if you agree. The steps need someone who can run Python or JavaScript. If that is not you, use a no-code transcription tool instead.
  - Open an AI that can run code, and paste in this skill. If yours can't run code, ask a developer to run the steps for you.
  - Before a long file, check your ElevenLabs plan limits and the cost per file on its pricing page. The skill's file limits are 5 GB and 10 hours. The request ID in the result lets you find that request in your ElevenLabs usage.
  - Add your audio or video file. Say if you want speaker labels (who is speaking), the time of each word, or a set language.
  - List any names or jargon your AI should spell right (optional).
  - Run it and read the transcript. Check names and numbers against the recording.
  - "Ask your AI to turn the word timing into an SRT or VTT subtitle file. The skill gives word timing only. It does not write the subtitle file by itself."
  - Ask your AI to summarise the text if you want minutes. ElevenLabs charges for each file, so check your plan first.
output_sample:
  input:
    - An audio or video file
    - Your ElevenLabs API key
    - Names and jargon to watch for (optional)
    - The language, if you know it (optional)
  prerequisites:
    - An AI that can run code, Python or JavaScript
    - An ElevenLabs account and API key
    - Internet access
  output:
    - name: Full text
      contains: The whole recording as plain written text, with the language the tool detected.
    - name: Speaker labels
      contains: Each word tagged with the speaker who said it, when speaker labels are switched on.
    - name: Word timestamps
      contains: The start and end time of every word, plus marks for spaces and sounds like laughter.
    - name: Multichannel transcript
      contains: One transcript per audio channel, or one merged by time, when each person has their own channel.
    - name: Request ID
      contains: A reference you can use to track what the request cost you.
