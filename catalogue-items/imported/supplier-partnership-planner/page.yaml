thinking: medium
thinking_why: It adapts a standard partnership method to your supplier.
new_slug: supplier-partnership-planner
name: Supplier partnership planner
summary: Name a key supplier. Get what to share, a joint plan, meeting rhythm
  and measures that show it is working.
job: plan-supply-chain
headline: Supplier partnership planner
subhead: Name a key supplier. Get what to share, a joint plan, meeting rhythm
  and measures that show it is working. Bring the supplier and what you buy. Use
  the result to plan your next step.
explain: |
  A plan for working with a key supplier as a partner, covering what you share, how you plan together, how often you meet and how you know it is working.

  Name the supplier and your goal. The skill places the relationship on a maturity scale, then picks a model that fits, such as vendor-managed inventory or collaborative planning, forecasting and replenishment. It lays out what data each side shares, sets up joint forecasts and exception handling, and defines the meeting rhythm. It also names common blockers, like trust and system gaps, and gives measures to track the benefit. Python examples simulate the effect.
when:
  - A supplier is critical and you only talk when something breaks.
  - You want the supplier to hold stock for you.
  - Forecasts differ between you and the supplier every month.
  - You need to show what a closer partnership would gain.
you_give:
  - The supplier and what you buy
  - Your goal for the partnership
  - Current forecast and delivery issues (optional)
  - Systems each side uses (optional)
you_get:
  - A partnership model that fits
  - A data sharing list
  - A joint planning process
  - A meeting rhythm
  - Measures of success
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
