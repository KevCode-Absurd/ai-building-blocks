thinking: medium
thinking_why: It ranks risks by chance and cost, then builds fixes.
new_slug: supply-chain-backup-plan-builder
name: Supply chain backup plan builder
summary: "Build a supply chain backup plan: rank your top risks, get a backup for each, and see who does what when something breaks."
job: plan-supply-chain
headline: Supply chain backup plan builder
subhead: The biggest threats to your supply chain, ranked, with a backup for each and a clear owner for every step if something breaks. You get a plan to use on the bad day.
explain: |
  The biggest threats to your supply chain, ranked, with a backup for each and a clear owner for every step if something breaks. You get a plan to use on the bad day.

  Describe your supply chain. The skill lists risks by category and rates each by chance and damage, which gives a value at risk and a priority order. It runs disruption scenarios, including a stress test and a random simulation, so you see the likely cost of a port closure or a supplier failure. It then picks responses such as dual sourcing and safety stock, and scores your overall resilience. Python code is included.

  Every dollar, value at risk and resilience figure is a placeholder until you replace the 8, 20, 25 and 10 percent factors and the default scores of 50 with your own data.
when:
  - A single supplier or port failing would stop your business.
  - You must write a business continuity plan.
  - You want to know how much a disruption could cost.
  - Management asks how resilient you are.
not_for:
  - "You want to review one supplier's performance: ask a buyer or use a supplier scorecard, not a full plan."
  - "You need to check legal or regulatory exposure: talk to a compliance adviser."
  - "You want exact loss figures without your own data: the sample numbers in the code are placeholders, so add yours first."
  - "You have not scored all six resilience factors yourself: skip the resilience score. The code now stops if any factor is missing, instead of filling in 50."
you_give:
  - A description of your supply chain
  - Key suppliers, routes and sites
  - Cost of downtime (optional)
  - Existing safety stock (optional)
you_get:
  - A ranked risk list
  - Scenario and stress test results
  - A mitigation plan for each top risk
  - Owners and actions for a disruption
  - A resilience score
how_to_use:
  - Open Claude, ChatGPT or Gemini. Use one that can run Python code if you want the scenario and simulation steps.
  - Paste the skill text, or upload the skill folder if your AI takes files.
  - "Before you paste anything, gather: your key suppliers, their lead times, what a day of downtime costs you, and how many days of safety stock you hold. Take the cost, chance and stock figures from your own ERP, supplier contracts or finance records."
  - "The scenario and simulation steps need Python. If your AI cannot run code, fill in the risk register and mitigation table by hand, or ask your AI to build them as plain tables from your numbers. Risk register columns: risk ID, description, category, chance, impact, risk score (chance times impact), current controls, priority. Mitigation table columns: action, risk it covers, cost, yearly benefit, timeline, owner."
  - "Describe your supply chain: key suppliers, routes, sites and what an outage costs you."
  - Add your own cost, chance and stock numbers. Warning: the code uses placeholder figures for cascade effects (8, 20 and 25 percent), mitigation cost (10 percent) and variability. Do not show any dollar figure to management until you have replaced them with your own data.
  - Check the ranked risks and the owners in the plan. Fix anything that does not match your business.
  - Share the plan with the people named as owners. Name one owner for the mitigation plan, and review it every quarter or after any disruption.
  - To score the suppliers behind it, use the supplier risk scorecard builder. To track the plan on a screen, use the supply chain dashboard designer.
next: [supplier-risk-scorecard-builder, supply-chain-dashboard-designer]
output_sample:
  input:
    - A description of your supply chain
    - Your key suppliers, routes and sites
    - Your cost of downtime (optional)
    - Your current safety stock (optional)
  prerequisites:
    - An AI that can run Python code, to run the scenario and simulation steps
  output:
    - name: Executive Summary
      contains: Your top risks, total risk exposure, a value at risk estimate, your resilience score and the first actions to take.
    - name: Risk Register
      contains: Each risk with its category, chance, impact, current controls and priority order.
    - name: Scenario Analysis
      contains: Disruption cases such as a supplier failure, with chance, length of outage, recovery time and expected loss.
    - name: Risk Metrics
      contains: Value at risk, expected yearly loss and resilience index, each compared with a target.
    - name: Mitigation Plan
      contains: Each fix, the risk it covers, cost, yearly benefit, timeline and owner.
