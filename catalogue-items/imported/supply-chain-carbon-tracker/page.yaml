thinking: high
thinking_why: Emission math needs the right method for each source.
new_slug: supply-chain-carbon-tracker
name: Supply chain carbon tracker
summary: Work out your supply chain carbon footprint by source from shipping, energy and supplier data. Get a ranked list of ways to cut emissions.
job: track-numbers
headline: Supply chain carbon tracker
subhead: Your supply chain emissions, worked out by source, with a ranked list of ways to cut them. You can see where most of the carbon sits and which fix pays off most.
explain: |
  Your supply chain emissions, worked out by source, with a ranked list of ways to cut them. You can see where most of the carbon sits and which fix pays off most.

  Give it shipping, energy and supplier data. The skill follows the GHG Protocol and sorts emissions into direct, energy and value-chain scopes. It calculates each using emission factors, collects supplier data with a priority on the largest sources, and builds a report. It then scores reduction ideas by size and cost, and lays out a roadmap. Python code does the sums. Emission factors you use must come from a source you trust.

  Licence: MIT, copied from Kishor Kukreja's awesome-supply-chain repository (https://github.com/kishorkukreja/awesome-supply-chain).
when:
  - A customer asks for your carbon footprint and you have only raw data.
  - You need to know whether freight or suppliers cause more emissions.
  - You are planning reduction targets.
  - You want to compare cutting options by cost.
not_for:
  - "You need audited or regulatory filings: use a certified carbon accounting tool or an auditor, since this gives estimates only."
  - "You have no emission factors from a source you trust: get them from a published database first, or the sums will not hold up."
  - "You want to cut waste through reuse and recycling: ask a sustainability adviser, because this tracks emissions and does not plan circular programs."
you_give:
  - Shipping and freight data
  - Energy use
  - Supplier or purchase data
  - Emission factors you trust, each with a source, a year and a unit
you_get:
  - Emissions by scope and source
  - A supplier emissions report
  - Ranked reduction ideas
  - A reduction roadmap
how_to_use:
  - "Do this first: list your emission factors with source, year and unit. The factor table in the code is blank on purpose, so every factor you use must come from a published source you can cite."
  - Open Claude, ChatGPT or Gemini. Pick a mode that can run code, or the sums may be rough.
  - Paste your factor list and then the skill text from this page into the chat.
  - Then add your shipping, energy and supplier data.
  - Tell your AI your goal, such as a customer request, a target or a baseline.
  - Check which numbers are real and which are estimates, and check each factor's source and unit.
  - Use the ranked ideas to pick your first cuts. Do not use the result for audited filings.
  - If your AI says a factor is blank, that is the code working as intended. Add a cited factor for it and run again.
  - Next, turn the top cuts into a data request to your biggest suppliers, or into a reduction target and plan.
next: [supply-chain-dashboard-designer]
output_sample:
  input:
    - Your shipping and freight data
    - Your energy use, such as electricity and fuel
    - Your supplier or purchase data, with spend
    - Your own emission factors, with source and year (optional)
    - Your reduction targets or reporting needs (optional)
  prerequisites:
    - An AI that can run code, so it can do the sums
    - Emission factors from a source you trust
  output:
    - name: Executive summary
      contains: Total footprint, main sources, the gap to your reduction target if you give one, and the biggest initiatives.
    - name: Emissions inventory by scope
      contains: A table of emissions by scope and category, with share of total.
    - name: Emissions by business unit
      contains: Emissions and intensity for each unit, set against its target, with a status.
    - name: Supplier emissions
      contains: Each supplier's spend, emissions, data quality and priority, so you can see where to ask for better data.
    - name: Reduction initiatives
      contains: Each idea with status, tonnes saved per year, cost, timeline and payback.
    - name: Data quality assessment
      contains: Coverage and the share of real versus estimated data for each scope, with a quality score.
