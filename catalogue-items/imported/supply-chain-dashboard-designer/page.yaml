job: track-numbers
headline: Supply chain dashboard designer
subhead: Tell it what you ship and from where. Get a one-screen design showing
  delays, low stock and orders at risk. Bring what you ship and where from. Use
  the result to plan your next step.
explain: |
  A one-screen design that shows late shipments, low stock and orders at risk, so a planner sees problems in the morning, not at the customer's complaint.

  Tell it what you ship, from where, and which systems hold the data. The skill picks the control tower type and maturity level that fits you. It maps the data sources, orders and shipments needed, and designs the views, the exception list and the alerts. It covers common challenges, such as joining data from different systems, silos between teams, alert fatigue and getting people to use it. Python sketches show the data flow.
when:
  - Your team checks five systems to find out where an order is.
  - You want to see exceptions without reading every row.
  - You are choosing between building and buying a visibility tool.
  - Alerts are ignored because there are too many.
you_give:
  - What you ship and where from
  - Systems that hold orders and shipments
  - The problems you want to catch
  - Who will use the screen (optional)
you_get:
  - A dashboard layout
  - A data source map
  - An exception and alert list
  - A rollout plan
  - Notes on adoption
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
