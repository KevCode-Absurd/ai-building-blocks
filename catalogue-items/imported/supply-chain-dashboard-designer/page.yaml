thinking: medium
thinking_why: It picks which numbers deserve a place on screen.
new_slug: supply-chain-dashboard-designer
name: Supply chain dashboard designer
summary: Design a supply chain control tower dashboard that shows late shipments, low stock and orders at risk on one screen, with an alert plan.
job: track-numbers
headline: Supply chain dashboard designer
subhead: Tell it what you ship and from where. Get a one-screen design showing delays, low stock and orders at risk. You can then pilot one view with one team.
explain: |
  A one-screen design that shows late shipments, low stock and orders at risk, so a planner sees problems in the morning, not at the customer's complaint.

  Tell it what you ship, from where, and which systems hold the data. The skill picks the control tower type and maturity level that fits you. It maps the data sources, orders and shipments needed, and designs the views, the exception list and the alerts. It covers common challenges, such as joining data from different systems, silos between teams, alert fatigue and getting people to use it. Python sketches show the data flow.
when:
  - Your team checks five systems to find out where an order is.
  - You want to see exceptions without reading every row.
  - You are choosing between building and buying a visibility tool.
  - Alerts are ignored because there are too many.
not_for:
  - "You need to track one shipment: ask your carrier for tracking, or use the track-and-trace skill if you have it."
  - "You need to onboard or work with suppliers: use the supplier-collaboration skill if you have it, or talk to your suppliers directly."
  - "You want to buy a ready-made visibility platform today: the paid platforms need a contract, so ask vendors for a demo first."
you_give:
  - What you ship and where from
  - Systems that hold orders and shipments
  - The problems you want to catch
  - Who will use the screen (optional)
you_get:
  - A dashboard layout
  - A data source map
  - An exception and alert list
  - A rollout plan
  - Notes on adoption
how_to_use:
  - Start a chat in Claude, ChatGPT or Gemini and paste in the skill text. No code running or paid tool is needed.
  - Tell your AI what you ship, where from, and which systems hold your orders, shipments and stock.
  - "If you have them, paste an order export, a shipment export and a stock list. Add the column names for each: order ID, dates, status, location and quantity."
  - Say which problems you want to catch, such as late orders or low stock, and who will use the screen.
  - Check the dashboard panels and exception list against how your team works. Ask for changes to the alerts if there are too many.
  - Use the rollout plan to start small. Pick one view and one team first.
output_sample:
  input:
    - What you ship and where it ships from
    - The systems that hold your orders, shipments and stock
    - The problems you want to catch, such as late orders or low stock
    - Who will use the screen (optional)
  prerequisites:
    - "Optional: the commercial platforms it lists, such as o9 Solutions, are paid products"
  output:
    - name: Control tower type and maturity level
      contains: The kind of control tower that fits your business and how far to take it first.
    - name: Data architecture
      contains: The data sources to join, and how orders and shipments flow into one view, with simple Python sketches.
    - name: Control Tower Dashboard
      contains: One screen with panels for late orders, late shipments, low stock and orders at risk.
    - name: Exception list and alerts
      contains: A ranked list of problems and the alerts that tell the right person.
    - name: Common challenges and fixes
      contains: Plans for messy data, team silos, too many alerts, proving the value and getting people to use it.
    - name: Questions to ask
      contains: Open questions about your goals, systems and team that shape the final design.
