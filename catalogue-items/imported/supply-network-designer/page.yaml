thinking: high
thinking_why: It weighs cost against delivery speed across many options.
new_slug: supply-network-designer
name: Supply network designer
summary: "Plan your supply network: give it your sites, customers and costs. Get warehouse layouts compared on total cost and delivery service."
job: plan-supply-chain
headline: Supply network designer
subhead: A short list of warehouse and distribution layouts, with cost and delivery time side by side. You can see what adding, closing or moving a site would do before you spend anything.
explain: |
  A short list of warehouse and distribution layouts, with cost and delivery time side by side. You can see what adding, closing or moving a site would do before you spend anything.

  Give it your sites, customers, demand and costs. The skill frames the strategic choice, then builds an optimisation model in Python with PuLP to choose where facilities go and which serves whom. It adds up fixed, transport and inventory costs, including the stock savings from consolidating sites, and measures service levels. It follows a process: clean the data, set the strategy, model scenarios and compare trade-offs. It needs Python.
when:
  - You are deciding whether to open a second warehouse.
  - You want to know the effect of closing a distribution centre.
  - Delivery times are slow in one region.
  - You need options to take to leadership.
not_for:
  - "You only need delivery routes inside a network you already have: use route-optimization, or ask your carrier for a route plan."
  - "You have no cost data yet: get quotes for rent, freight and stock first, then come back."
  - "You run one site and have no choice to make: a simple cost check in a spreadsheet is enough."
you_give:
  - Current and candidate site locations
  - Customer locations and demand
  - Facility, transport and inventory costs
  - Service targets such as delivery days
  - "Fill these spreadsheet columns first: site ID, latitude, longitude, fixed cost and capacity; customer ID, latitude, longitude and demand; and a cost per unit for each site-to-customer lane."
you_get:
  - Several network options
  - Total cost for each
  - Delivery time or service level for each
  - Trade-off comparison
  - The model code
how_to_use:
  - Open Claude, ChatGPT or Gemini with a mode that can run Python code. This skill needs code running with PuLP and its free CBC solver installed. No paid tool is needed. The commercial tools it lists are optional.
  - Paste the skill text into the chat.
  - To compare cost against delivery speed, also give a distance in miles for each site-to-customer lane. The scenario code uses it to score delivery service.
  - Add your sites, customer demand, costs and service targets. Say if any site must stay open.
  - Answer the questions your AI asks about goals, budget and limits.
  - Check the options, the costs and the assumptions it lists. Swap any sample costs or typical ranges for your own quotes.
  - Take the option you choose into your budget or rollout plan.
  - Next, once the network is set, plan daily delivery runs from each site with the Delivery time slot route planner.
output_sample:
  input:
    - Your current and possible site locations
    - Your customer locations and demand
    - Your facility, transport and inventory costs
    - Your service targets, such as delivery days
    - Sites that must stay open or rules you must follow (optional)
  prerequisites:
    - An AI that can run Python code
  output:
    - name: Executive Summary
      contains: The recommended network, total cost against today, service gains, and the time and money to make the change.
    - name: Network Configuration
      contains: A table of each site with place, type, capacity, fixed cost, customers served and yearly volume.
    - name: Cost Breakdown
      contains: Current and proposed cost for facilities, transport and stock, with the change in each.
    - name: Service Levels
      contains: Current and proposed average distance, fast delivery share and on-time delivery.
    - name: Implementation Plan
      contains: The change in phases, such as opening a site and closing old ones.
    - name: Model code
      contains: The Python code that picks sites and assigns customers, so you can rerun it with new numbers.
