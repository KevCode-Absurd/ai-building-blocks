thinking: low
thinking_why: It sorts by clear rules.
new_slug: support-inbox-priority-sorter
name: Support inbox priority sorter
summary: Sort a support ticket by category and P1 to P4 priority. Get the team to route it to, any duplicate and a first reply to edit.
job: help-customers
headline: Support inbox priority sorter
subhead: Paste one support ticket. It pulls out the issue, who is affected and what they tried, then sets a category and a P1 to P4 priority with the reason. You get the team to route to, any known duplicate and a suggested first reply.
explain: |
  One support ticket in, a clear handling decision out: category, a P1 to P4 priority, the team that should own it, and whether it is a known issue or a duplicate.

  Paste the ticket. The skill pulls out the issue, who is affected and what they tried. It assigns a category from a fixed list and a priority using defined levels, with escalation triggers that raise the level when, for example, many customers are hit. It checks for duplicates and known problems, picks the routing and writes a triage note. The note includes a suggested first reply, internal notes and next steps you can approve.
when:
  - A new ticket arrives and you must decide who gets it.
  - Two agents argue about whether an issue is urgent.
  - You suspect a ticket repeats one from last week.
  - You want a draft first reply ready to edit.
not_for:
  - "You need a full reply to an angry customer: ask your AI to draft one from the triage note, then edit it yourself."
  - "The ticket is a contract or legal dispute: send it to your finance lead or a lawyer."
  - "You have a whole inbox of tickets to sort at once: use the support ticket sorter."
  - "You have no ticket text yet, only a title or a phone call: write down what the customer said first."
you_give:
  - The ticket text
  - Customer or plan details (optional)
  - Known issues list (optional)
  - Your team routing rules (optional)
you_get:
  - A category
  - A P1 to P4 priority with the reason
  - The team to route to
  - Any duplicate or known issue
  - A suggested first reply
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste the ticket text under the instructions. Add the plan details, known issues list or routing rules if you have them.
  - Read the category and priority. Check the reason makes sense for your customer.
  - Check the duplicate line. If you gave no known issues list or help desk access, the related-ticket and known-issue lines should read "not checked". They should never list tickets your AI cannot see.
  - The reply times for P1 to P4 are the skill's default targets. Replace them with your own team's targets before you use them.
  - Edit the suggested reply, then send it and route the ticket. If the customer is upset or the issue is big, hand it on with the escalation brief writer.
  - This copy is adapted for a plain chat: it has no connector setup, so you paste in what your AI needs.
  - This needs no code and no files. If your AI is connected to your help desk, it can also search past tickets.
next: [escalation-brief-writer, customer-reply-drafter]
output_sample:
  input:
    - The ticket text, pasted as the customer wrote it
    - Customer or plan details (optional)
    - Your list of known issues (optional)
    - Your team routing rules (optional)
  prerequisites:
    - None. Without help desk access, paste the ticket and your known issues list by hand.
  output:
    - name: Triage headline
      contains: A one-line summary of the issue with its category, secondary category if any, priority and product area.
    - name: Issue Summary
      contains: Two or three sentences on what the customer is experiencing.
    - name: Key Details
      contains: The customer, who is affected, any workaround, related tickets and whether it is a known issue.
    - name: Routing Recommendation
      contains: The team or queue to send it to, with a short reason.
    - name: Suggested Initial Response
      contains: A draft first reply that acknowledges the issue, sets expectations and gives a workaround if there is one.
    - name: Internal Notes
      contains: Context for the next agent, hints to reproduce a bug and escalation triggers to watch.
