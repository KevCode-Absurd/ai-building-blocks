thinking: low
thinking_why: Sorting tickets by clear rules needs little deep thought.
new_slug: support-ticket-sorter
name: Support ticket sorter
summary: Sort support tickets by type and severity, route each to a team, and get a first reply drafted. Paste a batch and see urgent cases first.
job: help-customers
headline: Support ticket sorter
subhead: Paste a batch of incoming tickets, with your team list and severity rules if you have them. For each ticket it works out what the customer wants, sets a severity, picks the team and drafts a first reply. You get the sorted list with urgent cases flagged for escalation.
explain: |
  A batch of tickets sorted in one pass. Each gets a type, a severity, an owner and a first reply, so urgent ones surface first.

  Paste the tickets. For each, the skill pulls out what the customer wants and the details that matter, such as the product, error or order. It assigns a severity, classifies the request and routes it to the right team. It then drafts an initial reply matched to the case. Worked examples show a batch of five tickets and an urgent production outage escalated straight away. It covers edge cases like tickets with several issues or too little detail.
when:
  - Monday morning left forty tickets in the queue.
  - You need an outage ticket to jump the line.
  - A new agent needs help judging severity.
  - You want first replies drafted for a whole batch.
not_for:
  - "You get sales or vendor emails in the same inbox: filter those out first, or let a person skim them. The sorter only marks them as spam."
  - "The ticket is a legal threat or a security report: hand it to a person right away, not to a draft reply."
  - "You have one ticket and a simple question: just write the reply yourself."
you_give:
  - One or more tickets
  - Your team and category list (optional)
  - Severity rules (optional)
  - Reply tone (optional)
you_get:
  - Each ticket classified
  - A severity ranking
  - A routing choice per ticket
  - A draft first reply
  - An escalation flag for urgent cases
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code or paid tool is needed.
  - Paste the skill instructions into the chat.
  - "Gather first: your team names, your severity rules, and your reply times and refund rules. Then paste your tickets below the skill. Add the team list, severity rules and tone if you have them."
  - "P0 to P3 are severity levels, where P0 is the most urgent (an outage) and P3 the least (a general question). SLA means the reply time you promise customers. SRE means the engineers who keep your service running."
  - Ask your AI to sort the tickets into a table with category, priority, team and a draft reply.
  - Replace the reply times and refund promises with your own policy. The sample ones are placeholders.
  - Read every draft before it goes to a customer. Cut any line that says something was done, such as "I've escalated this", unless someone really did it.
  - Paste the table into your helpdesk or a spreadsheet. Handle the P0 and P1 rows first and hand them to the right team.
  - For one ticket that needs a closer look, use the support inbox priority sorter. If several tickets share one cause, use the support issue cause investigator.
next: [support-inbox-priority-sorter, support-issue-cause-investigator]
output_sample:
  input:
    - Your support tickets, one or many (subject and body)
    - Customer details such as plan or account tier (optional)
    - Your team and category list (optional)
    - Your severity rules and reply tone (optional)
  output:
    - name: Classification table
      contains: "One row per ticket with its category: billing, bug, feature request or how-to, plus any second category."
    - name: Priority
      contains: A level from P0 to P3 for each ticket, raised one level for enterprise accounts.
    - name: Team routing
      contains: The team that should own each ticket, such as finance support, engineering triage or product support.
    - name: Suggested first reply
      contains: A short draft reply for each ticket that sets expectations and asks questions if the ticket is unclear.
    - name: Escalation notes
      contains: For urgent P0 cases, who to alert, the reply clock and how often to update the customer.
