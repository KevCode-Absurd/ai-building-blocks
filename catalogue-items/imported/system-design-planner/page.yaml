thinking: high
thinking_why: Design choices have lasting effects, so it weighs them.
new_slug: system-design-planner
name: System design planner
summary: Plan your system design before you build. Describe your app and get an architecture pick, a diagram and the trade-offs behind each choice.
job: build-software
headline: System design planner
subhead: Describe what you are building, with expected users, traffic and team size. It works through decision flows for monolith or microservices, which database fits and how the system should grow. You get a recommended architecture, a diagram, a dependency check and a trade-off summary for each choice.
explain: |
  Pick an architecture before you build it, with a diagram and a clear record of what you give up for each choice. You get a recommendation on monolith or microservices, which database fits, and how the system should grow, so the decision is written down and not guessed.

  The skill works through decision flows. For databases it asks about data shape, scale and consistency needs. For structure it weighs team size and traffic against complexity. Optional scripts can scan a project folder, draw the architecture as a Mermaid diagram, and flag tangled or circular dependencies. Each recommendation lists the trade-offs, so you can defend the call to your team. The scripts need Python. The recommendation is a starting point to discuss with your team, not a final design. Check the size and speed limits against your own load before you commit.

  Licence: this is a copy of the open-source senior-architect skill, shared under the MIT licence in the LICENSE file. We gave it a plain name and rewrote the page text. The method is unchanged. The sample reports in the skill file show the layout only. Their numbers and names are made up.
when:
  - You are starting a new product and must choose between a monolith and services.
  - You need to pick a database and want the reasons laid out.
  - You inherited a codebase and want a diagram of how it really fits together.
  - Your app is slowing under load and you need a plan to scale.
  - You must explain an architecture choice to your team or manager.
not_for:
  - "You are writing one script or a small app with no real architecture choice: skip this and just build it, or ask your AI for a plain code review."
  - "You need to fix bugs or review code line by line: ask a developer or use your AI's code review instead."
  - "You need a final cloud bill or load test: use your cloud provider's cost calculator and a real load test."
you_give:
  - A description of what you are building
  - Expected users, traffic and team size
  - Your project folder (optional)
  - Constraints such as budget or cloud provider (optional)
you_get:
  - A recommended architecture
  - A diagram in Mermaid form
  - A dependency check with problems flagged
  - A trade-off summary for each choice
how_to_use:
  - Open Claude, ChatGPT or Gemini and add this skill, or paste the skill file (SKILL.md). For the diagram and dependency check, also give your AI the references and scripts folders from the skill.
  - "Describe what you are building. Answer these first: what the data looks like, how many reads and writes, which regions, your budget, your current stack and your team size. Add expected users and traffic."
  - Add constraints like budget or cloud provider if you have them (optional).
  - For a diagram and dependency check on existing code, use an AI that can run Python and upload your project folder.
  - "Read the recommendation and trade-offs. Ask for a decision record to share with your team. It is about one page: context, options, decision, reasons and trade-offs. The diagram is one Mermaid block."
  - In a chat with no code running, you get the recommendation and the decision record, but not the diagram or the dependency check.
  - Save the decision record in your team's repo, and run the dependency check again after your first milestone. Use the decision record writer to keep later choices in the same format.
next: [decision-record-writer, codebase-architecture-reviewer]
output_sample:
  input:
    - A short description of what you are building
    - Expected users, traffic and team size
    - Your project folder (optional)
    - Constraints such as budget or cloud provider (optional)
  prerequisites:
    - An AI that can run Python code and read your project files, only if you want the diagram and dependency check from a folder
  output:
    - name: Architecture recommendation
      contains: The suggested structure, such as modular monolith or microservices, with the reasons it fits your team and traffic.
    - name: Database choice
      contains: Which database fits your data shape, scale and consistency needs, and why.
    - name: Architecture diagram
      contains: A Mermaid diagram of the parts of your system and how they connect. PlantUML or ASCII on request.
    - name: Dependency report
      contains: Dependencies, circular links, a coupling score and outdated packages found in your project folder.
    - name: Architecture assessment
      contains: The pattern found in your code, mixed concerns, large files and layer problems, with fixes.
    - name: Trade-off summary
      contains: What you gain and give up with each choice, so you can defend the call to your team.
    - name: Decision record
      contains: Context, options considered, the decision, the reasons and the trade-offs accepted.
