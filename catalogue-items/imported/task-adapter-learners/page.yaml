thinking: medium
thinking_why: It changes the support but keeps the learning goal the same.
new_slug: task-adapter-learners
name: Task adapter for different learners
summary: Adapt a classroom task for EAL, dyslexia, ADHD or anxiety. Give it the task and learner need. You get a version with the same learning goal.
job: teach-and-train
headline: Task adapter for different learners
subhead: Give it the task, the learning objective and the learner need, such as EAL or dyslexia. It keeps the objective fixed and changes only how the student gets there. You get the adapted task, what changed and why, and extra scaffolds or stretch prompts. It does not diagnose anyone.
explain: |
  The same classroom task, reshaped for a learner who needs more support, more stretch or a different way in, with the learning goal left untouched. You avoid giving a student an easier task that teaches less.

  You name the task, the learning objective and the learner need, such as EAL, dyslexia, ADHD, anxiety or a gifted student. The skill keeps the objective fixed and changes only how the student gets there. It adjusts the language, the steps, the scaffolds, the response format or the level of challenge. Its methods come from differentiation and Universal Design for Learning research. It describes learner needs but does not diagnose anyone, so use your own knowledge of the child.
when:
  - One student in your class cannot access a task you planned for everyone.
  - You want a stretch version for a fast finisher.
  - A student with anxiety needs a lower pressure way to show the same learning.
  - You need a version of a worksheet for a pupil still learning English.
  - You are planning for mixed needs and want options ready.
not_for:
  - "You want to find out what a student needs: ask your SENCO or a specialist, because this tool does not diagnose anyone."
  - "A student already has a support plan: start with the school's plan, then use this to shape one task."
  - "You need a whole lesson plan adapted for English language learners: use the ELL lesson adapter."
  - "You need a task made from scratch: write the task first, or ask your AI to draft one, then bring it here."
you_give:
  - The original task
  - The learning objective
  - The learner need or profile
  - Year group and subject (optional)
you_get:
  - An adapted task with the same goal
  - A list of what was changed and why
  - Scaffolds or extension prompts
  - A quick check that the objective still holds
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions. No code, files or paid tools are needed.
  - The pasted prompt has template slots such as {{original_task}}, {{learner_profile}} and {{learning_objective}}. Replace each one with your own text before you run it. Delete the optional ones you do not use.
  - Paste your original task and the learning objective.
  - Say what the learner needs, such as EAL, dyslexia, ADHD or anxiety. Add year group and subject if you can.
  - Read the adapted task and the list of what changed. Check the objective is still the same.
  - Edit anything that does not fit the child you know, then use the task in class.
  - For more language support steps, pair it with the ELL task scaffolds. To check what students learned, use the lesson understanding check. This skill is adapted from Gareth Manning's differentiation-adapter, shared under CC BY-SA 4.0.
next: [ell-task-scaffolds, lesson-understanding-check]
output_sample:
  input:
    - Your original task, as you planned it for the class
    - The learning objective, which stays the same
    - The learner need, such as EAL, dyslexia, ADHD, anxiety or gifted
    - Year group and subject (optional)
    - Support you have, such as a teaching assistant or technology (optional)
  output:
    - name: The Adapted Task
      contains: The new version of the task, changed to fit the learner need.
    - name: What Changed and What Stayed the Same
      contains: A plain list of what was changed and what was kept.
    - name: Objective Check
      contains: A check that the learning objective still holds in the adapted task.
    - name: Implementation Notes
      contains: Practical tips for you on how to run the adapted task in class.
