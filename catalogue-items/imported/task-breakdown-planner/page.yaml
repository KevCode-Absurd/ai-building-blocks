thinking: medium
thinking_why: It orders work and sets checks from a clear spec.
new_slug: task-breakdown-planner
name: Task breakdown planner
summary: Give it a spec. Get small, ordered tasks, each with a clear way to
  check it is done.
job: build-software
headline: Task breakdown planner
subhead: Give it the spec, and the codebase if there is one. It reads both,
  writes no code, and maps what depends on what before cutting the work into
  small ordered tasks. You get the dependency map, the task list, a done check
  for each task, checkpoints and risks.
explain: |
  A spec turned into small ordered tasks, each with a plain test for when it is done. Big vague work becomes a plan that you or an AI agent can follow one step at a time without a tangle.

  The skill reads the spec and the existing code first and writes no code. It maps what depends on what, such as schema before models before endpoints. It cuts work into thin vertical slices that each leave things working. Every task gets acceptance criteria, files likely touched, a rough size and risks. Checkpoints are placed between groups of tasks. The plan is saved as a plan file and a task list, so progress can be tracked.
when:
  - You have a spec and no idea where to begin.
  - A task feels too large to start and keeps slipping.
  - You want to split work across several people or AI sessions.
  - You need to show a manager the scope in clear pieces.
  - The order of the work is not obvious.
you_give:
  - The spec or requirements
  - Access to the codebase (optional)
  - Known deadlines or limits (optional)
you_get:
  - A dependency map
  - An ordered task list
  - Done checks for each task
  - Checkpoints and a list of risks
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
