thinking: medium
thinking_why: It plans what to hand off and how to check it.
new_slug: task-handoff-writer
name: Task handoff writer
summary: "Write a task handoff brief for another AI agent: goal, files it owns, limits and a done check. Plus a plan to track its progress."
job: set-up-ai
headline: Task handoff writer
subhead: Describe the work to pass on, which AI agent will take it and what it may touch. It scopes the job and writes a brief with the goal, what it owns and what counts as done. You get the brief, a success check, a progress-check plan and a report of changes.
explain: |
  A clear brief that lets another AI agent take over a piece of work without losing context, plus a way to check its progress. Handoffs stop failing because the second agent knows what to do, what it owns and what counts as done.

  The skill only delegates when you have allowed it. It scopes the job to something bounded, then writes the brief: the goal, the files or areas the agent owns, what is off limits and the check that proves success. For terminal agents it uses safe ways to send long prompts so quotes and symbols do not break. It polls at sensible intervals, reports real progress only, and keeps the final review with you.

  Licence: the author's own file header (davidondrej) says MIT, and that covers this skill text. sickn33's LICENSE-CONTENT file (CC BY 4.0) applies only where no more specific upstream notice exists. Keep the MIT notice and credit davidondrej and sickn33.
when:
  - You want a second AI agent to take one part of a big job.
  - A long prompt keeps breaking when sent to a terminal agent.
  - You need to track what the agent changed and what is left.
  - You worry two agents will edit the same files.
  - You want a handoff note a person could follow too.
not_for:
  - "You cannot install or run command line tools: the terminal agent steps assume you can. Write the brief here, then give it to a developer or a person on your team."
  - "You want one AI to do the whole job yourself: just ask your AI directly, no handoff needed."
  - "You have not approved handing work to another agent: get your own sign-off first, because this skill only delegates when you allow it."
  - "You need to give an AI access to a remote server: set that up with your IT person, since this skill will not assume access."
you_give:
  - The work to pass on
  - Which agent or tool will take it
  - Files or areas it may touch
  - How you will know it worked
you_get:
  - A handoff brief with scope and limits
  - A check for success
  - A polling plan with sensible gaps
  - A report of changes and open issues
how_to_use:
  - "The brief alone is a complete result. If you are not a developer, stop after the brief. Write the brief in chat, check it, and hand it to a developer or a teammate. Use a terminal agent only if you can install and run command line tools."
  - Open your AI chat, such as Claude, ChatGPT or Gemini, and paste in the skill text.
  - Describe the work to pass on and name the agent that will take it.
  - List the files or areas the agent may touch, and say what is off limits.
  - Tell your AI you approve the handoff, and say how you will know the work is done.
  - Read the brief and the success check before you send anything to the agent.
  - Sending the brief to a terminal agent such as Claude Code or Codex CLI needs that tool installed on your computer, and a paid plan or API key for it. Check your account first. These tools can run commands on your computer, so read the brief and limits before you let one start. Check its progress using the polling plan, then review the report yourself.
  - Next, read the report and check the open issues yourself. Pair it with a review or checklist skill before you merge or publish any of the agent's work.
output_sample:
  input:
    - The work you want to pass on
    - Which AI agent or tool will take it
    - The files or areas it may touch
    - How you will know the work is done
    - Your OK to hand the work off
  prerequisites:
    - An AI agent or tool you are allowed to use, such as Claude Code or Codex CLI (these need a paid plan or API key)
    - Your clear approval to delegate the work
  output:
    - name: Handoff brief
      contains: The goal, what the agent owns, what is off limits and what is not part of the job.
    - name: Success check
      contains: The test or check that proves the work is done.
    - name: Prompt delivery
      contains: A safe way to send a long prompt to a terminal agent so quotes and symbols do not break it.
    - name: Polling plan
      contains: How often to check on the agent, with gaps that grow while it works.
    - name: Report
      contains: Files changed, the checks you ran and any issues still open.
