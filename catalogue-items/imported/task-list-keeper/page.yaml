new_slug: task-list-keeper
name: Task list keeper
summary: Tell it your tasks. Get one TASKS file kept current as you add, finish
  and review work.
job: organise-work
headline: Task list keeper
subhead: Tell it your tasks, and say when you finish one or are waiting on
  someone. It keeps one plain TASKS file with four sections (Active, Waiting On,
  Someday, Done) and moves items as you report. You get a current file, a review
  of stuck work and an optional task board.
explain: |
  One plain TASKS file that stays current as you add, finish and review your work; you know what is active, waiting and can wait.

  The file has four sections: Active, Waiting On, Someday and Done. When you say you finished something, it moves to Done. When you add a task, it goes in the right place with context such as who you are waiting on. You and the AI can both edit the file, and it is kept in your working folder. A visual board can read the same file. You can ask for a review of open items any time.
when:
  - Your to-do list lives in five apps and you trust none.
  - You keep forgetting what you are waiting on from other people.
  - You want to say "done with the invoice" and have it updated.
  - You need a weekly check of what is stuck.
  - You want tasks the AI can see while it works with you.
you_give:
  - Tasks in your own words
  - Updates as you finish things
  - Who or what you are waiting on (optional)
you_get:
  - A TASKS file with four clear sections
  - Items moved and updated as you report
  - A review of open and stuck work
  - An optional visual task board
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read and write files.
