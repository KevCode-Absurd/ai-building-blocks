thinking: medium
thinking_why: It asks natural questions that expose gaps.
new_slug: teach-back-practice-partner
name: Teach-back practice partner
summary: Test your understanding by teaching an idea to your AI, which plays a curious beginner. Its questions show the gaps in what you know.
job: teach-and-train
headline: Teach-back practice partner
subhead: A way to find out what you do not really know. You explain an idea to your AI, which plays a curious beginner, and its honest questions show where your understanding is thin.
explain: |
  A way to find out what you do not really know. You explain an idea to your AI, which plays a curious beginner, and its honest questions show where your understanding is thin.

  Teaching forces you to organise an idea and say it in your own words. The AI stays in the role of a novice peer. It does not correct you at once. It asks the kind of questions a beginner would, such as why a step happens or what a term means. When you stall or repeat a textbook line, it notices. At the end it lists the gaps and half understood parts so you know what to study next. The method comes from learning by teaching research.
when:
  - You think you understand a topic but freeze when asked to explain it.
  - You are revising for an exam and want to test yourself actively.
  - You want to find the weak spots in a concept before a presentation.
  - Re-reading notes is no longer helping.
  - You need a practice listener who never gets bored.
not_for:
  - "You want to learn a calculation or code routine: work through worked examples instead, since this method suits ideas better than step-by-step skills."
  - "You have not studied the topic yet: read or watch a lesson first, because a beginner AI cannot teach you the basics."
  - "You want the AI to explain the idea to you: ask your AI for a plain explanation instead."
you_give:
  - The concept you will teach
  - Your course and level
  - What you already feel sure of (optional)
you_get:
  - A beginner who asks real questions
  - A list of gaps shown by your answers
  - Parts you explained well
  - A short plan for what to revisit
how_to_use:
  - Open a new chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the system prompt from the skill file into the chat.
  - Type the idea you want to teach and your course and level. Add what you feel sure of if you like.
  - Explain the idea in your own words. Answer each question the beginner asks, and do not look at your notes.
  - Read the gap list at the end. Study those parts, then teach the idea again.
  - Next, pair the gap list with the Explain-first interrogator or the Transfer bridge.
output_sample:
  input:
    - The idea you will teach
    - Your course and level
    - How well you think you know it (optional)
  output:
    - name: Beginner questions
      contains: Natural questions from a curious peer, asked one at a time as you explain, such as why a step happens.
    - name: Gap list
      contains: The places where you stalled, repeated a textbook line, or left a term unexplained.
    - name: Well explained parts
      contains: The points you made clearly, so you know what you can already trust.
    - name: Reflection
      contains: A short prompt asking you to think about what felt hard to explain.
    - name: What to revisit
      contains: A short plan for what to study next, based on the gaps.
