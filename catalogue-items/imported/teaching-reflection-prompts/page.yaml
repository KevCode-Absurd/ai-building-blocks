thinking: low
thinking_why: It writes prompts from one clear situation.
new_slug: teaching-reflection-prompts
name: Teaching reflection prompt writer
summary: Get teaching reflection prompts written for one lesson you taught. They take you from what happened to why, and to one small change to try.
job: teach-and-train
headline: Teaching reflection prompt writer
subhead: Tell your AI about one lesson or challenge. It writes questions for that exact lesson. They lead you from what happened to why, and to what you will change. Generic prompts like "how did it go?" get a shrug. These do not.
explain: |
  Questions written for the exact lesson you taught, that take you from what happened to why it happened and what to change. Generic prompts like "how did it go?" get a shrug. These get insight you can use next week.

  You describe the experience and what you want to learn. The skill builds a sequence in layers. First it asks you to describe the event. Then it asks you to analyse causes. Then it asks you to question your own assumptions. It also invites you to see the lesson through students' eyes and a colleague's. The sequence always ends with a small action to try, since reflection that changes nothing is only worry. The length fits the time you have.
when:
  - A group activity went badly and you do not know why.
  - You want to reflect on a lesson but a blank page stops you.
  - You are keeping a reflective log for a course or appraisal.
  - You have ten minutes and want a short, focused set of prompts.
not_for:
  - "You need a formal appraisal judgement of your teaching: ask your line manager or an appraiser, since this tool only writes questions."
  - "You want to reflect on a student's personal situation: follow your school's safeguarding route instead."
  - "You want a coaching chat with a colleague: use the instructional-coaching-conversation-guide, which is not on this site yet."
you_give:
  - What happened in the lesson or event
  - What you want to understand from it
  - How you felt about it (optional)
  - Your subject and how long you have taught (optional)
  - How much time you have (optional)
you_get:
  - "Questions in four layers: describe, analyse, question your assumptions, act"
  - Prompts that show the lesson through your students' eyes and a colleague's
  - One small action to try next
  - A short five-minute version
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the block under the "Prompt" heading of the skill file into the chat. Replace {{teaching_experience}}, {{reflection_purpose}} and the other {{...}} fields with your own words. The skill file says optional fields are "injected by context engine"; in a normal chat nothing fills them, so type them yourself or delete those lines.
  - Describe the lesson in a few sentences. Say what you want to understand.
  - Add how you felt and how much time you have, if you like. If you only have five minutes, ask for the Quick Reflection Option instead of the full set of prompts.
  - Answer the questions in a journal or out loud. Start with the first layer and work down.
  - Check any named research against the source before you quote it to colleagues or in an appraisal log. The example's claim about group-work research (Johnson & Johnson, Mercer) gives no source details, so look it up first.
  - Next, take the "what will I do differently" answer into the Lesson study cycle planner to try the change with a colleague.
  - This is Gareth Manning's skill, copied as it is under CC BY-SA 4.0. If you share it or a changed version, keep his credit and use the same licence.
output_sample:
  input:
    - What happened in the lesson or event
    - What you want to learn from it
    - How you felt about it (optional)
    - Your subject and how long you have taught (optional)
    - How much time you have, such as 5 minutes or a longer journal entry (optional)
  output:
    - name: "Layer 1: Description"
      contains: Questions that help you say what happened, step by step, before you judge it.
    - name: "Layer 2: Analysis"
      contains: Questions that look for the causes of what happened, and how it looked to students and a colleague.
    - name: "Layer 3: Critical Reflection"
      contains: Questions that test the beliefs and assumptions you brought to the lesson.
    - name: "Layer 4: Action"
      contains: Questions that lead to one small change to try in your next lesson.
    - name: Quick Reflection Option
      contains: A short set of prompts for when you have about five minutes.
