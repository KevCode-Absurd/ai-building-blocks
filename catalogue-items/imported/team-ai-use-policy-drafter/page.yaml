thinking: medium
thinking_why: It adapts published policies to your setting.
new_slug: team-ai-use-policy-drafter
name: Team AI use policy drafter
summary: Draft a team AI use policy from public model policies. Tell it how your team uses AI and get a first draft ready for a lawyer to review.
job: check-contracts
headline: Team AI use policy drafter
subhead: Describe how your team uses AI. Get a first-draft AI use policy based on public model policies. Have a lawyer review it before anyone adopts it.
explain: |
  A first draft of your team's AI use policy, built from published model policies and current guidance, ready to take to the person who decides.

  The skill runs a short interview about which sections you need, who will read the policy and where AI is used. It then searches for current public sources and drafts each section from them. Every choice point is marked for review, with open questions at the end of each section. The draft carries a header saying it is for internal legal review, a list of sources and an adoption checklist. Not legal advice, so have a lawyer review it.
when:
  - Your team uses AI every day and nothing is written down.
  - Your current policy is old and ignores recent laws.
  - You need something to show your boss or board on Monday.
  - You want to see what comparable organisations put in their policies.
  - You must decide which AI tools staff may use with client data.
not_for:
  - "You need legal advice or a final policy: ask a lawyer, and use this draft only as the starting point."
  - "You already have a policy in force and it works: keep it, and ask your lawyer for a light review instead."
  - "You have no lawyer or senior person to review the draft: get one first, because the draft is not ready to adopt alone."
you_give:
  - How your team uses AI today
  - Who the policy is for
  - Your location and industry
  - An existing policy (optional)
you_get:
  - A draft AI use policy
  - Review flags on each choice
  - A list of sources used
  - An adoption checklist and next steps
how_to_use:
  - Use an AI that can search the web. The skill needs it to find current public AI policies.
  - Open the skill folder and paste the skill text into a new chat, or upload the folder if your AI takes files.
  - Paste a short company profile: whether you build or use AI, your countries and sector, who approves policy, and any policy you already have. Or answer the setup interview in the setup-interview folder.
  - "Answer the short interview: which sections you need, who reads the policy, and where your team uses AI."
  - Read the draft and check every review flag. Answer the open questions at the end of each section.
  - Send the draft and the sources list to your lawyer before anyone adopts it.
output_sample:
  input:
    - How your team uses AI today
    - Who will read the policy
    - Which sections you need
    - Your location and industry
    - Your current policy (optional)
  prerequisites:
    - An AI that can search the web for current public policies
    - A short company profile that you paste in or build with the setup interview
  output:
    - name: Draft header
      contains: A line stating the draft is for internal legal review and not for distribution.
    - name: Sources block
      contains: The public model policies and guidance the draft was built from, listed at the top.
    - name: Executive summary
      contains: A short plain summary of what the policy covers and the main choices to make.
    - name: Policy sections
      contains: Each section you picked, drafted from the sources, with review flags on every choice and open questions at the end.
    - name: Adoption checklist
      contains: The steps to take before the policy goes live.
    - name: Reviewer note
      contains: A note for the lawyer on what to check and what the draft cannot settle.
    - name: Next-steps decision tree
      contains: Suggested paths for what to do once the draft is reviewed.
