thinking: medium
thinking_why: It rolls up many deals and picks what needs help.
new_slug: team-pipeline-roll-up-writer
name: Team pipeline roll-up writer
summary: Ask for your team's pipeline. Get a view by rep and stage, at-risk deals and coaching points.
job: lead-people
headline: Team pipeline roll-up writer
subhead: Ask for your team's pipeline. Get a view by rep and stage, at-risk deals and coaching points.
explain: |
  One view of your team's sales pipeline by rep and stage, with at-risk deals marked and a short list of where to spend coaching time. It is ready for a forecast call or a 1:1.

  The skill reads your CRM, or an exported pipeline file if you have no connection. It uses the CRM's own field and stage names and links each record it cites. It totals open pipeline and closed won for each rep, then flags stalled deals, deals past their close date and slipped amounts. It checks what reps have already flagged in team chat so you do not repeat it. If the scope is unclear, it asks and does not widen to the whole company.
when:
  - You have a forecast call in an hour and need numbers by rep.
  - You want to know which deals are quietly stalling.
  - You prep 1:1s and need a coaching point for each rep.
  - A rep's pipeline looks big but thin and you want proof.
  - You need a quick team view without opening twenty CRM reports.
you_give:
  - Your team or the reps to include
  - The period (default is this quarter)
  - CRM access or an exported pipeline file
  - Chat access for flagged deals (optional)
you_get:
  - Pipeline by rep and by stage
  - At-risk and stalled deals
  - Closed won against target
  - Coaching points per rep
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read your CRM.
