thinking_why: It weighs code and change history to rank what to fix.
new_slug: tech-debt-prioritiser
name: Tech debt prioritiser
summary: Point it at your code. Get a ranked list of debt that slows you down,
  with cost and small fixes.
job: build-software
headline: Tech debt prioritiser
subhead: A ranked list of the code problems that slow your team most, with what
  each costs and a small fix you can start this week.
explain: |
  A ranked list of the code problems that slow your team most, with what each costs and a small fix you can start this week. You stop arguing about what is messy and see what is worth fixing first.

  The skill looks at the real repository: code that changes often, repeated bugs, tangled modules, thin tests and outdated packages. It sorts the debt by type, estimates cost in lost time or risk, and ranks items by impact against effort. Where cost data is missing, it says unknown instead of making up numbers. It then proposes fixes in small steps, with quick wins first, and suggests how to fit them around feature work. It reviews and plans but changes no code.
when:
  - Your team says the codebase is slowing everyone down but cannot say where.
  - You need to defend clean-up time to a manager with specifics.
  - You inherited old code and want to know where to start.
  - Bugs keep appearing in the same files.
  - You are planning a sprint and want one useful clean-up item.
you_give:
  - Access to the repository
  - Recent bug or incident history (optional)
  - Team size and rough cost of an engineer hour (optional)
  - Areas you already worry about (optional)
you_get:
  - A ranked debt list
  - Cost and effort per item
  - Quick wins marked
  - A staged fix plan
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read your project files and history.
