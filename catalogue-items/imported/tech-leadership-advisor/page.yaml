thinking_why: It applies known engineering frameworks to your case.
new_slug: tech-leadership-advisor
name: Tech leadership advisor
summary: Describe your tech team and stack. Get a tech debt review, a hiring
  plan and architecture calls.
job: build-software
headline: Tech leadership advisor
subhead: Describe your tech team and stack. Get a tech debt review, a hiring
  plan and architecture calls. Bring a description of your team and stack. Use
  the result to plan your next step.
explain: |
  The kind of advice a seasoned CTO gives: a view of your tech debt, a hiring and growth plan for engineering, and clear calls on architecture, build versus buy and cloud choices. It suits founders and leads who have no technical peer to ask.

  You describe the team, the stack and the pressure you are under. The skill rates technical debt by severity and lays out a repayment plan, with management as the goal, not elimination. It models team growth and cost, tracks engineering health with DORA style measures, and applies a build-versus-buy rule that defaults to buying unless the thing is your core product. Optional Python scripts calculate debt and team scaling figures.
when:
  - You are a founder with no CTO and need a second opinion on tech choices.
  - You must decide whether to build or buy a new capability.
  - You are planning how many engineers to hire next year and what it costs.
  - Deployments are slow or risky and you want measures to improve.
  - A cloud migration is on the table and you need to weigh it.
you_give:
  - A description of your team and stack
  - Your business goals and constraints
  - Current pain points
  - Team size and budget (optional)
you_get:
  - A tech debt assessment and plan
  - A team growth and cost model
  - Build versus buy recommendations
  - Engineering health measures to track
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
