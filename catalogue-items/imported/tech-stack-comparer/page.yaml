thinking: medium
thinking_why: It weighs several factors against your needs.
new_slug: tech-stack-comparer
name: Tech stack comparer
summary: Name the options. Get a side-by-side of cost, security, team fit and
  long-term support, with a pick.
job: plan-strategy
headline: Tech stack comparer
subhead: Two or more technologies compared side by side on cost, security, team
  fit and long-term support, ending with a pick and the reasons. You choose a
  framework or cloud with evidence, not on whichever blog post you read last.
explain: |
  Two or more technologies compared side by side on cost, security, team fit and long-term support, ending with a pick and the reasons. You choose a framework or cloud with evidence, not on whichever blog post you read last.

  The skill scores each option against weights you set. It calculates a five-year total cost that includes hidden costs such as hiring, training and migration. It checks community health, using signals like repository activity, package adoption and community size, and looks at known vulnerabilities and compliance readiness. For cloud choices it compares AWS, Azure and GCP for your workload. It can also estimate effort and risk for moving from one stack to another.
when:
  - Your team is split between two frameworks and needs a tiebreaker.
  - You must choose a cloud provider for a new workload.
  - You are worried a library is dying and want to check.
  - A manager asks what migration would really cost.
  - You need a written comparison to justify a decision.
you_give:
  - The options to compare
  - Your workload or use case
  - What matters most (cost, speed, security)
  - Team skills and size (optional)
you_get:
  - A weighted comparison table
  - A five-year cost estimate
  - Security and community notes
  - A recommendation with reasons
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
not_for:
  - "The choice is trivial or already made. If the tools are alike or a manager has set one, skip the analysis."
  - "You are comparing vendor quotes or a contract renewal. Use the Vendor comparison writer."
  - "You are settling a disputed technical choice by sourcing each claim. Use the Technical decision evidence mapper."
output_sample:
  input:
    - The two or more options, such as React and Vue, or two cloud providers
    - Your workload or use case
    - What matters most, with weights if you have them
    - Team size and skills, hosting spend and expected growth (optional)
    - Codebase size, if you are weighing a move (optional)
  prerequisites:
    - Python 3 if you want the bundled scripts to run the numbers (optional)
  output:
    - name: Weighted comparison
      contains: Each option scored against your priorities, side by side.
    - name: Five-year cost
      contains: Total cost over five years, including hiring, training and migration.
    - name: Community health
      contains: Signs of life such as repository activity, package use and community size.
    - name: Security notes
      contains: Known weak spots and how ready each option is for compliance rules you name.
    - name: Migration estimate
      contains: Effort, risk and timeline for moving between stacks, if asked.
    - name: Recommendation
      contains: A pick with reasons and a confidence level of high, medium or low.
