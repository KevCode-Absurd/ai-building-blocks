new_slug: technical-capacity-cost-planner
name: Plan service capacity and cost
summary: Plan service capacity and cost from your traffic, tested limits and spend. You get a scaling plan and a list of what still needs a load test.
job: build-software
headline: Plan service capacity and cost
subhead: Bring traffic and cost records. Model demand, headroom and spend, then set checks for the next scale step.
explain: Bring traffic and cost records. Model demand, headroom and spend, then set checks for the next scale step.
when:
  - You want to plan service capacity and cost.
not_for:
  - "You need a profit and loss statement, funding scenarios or SaaS metrics: use a finance tool or your accountant."
  - "You need servers or cloud resources set up: ask your platform or DevOps engineer."
  - "You want general tips to cut your cloud bill: this plan will not give fixed savings rates or one target for all."
you_give:
  - Traffic/growth/peak estimates, current resources and measured performance.
  - Aligned cost records, budget, reliability limits and accountable owners.
you_get:
  - A demand-to-capacity projection with triggers and unit-cost calculations.
  - A load/soak evidence plan and an owned budget-versus-reliability decision.
how_to_use:
  - Gather your traffic history, current resource counts, and a cost export for the same period.
  - Add your reliability targets, budget cap and the names of who owns each decision.
  - Open Claude, ChatGPT or Gemini and paste in the skill. No code or paid tool is needed.
  - Paste your inputs and ask for a capacity and cost plan.
  - Check the flagged gaps. Any claim marked as untested needs a real load test before you rely on it.
output_sample:
  input:
    - Your traffic history, growth estimate and peak events
    - Your current resource counts and measured performance
    - Your cost records for the same period as the traffic
    - Your reliability targets, budget cap and named owners (optional)
  output:
    - name: Demand and capacity model
      contains: Traffic mapped to resource limits, with the headroom left and the assumptions behind it.
    - name: Unit cost
      contains: Cost per unit of demand, with periods and scope matched, and skew across customers checked where it matters.
    - name: Budget and quota controls
      contains: Spend thresholds and quota or rate limit rules tied to the capacity triggers.
    - name: Load and soak test plan
      contains: The tests needed to back each capacity claim, and which claims have no evidence yet.
    - name: Cost versus reliability decision
      contains: The tradeoff laid out for the named owner, with open items flagged.
    - name: Scenarios
      contains: Growth, peak, degraded and cost-constrained cases run through the same model.
how_it_works:
  - title: Model demand and headroom
    text: Map request or storage demand to resource limits using justified utilization and scaling assumptions.
  - title: Calculate comparable costs
    text: Align periods, scope and allocation methods; inspect tenant distributions when averages hide skew.
  - title: Gate the capacity claim
    text: Define representative load/soak acceptance evidence and escalate unresolved budget or reliability tradeoffs.
thinking: medium
thinking_why: It weighs your evidence and follows a specific method.
