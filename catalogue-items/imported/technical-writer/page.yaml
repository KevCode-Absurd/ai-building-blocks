thinking: medium
thinking_why: It must understand the topic and the reader.
new_slug: technical-writer
name: Technical writer
summary: Give it a feature or API. Get clear docs, guides, tutorials or
  changelogs for your readers.
job: write-and-tell-stories
headline: Technical writer
subhead: Give it a feature or API. Get clear docs, guides, tutorials or
  changelogs for your readers. Bring the feature, API or tool to document. Use
  the result to plan your next step.
explain: |
  Clear documentation your readers can follow: API references, user guides, tutorials, changelogs or decision records, written for the right audience. People get the answer and run the example without writing to you.

  The skill starts by fixing the document type and who reads it. It gathers your sources, such as code, schemas, design notes and commit history. It plans an outline that suits the format. API docs use one template per endpoint, and tutorials move step by step. It writes in active voice and short sentences, puts the key point first and includes complete examples. It adds links between pages and next steps, then checks every example and path against the real code.
when:
  - You shipped a feature and nobody knows how to use it.
  - Your API has no reference beyond the code.
  - You need release notes people will actually read.
  - New users keep asking the same setup questions.
  - You must record why a technical decision was made.
you_give:
  - The feature, API or tool to document
  - Document type wanted
  - Who will read it
  - Source material such as code or specs
you_get:
  - A structured document in the right format
  - Runnable examples
  - Links and next steps
  - A list of facts to confirm
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
