thinking: medium
thinking_why: It must understand the topic and the reader.
new_slug: technical-writer
name: Technical writer
summary: Write technical documentation your readers can follow. Give it a feature or API. You get an API reference, guide, tutorial or changelog.
job: write-and-tell-stories
headline: Technical writer
subhead: Give it a feature or API. Get clear docs, guides, tutorials or changelogs for your readers. Bring the feature, API or tool to document. You get a draft to check with your team before you publish.
explain: |
  Clear documentation your readers can follow: API references, user guides, tutorials, changelogs or decision records, written for the right audience. People get the answer and run the example without writing to you.

  The skill starts by fixing the document type and who reads it. It gathers your sources, such as code, schemas, design notes and commit history. It plans an outline that suits the format. API docs use one template per endpoint, and tutorials move step by step. It writes in active voice and short sentences, puts the key point first and includes complete examples. It adds links between pages and next steps, then compares every example and path with the code you gave it and lists what it could not check.

  Licence: MIT, as the LICENSE file in this item says. Credit goes to the original author.
when:
  - You shipped a feature and nobody knows how to use it.
  - Your API has no reference beyond the code.
  - You need release notes people will actually read.
  - New users keep asking the same setup questions.
  - You must record why a technical decision was made.
not_for:
  - "You need marketing copy or a sales page: write it with a copywriter or a marketing prompt, since this skill works from a spec or code."
  - "You have no product, API or codebase to document, such as a business with no software: this skill is for teams that ship software. Use a how-to or SOP writer instead."
  - "You want release notes from git commits: use the release notes writer. For a machine-readable API file, use the API spec writer."
  - "You need a help article for end users and have no spec or source material: ask your support lead for the facts first."
  - "You need the examples tested: run them yourself or ask an engineer, because your AI cannot run code unless you give it a way to."
you_give:
  - The feature, API or tool to document
  - Document type wanted
  - Who will read it
  - Source material such as code or specs
you_get:
  - A structured document in the right format
  - Runnable examples
  - Links and next steps
  - A list of facts to confirm
how_to_use:
  - "Before you start, gather: the feature, the reader and their skill level, the document type, and the code or schema. For an API, also gather the endpoint list, the sign-in method and the version number. Your AI only sees what you give it."
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Say which document you want and who will read it, for example an API reference for outside developers.
  - Paste your source material, such as code, a schema or design notes. Attach files if your AI accepts them.
  - Read the result and the list of facts to confirm. Ask your team to answer them.
  - Run every code example yourself. Your AI can compare docs with the code you gave it, but it cannot run them unless you give it a way to.
  - Publish the document. Link the reference from your getting-started tutorial, or use the changelog as the base for release notes.
next: [release-notes-writer, developer-docs-writer]
output_sample:
  input:
    - The feature, API or tool to document
    - The document type, such as API reference, tutorial, user guide, changelog, decision record or README
    - Who will read it, and their skill level
    - Your source material, such as code, an API schema or design notes (optional)
    - The format you want, such as Markdown (optional)
  prerequisites:
    - Source material you can paste or attach, so the AI does not guess
    - An engineer or tester to run the code examples
  output:
    - name: Document outline
      contains: A structure that fits the document type, such as one template per endpoint or a step-by-step tutorial.
    - name: Main document
      contains: The full text in short, active sentences, with the key point first and complete code examples.
    - name: Navigation and links
      contains: A contents list for long pages, links between related sections, and a Next steps section for tutorials.
    - name: Accuracy check
      contains: A comparison of paths, parameters and responses against the code or schema you gave.
    - name: Gaps and facts to confirm
      contains: Missing information and unclear behavior that someone on your team needs to confirm.
