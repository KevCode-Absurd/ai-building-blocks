job: hire-people
headline: Termination risk checker
subhead: Describe a planned firing. Get risk flags, severance and release points, and final pay timing. A first check, not legal advice.
explain: |
  A pre-decision check on a planned firing that catches the risky cases before the decision is final. You get risk flags, severance and release points, and when final pay is due, so you know whether to proceed or stop and ask for sign-off.

  The skill gathers the basic facts, then walks a checklist of high-risk flags, such as recent complaints, leave, protected status, age and timing. If a flag fires, it escalates and tells you not to proceed without approval. It looks up rules for the employee's jurisdiction when you ask, with citations, and does not state the law from memory. It also covers severance, releases and final pay. A first check, not legal advice.
when:
  - You plan to let someone go and want to know the risks first.
  - The employee recently made a complaint or took leave.
  - You need to know when final pay is due in their state or country.
  - You are offering severance and want the release points covered.
  - You must decide whether this needs a lawyer before you act.
you_give:
  - Facts about the employee and the reason
  - Location of the employee
  - Recent complaints, leave or reviews
  - Planned severance (optional)
you_get:
  - High-risk flags checked one by one
  - An escalation recommendation
  - Final pay timing
  - Severance and release points
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can search the web for current local rules.
  - Where the skill points to /employment-legal:cold-start-interview, use the setup-interview folder inside it. We copied it in so the skill works on its own.
