thinking: low
thinking_why: It generates data from your schema by clear rules.
new_slug: test-data-seeder
name: Test data seeder
summary: Get a test data seeder script that fills your database with realistic, repeatable rows. Give it your schema. Safe to run twice.
job: test-and-fix-code
headline: Test data seeder
subhead: Describe your tables. Get realistic, repeatable test data loaded for development and staging. Bring your schema or migration files. You get a script you commit next to your migrations and run on a test database.
explain: |
  Realistic test data loaded into your database, the same every time you run it, so development and staging stop depending on empty tables or a copy of real customers. Everything fits your schema and keeps its links intact.

  The skill reads your tables, columns, constraints and foreign keys. It plans the data by purpose: fixed seeds for repeatable tests, or random fake data for demos. It writes a seed script in your language, using tools like Faker or your framework's seeders, and loads parent tables before children. The script is safe to run twice, using upserts or clean-and-reload. It offers small, medium and large profiles, then checks row counts and that all references point to real rows.

  Licence: MIT, as the LICENSE file in this item says. Credit goes to Burhan Sebin.
when:
  - Your development database is empty and the app looks broken.
  - You need the same test data in every environment.
  - You want a large dataset to test slow queries.
  - You cannot use real customer data for testing.
  - A seed script keeps failing on foreign keys.
not_for:
  - "You want to copy real customer data into testing: use a masked copy made by your database admin, never raw production rows."
  - "You only need fixed reference data such as country lists or roles: use your migration tool or fixtures."
  - "You want to fill a live production database: stop, and use a staging copy instead."
you_give:
  - Your schema or migration files
  - Database and language you use
  - Environment and data size wanted
  - Rules about realistic values (optional)
you_get:
  - A seed script that can be re-run safely
  - Small, medium and large data profiles
  - Data that respects your constraints
  - A check of row counts and links
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Paste your schema or migration files. Say which database and language you use.
  - "Say which environment this is for and how much data you want: small, medium or large."
  - Read the seed script. Check it refuses to run unless the environment is set to a test value, and that it reads the database login from environment variables. Never commit a password to your repo.
  - Run it on a test database. Your AI can do this only if it can run code. Otherwise run it yourself.
  - Check the row counts and the link check. Then commit the script next to your migrations.
  - Next, run the seed in your CI against a throwaway test database before the test suite. If tests then fail, use the Failing test fixer.
  - If you want a staging copy of production data, have the anonymising checked first. Production rows hold personal data, so never copy them raw into a test database.
output_sample:
  input:
    - Your schema or migration files
    - The database and language you use
    - The environment and data size you want
    - Rules for realistic values (optional)
  prerequisites:
    - An AI that can run code and reach your test database, if you want it to load the data for you
  output:
    - name: Seed script
      contains: Code in your language that adds rows to each table, parent tables first, and can be run twice safely.
    - name: Data profiles
      contains: Small, medium and large settings you pick with an environment variable or a command-line option.
    - name: Row-count table
      contains: How many rows were added to each table after the run.
    - name: Link check result
      contains: Whether every foreign key points to a row that exists.
