thinking: medium
thinking_why: It follows a mapping table between frameworks.
new_slug: test-framework-migrator
name: Test framework migrator
summary: Convert Selenium, Playwright, Puppeteer or Cypress tests to another framework. Get the new files and a list of what needs a manual check.
job: test-and-fix-code
headline: Test framework migrator
subhead: Give it Selenium, Playwright, Puppeteer or Cypress tests. Get them converted to the framework you choose, with a list of anything that needs a manual check.
explain: |
  Your browser tests converted from one framework to another, Selenium, Playwright, Puppeteer or Cypress, so you can switch tools without rewriting every test by hand.

  The skill first detects the source framework from your code, looking for signs like By.id, cy.get or page.goto. It confirms the target. If either is unclear, it asks. It then maps the old calls to the new ones: locators, waits, assertions, setup and teardown. It replaces explicit waits with the target's own waiting model, and notes features with no direct match so you can decide what to do. The result is converted files with a list of anything that needs manual review.
when:
  - Your team is moving from Selenium to Playwright.
  - Cypress tests must run in a different tool for cross-browser coverage.
  - You have hundreds of tests and cannot rewrite them manually.
  - Flaky waits in an old suite are the reason to switch.
  - You want to know what will not convert cleanly before committing.
not_for:
  - You have one small test. Rewrite it by hand, or read the docs of the framework you are moving to.
  - Your tests stay in the same framework. Keep them as they are, or ask your AI for a plain code review.
  - Your pair is not supported, such as WebdriverIO. Ask for the closest supported move, then adjust by hand.
you_give:
  - The existing test files
  - The framework you want
  - Language you use (optional)
  - Project setup details (optional)
you_get:
  - Converted test files
  - A list of changed patterns
  - Items needing manual review
  - Notes on setup differences
how_to_use:
  - Open your AI tool and paste the skill instructions. If it can read files, point it at your test folder.
  - Paste or attach the test files you want to convert.
  - Say which framework you use now and which one you want. Add your language if it matters.
  - Check the list of items for manual review first. Then run the converted tests in your own project.
  - The per-pair guide files live in the source repo, not in this folder. Your AI needs web access to read them. If it has none, open the guide for your pair on GitHub and paste it in. Without a guide, treat every conversion as a draft.
output_sample:
  input:
    - Your existing test files
    - The framework you want to move to
    - The language you use (optional)
    - Your project setup details (optional)
  prerequisites:
    - An AI that can read your project files, or a chat where you can paste the test code
    - Access to the skill's per-pair guide files, which are fetched from the source repo and are not in this folder
  output:
    - name: Converted test files
      contains: Your tests rewritten in the target framework, with locators, waits, actions and assertions mapped across.
    - name: Changed patterns
      contains: A list of the old calls that were swapped and what they became.
    - name: Manual review list
      contains: A table with columns for the old pattern, the new pattern, the reason and the risk level, for features with no direct match in the target.
    - name: Setup and lifecycle notes
      contains: How start-up and clean-up differ in the target, such as driver versus page.
