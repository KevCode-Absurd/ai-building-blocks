thinking: high
thinking_why: It runs many code variants and judges which results matter.
new_slug: test-suite-auditor
name: Test suite auditor
summary: Find weak, flaky, slow and useless tests in your Python project. This test suite audit uses mutation testing to show if your tests catch broken code.
job: test-and-fix-code
headline: Test suite auditor
subhead: A verdict on whether your Python tests would actually catch broken code, with the weak, flaky, slow and useless tests listed. A passing suite stops being a comfort and becomes a number you can trust.
explain: |
  Before you install: the runner is downloaded from GitHub with uvx and runs code on your computer, with access to your project files. Read it first and use it only in a project you trust.

  A pinned runner measures the suite. The key check is mutation testing: it makes small deliberate breaks in your code and sees whether any test fails. Tests that never catch a break are weak. It also reruns tests to find flaky ones, times each test to find slow ones, and spots tests that duplicate others without adding detection. Quick mode runs one baseline with timings and coverage and no mutants. Deep mode adds the mutation checks. The skill reports only and changes none of your tests. It needs Python and pytest.

  Licence: the author's own file header (Tim Richardson) says MIT, and that covers this skill text. sickn33's LICENSE-CONTENT file (CC BY 4.0) applies only where no more specific upstream notice exists. Keep the MIT notice and credit Tim Richardson and sickn33.
when:
  - Your tests pass but bugs still reach production.
  - The test run takes so long that people skip it.
  - Some tests fail at random and you cannot say which.
  - You want to cut tests that add cost but no safety.
  - You let AI write tests and need to check how useful they are.
not_for:
  - Your project is not written in Python or does not use pytest. Use the test tools for your own language, or ask a developer.
  - You only want to check one code change. Use the agentic-verify skill from the same author, which is not in this library yet. It runs every mutant of the changed lines. Until then, ask your AI to review that one change by hand.
  - You want your tests fixed or deleted for you. This audit only reports, so ask your AI for a specific change after you read the report.
you_give:
  - Your Python project
  - pytest set up
  - "Mode: quick or deep"
  - Time you can spend on a run (optional)
you_get:
  - Mutation results showing what tests miss
  - A list of flaky tests
  - A list of slow tests
  - Tests that add no detection
how_to_use:
  - "Install first: Python 3.12 or newer, pytest and pytest-cov must already be in your project (pip install pytest pytest-cov). Add pytest-randomly too if you want order checks."
  - "Risk: the runner is downloaded from GitHub with uvx and runs code on your computer, with access to your project files. Read it first, and run it only in a project you trust. It is fetched at tag v0.3.0, commit 07608b3. Check for a newer tag before you rely on it, and re-read the code if you change the tag."
  - Before you run it, make sure your project has a clean git state or a backup. The runner works in a copy, but it writes a .test-suite-audit/ folder in your project. Add that folder to .gitignore.
  - Open your AI in a tool that can run code and read your project files. Paste this skill and say quick or deep.
  - "Quick takes about 5 minutes. Deep takes 30 minutes by default and runs the mutation checks. Say how long you can spare. These are budgets, not promises. Bigger projects need more: in the author's tests, two projects of about 3,600 and 5,000 lines needed more than 30 minutes."
  - Read report.md first. A surviving mutant is a gap to look at, not proof of a bug.
  - If the deep audit lists tests to remove, ask for the removal check before you delete anything.
  - Next, replay one surviving mutant with the replay command in the report. Then ask your AI to draft a test that catches it, and add that test yourself if it looks right.
output_sample:
  input:
    - Your Python project folder
    - "Mode: quick or deep"
    - Time budget in minutes (optional)
    - A test-suite-audit.toml settings file (optional)
  prerequisites:
    - An AI that can run code and read your project files
    - Python 3.12 or newer and pytest in your project
    - The pytest-cov add-on in your project
    - The pytest-randomly add-on, if you want order checks
  output:
    - name: report.md
      contains: A readable summary of what the audit found, with each finding labelled and the next step to check it.
    - name: report.json
      contains: The full evidence behind every finding, including mutant results, timings and coverage.
    - name: Does it catch broken code?
      contains: Surviving mutants, weak tests, code no test covers, and whether property-based tests exist.
    - name: Can an agent run it on every change?
      contains: How long the suite takes, the slowest tests, and any flaky or order-dependent tests.
    - name: Is it bloated?
      contains: Tests proposed for removal, whether the removal check refuted them, and the time they would save.
    - name: Reproduction command
      contains: A command to replay at least one mutant finding so you can see it yourself.
