thinking: high
thinking_why: It runs many code variants and judges which results matter.
new_slug: test-suite-auditor
name: Test suite auditor
summary: Point it at a Python project. Get a list of weak, flaky, slow and useless tests, checked by mutation.
job: test-and-fix-code
headline: Test suite auditor
subhead: Point it at a Python project. Get a list of weak, flaky, slow and useless tests, checked by mutation.
explain: |
  A verdict on whether your Python tests would actually catch broken code, with the weak, flaky, slow and useless tests listed. A passing suite stops being a comfort and becomes a number you can trust.

  A pinned runner measures the suite. The key check is mutation testing: it makes small deliberate breaks in your code and sees whether any test fails. Tests that never catch a break are weak. It also reruns tests to find flaky ones, times each test to find slow ones, and spots tests that duplicate others without adding detection. Quick mode is a fast sample and deep mode is thorough. The skill reports only and changes none of your tests. It needs Python and pytest.
when:
  - Your tests pass but bugs still reach production.
  - The test run takes so long that people skip it.
  - Some tests fail at random and you cannot say which.
  - You want to prune tests that add cost but no safety.
  - You let AI write tests and need to check their value.
you_give:
  - Your Python project
  - pytest set up
  - "Mode: quick or deep"
  - Time you can spend on a run (optional)
you_get:
  - Mutation results showing what tests miss
  - A list of flaky tests
  - A list of slow tests
  - Tests that add no detection
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and read your project files.
