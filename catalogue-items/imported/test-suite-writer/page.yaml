thinking: medium
thinking_why: It follows test patterns but must understand your code.
new_slug: test-suite-writer
name: Test suite writer
summary: Point it at your code. Get unit, integration and end-to-end tests, run with a coverage report.
job: test-and-fix-code
headline: Test suite writer
subhead: Point it at your code. Get unit, integration and end-to-end tests, run with a coverage report.
explain: |
  Unit, integration and end-to-end tests written for your code, run for real, and followed by a coverage report that shows what is still unchecked. You finish with tests that pass and a clear view of the remaining holes.

  The skill reads the target module and maps its functions, classes and outside calls. For each public piece it lists cases: normal input, boundary values, bad or null input and error paths. It writes tests in your existing framework, such as pytest, Jest, Vitest, JUnit, Go testing or cargo test, with clear names. It runs them, reads failures, and then runs again with coverage on. Uncovered lines are turned into extra case suggestions, and it flags code that is hard to test.
when:
  - You have working code with no tests.
  - You are about to refactor and want a safety net first.
  - Your coverage is low in a few critical files.
  - You want edge cases you have not thought of.
  - A new teammate needs tests that explain how a module behaves.
you_give:
  - The code or module to test
  - Your language and test framework
  - Coverage target (optional)
  - Critical behaviours to protect (optional)
you_get:
  - Unit, integration and end-to-end tests
  - Test run results
  - A coverage report
  - Suggestions for remaining gaps
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and read your project files.
