thinking: medium
thinking_why: It maps cases to tests, then reports results back.
new_slug: testrail-test-syncer
name: TestRail test syncer
summary: Turn your TestRail test cases into Playwright tests, then send pass or fail results back to a TestRail run. Needs a TestRail account and API key.
job: test-and-fix-code
headline: TestRail test syncer
subhead: Your test cases live in TestRail, your automated tests live in Playwright, and keeping them in step by hand is slow. This skill moves work both ways.
explain: |
  Your test cases live in TestRail, your automated tests live in Playwright, and keeping them in step by hand is slow. This skill moves work both ways. It pulls cases from a TestRail project and writes Playwright tests from their steps and expected results. It can also run your tests and push pass or fail results back to a test run.

  Each generated test carries its TestRail case ID, so results map to the right case. Imports are grouped by section, and you get a count of cases read and tests written. You need a TestRail account, an API key, and a connector set up in your own tools first.
when:
  - You have a TestRail suite and want Playwright tests built from it.
  - You ran an automated suite and need the results recorded in a TestRail run.
  - You want to see which TestRail cases have no automated test yet.
  - Your QA team writes cases in TestRail but your developers work in code.
not_for:
  - "Your team does not use TestRail: write the Playwright tests by hand, or export your cases from your own test tool."
  - "You want your AI to find and fix failing tests: use your AI's code help on the failing test, not this sync."
  - "You cannot set up a TestRail connector or run code: ask a developer to do the setup first, or copy cases by hand."
you_give:
  - TestRail address, user and API key
  - Project and suite ID
  - Your Playwright project
  - Run ID for pushing results (optional)
you_get:
  - Playwright test files grouped by section
  - Case IDs tagged on each test
  - Results sent to a TestRail run
  - A count of imported cases and written tests
how_to_use:
  - Check you have a TestRail account and an API key. Set your TestRail address, user email and API key as settings your AI can read.
  - Set up the TestRail connector once. A developer can do this. Take the integrations/testrail-mcp folder from the source repo, run npm install inside it, and add it to your AI tool's connector (MCP) settings. Then ask your AI to list its tools and check the testrail ones appear. Setting the keys alone is not enough.
  - Open your AI in your Playwright project. It must be able to run code and read your files.
  - Ask it to import your project and suite ID. Check the new tests and their case IDs.
  - To send results, give it a run ID. It runs your tests and pushes each result to that run.
  - Ask for a status report to see which TestRail cases still have no automated test. Write those as new Playwright tests next. You can also ask it to update a TestRail case from the steps in a Playwright test.
output_sample:
  input:
    - Your TestRail address, user email and API key
    - Your TestRail project ID and suite ID
    - Your Playwright project
    - A TestRail run ID, to send results back (optional)
  prerequisites:
    - A paid TestRail account and an API key
    - The TestRail connector installed and added by hand to your AI tool, as the plugin's CLAUDE.md describes
    - An AI that can run code and use your files
  output:
    - name: Playwright test files
      contains: One test per TestRail case, grouped by section, built from its title, steps and expected results.
    - name: Case ID annotation
      contains: A tag on each test that holds its TestRail case ID, so results reach the right case.
    - name: Results push
      contains: Pass, fail or skip for each tagged test, sent to your TestRail run, with the error message on a fail.
    - name: New test run
      contains: A TestRail run made from the case IDs found in your tests, with its run ID returned.
    - name: Sync status report
      contains: Counts of TestRail cases with and without tests, and tests with no TestRail ID.
    - name: Operation summary
      contains: Counts of cases imported and tests written, any errors or unmatched cases, and a link to the run.
