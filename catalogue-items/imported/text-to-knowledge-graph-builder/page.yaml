thinking: medium
thinking_why: It extracts entities and links with a set method.
new_slug: text-to-knowledge-graph-builder
name: Text-to-knowledge-graph builder
summary: Turn a long document into a knowledge graph. Paste your text and get the people, tools and links pulled out, plus a diagram you can paste.
job: think-and-decide
headline: Text-to-knowledge-graph builder
subhead: Paste a long document and get a map of who and what is in it and how they connect. Instead of rereading pages, you see a diagram of people, companies, tools and ideas, with labelled links between them.
explain: |
  Paste a long document and get a map of who and what is in it and how they connect. Instead of rereading pages, you see a diagram of people, companies, tools and ideas, with labelled links between them.

  The skill reads your text and lists each entity with its type. It then writes each link as a triple, such as Service A depends on Service B. Those triples come out as Cypher for Neo4j, JSON-LD or a simple CSV, plus a Mermaid diagram you can paste into a document. Last, it checks for orphan nodes and vague link names and tightens them. You can say which entity types to keep and how big the graph should be.
when:
  - You have a long report and want to see how its parts connect.
  - You need data for a graph database from plain text.
  - You want a diagram of a system described only in prose.
  - You are checking that a document does not leave important links unsaid.
not_for:
  - "You have a short passage you can read in a few minutes: just read it, or ask your AI for a plain summary."
  - "You need a table of numbers or a spreadsheet cleaned up: use a spreadsheet tool or ask a person who knows the data."
  - "You need facts checked against outside sources: use a search tool or a person, as this only maps what your text says."
you_give:
  - The text or documents
  - "Output format: Cypher, JSON-LD or Mermaid (optional)"
  - Entity types you care about (optional)
  - A size limit for the graph (optional)
you_get:
  - A table of entities and their types
  - Relationship triples
  - Graph data ready to load
  - A Mermaid diagram
  - A list of gaps found
how_to_use:
  - Open Claude, ChatGPT or Gemini and start a new chat.
  - Paste the skill instructions first. Then paste your text under them.
  - "Say which format you want: Cypher, JSON-LD, CSV or Mermaid. You can also name the entity types to keep."
  - For a long document, share it in parts of a few thousand words each. Your AI merges the parts and warns you if the graph gets too big to read (around 50 nodes).
  - Read the review notes. Fix wrong links, then ask your AI to expand any part you want.
  - To save Cypher, JSON-LD or CSV as files, use an AI that can run code. Otherwise copy the text from the chat.
  - Use the result. Load the Cypher into a Neo4j database, or paste the Mermaid block into a document tool that draws it.
output_sample:
  input:
    - Your text or documents
    - "The output format you want: Cypher, JSON-LD, CSV or Mermaid (optional)"
    - The entity types you care about (optional)
    - A size limit for the graph (optional)
  prerequisites:
    - An AI that can run code and save files, only if you want the graph data saved as files
    - A running Neo4j database, only if you want to load the Cypher. The chat route (table, Mermaid diagram) needs none
  output:
    - name: Entities
      contains: A table of each entity with its type and any notable details found in the text.
    - name: Relationships
      contains: Each link as a subject, link name and object, with the source sentence.
    - name: Schema
      contains: A short list of entity types and the link names the graph uses.
    - name: Graph data
      contains: Cypher for Neo4j, JSON-LD or a CSV of subject, link and object rows.
    - name: Mermaid diagram
      contains: A diagram you can paste into a document, showing the main nodes and links.
    - name: Review notes
      contains: Orphan entities, vague link names, contradictions and links the AI inferred rather than read.
