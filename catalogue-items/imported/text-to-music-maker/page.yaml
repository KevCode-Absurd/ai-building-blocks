new_slug: text-to-music-maker
name: Text to music maker
summary: Describe the music or sound you want. Get a generated clip, even one that follows a melody you give.
job: build-software
headline: Text to music maker
subhead: Describe the music or sound you want. Get a generated clip, even one that follows a melody you give.
explain: |
  Type what you want to hear, such as "calm piano with soft rain", and get an audio clip back. You can also hum or supply a melody and have the new music follow it, or ask for a sound effect like footsteps on gravel.

  The skill uses Meta's AudioCraft library in Python. MusicGen makes music from text, with optional melody guidance and stereo output. AudioGen makes sound effects. It helps you choose a model size, set clip length and creativity settings, and write prompts that name genre, mood and instruments. You need Python and a computer with a graphics card for decent speed.
when:
  - You need background music for a video and have no budget for stock tracks.
  - You want a short sound effect for a game or demo.
  - You have a tune and want it rendered in a different style.
  - You are testing audio ideas before a producer gets involved.
you_give:
  - A text description of the sound
  - A melody file (optional)
  - Clip length
  - A computer with Python and a graphics card
you_get:
  - Generated audio clips
  - A prompt that names mood, genre and instruments
  - Model size advice
  - Code you can rerun with changes
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run Python code on a computer with a GPU.
