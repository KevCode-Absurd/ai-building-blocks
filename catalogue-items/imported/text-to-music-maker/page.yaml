new_slug: text-to-music-maker
name: Text to music maker
summary: Describe the sound you want. Get a WAV music clip or sound effect, made in Python with Meta's AudioCraft. The model may be non-commercial only.
job: build-software
headline: Text to music maker
subhead: Type what you want to hear, such as "calm piano with soft rain", and get an audio clip back. You can also supply a recorded melody file and have the new music follow it, or ask for a sound effect like footsteps on gravel.
explain: |
  Type what you want to hear, such as "calm piano with soft rain", and get an audio clip back. You can also supply a recorded melody file and have the new music follow it, or ask for a sound effect like footsteps on gravel.

  The skill uses Meta's AudioCraft library in Python. MusicGen makes music from text, with optional melody guidance and stereo output. AudioGen makes sound effects. It helps you choose a model size, set clip length and creativity settings, and write prompts that name genre, mood and instruments. You need Python and a computer with a graphics card for decent speed.

  Licence: the skill text is MIT, as the LICENSE file in this item says. The AudioCraft code and the MusicGen and AudioGen model weights have their own licences, and the weights may be non-commercial only. Check them before you publish any clip.
when:
  - You need background music for a video and have no budget for stock tracks.
  - You want a short sound effect for a game or demo.
  - You have a tune and want it played in a different style.
  - You want clips for a personal project, a draft or a test of an idea.
not_for:
  - "You plan to use the clips in paid or commercial work: the MusicGen model weights may allow non-commercial use only. Check the weights' licence first, or use a stock music library or the Suno song and music bed prompt writer."
  - "You want a spoken voiceover or text read aloud: use a text-to-speech tool, not this one."
  - "You want a long, finished commercial track: use a stock music library or a music producer."
  - "You have no way to run Python code: use the Suno song and music bed prompt writer, or pick a stock music site."
you_give:
  - A text description of the sound
  - A melody file (optional)
  - Clip length
  - A computer with Python and a graphics card
you_get:
  - One WAV audio file for each prompt you give. Music is 32 kHz and sound effects are 16 kHz.
  - A prompt that names genre, mood and instruments.
  - Advice on which model size to pick.
  - Code you can rerun with changes.
  - "Next step: import the WAV file into your video editor or game tool."
how_to_use:
  - Write what you want to hear. Name the genre, mood and instruments, such as calm piano with soft rain.
  - Add a melody audio file if you want the music to follow a tune. A hummed idea will not work unless it is a recorded audio file.
  - Paste the skill into a chat with an AI that can run Python code. You need a computer with a graphics card for decent speed.
  - Choose a clip length and a model size. Start with the small model.
  - Run the code, then listen to the WAV file. Change the prompt and rerun until it sounds right.
  - Check the licence of the AudioCraft code and the MusicGen and AudioGen weights before you use a clip in paid or commercial work. If you are stuck, see the troubleshooting notes in the skill's references.
output_sample:
  input:
    - A text description of the music or sound
    - A melody audio file (optional)
    - How long the clip should be
    - Which model size to use (optional)
  prerequisites:
    - An AI that can run Python code
    - A computer with a graphics card for decent speed
    - The audiocraft package installed, and a recent Python with PyTorch
    - About 4 GB of graphics memory for the small model (more for the larger ones)
    - A check of the model licence before any paid or commercial use. The MusicGen weights may be non-commercial only
  output:
    - name: Text-to-music clip
      contains: A WAV audio file for each text prompt, made with MusicGen at 32 kHz.
    - name: Melody-guided clip
      contains: New music in your chosen style that follows the tune in the melody file you give.
    - name: Stereo clip
      contains: Music with left and right channels, made with a stereo model.
    - name: Sound effect clip
      contains: A short sound effect, such as footsteps on gravel, made with AudioGen.
    - name: Generation code
      contains: Python you can rerun after changing the prompt, clip length, model size or creativity settings.
