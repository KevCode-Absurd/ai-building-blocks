thinking: low
thinking_why: It fills a set template with the style's rules.
new_slug: texture-style-guide
name: Real-world texture style guide writer
summary: Write a real-world texture style guide for your app or site. Get color, type, spacing and part rules for a leather, paper or glass look.
job: design-work
headline: Real-world texture style guide writer
subhead: "A style guide for an app or site that looks like real things: leather, paper, glass, brushed metal, buttons that seem to press down. It gives your designers and developers one shared rulebook instead of guesses."
explain: |
  A style guide for an app or site that looks like real things: leather, paper, glass, brushed metal, buttons that seem to press down. It gives your designers and developers one shared rulebook instead of guesses.

  You describe the product and its mood. The skill restates the design intent, then sets colors, type sizes, spacing and shadow depth before moving to parts such as buttons, cards and inputs. For each part it lists states, variants and how it behaves when touched. It adds accessibility rules, do and don't lists, plain-language writing tone, and ends with a checklist your team can use in code review.

  Licence: MIT, as the LICENSE file in this item says. Credit goes to Bergside (typeui.sh).
when:
  - You want an interface that feels physical and familiar.
  - Your team keeps making buttons and cards that do not match.
  - You need design rules written down before developers start building.
  - You are updating an older screen and want clear before-and-after guidance.
not_for:
  - "You want a flat or minimal look with no fake materials: use the Minimal style guide writer."
  - "You need finished screens or mockups: use a design tool such as Figma, since this only writes rules."
  - "You want a retro look instead: use the Retro style guide."
  - "You want a raw, blunt look with no polish (hard edges, flat color): use the Raw brutalist style guide writer."
you_give:
  - A description of your product (what it is, who uses it, and whether it is an app or a site)
  - The mood you want, such as playful or calm
  - Brand colors and fonts (optional)
  - Screens or parts you must cover (optional)
you_get:
  - Color, type and spacing rules
  - Part-by-part guidance with states
  - Accessibility requirements
  - A review checklist
how_to_use:
  - Have ready: what your product is and who uses it, the mood you want, your brand colors and fonts, and the parts you must cover (such as buttons, cards and inputs).
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Add this skill to your AI, or copy its instructions from this page and paste them into the chat.
  - Describe your product and the mood you want. Add brand colors, fonts and the parts you must cover if you have them. If you add none, the guide uses placeholder colors and fonts built into the skill (an orange primary, Roboto). Swap in your own before you share it.
  - Read the first section. Check that the design intent matches what you meant, and that the materials, shadow depths and pressed states fit your product.
  - Check the accessibility rules and the QA checklist. Ask your AI to fix any rule that sounds vague.
  - Share the guide with your designers and developers.
output_sample:
  input:
    - A description of your product
    - The mood you want, such as playful or calm
    - Brand colors and fonts (optional)
    - Screens or parts you must cover (optional)
  output:
    - name: Context and goals
      contains: One sentence on the design intent, then the goals the style must meet.
    - name: Design tokens and foundations
      contains: Color, type size, spacing and font rules, each tied to a named token.
    - name: Component-level rules
      contains: Parts such as buttons, cards and inputs, with states, variants, touch behavior and small-screen notes.
    - name: Accessibility requirements
      contains: Rules your team can test, based on WCAG 2.2 AA, keyboard use and visible focus.
    - name: Content and tone standards
      contains: How the words in your interface should sound, with examples.
    - name: Anti-patterns and prohibited implementations
      contains: What not to build, plus notes on moving older screens to the new rules.
    - name: QA checklist
      contains: A list your team can run through during code review.
