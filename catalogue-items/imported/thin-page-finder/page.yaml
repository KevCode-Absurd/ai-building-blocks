thinking: low
thinking_why: It checks length and missing fields.
new_slug: thin-page-finder
name: Thin page finder
summary: "Find thin pages and blog posts in your Shopify store: empty, too short, or missing a search title or description. Get a CSV list to fix."
job: audit-landing-page
headline: Thin page finder
subhead: Pages with almost no words or no search titles can rank poorly, and customers leave them fast. This skill lists every page and blog post in your Shopify store and flags the weak ones so you know exactly what to fix.
explain: |
  Pages with almost no words or no search titles can rank poorly, and customers leave them fast. This skill lists every page and blog post in your Shopify store and flags the weak ones so you know exactly what to fix.

  It reads your content through the Shopify Admin connection, using a read-only login, so nothing in your store is changed. It checks each page for an empty body, a body under a length you set (100 characters by default), a missing SEO title and a missing SEO description. You can include unpublished items too. The result is a plain list or JSON you can hand to a writer.

  Licence: MIT, as the LICENSE file in this item says. Credit goes to 40rty AI.
when:
  - Your store traffic dipped and you suspect weak pages.
  - You are about to rewrite your blog and need a priority list.
  - You inherited a store with many half-finished pages.
  - You want a quick content check before an SEO review.
not_for:
  - "You want to check product or collection search fields: use the Store SEO gap finder, or check them by hand in Shopify."
  - "You have no Shopify admin access: ask the store owner to add you, or to run it and send you the list."
  - "You want a full review of one landing page: read it yourself, or ask a writer to check it."
you_give:
  - Your store address
  - Shopify login with read access to content
  - Minimum body length (optional)
  - Whether to include unpublished items (optional)
you_get:
  - A list of empty and short pages
  - Pages missing SEO titles or descriptions
  - Blog posts with the same problems
  - A list to give your writer
how_to_use:
  - "Before you start: this needs a Shopify CLI login to your store and an AI that can run commands. A plain chat cannot run it."
  - Use an AI that can run commands and connect to Shopify, such as Claude Code, Cursor, Codex or Gemini CLI. These tools usually need an account and a paid plan or an API key, so check yours first. A plain chat window cannot read your store.
  - Sign in to your store with read access to content. The skill only reads, so nothing in your store changes.
  - Tell your AI to run the Thin page finder on your store address. Add a minimum body length or ask for unpublished items if you want.
  - "Open the CSV file it makes. The issue column says what is wrong: empty body, short body, missing SEO title or missing SEO description. Sort by that column. Start with your About, FAQ and Contact pages."
  - Spot-check a few flagged pages in Shopify. The search title and description are read from Shopify's default fields, so a store that keeps them elsewhere can show false "missing" flags.
  - Give the list to a writer, or fix the empty pages and missing search fields yourself. Then run the Store SEO gap finder to check your products and collections.
output_sample:
  input:
    - Your store address
    - Your Shopify login with read access to content
    - The shortest body length you accept (optional)
    - Whether to include unpublished pages and posts (optional)
  prerequisites:
    - An AI that can run Shopify CLI commands and use your store
    - A Shopify login with read content access
  output:
    - name: Start banner
      contains: The skill name, your store address and the start time.
    - name: Step log
      contains: One line per step showing what was read and how many items came back.
    - name: Summary
      contains: How many pages and blog posts were scanned, how many have issues, and each issue by title.
    - name: content_audit CSV file
      contains: "One row per page or post: type, id, title, handle, publish date, body length, SEO flags and the issue."
    - name: JSON summary (optional)
      contains: Counts of pages scanned, posts scanned, issues found and the CSV file name.
