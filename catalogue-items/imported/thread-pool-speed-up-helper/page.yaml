thinking: medium
thinking_why: It tests whether code is safe for threads before switching.
new_slug: thread-pool-speed-up-helper
name: Thread pool speed-up helper
summary: Speed up slow MATLAB parfor code on your own computer. Your AI tries a thread pool and reads any error. It falls back to a process pool if needed.
job: build-software
headline: Thread pool speed-up helper
subhead: Give it slow local parallel code. Get it switched to a thread pool, with an error read and a process-pool fallback if needed. Ask for before-and-after timing to check the gain.
explain: |
  MATLAB code that runs in parallel on your own computer often barely beats a plain loop, because data gets copied between worker processes. Switching to a thread pool removes much of that copying, and your existing parfor, parfeval or spmd code needs no rewrite.

  The skill starts the thread pool and runs your code. Ask it to time the run against the process pool (with tic and toc) so you can see the gain. If something is not supported on threads, MATLAB says so and the skill falls back to a process pool. It also explains what threads really save: large shared variables are not copied, while sliced arrays still are. It can set Threads as your default. It does not apply to clusters or Simulink parallel runs. If a process pool is already open, it asks you before closing it.

  Licence: the LICENSE.md file in this item governs. It is BSD 2-Clause with one added term: you may use the skill only with MathWorks products and services. The license link in the skill file's header points to a MathWorks licence page; follow LICENSE.md, and keep it with any copy. Skills it mentions, such as matlab-optimize-performance, may not be installed; in this library, use the MATLAB speed tuner.
when:
  - Your parfor loop is only slightly faster than a normal for loop.
  - Workers spend a lot of time receiving large arrays.
  - Opening a process pool takes longer than your short job.
  - You want to know if your function can run on a thread pool at all.
not_for:
  - "You run on a cluster: thread pools work only on your own computer, so keep the process pool."
  - "You use parsim or Simulink parallel runs, or distributed arrays: use a process pool."
  - "Your code is slow but not parallel: use the MATLAB speed tuner for loops and memory."
you_give:
  - Your MATLAB parallel code (parfor, parfeval or spmd)
  - Whether you run on your own computer or on a cluster
  - A rough sense of your data sizes (optional)
you_get:
  - Code running on a thread pool
  - Timing before and after, if you ask for it
  - A fallback plan if threads are unsupported
  - A setting to make Threads your default
  - "Note: the speed gain depends on your data and your computer, so compare your own before-and-after times"
how_to_use:
  - Open a chat with an AI that can run MATLAB code, not only write it. You need MATLAB R2020a or newer with Parallel Computing Toolbox.
  - Paste the skill text, then paste your parfor, parfeval or spmd code.
  - Say whether you run on your own computer or on a cluster.
  - Let your AI run the code on a thread pool. It should read any error instead of guessing.
  - Ask it to time your code with tic and toc on the thread pool and on the process pool. Keep those times as your baseline.
  - Check the result. If MATLAB says a feature is not supported, switch to a process pool with parpool("Processes").
  - Ask for Threads as your default if you want it every time. This needs R2022b or newer.
output_sample:
  input:
    - Your MATLAB parfor, parfeval or spmd code
    - Whether you run on your own computer or on a cluster
    - A rough sense of your data sizes (optional)
  prerequisites:
    - MATLAB R2020a or newer with Parallel Computing Toolbox (R2022b or newer to set Threads as the default)
    - An AI that can run MATLAB, so it can test your code instead of guessing
  output:
    - name: Thread pool start code
      contains: A short snippet that starts a thread pool only if one is not already open.
    - name: Run result
      contains: Whether your existing code ran on threads, or the error MATLAB gave if it did not.
    - name: Fallback advice
      contains: If a feature is not supported on threads, advice to use a process pool instead.
    - name: What threads save
      contains: A plain note that large shared variables are not copied, while sliced arrays still are.
    - name: Default setting
      contains: The command to make Threads your default pool, if you ask for it.
