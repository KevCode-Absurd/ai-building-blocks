thinking: high
thinking_why: It reasons about attackers across the whole codebase.
new_slug: threat-model-writer
name: Threat model writer
summary: Point it at your code. Get a short threat model of what attackers could
  reach, how, and how to stop them.
job: secure-code
headline: Threat model writer
subhead: Point it at your code. Get a short threat model of what attackers could
  reach, how, and how to stop them. Bring your repository or folder path. Use
  the result to plan your next step.
explain: |
  A short, evidence-based threat model for your codebase: what is worth protecting, who might attack it, how they would get in, and what to do about it. It reads like an engineer's review, not a generic checklist.

  The skill maps your components, data stores and outside connections, and sets out trust boundaries and entry points such as endpoints and upload paths. It states what an attacker could realistically do and what they could not. Each threat is an abuse path tied to an asset and ranked by likelihood and impact. Before the final write-up it asks you to confirm its assumptions, such as who can reach the service. The result is saved as Markdown.
when:
  - You are about to ship a service and need a security review.
  - A customer or auditor asked for a threat model.
  - You inherited a repository and want to know where it is weakest.
  - You want to rank security work by real risk, not by gut feeling.
you_give:
  - Your repository or folder path
  - How it runs and who can reach it
  - Data it handles
  - Answers to a few follow-up questions
you_get:
  - A map of components and trust boundaries
  - Ranked abuse paths
  - Fixes for each threat
  - A Markdown threat model
  - A list of assumptions you confirmed
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your project files.
