thinking: high
thinking_why: Missed threats are costly, so it works through every part.
new_slug: threat-modeler
name: Threat modeler
summary: Find what could go wrong in your system design with a threat modeler. Get STRIDE threats, risk ratings and a fix for each one.
job: secure-code
headline: Threat modeler
subhead: Describe a system and get a list of what could go wrong, ranked by risk, each with a fix. It suits the design stage, when changing a plan costs far less than changing shipped code.
explain: |
  Describe a system and get a list of what could go wrong, ranked by risk, each with a fix. It suits the design stage, when changing a plan costs far less than changing shipped code.

  The skill walks through the STRIDE method: spoofing, tampering, repudiation, information disclosure, denial of service and elevation of privilege. For each one it asks where your system is exposed, such as logins, data stores or third-party links. It scores likelihood and impact, then suggests controls like multi-factor login, signed requests or stricter logging. It works from your architecture notes or diagrams, and from how sensitive your data is.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The author's own file header says MIT. Credit goes to BagelHole and sickn33.
when:
  - You are designing a new feature that handles personal data.
  - You are adding a third-party service and want to know the risk.
  - A compliance review is coming and you need documented threats.
  - A past incident showed gaps and you want to find the rest.
not_for:
  - "You want to test a live system for weak spots: hire a penetration tester or run an authorized penetration test."
  - "You are fixing one known bug: fix it in the code and have a teammate review the change."
  - "You need a legal or compliance sign-off: ask your security lead or auditor, then use this to prepare."
you_give:
  - A description or diagram of your system
  - The kind of data it holds
  - Outside services it connects to
  - Existing security controls (optional)
you_get:
  - Threats sorted by STRIDE category
  - Risk ratings
  - Suggested controls for each threat
  - A short summary for reviewers
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste this skill. It runs in a normal chat and needs no code. The Threat Dragon, Docker and CI/CD parts of the skill need a terminal and are optional. Skip them in a chat.
  - Paste your system description or diagram notes. Say which parts handle data and where users log in.
  - List the kinds of data you hold, such as personal, health or payment data. List the outside services you use.
  - Ask your AI to go through each part of the system one at a time using STRIDE and fill in the worksheet.
  - Check the risk ratings with someone who knows the system. Fix any that look wrong.
  - Ask for the short reviewer summary, then share it with your team.
  - Last, give each open threat an owner and a deadline, and track it in your issue tracker with your other work.
output_sample:
  input:
    - A description or diagram of your system
    - The kind of data it holds, such as personal, health or payment data
    - Outside services it connects to
    - Security controls you already have (optional)
  prerequisites:
    - Your system notes or design diagram
    - Someone who knows how the system is built, to check the result
  output:
    - name: STRIDE worksheet
      contains: One entry per part of your system, listing spoofing, tampering, repudiation, disclosure, denial of service and privilege threats.
    - name: Data flow diagram
      contains: A text map of the parts of your system, the data between them and where trust changes.
    - name: Risk scoring
      contains: A likelihood and impact rating for each threat, combined into one risk level.
    - name: Controls and risk decisions
      contains: A suggested fix for each threat and whether to reduce, accept, move or avoid the risk.
    - name: Reviewer summary
      contains: A short note on the top risks and what to do first.
