new_slug: throwaway-database-maker
name: Throwaway database maker
summary: Get a free throwaway Postgres database for testing, with no sign-up. Your AI sends one request and saves the link in your .env file.
job: build-software
headline: Throwaway database maker
subhead: Need a real Postgres database for a demo or a test, and do not want to sign up for anything? This skill gets you a working database address in seconds.
explain: |
  Need a real Postgres database for a demo or a test, and do not want to sign up for anything? This skill gets you a working database address in seconds. No account, no card, no login.

  It calls Neon's free Claimable Postgres service, takes back a connection string and a claim link, and writes the string into your project's .env file as DATABASE_URL. You can use a web request, a one-line command, a script or a Vite plugin, whichever suits your setup. The database disappears after 72 hours unless you use the claim link to keep it in a Neon account. It is meant for testing, never for real customer data.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The skill file header names Neon's own Apache 2.0 licence. If you reuse the code, follow the Apache 2.0 terms as well. Credit goes to Neon and sickn33.
when:
  - You are building a prototype and need a database right now.
  - You want a clean database for a test run.
  - You are demoing an app and do not want to set up hosting.
  - A tutorial asks for Postgres and you only want to follow along.
not_for:
  - "You need a database in another region or a version other than Postgres 17: this service is fixed to AWS us-east-2 with Postgres 17, and the region cannot be changed. Claim it into a Neon account, or set up a standard Neon project."
  - "You will store real customer data or run a live app: set up a standard Neon database instead, as it does not expire."
  - "You need more than 100 MB of storage or database branches: claim the database into a Neon account first."
  - "You want to keep the database past 72 hours without signing in: open the claim link in a Neon account, or the database is deleted."
you_give:
  - A project that needs a database
  - Node.js or the ability to send a web request
  - Permission to write to your .env file
you_get:
  - A Postgres connection string
  - A claim link to keep the database
  - Your .env file filled in
  - A reminder of the 72 hour limit
how_to_use:
  - Open your AI in a chat that can run commands and reach the internet, such as Claude Code or ChatGPT with code tools.
  - "Paste this skill and say: I need a throwaway Postgres database for my project."
  - Know what you are installing. The one-line command runs a third-party npm package called neon-new and needs Node.js. The web request route needs only curl.
  - Tell your AI which .env file to use. Say if you want a seed SQL file loaded. A seed file is loaded with psql against DATABASE_URL, and your AI must show you the file and get your yes first if it deletes or replaces any data.
  - If your .env already has a DATABASE_URL line, the tool will not run. Remove or comment out the old line, pick a different file with --env, or pick a different key with --key. Your AI will ask you to confirm before it changes anything.
  - Let your AI check that .env is listed in .gitignore. If it is not, it will warn you. Do not commit the connection string.
  - Check the report for where the address was saved. Ask your AI to run a quick test query.
  - Open the claim link within 72 hours if you want to keep the database. For anything longer lived, move to a standard Neon project. Once claimed, manage the project in your Neon account instead of making a new throwaway database.
output_sample:
  input:
    - A project that needs a database
    - Permission to write to your .env file
    - Your preferred .env file name or variable name (optional)
    - A seed SQL file to load starter data (optional)
  prerequisites:
    - An AI that can run commands and reach the internet
    - Node.js, if you use the one-line command, script or Vite plugin
  output:
    - name: connection_string
      contains: The Postgres address your app uses to connect, saved in your .env file as DATABASE_URL.
    - name: DATABASE_URL_DIRECT
      contains: A second address without pooling, written by the one-line command, for tools that change the database layout.
    - name: claim_url
      contains: A link you open in a browser to keep the database in a Neon account.
    - name: expires_at
      contains: The time the database will be deleted if you do not claim it, 72 hours after it is made.
    - name: Report
      contains: A short note on where the address was saved, which name it uses, and the claim link.
