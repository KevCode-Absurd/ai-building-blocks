name: Throwaway database maker
summary: Ask for a database to test with. Get a Postgres link in seconds with no sign-up, kept 72 hours.
job: build-software
headline: Throwaway database maker
subhead: Ask for a database to test with. Get a Postgres link in seconds with no sign-up, kept 72 hours.
explain: |
  Need a real Postgres database for a demo or a test, and do not want to sign up for anything? This skill gets you a working database address in seconds. No account, no card, no login.

  It calls Neon's free Claimable Postgres service, takes back a connection string and a claim link, and writes the string into your project's .env file as DATABASE_URL. You can use a web request, a one-line command, a script or a Vite plugin, whichever suits your setup. The database disappears after 72 hours unless you use the claim link to keep it in a Neon account. It is meant for testing, never for real customer data.
when:
  - You are building a prototype and need a database right now.
  - You want a clean database for a test run.
  - You are demoing an app and do not want to set up hosting.
  - A tutorial asks for Postgres and you only want to follow along.
you_give:
  - A project that needs a database
  - Node.js or the ability to send a web request
  - Permission to write to your .env file
you_get:
  - A Postgres connection string
  - A claim link to keep the database
  - Your .env file filled in
  - A reminder of the 72 hour limit
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run commands and reach the internet.
