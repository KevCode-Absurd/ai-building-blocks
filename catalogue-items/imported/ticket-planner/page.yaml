thinking: medium
thinking_why: It splits work into ordered pieces.
new_slug: ticket-planner
name: Ticket planner
summary: Give it a plan or spec. Get small tickets that each say what blocks
  them, posted to your tracker.
job: build-software
headline: Ticket planner
subhead: A big plan becomes a set of small tickets, each one a thin slice that
  works from start to finish and says which other tickets must be done first.
explain: |
  A big plan becomes a set of small tickets, each one a thin slice that works from start to finish and says which other tickets must be done first. Your team can then see what to start today and what has to wait.

  The skill reads your spec, the conversation or an issue you point it to,. It drafts slices that each cut through every layer, such as data, interface and tests, and are small enough to finish in one sitting. It shows you the list with titles, blockers and results, and asks if they are too big, too small or wrongly linked. Once you agree, it posts them to your tracker in dependency order.
when:
  - You have a spec and need to split it into tasks for the team.
  - Your tickets are too big and keep getting stuck.
  - You want each ticket to show what blocks it.
  - You are about to start work with an AI and need small chunks.
you_give:
  - The plan, spec or issue link
  - Access to your issue tracker
  - Your codebase for context (optional)
  - Your view on how small each ticket should be
you_get:
  - A numbered list of small tickets
  - Blockers listed for each ticket
  - A review round with you before posting
  - Tickets posted to your tracker in order
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can reach your issue tracker.
