how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read your ad exports, and optionally read your TikTok Ads account with your own read-only access. Changes stay as drafts for your approval.
