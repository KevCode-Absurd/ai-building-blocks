thinking: medium
thinking_why: It plans outreach and tracking from set steps.
new_slug: tiktok-creator-outreach-planner
name: TikTok creator outreach planner
summary: "Plan your TikTok creator outreach: find creators who fit your product, set an offer and budget, and track results. Give it your product and budget."
job: grow-social
headline: TikTok creator outreach planner
subhead: A plan for finding TikTok creators who fit your product, what to offer them, and how to tell if the partnership paid off. It covers the full path from first search to repeat deals.
explain: |
  A plan for finding TikTok creators who fit your product, what to offer them, and how to tell if the partnership paid off. It covers the full path from first search to repeat deals.

  You give your product, niche, budget and the creator size you want. The skill sets out how to search the Creator Marketplace, how to check that a creator's followers and engagement look real, and which brand risks to screen for. It drafts a brief, suggests rate ranges and negotiation points, and sets up a simple way to track each creator's results. It also covers content approval and ways to keep strong creators coming back. The plan has no live TikTok data. You search the Creator Marketplace and bring back the facts, and every number in the tables is yours to fill in.

  Licence: MIT, as the LICENSE file in this item says. Credit goes to Nexscope AI.
when:
  - You have a product and a budget but no creators yet.
  - You want 20 creators for a launch and need a process.
  - Past creator posts got views but no sales.
  - You need a brief and an outreach message that creators will answer.
not_for:
  - "You run B2B or non-TikTok campaigns: use a general influencer or affiliate plan, or ask a person who knows that channel."
  - "You want live creator lists, real rates or real follower data: the plan can't pull them, so search the Creator Marketplace yourself."
  - "You already have creators signed and only need legal terms: ask a lawyer to check your contract."
you_give:
  - Your product and niche
  - Budget and number of creators
  - Follower range you want
  - Past creator results (optional)
you_get:
  - A creator search and vetting checklist
  - A campaign brief
  - Offer and rate guidance
  - A results tracking sheet outline
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed. The skill file ends with an optional pitch for Nexscope, an outside service you do not need.
  - Paste the skill text into the chat.
  - Add your product page, your budget split, the number of creators and the follower range. Say whether you have a TikTok Shop seller account or Creator Marketplace access. Add past creator results if you have them.
  - Read the plan. Replace every bracketed example number with your own facts, since your AI has no live TikTok data.
  - Search the Creator Marketplace yourself and fill in the creator table.
  - "Add a clear #ad label and TikTok's branded content toggle to your brief before you send it. Have a lawyer review the usage rights, exclusivity and pay terms before you sign anyone."
output_sample:
  input:
    - Your product and niche
    - Your budget and how many creators you want
    - The follower range you want
    - Your past creator results (optional)
  output:
    - name: Creator Discovery Strategy
      contains: The target creator profile, with follower range, engagement rate, audience, content style and brand safety.
    - name: Creator Research Results
      contains: A table to fill with prospect creators, their numbers, rate and priority.
    - name: Campaign Strategy & Structure
      contains: The goal, key message, content format, hashtag and what each video must include.
    - name: Creator Partnership Framework
      contains: Tiers by follower size, with deliverables, pay, commission ideas and contract terms.
    - name: Outreach & Negotiation Strategy
      contains: A first message to creators and simple negotiation rules.
    - name: Performance Tracking & KPIs
      contains: A tracking table for views, clicks, sales and return per creator.
    - name: Creator Relationship Management
      contains: Ways to keep strong creators working with you.
    - name: Campaign Optimization Plan
      contains: A week by week checklist, plus a monthly review.
    - name: Budget Allocation & ROI Projections
      contains: How to split your budget and what results to aim for.
    - name: Next Actions
      contains: A short checklist of what to do first.
