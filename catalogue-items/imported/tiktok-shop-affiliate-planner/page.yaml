job: grow-social
headline: TikTok Shop affiliate planner
subhead: Tell it your products and margins. Get a commission setup, creator
  outreach plan and sample process. Bring your products and margins. Use the
  result to plan your next step.
explain: |
  A working affiliate program for your TikTok Shop: what commission to pay, who to recruit, how to send samples, and how to keep strong sellers happy. The numbers are built around your margins so you do not pay away the profit.

  You list products and their margins. The skill sets commission rates, with tiers that pay more as creators sell more, and sketches bonuses for top performers. It writes outreach messages and a short vetting list, then walks through the sample step: who gets a free item, how to ship it, and how to follow up. It adds a simple tracker, notes on content approval and the legal points to cover in your terms.
when:
  - You want creators to sell your products for a commission.
  - Your program has 20 creators but few sales.
  - You are unsure how high a commission can go before it hurts margin.
  - You need a sample process that does not drain your stock.
you_give:
  - Your products and margins
  - Creator types you want
  - Sample budget
  - Current program results (optional)
you_get:
  - A commission and tier structure
  - Outreach message drafts
  - A sample sending process
  - A creator tracking sheet outline
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
