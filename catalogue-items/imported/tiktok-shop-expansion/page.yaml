thinking: medium
thinking_why: It weighs markets, shipping and rules together.
new_slug: tiktok-shop-expansion
name: TikTok Shop overseas expansion planner
summary: Plan your TikTok Shop overseas expansion. Give it your products and target countries. You get a ranked market list, plus shipping, tax and local steps.
job: run-your-store
headline: TikTok Shop overseas expansion planner
subhead: A shortlist of countries to sell in next, in the order you should enter them, with the shipping, tax, rule and language work each one needs.
explain: |
  A shortlist of countries to sell in next, in the order you should enter them, with the shipping, tax, rule and language work each one needs. It helps you avoid launching in a market and then finding out about a customs problem.

  You say what you sell and where you sell now. The skill scores markets by demand, competition, how people there shop, and what it would cost to start. For the top picks it sets out fulfilment options, customs paperwork, payment and currency issues, and how returns will work. It covers VAT or GST setup, product rules and sales rules by region. It then lists what to change in content, product pages and messaging to suit local taste.
when:
  - Your US shop is doing well and you want to sell in the UK or Germany.
  - You do not know how VAT works for a seller based abroad.
  - You need to decide which country to enter first.
  - You want to localize videos and listings for Japan.
not_for:
  - "You need to register for VAT or GST: ask a tax adviser in that country or the official tax office, since this plan only lists what to check."
  - "You want live market numbers, current carrier prices or today's rules: check them with the tax office, your carrier and TikTok Shop's seller help pages."
  - "You have never sold across borders and have no local advice: talk to a customs broker or a local adviser first."
you_give:
  - Your products
  - Countries you are considering
  - Where you ship from
  - Sales and budget to commit
you_get:
  - Ranked list of markets
  - Shipping and customs checklist
  - Tax and legal points
  - A localization list
  - An order of rollout
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. It needs no code, files or paid tools. The skill file ends with an optional pitch for Nexscope, an outside service you do not need.
  - Tell it what you sell, with prices and weights if you have them. Say where you sell now and where you ship from.
  - Name the countries you are considering and the budget you can spend.
  - Read the market ranking first. Ask it to explain any score you doubt.
  - Treat all tax, customs and cost figures as rough. Check them with a local tax adviser and your carrier before you act.
  - Use the next actions list as your to-do list for the first country.
output_sample:
  input:
    - Your product list
    - The countries you are thinking about
    - The country you ship from
    - Your budget and current sales (optional)
  output:
    - name: Market opportunity analysis
      contains: A table that ranks each country by opportunity, competition, setup effort and revenue potential.
    - name: Market entry strategy
      contains: A phased plan for the first country, with a market profile, setup needs and localization needs.
    - name: Logistics and fulfillment strategy
      contains: A comparison of shipping options and a plan for which to use in each phase.
    - name: Legal and compliance framework
      contains: A checklist of registrations, certifications and tax points for each target country.
    - name: Pricing and financial strategy
      contains: Currency and pricing advice, and a 12-month table of revenue, costs and profit.
    - name: Localization strategy
      contains: How to adapt product text, videos, creators and messages to local shoppers.
    - name: Launch timeline and milestones
      contains: A month-by-month checklist from setup to soft launch to scaling.
    - name: Risk management and next actions
      contains: Main risks with fixes, success measures and a short list of what to do next.
