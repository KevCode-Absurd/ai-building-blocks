thinking: low
thinking_why: It fills set listing templates.
new_slug: tiktok-shop-listing-writer
name: TikTok Shop listing writer
summary: Write a TikTok Shop listing that gets found in search. Give it your product details. You get a title, description, and image and video plan.
job: write-landing-page
headline: TikTok Shop listing writer
subhead: Product listings that get found in TikTok Shop search and then convince the person looking. You get a title, description and a plan for images and video, all based on how shoppers search there.
explain: |
  Product listings that get found in TikTok Shop search and then convince the person looking. You get a title, description and a plan for images and video, all based on how shoppers search there.

  You provide product details. The skill works out the keywords shoppers use, puts the strongest ones in the title, and picks the right category and attributes. It writes a description that answers buying questions, plans the main image, supporting images and a short demo clip, and suggests price and promotion framing. It also connects each listing to the videos you will post and shows where reviews and customer clips can add proof.
when:
  - Your product titles never show up in TikTok Shop search.
  - You are listing a new item and want it right the first time.
  - Your listing gets views but few sales.
  - You need to know which images and videos a listing needs.
not_for:
  - "You need real search volume numbers: check TikTok Shop Seller Center, because this skill cannot see live search data."
  - "You want to write a video script or post: ask a person on your team or write it yourself, since this skill plans the listing only."
  - "You sell on Amazon or Shopify: use that site's own listing tools, because the title and image rules here are for TikTok Shop."
you_give:
  - Product details and features
  - Price and any promotion
  - Photos you already have (optional)
  - Competing listings (optional)
you_get:
  - A search-ready title
  - A description
  - Category and attribute picks
  - An image and video plan
  - Hashtag ideas
how_to_use:
  - Gather your product name, features, price and any promotion. Add photos and competitor links if you have them (optional).
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat. No code or paid tool is needed.
  - Paste your product details and ask for a TikTok Shop listing plan.
  - Look up each keyword's search volume and competition in TikTok Shop Seller Center. The plan leaves them blank unless you give real figures.
  - Check that every price, review and claim came from your own details. Remove anything you did not supply.
  - Add the title and description to your listing, then make the images and video from the plan.
output_sample:
  input:
    - Your product name and key features
    - Your price and any promotion
    - Photos you already have (optional)
    - Links to competing listings (optional)
  output:
    - name: SEO Optimization Strategy
      contains: Your main and long-tail keywords, with search volume and competition left as "check in Seller Center" unless you give real figures, plus a keyword-rich title under 60 characters.
    - name: Product Description Structure
      contains: A description with a hook, key features, why to choose it, what is in the box, who it suits, and hashtags.
    - name: Visual Content Strategy
      contains: A list of 9 images to prepare and what your product video needs, including length, format and first three seconds.
    - name: Listing Attributes & Categories
      contains: The category path and product details such as brand, material, size, weight, colors and target buyer.
    - name: Competitive Analysis Summary
      contains: A table comparing up to three competitors you paste or link, on title, price, strengths and gaps you can use. Left out if you give none.
    - name: Performance Tracking Setup
      contains: The numbers to watch and a weekly, two-week and monthly schedule for checking them.
    - name: Next Actions
      contains: A checklist for using the new title, description, images and video, and setting up tracking.
next: [tiktok-shop-content-planner, tiktok-shop-results-reader]
