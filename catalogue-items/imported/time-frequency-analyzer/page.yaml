thinking_why: Several methods fit; it picks one per signal.
new_slug: time-frequency-analyzer
name: Time-frequency analyzer
summary: Give it a signal that changes over time. Get plots and measures of how
  its frequencies shift.
job: build-software
headline: Time-frequency analyzer
subhead: See how the pitch or frequency of a signal moves over time, such as a
  bearing that starts to whine or a heart rhythm that shifts.
explain: |
  See how the pitch or frequency of a signal moves over time, such as a bearing that starts to whine or a heart rhythm that shifts. You get plots and numbers showing when each frequency appears and fades.

  The skill is for MATLAB. It first picks the method that fits your goal: short-time Fourier transform for steady views, wavelets for sharp changes, synchrosqueezing for crisp ridges, or EMD and VMD to split a signal into parts. It draws spectrograms or scalograms, extracts and rebuilds single components, and estimates instantaneous frequency. For two signals it can compute time-varying coherence. It points out common mistakes for each method.
when:
  - Your sensor signal changes pitch and a single spectrum hides it.
  - You need to pull one component out of a mixed signal.
  - You must pick between STFT, wavelets and mode decomposition.
  - You want to see how two signals relate over time.
you_give:
  - Your signal data and sample rate
  - What you want to find
  - MATLAB with signal and wavelet toolboxes
  - A second signal for comparison (optional)
you_get:
  - Spectrogram or scalogram plots
  - Method choice with reasons
  - Extracted signal parts
  - Frequency over time estimates
  - Working MATLAB code
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with Wavelet Toolbox.
