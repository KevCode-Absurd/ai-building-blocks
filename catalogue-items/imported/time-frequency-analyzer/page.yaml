thinking: medium
thinking_why: Several methods fit; it picks one per signal.
new_slug: time-frequency-analyzer
name: Time-frequency analyzer
summary: Find how the frequencies in a signal change over time. Get spectrogram plots and a method pick for your MATLAB time-frequency analysis.
job: build-software
headline: Time-frequency analyzer
subhead: See how the pitch or frequency of a signal moves over time, such as a bearing that starts to whine or a heart rhythm that shifts.
explain: |
  See how the pitch or frequency of a signal moves over time, such as a bearing that starts to whine or a heart rhythm that shifts. You get plots and numbers showing when each frequency appears and fades.

  This is for MATLAB users who work with signals, such as engineers and researchers. It is not for business operators or anyone without MATLAB.

  The skill is for MATLAB. It first picks the method that fits your goal: short-time Fourier transform for steady views, wavelets for sharp changes, synchrosqueezing for crisp ridges, or EMD and VMD to split a signal into parts. It draws spectrograms or scalograms, extracts and rebuilds single components, and estimates instantaneous frequency. For two signals it can compute time-varying coherence. It points out common mistakes for each method. It needs paid MATLAB with the Signal Processing and Wavelet Toolboxes, and some signal-processing knowledge. It is not for non-technical business users.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. The licence line inside the skill file (SKILL.md) links a different MathWorks licence page. LICENSE.md is the licence that governs this copy. Follow LICENSE.md.
when:
  - Your sensor signal changes pitch and a single spectrum hides it.
  - You need to pull one component out of a mixed signal.
  - You must pick between STFT, wavelets and mode decomposition.
  - You want to see how two signals relate over time.
not_for:
  - "You need to design or apply a standard filter: use the MATLAB filter design skill (matlab-design-digital-filter), not this one."
  - "You want numbers to feed a machine learning model: use the MATLAB signal feature skill (matlab-extract-signal-features)."
  - "You need to clean the signal first, such as resampling or filling gaps: use the MATLAB signal prep skill (matlab-prepare-signal-data)."
you_give:
  - Your signal as a list of numbers, such as a sensor reading
  - Your sample rate
  - What you want to find, such as a pitch shift or one part to pull out
  - Your MATLAB version, with the Signal Processing and Wavelet Toolboxes
  - A second signal for comparison (optional)
you_get:
  - Spectrogram or scalogram plots
  - Method choice with reasons
  - Extracted signal parts
  - Frequency over time estimates
  - Working MATLAB code
how_to_use:
  - Open an AI that can run MATLAB, or run the code it gives you in your own MATLAB. You need a paid MATLAB licence with the Signal Processing and Wavelet Toolboxes. The AI step alone does not give a checked result, so run the code and look at the plots yourself. The licence allows use of this skill only with MathWorks products (see LICENSE.md).
  - Paste the skill text into the chat, or attach the skill folder if your AI accepts files. Put the scripts folder (assessSignalForTF.m and assessBoundary.m) on your MATLAB path.
  - "First run: call assessSignalForTF(x, fs) from the scripts folder on your signal. Its report decides which method to use, so do it before anything else."
  - Give your signal, your sample rate and what you want to find. Add a second signal if you want to compare two.
  - "What the method names mean: STFT (short-time Fourier transform) cuts the signal into short windows and shows the frequencies in each. Wavelets zoom in on sudden changes. Synchrosqueezing sharpens the plot into thin ridges so you can follow one frequency. EMD and VMD split a mixed signal into separate parts, EMD without you saying how many parts, VMD when you know how many."
  - The function tffilt, which removes parts of the plot you mask out, needs MATLAB R2025a or newer. Everything else works from R2024b.
  - Read the method choice first. If it does not fit your goal, say so and ask for another method.
  - Run the MATLAB code it writes. Check the plot, then ask it to pull out parts or estimate frequency over time.
  - Ask whether you need to rebuild the signal or only view it. Some methods can rebuild it and some cannot.
  - Next, pass the extracted parts or frequency estimates to the signal feature skill (matlab-extract-signal-features) if you want inputs for machine learning.
output_sample:
  input:
    - Your signal as a list of numbers
    - Your sample rate
    - What you want to find, such as a pitch shift or one hidden part
    - A second signal to compare (optional)
  prerequisites:
    - An AI that can run MATLAB code, or MATLAB open on your own computer
    - MATLAB with the Signal Processing Toolbox and the Wavelet Toolbox
  output:
    - name: Signal check
      contains: A short report on signal length, bandwidth, number of frequency peaks, whether it changes over time, and DC content.
    - name: Method choice
      contains: The method picked for your goal, such as STFT, CWT, synchrosqueezing, EMD or VMD, with the reasons.
    - name: Time-frequency plot
      contains: A spectrogram or scalogram showing when each frequency appears and fades.
    - name: Extracted components
      contains: Single parts pulled out of the signal and rebuilt, when you ask for them.
    - name: Instantaneous frequency
      contains: Estimates of how frequency moves over time, for one part or for the whole signal.
    - name: Coherence or cross spectrogram
      contains: How two signals relate over time, with phase arrows for coherence, when you give a second signal.
    - name: MATLAB code
      contains: Working code for each step, plus warnings about common mistakes for the chosen method.
    - name: Report layout
      contains: Sections in a fixed order, signal check, method choice, plot, extracted parts, frequency over time, then code, each with a short note.
