thinking: high
thinking_why: Handling censored data correctly needs careful choices.
new_slug: time-to-event-model-builder
name: Time-to-event model builder
summary: Build a survival model from follow-up data where some people have not had the event yet. Get leak-safe scores and risk curves.
job: track-numbers
headline: Time-to-event model builder
subhead: Give it follow-up data with dropouts. Get survival models that avoid data leaks, with scores and risk curves. Bring a table with time, event flag and features. You get a report to take to a statistician before you act.
explain: |
  Models that predict how long until something happens, such as a customer leaving or a patient relapsing, even when some people have not yet had the event. Those cases are cut off and must be handled with care, or the results mislead.

  The skill uses the scikit-survival library in Python. It sets up data in the right form, then fits Cox models, penalized Cox, survival trees, forests and boosting. It splits and tunes models in a way that prevents leaks from test data into training.

  Plain words for the terms. A Cox model estimates how fast risk grows and which features raise it. A penalized Cox model does the same but shrinks weak features so it does not overfit. Concordance is how often the model ranks who has the event first correctly. Time-based error scores how close the predicted risk is at a chosen time. Cumulative incidence is the share of people who have had the event by each point in time, when there is more than one possible event.

  It will not present results as clinical advice. You need Python 3.11 or later.

  Licence: the skill is MIT, as the LICENSE.md file in this item says. The scikit-survival library it uses is GPL-3.0-or-later, so check that licence before you redistribute anything built on it. Credit goes to K-Dense.
when:
  - You have customer or patient follow-up data where many people have not yet had the event.
  - You want to compare several survival models fairly.
  - Your model looks too good and you fear data leakage.
  - You need risk curves to show a group over time.
not_for:
  - "You need clinical advice or proof that a treatment works: ask a qualified statistician or clinician, since this only shows patterns in your data."
  - "You want Fine-Gray regression for competing risks: use a different statistics tool, because this skill only draws cumulative incidence curves for them."
  - "You have no Python 3.11 or later and your AI cannot run code: ask a data analyst to fit the model for you."
you_give:
  - A table with time, event flag and features
  - The question you are asking
  - Python 3.11 or later
  - Time points that matter (optional)
you_get:
  - Fitted survival models
  - Leak-safe validation
  - Concordance and error scores
  - Risk and survival curves
  - A reproducible script
how_to_use:
  - Download the skill folder and add it to your AI that can run code, such as Claude Code. A plain chat can explain the steps but cannot fit the models.
  - "Use only data you have written permission to use, with names and IDs removed. Follow your own rules for patient or customer data. Never paste patient records into a chat."
  - Ask your AI to set up a Python 3.11 or later environment with uv, and to install scikit-survival there.
  - "Before you fit anything, check three things: the time column, the event column coded 1 (the event happened) or 0 (cut off), and the feature columns. Ask it to check your table with validate_survival_csv.py. It must pass before any model is trained, so fix any error first."
  - Tell it your time column, event column and features, and the question you want answered. It then trains the models with train_survival_model.py and scores them with evaluate_survival_metrics.py.
  - Ask for model_report.py to write the summary. Take that summary to a statistician or an expert in your field before you act on any score.
  - "Known limit: the report helper cannot confirm that the training summary and the metrics summary come from the same model and the same test group. Check that yourself before you combine them."
  - The scikit-survival library is licensed GPL-3.0-or-later, even though this skill is MIT. Check the library's licence before you redistribute anything built on it.
output_sample:
  input:
    - A table with a time column, an event flag (1 if the event happened, 0 if cut off) and your feature columns
    - The question you want answered, such as who is likely to leave first
    - Time points that matter to you (optional)
  prerequisites:
    - An AI that can run Python code
    - Python 3.11 or later with scikit-survival installed in its own environment
  output:
    - name: Outcome set-up
      contains: Your time and event columns turned into the form survival models need, with checks that the table is valid.
    - name: Leak-safe pipeline
      contains: Splits and tuning steps that keep test data out of training, so scores are not too good.
    - name: Model comparison
      contains: Cox, penalized Cox, survival tree, forest and boosting models fitted and compared on the same split.
    - name: Scores
      contains: Concordance and time-based error for each model, built to account for people who were cut off.
    - name: Risk and survival curves
      contains: Risk and survival values over time for a group or for individuals, written as numbers in a JSON file by the bundled scripts. They do not draw plots. Ask your AI to plot the numbers with its own code if you want pictures.
    - name: Cumulative incidence curves
      contains: Competing-risk curve values (as numbers in a JSON file from competing_risk_cif.py) when your data has more than one possible event.
    - name: Reproducible script
      contains: The code used, so you can rerun the same steps on new data.
    - name: Report layout
      contains: model_report.py writes a Markdown text report with sections for outcome checks and a model comparison table of concordance and Brier scores at the time points you named. It writes text only. The curves and training results are separate JSON files.
