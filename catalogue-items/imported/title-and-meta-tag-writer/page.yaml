thinking: low
thinking_why: It fills short fields within set length limits.
new_slug: title-and-meta-tag-writer
name: Title and meta tag writer
summary: Write title tags and meta descriptions that get more clicks, plus social share tags. Give it your page details and keyword, and pick from 3 options.
job: get-found-in-search
headline: Title and meta tag writer
subhead: Give it a page. Get title tags, meta descriptions and social share tags that fit the page's aim. Bring page title and type. Use the result to plan your next step.
explain: |
  Page titles and descriptions that make people click when they see your page in search results, plus the tags that control how links look when shared on social sites.

  You give the page title, page type, main keyword, a short summary, who it is for, what action you want and your strongest benefit. The skill places the main keyword near the front of the title, keeps lengths inside what search results show, and writes a description that promises a clear outcome and a next step. It offers a few options to choose from, and adds Open Graph and Twitter tags so shared links get a good title and summary. It can include your brand name when it fits.
when:
  - Your pages rank but few people click.
  - You are launching a page and need its title and description.
  - Shared links on social sites look plain or cut off.
  - You have many pages with duplicate or missing meta tags.
not_for:
  - "You need the body copy of the page rewritten: rewrite the page text first, then come back for the tags."
  - "You need to find which keyword to target: do keyword research first, with a search tool or a person who knows SEO."
  - "You need to check a whole site for missing tags: use a site crawler, since this tool writes tags one page at a time."
you_give:
  - Page title and type
  - Main and secondary keywords
  - A short summary of the page
  - Audience and your strongest benefit
  - Brand name (optional)
you_get:
  - Title tag options
  - Meta description options
  - Open Graph and Twitter tags
  - Length checks
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code or paid tool is needed.
  - Add your page title, page type, main keyword and a short summary of the page.
  - Add who the page is for, what you want readers to do, and your strongest benefit. Add your brand name if you want it in the title.
  - Read the three title and three description options. Pick the one marked as recommended or test two.
  - Check that any number or claim in the text is true for your page. Remove anything you cannot back up.
  - Paste the final tags into your page settings or site editor, and add your real image links to the social tags.
output_sample:
  input:
    - Your page title and page type, such as blog post or product page
    - Your main keyword, and other keywords (optional)
    - A short summary of the page and who it is for
    - What you want readers to do, and your strongest benefit
    - Your brand name (optional)
  output:
    - name: SERP Preview
      contains: A mock-up of how the page may look in search results, using the recommended title and description.
    - name: Title Tag Variants
      contains: Three title options with length, keyword position and click angle, plus a recommended pick and why.
    - name: Meta Description Variants
      contains: "Three description options: benefit lead, question hook and specific claim, each with a character count and power words used."
    - name: Open Graph Tags
      contains: Ready-to-paste HTML tags for how the link looks when shared on LinkedIn, Facebook, WhatsApp and Slack.
    - name: Twitter / X Card Tags
      contains: Ready-to-paste HTML tags for how the link looks when shared on X.
    - name: Quality Checklist
      contains: A check of each title, description and social tag against length, keyword and wording rules.
    - name: Variant Comparison Table
      contains: A side-by-side table of all six variants with length, keyword placement, power words and the recommended pick.
