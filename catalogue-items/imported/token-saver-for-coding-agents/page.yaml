new_slug: token-saver-for-coding-agents
name: Token saver for coding agents
summary: Turn it on for coding sessions. Get fewer wasted tokens from big reads,
  noisy logs and repeat reads.
job: set-up-ai
headline: Token saver for coding agents
subhead: Cut wasted tokens in coding sessions so you hit usage limits later and
  pay less. Every big file or log an agent reads is re-sent on every later step,
  so a few careless reads cost a lot.
explain: |
  Cut wasted tokens in coding sessions so you hit usage limits later and pay less. Every big file or log an agent reads is re-sent on every later step, so a few careless reads cost a lot.

  The skill is a short set of rules your agent follows. It finds a spot first, then reads only that region. It runs a quick script to count or filter data instead of opening a huge file. It limits test, build and install output, saving long logs to a file and reading only the tail. It does not re-read what it already has, batches independent calls, prefers diffs to full files, edits instead of rewriting, and gives short answers.
when:
  - Your coding sessions keep hitting the context limit.
  - Your usage bill or limit climbs faster than expected.
  - Test and build logs flood the conversation.
  - You ask your agent to search a large codebase.
you_give:
  - A coding agent that supports skills
  - A coding task with files, tests or builds
  - Permission to run shell commands
you_get:
  - An agent that reads only what it needs
  - Short test and build output
  - Fewer repeat reads
  - Leaner answers
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and read your project files.
