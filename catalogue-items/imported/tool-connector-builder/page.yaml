thinking: high
thinking_why: It plans the tools, builds a server and tests it.
new_slug: tool-connector-builder
name: Tool connector builder
summary: Build an MCP server that lets your AI use a service's tools. Name the service, get tested server code and 10 test questions.
job: connect-tools
headline: Tool connector builder
subhead: Give your AI access to a service by building an MCP server, a small program that exposes the service's actions as tools the AI can call.
explain: |
  Give your AI access to a service by building an MCP server (MCP is a standard way to plug outside tools into an AI), a small program that exposes the service's actions as tools the AI can call. Done well, the AI picks the right action and gets useful answers back.

  The skill works in four phases. First it studies the service's API and the MCP spec, then plans which tools to offer, balancing full coverage with a few workflow tools. It builds the server, defaulting to TypeScript, with clear tool names, short descriptions, paging and error messages that tell the AI what to try next. Then it tests the tools and writes evaluation questions to check the AI can use them. You need coding tools and the service's API access.

  Licence: Apache 2.0, as the LICENSE.txt file in this item says. This is a copy of Anthropic's mcp-builder skill.
when:
  - You want Claude to work with a service that has no connector yet.
  - Your internal API should be usable by an AI assistant.
  - An existing connector returns too much text and wastes context.
  - You want questions that test whether your connector works.
not_for:
  - "The service already has an official connector: install that connector instead of building a new one."
  - "You have no API access to the service: ask the service's owner or support team for API keys first."
  - "You only need to send data to a service once: export the file by hand or use the service's own import page."
you_give:
  - The name of the service and its API docs
  - API keys for testing
  - "Language preference: TypeScript or Python (optional)"
  - The tasks the AI should handle
you_get:
  - A working MCP server
  - Tool names and descriptions
  - Error handling that guides the AI
  - Test questions
  - Setup steps
how_to_use:
  - "You need: an AI that can run code, Node and npm (or Python), the MCP Inspector, and API keys for the service. Use keys with read-only scope where you can. This is a developer task, so ask a developer to run it with you if that is not you."
  - The skill fetches the MCP spec, SDK docs and web pages as it works, so your AI needs web access. Check the service's own current API docs too, because they change.
  - Open an AI that can run code and read web pages. Paste in this skill.
  - Tell it the service name, the link to its API docs and the tasks the AI should handle.
  - Say TypeScript or Python if you have a preference. TypeScript is the default.
  - Give it test API keys when it asks. Use keys with limited access, not your main ones.
  - Let it build the server, then check the Inspector test result and the tool list.
  - Ask it to write the 10 test questions, then run them to see if your AI can use the tools.
  - Next, load the finished server into your AI tool's connector settings. Run the 10 questions again after every change to a tool. If some of the 10 fail, read which tool the AI picked. Then fix that tool's name, description or error message and run the questions again.
output_sample:
  input:
    - The name of the service and a link to its API docs
    - API keys for testing
    - Your language choice, TypeScript or Python (optional)
    - The tasks you want your AI to handle
  prerequisites:
    - An AI that can run code and read web pages
    - Node and npm installed if you pick TypeScript, or Python if you pick that
    - API access to the service
  output:
    - name: Implementation plan
      contains: The list of service actions to offer as tools, starting with the most common ones.
    - name: MCP server code
      contains: A project with an API client, sign-in, error handling, paging and one tool per action.
    - name: Tool names and descriptions
      contains: Clear action names with short descriptions, input rules and hints that mark each tool as read-only or not.
    - name: Build and test result
      contains: Whether the server builds, plus what the MCP Inspector showed when each tool was tried.
    - name: Evaluation file
      contains: An XML file with 10 hard, read-only questions, each with one answer you can check.
