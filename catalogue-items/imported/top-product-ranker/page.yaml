thinking: low
thinking_why: It adds up and sorts order lines.
new_slug: top-product-ranker
name: Top product ranker
summary: Rank your best selling products by revenue, units sold and refund rate for any date range in your Shopify store. Read-only, no changes made.
job: run-your-store
headline: Top product ranker
subhead: Your products ranked by what they earn, so you know which ones to push and which to drop. Choose any date range and see revenue, units sold and refund rate side by side.
explain: |
  Your products ranked by what they earn, so you know which ones to push and which to drop. Choose any date range and see revenue, units sold and refund rate side by side.

  The skill reads orders from your Shopify store through a connection that only has permission to view orders. It pages through every order in your chosen dates, adds up line items per product, and subtracts refunds to get a refund rate. You can rank by revenue, units or refund rate and show the top 20 or any number you pick. It makes no changes to your store. Output comes as a readable table or as JSON for your own tools.
when:
  - You want to know last month's best sellers.
  - A product sells a lot but you suspect high returns.
  - You are planning stock and need a ranked list.
  - You want to find weak products to retire.
not_for:
  - "You need stock forecasting across several stores: use your own inventory system or a spreadsheet."
  - "Your shop is not on Shopify: ask your shop platform for a sales report instead."
  - "You want to change prices, products or orders: this only reads orders, so use your Shopify admin."
you_give:
  - Your store address
  - Shopify login with order read access
  - Start and end dates
  - Ranking measure and number of products (optional)
you_get:
  - A ranked product table
  - Revenue and units for each
  - Refund rate for each
  - A readable or JSON file
how_to_use:
  - Open an AI that can run Shopify CLI commands, such as Claude Code, Cursor, Codex or Gemini CLI. A plain chat window cannot reach your store.
  - Log in to your store with the Shopify CLI. Your login needs permission to read orders.
  - Paste the skill and give your store address, a start date and an end date.
  - Start with a 30 day range. Wider ranges take longer on busy stores.
  - Ask for a ranking by revenue, units or refund rate, and say how many products you want to see.
  - Check the table. Net revenue is revenue after refunds. Refund rate is the refunded amount divided by gross revenue.
output_sample:
  input:
    - Your store address
    - Start and end dates
    - "Ranking measure: revenue, units or refund rate (optional)"
    - How many products to show (optional)
  prerequisites:
    - An AI that can run Shopify CLI commands
    - A Shopify login with permission to read orders
  output:
    - name: Ranked product table
      contains: One row per product with rank, units sold, gross revenue, refunded amount, net revenue and refund rate.
    - name: Outcome summary
      contains: Orders processed, products ranked, date range, sort measure and error count.
    - name: JSON results (optional)
      contains: The same ranked rows as data, if you ask for json format.
