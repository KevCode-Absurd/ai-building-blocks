thinking: medium
thinking_why: It maps messy columns into a strict format.
new_slug: tracking-data-importer
name: Tracking data importer
summary: Turn a CSV or Excel file of tracks or detections into data MATLAB tracking tools can read. Get a confirmed column map, code and a plot.
job: build-software
headline: Tracking data importer
subhead: Give it a CSV or Excel file of tracks or detections. Get data ready for MATLAB tracking tools. Bring a CSV, Excel or text file of tracks or detections. Use the result to plan your next step.
explain: |
  Raw track logs from GPS, flight recorders, radar or cameras rarely load straight into MATLAB's tracking tools. This skill turns your CSV, Excel or text file into the exact format those tools expect, so you can replay trajectories, tune filters or feed a tracker.

  It first asks one thing: is this ground truth or sensor detections? Then it reads your real file, shows a summary of columns, units, object count and time span, and proposes a column mapping for you to confirm. It handles coordinate frames for geographic data, remaps IDs, sorts by time, writes plain MATLAB code, runs it and plots the result. You need MATLAB with the Sensor Fusion and Tracking Toolbox.
when:
  - You have a GPS or flight log and want to replay it in a tracking tool.
  - You have radar, lidar or camera detections in a spreadsheet and need to feed them to a tracker.
  - Your trajectory data uses latitude and longitude and you need a local coordinate frame.
  - You are not sure which MATLAB data format fits your recorded measurements.
not_for:
  - "You want to make up a test scenario from scratch: use trackingScenario in MATLAB, not this skill."
  - "Your data is already in the Sensor Fusion and Tracking Toolbox format: load it directly, no import step needed."
  - "You need to design a tracker or work on raw radar signals: ask a tracking engineer or use a radar toolbox."
you_give:
  - A CSV, Excel or text file of tracks or detections
  - "What the data is: truth paths or sensor measurements"
  - Sensor type and units, if the file does not make them clear (optional)
  - The coordinate frame you want out (optional)
you_get:
  - A confirmed column mapping table
  - MATLAB code that loads and converts your file
  - Data in the right tracking format
  - A plot to check the result
how_to_use:
  - Open a chat with an AI that can run MATLAB code. You need MATLAB with the Sensor Fusion and Tracking Toolbox.
  - Paste the skill text into the chat, then add your CSV, Excel or text file.
  - Say if the file holds truth paths or sensor measurements. Add units and sensor type if you know them.
  - Check the column mapping table your AI shows. Fix any wrong row and confirm.
  - Run the code, then look at the plot to check the result.
  - This skill is a copy of the MathWorks source, shared under its BSD-2 licence. The toolbox is a separate MathWorks product.
output_sample:
  input:
    - Your CSV, Excel or text file of tracks or detections
    - Whether it is truth paths or sensor measurements
    - Sensor type and units, if the file does not make them clear (optional)
    - The coordinate frame you want out (optional)
  prerequisites:
    - MATLAB with the Sensor Fusion and Tracking Toolbox
    - An AI that can run MATLAB code
  output:
    - name: Data summary
      contains: Columns, units, number of objects and time span read from your real file.
    - name: Column mapping table
      contains: Each of your columns matched to a tracking field, with any unit change, for you to confirm.
    - name: Output frame choice
      contains: For latitude and longitude data, the coordinate frame you want the result in.
    - name: MATLAB import code
      contains: Plain code that loads your file, remaps IDs, sorts by time and converts it.
    - name: Tracking data
      contains: Truth data or sensor detections in the format the tracking tools expect.
    - name: Plot
      contains: A picture of the converted data so you can check it looks right.
