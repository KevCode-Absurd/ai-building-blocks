new_slug: tracking-number-fixer
name: Tracking number fixer
summary: Give it new tracking numbers. Get them updated on shipments already sent. Changes live orders; customers may get emails.
job: run-your-store
headline: Tracking number fixer
subhead: Give it new tracking numbers. Get them updated on shipments already sent. Changes live orders; customers may get emails.
explain: |
  When a carrier reissues tracking IDs after a label reprint, you can fix many shipped orders in one pass instead of editing each by hand. This skill updates tracking numbers, carriers and links on fulfillments that already exist in your Shopify store.

  It looks up each order first and checks that the fulfillment ID you gave really belongs to it. Then it writes the new tracking details. By default it runs as a dry run, showing what would change without touching anything. Customer emails are off unless you switch them on, because each update can send a new shipping email. It needs a signed-in Shopify command line session with order and fulfillment write access.
when:
  - A carrier gave you new tracking IDs after reprinting labels.
  - Your warehouse partner uploaded corrected tracking numbers for a batch of shipments.
  - Dozens of orders show the wrong tracking link and you want one clean fix.
  - You want to preview a bulk tracking change before it goes live.
you_give:
  - Your store domain
  - A list of orders with fulfillment IDs and new tracking numbers
  - Carrier names and tracking links
  - Whether customers should be emailed (optional)
you_get:
  - A dry-run preview of every change
  - Updated tracking on existing shipments
  - A per-order result with any errors
  - A short summary of what changed
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can access your Shopify admin and change live store data.
