thinking: high
thinking_why: Look-alike marks need careful comparison.
new_slug: trademark-name-first-check
name: Trademark name first-check
summary: Check a trademark name idea before you pay for a full search. You get a flag list of similar marks and risk points. It is not a clearance opinion.
job: check-contracts
headline: Trademark name first-check
subhead: A quick first look at a name you plan to use, so you spot obvious problems before you pay for a full search. The result is a flag list, never a clearance.
explain: |
  A quick first look at a name you plan to use, so you spot obvious problems before you pay for a full search. The result is a flag list, never a clearance. It will not tell you a name is safe, and it says so.

  You describe the name, the goods or services, and the countries. It checks if the name is too generic, descriptive, misleading, a place name, a surname or a functional term. It then searches for similar marks through any connected legal database and walks through the confusion factors used in your region, flagging each one. It ends with next steps and a note to take the result to a trademark lawyer. This is not legal advice and never says a name is clear.

  Licence: Apache 2.0, as the LICENSE file in this item says. We gave it a plain name and added a note for use without the original plugin.
when:
  - You have a brand name idea and want early warning signs before you commit.
  - You are about to buy a domain or print packaging and want a quick sanity check.
  - You need a short memo to take to a trademark lawyer.
  - You are comparing two or three name options.
not_for:
  - "You need a final answer on whether you can use or file a name: hire a trademark lawyer, who will order a full professional search."
  - "You only want to know if a domain or social handle is free: check the domain registrar or the social site directly."
  - "You want a legal opinion that a name is safe: this check never says a name is clear, so ask a trademark lawyer."
you_give:
  - The name you want to use
  - What you will sell under it
  - The countries where you will use it
  - How the name will look, such as plain text or a logo (optional)
you_get:
  - A flag list of intrinsic problems
  - Similar marks found, if a database is connected
  - Notes on confusion risk factors
  - Recommended next steps
how_to_use:
  - "This copy was made for a plugin that is not included. Its practice profile, matter workspace, work-product header and /ip-legal: commands do not exist here, and those steps are skipped. What runs is the eight-step check: intake, name problems, similar marks, confusion factors, memo, next steps."
  - Open your AI tool and add the skill folder, or paste the skill's instructions into a chat.
  - "Gather first: the exact spelling of the name, what you will sell under it, the classes if you know them, the countries, and how the name will look. Type these in."
  - It covers the US, EU and UK well. For another country it will say it has no test for it and tell you to ask a local trademark specialist. It will not apply US rules there.
  - Say if your AI can search trademark registers. Some connectors, such as Solve Intelligence, Descrybe and CourtListener, may cost money or need an API key. Without one, the check only covers the name itself and the risk factors, and skips the similar-marks search.
  - Read the flag list. Check each flag and any similar marks it found.
  - "When it asks about setup, say \"provisional\" to run with US defaults. Use the setup-interview folder inside the skill only if you want a tailored run."
  - Take the memo to a trademark lawyer before you buy, print or file anything. The skill names legal tests such as du Pont, Polaroid and Sleekcraft from memory and gives no case citations. Have the lawyer or a legal database confirm each one before you rely on it.
output_sample:
  input:
    - The name you want to use
    - What you will sell under it
    - The countries where you will use it
    - How the name will look, such as plain text or a logo (optional)
  prerequisites:
    - A trademark database connected to your AI is optional. Without one, the check skips the similar-marks search and only does the name checks and risk factors.
    - No setup is needed. The plugin setup step is optional and only tailors the run to your practice.
  output:
    - name: Proposed mark
      contains: The name, the goods or services, the classes, the countries and how the name will look.
    - name: Knockout issues
      contains: Flags for names that are too generic, descriptive, misleading, a place name, a surname or functional.
    - name: Similar marks check
      contains: Look-alike marks found in any connected database, or a plain note that no database was searched.
    - name: Confusion factors
      contains: Each risk factor used in your region, flagged for a lawyer to review, with no final call.
    - name: Recommended next steps
      contains: What to do next, including taking the memo to a trademark lawyer.
    - name: Citation verification
      contains: A note on which cases or sources named in the memo still need checking.
