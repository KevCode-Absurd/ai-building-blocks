name: Traffic co-simulation builder
summary: Describe the traffic test. Get a Simulink model joined to the SUMO traffic simulator and ready to run.
job: build-software
headline: Traffic co-simulation builder
subhead: Describe the traffic test. Get a Simulink model joined to the SUMO traffic simulator and ready to run.
explain: |
  A Simulink model that runs in step with the SUMO traffic simulator, so you can test a driving controller against moving traffic. You describe the test, and the skill builds the model blocks and the SUMO files.

  It sets up the server and client blocks, adds reader, writer and actor blocks to read vehicle positions and speeds, and controls the ego vehicle. It can add random background traffic without hand-written route files. It also covers a common Windows trap: the SUMO_HOME path needs a trailing separator or every run fails. You need MATLAB, Simulink, the SUMO support package and SUMO installed. It is for driver-assistance and automated-driving testing.
when:
  - You want to test an ADAS controller against realistic traffic.
  - You need to read vehicle speed and position from SUMO inside Simulink.
  - You want to add or remove vehicles while the simulation runs.
  - Your SUMO co-simulation fails to start on Windows.
you_give:
  - A description of the traffic test
  - Your road network and SUMO config files, if you have them (optional)
  - The ego vehicle behaviour you want to control
  - Your SUMO install path
you_get:
  - A Simulink model linked to SUMO
  - Configured reader, writer and actor blocks
  - SUMO files for the scenario
  - Setup fixes for common start-up errors
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run MATLAB with Simulink and SUMO.
