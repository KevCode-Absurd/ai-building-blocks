thinking_why: Many linked blocks and settings must agree.
new_slug: traffic-co-simulation-builder
name: Traffic co-simulation builder
summary: Build a Simulink model linked to the SUMO traffic simulator to test a driving controller against moving traffic. Describe the test and get a saved model.
job: build-software
headline: Traffic co-simulation builder
subhead: A Simulink model that runs in step with the SUMO traffic simulator, so you can test a driving controller against moving traffic. You describe the test, and the skill builds the model blocks and the SUMO files.
explain: |
  Licence: BSD 2-Clause plus a MathWorks-only term, as the LICENSE.md file in this item says. You may use this skill only with MathWorks products, so MATLAB and Simulink are required. The skill file also links MathWorks' own reuse licence (PMRL). LICENSE.md is the one that applies to this copy.

  A Simulink model that runs in step with the SUMO traffic simulator, so you can test a driving controller against moving traffic. You describe the test, and the skill builds the model blocks and the SUMO files.

  It sets up the server and client blocks, adds reader, writer and actor blocks to read vehicle positions and speeds, and controls the ego vehicle. It can add random background traffic without hand-written route files. It also covers a common Windows trap: the SUMO_HOME path needs a trailing separator or every run fails. You need MATLAB, Simulink, the SUMO support package and SUMO installed. It is for driver-assistance and automated-driving testing.
when:
  - You want to test an ADAS controller against realistic traffic.
  - You need to read vehicle speed and position from SUMO inside Simulink.
  - You want to add or remove vehicles while the simulation runs.
  - Your SUMO co-simulation fails to start on Windows.
not_for:
  - "You only want to run SUMO without Simulink: use SUMO's command line tools or its Python TraCI link directly."
  - "You need to model how a car moves and handles: use Vehicle Dynamics Blockset in MATLAB."
  - "You want to design a road scenario with Driving Scenario Designer: that is a different workflow, so use that MATLAB tool."
you_give:
  - A description of the traffic test
  - Your road network and SUMO config files, if you have them (optional)
  - The ego vehicle behaviour you want to control
  - Your SUMO install path
you_get:
  - A Simulink model linked to SUMO
  - Configured reader, writer and actor blocks
  - SUMO files for the scenario
  - Setup fixes for common start-up errors
how_to_use:
  - "Gather first: your .sumocfg file and route files (if you have them), and the path to your SUMO folder for SUMO_HOME."
  - Install MATLAB, Simulink, SUMO and the SUMO support package. MATLAB and Simulink are paid MathWorks products, and the licence allows this skill only with MathWorks products (see LICENSE.md). SUMO is free. Set SUMO_HOME to your SUMO folder.
  - Open an AI that can run MATLAB code, for example one with a MATLAB connection (MCP) set up, and add this skill. If yours cannot run MATLAB, ask it for the code and run it yourself.
  - Describe your traffic test. Add your .sumocfg file if you have one (optional).
  - Tell it which vehicle is the ego vehicle and how it should be controlled.
  - Check that the model, .sumocfg and route files were saved, then open the .slx file in Simulink and press Run.
  - Log the speed and position signals to read the results. Check the ego vehicle's speed and gap to other cars first. Then export the logged speed and gap data from the saved .slx run for a controller review, or connect your own controller to the model.
output_sample:
  input:
    - A description of the traffic test
    - Your SUMO config file (.sumocfg), if you have one (optional)
    - The ego vehicle behaviour you want to control
    - Your SUMO install path
  prerequisites:
    - MATLAB with Simulink
    - The Automated Driving Toolbox Interface for Eclipse SUMO Traffic Simulator support package
    - Eclipse SUMO installed, with the SUMO_HOME setting pointing to it
    - An AI that can run MATLAB code
  output:
    - name: Simulink model (.slx)
      contains: The saved model with Server and Client blocks, plus the Reader, Writer and Actor blocks set up for your test.
    - name: Network file (.net.xml)
      contains: The road network SUMO drives on, made with netgenerate or converted from OpenDRIVE when you ask for a new one.
    - name: SUMO config file (.sumocfg)
      contains: Points SUMO to the network, sets the time range and step length, and lists route files if used.
    - name: Route file
      contains: Vehicle and route entries sorted by departure time, used for the ego vehicle and set routes.
    - name: SUMO_HOME fix
      contains: A short MATLAB step that adds the missing trailing separator so Windows runs do not fail to start SUMO.
    - name: Run and save step
      contains: The model is saved to your folder and run, so you can check that SUMO starts.
