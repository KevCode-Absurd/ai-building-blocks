thinking: low
thinking_why: It turns a script into a set structure of experiment settings.
new_slug: training-experiment-setup-helper
name: Training experiment setup helper
summary: Turn your MATLAB training script into a training experiment setup that sweeps settings in Experiment Manager, with live edits in the app.
job: build-software
headline: Training experiment setup helper
subhead: Instead of changing settings by hand and rerunning, you get a MATLAB experiment that sweeps them for you. Your training script becomes a set of runs you can compare, and the Experiment Manager screen updates as you edit.
explain: |
  Instead of changing settings by hand and rerunning, you get a MATLAB experiment that sweeps them for you. Your training script becomes a set of runs you can compare, and the Experiment Manager screen updates as you edit.

  You give it a script or a plain description. It reads the code, finds the settings worth varying, and builds the experiment with the right strategy and parameter values. You can then add, rename, duplicate, edit or delete experiments, and the tree and editor in the app change live without a restart. It only manages the experiment itself. It does not run, analyse or export results. You need MATLAB and Experiment Manager.
when:
  - You have a training script and want to try ten learning rates.
  - You want to edit sweep values and see the app update right away.
  - You need to rename or copy an experiment without breaking it.
  - You are not sure how to describe a parameter sweep in Experiment Manager.
not_for:
  - "You want to train or design a neural network: ask your AI for the matlab-train-network skill, or build it by hand in MATLAB."
  - "You want to run, compare or export experiment results: do that in Experiment Manager itself, because this skill only sets up the experiment."
  - "You want to fix or tidy plain MATLAB code with no experiment: use the matlab-debug-code or matlab-review-code skills, or a MATLAB editor."
you_give:
  - Your training script or a description of it
  - Which settings to sweep and their values
  - The experiment name you want (optional)
you_get:
  - A new Experiment Manager experiment
  - Parameter values set from your code
  - Live edits shown in the app
  - Answers about the strategy and settings
how_to_use:
  - Open an AI that can run MATLAB code, and start MATLAB with Experiment Manager open. MATLAB and Experiment Manager are paid MathWorks products that need a licence. This skill will not work in a plain chat with no MATLAB.
  - Copy the skill folder to your computer and point your AI at it. In MATLAB, add its scripts folder to the path with addpath('<skill folder>/scripts'). The licence on this copy (BSD 2-Clause, see LICENSE.md) allows use only with MathWorks products.
  - Paste your training script, or describe it. Say which settings to sweep, such as learning rate.
  - Ask your AI to create the experiment. It reads the code, picks the settings and builds the experiment.
  - Check the new experiment in Experiment Manager. Ask for edits, a new name or a copy, and the app updates.
  - Run the experiment and look at the results yourself in Experiment Manager. This skill does not do that.
output_sample:
  input:
    - Your training script, or a plain description of it
    - Which settings to sweep and their values (optional)
    - The name you want for the experiment (optional)
  prerequisites:
    - MATLAB with Experiment Manager installed
    - An AI that can run MATLAB code, such as through the MATLAB MCP tool
    - The skill's scripts folder added to your MATLAB path
  output:
    - name: New experiment
      contains: An experiment in Experiment Manager built from your script, with its strategy and parameters set.
    - name: Parameter values
      contains: The settings your code uses, each listed as a named parameter with the values to sweep.
    - name: Live app update
      contains: The experiment tree and editor change as you add, edit, rename, copy or delete, with no restart.
    - name: Reply to you
      contains: A short note on what was created or changed, and the strategy and settings used.
