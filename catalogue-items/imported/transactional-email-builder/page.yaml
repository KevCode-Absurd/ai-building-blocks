thinking: medium
thinking_why: It builds from set parts and checks each in the preview.
new_slug: transactional-email-builder
name: Transactional email builder
summary: Build your app's welcome, verify, password reset and invoice emails as real code. Get a transactional email builder with preview and dark mode.
job: build-software
headline: Transactional email builder
subhead: The emails your app sends, such as welcome, verify, password reset and invoice, built as real code you can ship. They include dark mode styles and translated text, and you preview them before you send.
explain: |
  The emails your app sends, such as welcome, verify, password reset and invoice, built as real code you can ship. They include dark mode styles and translated text, and you preview them before you send.

  The skill writes React Email templates, or MJML where wide email client support matters. It wires them to Resend through one send function. Postmark, SendGrid or AWS SES need one extra provider file, which your AI writes on request. It adds a local preview server with hot reload. It handles translated text in one file per language, dark mode styles, UTM links and open and click tracking. A spam checklist helps reduce the chance of spam placement. No setup guarantees inbox delivery. You need a code project, Node and an account with one email provider. The sample copy and the trial length in the welcome email are placeholders. Replace them with facts about your own product before you send.

  Licence: MIT, as the LICENSE file in this item says. Credit goes to the original author.
when:
  - You are adding sign-up and password emails to a new product.
  - Your old email system is hard to change and you want to replace it.
  - Your emails land in spam or look broken in some apps.
  - You need the same emails in several languages.
not_for:
  - "You want to send marketing newsletters or campaigns: use your existing email campaign tool instead."
  - "You do not have a code project or Node set up: ask a developer to set it up first, or use your email provider's built-in template editor."
  - "You only need to fix the wording of one email: edit the text in your current template by hand."
you_give:
  - The list of emails your app sends
  - Your email provider choice
  - Your brand colours and logo
  - Languages you support (optional)
you_get:
  - Coded email templates
  - A provider-agnostic send setup
  - A local preview server
  - A spam and dark mode checklist
how_to_use:
  - Gather your list of emails and your email provider's API key. The ready code uses Resend. For another provider, ask your AI to add its provider file.
  - Open your AI in a tool that can write files and run code. Paste in the skill and your list.
  - Ask for the layout and one template first. Check it, then ask for the rest. Only the welcome and invoice emails come as ready code. Your AI writes the others in the same shape.
  - Run the preview server. Check each email in light and dark mode. No template guarantees it looks right everywhere, so send a test to the email apps your customers use, such as Gmail, Outlook and Apple Mail, before your first real send.
  - Replace every bracketed placeholder and sample detail (company address, trial length, seat limit) with your real ones. Send a test email to yourself and check that the unsubscribe and tracking links work. Then work through the spam checklist and test with Mail-Tester before your first real send. Keep marketing sends on a separate domain.
  - After your first real send, check bounce and spam-complaint rates in your provider's dashboard. For marketing mail, pair this with your existing email campaign tool.
output_sample:
  input:
    - The list of emails your app sends
    - Your email provider choice (Resend, Postmark, SendGrid or AWS SES)
    - Your brand colours and logo
    - Languages you support (optional)
  prerequisites:
    - An AI that can write files and run code
    - A code project with Node installed
    - An account with one email provider
  output:
    - name: Email layout and button
      contains: A shared layout with brand header and footer, and a button part used by every template.
    - name: Email templates
      contains: Full code for the welcome and invoice emails. Your AI writes verify email, password reset, notification and weekly digest in the same shape.
    - name: Unified send function
      contains: One send function wired to Resend. For Postmark, SendGrid or AWS SES, your AI adds one provider file in the same shape.
    - name: Preview server
      contains: A local page that shows each email and reloads when you change the code.
    - name: i18n files
      contains: Translated text for each language, kept in one file per language.
    - name: Tracking helper
      contains: Code that adds UTM tags to the links in your emails.
    - name: Spam score checklist
      contains: A list of checks to run before your first send, to reduce the chance of landing in spam.
