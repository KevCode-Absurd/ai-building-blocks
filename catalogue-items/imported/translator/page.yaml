thinking: low
thinking_why: Translation is a standard task.
new_slug: translator
name: Translator
summary: Translate text into another language so it reads like a local wrote it. Keeps your terms, tone and formatting the same throughout.
job: write-and-tell-stories
headline: Translator
subhead: Text in another language that reads as if a local wrote it, with the same tone and the same terms every time. You do not get stiff word-for-word output.
explain: |
  Text in another language that reads as if a local wrote it, with the same tone and the same terms every time. You do not get stiff word-for-word output.

  The skill first reads your text for field, formality and audience. For specialised content it builds a short glossary so a key term is never translated two ways. It translates while keeping formatting such as Markdown, code blocks, HTML tags, JSON keys and placeholders. Then it adapts units, dates, currency and sayings to the target place, rereads for gaps or repeats, and adds short notes where a choice was tricky. You can set formal or informal, give a glossary and pick the output format.
when:
  - You need marketing copy translated so it sounds natural, not literal.
  - You must translate app messages without breaking placeholders.
  - You want one term to stay the same across a long document.
  - You need dates and units changed for a different country.
not_for:
  - "You need a certified legal, medical or official document: use a qualified human translator and have them sign it off."
  - "You are publishing live text to customers: ask a native speaker to read it first."
  - "You only want to fix the grammar of text in the same language: use a plain proofread step in your AI chat."
you_give:
  - The text to translate
  - The target language
  - Formality and field, such as legal or casual (optional)
  - A glossary of required terms (optional)
you_get:
  - A natural translation
  - Formatting and placeholders kept intact
  - Local units and dates
  - Translator notes on tricky choices
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the skill instructions into the chat.
  - Paste your text. Say the language you want, and the formality if it matters.
  - Add your list of required terms if you have one (optional).
  - Read the translator notes first. They show where your AI had to make a choice.
  - Ask a native speaker to check the result before you publish it. For a JSON file, load it into your app's language setup after the check.
output_sample:
  input:
    - The text you want translated
    - The language you want it in
    - Formality and field, such as legal or casual (optional)
    - A list of terms that must be translated a set way (optional)
    - The language it is written in, if unclear (optional)
  output:
    - name: Translated text
      contains: Your text in the new language, in the same format as the original, with tone and terms kept steady.
    - name: Preserved formatting
      contains: Markdown, HTML tags, code blocks, JSON keys and placeholders such as {username} left unchanged and placed correctly.
    - name: Local units and dates
      contains: Units, dates, currency and sayings changed to suit the place where the text will be read.
    - name: Translator notes
      contains: Short notes on tricky choices, such as terms kept in English or a formal or informal form picked.
    - name: Variants (if asked)
      contains: Each formality level or regional version, clearly labeled, when you ask for more than one.
