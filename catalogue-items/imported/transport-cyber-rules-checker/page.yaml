thinking: high
thinking_why: Rules vary by operator type and need careful reading.
new_slug: transport-cyber-rules-checker
name: Transport cyber rules checker
summary: Check whether TSA cyber rules cover your pipeline, rail or transit operation. Get a gap list, draft plan sections and a CISA reporting procedure.
job: check-contracts
headline: Transport cyber rules checker
subhead: Share your US transport type and TSA status; check current directives, operator coverage, and facts still needed.
explain: |
  Share your operator type and TSA status. The skill checks current directives, maps supported requirements and flags open questions.

  It asks which sector and directive series you fall under, then matches your operation to the rules. It supports gap tables with status, evidence needed and priority. It drafts the plans the rules call for, such as the cybersecurity implementation plan, operational plan and assessment plan, and lays out the steps and timing for reporting incidents to CISA. It also reviews how your office and operational networks are separated. It is guidance, so check final decisions with counsel or TSA. Directive revision letters and dates change, and the skill's own tables are the author's last check, so it verifies them against TSA's pages first.

  Licence: MIT, as the LICENSE file in this item says. Credit goes to the original author.
when:
  - You run a pipeline or railroad and are not sure TSA directives apply.
  - You must write a cybersecurity implementation plan.
  - You need to know what to report to CISA and how fast.
  - You want a gap list before a TSA review.
not_for:
  - "You run an airline or airport: ask TSA directly, because this skill does not cover aviation rules."
  - "You need a legal reading of a directive or a decision on fines: ask a lawyer who knows TSA rules, or ask TSA."
  - "You have no TSA letter naming you as covered: confirm your status with TSA first, then come back."
  - "You want to submit the plans to TSA: do not send any plan drafted here (the implementation plan, assessment plan or incident response plan) until counsel or TSA has reviewed it."
you_give:
  - Your sector, such as pipeline, freight rail or transit
  - What your critical systems are
  - Your current security controls
  - Network layout between IT and operations (optional)
you_get:
  - Possible coverage with official sources and check dates
  - A gap table with priorities
  - Draft plan sections
  - An incident reporting procedure
how_to_use:
  - Open your AI and use one that can search the web. The skill must check TSA's official pages first.
  - Paste the skill text, then tell it your operator type and whether you hold a TSA designation letter.
  - Add your critical systems, current controls and network layout (optional).
  - Ask for the applicability check first. Read the sources and check dates before you go on.
  - Then ask for the gap table, plan drafts and reporting procedure.
  - Confirm CISA contact details on the CISA site, and have counsel or TSA review before you rely on anything.
  - Next, take the priority rows of the gap table to counsel or to TSA, and give each draft plan section to a named owner on your team. The rules and revision dates change, so run the applicability check again before each review.
output_sample:
  input:
    - Your operator type, such as pipeline, freight rail, transit or bus
    - Your TSA status or designation letter, if you have one
    - Your critical systems and current security controls
    - Your office and operations network layout (optional)
  prerequisites:
    - An AI that can search the web, so it can check current TSA sources
    - Your TSA directive series or designation letter, if you have one
  output:
    - name: Applicability check
      contains: Whether TSA rules may cover you, with source links, check dates and any facts still missing.
    - name: Gap assessment
      contains: A table of each requirement with status, evidence needed and priority.
    - name: Implementation plan draft
      contains: Draft sections for the cybersecurity implementation plan, operational plan and assessment plan.
    - name: Incident response procedure
      contains: Steps and timing for reporting incidents to CISA and TSA, with contacts to confirm.
    - name: Network separation review
      contains: Notes on how your office and operational networks are split, and where they are not.
    - name: Policy drafts
      contains: Short policy text for the gaps found, ready for your team to review.
