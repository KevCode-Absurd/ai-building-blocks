thinking: high
thinking_why: Triggers need tuning to the signal.
new_slug: triggered-radio-capture-helper
name: Triggered radio capture helper
summary: Set up a triggered radio capture that records only when your signal appears. Get MATLAB code for NI USRP radios, plus a check that it caught the real thing. Needs paid MathWorks products and MathWorks-only use.
job: build-software
headline: Triggered radio capture helper
subhead: A software radio that saves data only when your signal shows up, instead of recording all the time. You tell it what to catch, and it writes the capture code and checks it works. It needs a USRP radio, paid MATLAB and Wireless Testbench, and use is limited to MathWorks products.
explain: |
  A software radio that saves data only when your signal shows up, instead of recording all the time. You tell it what to catch, and it writes the capture code and checks it works.

  The skill works with NI USRP radios and MATLAB Wireless Testbench. It picks between energy detection, for any strong signal, and preamble detection, for a known pattern. It chooses from seven ready capture patterns, checks every setting against the API limits, and runs a sanity ratio on the result to see if it caught a real signal. If nothing fires, or it fires on noise, it switches to a step-by-step threshold tuning routine. You need the radio, MATLAB and the toolbox, all paid products. The capture runs only when the detector fires, so how much it saves depends on your signal.

  This is MathWorks' skill. The licence that applies is the LICENSE.md file in this item: BSD 2-Clause plus a rule that you may use it only with MathWorks products such as MATLAB. A web link inside the skill file points to a different MathWorks licence page. Follow the LICENSE.md file.
when:
  - You want to record a burst signal without storing hours of noise.
  - Your detector never fires, or fires on every bit of noise.
  - You need to catch a known preamble from a wireless device.
  - You want a repeatable capture script for lab tests.
not_for:
  - "You have no NI USRP radio or MATLAB Wireless Testbench: use your radio maker's own capture tool, or record a plain continuous capture."
  - "You want to decode or analyse a signal you already saved: use MATLAB's own signal tools on that file."
  - "You do not know the signal's frequency or bandwidth: scan the band with a spectrum analyser first, then come back."
you_give:
  - The signal to catch, such as its frequency and bandwidth
  - Your radio model and setup
  - A known preamble, if you have one (optional)
  - What the signal looks like on a spectrum plot (optional)
you_get:
  - MATLAB capture code for your radio
  - A chosen detector and thresholds
  - A check that the capture is a real signal
  - Tuning steps if detection fails
how_to_use:
  - "Set up first: an NI USRP radio, MATLAB and Wireless Testbench. These are paid products, and the licence allows this skill only with MathWorks products (BSD 2-Clause plus MathWorks terms, see LICENSE.md). Note your radio model, centre frequency and bandwidth."
  - Open a chat with an AI that can read the skill folder, including its references folder. The skill needs those files, so paste them in too if your AI cannot read files.
  - Tell it which signal to catch. Add a known preamble if you have one.
  - Answer any questions it asks. It will not guess missing values.
  - Run the MATLAB code on your radio. This needs the radio and MATLAB, so a plain chat cannot run it.
  - Check the status and ratio it reports. If nothing fires or it fires on noise, ask for the threshold tuning steps. Then pass the saved samples to your MATLAB signal tools, or pair it with the Radio transmit and capture helper.
output_sample:
  input:
    - The signal to catch, such as its centre frequency and bandwidth
    - Your radio model and setup
    - A known preamble, such as WLAN or 5G NR (optional)
    - What the signal looks like on a spectrum plot (optional)
  prerequisites:
    - An NI USRP radio
    - MATLAB with Wireless Testbench installed
    - An AI that can run MATLAB, or you run the code yourself
  output:
    - name: Detector choice
      contains: Energy detection for any strong signal, or preamble detection for a known pattern, with the reason for the pick.
    - name: Checked settings
      contains: Your parameters tested against the API limits before any code is written.
    - name: Capture code
      contains: One MATLAB script with a Verify section, built from one of seven ready capture patterns and set for your radio and signal. It prints the ratio r.
    - name: Capture results (data, status, r)
      contains: The captured samples, a status showing whether a trigger fired, and a ratio that shows if it was a real signal.
    - name: Threshold tuning steps
      contains: A plot, diagnose and adjust routine, given when nothing fires or it fires on noise.
