thinking: medium
thinking_why: It weighs proof against doubts for one audience.
new_slug: trust-barrier-fixer
name: Trust barrier fixer
summary: Find why your audience doubts your message. Get the trust barriers, the proof that fits each one, and how bold each claim should sound.
job: understand-customers
headline: Trust barrier fixer
subhead: The doubts your audience really holds, and the proof and claim strength that settle them. You stop overclaiming to people who do not believe you, and stop underselling to people who would.
explain: |
  The doubts your audience really holds, and the proof and claim strength that settle them. You stop overclaiming to people who do not believe you, and stop underselling to people who would.

  You give the message and the people it is for. The skill names what is missing in their eyes: skill, good intent, proof, familiarity or legitimacy. It checks whether your category is trusted, distrusted or split, then picks signals to match, such as reviews, guarantees, certifications, plain facts or named people. It rates how certain each claim should sound. It labels psychology ideas as working hypotheses to check, not as proven fact, so use your own audience data too.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. Credit goes to MMEHDI0606 and sickn33.
when:
  - Your page claims a lot, but visitors do not buy.
  - You sell in a category where people feel burned before.
  - You are not sure how bold your headline can be.
  - You need to decide which proof to show first.
not_for:
  - "You have a brand-new offer with no customer data: talk to a few real buyers first, then come back."
  - "You need legal or medical claims checked: ask a compliance reviewer or a lawyer, not this skill."
  - "You want to fake reviews or authority: this skill only builds trust with real proof, so use none."
you_give:
  - Your message or page copy
  - Your target audience
  - What you want them to do
  - Past customer feedback or objections (optional)
you_get:
  - A list of trust barriers
  - Proof signals matched to each barrier
  - Claim strength advice
  - Reworded lines to try
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. It needs no code, files or paid tools.
  - Paste your message or page copy. Say who it is for and what you want them to do.
  - Add past customer feedback or objections if you have them.
  - "Your AI works in this order: it names the barrier, checks how much your kind of offer is trusted, picks the proof signal, places it before the riskiest decision, then checks that nothing overclaims."
  - Check the first barrier it names. Ask it to redo that part if it does not match what you hear from customers.
  - Compare the barrier the AI names with real customer feedback, such as reviews, emails and support questions. Drop any claim you cannot back with proof you hold.
  - Try the reworded lines. Only use proof you really have.
  - Test the new lines on real customers or in a small A/B test before you roll them out. Then use the Social proof placer to decide where each piece of proof goes.
output_sample:
  input:
    - Your message or page copy
    - Who it is for
    - What you want them to do
    - Past customer feedback or objections (optional)
  output:
    - name: Trust barrier
      contains: "What your audience feels is missing: skill, good intent, proof, familiarity or legitimacy."
    - name: Category baseline
      contains: Whether people trust, distrust or disagree about your kind of offer, and how much proof that calls for.
    - name: Trust signal
      contains: The proof that fits each barrier, such as results, credentials, endorsements, plain facts or a view of your process.
    - name: Signal placement
      contains: Where in the page or funnel to show each signal, before the riskiest decision.
    - name: Repair risk check
      contains: Places where a line may sound defensive, exaggerated or pushy, and how to calm it.
