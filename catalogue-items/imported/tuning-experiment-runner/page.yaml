when:
  - You want to tune model settings with a small, fixed budget.
  - You need a record of what you tried and what each trial scored.
  - You tune prompts or search settings against a score you can measure.
  - You are not sure when to stop trying new settings.
not_for:
  - Your goal is a matter of taste and has no score. Ask a person to review the options instead.
  - You have only a few settings to try. A single manual A/B test costs less than a search.
  - You have not agreed to spend compute or paid API money. Get that approval first, then come back.
  - You only need to fix a bug or review code. Ask your AI for a plain code review instead.
you_give:
  - One score to improve, and whether higher or lower is better
  - The settings to tune, with their ranges and defaults
  - A budget in trials, time or money
  - A way to run a trial and read its score
you_get:
  - A baseline result from your current settings
  - A trial log with settings, scores and notes
  - The best settings found and the gain over the baseline
  - A stop reason and a final summary with tradeoffs
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Say the one score to improve, the settings with their ranges, and your current settings.
  - Set a cap on trials, time or money before the first run. Trials can use paid API calls or compute. Ask your AI for a cost estimate for one trial and for the whole budget, and say yes only if it is fine. Stop at the cap.
  - Let your AI run the baseline, then one trial at a time. Code running helps here. If it cannot run code, run each trial yourself and paste back the score.
  - Read the trial log and the stop reason. Check the best settings on held-out data or a fresh run before you rely on them. Then save the winning settings to your config, and record the baseline score, the best score, the trial count and the date next to them.
  - Next, if the winning settings will run in a live product, test them against your current settings with the A/B test verdict maker before you switch everything over.
output_sample:
  input:
    - The one score to improve, and whether higher or lower is better
    - The settings to tune, with ranges and defaults
    - A budget in trials, time or money
    - A way to run a trial and read its score
  prerequisites:
    - An AI that can run code, or a way for you to run each trial and report the score
    - Permission to use compute or paid API calls
  output:
    - name: Baseline
      contains: The score of your current settings, run before any change, so every trial has something to beat.
    - name: Trial log
      contains: One row per trial with settings, score, notes and whether it failed.
    - name: Comparison
      contains: How the best trial stacks up against the baseline and a simple search.
    - name: Stop decision
      contains: "Why the search ended: budget used up, gains flattened, or no good next trial."
    - name: Recommendation
      contains: The best settings found, the measured gain, the tradeoffs and what to check before real use.
