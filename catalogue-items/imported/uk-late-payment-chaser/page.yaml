thinking: medium
thinking_why: A script does the sums and the AI writes staged emails.
new_slug: uk-late-payment-chaser
name: UK late payment chaser
summary: Work out UK late payment interest and the fixed fee on an overdue business invoice. Get three reminder emails ready to send.
job: track-numbers
headline: UK late payment chaser
subhead: When a UK business customer pays late, the law lets you claim interest and a fixed fee. This skill works out the exact amount and writes the reminder emails.
explain: |
  When a UK business customer pays late, the law lets you claim interest and a fixed fee. This skill works out the exact amount and writes the reminder emails.

  You give the unpaid amount and the invoice date. A script, not the AI, does the maths: 8% over the Bank of England base rate, the fixed fee of 40, 70 or 100 pounds by debt size, and the due date under the 30-day rule if none was agreed. It handles public bodies and flags consumers, where the law differs. You then get a short sequence of polite but firm emails with placeholders for names and bank details. It covers business debts in the UK only and is not legal advice.
when:
  - A client is past due and you want to know what you can add.
  - You need a polite first reminder and a firmer second one.
  - You are a freelancer and unsure if the late payment law covers you.
  - You want a record of how the interest was calculated.
not_for:
  - "The customer is a private person buying for themselves: the Act does not apply, so write a plain reminder or ask a solicitor."
  - "The invoice is disputed, the customer is insolvent or your contract has its own interest clause: check with a solicitor first."
  - "You need a court claim or contract drafting: use GOV.UK Make a court claim for money, or a solicitor."
you_give:
  - The unpaid amount
  - The invoice date
  - The agreed payment date or terms (optional)
  - Customer type, such as business or public body (optional)
you_get:
  - Interest and fixed fee worked out
  - A dated calculation
  - A sequence of reminder emails
  - Notes on what the law does and does not cover
how_to_use:
  - Open Claude, ChatGPT or Gemini in a mode that can run code. Add the skill folder, or paste the SKILL.md text into the chat.
  - Type the unpaid amount and the invoice date. Add the agreed payment terms and customer type if you know them.
  - Let your AI run the script. It tries the Bank of England site for the base rate, and if that fails it uses a rate table that comes with the skill and tells you so.
  - Check the figures, the rate note and the date assumptions. Check the base rate yourself before you send.
  - Fill in every [CONFIRM] placeholder, then send email 1. Send emails 2 and 3 if the invoice stays unpaid.
  - If you add interest, send a new invoice for it, as GOV.UK advises.
output_sample:
  input:
    - The unpaid invoice amount
    - The invoice date
    - The agreed payment date or terms (optional)
    - "Customer type: business, public body or consumer (optional)"
    - Today's date, if you want figures for another day (optional)
  prerequisites:
    - An AI that can run code, so a script does the sums
    - "Internet access is helpful but not needed: the script falls back to a rate table that comes with the skill"
  output:
    - name: Position line
      contains: One sentence saying the last day to pay on time, when interest starts and how many days late the invoice is.
    - name: What you can claim
      contains: A table of the unpaid amount, interest to date, the fixed sum, the total today and the daily interest.
    - name: Notes
      contains: Up to four short bullets on how the due date was set, warnings from the script and the source of the rate.
    - name: "Email 1: Friendly reminder"
      contains: A polite note that assumes an oversight and restates the amount, invoice and how to pay, with no mention of interest.
    - name: "Email 2: Firm reminder"
      contains: States your right to interest and the fixed sum under the 1998 Act, with the figures and the daily amount.
    - name: "Email 3: Final reminder"
      contains: Gives the total now due and a seven day deadline, then says you will consider formal recovery.
    - name: Before you send
      contains: A short list of every placeholder to fill in, plus the GOV.UK note on sending a new invoice with interest.
