thinking: medium
thinking_why: Wrong answers must reveal specific mistakes.
new_slug: understanding-check-questions
name: Check-for-understanding question writer
summary: Write a check-for-understanding question for mid-lesson. Each wrong answer shows a real mistake, so you know who to reteach.
job: teach-and-train
headline: Check-for-understanding question writer
subhead: One short, sharp question that shows who understands and who does not, so you know whether to move on or reteach. Wrong answers are built from real misconceptions, so each tells you something.
explain: |
  One short, sharp question that shows who understands and who does not, so you know whether to move on or reteach. Wrong answers are built from real misconceptions, so each tells you something.

  You give the idea you just taught, the age group and what has been covered. The skill writes a multiple choice question that students can answer in under two minutes, with one correct answer and distractors that each match a specific mistake. It tells you what each wrong choice reveals and what to do next for each group. It suits mini whiteboards, fingers for A to D or clickers. Add known misconceptions and the distractors will target them.
when:
  - You are halfway through a lesson and need to know if it landed.
  - You want a question that sorts students by their mistake.
  - You plan the key checkpoint of a lesson in advance.
  - You want an easy way to see answers across the room.
not_for:
  - "You want open discussion or answers that need written reasoning: ask a few open questions yourself, or use an exit ticket."
  - "You want to test memory of old lessons: use a short retrieval quiz written by you or your AI."
  - "You need a full end-of-unit test: write a longer assessment with your department instead."
you_give:
  - The concept you are teaching
  - Student age or year group
  - What was taught so far in this lesson
  - Known misconceptions (optional)
  - How students will answer (optional)
you_get:
  - One diagnostic question
  - Distractors tied to misconceptions
  - What each answer means
  - Next steps for each group
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page. No code, files or paid tools are needed.
  - Type the idea you just taught, the year group and what you have covered so far.
  - Add known mistakes and how students will answer (optional), such as mini whiteboards or fingers for A to D.
  - Read the question and the Diagnostic Key. Check that each wrong answer matches a mistake your students really make.
  - Ask the question in class. Compare the answers you see with the Decision Guide, then move on or reteach.
output_sample:
  input:
    - The idea you just taught
    - Your students' age or year group
    - What you have taught so far in this lesson
    - Mistakes students often make (optional)
    - How students will answer, such as mini whiteboards or fingers (optional)
  output:
    - name: The Question
      contains: One multiple choice question with a short stem, answer options and the correct answer, built to answer in under two minutes.
    - name: Diagnostic Key
      contains: What each answer choice shows about a student's thinking, and which mistake each wrong choice matches.
    - name: Decision Guide
      contains: What to do next based on how the class answers, such as move on, reteach or split the group.
    - name: Design Rationale
      contains: Why the question and wrong answers were chosen, so you can check or change them.
