thinking: medium
thinking_why: Wrong answers must reveal specific mistakes.
new_slug: understanding-check-questions
name: Check-for-understanding question writer
summary: Give it a lesson point. Get a quick question that shows who understands and who needs more help.
job: teach-and-train
headline: Check-for-understanding question writer
subhead: Give it a lesson point. Get a quick question that shows who understands and who needs more help.
explain: |
  One short, sharp question that shows who understands and who does not, so you know whether to move on or reteach. Wrong answers are built from real misconceptions, so each tells you something.

  You give the idea you just taught, the age group and what has been covered. The skill writes a multiple choice question that students can answer in under two minutes, with one correct answer and distractors that each match a specific mistake. It tells you what each wrong choice reveals and what to do next for each group. It suits mini whiteboards, fingers for A to D or clickers. Add known misconceptions and the distractors will target them.
when:
  - You are halfway through a lesson and need to know if it landed.
  - You want a question that sorts students by their mistake.
  - You plan the key checkpoint of a lesson in advance.
  - You want an easy way to see answers across the room.
you_give:
  - The concept you are teaching
  - Student age or year group
  - What was taught so far in this lesson
  - Known misconceptions (optional)
  - How students will answer (optional)
you_get:
  - One diagnostic question
  - Distractors tied to misconceptions
  - What each answer means
  - Next steps for each group
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
