thinking: medium
thinking_why: It tracks units and errors by set rules and flags what breaks them.
new_slug: units-and-error-margin-checker
name: Units and error margin checker
summary: Check units and carry error margins through your calculation. Get an uncertainty budget and a rounded result you can show a reviewer.
job: track-numbers
headline: Units and error margin checker
subhead: A calculation with its units checked and its error margin carried through, ending in an uncertainty budget you can show a reviewer. The plus or minus on your result then means something.
explain: |
  A calculation with its units checked and its error margin carried through, ending in an uncertainty budget you can show a reviewer. The plus or minus on your result then means something.

  The skill uses the pint and uncertainties Python libraries. It converts units, including ones that need context such as wavelength to energy, and flags mismatches. It follows the standard method for expressing measurement uncertainty: list each source, add them correctly, handle linked inputs, and pick a coverage factor you can defend. It also reads curve fits without losing correlations, rounds results properly, and audits code for silent unit mistakes. It needs Python 3.12 or newer.
when:
  - Your result needs a plus or minus that you can defend.
  - You mix units and suspect a hidden conversion error.
  - You must build an uncertainty budget from calibration certificates.
  - You want to review analysis code for unit mistakes.
not_for:
  - "You need statistical inference, model selection or study design: use statistical-analysis, statistical-power or experimental-design instead."
  - "You only want a quick unit conversion with no error margin: use a unit converter or a search engine."
  - "Your AI cannot run code and you cannot install Python: ask a colleague who works in metrology to check the budget by hand."
you_give:
  - Your calculation or formula
  - Measured values with units
  - Calibration certificates or specifications (optional)
  - Your analysis code (optional)
you_get:
  - Checked unit conversions
  - Uncertainty carried through the calculation
  - An uncertainty budget table
  - A correctly rounded result
how_to_use:
  - Open an AI that can run code, such as Claude with code running turned on. Make sure Python 3.12 or newer is installed.
  - Paste the skill instructions into the chat, or upload the skill folder.
  - List each measured input with its unit and its stated uncertainty. Add your formula.
  - Add calibration certificates or your analysis code if you have them (optional).
  - Ask your AI to run the uncertainty budget and report the result.
  - Check the unit flags first. Then share the budget and the rounded result with your reviewer.
output_sample:
  input:
    - Your calculation or formula
    - Each measured value with its unit
    - Calibration certificates or specifications (optional)
    - Your analysis code (optional)
  prerequisites:
    - An AI that can run code
    - Python 3.12 or newer with pint, uncertainties, NumPy and SciPy installed
  output:
    - name: Unit check
      contains: Each conversion is checked, with any mismatch or stripped unit in your calculation flagged.
    - name: Uncertainty budget
      contains: Each source of error is listed with its type, size and share of the total.
    - name: Propagated uncertainty
      contains: The error margin carried through your formula, with linked inputs handled so correlations are kept.
    - name: Coverage factor and expanded interval
      contains: The coverage factor you can defend and the wider interval it gives.
    - name: Rounded result
      contains: Your answer rounded properly, in plus or minus form and in other common forms.
    - name: Method statement
      contains: The sentence that must go with the number so a reader knows what the plus or minus means.
    - name: Code audit
      contains: Silent unit and uncertainty mistakes found in your analysis code, if you shared it.
