thinking: low
thinking_why: It matches each file against where it is used.
new_slug: unused-store-file-finder
name: Unused store file finder
summary: "Find unused files in your Shopify store: images, videos and files no product, page or post uses. Get a CSV list with sizes to clear clutter."
job: run-your-store
headline: Unused store file finder
subhead: A list of every image, video and file in your Shopify store that no product, page or blog post actually uses. Orphaned files eat storage, clutter your media library and bury the brand assets you want to find.
explain: |
  A list of every image, video and file in your Shopify store that no product, page or blog post actually uses. Orphaned files eat storage, clutter your media library and bury the brand assets you want to find.

  The skill reads your whole file library, then reads the media on every product, the HTML of every page and the body of every article. It matches each file by ID and web address, and flags the ones nothing points to. A minimum age setting (30 days by default) skips files you just uploaded. It only reads. Nothing is deleted, so you decide what goes. It needs a Shopify command line login with read access to files, products and content.
when:
  - Your media library has thousands of files and you cannot tell which ones matter.
  - You are close to a storage limit and want to know what is safe to remove.
  - You are tidying the store before a redesign or a move to a new theme.
  - You want a clean list to hand to someone who will do the manual cleanup.
not_for:
  - "You want to delete files right away: spot-check 10 random files in your Shopify admin first, then remove them by hand."
  - "Your store shows images from the theme, emails, metafields or checkout: this check cannot see those, so ask your theme developer to check them."
  - "You have no Shopify login with read access: ask the store owner to give you access first."
you_give:
  - Your store domain
  - A minimum file age in days (optional)
  - A file type filter such as images only (optional)
  - A Shopify login with read access
you_get:
  - A list of unused files with links and sizes
  - Total space the unused files take up
  - A sample of the oldest orphans
  - A JSON version for a spreadsheet (optional)
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on this page.
  - It works best when your AI can access your Shopify admin (read only).
output_sample:
  input:
    - Your store domain
    - A minimum file age in days (optional)
    - A file type filter such as images only (optional)
    - How many sample unused files to show (optional)
  prerequisites:
    - An AI that can run code and the Shopify command line
    - A Shopify login with read access to files, products and content
  output:
    - name: Start banner
      contains: The skill name, your store domain and the start time.
    - name: Step progress lines
      contains: One line per step with what was asked and how many items came back.
    - name: Completion summary
      contains: Total files, files in use, unused files, their sizes and share of storage, plus a short list of sample unused files.
    - name: JSON summary (optional)
      contains: The same totals in a short JSON block, if you ask for JSON instead of the readable summary.
    - name: file_audit CSV
      contains: One row per file with its ID, type, link, alt text, size, upload date, age, and whether anything uses it.
