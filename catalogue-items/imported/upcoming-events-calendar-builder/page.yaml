thinking: low
thinking_why: It collects dated events and sorts them.
new_slug: upcoming-events-calendar-builder
name: Upcoming events calendar builder
summary: "Build an upcoming events calendar for the Indian stocks you follow: earnings, conferences and decisions in date order, ranked by impact."
job: money-and-investing
headline: Upcoming events calendar builder
subhead: Give it a list of companies. Get a dated calendar of earnings, conferences and decisions that could move them. Bring a list of company names or tickers. Use the result to plan your next step.
explain: |
  A dated calendar of what could move the companies you follow: earnings, investor days, conferences, regulatory decisions, product launches and big economic releases. You see what is coming in the next two weeks, month or quarter, and where to look first.

  You list the companies and a time window. The skill goes through four groups for each one: financial dates, company events, industry events and wider economic dates. It lists them in date order and ranks them by how much they might matter. It uses the April to March fiscal year, labels quarters clearly and uses lakh and crore units. It says so when something has no Indian equivalent, instead of swapping in a stand-in.
when:
  - You follow ten or more Indian stocks and need one dated list of what is next.
  - You want to know which week has the most results and meetings to prepare for.
  - You are planning a trade or a review around a known decision date.
  - You need a monthly events sheet to share with your team.
not_for:
  - "You need real-time price alerts or intraday trading signals: use your broker's app or alerts, since this calendar is for planning only."
  - "You want exact earnings dates you can trust: check each company's investor relations page and the NSE or BSE announcements, which are free, before you act."
  - "You want advice on what to buy or sell: talk to a SEBI-registered adviser, as this calendar is not investment advice."
you_give:
  - A list of company names or tickers
  - The time window, such as the next month
  - Sectors to focus on (optional)
  - Whether to include economic and policy dates (optional)
you_get:
  - A dated calendar of events by company
  - Events ranked by likely impact
  - Fiscal quarter labels written correctly
  - A short list of weeks to watch
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Paste your list of company names or tickers and the time window you want.
  - Add sectors to focus on, and say if you want economic and policy dates (optional).
  - Ask your AI to build the calendar and the weekly preview. Give it web access if it has it.
  - Check each date against the company's investor relations page or NSE and BSE notices, as dates often shift.
  - Use the weeks to watch to plan your reviews. Treat the result as a planning aid, not advice.
output_sample:
  input:
    - A list of company names or tickers
    - The time window, such as the next 2 weeks, month or quarter
    - Sectors to focus on (optional)
    - Whether to include economic and policy dates (optional)
  prerequisites:
    - An AI that can read your list and write a table or Excel file
    - Web access helps to check dates, or you can paste dates from company pages
  output:
    - name: Calendar view
      contains: A table of date, event, company or sector, type, impact rating, your positioning and notes, in date order.
    - name: Weekly preview
      contains: This week's key events, a heads-up on next week, and which positions could move.
    - name: Impact colour code
      contains: Each event marked high, moderate or routine so you see where to look first.
    - name: Excel workbook
      contains: The calendar with sortable columns, with money in lakh and crore and fiscal quarters labelled.
    - name: Gaps list
      contains: Anything with no Indian equivalent, named as a gap instead of replaced by a stand-in.
