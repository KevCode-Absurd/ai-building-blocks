thinking: medium
thinking_why: It follows a set test method and judges what the findings mean.
new_slug: usability-test-runner
name: Usability test runner
summary: Plan a usability test for your prototype. Get task scripts, moderator notes and a ranked list of problems to fix before you ship.
job: test-an-idea
headline: Usability test runner
subhead: Find out whether real people can use your design before you ship it. You get a full test plan, tasks to read aloud, notes for the person running the session and a findings report that ranks the problems.
explain: |
  Find out whether real people can use your design before you ship it. You get a full test plan, tasks to read aloud, notes for the person running the session and a findings report that ranks the problems.

  The work runs in five phases. You pick a few specific tasks, each tied to a real goal and doable in 2 to 10 minutes. A script tells the moderator what to say and what not to hint at, using think aloud. During sessions you track whether each task was finished, how long it took and where people got stuck. Afterwards, problems are grouped and rated by how often they happen and how bad they are.
when:
  - You have a prototype and want to check it before a developer builds it.
  - Analytics show people leaving a page and you do not know why.
  - You redesigned a flow and need proof it did not add new problems.
  - You are choosing between two design directions and want real reactions.
not_for:
  - "You want to learn what people need before you design anything: use the ux-research skill, or talk to five customers first."
  - "You want to lift sales on a live page: use the cro-optimization skill, or run a simple A/B test in your own tool."
  - "You only need numbers on traffic and drop-off: use your analytics tool, or the analytics-strategy skill."
you_give:
  - The design, prototype or link to test
  - The tasks people should try
  - Who your users are
  - Your test tool or setup (optional)
you_get:
  - A test plan with goals and success measures
  - Task scripts to read to participants
  - Moderator notes
  - A ranked list of findings with fixes
how_to_use:
  - "Gather your brief first: the prototype link, 3 to 5 tasks, a short note on your users, and the tool you will test with."
  - Open Claude, ChatGPT or Gemini and paste the skill text. No code or paid tool is needed.
  - Paste your brief and ask for the test plan and task scripts.
  - Run the sessions yourself or with a teammate. Take notes on where people stop, hesitate or go back.
  - Paste your notes into the chat and ask for the findings report.
  - Fix the critical problems, then test again to check the fixes worked.
output_sample:
  input:
    - A link to your design or prototype
    - 3 to 5 tasks people should try
    - A short description of who your users are
    - Your test tool or setup, such as a video call or Maze (optional)
  prerequisites:
    - A prototype that people can click through, even if it is not finished
    - A way to find and talk to real users, or a tool that does it for you
  output:
    - name: usability-test-plan-[topic].md
      contains: Your goals, the tasks, moderated or unmoderated choice, who to recruit and how many people.
    - name: usability-tasks-[topic].md
      contains: Task wording to read aloud, framed as goals, plus the session order and moderator rules.
    - name: usability-findings-[topic].md
      contains: Summary, method, and findings grouped as critical, major, minor and cosmetic, each with a fix.
    - name: What worked well
      contains: The parts of the design that people used without trouble, so you keep them.
    - name: Recommendations and next steps
      contains: Fixes ranked by severity and effort, plus when to re-test.
