thinking: medium
thinking_why: It builds personas from what people said.
new_slug: user-persona-and-path-mapper
name: User persona and path mapper
summary: Give it your research notes. Get personas, a path map and a usability
  test plan.
job: understand-customers
headline: User persona and path mapper
subhead: Give it your research notes. Get personas, a path map and a usability
  test plan. Bring user data or interview notes. Use the result to plan your
  next step.
explain: |
  Your research notes turned into three working tools: personas that match real people, a map of what they go through, and a plan to test your design with them. Your team gets the same picture of who you are building for.

  You supply user data such as age, how often they use the product, features used, device and pain points. A script groups similar people into archetypes and writes each persona with goals, frustrations and behavior. The skill then lays out a path map with stages, actions, feelings and chances to improve. It plans a usability test with tasks and the number of participants. It also helps combine interview findings into themes and an empathy map.
when:
  - You have survey and interview data but no clear picture of your users.
  - A new team member needs to understand your customers in five minutes.
  - You are about to redesign and want to base it on evidence.
  - You need to work out how many people to interview.
you_give:
  - User data or interview notes
  - What the product does
  - Research questions (optional)
  - Python installed for the scripts
you_get:
  - Data based personas
  - A path map with pain points
  - A usability test plan
  - A summary of research themes
how_to_use:
  - Paste the skill into Claude, ChatGPT or Gemini. Or add it as a skill so you can reuse it.
  - Put your user data in a list with one row per person, such as age, how often they use the product, features used, device and pain points. Add interview notes if you have them.
  - Ask for personas first. Check each one against your data. Every frustration should have a count, like 14 of 20 users.
  - Then ask for the path map and the usability test plan for the persona you care about most.
  - Show each persona to 3 to 5 real users and ask "Does this sound like you?" before your team uses it.
  - The persona script needs code running. Without it, the AI can still group your notes by hand, but with less structure.
not_for:
  - You have notes from fewer than 5 people. The personas will be guesses. Use the Customer interview coach to plan more interviews first.
  - You only want themes and real quotes from interviews, reviews or tickets. Use the Customer interview synthesizer or the Customer research analyst.
  - You only want a diagram of the steps a user takes on one task. Use the User flow mapper.
  - You only want to test a prototype. Use the Usability test runner.
output_sample:
  input:
    - Your user data, one row per person, with age, how often they use it, features used, device and pain points
    - Interview notes or survey answers (optional)
    - What your product does, in a sentence or two
    - The goal you want the path map to follow (optional)
  prerequisites:
    - Python installed, so the persona script can run
    - Data from at least 20 people for a firm result
  output:
    - name: Personas
      contains: Each persona has an archetype, a quote, goals, frustrations with counts, design implications and a confidence level.
    - name: Path map
      contains: Stages from start to finish, each with actions, touchpoints, feelings from 1 to 5, pain points and chances to improve.
    - name: Usability test plan
      contains: Testable questions, a method, task scenarios, success measures and a guide for the person running the test.
    - name: Research themes
      contains: Coded notes grouped into themes, with how many people said each and a recommendation.
    - name: Segment sizes
      contains: How many people fall into each group, and which groups are big enough to become a main persona.
