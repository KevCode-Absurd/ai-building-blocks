thinking: medium
thinking_why: It picks a method that fits your question.
new_slug: user-research-planner
name: User research planner
summary: Say what you need to learn. Get the right research method, a plan and a
  way to store what you find.
job: understand-customers
headline: User research planner
subhead: Say what you need to learn. Get the right research method, a plan and a
  way to store what you find. Bring what you need to learn. Use the result to
  plan your next step.
explain: |
  Choose the right way to learn from users, size the study honestly, and keep what you learn in a form people can trust. 
  The skill matches your goal and product stage to a method: open interviews for discovery, usability tests for ease of use, concept tests for ideas, or validation for a decision. It then gives a plan with objective, who to recruit, a question guide and success measures. A sample size tool gives a figure with its confidence level, such as five people per group for usability problems or about twelve for themes. Afterward it groups coded notes by tag and counts how many different people said each thing.
when:
  - You must decide whether to run interviews, a survey or a usability test.
  - Your boss asks how many people you need to talk to, and why.
  - You have a pile of interview notes and want insights you can defend.
  - You want a shared place for research findings that stays reliable.
you_give:
  - What you need to learn
  - Your product stage
  - Who your users are
  - Coded notes from past sessions (optional)
you_get:
  - A recommended research method
  - A study plan with questions and criteria
  - A sample size with a confidence label
  - Ranked insights marked by how many people said them
how_to_use:
  - Paste the skill into Claude, ChatGPT or Gemini. Or add it as a skill so you can reuse it.
  - Say what you need to learn in one plain sentence. Add your product stage (idea, prototype, beta or live) and who your users are.
  - Ask for the research method and plan first. Check that the method fits your goal. A usability test cannot find unmet needs.
  - Ask for the sample size. Write down the confidence label it gives you, and share it with whoever asked how many people you need.
  - After you run the sessions, paste your coded notes. Ask which insights have 3 or more different people behind them.
  - The three tools need code running. Without it, the AI can follow the same steps by hand and will say so.
not_for:
  - You want personas or a map of the steps a customer takes. Use the User persona and path mapper.
  - You want to compare two live versions of a page or feature. Use the Experiment designer.
  - You want to size a market or run a big survey. Use the Market research report writer.
  - You already have the method and only want interview questions. Use the Customer interview coach.
output_sample:
  input:
    - What you need to learn, in one sentence
    - Your product stage, such as concept, prototype, beta or live
    - The kind of product and who uses it
    - Coded notes from past sessions, one tag per note (optional)
  prerequisites:
    - Python 3, if you want the three tools to run
  output:
    - name: Method and study plan
      contains: The research method that fits your goal, with an objective, who to recruit, a question guide and success measures.
    - name: Sample size
      contains: How many people to talk to, with a confidence label such as 5 per group or about 12 for themes.
    - name: Ranked insights
      contains: Coded notes grouped by tag and ranked by how many different people said each one.
    - name: Anecdote flags
      contains: Anything said by fewer than 3 people, marked as a signal to probe and not a finding.
    - name: Repository tags
      contains: A tagging scheme so each insight can be found and reused later.
