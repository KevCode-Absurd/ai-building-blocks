new_slug: usrp-radio-setup-helper
name: USRP radio setup helper
summary: Set up a USRP radio in MATLAB and prove it works. Give it your model. You get host checks, radio setup steps and a test that confirms the link.
job: build-software
headline: USRP radio setup helper
subhead: A USRP radio that is connected, configured and proven to work in MATLAB, so you can start sending and capturing signals. It covers the models E320, N300, N310, N320, N321, X300, X310 and X410. It needs licensed MATLAB, and the licence lets you use this copy only with MathWorks products.
explain: |
  Licence: this copy is BSD 2-Clause (LICENSE.md) plus a MathWorks-only use term. You may use it only with MathWorks products such as MATLAB. The SKILL.md header also links MathWorks' own reuse licence (the PMRL page). Read both before you reuse it.

  The skill first checks your computer: operating system, network card type and speed, and packet size. It then finds the radio with the discovery commands findsdru and probesdru and checks the driver version matches. It sets up the radio in code, or with the setup wizard, and runs a transceiver test to confirm samples flow. A separate troubleshooting guide covers radios that are not found, connection errors and dropped samples. It needs MATLAB with the Wireless Testbench add-on, and the radio on your desk.
when:
  - You unboxed a USRP and have never connected it to MATLAB.
  - MATLAB says the radio is not found, and you do not know why.
  - You see dropped samples when streaming and suspect the network.
  - You need a repeatable setup before a lab session or a project.
not_for:
  - "You want to send or capture a first real signal: use the matlab-detect-capture-usrp skill once this setup works, or follow the Transmit and Capture guide from MathWorks."
  - "You want to use this outside MATLAB or other MathWorks products: the licence (BSD 2-Clause plus a MathWorks-only term) does not allow it."
  - "You need to install MATLAB or the Wireless Testbench add-on: ask your IT team or MathWorks, because this skill does not cover buying or installing them."
  - "You use the older comm.SDRuReceiver or comm.SDRuTransmitter path, or need FPGA work: use the MathWorks help pages for those."
you_give:
  - Your USRP model
  - How it connects to your computer
  - Your MATLAB release
  - Any error message you see (optional)
you_get:
  - A host check of OS and network card settings
  - Steps to find and configure the radio
  - A test that proves the connection works
  - Fixes for the most common failures
how_to_use:
  - Check you have MATLAB R2026a or later with the Wireless Testbench support package. Both need a licence. This skill does not cover buying or installing them. The licence on this copy (BSD 2-Clause, see LICENSE.md) allows use only with MathWorks products.
  - Connect and power on your USRP radio.
  - Open your AI tool and add the skill folder, or paste in the SKILL.md text.
  - Tell your AI your USRP model, how it connects, and your MATLAB release. Add any error message.
  - Let your AI run each step and show you the results. It runs MATLAB commands on your computer, so read each command before you approve it. Any firewall change and any sudo or admin command must be run by you, in your own admin terminal. Your AI should give you the command, not run it.
  - Windows Firewall may need to be off for the radio network card only, and only for this test. That lowers your computer's security. You make that change yourself, and you turn the firewall back on as soon as the connection test passes.
  - The code route for saving the radio is for experienced users only. Before you let your AI write anything, note the names of your saved radio configurations by running radioConfigurations. It uses an undocumented MATLAB function that can change between releases. A bad write can corrupt the saved radio settings. If it fails, close MATLAB tools, follow the recovery steps in the skill, and use the setup wizard, which is the safer route.
  - When the connection test passes, move on to the matlab-detect-capture-usrp skill to capture your first real signal.
output_sample:
  input:
    - Your USRP model (E320, N300, N310, N320, N321, X300, X310 or X410)
    - How the radio connects to your computer
    - Your MATLAB release
    - Any error message you see (optional)
  prerequisites:
    - MATLAB R2026a or later with the Wireless Testbench support package already installed, which needs a licence
    - A USRP radio on your desk, powered on and cabled to your computer
    - An AI that can run MATLAB and shell commands on your computer
  output:
    - name: Host check
      contains: Your operating system, network card type, link speed and packet size (MTU), with what to fix.
    - name: Radio discovery
      contains: The findsdru and probesdru results, plus a check that the driver version matches the radio.
    - name: Host fixes
      contains: Commands to set a static IP, turn on jumbo frames for 10 GbE and raise network buffers.
    - name: Radio configuration
      contains: Code, or the setup wizard route, that saves your radio so MATLAB can use it.
    - name: Connection test
      contains: A basebandTransceiver run that shows samples flow without drops.
    - name: Troubleshooting guide
      contains: Fixes for radios not found, connection errors and dropped samples.
