thinking: high
thinking_why: It fits size, weight and stop order together.
new_slug: van-loading-planner
name: Van loading planner
summary: Plan your van load from item sizes, weights, stops and vehicle limits. You get a load order, positions and a weight balance check.
job: plan-supply-chain
headline: Van loading planner
subhead: Give it your van size, weight limit, parcels and stop order. It plans where each item goes, last stop first in. You get a load order, a weight balance check and securing notes.
explain: |
  A load plan that fits every parcel in your van and puts the first drop within easy reach. Fewer repacks, safer weight and less time at the back doors.

  You give vehicle size, weight limit, door layout and a list of items with sizes, weights and stop order. The skill loads in reverse order of delivery so the last stop goes in first. Heavy items go low and near the axle, and the weight is balanced between front and rear, with limits checked against legal axle weights. Fragile and cold items get their own zones, and stackable and non-stackable cargo are handled apart. It also covers securing with straps and bars and keeps hazardous items separate.
when:
  - You run multi-drop routes and waste time digging for the next parcel.
  - A van keeps coming back with items that did not fit.
  - You need to stay under axle weight limits on a heavy day.
  - You are training new drivers or loaders on how to pack.
not_for:
  - "You need to load a shipping container: use a container loading tool, since this plan is built for vans and trucks."
  - "You need the best order of stops: use a route planning tool first, then bring the stop order here."
  - "You need legal axle limits confirmed: ask your local transport authority, since the axle check here is a rough estimate."
you_give:
  - Van or truck size and weight limit
  - A list of parcels with size and weight
  - The stop order
  - Special items such as fragile, cold or hazardous goods
you_get:
  - A load order from first in to last in
  - Positions inside the cargo area
  - A weight balance check
  - Notes on securing the load
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text.
  - Add your van size, weight limit and door layout.
  - Paste your parcel list with sizes and weights, and your stop order.
  - Mention fragile, cold or hazardous items, and your axle limits if you know them.
  - Check the result against your real axle limits before you load. Then print the load order for your drivers.
output_sample:
  input:
    - Your van or truck size and weight limit
    - A list of parcels with size and weight
    - Your stop order
    - Fragile, cold or hazardous items (optional)
    - Your axle weight limits (optional)
  prerequisites:
    - An AI that can run code works best, but a chat AI can still make a plan
  output:
    - name: Vehicle Loading Report
      contains: Vehicle size, weight capacity and number of stops, as a header for the plan.
    - name: Loading Plan
      contains: Zones along the cargo area, each with the stop it serves, its items and its weight.
    - name: Summary
      contains: Total weight against capacity, how full the space is, axle weights and whether the load is secured.
