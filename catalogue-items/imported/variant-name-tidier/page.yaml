thinking: medium
thinking_why: Renames can break cart links, so it checks first.
new_slug: variant-name-tidier
name: Variant name tidier
summary: Get mixed names like Sm, Small and S fixed to one standard. Changes
  live variants and may break saved links.
job: run-your-store
headline: Variant name tidier
subhead: One standard for every size, color or other option in your store, so
  Sm, Small, small and S all become S. Filters work, search groups items
  correctly and customers stop guessing.
explain: |
  One standard for every size, color or other option in your store, so Sm, Small, small and S all become S. Filters work, search groups items correctly and customers stop guessing.

  You name the option to fix, such as Size, and give a map from messy values to the one you want. The skill scans your products, finds every variant with a value in the map, and shows exactly what would change. By default it runs as a preview and changes nothing. Once you approve, it updates the variants in bulk. Be careful: changing option values affects what shoppers see and can break saved cart links or wishlists. It needs a Shopify login with write access to products.
when:
  - Your size filter lists Sm, Small and S as three separate choices.
  - You imported products from several suppliers with different naming.
  - A search app is not grouping variants because the values do not match.
  - You are cleaning up before a sale and want consistent options.
you_give:
  - Your store domain
  - The option to fix, such as Size or Color
  - A map of messy values to the standard one
  - A product filter (optional)
you_get:
  - A preview of every variant that would change
  - Bulk updates after your approval
  - A count of changes made
  - A JSON report (optional)
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can access your Shopify admin and change live
    store data.
