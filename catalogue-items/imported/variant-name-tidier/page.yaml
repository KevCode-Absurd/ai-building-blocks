thinking: medium
thinking_why: Renames can break cart links, so it checks first.
new_slug: variant-name-tidier
name: Variant name tidier
summary: Fix mixed variant names like Sm, Small and S in Shopify. Preview every change first, then update your variant option values to one standard.
job: run-your-store
headline: Variant name tidier
subhead: One standard for every size, color or other option in your store, so Sm, Small, small and S all become S. Filters work, search groups items correctly and customers stop guessing.
explain: |
  One standard for every size, color or other option in your store, so Sm, Small, small and S all become S. Filters work, search groups items correctly and customers stop guessing.

  You name the option to fix, such as Size, and give a map from messy values to the one you want. The skill scans your products, finds every variant with a value in the map, and shows exactly what would change. By default it runs as a preview and changes nothing. Once you approve, it updates the variants in bulk. Be careful: changing option values affects what shoppers see and can break saved cart links or wishlists. It needs a Shopify login with write access to products, and an AI tool that can run commands. Those tools may need a paid plan or an account of their own, so check their pricing. The Shopify command line works with your store login and needs no extra key.
when:
  - Your size filter lists Sm, Small and S as three separate choices.
  - You imported products from several suppliers with different naming.
  - A search app is not grouping variants because the values do not match.
  - You are cleaning up before a sale and want consistent options.
not_for:
  - "You want to change names during a live sale or while shoppers rely on saved cart links: wait for a quiet time, or group the values in your storefront filter or search app instead."
  - "You have no Shopify login that can change products: ask the store owner for write access to products first."
  - "You only need to fix one or two variants: edit them by hand in your Shopify admin."
you_give:
  - Your store domain
  - The option to fix, such as Size or Color
  - A map of messy values to the standard one
  - A product filter (optional)
you_get:
  - A preview of every variant that would change
  - Bulk updates after your approval
  - A count of changes made
  - A JSON report (optional)
how_to_use:
  - Open an AI tool that can run code and use the Shopify command line, such as Claude Code, Cursor, Codex or Gemini CLI. Some need a paid plan, so check first. Paste in this skill.
  - Sign in to your store with a login that can read and write products.
  - Tell your AI the store domain, the option to fix (such as Size) and your map of messy values to the standard one.
  - Run the preview first. Check the list. Add any messy values you did not know about to your map.
  - Before you approve, ask your AI to confirm that the update call (productVariantsBulkUpdate) takes optionValues with optionName and name in the API version it is using. This skill was written against version 2025-01.
  - Approve the update. Your AI must wait for your yes before it changes anything. Then save the CSV file, because it holds the old values.
  - Check that any collections built on option values still match the right products.
  - Next, run variant-sales-ranker to see which of your now-clean sizes and colors sell best.
output_sample:
  input:
    - Your store domain
    - The option to fix, such as Size or Color
    - Your map of messy values to the standard value
    - A product filter, such as a tag (optional)
  prerequisites:
    - An AI tool that can run code and use the Shopify command line
    - A Shopify login with read and write access to products
  output:
    - name: Preview
      contains: Every variant that would change, shown first. By default nothing is changed until you approve.
    - name: Progress notes
      contains: A short note after each step saying what was checked and how many variants were found.
    - name: Outcome summary
      contains: Counts of products scanned, variants needing a fix, variants updated and errors.
    - name: option_normalizer CSV file
      contains: One row per variant with product, SKU, option name, old value and new value.
