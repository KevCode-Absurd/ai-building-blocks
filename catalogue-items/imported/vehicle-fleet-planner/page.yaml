thinking: medium
thinking_why: It compares running cost against replacement cost.
new_slug: vehicle-fleet-planner
name: Vehicle fleet planner
summary: Plan your vehicle fleet size and replacement timing. Give it your vehicles and costs. You get how many you need and when to replace each one.
job: plan-supply-chain
headline: Vehicle fleet planner
subhead: The right number of vehicles for your demand, and a plan for when to replace each one. You stop paying for idle vans and stop running old ones past the point they cost more than they are worth.
explain: |
  The right number of vehicles for your demand, and a plan for when to replace each one. You stop paying for idle vans and stop running old ones past the point they cost more than they are worth.

  You give the current fleet, its ages and costs, and your demand pattern. The skill works out the smallest fleet that covers peak days with a sensible reserve. It compares buy, lease and rent for each vehicle type. It also builds a total cost of ownership view including fuel, repairs, insurance, driver time and resale value, which shows the age where replacement becomes cheaper than repair. Maintenance schedules and utilization checks follow, so you can see which vehicles are barely used.
when:
  - You are not sure if you need one more truck or one fewer.
  - Repair bills on older vehicles keep growing.
  - You are choosing between leasing and buying a new batch.
  - Demand is seasonal and you want to plan extra capacity.
not_for:
  - "You need delivery routes or stop order: use a route planning tool or your dispatcher, because this plans the fleet, not the trips."
  - "You are deciding on one van only: compare the quote and your running costs by hand, since no modelling is needed."
  - "You have no cost figures yet: gather your fuel, repair and insurance bills first, or the plan will rest on guesses."
you_give:
  - Your vehicles with type, age and owned or leased status
  - "Running costs: fuel, repairs, insurance"
  - Demand by day or season
  - Service level goals and limits such as parking
you_get:
  - A recommended fleet size and mix
  - A replacement schedule by vehicle
  - A cost of ownership comparison
  - A utilization review and maintenance plan
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Paste your vehicle list with type, age, owned or leased, and your real cost figures from invoices and quotes.
  - Add your demand by day or season, and any limits such as parking.
  - Ask for the fleet analysis report. If a cost is missing, tell your AI to mark it missing, not guess.
  - Check the replacement table against your repair bills and quotes before you act on it. The cost models need an AI that can run Python with numpy, pandas, scipy and simpy. Without that, your AI can still reason through the numbers by hand, with less precision.
  - Run the plan again each budget cycle with fresh invoices.
output_sample:
  input:
    - Your vehicles with type, age and owned or leased status
    - "Your running costs: fuel, repairs, insurance and driver pay"
    - Your demand by day or season
    - Your service goals and limits, such as parking space (optional)
  prerequisites:
    - Your own invoices and quotes for costs. Do not use made-up defaults.
    - An AI that can run code, if you want the sizing and cost models calculated rather than estimated
  output:
    - name: Executive summary
      contains: Current fleet, utilization, total annual cost, cost per vehicle and the main recommendation.
    - name: Fleet composition
      contains: A table of each vehicle type with count, average age, mileage, utilization and annual cost.
    - name: Utilization analysis
      contains: Current figures against targets, including vehicles that are barely used and empty miles.
    - name: Cost breakdown
      contains: Annual cost by category, such as depreciation, fuel, maintenance, insurance and drivers, per vehicle and as a share.
    - name: Replacement plan
      contains: A multi-year table of which vehicles to replace each year, the investment and the reason.
    - name: Recommendations
      contains: Numbered actions such as cutting vehicles or replacing old units, with the expected saving or payback.
