thinking_why: It compares running cost against replacement cost.
new_slug: vehicle-fleet-planner
name: Vehicle fleet planner
summary: Give it your vehicles and costs. Get how many you need and when to
  replace each one.
job: plan-supply-chain
headline: Vehicle fleet planner
subhead: The right number of vehicles for your demand, and a plan for when to
  replace each one. You stop paying for idle vans and stop running old ones past
  the point they cost more than they are worth.
explain: |
  The right number of vehicles for your demand, and a plan for when to replace each one. You stop paying for idle vans and stop running old ones past the point they cost more than they are worth.

  You give the current fleet, its ages and costs, and your demand pattern. The skill works out the smallest fleet that covers peak days with a sensible reserve. It compares buy, lease and rent for each vehicle type. It also builds a total cost of ownership view including fuel, repairs, insurance, driver time and resale value, which shows the age where replacement becomes cheaper than repair. Maintenance schedules and utilization checks follow, so you can see which vehicles are barely used.
when:
  - You are not sure if you need one more truck or one fewer.
  - Repair bills on older vehicles keep growing.
  - You are choosing between leasing and buying a new batch.
  - Demand is seasonal and you want to plan extra capacity.
you_give:
  - Your vehicles with type, age and owned or leased status
  - "Running costs: fuel, repairs, insurance"
  - Demand by day or season
  - Service level goals and limits such as parking
you_get:
  - A recommended fleet size and mix
  - A replacement schedule by vehicle
  - A cost of ownership comparison
  - A utilization review and maintenance plan
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
