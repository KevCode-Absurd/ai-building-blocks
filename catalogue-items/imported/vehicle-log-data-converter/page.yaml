thinking: medium
thinking_why: Decoding needs the right signal database.
new_slug: vehicle-log-data-converter
name: Vehicle log data converter
summary: Give it MDF, BLF or CAN log files. Get signals decoded and written to
  the format you need.
job: build-software
headline: Vehicle log data converter
subhead: Raw vehicle bus recordings turned into named signals you can plot and
  analyze, and your own data written back to a standard log file. The skill
  covers MDF and MF4, BLF and ASC log files in MATLAB.
explain: |
  Raw vehicle bus recordings turned into named signals you can plot and analyze, and your own data written back to a standard log file. 
  The skill covers MDF and MF4, BLF and ASC log files in MATLAB. It reads them and decodes CAN, CAN FD and LIN frames using your DBC, ARXML or LDF database. For writing, it converts a MATLAB timetable to MDF or CAN data to BLF, and it fixes column types that MDF cannot store, such as categories and dates. It also states what is not supported: no LIN to BLF, no ASC export. It needs MATLAB with Vehicle Network Toolbox, and it checks your release first.
when:
  - A test drive left you with an MF4 file full of raw frames.
  - You have a DBC file and need engine speed and temperature as signals.
  - You want to save simulation output as a log file for another tool.
  - A BLF file will not open the way you expected.
you_give:
  - The log file (MDF, MF4, BLF or ASC)
  - The database file (DBC, ARXML or LDF)
  - Your MATLAB release
  - The output format you need
you_get:
  - Decoded signals as MATLAB timetables
  - MATLAB code to read the file
  - An exported MDF or BLF file
  - A note on what your format cannot do
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run MATLAB with Vehicle Network Toolbox.
