thinking: medium
thinking_why: Hardware setup needs matching settings.
new_slug: vehicle-network-setup-helper
name: Vehicle network setup helper
summary: "Set up a CAN bus connection in MATLAB: find your device, open a channel at the right speed, then send and receive messages with a health check."
job: build-software
headline: Vehicle network setup helper
subhead: "A working CAN connection in MATLAB: your device found, a channel opened at the right speed, and messages going out and coming in. You can test without hardware too, using a virtual channel. It needs paid MATLAB with Vehicle Network Toolbox, and the licence lets you use this copy only with MathWorks products."
explain: |
  Licence: copied from MathWorks under BSD 2-Clause with an added term that limits use to MathWorks products, as the LICENSE.md file in this item says. It needs paid MATLAB with Vehicle Network Toolbox.

  A working CAN connection in MATLAB: your device found, a channel opened at the right speed, and messages going out and coming in. You can test without hardware too, using a virtual channel.

  The skill lists the connected CAN hardware from vendors such as Vector, Kvaser, NI and PEAK, then creates a channel with the right bus speed and options. It also shows how to encode and decode signals inside messages, and how to set up a loopback test on your bench. Common errors, like channel already in use, wrong speed or no acknowledgment, are explained with fixes. It needs MATLAB with Vehicle Network Toolbox and the vendor driver.
when:
  - You have a new CAN adapter and want to see messages in MATLAB.
  - Your channel will not start because of a speed or access error.
  - You need to send a test message to an ECU on your bench.
  - You want to practice with a virtual channel before buying hardware.
not_for:
  - "You want to use this outside MATLAB or other MathWorks products: the licence (BSD 2-Clause plus a MathWorks-only term) does not allow it."
  - "You only want to replay logged BLF files with no live bus: use a BLF logging tool, not this setup helper."
  - "You are building Simulink vehicle network blocks: use a Simulink-specific tool instead."
  - "You need to create or edit DBC, LDF or A2L files: use your vendor's database editor. This skill only uses existing files."
you_give:
  - Your CAN hardware brand and model
  - Your bus speed and whether it is CAN or CAN FD
  - Your MATLAB release
  - The error message you see (optional)
you_get:
  - Code to discover your device
  - A configured channel
  - Send and receive examples
  - Fixes for common channel errors
how_to_use:
  - "Before you start, gather: your adapter model, your bus speed, your MATLAB release, and a check that your MATLAB licence includes Vehicle Network Toolbox. Remember the licence allows this copy only with MathWorks products."
  - Open Claude and paste in this skill's instructions. It is written for Claude, and its troubleshooting routing points to Claude-specific files. Other AIs can follow the setup steps but may handle the diagnostic part less well.
  - Tell your AI your CAN adapter brand and model, your bus speed, and whether you use CAN or CAN FD.
  - Add your MATLAB release and any error message you see (optional).
  - Before you send anything, check that your bus is a bench bus, a virtual channel or an isolated test network. Never send frames on a vehicle that is in service, or on a network that safety systems rely on. If you are not sure, use the virtual channel or only receive.
  - Run the code your AI gives you in MATLAB. This needs Vehicle Network Toolbox and, for real hardware, the vendor driver.
  - No adapter? Run the whole thing on the MathWorks virtual channel. Ask your AI to create two channels on the virtual device (channel 1 and channel 2), set the same bus speed on both, start both, send a message on one and receive it on the other. That tests the full path with no hardware.
  - Check the health line after each send. Error counts of zero and an active bus mean the frame was accepted.
  - If the error counters (TEC or REC) are above zero, or no acknowledgment appears, stop and follow the diagnostic workflow in the skill before you retry. The usual cause is that no other device on the bus is started to acknowledge the frame. Once messages flow, ask your AI to decode signals using your database file. Use your vendor's database editor for any DBC changes.
output_sample:
  input:
    - Your CAN hardware brand and model, or a virtual channel
    - Your bus speed, and whether it is CAN or CAN FD
    - Your MATLAB release
    - The error message you see (optional)
  prerequisites:
    - MATLAB R2021a or later (a paid licence). The licence on this copy (BSD 2-Clause, see LICENSE.md) allows use only with MathWorks products.
    - Vehicle Network Toolbox installed
    - The vendor driver for your adapter, if you use real hardware
    - An AI that can run MATLAB code
  output:
    - name: Hardware discovery
      contains: MATLAB code that lists the CAN devices your computer can see.
    - name: Channel setup
      contains: Code that creates a CAN or CAN FD channel and sets the bus speed before start.
    - name: Send and receive code
      contains: Examples to send, repeat and receive messages, with filters and signal decoding from a database.
    - name: Bus health check
      contains: "A short run of code blocks (find the device, create the channel, set the speed, start, send, receive), then one health line such as TEC=0 REC=0 BusStatus=ErrorActive. That line means the frame was accepted. Any error count above zero means stop and diagnose."
    - name: Error fixes
      contains: Steps for common problems such as channel in use, wrong speed or no acknowledgment.
