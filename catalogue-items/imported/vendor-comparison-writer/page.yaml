thinking: medium
thinking_why: It weighs cost against risk.
new_slug: vendor-comparison-writer
name: Vendor comparison writer
summary: Compare vendor proposals or review a renewal. Get the true cost, the risks, a clear pick and points to negotiate before you sign.
job: think-and-decide
headline: Vendor comparison writer
subhead: A clear call on whether to pick, keep or drop a vendor, with the real cost, the risks and the points to raise in negotiation.
explain: |
  A clear call on whether to pick, keep or drop a vendor, with the real cost, the risks and the points to raise in negotiation. You can show it to the person who signs the deal.

  The skill works from the proposal, contract terms or performance data you give it. It builds a total cost of ownership: licence fees, setup, training, support and the cost of leaving. It reviews risks such as the vendor's financial health, security, reliance on one supplier, lock-in and recovery plans. For two or more vendors, it builds a side-by-side table of price, features, integrations, security, support and terms. The report opens with a two or three sentence recommendation.
when:
  - Two vendors sent proposals and you must pick one.
  - A contract renews in 60 days and you want to know if it is still worth it.
  - Finance asks for the full cost, not only the licence price.
  - You want a list of things to push back on before you sign.
not_for:
  - "You are buying a cheap tool for one person: a quick price check on the vendor's site is enough."
  - "You need a lawyer to read the contract wording: ask your lawyer or legal adviser, since this only flags terms to raise."
  - "You want to check a vendor's claims about their own product: ask the vendor for references and a trial instead."
you_give:
  - The vendor name or proposal
  - Whether this is new, renewal or comparison
  - Pricing, contract terms or performance data
  - What matters most to you (optional)
you_get:
  - A short recommendation
  - A cost breakdown for year one and three years
  - A risk review
  - Negotiation points
how_to_use:
  - "Gather what you have: the vendor's proposal, the contract, what you pay now and the renewal date."
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions.
  - Say if this is a new vendor, a renewal or a comparison. Paste or upload your files. For two vendors, add both.
  - Read the Summary and Recommendation first. Then check the cost table against the proposal. Fill any gaps your AI marked.
  - Send the Negotiation Points to whoever handles buying, or raise them with the vendor yourself.
  - No code, web access or paid tool is needed.
output_sample:
  input:
    - The vendor name or the proposal
    - Whether this is a new vendor, a renewal or a comparison
    - Pricing, contract terms or how the vendor has performed
    - What you pay now, for renewals (optional)
    - What matters most to you (optional)
  output:
    - name: Summary
      contains: A two or three sentence recommendation you can show the person who signs.
    - name: Cost Analysis
      contains: A table of licence, setup and support costs, with totals for year one and three years.
    - name: Risk Assessment
      contains: A table of risks with likelihood, impact and a way to reduce each one.
    - name: Strengths
      contains: A short list of what the vendor does well.
    - name: Concerns
      contains: A short list of what worries you about the vendor.
    - name: Recommendation
      contains: "One call: proceed, negotiate or pass, with the reasons."
    - name: Negotiation Points
      contains: Points to raise with the vendor before you sign.
