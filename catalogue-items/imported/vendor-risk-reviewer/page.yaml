thinking: medium
thinking_why: It follows a set review method for each vendor.
new_slug: vendor-risk-reviewer
name: Vendor risk reviewer
summary: Give it a vendor and what they handle. Get a risk tier, tailored
  questions and a review of their SOC 2 report.
job: check-contracts
headline: Vendor risk reviewer
subhead: Give it a vendor and what they handle. Get a risk tier, tailored
  questions and a review of their SOC 2 report. Bring the vendor and what they
  do for you. Use the result to plan your next step.
explain: |
  A decision on how closely to watch a vendor, the questions to ask them, and a read of their security report that spots what the cover page hides. 
  First, the skill sorts the vendor into a risk tier based on what data and systems they touch. It then writes a questionnaire to match, aligned to the rules that apply to you, such as ISO 27001, SOC 2, DORA, NIS2 or HIPAA. When the vendor sends a SOC 2 Type II report, it reads it for exceptions, carved-out services, controls you must run yourself and gaps in dates that need a bridge letter. It also reviews data processing terms and the vendor's own suppliers.
when:
  - A team wants to buy a tool that will hold customer data.
  - A vendor sent a SOC 2 report and nobody has time to read 80 pages.
  - An auditor asks how you rank and monitor your suppliers.
  - You must prove you checked a vendor under EU rules.
you_give:
  - The vendor and what they do for you
  - The kind of data they will handle
  - Their SOC 2 report or questionnaire answers (optional)
  - Rules you must follow (optional)
you_get:
  - A risk tier with reasons
  - A tailored question list
  - A SOC 2 review with issues and next steps
  - A review schedule
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
