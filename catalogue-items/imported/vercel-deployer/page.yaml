thinking: low
thinking_why: It follows a fixed deploy path.
new_slug: vercel-deployer
name: Vercel deployer
summary: Deploy your app to Vercel and get a preview link. Your AI checks the project, team and branch first, and only goes live when you say yes.
job: ship-and-host
headline: Vercel deployer
subhead: Give your AI your project folder. It checks your project, team and branch, then deploys. You get the status and a link.
explain: |
  Check the project target and environment before deploying. A preview or production deployment depends on the configured target and explicit authorization.

  The skill starts with four checks: is there a git remote, is the folder linked to a Vercel project, is the Vercel CLI installed and signed in, and which teams you belong to. Then it verifies the configured project, branch, team, and environment before any deployment action. It runs the approved command, waits for status, and returns the resulting deployment link. Production requires explicit authorization; a preview is not guaranteed until the target is verified. It needs a Vercel account.
when:
  - You built an app and want a link to show a friend or client.
  - You want a preview of changes before they go to the live site.
  - You are not sure if your project is linked to Vercel yet.
  - You want to move from manual deploys to deploys on every push.
not_for:
  - "You want to host on Netlify, Cloudflare or AWS: use that host's own deploy guide, because this only works with Vercel."
  - "Your project is backend-only or not a website, such as a script or a mobile app: use a deploy guide for where it runs."
  - "You want to check that the live site works: open the link yourself, because this only returns the link and the build status."
you_give:
  - The project folder
  - A Vercel account
  - The team to deploy under, if you have several
  - A clear yes if you want production (optional)
you_get:
  - Deployment status and the resulting link
  - The project linked to Vercel
  - A check of git, login and team setup
  - Next steps for automatic deploys
how_to_use:
  - Open your project folder in an AI that can run commands, such as Claude Code or Codex. A plain chat window cannot deploy.
  - "Paste this skill and say: deploy my app to Vercel."
  - Pick your team when your AI asks. It only asks if you have more than one.
  - Say yes when it asks to push. It will name the branch and say preview or production first.
  - Say production only if you want the live site. Otherwise you get a preview.
  - Your AI lists the files it will commit before it pushes. Check that list has no .env files or keys.
  - Open the link your AI gives you and check the site yourself. Then ask your AI to set up deploys on every push, if you have not already. If you have no Vercel account, the no-account route makes a public preview link. Your project files are uploaded to Vercel, and the link stays public until you claim it.
output_sample:
  input:
    - Your project folder
    - A Vercel account (not needed for the no-account route)
    - The team to deploy under, if you have several
    - A clear yes if you want a live production deploy (optional)
  prerequisites:
    - An AI that can run commands in your project folder, such as Claude Code or Codex
    - The Vercel tool installed and signed in, or the no-account route
  output:
    - name: Project state check
      contains: Whether you have a git remote, a linked Vercel project, a signed-in Vercel tool and which teams you belong to.
    - name: Team choice
      contains: A list of your team names so you pick where the project is deployed.
    - name: Deployment link
      contains: The preview link, or the production link if you clearly asked for production.
    - name: Deployment status
      contains: Whether the build is still running, finished or failed, and whether it is a preview or production.
    - name: Claim link
      contains: "Only on the no-account route: a link to move the deployment to your own Vercel account."
next: [vercel-publisher]
