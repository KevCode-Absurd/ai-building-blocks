thinking_why: It follows a set deploy path.
new_slug: vercel-publisher
name: Vercel publisher
summary: Deploy your app to Vercel and get a live preview link back. Production only when you ask. Works with the Vercel CLI or without a login.
job: ship-and-host
headline: Vercel publisher
subhead: Say deploy my app and get a live address back. It uses the Vercel command line tool if you have it, and a no-login fallback if you do not.
explain: |
  Say deploy my app and get a live address back. It uses the Vercel command line tool if you have it, and a no-login fallback if you do not.

  The skill checks whether the Vercel CLI is installed, then runs the deploy command with a ten minute allowance, since builds can be slow. By default it publishes a preview. Production happens only if you say so, with the production flag. If there is no sign-in, a bundled script packages the project, detects the framework, uploads it and returns two links: a preview link and a claim link that lets you take ownership of the deployment later. If the network blocks the deploy, it reruns with wider access.
when:
  - You want a shareable link for a prototype in minutes.
  - You do not have a Vercel account yet and want to try it.
  - Your build is slow and a default time limit keeps cutting it off.
  - You need to ship to production after checking the preview.
not_for:
  - Your project holds secrets, .env files or private data. Remove them first, or use the Vercel CLI with your own account.
  - You need a site that stays private. The no-login preview link is public, and your files go to Vercel's no-login deploy service (codex-deploy-skills.vercel.sh), so use your own Vercel account with access settings.
  - You want the AI to test the live site after it deploys. This skill only returns the link, so check the site yourself.
you_give:
  - Your project folder, or a zipped copy of it
  - A clear yes for production (optional)
  - Permission for network access, if your AI is blocked (optional)
you_get:
  - A preview link
  - A claim link when deploying without login
  - A production deploy on request
  - Troubleshooting for network errors
how_to_use:
  - Open an AI that can run commands and see your project folder, such as Claude Code. Add the skill folder to it, or paste in the SKILL.md text. If you want the signed-in route, install the Vercel command line tool first with npm install -g vercel, then run vercel login. Skip this if you want the no-login route.
  - Remove secrets and .env files from the project first. The no-login deploy uploads the whole folder, and the preview link is public. Your AI will list what it is about to upload. Read that list and stop it if you see a key, token or private file.
  - Say "deploy my app". Your AI checks for the Vercel CLI and deploys a preview.
  - If you are not signed in to Vercel, it uses the no-login method. You get a preview link and a claim link.
  - Open the preview link and check the site. Then say "deploy to production" if you want it live.
  - If the deploy fails on the network, your AI will show you the exact command and ask before it reruns it with wider access. Read it, and say yes only if you are happy with it.
  - When the site is ready for good, switch to vercel-deployer. It checks the team, branch and project link, and sets up deploys on every push. Use this skill for a quick link. Use that one when the site will stay live.
output_sample:
  input:
    - Your project folder or a zipped copy of it
    - A yes for production (optional)
    - Permission for network access, if your AI is blocked (optional)
  prerequisites:
    - An AI that can run commands on your computer
    - The Vercel CLI and a Vercel account (optional, a no-login fallback exists)
  output:
    - name: Preview link
      contains: The live address of your deployed project. Every deploy is a preview unless you ask for production.
    - name: Claim link
      contains: A link that lets you take ownership of the deploy later. Only given for no-login deploys.
    - name: Production deploy
      contains: A live production release, made only when you clearly ask for it.
    - name: Network fix offer
      contains: If the deploy is blocked, a request to rerun it with wider network access.
