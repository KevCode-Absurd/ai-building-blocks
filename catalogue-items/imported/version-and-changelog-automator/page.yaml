thinking_why: It follows fixed versioning rules.
new_slug: version-and-changelog-automator
name: Version and changelog automator
summary: Point it at your repo. Get release numbers and a changelog worked out
  from your commits.
job: ship-and-host
headline: Version and changelog automator
subhead: Point it at your repo. Get release numbers and a changelog worked out
  from your commits. Bring a git repository with commit history. Use the result
  to plan your next step.
explain: |
  Your next version number and a readable changelog, worked out from the commit messages you already wrote. 0.

  The skill follows semantic versioning: a major number for breaking changes, minor for new features, patch for fixes, with optional alpha or beta tags. It reads commits written in the conventional style, where feat means a minor bump, fix means a patch, and an exclamation mark or a breaking change note means a major one. It sets up the semantic-release tool and its changelog and git plugins, with a config file and a branch rule. It needs a git repo with history and Node.
when:
  - You release often and keep forgetting to update the version.
  - Your changelog is empty or written by hand at the last minute.
  - You want releases to run from the main branch with no manual steps.
  - Your team needs one clear rule for what counts as a breaking change.
you_give:
  - A git repository with commit history
  - Your release branch name
  - Whether your commits use the conventional format
  - Node installed
you_get:
  - The next version number
  - A generated changelog
  - A release tool configuration
  - A commit message guide for the team
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and read your project files.
