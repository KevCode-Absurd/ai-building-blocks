thinking: medium
thinking_why: It applies a set law to your facts.
new_slug: vietnam-data-privacy-checker
name: Vietnam data privacy checker
summary: Check your Vietnam data privacy duties under the 2026 law. Describe your data and get a gap list, transfer checks and a fix plan.
job: check-contracts
headline: Vietnam data privacy checker
subhead: A clear list of what Vietnam's new personal data law asks of you, with gaps marked and a plan to close them. It matters because the law took effect on 1 January 2026 and reaches foreign firms that handle data about people in Vietnam.
explain: |
  A clear list of what Vietnam's new personal data law asks of you, with gaps marked and a plan to close them. It matters because the law took effect on 1 January 2026 and reaches foreign firms that handle data about people in Vietnam.

  You describe what personal data you collect and where it goes. The skill sorts it into basic and sensitive data, checks your consent and notices, and tests any transfer abroad. It then covers breach reporting, sector rules for finance, AI and cloud, and what your data protection officer needs. It reads the law and its decree text before it drafts any advice.
when:
  - You sell to customers in Vietnam and need to know what the new law requires of you.
  - You send Vietnamese user data to servers or vendors in another country.
  - You need a privacy notice or internal policy that matches the 2026 rules.
  - You want to check your breach response steps before something goes wrong.
not_for:
  - "You need legal advice you can rely on in court or with the regulator: use a Vietnamese lawyer or an accredited assessor."
  - "Your data is not about people, such as pricing or stock data: you do not need this check."
  - "You need a privacy law check for another country: use a local lawyer, as this covers Vietnam only."
you_give:
  - A description of the personal data you collect
  - Where the data is stored and who receives it
  - Your business type and sector
  - Your current privacy notice or consent wording (optional)
you_get:
  - A list of your duties under the law
  - A cross-border transfer check
  - Gaps in consent, notices and policies
  - A step-by-step fix plan
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. Paste in the skill text. No code or paid tool is needed.
  - Have ready a list of the data you collect, your vendors and the countries data goes to, the date you first sent data abroad, and your headcount. Describe where it is kept and who gets it.
  - Add your business type and sector, such as finance, AI or cloud.
  - Paste your current privacy notice or consent wording, if you have one (optional).
  - Read the gap list and check each point against the official law text. Duties, deadlines and the 72-hour breach rule come from the skill's summary of Law 91/2025 and Decree 356/2025. The penalty table and its dates are an unchecked summary, so your AI should give you violation types without exact fines unless you paste the official decree.
  - Take the plan to your data protection officer or Vietnamese counsel before you act. The skill does not link the official law text, so find it yourself on Vietnam's official legal database (vbpl.vn) or the Official Gazette (congbao.chinhphu.vn) and check every fine and date against Decree 330/2026 before you quote it. The author's last check was on 5 September 2026, and none of the figures were rechecked here. This is general information, not legal advice.
  - Next, use privacy-impact-assessment-writer for the transfer and data protection assessments the gap list calls for, and agency-data-privacy-officer for ongoing privacy work. Run the breach response steps with your counsel before you need them.
output_sample:
  input:
    - A description of the personal data you collect
    - Where the data is stored and who receives it
    - Your business type and sector
    - Your current privacy notice or consent wording (optional)
  output:
    - name: Executive Summary
      contains: A short view of how ready you are for the Vietnam law and the main risks.
    - name: Gap Register
      contains: A table of each control area with your current state, the gap, the risk and the fix.
    - name: Priority Actions
      contains: The fixes to do first, with owners and timelines.
    - name: SME Exemptions Applicable
      contains: Any small business relief that applies to you, if any.
    - name: Cross-border transfer impact assessment
      contains: A template filled in with your facts when you send data out of Vietnam.
    - name: Privacy notice and policy review
      contains: What your notice and consent wording must include, and what yours is missing.
    - name: Breach response steps
      contains: The 72-hour sequence from containing a breach to review, and what a report must say.
