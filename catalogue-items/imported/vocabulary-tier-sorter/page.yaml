new_slug: vocabulary-tier-sorter
name: Vocabulary tier sorter
summary: Paste a text or topic. Get its words sorted into everyday, school and
  subject words, with what to teach first.
job: teach-and-train
headline: Vocabulary tier sorter
subhead: The words in your text, sorted into everyday words, school words and
  subject words, so you know what to teach first. It saves you from pre-teaching
  the whole page.
explain: |
  The words in your text, sorted into everyday words, school words and subject words, so you know what to teach first. It saves you from pre-teaching the whole page.

  Paste a text or name a topic, and add the student age and subject. The skill places each word in one of three groups: common words most students know, useful words that appear across school subjects, and specialist words tied to this topic. It picks the school words as the best ones to teach in depth, because they carry the most reading value. It then gives a teaching order you can cap at a set number of words, with notes for students learning English.
when:
  - You are about to give students a hard reading passage.
  - You plan a unit and need a short list of key words.
  - You teach students who speak another language at home.
  - You want to know which words matter most when time is short.
you_give:
  - A text extract or a topic
  - Student age or year group
  - The subject
  - English level of your students (optional)
  - A maximum number of words to pre-teach (optional)
you_get:
  - Words sorted into three groups
  - A priority list of words to teach
  - A suggested teaching order
  - Support notes for language learners
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
