thinking: medium
thinking_why: It learns your style first and then measures the draft.
new_slug: voice-matched-post-writer
name: Voice-matched post writer
summary: Paste five posts you wrote. Get a new Twitter/X or LinkedIn post in your voice, checked against your own style before you see it.
job: grow-social
headline: Voice-matched post writer
subhead: New Twitter/X or LinkedIn posts that sound like you wrote them, checked against how you really write. Most AI drafts read like nobody; this one starts from your own posts.
explain: |
  New Twitter/X or LinkedIn posts that sound like you wrote them, checked against how you really write. Most AI drafts read like nobody; this one starts from your own posts.

  You paste five ordinary recent posts. If you cannot, you answer four short questions about your topics, openings, pace and words you never use. The skill writes a voice sketch covering how you open, your sentence length and your habits, and shows it to you before drafting. It then writes the post, compares the draft to the sketch and fixes lines that drift. You can also paste text and ask whether it sounds like you.

  On its own it only writes text. It posts nothing. The optional VoiceMoat connector is a paid service (Pro or Enterprise plan) and it sends your post text to voicemoat.com when you use it. You do not need it. The skill file header carries a risk label from the source, which comes from the optional VoiceMoat connector that can post for you.

  Licence: the LICENSE-CONTENT file in this item governs this copy. It says CC BY 4.0 for written content like this skill. The author's own header (prateeks367) says MIT. Both are permissive and both need credit, so keep the credit to prateeks367 and sickn33 if you share it.
when:
  - You post on LinkedIn or X and want drafts that need less editing.
  - Your AI posts all sound generic.
  - You want to turn a rough idea into a hook and short thread.
  - You want to test if a piece of text sounds like you.
not_for:
  - "You want writing that is not for Twitter/X or LinkedIn, like emails or blog posts: use your AI with a plain prompt, or ask a person who knows your voice."
  - "You want a numeric voice score or a profile built from your full post history: use the paid VoiceMoat connector, which needs a Pro or Enterprise plan."
  - "You want a promise of reach or likes: no tool can give that, so test the post with a small audience first."
you_give:
  - Five recent posts you wrote
  - The topic or idea for the new post
  - "The platform: X or LinkedIn"
  - Words or tones to avoid (optional)
you_get:
  - A short sketch of your writing voice
  - A draft post in that voice
  - A match check against your samples
  - Edit notes for lines that sound off
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - Paste five ordinary posts you wrote yourself. If you cannot, answer the four short style questions.
  - Read the voice sketch your AI shows you. Correct anything that is wrong.
  - Say the topic and the platform, then read the draft and the match check.
  - Edit the lines your AI flagged, then ask for the match check again on your last edit. When it passes, paste the final post into your scheduler.
  - "Optional: the VoiceMoat connector needs a paid Pro or Enterprise plan. It can post to your real account, but only after a preview and your clear yes."
next: [x-thread-writer, x-reply-writer]
output_sample:
  input:
    - Five recent posts you wrote yourself, pasted in
    - The topic or idea for the new post
    - "The platform: Twitter/X or LinkedIn"
    - Four short answers about your style, if you cannot paste posts (optional)
  prerequisites:
    - Any chat AI such as Claude, ChatGPT or Gemini
    - A paid VoiceMoat plan and sign-in, only if you want the optional connector
  output:
    - name: Voice sketch
      contains: About six lines on how you open, your sentence length, your words, your tone and what you never do.
    - name: Sketch check
      contains: A question asking if anything in the sketch is wrong, before any drafting starts.
    - name: Draft post
      contains: One post written against your sketch, or three different openings if you are stuck on the first line.
    - name: Match check
      contains: A line-by-line note on what fits your samples and what drifted, with the fixes it made.
    - name: Weak spot note
      contains: One line on what the AI was unsure about, so you know where to edit.
