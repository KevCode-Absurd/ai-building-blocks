thinking_why: It sends one recording to a set tool and saves the result.
new_slug: voice-swap-editor
name: Voice swap editor
summary: Swap the voice in a recording and keep your timing and emotion. Give it an audio file and a voice. You get a voice changer result.
job: work-with-audio
headline: Voice swap editor
subhead: The same recording, spoken by a different voice, with your timing, emotion, breaths and pauses kept. It is useful when the performance is right but the voice is not.
explain: |
  The same recording, spoken by a different voice, with your timing, emotion, breaths and pauses kept. It is useful when the performance is right but the voice is not.

  The skill uses the ElevenLabs voice changer, which converts speech to speech. You give an audio file and pick a target voice from your voice library. It handles the limits: five minutes and 50 MB per request, so longer files are cut into chunks and joined again. It also covers output format choices and noise handling. It does not make or clone new voices, only converts into one you already have. It needs an ElevenLabs account and API key. ElevenLabs bills by the length of audio processed, counted against your plan, so check your current plan before you convert long files.

  This is an MIT-licensed copy of the ElevenLabs voice changer skill. We changed only the plain name and this page text. The method is theirs, and credit goes to ElevenLabs.
when:
  - You recorded a scratch performance and want a character voice on top.
  - You want to dub a voice-over in a different voice without re-recording.
  - You need to hide who a speaker is.
  - A voice-over has the right feel but the wrong voice.
not_for:
  - "You want to make or clone a new voice from a sample: use a voice cloning tool, because this only converts into a voice you already have."
  - "You want to turn written text into speech: use a text-to-speech tool instead."
  - "You do not have permission to use the voice, or the speaker has not agreed: ask the voice owner first, or pick a stock voice."
you_give:
  - An audio recording, under 50 MB
  - The voice to use from your library
  - Preferred audio format (optional)
  - An ElevenLabs account and API key
you_get:
  - A converted audio file
  - Settings that suit your clip
  - A plan for splitting long recordings
  - Notes on cleaning noisy input
how_to_use:
  - Check you have permission to use the target voice. If it is a real person's voice, get their OK first.
  - Get an ElevenLabs account and API key. The setup step runs a command (npx @elevenlabs/cli onboard init) that downloads a tool from npm, signs you in and stores a key for your project. Your AI will tell you before it runs it. If you prefer, make a key in your ElevenLabs account and set it yourself.
  - Open an AI that can run code and has internet access. Paste the skill and add your audio file.
  - Tell your AI which voice from your library to use. Say if the recording is noisy or longer than 5 minutes.
  - Ask it to convert the file and save the result as a new audio file, such as converted.mp3.
  - Play the result. Check that the pacing and feeling match your recording. If not, ask for a different voice setting. If the recording is noisy, clean it with a voice isolator first. To use a voice you have not made yet, clone it first (with the speaker's consent), then use its voice ID here.
output_sample:
  input:
    - Your audio recording, under 5 minutes and 50 MB per piece
    - The voice you want from your ElevenLabs voice library
    - Output format (optional)
    - "Clean up background noise: yes or no (optional)"
  prerequisites:
    - An ElevenLabs account and API key
    - An AI that can run code and reach the internet
    - Permission from the owner of any real person's voice you use
  output:
    - name: Converted audio file
      contains: Your recording spoken in the new voice, with the same timing, emotion, breaths and pauses.
    - name: Settings for your clip
      contains: The model, output format, voice settings and noise option that suit your recording.
    - name: Chunk plan for long recordings
      contains: Where to cut files over 5 minutes at natural pauses, then join the converted pieces.
    - name: Noise handling note
      contains: Whether to remove background noise first, because a cleaner source gives a better conversion.
