thinking: high
thinking_why: It solves a route puzzle for every pick list.
new_slug: warehouse-picker-route-planner
name: Warehouse picker route planner
summary: Cut picker walking time. Give it your aisle map and pick list, and get a route in walking order that respects one-way aisles, with distance saved.
job: plan-supply-chain
headline: Warehouse picker route planner
subhead: "Give it your aisle layout, where pickers start and finish, and a pick list. It checks which aisles can be walked, picks a routing method, and puts each list in walking order. You get the route, the distance compared with today, and rules your team can follow."
explain: |
  A picker route planner turns a list of items to pick into a short, walkable route through your aisles. This skill builds the route from your own map, so it works for a small stockroom or a large warehouse. It gives pick path planning without special software.

  It treats your warehouse as a set of paths. Each aisle, cross-aisle and one-way rule becomes part of the map. It first checks that a picker can reach every pick and get back out. If an aisle is a dead end with no way back, it tells you, and does not draw a route that cannot be walked.

  Then it compares routing methods, such as walking each aisle end to end, going in and back out, or skipping the biggest gap. It sorts your list into walking order and shows the distance before and after. In a chat this is a manual method, so the result is an estimate. It is only a proven shortest route if an exact solver was run.
when:
  - Pickers walk back and forth and orders take too long.
  - You group orders into batches and need the best order of stops.
  - You moved stock or changed aisles and the old routes no longer fit.
  - You want to know how much walking a layout change would save before you make it.
not_for:
  - "You need to decide which orders go together in one trip: use the Picking batch planner first, then route each batch here."
  - "You want fast sellers moved closer to the pack area: use the Warehouse slot assigner."
  - "You plan truck routes between sites, not walking routes inside one building: use the Multi-warehouse route planner."
  - "You have one or two items per order in a very small stockroom. A simple rule, such as walking aisles in number order, is enough."
you_give:
  - Aisle map with lengths, cross-aisles and which way each aisle can be walked
  - Where pickers start and finish
  - A pick list with order or batch ID, SKU, aisle and position
  - Pick method and equipment such as walking, cart or forklift (optional)
  - Your current method and picks per hour (optional)
you_get:
  - A check that every pick can be reached and left by a legal path
  - The routing method that fits your layout, with the reason
  - Each pick list in walking order
  - Walking distance compared with your current method
  - A few plain rules your team can follow
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. It works in a chat. It runs better if your AI can run code, but this is not required.
  - Do not use the demo numbers in the skill's code. They are random sample data. Paste your real aisle lengths, widths and pick positions before any calculation.
  - Describe your aisles. Give the number, the length of each, where cross-aisles are, and any one-way aisles.
  - Paste a pick list as a table with order or batch ID, SKU, aisle and position in the aisle.
  - Say where pickers start and finish, and how they walk today.
  - Read the layout check first. If it reports a dead end, fix the layout or add the missing access before you trust any route.
  - The code in the skill is a sketch, not a tested tool, and in a chat your AI may work the arithmetic by hand. Check each route by hand on a small layout before you trust it, and treat every distance and every efficiency figure as an estimate or a rule of thumb.
  - Walk one route on the floor and time it. Compare it with the estimate before you change the whole floor.
how_it_works:
  - title: Collect the layout
    text: It asks for aisles, cross-aisles, depot, aisle direction and equipment limits. Missing items are marked MISSING.
  - title: Build the path map
    text: It turns the layout into a map of paths, with one-way aisles as one-way paths.
  - title: Check the layout
    text: It tests that every pick can be reached and left. A dead end with no way out is reported as not possible.
  - title: Choose a method
    text: It picks between walking each aisle through, going in and back, a mid-aisle split and skipping the biggest gap.
  - title: Sort the list
    text: It puts each pick list in walking order and measures distance along the paths, not in a straight line.
  - title: Compare and report
    text: It shows distance against your current method, labels it an estimate and lists rules for your team.
output_shape: |
  Layout check: <aisles, depot, one-way flags, dead ends found>
  Pick list summary: <order or batch ID, number of picks, aisles, zones>
  Routing comparison: <method, distance, time, change vs current>
  Recommended route: <numbered picks in walking order, cross-aisle moves>
  Team rules: <3 to 5 plain rules>
  Assumptions and next steps: <assumed figures, what to measure on the floor>
output_sample:
  input:
    - Your aisle map, with lengths, cross-aisles and one-way flags
    - Where pickers start and finish
    - A pick list with order or batch ID, SKU, aisle and position
    - Your current routing method and picks per hour (optional)
  prerequisites:
    - "Python packages scipy and OR-Tools, if you run the routing code yourself"
  output:
    - name: Layout check
      contains: Whether every pick can be reached and left, and any dead ends found.
    - name: Pick List Summary
      contains: Number of picks, aisles involved and zones for each order or batch.
    - name: Routing Comparison
      contains: Walking distance and time for your current method and each method tried.
    - name: Recommended Route
      contains: A numbered table of picks in walking order, with cross-aisle moves.
    - name: Rules for your team
      contains: Three to five plain rules, such as which end to enter each aisle from.
    - name: Assumptions and next steps
      contains: Each assumed figure, and what to time on the floor to confirm it.
works_best_with:
  tools:
    - name: Any good chat AI
      why: The route work is lists and arithmetic. Claude, ChatGPT and Gemini all do it in a chat.
    - name: An AI that can run Python
      why: It can compute distances for long pick lists and check its own route.
  inputs:
    - A sketch or photo of the floor plan with aisle numbers
    - An export of recent pick lists from your system
    - Your walking speed and seconds per pick, timed on the floor
    - Notes on where pickers get blocked
terms:
  - term: Cross-aisle
    meaning: A path that cuts across the aisles so pickers can switch aisles mid-way.
  - term: Depot
    meaning: The spot where pickers start and drop off, such as a pack station.
  - term: One-way aisle
    meaning: An aisle pickers may walk in only one direction.
  - term: S-shape routing
    meaning: Walking each aisle that has picks from one end to the other, then moving to the next.
