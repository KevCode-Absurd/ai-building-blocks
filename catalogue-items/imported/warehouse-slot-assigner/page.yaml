thinking: medium
thinking_why: It ranks items by pick rate, then maps them to spots.
new_slug: warehouse-slot-assigner
name: Warehouse slot assigner
summary: Plan which product goes in which warehouse slot so fast sellers sit closest. Give it your pick counts and locations. Get a slot plan and a reslot schedule.
job: plan-supply-chain
headline: Warehouse slot assigner
subhead: A plan for which product goes in which storage spot, so fast sellers sit close and slow ones sit far away. That cuts the distance pickers walk each day.
explain: |
  A plan for which product goes in which storage spot, so fast sellers sit close and slow ones sit far away. That cuts the distance pickers walk each day.

  You give the product list with picks per month, size and weight, plus the storage locations and any rules like cold zones or heavy items low. The skill ranks products by how often they are picked and by cube movement, which mixes volume and speed. It puts the top movers in the easiest spots near the dock and balances the load between aisles. It respects product rules and shows when to refresh the plan as demand shifts.
when:
  - Your best sellers are stored at the back of the building.
  - You are setting up a new site and need a first slot plan.
  - Peak season changes what moves fastest.
  - Pickers queue up in one busy aisle.
not_for:
  - "You need the best walking route for pickers: use a picker routing tool or ask your AI for a pick path plan, as this plan only sets where items sit."
  - "You are designing a new building or its aisles: use a warehouse design plan, as this plan only fills slots you already have."
  - "You have no pick counts for your products: count picks for a few weeks first, or the ranking will be a guess."
you_give:
  - Product list with picks per month (the skill uses a monthly count)
  - Product size and weight
  - Storage locations and levels
  - Rules such as cold, hazmat or first-in-first-out (optional)
you_get:
  - A product-to-slot assignment
  - A ranked list of fast movers
  - Rules for heavy and special items
  - A schedule for reslotting
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill text into a new chat.
  - Add your product list as a table. Include a product ID, picks per month, size per unit and weight.
  - Add your storage locations with their level and capacity. Add your rules, such as cold zones or heavy items low.
  - Ask your AI to rank your products and assign each one to a slot.
  - Check the top 25 moves first. Make sure each one fits its slot and your rules.
  - Compare the travel and picks-per-hour gains with your real pick records before you quote them. Then pair the plan with warehouse-picker-route-planner, and run the ranking again when pick counts change.
  - For a long list, use an AI that can run code (Python) and upload your spreadsheet as a file.
output_sample:
  input:
    - Your product list with picks per month
    - Product size and weight
    - Your storage locations, levels and how much each holds
    - Your rules, such as cold, hazmat or first-in-first-out (optional)
    - Which items are often ordered together (optional)
  prerequisites:
    - An AI that can run code (Python) if you have a long product list
    - A spreadsheet or CSV of your products and locations
  output:
    - name: Executive Summary
      contains: Your current pick rate, the expected rate after the change, how many products move and a rough time to do it.
    - name: ABC Analysis Results
      contains: Products grouped by how often they are picked, with the zone each group should use.
    - name: Top SKUs for the Golden Zone
      contains: Your fastest products with their current spot, the best spot and the walking saved.
    - name: Product Affinity Clusters
      contains: Groups of products often ordered together, with the aisles where each group should sit.
    - name: Implementation Plan
      contains: A phased move plan, starting with the fastest sellers and ending with slow stock.
    - name: Expected Benefits
      contains: A table comparing current and planned pick travel, picks per hour and labor hours.
    - name: Maintenance Plan
      contains: How often to check pick rates and redo the plan as demand shifts.
