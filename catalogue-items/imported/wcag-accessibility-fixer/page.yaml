thinking: medium
thinking_why: It scans with set rules, then fixes and rechecks.
new_slug: wcag-accessibility-fixer
name: WCAG accessibility fixer
summary: Point it at your site code. Get WCAG 2.2 problems found, fixed and
  checked again.
job: build-websites
headline: WCAG accessibility fixer
subhead: A website with its accessibility problems found, fixed and checked
  again, against WCAG 2.2 levels A and AA. That makes it usable for people with
  screen readers, keyboards or low vision, and lowers your legal risk.
explain: |
  A website with its accessibility problems found, fixed and checked again, against WCAG 2.2 levels A and AA. That makes it usable for people with screen readers, keyboards or low vision, and lowers your legal risk.

  The skill reads your code and spots your framework, such as React, Vue or plain HTML. It lists each issue as critical, major or minor, and gives a before and after code fix. It checks colour contrast pairs, keyboard order and focus, form labels, image text and headings. After the fixes it scans again to make sure nothing broke. It also writes a report for non-developers and a pipeline config to catch new issues.
when:
  - A customer or lawyer asked if your site meets WCAG.
  - You want to fix accessibility issues before launch.
  - Your team keeps adding new problems with each release.
  - You need a plain report for managers.
you_give:
  - Your site code or the project folder
  - The framework in use (optional)
  - Pages that matter most (optional)
  - Your build system, if you want a pipeline check (optional)
you_get:
  - A list of issues by severity
  - Before and after code fixes
  - A re-check after the fixes
  - A report for managers
  - A pipeline check to stop new issues
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can read and change your project files.
