thinking: medium
thinking_why: It plans the timeline, then writes the code.
new_slug: web-animation-builder
name: Web animation builder
summary: "Describe the motion you want and get Anime.js web animation code: staggered grids, timed sequences and SVG line drawing for your page."
job: build-websites
headline: Web animation builder
subhead: Describe the motion you want and where it happens. Your AI writes Anime.js code for it. Think headings that slide in one by one, cards that fade in as a grid, or an SVG line that draws itself.
explain: |
  Smooth, timed animations for your page, written with the Anime.js library. Think headings that slide in one by one, cards that fade in as a grid, or an SVG line that draws itself.

  You describe the motion you want and where it happens. The skill picks the targets, sets the properties and chooses easing, including spring and custom curves. It builds timelines so several effects run in order or overlap, and uses stagger to offset items in a list. It also covers SVG path drawing and shape morphing. It checks which version of the library you have, since the code differs between versions. You need a web project where you can add JavaScript.
when:
  - You want your landing page to feel alive when it loads.
  - A grid of cards should appear one after another.
  - You want a logo or line drawing to animate on screen.
  - CSS transitions are too limited for what you have in mind.
not_for:
  - "You only need a simple hover or fade on one thing: use plain CSS transitions, no library needed."
  - "Your page is mostly data or forms and motion would distract: leave it static."
  - "You use Anime.js version 4 and want v3 code: ask your AI to check the version first, or read the official Anime.js docs."
you_give:
  - A description of the motion you want
  - The page or elements to animate
  - Your Anime.js version, or permission to install it
  - Timing or mood notes (optional)
you_get:
  - Working animation code
  - A timeline that sets the order of effects
  - Easing and stagger settings
  - Notes for adding it to your page
how_to_use:
  - Open your AI and paste this skill, or add the skill file.
  - Paste the part of your HTML you want to animate. Describe the motion in one sentence, such as "headings slide in one by one".
  - Say which Anime.js version you use, or ask your AI to check first.
  - Copy the code into your project and make sure the selectors match your HTML.
  - Open the page in a browser and confirm one element animates as you described. Check it on a phone too.
  - This works best when your AI can run code and open a browser. Otherwise, test it yourself. Next, turn on reduced motion in your device settings and check the page still works, then run a landing page check before you publish.
next: [accessible-ui-builder]
output_sample:
  input:
    - A description of the motion you want
    - The page or elements to animate
    - Your Anime.js version (optional)
    - Timing or mood notes (optional)
  prerequisites:
    - A web project where you can add JavaScript
    - Anime.js installed, or permission to add it
  output:
    - name: Animation code
      contains: A JavaScript timeline that sets targets, easing, stagger and the order of effects.
    - name: Selectors list
      contains: The class names or elements your HTML must have for the code to find.
    - name: Version note
      contains: Which Anime.js version the code is written for, since v3 and v4 differ.
    - name: Reduced-motion fallback
      contains: A plain final state for visitors who turn motion off in their settings.
    - name: Setup notes
      contains: How to add the code to your page and test it in a browser.
