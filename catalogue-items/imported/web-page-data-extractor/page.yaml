thinking: medium
thinking_why: It follows set steps to pull the data out of pages.
new_slug: web-page-data-extractor
name: Web page data extractor
summary: Give it page links. Get tables, lists and prices as a CSV or JSON file.
  Collects data from websites.
job: work-with-files
headline: Web page data extractor
subhead: Tables, lists and prices pulled from web pages into a CSV or JSON file
  you can open in a spreadsheet. It saves hours of copying and pasting.
explain: |
  Tables, lists and prices pulled from web pages into a CSV or JSON file you can open in a spreadsheet. It saves hours of copying and pasting.

  You give the page links and say what data you want. The skill tries more than one approach to read each page, so it copes with different layouts. It follows page numbers to collect every result, not just the first page, and can re-run the job to watch for changes such as price moves. It exports to CSV or JSON. It collects data from websites, so check the site's terms and robots rules first, and go slowly. It runs as a script and may need Python.
when:
  - You want a price list from several product pages.
  - A table on a site is too long to copy by hand.
  - You track a competitor's prices over time.
  - You need a list of items in a clean file.
you_give:
  - One or more page links
  - The data you want, such as name and price
  - Number of pages to follow (optional)
  - How often to re-run (optional)
you_get:
  - A CSV or JSON file
  - One row per item found
  - Data from all result pages
  - A re-run script for tracking changes
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and reach the web.
