thinking: medium
thinking_why: It reads clear speed signals and ranks well-known fixes.
new_slug: web-page-speed-tuner
name: Web page speed tuner
summary: Give it a slow site. Get fixes for network, loading and rendering,
  ranked by gain. Uses High Performance Browser Networking.
job: build-websites
headline: Web page speed tuner
subhead: "A ranked list of fixes that make your slow site faster, starting with
  the ones that gain the most. It is grounded in one idea: delay, not bandwidth,
  is what slows most pages."
explain: |
  A ranked list of fixes that make your slow site faster, starting with the ones that gain the most. It is grounded in one idea: delay, not bandwidth, is what slows most pages.

  You give the site and what feels slow. The skill looks at the path a request takes: DNS lookup, connection, secure handshake, then the data. It checks protocol versions, caching, compression and the order resources load in. It looks at what blocks the first paint, image size, fonts and scripts. It then checks eight items and scores them, weighted toward real-user measures like load time and layout shifts. Each fix comes with the reason it helps.
when:
  - Pages take several seconds to show up.
  - Your speed score is poor and you do not know why.
  - You want to get faster on mobile networks.
  - You are choosing between many small fixes and need an order.
you_give:
  - Your site address or code
  - Speed test results or numbers (optional)
  - Your hosting and tools (optional)
  - Pages that matter most
you_get:
  - A ranked list of fixes with expected gain
  - Changes for network, loading and rendering
  - A score on eight checks
  - Config or code changes
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
