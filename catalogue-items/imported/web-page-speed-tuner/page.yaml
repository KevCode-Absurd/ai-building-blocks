thinking: medium
thinking_why: It reads clear speed signals and ranks well-known fixes.
new_slug: web-page-speed-tuner
name: Web page speed tuner
summary: Find why your slow website is slow. Give it your site and speed numbers. You get a ranked list of fixes, best gain first, plus a score out of 10.
job: build-websites
headline: Web page speed tuner
subhead: "A ranked list of fixes that make your slow site faster, starting with the ones that gain the most. It is grounded in one idea: delay, not bandwidth, is what slows most pages."
explain: |
  A ranked list of fixes that make your slow site faster, starting with the ones that gain the most. It is grounded in one idea: delay, not bandwidth, is what slows most pages.

  You give the site and what feels slow. The skill looks at the path a request takes: DNS lookup, connection, secure handshake, then the data. It checks protocol versions, caching, compression and the order resources load in. It looks at what blocks the first paint, image size, fonts and scripts. It then checks eight items and scores them, weighted toward real-user measures like load time and layout shifts. Each fix comes with the reason it helps.
when:
  - Pages take several seconds to show up.
  - Your speed score is poor and you do not know why.
  - You want to get faster on mobile networks.
  - You are choosing between many small fixes and need an order.
not_for:
  - You want to change how the page looks. Use a design guide or ask a designer, since this only covers speed.
  - You want better fonts or type choices. Ask for a typography review, since this only covers how fonts load.
  - You have no speed numbers yet. Run a free PageSpeed or Lighthouse test first, then come back.
you_give:
  - Your site address or code
  - Speed test results or numbers (optional)
  - Your hosting and tools (optional)
  - Pages that matter most
you_get:
  - A ranked list of fixes with expected gain
  - Changes for network, loading and rendering
  - A score on eight checks
  - Config or code changes
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the full SKILL.md text, or add the skill to your AI. This is a general method for any site. It is not tied to one site type. It diagnoses the network, loading and caching causes of slowness. To go from a finished Lighthouse report to fixes, use page-speed-fixer. For image and script cleanup, use website-speed-tuner.
  - Run a free speed test on your key pages, such as PageSpeed Insights, and copy the numbers.
  - Your AI cannot load a live site. Paste the page HTML, the response headers (for example from curl -I) and the PageSpeed or Lighthouse report, plus what feels slow.
  - Read the score and the failed checks first. Any number you did not give is marked unknown.
  - Start with the top fix on the ranked list. Fixes to the page code are for your developer. Caching and compression fixes are for your host or CDN admin. Run the same speed test again afterwards to compare.
output_sample:
  input:
    - Your site address or code
    - Your PageSpeed or Lighthouse numbers (optional)
    - Your hosting and tools (optional)
    - The pages that matter most
  prerequisites:
    - An AI chat such as Claude, ChatGPT or Gemini
    - Speed test numbers, or your AI will mark them unknown
  output:
    - name: Score
      contains: A score out of 10 based on how many of the eight diagnostic checks pass.
    - name: Failed checks
      contains: Which of the eight checks failed, so you see where the problems are.
    - name: Ranked fixes
      contains: Each fix in order of expected gain, with the reason it helps.
    - name: Network fixes
      contains: Changes to protocol version, connections, and round trips between the browser and your server.
    - name: Loading and caching fixes
      contains: Changes to resource order, caching rules, compression and files that block the first paint.
    - name: Config or code changes
      contains: Settings or code you can apply to make each fix.
next: [page-speed-fixer, website-speed-tuner]
