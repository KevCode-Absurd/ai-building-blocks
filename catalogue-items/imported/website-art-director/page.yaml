thinking: high
thinking_why: It picks a look, builds the page, then looks at screenshots and fixes them.
new_slug: website-art-director
name: Website art director
summary: Build a website or app screen with a real design idea, not a template. Your AI picks a look, builds the page and checks it in a browser.
job: build-websites
headline: Website art director
subhead: "A built web page with a chosen look, checked in a real browser, not a stock template. It stops pages from all looking the same: centred headline, icon cards, soft gradient."
explain: |
  A built web page with a chosen look, checked in a real browser, not a stock template. It stops pages from all looking the same: centred headline, icon cards, soft gradient.

  The skill deals out three design directions from a library the author built from a study of 247 gallery sites. The study and its scores are the author's own claims, run with AI reviewers, and have not been checked independently. You pick the one that fits the idea behind your subject. A script then supplies type, palette and layouts for it. After building, a browser script measures the page against strict rules with no decorative filler. You then view screenshots at three widths, score them against a rubric, fix what falls short and look again. It works for landing pages and for app screens such as dashboards.
when:
  - Your page looks like every other AI-made page.
  - You are building a landing page or portfolio and want a real concept.
  - You want a dashboard that looks designed, not default.
  - You need a polish pass on a page before launch.
not_for:
  - "You must match an existing brand system exactly: keep your brand rules and ask your AI to build within them, since this skill draws a fresh look."
  - "You only need a quick page with no design thinking: use a simple page builder or a plain template."
  - "You cannot run code or open a browser: a chat-only AI can plan the look but cannot check the screenshots, so ask a web designer to review."
you_give:
  - What the site or screen is for
  - The subject, audience and feel
  - Your stack, such as HTML or React
  - Brand assets or sites you admire (optional)
you_get:
  - A chosen design direction
  - A built page or screen
  - Screenshots at three widths
  - A fix list after review
how_to_use:
  - Use an AI that can run code and open a browser, such as Claude Code. A chat-only AI can plan but cannot check the page. You need Node 22 or newer, an installed Chrome, Edge or Chromium, and an internet connection for the picture search.
  - Download the skill folder and add it to your AI tool, or paste in the SKILL.md text.
  - Tell your AI what the site or screen is for, who it is for and how it should feel. Add your stack and any brand files.
  - Ask your AI to build it with this skill. It deals three directions and you pick one.
  - Review the screenshots and the fix list. Ask for more rounds if a score falls short.
  - Swap any sample content and add picture credits before you launch. Sample dish names, rates and project titles are marked as placeholders on the page.
  - Next, check the inspector results and run accessibility checks before you launch. Use wcag-accessibility-fixer for that.
output_sample:
  input:
    - What the site or screen is for
    - The subject, audience and feel
    - Your stack, such as HTML or React
    - Brand assets or sites you admire (optional)
  prerequisites:
    - An AI that can run code and open a browser
    - Your project files, if you are redesigning an existing page
    - Internet access, because the picture search needs the network. Any found picture must be credited before launch.
  output:
    - name: Direction sheet
      contains: The look your AI chose from three dealt options, with its type, palette, hero and section layouts.
    - name: Idea sentence
      contains: One line on the concept taken from your subject, which shapes the whole page.
    - name: Copy deck
      contains: The words for each section, written before the build, starting with the first-screen headline.
    - name: Built page or screen
      contains: Your page in your stack, built to the house rules with no filler ornaments.
    - name: Inspector results
      contains: Browser checks at 1440, 768 and 390 pixels wide, which must show no fails.
    - name: Screenshots and critique
      contains: Screenshots at three widths, scored against a rubric, with the fixes made after each round.
    - name: Credits and handover notes
      contains: Credits for any found pictures, what stands in for photos, and sample content to swap before launch.
