thinking: high
thinking_why: It weighs many kinds of problems and ranks them with evidence.
new_slug: website-fix-backlog-builder
name: Website fix backlog builder
summary: Find the fixes your website needs most. Give it your live site and goal, and get a ranked list of conversion, usability, message and speed fixes.
job: audit-landing-page
headline: Website fix backlog builder
subhead: A ranked list of fixes for a live site that underperforms, each one tied to evidence and a reason. It covers conversion, ease of use, message and speed, so you work on what matters first.
explain: |
  A ranked list of fixes for a live site that underperforms, each one tied to evidence and a reason. It covers conversion, ease of use, message and speed, so you work on what matters first.

  The skill runs as a guided process in eight phases, saving progress to files in a docs folder so you can stop and resume. It starts by working out why visitors do not convert. It then looks at usability, how clear the visual hierarchy is, how readable the text is, whether a stranger gets the offer in five seconds, and how fast the pages load. Each fix is written as a test you can run, and it asks for your decision at every key point.
when:
  - Your site gets traffic but few sign-ups or sales.
  - You are not sure which fix to start with.
  - You want fixes backed by evidence, not opinion.
  - You need a plan to hand to a developer or designer.
not_for:
  - "You have no site yet: build the first version with your AI and a plain brief, then come back to fix it."
  - "Your site converts but needs more visitors: use a traffic plan, not a fix list."
  - "The friction is inside a product app, not your marketing site: use a product usability review with a designer."
you_give:
  - Your live site address
  - Your goal and main conversion
  - Any analytics or user research (optional)
  - Constraints on time or budget (optional)
you_get:
  - A ranked fix list with reasons
  - Test ideas for the big changes
  - Notes saved in a docs folder
  - A phase-by-phase action plan
how_to_use:
  - Check you have the eight companion skills from wondelai/skills (cro-methodology, ux-heuristics, refactoring-ui, web-typography, storybrand-messaging, high-perf-browser, made-to-stick, design-everyday-things). Install each with npx skills add wondelai/skills/<name> --global, or let the skill run that phase from its short brief instead.
  - This is a long run of eight phases over several sessions. For a short path, run Phase 1 (the diagnosis) and then one fix phase.
  - Open your AI in a tool that can save files, such as Claude with file access. Add this skill.
  - Tell your AI your live site address and the one action you want visitors to take.
  - Answer the questions at each phase. Phase 1 is a gate, so check the diagnosis before you go on.
  - Read the ranked list in IMPROVE-WEBSITE-PLAN.md. Hand the top fixes to your developer or designer.
  - To stop and return later, ask your AI to read the docs folder and resume.
  - Next, hand the ranked list to your developer or designer. After they ship fixes, run Phase 1 again to check if conversions moved.
output_sample:
  input:
    - Your live site address
    - Your goal and the one action you want visitors to take
    - Your analytics or user research (optional)
    - Your limits on time or budget (optional)
  prerequisites:
    - An AI that can save and read files in a docs folder, so progress carries over between sessions
    - The eight companion skills from wondelai/skills installed, or their steps pasted into the chat
  output:
    - name: docs/METRICS.md
      contains: Your goal, your main conversion action and the numbers that show whether visitors take it.
    - name: docs/WEBSITE.md
      contains: What the site says and does today, and why visitors are not converting.
    - name: docs/DESIGN.md
      contains: Usability problems, visual hierarchy fixes and text readability notes from phases two to four.
    - name: docs/EXPERIMENTS.md
      contains: Each big fix written as a test you can run, with the reason behind it.
    - name: IMPROVE-WEBSITE-PLAN.md
      contains: The ranked fix backlog, with evidence for each fix and your decisions at each phase.
