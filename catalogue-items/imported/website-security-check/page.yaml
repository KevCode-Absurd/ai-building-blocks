thinking: medium
thinking_why: The checks are standard but fixes depend on your stack.
new_slug: website-security-check
name: Website security baseline checker
summary: Run a website security check before launch. Give it your site details and get a ranked list of fixes for HTTPS, headers, secrets and content policy.
job: secure-code
headline: Website security baseline checker
subhead: A pre-launch security checklist for your site, with the weak spots ranked so you fix the dangerous ones first. It matters because most breaches come from basics that were never set up, not from clever attacks.
explain: |
  A pre-launch security checklist for your site, with the weak spots ranked so you fix the dangerous ones first. It matters because most breaches come from basics that were never set up, not from clever attacks.

  You describe the site, where it is hosted and what third-party scripts it loads. The skill then walks six layers: how data travels (HTTPS, TLS version, HSTS), response headers, secrets handling, content security policy, access control and monitoring. For each layer it says what is in place, what is missing and what to change. Run it before launch and again every quarter to catch drift.
when:
  - You are about to launch a new site and want a security check first.
  - A vendor or auditor asked how your site is protected.
  - You added a new third-party script and want to know what it exposes.
  - It has been months since anyone looked at your site's security settings.
not_for:
  - "You are dealing with a hack or breach right now: call your host or a security professional first, then use this check after."
  - "You want your code reviewed for bugs: ask a developer for a code review, because this check looks at settings, not code."
  - "You need full compliance for card payments, health data or government work: hire a specialist, because this is only a starting point."
you_give:
  - Your site address and environments
  - Your hosting platform and CDN
  - How people log in (if they do)
  - List of third-party scripts
  - Compliance rules you must meet (optional)
you_get:
  - Checklist across six security layers
  - Ranked list of fixes
  - Header and policy settings to apply
  - Secrets handling plan
  - Schedule for re-checking
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Add your site address, your host, how people log in and the scripts your site loads.
  - If you can, run a free scan at securityheaders.com first and paste in the grade and findings.
  - Ask your AI to check all six layers and rank the fixes.
  - Read the high-risk fixes first. Test each change on a test copy of your site before you go live.
  - Book a re-check for three months from now. This works in a plain chat. Your AI cannot see your live site unless you paste in what it needs.
output_sample:
  input:
    - Your site address and environments (live, test)
    - Your hosting platform and CDN
    - How people log in, if they do
    - Your list of third-party scripts and tools
    - Rules you must meet, such as PCI, SOC 2 or GDPR (optional)
  prerequisites:
    - A free scanner result from securityheaders.com or the MDN HTTP Observatory helps. If you cannot run one, the result will say which findings are affected.
  output:
    - name: Inventory
      contains: The domains, public forms, login pages, admin pages and third-party tools that are in scope.
    - name: Layer-by-layer status
      contains: For each of the six layers, what is in place, what is missing and the risk level.
    - name: Required headers
      contains: The security header settings to apply, with a value for each one.
    - name: Required configurations
      contains: The settings for HTTPS, secrets and login that every site should have.
    - name: Findings
      contains: A ranked list of gaps, with high-risk and easy fixes first.
    - name: Remediation plan
      contains: Who fixes each gap and by when.
    - name: Re-audit cadence
      contains: When to check the site again, with a quarterly review as the minimum.
