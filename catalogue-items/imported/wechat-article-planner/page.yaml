thinking: medium
thinking_why: It adapts content to one platform.
new_slug: wechat-article-planner
name: WeChat article planner
summary: Plan your next WeChat Official Account article with title options, a section-by-section layout and a call to action built for WeChat readers.
job: grow-social
headline: WeChat article planner
subhead: A full plan for one WeChat Official Account article, built around how the platform works. Distribution is closed, sharing happens in Moments and readers tap titles that promise something.
explain: |
  A full plan for one WeChat Official Account article, built around how the platform works. Distribution is closed, sharing happens in Moments and readers tap titles that promise something. You leave with a title shortlist, a layout and a call to action that fits your goal.

  First it checks your account type, because a subscription account and a service account get different reach and push limits. Then it writes title options with formulas that suit WeChat readers, lays out the article section by section, and suggests how to move readers to your mini-program or private group. It can also fit the piece into a longer content calendar.
when:
  - You run a WeChat Official Account and need a plan for this week's article.
  - Your open rates are low and you suspect the titles.
  - You want readers to move from articles into a mini-program or private group.
  - You are entering the Chinese market and do not know the platform's rules.
not_for:
  - "You want short visual posts for Xiaohongshu: use xiaohongshu-post-planner."
  - "You have no WeChat Official Account yet: set one up with WeChat first, then come back for a plan."
  - "You need the finished article, design or layout: this gives a plan and copy, so use a writer or your own design tool."
you_give:
  - Your topic
  - Account type (subscription or service)
  - Target readers
  - Goal such as sales or followers
  - Existing brand voice notes (optional)
you_get:
  - Several title options
  - Article outline and layout
  - Sharing and Moments hooks
  - Call to action to private traffic
  - Posting schedule suggestion
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - Gather these first: your topic in one line, your account type, your target readers, your goal, and any real data or customer quotes you want in the article. Add brand voice notes if you have them.
  - Tell your AI all of that. If you have no data or quotes yet, say so, and the plan will mark where you need to add them.
  - "Ask for the plan: title options, article layout, sharing hooks and a call to action."
  - Check the plan. Add your own facts, data and customer quotes, because the AI will not know them.
  - If you post about beauty, health or money, avoid claims you cannot source, and have the copy checked against Chinese advertising law before you publish.
  - Next, give the chosen title and outline to your writer, test two titles in the WeChat backend, and track open and read-to-end rates for your next post.
output_sample:
  input:
    - Your topic
    - Your account type (subscription or service)
    - Your target readers
    - Your goal, such as sales or followers
    - Your brand voice notes (optional)
  output:
    - name: Account type check
      contains: What your account type means for how often you can post and where your article shows up.
    - name: Title options
      contains: Several title choices written with WeChat formulas such as curiosity gap, counter-intuitive and value promise.
    - name: Article architecture
      contains: An outline with first fold, ramp, core content, emotional peak and call to action.
    - name: Sharing hooks
      contains: Pull quotes for Moments and a suggested text readers can use when they forward the article.
    - name: Call to action
      contains: One low-effort next step, such as following, sharing or tapping through to your mini-program.
    - name: Posting time tips
      contains: Suggested peak reading times in China time.
next: [content-calendar-builder, xiaohongshu-post-planner]
