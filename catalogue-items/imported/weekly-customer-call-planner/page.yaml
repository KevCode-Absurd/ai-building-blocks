thinking: medium
thinking_why: It repeats the same research for each call, then gathers it.
new_slug: weekly-customer-call-planner
name: Weekly customer call planner
summary: Get one weekly customer call planner brief for every outside call in the next 7 days, with company and attendee notes. Needs a paid Common Room account.
job: organise-work
headline: Weekly customer call planner
subhead: One brief that prepares you for every outside call in the next seven days. Instead of researching each company the night before, you open a single document and know who you are meeting and what has changed.
explain: |
  One brief that prepares you for every outside call in the next seven days. Instead of researching each company the night before, you open a single document and know who you are meeting and what has changed.

  The skill lists your external meetings from your calendar, or from names you type in, and asks you to confirm the list. It then researches each account and each attendee using your Common Room data, plus a quick check for company news from the past week and recent posts by senior attendees. Each meeting gets a short profile with talking points. Common Room is a paid tool: you need an account and a plan, which you sign up for yourself. Without one, use a simple web search for each company, or type the facts in yourself.
when:
  - Your Monday starts with five customer calls and no prep time.
  - You want one document to read instead of ten tabs.
  - A senior contact at a prospect just changed jobs and you want to know before you call.
  - You manage a team and want your reps to walk in prepared.
not_for:
  - "You need prep for one call only: use a single-account prep skill, or ask your AI to research that one company."
  - "You have no Common Room account: the brief rests on its data, so use a simple web search for each company."
  - "The company has no calendar entry and no Common Room record: research them by hand first, then ask your AI for talking points."
you_give:
  - Calendar access or a list of calls
  - Your Common Room account
  - Date range (optional)
  - Names to exclude (optional)
you_get:
  - Confirmed list of external meetings
  - Account snapshot for each company
  - Profile of each attendee
  - Recent news for each company
  - Suggested talking points
how_to_use:
  - Open your AI and paste in this skill. Use a setup that can connect to Common Room (a paid account) and your calendar. The brief is only as good as your calendar and Common Room data. If your calendar tool is not available, type your calls in instead.
  - Ask for your weekly prep brief. Add a date range if you want something other than the next 7 days.
  - If your calendar is not connected, type each outside call with the company, time and attendee names.
  - Check the list of calls your AI shows you. Remove cancelled calls and add any it missed.
  - "Privacy: the AI looks for recent public business posts and news about attendees in their professional role only. It skips personal accounts."
  - Read the brief. Meetings with thin data get a short note, so check those accounts yourself before the call.
  - Share the brief with your reps or keep it as your Monday reading.
  - After each call, update your Common Room notes, or turn the call into a written summary with meeting-notes-maker.
output_sample:
  input:
    - Your calendar, or a list of your outside calls with company, time and attendee names
    - Your Common Room account
    - A date range (optional)
    - Meetings to leave out (optional)
  prerequisites:
    - An AI that can connect to your Common Room account
    - A connected calendar (optional, you can type your calls instead)
  output:
    - name: Week Overview
      contains: A few bullets on key themes, urgent signals, the number of calls and any meeting that needs extra prep.
    - name: Company Snapshot
      contains: Account status, top signals and recent activity for each company you are meeting.
    - name: Attendee Profiles
      contains: Each outside attendee with their title, signals and a suggested conversation angle.
    - name: Top Signals This Week
      contains: The two or three signals that matter most for that specific call.
    - name: This Week's News
      contains: Funding, leadership changes or major press from the past week, only when it is worth noting.
    - name: Recommended Objectives
      contains: One or two sentences on what to get done in that meeting.
    - name: Limited Data note
      contains: "A short section for thin accounts: what Common Room returned, web findings and a nudge to check with colleagues."
next: [customer-call-prep-writer, meeting-notes-maker]
