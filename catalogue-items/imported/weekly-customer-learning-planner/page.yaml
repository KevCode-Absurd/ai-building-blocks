thinking: high
thinking_why: Mapping goals to opportunities and tests takes careful reasoning.
new_slug: weekly-customer-learning-planner
name: Weekly customer learning planner
summary: Plan your weekly customer learning. Give it your goal and get an opportunity tree, risky assumptions to test and a weekly routine.
job: understand-customers
headline: Weekly customer learning planner
subhead: A weekly habit for learning from customers, plus the map that tells you what to learn next. You end with an opportunity tree linking your goal to customer needs, ideas and small tests.
explain: |
  A weekly habit for learning from customers, plus the map that tells you what to learn next. You end with an opportunity tree linking your goal to customer needs, ideas and small tests.

  The method follows continuous discovery. You name one outcome you want to move. The skill helps you list customer needs as the customer would say them, then sort them into a tree with the outcome at the top and solutions and experiments below. It picks the riskiest assumptions to test first and sets a rhythm of customer conversations each week. A short diagnostic scores your current practice so you can see what to improve.
when:
  - Your team builds from opinions and rarely talks to customers.
  - You have a goal like raising trial conversion and no clear way in.
  - You keep shipping features that nobody uses.
  - You want a standing weekly slot for customer interviews.
not_for:
  - "You have no customers yet: talk to a few likely buyers first, one at a time, and come back when you have real answers."
  - "You only have a pricing or sales question: review your recent sales calls or send a short survey instead."
  - "You need help with how to run one interview: read a book on customer interviews or ask a colleague to sit in on your next call."
you_give:
  - The outcome you want to move
  - What you know about your customers
  - Ideas already on your list (optional)
  - How often you talk to customers now
you_get:
  - Opportunity solution tree
  - Riskiest assumptions to test
  - Small experiments to run
  - Weekly customer contact routine
  - Score of your current practice
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. Also paste the reference files you want (the assumption and tree notes help most), or say the plan will use the core method only. No code, files or paid tools are needed.
  - Write a short brief first. It has the one outcome you want to move (like raising trial sign-ups that become paying customers), who you talk to now, your top three customer needs, and how many interviews you can do each week.
  - Add any ideas you already have to the brief.
  - Read the tree and check that each need is worded the way a customer would say it.
  - Pick the top assumption and run its test this week. Book the weekly customer slot in your calendar.
output_sample:
  input:
    - The outcome you want to move
    - What you know about your customers
    - Ideas already on your list (optional)
    - How often you talk to customers now
  output:
    - name: Opportunity Solution Tree
      contains: A nested list with your outcome at the top, customer needs below it, then ideas and small tests.
    - name: Assumption table
      contains: A table of the riskiest assumptions, each with a risk level and a test to run.
    - name: Weekly routine
      contains: A set rhythm for customer contact each week, with who takes part and what each person does.
    - name: Discovery score
      contains: A score out of 10 for your current practice, the rows that failed and a fix for each.
