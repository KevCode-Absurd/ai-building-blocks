thinking: high
thinking_why: Spend and sales move together, so it must avoid overclaiming.
new_slug: weekly-spend-impact-modeler
name: Weekly spend impact modeler
summary: Model what each marketing channel adds to weekly sales from your spend data, with the limits stated. Not a budget tool, and no causal claims.
job: track-numbers
headline: Weekly spend impact modeler
subhead: A plain model of what each marketing channel adds to your weekly sales, with its limits stated up front. It stops you from reading a correlation as proof that a channel works.
explain: |
  A plain model of what each marketing channel adds to your weekly sales, with its limits stated up front. It stops you from reading a correlation as proof that a channel works.

  Three terms you may see. OLS contribution is what a plain weekly regression says a channel adds to sales. A Hill curve is a shape that shows returns shrinking as spend grows. MTA is multi-touch attribution, a way of sharing credit across the ads a buyer saw. If you do not code, you can ignore the response-curve step and read only the status lines and the share comparison.

  You supply weekly spend and outcomes by channel. The skill sets the scope, week range, time zone and currency first, then keeps unknown values as unknown instead of turning them into zero. It runs a weekly regression and compares the modeled share of each channel with the share your CRM reports. Every result comes back with its assumptions and a status. It does not allocate budget. It tells you what the data can and cannot say. It needs Python.
when:
  - You spend across several channels and want to know what each one adds.
  - Your CRM credits one channel and you doubt it.
  - You are planning a lift test and want a baseline first.
  - Someone says a channel is incremental and you need to check the claim.
not_for:
  - "You need proof a channel causes sales: run a randomized lift test instead, because this model only shows links in past data."
  - "You want a budget split or an optimizer: ask a person to review the results, since this skill never allocates budget."
  - "You have only a few weeks of data, or channels that always move together: collect more weeks or vary spend on purpose first."
you_give:
  - Weekly spend by channel
  - Weekly sales or conversions
  - Time zone and currency
  - Notes on attribution windows
  - Spend scenarios to test (optional)
you_get:
  - Modeled contribution per channel
  - Modeled share versus CRM share
  - Scenario results
  - Assumptions and status flags
  - Plain statement of what is not proven
how_to_use:
  - "Gather these first: weekly spend and weekly sales (or conversions) for each channel, one row per week per channel, with the week start date, channel, spend and outcome. Also your time zone, currency and week range. For the share comparison, your CRM totals per channel over the same weeks, with the columns source_system, source_scope, row_key, channel_key, spend and outcome_quantity (details in references/framing-contract.md)."
  - Open a chat with an AI that can run Python and read files. Claude or ChatGPT with code running turned on both work.
  - Upload the whole skill folder, with its references and scripts folders, and requirements.txt. Pasting SKILL.md alone is not enough, because it calls the scripts and contract files in the folder.
  - Add your weekly spend and sales by channel as a spreadsheet or CSV, with your time zone, currency and week range.
  - Add your CRM totals and any spend scenarios you want to test (optional). The share comparison is a separate step from the regression. Its rows hold the modeled contribution (model side), or spend and outcome_quantity (CRM side), already added up over your declared weeks.
  - Ask your AI to follow the skill. Check the status lines before you read any channel result.
  - "If the status is no usable result, or insufficient_input, rank_deficient, ill_conditioned or numerical_failure: fix the data first (more weeks, channels that do not always move together, no blank cells). If it still fails with clean data, stop and ask a person who knows statistics. Do not read any channel number from a failed run."
  - Take the modeled share versus CRM share into a lift-test plan or a human budget review. Do not treat it as a budget decision.
output_sample:
  input:
    - Weekly spend by channel
    - Weekly sales or conversions
    - Your time zone, currency and week range
    - Your CRM's spend and sales by channel (optional)
    - Spend scenarios to test (optional)
  prerequisites:
    - An AI that can run Python code and read files
    - Python with NumPy installed
  output:
    - name: Regression result
      contains: A status and the modeled contribution for each channel, or the reason no usable result exists.
    - name: Response curves
      contains: A curve for each channel built from stated assumptions, or a note that the channel is unsupported.
    - name: Scenario result
      contains: Assumed media response for your baseline and proposed spend, with the change shown by channel.
    - name: Assumption bands
      contains: Low and high ends of a scenario change, based on multipliers you supply, not confidence intervals.
    - name: Share comparison
      contains: Modeled share versus CRM share by channel, with the factor between them.
    - name: Adjusted CPA
      contains: CRM cost per conversion divided by the share factor, only when the outcome is a conversion count.
    - name: Assumptions and limits
      contains: Scope, dates, units, status flags and a plain note on what is not proven.
output_shape: |
  What the words mean: STATUS ok = the model ran on enough data. limited = it ran with named gaps. no usable result = read no channel number. Modeled share = the share of sales the model credits to a channel. CRM share = the share your CRM credits to it. The ratio is modeled divided by CRM.
  STATUS <ok / limited / no usable result> | Scope: <weeks, time zone, currency>
  CHANNEL <name> | modeled contribution: <number or unknown> | modeled share vs CRM share: <ratio>
  SCENARIOS <spend change by channel> | assumed response: <low to high>
  ASSUMPTIONS <list>
  NOT PROVEN: <what these numbers cannot show>
