thinking: medium
thinking_why: It must link claims to real evidence.
new_slug: wellbeing-learning-link
name: Wellbeing and learning link mapper
summary: Map the evidence linking a school wellbeing programme to learning results. Get a case for governors, funders or inspectors. Not medical advice.
job: teach-and-train
headline: Wellbeing and learning link mapper
subhead: The case, in evidence, for how a wellbeing programme helps academic results. It gives you wording for governors, leaders, parents or inspectors who ask why you spend time and money on it.
explain: |
  The case, in evidence, for how a wellbeing programme helps academic results. It gives you wording for governors, leaders, parents or inspectors who ask why you spend time and money on it.

  You describe the programme and your school. The skill draws on research such as broaden-and-build theory, social and emotional learning studies and Visible Learning to trace a pathway from the programme to specific learning outcomes. It explains the mechanism, meaning how the programme is expected to change behaviour and attention, and predicts results at student, class and school level with realistic timeframes. Not medical advice.
when:
  - You need to justify a wellbeing programme in a funding bid.
  - Governors ask how it improves attainment.
  - You are choosing between two wellbeing initiatives.
  - You must write the rationale section of a school improvement plan.
not_for:
  - "You need proof that your programme caused results: use an evaluation plan, or ask a researcher to design one."
  - "You want to replace your own school's outcome data: gather attendance, behaviour and attainment figures and use those."
  - "You need medical or clinical advice for a pupil: speak to a qualified professional, such as your school's safeguarding or health lead."
you_give:
  - The wellbeing programme
  - Your school context and phase
  - Outcomes you hope for
  - Attendance or survey data (optional)
  - Who will read the case
you_get:
  - Evidence map from programme to results
  - Explanation of how it works
  - Expected outcomes with timeframes
  - Short statement for school leaders
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Copy the full text of the Prompt block in SKILL.md (the text inside the code fence under the Prompt heading) and paste it in, or add the skill to your AI. The page does not hold the prompt itself.
  - Add your programme description, school phase and context, the outcomes you hope for, and who will read the case.
  - Gather your baseline figures first if you have them: attendance, exclusions and survey results. Add them. If you have none, say so, and the case will tell you to collect a baseline before you start.
  - Read the result. Check every study and figure against the original source before you put it in a bid or report.
  - Add your own school's data to the rationale before you share it.
  - Next, take the leadership rationale to your governors. To plan the work itself, use classroom-belonging-planner.
output_sample:
  input:
    - Your wellbeing programme, described in a few lines
    - Your school context, such as phase, pupils and main challenges
    - The outcomes you hope for (optional)
    - Attendance, behaviour or survey data (optional)
    - Who will read the case, such as governors, parents or inspectors (optional)
  output:
    - name: Causal Pathway
      contains: A step-by-step chain from the programme to the learning outcomes it should affect.
    - name: Mechanism Analysis
      contains: How the programme is expected to change pupil behaviour, attention and motivation, linked to research.
    - name: Expected Outcomes
      contains: Likely results at pupil, class and school level, with realistic timeframes.
    - name: Conditions for Impact
      contains: What must be in place for the programme to work, such as training and time.
    - name: Leadership Rationale
      contains: A short statement you can use with leaders, governors, parents or inspectors.
    - name: Honest Caveats
      contains: The limits of the evidence and what the case cannot show.
next: [classroom-belonging-planner]
