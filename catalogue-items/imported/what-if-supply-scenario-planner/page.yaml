thinking: medium
thinking_why: It builds linked cases and checks what each one costs.
new_slug: what-if-supply-scenario-planner
name: What-if supply scenario planner
summary: Plan a supply chain what-if scenario for a late shipment or demand spike. Get three cases, the cost of each, and a response plan.
job: plan-supply-chain
headline: What-if supply scenario planner
subhead: Three worked scenarios for the supply chain worry on your mind, each with a cost and a planned response. You stop arguing about what might happen and start deciding what you would do.
explain: |
  Three worked scenarios for the supply chain worry on your mind, each with a cost and a planned response. You stop arguing about what might happen and start deciding what you would do.

  The skill first asks what decision hangs on the worry, how far ahead you plan and where you are exposed, such as one supplier or limited capacity. It then builds a base case plus best and worst variants, tests how demand, lead times and prices change, and estimates the cost of each path. For every scenario it sets early warning signs and a response, so you know the trigger before trouble starts.
when:
  - Your main supplier is late and you need a plan B.
  - A demand spike is coming and you are unsure you can cover it.
  - You must justify extra stock or a second supplier to finance.
  - Port delays or tariffs threaten next quarter's plan.
not_for:
  - "You only need a demand forecast: use a demand forecasting skill or your sales history, not this planner."
  - "You need a one-off price quote from a supplier: ask the supplier directly."
  - "You want a full yearly sales and operations plan: use your planning team's own process, then bring one worry here."
you_give:
  - The risk or worry
  - The decision it affects
  - Planning horizon
  - Cost and lead time data (optional)
  - Known weak points such as single suppliers
you_get:
  - Three scenarios with assumptions
  - Cost impact for each
  - Response plan per scenario
  - Early warning signals
  - Short list of what to do now
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Describe your worry in one or two lines, such as a late shipment or a demand spike.
  - Add the decision it affects, how far ahead you plan, and any weak points like a single supplier.
  - Paste your cost and lead time figures if you have them. If not, your AI will ask or mark them as missing.
  - Check the numbers in the result. Any example figures are placeholders, so swap in your own.
  - Share the report with your team or finance, and set a date to review the early warning signs.
output_sample:
  input:
    - The risk or worry you want to test
    - The decision it affects
    - How far ahead you plan
    - Your cost and lead time data (optional)
    - Known weak points, such as one supplier (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini. No code is needed for a written report.
  output:
    - name: Executive summary
      contains: The purpose, the scenarios tested, the main findings and what they mean for your decision.
    - name: Scenario definitions
      contains: A table of each scenario with a name, a description, key assumptions and a probability.
    - name: Scenario results
      contains: A table comparing total cost, service level, inventory and key notes for each scenario.
    - name: Risk assessment
      contains: The top risks, ways to reduce them, backup plans and early warning signs.
    - name: Recommendations
      contains: "Actions grouped by time: now to 3 months, 3 to 12 months, and 1 to 3 years."
    - name: Monitoring and review
      contains: What to track, how often to review, and the trigger points that start each plan.
