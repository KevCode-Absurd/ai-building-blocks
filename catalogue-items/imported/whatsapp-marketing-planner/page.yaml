thinking: medium
thinking_why: It plans message flows from a set method and your customer habits.
new_slug: whatsapp-marketing-planner
name: WhatsApp marketing planner
summary: "Get a WhatsApp marketing plan for your business: setup, opt-in, broadcasts, automatic replies and support flows, matched to your brand voice."
job: help-customers
headline: WhatsApp marketing planner
subhead: A working WhatsApp channel plan that covers sales messages, automatic replies and support, matched to your brand voice. It is built for the most personal channel a customer has, where one spammy message gets you blocked.
explain: |
  A working WhatsApp channel plan that covers sales messages, automatic replies and support, matched to your brand voice. It is built for the most personal channel a customer has, where one spammy message gets you blocked.

  The skill first helps you choose between the free Business app for small lists and the Business API through a provider such as Wati or Twilio for scale. Then it designs the pieces: profile and catalog, opt-in collection, broadcast types, quick replies and automated flows for orders and support. It adds message templates and rules on how often to send. It checks your brand context file first so the tone fits.
when:
  - Your customers already use WhatsApp and you want to sell there.
  - You need automatic answers for common support questions.
  - You must pick between the free app and the paid API.
  - Your broadcasts get blocked or ignored.
not_for:
  - "You want to message people who have not opted in: collect opt-ins first, or use email or SMS, because WhatsApp can ban your number."
  - "Your contacts do not use WhatsApp: use email or SMS, or a plain mailing list tool."
  - "You only want one broadcast message written: ask your AI to draft it directly, with no full plan."
you_give:
  - Your business and products
  - Number of customers
  - Whether your contacts have already opted in to WhatsApp messages. The welcome, abandoned cart and win-back flows depend on it.
  - Brand voice notes (optional)
  - Country or markets
  - Budget for tools (optional)
you_get:
  - "Setup recommendation: app or API"
  - Opt-in and list plan
  - Broadcast ideas with sample messages
  - Automatic reply and support flows
  - Sending rules
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text from this page.
  - Have ready your customer count, your main goal, and the app or API you use now. Send these to your AI first, along with your business, products and country.
  - Add your brand voice notes and budget if you have them (optional).
  - If you plan to use the Business API, know the cost first. You need a paid account with a WhatsApp Business Solution Provider (BSP) such as Wati or Twilio, and WhatsApp must approve each message template before you can send any broadcast. The free Business app does not need this. Plan for the approval time.
  - Work through sections 01 to 07 in order. Start with setup and opt-in, and send no broadcast until opt-in is in place.
  - Read the setup pick first. Check it fits your list size.
  - The plan gives no benchmark figures or prices. Fill the baseline column from your own campaigns, and get prices from the tool maker before you buy. Confirm each template category (marketing or utility) with your WhatsApp provider before you send, and check opt-in wording against WhatsApp's policy and your local law.
  - After the plan, check each template category and the opt-in wording with your provider before the first broadcast.
  - Copy the welcome flow and opt-in wording into your WhatsApp tool. Planning needs no code or files. The API route also needs the paid BSP account and template approval described above.
output_sample:
  input:
    - Your business and products
    - How many customers you have
    - Your market or country
    - "Your main goal: sales, support or keeping customers"
    - Your brand voice notes and budget (optional)
  output:
    - name: 01 Setup and compliance
      contains: Your profile setup, the app or API choice, opt-in methods, opt-in wording and how to handle opt-outs.
    - name: 02 Message templates
      contains: The template types WhatsApp requires for the API, and tips for writing short ones with one call to action.
    - name: 03 Campaign types and flows
      contains: Broadcast ideas plus welcome, post-purchase, abandoned cart and win-back message flows.
    - name: 04 Conversational commerce
      contains: Your catalog setup, a chat sales flow, and when a bot hands over to a person.
    - name: 05 Content strategy
      contains: What to send, what to avoid, how often, and how to use images, video and voice notes.
    - name: 06 WhatsApp metrics
      contains: The numbers to track each week, with a blank column for your own baseline, and what a spike in unsubscribes means.
    - name: 07 Platform recommendations by scale
      contains: Which tool suits your list size, with prices left for you to check with each provider.
