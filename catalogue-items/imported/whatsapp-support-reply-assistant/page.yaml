thinking: medium
thinking_why: It follows a set method with a few checks.
new_slug: whatsapp-support-reply-assistant
name: WhatsApp support reply assistant
summary: Review waiting WhatsApp support chats in Wati or Whautomate. Get reply drafts, missing details and issues to pass on, then approve each send.
job: help-customers
headline: WhatsApp support reply assistant
subhead: Connect Wati or Whautomate and ask your AI to review your waiting WhatsApp chats. It reads recent messages and sorts each chat by what to do next. You get reply drafts and a list of issues for another team. Nothing is sent until you approve it.
when:
  - Your WhatsApp inbox has piled up and you need to see what to answer first.
  - You want reply drafts for clear customer questions, ready to check and send.
  - You need to spot chats that must go to another team.
  - You want to find old chats that can be closed.
not_for:
  - "Your chats live outside Wati or Whautomate: use your own helpdesk, or answer them by hand."
  - "No Wati or Whautomate account is connected yet: connect one first, or this cannot read your chats."
  - "You want your AI to send replies on its own: this tool asks you to approve each reply first."
you_give:
  - Your Wati or Whautomate account, connected through Composio.
  - Facts for your replies, such as order or policy details (optional).
  - A paid Wati or Whautomate WhatsApp account. Composio needs its own account and a CLI login too.
you_get:
  - A list of waiting chats sorted into reply now, needs info, escalate and close.
  - A reply draft for each chat with a clear question.
  - A list of issues that need another team.
  - A list of chats that look resolved.
  - Replies sent only after you approve them.
how_it_works:
  - title: Read waiting chats
    text: Fetch unresolved WhatsApp conversations and read recent history for the top ten.
  - title: Choose each next step
    text: Mark clear questions, missing details, issues needing another team, and chats that appear resolved.
  - title: Review proposed replies
    text: Show the waiting queue and reply drafts. Send only the replies you approve.
works_best_with:
  tools:
    - name: Wati or Whautomate
      why: Live lookups need Composio CLI access and connected accounts for these services.
how_to_use:
  - Add the downloaded folder to an AI that can run commands and read skill files.
  - Install the Composio CLI and link your Wati or Whautomate account when your AI asks.
  - Ask your AI to run the WhatsApp support reply assistant on your waiting chats.
  - Your AI reads customer phone numbers and chat history. Limit it to the chats you need for this review, and do not paste them into other tools.
  - Read the queue. Check each draft against what you know. Drafts should use only facts from the chat.
  - Tell your AI which replies to send. It sends only those you approve. Pass the escalation list to your helpdesk or the team that owns each issue.
output_sample:
  input:
    - Your Wati or Whautomate account, connected through Composio
    - Your unresolved WhatsApp conversations, read for you
    - Recent message history for up to ten chats, read for you
  prerequisites:
    - An AI that can run commands and read skill files
    - The Composio CLI installed
    - Your Wati or Whautomate account linked in Composio
  output:
    - name: Needs Reply
      contains: "A table of chats with a clear question: contact, last message, wait time and a suggested reply."
    - name: Needs Escalation
      contains: A table of complex issues with the contact, the issue and the action it recommends.
    - name: Needs Info
      contains: Chats too vague to answer, so you know what to ask the customer.
    - name: Can Close
      contains: Chats that look resolved or need no reply.
    - name: Stats
      contains: Open chats, average response time and oldest unresolved chat, when your account returns that data.
