new_slug: who-to-call-first-ranker
name: Who to call first ranker
summary: Give it your new leads. Get them ranked by fit and urgency, with
  talking points and follow-up drafts.
job: sell-and-negotiate
headline: Who to call first ranker
subhead: A ranked call list for today, taken from the new leads sitting in your
  HubSpot. You know who to ring first, what to say and what to send to the rest.
explain: |
  A ranked call list for today, taken from the new leads sitting in your HubSpot. You know who to ring first, what to say and what to send to the rest.

  The skill pulls leads at the Lead or MQL stage that are not marked unqualified. It scores each on engagement, company fit, urgency signals and how recent their activity is. Then it returns a ranked list sized to your volume, with talking points per person. It drafts follow-up emails and suggests calendar slots, but it never sends or books anything without your say. If your portal is empty, it says so plainly.
when:
  - You open HubSpot to fifty new leads and no idea where to start.
  - You have two hours for calls and want the best ones first.
  - You want ready follow-up drafts for the leads you cannot reach today.
  - You are asked for a quick read on your pipeline.
you_give:
  - HubSpot access
  - Scope such as leads only or pipeline
  - What fit means for you (optional)
  - Calendar access (optional)
you_get:
  - Ranked lead list with scores
  - Talking points for each lead
  - Follow-up email drafts
  - Proposed call times
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can read your accounts and files.
  - Where the skill points to ../../shared/, use the shared folder inside it. We
    copied it in so the skill works on its own.
