thinking: medium
thinking_why: It sequences practice steps for a hard skill.
new_slug: who-wrote-it-lesson
name: Check who wrote it lesson builder
summary: Build a who wrote it lesson series for history sources. Give it your topic and students. You get steps, questions and common errors.
job: teach-and-train
headline: Check who wrote it lesson builder
subhead: A lesson series that trains students to ask who wrote a source, when and why before they read a word. It builds the habit expert historians use, instead of treating each document as plain fact.
explain: |
  A lesson series that trains students to ask who wrote a source, when and why before they read a word. It builds the habit expert historians use, instead of treating each document as plain fact.

  The method follows Wineburg's research on sourcing. You describe your topic, your students and what they do now when handed a document. The skill returns a progression from novice to proficient, a three-part teaching sequence (you model, they practise with help, they work alone) and guiding questions suited to your source type, such as testimony, official papers or photographs. It also lists the common ways students fail and how to respond.
when:
  - Students accept every document at face value.
  - You are starting a unit built on primary sources.
  - You want a clear way to show growth in source skills.
  - Your students read first and ask questions later.
not_for:
  - Your students already check who wrote a source every time. Move on to a harder skill, such as comparing sources, with your own plan.
  - You have no documents yet. Pick your sources first, then come back to build the lessons.
  - You want a single lesson on close reading of text. Write that lesson yourself or ask your AI for a simple close reading plan.
you_give:
  - Topic or period
  - Students' age and experience
  - What students do now with sources
  - Type of source and documents (optional)
  - Curriculum framework (optional)
you_get:
  - Sourcing progression by level
  - Model, guided and independent sequence
  - Source-specific questions
  - Common errors and fixes
  - Signs of progress to watch for
how_to_use:
  - Open Claude, ChatGPT or Gemini. No code or paid tool is needed.
  - Paste the whole skill text into the chat. It is long (about 16,000 characters), so check that none of it was cut off.
  - Have three things ready, because the plan needs them: your topic or period, your students' age and level, and what they do now with sources.
  - Add your source type and documents if you have them (optional).
  - Read the plan. Check that the questions fit your sources, then edit anything that does not suit your class.
  - Use the plan to teach. Pair it with a lesson on comparing sources if you want to go further.
output_sample:
  input:
    - Your topic, period or question
    - Your students' age and how much source work they have done
    - What your students do now when given a source
    - Type of source, such as letters or photographs (optional)
    - Your curriculum framework (optional)
  output:
    - name: Sourcing Progression
      contains: The steps students move through, from first attempts to checking a source's author, date and purpose on their own.
    - name: Explicit Instruction Sequence
      contains: "A teaching plan in three stages: you model, students practise with help, then students work alone."
    - name: Guiding Questions
      contains: Questions on author, date and purpose, matched to your source type.
    - name: Common Failure Patterns
      contains: The usual mistakes students make with sources and how you can respond to each.
    - name: Assessment Indicators
      contains: Signs you can watch for that show students are sourcing well.
