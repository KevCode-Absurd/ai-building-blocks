thinking: low
thinking_why: It turns facts into a set of probing questions.
new_slug: why-and-how-question-writer
name: Why and how question writer
summary: Turn your lesson content into why and how questions that help learners explain, not just recall. A simple elaborative interrogation question writer.
job: teach-and-train
headline: Why and how question writer
subhead: A set of why and how questions that make learners explain what they study instead of repeating it. Asking "why is this true?" forces connections to what they already know, and that is what helps memory.
explain: |
  A set of why and how questions that make learners explain what they study instead of repeating it. Asking "why is this true?" forces connections to what they already know, and that is what helps memory.

  This is elaborative interrogation, a strategy backed by decades of study. You give the topic, the learners' level and the text they use. The skill writes a set of prompts, usually five to eight, ordered by depth, each with the idea it targets and what a good answer looks like. It adds prompts that tie new facts to prior knowledge and a short note on timing, grouping and whether answers should be spoken or written.
when:
  - Students can recite facts but cannot explain them.
  - You want better questions for a reading or revision session.
  - A topic is full of facts that feel unconnected.
  - You need prompts for pairs to discuss.
not_for:
  - You teach procedural maths or physical skills. Use worked examples and hands-on practice instead.
  - Learners have not yet learned the facts. Start with a simple quiz or recall practice, then come back to these questions.
  - You need a graded test with marks. Write a test with your own marking guide instead.
you_give:
  - Topic or content
  - Students' age and level
  - The text they are reading (optional)
  - What they already know (optional)
  - Number of prompts (optional)
you_get:
  - Ordered why and how prompts
  - Target knowledge and ideal answer depth
  - Prompts linking to prior learning
  - Guide to timing and grouping
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste in the skill text. No code, files or paid tools are needed.
  - Add your topic, your students' age and level, and how many prompts you want.
  - Paste the reading text and what students already know, if you have them.
  - Read the prompts. Check each one fits your students and cut any that are too easy or too hard.
  - Use the timing and grouping advice to run the session, in pairs or alone.
output_sample:
  input:
    - Your topic or content area
    - Your students' age, year and what they know
    - How many prompts you want (5 to 8 works well)
    - The text your students are reading (optional)
    - What your students already know (optional)
  output:
    - name: Prompts
      contains: An ordered list of why and how questions, each with the idea it targets and what a good answer looks like.
    - name: Connection Prompts
      contains: Questions that link the new facts to things your students already know.
    - name: Implementation Guide
      contains: Advice on timing, grouping, and whether students should answer out loud or in writing.
