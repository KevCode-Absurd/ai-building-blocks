thinking_why: Standards give exact settings.
new_slug: wi-fi-waveform-generator
name: Wi-Fi waveform generator
summary: Build a Wi-Fi waveform generator output for any 802.11 format. Get IQ samples and a plot for link tests, using MATLAB with WLAN Toolbox.
job: build-software
headline: Wi-Fi waveform generator
subhead: A standard-compliant Wi-Fi transmit waveform, ready to feed into a link test or simulation. You choose the 802.11 format and get time-domain IQ samples you can plot or send to hardware.
explain: |
  This is for RF engineers and researchers who already have MATLAB and the WLAN Toolbox. It is not for general business use.

  A standard-compliant Wi-Fi transmit waveform, ready to feed into a link test or simulation. You choose the 802.11 format and get time-domain IQ samples you can plot or send to hardware.

  The skill covers formats from 802.11a/g through n, ac, ax and be, plus newer ones, with single-user, multi-user MIMO, OFDMA, trigger-based uplink and preamble puncturing. You set the PHY format, size the payload, optionally build MAC frames such as data, Block Ack or beacon, and aim for a given packet duration. It can combine packets into a longer waveform. It needs MATLAB with the WLAN Toolbox, which are paid MathWorks products, and an AI that can run MATLAB code. The skill comes from MathWorks under the BSD 2-Clause licence, which lets you use it only with MathWorks products.
when:
  - You need a test signal for a Wi-Fi receiver design.
  - You are building the transmit side of a link simulation.
  - You want an OFDMA packet with specific resource units.
  - You need a waveform of a set duration with a given frame type.
not_for:
  - "You need channel models, receiver processing or EVM and spectral mask checks: use MATLAB WLAN Toolbox receiver functions or a lab signal analyzer."
  - "You need 5G NR, LTE or Bluetooth signals: use the matching MATLAB toolbox for that standard."
  - "You have no MATLAB or no WLAN Toolbox licence: ask an RF engineer or use a lab signal generator."
you_give:
  - Wi-Fi standard and format
  - Bandwidth and modulation settings
  - Payload size or frame type
  - Target duration (optional)
  - MATLAB with WLAN Toolbox
you_get:
  - Time-domain IQ waveform
  - Configured PHY object
  - Packets with MAC frames (optional)
  - Plots of the signal
  - Multi-packet waveform (optional)
how_to_use:
  - Check you have MATLAB with the WLAN Toolbox. Wi-Fi 8 (802.11bn) needs MATLAB R2026a or later.
  - "Gather your numbers: 802.11 format, channel bandwidth, MCS, number of streams, and payload size or target duration."
  - Open an AI that can run MATLAB code. Paste the skill, then give it your numbers.
  - Ask for the waveform and a plot. Check the packet length and shape match what you asked for.
  - If you need MAC frames or OFDMA, say which frame type or resource unit layout you want.
  - Next, feed the IQ samples into a WLAN Toolbox receiver or a lab signal analyser to check EVM and the spectral mask.
  - Send the IQ samples to your receiver or link simulation. Ask your AI to save the script as a Live Code .m file so you can run it again.
output_sample:
  input:
    - Your 802.11 format, such as 802.11n, ac, ax, be or bn
    - Channel bandwidth, MCS and number of streams
    - Payload size or a target packet duration
    - Frame type, if you want MAC frames (optional)
    - OFDMA resource unit layout (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB with the WLAN Toolbox licence
    - MATLAB R2026a or later, only if you want Wi-Fi 8 (802.11bn)
  output:
    - name: Config object
      contains: The Wi-Fi format settings you chose, such as bandwidth, MCS, streams and antennas.
    - name: Payload bits
      contains: Random bits or a MAC frame such as Data, Block Ack or Beacon, sized to your length or duration.
    - name: Waveform
      contains: The time-domain IQ samples from the WLAN waveform generator, ready for a link test or hardware.
    - name: Time plot
      contains: A plot of signal magnitude over time, so you can check the packet looks right.
    - name: Allocation plot
      contains: A view of the resource unit layout, for OFDMA formats such as HE, EHT and UHR.
    - name: Multi-packet waveform
      contains: Several packets joined into one longer waveform, when you ask for it.
