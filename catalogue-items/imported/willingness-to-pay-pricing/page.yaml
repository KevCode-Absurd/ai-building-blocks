thinking: high
thinking_why: Pricing depends on buyer value and many linked choices.
new_slug: willingness-to-pay-pricing
name: Willingness to pay pricing planner
summary: Plan your pricing with a willingness to pay survey. Give it your product and buyers. You get tiers, a price metric and a 0 to 10 pricing score.
job: set-prices
headline: Willingness to pay pricing planner
subhead: A price and plan structure built on what buyers say they will pay, set while your product is still changeable. Most new products miss revenue targets because price came last.
explain: |
  A price and plan structure built on what buyers say they will pay, set while your product is still changeable. Use it before or while you build. If the product is done and you need tiers and a price test now, the Pricing strategist is quicker. This one adds buyer pay interviews and the leader, filler and killer sort of features into plans.

  The skill applies the Monetizing Innovation method. It helps you ask the right questions: what feels acceptable, expensive and too much, plus trade-off questions that reveal real priorities, scored with top-box purchase intent only. It then groups buyers by value, shapes good, better and best tiers and moves killer features out of the base plan. It scores your current pricing from 0 to 10 and lists the changes needed to reach 10. That score is a judgement by your AI, not a validated measure.

  Source and licence: this is a copy of the Monetizing Innovation skill from Wondel.ai, shared under the MIT licence (see the LICENSE file). We only changed two see-also names to match this library.
when:
  - You are designing a new product and have no price yet.
  - Your price came from costs or a competitor's page.
  - You discount too often and want a firmer plan.
  - You need to decide between tiers, freemium or one flat price.
not_for:
  - "Your product has months of live sales data: start with that data, then come back to test a change."
  - "You want to design a guarantee or a stronger offer: use offer-builder, not a pricing plan."
  - "You want to know what customers value or why they buy: study customer jobs first with jobs-to-be-done-framer."
you_give:
  - Product description
  - Target customer groups
  - Current price and plans (optional)
  - Competitor prices (optional)
  - Customer research you have (optional)
you_get:
  - Willingness-to-pay survey questions
  - Customer segments by value
  - Tier and packaging design
  - Suggested price metric
  - Pricing score with next fixes
how_to_use:
  - Open Claude, ChatGPT or Gemini. Paste the skill instructions into a new chat. The skill points to five reference files in its references folder: wtp-conversations, four-failures, packaging-tiers, monetization-models and case-studies. Paste or attach them too. Without them it still runs, but you lose the exact question scripts, the tier scoring steps and the worked cases. No code or paid tool is needed.
  - "Which file feeds which part: wtp-conversations gives the survey questions and how to read the answers. four-failures gives the diagnosis of what is wrong with a current price. packaging-tiers gives the tier table and the leader, filler and killer labels. monetization-models gives the price metric. case-studies gives worked cases."
  - Paste your product description and your target customer groups.
  - Add your current price, plans, competitor prices and any research you have. Skip what you lack.
  - Ask for the survey questions first, and run them with real buyers if you can.
  - Paste the answers back. Ask for the segments, tier table, price metric and 0 to 10 score.
  - Test the tier table with real buyers before you set prices, and check that no killer feature sits in your base plan. For guarantees and stronger offers, move on to offer-builder. Expect one report with the five sections listed under "What you get". The 0 to 10 score is your AI's judgement from what you gave it, not a tested scale.
output_sample:
  input:
    - Your product description
    - The customer groups you want to sell to
    - Your current price and plans (optional)
    - Competitor prices (optional)
    - Any customer research you have (optional)
  output:
    - name: Willingness-to-pay survey questions
      contains: Questions on what feels acceptable, expensive and too much, plus trade-off questions, scored on top-box purchase intent.
    - name: Value segments
      contains: Your buyers grouped by how much they value the product and what they care about most.
    - name: Tier table
      contains: Good, better and best plans with prices, each feature labeled leader, filler or killer.
    - name: Price metric
      contains: The unit you charge by, chosen to track the value buyers get.
    - name: Pricing score
      contains: A 0 to 10 score for your current pricing, with the changes needed to reach 10.
next: [pricing-strategist, offer-builder]
