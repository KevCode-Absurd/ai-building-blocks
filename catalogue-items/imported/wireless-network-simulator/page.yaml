thinking: medium
thinking_why: Setup choices change the results.
new_slug: wireless-network-simulator
name: Wireless network simulator
summary: Set up a wireless network simulation in MATLAB and get throughput results for your nodes and traffic before you build or deploy anything.
job: build-software
headline: Wireless network simulator
subhead: A system-level wireless simulation of your nodes and traffic, with throughput results you can compare. You see how the network behaves under load before building anything.
explain: |
  This is for network engineers and researchers who already have MATLAB and write MATLAB code, or can ask someone who does. Nothing here runs without MATLAB.

  A system-level wireless simulation of your nodes and traffic, with throughput results you can compare. You see how the network behaves under load before building anything.

  The skill sets up the simulator with your nodes, then adds traffic sources such as on-off, file transfer, voice and video conference. It can move nodes using random waypoint or custom paths, schedule actions during the run, log events and IQ samples and write packet captures. It also covers parameter sweeps, so you can see how results change as a setting changes, and viewers for the traffic and the layout. It needs MATLAB with the wireless networking toolboxes, which are paid MathWorks products. The skill comes from MathWorks under the BSD 2-Clause licence, which lets you use it only with MathWorks products.
when:
  - You want to check throughput before deploying a network.
  - You need to see how moving devices affect performance.
  - You want a packet capture from a simulated network.
  - You are testing how one setting changes results across many runs.
not_for:
  - "You only work with Bluetooth: use the Bluetooth network simulation skill (matlab-simulate-bluetooth-network) instead."
  - "You need waveform, signal processing or link-level PHY work: use your own MATLAB code, since this skill covers system-level runs only."
  - "You do not have MATLAB R2026a or later with the Wireless Network Toolbox: ask an engineer who does to run it."
you_give:
  - Node list and positions
  - Traffic types and rates
  - Mobility rules (optional)
  - Settings to sweep (optional)
  - MATLAB with required toolboxes
you_get:
  - Configured simulation
  - Throughput results
  - Event log and packet captures
  - Traffic and network plots
  - Parameter sweep results
how_to_use:
  - Check that you have MATLAB R2026a or later with the Wireless Network Toolbox. Your AI needs to run MATLAB code.
  - Gather these first: how many nodes you have and where each one sits (with units, such as metres), the traffic each node sends and its rate (for example in Kbps), how long to run the simulation, and any settings you want to sweep with their start, end and step.
  - Open your AI tool and paste in the skill, or upload the skill folder.
  - Describe your nodes, where they sit and what traffic each one sends. Add movement or sweep settings if you need them.
  - Ask your AI to write and run the simulation, then check the throughput results per node and flow.
  - Compare the sweep results with your target load, and change one setting at a time to see its effect. Send the throughput results to a network planner or engineer. For a Bluetooth scenario, use the Bluetooth network simulation skill.
output_shape: |
  Throughput table: one row per node and per flow, with columns for the node, the flow, the traffic type, the sent rate and the received throughput
  Sweep results: one row per run, with the setting value and the throughput at that value
  Files: event log, IQ samples and packet capture files, if you asked for them
  Plots: traffic viewer and network layout viewer
output_sample:
  input:
    - Your list of nodes and where they sit
    - The traffic each node sends, such as voice, video, file transfer or on-off, and how fast
    - How nodes move (optional)
    - Settings you want to sweep across many runs (optional)
  prerequisites:
    - An AI that can run MATLAB code
    - MATLAB R2026a or later with the Wireless Network Toolbox
  output:
    - name: Simulator setup
      contains: A configured wireless network simulator with your nodes, positions and any custom node or channel choices.
    - name: Traffic sources
      contains: On-off, file transfer, voice or video conference traffic attached to your nodes, with per-flow statistics.
    - name: Mobility and scheduled actions
      contains: Random waypoint or custom node paths, plus actions timed during the run.
    - name: Parametric sweeps
      contains: Results across many runs as one setting changes, so you can compare them.
    - name: Instrumentation
      contains: Event logs and IQ samples from the run, plus traffic and network layout viewers.
    - name: PCAP capture
      contains: Packet capture files written from the simulated network.
    - name: Event callbacks
      contains: Code that reacts to events on wireless nodes and reads the event data fields.
