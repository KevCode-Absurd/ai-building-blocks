thinking: medium
thinking_why: Setup choices change the results.
new_slug: wireless-network-simulator
name: Wireless network simulator
summary: Describe nodes and traffic. Get a system-level wireless network run
  with throughput results.
job: build-software
headline: Wireless network simulator
subhead: A system-level wireless simulation of your nodes and traffic, with
  throughput results you can compare. You see how the network behaves under load
  before building anything.
explain: |
  A system-level wireless simulation of your nodes and traffic, with throughput results you can compare. You see how the network behaves under load before building anything.

  The skill sets up the simulator with your nodes, then adds traffic sources such as on-off, file transfer, voice and video conference. It can move nodes using random waypoint or custom paths, schedule actions during the run, log events and IQ samples and write packet captures. It also covers parameter sweeps, so you can see how results change as a setting changes, and viewers for the traffic and the layout. It needs MATLAB with the wireless networking toolboxes.
when:
  - You want to check throughput before deploying a network.
  - You need to see how moving devices affect performance.
  - You want a packet capture from a simulated network.
  - You are testing how one setting changes results across many runs.
you_give:
  - Node list and positions
  - Traffic types and rates
  - Mobility rules (optional)
  - Settings to sweep (optional)
  - MATLAB with required toolboxes
you_get:
  - Configured simulation
  - Throughput results
  - Event log and packet captures
  - Traffic and network plots
  - Parameter sweep results
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run MATLAB with Wireless Network Toolbox.
