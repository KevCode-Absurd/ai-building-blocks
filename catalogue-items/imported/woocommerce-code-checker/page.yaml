thinking: medium
thinking_why: It applies a fixed checklist to the code.
new_slug: woocommerce-code-checker
name: WooCommerce code checker
summary: Check WooCommerce code before it goes live. Find order storage bugs, checkout gaps, money errors and security holes in AI-written code.
job: test-and-fix-code
headline: WooCommerce code checker
subhead: A review pass that catches the mistakes AI makes in WooCommerce code before they reach a live store. These errors can lose orders or open a security hole where money is involved.
explain: |
  A review pass that catches the mistakes AI makes in WooCommerce code before they reach a live store. These errors can lose orders or open a security hole where money is involved.

  The skill checks new or changed code against a fixed rule set. Typical catches are reading order data with old post-meta calls that break on stores using high-performance order storage, and skipping checks at checkout. It also applies a security floor: escape all output, clean request data, require permission and a nonce for any change, and prepare every database query. Use it after code is written, while writing, or to audit an existing extension.
when:
  - AI wrote a payment or shipping extension and you want it checked.
  - You customise checkout and fear breaking orders.
  - Your store uses high-performance order storage.
  - You are reviewing a plugin before putting it on a live store.
not_for:
  - "You want to check store settings or theme styling: ask a WooCommerce support person or do a store setup review."
  - "You need payment provider account setup: use the provider's own setup guide or support team."
  - "You need a full WordPress review beyond the security basics: use wp-guard, a separate WordPress code checker."
you_give:
  - The WooCommerce code or diff
  - What the code is meant to do
  - WooCommerce and PHP versions (optional)
  - "Mode: guard pass, live or review"
you_get:
  - List of issues by severity
  - Order storage and checkout problems
  - Security fixes
  - Corrected code suggestions
  - Self-check before shipping
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill instructions from this page.
  - Paste your WooCommerce code or the changed lines. Say what the code should do.
  - Add your WooCommerce and PHP versions if you know them (optional).
  - "Pick a mode: guard pass after the code is written, live while it is written, or review for a report only."
  - Read the findings. Fix every Rule 1 to 5 item first, then run the self-check again.
  - Pair it with wp-guard for the wider WordPress checks.
output_sample:
  input:
    - Your WooCommerce code or the changed lines
    - What the code is meant to do
    - Your WooCommerce and PHP versions (optional)
    - "Which mode you want: guard pass, live or review"
  prerequisites:
    - An AI that can read your code, pasted in chat or as files
  output:
    - name: Findings report
      contains: Each rule broken, with the file, one line on what is wrong, the risk and the fix.
    - name: Order and product data findings
      contains: Old post-meta order reads, direct meta writes, and missing storage compatibility notices.
    - name: Checkout and money findings
      contains: Checks that only run in JavaScript, and prices handled as plain numbers instead of WooCommerce money tools.
    - name: Runtime and update findings
      contains: Cart or session use outside checkout, shipped template overrides, and background jobs that may not scale.
    - name: Security floor check
      contains: Whether output is escaped, input is cleaned, changes need permission and a nonce, and queries are prepared.
    - name: Self-check
      contains: Eight yes or no questions answered before the code is handed back, with fixes for any that fail.
