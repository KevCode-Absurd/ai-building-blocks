thinking: medium
thinking_why: It scores your idea against six clear triggers and suggests changes.
new_slug: word-of-mouth-planner
name: Word of mouth planner
summary: Plan word of mouth for your product. Score your idea on six sharing triggers and see which one to raise next to get people talking.
job: grow-social
headline: Word of mouth planner
subhead: Ideas that make people talk about your product, each checked against six reasons things spread. You see which parts of your idea are likely to be shared and which are weak.
explain: |
  Ideas that make people talk about your product, each checked against six reasons things spread. You see which parts of your idea are likely to be shared and which are weak.

  The skill uses the STEPPS model from Jonah Berger: social currency, triggers, emotion, public visibility, practical value and stories. It scores each driver from 0 to 2 for your product or message, reports a total and names the drivers to raise next. A strong plan has at least three strong drivers, including one that shows in public or makes people look good. It also notes that most talk happens offline, so it does not lean only on social media.
when:
  - You are launching and have no ad budget.
  - Your product is good but nobody mentions it.
  - You want a campaign people pass on without being asked.
  - You need a way to judge which idea is most shareable.
not_for:
  - You have no clear message yet. Write down what your product does and who it is for first, then come back.
  - You need reach this week. Run a small paid ad test, because word of mouth builds slowly.
  - You want to push people to buy with pressure tactics. Use a sales or persuasion guide instead.
you_give:
  - Your product or message
  - Who you want to reach
  - Current ways people hear about you (optional)
  - Ideas you are considering (optional)
you_get:
  - Score for each of six drivers
  - Ideas to raise weak drivers
  - Trigger and public visibility ideas
  - Story people can retell
  - Overall sharing score
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat.
  - Have ready a one-paragraph description of your product, and a list of how customers describe it now in their own words.
  - Describe your product or message in a few lines.
  - Say who you want to reach. Add how people hear about you now and any ideas you are weighing (optional).
  - Read the six scores first. Then look at the driver it says to raise next.
  - Pick one or two ideas for the weak drivers and run the plan again to see if the score goes up.
output_sample:
  input:
    - Your product or message
    - Who you want to reach
    - How people hear about you now (optional)
    - Ideas you are considering (optional)
  output:
    - name: Six driver scores
      contains: A score of 0, 1 or 2 for social currency, triggers, emotion, public visibility, practical value and stories.
    - name: Raw total
      contains: The six scores added up, out of 12.
    - name: Mapped score
      contains: The raw total turned into a score out of 10, with the band it falls in.
    - name: Driver to raise next
      contains: The weak driver or drivers to fix first to reach a higher score.
    - name: Ideas to raise weak drivers
      contains: Specific ideas for triggers, public visibility and a story people can retell.
