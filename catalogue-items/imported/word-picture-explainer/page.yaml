job: teach-and-train
headline: Words and picture explainer designer
subhead: A plan for a diagram or visual that sits beside your words so the idea
  sticks. People remember explanations better when they get both a verbal and a
  visual version.
explain: |
  A plan for a diagram or visual that sits beside your words so the idea sticks. People remember explanations better when they get both a verbal and a visual version.

  The skill is built on dual coding theory and multimedia learning research. You paste the explanation and say who will use it. It then decides what to show, what to leave out and how the picture and text should relate, avoiding clutter that overloads the learner. It returns a visual plan covering the type of diagram, what each part shows, labels and where text goes, plus advice on how to teach with it. It describes the picture; it does not draw one.
when:
  - Your explanation is a wall of text and students look lost.
  - You are making slides for a hard concept.
  - You want a diagram for a worksheet or handout.
  - You need to decide which part of an idea to show visually.
you_give:
  - The explanation or text
  - Subject and learner level
  - Format such as slide or handout (optional)
  - Current visual, if any (optional)
you_get:
  - Diagram or visual type recommendation
  - Description of each visual part
  - Label and text placement
  - Teaching notes for use
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
