thinking: medium
thinking_why: It decides what to show and what to say.
new_slug: word-picture-explainer
name: Words and picture explainer designer
summary: Turn an explanation into a plan for a diagram that sits beside your words, so students remember it. Paste your text and get a word and picture explainer.
job: teach-and-train
headline: Words and picture explainer designer
subhead: A plan for a diagram or visual that sits beside your words so the idea sticks. People remember explanations better when they get both a verbal and a visual version.
explain: |
  Made for teachers, and it works the same for anyone who trains staff or explains a hard idea at work. The skill is built on dual coding theory and multimedia learning research. You paste the explanation and say who will use it. It then decides what to show, what to leave out and how the picture and text should relate, avoiding clutter that overloads the learner. It returns a visual plan covering the type of diagram, what each part shows, labels and where text goes, plus advice on how to teach with it. It describes the picture; it does not draw one.
when:
  - Your explanation is a wall of text and students look lost.
  - You are making slides for a hard concept.
  - You want a diagram for a worksheet or handout.
  - You need to decide which part of an idea to show visually.
not_for:
  - "You need students to recall plain facts, like dates or word lists: use a short summary or a set of quiz questions."
  - "You want a finished picture drawn for you: use an image tool or draw the plan by hand, because this only describes the visual."
  - "You need to teach step-by-step maths: use a worked example with each step written out."
you_give:
  - The explanation or text
  - Subject and learner level
  - Format such as slide or handout (optional)
  - Current visual, if any (optional)
you_get:
  - Diagram or visual type recommendation
  - Description of each visual part
  - Label and text placement
  - Teaching notes for use
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill instructions into a new chat. No code or paid tools are needed.
  - Paste the explanation you want to teach.
  - Say the subject and year group, like Year 7 Geography.
  - Add your format limits, such as a whiteboard drawing in three minutes, and any visuals you already use (optional).
  - Read the plan from top to bottom. Check that the picture shows the key idea and has few labels.
  - Draw it by hand or build it in slides. The plan is a spec, not a finished picture. For next steps, use the Overloaded lesson checker to check for overload and the Worked example to practice sequence builder to plan practice.
output_sample:
  input:
    - The explanation or text you want a visual for
    - Subject and year group
    - Format limits, like a whiteboard or slide (optional)
    - Visuals you already use for this topic (optional)
  output:
    - name: Recommended Visual Type
      contains: The kind of diagram that fits your idea, and why it suits this topic and learner level.
    - name: Visual Description
      contains: What each part of the picture shows, so you can draw it by hand or in slides.
    - name: Spatial Layout
      contains: Where each part sits on the page or slide, and how the eye should move across it.
    - name: Annotation Strategy
      contains: Which words go on the picture as labels and which words you say out loud instead.
    - name: Integration Notes
      contains: How to show words and picture together so students do not have to split their attention.
    - name: Common Pitfalls to Avoid
      contains: Design mistakes that would add clutter and make the idea harder to learn.
next: [overloaded-lesson-checker, worked-example-practice, self-explanation-question-writer]
