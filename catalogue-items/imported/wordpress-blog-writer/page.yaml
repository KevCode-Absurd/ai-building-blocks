thinking: medium
thinking_why: It follows a set structure and writes long copy.
new_slug: wordpress-blog-writer
name: WordPress blog writer
summary: Write an SEO blog post for WordPress from one keyword. You get a long article with tables, an FAQ and optional Yoast and schema fields.
job: get-found-in-search
headline: WordPress blog writer
subhead: A full blog post built for search and ready to paste into WordPress. You give a keyword and get a long, structured article with the extras that usually take another hour.
explain: |
  A full blog post built for search and ready to paste into WordPress. You give a keyword and get a long, structured article with the extras that usually take another hour.

  You set the title, primary keyword and search intent: informational, commercial or transactional. The skill writes the article with a short answer box near the top, comparison tables, clear headings and an FAQ section. On request it adds Yoast fields, such as meta title, description and slug, and JSON-LD schema markup. It writes in an expert, direct voice and keeps structure consistent so every post in your blog looks like it belongs to the same site.
when:
  - You need a new post for a keyword and have no time to draft.
  - Your posts lack tables and an FAQ.
  - You want Yoast fields filled in with the post.
  - You run a content calendar and need consistent structure.
not_for:
  - "You need a product page, landing page or sales copy: ask your AI for plain sales copy, or use a copywriter."
  - "You need news or a time-sensitive story: write it yourself or with a reporter, because this skill can't confirm fresh facts."
  - "You still need a plan for which keywords to target: build a simple keyword list first, then come back with one keyword."
you_give:
  - Post title
  - Primary keyword
  - Search intent
  - Secondary keywords (optional)
  - Yoast and schema needs (optional)
you_get:
  - Full long-form post
  - Comparison tables
  - FAQ section
  - Yoast title, description and slug (optional)
  - JSON-LD schema (optional)
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste the skill text into a new chat.
  - Add your title, main keyword, search intent and niche. Say if you want Yoast fields, schema and how many images.
  - Paste any sources you want used, each with a link. Your AI should cite only those.
  - Read the post and check every fact and number against your sources.
  - Copy the post into WordPress. Paste the Yoast fields and schema into their boxes if you asked for them.
output_sample:
  input:
    - Your post title
    - Your main keyword
    - "Search intent: informational, commercial or transactional"
    - Your niche or industry
    - Sources you want cited, with links (optional)
  prerequisites:
    - Web browsing is optional. Without it, the skill says so and cites only what you paste.
  output:
    - name: Contents
      contains: A short table of contents that lists each section of the post in order.
    - name: Blog post
      contains: The title, introduction, core sections, tables, misconceptions, FAQ and conclusion, written in short, plain sentences.
    - name: Truth Box
      contains: A table of 5 key points and an insight for each, placed right after the introduction.
    - name: Common Misconceptions
      contains: Three myths about the topic, each with a simple correction.
    - name: FAQ
      contains: Five real reader questions with short, direct answers.
    - name: Image SEO
      contains: Alt text, title, caption, description and placement for each image you ask for, including a featured image.
    - name: Yoast SEO section
      contains: Focus keyphrase, SEO title, slug, meta description, and social title and description. Only if you ask.
    - name: Schema markup
      contains: JSON-LD for the blog post and the FAQ, with placeholder links. Only if you ask.
