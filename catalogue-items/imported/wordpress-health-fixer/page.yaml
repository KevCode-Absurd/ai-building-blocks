thinking: medium
thinking_why: It sorts issues by risk and writes steps.
new_slug: wordpress-health-fixer
name: WordPress health fixer
summary: Turn your WordPress Site Health report into a ranked fix plan. Backups come first, and each fix has exact commands. Fix site health warnings safely.
job: build-websites
headline: WordPress health fixer
subhead: A ranked fix plan for your WordPress Site Health screen, with backups first and exact commands for each step. You stop staring at a long list of warnings and start closing them in a safe order.
explain: |
  A ranked fix plan for your WordPress Site Health screen, with backups first and exact commands for each step. You stop staring at a long list of warnings and start closing them in a safe order.

  Paste the report from Tools, Site Health, or the debug info. The skill sorts items into critical, recommended and passed, then tiers every fix by risk. Before any edit to wp-config.php, .htaccess or a plugin, it tells you to back up that exact file outside the web root. Your AI gives you commands and code to run yourself, because a chat AI cannot reach your site. Safe fixes are short and easy to undo. Risky ones are marked. It covers speed, security and SEO issues.
when:
  - Site Health shows red and orange items you do not understand.
  - You want the site faster and safer without breaking it.
  - A client's WordPress site needs a clean-up.
  - You need to remove old plugins and themes safely.
not_for:
  - "You have no restorable backup and no way to get one: ask your host's support to make one, or test on a staging copy first."
  - "You have no file access, no SFTP and no WP-CLI: ask your host's support to make the changes for you."
  - "Your site shows a white screen or will not load: ask your host to restore a backup first, because Site Health cannot be read."
you_give:
  - Site Health report text or screenshot
  - Debug info (optional)
  - Access method such as WP-CLI
  - Backup status
you_get:
  - Issues ranked by risk
  - Backup steps for each file
  - Exact WP-CLI commands
  - Code changes to make
  - Handoff list for risky fixes
how_to_use:
  - Open Tools, then Site Health in your WordPress admin. Copy the text from the Status tab. You can also copy the Info tab.
  - Open Claude, ChatGPT or Gemini and paste in the skill instructions from this page.
  - Paste your report. Say how you can reach your files (SFTP, host file manager or WP-CLI) and whether you have a full backup.
  - Know that the commands need WP-CLI or SFTP access, and that you run them yourself. Your AI shows the rollback command before any delete or edit.
  - Make the backup your AI asks for before you change any file. Some commands, such as the UpdraftPlus backup or Redis cache steps, only work if that plugin is installed. Host-level changes, such as PHP settings or an object cache, may need a paid host plan or a support ticket.
  - Make one change at a time. Check that your home page and wp-admin still load after each one. If a fix asks you to switch off a security or firewall plugin, do it only briefly and turn it back on straight after, because your site is less protected while it is off.
  - Run Site Health again to see which warnings have cleared.
  - If the site breaks after a change, restore the backed-up file using the rollback command, then contact your host. Tier 2 items may need your host's support.
output_sample:
  input:
    - Your Site Health report, pasted as text or a screenshot
    - Your Site Health Info debug text (optional)
    - How you can reach your site files, such as SFTP or WP-CLI
    - Whether you have a full site and database backup
  prerequisites:
    - A restorable backup of your site and database
    - File access to your site, such as SFTP, your host's file manager or WP-CLI
    - An AI that can read your pasted text (it does not need to run code)
  output:
    - name: Triage table
      contains: Every item from your report with its category, risk tier and a one-line fix.
    - name: Tier 1 fixes
      contains: Low-risk fixes such as removing unused plugins and themes, with a backup step and a before and after view.
    - name: Tier 2 fixes
      contains: Riskier changes with the exact code, where it goes, the backup, a check, and how to undo it.
    - name: Tier 3 and unknown items
      contains: One line each for items that need no action or that the skill does not recognise.
    - name: Re-check advice
      contains: A reminder to run Site Health again to see the warnings clear.
