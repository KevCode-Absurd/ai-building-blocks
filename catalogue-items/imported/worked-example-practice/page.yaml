thinking: medium
thinking_why: It steps support down at the right pace.
new_slug: worked-example-practice
name: Worked example to practice sequence builder
summary: Turn any multi-step procedure into worked examples that fade into independent practice. Get a worked example sequence your students can follow.
job: teach-and-train
headline: Worked example to practice sequence builder
subhead: A learning sequence that moves students from fully solved examples to solving the task alone, so they do not drown in the first problem. It is built on research by Sweller and Renkl.
explain: |
  A learning sequence that moves students from fully solved examples to solving the task alone, so they do not drown in the first problem. It is built on research by Sweller and Renkl.

  You name the skill and the learners' level. The skill writes a series of examples. The first shows every step with the reasoning. In the next, one step is left blank, then two, then more, until the learner does all of it. Each step comes with prompts that make them explain what they did. It also warns when to slow the fading, because as learners gain skill, too much help can start to hurt. It draws on research by Sweller, Renkl and others.
when:
  - Students freeze when you set a new type of problem.
  - You teach a multi-step procedure such as an algebra method.
  - You want a fair way to remove support gradually.
  - Mixed-ability groups need different starting points.
not_for:
  - "You teach an open-ended task like an essay or experiment design: write a set of practice problems or use a simple rubric instead."
  - "You want to check what students understood after the lesson: ask a colleague or write quick quiz questions instead."
  - "Your learners already know the procedure well: skip the worked examples and go straight to independent practice."
you_give:
  - The procedure or skill to teach
  - Learners' age and level
  - Common mistakes (optional)
  - Number of examples (optional)
you_get:
  - Fully worked examples
  - Partly completed examples
  - Independent practice tasks
  - Self-explanation prompts
  - Guidance on pacing the fade
how_to_use:
  - Open a chat in Claude, ChatGPT or Gemini. No code, files or paid tools are needed.
  - Paste the text of this skill into the chat.
  - Fill in the skill you teach, your students' level and the number of steps. Add common mistakes if you know them.
  - Read the result. Check that the blanks start at the end of the procedure and move backward, so students finish each problem themselves.
  - Fix any example that does not match your students, then print or share the three stages in order.
  - Next, use practice-problem-set-writer for more practice problems, or lesson-understanding-check to see what students understood.
output_sample:
  input:
    - The procedure or skill you want to teach
    - Your students' age and level (novice, developing or advanced)
    - About how many steps the procedure has
    - Mistakes students often make (optional)
    - What students already know (optional)
  output:
    - name: "Stage 1: Complete Worked Example"
      contains: One fully solved example with each step explained and prompts that ask students to explain the step themselves.
    - name: "Stage 2: Completion Problems (Fading Sequence)"
      contains: Three or four problems where more steps are left blank each time, until students do most of the work.
    - name: "Stage 3: Independent Practice"
      contains: Two or three problems students solve alone, with no steps filled in.
    - name: Fading Rationale
      contains: What help is removed at each stage and why that step comes out when it does.
    - name: Expertise Reversal Note
      contains: A warning on when to slow the fading or drop worked examples, because too much help can hurt stronger learners.
next: [practice-problem-set-writer, lesson-understanding-check]
