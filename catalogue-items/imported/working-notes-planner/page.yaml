thinking: low
thinking_why: It keeps three simple files up to date.
new_slug: working-notes-planner
name: Working notes planner
summary: Keep a long AI task on track. Get a plan file, a findings file and a progress log your AI rereads before each big decision.
job: organise-work
headline: Working notes planner
subhead: "Give your AI a long task. It keeps three simple files: a plan, what it learned, and what it has done. It rereads them so it does not forget the goal halfway through."
explain: |
  Three files that act as your AI's memory on a long task, so it stays on track instead of forgetting the goal halfway through. The work survives long sessions.

  Before any big task, the skill creates task_plan.md, findings.md and progress.md in your project folder. The plan holds the goal and phases. Findings holds what was learned along the way. Progress logs what is done and what errors came up. Before each major decision the AI rereads the plan to refresh the goal, and after each phase it updates the files. The method is borrowed from how Manus handles working memory on disk. Manus is an AI agent product, and you do not need it. The skill file carries a risk: critical tag. That tag comes from the collection this skill was copied from. It only means the skill writes files and runs shell scripts.
when:
  - Your AI loses focus on a task with many steps.
  - A session runs long and early decisions get forgotten.
  - You want to see what your AI has learned and done so far.
  - You need to pick the work up again tomorrow.
not_for:
  - "You only have a simple question, a quick lookup or a single-file edit: just ask your AI directly, no files needed."
  - "Your AI can't read or write files, as in a basic chat window: keep a short running list in the chat and paste it back each time."
  - "You need a team task board with owners and due dates: use a project tool your team already shares."
you_give:
  - The long task and its goal
  - A project folder to keep the files in
  - Phases or milestones (optional)
you_get:
  - A task plan file with the goal, phases and decisions
  - A findings file with what your AI learned
  - A progress log of what is done and what failed
  - A habit of rereading the plan before big decisions
how_to_use:
  - Have ready the goal in one sentence, the path of your project folder and, if you know them, the phases. Use an AI that can read and write files in a folder, such as Claude Code. The helper scripts also need a shell. In a plain chat, ask it to show the three files as text and paste them back each session.
  - Add the skill to your AI tool. The skill's own templates and scripts stay in its folder. Your three files go in your project folder.
  - Before your AI runs the helper scripts, open scripts/init-session.sh and scripts/check-complete.sh and read them. They only create the three files and count the phases marked complete in task_plan.md.
  - Tell your AI the goal and say to follow the planning-with-files skill. It makes task_plan.md, findings.md and progress.md first.
  - Check task_plan.md before work starts. Fix the goal and phases if they are wrong.
  - Skip this skill for simple questions, single-file edits and quick lookups.
  - To resume later, ask your AI to read all three files first, then carry on.
  - After the first session, work through the phases in task_plan.md and log each one in progress.md.
  - When check-complete.sh reports that all phases are complete, read progress.md and write a short summary for your reviewer, or keep findings.md to hand to the next session. This skill does not pair with another item in the library.
output_sample:
  input:
    - Your long task and its goal
    - A project folder where the files can be kept
    - Phases or milestones (optional)
  prerequisites:
    - An AI that can read and write files in your project folder
  output:
    - name: task_plan.md
      contains: The goal, the phases with their status, key decisions, and a table of errors with what was tried.
    - name: findings.md
      contains: Research and discoveries saved as they happen, so nothing seen in a browser, image or PDF is lost.
    - name: progress.md
      contains: A session log of what was done, files created or changed, and test results.
    - name: Reread rule
      contains: Your AI reads the plan before each major decision and updates the files after each phase.
    - name: 3-strike error rule
      contains: After three failed tries, your AI stops, explains what it tried, shares the error and asks you.
