thinking: high
thinking_why: It keeps track of evidence and gaps over many steps.
new_slug: workplace-investigation-guide
name: Workplace investigation guide
summary: Run a workplace investigation from complaint to findings memo. Get a plan, an evidence log and a draft memo. Not legal advice.
job: hire-people
headline: Workplace investigation guide
subhead: A structured path through a workplace complaint, from the first intake to a draft memo. You keep a clean evidence log and a record of which sources you have covered.
explain: |
  Not legal advice. Everything it writes is a draft for your employment lawyer, who must review it before anyone acts on it. It does not know the rules for your country or state, such as notice periods, union or works council rights, data protection or whistleblower law, so ask your lawyer about those.

  The skill opens a matter, then lets you add documents one by one. It reads each for key facts, logs them and tracks coverage against the people and sources you planned to check. You can ask questions of the log, and it drafts the final memo and short summaries for different audiences. Everything it creates carries a work-product header, but it warns that marking a file does not create privilege. Confirm first that the investigation is directed by counsel.
when:
  - HR received a complaint and you must investigate it fairly.
  - You are collecting documents and need a clear log.
  - You want to check what evidence you still lack.
  - You must write a findings memo for leadership.
not_for:
  - "The matter is not directed by a lawyer: ask your employment counsel first, because marking a file does not create privilege."
  - "The complaint alleges a crime: call outside employment counsel or the police before you collect anything."
  - "You only need to hire or onboard someone: use a plain hiring checklist or ask your HR adviser."
you_give:
  - A plain description of the complaint
  - Documents and interview notes, added one at a time
  - The people and sources you plan to check
  - Whether a lawyer directs the investigation
you_get:
  - Investigation plan
  - Evidence log
  - Source coverage tracker
  - Answers from the log
  - Draft memo and audience summaries
how_to_use:
  - This skill is built for the employment-legal plugin from Claude for Legal, which saves files under your AI's plugin folder. Use an AI that can create and keep files, and put the skill folder in it. If /employment-legal:cold-start-interview is missing, use the setup-interview folder inside the skill.
  - Without the plugin: if the /employment-legal commands or your CLAUDE.md work-product header are missing, ask your employment counsel for the exact header text and put it at the top of every file. The skill stops and asks you for it, and it never makes one up. Without the commands, say "open an investigation" or "add a document" in plain words and your AI follows the same steps.
  - Confirm first that a lawyer directs the investigation. Marking a file does not create privilege.
  - "Open the matter: describe the complaint, who is involved and the dates. Your AI sets up the log and a sources checklist."
  - Add each document or interview note one at a time. Check each log entry and the list of gaps before you add the next.
  - Ask questions of the log, then ask for the draft memo. Have your lawyer review it before anyone else sees it.
  - Before any file is made, copy the work-product header from your own CLAUDE.md (the Outputs section) into the matter. Share the memo only with counsel and the named investigators. Give HR or leadership the audience summary, not the full memo.
  - After the memo: send the draft memo, the evidence log and the sources checklist to your counsel first. Counsel reviews the memo, then the audience summaries, and only then does anything go to HR or leadership. Keep the log and every file where privileged papers are kept.
output_sample:
  input:
    - A plain description of the complaint
    - Documents and interview notes, added one at a time
    - The people and sources you plan to check
    - Whether a lawyer directs the investigation
  prerequisites:
    - An AI that can create and save files, as the skill keeps a log on disk
    - Confirmation from counsel that the investigation is lawyer-directed
  output:
    - name: log.yaml
      contains: The matter details, the issues drawn from the complaint, each log entry and the evidence gaps still open.
    - name: sources-checklist.yaml
      contains: The people and sources to check for this type of investigation, with a mark for what is covered.
    - name: documents-reviewed.yaml
      contains: Each document reviewed, how many were reviewed and how many held key facts.
    - name: Answers from the log
      contains: Replies to your questions, drawn only from what the log holds.
    - name: Investigation memo
      contains: Executive summary, background, methodology, factual findings, credibility, policies, conclusions, recommendations and two appendices.
    - name: Audience summary
      contains: A short version of the memo written for one reader, such as leadership.
