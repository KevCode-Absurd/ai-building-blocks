thinking: medium
thinking_why: It decides what to remember and where.
new_slug: workplace-shorthand-memory
name: Workplace shorthand memory builder
summary: Teach your AI your nicknames, acronyms and project codes. Get a workplace shorthand memory so short requests like "ask todd for the PSR" make sense.
job: set-up-ai
headline: Workplace shorthand memory builder
subhead: Share your nicknames and codes. Get a memory so Claude knows who and what you mean in short requests. Bring your nicknames, names and acronyms. Then use short requests like "ask todd for the PSR" for drafting and reporting.
explain: |
  This skill is copied from Anthropic's memory-management skill under the Apache 2.0 licence, with the original wording largely unchanged. It was not written for this catalogue.

  A memory file that teaches Claude your nicknames, acronyms and project codes, so a short request like "ask todd to do the PSR for oracle" is understood as written.

  The skill sets up a two-level memory. A small hot cache in CLAUDE.md holds the people and terms you use daily. A fuller glossary and folders for people, projects and context hold the rest. When a word is unclear, Claude checks the cache, then the glossary, and asks you only if it finds nothing. Each entry records who or what the term means and any useful detail, such as a person's role and preferred channel. Over time your short requests stop needing explanation.
when:
  - You keep re-explaining who "Todd" and "PSR" are.
  - You use many internal acronyms and codes.
  - A new teammate or AI needs your company vocabulary.
  - Names in your projects are ambiguous, like two Oracles.
not_for:
  - You make a one-off request. Just spell out the names in your message.
  - You would store private HR or personal facts about people. Keep only work roles, and use a plain shared glossary doc for the rest.
  - Your team only needs a shared word list for people. Use a plain shared glossary doc in Google Docs or Notion.
you_give:
  - Your nicknames, names and acronyms
  - Project and deal names
  - Roles and preferences of people (optional)
  - A project folder for the memory files
you_get:
  - Hot cache of common terms
  - Full glossary file
  - People and project profiles
  - Rule for decoding short requests
how_to_use:
  - Open a project folder in an AI that can read and write files, such as Claude Code. A plain chat can't save the files.
  - The skill is not a slash command (its header sets user-invocable to false). Save the SKILL.md text as a file in your project folder, such as memory-management.md, and tell your AI to read it. Pasting it into a chat works for that chat only. Then say "Set up my workplace memory."
  - Give it your nicknames, acronyms, project codes and key people. Share only work roles, not private details.
  - Check that CLAUDE.md is saved in your project folder and the memory/ folder sits next to it.
  - "Optional: if you have the Claude Code productivity plugin, run /productivity:start. It needs Claude Code and a paid Claude plan, and it reads your chat, calendar, email and documents, so check which accounts you connect first."
  - Try a short request like "ask todd to do the PSR". Check each person and project entry against the real person or project, and fix any wrong one. Then reuse the memory for drafting emails, writing status reports and briefing a new teammate. Point those requests at the same project folder so your AI reads CLAUDE.md first.
output_sample:
  input:
    - Your nicknames, names and acronyms
    - Your project and deal names
    - Roles and contact preferences for people you work with (optional)
    - Your company tools and teams (optional)
  prerequisites:
    - An AI that can read and write files, such as Claude Code or Claude with a project folder
    - The Claude Code productivity plugin, only if you want /productivity:start to scan your chat, calendar, email and documents
  output:
    - name: CLAUDE.md
      contains: A short hot cache with you, your top people, common terms, active projects and your preferences.
    - name: memory/glossary.md
      contains: The full decoder list of acronyms, internal terms, nicknames and project codenames.
    - name: memory/people/
      contains: One profile per person with nicknames, role, team, how they like to be contacted and useful context.
    - name: memory/projects/
      contains: One file per project with codename, other names, status, key people and context.
    - name: memory/context/company.md
      contains: Your tools, teams and processes, with any internal names for them.
    - name: Lookup rule
      contains: Check CLAUDE.md first, then the glossary, then the detail files, and ask you only if nothing matches.
