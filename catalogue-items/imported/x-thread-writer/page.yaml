thinking: low
thinking_why: It follows a set thread shape.
new_slug: x-thread-writer
name: X thread writer
summary: Give it a long idea, transcript or draft. Get an X thread where every
  post stands on its own.
job: grow-social
headline: X thread writer
subhead: Give it a long idea, transcript or draft. Get an X thread where every
  post stands on its own. Bring the idea, article, transcript or draft. Use the
  result to plan your next step.
explain: |
  Turn a long idea, transcript or rough draft into an X thread where every post still makes sense if someone lands on it alone.

  It first asks if the idea needs a thread at all. A single point with one proof is a post, and it says so. If a thread is right, it writes a skeleton first: one line per beat. If the beats could be shuffled with no loss, it labels the thread as a list. The first post makes a specific promise, each following post holds one idea and never leans on the last, and the final post closes the loop. Posts are split by three dashes so a tool can chain them.
when:
  - You have a blog post or talk and want it as a thread.
  - You wrote a rambling draft and need to find the spine.
  - You are unsure whether your idea is a thread or just one tweet.
  - You want a thread where quoting any single post will not embarrass you.
you_give:
  - The idea, article, transcript or draft
  - Your audience on X
  - Your voice or a few past posts (optional)
  - A link or call to action to end on (optional)
you_get:
  - A one-line check on thread or single post
  - A beat-by-beat skeleton
  - The thread with posts separated by dashes
  - A single closing call to action
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
