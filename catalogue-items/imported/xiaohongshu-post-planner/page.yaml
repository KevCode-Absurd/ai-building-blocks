thinking: medium
thinking_why: It adapts content to one platform.
new_slug: xiaohongshu-post-planner
name: Xiaohongshu post planner
summary: Plan a Xiaohongshu post that earns saves. Give it your topic and get a cover brief, titles, body, hashtags and reader-question replies.
job: grow-social
headline: Xiaohongshu post planner
subhead: Name your topic. Get a Xiaohongshu post plan with cover, title and layout aimed at saves and sales. Bring your topic, product or message. Use the result to plan your next step.
explain: |
  A full Xiaohongshu post plan for one topic, built to win saves and, in time, sales on China's biggest lifestyle app.

  You name the topic, product or message. The skill finds the search keywords people use, then picks a format that fits, such as before and after, step by step or a ranked list. For each post it writes a cover brief with a short text overlay, two or three titles with the main keyword near the start, a body with a hook and short paragraphs, three to five hashtags, and the questions real readers are likely to ask, with a reply drafted for each. It orders its choices by save rate first, then click rate, comment depth and read-through.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. Credit goes to yundu-ai and sickn33.
when:
  - You sell a product and want to reach Chinese shoppers on Xiaohongshu.
  - You have a topic and need a cover, title and body that fit the platform.
  - Your posts get views but few saves and you want to fix that.
  - You need a content calendar for the app.
not_for:
  - "You need posts for several Chinese platforms at once: ask a Chinese-market content specialist, as this plan covers Xiaohongshu only."
  - "You want health, medical or skin-result claims: have a qualified person check the claims first, because Chinese ad law is strict on them."
  - "You need the cover image or video made: use an image or video tool, since this only writes the brief and the text."
you_give:
  - Your topic, product or message
  - Your target audience
  - Your goal, such as saves, follows or sales
  - Competitor accounts to compare (optional)
you_get:
  - A cover image brief
  - Two or three title options
  - A full post body with hashtags
  - Likely reader questions with draft replies
  - A format recommendation
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste in the skill text. No code, files or paid tools are needed.
  - "Have ready: your product name, what it is made of or how it works, the price, real customer feedback and any claims you are allowed to make. Type your topic, product or message, then your audience and your goal: saves, follows or sales."
  - Know that this skill cannot look up live Xiaohongshu keywords or trends. Without your search data, keywords are guesses to check. Add competitor accounts if you have them (optional). If your AI cannot browse, also paste the search terms or top posts you have seen, because it cannot look up keywords for you.
  - Read the format choice first. Then check the cover brief, titles and body against your real product and facts.
  - Seed comments in the result are likely reader questions with drafted replies. Do not post them from your own or paid accounts as fake users.
  - Remove any claim you cannot prove, and any number or result you did not get yourself. For skin, health or body claims, have a qualified person check the wording first. Label posts that are paid, gifted or linked to a product as ads, as Xiaohongshu rules and Chinese ad law require.
  - Next, test two or three titles, then track save rate and click rate for each post before you plan a content calendar with content-calendar-builder.
output_sample:
  input:
    - Your topic, product or message
    - Your target audience
    - Your goal, such as saves, follows or sales
    - Competitor accounts to compare (optional)
  output:
    - name: Format choice
      contains: The post format that fits your topic, such as before and after, step by step, comparison, hidden gems or a ranked list.
    - name: Cover image brief
      contains: A visual idea, a short text overlay under 10 characters and a color mood.
    - name: Title options
      contains: Two or three titles with the main keyword in the first 8 characters and an emotional hook.
    - name: Body content
      contains: A hook line, short paragraphs, light emoji use, key points highlighted and a call to action.
    - name: Hashtags
      contains: Three to five tags that mix popular and niche ones.
    - name: Comment engagement plan
      contains: Likely reader questions with draft replies, to be answered openly as the brand, never posted from fake accounts.
