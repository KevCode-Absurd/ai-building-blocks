job: grow-social
headline: Xiaohongshu post planner
subhead: Name your topic. Get a Xiaohongshu post plan with cover, title and
  layout aimed at saves and sales. Bring your topic, product or message. Use the
  result to plan your next step.
explain: |
  A full Xiaohongshu post plan for one topic, built to win saves and, in time, sales on China's biggest lifestyle app.

  You name the topic, product or message. The skill finds the search keywords people use, then picks a format that fits, such as before and after, step by step or a ranked list. For each post it writes a cover brief with a short text overlay, two or three titles with the main keyword near the start, a body with a hook and short paragraphs, three to five hashtags, and seed comments with likely questions. It orders its choices by save rate first, then click rate, comment depth and read-through.
when:
  - You sell a product and want to reach Chinese shoppers on Xiaohongshu.
  - You have a topic and need a cover, title and body that fit the platform.
  - Your posts get views but few saves and you want to fix that.
  - You need a content calendar for the app.
you_give:
  - Your topic, product or message
  - Your target audience
  - Your goal, such as saves, follows or sales
  - Competitor accounts to compare (optional)
you_get:
  - A cover image brief
  - Two or three title options
  - A full post body with hashtags
  - Seed comments and likely questions
  - A format recommendation
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
