thinking: medium
thinking_why: It weighs titles, thumbnails and openings to pick one fix.
new_slug: youtube-channel-auditor
name: YouTube channel auditor
summary: Get the one fix that will help your YouTube channel most this week, plus what to keep doing. Give it your channel link or three videos.
job: grow-social
headline: YouTube channel auditor
subhead: Give it your channel link or three of your videos. This YouTube channel audit looks at your titles, thumbnails, openings and upload rhythm. You get one fix for this week and three things to keep doing.
explain: |
  A YouTube channel audit that lists twenty problems is easy to ignore. This one ends with a single fix, so you know what to change first.

  It checks your channel in a set order. First, your last ten titles read as one list, to see if they all promise the same thing. Then your thumbnails at feed size, the first fifteen seconds of your three newest videos, and how steady your upload rhythm is. If you can export your retention graph, it reads that too.

  It also names three things that already work, so you do not break them, and one thing to leave alone for now.
when:
  - Your channel has stalled and you do not know why.
  - You want honest feedback that is not a long list of problems.
  - You are about to change your format and want to check the current one first.
  - You want to know which of your habits to keep.
not_for:
  - You have fewer than three videos. There is too little to compare, so post a few more first.
  - You want to see where viewers leave one video. Use the YouTube viewer drop-off reviewer.
  - You want ten title ideas for one video. Use the YouTube title and thumbnail checker.
  - You want a full plan with ideas and a calendar. Use the YouTube channel growth planner.
you_give:
  - Your channel link, or links to three of your videos
  - Your last ten video titles
  - Your thumbnails, as images or links
  - The first fifteen seconds of your three newest videos, as text (optional)
  - A retention export from YouTube Studio (optional)
you_get:
  - The one biggest fix, with what to do this week
  - Three specific things that already work
  - What not to do yet, and why
  - A closing question that asks if you will ship it or change it
how_to_use:
  - Open Claude, ChatGPT or Gemini and paste this skill, or add the skill folder if your AI supports it.
  - Paste your channel link or three video links, then your last ten titles in order.
  - Add your thumbnails as images. Paste the opening lines of your three newest videos, or the transcript link, if your AI cannot watch video.
  - Read the one fix first. Check it against your own videos before you change anything.
  - Pick the fix you can do this week, then answer the closing question.
output_sample:
  input:
    - Your channel link, or three of your videos
    - Your last ten titles and thumbnails
    - The opening lines of your three newest videos (optional)
    - A retention export from YouTube Studio (optional)
    - A voice profile or past scripts (optional)
  prerequisites:
    - An AI that can read a public YouTube page, or text you paste in
    - Image upload, if you want the thumbnails checked
  output:
    - name: The one fix
      contains: The single biggest problem, named plainly, with what to do this week.
    - name: What is already working
      contains: Three specific habits to keep, each tied to a real video of yours.
    - name: What not to do yet
      contains: One thing to leave alone for now, and why.
    - name: Ship it or change it
      contains: A closing question that asks you to publish the fix or change the plan.
how_it_works:
  - title: Read your voice
    text: It reads your voice profile if you have one, or infers your voice from three videos.
  - title: Read your titles
    text: It reads your last ten titles as a list, to see if they all promise different things.
  - title: Shrink the thumbnails
    text: It checks each thumbnail at feed size. If three are unreadable, that is the fix.
  - title: Score the openings
    text: It reads the first fifteen seconds of your three newest videos and scores the hook.
  - title: Check the rhythm
    text: It checks how steady your uploads are, then reads your retention shape if you gave it.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with image upload
      why: It needs to see your thumbnails at small size. Paste transcripts if your AI cannot read video.
    - name: Your retention export from YouTube Studio
      why: It lets the audit check where viewers leave, not just how your packaging looks.
terms:
  - term: Hook
    meaning: The first fifteen seconds of a video, where a viewer decides to stay or leave.
  - term: Retention
    meaning: The share of viewers still watching at each point in a video.
  - term: Feed size
    meaning: How small your thumbnail looks next to other videos in a feed.
