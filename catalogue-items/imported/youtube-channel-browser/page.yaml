new_slug: youtube-channel-browser
name: YouTube channel browser
summary: Give it a channel. Get its latest uploads and a search inside its
  videos. Collects data from websites.
job: grow-social
headline: YouTube channel browser
subhead: Give it a channel. Get its latest uploads and a search inside its
  videos. Collects data from websites. Bring a channel @handle, link or ID. Use
  the result to plan your next step.
explain: |
  Point it at a YouTube channel and see its newest uploads with view counts, or search inside that channel's videos for a topic.

  You can name a channel by its @handle, its link or its ID. The skill turns that into a channel ID, then lists the latest 15 uploads straight from the channel feed, which costs nothing. It can also page through every video and search within one channel's library. You need a TranscriptAPI key. A free key covers a starter set of credits, and some calls use one credit per page. The skill sends a clear user agent header with each request, since the service blocks requests without one.
when:
  - You follow a creator and want a quick list of what they posted lately.
  - You need to find which video in a big channel covers a specific topic.
  - You are researching a competitor's output and want view counts.
  - You want a list of videos to pull transcripts from later.
you_give:
  - A channel @handle, link or ID
  - A search phrase for inside the channel (optional)
  - Your TranscriptAPI key
you_get:
  - The channel's canonical ID
  - The latest 15 uploads with views and dates
  - Search hits inside the channel
  - A full video list if you ask for it
how_to_use:
  - "Add it to your AI once: download it and add the folder to Claude, ChatGPT
    or Codex as a skill."
  - Ask for the job in your own words. Your AI opens the skill when it fits.
  - It works best when your AI can run code and use your TranscriptAPI key.
