thinking: high
thinking_why: It routes across 14 jobs and needs your channel's context.
new_slug: youtube-channel-growth-kit
name: YouTube channel growth kit
summary: "Get a YouTube channel audit, video ideas, scripts, thumbnail briefs and a content calendar. Tell it your niche, size and goal."
job: grow-social
headline: YouTube channel growth kit
subhead: "One front door to a full set of YouTube growth tools. Tell it your niche, your size and your goal, and it sends you to the right one: audit, ideas, hooks, scripts, thumbnails, search, a calendar, Shorts, metrics, repurposing, money, competitors or upload details."
explain: |
  This is a copy of Daniel Agrici's YouTube skill, shared under the MIT licence. What it adds over using one tool alone: it sets your channel type first and passes results from one job to the next, so a plan, a script and a thumbnail brief fit together.

  Before any of that it asks three things: what your channel is about, whether you have under 1K, 1K to 10K, 10K to 100K or over 100K subscribers, and whether your main goal is growth, money, authority or engagement. It sorts your channel into one of nine types and loads a matching template. If your request spans several jobs, such as planning and scripting, it runs them in order and passes each result to the next.
when:
  - You are new to YouTube and want one place that covers the whole process.
  - You need a plan, a script and a thumbnail brief for the same video.
  - You want a content calendar that fits your channel size.
  - You are unsure which part of your channel to fix first.
not_for:
  - "You have one video and no channel plan: ask your AI for a script or a hook on its own, with no kit needed."
  - "You have one metric question, such as why views dropped: paste your numbers into your AI and ask it to explain them."
  - "You want a finished thumbnail image and have no image tool: this kit writes a brief, so send it to a designer."
you_give:
  - Your channel niche in specific terms
  - Your subscriber range
  - Your main goal
  - Your channel link (optional)
you_get:
  - A channel type and matching template
  - Output from the right growth tool for your question
  - Chained results across tools when needed
  - A clear next step
how_to_use:
  - Works best in Claude Code or another AI that can read the whole folder and run code. Download the folder and keep sub-skills, templates and execution beside SKILL.md.
  - In a plain chat (Claude, ChatGPT or Gemini), paste SKILL.md and also attach the sub-skill file for the job you want, such as sub-skills/script.md. The chat cannot run the scripts, so paste your numbers in by hand.
  - "Step 1: tell it your niche, your subscriber range and your main goal. It picks your channel type and template."
  - "Step 2: say the job you want: audit, ideas, hook, script, thumbnail, search, calendar, Shorts, metrics, repurposing, money, competitors or upload details. It runs that sub-skill, or several in order."
  - "Step 3: you get that job's result with a Next Steps list at the end. Check it against your own channel, then follow the next step."
  - "For live data: the scripts need your own YouTube API key. Live keyword data needs a DataForSEO account, a paid service charged per call. Both are optional."
output_sample:
  input:
    - Your channel niche, in specific words
    - Your subscriber range
    - "Your main goal: growth, money, authority or engagement"
    - Your channel link (optional)
  prerequisites:
    - An AI chat such as Claude, ChatGPT or Gemini
    - Your own YouTube API key, only if you want live channel data (optional)
    - A DataForSEO account, only for live keyword data (optional)
    - A NanoBanana image server with your own Gemini API key, only if you want finished thumbnails (optional, may be charged per image)
  output:
    - name: Channel type and template
      contains: Your channel sorted into one of nine types, with the matching template loaded.
    - name: Audit report
      contains: A scored report on search setup, performance, content plan and money, built from four checks.
    - name: Content calendar
      contains: A table of what to post and when, fitted to your channel size.
    - name: Scripts, hooks and thumbnail briefs
      contains: Retention-focused scripts, strong openings and thumbnail briefs for your next videos.
    - name: Video ideas and upload details
      contains: Video ideas, plus titles, descriptions and tags ready to copy and paste.
    - name: Next Steps
      contains: The next tool to use, such as strategy or your lowest-scoring area.
