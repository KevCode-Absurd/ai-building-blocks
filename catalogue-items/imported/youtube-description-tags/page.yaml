thinking: low
thinking_why: It follows a fixed layout and checks it against three searches.
new_slug: youtube-description-tags
name: YouTube description and tags writer
summary: Write a YouTube description and tags built around the searches you want the video to win, with a check that your title matches them.
job: get-found-in-search
headline: YouTube description and tags writer
subhead: Give it your video topic or a transcript. It writes a YouTube description with a strong first two lines, a short honest tag list, and three searches the video should win. Then it checks your title uses those words.
explain: |
  A YouTube description and tag set, built around the searches you want the video to win. People find evergreen videos by typing a question into YouTube or Google, so the words you use in the description matter.

  The first two lines of the description get the most attention. They show before the "more" button and act as the search snippet. So they say what the video gives, in the words a viewer would type. Your link comes next, then chapters, then a longer section on what the video covers and who it is for.

  Tags are a weak signal, so this keeps them to about 15: spellings, tool names and common short forms. Before it hands anything over, it writes three searches the video should win and checks your title and snippet contain those words.
when:
  - You are about to upload and the description box is empty.
  - You want an older, evergreen video to show up when people search.
  - Your tags are a long list of guesses.
  - Nobody finds a video that you know answers a real question.
not_for:
  - You want a title, description, tags and timestamps in one go. Use the YouTube title and tags writer.
  - Your video is meant for people who already subscribe. Use the YouTube title and thumbnail checker, since search matters less there.
  - You need chapters only. Use the YouTube chapter writer.
you_give:
  - The video topic or a transcript
  - The search phrases you hope to rank for (optional)
  - A link or resource to feature in the description (optional)
  - Text from up to three of your past videos, so it can match your voice (optional)
you_get:
  - A description with a strong first two lines
  - A short tag list of about 15, for spellings and tool names only
  - Three searches your video should win
  - A check that your title and first lines use those searches
  - A last question: ship it, or change it?
how_to_use:
  - Open Claude, ChatGPT or Gemini. Add this skill, or paste its instructions into the chat.
  - Paste the video topic or the transcript. Add the search phrases you want and any link you want near the top (optional).
  - If you want your own voice, paste text from up to three past videos. If you skip this, it writes plain, direct text and says so.
  - Read the three searches first. If they are not what a viewer would type, change them and ask again.
  - Check the query check. If a search is missing from your title, change the title. The description cannot fix that.
  - Copy the description and tags into YouTube. You publish; the skill never does.
how_it_works:
  - title: Get the voice
    text: It uses the voice notes you paste, or infers a voice from your past videos. With neither, it writes plainly.
  - title: Write the first two lines
    text: It says what the video gives, in the words a viewer would type, since those lines act as the snippet.
  - title: Add the link and chapters
    text: It puts your link above the fold, then your chapters if you have them.
  - title: Write the long version
    text: It adds what the video covers, who it is for and what it assumes.
  - title: Pick the tags
    text: It keeps about 15 tags for spellings, tool names and short forms, and leaves out unrelated ones.
  - title: Run the query check
    text: It writes three searches the video should win and checks that your title and first lines contain them.
output_shape: |
  Three target searches
  1. <search>
  2. <search>
  3. <search>
  Description
  <first two lines>
  <link or resource>
  <chapters>
  <what is covered, who it is for>
  Tags
  <tag>, <tag>, ... (up to 15)
  Query check
  <search>: title <yes/no>, first lines <yes/no>
  Ship it, or change it?
output_sample:
  input:
    - Your video topic or a transcript
    - The searches you hope to rank for (optional)
    - A link or resource to feature (optional)
    - Text from up to three past videos, to match your voice (optional)
  output:
    - name: Three target searches
      contains: The three searches a viewer would type that this video should win.
    - name: Description
      contains: A copy-ready description, with the first two lines written as the search snippet.
    - name: Tags
      contains: About 15 tags for spellings, tool names and short forms only.
    - name: Query check
      contains: A yes or no for each search, showing whether your title and opening lines use it.
works_best_with:
  tools:
    - {name: "Claude, ChatGPT or Gemini", why: "Any chat AI works. Nothing needs to run and no file access is needed."}
  inputs:
    - "A transcript, so the description matches what you really say"
    - "Search data from YouTube Studio, to pick real phrases (optional)"
terms:
  - term: Snippet
    meaning: The short line of text shown under a video in search results.
  - term: Tags
    meaning: Keywords you add to a video. YouTube treats them as a weak signal, so they only help with spellings and names.
  - term: Evergreen video
    meaning: A video that stays useful for months or years, not one tied to a date.
