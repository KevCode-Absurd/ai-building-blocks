thinking_why: It runs a set tool and cleans the text.
new_slug: youtube-transcript-saver
name: YouTube transcript saver
summary: Save a YouTube transcript as a clean markdown note. Give it one video link and get a searchable file, filed by channel and date.
job: organise-work
headline: YouTube transcript saver
subhead: Give it one YouTube link. It finds the captions, cleans them up and saves them as a markdown note in your notes folder. It prefers captions written by the creator over auto captions.
explain: |
  Paste a YouTube link and get the talk saved as a tidy markdown note in your notes folder, ready to search later.

  A Python script uses the free yt-dlp tool to list the available subtitles and prefers manual ones over auto captions, because manual ones keep punctuation and speaker names. It then strips the timing marks, removes the doubled lines that auto captions produce, and merges the rest into clean paragraphs. The note is filed by channel and date, with title, channel and date at the top. It also scans for words like framework, decision and lesson, and drops a small idea stub for each hit. You need Python and yt-dlp.

  Licence: we share this copy under CC BY 4.0, as the LICENSE-CONTENT file says. The author's own file header (adelaidasofia) says MIT. Credit goes to adelaidasofia and sickn33.
when:
  - You watch long talks and want them in your notes.
  - You want to search across what you have learned from videos.
  - You need a clean transcript, not messy auto captions.
  - You want key ideas from a talk flagged for later writing.
not_for:
  - "You want the video file itself: run yt-dlp on its own with a download option, since this skill only saves text."
  - "You want a whole channel or playlist: run it once per video link, because it takes one video at a time."
  - "The video is a live stream or has no captions: you get no transcript, so use your own audio transcription tool first."
you_give:
  - One YouTube video link
  - The path to your notes folder (optional)
  - Your preferred caption language (optional)
you_get:
  - A clean markdown transcript note
  - A file saved by channel and date
  - A word count and language
  - Idea stubs for key passages
how_to_use:
  - Use an AI that can run code and save files, and make sure Python is installed. Put `ingest.py` (it is in this item's folder) in the folder you will run the commands from.
  - "Install the free yt-dlp tool by running: pip3 install --user yt-dlp"
  - "Run: python3 ingest.py <youtube-url> --vault <path> --lang en,es"
  - Swap in your video link and your notes folder. Change the language codes if you want other captions. To see which languages a video has, run `yt-dlp --list-subs <youtube-url>` first. If the video has none, you get a note with the video details and link, not a transcript.
  - Open the saved note and check that the title, date and text look right.
  - yt-dlp pulls YouTube's own captions, and storing or reusing a transcript may breach YouTube's terms or the creator's copyright. Check the terms before you store one. Then search the notes folder for what you need, or pair the note with youtube-video-summariser.
output_sample:
  input:
    - One YouTube video link
    - The folder where your notes live (optional)
    - Your preferred caption language (optional)
  prerequisites:
    - An AI that can run Python code and save files
    - yt-dlp installed on your computer
    - Internet access
  output:
    - name: Transcript note
      contains: A markdown file with the video title, channel, date, language and word count at the top, then the clean transcript.
    - name: Filing path
      contains: The note is saved under External Inputs, YouTube, then the channel name, named by date and video title.
    - name: Idea stubs
      contains: Small capture notes for passages that mention words like decision, framework, principle or lesson.
    - name: Run summary
      contains: A printed line with the file path, word count, language and subtitle source.
    - name: Metadata stub
      contains: If the video has no captions, a short note with the video details and link instead of a transcript.
