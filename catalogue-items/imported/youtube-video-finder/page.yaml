thinking: low
thinking_why: It runs searches and lists the results.
new_slug: youtube-video-finder
name: YouTube video finder
summary: Find YouTube videos and channels on any topic, sorted by views or date, then pull transcripts for the ones you pick. Needs a free TranscriptAPI key.
job: grow-social
headline: YouTube video finder
subhead: Give it a topic and any filters you want. It searches YouTube and lists matching videos, channels or playlists. Pick the ones you like and it pulls their transcripts so you can read instead of watch.
explain: |
  Name a topic and get matching YouTube videos, channels or playlists, then pull transcripts for the ones you pick.

  It searches YouTube through TranscriptAPI, a service that needs your key and gives a small free allowance. Each search page costs one credit. You can filter by video, channel, playlist or movie, sort by relevance or views, limit to the past hour, day, week, month or year, and set a short, medium or long length. Results come in pages of up to 50. For a recent best-performing video on a subject, you sort by views and filter by month. Then you choose the winners and get their transcripts, which saves you from watching a dozen videos to find two that matter.
when:
  - You are researching a topic and want the best recent videos on it.
  - You need to find channels that cover a niche.
  - You want long tutorials from the past month, sorted by views.
  - You want to read what an expert said instead of watching the whole video.
not_for:
  - "You want to manage a YouTube account, post videos or reply to comments: use YouTube Studio itself, since this only searches."
  - "You want research from written sources only: use a normal web search or Google Scholar."
  - "Your AI cannot run code or reach the internet: ask a person to search YouTube by hand, or paste the video text into your chat."
you_give:
  - A topic or search phrase
  - Filters such as date, length and sort order (optional)
  - A channel name or handle (optional)
  - Your TranscriptAPI key
you_get:
  - A list of videos, channels or playlists, with title, channel, views, age, length and link
  - Transcripts for the videos you pick
  - A count of the credits used
how_to_use:
  - Make a free account at transcriptapi.com. It gives you 100 credits and needs no card. Copy your key.
  - Save the key as TRANSCRIPT_API_KEY in your AI tool. Use an AI that can run code and reach the internet.
  - "Paste this skill into your AI, then say: Search YouTube for your topic, sort by views, past month, top 10."
  - Check the list. Each search page costs 1 credit, and pulling a transcript costs credits too, so check your credit count before you pull many.
  - This searches YouTube through a third-party service. Check YouTube's terms and your own policy before you use the results commercially.
  - Tell your AI which videos you want, and ask for their transcripts.
  - Next, summarise the transcripts with youtube-video-summariser, or use them to plan videos with video-content-planner.
output_sample:
  input:
    - A topic or search phrase
    - Filters such as date, length, sort order or result type (optional)
    - A channel name or handle, to search inside one channel (optional)
    - Your TranscriptAPI key
  prerequisites:
    - An AI that can run code and reach the internet
    - A free TranscriptAPI account and key, saved as TRANSCRIPT_API_KEY
  output:
    - name: Search results
      contains: A list of matching videos, channels, playlists or movies, with title, channel, views, age, length and link.
    - name: Channel results
      contains: Channels that cover your topic, with handle, subscriber count and link, when you search for channels.
    - name: Channel search
      contains: Videos from one channel that match your phrase, when you name a channel.
    - name: Transcripts
      contains: The spoken text of the videos you pick, with timestamps.
    - name: Credits used
      contains: A count of the credits the searches and transcripts cost.
next: [youtube-video-summariser, video-content-planner]
