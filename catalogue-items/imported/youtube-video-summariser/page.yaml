thinking: medium
thinking_why: It reads a long transcript and condenses it.
new_slug: youtube-video-summariser
name: YouTube video summariser
summary: Give it a YouTube link. Get a detailed summary of the talk or lesson,
  taken from its transcript.
job: organise-work
headline: YouTube video summariser
subhead: Give it a YouTube link. Get a detailed summary of the talk or lesson,
  taken from its transcript. Bring a YouTube video link. Use the result to plan
  your next step.
explain: |
  A long, detailed written summary of a YouTube talk, lecture or tutorial, built from its transcript so you do not need to rewatch it.

  The skill first checks that Python and the youtube-transcript-api package are present, and offers to install it if not. It confirms the video can be read, pulls the transcript, and then writes a thorough summary using two frameworks, STAR and RISE, which cover the situation, the key points and the takeaways. It favours completeness over brevity, so it suits reference notes for lectures, courses and technical walkthroughs. It stops with a clear message if captions are off or the video is private. You can then ask follow-up questions about any part of it.
when:
  - You sat through a two-hour lecture and need notes.
  - You want a reference summary of a tutorial for later.
  - You need the key arguments of a talk before a meeting.
  - You want to check if a video is worth watching in full.
you_give:
  - A YouTube video link
  - Python on your computer
  - The aspects you care most about (optional)
you_get:
  - A detailed structured summary
  - The key points and arguments
  - Takeaways to act on
  - A clear error message if the video has no captions
how_to_use:
  - Download the skill folder. Follow the setup steps for your AI tool, or paste
    the instructions into a chat.
  - Ask your AI to follow this skill. Include the files and details listed on
    this page.
  - It works best when your AI can run code and fetch web pages.
