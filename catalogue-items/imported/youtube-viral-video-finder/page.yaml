thinking: medium
thinking_why: It ranks videos by a number, then looks for what they share.
new_slug: youtube-viral-video-finder
name: YouTube viral video finder
summary: Find YouTube viral videos in your niche. It ranks videos by how far they beat their own channel's usual views, so you see ideas that worked.
job: grow-social
headline: YouTube viral video finder
subhead: Name your niche. It reads public YouTube pages and ranks videos that beat their channel's usual views. Bring a list of channels in your niche. Use the result to plan your next step.
explain: |
  A ranked list of videos in your niche that beat their own channel's usual views, so you copy ideas, not channel size.

  Raw view counts only show which channels are big. This skill ranks each video by how many times it beat the median views for its channel. It needs at least four videos per channel, or the median means nothing, and it skips channels that fall short. You collect the data from public listings only, never a logged-in session, using yt-dlp, the public page or a hand-made list. A Python tool then ranks them. You get the top five with their multiples, the title formula each used, what they share, and which one you could make this week.
when:
  - You want video ideas that worked beyond a channel's own audience.
  - You are choosing a topic and want proof it can outperform.
  - You want to learn which title patterns lift views in your niche.
  - You need to pick between several competitor videos to study.
not_for:
  - "Your channel has fewer than four public videos, or you need private numbers: use your own YouTube Studio data instead."
  - "You want to know why your own video did well or badly: use your own YouTube Studio data, since this reads public pages only."
  - "You want a list of channels to study: ask a person in your niche or search YouTube by hand first, then bring the list here."
you_give:
  - A list of channels in your niche
  - Titles, views and links for at least four videos per channel
  - A minimum multiple, such as 2x (optional)
  - Your voice notes (optional)
you_get:
  - The top five videos with their view multiples
  - The title formula behind each
  - The one thing they share
  - The ones you could make this week
how_to_use:
  - Pick five or more channels in your niche. Open each channel's public video list.
  - "Collect at least four videos per channel: the title, views, link and length. Use yt-dlp, copy them by hand, or ask your AI to help."
  - Paste the skill into a chat with an AI that can run Python code (Python 3), then add your list. Keep swipe.py in the same folder as collected.json. The command is python3 swipe.py collected.json --min 2.0, and the 2.0 is your minimum multiple.
  - Check the top five and their multiples. Remember the title formula is a guess about the title, not proof of why it worked.
  - "Pick the video you could make this week. Then answer the last question: ship it, or change it?"
  - Read only public pages, never log in. Check YouTube's terms of service and keep your requests few and slow.
output_sample:
  input:
    - A list of channels in your niche
    - Titles, views and links for at least four public videos per channel
    - A minimum multiple, such as 2x (optional)
  prerequisites:
    - An AI that can run Python code
    - A way to collect public channel listings, such as yt-dlp, the public page or a hand-made list
  output:
    - name: Top five videos
      contains: The five videos that beat their own channel's median views by the most, each with its multiple.
    - name: Title formula
      contains: The title pattern each video used, matched against a set of 21 formulas. It is a guess about the title, not proof.
    - name: Shared trait
      contains: The one structural thing the top videos have in common.
    - name: Make this week
      contains: Which of these you could make this week, in your voice, with what you have.
    - name: Ship or change
      contains: A last question asking whether you want to use the result or change it.
