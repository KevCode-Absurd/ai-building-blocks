thinking: low
thinking_why: It runs simple library requests one after another.
new_slug: zotero-library-manager
name: Zotero library manager
summary: Search, tag, sort and export the references in your Zotero library with a Zotero library manager that runs through Python and the Zotero API.
job: research-topics
headline: Zotero library manager
subhead: Say what to find or tidy in your Zotero library. Get references searched, tagged, sorted or exported as citations. Bring what to find or change in the library. Use the result to plan your next step.
explain: |
  This is a copy of K-Dense's pyzotero skill, shared under the MIT licence. We changed only the name.

  It uses Pyzotero, a Python wrapper for the Zotero web API. You set up your library ID and an API key from your Zotero settings, and store them in environment variables. From there it can read items and collections, search by keyword, add or edit entries, apply tags, move items between collections, and export in citation formats. It can work on your own library or a group library. You need Python, the Pyzotero package and a Zotero account. Be careful with write actions, because they change your real library, so check the plan first.

  The skill text you paste is developer documentation, written for people who code. You do not need to read it. If you want to know what a step does, ask your AI to explain it in plain words first.

  Licence: we share this copy under the MIT licence, as the LICENSE.md file says.
when:
  - Your library has hundreds of untagged papers and you want order.
  - You need a reading list exported as citations.
  - You want to search your references by keyword from a script.
  - You need to add a batch of new references at once.
not_for:
  - "You only want a quick keyword search: use the search box in the Zotero app, it is faster."
  - "You cannot sign in to the library or get an API key: use the Zotero app by hand instead."
  - "You cannot run code in your AI: ask your AI for steps to follow in the Zotero app."
you_give:
  - What to find or change in the library
  - Your Zotero library ID and API key
  - Whether it is a personal or group library
  - Python and the Pyzotero package
you_get:
  - Matching items from your library
  - Tags or collection changes applied
  - Citation exports
  - A plan to review before any write
how_to_use:
  - Get your library ID and make an API key in your Zotero account settings. Say if it is a personal or group library.
  - Open an AI that can run Python code, such as Claude Code. Add the Pyzotero package and keep your key in an environment variable, not in the chat. If your AI cannot run Python, use the Zotero app's own search, tags and export instead.
  - Paste this skill and say what to find or tidy, such as tagging untagged papers or exporting a reading list.
  - Before any write, ask your AI to list every tag, move and new entry it plans, with each item's title and Zotero item key, and to wait for your yes. Match each line to a real item and fix the plan first, because writes change your real library.
  - Approve the plan to apply it, then save the exported citations where you need them.
  - Next, import the exported BibTeX into your word processor or reference manager, and clean up any broken entries with citation-and-bibtex-fixer.
output_sample:
  input:
    - What you want to find or change in your library
    - Your Zotero library ID
    - Your Zotero API key
    - Whether it is a personal or group library
  prerequisites:
    - An AI that can run Python code
    - Python and the Pyzotero package
    - A Zotero account and API key from your Zotero settings
  output:
    - name: Matching items
      contains: The references that fit your request, with title and item type.
    - name: Proposed changes
      contains: The tags, collection moves or new entries it plans to make, shown for your review.
    - name: Write result
      contains: Which items were created or changed after you approve. Any that failed are listed apart, and only those are retried after you review them.
    - name: Citation export
      contains: Your chosen references as BibTeX or another citation format.
next: [citation-and-bibtex-fixer, literature-review-finder]
