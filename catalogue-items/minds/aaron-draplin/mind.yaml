  - {n: 5, title: "Aaron Draplin on hard work, keeping things small and fun, and his honest design process", by: "Katy Cowan, Creative Boom (2016 interview)", url: "https://www.creativeboom.com/work/aaron-draplin-on-hard-work-keeping-things-small-and-fun-and-his-honest-design-process/", kind: own-words}
  - {n: 6, title: "Catching up with founder of Draplin Design Co: Aaron James Draplin", by: "Adobe Blog (2017 interview)", url: "https://blog.adobe.com/en/publish/2017/01/09/catching-up-with-founder-of-draplin-design-co-aaron-james-draplin", kind: own-words}
