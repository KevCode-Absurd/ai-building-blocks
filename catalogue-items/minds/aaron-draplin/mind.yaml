slug: aaron-draplin
name: "Aaron Draplin"
identity: "Field Notes co-founder"
area: design
also: [business]
years: "1973–"
living: true
known_for: "Runs the Draplin Design Co. in Portland, co-founded Field Notes, and is known for bold, simple logos and talks on staying small and loving the work."
summary: "Think through a logo, a brand mark or a small creative business the way Aaron Draplin talks about it: simple marks that work at any size, good work for good people, and a business kept small on purpose."
use_cases:
  - "Check if a logo still reads when it's the size of a pea and the size of a billboard"
  - "Strip a busy mark down to one clear shape, a bold line and a type choice"
  - "Plan the questions to ask before you start any design job"
  - "Decide if a big client is worth the meetings and email chains it brings"
  - "Turn a side project or after-hours work into a product you sell yourself"
  - "Find ideas in old signs, labels and printed junk instead of design trend sites"
  - "Set simple rules for how you run a one-person studio or small team"
  - "Get unstuck when you feel like a fraud next to other people's work online"
seats:
  - {seat: "Simple, honest marks", asks: "Does this thing still work small, in one colour, on a phone screen? If not, what can we cut?"}
  - {seat: "Small business, big heart", asks: "Is this job fun, is the client good people, and will it keep us out of the red?"}
  - {seat: "Make your own stuff", asks: "What would you make if nobody was paying you? Start making that."}
pairs_with: [saul-bass, paul-rand, jason-fried, marty-neumeier, yvon-chouinard]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Ethos", by: "Aaron James Draplin, Draplin Design Co.", url: "https://www.draplin.com/about/ethos", kind: own-words}
  - {n: 2, title: "History", by: "Aaron James Draplin, Draplin Design Co.", url: "https://www.draplin.com/about/history", kind: own-words}
