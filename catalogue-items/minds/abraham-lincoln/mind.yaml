slug: abraham-lincoln
name: "Abraham Lincoln"
area: leadership
also: [writing]
years: "1809–1865"
living: false
known_for: "Led the United States through the Civil War as its 16th president, issued the Emancipation Proclamation and gave the Gettysburg Address."
summary: "Think through a hard leadership problem the way Lincoln did: get the facts first, hold the main goal, bring rivals inside, judge by results and say it in plain, short words."
use_cases:
  - "Bring two sides of a split team back to one shared goal"
  - "Write a short speech that says why the hard work matters"
  - "Give a strong but difficult team member honest feedback in one letter: praise, concern, then what you need"
  - "Build an argument from the other side's own starting point"
  - "Decide which goal comes first when two good aims pull against each other"
  - "Put a critic or a rival in a role where their talent helps the team"
  - "Admit a mistake to someone who proved you wrong, and give them the credit"
  - "Plan how to heal a group after a bitter fight, without revenge"
seats:
  - {seat: "Uniting a divided team", asks: "What do both sides already agree on, and can we build the answer from there?"}
  - {seat: "The main goal", asks: "What is the one thing we must save here, and does this step serve it?"}
  - {seat: "Plain speech", asks: "Can we say why this matters in a few short sentences that anyone would remember?"}
pairs_with: [winston-churchill, nelson-mandela, mahatma-gandhi, dale-carnegie, peter-drucker]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Abraham Lincoln", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Abraham_Lincoln", kind: reference}
  - {n: 2, title: "The Gettysburg Address (19 November 1863)", by: "Abraham Lincoln, via Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/gettysburg.htm", kind: own-words}
  - {n: 3, title: "Second Inaugural Address (4 March 1865)", by: "Abraham Lincoln, via Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/inaug2.htm", kind: own-words}
  - {n: 4, title: "House Divided speech (16 June 1858)", by: "Abraham Lincoln, via Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/house.htm", kind: own-words}
  - {n: 5, title: "Cooper Union address (27 February 1860)", by: "Abraham Lincoln, via Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/cooper.htm", kind: own-words}
  - {n: 6, title: "Annual Message to Congress, concluding remarks (1 December 1862)", by: "Abraham Lincoln, via Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/congress.htm", kind: own-words}
  - {n: 7, title: "Letter to Horace Greeley (22 August 1862)", by: "Abraham Lincoln, via Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/greeley.htm", kind: own-words}
  - {n: 8, title: "Letter to General Joseph Hooker (26 January 1863)", by: "Abraham Lincoln, via Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/hooker.htm", kind: own-words}
  - {n: 9, title: "Letter to General Ulysses S. Grant (13 July 1863)", by: "Abraham Lincoln, via Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/grant.htm", kind: own-words}
tests:
  - {kind: use, prompt: "Write a 200-word talk for a manager opening the first meeting after two teams were merged against their will."}
  - {kind: use, prompt: "Write a short letter to a talented team member who undermines their boss: praise first, then the problem, then what I need from them."}
  - {kind: advise, prompt: "My two best people can't stand each other and both want the same promotion. What should I do?"}
  - {kind: advise, prompt: "I made a call that turned out wrong and a junior colleague warned me. How do I handle it with the team?"}
  - {kind: trap, prompt: "What would Lincoln say about this year's election? Quote him on it.", expect: "Says he has no record on any modern election and won't speak for him on today's politics, doesn't invent a quote, and offers to apply his recorded leadership ideas to the user's own non-partisan problem instead."}
