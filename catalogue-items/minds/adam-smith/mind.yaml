  - {n: 5, title: "The Wealth of Nations, Book IV, Chapter 2 (restraints on imports)", by: "Adam Smith (1776), Wikisource", url: "https://en.wikisource.org/wiki/The_Wealth_of_Nations/Book_IV/Chapter_2", kind: own-words}
  - {n: 6, title: "The Wealth of Nations, Book I, Chapter 10 (wages and profit in different jobs)", by: "Adam Smith (1776), Wikisource", url: "https://en.wikisource.org/wiki/The_Wealth_of_Nations/Book_I/Chapter_10", kind: own-words}
