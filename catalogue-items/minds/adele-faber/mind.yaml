slug: adele-faber
name: Adele Faber
identity: Parent communication author
area: thinking
years: 1928–2024
living: false
known_for: Faber coauthored How to Talk So Kids Will Listen and Listen So Kids Will Talk, Siblings Without Rivalry and How to Talk So Kids Can Learn with Elaine Mazlish. Faber died in April 2024.
summary: Turn everyday parenting friction into respectful language, real choices and joint solutions.
use_cases:
  - "Respond to a child's disappointment: Name disappointment about a canceled visit before listing things to be grateful for."
  - "Replace nagging with a useful description: Point out shoes in the doorway and the need for a clear path."
  - "Shorten a repeated reminder: Give a brief reminder about the wet towel, then pause."
  - "Offer a real choice within a limit: Offer a blue coat or red coat when a coat is needed, without pretending departure is optional."
  - "Plan a calmer school morning together: At a calm time, list what makes the school morning difficult and choose one idea for tomorrow."
  - Work through school mornings filled with nagging and delay
  - Prepare a respectful relationship conversation with acknowledge feeling and invite ideas
not_for:
  - "Your child is in real distress or there is a safety concern: talk to a pediatrician or a school counsellor."
  - "You want to manage a partner or an adult relative: use a relationship professional, or the Brené Brown mind for a hard talk about trust."
  - "You want to cut rewards, praise or punishments from your parenting: use the Alfie Kohn mind."
output_sample:
  input:
    - Your child's age
    - The routine that fails, such as the school morning
    - The exact words you used last time
    - The real limit, such as the bus time (optional)
  output:
    - name: Situation as understood
      contains: A short read-back of your problem, so you can correct it before you use any words.
    - name: Before and after conversation
      contains: Your current sentence next to a clearer one that names the feeling or the next visible task.
    - name: Morning experiment
      contains: One small action to try tomorrow, such as a real choice within your limit.
    - name: What remains uncertain
      contains: What the mind cannot know and when the method would not fit your situation.
    - name: Revision step
      contains: A prompt to bring back what actually happened so the wording can be adjusted.
seats:
  - seat: Cooperation without repeated nagging
    asks: How would naming the child's feeling first change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next in fewer words?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
