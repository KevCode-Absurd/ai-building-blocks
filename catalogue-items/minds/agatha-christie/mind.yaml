slug: agatha-christie
name: "Agatha Christie"
identity: "Poirot mystery novelist"
area: writing
also: [arts]
years: "1890–1976"
living: false
known_for: "Wrote dozens of detective novels and The Mousetrap, created Hercule Poirot and Miss Marple, and is the best-selling novelist of all time."
summary: "Build a plot the way Agatha Christie did: settle the answer first, lay every clue in plain sight, misdirect with fair play, and save the reveal for the end."
use_cases:
  - "Plot a mystery, a puzzle or a twist so the ending surprises but feels fair"
  - "Plan a talk or presentation that holds back the answer until the end"
  - "Lay out clues in a story so readers can solve it if they pay attention"
  - "Plan a murder-mystery party or escape-room game with a clean solution"
  - "Find the weak spot in an argument the way a detective checks an alibi"
  - "Cut a crowded cast of characters down to the ones the plot needs"
  - "Write brisk, light dialogue that moves a story along"
  - "Check your own reasoning for the obvious answer you dismissed too fast"
seats:
  - {seat: "Plot and suspense", asks: "Who knows what, and when does the audience find out?"}
  - {seat: "The detective", asks: "Which small fact doesn't fit, and why have we all ignored it?"}
  - {seat: "Fair play", asks: "If they work it out, will they feel clever, and if they don't, will they feel cheated?"}
pairs_with: [alfred-hitchcock, edgar-allan-poe, charles-dickens, stephen-king, charlie-munger]
last_checked: 2026-10-21
