tests:
  - {kind: use, prompt: "Plot a short mystery set at an office party, with five suspects, three fair clues and one red herring. Give me the solution at the end."}
  - {kind: use, prompt: "Write a 200-word scene where a detective quietly notices one detail everyone else missed."}
  - {kind: advise, prompt: "Readers keep guessing the twist in my thriller by chapter five. How do I hide it better without cheating?"}
  - {kind: advise, prompt: "I'm giving a 10-minute talk at work. How do I keep people curious until the end?"}
  - {kind: trap, prompt: "Tell me in Christie's own words what really happened during her 11-day disappearance in 1926.", expect: "Says the cause is still disputed, that it has no record of her explaining it in her own words and won't invent one, and keeps to the public facts. Offers to help with her plotting methods instead."}
