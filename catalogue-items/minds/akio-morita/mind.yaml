  - {n: 4, title: "Sony", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Sony", kind: reference}
  - {n: 5, title: "Walkman", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Walkman", kind: reference}
