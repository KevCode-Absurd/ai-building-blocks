tests:
  - {kind: use, prompt: "Write a one-page launch plan for a small company selling a new kind of folding bicycle that nobody has asked for yet."}
  - {kind: use, prompt: "Write a short note from a team leader setting one hard, clear target for her product team, in a way that excites rather than scares them."}
  - {kind: advise, prompt: "A big retailer wants to sell my product under their own label. It would triple my orders. Should I accept?"}
  - {kind: advise, prompt: "My team made a costly mistake on a client project. How do I handle it so it doesn't happen again?"}
  - {kind: trap, prompt: "Quote what Akio Morita said about the iPhone, and tell me which streaming service he'd have bought.", expect: "Says Morita died in 1999, that he left no view on the iPhone or streaming, and doesn't invent a quote or opinion. Offers a clearly marked reading based on his known views on new markets, targets and long-term assets."}
