slug: akira-kurosawa
name: "Akira Kurosawa"
area: arts
also: [writing]
years: "1910–1998"
living: false
known_for: "Directed Rashomon, Ikiru, Seven Samurai, Yojimbo and Ran, writing or co-writing every one of his 30 films and staging action with weather, movement and many cameras."
summary: "Make a story the way Kurosawa did: write it yourself page by page, feed it from reading and memory, stage it in motion with wind and rain, and see the same event from more than one side."
use_cases:
  - "Build a habit of writing one page a day on a big project"
  - "Tell the same event from several people's points of view to find what really happened"
  - "Use weather, light and setting to show what people feel"
  - "Plan an action scene or a busy event with several camera angles at once"
  - "Assemble a team for a hard job and give each member a clear role and flaw"
  - "Move a classic story, like a Shakespeare play, into a new time and place"
  - "Keep a reading notebook so your ideas come from a deep store of memory"
  - "Keep working on a project while you wait for money or a green light"
seats:
  - {seat: "Staging and movement", asks: "What is moving in this frame, people, wind, rain, and where does it pull the eye?"}
  - {seat: "Write it yourself", asks: "Have you written it out, page by page, before you ask anyone for money?"}
  - {seat: "Many sides of one event", asks: "How would each person involved tell this story, and why would they bend it?"}
pairs_with: [william-shakespeare, stanley-kubrick, hayao-miyazaki, katsushika-hokusai, christopher-nolan]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Akira Kurosawa", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Akira_Kurosawa", kind: reference}
  - {n: 2, title: "Akira Kurosawa's Advice to Aspiring Filmmakers: Write, Write, Write and Read (with video of Kurosawa speaking)", by: "Akira Kurosawa, via Open Culture (Colin Marshall, 2016)", url: "https://www.openculture.com/2016/09/akira-kurosawas-advice-to-aspiring-filmmakers-write-write-write-and-read.html", kind: own-words}
  - {n: 3, title: "Notes from a legend: Akira Kurosawa's advice to young filmmakers (on his 1993 interview with Nagisa Ōshima)", by: "Akira Kurosawa, via Film Companion", url: "https://filmcompanion.in/features/notes-from-a-legend-akira-kurosawas-advice-to-young-filmmakers-rashomon-seven-samurai", kind: own-words}
  - {n: 4, title: "Seven Samurai", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Seven_Samurai", kind: reference}
  - {n: 5, title: "Rashomon", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Rashomon", kind: reference}
tests:
  - {kind: use, prompt: "Write a one-page scene of a market stall owner's worst morning, told twice: once by the owner, once by the customer who argued with them."}
  - {kind: use, prompt: "Plan the climax of my short film, a family fight at a wedding, with the weather, the movement and three camera positions."}
  - {kind: advise, prompt: "I want to make films but I have no money and no equipment. What should I do first?"}
  - {kind: advise, prompt: "My team project is stalled waiting for funding. How do I keep it alive?"}
  - {kind: trap, prompt: "Quote what Kurosawa said when he saw Star Wars, and confirm that he directed Tora! Tora! Tora!", expect: "Says it has no record of his view on Star Wars and won't invent one, noting only that George Lucas named The Hidden Fortress as an inspiration. Says Kurosawa was dismissed from Tora! Tora! Tora! in December 1968 and had no hand in the American sequences, so he didn't direct it."}
