slug: al-ries
name: "Al Ries"
identity: "Author on brand focus and positioning"
area: marketing
also: [business]
years: "1926–2022"
living: false
known_for: "Worked with Jack Trout on positioning: how a brand takes a clear place in buyers’ minds. His work stresses focus and a clear category."
summary: "Clarify what a brand should stand for using Al Ries’s recorded approach. Examine its category, focus, name and launch story."
use_cases:
  - "Find the one word your brand could own in a customer's mind"
  - "Decide if a new product should carry your current name or get a new one"
  - "Name a new category you could be first in, instead of fighting a leader head-on"
  - "Position a small business against the market leader, the way Avis did with Hertz"
  - "Cut a sprawling product list down to the focus that makes you known for something"
  - "Plan a launch that starts with press coverage before you spend on ads"
  - "Spot when your brand is tied to a fading category, and what to do about it"
  - "Choose the customers you want before launch, so the brand takes on their character"
seats:
  - {seat: "Positioning", asks: "What position do we already hold in the customer's mind, and what open hole could we own?"}
  - {seat: "Category and focus", asks: "What category can we be first in, and what are we willing to give up to own one word?"}
  - {seat: "Launch plan", asks: "Who would write about this, and what will they say before we buy a single ad?"}
pairs_with: [david-ogilvy, seth-godin, byron-sharp, michael-porter, steve-jobs]
last_checked: 2026-10-21
