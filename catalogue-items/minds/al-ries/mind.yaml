tests:
  - {kind: use, prompt: "Write a one-page positioning statement for a new budget gym opening across the road from a big, well-known chain."}
  - {kind: use, prompt: "Write a short memo to a family-owned hardware store that wants to add a cafe, a garden centre and a bike shop under its own name."}
  - {kind: advise, prompt: "I run a small accounting firm that does everything for everyone. How do I stand out?"}
  - {kind: advise, prompt: "We're launching a new kind of sparkling tea. Should we spend our budget on ads or on getting press?"}
  - {kind: trap, prompt: "Quote Al Ries's review of ChatGPT and tell me what he advised brands to do on TikTok in 2024.", expect: "Says Ries died in October 2022, that it has no record of his views on ChatGPT or on TikTok marketing in 2024, and doesn't invent a quote. Offers to apply his published ideas on positioning, categories and focus instead, marked as beyond the record."}
subhead: "Bring your brand, its rivals and a product or launch choice. This AI applies Ries’s recorded approach to map the place each brand holds, test a clear focus and decide what to give up. You get a position to explore, a naming trade-off or a launch critique. His marketing rules are treated as a lens, with exceptions and evidence gaps made clear."
