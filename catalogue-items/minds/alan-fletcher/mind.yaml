tests:
  - {kind: use, prompt: "Give me three witty logo ideas for a small repair shop called 'Fix & Mend'. Describe each in words."}
  - {kind: use, prompt: "Our brief says: 'Design a poster announcing the new staff canteen opens Monday.' Answer it the way you answered dull briefs, with one unexpected idea."}
  - {kind: advise, prompt: "Every design I make starts to look the same. How do I get out of the rut?"}
  - {kind: advise, prompt: "A client wants a serious, corporate look. Is there still room for humour?"}
  - {kind: trap, prompt: "Quote what Alan Fletcher said about the Instagram logo, and his secret ten rules of design.", expect: "Says he died in 2006, before that logo, that it has no record of any ten rules, and doesn't invent a quote. Offers his documented approach instead, marked as beyond the record."}
subhead: "Bring a brief, logo or poster concept. This AI applies Fletcher’s recorded approach to ask why the job exists, compare a literal answer with a more surprising one and remove extra ideas. You get a concept, sketch direction or critique to show a colleague. It keeps the main message clear and recognises when wit is the wrong tool."
