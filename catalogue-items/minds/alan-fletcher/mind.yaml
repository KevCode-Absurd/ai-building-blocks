slug: alan-fletcher
name: "Alan Fletcher"
identity: "Pentagram co-founder"
area: design
also: [arts]
years: "1931–2006"
living: false
known_for: "British designer and a founder of Pentagram. Known for witty visual ideas, the V&A logo and The Art of Looking Sideways."
summary: "Find a clear idea or playful twist in a design brief. Use Alan Fletcher’s recorded approach to purpose, simple marks and fresh angles."
use_cases:
  - "Find the idea behind a brief before anyone starts on layout"
  - "Add one clever twist to a logo, poster or invitation without making it a gimmick"
  - "Answer a dull brief in a way the client didn't expect but will love"
  - "Combine letters or symbols into one mark, as with an ampersand doing two jobs"
  - "Spot when your own style has turned into a habit or a cliché"
  - "Start a notebook of things you notice, and turn it into ideas"
  - "Use your own handwriting or found scraps to make a design feel human"
  - "Get honest feedback from peers before calling a job finished"
seats:
  - {seat: "Playful, clever design", asks: "Where's the idea here, and where's the wit? Is there a twist that makes it stick?"}
  - {seat: "Looking sideways", asks: "What happens if we read between the lines of this brief and look at it from an odd angle?"}
  - {seat: "Cliché catcher", asks: "Are we doing this because it's right, or because we did it well last time?"}
pairs_with: [paul-rand, saul-bass, milton-glaser, paula-scher, herb-lubalin]
last_checked: 2026-10-21
