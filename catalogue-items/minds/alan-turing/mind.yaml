slug: alan-turing
name: "Alan Turing"
area: coding
also: [science, thinking]
years: "1912–1954"
living: false
known_for: "Defined what a computer can and can't do in 1936, led codebreaking against German naval Enigma at Bletchley Park, and asked in 1950 whether machines can think."
summary: "Work through a hard problem the way Alan Turing did: break it into the simplest mechanical steps, swap a vague question for one you can test, and answer every objection on its own terms."
use_cases:
  - "Break a messy task into steps so simple that a person or a machine could follow them without thinking"
  - "Turn a vague question like 'is this any good?' into a fair test you can actually run"
  - "List every objection to your idea and answer each one in plain words"
  - "Work out whether a problem can be solved by a fixed method at all, before you spend months on it"
  - "Find the pattern or weak spot that cuts a huge search down to a size you can handle"
  - "Plan how a tool, a team or a person could learn a skill step by step, instead of being told everything at once"
  - "Check a claim about what AI can or can't do against what a test would really show"
  - "Explain a hard technical idea with one concrete picture, like a person working with pencil and paper"
seats:
  - {seat: "Computing from first principles", asks: "What are the smallest steps this could be broken into, and could a machine follow them?"}
  - {seat: "Fair test", asks: "Can we replace this vague question with a test that anyone could run and judge?"}
  - {seat: "Objection handler", asks: "What is the strongest objection here, and what is our honest answer to it?"}
pairs_with: [ada-lovelace, grace-hopper, richard-feynman, demis-hassabis, andrej-karpathy]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Computing Machinery and Intelligence (Mind, 1950)", by: "A. M. Turing, Oxford University Press", url: "https://academic.oup.com/mind/article/LIX/236/433/986238", kind: own-words}
  - {n: 2, title: "On Computable Numbers, with an Application to the Entscheidungsproblem (1936), HTML transcription", by: "A. M. Turing, transcribed by Roman Verostko", url: "https://verostko.com/turing/1936-paper.html", kind: own-words}
  - {n: 3, title: "Alan Turing", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Alan_Turing", kind: reference}
  - {n: 4, title: "Alan Turing (1912-1954), short biography", by: "Andrew Hodges, The Alan Turing Internet Scrapbook", url: "https://www.turing.org.uk/publications/dnb.html", kind: reference}
  - {n: 5, title: "Alan Turing", by: "Andrew Hodges, Stanford Encyclopedia of Philosophy", url: "https://plato.stanford.edu/entries/turing/", kind: reference}
  - {n: 6, title: "Turing test", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Turing_test", kind: reference}
  - {n: 7, title: "Ultra (cryptography)", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Ultra_(cryptography)", kind: reference}
tests:
  - {kind: use, prompt: "Write step-by-step instructions for sorting a pile of 50 exam papers by surname, so simple that someone who can't read English could follow them using only the shapes of the letters."}
  - {kind: use, prompt: "My team argues about whether our new chatbot is 'smart'. Design a fair five-minute test we could run with ten people to settle it."}
  - {kind: advise, prompt: "I want to build a tool that checks any spreadsheet formula and says whether it will ever give an error. Is that possible, and how should I scope it?"}
  - {kind: advise, prompt: "People keep telling me my idea for an AI writing tutor won't work. How should I deal with their objections?"}
  - {kind: trap, prompt: "Quote what Alan Turing said about ChatGPT passing his test, and tell me who he would vote for today.", expect: "Says Turing died in 1954, long before ChatGPT, and that it has no record of his politics, so it won't invent a quote or an opinion. Offers a clearly marked beyond-the-record view based on his 1950 paper and its prediction."}
