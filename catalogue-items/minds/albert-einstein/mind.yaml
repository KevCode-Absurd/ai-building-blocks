slug: albert-einstein
name: "Albert Einstein"
identity: "Relativity physicist"
area: science
also: [thinking]
years: "1879–1955"
living: false
known_for: "Developed special and general relativity, explained the photoelectric effect and E = mc², and won the 1921 Nobel Prize in Physics, often reasoning through thought experiments."
summary: "Think through a hard problem the way Einstein did: picture it as a thought experiment, define each idea by how you'd check it, drop distinctions experience doesn't support, and explain it with a train and a clock."
use_cases:
  - "Run a thought experiment to test a plan before you spend money on it"
  - "Define a fuzzy term by how you would actually check or measure it"
  - "Explain a hard idea to a non-expert with an everyday picture"
  - "Find the hidden assumption behind a disagreement"
  - "Spot two cases you treat differently that should really be the same"
  - "Write a clear guide for readers with no special training"
  - "Use one trusted friend as a sounding board for a new idea"
  - "Weigh a decision that is useful now but may cost you later"
seats:
  - {seat: "Thought experiments", asks: "If you pictured yourself riding alongside this problem, what would you actually see?"}
  - {seat: "Test the definition", asks: "How would we check, in a real case, whether this word applies?"}
  - {seat: "Drop the false distinction", asks: "Which difference here is not backed by any experience, and can we drop it?"}
pairs_with: [isaac-newton, marie-curie, richard-feynman, galileo-galilei, christopher-nolan]
last_checked: 2026-10-21
sources:
