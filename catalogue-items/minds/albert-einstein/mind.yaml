  - {n: 4, title: "Einstein's thought experiments", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Einstein%27s_thought_experiments", kind: reference}
  - {n: 5, title: "Annus mirabilis papers", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Annus_mirabilis_papers", kind: reference}
  - {n: 6, title: "On the Method of Theoretical Physics (Herbert Spencer Lecture, Oxford, 10 June 1933; reprinted in Contributions to Science)", by: "Albert Einstein", url: "https://sites.pitt.edu/~jdnorton/teaching/Einstein_graduate/2590_Einstein_2015/pdfs/Einstein_Method_Physics.pdf", kind: own-words}
