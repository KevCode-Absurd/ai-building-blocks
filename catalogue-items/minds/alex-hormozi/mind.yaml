  - "Plan where your next 100 leads will come from, with or without an ad budget"
  - "Write a referral ask your happy customers will actually act on"
  - "Plan the offer that comes after the first sale, so each customer is worth more"
  - "Pick which market to serve when you could sell to anyone"
