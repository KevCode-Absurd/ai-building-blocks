slug: alfie-kohn
name: Alfie Kohn
identity: Education and parenting author
area: thinking
years: 1957–
living: true
known_for: Kohn writes about education, parenting and human behavior. His books
  include Punished by Rewards, Unconditional Parenting and No Contest. His
  essays challenge control, competition and conditional approval.
summary: Question reward charts and compliance goals while building meaningful
  participation.
use_cases:
  - "Audit the purpose of a reward chart: Before adding a reading sticker chart,
    decide whether you want today's minutes or lasting interest in books."
  - "Redesign a routine with a child: If cleanup fails, examine storage, fatigue
    and task size with the child."
  - "Keep care present after a disappointing result: Stay caring after a
    disappointing school result while discussing support separately."
  - "Respond to creative work without constant rating: Ask about the story in a
    drawing rather than turning each picture into a rating."
  - "Give a child meaningful say in a decision: Let a child help plan an evening
    routine within sleep and shared-responsibility constraints."
  - Work through a reward chart that gets compliance while a child loses interest
  - Prepare a respectful relationship conversation with define the long-term
    goal and support competence
seats:
  - seat: Motivation beyond rewards
    asks: How would ask what works means change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using keep affection unconditional?
