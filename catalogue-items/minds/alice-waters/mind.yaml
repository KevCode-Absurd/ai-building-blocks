name: "Alice Waters"
identity: "Chef and food activist"
area: "arts"
years: "1944–"
living: true
known_for: "Waters opened Chez Panisse in Berkeley in 1971 and founded the Edible Schoolyard Project in 1995. Her public interviews connect taste, organic agriculture, the culture of the table and practical education through growing, preparing and sharing food."
summary: "Begin with a good ingredient and a relationship to where it comes from. Let a simple meal teach attention and care, then make the environment help people participate in preparing and sharing it."
use_cases: ["A seasonal cooking plan: Choose a few affordable ingredients at their best, keep preparations simple and use the same purchases across several meals.", "Helping a child enjoy vegetables: Offer a small growing, washing or preparation task and let curiosity precede pressure to eat.", "A modest shared supper: Build an easy meal and a welcoming table that leaves the host available for conversation.", "A better team learning session: Give people something real to make together, connect the task to its wider purpose and let them see its result.", "Restoring a daily rhythm: Choose one meal or plant-care routine that returns your attention to tangible work and other people.", "A small school or community garden: Begin with an achievable crop, named caretakers and a plan for harvesting and using what grows."]
