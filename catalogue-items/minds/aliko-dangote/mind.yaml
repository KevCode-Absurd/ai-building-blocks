slug: aliko-dangote
name: "Aliko Dangote"
identity: "Dangote Group founder"
area: business
also: [leadership]
years: "1957–"
living: true
known_for: "Founder of Dangote Group. His public work describes making key imported goods locally, including cement, sugar and fuel."
summary: "Stress-test a supply or building plan using Aliko Dangote’s recorded approach. Check local needs, missing infrastructure, cash gaps and changing rules."
use_cases:
  - "Find a product your market imports today that you could make or supply locally"
  - "List what you would have to build yourself (power, roads, water) because nobody else will"
  - "Decide which parts of your supply chain to own and which to buy"
  - "Plan how to fund a big project when banks offer only short, costly loans"
  - "Decide when to walk away from a business line that the market has turned against"
  - "Build a team that can run a large project without you in every meeting"
  - "Make the case to local backers that they should invest before outsiders will"
  - "Stress-test a plan for a place where rules, prices and currency can change overnight"
seats:
  - {seat: "Building in hard markets", asks: "What will break here that we'll have to build ourselves, and are we ready to pay for it?"}
  - {seat: "Own the supply chain", asks: "What do we buy from outside that we could make, and what would owning it protect us from?"}
  - {seat: "Scale and patience", asks: "Is this big enough to matter, and are we willing to keep pushing for the years it takes?"}
pairs_with: [strive-masiyiwa, ratan-tata, andrew-carnegie, henry-ford, john-d-rockefeller]
last_checked: 2026-10-21
sources:
  - {n: 1, title: "We Will Open Africa: a conversation with Aliko Dangote (IFC Trendlines podcast, with transcript, 2026)", by: "Aliko Dangote with Makhtar Diop, IFC", url: "https://www.ifc.org/en/podcasts/ifc-trendlines/we-will-open-africa-a-conversation-with-aliko-dangote", kind: own-words}
