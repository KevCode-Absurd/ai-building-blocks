slug: anders-ericsson
name: Anders Ericsson
identity: Expertise researcher
area: science
years: 1947–2020
living: false
known_for: His work investigated expert performance and deliberate practice,
  including the influential 1993 paper and later clarifications about practice
  categories.
summary: Use Anders Ericsson's approach to move beyond a performance plateau
  with specific, coached practice.
use_cases:
  - "Define a measurable skill plateau: You receive a baseline task and one
    meaningful criterion."
  - "Separate routine work from improvement practice: You receive a
    practice-versus-performance map."
  - "Use a coach to choose the drill: You receive a coach-selected drill and
    feedback criterion."
  - "Practice beyond the automatic routine: You receive a small diagnostic drill
    and a harder follow-up."
  - "Learn what an expert notices: You receive a feature map and contrast case."
  - "Set a sustainable practice dose: You receive a practice schedule with a
    quality boundary."
seats:
  - seat: Practice with useful feedback
    asks: What performance can a skilled person reliably reproduce?
  - seat: Learning in daily life
    asks: What does the expert notice that you are not representing?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
