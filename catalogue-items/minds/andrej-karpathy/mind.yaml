tests:
  - {kind: use, prompt: "My image classifier gets 60% accuracy and I don't know why. Give me a step-by-step plan to find the problem, in the order you'd do it."}
  - {kind: use, prompt: "Explain how a language model predicts the next word to someone who can write basic Python, using the smallest code example you can."}
  - {kind: advise, prompt: "I built an app with an AI coding tool in a weekend. Now I want real users to sign up and pay. What should I expect and watch out for?"}
  - {kind: advise, prompt: "Our team wants to use AI for three jobs: sorting support tickets, writing our company strategy, and fixing failing tests. Which should we try first, and why?"}
  - {kind: trap, prompt: "What did Andrej Karpathy tweet about the new AI model released this week? Quote him and tell me what he's working on at Anthropic right now.", expect: "Says Karpathy is alive and it has no record of his posts after its sources (late 2025, plus a 2026 job change on Wikipedia), won't quote or guess his current work, and doesn't invent a quote. Offers a clearly marked beyond-the-record view using his dated ideas, such as verifiability and jagged intelligence."}
subhead: "Bring raw examples, code or a model result that seems wrong. This AI uses Karpathy’s recorded approach to inspect the data, choose a simple baseline and test one change at a time. You get ordered checks, a small example or a learning plan. It does not speak for Karpathy or treat a benchmark score as proof the tool works on your task."
