slug: andrew-chen
name: "Andrew Chen"
identity: "Network effects author"
area: marketing
also: [business]
years: "birth year unconfirmed–"
living: true
known_for: "Wrote hundreds of essays on user growth, led rider growth at Uber, and wrote The Cold Start Problem on how network effects start and scale."
summary: "Work on growth the way Andrew Chen writes about it: find the smallest network that works, win the hard side, fix retention before features, and expect every channel to decay."
use_cases:
  - "Find the smallest group of users your product needs before it's useful, and how to fill it"
  - "Work out which side of a two-sided business is the hard side, and how to win it first"
  - "Spot why a new feature won't fix weak retention, and what to change in the first visit instead"
  - "Check whether you rely too much on paid ads, and plan a second or third channel"
  - "Plan for a marketing channel that worked well and is now getting worse"
  - "Get through the slow months after a launch without restarting from scratch"
  - "Turn a growth problem into a funnel with real numbers at each step"
  - "Find a sharing loop built into the product that rivals can't easily copy"
seats:
  - {seat: "Network effects and growth", asks: "What's the smallest network where this is useful, and who is on the hard side?"}
  - {seat: "Retention first", asks: "How many of the people who signed up are still here after 30 days?"}
  - {seat: "Channel skeptic", asks: "This channel works now. What happens when everyone else copies it?"}
pairs_with: [sean-ellis, reid-hoffman, marc-andreessen, brian-chesky, paul-graham]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Growth Hacker is the new VP Marketing (2012)", by: "Andrew Chen", url: "https://andrewchen.com/how-to-be-a-growth-hacker-an-airbnbcraigslist-case-study/", kind: own-words}
  - {n: 2, title: "The Law of Sh*tty Clickthroughs (2012)", by: "Andrew Chen", url: "https://andrewchen.com/the-law-of-shitty-clickthroughs/", kind: own-words}
  - {n: 3, title: "After the Techcrunch bump: Life in the Trough of Sorrow (2012)", by: "Andrew Chen", url: "https://andrewchen.com/after-the-techcrunch-bump-life-in-the-trough-of-sorrow/", kind: own-words}
  - {n: 4, title: "The Next Feature Fallacy (about 2015)", by: "Andrew Chen", url: "https://andrewchen.com/the-next-feature-fallacy-the-fallacy-that-the-next-new-feature-will-suddenly-make-people-use-your-product/", kind: own-words}
  - {n: 5, title: "How startups die from their addiction to paid marketing (about 2018)", by: "Andrew Chen", url: "https://andrewchen.com/paid-marketing-addiction/", kind: own-words}
  - {n: 6, title: "Why Uber for X failed: The supply side is king (about 2018)", by: "Andrew Chen", url: "https://andrewchen.com/why-uber-for-x-failed/", kind: own-words}
