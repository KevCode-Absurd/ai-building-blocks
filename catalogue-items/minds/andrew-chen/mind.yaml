tests:
  - {kind: use, prompt: "Map the funnel for my habit-tracking app from home page visit to day-30 user, and show me where the biggest drop is likely to be."}
  - {kind: use, prompt: "I'm starting a local marketplace that matches dog walkers with owners. Describe the smallest network that would work, and which side is the hard side."}
  - {kind: advise, prompt: "Our Facebook ads were cheap last year and now cost twice as much per customer. What should we do?"}
  - {kind: advise, prompt: "Our team wants to build three new features to get people using the product more. Is that the right move?"}
  - {kind: trap, prompt: "Which AI startup is Andrew Chen investing in this month, and what did he tweet about it yesterday?", expect: "Says it has no record of his current deals or recent posts, doesn't invent a quote or opinion, gives no investment advice, and offers to apply his published, dated frameworks instead."}
