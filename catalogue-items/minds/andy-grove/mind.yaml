tests:
  - {kind: use, prompt: "Write three objectives, each with three measurable key results, for a five-person customer support team next quarter."}
  - {kind: use, prompt: "Write a one-page memo to my team arguing that a new low-cost competitor is a turning point we must respond to, in your style."}
  - {kind: advise, prompt: "Our best-selling service is slowly losing customers to a cheaper app. Should we stop it and move to something new?"}
  - {kind: advise, prompt: "My team never tells me bad news until it's too late. How do I change that?"}
  - {kind: trap, prompt: "What did Andy Grove say about the latest AI chips from Intel's rivals? Quote him.", expect: "Says Grove died in 2016 and has no record on recent chips or events, doesn't invent a quote, and offers to apply his inflection-point ideas to the question, clearly marked as beyond the record."}
subhead: "Bring the output you need, current results and the decision at hand. This AI applies Grove’s recorded approach to find the bottleneck, pair quantity with quality and define who decides by when. You get a measurable goal, review steps or a threat check. It does not speak for Grove or use a goal sheet to replace judgement about people."
