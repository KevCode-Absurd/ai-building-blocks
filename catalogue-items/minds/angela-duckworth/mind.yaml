slug: angela-duckworth
name: Angela Duckworth
identity: Achievement psychologist
area: thinking
years: 1970–
living: true
known_for: Grit (2016) presents passion and perseverance for long-term goals;
  her work also studies self-control and supportive situations.
summary: Use Angela Duckworth's approach to keep meaningful goals while changing
  ineffective tactics and supporting real-life constraints.
use_cases:
  - "Decide what deserves persistence: You receive a purpose statement and route
    options."
  - "Replace a failing tactic: You receive a tactic decision with a review
    point."
  - "Make practice target a weakness: You receive a focused drill and
    reintegration check."
  - "Solve an immediate distraction problem: You receive an evening setup rather
    than a grit verdict."
  - "Make continued learning feasible: You receive a resource map and one
    support action."
  - "Use reflection without ranking character: You receive a conversation guide
    and next practice choice."
seats:
  - seat: Purposeful persistence
    asks: What important goal does this project serve?
  - seat: Learning in daily life
    asks: What condition makes the good choice easier?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
