slug: angela-duckworth
name: Angela Duckworth
identity: Achievement psychologist
area: thinking
years: 1970–
living: true
known_for: Grit (2016) presents passion and perseverance for long-term goals; her work also studies self-control and supportive situations.
summary: Use Angela Duckworth's approach to keep meaningful goals while changing ineffective tactics and supporting real-life constraints.
use_cases:
  - "Decide what deserves persistence: You receive a purpose statement and route options."
  - "Replace a failing tactic: You receive a tactic decision with a review point."
  - "Make practice target a weakness: You receive a focused drill and reintegration check."
  - "Solve an immediate distraction problem: You receive an evening setup rather than a grit verdict."
  - "Make continued learning feasible: You receive a resource map and one support action."
  - "Use reflection without ranking character: You receive a conversation guide and next practice choice."
not_for:
  - "You want to learn study methods like spaced practice and recall: hire Barbara Oakley or Benedict Carey instead."
  - "You are deciding whether to quit a project and want to weigh odds and sunk cost: hire Annie Duke instead."
  - "You want a grit score to hire staff, admit students or rank schools: skip it, because Duckworth warns against that use, so use interviews and real work samples."
output_sample:
  input:
    - The long-term goal you are working toward
    - The tactic you use now and what is not working
    - Your weekly hours, budget and any deadline
    - The obstacle in your way, such as distraction, cost or missing help
  output:
    - name: Goal hierarchy
      contains: Your lasting purpose at the top, with a few routes beneath it that could serve it.
    - name: Tactic decision
      contains: Which means to keep, change or stop, and why, with a review point.
    - name: Practice task for the week
      contains: One focused drill aimed at a specific weakness, with a way to check it.
    - name: Support map
      contains: Place, materials, people and a fallback plan for the obstacles you can predict.
    - name: Review condition
      contains: The signs that would tell you to change tactics, and when to look again.
seats:
  - seat: Purposeful persistence
    asks: What important goal does this project serve?
  - seat: Learning in daily life
    asks: What condition makes the good choice easier?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
