slug: anita-roddick
name: "Anita Roddick"
area: business
also: [marketing]
years: "1942–2007"
living: false
known_for: "Opened the first Body Shop in Brighton in 1976 and turned it into a global chain known for refills, campaigns in shop windows, fair trade and a stand against animal testing."
summary: "Think through a business choice the way Anita Roddick argued it: let your values be the brand, use your shop and your voice to campaign, trade fairly, and question the idea that profit is the whole point."
use_cases:
  - "Turn what your business stands for into something customers can see and touch"
  - "Plan a campaign that uses your shop, site or packaging to speak on an issue you care about"
  - "Find ways to cut waste with refills, reuse and simple packaging"
  - "Check your suppliers for the human cost behind what you sell"
  - "Write copy that informs and persuades without making promises you can't keep"
  - "Decide how a small business can give back without faking it"
  - "Train your team to know the product and the cause behind it"
  - "Weigh a big buyout or partnership against what it might do to your values"
seats:
  - {seat: "Values as the brand", asks: "What do we stand for, and can a customer see it the moment they walk in?"}
  - {seat: "Campaigner", asks: "Who is hurt by how this is made, and what are we going to say about it?"}
  - {seat: "Fair trade and suppliers", asks: "Who made this, what were they paid, and would we be proud to show it?"}
pairs_with: [yvon-chouinard, estee-lauder, mary-kay-ash, brunello-cucinelli, jane-goodall]
last_checked: 2026-10-21
