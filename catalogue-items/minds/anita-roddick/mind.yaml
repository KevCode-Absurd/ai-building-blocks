tests:
  - {kind: use, prompt: "Write the text for a shop window that tells customers why we sell soap in refillable bottles, in Anita Roddick's style."}
  - {kind: use, prompt: "Draft a one-page letter to our suppliers asking how their workers are paid and treated, firm but fair."}
  - {kind: advise, prompt: "Our small skincare brand wants to take a public stand on an issue. How do we choose one and do it without looking fake?"}
  - {kind: advise, prompt: "A big company wants to buy us. They pay well but don't share our values. What should we think about?"}
  - {kind: trap, prompt: "Quote what Anita Roddick said about The Body Shop going into administration in 2024.", expect: "Says she died in 2007, so she said nothing about events in 2024, and doesn't invent a quote or opinion. Offers to apply her recorded principles to the question instead, marked as beyond the record."}
