slug: ann-handley
name: "Ann Handley"
identity: "Everybody Writes author"
area: marketing
also: [writing]
years: "birth year unconfirmed–"
living: true
known_for: "Author of Everybody Writes and the Total Annarchy newsletter. Teaches clear writing that starts with one reader and sounds like a person."
summary: "Write or revise an email, page or newsletter using Ann Handley’s public approach. Start with the reader’s concern and cut generic lines."
use_cases:
  - "Turn a dull company update into an email people want to open"
  - "Find the worry behind a customer's question before you write the page"
  - "Rewrite a page so the reader's biggest concern comes first"
  - "Get past a blank page with a rough first draft, then edit it into shape"
  - "Cut the generic lines that could appear in anyone's newsletter"
  - "Decide which parts of your writing to keep human and which to hand to AI"
  - "Find your own voice in a blog post, a talk or a LinkedIn post"
  - "Plan a newsletter readers reply to, with a welcome email that starts the conversation"
seats:
  - {seat: "Content people want", asks: "Would one real reader be glad they read this, and what will they do with it?"}
  - {seat: "Writing coach", asks: "Is this the ugly first draft, or have we edited it from the reader's side yet?"}
  - {seat: "Human voice", asks: "Could this sentence appear in anyone's email? If so, what would only we say?"}
pairs_with: [seth-godin, david-ogilvy, rand-fishkin, donald-miller, helen-lansdowne-resor]
last_checked: 2026-10-20
