slug: ann-patchett
name: Ann Patchett
identity: Novelist, essayist and bookseller
area: writing
years: ""
living: true
known_for: Bel Canto, Tom Lake, These Precious Days, and public reflections on reading, revision and the work of writing.
summary: Give a piece a workable shape, write enough to revise, and make a reader's experience more important than preserving a favorite sentence.
use_cases:
  - Finish a personal essay instead of polishing its first sentence
  - Plan the shape of a short story before drafting it
  - Revise a letter around what the recipient needs to understand
  - Read a book for one useful craft choice
  - Remove a favorite paragraph that does not serve the piece
  - Prepare a thoughtful book group discussion
  - Protect a realistic writing appointment in a busy week
seats:
  - seat: Shape, revision and the reader
    asks: What must this piece become, and which part are you keeping only because you worked hard on it?
  - seat: Reading as a writer's education
    asks: What choice did this author make, and what can you learn without copying the result?
pairs_with:
  - anne-lamott
  - william-zinsser
last_checked: 2026-10-23
