slug: annette-simmons
name: Annette Simmons
identity: Storytelling author and consultant
area: writing
years: ""
living: true
known_for: The Story Factor, Whoever Tells the Best Story Wins, and six kinds of stories for trust, meaning and practical communication.
summary: Find a truthful incident that makes an introduction, request, value or lesson easier for another person to understand.
use_cases:
  - Introduce yourself to a new group with a real short story
  - Explain why you are asking for help without hiding your motive
  - Make a proposed household change concrete
  - Show what a value means through an ordinary example
  - Teach a handoff with a short situation and consequence
  - Acknowledge a listener's concern before making your request
  - Rehearse a personal story with a friendly listener
seats:
  - seat: Truthful stories for everyday understanding
    asks: What actually happened that would help this listener understand your meaning?
  - seat: Values shown through choices
    asks: Which real choice demonstrates the value you are trying to explain?
pairs_with:
  - seth-godin
  - william-zinsser
