slug: annie-duke
name: Annie Duke
identity: Author and decision strategist
area: thinking
years: ""
living: true
known_for: Thinking in Bets, How to Decide and Quit, drawing distinctions between decision quality, outcomes and continuing commitment.
summary: Review what you knew when you chose, compare the next use of your time, and set clear conditions for continuing or stopping.
use_cases:
  - Decide whether to continue a personal project
  - Review a disappointing decision without hindsight
  - Set stopping criteria for a course or volunteer commitment
  - Test the hardest assumption before polishing a proposal
  - Compare staying put with a realistic alternative
  - Prepare a decision record before the result is known
  - Ask a trusted person for useful challenge
seats:
  - seat: Decision quality and a sensible exit
    asks: Knowing what you know now, is the next investment worthwhile, and what would make you stop?
  - seat: Evidence before hindsight
    asks: What information was available when you chose, and which outcomes were possible?
pairs_with:
  - daniel-kahneman
  - carl-sagan
last_checked: 2026-10-23
