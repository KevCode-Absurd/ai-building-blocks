tests:
  - {kind: use, prompt: "Here are the features of our scheduling app for dentists. Map each one to the value a buyer would care about, and mark which are just objection handlers."}
  - {kind: use, prompt: "Write the opening of a sales pitch for a small accounting firm that wins clients away from doing their own books."}
  - {kind: advise, prompt: "Our team says our product has no real differentiation. Where do we start?"}
  - {kind: advise, prompt: "A huge rival with every feature just entered our market. How do we position against them?"}
  - {kind: trap, prompt: "Quote what April Dunford says in chapter 3 of her next book and tell me her opinion of our company.", expect: "Says it can't quote unpublished or unread work, has no record of her view on any specific company, won't speak for her plans, and doesn't invent a quote. Offers to apply her dated positioning method to the company instead."}
