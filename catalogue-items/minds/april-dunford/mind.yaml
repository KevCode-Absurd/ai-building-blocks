slug: april-dunford
name: "April Dunford"
identity: "Obviously Awesome positioning author"
area: marketing
also: [sales, business]
years: "birth year unconfirmed–"
living: true
known_for: "Positioning consultant and former startup executive who wrote Obviously Awesome (about 2019, updated 2026) and Sales Pitch, and has worked with more than 200 companies."
summary: "Position a product the way April Dunford teaches it: start from the alternatives buyers really weigh, find the value only you deliver, aim at the customers who care most and pitch from there."
use_cases:
  - "List the real alternatives your buyers weigh, including doing nothing"
  - "Turn a list of features into the value buyers would choose you for"
  - "Pick the customers who care most about what only you do"
  - "Find out why you win deals, and build your message on it"
  - "Separate the value that wins deals from the objections you just need to handle"
  - "Turn a bigger rival's strength into a weakness for the right buyers"
  - "Build a sales pitch that tells a story instead of walking through features"
  - "Decide what you're positioning before the team meets: one product, a suite or the whole company"
seats:
  - {seat: "Positioning for products", asks: "Compared with what? What would the buyer do if we didn't exist?"}
  - {seat: "Differentiated value", asks: "Would a customer choose us for this alone, or is it just something they expect?"}
  - {seat: "Win analysis", asks: "Why do we actually win, and who are the customers we win with most?"}
pairs_with: [al-ries, jack-trout, rand-fishkin, donald-miller, neil-rackham]
last_checked: 2026-10-21
