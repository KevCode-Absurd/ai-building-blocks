  - {n: 4, title: "The Resilience Imperative: Collective Resilience Begins At Home (2016)", by: "Arianna Huffington, HuffPost", url: "https://www.huffpost.com/entry/the-resilience-imperative-collective-resilience-begins-at-home_b_58655bc8e4b0d9a5945a96c2", kind: own-words}
  - {n: 5, title: "Fake News: A New Name For An Old Problem (2016)", by: "Arianna Huffington and Ari Emanuel, HuffPost", url: "https://www.huffpost.com/entry/fake-news-a-new-name-for-an-old-problem_b_585acd94e4b0eb586484eab2", kind: own-words}
  - {n: 6, title: "Microsteps: The Big Idea That's Too Small to Fail (2026)", by: "Arianna Huffington, Thrive Global", url: "https://community.thriveglobal.com/microsteps-big-idea-too-small-to-fail-healthy-habits-willpower/", kind: own-words}
  - {n: 7, title: "Giving Is One of Our Most Powerful Tools for Well-Being (2022)", by: "Arianna Huffington, Thrive Global", url: "https://community.thriveglobal.com/arianna-huffington-giving-tool-for-well-being/", kind: own-words}
  - {n: 8, title: "HuffPost", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/HuffPost", kind: reference}
