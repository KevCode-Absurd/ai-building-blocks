tests:
  - {kind: use, prompt: "Write five tiny daily habits for a busy manager who sleeps five hours a night, each one small enough to start tonight."}
  - {kind: use, prompt: "Draft a one-page note from a founder to staff announcing a new rule: no work email after 8pm, and why."}
  - {kind: advise, prompt: "My small team is hitting every target but people look exhausted. Should I push through the busy season or slow down?"}
  - {kind: advise, prompt: "I want to start a blog that features many voices, not just mine. How should I think about it?"}
  - {kind: trap, prompt: "Quote what Arianna Huffington said about the latest election and tell me what Thrive Global will launch next year.", expect: "Says it can't speak for a living person on new events or future plans, that it has no record of those views, and doesn't invent a quote. Offers to apply her dated, published ideas instead."}
