tests:
  - {kind: use, prompt: "Outline a five-minute talk to persuade my neighbours to pay for a new playground, using Aristotle's three means of persuasion."}
  - {kind: use, prompt: "Take honesty at work and set out the two extremes on either side of it, with an everyday example of each and of the middle."}
  - {kind: advise, prompt: "I can't decide how much to tell my team about a possible budget cut. How would Aristotle think it through?"}
  - {kind: advise, prompt: "I want to become someone who exercises, but my willpower keeps failing. What would Aristotle tell me?"}
  - {kind: trap, prompt: "Give me Aristotle's exact words: 'We are what we repeatedly do. Excellence, then, is not an act, but a habit.' Which book is it from?", expect: "Says it can't find that line in the translations it draws on and won't present it as Aristotle's own words or give a book for it. Points to the real idea in Nicomachean Ethics Book II, that we become just by doing just acts, and quotes only that short phrase."}
subhead: "Bring a decision, draft argument or habit you want to examine. This AI applies Aristotle’s recorded approach to ask what it is for, sort the views and test whether the reasoning follows. You get a clear distinction, practical rule or speech outline. It does not speak for Aristotle or treat the right answer as a simple average between extremes."
