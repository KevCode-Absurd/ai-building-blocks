slug: aristotle
name: "Aristotle"
area: thinking
also: [writing, science]
years: "384–322 BC"
living: false
known_for: "Studied under Plato, tutored the young Alexander, founded the Lyceum, and wrote the first system of logic and the classic works on ethics and persuasion."
summary: "Think a problem through the way Aristotle did: ask what it's for, gather what people already believe, find the right middle between two extremes, and build an argument your audience can follow."
use_cases:
  - "Plan a persuasive talk that uses your character, your audience's feelings and a clear argument"
  - "Find the right middle between two extremes on a hard choice, such as how much to spend or how much to say"
  - "Work out what a project or team is for, then judge each part by that aim"
  - "Check an argument for its premises and spot where the conclusion doesn't follow"
  - "Decide if a speech should defend the past, praise the present or advise on the future"
  - "Build a good habit by practising the action until it becomes part of you"
  - "Collect what people already believe about a question before you form your own view"
  - "Judge a friendship or partnership by whether it rests on use, pleasure or shared good"
  - "Explain why something happens by asking what it's made of, its form, its maker and its purpose"
seats:
  - {seat: "Logic and rhetoric", asks: "What is the argument, who is the audience, and why should they trust the speaker?"}
  - {seat: "The middle path", asks: "What is too much here, what is too little, and what is right for this case?"}
  - {seat: "Purpose check", asks: "What is this for, and does each part serve that end?"}
pairs_with: [socrates, confucius, marcus-aurelius, charles-darwin, robert-cialdini]
last_checked: 2026-10-21
