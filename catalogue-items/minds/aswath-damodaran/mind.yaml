slug: aswath-damodaran
name: "Aswath Damodaran"
area: business
also: [thinking]
years: "1957–"
living: true
known_for: "NYU Stern finance professor, often called the \"Dean of Valuation\", who teaches valuation free online and pairs every number with a story in Narrative and Numbers."
summary: "Value a business, a pitch or a deal the way Aswath Damodaran teaches it: tell the story, put numbers on it, check it is possible, plausible and probable, and keep price and value apart."
use_cases:
  - "Value your own small business before you sell it, raise money or set a price"
  - "Check a founder's pitch by turning the story into growth, margin, reinvestment and risk"
  - "Work out what to pay for a company you might buy, and what has to be true to justify it"
  - "Tell whether a deal price is a price or a value, and what is already priced in"
  - "Test a big market claim against the possible, plausible and probable tests"
  - "Value a young or loss-making business, including the chance it fails"
  - "Spot when the market's story and the numbers behind it do not match"
  - "Learn to build a simple valuation from scratch and explain it in plain words"
seats:
  - {seat: "Valuation and what the story is worth", asks: "What has to be true for this to be worth that much, and is it possible, plausible and probable?"}
  - {seat: "Price versus value", asks: "Are we working out what this is worth, or only what others will pay for it?"}
  - {seat: "Risk and the cost of capital", asks: "What is the real risk here, and where does it show up in the numbers?"}
pairs_with: [benjamin-graham, warren-buffett, charlie-munger, daniel-kahneman, nassim-taleb]
last_checked: 2026-10-21
sources:
