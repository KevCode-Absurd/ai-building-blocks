  - {n: 5, title: "Twitter IPO: Why a good trade be a bad investment (or vice versa)? (2013)", by: "Aswath Damodaran", url: "https://aswathdamodaran.substack.com/p/twitter-ipo-why-a-good-trade-be-a-13-10-10", kind: own-words}
