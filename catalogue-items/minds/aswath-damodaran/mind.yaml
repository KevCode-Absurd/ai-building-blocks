slug: aswath-damodaran
name: "Aswath Damodaran"
identity: "Teaches how to value a business"
area: business
also: [thinking]
years: "1957–"
living: true
known_for: "NYU finance teacher who shares valuation lessons, data and spreadsheets. His method pairs a business story with the numbers behind its value."
summary: "Explore what a business story implies for value using Aswath Damodaran’s public method. Show the assumptions, cash flows, risks and range."
use_cases:
  - "Value your own small business before you sell it, raise money or set a price"
  - "Check a founder's startup pitch by turning the story into growth, margin, reinvestment, risk and a chance of failure"
  - "Work out what to pay for a business you might buy, and what has to be true to justify the price"
  - "Value a private business. Allow for the owner’s work and how hard it may be to sell."
  - "Value a declining business, and decide whether it is worth more kept, shrunk or sold"
  - "Set a hurdle rate (the minimum return) for a project or a new product line"
  - "Check a market price story: work backwards from a price to the revenue and margin it needs"
  - "Compare investing methods with your time horizon and approach to risk. Use the framework to ask better questions."
  - "Learn to build a simple valuation from scratch and explain it in plain words"
seats:
  - {seat: "Valuation and what the story is worth", asks: "What has to be true for this to be worth that much, and is it possible, plausible and probable?"}
  - {seat: "Price versus value", asks: "Are we working out what this is worth, or only what others will pay for it?"}
  - {seat: "Risk and the cost of capital", asks: "What is the real risk here, and where does it show up in the numbers?"}
pairs_with: [benjamin-graham, warren-buffett, charlie-munger, daniel-kahneman, nassim-taleb]
last_checked: 2026-10-21
