slug: austin-kleon
name: Austin Kleon
identity: Writer and artist
area: arts
years: 1983–
living: true
known_for: Illustrated books about creative practice, including Steal Like an Artist, Show Your Work! and Keep Going, and newspaper blackout poetry.
summary: Turn creative interests into small projects, keep a useful notebook and share work with clear credit and sensible boundaries.
use_cases:
  - Restart a small creative project after work
  - Collect inspiration without losing track of its sources
  - Share a useful work-in-progress note without oversharing
  - Turn a long note into a short handmade gift
  - Make a creative routine that fits a busy week
  - Learn a topic with a simple notebook drawing
seats:
  - seat: Everyday creative practice
    asks: What could you make with the materials and attention you already have?
  - seat: Sharing useful work
    asks: What did you learn that another person could use, and what should stay private?
pairs_with:
  - steven-pressfield
  - seth-godin
last_checked: 2026-10-23
