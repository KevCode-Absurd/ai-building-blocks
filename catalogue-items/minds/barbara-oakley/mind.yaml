slug: barbara-oakley
name: Barbara Oakley
identity: Engineering educator
area: thinking
years: 1955–
living: true
known_for: A Mind for Numbers (2014), Mindshift (2017), and the Learning How to
  Learn course translate learning research for non-specialists.
summary: Use Barbara Oakley's approach to turn intimidating subjects into small,
  repeatable learning sessions.
use_cases:
  - "Get unstuck on a hard problem: You receive an impasse note and two
    alternative starts."
  - "Build a reusable mathematics chunk: You receive a short annotated solution
    and a changed example."
  - "Start a postponed study session: You receive a start ritual and a separate
    note for the learning obstacle."
  - "Check whether a video lesson stuck: You receive a reconstruction task
    rather than another viewing list."
  - "Spread exam practice across the week: You receive three appointments and an
    error-based review list."
  - "Test a feared career skill: You receive evidence for a next learning
    decision."
seats:
  - seat: Learning difficult subjects
    asks: What precise question will you carry into the break?
  - seat: Learning in daily life
    asks: Where will this skill reappear later in the week?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
