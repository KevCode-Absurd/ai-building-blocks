slug: becky-kennedy
name: Becky Kennedy
identity: Parenting psychologist
area: thinking
years: c. 1983–
living: true
known_for: Kennedy is a clinical psychologist and founder of Good Inside. Her public teaching includes the Good Inside approach and a 2023 TED talk about repairing after a parent loses their temper.
summary: Hold a parenting boundary with empathy and repair after losing your temper.
use_cases:
  - "Repair after losing your temper: After yelling, identify an action to repair instead of concluding you are a hopeless parent."
  - "Hold a limit and acknowledge disappointment: A child can be angry about leaving the park while you guide departure."
  - "End screen time with clear adult responsibility: End screen time while staying available for disappointment."
  - "Practice a skill outside the meltdown: Practice turn-taking during a calm game instead of offering a long lesson during a fight."
  - "Plan support before the next parental outburst: Name overload before an outburst while keeping responsibility for the shouting with yourself."
  - Work through a parent wanting to apologize for shouting without blaming the child
  - Prepare a respectful relationship conversation with separate worth and behavior and teach a skill
not_for:
  - "You want to understand shame and trust in your own life, not a parenting moment: use the Brené Brown mind."
  - "You want a plan for firm limits without punishments or rewards: use the Alfie Kohn mind."
  - "You want ready-made scripts for talking with kids and siblings: use the Adele Faber mind."
output_sample:
  input:
    - The moment you want help with, such as shouting over a refusal to put on shoes
    - What you said or did, and how the other person reacted
    - The limit you want to hold or the skill you want to practice (optional)
    - What happened after you tried it, if you come back for a revision (optional)
  output:
    - name: Situation as understood
      contains: A short summary of what you described, so you can correct anything before you use the words.
    - name: Central distinction
      contains: The idea that fits your case, such as keeping a person's worth apart from the behavior you need to address.
    - name: Repair conversation
      contains: Original wording that names what you did, owns it and says one change you will practice.
    - name: Plan for the next hard moment
      contains: One small action and the condition under which you will take it.
    - name: What remains uncertain
      contains: What the advice cannot know, and when this approach would not suit your situation.
seats:
  - seat: Sturdy parenting and repair
    asks: How would separate identity and behavior change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using lead without emotional agreement?
pairs_with:
