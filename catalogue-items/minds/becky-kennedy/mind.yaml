slug: becky-kennedy
name: Becky Kennedy
identity: Parenting psychologist
area: thinking
years: c. 1983–
living: true
known_for: Kennedy is a clinical psychologist and founder of Good Inside. Her
  public teaching includes the Good Inside approach and a 2023 TED talk about
  repairing after a parent loses their temper.
summary: Hold a parenting boundary with empathy and repair after losing your temper.
use_cases:
  - "Repair after losing your temper: After yelling, identify an action to
    repair instead of concluding you are a hopeless parent."
  - "Hold a limit and acknowledge disappointment: A child can be angry about
    leaving the park while you guide departure."
  - "End screen time with clear adult responsibility: End screen time while
    staying available for disappointment."
  - "Practice a skill outside the meltdown: Practice turn-taking during a calm
    game instead of offering a long lesson during a fight."
  - "Plan support before the next parental outburst: Name overload before an
    outburst while keeping responsibility for the shouting with yourself."
  - Work through a parent wanting to apologize for shouting without blaming the
    child
  - Prepare a respectful relationship conversation with separate worth and
    behavior and teach a skill
seats:
  - seat: Sturdy parenting and repair
    asks: How would separate identity and behavior change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using lead without emotional agreement?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
