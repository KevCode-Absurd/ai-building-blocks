  - {n: 4, title: "Gymshark CEO: How I built a $1.5 billion business at 19 (The Diary of a CEO, 27 December 2021), transcript", by: "Ben Francis with Steven Bartlett", url: "https://rosetta.to/u/thediaryofaceo/gymshark-ceo-how-i-built-a-1-5-billion-business-at-19-ben-francis", kind: own-words}
  - {n: 5, title: "Building a community-driven brand (Breakthrough Labs, 6 September 2023), episode page", by: "Ben Francis with Melis Kahya Akar, General Atlantic", url: "https://www.generalatlantic.com/podcast/building-a-community-driven-brand/", kind: own-words}
  - {n: 6, title: "Seventh heaven: how Gymshark bulked up to a billion-dollar DTC fitness brand (22 June 2021), write-up of the OMR podcast", by: "OMR", url: "https://omr.com/en/gymshark-ben-francis-omr-pod/", kind: secondary}
