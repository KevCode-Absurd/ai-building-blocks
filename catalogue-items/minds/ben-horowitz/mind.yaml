slug: ben-horowitz
name: "Ben Horowitz"
identity: "Andreessen Horowitz co-founder"
area: business
also: [leadership]
years: "1966–"
living: true
known_for: "Co-founder of Loudcloud and Andreessen Horowitz. Author of The Hard Thing About Hard Things, on difficult choices in running a company."
summary: "Prepare a team update or hard management choice using Ben Horowitz’s recorded approach. Name the problem and who owns the next step."
use_cases:
  - "Decide whether your team is in a calm period or fighting for survival, and lead to match"
  - "Plan a layoff that treats people with respect and keeps the trust of those who stay"
  - "Stop chasing a quick fix and name the one hard problem you have to solve"
  - "Write a frank update to your team about a setback, without spin"
  - "Set out what a good product owner or team lead does, and what excuses look like"
  - "Find the everyday choices that show your team's real culture, not the values on the wall"
  - "Work out your next move when a plan has failed and cash is short"
  - "Prepare a hard talk with a loyal colleague who is no longer the right fit"
seats:
  - {seat: "When things go wrong", asks: "Are we at peace or at war right now, and are we acting like it?"}
  - {seat: "No silver bullets", asks: "What's the real problem, and are we fixing it or looking for a shortcut?"}
  - {seat: "Culture in practice", asks: "What will people do when we're not in the room, and what does that say about who we are?"}
pairs_with: [andy-grove, marc-andreessen, kim-scott, peter-thiel, jim-collins]
last_checked: 2026-10-20
sources:
