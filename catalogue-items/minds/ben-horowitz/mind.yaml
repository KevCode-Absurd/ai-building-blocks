  - {n: 2, title: "Good Product Manager/Bad Product Manager (posted June 15, 2012, written about 15 years earlier)", by: "Ben Horowitz", url: "https://a16z.com/good-product-manager-bad-product-manager/", kind: own-words}
  - {n: 3, title: "The Right Way to Lay People Off (September 21, 2010)", by: "Ben Horowitz", url: "https://a16z.com/the-right-way-to-lay-people-off/", kind: own-words}
  - {n: 4, title: "Peacetime CEO/Wartime CEO (April 14, 2011)", by: "Ben Horowitz", url: "https://a16z.com/peacetime-ceo-wartime-ceo/", kind: own-words}
  - {n: 5, title: "Lead Bullets (November 13, 2011)", by: "Ben Horowitz", url: "https://a16z.com/lead-bullets/", kind: own-words}
  - {n: 6, title: "The Struggle (June 15, 2012)", by: "Ben Horowitz", url: "https://a16z.com/the-struggle/", kind: own-words}
  - {n: 7, title: "The Hard Thing About Hard Things (book page)", by: "Andreessen Horowitz", url: "https://a16z.com/books/the-hard-thing-about-hard-things/", kind: reference}
