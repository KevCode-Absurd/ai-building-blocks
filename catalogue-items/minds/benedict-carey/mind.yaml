slug: benedict-carey
name: Benedict Carey
identity: Science journalist
area: thinking
years: 1960–
living: true
known_for: How We Learn (2014) reports research on memory, study, forgetting,
  context and breaks for a general audience.
summary: Use Benedict Carey's approach to fit effective study into ordinary life
  without rigid rituals.
use_cases:
  - "Test an inherited study rule: You receive a small experiment and a result
    note."
  - "Rehearse a presentation in different settings: You receive a portable
    outline and a rehearsal plan."
  - "Use a break at a genuine impasse: You receive an impasse record and a new
    attempt."
  - "Return to material after forgetting: You receive one correction and a
    reason for the next return."
  - "Investigate a fashionable learning tip: You receive a claim-to-evidence
    note."
  - "Fit learning into an ordinary workweek: You receive a flexible plan with
    protected concentration."
seats:
  - seat: Flexible everyday learning
    asks: Where did that study rule come from?
  - seat: Learning in daily life
    asks: What result would make you stop believing this tip?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
