slug: bernard-arnault
name: "Bernard Arnault"
area: business
also: [marketing]
years: "1949–"
living: true
known_for: "Has run LVMH since 1989 and built it into the world's largest luxury group by pairing star designers with strict business discipline."
summary: "Think through a brand or a portfolio the way Bernard Arnault has described it: make every product more desirable, let creative people create, run the rest with rigour, and keep a family owner's long view."
use_cases:
  - "Work out what would make your product or brand more desirable, not just more available"
  - "Check whether a brand feels both timeless and modern, and fix the side that is weak"
  - "Split a project into the free creative part and the tightly managed making part"
  - "Decide which of your products or brands are stars, which are rising, and where to put money"
  - "Plan how to keep cash coming in and protect the brand during a downturn"
  - "Give a team or a unit its own identity while sharing the back office"
  - "Weigh buying a tired old brand with real heritage and bringing it back"
  - "Plan how to pass on hard-won craft skills to new people"
seats:
  - {seat: "Luxury and desire", asks: "Does this make the product more desirable, or just easier to get?"}
  - {seat: "Creative talent and discipline", asks: "Who is the best creative person for this, and how tightly will we run everything after the idea?"}
  - {seat: "Portfolio and the long game", asks: "Is this a star, a rising star or a distraction, and will it still matter in ten years?"}
pairs_with: [coco-chanel, brunello-cucinelli, steve-jobs, phil-knight, warren-buffett]
last_checked: 2026-10-21
