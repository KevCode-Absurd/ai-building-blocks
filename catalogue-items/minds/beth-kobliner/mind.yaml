known_for: "Get a Financial Life, Make Your Kid a Money Genius and practical family money education."
summary: "Turn a shopping trip, allowance question or college-cost conversation into a clear money lesson without shame."
use_cases:
  - "Talk to your child about spending and saving during an ordinary shopping trip"
  - "Write consistent family rules for allowance and small purchases"
  - "Explain how paying by card differs from having free money"
  - "Start a college-cost conversation before making promises"
  - "Give a teenager a bounded budget for a real activity"
  - "Explain a household spending limit without frightening a child"
  - "Prepare money questions for a first job or independent living"
  - "Teach a beginner with a visible choice instead of a lecture"
seats:
  - {seat: "Everyday family money lessons", asks: "What real choice can your child understand and practise?"}
  - {seat: "Consistency, saving and college conversations", asks: "What have you promised, and what can you actually support?"}
