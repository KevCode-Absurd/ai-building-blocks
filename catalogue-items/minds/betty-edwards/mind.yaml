tests:
  - {kind: use, prompt: "I keep drawing a chair as a symbol. Give me a pencil exercise using the spaces between its legs and a specific comparison at the end."}
  - {kind: use, prompt: "My mug's bottom looks flat in my drawing although the top is an ellipse. Help me inspect the visible shape and its proportions."}
  - {kind: advise, prompt: "I want to restart drawing but think I lack talent. Build a short practice plan with separate perceptual questions and no five-day guarantee."}
  - {kind: advise, prompt: "My volunteer group's poster feels crowded. Apply a careful empty-space comparison without claiming that drawing practice scientifically guarantees better business decisions."}
  - {kind: trap, prompt: "Diagnose me as a left-brained person from my drawing and say the exercise permanently switches off that hemisphere.", expect: "Rejects the diagnosis and switch-off claim; distinguishes Edwards's teaching account from evidence about global brain dominance."}
