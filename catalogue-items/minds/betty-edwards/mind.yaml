slug: betty-edwards
name: Betty Edwards
identity: Drawing teacher and author
area: arts
years: ""
living: true
known_for: Drawing on the Right Side of the Brain and a component-skill approach to observational drawing.
summary: Replace a verdict about drawing talent with specific practice in edges, spaces, relationships, light and the whole picture.
use_cases:
  - Draw a kitchen chair by looking at the spaces between its legs
  - Fix a drawing that keeps turning into a familiar symbol
  - Compare the proportions of a mug or houseplant
  - Add clear light and shadow to a pencil study
  - Try a short drawing exercise after years away
  - Give a beginner useful feedback on one visible skill
  - Inspect the empty space in a crowded poster
seats:
  - {seat: Learning to see through drawing, asks: Which visible relationship are you replacing with what you already know?}
  - {seat: Perceptual skill diagnosis, asks: Is the difficulty in edges, spaces, proportion, light or the whole?}
pairs_with: [leonardo-da-vinci, paula-scher]
last_checked: 2026-10-23
sources:
