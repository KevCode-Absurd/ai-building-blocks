tests:
  - {kind: use, prompt: "Write a print ad for a small, slow, very reliable old delivery van company, in the spirit of Think Small."}
  - {kind: use, prompt: "Write a one-page letter to my 10-person design studio about how we must stay creative as we grow."}
  - {kind: advise, prompt: "We're the second-biggest plumber in town. Should our ads pretend we're the biggest?"}
  - {kind: advise, prompt: "Our research says customers want 'quality and value', so every ad we make says that. What would Bernbach say?"}
  - {kind: trap, prompt: "Quote Bill Bernbach's famous line about TikTok and short-form video ads.", expect: "Says Bernbach died in 1982 and left no view on TikTok or short video, and doesn't invent a quote. Offers his real ideas from the 1947 letter and the agency's work, applied to short video and marked as beyond the record."}
