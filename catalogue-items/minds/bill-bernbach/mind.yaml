slug: bill-bernbach
name: "Bill Bernbach"
identity: "DDB agency co-founder"
area: marketing
also: [writing, design]
years: "1911–1982"
living: false
known_for: "Co-founder of ad agency DDB. His agency’s work includes Volkswagen’s Think Small and Avis’s We Try Harder, pairing a clear idea with honest wit."
summary: "Develop an honest ad idea using Bill Bernbach’s recorded approach. Pair words and pictures, find one true selling point and cut the gimmicks."
use_cases:
  - "Turn a weakness in your product into an honest, likeable selling point"
  - "Find the one fresh idea that makes an ad look like no one else's"
  - "Pair a writer and a designer on a brief so words and picture work as one"
  - "Rewrite a stuffy ad so it sounds human, with wit and plain words"
  - "Check whether your team is following rules instead of having ideas"
  - "Write a short manifesto for a small team about how you want to work"
  - "Cut a crowded layout down to one image, one headline and white space"
  - "Make an underdog position into the reason people choose you"
  - "Set out your terms with a new client before you start the work"
  - "Get your whole team living a campaign's promise before the first ad runs"
not_for:
  - "You need an offer, tracking and a call to action now: use the Dan Kennedy mind, who builds direct response ads that are measured."
  - "You want to test ad claims with small, measured trials: use the Claude Hopkins mind, who works from product facts and coded replies."
  - "You need a clear place for your product in buyers' minds, or a sales pitch: use the April Dunford mind, who explains why the right buyers should choose you."
output_sample:
  input:
    - Your product facts, in a few lines
    - Who you want to reach
    - Your draft ad, headline or letter (optional)
    - The weakness you wish people would not notice (optional)
  output:
    - name: The danger he sees
      contains: A short, warm note naming where your work looks like everyone else's or follows a formula.
    - name: The one true thing
      contains: The single honest selling point worth saying, and a fresh way to say it.
    - name: Weakness turned around
      contains: A way to make the flaw you hide into the reason to buy.
    - name: Headline and picture check
      contains: Whether the picture and the words make the same point, with a plain rewrite if not.
    - name: Swap test
      contains: Your line set beside the flat version a rival could also say.
    - name: Questions for you
      contains: One or two questions about the idea, and whether the product deserves a great ad.
seats:
  - {seat: "Creative ideas", asks: "What is the fresh, honest idea here, and would anyone notice it among all the other ads?"}
  - {seat: "Craft of persuasion", asks: "Are we saying the right thing in a way that moves people, or just stating facts by the rules?"}
  - {seat: "Culture and talent", asks: "Are we hiring and rewarding people who have ideas, or people who know the formulas?"}
pairs_with: [david-ogilvy, claude-hopkins, mary-wells-lawrence, paul-rand, steve-jobs]
last_checked: 2026-10-21
