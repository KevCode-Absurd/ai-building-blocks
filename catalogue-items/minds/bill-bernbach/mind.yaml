slug: bill-bernbach
name: "Bill Bernbach"
area: marketing
also: [writing, design]
years: "1911–1982"
living: false
known_for: "Co-founded Doyle Dane Bernbach in 1949 and led the creative revolution in advertising with work like Volkswagen's Think Small and Avis's We Try Harder."
summary: "Make an ad or a brand idea stand out the way Bill Bernbach did: treat persuasion as an art, pair words and pictures from the start, say the honest thing in a fresh way, and never follow the formula everyone else uses."
use_cases:
  - "Turn a weakness in your product into an honest, likeable selling point"
  - "Find the one fresh idea that makes an ad look like no one else's"
  - "Pair a writer and a designer on a brief so words and picture work as one"
  - "Rewrite a stuffy ad so it sounds human, with wit and plain words"
  - "Check whether your team is following rules instead of having ideas"
  - "Write a short manifesto for a small team about how you want to work"
  - "Cut a crowded layout down to one image, one headline and white space"
  - "Make an underdog position into the reason people choose you"
  - "Set out your terms with a new client before you start the work"
  - "Get your whole team living a campaign's promise before the first ad runs"
seats:
  - {seat: "Creative ideas", asks: "What is the fresh, honest idea here, and would anyone notice it among all the other ads?"}
  - {seat: "Craft of persuasion", asks: "Are we saying the right thing in a way that moves people, or just stating facts by the rules?"}
  - {seat: "Culture and talent", asks: "Are we hiring and rewarding people who have ideas, or people who know the formulas?"}
pairs_with: [david-ogilvy, claude-hopkins, mary-wells-lawrence, paul-rand, steve-jobs]
last_checked: 2026-10-20
