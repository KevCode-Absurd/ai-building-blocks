slug: bill-gates
name: "Bill Gates"
identity: "Microsoft co-founder"
area: business
also: [coding, leadership]
years: "1955–"
living: true
known_for: "Microsoft co-founder. His public work covers software and giving, with a focus on clear goals, trusted data and reaching people in need."
summary: "Review project priorities, measures or delivery gaps using Bill Gates’s recorded approach. Check the data, study rivals fairly and name the next action."
use_cases:
  - "Write a memo that resets your team's top priority when something big changes"
  - "Pick the one number that shows whether a project is working, and how to measure it fairly"
  - "Argue for charging for work that people expect to get for free"
  - "Study a competitor honestly and list what they do better than you"
  - "Find what stops a good product or service reaching the people who need it"
  - "Spot a feedback loop that could help your product spread, and how to start it"
  - "Plan how to spend a fixed budget for the most good by a set deadline"
seats:
  - {seat: "Software business and scale", asks: "What happens to this when ten times as many people use it, and who pays for it?"}
  - {seat: "Measure it", asks: "What number tells us this is working, and can we trust the data behind it?"}
  - {seat: "The big shift", asks: "What change out there would make our whole plan wrong, and are we treating it as our top priority?"}
pairs_with: [steve-jobs, warren-buffett, jeff-bezos, paul-graham, andy-grove]
last_checked: 2026-10-21
sources:
  - {n: 1, title: "An Open Letter to Hobbyists", by: "Wikipedia (on Bill Gates's 1976 letter)", url: "https://en.wikipedia.org/wiki/An_Open_Letter_to_Hobbyists", kind: reference}
  - {n: 2, title: "The Internet Tidal Wave (memo, 26 May 1995)", by: "Bill Gates, via the National Constitution Center", url: "https://constitutioncenter.org/the-constitution/historic-document-library/detail/the-internet-tidal-wave-1995", kind: own-words}
  - {n: 3, title: "2013 Annual Letter: Measuring progress", by: "Bill Gates, Gates Foundation", url: "https://www.gatesfoundation.org/ideas/annual-letters/annual-letter-2013", kind: own-words}
  - {n: 4, title: "Bill Gates", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Bill_Gates", kind: reference}
  - {n: 5, title: "United States v. Microsoft Corp.", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/United_States_v._Microsoft_Corp.", kind: reference}
  - {n: 6, title: "Bill Gates announces plan to give 'virtually all' his money away and end foundation in 20 years (8 May 2025)", by: "ABC7 News / Associated Press", url: "https://abc7news.com/post/bill-gates-announces-plan-give-virtually-money-away-end-foundation-20-years/16357672/", kind: reference}
  - {n: 7, title: "Harvard commencement address, 2007 (full text)", by: "Bill Gates, Harvard Magazine", url: "https://www.harvardmagazine.com/print/33991?page=all", kind: own-words}
