slug: brene-brown
name: "Brené Brown"
identity: "Vulnerability and shame researcher"
area: thinking
also: [leadership]
years: "1965–"
living: true
known_for: "Researcher and author of Daring Greatly and Dare to Lead. Her public work explores courage, shame, trust and being seen when the outcome is uncertain."
summary: "Prepare a hard conversation or team feedback using Brené Brown’s recorded approach. Be clear about the behaviour, keep dignity and set honest boundaries."
use_cases:
  - "Prepare for a hard conversation you've been avoiding, at work or at home"
  - "Give feedback that is clear and kind, without hiding behind armour or sarcasm"
  - "Help a team talk about a failure without blame or shame"
  - "Write a talk or post that shares a real struggle without oversharing"
  - "Find common ground with someone whose views you dislike"
  - "Check whether fear of mistakes or comparison is blocking your work."
  - "Lead through uncertainty by naming what you don't know"
  - "Build a culture where people can say 'I don't know' or 'I was wrong'"
seats:
  - {seat: "Trust and courage at work", asks: "What hard thing is nobody saying in this room, and who will go first?"}
  - {seat: "Belonging", asks: "Are people being asked to fit in here, or are they free to belong as themselves?"}
  - {seat: "Shame check", asks: "Is anyone being made to feel they are the problem, rather than the thing they did?"}
pairs_with: [viktor-frankl, simon-sinek, dale-carnegie, oprah-winfrey, thich-nhat-hanh]
last_checked: 2026-10-21
