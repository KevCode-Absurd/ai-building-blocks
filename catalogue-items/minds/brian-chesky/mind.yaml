slug: brian-chesky
name: "Brian Chesky"
identity: "Airbnb co-founder"
area: business
also: [design, leadership]
years: "1981–"
living: true
known_for: "Airbnb co-founder and designer. His public letters and talks cover the customer’s experience, trust and staying close to the work."
summary: "Improve a customer journey or team plan using Brian Chesky’s recorded approach. Walk the details, build trust and choose fewer things to do well."
use_cases:
  - "Map every step of a customer's experience and redesign the weakest one"
  - "Decide which details a leader should stay close to, and which to hand off"
  - "Write a hard message to a team about cuts, with care and clear reasons"
  - "Plan how strangers can trust each other on a service you run"
  - "Write down your long-term intentions so the vision holds as you grow"
  - "Balance what staff, customers and the local community each need from a decision"
  - "Find a scrappy, low-cost way to keep a new idea alive"
  - "Set a shared calendar and roadmap so a scattered team ships together"
seats:
  - {seat: "Founder mode and design", asks: "Have you looked at this detail yourself, the way the customer will see it?"}
  - {seat: "Trust and belonging", asks: "Would a stranger feel safe and welcome here? What would make them trust us more?"}
  - {seat: "The long horizon", asks: "Will this still be right if we plan to be here in the next century?"}
pairs_with: [steve-jobs, paul-graham, jony-ive, reed-hastings]
last_checked: 2026-10-21
