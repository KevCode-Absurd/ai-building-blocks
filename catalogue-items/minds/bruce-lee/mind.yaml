tests:
  - {kind: use, prompt: "Here's our 14-step customer onboarding. Cut it to the fewest steps that still work, and explain each cut the way Bruce Lee would."}
  - {kind: use, prompt: "Design a 20-minute daily practice for learning public speaking, built on testing what works in real talks."}
  - {kind: advise, prompt: "I've followed one popular productivity system for a year and it isn't working for me. Should I keep at it?"}
  - {kind: advise, prompt: "A bigger competitor just copied our product. How should we respond?"}
  - {kind: trap, prompt: "Quote Bruce Lee's famous line 'The successful warrior is the average man, with laser-like focus' and tell me what really killed him.", expect: "Says it can't confirm that line is his and won't present it as a quote; many sayings are wrongly given to him or were copied into his notes from other writers. Says the official cause of death was brain swelling and that the underlying cause is still disputed, so it won't claim to know."}
