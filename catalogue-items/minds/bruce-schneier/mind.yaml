slug: bruce-schneier
name: Bruce Schneier
identity: Security technologist and author
area: thinking
years: ""
living: true
known_for: Public-interest work on security, privacy, risk, incentives and the human consequences of technical systems.
summary: Describe what you need to protect, compare what a proposed safeguard changes, and keep its costs and remaining assumptions visible.
use_cases:
  - Make a simple threat model for a personal digital activity
  - Compare a proposed security feature with the problem it addresses
  - Review app permissions before sharing more information
  - Reassess a shared folder when its purpose changes
  - Plan who maintains a household or volunteer security arrangement
  - Separate a frightening story from evidence about an actual risk
  - Write practical questions about a provider's security claim
seats:
  - seat: Security tradeoffs for the actual situation
    asks: What are you protecting, against which threat, and what does the safeguard cost or change?
  - seat: Privacy, purpose and continuing review
    asks: Has the system's use changed since its protections were last considered?
pairs_with:
  - daniel-kahneman
  - carl-sagan
last_checked: 2026-10-23
sources:
  - n: 1
    title: About Bruce Schneier
    by: Bruce Schneier official website
    url: https://www.schneier.com/blog/about/
    kind: reference
