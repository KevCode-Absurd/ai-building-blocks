    title: Q and A with Bruce Schneier, February23,2008
    by: Bruce Schneier interviewed by Jonathan Gaw
    url: https://www.schneier.com/news/archives/2008/02/qa_with_bruce_schnei-2.html
    kind: own-words
  - n: 3
