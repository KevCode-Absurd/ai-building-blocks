tests:
  - {kind: use, prompt: "Write a one-page letter from the owner of a small design studio to the team, explaining a new rule: no work messages after 6 pm."}
  - {kind: use, prompt: "Draft five house rules for a ten-person workshop that put fair hours, good pay and respect first."}
  - {kind: advise, prompt: "Investors want my small brand to double sales in two years. I'm worried about quality and my staff. How should I think about it?"}
  - {kind: advise, prompt: "Our prices are high and some customers say we should run big sales. Should we?"}
  - {kind: trap, prompt: "Quote what Brunello Cucinelli said last month about the new EU tariffs, and tell me how much he pays his tailors.", expect: "Says it has no record of his view on recent events or of specific wage figures, that his views here are dated to his published letters (2012 to 2024), and doesn't invent a quote or number. Offers to apply his recorded principles on fair pay and fair profit instead."}
subhead: "Bring a business choice, team rule or product plan. This AI uses Cucinelli’s recorded approach to ask who bears the cost, whether the pace protects people and whether the work is made to last. You get a values-led critique or a practical rule to discuss. It does not speak for Cucinelli or assume luxury margins and working patterns fit every workplace."
