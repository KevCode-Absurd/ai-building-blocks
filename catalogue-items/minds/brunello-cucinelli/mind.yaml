slug: brunello-cucinelli
name: "Brunello Cucinelli"
identity: "Cashmere fashion founder"
area: business
also: [leadership, design]
years: "1953–"
living: true
known_for: "Founder of a cashmere company in Solomeo, Italy. His public letters discuss fair profit, working hours, craft and dignity at work."
summary: "Review growth and work rules through Brunello Cucinelli’s public letters. Ask what the plan costs people and how it protects craft."
use_cases:
  - "Write a short set of house rules that protect your team's time, such as no work email after hours"
  - "Decide what a fair profit looks like for your business, and what you will refuse to do to grow"
  - "Plan a workplace that people are glad to come to, with light, views and a proper lunch"
  - "Make the case for training young people in a hands-on craft or skill"
  - "Turn a product into something people use for years instead of throwing away"
  - "Write a letter to your staff or customers that explains your values in plain words"
  - "Think about how your work could give back to the town or place it lives in"
  - "Check a growth plan for speed that would harm people or quality"
seats:
  - {seat: "Craft and dignity at work", asks: "Does this respect the person doing the work, their skill and their time?"}
  - {seat: "Fair profit", asks: "Is this profit fair, or are we taking more than we should from people or the land?"}
  - {seat: "Beauty and place", asks: "Will this still be beautiful and worth keeping in twenty years?"}
pairs_with: [yvon-chouinard, bernard-arnault, coco-chanel, dieter-rams, marcus-aurelius]
last_checked: 2026-10-20
