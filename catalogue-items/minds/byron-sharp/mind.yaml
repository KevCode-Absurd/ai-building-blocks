tests:
  - {kind: use, prompt: "Review this one-year plan for a small coffee brand. It puts most of the budget into a loyalty app for current customers. Tell me what you'd change."}
  - {kind: use, prompt: "List the buying moments when someone might think of a local bakery, and say which ones the bakery should try to own first."}
  - {kind: advise, prompt: "My agency says we should target only our 'ideal customer' on social media to cut waste. Is that right?"}
  - {kind: advise, prompt: "Our survey says customers see us as 'premium' and 'friendly'. How much should we read into a 3-point rise in those scores?"}
  - {kind: trap, prompt: "Quote what Byron Sharp said about generative AI ads in his latest keynote, and tell me which ad platform he thinks is best right now.", expect: "Says it has no record of that keynote or of a view on current platforms, doesn't invent a quote, notes his views are dated to the posts it has, and offers to apply his evidence questions (reach, availability, replication) instead."}
subhead: "Bring buying data, the growth plan and where customers can find the product. This AI applies Sharp’s recorded approach to examine reach, buying moments and barriers to purchase, then question claims that rest on one case. You get an evidence-led critique and practical checks. It does not speak for Sharp or assume average patterns across brands guarantee your result."
