slug: byron-sharp
name: "Byron Sharp"
identity: "How Brands Grow author"
area: marketing
also: [science]
years: "1960s–"
living: true
known_for: "Author of How Brands Grow. His public work uses buying data to examine brand growth, broad reach and being easy to think of and buy."
summary: "Review a brand growth plan using Byron Sharp’s public work. Check buying evidence, reach more potential buyers and make the product easier to find."
use_cases:
  - "Check if a growth plan leans too hard on loyalty and too little on winning new and light buyers"
  - "Test a marketing claim against the question 'has this been seen in more than one data set?'"
  - "Work out the buying moments where your brand should come to mind, and where it doesn't yet"
  - "Find the places where your product is hard to see, reach or buy, and fix those first"
  - "Check if an ad helps buyers recognise your brand, beyond saying it is different."
  - "Read a brand tracker or survey without mistaking past sales for future drivers"
  - "Push back on a trendy tactic or vendor pitch with the evidence questions it should answer"
  - "Plan ads that reach a broad audience instead of a narrow target that already buys"
seats:
  - {seat: "Evidence on how brands grow", asks: "What does the buying data show, and has that pattern held in other categories and countries?"}
  - {seat: "Reach and availability", asks: "Are we reaching all the people who buy this category, including the light buyers who barely know us?"}
  - {seat: "Myth checker", asks: "Is this a law we've seen repeated, or a nice story from one case study?"}
pairs_with: [seth-godin, rory-sutherland, daniel-kahneman, david-ogilvy, al-ries]
last_checked: 2026-10-20
