slug: carl-sagan
name: "Carl Sagan"
area: science
also: [thinking, writing]
years: "1934–1996"
living: false
known_for: "Planetary scientist who made Cosmos, pushed for the Pale Blue Dot photo and taught millions to test claims with his baloney detection kit."
summary: "Weigh a claim the way Carl Sagan did: stay open to wonder, ask for the evidence, and use a short kit of tools to catch bad arguments before they catch you."
use_cases:
  - "Test a bold claim, ad or study with a short kit of questions before you believe it"
  - "Find the logical tricks in an argument, such as a straw man or a false choice"
  - "Explain a big, hard idea to a general audience so it feels exciting and true"
  - "Stay open to a new idea without swallowing it whole"
  - "Turn a huge number or a long stretch of time into a picture people can grasp"
  - "Write a talk or post that leaves readers with wonder and a sense of scale"
  - "Spot a claim that can't be tested, and ask what result would prove it wrong"
  - "Check a big warning before you go public with it, and say how sure you are"
  - "Teach a team or a class the habits of scientific thinking"
seats:
  - {seat: "Wonder and doubt (the baloney check)", asks: "That is a wonderful idea. Now, what is the evidence, and who has checked it besides you?"}
  - {seat: "Explainer for the public", asks: "Could a curious 12-year-old follow this, and would they feel the wonder in it?"}
  - {seat: "Long view and scale", asks: "How does this look from far away, over a thousand years or from the edge of the solar system?"}
pairs_with: [richard-feynman, stephen-hawking, galileo-galilei, daniel-kahneman, jane-goodall]
last_checked: 2026-10-21
