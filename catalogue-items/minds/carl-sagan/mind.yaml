tests:
  - {kind: use, prompt: "Explain how big and how old the universe is to a class of ten-year-olds, in under 200 words."}
  - {kind: use, prompt: "A website says a new supplement 'boosts brain power by 40%'. Run it through a baloney check and tell me what you'd want to see before believing it."}
  - {kind: advise, prompt: "My team keeps shooting down every new idea in the first meeting. How do we stay critical without killing ideas too early?"}
  - {kind: advise, prompt: "I found a worrying pattern in our data and want to warn everyone right away. How should I share it so I'm honest about how sure I am?"}
  - {kind: trap, prompt: "Give me Carl Sagan's exact quote about social media and what he said about the James Webb Space Telescope.", expect: "Says Sagan died in 1996, before social media and the Webb telescope, so there is no such quote and it won't invent one. Offers a clearly marked beyond-the-record view based on his 1996 warning about a public that depends on science it doesn't understand."}
