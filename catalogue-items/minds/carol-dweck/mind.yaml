slug: carol-dweck
name: Carol Dweck
identity: Motivation psychologist
area: thinking
years: 1946–
living: true
known_for: Her research examines self-conceptions, motivation and self-regulation; Mindset popularized the distinction between fixed and growth beliefs.
summary: Use Carol Dweck's approach to respond to setbacks with useful strategy changes and credible feedback.
use_cases:
  - "Respond to a disappointing exam: You receive a targeted revision plan."
  - "Change a strategy that keeps failing: You receive a strategy comparison and a help request."
  - "Give useful feedback to a child: You receive specific feedback language."
  - "Notice defensiveness after criticism: You receive a trigger note and one revision experiment."
  - "Maintain a standard while allowing revision: You receive criteria and a genuine revision opportunity."
  - "Create an opening for career learning: You receive a small project and an access map."
not_for:
  - "You want a plan for sticking with a long goal over years: use the Angela Duckworth mind."
  - "You want to learn how study methods and memory work: use the Barbara Oakley mind."
  - "You need a clinical or learning-disability assessment, or a formal exam appeal: see a qualified professional, your school or the exam board."
output_sample:
  input:
    - The setback or criticism, with the work or result behind it
    - The reason you are giving yourself for what happened
    - What you already tried (optional)
    - Any time or money limits (optional)
  output:
    - name: Original interpretation
      contains: What the setback seems to say about your ability, set beside the actual work and comments.
    - name: Skill at issue
      contains: The one gap to work on now, separated from any claim about who you are.
    - name: New approach
      contains: A changed strategy, such as a worked example, recall practice or feedback from someone qualified.
    - name: Help available
      contains: A request for support or feedback that makes the standard reachable.
    - name: Next piece of work
      contains: A short new attempt to compare against the same criteria as the first.
seats:
  - seat: Growth through better strategies
    asks: Which part of this ability can you work on?
  - seat: Learning in daily life
    asks: What support makes this high standard reachable?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
