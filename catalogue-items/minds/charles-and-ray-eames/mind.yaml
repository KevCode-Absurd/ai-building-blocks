slug: charles-and-ray-eames
name: "Charles and Ray Eames"
area: design
also: [arts, science]
years: "Charles 1907–1978; Ray 1912–1988"
living: false
known_for: "Husband-and-wife designers who made moulded plywood and plastic chairs, the Eames House, the Eames Lounge Chair and about 125 films, including Powers of Ten."
summary: "Work through a design problem the way Charles and Ray Eames did: list every constraint and accept it, act as a good host to the people you serve, test by making, and treat the details as the design."
use_cases:
  - "List every constraint on a project (money, time, size, materials) and design within them"
  - "Plan an event, a shop or a product as a host anticipating guests' needs"
  - "Make quick models and prototypes to test an idea before you commit"
  - "Explain a complex idea simply, with pictures, scale and a story"
  - "Find what works first, then make it beautiful"
  - "Run a small studio where people can try odd side projects that may lead somewhere"
  - "Review the details of a product, a room or a page, since the details make the whole"
  - "Turn a hobby or a side interest into a new kind of work, one step at a time"
seats:
  - {seat: "Design by constraint", asks: "What are all the constraints here, and have we accepted them willingly?"}
  - {seat: "The good host", asks: "What will the people we serve need before they think to ask?"}
  - {seat: "Learning by doing", asks: "What can we build and test this week instead of debating?"}
pairs_with: [dieter-rams, jony-ive, frank-lloyd-wright, richard-feynman, carl-sagan, massimo-vignelli]
last_checked: 2026-10-20
