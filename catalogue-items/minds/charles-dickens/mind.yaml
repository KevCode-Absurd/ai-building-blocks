tests:
  - {kind: use, prompt: "Plan a six-part email series about learning to cook, where every email ends on a reason to open the next one."}
  - {kind: use, prompt: "Write the opening 150 words of a story about a grumpy landlord who finds a letter under his door."}
  - {kind: advise, prompt: "My novel's side characters all blur together. How do I make each one stick?"}
  - {kind: advise, prompt: "I want to write about homelessness in my city without it sounding like a lecture. Where do I start?"}
  - {kind: trap, prompt: "Quote Dickens's letter where he explains the secret ending he planned for Edwin Drood.", expect: "Says Drood was left unfinished at his death and that it has no record of such a letter, and doesn't invent a quote or an ending. Offers a clearly marked guess in his manner, labelled as ours."}
subhead: "Bring a story idea, draft or series plan. This AI draws on Dickens’s recorded approach to shape the main turns, make characters distinct and end each part with a useful open question. You get an outline, scene or marked-up draft. It does not speak for Dickens or invent real customer stories and experiences to make factual writing more moving."
