slug: charles-dickens
name: "Charles Dickens"
identity: "Victorian English novelist"
area: writing
also: [arts]
years: "1812–1870"
living: false
known_for: "Novelist who wrote Oliver Twist and A Christmas Carol. Published stories in parts, with vivid characters and questions that kept readers waiting for the next one."
summary: "Develop a story, character or series using Charles Dickens’s recorded approach. Start with vivid people and places, then give each part a purpose."
use_cases:
  - "Plan a story, a newsletter or a video series in parts that each end on a hook"
  - "Give a character a name, a habit and a way of talking people won't forget"
  - "Open a story, a talk or a post with a first line that grabs the reader"
  - "Write a short story with a change of heart at its centre"
  - "Turn a social problem you care about into a story people feel, not a lecture"
  - "Describe a place so readers can see, hear and smell it"
  - "Read your work aloud and fix the parts that don't play to a live room"
  - "Write a holiday message or toast with warmth and a little humour"
seats:
  - {seat: "Serial stories and cliffhangers", asks: "Where does this part end, and why will they come back for the next one?"}
  - {seat: "Character and voice", asks: "Who is the one person in this that readers will still talk about next week?"}
  - {seat: "Conscience of the room", asks: "Who gets hurt by this, and have we shown their face?"}
pairs_with: [william-shakespeare, jane-austen, mark-twain, george-orwell, walt-disney]
last_checked: 2026-10-20
