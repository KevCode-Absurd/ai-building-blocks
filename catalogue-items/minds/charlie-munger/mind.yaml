  - {n: 5, title: "1989 letter to Berkshire Hathaway shareholders", by: "Warren Buffett", url: "https://www.berkshirehathaway.com/letters/1989.html", kind: secondary}
  - {n: 6, title: "Academic Economics: Strengths and Faults after Considering Interdisciplinary Needs (UCSB Herb Kay lecture, 2003, with Q&A)", by: "Charlie Munger, transcript by Whitney Tilson", url: "https://www.rbcpa.com/wp-content/uploads/2017/01/Munger_UCSBspeech.pdf", kind: own-words}
