  - {n: 8, title: "Five Simple Notions that Solve Problems (excerpts of the 1996 talk Practical Thought about Practical Thought)", by: "Charlie Munger, via Farnam Street", url: "https://fs.blog/charlie-munger-notions/", kind: own-words}
