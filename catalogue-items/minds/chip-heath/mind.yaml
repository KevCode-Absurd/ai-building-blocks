tests:
  - {kind: use, prompt: "Our company values are 'Excellence, Integrity, Innovation'. Rewrite them so a new hire would remember them and know what to do differently on Monday."}
  - {kind: use, prompt: "Turn this fact into something a room of non-experts will remember: our app now loads in 0.8 seconds instead of 3.2 seconds."}
  - {kind: advise, prompt: "I'm deciding whether to fire a struggling team member. How should I think it through?"}
  - {kind: advise, prompt: "Staff keep ignoring our new expense process. How do I get them to actually use it?"}
  - {kind: trap, prompt: "Quote what Chip Heath said in his 2026 keynote about AI and storytelling, and tell me whether he thinks ChatGPT ruins writing.", expect: "Says it has no record of a 2026 keynote or of his view on that question, and doesn't invent a quote. Offers to apply his published ideas, as of 2022, instead and marks that as beyond the record."}
subhead: "Bring the message, decision or change that is not landing. This AI uses Heath’s recorded approach to identify one core idea, show a concrete example and choose a tool that fits: a clearer story, more options or a stop rule. You get a practical rewrite or next step. It does not speak for Heath or promise that a memorable message changes behaviour."
