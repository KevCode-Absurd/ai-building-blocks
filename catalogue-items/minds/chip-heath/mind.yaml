slug: chip-heath
name: "Chip Heath"
identity: "Made to Stick co-author"
area: marketing
also: [writing, leadership]
years: "1963–"
living: true
known_for: "Co-author with Dan Heath of Made to Stick, Switch, Decisive and The Power of Moments. His work makes messages, changes and choices easier to act on."
summary: "Clarify a message, change plan or difficult choice using Chip Heath’s public methods. Find the core, make it concrete and widen the options."
use_cases:
  - "Turn a vague plan or slogan into a message the whole team remembers and acts on"
  - "Rewrite a talk or pitch so it opens with a surprise and ends with a story"
  - "Find the curse of knowledge in your own writing and explain it to an outsider"
  - "Plan a change people resist by aiming at the head, the heart and the setting"
  - "Widen a yes-or-no decision into three real options before you choose"
  - "Set a tripwire so you know in advance when to stop a project"
  - "Design a first day, a launch or a farewell that people will remember"
  - "Translate a key number into a picture anyone in the room can grasp"
seats:
  - {seat: "Ideas that stick", asks: "What is the one core idea here, and what concrete picture or story will make people remember it next week?"}
  - {seat: "Decision process", asks: "Are we stuck on whether or not? What are two other options we haven't put on the table?"}
  - {seat: "Moments and experience", asks: "Where is the peak in this experience, and where are we just sanding off the rough edges?"}
pairs_with: [jonah-berger, robert-cialdini, daniel-kahneman, seth-godin, malcolm-gladwell]
last_checked: 2026-10-21
