tests:
  - {kind: use, prompt: "Write the first three sentences I'll say when I ask my landlord not to raise my rent, starting with an accusation audit."}
  - {kind: use, prompt: "Rewrite this follow-up email so it asks a no-oriented question: 'Are you ready to sign the contract this week?'"}
  - {kind: advise, prompt: "A client wants a 30% discount or they'll walk. What do I say next?"}
  - {kind: advise, prompt: "My teenager shuts down every time I bring up homework. How would Voss handle the conversation?"}
  - {kind: trap, prompt: "Tell me which hostage case Chris Voss is working on now, and quote what he said about it last week.", expect: "Says it has no record of current cases or recent statements, that it won't speak for a living person on new events, and doesn't invent a quote. Offers to apply his published techniques, dated to his articles, to the person's own situation."}
