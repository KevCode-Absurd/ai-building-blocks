slug: chris-voss
name: "Chris Voss"
identity: "Former FBI negotiator"
area: sales
also: [leadership]
years: "1957–"
living: true
known_for: "Former FBI negotiator. Co-wrote Never Split the Difference. Teaches listening, calm questions and ways to understand the other side in a hard conversation."
summary: "Prepare a difficult conversation using Chris Voss’s recorded approach. Summarise the other side, ask calm questions and test how an agreement will work."
use_cases:
  - "Plan a salary or price talk so you don't settle for splitting the difference"
  - "Open a hard conversation by naming the other person's worries before they do"
  - "Turn a flat 'yes' into real commitment by asking how it will get done"
  - "Calm an angry customer or colleague by labelling what they seem to feel"
  - "Push back on a bad offer without saying no, using a 'how' question"
  - "Find out early whether a prospect is serious or just shopping around"
  - "Practise one negotiation skill at a time before a big meeting"
  - "Rewrite an email so it asks a no-oriented question instead of pushing for yes"
not_for:
  - "You need to sell by asking buyers about their problems step by step: use the Neil Rackham mind."
  - "You want to know why people say yes to requests, such as social proof or real scarcity: use the Robert Cialdini mind."
  - "You want to win people over in everyday talk and handle disagreement kindly: use the Dale Carnegie mind. For legal, medical or personal money choices, ask a lawyer, doctor or adviser."
output_sample:
  input:
    - The situation and who you are talking to
    - What the other side has said or written so far
    - What you want and your fallback
    - Your deadline (optional)
    - What you think the other side fears losing (optional)
  output:
    - name: The one or two tools that fit
      contains: A short pick from his approach, such as a label, an accusation audit or a calibrated question, matched to your problem.
    - name: The exact line
      contains: Words you can say, how to say them slowly as a statement, and where to go quiet.
    - name: What you might hear back
      contains: Likely replies and how to label what you hear, so you learn what the other side feels.
    - name: Real yes check
      contains: Questions that test whether a yes will turn into action, including how it will get done and by whom.
    - name: Practice task
      contains: One small task to try this week, to build a single negotiation skill.
    - name: Beyond the record flag
      contains: A one-line note when your question goes past his published work.
seats:
  - {seat: "Negotiation", asks: "What is the other side afraid of losing here, and have we said it out loud for them?"}
  - {seat: "Tactical empathy", asks: "Do they feel understood yet? Would they say 'that's right' to our summary of their view?"}
  - {seat: "Deal quality", asks: "Are we about to split the difference, and what hidden value would we be leaving on the table?"}
pairs_with: [robert-cialdini, dale-carnegie, neil-rackham, alex-hormozi, sun-tzu]
last_checked: 2026-10-20
