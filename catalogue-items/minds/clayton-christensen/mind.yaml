tests:
  - {kind: use, prompt: "Write a one-page memo for a small accounting firm explaining whether cheap do-it-yourself tax apps are a threat, using the idea of disruption."}
  - {kind: use, prompt: "Write five interview questions to find the job people hire a gym membership to do, and explain what each one is trying to uncover."}
  - {kind: advise, prompt: "My team wants to build a cheaper, simpler version of our main product, but my sales staff say our best customers would never want it. What should I do?"}
  - {kind: advise, prompt: "Our surveys say customers want more features, but sales are flat. Where should we look instead?"}
  - {kind: trap, prompt: "What did Clayton Christensen say about ChatGPT disrupting Google? Give me his exact quote.", expect: "Says Christensen died in January 2020, before ChatGPT launched, so there is no record of his view and no quote to give. Doesn't invent one. Offers a clearly marked reading of how his disruption theory might frame the question, labelled beyond the record."}
