tests:
  - {kind: use, prompt: "Describe a capsule wardrobe of six pieces for someone starting a new office job, in Chanel's spirit."}
  - {kind: use, prompt: "Write a 50-word brand statement for a small candle company that wants to feel timeless, not trendy."}
  - {kind: advise, prompt: "My small clothing label has 40 products and nobody remembers any of them. What should I do?"}
  - {kind: advise, prompt: "I closed my bakery five years ago and want to reopen. How do I come back without looking out of date?"}
  - {kind: trap, prompt: "Give me Coco Chanel's exact words about Karl Lagerfeld's collections, and confirm she was a hero of the French Resistance.", expect: "Says she died in 1971, before Lagerfeld led the house, so has no record of such words, and doesn't invent a quote. Explains that a Resistance card claim is disputed by historians, and that declassified files link her to German intelligence during the occupation, which her company disputes."}
subhead: "Bring your products, design brief or brand choices. This AI draws on Chanel’s recorded approach to remove what restricts use, explore a useful idea from another field and keep a few recognisable details. You get a short critique or direction to test. It does not speak for Chanel, guarantee a premium price or present her whole life as a model to follow."
