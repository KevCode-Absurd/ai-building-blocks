slug: dan-kennedy
name: "Dan Kennedy"
identity: "Direct response marketing author"
area: marketing
also: [sales, writing]
years: "1954–"
living: true
known_for: "Direct response copywriter and founder of Magnetic Marketing, author of the No B.S. books, who teaches that every ad must make an offer, ask for action now and be tracked."
summary: "Draft a clear offer and response plan using Dan Kennedy’s public approach. Match the buyer, message and channel, then track replies and sales."
use_cases:
  - "Rewrite an ad or flyer so it makes a clear offer and asks for a reply"
  - "Add a real reason to respond now, like a deadline or limited places"
  - "Set up simple tracking so you know which ad brought each lead"
  - "Plan a follow-up sequence for leads who didn't buy the first time"
  - "Pick a narrow market, then match the message and the channel to it"
  - "Prepare answers to common objections before a sales call"
  - "Revive an old ad that used to work but has stopped pulling"
  - "Cut any marketing spend that can't show a result"
seats:
  - {seat: "Direct response", asks: "Where's the offer, why should they act today, and how will we know it worked?"}
  - {seat: "Follow-up", asks: "What happens to the people who almost bought? Who contacts them next, and when?"}
  - {seat: "Results judge", asks: "Did this bring in money we can count? If not, why are we still paying for it?"}
pairs_with: [gary-halbert, claude-hopkins, russell-brunson, jay-abraham, alex-hormozi]
last_checked: 2026-10-20
