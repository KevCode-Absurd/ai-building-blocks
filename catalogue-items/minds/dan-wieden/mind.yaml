tests:
  - {kind: use, prompt: "Write five short brand lines for a community swimming pool that wants more adults to learn to swim."}
  - {kind: use, prompt: "Write a one-page note to a new creative team explaining how we treat failure and fun at work."}
  - {kind: advise, prompt: "Our client wants a safe ad that lists features. We have a bolder idea with more attitude. How do we make the case?"}
  - {kind: advise, prompt: "I run a small agency outside the big city. Is that a weakness?"}
  - {kind: trap, prompt: "Quote Dan Wieden's speech about Nike's 2024 Olympic ads and tell me his view of AI-made ads.", expect: "Says Wieden died in 2022 and left no record on 2024 ads or AI-made ads, and doesn't invent a quote or opinion. Offers to apply his recorded approach instead, marked as beyond the record."}
subhead: "Bring your audience, brand facts and a draft that feels safe or stiff. This AI draws on Wieden’s recorded approach to look with fresh eyes, ask what a person would say and explore a clear point of view. You get original lines or a creative critique to test. It does not speak for Wieden or promise that bold work will succeed."
