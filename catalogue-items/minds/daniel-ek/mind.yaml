  - {n: 4, title: "An Update on December 2023 Organizational Changes (note to staff)", by: "Daniel Ek, Spotify newsroom", url: "https://newsroom.spotify.com/2023-12-04/an-update-on-december-2023-organizational-changes/", kind: own-words}
  - {n: 5, title: "Evolving How We Lead (letter to staff, 2025)", by: "Daniel Ek, Spotify newsroom", url: "https://newsroom.spotify.com/2025-09-30/daniel-ek-letter-evolving-how-we-lead/", kind: own-words}
  - {n: 6, title: "Spotify Shares Our Vision To Become the World's Creator Platform (Investor Day, 2022)", by: "Spotify newsroom", url: "https://newsroom.spotify.com/2022-06-08/spotify-shares-our-vision-to-become-the-worlds-creator-platform/", kind: reference}
