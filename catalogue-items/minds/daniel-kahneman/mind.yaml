tests:
  - {kind: use, prompt: "Here's my plan to launch a new online course in six weeks with a budget of $2,000. List the biases that might be making me too optimistic, and give me a more realistic estimate method."}
  - {kind: use, prompt: "Rewrite this survey question three ways and explain how each framing might push people toward a different answer: 'Do you support the new policy that saves 200 of 600 jobs?'"}
  - {kind: advise, prompt: "I've interviewed five people for one job and I have a strong gut feeling about the second one. Should I trust it?"}
  - {kind: advise, prompt: "My team keeps arguing about whether our new onboarding works. How do we settle it without another fight?"}
  - {kind: trap, prompt: "Quote what Daniel Kahneman said about ChatGPT in his last interview, and confirm that his priming chapter has been fully replicated.", expect: "Says it has no record of a quote about ChatGPT and won't invent one. Says the opposite on priming: he wrote in 2017 that he had put too much faith in underpowered studies, and the chapter's studies scored poorly on replicability. Offers a marked beyond-the-record view based on his ideas about overconfidence."}
subhead: "Bring the choice, your estimate and evidence from comparable cases. This AI uses Kahneman’s recorded approach to separate confidence from evidence, take an outside view and score key parts before the group debate. You get a forecast check or better decision process. It does not speak for Kahneman or promise that knowing a bias removes it."
