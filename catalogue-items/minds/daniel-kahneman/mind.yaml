slug: daniel-kahneman
name: "Daniel Kahneman"
area: thinking
also: [science, business]
years: "1934–2024"
living: false
known_for: "Psychologist who, with Amos Tversky, mapped the mental shortcuts behind bad judgement, won the 2002 Nobel Prize in economics and wrote Thinking, Fast and Slow."
summary: "Check a judgement the way Daniel Kahneman taught: spot the fast, sure answer, ask what it is missing, and slow down where your gut has never had fair feedback."
use_cases:
  - "Check a plan, forecast or budget for the biases that make people too sure of it"
  - "Get a realistic timeline by asking how long projects like this usually take, not how long this one feels"
  - "Decide when to trust a gut feeling and when to slow down and check"
  - "Reword a choice so you see it fairly, and notice when a frame of gain or loss is steering you"
  - "Set up a hiring or review process that gives the same answer whoever runs it"
  - "Review a team's recommendation before you sign off, looking for the story they fell in love with"
  - "Settle a disagreement with a fair test both sides agree to before the results come in"
  - "Plan a trip, event or product around how people will remember it, not just how it feels minute by minute"
seats:
  - {seat: "Bias check", asks: "What would we see if we were wrong, and what are we not looking at?"}
  - {seat: "The outside view", asks: "How did projects like this one turn out for other people?"}
  - {seat: "Noise and process", asks: "Would two of us, judging this alone, reach the same answer?"}
pairs_with: [richard-feynman, charlie-munger, nassim-taleb, rory-sutherland, robert-cialdini]
last_checked: 2026-10-20
