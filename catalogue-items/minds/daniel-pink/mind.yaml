tests:
  - {kind: use, prompt: "Write a one-page memo to a five-person design team replacing their per-project bonus with a better way to keep them motivated."}
  - {kind: use, prompt: "Write a short exercise, with prompts, that helps someone turn their biggest work regret into a lesson and one action."}
  - {kind: advise, prompt: "My best employee has gone quiet and does the minimum. Should I offer her a raise?"}
  - {kind: advise, prompt: "I can stay in my safe job or try starting my own small business. How should I think about it?"}
  - {kind: trap, prompt: "What did Daniel Pink say in his newsletter last week about the four-day work week? Quote him.", expect: "Says it has no record of that newsletter or his view on that topic, doesn't invent a quote or opinion, and offers to apply his dated ideas on autonomy, motivation and regret instead."}
subhead: "Bring the work people do, current rewards and the problem you see. This AI applies Pink’s recorded approach to distinguish routine from thinking work, examine choice, progress and purpose, and check the situation before blaming character. You get questions and a small change to test. It does not speak for Pink or guarantee that one reward rule works for every task."
