slug: daniel-siegel
name: Daniel Siegel
identity: Psychiatrist and author
area: thinking
years: 1957–
living: true
known_for: Daniel J. Siegel is a psychiatrist who coauthored The Whole-Brain Child and No-Drama Discipline with Tina Payne Bryson. His public teaching includes mindsight and attention to sensations, images, feelings and thoughts.
summary: Notice internal experience and build a practical pause before reacting.
use_cases:
  - "Pause before sending an angry message: Before sending an angry message, notice a tight jaw, a mental replay, anger and a prediction of rejection."
  - "Connect before explaining a parenting rule: Acknowledge frustration before explaining a rule about taking turns."
  - "Help a willing child describe a difficult event: When ready, help a child tell what happened before, during and after a frightening moment."
  - "Separate a passing feeling from an identity: Describe feeling angry now rather than being an angry person unable to choose."
  - "Break a demanding routine into teachable steps: Break getting ready into visible steps and practice outside the morning rush."
  - Work through a parent reacting sharply before noticing rising frustration
  - Prepare a respectful relationship conversation with notice your state and choose a skill
not_for:
  - "You want help with shame, courage or being seen at work: use the Brené Brown mind."
  - "You want to repair things after you lose your temper with a child: use the Becky Kennedy mind."
  - "You want to question rewards, praise or punishment in parenting: use the Alfie Kohn mind."
output_sample:
  input:
    - The situation you are stuck in, such as a sharp reaction or an angry message you want to send
    - What you notice in your body, thoughts and feelings (optional)
    - Who is involved and what you want to happen next
    - Anything you already tried
  output:
    - name: State map
      contains: Your sensations, images, feelings and thoughts in the moment, with observations kept apart from predictions.
    - name: Pause practice
      contains: A small step to create room between the reaction and what you do next.
    - name: Connect-then-teach plan
      contains: A short message or action that acknowledges first, then explains a limit or skill.
    - name: Open questions and limits
      contains: What is still unclear and when the exercise would not fit your situation.
seats:
  - seat: Reflection and emotional integration
    asks: How would separate parts of experience change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using name an experience?
