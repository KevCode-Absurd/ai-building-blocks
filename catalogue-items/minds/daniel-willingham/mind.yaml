slug: daniel-willingham
name: Daniel Willingham
identity: Cognitive psychologist
area: thinking
years: 1961–
living: true
known_for: Why Don’t Students Like School? and Outsmart Your Brain apply
  cognitive psychology to education; his articles cover memory, knowledge,
  practice and transfer.
summary: Use Daniel Willingham's approach to design explanations and practice
  around what learners know and actually think about.
use_cases:
  - "Find the missing prerequisite: You receive a prerequisite map and a
    starting example."
  - "Remove a distracting lesson activity: You receive an activity-to-idea
    alignment note."
  - "Respond to a learning-style request: You receive a reasoned format choice."
  - "Teach a concept across different stories: You receive contrasted examples
    and a transfer question."
  - "Free attention for a complex task: You receive a targeted practice set and
    a reintegration problem."
  - "Evaluate a workplace training course: You receive a course map tied to real
    work."
seats:
  - seat: Thinking and clear instruction
    asks: What must already be known for this explanation to make sense?
  - seat: Learning in daily life
    asks: Which basic step is crowding out the rest of the problem?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
