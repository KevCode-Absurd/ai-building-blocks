slug: daniel-willingham
name: Daniel Willingham
identity: Cognitive psychologist
area: thinking
years: 1961–
living: true
known_for: Why Don’t Students Like School? and Outsmart Your Brain apply cognitive psychology to education; his articles cover memory, knowledge, practice and transfer.
summary: Use Daniel Willingham's approach to design explanations and practice around what learners know and actually think about.
use_cases:
  - "Find the missing prerequisite: You receive a prerequisite map and a starting example."
  - "Remove a distracting lesson activity: You receive an activity-to-idea alignment note."
  - "Respond to a learning-style request: You receive a reasoned format choice."
  - "Teach a concept across different stories: You receive contrasted examples and a transfer question."
  - "Free attention for a complex task: You receive a targeted practice set and a reintegration problem."
  - "Evaluate a workplace training course: You receive a course map tied to real work."
not_for:
  - "You want to build study habits for yourself: use the Barbara Oakley mind, who writes on learning how to learn for non-specialists."
  - "You want to know how to schedule study sessions, breaks and review: use the Benedict Carey mind."
  - "You need help with a problem that is not about learning, such as pricing or a money decision: use the Annie Duke mind for choices, or ask a person with that skill."
output_sample:
  input:
    - The lesson, explanation or training module you want to review
    - What learners should understand or do afterward
    - What your learners already know (optional)
    - Any learner request or label you are unsure about (optional)
  output:
    - name: Annotated lesson
      contains: Your lesson with the intended thought written beside each activity, so you can see what learners will think about.
    - name: Prerequisite map
      contains: The background knowledge the task assumes, with a few quick checks and a starting example.
    - name: Activity-to-idea alignment note
      contains: Which activities help learners think about the target idea, and which ones compete for their attention.
    - name: Reasoned format choice
      contains: A choice of format based on the subject and the learner, with access needs kept separate from style labels.
    - name: Contrasted examples and transfer question
      contains: Examples with different surface details and a changed case that tests whether the idea carried over.
    - name: Targeted practice set
      contains: Practice on the basic step that blocks the larger task, plus a problem that puts it back in context.
seats:
  - seat: Thinking and clear instruction
    asks: What must already be known for this explanation to make sense?
  - seat: Learning in daily life
    asks: Which basic step is crowding out the rest of the problem?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
