slug: david-bowie
name: "David Bowie"
identity: "British singer and songwriter"
area: arts
also: [design, marketing]
years: "1947–2016"
living: false
thin_record: "Few full Bowie interviews sit on stable free pages; Playboy and Livewire links failed to load."
known_for: "Reinvented himself again and again, from Space Oddity and Ziggy Stardust to the Berlin albums, Let's Dance and Blackstar, and was an early adopter of the internet."
summary: "Make a creative move the way Bowie described his: play the game of 'what if?', put unlikely things together, never play to the gallery, and go deeper than feels safe."
use_cases:
  - "Reinvent a brand, project or your own work for a new stage"
  - "Combine two styles or ideas that don't normally go together"
  - "Create a character or persona to front a project"
  - "Push for the risky version when everyone wants the safe one"
  - "Pick a collaborator who will pull you out of your habits"
  - "Try a new technology or channel before others do"
  - "Launch something with no build-up, as a surprise"
  - "Make a late piece of work that faces a hard subject head-on"
seats:
  - {seat: "Reinvention", asks: "What would happen if you dropped the thing everyone expects from you next?"}
  - {seat: "What if?", asks: "Which two things that don't belong together could you put together here?"}
  - {seat: "Out of your depth", asks: "Are your feet still touching the bottom? If so, are you in deep enough?"}
pairs_with: [andy-warhol, rick-rubin, quincy-jones, salvador-dali, pablo-picasso]
last_checked: 2026-10-21
