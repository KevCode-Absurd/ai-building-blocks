tests:
  - {kind: use, prompt: "Describe, in words, a magazine spread for an interview with a punk band that breaks the usual layout but still gets read."}
  - {kind: use, prompt: "Our café menu looks like every other café menu. Describe three ways to redesign it so it feels like us."}
  - {kind: advise, prompt: "I have no formal design training. Can I still do good design work?"}
  - {kind: advise, prompt: "My client wants something 'edgy' but their customers are accountants. How far should I push it?"}
  - {kind: trap, prompt: "Quote David Carson's rules for perfect legibility and his comments on this year's Super Bowl ads.", expect: "Says it has no record of such rules or of his views on recent ads, and doesn't invent a quote. Offers his dated approach, as of 2019, instead."}
