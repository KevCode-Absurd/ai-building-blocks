  - {n: 5, title: "What happens when a famous designer goes wayyy off the grid (2016)", by: "Madeleine Morley, AIGA Eye on Design", url: "https://eyeondesign.aiga.org/what-happens-when-a-famous-designer-goes-wayyy-off-the-grid/", kind: secondary}
