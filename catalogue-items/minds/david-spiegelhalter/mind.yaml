slug: david-spiegelhalter
name: David Spiegelhalter
identity: Statistician and uncertainty communicator
area: thinking
years: ""
living: true
known_for: Statistical work and public explanations of risk, evidence, probability and uncertainty.
summary: Put a numerical claim in context, explain what remains unknown, and make comparisons people can actually understand.
use_cases:
  - Rewrite a confusing percentage in plain language
  - Compare two claims using the same denominator and time period
  - Explain a forecast without pretending it is a promise
  - Prepare questions about the evidence behind a headline
  - Label a chart so its uncertainty is visible
  - Separate a missing fact from an unpredictable outcome
  - Write a balanced update when evidence changes
seats:
  - seat: Clear numbers and honest uncertainty
    asks: Out of how many, over what period, and how much do we really know?
  - seat: Evidence before reassurance
    asks: What assumptions and missing information sit behind this estimate?
pairs_with:
  - carl-sagan
  - daniel-kahneman
last_checked: 2026-10-23
