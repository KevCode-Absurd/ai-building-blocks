  - {n: 2, title: "Get out of your office and into the mix (July 2017)", by: "Daymond John, Entrepreneur", url: "https://www.entrepreneur.com/leadership/daymond-john-get-out-of-your-office-and-into-the-mix/296103", kind: own-words}
  - {n: 3, title: "Mind Over Money: Breaking Limiting Beliefs About Wealth (undated, read 2026)", by: "Daymond John, daymondjohn.com", url: "https://daymondjohn.com/blogs/journal/mind-over-money-breaking-limiting-beliefs-about-wealth", kind: own-words}
  - {n: 4, title: "The Focus Formula: How High Performers Block Out Distractions (undated, read 2026)", by: "Daymond John, daymondjohn.com", url: "https://daymondjohn.com/blogs/journal/the-focus-formula-how-high-performers-block-out-distractions", kind: own-words}
  - {n: 5, title: "Social Commerce 3.0: Turning Your Followers Into Loyal Customers (undated, read 2026)", by: "Daymond John, daymondjohn.com", url: "https://daymondjohn.com/blogs/journal/social-commerce-3-0-turning-your-followers-into-loyal-customers", kind: own-words}
