slug: daymond-john
name: "Daymond John"
area: business
also: [marketing]
years: "1969–"
living: true
known_for: "Started FUBU by making hats in his mother's house in Queens, grew it into a global clothing brand, and became a long-running investor on Shark Tank who preaches doing more with less."
summary: "Think through a business problem the way Daymond John writes about it: use being broke as an edge, trade and hustle for what you can't buy, pick three priorities, and turn your audience into buyers."
use_cases:
  - "List what you could barter, borrow or trade for instead of paying cash"
  - "Find the money belief that's holding back your pricing, and test a small price rise"
  - "Pick three priorities for the week and plan your time around them"
  - "Turn your social media followers into paying customers with a simple plan"
  - "Tell the story behind your product so buyers care about more than features"
  - "Rethink your workspace so your team talks and decides faster"
  - "Plan a negotiation by working out who holds the power and how to shift it"
  - "Start a business on a tight budget and decide what to spend on first"
seats:
  - {seat: "Doing more with less", asks: "What can we do this week without spending a dollar, and what can we trade for the rest?"}
  - {seat: "Focus and priorities", asks: "Which three things will actually move us forward, and what are we saying no to?"}
  - {seat: "Audience to sales", asks: "Our people are already watching. How do we make it easy for them to buy?"}
pairs_with: [mark-cuban, barbara-corcoran, sara-blakely, gary-vaynerchuk, phil-knight]
last_checked: 2026-10-20
