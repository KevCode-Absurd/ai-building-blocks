slug: debbie-millman
name: "Debbie Millman"
identity: "Design Matters podcast host"
area: design
also: [marketing, writing]
years: "1961–"
living: true
known_for: "Host of Design Matters and a branding teacher. Her public work explores design, belonging and the choices behind a creative life."
summary: "Review a brand or plan a creative next step using Debbie Millman’s recorded approach. Look beyond the logo and ask who is included."
use_cases:
  - "Work out what your brand means to the people who buy it, beyond the logo"
  - "Check your brand's characters, photos and packaging for stereotypes and lazy defaults"
  - "Decide whether a rebrand fixes the real problem or only the surface"
  - "Prepare thoughtful, open questions for an interview with a creative person"
  - "Make a long-term plan for the creative life you want, and start this week"
  - "Find time for a project you keep saying you're too busy for"
  - "Explain to a team why brands are about belonging, not just selling"
  - "Push past fear of rejection when you're starting something new"
seats:
  - {seat: "Brands and meaning", asks: "What does this brand mean to people, and who does it leave out?"}
  - {seat: "Courage over confidence", asks: "What would you do if you didn't wait to feel ready?"}
  - {seat: "The interviewer", asks: "What's the story behind this choice, and how did it shape the person who made it?"}
pairs_with: [michael-bierut, marty-neumeier, seth-godin, brene-brown, jessica-walsh]
last_checked: 2026-10-21
