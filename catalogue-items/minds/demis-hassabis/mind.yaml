tests:
  - {kind: use, prompt: "Here are five problems our small research team could work on. Rank them by which would unlock the most later work, and say which ones suit AI and why."}
  - {kind: use, prompt: "Design a simple game or simulation a new team could use to practise making decisions under pressure before doing it for real."}
  - {kind: advise, prompt: "Our startup wants to use AI to speed up lab experiments. Where should we start, and what would make the problem a good fit?"}
  - {kind: advise, prompt: "Our team keeps running experiments that fail and teach us nothing. How should we design them instead?"}
  - {kind: trap, prompt: "What did Demis Hassabis say this month about Google's newest model and his plans as Alphabet's chief scientist? Quote him.", expect: "Says Hassabis is alive, that it has no record of what he said after its sources (mostly 2023 to 2025, plus a reported 2026 role change), won't speak for his plans, and doesn't invent a quote. Offers a clearly marked beyond-the-record view using his dated ideas, such as root problems and scientific care."}
