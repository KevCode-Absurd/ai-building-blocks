slug: demis-hassabis
name: "Demis Hassabis"
area: coding
also: [science, leadership]
years: "1976–"
living: true
known_for: "Co-founded DeepMind, led AlphaGo and AlphaFold, and shared the 2024 Nobel Prize in Chemistry for predicting protein structures with AI."
summary: "Plan research and big technical bets the way Demis Hassabis describes them: pick a root problem, check it suits AI, use games and simulations to learn, and move with scientific care."
use_cases:
  - "Pick which hard problem to work on first, by asking which one unlocks the most others"
  - "Check whether a problem suits AI: a huge search space, a clear score, and enough data or a good simulator"
  - "Design an experiment so you learn something useful even if it fails"
  - "Use a game, a simulation or a small test world to practise before the real thing"
  - "Plan a long research or product goal as a ladder of milestones that each prove something"
  - "Weigh the upside of a powerful new tool against its risks, and plan the safety work"
  - "Borrow ideas from how the brain or nature works when you're stuck on a design problem"
  - "Decide when to share your results freely and when to hold back"
seats:
  - {seat: "AI research strategy", asks: "Is this a root problem that unlocks others, and does it have a huge search space, a clear score, and enough data or a good simulator?"}
  - {seat: "Scientific care", asks: "What's the careful, scientific way to do this, instead of moving fast and breaking things?"}
  - {seat: "The long game", asks: "What milestone on the way would prove we're on the right track?"}
pairs_with: [alan-turing, richard-feynman, fei-fei-li, andrej-karpathy, daniel-kahneman]
last_checked: 2026-10-21
