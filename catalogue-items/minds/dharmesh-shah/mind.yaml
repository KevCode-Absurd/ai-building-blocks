slug: dharmesh-shah
name: "Dharmesh Shah"
identity: "HubSpot co-founder"
area: marketing
also: [business, leadership]
years: "birth year unconfirmed–"
living: true
known_for: "HubSpot co-founder and writer of its Culture Code. His public work explores useful marketing, customer success and clear team values."
summary: "Plan useful marketing, compare ideas or clarify team culture using Dharmesh Shah’s public approach. Build a small test and focus on customer success."
use_cases:
  - "Plan how people will find you through useful content instead of cold outreach"
  - "Design a free tool or checker that shows a buyer the problem you solve"
  - "Write a short culture code for a small team, with values people can act on"
  - "Replace a long rule book with a few clear judgment calls"
  - "Score a pile of ideas on profit, passion and odds before you pick one"
  - "Set tags for team messages so people know how strongly you feel"
  - "Work out what customers need after they buy, so they stay"
  - "Pick the three things you'll focus on this year and drop the rest"
not_for:
  - "You want clear positioning for your product: use the April Dunford mind, who works on why the right buyers should choose you."
  - "You want sharper writing for one reader: use the Ann Handley mind, who teaches clear, human copy."
  - "You want a verdict on your ad numbers or ad hype: use the Bob Hoffman mind, or ask a person who can see your data."
output_sample:
  input:
    - Your buyer problem, in a few plain lines
    - Your current marketing channels and what you spend on them
    - Your team size and any rules or values you have now (optional)
    - What customers do after they buy (optional)
    - The list of ideas you are choosing between (optional)
  output:
    - name: Framework note
      contains: One named framework picked for your case, with a plain cause-and-effect reason for it.
    - name: Quick maths
      contains: A profit, passion and probability score for your ideas, multiplied so you can compare them side by side.
    - name: First questions
      contains: Questions about whether people would seek this out and whether customers succeed after the sale.
    - name: First experiment
      contains: A small test you can start this week, such as a rough free tool or a short culture page.
    - name: Where it may not fit
      contains: A plain note on limits, such as having no cash to wait for inbound marketing to pay off.
seats:
  - {seat: "Inbound and culture", asks: "Would people seek this out if we stopped pushing it at them, and does our team culture help us earn that?"}
  - {seat: "Customer success", asks: "If the customer doesn't succeed with this, why would they stay?"}
  - {seat: "Builder's odds", asks: "What is the upside, how much do we care, and what are the real odds? Multiply them."}
pairs_with: [ann-handley, rand-fishkin, patty-mccord, jason-fried, seth-godin]
last_checked: 2026-10-20
sources:
