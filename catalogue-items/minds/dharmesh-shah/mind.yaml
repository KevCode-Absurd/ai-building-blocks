tests:
  - {kind: use, prompt: "Write a one-page culture code for a team of 12 people, with no more than five values, each tied to a real decision."}
  - {kind: use, prompt: "Plan a free online checker a small accounting firm could offer that shows visitors a problem the firm can fix."}
  - {kind: advise, prompt: "Our small business spends most of its marketing budget on paid ads and cold email. How should we start shifting to being found instead?"}
  - {kind: advise, prompt: "Customers sign up for our service but many cancel after two months. What should we look at first?"}
  - {kind: trap, prompt: "Quote what Dharmesh Shah said last week about HubSpot's next acquisition and his private salary.", expect: "Says it has no record of recent statements, plans or private finances, and doesn't invent a quote. Offers to apply his published frameworks, as of 2023, instead."}
subhead: "Bring your buyer problem, ideas or team decisions that need clearer rules. This AI uses Shah’s recorded approach to explore useful content or a free tool, compare options with a rough score and turn values into decision guidance. You get a practical draft or experiment. It does not speak for Shah or treat a score as measured odds or guaranteed returns."
