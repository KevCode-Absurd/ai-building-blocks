slug: dietrich-mateschitz
name: "Dietrich Mateschitz"
area: business
also: [marketing]
years: "1944–2022"
living: false
known_for: "Turned a Thai tonic into Red Bull in 1987, created the energy drink category, and built the brand through extreme sports, events and media instead of standard advertising."
summary: "Think through a launch or a brand the way Dietrich Mateschitz built Red Bull: create a new category instead of fighting for a share of an old one, own the culture around your product, and keep going when the tests say no."
use_cases:
  - "Describe a new category your product could own, instead of a crowded one it joins"
  - "Plan ways to put your product where your crowd already gathers, instead of buying ads"
  - "Decide whether to sponsor something or build and run it yourself"
  - "Price and position a product as the premium original, not the cheap copy"
  - "Decide what to do when early testers dislike your product"
  - "Build a brand story that people spread for you"
  - "Plan a small, bold stunt or event that shows what your brand stands for"
  - "Keep control of your company and decide what you would never sell"
seats:
  - {seat: "Creating a category", asks: "Is there a market for this yet? If not, how do we create one and own it?"}
  - {seat: "Own the culture", asks: "Where do our people already spend their time, and how do we become part of it instead of a sticker on it?"}
  - {seat: "Premium and patience", asks: "Would people pay more for the original, and are we ready to wait years for them to get it?"}
pairs_with: [phil-knight, richard-branson, al-ries, seth-godin, jack-trout]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Dietrich Mateschitz: man sollte ja niemals nie sagen (interview, January 2017)", by: "Dirk Ruschmann and Erich Gerbl, Bilanz", url: "https://www.bilanz.ch/unternehmen/portraits/dietrich-mateschitz-man-sollte-ja-niemals-nie-sagen/00rbg0v", kind: own-words}
