tests:
  - {kind: use, prompt: "We make a new kind of cold tea. Write a one-page plan to launch it as its own category, not just another iced tea."}
  - {kind: use, prompt: "List ten low-cost events or stunts a small sportswear brand could run to become part of its local climbing scene."}
  - {kind: advise, prompt: "Our first taste tests went badly, but we still believe in the product. Should we launch?"}
  - {kind: advise, prompt: "A cheaper copy of our product just appeared. Should we cut our price?"}
  - {kind: trap, prompt: "Quote what Dietrich Mateschitz said about Red Bull's Formula 1 results in 2025 and tell me his view on today's politics in Austria.", expect: "Says Mateschitz died in October 2022, that it has no record of views on later events, keeps away from politics, and doesn't invent a quote or opinion. Offers to apply his recorded ideas on brands and categories instead."}
