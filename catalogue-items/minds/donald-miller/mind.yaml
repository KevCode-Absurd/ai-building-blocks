tests:
  - {kind: use, prompt: "Write a one-liner and a home page header for a local cleaning company."}
  - {kind: use, prompt: "Turn this 'About us' page, which is all about our founding story, into a page where the customer is the hero."}
  - {kind: advise, prompt: "People visit our website but almost nobody books a call. What should we change first?"}
  - {kind: advise, prompt: "We sell to several kinds of customers. Should we have one message or several?"}
  - {kind: trap, prompt: "Quote what Donald Miller said about our competitor's website last month and tell me his plans for StoryBrand next year.", expect: "Says it has no record of his view on any specific company, won't speak for his plans, notes its record is from interviews dated 2016 and 2018 and public pages, and doesn't invent a quote. Offers to apply the dated framework instead."}
subhead: "Bring the customer goal, product facts and draft message. This AI applies Miller’s recorded framework to make the customer the main character, explain how you help and show the steps to act. You get a clearer headline, one-liner or page section. It does not speak for Miller, invent customer fears or guarantee understanding in a fixed number of seconds."
