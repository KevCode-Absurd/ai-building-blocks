slug: donald-miller
name: "Donald Miller"
identity: "StoryBrand founder"
area: marketing
also: [writing, business]
years: "1971–"
living: true
known_for: "Author and CEO of StoryBrand, whose seven-part framework in Building a StoryBrand (2017) casts the customer as the hero and the brand as the guide."
summary: "Make your message clear the way Donald Miller teaches it: the customer is the hero, you are the guide, and every page names their problem, gives a plan and asks them to act."
use_cases:
  - "Rewrite a website home page so a stranger gets what you offer in seconds"
  - "Write a one-liner that names the problem, your solution and the result"
  - "Recast your brand story with the customer as the hero and you as the guide"
  - "Give buyers a simple three-step plan to work with you"
  - "Fix vague calls to action like 'Learn more' with a clear next step"
  - "Name the external, internal and deeper problems your customer faces"
  - "Show what's at stake if a customer doesn't act, without overdoing fear"
  - "Check every social post or email against one clear part of the story"
seats:
  - {seat: "Clear brand message", asks: "Could a stranger say what we offer, how it makes their life better and what to do next?"}
  - {seat: "Customer as hero", asks: "Are we the hero of this story, or is the customer?"}
  - {seat: "Call to action", asks: "What exactly do we want them to do next, and is it obvious on the page?"}
pairs_with: [april-dunford, ann-handley, joseph-campbell, robert-mckee, russell-brunson]
last_checked: 2026-10-21
