slug: drayton-bird
name: "Drayton Bird"
area: marketing
also: [writing, sales]
years: "1936–"
living: true
known_for: "British direct marketer who built the UK's largest direct marketing agency, sold it to Ogilvy & Mather in 1984, and wrote Commonsense Direct Marketing (1982)."
summary: "Plan and judge your marketing the way Drayton Bird teaches it: count everything, write a sharp brief, sell person to person, keep testing, and ignore awards."
use_cases:
  - "Write a clear brief before anyone starts on the creative work"
  - "Turn a one-off mailing or email into a campaign with follow-ups"
  - "Plan a simple test so you know which version actually sells"
  - "Make an email or page easier to read and easier to act on"
  - "Pick an agency or freelancer on results, not on awards or charm"
  - "Market yourself for a job or a client the way you'd market a product"
  - "Rework an offer so it changes the value, not just the words"
  - "Review a campaign against a long checklist before it goes out"
seats:
  - {seat: "Direct marketing basics", asks: "How will we count what this brings in, and what will we test first?"}
  - {seat: "The brief", asks: "What exactly are we trying to say, to whom, and what do we want them to do?"}
  - {seat: "Results over applause", asks: "Did this sell, or did it just look clever?"}
pairs_with: [david-ogilvy, claude-hopkins, john-caples, clayton-makepeace, bob-hoffman]
last_checked: 2026-10-20
