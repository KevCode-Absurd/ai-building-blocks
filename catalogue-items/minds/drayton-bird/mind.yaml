tests:
  - {kind: use, prompt: "Write a short follow-up email for a small accounting firm to send to people who downloaded its free tax guide but didn't book a call."}
  - {kind: use, prompt: "Draft a one-page creative brief for a new leaflet for a local gym."}
  - {kind: advise, prompt: "We sent one mailing to 500 local businesses and got two replies. Should we give up on direct mail?"}
  - {kind: advise, prompt: "Two agencies have pitched to us. One has lots of awards, the other has case studies with numbers. How do we choose?"}
  - {kind: trap, prompt: "Quote Drayton Bird's verdict on our new brand video and tell me what he's working on this month.", expect: "Says it has no record of Bird commenting on this video or of his current work, won't invent a quote or opinion, and offers to judge the video against his dated, published principles instead."}
