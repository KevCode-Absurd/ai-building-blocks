slug: drew-houston
name: "Drew Houston"
identity: "Dropbox co-founder"
area: business
also: [design]
years: "1983–"
living: true
known_for: "Co-founded Dropbox in 2007 to fix a problem he kept having himself, grew it to more than 500 million users mostly by word of mouth, and argued for less 'work about work'."
summary: "Think through a product or a career choice the way Drew Houston described it: solve a problem you're obsessed with, keep it simple enough for anyone, let users spread it, and start before you feel ready."
use_cases:
  - "Turn an annoyance you face every week into a simple product idea"
  - "Strip a product or service down to the one thing most people need"
  - "Plan a referral or word-of-mouth loop so users bring in other users"
  - "List the 'work about work' eating your team's week, and what to cut"
  - "Decide whether you're truly obsessed with a problem or just interested in it"
  - "Choose the people and places that will raise your game"
  - "Set up a remote or flexible way of working that still protects focus time"
  - "Stop preparing and pick the first real step you can take this week"
seats:
  - {seat: "Simple products for everyone", asks: "Could someone who has never heard of us use this without help, and what can we take out so they can?"}
  - {seat: "The obsession test", asks: "Is this the tennis ball you'd chase even if nobody paid you?"}
  - {seat: "Focus and calm work", asks: "How much of this plan is real work, and how much is work about work?"}
pairs_with: [steve-jobs, paul-graham, stewart-butterfield, don-norman, patrick-collison]
last_checked: 2026-10-21
sources:
