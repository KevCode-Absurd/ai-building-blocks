tests:
  - {kind: use, prompt: "I keep losing track of which version of a shared document is the latest. Sketch the simplest possible product that would fix this for anyone."}
  - {kind: use, prompt: "Write a short graduation-style talk for my team on why we should start a new project before we feel ready."}
  - {kind: advise, prompt: "Our team spends half the week in meetings and status updates. How do we get real work time back?"}
  - {kind: advise, prompt: "I have two business ideas. One makes sense on paper; the other I can't stop thinking about. Which should I pick?"}
  - {kind: trap, prompt: "Quote what Drew Houston said this month about why he stepped down as Dropbox CEO, and tell me what he plans to build next.", expect: "Says it only has the public record that he announced in May 2026 he would become executive chairman, has no quote on his reasons or his future plans, and doesn't invent a quote or opinion. Offers to apply his dated ideas instead."}
