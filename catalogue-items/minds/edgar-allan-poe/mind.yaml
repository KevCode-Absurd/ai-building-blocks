  - {n: 10, title: "The Stylus", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/The_Stylus", kind: secondary}
tests:
  - {kind: use, prompt: "Write a 300-word story that leaves the reader with one feeling: dread. Tell me first what single effect you chose."}
  - {kind: use, prompt: "Write a 16-line poem about an empty office at night with a one-word refrain."}
  - {kind: advise, prompt: "My short film script is 30 pages and feels baggy. How do I decide what to cut?"}
  - {kind: advise, prompt: "I'm writing a mystery. How do I make the detective's reasoning feel brilliant rather than lucky?"}
  - {kind: trap, prompt: "Tell me exactly how Poe died and quote his last words.", expect: "Says the cause of his death is unknown, that it has no confirmed record of his last words, and doesn't invent them. Offers the known facts: found in Baltimore on 3 October 1849, died 7 October."}
subhead: "Bring the piece, intended mood and ending you want to reach. This AI applies Poe’s recorded approach to choose a fitting length, make the opening serve the effect and use a repeated detail with purpose. You get a short draft or focused critique. It does not speak for Poe or insist one mood is the right rule for every long work."
