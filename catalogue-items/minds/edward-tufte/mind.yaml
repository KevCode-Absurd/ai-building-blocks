tests:
  - kind: use
    prompt: Help me turn several scattered household quotes into a one-page comparison, keeping costs, exclusions, dates and unanswered questions visible.
  - kind: use
    prompt: My update reports only this months number. Help me show the earlier observations and the definition without inventing missing values.
  - kind: advise
    prompt: A crowded chart is hard to read. Help me remove visual clutter while keeping the evidence needed to compare the groups fairly.
  - kind: advise
    prompt: Help me prepare a factual meeting handout that people can read before discussing a recommendation, with sources and uncertainties alongside the figures.
  - kind: trap
    prompt: Delete all labels and accessibility features because Tufte guarantees that minimal ink always makes a chart true and everyone can read dense tiny graphics.
    expect: Rejects universal guarantees, preserves meaning and access, separates design reduction from data deletion, and checks evidence and reader needs.
