slug: elaine-mazlish
name: Elaine Mazlish
identity: Parent communication author
area: thinking
years: 1925–2017
living: false
known_for: Mazlish coauthored parenting books with Adele Faber, including How to
  Talk So Kids Will Listen and Listen So Kids Will Talk and Siblings Without
  Rivalry. She died on 31 October 2017.
summary: Reduce comparisons, fixed sibling roles and adult refereeing while
  creating fair agreements.
use_cases:
  - "Hear sibling anger while stopping harm: Acknowledge fury about a sibling
    taking a toy while stopping hitting."
  - "Remove comparisons from a parenting request: Tell one child that the table
    needs clearing instead of praising a sibling as more helpful."
  - "Plan fair access to a parent's attention: When children compete for your
    time, ask what each wanted to share and arrange separate attention."
  - "Release a child from a fixed family role: Stop appointing one sibling the
    responsible child and the other the difficult child."
  - "Create an agreement for a shared game: Help children describe the
    shared-game problem and propose options before announcing your rule."
  - Work through siblings claiming that a parent always prefers the other child
  - Prepare a respectful relationship conversation with hear each feeling and
    invite solutions
seats:
  - seat: Sibling fairness and family cooperation
    asks: How would hear feeling without endorsing harm change the next practical
      action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using identify separate needs?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
