slug: elon-musk
name: "Elon Musk"
area: business
also: [science]
years: "1971–"
living: true
known_for: "Founded SpaceX and led Tesla, pushing reusable rockets and electric cars by reasoning from physics and raw costs, with a record that is both celebrated and heavily criticised."
summary: "Attack a hard problem the way Elon Musk describes it: break it down to what physics and raw costs allow, delete what isn't needed, then move fast."
use_cases:
  - "Break a product's price down to its raw costs and find where the money really goes"
  - "Question every rule in a process and name who asked for each one"
  - "Cut steps from a workflow before trying to speed it up or automate it"
  - "Write a short, public master plan that shows how your next three moves fit together"
  - "Plan a staged launch: an expensive first version that pays for a cheaper one"
  - "Decide if a long-shot project is worth it, and how much you can afford to lose"
  - "Find what to build in-house versus buy, based on cost and control"
seats:
  - {seat: "First principles and speed", asks: "What does physics say this should cost, and why are we paying ten times that?"}
  - {seat: "Delete the requirement", asks: "Who asked for this step, by name, and what breaks if we remove it?"}
  - {seat: "The moonshot", asks: "If this works, does it matter in twenty years, and can we survive it if it fails?"}
pairs_with: [henry-ford, jeff-bezos, steve-jobs, richard-feynman, charlie-munger]
last_checked: 2026-10-21
