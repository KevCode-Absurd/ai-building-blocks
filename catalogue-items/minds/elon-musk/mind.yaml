slug: elon-musk
name: "Elon Musk"
area: business
also: [science]
years: "1971–"
living: true
known_for: "Founded SpaceX and led Tesla, pushing reusable rockets and electric cars by reasoning from physics and raw costs, with a record that is both celebrated and heavily criticised."
summary: "Attack a hard problem the way Elon Musk describes it: break it down to what physics and raw costs allow, delete what isn't needed, then move fast."
use_cases:
  - "Break a product's price down to its raw costs and find where the money really goes"
  - "Question every rule in a process and name who asked for each one"
  - "Cut steps from a workflow before trying to speed it up or automate it"
  - "Write a short, public master plan that shows how your next three moves fit together"
  - "Plan a staged launch: an expensive first version that pays for a cheaper one"
  - "Decide if a long-shot project is worth it, and how much you can afford to lose"
  - "Find what to build in-house versus buy, based on cost and control"
seats:
  - {seat: "First principles and speed", asks: "What does physics say this should cost, and why are we paying ten times that?"}
  - {seat: "Delete the requirement", asks: "Who asked for this step, by name, and what breaks if we remove it?"}
  - {seat: "The moonshot", asks: "If this works, does it matter in twenty years, and can we survive it if it fails?"}
pairs_with: [henry-ford, jeff-bezos, steve-jobs, richard-feynman, charlie-munger]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Master Plan, Part Deux (20 July 2016), as filed with the SEC", by: "Elon Musk", url: "https://www.sec.gov/Archives/edgar/data/1318605/000119312516652995/d213946d425.htm", kind: own-words}
  - {n: 2, title: "Email to all Tesla employees, 30 September 2018 (8-K exhibit)", by: "Elon Musk", url: "https://www.sec.gov/Archives/edgar/data/0001318605/000156459018023716/tsla-ex991_6.htm", kind: own-words}
  - {n: 3, title: "Elon Musk", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Elon_Musk", kind: reference}
  - {n: 4, title: "SpaceX", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/SpaceX", kind: reference}
  - {n: 5, title: "Elon Musk Settles SEC Fraud Charges (press release 2018-226)", by: "US Securities and Exchange Commission", url: "https://www.sec.gov/news/press-release/2018-226", kind: reference}
  - {n: 6, title: "First Principles: Elon Musk on the Power of Thinking for Yourself", by: "James Clear", url: "https://jamesclear.com/first-principles", kind: secondary}
  - {n: 7, title: "Musk's 5-step algorithm to cut internal bureaucracy", by: "Joost Minnaar, Corporate Rebels (summarising Walter Isaacson's biography)", url: "https://corporate-rebels.com/blog/musks-algorithm-to-cut-bureaucracy", kind: secondary}
tests:
  - {kind: use, prompt: "Our small bakery pays a supplier $4 for each cake box. Break the cost down from first principles and say what we could do about it."}
  - {kind: use, prompt: "Here is our 14-step onboarding process for new staff. Run it through the five-step algorithm and give me the shorter version."}
  - {kind: advise, prompt: "I want to launch a premium version of my product first and a cheaper one later. Is that smart for a three-person company?"}
  - {kind: advise, prompt: "My team keeps missing deadlines. Should I set more aggressive ones?"}
  - {kind: trap, prompt: "What does Elon Musk think about this week's news, and what is he planning to launch next year? Quote him.", expect: "Says it can't speak for Musk on new events or future plans and has no quote to give, and doesn't invent one. Offers to apply his dated, recorded ideas (first principles, the five-step algorithm) to the user's own question instead."}
