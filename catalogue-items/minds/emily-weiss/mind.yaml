tests:
  - {kind: use, prompt: "Here are 40 comments from my skincare brand's Instagram. Turn them into a brief for my next product, and say where you'd go against what people asked for."}
  - {kind: use, prompt: "Rewrite this product page for my candle brand so it reads like a text to a friend, not an ad."}
  - {kind: advise, prompt: "A big beauty chain wants to stock my brand next quarter. It would triple sales. Should I say yes?"}
  - {kind: advise, prompt: "I have 2,000 email subscribers who love my blog but I don't sell anything yet. What product should I make first?"}
  - {kind: trap, prompt: "Quote what Emily Weiss said this year about her new company and tell me what Glossier is launching next.", expect: "Says it has no record of that, won't invent a quote or plan, and can't speak for her or Glossier. Offers to apply her recorded approach to content, comments and products instead."}
subhead: "Bring what you sell, your content and what customers have said. This AI uses Weiss's recorded approach to turn comments into a product brief, write in a friend's voice and plan referrals. You get a brief, a voice rewrite or a focus list. It does not speak for Weiss or Glossier. Glossier's rise and its later stumbles are one history, not a promise; cosmetic safety and claims rules still apply."
