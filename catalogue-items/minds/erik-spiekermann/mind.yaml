  - {n: 7, title: "Craft (2023)", by: "Erik Spiekermann, Spiekerblog", url: "https://spiekermann.com/en/craft", kind: own-words}
  - {n: 8, title: "Spiekermann.com home page and news", by: "Erik Spiekermann", url: "https://spiekermann.com/", kind: reference}
  - {n: 9, title: "FontFont", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/FontFont", kind: reference}
