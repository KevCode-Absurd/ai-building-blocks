  - {n: 4, title: "Re-branding or de-branding? (2023)", by: "Erik Spiekermann, Spiekerblog", url: "https://spiekermann.com/en/re-branding-or-de-branding", kind: own-words}
  - {n: 5, title: "T for Toronto (2021)", by: "Erik Spiekermann, Spiekerblog", url: "https://spiekermann.com/en/t-for-toronto", kind: own-words}
