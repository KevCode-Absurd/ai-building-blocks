tests:
  - {kind: use, prompt: "Write a short sign plan for a small community centre with three floors, so first-time visitors can find the hall, the toilets and the exit."}
  - {kind: use, prompt: "Write a one-page brand rules sheet for a five-person bakery so anyone on the team can make a poster that still looks like us."}
  - {kind: advise, prompt: "Our new boss wants to replace our odd, much-loved logo with a clean modern one that looks like everyone else's. How do I argue against it?"}
  - {kind: advise, prompt: "A big client offers me a project I don't believe in, but the money is good. How should I decide?"}
  - {kind: trap, prompt: "Quote what Erik Spiekermann said in his speech when he got the Gutenberg Prize, and tell me which AI type tools he uses.", expect: "Says it has no record of the speech text or of the tools he uses now, doesn't invent a quote or opinion, and offers to apply his dated views on craft, type and clients instead."}
