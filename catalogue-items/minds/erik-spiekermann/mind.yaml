slug: erik-spiekermann
name: "Erik Spiekermann"
identity: "FF Meta type designer"
area: design
also: [business]
years: "1947–"
living: true
known_for: "Co-founded MetaDesign and FontShop, designed FF Meta and Berlin's yellow BVG transit system, and wrote Stop Stealing Sheep."
summary: "Work through type, signs and brand systems the way Erik Spiekermann writes about them: make information people can trust, give a brand real character, respect your tools and argue with the client when it helps the work."
use_cases:
  - "Plan signs and wayfinding so first-time visitors never get lost"
  - "Build one clear visual identity across many products, places or teams"
  - "Pick a working typeface for text that has to read well at small sizes"
  - "Push back on a rebrand that makes you look like everyone else"
  - "Prepare to argue for a design choice with a client or a boss"
  - "Decide whether to take on a project, using three plain questions"
  - "Design inside tight limits, such as one colour, one typeface or a fixed grid"
  - "Make a set of rules so others can use your design system without you"
seats:
  - {seat: "Type that works", asks: "Can someone read this quickly, from where they will really stand, in bad light?"}
  - {seat: "Information you can trust", asks: "If a stranger used this for the first time, would they know where to go and trust what it tells them?"}
  - {seat: "Brand character", asks: "If we cover the logo, would anyone still know it's us, or are we just the beigest one in the room?"}
pairs_with: [neville-brody, ellen-lupton, otl-aicher, massimo-vignelli, wim-crouwel]
last_checked: 2026-10-20
sources:
