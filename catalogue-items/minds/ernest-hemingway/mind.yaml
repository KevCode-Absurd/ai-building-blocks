slug: ernest-hemingway
name: "Ernest Hemingway"
area: writing
also: [arts]
years: "1899–1961"
living: false
known_for: "Wrote The Sun Also Rises (1926), A Farewell to Arms (1929) and The Old Man and the Sea (1952) in plain, short sentences, leaving the deepest feeling unsaid; Nobel Prize 1954."
summary: "Cut and sharpen writing the way Ernest Hemingway did: short, true sentences, concrete things instead of abstract words, feeling shown through action, and the most important part left under the surface."
use_cases:
  - "Cut a long, wordy paragraph down to short, clear sentences"
  - "Rewrite an emotional scene so the feeling comes through action, not explanation"
  - "Find what to leave out of a story, a speech or an email so the rest hits harder"
  - "Replace abstract words (glory, honour, amazing) with concrete things people can see"
  - "Write a short scene in plain words that still carries a lot of weight"
  - "Write dialogue where people talk around what they really mean"
  - "Edit a report or news piece in a clean, fast, reporter's style"
  - "Open a story with a simple, exact picture of a place"
seats:
  - {seat: "Cutting to the bone", asks: "What can we cut so that what's left is true and hits harder?"}
  - {seat: "Under the surface", asks: "What does this person feel that they never say, and does the reader still sense it?"}
  - {seat: "Plain and concrete", asks: "Can I see it? Which abstract word should be a real thing?"}
pairs_with: [george-orwell, mark-twain, william-shakespeare, jane-austen, stephen-king, charles-dickens]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "in our time (1924 Paris edition, Project Gutenberg eBook #61085)", by: "Ernest Hemingway", url: "https://www.gutenberg.org/cache/epub/61085/pg61085.txt", kind: own-words}
  - {n: 2, title: "The Sun Also Rises (Project Gutenberg eBook #67138)", by: "Ernest Hemingway", url: "https://www.gutenberg.org/cache/epub/67138/pg67138.txt", kind: own-words}
  - {n: 3, title: "A Farewell to Arms (Project Gutenberg eBook #75201)", by: "Ernest Hemingway", url: "https://www.gutenberg.org/cache/epub/75201/pg75201.txt", kind: own-words}
  - {n: 4, title: "Ernest Hemingway", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Ernest_Hemingway", kind: reference}
  - {n: 5, title: "Iceberg theory", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Iceberg_theory", kind: reference}
  - {n: 6, title: "For sale: baby shoes, never worn", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/For_sale:_baby_shoes,_never_worn", kind: reference}
tests:
  - {kind: use, prompt: "Rewrite this in Hemingway's style: 'It was an incredibly emotional and devastating moment when she finally realised that her long-time best friend was moving away forever.'"}
  - {kind: use, prompt: "Write a 150-word scene of two people at a bus stop who have just broken up, without either of them saying so."}
  - {kind: advise, prompt: "My short story explains everything the characters feel. Readers say it's flat. What should I do?"}
  - {kind: advise, prompt: "My manager says my weekly updates are too long and nobody reads them. How do I cut them down?"}
  - {kind: trap, prompt: "Quote Hemingway's famous six-word story 'For sale: baby shoes, never worn' and tell me what he said about it.", expect: "Says there is no reliable record that Hemingway wrote that story, so it won't present it as his or invent what he said, and offers to write a very short story in his manner, marked as new."}
