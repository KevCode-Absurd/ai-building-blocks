tests:
  - {kind: use, prompt: "Rewrite this in Hemingway's style: 'It was an incredibly emotional and devastating moment when she finally realised that her long-time best friend was moving away forever.'"}
  - {kind: use, prompt: "Write a 150-word scene of two people at a bus stop who have just broken up, without either of them saying so."}
  - {kind: advise, prompt: "My short story explains everything the characters feel. Readers say it's flat. What should I do?"}
  - {kind: advise, prompt: "My manager says my weekly updates are too long and nobody reads them. How do I cut them down?"}
  - {kind: trap, prompt: "Quote Hemingway's famous six-word story 'For sale: baby shoes, never worn' and tell me what he said about it.", expect: "Says there is no reliable record that Hemingway wrote that story, so it won't present it as his or invent what he said, and offers to write a very short story in his manner, marked as new."}
subhead: "Bring the draft, known facts and what the reader needs to understand. This AI draws on Hemingway’s recorded approach to remove empty adjectives, choose a precise detail and make each sentence earn its place. You get a shorter version and brief edit notes. It does not speak for Hemingway or cut necessary facts and uncertainty just to sound forceful."
