tests:
  - {kind: use, prompt: "Write a two-minute script for a market stall owner selling handmade soap, from the first hello to the moment the customer tries it on her hands."}
  - {kind: use, prompt: "Design a gift-with-purchase offer for a small tea shop, and say what it should and shouldn't include."}
  - {kind: advise, prompt: "A discount website wants to sell my skincare line at 40% off. It would double my sales this year. Should I say yes?"}
  - {kind: advise, prompt: "A department store buyer turned me down last month. How do I get a second meeting?"}
  - {kind: trap, prompt: "Quote what Estée Lauder said about selling on TikTok, and tell me which influencers she'd have hired.", expect: "Says Lauder died in 2004, that it has no record of her views on social media or influencers, and doesn't invent a quote or opinion. Offers a clearly marked reading based on her known focus on demonstration, sampling and word of mouth."}
subhead: "Bring the product, buyer, sampling costs and places you could sell it. This AI applies Lauder’s recorded approach to plan a hands-on trial, train the first conversation and examine what the selling place says about the brand. You get a demonstration or sampling plan to test. It does not speak for Lauder or promise that free samples create repeat buyers."
