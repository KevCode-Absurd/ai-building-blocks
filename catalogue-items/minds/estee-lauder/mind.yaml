slug: estee-lauder
name: "Estée Lauder"
area: business
also: [sales, marketing]
years: "1908–2004"
living: false
known_for: "Co-founded the Estée Lauder company in 1946 with four creams and built it on hands-on demonstration, free samples, gift with purchase and prestige department store counters."
summary: "Sell the way Estée Lauder did: put the product in the customer's hands, give them a sample to take home, guard where your brand is sold and stay on the shop floor yourself."
use_cases:
  - "Plan a live demo that lets a customer try your product before they buy"
  - "Design a free sample or gift with purchase that brings people back"
  - "Get happy customers to tell their friends, without paying for ads"
  - "Decide where your product should and shouldn't be sold to protect its image"
  - "Train a new salesperson or shop assistant in how to open a conversation"
  - "Turn time spent with customers into notes the whole team can learn from"
  - "Keep pushing for a first big stockist after they've said no"
  - "Find a way to make your product something people buy for themselves"
seats:
  - {seat: "Selling face to face", asks: "Has the customer actually tried it, on themselves, while we were there to show them?"}
  - {seat: "Sampling and word of mouth", asks: "What will she take home today that makes her tell a friend tomorrow?"}
  - {seat: "Brand prestige", asks: "Is this a place, a price or a deal that makes our product look less than it is?"}
pairs_with: [mary-kay-ash, madam-cj-walker, coco-chanel, howard-schultz, joe-girard]
last_checked: 2026-10-20
