slug: esther-perel
name: Esther Perel
identity: Relationship psychotherapist
area: thinking
years: 1958–
living: true
known_for: Perel is a Belgian-born psychotherapist and author of Mating in
  Captivity. Her public writing explores otherness, desire, ambivalence and
  relationship accountability.
summary: Renew curiosity and negotiate independence, togetherness and clear
  relationship expectations.
use_cases:
  - "Negotiate time together and time apart: Protect a personal interest for
    each partner, then ask what was absorbing instead of monitoring the time."
  - "See your partner beyond a household role: Watch a partner teach, make music
    or solve a problem, then ask about that part of their life."
  - "Start a more curious conversation: Ask what would interest your friend this
    month instead of predicting rejection of every plan."
  - "Sort mixed feelings before a relationship decision: List what you value and
    what repeatedly hurts, then identify the decision actually due."
  - "End a dating ambiguity kindly: If you do not want another date, send a kind
    clear message instead of contacting someone only when lonely."
  - Work through a partnership reduced to household management
  - Prepare a respectful relationship conversation with describe the story and
    clarify expectations
seats:
  - seat: Closeness, autonomy and curiosity
    asks: How would closeness and separateness change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using curiosity exceeds certainty?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
