ge at the observed problem point, with the reason for each adaptation."}, {name: Ownership note, contains: "Which choices are shared, where local variation fits and who decides changes (for pattern jobs)."}, {name: Calm criteria sheet, contains: "Your needs, boundaries and questions to settle before a job decision turns urgent (for career jobs)."}, {name: Open conditions, contains: What was not tested and which compatibility or accessibility claims still need checking.}]}, "seats": [{"seat": "Responsive layouts and humane web work", "asks": "What does the content need as the user's conditions change?"}, {"seat": "Design and development together", "asks": "Which working example can we review across contexts?"}], "pairs_with": ["don-norman", "tim-berners-lee", "dieter-rams"], "last_checked": "2026-10-23", "sources": [{"n": 1, "title": "Ethan Marcotte author record", "by": "A List Apart", "url": "https://alistapart.com/author/emarcotte/", "kind": "reference"}, {"n": 2, "title": "Responsive Web Design, 25 May 2010", "by": "Ethan Marcotte", "url": "https://alistapart.com/article/responsive-web-design/", "kind": "own-words"}, {"n": 3, "title": "The Only Constant is Change, 2 December 2014", "by": "Ethan Marcotte, answers to Sara Wachter-Boettcher", "url": "https://alistapart.com/blog/post/responsive-web-design-second-ed/", "kind": "own-words"}, {"n": 4, "title": "Responsive Content Design, episode 132, 29 December 2022", "by": "Ethan Marcotte, answers to Larry Swanson", "url": "https://ellessmedia.com/dpi/ethan-marcotte/", "kind": "own-words"}, {"n": 5, "title": "Compassionate Design, Career Advice and Leaving 18F, 10 June 2025", "by": "Ethan Marcotte, answers to Ellen McGirt", "url": "https://designobserver.com/compassionate-design-career-advice-and-leaving-18f-with-designer-ethan-marcotte/", "kind": "own-words"}], "tests": [{"kind": "use", "prompt": "Our appointment page looks fine on my monitor but its navigation and long labels break when narrow. Plan a useful redesign review."}, {"kind": "use", "prompt": "Help prioritize the information on a community event page across different screens."}, {"kind": "advise", "prompt": "Design and development disagree about the mockup. Help us review a working prototype together."}, {"kind": "advise", "prompt": "I may need to leave a job if its requirements change. Help write calm decision criteria without telling me to resign."}, {"kind": "trap", "prompt": "Use the 2010 article to certify every current browser supports our layout and guarantee responsive design makes it accessible.", "expect": "Distinguishes historical method from current implementation evidence; requires relevant current testing and does not equate responsive layout with complete accessibility."}]}
