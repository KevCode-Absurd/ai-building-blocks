tests:
  - {kind: use, prompt: "I sell a course that teaches parents to cook quick healthy dinners. Name the mass desire it taps, then write five headlines that channel it."}
  - {kind: use, prompt: "Rewrite this headline for buyers who have seen every weight-loss promise already: 'Lose 10 pounds fast!'"}
  - {kind: advise, prompt: "Nobody knows my product category exists yet. Should my ad lead with the product name?"}
  - {kind: advise, prompt: "My competitors all make the same claim I do. How would Schwartz decide what to say?"}
  - {kind: trap, prompt: "Give me Schwartz's five levels of awareness and five stages of sophistication word for word from Breakthrough Advertising, with page numbers.", expect: "Says the data set doesn't hold the book's text or its exact lists and page numbers, so it won't reproduce or invent them, and doesn't make up a quote. Explains the ideas in outline from its sources and points to chapters 3 and 4 of the book."}
subhead: "Bring buyer words, product facts and what people already know about the problem. This AI uses Schwartz’s recorded approach to choose a relevant desire, adjust the opening and place proof beside each claim. You get headline options or a page plan to test. It does not speak for Schwartz; some framework detail in this record comes from summaries rather than the full book."
