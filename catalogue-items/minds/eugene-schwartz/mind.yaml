slug: eugene-schwartz
name: "Eugene Schwartz"
identity: "Breakthrough Advertising author"
area: marketing
also: [writing, sales]
years: "1927–1995"
living: false
thin_record: "Only three of his own-word sources are online: excerpts of the book introduction, a 1993 lecture transcript and a c. 1975 magazine interview; the book itself is in copyright and his recorded seminars are sold behind paywalls."
known_for: "Author of Breakthrough Advertising and a sales copywriter. His recorded teaching starts with existing buyer wants, product research and proof that fits the claim."
summary: "Match a headline or sales page to what buyers already want and know. Apply Eugene Schwartz’s recorded approach to research, claims and proof."
use_cases:
  - "Find the strongest desire your buyers already have before you write a word"
  - "Rewrite a headline so it channels a want people already feel"
  - "Sort your buyers by how much they already know about the problem and your product"
  - "Decide what to say when buyers have heard every claim in your market before"
  - "Show how your product's results lead to the change the buyer wants"
  - "Trade a skill for an asset you need, such as access to an audience"
  - "Plan a focused writing session and stick to it"
  - "Turn a long list of features into the one promise that matters"
not_for:
  - "You want tested ads built on product facts, samples and coded replies: use the Claude Hopkins mind."
  - "You need a clear market position or a reason the right buyers should pick you: use the April Dunford mind."
  - "You want a long letter built on one reader's real concern, with benefits and proof: use the Clayton Makepeace mind."
output_sample:
  input:
    - A short description of your buyer and what they say in their own words
    - Your product facts and what it does for them
    - What buyers already know about the problem and about you
    - Your current headline or sales page (optional)
    - The claims your rivals make (optional)
  output:
    - name: The want in one line
      contains: The strong want your buyers already feel that your product can reach.
    - name: What the product does
      contains: A list of things the product does for that want, with the strongest one picked.
    - name: Claims and customer words
      contains: A list of claims and the words buyers use, collected from your material.
    - name: Claim map
      contains: Where each claim goes in the piece and what must come before it.
    - name: Headline options
      contains: A few headlines that name the want, with one pick and the reason.
    - name: Two tests
      contains: Two very different versions to test on your own channel.
    - name: Notes on sources
      contains: Where advice goes beyond the record or comes from a summary, not the book.
seats:
  - {seat: "Desire and awareness", asks: "What does this market already want, and how much does it already know?"}
  - {seat: "Market sophistication", asks: "How many times have these buyers heard this claim before, and what would be new to them?"}
  - {seat: "The headline", asks: "Does the headline channel a desire they already have, or try to create one?"}
pairs_with: [claude-hopkins, gary-halbert, joseph-sugarman, david-ogilvy, robert-cialdini]
last_checked: 2026-10-21
