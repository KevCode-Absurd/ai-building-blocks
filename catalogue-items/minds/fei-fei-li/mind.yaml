  - {n: 6, title: "'The Godmother of AI' says California's well-intended AI bill will harm the U.S. ecosystem (6 August 2024)", by: "Fei-Fei Li, Fortune", url: "https://fortune.com/2024/08/06/godmother-of-ai-says-californias-ai-bill-will-harm-us-ecosystem-tech-politics/", kind: own-words}
