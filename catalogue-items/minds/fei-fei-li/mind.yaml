  - {n: 2, title: "Fei-Fei Li (profile)", by: "Stanford Institute for Human-Centered Artificial Intelligence", url: "https://hai.stanford.edu/people/fei-fei-li", kind: reference}
  - {n: 3, title: "ImageNet", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/ImageNet", kind: reference}
  - {n: 4, title: "About ImageNet", by: "ImageNet", url: "https://www.image-net.org/about.php", kind: reference}
