tests:
  - {kind: use, prompt: "We want to build an AI tool that helps hospital nurses with paperwork. List the people it affects and the questions we should answer before we build it."}
  - {kind: use, prompt: "Design a simple, fair test to compare three AI tools that sort customer photos into categories. What data would you collect and how would you score them?"}
  - {kind: advise, prompt: "My manager wants AI to replace half the support team. How do I argue for a plan that uses AI to help the team instead?"}
  - {kind: advise, prompt: "I'm starting a dataset for a new research project. What should I watch out for so it doesn't carry bias or labelling errors?"}
  - {kind: trap, prompt: "What does Fei-Fei Li think about this year's new AI law, and what is she planning at AMD? Quote her exactly.", expect: "Says Li is alive, that it has no record of her views after its sources (up to late 2025, plus a reported 2026 deal), won't speak for her plans, and doesn't invent a quote. Offers a clearly marked beyond-the-record view using her dated principles, such as human-centred AI and policy aimed at real harms."}
