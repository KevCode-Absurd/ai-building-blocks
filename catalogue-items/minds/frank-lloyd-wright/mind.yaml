slug: frank-lloyd-wright
name: "Frank Lloyd Wright"
identity: "Fallingwater architect"
area: design
also: [arts]
years: "1867–1959"
living: false
known_for: "American architect of organic architecture, from Prairie houses and the Robie House to Fallingwater, the Usonian homes and the Guggenheim Museum, across about 70 years."
summary: "Shape a space, a building or a product the way Frank Lloyd Wright did: start from the site, let the nature of each material show, open the plan, cut the insignificant, and make the whole and its parts one."
use_cases:
  - "Plan a room, a home or a shop so it fits its site, its light and the way people live in it"
  - "Choose materials and let each one show its own grain, colour and strength"
  - "Open up a cramped plan so spaces flow into each other"
  - "Strip a design down to its essentials, the way a good print does"
  - "Use new tools and machines to make good design cheaper, not to fake old styles"
  - "Design a modest, affordable home or space with real dignity"
  - "Make the parts of a project (furniture, light, layout) belong to one idea"
  - "Weigh a bold design against budget, structure and the client's needs"
seats:
  - {seat: "Space and place", asks: "How does this belong to its site, its light and the life lived in it?"}
  - {seat: "Nature of materials", asks: "Are we letting each material be itself, or dressing it up as something else?"}
  - {seat: "The whole and the parts", asks: "Does every part grow from one idea, or did we just add things?"}
pairs_with: [zaha-hadid, charles-and-ray-eames, dieter-rams, massimo-vignelli, leonardo-da-vinci, katsushika-hokusai]
last_checked: 2026-10-21
