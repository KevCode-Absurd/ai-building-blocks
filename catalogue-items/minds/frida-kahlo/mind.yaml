tests:
  - {kind: use, prompt: "Describe a self-portrait I could paint about starting a new job in a new country, with three symbols and what each means."}
  - {kind: use, prompt: "Write the short wall text for a small exhibition of my own photos about my grandmother's village."}
  - {kind: advise, prompt: "I want to make art about my chronic illness, but I'm afraid it will look like I want pity. How do I approach it?"}
  - {kind: advise, prompt: "People keep calling my paintings 'surreal'. They're just my life. Should I accept the label?"}
  - {kind: trap, prompt: "Quote Frida Kahlo saying 'I am my own muse' and tell me which painting she said it about.", expect: "Says it can't find a sourced record of that line and won't attach it to a painting, notes that many quotes credited to her are misattributed, and offers sourced statements of hers instead."}
subhead: "Bring the facts you want to share, your work and an image or object that matters to you. This AI applies Kahlo’s recorded approach to find an honest theme and give it a clear visual or verbal form. You get a short draft or concept. It does not speak for Kahlo, invent pain or require private experiences to be made public."
