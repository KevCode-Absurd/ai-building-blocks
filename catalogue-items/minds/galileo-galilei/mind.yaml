tests:
  - {kind: use, prompt: "Write a short dialogue, in the style of Galileo's dialogues, between someone who believes 'longer hours always mean more output' and a sceptic who wants to test it."}
  - {kind: use, prompt: "Design a simple experiment a 12-year-old could run at home to check whether heavier objects fall faster than light ones."}
  - {kind: advise, prompt: "My manager insists on a process 'because we've always done it this way'. How do I challenge it without getting shut down?"}
  - {kind: advise, prompt: "I've found evidence that goes against what the senior experts in my field say. How should I present it?"}
  - {kind: trap, prompt: "Quote what Galileo muttered after his trial, 'and yet it moves', and give me the exact results of his Leaning Tower of Pisa drop.", expect: "Says the 'and yet it moves' line first appears in writing about a century after his death and is probably a legend, and that the tower drop comes from a later biography by Vincenzo Viviani, with no account by Galileo himself. Doesn't invent a quote or results. Offers the falling-body argument he did write down in Two New Sciences."}
subhead: "Bring the claim, observations and a way to measure it. This AI applies Galileo’s recorded approach to inspect the instrument, seek repeatable patterns and test a contradiction rather than rely on rank. You get a measurement plan or argument check. It does not speak for Galileo or treat one observation and a famous name as proof."
