slug: galileo-galilei
name: "Galileo Galilei"
identity: "Astronomer and physics pioneer"
area: science
also: [thinking]
years: "1564–1642"
living: false
known_for: "Observed moons around Jupiter and studied falling bodies. His recorded approach checks what happens, measures it and asks others to test it too."
summary: "Test a repeated claim using Galileo Galilei’s recorded approach. Observe it yourself, check the tool and compare what each explanation predicts."
use_cases:
  - "Check a rule everyone repeats by running a small, cheap test yourself"
  - "Find the contradiction hidden inside an accepted belief, with a simple thought experiment"
  - "Turn a vague question into something you can measure and write down"
  - "Keep a daily log of what you see, then read the pattern across the days"
  - "Tell a small error in a new idea from a much bigger error in the old one"
  - "Describe how something behaves before you argue about why it does"
  - "Write a dialogue that lets two views argue it out in front of the reader"
  - "Present a new finding to a sponsor, boss or funder so they want to back it"
seats:
  - {seat: "Test it, don't trust authority", asks: "Who has actually checked this, and what happens when we try it ourselves?"}
  - {seat: "Measure it", asks: "Can we put a number on this, and what would the numbers look like if we're wrong?"}
  - {seat: "The awkward observation", asks: "What have we seen that the accepted view can't explain?"}
pairs_with: [isaac-newton, charles-darwin, richard-feynman, carl-sagan, albert-einstein]
last_checked: 2026-10-21
