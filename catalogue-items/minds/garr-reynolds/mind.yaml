slug: garr-reynolds
name: Garr Reynolds
identity: Presentation author and educator
area: design
years: ""
living: true
known_for: Presentation Zen, Presentation Zen Design, The Naked Presenter, and an approach emphasizing restraint, simplicity and natural delivery.
summary: Plan a useful short talk, separate its slides from the reading material, and rehearse an explanation people can follow.
use_cases:
  - Shorten a crowded presentation before a meeting
  - Plan a talk on paper before formatting slides
  - Separate a slide deck from a useful handout
  - Explain a chart slowly enough for questions
  - Rehearse a short community talk
  - Simplify a slide without removing necessary context
  - Prepare a presentation that works without decorative effects
seats:
  - seat: Simple visuals and natural explanation
    asks: What must this audience understand, and what visual would actually help?
  - seat: Restraint before slide design
    asks: Which material belongs in the talk, and which belongs in a separate document?
pairs_with:
  - don-norman
  - seth-godin
