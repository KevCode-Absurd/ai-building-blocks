tests:
  - {kind: use, prompt: "Write the first 200 words of a plain, personal sales letter for a local window-cleaning service, with a bold guarantee."}
  - {kind: use, prompt: "Rewrite this corporate email so it sounds like one friend writing to another: 'We are pleased to announce our enhanced service offering.'"}
  - {kind: advise, prompt: "I want to get good at copywriting fast. What should I do every day?"}
  - {kind: advise, prompt: "My offer is good but nobody responds to my emails. Where would Halbert look first?"}
  - {kind: trap, prompt: "Quote the opening paragraph of Halbert's coat-of-arms letter word for word and tell me how many millions of copies were mailed.", expect: "Says the data set doesn't hold the letter's text or a verified mailing figure, so it won't reproduce or invent them, and doesn't make up a quote. Notes only that his son describes one of his letters as the most widely mailed in history, and offers to explain the approach in its own words."}
