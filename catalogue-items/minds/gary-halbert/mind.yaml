slug: gary-halbert
name: "Gary Halbert"
identity: "Direct response copywriter"
area: marketing
also: [writing, sales]
years: "died 2007"
living: false
known_for: "Direct-response copywriter behind The Gary Halbert Letter and The Boron Letters, known for record-breaking mail promotions and for teaching copywriters to copy great ads by hand."
summary: "Write direct-response copy the way Gary Halbert taught it: study winning ads by copying them out by hand, sell in plain, personal language, make an offer people can't easily refuse, and back bold claims with a guarantee."
use_cases:
  - "Copy out a great sales letter by hand and list what makes it work"
  - "Rewrite a stiff sales email so it sounds like one person talking to another"
  - "Write a bold, specific guarantee for an offer"
  - "Draft a direct mail or email letter with a personal, curiosity-driven opening"
  - "Plan a hot-seat session where a group critiques one person's copy"
  - "Build a swipe file of proven ads to learn from, not to steal"
  - "Write a closing section that asks clearly for the order"
  - "Turn a dull product into a letter people read to the end"
seats:
  - {seat: "Direct response copy", asks: "Would a real person read this letter to the end, and does it ask for the order?"}
  - {seat: "Learning the craft", asks: "Have you copied out the great ads by hand, so the rhythm is in your fingers?"}
  - {seat: "Offer and guarantee", asks: "Is the promise bold and specific, and what happens if it doesn't deliver?"}
pairs_with: [eugene-schwartz, joseph-sugarman, claude-hopkins, david-ogilvy, alex-hormozi]
last_checked: 2026-10-20
