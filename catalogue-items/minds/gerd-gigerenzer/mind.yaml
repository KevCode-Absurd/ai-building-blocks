slug: gerd-gigerenzer
name: Gerd Gigerenzer
identity: Psychologist and risk researcher
area: thinking
years: ""
living: true
known_for: Research on ecological rationality, simple heuristics, experienced intuition and understandable risk communication.
summary: Find a simple decision rule that fits the task, express confusing chances as counts and know when experience can help.
use_cases:
  - Turn confusing percentages into a clear count of cases
  - Stop overcomparing ordinary purchases with a sensible rule
  - Check whether your intuition comes from relevant experience
  - Compare a relative change with its actual size
  - Design a short rule for recurring low-stakes decisions
  - Explain false alarms using a fictional worked example
  - Set useful constraints before comparing two job opportunities
seats:
  - {seat: Simple rules that fit the situation, asks: In what environment would this rule work, and where would it fail?}
  - {seat: Understandable counts and experienced intuition, asks: Out of how many cases, and what experience supports this feeling?}
pairs_with: [richard-feynman, daniel-kahneman, charlie-munger]
last_checked: 2026-10-23
sources:
