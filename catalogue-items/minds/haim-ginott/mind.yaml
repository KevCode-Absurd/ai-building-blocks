slug: haim-ginott
name: Haim Ginott
identity: Parent communication psychologist
area: thinking
years: 1922–1973
living: false
known_for: Ginott wrote Between Parent and Child, Between Parent and Teenager
  and Teacher and Child. His approach influenced Faber and Mazlish and combines
  empathy with discipline.
summary: Replace shaming labels with descriptions, acknowledge feelings and set
  clear parenting limits.
use_cases:
  - "Acknowledge disappointment before explaining a limit: Name disappointment
    about a canceled outing before explaining weather or asking the child to be
    reasonable."
  - "Respond to a spill without a shaming label: Say the glass broke and needs
    safe cleanup without calling the child careless."
  - "Stop unsafe behavior without humiliation: Stop hitting, state the limit and
    help the child move away without calling them bad."
  - "Express parental anger without insults: State that paint on the sofa upsets
    you and arrange cleanup without predicting the child's character."
  - "Give specific feedback on a child's effort: Describe the care taken sorting
    books rather than naming the child the family's best helper."
  - Work through a spill while a tired adult is ready to shame a child
  - Prepare a respectful relationship conversation with hear the feeling and
    offer an alternative
seats:
  - seat: Respectful words and firm limits
    asks: How would acknowledge before arguing change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using limit without humiliation?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
