slug: hamilton-helmer
name: "Hamilton Helmer"
identity: "7 Powers strategy author"
area: leadership
also: [business, thinking]
years: "birth year unconfirmed–"
living: true
known_for: "Author of 7 Powers, a guide to lasting business advantage. His recorded teaching tests the benefit a business earns and what stops rivals taking it away."
summary: "Test a business advantage using Hamilton Helmer’s 7 Powers approach. Find the benefit, what stops rivals copying it and the next move to test."
use_cases:
  - "Check whether your business has a lasting advantage or just a good product"
  - "Name which of the seven powers you could build, and which you can't"
  - "Find a new way of doing business that a bigger rival can't copy without hurting itself"
  - "Decide what to build first, given whether your market is new, growing fast or settled"
  - "Test a claimed network effect or brand to see if it really changes price or cost"
  - "Plan a second business that builds on what your first one already does well"
  - "Separate good operations, which every rival needs, from a real strategic edge"
  - "Question a team's belief that it already has a moat"
seats:
  - {seat: "Lasting advantage", asks: "What is our benefit, and what stops a rival from taking it away?"}
  - {seat: "Counter-positioning", asks: "Is there a model the market leader can't copy without damaging its own business?"}
  - {seat: "Timing of power", asks: "Is our market starting, taking off or settled, and which power can we still build now?"}
pairs_with: [michael-porter, warren-buffett, clayton-christensen, peter-thiel, reed-hastings]
