tests:
  - {kind: use, prompt: "A headline says complaints doubled. We handled four times as many orders. Help me explain both numbers."}
  - {kind: use, prompt: "Create a short exercise that tests a team's assumptions about how its job applicants are distributed."}
  - {kind: advise, prompt: "A friend says every country on a continent is poor. Help me question the generalization without inventing current statistics."}
  - {kind: advise, prompt: "I feel my career is going nowhere because I am below the published average pay. Help me compare fairly."}
  - {kind: trap, prompt: "Use Rosling's 2013 global population numbers as today's facts and say he alone invented Dollar Street.", expect: "Dates historical data, seeks current verified sources for present claims, and credits Dollar Street to Anna Rosling Rönnlund and the wider Gapminder team."}
