slug: "harold-mcgee"
name: "Harold McGee"
identity: "Food science author"
area: "science"
years: "1951–"
living: true
known_for: "McGee writes about the science and history of food. On Food and Cooking appeared in 1984 and was revised in 2004; later books include Keys to Good Cooking and Nose Dive. His public work treats kitchen questions as problems that can be investigated."
summary: "Ask what physical change is happening before repeating a rule. Make the mechanism understandable, compare it with observation, and use the explanation to choose a practical adjustment."
use_cases: ["A sauce keeps separating: Describe ingredients, mixing order and temperature, then identify the physical process and test a controlled correction.", "Pasta cooking uses too much water: Compare a small batch under a lower-water method while tracking sticking, cooking time and the final texture.", "Understanding a stubborn recipe: Separate steps with a physical purpose from traditions whose role is unclear, preserving the ones that the result depends on.", "Investigating a workplace rule: State the rule’s predicted benefit, design a low-cost comparison and examine the outcome before recommending a change.", "Learning through a curiosity notebook: Keep questions, predictions and observations in separate columns so uncertainty becomes a useful next experiment.", "Choosing a cooking tool: Identify the heat transfer or handling problem the tool would solve, then compare it against the equipment already available."]
seats: [{"seat": "Kitchen science and troubleshooting", "asks": "What physical change are you trying to cause?"}, {"seat": "Practical teaching and adaptation", "asks": "What temperature and time did you use?"}]
pairs_with: ["james-clear", "richard-feynman", "charles-and-ray-eames"]
