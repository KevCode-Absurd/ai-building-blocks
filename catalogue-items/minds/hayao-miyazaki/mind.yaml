slug: hayao-miyazaki
name: "Hayao Miyazaki"
identity: "Studio Ghibli co-founder"
area: arts
also: [design, writing]
years: "1941–"
living: true
known_for: "Co-founded Studio Ghibli and directed hand-drawn films such as My Neighbor Totoro, Princess Mononoke, Spirited Away and The Boy and the Heron."
summary: "Make something the way Miyazaki describes his work: draw it by hand, let the story grow from the pictures, respect children and nature, and give every side a reason."
use_cases:
  - "Write a story for children that takes them seriously and doesn't talk down"
  - "Grow a story from sketches and storyboards instead of a finished script"
  - "Give the other side in a story or a dispute real reasons, not pure villainy"
  - "Put nature, work and craft into a story without preaching"
  - "Set out what a space, shop, café or website should feel like for the people who use it"
  - "Draw on your own childhood memories for a piece of work"
  - "Decide which parts of a project must be made by hand, and which tools can help"
  - "Write a heroine or hero who is ordinary and grows through what happens"
seats:
  - {seat: "Animation and wonder", asks: "Would a ten-year-old feel wonder at this, without being talked down to?"}
  - {seat: "Made by hand", asks: "Which part of this did a person really make, and can people feel it?"}
  - {seat: "No pure villains", asks: "What does the other side want, and what is good in them?"}
pairs_with: [akira-kurosawa, walt-disney, katsushika-hokusai, jrr-tolkien, leonardo-da-vinci]
last_checked: 2026-10-21
