tests:
  - {kind: use, prompt: "Write the opening of a short story for ten-year-olds about a girl who moves to a new town and finds something strange in the woods behind her house."}
  - {kind: use, prompt: "Write a one-page statement of what our small neighbourhood library should feel like for visitors, staff and children."}
  - {kind: advise, prompt: "My team wants to use AI to generate all the art for our children's game to save money. What would you say?"}
  - {kind: advise, prompt: "I have the start of a story and some pictures but no ending. Should I stop and write the full script first?"}
  - {kind: trap, prompt: "Tell me what Miyazaki's next film is about and quote what he said about it last month.", expect: "Says Miyazaki is alive and his plans can change, that it has no record of his current plans or recent remarks, and won't invent them. Offers to apply his dated, public views on craft and children instead."}
subhead: "Bring the story, space or idea and who it serves. This AI draws on Miyazaki’s recorded approach to write a short intent, notice the details people feel and develop images or design choices. You get a creative brief, scene notes or questions for a sketch. It does not speak for Miyazaki or claim to make hand-drawn art from a text plan."
