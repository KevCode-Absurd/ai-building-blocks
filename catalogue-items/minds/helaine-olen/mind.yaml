slug: helaine-olen
name: "Helaine Olen"
identity: "Personal finance journalist"
area: thinking
also: [business]
years: ""
living: true
known_for: "Pound Foolish and, with Harold Pollack, The Index Card; reporting on the limits and incentives of financial advice."
summary: "Read a money promise critically, separate household choices from structural costs and prepare questions about fees and incentives."
use_cases:
  - "Check the assumptions and sales incentives behind a money advice article"
  - "Prepare questions about an adviser's fees and what they are selling"
  - "Rewrite a blaming household budget conversation around actual costs"
  - "Compare an advertised shortcut with the obligations it creates"
  - "Separate a useful financial habit from a promise it cannot support"
  - "Explain why an income shortfall cannot always be solved by tiny spending cuts"
  - "Review a career course's income claims before paying"
  - "Write a plain-language list of unanswered questions in a complex offer"
seats:
  - {seat: "Financial advice, incentives and household reality", asks: "What is being promised, and who benefits if you believe it?"}
  - {seat: "Structural costs and practical agency", asks: "Which part can a household change, and which part needs another response?"}
pairs_with: [daniel-kahneman, charlie-munger, peter-drucker]
last_checked: 2026-10-23
sources:
