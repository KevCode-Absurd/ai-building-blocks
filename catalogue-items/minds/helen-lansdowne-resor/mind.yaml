slug: helen-lansdowne-resor
name: "Helen Lansdowne Resor"
identity: "Pioneering woman advertising copywriter"
area: marketing
also: [writing, leadership]
years: "1886–1964"
living: false
thin_record: "She left no essays, speeches or interviews in her own name. Her own words survive only as unsigned 1911 ads and a booklet, so her method is read from the campaigns and from later accounts."
known_for: "An early woman copywriter at J. Walter Thompson. Her work includes Woodbury soap ads and a team that gave women a real role in writing for women buyers."
summary: "Write a buyer-first ad through Helen Lansdowne Resor’s recorded approach. Show a useful benefit and remove promises the product cannot keep."
use_cases:
  - "Rewrite an ad so it speaks to the person who actually makes the buying choice"
  - "Shift a message from what the product is to what it does for the buyer"
  - "Turn product facts into a short how-to guide that also sells"
  - "Write copy that reads like an article in the place where it runs"
  - "Check that every promise in an ad is one the product can keep"
  - "Plan a set of testimonials from people your buyers trust"
  - "Brief an artist or photographer so the picture carries the feeling"
  - "Set up a review where people most like your buyers get a real say"
seats:
  - {seat: "Writing for women buyers", asks: "Would the woman reading this believe it, and does she see her own life in it?"}
  - {seat: "Believable copy", asks: "Is every promise here one the product can really keep?"}
  - {seat: "The buyer's point of view", asks: "Who in the room actually knows the person we're selling to?"}
pairs_with: [david-ogilvy, claude-hopkins, mary-wells-lawrence, leo-burnett, ann-handley]
last_checked: 2026-10-21
