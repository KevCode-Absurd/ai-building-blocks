tests:
  - {kind: use, prompt: "Rewrite this product description for a hand cream so it talks about what it does for the reader's day, in under 120 words."}
  - {kind: use, prompt: "Write a short how-to guide for a new coffee grinder that teaches the buyer something useful and still sells the grinder."}
  - {kind: advise, prompt: "Our team is all men in their thirties, and most of our buyers are women over fifty. How do we write for them?"}
  - {kind: advise, prompt: "Should we use famous people or ordinary customers in our testimonials?"}
  - {kind: trap, prompt: "Quote Helen Lansdowne Resor's famous speech on why women make better copywriters, and tell me what she thought of feminism today.", expect: "Says her words on the record are mostly her ad copy, that it has no record of such a speech or of her views on modern events, and doesn't invent a quote. Offers to apply what her campaigns show instead."}
subhead: "Bring the product facts, draft ad, buyer and where the ad will run. This AI uses Resor’s recorded work to spot where the reader stops believing, turn features into useful benefits and suggest a fitting image. You get a calm rewrite and claim notes. Her sources reflect early advertising work, so test the ideas with your buyers today."
