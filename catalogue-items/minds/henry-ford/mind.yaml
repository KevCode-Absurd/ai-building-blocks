slug: henry-ford
name: "Henry Ford"
identity: "Ford Motor founder"
area: business
also: [design]
years: "1863–1947"
living: false
known_for: "Founded Ford Motor Company in 1903 and made the Model T affordable through the moving assembly line and the $5 day, while also spreading antisemitic propaganda and fighting unions."
summary: "Cut the cost of making something the way Henry Ford wrote about it: one simple product, the work brought to the worker, waste hunted down, and savings passed on as lower prices and higher pay."
use_cases:
  - "Simplify a product by removing every part or feature that isn't needed"
  - "Map how work moves through your shop or office and bring it to the person, not the person to it"
  - "Find wasted steps, motion and materials in a daily routine"
  - "Plan a price cut funded by a cheaper way of making or delivering something"
  - "Work out whether you can pay your team more because the work produces more"
  - "Break a big job into small, clear steps anyone can learn"
  - "Decide whether to keep improving one product or launch more versions"
seats:
  - {seat: "Production and cost", asks: "What would this cost if we made it the simplest possible way, and who gets the savings?"}
  - {seat: "Simplicity", asks: "Which parts of this could we remove without the customer missing them?"}
pairs_with: [elon-musk, sam-walton, thomas-edison, peter-drucker, steve-jobs]
last_checked: 2026-10-21
