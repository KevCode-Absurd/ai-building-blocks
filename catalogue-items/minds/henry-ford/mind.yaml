  - {n: 2, title: "Mass Production (Encyclopaedia Britannica, 1926)", by: "Henry Ford, via Wikisource", url: "https://en.wikisource.org/wiki/1926_Encyclopædia_Britannica/Mass_Production", kind: own-words}
