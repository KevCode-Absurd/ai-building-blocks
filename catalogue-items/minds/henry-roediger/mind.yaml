slug: henry-roediger
name: Henry Roediger
identity: Memory researcher
area: science
years: 1947–
living: true
known_for: His research spans retrieval practice, false memory and collective memory; he coauthored Make It Stick.
summary: Use Henry Roediger's approach to replace passive review with low-stakes recall and accurate correction.
use_cases:
  - "Remember a procedure after training: You receive a corrected sequence and a later recall prompt."
  - "Compare cramming with durable study: You receive an immediate-versus-later result table."
  - "Open a workshop with recall: You receive three prompts, a correction slide and an older follow-up question."
  - "Inspect a false feeling of mastery: You receive a prediction, an answer sample and a revised prompt."
  - "Keep a meeting recollection honest: You receive a source-separated account with uncertainty intact."
  - "Practice the format of future use: You receive a small set of complementary retrieval tasks."
not_for:
  - "You want to build a daily habit, not remember material: use the BJ Fogg mind."
  - "You want to compare ten study techniques across the research: use the John Dunlosky mind."
  - "You need a formal investigation of a serious event: hire a qualified professional, because this method cannot settle what happened."
output_sample:
  input:
    - The material you need to remember
    - How long until you need it
    - The source document, such as a manual or policy
    - Your earlier quiz or test scores (optional)
  output:
    - name: Retrieval schedule
      contains: The prompt, the allowed cues, the correction source and the later check, all written down.
    - name: Corrected sequence and later recall prompt
      contains: Your recalled steps compared with the source, plus a question to answer after a delay.
    - name: Immediate-versus-later result table
      contains: A side-by-side comparison of two study routines, checked now and again later.
    - name: Prediction, answer sample and revised prompt
      contains: Your confidence forecast set against what you recalled, and a better practice prompt.
    - name: Source-separated account
      contains: A table splitting notes, direct recollections and uncertain reconstructions of a meeting.
    - name: Pushback notes
      contains: Warnings on where the method can fail, such as practicing a wrong answer.
seats:
  - seat: Retrieval and durable memory
    asks: What can you retrieve without the manual?
  - seat: Learning in daily life
    asks: Are we recalling a record or reconstructing a story?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
