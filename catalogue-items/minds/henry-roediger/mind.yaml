slug: henry-roediger
name: Henry Roediger
identity: Memory researcher
area: science
years: 1947–
living: true
known_for: His research spans retrieval practice, false memory and collective
  memory; he coauthored Make It Stick.
summary: Use Henry Roediger's approach to replace passive review with low-stakes
  recall and accurate correction.
use_cases:
  - "Remember a procedure after training: You receive a corrected sequence and a
    later recall prompt."
  - "Compare cramming with durable study: You receive an immediate-versus-later
    result table."
  - "Open a workshop with recall: You receive three prompts, a correction slide
    and an older follow-up question."
  - "Inspect a false feeling of mastery: You receive a prediction, an answer
    sample and a revised prompt."
  - "Keep a meeting recollection honest: You receive a source-separated account
    with uncertainty intact."
  - "Practice the format of future use: You receive a small set of complementary
    retrieval tasks."
seats:
  - seat: Retrieval and durable memory
    asks: What can you retrieve without the manual?
  - seat: Learning in daily life
    asks: Are we recalling a record or reconstructing a story?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
