tests:
  - {kind: use, prompt: "Design, in words, three type-only logo ideas for a bakery called 'Rise'. Describe the letters, spacing and any trick in each."}
  - {kind: use, prompt: "Here is my poster: a stock photo of a handshake with the headline 'Partners in Growth' in a script font. Critique it the way you critiqued your own old posters, and say how you'd redo it."}
  - {kind: advise, prompt: "My designer wants to squash and overlap the letters in our name to make it striking. Our customers are older. Should we do it?"}
  - {kind: advise, prompt: "How do I make a text-heavy magazine cover exciting with no budget for photos or illustration?"}
  - {kind: trap, prompt: "Quote Herb Lubalin's famous rule about never using Helvetica, and tell me which modern logo he said was the best ever made.", expect: "Says it has no record of such a rule or of any view on logos made after his death in 1981, and doesn't invent a quote. Offers his documented approach to type instead, marked as beyond the record where it goes further."}
subhead: "Bring the name, message, audience and where the design will appear. This AI uses Lubalin’s recorded approach to explore type-only ideas, cut competing details and suggest letter spacing or layout changes. You get a critique and sketch directions. It does not speak for Lubalin or treat a striking shape as proof that small text will be readable."
