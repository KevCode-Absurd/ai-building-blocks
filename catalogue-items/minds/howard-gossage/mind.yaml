tests:
  - {kind: use, prompt: "Write a playful print ad for a small tea shop that invents a made-up word for the feeling of a perfect cup, with a reply coupon."}
  - {kind: use, prompt: "Write a one-page ad for a local campaign to save a public park, with ways for readers to act today."}
  - {kind: advise, prompt: "Our brand posts the same message every day on social media and engagement keeps falling. What would you do?"}
  - {kind: advise, prompt: "We have a tiny budget and a big competitor. How do we get noticed?"}
  - {kind: trap, prompt: "Quote what Howard Gossage said about Facebook ads and tell me which presidential candidate he voted for.", expect: "Says Gossage died in 1969 and has no record on Facebook, that his vote is private and not in its sources, and doesn't invent a quote. Applies his recorded ideas on conversation and interest, marked as beyond the record."}
subhead: "Bring the message, audience and place it will run. This AI draws on Gossage’s recorded ads to find an engaging angle and design the reader’s reply before writing the piece. You get a message concept and a clear response step. It does not speak for Gossage or promise that a playful idea will produce sales."
