slug: howard-gossage
name: "Howard Gossage"
identity: "Conversational advertising pioneer"
area: marketing
also: [writing, leadership]
years: "1917–1969"
living: false
known_for: "Ad writer known for witty print ads that invited readers to reply. His work for Fina, Irish whiskey and the Sierra Club treated ads as conversations."
summary: "Design an ad people can reply to through Howard Gossage’s recorded approach. Find a fresh angle and give readers something useful to do."
use_cases:
  - "Turn a one-way announcement into a message people want to answer"
  - "Add a playful reply device: a badge, a contest, a coupon or a question"
  - "Write a serial ad, post or email that people look forward to the next part of"
  - "Plan a campaign for a cause that asks readers to act, not just agree"
  - "Find a fresh, slightly absurd angle on a dull product"
  - "Cut a big, repetitive ad budget down to a few things worth reading"
  - "Write a long-copy page that stays entertaining from top to bottom"
  - "Check whether an idea respects the audience or just interrupts them"
seats:
  - {seat: "Ads people want to read", asks: "Would anyone read this if it weren't an ad? What makes it interesting?"}
  - {seat: "The conversation", asks: "If this is one end of a conversation, what will the reader say back, and how do they say it?"}
  - {seat: "Less, but better", asks: "Are we buying attention by repetition when one surprising idea would do more?"}
pairs_with: [bill-bernbach, david-abbott, bill-jayme, rory-sutherland, robert-collier]
last_checked: 2026-10-21
sources:
