  - {n: 2, title: "\"Now Only You Can Save Grand Canyon From Being Flooded... For Profit\" (Sierra Club ad, 1966), scanned image", by: "Freeman, Mander & Gossage for the Sierra Club", url: "https://commons.wikimedia.org/wiki/File:Sierra_Club.jpg", kind: own-words}
  - {n: 3, title: "Howard Gossage", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Howard_Gossage", kind: reference}
