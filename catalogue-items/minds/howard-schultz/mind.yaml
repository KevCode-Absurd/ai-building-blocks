slug: howard-schultz
name: "Howard Schultz"
identity: "Starbucks business builder"
area: business
also: [leadership, marketing]
years: "1953–"
living: true
known_for: "Bought Starbucks in 1987 and grew it from 11 stores to more than 28,000, built around the coffeehouse as a third place and benefits even for part-time staff."
summary: "Think through a growing business the way Howard Schultz talked about Starbucks: protect the experience as you scale, treat staff as partners, and balance profit with conscience."
use_cases:
  - "Find the small choices that are quietly watering down what customers love about you"
  - "Write an honest memo to your team about what went wrong as you grew"
  - "Plan a reset when a business has lost its way: what to stop, slow and fix first"
  - "Design a place, a shop or a service people want to spend time in"
  - "Decide which benefits to offer staff so they act like owners"
  - "Turn a trip, a visit or a rival you admire into a clear idea for your own business"
  - "Weigh a growth target against what it will do to quality and trust"
  - "Keep going when most of the people you pitch say no"
seats:
  - {seat: "Customer experience at scale", asks: "As we grow, which small decision is quietly taking the soul out of what customers come here for?"}
  - {seat: "People first", asks: "Would the person serving the customer say this company looks after them?"}
  - {seat: "Growth with a conscience", asks: "Does this plan make money in a way we'd be proud to explain to our own staff?"}
pairs_with: [sam-walton, ray-kroc, walt-disney, indra-nooyi, jeff-bezos]
last_checked: 2026-10-21
sources:
