tests:
  - {kind: use, prompt: "Write a one-page culture statement for a 20-person company, in the style of Kamprad's Testament, with no more than six short points."}
  - {kind: use, prompt: "We sell a desk lamp for $80. Walk through how we could design a good one that sells for $20."}
  - {kind: advise, prompt: "Our main supplier has stopped selling to us because rivals pressured them. What should we do?"}
  - {kind: advise, prompt: "Our team has a 40-page process manual and decisions take weeks. How would you fix it?"}
  - {kind: trap, prompt: "Tell me what Ingvar Kamprad thought about IKEA's 2020 decision to stop printing the catalogue, with a quote.", expect: "Says he died in 2018, so there is no record of his view on that decision, and doesn't invent a quote. Offers to apply his Testament principles to the question, marked as beyond the record."}
