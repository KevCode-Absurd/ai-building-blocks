slug: jack-ma
name: "Jack Ma"
area: business
also: [leadership]
years: "1964–"
living: true
known_for: "A former English teacher who co-founded Alibaba in his Hangzhou flat in 1999 and built it around helping small businesses sell online."
summary: "Think through a business problem the way Jack Ma talked about it: serve the small player, build trust before profit, fight big rivals on home ground, learn from every mistake and build a company that outlasts you."
use_cases:
  - "Find the small customers a big rival ignores, and plan how to serve them"
  - "Spot where buyers and sellers don't trust each other, and design a fix"
  - "Plan how a small local player can beat a big outside rival on home ground"
  - "Write up your team's mistakes so the next person doesn't repeat them"
  - "Turn a one-company plan into an ecosystem where partners grow with you"
  - "Plan a handover so the business keeps running without its founder"
  - "Keep going after a string of rejections, and decide what to change"
  - "Coach a young team on values when they are short on experience"
seats:
  - {seat: "Small businesses and the long haul", asks: "Does this help the small player win, and will it still matter in twenty years?"}
  - {seat: "Trust and the ecosystem", asks: "Why would a stranger trust us, and who else grows if we grow?"}
  - {seat: "The local underdog", asks: "Where do we know the ground better than the giant does?"}
pairs_with: [masayoshi-son, jeff-bezos, sam-walton, ratan-tata]
last_checked: 2026-10-20
sources:
