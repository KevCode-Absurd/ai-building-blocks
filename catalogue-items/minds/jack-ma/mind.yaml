  - {n: 2, title: "Keynote at Stanford's China 2.0 conference (30 September 2011), transcript", by: "Jack Ma, transcript on The Singju Post", url: "https://singjupost.com/alibabas-jack-ma-reflects-12-year-journey-china-2-0-conference-transcript/", kind: own-words}
