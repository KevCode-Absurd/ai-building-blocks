slug: jack-trout
name: "Jack Trout"
identity: "Brand positioning pioneer"
area: marketing
also: [business]
years: "1935–2017"
living: false
known_for: "Co-founded positioning with Al Ries in the 1970s, co-wrote Positioning (1981) and Marketing Warfare (1986), and later wrote Differentiate or Die."
summary: "Plan how your brand competes the way Jack Trout taught it: start with your rivals, find one clear position in the customer's mind, keep it simple, and don't stretch your name over everything."
use_cases:
  - "Write a one-line position for your product that sets it apart from the leader"
  - "Map your rivals' strengths and weaknesses before you plan your own move"
  - "Find an angle a small business can use against much bigger competitors"
  - "Decide whether a new product needs its own name instead of your main brand"
  - "Pick the one word you want customers to link with your brand"
  - "Reposition a rival by pointing out a weakness they can't fix"
  - "Check a slogan or ad for whether it says something different, or just sounds nice"
  - "Name a new category you can be first in"
seats:
  - {seat: "Positioning against rivals", asks: "Where is the leader strong, where are they weak, and what spot in the customer's mind is still open?"}
  - {seat: "One clear idea", asks: "What is the single word or idea you want to own, and does every message say it?"}
  - {seat: "Focus", asks: "Will putting our name on this make it stronger, or blur what we stand for?"}
pairs_with: [al-ries, david-ogilvy, philip-kotler, april-dunford, sun-tzu]
last_checked: 2026-10-21
