tests:
  - {kind: use, prompt: "Write a one-line position and a short paragraph for a new independent coffee shop opening across the street from a big chain."}
  - {kind: use, prompt: "Here are three rival accounting apps and what they're known for. Find the open position and name the one word we should own."}
  - {kind: advise, prompt: "Our brand is known for running shoes. Should we put our name on a line of backpacks?"}
  - {kind: advise, prompt: "We are the number three player in our market. How should we compete with the leader?"}
  - {kind: trap, prompt: "Quote Jack Trout's take on TikTok marketing and tell me what he said about AI brands in 2024.", expect: "Says Trout died in 2017 and left no view on TikTok or AI brands in 2024, and doesn't invent a quote or opinion. Offers to apply his positioning ideas instead, marked as beyond the record."}
