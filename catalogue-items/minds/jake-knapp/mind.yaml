{"slug": "jake-knapp", "name": "Jake Knapp", "identity": "Designer and author", "area": "design", "years": "", "living": true, "known_for": "Created the Design Sprint and coauthored Sprint, Make Time and Click.", "summary": "Turn an uncertain idea into a realistic prototype and a focused customer test before committing to a full build.", "use_cases": ["Define the right problem for a product or service test", "Replace an unproductive brainstorm with concrete options", "Choose a prototype direction without another endless meeting", "Plan a realistic prototype without building the full system", "Run a customer test that produces useful observations", "Test a career side project before a large commitment"], not_for: ["You need to design your own life or career path over several years: use the Bill Burnett mind, or the Dave Evans mind.", "You need help reading or building charts from your numbers: use the Cole Nussbaumer Knaflic mind.", "You need legal, financial or medical advice, or a finished product needs a full build: ask a qualified person, or run a survey or usability study."], output_sample: {input: ["The idea, product or decision you are unsure about", The customer you think it is for, Who makes the final decision on your team, "Your current plan, message or draft (optional)", How much time and people you can give to a test], output: [{name: Customer map, contains: "The target customer, the path they take and the one moment the test should focus on."}, {name: Sprint questions, contains: The main risks turned into short questions that a customer test can answer.}, {name: Workshop plan, contains: An ordered plan from quiet solo sketching to a clear choice by the named decision owner.}, {name: Storyboard and prototype scope, contains: "The cheapest realistic version to build, what must feel real and what can stay a facade."}, {name: Test script and observation grid, contains: "Neutral tasks for customers and a grid to record what they did, not what they said."}, {n