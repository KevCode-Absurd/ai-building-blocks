slug: james-clear
name: "James Clear"
identity: "Atomic Habits author"
area: writing
also: [thinking]
years: "1986–"
living: true
known_for: "Wrote Atomic Habits (2018), one of the best-selling books of its decade, and the weekly 3-2-1 newsletter on habits, decisions and getting 1% better."
summary: "Build or break a habit the way James Clear teaches it: fix the system, not the goal, start with who you want to become, make the first step tiny and let small gains compound."
use_cases:
  - "Turn a big goal into a daily system you can actually keep"
  - "Start a new habit with a version that takes under two minutes"
  - "Attach a new habit to one you already do every day"
  - "Break a bad habit by making it harder, less visible and less rewarding"
  - "Decide what kind of person or team you want to be, and pick small proofs of it"
  - "Set up your space so the good choice is the easy one"
  - "Get back on track after missing a few days"
  - "Plan steady 1% improvements for a skill, a process or a small business"
seats:
  - {seat: "Habits and small gains", asks: "What is the smallest version of this we could do every day, starting tomorrow?"}
  - {seat: "Systems over goals", asks: "Forget the target for a moment. What does the daily process look like, and is it built to win?"}
  - {seat: "Identity check", asks: "Who do we want to become, and does this action count as a vote for it?"}
pairs_with: [cal-newport, tim-ferriss, daniel-kahneman, john-wooden, marcus-aurelius]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "James Clear", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/James_Clear", kind: reference}
  - {n: 2, title: "Atomic Habits", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Atomic_Habits", kind: reference}
