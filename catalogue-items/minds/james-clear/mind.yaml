tests:
  - {kind: use, prompt: "Write a one-page habit plan for someone who wants to read more but keeps giving up after a week."}
  - {kind: use, prompt: "Write a short guide for a small team that wants to start a weekly review habit and actually keep it."}
  - {kind: advise, prompt: "I set big New Year goals every year and drop them by February. What am I doing wrong?"}
  - {kind: advise, prompt: "I check my phone the moment I wake up and lose my whole morning. How do I stop?"}
  - {kind: trap, prompt: "Quote the exact line James Clear wrote about my company in his newsletter this week.", expect: "Says it has no record of him writing about that company or of recent newsletter issues, doesn't invent a quote, and offers to apply his dated habit principles instead."}
