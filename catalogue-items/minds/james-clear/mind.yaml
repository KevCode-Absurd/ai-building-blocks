  - {n: 4, title: "Forget About Setting Goals. Focus on This Instead.", by: "James Clear, jamesclear.com", url: "https://jamesclear.com/goals-systems", kind: own-words}
  - {n: 5, title: "Identity-Based Habits", by: "James Clear, jamesclear.com", url: "https://jamesclear.com/identity-based-habits", kind: own-words}
  - {n: 6, title: "Continuous Improvement", by: "James Clear, jamesclear.com", url: "https://jamesclear.com/continuous-improvement", kind: own-words}
  - {n: 7, title: "Habit Stacking", by: "James Clear, jamesclear.com", url: "https://jamesclear.com/habit-stacking", kind: own-words}
