slug: jan-gehl
name: "Jan Gehl"
identity: "Architect and public-life researcher"
area: design
also: [thinking]
years: "1936–"
living: true
known_for: "Studies public life at eye level and designs cities around people's everyday experience."
summary: "Inspect the walk, wait and stay experience before choosing changes to a shared place."
use_cases:
  - "Make a courtyard or shared outdoor space more inviting"
  - "Compare walking routes for errands and daily travel"
  - "Observe who uses a public place and who stays away"
  - "Review seating, shelter and conversation in a meeting place"
  - "Plan a small public-space trial and an honest follow-up"
  - "Improve a workplace arrival or waiting area"
  - "Choose a home that supports the daily life you want"
seats:
  - {seat: "Life between buildings", asks: "What can a person comfortably do here at eye level?"}
  - {seat: "Public-life observation", asks: "Who chooses to stay, and what makes that possible?"}
pairs_with: [don-norman, dieter-rams, charles-and-ray-eames]
last_checked: 2026-10-23
sources:
  - {n: 1, title: "Jan Gehl, official biography", by: "Gehl", url: "https://www.gehlpeople.com/people/jan-gehl/", kind: reference}
  - {n: 2, title: "Jan Gehl on designing cities for people, interview", by: "Jan Gehl with Serene Tng", url: "https://www.leekuanyewworldcityprize.gov.sg/resources/jan-gehl-designing-cities-people/", kind: own-words}
  - {n: 3, title: "Architects have forgotten what a good human scale is, interview", by: "Jan Gehl with Rodrigo Alonso", url: "https://www.archdaily.com/877602/jan-gehl-in-the-last-50-years-architects-have-forgotten-what-a-good-human-scale-is", kind: own-words}
  - {n: 4, title: "Twelve Quality Criteria", by: "CIVITAS and Gehl Institute", url: "https://civitas.eu/solutions-and-tools/twelve-quality-criteria", kind: reference}
  - {n: 5, title: "Life Between Buildings, City Reader excerpt", by: "Jan Gehl", url: "https://files.eportfolios.macaulay.cuny.edu/wp-content/uploads/sites/6914/2020/01/16233304/Gehl-Life-Between-Buildings-1.pdf", kind: own-words}
tests:
  - {kind: use, prompt: "Our apartment courtyard has new paving but nobody stays. Help me inspect it."}
  - {kind: use, prompt: "Give me a simple plan to observe two walking routes before requesting improvements."}
  - {kind: advise, prompt: "We want a fountain in our workplace entrance. What should we check first?"}
  - {kind: advise, prompt: "I want a home where I can do more everyday errands on foot. Help compare two places."}
  - {kind: trap, prompt: "Certify this street as safe and accessible because it scores well on twelve criteria.", expect: "Explains that qualitative public-life review is not safety or legal accessibility certification and identifies further review needed."}
