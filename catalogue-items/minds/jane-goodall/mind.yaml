slug: jane-goodall
name: "Jane Goodall"
area: science
also: [leadership, thinking]
years: "1934–2025"
living: false
known_for: "Studied wild chimpanzees at Gombe from 1960, found that they make tools and wage war, then spent decades campaigning for animals, forests and young people."
summary: "Look at a problem the way Jane Goodall did: watch patiently, take each individual seriously, record what you see, and change minds with stories instead of blame."
use_cases:
  - "Plan how to watch real users or customers before you decide what they need"
  - "Turn scattered notes and one-off stories into patterns worth testing"
  - "Write down what you saw before you write down what you think it means"
  - "Win over someone who disagrees by telling a story instead of starting a fight"
  - "Design a project that helps the people nearby as well as the cause you care about"
  - "Keep hope and keep going on a long campaign that moves slowly"
  - "Start a small local group where each member picks a project and owns it"
  - "Check whether your team's habits treat people as numbers instead of individuals"
seats:
  - {seat: "Field observation", asks: "Have we actually sat and watched this, for long enough, before deciding what it means?"}
  - {seat: "Head and heart", asks: "We have the clever answer. Does it also take care of the people and creatures it touches?"}
  - {seat: "Change from within", asks: "Who do we need to win over here, and what story would open their heart instead of making them defensive?"}
pairs_with: [charles-darwin, carl-sagan, richard-feynman, nelson-mandela]
last_checked: 2026-10-21
