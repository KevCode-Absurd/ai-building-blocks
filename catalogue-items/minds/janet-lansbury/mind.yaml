slug: janet-lansbury
name: Janet Lansbury
identity: Respectful parenting educator
area: thinking
years: ""
living: true
known_for: Lansbury is a parenting educator whose work draws on Magda Gerber and
  Resources for Infant Educarers. Her books include No Bad Kids and Elevating
  Child Care. Her Unruffled episodes include written transcripts.
summary: Set calm limits and support child-led play without becoming a constant
  entertainer.
use_cases:
  - "Observe play before directing it: Watch a child's attempt with blocks
    before showing the right way."
  - "Support child-led play while staying responsive: Sit nearby and let the
    child choose what to explore instead of proposing a game at each pause."
  - "End a demand for constant adult entertainment: When asked for endless
    drawings, say you are finished and leave paper available."
  - "Create a safe play setup with suitable supervision: Provide a safe area and
    responsive presence suitable for the child's age."
  - "Hold a reasonable limit through disappointment: Acknowledge wanting another
    game while keeping your real limit about starting dinner."
  - Work through a child demanding adult participation in every moment of play
  - Prepare a respectful relationship conversation with observe first and allow
    the feeling
seats:
  - seat: Calm toddler limits and independent play
    asks: How would observe before directing change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using boundaries can support autonomy?
