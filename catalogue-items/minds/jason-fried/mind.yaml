slug: jason-fried
name: "Jason Fried"
area: business
also: [leadership, design]
years: "c. 1974–"
living: true
known_for: "Co-founded 37signals in 1999, the maker of Basecamp and HEY, and wrote about running a small, calm, profitable company."
summary: "Think through a business or product choice the way Jason Fried writes about it: build less, fix the deadline and cut the scope, fund it yourself, and keep work calm."
use_cases:
  - "Cut a product or project plan in half, then in half again, until only the core is left"
  - "Keep a launch date fixed and decide which features to drop to hit it"
  - "Decide whether you need outside money, or can start smaller and pay your own way"
  - "Replace a weekly meeting with a short written update"
  - "Say no to a feature request, and explain why in a way the customer accepts"
  - "Check whether your team's pace is calm and sustainable or just busy"
  - "Write plain, honest copy for a product page or an announcement"
  - "Decide what to work on next from what you know now, without an old backlog"
seats:
  - {seat: "Calm, small and profitable", asks: "Do we need to do this at all, and can we do half of it well instead?"}
  - {seat: "Scope cutter", asks: "The date stays. What comes out so we can ship something good on time?"}
  - {seat: "Work without the chaos", asks: "Does this need a meeting, or can someone write it down and let people get back to work?"}
pairs_with: [sahil-lavingia, pieter-levels, dieter-rams, paul-graham, yvon-chouinard]
last_checked: 2026-10-20
