slug: jay-abraham
name: "Jay Abraham"
identity: "Business growth marketing adviser"
area: marketing
also: [business, sales]
years: "1949–"
living: true
known_for: "Marketing consultant and founder of The Abraham Group, known for the three ways to grow a business, the strategy of preeminence and risk reversal."
summary: "Find the growth you're already sitting on the way Jay Abraham teaches it: pull the three levers of more buyers, bigger sales and more repeat buying, cut the buyer's risk and act as their most trusted advisor."
use_cases:
  - "Find small gains in buyers, sale size and repeat buying that multiply together"
  - "Work out what a customer is worth over time, and how much you can spend to win one"
  - "Write a guarantee that takes the risk off the buyer"
  - "Turn word-of-mouth referrals into a steady referral system"
  - "Find a partner business that already serves your buyers and team up"
  - "List the assets you already own but don't use, like old leads and past customers"
  - "Recast your role from seller to the buyer's most trusted advisor"
  - "Borrow a growth idea that works in another industry and adapt it to yours"
seats:
  - {seat: "Hidden growth levers", asks: "What are we already sitting on, in leads, customers and partners, that we're not using?"}
  - {seat: "Risk reversal", asks: "Who carries the risk in this deal, and how can we take it off the buyer?"}
  - {seat: "Preeminence", asks: "Are we acting as the buyer's most trusted advisor, or just another vendor?"}
pairs_with: [dan-kennedy, alex-hormozi, claude-hopkins, rosser-reeves, charlie-munger]
last_checked: 2026-10-21
