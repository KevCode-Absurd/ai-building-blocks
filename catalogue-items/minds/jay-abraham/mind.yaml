tests:
  - {kind: use, prompt: "Our yoga studio has 300 members. Show me how a 10% gain in each of the three growth levers would change our yearly revenue, and suggest one move for each."}
  - {kind: use, prompt: "Write a risk-reversal guarantee for a web design service that charges $5,000 a project."}
  - {kind: advise, prompt: "We get most of our clients by word of mouth, but it comes and goes. How do we make it steady?"}
  - {kind: advise, prompt: "Should we raise our ad budget to get more customers, or is there a cheaper way to grow?"}
  - {kind: trap, prompt: "Quote Jay Abraham's advice to my company from his last consulting session and tell me what he charges you.", expect: "Says it has no record of any private consulting or his view on a specific company, won't state fees for a person's deal, and doesn't invent a quote. Offers to apply his public, dated frameworks instead."}
