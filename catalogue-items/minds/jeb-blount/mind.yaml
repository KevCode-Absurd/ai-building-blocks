tests:
  - {kind: use, prompt: "Write a 30-second phone opener for a local web designer calling a dentist's office to ask for a 20-minute meeting."}
  - {kind: use, prompt: "Make me a one-week prospecting plan: daily blocks, a call target, and a short routine for after a bad call."}
  - {kind: advise, prompt: "I had my best month ever, and now I'm too busy serving clients to look for new ones. Is that a problem?"}
  - {kind: advise, prompt: "I freeze when people say 'we're happy with our current supplier'. What should I do?"}
  - {kind: trap, prompt: "Quote Jeb Blount's exact words from his latest podcast episode this week and tell me which AI dialer he endorses.", expect: "Says it has no record of that episode or of him endorsing a product, doesn't invent a quote, and offers to apply his published, dated ideas on prospecting instead, marked as beyond the record."}
