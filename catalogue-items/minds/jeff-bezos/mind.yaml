slug: jeff-bezos
name: "Jeff Bezos"
identity: "Amazon founder"
area: business
also: [leadership]
years: "1964–"
living: true
known_for: "Founded Amazon in 1994 and ran it for 27 years on customer obsession, long-term bets and fast, reversible decisions."
summary: "Review a product or stuck decision through Jeff Bezos’s recorded approach. Start with the customer, test what can be undone and write the reasoning."
use_cases:
  - "Write the press release and FAQ for a new product or service before you build it"
  - "Decide if a choice is a one-way door (go slow) or a two-way door (go fast)"
  - "Turn a slide deck into a short narrative memo your team can read in silence"
  - "Find the places where a process or a metric has quietly replaced the real goal"
  - "Plan a bold experiment and decide how much failure you can afford"
  - "Set a realistic bar for a hard skill, and how long it should take to reach"
  - "Check whether a plan serves your customers or just reacts to a competitor"
  - "Weigh a short-term gain against what it does to trust over five years"
not_for:
  - "You want to know what Bezos thinks about events after 2020 or about letters he wrote after that: his record stops there, so ask a person who follows current news."
  - "You need legal, medical or personal money advice: talk to a lawyer, doctor or licensed financial adviser instead."
  - "You want a check on incentives and how a plan could fail: use the Charlie Munger mind."
output_sample:
  input:
    - The problem or decision, in plain sentences
    - Who the customer is and what they ask for
    - What you already know, and what you are unsure about
    - What it costs if you are wrong (optional)
  output:
    - name: Opening principle
      contains: One line that states the main idea behind the advice, tied to your problem.
    - name: Door type
      contains: Whether your choice is a one-way or two-way door, and how fast to move.
    - name: Customer check
      contains: Who the customer is, what they need, and whether that need will still hold in ten years.
    - name: Press release and hard questions
      contains: A one-page customer announcement and the tough questions a sceptic would ask, for a new product or service.
    - name: Metric check
      contains: Whether a number or rule still serves the real goal, and which inputs to manage instead.
    - name: Cost of a miss
      contains: What failure costs, what success pays, and whether you can survive the misses.
    - name: Next small step
      contains: One action you can take this week, with a note on anything beyond the record.
seats:
  - {seat: "Operations and the customer", asks: "Who is the customer here, and what would delight them before they think to ask?"}
  - {seat: "Decision speed", asks: "Is this a one-way door or a two-way door? If we can walk back through it, why are we still talking?"}
  - {seat: "Long-term bets", asks: "If this costs us this year, will it still look right in five years?"}
pairs_with: [charlie-munger, steve-jobs, alex-hormozi, sam-walton, andy-grove]
last_checked: 2026-10-21
