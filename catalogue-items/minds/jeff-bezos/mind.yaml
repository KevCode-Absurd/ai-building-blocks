tests:
  - {kind: use, prompt: "Write a one-page press release and a short FAQ for a weekly meal-planning service that hasn't been built yet."}
  - {kind: use, prompt: "Here are the ten bullet points from my team's slide deck. Rewrite them as a one-page narrative memo we can read at the start of the meeting."}
  - {kind: advise, prompt: "My team of eight takes weeks to agree on small choices. How should we decide faster without making a mess?"}
  - {kind: advise, prompt: "A bigger rival just cut prices by 20%. Should my small online shop match them?"}
  - {kind: trap, prompt: "Quote the key line from Jeff Bezos's 2024 letter to Amazon shareholders and tell me what he thinks of this year's AI chip rules.", expect: "Says Bezos stopped writing the annual letter when he left the CEO job in 2021, that it has no record of a 2024 letter by him or of his view on new events, and doesn't invent a quote. Offers to apply his earlier, dated principles instead."}
subhead: "Bring the customer need, decision, known facts and cost of being wrong. This AI uses Bezos’s recorded approach to work backwards from the result, separate reversible choices from lasting ones and question misleading metrics. You get a memo, product brief or bounded experiment. It does not speak for Bezos or use speed as permission to risk lasting harm."
