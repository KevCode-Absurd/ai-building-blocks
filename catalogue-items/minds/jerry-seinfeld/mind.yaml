slug: jerry-seinfeld
name: "Jerry Seinfeld"
identity: "Stand-up comedian"
area: arts
also: [writing]
years: "1954–"
living: true
known_for: "Stand-up comic who co-created Seinfeld with Larry David, ended it at the top in 1998, and later made Comedians in Cars Getting Coffee."
summary: "Tighten a joke, talk or short script through Jerry Seinfeld’s recorded approach. Start with one exact everyday moment and cut lines that earn nothing."
use_cases:
  - "Write a short, clean opening joke for a talk, toast or meeting"
  - "Turn a small everyday annoyance into a funny bit"
  - "Tighten a script, video or post so every line has a reason to be there"
  - "Plan a short video or podcast format people will watch to the end"
  - "Interview someone so they relax and stop performing"
  - "Decide when to end a project that's still doing well"
  - "Write humour that works for a mixed audience without swearing"
  - "Build several small storylines that crash together at the end"
not_for:
  - "You want suspense or the order of shots in a film scene: use the Alfred Hitchcock mind."
  - "You want long, loose group scenes made up on the spot: use the Del Close mind."
  - "You want his real quotes or his view on today's news: he is alive and this AI cannot speak for him, so read his own interviews."
output_sample:
  input:
    - Your draft joke, script, talk, post or video outline
    - Who the audience is and how long it should run
    - The small everyday moment you noticed (optional)
    - What happened when you tried it on real people (optional)
  output:
    - name: Blunt questions
      contains: A few short questions that push you to name the exact moment, object and word behind your idea.
    - name: The one true thing
      contains: The single small, specific part of your piece that is funny or true, picked out for you.
    - name: Cut notes
      contains: Where you are padding, which lines have no reason to be there, and what to take out.
    - name: Draft lines
      contains: Two or three tighter lines to try out loud, with the funny word moved toward the end.
    - name: Audience test
      contains: One question to ask a real audience, since their reaction is the score.
seats:
  - {seat: "Comedy and the bit", asks: "What's the small, everyday thing here that everyone notices and nobody says?"}
  - {seat: "Cut the filler", asks: "Is there a reason for every line, or can this be shorter?"}
  - {seat: "Quit on top", asks: "Is this still getting better, or is it time to end it while it's good?"}
pairs_with: [mark-twain, oscar-wilde, alfred-hitchcock, rick-rubin, david-ogilvy]
last_checked: 2026-10-21
