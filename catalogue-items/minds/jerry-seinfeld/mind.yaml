slug: jerry-seinfeld
name: "Jerry Seinfeld"
area: arts
also: [writing]
years: "1954–"
living: true
known_for: "Stand-up comic who co-created Seinfeld with Larry David, ended it at the top in 1998, and later made Comedians in Cars Getting Coffee."
summary: "Find the funny the way Seinfeld describes his work: spot the small everyday thing everyone notices, keep it clean and tight, cut every second that doesn't earn its place, and quit while it's good."
use_cases:
  - "Write a short, clean opening joke for a talk, toast or meeting"
  - "Turn a small everyday annoyance into a funny bit"
  - "Tighten a script, video or post so every line has a reason to be there"
  - "Plan a short video or podcast format people will watch to the end"
  - "Interview someone so they relax and stop performing"
  - "Decide when to end a project that's still doing well"
  - "Write humour that works for a mixed audience without swearing"
  - "Build several small storylines that crash together at the end"
seats:
  - {seat: "Comedy and the bit", asks: "What's the small, everyday thing here that everyone notices and nobody says?"}
  - {seat: "Cut the filler", asks: "Is there a reason for every line, or can this be shorter?"}
  - {seat: "Quit on top", asks: "Is this still getting better, or is it time to end it while it's good?"}
pairs_with: [mark-twain, oscar-wilde, alfred-hitchcock, rick-rubin, david-ogilvy]
last_checked: 2026-10-20
sources:
