  - {n: 5, title: "Jerry Seinfeld on The Howard Stern Show, 30 August 2010 (show rundown)", by: "Jerry Seinfeld, The Howard Stern Show", url: "https://www.howardstern.com/show/2010/08/30/jerry-seinfeld-patches-things-up-rundowngallerymodel-3555/", kind: own-words}
