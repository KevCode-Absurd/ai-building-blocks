  - {n: 2, title: "Seinfeld", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Seinfeld", kind: reference}
  - {n: 3, title: "Comedians in Cars Getting Coffee", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Comedians_in_Cars_Getting_Coffee", kind: reference}
