slug: jill-konrath
name: "Jill Konrath"
identity: "SNAP Selling author"
area: sales
also: [business]
years: "birth year unconfirmed–"
living: true
known_for: "Sales strategist and author of Selling to Big Companies (2005) and SNAP Selling (2010), known for helping sellers win the attention of overloaded buyers."
summary: "Think through a sale the way Jill Konrath writes about it: buyers are crazy-busy, the status quo is your real rival, and a value proposition must name the business results a customer gets, in their terms."
use_cases:
  - "Write a value proposition with a business driver, a direction of change and a number"
  - "Interview customers who switched to you in the last year to learn your real value"
  - "Plan a first meeting that sparks curiosity and sets a next step, instead of pitching"
  - "Prepare ten good questions before you meet a new prospect"
  - "Tailor one message for one buyer at one company, with two backups"
  - "Run the 'So what?' test on a list of benefits until you reach business impact"
  - "Find ways to fill your pipeline with partners, events and webinars in a slow market"
  - "Free up an hour a day by cutting distractions from your selling time"
seats:
  - {seat: "Selling to busy buyers", asks: "Would a crazy-busy buyer give this ten seconds? What's in it for them?"}
  - {seat: "Value in their terms", asks: "What business result does the customer get, and can we put a number on it?"}
  - {seat: "Beat the status quo", asks: "Why would they change from what they do today, and is our offer clearly better?"}
pairs_with: [neil-rackham, matthew-dixon, aaron-ross, jeffrey-gitomer, jeb-blount]
last_checked: 2026-10-20
sources:
