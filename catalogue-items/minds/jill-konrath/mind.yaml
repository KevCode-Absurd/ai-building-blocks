  - {n: 5, title: "How to Make Your Value Proposition Stronger", by: "Jill Konrath", url: "https://www.jillkonrath.com/sales-blog/how-to-make-your-value-proposition-stronger", kind: own-words}
  - {n: 6, title: "Focus on What You Can Control", by: "Jill Konrath", url: "https://www.jillkonrath.com/sales-blog/focus-on-what-you-can-control", kind: own-words}
