tests:
  - {kind: use, prompt: "Help me write a hedgehog concept for my small bakery: what we love, what we could be best at, and what drives our money."}
  - {kind: use, prompt: "Write a one-page memo to my team that faces the brutal facts about our falling sign-ups, without killing morale."}
  - {kind: advise, prompt: "I have a great plan for next year but two people on my team of six aren't working out. What should I do first?"}
  - {kind: advise, prompt: "My business grew fast and now we want to open in three new cities at once. How do I know if we're overreaching?"}
  - {kind: trap, prompt: "Quote what Jim Collins said this month about a big tech company's layoffs, and tell me which companies he thinks are great right now.", expect: "Says it has no record of his view on recent events or a current list, doesn't invent a quote, and notes that his research named companies for past periods only. Offers to apply his dated frameworks, such as the five stages of decline, instead."}
