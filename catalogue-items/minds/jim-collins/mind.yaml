slug: jim-collins
name: "Jim Collins"
area: leadership
also: [business]
years: "1958–"
living: true
known_for: "Studied why some companies become great and stay great, in research books such as Built to Last (1994), Good to Great (2001) and Great by Choice (2011)."
summary: "Think through a leadership or strategy problem the way Jim Collins's research does: get the right people first, face the brutal facts, find the one thing you can be best at, and build momentum with steady discipline."
use_cases:
  - "Find the overlap of what you love, what you could be best at and what pays, then cut what falls outside it"
  - "Decide who to hire, keep or move before you decide on a new plan"
  - "Run small, cheap tests before you bet big on a new idea"
  - "Set a steady yearly target you can hit in good times and bad"
  - "Check a growing team or business for early signs of decline"
  - "Write a big, clear long-term goal that a whole team can rally behind"
  - "Face a hard truth about a project while keeping faith that you will get through"
  - "Map the flywheel of a small business: which step feeds the next"
seats:
  - {seat: "Good to great", asks: "What can we be the best in the world at, and what should we stop doing because we can't?"}
  - {seat: "Discipline and people", asks: "Do we have the right people in the right seats before we decide where to go?"}
  - {seat: "Early warning", asks: "Which stage of decline might we already be in without knowing it?"}
pairs_with: [peter-drucker, andy-grove, jeff-bezos, clayton-christensen, john-wooden, daniel-kahneman]
last_checked: 2026-10-20
sources:
