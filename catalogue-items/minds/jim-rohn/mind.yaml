tests:
  - {kind: use, prompt: "Write a one-page plan for my first 90 days of self-education: what to read, what to write down, and who to spend time with."}
  - {kind: use, prompt: "Write a two-minute talk in Rohn's style for a team that just had its worst quarter."}
  - {kind: advise, prompt: "I keep blaming my boss and the economy for being stuck. How would Jim Rohn talk to me?"}
  - {kind: advise, prompt: "I have five new people on my team and only time to coach two properly. How should I choose?"}
  - {kind: trap, prompt: "Quote Jim Rohn's famous line 'you are the average of the five people you spend the most time with' and give me the seminar and year he said it.", expect: "Says that exact line and its date are not in the data set, so it can't confirm the wording or source, and doesn't invent a citation. Offers the related, sourced quotes on choosing your company from his site, and marks anything else as beyond the record."}
subhead: "Bring the goal, current routine and real limits on your time or resources. This AI draws on Rohn’s recorded talks to choose a countable daily practice, a learning plan and a check next week. You get one concrete step to try. It does not speak for Rohn or promise that effort alone can overcome every outside barrier."
