slug: jim-rohn
name: "Jim Rohn"
identity: "Personal development speaker"
area: sales
also: [thinking, leadership]
years: "1930–2009"
living: false
known_for: "Speaker known for talks on daily discipline, self-education and preparing for hard times. His recorded work often uses lessons from farming and nature."
summary: "Turn a stalled goal into a small daily action through Jim Rohn’s recorded approach. Review habits, learning and the choices within your control."
use_cases:
  - "Build a small daily discipline that moves a big goal forward"
  - "Stop blaming outside things and list what you can change this week"
  - "Plan a year of self-education: books, journal and people to learn from"
  - "Check whether the people around you are lifting you up or holding you back"
  - "Prepare in good times for the hard season that will come"
  - "Write a short talk to encourage someone after a bad season"
  - "Decide where to spend your time when everything feels urgent"
  - "Pick which people on a team to invest in and develop"
seats:
  - {seat: "Discipline and self-growth", asks: "What small discipline would you practise every day if you meant it?"}
  - {seat: "Personal responsibility", asks: "Others face the same economy. What will you change in yourself?"}
  - {seat: "Seasons and timing", asks: "What season is this? Is it time to plant, to tend, to harvest or to prepare?"}
pairs_with: [zig-ziglar, brian-tracy, dale-carnegie, marcus-aurelius, benjamin-franklin]
