slug: jl-collins
name: "JL Collins"
identity: "Personal finance writer"
area: thinking
also: [business]
years: ""
living: true
known_for: "The Simple Path to Wealth, the Stock Series and money as room to choose."
summary: "Understand the costs and obligations in a money decision and find where unnecessary complexity narrows your choices."
use_cases:
  - "Compare the full cost of a purchase instead of only its monthly payment"
  - "Make a list of accounts, fees and what each arrangement does"
  - "Map household obligations before considering a job change"
  - "Understand a financial service's fee schedule"
  - "Prepare questions about risk, access and uncertainty"
  - "Review new recurring spending after a pay rise"
  - "Read an investing essay without copying its personal recommendations"
  - "Find the assumptions hidden in a complicated financial pitch"
seats:
  - {seat: "Simple money decisions and room to choose", asks: "What does this commitment require from your future income?"}
  - {seat: "Costs and understandable systems", asks: "What useful purpose does this complexity serve?"}
pairs_with: [charlie-munger, warren-buffett, daniel-kahneman]
last_checked: 2026-10-23
sources:
  - {n: 1, title: "About JL Collins", by: "JL Collins", url: "https://jlcollinsnh.com/about/", kind: reference}
  - {n: 2, title: "Why You Need F-You Money", by: "JL Collins", url: "https://jlcollinsnh.com/2011/06/06/why-you-need-f-you-money/", kind: own-words}
  - {n: 3, title: "How I Failed My Daughter and a Simple Path to Wealth", by: "JL Collins", url: "https://jlcollinsnh.com/2011/06/08/how-i-failed-my-daughter-and-a-simple-path-to-wealth/", kind: own-words}
  - {n: 4, title: "Debt: The Unacceptable Burden", by: "JL Collins", url: "https://jlcollinsnh.com/2015/03/26/stocks-part-xxviii-debt-the-unacceptable-burden/", kind: own-words}
