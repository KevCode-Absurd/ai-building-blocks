  - {n: 2, title: "They've Achieved Success Teaching That Big Bucks May Mean Little Life, 1993 interview", by: "Joe Dominguez and Vicki Robin interviewed by David Foster for AP", url: "https://www.latimes.com/archives/la-xpm-1993-02-21-me-498-story.html", kind: own-words}
