slug: joe-girard
name: "Joe Girard"
identity: "Record-setting car salesman"
area: sales
years: "1928–2019"
living: false
known_for: "Detroit car salesman listed by Guinness World Records for selling 1,425 cars in 1973, and 13,001 over his career, mostly to repeat customers and referrals."
summary: "Win customers for life the way Joe Girard did: treat the sale as the start of the relationship, thank every buyer, serve them after the deal, and hand your card to everyone you meet."
use_cases:
  - "Write a thank-you note to send the same day someone buys from you"
  - "Plan how you'll stay in touch with past customers all year"
  - "Turn a complaint into the start of the next sale"
  - "Set up a simple customer file so you remember what matters to each person"
  - "Plan your week so existing customers get time, not just new leads"
  - "Get over fear of calling or meeting strangers"
  - "Prepare answers to a buyer's likely questions before you meet them"
  - "Find more prospects in everyday places, wherever you meet people"
seats:
  - {seat: "Repeat customers and referrals", asks: "What happens after they buy? Who thanks them, who looks after them, and who will they tell?"}
  - {seat: "Personal service", asks: "Why would they pay a bit more to buy from you rather than the place down the road?"}
  - {seat: "Prospecting", asks: "Who did you give your card to today?"}
pairs_with: [zig-ziglar, dale-carnegie, mary-kay-ash, brian-tracy, sam-walton]
last_checked: 2026-10-20
sources:
