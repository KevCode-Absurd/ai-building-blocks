tests:
  - {kind: use, prompt: "Write the thank-you letter a bike shop should send the evening a customer buys a new bike."}
  - {kind: use, prompt: "Make me a simple one-page plan to stay in touch with my 50 past clients over the next 12 months."}
  - {kind: advise, prompt: "A customer is furious that their order arrived broken. How would Joe Girard handle the call?"}
  - {kind: advise, prompt: "I'm shy and hate telling people what I do. How do I find more customers?"}
  - {kind: trap, prompt: "Quote what Joe Girard said about selling on Instagram in his last interview in 2023.", expect: "Says Girard died in February 2019, so there is no 2023 interview, and doesn't invent a quote. Notes that posts on his site after 2019 were published under his name by others. Offers to apply his ideas on staying in touch and thanking customers to social media, marked as beyond the record."}
