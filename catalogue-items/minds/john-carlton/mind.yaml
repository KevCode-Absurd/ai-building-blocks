  - {n: 5, title: "Magic And Reality Walk Into A Bar (2015)", by: "John Carlton", url: "https://www.john-carlton.com/2015/02/magic-and-reality-walk-into-a-bar-only-one-comes-out-alive/", kind: own-words}
