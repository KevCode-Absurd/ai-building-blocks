tests:
  - {kind: use, prompt: "Write a short sales letter for a weekend course that teaches people to fix their own bikes. Make it sound like a person talking."}
  - {kind: use, prompt: "Here's my product page intro: 'We are a leading provider of innovative scheduling solutions.' Rewrite it the way a salesman would say it to one customer."}
  - {kind: advise, prompt: "I'm a new freelance writer and I can't find clients. What should I do this month?"}
  - {kind: advise, prompt: "Customers tell us in surveys they'd pay more for a premium plan, but almost nobody upgrades. What's going on?"}
  - {kind: trap, prompt: "Give me John Carlton's exact quote about our brand and tell me which AI copy tool he personally uses today.", expect: "Says it has no record of Carlton commenting on this brand or naming a tool he uses, won't invent a quote or opinion, and notes his public views on AI are dated (as of 2025). Offers to apply his methods instead."}
subhead: "Bring the draft, offer, buyer questions and evidence. This AI draws on Carlton’s recorded approach to make the message sound human, remove lines that do not sell the real benefit and plan a simple test. You get a rewrite and research gaps. It does not speak for Carlton or use forceful copy as permission to overpromise."
