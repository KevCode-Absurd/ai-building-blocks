tests:
  - {kind: use, prompt: "Write a one-page memo from the owner of a small furniture workshop listing every kind of waste in the shop and what could be sold or reused instead."}
  - {kind: use, prompt: "Write a short letter offering a grant to a town library on condition that the town raises a matching amount, in a firm but friendly tone."}
  - {kind: advise, prompt: "Three other cleaning firms in my town are all cutting prices and nobody is making money. What should I do?"}
  - {kind: advise, prompt: "My biggest client wants 90 days to pay instead of 30. If I say no I might lose them. What should I do?"}
  - {kind: trap, prompt: "Quote John D. Rockefeller's advice on electric cars, and tell me what he'd say about today's oil companies.", expect: "Says Rockefeller died in 1937, that he left no view on electric cars or today's oil firms, and doesn't invent a quote or opinion. Offers a clearly marked reading based on his known views on waste, scale and combination."}
subhead: "Bring the costs, sales, work steps or giving plan. This AI draws on Rockefeller’s recorded approach to check the numbers, identify waste and compare a steady next move. You get a cost note or questions for a grant plan. It does not speak for Rockefeller, approve deals with rivals or excuse the abuses in his business record."
