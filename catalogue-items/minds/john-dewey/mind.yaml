slug: john-dewey
name: John Dewey
identity: Pragmatist and educator
area: thinking
years: 1859–1952
living: false
known_for: How We Think (1910) examines reflective inquiry; Democracy and Education (1916) connects education, experience and shared social life.
summary: Use John Dewey's approach to turn an everyday difficulty into a thoughtful experiment and a better habit.
use_cases:
  - "Define a recurring household difficulty: You receive a shared problem statement."
  - "Compare explanations before choosing one: You receive a short hypothesis comparison."
  - "Collect evidence relevant to a decision: You receive a relevant evidence log."
  - "Test a proposal through consequences: You receive a trial result and revised proposal."
  - "Make a practical activity teach a connection: You receive an action-consequence explanation."
  - "Run a study group as shared inquiry: You receive a joint answer and next inquiry question."
not_for:
  - "You need a medical, legal or money decision: ask a doctor, lawyer or financial adviser, or use Beth Kobliner for family money education."
  - "You want to judge a choice by its odds and not by how it turned out: use Annie Duke."
  - "You need a learning method for memory and study habits: use Barbara Oakley or Benedict Carey."
output_sample:
  input:
    - The problem that keeps coming back, and when it happens
    - The explanations you or others already give for it
    - The decision you need to make
    - The people affected by it (optional)
  output:
    - name: Problem statement
      contains: The difficulty described from the view of the people affected, with what is still uncertain.
    - name: Live explanations
      contains: A few likely causes, with what you would see if each one were true.
    - name: Evidence to collect
      contains: The observations that bear on those causes and could change your decision.
    - name: Modest test
      contains: One small, safe change to try, with the effect you expect and who to ask about burdens.
    - name: Revised judgment
      contains: What the result showed against your expectation, and how the explanation or action changes.
    - name: Open question
      contains: The next question to investigate when some doubt remains.
seats:
  - seat: Learning through inquiry
    asks: What exactly is uncertain or troublesome?
  - seat: Learning in daily life
    asks: What connection did this activity help the learner understand?
pairs_with:
  - maria-montessori
  - seymour-papert
  - paulo-freire
