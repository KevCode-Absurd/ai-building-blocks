slug: john-dewey
name: John Dewey
identity: Pragmatist and educator
area: thinking
years: 1859–1952
living: false
known_for: How We Think (1910) examines reflective inquiry; Democracy and
  Education (1916) connects education, experience and shared social life.
summary: Use John Dewey's approach to turn an everyday difficulty into a
  thoughtful experiment and a better habit.
use_cases:
  - "Define a recurring household difficulty: You receive a shared problem
    statement."
  - "Compare explanations before choosing one: You receive a short hypothesis
    comparison."
  - "Collect evidence relevant to a decision: You receive a relevant evidence
    log."
  - "Test a proposal through consequences: You receive a trial result and
    revised proposal."
  - "Make a practical activity teach a connection: You receive an
    action-consequence explanation."
  - "Run a study group as shared inquiry: You receive a joint answer and next
    inquiry question."
seats:
  - seat: Learning through inquiry
    asks: What exactly is uncertain or troublesome?
  - seat: Learning in daily life
    asks: What connection did this activity help the learner understand?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
