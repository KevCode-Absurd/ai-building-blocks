slug: john-dunlosky
name: John Dunlosky
identity: Learning researcher
area: science
years: Birth year not confirmed
living: true
known_for: His 2013 coauthored review compared ten learning techniques; his research program examines monitoring, study-time control, and learning strategies.
summary: Use John Dunlosky's approach to choose study techniques by delayed performance instead of how productive they feel.
use_cases:
  - "Audit an exam study routine: You receive a revised allocation with one comparison to run."
  - "Replace recognition with practice testing: You receive six questions and a correction record."
  - "Distribute a limited study budget: You receive a calendar and a delayed comparison task."
  - "Calibrate an overconfident learner: You receive a small calibration table and a review priority."
  - "Explain a worked problem: You receive an annotated example and a near-transfer problem."
  - "Keep flashcard knowledge available: You receive a compact relearning queue."
not_for:
  - "You need to cram tonight or learn a skill you can't test after a delay: use a task-specific coach or tutor instead."
  - "You want to learn how retrieval practice works in depth: use Henry Roediger, who coauthored Make It Stick."
  - "You want to build a daily habit, not choose study methods: use BJ Fogg for Tiny Habits."
output_sample:
  input:
    - Your exam date or the day you need the knowledge
    - Your syllabus or topic list
    - A past quiz or score (optional)
    - Your current study schedule
  output:
    - name: Revised study allocation
      contains: Your study hour split by what you actually do, with one comparison to run.
    - name: Practice questions and correction record
      contains: Short questions from your headings, with your first answer kept apart from the corrected one.
    - name: Spaced calendar
      contains: Short sessions spread across your week, with older material kept in and a delayed check at the end.
    - name: Calibration table
      contains: A few entries comparing your confidence with your real results, plus the topic to review next.
    - name: Worked problem notes
      contains: A solved example with each line explained, and a similar problem to try with the answer covered.
    - name: Relearning queue
      contains: Flashcards you can still not answer after a gap, kept short and tied to real tasks.
seats:
  - seat: Study methods that last
    asks: What exactly are you doing during the hour?
  - seat: Learning in daily life
    asks: Do you know why that operation belongs there?
pairs_with:
  - henry-roediger
  - pooja-agarwal
  - benedict-carey
last_checked: 2026-10-23
