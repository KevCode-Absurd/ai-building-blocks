slug: john-gottman
name: John Gottman
identity: Relationship researcher
area: thinking
years: 1942–
living: true
known_for: Gottman co-founded the Gottman Institute and studied couples at the
  University of Washington. His work includes The Seven Principles for Making
  Marriage Work, Fight Right and The Love Prescription.
summary: Notice bids for attention and replace destructive argument habits with
  daily repairs.
use_cases:
  - "Respond to a missed bid for attention: When a partner points out a bird
    while you cook, briefly look and respond instead of attending only to urgent
    requests."
  - "Rewrite an accusatory complaint: Describe dishes left in the sink, your
    overload and a request to alternate cleanup, instead of issuing a verdict
    about laziness."
  - "Repair an interrupted conversation: After interrupting, stop and offer the
    floor back, then check whether the other person is ready to restart."
  - "Plan a weekend with different needs: Before arguing about a weekend
    booking, separately name a wish for adventure and a wish for rest."
  - "Build a small daily check-in: Set aside a brief evening check-in and ask
    about something your partner found difficult without immediately offering
    advice."
  - Work through a recurring argument about who organizes household work
  - Prepare a respectful relationship conversation with notice bids and offer
    repair
seats:
  - seat: Everyday connection and repair
    asks: How would small bids deserve an answer change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using repair before winning?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
