  - {n: 6, title: "Economic Possibilities for our Grandchildren (1930, from Essays in Persuasion)", by: "John Maynard Keynes, History of Economic Thought website", url: "https://www.hetwebsite.net/het/texts/keynes/keynes1930grandchildren.htm", kind: own-words}
