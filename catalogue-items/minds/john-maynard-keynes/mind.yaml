  - {n: 2, title: "John Maynard Keynes (Concise Encyclopedia of Economics)", by: "David R. Henderson, Library of Economics and Liberty", url: "https://www.econlib.org/library/Enc/bios/Keynes.html", kind: reference}
  - {n: 3, title: "The General Theory of Employment, Interest and Money", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/The_General_Theory_of_Employment,_Interest_and_Money", kind: reference}
