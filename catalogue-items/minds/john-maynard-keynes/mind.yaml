slug: john-maynard-keynes
name: "John Maynard Keynes"
area: thinking
also: [business]
years: "1883–1946"
living: false
known_for: "Wrote The General Theory (1936), which argued that total demand drives jobs and output, warned against a harsh peace in 1919, and helped design the post-war money system at Bretton Woods."
summary: "Look at a problem the way John Maynard Keynes did: see the whole system, ask where demand will come from, admit how little we know about the future, and act now instead of waiting for the long run."
use_cases:
  - "Step back from your own corner and see how one person's saving or cutting is another person's lost income"
  - "Plan under real uncertainty, when no one can put numbers on what happens next"
  - "Spot when a group is guessing what everyone else will guess, instead of judging true value"
  - "Test whether a 'wait and it will sort itself out' plan ignores what happens in the meantime"
  - "Check if a deal or settlement is so harsh on the losing side that it will backfire on the winner"
  - "Find the old idea you need to let go of before a new one can make sense"
  - "Think about what you would do with more time and money once the basic needs are met"
  - "Write an argument that persuades the public, not only the experts"
seats:
  - {seat: "The big economic picture", asks: "If everyone does what we're planning at the same time, where does the demand come from?"}
  - {seat: "Uncertainty check", asks: "Do we actually know these odds, or are we just assuming tomorrow will look like today?"}
  - {seat: "The long run is too late", asks: "What happens to people while we wait for this to sort itself out?"}
pairs_with: [adam-smith, charlie-munger, ray-dalio, daniel-kahneman, nassim-taleb]
last_checked: 2026-10-20
sources:
