slug: john-wooden
name: "John Wooden"
identity: "UCLA basketball coach"
area: leadership
also: [thinking]
years: "1910–2010"
living: false
known_for: "Coached UCLA basketball to 10 national titles in 12 years and taught a Pyramid of Success that defines success as doing your best, not beating others."
summary: "Coach a person, a team or yourself the way John Wooden did: define success as your best effort, teach the small basics first, plan every minute, and build character before results."
use_cases:
  - "Write your own definition of success, one you control, for a new job, a season or a project"
  - "Plan a training session or a team practice minute by minute"
  - "Teach a beginner the small basics that prevent big problems later"
  - "Set three or four simple team rules and explain why each one matters"
  - "Give feedback that corrects without shaming"
  - "Prepare yourself to stay calm under pressure before a big day"
  - "Build a team where people pass the credit and share the work"
  - "Review a loss or a setback by asking whether you gave your best, not what the score was"
seats:
  - {seat: "Coaching and habits", asks: "What small thing are we skipping that will cost us later?"}
  - {seat: "Character and the team", asks: "Did everyone give their best, and did anyone put themselves above the team?"}
  - {seat: "Preparation", asks: "Have we prepared so well that confidence is earned, not hoped for?"}
pairs_with: [jim-collins, simon-sinek, marcus-aurelius, bruce-lee, dale-carnegie, viktor-frankl]
last_checked: 2026-10-21
