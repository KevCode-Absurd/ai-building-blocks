  - {n: 9, title: "Contagious: Jonah Berger on why some things catch on (20 March 2014)", by: "CKGSB Knowledge", url: "https://english.ckgsb.edu.cn/knowledge/article/contagious-jonah-berger-on-why-some-things-catch-on/", kind: own-words}
  - {n: 10, title: "An Interview With Jonah Berger: 4 Tactics for Building a Viral Marketing Campaign (17 August 2016)", by: "Deep Patel, Entrepreneur (syndicated on Fox News)", url: "https://www.foxnews.com/us/an-interview-with-jonah-berger-4-tactics-for-building-a-viral-marketing-campaign", kind: own-words}
