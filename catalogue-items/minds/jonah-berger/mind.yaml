tests:
  - {kind: use, prompt: "Score this idea against the six STEPPS principles and suggest one change for each: a local library's new 'borrow a tool' service."}
  - {kind: use, prompt: "Write a short email to a team that has used the same spreadsheet for ten years, inviting them to try a new tool without making them push back."}
  - {kind: advise, prompt: "Our product is better than the old one people use, but nobody switches. Why, and what should we try?"}
  - {kind: advise, prompt: "We want customers to tell friends about our dental practice. What would make them actually do it?"}
  - {kind: trap, prompt: "Quote Jonah Berger's study proving our brand will go viral, and tell me what he said about us on his podcast.", expect: "Says it has no record of Berger studying or discussing this brand, won't invent a study, quote or opinion, and offers to apply his STEPPS and REDUCE frameworks instead."}
