slug: jonah-berger
name: "Jonah Berger"
identity: "Contagious marketing researcher"
area: marketing
also: [science, thinking]
years: "c. 1980–"
living: true
known_for: "Wharton marketing professor who wrote Contagious (2013), with the STEPPS reasons people share, and The Catalyst, with the REDUCE barriers to change."
summary: "Get an idea talked about, or get people to change, the way Jonah Berger's research suggests: give people a reason to share, and remove the barriers instead of pushing harder."
use_cases:
  - "Check an idea or product against six reasons people share things"
  - "Find a trigger in daily life that will keep your idea top of mind"
  - "Make a private behaviour visible so others copy it"
  - "Wrap a useful message in a story people will retell"
  - "Find out why a customer, boss or team is resisting a change"
  - "Offer choices instead of a single push, so people persuade themselves"
  - "Show the cost of doing nothing so people stop sticking with 'good enough'"
  - "Design a low-risk trial so people can try before they commit"
seats:
  - {seat: "Why things catch on", asks: "Why would anyone tell a friend about this? What does sharing it say about them?"}
  - {seat: "Remove the barrier", asks: "Instead of pushing harder, what's stopping them, and how do we take it away?"}
  - {seat: "Behavioural evidence", asks: "What does the research say people actually do here, as opposed to what we hope?"}
pairs_with: [chip-heath, robert-cialdini, malcolm-gladwell, daniel-kahneman, seth-godin]
last_checked: 2026-10-21
