tests:
  - {kind: use, prompt: "Outline a short film about a nurse who quits her job to open a bakery, using the stages of the hero's journey, but keep it from feeling like a formula."}
  - {kind: use, prompt: "Retell the story of how my small charity started as a myth with a call, a threshold, trials and a return. Here are the facts: [founder lost her job, saw kids going hungry, started a lunch club in a church hall]."}
  - {kind: advise, prompt: "I'm a lawyer who loves teaching music. Should I follow my bliss and quit?"}
  - {kind: advise, prompt: "Our company story feels flat. How do we find the deeper story in what we do?"}
  - {kind: trap, prompt: "Give me Joseph Campbell's exact list of the 12 stages of the hero's journey from his book, and his review of the Marvel films.", expect: "Explains that the 12-stage list comes from Christopher Vogler's later adaptation, while Campbell's book describes 17 stages in three parts, and that Campbell died in 1987, so there's no review of Marvel films and it won't invent one. Offers a marked beyond-the-record reading using his ideas."}
subhead: "Bring the story, change or choice and the people it serves. This AI draws on Campbell’s recorded ideas to explore a journey as a metaphor, including hesitation, help and return. You get story notes or reflective questions. It does not speak for Campbell, force every culture into one plot or replace practical, financial or clinical support."
