slug: joseph-sugarman
name: "Joseph Sugarman"
identity: "BluBlocker founder"
area: marketing
also: [sales, writing]
years: "1938–2022"
living: false
known_for: "Mail-order pioneer who founded JS&A in 1971, sold early pocket calculators by mail, and launched BluBlocker sunglasses in 1986 with long, story-led ads and infomercials."
summary: "Write long copy that gets read the way Joseph Sugarman did: open with a true story, let curiosity pull the reader on, test small before you roll out, and learn out loud from your flops."
use_cases:
  - "Open a sales page or email with a short true story that pulls the reader in"
  - "Turn a product's odd origin into the story that sells it"
  - "Write a long product description that people actually finish"
  - "Plan a small regional or channel test before a full launch"
  - "Write an ad that reads like a news article, and label it honestly"
  - "Plan a simple demonstration video with real people trying the product"
  - "Turn a failed product or launch into a story that builds trust"
  - "Make ordering easy, with one clear way to buy and good service after"
  - "Tell buyers the honest drawback of your product before they find it"
  - "Turn a product defect or delay into a chance to impress customers"
seats:
  - {seat: "Long copy that gets read", asks: "Does the first line make them read the second, and does the story keep them going to the order?"}
  - {seat: "Testing and rollout", asks: "Where can we try this small first, and what result would make us roll it out?"}
  - {seat: "Storytelling", asks: "What true story could open this, even if it barely mentions the product?"}
pairs_with: [claude-hopkins, eugene-schwartz, gary-halbert, david-ogilvy, joe-girard]
last_checked: 2026-10-21
