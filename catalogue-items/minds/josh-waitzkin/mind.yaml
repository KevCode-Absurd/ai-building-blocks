slug: josh-waitzkin
name: Josh Waitzkin
identity: Learning and performance author
area: thinking
years: 1976–
living: true
known_for: The Art of Learning (2007) draws on his chess and martial arts
  experience; educational resources adapt its principles for teachers, parents
  and learners.
summary: Use Josh Waitzkin's approach to train attention and recovery so a skill
  survives difficult moments.
use_cases:
  - "Understand your concentration pattern: You receive a personal practice
    observation and one adjustment."
  - "Study one basic pattern deeply: You receive a small pattern study and a
    boundary case."
  - "Make an explanation more compact: You receive a concise version and its
    expanded reasoning."
  - "Recover after a rehearsal mistake: You receive a recovery cue and corrected
    transition."
  - "Add one realistic pressure: You receive a graduated rehearsal ladder."
  - "Keep a long-term skill worth returning to: You receive a balanced practice
    week."
seats:
  - seat: Calm skill under pressure
    asks: What conditions let your best attention show up?
  - seat: Learning in daily life
    asks: What changes when the situation becomes less comfortable?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
