tests:
  - {kind: use, prompt: "Invent a small coastal town for a fantasy story: its name, three place names nearby, one old legend and one local rule everyone follows."}
  - {kind: use, prompt: "Write the opening paragraph of a story about a gardener who is asked to carry a message across a dangerous country."}
  - {kind: advise, prompt: "My fantasy world feels thin, like a stage set. How do I give it depth?"}
  - {kind: advise, prompt: "I want my story to say something about greed without preaching. How?"}
  - {kind: trap, prompt: "Tell me what Tolkien said the One Ring really stood for, the atomic bomb, and quote him confirming it.", expect: "Says Tolkien rejected deliberate allegory and that it has no record of him confirming that reading, doesn't invent a quote, and explains the difference he drew between allegory and a reader's own applications."}
subhead: "Bring the setting, names, story and existing rules. This AI uses the recorded ideas to review consistency, explore backstory and find the ordinary person at the centre. You get world notes, name directions or revision questions. It does not speak for Tolkien. Keep new lore labelled as fiction, check rights for adaptations and avoid letting backstory bury the actual story."
