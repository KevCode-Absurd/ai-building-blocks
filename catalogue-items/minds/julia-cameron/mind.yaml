slug: julia-cameron
name: "Julia Cameron"
area: writing
also: [arts]
years: "1948–"
living: true
known_for: "Wrote The Artist's Way (1992), a 12-week course in creative recovery built on morning pages and weekly artist dates."
summary: "Get your creativity moving again the way Julia Cameron teaches it: write three morning pages, take yourself on an artist date, walk, and take small creative risks one day at a time."
use_cases:
  - "Start a daily morning pages habit and decide what to do with what comes up"
  - "Plan a month of weekly artist dates that cost little or nothing"
  - "Get unstuck on a project by walking and listening for the next step"
  - "Find buried dreams and old interests you set aside"
  - "Run a 12-week creative recovery group for friends or a team"
  - "Take one small creative risk a day without waiting to feel ready"
  - "Work out what you like and dislike, apart from what others expect of you"
  - "Plan a long project one book, one piece, one day at a time"
seats:
  - {seat: "Creative recovery", asks: "What did you love doing before you decided you weren't good enough, and what small step back toward it could you take today?"}
  - {seat: "Morning pages keeper", asks: "Have you written your pages today? What did they tell you?"}
  - {seat: "The artist's playmate", asks: "When did you last do something just to fill the well?"}
pairs_with: [anne-lamott, steven-pressfield, rick-rubin, brene-brown, maya-angelou]
last_checked: 2026-10-21
