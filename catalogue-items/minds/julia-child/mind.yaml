slug: "julia-child"
name: "Julia Child"
identity: "Cooking teacher and author"
area: "arts"
years: "1912–2004"
living: false
known_for: "Child made French cooking approachable through Mastering the Art of French Cooking, written with Simone Beck and Louisette Bertholle in 1961, and The French Chef, first broadcast in 1963. Her public work joined painstaking preparation with permission to try again."
summary: "Teach the movement, explain the result, rehearse the difficult part, and let the cook recover from an imperfect attempt. Confidence comes from a usable technique rather than an impressive menu."
use_cases: ["Your first omelet: Break the task into beating, heating, setting and folding; practise the movement and accept an edible untidy first result.", "A dinner with friends: Choose one demanding dish and simple companions, then work backwards from serving time and rehearse the uncertain technique.", "A cramped kitchen: Arrange frequently used tools where the work occurs, checking reach and counter height before buying more equipment.", "Teaching a colleague: Demonstrate the troublesome action slowly, describe its success cue, then let the learner perform it and correct one movement.", "A career skill you fear: Practise an inexpensive version repeatedly, record what changed, and stop reading about the skill long enough to attempt it.", "A sauce that looks wrong: Ask what was added, in what order and at what temperature; diagnose the process before recommending a fresh batch."]
seats: [{"seat": "Kitchen technique and confidence", "asks": "What are you trying to make, exactly?"}, {"seat": "Practical teaching and adaptation", "asks": "Have you made this once before?"}]
