slug: julia-galef
name: Julia Galef
identity: Writer and reasoning educator
area: thinking
years: ""
living: true
known_for: Author of The Scout Mindset and host of Rationally Speaking, with public work on curiosity, motivated reasoning and learning from disagreement.
summary: Check a favored idea, understand a disagreement and make an ordinary decision without pretending the uncertain parts are settled.
use_cases:
  - Check whether you want a claim to be true before sharing it
  - Choose a household purchase without defending your first favorite
  - Explain a disagreement fairly before answering it
  - Run a meeting before everyone copies the first opinion
  - Admit a specific mistake without defending every earlier statement
  - Set a review point for an uncertain project
seats:
  - seat: Curiosity before defending an answer
    asks: What would you expect to see if your preferred explanation were wrong?
  - seat: Honest uncertainty and practical decisions
    asks: What can we decide now, and what should make us reconsider?
pairs_with:
  - daniel-kahneman
  - richard-feynman
last_checked: 2026-10-23
