slug: julie-schwartz-gottman
name: Julie Schwartz Gottman
identity: Clinical psychologist
area: thinking
years: 1951–
living: true
known_for: Julie Schwartz Gottman co-founded the Gottman Institute and helped
  translate research into public education and practice. Her coauthored books
  include Fight Right, The Love Prescription, Eight Dates and And Baby Makes
  Three.
summary: Turn recurring disagreements into conversations that include both experiences.
use_cases:
  - "Prepare a conversation about a recurring fight: Name companionship and
    freedom separately before deciding whether your household can take
    responsibility for a pet."
  - "Hear both sides before a holiday decision: Ask what a family holiday
    represents to each person before bargaining over travel days and relatives."
  - "Acknowledge hurt without abandoning your view: Recognize that a late
    arrival felt lonely while explaining a delayed train, without using your
    explanation to erase hurt."
  - "Write a specific repair and apology: If you mocked a suggestion, own the
    mocking and stop it; discuss the separate budget issue later."
  - "Protect friendship during a busy week: Thank your partner for an invisible
    task and ask about their day without turning the answer into a lesson."
  - Work through an in-laws disagreement that becomes an accusation about loyalty
  - Prepare a respectful relationship conversation with describe the conflict
    and find flexibility
seats:
  - seat: Conflict repair and shared meaning
    asks: How would a conflict can reveal longing change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using validate without surrendering?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
