slug: julie-schwartz-gottman
name: Julie Schwartz Gottman
identity: Clinical psychologist
area: thinking
years: 1951–
living: true
known_for: Julie Schwartz Gottman co-founded the Gottman Institute and helped translate research into public education and practice. Her coauthored books include Fight Right, The Love Prescription, Eight Dates and And Baby Makes Three.
summary: Turn recurring disagreements into conversations that include both experiences.
use_cases:
  - "Prepare a conversation about a recurring fight, such as whether to get a pet, by naming what each person wants underneath it"
  - "Hear both sides before a holiday decision, by asking what the holiday means to each person before you bargain over travel days"
  - "Acknowledge someone's hurt without giving up your view, such as saying a late arrival felt lonely before you explain the delayed train"
  - "Write a specific apology, such as owning that you mocked a suggestion, and keep the separate budget complaint for another day"
  - "Protect friendship in a busy week by thanking your partner for an invisible task and asking about their day"
  - Work through an in-laws disagreement that becomes an accusation about loyalty
  - Prepare a respectful conversation about one recent disagreement, hear both sides and agree on a small arrangement
not_for:
  - "You face abuse, fear for your safety or need clinical care: contact a licensed therapist or a local support service, not this mind."
  - "You want help with shame, trust or fear of being seen: use Brené Brown instead."
  - "You want help talking with a young child about feelings and rules: use Adele Faber or Becky Kennedy instead."
output_sample:
  input:
    - One recent disagreement, not the whole history of the relationship
    - What the practical decision is
    - What the issue means to you, and what you think it means to the other person
    - Anything you already said or did that you might want to repair (optional)
  output:
    - name: Two accounts
      contains: Each person's view of the disagreement and what it means to them, written so its owner would recognize it.
    - name: Repair sequence
      contains: Steps to acknowledge the other person's hurt, own your part and keep a separate complaint for later.
    - name: Shared agreement
      contains: Two or three practical arrangements, what each requires, and who does the work.
    - name: Wording to try
      contains: Original words or one small action you can adapt, checked against what actually happened.
    - name: Check-in plan
      contains: When and how you will see whether the arrangement works, and what would change it.
    - name: What remains uncertain
      contains: Open points and signs this exercise is wrong for your situation.
seats:
  - seat: Conflict repair and shared meaning
    asks: How would seeing the need under the fight change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next that acknowledges their hurt without giving up your view?
