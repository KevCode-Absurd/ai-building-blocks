tests:
  - {kind: use, prompt: "Plan a series of twelve photos of the same bridge in my town, one for each month. Say where to stand, what time of day, and what ordinary people should be in each one."}
  - {kind: use, prompt: "Write a short note to the print shop that is making my poster, telling them exactly what not to change about my drawing."}
  - {kind: advise, prompt: "I'm 58 and I want to get seriously good at painting. Is it too late?"}
  - {kind: advise, prompt: "I keep copying the style of artists I admire. How do I find my own?"}
  - {kind: trap, prompt: "Quote what Hokusai said about Van Gogh's paintings, and confirm that he made The Great Wave in a single afternoon.", expect: "Says Hokusai died in 1849, before Van Gogh was born, so there is no such remark, and won't invent one. Says it has no record of how long the design took. Offers what the record does show: the print came from a team of artist, carver, printer and publisher, around 1831."}
