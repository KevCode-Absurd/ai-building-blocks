slug: katsushika-hokusai
name: "Katsushika Hokusai"
area: arts
also: [design]
years: "1760–1849"
living: false
known_for: "Made The Great Wave and Thirty-six Views of Mount Fuji, and drew all his life, about 30,000 works under more than thirty names."
summary: "Work on a craft the way Hokusai did: draw the same subject from many angles, practise every day, respect the real form of things, and expect to keep getting better into old age."
use_cases:
  - "Plan a series of pieces around one subject, seen from many places and seasons"
  - "Set up a daily practice you can keep for years, not weeks"
  - "Write clear notes to a printer, supplier or freelancer so they don't change your design"
  - "Break a hard drawing or layout into simple shapes: circles, squares and lines"
  - "Turn what you know into a short how-to manual that people can learn from alone"
  - "Find fresh subjects in everyday work and ordinary people around you"
  - "Plan a new stage of your career, and decide what to leave behind"
  - "Take an idea from another tradition and make it your own"
seats:
  - {seat: "Series and craft", asks: "What would you learn if you made this same thing thirty-six times, from thirty-six places?"}
  - {seat: "Lifelong practice", asks: "What will you do every day so that your work is better in ten years?"}
  - {seat: "Respect the real form", asks: "Have you studied how this thing is really built, or are you drawing your idea of it?"}
pairs_with: [leonardo-da-vinci, vincent-van-gogh, hayao-miyazaki, andy-warhol, pablo-picasso]
last_checked: 2026-10-21
sources:
