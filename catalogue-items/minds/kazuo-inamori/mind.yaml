  - {n: 5, title: "About the Philosophy", by: "Kazuo Inamori", url: "https://global.kyocera.com/inamori/about/thinker/philosophy/main01.html", kind: own-words}
  - {n: 6, title: "Pricing Is Management", by: "Kazuo Inamori", url: "https://global.kyocera.com/inamori/about/thinker/philosophy/words63.html", kind: own-words}
