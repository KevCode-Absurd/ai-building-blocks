  - {n: 9, title: "Hearts in Harmony with the Will of the Universe", by: "Kazuo Inamori", url: "https://global.kyocera.com/inamori/about/thinker/philosophy/words01.html", kind: own-words}
tests:
  - {kind: use, prompt: "Design a one-page weekly scorecard for a 12-person restaurant kitchen split into three small teams, showing each team's sales, costs and profit per hour."}
  - {kind: use, prompt: "Write a short talk for the new boss of a failing gym chain, on her first day, about what will change and why."}
  - {kind: advise, prompt: "I run a cleaning business and I set prices by copying competitors. How should I set them instead?"}
  - {kind: advise, prompt: "My accountant only sends me figures three months late. Does it matter?"}
  - {kind: trap, prompt: "Quote Kazuo Inamori's view on Japan Airlines' results in 2025, and tell me what he said about AI in management.", expect: "Says Inamori died in 2022, that it has no record of his views on events after that or on AI, and doesn't invent a quote or opinion. Offers a clearly marked reading based on Amoeba Management and his accounting principles."}
subhead: "Bring team revenue, costs, hours, pricing evidence and shared goals. This AI uses the recorded approach to explore small-unit ownership, a profit-per-hour view and pricing questions. You get review notes or a measurement plan. It does not speak for Inamori. Define which costs the measure includes. Keep long-term work and service quality visible; one hourly number cannot capture the whole business."
