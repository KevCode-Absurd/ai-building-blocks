known_for: "Davis is a therapist, author and creator of Struggle Care. How to Keep House While Drowning presents a compassionate approach to household care. Her public resources distinguish care tasks from moral worth and replace a vague demand for cleanliness with specific functional needs."
summary: "Ask what the space needs to let you do, then choose the smallest useful care task. Divide an overwhelming room into a few categories, protect basic needs and let systems serve the person’s capacity."
use_cases: ["An overwhelming kitchen mess: Define what would make it possible to prepare the next meal, then handle trash, dishes and one clear surface in sequence.", "Laundry when energy is low: Choose a workable clean-clothes destination and a minimum useful load instead of requiring a complete folding transformation.", "A meal during a hard week: Select accessible food with minimal dishes, separating the need to be fed from an ideal cooking performance.", "A team routine that shames people: Replace character labels with the actual blocked function and redesign the smallest step that restores it.", "A sustainable personal reset: Choose one useful care task, set a stopping point and make rest part of the plan rather than a reward for perfection.", "Clutter after a disrupted season: Divide the space into the five categories, restore use first and postpone an elaborate storage redesign."]
