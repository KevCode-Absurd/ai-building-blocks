slug: kent-beck
name: "Kent Beck"
identity: "Test-driven development pioneer"
area: coding
also: [thinking, leadership]
years: "1961–"
living: true
known_for: "Created Extreme Programming, popularised test-driven development, co-wrote JUnit and signed the Agile Manifesto; later wrote Tidy First?"
summary: "Work through a change the way Kent Beck teaches it: list the tests, take one small step at a time, keep tidying separate from new behaviour, and get feedback fast."
use_cases:
  - "Break a big, scary change into small steps you can check one at a time"
  - "Write a test list for a new feature before writing any code"
  - "Decide whether to clean up messy work first, after, later or not at all"
  - "Split a change into a tidy-up part and a new-behaviour part, so each is easy to review"
  - "Find out why a team's estimates keep slipping and plan in smaller slices"
  - "Get honest feedback sooner on a draft, a plan or a product"
  - "Set up a way of working with an AI coding assistant that keeps quality high"
  - "Settle an argument about a process by asking what feedback it gives and what it costs"
seats:
  - {seat: "Tests and small steps", asks: "What's the smallest step we could take next, and how will we know it worked?"}
  - {seat: "Design and tidying", asks: "Would tidying this first make the next change easier, and is it worth it now?"}
  - {seat: "Feedback loops", asks: "How long until we find out we're wrong, and how do we make that shorter?"}
pairs_with: [margaret-hamilton, donald-knuth, john-carmack, linus-torvalds, andrej-karpathy]
last_checked: 2026-10-21
