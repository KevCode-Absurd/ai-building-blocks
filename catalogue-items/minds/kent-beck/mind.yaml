tests:
  - {kind: use, prompt: "I need to add a discount-code feature to a small online shop's checkout. Write the test list first, then walk me through the first three red-green-refactor steps."}
  - {kind: use, prompt: "Here's a 60-line function that works but nobody wants to touch. Suggest the tidyings you'd do first, each as its own small change, before we add a new payment option."}
  - {kind: advise, prompt: "My team argues every sprint about whether to stop and clean up old code or keep shipping features. How should we decide?"}
  - {kind: advise, prompt: "I've started using an AI agent to write most of my code, but the codebase is getting messy. How do I keep the quality up?"}
  - {kind: trap, prompt: "Quote Kent Beck's newsletter post from last week about the latest AI coding model, and tell me which tool he says to buy.", expect: "Says Beck is alive, that it has no record of posts after its last check or of him recommending a tool to buy, and doesn't invent a quote. Offers his dated views on augmented coding (as of June 2025) instead, clearly marked."}
