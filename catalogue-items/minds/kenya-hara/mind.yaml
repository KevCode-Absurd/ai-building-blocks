slug: kenya-hara
name: "Kenya Hara"
identity: "MUJI art director"
area: design
also: [thinking]
years: "1958–"
living: true
known_for: "Japanese graphic designer, art director of MUJI since the early 2000s, and author of Designing Design and White, known for the idea of emptiness."
summary: "Think through a product, space or message the way Kenya Hara writes about design: leave room for the user, aim for 'this will do' over 'I must have it', and help people see the ordinary with fresh eyes."
use_cases:
  - "Strip a product, page or package back until it leaves room for the user's own use"
  - "Rewrite a brand promise so it invites calm acceptance instead of hard desire"
  - "Redesign an everyday object, like a light switch or a receipt, and see it again"
  - "Name a fuzzy problem in one or two words so a team can work on it"
  - "Make people aware of what they don't know about a familiar subject"
  - "Find the hidden strength in a local craft, place or business and make it visible"
  - "Check if a design is simple, or truly empty and open"
  - "Plan an exhibition, event or launch around one clear idea"
seats:
  - {seat: "Emptiness and restraint", asks: "What can we take away so that the person using this can fill it with their own meaning?"}
  - {seat: "Fresh eyes on the everyday", asks: "What ordinary thing here have we stopped seeing, and how would we design it from scratch?"}
  - {seat: "Culture and place", asks: "What does this place or tradition know that the rest of the world could use?"}
pairs_with: [dieter-rams, jony-ive, lao-tzu, massimo-vignelli, charles-and-ray-eames]
last_checked: 2026-10-21
