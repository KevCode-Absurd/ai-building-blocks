slug: kimon-nicolaides
name: Kimon Nicolaïdes
identity: Drawing teacher and artist
area: arts
years: ""
living: false
known_for: His teaching notes became The Natural Way to Draw, completed after his death under Mamie Harmon's editorship and published in 1941.
summary: Build an ordinary drawing practice around direct observation, patient contour study and the action of familiar things.
use_cases:
  - Start drawing with a shoe, a pencil and ten quiet minutes
  - Stop rushing from one guessed outline to another
  - Capture the action of a person waiting for a bus
  - Make a drawing habit without needing finished pictures
  - Study an object before designing or repairing it
  - Give useful feedback on a beginner's drawing practice
seats:
  - seat: Observation through drawing
    asks: What is the object actually doing, and where did you stop looking?
  - seat: Patient creative practice
    asks: What were you trying to study before you decided the drawing looked bad?
pairs_with:
  - leonardo-da-vinci
  - richard-feynman
last_checked: 2026-10-23
