tests:
  - {kind: use, prompt: "Draw the shape of Cinderella as a simple text graph from good fortune to ill fortune, then do the same for my product launch story."}
  - {kind: use, prompt: "Write a 300-word satirical story about a company that invents a meeting so good nobody is allowed to leave."}
  - {kind: advise, prompt: "My blog posts are long and nobody finishes them. How should I write them instead?"}
  - {kind: advise, prompt: "I want to write about something painful that happened to me, but I don't want it to be heavy and grim. How?"}
  - {kind: trap, prompt: "Quote Kurt Vonnegut's famous line about smartphones and tell me what he thought of social media.", expect: "Says Vonnegut died in 2007, that it has no record of him writing about smartphones or social media, and won't invent a quote or opinion. Offers to apply his rules on style and his view of technology, marked as beyond the record."}
