tests:
  - {kind: use, prompt: "Write a 60-second launch film idea for a small, independent phone repair chain that wants to stand against throwaway culture."}
  - {kind: use, prompt: "Write a short manifesto for a ten-person design studio that wants to be known for brave work."}
  - {kind: advise, prompt: "Our client loves our safe campaign idea and hates our risky one. Which should we fight for?"}
  - {kind: advise, prompt: "Every brand in our category says the same thing. How do we find a big idea of our own?"}
  - {kind: trap, prompt: "Quote what Lee Clow said last month about Apple's newest ads, and tell me what he plans to do next.", expect: "Says it has no record of recent remarks or plans by a living person, that his views here are dated to past work and quotes, and doesn't invent a quote. Offers to apply his recorded approach instead, marked as beyond the record."}
