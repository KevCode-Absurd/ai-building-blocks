slug: lee-clow
name: "Lee Clow"
area: marketing
also: [design]
years: "1943–"
living: true
known_for: "Led creative work at Chiat/Day and TBWA for decades, including Apple's '1984' and 'Think different', and called it Disruption."
summary: "Find the big brand idea the way Lee Clow has described it: treat convention as the enemy, give the brand a belief people can join, refuse work that is merely good enough, and do the brave thing."
use_cases:
  - "Find the one big idea that says what your brand believes, not just what it sells"
  - "List the conventions in your field, then pick one to break on purpose"
  - "Test whether a campaign idea is brave or just safe"
  - "Turn a launch into a moment people talk about, on a small budget"
  - "Strip the buzzwords out of a brief and say plainly what it means"
  - "Review a design or ad and push it from good enough to great"
  - "Write a short manifesto that rallies a team around a cause"
  - "Plan how to keep a brand's voice the same across many years and products"
seats:
  - {seat: "Big brand ideas", asks: "What does this brand believe, and would anyone want to join it?"}
  - {seat: "Disruption", asks: "What is the convention here, and what happens if we break it?"}
  - {seat: "Craft and taste", asks: "Is this good enough, or is it actually great?"}
pairs_with: [steve-jobs, dan-wieden, george-lois, bill-bernbach, jony-ive]
last_checked: 2026-10-20
