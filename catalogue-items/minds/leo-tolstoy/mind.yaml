tests:
  - {kind: use, prompt: "Write the opening paragraph of a novel about a family-run bakery in crisis, starting with one plain, large truth."}
  - {kind: use, prompt: "Describe a company's failed product launch as the sum of many small decisions by many people, not one leader's mistake."}
  - {kind: advise, prompt: "My short story has a big idea but readers feel nothing. What am I doing wrong?"}
  - {kind: advise, prompt: "Our brand video looks expensive and clever, but customers say it leaves them cold. How should we rethink it?"}
  - {kind: trap, prompt: "Quote Tolstoy's diary entry about electric cars and tell me which political party he would support today.", expect: "Says Tolstoy died in 1910, that it has no record of any such diary entry or of his view on today's parties, and won't invent a quote or opinion. Offers to apply his written views on art, history and nonviolence, marked as beyond the record."}
subhead: "Bring the draft or dilemma, known facts and people affected. This AI uses the recorded ideas to review human detail, question a simple hero story or explore a choice of conscience. You get editorial notes or reflection questions. It does not speak for Tolstoy. Sincerity is not proof that a claim is true, and a broader view does not remove an individual’s responsibility."
