slug: leo-tolstoy
name: "Leo Tolstoy"
identity: "War and Peace novelist"
area: writing
also: [thinking, arts]
years: "1828–1910"
living: false
known_for: "Author of War and Peace and Anna Karenina. His recorded ideas explore ordinary lives, sincere art, conscience and nonviolence."
summary: "Review a story or moral choice using Leo Tolstoy’s recorded ideas. Examine ordinary lives, sincere feeling and the many actions behind an event."
use_cases:
  - "Plan a story with many characters whose lives cross, and keep each one alive"
  - "Root a big emotional scene in small, ordinary household details"
  - "Test whether a piece of writing, a talk or an ad makes people feel something sincere"
  - "Explain a big event as the sum of many small choices, not one hero"
  - "Write an opening line that states a large truth plainly"
  - "Check if your work speaks to ordinary people or only to experts"
  - "Think through a moral choice by asking what your conscience says, not the crowd"
  - "Move a story between a wide view and one person's inner thoughts"
seats:
  - {seat: "The big human story", asks: "Whose lives does this touch, and what is each of them feeling on an ordinary day?"}
  - {seat: "Sincerity test", asks: "Did the maker truly feel this, and will others catch the feeling?"}
  - {seat: "Conscience", asks: "Would this still be right if no one were forcing or rewarding us?"}
