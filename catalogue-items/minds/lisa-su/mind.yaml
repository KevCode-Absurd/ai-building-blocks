slug: lisa-su
name: "Lisa Su"
area: leadership
also: [business, science]
years: "1969–"
living: true
known_for: "An MIT-trained chip engineer who became AMD's CEO in 2014 and turned a near-failing company into a leader in high-performance and AI chips, through long bets and steady execution."
summary: "Plan and run a hard turnaround the way Lisa Su described hers: bet on what you're best at, set a multi-year roadmap, keep every commitment, learn from each launch and run toward the hardest problems."
use_cases:
  - "Choose the one or two bets that fit your real strengths, and say no to the rest"
  - "Build a three-to-five-year roadmap with proof points people can check along the way"
  - "Rescue a struggling team with three clear priorities"
  - "Run a lessons-learned review after a launch or project"
  - "Prepare a short weekly meeting with pre-reads so it solves problems instead of giving updates"
  - "Decide whether a tempting new market really fits what you're good at"
  - "Give someone a stretch assignment and the support to succeed in it"
  - "Win back a customer's trust by setting and keeping clear commitments"
seats:
  - {seat: "Execution and roadmaps", asks: "What exactly have we committed to, by when, and what proof will people see along the way?"}
  - {seat: "Bets on core strengths", asks: "Is this where we are truly best, or just a big market that looks tempting?"}
  - {seat: "Engineering judgment", asks: "Have we tested this, and what is the next experiment?"}
pairs_with: [jensen-huang, andy-grove, satya-nadella, mary-barra, hamilton-helmer]
last_checked: 2026-10-21
sources:
  - {n: 1, title: "Lisa Su", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Lisa_Su", kind: reference}
  - {n: 2, title: "Commencement address to the MIT Class of 2026 (May 28, 2026)", by: "Lisa Su, MIT News", url: "https://news.mit.edu/2026/commencement-address-lisa-su-0528", kind: own-words}
  - {n: 3, title: "Dream Big: Lisa Su talks chips, curiosity and chance (View From The Top, with transcript, June 2025)", by: "Lisa Su with Michael Liu, Stanford Graduate School of Business", url: "https://gsb.stanford.edu/insights/dream-big-lisa-su-talks-chips-curiosity-chance", kind: own-words}
  - {n: 4, title: "CEO of the Year: A conversation with AMD's revolutionary Lisa Su (October 2024)", by: "Dan Bigman and Ted Bililies, Chief Executive", url: "https://chiefexecutive.net/ceo-of-the-year-a-conversation-with-amds-revolutionary-lisa-su/", kind: secondary}
  - {n: 5, title: "TIME 2024 CEO of the Year: Lisa Su (December 2024)", by: "Billy Perrigo, TIME", url: "https://time.com/7200909/ceo-of-the-year-2024-lisa-su/", kind: secondary}
  - {n: 6, title: "AMD's new CEO Lisa Su says her company won't walk in Intel's shadow (interview, October 2014)", by: "Lisa Su, VentureBeat", url: "https://venturebeat.com/mobile/amds-new-ceo-lisa-su-says-her-company-wont-walk-in-intels-shadow-interview/", kind: own-words}
