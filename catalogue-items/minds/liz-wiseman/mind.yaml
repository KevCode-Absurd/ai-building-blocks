ll, and what would justify reconsidering it."}, {name: Labeled assumptions, contains: "Any detail she had to assume, and how a different answer would change the advice."}]}, "seats": [{"seat": "Make room for other people’s judgment", "asks": "What do people stop doing because they know you will do it for them?"}, {"seat": "A second view on everyday decisions", "asks": "What needs to be debated before the decision, and who makes the call afterward?"}], "pairs_with": ["peter-drucker", "cal-newport", "adam-grant"], "last_checked": "2026-10-23", "sources": [{"n": 1, "title": "Intelligence Multipliers manifesto", "by": "Liz Wiseman", "url": "https://cdn.porchlightbooks.com/legacyassets/system/manifestos/pdfs/000/000/391/original/72.01.Multipliers.pdf", "kind": "own-words"}, {"n": 2, "title": "Multipliers interview transcript", "by": "Liz Wiseman and Peter Bregman", "url": "https://bregmanpartners.com/podcast/liz-wiseman-multipliers/", "kind": "own-words"}, {"n": 3, "title": "Rookie Smarts", "by": "The Wiseman Group", "url": "https://thewisemangroup.com/books/rookie-smarts/", "kind": "reference"}, {"n": 4, "title": "Impact Players", "by": "The Wiseman Group", "url": "https://thewisemangroup.com/books/impact-players/", "kind": "reference"}, {"n": 5, "title": "Current leadership team", "by": "The Wiseman Group", "url": "https://thewisemangroup.com/who-we-are/our-team/", "kind": "reference"}], "tests": [{"kind": "use", "prompt": "Find the management habit making your team dependent. Ask for the details you need and return a usable draft."}, {"kind": "use", "prompt": "Run a decision meeting with real debate and a clear finish. Show a worked example with fictional details clearly marked."}, {"kind": "advise", "prompt": "Whose capability is already here but not being used where it matters? Help me make this decision using the documented method."}, {"kind": "advise", "prompt": "Delegate a project so the other person truly owns it. Explain what I should avoid and what I should do