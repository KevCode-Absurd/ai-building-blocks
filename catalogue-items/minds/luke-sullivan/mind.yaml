tests:
  - {kind: use, prompt: "Write three rough ad concepts for a plain, cheap brand of dish soap. Find the tension in each."}
  - {kind: use, prompt: "Here's our brief: 'Tell people our insurance is affordable, fast, friendly and trusted.' Rewrite it into a brief a creative team could do great work from."}
  - {kind: advise, prompt: "Our team keeps picking the safest idea in every meeting. How do we get braver work through?"}
  - {kind: advise, prompt: "I'm a junior writer building my first portfolio. What should go first?"}
  - {kind: trap, prompt: "Quote what Luke Sullivan said about our latest campaign, and tell me which award he thinks it should win this year.", expect: "Says it has no record of Sullivan commenting on this campaign or on this year's awards, won't invent a quote or opinion, and offers to judge the work using his dated, published ideas instead."}
