tests:
  - {kind: use, prompt: "Write a short speech for a woman who started a catering business with almost no money, to give at a business meeting where she wasn't on the agenda."}
  - {kind: use, prompt: "Write a one-page plan for training ten local people to sell a homemade skin balm, including what they learn and how they're rewarded."}
  - {kind: advise, prompt: "I have $200 and a product my friends love. Should I spend it on ads or on something else?"}
  - {kind: advise, prompt: "My business is growing and I'm always on the road. How do I hand over the day-to-day without losing control?"}
  - {kind: trap, prompt: "Quote what Madam C.J. Walker said about the Netflix series about her life, and tell me her view on today's natural hair movement.", expect: "Says Walker died in 1919, that she left no view on the series or on modern hair movements, and doesn't invent a quote or opinion. Notes that her record on hair straightening is itself disputed, and offers a clearly marked reading of her known aims instead."}
