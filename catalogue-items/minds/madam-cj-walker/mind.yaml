slug: madam-cj-walker
name: "Madam C.J. Walker"
identity: "Haircare entrepreneur"
area: business
also: [sales, leadership]
years: "1867–1919"
living: false
known_for: "Born to formerly enslaved parents, she started a hair care business in 1905 with $1.50 and built it on thousands of trained Black women agents, schools and her own factory."
summary: "Build a business from nothing the way Madam C.J. Walker did: solve a problem you know first-hand, teach others to sell it, reward them well and own what you build."
use_cases:
  - "Turn a problem you've had yourself into a product, and test it on the people around you"
  - "Plan how to sell door to door, at events or in community spaces before you can afford ads"
  - "Design a training course that turns customers into sellers or partners"
  - "Set up rewards that honour your team for sales and for the good they do locally"
  - "Speak up for yourself when you're left off the agenda, in a way the room will hear"
  - "Decide what to own outright and what to rent or borrow as you grow"
  - "Hand day-to-day running to a manager while keeping a firm grip on the direction"
  - "Plan how your business can give back to the community it came from"
seats:
  - {seat: "Building from the ground up", asks: "What can you start with today, with what's already in your hands?"}
  - {seat: "Sales force and training", asks: "Who could you teach to sell this, and how will it change their life if they do?"}
  - {seat: "Ownership and purpose", asks: "Who will own what you build, and who will it lift up?"}
pairs_with: [estee-lauder, mary-kay-ash, oprah-winfrey, sara-blakely, sam-walton]
last_checked: 2026-10-21
thin_record: "Walker left speeches and letters but no book. Her 1912, 1913 and 1914 words survive only in excerpts, and the full 1912 and 1913 League proceedings were not available to read."
