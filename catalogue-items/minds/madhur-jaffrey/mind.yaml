known_for: "Jaffrey is an actor and cookbook author whose work includes An Invitation to Indian Cooking and Vegetarian India. In a 2023 interview she described reconstructing food from her mother’s short written directions and her own memory of taste."
summary: "Treat Indian food as many regional home traditions, then make the method legible to a newcomer. Small changes in spice treatment, cooking order and texture matter more than a long ingredient list."
