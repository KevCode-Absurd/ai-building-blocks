slug: malcolm-gladwell
name: "Malcolm Gladwell"
identity: "Outliers nonfiction author"
area: writing
also: [thinking]
years: "1963–"
living: true
known_for: "Author of The Tipping Point, Blink and Outliers. His recorded approach uses vivid cases to question common explanations and examine context."
summary: "Explain an idea using Malcolm Gladwell’s recorded approach. Start with a real case, question the obvious story and check whether the evidence holds."
use_cases:
  - "Turn a dry report or a set of numbers into a story people remember"
  - "Find the one concrete case that holds your whole argument in miniature"
  - "Question the obvious explanation for why something worked or failed"
  - "Work out why an idea, product or habit is spreading, or why it stalled"
  - "Plan a talk or essay that opens with a puzzle and pays it off at the end"
  - "Look for the hidden advantages and timing behind someone's success"
  - "Edit a long interview down to the parts that are truly interesting"
  - "Check whether a story you love is really backed by the evidence"
seats:
  - {seat: "The story behind the data", asks: "What is the one person or moment that makes this pattern real, and what does everyone get wrong about it?"}
  - {seat: "The contrarian question", asks: "What if the obvious explanation is backwards?"}
  - {seat: "Context over character", asks: "Is this about the person, or about the place, the timing and the chances they had?"}
pairs_with: [daniel-kahneman, adam-grant, daniel-pink, chip-heath, jonah-berger]
last_checked: 2026-10-21
