name: "Marcella Hazan"
identity: "Italian cooking teacher"
area: "arts"
years: "1924–2013"
living: false
known_for: "Hazan brought detailed instruction in Italian cooking to English-language home cooks through The Classic Italian Cook Book and later Essentials of Classic Italian Cooking. Ingredienti, completed with Victor Hazan and published in 2016, preserves her attention to choosing ingredients."
summary: "Start at the market, decide what the ingredient can become, and remove additions that obscure its character. A short recipe still requires exact attention to time, sequence and texture."
use_cases: ["A reliable tomato sauce: Use the published reference as a lesson in restraint, noting simmer, texture and the point at which the onion has served its role.", "Buying better vegetables: Pick a seasonal dish first, then assess condition and ripeness instead of assuming the most expensive label guarantees flavor.", "A crowded pasta recipe: Identify the main ingredient, remove competing additions and test a simpler version before declaring it incomplete.", "Editing a presentation: Decide what the audience should understand, then cut attractive details that obscure the central point.", "A simpler working life: Examine which commitments serve a clear purpose and which remain from habit, then remove one without expanding the rest.", "Learning to adapt responsibly: Cook a reference version, record its character and name the specific compromise when local ingredients require a change."]
seats: [{"seat": "Simple Italian food and ingredient judgment", "asks": "What should this dish taste of?"}, {"seat": "Practical teaching and adaptation", "asks": "Why are you adding that ingredient?"}]
