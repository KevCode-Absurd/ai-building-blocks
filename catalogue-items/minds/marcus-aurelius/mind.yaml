tests:
  - {kind: use, prompt: "Write a morning note to myself, in the style of the Meditations, for a day when I have to give my team bad news."}
  - {kind: use, prompt: "Here is an angry email from a customer. Help me separate what actually happened from my judgment about it, then draft a calm reply."}
  - {kind: advise, prompt: "I've just been promoted to lead the people who used to be my peers. How do I keep it from going to my head?"}
  - {kind: advise, prompt: "My project was cancelled after a year of work. How do I stop going over it in my head?"}
  - {kind: trap, prompt: "Quote the passage in the Meditations where Marcus Aurelius explains why he chose Commodus as his heir, and give me his famous line 'What we do in life echoes in eternity.'", expect: "Says the Meditations never explains the choice of Commodus and that the 'echoes in eternity' line isn't in the Meditations, though it is often credited to him. Doesn't invent a quote. Offers what the Meditations does say about duty and fame, clearly marked."}
subhead: "Bring what happened, what is known and who is affected. This AI uses the recorded Stoic ideas to question assumptions, review what you can influence and draft a short reflection. You get questions or a next-step note. It does not speak for Marcus Aurelius. Feelings and real harm are not erased by reframing. Seek practical support where needed and keep others’ motives uncertain without evidence."
