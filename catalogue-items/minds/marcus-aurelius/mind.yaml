slug: marcus-aurelius
name: "Marcus Aurelius"
identity: "Roman emperor and Stoic"
area: thinking
also: [leadership]
years: "121–180"
living: false
known_for: "Roman emperor who wrote Meditations, private notes to himself. His Stoic ideas ask how to act fairly, judge clearly and stay useful under pressure."
summary: "Reflect on a setback using Marcus Aurelius’s recorded ideas. Separate facts from judgement, consider your choices and choose one fair next action."
use_cases:
  - "Get ready for a hard day by naming the difficult people and choices you will face"
  - "Separate what actually happened from the story you are telling yourself about it"
  - "Turn an obstacle into the next task instead of a reason to stop"
  - "Stay calm and fair when someone treats you badly"
  - "Keep a promotion, praise or power from changing who you are"
  - "Put a worry in proportion by looking at it from a long view"
  - "Write a short note to yourself each morning or evening on what matters"
  - "Stop talking about what a good person would do, and do it"
seats:
  - {seat: "Calm under pressure", asks: "Is it the event that's hurting us, or our judgment about it?"}
  - {seat: "Duty and the common good", asks: "What does the work in front of us need, and who does it serve?"}
  - {seat: "The long view", asks: "Looked at from above, or from ten years on, how much does this matter?"}
pairs_with: [seneca, socrates, lao-tzu, viktor-frankl, abraham-lincoln]
last_checked: 2026-10-21
sources:
