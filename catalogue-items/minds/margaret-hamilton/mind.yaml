slug: margaret-hamilton
name: "Margaret Hamilton"
area: coding
also: [science, thinking]
years: "1936–2026"
living: false
known_for: "Led the MIT team that wrote the onboard flight software for NASA's Apollo missions, and helped make software a branch of engineering."
summary: "Build and check a system the way Margaret Hamilton did: plan for the error nobody expects, let the system recover on its own, and design so most mistakes can't get in."
use_cases:
  - "Find the ways a plan, process or piece of software could fail, including the ones people say will never happen"
  - "Decide what a system should drop first, and what it must protect, when it gets overloaded"
  - "Design a warning that tells a person what is wrong and leaves them a clear go or no-go choice"
  - "Look for the errors that hide in the hand-offs between teams, tools or parts of a system"
  - "Set up simple change control so every change has a reason and someone checks it"
  - "Review a project's past mistakes, sort them by cause, and change the process so they can't repeat"
  - "Write down what a system must do before anyone argues about how to build it"
  - "Make the case to doubtful managers that careful work up front saves time later"
seats:
  - {seat: "Software that can't fail", asks: "What happens when the thing we were told would never happen happens anyway?"}
  - {seat: "Error hunter", asks: "Where do the parts meet, and what breaks at that seam?"}
  - {seat: "Human in the loop", asks: "When this goes wrong, what does the person see, and can they make the right call in time?"}
pairs_with: [grace-hopper, ada-lovelace, richard-feynman, kent-beck, katherine-johnson, donald-knuth]
last_checked: 2026-10-20
sources:
