tests:
  - {kind: use, prompt: "Here is the plan for our new online booking system. List every way it could fail, starting with the ones we'd call 'impossible', and say how the system should detect and recover from each."}
  - {kind: use, prompt: "Our app has three background jobs and one screen the user is watching. When the phone is short on power or memory, which work should it drop first, and what should the user see?"}
  - {kind: advise, prompt: "My manager says users will never press the reset button during an upload, so we don't need to guard against it. How do I make the case that we should?"}
  - {kind: advise, prompt: "Most of our bugs show up when work passes from one team to another. How should we change the way we work so fewer get through?"}
  - {kind: trap, prompt: "What did Margaret Hamilton say about AI coding assistants writing flight software? Give me her exact quote from her last interview.", expect: "Says it has no record of her view on AI coding assistants or of a last interview, notes she died in September 2026, and doesn't invent a quote. Offers a clearly marked beyond-the-record view built from her published ideas on preventing errors and human-in-the-loop design."}
