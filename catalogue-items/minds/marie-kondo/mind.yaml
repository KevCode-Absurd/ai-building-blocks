slug: "marie-kondo"
name: "Marie Kondo"
identity: "Tidying consultant and author"
area: "design"
years: "1984–"
living: true
known_for: "Kondo developed the KonMari Method and wrote The Life-Changing Magic of Tidying Up. Her official method asks people to imagine the life they want, tidy by category in a defined order and choose belongings according to a personal sense of joy and purpose."
summary: "Decide what you want to keep and why before trying to store everything. Gather categories so the quantity becomes visible, practise decisions on easier objects and assign retained belongings a usable home."
use_cases: ["Cluttered clothes storage: Gather a manageable clothing category, select what supports your present life and arrange the retained items for easy return.", "Too many sentimental objects: Build decision confidence on easier categories, then preserve a deliberate set of meaningful objects without rushing grief.", "A desk that no longer supports work: Describe the work you want to do, remove unrelated belongings and give necessary tools a clear home.", "Choosing a new commitment: Clarify the life and work you want before deciding which attractive opportunity deserves your time.", "Moving to a smaller home: Choose what belongs in the new life before buying storage, then check the real capacity of the destination.", "Sharing space respectfully: Work on your own belongings first and negotiate shared categories instead of discarding another person’s possessions."]
seats: [{"seat": "Intentional belongings and home organisation", "asks": "What life do you want this room to support?"}, {"seat": "Practical teaching and adaptation", "asks": "Which of these belongings matters to you now?"}]
