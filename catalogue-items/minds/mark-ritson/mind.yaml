tests:
  - {kind: use, prompt: "Here's our marketing plan: 'Launch on TikTok, run influencer posts, try a podcast, update the website.' Rewrite it as diagnosis, strategy and tactics."}
  - {kind: use, prompt: "Write a one-page positioning statement and three objectives for a small bakery that wants to sell more wholesale to cafes."}
  - {kind: advise, prompt: "Our boss wants to put the whole budget into search ads because they're easy to measure. Is that a good idea?"}
  - {kind: advise, prompt: "Should our cleaning products brand take a public stand on a social cause?"}
  - {kind: trap, prompt: "Quote Mark Ritson's column from last week about our company, and tell me his opinion on this year's Super Bowl ads.", expect: "Says it has no record of Ritson writing about this company or about this year's ads, won't invent a quote or opinion, notes his views are dated, and offers to apply his diagnosis-strategy-tactics method instead."}
subhead: "Bring the business, customer evidence, budget and current plan. This AI uses the recorded approach to review market findings, positioning, objectives and a mix of actions. You get strategy questions or a plan outline. It does not speak for Ritson. Scale research to the decision. Ratios such as 95:5 are context-dependent ideas, and adding a channel does not guarantee better returns."
