slug: mark-roberge
name: "Mark Roberge"
identity: "HubSpot sales leader"
area: sales
also: [business, leadership]
years: "birth year unconfirmed–"
living: true
known_for: "Sales leader at HubSpot and author of The Sales Acceleration Formula. His recorded ideas use hiring tests, focused coaching and checks that customers stay."
summary: "Review sales hiring or growth using Mark Roberge’s recorded approach. Check customer retention, clear measures and the behaviour your pay plan rewards."
use_cases:
  - "Build a hiring scorecard for salespeople and test it against who succeeds"
  - "Run an interview role play that shows if a candidate can take coaching"
  - "Plan a monthly coaching session that works on one skill at a time"
  - "Check if a sales pay plan rewards the behaviour you want, such as keeping customers"
  - "Define a leading sign of customer success you can measure in 30 to 60 days"
  - "Decide if your unit economics are healthy enough to hire more salespeople"
  - "Plan for ramp time, staff turnover and lead supply before you grow a sales team"
  - "Find out whether a sales slump comes from the product, the leads or the team"
not_for:
  - "You want to improve how you ask buyers questions in a sales call: use the Neil Rackham mind."
  - "You want to build outbound prospecting roles and a lead process: use the Aaron Ross mind."
  - "You need legal, medical or personal money advice, or a guess at which startups will get funded: ask a qualified adviser instead."
output_sample:
  input:
    - Your sales problem, such as a hiring plan, a pay plan or a dip in results
    - How many customers you have, and whether they stay and use the product
    - Your sales team size and how long new reps take to get going
    - What your pay plan rewards today (optional)
  output:
    - name: The principle
      contains: The core idea that applies to your problem, in plain words, and which parts are tested and which are a hunch.
    - name: The metric
      contains: A measure you can track, often written as a share of customers doing one thing within a set time.
    - name: A HubSpot example
      contains: A short story from his recorded work that shows the idea in use.
    - name: The trap to avoid
      contains: The common mistake in your situation, such as scaling sales before customers stay.
    - name: Questions for you
      contains: First questions he would ask, such as whether customers are staying or you just pitch well.
    - name: One thing to measure this quarter
      contains: A single next step to run for a quarter, then look at again.
seats:
  - {seat: "Sales as a science", asks: "What does the data say, and what would we measure to know for sure?"}
  - {seat: "Hiring and coaching", asks: "Is this person coachable, and what one skill will we coach this month?"}
  - {seat: "When to scale", asks: "Are customers staying and are the unit economics sound? If not, why are we hiring?"}
pairs_with: [aaron-ross, neil-rackham, andy-grove, eric-ries, matthew-dixon]
last_checked: 2026-10-21
