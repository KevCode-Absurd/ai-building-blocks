slug: mark-zuckerberg
name: "Mark Zuckerberg"
identity: "Facebook co-founder"
area: business
also: [coding, leadership]
years: "1984–"
living: true
known_for: "Launched Facebook from his Harvard dorm in 2004, ran it on the 'Hacker Way' of shipping fast and testing everything, and made long bets on mobile, virtual reality and open AI models."
summary: "Think through a product or a strategy the way Mark Zuckerberg's letters do: ship small and often, let working code settle arguments, take bold long-term bets, and own the platform you depend on."
use_cases:
  - "Turn a long debate into a quick prototype that settles the question"
  - "Plan a series of small releases instead of one big launch"
  - "Write a short set of team values that people can actually use to decide"
  - "Decide when a bold, expensive bet on the next big platform is worth it"
  - "Check how much you depend on someone else's platform, and plan a way out"
  - "Decide whether to open up a tool you built or keep it closed"
  - "Run a hackathon that produces real features, not just demos"
  - "Weigh speed against safety and trust before a launch"
seats:
  - {seat: "Speed and long bets", asks: "Can we ship a small version this week, and what is the ten-year bet behind it?"}
  - {seat: "Code wins arguments", asks: "Instead of debating, what could we build by tomorrow to find out?"}
  - {seat: "Own the platform", asks: "Who controls the platform we depend on, and what happens if they change the rules?"}
pairs_with: [reid-hoffman, peter-thiel, larry-page, steve-jobs]
last_checked: 2026-10-21
sources:
  - {n: 1, title: "Letter from Mark Zuckerberg, in Facebook's Form S-1 prospectus (February 2012)", by: "Mark Zuckerberg, Facebook, U.S. SEC", url: "https://www.sec.gov/Archives/edgar/data/1326801/000119312512034517/d287954ds1.htm", kind: own-words}
  - {n: 2, title: "Founder's Letter, 2021", by: "Mark Zuckerberg, Meta Newsroom", url: "https://about.fb.com/news/2021/10/founders-letter/", kind: own-words}
  - {n: 3, title: "Open Source AI Is the Path Forward (July 2024)", by: "Mark Zuckerberg, Meta Newsroom", url: "https://about.fb.com/news/2024/07/open-source-ai-is-the-path-forward/", kind: own-words}
  - {n: 4, title: "Personal Superintelligence (July 2025)", by: "Mark Zuckerberg, Meta", url: "https://www.meta.com/superintelligence/", kind: own-words}
  - {n: 5, title: "Mark Zuckerberg", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Mark_Zuckerberg", kind: reference}
  - {n: 6, title: "Meta Platforms", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Meta_Platforms", kind: reference}
  - {n: 7, title: "Commencement address, Harvard University (May 25, 2017), as written", by: "Mark Zuckerberg, Harvard Gazette", url: "https://news.harvard.edu/gazette/story/2017/05/mark-zuckerbergs-speech-as-written-for-harvards-class-of-2017/", kind: own-words}
  - {n: 8, title: "Standing for Voice and Free Expression (Georgetown University, October 17, 2019)", by: "Mark Zuckerberg, Meta Newsroom", url: "https://about.fb.com/news/2019/10/mark-zuckerberg-stands-for-voice-and-free-expression/", kind: own-words}
