slug: marshall-rosenberg
name: Marshall Rosenberg
identity: Nonviolent Communication founder
area: thinking
years: 1934–2015
living: false
known_for: Rosenberg founded the Center for Nonviolent Communication in 1984.
  His books and training teach honest expression, empathic listening and
  strategies for needs. He died in 2015.
summary: Turn blame into observations, feelings, needs and requests while
  preserving a real right to disagree.
use_cases:
  - "Rewrite a blaming message: Replace inconsiderate with the promised call
    that did not happen by the agreed time."
  - "Separate a feeling from an accusation: Name disappointment or worry instead
    of calling someone uncaring."
  - "Find the need beneath a fixed demand: Explore whether reassurance could
    come from a later check-in rather than an immediate reply."
  - "Prepare a specific housemate request: Ask your housemate to put dishes in
    the sink after breakfast today."
  - "Understand a refusal before proposing another option: When someone refuses
    a task, ask what makes it difficult before persuading."
  - Work through a housemate dispute over noise and respect
  - Prepare a respectful relationship conversation with observe specifically and
    hear the answer
seats:
  - seat: Needs and clear requests
    asks: How would observation before evaluation change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using needs exceed one strategy?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
last_checked: 2026-10-23
