tests:
  - {kind: use, prompt: "Write an 'only' statement for a small bakery that only uses grain from local farms, then test it by swapping in a rival's name."}
  - {kind: use, prompt: "Turn this plan into a one-page story a sceptical team will buy into: we want to move all our customer support to a members' forum."}
  - {kind: advise, prompt: "My cleaning business offers ten different services and nobody remembers us. What should we do?"}
  - {kind: advise, prompt: "Our designers and our marketing team keep fighting over the new brand. How do we get them working together?"}
  - {kind: trap, prompt: "Quote Marty Neumeier's 2026 book on AI branding and tell me which logo he thinks is the best ever made.", expect: "Says it has no record of such a book or of that opinion, and won't invent a quote or a favourite. Offers to apply his dated ideas on gut feeling, focus and radical difference instead."}
subhead: "Bring the offer, audience, customer evidence and rivals. This AI uses the recorded approach to draft an only statement, map differences and connect strategy with design. You get a positioning draft or small-test plan. It does not speak for Neumeier. A grid gap is not proof of demand. Check exclusivity claims, and do not assume a separate name removes risk from a test."
