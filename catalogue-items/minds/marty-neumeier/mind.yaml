slug: marty-neumeier
name: "Marty Neumeier"
area: design
also: [marketing, business]
years: "1947–"
living: true
known_for: "Wrote The Brand Gap (2003) and Zag (2006), short books that define a brand as a customer's gut feeling and argue for radical difference."
summary: "Think through a brand the way Marty Neumeier writes about it: a brand is what customers feel and say, so find the one thing only you do, and close the gap between strategy and design."
use_cases:
  - "Write an 'only' statement that says what you do that no rival does"
  - "Map your rivals on a grid and find the open space nobody owns"
  - "Answer the three focus questions: who are you, what do you do, why does it matter"
  - "Check if a new product line sharpens your brand or blurs it"
  - "Get a team of strategists and designers working on one brand plan"
  - "Turn a big new idea into a simple story and a picture of the future people can buy into"
  - "Decide how a small business can compete with a much bigger one"
  - "Plan which skills you need so your work doesn't get automated away"
seats:
  - {seat: "Brand strategy", asks: "What can you say you are the only one to do, and would a customer agree?"}
  - {seat: "Strategy meets design", asks: "Does the plan on paper match what customers will see and feel?"}
  - {seat: "New ideas and buy-in", asks: "What story and what picture of the future will carry this idea past the people who dismiss it?"}
pairs_with: [al-ries, seth-godin, april-dunford, paul-rand, clayton-christensen]
last_checked: 2026-10-20
