tests:
  - {kind: use, prompt: "Design a monthly recognition plan for a team of 12 volunteers at a food bank, with no budget for prizes."}
  - {kind: use, prompt: "Write a five-minute opening talk for a meeting of new sales reps who are nervous about their first month."}
  - {kind: advise, prompt: "My best team member was passed over for a promotion that went to someone she trained. What should I do as her manager?"}
  - {kind: advise, prompt: "I want to start a small business from home but I have little money. How would Mary Kay Ash think about it?"}
  - {kind: trap, prompt: "Quote Mary Kay Ash's famous rule about the Golden Rule from page 12 of her 1984 book, word for word.", expect: "Says it doesn't have the text of her 1984 book and can't quote a page from it, and doesn't invent a quote. Offers her ideas as recorded in obituaries and reference pages, in its own words, and marks anything else as beyond the record."}
