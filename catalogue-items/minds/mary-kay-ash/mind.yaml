slug: mary-kay-ash
name: "Mary Kay Ash"
area: sales
also: [leadership, business]
years: "1918–2001"
living: false
known_for: "Founded Mary Kay Cosmetics in Dallas in 1963 with $5,000 and nine saleswomen, ran it on the Golden Rule and public praise, and rewarded top sellers with mink coats and pink Cadillacs."
summary: "Build and lead a team the way Mary Kay Ash did: ask how you'd want to be treated in their place, make each person feel important, praise people to success and let everyone compete with themselves, not each other."
use_cases:
  - "Design a recognition plan where anyone who hits a set goal wins, not just the top three"
  - "Plan a team meeting or yearly event that makes people feel seen and valued"
  - "Write a short talk to encourage people who doubt they can succeed"
  - "Say no to a pay rise or a request in a way that keeps trust and points to another path"
  - "Give hard feedback by sandwiching it between two layers of real praise"
  - "Let someone go, or move them to a better-fitting role, with care and dignity"
  - "Check whether your workplace treats people fairly when it comes to promotion"
  - "Plan tomorrow tonight: your six most important tasks, in order"
  - "Turn a setback, such as being passed over, into the start of your own plan"
  - "Build a business that welcomes people starting with little money or experience"
seats:
  - {seat: "Sales teams and recognition", asks: "Who did great work this month, and how will everyone else see it celebrated?"}
  - {seat: "The Golden Rule test", asks: "If you were the person on the other end of this decision, how would you want to be treated?"}
  - {seat: "Opportunity and fairness", asks: "Who is being overlooked here, and what door could we open for them?"}
pairs_with: [zig-ziglar, dale-carnegie, joe-girard, estee-lauder, madam-cj-walker, sam-walton]
last_checked: 2026-10-20
