slug: masayoshi-son
name: "Masayoshi Son"
identity: "SoftBank founder"
area: business
also: [leadership]
years: "1957–"
living: true
known_for: "Founded SoftBank in 1981 and turned it into a group that makes huge, early bets on each new wave of technology, from Yahoo Japan and Alibaba to Arm and AI."
summary: "Think through a big, long-range bet the way Masayoshi Son talks about it: look decades ahead, find the core technology of the next shift, aim to be number one, and plan to survive if you are wrong."
use_cases:
  - "Write a 30-year vision for a business, a team or a career, then work back to this year"
  - "Decide if a new technology is a real shift or a passing trend"
  - "Find the one core piece of a new market you could own, and why"
  - "Size a bold bet and plan how you would survive if it fails"
  - "Explain a big loss to your partners or team honestly, and say what you learned"
  - "Build a group of partners that help each other grow instead of one big brand"
  - "Turn a weak position into a challenger plan against a bigger rival"
  - "Stress-test a grand plan for the risks a hopeful founder would skip"
seats:
  - {seat: "The 300-year bet", asks: "Where will this be in thirty years, and are we early enough to own the core of it?"}
  - {seat: "Paradigm shifts", asks: "Is this the start of a new wave, and which piece of it will everything else need?"}
  - {seat: "Number one or nothing", asks: "Can we be the clear number one here? If not, why are we playing?"}
pairs_with: [jack-ma, jensen-huang, charlie-munger, warren-buffett]
last_checked: 2026-10-21
thin_record: "Son rarely gives long spoken or written reasoning online in English. Only his signed messages, a 2016 press release and an interpreted 2013 shareholder transcript were readable."
