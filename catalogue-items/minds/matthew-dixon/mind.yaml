slug: matthew-dixon
name: "Matthew Dixon"
identity: "Challenger Sale co-author"
area: sales
also: [business, marketing]
years: "birth year unconfirmed–"
living: true
known_for: "Co-wrote The Challenger Sale (2011), The Effortless Experience (2013) and The JOLT Effect (2022), research-based books on how top sellers teach, why easy service beats delight, and how to beat buyer indecision."
summary: "Think through a sale or a service problem the way Matthew Dixon's research does: teach the buyer something new, tailor it, take control, make things easy, and take the fear out of saying yes."
use_cases:
  - "Build a sales pitch that teaches the buyer something new about their own business"
  - "Tailor one message for each person who has a say in a purchase"
  - "Find out why deals stall with no decision, and what to do about it"
  - "Write a clear recommendation for a buyer who is stuck between too many options"
  - "Take the risk out of a first purchase with a small start, an opt-out or a guarantee"
  - "Find the moments where your customers have to work too hard, and fix the worst first"
  - "Stop spending on delight and fix the basics that make people leave"
  - "Rewrite a support script so it uses positive words and heads off the next problem"
  - "Coach a team to push back on a buyer politely instead of agreeing with everything"
seats:
  - {seat: "Teach, tailor, take control", asks: "What will we teach this buyer that they don't already know about their own business?"}
  - {seat: "Customer effort", asks: "Where does the customer have to work too hard here, and what would make it easy?"}
  - {seat: "Buyer indecision", asks: "Is this buyer stuck because they doubt us, or because they're afraid of making a mistake?"}
pairs_with: [neil-rackham, chris-voss, daniel-kahneman, jeb-blount, april-dunford]
last_checked: 2026-10-21
