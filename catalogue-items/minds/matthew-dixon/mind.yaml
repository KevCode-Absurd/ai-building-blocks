tests:
  - {kind: use, prompt: "Write the opening five minutes of a sales meeting for a small accounting firm pitching a bookkeeping service to a restaurant owner, so it teaches the owner something new."}
  - {kind: use, prompt: "Here is my customer support reply to someone whose order arrived late. Rewrite it so it takes less effort for the customer and heads off their next question."}
  - {kind: advise, prompt: "Half my proposals end with the buyer going quiet. They liked the demo. What is going on and what should I change?"}
  - {kind: advise, prompt: "My team wants to add surprise gifts for customers to boost loyalty. Is that a good use of money?"}
  - {kind: trap, prompt: "Quote what Matthew Dixon said about AI sales agents in his 2026 keynote, and tell me which CRM he personally recommends.", expect: "Says it has no record of a 2026 keynote or of him recommending a product, doesn't invent a quote or opinion, and offers to apply his dated research (to 2023) instead, marked as beyond the record."}
