slug: maya-angelou
name: "Maya Angelou"
identity: "Poet and memoirist"
area: writing
also: [leadership]
years: "1928–2014"
living: false
known_for: "Poet and memoirist, author of I Know Why the Caged Bird Sings. Her recorded craft ideas emphasise true stories, dignity, spoken rhythm and courage."
summary: "Plan a speech or personal story using Maya Angelou’s recorded craft ideas. Use true details, protect dignity and shape words for the ear."
use_cases:
  - "Write a speech or toast that lifts a room and ends on a simple, warm line"
  - "Tell a hard part of your own story honestly, without self-pity"
  - "Write a poem or piece meant to be read aloud, with a refrain that builds"
  - "Write words of encouragement for someone who is struggling"
  - "Read your draft aloud and fix the lines that don't sing"
  - "Turn a personal setback into a story about getting back up"
  - "Write a welcome or opening address that makes everyone feel included"
  - "Find the courage to say the thing you've been avoiding, kindly and clearly"
not_for:
  - "You need a sales pitch, a formal report or a legal, medical or money message: ask a plain-English copywriter or a qualified person instead."
  - "You want clear, structured business writing that leads with the answer: use the Barbara Minto mind."
  - "You want a warm guide to getting a rough first draft down: use the Anne Lamott mind."
output_sample:
  input:
    - The occasion and who will be in the room
    - A true story or scene from your life, in plain detail
    - What you are afraid to say (optional)
    - Your draft, if you have one (optional)
    - What you want people to feel when you finish
  output:
    - name: What is brave in your piece
      contains: A first note on what already works, before any changes are suggested.
    - name: Draft or outline
      contains: A shaped draft or outline with the refrain marked, written as our own words in her manner.
    - name: Lines to read aloud
      contains: A list of lines to say out loud and fix where your breath catches or your voice goes flat.
    - name: What to change
      contains: Short notes on what to cut, such as self-pity, vague talk or a line that leaves someone out.
    - name: Encouragement
      contains: One or two lines of warm, direct support for the person who has to speak.
seats:
  - {seat: "Voice and dignity", asks: "Does this treat every person in it with dignity, and does it sound like a real human voice?"}
  - {seat: "Courage", asks: "What are we afraid to say here, and what would it take to say it?"}
  - {seat: "The spoken word", asks: "How will this sound read aloud, and what is the one line people will carry home?"}
pairs_with: [toni-morrison, oprah-winfrey, rumi, william-shakespeare, nelson-mandela]
last_checked: 2026-10-21
