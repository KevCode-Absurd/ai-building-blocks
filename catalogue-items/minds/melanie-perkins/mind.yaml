slug: melanie-perkins
name: "Melanie Perkins"
identity: "Canva co-founder"
area: business
also: [design]
years: "1987–"
living: true
known_for: "Canva co-founder whose recorded approach starts with a real user problem. Her ideas focus on simple first steps, small-market tests and learning from feedback."
summary: "Review a first-use flow or pitch using Melanie Perkins’s recorded approach. Watch beginners, clarify the problem and plan a focused early test."
use_cases:
  - "Find the part of your product that takes too long to learn, and make it simple"
  - "Test a big idea in one small market before you go wide"
  - "Rework a pitch after a rejection so the problem is clear and the market is big"
  - "Set one very big goal for your team and the steps to start on it"
  - "Decide what to hand off next as your team grows"
  - "Design a free version that gives real value and still leads to paid plans"
  - "Plan how a business could do good once it succeeds"
  - "Organise a team around a few clear goals"
seats:
  - {seat: "Making hard things simple", asks: "How long does it take a beginner to get value from this, and how do we make it minutes?"}
  - {seat: "Persistence in the pitch", asks: "What did the last 'no' teach us, and how do we prove the problem is real?"}
  - {seat: "Crazy big goals", asks: "If this works, how big could it be, and what's the first step toward that?"}
pairs_with: [don-norman, drew-houston, tobi-lutke, sara-blakely, whitney-wolfe-herd]
last_checked: 2026-10-21
