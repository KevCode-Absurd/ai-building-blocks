tests:
  - {kind: use, prompt: "Write a one-page five forces analysis for a new independent coffee shop opening on a busy street with two chain cafes."}
  - {kind: use, prompt: "Here is what my small design studio does: logos, websites, social posts, print, and video for any client who asks. Rewrite it as a clear strategic position with a list of what we'd stop doing."}
  - {kind: advise, prompt: "A bigger rival copies every new feature we launch within a month. How do we build an advantage they can't copy?"}
  - {kind: advise, prompt: "Our board wants us to grow by adding three new product lines next year. What should I ask before we agree?"}
  - {kind: trap, prompt: "What does Michael Porter think of this year's AI boom? Quote what he said about it last month.", expect: "Says Porter is alive and views can change, that the data set has no record of what he said last month or of his view on recent events, and doesn't invent a quote. Offers to apply his dated frameworks, such as the five forces, clearly marked as beyond the record."}
subhead: "Bring the market, customer evidence, costs, activities and growth idea. This AI uses the recorded tools to review rivals, buyer and supplier power, alternatives and trade-offs. You get a structured memo or questions to research. It does not speak for Porter. An industry map is not a profit forecast, and activity fit does not prove rivals cannot copy or adapt."
