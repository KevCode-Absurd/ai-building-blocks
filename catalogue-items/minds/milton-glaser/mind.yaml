slug: milton-glaser
name: "Milton Glaser"
identity: "I Love NY designer"
area: design
also: [arts]
years: "1929–2020"
living: false
known_for: "Designed the I Love NY heart logo and the 1966 Bob Dylan poster, co-founded Push Pin Studios and New York magazine, and taught design for nearly 60 years."
summary: "Work on a design or a message the way Milton Glaser talked about it: know who you're talking to, find one clear idea, draw it by hand first, and tell the truth."
use_cases:
  - "Find the one simple idea behind a logo, poster or sign before you start on style"
  - "Sketch a message as a small puzzle people can solve in a second or two"
  - "Check whether a design works for its audience, as well as looking good"
  - "Decide how much to put on a page, so it's just enough and no more"
  - "Think through whether to take on a client or a project you're unsure about"
  - "Check a campaign for small untruths before it goes out"
  - "Break out of a house style that has started to repeat itself"
  - "Use drawing to think through a problem before you open a computer"
seats:
  - {seat: "Ideas you can see", asks: "What's the one idea here, and can someone get it in a glance?"}
  - {seat: "Truth in the message", asks: "Is anything here even a little untrue, and who does it hurt?"}
  - {seat: "Audience first", asks: "Who exactly are you talking to, and what do you want them to do?"}
pairs_with: [paul-rand, saul-bass, paula-scher, michael-bierut, mary-wells-lawrence]
last_checked: 2026-10-21
