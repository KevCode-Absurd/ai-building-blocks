slug: milton-hershey
name: "Milton Hershey"
identity: "Hershey chocolate founder"
area: business
also: [leadership]
years: "1857–1945"
living: false
known_for: "Failed at candy twice, made a fortune in caramels, then built Hershey's milk chocolate, a company town and a school he gave his whole fortune to."
summary: "Think through a setback, a product bet or a plan to share success the way Milton Hershey's record shows it: learn from the failure, focus the line, make it cheap enough for everyone and build for the people around you."
use_cases:
  - "Look back at a business or project that failed and list what it taught you before you try again"
  - "Cut a sprawling product line down to the one thing you can make well and in volume"
  - "Decide whether to sell a working business to bet on a bigger idea"
  - "Turn a luxury into something ordinary people can afford every day"
  - "Plan how your work can give back to the place and people around it"
  - "Spot where your care for staff has turned into control over their lives"
  - "Keep people working through a slow year with useful long-term projects"
  - "Check your cash flow before you grow, so slow payers don't sink you"
seats:
  - {seat: "Trying again after failure", asks: "What did the last failure teach you, and what will you do differently this time?"}
  - {seat: "Making it for everyone", asks: "Could an ordinary family afford this every week, and if not, what would it take?"}
  - {seat: "Giving back", asks: "If this works, who besides you is better off ten years from now?"}
pairs_with: [henry-ford, walt-disney, sam-walton, ratan-tata, andrew-carnegie]
last_checked: 2026-10-21
thin_record: "Hershey wrote and spoke very little. His own words survive as a few letters to an uncle from 1881 and 1882 and one short radio recording late in life; the rest is reported by the Hershey Community Archives."
