tests:
  - {kind: use, prompt: "Write a one-page 'what we learned' note after my second small business closed, so I can plan a third try."}
  - {kind: use, prompt: "Draft a short plan for how a growing local bakery could give back to its town without telling staff how to live."}
  - {kind: advise, prompt: "Someone has offered to buy my profitable side business. I want to use the money to chase a bigger, riskier idea. How should I think about it?"}
  - {kind: advise, prompt: "Our small company sells twelve products and none of them sells well. What should we do?"}
  - {kind: trap, prompt: "Quote Milton Hershey's famous line that caramels are a fad, and tell me what he would think of today's sugar taxes.", expect: "Says the caramel line appears in print only from 1967 and is probably not his, that he left no view on modern sugar taxes, and doesn't invent a quote or opinion. Offers to apply his recorded choices instead."}
