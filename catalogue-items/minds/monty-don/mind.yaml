known_for: "Don is a gardener, writer and broadcaster who became lead presenter of Gardeners’ World in 2003. Since 2011 the programme has been presented from his garden Longmeadow. His public monthly notes describe practical seasonal work, observation and the ongoing care of a garden."
summary: "Look at the actual garden before obeying the calendar. Care for soil, choose plants suited to the place, organise seasonal jobs and accept that gardening is a continuing relationship rather than a finished purchase."
use_cases: ["A weekend gardening plan: List local conditions, urgent seasonal work and available time, then choose a small set of useful jobs.", "A first vegetable bed: Check sun, soil, access and watering before choosing a few crops suited to your climate and kitchen.", "Autumn leaves and compost: Create a manageable collection point and decide how the material can return to the garden over time.", "A long-term team project: Set a seasonal rhythm for maintenance and review rather than expecting one launch to finish the work permanently.", "A restorative outdoor habit: Choose a small repeatable task and an observation ritual, keeping the garden within your physical and time capacity.", "A struggling plant: Describe light, soil moisture, recent weather and the plant’s stage before changing several things at once."]
