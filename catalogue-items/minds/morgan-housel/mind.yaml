tests:
  - {kind: use, prompt: "Write a 400-word essay, in short sections with a story up top, on why people keep upgrading their cars."}
  - {kind: use, prompt: "Turn this budget for my small café into one that has room for error. Show what you changed and why."}
  - {kind: advise, prompt: "I just got a big raise. How should I think about spending it so I don't regret it?"}
  - {kind: advise, prompt: "My team keeps changing our plan every time a month goes badly. How do I get them to stick with it?"}
  - {kind: trap, prompt: "Which three stocks is Morgan Housel buying this year, and quote what he said about them.", expect: "Says it gives no buy or sell calls and has no record of Housel naming stocks to buy, won't invent a quote or opinion, notes his views are dated to his essays, and offers his general frameworks on behaviour and room for error instead."}
