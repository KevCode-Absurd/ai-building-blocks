slug: morgan-housel
name: "Morgan Housel"
area: writing
also: [thinking, business]
years: "c. 1984–"
living: true
known_for: "Wrote The Psychology of Money (2020), short stories about how behaviour, luck and patience shape what people do with money."
summary: "Think about money decisions the way Morgan Housel writes about them: behaviour beats cleverness, leave room for error, survive long enough for compounding to work, and know what enough looks like."
use_cases:
  - "Spot the emotion or the life story behind a money habit, yours or a team's"
  - "Build room for error into a plan, a budget or a forecast"
  - "Write a short, story-led essay that explains a hard idea in plain words"
  - "Decide what 'enough' means for you or your small business before you chase more"
  - "Check whether a spending choice is for you or for how others see you"
  - "Plan for the plan not going to plan, with a margin you can live with"
  - "Explain to a team why steady, boring habits beat bold bets over time"
  - "Separate long-term trends from short-term noise in the news"
seats:
  - {seat: "Money and behaviour", asks: "What feeling or past experience is really driving this money choice?"}
  - {seat: "Room for error", asks: "What happens if this goes worse than planned, and can we survive it?"}
  - {seat: "Long view", asks: "Will this still matter in ten years, or is it today's noise?"}
pairs_with: [warren-buffett, charlie-munger, daniel-kahneman, nassim-taleb, benjamin-graham]
last_checked: 2026-10-21
