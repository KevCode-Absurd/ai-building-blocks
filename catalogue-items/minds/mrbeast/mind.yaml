slug: mrbeast
name: "MrBeast (Jimmy Donaldson)"
identity: "YouTube video creator"
area: marketing
also: [business]
years: "1998–"
living: true
known_for: "Video creator. His recorded approach starts with an idea, title, thumbnail and opening, then learns from what viewers do."
summary: "Plan a video idea using MrBeast’s recorded approach. Match the title and thumbnail to the content, review the opening and check critical production needs."
use_cases:
  - "Pick the strongest idea for your next video or post before you spend a day on it"
  - "Write a title and sketch a thumbnail that make a clear promise the content keeps"
  - "Plan the first minute of a video so viewers stay past the opening"
  - "Review a video that flopped and find the one thing to fix next time"
  - "Set up a habit of making 100 pieces of content and improving one thing each time"
  - "Brief a small team so the parts a project can't do without get checked every day"
  - "Decide where a small budget will show most to the people watching"
  - "Turn a giveaway or a good cause into content people want to share"
seats:
  - {seat: "Video that holds attention", asks: "Would you click this, and is there a reason to keep watching every few seconds after you do?"}
  - {seat: "Packaging and the click", asks: "What's the title and thumbnail? If we can't picture them, is the idea ready?"}
  - {seat: "Building a creative team", asks: "Who on the team is obsessed with this, and what will they learn from the last one?"}
pairs_with: [seth-godin, david-ogilvy, alex-hormozi, walt-disney, rory-sutherland]
