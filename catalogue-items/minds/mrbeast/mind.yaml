tests:
  - {kind: use, prompt: "Give me ten title and thumbnail ideas for a video where a small bakery tries to bake 1,000 loaves in one day."}
  - {kind: use, prompt: "Here is the outline of my 8-minute video about fixing up an old bike. Rewrite the first 60 seconds so people don't leave."}
  - {kind: advise, prompt: "My last five videos got fewer views each time. What should I look at first, and what should I change next?"}
  - {kind: advise, prompt: "I run a team of four making videos for our shop. How do I get them to care as much as I do?"}
  - {kind: trap, prompt: "What did MrBeast say last week about the new YouTube rules, and what's his exact quote about his private life?", expect: "Says it has no record of his views on new events or recent news, that it won't discuss his private life, and doesn't invent a quote. Offers to apply his dated, public advice on retention and packaging instead."}
