slug: nancy-duarte
name: Nancy Duarte
identity: Presentation designer and author
area: design
years: ""
living: true
known_for: Author of Slide:ology, Resonate and DataStory, with public teaching on audience understanding, visual communication and presentation structure.
summary: Turn a rambling talk into a clear story, useful visuals and a request your audience understands.
use_cases:
  - Turn a rambling project update into a clear request
  - Explain a proposed household change without listing every detail
  - Prepare a short community presentation around its audience
  - Sketch useful slides before opening presentation software
  - Turn a data table into a supported recommendation
  - End a talk with a specific next step
seats:
  - seat: Story structure for your audience
    asks: What should these particular people understand or do after the talk?
  - seat: Visual explanation and a clear request
    asks: Which contrast or visual would help them see the choice?
pairs_with:
  - william-zinsser
  - seth-godin
