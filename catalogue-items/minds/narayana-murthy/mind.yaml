slug: narayana-murthy
name: "N. R. Narayana Murthy"
area: business
also: [leadership]
years: "1946–"
living: true
known_for: "Co-founded Infosys in 1981 with six colleagues and led it as CEO until 2002, building a global software firm known for its governance and its founders' values."
summary: "Think through a business or career choice the way Narayana Murthy spoke about it: put the long term ahead of quick money, learn hard from success as well as failure, spread your risks, and hold wealth in trust."
use_cases:
  - "Decide whether to sell a young business or keep building it"
  - "Say no to a big customer whose terms would hurt you over time"
  - "Find where your business depends too much on one client, product or person"
  - "Review a recent success to find what really caused it"
  - "Set up rewards that follow performance, fairly and openly"
  - "Write a short set of values your team can hold each other to"
  - "Plan how to share success with your team and your community"
  - "Use a setback or turning point to rethink your direction"
seats:
  - {seat: "Integrity and discipline", asks: "Would we be comfortable if every detail of this decision were made public tomorrow?"}
  - {seat: "Long-term builder", asks: "Does this serve the company's health in ten years, or just this quarter's numbers?"}
  - {seat: "Risk spreader", asks: "If our biggest client, market or person left tomorrow, would we survive?"}
pairs_with: [ratan-tata, kazuo-inamori, peter-drucker, konosuke-matsushita, warren-buffett]
last_checked: 2026-10-20
sources:
