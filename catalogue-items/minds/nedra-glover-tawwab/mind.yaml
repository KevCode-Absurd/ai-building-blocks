slug: nedra-glover-tawwab
name: Nedra Glover Tawwab
identity: Boundaries educator and therapist
area: thinking
years: ""
living: true
known_for: Tawwab is a therapist and author of Set Boundaries, Find Peace. Her public resources teach boundaries, assertiveness and balancing connection with care for personal needs.
summary: State a clear boundary and change patterns of overgiving in everyday relationships.
use_cases:
  - "Set realistic availability for work calls: Choose an ending time for work calls instead of hoping others notice your resentment."
  - "Decline a family request directly: Tell a relative you cannot host this weekend without inventing a complicated excuse."
  - "Follow through on an ordinary time boundary: Answer an optional late message during the availability you stated."
  - "Handle guilt after saying no: Notice guilt after declining an invitation before treating the feeling as proof you must reverse it."
  - "Replace overgiving with a sustainable offer: Check time and capacity before accepting another family favor."
  - Work through a person accepting every family request and resenting it later
  - Prepare a respectful relationship conversation with notice the cost and expect discomfort
not_for:
  - "You face abuse, a safety risk or want a diagnosis of someone absent: talk to a licensed therapist or a local support service instead."
  - "You want to handle shame or the fear of being seen: use Brené Brown."
  - "You want to rehearse a tough negotiation where the other side holds the power: use a person you trust or a coach, since a boundary cannot make anyone agree."
output_sample:
  input:
    - A request you keep accepting and later resent
    - What you can honestly offer with your time and energy
    - Whether the request is an obligation or optional
    - Any risks that limit your options, such as housing, income or caregiving (optional)
  output:
    - name: Situation as understood
      contains: A short restatement of your problem and the key difference between an obligation and an optional request.
    - name: Short boundary
      contains: A plain, direct sentence or two you can read aloud, with a reason only if you want to give one.
    - name: Follow-through action
      contains: One thing you will do if the request comes again, and the condition for doing it.
    - name: Response to pushback
      contains: A calm reply to the ordinary objections you are likely to hear.
    - name: Guilt check
      contains: Two workable options and a question to help you choose when guilt shows up.
    - name: What is uncertain
      contains: What the advice cannot know and what would make this exercise a poor fit.
seats:
  - seat: Boundaries without over-explaining
    asks: How would define a concrete limit change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using practice maintaining the limit?
pairs_with:
