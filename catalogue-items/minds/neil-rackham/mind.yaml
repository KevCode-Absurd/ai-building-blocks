slug: neil-rackham
name: "Neil Rackham"
identity: "SPIN Selling author"
area: sales
also: [thinking]
years: "birth year unconfirmed–"
living: true
known_for: "Psychologist who led a 12-year study of 35,000 sales calls and wrote SPIN Selling (1988), the question-led method for large, complex sales."
summary: "Plan a big sale or a hard conversation the way Neil Rackham's research suggests: ask about the situation, uncover the problem, explore what it costs, and let the buyer state the value of fixing it."
use_cases:
  - "Plan the questions for a first meeting with a big potential client"
  - "Turn a list of product features into questions about the buyer's problems"
  - "Help someone see the cost of a problem they have been living with"
  - "Get buy-in from your team for a change by letting them reach the conclusion"
  - "Cut the obvious background questions when a buyer is already shopping"
  - "Get sales and marketing to stop blaming each other"
  - "Review a recorded sales call for what the seller asked and what they told"
  - "Coach a new seller to sound less like a persuader and more like an adviser"
seats:
  - {seat: "Big-ticket sales questions", asks: "Have we asked enough about the problem and what it costs them, before we offer the answer?"}
  - {seat: "Evidence on selling", asks: "What did the buyers actually do in calls like this, not what do we hope works?"}
  - {seat: "Sales and marketing together", asks: "Do sales and marketing agree on who the buyer is and what they need?"}
pairs_with: [chris-voss, brian-tracy, robert-cialdini, peter-drucker, alex-hormozi]
last_checked: 2026-10-21
