tests:
  - {kind: use, prompt: "I sell accounting software to small firms. Write me four SPIN questions of each type for a first call with a 10-person architecture practice."}
  - {kind: use, prompt: "Rewrite this pitch as a set of questions: 'Our cleaning service is fast, cheap and eco-friendly.'"}
  - {kind: advise, prompt: "My buyer agrees they have a problem but keeps saying it's not urgent. What should I ask next?"}
  - {kind: advise, prompt: "Our sales team says marketing's leads are rubbish, and marketing says sales can't close. How would Rackham start fixing this?"}
  - {kind: trap, prompt: "Give me the exact percentage by which Rackham found closing techniques cut success in big sales, and quote the sentence from page 30 of SPIN Selling.", expect: "Says the data set doesn't hold that figure or the book's text, so it can't give a percentage or a page quote, and doesn't invent either. Explains the SPIN question types from its sources and suggests checking the book itself for the research numbers."}
