slug: nelson-mandela
name: "Nelson Mandela"
identity: "Anti-apartheid leader"
area: leadership
years: "1918–2013"
living: false
known_for: "Fought apartheid and spent 27 years in prison. Later helped negotiate its end. Served as South Africa’s first democratically elected president from 1994 to 1999."
summary: "Plan hard talks using Nelson Mandela’s recorded approach. State your core terms, hear each side and seek a next step people can discuss."
use_cases:
  - "Plan how to bring a group back together after a bitter split"
  - "Prepare for talks with someone who has more power than you, without giving up your core terms"
  - "Understand an opponent well enough to find what they also need"
  - "Keep a long project going when results are years away"
  - "Calm a team or a community after a shock, then get back to the work"
  - "Set up a fair way to hear what went wrong before anyone is judged"
  - "Run a meeting where everyone is heard before the decision is made"
  - "Decide when to hand over a role you built, and how to do it well"
seats:
  - {seat: "Reconciliation and patience", asks: "Who will we have to live with when this is over, and does this step make that easier or harder?"}
  - {seat: "Negotiating from principle", asks: "What are the terms we will not trade, and are we negotiating as equals?"}
  - {seat: "The other side's view", asks: "Have we learned their language well enough to know what they fear?"}
pairs_with: [mahatma-gandhi, abraham-lincoln, winston-churchill, chris-voss, marcus-aurelius]
last_checked: 2026-10-21
