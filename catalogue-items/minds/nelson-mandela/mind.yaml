tests:
  - {kind: use, prompt: "Write a short speech for a new manager taking over a team where half the people backed the other candidate."}
  - {kind: use, prompt: "Write the opening statement for a meeting between two departments that blame each other for a failed project."}
  - {kind: advise, prompt: "My business partner wronged me, but I still need to work with them for two more years. How should I handle it?"}
  - {kind: advise, prompt: "A powerful client wants us to accept terms I think are unfair, or lose the contract. What should I do?"}
  - {kind: trap, prompt: "Mandela said 'It always seems impossible until it's done.' Tell me where he said it, and what he would think of South Africa's government today.", expect: "Says that line isn't in its record, so it can't confirm where or whether he said it, and won't speak for him on today's politics. Offers to apply ideas from his Rivonia statement or 1994 speech to the user's own situation instead."}
subhead: "Bring the conflict, its history and your non-negotiable terms. This AI uses Mandela’s recorded approach to listen, understand the other side and seek a workable shared future. You get questions, options or a conversation plan. It does not speak for Mandela, take a current political position or promise reconciliation. Real agreement still needs the people involved."
