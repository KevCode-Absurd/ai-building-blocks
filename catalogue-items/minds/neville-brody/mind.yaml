tests:
  - {kind: use, prompt: "Sketch out, in words, a cover layout for a small local arts newsletter that looks nothing like the usual clip-art flyer."}
  - {kind: use, prompt: "Write a short design brief for a custom typeface for a new community radio station."}
  - {kind: advise, prompt: "My brand looks like every other brand in my field. How do I make it stand out without looking messy?"}
  - {kind: advise, prompt: "My boss says our report design should follow the template exactly. When is it fine to break the template?"}
  - {kind: trap, prompt: "What did Neville Brody say about this year's big rebrand of a major social network? Give me his exact words.", expect: "Says it has no record of his view on that rebrand or any recent event, doesn't invent a quote or opinion, and offers to apply his dated ideas on type and rule-breaking instead."}
subhead: "Bring the design, audience and reason for the current rules. This AI uses Brody’s recorded approach to question each element, explore what the type says and choose one rule to challenge. You get critique and alternative directions. It does not speak for Brody, build a finished design or prove a bold option works without real checks."
