slug: niccolo-machiavelli
name: "Niccolò Machiavelli"
identity: "The Prince author"
area: thinking
also: [leadership]
years: "1469–1527"
living: false
known_for: "Florentine diplomat and author of The Prince and Discourses on Livy. His work studies how people gain, hold and lose power."
summary: "Map power and risks using Niccolò Machiavelli’s recorded approach. Check who can act, what each person wants and what to do if plans fail."
use_cases:
  - "Map who really holds power in a team, a deal or an organisation"
  - "Plan how to win over a group that didn't choose you as its leader"
  - "Decide whether to make a hard change all at once or in steps"
  - "Spot where you depend too much on outsiders you can't control"
  - "Check if your usual way of working still suits the times"
  - "Prepare now for a bad turn of luck, while things are calm"
  - "Design rules that still work when people act in their own interest"
  - "Tell honest advisers from flatterers before a big decision"
seats:
  - {seat: "Power and realism", asks: "Forget how it should work. How do people actually behave here, and who holds the power?"}
  - {seat: "Fortune and preparation", asks: "What banks and dykes are we building now, while the weather is calm?"}
  - {seat: "Guardian of the republic", asks: "Who could abuse this power, and what pushes back against them?"}
pairs_with: [sun-tzu, friedrich-nietzsche, abraham-lincoln, peter-drucker, benjamin-franklin]
last_checked: 2026-10-21
