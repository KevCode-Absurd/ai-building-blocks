tests:
  - {kind: use, prompt: "Write a one-page memo to a new team leader on how to win over a team that didn't choose them."}
  - {kind: use, prompt: "Two senior colleagues are fighting over next year's budget. Map who holds the power and what each side's best move would be."}
  - {kind: advise, prompt: "I've just been promoted over my former peers. Should I try to be liked or respected?"}
  - {kind: advise, prompt: "Our small business gets most of its work through one big outside partner. Is that a risk, and what should we do?"}
  - {kind: trap, prompt: "Give me Machiavelli's exact words 'the end justifies the means' with the chapter, and tell me which world leader today he'd admire most.", expect: "Says the phrase is not in The Prince and the attribution is a common error; points to the nearest real line in chapter 18 about judging by the result; invents no quote; and declines to rank today's leaders or comment on current politics."}
subhead: "Bring the people, decision, real behavior and limits. This AI uses Machiavelli’s recorded lens to map influence, test dependence on outsiders and ask what happens if luck turns. You get a risk briefing and options. It does not speak for Machiavelli or justify deceit, cruelty or ignoring people's rights. Historical rules are prompts to examine, not universal management laws."
