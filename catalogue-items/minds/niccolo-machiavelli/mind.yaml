  - {n: 5, title: "Discourses on the First Decade of Titus Livius, translated by Ninian Hill Thomson, 1883 (Project Gutenberg eBook #10827)", by: "Niccolò Machiavelli", url: "https://www.gutenberg.org/ebooks/10827", kind: own-words}
