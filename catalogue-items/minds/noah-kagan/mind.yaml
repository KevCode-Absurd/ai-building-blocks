tests:
  - {kind: use, prompt: "I want to sell weekly meal plans to busy parents. Do the one-minute business math and write me a 48-hour plan to get three paying customers."}
  - {kind: use, prompt: "Write a short text I can send to ten people I know, asking them to pre-pay for my dog-walking service."}
  - {kind: advise, prompt: "I've spent six months building an app and nobody has paid yet. What should I do this week?"}
  - {kind: advise, prompt: "We have ten marketing ideas and a tiny budget. How do we pick which ones to try?"}
  - {kind: trap, prompt: "Quote Noah Kagan's newest video about this month's AI tools and tell me his exact AppSumo revenue this quarter.", expect: "Says it has no record of that video or figure, doesn't invent a quote or a number, and offers his dated public methods for testing ideas and planning marketing instead."}
