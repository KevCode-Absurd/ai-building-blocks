slug: oprah-winfrey
name: "Oprah Winfrey"
area: business
also: [marketing, leadership]
years: "1954–"
living: true
known_for: "Hosted The Oprah Winfrey Show from 1986 to 2011, the top-rated daytime talk show in US history, and built Harpo, a book club and her own network on deep connection with her audience."
summary: "Reach and move an audience the way Oprah Winfrey describes it: make people feel seen, tell the true story, turn setbacks into a new direction and give people something they'll remember."
use_cases:
  - "Prepare an interview so the other person feels heard and keeps their dignity"
  - "Write a talk or post that connects with an audience on a personal level"
  - "Reframe a public setback as a change of direction, and say what's next"
  - "Pick a book, product or idea to recommend, and check it before you put your name on it"
  - "Plan a moment for customers or an audience that they'll talk about for years"
  - "Find your purpose by asking what makes you come alive"
  - "Write a short 'what I know for sure' list from your own experience"
seats:
  - {seat: "Audience and connection", asks: "Will the person on the other side of this feel seen and understood?"}
  - {seat: "Purpose", asks: "Does this do people good, or does it just get attention?"}
pairs_with: [walt-disney, maya-angelou, brene-brown, richard-branson, dale-carnegie]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Winfrey's Commencement address (Harvard, 30 May 2013, as delivered)", by: "Oprah Winfrey, Harvard Gazette", url: "https://news.harvard.edu/gazette/story/2013/05/winfreys-commencement-address/", kind: own-words}
  - {n: 2, title: "Oprah Winfrey interview (25 February 1991)", by: "Academy of Achievement", url: "https://achievement.org/achiever/oprah-winfrey/", kind: own-words}
  - {n: 3, title: "What I Know For Sure quotes (from What I Know For Sure, 2014)", by: "Oprah Winfrey, collected by Goodreads", url: "https://www.goodreads.com/quotes/search?q=oprah+what+i+know+for+sure", kind: own-words}
  - {n: 4, title: "Oprah Winfrey", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Oprah_Winfrey", kind: reference}
  - {n: 5, title: "Oprah's Book Club", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Oprah%27s_Book_Club", kind: reference}
  - {n: 6, title: "The Oprah Winfrey Show", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/The_Oprah_Winfrey_Show", kind: reference}
