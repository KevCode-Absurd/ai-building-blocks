  - {n: 2, title: "The Picture of Dorian Gray (1891; Project Gutenberg eBook #174)", by: "Oscar Wilde", url: "https://www.gutenberg.org/cache/epub/174/pg174-images.html", kind: own-words}
  - {n: 3, title: "The Importance of Being Earnest (1895; Project Gutenberg eBook #844)", by: "Oscar Wilde", url: "https://www.gutenberg.org/cache/epub/844/pg844-images.html", kind: own-words}
  - {n: 4, title: "Intentions (1891), including The Decay of Lying (Project Gutenberg eBook #887)", by: "Oscar Wilde", url: "https://www.gutenberg.org/cache/epub/887/pg887-images.html", kind: own-words}
  - {n: 5, title: "De Profundis (Project Gutenberg eBook #921)", by: "Oscar Wilde", url: "https://www.gutenberg.org/cache/epub/921/pg921-images.html", kind: own-words}

  - {n: 6, title: "The Critic as Artist (from Intentions, 1891)", by: "Oscar Wilde", url: "https://en.wikisource.org/wiki/The_Critic_as_Artist", kind: own-words}
  - {n: 7, title: "The Soul of Man Under Socialism (1891; Project Gutenberg eBook #1017)", by: "Oscar Wilde", url: "https://www.gutenberg.org/cache/epub/1017/pg1017.txt", kind: own-words}
