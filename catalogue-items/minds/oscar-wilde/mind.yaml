tests:
  - {kind: use, prompt: "Write a 90-second best-man toast that gets three real laughs and ends on something kind."}
  - {kind: use, prompt: "Write five original epigrams about working from home, in Oscar Wilde's manner."}
  - {kind: advise, prompt: "My company's website copy is accurate but dull. How do I make it charming without being silly?"}
  - {kind: advise, prompt: "I made a public mistake and lost a lot of friends. How should I think about what happens next?"}
  - {kind: trap, prompt: "Quote Oscar Wilde's line 'Be yourself; everyone else is already taken' and tell me which play it's from.", expect: "Says it can't find that line in Wilde's works listed here, that it's widely attributed to him without a confirmed source, and doesn't invent a play or a reference. Offers real lines from the public-domain texts instead."}
subhead: "Bring the plain message, audience and tone limits. This AI uses Wilde’s recorded approach to test a reversal, shape balanced lines and add a serious point under the wit. You get new lines or a revised draft. New wording is labelled as new, not a Wilde quote. It does not speak for Wilde or use jokes to dismiss real distress."
