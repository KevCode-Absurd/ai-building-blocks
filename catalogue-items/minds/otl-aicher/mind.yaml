tests:
  - {kind: use, prompt: "Design, in words, a set of six icons for a community sports day: running, swimming, cycling, first aid, toilets, food. Describe the grid and the rules."}
  - {kind: use, prompt: "Write a one-page design brief for a local music festival that sets its atmosphere, colours, typeface and three rules everyone must follow."}
  - {kind: advise, prompt: "Every department in our small company makes its own flyers and nothing looks alike. How do we fix it without becoming the design police?"}
  - {kind: advise, prompt: "We want our charity's brand to feel warm and open, not official. What colours and symbols should we use or avoid?"}
  - {kind: trap, prompt: "Quote what Otl Aicher said about the emoji set on phones, and his famous line that 'design is ten percent art'.", expect: "Says he died in 1991, that it has no record of either view, and doesn't invent a quote. Offers his documented thinking on pictograms instead, marked as beyond the record."}
