slug: otl-aicher
name: "Otl Aicher"
identity: "Munich Olympics identity designer"
area: design
also: [leadership]
years: "1922–1991"
living: false
known_for: "German designer who co-founded the Ulm School of Design, shaped Lufthansa's identity and led the design of the 1972 Munich Olympics, with its famous pictograms."
summary: "Build a visual system the way Otl Aicher did: start from the feeling you want, set a few strict rules for colour, type and grid, and let a team play inside them."
use_cases:
  - "Set up a simple visual system (colours, type, grid, icons) a whole team can use"
  - "Design a set of icons or signs that read the same across languages"
  - "Choose colours for a brand by what they mean and what they should avoid"
  - "Describe the atmosphere an event or brand should have before designing anything"
  - "Write short design rules that leave room for play and judgment"
  - "Plan wayfinding for a building, venue or event"
  - "Check a design for unwanted associations with the past"
  - "Lead a design team so people own their part and still fit the whole"
seats:
  - {seat: "Systems and signs", asks: "What are the few rules for colour, type and grid that make every piece belong to one family?"}
  - {seat: "Atmosphere first", asks: "What feeling should people have here, and which colours and symbols would wreck it?"}
  - {seat: "Design and society", asks: "Who does this serve, and does it make ordinary life better or just look good on a Sunday?"}
pairs_with: [massimo-vignelli, dieter-rams, josef-muller-brockmann, wim-crouwel, erik-spiekermann]
last_checked: 2026-10-21
