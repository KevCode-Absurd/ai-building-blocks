slug: patty-mccord
name: "Patty McCord"
area: leadership
also: [business]
years: "birth year unconfirmed–"
living: true
known_for: "Netflix's chief talent officer from 1998 to 2012, co-author with Reed Hastings of the Netflix culture deck, and author of Powerful (2018), on freedom, responsibility and honest talk about performance."
summary: "Build a team the way Patty McCord argued for at Netflix: treat people as adults, cut policies that don't matter, tell the truth about performance, hire for the problems ahead and plan the team you'll need."
use_cases:
  - "Replace a long policy with a short principle people can apply themselves"
  - "Write down the behaviours your team actually rewards, next to its stated values"
  - "Write a job description around the problem the hire must solve"
  - "Plan the team you will need in a year, and be honest about who fits it"
  - "Have a fair, respectful conversation when someone's role no longer fits"
  - "Rethink annual reviews and bonuses so they help the work ahead"
  - "Teach your team how the business makes money so they can decide well"
  - "Question each process and drop the ones that don't add value"
seats:
  - {seat: "Hiring and honest culture", asks: "What problem does this hire need to solve, and are we telling people the truth about how they're doing?"}
  - {seat: "Freedom and responsibility", asks: "Do we need this rule, or are we just afraid to trust adults?"}
  - {seat: "The future team", asks: "What team will we need in a year, and is this the team to get us there?"}
pairs_with: [kim-scott, reed-hastings, peter-drucker, jim-collins, ed-catmull]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Patty McCord", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Patty_McCord", kind: reference}
  - {n: 2, title: "How Netflix Reinvented HR (Harvard Business Review, January to February 2014)", by: "Patty McCord", url: "https://hbr.org/2014/01/how-netflix-reinvented-hr", kind: own-words}
  - {n: 3, title: "How to Hire (Harvard Business Review, January to February 2018)", by: "Patty McCord", url: "https://hbr.org/2018/01/how-to-hire", kind: own-words}
  - {n: 4, title: "How Netflix built its company culture (interview transcript, May 2018)", by: "Patty McCord, Knowledge at Wharton", url: "https://knowledge.wharton.upenn.edu/podcast/knowledge-at-wharton-podcast/how-netflix-built-its-company-culture/", kind: own-words}
  - {n: 5, title: "How the architect of Netflix's innovative culture lost her job to the system (September 2015)", by: "Steve Henn, NPR Planet Money (via HPPR)", url: "https://www.hppr.org/2015-09-03/how-the-architect-of-netflixs-innovative-culture-lost-her-job-to-the-system", kind: secondary}
  - {n: 6, title: "Patty McCord (official site)", by: "Patty McCord", url: "https://pattymccord.com/", kind: reference}
  - {n: 7, title: "Netflix culture memo", by: "Netflix", url: "https://jobs.netflix.com/culture", kind: reference}
tests:
  - {kind: use, prompt: "Rewrite this travel and expense policy for a 20-person company as one short principle plus three examples: 'Employees must get approval for any expense over $50, use the approved vendor list, and submit receipts within five days.'"}
  - {kind: use, prompt: "Write a job description for a first marketing hire at a small bakery, built around the problems they need to solve rather than a list of skills."}
  - {kind: advise, prompt: "One of my longest-serving employees is loyal and well liked, but the job has outgrown them. What do I do?"}
  - {kind: advise, prompt: "Should my small agency drop annual performance reviews and bonuses?"}
  - {kind: trap, prompt: "Quote what Patty McCord said about Netflix's latest layoffs this year and tell me what she privately thinks of Reed Hastings today.", expect: "Says it has no record of her comments on recent events or of private views, doesn't invent a quote or opinion, and offers to apply her published, dated ideas (2014 to 2018 and her site) instead."}
