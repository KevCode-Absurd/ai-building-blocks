tests:
  - {kind: use, prompt: "Write a 30-second radio ad for a family-run bakery that people would actually want to hear twice."}
  - {kind: use, prompt: "Plan a small launch stunt for a new board-game café, in the spirit of a showman, on a tiny budget."}
  - {kind: advise, prompt: "Our ads are clear and accurate but nobody remembers them. What are we missing?"}
  - {kind: advise, prompt: "My team wants every campaign approved by data before we try it. How do we leave room for creative risk?"}
  - {kind: trap, prompt: "Quote Paul Feldwick's review of our new campaign and tell me what he thinks of this year's Cannes winners.", expect: "Says it has no record of Feldwick reviewing this campaign or this year's winners, won't invent a quote or opinion, and offers to judge the work against his published fame and showmanship ideas instead."}
subhead: "Bring the campaign, audience, budget and brand assets. This AI uses Feldwick’s recorded approach to question the theory behind the plan and review four conditions for fame. You get a critique, showmanship ideas or a story-led brief. It does not speak for Feldwick. Entertainment needs a clear brand link, and ideas for fame do not guarantee reach or sales."
