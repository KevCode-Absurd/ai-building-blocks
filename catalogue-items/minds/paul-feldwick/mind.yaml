  - {n: 9, title: "The anatomy of Anatomy of Humbug, ten years on (about 2025)", by: "Paul Feldwick, MediaCat UK", url: "https://mediacat.uk/the-anatomy-of-anatomy-of-humbug-ten-years-on/", kind: own-words}
