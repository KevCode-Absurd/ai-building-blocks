  - {n: 4, title: "Embracing raciness, being contradictory (review of Why Does the Pedlar Sing?, 2021)", by: "John Fanning, Marketing.ie", url: "https://marketing.ie/articles/embracing-raciness-while-being-contradictory/", kind: secondary}
  - {n: 5, title: "Paul Feldwick and Faris Yakob on the nature of fame and attention (podcast page, 2022)", by: "MediaCat UK", url: "https://mediacat.uk/podcasts/paul-feldwick-and-faris-yakob-discuss-the-nature-of-fame-and-attention/", kind: reference}
  - {n: 6, title: "Paul Feldwick", by: "The Marketing Society", url: "https://marketingsociety.com/paul-feldwick", kind: reference}
