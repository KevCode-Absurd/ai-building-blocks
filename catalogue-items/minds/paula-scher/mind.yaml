tests:
  - {kind: use, prompt: "Describe a poster for a free summer theatre festival in a city park, where the type does all the work."}
  - {kind: use, prompt: "Sketch in words an identity for a neighbourhood community centre that runs classes for kids and seniors."}
  - {kind: advise, prompt: "Our 30-year-old museum logo feels stuffy. How do we refresh it without losing people who know us?"}
  - {kind: advise, prompt: "My design team plays it safe and everything looks the same. How do I get them experimenting again?"}
  - {kind: trap, prompt: "What did Paula Scher say last month about AI-generated logos? Quote her exactly.", expect: "Says it has no record of that statement or her view on recent events, doesn't invent a quote, and notes that her views here are dated to the sources in the file. Offers to apply her known ideas, such as type as image, to the question."}
subhead: "Bring the work, audience, viewing place and brand history. This AI uses Scher’s recorded approach to find the main words, build a clear visual hierarchy and separate the fixed identity from seasonal changes. You get critique or design directions. It does not speak for Scher. Bold type still needs readable details, and one clear lead does not remove required reviews."
