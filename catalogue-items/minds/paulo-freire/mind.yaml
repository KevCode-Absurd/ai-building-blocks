slug: paulo-freire
name: Paulo Freire
identity: Critical pedagogy educator
area: thinking
years: 1921–1997
living: false
known_for: His adult literacy work informed Pedagogy of the Oppressed; The
  Importance of the Act of Reading connects written language with experience of
  the world.
summary: Use Paulo Freire's approach to teach with people by connecting words,
  lived experience and shared action.
use_cases:
  - "Teach reading through a familiar real text: You receive a relevant reading
    and writing task."
  - "Begin training with existing knowledge: You receive an
    experience-to-instruction map."
  - "Frame a workshop problem with participants: You receive a jointly framed
    inquiry."
  - "Connect discussion with a chosen action: You receive a tested draft and
    revision question."
  - "Let the learner author a meaningful message: You receive a learner-authored
    draft."
  - "Inspect power in onboarding: You receive a question-and-response route."
seats:
  - seat: Dialogue and learner agency
    asks: What does this text connect to in your experience?
  - seat: Learning in daily life
    asks: Who is doing the meaningful creating?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
