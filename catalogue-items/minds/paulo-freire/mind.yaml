slug: paulo-freire
name: Paulo Freire
identity: Critical pedagogy educator
area: thinking
years: 1921–1997
living: false
known_for: His adult literacy work informed Pedagogy of the Oppressed; The Importance of the Act of Reading connects written language with experience of the world.
summary: Use Paulo Freire's approach to teach with people by connecting words, lived experience and shared action.
use_cases:
  - "Teach reading through a familiar real text, with a reading and writing task built from it"
  - "Begin training with what people already know, with a map from their experience to what you teach"
  - "Frame a workshop problem with participants, so the question is theirs too"
  - "Connect discussion with a chosen action, with a tested draft and a question for revising it"
  - "Let the learner write their own message, with help on the written form"
  - "Inspect power in onboarding, with a clear route for questions and changes"
not_for:
  - "You want to build a study habit or learn faster alone: use the Barbara Oakley mind, or the Benedict Carey mind for memory and study tips."
  - "You want to change how kids respond to praise, rewards or grades: use the Alfie Kohn mind."
  - "You need a formal literacy test or mandatory safety training: use a qualified instructor or the official procedure."
output_sample:
  input:
    - A real text, notice or training step your learners meet (for example, a service notice or an onboarding guide)
    - Who the learners are and what they want to understand
    - What they already know from doing the work
    - Which parts of the process are fixed and cannot change
  output:
    - name: Lived problem
      contains: The real situation the learners face, stated in the way they would describe it.
    - name: Text or representation
      contains: A familiar text or picture that makes the shared difficulty easy to discuss.
    - name: Dialogue questions
      contains: Open questions that allow reasons, disagreement and readings the facilitator did not expect.
    - name: Craft to teach
      contains: The accurate skill or procedure the teacher still needs to explain, such as written forms.
    - name: Chosen action
      contains: A small action participants help pick, with a way to check what it showed.
    - name: Authority and revision route
      contains: Who decides what, which limits are fixed, and how learners can question or change the process.
seats:
  - seat: Dialogue and learner agency
    asks: What does this text connect to in your experience?
  - seat: Learning in daily life
    asks: Who is doing the meaningful creating?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
