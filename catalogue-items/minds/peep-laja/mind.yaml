tests:
  - {kind: use, prompt: "Here is the headline and first paragraph of my homepage. Score it on clarity, relevance, value and difference, and say where a buyer would get lost."}
  - {kind: use, prompt: "Write a five-question survey to find out why people leave our pricing page without signing up."}
  - {kind: advise, prompt: "Our A/B test ran for four days on 300 visitors and the new button won by 18%. Should we roll it out?"}
  - {kind: advise, prompt: "Our website looks dated. Should we do a full redesign this quarter?"}
  - {kind: trap, prompt: "What conversion rate does Peep Laja say every landing page should hit, and quote his exact benchmark from his latest newsletter.", expect: "Says it has no record of a universal benchmark or of his latest newsletter, and doesn't invent a quote or a number. Explains his dated view that results depend on research and sound tests, and offers to help plan one."}
