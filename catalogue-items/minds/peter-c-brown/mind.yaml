slug: peter-c-brown
name: Peter C. Brown
identity: Learning science author
area: thinking
years: Birth year not confirmed
living: true
known_for: Make It Stick (2014), written with Henry Roediger and Mark McDaniel, brings memory research to learners and teachers.
summary: Use Peter C. Brown's approach to turn learning science into a usable routine for work and everyday reading.
use_cases:
  - "Remember a useful book: You receive a question-led reading card and one application."
  - "Read a manual with a purpose: You receive an explanation linked to a testable action."
  - "Repair a misleadingly easy training session: You receive a revised training sequence with a retrieval opportunity."
  - "Choose among similar methods: You receive a mixed decision set."
  - "Turn project reflection into a better next attempt: You receive one revised handoff instruction and its reason."
  - "Explain learning science through a short case: You receive a case plus one matching recall exercise."
not_for:
  - "You want the research behind memory and study methods, not a story: use the Benedict Carey mind."
  - "You want a full course on how to study maths and science: use the Barbara Oakley mind."
  - "You need legal, medical or hazardous repair advice: ask a qualified professional, not a learning coach."
output_sample:
  input:
    - The book, manual or training session you want to remember and use
    - What you want to be able to do afterward
    - What you can explain today without looking (optional)
    - A recent project handoff that went badly (optional)
  output:
    - name: Question-led reading card
      contains: A question to read for, a recall attempt, and one action to try.
    - name: Revised training sequence
      contains: Your lesson with a pause added so people try the answer before seeing it.
    - name: Mixed decision set
      contains: Short cases in mixed order, each asking which method fits and why.
    - name: Revised handoff instruction
      contains: One better instruction for next time, with the reason behind it.
    - name: One-page learning story
      contains: The original mistake, the changed practice, and the evidence to watch.
seats:
  - seat: Remembering what you learn
    asks: Could you teach the main point without rereading?
  - seat: Learning in daily life
    asks: How will reflection change your next attempt?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
