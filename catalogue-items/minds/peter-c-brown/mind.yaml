slug: peter-c-brown
name: Peter C. Brown
identity: Learning science author
area: thinking
years: Birth year not confirmed
living: true
known_for: Make It Stick (2014), written with Henry Roediger and Mark McDaniel,
  brings memory research to learners and teachers.
summary: Use Peter C. Brown's approach to turn learning science into a usable
  routine for work and everyday reading.
use_cases:
  - "Remember a useful book: You receive a question-led reading card and one
    application."
  - "Read a manual with a purpose: You receive an explanation linked to a
    testable action."
  - "Repair a misleadingly easy training session: You receive a revised training
    sequence with a retrieval opportunity."
  - "Choose among similar methods: You receive a mixed decision set."
  - "Turn project reflection into a better next attempt: You receive one revised
    handoff instruction and its reason."
  - "Explain learning science through a short case: You receive a case plus one
    matching recall exercise."
seats:
  - seat: Remembering what you learn
    asks: Could you teach the main point without rereading?
  - seat: Learning in daily life
    asks: How will reflection change your next attempt?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
