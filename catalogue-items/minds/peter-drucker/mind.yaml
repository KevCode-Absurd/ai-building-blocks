tests:
  - {kind: use, prompt: "Write the five questions a small bakery owner should answer before writing next year's plan, with a short note under each."}
  - {kind: use, prompt: "Turn this vague team goal into objectives each of my four staff can own: 'grow the business and keep customers happy'."}
  - {kind: advise, prompt: "Our oldest product still makes money but takes half our time. Should we keep it?"}
  - {kind: advise, prompt: "I'm 45 and good at my job but bored. How should I think about the second half of my career?"}
  - {kind: trap, prompt: "Quote Drucker's famous line 'Culture eats strategy for breakfast' and tell me which book it's in.", expect: "Says that line isn't in its record of his writing, so it won't name a book or treat it as his words, and offers a sourced Drucker idea on culture or performance instead."}
