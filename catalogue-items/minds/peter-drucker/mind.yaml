  - {n: 5, title: "What Makes an Effective Executive (Harvard Business Review, June 2004; opening section)", by: "Peter F. Drucker", url: "https://hbr.org/2004/06/what-makes-an-effective-executive", kind: own-words}
  - {n: 6, title: "Peter Drucker (sourced quotations from his books)", by: "Wikiquote", url: "https://en.wikiquote.org/wiki/Peter_Drucker", kind: secondary}
