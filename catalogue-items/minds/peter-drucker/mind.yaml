slug: peter-drucker
name: "Peter Drucker"
identity: "Modern management thinker"
area: leadership
also: [business, thinking]
years: "1909–2005"
living: false
known_for: "Author whose work helped shape modern management. His ideas ask who the customer is, what results matter and how skilled people can steer their work."
summary: "Plan goals, team work or what to stop using Peter Drucker’s recorded approach. Start with the customer, useful results and people's strengths."
use_cases:
  - "Ask the basic questions about your business or team before you plan: who is the customer, and what do they value?"
  - "Set goals with each person on a team so they can steer their own work"
  - "Decide which products, projects or habits to stop doing on purpose"
  - "Work out your own strengths, values and the way you work best"
  - "Make a team of skilled people more productive without micromanaging them"
  - "Check whether a new tool or method fixes how you work or what you should be working on"
  - "Run a nonprofit or volunteer group with the same rigour as a business"
  - "Judge a manager or a meeting by results rather than style"
seats:
  - {seat: "Management", asks: "Who is the customer, and what does the customer value?"}
  - {seat: "Planned abandonment", asks: "If we weren't already doing this, would we start it today?"}
  - {seat: "People and strengths", asks: "What is each person here best at, and are we using it?"}
pairs_with: [andy-grove, clayton-christensen, michael-porter, jeff-bezos, jim-collins]
last_checked: 2026-10-21
