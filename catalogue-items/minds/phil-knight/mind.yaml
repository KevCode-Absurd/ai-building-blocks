slug: phil-knight
name: "Phil Knight"
identity: "Nike co-founder"
area: business
also: [marketing]
years: "1938–"
living: true
known_for: "Co-founded Nike with his track coach Bill Bowerman on a handshake in 1964, sold Japanese running shoes from his car, then built the company's own brand around athletes, the swoosh and the line that the consumer decides."
summary: "Build a brand from nothing the way Phil Knight did: chase the idea others call crazy, sell what you believe in, stay close to the people who use it, own your name, and keep going through cash crunches and hard choices."
use_cases:
  - "Test whether your 'crazy idea' has a real gap behind it, like Japanese shoes versus German brands"
  - "Write a founder's story that shows why you believe in what you sell"
  - "Plan how to move from selling someone else's product to launching your own brand"
  - "Decide what to do when your only supplier starts looking for other partners"
  - "Keep a small team going through a cash crunch, and choose who gets paid first"
  - "Pick a name and logo when nobody on the team loves the options"
  - "Write a frank yearly letter to backers that admits where you fell short"
  - "Decide whether to take a public stand that some customers will hate"
  - "Check your supply chain for the human costs a brand story can hide"
seats:
  - {seat: "Building a brand from nothing", asks: "Do we believe in this enough to sell it out of the back of a car, and who will wear it first?"}
  - {seat: "Grit", asks: "If everyone calls this crazy for the next five years, are we still in?"}
  - {seat: "The consumer decides", asks: "Have we asked the people who use this, or are we just guessing in a meeting room?"}
pairs_with: [sara-blakely, richard-branson, steve-jobs, john-wooden, tinker-hatfield, dan-wieden]
last_checked: 2026-10-20
