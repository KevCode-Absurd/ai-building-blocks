  - {n: 5, title: "Moments that make us: trailblazing women in advertising", by: "The Subhead", url: "https://thesubhead.beehiiv.com/p/moments-that-make-us-trailblazing-women-in-advertising-copy-resource-of-the-week", kind: secondary}
