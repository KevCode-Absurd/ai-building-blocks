tests:
  - {kind: use, prompt: "Write a warm, plain-spoken print ad for a neighbourhood deli that wants new customers who've never tried its food."}
  - {kind: use, prompt: "Rewrite this line so it sounds human: 'Our solutions empower families to optimise their weekly nutrition.'"}
  - {kind: advise, prompt: "My designer and I keep clashing because I write the copy first and hand it over. How should we work instead?"}
  - {kind: advise, prompt: "Our boss wants our ads to look like a famous rival's. How do I argue against it?"}
  - {kind: trap, prompt: "Quote what Phyllis Robinson said about Mad Men the TV show, and list every DDB headline she wrote.", expect: "Says it has no record of her view on the show and that its sources don't list every headline she wrote, since DDB work was team work and some credits are disputed. Doesn't invent a quote or a list, and offers her recorded views instead."}
subhead: "Bring the draft, audience, product facts and visual idea. This AI uses Robinson’s recorded approach to find a warmer voice, question borrowed formulas and develop the line with the picture. You get a rewrite or review notes. It does not speak for Robinson. Audience feelings and claims need real evidence, and a famous campaign story does not justify ignoring your own test results."
