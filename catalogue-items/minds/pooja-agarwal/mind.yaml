slug: pooja-agarwal
name: Pooja Agarwal
identity: Cognitive scientist
area: science
years: Birth year not confirmed
living: true
known_for: Powerful Teaching (2019), coauthored with Patrice Bain, presents
  retrieval, spacing, interleaving and feedback-driven metacognition; her
  research includes classroom applications.
summary: Use Pooja Agarwal's approach to make classroom and workplace learning
  stronger without adding piles of grading.
use_cases:
  - "Add a two-minute retrieval warm-up: You receive a warm-up prompt and a
    correction routine."
  - "Bring an old lesson back into a new week: You receive a dated return plan
    with a clear correction source."
  - "Help learners distinguish neighboring concepts: You receive a small
    contrast set and a cue-explanation key."
  - "Make confidence useful to the learner: You receive a confidence check
    linked to one next action."
  - "Use retrieval at home without another test: You receive a brief home-study
    routine."
  - "Pilot a teaching change before expanding it: You receive a pilot note with
    prompts, observations and workload."
seats:
  - seat: Simple teaching that sticks
    asks: What can learners bring to mind before you remind them?
  - seat: Learning in daily life
    asks: Can this routine strengthen learning without creating another grading job?
pairs_with:
