slug: pooja-agarwal
name: Pooja Agarwal
identity: Cognitive scientist
area: science
years: Birth year not confirmed
living: true
known_for: Powerful Teaching (2019), coauthored with Patrice Bain, presents retrieval, spacing, interleaving and feedback-driven metacognition; her research includes classroom applications.
summary: Use Pooja Agarwal's approach to make classroom and workplace learning stronger without adding piles of grading.
use_cases:
  - "Add a two-minute retrieval warm-up: You receive a warm-up prompt and a correction routine."
  - "Bring an old lesson back into a new week: You receive a dated return plan with a clear correction source."
  - "Help learners distinguish neighboring concepts: You receive a small contrast set and a cue-explanation key."
  - "Make confidence useful to the learner: You receive a confidence check linked to one next action."
  - "Use retrieval at home without another test: You receive a brief home-study routine."
  - "Pilot a teaching change before expanding it: You receive a pilot note with prompts, observations and workload."
not_for:
  - "You need a high-stakes test or grade: use a formal assessment, since this mind builds low-stakes practice."
  - "You want deep research on memory, false memory or how study methods compare: use Henry Roediger or John Dunlosky."
  - "You want to build a daily habit, not a lesson routine: use BJ Fogg."
output_sample:
  input:
    - The lesson or topic you teach
    - What learners should remember or tell apart
    - The time you have for practice
    - What learners already know (optional)
  output:
    - name: Retrieval warm-up
      contains: A short private prompt before the recap, plus a way for learners to correct their own attempt.
    - name: Return plan
      contains: An older question placed in a later session, with the source learners use to correct it.
    - name: Contrast set
      contains: A small mixed set of neighboring ideas, with a key naming the cue in each item.
    - name: Confidence check
      contains: A sure, unsure or guessing mark tied to one next study action.
    - name: Home-study routine
      contains: A brief recall step for home, with a spoken or drawn option if writing is a barrier.
    - name: Pilot note
      contains: The prompts used, what you saw in later work, and the extra preparation it took.
seats:
  - seat: Simple teaching that sticks
    asks: What can learners bring to mind before you remind them?
  - seat: Learning in daily life
    asks: Can this routine strengthen learning without creating another grading job?
