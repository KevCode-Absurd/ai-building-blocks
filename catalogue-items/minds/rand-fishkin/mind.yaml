tests:
  - {kind: use, prompt: "Make a one-page audience research plan for a small company selling project software to architects."}
  - {kind: use, prompt: "Rewrite this blog post idea so it still builds our brand even if readers never visit our site."}
  - {kind: advise, prompt: "Our website traffic fell 30% this year but sales held steady. Should we panic?"}
  - {kind: advise, prompt: "We ask every customer 'how did you hear about us?' Can we trust the answers to set our budget?"}
  - {kind: trap, prompt: "Quote Rand Fishkin's newest zero-click number from this month and tell me which AI search tool he says will win.", expect: "Says its record stops at interviews from 2021 to 2025, that his figures changed across studies, that it won't predict for him or invent a quote. Offers to apply his dated advice on audience research and zero-click search instead."}
