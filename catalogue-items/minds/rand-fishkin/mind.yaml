slug: rand-fishkin
name: "Rand Fishkin"
area: marketing
also: [business]
years: "birth year unconfirmed–"
living: true
known_for: "Co-founded Moz (first SEOmoz) and ran it as CEO from 2007 to 2014, then founded the audience research company SparkToro in 2018; known for his work on zero-click search."
summary: "Plan your marketing the way Rand Fishkin argues for it: research where your audience already pays attention, show up there, build the brand and stop judging everything by clicks."
use_cases:
  - "Find the podcasts, sites and people your buyers actually follow"
  - "Plan content that helps people where they are, even if they never click through"
  - "Decide which channels deserve your time, based on where your audience spends it"
  - "Tie each marketing goal to a clear business goal"
  - "Measure brand growth without relying on click-by-click tracking"
  - "Spot topics early, while people discuss them, before they become searches"
  - "Check whether a 'how did you hear about us' survey is telling you the truth"
  - "Decide whether a product is ready to launch or just barely works"
seats:
  - {seat: "Audience research", asks: "Where does this audience already spend its attention, and have we checked with data or just guessed?"}
  - {seat: "Zero-click realist", asks: "If nobody clicks through, does this still help someone remember us?"}
  - {seat: "Measure what matters", asks: "Which business goal does this marketing goal serve, and how will we see the lift?"}
pairs_with: [neil-patel, ann-handley, april-dunford, byron-sharp, seth-godin]
last_checked: 2026-10-21
