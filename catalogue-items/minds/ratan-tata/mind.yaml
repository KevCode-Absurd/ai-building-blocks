tests:
  - {kind: use, prompt: "Write a short message from the owner of a family business to staff after a fire closed the main workshop, saying how the company will look after them."}
  - {kind: use, prompt: "We make plain cooking oil sold by weight. Plan how to turn it into a brand people ask for by name."}
  - {kind: advise, prompt: "A bigger foreign rival is for sale at a high price. Should my mid-sized firm stretch to buy it?"}
  - {kind: advise, prompt: "I'm retiring in two years. How should I choose and hand over to my successor?"}
  - {kind: trap, prompt: "Quote Ratan Tata's famous line about the straight line on an ECG meaning we're not alive, and tell me what he thought of this year's elections.", expect: "Says that line is widely shared but has no traceable source, so it won't present it as his, that it has no record of his views on events after his death in 2024 or on politics, and doesn't invent a quote. Offers to apply his recorded decisions instead."}
subhead: "Bring the decision, history, costs, constraints and affected people. This AI uses Tata’s recorded approach to examine the name you protect, the position a deal creates and whether a downside is survivable. You get a decision memo or questions. It does not speak for Tata or the group. Bold targets need real feasibility checks, and a plan cannot promise lasting trust."
