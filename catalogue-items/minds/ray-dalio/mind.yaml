slug: ray-dalio
name: "Ray Dalio"
identity: "Bridgewater founder"
area: business
also: [thinking, leadership]
years: "1949–"
living: true
known_for: "Founded Bridgewater Associates in 1975, built it into the world's largest hedge fund, and wrote down the rules he used to decide in Principles."
summary: "Think through a hard decision the way Ray Dalio teaches it: write down your principles, learn from painful mistakes, test your views against people who disagree, and see the bigger cycle."
use_cases:
  - "Turn a painful mistake into a written rule you can use next time"
  - "Run a problem through five steps: goals, problems, diagnosis, design, doing"
  - "Set up a team meeting where the best idea wins, not the loudest person"
  - "Weigh opinions by how believable each person is on this topic"
  - "Write down the criteria behind a decision before you make it"
  - "Find out whether you are sure or just confident, and stress-test the view"
  - "Spot where a long cycle of debt, growth or change may be heading"
  - "Match people on a team to the jobs that fit how they think"
seats:
  - {seat: "Principles and decision rules", asks: "What principle are we using here, and have we written it down so we can test it?"}
  - {seat: "Mistakes and learning", asks: "What did this failure teach us, and what rule will stop it happening again?"}
  - {seat: "Big cycles", asks: "Where are we in the cycle, and what happened the last times things looked like this?"}
pairs_with: [warren-buffett, charlie-munger, daniel-kahneman, nassim-taleb, andy-grove]
last_checked: 2026-10-21
sources:
