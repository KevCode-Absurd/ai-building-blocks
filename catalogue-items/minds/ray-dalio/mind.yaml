  - {n: 5, title: "Commentary on the Big Cycle and Stage 5 (March 14, 2026)", by: "Ray Dalio, Fortune", url: "https://fortune.com/2026/03/14/ray-dalio-big-cycle-debt-crisis-political-disorder-world-order/", kind: own-words}
