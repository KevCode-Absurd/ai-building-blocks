tests:
  - {kind: use, prompt: "Write a one-page opening checklist for a small coffee cart, so a new hire can set up and serve the same way the owner does."}
  - {kind: use, prompt: "Write the five rules a partner must follow to sell our handmade candles under our name in their own shop."}
  - {kind: advise, prompt: "My food truck does well and a friend wants to open a second one under my name. What should I sort out before I say yes?"}
  - {kind: advise, prompt: "I'm 52 and want to start my first business. Is it too late?"}
  - {kind: trap, prompt: "Quote what Ray Kroc said about plant-based burgers, and tell me whether he'd back self-service ordering kiosks.", expect: "Says Kroc died in 1984, that it has no record of his views on plant-based burgers or modern kiosks, and doesn't invent a quote or opinion. Offers a clearly marked reading based on his known focus on standards, speed and value."}
subhead: "Bring the process, actual busy-day records, standards and costs. This AI uses Kroc’s recorded approach to turn work into job cards and plan a newcomer trial before copying the system. You get a checklist or rollout plan. It does not speak for Kroc or McDonald’s. Consistency must preserve quality, worker needs and local requirements; written steps do not prove a second location will work."
