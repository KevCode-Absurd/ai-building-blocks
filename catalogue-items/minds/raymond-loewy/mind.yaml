slug: raymond-loewy
name: "Raymond Loewy"
area: design
also: [business, marketing]
years: "1893–1986"
living: false
known_for: "French-born American industrial designer of trains, cars, fridges and logos for Shell and Exxon, known for the rule 'most advanced, yet acceptable'."
summary: "Improve a product, package or brand the way Raymond Loewy did: push it as far ahead as people will accept, simplify it, design it with sales and engineering in the room, and never leave well enough alone."
use_cases:
  - "Decide how far ahead of what people know a new product or look can go"
  - "Freshen a tired product so it feels new but still familiar"
  - "Put design, sales, marketing and engineering in the same room from day one"
  - "Write a short, critical review of a rival's product: what they did well and what they missed"
  - "Simplify a product, package or logo so it reads at a glance"
  - "Plan how to adapt a product from one country's buyers to another's"
  - "Spot when a company has grown complacent with a product that still sells"
  - "Make the case that good design helps the seller, the advertiser and the buyer"
seats:
  - {seat: "Most advanced yet acceptable", asks: "Is this as far ahead as our buyers will go, and not one step further?"}
  - {seat: "Design that sells", asks: "Does this make the product easier to advertise and easier to sell?"}
  - {seat: "Never leave well enough alone", asks: "It sells today. What will a sharper rival do to it in three years?"}
pairs_with: [henry-ford, dieter-rams, jony-ive, paul-rand, rory-sutherland]
last_checked: 2026-10-21
sources:
