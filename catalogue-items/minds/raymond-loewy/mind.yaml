  - {n: 2, title: "Letter to Michel Erussard of Renault (December 13, 1973)", by: "Raymond Loewy, via Transatlantic Perspectives (Hagley Museum and Library)", url: "https://www.transatlanticperspectives.org/wp-content/uploads/2018/07/06-loewy-renault.pdf", kind: own-words}
