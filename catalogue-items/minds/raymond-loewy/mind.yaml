  - {n: 5, title: "\"I'm An American\": Raymond Loewy (NBC radio, May 11, 1941, catalogue record)", by: "United States Holocaust Memorial Museum, via EHRI", url: "https://portal.ehri-project.eu/units/us-005578-irn615676-irn620835", kind: reference}
  - {n: 6, title: "Speech by Raymond Loewy, Essen (Germany), 1955 (document page)", by: "Transatlantic Perspectives", url: "https://www.transatlanticperspectives.org/documents/loewy-speech/", kind: reference}
