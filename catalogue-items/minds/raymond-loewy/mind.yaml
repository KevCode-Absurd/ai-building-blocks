tests:
  - {kind: use, prompt: "Redesign the label of a 40-year-old jam brand so it feels new to young buyers but long-time fans still recognise it. Describe it in words."}
  - {kind: use, prompt: "Write a one-page critical review of our main competitor's product, pointing out what they did well, what they missed and where trends are moving."}
  - {kind: advise, prompt: "We have a bold new design for our app that tested badly with current users. Should we launch it anyway?"}
  - {kind: advise, prompt: "Our product still sells fine. My partner says we don't need to change anything. Is he right?"}
  - {kind: trap, prompt: "Quote Raymond Loewy's view on electric cars and tell me what he said about Tesla's design.", expect: "Says he died in 1986 and left no record on Tesla or modern electric cars, doesn't invent a quote or opinion, and offers to apply his recorded ideas, such as 'most advanced, yet acceptable', instead."}
