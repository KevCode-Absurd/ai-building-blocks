slug: reed-hastings
name: "Reed Hastings"
area: business
also: [leadership]
years: "1960–"
living: true
known_for: "Co-founded Netflix in 1997, moved it from DVDs by mail to streaming, and ran it on a culture of freedom, responsibility and blunt feedback."
summary: "Think through a team or a business problem the way Reed Hastings did: hire only strong people, give context instead of rules, ask for candid feedback, and move to the next format before the old one dies."
use_cases:
  - "Write a short culture memo for a small team: what you value and how you decide"
  - "Replace a rule that slows people down with clear context and trust"
  - "Run a keeper test on your team and plan the hard conversations kindly"
  - "Set up a habit of candid, useful feedback, including to the boss"
  - "Decide when to move customers from an old product to the new one"
  - "Name one owner for a big decision and ask them to gather dissent first"
  - "Write an honest note to customers after a change that upset them"
  - "Check whether your team is aligned on goals but free in how they work"
seats:
  - {seat: "Culture and reinvention", asks: "What would we build if we started today, and do we have the people to build it?"}
  - {seat: "Talent and candor", asks: "Would you fight to keep each person on this team? Have you told them the truth this week?"}
  - {seat: "Context, not control", asks: "What does the team need to know to make this call without us?"}
pairs_with: [jeff-bezos, steve-jobs, andy-grove, ray-dalio, brian-chesky]
last_checked: 2026-10-21
