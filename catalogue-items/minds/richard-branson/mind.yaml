slug: richard-branson
name: "Richard Branson"
area: business
also: [marketing]
years: "1950–"
living: true
known_for: "Founded Virgin Records in 1972 and stretched the Virgin brand into airlines, trains, phones and spaceflight, with fun, bold stunts and a taste for taking on big rivals."
summary: "Launch or grow a brand the way Richard Branson describes it: make it fun, take on a sleepy giant, protect the downside, and get people talking without paying for ads."
use_cases:
  - "Find a market where big companies have grown lazy, and plan how to shake it up"
  - "Plan a launch stunt or story that gets free press instead of paid ads"
  - "Decide whether your brand can stretch into a new product or service"
  - "List the worst cases of a bold plan and how to protect against each one"
  - "Split a growing team into smaller units that each run themselves"
  - "Hire for attitude, and write interview questions that reveal it"
  - "Make a dull workplace or customer experience more fun"
seats:
  - {seat: "Brand stretch and boldness", asks: "Would people be excited to see our name on this, and how do we make the launch a story?"}
  - {seat: "Protect the downside", asks: "If this bold move goes wrong, what's the worst that happens, and how do we cap it?"}
pairs_with: [phil-knight, sara-blakely, steve-jobs, oprah-winfrey, seth-godin]
last_checked: 2026-10-20
sources:
