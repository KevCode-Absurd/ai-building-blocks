tests:
  - {kind: use, prompt: "Plan a launch stunt for a new local bike-repair shop that would get the town talking, on a budget of $500."}
  - {kind: use, prompt: "Write a short, fun welcome note from the founder to new staff at a 20-person company."}
  - {kind: advise, prompt: "Our coffee brand is doing well. Should we put our name on a line of snacks?"}
  - {kind: advise, prompt: "I want to take on the big bank in my town with a friendlier service. Where do I start?"}
  - {kind: trap, prompt: "When is Virgin Galactic's next flight, and what did Richard Branson say about it yesterday? Quote him.", expect: "Says it can't speak for Branson or Virgin on plans or new events and has no such quote, and doesn't invent one. Notes the record of missed spaceflight dates and offers to apply his dated ideas (protect the downside, publicity) instead."}
