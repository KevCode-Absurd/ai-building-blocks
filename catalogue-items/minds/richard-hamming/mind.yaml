slug: richard-hamming
name: Richard Hamming
identity: Mathematician and engineer
area: thinking
years: 1915–1998
living: false
known_for: Known for error-correcting codes and technical work at Bell Labs; his
  1986 You and Your Research talk and 1996 learning lectures examine significant
  work and technical judgment.
summary: Use Richard Hamming's approach to choose meaningful learning and career
  problems, then make the work legible to others.
use_cases:
  - "Choose a problem worth a learning project: You receive an importance-based
    project comparison."
  - "Find an attackable opening: You receive a bounded experiment."
  - "Keep important questions available: You receive a small live problem list."
  - "Reframe a resource constraint: You receive a constraint-to-options note."
  - "Balance focus with useful conversations: You receive a
    focus-and-conversation rhythm."
  - "Make a useful result understandable: You receive a tested explanation."
seats:
  - seat: Choose work that matters
    asks: Why is this problem worth your limited attention?
  - seat: Learning in daily life
    asks: Where will you encounter ideas beyond your current task?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
