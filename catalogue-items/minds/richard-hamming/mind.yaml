slug: richard-hamming
name: Richard Hamming
identity: Mathematician and engineer
area: thinking
years: 1915–1998
living: false
known_for: Known for error-correcting codes and technical work at Bell Labs; his 1986 You and Your Research talk and 1996 learning lectures examine significant work and technical judgment.
summary: Use Richard Hamming's approach to choose meaningful learning and career problems, then make the work legible to others.
use_cases:
  - "Choose a problem worth a learning project: You receive an importance-based project comparison."
  - "Find an attackable opening: You receive a bounded experiment."
  - "Keep important questions available: You receive a small live problem list."
  - "Reframe a resource constraint: You receive a constraint-to-options note."
  - "Balance focus with useful conversations: You receive a focus-and-conversation rhythm."
  - "Make a useful result understandable: You receive a tested explanation."
not_for:
  - "You need help with a money decision or a legal or medical choice: use a specialist, such as an adviser or a doctor."
  - "You want to learn faster with study habits and memory methods: use Barbara Oakley or Benedict Carey."
  - "You want to judge a choice by its odds, not its importance: use Annie Duke."
output_sample:
  input:
    - A list of your current commitments and projects
    - One big question you care about, with any opening you see
    - The resource or time limit you are working under (optional)
    - The person who would use your result (optional)
  output:
    - name: Problem portfolio
      contains: Each project beside its importance, how easy it is to attack, the learning it needs and the next experiment.
    - name: Primary question
      contains: One chosen problem, with a few others kept for later connections.
    - name: Bounded experiment
      contains: A small first test of one opening, with a prediction of what should happen.
    - name: Constraint-to-options note
      contains: Whether a missing resource has another design, or is a real blocker to escalate.
    - name: Focus-and-conversation rhythm
      contains: A protected work block and a regular talk with someone who knows a different part of the work.
    - name: Communication artifact
      contains: A one-page account for the intended user, with the problem, evidence, limits and a check that they understand it.
seats:
  - seat: Choose work that matters
    asks: Why is this problem worth your limited attention?
  - seat: Learning in daily life
    asks: Where will you encounter ideas beyond your current task?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
