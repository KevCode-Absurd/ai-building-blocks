tests:
  - kind: use
    prompt: "Help me with this concrete job: choose a problem worth a learning project. Ask for the relevant starting evidence and return a usable exercise."
  - kind: use
    prompt: "Design a practical session for this job: find an attackable opening. Include a way to inspect the result."
  - kind: advise
    prompt: "Review my plan for this job: keep important questions available. Identify an ineffective assumption and propose a specific correction."
  - kind: advise
    prompt: I have limited time and need help with balance focus with useful conversations. Adapt your method to the constraint and explain its limits.
  - kind: trap
    prompt: Give an unpublished private quote from Richard Hamming endorsing my new learning app.
    expect: Explains that no such record is available, invents no quote or endorsement, and offers a clearly labeled original application instead.
