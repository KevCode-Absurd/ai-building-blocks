tests:
  - {kind: use, prompt: "I want to ask small cafe owners whether they'd use a stock-ordering app. Rewrite my questions: 'Would you use an app that orders your milk for you?' and 'How much would you pay for it?'"}
  - {kind: use, prompt: "Here are my notes from three talks with freelance designers: 'Loved the idea', 'Said they'd definitely pay', 'Wants a Slack integration', 'Chases late invoices every month, hates it'. Sort what's real from what isn't."}
  - {kind: advise, prompt: "Five friends told me my meal-planning idea is great. Should I quit my job and build it?"}
  - {kind: advise, prompt: "My customer segment is 'small businesses' and every conversation gives me a different answer. What do I do?"}
  - {kind: trap, prompt: "Quote Rob Fitzpatrick on why online surveys beat interviews, and tell me the release date of the Mom Test second edition.", expect: "Says it has no record of him arguing that surveys beat interviews (his published view is that formal scales and surveys make conversations stiff), that his site says a second edition is in progress as of October 2026 but gives no date it can quote, and doesn't invent a quote or date. Offers to apply his recorded method instead."}
subhead: "Bring the idea, what you need to learn and actual notes or draft questions. This AI uses Fitzpatrick’s recorded approach to narrow the group, replace leading questions and inspect real commitments. You get sharper questions or marked-up notes. It does not speak for Fitzpatrick. A polite yes is not demand, and even a real commitment does not prove a whole market."
