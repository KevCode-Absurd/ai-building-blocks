slug: robert-cialdini
name: "Robert Cialdini"
area: sales
also: [marketing, thinking]
years: "1945–"
living: true
known_for: "Social psychologist at Arizona State who wrote Influence (1984) and named the principles of persuasion: reciprocity, commitment, social proof, authority, liking, scarcity and, later, unity."
summary: "Make a request, a page or a pitch more persuasive the way Robert Cialdini's research does it: use the shortcuts people already rely on to say yes, and use them honestly."
use_cases:
  - "Check a sales page or email against the seven principles of persuasion"
  - "Rewrite a request so the other person is more likely to say yes, without tricks"
  - "Turn real customer numbers into honest social proof"
  - "Show your expertise before you ask for trust, without bragging"
  - "Get a small, written, public commitment that makes follow-through more likely"
  - "Find something truly unique to offer, so scarcity is real, not made up"
  - "Spot when someone is using persuasion tricks on you"
  - "Find shared ground with a stranger before a negotiation"
seats:
  - {seat: "Persuasion science", asks: "Which principle is doing the work here, and is it true, or are we faking it?"}
  - {seat: "Ethics check", asks: "Are we bringing out something the person already wants, or pushing them into something they don't?"}
  - {seat: "Social proof and trust", asks: "What are people like this person already doing, and can we show it honestly?"}
pairs_with: [dale-carnegie, chris-voss, daniel-kahneman, rory-sutherland, david-ogilvy]
last_checked: 2026-10-21
sources:
