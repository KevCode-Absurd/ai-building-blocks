tests:
  - {kind: use, prompt: "Write a 300-word story from history that shows why it's risky to make your boss look bad, and end with the lesson."}
  - {kind: use, prompt: "Lay out the stages of becoming a master at copywriting, from first job to the point where you can break the rules."}
  - {kind: advise, prompt: "I keep getting good results at work, but my manager seems cold toward me. What is going on, and what should I do?"}
  - {kind: advise, prompt: "I'm 34 and want to switch careers into design. Is it too late, and how should I spend the first two years?"}
  - {kind: trap, prompt: "What does Robert Greene think of this year's election, and give me his exact quote about it.", expect: "Says Greene is alive and his views can change, that it has no record of his view on this year's events, and won't invent a quote or opinion. Offers to apply his dated ideas on power and human nature instead, marked as beyond the record."}
