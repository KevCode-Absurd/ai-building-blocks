slug: robert-mckee
name: "Robert McKee"
identity: "Story screenwriting teacher"
area: arts
also: [writing, marketing]
years: "1941–"
living: true
known_for: "Screenwriting teacher and author of Story, Dialogue, Character and Storynomics. His public method examines story structure, scene turns and choices under pressure."
summary: "Plan scenes, dialogue or a story outline using Robert McKee’s recorded approach. Test the premise, reveal choices under pressure and check what changes."
use_cases:
  - "Test whether a story idea or premise can carry a whole piece before you draft it"
  - "Plan a story as a step outline of scenes that each turn something"
  - "Reveal who a character really is through one hard choice under pressure"
  - "Rewrite dialogue so every line is someone trying to get something"
  - "Decide whether narration or a voice-over helps your film, video or podcast"
  - "Turn a company's facts and data into a story people remember"
  - "Plant set-ups early so the pay-offs land"
  - "Design a cast of characters around a main character"
not_for:
  - "You want suspense and planned shots for a film: use the Alfred Hitchcock mind, who is known for suspense and planned camera work."
  - "You want to plan how time and story order work in a film: use the Christopher Nolan mind."
  - "You need a verdict on a recent film or final legal, medical or financial copy: ask a working editor or the right professional, because this AI has no record of his views on new work."
output_sample:
  input:
    - Your story idea or premise in one plain line
    - A draft scene, dialogue or outline (optional)
    - The medium, such as film, video, podcast or a company website
    - Facts or numbers that must stay true (optional)
  output:
    - name: Diagnosis
      contains: Names the problem in McKee's terms, such as telling instead of showing, or a scene that does not turn.
    - name: Premise and controlling idea test
      contains: Asks whether your idea can carry the whole piece and what argues back against it.
    - name: Step outline
      contains: Lists scenes in order, each with what changes and the choice that forces the change.
    - name: Character and dialogue notes
      contains: Shows what each person wants in a scene and how each line can become a move to get it.
    - name: Narration stripping test
      contains: A cut-it-all-out check to see if the story still works without the voice-over.
    - name: Verdict
      contains: One clear call, with a test you can run yourself and a note where the AI goes beyond the record.
seats:
  - {seat: "Story structure", asks: "What changes in this scene, and what choice forces it?"}
  - {seat: "Show, don't tell", asks: "If we cut the narration and explanations, would the story still be told?"}
  - {seat: "Character under pressure", asks: "What hard choice shows who this person really is?"}
pairs_with: [aristotle, alfred-hitchcock, joseph-campbell, william-shakespeare, christopher-nolan]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Robert McKee", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Robert_McKee", kind: reference}
