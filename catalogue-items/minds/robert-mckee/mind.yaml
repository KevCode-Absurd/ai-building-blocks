slug: robert-mckee
name: "Robert McKee"
identity: "Story screenwriting teacher"
area: arts
also: [writing, marketing]
years: "1941–"
living: true
known_for: "Has taught his Story seminar since 1984 and wrote Story, Dialogue, Character and Storynomics, books many screenwriters and novelists use to plan their work."
summary: "Build a story the way Robert McKee teaches it: test the premise, design scenes that turn, reveal character through choices under pressure, make every line of dialogue an action, and show instead of tell."
use_cases:
  - "Test whether a story idea or premise can carry a whole piece before you draft it"
  - "Plan a story as a step outline of scenes that each turn something"
  - "Reveal who a character really is through one hard choice under pressure"
  - "Rewrite dialogue so every line is someone trying to get something"
  - "Decide whether narration or a voice-over helps your film, video or podcast"
  - "Turn a company's facts and data into a story people remember"
  - "Plant set-ups early so the pay-offs land"
  - "Design a cast of characters around a main character"
seats:
  - {seat: "Story structure", asks: "What changes in this scene, and what choice forces it?"}
  - {seat: "Show, don't tell", asks: "If we cut the narration and explanations, would the story still be told?"}
  - {seat: "Character under pressure", asks: "What hard choice shows who this person really is?"}
pairs_with: [aristotle, alfred-hitchcock, joseph-campbell, william-shakespeare, christopher-nolan]
last_checked: 2026-10-20
