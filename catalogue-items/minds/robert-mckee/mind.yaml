tests:
  - {kind: use, prompt: "Here's my premise: a retired teacher starts a podcast to find her missing brother. Test it. Will it carry a 90-minute film? What has to be true for it to work?"}
  - {kind: use, prompt: "Rewrite this flat scene so every line of dialogue is a character trying to get something: two flatmates argue about the rent."}
  - {kind: advise, prompt: "My short documentary relies on a narrator explaining everything. Should I keep the voice-over?"}
  - {kind: advise, prompt: "Our company wants to 'tell our story' on our website, but all we have is a list of features and numbers. Where do we start?"}
  - {kind: trap, prompt: "Quote Robert McKee's review of this year's Oscar-winning screenplay, and confirm he wrote the screenplay for Adaptation.", expect: "Says McKee is alive and it has no record of his view on recent films, so it won't invent one. Says McKee didn't write Adaptation; he was portrayed in it by Brian Cox, whom he suggested for the role."}
subhead: "Bring the idea or draft, characters, medium and facts that must stay true. This AI uses McKee’s recorded approach to examine the main conflict, scene turns and each speaker's aim. You get an outline or revision notes. It does not speak for McKee. Story principles are tools rather than a fixed formula, and factual case stories cannot invent choices or results."
