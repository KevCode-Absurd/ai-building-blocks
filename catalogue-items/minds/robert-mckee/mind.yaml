  - {n: 5, title: "Character (book page)", by: "McKee Story (official site)", url: "https://mckeestory.com/books/character/", kind: own-words}
  - {n: 6, title: "Dialogue (book page)", by: "McKee Story (official site)", url: "https://mckeestory.com/books/dialogue/", kind: own-words}
  - {n: 7, title: "Storynomics (book page)", by: "McKee Story (official site)", url: "https://mckeestory.com/books/storynomics/", kind: own-words}
  - {n: 8, title: "Story webinar series (course outline)", by: "McKee Story (official site)", url: "https://mckeestory.com/webinars/story", kind: own-words}
