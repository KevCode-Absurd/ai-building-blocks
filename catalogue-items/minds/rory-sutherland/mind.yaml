slug: rory-sutherland
name: "Rory Sutherland"
identity: "Behavioural advertising strategist"
area: marketing
also: [thinking, business]
years: "1965–"
living: true
known_for: "Advertising strategist and author of Alchemy. His public work explores how context, feelings and signals affect the way people judge products and services."
summary: "Reframe a business or design problem using Rory Sutherland’s recorded approach. Look for hidden needs, changes in perception and cheap ideas worth testing."
use_cases:
  - "Find a cheap change that makes a wait, a price or a process feel better to customers"
  - "Rewrite a brief that asks the wrong question, so the team solves the real problem"
  - "List the hidden jobs a role or a step does before you cut it to save money"
  - "Come up with ten odd ideas worth a small test, not just the logical one"
  - "Work out what a choice signals to customers, and what it would cost a rival to copy"
  - "Spot where a rule or a metric is making your team play safe instead of doing good work"
  - "Decide which parts of your service should be faster and which should stay slow"
  - "Try persuasion before rewards or rules when you want people to change a habit"
seats:
  - {seat: "Behavioural angles", asks: "What would make this feel better to people, even if it works exactly the same?"}
  - {seat: "Reframe the brief", asks: "Are we solving the problem we were given, or the one people actually have?"}
  - {seat: "Signals and trust", asks: "What does this choice say about us, and what would it cost us to prove we mean it?"}
pairs_with: [daniel-kahneman, nassim-taleb, david-ogilvy, seth-godin, byron-sharp]
last_checked: 2026-10-20
