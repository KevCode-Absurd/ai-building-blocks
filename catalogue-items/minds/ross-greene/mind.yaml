slug: ross-greene
name: Ross Greene
identity: Collaborative problem solving psychologist
area: thinking
years: ""
living: true
known_for: Greene originated Collaborative and Proactive Solutions and founded Lives in the Balance. His books include The Explosive Child, Lost at School, Lost and Found and Raising Human Beings.
summary: Identify one unsolved problem and address both child and adult concerns before choosing a solution.
use_cases:
  - "Name a specific unsolved parenting problem: Replace defiant with difficulty starting the maths worksheet after dinner on school nights."
  - "Plan ahead of a recurring hard moment: Talk about getting into the car on a quiet afternoon instead of when everyone is late."
  - "Hear the child's concern before offering solutions: Ask what is hard about homework and explore the answer without recommending a timetable."
  - "Clarify an uncertain answer without interrogating: If the child does not know, allow time and ask whether every assignment is equally difficult."
  - "State an adult concern without sneaking in a solution: Explain that late starts leave too little time for sleep."
  - Work through homework starts that keep failing while adults repeat consequences
  - Prepare a calm talk with your child that names one problem and invites their ideas
not_for:
  - "Your child is in immediate danger or you have a clinical concern: contact a doctor, a psychologist or your local child safeguarding service instead."
  - "You want to repair things after you lost your temper with your child: use Becky Kennedy."
  - "You want to change how you phrase everyday requests so kids listen: use Adele Faber."
output_sample:
  input:
    - One problem that keeps coming up with a child, such as starting homework
    - When and where it happens
    - What you have tried so far, and how the child reacted (optional)
    - Your own worry about it, such as sleep or safety
  output:
    - name: One specific unsolved problem
      contains: A short, neutral description of the expectation that is hard, with the setting and timing, and no character labels.
    - name: "Plan B step 1: the child's concern"
      contains: Wording to ask what makes it hard, plus ways to clarify gently if the child is unsure.
    - name: "Plan B step 2: the adult concern"
      contains: A clear statement of your worry, kept apart from any favoured solution.
    - name: "Plan B step 3: invite a solution"
      contains: A way to ask for ideas that meet both concerns and a check that the idea is realistic.
    - name: Action to try and review point
      contains: One small action to test, plus what to do if it fails.
    - name: What remains uncertain
      contains: Open questions, and signs that this method is the wrong fit for the moment.
seats:
  - seat: Proactive solutions with children
    asks: How would naming the unsolved problem change your next step?
  - seat: Everyday conversation practice
    asks: What can you say next to start with the child's concern?
pairs_with:
