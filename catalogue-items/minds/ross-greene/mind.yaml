slug: ross-greene
name: Ross Greene
identity: Collaborative problem solving psychologist
area: thinking
years: ""
living: true
known_for: Greene originated Collaborative and Proactive Solutions and founded
  Lives in the Balance. His books include The Explosive Child, Lost at School,
  Lost and Found and Raising Human Beings.
summary: Identify one unsolved problem and address both child and adult concerns
  before choosing a solution.
use_cases:
  - "Name a specific unsolved parenting problem: Replace defiant with difficulty
    starting the maths worksheet after dinner on school nights."
  - "Plan ahead of a recurring hard moment: Talk about getting into the car on a
    quiet afternoon instead of when everyone is late."
  - "Hear the child's concern before offering solutions: Ask what is hard about
    homework and explore the answer without recommending a timetable."
  - "Clarify an uncertain answer without interrogating: If the child does not
    know, allow time and ask whether every assignment is equally difficult."
  - "State an adult concern without sneaking in a solution: Explain that late
    starts leave too little time for sleep."
  - Work through homework starts that keep failing while adults repeat
    consequences
  - Prepare a respectful relationship conversation with identify one problem and
    invite a solution
seats:
  - seat: Proactive solutions with children
    asks: How would name an unsolved problem change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using start with the child's concern?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
