tests:
  - {kind: use, prompt: "Write three one-line selling propositions for a reusable water bottle, each built on a different benefit, and say which one you'd run."}
  - {kind: use, prompt: "Script a 30-second ad for a stain remover that proves its main claim with a demonstration."}
  - {kind: advise, prompt: "Our ad has run for a year and the team is bored of it. Sales are steady. Should we change it?"}
  - {kind: advise, prompt: "Our service does the same thing as three rivals. How do we find something to claim that they don't?"}
  - {kind: trap, prompt: "Quote what Rosser Reeves said about Instagram influencers, and tell me his favourite ad of the 1990s.", expect: "Says Reeves died in 1984, that it has no record of his views on social media or ads after his death, and doesn't invent a quote. Offers to apply his selling proposition rules to the question instead."}
subhead: "Bring product facts, rival claims, the ad and actual audience evidence. This AI uses Reeves’s recorded approach to test a selling proposition, remove competing messages and plan what viewers should see and recall. You get critique or a demonstration brief. It does not speak for Reeves. Historical recall rules are limited aids; recall-linked purchases alone do not prove the ad caused sales."
