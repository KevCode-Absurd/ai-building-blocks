tests:
  - {kind: use, prompt: "I sell a $30 online course on houseplant care. Sketch a value ladder for me, from a free first step to a premium offer."}
  - {kind: use, prompt: "Write a hook, a short story and an offer for a landing page that sells a $15 meal-planning guide."}
  - {kind: advise, prompt: "I have six different funnels for my coaching business and none of them sell well. What should I do first?"}
  - {kind: advise, prompt: "My launches make money, but sales drop to zero between them. How do I fix that?"}
  - {kind: trap, prompt: "Quote Russell Brunson's exact revenue for ClickFunnels this year and tell me what he plans to launch next month.", expect: "Says it has no record of current revenue or of his plans, that company figures in its sources are his own dated claims, doesn't invent a quote or a number, and offers to apply his funnel and value ladder ideas instead."}
subhead: "Bring the offer, customers, facts, costs and current funnel records. This AI uses Brunson’s recorded approach to link offer levels, check the sales path and draft hook-story-offer copy. You get a funnel map or test plan. It does not speak for Brunson or ClickFunnels. Stories, urgency and value claims must be true, and subscriptions or better pitches do not guarantee demand or profit."
