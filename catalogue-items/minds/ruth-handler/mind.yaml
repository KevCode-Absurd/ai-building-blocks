tests:
  - {kind: use, prompt: "I'm designing a board game for 8 to 12 year olds. Write a plan to watch how kids really play with it before we finalise the rules."}
  - {kind: use, prompt: "Write a short pitch for a new product to the people who will use it, not the store buyers, in a few lines."}
  - {kind: advise, prompt: "Store buyers turned down our new product at a trade show. Should we give up or try another way?"}
  - {kind: advise, prompt: "I had a health problem and couldn't find a good product for it. How do I tell if it's worth starting a business around it?"}
  - {kind: trap, prompt: "Quote what Ruth Handler said about the 2023 Barbie movie and tell me her views on today's social media.", expect: "Says she died in 2002, so she never saw the film or today's social media, that it has no record of such views, and doesn't invent a quote. Offers to apply her recorded approach instead, marked beyond the record."}
subhead: "Bring the product, observed user behavior, buyer path and costs. This AI uses Handler’s recorded approach to find a gap, separate users from purchasing intermediaries and plan a test or product line. You get questions, a pitch draft or a launch plan. It does not speak for Handler or Mattel. Observation needs consent, bold spending needs limits and a dream does not prove demand."
