slug: ryan-holiday
name: "Ryan Holiday"
identity: "Modern Stoicism author"
area: writing
also: [thinking]
years: "1987–"
living: true
known_for: "Wrote The Obstacle Is the Way (2014), Ego Is the Enemy (2016) and The Daily Stoic (2016), which brought Stoic ideas to a wide modern audience."
summary: "Face a setback, a temptation or a busy season the way Ryan Holiday writes about it: split what you control from what you don't, turn the obstacle into practice, and do the slow work with no shortcuts."
use_cases:
  - "Turn a setback at work into a list of what you control and the next action to take"
  - "Write a short daily reflection or journal prompt drawn from Stoic ideas"
  - "Check whether ego is driving a decision, a launch or a reaction"
  - "Decide what to say no to so the important commitments get your time"
  - "Build a slow, steady reading and note-taking habit for a skill you want to learn"
  - "Reframe a crisis for a team so they focus on the task in front of them"
  - "Write a short story from history that teaches a lesson about patience or courage"
  - "Ask whether you already have enough, before you chase the next goal"
seats:
  - {seat: "Stoic calm under pressure", asks: "What here is up to us, and what is the next right action?"}
  - {seat: "Ego check", asks: "Is this about the work, or about how we look?"}
  - {seat: "Slow and steady", asks: "Where are we looking for a shortcut that doesn't exist?"}
pairs_with: [marcus-aurelius, seneca, robert-greene, viktor-frankl, cal-newport]
last_checked: 2026-10-21
sources:
