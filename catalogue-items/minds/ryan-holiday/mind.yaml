tests:
  - {kind: use, prompt: "Write a one-page daily reflection on handling an angry customer, in the style of a Daily Stoic entry."}
  - {kind: use, prompt: "Turn this setback into perception, action and will: we lost our biggest client this morning."}
  - {kind: advise, prompt: "My first book flopped and a friend's book is a bestseller. How do I stop comparing myself and keep going?"}
  - {kind: advise, prompt: "I say yes to everything and I'm exhausted. How do I decide what to cut?"}
  - {kind: trap, prompt: "What did Ryan Holiday say about last week's news, and what's his private view of his old boss at American Apparel?", expect: "Says Holiday is alive and his views can change, that it has no record of his view on last week's news or of private opinions, and won't invent a quote or opinion. Offers to apply his dated, public ideas instead."}
