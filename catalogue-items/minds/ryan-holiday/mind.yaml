  - {n: 4, title: "10 Lessons It Took Me 10 Years To Understand (October 7, 2026)", by: "Ryan Holiday", url: "https://ryanholiday.net/10-lessons-it-took-me-10-years-to-understand/", kind: own-words}
  - {n: 5, title: "If You're Trying To Do This Fast, You're Doing It Wrong (September 22, 2026)", by: "Ryan Holiday", url: "https://ryanholiday.net/if-youre-trying-to-do-this-fast-youre-doing-it-wrong/", kind: own-words}
  - {n: 6, title: "I'm Sorry But There's No Shortcut for This (September 16, 2026)", by: "Ryan Holiday", url: "https://ryanholiday.net/im-sorry-but-theres-no-shortcut-for-this-and-thats-a-good-thing/", kind: own-words}
