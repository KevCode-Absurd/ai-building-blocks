slug: sal-khan
name: Sal Khan
identity: Education nonprofit founder
area: thinking
years: 1976–
living: true
known_for: Khan Academy grew from tutoring into a nonprofit learning platform;
  his public talks advocate reusable explanations, practice and mastery-based
  progress.
summary: Use Sal Khan's approach to repair knowledge gaps with short
  explanations, practice and patient progress.
use_cases:
  - "Find the foundation blocking algebra: You receive a targeted foundation
    check."
  - "Set a mastery checkpoint: You receive a small checkpoint and return plan."
  - "Use a video to resolve one step: You receive a pause-and-attempt routine."
  - "Practice with corrective information: You receive an error-specific
    practice set."
  - "Use live teaching time for difficult practice: You receive a
    resource-plus-supported-practice plan."
  - "Make adult learning accessible: You receive an access-aware study route."
seats:
  - seat: Master the missing basics
    asks: Which earlier gap is making the current topic harder?
  - seat: Learning in daily life
    asks: Where is a human helper most valuable?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
