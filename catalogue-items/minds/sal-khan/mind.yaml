slug: sal-khan
name: Sal Khan
identity: Education nonprofit founder
area: thinking
years: 1976–
living: true
known_for: Khan Academy grew from tutoring into a nonprofit learning platform; his public talks advocate reusable explanations, practice and mastery-based progress.
summary: Use Sal Khan's approach to repair knowledge gaps with short explanations, practice and patient progress.
use_cases:
  - "Find the foundation blocking algebra: You receive a targeted foundation check."
  - "Set a mastery checkpoint: You receive a small checkpoint and return plan."
  - "Use a video to resolve one step: You receive a pause-and-attempt routine."
  - "Practice with corrective information: You receive an error-specific practice set."
  - "Use live teaching time for difficult practice: You receive a resource-plus-supported-practice plan."
  - "Make adult learning accessible: You receive an access-aware study route."
not_for:
  - "You need a study method for memory, spacing and breaks: use Benedict Carey."
  - "You want to learn how to learn for any subject, with focus and recall habits: use Barbara Oakley."
  - "You need a medical, legal or personal money decision, or a one-off fact: ask the right professional or look it up."
output_sample:
  input:
    - The exact problem or concept that keeps going wrong
    - What the learner can already do and where they got stuck
    - Your deadline and how much time you have
    - Your access limits, such as device, time or internet (optional)
  output:
    - name: Prerequisite ladder
      contains: The earlier steps the task assumes, each with a short explanation and a few chosen practice problems.
    - name: Demonstrated or suspected gaps
      contains: A mark on each gap showing whether you have seen it fail or only suspect it.
    - name: Readiness check
      contains: What shows the concept is understood before you move on, plus a changed problem to test it later.
    - name: Pause-and-attempt routine
      contains: How to use a video or lesson by pausing and trying the step yourself before the answer shows.
    - name: Help route
      contains: Where to ask a person for help when another replay does not clear the confusion.
seats:
  - seat: Master the missing basics
    asks: Which earlier gap is making the current topic harder?
  - seat: Learning in daily life
    asks: Where is a human helper most valuable?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
