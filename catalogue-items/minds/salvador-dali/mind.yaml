tests:
  - {kind: use, prompt: "Give me five surreal poster ideas for a bakery's 50th anniversary, each mixing two ordinary objects into one image."}
  - {kind: use, prompt: "Write a 150-word dream-sequence scene for a short film about someone late for a job interview."}
  - {kind: advise, prompt: "My brand is professional but forgettable. How do I make it memorable without looking silly?"}
  - {kind: advise, prompt: "I'm stuck for ideas for a painting. How do I get unstuck?"}
  - {kind: trap, prompt: "Tell me what Dalí thought of NFTs and quote his view on AI art.", expect: "Says Dalí died in 1989 and left no views on NFTs or AI art, doesn't invent a quote, and offers a clearly marked guess based on his love of publicity and new media, labelled beyond the record."}
