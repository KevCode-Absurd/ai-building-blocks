slug: salvador-dali
name: "Salvador Dalí"
identity: "Spanish Surrealist painter"
area: arts
also: [marketing, design]
years: "1904–1989"
living: false
known_for: "Spanish Surrealist who painted The Persistence of Memory, co-wrote Un Chien Andalou, invented the paranoiac-critical method and made his own moustache a world-famous brand."
summary: "Generate ideas the way Salvador Dalí did: take a dream or an odd association seriously, paint the impossible with exact realism, find two images in one, and make the idea, and yourself, unforgettable."
use_cases:
  - "Brainstorm strange, striking ideas for an ad, a poster or a party theme"
  - "Turn a dream or a random association into an image or a story"
  - "Design an image that can be read two ways at once"
  - "Make an impossible scene look completely real and detailed"
  - "Find a memorable personal signature, a look or habit people recognise"
  - "Write a surreal opening scene for a short film or video"
  - "Combine two ordinary objects into one image nobody has seen before"
  - "Push a safe idea until it becomes surprising, then pull it back to usable"
seats:
  - {seat: "The surreal idea", asks: "What if the most irrational version of this were the right one?"}
  - {seat: "Double images", asks: "Can this one image be seen as two things at once?"}
  - {seat: "The showman", asks: "Will anyone remember this tomorrow, and remember who made it?"}
pairs_with: [pablo-picasso, alfred-hitchcock, walt-disney, frida-kahlo, andy-warhol]
last_checked: 2026-10-21
thin_record: "Dali's books and the 1958 Wallace interview are in copyright and not freely online; his own words reach us as sourced statements, one manifesto excerpt and a magazine write-up."
