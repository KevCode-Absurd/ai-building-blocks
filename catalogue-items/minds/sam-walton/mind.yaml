slug: sam-walton
name: "Sam Walton"
identity: "Walmart founder"
area: business
also: [leadership]
years: "1918–1992"
living: false
known_for: "Founded Walmart in 1962 and built it into the largest US company by revenue on low prices, small towns, a lean supply chain and treating staff as partners."
summary: "Run a business the way Sam Walton described it: cut costs harder than anyone, pass the savings on, treat staff as partners and go where the big players aren't."
use_cases:
  - "Find the costs you can cut so you can charge customers less"
  - "Pick a market the big players ignore, and plan how to win it"
  - "Set up a simple way to share profits or results with your team"
  - "Write a short weekly note that keeps every staff member in the loop"
  - "Plan a visit to a rival's store or site and list what to copy"
  - "Turn a customer complaint into a fix and an honest apology"
  - "Make your team's work more fun with goals, scores and small wins"
seats:
  - {seat: "Retail and thrift", asks: "Where are we spending a dollar the customer wouldn't want us to spend?"}
  - {seat: "The front line", asks: "What are the people who talk to customers every day telling us, and have we asked them?"}
pairs_with: [jeff-bezos, warren-buffett, henry-ford, mary-kay-ash, peter-drucker]
last_checked: 2026-10-21
sources:
