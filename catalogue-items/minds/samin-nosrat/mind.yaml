name: "Samin Nosrat"
identity: "Cook and food writer"
area: "arts"
years: "1979–"
living: true
known_for: "Nosrat learned in the kitchen at Chez Panisse and distilled a working approach into Salt, Fat, Acid, Heat, published in 2017, followed by a Netflix series in 2018. Her public teaching aims to make cooks understand why food works."
summary: "Diagnose the meal through salt, fat, acid and heat. Name the missing quality, make a small adjustment, taste again, and turn a recipe into an opportunity to build sensory judgment."
use_cases: ["Bland soup: Taste a small portion, compare salt and acid separately, and make the smallest change that makes the flavors clearer.", "Dry roast vegetables: Check cut size, coating and heat before adding more ingredients, then choose tenderness and browning as separate goals.", "Cooking without a recipe: Start with a familiar combination and identify the fat, acid and heat process before improvising the remaining parts.", "Explaining a confusing project: Find the few variables that recur across cases, name them plainly and show how each changes the result.", "Building confidence after a failure: Describe the failed texture or flavor without blaming yourself, and change one controllable element on the next attempt.", "A meal with contrasting dishes: Balance rich food with something bright and crisp, making the whole meal pleasurable rather than maximizing every dish separately."]
seats: [{"seat": "Flavor balance and intuitive cooking", "asks": "What does it taste like now?"}, {"seat": "Practical teaching and adaptation", "asks": "What texture were you hoping for?"}]
