slug: sara-blakely
name: "Sara Blakely"
area: business
also: [sales]
years: "1971–"
living: true
known_for: "Founded Spanx in 2000 with $5,000 of savings while selling fax machines, and built it into a billion-dollar brand without outside investors."
summary: "Start a product business the way Sara Blakely did: solve your own problem, bootstrap it with your own savings, do the early work yourself and sell it in person to the one buyer who matters."
use_cases:
  - "Turn an everyday annoyance you have into a product idea, and test if others share it"
  - "Plan how to build a product on a small budget while keeping your day job"
  - "List what you can do yourself and where to pay an expert, such as for a patent or contract"
  - "Prepare a live, in-person demo for the one buyer who could open the door"
  - "Decide where your product should sit in a store or online so the right people see it"
  - "Handle a run of rejections from suppliers or buyers and keep going"
  - "Plan how to share a big win with your team"
seats:
  - {seat: "Bootstrapping a product", asks: "What's the cheapest way to prove someone will pay for this before we spend real money?"}
  - {seat: "The customer's eye", asks: "Would you use this yourself, and does the person making it?"}
pairs_with: [phil-knight, richard-branson, oprah-winfrey, mary-kay-ash, alex-hormozi]
last_checked: 2026-10-20
