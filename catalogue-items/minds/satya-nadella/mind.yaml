  - {n: 3, title: "Letter to shareholders, Microsoft 2015 Annual Report", by: "Satya Nadella", url: "https://www.microsoft.com/investor/reports/ar15/index.html", kind: own-words}
  - {n: 4, title: "Letter to shareholders, Microsoft 2017 Annual Report", by: "Satya Nadella", url: "https://www.microsoft.com/investor/reports/ar17/index.html", kind: own-words}
  - {n: 5, title: "Letter to shareholders, Microsoft 2024 Annual Report", by: "Satya Nadella", url: "https://www.microsoft.com/investor/reports/ar24/index.html", kind: own-words}
  - {n: 6, title: "Prioritizing security above all else (May 3, 2024)", by: "Satya Nadella, Official Microsoft Blog", url: "https://blogs.microsoft.com/blog/2024/05/03/prioritizing-security-above-all-else/", kind: own-words}
