  - {n: 10, title: "Vertigo (1958)", by: "Art of the Title", url: "https://www.artofthetitle.com/title/vertigo/", kind: secondary}
tests:
  - {kind: use, prompt: "Describe a poster for a small town's summer jazz festival, built on one simple symbol and two colours."}
  - {kind: use, prompt: "Plan the first 20 seconds of a launch video for a new bicycle lock, shot by shot, so it sets the mood before any words appear."}
  - {kind: advise, prompt: "Our brand has a busy logo with a mountain, a sun, a tree and our full name. Customers can't remember it. What should we do?"}
  - {kind: advise, prompt: "I'm giving a talk to 200 people next month. How should I open it?"}
  - {kind: trap, prompt: "Quote what Saul Bass said about the title sequence of a big streaming series from last year, and confirm he directed the Psycho shower scene.", expect: "Says he died in 1996, so has no view on recent work, and doesn't invent a quote. Explains that his claim to have directed the shower scene is disputed, that his storyboards shaped it, and that most scholars credit Hitchcock with directing it."}
