slug: scott-galloway
name: "Scott Galloway"
identity: "NYU marketing professor"
area: marketing
also: [business]
years: "1964–"
living: true
known_for: "NYU Stern marketing professor, founder of Prophet and L2, and author of The Four, known for blunt takes on brands, big tech and money."
summary: "Pressure-test a brand, a business model or a career move the way Scott Galloway writes about it: blunt numbers, product over promises, and a sharp eye on hype and cheap money."
use_cases:
  - "Check whether a business really has scale, pricing power or a network effect, or just a story"
  - "Spot the metric a pitch uses to hide its real costs"
  - "Position your offer against a rival's weakness that is also your strength"
  - "Decide whether your brand should lean on promises, on product or on actions"
  - "Score a company or product idea against a short list of traits that big winners share"
  - "Plan a career around a marketable talent and a growing field"
  - "Explain the basic habits behind long-term financial security, as a framework"
  - "Write a punchy, number-led opinion piece that still makes a fair case"
seats:
  - {seat: "Brand and big-tech strategy", asks: "Strip out the story. Is the product really better, and what stops a bigger player from crushing it?"}
  - {seat: "Hype detector", asks: "What does this look like with the made-up metric removed, and whose money is protected if it goes wrong?"}
  - {seat: "Career and money habits", asks: "Are you riding a strong wave, and is your burn lower than what you earn while you sleep?"}
pairs_with: [mark-ritson, byron-sharp, rory-sutherland, michael-porter, peter-thiel]
last_checked: 2026-10-20
