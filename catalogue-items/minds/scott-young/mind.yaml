slug: scott-young
name: Scott Young
identity: Self-directed learning author
area: thinking
years: 1988–
living: true
known_for: Ultralearning (2019), the MIT Challenge completed in 2012, and later essays explore ambitious self-directed learning with attention to evolving evidence.
summary: Use Scott Young's approach to design a practical learning project with direct practice and a realistic schedule.
use_cases:
  - "Scope a learning project: You receive a scope map and completion criterion."
  - "Practice the skill in its intended form: You receive a direct-practice appointment and gap list."
  - "Drill the bottleneck in a project: You receive a targeted drill and reintegration step."
  - "Get feedback before polishing: You receive a feedback note and revised deliverable."
  - "Learn with three short weekly sessions: You receive a small schedule and weekly deliverable."
  - "Use instruction when discovery stalls: You receive an example-to-independent-task sequence."
not_for:
  - "You need a certificate or a license to work in a field: use a formal course or the qualification body, since self-study will not count."
  - "You want to learn how study and memory work, such as spacing and recall: use Benedict Carey or Barbara Oakley."
  - "You need help sticking with a long goal when motivation drops: use Angela Duckworth."
output_sample:
  input:
    - The skill you want to learn
    - The time you really have in a normal week
    - A finished thing you want to make with the skill
    - What you have tried so far (optional)
  output:
    - name: Scope map
      contains: The pages, topics or tasks the project needs, and a clear finish line, with extras left out.
    - name: Direct-practice appointment
      contains: A short supported try at the real task, plus a list of the gaps it shows.
    - name: Targeted drill
      contains: A small exercise on the one part holding you back, and how to return to the project.
    - name: Feedback note
      contains: The most important error found by a reviewer, and a revised version of your work.
    - name: Weekly schedule
      contains: "Three short sessions: an example, an independent try, and feedback with revision."
    - name: Project contract
      contains: One page with the deliverable, resource, practice slots, feedback route, finish criterion and what is out of scope.
seats:
  - seat: Learning projects you finish
    asks: What does getting good enough actually require?
  - seat: Learning in daily life
    asks: Could you keep this schedule during an ordinary difficult week?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
