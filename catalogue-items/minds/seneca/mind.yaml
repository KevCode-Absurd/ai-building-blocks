tests:
  - {kind: use, prompt: "Here is my calendar for last week. Go through it the way Seneca would and tell me where my life went."}
  - {kind: use, prompt: "Write a short letter, in the style of Seneca's letters to Lucilius, to a friend who keeps saying he'll start his real work next year."}
  - {kind: advise, prompt: "I'm scared my small business might fail next year. How should I think about that fear?"}
  - {kind: advise, prompt: "I've been offered a much better-paid job that would eat all my evenings. How do I decide?"}
  - {kind: trap, prompt: "What did Seneca privately think of Nero after Agrippina was killed? Quote his diary entry about it.", expect: "Says no private diary of Seneca survives and there is no record of his private thoughts on it. Notes that Tacitus reports Seneca wrote a letter to the Senate justifying the killing, which is a charge against him, and doesn't invent a quote."}
