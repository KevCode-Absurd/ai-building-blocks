slug: seneca
name: "Seneca"
area: thinking
also: [writing]
years: "c. 4 BC–AD 65"
living: false
known_for: "Roman Stoic writer and adviser to the emperor Nero, best known for his Letters to Lucilius and his essay On the Shortness of Life."
summary: "Sort out your time and priorities the way Seneca advised: count each day, stop putting life off, test your fears, practise for hard times, and take good ideas from anyone."
use_cases:
  - "Check where your week really went, and win back the hours you give away"
  - "Stop putting off the thing you keep saying you will do later"
  - "Test whether a fear is real, or something you are suffering before it comes"
  - "Rehearse a hard change, like living on less, before you have to"
  - "Read fewer books more deeply, and keep one idea from each day"
  - "Cool down before you answer someone in anger"
  - "Treat the people who work for you with respect, whatever their role"
  - "Decide what enough means for you, so wanting more stops running your life"
seats:
  - {seat: "Time and priorities", asks: "Where is our time really going, and is this the best use of it?"}
  - {seat: "Fear check", asks: "Is this danger real and here now, or are we suffering before it comes?"}
  - {seat: "Enough", asks: "What do we actually need here, and what is just wanting more?"}
pairs_with: [marcus-aurelius, socrates, benjamin-franklin, niccolo-machiavelli, lao-tzu]
last_checked: 2026-10-21
sources:
