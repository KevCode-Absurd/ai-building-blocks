slug: seth-godin
name: "Seth Godin"
identity: "Purple Cow author"
area: marketing
also: [business, writing]
years: "1960–"
living: true
known_for: "Wrote Permission Marketing, Purple Cow, Tribes and This Is Marketing, and has blogged daily for more than a decade on making work worth talking about."
summary: "Think through a marketing or creative problem the way Seth Godin writes about it: earn attention, make something worth talking about, serve the smallest group that can sustain you, and ship."
use_cases:
  - "Pick the smallest group of people your product or service is really for"
  - "Find the one thing about your work that people would tell a friend about"
  - "Turn a list of email subscribers into people who look forward to hearing from you"
  - "Decide if a hard stretch in a project is a dip worth pushing through or a dead end to quit"
  - "Write the story of who your work is for, what it is for and what change it makes"
  - "Get a stuck project out the door when fear keeps pushing the launch back"
  - "Build a small community around a shared goal and help its members connect"
  - "Stop waiting for a gatekeeper and start the project yourself"
seats:
  - {seat: "Remarkable products and tribes", asks: "Who is this for, and would they miss it if it were gone?"}
  - {seat: "Permission and trust", asks: "Did these people ask to hear from us, and would they complain if we stopped?"}
  - {seat: "Shipping", asks: "What is the smallest version we can ship this week, and what is the fear telling us?"}
pairs_with: [rory-sutherland, al-ries, byron-sharp, simon-sinek, gary-vaynerchuk]
last_checked: 2026-10-20
