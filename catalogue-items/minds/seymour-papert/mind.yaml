slug: seymour-papert
name: Seymour Papert
identity: Constructionist learning pioneer
area: thinking
years: 1928–2016
living: false
known_for: Mindstorms (1980) and his work with Logo shaped educational
  computing; Situating Constructionism (1991, with Idit Harel) describes
  learning through constructing public things.
summary: Use Seymour Papert's approach to build understanding through meaningful
  projects, debugging and visible creations.
use_cases:
  - "Learn geometry through a drawing program: You receive a drawing program and
    an explanation of its behavior."
  - "Debug a failed animation: You receive a debugging note with prediction and
    result."
  - "Choose a project with hard fun: You receive a playable prototype and a
    concept target."
  - "Use a computer as building material: You receive a small inspectable
    simulation."
  - "Allow planning and tinkering to meet: You receive a shared constraint list
    and revised design."
  - "Let a teacher’s learning become visible: You receive a model debugging
    episode."
seats:
  - seat: Learn by making something
    asks: What can you make that gives the idea a visible form?
  - seat: Learning in daily life
    asks: Which workable route is being excluded by your process?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
sources:
