{"slug": "sheila-heen", "name": "Sheila Heen", "identity": "Feedback author and teacher", "area": "thinking", "years": "", "living": true, "known_for": "Coauthored Thanks for the Feedback and Difficult Conversations and cofounded Triad Consulting Group.", "summary": "Understand feedback before accepting or rejecting it, untangle its emotional triggers and choose a specific change without losing your own judgment.", "use_cases": ["Ask for the kind of feedback you actually need", "Untangle your reaction to a difficult performance review", "Turn vague criticism into an observable change", "Discuss household feedback without switching to a counterattack", "Keep one criticism from becoming a verdict on your ability", "Request actionable feedback and test a small improvement"], not_for: ["You want help raising kids and talking with them calmly: use Becky Kennedy or Adele Faber.", "You need to handle fear, shame or being seen at work: use Brené Brown.", "You face an HR case, a legal dispute or a medical or money decision: talk to a qualified professional or read the policy that applies."], output_sample: {input: ["The feedback you got, in the words used if you can", Who said it and how you reacted, "What you want from the talk: praise, help to improve, or a verdict on where you stand", The decision or next step you face (optional)], output: [{name: Feedback-type and trigger map, contains: "Shows whether you need appreciation, coaching or evaluation, and whether content, relationship or identity is the hard part."}, {name: Clarifying questions, contains: Questions to ask the giver about what they saw and what better would look like.}, {name: Bounded restatement, contains: "The feedback restated in specific, limited words, apart from the story you added about yourself."}, {name: Relationship wording, contains: "Separate wording for any concern about the giver or the relationship, with an agreed order to discuss both."}, {name: Focused request, contains: One specific thing to