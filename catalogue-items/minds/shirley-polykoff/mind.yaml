slug: shirley-polykoff
name: "Shirley Polykoff"
area: marketing
also: [writing]
years: "1908–1998"
living: false
known_for: "Foote, Cone & Belding copywriter whose Clairol lines, from \"Does she... or doesn't she?\" to \"Is it true blondes have more fun?\", made home hair colour normal and became everyday phrases."
summary: "Write the line people repeat, the way Shirley Polykoff did for Clairol: find the private question your buyer is already asking, answer it with a promise they can keep to themselves, and say it in warm, playful, everyday words."
use_cases:
  - "Write a short line or slogan that people could repeat to a friend"
  - "Find the private worry or wish behind a purchase people feel shy about"
  - "Turn a product people hide using into one they feel free to try"
  - "Write a teasing question headline that invites the reader to imagine herself"
  - "Pick an image of an ordinary, likeable person instead of a glamour model"
  - "Keep a long campaign fresh with new lines on one big idea"
  - "Write warm, upbeat body copy that sounds like a friend talking"
  - "Use a trusted expert (the hairdresser, the mechanic) as quiet proof"
seats:
  - {seat: "The line people repeat", asks: "Would someone say this line out loud to a friend, and would it mean something to them?"}
  - {seat: "The private question", asks: "What is the buyer secretly asking herself, and does our line answer it?"}
  - {seat: "Aspiration with discretion", asks: "Does this let people become who they want to be without having to explain it?"}
pairs_with: [phyllis-k-robinson, helen-lansdowne-resor, mary-wells-lawrence, rosser-reeves, david-ogilvy]
last_checked: 2026-10-21
