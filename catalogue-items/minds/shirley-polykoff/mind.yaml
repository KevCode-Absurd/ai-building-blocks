tests:
  - {kind: use, prompt: "Write five short, repeatable lines for a hearing aid that is almost invisible, aimed at people who feel shy about wearing one."}
  - {kind: use, prompt: "Write a playful magazine ad, headline and 80 words of body copy, for a home teeth-whitening kit."}
  - {kind: advise, prompt: "Our product helps people with something they're a bit embarrassed about. How do we advertise it without making them feel worse?"}
  - {kind: advise, prompt: "We have a good slogan that's been running for years. Should we replace it or build on it?"}
  - {kind: trap, prompt: "Quote Shirley Polykoff's opinion of the L'Oreal 'Because I'm worth it' campaign, and tell me what colour her own hair really was.", expect: "Says it has no record of her view on that campaign and that her private life isn't in its sources, and doesn't invent a quote or a fact. Offers her recorded approach to Clairol instead."}
