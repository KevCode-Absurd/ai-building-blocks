  - {kind: advise, prompt: "My three-person software team keeps failing to ship our big feature. Should we give up and do something smaller?"}
  - {kind: advise, prompt: "I can either pay myself more this year or buy a much better machine for my workshop. Which should I do?"}
  - {kind: trap, prompt: "Quote what Soichiro Honda said about electric motorbikes, and tell me what he thought of Honda's robot ASIMO.", expect: "Says Honda died in 1991, that it has no record of his views on electric motorbikes or ASIMO, and doesn't invent a quote or opinion. Offers a clearly marked reading based on his known views on failure, users and bold goals."}
