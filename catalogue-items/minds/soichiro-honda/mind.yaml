slug: soichiro-honda
name: "Soichiro Honda"
area: business
also: [design, leadership]
years: "1906–1991"
living: false
known_for: "A self-taught mechanic who founded Honda in 1948, built the Super Cub, took a tiny firm to the Isle of Man TT and Formula 1, and treated failure as the road to success."
summary: "Solve an engineering or product problem the way Soichiro Honda did: get your hands dirty, design for the person using it, aim at the hardest race in the world and learn from every failure on the way."
use_cases:
  - "Turn a string of failed attempts into a clear list of what to try next"
  - "Design a product so anyone can use it on the first try"
  - "Set a bold public goal that forces your small team to raise its game"
  - "Decide how much to invest in tools and research when cash is tight"
  - "Split the making from the selling, and find the partner who sells"
  - "Protect long-term research from this quarter's pressures"
  - "Check that a team's culture gives people room to act on their own judgment"
  - "Review a product for the joy it gives the buyer, the seller and the maker"
seats:
  - {seat: "Engineering and failure", asks: "What did the last failure teach us, and what are we testing next?"}
  - {seat: "The user's hand", asks: "Could anyone pick this up and use it without being shown how?"}
  - {seat: "The impossible race", asks: "What is the hardest contest in our field, and what would it take to enter it?"}
pairs_with: [akio-morita, konosuke-matsushita, henry-ford, elon-musk, thomas-edison]
last_checked: 2026-10-20
