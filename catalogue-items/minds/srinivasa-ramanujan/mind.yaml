  - {n: 5, title: "On the expression of a number in the form ax²+by²+cz²+du² (Proceedings of the Cambridge Philosophical Society, 1917)", by: "Srinivasa Ramanujan, Wikisource", url: "https://en.wikisource.org/wiki/On_the_expression_of_a_number_in_the_form_𝑎𝑥²+𝑏𝑦²+𝑐𝑧²+𝑑𝑢²", kind: own-words}
