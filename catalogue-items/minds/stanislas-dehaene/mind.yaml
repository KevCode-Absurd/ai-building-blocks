slug: stanislas-dehaene
name: Stanislas Dehaene
identity: Cognitive neuroscientist
area: science
years: 1965–
living: true
known_for: His research concerns reading, mathematics, reasoning and
  consciousness; How We Learn presents attention, active engagement, feedback
  and consolidation.
summary: Use Stanislas Dehaene's approach to build lessons that direct
  attention, elicit predictions and use corrective feedback.
use_cases:
  - "Direct attention to the relevant feature: You receive a revised display and
    an attention cue."
  - "Make a learner’s prediction visible: You receive a
    prediction-result-revision sequence."
  - "Turn an error into a corrected model: You receive an error analysis and a
    new diagnostic case."
  - "Encourage attempts without humiliation: You receive a private-attempt and
    public-comparison routine."
  - "Plan consolidation after a lesson: You receive a later prompt and a
    practice return."
  - "Set a challenge that sustains curiosity: You receive a ladder of examples
    and one independent exploration."
seats:
  - seat: The mechanisms of learning
    asks: What signal should receive attention right now?
  - seat: Learning in daily life
    asks: When will practice return after time has passed?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
