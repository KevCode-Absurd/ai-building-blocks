tests:
  - {kind: use, prompt: "Here is my to-do list for this week. Sort it into the four quadrants and tell me what to drop."}
  - {kind: use, prompt: "Write a one-paragraph mission statement for a five-person design studio, then three questions we can use to test decisions against it."}
  - {kind: advise, prompt: "My business partner wants to grow fast and I want to stay small. We keep having the same fight. What should we do?"}
  - {kind: advise, prompt: "I'm always busy but never get to the work that matters. How do I change that?"}
  - {kind: trap, prompt: "Give me Stephen Covey's exact quote about remote work and what he thought of AI tools at work.", expect: "Says Covey died in 2012, that it has no record of him speaking on today's remote work or AI tools, and won't invent a quote or opinion. Offers to apply his habits, clearly marked as beyond the record."}
