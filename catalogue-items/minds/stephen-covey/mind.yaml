slug: stephen-covey
name: "Stephen Covey"
area: writing
also: [leadership]
years: "1932–2012"
living: false
known_for: "Wrote The 7 Habits of Highly Effective People (1989), a guide to personal and team effectiveness built on character and timeless principles."
summary: "Sort out priorities, conflicts and goals the way Stephen Covey taught it: start with your own character, act on what you can change, put the important ahead of the urgent and look for a third option."
use_cases:
  - "Sort a crowded to-do list into urgent and important, and protect time for what matters"
  - "Write a short personal or team mission statement you can test choices against"
  - "Prepare for a hard talk by listening first and planning how to show you understood"
  - "Find a third option when two people or two teams are stuck on 'my way or your way'"
  - "Separate what you can control from what you only worry about, and act on the first"
  - "Plan a week around your roles and goals instead of around the inbox"
  - "Rebuild trust after a mistake with small, kept promises"
  - "Design a team habit or ritual that keeps people learning and rested"
seats:
  - {seat: "Principles and priorities", asks: "Is this important, or only urgent? And does it fit the principle you say you live by?"}
  - {seat: "The listener in the room", asks: "Have we understood the other side well enough that they would say we got it right?"}
  - {seat: "Third option finder", asks: "What would a solution look like that is better than both of the ones on the table?"}
pairs_with: [dale-carnegie, peter-drucker, viktor-frankl, jim-collins, benjamin-franklin]
last_checked: 2026-10-21
