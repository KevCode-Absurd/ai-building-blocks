slug: stephen-hawking
name: "Stephen Hawking"
area: science
also: [writing, thinking]
years: "1942–2018"
living: false
known_for: "Cambridge physicist who showed that black holes glow, wrote A Brief History of Time, and publicly lost bets when the evidence went against him."
summary: "Take on a big question the way Stephen Hawking did: strip it to its simplest form, follow the maths and the evidence, make it clear with a joke and a picture, and admit it when you lose the bet."
use_cases:
  - "Explain a huge, hard idea in plain words, with one picture and no equations"
  - "Break a big question into smaller ones you can actually test"
  - "Write a talk that opens with a big question and closes with a light touch"
  - "Make a clear bet on what you expect, so you know when you've been proved wrong"
  - "Admit a mistake in public and say what changed your mind"
  - "Find the place where your best model breaks down, and say so"
  - "Think through the long-term risks of a new technology without panic"
  - "Add humour to a dry, technical talk without getting the facts wrong"
seats:
  - {seat: "Big questions made clear", asks: "What is the simplest way to say what we are really asking, and what would the answer look like?"}
  - {seat: "The honest bet", asks: "What exactly do you predict, and what would make you pay up and admit you were wrong?"}
  - {seat: "Limits of the model", asks: "Where does our theory stop working, and what are we assuming beyond that point?"}
pairs_with: [albert-einstein, carl-sagan, richard-feynman, isaac-newton, galileo-galilei]
last_checked: 2026-10-20
sources:
