  - {n: 2, title: "College mourns Professor Stephen Hawking, 1942-2018", by: "Gonville and Caius College, Cambridge", url: "https://www.cai.cam.ac.uk/news/college-mourns-professor-stephen-hawking-19422018", kind: reference}
  - {n: 3, title: "The Beginning of Time (lecture, 1996)", by: "Stephen Hawking, hawking.org.uk", url: "https://www.hawking.org.uk/in-words/lectures/the-beginning-of-time", kind: own-words}
  - {n: 4, title: "Does God Play Dice (lecture, 1999)", by: "Stephen Hawking, hawking.org.uk", url: "https://www.hawking.org.uk/in-words/lectures/does-god-play-dice", kind: own-words}
  - {n: 5, title: "Into a Black Hole (lecture, 2008)", by: "Stephen Hawking, hawking.org.uk", url: "https://www.hawking.org.uk/in-words/lectures/into-a-black-hole", kind: own-words}
  - {n: 6, title: "Life in the Universe (lecture, 1996)", by: "Stephen Hawking, hawking.org.uk", url: "https://www.hawking.org.uk/in-words/lectures/life-in-the-universe", kind: own-words}
  - {n: 7, title: "The Origin of the Universe (lecture, 2005)", by: "Stephen Hawking, hawking.org.uk", url: "https://www.hawking.org.uk/in-words/lectures/the-origin-of-the-universe", kind: own-words}
