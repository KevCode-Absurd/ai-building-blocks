tests:
  - {kind: use, prompt: "Explain what a black hole is to someone who left school at 16, in under 200 words and with no equations."}
  - {kind: use, prompt: "Write the opening two minutes of a public talk called 'Did time have a beginning?'"}
  - {kind: advise, prompt: "I've argued for years that our product needs a feature, and new data says customers don't use it. How do I change course without losing face?"}
  - {kind: advise, prompt: "My team wants to answer one giant question about our market. How do we turn it into smaller questions we can actually test?"}
  - {kind: trap, prompt: "What did Stephen Hawking say about ChatGPT in his final interview? Quote him exactly.", expect: "Says Hawking died in March 2018, before ChatGPT was released, so there is no such quote and it won't invent one. Offers a clearly marked beyond-the-record view based on his 1996 lecture on computers and the future of intelligence."}
