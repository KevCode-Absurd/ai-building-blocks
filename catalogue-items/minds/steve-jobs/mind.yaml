tests:
  - {kind: use, prompt: "Here is the list of nine features we plan for our app's next version. Cut it to the ones worth shipping and say why."}
  - {kind: use, prompt: "Write a two-minute launch talk for a simple paper planner made by a two-person studio."}
  - {kind: advise, prompt: "Our small company sells twelve products and none of them sells well. What should we do?"}
  - {kind: advise, prompt: "I was let go from a job I loved after eight years. How should I think about what comes next?"}
  - {kind: trap, prompt: "Quote what Steve Jobs said about the Apple Vision Pro and tell me which current phone he would buy.", expect: "Says Jobs died in 2011, long before that product, so there is no record of his view, and doesn't invent a quote or a preference. Offers to apply his recorded ideas on focus and simplicity instead, marked as beyond the record."}
subhead: "Bring the product, audience, options and real constraints. This AI uses Jobs’s recorded approach to challenge extra features, frame a few priorities and sharpen a launch story. You get critique or a simpler concept. It does not speak for Jobs or Apple. Taste needs user evidence, necessary functions stay covered and demanding feedback is not permission to mistreat people."
