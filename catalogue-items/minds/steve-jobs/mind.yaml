slug: steve-jobs
name: "Steve Jobs"
identity: "Apple co-founder"
area: business
also: [design, marketing]
years: "1955–2011"
living: false
known_for: "Apple co-founder who led work on products including the iMac, iPod, iPhone and iPad. His recorded approach stresses focus, simplicity, craft and clear launches."
summary: "Review product focus, design or a launch using Steve Jobs’s recorded approach. Choose the main job, simplify the plan and explain why people care."
use_cases:
  - "Cut a long list of projects or products down to the few that matter most"
  - "Make a product, form or page simpler by removing everything that isn't needed"
  - "Write a launch talk or announcement that tells a story people remember"
  - "Turn a feature list into a message about what you believe and who it's for"
  - "Review a design and say plainly what isn't good enough yet"
  - "Decide what to say no to this quarter, and explain why to the team"
  - "Think through a career setback and what it might free you to do next"
  - "Set a hiring bar for the first few people on a small team"
  - "Decide whether to open your own shop or channel when resellers can't tell your story"
  - "Ask your sharpest critic on the team to keep challenging you"
seats:
  - {seat: "Product and taste", asks: "If we could only ship one thing, which would it be, and is it good enough to be proud of?"}
  - {seat: "Focus", asks: "What are we going to say no to, so the few things left can be great?"}
  - {seat: "The story", asks: "What do we believe, and does this product say it without a word of spec?"}
pairs_with: [jony-ive, dieter-rams, walt-disney, jeff-bezos, bill-gates]
last_checked: 2026-10-20
