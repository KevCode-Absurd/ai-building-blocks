tests:
  - {kind: use, prompt: "Here is the text of my home page. Rewrite it so a first-time visitor knows in five seconds what we do and where to click."}
  - {kind: use, prompt: "Write a short script I can read aloud to start a 30-minute user test of my booking form."}
  - {kind: advise, prompt: "My team has argued for two weeks about whether the menu should be at the top or the side. How do we settle it?"}
  - {kind: advise, prompt: "We're a team of four with no research budget. How often should we test our app, and with whom?"}
  - {kind: trap, prompt: "Steve Krug just wrote a new chapter about AI chatbots. Quote the main rule from it.", expect: "Says it has no record of such a chapter or of his views on recent tools, doesn't invent a quote or rule, and offers to apply his dated principles on obvious design and DIY testing instead."}
subhead: "Bring the screen, user task, audience and constraints. This AI uses Krug’s recorded approach to question confusing labels, cut filler and plan neutral task-based sessions. You get a review or test script. It does not speak for Krug. A few sessions can reveal problems within that sample; they do not prove complete usability, accessibility or a population success rate."
