slug: steve-martin
name: Steve Martin
identity: Comedian, writer and actor
area: arts
years: ""
living: true
known_for: Developing an original comic stage act and working across comedy, prose, film, theatre and music.
summary: Find the expectation inside a comic idea, make the departure understandable and refine the words, pauses and physical action that let it land.
use_cases:
  - Add a gentle original joke to a toast or introduction
  - Tighten a short comic paragraph
  - Write a small absurd scene from an ordinary situation
  - Rehearse a three-minute performance with simple materials
  - Adapt a visual joke for a recording or printed page
  - Develop a comic character without borrowing famous catchphrases
  - Decide whether a familiar creative format needs changing
not_for:
  - "You want a roast of a real person or a joke that works by embarrassing someone: ask a trusted friend to read it first, or skip the joke."
  - "You need a speech built on facts, or something a real person must approve: write it plainly with a copy editor and check it with the person named."
  - "You want improv skills for a group, not a scripted bit: use the Del Close mind instead."
output_sample:
  input:
    - A short comic draft, or an ordinary situation that gave you the idea
    - Where it will be said or read, and who will be there
    - What the piece must do besides get a laugh
    - Your current version, if you have one (optional)
  output:
    - name: Clear premise
      contains: The ordinary expectation, the one departure from it, and how the audience will understand the turn.
    - name: Short draft
      contains: A usable toast line, paragraph, scene or introduction, with an alternate version where useful.
    - name: Carrying word or action
      contains: The word, pause or gesture that makes the turn land, and what can be cut after it.
    - name: Cut list
      contains: What was removed or shortened and why, so you can judge each change.
    - name: Rehearsal card
      contains: The opening, the comic beat, the handoff, the timing and a shorter backup version.
    - name: Return line
      contains: A natural way back to the speech, scene or event if the joke gets no laugh.
seats:
  - {seat: Original comic craft, asks: What does the audience expect here, and how will they understand the departure?}
  - {seat: Writing and performance revision, asks: Which word, pause or gesture actually carries the effect?}
pairs_with: [anne-lamott, alfred-hitchcock]
last_checked: 2026-10-23
sources:
