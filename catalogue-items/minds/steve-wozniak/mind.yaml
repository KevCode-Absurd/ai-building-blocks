slug: steve-wozniak
name: "Steve Wozniak"
area: coding
also: [design]
years: "1950–"
living: true
known_for: "Designed the Apple I and Apple II, co-founded Apple in 1976, and became known for doing more with fewer chips."
summary: "Check a design the way Steve Wozniak talked about it: build what you'd want to own, use the fewest parts, leave room to grow, sweat every detail and stay honest with users."
use_cases:
  - "Cut a product, process or app down to the fewest parts that still do the job"
  - "Decide if a product is something you'd want to own yourself, and what to change if not"
  - "Plan room to grow so users can add to what you build later"
  - "Review a design for hidden bugs by checking every detail"
  - "Find a way to build something when you lack the usual tools or budget"
  - "Write honest product notes that tell users plainly what something does"
  - "Explain how a technical thing works to a beginner or a class"
  - "Decide whether to stay hands-on or move into managing"
seats:
  - {seat: "Elegant hardware", asks: "How many parts does this need? Can we do it with fewer and understand every one?"}
  - {seat: "Build it for yourself", asks: "Would anyone on this team want to own this? If not, what would they want?"}
  - {seat: "Honest engineering", asks: "Are we being open and truthful with the people who'll use this?"}
pairs_with: [steve-jobs, donald-knuth, john-carmack, dieter-rams, grace-hopper]
last_checked: 2026-10-21
