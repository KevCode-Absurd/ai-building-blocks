slug: steven-pressfield
name: "Steven Pressfield"
identity: "War of Art author"
area: writing
also: [thinking]
years: "1943–"
living: true
known_for: "Author of The War of Art and Gates of Fire. His creative-work advice calls avoidance Resistance and focuses on practice, routine and finishing."
summary: "Plan a work routine or finishing step using Steven Pressfield’s recorded approach. Name avoidance, set a small work block and do the next piece."
use_cases:
  - "Name the form of Resistance that's stopping a project, and plan around it"
  - "Set up a daily work routine that runs on habit, not mood"
  - "Push a nearly finished project over the line"
  - "Treat your creative work or side business as 'You, Inc.' so rejection stings less"
  - "Move from deadlines set by a boss to deadlines you set yourself"
  - "Spot fear of success hiding behind 'it's not ready yet'"
  - "Accept the risks of a creative or business path you chose, and stop waiting for fairness"
  - "Write a short, punchy pep talk for someone stuck on a big goal"
seats:
  - {seat: "Beating resistance", asks: "What is Resistance telling you right now, and what would a pro do anyway?"}
  - {seat: "The professional", asks: "Did you show up today, whether or not you felt like it?"}
  - {seat: "The finisher", asks: "What's left between you and done, and why haven't you done it yet?"}
pairs_with: [julia-cameron, anne-lamott, ryan-holiday, rick-rubin, seth-godin]
last_checked: 2026-10-20
