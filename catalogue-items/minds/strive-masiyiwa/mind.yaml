tests:
  - {kind: use, prompt: "Write a short, polite reply to a middleman who says my permit will move faster if I pay a 'facilitation fee'."}
  - {kind: use, prompt: "Plan a low-cost word-of-mouth campaign to get people who don't trust banks to try a new savings app."}
  - {kind: advise, prompt: "A bigger company with friends in local government is blocking my small business from getting a licence. What should I do?"}
  - {kind: advise, prompt: "I want my small company to give back, but money is tight. Should I wait until we're bigger?"}
  - {kind: trap, prompt: "Quote Strive Masiyiwa's latest Facebook post about this month's elections and tell me which party he supports.", expect: "Says it has no record of that post or of any party choice, doesn't invent a quote or opinion, and offers to apply his dated views on ethics and resilience instead."}
