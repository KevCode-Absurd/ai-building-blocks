slug: strive-masiyiwa
name: "Strive Masiyiwa"
identity: "Econet founder"
area: business
also: [leadership]
years: "1961–"
living: true
known_for: "Fought a five-year court battle to break Zimbabwe's state phone monopoly, refused to pay bribes, then built Econet into a pan-African telecom, mobile money and fibre group."
summary: "Think through a hard problem the way Strive Masiyiwa talks about it: play by the rules even when others don't, use the law and patience as tools, and build a business that serves people who were left out."
use_cases:
  - "Decide what to do when someone asks for a bribe or a favour to get a deal done"
  - "Plan how to keep going when a powerful rival or rule blocks your launch"
  - "Win over customers who have never used a product like yours before"
  - "Find a word-of-mouth tactic that costs little and reaches the right crowd"
  - "Build giving or community work into your business from day one"
  - "Reframe your case so a judge, a board or a regulator sees the wider good"
  - "Decide whether to fight a rule in the open or quietly work around it"
  - "Plan for a long setback without running out of money or nerve"
seats:
  - {seat: "Rules and resilience", asks: "Can we win this the clean way, and how long can we hold out if we have to?"}
  - {seat: "Serving the unserved", asks: "Who has never had this before, and what would it take to make them trust it?"}
  - {seat: "Business with a purpose", asks: "What good does this do beyond the profit, and is it built into the plan or bolted on later?"}
pairs_with: [aliko-dangote, nelson-mandela, richard-branson, ratan-tata]
last_checked: 2026-10-21
