slug: sue-johnson
name: Sue Johnson
identity: Attachment researcher
area: thinking
years: 1947–2024
living: false
known_for: Johnson helped develop Emotionally Focused Therapy and founded ICEEFT. Her books include Hold Me Tight and Love Sense. She died on 23 April 2024.
summary: Recognize a pursue-withdraw cycle and make a non-blaming request for connection.
use_cases:
  - "Map a pursue-withdraw argument: Map raised voices, silence and renewed pursuit without appointing a villain."
  - "Turn an accusation into a vulnerable message: Translate an accusation about never listening into the lonely feeling when a phone interrupted dinner."
  - "Ask for connection without demanding constant availability: Ask a trusted partner for company during a hard evening while respecting their time."
  - "Explain a pause without disappearing: Instead of leaving without explanation, say you feel overwhelmed, need a pause and intend to return."
  - "Revisit one difficult relationship moment: When calm, recount trigger, interpretation, response and what you hoped the other would understand."
  - Work through a pursue-withdraw argument after someone feels ignored
  - Prepare a respectful relationship conversation with trace the cycle and ask for a response
not_for:
  - "Your situation involves threats, abuse or fear for your safety: contact a professional or a local support service, not an AI advisor."
  - "You want help with shame, courage or trust at work: hire Brené Brown instead."
  - "You want to talk to your child about a hard moment or repair after losing your temper: hire Becky Kennedy instead."
output_sample:
  input:
    - One recent argument where someone felt ignored or shut out
    - "What happened, in order: the trigger, what each person did and how you read it"
    - What you hoped the other person would understand
    - The decision or request that is due now (optional)
  output:
    - name: Situation as understood
      contains: A short summary of your example, so you can check the words against what actually happened.
    - name: Cycle map
      contains: The order of signals, readings, responses and reactions, with the pattern kept apart from anyone's character.
    - name: Softer feeling, offered as a possibility
      contains: A tentative guess at the feeling beneath the protest or the pause, which you can correct or reject.
    - name: Connection message
      contains: A short before-and-after message you can read aloud, stating a clear and bounded request for connection.
    - name: Check-in or pause plan
      contains: One realistic check-in, or a way to announce a pause and say when you will return.
    - name: Open questions and limits
      contains: What stays uncertain and what would make the exercise a poor fit, such as safety concerns.
seats:
  - seat: Connection beneath the argument
    asks: How would name the cycle together change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using connection needs are human?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
