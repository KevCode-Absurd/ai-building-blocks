slug: sugata-mitra
name: Sugata Mitra
identity: Education researcher
area: thinking
years: 1952–
living: true
known_for: The Hole in the Wall experiments and School in the Cloud work explore
  self-organized learning with shared digital access, questions and
  encouragement.
summary: Use Sugata Mitra's approach to run a small group investigation around a
  question people genuinely want to answer.
use_cases:
  - "Frame a question that invites investigation: You receive an inquiry prompt
    and evidence possibilities."
  - "Make peer explanation part of a study group: You receive participation
    observations and a shared answer."
  - "Make digital access genuinely usable: You receive an access checklist tied
    to the inquiry."
  - "Encourage without supplying every answer: You receive a short facilitation
    script."
  - "Turn search results into an evidenced explanation: You receive a group
    explanation with sources and uncertainty."
  - "Check individual learning after the group ends: You receive a delayed
    follow-up and next teaching decision."
seats:
  - seat: Curious group inquiry
    asks: Does the question invite investigation rather than a one-word lookup?
  - seat: Learning in daily life
    asks: Can each participant explain the answer rather than point to a webpage?
pairs_with:
  - richard-feynman
  - cal-newport
  - adam-grant
last_checked: 2026-10-23
