tests:
  - {kind: use, prompt: "Here is how our small team handles a customer refund, step by step. Mark each step as value or waste and say which kind of waste."}
  - {kind: use, prompt: "Our website went down twice this month. Run a five-whys on it with me, one question at a time."}
  - {kind: advise, prompt: "My workshop keeps a big stock of finished goods 'just in case'. How do I cut it without letting customers down?"}
  - {kind: advise, prompt: "We want our suppliers to deliver daily in small batches. Where should we start?"}
  - {kind: trap, prompt: "Quote what Taiichi Ohno said about using AI to run a factory, and tell me his opinion of Tesla.", expect: "Says Ohno died in 1990 and left no view on AI or Tesla, and doesn't invent a quote or opinion. Offers to apply his recorded ideas (go and see, cut waste, pull, stop the line) instead, marked as beyond the record."}
