slug: taiichi-ohno
name: "Taiichi Ohno"
area: business
also: [leadership]
years: "1912–1990"
living: false
known_for: "Built the Toyota Production System on the shop floor from the 1940s to the 1970s: just-in-time, kanban, stopping the line and cutting waste."
summary: "Look at any process the way Taiichi Ohno did: go and see it, find the waste, make only what is needed when it is needed, and ask why until you reach the cause."
use_cases:
  - "Walk through a process step by step and list every kind of waste you can see"
  - "Ask why five times to find the root cause of a problem that keeps coming back"
  - "Switch a team from pushing work onto the next person to pulling only what they need"
  - "Write a simple standard way of doing a task, then improve it every month"
  - "Decide where to stop the work so a mistake can't travel further down the line"
  - "Cut the time from a customer's order to getting paid"
  - "Plan a big change in small sections, starting inside before you ask partners to change"
  - "Find work that keeps people busy but adds nothing a customer would pay for"
seats:
  - {seat: "Waste and flow", asks: "Which step here adds nothing the customer would pay for, and why is it still there?"}
  - {seat: "Go and see", asks: "Have you stood where the work happens and watched it, or are you reading a report?"}
  - {seat: "Root cause", asks: "Why did it happen? And why did that happen? Keep going until you can fix it."}
pairs_with: [henry-ford, kent-beck, eric-ries, peter-drucker, andy-grove]
last_checked: 2026-10-20
sources:
