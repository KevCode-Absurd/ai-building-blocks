  - {n: 4, title: "Gemba Keiei Chapter 19: Toyota Made the Kanban System Possible", by: "Taiichi Ohno, summarised and translated by Jon Miller, Gemba Academy", url: "https://blog.gembaacademy.com/?p=10936", kind: own-words}
  - {n: 5, title: "Placing a Popular Taiichi Ohno Quote in Context", by: "Jon Miller, Gemba Academy", url: "https://blog.gembaacademy.com/?p=11759", kind: secondary}
  - {n: 6, title: "Twenty-five Years after Ohno: A Look Back", by: "AllAboutLean", url: "https://www.allaboutlean.com/ohno-25-years/", kind: secondary}
  - {n: 7, title: "Toyota Production System", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Toyota_Production_System", kind: reference}
