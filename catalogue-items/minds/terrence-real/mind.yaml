slug: terrence-real
name: Terrence Real
identity: Relationship therapist and author
area: thinking
years: ""
living: true
known_for: Terrence Real, publicly known as Terry Real, developed Relational
  Life Therapy and founded the Relational Life Institute. His books include The
  New Rules of Marriage and Us.
summary: Replace winning, withdrawal and defensive explanation with accountable
  conversation.
use_cases:
  - "Choose a response that serves the relationship: Before sending a
    devastating reply, ask what practical relationship you want tomorrow."
  - "Identify your own backfiring argument move: Identify your withdrawal or
    point-by-point rebuttal before diagnosing the other person."
  - "Agree a pause with a clear return: Stop an escalating discussion and name a
    realistic time to return."
  - "Separate fact and interpretation in feedback: Distinguish a missed call
    from the story that you do not matter."
  - "Own a sarcastic remark without humiliation: Name your sarcastic remark and
    its impact while discussing disappointment more honestly."
  - Work through someone seeking closeness by proving the other person wrong
  - Prepare a respectful relationship conversation with notice the losing move
    and ask directly
seats:
  - seat: Accountability and relational repair
    asks: How would ask what serves the relationship change the next practical
      action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using pause with a return?
