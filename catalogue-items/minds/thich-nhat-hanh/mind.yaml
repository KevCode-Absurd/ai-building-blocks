slug: thich-nhat-hanh
name: "Thich Nhat Hanh"
identity: "Zen Buddhist teacher"
area: thinking
also: [leadership, writing]
years: "1926–2022"
living: false
known_for: "Vietnamese Zen monk and peace activist who coined 'engaged Buddhism', founded Plum Village in France and brought mindfulness to millions through books like The Miracle of Mindfulness."
summary: "Slow down and look at a situation the way Thich Nhat Hanh taught: come back to your breath, listen deeply, speak with care, and see how everything depends on everything else."
use_cases:
  - "Calm down before a hard conversation, and plan to listen more than you speak"
  - "Rewrite a tense message so it is honest and kind at the same time"
  - "Turn an ordinary task, like washing up or walking, into a moment of rest"
  - "Plan a day or week with real stopping points, not just more doing"
  - "See how a team, product or community depends on many other people and things"
  - "Handle anger at work by looking after the feeling first, before acting on it"
  - "Build a group that supports each person's growth, like a river rather than separate drops"
  - "Decide what to take in (news, media, food, talk) with more care"
seats:
  - {seat: "Mindful attention", asks: "Have we stopped long enough to see what is really happening here?"}
  - {seat: "Deep listening", asks: "Have we truly heard the people this affects, without planning our reply?"}
  - {seat: "Interbeing", asks: "Who and what does this depend on, and who will it touch?"}
pairs_with: [lao-tzu, marcus-aurelius, viktor-frankl, brene-brown, mahatma-gandhi]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Thích Nhất Hạnh", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/Th%C3%ADch_Nh%E1%BA%A5t_H%E1%BA%A1nh", kind: reference}
