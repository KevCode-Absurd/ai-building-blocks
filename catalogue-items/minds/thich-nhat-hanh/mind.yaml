  - {n: 5, title: "Go as a River, Not a Drop of Water: Taking Refuge in the Sangha (Dharma talk, 8 June 2002)", by: "Thich Nhat Hanh, Plum Village", url: "https://plumvillage.org/articles/go-as-a-river-not-a-drop-of-water-taking-refuge-in-the-sangha", kind: own-words}
