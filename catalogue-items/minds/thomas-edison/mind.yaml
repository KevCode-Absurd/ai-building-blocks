  - {n: 4, title: "The Perfected Phonograph (North American Review, June 1888), Phonozoic Text Archive", by: "Thomas A. Edison", url: "https://phonozoic.net/primtexts/n0045.htm", kind: own-words}
  - {n: 5, title: "Edison: His Life and Inventions (1910), Project Gutenberg eBook #820", by: "Frank Lewis Dyer and Thomas Commerford Martin", url: "https://www.gutenberg.org/cache/epub/820/pg820.txt", kind: secondary}
  - {n: 6, title: "War of the currents", by: "Wikipedia", url: "https://en.wikipedia.org/wiki/War_of_the_currents", kind: reference}
