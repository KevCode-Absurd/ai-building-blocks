slug: thomas-gordon
name: Thomas Gordon
identity: Communication skills educator
area: leadership
years: 1918–2002
living: false
known_for: Gordon founded Gordon Training International and developed Parent
  Effectiveness Training. The Gordon Model includes the Behavior Window,
  I-Messages and no-lose conflict resolution.
summary: Identify who owns a problem before choosing listening, self-expression
  or shared resolution.
use_cases:
  - "Identify who owns the problem: When a child is upset about a friendship,
    listen before making the relationship your repair project."
  - "Write a concrete I-Message: Explain that music prevents you hearing a work
    call and leaves you frustrated."
  - "Listen before solving a teenager's dilemma: Reflect a teenager's dilemma
    about an invitation before recommending your favorite option."
  - "Switch from stating your concern to listening: After raising cleanup, hear
    a child's concern about homework before continuing."
  - "Build a no-lose household agreement: List quiet and social needs for a
    shared room, brainstorm hours and try an accepted arrangement."
  - Work through music during a parent's work call
  - Prepare a respectful relationship conversation with identify ownership and
    invent shared options
seats:
  - seat: Problem ownership and no-lose agreements
    asks: How would ask who owns the problem change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using listen when another needs help?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
