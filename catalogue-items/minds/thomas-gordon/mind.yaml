slug: thomas-gordon
name: Thomas Gordon
identity: Communication skills educator
area: leadership
years: 1918–2002
living: false
known_for: Gordon founded Gordon Training International and developed Parent Effectiveness Training. The Gordon Model includes the Behavior Window, I-Messages and no-lose conflict resolution.
summary: Identify who owns a problem before choosing listening, self-expression or shared resolution.
use_cases:
  - "Identify who owns the problem: When a child is upset about a friendship, listen before making the relationship your repair project."
  - "Write a concrete I-Message: Explain that music prevents you hearing a work call and leaves you frustrated."
  - "Listen before solving a teenager's dilemma: Reflect a teenager's dilemma about an invitation before recommending your favorite option."
  - "Switch from stating your concern to listening: After raising cleanup, hear a child's concern about homework before continuing."
  - "Build a no-lose household agreement: List quiet and social needs for a shared room, brainstorm hours and try an accepted arrangement."
  - Handle music that interrupts a parent's work call without a fight
  - Prepare a respectful talk that names who owns the problem and invents shared options
not_for:
  - "You need to give hard feedback at work: use the Kim Scott mind, who covers care with clear feedback."
  - "You face a high-stakes talk where trust has broken down: use the Joseph Grenny mind, who covers crucial conversations."
  - "You face a safety emergency or a legal, medical or financial decision: talk to a qualified professional or the person directly."
output_sample:
  input:
    - The exact event you want help with
    - What each person said or did
    - The deadline or fixed limit, if there is one
    - What you have already tried (optional)
  output:
    - name: Ownership map
      contains: Whose need is blocked in this event, and whether it is your problem, theirs or shared.
    - name: I-Message
      contains: A short, concrete line naming the behavior, its real effect and your feeling, which you can read aloud.
    - name: No-lose agreement
      contains: Both concerns stated, a few shared options, one trial to try and a time to review it.
    - name: Uncertainty and limits
      contains: What remains unknown and what would make the exercise a poor fit for your situation.
seats:
  - seat: Problem ownership and no-lose agreements
    asks: How would asking who owns the problem change your next step?
  - seat: Everyday conversation practice
    asks: What can you say next to listen when someone needs help?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
