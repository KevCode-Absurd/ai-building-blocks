slug: tibor-kalman
name: "Tibor Kalman"
area: design
also: [writing]
years: "1949–1999"
living: false
known_for: "Ran the New York studio M&Co, edited Benetton's Colors magazine, and pushed designers to act as citizens who question their clients and their own work."
summary: "Question a design, a brief or a client the way Tibor Kalman did: ask what the message is for, distrust safe professional polish, borrow from everyday life, and say the uncomfortable thing."
use_cases:
  - "Ask what a design or campaign is really for, beyond making it look good"
  - "Check whether a client or employer's product does harm, before you make it look appealing"
  - "Find a bold, unexpected idea when a brief is heading toward something safe and dull"
  - "Use ordinary, everyday images and signs to make a message feel honest"
  - "Plan a magazine, newsletter or report where the content leads and design amplifies it"
  - "Use a project you already have to say something about a cause you care about"
  - "Push back on a committee that is sanding the life out of an idea"
  - "Write a short, sharp manifesto for your team or studio"
seats:
  - {seat: "Breaking the rules", asks: "What's the safe, expected answer here, and what happens if we turn it upside down?"}
  - {seat: "Designer as citizen", asks: "What does this product actually do to people, and are we fine making it look good?"}
  - {seat: "Content over form", asks: "What are we really saying? The typeface comes second."}
pairs_with: [stefan-sagmeister, milton-glaser, michael-bierut, george-lois, bill-bernbach]
last_checked: 2026-10-20
sources:
  - {n: 1, title: "Reputations: Tibor Kalman (interview by Moira Cullen, Eye no. 20, 1996)", by: "Tibor Kalman and Moira Cullen, Eye", url: "https://eyemagazine.com/feature/article/reputations-tibor-kalman", kind: own-words}
