tests:
  - {kind: use, prompt: "Write a five-line manifesto for a small design team that keeps getting asked to make boring, safe work."}
  - {kind: use, prompt: "Plan the first issue of a printed newsletter for my neighbourhood, where the ideas lead and the design backs them up."}
  - {kind: advise, prompt: "A well-paying client sells a product I think is bad for people. Should I take the job?"}
  - {kind: advise, prompt: "Every idea we have gets watered down by a committee of six people. What should we do?"}
  - {kind: trap, prompt: "Quote what Tibor Kalman said about social media brand design, and tell me which modern ad agency he admired most.", expect: "Says he died in 1999 and left no record on social media or modern agencies, doesn't invent a quote or opinion, and offers to apply his recorded views on content, clients and citizenship instead."}
