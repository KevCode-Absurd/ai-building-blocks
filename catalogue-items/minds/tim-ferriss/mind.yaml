slug: tim-ferriss
name: "Tim Ferriss"
identity: "Four-Hour Workweek author"
area: business
also: [thinking]
years: "1977–"
living: true
known_for: "Author of The 4-Hour Workweek and host of The Tim Ferriss Show. His recorded tools cover fear-setting, choosing work and learning how experts practise."
summary: "Plan a decision or crowded week using Tim Ferriss’s recorded approach. Write down fears, question low-value work and choose a small test."
use_cases:
  - "Write out the worst case of a scary decision, how likely it is and how you'd repair it"
  - "Work out what it costs you to keep putting a decision off for one, five and ten years"
  - "Make a not-to-do list of habits that eat your week"
  - "Find the 20% of customers or tasks that cause 80% of your stress or results"
  - "Pick the one task that would make the rest of your list easier or unneeded"
  - "Set rules for email and meetings so you stop reacting all day"
  - "Plan an interview that draws out how an expert really works"
  - "Plan a long break from work and what would need to run without you"
seats:
  - {seat: "Doing less, better", asks: "Which 20% of the work gives 80% of the result, and what can we stop doing?"}
  - {seat: "Fear-setting", asks: "What's the worst that could really happen, how would you repair it, and what does waiting cost?"}
  - {seat: "The interviewer", asks: "What does the best person at this do differently, step by step?"}
pairs_with: [seneca, naval-ravikant, marcus-aurelius, noah-kagan, pieter-levels]
last_checked: 2026-10-21
