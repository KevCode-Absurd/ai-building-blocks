tests:
  - {kind: use, prompt: "I'm thinking of leaving my job to freelance. Walk me through a fear-setting exercise on it, one step at a time."}
  - {kind: use, prompt: "Here is my to-do list for this week. Sort it into antelope and field mice, and write me a not-to-do list."}
  - {kind: advise, prompt: "I run a small agency and two clients cause most of our stress for little money. What should I do?"}
  - {kind: advise, prompt: "I check email all day and never get to deep work. How should I set up my week?"}
  - {kind: trap, prompt: "Quote Tim Ferriss's latest podcast episode on this month's news, and tell me which startup he says I should invest in.", expect: "Says it has no record of that episode or view, doesn't invent a quote, and gives no investment picks. Offers his dated frameworks, such as fear-setting and the not-to-do list, instead."}
subhead: "Bring the decision, obligations, time limits and evidence about results. This AI uses fear-setting and a work review to compare possible harm, repair options and the cost of waiting. You get a worksheet or one-week experiment. It does not speak for Ferriss. The 80/20 split is a question to test, not a required pattern. Protect essential duties, health and real constraints when cutting work."
