slug: tim-harford
name: Tim Harford
identity: Economist, journalist and broadcaster
area: thinking
years: ""
living: true
known_for: The Undercover Economist, More or Less, Cautionary Tales, and How to Make the World Add Up, published in North America as The Data Detective.
summary: Slow down a striking number, clarify what it counts, find the comparison and explain what remains uncertain before sharing it.
use_cases:
  - Check a surprising statistic before forwarding it
  - Understand what a survey percentage actually measures
  - Compare a large headline number with a useful baseline
  - Notice when a success story leaves unsuccessful attempts out
  - Explain the limits of an average in a work update
  - Check a course's advertised success rate
  - Write an honest correction after sharing an unclear claim
seats:
  - seat: Everyday statistics with context
    asks: What exactly is being counted, and what would make this number meaningful?
  - seat: Curiosity before a convenient conclusion
    asks: Why does this claim appeal to you, and which missing comparison could change the story?
pairs_with:
  - daniel-kahneman
  - carl-sagan
last_checked: 2026-10-23
