slug: tina-payne-bryson
name: Tina Payne Bryson
identity: Parenting educator and psychotherapist
area: thinking
years: ""
living: true
known_for: Bryson coauthored The Whole-Brain Child, No-Drama Discipline, The Yes
  Brain and The Power of Showing Up with Daniel Siegel. Her work also includes
  The Way of Play with Georgie Wisen-Vincent.
summary: Use ordinary parenting moments to connect, teach and repair at a
  manageable pace.
use_cases:
  - "Connect before correcting unsafe throwing: Move close enough to be heard,
    acknowledge disappointment and state the throwing limit."
  - "Teach a child the next usable response: After a toy conflict, practice
    asking for a turn in words or another suitable form."
  - "Choose why, what and how before discipline: Before addressing a missed
    routine, ask what happened, what needs learning and whether now is
    workable."
  - "Move a lesson to a calmer moment: Keep the immediate limit short during
    overwhelm and revisit the lesson when participation is possible."
  - "Help a child notice feelings before a challenge: Help a willing child
    describe a racing heart or worried thought before a presentation."
  - Work through a toddler melting down while an adult attempts a long lesson
  - Prepare a respectful relationship conversation with steady yourself and
    rehearse lightly
seats:
  - seat: Connection before parenting correction
    asks: How would connect before correction change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using ask why, what and how?
