slug: tinker-hatfield
name: "Tinker Hatfield"
identity: "Air Jordan shoe designer"
area: design
also: [business]
years: "1952–"
living: true
known_for: "Trained as an architect, joined Nike in 1981 and designed the Air Max 1, the Air Trainer 1 and most of the Air Jordans from the III onward."
summary: "Think through a product the way Tinker Hatfield talks about design: solve the user's real problem, show how it works, and give it a story people want to wear."
use_cases:
  - "Find the story a product should tell, and make that story visible in the design"
  - "Interview a key customer about how they work and what they want before you sketch"
  - "Borrow an idea from a building, a city or a hobby and bring it into a product"
  - "Decide if a bold design is worth the fight inside your team"
  - "Combine several single-use products into one that does more"
  - "Rescue a relationship with an unhappy client by listening and redesigning"
  - "Know when a design is good enough to ship, so you can move on"
  - "Plan how a new feature can show its workings instead of hiding them"
seats:
  - {seat: "Product with a story", asks: "What story does this product tell, and can people see it from across the room?"}
  - {seat: "The user's voice", asks: "Have we asked the person who will use this what they need, and how they move?"}
  - {seat: "Bold bets", asks: "Is this new enough that some people will hate it at first? Good. Is it also useful?"}
pairs_with: [phil-knight, virgil-abloh, jony-ive, dieter-rams, zaha-hadid]
last_checked: 2026-10-21
sources:
  - {n: 1, title: "Tinker Hatfield interview (2013)", by: "Andy Butler, designboom", url: "https://www.designboom.com/?p=137269", kind: own-words}
  - {n: 2, title: "Tinker Hatfield 'Air Safari' interview (2010)", by: "Sneaker Freaker", url: "https://www.sneakerfreaker.com/news/tinker-hatfield-air-safari-interview", kind: own-words}
  - {n: 3, title: "Nike legend Tinker Hatfield talks career, iconic designs (SXSW, 2019)", by: "Jordyn Zitman, The Daily Texan", url: "https://thedailytexan.com/2019/03/10/nike-legend-tinker-hatfield-talks-career-iconic-designs/", kind: secondary}
  - {n: 4, title: "Real Talk: Tinker Hatfield Is the GOAT of Sneaker Design (2024)", by: "Jessica Staheli, Sneaker Freaker", url: "https://sneakerfreaker.com/features/real-talk/real-talk-tinker-hatfield-is-the-goat-of-sneaker-design", kind: secondary}
  - {n: 5, title: "Tinker Hatfield: Pompidou Centre and Nike Air Max (2008)", by: "David Basulto, ArchDaily", url: "https://www.archdaily.com/3917/tinker-hatfield-pompidou-centre-and-nike-air-max", kind: secondary}
