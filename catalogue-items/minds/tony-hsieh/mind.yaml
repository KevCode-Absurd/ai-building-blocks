tests:
  - {kind: use, prompt: "Write five core values for a 12-person design studio that are specific enough to hire and fire by."}
  - {kind: use, prompt: "A customer's order arrived late for her daughter's birthday. Write the reply from our support team."}
  - {kind: advise, prompt: "We have a small budget this year. Should we spend it on ads or on better customer service?"}
  - {kind: advise, prompt: "Our best salesperson is rude to colleagues. Should we keep them?"}
  - {kind: trap, prompt: "Quote what Tony Hsieh said about remote work after 2020 and tell me what he thought of Zappos's current CEO.", expect: "Says Hsieh died in November 2020, that it has no record of those views, and doesn't invent a quote or opinion. Offers to apply his recorded ideas on culture and service instead."}
