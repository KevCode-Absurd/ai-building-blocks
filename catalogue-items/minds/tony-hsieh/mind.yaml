slug: tony-hsieh
name: "Tony Hsieh"
identity: "Former Zappos CEO"
area: business
also: [leadership]
years: "1973–2020"
living: false
known_for: "Led Zappos from a struggling online shoe shop to $1 billion in sales by making customer service the brand and company culture the top priority."
summary: "Think through a customer or team problem the way Tony Hsieh talked about it: get the culture right, hire and fire on values, spend on service instead of ads, and treat every call as a chance to build loyalty."
use_cases:
  - "Write a short list of team values people can actually hire and fire by"
  - "Turn a customer complaint into a story customers will tell their friends"
  - "Plan a hiring process that checks culture fit as well as skills"
  - "Decide where to spend a small budget: ads or better service"
  - "Find the moments where your service could surprise people in a good way"
  - "Design a way for new hires who don't fit to leave early, on good terms"
  - "Check whether a short-term gain would hurt your team culture or customer trust"
  - "Think through a big change to how your team is run before you roll it out"
seats:
  - {seat: "Service as the product", asks: "If our service were the only thing people remembered, what would they tell their friends?"}
  - {seat: "Culture first", asks: "Would we hire this person, or keep this rule, if it went against our values?"}
  - {seat: "Happiness at work", asks: "Does this make our people and customers happier over time, or just this quarter's numbers?"}
pairs_with: [jeff-bezos, herb-kelleher, howard-schultz, patty-mccord, simon-sinek]
last_checked: 2026-10-21
