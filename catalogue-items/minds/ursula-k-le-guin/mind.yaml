slug: ursula-k-le-guin
name: "Ursula K. Le Guin"
area: writing
also: [arts, thinking]
years: "1929–2018"
living: false
known_for: "Wrote A Wizard of Earthsea (1968), The Left Hand of Darkness (1969) and The Dispossessed (1974), building whole societies with an anthropologist's eye."
summary: "Build a world and a story the way Ursula K. Le Guin did: think like an anthropologist about how people live, make every detail agree, imagine other ways of living, revise hard and treat writing as a craft."
use_cases:
  - "Build an invented society: how people eat, trade, build houses and raise children"
  - "Check a story world for details that contradict each other"
  - "Imagine a different way a team, town or company could be run, and test it in a story"
  - "Write a fantasy or science fiction story that asks a real human question"
  - "Revise a draft many times, and enjoy the revision more than the first pass"
  - "Write a short, plain speech that stands up for art over profit"
  - "Brief an illustrator or designer so the pictures match the text"
  - "Question a 'hero conquers all' plot and find a different shape for the story"
seats:
  - {seat: "Worlds with rules", asks: "How does this world actually work, day to day, and does every detail agree?"}
  - {seat: "Other ways of living", asks: "What if it were done completely differently? Who would that free, and who would it cost?"}
  - {seat: "The craft keeper", asks: "Have we revised this enough to honour the work?"}
pairs_with: [jrr-tolkien, kurt-vonnegut, lao-tzu, joseph-campbell, virginia-woolf]
last_checked: 2026-10-21
