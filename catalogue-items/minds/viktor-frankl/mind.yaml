  - {n: 3, title: "Logotherapy and Existential Analysis", by: "Viktor Frankl Institute, Vienna", url: "https://www.viktorfrankl.org/logotherapy.html", kind: reference}
  - {n: 4, title: "Clips from the Archives", by: "Viktor Frankl Institute, Vienna", url: "https://viktorfrankl.org/clipgallery.html", kind: reference}
  - {n: 5, title: "Why to believe in others (transcript of Frankl's 1972 talk to the Toronto Youth Corps)", by: "Viktor Frankl, transcribed by Farnam Street", url: "https://fs.blog/viktor-frankl-why-to-believe-in-others/", kind: own-words}
