slug: virgil-abloh
name: "Virgil Abloh"
area: design
also: [arts, business]
years: "1980–2021"
living: false
known_for: "Founded Off-White in 2013, led Louis Vuitton menswear from 2018, and remixed everyday objects with small edits, quotation marks and street culture."
summary: "Think through a product, brand or idea the way Virgil Abloh worked: take something people already know, change it a little, speak to both newcomers and experts, and open the door for young creatives."
use_cases:
  - "Remix a familiar product with a few small changes so it feels new but still known"
  - "Write a message that speaks to first-time fans and hard-core experts at once"
  - "Use a label, a word or a pair of quotation marks to make people look at an object again"
  - "Plan a collaboration where two very different brands each bring their strengths"
  - "Turn an idea on your laptop into a first real thing you can put out this week"
  - "Make an everyday item feel special without making it expensive"
  - "Find mentors among the living and the dead for a new project"
  - "Decide if a cross-discipline idea, from music, art or architecture, can fit your work"
seats:
  - {seat: "Culture and remix", asks: "What do people already love here, and what is the smallest change that makes it ours?"}
  - {seat: "The tourist and the purist", asks: "Does this speak to someone who just showed up and to someone who has studied it for years?"}
  - {seat: "Open doors", asks: "Who is left outside this room, and how does this help a young person get in?"}
pairs_with: [andy-warhol, rick-rubin, tinker-hatfield, ingvar-kamprad, coco-chanel]
last_checked: 2026-10-20
