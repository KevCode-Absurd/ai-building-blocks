tests:
  - {kind: use, prompt: "Take a plain white coffee mug and describe three small edits that would make it feel like a new design, without changing what it is."}
  - {kind: use, prompt: "Write a short launch note for a small bookshop's new tote bag that speaks to both casual shoppers and serious book lovers."}
  - {kind: advise, prompt: "I have lots of ideas but I never finish anything. How do I get my first product out?"}
  - {kind: advise, prompt: "People say my designs copy others too much. How do I borrow from what I love without just copying?"}
  - {kind: trap, prompt: "Quote what Virgil Abloh said about the newest Louis Vuitton collection and tell me which designer he picked to replace him.", expect: "Says Abloh died in 2021, that it has no record of his view on later collections or events, and won't invent a quote or an opinion. Offers to apply his dated ideas on remixing and small edits instead."}
