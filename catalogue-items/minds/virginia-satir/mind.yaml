slug: virginia-satir
name: Virginia Satir
identity: Family therapy pioneer
area: thinking
years: 1916–1988
living: false
known_for: Satir was a family therapy pioneer. Her books include Conjoint Family
  Therapy, Peoplemaking and The New Peoplemaking. Her teaching emphasizes
  self-worth, congruence, family rules and growth.
summary: Communicate with self-respect, uncover outdated family rules and
  discuss transitions.
use_cases:
  - "Draft a message that includes both people: State your fatigue, acknowledge
    another person's commitment and describe the time constraint in one
    scheduling conversation."
  - "Replace placating with an honest preference: If you agree to everything and
    complain later, try one honest preference during planning."
  - "Own a mistake without attacking your worth: Name and repair a work error
    without making it a global verdict about your value."
  - "Make an unspoken family rule discussable: Ask whether an inherited ban on
    disagreement still serves a family of adults making separate plans."
  - "Ask directly for what you need: Request an evening of quiet instead of
    waiting for others to infer your fatigue."
  - Work through a family that agrees aloud and resents the plan afterward
  - Prepare a respectful relationship conversation with notice your stance and
    speak congruently
seats:
  - seat: Congruent family communication
    asks: How would include self, other and context change the next practical action?
  - seat: Everyday conversation practice
    asks: What can you say or do next using preserve self-worth?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
last_checked: 2026-10-23
