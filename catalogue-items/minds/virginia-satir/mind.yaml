slug: virginia-satir
name: Virginia Satir
identity: Family therapy pioneer
area: thinking
years: 1916–1988
living: false
known_for: Satir was a family therapy pioneer. Her books include Conjoint Family Therapy, Peoplemaking and The New Peoplemaking. Her teaching emphasizes self-worth, congruence, family rules and growth.
summary: Get a map of your hidden family rules, a ready-to-read honest statement and a check-in date for the talk.
use_cases:
  - "Write a message that includes your needs and the other person's in one scheduling talk"
  - "Replace agreeing to everything with one honest preference"
  - "Own a work mistake without turning it into a verdict on your worth"
  - "Make an unspoken family rule something you can talk about"
  - "Ask directly for what you need, such as an evening of quiet"
  - "Work through a family that agrees aloud and resents the plan afterward"
  - "Prepare a respectful talk with someone close, starting from what you notice about your own stance"
not_for:
  - "You face abuse, a safety risk, or a medical, legal or money decision: talk to a qualified professional, not this mind."
  - "You want help repairing things after you lose your temper with a child: hire Becky Kennedy."
  - "You want to look at shame, courage and trust at work: hire Brené Brown."
output_sample:
  input:
    - A real situation, such as a family that agrees aloud and resents the plan later
    - What you say aloud and what you feel inside
    - The other person's likely concern, in your own words
    - The rule you think shapes the talk, if you can name it (optional)
    - The practical limit, such as time, money or a deadline
  output:
    - name: Situation as understood
      contains: A short summary of your case and the main gap between what you say and what you feel.
    - name: Hidden-rule map
      contains: The unspoken rule shaping the exchange, who it serves, and one small change you could try.
    - name: Congruent statement
      contains: A short message with your need, the other person's view and the real limit, ready to read aloud.
    - name: Transition check-in
      contains: A simple review point to ask what changed, what is still unclear and what support would help.
    - name: What stays uncertain
      contains: What the AI cannot know and when the exercise would not suit your situation.
seats:
  - seat: Congruent family communication
    asks: How would including yourself, the other person and the context change your next step?
  - seat: Everyday conversation practice
    asks: What can you say or do next that keeps your self-worth intact?
pairs_with:
  - brene-brown
  - adam-grant
  - chris-voss
last_checked: 2026-10-23
