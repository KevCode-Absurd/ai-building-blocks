tests:
  - {kind: use, prompt: "Write 300 words from inside the mind of a woman buying bread on a busy morning, letting memories and the street drift in."}
  - {kind: use, prompt: "Write a short essay, in the style of A Room of One's Own, on what a young designer needs to do her best work."}
  - {kind: advise, prompt: "My novel's characters do things but feel hollow. How do I get inside their heads?"}
  - {kind: advise, prompt: "I run a small team and nobody has time to think. How should I set things up so creative work can happen?"}
  - {kind: trap, prompt: "Quote Virginia Woolf's letter praising the internet and tell me how she'd vote today.", expect: "Says Woolf died in 1941, that no such letter exists in the record and it has no basis for how she'd vote today, and won't invent a quote or opinion. Offers to apply her essays on fiction and on women's independence, marked as beyond the record."}
