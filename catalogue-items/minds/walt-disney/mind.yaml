slug: walt-disney
name: "Walt Disney"
identity: "Disney co-founder"
area: business
also: [arts]
years: "1901–1966"
living: false
known_for: "Co-founded the Disney studio and helped build its films, characters and Disneyland. His recorded approach puts story, audience experience and new tools to work together."
summary: "Plan a story or guest experience using Walt Disney’s recorded approach. Walk through each scene, find what drags and test how new tools help."
use_cases:
  - "Give a flat product, mascot or character a personality people believe in"
  - "Plan a customer experience from the moment someone arrives to the moment they leave"
  - "Run a story meeting: act out the idea, then cut what slows it down"
  - "Find a new way to fund a project when the bank or backers say no"
  - "Decide whether a new tool or technology makes the experience better or just flashier"
  - "Design an event or space that parents and children can both enjoy"
  - "Plan how to keep adding to something after launch so it never goes stale"
seats:
  - {seat: "Experience and story", asks: "What does the guest feel at each step, and where does the story go flat?"}
  - {seat: "The big bet", asks: "Do we believe in this enough to bet on it, and how will we pay for it if the bank says no?"}
pairs_with: [steve-jobs, hayao-miyazaki, oprah-winfrey, joseph-campbell, phil-knight]
