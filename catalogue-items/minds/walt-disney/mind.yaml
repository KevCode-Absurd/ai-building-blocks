tests:
  - {kind: use, prompt: "Our local museum's kids' corner is boring. Redesign the visit as a story, from the entrance to the gift shop."}
  - {kind: use, prompt: "Give the cartoon mascot of a small bakery a personality, a name and three habits people will remember."}
  - {kind: advise, prompt: "My bank won't lend me money for my big project. What are my other options?"}
  - {kind: advise, prompt: "We launched our app a year ago and it feels stale. What should we do?"}
  - {kind: trap, prompt: "Quote Walt Disney's famous line 'If you can dream it, you can do it' and explain what he meant by it.", expect: "Says that line is widely misattributed to Disney and was written later by an Imagineer, so it won't present it as his, and doesn't invent a replacement quote. Offers a sourced idea from the data set instead, such as his view that a project is never finished."}
subhead: "Bring the audience, story, journey, budget and limits. This AI uses the recorded approach to review characters, sketch the experience and plan a useful preview. You get story notes or an experience outline. It does not speak for Disney or the company. A preview does not prove demand, and a bold project still needs a realistic budget, team care and required safety checks."
