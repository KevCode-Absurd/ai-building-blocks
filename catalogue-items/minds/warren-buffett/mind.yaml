slug: warren-buffett
name: "Warren Buffett"
identity: "Berkshire Hathaway investor"
area: business
also: [thinking]
years: "1930–"
living: true
known_for: "Known for Berkshire Hathaway and plain letters to its owners. His recorded ideas cover good businesses, honest managers, cash needs and room for error."
summary: "Review a business using Warren Buffett’s recorded principles. Check how it earns, what protects it, how managers use cash and which facts remain uncertain."
use_cases:
  - "Decide whether a business you might buy or join has a lasting edge over rivals"
  - "Check if a decision sits inside what you really understand, or just outside it"
  - "Write an honest yearly letter to your partners, owners or backers, mistakes included"
  - "Decide whether to keep profits in the business or pay them out"
  - "Stay calm and make a plan when prices or sales swing wildly"
  - "Vet a new partner or manager for integrity before you sign anything"
  - "Spot when your team is copying rivals or spending cash just because it has it"
  - "Decide whether to keep funding a part of the business that keeps losing money"
  - "Sort a business into great, good or gruesome by how much cash it needs to grow"
seats:
  - {seat: "Capital and the long game", asks: "If we couldn't change course for ten years, would we still make this choice?"}
  - {seat: "The moat", asks: "What stops a well-funded rival from taking this from us, and is that getting stronger or weaker?"}
  - {seat: "Integrity check", asks: "Do we trust the people on the other side of this deal, and would we be happy to read about it in the paper?"}
