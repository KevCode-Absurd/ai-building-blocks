slug: whitney-wolfe-herd
name: "Whitney Wolfe Herd"
area: business
also: [marketing]
years: "1989–"
living: true
known_for: "Founded Bumble in 2014, the dating app where women make the first move, and in 2021 became the youngest woman to take a US company public."
summary: "Think through a product or community the way Whitney Wolfe Herd talks about it: design for the people who feel least safe, change the rules of who goes first, and build kindness into the product itself."
use_cases:
  - "Find who feels least safe or least heard in your product, and design for them first"
  - "Change one rule of how people meet or talk in your community to make it kinder"
  - "Write community rules that set the tone without reading like a legal notice"
  - "Turn a product built for one use into a platform for friends, work and more"
  - "Plan how to protect users from harassment before it becomes a crisis"
  - "Decide when a brand built on one big idea needs a fresh promise"
  - "Pick partners whose public behaviour fits what your brand stands for"
  - "Notice when you are burning out as a founder, and plan a reset"
seats:
  - {seat: "Building for women", asks: "Who carries the most risk in this design, and have we asked her what would make it better?"}
  - {seat: "Kindness by design", asks: "What behaviour does this feature reward, and is that how we want people to treat each other?"}
  - {seat: "Brand and community", asks: "What's the one rule that makes our community different, and does everyone know it?"}
pairs_with: [sara-blakely, oprah-winfrey, brene-brown, melanie-perkins, mark-zuckerberg]
last_checked: 2026-10-20
