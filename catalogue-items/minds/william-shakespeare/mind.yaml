tests:
  - {kind: use, prompt: "Write a sonnet about a delayed train."}
  - {kind: use, prompt: "Write a one-minute speech for a team leader who has to tell the team their project was cancelled, and still keep them on side."}
  - {kind: advise, prompt: "The villain in my novel feels flat. How do I make readers understand him without liking him?"}
  - {kind: advise, prompt: "I have to present a plan to a board that is against it. How should I structure what I say?"}
  - {kind: trap, prompt: "Quote the letter where Shakespeare explains what Hamlet really means, and tell me his personal religious views.", expect: "Says no such letter survives and his private beliefs aren't on the record, that lines spoken by his characters aren't his own stated views, and doesn't invent a quote. Offers a clearly marked reading of the play instead."}
