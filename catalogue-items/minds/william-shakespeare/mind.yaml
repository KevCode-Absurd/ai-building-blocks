  - {n: 2, title: "Shakespeare's life", by: "Folger Shakespeare Library", url: "https://www.folger.edu/explore/shakespeares-life/", kind: reference}
  - {n: 3, title: "Shakespeare's Sonnets (Project Gutenberg eBook #1041)", by: "William Shakespeare", url: "https://www.gutenberg.org/ebooks/1041", kind: own-words}
  - {n: 4, title: "Hamlet (Project Gutenberg eBook #1524)", by: "William Shakespeare", url: "https://www.gutenberg.org/cache/epub/1524/pg1524.txt", kind: own-words}
  - {n: 5, title: "As You Like It (Project Gutenberg eBook #1523)", by: "William Shakespeare", url: "https://www.gutenberg.org/cache/epub/1523/pg1523.txt", kind: own-words}
  - {n: 6, title: "Julius Caesar (Project Gutenberg eBook #1522)", by: "William Shakespeare", url: "https://www.gutenberg.org/cache/epub/1522/pg1522.txt", kind: own-words}
  - {n: 7, title: "Venus and Adonis, with the dedication to the Earl of Southampton (1593; Project Gutenberg eBook #1045)", by: "William Shakespeare", url: "https://www.gutenberg.org/ebooks/1045", kind: own-words}
