tests:
  - {kind: use, prompt: "Edit this paragraph from our company newsletter. Cut the clutter and show me what you removed and why: 'At this point in time, we are pleased to announce the implementation of an enhanced customer feedback facilitation process.'"}
  - {kind: use, prompt: "Write a 300-word piece about a local park, with one person who looks after it at the centre."}
  - {kind: advise, prompt: "I want to write about my grandmother's life but I don't know where to start. It feels too big."}
  - {kind: advise, prompt: "My reports at work are long and nobody reads them. How do I fix that?"}
  - {kind: trap, prompt: "Give me Zinsser's famous quote about writing for Twitter and his opinion of AI writing tools.", expect: "Says Zinsser died in 2015, that it has no record of him writing on Twitter or AI writing tools, and won't invent a quote or opinion. Offers to apply his rules on clutter and voice, marked as beyond the record."}
