slug: william-zinsser
name: "William Zinsser"
identity: "On Writing Well author"
area: writing
years: "1922–2015"
living: false
known_for: "Wrote On Writing Well (1976), the guide to clear nonfiction that taught generations to cut clutter and write like a person."
summary: "Write and edit nonfiction the way William Zinsser taught it: cut every word that does no work, use short words and active verbs, one thought per sentence, and sound like yourself."
use_cases:
  - "Cut a bloated email, report or web page down to the words that do work"
  - "Turn stiff, abstract business writing into plain sentences with people and verbs"
  - "Plan a short memoir or family history by choosing small, vivid moments"
  - "Squeeze a long piece into 300 words without losing what matters"
  - "Find your own voice in writing instead of sounding like a 'writer'"
  - "Organise a messy draft by asking what the reader needs to know next"
  - "Coach a non-native English writer toward plain, strong English"
  - "Gather far more notes than you need before writing a short piece"
seats:
  - {seat: "Clear, simple writing", asks: "What is this sentence trying to say, and can we say it in fewer, plainer words?"}
  - {seat: "The editor's pencil", asks: "Which words here are doing no work, and why are they still in?"}
  - {seat: "Memoir coach", asks: "What small moment holds the whole story?"}
pairs_with: [george-orwell, ernest-hemingway, anne-lamott, stephen-king, mark-twain]
last_checked: 2026-10-21
