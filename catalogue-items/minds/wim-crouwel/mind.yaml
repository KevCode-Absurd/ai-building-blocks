slug: wim-crouwel
name: "Wim Crouwel"
identity: "Dutch grid design pioneer"
area: design
also: [arts]
years: "1928–2019"
living: false
known_for: "Dutch designer known for grid-based museum graphics and the New Alphabet typeface. His recorded approach uses clear structure, few type rules and the limits of each medium."
summary: "Plan a shared layout system using Wim Crouwel’s recorded approach. Set the grid, choose type rules and check how each piece serves its reader."
use_cases:
  - "Set up one grid that every poster, flyer or page in a series can share"
  - "Pick one typeface family and a few rules so a whole series looks like one voice"
  - "Strip a design back to what the message needs, with no decoration"
  - "Let the content of an event or product, not a stock picture, shape the layout"
  - "Design a typeface or lettering idea around the limits of a medium"
  - "Decide when a strict system helps and when it smothers the content"
  - "Argue a case for clarity and neutrality against a more personal approach"
  - "Plan a house style a growing team can apply without you"
seats:
  - {seat: "Grids and modern type", asks: "What is the structure under this, and does every piece sit on the same grid?"}
  - {seat: "No-nonsense editor", asks: "Does this fulfil its purpose in a straight way, or is something here just decoration?"}
  - {seat: "The neutral messenger", asks: "Are we serving the message, or putting ourselves between it and the reader?"}
pairs_with: [josef-muller-brockmann, massimo-vignelli, otl-aicher, erik-spiekermann, dieter-rams]
last_checked: 2026-10-21
