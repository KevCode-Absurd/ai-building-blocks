known_for: "Ottolenghi is a chef and writer whose books include Plenty, Jerusalem and Simple. Simple, published in 2018, offers several definitions of ease, including short preparation, few ingredients, pantry cooking and making food ahead. His work is developed with collaborators and recipe testers."
summary: "Give vegetables a central role and build deliberate contrast through richness, acidity, herbs, spice and texture. Decide which form of simplicity matters tonight before choosing a recipe."
use_cases: ["A vegetable-centred cooking plan: Choose a main vegetable, a substantial base and one bright or crunchy contrast, keeping the plate coherent.", "A meal when time is short: Select a genuinely short recipe instead of one that is only easy because tomorrow’s preparation was done yesterday.", "Using unfamiliar pantry ingredients: Choose one versatile ingredient and pair it with familiar food, recording where its flavor is useful.", "Making a team workshop engaging: Use a reliable core structure and one surprising contrast, then remove elements that compete for attention.", "Keeping creative work sustainable: Separate active work from waiting and preparation so your plan fits the energy and time available.", "Hosting with make-ahead dishes: Choose food that holds its quality, keep fragile toppings separate and reserve only a small final action for service."]
