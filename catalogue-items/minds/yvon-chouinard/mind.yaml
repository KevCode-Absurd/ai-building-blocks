  - {n: 4, title: "Patagonia's next chapter: Earth is now our only shareholder (press release with Chouinard's statement, 2022)", by: "Patagonia Works", url: "https://www.patagoniaworks.com/press/2022/9/14/patagonias-next-chapter-earth-is-now-our-only-shareholder", kind: own-words}
  - {n: 5, title: "About 1% for the Planet", by: "1% for the Planet", url: "https://www.onepercentfortheplanet.org/about", kind: reference}
