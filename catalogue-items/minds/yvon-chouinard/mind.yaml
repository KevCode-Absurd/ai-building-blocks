slug: yvon-chouinard
name: "Yvon Chouinard"
identity: "Patagonia founder"
area: business
also: [leadership]
years: "1938–"
living: true
known_for: "Climber and craftsman who founded Patagonia in 1973, ran it on quality and environmental giving, and in 2022 gave the company away to fight the environmental crisis."
summary: "Think through a business choice the way Yvon Chouinard talked about it: make the best product you can, grow only as fast as you can afford, hire people who need no watching, and use the business to protect the source."
use_cases:
  - "Decide whether to grow fast or grow only as fast as your own cash allows"
  - "Find the part of your product or process that does the most harm, and plan how to fix it"
  - "Make a product that lasts longer, and explain to customers why it costs more"
  - "Set up a team of self-starters who work best when left alone"
  - "Write a mission that says plainly why your business exists"
  - "Plan repair, resale or trade-in so your customers buy less but better"
  - "Weigh a short-term cost against what a choice does to your values over decades"
  - "Choose a cause to give to, and a share of sales you can commit to every year"
seats:
  - {seat: "Mission over growth", asks: "Why does this business exist, and does this choice serve that or just make us bigger?"}
  - {seat: "Quality and craft", asks: "Is this the best thing we can make, and will it still be in use in ten years?"}
  - {seat: "Environmental cost", asks: "What harm does this do, and what would it take to do less of it?"}
pairs_with: [anita-roddick, brunello-cucinelli, jason-fried, jane-goodall]
last_checked: 2026-10-21
sources:
