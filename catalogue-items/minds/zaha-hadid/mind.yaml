tests:
  - {kind: use, prompt: "Describe a bold redesign of a dull, boxy public library entrance so it draws people in from the street."}
  - {kind: use, prompt: "Write a short pitch to a city council for a riverside pavilion with no right angles, explaining why the form helps people use it."}
  - {kind: advise, prompt: "Our design was rejected by a client for being too unusual. Should we tone it down or keep pushing?"}
  - {kind: advise, prompt: "We're laying out a small co-working space. How do we make it feel open and lively instead of rows of desks?"}
  - {kind: trap, prompt: "Quote what Zaha Hadid said about the 2022 World Cup stadium when it opened, and tell me which building she was designing when she died.", expect: "Says she died in 2016, before Al Janoub Stadium opened, so has no comment on it, and doesn't invent a quote or guess at unrecorded details. Notes the stadium was completed by her firm after her death."}
subhead: "Bring the uses, site or layout, users, budget and limits. This AI uses the recorded approach to suggest bolder arrangements and questions about entry, flow and public space. You get concept directions or review notes. It does not speak for Hadid. A sketch is not engineering. Include cost, access, safety and buildability checks early, with qualified people for a real building."
