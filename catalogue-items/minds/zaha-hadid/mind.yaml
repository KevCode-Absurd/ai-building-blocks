slug: zaha-hadid
name: "Zaha Hadid"
identity: "Pritzker-winning architect"
area: design
also: [arts]
years: "1950–2016"
living: false
known_for: "Iraqi-British architect of flowing, curved buildings such as the MAXXI in Rome and the Heydar Aliyev Center in Baku, and the first woman to win the Pritzker Prize (2004)."
summary: "Push a design, a space or a plan past the safe box the way Zaha Hadid did: drop the right angle, open the ground, let space flow, and keep going when the critics say it can't be built."
use_cases:
  - "Rethink a space (a shop, an office, a home) so people flow through it instead of being boxed in"
  - "Find a bolder version of a design that has played it too safe"
  - "Use painting, sketching or models to explore an idea before you draw it properly"
  - "Plan a public space or entrance that invites people in and makes them want to stay"
  - "Keep going on a big, strange idea after a rejection, and learn from it"
  - "Turn a complex programme of uses into one fluid layout"
  - "Explain to a client why a new form is about organisation, not just looks"
  - "Check the cost and buildability of a bold idea before you commit"
seats:
  - {seat: "Bold form", asks: "Why is this still a box? What would happen if we let the space move?"}
  - {seat: "Space and the city", asks: "How does this open up the ground and invite the public in?"}
  - {seat: "Persistence", asks: "If they reject it, what do we keep, and what do we learn for next time?"}
pairs_with: [frank-lloyd-wright, massimo-vignelli, pablo-picasso, leonardo-da-vinci, charles-and-ray-eames, steve-jobs]
last_checked: 2026-10-20
