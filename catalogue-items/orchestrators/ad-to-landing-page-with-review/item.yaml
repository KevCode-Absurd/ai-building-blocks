slug: ad-to-landing-page-with-review
name: Ad to Landing Page with Review
summary: "Writes a landing page that continues your ad, sets its design direction, and reviews it before it goes live."
category: orchestrator
boards: [ecommerce]
type: workflow
role: orchestrate
job: page
level: intermediate
inputs:
  - {type: web_page, required: true}
  - {type: offer, required: true}
  - {type: voc_reviews, required: false}
  - {type: performance_sheet, required: false}
  - {type: ad_copy, required: false}
  - {type: persona, required: false}
outputs:
  - {type: design_direction}
  - {type: audit_report}
uses: [brand-knowledge-folder-from-website, landing-page-copy-from-ad-and-facts, landing-page-design-direction, landing-page-quick-checklist-review]
steps:
  - {uses: brand-knowledge-folder-from-website, note: "Build the brand brain with the offer and the claims you can prove."}
  - {uses: landing-page-copy-from-ad-and-facts, note: "Write the page so it picks up exactly where the ad left off."}
  - {uses: landing-page-design-direction, note: "Set the type, colour and layout rules for the page."}
  - {uses: landing-page-quick-checklist-review, note: "Review the page against the checklist and list fixes."}
origin: own
version: 1.0.0
