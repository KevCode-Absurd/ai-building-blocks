slug: adapt-a-lesson-for-different-access-needs
name: Adapt a lesson for different access needs
summary: Share the source files. Get a barrier review, adapted activities and a check of the unchanged learning goal.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
