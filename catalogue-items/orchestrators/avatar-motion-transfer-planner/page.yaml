new_slug: avatar-motion-transfer-planner
name: Avatar motion transfer planner
summary: Share an approved avatar and owned performance clip. Get a motion-transfer plan, reference roles and checks for the result.
job: make-video-ads
headline: Avatar motion transfer planner
subhead: Share an approved avatar and owned performance clip. Get a motion-transfer plan, reference roles and checks for the result. Bring the brief and any files you want it to use.
explain: |-
  Use this when you need a performance-reference motion transfer plan. Confirm the intended avatar and that the performance footage is owned or authorized for this use. A third-party social video is not automatically an approved motion source.

  Inspect source motion only if footage is accessible. Record framing, camera movement, actor pose range, occlusions, hand/face visibility, ground contact, duration and aspect ratio.
when:
  - You need a performance-reference motion transfer plan.
  - You want a clear draft and checks from the material you already have.
you_give:
  - brief
  - "Optional: footage"
  - "Optional: avatar sheet"
you_get:
  - plan
  - video prompt
  - Missing inputs and steps that still need to run
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs. For a real person's likeness, bring written consent or a licence. Do not present the result as that person's endorsement without telling viewers.
  - Next, run the brief in a motion-control video tool or hand it to an editor, then use the review checklist on the clip. The plan is not a finished clip. Those video tools, such as Kling or Higgsfield, are paid services that need an account and sometimes an API key.
  - Check the result against the supplied facts before using it.
how_it_works:
  - title: Read the brief
    text: Confirm the intended avatar and that the performance footage is owned or authorized for this use. A third-party social video is not automatically an approved motion source.
  - title: Build the result
    text: "Assign appearance to the avatar reference and movement to the performance reference. State excluded properties: do not import performer identity, unrequested clothing, text, room or unrelated objects."
  - title: Check and hand off
    text: If no compatible motion-control tool is connected, deliver the reference-role map, starting-frame prompt, transfer brief and review checklist. Do not claim a completed transfer.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - You have no avatar or clip yet and want to plan the character and shots first. Use the Video avatar and storyboard planner.
  - You want a full ad plan with a script and timed shots. Use the Video ad production plan builder.
  - You only want to check an AI clip brief for problems with people or movement. Use the Human image and motion reviewer.
output_sample:
  input:
    - Your brief (what the clip should show)
    - Your approved avatar sheet or photo (optional)
    - A performance clip you own or have the right to use (optional)
  prerequisites:
    - Proof the performance clip is yours or cleared for this use
    - A motion-control video tool to run the transfer (the plan works without one)
  output:
    - name: Reference roles and rights
      contains: Which file sets how the avatar looks and which sets how it moves, and who owns the clip.
    - name: Source compatibility
      contains: Findings on framing, hidden body parts and contact points in the performance clip.
    - name: Starting frame and motion brief
      contains: A copy-ready prompt for the avatar's first frame and the motion to carry over.
    - name: Review checklist
      contains: Passes at normal speed, muted and paused at contact moments, for face, hands and feet.
    - name: Not run
      contains: Any tool or media check that did not happen, so the plan is not read as a finished clip.
