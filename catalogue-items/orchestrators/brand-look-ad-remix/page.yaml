new_slug: brand-look-ad-remix
name: Own-ad style remix builder
summary: Share your own ads and real product photos. Get a new set in your brand style, with prompts, checks and a change log.
job: make-image-ads
headline: Own-ad style remix builder
subhead: Make new ads that still look like your brand.
explain: Turns your own ads into a written guide to your look (called visual DNA here, meaning type, colours, layouts, photo style, copy habits and devices), then makes new ads in that look. Only your own ads feed the guide. Results are judged separately. The final images may need a paid image tool, so your AI states the cost and waits for your yes first.
when:
  - You want new ads that look consistent with your own existing work.
  - You have a style analysis and want finished variations with a replay record.
you_give:
  - At least three of your own ad images and any genuine results.
  - Exact target product, real photos, approved claims and offer.
  - Requested ad count, sizes and generation budget.
you_get:
  - A six-part visual DNA record and a map of your layout types (archetype map).
  - New concepts and generated/composited ads where tools permit.
  - Per-ad prompts, source anchors, QA notes and a replay manifest (a per-ad record of prompts and revisions).
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
  - Next, to change one ad, give your AI the replay manifest and name the ad. To find which of your ads win, use the Winning ad DNA mapper. To build ads from rivals' layouts, use the Swipe library ad builder.
how_it_works:
  - title: Read your existing ads
    text: Sample owned ads and distinguish visual patterns from actual performance evidence.
  - title: Map style to concepts
    text: Write down six things about your look. Group your ads by layout type (the archetype map). Then choose a simple way to make each layout, either an AI image or your real photos placed on a template.
  - title: Build and log
    text: Inspect a pilot, make the set and keep every prompt, real photo used and revision in a replay manifest, a list that lets you change one ad later.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - You want to find which of your ads win and why. Use the Winning ad DNA mapper first.
  - You have one product photo and want it repeated in new colours as ads. Use Repeat one product photo in new colours as ads.
  - You want ads built from a rival's layouts or reference ads. Use the Swipe library ad builder.
output_sample:
  input:
    - At least three of your own ad images, with results if you have them
    - Your product, clear photos of it, and the claims and offer you can use
    - How many new ads you want, in which sizes
    - Your brand brain files (optional)
  prerequisites:
    - An AI that can look at images
    - An image tool for the final pictures (the plan works without one). It may be a paid image service, so check the cost before you make a full set.
  output:
    - name: visual-dna.md
      contains: Your ads' type, colours, layouts, photo style, copy habits and devices, each with a count and examples.
    - name: Archetype map
      contains: The layout types found in your ads and how each one will be made.
    - name: Concepts
      contains: One new ad idea per slot, with buyer problem, message, layout and what is new.
    - name: New ads
      contains: Images made in your look from your real product photos, in each size.
    - name: Per-ad prompts and anchors
      contains: The prompt, real photos and method used for each ad.
    - name: QA log
      contains: Checks of each full-size image for product, label, spelling and claims, with failures listed.
    - name: Replay manifest
      contains: A record of every prompt and revision so one ad can be changed later.
