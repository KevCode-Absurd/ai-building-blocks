how_it_works:
  - title: Availability payment deduction checker
    text: Reconcile the certified gross payment and approved capped deductions. Pass net certified payment and actual bank-received timing separately; do not transfer the example operating-cash subtotal as new gross receipts.
  - title: Project cash available bridge
    text: Build CFADS from actual eligible payment receipts, deducting operating payments and financing-definition adjustments once. Tie the opening payment bridge to receipts and list unreceived amounts or contractual disputes as gaps. Declare the source basis. For actual cash receipts/payments or already-cash operating results, do not deduct receivable/payable working-capital settlement again; explicitly omit it only after reconciliation. For accrual revenue/cost proxies, use the signed working-capital bridge with noncash expenses excluded. Never combine these two routes.
