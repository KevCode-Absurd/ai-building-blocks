slug: build-a-backup-recovery-rehearsal
name: Build a backup recovery rehearsal
summary: Plan a safe restore test of your backups. Get a recovery plan, a rehearsal checklist and an evidence log to fill in as you test.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: question
    required: true
  - type: document
    required: false
  - type: meeting_notes
    required: false
outputs:
  - type: plan
  - type: document
uses:
  - backup-and-recovery-planner
  - incident-runbook-writer
  - executive-action-register
steps:
  - uses: backup-and-recovery-planner
    note: Ranks each system by how fast it must return and sets recovery targets from your numbers. Hands the ranked list and targets to the runbook step.
  - uses: incident-runbook-writer
    note: Writes the restore rehearsal for each system, with prerequisites, stop points, rollback steps and a row for time, data checked and pass or fail. Hands the checklist to the register.
  - uses: executive-action-register
    note: Turns the rehearsal tasks, evidence to collect and recovery gaps into one action list with owners and dates. Reads the checklist from step 2 and the plan from step 1, plus your meeting notes if you have them. Hands you the action list.
