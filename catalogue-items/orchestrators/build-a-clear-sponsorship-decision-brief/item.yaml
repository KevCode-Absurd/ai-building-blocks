steps:
  - uses: vendor-comparison-writer
    note: "Compare the proposal with alternatives on total cost with every fee and what you actually receive. Mark audience facts as seller claim or your data. Pass the total and open questions to step 2."
  - uses: event-marketing-planner
    note: "Use sponsorship evaluation mode to plan a small pilot with a spend cap, tracking, a definition of a result and a decision date. Label results as observational, never as proof of cause. Reads step 1's cost comparison and your own goal. Pass the plan to step 3."
  - uses: decision-checklist-runner
    note: "Run the person's checklist on the pilot plan. Mark each item pass, fail or unknown with the fact behind it, show failed stop items first, and end with go, wait or no."
