name: Build a comparable trailing revenue model
headline: Build a comparable trailing revenue model
summary: Link fiscal periods, currency, business scope and extra-week adjustments into a comparable revenue model.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A linked reported and comparable trailing-revenue workbook with adjustment ordering. Share annual/YTD revenue by business and currency, prior comparatives, acquisition/disposal data and fiscal-calendar disclosures.
explain: |-
  A linked reported and comparable trailing-revenue workbook with adjustment ordering.

  Public-market financial modelling. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need a linked reported and comparable trailing-revenue workbook with adjustment ordering.
  - You work on public-market financial modelling and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Annual/YTD revenue by business and currency, prior comparatives, acquisition/disposal data and fiscal-calendar disclosures.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
