how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Trailing-period financial bridge
    text: Use actual sourced schedules in one linked native workbook; example values are illustrative and must not become issuer inputs. Build reported trailing additive revenue from annual plus current YTD minus matching prior YTD, preserving every fiscal boundary and restatement.
  - title: Constant-currency revenue bridge
    text: Use period/currency buckets underlying the trailing bridge and one documented rate convention; reconstruct comparable currency revenue rather than applying an unsupported single global FX percentage.
  - title: Organic revenue perimeter bridge
    text: Apply evidenced acquisition/disposal adjustments to the same currency-normalized period; map both numerator and denominator to one continuing perimeter and exclude duplicate FX adjustments.
  - title: Extra-week revenue comparability schedule
    text: Remove any extra-week contribution still inside the comparable period using sourced calendar evidence; reconcile final comparable revenue back to reported trailing revenue by adjustment.
output_shape: |-
  A linked reported and comparable trailing-revenue workbook with adjustment ordering.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Every period/business/currency bucket appears once, adjustments have a stated ordering, no quarter/YTD or calendar mix occurs and final comparable revenue bridges exactly to reported trailing revenue.
judge:
  - Every period/business/currency bucket appears once, adjustments have a stated ordering, no quarter/YTD or calendar mix occurs and final comparable revenue bridges exactly to reported trailing revenue.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
