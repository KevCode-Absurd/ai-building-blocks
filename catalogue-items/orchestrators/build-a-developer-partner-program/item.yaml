slug: build-a-developer-partner-program
name: Build a developer partner program
summary: Share your platform and partner goals. Get an adoption program, partner
  incentives and tests for shared growth.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
needs_mode: manual
inputs:
  - type: business_profile
    required: true
  - type: question
    required: false
outputs:
  - type: plan
uses:
  - copilot-gtm-developer-ecosystem
  - copilot-gtm-partnership-architecture
steps:
  - uses: copilot-gtm-developer-ecosystem
    note: Plans how outside developers find, try and ship on your product, and
      which numbers to track. Hands the developer path and those numbers to the
      partnership step.
  - uses: copilot-gtm-partnership-architecture
    note: Uses step 1's developer plan, plus your product, goal and partner list.
      Sets partner types, tiers, incentives and small tests of shared revenue.
      Hands you the finished partner program.
