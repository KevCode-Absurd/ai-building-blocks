slug: build-a-practice-plan-from-common-mistakes
name: Build a practice plan from common mistakes
summary: Share the learner's wrong answers. Get an error map, practice on the top mistakes and a later recall check.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: source_text
    required: false
  - type: plan
    required: false
outputs:
  - type: feedback_notes
  - type: copy_draft
  - type: plan
  - type: document
uses:
  - study-understanding-check
  - flawed-example-writer
  - mixed-practice-unit-planner
steps:
  - uses: study-understanding-check
    note: Separate slips, missing prerequisites and misunderstood concepts using the actual answers. Hands the error map, most frequent mistake first, to the example writer.
  - uses: flawed-example-writer
    note: Start from a verified correct example, introduce exactly one realistic target error and keep the teacher key separate from the learner task. Reads step 1's error map plus the correct worked solutions you give it. Hands the practice sets to the planner.
  - uses: mixed-practice-unit-planner
    note: Use the prior taught topic and prerequisite order to mix corrected practice with earlier topics, then define a later retention check. Reads step 2's practice sets plus your topic order and weekly time. Hands you the practice plan and recall check.
