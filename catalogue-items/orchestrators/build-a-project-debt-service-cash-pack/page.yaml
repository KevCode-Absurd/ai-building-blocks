name: Build a project debt service cash pack
headline: Build a project debt service cash pack
summary: A linked project cash, debt repayment and loan-life cover schedule
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: "A linked project cash, debt repayment and loan-life cover schedule. Share three annual project operating cash records or approved scenarios, financing CFADS definition, loan opening balance, fixed rate, target service cover and contractual loan-life rate. Identify operating source basis: accrual before working-capital settlement or actual cash receipts/payments, with a compatible working-capital perimeter."
explain: |-
  A linked project cash, debt repayment and loan-life cover schedule.

  Project finance coverage schedules. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need a linked project cash, debt repayment and loan-life cover schedule.
  - You work on project finance coverage schedules and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - "Three annual project operating cash records or approved scenarios, financing CFADS definition, loan opening balance, fixed rate, target service cover and contractual loan-life rate. Identify operating source basis: accrual before working-capital settlement or actual cash receipts/payments, with a compatible working-capital perimeter."
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A linked project cash, debt repayment and loan-life cover schedule.
  - Original step files, financial assumptions, source coverage and a governing handoff summary.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Project cash available bridge
    text: Build one source-driven CFADS bridge for each of the three annual periods. Pass the actual annual qualifying cash series and definition ledger; the single-period example is a method reference, not a full forecast. Declare the source basis. For actual cash receipts/payments or already-cash operating results, do not deduct receivable/payable working-capital settlement again; explicitly omit it only after reconciliation. For accrual revenue/cost proxies, use the signed working-capital bridge with noncash expenses excluded. Never combine these two routes.
  - title: Debt repayment sculpting planner
    text: Use that qualifying annual series, actual opening debt and financing rate to calculate target service, interest, principal, residual balance and any interest-capacity gap. Return the exact debt horizon and balance to the coverage step.
  - title: Loan life cash cover checker
    text: Discount the same eligible cash over the remaining debt tenor at the contract-defined loan-life rate. Reconcile source cash and opening debt to prior steps; do not substitute WACC or include cash beyond maturity.
output_shape: |-
  A linked project cash, debt repayment and loan-life cover schedule.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: All annual cash is rebuilt from dated sources; principal rollforward ties; cash beyond maturity and financing proceeds are excluded from loan-life cover. Actual receipt/payment sources do not receive a second working-capital deduction; accrual and cash-basis routes are explicitly distinguished.
judge:
  - All annual cash is rebuilt from dated sources; principal rollforward ties; cash beyond maturity and financing proceeds are excluded from loan-life cover. Actual receipt/payment sources do not receive a second working-capital deduction; accrual and cash-basis routes are explicitly distinguished.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
