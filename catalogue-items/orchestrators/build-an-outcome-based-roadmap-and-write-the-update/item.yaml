slug: build-an-outcome-based-roadmap-and-write-the-update
name: Build an outcome-based roadmap and write the update
summary: Turn your goals into an outcome-based roadmap. Get an opportunity tree, a quarter plan with bets and measures, and an update stakeholders can read.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: question
    required: true
  - type: voc_reviews
    required: true
  - type: plan
    required: false
outputs:
  - type: plan
  - type: document
uses:
  - opportunity-solution-tree
  - outcome-based-roadmap
  - quarterly-roadmap-builder
  - roadmap-update-writer
steps:
  - uses: opportunity-solution-tree
    note: Under each outcome, the customer problems that would move it if solved, from your tickets and research, each with its evidence or marked as a guess, and solution ideas under the top ones. Hands the tree to step 2.
  - uses: outcome-based-roadmap
    note: "A roadmap of outcomes, not features, in Marty Cagan's manner: each outcome with its measure, owner and bets. Old features go under an outcome or are listed as unowned. Hands the roadmap to step 3 as the plan to pick bets from."
  - uses: quarterly-roadmap-builder
    note: "The next quarter: the bets that fit your capacity, what each should move and by how much, how you will know, and what you are not doing. Hands the plan to step 4. Uses your capacity for the quarter, not step 2's output."
  - uses: roadmap-update-writer
    note: "The one-page update for stakeholders: outcomes, bets, what changed since last time and why, and what you are not doing, in plain words. Uses the quarter plan from step 3 and the roadmap from step 2, plus last quarter's results if you have them."
origin: own
version: 1.0.0
minds:
  - marty-cagan
credits:
  - title: Product Discovery (2007)
    by: Marty Cagan, Silicon Valley Product Group
    url: https://www.svpg.com/product-discovery/
    used: Give the team an outcome to own and let discovery decide the features
example_pending: true
needs_mode: manual
