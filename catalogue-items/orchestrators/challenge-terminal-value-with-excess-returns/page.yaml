new_slug: challenge-terminal-value-with-excess-returns
name: Challenge terminal value with excess returns
headline: Challenge terminal value with excess returns
summary: Test whether your terminal value quietly assumes returns that last forever, and see the reinvestment and return on capital it implies.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it invested capital, operating profit after tax, your cost of capital, growth and the terminal value you propose. It builds a case where excess returns fade, a stable-growth case with its reinvestment, and the reinvestment your terminal value implies. You get one workbook that sets the three side by side.
explain: |
  A terminal value often carries most of a valuation. It can hide a bold claim: that a company keeps earning above its cost of capital forever, while growing without investing much. Few businesses can do that. Rivals arrive, and growth needs capital.

  This workflow checks the claim three ways. Step 1 builds a case where the excess return fades to zero after a stated period. Step 2 builds a stable-growth case and shows the reinvestment and return on capital it needs. Step 3 works backward from your terminal value to the reinvestment rate and return on capital it implies. The cases are compared and explained. They are never averaged.

  It tests a terminal value you already have. It does not forecast the company, and it does not say what the value should be. The fade case is clearly labelled sourced or hypothetical.
when:
  - Your terminal value is most of your enterprise value and someone asks what it assumes.
  - A terminal value comes from an exit multiple and you want to know what growth and returns sit behind it.
  - You assume a company keeps earning above its cost of capital after the forecast ends.
  - A reviewer asks if your terminal growth rate fits your reinvestment.
not_for:
  - You want to connect the forecast's growth to the investment it needs. Use the Link operating growth to terminal reinvestment workflow. This one tests a terminal value you already have.
  - You want to stress many valuation assumptions at once. Use the Review equity valuation sensitivity assumptions workflow.
  - The company has no stable end state, such as an early-stage business with negative profit. The checks assume a stable year.
  - You only need the implied reinvestment from one terminal value. Use the Implied terminal reinvestment schedule.
you_give:
  - Invested capital and operating profit after tax (NOPAT) for the forecast years (from your model and the filings)
  - Evidence for any lasting competitive advantage, such as filings or market data (optional)
  - First stable-year NOPAT and the stable growth rate (from your model)
  - Your cost of capital (WACC), with its date and source
  - The terminal value you propose, or the exit multiple behind it
  - The reporting date, currency and scale
you_get:
  - "A fade case: excess returns for two years, then none"
  - A stable-growth case with its reinvestment rate and return on capital
  - The reinvestment rate and return on capital your terminal value implies
  - A note on where the three cases differ and why
  - A flag if the terminal value needs returns above the cost of capital forever
  - Missing facts, and checks that could not run
how_to_use:
  - Download the workflow pack and give it to an AI that can read files, such as Claude, ChatGPT or Gemini. Use one that can make spreadsheets if you want a workbook.
  - Attach your valuation model or its schedules, and paste the terminal value, growth rate and cost of capital with their sources. Say if any figure is your own assumption.
  - After step 1, check that the fade case is labelled sourced or hypothetical and that it states what it assumes about capital.
  - After step 2, check that the stable case states its reinvestment rate and return on capital, and whether it assumes returns above the cost of capital forever.
  - After step 3, read how the three cases differ. Fill every MISSING line before using the result in a valuation.
how_it_works:
  - title: Economic profit fade schedule
    text: Builds a case where excess returns last for two years, then fall to zero. Needs evidence that capital stays constant and no later excess return follows. Widen the case if capital changes. Hands step 2 the invested capital and NOPAT.
  - title: Terminal growth reinvestment check
    text: Builds a separate stable case with its reinvestment and return on capital. Says whether it assumes returns above the cost of capital forever. Is not blended with the fade case.
  - title: Implied terminal reinvestment schedule
    text: Backsolves your terminal value into the reinvestment rate and return on capital it implies, on the same periods, NOPAT, growth and cost of capital. Explains scenario differences instead of averaging them.
output_shape: |
  PERIOD AND UNITS  <valuation date>, <currency>, <scale>, WACC <n%> (<source, date>)

  1 FADE CASE       <per year: invested capital | NOPAT | capital charge | economic profit>
                    excess return ends after <n> years; labelled <sourced or hypothetical>
  2 STABLE CASE     growth <n%>, return on capital <n%>, reinvestment rate <n%>, terminal value <n>
  3 IMPLIED BY YOUR TERMINAL VALUE  reinvestment rate <n%>, return on capital <n%>

  WHERE THEY DIFFER  <one line per gap between the three cases, and why>
  FLAGS              <terminal value needs returns above WACC forever, or none>
  SOURCES, MISSING and CHECKS MISSED  <one line each>
output_sample:
  input:
    - Invested capital and NOPAT schedules
    - Stable-year NOPAT, stable growth and your cost of capital (WACC)
    - The terminal value you propose, or the exit multiple behind it
    - Evidence for any lasting competitive advantage (optional)
  prerequisites:
    - Your valuation model, or the schedules it uses
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: 1 FADE CASE
      contains: Economic profit year by year with excess returns fading to zero, labelled sourced or hypothetical.
    - name: 2 STABLE CASE
      contains: Stable growth with the reinvestment rate and return on capital it needs, and what it assumes about returns.
    - name: 3 IMPLIED BY YOUR TERMINAL VALUE
      contains: The reinvestment rate and return on capital hidden in the terminal value you proposed.
    - name: WHERE THEY DIFFER
      contains: Each gap between the three cases and the reason, with no blended figure.
    - name: FLAGS, SOURCES, MISSING and CHECKS MISSED
      contains: Any need for permanent excess returns, where each figure came from, each gap, and checks that could not run.
tweaks:
  - what: A longer fade
    how: Ask for excess returns to last longer than two years. The workbook says what evidence supports that and marks it hypothetical if none.
  - what: A higher terminal growth
    how: Raise stable growth. The needed reinvestment rises, and the page flags it if return on capital would have to jump.
  - what: An exit multiple
    how: Give an exit multiple instead of a terminal value. Step 3 converts it and shows the implied return on capital.
  - what: A workbook
    how: Say you want a native spreadsheet. It builds one linked workbook with inputs, formulas and a checks tab.
judge:
  - Every case states its advantage period, capital path and terminal excess return; values share timing/currency; implied infeasibility is flagged rather than hidden by an arbitrary blended target.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Keep a note of the competitive-advantage evidence behind each company's fade period, and paste it in every run.
  - Save each version of the terminal value and its checks, so a change in WACC or growth shows what moved.
  - Run the Review equity valuation sensitivity assumptions workflow on the result to see how much the value moves.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Builds a workbook with inputs, formulas and checks you can click into. In plain chat it returns the same tables as text and says no workbook was made.
    - name: Your valuation model
      why: Export the forecast and terminal value as a sheet, so the AI starts from your real figures.
  inputs:
    - A dated, sourced cost of capital.
    - Filings or market data that support how long excess returns last.
    - A named reviewer who knows the sector.
terms:
  - term: Terminal value
    meaning: The value placed on a business for all years after the forecast ends.
  - term: Excess return
    meaning: A return on capital above the cost of capital. It lets a business create value.
  - term: NOPAT
    meaning: Net operating profit after tax. Operating profit less the tax on it.
  - term: Return on capital
    meaning: Operating profit after tax divided by the capital invested.
  - term: Reinvestment rate
    meaning: The share of profit put back into the business to fund growth.
  - term: WACC
    meaning: Weighted average cost of capital. The blended return that lenders and shareholders require.
