how_it_works:
  - title: Convertible note interest checker
    text: Calculate actual simple accrual from funded principal and contractual dates. Save the interest-converting balance with currency and scale; keep share rounding unresolved until the agreement is checked.
  - title: Cap and discount conversion checker
    text: Pass the verified converting balance as amount, converting scale explicitly if necessary. Use the approved cap price and actual round discount, confirm lower-of language and compare resulting shares against round-price shares.
