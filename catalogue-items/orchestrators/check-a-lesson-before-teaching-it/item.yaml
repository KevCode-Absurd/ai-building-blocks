slug: check-a-lesson-before-teaching-it
name: Check a lesson before teaching it
summary: Check your lesson plan before you teach it. Get a lighter lesson, barriers to fix and quick checks that show who understands.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: lesson_plan
    required: true
  - type: question
    required: true
outputs:
  - type: audit_report
  - type: plan
  - type: document
  - type: lesson_plan
    required: true
uses:
  - overloaded-lesson-checker
  - lesson-barrier-spotter
  - lesson-understanding-check
steps:
  - uses: overloaded-lesson-checker
    note: "Finds too many new ideas at once, split attention and missing background. Hands the problem areas and their fixes to the barrier step."
  - uses: lesson-barrier-spotter
    note: "Predicts barriers in the task, the language and the way learners answer, from your lesson plan with step 1's fixes marked and your class notes. Hands the priority changes and the stuck points to the checks step."
  - uses: lesson-understanding-check
    note: "Places a hinge question, cold-call questions and an exit ticket where the answer changes your next move. Uses the stuck points from steps 1 and 2 as what to probe. Hands each check and its stage to the revised sequence."
