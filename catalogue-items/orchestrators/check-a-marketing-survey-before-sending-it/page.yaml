new_slug: check-a-marketing-survey-before-sending-it
name: Check a marketing survey before sending it
headline: Check a marketing survey before sending it
summary: Check your marketing survey before you send it. Get a revised question list, a bias review, a pretest plan and a plan for reading the answers.
job: understand-customers
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your draft survey, the decision the answers must support and who you will ask. It checks that the questions can answer that decision, finds leading or confusing wording and plans a small pretest. You get a revised survey and a plan for reading the results.
explain: |-
  You cannot fix a survey after it goes out. A leading question, a question that asks two things at once, or a group too small to answer your decision wastes the replies you worked for. This workflow checks a marketing survey before you send it, so you fix the wording and the plan first.

  Step 1 starts from the decision. What will you do with the answers? Can these questions inform that choice? Will enough people in each group you care about reply? Step 2 plans a pretest, where a few people from your audience say in their own words what each question means. Then the workflow reviews every question for leading, double or unclear wording and rewrites the weak ones, with a note on each change.

  It reviews and plans. It does not send the survey, collect answers or work out results. Whether replies can speak for all your customers depends on how you find people, so your recruiting limits are written next to the analysis plan, not left out.
when:
  - You wrote a customer survey and are about to send it to your email list.
  - You want to know if the answers will help you decide on a price, a product or a message.
  - A teammate wrote the questions and you suspect some push people toward one answer.
  - You plan to post a survey link on social media and need to know what the replies can and cannot show.
not_for:
  - You already have the answers. Use the Prepare a survey findings briefing workflow.
  - You want to size a market, not check a survey. Use the Market size and survey planner on its own.
  - You need to plan interviews, not a survey. Use the Interview and research planner.
  - You need legal advice on consent or privacy law. Ask a qualified person. This only checks that your consent wording is there.
you_give:
  - Your draft survey, with every question and answer choice
  - The decision the answers will help you make, and by when
  - Who you plan to ask, and roughly how many people are in that group
  - How you will find respondents, such as an email list or a social post
  - Your consent or privacy wording (optional)
  - Results from an earlier survey (optional)
you_get:
  - "A decision check: can these questions and this group answer your decision"
  - "A bias review: leading, double and unclear questions, with a fix for each"
  - A revised survey with each change marked
  - A pretest plan with a short guide to read to testers
  - A plan for reading the results, with what the replies cannot show
  - A hand-back summary that lists every fact it could not check
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini and say "Follow HANDOFF.md".
  - Paste your draft survey. Say the decision, who you will ask and how you will find them.
  - Read the decision check first. If the survey cannot answer your decision, fix that before the wording.
  - Run the pretest with a few people from your audience. Bring what they said back and ask for a final version.
  - Send only after you have made the changes you agree with and added your consent line.
how_it_works:
  - title: Market size and survey planner
    text: Checks that the questions, the group you ask and the sample can answer your decision. Works out how many replies you need in each group if you give group sizes. Hands the decision check and sample limits to the next step.
  - title: Interview and research planner
    text: "Plans the pretest from your survey draft and the decision check and groups from step 1: a few people from your audience say what each question means. Writes the tester guide. It leaves sample design with step 1."
  - title: Wording review
    text: This workflow's own check. It reviews each question for leading, double or unclear wording and for answer choices that overlap or miss a real option. It rewrites the weak ones and logs each change.
output_shape: |-
  DECISION CHECK
    Decision | Can the questions answer it | Gaps | Who the replies can and cannot speak for

  BIAS REVIEW
    Question number | What is wrong | Revised wording

  REVISED SURVEY
    Questions and answer choices, with changes marked

  PRETEST PLAN
    Who to test with | What to ask them | What to change after

  ANALYSIS PLAN
    How each question will be counted | Groups to compare | Limits

  HAND-BACK SUMMARY
    Files | MISSING lines | Checks not done | One next step
output_sample:
  input:
    - Your draft survey
    - The decision the answers will support
    - Who you plan to ask and how you will find them
    - Your consent wording (optional)
  output:
    - name: Decision check
      contains: Whether the questions and group can answer your decision, and who the replies cannot speak for.
    - name: Bias review
      contains: Each leading, double or unclear question, what is wrong with it and a better wording.
    - name: Revised survey
      contains: Your questions and answer choices with every change marked.
    - name: Pretest plan
      contains: Who to test with, what to ask them and what to change afterward.
    - name: Analysis plan
      contains: How each question will be counted, which groups to compare and the limits of the replies.
    - name: Hand-back summary
      contains: Files saved, MISSING lines, checks that could not run and one next step.
tweaks:
  - what: Scope
    how: Check one survey for one decision. A survey that tries to answer five decisions rarely answers any.
  - what: Evidence
    how: Paste the exact questions and answer choices, not a description of them.
  - what: Acceptance
    how: No question leads the reader. Your recruiting limits and consent line are written down before you send.
judge:
  - Questions avoid leading wording; sampling limits and consent are explicit before distribution.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep the revised survey as your template for the next one.
  - After you send it, compare what testers said with what real respondents did, and adjust.
  - Add your usual audience and group sizes so the next check starts from them.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file support
      why: They read your draft as pasted text or a file. Sample-size sums need no special tool. If your AI cannot run code, it works them in the chat and marks them as estimates to check.
  inputs:
    - Group sizes for each audience you care about.
    - A named person who signs off the survey.
next:
  - interview-and-research-planner
terms:
  - term: Leading question
    meaning: A question worded so that one answer feels like the right one.
  - term: Pretest
    meaning: A trial run where a few people read the questions and say what they think each one asks.
  - term: Sample
    meaning: The people who actually reply, out of the group you wanted to ask.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
