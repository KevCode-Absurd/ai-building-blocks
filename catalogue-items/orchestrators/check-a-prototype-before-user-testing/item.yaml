slug: check-a-prototype-before-user-testing
name: Check a prototype before user testing
summary: "Check a prototype before user testing: get a list of test blockers, neutral task wording and a session plan so results are about your design."
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: design_file
    required: false
  - type: web_page
    required: false
  - type: codebase
    required: false
outputs:
  - type: audit_report
  - type: plan
  - type: document
uses:
  - everyday-usability-reviewer
  - accessibility-checker
  - usability-test-runner
steps:
  - uses: everyday-usability-reviewer
    note: Walk through the key tasks and record confusing controls, wording and missing states. Hands step 3 the blocker list and the task paths.
  - uses: accessibility-checker
    note: Uses the prototype itself, not step 1's report. Checks available accessibility evidence and identifies barriers that could invalidate the test. Hands step 3 the barriers and what it could not check.
  - uses: usability-test-runner
    note: Uses the blockers from step 1 and the barriers from step 2 to choose and word neutral tasks. Prepares and, when participants and consent are available, runs sessions around the research question.
