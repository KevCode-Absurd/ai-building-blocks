slug: check-a-release-and-its-docs
name: Check a release and its docs
summary: Share your change and release plan. Get test gaps, stale docs and a
  rollout plan with rollback checks.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: brief
    required: true
  - type: codebase
    required: false
outputs:
  - type: document
uses:
  - copilot-test-gap-audit
  - copilot-docs-sync-audit
  - copilot-devops-rollout-plan
steps:
  - uses: copilot-test-gap-audit
    note: "1. Read skills/copilot-test-gap-audit/SKILL.md. Share your repo or change. Get missing, weak and stale tests ranked by the behavior at risk. Hands step 3 the ranked test gaps as known risks. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
  - uses: copilot-docs-sync-audit
    note: "2. Read skills/copilot-docs-sync-audit/SKILL.md. Uses your code change and your docs, not step 1's test gaps. Get outdated docs and missing instructions traced to the changed behavior. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
  - uses: copilot-devops-rollout-plan
    note: "3. Read skills/copilot-devops-rollout-plan/SKILL.md. Share a release or infrastructure change. Uses the test gaps from step 1 as known risks and the stale docs from step 2 as docs to update before release. Get preflight checks, rollout stages, health signals and a rollback plan. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
origin: rebuilt
version: 1.0.0
