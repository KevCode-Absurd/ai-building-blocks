how_it_works:
  - title: Debt issue proceeds checker
    text: Reconcile issued face to actual cash proceeds after OID and only those fees withheld at issue. Preserve the principal amount separately.
  - title: Refinancing closing cost checker
    text: Use net financing cash from the first schedule and the real payoff letter. Include only refinancing fees not already deducted, identifying the old debt payoff and premium separately.
  - title: Deal funding gap checker
    text: Map actual old principal and premium into payoff use and remaining fees into distinct fee uses. Use the same net debt cash as source, then reconcile purchase use, closing cash, rollover and sponsor funding without plugging a gap.
