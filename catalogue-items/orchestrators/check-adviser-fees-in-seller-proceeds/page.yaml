how_it_works:
  - title: Adviser fee tier checker
    text: Compute the actual two-tier marginal fee, minimum and allowed paid-retainer credit. Save gross fee, credit used and remaining invoice separately.
  - title: Closing equity proceeds checker
    text: Include only the unpaid fee invoice with other distinct seller transaction expenses, using explicit currency/scale conversion. Reconcile to the draft closing statement and keep already-paid cash out of repeated deductions.
