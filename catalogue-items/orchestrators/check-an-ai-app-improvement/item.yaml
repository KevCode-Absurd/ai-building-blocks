slug: check-an-ai-app-improvement
name: Check an AI app improvement
summary: Share your AI app and proposed change. Get evaluation criteria,
  feedback loops and an evidence-based comparison plan.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: question
    required: true
  - type: codebase
    required: false
outputs:
  - type: document
  - type: eval_set
    required: true
uses:
  - copilot-eval-driven-dev
  - copilot-agentic-eval
  - copilot-diagnose
steps:
  - uses: copilot-eval-driven-dev
    note: "1. Read skills/copilot-eval-driven-dev/SKILL.md. Share your AI app and goal. Get test cases and a way to compare changes with real results. Hands step 2 the success criteria and the test cases. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
  - uses: copilot-agentic-eval
    note: "2. Read skills/copilot-agentic-eval/SKILL.md. Share an agent task. Uses the success criteria and test cases from step 1 as the standard for a good answer. Get checks and feedback loops to improve the quality of its answers. Hands step 3 the checks as the evidence to look for. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
  - uses: copilot-diagnose
    note: "3. Read skills/copilot-diagnose/SKILL.md. Reads your own app and workflow files, and uses the test cases and checks from steps 1 and 2 to show where the workflow disappoints. Get its weak points ranked, with causes and practical fixes. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
origin: rebuilt
version: 1.0.0
