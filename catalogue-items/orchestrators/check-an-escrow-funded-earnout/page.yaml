new_slug: check-an-escrow-funded-earnout
name: Check an escrow-funded earnout
headline: Check an escrow-funded earnout
summary: Check what a single linear earnout pays on the agreed result, then see if the dedicated escrow covers it and what can be released.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it the earnout clause, the agreed result and the escrow records. Your AI works out the payout from the formula, compares it with the escrow balance, and shows what can be released or is left uncovered.
explain: |-
  An earnout pays the seller more after a sale if the business hits a target. Some deals put cash in a dedicated escrow account to fund it. The buyer and seller then ask two questions: what does the formula pay, and does the escrow cover it? This workflow answers both for one earnout with a straight-line payout.

  Step 1 applies the formula to the agreed result, keeps the threshold and cap in order, and flags any dispute. It is a payout scenario, not a fair value. Step 2 only treats a reserve as approved if the contract says so. It then compares that reserve with the deposit and payments out, and shows the release and any uncovered amount.

  It never tells anyone to pay. Money in other escrows, such as for indemnity or working capital, stays out of this check.
when:
  - The earnout period has ended and the result is agreed.
  - A seller asks how much of the earnout is due.
  - A buyer needs to know if the escrow covers a likely payout.
  - You need to know how much escrow cash can be released.
not_for:
  - "Your earnout has steps, cliffs or several metrics: this covers one straight-line clause only."
  - "The escrow secures other claims, such as indemnity or working capital: use the Escrow release checker on its own."
  - "You need the earnout's fair value for accounts: this checks a payout scenario and escrow cover, not valuation."
you_give:
  - "The earnout clause: threshold, cap and the payout rate or formula"
  - The agreed result for the metric and the period it covers (from the signed statement)
  - Notes on any dispute over the result
  - Proof of the earnout escrow deposit and every payment out of it (from the escrow agent's statement)
  - The contract wording on any pending reserve the buyer may hold back
you_get:
  - The payout the formula gives for the agreed result
  - The escrow balance after the deposit and payments out
  - The cash that can be released, and the amount held for an approved reserve
  - Any exposure the escrow does not cover
  - A list of missing facts and checks that could not run
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini, in a chat that accepts files.
  - Attach the earnout clause, the agreed result and the escrow statements. Say the currency and the date of the check.
  - Ask your AI to follow the pack and save each step's file.
  - After step 1, check the threshold, cap and result against the clause. A disputed result stays flagged.
  - After step 2, check the escrow records tie to the statement and the reserve is in the contract. Give the result to your lawyer or escrow agent. It is not a payment instruction.
how_it_works:
  - title: Earnout payout checker
    text: Applies the one straight-line clause to the agreed result, keeping threshold and cap in order. Flags disputes. Labels the result a payout scenario, not a fair value. Hands step 2 the payout and any approved reserve.
  - title: Escrow release checker
    text: Passes on a reserve only if the contract approves it. Uses the actual deposit and payments out. Shows the release and any uncovered exposure, with no payment instruction.
output_shape: |-
  SCOPE AND SOURCES       <earnout clause, agreed result, escrow statements and dates>
  EARNOUT PAYOUT          <result | threshold | cap | payout scenario | dispute notes>
  ESCROW COVER            <deposit | payments out | balance | approved reserve>
  RELEASE AND EXPOSURE    <releasable now | held back | uncovered>
  MISSING                 <each gap and what it stops>
  CHECKS MISSED          <one line each, or none>
tweaks:
  - what: Agreed result
    how: Change the result. The payout moves along the straight line between the threshold and the cap.
  - what: Disputed result
    how: Give both sides' figures. Each is run as its own payout line and the cash difference is shown.
  - what: Pending reserve
    how: Add a claim the contract approves. It is held back from the release, and any amount above the balance shows as uncovered.
  - what: Workbook
    how: Say you want a spreadsheet. Inputs, formulas and checks sit on separate sheets.
judge:
  - Use this path only when the contract funds the earnout from this escrow; other indemnity or working-capital escrows remain separate.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Keep the clause on one line (metric, period, threshold, cap, maximum payout) and paste it in each run.
  - Save the escrow agent's statement beside step 2, so the balance can be traced.
  - Run the Reconcile seller closing cash workflow next, to see how the payout fits the seller's bridge.
works_best_with:
  tools:
    - name: A spreadsheet tool and an AI that reads files
      why: The payout formula and the escrow balance are short calculations that must be recalculated and traceable.
  inputs:
    - The escrow agent's latest statement.
    - The signed statement that fixes the earnout metric.
terms:
  - term: Earnout
    meaning: Extra money paid to the seller after a sale if the business meets a target.
  - term: Escrow
    meaning: Cash held by a third party until the contract says who gets it.
  - term: Linear payout
    meaning: A payout that rises in a straight line between a threshold and a cap.
  - term: Pending reserve
    meaning: Cash kept in escrow for a claim that has not been settled.
  - term: Reconciliation
    meaning: A comparison that explains any difference between two sets of figures that should match.
output_sample:
  input:
    - The earnout clause and the agreed result
    - The escrow deposit and payment records
    - The contract wording on any pending reserve
  prerequisites:
    - An AI that can read files
  output:
    - name: outputs/step-1-earnout-payout-checker.md
      contains: The payout the formula gives for the agreed result, with any dispute flagged.
    - name: outputs/step-2-escrow-release-checker.md
      contains: Escrow balance, releasable cash, approved reserve and any uncovered amount.
    - name: HAND-BACK SUMMARY
      contains: Files saved, sources used, assumptions, MISSING lines, checks missed and one suggested next step.
