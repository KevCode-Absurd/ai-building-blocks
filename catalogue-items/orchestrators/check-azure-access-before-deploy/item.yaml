slug: check-azure-access-before-deploy
name: Check Azure access before deploy
summary: Share a Bicep change and access needs. Get least-access role choices
  and checks of the proposed deployment.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: question
    required: true
  - type: codebase
    required: false
outputs:
  - type: document
uses:
  - copilot-azure-role-selector
  - copilot-azure-deployment-preflight
  - copilot-devops-rollout-plan
steps:
  - uses: copilot-azure-role-selector
    note: "1. Read skills/copilot-azure-role-selector/SKILL.md. Describe what an identity must do. Get the narrow Azure role that fits, with reasons. Hands step 2 the chosen role to check the deployment against. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
  - uses: copilot-azure-deployment-preflight
    note: "2. Read skills/copilot-azure-deployment-preflight/SKILL.md. Share your Bicep deployment. Uses the role from step 1 as the access the deployment should need. Get syntax, permission and proposed-change checks before it goes live. Hands step 3 the checks and the proposed changes. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
  - uses: copilot-devops-rollout-plan
    note: "3. Read skills/copilot-devops-rollout-plan/SKILL.md. Share a release or infrastructure change. Uses the role from step 1 and the preflight checks and proposed changes from step 2 as approvals and risks. Get preflight checks, rollout stages, health signals and a rollback plan. Save the result with source references. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
