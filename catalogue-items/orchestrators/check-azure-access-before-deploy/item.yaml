slug: check-azure-access-before-deploy
name: Check Azure access before deploy
summary: Share a Bicep change and access needs. Get least-access role choices
  and checks of the proposed deployment.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: brief
    required: true
  - type: codebase
    required: false
outputs:
  - type: document
uses:
  - copilot-azure-role-selector
  - copilot-azure-deployment-preflight
  - copilot-devops-rollout-plan
steps:
  - uses: copilot-azure-role-selector
    note: 1. Read skills/copilot-azure-role-selector/SKILL.md. Describe what an
      identity must do. Get the narrow Azure role that fits, with reasons. Save
      the result with source references. Carry the user's goal and all earlier
      findings into this step. If required evidence or tool access is missing,
      mark this step blocked; do not fabricate a result.
  - uses: copilot-azure-deployment-preflight
    note: 2. Read skills/copilot-azure-deployment-preflight/SKILL.md. Share your
      Bicep deployment. Get syntax, permission and proposed-change checks before
      it goes live. Save the result with source references. Carry the user's
      goal and all earlier findings into this step. If required evidence or tool
      access is missing, mark this step blocked; do not fabricate a result.
  - uses: copilot-devops-rollout-plan
    note: 3. Read skills/copilot-devops-rollout-plan/SKILL.md. Share a release or
      infrastructure change. Get preflight checks, rollout stages, health
      signals and a rollback plan. Save the result with source references. Carry
      the user's goal and all earlier findings into this step. If required
      evidence or tool access is missing, mark this step blocked; do not
      fabricate a result.
