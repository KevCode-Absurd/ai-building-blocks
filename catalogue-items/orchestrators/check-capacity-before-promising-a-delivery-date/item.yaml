slug: check-capacity-before-promising-a-delivery-date
name: Check capacity before promising a delivery date
summary: Check if your team can take new work. Get a capacity view, delivery date options with their risks and a draft reply to review before you promise.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: question
    required: true
  - type: spreadsheet
    required: false
outputs:
  - type: plan
  - type: document
uses:
  - team-capacity-planner
  - project-risk-portfolio
  - stakeholder-update-writer
steps:
  - uses: team-capacity-planner
    note: Works out available hours per person in the window against work already committed. Hands the capacity table and the overloaded list to the risk step.
  - uses: project-risk-portfolio
    note: "Uses step 1's capacity table and overloaded list, plus your other jobs and what each waits on. Sets the new request against your other work and flags shared people, waiting dates and the jobs most likely to slip. Hands the risks to the writer."
  - uses: stakeholder-update-writer
    note: "Uses step 1's capacity view and step 2's risks, with the requester as the audience. Turns them into delivery date options with trade-offs, then drafts a short reply for review. It sends nothing."
needs_mode: manual
