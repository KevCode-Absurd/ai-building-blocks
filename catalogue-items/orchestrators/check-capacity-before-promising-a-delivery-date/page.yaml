new_slug: check-capacity-before-promising-a-delivery-date
name: Check capacity before promising a delivery date
headline: Check capacity before promising a delivery date
summary: Check if your team can take new work. Get a capacity view, delivery date options with their risks and a draft reply to review before you promise.
job: organise-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your committed work, how long each job may take, who is free and when, and the new request. It shows what your team can really take on, gives two or three delivery dates with the risk in each, and drafts a reply for you to review.
explain: |-
  A customer asks "can you deliver by the 14th?" and the quick yes is the costly one. It ignores the work already promised, the days people are away and a job that may run long. This workflow checks capacity before you promise a delivery date, so the date you give is one you can keep.

  First it adds up the real hours your people have in the window, minus work you already committed. Then it sets the new request against your other priorities and flags shared people, waiting dependencies and the jobs most likely to slip. Last it writes two or three date options, each with what it assumes and what could go wrong, and a short draft reply.

  Work you already promised stays counted. Each effort guess is shown as a range, and each waiting date is named. Nothing is sent. You choose the date and send the reply yourself.
when:
  - A customer or boss asks for a delivery date and your team is already busy.
  - A new request arrives and you must decide what slips if you take it.
  - Two people promised the same hours to different jobs.
  - You want a date range you can defend, not a best guess.
not_for:
  - The date is already fixed in a contract or signed order. This does not change commitments you have made.
  - You have no list of current work or who is available. Gather that first, or use the Team capacity planner on its own.
  - You want to know what your team's hours earn after costs. Use the Reconcile service capacity and shared cost workflow.
  - You are checking a product mix against machine or plant limits. Use the Product mix capacity checker.
you_give:
  - Your committed work: each job, who is on it and its due date
  - A low, likely and high effort estimate for each job, in hours or days
  - Who is available in the window and for how many hours, after leave and meetings
  - What each job waits on, such as a supplier, a customer reply or a person
  - The new request: what it is, the date asked for and any date that cannot move
  - Your priorities or rules, such as which customers come first (optional)
you_get:
  - A capacity view of available hours against committed work for the window
  - Where people are overloaded and where there is room
  - Two or three delivery date options, each with what it assumes and what could go wrong
  - A draft reply to the requester for you to review before anything is promised
  - The facts still missing, so you know what to confirm
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini and say "Follow HANDOFF.md".
  - Paste your committed work, effort ranges, availability and the new request. A spreadsheet export works.
  - Check the capacity view first. If a person's hours look wrong, fix them before the options are built.
  - Read the date options and the draft reply, edit the reply and send it yourself.
how_it_works:
  - title: Team capacity planner
    text: Works out available hours in the window against committed work, per person. It hands the capacity table and the overloaded list to the next step.
  - title: Project risk and portfolio manager
    text: Sets the new request against your other work and flags shared people, waiting dates and the jobs most likely to slip. It hands the risks to the writer.
  - title: Stakeholder update writer
    text: Turns the capacity and risks into delivery date options with trade-offs, then drafts a short reply to the requester. It does not send it.
output_shape: |-
  CAPACITY VIEW
    Window | hours available per person | hours committed | spare or short

  RISKS
    Shared people | waiting dates | jobs most likely to slip

  DELIVERY OPTIONS
    Option | earliest date | what it assumes | risk | what gives way

  DRAFT COMMITMENT
    A short reply to the requester, for review. Not sent.

  HAND-BACK SUMMARY
    Files | MISSING lines | checks not done
output_sample:
  input:
    - Your committed work, with who is on each job and its due date
    - A low, likely and high effort estimate for each job
    - Who is available in the window, after leave
    - What each job waits on
    - The new request and the date asked for
  prerequisites:
    - An AI that can run code is optional. It helps only if your project data is in a file and you want the risk scripts to run.
  output:
    - name: Capacity view
      contains: Available hours against committed work per person for the window, with who is overloaded and who has room.
    - name: Risk list
      contains: Shared people, waiting dates and the jobs most likely to slip if you take the new work.
    - name: Delivery options
      contains: Two or three dates, each with what it assumes, what could go wrong and what gives way.
    - name: Draft commitment
      contains: A short reply to the requester with the date range and its conditions, for you to review.
    - name: Hand-back summary
      contains: Files saved, facts that could not be checked and the single next step.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file support
      why: They can read a spreadsheet export of your jobs and show each sum. A project tool is not required.
  inputs:
    - Leave and holiday dates for everyone in the window.
    - What happened the last time a similar job ran long.
tweaks:
  - what: Scope
    how: Pick one team and one date window so the sources are comparable.
  - what: Evidence
    how: Paste the real task list and leave dates, not a summary from memory.
  - what: Buffer
    how: Say how much slack you want, such as 20 percent. The options then show dates with that buffer built in.
judge:
  - Existing commitments stay counted when the new work is added.
  - Effort uncertainty is shown as a range and each waiting date is named.
  - Every figure and date traces to a source you gave or is labelled as an assumption.
  - The draft reply promises nothing that the options do not support.
test:
  - Try a small case where you know the true spare hours and compare the capacity view.
  - Remove the effort ranges. The AI should ask for them, not invent them.
  - Change a person's leave dates between two sources. The handoff should flag the conflict.
improve:
  - Keep the actual hours each job took and use them to set better ranges next time.
  - Re-run the first step whenever staffing changes.
  - Add your own rules, such as keeping one day a week free, to the first message.
next:
  - week-plan-from-task-list-maker
  - executive-action-register
terms:
  - term: Capacity
    meaning: The hours your people can really spend on work in a period, after leave, meetings and work already promised.
  - term: Dependency
    meaning: Something a job has to wait for, such as a supplier delivery or a customer sign-off.
