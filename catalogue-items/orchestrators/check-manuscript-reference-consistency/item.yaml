steps:
  - uses: source-note-summariser
    note: "Reads each cited paper you supplied and records its title, authors, date and any identifier that is visible, with the page it saw them on. Leaves missing details blank and does not look up a DOI. Hands step 2 one record per paper."
  - uses: proofreader
    note: "Uses your manuscript and reference list together with step 1's paper records. Cross-checks citation spelling, years, numbering and style, and suggests duplicate candidates for review. It invents no sources and does not treat a metadata match as proof a paper supports a claim."
