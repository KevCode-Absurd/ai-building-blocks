steps:
  - uses: source-note-summariser
    note: Extract publication titles, authors, dates and identifiers actually visible in the supplied cited source files. Keep an evidence location for each and leave missing metadata unresolved; do not invent a DOI lookup or run absent scripts.
  - uses: proofreader
    note: Cross-check manuscript citation spelling, years, numbering and bibliography consistency against the supplied publications and reference list. Suggest duplicate candidates for review; do not invent sources or imply metadata proves a claim.
