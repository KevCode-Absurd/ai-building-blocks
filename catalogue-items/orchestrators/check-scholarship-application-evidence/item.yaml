slug: check-scholarship-application-evidence
name: Check scholarship application evidence
summary: Check your scholarship application against the rules. Get an evidence map, a revised draft within the word limit and a list of documents you still need.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: source_text
    required: false
  - type: copy_draft
    required: false
outputs:
  - type: document
  - type: audit_report
  - type: copy_draft
uses:
  - source-note-summariser
  - unsupported-claim-spotter
  - proofreader
steps:
  - uses: source-note-summariser
    note: "Match each eligibility rule and each claim in the draft to a record you supplied, or mark it MISSING. Keep only the identity details the check needs. Hands step 2 the evidence map."
  - uses: unsupported-claim-spotter
    note: "Uses your draft together with step 1's evidence map. Checks it for achievements, ranks, dates and personal claims that no record supports. Hands step 3 the list of claims to cut, soften or back with a document."
  - uses: proofreader
    note: "Polishes your real draft within the word limit, in your own voice, and applies step 2's cuts and softening only where you agreed. Changes no fact and adds no claim. Hands back the revised draft and the missing documents list."
