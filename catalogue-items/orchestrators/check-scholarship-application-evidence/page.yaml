new_slug: check-scholarship-application-evidence
name: Check scholarship application evidence
headline: Check scholarship application evidence
summary: Check your scholarship application against the rules. Get an evidence map, a revised draft within the word limit and a list of documents you still need.
job: write-and-tell-stories
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your draft, the funder's eligibility rules and the records that back your claims. Your AI maps each rule and claim to a record, flags what has no proof and polishes the draft without adding facts.
explain: |-
  A scholarship application fails in two quiet ways. A claim has no proof you can hand over, or a rule is met in real life but not shown in the draft. This workflow checks both before you submit.

  It maps each eligibility rule and each claim in your draft to a record you supplied, such as a transcript, an award letter or an activity list. Anything with no record is marked MISSING. It then looks again at the draft for achievements, ranks and dates that nothing supports. Last it polishes your wording inside the word limit. It keeps your voice and adds no fact.

  It does not decide if you qualify. Only the funder does that. It also never invents an award, a story or a personal detail to fill a gap.
when:
  - You have a draft essay and the scholarship asks for proof of grades, awards or service
  - You are not sure your draft shows that you meet each rule on the funder's page
  - A teacher, parent or advisor is helping and wants to see what is backed by documents
  - The deadline is close and you need to know which documents to chase first
not_for:
  - You need a ruling on whether you qualify. Only the funder decides. Read their official rules or ask them.
  - You are writing a grant for an organisation, not a scholarship for a person. Use the Nonprofit grant proposal writer.
  - You only want a grammar pass on your text. Use the Proofreader.
  - You are checking claims in an article or ad. Use the Unsupported claim spotter.
you_give:
  - Your application draft or essay
  - The funder's eligibility rules and word limit, copied from their page
  - The records that back your claims, such as transcripts, award letters and activity lists. Share only what you may share, and leave out ID numbers
  - The official deadline (optional)
  - Parts of the draft you want left as they are (optional)
you_get:
  - "An evidence map: each rule and claim matched to a record, or marked MISSING"
  - A list of claims with no support, such as an award, a rank or a date
  - A revised draft within the word limit, in your voice, with no new facts
  - "A missing documents list: what to get, which claim it backs and who can supply it"
  - A hand-back summary with one next step
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini and say "Follow HANDOFF.md".
  - Paste your draft and the funder's rules. Add your records. Remove ID numbers and anything private you do not need to share.
  - Read the evidence map first. Every MISSING row is a document to find or a claim to cut.
  - Read the revised draft against your own story. Change anything that is not true to you. Then check the funder's rules yourself before you submit.
how_it_works:
  - title: Source note summariser
    text: Matches each eligibility rule and each claim to a record you gave it, and marks gaps. It keeps only the identity details the check needs and hands on the evidence map.
  - title: Unsupported claim spotter
    text: Finds achievements, ranks, dates and personal claims in the draft that no record supports. It hands on the claims to cut, soften or back with a document.
  - title: Proofreader
    text: Polishes the real draft inside the word limit, in your voice. It adds no fact and hands back the revised draft.
output_shape: |-
  EVIDENCE MAP
  Rule or claim | Where in the draft | Record that backs it | Status (backed, partly backed, MISSING)

  UNSUPPORTED CLAIMS
  Claim | Why it has no support | Cut, soften or back with

  REVISED DRAFT
  <draft within the word limit, with word count>

  MISSING DOCUMENTS
  Document | Claim it backs | Who can supply it | Needed by

  HAND-BACK SUMMARY
  Files | MISSING lines | Checks missed | One next step
output_sample:
  input:
    - Your application draft or essay
    - The funder's eligibility rules and word limit
    - The records that back your claims, shared with consent
    - The official deadline (optional)
  prerequisites:
    - An AI that can read your files or pasted text
  output:
    - name: Evidence map
      contains: Each rule and claim matched to a record, with a status of backed, partly backed or MISSING.
    - name: Unsupported claims
      contains: Achievements, ranks and dates with no record, and whether to cut, soften or back each one.
    - name: Revised draft
      contains: Your draft polished inside the word limit, in your voice, with no new facts.
    - name: Missing documents list
      contains: Each document to get, the claim it backs and who can supply it.
    - name: Hand-back summary
      contains: Files saved, MISSING facts, checks not done and one next step.
tweaks:
  - what: Scope
    how: Check one application at a time, against one funder's rules.
  - what: Evidence
    how: Share the real records with dates, not what you remember.
  - what: Acceptance
    how: Every claim is backed, softened or cut. Nothing is invented to fill a gap.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file support
      why: They read your draft and records and keep each step's result as a file. None of them can confirm your record with the school or the funder.
  inputs:
    - The funder's rules page, saved as a file or pasted in full.
    - A teacher or advisor who can check the revised draft is true to you.
judge:
  - Achievements and eligibility claims stay truthful; no identity, award or personal history is invented.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
next:
  - proofreader
  - unsupported-claim-spotter
terms:
  - term: Evidence map
    meaning: A table that ties each rule and claim to the record that proves it.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
