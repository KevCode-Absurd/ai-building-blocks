new_slug: check-staged-follow-on-commitments
name: Check staged follow-on commitments
headline: Check staged follow-on commitments
summary: Check how much to invest in two companies' next rounds, whether your reserve covers it, and what a milestone lets you draw.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it your side letters, the round confirmations and one staged commitment. Your AI works out your share of each round, compares the total with your reserve, and checks the draw against the signed commitment and milestone proof.
explain: |-
  A fund that holds pro rata rights in two companies may face two rounds at once. One of them may be a staged deal, where cash is released only after a milestone is met. Funds then need three numbers that people confuse: the amount planned, the amount approved and the cash actually drawn. This workflow keeps them apart.

  Step 1 works out your share of each round, using each company's own eligible stake. Step 2 compares both needs with the reserve the fund has set aside. Step 3 applies only to the staged company. It compares the request with the signed undrawn commitment and the milestone-approved ceiling.

  Nothing is assumed about a milestone or a financing that has not been evidenced. Sample company figures are never used as real ones.
when:
  - Two portfolio companies are raising at the same time and you hold pro rata rights in both.
  - An investment committee asks if your reserve covers both follow-on rounds.
  - A staged commitment has a milestone signed off and you want to know what can be drawn.
  - You are setting the follow-on reserve for the next year.
not_for:
  - "You hold rights in one company only: use the Investor pro rata funding calculator."
  - "You first need to find your stake after a SAFE converts: use the SAFE ownership and funding checker workflow."
  - "You only need to compare reserve with rounds already known: use the Follow-on investment cash planner."
you_give:
  - Side letters and outside-only allocations for both companies (from the signed agreements)
  - Round confirmations that show the full round including your cash, for each company
  - The fund's approved follow-on reserve (from the investment committee minutes)
  - The signed staged commitment for one company, with the cash already drawn
  - The milestone approval evidence for that company
you_get:
  - Your pro rata cash for each company's round
  - The total need against your reserve, with any gap
  - The most you can draw on the staged commitment, with the evidence for it
  - Planned, approved and funded cash shown as three separate lines
  - A list of missing facts and checks that could not run
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini, in a chat that accepts files.
  - Attach the side letters, round confirmations, reserve approval and staged commitment. Say which company is staged, plus the currency and scale.
  - Ask your AI to follow the pack and save each step's file.
  - After step 1, check each company's stake and round size against its own documents. After step 2, check the reserve matches the committee approval.
  - After step 3, check the milestone evidence is signed. Finish every MISSING line before you commit cash.
how_it_works:
  - title: Pro rata allocation checker
    text: Applies the outside-only method to each company with its own eligible stake. Saves each full round and each participation need as its own record. Hands step 2 the two cash needs.
  - title: Follow-on reserve planner
    text: Compares both needs with the reserve the fund has set aside, using the checked rounds and documented targets. Shows the gap. Hands step 3 the planned amount for the staged company.
  - title: Milestone tranche funding checker
    text: For the staged company only, compares the request with its signed undrawn commitment and the milestone-approved ceiling. Keeps the unsupported planned reserve apart from cash that is authorized to draw.
output_shape: |-
  SCOPE AND SOURCES       <side letters, round confirmations, reserve approval, commitment, dates>
  PRO RATA PER COMPANY    <eligible stake | full round | your cash> for each company
  RESERVE                 <reserve | total need | gap>
  STAGED DRAW             <request | undrawn commitment | milestone ceiling | authorized draw | unsupported>
  MISSING                 <each gap and what it stops>
  CHECKS MISSED          <one line each, or none>
tweaks:
  - what: Target share
    how: Change the share you want to hold after a round. The cash needed for that company, the total need and the gap change.
  - what: Reserve
    how: Change the approved reserve. The headroom or gap changes, and the staged draw does not.
  - what: Milestone ceiling
    how: Change the approved ceiling. The authorized draw is the smallest of the request, the ceiling and the undrawn commitment.
  - what: Workbook
    how: Say you want a spreadsheet. Inputs, formulas and checks sit on separate sheets.
judge:
  - Planning allocation, approved commitment and funded cash remain separate; no milestone or financing availability is inferred.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Keep each company's stake, share count and target share on one line, and paste it in each run.
  - Save the milestone sign-off next to step 3, so the ceiling can be traced.
  - Run the Check secondary purchase cash exposure workflow next if the fund also buys a stake from another investor.
works_best_with:
  tools:
    - name: A spreadsheet tool and an AI that reads files
      why: Two companies and three steps means many linked figures. The AI should recalculate and keep each source traceable.
  inputs:
    - The investment committee minutes that set the reserve.
    - The company's milestone sign-off or board consent.
terms:
  - term: Pro rata right
    meaning: Your right to invest in a later round to keep your percentage.
  - term: Follow-on reserve
    meaning: Cash a fund sets aside for later rounds in companies it already owns.
  - term: Staged commitment
    meaning: A promise to invest in parts, each released when a milestone is met.
  - term: Undrawn commitment
    meaning: The part of a staged commitment not yet paid in.
  - term: Reconciliation
    meaning: A comparison that explains any difference between two sets of figures that should match.
output_sample:
  input:
    - Side letters and round confirmations for two companies
    - The fund's approved follow-on reserve
    - The staged commitment and milestone evidence for one company
  prerequisites:
    - An AI that can read files
  output:
    - name: outputs/step-1-pro-rata-allocation-checker.md
      contains: Your cash for each company's round, each with its own eligible stake.
    - name: outputs/step-2-follow-on-reserve-planner.md
      contains: Total cash need against the reserve, with any gap.
    - name: outputs/step-3-milestone-tranche-funding-checker.md
      contains: The authorized draw on the staged commitment, and the part with no evidence.
    - name: HAND-BACK SUMMARY
      contains: Files saved, sources used, assumptions, MISSING lines, checks missed and one suggested next step.
