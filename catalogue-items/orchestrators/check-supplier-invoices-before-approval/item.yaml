slug: check-supplier-invoices-before-approval
name: Check supplier invoices before approval
summary: Share the source files. Get a matched invoice register and a list of amounts needing investigation.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
