  - {uses: angry-customer-reply-checker, note: "Every promise checked against what you can do, every fact against the ticket, every line for tone, and a repaired reply where one fails. The complaint is the ticket itself."}
  - {uses: solved-ticket-help-page-writer, note: "A help page for each solved problem: the steps, what the customer should see, and a fix for next time, written for someone who has never written in."}
