slug: clear-your-support-inbox-and-turn-fixes-into-help-pages
name: "Clear your support inbox and turn fixes into help pages"
summary: "Give it your open tickets. Get them sorted, checked replies to send and a help page per fix."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: beginner
inputs:
  - {type: source_text, required: true}
  - {type: question, required: true}
  - {type: voc_reviews, required: false}
outputs:
  - {type: spreadsheet}
  - {type: copy_draft}
  - {type: document}
uses: [support-ticket-sorter, customer-reply-drafter, angry-customer-reply-checker, solved-ticket-help-page-writer]
steps:
  - {uses: support-ticket-sorter, note: "Classifies each ticket, ranks it by how much harm a slow reply would do, routes it to the right person and gives it a first line. Hands the sorted ticket list to the reply step."}
  - {uses: customer-reply-drafter, note: "Uses step 1's sorted tickets. Writes a full reply for each in your voice, with a note on what to check in your systems before you send it. Hands the draft replies to the checker."}
  - {uses: angry-customer-reply-checker, note: "Uses step 2's draft replies and the complaint in each ticket. Checks every promise against what you can do, every fact against the ticket and every line for tone, and repairs a reply where one fails. Hands the checked replies and notes to the help page step."}
  - {uses: solved-ticket-help-page-writer, note: "Uses step 3's checked replies for the solved problems. Writes a help page for each: the steps, what the customer should see, and a fix for next time, written for someone who has never written in."}
origin: own
version: 1.0.0
example_pending: true
