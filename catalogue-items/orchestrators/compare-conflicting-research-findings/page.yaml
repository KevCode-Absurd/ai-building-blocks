new_slug: compare-conflicting-research-findings
name: Compare conflicting research findings
headline: Compare conflicting research findings
summary: Compare research papers that disagree, in one pass. Get a claims table, a disagreement map and the evidence gaps, with a table or section for each claim.
job: research-topics
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it two or more full papers on the same question. It records each paper's claims, who was studied and how, then maps where they agree, where they disagree and whether the results can be compared at all. You get a comparison table, a disagreement map and a list of what is still unknown.
explain: |-
  Two papers on the same question can reach opposite results. Often they did not measure the same thing. One studied adults and the other studied children. One counted a symptom and the other counted a diagnosis. One was a trial and the other a survey. This workflow compares conflicting research findings by checking that first, so you do not write "the evidence is mixed" when the papers never faced each other.

  Step 1 reads the full papers and builds a map: each paper's claims, the population, outcome and design, and a verdict on which results can be compared directly. Every cell points to a section or table. Step 2 reads the summary written in step 1 against the papers again. It flags wording that stretches past the data, such as a cause-and-effect claim from a survey, or "all patients" from one clinic.

  It works only from the papers you give it. It does not search databases, pool results or rank the papers. It marks each conflict as real, explained by a difference in design, or unclear, and says what would settle it.
when:
  - Two studies on the same question reached opposite results and you need to explain why.
  - You are writing a literature review and your sources disagree.
  - A new paper contradicts one you already cite.
  - A supervisor or editor asks why two sets of results differ.
not_for:
  - You have one paper and want its claims and evidence. Use the Source note summariser.
  - You want an answer to a question, with sources found for you. Use the Cited research assistant.
  - You are running a formal systematic review or a meta-analysis. This workflow compares only the papers you give it and does not search or pool results.
  - You want a record that updates when a new paper arrives. Use the Research contradiction review assistant.
you_give:
  - Two or more full papers on the same question, as PDFs or pasted text (abstracts alone are not enough)
  - Your research question, in one sentence
  - The outcome you want compared, such as survival or test scores (optional)
  - Your own written summary of the papers, if you have one, to check its wording (optional)
you_get:
  - A comparison table with each claim, what each paper says about it and where in the paper
  - A comparability note that says which results measure the same thing and which do not
  - A disagreement map that marks each conflict as real, explained by design, or unclear
  - A list of evidence gaps and what would settle each conflict
  - A wording check that flags overgeneralization and cause-and-effect claims the designs do not support
how_to_use:
  - Download the pack and give it to an AI that can read files, such as Claude, ChatGPT or Gemini.
  - Attach the full papers, not only abstracts. Paste your research question in one sentence.
  - After step 1, open one table or section the AI cites for each paper. Check that it says what the comparison table says.
  - Read the comparability note before the disagreement map. If two papers measure different things, do not treat their results as a contest.
  - After step 2, change any sentence in your own write-up that the wording check flags. A wording check is not a verdict on which paper is right.
how_it_works:
  - title: Research literature comparison
    text: "Reads the full papers and builds the claims table, the comparability note and the contested findings, with a section or table for each. Hands step 2 the written comparison."
  - title: Unsupported claim spotter
    text: "Reads that written comparison against the papers again. Marks overgeneralization and cause-and-effect language beyond the actual design. This pass checks wording and is not an independent verdict on which paper is true."
output_shape: |-
  COMPARISON TABLE   <claim | paper A (section or table) | paper B (section or table) | paper C>
  COMPARABILITY      <population | outcome | design | measure: what can and cannot be compared>
  DISAGREEMENT MAP   <conflict | paper A says | paper B says | real, explained by design, or unclear | what would settle it>
  EVIDENCE GAPS      <what no paper covers>
  WORDING CHECK      <sentence | problem | safer wording>
  FILES              <each saved file>
  MISSING            <each gap and the line it stops>
  CHECKS MISSED      <one line each, or none>
  NEXT STEP          <one step>
output_sample:
  input:
    - Two or more full papers on the same question
    - Your research question, in one sentence
    - The outcome you want compared (optional)
  prerequisites:
    - An AI that can read PDFs or pasted text, such as Claude, ChatGPT or Gemini
  output:
    - name: Comparison table
      contains: Each claim with what each paper says about it and the section or table where it says so.
    - name: Comparability note
      contains: Which results measure the same thing in the same kind of people, and which do not.
    - name: Disagreement map
      contains: Each conflict marked real, explained by design or unclear, with what would settle it.
    - name: Evidence gaps
      contains: Questions none of the papers answers.
    - name: Wording check
      contains: Sentences that claim more than the designs support, each with safer wording.
tweaks:
  - what: The question
    how: Write it as one sentence with the group and the outcome. A vague question gives a vague map.
  - what: The outcome
    how: Name the outcome to compare. Papers often report several, and the map follows the one you choose.
  - what: Your own summary
    how: Paste a draft that summarises the papers. The wording check then reads your sentences, not only the comparison.
  - what: Full text
    how: Give the full text. Without the methods and tables, comparability is marked MISSING.
judge:
  - Different populations, outcomes and designs are not ranked as if they measured the same thing.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Save the comparison table. When a new paper arrives, add one column instead of starting again.
  - Keep a note of each conflict marked unclear, and check it when new evidence appears.
  - Ask the AI to rerun step 2 on your final draft before you submit it.
works_best_with:
  tools:
    - name: A capable chat AI with file support
      why: Reads several full papers at once and keeps section references straight.
  inputs:
    - The full text of each paper, not only the abstract.
    - Supplementary tables if the methods sit there.
    - A supervisor or co-author who knows the field and can check the comparability note.
terms:
  - term: Comparability
    meaning: Whether two results measured the same outcome in the same kind of people in a way that allows a fair comparison.
  - term: Overgeneralization
    meaning: Claiming a result applies to more people or settings than the study covered.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
