new_slug: compare-freight-quotes-with-all-charges
name: Compare freight quotes with all charges
headline: Compare freight quotes with all charges
summary: Compare freight quotes on the same shipment with every charge counted. Get a side-by-side table, what each quote leaves out and questions to ask.
job: plan-supply-chain
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it two or more freight quotes for the same load and route. Your AI lines up every charge, adds each total again and shows what each quote leaves out. A charge it cannot see is marked unknown, never zero.
explain: |-
  A freight quote with the lowest headline price is often not the cheapest. One carrier adds fuel, handling and delivery on top. Another bundles them in. Comparing the totals only shows who quoted what, not who costs less.

  Step 1 puts each quote on the same footing: same route, same load, same delivery point. It lists every charge line by line. Step 2 adds the lines up again, using the units and currency of each quote, so a wrong total shows up. A quote is converted to another currency only with a rate you give.

  Transit times are the carrier's estimates, not promises. This workflow compares price and scope. It does not book a carrier or check customs.
when:
  - Two forwarders quote the same pallets and one price looks too good.
  - A quote says "plus surcharges" and you need the real total.
  - You ship the same route often and want to choose on full cost, not just the base rate.
  - Quotes arrive in different currencies or for different delivery points.
not_for:
  - "You ship parcels on a courier rate card: use the Freight mode and carrier picker."
  - "You want the cost per unit after freight and duty: use the Landed cost calculator."
  - "A freight invoice has arrived and you want to check it: use the Supplier invoice and receipt checker workflow."
  - "You need customs or duty advice: ask your customs broker."
you_give:
  - Two or more freight quotes for the same route (from carriers or forwarders, as PDFs or pasted text)
  - "The load: what is shipped, and its weight, volume or pallet count"
  - Where it picks up and where it delivers, such as door, port or warehouse
  - The service you need, such as a delivery deadline or insurance (optional)
  - Exchange rates to use, if quotes are in different currencies (optional)
you_get:
  - Every charge from every quote, side by side in one table
  - A recomputed total per quote, with any gap from the stated total
  - What each quote includes and leaves out
  - Questions to send each carrier to close the gaps
  - The quote that costs least on the same basis, or why that cannot be said yet
how_to_use:
  - Gather the quotes and write down the load and the delivery points. Remove anything private you do not need to share.
  - Give the pack to Claude, ChatGPT or Gemini. Attach the quotes and paste the load details.
  - If the quotes use different currencies, paste the exchange rates you want used. Otherwise each quote stays in its own currency.
  - Check the charge table. Look for lines marked unknown. Those are the questions to ask the carrier.
  - Send the questions yourself, then run the workflow again with the answers.
how_it_works:
  - title: Vendor comparison writer
    text: "Puts each quote on the same route and load basis and lists every charge line by line: base, fuel, handling, insurance, delivery and others. Notes what each quote includes and leaves out. Hands step 2 one charge table per quote, with units and currency."
  - title: Invoice totals checker
    text: "Adds each quote's lines again with their units and currency, then shows the stated total, the recomputed total and the gap. Uses only the exchange rates and tax treatment you supplied. Check first: no unknown charge was added as a number."
output_shape: |-
  QUOTE TABLE
    carrier | route | load basis | base | fuel | handling | insurance | delivery | other | stated total | recomputed total | currency | transit estimate
  INCLUDED AND LEFT OUT   <per quote>
  GAPS                    <UNKNOWN charges and MISSING rates>
  QUESTIONS               <one list per carrier, to close the gaps>
  LEAST COST              <quote, or "cheapest so far" with the open items>
  FILES SAVED             <each file and the step that made it>
  CHECKS MISSED           <one line each, or none>
output_sample:
  input:
    - Two or more freight quotes for the same route
    - The load, its weight or volume, and the delivery points
    - Exchange rates to use (optional)
    - The service you need (optional)
  prerequisites:
    - Quotes as PDFs, pasted text or a spreadsheet
  output:
    - name: Quote table
      contains: Every charge from every quote in one row each, with stated and recomputed totals.
    - name: Included and left out
      contains: For each quote, what the price covers and what it does not.
    - name: Gaps
      contains: Charges no quote shows, marked unknown, and exchange rates still missing.
    - name: Questions
      contains: A draft list for each carrier to close the gaps.
    - name: Least cost
      contains: The cheapest quote on the same basis, or cheapest so far with open items.
tweaks:
  - what: Load
    how: Add exact weight, volume or pallets. Quotes for different loads are then shown apart, not mixed.
  - what: Currency
    how: Paste the rate you want used. Without it, each quote stays in its own currency.
  - what: Service
    how: Add a delivery deadline or insurance need. Quotes that cannot meet it are flagged.
judge:
  - Included and excluded charges stay visible; transit estimates are not guaranteed arrival times.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Ask each carrier the questions in the brief and run the workflow again with their answers.
  - Keep one list of charge types that carriers add to quotes, and paste it into the next run.
  - Save the final table with the date, so you can compare next quarter's quotes.
works_best_with:
  tools:
    - name: A chat AI that reads files, such as Claude, ChatGPT or Gemini
      why: It reads quotes in PDF or text and keeps the charge lines side by side. A spreadsheet export helps with long quotes.
  inputs:
    - The carrier's rate sheet, not only the summary email.
    - Your own delivery deadline for the load.
terms:
  - term: Lane
    meaning: The route from where freight is picked up to where it is delivered.
  - term: Surcharge
    meaning: An extra fee on top of the base freight rate, such as for fuel.
  - term: Load basis
    meaning: How the load is measured for pricing, such as by weight, volume or pallet.
