new_slug: compare-merger-cash-election-outcomes
name: Compare merger cash election outcomes
headline: Compare merger cash election outcomes
summary: Compare fixed-ratio market value with the documented cash-election proration branch.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A baseline value comparison and one cash-election holder allocation. Share actual base fixed-ratio consideration, eligible target shares, dated acquirer price, post-reservation cash-election pool, separate election ratios and holder election shares.
explain: |-
  A baseline value comparison and one cash-election holder allocation.

  Merger consideration. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need a baseline value comparison and one cash-election holder allocation.
  - You work on merger consideration and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Actual base fixed-ratio consideration, eligible target shares, dated acquirer price, post-reservation cash-election pool, separate election ratios and holder election shares.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A baseline value comparison and one cash-election holder allocation.
  - Original step files, financial assumptions, source coverage and a governing handoff summary.
  - Reconciliation results, unresolved inputs and actual checks completed.
how_to_use:
  - Download the complete pack and read its governing SKILL.md.
  - Share the actual sources and the financial question you need answered.
  - Ask your AI to follow the methods, preserve original files and stop affected work on missing evidence.
  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Fixed exchange consideration checker
    text: Value the signed base fixed-ratio stock and cash legs at the dated acquirer price, preserving issued share count and ratio.
  - title: Cash stock election checker
    text: Use the distinct cash-election replacement ratio and actual post-reservation cash pool, not a presumed reuse of the base ratio. Compare the holder allocation with base value without summing mutually exclusive outcomes.
output_shape: |-
  A baseline value comparison and one cash-election holder allocation.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Base consideration and cash-election alternatives remain separate; neither is a complete all-holder election solver.
judge:
  - Base consideration and cash-election alternatives remain separate; neither is a complete all-holder election solver.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Create, recalculate, render and reopen the requested native workbook.
  inputs:
    - Dated primary financial records and the applicable contractual definitions.
    - A named reviewer and an explicit financial question.
terms:
  - term: Illustrative figures
    meaning: Practice inputs showing calculation behavior, with no claim about an actual company or investment.
  - term: Reconciliation
    meaning: An independent comparison that explains a difference between matching records or financial schedules.
