steps:
  - uses: supplier-quote-comparer
    note: "Put every quote on the same unit and currency in one table. Flag exclusions, lead-time gaps and payment differences, and work out cash up front and landed cost. Pass the table to step 2."
  - uses: supplier-risk-scorecard-builder
    note: "Rate each supplier's risk using only the financial, quality, capacity and delivery evidence you supplied, not step 1's table. It takes the supplier names and flagged gaps (lead time, payment terms) from step 1's table to know who to rate. Mark areas with no evidence. Do not use example weights or buffers as facts."
