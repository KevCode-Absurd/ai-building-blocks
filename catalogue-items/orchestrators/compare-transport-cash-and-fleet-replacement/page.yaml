how_it_works:
  - title: Freight trip contribution builder
    text: Build current trip cash contribution from actual loaded and empty kilometers. Preserve measured fuel and maintenance amounts and derive same-workload annual cost only with documented annual trip counts.
  - title: Fleet replacement cash comparer
    text: Use sourced incremental annual operating differences, actual purchase/sale timing and terminal value to compare replacement cash. Do not substitute trip contribution for savings; disclose workload, downtime, tax and financing gaps. Carry the signed new-minus-keep terminal proceeds difference, not new-vehicle sale proceeds alone.
output_shape: |-
