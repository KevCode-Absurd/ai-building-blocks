tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Both vehicle cases carry the same workload; actual trip cost changes support annual savings; vehicle capital is not deducted twice. The terminal cash difference is replacement minus keep; the foregone old-vehicle terminal sale is not omitted.
judge:
