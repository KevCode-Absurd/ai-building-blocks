slug: competitor-ads-to-original-script
name: Competitor Ads to Original Script
summary: "Studies ads you collected from public ad libraries and turns what works into an original script of your own."
category: orchestrator
boards: [ecommerce]
type: workflow
role: orchestrate
job: ads
level: advanced
inputs:
  - {type: reference_set, required: true}
  - {type: brand_brain, required: true}
  - {type: voc_reviews, required: true}
  - {type: product_data, required: true}
  - {type: ad_copy, required: true}
  - {type: competitor_set, required: false}
outputs:
  - {type: script}
  - {type: audit_report}
uses: [competitor-ad-swipe-board, competitor-ad-teardown-brief, script-from-reference-idea, read-aloud-script-polish, meta-ad-policy-check]
steps:
  - {uses: competitor-ad-swipe-board, note: "Sort the collected ads and keep the few worth learning from."}
  - {uses: competitor-ad-teardown-brief, note: "Break down why they work and brief your own version."}
  - {uses: script-from-reference-idea, note: "Write an original script from the idea, with your product and your buyers' words."}
  - {uses: read-aloud-script-polish, note: "Polish it so it sounds natural spoken."}
  - {uses: meta-ad-policy-check, note: "Check it against ad policy."}
origin: own
version: 1.0.0
