how_it_works:
  - title: Contracted energy cash model
    text: Build operating cash by accepted MWh and actual contract terms. Pass each annual cash result and separately excluded nonoperating adjustments, preserving generation forecasts as assumptions.
  - title: Project cash available bridge
    text: Convert operating cash to contract CFADS each year, explicitly avoiding a second deduction of variable and fixed operating cash already included in the energy model. Declare the source basis. For actual cash receipts/payments or already-cash operating results, do not deduct receivable/payable working-capital settlement again; explicitly omit it only after reconciliation. For accrual revenue/cost proxies, use the signed working-capital bridge with noncash expenses excluded. Never combine these two routes.
  - title: Loan life cash cover checker
    text: Calculate remaining-loan-horizon coverage using the same eligible annual cash series, actual loan balance and contractual discount basis. Preserve downside generation or price changes as separate scenarios.
