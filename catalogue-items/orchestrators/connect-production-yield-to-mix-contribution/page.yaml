thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A yield-linked product contribution and capacity comparison. Share measured batch input/good/scrap quantities and recovery cash for each proposed product, proposed output units, selling prices and verified bottleneck hours.
explain: |-
  A yield-linked product contribution and capacity comparison.

  Manufacturing finance planning. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need a yield-linked product contribution and capacity comparison.
  - You work on manufacturing finance planning and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Measured batch input/good/scrap quantities and recovery cash for each proposed product, proposed output units, selling prices and verified bottleneck hours.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A yield-linked product contribution and capacity comparison.
