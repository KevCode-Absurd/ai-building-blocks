steps:
  - uses: toll-revenue-ramp-model-builder
    note: Build annual toll cash from the supplied chargeable passages before collection loss, realized tariff and collection assumptions. Hand annual operating cash and excluded tax/capital/working-capital items into the qualification bridge. Use chargeable passages before collection loss, not passage counts already paid in cash.
  - uses: project-cash-available-bridge
    note: Convert each annual toll operating cash result into financing-defined CFADS. Since operating costs were already deducted upstream, record that source basis and avoid deducting them twice. Declare the source basis. For actual cash receipts/payments or already-cash operating results, do not deduct receivable/payable working-capital settlement again; explicitly omit it only after reconciliation. For accrual revenue/cost proxies, use the signed working-capital bridge with noncash expenses excluded. Never combine these two routes.
  - uses: debt-repayment-sculpting-planner
    note: Use the resulting annual eligible cash series to calculate debt service and principal. Preserve traffic sensitivity as a scenario, show interest gaps and maturity residual and never claim a forecast proves repayment.
