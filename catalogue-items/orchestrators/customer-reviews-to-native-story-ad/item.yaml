slug: customer-reviews-to-native-story-ad
name: Customer Reviews to Native Story Ad
summary: "Plans a native story ad from customer reviews, writes it for cold buyers, briefs its image and checks it against ad policy."
category: orchestrator
boards: [ecommerce]
type: workflow
role: orchestrate
job: ads
level: advanced
inputs:
  - {type: voc_reviews, required: true}
  - {type: product_data, required: true}
  - {type: persona, required: false}
  - {type: landing_page, required: false}
outputs:
  - {type: image_prompt}
  - {type: audit_report}
uses: [native-story-ad-setup-sheet, cold-traffic-native-story-ad-writer, native-ad-image-brief-writer, meta-ad-policy-check]
steps:
  - {uses: native-story-ad-setup-sheet, note: "Decide the narrator, the tension and the test from the reviews."}
  - {uses: cold-traffic-native-story-ad-writer, note: "Write the story ad for people who have never heard of you."}
  - {uses: native-ad-image-brief-writer, note: "Pick the right native image type and write its prompt."}
  - {uses: meta-ad-policy-check, note: "Check the copy and image plan against ad policy."}
origin: own
version: 1.0.0
