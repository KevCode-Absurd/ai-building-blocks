slug: document-a-dataset-analysis-for-reproduction
name: Document a dataset analysis for reproduction
summary: Write down how a dataset analysis was done so someone else can repeat it. Get a data inventory, a method procedure and a list of unsupported claims.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: dataset
    required: true
  - type: document
    required: false
  - type: spreadsheet
    required: true
outputs:
  - type: document
  - type: audit_report
uses:
  - spreadsheet-checker
  - process-and-sop-writer
  - unsupported-claim-spotter
steps:
  - uses: spreadsheet-checker
    note: Inspects the data and any workbook for what a row means, units, missing values, duplicates and totals that reconcile. Covers only the file types and tools it can use. Hands the inventory to step 2.
  - uses: process-and-sop-writer
    note: "Uses your own commands, workbook and software list, not step 1's file, and takes units and exclusions from the step 1 inventory. Writes the analysis as a procedure: inputs, software, order of steps, settings, output paths and failure checks. Original data stays untouched. Hands the procedure to step 3."
  - uses: unsupported-claim-spotter
    note: Reads your methods draft (your own text) and step 2's procedure for claimed checks or cause-and-effect statements that the files and run evidence do not show.
