slug: draft-revision
name: "Revise a draft with the door open"
summary: "Revise a story or book draft in seven steps. Paste a rested draft; get holes marked, a 10% cut, plain words and a reader plan."
category: orchestrator
type: workflow
role: orchestrate
job: analysis
level: intermediate
inputs:
  - {type: document, required: true}
  - {type: feedback_notes, required: false}
outputs:
  - {type: plan}
  - {type: document}
uses: [cold-reread-marker, hidden-theme-finder, ten-percent-cutter, plain-english-editor, dialogue-ear-checker, first-reader-question-writer, reader-feedback-sorter]
steps:
  - {uses: cold-reread-marker, note: "A page-by-page list of what is wrong, large and small. Hands the list of what recurs to step 2."}
  - {uses: hidden-theme-finder, note: "A one-line meaning and the scenes to add, sharpen or drop for it. Hands the theme plan to step 3."}
  - {uses: ten-percent-cutter, note: "The draft at 90% of its length, with a log of what went. Hands the cut draft to step 4."}
  - {uses: plain-english-editor, note: "Plain words in place of timid ones. Hands the edited draft to step 5."}
  - {uses: dialogue-ear-checker, note: "Dialogue that rings true, with a score and each fix shown. Skipped if the draft has no dialogue."}
  - {uses: first-reader-question-writer, note: "A short question sheet to send with the draft. The run pauses here for your readers."}
  - {uses: reader-feedback-sorter, note: "Uses your readers' notes, which come back after the pause in step 6, not step 6's question sheet. Hands you a ranked rewrite list."}
origin: rebuilt
version: 1.0.0
minds: [stephen-king, william-zinsser]
credits:
  - {title: "On Writing: A Memoir of the Craft", by: "Stephen King", used: "The order of the steps: re-read it cold, find what it is about, cut ten percent, clean up timid wording, check how the talk sounds, plan what to ask your readers, sort what readers said"}
