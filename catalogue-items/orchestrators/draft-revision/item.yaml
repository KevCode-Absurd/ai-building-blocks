slug: draft-revision
name: "Revise a draft with the door open"
summary: "Paste a rested draft. Get its holes marked, its meaning found, a cut of 10%, plain wording and a reader plan."
category: orchestrator
type: workflow
role: orchestrate
job: analysis
level: intermediate
inputs:
  - {type: copy_draft, required: true}
outputs:
  - {type: plan}
uses: [cold-reread-marker, hidden-theme-finder, ten-percent-cutter, plain-english-editor, dialogue-ear-checker, first-reader-question-writer, reader-feedback-sorter]
steps:
  - {uses: cold-reread-marker, note: "A page-by-page list of what is wrong, large and small."}
  - {uses: hidden-theme-finder, note: "A one-line meaning and the scenes to add, sharpen or drop for it."}
  - {uses: ten-percent-cutter, note: "The draft at 90% of its length, with a log of what went."}
  - {uses: plain-english-editor, note: "Plain words in place of timid ones."}
  - {uses: dialogue-ear-checker, note: "Dialogue that rings true, with a score and each fix shown."}
  - {uses: first-reader-question-writer, note: "A short question sheet to send with the draft."}
  - {uses: reader-feedback-sorter, note: "A ranked rewrite list from many readers' notes."}
origin: rebuilt
version: 1.0.0
minds: [stephen-king, william-zinsser]
credits:
  - {title: "On Writing: A Memoir of the Craft", by: "Stephen King", used: "The order of the steps: re-read it cold, find what it is about, cut ten percent, clean up timid wording, check how the talk sounds, plan what to ask your readers, sort what readers said"}
