slug: draft-your-due-task-followups
name: Draft your due task follow ups
summary: Share due tasks and their threads. Get checked follow-up drafts in your
  voice, ready for review.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: plan
    required: true
  - type: source_text
    required: true
  - type: brand_brain
    required: false
outputs:
  - type: document
uses:
  - executive-due-task-drafts
  - draft-brand-voice-checker
steps:
  - uses: executive-due-task-drafts
    note: "1. Read skills/executive-due-task-drafts/SKILL.md. Take the tasks due in your date window and match each to its email thread and recipient. Write one follow-up email draft per need with To, CC, subject and body. Link each to its task ID and thread ID, list missing facts and keep the send status clear. Hands the drafts to step 2. Save the result with source references. If the task list or threads are missing, mark this step blocked; do not make up a recipient or a thread."
  - uses: draft-brand-voice-checker
    note: "2. Read skills/draft-brand-voice-checker/SKILL.md. Check the follow-up drafts from step 1 against your voice notes or a few of your past emails. Flag each off-voice line with a before and after fix. Facts, recipients and dates stay as step 1 set them. Save the result with source references. If there are no voice notes or past emails, check for clarity and tone only and say so."
origin: rebuilt
version: 1.0.0
credits:
