slug: draft-your-due-task-followups
name: Draft your due task follow ups
summary: Share due tasks and their threads. Get checked follow-up drafts in your
  voice, ready for review.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: brief
    required: true
  - type: plan
    required: false
  - type: brand_brain
    required: false
outputs:
  - type: document
uses:
  - executive-due-task-drafts
  - draft-brand-voice-checker
steps:
  - uses: executive-due-task-drafts
    note: 1. Read skills/executive-due-task-drafts/SKILL.md. Share due tasks and
      related threads. Get follow-up drafts linked to each task, with missing
      facts and send status clear. Hands the follow-up drafts to step 2. Save the result with source references. Carry
      the user's goal and all earlier findings into this step. If required
      evidence or tool access is missing, mark this step blocked; do not
      fabricate a result.
  - uses: draft-brand-voice-checker
    note: 2. Read skills/draft-brand-voice-checker/SKILL.md. Check the follow-up
      drafts from step 1 against your voice notes or a few of your past emails.
      Get each off-voice line flagged with a before and after fix. Facts,
      recipients and dates stay as step 1 set them. Save the result with source
      references. Carry the user's goal and all earlier findings into this
      step. If required evidence or tool access is missing, mark this step
      blocked; do not fabricate a result.
