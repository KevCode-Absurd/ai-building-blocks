tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Reported-to-comparable COGS reconciles with no double-counted charge; LIFO is not applied as an IFRS costing method; noncash inventory movements do not become cash investment.
judge:
