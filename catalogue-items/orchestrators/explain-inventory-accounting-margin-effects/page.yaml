how_it_works:
  - title: LIFO reserve earnings bridge
    text: Use actual sourced schedules in one linked native workbook; example values are illustrative and must not become issuer inputs. For an actual LIFO issuer, reconcile the reserve to FIFO inventory and COGS; document FX, acquired reserves and liquidation effects before using the movement.
  - title: Inventory charge margin bridge
    text: Attribute disclosed inventory charges to the same COGS period. Keep permitted reversals and LIFO effects distinct, identify overlap and prevent two adjustments to the same expense.
  - title: Noncash working-capital bridge
    text: Use original reported inventory balances and separately identified noncash write-downs/reserve changes to derive operating cash investment; analytical FIFO values must not silently replace statutory cash-flow inputs.
