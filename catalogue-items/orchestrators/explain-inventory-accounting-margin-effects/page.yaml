new_slug: explain-inventory-accounting-margin-effects
name: Explain inventory accounting margin effects
headline: Explain inventory accounting margin effects
summary: Bridge LIFO reserves, inventory write-downs and stock cash to see comparable gross margin and operating cash invested in inventory.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it a company's inventory note, reported cost of goods sold, write-downs and reversals, inventory balances and notes on noncash movements. Step 1 restates LIFO to FIFO. Step 2 separates inventory charges from margin. Step 3 finds the cash put into stock. You get three linked bridges.
explain: |-
  Two companies can sell the same goods and report different gross margins because of how they cost inventory. LIFO reserves, inventory write-downs and noncash movements all change margin or cash without changing what happened in the business. An inventory accounting margin analysis has to pull these apart before it compares anything.

  Step 1 adds the LIFO reserve to inventory and takes the reserve's operating increase off cost of goods sold, to give a FIFO comparable view and its after-tax effect. It flags reserve liquidation instead of calling it growth. Step 2 finds write-downs and reversals inside the same cost of goods sold line and shows margin with and without them. Reported margin stays the main figure. Step 3 takes noncash movements such as acquisitions and currency out of the change in inventory, to leave the cash actually invested.

  It works only from filed disclosures. It does not value inventory, advise on reserves or treat recurring write-downs as one-offs. LIFO is a US accounting choice, so step 1 does not apply to IFRS reporters.
when:
  - You compare two companies that cost inventory differently, such as LIFO and FIFO.
  - A company's gross margin moved and you suspect write-downs or a reserve change, not selling prices.
  - Inventory on the balance sheet changed and you want the cash really put into it.
  - A reviewer asks that no charge or reserve change is counted twice.
not_for:
  - The company reports under IFRS or does not use LIFO. Skip step 1 and use the Inventory charge margin bridge and the Noncash working capital bridge instead.
  - You want to judge whether inventory is valued correctly or what reserve to hold. This explains disclosures. It does not value stock.
  - You want wider working capital and tax cash. Use the Reconcile working capital and tax cash workflow.
  - Revenue, not cost, moved. Use the Reconcile revenue presentation and perimeter workflow.
  - You do not have the filings. Every figure has to come from the notes.
you_give:
  - LIFO inventory, opening and closing LIFO reserves and the tax effect, where the company uses LIFO (from the inventory note)
  - Reported revenue and cost of goods sold (from the income statement)
  - Inventory write-downs and reversals, and the line they sit in (from the notes)
  - Opening and closing inventory balances (from the balance sheet)
  - Notes on acquisitions, currency and other noncash movements (from the filing)
  - The reporting dates, currency and scale, such as USD millions
you_get:
  - A FIFO comparable inventory, cost of goods sold and after-tax earnings view, if LIFO applies
  - Gross margin as reported and with inventory charges taken out, kept apart
  - Operating cash invested in inventory, with noncash movements taken out
  - A check that no charge or reserve change was counted twice
  - Missing facts, and checks that could not run
how_to_use:
  - Download the workflow pack and give it to an AI that can read files, such as Claude, ChatGPT or Gemini. Use one that can make spreadsheets if you want a workbook.
  - "Attach the annual report pages: income statement, balance sheet, the inventory note and the cash flow notes. Say if the company uses LIFO."
  - After step 1, check that the reserve was added to inventory and that reserve changes from acquisitions or currency were taken out of the operating movement.
  - After step 2, check each write-down sits in the same cost of goods sold line, and that no charge is also inside the LIFO adjustment.
  - After step 3, check noncash movements were not counted as cash. Fill every MISSING line. This explains disclosures. It is not valuation or advice.
how_it_works:
  - title: LIFO reserve earnings bridge
    text: "Confirms US-GAAP LIFO use, adds the closing reserve to inventory, and takes the operating reserve increase off cost of goods sold to estimate FIFO. Reconciles the margin and tax effects. Hands step 2 the comparable cost of goods sold. Check before moving on: acquired reserves, currency and liquidation are flagged."
  - title: Inventory charge margin bridge
    text: Finds write-downs and reversals inside the chosen cost of goods sold, nets them, and shows margin with and without the charge. Keeps LIFO effects apart and flags any overlap. Reported margin stays primary. Hands step 3 the identified noncash write-downs.
  - title: Noncash working capital bridge
    text: Takes the change in reported inventory and removes acquisitions, currency, write-offs and other noncash movements. Reverses the sign to give the cash flow effect. Uses reported balances, never the restated FIFO ones, for the cash result.
output_shape: |-
  LIFO TO FIFO     LIFO inventory <n> + closing reserve <n> = FIFO inventory <n>
                   LIFO cost of goods sold <n> - operating reserve increase <n> = FIFO <n>
                   after-tax effect <n>, reserve liquidation <flag or none>

  CHARGE BRIDGE    reported margin <n%> | charges <n> | reversals <n> | excluding charges <n%>
                   overlap with LIFO effect <none or n>

  CASH IN STOCK    change in inventory <n> - noncash movements <n> = operating investment <n>
                   cash flow contribution <n>

  SOURCES          <each input, its note or page, date, currency and scale>
  MISSING          <each gap, and the line it stops>
  CHECKS MISSED    <one line each, or none>
output_sample:
  input:
    - The inventory note, with LIFO reserves and the tax effect
    - Reported revenue, cost of goods sold, write-downs and reversals
    - Inventory balances and notes on noncash movements
  prerequisites:
    - The filed annual report pages for the periods you compare
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: LIFO TO FIFO
      contains: FIFO inventory and cost of goods sold, the margin and tax effect, and any reserve liquidation flag.
    - name: CHARGE BRIDGE
      contains: Reported margin and margin excluding inventory charges, with reversals and LIFO effects kept apart.
    - name: CASH IN STOCK
      contains: Change in inventory less noncash movements, and its cash flow effect.
    - name: SOURCES
      contains: Each input with its note or page, date, currency and scale.
    - name: MISSING and CHECKS MISSED
      contains: Each gap and the line it stops, and every check that failed or could not run.
tweaks:
  - what: The LIFO reserve
    how: Change the closing reserve. FIFO inventory and cost of goods sold move, and a falling reserve is flagged as liquidation.
  - what: A write-down
    how: Add or remove one charge. Margin excluding charges moves, and reported margin stays the same.
  - what: Noncash movements
    how: Add an acquisition to the notes. Operating cash investment falls by that amount, because it was not cash invested in stock.
  - what: The periods
    how: Compare two years on the same basis. A change of method or perimeter shows as a flagged conflict.
judge:
  - Reported-to-comparable COGS reconciles with no double-counted charge; LIFO is not applied as an IFRS costing method; noncash inventory movements do not become cash investment.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Keep the inventory note and cash flow notes for each year in one folder, so every run uses the same pages.
  - Add the company's own wording for write-downs to your copy of the skill, so the right line is found fast.
  - Record which years had acquisitions or currency swings, so you know which movements to look for.
  - Run the Reconcile working capital and tax cash workflow next if you need the wider cash picture.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Builds a workbook with inputs, formulas and a checks tab you can click into. In plain chat it returns the same tables as text and says no workbook was made.
  inputs:
    - The full inventory and cash flow notes, not only the headline statements.
    - Two or more years of the same company, so changes show.
    - A named reviewer who knows the company's accounting.
terms:
  - term: LIFO and FIFO
    meaning: "Two ways to cost stock sold: last in, first out and first in, first out."
  - term: LIFO reserve
    meaning: The gap between inventory at FIFO and at LIFO, as disclosed.
  - term: Cost of goods sold
    meaning: The cost of the stock a company sold in the period.
  - term: Write-down
    meaning: A cut to inventory's value because it is worth less than it cost.
  - term: Noncash movement
    meaning: A change in a balance that did not move cash, such as currency or an acquisition.
before: []
