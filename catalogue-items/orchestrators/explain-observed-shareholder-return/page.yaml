new_slug: explain-observed-shareholder-return
name: Explain an observed shareholder return
headline: Explain an observed shareholder return
summary: Explain why a share price moved and what reinvested dividends added, using split-adjusted EPS, P/E changes and real reinvestment prices.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it dated share prices, EPS and P/E at both dates, confirmed split terms, dividends paid and your reinvestment prices. Step 1 puts EPS on one split basis. Step 2 splits the price move into an earnings effect and a multiple effect. Step 3 builds shares and wealth from reinvested dividends.
explain: |-
  A share price can rise because earnings grew, because investors paid more for each dollar of earnings, or both. Splits and dividends can blur the picture. This shareholder return breakdown separates the pieces so they add up exactly to what was observed.

  Step 1 restates past EPS and share counts onto one split basis, and keeps the unadjusted prices and dividends so a dividend is not counted twice. Step 2 uses comparable positive EPS and dated P/E ratios to split the price change into an earnings effect and a multiple effect, taken in order. The part from both moving together falls in the second one, and the order is stated. Step 3 follows each dividend into extra shares at the price you actually reinvested at, compares the result with holding the cash, and reconciles it to the simple return.

  It looks back at dates you give it. It needs positive EPS. It is not a forecast, a trade call or investment advice.
when:
  - A stock has risen or fallen over a period and you want to know how much was earnings and how much was the multiple.
  - A split happened in the period and old EPS no longer lines up with today's.
  - You reinvested dividends and want to know the shares and wealth they added.
  - A reviewer wants the return pieces to add up to the observed price change.
not_for:
  - You want to know what to buy, hold or sell. This explains a past return and gives no advice.
  - EPS was zero or negative at either date. The bridge needs positive, comparable EPS.
  - A discounted rights issue was involved. Use the Restate EPS after splits and rights workflow.
  - You want what a buyback did to EPS and book value. Use the Reconcile buybacks with owner cash workflow.
  - You want a valuation. Use the Review equity valuation sensitivity assumptions workflow.
you_give:
  - Unadjusted share prices at the start and end dates (from exchange records or your broker)
  - EPS and P/E at both dates, on a comparable basis, with EPS above zero (from the company's filings)
  - Confirmed split terms and dates (from company announcements)
  - Dividend payment dates and amounts per share (from company records or your broker)
  - Reinvestment dates and prices, plus any fees and tax withheld (from your broker statements)
  - The shares held at the start, and the currency and scale
you_get:
  - EPS and share counts restated to one split basis
  - The price change split into an earnings effect and a multiple effect, adding to the observed change
  - Shares and ending wealth from reinvested dividends
  - The cash-held case beside it, and the gap between the two
  - Missing facts, and checks that could not run
how_to_use:
  - Download the workflow pack and give it to an AI that can read files, such as Claude, ChatGPT or Gemini. Use one that can make spreadsheets if you want a workbook.
  - Attach your price records, the filings with EPS, the split announcement and your broker statements. Say the start and end dates.
  - After step 1, check the split factor is the confirmed one and that prices and dividends were left unadjusted.
  - After step 2, check the earnings effect and multiple effect add up exactly to the observed price change, and that the order is stated.
  - After step 3, check shares and cash reconcile, and that fees and withholding are shown. Fill every MISSING line. This is not advice.
how_it_works:
  - title: Stock-split EPS restatement
    text: "Puts past EPS and weighted shares on the confirmed split basis. Keeps unadjusted prices and dividends so the return is not double counted. Hands step 2 EPS on one basis. Check before moving on: the split factor is confirmed, not guessed."
  - title: EPS and multiple return bridge
    text: Derives each date's price from EPS times P/E. Holds the opening multiple to find the earnings effect, then applies the ending EPS to the multiple change. States the order, so the part from both moving together is not lost. Divides each effect and dividends by the opening price and ties to the simple return.
  - title: Dividend reinvestment share schedule
    text: Takes each dividend, less fees or withholding, and divides by your reinvestment price to add shares. Compares ending wealth with holding the cash. Reconciles separately from the simple, non-reinvested return.
output_shape: |-
  SPLIT BASIS      factor <n for n>   EPS start <n> -> <n>, EPS end <n>
                   unadjusted price start <n>, end <n>

  PRICE BRIDGE     earnings effect <n> + multiple effect <n>
                   = observed price change <n>   (order used: <stated>)
                   each as a share of opening price <n%>; dividends <n%>; simple return <n%>

  REINVESTMENT     shares start <n> + added <n> = <n>
                   ending wealth <n> vs cash-held case <n>; fees <n>, withholding <n>

  SOURCES          <each input, its source, date, currency and scale>
  MISSING          <each gap, and the line it stops>
  CHECKS MISSED    <one line each, or none>
output_sample:
  input:
    - Start and end share prices, EPS and P/E, with the confirmed split terms
    - Dividend dates and amounts per share
    - Your reinvestment dates and prices, with fees and tax withheld
  prerequisites:
    - The company's filings and split announcement
    - Your broker statements for dividends and reinvestments
    - An AI that can make spreadsheet files, if you want a workbook (optional)
  output:
    - name: SPLIT BASIS
      contains: EPS and weighted shares on one split basis, with unadjusted prices and dividends kept as recorded.
    - name: PRICE BRIDGE
      contains: Earnings and multiple effects that add exactly to the observed price change, with the order used.
    - name: REINVESTMENT
      contains: Shares added from dividends, ending wealth, and the cash-held case for comparison.
    - name: SOURCES
      contains: Each input with its source, date, currency and scale.
    - name: MISSING and CHECKS MISSED
      contains: Each gap and the line it stops, and every check that failed or could not run.
tweaks:
  - what: The order of effects
    how: Apply the multiple change before the earnings change. The two effects shift, because the part from both moving together goes to the one applied second. The total stays equal to the observed change.
  - what: The reinvestment price
    how: Use a different execution price. Shares added change, and the gap from holding cash changes.
  - what: Fees and withholding
    how: Add a fee or tax withheld. Net cash falls, so fewer shares are bought and the gap narrows.
  - what: The period
    how: Change the start or end date. Prices, EPS and P/E all need new dated sources, and any missing one stops its step.
judge:
  - Price effects sum to observed price change; explicit dividends are not added to already-adjusted return series; reinvested wealth reconciles to shares and cash with fees/withholding disclosed.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Keep your broker statements and the company's filings for the whole holding period in one folder.
  - Record the date each P/E figure came from, so the multiple effect uses matching dates.
  - Add your usual broker's fee and tax rules to your copy of the skill, so reinvestment is netted correctly.
  - Run the Review equity valuation sensitivity assumptions workflow next if you want to test what the price could be worth.
works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Builds a workbook with inputs, formulas and a checks tab you can click into. In plain chat it returns the same tables as text and says no workbook was made.
  inputs:
    - Unadjusted price history from an exchange or your broker, not an adjusted chart series.
    - The company's own EPS table and split notice.
    - A named reviewer who knows the holding.
terms:
  - term: EPS
    meaning: "Earnings per share: profit for the period divided by the shares outstanding."
  - term: P/E multiple
    meaning: Share price divided by EPS. It shows how much investors pay for each unit of earnings.
  - term: Split-adjusted
    meaning: Restated so old per-share figures match today's share count.
  - term: Interaction
    meaning: The part of the price change from earnings and the multiple moving together. It lands in whichever effect is applied second.
  - term: Dividend reinvestment
    meaning: Using a dividend to buy more shares instead of taking the cash.
before: []
