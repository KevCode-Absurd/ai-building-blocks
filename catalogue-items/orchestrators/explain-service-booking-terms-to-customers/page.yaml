new_slug: explain-service-booking-terms-to-customers
name: Explain service booking terms to customers
headline: Explain service booking terms to customers
summary: Turn your booking terms into a plain-words explanation for customers. Get a clause-linked summary, a rewritten draft and open questions.
job: help-customers
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Share your full approved booking terms and the explanation you give customers now. Your AI summarises deposits, cancellations, refunds and notice rules with clause numbers, then rewrites your draft to match. You get a clear explanation and a list of points a lawyer should confirm.
explain: |-
  Customers argue about cancellation fees when the terms are long and the explanation is vague. This workflow keeps your explanation tied to the actual terms.

  Step one reads your terms and summarises what each side must do: payments, deposits, cancellation, refunds and notice. Each point cites its clause. Step two edits your customer explanation to match, keeping exceptions, dates and anything unclear.

  It never changes what the terms say. If a clause could be read two ways, it goes on a list of questions for you or your lawyer. The AI does not settle it.
when:
  - A customer disputes a deposit your terms say is not refundable.
  - You are about to send a booking confirmation and the terms run four pages.
  - Your terms changed last month and the website still shows the old ones.
  - A new team member keeps explaining refunds in a different way.
not_for:
  - You need new terms written. A lawyer should draft those. This explains terms you already have.
  - You are reading a contract someone else wants you to sign. Use the Contract plain-language summary writer on its own.
  - You want a reply to one refund request. Use the Refund request reply writer.
  - You are handing over a hotel group booking. Use Hotel group booking handover checker.
you_give:
  - Your full booking terms, pasted or attached
  - Your current customer explanation, such as an FAQ or confirmation email
  - Current prices or fee rules the terms refer to
  - Who the reader is, such as a customer booking a service
  - The date the terms took effect (optional)
you_get:
  - A plain-words summary of duties, payments, cancellation, refunds and notice, with clause numbers
  - Your customer explanation rewritten to match the terms
  - A list of unclear points for you or your lawyer
  - A list of every change made to your draft
  - A summary and one next step
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini.
  - The pack holds the two skills it uses (Plain-words contract summary and Plain English editor). If one is missing, open its page on this site from the skills list, or ask for the file.
  - Paste the full terms first, then your current customer explanation and the price rules.
  - "Say: follow the workflow file, quote clause numbers and stop if a check fails."
  - Check the summary against the terms for deposits, cancellation and refunds. These cause most disputes.
  - Send the unclear points to your lawyer or the person who owns the terms.
  - Publish the explanation yourself once approved. This does not change your terms.
output_sample:
  input:
    - Your full booking terms
    - Your current customer explanation
    - Current price or fee rules
    - The date the terms took effect (optional)
  prerequisites:
    - Terms your business has already approved
  output:
    - name: step-01-plain-words-contract-summary.md
      contains: What each side must do on payment, cancellation, refunds and notice, with clause numbers.
    - name: step-02-plain-english-editor.md
      contains: Your customer explanation rewritten to match the terms, with each change listed.
    - name: Hand-back summary
      contains: Files saved, unclear clauses for review, checks not run and one next step.
how_it_works:
  - title: Plain-words contract summary
    text: Summarises payments, deposits, cancellation, refunds and notice, with clause numbers. Hands step 2 the sourced summary and the list of unclear clauses.
  - title: Plain English editor
    text: Edits your customer explanation against that summary, keeping exceptions and dates. Hands back the rewrite and the list of changes.
output_shape: |-
  TERMS <name, version or date>, READER <who>

  SUMMARY OF THE TERMS
    Payments & deposits   <plain words> [clause <n>]
    Cancellation          <plain words> [clause <n>]
    Refunds               <plain words> [clause <n>]
    Notice                <plain words> [clause <n>]
  CUSTOMER EXPLANATION    <rewritten text>
  CHANGES                 <original> -> <edit> | <clause>
  UNCLEAR POINTS          <clause> | <how it could be read two ways>
  LEGAL NOTE              This is a plain-words explanation, not legal advice. Have your lawyer confirm the unclear points before you publish it.

  MISSING        <each gap>
  CHECKS MISSED  <one line each, or none>
  NEXT STEP      <one action>
tweaks:
  - what: Reader
    how: Say if the reader is a first-time buyer or a returning client. Tone and detail change to match.
  - what: Format
    how: Ask for a short FAQ, a confirmation email or a web page. The same facts come back in that shape.
  - what: Terms version
    how: Give the effective date. The AI flags any figure or rule that may belong to an older version.
judge:
  - Cancellation, deposit and refund wording preserves the actual contract; proposed wording never changes the terms.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Each time the terms change, run this again with the new text and keep the clause list.
  - Add the questions customers ask most to your draft, then check them against the terms.
works_best_with:
  tools:
    - name: Any good chat AI that reads files, such as Claude, ChatGPT or Gemini
      why: It needs the long terms and your draft in one go.
  inputs:
    - Past customer emails that argued about fees
    - Your price list with dates
    - The booking confirmation your system sends
    - A lawyer's notes on past disputes
terms:
  - term: Clause
    meaning: One numbered part of a contract.
  - term: Non-refundable deposit
    meaning: Money paid at booking that the terms say you will not give back.
