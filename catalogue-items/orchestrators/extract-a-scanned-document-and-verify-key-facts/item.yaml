slug: extract-a-scanned-document-and-verify-key-facts
name: Extract a scanned document and verify key facts
summary: Pull key facts out of a scanned document and check them against the page. Get the text, a fact table with page numbers and uncertain readings.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: document
    required: true
outputs:
  - type: source_text
  - type: spreadsheet
  - type: document
uses:
  - scanned-pdf-text-reader
  - pdf-maker-and-reader
  - spreadsheet-checker
steps:
  - uses: scanned-pdf-text-reader
    note: Reads the scan with OCR. Keeps page numbers and marks readings it doubts. Hands the text and the doubtful readings to step 2.
  - uses: pdf-maker-and-reader
    note: Renders the original pages and checks each important fact on the page image, not only in the extracted text. Uses the original scan and step 1's text. Saves the fact table as a CSV or workbook and hands confirmed facts and open readings to step 3.
  - uses: spreadsheet-checker
    note: Takes step 2's fact table (the CSV or workbook) and checks it for missing records, mixed formats and totals that do not add up.
