uses: [mispriced-bet-tester, lifetime-punch-card-bet-ranker, incentive-checker, room-for-error-plan-checker, sit-still-rule-writer]
steps:
  - {uses: mispriced-bet-tester, note: "For each idea, whether the odds really favour you or the price already says it. Hands the odds test to step 2."}
