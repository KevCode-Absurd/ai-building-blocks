slug: find-old-posts-losing-traffic-refresh-or-cut-them-and-track-it
name: "Find old posts losing traffic and refresh or cut them"
summary: "Find old blog posts losing traffic and decide to refresh, merge or cut each. Give it traffic by page; get calls, refresh plans and tracking."
category: orchestrator
type: workflow
role: orchestrate
job: analysis
level: intermediate
inputs:
  - {type: web_page, required: true}
  - {type: spreadsheet, required: true}
  - {type: competitor_set, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
  - {type: copy_draft}
uses: [content-gap-and-decay-finder, page-keep-or-cut-auditor, old-content-refresher, search-title-and-snippet-writer, seo-change-tracker]
steps:
  - {uses: content-gap-and-decay-finder, note: "The pages losing traffic over time, the searches they are losing and the topics where rivals now rank above you. Hands the decay report to step 2."}
  - {uses: page-keep-or-cut-auditor, note: "For each page, a call with the reason and the numbers: keep as is, refresh, merge into another page or cut and redirect. Hands the pages marked refresh to step 3."}
  - {uses: old-content-refresher, note: "For each page to refresh: the facts to update, the structure to change, the questions it now misses and what to add, in order. Hands the plans to step 4."}
  - {uses: search-title-and-snippet-writer, note: "A new title and search snippet for each refreshed page, within length, saying what the page now gives the searcher. Takes step 3's plans for the topic and benefit. A pause follows, so you can publish the changes."}
  - {uses: seo-change-tracker, note: "Tracking for each changed page: the date of the change, the searches to watch and a read at six to eight weeks that says whether it worked. Uses your live pages after you publish step 4's titles, not the draft itself."}
origin: own
version: 1.0.0
example_pending: true
