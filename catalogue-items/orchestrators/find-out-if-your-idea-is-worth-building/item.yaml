slug: find-out-if-your-idea-is-worth-building
name: Find out if your idea is worth building
summary: "Pick who to talk to, ask the right questions, sort what you heard and get a keep, change or stop call."
category: orchestrator
type: workflow
role: orchestrate
job: research
level: beginner
inputs:
  - {type: brief, required: true}
  - {type: persona, required: false}
  - {type: voc_reviews, required: false}
outputs:
  - {type: audit_report}
  - {type: plan}
uses: [first-customer-group-picker, customer-interview-question-writer, customer-conversation-request-writer, customer-conversation-notes-sorter, commitment-ask-planner, idea-evidence-review]
steps:
  - {uses: first-customer-group-picker, note: "Slice the market until you have a who and a where you could reach this week. Pick the group to start with and say why."}
  - {uses: customer-interview-question-writer, note: "For that group, write questions about their life and the last time the problem happened, never about the idea. Pick the big three unknowns and plan the scary question."}
  - {uses: customer-conversation-request-writer, note: "Write the messages that get the first five to ten talks: warm intros first, then cold, kept casual, asking for help, not a sale."}
  - {uses: customer-conversation-notes-sorter, note: "After the talks, sort each set of notes into what they did, what it cost them and what they committed to. Flag compliments, vague claims and feature ideas as weak, with the follow-up you should have asked."}
  - {uses: commitment-ask-planner, note: "For each person, plan the next step to ask for, in time, reputation or money, and mark anyone who is all praise and no commitment."}
  - {uses: idea-evidence-review, note: "Set what you believed against what people did. End with keep going, change or stop, the reason, and the next three talks. Then close the run with a HAND-BACK SUMMARY: each step's file, any step not run and why, and every MISSING: line in one list."}
origin: own
version: 1.0.0
minds: [rob-fitzpatrick, steve-blank, eric-ries]
