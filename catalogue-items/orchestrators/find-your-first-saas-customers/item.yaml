slug: find-your-first-saas-customers
name: Find your first SaaS customers
summary: Share your product and buyer facts. Get a market position, pricing
  options and a first-customer launch plan.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: business_profile
    required: true
  - type: competitor_set
    required: false
outputs:
  - type: plan
  - type: document
uses:
  - copilot-gtm-positioning-strategy
  - copilot-gtm-technical-product-pricing
  - copilot-gtm-0-to-1-launch
steps:
  - uses: copilot-gtm-positioning-strategy
    note: 1. Read skills/copilot-gtm-positioning-strategy/SKILL.md. Share your
      product and rivals. Get a distinct market position, buyer reasons and
      messages to test. It hands step 2 your market position and buyer reasons.
      Save the result with source references. Carry the user's goal and all
      earlier findings into this step. If required evidence or tool access is
      missing, mark this step blocked; do not fabricate a result.
  - uses: copilot-gtm-technical-product-pricing
    note: 2. Read skills/copilot-gtm-technical-product-pricing/SKILL.md. Share your
      product costs and buyers. Get pricing units, free tier limits and
      trade-offs to test. It uses your product facts plus step 1's position, and
      hands step 3 the pricing units and free tier limits. Save the result with
      source references. Carry the user's goal and all earlier findings into
      this step. If required evidence or tool access is missing, mark this step
      blocked; do not fabricate a result.
  - uses: copilot-gtm-0-to-1-launch
    note: 3. Read skills/copilot-gtm-0-to-1-launch/SKILL.md. Describe your new
      product. Get early buyer targets, a launch sequence and tests for reaching
      first customers. It uses your product facts, step 1's position and step
      2's pricing, and ends the run with the launch plan. Save the result with
      source references. Carry the user's goal and all earlier findings into
      this step. If required evidence or tool access is missing, mark this step
      blocked; do not fabricate a result.
origin: rebuilt
version: 1.0.0
credits:
