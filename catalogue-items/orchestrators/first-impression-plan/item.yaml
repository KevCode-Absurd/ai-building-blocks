slug: first-impression-plan
name: "Make a strong first impression and build the relationship"
summary: "Name who you are about to meet. Get a brief, a meeting plan, a memory card and an honest thank-you note."
category: orchestrator
type: workflow
role: orchestrate
job: research
level: beginner
inputs:
  - {type: question, required: true}
  - {type: source_text, required: false}
  - {type: meeting_notes, required: false}
outputs:
  - {type: plan}
  - {type: copy_draft}
uses: [before-you-meet-brief-writer, get-them-talking-plan, contact-memory-card-writer, honest-appreciation-note-writer]
steps:
  - {uses: before-you-meet-brief-writer, note: "Makes the persona: what they care about, what you honestly admire, and the question only they can answer. Steps 2 and 3 build on it."}
  - {uses: get-them-talking-plan, note: "Uses the persona from step 1. Makes the plan: their name, a warm start, questions they like to answer and where you stop and listen. Step 4 builds on it."}
  - {uses: contact-memory-card-writer, note: "Uses your own notes from the meeting, not step 2's plan, plus step 1's persona. Makes a card for remembering them: name, facts, promises and the date of the next contact."}
  - {uses: honest-appreciation-note-writer, note: "Uses the plan from steps 2 and 3 and the persona from step 1. Makes a short note with one specific, honest appreciation and no ask."}
