slug: fix-a-bug-with-proof-and-a-clear-pull-request
name: "Fix a bug with proof and a clear pull request"
summary: "Give it the bug. Get the cause proven before any fix, a minimal fix, test gaps closed and a pull request."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: codebase, required: true}
  - {type: brief, required: true}
outputs:
  - {type: document}
uses: [bug-root-cause-finder, test-gap-finder, code-change-reviewer, pull-request-writer]
steps:
  - {uses: bug-root-cause-finder, note: "Makes the code change: finds and proves the cause, then makes a minimal fix once you agree. Steps 2, 3 and 4 all work from this change."}
  - {uses: test-gap-finder, note: "Uses the fix from step 1 and your tests. Says which behaviour no test would catch if it broke again, and hands you the tests to add before step 3."}
  - {uses: code-change-reviewer, note: "Reviews the fix from step 1 together with the tests you added after step 2, not step 2's report itself. Checks them against your standards and the bug report, and hands back review points to settle before step 4."}
  - {uses: pull-request-writer, note: "Uses the fix from step 1 with the tests you added, and the cause and review points from steps 1 to 3. Describes the fix with the cause and the before and after proof."}
