new_slug: foreplay-creative-strategy-runner
name: Foreplay creative strategy workflow
summary: Share your Foreplay ads. Get groups by ad type, notes on what they show and an HTML test brief.
job: study-competitors
headline: Foreplay creative strategy workflow
subhead: Study the actual ads, then plan what to test.
explain: Works with an authorized Foreplay connection or a supplied export. Adds repeatable corpus selection, cluster sampling, media analysis records and a brief that shows what was observed and what remains a hypothesis.
when:
  - You have Foreplay data and want a structured creative study.
  - You want adaptation briefs based on actual videos and images.
you_give:
  - Competitor or board scope, market, dates, product and study goal.
  - Authorized Foreplay access or an export with ad IDs and media.
  - Your product facts and past results if you want comparison with your own ads.
you_get:
  - A de-duplicated corpus and sample ledger.
  - Structured image/video teardown records with evidence limits.
  - A source-linked HTML brief and ranked test ideas.
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
how_it_works:
  - title: Define a bounded corpus
    text: Read authorized data or exports, retain live and ended status, and deduplicate before analysis.
  - title: Inspect representative media
    text: Cluster formats and sample across advertisers and dates; separate actual hooks from captions.
  - title: Build a test brief
    text: Report observations, limits and adaptations with the brand proof needed for each.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
