new_slug: foreplay-creative-strategy-runner
name: Foreplay creative strategy workflow
summary: Share your Foreplay ads. Get groups by ad type, notes on what they show and an HTML test brief.
job: study-competitors
headline: Foreplay creative strategy workflow
subhead: Study the actual ads, then plan what to test.
explain: Foreplay is a paid service, so you need your own account or an export from it. Without either, use the Facebook ad library collector. This works with an authorized Foreplay connection or a supplied export. Adds repeatable corpus selection, cluster sampling, media analysis records and a brief that shows what was observed and what remains a hypothesis.
when:
  - You have Foreplay data and want a structured creative study.
  - You want adaptation briefs based on actual videos and images.
you_give:
  - Competitor or board scope, market, dates, product and study goal.
  - Authorized Foreplay access (a paid account) or an export with ad IDs and media. If you have neither, use the Facebook ad library collector instead.
  - Your product facts and past results if you want comparison with your own ads.
you_get:
  - A de-duplicated corpus and sample ledger.
  - Structured image/video teardown records with evidence limits.
  - A source-linked HTML brief and ranked test ideas.
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
  - Next, give the top ranked test ideas to the Video script writer from a competitor ad idea, then measure the results in your own ad account.
how_it_works:
  - title: Set the scope
    text: List the boards, advertisers, dates, market and goal for the study. You need at least a handful of ads, as ad IDs or an export file with the media. Ask once for anything missing.
  - title: Collect a bounded corpus
    text: Read your authorized Foreplay data or export. Keep live and ended ads, record the limits and remove duplicates before analysis.
  - title: Group before you pick
    text: Group the ads by format and angle. Pick a few from each group, across advertisers and dates, and write down why.
  - title: Inspect the real media
    text: Open each picked ad. Note the hook, the beats, the proof and the call to action. Mark what you saw apart from what you infer.
  - title: Find the repeating formulas
    text: For each group, write the repeating sequence, with the ad IDs behind it and how sure the sample lets you be.
  - title: Build the test brief
    text: Write an HTML brief with ranked test ideas. Each has the audience problem, the opening, the scenes, the proof you need and a test question.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.

not_for:
  - "You have no Foreplay account or export and want to use the public Facebook ad library: use the Facebook ad library collector."
  - "You want a script from one competitor ad idea: use the Competitor-inspired video script writer."
  - "You want to find the angles no rival uses yet: use the Competitor ad opportunity finder."
output_sample:
  input:
    - Your competitor list or Foreplay boards, market and date window
    - Foreplay access, or an export with ad IDs and media
    - Your product facts and your goal for the study
    - Your own past ad results (optional)
  prerequisites:
    - An AI that can open images and video, or Foreplay data it can read
  output:
    - name: Corpus and sample ledger
      contains: The ads collected, duplicates removed, and which ones were picked for study and why.
    - name: Format and angle map
      contains: Ads grouped by format and angle, with counts per group.
    - name: Teardown cards
      contains: Per ad, the hook, beats, proof, call to action and production level, linked to the ad ID.
    - name: Transferable formulas
      contains: The repeating sequence in each group and how sure the AI is, based on your sample.
    - name: HTML test brief
      contains: Ranked test ideas, each with the audience problem, opening, scenes, proof needed and test question.
