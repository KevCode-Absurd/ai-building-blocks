slug: get-a-product-made-right-from-tech-pack-to-inspected-shipment
name: "Get a product made right, from tech pack to shipment"
summary: "Give it your product photos. Get a tech pack, a vetted factory, the landed cost, a sample check and an inspection brief."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: product_photos, required: true}
  - {type: product_data, required: true}
  - {type: spreadsheet, required: true}
outputs:
  - {type: brief}
uses: [product-tech-pack-writer, factory-shortlist-vetter, landed-cost-calculator, sample-approval-gatekeeper, pre-shipment-inspection-brief-writer]
steps:
  - {uses: product-tech-pack-writer, note: "Starts the flow. Turns your photos and ideas into the tech pack, the one spec every factory quotes against. Steps 2, 3, 4 and 5 all work from it."}
  - {uses: factory-shortlist-vetter, note: "Uses the tech pack from step 1 and the factory answers you collect. Judges factories by how they answer it, and hands you the pick to quote."}
  - {uses: landed-cost-calculator, note: "Uses the tech pack from step 1 and the quotes you collected from the factories, not step 2's scores. Prices them down to cost per sellable unit and margin."}
  - {uses: sample-approval-gatekeeper, note: "Uses the tech pack from step 1 and photos and measures of the samples you ordered, not step 3's costs. Judges the samples line by line and tells you which one to approve."}
  - {uses: pre-shipment-inspection-brief-writer, note: "Uses the tech pack from step 1, your order sheet and the sample you approved after step 4. Gives the inspector the tech pack and the gold standard to check bulk goods against, and ties payment to the result."}
