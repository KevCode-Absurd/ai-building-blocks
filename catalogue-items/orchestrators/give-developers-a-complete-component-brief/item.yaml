slug: give-developers-a-complete-component-brief
name: Give developers a complete component brief
summary: Share the source files. Get a component brief with variants, states, accessible behavior and design tokens.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: design_file
    required: false
  - type: codebase
    required: false
  - type: brand_guide
    required: false
outputs:
  - type: audit_report
  - type: theme_files
  - type: document
uses:
  - design-system-auditor
  - screen-states-designer
  - design-token-builder
steps:
  - uses: design-system-auditor
    note: Identify existing patterns and gaps so the component reuses the current system. Hands step 2 the reuse list and the gaps as context.
  - uses: screen-states-designer
    note: Define each needed state and transition, including interruption and recovery. Uses your component code and design, with step 1's reuse list as context, and hands step 3 the states and the styles each one needs.
  - uses: design-token-builder
    note: Use component mapping and developer handoff modes with the existing approved values. Preserve those values instead of generating a replacement palette. Uses your brief and brand guide for the approved values, plus step 2's states to know which styles are needed.
