slug: launch-a-smaller-product-on-the-date-you-set
name: Launch a smaller product on the date you set
summary: Give it your launch plan, date and budget. Get half the scope, a
  screened request list and a teaser plan.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - launch-scope-halver
  - yes-later-no-request-sorter
  - launch-teaser-to-preview-planner
steps:
  - uses: launch-scope-halver
    note: Locks the date and budget, names the heart of the product and cuts the
      list in half until the core remains. Parks the rest and checks the launch
      promise.
  - uses: yes-later-no-request-sorter
    note: Takes the cut plan and answers every request with not now. Counts repeats
      from different people, lists hidden costs and rules yes, later or no.
  - uses: launch-teaser-to-preview-planner
    note: Works back from the date. Plans hints and a sign-up page, a preview for a
      few insiders, a free sample and the message to your list.
origin: rebuilt
credits:
  - title: Getting Real
    by: Jason Fried and 37signals
    url: https://basecamp.com/gettingreal
    used: Fix the date and budget, flex the scope, and ship half a product, not a
      half-baked one
version: 1.0.0
example_pending: true
