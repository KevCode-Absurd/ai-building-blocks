new_slug: link-operating-growth-to-terminal-reinvestment
name: Link operating growth to terminal reinvestment
headline: Link operating growth to terminal reinvestment
summary: Check that forecast growth is paid for by reinvestment and that terminal value holds up. Get a linked workbook from your NOPAT, capex and WACC.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give it your forecast NOPAT (operating profit after tax), net capex, working capital and discount rate. It tests whether your growth is backed by reinvestment, checks the first stable year, then works backward from terminal value. You get a linked workbook and a list of gaps.
explain: |-
  Growth costs money. A company that grows must keep buying equipment, stock and working capital. A terminal value (what the business is worth after your forecast ends) that assumes steady growth but very little reinvestment is too high. This workflow checks that the two fit, and it shows the numbers.

  It runs three checks in order. First it asks whether your forecast reinvestment can pay for the growth you assumed, given the return the company earns on new money. Next it takes the first stable year and works out the reinvestment needed to hold the stable growth rate. Last it starts from the terminal value and works back to the cash flow and reinvestment that value implies, as a separate proof.

  Most models pick a terminal growth rate and let reinvestment fall out by accident. Here reinvestment equals growth divided by the return on new capital, and the discount rate must be higher than growth. It checks your numbers. It does not say what the company is worth or whether to invest.
when:
  - Your terminal value looks too big next to the cash the business would have left each year.
  - Your model grows profit every year but reinvestment stays flat, and you want to know if that adds up.
  - A reviewer asks how the growth gets paid for and you need the numbers laid out.
  - You have a terminal value from a broker note or a deal model and want to see what it assumes about reinvestment.
not_for:
  - You are valuing a bank, insurer or other financial firm. Cash flow to the firm does not fit them, and this workflow stops and says so.
  - "You want to see how fast above-average returns fade after the forecast: use the Long-term value assumption checker."
  - "You want to test how the value moves when the discount rate or growth changes: use the Equity valuation scenario reviewer."
you_give:
  - Forecast NOPAT for each year, from your model (NOPAT is operating profit after tax)
  - Net capex for each year (spending on equipment and assets, less depreciation) and the change in operating working capital
  - The return you expect on new money put in, and where that view comes from
  - Your discount rate (WACC) with its source and date
  - The terminal value you want to test (optional)
  - Currency, scale such as millions, fiscal year end and valuation date
you_get:
  - A table of reinvestment rate and the growth it can pay for, next to your forecast growth
  - The reinvestment the first stable year needs to hold your stable growth rate
  - A terminal value rebuilt from cash flow, with the reinvestment rate it implies
  - A list of gaps and any checks that could not run
how_to_use:
  - Add the workflow pack to Claude, ChatGPT or Gemini. To get a workbook, use an AI that can make spreadsheet files.
  - Attach your forecast model, or paste the NOPAT, capex and working capital rows. Say the currency, scale and valuation date, and give your WACC with its source.
  - Say what return you expect on new capital and why. If you have no view, say so. It will mark that MISSING and will not invent one.
  - After step 1, check that actual and forecast NOPAT match your model and that depreciation is taken off once in net capex.
  - After step 2, check that your discount rate is higher than your growth rate. If it is not, stop and fix the inputs.
  - After step 3, check that the rebuilt cash flow gives back your terminal value. Read every MISSING line before you use the result.
how_it_works:
  - title: Reinvestment-supported growth schedule
    text: Lines up actual and forecast NOPAT, net capex and working capital on one business perimeter, leaving out acquisitions. Net reinvestment divided by NOPAT, times the return on new capital, gives the growth you can pay for. Compares it with your forecast and hands step 2 the first stable-year NOPAT and the growth and return it supports.
  - title: Terminal growth reinvestment check
    text: Takes the first stable year. Sets reinvestment equal to growth divided by return on capital, takes it off NOPAT to get free cash flow, and divides by the discount rate less growth. Hands step 3 the terminal value and its period label.
  - title: Implied terminal reinvestment schedule
    text: Starts from the terminal value and works backward. Value times (discount rate less growth) gives cash flow, and NOPAT less cash flow gives reinvestment. Flags reinvestment at or below zero, or above 100% of NOPAT. Also tests any other terminal value you supply.
output_shape: |-
  LINK OPERATING GROWTH TO TERMINAL REINVESTMENT
  <currency>, <scale>, valuation date <date>

  1 GROWTH FROM REINVESTMENT  NOPAT <n>, net reinvestment <n>, reinvestment rate <%>
                              return on new capital <%>
                              supported growth <%> vs forecast growth <%>
  2 STABLE YEAR CHECK         first stable-year NOPAT <n>, growth <%>, return on capital <%>
                              reinvestment rate <%>, free cash flow <n>
                              discount rate <%>, terminal value <n>
  3 BACKSOLVE                 terminal value <n>, implied free cash flow <n>
                              implied reinvestment <n> (<%> of NOPAT), implied return <%>

  SOURCES        <each input, its source, date and unit>
  MISSING        <each gap and the line it stops>
  CHECKS MISSED  <one line each, or none>
output_sample:
  input:
    - Your forecast NOPAT, net capex and working capital change for each year
    - Your return on new capital and your WACC, each with a source
    - A terminal value to test (optional)
    - Currency, scale and valuation date
  prerequisites:
    - An AI that can read files. For a workbook, one that can make spreadsheets.
  output:
    - name: Growth from reinvestment
      contains: Net reinvestment as a share of NOPAT, and the growth it can pay for, next to your forecast.
    - name: Stable year check
      contains: Reinvestment, free cash flow and terminal value for the first stable year.
    - name: Backsolve
      contains: The cash flow and reinvestment rate your terminal value implies, worked backward.
    - name: Linked workbook
      contains: Inputs, calculations and checks on separate tabs, when your AI can make files.
    - name: MISSING and CHECKS MISSED
      contains: Gaps in your inputs and any check that could not run.

tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Forecast and terminal periods align, growth is backed by reinvestment, WACC exceeds growth and the reverse calculation reconstructs value; financial firms are rerouted rather than forced into FCFF.
judge:
  - Forecast and terminal periods align, growth is backed by reinvestment, WACC exceeds growth and the reverse calculation reconstructs value; financial firms are rerouted rather than forced into FCFF.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.

works_best_with:
  tools:
    - name: A spreadsheet engine and file-capable AI
      why: Builds, recalculates and reopens a linked workbook. In plain chat you get the same tables as text.
  inputs:
    - Your forecast model with the NOPAT, capex and working capital rows
    - Someone who knows the business, to check the return you assume on new capital
terms:
  - term: NOPAT
    meaning: Operating profit after tax, before any interest on debt.
  - term: WACC
    meaning: The average rate the business must earn to pay its lenders and owners. Used here as the discount rate.
  - term: Terminal value
    meaning: What the business is worth at the end of the forecast, when growth settles into a steady rate.
  - term: Reinvestment rate
    meaning: The share of NOPAT put back into the business through capex and working capital.
  - term: Return on capital
    meaning: The profit a company earns on each dollar it puts into the business.
  - term: Free cash flow
    meaning: NOPAT less reinvestment. The cash left for lenders and owners.
