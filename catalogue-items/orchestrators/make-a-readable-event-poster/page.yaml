new_slug: make-a-readable-event-poster
name: Make a readable event poster
headline: Make a readable event poster
summary: Share the source files. Get a poster layout, checked text and final export checklist.
job: design-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: A poster layout, checked text and final export checklist. Share confirmed event details, audience, format, brand references and required accessibility information. Your AI prepares the work and marks any facts it cannot verify.
explain: |-
  A poster layout, checked text and final export checklist.

  Give your AI the source material listed below and install the complete pack. It uses the component skills in the stated order, saves each result and checks the handoff before continuing. The date, location, price and action are legible at the intended size and agree with the source. Missing tools or evidence stay visible in the final summary.
when:
  - You need a poster layout, checked text and final export checklist.
  - The relevant facts are spread across files or notes and need one consistent review.
  - You want the work and its checks saved so another person can review it.
you_give:
  - Confirmed event details, audience, format, brand references and required accessibility information.
  - The intended reader, deadline and limits on what may be changed.
  - Earlier work and approved examples, if available.
  - "Available tools for the finished output: Python image/PDF tools and fonts; Node.js and the bundled contrast checker."
you_get:
  - A poster layout, checked text and final export checklist.
  - Step files with evidence, unresolved facts and actual checks completed.
  - A hand-back summary and one practical next step.
how_to_use:
  - Download the complete pack and add its governing file and component skills to your AI.
  - Share the sources listed above and say which result you need.
  - Ask the AI to follow the governing file, save each result and stop on a failed required check.
  - Review the files, missing facts and proposed actions before using the result.
how_it_works:
  - title: Type-led poster planner
    text: Set a clear reading order for the event name, essential details and next action.
  - title: Poster designer
    text: Build the poster from that hierarchy and the confirmed event facts.
  - title: Colour contrast checker
    text: Extract actual text and background colors into temporary CSS tokens and explicit pair data for the supplied checker. Check those pairs, then visually inspect image, gradient and opacity areas; mark any color or rendering evidence that is unavailable.
output_shape: |-
  Scope and source coverage
  A poster layout, checked text and final export checklist.
  Step files and evidence references
  Unresolved facts and checks missed
  Proposed next action and approval status
tweaks:
  - what: Scope
    how: Choose one project, team, period or decision so the sources are comparable.
  - what: Evidence
    how: Provide the actual records and their dates rather than a summary from memory.
  - what: Acceptance
    how: The date, location, price and action are legible at the intended size and agree with the source.
judge:
  - The date, location, price and action are legible at the intended size and agree with the source.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
works_best_with:
  tools:
    - name: Python image/PDF tools and fonts
      why: A finished poster needs the drawing tools, licensed fonts and inspection at its intended size.
    - name: Node.js and the bundled contrast checker
      why: Provide actual CSS color tokens and pair data; visually inspect gradients and image backgrounds separately.
  inputs:
    - Approved examples of a good result.
    - A named reviewer and their acceptance rules.
terms:
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
