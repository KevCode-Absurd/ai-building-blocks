new_slug: make-a-recurring-process-easier-to-hand-over
name: Make a recurring process easier to hand over
headline: Make a recurring process easier to hand over
summary: Share the source files. Get an evidence-based procedure, exception guide and handover checklist.
job: document-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: An evidence-based procedure, exception guide and handover checklist. Share a recent real process run, current instructions, exceptions, tools and intended replacement owner. Your AI prepares the work and marks any facts it cannot verify.
explain: |-
  An evidence-based procedure, exception guide and handover checklist.

  Give your AI the source material listed below and install the complete pack. It uses the component skills in the stated order, saves each result and checks the handoff before continuing. A newcomer can locate inputs, do each step and know when to stop or escalate. Missing tools or evidence stay visible in the final summary.
when:
  - You need an evidence-based procedure, exception guide and handover checklist.
  - The relevant facts are spread across files or notes and need one consistent review.
  - You want the work and its checks saved so another person can review it.
not_for:
  - "You only need a quick note for a holiday or leave: use the Handover note writer on its own."
  - "The process is slow or wasteful and you want to cut steps first: use the Process waste finder."
  - "Nobody has run the process lately and you have no real example: this needs a recent run, so do one first and keep the notes."
you_give:
  - A recent real process run, current instructions, exceptions, tools and intended replacement owner.
  - The intended reader, deadline and limits on what may be changed.
  - Earlier work and approved examples, if available.
you_get:
  - An evidence-based procedure, exception guide and handover checklist.
  - Step files with evidence, unresolved facts and actual checks completed.
  - A hand-back summary and one practical next step.
how_to_use:
  - Download the complete pack and add its governing file and component skills to your AI.
  - Share the sources listed above and say which result you need.
  - Ask the AI to follow the governing file, save each result and stop on a failed required check.
  - Review the files, missing facts and proposed actions before using the result.
output_sample:
  input:
    - A recent real run of the process, with dates and records
    - The current instructions, if any, and the tools involved
    - The exceptions that come up and who handles them
    - The person taking over, and your deadline
  prerequisites:
    - An AI that can read files, to run the pack
  output:
    - name: "Step 1: Procedure"
      contains: The process with owner, steps, who does each one, checks, exceptions and a clear definition of done.
    - name: "Step 2: Handover note"
      contains: What will break first, what is due, where things live, who to ask, and practice tasks for the replacement.
    - name: Source coverage
      contains: Which records were used, with dates, and which facts are marked MISSING.
    - name: Hand-back summary
      contains: Each saved file, checks that could not run, and one next step.
how_it_works:
  - title: Process and SOP writer
    text: Write the procedure with inputs, checks, exceptions and the final definition of done.
  - title: Handover note writer
    text: Prepare the current-state handover and list the practice tasks the replacement should complete.
output_shape: |-
  Scope and source coverage
  An evidence-based procedure, exception guide and handover checklist.
  Step files and evidence references
  Unresolved facts and checks missed
  Proposed next action and approval status
tweaks:
  - what: Scope
    how: Choose one project, team, period or decision so the sources are comparable.
  - what: Evidence
    how: Provide the actual records and their dates rather than a summary from memory.
  - what: Acceptance
    how: A newcomer can locate inputs, do each step and know when to stop or escalate.
judge:
  - A newcomer can locate inputs, do each step and know when to stop or escalate.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
works_best_with:
  tools:
    - name: A capable chat AI with file support
      why: Read the full pack and supplied sources; connected actions need the corresponding authorized tools.
  inputs:
    - Approved examples of a good result.
    - A named reviewer and their acceptance rules.
terms:
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
