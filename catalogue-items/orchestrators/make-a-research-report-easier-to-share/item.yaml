steps:
  - uses: plain-english-editor
    note: Edits the findings for your reader. Keeps the uncertainty and caveats that matter. Hands the plain version to the slide step.
  - uses: presentation-builder
    note: Turns the supported findings into a slide outline around the decision, one idea per slide. This workflow uses the outline, not a finished deck.
  - uses: proofreader
    note: Fixes typos and wording in the summary and the slide text. The workflow then compares each figure, date and source across the report, summary and slides.
