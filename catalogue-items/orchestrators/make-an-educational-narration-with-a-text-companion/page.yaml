new_slug: make-an-educational-narration-with-a-text-companion
name: Make a lesson narration learners can follow
summary: Attach an approved lesson and audio brief. Get a checked spoken script, narration where tools permit and a text companion.
job: work-with-audio
headline: Make a lesson narration learners can follow
subhead: Attach an approved lesson and audio brief. Get a checked spoken script, narration where tools permit and a text companion.
explain: Learners who prefer to listen need a spoken version of a lesson that keeps its facts. This workflow takes an approved lesson and a short listener brief, rewrites the lesson in plain words, shapes it into short spoken sentences, and makes the audio when a speech tool and your OK to spend are in place. Without them you get the full script and a speech brief, with audio marked NOT RUN. A written transcript of the audio comes with it.
when:
  - Creating spoken access to a short educational resource
not_for:
  - "You only need a plain-words rewrite of a lesson: use the Plain English editor."
  - "You have a final script and want it dubbed into other languages with subtitles: use Multilingual voiceover and subtitle producer."
  - "The lesson is not yet approved or you do not hold the rights to its text: get that first, since this workflow keeps the facts as given."
you_give:
  - "APPROVED_LESSON: attach exact learning facts, examples, citations and rights-approved text."
  - "LISTENER_BRIEF: give learners, access needs, purpose, length and pronunciation guidance."
  - "AUDIO_CHOICES: choose supported built-in voice, format and delivery style; identify available tools."
  - "RUN_PERMISSION: authorize paid synthesis and a spend cap through tool setup; never paste keys."
you_get:
  - Narration script, pronunciation guide and duration estimate
  - Audio if generated, text companion and listening-check record
output_sample:
  input:
    - The approved lesson, with its facts, examples and citations
    - Who will listen, their access needs, the length you want and any words that are hard to say
    - The voice and delivery style, from the voices your tool offers
    - Your OK to run paid speech generation, with a spend cap
  prerequisites:
    - An AI that can run tools, if you want real audio
    - Without that, you still get the full script and a speech brief, marked audio NOT RUN
  output:
    - name: "Step 1: Narration text"
      contains: Clear text that keeps the required facts and terms, with a list of every change from the lesson.
    - name: "Step 2: Spoken script"
      contains: Short spoken sentences, pauses, a pronunciation guide, a plain-text version with no markup tags and an estimated duration.
    - name: "Step 3: Audio and companion text"
      contains: Audio files if generated, text that matches the audio, and a record of listening checks and fixes.
    - name: Check table
      contains: PASS, FAIL or NOT RUN for each check, with what is needed next.
how_it_works:
  - title: Preserve meaning while clarifying
    text: Use approved lesson and listener brief to prepare clear narration text. Preserve required facts/terms and explain specialist words. Hand edited text and material-change list to spoken-script preparation.
  - title: Make the script speak naturally
    text: Use edited text and length to build short spoken sentences, pauses and pronunciation notes. Supply a plain-text version with no synthesis markup tags for the chosen speech tool; mark duration estimated until measured.
  - title: Generate and check narration
    text: Use the approved plain-text script with no markup tags, supported built-in voice and authorized tools. Generate real audio only when runtime and credentials exist. Check facts, pronunciation, pacing and truncation; return a written transcript of the audio as the companion text, and corrections.
judge:
  - Learning facts and necessary terms match source.
  - Synthesis text contains no unsupported tags.
  - Audio, estimates and actual listening checks are separate.
  - A usable text alternative accompanies the resource.
how_to_use:
  - Download the complete workflow or agent pack and unzip it.
  - Give the complete folder to your AI. Start with START_HERE.txt, then provide the named inputs in the coordinator skill.
  - Follow its checkpoints and check the evidence before using any output. Agent packs run one requested cycle; they do not create a schedule.
  - Next, after the source owner approves any factual edits, publish the companion text with the audio. If audio was NOT RUN, hand the script and speech brief to the Voiceover maker.
thinking: high
