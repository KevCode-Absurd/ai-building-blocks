steps:
  - uses: source-note-summariser
    note: Read the reviewer comments and manuscript; map each comment to the relevant section and available evidence without claiming a revision has been made.
  - uses: executive-action-register
    note: Turn explicit author commitments into a versioned response register. Separate proposed work from accepted tasks and retain missing owners and dates.
  - uses: proofreader
    note: If an actual response draft was supplied, check respectful wording, consistent comment numbering and manuscript references. If no draft exists, explicitly skip this optional proofreading step and return the response matrix and tasks; do not invent experimental findings.
