new_slug: marketing-email-html-builder
name: Marketing email HTML builder
summary: Give it your copy and product photos. Get two HTML email designs, previews and a file kit you can edit.
job: write-emails
headline: Marketing email HTML builder
subhead: Make two email looks from one clear brief.
explain: Produces actual HTML compositions rather than a designer brief. One copy deck becomes a house design and a reference-led design, with an image concept round and documented rendering checks.
when:
  - You have email copy or an angle and want a designed email.
  - You need two visual directions for the same campaign.
  - You want an editable HTML handoff for an email platform.
not_for:
  - "You only need the email words: use the Campaign email writer."
  - "You want a layout plan for your own designer, not finished HTML: use the Email layout brief writer."
  - "You already have a designed email and want it checked before sending: use the Email design checker."
  - "You have no real photos of the product: you get a labelled wireframe, not product images."
you_give:
  - Campaign goal, audience, current offer terms and approved product facts.
  - Brand colours, fonts, logo and real photos of the exact product.
  - Existing copy or a brief, plus any cleared design references.
you_get:
  - One copy deck and module map.
  - Two HTML designs, a plain-text version and asset list.
  - Preview/check results and a versioned handoff folder.
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - The image round needs an image tool, such as ChatGPT or Gemini. Free plans have tight limits, and an image API key bills each picture. Without one, you get a labelled wireframe and the rest still runs.
  - Check the result against the supplied facts before using it.
output_sample:
  input:
    - Your campaign goal, audience and offer terms, if there is an offer
    - Your approved product facts and any email copy you already have
    - Real photos of the exact product
    - Your brand colours, fonts and logo
    - One or two emails you like, only if you have the right to use them as references (optional)
  prerequisites:
    - An AI that can read your files and photos
    - A way to preview HTML, if you want rendered previews
    - Test sends to your real email apps, since the AI cannot check inboxes
  output:
    - name: brief.md
      contains: Subject, preview text, the one action, approved copy by module, claim sources and open facts.
    - name: email-a.html
      contains: An editable HTML email in a house design direction, with real text for headlines, terms and buttons.
    - name: email-b.html
      contains: A second design from a cleared reference, with the same copy and a table of what was borrowed.
    - name: Plain-text version
      contains: The same email as plain text.
    - name: Assets and usage notes
      contains: The images used, where each goes and how, with a check that the product matches your photo.
    - name: Previews and check log
      contains: Renders at 600, 390 and 320 pixels and the checks that were really run.
    - name: Open issues
      contains: Anything not checked or missing, and the next version saved as v2 or v3 with a change note.
how_it_works:
  - title: Set the message
    text: Confirm facts, audience, offer and one action; write copy and a module map.
  - title: Compare visual directions
    text: Plan two distinct executions and two or three hero concepts grounded in real product photos.
  - title: Build and inspect
    text: Compose editable HTML, preview both sizes and prepare an email-safe fallback before handoff.
improve:
  - Check the finished email with the Email design checker before you send it.
  - Bring later copy changes to the Campaign email writer, then rebuild with this workflow.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
