new_slug: plan-a-difficult-feedback-conversation
job: think-and-decide
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
name: Plan a difficult feedback conversation
headline: Plan a difficult feedback conversation
summary: Plan a hard feedback talk. Get what to say, an opening built on facts, listening questions and one clear request for the change.
subhead: Describe one behavior you saw, what it caused, the facts you can point to and the change you want. Your AI plans the talk, drafts your opening, edits it into plain words and adds questions that leave room for the other person to answer.
explain: |-
  Hard talks go wrong when feedback is vague, too soft or a list of everything. This workflow plans a difficult feedback conversation around one behavior, facts you can point to and one clear request.

  The first step places the talk by how much you care about the person and how direct you need to be, then sets out what to praise, what to say and what to ask. The second drafts your opening, joins the praise to the change with "and" instead of "but", and leaves the other person a way to save face. The third edits for plain words and keeps room for them to disagree.

  It writes what you might say. You choose the words, the time and the place. It does not decide who is at fault, and it sends nothing.
when:
  - A teammate keeps missing deadlines and you have put the talk off.
  - A student, volunteer or colleague did something that cost others and you need to raise it.
  - You said it once, softly, and nothing changed.
  - You are about to write a long message and suspect a calm talk would work better.
not_for:
  - The issue is harassment, safety or a legal case. Follow your HR process and take advice first.
  - You are the go-between for two students in conflict. Use the Restorative conversation planner.
  - You want feedback on a piece of writing. Use the Honest draft feedback giver.
  - You only need the message written, with no talk planned. Use the Hard feedback message writer.
you_give:
  - One behavior you saw, as what happened, not what you think of the person
  - What it caused, for you, for others or for the work
  - The facts you can point to, such as dates, messages or examples
  - How you know the person, and what change you want
  - What you cannot promise or will not discuss
  - What the person has said about it before (optional)
  - Notes or an earlier draft of what you plan to say (optional)
you_get:
  - "A conversation plan: where you stand, what to praise, what to say and how to say it"
  - An opening you can say aloud, built on facts, with one clear request
  - Listening questions, and what to do if they push back
  - A plain-words edit of the opening, with each change explained
  - A follow-up date and what to check
  - A list of what was missing and one next step
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini and say "Follow HANDOFF.md".
  - Paste what happened, what it caused, your facts and the change you want. Leave out your guesses about why they did it.
  - Read the opening aloud. If it does not sound like you, change it before the talk.
  - Hold the talk in person or on a call, then use the follow-up date from the plan.
how_it_works:
  - title: Feedback conversation planner
    text: Names the one behavior and its effect, places the talk and sets out the praise, the statement and the questions. It hands the facts and the request to the opening step.
  - title: Hard feedback message writer
    text: Drafts the opening from the facts, with praise joined to the change, one plain statement and a way for the other person to save face. It hands the draft to the editor.
  - title: Plain English editor
    text: Edits the opening and the questions into plain words and explains each change. It keeps what the facts support and leaves room to disagree.
output_shape: |-
  CONVERSATION PLAN
    Where you stand | open with | say: behavior and effect | how to say it

  OPENING
    <the lines you might say aloud, with one clear request>

  LISTENING QUESTIONS
    <question> | if they push back: <what to do>

  EDITED OPENING
    <plain-words version> | changes and reasons

  FOLLOW-UP
    Date | what you will check

  HAND-BACK SUMMARY
    Files | MISSING lines | checks not done | one next step
output_sample:
  input:
    - One behavior you saw, as what happened
    - What it caused and the facts you can point to
    - How you know the person, and the change you want
    - What you cannot promise or will not discuss
  prerequisites:
    - A time and place to talk in person or on a call, which you choose
  output:
    - name: Conversation plan
      contains: Where you stand, what to praise, what to say and how to say it.
    - name: Opening
      contains: Lines to say aloud, built on facts, with one clear request.
    - name: Listening questions
      contains: Questions that invite the other person to speak, and what to do if they push back.
    - name: Edited opening
      contains: A plain-words version of the opening, with each change and its reason.
    - name: Hand-back summary
      contains: Files saved, facts missing, checks not done and one next step.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can plan the talk from what you type. A person you trust can play the other side so you can practise.
  inputs:
    - A quote or message that shows the behavior, with the date.
    - What you already tried to say before.
tweaks:
  - what: Scope
    how: One behavior per talk. A list of problems gets a defensive answer.
  - what: Evidence
    how: Give dates and examples you can point to. Leave out what you suspect about their reasons.
  - what: Acceptance
    how: Say what a good outcome is, such as one agreed change by a set date.
improve:
  - After the talk, note what you said and how they answered, and bring it to the follow-up.
  - Practise the opening out loud with someone and change what feels stiff.
  - Keep the facts file so the next talk starts from what happened, not memory.
next:
  - executive-action-register
  - hard-feedback-message-writer
terms:
  - term: Behavior
    meaning: What a person did or said, which you could see or hear, as opposed to what you think of them.
  - term: Save face
    meaning: Leave the other person a way to respond without feeling shamed.
judge:
  - The plan separates facts from interpretations and leaves room for the other person to disagree.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
