steps:
  - uses: peer-feedback-session-planner
    note: "Picks reviewers, sets the time for each part, writes the rules and builds the note form. Hands the criteria and the form to the model step."
  - uses: honest-draft-feedback-giver
    note: "Uses the one permitted draft you give it, not step 1's output, and the criteria from step 1. Writes honest feedback on it, naming what works, what to leave alone and which lines to question. Hands that example to the revision record."
  - uses: reader-feedback-sorter
    note: "Runs only when real comments exist. Sorts them into fixes, split opinions and facts to check, then ranks a rewrite list. Before that, it is marked not run and the record stays blank."
