new_slug: plan-a-purchase-around-your-real-budget
name: Plan a purchase around your real budget
headline: Plan a purchase around your real budget
summary: See what a purchase really costs over time and whether it fits your cash limit. Give it your budget and quotes to get a cost table and decision brief.
job: money-and-investing
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your income and bills, two or more quotes with their running costs, and your own decision checklist. It finds the cash you can spend without touching fixed bills, compares the full cost of each quote, and checks the purchase against your rules. You get a cost table and a short decision brief.
explain: |-
  A price tag is often the smallest part of a purchase. Repairs, subscriptions, fees and replacement add up. A purchase can fit this month's cash and still be a bad fit once a year of costs is counted. This workflow plans a purchase around the cash you really have, not around the quote.

  It works in three steps. First it sorts your income and bills and finds the money left for this purchase. Then it compares each quote on what you need it for, the full cost over the time you will keep it, and the trade-offs. Last it runs your own checklist, with your stop rules. An answer you cannot back with a fact counts as a fail until you find the fact.

  The cash limit comes first, and the checklist is yours. It does not pick for you, find quotes, spend money or give tax, legal or investment advice. You decide.
when:
  - You have two or three quotes for a car, a laptop, a sofa, software or a course, and the price tags hide the running costs.
  - You can afford the monthly payment but are not sure you can afford the year.
  - You want a go, wait or no call that you can explain to a partner or co-owner.
  - You are about to make a big purchase and want to test it against your own rules first.
not_for:
  - "You have no budget or cash limit to work from yet: build one first with the Personal budget builder."
  - "You only want a short pause before an impulse buy: use the Big purchase reviewer."
  - "You do not have a decision checklist: write one first with the Decision checklist builder, then come back."
you_give:
  - Your monthly take-home income and fixed bills, from pay slips and bank statements
  - The cash you could put toward this purchase, and any amount you want to keep untouched
  - Two or more quotes for the same purchase, with price, fees and how long you will keep it
  - Running costs for each quote, such as repairs, subscriptions, insurance or power (optional)
  - Your decision checklist with pass lines and stop rules
  - What you need it to do, and the date you must decide by
you_get:
  - A budget that shows the cash available for this purchase
  - A cost table with each quote's full cost over the time you will keep it
  - "Your checklist answered line by line: PASS, FAIL or UNKNOWN, with the fact behind each"
  - A decision brief with the call (go, wait or no), the reason and what would change it
  - A list of facts still missing
how_to_use:
  - Add the workflow pack to Claude, ChatGPT or Gemini.
  - Attach or paste your income, fixed bills and savings. Add each quote with its price, fees and running costs.
  - Paste your decision checklist. If you do not have one, build it first with the Decision checklist builder.
  - After step 1, check the cash figure against your bank balance and bills. Fix anything missing before you go on.
  - After step 2, check that every quote covers the same time span and includes fees and running costs.
  - Read the brief and every MISSING line. Treat UNKNOWN answers as open until you find the fact.
how_it_works:
  - title: Personal budget builder
    text: Sorts your income and bills into needs, wants and savings and finds the money left for this purchase. Hands step 3 the cash limit and the fixed bills it must not touch. Step 2 starts from your quotes.
  - title: Vendor comparison writer
    text: Starts from your quotes, not the budget. Compares each quote on what you need it for, the full cost over the time you keep it (price, fees, running costs, replacement) and the risks. Hands step 3 a cost table and the trade-offs.
  - title: Decision checklist runner
    text: Runs your checklist in order against the budget and the quotes. An unknown counts as a fail, and a failed stop rule gives no or wait. Ends with the call and a record you can review later.
output_shape: |-
  CASH AVAILABLE  income <n>, fixed bills <n>, left for this purchase <n>
  COST TABLE      <quote> | price | fees | running cost per year | total over <years>
  TRADE-OFFS      <one line for each quote>
  CHECKLIST       <item> | PASS / FAIL / UNKNOWN | <the fact behind it>
  CALL            go, wait or no. Reason. What would change it.
  MISSING         <each gap>
  CHECKS MISSED   <each check not done, or none>
output_sample:
  input:
    - Your income, fixed bills and the cash you could use
    - Two or more quotes with price, fees and running costs
    - Your decision checklist with stop rules
    - What you need it to do, and your deadline
  prerequisites:
    - A decision checklist, built with the Decision checklist builder or your own
  output:
    - name: Cash available
      contains: Income, fixed bills and the amount left for this purchase.
    - name: Cost table
      contains: Each quote's price, fees, running costs and total over the time you keep it.
    - name: Trade-offs
      contains: One line for each quote on what you gain and what you give up.
    - name: Checklist result
      contains: Every checklist item with PASS, FAIL or UNKNOWN and the fact behind it.
    - name: Decision brief
      contains: The call (go, wait or no), the reason and what would change it.

tweaks:
  - what: Scope
    how: Choose one project, team, period or decision so the sources are comparable.
  - what: Evidence
    how: Provide the actual records and their dates rather than a summary from memory.
  - what: Acceptance
    how: Recurring charges, replacement needs and uncertainty are shown; affordability follows your supplied cash limits.
judge:
  - Recurring charges, replacement needs and uncertainty are shown; affordability follows your supplied cash limits.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.

works_best_with:
  tools:
    - name: A chat AI with file support
      why: Reads statements, quotes and your checklist. In plain chat, paste the figures instead.
  inputs:
    - Three months of bank statements, so the bills are real and not remembered
    - A partner or co-owner who will read the brief with you
terms:
  - term: Total cost
    meaning: Price plus fees, running costs and replacement over the time you will keep the purchase.
  - term: Cash limit
    meaning: The most you can spend without touching bills or savings you want to protect.
  - term: Stop rule
    meaning: A checklist line that blocks the purchase if it fails, however good the rest looks.
next:
  - big-purchase-pause-check
before:
  - decision-checklist-builder
