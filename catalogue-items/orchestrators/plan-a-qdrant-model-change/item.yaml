slug: plan-a-qdrant-model-change
name: Plan a Qdrant model change
summary: Share your search setup and new model. Get a migration plan, relevance
  tests and monitoring before switching traffic.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: brief
    required: true
  - type: codebase
    required: false
outputs:
  - type: document
uses:
  - copilot-qdrant-model-migration
  - copilot-qdrant-search-quality
  - copilot-qdrant-monitoring
steps:
  - uses: copilot-qdrant-model-migration
    note: 1. Read skills/copilot-qdrant-model-migration/SKILL.md. Share your current
      and new models. Get a search migration plan with validation and rollback
      steps. It hands the plan, with the new model and the rollback steps, to
      steps 2 and 3. Save the result with source references. Carry the user's
      goal and all earlier findings into this step. If required evidence or tool
      access is missing, mark this step blocked; do not fabricate a result.
  - uses: copilot-qdrant-search-quality
    note: 2. Read skills/copilot-qdrant-search-quality/SKILL.md. Share queries and
      weak results. Get likely relevance problems and tests to compare proposed
      fixes. It uses your own failing searches and model details, not step 1's
      output, and checks them against the new model in step 1's plan. It hands
      the tests to step 3. Save the result with source references. Carry the
      user's goal and all earlier findings into this step. If required evidence
      or tool access is missing, mark this step blocked; do not fabricate a
      result.
  - uses: copilot-qdrant-monitoring
    note: 3. Read skills/copilot-qdrant-monitoring/SKILL.md. Share your Qdrant
      setup. Get useful health metrics, alerts and checks for slow or unhealthy
      search. It uses your own setup and version, not step 2's output, and
      builds the alerts and rollback gates around step 1's plan and step 2's
      tests. Save the result with source references. Carry the user's goal and
      all earlier findings into this step. If required evidence or tool access
      is missing, mark this step blocked; do not fabricate a result.
origin: rebuilt
