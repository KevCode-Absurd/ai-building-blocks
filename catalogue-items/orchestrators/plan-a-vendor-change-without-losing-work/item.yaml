slug: plan-a-vendor-change-without-losing-work
name: Plan a vendor change without losing work
summary: Switch software or service vendors without dropping work. Get a vendor choice, an exit checklist with notice dates and a staged rollout with rollback.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: contract
    required: true
  - type: spreadsheet
    required: false
  - type: question
    required: false
outputs:
  - type: audit_report
  - type: plan
  - type: document
uses:
  - vendor-comparison-writer
  - project-risk-portfolio
  - change-rollout-planner
steps:
  - uses: vendor-comparison-writer
    note: Compare the current vendor and each replacement on the tasks you need, the cost and the evidence supplied. Hand step 2 the chosen option and the tasks it must cover.
  - uses: project-risk-portfolio
    note: "Map the risks of the move: dependencies, data, double-running cost and fallback. Hand step 3 the ranked risks."
  - uses: change-rollout-planner
    note: Plan the staged switch with training and support. Keep a rollback until acceptance is checked. Add the exit checklist with notice and data access dates.
