slug: plan-an-event-follow-up-that-earns-a-reply
name: Plan an event follow up that earns a reply
summary: Turn event notes and your attendee list into follow-up drafts grouped by what each person asked for, with every promise you made tracked.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: lead_list
    required: true
  - type: meeting_notes
    required: false
  - type: brief
    required: true
outputs:
  - type: plan
  - type: copy_draft
  - type: document
uses:
  - event-marketing-planner
  - executive-action-register
  - executive-due-task-drafts
steps:
  - uses: event-marketing-planner
    note: Group the people you met by what they asked for and by the event goal. Write the reason to contact each group. Hand step 2 the groups and your event notes.
  - uses: executive-action-register
    note: Pull every promise out of your notes, such as a file, an introduction or a call, with its owner, due date and the note it came from. Hand step 3 the promise register.
  - uses: executive-due-task-drafts
    note: Draft one email per group or promise from the register, with its source. Draft only. Do not send. Hand back the drafts, a draft ledger and a list of people to hold.
