slug: plan-coverage-for-a-critical-role
name: Plan coverage for a critical role
summary: Make sure someone can cover each critical task. Get a role coverage
  map, the skills each backup needs, practice actions and a handover checklist.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: question
    required: true
  - type: document
    required: false
outputs:
  - type: plan
  - type: document
uses:
  - succession-plan-builder
  - role-skills-framework-builder
  - training-program-builder
steps:
  - uses: succession-plan-builder
    note: Identify continuity needs and possible cover using supplied skills and
      role evidence. Hands the coverage map, with each task's gaps, to the
      skills step.
  - uses: role-skills-framework-builder
    note: Define the observable skills each proposed backup needs for the critical
      tasks, from the coverage map. Hands the skills each backup lacks to the
      training step.
  - uses: training-program-builder
    note: Create practice and review actions to close the specific gaps before cover
      is needed. Uses the skills each backup lacks from step 2 and your time
      left.
