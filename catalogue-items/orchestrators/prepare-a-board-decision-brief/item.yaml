      the facts still missing. Save the result with source references. Carry the
      user's goal and all earlier findings into this step. If required evidence
      or tool access is missing, mark this step blocked; do not fabricate a
      result.
  - uses: copilot-gtm-board-and-investor-communication
    note: 2. Read skills/copilot-gtm-board-and-investor-communication/SKILL.md.
      Share company facts and decisions due. Get a board story, investor update
      and questions to prepare for. Save the result with source references.
      Carry the user's goal and all earlier findings into this step. If required
      evidence or tool access is missing, mark this step blocked; do not
      fabricate a result.
  - uses: copilot-gtm-operating-cadence
    note: 3. Read skills/copilot-gtm-operating-cadence/SKILL.md. Share your team and
      goals. Get meeting rhythms, metric reviews and decision rules that fit
      your stage. Save the result with source references. Carry the user's goal
      and all earlier findings into this step. If required evidence or tool
      access is missing, mark this step blocked; do not fabricate a result.
