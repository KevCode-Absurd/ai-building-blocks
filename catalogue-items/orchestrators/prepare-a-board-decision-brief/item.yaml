slug: prepare-a-board-decision-brief
name: Prepare a board decision brief
summary: Share company facts and decisions due. Get an evidence map, a board
  update and a review rhythm.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: question
    required: true
  - type: spreadsheet
    required: true
  - type: business_profile
    required: false
outputs:
  - type: document
uses:
  - copilot-build-evidence-map
  - copilot-gtm-board-and-investor-communication
  - copilot-gtm-operating-cadence
steps:
  - uses: copilot-build-evidence-map
    note: "1. Read skills/copilot-build-evidence-map/SKILL.md. Share a disputed choice and sources. Get claims linked to evidence, counterarguments and the facts still missing. Save the result with source references. Hands step 2 the evidence map: the case for each decision, what pushes against it and what is still missing. Carry the user's goal and all earlier findings into this step. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
  - uses: copilot-gtm-board-and-investor-communication
    note: "2. Read skills/copilot-gtm-board-and-investor-communication/SKILL.md. Uses your own company facts and the decisions due for the numbers, and step 1's evidence map for the case behind each decision. Get a board story, investor update and questions to prepare for. Save the result with source references. Hands step 3 the board story and the metrics it reports. Carry the user's goal and all earlier findings into this step. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
  - uses: copilot-gtm-operating-cadence
    note: "3. Read skills/copilot-gtm-operating-cadence/SKILL.md. Uses your own team and goals brief, plus the metrics and decisions from step 2's board update. Get meeting rhythms, metric reviews and decision rules that fit your stage. Save the result with source references. This is the final step; it hands back the review rhythm. Carry the user's goal and all earlier findings into this step. If required evidence or tool access is missing, mark this step blocked; do not fabricate a result."
origin: rebuilt
version: 1.0.0
credits:
