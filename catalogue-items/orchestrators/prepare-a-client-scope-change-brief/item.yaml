steps:
  - uses: plain-words-contract-summary
    note: Find the deliverables, exclusions, change procedure, fees and notice terms in the signed engagement, with clause references. Hand step 2 the baseline scope and change rules.
  - uses: team-capacity-planner
    note: Set the request against real commitments, skills, effort ranges and free hours, and show what happens to work already promised. Hand step 3 the effect on hours and dates.
  - uses: stakeholder-update-writer
    note: "Draft the client decision brief: options, supported cost and date effects, open questions and approval status. Keep it as a draft."
