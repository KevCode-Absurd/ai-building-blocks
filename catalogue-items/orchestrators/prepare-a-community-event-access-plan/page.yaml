new_slug: prepare-a-community-event-access-plan
name: Prepare a community event access plan
headline: Prepare a community event access plan
summary: "Plan access for a community event: a run sheet from arrival to exit, who does what, and confirmation requests to send the venue."
job: organise-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your event format, venue details and the access needs people chose to share. It maps who is involved, writes the arrival-to-exit steps, flags what the venue has not confirmed and drafts the questions to ask.
explain: |-
  Community events fail on access in small ways: a locked side door, a lift nobody checked, a quiet room that is the storage cupboard. This event access plan puts those checks on paper before the day, so the venue confirms them and your helpers know their jobs.

  Step 1 maps the people: organizers, venue contacts, access providers such as interpreters or hire companies, and the groups of guests who need help. It uses roles and counts, not names. Step 2 writes the run sheet from arrival to exit from the venue facts you have confirmed, and flags every facility you have not. The workflow then drafts one confirmation request for each unverified fact, to the right contact.

  Nothing is described as booked until the venue or provider confirms it. Needs shared with you stay private and are used only for this event.
when:
  - You are running a local meeting, fair or workshop and guests have asked about access.
  - You are using a venue you have not visited and need to check step-free routes.
  - Volunteers ask who does what when someone needs help on the day.
  - You have a small access budget and need to decide where it goes.
not_for:
  - You want a general run of show with no focus on access. Use the Process and SOP writer.
  - You need a certificate or a legal check of the building. A qualified person or the venue must do that. This plans and does not certify.
  - You only want to see who is involved. Use the Stakeholder map builder.
  - The event is a group stay in a hotel. Use the Hotel group booking handover checker workflow.
  - The event is for a work team. Use the Team offsite decision and agenda planner workflow.
you_give:
  - The event format, date, time and how many people you expect
  - "Venue details: address, floor plan, the venue's own access page and a contact"
  - Access needs that guests chose to share, grouped by need, such as step-free entry (names only if the person agreed)
  - Your approved budget for access, such as hire or an interpreter (optional)
  - Who on your team does what on the day
you_get:
  - A map of who is involved, by role
  - A run sheet from arrival to exit, with a helper named for each step
  - A list of venue facts that are still unconfirmed
  - Draft confirmation requests, one per unconfirmed fact
  - A short list of what to fix first, within your budget
how_to_use:
  - Open Claude, ChatGPT or Gemini. Pick one that can read files if you will attach a floor plan or the venue's access page.
  - Add the workflow pack. Paste the event format, venue details, the access needs as counts and groups, your budget and who is helping.
  - After step 1, check the role map for anyone missing. Remove any name that should not be there.
  - After step 2, read the run sheet as if you were a guest arriving. Every facility marked unconfirmed needs a call or email.
  - Send the draft requests yourself and fill each confirmation back in. Re-run step 2 once the venue answers.
how_it_works:
  - title: Stakeholder map builder
    text: "Maps organizers, venue contacts, access providers and the groups of guests who need help, by role. Proposed people are marked proposed, and personal details stay out. Hands step 2 the role list and the needs by group. Check before moving on: no guest is named with a need they did not agree to share."
  - title: Process and SOP writer
    text: "Writes the arrival-to-exit run sheet: entrance and routes, wayfinding, seating, toilets, a quiet space, communication and who helps at each point, plus who to call when something fails. Facts you have not confirmed are flagged. The workflow then drafts one confirmation request per flagged fact. Check before moving on: no step relies on a facility marked unconfirmed."
output_shape: |-
  PEOPLE AND ROLES       <role> | <what they do> | <contact role> | confirmed or proposed
  NEEDS BY GROUP         <need> | <number of guests> | <what helps>
  RUN SHEET              <time or stage> | <what happens> | helper <role> | venue fact used | confirmed or unconfirmed
  UNCONFIRMED FACTS      <fact> | who can confirm | needed by
  CONFIRMATION REQUESTS  to <contact role>: <draft message>
  BUDGET                 <item> | within approved budget or not
  MISSING                <each gap, and what it stops>
  CHECKS MISSED          <one line each, or none>
output_sample:
  input:
    - Your event format, date, time and expected numbers
    - Venue details and the venue's access page or floor plan
    - Access needs guests chose to share, grouped by need
    - Your approved access budget and who is helping (optional)
  prerequisites:
    - A named contact at the venue
  output:
    - name: People and roles
      contains: Organizers, venue contacts, access providers and guest groups, by role, with confirmed or proposed marked.
    - name: Needs by group
      contains: What guests asked for, counted by need, with no names unless agreed.
    - name: Run sheet
      contains: Arrival to exit, with a helper for each step and each venue fact it depends on.
    - name: Unconfirmed facts
      contains: Facilities nobody has verified, who can confirm each, and by when.
    - name: Confirmation requests
      contains: One draft message per unconfirmed fact, addressed to the right contact. Not sent.
    - name: MISSING and CHECKS MISSED
      contains: Gaps in venue or budget details, and any check that could not run.
tweaks:
  - what: A new venue
    how: Swap in the other venue's details. The unconfirmed list and requests change.
  - what: A smaller budget
    how: Lower the access budget. The plan shows what stays and what drops.
  - what: A new need
    how: Add one more group's need and run step 2 again. The run sheet gains the steps for it.
judge:
  - Access arrangements are verified with the responsible provider; proposed adjustments are not described as booked.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep the venue's written confirmations with the run sheet, so helpers can check them on the day.
  - Ask guests how they want their needs used and shared before you send them to anyone.
  - After the event, note what worked and what did not, and use it next time.
works_best_with:
  tools:
    - name: A chat AI that reads files
      why: It can read the venue's floor plan or access page, so the run sheet uses their facts.
    - name: Email
      why: The confirmation requests are drafts. You send them from your own email and keep the replies.
  inputs:
    - A photo or map of the entrances and routes.
    - The venue's own access statement, if it has one.
terms:
  - term: Step-free
    meaning: A route with no stairs, using a ramp or a lift.
  - term: Access provider
    meaning: A person or company that supplies help, such as an interpreter, a ramp or a hearing loop.
  - term: Run sheet
    meaning: A time-ordered list of what happens, who does it and where.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
