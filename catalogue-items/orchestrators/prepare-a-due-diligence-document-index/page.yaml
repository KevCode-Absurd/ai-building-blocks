new_slug: prepare-a-due-diligence-document-index
name: Prepare a due diligence document index
headline: Prepare a due diligence document index
summary: Build a due diligence document index from your files. Get a versioned index, a request coverage map and the questions on who may see what.
job: document-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Share the documents you may disclose, the reviewer's request list, who owns each file and your rules on what may be shown. Your AI builds a document index with versions, maps each request to the files that answer it, flags what is stale or missing, and writes the handover for the reviewer.
explain: |-
  When someone reviews your business before a sale, investment or loan, they send a long request list. You answer from folders, inboxes and memory. Files turn up twice in different versions, some are out of date, and nobody is sure which ones the reviewer is allowed to open. A due diligence document index fixes that before the review starts.

  Two skills run in order. The first reads each document and records what it is, its date, its version, its owner and which requests it answers, without copying private contents. It flags anything missing, old or in conflict with another version. The second writes the handover for the reviewer: where each approved file lives, who to ask, what may not be shared and which requests are still open.

  A file on the list does not prove the set is complete. The index shows what you hold against what was asked. It does not say what the law requires, and it never grants access. Passwords and links to unapproved files stay out.
when:
  - A buyer, investor or lender has sent a long request list and you must answer it.
  - Your team keeps two or three versions of the same contract and nobody knows which is final.
  - You are building a data room and need a clean list before you upload anything.
  - A reviewer asks "who owns this?" and nobody can say.
not_for:
  - "You need a lawyer to say the document set is complete: this lists what you hold. It cannot say what is legally required. Ask your counsel."
  - "You are not sure you may share the files: get approval first. This works only on the set you are allowed to disclose."
  - "Your data room tool already keeps an index: use that. Run this only to compare it with the request list."
  - "You want the contents of one contract checked: use the Contract clause and ownership reviewer workflow."
you_give:
  - The documents you may share, as files or a list with where each is stored
  - The reviewer's request list, with request numbers if they have them
  - Who owns each document, by name or role
  - Your rules on what may be shown and to whom, such as "draft contracts are internal"
  - Dates and versions you already know, such as signed or draft (optional)
you_get:
  - A document index with name, owner, date, version, location, what it covers and its disclosure status
  - A request coverage map showing which files answer each request and which requests have none
  - Flags for missing, old and conflicting versions
  - A reviewer handover with file locations, owner contacts, limits on disclosure and open requests
  - Questions about access that someone must answer before sharing
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini, in a chat that accepts files.
  - Attach the documents you may share, or paste the file list. Paste the request list and your rules on what may be shown.
  - Tell your AI to follow the pack and save each step's file.
  - After step 1, check the index against your folders. A file missing from the index, or two versions of one file, needs fixing before the handover.
  - After step 2, have the person who owns disclosure approve every file the handover points to. Then give it to the reviewer.
how_it_works:
  - title: Source note summariser
    text: Reads each document and records its purpose, date, version, owner and the requests it answers, without copying private contents. Builds the index and the request coverage map, and flags what is missing, old or in conflict. Hands step 2 the index and the open requests. Check before moving on, each row matches a real file.
  - title: Handover note writer
    text: Writes the reviewer handover from step 1's index, your request list and your disclosure rules. It lists approved file locations, owner contacts, limits on disclosure and unresolved requests. It never includes a password or grants access. Check before sharing, every file it points to has been approved.
output_shape: |-
  SCOPE AND SOURCES      <documents, request list and rules you supplied, with dates>
  DOCUMENT INDEX         <ID | file | location | owner | date | version | what it covers | requests | disclosure status | flag>
  REQUEST COVERAGE MAP   <request | files that answer it | gap>
  FLAGS                  <missing | old | conflicting versions>
  REVIEWER HANDOVER      <where files live | owner contacts | disclosure limits | open requests>
  ACCESS QUESTIONS       <who may see what | who decides>
  MISSING                <each gap and what it stops>
  CHECKS MISSED          <one line each, or none>
tweaks:
  - what: Request list format
    how: Paste the reviewer's list as it came. If it has no numbers, the AI numbers each request and keeps their wording.
  - what: Disclosure status
    how: Give your own labels, such as approved, needs approval and do not share. The index uses them as written.
  - what: One topic first
    how: Start with the part the reviewer asked for first, such as contracts. Add the rest once the index looks right.
judge:
  - A listed file is not proof of legal completeness; access remains within the approved disclosure scope.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep the index as a running file. Add each new version and retire the old one with a date.
  - Record each answer you give the reviewer against its request number.
  - Keep your disclosure rules in one note and paste them into every run.
works_best_with:
  tools:
    - name: A chat AI that reads many files
      why: It can read each document and build the index in one pass. In plain chat, paste each file's title, date and a few lines.
  inputs:
    - The reviewer's request list, as they sent it.
    - A folder export or file list with dates.
terms:
  - term: Due diligence
    meaning: A review of a business before a sale, investment or loan, to check its facts.
  - term: Data room
    meaning: A secure place where approved documents are shared with a reviewer.
  - term: Disclosure scope
    meaning: What you have approved the reviewer to see.
  - term: Handoff
    meaning: The checked file one step passes to the next.
output_sample:
  input:
    - The documents you may share, or a list with locations
    - The reviewer's request list
    - Owners and your rules on what may be shown
  prerequisites:
    - An AI that can read files
    - A person who can approve what is disclosed
  output:
    - name: outputs/step-01-source-note-summariser.md
      contains: The document index, the request coverage map and flags for missing, old or conflicting versions.
    - name: outputs/step-02-handover-note-writer.md
      contains: The reviewer handover with approved file locations, owner contacts, disclosure limits and open requests.
    - name: Access questions
      contains: Who may see which files, and who must decide before anything is shared.
    - name: HAND-BACK SUMMARY
      contains: Files saved, sources used, MISSING lines, checks missed and one suggested next step.
