steps:
  - uses: trailing-period-financial-bridge
    note: Use actual sourced schedules in one linked native workbook; example values are illustrative and must not become issuer inputs. Map restated annual/YTD additive earnings lines to trailing periods; retain prior source versions and document every changed period or definition.
  - uses: weighted-average-share-schedule
    note: Rebuild each required weighted denominator from actual transactions. A trailing EPS denominator must be constructed for its actual interval, not formed by adding quarterly weighted shares.
  - uses: purchased-amortization-eps-bridge
    note: Update the actual charge and attributable recognized tax effect against matching reported ordinary income and sourced diluted shares; basic weighted shares feed this only when no dilution is evidenced.
  - uses: current-tax-cash-payment-bridge
    note: Reconcile current tax expense/payables to cash taxes separately from the non-GAAP tax adjustment; retained deferred-tax differences must not become cash.
  - uses: oci-reclassification-bridge
    note: Trace permitted recycling changes to both profit and OCI and prove conservation before issuing the update; list source changes and unresolved model checks for the reviewer.
