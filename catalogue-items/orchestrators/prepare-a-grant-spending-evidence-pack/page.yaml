new_slug: prepare-a-grant-spending-evidence-pack
name: Prepare a grant spending evidence pack
headline: Prepare a grant spending evidence pack
summary: Share the source files. Get a reconciled grant spending table, variance brief and evidence gaps.
job: track-numbers
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: A reconciled grant spending table, variance brief and evidence gaps. Share the award agreement, fund restrictions, approved budget, transaction records, reporting period and actual receipts. Your AI prepares the work and marks any facts it cannot verify.
explain: |-
  A reconciled grant spending table, variance brief and evidence gaps.

  Give your AI the source material listed below and install the complete pack. It uses the component skills in the stated order, saves each result and checks the handoff before continuing. Restricted spending follows the supplied award rules; unknown eligibility is a question for the fund owner. Missing tools or evidence stay visible in the final summary.
when:
  - You need a reconciled grant spending table, variance brief and evidence gaps.
  - The relevant facts are spread across files or notes and need one consistent review.
  - You want the work and its checks saved so another person can review it.
you_give:
  - The award agreement, fund restrictions, approved budget, transaction records, reporting period and actual receipts.
  - The intended reader, deadline and limits on what may be changed.
  - Earlier work and approved examples, if available.
  - "Available tools for the finished output: A compatible spreadsheet engine."
you_get:
  - A reconciled grant spending table, variance brief and evidence gaps.
  - Step files with evidence, unresolved facts and actual checks completed.
  - A hand-back summary and one practical next step.
how_to_use:
  - Download the complete pack and add its governing file and component skills to your AI.
  - Share the sources listed above and say which result you need.
  - Ask the AI to follow the governing file, save each result and stop on a failed required check.
  - Review the files, missing facts and proposed actions before using the result.
how_it_works:
  - title: Spreadsheet checker
    text: Reconcile transactions and receipts to the grant period, budget categories and restricted fund ledger without changing source records.
  - title: Budget variance explainer
    text: Bridge the actual grant spending to the approved phased budget, keeping timing differences and unapproved reallocations explicit.
  - title: Stakeholder update writer
    text: Draft the fund owner update with source totals, unresolved eligibility questions and requested decisions, without submitting a funder return.
output_shape: |-
  Scope and source coverage
  Reconciled grant spending table: date | description | amount | receipt reference | budget category | restricted fund ledger line | status (matched, unmatched or eligibility question)
  Variance brief: budget category | approved phased budget | actual | variance | cause (timing difference, unapproved reallocation or other) | source
  Evidence gaps and the fund owner update: source totals | unresolved eligibility questions | decisions you ask for
  Step files and evidence references
  Unresolved facts and checks missed
  Proposed next action and approval status
tweaks:
  - what: Scope
    how: Choose one project, team, period or decision so the sources are comparable.
  - what: Evidence
    how: Provide the actual records and their dates rather than a summary from memory.
  - what: Acceptance
    how: Restricted spending follows the supplied award rules; unknown eligibility is a question for the fund owner.
judge:
  - Restricted spending follows the supplied award rules; unknown eligibility is a question for the fund owner.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
works_best_with:
  tools:
    - name: A compatible spreadsheet engine
      why: Formula recalculation and workbook inspection need an actual compatible engine; static table checks can use supported scripts.
  inputs:
    - Approved examples of a good result.
    - A named reviewer and their acceptance rules.
terms:
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.

not_for:
  - "You want to hand over a recurring process, not report on grant spending: use Make a recurring process easier to hand over."
  - "You need an audit opinion or the funder's sign-off on the spending: ask your auditor or grant officer, because this prepares the table and marks the gaps."
  - "You have no transaction records for the reporting period: pull them from your accounts first, because the table cannot be reconciled without them."