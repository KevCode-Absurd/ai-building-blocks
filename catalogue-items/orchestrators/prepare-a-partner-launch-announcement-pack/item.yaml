uses:
  - stakeholder-map-builder
  - stakeholder-update-writer
  - brand-voice-editor
steps:
  - uses: stakeholder-map-builder
    note: List the audiences you will tell and the people on each side who must approve the announcement. Hand step 2 the audiences, the approvers and the agreed facts.
  - uses: stakeholder-update-writer
    note: "Write a one-page shared message brief from the agreed facts and step 1's audiences, then a core announcement and one version per audience. Hand step 3 every draft and the brief."
  - uses: brand-voice-editor
    note: "Check each version against the right brand's voice, using your voice examples for each brand, and keep the joint claims the same in every draft. Hand back the drafts and the approval tracker, with every draft marked unpublished until approved."
