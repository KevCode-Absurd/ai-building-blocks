new_slug: prepare-a-partner-launch-announcement-pack
name: Prepare a partner launch announcement pack
headline: Prepare a partner launch announcement pack
summary: Get a shared message brief, announcement drafts for each audience and an approval tracker for a partner launch, so both brands say the same thing.
job: write-emails
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it the facts you and your partner agreed, each side's approved messaging and voice examples, the date and your audiences. Your AI writes one shared brief, drafts for each audience and a tracker for who must approve what.
explain: |-
  A partner launch has two brands, two sets of approvers and one story. The usual failure is small: one side says "launching Tuesday", the other says "this week", and a claim your partner never agreed to goes out under both names. This workflow keeps everyone to the same agreed facts.

  It starts with who needs to know and who must check what. Then it writes a one-page shared brief of the agreed facts, a core announcement and a version for each audience. Last it checks each version against the right brand's voice and makes sure the joint claims match everywhere.

  Every draft stays unpublished until the named approvers say yes. The tracker shows who approved what and when. It never sends or posts anything for you.
when:
  - You and a partner have signed a deal and a launch date is set, and you need the announcement
  - You must tell customers, the partner's customers and your own staff, each in a different way
  - Your partner's legal or brand team must approve the wording before anything goes out
  - You want one shared set of facts so emails, posts and press notes never disagree
not_for:
  - The partner has not signed off on the deal or the date. Settle the terms first with Set up a partner deal both sides win from.
  - You want a media list and pitch emails for the press. Use the Press outreach planner.
  - You are telling only your own staff about a change. Use the Staff announcement writer.
  - You want a progress update for a team or leaders. Use the Stakeholder update writer.
you_give:
  - "The agreed partnership facts: what you are launching, the date, and what each side does"
  - Each side's approved messaging, and the rules for using each other's name and logo
  - A few examples of each brand's voice, such as past posts or emails
  - The audiences you will tell, such as your customers, their customers, staff or press
  - Where you may post or send it, and who approves on each side (optional)
you_get:
  - "A shared message brief: the agreed facts, the claims each side may make and words to avoid"
  - "An audience and approver map: who you tell and who checks each message"
  - A core announcement and one draft for each audience, in the right voice
  - "An approval tracker: each draft, its audience, approver, status and date"
  - A hand-back summary with one next step
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini and say "Follow HANDOFF.md".
  - Share the agreed facts, each side's approved messaging and voice examples, and the audiences. Use only facts both sides agreed.
  - Read the shared brief first. Send it to your partner and fix any fact either side disputes.
  - Send each draft to its approvers. Record their answers in the tracker. Publish nothing until each draft is approved.
how_it_works:
  - title: Stakeholder map builder
    text: Maps the audiences you will tell and the people who must check the announcement on each side. It hands on the audiences, approvers and agreed facts.
  - title: Stakeholder update writer
    text: Writes a one-page shared brief, then a core announcement and a version for each audience, from the agreed facts. It hands on the brief and every draft.
  - title: Brand voice editor
    text: Checks each version against the right brand's voice and keeps joint claims the same in every draft. It hands back drafts ready for approval.
output_shape: |-
  SHARED MESSAGE BRIEF
  Agreed facts | Claims each side may make | Words to avoid | Date | Open questions

  AUDIENCE AND APPROVER MAP
  Audience | What they need to know | Approver on our side | Approver on partner's side

  DRAFTS
  Core announcement
  Audience version | Voice used | Facts used

  APPROVAL TRACKER
  Draft | Audience | Approver | Status (not sent, in review, approved, changes) | Date | Notes

  HAND-BACK SUMMARY
  Files | MISSING lines | Checks missed | One next step
output_sample:
  input:
    - The agreed partnership facts, with the date
    - Each side's approved messaging and logo rules
    - Examples of each brand's voice
    - The audiences you will tell
    - Where you may post or send, and who approves (optional)
  prerequisites:
    - A signed or agreed deal, so the facts are final
  output:
    - name: Shared message brief
      contains: The agreed facts, the claims each side may make, words to avoid and open questions.
    - name: Audience and approver map
      contains: Each audience, what they need to know and who must approve on each side.
    - name: Core announcement
      contains: The main message, using only the agreed facts.
    - name: Audience versions
      contains: One draft per audience, edited to the right brand's voice, with joint claims unchanged.
    - name: Approval tracker
      contains: Each draft with its audience, approver, status and date, all unpublished until approved.
    - name: Hand-back summary
      contains: Files saved, MISSING facts, checks not done and one next step.
tweaks:
  - what: Scope
    how: Name the audiences and channels you need now. Add the rest later.
  - what: Evidence
    how: Share the agreed terms and approved wording, not your memory of them.
  - what: Acceptance
    how: Name who must approve on each side. No draft goes out before they do.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file support
      why: They read the agreed facts and voice examples and keep each step as a file. They do not send, post or contact your partner. You do that.
  inputs:
    - Your brand brain or voice notes, and your partner's if they share them.
    - A named contact at the partner for questions on the facts.
judge:
  - Both parties claims and brand use are sourced; a draft remains unpublished until the named owners approve.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
next:
  - press-outreach-planner
  - staff-announcement-writer
terms:
  - term: Joint claim
    meaning: A statement about the partnership that both sides have agreed to, such as the date or what the product does.
  - term: Approval tracker
    meaning: A table that shows who must approve each draft and whether they have.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
