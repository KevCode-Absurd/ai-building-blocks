new_slug: prepare-a-referral-administration-handover
name: Prepare a referral administration handover
headline: Prepare a referral administration handover
summary: Hand over clinic referral paperwork. Get what was sent, received and booked, the missing confirmations and draft follow-ups, with no clinical detail.
job: organise-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give your AI the referral status records you may share, with proof of each step. It keeps only the administrative status, then writes a handover with pending confirmations and draft follow-ups. It does not judge clinical urgency.
explain: |-
  Referral paperwork is easy to lose between administrators. A referral can be sent but never received, or received but never booked. The next person needs to know which. This referral administration handover keeps those states apart.

  The Source note summariser pulls only the status and the proof of each referral, with its record reference, and drops clinical detail. The Handover note writer then lists pending confirmations first, then contacts, deadline evidence and who to escalate to. For each unconfirmed referral it adds a follow-up draft.

  Nothing is sent. The pack never decides which patient matters most. If a record says a referral is urgent, it repeats that line and points to the clinician. Patient detail stays to the reference and what your clinic allows.
when:
  - An administrator is leaving or going on leave, and someone else takes the referral list.
  - You need to know which referrals were only sent and which were really booked.
  - A receiving service has gone quiet, and you want follow-ups ready to send.
  - A clinic manager wants a status report with proof for each referral.
not_for:
  - "You want to check records over time, with closure proof: use the Clinic referral handover reviewer."
  - "You want customers to refer friends to your business: use the Referral program designer."
  - You want to decide who is seen first, or how urgent a case is. That is for clinicians.
  - You want letters or messages sent. You get drafts only, and you send them.
you_give:
  - Referral status records you may share, with a reference for each (from your clinic system or log)
  - "Proof of each step: sent, received, booked, with dates"
  - Your clinic's follow-up rules, such as how long to wait before chasing
  - Who takes over, and from when
  - Clinicians and services to escalate to (optional)
you_get:
  - Pending confirmations, listed first
  - Each referral's state (sent, received, booked or completed), with proof and date
  - Any line that needs a clinician, copied as written
  - A draft follow-up for each unconfirmed referral, marked not sent
  - Contacts, and a list of gaps
how_to_use:
  - Download the pack and add it to your AI, such as Claude, ChatGPT or Gemini.
  - Paste or attach only the records you may share. If your clinic's rules ask for it, remove names and clinical notes first.
  - Check each referral's state against your own log. Booked needs a booking record.
  - Read the lines marked as needing a clinician, and pass them on yourself.
  - Edit the follow-up drafts, then send them yourself. Nothing is sent for you.
how_it_works:
  - title: Source note summariser
    text: Pulls only the status and proof of each referral, with record reference and date, and drops clinical detail. Hands step 2 one line per referral. Check before moving on, every referral has a state and the source of that state.
  - title: Handover note writer
    text: Writes the handover from step 1's referral lines, with pending confirmations first, then contacts, deadline evidence and clinician escalation points. Adds a follow-up draft for each unconfirmed referral, marked not sent. Never reorders clinical care.
  - title: Check and hand back
    text: Joins both files, checks that each state matches its proof, and lists every gap and every check that did not run.
output_shape: |-
  NEEDS A CLINICIAN <reference | line from the record as written | escalation contact>
  PENDING CONFIRMATIONS <reference | state | proof | what is missing | how long waiting>
  REFERRAL STATUS <reference | sent | received | booked | completed, each with date and source>
  FOLLOW-UP DRAFTS <reference | draft text | DRAFT, NOT SENT>
  CONTACTS <name or role | for what>
  MISSING <each gap and the part it stops>
  CHECKS MISSED <one line each, or none>
output_sample:
  input:
    - Referral status records you may share, with a reference for each
    - Proof of sent, received and booked, with dates
    - Your clinic's follow-up rules
    - Who takes over
  prerequisites:
    - An AI that can read files or long pasted text
    - The two component skills, which come in the pack
    - Permission under your clinic's rules to share the records with your AI
  output:
    - name: Needs a clinician
      contains: Any record line that mentions urgency, copied as written, with who to escalate to.
    - name: Pending confirmations
      contains: Referrals sent but not confirmed received or booked, and what proof is missing.
    - name: Referral status
      contains: Each referral's state, with the date and source of that state.
    - name: Follow-up drafts
      contains: A short chase message for each unconfirmed referral, marked draft and not sent.
    - name: Hand-back summary
      contains: The files saved, steps run, missing items and any check that could not run.
tweaks:
  - what: Scope
    how: Run one clinic, service or batch of referrals at a time so the proof stays easy to check.
  - what: Patient detail
    how: Share the referral reference and only what your clinic allows. Leave out diagnoses and notes about care.
  - what: Follow-up rules
    how: Add how long you wait before chasing. The drafts then use your rule, not a guess.
judge:
  - Sent, received, booked and completed remain distinct; no clinical urgency or patient outcome is inferred.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep your clinic's follow-up rules with the pack so each handover chases on the same schedule.
  - Record where proof of receipt and booking is kept, so each state can point to it.
  - Run the pack again at the next handover and see which referrals are still unconfirmed.
works_best_with:
  tools:
    - name: A chat AI that reads files
      why: It reads a status export and your rules together. Check your clinic's rules before you share records with any AI.
  inputs:
    - A referral log or status export.
    - Your clinic's list of who to escalate to.
terms:
  - term: Referral
    meaning: A request from one clinic or professional to another service to see a patient or client.
  - term: Confirmation
    meaning: Proof that the other side received or booked the referral.
  - term: Escalation point
    meaning: The clinician or manager to tell when a record needs their decision.
  - term: Handoff
    meaning: The checked file one step passes to the next.
