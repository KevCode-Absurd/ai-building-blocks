new_slug: prepare-a-service-outage-communication-pack
name: Prepare a service outage communication pack
headline: Prepare a service outage communication pack
summary: Draft the first notice, progress updates and all-clear for a service outage, with a ledger of confirmed facts. Ready for you to review.
job: help-customers
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: "Share what you have confirmed so far: what is down, who is affected and the timeline. Your AI drafts the first message, progress updates and a recovery message. It keeps known facts apart from guesses and leaves out any recovery time you have not confirmed."
explain: |-
  In an outage, people want three things: what broke, whether it affects them and when to expect news. Teams often guess at the third and then miss it.

  Step one sets out who owns each update, when the next one is due and which facts are verified. Step two writes the messages for each audience from those facts. Step three edits for plain words and keeps every 'we do not know yet' in place.

  It does not decide the cause, promise a fix time or send anything. If you give no recovery time, the messages say when the next update will come instead.
when:
  - Your checkout has been down for twenty minutes and customers are emailing.
  - Support needs words for a status page and a reply template.
  - You want the messages ready before the next incident, not during it.
  - The incident is over and you owe customers a recovery note.
not_for:
  - You want to find the cause. Use AWS incident investigation planner, or the Outage incident leader.
  - You want to learn from an outage afterwards. Use Incident learning and follow-up planner.
  - You need to reply to one customer. Use the Angry customer reply writer.
  - Nothing is confirmed yet. Wait until you know what is affected, or send 'we are looking into it'.
you_give:
  - What is affected and who (from your monitoring or team lead)
  - "The timeline so far: when it started and what you have done"
  - Facts you have approved for customers
  - "Your communication rules: who signs off, channels, tone"
  - Existing message templates (optional)
  - The owner of each update (optional)
you_get:
  - "A fact ledger: each fact marked confirmed, being investigated or unknown"
  - A first notice, progress updates and a recovery message for each audience
  - An owner and next-update time for each message
  - A plain-words edit that keeps every uncertainty
  - A summary and one next step
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini.
  - Paste what you have confirmed, the timeline and your communication rules.
  - "Say: follow the workflow file, label every fact and do not guess a recovery time."
  - Check the fact ledger before the messages. Move any fact you cannot show to 'being investigated'.
  - Have your sign-off person read each message, then post it yourself.
  - Run it again for each update with the new facts.
output_sample:
  input:
    - What is affected and who
    - The timeline so far
    - Approved facts and communication rules
    - Existing templates (optional)
  prerequisites:
    - At least one confirmed fact about the impact
  output:
    - name: step-01-incident-runbook-writer.md
      contains: The fact ledger, who owns each update and when the next update is due.
    - name: step-02-stakeholder-update-writer.md
      contains: First notice, progress and recovery drafts for each audience.
    - name: step-03-plain-english-editor.md
      contains: The same messages in plain words, with every uncertainty kept.
    - name: Hand-back summary
      contains: Files saved, facts still unconfirmed, checks not run and one next step.
how_it_works:
  - title: Incident runbook writer
    text: Sets owners, update times and the fact ledger from your confirmed facts. Hands step 2 the full ledger (confirmed, being investigated, unknown), the owner of each message and each next-update time.
  - title: Stakeholder update writer
    text: Writes the first notice, progress and recovery messages for each audience. Hands step 3 the drafts only. Step 3 edits the words and does not get the ledger.
  - title: Plain English editor
    text: Edits for clarity and keeps every condition and promise as written. Hands back the final messages.
output_shape: |-
  INCIDENT <service, start time>, AUDIENCES <list>

  FACT LEDGER   <fact> | confirmed / being investigated / unknown | <source>
  OWNERS        <message> | <owner> | next update <time>
  FIRST NOTICE  <text>
  PROGRESS      <text>
  RECOVERY      <text>

  MISSING        <each fact not yet known>
  CHECKS MISSED  <one line each, or none>
  NEXT STEP      <one action>
tweaks:
  - what: Audience
    how: Name each group you must tell, such as customers, staff and partners. Each gets its own wording.
  - what: Channel
    how: Say where it will appear, such as a status page, email or social. Length and format change to fit.
  - what: Update rhythm
    how: Give how often you can update, such as every 30 minutes. Each message states when the next one is due.
judge:
  - Messages distinguish known facts from investigation and avoid unsupported recovery estimates.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - After the incident, keep the messages that worked as templates and remove any figure that was for that incident only.
  - Record how long each update took to approve. Cut the slowest step.
works_best_with:
  tools:
    - name: Any good chat AI that reads files, such as Claude, ChatGPT or Gemini
      why: It must hold the facts, your rules and any templates together.
  inputs:
    - Your status page's past posts
    - The names of your sign-off people
    - Your customer support channels
    - Service promises you have made to key customers
terms:
  - term: Fact ledger
    meaning: "A list of each fact with its status: confirmed, being investigated or unknown."
  - term: Status page
    meaning: A public page that shows whether your service is working.
