slug: prepare-a-source-checked-research-talk
name: Build a research talk from checked figures
summary: Attach a paper, result tables and talk length. Get traceable figures, slides and speaker notes for review.
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: advanced
inputs:
  - type: document
    required: true
  - type: spreadsheet
    required: true
  - type: question
    required: true
outputs:
  - type: slide_deck
  - type: document
  - type: audit_report
uses:
  - source-note-summariser
  - journal-ready-figure-maker
  - conference-talk-slide-maker
steps:
  - uses: source-note-summariser
    note: Read the supplied paper in full, including relevant appendices, with the source-note method. Record its claims, table/figure pointers, offered evidence and gaps. Map those notes to the attached result tables without assuming independent truth verification. Hand the approved source-bound claim list and exact evidence references to figure preparation.
  - uses: journal-ready-figure-maker
    note: Use source tables and claim list to choose readable, faithful plots. Preserve uncertainty, exclusions and missing observations. Hand figures, captions and data references to slide production.
  - uses: conference-talk-slide-maker
    note: Use compiled paper, evidence list, figures, audience and duration to build the outline, supported slide formats and notes. Render only with available tools; return timing estimates and required rehearsal checks.
execution: coordinator
package_files: all
origin: own
example_pending: true
version: 1.0.0
