steps:
  - uses: source-note-summariser
    note: "Extract observed nonconformances, dates, affected lots and supporting evidence from the inspection records; separate the supplier explanation from verified findings. Hands step 2 the findings with dates and lots."
  - uses: process-and-sop-writer
    note: "Document the proposed containment, correction, evidence collection and effectiveness review steps against the owner approved acceptance process; do not prescribe technical safety decisions. Uses step 1's findings with your acceptance process. Hands step 3 the draft procedure."
  - uses: executive-action-register
    note: "Record explicit accepted supplier commitments separately from proposed actions, with source IDs and missing owners or dates. Uses your meeting notes or emails with the supplier, plus step 2's draft procedure."
