slug: prepare-a-survey-findings-briefing
name: Prepare a survey findings briefing
summary: Turn survey results into a briefing you can defend. Get a checked findings table, honest sampling caveats and a slide-by-slide briefing outline.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: spreadsheet
    required: false
  - type: document
    required: false
outputs:
  - type: spreadsheet
  - type: copy_draft
  - type: slide_deck
  - type: document
uses:
  - spreadsheet-checker
  - figures-to-plain-pictures-writer
  - presentation-builder
steps:
  - uses: spreadsheet-checker
    note: Check response denominators, question routing, missing values, duplicates and any weighted formulas against the supplied questionnaire and sampling notes.
  - uses: figures-to-plain-pictures-writer
    note: Explain verified results with their real denominators and periods; do not turn an opt-in sample into a population estimate.
  - uses: presentation-builder
    note: Prepare a findings briefing outline using checked figures and visible limitations. Show the decision each finding can and cannot support.
