slug: prepare-a-team-absence-handover
name: Prepare a team absence handover
summary: Cover a team member's leave without dropped work. Get a coverage map,
  task-by-task handover notes and an escalation list for the cover person.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: question
    required: false
  - type: meeting_notes
    required: false
outputs:
  - type: plan
  - type: document
uses:
  - team-capacity-planner
  - handover-note-writer
  - executive-action-register
steps:
  - uses: team-capacity-planner
    note: "Compares the person's commitments with the cover available during the
      absence. Hands step 2 the plan: each task with its cover owner or a named
      gap."
  - uses: handover-note-writer
    note: Writes a handover for each task from step 1's plan and the person's work
      list, with source links, current state and next action. Hands step 3 the
      handover notes and their open items.
  - uses: executive-action-register
    note: Reads step 2's handover notes and open items as its notes. Creates a
      coverage action list with owners, dates, dependencies and acceptance.
      Every action stays proposed until the cover person says yes.
