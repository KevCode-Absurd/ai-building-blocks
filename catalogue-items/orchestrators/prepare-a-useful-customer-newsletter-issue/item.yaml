slug: prepare-a-useful-customer-newsletter-issue
name: Prepare a useful customer newsletter issue
summary: Turn customer messages and your store news into a customer newsletter
  draft with subject lines and a pre-send checklist, in your voice.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: voc_reviews
    required: false
  - type: brand_brain
    required: false
outputs:
  - type: copy_draft
  - type: document
uses:
  - feedback-theme-finder
  - campaign-email-writer
  - brand-voice-editor
steps:
  - uses: feedback-theme-finder
    note: "Finds one useful customer question in your messages and keeps the sample
      limits: a small or single-customer sample does not show a wider trend.
      Hands step 2 the question, one exact quote, the message count and the
      sample limits."
  - uses: campaign-email-writer
    note: Uses your brief and approved store news plus step 1's question and quote
      as the customer doubt. Drafts one value email with subject, preview and
      plain-text versions. Invents no offer and sends no test. Hands step 3 the
      full draft.
  - uses: brand-voice-editor
    note: Edits step 2's draft, given as numbered lines, to your voice. Keeps every
      fact, offer and promise exactly as written. Hands back the final email and
      the voice score.
