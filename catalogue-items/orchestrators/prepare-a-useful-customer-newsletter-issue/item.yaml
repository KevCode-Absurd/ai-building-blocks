steps:
  - uses: feedback-theme-finder
    note: Find a useful customer question in the provided feedback and preserve the sample limits. A small or single-customer sample does not establish a wider trend.
  - uses: campaign-email-writer
    note: Use value-email mode to draft one core message around the customer question and approved store news, with subject, preview and plain-text versions. Do not invent an offer or send a test.
  - uses: brand-voice-editor
    note: Edit the draft to the supplied voice without adding facts, offers or promises.
