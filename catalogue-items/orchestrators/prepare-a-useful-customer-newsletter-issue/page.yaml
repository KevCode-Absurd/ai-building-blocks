  - write-a-personal-story-email-and-read-how-it-did
terms:
  - term: Value email
    meaning: An email that helps the reader first, with one soft call to action, instead of pushing a sale.
  - term: A/B variant
    meaning: A second version that changes one thing, such as the subject line, so you can see which works better.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
