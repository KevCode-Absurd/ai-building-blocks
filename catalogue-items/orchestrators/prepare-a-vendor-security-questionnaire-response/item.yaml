slug: prepare-a-vendor-security-questionnaire-response
name: Prepare a vendor security questionnaire response
summary: "Answer a vendor security questionnaire with evidence: get a sourced
  draft, an evidence index and a list of questions your team still has to
  answer."
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: document
    required: true
  - type: spreadsheet
    required: false
  - type: question
    required: false
  - type: policy
    required: false
outputs:
  - type: spreadsheet
  - type: document
  - type: audit_report
uses:
  - compliance-checklist
  - spreadsheet-checker
  - plain-english-editor
steps:
  - uses: compliance-checklist
    note: Maps each questionnaire question to the evidence needed for the answer and
      defines the response scope. Hands step 2 the checklist of questions with
      the proof each needs.
  - uses: spreadsheet-checker
    note: Uses your own evidence sheet, not step 1's output, and takes step 1's
      checklist as the audit report to check against. Builds a
      question-to-evidence table where each proposed yes has a dated source, the
      right scope and a visible gap when proof is absent. Hands step 3 the
      checked table.
  - uses: plain-english-editor
    note: Uses your questionnaire draft and step 2's checked table. Writes clear
      answers from verified rows only and keeps the gaps and review limits
      visible.
