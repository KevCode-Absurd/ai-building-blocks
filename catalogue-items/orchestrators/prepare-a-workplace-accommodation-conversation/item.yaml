slug: prepare-a-workplace-accommodation-conversation
name: Prepare a workplace accommodation conversation
summary: Prepare for a workplace accommodation conversation. Get a discussion
  guide, adjustment options and a review plan, with health details kept out.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: question
    required: true
