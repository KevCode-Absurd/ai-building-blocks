    required: false
  - type: policy
    required: false
outputs:
  - type: plan
  - type: document
uses:
  - accommodation-process
  - people-risk-register-builder
  - executive-action-register
steps:
  - uses: accommodation-process
    note: Identifies the work barriers and a respectful process for considering
      adjustments. Hands step 2 the plan and process document, with each barrier
      tied to a job task.
  - uses: people-risk-register-builder
    note: Reads step 1's process and your job tasks. Records delivery and privacy
      risks without inferring any health condition. Hands step 3 the risk
      register with a suggested owner for each risk.
  - uses: executive-action-register
    note: Reads step 1's plan and step 2's risks, plus your own notes of any meeting
      held. Prepares a restricted action plan with agreed owners, review dates
      and open questions.
