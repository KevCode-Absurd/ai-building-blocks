slug: prepare-an-ai-pilot-go-decision
name: Prepare an AI pilot go decision
summary: Check your AI pilot results against the baseline and your go or stop
  checklist. Get an evidence brief, the data gaps and a clear go, wait or stop
  call.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: spreadsheet
    required: false
  - type: question
    required: false
outputs:
  - type: plan
  - type: spreadsheet
  - type: audit_report
  - type: document
uses:
  - hypothesis-first-design-planner
  - spreadsheet-checker
  - decision-checklist-runner
steps:
  - uses: hypothesis-first-design-planner
    note: Reviews the pilot as a testable hypothesis with signals declared before
      the results. Preserves the real baseline. Hands step 2 the signals and
      success criteria to check against.
  - uses: spreadsheet-checker
    note: Uses your own evaluation spreadsheet, not step 1's output. Takes step 1's
      signals as the acceptance criteria. Inspects case counts, denominators,
      costs, failures and result calculations, and separates measured results
      from anecdotes. Hands step 3 the checked sheet and findings.
  - uses: decision-checklist-runner
    note: Applies your own approved pilot checklist to step 2's checked results and
      findings as the facts. Keeps unknown mandatory items and stop rules. No
      deployment or budget change occurs. Hands back the go, wait or stop call.
