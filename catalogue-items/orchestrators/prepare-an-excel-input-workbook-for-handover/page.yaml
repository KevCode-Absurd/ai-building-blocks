new_slug: prepare-an-excel-input-workbook-for-handover
name: Prepare an Excel input workbook for handover
summary: Share field rules. Get a checked Excel input workbook and a guide for
  its next owner.
job: work-with-files
thinking: high
thinking_why: Native file features, source meaning and check evidence must
  survive the workflow.
headline: Prepare an Excel input workbook for handover
subhead: Share your field rules. Get a checked input workbook and a guide for
  the next person who will maintain it. Work on a copy of your file. Get a clear
  record of what passed and what still needs checking.
explain: >-
  Share your field rules. Get a checked input workbook and a guide for the next
  person who will maintain it.


  This workflow runs the full component methods in order and checks each handoff
  before continuing. Your source files stay intact. The method starts by
  checking what your AI already knows and which files it can read. It asks only
  for missing facts that change the work.


  You get the requested files plus a short record of the sources and checks. A
  saved file alone does not prove that its formulas, links or layout work. Any
  check that needs an app your AI cannot use stays marked as not run. Review
  those limits before you share the result.
when:
  - You need the connected deliverables described above.
  - You want the sources and checks carried through the handover.
  - You need to see which steps still need your input.
you_give:
  - Field definitions, required and allowed values, record key, intended Excel
    version and the handover owner or process already known.
  - The app and file tools your AI can use for the requested work
you_get:
  - The native files and reports produced by the component methods, plus a run
    register and unresolved-input list.
  - A record of source files, changes and check results
  - Missing facts and any checks that could not run
how_to_use:
  - Start a chat with the skill. Open it if you added it to your AI, or copy it
    and paste it in.
  - Supply your actual files and describe the result. The AI checks existing
    context before asking for missing information.
  - Review the native output and its real check evidence before sharing it.
how_it_works:
  - title: Step 1
    text: 1. Read `skills/excel-input-form-builder/SKILL.md` completely and run its
      full method. Build and validate the empty native input table from
      confirmed field rules; keep valid, missing and duplicate test records in a
      separate illustrative copy.
  - title: Step 2
    text: 2. Read `skills/excel-handover-guide-writer/SKILL.md` completely and run
      its full method. Document the actual delivered form, allowed entries,
      calculated fields, validation limits and update steps.
output_shape: >-
  FILES

  The native files and reports produced by the component methods, plus a run
  register and unresolved-input list.


  SOURCE MAP

  <file and version> | <sheet, cell or slide> | <what it supports>


  CHECKS

  <check> | <passed, failed or not run> | <evidence>


  OPEN ITEMS

  <missing fact or unsupported check> | <next action>
tweaks:
  - what: Your source files
    how: Field definitions, required and allowed values, record key, intended Excel
      version and the handover owner or process already known.
  - what: The result you need
    how: Name the file format, audience and parts that must stay editable. State any
      page or slide limit.
  - what: The app used to check it
    how: Say which Excel or PowerPoint version you will use. Your AI must name any
      check it cannot run.
judge:
  - All required source versions and their meanings are identified.
  - Every component method ran, or the workflow stopped with its exact missing
    prerequisite.
  - Workbook results, slide evidence, periods and units agree where they connect.
  - The result names its sources and keeps unrun checks visible.
test:
  - Try the workflow on copies of files where you know the right result.
  - Check each step against its full skill file and keep the source map with the
    result.
  - Reopen the saved files and check the reported figures, links and layout
    before relying on them.
improve:
  - Add your confirmed field names, file rules and target app version to the
    required-input section.
  - Add a small test case with a known answer to the acceptance checks. Keep
    made-up records separate from real work.
  - Save the working rules with the file guide so the next run uses the same
    meanings and checks.
warnings:
  - Requires tools for the requested native file format. Checks requiring an
    unavailable native application must remain marked not run.
not_for:
  - "You only need the entry form and nobody else will take it over: use the Excel input form builder."
  - "You already have a workbook and only need a guide for its next owner: use the Excel workbook handover writer."
  - "You want to fix broken formulas or compare two versions of a workbook: use the Excel workbook change reviewer."
output_sample:
  input:
    - "Your field list: names, data types and allowed values"
    - Which fields are required, and the record key
    - The Excel version you will use
    - Who takes over the workbook and how well they know Excel
  prerequisites:
    - An AI that can create and save Excel files
  output:
    - name: input-form.xlsx
      contains: An empty Excel table with dropdowns, entry cells and checks for missing or duplicate records.
    - name: field-rules.md
      contains: The rules for every field, plus a separate test copy with made-up records.
    - name: workbook-handover.md
      contains: A guide for the next owner with a sheet map, inputs, update steps and checks.
    - name: Run register and open items
      contains: What passed, what could not be checked, and which facts are still missing.
