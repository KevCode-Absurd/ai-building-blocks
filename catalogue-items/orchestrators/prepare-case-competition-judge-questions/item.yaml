slug: prepare-case-competition-judge-questions
name: Prepare case competition judge questions
summary: Prepare for the Q&A at a case competition. Get practice judge questions, answer notes tied to your exhibits and briefs for backup slides.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: source_text
    required: true
  - type: copy_draft
    required: true
  - type: question
    required: false
outputs:
  - type: document
  - type: audit_report
uses:
  - source-note-summariser
  - hardest-objections-answer-writer
  - presentation-builder
  - proofreader
steps:
  - uses: source-note-summariser
    note: Read the deck and exhibits. List the recommendation, the main numbers and the weakest assumptions, each with its slide or exhibit. Hands the weak-spot list and source index to step 2.
  - uses: hardest-objections-answer-writer
    note: Write tough practice questions for each weak spot, with an answer note that cites a slide or exhibit or says assumption. Marks every question as practice. Hands the question bank to step 3.
  - uses: presentation-builder
    note: "Outline a backup slide for each question that needs a chart or table: title, chart, point and source. Outline only, no file. Hands the briefs to step 4."
  - uses: proofreader
    note: Check answer notes and briefs for matching terms, currencies, periods and figures. Report a mismatch, never fix a number quietly.
