slug: prepare-evidence-for-a-compliance-review
name: Prepare evidence for a compliance review
summary: "Prepare evidence for a compliance review: get an evidence index, a gap
  list and a plan with owners and due dates. Readiness, not certification."
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: document
    required: true
  - type: spreadsheet
    required: false
  - type: question
    required: false
outputs:
  - type: audit_report
  - type: spreadsheet
  - type: plan
uses:
  - compliance-checklist
  - spreadsheet-checker
  - executive-action-register
steps:
  - uses: compliance-checklist
    note: Turns the supplied review scope into control questions and the evidence
      each needs. Hands step 2 the checklist of questions with proof types.
  - uses: spreadsheet-checker
    note: "Uses your own source records and takes step 1's checklist as the audit
      report to check against. Builds a reviewable evidence register: verifies
      IDs, scope, evidence dates and gaps, and never treats a filled cell as
      proof of compliance. Hands step 3 the register and its gaps."
  - uses: executive-action-register
    note: Reads step 2's register and gaps as its notes and creates an
      evidence-gathering plan with owners, due dates and dependencies. Every
      action stays proposed until an owner agrees.
