slug: prepare-feedback-students-can-act-on
name: Prepare feedback students can act on
summary: Turn your draft comments into feedback students can act on. Get a clear rubric, rewritten comments tied to it and a short revision task.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: lesson_plan
    required: true
  - type: feedback_notes
    required: false
  - type: source_text
    required: false
outputs:
  - type: document
  - type: audit_report
  - type: copy_draft
uses:
  - single-point-rubric-builder
  - written-feedback-checker
  - practice-problem-set-writer
steps:
  - uses: single-point-rubric-builder
    note: "Turns your goal or rubric into one clear standard with space for gaps and evidence. Hands the standard to the comment check."
  - uses: written-feedback-checker
    note: "Checks each draft comment against that standard for specificity, accuracy and a next step, and rewrites the weak ones. Hands the main gap to the revision task step."
  - uses: practice-problem-set-writer
    note: "Writes a short revision task aimed at that gap, with answers or marking notes. Hands the task to the teacher review list."
