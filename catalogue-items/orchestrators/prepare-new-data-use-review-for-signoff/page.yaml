new_slug: prepare-new-data-use-review-for-signoff
name: Prepare a new data use for review
headline: Prepare a new data use for review
summary: "Check a new use of customer data before launch: get a triage call, a privacy assessment if needed and sign-off questions with owners."
job: check-contracts
thinking: high
subhead: Describe the feature and attach your privacy rules and policies. It decides whether a privacy assessment is needed, drafts one when it is and flags any serious legal risk. You get the call, the conditions with owners and the questions your reviewer must sign off.
explain: |-
  Before a team ships a feature that uses personal data, someone must decide whether it needs a privacy impact assessment and who signs it off. This workflow does that first check for a new data use. It does not approve a launch.

  The New data use screener reads the feature, the data flows and your policies, then picks a route: no assessment, assessment needed or escalate. When an assessment is needed, the Privacy impact assessment writer drafts one in your house format, with a condition and an owner for each risk. The Feature legal risk assessor then looks for new or serious legal risks and escalates only when a set threshold is met.

  It needs your practice setup first: your assessment template, the places you operate and who signs off. Without it, the workflow stops and gives you a short setup checklist instead of guessing. It is a first check, not legal advice. A qualified reviewer confirms it before anyone acts.
when:
  - A product team wants to add a feature that collects or reuses customer data, such as location or purchase history.
  - Someone asks "does this need a privacy assessment?" and you have no standard answer.
  - A vendor or tool will receive personal data for the first time.
  - Your reviewer wants one tidy pack to sign off.
not_for:
  - You have no privacy rules, assessment template or named reviewer yet. Set those up first. The Privacy management audit planner shows what a privacy setup needs.
  - The data belongs to staff, such as an HR tool. Use Employee data privacy reviewer or the Employee data privacy checker.
  - You want your code scanned for GDPR risks. Use the GDPR privacy checker.
  - You want legal advice or a launch approval. Only a qualified reviewer can give those.
you_give:
  - "FEATURE: who the data is about, which fields, why you collect them, where they go, how long you keep them, who can see them and which vendors get them"
  - "PRACTICE_SETUP: your assessment template, house rules and who signs off"
  - "FOOTPRINT: where you operate, who decides, and who receives the result"
  - "SOURCE_PACK: the product spec, your current privacy policy, an earlier assessment and any dated legal guidance you rely on (attach what you have)"
you_get:
  - "A triage call: no assessment, assessment needed or escalate, with the reasons from your facts"
  - A draft privacy impact assessment when triage calls for one
  - A table of conditions, each with an owner
  - Sign-off questions for the decision owner
  - A note on any new or serious legal risk, or why none is raised
  - A list of missing facts and checks that did not run
how_to_use:
  - Download the pack, unzip it and give the whole folder to Claude, ChatGPT or Gemini. Start with START_HERE.txt, then answer what the coordinator skill asks.
  - "Fill the four inputs: FEATURE, PRACTICE_SETUP, FOOTPRINT and SOURCE_PACK. With no PRACTICE_SETUP you get a setup checklist, not a call."
  - Read the triage route and its reasons. Check that the data flows it lists match your product.
  - If an assessment was drafted, give each condition to its owner to confirm. Fix anything wrong before it goes further.
  - Send the pack to your privacy reviewer. Nothing here approves a launch.
how_it_works:
  - title: Route the activity
    text: "Loads your practice setup first, then reads the data flows, places and policies to pick a route. Hands step 2 the route, the evidence and the open questions. Check before moving on: setup is complete, and the route says it does not approve launch."
  - title: Draft only the required assessment
    text: "When triage calls for it, drafts the assessment in your house format with conditions, owners and policy checks. Checks current rules from primary sources when it can browse, and says so when it cannot. Hands step 3 the draft. Check before moving on: each condition has an owner."
  - title: Escalate novel material risks
    text: "Looks across the triage and the assessment for new or serious risks. Writes a separate assessment only when the threshold is met, and otherwise says why it is not proposed. Hands back the sign-off pack. Check before moving on: the call matches the route."
output_shape: |-
  PROCESSING FACTS  <who the data is about, fields, purpose, flows, retention, access, vendors>
  ROUTE             <no assessment | assessment needed | escalate> with reasons, sources and dates
  ASSESSMENT        <draft in your house format, only when triggered>
  CONDITIONS        <condition> | <owner> | <due>
  SIGN-OFF QUESTIONS <question> | <decision owner>
  MISSING           <each gap and what it stops>
  CHECKS            <each check as PASS, FAIL or NOT RUN, with the reason>
output_sample:
  input:
    - "FEATURE: the data, purpose, flows, retention, access and vendors"
    - "PRACTICE_SETUP: your assessment template, house rules and sign-off process"
    - "FOOTPRINT: where you operate and who decides"
    - "SOURCE_PACK: spec, current privacy policy and earlier assessments"
  prerequisites:
    - An AI that can read the whole unzipped folder, and web access for live rule checks (optional)
  output:
    - name: Triage route
      contains: The call (no assessment, assessment or escalate) with reasons, sources and dates.
    - name: Draft assessment
      contains: Risks, conditions and policy checks in your house format, only when triage calls for it.
    - name: Conditions table
      contains: Each condition with its owner and due date.
    - name: Sign-off questions
      contains: What the decision owner must answer before launch.
    - name: Escalation note
      contains: New or serious legal risks, or why none is raised.
    - name: Missing and checks
      contains: Gaps, and each check marked PASS, FAIL or NOT RUN.
tweaks:
  - what: A small change
    how: If a feature only changes how long data is kept, say so. The triage then checks that change alone.
  - what: A new country
    how: Name any new country the data will reach. The route and conditions then cover it.
  - what: A vendor
    how: Name each vendor that gets the data and attach its terms. The conditions then cover each one.
judge:
  - Required practice setup and matter boundaries are satisfied before classification.
  - Jurisdiction, dates and current-source limitations are explicit.
  - Assessment/escalation follows the actual route.
  - Sign-off and distribution stay with authorized owners.
improve:
  - Keep your practice setup in one saved file and attach it every time. Without it the pack stops.
  - Save each signed assessment so the next one starts from your latest wording.
  - Record any rule check the AI could not do online, and have your reviewer finish it before sign-off.
works_best_with:
  tools:
    - name: A chat AI with file support and web access
      why: It can read your spec and policy files, and check live legal rules from primary sources. Without web access it marks that check NOT RUN.
  inputs:
    - Your current privacy policy and assessment template.
    - A named decision owner and reviewer.
terms:
  - term: Privacy impact assessment
    meaning: A written check of the privacy risks of a new use of personal data, with steps to reduce them.
  - term: Triage
    meaning: A first check that decides whether a feature needs a full assessment.
  - term: Practice setup
    meaning: Your own assessment template, rules and sign-off process.
