new_slug: prepare-questions-for-a-property-viewing
name: Prepare questions for a property viewing
headline: Prepare questions for a property viewing
summary: Prepare for a property viewing. Get a brief that separates listing claims from facts, plus questions to ask and checks to make in person.
job: organise-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give your AI the listing, any lease or sale details, and what you want from the viewing. It separates what the listing states from what it only claims. It finds missing measurements and unsupported promises, then turns them into questions and checks for the visit.
explain: |-
  A listing is written to sell. It mixes facts, such as the price, with claims, such as "quiet street" or "newly renovated". This workflow helps you prepare questions for a property viewing so you ask about the claims that matter, not just the ones you thought of.

  The Source note summariser pulls out the price, area, access, condition statements and terms, each with its source and date, and separates stated facts from listing claims. The Unsupported claim spotter then finds promises with no proof, missing measurements and claims that need an official or qualified check. A last step turns each one into a question or a check, grouped by who can answer.

  The pack certifies nothing about ownership, legal status, condition or returns. It tells you who can check each one, such as the council, a surveyor or a solicitor.
when:
  - You are viewing a flat or house to rent and want to ask better questions than the listing answers.
  - You are buying and want to know which claims to check before you make an offer.
  - You have accessibility needs and want them turned into checks you can make on the day.
  - You have several viewings and want the same clear list for each.
not_for:
  - "You want a lease read in plain words: use the Contract plain-language summary writer."
  - "You want a lawyer's check of a contract: use the Contract and term sheet reviewer first, then see a solicitor."
  - "You want lease accounting figures: use the Lease accounting calculator."
  - You want to know if the property is a good buy. This gives questions and checks, not a valuation or investment advice.
you_give:
  - The listing text, pasted or attached, with its link and date
  - Any lease terms or sale details you were sent (optional)
  - "What you want from this viewing: must-haves and deal-breakers"
  - Your accessibility needs (optional)
  - Questions the agent or owner already answered (optional)
you_get:
  - A viewing brief of what the listing states, each item with its source
  - A list of claims to verify, ranked by risk, with what would settle each one
  - The information the listing leaves out
  - Questions to ask, grouped by who can answer
  - Checks to make on the day, including your own needs
how_to_use:
  - Download the pack and add it to your AI, such as Claude, ChatGPT or Gemini.
  - Paste the listing and any terms you were sent. Say what you must have and what you cannot accept.
  - Read the claims to verify. Pick the three that matter most to you.
  - Take the questions and checks to the viewing, on your phone or on paper.
  - After the viewing, run the pack again with your notes to see which claims held up.
how_it_works:
  - title: Source note summariser
    text: Pulls out price, area, access, condition statements and terms, each with its source and date. Separates stated facts from listing claims. Hands step 2 the list. Check before moving on, no claim is shown as fact.
  - title: Unsupported claim spotter
    text: Finds promises with no proof, missing measurements and claims that need official or qualified evidence. Ranks them by risk and says what kind of source would settle each.
  - title: Check and hand back
    text: Turns each gap and risky claim into a question or a check, grouped by who can answer, and puts your must-haves and access needs first. Lists every gap and every check that did not run.
output_shape: |-
  VIEWING BRIEF <item | value | source | date>
  CLAIMS TO VERIFY <claim | why it matters | what would settle it | risk>
  MISSING INFORMATION <what the listing leaves out that you need>
  QUESTIONS TO ASK <question | ask who | why>
  CHECKS TO MAKE ON THE DAY <what to look at or measure | why | your need it serves>
  BEFORE YOU COMMIT <what a surveyor, solicitor or council check would cover>
  MISSING <each gap and the part it stops>
  CHECKS MISSED <one line each, or none>
output_sample:
  input:
    - The listing text, with its link and date
    - Any lease terms or sale details you were sent (optional)
    - Your must-haves and deal-breakers
    - Your accessibility needs (optional)
  prerequisites:
    - An AI that can read files or long pasted text
    - The two component skills, which come in the pack
  output:
    - name: Viewing brief
      contains: The price, area, access, condition statements and terms the listing gives, each with its source.
    - name: Claims to verify
      contains: Listing promises with no proof, ranked by risk, with what would settle each.
    - name: Questions to ask
      contains: Each question, who can answer it and why it matters to you.
    - name: Checks on the day
      contains: What to look at or measure in person, including your accessibility needs.
    - name: Before you commit
      contains: What a surveyor, solicitor or council check would need to cover.
tweaks:
  - what: One property
    how: Run one property at a time. Keep the briefs so you can compare them side by side.
  - what: Your needs
    how: List must-haves and accessibility needs. They go to the top of the questions and checks.
  - what: Rent or buy
    how: Say which. Questions on terms, fees and condition change a lot between the two.
judge:
  - Listing claims remain attributed; no ownership, legal status, condition or financial return is certified.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep your must-haves in one note and paste them each time, so every property gets the same test.
  - After each viewing, add the answers you got. Next time the pack can mark which claims were confirmed.
  - Save the briefs for each property so you can compare what each listing left out.
works_best_with:
  tools:
    - name: A chat AI that reads files
      why: It reads a long listing and a lease together. Photos of floor plans are best pasted as text.
  inputs:
    - The floor plan or a list of measurements, if the listing has one.
    - Your budget limits.
next: [plain-words-contract-summary]
terms:
  - term: Listing claim
    meaning: A statement in the advert that the advert does not prove, such as quiet street.
  - term: Unsupported claim
    meaning: A promise with no measurement, document or source behind it.
  - term: Surveyor
    meaning: A qualified person who inspects a property's condition.
  - term: Handoff
    meaning: The checked file one step passes to the next.
