slug: prepare-research-poster-source-notes
name: Prepare research poster source notes
summary: Turn a finished study into a poster outline, a figure source list and a claim check, so every caption on your research poster traces to your results.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: question
    required: true
  - type: source_text
    required: false
  - type: copy_draft
    required: false
outputs:
  - type: document
  - type: audit_report
uses:
  - source-note-summariser
  - presentation-builder
  - unsupported-claim-spotter
steps:
  - uses: source-note-summariser
    note: Pull out only the facts the poster needs from the finished study, each with where it sits in your files and what limits it. Hand these to step 2 as the only source for poster text.
  - uses: presentation-builder
    note: Plan a short reading order and a brief for each figure from step 1's facts. Return an outline, not a rendered poster. Hand step 3 the headings, captions and figure briefs.
  - uses: unsupported-claim-spotter
    note: Check each heading and caption against the study. Flag outcomes that were not measured and novelty claims with no support, and give safer wording.
