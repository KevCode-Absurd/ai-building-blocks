slug: prepare-work-examples-for-a-job-interview
name: Prepare work examples for a job interview
summary: Turn your real work history into interview answers. Get a role evidence
  map, short example answers and practice questions for the job.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: resume
    required: true
  - type: job_description
    required: true
  - type: question
    required: true
  - type: source_text
    required: true
outputs:
  - type: document
uses:
  - role-skills-framework-builder
  - resume-job-application-builder
  - interview-question-set-maker
steps:
  - uses: role-skills-framework-builder
    note: Turns the role requirements into observable skills the interview may
      examine. Hands step 2 the skills list, each with what it looks like at
      work.
  - uses: resume-job-application-builder
    note: Uses your own work notes (not step 1's output) and step 1's skills list.
      Selects genuine work examples for those skills and records gaps honestly.
      Hands step 3 the matched skills, short answers and gaps.
  - uses: interview-question-set-maker
    note: Reads step 2's matched skills and gaps. Creates role-related practice
      questions and strong-answer indicators, plus one question per gap. Labels
      them sample questions, not predictions of the employer's interview.
