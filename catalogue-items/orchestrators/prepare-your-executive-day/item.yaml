slug: prepare-your-executive-day
name: Prepare your executive day
summary: Share one day's calendar and open work. Get meeting briefs, an action
  register and a plan for that day.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: question
    required: true
  - type: meeting_notes
    required: false
  - type: plan
    required: false
outputs:
  - type: document
uses:
  - executive-meeting-brief
  - executive-action-register
  - executive-daily-digest
steps:
  - uses: executive-meeting-brief
    note: 1. Read skills/executive-meeting-brief/SKILL.md. Share a meeting and
      relevant notes. Get a sourced brief with the goal, open decisions,
      questions and preparation gaps. Save the result with source references.
      Carry the user's goal and all earlier findings into this step. If required
      evidence or tool access is missing, mark this step blocked; do not
      fabricate a result.
  - uses: executive-action-register
    note: 2. Read skills/executive-action-register/SKILL.md. Share meeting notes or
      email threads. Get one action list with owners, deadlines, source links
      and unresolved commitments. Save the result with source references. Carry
      the user's goal and all earlier findings into this step. If required
      evidence or tool access is missing, mark this step blocked; do not
      fabricate a result.
  - uses: executive-daily-digest
    note: 3. Read skills/executive-daily-digest/SKILL.md. Share your calendar,
      action list and updates. Get a dated brief of priorities, decisions,
      conflicts and work waiting on others. Save the result with source
      references. Carry the user's goal and all earlier findings into this step.
      If required evidence or tool access is missing, mark this step blocked; do
      not fabricate a result.
origin: rebuilt
