steps:
  - uses: web-project-scoper
    note: Turns the request into bounded deliverables, dependencies, exclusions and
      acceptance criteria. Hands step 2 the scope.
  - uses: contract-and-proposal-drafter
    note: Uses your brief and step 1's scope, plus the price assumptions you supply.
      Drafts the proposal without inventing commitments. Hands step 3 the draft.
  - uses: contract-risk-reviewer
    note: Reads step 2's draft. Flags unclear acceptance, payment, ownership and
      revision terms for the appropriate reviewer.
