new_slug: product-brand-sheet-planner
name: Product brand sheet planner
summary: Share your product and brand direction. Get a one-page visual sheet plan, image prompts and a list of missing assets.
job: brand-file
headline: Product brand sheet planner
subhead: Share your product and brand direction. Get a one-page visual sheet plan, image prompts and a list of missing assets. Bring the brief and any files you want it to use.
explain: |-
  A product page, an ad and a social post often look like three different brands. This planner fixes the look on one page first. It reads the product and brand material you share, lists what is missing (photos, logo files, fonts, approved copy, permissions) and sets shared rules for camera, light, colour and materials.

  Then it plans a one-page sheet with a zone for each job: mood, product hero, ad idea, editorial scene and creator-style shot. It writes one image prompt for each zone. It does not draw the images. You paste the prompts into an image tool such as ChatGPT or Gemini, which may need a paid plan for many images.
when:
  - You need a cohesive one-page product visual sheet.
  - You want a clear draft and checks from the material you already have.
  - You need one sheet that shows the product, the mood and the ad and editorial looks together, with a prompt for each image.
you_give:
  - Your product, who it is for and the claims you may make
  - Your brand direction, colours and fonts
  - Product photos (optional)
  - Your org context (optional)
you_get:
  - plan
  - brand guide
  - image prompt
  - Missing inputs and steps that still need to run
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
how_it_works:
  - title: Read the brief
    text: "Read the brand/product material actually supplied: exact product geometry/labels, audience, approved claims, palette, type and desired use. A URL alone is not proof it was read."
  - title: Build the result
    text: "Design a small visual system before generating images: camera character, light, palette/material world, composition and permitted variation. Keep SKU/product truth separate from creative styling."
  - title: Check and hand off
    text: Check consistency, product accuracy, contrast/readability and completeness. Distinguish a planned sheet from an exported document and list steps that did not run.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - "You need a full brand guide with voice and rules for a whole business: use the Brand guide builder."
  - "You want a set of finished product photos, not a plan: use the Product photo set reviewer."
  - "You only need image prompts from an existing org context: use the Brand image prompt writer."
output_sample:
  input:
    - Your product and what it is for
    - Your brand direction, colours and fonts
    - Product photos (optional)
    - Your org context (optional)
  prerequisites:
    - An image tool such as ChatGPT or Gemini, to draw the images from the prompts (free plans have tight daily limits; many images may need a paid plan)
  output:
    - name: Asset inventory
      contains: What you have and what is missing, such as photos, logo, fonts and approved copy.
    - name: Visual rules
      contains: The palette, camera, light, materials and type that every image on the sheet shares.
    - name: Sheet plan
      contains: The one-page layout with a zone and a job for each image.
    - name: Asset prompts
      contains: One image prompt per needed asset, with the fixed product details written in.
    - name: Checks missed
      contains: Which product accuracy and layout checks failed or did not run, or none.
