slug: product-photos-to-product-page-gallery
name: Product Photos to Product Page Gallery
summary: "From real product photos to a planned, generated and checked product page image gallery that stays true to the product."
category: orchestrator
type: workflow
role: orchestrate
job: image
level: advanced
inputs:
  - {type: product_photos, required: true}
  - {type: product_data, required: true}
  - {type: brand_brain, required: true}
  - {type: voc_reviews, required: false}
outputs:
  - {type: pdp_images}
  - {type: gallery_plan}
  - {type: audit_report}
uses: [product-truth-sheet-from-photos, pdp-gallery-12-frame-plan, pdp-gallery-image-set-workflow, pdp-gallery-image-check]
steps:
  - {uses: product-truth-sheet-from-photos, note: "Record what the product really looks like, so every image stays accurate."}
  - {uses: pdp-gallery-12-frame-plan, note: "Plan the gallery: one job per frame."}
  - {uses: pdp-gallery-image-set-workflow, note: "Make the gallery images from the plan."}
  - {uses: pdp-gallery-image-check, note: "Check every image against the plan and the real photos."}
origin: own
version: 1.0.0
