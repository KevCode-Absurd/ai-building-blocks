new_slug: reasons-page-html-builder
name: Five reasons landing page builder
summary: Share product facts and an offer. Get a five-reasons HTML page, with a choice of looks and a Shopify file if needed.
job: write-landing-page
headline: Five reasons landing page builder
subhead: Build a reasons page from facts you can back up.
explain: Extends a reasons-page copy draft into two explicit design modes and portable implementation. Handles fewer than five true reasons honestly rather than padding claims.
when:
  - You want a complete reasons-style landing page, not just copy.
  - You need a choice of editorial or direct-response layout.
  - You want a portable Shopify section from an approved design.
you_give:
  - Brand/product facts, the sending ad and the intended buyer.
  - Actual offer terms, product images and source-backed proof.
  - Design preference and optional Shopify project conventions.
you_get:
  - A reason/proof map and page copy.
  - Responsive HTML in the chosen design with a revision log.
  - Optional namespaced Liquid section and template data, with validation status.
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
how_it_works:
  - title: Build five supported reasons
    text: Map distinct buying arguments to actual product and customer evidence.
  - title: Choose a visual mode
    text: Use editorial pacing or a more direct product/offer layout without changing the facts.
  - title: Build and verify
    text: Render mobile HTML, refine it and export scoped Shopify files when requested.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - "You only need the words, not a built page: use the Reasons-to-switch page writer."
  - "You want a Shopify page built from a plan, not a five-reasons page: use the Shopify landing page builder."
  - "You want an existing landing page reviewed, not built: use the Landing page 30-point checker."
output_sample:
  input:
    - Your product facts, the buyer and the ad that sends traffic to the page
    - Your offer terms and prices
    - Proof you can back up, such as real reviews
    - Product photos and your brand colours (optional)
    - Your Shopify theme details (optional)
  prerequisites:
    - An AI that can write code files and, ideally, view a page in a browser
  output:
    - name: Reason and proof map
      contains: Five buying reasons, each with its claim, source, buyer doubt and image job.
    - name: Page copy
      contains: Three headline options, the five reasons, the offer, real conditions and questions.
    - name: Responsive HTML page
      contains: A mobile-ready page in the editorial or direct-response look you pick.
    - name: Revision and check log
      contains: The changes you asked for and what was checked at phone and desktop sizes.
    - name: Shopify section and template (optional)
      contains: A Liquid section with its settings and template file, marked as a starter if no theme is given.
