name: Reconcile a locked-box closing price
headline: Reconcile a locked-box closing price
summary: Combine unrecovered leakage and a separately documented ticking amount.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: A fixed-price adjustment bridge showing leakage and ticking compensation separately. Share signed locked-box price, dated transfer ledger, permitted items, repayment evidence, daily ticking clause and counsel-confirmed eligible days.
explain: |-
  A fixed-price adjustment bridge showing leakage and ticking compensation separately.

  Acquisition closing. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
