  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - Signed locked-box price, dated transfer ledger, permitted items, repayment evidence, daily ticking clause and counsel-confirmed eligible days.
  - Reporting date, currency and scale, fiscal calendar, accounting basis and authorized scope.
  - Available spreadsheet tools and required native output format.
you_get:
  - A fixed-price adjustment bridge showing leakage and ticking compensation separately.
