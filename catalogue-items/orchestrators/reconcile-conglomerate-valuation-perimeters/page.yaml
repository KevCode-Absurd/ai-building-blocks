how_it_works:
  - title: Segment profit elimination bridge
    text: Use actual sourced schedules in one linked native workbook; example values are illustrative and must not become issuer inputs. Tie segment measures to consolidated operating profit and preserve all corporate costs and profit eliminations before passing earnings into valuation.
  - title: Minority-interest multiple reconciliation
    text: Map subsidiaries included at 100% in the earnings denominator and include their outside ownership consistently in consolidated enterprise value. Keep book and estimated market minority values distinct.
  - title: Listed holding look-through NAV
    text: Value separately held equity stakes only where their operating earnings were excluded from the consolidated model. Reconcile parent-only liabilities and label all additions/exclusions to prevent double counting.
output_shape: |-
  A linked perimeter ledger for segment profit, consolidated EV and nonoperating holdings.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Every subsidiary or holding has one documented treatment; group profit reconciles and assets, debt, cash and outside ownership enter once; unresolved perimeter differences stop the affected valuation.
judge:
  - Every subsidiary or holding has one documented treatment; group profit reconciles and assets, debt, cash and outside ownership enter once; unresolved perimeter differences stop the affected valuation.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
