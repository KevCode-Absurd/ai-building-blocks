    note: Reconcile gross foreign receipts and obligations. Record the existing buy-forward as a positive foreign delivery, or a sell-forward as negative, in the exposure map. Pass the original matched obligation and actual hedge notional to settlement, never the already-net residual as the full payable. This workflow settlement branch supports buy-foreign contracts only.
