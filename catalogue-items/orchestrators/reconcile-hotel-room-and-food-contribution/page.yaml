how_it_works:
  - title: Hotel channel revenue reconciler
    text: Reconcile actual room-night channel receipts, commissions and occupied-room service costs. Pass the property period, cost boundaries and room contribution as one departmental subtotal.
  - title: Restaurant portion cost builder
    text: Build food service batch contributions across that period using actual yield, servings and receipts. Reconcile room and food subtotals in a clearly bounded management summary; exclude shared overhead from both unless separately allocated with source evidence.
