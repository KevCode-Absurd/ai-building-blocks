name: Reconcile private fund fee charges
headline: Reconcile private fund fee charges
summary: Carry a documented stepdown charge into the actual fee-offset ledger.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Fee-basis bridge, offset use, invoice and carryforward reconciliation. Share lPA rates and basis definitions, stepdown date, comparable-period eligible bases, received eligible portfolio fees and prior offset credits.
explain: |-
  Fee-basis bridge, offset use, invoice and carryforward reconciliation.

  Private fund fees. The governing file preserves the component methods, input coverage and acceptance checks through each handoff.
when:
  - You need fee-basis bridge, offset use, invoice and carryforward reconciliation.
  - You work on private fund fees and need traceable calculations.
  - A reviewer needs to trace the result back to inputs and assumptions.
you_give:
  - LPA rates and basis definitions, stepdown date, comparable-period eligible bases, received eligible portfolio fees and prior offset credits.
