slug: reconcile-project-reserves-and-payment-priority
name: Reconcile project reserves and payment priority
summary: "Work out a project's debt reserve top-up, then run one period's cash through senior debt, reserve and junior debt. Unpaid amounts stay visible."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: advanced
inputs:
  - type: spreadsheet
    required: true
  - type: contract
    required: true
  - type: document
    required: true
outputs:
  - type: audit_report
  - type: spreadsheet
needs_mode: manual
uses:
  - debt-reserve-rollforward-builder
  - project-payment-waterfall-builder
steps:
  - uses: debt-reserve-rollforward-builder
    note: Calculate reserve requirement, approved draws and top-up need from the same debt schedule. Use a sourced cash-after-senior-service limit for preliminary funding and pass requirement, need and opening reserve separately to the waterfall.
  - uses: project-payment-waterfall-builder
    note: Allocate the same available operating cash through actual senior-service, reserve and junior-service priorities. Tie actual reserve allocation to the rollforward deposit; if it differs from preliminary funding, list the mismatched line, the two amounts and which source to re-pull (the debt schedule or the reserve statement). Re-pull that source, rerun the tie, and record the reconciliation and its reason instead of forcing a plug.
