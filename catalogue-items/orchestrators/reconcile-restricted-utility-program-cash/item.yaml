steps:
  - uses: water-utility-collections-reconciler
    note: Reconcile consumer water billings, current/arrears receipts and receivables on the actual period. Pass only actual collected cash to the program bank map and preserve billing balances outside cash.
  - uses: grant-restrictions-cash-reconciler
    note: Map the award-funded program with consumer collections classified only by the supplied restriction rules. Roll restricted and total bank cash separately; do not describe consumer receipts as grant revenue or assume award spending eligibility.
  - uses: restricted-cash-availability-checker
    note: Use the reconciled bank and restriction balances to calculate accessible cash after any additional nonoverlapping collateral or pending debit blocks. Tie final general cash to the prior fund bridge before concluding available funding.
