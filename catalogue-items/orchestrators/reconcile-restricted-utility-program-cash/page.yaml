    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Consumer receipts and grant receipts remain separate source streams; restricted releases require evidence and general cash is not double-counted.
judge:
