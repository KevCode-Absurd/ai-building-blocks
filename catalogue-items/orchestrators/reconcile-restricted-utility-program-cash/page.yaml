how_it_works:
  - title: Water utility collections reconciler
    text: Reconcile consumer water billings, current/arrears receipts and receivables on the actual period. Pass only actual collected cash to the program bank map and preserve billing balances outside cash.
  - title: Grant restrictions cash reconciler
    text: Map the award-funded program with consumer collections classified only by the supplied restriction rules. Roll restricted and total bank cash separately; do not describe consumer receipts as grant revenue or assume award spending eligibility.
  - title: Restricted cash availability checker
    text: Use the reconciled bank and restriction balances to calculate accessible cash after any additional nonoverlapping collateral or pending debit blocks. Tie final general cash to the prior fund bridge before concluding available funding.
