uses:
  - closing-equity-proceeds-checker
  - working-capital-true-up-checker
  - escrow-release-checker
steps:
  - uses: closing-equity-proceeds-checker
    note: Build enterprise-to-equity proceeds from actual cash, debt, debt-like items and seller expenses. Keep working-capital adjustments and escrow allocations outside this initial subtotal.
  - uses: working-capital-true-up-checker
    note: Use the identical contractual working-capital definition for peg, estimate and final. Add only the final-less-estimate settlement to amounts already paid, never the full peg adjustment again.
  - uses: escrow-release-checker
    note: Reconcile actual deposits, prior disbursements and pending reserves independently. Show available release as retained proceeds becoming payable, not new consideration added to equity value.
