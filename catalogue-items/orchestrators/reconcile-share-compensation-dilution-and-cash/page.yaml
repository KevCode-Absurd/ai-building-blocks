how_it_works:
  - title: Weighted-average share schedule
    text: Use actual sourced schedules in one linked native workbook; example values are illustrative and must not become issuer inputs. Reconcile actual employee issuance dates to basic weighted ordinary shares and distinguish issued shares from future potential shares.
  - title: Treasury-stock option dilution
    text: Use award-class terms and the verified weighted basic denominator to calculate accounting incremental shares; do not substitute actual issued-share counts for weighted options.
  - title: Share compensation cash-offset cost
    text: Use separately sourced net shares actually issued and employee cash proceeds for an explicit offset scenario. Compare cash cost with accounting compensation while retaining both and avoiding duplicate dilution deductions.
output_shape: |-
  A linked award dilution and employee-share cash-offset workbook.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Actual issued, basic weighted and potential diluted shares remain separate; exercise proceeds appear once; reported compensation and cash offset are reconciled without claiming equivalence.
judge:
  - Actual issued, basic weighted and potential diluted shares remain separate; exercise proceeds appear once; reported compensation and cash offset are reconciled without claiming equivalence.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
