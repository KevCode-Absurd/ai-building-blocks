slug: reconcile-treasury-settlement-liquidity
name: Reconcile treasury settlement liquidity
summary: "Check how much cash you can reach today, test your last forecast against actuals, and build a dated settlement ladder that shows funding gaps."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: advanced
inputs:
  - type: spreadsheet
    required: true
  - type: document
    required: true
outputs: []
needs_mode: manual
uses:
  - restricted-cash-availability-checker
  - treasury-forecast-backtest-checker
  - settlement-liquidity-ladder-builder
steps:
  - uses: restricted-cash-availability-checker
    note: Establish current accessible cash from dated bank balances and nonoverlapping restrictions. Pass that dated opening amount, account scope and currency to the current settlement ladder; retain restriction evidence.
  - uses: treasury-forecast-backtest-checker
    note: Backtest the prior frozen net-flow forecast against matching actual periods using its own historical opening balance. Explain bias and ending drift without replacing the current opening balance or adding past forecast errors to future cash.
  - uses: settlement-liquidity-ladder-builder
    note: Build the current ordered ladder from accessible cash in step1 and actual supplied settlement records. Use step2 only to challenge timing assumptions; never paste its illustrative amounts into the new forecast. Reconcile final cash to the actual source map.
