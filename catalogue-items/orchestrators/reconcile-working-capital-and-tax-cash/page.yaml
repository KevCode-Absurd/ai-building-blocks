  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Noncash working-capital bridge
    text: Use actual sourced schedules in one linked native workbook; example values are illustrative and must not become issuer inputs. Map operating balances while excluding tax and financing items; remove sourced acquisitions, translation and other noncash movements before deriving the indirect cash effect.
  - title: Constant-currency revenue bridge
    text: Use the issuer currency buckets to distinguish revenue translation from balance-sheet translation; never reuse average revenue rates as a substitute for the working-capital FX note.
  - title: Current tax cash-payment bridge
    text: Reconcile separately excluded current-tax payables to cash taxes, then connect the two schedules to CFO without counting current tax in operating working capital as well.
output_shape: |-
  A linked operating working-capital and current-tax cash reconciliation workbook.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Operating cash investment and cash taxes reconcile to their independent source notes; FX conventions are explicit; tax/financing balances are excluded from working capital and every residual is retained.
judge:
  - Operating cash investment and cash taxes reconcile to their independent source notes; FX conventions are explicit; tax/financing balances are excluded from working capital and every residual is retained.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
