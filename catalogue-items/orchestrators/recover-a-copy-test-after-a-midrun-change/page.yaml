new_slug: recover-a-copy-test-after-a-midrun-change
name: Copy test change and recovery workflow
summary: Check a copy test after an offer or tracking change. Get a fair comparison map, clear evidence limits and a plan to restart.
job: plan-ad-tests
headline: Copy test change and recovery workflow
subhead: Share the test plan, ad versions, dated results and change log. Get which comparisons still hold, what the numbers can show, and a restart plan.
explain: |-
  An offer, page or tracking rule changed while your copy test was running. Now the numbers mix two setups, and an apparent winner may not be real.

  This workflow sorts out which parts of the test you can still trust. It does not pick new ideas to test, set your next budget or promise a winner. If the copy now states a wrong price or offer, you can fix that straight away, even when the test result stays unclear.
when:
  - An offer, page, tracking rule or copy version changed while a test was running.
  - You need to know which comparisons remain usable before rewriting an apparent winner.
you_give:
  - The original test plan, with the control and variant copy, the question, how people were split and the rule for picking a winner
  - Results with dates, time zone, what counts as a view and a conversion, and which ad version each row belongs to
  - The dates and times when the offer, tracking, page or ads changed, plus your current approved facts such as price and terms
you_get:
  - A timeline of each change and which test periods it splits
  - A table of which groups are still fair to compare, and why the others are not
  - A result table (group, period, people, conversions, rate, difference) with a supported, unclear or unusable call for each comparison
  - A small copy fix for any stale fact, or a note that none is needed
  - A recovery plan: resume, restart, run a new test or stop, with one thing to change, limits, an owner and a next decision date
how_to_use:
  - Download the pack and add it to your AI, or paste the instructions into a chat.
  - Attach the test plan, your results export and the change log. Say which approved facts are current.
  - When the AI pastes back a stage, check it before the next one starts. In a plain chat, paste each stage's result into the next prompt if the AI loses track.
  - Before you act on the recovery plan, check the result table against your own export.
how_it_works:
  - title: Freeze the planned comparison and locate material changes
    text: Writes down the original question, the one thing being tested, how people were split, what counts as a conversion and when the test should stop. Then it maps each change to the date it took effect and the versions it touched. The question is never rewritten after seeing results.
  - title: Check co-changes and determine comparable units
    text: Checks whether anything besides the copy differed between versions, such as a different offer, page or tracking. Only groups where the copy is the sole difference count as clean. Excluded rows and their totals stay visible, so nobody picks a flattering subset.
  - title: Read only the evidence the design can support
    text: Works out counts, rates and differences for the clean groups only, with the same dates, currency and conversion rules on both sides. A gap in rates is not proof the copy caused it. Extra digging after the fact is labelled as such, and whole-run totals stay in view.
  - title: Repair the current copy without moving the goalposts
    text: Fixes a stale offer or wrong fact in the copy, whatever the test says. Everything else that was agreed stays the same. If nothing is wrong, it says "no change" instead of inventing a rewrite.
  - title: Choose and hand off the bounded recovery plan
    text: Picks one path, resume, restart with matching versions, run a new test or stop, and writes the rules for it. How many people a new test needs depends on your starting rate and the lift worth finding, not a fixed spend or day count. The plan is handed back to you; nothing is launched.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - "You are planning a new copy test: use the Cross-over copy test planner."
  - "Nothing changed during the test and you only want to read the result: use the Split-run result reader."
  - "You want to pick the next idea to test from scratch: use the One-change experiment planner."
output_sample:
  input:
    - The original test plan with the control and variant copy
    - Results with dates, time zone and how each ad version maps to the numbers
    - A dated log of every change to the offer, page, tracking or ads
    - Your approved current facts, such as price and offer terms
  output:
    - name: Change and impact timeline
      contains: Each change with its date, the versions it touched and which test periods it splits.
    - name: Comparability matrix
      contains: Which groups are clean to compare, which are confounded, and why.
    - name: Observed result table
      contains: Counts and rates for valid groups, with a decision of supported, inconclusive or unusable.
    - name: Copy patch or no-change record
      contains: A minimal fix for a stale offer or fact, or a clear note that none is needed.
    - name: Recovery pack
      contains: Resume, restart or stop, with one variable, limits, guardrails, owner and next decision.
