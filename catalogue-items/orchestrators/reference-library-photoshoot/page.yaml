new_slug: reference-library-photoshoot
name: Reference library product photoshoot
summary: Pick photo looks for one real product. Get a shot plan, a pilot and checked files in each size you ask for.
job: product-photos
headline: Reference library product photoshoot
subhead: Choose the looks. Keep the real product right.
explain: Adds a reference-library picker, fit assessment, persistent user directions and review-deck cycle to product-photo production. It changes a reference look when product truth would be lost.
when:
  - You want to choose looks from a campaign photo library.
  - You need one exact product shown consistently across a reviewed set.
you_give:
  - Real photos of the exact variant, including how it is worn or used.
  - Brand art direction and a reference-photo set.
  - Chosen placements, aspect ratios, count and budget.
you_get:
  - A product truth sheet, fit-ranked look selection and shot plan.
  - A pilot and generated images where tools allow.
  - A per-ratio QA record, review deck and versioned export set.
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
how_it_works:
  - title: Lock product truth
    text: Identify exact variant, real anchors, use geometry and what cannot change.
  - title: Choose transferable looks
    text: Rank reference fit, keep individual direction and build one shot plan per look.
  - title: Review every frame
    text: Make a pilot, adapt sizes, inspect actual outputs and retain revision history.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - "You only have rough phone photos and want a quick set: use A full product photoshoot from your phone photos."
  - "You only need to plan the shots, not make them: use the Product photo shoot planner."
  - "You already have photos and want them checked for product accuracy: use the AI product photo inspector."
output_sample:
  input:
    - Real photos of the exact product variant, including how it is worn or used
    - A set of reference photos for the looks you like
    - Your brand direction, if you have a brand file (optional)
    - Sizes, number of looks and budget (optional)
  prerequisites:
    - An image tool that can use your real product photo as a reference
  output:
    - name: Product truth sheet
      contains: The exact variant, colours, label text and how the product looks in use.
    - name: Look selection and shot plan
      contains: Reference looks ranked by fit, with what to keep, swap or drop in each.
    - name: Pilot image
      contains: One test frame checked against your real photo before the full set is made.
    - name: Checked image files
      contains: Final images in each size you ask for, such as 4:5, 1:1 and 9:16.
    - name: Review deck and QA record
      contains: Shot IDs, versions, reasons for each look and which frames passed inspection.
