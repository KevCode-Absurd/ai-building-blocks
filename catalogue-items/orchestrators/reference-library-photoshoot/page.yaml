new_slug: reference-library-photoshoot
name: Reference library product photoshoot
summary: Pick photo looks for one real product. Get a shot plan, a pilot and checked files in each size you ask for.
job: product-photos
headline: Reference library product photoshoot
subhead: Give it real photos of one product and a set of reference photos you like. It picks the looks that fit, plans each shot and checks every picture against your real product before you use it.
explain: |-
  Reference photos show the look you want. They do not show your product. This workflow starts from your real photos of one exact product and writes down what is true about it: the colours, the label text and how it looks in use.

  Then it rates each reference look by how well it fits that product. A look that fits as it is is rated exact. A look where only the light and layout carry over is rated structure. A look where only the mood and colours carry over is rated loose. It plans a shot for each look you pick, makes one pilot frame for you to approve, and builds the rest of the set in the sizes you ask for. Every frame is checked against your real photo.

  It runs as one method and calls no other skill. Claude cannot draw the pictures, so you need an image tool. Many image tools are paid or need credits or an API key. If a look would hide the true product, the workflow changes the look and tells you why. You may not reuse a reference photo commercially.
when:
  - You want to choose looks from a campaign photo library.
  - You need one exact product shown consistently across a reviewed set.
you_give:
  - Real photos of the exact variant, including how it is worn or used.
  - Brand art direction and a reference-photo set.
  - Chosen placements, aspect ratios, count and budget.
you_get:
  - A product truth sheet, fit-ranked look selection and shot plan.
  - A pilot and generated images where tools allow.
  - A per-ratio QA record, review deck and versioned export set.
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Have an image tool ready. Many are paid or need credits or an API key.
  - Send your real photos of the exact variant and your reference photos. The AI writes the truth sheet first.
  - Check the truth sheet against the real product, then pick the looks you want, or ask for a shortlist.
  - Approve one pilot frame before the rest of the set is made.
  - Review the QA deck, then send back any frame to fix by its shot ID.
  - Check each final frame against your real photo before you publish it. If you only need the plan, stop after the shot plan.
how_it_works:
  - title: Lock product truth
    text: Identify exact variant, real anchors, use geometry and what cannot change.
  - title: Choose transferable looks
    text: Rank reference fit, keep individual direction and build one shot plan per look.
  - title: Review every frame
    text: Make a pilot, adapt sizes, inspect actual outputs and retain revision history.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
not_for:
  - "You only have rough phone photos and want a quick set: use Product photoshoot planner and producer."
  - "You only need to plan the shots, not make them: use the Product photo shoot planner."
  - "You already have photos and want them checked for product accuracy: use the AI product photo inspector."
output_sample:
  input:
    - Real photos of the exact product variant, including how it is worn or used
    - A set of reference photos for the looks you like
    - Your brand direction, if you have an org context (optional)
    - Sizes, number of looks and budget (optional)
  prerequisites:
    - An image tool that can use your real product photo as a reference. Many are paid or need credits or an API key. Claude cannot draw the pictures itself.
  output:
    - name: Product truth sheet
      contains: The exact variant, colours, label text and how the product looks in use.
    - name: Look selection and shot plan
      contains: Reference looks ranked by fit, with what to keep, swap or drop in each.
    - name: Pilot image
      contains: One test frame checked against your real photo before the full set is made.
    - name: Checked image files
      contains: Final images in each size you ask for, such as 4:5, 1:1 and 9:16.
    - name: Review deck and QA record
      contains: Shot IDs, versions, reasons for each look and which frames passed inspection.
