slug: release-a-new-version-and-prove-it-is-live
name: "Release a new version and prove it is live"
summary: "Give it your project. Get a version, a changelog, a go or no-go call, a live deploy and proof it is new."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: codebase, required: true}
outputs:
  - {type: audit_report}
uses: [release-preparer, ship-readiness-gate, vercel-publisher, deploy-verifier]
steps:
  - {uses: release-preparer, note: "Sets the version and writes the changelog from your commits. It hands over your project with the version bump and changelog in it."}
  - {uses: ship-readiness-gate, note: "Checks your project with the new version and gives a go or no-go. It hands over the go or no-go and the list of blockers."}
  - {uses: vercel-publisher, note: "Uses your own project once the gate says go, not step 2's gate report. It puts the release live and hands over the live link."}
  - {uses: deploy-verifier, note: "Opens the live link from the step before and proves it serves the new build, not the old one."}
