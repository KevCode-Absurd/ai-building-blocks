slug: research-a-question-and-write-a-cited-report
name: "Research a question and write a fully cited report"
summary: "Give it the question. Get an outline, the sources, a cited report and a check of every claim."
category: orchestrator
type: workflow
role: orchestrate
job: research
level: intermediate
inputs:
  - {type: question, required: true}
  - {type: source_text, required: false}
outputs:
  - {type: document}
  - {type: audit_report}
uses: [research-question-outliner, scholarly-database-searcher, cited-research-report-writer, unsupported-claim-spotter]
steps:
  - {uses: research-question-outliner, note: "Turns your question into sub-questions, what evidence would answer each, and what kind of source counts for this reader. It hands over that outline."}
  - {uses: scholarly-database-searcher, note: "Searches scholarly and public databases for each sub-question in the outline from step 1. It hands over a shortlist of sources, with a note on what each one shows and how strong it is."}
  - {uses: cited-research-report-writer, note: "Writes from your question, with the outline's sub-questions as its angles and the shortlist from step 2 as its first sources. It hands over the report, answering each sub-question in turn, with a citation on every claim."}
  - {uses: unsupported-claim-spotter, note: "Reads every claim in the report from step 3 against its cited source. Claims the source does not support are flagged, then fixed, softened or cut. It hands over the claim check and the corrected report."}
origin: own
version: 1.0.0
example_pending: true
