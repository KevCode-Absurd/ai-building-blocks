slug: resolve-campaign-brief-conflicts-before-drafting
name: Ad brief conflict and draft workflow
summary: Resolve clashing ad briefs into one decision register. Draft only the safe agreed ad copy and return the open decisions with a checkpoint.
category: orchestrator
type: workflow
role: orchestrate
job: copy
level: advanced
inputs:
  - type: brief
    required: true
  - type: document
    required: true
  - type: product_data
    required: false
  - type: offer
    required: false
outputs:
  - type: brief
    required: true
  - type: copy_draft
    required: true
  - type: document
    required: true
uses:
  - marketing-evidence-expiry-reviewer
  - marketing-brief-writer
  - claim-and-proof-matcher
  - theme-based-ad-copy-set-writer
steps:
  - uses: marketing-evidence-expiry-reviewer
    note: Reads your clashing briefs and dated evidence and makes a conflict register with resolvable facts, open owner decisions and safe independent work. It hands the register to the next step.
  - uses: marketing-brief-writer
    note: Uses your own product and buyer facts and the decisions you have made, not the raw register. It takes the resolvable facts from step 1 as the sources and fences off the open decisions as claims not allowed. It hands over a brief showing selected decisions, factual sources, unchanged constraints and excluded unresolved assertions.
  - uses: claim-and-proof-matcher
    note: Checks the claims the brief from step 2 says the copy will use, as the copy to check, against your offer, product facts and customer words. It hands over a claim map and either a safe drafting contract or a precise dependency stop.
  - uses: theme-based-ad-copy-set-writer
    note: Uses the brief from step 2, limited to the claims step 3 cleared, not the claim map itself. It hands over the bounded draft, a decision-to-output check and a portable resume checkpoint.
execution: coordinator
package_files: all
needs_mode: manual
origin: own
example_pending: true
version: 1.0.0
