  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Stock-split EPS restatement
    text: Use actual sourced schedules in one linked native workbook; example values are illustrative and must not become issuer inputs. Build the actual split-factor ledger and preserve original comparatives; pass adjusted historical shares and EPS with their event dates.
  - title: Rights-issue EPS adjustment
    text: Calculate the actual rights TERP and bonus factor separately from split effects. Apply each confirmed bonus factor only to the affected historical periods; document factor one when no bonus exists.
  - title: Weighted-average share schedule
    text: Use the dated restated pre-event share intervals and actual issued-share dates to compute the current denominator; avoid treating cash issuance as a retrospective split.
output_shape: |-
  A corporate-action restatement workbook and current-period weighted-share reconciliation.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Aggregate earnings remain unchanged by restatement; all event factors and dated intervals reconcile to the published EPS note; no cash issue is applied retrospectively without a bonus basis.
judge:
  - Aggregate earnings remain unchanged by restatement; all event factors and dated intervals reconcile to the published EPS note; no cash issue is applied retrospectively without a bonus basis.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
