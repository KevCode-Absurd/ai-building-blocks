how_it_works:
  - title: Research spend cohort adjustment
    text: Use actual sourced schedules in one linked native workbook; example values are illustrative and must not become issuer inputs. Build dated cohorts with the chosen life and preserve statutory treatment. Pass economic amortization and research-asset balances with the unchanged cash-tax convention.
  - title: Reinvestment-supported growth schedule
    text: Adjust both capital and operating investment consistently for expensed research; reconcile cash taxes separately, and do not mechanically tax an economic addback or use unadjusted historical ROC.
  - title: Terminal growth reinvestment check
    text: Use a defensible stable research life and marginal capital return to couple terminal growth with reinvestment; reject a terminal cash-flow boost created only by omitting research replacement spending.
output_shape: |-
  A linked analyst research-asset and growth-consistency workbook alongside reported accounts.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Research costs appear once across profit, capital and reinvestment; cash taxes remain source-based; reported and analyst cases are labeled and changes in life are tested.
judge:
  - Research costs appear once across profit, capital and reinvestment; cash taxes remain source-based; reported and analyst cases are labeled and changes in life are tested.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
