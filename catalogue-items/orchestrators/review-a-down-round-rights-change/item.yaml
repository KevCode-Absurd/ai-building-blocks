steps:
  - uses: weighted-average-antidilution-checker
    note: Use the actual charter A/B/C definitions to calculate the qualifying reset. In the usual weighted-average form, B is the cash received divided by the old price, and the new price is the old price times (A + B) / (A + C). Follow the charter where its wording differs. Preserve new conversion ratio, rounding, exemptions and the document version used.
  - uses: option-pool-top-up-checker
    note: Takes the new conversion ratios from step 1. Require a freshly approved fully diluted denominator reflecting the actual protected conversion ratios where the term sheet requires them. Calculate only the separate pre-cash reserve top-up and flag missing interacting classes.
