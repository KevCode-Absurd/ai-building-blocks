new_slug: review-a-fund-bridge-and-hurdle
name: Review a fund bridge and hurdle
headline: Review a fund bridge and hurdle
summary: See what a capital call bridge does to LP returns, then check the preferred return and the carry split. Get linked checks with gaps listed.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give your AI two annual investment dates, the bridge cost, the fund agreement's hurdle clause and the cash to distribute. It compares LP returns with and without the bridge, builds the preferred return from the date your agreement sets, then splits the cash with no GP catch-up.
explain: |-
  A fund can borrow on a credit line and call its investors' money a year later. That lifts the return as a percent, because the investors' money is in for less time. It also adds interest cost. A separate question is when the preferred return (the hurdle) starts to build. Many people assume it starts when the money is called. The fund agreement decides.

  Step 1 compares the return with and without the bridge, over whole annual periods. Step 2 finds where the agreement starts the hurdle, which capital counts and the year fraction, then builds the preference. Step 3 splits the cash in order: capital back, then the preference, then carry, with no catch-up.

  The bridge cost is counted once. The return comparison stays apart from the cash split. If the dates are not annual, the AI stops and says so, since that case needs an XIRR.
when:
  - A fund used a subscription line, and you must show investors what it did to returns.
  - You need to find out when the preferred return starts under the fund agreement.
  - A distribution is due, and you must split it between LPs and the GP with no catch-up.
  - A reviewer asks why returns with and without the line differ.
not_for:
  - "Cash flows fall on irregular dates: run an XIRR in a spreadsheet first. This covers two annual periods only."
  - "Your agreement has a GP catch-up: this does not fit. Use your fund administrator's waterfall."
  - "You only need to split one distribution: use the Check a no-catchup fund distribution workflow."
  - "You want to check a capital call notice: use the Reconcile a private fund capital call workflow."
you_give:
  - The investment amounts and exit cash, with exact annual dates over two years
  - "The bridge: one year long, a simple annual cost, and a call at the first anniversary"
  - "The fund agreement's hurdle clause: the rate, when it starts and which capital counts"
  - The cash available to distribute, after financing costs
  - The carry share, such as 20 percent, from the agreement
  - The currency, scale and reporting date
you_get:
  - LP returns with and without the bridge, the financing cost and both money multiples
  - The preferred return for the period and the total unpaid
  - "A split of the cash: capital returned, preference paid, GP carry and LP cash"
  - Any shortfall left in the first tier
  - A list of what is MISSING and which checks were missed
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini, in a chat that accepts files.
  - Attach the fund agreement pages, the investment and exit dates and the bridge terms. Say the reporting date and currency.
  - Ask your AI to follow the pack, save a file for each step and stop a step when an input is missing.
  - After step 2, check the hurdle start date against the clause. It is not always the call date.
  - After step 3, check that capital, preference and carry add up to the cash you had. A spreadsheet tool is needed for the workbook. Without one, your AI gives the tables in chat.
how_it_works:
  - title: Subscription line timing checker
    text: Compares periodic IRR and money multiples with and without a one-year bridge, using the simple bridge cost. Labels each IRR as periodic and stops for irregular dates. Hands step 3 the financing cost, so it is counted once.
  - title: Preferred return accrual checker
    text: Finds the hurdle start, the eligible capital and the year fraction from the agreement's own clause. Accrues the simple preference and never copies the return holding period into it. Hands step 3 the unpaid preference.
  - title: No-catchup waterfall checker
    text: "Splits the cash after financing: unreturned eligible capital first, then the accrued preference, then carry on what is left. Keeps the return comparison apart from the split. Check before you finish: the parts add up to the cash."
output_shape: |-
  SCOPE AND DATED SOURCES   <dates, agreement clauses used, currency, scale>
  BRIDGE COMPARISON         <unbridged IRR | bridged IRR | financing cost | both money multiples>
  HURDLE ACCRUAL            <start date | eligible capital | rate | year fraction | preference | unpaid total>
  WATERFALL                 <capital returned | preference paid | GP carry | LP cash | first-tier shortfall>
  RECONCILIATION            <parts equal cash available: yes or no; bridge cost counted once>
  MISSING                   <inputs not given>
  CHECKS MISSED             <one line each, or none>
output_sample:
  input:
    - Investment and exit amounts, with exact annual dates
    - The bridge length, cost and call date
    - The hurdle clause and the carry share
    - The cash available to distribute
  prerequisites:
    - An AI that can read files
    - The fund agreement pages that define the hurdle
  output:
    - name: outputs/step-1-subscription-line-timing-checker.md
      contains: Returns and money multiples with and without the bridge, plus the financing cost.
    - name: outputs/step-2-preferred-return-accrual-checker.md
      contains: The hurdle start, eligible capital, year fraction, preference and unpaid total.
    - name: outputs/step-3-no-catchup-waterfall-checker.md
      contains: Capital returned, preference paid, GP carry, LP cash and any shortfall.
    - name: HAND-BACK SUMMARY
      contains: Files saved, sources used, MISSING lines, checks missed and one suggested next step.
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Do not infer hurdle start or eligible capital from the delayed call; contractual accrual and cash contribution definitions control.
judge:
  - Do not infer hurdle start or eligible capital from the delayed call; contractual accrual and cash contribution definitions control.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A chat AI that reads long documents
      why: The hurdle clause decides the answer. In plain chat, paste the exact wording.
  inputs:
    - The last fund statement, to check the capital balances.
    - The credit line terms for the bridge cost.
terms:
  - term: Subscription line
    meaning: A loan to the fund that lets it pay for deals before it calls money from investors.
  - term: Preferred return
    meaning: The yearly return investors get first, before the GP takes carry. Also called the hurdle.
  - term: Carry
    meaning: The share of profit the fund manager keeps after investors get their capital and preference.
  - term: Catch-up
    meaning: A step that lets the GP take extra profit until it has its full share. This workflow has none.
  - term: LP and GP
    meaning: LPs put in the money. The GP runs the fund.
before: []
