slug: review-a-page-for-ease-of-use-and-plan-a-one-morning-test
name: Review a page and plan a morning usability test
summary: Give it a page or screen. Get its usability problems, every unclear
  choice rated, and a one-morning test plan for three people.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - usability-heuristic-reviewer
  - click-choice-clarity-checker
  - small-usability-test-planner
steps:
  - uses: usability-heuristic-reviewer
    note: Walks the page as a newcomer would and checks it against ten well-known
      usability rules. Problems are ordered by what they cost the visitor.
  - uses: click-choice-clarity-checker
    note: Takes the problems from the review and lists each choice on the way to the
      goal. Rates it as obvious or needing thought, and rewrites vague labels.
  - uses: small-usability-test-planner
    note: Uses the problems and ratings to pick the few tasks that matter. Writes
      the script, how to find three people and a sheet for the worst problems
      you see.
origin: rebuilt
credits:
  - title: 10 Usability Heuristics for User Interface Design
    by: Jakob Nielsen, Nielsen Norman Group
    url: https://www.nngroup.com/articles/ten-usability-heuristics/
    used: The ten rules the design is walked against, and the idea of ranking breaks
      by cost to the user
  - title: "Usability 101: Introduction to Usability"
    by: Jakob Nielsen, Nielsen Norman Group
    url: https://www.nngroup.com/articles/usability-101-introduction-to-usability/
    used: Usability as a set of qualities, and checking against what users already
      know
  - title: We Don't Sell Saddles Here
    by: Stewart Butterfield
    used: Looking at every step as a newcomer and listing each small flaw and seam
      between parts
  - title: Don't Make Me Think, Revisited
    by: Steve Krug
    url: https://sensible.com/dont-make-me-think/
    used: Counting thought rather than clicks, the scent of where a link leads, and
      short, timely help
  - title: Why You Only Need to Test with 5 Users
    by: Jakob Nielsen, Nielsen Norman Group
    url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/
    used: Small rounds repeated beat one big test
  - title: The Author of Don't Make Me Think Discusses UX Design's 20-Year Evolution
    by: Steve Krug, interview
    used: Having a true beginner try it and watching from the first screen
  - title: Melanie Perkins, SV001 talk and first-person feature
    by: Melanie Perkins
    used: Cutting every step that is not what the person came to do
version: 1.0.0
example_pending: true
