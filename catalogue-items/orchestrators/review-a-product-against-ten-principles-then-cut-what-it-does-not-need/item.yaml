slug: review-a-product-against-ten-principles-then-cut-what-it-does-not-need
name: Review a product and cut features it does not need
summary: Describe your product or page. Get a ten-principle review and a list of
  what to keep, cut and merge.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - design-ten-principles-reviewer
  - feature-cutting-planner
steps:
  - uses: design-ten-principles-reviewer
    note: Writes what the product is for, lists every part and its job, and scores
      it on ten principles. Marks the parts that serve no purpose.
  - uses: feature-cutting-planner
    note: Takes the review and asks of each feature whether it helps the main job.
      Sorts them into keep, cut and merge, then sets the order a new user should
      see them.
origin: rebuilt
credits:
  - title: Design by Vitsoe, speech delivered in New York
    by: Dieter Rams, 1976
    url: https://www.vitsoe.com/gb/about/good-design
    used: The ten principles of good design, and the test of what the product is for
      and who uses it
  - title: If You Had To Do It All Over Again poster series, U&lc
    by: Herb Lubalin, 1978
    used: Listing every element on a piece, even small ones such as page numbers
  - title: Neville Brody, Blueprint interview, May 1985
    by: Martin Colyer
    used: Writing down what the design was meant to say in one line
  - title: Jonathan Ive profile and Q and A, Design Museum
    by: Design Museum, 2003
    used: Stating what the product is for and who holds it
  - title: Simplicity is the key to excellence, says Dieter Rams
    by: Kinfolk
    used: Keeping only what serves the main job
  - title: Steve Wozniak interview, Founders at Work
    by: Jessica Livingston
    used: Asking of every part whether another part already does its job
  - title: "Steve Wozniak: Designing a Life, Hindsights"
    by: 1993 interview
    used: Stating the goal and who would want to own the result before listing parts
version: 1.0.0
example_pending: true
