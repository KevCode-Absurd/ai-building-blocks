slug: review-aws-cost-and-resilience
name: Review AWS cost and resilience
summary: Share your AWS design and bills. Get resource savings weighed against
  workload risks before you change anything.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: question
    required: true
  - type: codebase
    required: false
outputs:
  - type: document
uses:
  - copilot-aws-cost-optimize
  - copilot-aws-well-architected-review
  - copilot-devops-rollout-plan
steps:
  - uses: copilot-aws-cost-optimize
    note: 1. Read skills/copilot-aws-cost-optimize/SKILL.md. Share your AWS setup.
      Get cost findings and proposed fixes tied to the resources your app uses.
      Save the result with source references. Hands step 2 a cost plan of proposed savings, each tied to a named resource. Carry the user's goal and all
      earlier findings into this step. If required evidence or tool access is
      missing, mark this step blocked; do not fabricate a result.
  - uses: copilot-aws-well-architected-review
    note: 2. Read skills/copilot-aws-well-architected-review/SKILL.md. Share your
      AWS design. Get architecture gaps and proposed fixes against AWS workload
      guidance. Save the result with source references. Uses your AWS design files and step 1's cost plan, so it can flag any saving that would weaken reliability or security. Hands step 3 a risk plan with rated gaps and fixes. Carry the user's goal
      and all earlier findings into this step. If required evidence or tool
      access is missing, mark this step blocked; do not fabricate a result.
  - uses: copilot-devops-rollout-plan
    note: 3. Read skills/copilot-devops-rollout-plan/SKILL.md. Share a release or
      infrastructure change. Get preflight checks, rollout stages, health
      signals and a rollback plan. Save the result with source references. Uses the change you plan to make, plus the cost plan from step 1 and the risk plan from step 2 as known risks. Hands you the final rollout and rollback plan. Carry
      the user's goal and all earlier findings into this step. If required
      evidence or tool access is missing, mark this step blocked; do not
      fabricate a result.
origin: rebuilt
version: 1.0.0
