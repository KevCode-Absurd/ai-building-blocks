      the result with source references. Carry the user's goal and all earlier
      findings into this step. If required evidence or tool access is missing,
      mark this step blocked; do not fabricate a result.
  - uses: copilot-azure-well-architected-review
    note: 4. Read skills/copilot-azure-well-architected-review/SKILL.md. Share your
      Azure design. Get architecture gaps and proposed fixes against Azure
      workload guidance. Save the result with source references. Carry the
      user's goal and all earlier findings into this step. If required evidence
      or tool access is missing, mark this step blocked; do not fabricate a
      result.
