slug: review-image-ads
name: Turn your reviews into image ads buyers believe
summary: "Image ads built on why your customers buy, with words, layout and image prompts, checked before launch."
category: orchestrator
boards: [ecommerce]
type: workflow
role: orchestrate
job: image
level: intermediate
inputs:
  - {type: web_page, required: true}
  - {type: voc_reviews, required: true}
  - {type: product_data, required: true}
  - {type: brief, required: true}
  - {type: performance_sheet, required: false}
outputs:
  - {type: image_prompt}
  - {type: audit_report}
uses: [website-brand-brain-builder, customer-buying-reasons-finder, single-image-ad-planner, accurate-product-image-ad-maker, pre-launch-ad-checker]
steps:
  - {uses: website-brand-brain-builder, note: "Read the site, tag every fact by where it came from, and write the eight org context files, with offers, prices and claims word for word. For the one check-in: if the person isn't there to answer, list each fact to confirm as a MISSING line and carry on with tagged facts only."}
  - {uses: customer-buying-reasons-finder, note: "Copy out every phrase that shows why people switched, word for word with its review number, tag its force, count separate people and rank the reasons. A reason is a pattern only at 5 people across 2 kinds of source; say so when it isn't."}
  - {uses: single-image-ad-planner, note: "Use the org context and the ranked reasons. Plan each ad the brief asks for: the one sentence it argues, the buyer (New, Warm or Ready), one claim, what the picture must prove, the layout, the words on the image and the feed copy with exact character counts, and the proof and gaps. Give each ad a different reason or ad type, and keep unverified quotes out."}
  - {uses: accurate-product-image-ad-maker, note: "Turn each approved ad plan from step 3 into one prompt per shape, with the approved words exactly, the real product's look from the org context, and each reference photo named by its job. A missing photo is MISSING, never described from memory."}
  - {uses: pre-launch-ad-checker, note: "Check every ad plan and prompt before it goes live: list stop-ship mistakes with the fix, anything worth a look with the number or quote, and what only a person can judge on a phone, then give the next action. Then close the run with a HAND-BACK SUMMARY: each step's file, any step not run and why, and every MISSING: line from all steps in one list."}
origin: own
version: 1.1.0
