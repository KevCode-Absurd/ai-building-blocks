new_slug: review-leverage-headroom-and-cure
name: Review leverage headroom and cure
headline: Review leverage headroom and cure
summary: Check net debt to EBITDA after EBITDA addbacks, and test if an equity cure can fix a shortfall. Get signed headroom and a cure result.
job: money-and-investing
thinking: high
thinking_why: Financial modelling requires consistent periods, source evidence, formulas and independent reconciliations.
subhead: Give your AI the credit agreement's addback cap and definitions, EBITDA, debt, eligible cash and any cure rights left. It caps your addbacks, tests net debt to EBITDA on the same date, and runs a cure test only if the test is missed and a cure right remains.
explain: |-
  A net debt to EBITDA covenant compares debt, less some cash, with EBITDA. The contract decides what counts as EBITDA. Lenders usually let you add back some one-off costs, up to a cap. The cap is often a share of EBITDA before addbacks. Cash netted against debt can have its own cap.

  Step 1 caps the addbacks you ask for. Step 2 takes that EBITDA, the same-date debt and the eligible cash, and shows net debt to EBITDA and signed headroom. Positive headroom is room. Negative means the limit is exceeded. Step 3 runs only if headroom is negative and the agreement still allows an equity cure. It finds how much EBITDA-only cure is needed and allowed.

  The cure raises EBITDA only. It does not also cut debt, so the cash is never counted twice. If your agreement caps addbacks on EBITDA after addbacks, step 1 stops. Nothing counts as accepted, timely or legally effective without proof.
when:
  - A covenant test date is close and you want to know if you pass.
  - Management wants to add back costs, and you must check the cap.
  - Headroom is thin and you want to know what an equity cure would need.
  - A lender questions your compliance certificate.
not_for:
  - "Your agreement caps addbacks on EBITDA after addbacks: stop and ask a lawyer or the lender's agent. The cap method here does not fit."
  - "You test debt service cash cover, not net debt to EBITDA: use the Debt service coverage checker workflow."
  - "You want to know if a cure is valid or on time, or need a waiver: ask your lawyer and lender. This does the arithmetic only."
  - "You want net debt to EBITDA after cash interest and PIK interest: use the Review sponsor debt cash demands workflow."
you_give:
  - The signed addback cap and its wording, which must be set on EBITDA before addbacks
  - EBITDA before addbacks, the permitted uncapped adjustments and the capped addbacks you want, with support for each
  - Debt on the test date, as the agreement defines it
  - Eligible unrestricted cash on the same date, and the cap on cash netting
  - The maximum net debt to EBITDA, such as 4.0 times
  - "The cure rights: how often, by when, the cap, and how much you have already used"
you_get:
  - A bridge from EBITDA before addbacks to adjusted EBITDA, with any excess addback shown
  - The ratio, the debt the covenant allows and signed headroom
  - "If a cure applies: the cure needed, the cure allowed, the new ratio and any gap left"
  - "A check of cure rules: receipt, deadline and how often"
  - A list of what is MISSING and which checks were missed
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini, in a chat that accepts files.
  - Attach the compliance certificate, the credit agreement pages with the definitions and cure clause, and your addback support.
  - Ask your AI to follow the pack, save a file for each step and stop a step when an input is missing.
  - After step 1, check that the cap in the agreement is on EBITDA before addbacks. If not, stop here.
  - After step 3, send the result to your lender contact or lawyer before anyone relies on it. A spreadsheet tool is needed for the workbook. Without one, your AI gives the tables in chat.
how_it_works:
  - title: Deal EBITDA addback checker
    text: Applies the signed cap to EBITDA before addbacks and keeps permitted uncapped adjustments apart. Shows the allowed addback and any excess. Stops if the cap is set after addbacks. Hands step 2 the contractual EBITDA.
  - title: Net leverage covenant checker
    text: Takes that EBITDA after checking all definitions match. Uses same-date debt, eligible cash and the cash netting cap to show net debt to EBITDA, allowed debt and signed headroom. Hands step 3 the verified net debt.
  - title: Equity cure scenario checker
    text: Runs only when headroom is negative and an EBITDA-only cure right is still open. Uses the net debt unchanged, applies the cap left and checks receipt, deadline and frequency. Otherwise it is skipped with a reason.
output_shape: |-
  SCOPE AND DATED SOURCES   <test date, agreement clauses, currency, scale>
  EBITDA BRIDGE             <EBITDA before addbacks | uncapped | capped allowed | excess | contractual EBITDA>
  NET DEBT TO EBITDA       <debt | eligible cash netted | net debt | ratio | maximum | allowed debt | headroom>
  CURE SCENARIO             <ran or skipped, and why | cure needed | cure allowed | ratio after | gap left>
  CURE RULES                <receipt | deadline | frequency, each with its evidence or not evidenced>
  MISSING                   <inputs not given>
  CHECKS MISSED             <one line each, or none>
output_sample:
  input:
    - The signed addback cap and the covenant definitions
    - EBITDA, debt and eligible cash on the test date
    - The maximum net debt to EBITDA ratio
    - The cure rights and how much you have used
  prerequisites:
    - An AI that can read files
    - The compliance certificate and the credit agreement pages that set the definitions
  output:
    - name: outputs/step-1-deal-ebitda-addback-checker.md
      contains: Adjusted EBITDA, the capped addback allowed and any excess disallowed.
    - name: Step 2 file (net debt to EBITDA check)
      contains: The ratio, the debt the covenant allows and signed headroom.
    - name: outputs/step-3-equity-cure-scenario-checker.md
      contains: The cure needed and allowed, the new ratio and any gap. Marked skipped if headroom is positive.
    - name: HAND-BACK SUMMARY
      contains: Files saved, sources used, MISSING lines, checks missed and one suggested next step.
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: No addback is admitted without evidence and no cure is treated as received, timely or legally effective without proof.
judge:
  - No addback is admitted without evidence and no cure is treated as received, timely or legally effective without proof.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
works_best_with:
  tools:
    - name: A chat AI that reads long documents
      why: The definitions and cure clause decide the result. In plain chat, paste the exact wording.
  inputs:
    - The latest compliance certificate.
    - Your log of earlier cures.
terms:
  - term: EBITDA addback
    meaning: A cost the agreement lets you add back to profit, usually capped.
  - term: Net debt to EBITDA
    meaning: Debt, less allowed cash, divided by EBITDA.
  - term: Headroom
    meaning: How far the result sits inside the limit. A negative number means the limit is broken.
  - term: Equity cure
    meaning: New equity that the agreement lets you treat as EBITDA to fix a missed test.
before: []
