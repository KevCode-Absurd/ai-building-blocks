slug: review-revised-excel-and-powerpoint-files
name: Review revised Excel and PowerPoint files
summary: Compare old and new Excel and PowerPoint files. Get a change register and a check that every number on the new slides matches the new workbook.
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: spreadsheet
    required: true
  - type: slide_deck
    required: true
outputs:
  - type: document
    required: true
  - type: audit_report
    required: true
uses:
  - excel-workbook-change-reviewer
  - powerpoint-deck-change-reviewer
  - excel-powerpoint-number-checker
execution: coordinator
steps:
  - uses: excel-workbook-change-reviewer
    note: Compare the old and revised workbook by row ID, not by position. Keep formula and file-feature changes. Hand step 3 the list of changed cells with sheet, cell, old value and new value.
  - uses: powerpoint-deck-change-reviewer
    note: Compare the old and revised deck by slide, including text, notes, hidden slides and chart data. Hand step 3 the list of changed slides and every number on them. Uses your old and revised decks and your brief, not step 1's output; the two reviews run side by side.
  - uses: excel-powerpoint-number-checker
    note: Check each number on the revised slides against the revised workbook. Use steps 1 and 2 as separate evidence of what changed. Flag stale numbers and changed cells that no slide shows. Uses your revised workbook and deck, plus the two change reports from steps 1 and 2. Hands you the number check.
