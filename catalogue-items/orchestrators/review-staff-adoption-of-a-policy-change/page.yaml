new_slug: review-staff-adoption-of-a-policy-change
name: Review staff adoption of a policy change
headline: Review staff adoption of a policy change
summary: See whether staff follow a new policy. Get an adoption brief, the barriers in the way and a support plan, with small groups kept private.
job: lead-people
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give your AI the approved policy, its start date, staff feedback with names removed and any training or usage records. It separates what shows people follow the policy from what only shows they heard it. You get an adoption brief, the barriers by type and a plan to support people.
explain: |-
  After a policy starts, most teams check two things: who went to the training and whether people liked it. Neither shows that anyone follows the policy. A full room and kind comments can sit next to a process nobody uses.

  This workflow sorts your evidence by what it can prove. Usage or compliance records show behaviour. Training attendance shows exposure. Feedback shows opinion. The brief says which claims each type supports. Step 1 reads the feedback within its limits, tags each barrier and holds back any group too small to stay anonymous. Step 2 turns the barriers into support actions: awareness, training, ability and reinforcement.

  It does not change the policy or any live process. Comments that dispute the policy go to the policy owner as concerns, not as problems to fix here. Policy exceptions stay protected.
when:
  - A new policy took effect a few weeks ago and you want to know whether people are using it.
  - The same questions about the policy keep arriving in chat or email.
  - A leader asked whether the change "landed" and you only have attendance numbers.
  - A check or audit is coming and you want to know where staff need help first.
not_for:
  - The policy is not approved yet. Use the Staff policy explanation and rollout writer workflow before it goes out.
  - You want to judge one person's compliance or performance. Take that to your HR reviewer.
  - You need to collect feedback first. Use the Employee feedback survey planner.
  - Your feedback is general, not about one policy. Use the Employee feedback action planner workflow.
you_give:
  - The approved policy change and its effective date (from the policy document)
  - Staff feedback with names removed, such as survey answers, questions to HR and helpdesk notes
  - Training or usage evidence, such as attendance, form counts or checks done (optional but it changes what you can claim)
  - Your privacy rules, such as the smallest group you may report on and how long to keep the data
  - The groups you want to see, such as teams or sites (optional)
you_get:
  - An adoption brief that says what you can show and what you cannot
  - A list of barriers, each tagged as awareness, training, ability, reinforcement or policy concern
  - Groups held back because they are too small to stay anonymous
  - A follow-up support plan with an action, an owner, a date and a check for each barrier
  - A list of missing facts and checks that did not run
how_to_use:
  - Download the pack and add it to your AI, such as Claude, ChatGPT or Gemini.
  - Remove names and any detail that points to one person before you paste feedback. The AI does not do this for you.
  - Paste the policy, the start date, the feedback and any usage records. Say the smallest group you may report on.
  - After step 1, check the claims. A line like "staff understand it" needs usage or compliance evidence, not just kind comments.
  - Share the support plan with the policy owner. Send them the policy concerns as they are.
how_it_works:
  - title: Employee survey designer
    text: Reads the feedback within its sample limits and keeps anonymity. Tags each barrier and separates real feedback from guesses about adoption. Holds back small groups. Hands step 2 the barriers with counts. Check before moving on, no group below the limit is reported.
  - title: Change rollout planner
    text: Turns each barrier into an action for awareness, training, ability or reinforcement, with an owner and a date. Changes no policy or live process. Hands back the plan.
  - title: Check and hand back
    text: Writes the adoption brief from the evidence, lists what you can and cannot claim and marks every gap.
output_shape: |-
  ADOPTION BRIEF
    <policy, effective date, evidence used and sample, what the evidence shows, what it cannot show>
  BARRIERS
    <barrier | tag: awareness, training, ability, reinforcement or policy concern | how many | which groups>
  POLICY CONCERNS <concerns for the policy owner, passed on unchanged>
  SUPPORT PLAN
    <action | barrier | audience | owner | date | how you will check it worked>
  WITHHELD <groups too small to report>
  MISSING <each gap and the part it stops>
  CHECKS MISSED <one line each, or none>
output_sample:
  input:
    - "The approved policy change and its effective date"
    - "Staff feedback with names removed"
    - "Training or usage evidence (optional)"
    - "Your privacy rules, including the smallest group you may report on"
  prerequisites:
    - "An AI that can read files or long pasted text"
  output:
    - name: "Adoption brief"
      contains: "What the evidence shows, what it cannot show, and which claims each kind of evidence supports."
    - name: "Barriers"
      contains: "Each barrier tagged as awareness, training, ability, reinforcement or policy concern, with counts."
    - name: "Policy concerns"
      contains: "Concerns about the policy itself, passed to the policy owner unchanged."
    - name: "Support plan"
      contains: "An action for each barrier, with an owner, a date and a check."
    - name: "Withheld groups"
      contains: "Groups too small to report without identifying people."
tweaks:
  - what: One policy
    how: Review one policy per run. A second policy needs its own evidence and its own barriers.
  - what: Group size
    how: Say your smallest reportable group. If you do not, the AI uses 5 and labels it as an assumption you can change.
  - what: Timing
    how: Say how many weeks the policy has been live. A policy two weeks old needs different claims than one six months old.
judge:
  - Attendance and positive feedback do not prove compliance; small-group privacy and policy exceptions remain protected.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Run it again after each support action, with new feedback, to see which barriers shrink.
  - Add a simple count your team already keeps, such as forms filed or tickets raised, so claims rest on behaviour.
  - Keep each brief so the next run can compare the same barriers over time.
works_best_with:
  tools:
    - name: A chat AI that reads files
      why: It reads the policy and the feedback together. Nothing is sent or changed for you.
  inputs:
    - A usage or compliance count from your own systems.
    - Your data rules, such as how long staff feedback may be kept.
terms:
  - term: Adoption
    meaning: Staff doing what the policy asks in their daily work, not just knowing about it.
  - term: Barrier
    meaning: A reason people are not following the policy, such as not knowing about it or not having the tool.
  - term: Small-group privacy
    meaning: Holding back results for a group so small that the answers could point to one person.
  - term: Handoff
    meaning: The checked file one step passes to the next.
