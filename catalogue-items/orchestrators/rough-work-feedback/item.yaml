slug: rough-work-feedback
name: "Get honest notes on rough work and a fix plan"
summary: "Give it rough work and your reviewers. Get a safe review, sharp problem notes and a plan to fix it."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: question, required: true}
  - {type: copy_draft, required: false}
  - {type: feedback_notes, required: true}
outputs:
  - {type: plan}
uses: [peer-feedback-session-planner, good-note-sharpener, problem-root-cause-tracer, revision-headline-planner]
steps:
  - {uses: peer-feedback-session-planner, note: "Starts from your project, where it is stuck and the people who could review it. Who sits in the room, who stays quiet first, and the rule that notes name problems and not fixes."}
  - {uses: good-note-sharpener, note: "Follows the pause. Takes the comments you wrote down in the session, with who said each. Raw comments rewritten as specific problem notes, with fixes marked as examples only."}
  - {uses: problem-root-cause-tracer, note: "Takes the problem notes from step 2 and the work. Each problem traced to its likely cause, with the notes that may have pointed at the wrong symptom."}
  - {uses: revision-headline-planner, note: "Takes the causes from step 3, with the problem notes from step 2 and the session plan from step 1. Three to five headlines, what to blow up and what to keep, and the date of the next look."}
origin: rebuilt
version: 1.0.0
minds: [ed-catmull]
credits:
  - {title: "Creativity, Inc.", by: "Ed Catmull with Amy Wallace", used: "The order of the steps: plan a review session where peers tell the truth, turn raw comments into good notes, find what is really causing each problem, headline the notes and plan the next version"}
