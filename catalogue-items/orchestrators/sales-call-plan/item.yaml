  - {type: objection_map, required: false}
  - {type: voc_reviews, required: false}
  - {type: question, required: false}
outputs:
  - {type: copy_draft}
uses: [buyer-matched-argument-planner, ten-second-opener-writer, objection-answer-sheet-writer, ask-which-closing-planner]
steps:
  - {uses: buyer-matched-argument-planner, note: "Which argument leads for each buyer and what to ask first. Hands the angle library to steps 2 and 3"}
  - {uses: ten-second-opener-writer, note: "A ten-second opener and two spares, as short honest questions. Built from the angle library in step 1. The opener goes to you, not to the next step"}
