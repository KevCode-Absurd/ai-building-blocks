slug: screen-a-startup-deal-from-first-look-to-committee-memo
name: "Screen a startup deal from first look to committee memo"
summary: "Give it the pitch and the numbers. Get a diligence review, a valuation range and the committee memo."
category: orchestrator
type: workflow
role: orchestrate
job: analysis
level: advanced
inputs:
  - {type: source_text, required: true}
  - {type: brief, required: true}
  - {type: question, required: false}
outputs:
  - {type: document}
  - {type: audit_report}
uses: [startup-due-diligence-reviewer, early-stage-valuation-estimator, deal-screening-memo-writer, investment-committee-memo]
steps:
  - {uses: startup-due-diligence-reviewer, note: "Team, market, product and traction as a diligence lead would see them, the claims that need checking and the questions to ask the founders. Hands the review to step 2."}
  - {uses: early-stage-valuation-estimator, note: "A valuation range for this stage with the method shown, so the founder's number is one input among several. Takes the review from step 1 and your asking terms, and hands the range to step 3."}
  - {uses: deal-screening-memo-writer, note: "A short memo with a clear call: pass, proceed or wait for a named piece of evidence, and the three facts the call rests on. Takes the review and the range and hands the screening memo to step 4."}
  - {uses: investment-committee-memo, note: "The committee memo: the case for, the strongest case against, the terms, the risks and what would change your mind. Takes the screening memo, the range and your deal documents. Only drafted if the call was proceed."}
origin: own
version: 1.0.0
example_pending: true
