uses: [product-differentiation-checker, selling-proposition-finder, usp-claim-checker, claim-demonstration-planner, ad-distraction-checker]
steps:
  - {uses: product-differentiation-checker, note: "A verdict on whether the product has a difference a buyer can notice, or needs work first."}
