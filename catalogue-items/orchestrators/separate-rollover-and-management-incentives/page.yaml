how_it_works:
  - title: Rollover equity ownership checker
    text: Reconcile seller cash and same-class purchased ownership using the actual rollover election; stop if sponsor and seller securities differ.
  - title: Deal funding gap checker
    text: Map the rollover amount once as a noncash source against full equity purchase use, alongside actual sponsor cash and usable financing. Do not reduce purchase use by rollover again.
  - title: Management equity hurdle checker
    text: Keep the incentive award separate from purchased equity. Use a separately sourced net equity exit scenario, fixed hurdle and vested percentage; do not call its residual percentage current voting ownership.
output_shape: |-
  Seller cash and purchased ownership, funds-flow classification and a separate incentive payout scenario.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Purchased rollover ownership and incentive participation never share a denominator or get presented as the same economic right.
judge:
  - Purchased rollover ownership and incentive participation never share a denominator or get presented as the same economic right.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
