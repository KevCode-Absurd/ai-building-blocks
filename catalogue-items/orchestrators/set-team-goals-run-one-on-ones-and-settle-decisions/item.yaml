slug: set-team-goals-run-one-on-ones-and-settle-decisions
name: Set team goals, run one-on-ones and settle decisions
summary: Describe your team and the quarter. Get goals with dated key results, a
  one-on-one plan and a way to settle disputes.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - okr-goal-writer
  - one-on-one-meeting-planner
  - informed-captain-decisions
steps:
  - uses: okr-goal-writer
    note: Turns what you want into a few short goals for the period. Gives each one
      dated key results that can be marked done or not done.
  - uses: one-on-one-meeting-planner
    note: Uses the goals to set how often to meet each person, how long, and what
      they bring. Adds a follow-up routine so actions get checked.
  - uses: informed-captain-decisions
    note: Takes the goals and your stuck decision. Names one owner, collects the
      best case against, sets a date and says what everyone does after the call.
origin: rebuilt
credits:
  - title: High Output Management
    by: Andy Grove
    url: https://en.wikipedia.org/wiki/High_Output_Management
    used: Pairing a direction with measurable checkpoints, keeping the number of
      objectives small, short review periods, and linking each person's goals to
      the level above
  - title: Netflix Culture
    by: Netflix
    url: https://jobs.netflix.com/culture
    used: Giving one informed person the call, gathering the strongest case against,
      and the habit of disagreeing in the open and then committing
version: 1.0.0
example_pending: true
