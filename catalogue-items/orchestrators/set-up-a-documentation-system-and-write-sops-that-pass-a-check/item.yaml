slug: set-up-a-documentation-system-and-write-sops-that-pass-a-check
name: "Set up a documentation system and write procedures that pass"
summary: "Give it how your team works. Get a documentation system, procedures, runbooks and a check of each."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: question, required: true}
  - {type: document, required: false}
outputs:
  - {type: plan}
  - {type: document}
  - {type: audit_report}
uses: [documentation-system-planner, process-and-sop-writer, on-call-runbook-writer, sop-and-runbook-checker]
steps:
  - {uses: documentation-system-planner, note: "Where documentation lives, how pages are named, who owns each, how often it is reviewed and how a stale page is caught."}
  - {uses: process-and-sop-writer, note: "A standard procedure for each repeat task: the steps in order, who does each, what good looks like and what to do when a step fails. Takes the system plan from step 1."}
  - {uses: on-call-runbook-writer, note: "A runbook for each thing that breaks: the signs, what to check in order, the fix, who to call and when to stop and escalate."}
  - {uses: sop-and-runbook-checker, note: "Each procedure and runbook followed as a newcomer would, step by step, with every place they would get stuck, need to ask or find a missing step. Takes the procedures from step 2 and the runbooks from step 3."}
