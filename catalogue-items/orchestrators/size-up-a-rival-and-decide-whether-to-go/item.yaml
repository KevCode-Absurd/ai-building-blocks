slug: size-up-a-rival-and-decide-whether-to-go
name: Size up a rival and decide whether to go
summary: Describe your plan and a rival. Get a five-factor matchup, where to
  fight and avoid, and a go or no-go check.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - rival-matchup-scorer
  - go-or-no-go-launch-checker
steps:
  - uses: rival-matchup-scorer
    note: Scores you and the rival on five factors, ranks your options and finds
      where the rival is thin. Prices the cost and length of a long fight.
  - uses: go-or-no-go-launch-checker
    note: Takes the matchup and your plan and checks it for six common faults. Then
      checks that your team is ready, the rival is open and the ground allows
      it. Ends with go or no-go.
origin: rebuilt
credits:
  - title: The Art of War, Lionel Giles translation (1910)
    by: Sun Tzu
    url: https://www.gutenberg.org/ebooks/132
    used: The five factors to compare two sides, the seven questions, the ranking of
      ways to win, and the cost of a long contest
version: 1.0.0
example_pending: true
