slug: sort-decisions-by-how-reversible-they-are-and-fund-long-shots
name: Sort reversible decisions and plan small bets
summary: Paste a choice you are stuck on. Get it sorted by reversibility, a
  capped long-shot test and a keep-or-cut review.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - reversible-decision-sorter
  - long-shot-bet-planner
  - program-keep-or-cut-reviewer
steps:
  - uses: reversible-decision-sorter
    note: States the choice and asks what would be hard to undo. Sorts it as a
      one-way or two-way door and picks the process that fits.
  - uses: long-shot-bet-planner
    note: Takes the sorted choice and plans a small test. Sets the odds, the payoff,
      the most you can lose and what counts as learning if it fails.
  - uses: program-keep-or-cut-reviewer
    note: After your test, lists each program with its cost and return. Checks
      customer signals before the numbers, and marks each keep, cut or double
      down.
origin: rebuilt
credits:
  - title: 2015 Letter to Shareholders
    by: Jeff Bezos, Amazon
    used: Sorting decisions by whether they can be undone, and matching the speed
      and weight of the process to the answer
  - title: 1997 Letter to Shareholders (reprinted in the 2015 letter)
    by: Jeff Bezos, Amazon
    used: Making bold bets where the upside is large, and being plain about the
      price of failing
  - title: Fire Bullets, Then Cannonballs
    by: Jim Collins
    url: https://www.jimcollins.com/concepts/fire-bullets-then-cannonballs.html
    used: Running cheap, low-risk tests first to find how far off your aim is, and
      committing big only after
  - title: 2007 Letter to Berkshire Hathaway Shareholders
    by: Warren Buffett
    url: https://www.berkshirehathaway.com/letters/2007ltr.pdf
    used: The four tests for a business, and sorting businesses by how much new
      money they need to grow their earnings
version: 1.0.0
example_pending: true
