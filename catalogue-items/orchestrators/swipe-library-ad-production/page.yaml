new_slug: swipe-library-ad-production
name: Swipe library ad builder
summary: Choose reference layouts, rebuild them with real product photos and live type, then review checked ads in multiple sizes.
job: make-image-ads
headline: Swipe library ad builder
subhead: Turn selected reference layouts into finished ads with a traceable claim and revision record.
explain: A production workflow for a user-supplied or cleared swipe library. It keeps reference selection, source adaptation, layered construction and per-size QA together.
when:
  - You have a swipe library and want finished ads from selected layouts.
  - You need a review deck with revisions tracked by ad and size.
not_for:
  - "You have no reference ads, only your own: use the Brand ad remix designer."
  - "You want new image ads in the style your winners share: use Image ad style and concept planner."
  - "You want one ad built on an offer: use Meta offer image ad planner."
  - "You only want a product photo set: use the Reference-based product photoshoot planner."
output_sample:
  input:
    - Your brand facts, logo, fonts, live offers and approved claims
    - Real photos of the exact product variant
    - Reference ads you have the right to study, with any direction for each
    - The ad sizes you want, if not 4:5 and 9:16 (optional)
  prerequisites:
    - An AI that can read files and build web pages, or an AI plus a design tool you can use yourself
    - Your Org context, if you have one
  output:
    - name: brand.json
      contains: Your name, colours, fonts, logo, product photos, approved claims, blocked claims and current offer.
    - name: Reference index and selection
      contains: Each reference with a stable ID, format, message device and risk, and who picked it, you or the AI.
    - name: Adaptation map
      contains: For each reference, what to keep, swap or drop, plus any claim that cannot move to your brand.
    - name: Ad briefs
      contains: One brief per ad with the buyer problem, one supported message, on-image words and layout zones.
    - name: Editable ad files and exports
      contains: Ads with live text and logo layers, exported at 1080x1350 and 1080x1920 where your tools allow.
    - name: Review deck, QA log and revision manifest
      contains: Each ad and size with a version, a check status and the corrections you asked for.

you_give:
  - Brand facts, live offers, approved claims, logo and fonts.
  - Real photos of the exact product variant.
  - Reference layouts you have permission to study, with any directions for each.
you_get:
  - A selectable reference index and adaptation map.
  - Editable compositions and approved-size exports where tools permit.
  - A review deck, QA log and revision manifest.
how_to_use:
  - Download the complete pack and give its instructions to your AI.
  - Provide the inputs listed here. Ask the AI to follow the method and return the stated outputs.
  - Check the result against the supplied facts before using it.
  - After the review deck is approved, hand the approved exports and the revision manifest to your publishing tool. Check each size before you publish.
how_it_works:
  - title: Choose layouts
    text: Index the references, keep user selections stable and capture per-ad direction.
  - title: Rebuild with real assets
    text: Translate layout devices into true brand claims and composite text separately from imagery.
  - title: Inspect every size
    text: Render, check, fix and show a versioned review deck before any publishing.
thinking: high
thinking_why: It compares supplied evidence and follows a specific method.
