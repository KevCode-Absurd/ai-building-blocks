slug: tailor-a-job-application-to-real-evidence
name: Tailor a job application to real evidence
summary: Match your resume to a job post using only what you really did. Get a
  tailored resume draft, application answers and a final proofread.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: document
    required: false
  - type: source_text
    required: false
outputs:
  - type: document
  - type: copy_draft
  - type: feedback_notes
uses:
  - resume-job-application-builder
  - plain-english-editor
  - proofreader
steps:
  - uses: resume-job-application-builder
    note: Match the role requirements to actual experience and draft the requested
      application materials. Hands step 2 the draft resume and answers (a
      document), with the evidence behind each line and the gap list.
  - uses: plain-english-editor
    note: Makes step 1's draft specific and easy to scan while preserving the
      evidence and your voice. Hands step 3 the edited draft and the list of
      changes.
  - uses: proofreader
    note: Takes step 2's edited draft as the text to check. Checks names, dates,
      consistency, requested format and any remaining unsupported claims, and
      hands back the final draft.
