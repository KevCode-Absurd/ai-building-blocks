new_slug: tailor-a-job-application-to-real-evidence
name: Tailor a job application to real evidence
headline: Tailor a job application to real evidence
summary: Match your resume to a job post using only what you really did. Get a tailored resume draft, application answers and a final proofread.
job: find-a-job
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Paste the job post and your current resume, plus notes on real work you have done. Your AI matches the job's needs to your actual experience, tightens the writing and proofreads it. You get a resume draft and answers to the application questions.
explain: |-
  Tailoring a resume should mean choosing which true things to show first. It should not mean adding skills because the post asks for them. This workflow ties every line it writes to something in your own records.

  Step one matches the job's needs to your experience and drafts the resume and any application answers. Step two makes the writing plain and easy to scan. Step three proofreads names, dates and format, and flags any line that lost its support on the way.

  If the job wants something you have not done, the draft says so in a gap list and you decide what to do. Nothing here applies for you or sends anything.
when:
  - A job post asks for five things and your resume lists them in a different order.
  - The application has two or three short-answer questions, such as 'why this role?'
  - You have the right experience, but your resume describes an older job.
  - A recruiter said your resume does not match the post, and you think it does.
not_for:
  - You are preparing for the interview itself. Use Job interview work-example coach.
  - You want to build a resume from scratch with no work records. Use the Resume and job application builder on its own.
  - You only want spelling and grammar fixed. Use the Proofreader.
  - You are applying to many jobs at once. Run this once per job, because each needs its own match.
you_give:
  - The job post, copied in full (from the company site or job board)
  - Your current resume, as a file or pasted text
  - Notes on real work that is not on the resume, such as projects and results (optional)
  - The application questions and word limits (from the form)
  - Anything that must not change, such as job titles or dates (optional)
you_get:
  - A tailored resume draft where each achievement links to your own record
  - Answers to each application question, within the word limit
  - "A gap list: what the job asks for that your records do not show"
  - A proofread check of names, dates and format, with fixes listed
  - A summary and one next step
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini.
  - Paste the job post, then your resume, then your work notes and the application questions.
  - "Say: follow the workflow file, save each step, and stop if a check fails."
  - Read the gap list first. Add facts you left out, or accept the gap.
  - Compare every number, title and date in the draft with your own records.
  - Copy the final text into your own file and apply yourself. This does not send anything.
output_sample:
  input:
    - The job post
    - Your current resume
    - Notes on real work (optional)
    - The application questions and word limits
  prerequisites:
    - An AI that can read files or long pasted text
  output:
    - name: step-01-resume-job-application-builder.md
      contains: Tailored resume draft, application answers and a gap list, each line tied to your records.
    - name: step-02-plain-english-editor.md
      contains: The same draft in plain, scannable wording, with each change listed.
    - name: step-03-proofreader.md
      contains: Corrections to names, dates and format, and any line still lacking support.
    - name: Hand-back summary
      contains: Files saved, missing facts, checks not run and one next step.
how_it_works:
  - title: Resume and job application builder
    text: Matches the job's needs to your real experience and drafts the resume and answers. Hands step 2 the draft, the evidence behind each line and the gap list.
  - title: Plain English editor
    text: Makes the draft specific and easy to scan, in your voice. Hands step 3 the edited draft and a list of what changed.
  - title: Proofreader
    text: Checks names, dates, consistency and format, and flags any line that lost its support. Hands back the final draft and the fixes.
output_shape: |-
  JOB <title, company>, SOURCES <list>

  RESUME DRAFT    <section>: <line> [source: <your record>]
  APPLICATION ANSWERS  <question> (<word limit>): <answer>
  GAP LIST        <what the job asks for> | not shown in your records
  CHANGES         <original> -> <edit> | <reason>
  PROOFREAD       <name, date or format issue> | <fix>

  MISSING        <each gap>
  CHECKS MISSED  <one line each, or none>
  NEXT STEP      <one action>
tweaks:
  - what: Length
    how: Say if the resume must fit one page. The AI cuts the weakest lines first and tells you what it cut.
  - what: Role change
    how: If you are changing field, add notes on side projects or volunteer work. They can fill gaps the resume does not show.
  - what: Voice
    how: Paste a short note you wrote yourself. The edit keeps your way of putting things.
judge:
  - Every achievement is supported by your record; no experience, credential or metric is invented.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep the tailored resume and the gap list. When the next post comes, change only what the new post asks for.
  - Add a line to your work notes each time you finish something. The next run has more to draw on.
works_best_with:
  tools:
    - name: Any good chat AI that reads files, such as Claude, ChatGPT or Gemini
      why: It must hold the job post, your resume and your notes at once.
  inputs:
    - Reviews or thank-you notes from managers or clients
    - A list of tools and systems you have used, with years
    - The company's own wording from its careers page
    - Last two job descriptions from your own employers
terms:
  - term: Gap list
    meaning: What the job asks for that your records do not show.
  - term: Evidence
    meaning: A record of your own work, such as a project note or a result you can show.
