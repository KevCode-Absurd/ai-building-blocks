slug: test-a-story-idea-check-every-scene-turns-and-strip-the-voice-over
name: Test a story and fix its scenes and narration
summary: Paste your story idea. Get a premise verdict, every scene marked for
  what changes, and a line-by-line voice-over test.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - story-premise-tester
  - scene-turn-checker
  - voice-over-stripping-test
steps:
  - uses: story-premise-tester
    note: Puts the story in one sentence, names the idea it proves and the idea that
      argues back. Checks the idea can grow to the end and gives a verdict.
  - uses: scene-turn-checker
    note: Goes through your scenes in order using the idea from step 1. Writes down
      what changes in each scene, which choice causes it and what it costs the
      character.
  - uses: voice-over-stripping-test
    note: Takes your script and removes all narration. Judges whether the story
      still works, then sorts each line as telling or adding something new.
origin: rebuilt
credits:
  - title: Story webinar series, course outline
    by: Robert McKee
    url: https://mckeestory.com/webinars/story
    used: Stating the premise, the controlling idea and the counter idea, and
      testing whether the idea can carry a whole story
  - title: Story
    by: Robert McKee
    url: https://mckeestory.com/books/story
    used: Outlining the main turns and flagging recycled formulas
  - title: Character
    by: Robert McKee
    url: https://mckeestory.com/books/character
    used: Pressure reveals true character, so a choice must cost the character
      something
  - title: A Study in Voice Over Narration from two recent films
    by: Robert McKee, 9 July 2012
    used: Taking out all narration, judging what is left, and keeping only lines
      that add a new layer
  - title: Stanley Kubrick interview
    by: Joseph Gelmis
    used: Letting the picture carry the feeling, cutting literal explanation and
      leaving room for the viewer's own reading
  - title: Stanley Kubrick interview with Playboy magazine, 1968
    by: Stanley Kubrick
    used: Watching a cut cold and trimming what does not belong
version: 1.0.0
example_pending: true
