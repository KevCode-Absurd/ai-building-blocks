  - Review assumptions, reconciliations and CHECKS MISSED before relying on the result.
how_it_works:
  - title: Retail markdown stock reconciler
    text: Reconcile old-cohort units, receipts, sold purchase cost and held stock cost memo. Pass remaining quantity and actual purchase-cost vintage, not a hypothetical replacement price. Preserve both sold-unit contribution and full-cohort cumulative purchase cash recovery; never use the unsold purchase-cost memo as new cash.
  - title: Commodity pass through cost bridge
    text: Model the future replenishment input-price and approved price-recovery scenario using the correct physical intensity. Present old-stock cash recovery and new-cohort margin as separate bridges with explicit timing and no assumed demand response.
output_shape: |-
  A stock recovery bridge and separate replenishment margin scenario.
  Scope and dated sources
  Inputs and assumptions
  Model calculations and reconciliations
  Actual file verification
  MISSING: and CHECKS MISSED
tweaks:
  - what: Period and currency
    how: Use the same calendar, currency and scale throughout matching inputs and outputs.
  - what: Assumptions
    how: Change supported inputs and recalculate the actual model; preserve the supplied actuals.
  - what: Acceptance
    how: Historical stock keeps its original purchase basis; prospective input inflation is not applied retroactively to existing inventory cost. Sold-unit contribution and cumulative cash after the full original cohort purchase remain distinct; stock cannot be oversold.
judge:
  - Historical stock keeps its original purchase basis; prospective input inflation is not applied retroactively to existing inventory cost. Sold-unit contribution and cumulative cash after the full original cohort purchase remain distinct; stock cannot be oversold.
  - "Trace each material input to its source, date, currency, scale, sign and reporting period. Retain unresolved MISSING: lines."
  - Reconcile opening balances, additions, deductions and closing balances. Match enterprise or equity cash flows to the corresponding discount rate.
  - Keep hardcoded inputs separate from live formulas. Inspect changed inputs, actual recalculation, exported formulas and saved-file reopening.
test:
  - Try a small sourced case and inspect every component handoff.
  - Remove one required source and confirm the affected step stops.
  - Change a currency, date or accounting definition and check the conflict stays visible.
improve:
  - Add a dated approved example and your actual acceptance rules.
  - Record corrections with the affected source and model version.
