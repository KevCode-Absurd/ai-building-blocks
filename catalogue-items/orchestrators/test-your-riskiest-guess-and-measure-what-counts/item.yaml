slug: test-your-riskiest-guess-and-measure-what-counts
name: Test your riskiest guess and measure what counts
summary: Give it your idea and results. Get a small test, useful measures and
  the cause of a miss.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - small-launch-test-planner
  - vanity-metric-fixer
  - five-whys-session-planner
steps:
  - uses: small-launch-test-planner
    note: Lists the guesses your idea depends on and picks the riskiest. Designs the
      smallest test, sets the pass numbers and a rule for changing direction.
  - uses: vanity-metric-fixer
    note: Takes your test results and the plan from step 1. Marks the vanity numbers
      and swaps each for a rate per customer or group.
  - uses: five-whys-session-planner
    note: If the result missed, asks why of what you saw, then why of that answer,
      until it reaches a cause you can fix. Checks each answer against facts.
origin: rebuilt
credits:
  - title: Scientific Advertising (1923)
    by: Claude C. Hopkins
    used: Testing a plan in a few typical places before a full launch, recording
      cost per customer and repeat buying, and deciding the roll-out rule in
      advance
  - title: Why vanity metrics are dangerous
    by: Eric Ries
    url: https://www.startuplessonslearned.com/
    used: Replacing totals with per-customer rates, splitting by group and tying
      numbers to action
  - title: "2013 Annual Letter: Measuring Progress"
    by: Bill Gates, Gates Foundation
    used: Setting a clear goal, picking what to measure and checking the data behind
      it
  - title: "The Lean Startup: how today's entrepreneurs use continuous innovation to
      create radically successful businesses"
    by: Eric Ries
    url: https://theleanstartup.com/
    used: "Setting up a five whys review: a narrow trigger, everyone affected in the
      room, a moderator with authority, the two simple rules, and what to do
      when it turns into blame"
version: 1.0.0
example_pending: true
