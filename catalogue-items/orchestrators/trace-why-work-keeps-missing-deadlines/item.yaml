slug: trace-why-work-keeps-missing-deadlines
name: Trace why work keeps missing deadlines
summary: "Find where repeated work waits and why deadlines slip. Get a delay map, causes backed by your records and one small fix to test."
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: spreadsheet
    required: true
  - type: brief
    required: false
  - type: document
    required: false
outputs:
  - type: audit_report
  - type: plan
uses:
  - process-bottleneck-finder
  - outside-view-timeline-estimator
  - change-rollout-planner
steps:
  - uses: process-bottleneck-finder
    note: "Split each stage into working and waiting time, count rework and rank the bottlenecks. Pass the ranked list and the finished jobs with estimate and real finish to step 2 as the delay map."
  - uses: outside-view-timeline-estimator
    note: "Compare each finished job's estimate with its real time. Show the median overrun, the range and the number of jobs used, and pass them to step 3. Uses the finished jobs from your own records, as step 1's delay map lists them."
  - uses: change-rollout-planner
    note: "Plan one change aimed at the top repeated bottleneck, with an owner, a starting number, a review date and a success check. Uses step 1's top repeated bottleneck and step 2's typical overrun as its starting numbers."
