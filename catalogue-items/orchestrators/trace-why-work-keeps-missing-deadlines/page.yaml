new_slug: trace-why-work-keeps-missing-deadlines
name: Trace why work keeps missing deadlines
headline: Trace why work keeps missing deadlines
summary: Share the source files. Get a delay map, evidence-backed cause hypotheses and a small improvement test.
job: organise-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: A delay map, evidence-backed cause hypotheses and a small improvement test. Share repeated workflow records with stage owners, active and queue time, rework, observed timing ranges, original estimates and team capacity. Your AI prepares the work and marks any facts it cannot verify.
explain: |-
  A delay map, evidence-backed cause hypotheses and a small improvement test.

  Give your AI the source material listed below and install the complete pack. It uses the component skills in the stated order, saves each result and checks the handoff before continuing. The analysis uses comparable repeated work and separates waiting time from active work; missing stage timing leads to an instrumentation plan. Missing tools or evidence stay visible in the final summary.
when:
  - You need a delay map, evidence-backed cause hypotheses and a small improvement test.
  - The relevant facts are spread across files or notes and need one consistent review.
  - You want the work and its checks saved so another person can review it.
you_give:
  - Repeated workflow records with stage owners, active and queue time, rework, observed timing ranges, original estimates and team capacity.
  - The intended reader, deadline and limits on what may be changed.
  - Earlier work and approved examples, if available.
  - "Available tools for the finished output: The bundled Python process tools."
you_get:
  - A delay map, evidence-backed cause hypotheses and a small improvement test.
  - Step files with evidence, unresolved facts and actual checks completed.
  - A hand-back summary and one practical next step.
how_to_use:
  - Download the complete pack and add its governing file and component skills to your AI.
  - Share the sources listed above and say which result you need.
  - Ask the AI to follow the governing file, save each result and stop on a failed required check.
  - Review the files, missing facts and proposed actions before using the result.
how_it_works:
  - title: Process bottleneck finder
    text: Map where the supplied work waited and which dependencies repeatedly delayed completion.
  - title: Outside view timeline estimator
    text: Compare estimates with similar completed work and show the range and sample limits.
  - title: Change rollout planner
    text: Plan adoption of one bounded process change with an owner, measured baseline, review date and success check.
output_shape: |-
  Scope and source coverage
  A delay map, evidence-backed cause hypotheses and a small improvement test.
  Step files and evidence references
  Unresolved facts and checks missed
  Proposed next action and approval status
tweaks:
  - what: Scope
    how: Choose one project, team, period or decision so the sources are comparable.
  - what: Evidence
    how: Provide the actual records and their dates rather than a summary from memory.
  - what: Acceptance
    how: The analysis uses comparable repeated work and separates waiting time from active work; missing stage timing leads to an instrumentation plan.
judge:
  - The analysis uses comparable repeated work and separates waiting time from active work; missing stage timing leads to an instrumentation plan.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
works_best_with:
  tools:
    - name: The bundled Python process tools
      why: Meaningful bottleneck estimates need measured stage owners, active/wait times and repeated-work evidence.
  inputs:
    - Approved examples of a good result.
    - A named reviewer and their acceptance rules.
terms:
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
