slug: track-promises-made-to-pilot-customers
name: Track promises made to pilot customers
summary: List what you promised each pilot customer, who owns it and the proof
  it is done. Get a promise register, clashes and update drafts.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
