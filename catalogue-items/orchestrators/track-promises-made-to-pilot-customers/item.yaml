  - type: copy_draft
  - type: document
uses:
  - executive-action-register
  - stakeholder-update-writer
steps:
  - uses: executive-action-register
    note: Extract explicit accepted customer commitments with source IDs, owner and
      due-date gaps, dependencies and evidence needed for completion. Hands step 2 the promise register (a plan).
  - uses: stakeholder-update-writer
    note: Draft changed-only customer or internal updates using the actual
      commitment status and approved product scope; avoid promising unapproved
      features or dates. Uses step 1's register for each promise's status, with
      the customer messages and what changed since the last update as its
      source.
