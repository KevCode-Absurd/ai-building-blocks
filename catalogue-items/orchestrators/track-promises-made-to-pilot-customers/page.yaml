new_slug: track-promises-made-to-pilot-customers
name: Track promises made to pilot customers
headline: Track promises made to pilot customers
summary: List what you promised each pilot customer, who owns it and the proof it is done. Get a promise register, clashes and update drafts.
job: help-customers
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Share your pilot agreements, notes from customer calls you have permission to use, and what you have delivered so far. Your AI lists each accepted promise with its owner, date and proof of delivery, flags clashes, and drafts updates that only mention what changed.
explain: |-
  During a pilot, promises pile up in emails and calls. 'We will add that next month' becomes a commitment in the customer's mind, whether or not you agreed to it.

  Step one reads your sources and lists only promises you clearly accepted. Each gets a source, an owner, a due date or a gap, what it depends on and what proof would show it is done. Step two drafts updates that report changes only and stay inside what your product can do today.

  A request or a sales hint is not a promise. It goes on a separate list for you to decide. A promise counts as done only when you can show delivery, not when someone says it is done.
when:
  - Three pilot customers each asked for a feature and nobody remembers what you agreed.
  - You are about to send a pilot check-in and do not know what is overdue.
  - Two customers were promised things that clash.
  - The founder who ran the calls is leaving and handing over.
not_for:
  - You want action items from internal meetings. Use the Action item tracker keeper.
  - You are answering one complaint. Use the Customer reply promise checker.
  - You need a go or no-go on the pilot itself. Use AI pilot decision checker.
  - You have no written record of what was said. Gather notes first, as this cannot recall calls.
you_give:
  - Pilot agreements or order forms, as files or pasted text
  - Notes or transcripts of customer calls, only where the customer agreed to share them (optional)
  - What you have delivered so far, with links or dates
  - Who owns each customer
  - What your product can and cannot do today
you_get:
  - "A promise register: each accepted promise with source, owner, due date, dependency and proof needed"
  - A list of requests and sales statements not yet accepted
  - Clashes between promises, and promises with no owner or date
  - Update drafts for each customer showing only what changed
  - A summary and one next step
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini.
  - Paste or attach the pilot agreements, then call notes, then your delivery records.
  - "Say: follow the workflow file, list only accepted promises and mark missing owners and dates."
  - "Read the 'not yet accepted' list. Decide on each item: accept it, decline it or ask the customer."
  - Check each 'done' promise has proof you can show.
  - Send the updates yourself after the account owner reads them.
output_sample:
  input:
    - Pilot agreements or order forms
    - Customer call notes you may use (optional)
    - What you have delivered so far
    - What your product can do today
  prerequisites:
    - Customer agreement to use any call notes
  output:
    - name: step-01-executive-action-register.md
      contains: Register of accepted promises with source, owner, due date, dependency and proof needed.
    - name: step-02-stakeholder-update-writer.md
      contains: Customer and team update drafts that report changes only and stay within the product's limits.
    - name: Hand-back summary
      contains: Files saved, requests not yet accepted, gaps, checks not run and one next step.
how_it_works:
  - title: Executive action register keeper
    text: Lists each accepted promise with source, owner, due date and proof needed, and sets aside requests not accepted. Hands step 2 the register with its status.
  - title: Stakeholder update writer
    text: Drafts updates showing only what changed, inside what your product can do today. Hands back drafts for each customer and for your team.
output_shape: |-
  PILOT CUSTOMERS <list>, SOURCES <list>

  PROMISE REGISTER  <customer> | <promise> | <source> | <owner or MISSING> | <due date or MISSING> | <depends on> | <proof needed> | <status>
  NOT YET ACCEPTED  <customer> | <request or sales statement> | <source>
  CLASHES           <promise A> vs <promise B>
  UPDATE DRAFTS     <customer>: <changes since last update>

  MISSING        <each gap>
  CHECKS MISSED  <one line each, or none>
  NEXT STEP      <one action>
tweaks:
  - what: Reporting date
    how: Give the date of the last update to each customer. Drafts then show only changes since then.
  - what: Product limits
    how: Paste your current feature list. Promises outside it are flagged before any update repeats them.
  - what: Audience
    how: Ask for a customer update, a team update or both. Detail and tone change.
judge:
  - A request or sales statement is not an accepted delivery commitment; completion needs actual delivery evidence.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep the register as your single list. Run this after each customer call to update it.
  - Add the date you showed proof for each finished promise.
works_best_with:
  tools:
    - name: Any good chat AI that reads files, such as Claude, ChatGPT or Gemini
      why: It needs agreements, notes and delivery records at once.
  inputs:
    - Your product roadmap with dates
    - Support tickets from pilot users
    - Call recordings or notes, with consent
    - Your pilot success criteria
terms:
  - term: Accepted promise
    meaning: A commitment your team clearly agreed to, in writing or on a call.
  - term: Proof of delivery
    meaning: Something you can show that the promise was kept, such as a release note or sign-off.
