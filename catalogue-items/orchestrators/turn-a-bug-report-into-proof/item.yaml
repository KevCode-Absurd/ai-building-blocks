slug: turn-a-bug-report-into-proof
name: Turn a bug report into proof
summary: Share a bug report and repo. Get a repeatable case, missing tests and a
  record of what is verified.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: brief
    required: true
  - type: codebase
    required: false
outputs:
  - type: document
uses:
  - copilot-bug-reproduction-brief
  - copilot-test-gap-audit
  - copilot-bug-receipt
steps:
  - uses: copilot-bug-reproduction-brief
    note: 1. Read skills/copilot-bug-reproduction-brief/SKILL.md. Share an unclear
      bug report. Get repeatable steps, a minimal case and the evidence still
      needed. Save the result with source references. Carry the user's goal and
      all earlier findings into this step. If required evidence or tool access
      is missing, mark this step blocked; do not fabricate a result. Hands its repeatable case to step 2, which uses it as the scope for the test gaps.
  - uses: copilot-test-gap-audit
    note: 2. Read skills/copilot-test-gap-audit/SKILL.md. Share your repo or change.
      Get missing, weak and stale tests ranked by the behavior at risk. Save the
      result with source references. Carry the user's goal and all earlier
      findings into this step. If required evidence or tool access is missing,
      mark this step blocked; do not fabricate a result. Hands the ranked gaps and the regression tests the fix needs to step 3, which checks them against the fix.
  - uses: copilot-bug-receipt
    note: 3. Read skills/copilot-bug-receipt/SKILL.md. Share a fix and its checks.
      Get a dated record of what is verified, partial or blocked. Save the
      result with source references. Carry the user's goal and all earlier
      findings into this step. If required evidence or tool access is missing,
      mark this step blocked; do not fabricate a result. Uses your fix and the test gaps from step 2, and hands back the dated record of what is verified.
origin: rebuilt
version: 1.0.0
