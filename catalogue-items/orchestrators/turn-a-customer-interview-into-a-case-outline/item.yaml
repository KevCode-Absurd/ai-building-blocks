slug: turn-a-customer-interview-into-a-case-outline
name: Turn a customer interview into a case outline
summary: Turn one customer interview into a case study outline, a list of gaps in the evidence and a checklist of what the customer must approve before you publish.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: source_text
    required: true
  - type: copy_draft
    required: false
outputs:
  - type: copy_draft
  - type: audit_report
  - type: document
uses:
  - customer-interview-synthesizer
  - case-first-story-builder
  - draft-proofreader
steps:
  - uses: customer-interview-synthesizer
    note: Split the interview into the problem, what the customer did and what they say changed. Keep a pointer to the moment in the interview for each point. Treat it as one case, not a pattern. Hand step 2 the tagged points.
  - uses: case-first-story-builder
    note: Build the case around the real decision and the change that followed. Mark any outcome the customer stated without evidence as unsupported. Hand step 3 the outline.
  - uses: draft-proofreader
    note: Edit the outline wording without writing the case study itself. Keep the source pointers. Hand back the outline and the approval checklist of every quote, number and detail the customer must OK.
