steps:
  - uses: customer-interview-synthesizer
    note: Separate the problem, actions and observed outcomes while preserving source references. One interview is one case, not evidence of a repeated customer pattern.
  - uses: case-first-story-builder
    note: Build the case around the actual decision and change, marking unsupported outcomes.
  - uses: draft-proofreader
    note: Edit the outline wording without inventing a finished case study. Preserve source locators and the separate factual and consent checks in the hand-back acceptance rules.
