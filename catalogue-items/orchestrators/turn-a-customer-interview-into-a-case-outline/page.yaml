new_slug: turn-a-customer-interview-into-a-case-outline
name: Customer interview case-study planner
headline: Customer interview case-study planner
summary: Share a consented customer interview, facts and result records. Get a sourced case outline, evidence gaps and a customer approval checklist.
job: write-and-tell-stories
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: It separates the customer's problem, actions and observed results, builds an outline and checks the wording. You get source links, dates and approval questions. One interview is one case. Quotes and identifying details need actual permission, and unsupported results stay out of the draft.
explain: |-
  A good customer interview can still make a weak case study. The customer says "sales doubled", you write it down, and later nobody can show where it came from. This workflow builds the case outline from what the customer really said, and shows the proof for each point.

  It works in three steps. First it splits the interview into the problem, what the customer did and what changed, with a pointer to each moment. Then it builds the outline around the real decision, and marks any outcome with no evidence as unsupported. Last it tidies the wording and builds an approval checklist: every quote, number and detail the customer must OK.

  One interview shows one case. It does not show a pattern across customers. The workflow does not write the final case study. That comes after the customer approves the checklist.
when:
  - You interviewed a customer and now need an outline before you write the case study
  - A customer claims a result, such as time saved, and you need to see what backs it
  - Sales or marketing asks for a customer story and legal needs to know what the customer approved
  - You want a checklist to send the customer so approval is clear and in writing
not_for:
  - You want to show a pattern across many customers. Use the Customer interview synthesizer on all the interviews, or Buyer research brief builder.
  - You want your own project turned into a portfolio piece. Use the Portfolio case study writer.
  - You want a talk or pitch built around one story. Use Case-based pitch and talk writer.
  - The customer has not agreed to be interviewed or quoted. Get that first. This workflow only works with consented material.
you_give:
  - The interview, as a transcript or notes. The customer must have agreed to it
  - Facts the customer has approved, such as name, role and company (optional)
  - Evidence for any result, such as numbers with their dates and where they came from (optional)
  - What the customer allowed you to publish, such as name, quotes and logo
  - Who will read the case study (optional)
you_get:
  - "A case outline: problem, decision, change and outcome, each point tied to a moment in the interview"
  - "Evidence gaps: each outcome with no proof, as a MISSING line"
  - "A customer approval checklist: every quote, number and detail they must OK before you publish"
  - A hand-back summary with one next step
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini and say "Follow HANDOFF.md".
  - Paste the interview. Add the approved facts, any result evidence and what the customer allowed you to publish.
  - Read the evidence gaps first. For each MISSING outcome, ask the customer for proof or cut the claim.
  - Send the approval checklist to the customer. Write the case study only after they reply.
how_it_works:
  - title: Customer interview synthesizer
    text: Separates the problem, the customer's actions and the outcomes they report. It keeps a pointer to each moment and treats the interview as one case. It hands on the tagged points.
  - title: Case-first story builder
    text: Builds the outline around the real decision and the change after it. It marks outcomes with no evidence as unsupported and hands on the outline.
  - title: Draft proofreader
    text: Tidies the outline wording without writing the finished case study. It keeps the source pointers and hands back the outline and the approval checklist.
output_shape: |-
  CASE OUTLINE
  Section (problem, decision, change, outcome) | What it says | Where in the interview | Status (supported, needs customer OK, unsupported)

  EVIDENCE GAPS
  Outcome stated | What is missing | Who can supply it

  CUSTOMER APPROVAL CHECKLIST
  Quote, number or detail | Where it will appear | Approved (yes, no, pending)

  HAND-BACK SUMMARY
  Files | MISSING lines | Checks missed | One next step
output_sample:
  input:
    - The interview, as a transcript or notes
    - Facts the customer approved, such as name and company (optional)
    - Evidence for any result (optional)
    - What the customer allowed you to publish
  prerequisites:
    - The customer's agreement to the interview and to being quoted
  output:
    - name: Case outline
      contains: The problem, the decision, the change and the outcome, each tied to a moment in the interview.
    - name: Evidence gaps
      contains: Each outcome with no proof, as a MISSING line, and who could supply it.
    - name: Customer approval checklist
      contains: Every quote, number and detail the customer must approve before you publish.
    - name: Hand-back summary
      contains: Files saved, MISSING facts, checks not done and one next step.
tweaks:
  - what: Scope
    how: Use one interview and one customer per run. Do not blend customers.
  - what: Evidence
    how: Give the real transcript and the dated numbers, not your memory of the call.
  - what: Acceptance
    how: Every outcome states its period and where it came from. Anything else is marked unsupported.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini with file support
      why: They read the full transcript and keep each step's result as a file. None of them can ask the customer for approval. You send the checklist.
  inputs:
    - A recording transcript with times, so each point can point to a moment.
    - The customer's own numbers, exported from their tool, with dates.
judge:
  - Results state period and basis; quotations and identifying details need the customer approval before publication.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
next:
  - portfolio-case-study-writer
  - build-a-talk-around-one-real-case
terms:
  - term: Case outline
    meaning: A plan of the story with its proof, before the full case study is written.
  - term: Unsupported
    meaning: A claim the customer made that no record you hold can back.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
