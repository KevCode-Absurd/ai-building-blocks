steps:
  - uses: everyday-usability-reviewer
    note: Review the supplied screen for discoverability, mapping, errors and feedback; label the findings as a heuristic review rather than real user test results.
  - uses: design-feedback-giver
    note: Turn the agreed issues into specific changes, keeping observations separate from preferences.
  - uses: small-usability-test-planner
    note: Write task-based checks for the changes, with neutral prompts and observable success criteria.
