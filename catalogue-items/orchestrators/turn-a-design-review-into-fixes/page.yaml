new_slug: turn-a-design-review-into-fixes
name: Turn a design review into fixes
headline: Turn a design review into fixes
summary: Review one screen or prototype and get a ranked issue list, a revised design brief with specific fixes and a usability test script to check them.
job: design-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it one screen or prototype, who uses it and the task they are trying to do. Your AI reviews it for confusing spots, turns each real issue into a specific change, and writes a test so you can check the fixes with people. You get an issue list, a revised brief and a test script.
explain: |-
  Design feedback often stops at "this feels cluttered". A designer then has to guess what to change. This workflow turns a review into fixes. Each fix names the problem it came from, the user task it affects and a way to check it worked.

  It runs three steps. First it reviews the screen for how easy it is to find what to do, see what happened, and recover from mistakes. Then it turns the agreed issues into specific changes and keeps what it saw apart from what it would prefer. Last it writes a small usability test for the changes, with neutral prompts and clear signs of success.

  The review is an expert-style check of the screen you share. It is not a test with real users, and the page says so. Only the test at the end shows if the fixes work.
when:
  - A teammate says this screen feels off and you need to turn that into changes you can ship.
  - A new checkout, settings or dashboard screen is about to go to developers and you want one more pass.
  - You have a design review with ten comments and need to know which three to fix first.
  - You want to prove a design change helped, not only that it looks better.
not_for:
  - You have real test results or customer complaints. Start from those with Customer complaint design researcher, or the Product ease of use checker for one repeated mistake.
  - You only want a quick score for a screen. Use the Everyday usability reviewer on its own.
  - You need to find what blocks a test before you run it. Use the Prototype usability test planner workflow.
  - You review a new screen every week. Use the Screen usability reviewer.
you_give:
  - One screen or prototype, as a screenshot, a Figma link or a clear description
  - The people who use it and the task they are trying to do
  - Limits on what can change, such as no new pages or a fixed component library
  - Existing feedback or comments on the design (optional)
  - Your design rules or principles (optional)
you_get:
  - An issue list where each issue names where it is on the screen, which user task it hurts and how serious it is
  - A revised design brief with a specific change for each agreed issue
  - A split between what was seen on the screen and what is only a preference
  - A usability test with tasks, neutral prompts and signs of success
  - One next step
how_to_use:
  - Download the workflow pack and add it to your AI, such as Claude, ChatGPT or Gemini. One that reads images works best.
  - Attach the screen and say who uses it and what task they are trying to do. Add any limits on what can change.
  - After step 1, read the issue list with your team. Delete issues you disagree with. The next step only uses the ones you keep.
  - After step 2, check each change points back to an issue. Remove any change with no issue behind it.
  - Run the test from step 3 with a few people before you call the fixes done.
how_it_works:
  - title: Everyday usability reviewer
    text: Reviews the screen for finding what to do, seeing what happened, fixing errors and matching controls. Labels the result as an expert-style review, not a test with real users. Hands step 2 the issue list with where each one is. Check before moving on, each issue points to a place on the screen.
  - title: Design feedback giver
    text: Turns the issues you agreed into specific changes. Keeps what it saw on the screen apart from what it would prefer. Hands step 3 the revised brief. Check before moving on, every change names the issue it fixes.
  - title: Small usability test planner
    text: Writes task-based checks for the changes, with neutral prompts and signs of success a watcher can see. Hands back the test script. Check before moving on, no task tells the person where to click.
output_shape: |-
  SCREEN       <name>, <who uses it>, <task>, <limits on change>

  ISSUES       <no.> | <where on the screen> | <what is wrong> | <user task hurt> | <severity> | <seen or preference>

  REVISED BRIEF <issue no.> -> <specific change> | <check that it worked>

  TEST SCRIPT  task <n> | <what the person tries> | finished when <rule> | stuck when <rule>

  MISSING      <each gap, and the line it stops>
  CHECKS MISSED <one line each, or none>
  NEXT STEP    <one action for you>
output_sample:
  input:
    - One screen or prototype, as a screenshot, link or description
    - Who uses it and the task they are trying to do
    - Limits on what can change (optional)
    - Existing review comments (optional)
  output:
    - name: Issue list
      contains: Each issue with where it is, the task it hurts, how serious it is and whether it was seen or is a preference.
    - name: Revised design brief
      contains: A specific change for each agreed issue, and the check that shows it worked.
    - name: Test script
      contains: Tasks, neutral prompts and finished and stuck rules for watching a few people try the changes.
    - name: Hand-back summary
      contains: Files saved, MISSING lines, checks not run and the one change to try first.
tweaks:
  - what: One task
    how: Name the one task to review, such as change a delivery address. Issues outside that task are left out.
  - what: Fixed components
    how: List the components you must use. Changes only use those, and anything that needs a new one is marked.
  - what: Existing comments
    how: Paste the feedback you already have. Step 1 sorts it into seen on the screen and preference.
  - what: A shorter list
    how: Ask for the top three issues only. The brief and the test cover just those.
judge:
  - Each fix names an observed problem, the user task it affects and a check for improvement.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
works_best_with:
  tools:
    - name: A capable chat AI with file support
      why: Read the full pack and supplied sources; connected actions need the corresponding authorized tools.
  inputs:
    - Approved examples of a good result.
    - A named reviewer and their acceptance rules.
next: [check-a-prototype-before-user-testing]
terms:
  - term: Usability review
    meaning: An expert-style check of a screen for what confuses people. It is not a test with real users.
  - term: Severity
    meaning: How badly an issue blocks the user's task, from small annoyance to cannot finish.
  - term: Neutral prompt
    meaning: A task written without hints, such as Change your delivery address, with no mention of where to click.
  - term: Handoff
    meaning: The checked result and file passed from one step to the next.
