slug: turn-a-report-into-an-editable-briefing-deck
name: Turn a report into an editable briefing deck
summary: Turn a report into an editable PowerPoint briefing deck, with slide text checked against your source and every slide inspected before you present.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: document
    required: false
  - type: source_text
    required: false
outputs:
  - type: slide_deck
  - type: copy_draft
  - type: document
uses:
  - presentation-builder
  - proofreader
  - editable-slide-deck-builder
steps:
  - uses: presentation-builder
    note: Choose the decision the audience must make and the evidence that supports it. Write one takeaway title per slide, each with its report page. Hand step 2 the slide text and step 3 the outline for approval.
  - uses: proofreader
    note: "Check each slide's text against the report: numbers, periods, caveats and source references. Hand step 3 the corrected text, with every change listed."
  - uses: editable-slide-deck-builder
    note: Build editable slides and speaker notes from the outline you approved. Check every slide as a picture when your AI can draw slides, and mark that check pending when it cannot.
