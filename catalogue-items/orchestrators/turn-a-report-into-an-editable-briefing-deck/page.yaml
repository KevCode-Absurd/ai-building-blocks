new_slug: turn-a-report-into-an-editable-briefing-deck
name: Turn a report into an editable briefing deck
headline: Turn a report into an editable briefing deck
summary: Turn a report into an editable PowerPoint briefing deck, with slide text checked against your source and every slide inspected before you present.
job: work-with-files
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your report, the charts or data you trust, your audience and your time slot. Your AI picks the decision and the evidence, checks the slide text against the report and builds a deck you can edit.
explain: |-
  A long report does not fit on slides as it is. Most people paste headings onto slides, and the numbers drift from the report along the way. This workflow starts with the decision your audience must make, then builds the deck backward from the evidence.

  It runs three steps. First your AI picks the decision and the report facts that support it, and writes one takeaway title per slide. Then it checks the slide text against the report, including numbers, periods and caveats. Last it builds the deck from the outline you approve, with real text boxes, tables and charts you can edit, plus speaker notes.

  You approve the outline before any slide is built. Your original report stays untouched. A visual check that your AI cannot run is marked pending, so you know what to look at yourself.
when:
  - A 20-page report is due as a 10-minute briefing and nobody has time to rebuild it as slides
  - A manager says "give me the deck version of this report" for a leadership or client meeting
  - You want slides whose numbers match the report, with the page for each one
  - You need a deck others can edit afterward, not a picture of slides
not_for:
  - You only need a summary and a slide plan, not a built file. Use Research report summary and slide-brief writer.
  - Your numbers sit in a messy spreadsheet, not in a report. Use Spreadsheet cleanup, data-check and slide-deck builder.
  - You already have a deck and want it ready to present and share. Use PowerPoint presenter handout and notes writer.
  - You want a talk built around one story. Use Case-based pitch and talk writer.
you_give:
  - Your report, as a document file or pasted text
  - The charts or data you trust, such as tables or an Excel file (optional)
  - Who will see the deck and what they must decide
  - How long you have to present, or how many slides you want
  - A deck or style guide to match, such as colours and fonts (optional)
you_get:
  - "A slide outline: one takeaway title per slide, the decision it supports and the report page behind it"
  - "A text check: each change made to slide text, with the report line that settled it"
  - An editable PowerPoint deck with speaker notes
  - A check of content and layout, with every slide inspected or marked pending
  - A hand-back summary with one next step
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini and say "Follow HANDOFF.md". To build the PowerPoint file, use an AI that can run code, with Python and python-pptx.
  - Share the report and say who the audience is, what they must decide and how long you have.
  - Read the slide outline and approve it or change it. No slide is built until you do.
  - Open the deck and check the checks list. Look at every slide your AI marked pending, then fix anything flagged.
how_it_works:
  - title: Presentation builder
    text: Chooses the decision and the evidence for it from your report, and writes one takeaway title per slide with its report page. It hands the outline on for your approval.
  - title: Proofreader
    text: Checks the slide text against the report, including numbers, periods, caveats and source references. It hands on corrected text with a list of every change.
  - title: Editable slide deck builder
    text: Builds editable slides and speaker notes from your approved outline, and inspects each slide as a picture. It marks the check pending when it cannot draw slides.
output_shape: |-
  SLIDE OUTLINE
  Slide | Takeaway title | Decision it supports | Report page

  TEXT CHECK
  Slide | Original text | Changed to | Report line

  DECK
  <name>.pptx with editable text, tables, charts and speaker notes

  CHECKS
  Check | Passed, failed or pending | Evidence

  HAND-BACK SUMMARY
  Files | MISSING lines | Checks missed | One next step
output_sample:
  input:
    - Your report, as a file or pasted text
    - The charts or data you trust (optional)
    - Who will see the deck and what they must decide
    - How long you have, or how many slides you want
    - A deck or style guide to match (optional)
  prerequisites:
    - An AI that can run code and save files, with Python and the free python-pptx library, to build the PowerPoint
    - A way to draw slides as pictures, such as LibreOffice, to inspect each slide (optional)
  output:
    - name: Slide outline
      contains: One takeaway title per slide, the decision it supports and the report page behind it.
    - name: Text check
      contains: Each change to slide text, with the report line that settled it.
    - name: Briefing deck (.pptx)
      contains: Editable slides with real text boxes, tables and charts, and speaker notes.
    - name: Checks list
      contains: Content and layout checks, each passed, failed or pending, with evidence.
    - name: Hand-back summary
      contains: Files saved, MISSING facts, checks not done and one next step.
tweaks:
  - what: Scope
    how: Name the decision the audience must make. Slides that do not serve it get cut.
  - what: Evidence
    how: Give the report and the data behind its charts, not a summary of them.
  - what: Acceptance
    how: Say the slide count and the time slot. The outline must fit both.
works_best_with:
  tools:
    - name: An AI that can run code, with Python and python-pptx
      why: It builds the editable PowerPoint file. The libraries are free to install and no paid service or account is needed. A chat AI that cannot run code gives you the outline and slide text only.
    - name: LibreOffice (optional)
      why: It lets your AI draw each slide as a picture so every slide can be inspected. Without it, the visual check stays pending.
  inputs:
    - A past deck you liked, to match the look.
    - Your logo and brand colours.
judge:
  - Slides preserve source meaning and numbers; every rendered slide is inspected before delivery.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
next:
  - prepare-a-powerpoint-deck-for-presenting-and-sharing
  - deck-number-refresher
terms:
  - term: Takeaway title
    meaning: A slide title that states the point of the slide in one sentence, not just its topic.
  - term: Speaker notes
    meaning: The text under each slide that only you see while you present.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
