steps:
  - uses: worked-example-practice
    note: "Splits your example into a full model, completion problems that fade the help and independent problems. Hands the stages and the target skill to the problem step."
  - uses: practice-problem-set-writer
    note: "Writes comparable problems at rising difficulty and checks each answer. Hands the problems and answers to the check step."
  - uses: study-understanding-check
    note: "Uses the example, the common mistakes and the problems from step 2 to write why-questions and a feedback line for each likely wrong answer. With real learner answers, it checks the reasoning and picks the next practice. Without them, it is marked not run."
