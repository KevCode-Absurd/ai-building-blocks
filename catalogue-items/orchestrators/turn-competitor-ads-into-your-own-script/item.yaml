slug: turn-competitor-ads-into-your-own-script
name: Turn competitor ads into your own script
summary: "An original script that borrows one idea from long-running competitor ads, in your words, checked against ad rules."
category: orchestrator
boards: [ecommerce]
type: workflow
role: orchestrate
job: ads
level: advanced
inputs:
  - {type: reference_set, required: true}
  - {type: brand_brain, required: true}
  - {type: voc_reviews, required: true}
  - {type: product_data, required: true}
  - {type: ad_copy, required: true}
  - {type: competitor_set, required: false}
outputs:
  - {type: script}
  - {type: audit_report}
uses: [learn-from-competitor-ads-sorted-by-type, find-ad-ideas-competitors-all-miss, get-fresh-script-from-why-ad-worked, get-script-presenter-can-say-without-stumbling, keep-facebook-from-blocking-your-ads]
steps:
  - {uses: learn-from-competitor-ads-sorted-by-type, note: "Sort the ads you collected and keep the few worth studying."}
  - {uses: find-ad-ideas-competitors-all-miss, note: "Work out why they hold attention and note how you would make your own version."}
  - {uses: get-fresh-script-from-why-ad-worked, note: "Write an original script that borrows one idea, using your product and your customers' words."}
  - {uses: get-script-presenter-can-say-without-stumbling, note: "Read every line aloud and fix the ones nobody would say."}
  - {uses: keep-facebook-from-blocking-your-ads, note: "Check the script against Facebook and Instagram ad rules."}
origin: own
version: 1.0.0
