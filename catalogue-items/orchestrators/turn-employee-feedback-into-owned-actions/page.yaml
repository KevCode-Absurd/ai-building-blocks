new_slug: turn-employee-feedback-into-owned-actions
name: Turn employee feedback into owned actions
headline: Turn employee feedback into owned actions
summary: Turn employee survey comments into a theme summary, priority actions with owners and a draft reply to staff, with small groups kept private.
job: lead-people
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give your AI staff feedback with names removed, what it was for and your privacy limits. It finds the themes, turns the supported ones into risks and priority actions with owners and dates, and drafts a staff update. Groups too small to stay anonymous are held back.
explain: |-
  Staff feedback often goes in one of two directions. It sits in a folder, or it turns into a long list of fixes with no owner. Then people ask what happened to their survey, and trust drops.

  This workflow keeps the loop short. Step 1 reads the comments within their sample limits, separates themes raised by many people from one-off remarks, and holds back any group too small to stay anonymous. Step 2 turns the themes that are backed by evidence into risks and priority actions. Each action gets an owner and a date to check. Where the evidence is thin, it says what to find out first. Step 3 drafts a reply for staff: what we heard, what we will look at and who owns what.

  You must remove names and identifying detail before you paste. The AI does not make feedback anonymous. You also decide whether you may use the feedback this way and how long to keep it. It checks neither.
when:
  - A survey, exit interviews or a suggestion box produced a pile of comments and nobody has acted yet.
  - Staff ask "what happened to the survey?" and you have no answer.
  - You promised to report back by a date and need a clear message that makes no promises you cannot keep.
  - Leaders want three priorities from the feedback, each with an owner.
not_for:
  - One person's complaint, grievance or disciplinary case. Take it to HR. The Workplace investigation planner can help plan a formal review.
  - Fewer responses than your smallest reportable group. Results would be withheld. Collect more first with the Employee feedback survey planner.
  - You already have actions and want to track them. Use the Employee feedback action reviewer.
  - The feedback is about one new policy. Use the Policy adoption support planner workflow.
you_give:
  - Employee feedback with names and identifying details removed (from your survey tool, interview notes or suggestion box)
  - What the feedback was for, and when it was collected
  - The teams it covers, with headcount for each, so small groups can be held back
  - Your privacy limits, such as the smallest group you may report on, how long to keep the data and who may see it
  - People who could own actions (optional)
you_get:
  - A theme summary that shows what many people raised and what only a few did
  - A list of groups held back because they are too small to report
  - Risks and evidence gaps for the themes the feedback supports, with a proposed action for each
  - Priority actions, each with an owner, a check date and a sign it worked
  - A draft staff update, ready for your review before it is sent
how_to_use:
  - Download the pack and add it to your AI, such as Claude, ChatGPT or Gemini.
  - Remove names and any detail that points to one person. Check that you may use the feedback for this purpose.
  - Paste the feedback, what it was for, each team's headcount and your privacy limits.
  - After step 1, read the themes. Check that nothing points to one person and that the counts match your data.
  - Edit the staff update before it goes out. Add a real date for your next report-back.
how_it_works:
  - title: Employee survey designer
    text: Reads the comments within their sample limits and keeps anonymity. Separates themes many people raised from one-off remarks, and holds back small groups. Hands step 2 the themes with counts. Check before moving on, no group below the limit is shown.
  - title: People risk register builder
    text: Turns each supported theme into a risk, names the evidence gap and proposes an action. Hands step 3 the priority actions. Check before moving on, each risk traces to a theme.
  - title: Stakeholder update writer
    text: Writes a staff update. It says what was heard, what will be looked at and who owns the next steps. It names no one and promises nothing beyond the actions.
  - title: Check and hand back
    text: Joins the three files, checks the update against the actions and marks what still needs a person to decide.
output_shape: |-
  THEME SUMMARY
    <theme | how many raised it | which groups | recurring or one-off | what people said, in paraphrase>
  WITHHELD <groups too small to report>
  RISKS AND EVIDENCE GAPS
    <risk | theme | evidence | what to find out | proposed action>
  PRIORITY ACTIONS
    <action | theme | owner | check date | how you will know it worked>
  DRAFT STAFF UPDATE <what we heard, what we will look at, who owns next steps, when we report back>
  APPROVAL <who approves before it is sent, status: draft>
  MISSING <each gap and the part it stops>
  CHECKS MISSED <one line each, or none>
output_sample:
  input:
    - "Employee feedback with names and identifying details removed"
    - "What the feedback was for and when it was collected"
    - "The teams it covers, with headcount for each"
    - "Your privacy limits, including the smallest group you may report on"
  prerequisites:
    - "An AI that can read files or long pasted text"
    - "Your own check that you may use the feedback this way"
  output:
    - name: "Theme summary"
      contains: "Each theme with counts, groups and whether it was recurring or a one-off."
    - name: "Withheld groups"
      contains: "Groups too small to report without pointing to a person."
    - name: "Risks and evidence gaps"
      contains: "A risk for each supported theme, what to find out and a proposed action."
    - name: "Priority actions"
      contains: "Each action with an owner, a check date and a sign that it worked."
    - name: "Draft staff update"
      contains: "What we heard, what we will look at, who owns next steps and when we report back."
tweaks:
  - what: Group size
    how: Say your smallest reportable group. If you do not, the AI uses 5 and labels it as an assumption you can change.
  - what: Number of actions
    how: Ask for the top three. The rest stay in the risk list, so nothing is lost.
  - what: Tone
    how: Say how your team talks, formal or relaxed. The staff update follows it and keeps the same facts.
judge:
  - Small groups and identifying comments are protected; actions have owners and a way to check progress.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Keep the themes and actions from each run so the next survey shows what changed.
  - Add your real report-back date and owners to the draft before it goes out.
  - Move the actions to the employee feedback action review assistant to track them until they close.
works_best_with:
  tools:
    - name: A chat AI that reads files
      why: It reads all the comments and the pack together. Nothing is sent or changed for you.
  inputs:
    - Headcount for each team, so small groups can be held back.
    - Last survey's themes, to see what changed.
terms:
  - term: Theme
    meaning: A topic that several people raised, such as workload or unclear roles.
  - term: Small group
    meaning: A team so small that its answers could point to one person, so results are held back.
  - term: Handoff
    meaning: The checked file one step passes to the next.
