slug: turn-meetings-into-owned-actions
name: Turn meetings into owned actions
summary: Share meeting notes. Get a sourced action register and follow-up drafts
  with owners and dates made clear.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: brief
    required: true
  - type: meeting_notes
    required: false
  - type: plan
    required: false
outputs:
  - type: document
uses:
  - executive-action-register
  - executive-due-task-drafts
steps:
  - uses: executive-action-register
    note: 1. Read skills/executive-action-register/SKILL.md. Share meeting notes or
      email threads. Get one action list with owners, deadlines, source links
      and unresolved commitments. Save the result with source references. Carry
      the user's goal and all earlier findings into this step. If required
      evidence or tool access is missing, mark this step blocked; do not
      fabricate a result.
  - uses: executive-due-task-drafts
    note: 2. Read skills/executive-due-task-drafts/SKILL.md. Share due tasks and
      related threads. Get follow-up drafts linked to each task, with missing
      facts and send status clear. Save the result with source references. Carry
      the user's goal and all earlier findings into this step. If required
      evidence or tool access is missing, mark this step blocked; do not
      fabricate a result.
