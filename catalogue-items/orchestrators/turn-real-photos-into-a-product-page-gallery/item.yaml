slug: turn-real-photos-into-a-product-page-gallery
name: Turn real photos into a product page gallery
summary: "About 8 product page images that each answer one shopper question, planned from and checked against your real photos."
category: orchestrator
type: workflow
role: orchestrate
job: image
level: advanced
inputs:
  - {type: product_photos, required: true}
  - {type: product_data, required: true}
  - {type: brand_brain, required: true}
  - {type: voc_reviews, required: false}
outputs:
  - {type: pdp_images}
  - {type: gallery_plan}
  - {type: audit_report}
uses: [product-image-spec-writer, product-page-gallery-planner, get-a-product-page-gallery-that-answers-doubts, product-page-image-checker]
steps:
  - {uses: product-image-spec-writer, note: "Keep only full-size photos of the exact variant and write the truth sheet: shape, colours, printed words, how it opens, what's in the box, lookalikes to avoid and the photos still missing. If the photos are described but not attached, write the sheet from the description, mark it 'not checked against photos', and let the plan go ahead. Nothing gets made from it."}
  - {uses: product-page-gallery-planner, note: "Score each shopper question 0 to 2 for how often it's asked, whether a picture answers it better, and the proof on hand. Fill about 8 slots (main image first, at least one size image, each question once) and write one card per image with every word and its source. A question with no proof goes on the gaps list."}
  - {uses: get-a-product-page-gallery-that-answers-doubts, note: "Use the truth sheet and plan from steps 1 and 2 instead of making new ones. Sort the reviews into the five fears, move the biggest stopper to slot 2, then stop for the person's yes on the plan and every word. Make slots 1 and 2 as test images, stop again, then make the rest. Without the real photo files and that yes, make nothing and list what's needed."}
  - {uses: product-page-image-checker, note: "Run the 13 checks in three passes: the set as thumbnails, each image at phone size with a one-second glance, then every word, figure and product detail zoomed in beside the real photo. If no images were made, mark every check not run. Then close the run with a HAND-BACK SUMMARY: each step's file, any step not run and why, and every MISSING: and NEED: line in one list."}
origin: own
version: 1.1.0
