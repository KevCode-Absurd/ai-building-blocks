slug: turn-reviews-into-a-video-ad-ready-to-film
name: Turn reviews into a video ad ready to film
summary: "A video ad script with a source for every line, checked against ad rules, then taken through avatar, sheets, storyboard and clip prompts."
category: orchestrator
boards: [ecommerce]
type: workflow
role: orchestrate
job: video
level: advanced
inputs:
  - {type: web_page, required: true}
  - {type: voc_reviews, required: true}
  - {type: persona, required: true}
  - {type: product_data, required: true}
  - {type: performance_sheet, required: false}
  - {type: product_photos, required: false}
outputs:
  - {type: shot_list}
  - {type: video_prompt}
  - {type: edit_plan}
  - {type: audit_report}
uses: [website-brand-file-builder, customer-buying-reasons-finder, customer-quote-video-ad-script-writer, ad-script-read-aloud-editor, meta-ads-compliance-checker, video-avatar-and-storyboard-planner, video-ad-shot-list-maker]
steps:
  - {uses: website-brand-file-builder, note: "Read the site, tag every fact by where it came from, and write the eight brand files. For the one check-in: if the person isn't there to answer, list each fact to confirm as a MISSING line and carry on with tagged facts only. Never fill where the brand sells or ships unless the site says so."}
  - {uses: customer-buying-reasons-finder, note: "Copy out every phrase that shows why people switched, word for word with its review number, tag its force (push, pull, anxiety, habit, result), count separate people and rank the reasons. A reason is a pattern only at 5 people across 2 kinds of source; say so when it isn't."}
  - {uses: customer-quote-video-ad-script-writer, note: "Use the buyer given, the ranked reasons from step 2 and only facts from the brand file. Sort the quotes onto the buyer's timeline, name the belief shift, write the beats with on-screen text, a picture note and evidence for every line, keep spoken words inside the budget, and list every placeholder. Unverified quotes stay out of the paid ad."}
  - {uses: ad-script-read-aloud-editor, note: "Read every line of the step 3 script aloud and fix the ones nobody would say, without changing what they say or any number. Hand on the fixes and the whole script with them made. This is the locked script for every later step."}
  - {uses: meta-ads-compliance-checker, note: "Check the locked script, the on-screen words and the picture notes against Facebook and Instagram ad rules before any image or clip is made, pointing to exact lines. State where the brand sells, ships or targets only if the brand file says so; otherwise write MISSING. A line marked fix first goes back to the person before step 6."}
  - {uses: video-avatar-and-storyboard-planner, note: "Run stages 1 to 4 on the locked script. Stage 1: pick the avatar from the buyer and the script and write the avatar card (a made-up adult who never claims to have used the product; a casting and wardrobe note instead if a real person will film it; the product as the avatar if no one appears). Approval 1. Stage 2: 3 or 4 reference images, one picked. Stage 3: character sheet with every angle, product sheet from the real photos, set sheets and lock lines. Approval 2. Stage 4: one frame and one shot card per shot. Approval 3."}
  - {uses: video-ad-shot-list-maker, note: "Run stage 5 from the approved storyboard, sheets and lock lines. Split the script into clips of about 6 seconds, one scene each, and write a shot table per clip with 3 to 5 shots, carrying each continuity note into the next clip. Then start and end frames, clip prompts that describe only the motion, the voice plan and the edit list, checked against the script and the step 5 findings. Give any total of clips, shots or seconds by counting the tables. Then close the run with a HAND-BACK SUMMARY: each step's file, the clip and shot count from the tables, the three approvals and who gave them, any step not run and why, and every MISSING: line from all steps in one list."}
origin: own
version: 2.0.0
