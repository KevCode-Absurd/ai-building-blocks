slug: turn-rough-notes-into-a-checked-word-handout
name: Turn rough notes into a checked Word handout
summary: Turn rough notes into a clean Word handout and a PDF copy, with a page-by-page check for cut-off text and broken tables before you print or send.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: copy_draft
    required: false
  - type: brand_brain
    required: false
outputs:
  - type: copy_draft
  - type: document
  - type: audit_report
uses:
  - plain-english-editor
  - document-file-generator
  - libreoffice-document-builder
  - pdf-maker-and-reader
steps:
  - uses: plain-english-editor
    note: Rewrite the notes in plain words, organised around what the reader must understand or do. Hand step 2 the edited text (the content of the handout) and a list of every change, with the note behind each claim.
  - uses: document-file-generator
    note: Create a new Word handout from step 1's edited text, with your brief saying the layout and audience, in the style of your reference document if you gave one. Keep your source notes unchanged. Hand step 3 the .docx file to convert.
  - uses: libreoffice-document-builder
    note: Convert step 2's Word file to a PDF review copy with LibreOffice (your brief says the format), without overwriting the Word file. Hand step 4 the PDF and the conversion result.
  - uses: pdf-maker-and-reader
    note: Draw every page of the PDF as a picture and look for missing text, broken tables, font problems and clipped lines. Log each page, and keep the Word and PDF files tied to the same version. Hands back the page-by-page log with the final files.
