new_slug: turn-rough-notes-into-a-checked-word-handout
name: Turn rough notes into a checked Word handout
headline: Turn rough notes into a checked Word handout
summary: Turn rough notes into a clean Word handout and a PDF copy, with a page-by-page check for cut-off text and broken tables before you print or send.
job: work-with-files
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Give it your notes, who the handout is for and what they should do. Your AI rewrites the notes in plain words, builds a Word file, makes a PDF copy and checks every page.
explain: |-
  Notes make sense to you, not to the person who gets the handout. Even a good edit can break when it lands in Word: a table runs off the page, a font changes, a line gets cut. This workflow handles both. It rewrites your notes for the reader, builds the Word file, then checks the real pages.

  It runs four steps. The first organises the notes around what the reader must understand or do, and ties each claim to a note. The second builds a new .docx file and leaves your notes alone. The third converts it to a PDF. The fourth draws each PDF page as a picture and logs problems.

  You get a Word file you can edit and a PDF you can read on any device. A page check your AI cannot run is marked "not run", so you know what to open and look at yourself.
when:
  - You ran a workshop or a meeting and must send attendees a handout, not your raw notes
  - A policy, a how-to or a checklist lives in scattered notes and needs to go out as a Word file
  - A manager wants the handout as .docx so they can edit it, with a PDF for the printer
  - You want proof that no page has cut-off text or a broken table before you send it
not_for:
  - You only need cleaner text, with no Word file. Use the Plain English editor.
  - You want a one-page training handout from slides or notes. Use the Training handout writer.
  - You have a slide deck and want an audience handout PDF from it. Use the PowerPoint audience handout builder.
  - Your AI cannot install tools or run code. You will get the edited text and a plan, not a Word file.
you_give:
  - Your rough notes, pasted or as files
  - Who the handout is for, and what they should do after reading it
  - The format you need, such as one page or a table of steps
  - A past handout or style guide to match (optional)
  - A deadline, and anything that must not change (optional)
you_get:
  - An edited handout text in plain words, with each change listed
  - A new Word file (.docx), with your notes left unchanged
  - A PDF review copy made from the Word file
  - "A page-by-page check log: one line per page, each passed, failed or not run"
  - A hand-back summary with MISSING facts and one next step
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Use an AI that can run code and save files. It needs Node.js, LibreOffice and a PDF page-to-picture tool installed.
  - Give it the folder and say "Follow HANDOFF.md". Then share your notes and say who the handout is for.
  - Read the edited text first. Fix any MISSING line, then let it build the Word file.
  - Open the Word file and the check log. Look at any page marked not run, then send or print.
how_it_works:
  - title: Plain English editor
    text: Rewrites your notes around what the reader must understand or do, and lists every change. It hands on the edited text, with a note behind each claim.
  - title: Document file generator
    text: Builds a new Word file from the edited text in your reference style. It keeps your source notes unchanged and hands on the .docx file.
  - title: LibreOffice document builder
    text: Converts the Word file to a PDF review copy and checks the conversion. It never overwrites the Word file.
  - title: PDF maker and reader
    text: Draws every page of the PDF as a picture. It checks for missing text, tables, fonts and clipping, and ties the PDF to the Word version.
output_shape: |-
  EDITED TEXT
  <the handout in plain words, ready for the Word file>

  CHANGES
  Original | New | Reason

  FILES
  <name>.docx | <name>-review.pdf

  PAGE CHECKS
  Page | Text, tables, fonts and clipping | Passed, failed or not run

  HAND-BACK SUMMARY
  Files | MISSING lines | Checks missed | One next step
output_sample:
  input:
    - Your rough notes
    - Who the handout is for and what they should do
    - The format you need, such as one page
    - A past handout or style guide to match (optional)
  prerequisites:
    - An AI that can run code and save files
    - Node.js, to build the Word file with the PaperJSX npm package
    - LibreOffice, to make the PDF copy
    - A tool that draws PDF pages as pictures, such as Poppler
  output:
    - name: Edited text and changes
      contains: The handout in plain words, with every change and its reason.
    - name: Word handout (.docx)
      contains: A new, editable Word file built from the edited text.
    - name: PDF review copy
      contains: A PDF made from the Word file, saved under a new name.
    - name: Page check log
      contains: One line per page for text, tables, fonts and clipping, each passed, failed or not run.
    - name: Hand-back summary
      contains: Files saved, MISSING facts, checks not done and one next step.
tweaks:
  - what: Scope
    how: Make one handout per run, for one reader, with one action.
  - what: Evidence
    how: Give the real notes. Do not ask your AI to fill gaps from memory.
  - what: Acceptance
    how: Every claim traces to your notes. Every page is checked as a picture.
works_best_with:
  tools:
    - name: An AI that can run code, such as Claude Code
      why: It builds the Word file with Node.js and the PaperJSX package. Check that package's licence and cost before you install it.
    - name: LibreOffice
      why: It is free. It converts the Word file to PDF.
    - name: A PDF page-to-picture tool and Python PDF libraries
      why: Poppler, pdfplumber and pypdf draw and read the pages so layout can be checked. Text alone cannot show a broken table.
  inputs:
    - A past handout you liked, to match the look.
    - A named person to read the final pages.
judge:
  - Claims trace to the notes; rendered pages have readable tables and no clipped text.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Add your own acceptance rules and one approved example without changing the component licences.
  - Keep corrections with the result so the next run uses current facts and the same definitions.
  - Record checks that need a person or unavailable tool and complete them before relying on the output.
next:
  - training-handout-writer
  - powerpoint-audience-handout-builder
terms:
  - term: Review copy
    meaning: A PDF made from the Word file so you can check the pages without editing the Word file.
  - term: Clipping
    meaning: Text or a table cut off at the edge of the page.
  - term: Handoff
    meaning: The checked information and file passed from one step to the next.
