slug: turn-saved-reading-into-notes-you-can-use
name: Turn saved reading into notes you can use
summary: Share the source files. Get linked notes, a sourced answer and a small recall exercise.
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: question
    required: true
  - type: source_text
    required: true
  - type: document
    required: false
outputs:
  - type: document
  - type: feedback_notes
uses:
  - source-note-summariser
  - notes-wiki-builder
  - recall-first-study-tutor
steps:
  - uses: source-note-summariser
    note: Extract claims, evidence, gaps and source locations relevant to the supplied question, separating the source from your interpretation. Hands step 2 the notes for every source.
  - uses: notes-wiki-builder
    note: Prepare linked note files or use an explicitly approved local notes folder. Connect genuine overlaps without erasing disagreements and do not silently persist private memory. Hands step 3 the linked notes and the index.
  - uses: recall-first-study-tutor
    note: Prepare recall prompts and require actual learner attempts and confidence before assessing understanding. Leave the check unrun when the learner has not answered. Uses your question as the topic and step 2's notes to compare your recall against.
