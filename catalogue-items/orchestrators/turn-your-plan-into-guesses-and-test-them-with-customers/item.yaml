slug: turn-your-plan-into-guesses-and-test-them-with-customers
name: Turn your plan into guesses and test them with customers
summary: Give it your business plan. Get testable guesses, an interview plan and
  the smallest test of the riskiest guess.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - business-model-guess-tester
  - customer-discovery-plan
steps:
  - uses: business-model-guess-tester
    note: "Lays the plan out on one page: customers, value, channels, revenue and
      costs. Turns each box into a guess, orders by risk and adds a test and a
      pass line."
  - uses: customer-discovery-plan
    note: Takes the guesses from step 1 and lists who to talk to for each. Writes
      questions about what people do now, and a way to record what they say.
origin: rebuilt
credits:
  - title: What's A Startup? First Principles
    by: Steve Blank
    url: https://steveblank.com/2010/01/25/whats-a-startup-first-principles/
    used: Treating a startup as a search for a repeatable model, and the search
      versus execute split
  - title: Search versus Execute (summary note)
    by: Steve Blank
    used: Holding back sales and marketing departments until the model is found
  - title: "The Customer Development Manifesto: Reasons for the Revolution, part 1"
    by: Steve Blank
    used: Writing the model as guesses, ranking them by risk, getting out of the
      building to test them, and having founders do the first talks
version: 1.0.0
example_pending: true
