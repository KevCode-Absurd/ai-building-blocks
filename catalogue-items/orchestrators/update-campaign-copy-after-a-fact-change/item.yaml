slug: update-campaign-copy-after-a-fact-change
name: Campaign copy change and release workflow
summary: Apply an approved fact or offer change across existing campaign copy. Get scoped patches, review results and a versioned publishing handoff.
category: orchestrator
type: workflow
role: orchestrate
job: copy
level: advanced
inputs:
  - type: copy_draft
    required: true
  - type: product_data
    required: true
  - type: offer
    required: false
  - type: document
    required: false
outputs:
  - type: copy_draft
    required: true
  - type: audit_report
    required: true
  - type: document
    required: true
uses:
  - campaign-change-impact-mapper
  - marketing-evidence-expiry-reviewer
  - claim-and-proof-matcher
  - theme-based-ad-copy-set-writer
  - campaign-email-writer
  - ad-matched-landing-page-writer
  - pre-launch-ad-checker
steps:
  - uses: campaign-change-impact-mapper
    note: A scoped impact map with affected fields, dependencies, unchanged locks and unresolved assets. Hands step 2 the claims, terms and assets to re-check.
  - uses: marketing-evidence-expiry-reviewer
    note: A per-claim current, review-needed or withdrawn decision with source and next action. Hands step 3 the evidence decisions.
  - uses: claim-and-proof-matcher
    note: A claim decision register and exact allowed wording/terms for each affected surface. Hands step 4 the approved wording, and any claim to remove.
  - uses: theme-based-ad-copy-set-writer
    note: Patches the ad copy from your baseline ads and step 3's allowed wording. Hands step 5 the updated ads, with the affected-field diff; unaffected ads stay unchanged.
  - uses: campaign-email-writer
    note: Patches the email from your baseline email, step 3's allowed wording and step 4's updated ads, so the facts agree. Hands step 6 the updated email.
  - uses: ad-matched-landing-page-writer
    note: Patches the landing page from your baseline page, step 3's allowed wording and the updated ad and email copy. Hands step 7 the updated page.
  - uses: pre-launch-ad-checker
    note: Reviews the updated ads, email and page against the approved change and step 3's claim register. This is the final step, and it hands back the text review, the checks not yet run and the exact-version handoff.
execution: coordinator
package_files: all
needs_mode: manual
origin: own
example_pending: true
version: 1.0.0
