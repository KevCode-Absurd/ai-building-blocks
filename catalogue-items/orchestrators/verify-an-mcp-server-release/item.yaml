slug: verify-an-mcp-server-release
name: Verify an MCP server release
summary: Share your MCP server and settings. Get code risks, access risks and a
  real protocol test report.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: question
    required: true
  - type: codebase
    required: false
outputs:
  - type: document
uses:
  - copilot-mcp-implementation-security-review
  - copilot-mcp-security-audit
  - copilot-mcp-release-qa
steps:
  - uses: copilot-mcp-implementation-security-review
    note: 1. Read skills/copilot-mcp-implementation-security-review/SKILL.md. Share
      your MCP code. Get risks traced through tool handlers, with evidence and
      fixes. Save the result with source references. Carry the user's goal and
      all earlier findings into this step. If required evidence or tool access
      is missing, mark this step blocked; do not fabricate a result. Hands step 2 the list of risks found in the handlers.
  - uses: copilot-mcp-security-audit
    note: 2. Read skills/copilot-mcp-security-audit/SKILL.md. Share your MCP
      settings. Get risks in permissions, trust and server access, with fixes.
      Save the result with source references. Carry the user's goal and all
      earlier findings into this step. If required evidence or tool access is
      missing, mark this step blocked; do not fabricate a result. Uses your MCP settings files, not step 1's output, and also takes step 1's findings to look for the same patterns. Hands step 3 the settings risks.
  - uses: copilot-mcp-release-qa
    note: 3. Read skills/copilot-mcp-release-qa/SKILL.md. Share your MCP server. Get
      a real session check of its tools, errors and advertised features. Save
      the result with source references. Carry the user's goal and all earlier
      findings into this step. If required evidence or tool access is missing,
      mark this step blocked; do not fabricate a result. Uses your MCP server, run in a fresh session, and takes the risks from steps 1 and 2 so the tests try them. This is the final step; it hands back the release blockers.
origin: rebuilt
version: 1.0.0
