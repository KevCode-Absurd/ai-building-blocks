slug: write-a-clear-executive-reply
name: Write a clear executive reply
summary: Paste an email thread and say what you want. Get a reply draft with recipients listed, facts checked and the wording in your voice.
category: orchestrator
boards:
  - business
type: workflow
role: orchestrate
job: ops
level: intermediate
execution: coordinator
inputs:
  - type: question
    required: true
  - type: short_text
    required: true
  - type: brand_brain
    required: false
outputs:
  - type: document
uses:
  - executive-email-draft
  - brand-voice-editor
steps:
  - uses: executive-email-draft
    note: "Reads the thread and your goal. Hands the voice step a reply draft, the To, CC and BCC list, the facts checked and any missing facts."
  - uses: brand-voice-editor
    note: "Edits the draft's wording to match your sent emails and voice notes. Changes words only, never a fact, date, price or promise. Hands back the final reply and a list of each change."
needs_mode: manual
origin: rebuilt
