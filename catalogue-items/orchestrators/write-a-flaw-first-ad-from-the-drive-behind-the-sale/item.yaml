slug: write-a-flaw-first-ad-from-the-drive-behind-the-sale
name: Write a flaw-first ad from the drive behind the sale
summary: Paste your product facts and buyer words. Get a brief on why people
  buy, a flaw-first ad and fresh wording.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - buyer-instinct-brief-writer
  - flaw-first-ad-writer
  - fresh-line-rewriter
steps:
  - uses: buyer-instinct-brief-writer
    note: Reads your facts and buyer words and names the drive underneath why people
      buy. Writes the feeling the ad must leave and what to avoid saying.
  - uses: flaw-first-ad-writer
    note: Takes the brief and lists your product's true weaknesses. Picks the one a
      buyer already sees and writes an ad that names it and shows what it
      proves.
  - uses: fresh-line-rewriter
    note: Takes the ad and writes fresh versions of its claim. Runs a swap test
      against rivals and picks one, cutting any words that don't carry the
      point.
origin: rebuilt
credits:
  - title: Facts Are Not Enough (speech and related pieces)
    by: Bill Bernbach
    used: Treating facts as a springboard, reading for the drive under the stated
      want, and briefing on what the reader should take away
  - title: Joseph Sugarman
    by: Wikipedia article
    url: https://en.wikipedia.org/wiki/Joseph_Sugarman
    used: Stating a product's drawback openly in the ad as a way to earn trust
version: 1.0.0
example_pending: true
