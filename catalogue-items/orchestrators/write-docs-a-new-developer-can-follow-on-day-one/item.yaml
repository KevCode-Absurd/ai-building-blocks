slug: write-docs-a-new-developer-can-follow-on-day-one
name: "Write docs a new developer can follow on day one"
summary: "Give it the codebase. Get an architecture read, a README with decisions, a quickstart and a first-run test."
category: orchestrator
type: workflow
role: orchestrate
job: ops
level: intermediate
inputs:
  - {type: codebase, required: true}
  - {type: question, required: true}
  - {type: document, required: false}
outputs:
  - {type: document}
  - {type: test_report}
uses: [codebase-architecture-reviewer, readme-and-decision-interviewer, codebase-onboarding-guide-writer, developer-quickstart-writer, readme-first-run-tester]
steps:
  - {uses: codebase-architecture-reviewer, note: "The parts of the codebase, how they talk, where things live and what is unusual, written for someone who has never seen it. Hands step 2 the architecture read, which its questions draw on."}
  - {uses: readme-and-decision-interviewer, note: "A README that records the decisions behind the structure and their reasons, from your answers, so nobody reverses one by accident. Uses step 1's read and the code, then hands step 3 the README with the decisions in it."}
  - {uses: codebase-onboarding-guide-writer, note: "A guide to the code for the new developer: where to start reading, the main flows, the conventions, the gotchas. Reads the code plus step 2's README, and hands step 4 the guide."}
  - {uses: developer-quickstart-writer, note: "The shortest path from a clean machine to a running app and a passing test, with every command and expected output. Starts from your product details (what it is, language, real install commands) and step 3's guide, and hands step 5 the quickstart."}
  - {uses: readme-first-run-tester, note: "Follows the quickstart on a clean setup as a newcomer would, and reports every step that breaks, is missing or assumes knowledge. Reads the code and the quickstart from step 4, and hands you the list of what to fix."}
origin: own
version: 1.0.0
example_pending: true
