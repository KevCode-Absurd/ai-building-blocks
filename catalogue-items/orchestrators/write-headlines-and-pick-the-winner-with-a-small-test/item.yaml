slug: write-headlines-and-pick-the-winner-with-a-small-test
name: Write headlines and pick the winner with a small test
summary: Give it your brief and product facts. Get checked headlines and a small
  keyed test that picks the winner.
category: orchestrator
type: workflow
role: orchestrate
job: strategy
level: intermediate
inputs:
  - type: brief
    required: true
  - type: performance_sheet
    required: false
outputs:
  - type: plan
uses:
  - ad-headline-writer
  - headline-reader-and-reward-checker
  - keyed-headline-test-planner
steps:
  - uses: ad-headline-writer
    note: Sets what the headline may say from your brief and facts. Writes one line
      for each way in and marks the one to test first.
  - uses: headline-reader-and-reward-checker
    note: Takes the headlines and checks each one names its reader and promises a
      reward worth reading for. Rewrites the weak lines and lists the changes.
  - uses: keyed-headline-test-planner
    note: Sorts the checked headlines by appeal, picks two or three to test and
      gives each a code. Sets a rule for picking the winner on replies per cost.
origin: rebuilt
credits:
  - title: Tested Advertising Methods
    by: John Caples
    url: https://en.wikipedia.org/wiki/John_Caples
    used: Self-interest, news and curiosity as headline appeals, with curiosity
      weakest alone
  - title: Scientific Advertising
    by: Claude C. Hopkins
    url: https://www.holloway.com/g/scientific-advertising
    used: The headline calls out the right reader; an exact fact beats a general
      claim
  - title: Confessions of an Advertising Man
    by: David Ogilvy
    url: https://en.wikipedia.org/wiki/Confessions_of_an_Advertising_Man
    used: Most people read only the headline, so it must carry the offer
  - title: Breakthrough Advertising
    by: Eugene Schwartz
    url: https://en.wikipedia.org/wiki/Eugene_Schwartz
    used: What a headline may say at each awareness level
  - title: Breakthrough Advertising (a book summary)
    by: Eugene Schwartz (1966), as retold in a third-party chapter summary
    url: https://breakthroughadvertisingbook.com/
    used: What a headline must carry and leave out at each awareness level, the move
      each claim-fatigue stage calls for, and ways to sharpen a claim with
      numbers, senses and removed limits
  - title: 100 Good Advertising Headlines, and why they were so profitable
    by: Victor Schwab
    used: The two jobs of a headline (pick the reader, promise a reward), gain and
      loss versions, speed and ease, and the so-what test
  - title: They Laughed When I Sat Down at the Piano (ad, Screenland, 1926) and the
      study notes on it
    by: John Caples
    used: Sorting headlines by self-interest, news or curiosity, tying curiosity to
      a promise, keying each version and testing small before spending big
version: 1.0.0
example_pending: true
