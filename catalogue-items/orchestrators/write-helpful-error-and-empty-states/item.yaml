slug: write-helpful-error-and-empty-states
name: Write helpful error and empty states
summary: "Write clear error messages and empty states for your app. Share your screens and current text. Get every state listed, new wording and dev notes."
category: orchestrator
type: workflow
role: orchestrate
execution: coordinator
job: ops
level: intermediate
inputs:
  - type: brief
    required: true
  - type: codebase
    required: false
  - type: copy_draft
    required: false
  - type: design_file
    required: false
outputs:
  - type: copy_draft
  - type: design_direction
  - type: document
uses:
  - screen-states-designer
  - error-message-rewriter
  - small-interface-details-designer
steps:
  - uses: screen-states-designer
    note: List the states and user actions for each supplied screen, including retry and interrupted work. Hands step 2 every failure and empty state with its cause and recovery options.
  - uses: error-message-rewriter
    note: Write a plain message for every failure state using only recovery actions the product supports. Reads step 1's failure states and hands step 3 the final text of each message.
  - uses: small-interface-details-designer
    note: Specify focus, buttons and transitions so each message can be implemented and checked. Reads step 2's message text and your brief, and hands back the build notes.
