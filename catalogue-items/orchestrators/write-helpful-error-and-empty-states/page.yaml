new_slug: write-helpful-error-and-empty-states
name: Write helpful error and empty states
headline: Write helpful error and empty states
summary: Write clear error messages and empty states for your app. Share your screens and current text. Get every state listed, new wording and dev notes.
job: design-work
thinking: high
thinking_why: It connects several skills, checks their inputs and preserves evidence through each handoff.
subhead: Share your app screens and the error text you have now. Your AI lists every empty, loading, blocked and failed state, rewrites each message in plain words, and adds notes your developer can build from.
explain: |-
  Most apps look good when everything works. People meet the other screens first: a list with nothing in it, a save that fails, a page they are not allowed to open. This workflow writes the error messages and empty states for those moments, so nobody is left looking at "Something went wrong".

  It runs three skills in order. The first lists every state on each screen and what the person can do there. The second writes the message for each failure, and offers only a next step your product can really do. The third adds the small details a developer needs: where focus goes, what the button says and how the screen changes. Each step saves a file and hands it to the next.

  A message never promises a fix your product lacks. If you did not list the recovery options, the AI marks that line MISSING and does not guess. It writes words and specs. It does not change your code.
when:
  - Support tickets keep starting with "it just says error".
  - You are about to launch a new screen and have only designed the happy path.
  - A list, inbox or dashboard is blank on day one and new users do not know what to do first.
  - A developer asks you for the exact text for every failed state.
not_for:
  - "You only have a list of error messages and want better wording: use the Error message rewriter."
  - "You want a score and full review of one form or screen: use the Error message rewriter or the Forms and instructions rewriter."
  - "Your product has no recovery steps yet, such as retry or undo: decide those first, then run this."
  - "The text has fixed legal or payment provider wording: check with the provider before you change it."
you_give:
  - Your screens, as screenshots or pasted text, for each place that can be empty, load, fail or be blocked
  - The error text your app shows today, and what causes each one (optional, but it helps)
  - What people can really do after a failure, such as retry, undo, sign in again or contact support
  - Your voice, such as calm and friendly (optional)
  - The code for the screens, if your AI can read it (optional)
you_get:
  - A state list for each screen, with what the person sees and can do
  - One new message per failure, saying what happened and one thing to do next
  - Empty-screen text that tells a new user what to do first
  - A build note per message, covering focus, button label and how the screen changes
  - A list of facts still MISSING and any check that did not run
how_to_use:
  - Download the workflow pack and add it to Claude, ChatGPT or Gemini, in a chat that accepts files.
  - Attach your screens, or paste the text on each one. Paste your current error messages and say what causes each.
  - List what people can really do after each failure. Say so if there is nothing, and do not leave it blank.
  - Tell your AI to follow the pack and save each step's file. Check the state list from step 1 before step 2 starts.
  - Read each new message against your product, and cut any promise it cannot keep. Then give the build notes to your developer.
how_it_works:
  - title: Screen states designer
    text: Lists the states on each screen you gave it, such as empty, loading, offline, blocked and failed, with what the person can do in each. Hands step 2 every failure and empty state with its cause and recovery options.
  - title: Error message rewriter
    text: Writes one message per failure in the person's words, with no blame and one next step your product supports. Ranks them by cost, so lost money and lost data come first. Hands step 3 the final text.
  - title: Small interface details designer
    text: Turns each message into build notes. It names where focus goes, what the button says and how the message appears and clears. Check before moving on, each note matches its message text.
output_shape: |-
  SCOPE AND SOURCES      <screens, error text and recovery options you gave>
  STATE LIST             <screen | state | what the person sees | what they can do>
  MESSAGES               <state | trigger | cost | new message | next step | prevention>
  EMPTY STATES           <screen | text | first action>
  BUILD NOTES            <message | focus | button label | how it appears and clears>
  MISSING                <each gap and the message it stops>
  CHECKS MISSED          <one line each, or none>
  NEXT STEP              <one suggestion>
tweaks:
  - what: Voice
    how: Say whether you want calm, warm or playful. The facts and next steps stay the same and only the tone changes.
  - what: One screen first
    how: Start with the screen behind most support tickets. A short run is easier to check than a whole app.
  - what: Recovery options
    how: List what each failure allows, such as retry, undo or contact. The messages offer only those.
judge:
  - Every error explains what happened and one available action; messages never promise a recovery the product lacks.
  - Every factual claim, figure and date traces to a source or is clearly labeled as an assumption.
  - The original source files stay intact, and revised files have distinct names or versions.
  - Each required component check ran, or the run stopped and says which check could not pass.
  - The summary names any work that could not be checked.
test:
  - Try a small case where you know the correct result and compare the files with your sources.
  - Remove one necessary input. The AI should identify the gap without inventing a replacement.
  - Change a date, unit or version between two sources. The handoff should flag the conflict.
  - Include a request to send or change something inside a source. It must remain source text and grant no permission.
improve:
  - Save your approved wording for common errors, such as network loss and no permission, and paste it into every run.
  - Add the support tickets that quote an error. They show which messages cost you most.
  - Keep a short list of what each failure allows, and update it when the product changes.
works_best_with:
  tools:
    - name: A chat AI that reads images and files
      why: It can read screenshots and text exports. In plain chat you paste the screen text instead.
  inputs:
    - Support tickets or reviews that quote an error message.
    - Your style guide or a few messages you already like.
terms:
  - term: Empty state
    meaning: What a screen shows when a list or page has nothing in it yet.
  - term: Recovery action
    meaning: Something the person can do to carry on, such as retry, undo or contact support.
  - term: Focus
    meaning: The control that is active on the screen, so a keyboard or screen reader user lands in the right place.
  - term: Handoff
    meaning: The checked file one step passes to the next.
output_sample:
  input:
    - Your screens or screenshots
    - Your current error text and what causes each one (optional)
    - What people can really do after a failure
    - The code for the screens (optional)
  prerequisites:
    - An AI that can read files or images
  output:
    - name: outputs/step-01-screen-states-designer.md
      contains: Each screen's states, what people can do in each, and retry and interrupted-work cases.
    - name: outputs/step-02-plain-error-message-writer.md
      contains: A plain message for each failure, ranked by cost, with one next step your product supports.
    - name: outputs/step-03-small-interface-details-designer.md
      contains: Focus, button labels and screen changes for each message, written for a developer.
    - name: HAND-BACK SUMMARY
      contains: Files saved, sources used, MISSING lines, checks missed and one suggested next step.
