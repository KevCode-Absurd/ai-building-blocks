  - {type: plan}
  - {type: copy_draft}
uses: [team-culture-memo-writer, standards-sheet-writer, recognition-plan-designer, policy-removal-test-planner]
steps:
  - {uses: team-culture-memo-writer, note: "What the team does, what it refuses to do, and what it does when two good things collide, written as behaviour in the manner of the Netflix culture deck."}
  - {uses: standards-sheet-writer, note: "Each behaviour turned into a standard anyone can check, with what good looks like and how often it is checked, the way Ray Kroc wrote standards."}
  - {uses: recognition-plan-designer, note: "How behaviour gets noticed and praised: in public, specific, often, tied to the standards, in the manner of Mary Kay Ash."}
  - {uses: policy-removal-test-planner, note: "The one rule the memo makes unnecessary, the risk if it goes, a safe trial without it and the sign that says bring it back, following Patty McCord."}
