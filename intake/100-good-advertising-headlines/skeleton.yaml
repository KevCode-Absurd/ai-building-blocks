# Workflow skeleton for 100 Good Advertising Headlines, and why they were so profitable (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: 100-good-advertising-headlines
source:
  title: "100 Good Advertising Headlines, and why they were so profitable"
  by: "Victor Schwab"
  kind: book
  rights: ideas-only
minds: [victor-schwab, john-caples]
workflow:
  slug: write-headlines-and-pick-the-winner-with-a-small-test
  name: "Write headlines and pick the winner with a small test"
  summary: "Give it your brief and product facts. Get checked headlines and a small keyed test that picks the winner."
  when: "you need a headline that earns its place and a fair way to choose between options."
  job: plan-ad-tests
  level: intermediate
steps:
  - name: "Ad headline writer"
    skill: ad-headline-writer
    job: copy
    from: "skill: ad-headline-writer"
    method: ["Set what the line may say", "List the material for each way in", "Write one line per way in", "Mark the line to test first"]
    inputs: [brief, product_data]
    outputs: [ad_copy]
    note: "Writes headlines for the brief's ideas and marks the one to test first."
  - name: "Headline promise checker"
    skill: headline-promise-checker
    job: analysis
    task: check-ads
    from: "100 Good Advertising Headlines, and why they were so profitable"
    method: ["Name the readers the headline should pick out", "Check that it promises a reward worth reading for", "Classify the reward as a gain or a loss avoided", "Add the speed, ease or cost where it is true", "Run the so-what test on the headline alone", "Check that any curiosity is tied to the product", "Rewrite weak lines and list the changes"]
    inputs: [ad_copy, offer!]
    outputs: [audit_report, hooks]
    note: "Whether it picks the right reader and promises a clear reward, with stronger versions. Reads the ad copy from the step before"
  - name: "Keyed headline test planner"
    skill: keyed-headline-test-planner
    job: research
    from: "They Laughed When I Sat Down at the Piano, Screenland 1926"
    method: ["Write many headlines for one offer", "Sort each into self-interest, news or curiosity", "Tie curiosity headlines to a clear promise", "Pick two or three appeals to test, one change at a time", "Key each version with its own code or reply path", "Run a small test before the larger spend", "Decide the winner on replies per cost and record why"]
    inputs: [hooks, offer]
    outputs: [plan, shortlist]
    note: "Headlines sorted by appeal, a keyed small test and a rule for picking the winner. Reads the hooks from the step before"
