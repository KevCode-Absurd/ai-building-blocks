# Workflow skeleton for The Almanack of Naval Ravikant (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: almanack-of-naval-ravikant
source:
  title: "The Almanack of Naval Ravikant"
  by: "Naval Ravikant and Eric Jorgenson"
  kind: book
  rights: ideas-only
  year: 2020
minds: [naval-ravikant]
workflow:
  slug: find-your-specific-knowledge-and-build-something-you-own
  name: "Find your specific knowledge and build something you own"
  summary: "Tell it what you do well. Get your specific knowledge, a plan to earn without trading hours and a partner check."
  when: "you trade hours for pay and want to build something that earns without you."
  job: think-and-decide
  level: beginner
steps:
  - name: "Specific knowledge finder"
    skill: specific-knowledge-finder
    job: analysis
    from: "The Almanack of Naval Ravikant, free book, 2020"
    method: ["List what you did almost effortlessly as a child or teenager and what friends or family noticed", "Add what you are curious about now and what feels like play to you but looks like work to others", "Mark which items cannot be taught in a class and which anyone could be trained to do", "Check each against the edge of a field, where few people have gone deep", "Pick the one or two with the most pull and name the basics you still need first (plain writing, numbers, persuasion)", "Give a cheap test for each, such as a small public project under your own name"]
    inputs: [question]
    outputs: [plan]
    note: "Your specific knowledge, with a way to test each"
  - name: "Hours-to-assets planner"
    skill: hours-to-assets-planner
    job: ops
    task: plan-strategy
    from: "The Almanack of Naval Ravikant, free book, 2020"
    method: ["Split how you earn into pay tied to hours and anything that earns without you", "Name which of three leverage kinds could carry each piece: other people, money, or code and media that cost nothing to copy", "Prefer the kind that needs no one's permission", "Turn one skill, name or piece of judgment into a product, such as a plan, course or tool", "Decide what you will put under your own name and what risk that carries", "Set your hourly rate and list work to stop doing or buy back at that rate", "Write one next step and a patient review date"]
    inputs: [plan, question!, performance_sheet!]
    outputs: [plan]
    note: "Which parts earn only while you work, and a plan to build something you own. Reads the plan from the step before"
  - name: "Long-term partner screener"
    skill: long-term-partner-screener
    job: ops
    task: lead-people
    from: "The Almanack of Naval Ravikant, free book, 2020"
    method: ["State the game and how often you would play it with this person", "Score intelligence, energy and integrity, with integrity weighted first, and cite what you have seen", "Flag cynicism or pessimism that tends to come true", "Test the history: who rounds in the other's favour, who pays small costs quietly", "Ask whether a one-off win here would cost the relationship", "Give a keep, test-first or walk-away call with the reason"]
    inputs: [plan, question]
    outputs: [audit_report]
    note: "A check on intelligence, energy and integrity, and whether it is a game worth repeating. Reads the plan from the step before"
