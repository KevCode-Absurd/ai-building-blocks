# Workflow skeleton for Autobiography of Andrew Carnegie (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: autobiography-of-andrew-carnegie
source:
  title: "Autobiography of Andrew Carnegie"
  by: "Andrew Carnegie"
  kind: book
  rights: public-domain
  year: 1920
minds: [andrew-carnegie, john-d-rockefeller]
workflow:
  slug: cost-every-step-and-turn-your-waste-into-profit
  name: "Cost every step and turn your waste into profit"
  summary: "Describe how you make or deliver your product. Get a cost for every step and a price on each kind of waste."
  when: "you do not know which steps cost you the most or what you throw away."
  job: plan-strategy
  level: intermediate
steps:
  - name: "Step cost tracker"
    skill: step-cost-tracker
    job: ops
    from: "Autobiography of Andrew Carnegie"
    method: ["List every step from raw material to sale", "Put a weight, a count or a timed measure on each step", "Record cost per product each month, not once a year", "Compare people, shifts or batches for who saved and who wasted", "Rank products by what they really earn after all steps", "Name the lines that carry the business and the lines that drain it", "Pick the one waste to fix first and set the next count date"]
    inputs: [question, performance_sheet!]
    outputs: [audit_report, plan]
    note: "A cost for each step, a weekly count sheet and the lines that drain you"
  - name: "Waste and by-product finder"
    skill: waste-and-by-product-finder
    job: ops
    from: "Random Reminiscences of Men and Events"
    method: ["Walk the whole process and list everything thrown away or left idle", "Measure each in units, hours or money per month", "Ask who would buy it or what it could feed", "Ask what a rival wastes that you could buy cheaply", "Rank by money recovered against effort", "List all materials, scrap and offcuts per job", "Value each by the labour that went into it, not only its price", "Note what is reclaimed and what it costs to reclaim"]
    inputs: [audit_report!, plan!, question, performance_sheet!]
    outputs: [audit_report, plan]
    note: "Each item priced as a possible product, reuse or saving. Reads the audit report from the step before"
