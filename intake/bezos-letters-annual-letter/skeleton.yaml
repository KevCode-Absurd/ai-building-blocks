# Workflow skeleton for Jeff Bezos's shareholder letters 1997 to 2020 (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: bezos-letters-annual-letter
source:
  title: "Letters to shareholders, 1997 to 2020"
  by: "Jeff Bezos"
  kind: letter
  rights: ideas-only
minds: [jeff-bezos]
workflow:
  slug: write-an-annual-letter-that-sets-long-term-priorities
  name: "Write an annual letter with long-term priorities and metrics"
  summary: "Paste your year's numbers. Get principles, input metrics, a cash check, a value tally and a draft letter."
  when: "you must write to your team, partners or owners and want to set long-term priorities with honest numbers."
  job: lead-people
  level: advanced
steps:
  - name: "Write the long-term principles"
    skill: long-term-principles-writer
    job: strategy
    task: plan-strategy
    from: "1997 letter, the list of how we decide; 2003 letter, owners versus tenants"
    method: ["List the decisions where the short and long term pull apart", "For each, write one plain promise: what you will do when forced to choose", "Cover customers, long-term versus short-term, how you measure, how you treat failure, cash and cost, and people", "State how you will share your reasoning when you make a bold choice", "Say plainly that this is your approach, not the only right one", "Cut any promise you would not keep in a bad year"]
    inputs: [question]
    outputs: [copy_draft]
    note: "A short list of promises that explain how you will choose."
  - name: "Pick the input metrics that matter"
    skill: input-metric-picker
    job: analysis
    task: plan-strategy
    from: "2009 and 2013 letters, focusing on controllable inputs; 2016 letter, resisting proxies"
    method: ["List the outputs you report today", "For each, name the inputs you control that cause it", "Choose three to six inputs that touch the customer directly", "Test each metric: could it rise while the real goal falls?", "Keep one output as a check on whether the inputs are right", "Give each input an owner, a target and a review date"]
    inputs: [performance_sheet, copy_draft!]
    outputs: [plan]
    note: "Controllable inputs, one check output and a proxy test for each."
  - name: "Check the cash behind the earnings"
    skill: cash-versus-earnings-checker
    job: analysis
    task: money-and-investing
    from: "2004 letter, free cash flow per share and the machine example; 2001 letter, why cash"
    method: ["Take profit, depreciation, working capital and capital spending for each year", "Work out operating cash flow and subtract capital spending to get free cash flow", "Compare free cash flow to earnings over the same years", "Check what growth costs in cash and whether the growth pays it back", "Count the change in shares or owners' stakes, and work out cash per share", "Mark missing figures and say what the cash view changes"]
    inputs: [performance_sheet, plan!]
    outputs: [audit_report]
    note: "Free cash flow next to earnings, with what growth costs."
  - name: "Tally the value you create"
    skill: value-created-tally-builder
    job: analysis
    task: plan-strategy
    from: "2020 letter, create more than you consume"
    method: ["List every group you touch: owners, staff, partners or sellers, customers", "For each, pick one measure that works as the bottom line of their dealings with you", "Use cautious estimates and write the assumption beside each number", "Value customers on one thing only, such as time saved or cost cut", "Add the groups up and note where the number is weakest", "Name the group you serve least well and one thing to change"]
    inputs: [performance_sheet, plan!]
    outputs: [audit_report]
    note: "A value figure for each group, with assumptions and the weakest link."
  - name: "Write the letter"
    skill: annual-letter-writer
    job: copy
    task: speak-and-persuade
    from: "1997 to 2020 letters, the shape of an annual letter"
    method: ["Open with the result that matters and the honest bad news", "State what you will do for the long term, using the principles", "Show the input metrics and what moved", "Show the cash view and the value tally", "Name the mistakes, what they cost and what you learned", "Say what you will do next year and what you will stop", "End with thanks and the line that ties back to your first letter"]
    inputs: [copy_draft, plan!, audit_report!]
    outputs: [copy_draft]
    note: "A letter that carries the principles, metrics, cash view and tally."
