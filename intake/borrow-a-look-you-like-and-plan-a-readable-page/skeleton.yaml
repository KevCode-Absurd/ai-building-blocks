# Workflow skeleton chaining library skills (docs/INTAKE.md).
id: borrow-a-look-you-like-and-plan-a-readable-page
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: borrow-a-look-you-like-and-plan-a-readable-page
  name: "Borrow a look you like and plan a readable page"
  summary: "Give it designs you like and your page text. Get the look as notes, a grid and type plan, and checked colours."
  when: "you can point at designs you like but cannot say what makes them work."
  job: design-work
  level: intermediate
steps:
  - name: "Design style analyst"
    skill: design-style-analyst
    job: ops
    from: "skill: design-style-analyst"
    method: ["Measure the colours from each image", "Describe type, spacing and layout", "Describe mood, imagery and effects", "Note where references disagree and write one profile"]
    inputs: [image]
    outputs: [design_direction]
    note: "Turns your references into one style profile you can reuse."
  - name: "Page grid and type planner"
    skill: page-grid-and-type-planner
    job: design
    from: "skill: page-grid-and-type-planner"
    method: ["Say what the page means and who reads it", "Set margins and a grid", "Pick one or two typefaces and sizes", "Plan scale and white space for order", "Lay out each page and cut anything with no job"]
    inputs: [brief, copy_draft!, brand_brain!, design_direction!]
    outputs: [page_layout_spec, design_direction]
    note: "Lays out your content in the borrowed look. Reads the style profile from the step before."
  - name: "Colour contrast checker"
    skill: colour-contrast-checker
    job: ops
    from: "skill: colour-contrast-checker"
    method: ["Pair text colours with backgrounds", "Measure the contrast ratio in light and dark themes", "Mark pass or fail", "Suggest the closest passing colour"]
    inputs: [design_direction]
    outputs: [audit_report]
    note: "Checks the final colours are readable. Reads the design direction the planner updated."
