# Workflow skeleton for The Warren Buffett Way (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
# Method analysis only. Not personal financial advice.
id: buffett-way-twelve-tenets
source:
  title: "The Warren Buffett Way (Second Edition)"
  by: "Robert G. Hagstrom"
  kind: book
  rights: ideas-only
  year: 2005
minds: [warren-buffett]
workflow:
  slug: find-out-if-a-business-is-worth-owning-long-term
  name: "Find out if a business is worth owning long term"
  summary: "Give it a business and its figures. Get a pass, fail or too-hard call on ten tests, and what to check next."
  when: "you are weighing a business to buy or own a share of, and want a plain pass, fail or too-hard call before you look at price."
  job: money-and-investing
  level: advanced
steps:
  - name: Test for a lasting edge
    skill: business-power-tester
    job: strategy
    from: "Chapter 5, business tenet three (franchise and moat)"
    method: ["Ask if the product is needed or wanted, has no close substitute and is free of price rules", "Ask if it can raise prices without losing customers", "Separate a franchise from a commodity business", "Ask how long the edge lasts"]
    inputs: [question, competitor_set!]
    outputs: [audit_report]
    note: "Judges whether the edge is real and how long it should last."
  - name: Check it is inside what you understand
    skill: circle-of-competence-sorter
    job: analysis
    task: money-and-investing
    from: "Chapter 5, business tenet one and the circle of competence"
    method: ["Explain how the business makes money in a few plain sentences, or mark it too hard", "Test what you can say about costs, rivals and the next ten years", "Write down the edge you have over other buyers", "Sort it as yes, no or too tough"]
    inputs: [audit_report!, question]
    outputs: [audit_report]
    note: "Reads the edge test, then asks whether you understand the business well enough to judge it."
  - name: Check the record is steady
    skill: steady-track-record-checker
    job: analysis
    task: money-and-investing
    from: "Chapter 5, business tenet two"
    method: ["Look at five to ten years of products, prices and results for a steady pattern", "Flag any change of direction, big restructuring or turnaround, which raises the odds of error", "Ask what has changed and what has stayed the same", "Say whether the past is a fair guide to the next ten years"]
    inputs: [audit_report, question!]
    outputs: [audit_report]
    note: "Tests whether past results are a fair guide, and flags a business that keeps changing course."
  - name: Check the people running it
    skill: owner-minded-management-checker
    job: analysis
    task: money-and-investing
    from: "Chapter 6, management tenets four to six"
    method: ["Test what managers do with spare cash: reinvest above the cost of money, buy back shares below value, or pay it out", "Compare old annual reports with what happened, and see whether mistakes are admitted", "Look for copying of rivals, deals made to keep up and pay that rewards size", "Note red flags such as hard footnotes and bold forecasts"]
    inputs: [audit_report, question!]
    outputs: [audit_report]
    note: "Reads the record of how managers used cash and told owners the truth."
  - name: Check returns and margins
    skill: return-on-equity-and-margin-checker
    job: analysis
    task: money-and-investing
    from: "Chapter 7, financial tenets seven, nine and ten"
    method: ["Work out return on equity from operating profit, without gains or losses on holdings and without heavy debt", "Average four or five years, not one", "Compare profit margins and cost habits with rivals", "Run the one-dollar test: did each dollar kept add at least a dollar of value"]
    inputs: [performance_sheet, audit_report!]
    outputs: [audit_report]
    note: "Uses your figures to test returns, margins and what kept profits earned."
  - name: Work out owner earnings
    skill: owner-earnings-calculator
    job: analysis
    task: money-and-investing
    from: "Chapter 7, financial tenet eight"
    method: ["Start with profit after tax", "Add back depreciation and other non-cash charges", "Subtract the money the business must spend each year to stay where it is", "Subtract extra working capital growth needs, and give a range"]
    inputs: [performance_sheet, audit_report!]
    outputs: [audit_report]
    note: "Turns the accounts into the cash an owner could really take out."
  - name: Score the tests
    skill: business-tenet-scorecard-writer
    job: analysis
    task: money-and-investing
    from: "Chapter 4 end and Chapter 8, putting it all together"
    method: ["List each of the ten business, management and financial tests with pass, fail or unknown", "Count the fails and unknowns that matter most", "Say whether it deserves a price check, needs more digging or is not worth the time", "List what to read or ask next"]
    inputs: [audit_report]
    outputs: [audit_report]
    note: "One page: each test as pass, fail or unknown, and whether a price check is worth your time."
