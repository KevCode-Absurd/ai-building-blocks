id: build-a-buyer-profile-from-interviews-and-reviews
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: build-a-buyer-profile-from-interviews-and-reviews
  name: Build a buyer profile from interviews and reviews
  summary: Give it your orders and reviews. Get buyer interviews, a job-based buyer profile and a brief writers can use.
  when: you sell to a mix of people and need one real buyer, in their own words, before you write ads or pages.
  job: understand-customers
  level: intermediate
steps:
  - name: Order-record buyer interview guide
    skill: order-record-buyer-interview-guide
    job: research
    from: library
    method:
      - Choose recent buyers
      - Frame the call as building a timeline,
      - Ask about the day
      - Probe the old product
      - Ask who else had a say
      - Write gap questions only where the order facts leave a gap
      - After 5 to 8 calls, cluster the stories
    inputs:
      - spreadsheet
      - product_data
    outputs:
      - document
    note: Picks recent buyers from your order records and writes the questions to ask each one.
  - pause: Interview five to eight recent buyers and write notes after each. Collect reviews and forum posts from the same group.
  - name: Forum and review avatar digger
    skill: forum-and-review-avatar-digger
    job: research
    from: library
    method:
      - Warm up (optional, 10 to 15 minutes, before the clock starts)
      - Run the 30-second test
      - Write the search phrases as the buyer would type them
      - Mark up the quotes
      - Look for confession forums
      - Write the one-page buyer sketch
      - Say what comes next
    inputs:
      - question
      - voc_reviews!
    outputs:
      - voc_reviews
      - persona
    note: Mines your interview notes, reviews and forum posts for the words this group uses.
  - name: Job-based avatar builder
    skill: job-based-avatar-builder
    job: research
    from: library
    method:
      - Group stories, not segments
      - Run the level test
      - Split the job into three sides
      - List what they stop using to buy yours
      - Write the trigger timeline
      - Add a not-for line
      - Stop at the clusters the stories support
    inputs:
      - voc_reviews
      - product_data
    outputs:
      - persona
    note: Turns the quoted words into a buyer profile with a trigger, a job and proof. Reads the words from the step before.
  - name: Buyer brief writer
    skill: buyer-brief-writer
    job: copy
    from: library
    method:
      - Find the moment
      - Sort the evidence into four forces
      - Place their awareness
      - Pick the force to work on
      - Collect the words
      - Write the job line
      - Check the result before you hand it on
    inputs:
      - voc_reviews
      - brand_brain!
    outputs:
      - brief
    note: Boils the findings to a half-page brief for ad and page writers. Reads the quoted words from the digger step.
  - name: Avatar fit checker
    skill: avatar-fit-checker
    job: research
    from: library
    method:
      - Run the 30-second test
      - Check the fixes are named
      - List the promises they are sick of hearing
      - Hook check
      - Outsider test
      - Targeting note
      - Optional stand-in test
    inputs:
      - persona
      - copy_draft!
      - landing_page!
      - voc_reviews!
    outputs:
      - audit_report
    note: Checks whether your current ad or page sounds like this buyer. Reads the profile from the step before.
