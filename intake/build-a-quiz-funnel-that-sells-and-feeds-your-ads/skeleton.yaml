# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md). Our words.
id: build-a-quiz-funnel-that-sells-and-feeds-your-ads
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: build-a-quiz-funnel-that-sells-and-feeds-your-ads
  name: "Build a quiz funnel that sells and feeds your ads"
  summary: "Give it your product and offer. Get a quiz page that sorts buyers, plus the angles their answers say to advertise."
  when: "you pay for cold traffic in a product niche where buyers need to be guided to the right choice."
  job: write-landing-page
  level: intermediate
steps:
  - name: "Copy foundation docs builder"
    skill: copy-foundation-docs-builder
    job: research
    from: "library"
    method: ["Set the AI up", "Save the result as a research document", "Build the offer brief", "Pull four to six buyer archetypes", "Save them as PDFs once"]
    inputs: [product_data, voc_reviews!, copy_draft!]
    outputs: [persona, brief]
    note: "Writes the buyer profile and brief the quiz questions and results will lean on."
  - name: "Store quiz funnel builder"
    skill: store-quiz-funnel-builder
    job: page
    from: "library"
    method: ["Check fit", "Build from research, not swipes", "Seed beliefs and pre-handle objections in the questions", "Decide the email step", "Protect the buyer"]
    inputs: [persona, offer, product_data!, store_capture!]
    outputs: [landing_page, plan]
    note: "Builds the quiz, its result pages and offer from the buyer profile and brief."
  - pause: "Send paid traffic through the quiz for a week or two and export the answers and drop-off numbers."
  - name: "Quiz answers to ad angles reader"
    skill: quiz-answers-to-ad-angles-reader
    job: analysis
    from: "library"
    method: ["Check the sample", "Read awareness from \"what have you tried\"", "Use your own data over competitor ads", "Feed the report back", "Score the data"]
    inputs: [spreadsheet, performance_sheet!]
    outputs: [angle_library, audit_report]
    note: "Reads the exported answers for the most common problems and words, and turns them into ranked ad angles."
  - name: "Ad angle planner"
    skill: ad-angle-planner
    job: copy
    from: "library"
    method: ["Brand brain", "If something is missing, advise, don't block", "Others make it", "Everyone shows how", "Check it"]
    inputs: [brief, brand_brain!]
    outputs: [brief]
    note: "Turns the top quiz angles into a campaign brief for the next round of ads."
