# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: build-a-talk-around-one-real-case
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: build-a-talk-around-one-real-case
  name: "Build a talk around one real case"
  summary: "Give it your topic and notes. Get one case, a pitch story with a vision and an order with stakes first."
  when: "you must pitch an idea to people who do not see it yet, and have notes but no way in."
  job: speak-and-persuade
  level: intermediate
steps:
  - name: "Case-first story builder"
    skill: case-first-story-builder
    job: copy
    from: "skill: case-first-story-builder"
    method: ["Pick the one person or event that holds the whole idea", "Test what everyone assumes and add a case that cuts the other way", "Outline from a small scene to the idea and the flip"]
    inputs: [question, voc_reviews!]
    outputs: [brief]
    note: "Finds the case and outline your talk rests on."
  - name: "Idea buy-in pitch planner"
    skill: idea-buy-in-pitch-planner
    job: copy
    from: "skill: idea-buy-in-pitch-planner"
    method: ["Write the idea, the ask and how each person will react at four stages", "Write a story under two minutes and a picture of life after the change", "Pick small measures that cut the risk of a yes"]
    inputs: [brief, question, persona!]
    outputs: [plan, script]
    note: "Builds the pitch story and vision on the case from the step before."
  - name: "Talk tension planner"
    skill: talk-tension-planner
    job: copy
    from: "skill: talk-tension-planner"
    method: ["Find the news the room will care about most", "Move it to the opening and add one true clock", "Mark slides that only explain, cut puzzles and keep one real twist"]
    inputs: [brief, copy_draft!]
    outputs: [plan]
    note: "Reorders the outline so the room knows the stakes in the first minute. Reads the case brief from step one."
