# Workflow skeleton chaining skills already in the AI Blocks library (docs/INTAKE.md).
id: build-a-vip-program-for-your-best-customers
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: build-a-vip-program-for-your-best-customers
  name: "Build a VIP program for your best customers"
  summary: "Give it your order history and brand file. Get a best-customer profile, a VIP program and personal touches."
  when: "a small group of customers brings most of your profit and you want to keep them."
  job: keep-customers
  level: advanced
steps:
  - name: "Best and worst customer profiler"
    skill: best-and-worst-customer-profiler
    job: analysis
    from: "library"
    method: ["Check the data fits", "Rank by gross profit", "Split into groups", "Profile each group", "Check angle fit", "Split by discount code"]
    inputs: [performance_sheet, voc_reviews!]
    outputs: [audit_report, persona]
    note: "Shows what your best customers have in common."
  - pause: "Choose the VIP rule (number of orders or spend) from the profile and export the orders for customers who meet it."
  - name: "Loyalty and VIP program designer"
    skill: loyalty-and-vip-program-designer
    job: offer
    from: "library"
    method: ["Check the bottleneck first and make a go or wait call", "Check the basics", "Measure the top 20 percent", "Rank and name", "Set tiers from the store's own spend spread", "Choose status and access over discounts"]
    inputs: [performance_sheet, brand_brain!]
    outputs: [plan, copy_draft]
    note: "Designs the tiers and perks for the group the profile described."
  - pause: "Set up the tiers and invite the first VIPs, then wait a month and export their orders."
  - name: "Top customer touch planner"
    skill: top-customer-touch-planner
    job: ops
    from: "library"
    method: ["Check the base", "Rank and pick", "Run the 20 customers exercise", "Pick the touch by cost", "Write each note by hand and name a past purchase", "Call the highest spenders"]
    inputs: [performance_sheet, brand_brain!]
    outputs: [plan, copy_draft]
    note: "Plans the personal touches for the VIPs, using how they responded to the program."
