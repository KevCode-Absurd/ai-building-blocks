# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Skills run in order, each reading what the one before made.
id: build-shopping-by-margin-tune-it-weekly-and-fix-titles
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: build-shopping-by-margin-tune-it-weekly-and-fix-titles
  name: "Build Shopping by margin, tune it weekly and fix titles"
  summary: "Give it your products with margins and ROAS history. Get Shopping tiers with targets, weekly product calls and search-led titles."
  when: "your Shopping spend treats every product alike and you want each one to earn its keep."
  job: run-google-ads
  level: intermediate
steps:
  - name: "Margin tier Shopping builder"
    skill: margin-tier-shopping-builder
    job: ads
    from: "library"
    method: ["Check you have enough products and sales to split", "Choose tiers by margin or by past return", "Set each target from break-even, not an average", "Split the budget and decide the Performance Max role"]
    inputs: [product_data, performance_sheet]
    outputs: [plan]
    note: "Sets up the tiers and targets the rest of the work tunes."
  - pause: "Build the tiers in Google Ads and run them for two weeks. Then export the weekly Shopping report with search terms."
  - name: "Shopping campaign tuner"
    skill: shopping-campaign-tuner
    job: analysis
    from: "library"
    method: ["Check each product has enough clicks to judge", "Sort search terms into negatives and feed problems", "Read impression share and click share", "Write the weekly edit and score the waste"]
    inputs: [performance_sheet, product_data!]
    outputs: [audit_report, plan]
    note: "Reads the first two weeks and says which products to cut, feed, bid up or fund."
  - pause: "Export the converting search terms for the products it said to feed, and list those products with their current titles."
  - name: "Shopping feed title writer"
    skill: shopping-feed-title-writer
    job: copy
    from: "library"
    method: ["Take the real search words that convert", "Pick one title order for the whole catalogue", "Write titles and descriptions that stay true to the product", "Roll out in small batches and watch the results"]
    inputs: [product_data, performance_sheet!, product_photos!]
    outputs: [copy_draft]
    note: "Fixes the weak titles the weekly read pointed to."
