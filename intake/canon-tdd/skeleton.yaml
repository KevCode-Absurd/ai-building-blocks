# Workflow skeleton for Canon TDD (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: canon-tdd
source:
  title: "Canon TDD"
  by: "Kent Beck"
  kind: blog
  rights: ideas-only
  year: 2023
minds: [kent-beck]
workflow:
  slug: make-a-code-change-in-small-tested-steps-with-ai
  name: "Make a code change in small tested steps with AI"
  summary: "Describe the change you want. Get a test list, a change split into small steps and rules for your AI coding helper."
  when: "you are changing code, with or without an AI helper, and want each step small and safe."
  job: build-software
  level: advanced
steps:
  - name: "Test list writer"
    skill: test-list-writer
    job: ops
    from: "Canon TDD, 11 December 2023"
    method: ["State the behaviour change in one line", "List the cases it must handle, including edge cases and old behaviour that must stay", "Keep implementation choices off the list", "Order the cases so the smallest, most teaching one comes first", "Mark which case to turn into a real test now", "Add new cases as they turn up and cross off passed ones"]
    inputs: [question]
    outputs: [plan]
    note: "An ordered list of cases to test, smallest first, before any code"
  - name: "Structure and behaviour change splitter"
    skill: structure-and-behaviour-change-splitter
    job: ops
    from: "Reversible structure changes, 12 August 2022"
    method: ["Read the change and label each edit as structure (how it is arranged) or behaviour (what it does)", "Check how easy each one is to undo", "Group the structure edits into small steps that leave behaviour alone", "Put behaviour edits in their own steps", "Say which tidy-ups make the behaviour change easier, and which can wait or be skipped", "Order the steps and say when to run tests between them"]
    inputs: [plan, question, copy_draft!]
    outputs: [plan]
    note: "It split into tidy-ups and new-behaviour steps, each small enough to review alone. Reads the plan from the step before"
  - name: "AI coding agent rules writer"
    skill: ai-coding-agent-rules-writer
    job: ops
    task: set-up-ai
    from: "Augmented Coding: Beyond the Vibes, 25 June 2025"
    method: ["Write the ordered test list as a plan file", "Set a one-word command meaning take the next unmarked test only", "Write standing rules: simplest failing test, least code, refactor only on green", "Keep structure and behaviour changes in separate commits", "Allow commits only when tests pass and warnings are clear", "List warning signs to watch: loops, unasked features, deleted or disabled tests", "Say when to take back the design from the agent"]
    inputs: [plan, question]
    outputs: [plan]
    note: "A plan file and standing rules that make an AI coding agent work one test at a time. Reads the plan from the step before"
