# Workflow skeleton built from existing AI Blocks library skills (docs/INTAKE.md).
id: catch-up-on-your-week-close-loops-and-plan-tomorrow
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: catch-up-on-your-week-close-loops-and-plan-tomorrow
  name: "Catch up on your week, close loops and plan tomorrow"
  summary: "Connect your chat, email and files. Get a digest of what you missed, open loops closed and a protected day."
  when: "you have been away or buried and want to know what matters, then start the next day with a plan."
  job: organise-work
  level: beginner
steps:
  - name: "Get a digest of what you missed"
    skill: activity-digest-writer
    job: ops
    from: library
    method: ["Pick the time window: a day, a week or a start date", "Check which of your tools are connected", "Scan mentions, messages, tasks and recent documents in each", "Group what you find by topic and pull out decisions and action items"]
    inputs: [tool_connection]
    outputs: [brief]
    note: "Starts from your connected tools. Makes a short digest of mentions, decisions and action items."
  - name: "Run the weekly review"
    skill: weekly-review-guide
    job: ops
    from: library
    method: ["Collect loose items from the digest and your notes", "Sort every open loop into next action, waiting for, someday or trash", "Review stalled projects and the calendar ahead", "Write the plan for next week"]
    inputs: [brief]
    outputs: [plan]
    note: "Uses the action items and decisions from the digest as the loops to close."
  - name: "Plan one protected day"
    skill: deep-work-day-planner
    job: ops
    from: library
    method: ["List tomorrow's tasks with a rough time for each", "Mark each task deep or shallow", "Put the deep tasks in the earliest blocks of 90 minutes or more", "Batch shallow work into two windows and cap deep work at four hours"]
    inputs: [brief]
    outputs: [plan]
    note: "Takes the tasks from the digest and the top items from the weekly plan, and puts the important ones first."
