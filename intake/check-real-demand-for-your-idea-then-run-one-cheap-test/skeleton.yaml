id: check-real-demand-for-your-idea-then-run-one-cheap-test
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: check-real-demand-for-your-idea-then-run-one-cheap-test
  name: "Check demand for your idea, then run one cheap test"
  summary: "Give it your idea. Get what people say about the problem, the fact that could kill it and a cheap test."
  when: "you have a product idea and want proof of demand before you spend on building it."
  job: test-an-idea
  level: intermediate
steps:
  - name: "Find the pain people post about"
    skill: product-demand-researcher
    job: ops
    from: "skill: product-demand-researcher"
    method: ["Turn the idea into search phrases and near-synonyms", "Pull posts and comments from public sites where people talk about the problem", "Group the complaints, workarounds and buying signals", "Score demand by how often, how strongly and how recently it shows up"]
    inputs: [question]
    outputs: [voc_reviews]
    note: "Starts from your idea written as a question and returns the real words people use, with links."
  - name: "Write a buyer brief from the evidence"
    skill: buyer-brief-writer
    job: copy
    from: "skill: buyer-brief-writer"
    method: ["Find the moment that sends people looking", "Sort the evidence into the forces for and against a switch", "Pick the force that matters most", "Write the job in one line with the buyer's own words"]
    inputs: [voc_reviews, brand_brain!]
    outputs: [brief]
    note: "Turns the quotes from the step before into a short brief of who the buyer is and what they are trying to get done."
  - name: "Try to kill the idea"
    skill: business-idea-killer
    job: ops
    from: "skill: business-idea-killer"
    method: ["Check the idea against a list of known ways ideas die", "Run it through five hard filters", "Look for live proof that people pay in this space", "Give a verdict: dead with the reason, or alive with the cheapest test left"]
    inputs: [brief]
    outputs: [audit_report]
    note: "Reads the buyer brief and looks for the one fact that ends the idea, or names the test it still has to pass."
  - name: "Design a cheap test with a pass mark"
    skill: pretotype-experiment-designer
    job: ops
    from: "skill: pretotype-experiment-designer"
    method: ["Write the claim as: at least this share of these people will do this", "Suggest two or three tests such as a landing page, a pre-order or a fake door", "Give each test a method, a metric and a pass mark", "Keep the effort small and the commitment real"]
    inputs: [brief]
    outputs: [plan]
    note: "Builds tests around the buyer brief and the weak point the kill check found."
  - pause: "Run the cheapest test for one to two weeks and write down the numbers against the pass mark. Stop if it fails."
