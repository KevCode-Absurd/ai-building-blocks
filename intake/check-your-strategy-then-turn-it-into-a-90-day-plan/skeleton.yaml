id: check-your-strategy-then-turn-it-into-a-90-day-plan
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: check-your-strategy-then-turn-it-into-a-90-day-plan
  name: "Check your strategy, then turn it into a 90-day plan"
  summary: "Give it your strategy. Get what is hollow, a marketing plan built on what holds and a 90-day plan with owners."
  when: "you have a strategy or goal and need a plan your team can start on Monday."
  job: plan-strategy
  level: intermediate
steps:
  - name: "Check the strategy for hollow parts"
    skill: real-strategy-checker
    job: ops
    from: "skill: real-strategy-checker"
    method: ["Look for a clear diagnosis of the real problem", "Look for a guiding policy that rules things out", "Check that the actions fit together and back the policy", "Flag fluff, vague goals and wish lists"]
    inputs: [brief]
    outputs: [audit_report, plan]
    note: "Starts from your strategy and returns a diagnosis, a policy and the actions that hold up."
  - pause: "Fix what the check called hollow. Then write a half-page brief: the problem, the policy you chose, who you sell to and your budget."
  - name: "Write the marketing plan"
    skill: marketing-plan-writer
    job: ops
    from: "skill: marketing-plan-writer"
    method: ["Gather facts about the business, the buyer and what is already running", "Plan each stage from awareness to referral", "Set a 90-day roadmap and a 12-month outlook", "List the numbers to track and who owns what"]
    inputs: [brand_brain!, brief]
    outputs: [plan]
    note: "Builds the plan from the fixed strategy brief you wrote after the check."
  - name: "Turn it into a 90-day plan"
    skill: 90-day-plan-builder
    job: ops
    from: "skill: 90-day-plan-builder"
    method: ["Read the chosen plan and its outcome", "Split it into three to six workstreams with one owner each", "Work back from day 90 to weekly milestones", "Set check-in times, a risk list and the signs that mean stop"]
    inputs: [plan]
    outputs: [plan]
    note: "Takes the marketing plan from the step before and breaks it into weekly steps, owners and check-ins."
