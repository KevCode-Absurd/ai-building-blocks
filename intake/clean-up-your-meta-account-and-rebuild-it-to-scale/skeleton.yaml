# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Skills run in order, each reading what the one before made.
id: clean-up-your-meta-account-and-rebuild-it-to-scale
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: clean-up-your-meta-account-and-rebuild-it-to-scale
  name: "Clean up your Meta account and rebuild it to scale"
  summary: "Give it your campaigns and results. Get campaigns kept or cut, a simpler layout with budgets and a spend ladder."
  when: "your Meta account has grown messy and you cannot tell which campaigns earn their place."
  job: launch-and-scale-ads
  level: intermediate
steps:
  - name: "Meta campaign purpose checker"
    skill: meta-campaign-purpose-checker
    job: ads
    from: "library"
    method: ["Write one sentence of purpose for each campaign", "Check frequency, attribution and testing structure", "Scan for common setup errors and name mismatches", "Mark each campaign keep, merge or cut and score the setup"]
    inputs: [performance_sheet, store_capture!]
    outputs: [audit_report]
    note: "Decides which campaigns stay before anything is rebuilt."
  - pause: "Pause or merge the campaigns marked cut or merge. Then export 30 days of spend, products and margins for what is left."
  - name: "Meta account structure planner"
    skill: meta-account-structure-planner
    job: ads
    from: "library"
    method: ["Set your spend tier", "Answer five questions about categories, margins and buyers", "Default to fewer campaigns and split only for a good reason", "Set ads per ad set and KPIs for each"]
    inputs: [performance_sheet, product_data, brand_brain!]
    outputs: [plan]
    note: "Plans the simpler layout for the campaigns that survived the clean-up."
  - pause: "Build the layout and run it for four weeks. Then export results by ad set and note your cash and stock."
  - name: "Meta scaling campaign planner"
    skill: meta-scaling-campaign-planner
    job: ads
    from: "library"
    method: ["Work out break-even ROAS", "Judge scale on whole-business numbers", "Find each ad set's spend ceiling", "Build the spend ladder and decide if a scaling campaign pays"]
    inputs: [performance_sheet, product_data]
    outputs: [plan]
    note: "Turns the winning ad sets in the new layout into a spend ladder."
