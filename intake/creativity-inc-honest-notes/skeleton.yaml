# Workflow skeleton for Creativity, Inc. (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: creativity-inc-honest-notes
source:
  title: "Creativity, Inc."
  by: "Ed Catmull with Amy Wallace"
  kind: book
  rights: ideas-only
  year: 2014
minds: [ed-catmull]
workflow:
  slug: get-honest-notes-on-rough-work-and-a-plan-to-fix-it
  name: "Get honest notes on rough work and a fix plan"
  summary: "Give it rough work and your reviewers. Get a safe review, sharp problem notes and a plan to fix it."
  when: "your work is stuck or still rough and the feedback you get is either polite or bossy."
  job: lead-people
  level: intermediate
steps:
  - name: Plan a review session where peers tell the truth
    skill: peer-feedback-session-planner
    job: ops
    task: lead-people
    from: "Chapter 5, Honesty and Candor"
    method: ["Choose reviewers who have faced the same kind of problem and hold no power over the owner", "Keep the most senior voices quiet at the start", "Set the rule that notes name problems and the owner keeps the decision", "Set a follow-up date"]
    inputs: [question, copy_draft!]
    outputs: [plan, feedback_notes]
    note: "Who sits in the room, who stays quiet first, and the rule that notes name problems and not fixes."
  - pause: "Hold the session and write down every note as it is said, with who said it."
  - name: Turn raw comments into good notes
    skill: good-note-sharpener
    job: copy
    task: lead-people
    from: "Chapter 5, what a good note is"
    method: ["Sort each comment into problem, fix, order, vague feeling or comment about the person", "Rewrite each into a specific problem tied to a place in the work and what the reader felt there", "Keep any fix only as an illustration, clearly marked", "Drop repeats and merge notes that point at the same thing"]
    inputs: [feedback_notes, copy_draft!]
    outputs: [feedback_notes]
    note: "Raw comments rewritten as specific problem notes, with fixes marked as examples only."
  - name: Find what is really causing each problem
    skill: problem-root-cause-tracer
    job: analysis
    task: lead-people
    from: "Chapter 5, the knee and the fallen arch, and the wrong symptom"
    method: ["For each problem, list places earlier in the work that could be the cause", "Test whether fixing only the visible spot would hold", "Mark notes where the group felt something was wrong but may have named the wrong symptom", "Rank causes by how many problems they would explain"]
    inputs: [feedback_notes, copy_draft!]
    outputs: [audit_report]
    note: "Each problem traced to its likely cause, with the notes that may have pointed at the wrong symptom."
  - name: Headline the notes and plan the next version
    skill: revision-headline-planner
    job: ops
    task: lead-people
    from: "Chapter 5, headlining, and Chapter 6, signs a project is stuck"
    method: ["Boil the notes down to a few headlines the owner can hold in their head", "Ask what to blow up, what to go back on and what the owner still loves", "Write the owner's choices, with the right to decline any note", "Set the next review and the stuck test: the same work back after three months is not okay"]
    inputs: [audit_report, plan!]
    outputs: [plan]
    note: "Three to five headlines, what to blow up and what to keep, and the date of the next look."
