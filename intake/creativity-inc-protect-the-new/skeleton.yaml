# Workflow skeleton for Creativity, Inc. (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: creativity-inc-protect-the-new
source:
  title: "Creativity, Inc."
  by: "Ed Catmull with Amy Wallace"
  kind: book
  rights: ideas-only
  year: 2014
minds: [ed-catmull]
workflow:
  slug: protect-a-rough-new-idea-until-it-is-ready
  name: "Protect a rough new idea until it is ready"
  summary: "Describe your new idea and the pressure on it. Get a verdict on early or broken, and a plan that shields it."
  when: "a new idea or project looks ugly and unfinished and deadlines or doubters are closing in."
  job: lead-people
  level: intermediate
steps:
  - name: Map who is pulling on the idea
    skill: incentive-checker
    job: analysis
    task: lead-people
    from: "Chapter 7, the Hungry Beast and balance between groups"
    method: ["List every group that needs output or approval from this idea", "Write what each group wants and how it pulls", "Find where a schedule or sales goal is driving the creative choices", "Name the balance to restore so no group wins outright"]
    inputs: [question, plan!]
    outputs: [audit_report]
    note: "Who pulls on the idea and where the pull has started to decide what the idea becomes."
  - name: Decide if the idea is early or broken
    skill: early-or-broken-checker
    job: analysis
    task: lead-people
    from: "Chapter 7, the ugly baby, and Chapter 6, when to step in"
    method: ["Compare the idea to its own earlier versions, not to finished work", "Check whether each round of notes has changed the work", "Ask the people on it whether they still believe the problems can be solved", "Give a verdict: keep protecting, change the approach, change the lead, or stop"]
    inputs: [question, audit_report!]
    outputs: [audit_report]
    note: "A verdict on whether the idea is ugly because it is new or stuck because it is wrong."
  - name: Write the plan that shields it
    skill: new-idea-protection-planner
    job: strategy
    task: lead-people
    from: "Chapter 7, protecting the new, idea protectors and the hand-off"
    method: ["Choose who sees it now and keep idea killers away", "Set the only questions that fit this stage", "Ring-fence time and money with a named person who pays", "Set the date and test for moving from protection to meeting the rest of the business"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "Who may see it, what they may ask, what time and money it gets and when protection ends."
