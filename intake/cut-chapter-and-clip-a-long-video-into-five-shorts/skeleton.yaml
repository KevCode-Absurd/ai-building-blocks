# Workflow skeleton built from existing library skills (docs/INTAKE.md). Our words.
id: cut-chapter-and-clip-a-long-video-into-five-shorts
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: cut-chapter-and-clip-a-long-video-into-five-shorts
  name: "Cut, chapter and clip a long video into five shorts"
  summary: "Give it your recording transcript. Get a cut list, working chapters and five short clips with new first lines."
  when: "you have a long talking video and want it tighter, easy to navigate and cut into shorts."
  job: grow-social
  level: beginner
steps:
  - name: "Dead air and retake cutter"
    skill: dead-air-and-retake-cutter
    job: ops
    from: "skill: dead-air-and-retake-cutter"
    method: ["Read the timed transcript", "Mark gaps long enough to trim, keeping a breath on both sides", "Mark filler lines with no content", "Mark sentences you started again and keep the best take", "List every cut with its time"]
    inputs: [transcript]
    outputs: [edit_plan]
    note: "Starts from the transcript of your raw recording and gives a timed list of cuts."
  - pause: "Make the cuts in your editor, export the video and upload it as unlisted or public. You do the editing and publishing."
  - name: "YouTube transcript and channel reader"
    skill: youtube-transcript-reader
    job: ops
    from: "skill: youtube-transcript-reader"
    method: ["Take the link to the cut video", "Fetch the transcript with times", "Return it as text the next steps can read"]
    inputs: [question]
    outputs: [transcript]
    note: "Fresh start after the edit: reads the link to the cut version, so chapters and clips match the final timing. You can paste the captions yourself instead."
  - name: "YouTube chapter writer"
    skill: youtube-chapter-writer
    job: ops
    from: "skill: youtube-chapter-writer"
    method: ["Find where the topic shifts from the pauses and changes in wording", "Check the list starts at 00:00, has three or more chapters and none under ten seconds", "Rewrite each title as the promise of its section in three to five words"]
    inputs: [transcript]
    outputs: [copy_draft]
    note: "Reads the transcript from the step before and writes the chapter block for the description."
  - name: "Shorts clip finder"
    skill: shorts-clip-finder
    job: ops
    from: "skill: shorts-clip-finder"
    method: ["Find 20 to 55 second spans that open on a full thought", "Keep the ones with a turn and a strong last line", "Rank the best five with times", "Write a new first line and on-screen text for each"]
    inputs: [transcript]
    outputs: [shot_list]
    note: "Reads the same transcript and picks five moments that stand alone, with a new first line for each."
