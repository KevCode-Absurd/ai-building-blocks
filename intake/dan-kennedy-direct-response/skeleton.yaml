# Workflow skeleton for The 10 Rules of Direct Response Marketing (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: dan-kennedy-direct-response
source:
  title: "The 10 Rules of Direct Response Marketing"
  by: "Dan Kennedy"
  kind: blog
  rights: ideas-only
minds: [dan-kennedy, robert-collier]
workflow:
  slug: offer-useful-information-first-and-follow-up-with-stalled-leads
  name: "Offer useful information first and follow up with stalled leads"
  summary: "Give it your product and who has the costly problem. Get an information offer and follow-up emails for stalled leads."
  when: "you want leads to raise their hand before you sell to them."
  job: make-offer
  level: intermediate
steps:
  - name: "Information-led lead offer planner"
    skill: information-led-lead-offer-planner
    job: offer
    from: "Smart-Bomb Selling, access note"
    method: ["Name who has the costly problem and what the problem costs them", "List the information that person would ask for to ease it", "Pick one piece of information and make it the offer instead of a sales pitch", "Define what counts as a reply and how it is recorded", "Route each reply to a named person and a time for the next contact", "Write the short ad or letter that offers the information and asks for the reply", "Plan how you will count replies and sales from each source"]
    inputs: [product_data, persona!]
    outputs: [offer, plan]
    note: "A useful-information offer, a reply step and a plan to route replies"
  - name: "Almost-buyer follow-up writer"
    skill: almost-buyer-follow-up-writer
    job: copy
    task: write-ad-copy
    from: "Ten Marketing Rules To Live"
    method: ["Sort the people who did not buy by how far they got", "Restate the offer in one line and pick a real reason to act now", "Write the first follow-up as a reminder of the offer with the exact next step", "Give each later message a new reason: proof, an answer to a doubt, a deadline", "Space the messages and set when to stop", "Mark which link or reply code ties each message to a sale", "Plan what happens to people who still do not respond"]
    inputs: [offer, persona!, voc_reviews!]
    outputs: [email_flow]
    note: "A follow-up email series with a new reason each time. Reads the offer from the step before"
