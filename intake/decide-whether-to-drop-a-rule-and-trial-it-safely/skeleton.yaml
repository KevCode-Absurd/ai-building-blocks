# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md).
id: decide-whether-to-drop-a-rule-and-trial-it-safely
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: decide-whether-to-drop-a-rule-and-trial-it-safely
  name: "Decide whether to drop a rule and trial it safely"
  summary: "Give it a rule or step nobody can explain. Get where it came from, what it quietly does and a capped trial."
  when: "a team follows a rule or process nobody can explain and you want to cut it without breaking something."
  job: think-and-decide
  level: intermediate
steps:
  - name: "Trace where the rule came from"
    skill: rule-origin-tracer
    job: analysis
    from: "skill: rule-origin-tracer"
    method: ["Quote the rule exactly as people state it", "Find who first needed it and why", "List who gains and who pays now", "Make a keep, change or drop call"]
    inputs: [question]
    outputs: [audit_report, plan]
    note: "Starts from the rule itself and its first reason"
  - name: "Find what it quietly does"
    skill: hidden-value-check
    job: analysis
    from: "skill: hidden-value-check"
    method: ["Name the job in one plain sentence", "List the unseen things it does and who gains", "Ask what would break without it", "Price the hidden value and decide to cut, keep or replace"]
    inputs: [question, plan!]
    outputs: [audit_report]
    note: "Reads the origin call and looks for jobs the rule does that nobody wrote down"
  - name: "Trace what dropping it would cause"
    skill: second-order-effects-tracer
    job: analysis
    from: "skill: second-order-effects-tracer"
    method: ["State the change and the result you expect", "Name who reacts and what that causes", "Look for ways people could game the new situation", "Revise the plan to fit the reactions"]
    inputs: [plan]
    outputs: [plan]
    note: "Follows the change from the origin call one step and then another"
  - name: "Plan a small trial with a drop rule"
    skill: long-shot-bet-planner
    job: strategy
    from: "skill: long-shot-bet-planner"
    method: ["Set a loss cap you can survive", "Give the trial one small owner", "List cheap tests that cost far less than the cap", "Set the measure, the date and the rule for dropping or going bigger"]
    inputs: [plan, question!]
    outputs: [plan]
    note: "Turns the revised plan into a trial you can undo"
