# Workflow skeleton for Don't Make Me Think, Revisited (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: dont-make-me-think
source:
  title: "Don't Make Me Think, Revisited"
  by: "Steve Krug"
  kind: book
  rights: ideas-only
minds: [steve-krug, jakob-nielsen]
workflow:
  slug: review-a-pages-ease-of-use-then-plan-a-test
  name: "Review a page's ease of use, then plan a test"
  summary: "Give it a page or screen. Get usability problems, unclear clicks rated, and a one-morning test with three people."
  when: "people get lost on your site or app and you want fixes before a redesign."
  job: audit-landing-page
  level: beginner
steps:
  - name: "Usability heuristic reviewer"
    skill: usability-heuristic-reviewer
    job: brand
    task: design-work
    from: "10 Usability Heuristics for User Interface Design"
    method: ["Name the task a user came to do", "Walk the design against each of the ten heuristics and note every break", "Rank the breaks, prevent high-cost errors first and small frustrations after", "Check against the pattern users know from other sites before accepting a new one", "Mark what needs a real user test and cannot be settled by review", "Take the view of a newcomer who does not yet want the product", "Walk every step and list each small irritation or flaw", "Check each seam where two parts meet and who owns it"]
    inputs: [web_page!, landing_page!, store_capture!, question]
    outputs: [audit_report]
    note: "It checked against ten usability rules, with fixes ordered by cost to the user"
  - name: "Click choice clarity checker"
    skill: click-choice-clarity-checker
    job: analysis
    from: "Don't Make Me Think, Revisited sample pages, chapter 4"
    method: ["List every choice a first-time visitor faces on the path to the goal", "Rate each as mindless and unambiguous, or needing thought", "Check that each link or label gives a clear scent of where it leads", "Rewrite overlapping or vague labels, and move hard choices behind a simpler first choice", "Add help only where a choice stays hard, and make it brief, timely and unavoidable", "Count thought, not clicks"]
    inputs: [audit_report, web_page, page_layout_spec!]
    outputs: [audit_report]
    note: "Each choice rated for how hard it is, with a plain rewrite. Reads the audit report from the step before"
  - name: "Small usability test planner"
    skill: small-usability-test-planner
    job: brand
    task: design-work
    from: "The Author of Don't Make Me Think Discusses UX Design's 20-Year Evolution"
    method: ["Pick the few tasks that matter most", "Recruit three people loosely, plus one who is not in the target group", "Write a short read-aloud script that tells them you are testing the site, not them", "Have them think aloud while the team watches, and say nothing", "List the worst problems seen, not every problem", "Pick a real beginner who has never used it", "Record them from the first screen and write down every pause or fear of clicking", "Ask what they came to do and cut every step that is not that"]
    inputs: [audit_report, question, persona!, web_page!]
    outputs: [plan]
    note: "A one-morning test plan: three people, tasks, a read-aloud script and a fix list. Reads the audit report from the step before"
