# Workflow skeleton built from existing AI Blocks library skills (docs/INTAKE.md).
id: draft-a-paper-review-it-and-fit-your-journals-rules
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: draft-a-paper-review-it-and-fit-your-journals-rules
  name: "Draft a paper, review it and fit your journal's rules"
  summary: "Name your topic and bring your results. Get sources, a draft, a fair review and a paper fitted to the journal."
  when: "you have results and need a first manuscript that cites real sources and meets the journal's rules."
  job: research-topics
  level: advanced
steps:
  - name: "Gather the sources"
    skill: manuscript-evidence-gatherer
    job: ops
    from: library
    method: ["Name your topic and the claims you want to support", "Collect current papers, competing findings and background", "Keep the link for every source", "Note the gaps and the limits of the search"]
    inputs: [question]
    outputs: [source_text, shortlist]
    note: "Starts from your topic. Makes the packet of sources the draft cites."
  - name: "Draft the manuscript"
    skill: scientific-manuscript-drafter
    job: ops
    from: library
    method: ["Add your own results and notes to the source packet", "Write each section only from sources and results you gave it", "Track the source for each claim and flag guideline gaps", "Check the references"]
    inputs: [source_text, spreadsheet!]
    outputs: [document]
    note: "Writes from the source packet and your results. It will not invent a citation or a number."
  - name: "Review the draft"
    skill: scholarly-work-reviewer
    job: ops
    from: library
    method: ["Say what the paper claims to do", "Check each section against the evidence in it", "Write what is strong, what is weak and what to fix next", "Keep the comments about the work, not the author"]
    inputs: [document]
    outputs: [audit_report]
    note: "Reads the draft as a fair reviewer would and lists the fixes."
  - pause: "Fix what the review found and rerun your analysis where it asks for it. Then pick your journal or conference and bring the revised paper back."
  - name: "Fit the paper to the journal"
    skill: journal-submission-formatter
    job: ops
    from: library
    method: ["Name the exact journal, year and article type", "Open the official author instructions and record the date checked", "Check page limits, required sections, anonymity and citation style", "Fit the paper to the template"]
    inputs: [document]
    outputs: [document]
    note: "Starts from the revised paper and checks it against the journal's current rules."
