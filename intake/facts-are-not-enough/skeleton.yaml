# Workflow skeleton for Facts Are Not Enough (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: facts-are-not-enough
source:
  title: "Facts Are Not Enough"
  by: "Bill Bernbach"
  kind: talk
  rights: ideas-only
minds: [bill-bernbach, joseph-sugarman]
workflow:
  slug: write-a-flaw-first-ad-from-the-drive-behind-the-sale
  name: "Write a flaw-first ad from the drive behind the sale"
  summary: "Paste your product facts and buyer words. Get a brief on why people buy, a flaw-first ad and fresh wording."
  when: "your ads state facts that nobody feels and you want one that lands."
  job: write-ad-copy
  level: intermediate
steps:
  - name: "Buyer instinct brief writer"
    skill: buyer-instinct-brief-writer
    job: research
    task: understand-customers
    from: "Facts Are Not Enough speech and Medium pieces"
    method: ["List the facts as a springboard, not as the message", "Read the buyer's own words for what they say they want", "Name the drive underneath, such as being admired, staying safe or getting even", "Note where their language hides the real motive", "Write the feeling the ad must leave in one line", "Write what the reader should take away, not what you want to put in", "Choose one fresh way to say it and mark the old ways to avoid"]
    inputs: [product_data, voc_reviews!, persona!]
    outputs: [brief]
    note: "A brief naming the drive behind buying and the feeling the ad must leave"
  - name: "Flaw-first ad writer"
    skill: flaw-first-ad-writer
    job: copy
    from: "Facts Are Not Enough speech and Medium pieces"
    method: ["List the true weaknesses of the product or the company", "Pick the one a buyer already sees or fears", "Ask what that weakness really shows about the product, such as care, size, effort or honesty", "Write the flat claim and then a version that names the flaw plainly", "Check the product backs the line in real use, not only on the page", "Keep the picture and the words making one point", "Cut anything that is a trick with no link to the product"]
    inputs: [brief, product_data, voc_reviews!, competitor_set!]
    outputs: [ad_copy, hooks]
    note: "An ad that states the flaw first and makes it a reason to buy. Reads the brief from the step before"
  - name: "Fresh line rewriter"
    skill: fresh-line-rewriter
    job: copy
    from: "Facts Are Not Enough speech and Medium pieces"
    method: ["Write the researched claim in its flat form", "Collect how rivals say the same thing", "Write several fresh versions that keep the claim unchanged", "Use a picture, a surprise or a detail that proves the claim instead of naming it", "Run the swap test: could a rival put the flat line in its ad and sound the same", "Read each version for the feeling it leaves, not only the facts", "Pick one and cut any words that do not carry the point"]
    inputs: [ad_copy, competitor_set!, brief!]
    outputs: [hooks, ad_copy]
    note: "Fresh ways to say the same true claim, with a swap test. Reads the ad copy from the step before"
