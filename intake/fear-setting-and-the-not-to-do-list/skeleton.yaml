# Workflow skeleton for Fear-Setting and the Not-To-Do List (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: fear-setting-and-the-not-to-do-list
source:
  title: "Fear-Setting and the Not-To-Do List"
  by: "Tim Ferriss"
  kind: blog
  rights: ideas-only
minds: [tim-ferriss]
workflow:
  slug: face-the-decision-you-keep-avoiding-and-clear-your-week
  name: "Face the decision you keep avoiding and clear your week"
  summary: "Paste the decision you keep putting off. Get the worst case, a stop list and the few big tasks for the week."
  when: "you keep delaying a decision and your week is full of small tasks."
  job: think-and-decide
  level: beginner
steps:
  - name: "Fear-setting planner"
    skill: fear-setting-planner
    job: analysis
    from: "Fear-Setting"
    method: ["Name the move you are putting off", "Write the worst realistic outcomes and rate each one's lasting harm from 1 to 10", "Rate how likely each is", "List how you would repair or limit each one", "List the gains of a partial or full win", "Price the cost of doing nothing at one, five and ten years", "Pick one small step to take within a day"]
    inputs: [question]
    outputs: [plan]
    note: "The worst case, how to repair it and what waiting costs"
  - name: "Not-to-do list builder"
    skill: not-to-do-list-builder
    job: analysis
    from: "The Not-To-Do List: 9 Habits to Stop Now"
    method: ["List where your time went last week", "Mark habits that cause false emergencies, such as all-day email or open-ended meetings", "Run an 80/20 check on tasks and clients to find the costly few", "Write one stop rule per habit with a number or limit", "Add an auto-reply or agenda rule where it helps", "Set a protected day or block away from devices", "Review after one week and keep what held"]
    inputs: [plan, question!]
    outputs: [plan]
    note: "A list of what to stop, with a rule and a swap for each. Reads the plan from the step before"
  - name: "Weekly big task sorter"
    skill: weekly-big-task-sorter
    job: ops
    task: plan-strategy
    from: "Are You Hunting Antelope or Field Mice?"
    method: ["List every open task", "Sort each into big prey that pays off or small prey that only feels good", "Find the one task that would make the others easier or unneeded", "Find the task put off longest and test if it is the big one", "Batch or drop the small ones", "List everything on your plate", "Write every task for tomorrow", "Pick three priorities for the week"]
    inputs: [plan, question]
    outputs: [plan]
    note: "The few big tasks that matter, the small ones to batch or drop, and a week plan. Reads the plan from the step before"
