# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Our words.
id: find-an-amazon-product-gap-and-check-it-will-pay
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: find-an-amazon-product-gap-and-check-it-will-pay
  name: "Find an Amazon product gap and check it will pay"
  summary: "Give it a category. Get Amazon product ideas page 1 misses, a score out of 100 and a go or no-go."
  when: "you want to sell on Amazon and need a product people search for that page 1 does not serve well, before you pay for stock."
  job: sell-on-amazon
  level: beginner
steps:
  - name: "Amazon search gap finder"
    skill: amazon-search-gap-finder
    job: research
    from: "skill: amazon-search-gap-finder"
    method: ["Note what you can make and what cash you have", "Read keyword gaps, bestseller lists and a filtered product database", "Walk Amazon autocomplete and check the trend", "Prefer narrow niches and drop crowded ones", "Rank the survivors and pick three to check"]
    inputs: [question, spreadsheet!, store_capture!]
    outputs: [shortlist]
    note: "Starts the flow. Finds searched-for ideas that page 1 misses."
  - pause: "Pick the best idea from the shortlist. Get a supplier quote and write down its cost, size, weight and the price you would charge."
  - name: "Amazon product viability scorer"
    skill: amazon-product-viability-scorer
    job: analysis
    from: "skill: amazon-product-viability-scorer"
    method: ["Apply the hard stops that end an idea", "Score price band, margin and search variety", "Score page 1 weakness and brand giants", "Score shipping, season and category gates", "Size the first order to cash and give a go or no-go"]
    inputs: [product_data, store_capture!, spreadsheet!]
    outputs: [audit_report]
    note: "Scores the idea you picked from the shortlist, using the page 1 evidence the gap finder gathered."
