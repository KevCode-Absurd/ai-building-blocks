id: find-out-why-good-orders-turn-into-bad-reviews-and-returns
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: find-out-why-good-orders-turn-into-bad-reviews-and-returns
  name: Find out why good orders turn into bad reviews and returns
  summary: Give it your orders and reviews. Get the wrong-fit buyers, what blocks them and how to measure the fix.
  when: orders are healthy but reviews, returns or repeat orders are weak, and you need to know who is unhappy and why.
  job: understand-customers
  level: intermediate
steps:
  - name: Best and worst customer profiler
    skill: best-and-worst-customer-profiler
    job: analysis
    from: library
    method:
      - Check the data fits
      - Split into groups
      - Profile each group
      - Split by discount code
      - Do not judge on ROAS alone
      - Hand findings to the creative team
      - Score it
    inputs:
      - performance_sheet
      - voc_reviews!
    outputs:
      - audit_report
      - persona
    note: Compares your best and worst customers from order data and reviews.
  - name: Wrong-buyer review checker
    skill: wrong-buyer-review-checker
    job: analysis
    from: library
    method:
      - Pull the lows and return reasons
      - Tag every review
      - Check the share
      - Write the not-for line
      - Describe the real experience on the page
      - Surface reviews from same-job buyers
      - Plan the re-measure
    inputs:
      - voc_reviews
      - copy_draft
      - persona!
    outputs:
      - audit_report
    note: Splits low reviews into product failures and buyers who came for a different job. Reads the buyer profiles from the step before.
  - name: Switch friction remover
    skill: switch-friction-remover
    job: strategy
    from: library
    method:
      - List the holding forces
      - Sort the anxieties by type
      - Place each in the path
      - Help them get rid of the old way
      - Say who it is not for
      - Guard against overselling
      - Check the result before you hand it on
    inputs:
      - audit_report
      - question!
    outputs:
      - plan
    note: Ranks the worries and habits behind each gap and what to change. Reads the findings from the step before.
  - name: Customer progress measure picker
    skill: customer-progress-measure-picker
    job: analysis
    from: library
    method:
      - List what you track
      - Run the three data traps on each number
      - List the promises in the job
      - Add a repeat-use measure
      - Check each for gaming
      - Give each one an owner and an action
      - Check the result before you hand it on
    inputs:
      - plan
      - brief!
    outputs:
      - plan
    note: Picks the few measures that show buyers making progress after the fix. Reads the fix plan from the step before.
