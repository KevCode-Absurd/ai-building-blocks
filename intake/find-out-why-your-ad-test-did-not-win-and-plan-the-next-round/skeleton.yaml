# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md). Our words.
id: find-out-why-your-ad-test-did-not-win-and-plan-the-next-round
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: find-out-why-your-ad-test-did-not-win-and-plan-the-next-round
  name: "Find out why your ad test did not win and plan the next round"
  summary: "Give it your test results and the ads. Get a verdict per ad, a next-round brief and where the next dollar goes."
  when: "a round of ads finished and you cannot tell what won, what to cut or what to make next."
  job: read-ad-results
  level: intermediate
steps:
  - name: "Winning ad DNA mapper"
    skill: winning-ad-dna-mapper
    job: research
    from: "library"
    method: ["Collect and label the ads","Split every ad into message and look","Write the one idea behind each ad","Find patterns and gaps"]
    inputs: [reference_set, performance_sheet!]
    outputs: [ad_breakdowns, ad_style_dna]
    note: "Breaks each ad in the test into message and look so the results can be read by idea."
  - name: "Ad sameness checker"
    skill: ad-sameness-checker
    job: ads
    from: "library"
    method: ["Group the ads by four fields","Apply the change test to see if two ads are really different","Count clusters, not ads","Say what to replace"]
    inputs: [ad_breakdowns, performance_sheet!]
    outputs: [audit_report]
    note: "Reads the breakdowns and shows whether the round tested one idea many times."
  - name: "Creative test reader"
    skill: creative-test-reader
    job: analysis
    from: "library"
    method: ["Fix the frame and give each ad set a verdict against your target","Rank the ads in a set metric order","Flag false winners","Judge the concept, not one ad"]
    inputs: [performance_sheet, ad_breakdowns!]
    outputs: [audit_report, brief]
    note: "Reads the results with the breakdowns, so verdicts are by concept."
  - name: "Meta test campaign planner"
    skill: meta-test-campaign-planner
    job: ads
    from: "library"
    method: ["Size the next test","Group ads by pack and never add to a winning ad set","Set the read rules and the minimum spend"]
    inputs: [brief, performance_sheet!]
    outputs: [plan]
    note: "Turns the brief from the test read into the next round's layout."
  - name: "Next-dollar budget allocator"
    skill: next-dollar-budget-allocator
    job: ads
    from: "library"
    method: ["Rank where an extra dollar earns the most new-customer revenue","Find the stop point per channel","Write the test that would change the ranking"]
    inputs: [performance_sheet, plan!]
    outputs: [plan]
    note: "Uses the next-round plan to decide what budget the winners get."
