# Workflow skeleton that chains library skills (docs/INTAKE.md). Our words.
id: find-the-right-candidates-and-write-messages-they-answer
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: find-the-right-candidates-and-write-messages-they-answer
  name: "Find the right candidates and write messages they answer"
  summary: "Give it a job description. Get a profile of who fits, a week-by-week search plan, first messages and a pipeline update."
  when: "you have a role to fill, no stream of applicants and a need to reach good people yourself."
  job: hire-people
  level: intermediate
steps:
  - name: Ideal candidate profiler
    skill: ideal-candidate-profiler
    job: ops
    from: library
    method: ["Read the job description for what the work needs", "Ask what the hiring manager really values", "Describe the person: motives, habits, where they spend time", "Mark what moves them to listen to a stranger"]
    inputs: [brief]
    outputs: [persona]
    note: "Turns the job description into a picture of the person who fits, beyond skills on paper."
  - name: Candidate sourcing planner
    skill: candidate-sourcing-planner
    job: ops
    from: library
    method: ["Take the profile as the target", "Rank the places to look and the companies to watch", "Write search words for each place", "Lay out the work week by week"]
    inputs: [persona]
    outputs: [plan]
    note: "Reads the profile from the step before and turns it into where to look and when."
  - name: Candidate outreach drafter
    skill: candidate-outreach-drafter
    job: ops
    from: library
    method: ["Use what the profile says moves this person", "Write a short first message with one real reason to reply", "Add follow-ups on a set schedule", "Prepare replies to the usual answers"]
    inputs: [persona, brief!]
    outputs: [copy_draft, plan]
    note: "Reads the profile from the first step and writes messages for the places the search plan picked. You send them yourself."
  - pause: "Send the messages for two weeks. Count how many you sent, how many replied and how many agreed to talk."
  - name: Hiring progress reporter
    skill: hiring-progress-reporter
    job: ops
    from: library
    method: ["Take the counts at each stage", "Show what is working and what is stuck", "Write a short update for the hiring manager", "Add the changes for the next two weeks"]
    inputs: [performance_sheet]
    outputs: [document]
    note: "Turns your pipeline counts into an update that says what to change in the plan and the messages."
