# Workflow skeleton built from library skills (docs/INTAKE.md).
id: find-what-buyers-want-and-where-they-gather-online
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: find-what-buyers-want-and-where-they-gather-online
  name: "Find what buyers want and where they gather online"
  summary: "Give it a topic. Get posts in a table, ranked buying reasons, a buyer profile and where to reach them."
  when: "you want to hear what buyers say without interviews, or you have no reviews of your own yet."
  job: understand-customers
  level: intermediate
steps:
  - name: "Reddit thread collector"
    skill: reddit-thread-collector
    job: ops
    from: "skill: reddit-thread-collector"
    method: ["Turn your topic into short search terms and communities", "Show the settings and the cost before any run", "Run it and save posts and comments to a table", "Check the table has results and the right dates"]
    inputs: [question]
    outputs: [voc_reviews]
    note: "Starts the chain: collects what people say about your topic into a table of their own words."
  - name: "Customer buying reasons finder"
    skill: customer-buying-reasons-finder
    job: research
    from: "skill: customer-buying-reasons-finder"
    method: ["Clean the posts and keep every line that gives a reason", "Copy out each phrase exactly with its source", "Tag what pushes, pulls, holds back or worries them", "Group the same point, count separate people and score the reasons"]
    inputs: [voc_reviews]
    outputs: [angle_library]
    note: "Reads the collected posts and ranks why people buy, in their exact words."
  - name: "Ideal customer profile writer"
    skill: ideal-customer-profile-writer
    job: ops
    from: "skill: ideal-customer-profile-writer"
    method: ["State who the brand sells to and who it does not", "Write each buyer's world, goals, frustrations and triggers", "Add the words they use and the channels they are on", "List what the profile means for message, channel and voice"]
    inputs: [voc_reviews, brand_brain!]
    outputs: [persona]
    note: "Builds a buyer profile from the same posts, with the reasons found in the step before."
  - name: "Audience hangout finder"
    skill: audience-hangout-finder
    job: research
    from: "skill: audience-hangout-finder"
    method: ["Describe the buyer by what they do", "List the sites, shows, accounts and groups they use", "Mark where they show up more than most people", "Rank the few places to start and what to share there"]
    inputs: [persona, voc_reviews!]
    outputs: [plan]
    note: "Takes the buyer profile and the posts and ranks the places to show up first."
