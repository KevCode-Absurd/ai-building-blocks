id: fix-a-drop-in-search-traffic-and-check-it-recovers
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: fix-a-drop-in-search-traffic-and-check-it-recovers
  name: Fix a drop in search traffic and check it recovers
  summary: Give it your Search Console export. Get the pages that lost clicks, a ranked fix list and a recovery report.
  when: organic clicks fell and you need to find the cause, fix it in the right order and prove the traffic is coming back.
  job: get-found-in-search
  level: intermediate
steps:
  - name: Search Console traffic drop diagnoser
    skill: search-console-traffic-drop-diagnoser
    job: analysis
    from: library
    method:
      - Set the comparison to cover the drop
      - If pages were outranked,
      - If rankings held but clicks fell,
      - Make more of the high-AI pages
      - Order the fixes for each group of losers
      - Be careful with timing
      - Score how clear the cause is out of 100
    inputs:
      - performance_sheet
      - store_capture!
    outputs:
      - audit_report
      - plan
    note: Finds the pages and queries that lost clicks and the likely causes.
  - name: Store SEO fix prioritiser
    skill: store-seo-fix-prioritiser
    job: analysis
    from: library
    method:
      - Hold to the four basics
      - 404s
      - Not indexed is not always an error
      - Check blocks
      - Check hierarchy
      - Rank what is left by revenue
      - Score the four basics out of 100
    inputs:
      - audit_report
      - performance_sheet!
      - store_capture!
    outputs:
      - audit_report
      - plan
    note: Ranks the faults behind the drop so you fix crawl and index problems before content. Reads the diagnosis from the step before.
  - name: Shopify duplicate page fixer
    skill: shopify-duplicate-page-fixer
    job: analysis
    from: library
    method:
      - Product addresses
      - Tag pages
      - Custom robots file
      - Sitemap
      - Crawl and review
      - Don't noindex pages that bring organic sales
      - Score the leaks
    inputs:
      - audit_report!
      - performance_sheet!
      - theme_files
    outputs:
      - audit_report
      - code_change
    note: Fixes the duplicate and thin pages the ranked list put first. Reads the findings from the step before.
  - pause: Make the fixes live, then wait four weeks and export a fresh Search Console report for the same pages.
  - name: Organic search report builder
    skill: organic-search-report-builder
    job: analysis
    from: library
    method:
      - Set the range
      - Remove branded searches
      - Report branded search as its own line
      - Treat average position as a trend
      - Pair with GA4
      - Score out of 100
      - Name the one thing to look at next
    inputs:
      - performance_sheet
      - brand_brain!
    outputs:
      - audit_report
    note: Reports non-branded clicks, branded trend and organic sales for the new window, so you can see whether the drop is recovering.
