# Workflow skeleton chained from existing skills in the AI Blocks library (docs/INTAKE.md).
id: fix-a-static-ad-then-clear-it-to-run
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: fix-a-static-ad-then-clear-it-to-run
  name: "Fix a static ad's pitch and clear it to run"
  summary: "Give it a static ad and its copy. Get a scored critique, a rewrite that fits the buyer and a ship call."
  when: "you have a finished image ad and want to know if it will land before it spends money."
  job: check-ads
  level: intermediate
steps:
  - name: "Critique the ad"
    skill: static-ad-critic
    job: ads
    from: "library"
    method: ["Pick a side: clear offer or deliberate curiosity", "Trace the eye path", "Run the image and headline swap test", "Check specificity, awareness fit and the phone view", "Score it and write two rewrites"]
    inputs: [image, copy_draft, landing_page!]
    outputs: [audit_report, ad_copy]
    note: "Starts the chain: scores the ad and writes two rewrites."
  - name: "Match it to the buyer's awareness"
    skill: ad-awareness-stage-checker
    job: ads
    from: "library"
    method: ["Classify the hook by awareness stage", "Classify the picture and the copy apart, then compare", "Check the ad does not jump back and forth", "Score the fit", "Write one rewrite per mismatch"]
    inputs: [ad_copy, product_data!]
    outputs: [audit_report]
    note: "Reads the rewritten copy from the step before and checks it speaks to one stage."
  - name: "Check the five jobs of the ad"
    skill: five-part-ad-checker
    job: copy
    from: "library"
    method: ["Quote where attention, gain, proof, case and ask sit", "Pass or fail each part for 20 points", "Judge the length", "Rank the fixes, earliest failing part first"]
    inputs: [ad_copy]
    outputs: [audit_report]
    note: "Tests the fixed copy for proof and a clear ask, which the earlier steps do not score."
  - name: "Run the stop-ship check"
    skill: pre-launch-ad-checker
    job: ads
    from: "library"
    method: ["List the ad's format and platform rules", "Check claims, brand details and sizes", "Run the platform policy check", "Give a verdict and a score"]
    inputs: [static_ads!, ad_copy, brand_brain!]
    outputs: [audit_report]
    note: "Runs the last check on the ad with the fixes from the three reports applied."
