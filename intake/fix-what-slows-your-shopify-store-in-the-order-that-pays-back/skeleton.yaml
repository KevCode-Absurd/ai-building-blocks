# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Skills run in order, each reading what the one before made.
id: fix-what-slows-your-shopify-store-in-the-order-that-pays-back
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: fix-what-slows-your-shopify-store-in-the-order-that-pays-back
  name: "Fix what slows your Shopify store in the order that pays back"
  summary: "Give it your PageSpeed report and theme. Get fixes priced in orders and applied: apps cut, first-screen image and layout shifts fixed."
  when: "your mobile speed report is failing and you want the biggest fixes first."
  job: speed-up-store
  level: intermediate
steps:
  - name: "Store speed report reader"
    skill: store-speed-report-reader
    job: analysis
    from: "library"
    method: ["Split each report into field and lab", "Read mobile first and average the runs", "Name the causes before any fix", "Give the first three fixes"]
    inputs: [source_text, question!]
    outputs: [audit_report]
    note: "Reads the report page by page and names what is slow."
  - name: "Speed fix ranker"
    skill: speed-fix-ranker
    job: ops
    from: "library"
    method: ["Weight fixes by traffic and money", "Turn speed into orders as a range", "Tag each fix by type, effort and risk", "Add a retest to each fix"]
    inputs: [audit_report, performance_sheet]
    outputs: [plan]
    note: "Prices each fix from the report in orders and ranks them by gain per hour."
  - name: "App script auditor"
    skill: app-script-auditor
    job: analysis
    from: "library"
    method: ["Ask the money question for each app", "Match scripts to apps", "Decide where each app must load", "Make the uninstall list"]
    inputs: [store_capture, audit_report]
    outputs: [audit_report]
    note: "Marks each app keep, remove or delay, using the ranked fixes and your store capture."
  - pause: "Remove the apps marked for removal, and copy your theme files."
  - name: "Leftover app code finder"
    skill: leftover-app-code-finder
    job: analysis
    from: "library"
    method: ["Search the theme by app name", "Read theme.liquid by eye", "Judge each hit and protect live tags", "Plan the edits and retest"]
    inputs: [theme_files, question]
    outputs: [audit_report, plan]
    note: "Finds the code the removed apps left behind and lists the lines to delete."
  - name: "Hero image loading fixer"
    skill: hero-image-loading-fixer
    job: page
    from: "library"
    method: ["Read the LCP element", "Never lazy load the first screen", "Add a preload link and fix sliders", "Set size targets"]
    inputs: [audit_report, theme_files, image!]
    outputs: [code_change]
    note: "Fixes the first-screen image the report flagged so the largest paint comes sooner."
  - name: "Layout shift fixer"
    skill: layout-shift-fixer
    job: page
    from: "library"
    method: ["Find the shifting element", "Fix injected widgets, images and fonts", "Protect required widgets", "Retest on mobile and desktop"]
    inputs: [audit_report, theme_files, store_capture!]
    outputs: [code_change, plan]
    note: "Stops widgets and fonts moving the page, using the audit and your theme."
