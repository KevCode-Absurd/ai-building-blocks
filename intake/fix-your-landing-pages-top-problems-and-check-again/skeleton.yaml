id: fix-your-landing-pages-top-problems-and-check-again
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: fix-your-landing-pages-top-problems-and-check-again
  name: "Fix your landing page's top problems and check again"
  summary: "Give it your page. Get ranked problems, a fix-now list and, after you fix them, a second 30-point check."
  when: "a landing page is not selling and you want to fix the clear problems and see that they are gone."
  job: audit-landing-page
  level: intermediate
steps:
  - name: Audit the page
    skill: landing-page-auditor
    job: page
    from: "skill: landing-page-auditor"
    method: ["Name the page's job", "Read it three ways: glance, skim and doubt", "Rate each finding from 0 to 4", "Split quick wins from tests and score it"]
    inputs: [landing_page, brand_brain!]
    outputs: [audit_report]
    note: "Reads your page and ranks what gets in a buyer's way."
  - name: Sort what to fix now
    skill: page-issue-sorter
    job: analysis
    from: "skill: page-issue-sorter"
    method: ["Number every issue with its proof", "Tag tracking faults first", "Tag the obvious fixes to do now", "Turn the rest into investigations or tests, then rank"]
    inputs: [audit_report]
    outputs: [plan]
    note: "Takes the audit from step 1 and sorts it into fix now, investigate and test."
  - pause: "Make the fix-now changes, then save the updated page text and screenshots."
  - name: Check the fixed page
    skill: landing-page-30-point-checker
    job: page
    from: "skill: landing-page-30-point-checker"
    method: ["Walk the five stops a buyer makes", "Answer 30 yes-or-no checks, quoting the page", "Tag each no as a deal-breaker or a drag", "List the first five fixes and a score"]
    inputs: [landing_page, brand_brain!]
    outputs: [audit_report]
    note: "A second, separate check on the fixed page. Compare it with the fix-now list from step 2."
