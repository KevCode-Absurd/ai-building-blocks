# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md).
id: fix-your-marketing-plan-and-cut-it-to-one-goal
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: fix-your-marketing-plan-and-cut-it-to-one-goal
  name: "Fix your marketing plan and cut it to one goal"
  summary: "Give it your marketing plan. Get it in order, checked against the rules, and cut to one goal."
  when: "you have a marketing plan full of tactics and need one that is in order and short enough to follow."
  job: plan-strategy
  level: intermediate
steps:
  - name: "Put the plan in order"
    skill: marketing-plan-order-checker
    job: strategy
    from: "skill: marketing-plan-order-checker"
    method: ["Sort every line as diagnosis, strategy or tactic", "Find the target, position and objective", "Mark tactics that serve none of them", "Rebuild the plan in order and score it"]
    inputs: [question, brand_brain!]
    outputs: [plan]
    note: "Starts by sorting your plan into diagnosis, strategy and tactics and naming the gaps"
  - name: "Check the plan against the marketing laws"
    skill: marketing-plan-law-checker
    job: analysis
    from: "skill: marketing-plan-law-checker"
    method: ["Place the plan in the buyer's mind", "Run the tests and score it", "Write the fix list, worst first", "Name what already passes"]
    inputs: [plan, brand_brain!]
    outputs: [audit_report, plan]
    note: "Reads the rebuilt plan and returns the lines that break a rule, with a fix for each"
  - name: "Cut it to one goal and a test calendar"
    skill: one-goal-marketing-plan-builder
    job: strategy
    from: "skill: one-goal-marketing-plan-builder"
    method: ["Rewrite the wish as one number, one thing counted and a date", "Work back to the sales or sign-ups you need", "Score each tactic for impact and ease", "Time-box the top three to five with stop rules"]
    inputs: [plan, question]
    outputs: [plan]
    note: "Takes the fixed plan's tactics and keeps only the few that serve one goal"
