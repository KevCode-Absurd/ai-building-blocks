# Workflow skeleton chaining AI Blocks library skills (docs/INTAKE.md).
id: forecast-your-startup-runway-and-prepare-a-finance-pack
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: forecast-your-startup-runway-and-prepare-a-finance-pack
  name: "Forecast your startup runway and prepare a finance pack"
  summary: "Give it your plan and numbers. Get a multi-year model, a cash-out date with ranges, and a finance plan for the board."
  when: "you run an early company and need to know when cash runs out and what to say to a board or investor."
  job: money-and-investing
  level: intermediate
steps:
  - name: "Startup financial model builder"
    skill: startup-financial-model-builder
    job: ops
    from: "skill: startup-financial-model-builder"
    method: ["Set revenue from customers won and kept by group", "Add the cost of making and selling", "Add team and fixed costs month by month", "Roll it into cash flow with best, base and worst cases", "List every assumption beside its number"]
    inputs: [brief]
    outputs: [spreadsheet]
    note: "Builds the monthly cash picture from your plan, with three cases to carry forward."
  - name: "Startup runway forecaster"
    skill: startup-runway-forecaster
    job: ops
    from: "skill: startup-runway-forecaster"
    method: ["Take monthly net cash burn from the model and your real bank history", "Split trend, season and one-off costs", "Adjust burn for hiring and spend plans", "Find the month cash reaches zero, as a range of likely dates", "Mark the window in which to raise money"]
    inputs: [spreadsheet]
    outputs: [spreadsheet, plan!]
    note: "Reads the monthly cash in the model and turns it into a cash-out date with a spread, not one guess."
  - name: "Startup finance advisor"
    skill: startup-finance-advisor
    job: ops
    from: "skill: startup-finance-advisor"
    method: ["Ask the hard questions first: burn multiple, a slow raise, unit economics by group", "Work out unit economics and payback", "Set the runway levels at which you cut or raise", "Lay out the fundraising steps and what each round costs you in ownership", "Assemble the pack for the board"]
    inputs: [spreadsheet]
    outputs: [plan]
    note: "Takes the model and the runway forecast and sets decision triggers and the board pack. Not legal or investment advice."
