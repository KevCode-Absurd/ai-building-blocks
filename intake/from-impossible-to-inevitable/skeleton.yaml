# Workflow skeleton for From Impossible to Inevitable (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: from-impossible-to-inevitable
source:
  title: "From Impossible to Inevitable"
  by: "Aaron Ross and Jason Lemkin"
  kind: book
  rights: ideas-only
minds: [aaron-ross]
workflow:
  slug: find-your-niche-write-the-first-message-split-sales-jobs
  name: "Find your niche, write the first message, split sales jobs"
  summary: "Give it your offer and how customers found you. Get a niche verdict, a stranger-friendly message and a sales role split."
  when: "you want outbound sales to work and need to know who to write to first."
  job: sell-and-negotiate
  level: intermediate
steps:
  - name: "Niche readiness checker"
    skill: niche-readiness-checker
    job: research
    task: test-an-idea
    from: "From Impossible to Inevitable, chapter 1, publisher sample"
    method: ["Count the paying customers who found you cold, with no tie to you, and set aside friends, past clients and referrals", "Check the warning signs: growth only from referrals, a long product list, reliance on a known brand or old contacts, and appointments that rarely buy", "Write one sentence: this pain, for this customer, solved in a repeatable way, with a predictable way to find them", "Test each extra offer against that sentence and drop what blurs it", "If you have ten cold customers, set a doubling target of twenty and then forty before you widen the offer", "If you have fewer, name the one place where momentum is easiest to build now"]
    inputs: [offer, voc_reviews!, question!]
    outputs: [audit_report, plan]
    note: "A niche verdict, a one-line niche statement and the next step"
  - name: "Stranger first-message writer"
    skill: stranger-first-message-writer
    job: ops
    from: "From Impossible to Inevitable, chapter 1, publisher sample"
    method: ["Name the stranger and how little time they will give a cold email or call", "Pick one idea and one easy reply, written so a bright fourth grader could follow it", "Choose a referral ask over a pitch: ask who handles this problem", "Add one attention hook such as contrast, a surprise or a concrete detail, without promising more than you can show", "Cut until it reads in a few seconds, then write two shorter versions", "Add a polite way out and check local rules on email and calls"]
    inputs: [plan, offer, persona!]
    outputs: [copy_draft]
    note: "A first message a stranger can read in seconds. Reads the plan from the step before"
  - name: "Sales role splitter"
    skill: sales-role-splitter
    job: ops
    task: lead-people
    from: "An Argument for Specialized Sales Teams, our summary note of a David Skok interview"
    method: ["List every sales job now done: prospecting, inbound leads, closing and account care, with the share of time each takes", "Flag any side job that takes more than about a fifth of someone's role", "Pick the first split; a dedicated lead generator can be the second hire", "Set the niche that person works and who qualifies what they find", "Define the handoff to closers and what counts as a qualified opportunity", "Choose a few result numbers such as qualified pipeline, not call counts", "Note the cost of lost context at each handoff"]
    inputs: [plan, question]
    outputs: [plan]
    note: "Which job to split out first, who owns it and what to track. Reads the plan from the step before"
