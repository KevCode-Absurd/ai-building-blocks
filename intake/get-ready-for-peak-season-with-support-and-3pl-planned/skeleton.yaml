# Workflow skeleton that chains library skills (docs/INTAKE.md). Our words.
id: get-ready-for-peak-season-with-support-and-3pl-planned
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: get-ready-for-peak-season-with-support-and-3pl-planned
  name: Get ready for peak season with support, 3PL and stock arrivals planned
  summary: Give it past sales and your peak target. Get hire dates for support, 3PL terms, an inbound tracker and a bill audit.
  when: most of your year's profit lands in a few weeks and you cannot ship late or run out.
  job: plan-supply-chain
  level: intermediate
steps:
  - name: Store revenue forecast builder
    skill: store-revenue-forecast-builder
    job: analysis
    from: library
    method:
      - Split the forecast into new and returning revenue
      - Fit seasonality and the event layer
      - Size every action and keep the calendar in the plan
      - Show the gap to target
    inputs:
      - performance_sheet
      - spreadsheet
    outputs:
      - spreadsheet
      - plan
    note: Starts with a daily forecast of peak orders that every later step plans for.
  - name: Support capacity planner
    skill: support-capacity-planner
    job: ops
    from: library
    method:
      - Measure tickets, response time, cost per ticket and their causes
      - Forecast tickets from the sales forecast
      - Date the hires and suggest a team mix
      - Tag ticket reasons and review monthly
    inputs:
      - spreadsheet
    outputs:
      - plan
    note: Turns forecast orders into expected tickets and the dates support staff must start.
  - name: 3PL bid and agreement builder
    skill: 3pl-bid-and-agreement-builder
    job: ops
    from: library
    method:
      - Write a request for pricing
      - Split each bid into four prices and watch for blended charges
      - Build the comparison and choose the best fit
      - List the agreement terms to demand
    inputs:
      - question
      - spreadsheet!
    outputs:
      - document
    note: Sends the forecast volumes to 3PLs so bids and terms rest on peak, not an average month.
  - name: Inbound shipment tracker builder
    skill: inbound-shipment-tracker-builder
    job: ops
    from: library
    method:
      - Run one record for orders and one for shipping
      - Build the sheet columns and update arrival dates when a vessel moves
      - Draft the advance shipping notice for the warehouse
      - Add a short-ship watch and an update habit
    inputs:
      - question
      - spreadsheet!
    outputs:
      - spreadsheet
      - document
    note: Tracks every stock order against the forecast so the warehouse knows what lands and when.
  - pause: Run peak with the 3PL, then collect the invoice, rate card and Shopify orders for the month.
  - name: 3PL bill auditor
    skill: 3pl-bill-auditor
    job: analysis
    from: library
    method:
      - Rebuild each line from your own data
      - Compare with the invoice line by line, small lines too
      - Check delivered-on-time and pick time against the agreement
      - Draft the dispute note and score the audit
    inputs:
      - spreadsheet
      - document
    outputs:
      - audit_report
    note: Checks the invoice against the agreement terms from the bid step.
