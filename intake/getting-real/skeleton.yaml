# Workflow skeleton for Getting Real (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: getting-real
source:
  title: "Getting Real"
  by: "Jason Fried and 37signals"
  kind: book
  rights: ideas-only
minds: [jason-fried]
workflow:
  slug: launch-a-smaller-product-on-the-date-you-set
  name: "Launch a smaller product on the date you set"
  summary: "Give it your launch plan, date and budget. Get half the scope, a screened request list and a teaser plan."
  when: "a launch is running late or too big and the date matters more than the extras."
  job: build-product
  level: intermediate
steps:
  - name: "Launch scope cutter"
    skill: launch-scope-cutter
    job: ops
    from: "Getting Real, full book, chapters Build Less, Fix Time and Budget Flex Scope, Half Not Half-Assed, Done"
    method: ["Lock the date and the budget and say that only scope can move", "List every feature in the plan", "Name the heart of the product in one sentence", "Cut the list in half, then in half again, until only the core remains", "Rank what is left by what a first customer needs and draw the line where the time runs out", "Park every cut idea in a later list instead of deleting it", "Write what the smaller launch still promises and check no promise needs a cut item"]
    inputs: [question, plan!]
    outputs: [plan]
    note: "The same date with half the scope, the core first and the rest parked"
  - name: "Feature request screener"
    skill: feature-request-screener
    job: ops
    from: "Getting Real, full book, chapters Start With No, Hidden Costs, Forget Feature Requests, Make Opinionated Software"
    method: ["Answer every request with not now", "Count only repeat requests from different people over time, and drop the rest", "For each repeat, list its hidden costs: screens, help text, tour, marketing copy, terms, promises it could break, pricing", "Test it against the product's stated vision and say which side it takes", "Rule yes, later or no, with one reason", "Write a short reply that reminds the customer why they like the focused product"]
    inputs: [plan, question, voc_reviews!]
    outputs: [shortlist, copy_draft]
    note: "A yes, later or no on each, with the full cost of every yes. Reads the plan from the step before"
  - name: "Launch teaser to preview planner"
    skill: launch-teaser-to-preview-planner
    job: ops
    task: plan-strategy
    from: "Getting Real, full book, chapters Hollywood Launch, A Powerful Promo Site, Free Samples, Promote Through Education"
    method: ["Set the launch date and work back from it", "Months out, plan vague hints and a page that collects email addresses", "Pick a handful of insiders and offer them an exclusive early look", "Weeks out, plan a preview that shows features and the ideas behind the product, plus a few early-access passes", "Specify the promo site: overview, tour, screens, manifesto, case studies, praise, pricing, sign-up", "Add a free sample and one teaching piece people will share", "Plan the launch message to the collected list"]
    inputs: [plan, question!, brand_brain!]
    outputs: [plan]
    note: "A teaser, preview and launch plan with a sign-up page and free sample. Reads the plan from the step before"
