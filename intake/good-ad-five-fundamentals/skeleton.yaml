# Workflow skeleton for How to Write a Good Advertisement (a book summary) (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: good-ad-five-fundamentals
source:
  title: "How to Write a Good Advertisement (a book summary)"
  by: "Victor O. Schwab"
  kind: book
  rights: ideas-only
  year: 1962
minds: [victor-schwab]
workflow:
  slug: write-an-ad-in-five-parts-from-first-glance-to-the-ask
  name: "Write an ad in five parts, from hook to ask"
  summary: "Give it your product facts. Get an ad that grabs attention, shows a gain, proves it, sums up and asks for action."
  when: "you need a full ad, not just a headline, and want to be sure no part is missing."
  job: write-ad-copy
  level: intermediate
steps:
  - name: Find what the reader wants
    skill: buyer-wants-finder
    job: strategy
    from: "Chapter 2, show people an advantage"
    method: ["Describe the product as its maker and as its buyer", "List what the buyer could gain, be, do or save", "Pick the one want your facts can truly meet", "Mark which fits you assumed from your own taste"]
    inputs: [product_data, persona!, voc_reviews!]
    outputs: [brief]
    note: "The one want to lead with, and the reward it promises."
  - name: Write the headlines
    skill: ad-headline-writer
    job: copy
    from: "skill: ad-headline-writer"
    method: ["Set what the line may say", "List the material for each way in", "Write one line per way in", "Mark the line to test first"]
    inputs: [brief, product_data]
    outputs: [ad_copy]
    note: "Headlines for the chosen want."
  - name: Check the headline promise
    skill: headline-promise-checker
    job: copy
    task: check-ads
    from: "Chapter 1, get attention"
    method: ["Name the readers the headline should pick out", "Check that it promises a reward worth reading for", "Classify the reward as a gain or a loss avoided", "Run the so-what test"]
    inputs: [ad_copy, offer!]
    outputs: [audit_report, hooks]
    note: "Keeps only a headline that picks its reader and promises a reward."
  - name: Gather the proof
    skill: four-kind-proof-finder
    job: research
    from: "Chapter 3, prove it"
    method: ["List every claim the ad makes", "Look for proof of each in four kinds: how it is made, what it has done, what others say, what the reader can try", "Rank by how believable and checkable each is", "Mark claims with no proof"]
    inputs: [brief, product_data, voc_reviews!]
    outputs: [objection_map]
    note: "Each claim paired with the strongest proof, and the claims left bare."
  - name: Write the body with proof beside each claim
    skill: proof-backed-sales-copy-writer
    job: copy
    from: "Chapters 2 and 3, emotion first and facts to close"
    method: ["Open on the promised reward", "Put proof next to each claim", "Keep every line tied to a supplied fact"]
    inputs: [brief, product_data, offer!]
    outputs: [ad_copy]
    note: "The body that pays off the headline and backs it up."
  - name: Sum up and move the reader
    skill: summing-up-paragraph-writer
    job: copy
    from: "Chapter 4, persuade people to grasp the advantage"
    method: ["Picture the gain in the reader's ordinary day", "Sum up the main points in short sentences", "Put value before price", "Say what waiting costs or what acting gains"]
    inputs: [ad_copy, objection_map!]
    outputs: [copy_draft]
    note: "The short stretch between proof and ask that breaks inertia."
  - name: Ask for the action
    skill: call-to-action-writer
    job: copy
    from: "Chapter 5, ask for action"
    method: ["Pick the kind of ask: go and buy, try it, or reply", "Add a real reason to act now", "Remove the barriers with a guarantee and an easy path", "Write the ask in plain steps"]
    inputs: [copy_draft, offer!]
    outputs: [ad_copy]
    note: "A clear ask with a real reason to act now."
  - name: Check all five parts
    skill: five-part-ad-checker
    job: copy
    task: check-ads
    from: "Chapters 1 to 6, the five fundamentals and copy length"
    method: ["Mark where each of the five parts sits", "Test each against its pass line", "Judge the length against the job", "List fixes in the order they pay"]
    inputs: [ad_copy, brief!]
    outputs: [audit_report]
    note: "Pass or fail on attention, advantage, proof, persuasion and action."
