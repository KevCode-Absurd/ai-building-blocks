# Workflow skeleton for Grinding It Out (a book summary) (docs/INTAKE.md). Our words; the text stays in mind-sources/ray-kroc (local only).
id: grinding-it-out-copyable-system
source:
  title: "Grinding It Out: The Making of McDonald's (a book summary)"
  by: "Ray Kroc with Robert Anderson"
  kind: book
  rights: ideas-only
  year: 1977
minds: [ray-kroc]
workflow:
  slug: turn-one-working-shop-into-a-system-others-can-copy
  name: "Turn one working shop into a system others can copy"
  summary: "Describe your best location. Get written standards, a manual a stranger can follow, a readiness check and a go or no-go."
  when: "one location works well and you want a second, a partner or a franchisee to run it the same way without you."
  job: plan-strategy
  level: intermediate
steps:
  - name: Write the standards
    skill: repeatable-standards-sheet-writer
    job: strategy
    task: plan-strategy
    from: "Chapters 1, 6 and 8, the first stand and the first restaurant"
    method: ["Walk it from order to hand-off", "Turn quality, service, cleanliness and value into yes-or-no standards", "Name what you never cut", "Give each person one job"]
    inputs: [question, product_data!]
    outputs: [plan]
    note: "Standards with numbers, the never-cut lines and one job for each person."
  - name: Turn the standards into a manual
    skill: operations-manual-writer
    job: ops
    task: plan-strategy
    from: "Chapters 6 to 8, the first restaurant and the operations team"
    method: ["Write each job as steps in order, with numbers", "Write what to do when a standard is missed", "Mark what is fixed and what the local owner may change", "Add a day-one trial sheet for a newcomer"]
    inputs: [plan, question!]
    outputs: [plan]
    note: "A job card for each role, a missed-standard rule and a trial sheet for a newcomer."
  - pause: "Have someone who has never worked for you run one shift from the manual while you watch. Write down every place they stopped or asked."
  - name: Check the system is ready to copy
    skill: second-location-readiness-checker
    job: strategy
    task: plan-strategy
    from: "Chapters 6, 8 and 12, proving the first restaurant and spreading it"
    method: ["Turn the trial notes into gaps in the manual", "Check the first location makes money without you on site", "Check the second site, supplies and a person to run it", "Name what to fix before anything opens"]
    inputs: [plan, question!]
    outputs: [audit_report]
    note: "The gaps the trial showed, and whether the first location makes money without you."
  - name: Make the go or no-go call
    skill: go-or-no-go-launch-checker
    job: strategy
    task: plan-strategy
    from: "Chapters 7 and 12, adding restaurants one at a time"
    method: ["Check the plan against its known faults", "Set a halfway check", "Say go or no-go and why"]
    inputs: [audit_report, plan]
    outputs: [audit_report]
    note: "A go or no-go on the second location, with a halfway check."
