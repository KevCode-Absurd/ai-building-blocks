# Workflow skeleton for Grinding It Out (a book summary), partner deals (docs/INTAKE.md). Our words; the text stays in mind-sources/ray-kroc (local only).
id: grinding-it-out-partner-deal
source:
  title: "Grinding It Out: The Making of McDonald's (a book summary)"
  by: "Ray Kroc with Robert Anderson"
  kind: book
  rights: ideas-only
  year: 1977
minds: [ray-kroc]
workflow:
  slug: set-up-a-partner-deal-both-sides-win-from
  name: "Set up a partner deal both sides win from"
  summary: "Describe your offer. Get the partner's profit sum, fair terms in writing, an incentive check and supplier terms."
  when: "you want others to run your business, sell your product or use your name, and you want them to make money too."
  job: sell-and-negotiate
  level: advanced
steps:
  - name: Test that the partner makes money
    skill: partner-profit-tester
    job: analysis
    task: sell-and-negotiate
    from: "Chapters 7, 9 and 14, owner-operators and the fair deal"
    method: ["Write the partner's income and costs for one location or sale", "Add every fee you charge", "Test what is left at weaker sales than you hope for", "Say whether a hard-working partner earns a fair living"]
    inputs: [question, plan!]
    outputs: [audit_report]
    note: "What the partner keeps after your fees, at your forecast and at a weaker one."
  - name: Write the terms
    skill: partner-deal-terms-writer
    job: strategy
    task: sell-and-negotiate
    from: "Chapters 6 to 8, the first agreement and the franchise terms"
    method: ["Sell one location or territory at a time", "Write what you give, what they give and the standards they keep", "Get every change to the deal in writing", "Write how either side leaves"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "A one-page term sheet: what each side gives, the standards, the fees and the exits."
  - name: Check who is paid for what
    skill: incentive-checker
    job: analysis
    task: sell-and-negotiate
    from: "Chapters 7 and 9, avoiding conflicts with franchisees"
    method: ["List who is rewarded for what", "Find where the reward pulls the wrong way", "Suggest a fix"]
    inputs: [plan, question]
    outputs: [audit_report]
    note: "Where your own pay would tempt you to squeeze the partner."
  - name: Set fair terms with your suppliers
    skill: supplier-partner-terms-planner
    job: strategy
    task: sell-and-negotiate
    from: "Chapters 9 and 11, suppliers as partners"
    method: ["Say what you want from the supplier and what you will give", "Rule out gifts and side payments", "Pass cost breaks on to the partners", "Plan how you grow together"]
    inputs: [audit_report, plan!]
    outputs: [plan]
    note: "Terms that let a supplier grow with you, with cost savings passed to the partners."
