# Workflow skeleton that chains library skills (docs/INTAKE.md). Our words.
id: hand-off-the-work-only-you-do-and-keep-it-handed-off
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: hand-off-the-work-only-you-do-and-keep-it-handed-off
  name: "Hand off work only you do and stop it returning"
  summary: "Describe your week. Get what to hand off, a one-page agreement for the person taking it and a meeting plan."
  when: "you are the bottleneck, you have people who could take more and handed-off work keeps drifting back to you."
  job: lead-people
  level: intermediate
steps:
  - name: Founder leadership coach
    skill: founder-leadership-coach
    job: ops
    from: library
    method: ["Audit how your week is spent", "Sort what only you can do from what others can", "Write a delegation plan", "Name your blind spots"]
    inputs: [question]
    outputs: [plan]
    note: "Starts with where your time goes and which work to hand off first."
  - name: Results agreement writer
    skill: results-agreement-writer
    job: ops
    from: library
    method: ["Pick the type of agreement", "Write the results wanted and the limits", "List the help and resources", "Set how and when you will review"]
    inputs: [question, plan!]
    outputs: [plan]
    note: "Takes the first job on the delegation plan and writes the one-page agreement for the person who will own it."
  - name: One-on-one meeting planner
    skill: one-on-one-meeting-planner
    job: ops
    from: library
    method: ["Judge their experience with the task", "Set how often you meet", "Write the agenda rules", "Plan the follow-up"]
    inputs: [plan, question]
    outputs: [plan]
    note: "Builds a meeting rhythm around the agreement so the work does not slide back to you."
