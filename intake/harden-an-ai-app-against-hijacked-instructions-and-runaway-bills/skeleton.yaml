# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Skills run in order, each reading what the one before made.
id: harden-an-ai-app-against-hijacked-instructions-and-runaway-bills
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: harden-an-ai-app-against-hijacked-instructions-and-runaway-bills
  name: "Harden an AI app against hijacked prompts and runaway bills"
  summary: "Give it your AI app's code. Get defences against hidden instructions, tests for them, spending caps and a fresh attack test."
  when: "your app reads outside text or calls paid AI services, and one bad input or loop could cost you."
  job: secure-code
  level: advanced
steps:
  - name: "AI app injection defender"
    skill: ai-app-injection-defender
    job: ops
    from: "library"
    method: ["Map every place outside text reaches the model", "Add layers: clean the input, fence the instructions, check the output", "Add a planted-word check that shows when the model leaks its instructions", "List test inputs that try to hijack the app"]
    inputs: [codebase]
    outputs: [security_report, code_change]
    note: "Finds where hidden instructions can get in and adds layered defences."
  - name: "Test gap finder"
    skill: test-gap-finder
    job: ops
    from: "library"
    method: ["List each defence the change adds", "Search your tests for one that would fail if the defence broke", "Mark each defence covered, not covered or unknown", "Write test cases for the gaps"]
    inputs: [code_change, codebase]
    outputs: [test_report]
    note: "Checks that the new defences are covered by tests, so a later edit cannot quietly remove them."
  - pause: "Add the tests, run them and merge the defences so the next step reads the updated code."
  - name: "AI spend limit checker"
    skill: ai-spend-limit-checker
    job: ops
    from: "library"
    method: ["Find every call to a paid AI service", "Set a cap per run and per day", "Bound loops, retries and parallel calls", "Match the caps to the limit in the provider dashboard"]
    inputs: [codebase]
    outputs: [code_change, audit_report]
    note: "Adds spending caps to the hardened code so one bad loop cannot run up a bill."
  - pause: "Merge the spending caps and run the app once so the final test attacks the finished version."
  - name: "AI system attack tester"
    skill: ai-system-attack-tester
    job: ops
    from: "library"
    method: ["Run a set of injection and jailbreak prompts against the app", "Test whether tools can be tricked into harm", "Map each finding to a known attack type", "Rank the findings and say which defences held"]
    inputs: [codebase]
    outputs: [security_report]
    note: "Attacks the hardened app to show which defences hold and what is still open."
