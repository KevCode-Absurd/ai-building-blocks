# Workflow skeleton for High Output Management (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: high-output-management
source:
  title: "High Output Management"
  by: "Andy Grove"
  kind: book
  rights: ideas-only
  year: 1983
minds: [andy-grove]
workflow:
  slug: set-team-goals-run-one-on-ones-and-settle-decisions
  name: "Set team goals, run one-on-ones and settle decisions"
  summary: "Describe your team and the quarter. Get goals with key results, a one-on-one plan and a way to settle disputes."
  when: "you manage people and want goals, meetings and decisions to run on a simple system."
  job: lead-people
  level: intermediate
steps:
  - name: "Objectives and key results writer"
    skill: objectives-and-key-results-writer
    job: ops
    task: plan-strategy
    from: "High Output Management, 1983"
    method: ["Ask where you want to go and write it as one short objective", "Ask how you will pace yourself and write key results with a number and a date", "Keep to a few objectives and say no to the rest", "Choose a short period, quarterly or monthly, so feedback comes fast", "Tie each person's objectives to the objective above so meeting theirs meets yours", "Check every key result can be marked done or not done with no argument", "Treat the set as a pacing tool, not a legal file for reviews, and leave room for new openings"]
    inputs: [question, plan!]
    outputs: [plan]
    note: "A few objectives, each with dated key results that show if you got there"
  - name: "One-on-one meeting planner"
    skill: one-on-one-meeting-planner
    job: ops
    from: "High Output Management, 1983"
    method: ["Judge how experienced they are at the task they do now, not in general", "Set how often to meet: weekly for a new hand, every few weeks for a veteran", "Block an hour at least, near their work area when you can", "Make it their meeting: they write the outline and bring the numbers", "Cover warning indicators, what happened since last time, and nagging worries even if vague", "Ask one more question when they stop, and take notes on a shared outline", "Keep a hold file for items that can wait, then agree actions and check them next time"]
    inputs: [plan, question]
    outputs: [plan]
    note: "A meeting plan with agenda rules, timing and follow-up. Reads the plan from the step before"
  - name: "Informed captain decision planner"
    skill: informed-captain-decision-planner
    job: analysis
    task: think-and-decide
    from: "High Output Management, 1983"
    method: ["Name one informed captain for the decision", "List who knows most and who disagrees", "Ask each of them for the strongest case against", "Set the date the captain decides", "Write what everyone does after the call: disagree out loud, then commit", "Pick who attends: people who know the work, plus one senior person who joins as an equal", "Set the rule that all views are said out loud before anyone reads the room", "Open the debate and keep it free, noting who stays silent"]
    inputs: [plan, question]
    outputs: [plan]
    note: "One named owner, a plan to collect dissent, and a review date. Reads the plan from the step before"
