# Workflow skeleton for $100M Offers, chapters 11 to 16 (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: hormozi-offers-harder-to-refuse
source:
  title: "$100M Offers: How To Make Offers So Good People Feel Stupid Saying No"
  by: "Alex Hormozi"
  url: "https://shop.acquisition.com/products/100m-offers-hardcover"
  kind: book
  rights: ideas-only
  year: 2021
minds: [alex-hormozi]
workflow:
  slug: make-your-offer-harder-to-refuse
  name: "Make your offer harder to refuse"
  summary: "Give it your offer. Get honest limits and deadlines, bonuses, a guarantee and a name, ready to use."
  when: "your offer is sound but buyers wait, doubt it or ignore it."
  job: make-offer
  level: intermediate
steps:
  - name: Add honest limits and deadlines
    skill: honest-scarcity-and-urgency-planner
    job: strategy
    task: make-offer
    from: "Chapters 11 to 13, the dance of desire, scarcity and urgency"
    method: ["Pick a real cap on seats, new clients per week or cohort size from what you can handle", "Pick a real start date or promotion end date", "Keep supply a little under demand so the next round sells out", "Say how full you are and announce when you sell out", "Write the line for each channel and never invent a count or a clock"]
    inputs: [offer, performance_sheet!]
    outputs: [plan]
    note: "Real limits and dates, with the lines to say them."
  - name: Build the bonus stack
    skill: bonus-stack-builder
    job: strategy
    task: make-offer
    from: "Chapter 14, bonuses"
    method: ["Match one bonus to each doubt a buyer has about succeeding", "Prefer tools, checklists and templates over more training", "Name each with a benefit, say what it is, how you made it and the proof it works", "Put a price on each and justify it", "Add other businesses' services you can bundle in exchange for exposure"]
    inputs: [offer, plan, objection_map!]
    outputs: [offer]
    note: "Named bonuses, each answering one doubt, with a value and proof."
  - name: Design the guarantee
    skill: guarantee-designer
    job: strategy
    task: make-offer
    from: "Chapter 15, guarantees"
    method: ["Name the buyer's biggest fear about paying", "Choose among no-condition, conditional, all-sales-final and pay-on-performance guarantees by ticket size and cost to deliver", "Write it as: if you do not get this result in this time, we do this", "Do the refund sums to see whether net sales go up", "Tie conditions to the actions that cause success, and give it a memorable name"]
    inputs: [offer, plan!, performance_sheet!]
    outputs: [offer, plan]
    note: "A guarantee that fits your costs, with the refund math and a name."
  - name: Name the offer
    skill: offer-name-writer
    job: copy
    task: make-offer
    from: "Chapter 16, naming"
    method: ["Pick a reason why the offer exists", "Call out the avatar, as locally as you can", "State the goal, the time interval and a container word", "Write several names using three to five parts", "Plan which to test and the order to refresh it when it tires"]
    inputs: [offer, persona!]
    outputs: [shortlist]
    note: "Names to test and a plan for renaming when the offer tires."
