id: idea-to-tested-change
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: turn-an-idea-into-a-spec-tickets-and-tested-code
  name: "Turn an idea into a spec, tickets and tested code"
  summary: "Give it your idea. Get a written spec, small tickets, the code built from them, test gaps found and a pull request."
  when: "you have a feature idea in your head and want it built in small, checked pieces."
  job: build-software
  level: intermediate
steps:
  - name: "Write the spec"
    skill: spec-writer
    job: ops
    from: "skill: spec-writer"
    method: ["Look at the code to see what is there today", "Pick the one place the feature will be tested from", "Write the problem, the fix, user stories and decisions", "Publish the spec to your issue tracker"]
    inputs: [question]
    outputs: [document]
    note: "Turns your idea into a spec with user stories and testing decisions."
  - name: "Split the spec into tickets"
    skill: ticket-planner
    job: ops
    from: "skill: ticket-planner"
    method: ["Read the spec and the code around it", "Cut it into thin slices that each work from end to end", "List which tickets block which", "Check the sizes with you, then publish"]
    inputs: [document]
    outputs: [plan]
    note: "Reads the spec from the step before and cuts it into small tickets with blocking order."
  - name: "Build the tickets"
    skill: spec-builder
    job: ops
    from: "skill: spec-builder"
    method: ["Read the spec and the ticket order", "Build each ready ticket on its own branch, test first", "Merge the pieces onto one branch", "Run a final review and fix what it finds"]
    inputs: [document, codebase]
    outputs: [code_change]
    note: "Builds the spec and tickets from the steps before into one reviewed change."
  - name: "Find the missing tests"
    skill: test-gap-finder
    job: ops
    from: "skill: test-gap-finder"
    method: ["List every behaviour the change adds or alters", "Check each against the tests that exist", "Mark each covered, not covered or unknown", "Propose tests for the gaps, riskiest first"]
    inputs: [code_change, codebase]
    outputs: [test_report]
    note: "Reads the change from the build and marks what no test checks."
  - pause: "Add the tests it proposes for the riskiest gaps and run the suite."
  - name: "Write the pull request"
    skill: pull-request-writer
    job: ops
    from: "skill: pull-request-writer"
    method: ["Sketch what changed in the smallest clear view", "Add before and after proof", "Say how hard the change is to undo and what it could touch", "Keep the prose short"]
    inputs: [code_change]
    outputs: [document]
    note: "Describes the change, with proof from the tests you added, for the reviewer."
