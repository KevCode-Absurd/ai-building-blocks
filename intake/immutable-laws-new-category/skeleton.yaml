# Workflow skeleton for The 22 Immutable Laws of Marketing, new category (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: immutable-laws-new-category
source:
  title: "The 22 Immutable Laws of Marketing"
  by: "Al Ries and Jack Trout"
  kind: book
  rights: ideas-only
  year: 1993
minds: [al-ries, jack-trout]
workflow:
  slug: find-a-new-category-you-can-be-first-in-and-launch-it
  name: "Find a category to be first in and launch it"
  summary: "Paste your rivals and product. Get a category you can lead, a name for it and a press-first launch."
  when: "a rival leads your market and you cannot win by being better."
  job: plan-strategy
  level: intermediate
steps:
  - name: Map where no rival is strong
    skill: competitor-white-space-mapper
    job: research
    from: "Chapters 1, 2 and 7, leadership, category and ladder"
    method: ["List the rivals and rate each on what buyers value", "Find the rungs held and the rungs open", "Note where the leader is strong and so weak elsewhere", "Mark the spots nobody serves"]
    inputs: [competitor_set, voc_reviews!, brand_brain!]
    outputs: [audit_report]
    note: "A grid of who holds what, with the open spots marked."
  - name: Find a category you can be first in
    skill: first-in-category-finder
    job: strategy
    from: "Chapters 2, 3, 8 and 10, category, mind, duality and division"
    method: ["Ask first what, not how it is better", "Split the market by buyer, use, price, channel or kind until a branch has no leader", "Test each branch: different in the buyer's eyes, held by no one, big enough, and the right time", "Check the branch is not a bad idea that only you like", "Rank the branches and keep the top one or two"]
    inputs: [audit_report, product_data!, brand_brain!]
    outputs: [shortlist]
    note: "A ranked short list of categories you could lead, each passing four tests."
  - name: Name the category
    skill: category-name-writer
    job: copy
    from: "Chapters 1, 2 and 5, leadership, category and focus"
    method: ["Write the category in plain words a buyer would say", "Write names that could become the word for the whole category", "Pick a name that is short, easy to say and easy to remember", "Write the short case for the category before the case for your brand", "Plan how to get others to use the word"]
    inputs: [shortlist, product_data!, brand_brain!]
    outputs: [plan]
    note: "The category in buyer words, a name that can become the generic word and a pitch for the category."
  - name: Plan a launch that starts with press
    skill: publicity-first-launch-planner
    job: ops
    from: "Chapters 1, 2 and 3, and the later work of Al Ries on publicity"
    method: ["State the category and that you are first in it", "Pick the one word to own", "Find the news angle a reporter would care about", "Plan the press and third-party stories before any ad", "Set the point of trust at which ads start"]
    inputs: [plan, brand_brain, product_data]
    outputs: [plan]
    note: "A launch that starts with press coverage, then ads once people believe it."
