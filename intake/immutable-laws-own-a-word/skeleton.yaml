# Workflow skeleton for The 22 Immutable Laws of Marketing, one word (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: immutable-laws-own-a-word
source:
  title: "The 22 Immutable Laws of Marketing"
  by: "Al Ries and Jack Trout"
  kind: book
  rights: ideas-only
  year: 1993
minds: [al-ries, jack-trout]
workflow:
  slug: pick-the-one-word-to-own-in-your-customers-minds
  name: "Pick the one word to own in your customers' minds"
  summary: "Paste your rivals and product. Get one word to own, an honest line to set it up and what to cut."
  when: "you say too many things and buyers cannot say what you stand for."
  job: plan-strategy
  level: intermediate
steps:
  - name: Map the words rivals already own
    skill: owned-word-mapper
    job: research
    from: "Chapters 5, 6 and 14, focus, exclusivity and attributes"
    method: ["For each rival, write the one word buyers link to it", "Run a word-association test on the category", "Mark words that are taken", "Mark words every rival claims, like quality, which nobody owns", "Note the attribute opposite to the leader's"]
    inputs: [competitor_set, voc_reviews!]
    outputs: [audit_report]
    note: "Which words are taken, which are claimed by everyone and which are open."
  - name: Pick the word to own
    skill: ownable-word-picker
    job: strategy
    from: "Chapters 4, 5, 6 and 14, perception, focus, exclusivity and attributes"
    method: ["List candidate words of four kinds: benefit, service, audience and preference", "Cut words that are taken or that have no opposite", "Test the rest: simple, a dictionary word, benefit-led and true", "Prefer the word opposite the leader's", "Pick one and keep two backups"]
    inputs: [audit_report, product_data!, brand_brain!]
    outputs: [shortlist]
    note: "One word with two backups, each tested on four lines."
  - name: Write the honest line that sets it up
    skill: candid-line-writer
    job: copy
    from: "Chapter 15, the law of candor"
    method: ["Find a negative buyers already believe", "Check that it is widely held and quickly agreed", "Admit it in a few words without apology", "Turn at once to the word you own", "Check the flaw and the word fit together"]
    inputs: [shortlist, voc_reviews!, brand_brain!]
    outputs: [copy_draft]
    note: "Three admit-then-turn lines that set up the word."
  - name: Decide what to give up
    skill: give-up-list-planner
    job: strategy
    from: "Chapters 5, 12, 13 and 18, focus, line extension, sacrifice and success"
    method: ["List your products, offers and customer groups", "Mark each as feeding the word or diluting it", "Cut the product line to what feeds the word", "Separate the target from the whole market", "Set a rule against changing the position at budget time"]
    inputs: [shortlist, product_data!, plan!]
    outputs: [plan]
    note: "What to cut, which target to aim at and a rule that protects the word."
