# Workflow skeleton for The Intelligent Investor, revised edition (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
# Method analysis only. Not personal financial advice. Writes a plan, not a trade.
id: intelligent-investor-mr-market
source:
  title: "The Intelligent Investor (revised edition, with commentary by Jason Zweig)"
  by: "Benjamin Graham"
  kind: book
  rights: ideas-only
  year: 2003
minds: [benjamin-graham, warren-buffett]
workflow:
  slug: write-your-plan-for-a-falling-market-before-it-happens
  name: "Write your plan for a falling market before it happens"
  summary: "Paste your holdings and what you paid. Get the market's mood read, each holding checked for real change, and a written plan."
  when: "prices are swinging or you fear the next fall, and you want to decide what you will do while you are calm."
  job: money-and-investing
  level: intermediate
steps:
  - name: Read what the market is offering you
    skill: market-mood-reader
    job: analysis
    task: money-and-investing
    from: "Chapter 8, Mr. Market, pricing against timing and market fluctuations as a guide"
    method: ["Set today's price beside your own written estimate of value for each holding", "Sort the move into a change in the business or a change in the crowd's mood", "Tell pricing (are you paying too much or getting a bargain) from timing (guessing the next move)", "Say whether the offer is one to take, to ignore or to wait out"]
    inputs: [question]
    outputs: [audit_report]
    note: "A plain read of what the price is telling you and what it is not."
  - name: Check whether the business itself has changed
    skill: holding-value-change-checker
    job: analysis
    task: money-and-investing
    from: "Chapter 8, the A. and P. example and business valuations against market valuations"
    method: ["For each holding, list what has changed in earnings, debts and competition since you bought", "Ask if you would buy the same business today at this price", "Mark each holding unchanged, weaker or stronger, and say what a weaker one needs from you", "Keep the price out of the verdict"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "A holding by holding note that separates a price scare from a real problem."
  - name: Write your rules for price drops
    skill: price-drop-rules-writer
    job: ops
    task: money-and-investing
    from: "Chapter 8, never buy after a big rise or sell after a big drop, and the speculator's attitude"
    method: ["Run the half-value test and check money needed soon", "Tie every reaction to a business fact, not a price", "Set do and do-not rules for three sizes of fall and for a jump", "Fix the dates when you look"]
    inputs: [plan, audit_report!]
    outputs: [plan]
    note: "The written plan, ready before the fall."
