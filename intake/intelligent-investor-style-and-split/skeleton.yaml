# Workflow skeleton for The Intelligent Investor, revised edition (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
# Method analysis only. Not personal financial advice.
id: intelligent-investor-style-and-split
source:
  title: "The Intelligent Investor (revised edition, with commentary by Jason Zweig)"
  by: "Benjamin Graham"
  kind: book
  rights: ideas-only
  year: 2003
minds: [benjamin-graham]
workflow:
  slug: choose-your-investing-style-and-your-stock-and-bond-split
  name: "Choose your investing style and your stock and bond split"
  summary: "Tell it your time, skill and nerve. Get your investor type, a stock and bond split with rules, and a one-page policy."
  when: "you are starting to invest or have never written down how you invest, and you want a plan that fits your time, skill and nerve."
  job: money-and-investing
  level: intermediate
steps:
  - name: Find out if you are a defensive or enterprising investor
    skill: defensive-or-enterprising-investor-sorter
    job: analysis
    task: money-and-investing
    from: "Chapters 1, 4 and 6, the two kinds of investor and what return comes from effort"
    method: ["List the hours, skill and interest you can bring each month, and the nerve you showed in the last big fall", "Sort the plan by effort: a passive path for a person who wants safety and freedom from bother, an active path for a person who will do real research", "Say what return each path can fairly expect and why more effort is no promise of more return", "Name the courses that are neither: trading, short-term tips and borrowing to speculate"]
    inputs: [question]
    outputs: [audit_report]
    note: "A plain type, with the reasons, and the paths that are closed to you."
  - name: Set your stock and bond split
    skill: stock-and-bond-split-planner
    job: strategy
    task: money-and-investing
    from: "Chapters 2, 4 and 8, the 25 to 75 range, the 50-50 default and the rebalancing rule"
    method: ["Start at an even split and hold stocks between a quarter and three quarters", "Move toward the low end only if you doubt the market level and accept missing more of a rise, toward the high end only if you could watch a deep fall calmly", "Write a rule to restore the split when it drifts by about five points", "Check what stocks yield next to good bonds and what a few percent of yearly price rises does to fixed income"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "A split with a range, a rebalancing trigger and the reasons for it. No named funds or securities."
  - name: Choose the kind of bonds that fit
    skill: bond-type-and-maturity-chooser
    job: analysis
    task: money-and-investing
    from: "Chapter 4, the bond component, taxable against tax-free, short against long"
    method: ["Work out the after-tax yield of a taxable and a tax-free bond for your tax rate", "Decide short or long maturity by how much price swing you can stand", "Rank the safe kinds first and keep high-yield bonds out unless they are bought at a deep discount with study", "Say where a bank deposit can stand in for a short bond"]
    inputs: [plan, question!]
    outputs: [audit_report]
    note: "The bond half of the split made concrete: which kind, how long and why."
  - name: Write your one-page investing policy
    skill: investing-policy-page-writer
    job: ops
    task: money-and-investing
    from: "Chapters 1, 4, 8 and 10, writing down the policy and what to expect"
    method: ["Put the type, the split, the bond choice and the rebalance rule on one page", "Add what return to expect after tax and inflation, and what a bad year can look like", "State what you will not do: forecast the market, borrow to buy, chase a hot area", "Add the rule for taking advice and a date to review the page"]
    inputs: [plan, audit_report!]
    outputs: [plan]
    note: "One page you can read in a panic."
