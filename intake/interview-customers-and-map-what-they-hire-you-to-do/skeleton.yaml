# Workflow skeleton built from library skills (docs/INTAKE.md).
id: interview-customers-and-map-what-they-hire-you-to-do
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: interview-customers-and-map-what-they-hire-you-to-do
  name: "Interview customers and map what they hire you to do"
  summary: "Give it your idea. Get interview questions, then from your notes a buyer profile, their jobs and their path."
  when: "you need to hear from real customers before you decide what to build, say or change."
  job: understand-customers
  level: intermediate
steps:
  - name: "Customer interview coach"
    skill: customer-interview-coach
    job: ops
    from: "skill: customer-interview-coach"
    method: ["Set what you need to learn and who to talk to", "Write questions about their past behaviour, not your idea", "Add ways to spot polite answers and ask for a real next step", "Plan how to find people and how to write notes"]
    inputs: [brief]
    outputs: [plan, question]
    note: "Turns your idea into questions that draw honest answers and a plan for finding the people to ask."
  - pause: "Have five to ten conversations using the questions. Write or record notes straight after each one, and keep the exact words people used."
  - name: "Customer research analyst"
    skill: customer-research-analyst
    job: ops
    from: "skill: customer-research-analyst"
    method: ["Pull out jobs, pains, triggers, wanted results and alternatives from each talk", "Keep exact quotes and the words buyers use", "Group the same pains and triggers across talks", "Write one or more buyer profiles that rest on the quotes"]
    inputs: [transcript]
    outputs: [persona, voc_reviews]
    note: "Reads your interview notes and makes the buyer profile and the quote file the next steps use."
  - name: "Customer job mapper"
    skill: customer-job-mapper
    job: ops
    from: "skill: customer-job-mapper"
    method: ["Write the before and after the buyer wants", "Split the job into practical, emotional and social sides", "Name the moment that sends them looking and what else they could hire", "State what success looks like in their words"]
    inputs: [persona, brief!]
    outputs: [document]
    note: "Takes the buyer profile and writes the jobs they hire you for, with the trigger and rivals."
  - name: "Customer path blueprint maker"
    skill: customer-path-blueprint-maker
    job: ops
    from: "skill: customer-path-blueprint-maker"
    method: ["Pick the buyer and their goal", "List each step they take with touchpoints, thoughts and feelings", "Mark where it goes wrong and what sits behind the scenes", "List the fixes in order"]
    inputs: [persona, voc_reviews]
    outputs: [document]
    note: "Uses the buyer profile and the quote file to map each step they take and where it hurts."
