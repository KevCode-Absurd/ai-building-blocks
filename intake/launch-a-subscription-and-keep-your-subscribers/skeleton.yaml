# Workflow skeleton chaining skills already in the AI Blocks library (docs/INTAKE.md).
id: launch-a-subscription-and-keep-your-subscribers
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: launch-a-subscription-and-keep-your-subscribers
  name: "Launch a subscription and keep your subscribers"
  summary: "Give it your products and orders. Get a priced offer, cancel flow, billing emails and a retention calendar."
  when: "you want to add subscriptions that pay back and hold on to the people who sign up."
  job: keep-customers
  level: advanced
steps:
  - name: "Subscription offer designer"
    skill: subscription-offer-designer
    job: offer
    from: "library"
    method: ["Make the case with the store's own numbers", "Frame it as an auction", "Check cash first", "Check product fit", "Build a set of benefits, not a percentage", "Front-load the discount"]
    inputs: [product_data, performance_sheet!]
    outputs: [offer, plan]
    note: "Designs the subscription offer from your products and order data."
  - name: "Subscription payback checker"
    skill: subscription-payback-checker
    job: offer
    from: "library"
    method: ["Compute value at month 3 and month 6", "Max CAC", "First-order loss", "Compare plans", "Test the prepay arbitrage", "Check the offer stack"]
    inputs: [performance_sheet, product_data!, offer!]
    outputs: [audit_report]
    note: "Tests the designed offer against cost and payback before launch."
  - name: "Subscription cancel flow builder"
    skill: subscription-cancel-flow-builder
    job: offer
    from: "library"
    method: ["Start screen", "Ask why, then branch", "One save per reason", "Delay not pause", "Make frequency easy", "Price the save"]
    inputs: [voc_reviews, performance_sheet!, offer!]
    outputs: [plan, email_flow]
    note: "Builds the cancel flow around the offer, with save offers that keep the payback true."
  - name: "Billing reminder and confirmation writer"
    skill: billing-reminder-and-confirmation-writer
    job: email
    from: "library"
    method: ["Notice rules", "Move the email", "Layout order for the reminder", "Why the delay link comes first", "One version per rebill", "Rebuild the confirmation"]
    inputs: [product_data, brand_brain!, email_flow!]
    outputs: [email_flow]
    note: "Writes the billing and reminder emails to sit beside the cancel flow."
  - pause: "Put the subscription live and let it run for about 60 days, then export subscriber and cancel data."
  - name: "Subscription churn audit"
    skill: subscription-churn-audit
    job: analysis
    from: "library"
    method: ["Chart cancels by days since the first order", "Value gap", "Reminder and receipt", "Campaign cancels", "Save rate", "Monthly churn"]
    inputs: [performance_sheet, spreadsheet!]
    outputs: [audit_report]
    note: "Finds where in the subscriber life people leave."
  - pause: "Pick the lapse points the audit flagged and export the orders of subscribers around those dates."
  - name: "Subscriber retention calendar"
    skill: subscriber-retention-calendar
    job: email
    from: "library"
    method: ["Find the high-churn orders", "Rank gifts by cost", "Announce each gift", "Handle the day-28 billing peak", "Limit subscribers to three kinds of messages", "Leave active subscribers out of sales and promos"]
    inputs: [performance_sheet, product_data!]
    outputs: [plan]
    note: "Schedules the touches that land before each of those lapse points."
