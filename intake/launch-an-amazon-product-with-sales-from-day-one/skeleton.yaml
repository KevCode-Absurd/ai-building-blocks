# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Our words.
id: launch-an-amazon-product-with-sales-from-day-one
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: launch-an-amazon-product-with-sales-from-day-one
  name: "Launch an Amazon product with sales from day one"
  summary: "Give it your product facts and a keyword export. Get the listing, launch ads, a stock plan and a launch-week plan."
  when: "you have picked an Amazon product and want the listing, the ads, the stock and launch week ready together."
  job: sell-on-amazon
  level: intermediate
steps:
  - name: "Amazon keyword picker"
    skill: amazon-keyword-picker
    job: research
    from: "skill: amazon-keyword-picker"
    method: ["Start from seed phrases and competitor exports", "Filter for a new brand by volume, length and competition", "Mark each phrase use, drop or backend", "Choose a main phrase and secondary phrases", "Output the tiers with volumes"]
    inputs: [product_data, spreadsheet, competitor_set!]
    outputs: [shortlist]
    note: "Starts the flow. Chooses the true, searched phrases every later step uses."
  - name: "Amazon listing writer"
    skill: amazon-listing-writer
    job: copy
    from: "skill: amazon-listing-writer"
    method: ["Put the main phrase first in the title", "Write five benefit bullets", "Add a plain money-back line", "Fill the backend keywords", "Set the price and a future launch date"]
    inputs: [product_data, shortlist, competitor_set!]
    outputs: [pdp_copy]
    note: "Writes the title, bullets and backend terms from the keyword tiers."
  - name: "Amazon PPC launch builder"
    skill: amazon-ppc-launch-builder
    job: ads
    from: "skill: amazon-ppc-launch-builder"
    method: ["Cap spend by unit profit and set a daily budget you can lose", "Build an automatic campaign to learn what sells", "Build a manual keyword campaign from the same list", "Build a competitor product campaign", "Add negative keywords and stop rules"]
    inputs: [product_data, shortlist, competitor_set!]
    outputs: [plan]
    note: "Turns the same keyword list into launch campaigns with bids and negatives."
  - pause: "Place your first stock order and confirm the maker's monthly capacity and lead time."
  - name: "Amazon inbound stock planner"
    skill: amazon-inbound-stock-planner
    job: ops
    from: "skill: amazon-inbound-stock-planner"
    method: ["Size the first order from months of sales and lead time", "Split the shipment in two", "Set barcode, prep and case limits", "Check labels and choose a carrier", "Track each shipment and keep proof"]
    inputs: [spreadsheet, product_data]
    outputs: [plan, document]
    note: "Plans how much to send, when and how, using the quantities and lead times you now have."
  - pause: "Send the stock to Amazon. While it is checked in, post short videos for your wait list and send samples to small creators."
  - name: "Amazon launch week planner"
    skill: amazon-launch-week-planner
    job: organic
    from: "skill: amazon-launch-week-planner"
    method: ["Check you have time for a wait list", "Build the wait list and a private group", "Send samples to micro creators", "Set the launch-day email and first-week offer", "Turn on the ads and ask for honest reviews"]
    inputs: [product_data, brand_brain!, performance_sheet!]
    outputs: [plan]
    note: "Plans launch day around the live listing, the ads and the stock that has arrived."
