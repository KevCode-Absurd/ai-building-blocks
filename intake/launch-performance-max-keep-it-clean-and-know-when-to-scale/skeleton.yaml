# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Skills run in order, each reading what the one before made.
id: launch-performance-max-keep-it-clean-and-know-when-to-scale
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: launch-performance-max-keep-it-clean-and-know-when-to-scale
  name: "Launch Performance Max, keep it clean, know when to scale"
  summary: "Give it your catalogue and break-even numbers. Get a Performance Max build, a clean-up list and a go or wait on scaling."
  when: "your Shopping and Search are steady and you are thinking of adding Performance Max."
  job: run-google-ads
  level: advanced
steps:
  - name: "Performance Max launch planner"
    skill: performance-max-launch-planner
    job: ads
    from: "library"
    method: ["Test whether your budget and conversions fit Performance Max", "Group products into asset groups and set the budget share", "Switch off the settings that waste spend and exclude brand", "Set bidding and a review rhythm"]
    inputs: [product_data, performance_sheet, brand_brain!]
    outputs: [plan]
    note: "Says go or wait, then gives the build."
  - pause: "Build the campaign as planned and leave the big settings alone for three to four weeks. Then export the asset group, product, search term and placement reports."
  - name: "Performance Max routine keeper"
    skill: performance-max-routine-keeper
    job: analysis
    from: "library"
    method: ["Read the search terms and branded sales", "Find products, pages and placements that spend without selling", "Apply the budget rule and the reality check", "Score the waste"]
    inputs: [performance_sheet, product_data!]
    outputs: [audit_report, plan]
    note: "Checks the live campaign against the plan and lists what to exclude or replace."
  - name: "Google Ads scale gate checker"
    skill: google-ads-scale-gate-checker
    job: analysis
    from: "library"
    method: ["Check feed, tracking, structure, creative and bid maturity", "Compare return with break-even", "Check the plan raises spend in small steps", "Score readiness and make the go or wait call"]
    inputs: [performance_sheet, audit_report!]
    outputs: [audit_report]
    note: "Takes the clean-up findings and decides whether raising spend is safe."
