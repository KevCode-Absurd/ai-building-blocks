# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md). Our words.
id: launch-tiktok-ads-and-read-your-first-test
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: launch-tiktok-ads-and-read-your-first-test
  name: "Launch TikTok ads and read your first test"
  summary: "Give it your store and videos. Get a setup fix list, a starter campaign, a test verdict and Spark ad picks."
  when: "you have never run TikTok ads, or your last start went nowhere."
  job: launch-and-scale-ads
  level: beginner
steps:
  - name: "TikTok ads account setup checker"
    skill: tiktok-ads-account-setup-checker
    job: ads
    from: "library"
    method: ["Check accounts, links, billing and security","Check the pixel and events on your store","Check account defaults and privacy settings","Score it and say what comes next"]
    inputs: [store_capture, question!]
    outputs: [audit_report]
    note: "Starts by finding what is broken in the account before any money is spent."
  - pause: "Fix what the checker found. Pick or film three to five videos to test."
  - name: "TikTok starter campaign builder"
    skill: tiktok-starter-campaign-builder
    job: ads
    from: "library"
    method: ["Pick the campaign type and set the budget per ad group","Lay out three levels with budget optimisation off while testing","Set targeting and build the audiences","Set the four-week ladder"]
    inputs: [question, video_ads]
    outputs: [plan]
    note: "Builds the starter campaign around the videos you picked."
  - pause: "Run the campaign for at least three days. Export the results."
  - name: "TikTok ad test reader"
    skill: tiktok-ad-test-reader
    job: analysis
    from: "library"
    method: ["Check there is enough data","Read the first 24 hours and day 3","Decide for each ad: keep, cut or change","Plan the next test"]
    inputs: [performance_sheet, question!]
    outputs: [audit_report, plan]
    note: "Reads the first results against the plan and decides each ad."
  - pause: "Pull stats on your organic posts and any creator posts."
  - name: "TikTok Spark ad picker"
    skill: tiktok-spark-ad-picker
    job: ads
    from: "library"
    method: ["Check there are enough posts and the wait is long enough","Rank the posts and check each pick before boosting","Get the code for creator posts","Test the boost and repeat"]
    inputs: [performance_sheet, question!]
    outputs: [shortlist, plan]
    note: "Picks which posts to boost, using what the test read showed works."
