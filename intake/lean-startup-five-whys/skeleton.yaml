# Workflow skeleton for The Lean Startup, book (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: lean-startup-five-whys
source:
  title: "The Lean Startup"
  by: "Eric Ries"
  kind: book
  rights: ideas-only
  year: 2011
minds: [eric-ries, taiichi-ohno]
workflow:
  slug: find-why-it-went-wrong-and-fix-it-in-proportion
  name: "Find why it went wrong and fix it in proportion"
  summary: "Describe a failure. Get a no-blame review plan, a checked chain of whys and sized fixes."
  when: "something broke, missed its date or let customers down, and you want to stop it happening again without overreacting."
  job: lead-people
  level: intermediate
steps:
  - name: Plan the review so it stays about the process
    skill: five-whys-session-planner
    job: ops
    task: lead-people
    from: "Chapter 11, Adapt: the curse of the five blames, getting started"
    method: ["Pick a narrow class of failure and a rule that triggers a review every time", "List everyone who spotted, fixed or built the part that failed, and put them in the room", "Name a moderator with the authority to see fixes through", "Agree two rules: tolerate a mistake the first time, never let it happen twice", "Plan what to say when blame starts"]
    inputs: [question]
    outputs: [plan]
    note: "Who must be in the room, the trigger rule, the moderator and the rules for the review."
  - name: Ask why until you reach a cause you can fix
    skill: root-cause-finder
    job: analysis
    task: think-and-decide
    from: "Chapter 11, the wisdom of the five whys"
    method: ["State the problem as something seen, with place and date", "Ask why and answer from facts", "Repeat until you reach a process or training cause, usually about five times", "Try a second branch"]
    inputs: [question, plan!, feedback_notes!]
    outputs: [audit_report]
    note: "A chain of whys checked against facts and the fixable cause. Reads the review plan from the step before."
  - name: Size a fix to each level
    skill: proportional-fix-planner
    job: ops
    task: lead-people
    from: "Chapter 11, make a proportional investment; the five whys in action"
    method: ["Pair each answer in the chain with one fix", "Size each fix to how much the problem hurt, starting with its first hour", "Give each fix one owner and one date", "Say how you will know it worked and what to do if it recurs", "Write the review up in plain words for everyone"]
    inputs: [audit_report, plan!]
    outputs: [plan]
    note: "One fix at each level of the chain, sized to the pain, with an owner, a date and a check. Reads the chain from the step before."
