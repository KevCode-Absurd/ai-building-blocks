# Workflow skeleton for The Lean Startup, book (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: lean-startup-riskiest-guess
source:
  title: "The Lean Startup"
  by: "Eric Ries"
  kind: book
  rights: ideas-only
  year: 2011
minds: [eric-ries, steve-blank]
workflow:
  slug: find-the-riskiest-guess-in-your-plan-and-test-it
  name: "Find the riskiest guess in your plan and test it"
  summary: "Paste your plan. Get the guesses it rests on as numbers, the smallest test for the riskiest and pass lines set first."
  when: "you have a new product, service or project and want proof of the shakiest part before you build more."
  job: test-an-idea
  level: intermediate
steps:
  - name: Find the guesses your plan rests on
    skill: leap-of-faith-assumption-finder
    job: strategy
    task: test-an-idea
    from: "Chapter 5, Leap"
    method: ["Restate any comparison to another success as plain facts about your own customers", "Split the plan into the value guess (do they get a benefit once they use it) and the growth guess (how will new people find it)", "Cross out the guesses that are well-known facts", "Write each remaining guess as a present-tense sentence with a number attached", "Rank by how much of the plan collapses if it is wrong"]
    inputs: [brief, question!]
    outputs: [plan]
    note: "The few guesses the plan stands on, each with a predicted number, the riskiest first."
  - name: Pick the smallest test that teaches
    skill: smallest-test-picker
    job: research
    task: test-an-idea
    from: "Chapter 6, Test"
    method: ["Name the one guess this test must answer", "Choose a form: smoke test, explainer video, hand-delivered service, human behind the screen or one-feature version", "Aim it at early adopters who feel the need most", "Cut every feature or step that does not feed the answer", "Check that the test measures what people do, not what they say"]
    inputs: [plan]
    outputs: [plan]
    note: "The cheapest form of test for the top guess, and the list of things to leave out. Reads the guesses from the step before."
  - name: Set the numbers and the next move
    skill: mvp-experiment-planner
    job: research
    from: "Chapters 6 and 7, MVP and learning milestones"
    method: ["Write the pass, fail and middle numbers before the run", "Run it with one customer group at a time", "Read what customers did, not what they said", "Write what to do on a pass, a fail and a middle result"]
    inputs: [plan!, question]
    outputs: [plan]
    note: "Pass lines set before the run, the run plan and a pivot or persevere rule. Reads the test from the step before."
