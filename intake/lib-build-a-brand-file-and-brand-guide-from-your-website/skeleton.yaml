# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: lib-build-a-brand-file-and-brand-guide-from-your-website
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: build-a-brand-file-and-brand-guide-from-your-website
  name: "Build a brand file and brand guide from your website"
  summary: "Give it your website. Get a brand file, a founder interview to fill its gaps, and a brand guide."
  when: "you want one brand file every AI can read, plus a guide for designers and writers."
  job: brand-file
  level: intermediate
steps:
  - name: Build the brand file
    skill: website-brand-brain-builder
    job: brand
    from: "skill: website-brand-brain-builder"
    method: ["Read the site pages", "Tag each fact by how sure it is", "Ask up to five questions the site cannot answer", "Write the eight brand files"]
    inputs: [web_page, voc_reviews!, performance_sheet!, product_data!]
    outputs: [brand_brain]
    note: "Turns your site into a brand file with every gap marked unknown, disputed or inferred."
  - name: Plan the founder interview
    skill: founder-interview-planner
    job: brand
    from: "skill: founder-interview-planner"
    method: ["Turn every gap into a question", "Rank questions by what blocks work today", "Split into a call list and a quick written list", "File each answer with its source"]
    inputs: [brand_brain]
    outputs: [brand_brain]
    note: "Reads the gaps in the brand file and turns them into a short ranked interview plan."
  - pause: "Hold the founder call, send the written questions, and file each answer in the brand file."
  - name: Build the brand guide
    skill: brand-guide-builder
    job: brand
    from: "skill: brand-guide-builder"
    method: ["Check colours and fonts are on file", "Give a reason for each choice from the brand file", "Check text and background contrast", "Build the guide page and the token file"]
    inputs: [brand_brain]
    outputs: [brand_guide]
    note: "Uses the finished brand file, now with the founder's answers, to build a guide and a tokens file."
