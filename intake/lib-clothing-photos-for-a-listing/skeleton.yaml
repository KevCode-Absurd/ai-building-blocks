# Workflow skeleton: chain of existing library skills (docs/INTAKE.md).
id: lib-clothing-photos-for-a-listing
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: turn-a-clothing-flat-lay-into-marketplace-ready-photos
  name: Turn a clothing flat lay into marketplace-ready photos
  summary: Give it a phone photo of a garment. Get a cleaned photo, a worn-shape photo, fabric close-ups and a rules check.
  when: you sell clothing and have only a flat-lay phone photo.
  job: product-photos
  level: beginner
steps:
  - name: Product photo retoucher
    skill: product-photo-retoucher
    job: ops
    from: "skill: product-photo-retoucher"
    method:
      - Check the photo is big enough
      - Press out random wrinkles
      - Square up the shoulders and sleeves
      - Even the light and clean the background
    inputs:
      - product_photos
    outputs:
      - photo_set
    note: "Starts the chain: a cleaner flat-lay photo."
  - pause: Pick the retouched photo that looks most like your real garment and save it.
  - name: Ghost mannequin photo maker
    skill: ghost-mannequin-photo-maker
    job: ops
    from: "skill: ghost-mannequin-photo-maker"
    method:
      - Check the flat lay is flat and complete
      - Fill the shoulders and chest
      - Curve the sleeves naturally
      - Show the inside of the collar
      - Keep colour and pattern unchanged
    inputs:
      - product_photos
    outputs:
      - photo_set
    note: Reads the retouched photo you chose and shapes it as if worn.
  - pause: Save the worn-shape photo you like best. The next step zooms into it.
  - name: Fabric close-up maker
    skill: fabric-close-up-maker
    job: ops
    from: "skill: fabric-close-up-maker"
    method:
      - Pick one area to zoom into
      - Frame a close-up of the fabric
      - Keep colour, weave and stitching true
      - Add no detail the garment lacks
    inputs:
      - product_photos
    outputs:
      - photo_set
    note: Zooms into the fabric of the worn-shape photo you saved.
  - pause: Put the retouched photo, the worn-shape photo and the close-ups you plan to use in one folder.
  - name: AI product photo inspector
    skill: ai-product-photo-inspector
    job: ops
    task: check-ads
    from: "skill: ai-product-photo-inspector"
    method:
      - Rate the risk of each picture
      - Run eight checks, from warped products to garbled text
      - Say use, retry or retouch
      - Write lines to add to the prompt for a retry
    inputs:
      - product_photos
    outputs:
      - audit_report
    note: Looks over the pictures you gathered for AI faults.
  - pause: Redo or retouch any picture the inspector flagged, then save the final set.
  - name: Marketplace photo rule checker
    skill: marketplace-photo-rule-checker
    job: ops
    task: check-ads
    from: "skill: marketplace-photo-rule-checker"
    method:
      - Pick the marketplace
      - Check background, size and framing
      - Mark pass or reject for each rule
      - Give a fix for each reject
    inputs:
      - product_photos
    outputs:
      - audit_report
    note: Checks the pictures that passed the last step against marketplace rules.
