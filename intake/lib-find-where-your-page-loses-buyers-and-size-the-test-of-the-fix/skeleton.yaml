id: lib-find-where-your-page-loses-buyers-and-size-the-test-of-the-fix
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: find-where-your-page-loses-buyers-and-test-the-fix
  name: "Find where your page loses buyers and test the fix"
  summary: "Give it your page and step numbers. Get the worst drop-off, the unanswered doubts and how long a fair test needs."
  when: "your page gets visits but few sales and you want to fix it in order, then prove it worked."
  job: audit-landing-page
  level: intermediate
steps:
  - name: Find the worst drop-off
    skill: sales-funnel-drop-off-finder
    job: page
    from: "skill: sales-funnel-drop-off-finder"
    method: ["Build the step table", "Find the leakiest step", "Match it to the page that owns it", "Review that page on a phone and size the fix"]
    inputs: [landing_page, performance_sheet!, brand_brain!]
    outputs: [audit_report]
    note: "Shows which step loses the most buyers and which page owns the leak."
  - pause: "Fix the worst step it found and save the updated page."
  - name: Find the doubts the page leaves open
    skill: unanswered-customer-question-finder
    job: page
    from: "skill: unanswered-customer-question-finder"
    method: ["List the buyer doubts", "Find the current answer", "Separate a missing answer from missing proof", "Place each answer where the buyer decides"]
    inputs: [voc_reviews, landing_page, brand_brain!]
    outputs: [objection_map]
    note: "Checks the fixed page against real customer questions and says where each answer goes."
  - pause: "Add the answers to the page, then export visits and orders for the last few weeks."
  - name: Size the test
    skill: ab-test-traffic-checker
    job: analysis
    from: "skill: ab-test-traffic-checker"
    method: ["Work out the honest numbers", "Pick the smallest lift worth finding", "Size the test and give the verdict", "Set the rules for running it"]
    inputs: [performance_sheet]
    outputs: [audit_report]
    note: "Says whether your traffic can prove the new page works and how many weeks that takes."
