id: lib-find-your-best-offer-and-sell-it-with-an-article-style-page-and-ad
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: find-your-best-offer-and-write-the-page-and-ad
  name: "Find your best offer and write the page and ad"
  summary: "Give it your brand file and live prices. Get an offer to try, an article-style page, a check and a matching ad."
  when: "you want a new offer tested through a page and an ad that read like an article."
  job: make-offer
  level: intermediate
steps:
  - name: Find the offer to try
    skill: hidden-offer-finder
    job: offer
    from: "skill: hidden-offer-finder"
    method: ["Copy down what is live and flag clashes", "Take stock before inventing", "Turn stock into offers for a buyer and stage", "Run the honesty checks and pick three to try"]
    inputs: [brand_brain, persona!]
    outputs: [offer]
    note: "Finds the clashes in your live deals and the offer worth testing first."
  - name: Write the article-style page
    skill: article-style-landing-page-writer
    job: page
    from: "skill: article-style-landing-page-writer"
    method: ["Keep the ad's promise in the first screen", "Label the page as an ad", "Write ten sections in four moves", "Build the offer block"]
    inputs: [brand_brain, offer, ad_copy!, voc_reviews!, persona!]
    outputs: [landing_page]
    note: "Puts the chosen offer in an article-style page, with the offer block near the end."
  - name: Check the page in 30 points
    skill: landing-page-30-point-checker
    job: page
    from: "skill: landing-page-30-point-checker"
    method: ["Run 30 yes-or-no checks at five stops", "Quote the page for every no", "Flag the deal-breakers", "Rank five fixes"]
    inputs: [landing_page, brand_brain!]
    outputs: [audit_report]
    note: "Reviews the new page and ranks the five fixes to make before an ad points to it."
  - name: Write the article-style ad
    skill: article-style-image-ad-writer
    job: copy
    from: "skill: article-style-image-ad-writer"
    method: ["Check the ad fits the page", "Write the headline as an editor would", "Hold one claim in third person", "Brief the image"]
    inputs: [brief, brand_brain, landing_page]
    outputs: [ad_copy, image_prompt]
    note: "Writes the ad that sends people to the checked page, with one claim and an image brief."
