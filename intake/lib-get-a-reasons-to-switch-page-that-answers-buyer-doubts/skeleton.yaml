id: lib-get-a-reasons-to-switch-page-that-answers-buyer-doubts
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: get-a-reasons-to-switch-page-that-answers-doubts
  name: "Get a reasons-to-switch page that answers doubts"
  summary: "Give it a buyer's doubt and your costs. Get an offer, a reasons-to-switch page and the doubts it still leaves open."
  when: "buyers use something else today and your page has to give them reasons to move."
  job: write-landing-page
  level: intermediate
steps:
  - name: Build an offer that answers the doubt
    skill: offer-builder-that-answers-buyer-doubts
    job: offer
    from: "skill: offer-builder-that-answers-buyer-doubts"
    method: ["Name the buyer and the doubt", "Put the doubt on one lever", "Build the offer and check the profit", "Run the five checks and word it"]
    inputs: [persona, product_data, brand_brain!]
    outputs: [offer]
    note: "Makes the offer the page will carry, built to settle the buyer's main doubt."
  - name: Write the reasons-to-switch page
    skill: reasons-to-switch-page-writer
    job: page
    from: "skill: reasons-to-switch-page-writer"
    method: ["Pin the buyer and the old way", "Choose 3 to 7 reasons", "Put proof under each claim", "Add the offer once, questions and headlines"]
    inputs: [brand_brain, offer, ad_copy!, voc_reviews!]
    outputs: [landing_page]
    note: "Builds the page around the offer from the step before, with one reason and one piece of proof each."
  - name: Find the doubts the page leaves open
    skill: unanswered-customer-question-finder
    job: page
    from: "skill: unanswered-customer-question-finder"
    method: ["List the buyer doubts", "Find the current answer on the page", "Separate a missing answer from missing proof", "Place each answer where the buyer decides"]
    inputs: [voc_reviews, landing_page, brand_brain!]
    outputs: [objection_map]
    note: "Checks the new page against customer questions and lists each doubt it does not yet answer."
  - name: Audit the page
    skill: landing-page-auditor
    job: page
    from: "skill: landing-page-auditor"
    method: ["Name the page's job and check the scent", "Read it as a glance, a skim and a doubt", "Check the phone basics", "Rank the fixes, quick wins first"]
    inputs: [landing_page, brand_brain!]
    outputs: [audit_report]
    note: "Reads the finished page like a stranger and ranks what to fix before it goes live."
