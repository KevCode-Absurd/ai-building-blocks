# Workflow skeleton chained from the AI Blocks library (docs/INTAKE.md).
id: lib-get-a-short-product-reel-with-captions-that-fit
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: get-a-short-product-reel-with-captions-that-fit
  name: "Get a short product reel with captions that fit"
  summary: "Give it your product facts and photos. Get a satisfying-motion script, a short reel and timed captions."
  when: "you want a short reel that shows your real product in use, with words that stay readable."
  job: make-video-ads
  level: intermediate
steps:
  - name: Pick the buyer and the angle
    skill: ad-angle-planner
    job: copy
    from: "skill: ad-angle-planner"
    method: ["Pick one level and one stage", "Copy that row into the brief", "Fill in the buyer and their doubt", "Check the brief"]
    inputs: [brief, brand_brain!]
    outputs: [brief]
    note: "Start from the idea and write the brief that fixes who the ad is for and what it argues."
  - name: Write the satisfying-motion script
    skill: satisfying-motion-video-ad-script-writer
    job: video
    from: "skill: satisfying-motion-video-ad-script-writer"
    method: ["Check the fit", "Pick what is in focus", "Keep it physical", "No face and no voice in the opening"]
    inputs: [product_data, brief, brand_brain]
    outputs: [script]
    note: "Use the brief to write an opening built on one satisfying movement of your product, then the demo."
  - name: Make the reel
    skill: get-offer-reel-that-shows-your-real-product
    job: video
    from: "skill: get-offer-reel-that-shows-your-real-product"
    method: ["Lay the beat grid", "Write the shot list", "Build the film from the real photos", "Render every size"]
    inputs: [product_data, script, offer!, brand_brain, product_photos!]
    outputs: [video_ads]
    note: "Build a 10 to 20 second reel from the script and your real product photos."
  - name: Plan the on-screen words
    skill: on-screen-text-planner-for-video-ads
    job: video
    from: "skill: on-screen-text-planner-for-video-ads"
    method: ["Pick the moments", "Choose the words", "Time and place them", "Count and check"]
    inputs: [script, video_ads, offer!]
    outputs: [edit_plan]
    note: "Read the reel and the script and place short words clear of the buttons."
  - name: Make the captions
    skill: video-caption-maker-in-your-brand-font
    job: video
    from: "skill: video-caption-maker-in-your-brand-font"
    method: ["Lock the words", "Split into caption groups", "Time each group to the speech", "Place them clear of the buttons"]
    inputs: [video_ads, script, brand_brain!]
    outputs: [video_ads]
    note: "Add timed captions to the reel in your brand font and write the subtitle file."
  - name: Check before launch
    skill: pre-launch-ad-checker
    job: ads
    from: "skill: pre-launch-ad-checker"
    method: ["Walk the ad as a viewer on a phone", "Check every fact", "Split stop-ship from worth-a-look", "Give the verdict"]
    inputs: [video_ads!, static_ads!, script!, ad_copy!, image_prompt!, brand_brain!]
    outputs: [audit_report]
    note: "Check the finished reel before it runs."
