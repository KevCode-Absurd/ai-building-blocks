# Workflow skeleton chained from the AI Blocks library (docs/INTAKE.md).
id: lib-get-a-talking-product-video-ad-ready-to-generate
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: get-a-talking-product-video-ad-ready-to-generate
  name: "Get a talking product video ad ready to generate"
  summary: "Give it your product and buyer. Get a script where the product talks, clip prompts, and an ad rules check."
  when: "you want a short video ad where your product speaks, made with AI video tools."
  job: make-video-ads
  level: advanced
steps:
  - name: Pick the buyer and the angle
    skill: ad-angle-planner
    job: copy
    from: "skill: ad-angle-planner"
    method: ["Pick one level and one stage", "Copy that row into the brief", "Fill in the buyer and their doubt", "Check the brief"]
    inputs: [brief, brand_brain!]
    outputs: [brief]
    note: "Start from the idea and write the brief that fixes who the ad is for and what it argues."
  - name: Write the script
    skill: talking-object-video-ad-script-writer
    job: video
    from: "skill: talking-object-video-ad-script-writer"
    method: ["Check the fit", "Choose who talks", "Test the object on four counts", "Write the words"]
    inputs: [brief, voc_reviews!, brand_brain]
    outputs: [script]
    note: "Use the brief to write a script where the product is the speaker."
  - name: Check every line
    skill: video-ad-script-line-checker
    job: video
    from: "skill: video-ad-script-line-checker"
    method: ["Label each line by beat", "Run the checks", "Quote each weak line with a fix", "Count spoken words against the budget"]
    inputs: [script!]
    outputs: [audit_report]
    note: "Check the script line by line and list the weak lines with fixes."
  - name: Write the clip prompts
    skill: talking-object-video-clip-prompt-writer
    job: video
    from: "skill: talking-object-video-clip-prompt-writer"
    method: ["Describe only the motion", "Plan the takes", "Plan voice and lip-sync", "Plan the edit"]
    inputs: [script, product_data, brand_brain!]
    outputs: [image_prompt, video_prompt, avatar_sheet, edit_plan]
    note: "Turn the checked script into clip prompts, a character sheet and an edit plan."
  - name: Check the ads against Meta rules
    skill: meta-ads-compliance-checker
    job: ads
    from: "skill: meta-ads-compliance-checker"
    method: ["Pick the rule groups that matter", "Judge what is shown or said", "Rate each finding", "Rewrite with the fixes in"]
    inputs: [ad_copy!, script!, static_ads!, landing_page!]
    outputs: [audit_report]
    note: "Check the script and the claims a talking product makes against Facebook and Instagram ad rules."
