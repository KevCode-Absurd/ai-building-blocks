# Workflow skeleton chained from the AI Blocks library (docs/INTAKE.md).
id: lib-get-product-photos-in-three-looks-from-one-set-of-phone-photos
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: get-product-photos-in-three-looks-from-phone-photos
  name: "Get product photos in three looks from phone photos"
  summary: "Give it your website and product photos. Get a styled photo set, flash snapshots and a copy of a look you like."
  when: "you need product photos for ads and your shop and only have phone photos."
  job: product-photos
  level: intermediate
steps:
  - name: Build your brand file
    skill: website-brand-brain-builder
    job: brand
    from: "skill: website-brand-brain-builder"
    method: ["Read the site and tag every fact", "Check in once with the owner", "Write the eight brand files", "Cross-check the files"]
    inputs: [web_page, voc_reviews!, performance_sheet!, product_data!]
    outputs: [brand_brain]
    note: "Start here so the rest uses your real prices, terms, colours and claims."
  - name: Plan a styled photo set
    skill: product-photo-shoot-planner
    job: image
    from: "skill: product-photo-shoot-planner"
    method: ["Write down the product", "Write the style sheet", "Plan the frames on a grid", "Write each prompt"]
    inputs: [product_photos, brand_brain]
    outputs: [photo_set]
    note: "Use the brand file and your photos to set one style and plan nine matching photos."
  - name: Make flash snapshots
    skill: flash-snapshot-product-photo-maker
    job: image
    from: "skill: flash-snapshot-product-photo-maker"
    method: ["Write down the product", "Set the three flash dials", "Plan the roll as one occasion", "Write each prompt"]
    inputs: [product_photos, brand_brain, persona!]
    outputs: [photo_set]
    note: "Use the brand look to plan six flash snapshots that read like a real night out, not a studio."
  - name: Copy a look you like
    skill: reference-style-product-photo-maker
    job: image
    from: "skill: reference-style-product-photo-maker"
    method: ["Write down the product", "Read the reference as the set that made it", "Keep, swap or drop each line", "Write and rank the prompt"]
    inputs: [product_photos, reference_set!, brand_brain!]
    outputs: [photo_set]
    note: "Use the brand file to match the look of one photo you admire with your own product."
