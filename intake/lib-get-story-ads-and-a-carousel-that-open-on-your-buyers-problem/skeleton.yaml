id: lib-get-story-ads-and-a-carousel-that-open-on-your-buyers-problem
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: get-story-ads-and-a-carousel-from-your-buyers-problem
  name: "Get story ads and a carousel from your buyer's problem"
  summary: "Give it customer reviews and product facts. Get a problem story, a card-by-card carousel and a story image ad."
  when: "you want ads that tell your buyer's story first and bring the product in late."
  job: write-ad-copy
  level: intermediate
steps:
  - name: Write the buyer brief
    skill: buyer-brief-writer
    job: copy
    from: "skill: buyer-brief-writer"
    method: ["Find the moment buyers started looking", "Sort the evidence into four forces", "Place their awareness", "Pick the one force the copy must move"]
    inputs: [voc_reviews, brand_brain!]
    outputs: [brief]
    note: "Turns the reviews into one buyer, one moment and the force the story has to move."
  - name: List the selling points in buying order
    skill: selling-points-writer
    job: copy
    from: "skill: selling-points-writer"
    method: ["Climb from feature to benefit to meaning", "Keep the questions this buyer asks", "Order the points as they are bought", "Flag claims that need proof"]
    inputs: [product_data, brief]
    outputs: [ad_copy]
    note: "Uses the brief to pick which product facts matter to this buyer and in what order."
  - name: Write the problem story
    skill: problem-story-copy-writer
    job: copy
    from: "skill: problem-story-copy-writer"
    method: ["Set the opening scene", "Map the fall and find the low point", "Write the turn and the rise", "Bring the product in last"]
    inputs: [brief, product_data, brand_brain!]
    outputs: [ad_copy]
    note: "Writes a long story from the buyer's moment in the brief, with the product arriving last."
  - name: Split the story into carousel cards
    skill: story-carousel-ad-writer
    job: ads
    from: "skill: story-carousel-ad-writer"
    method: ["Pick the shape and card count", "Write card 1 to work alone", "Give each card one idea and a headline", "Write the last card and the main text"]
    inputs: [brief, product_data]
    outputs: [ad_copy]
    note: "Turns the same buyer and facts into cards, each with its picture, words and headline."
  - name: Write the story image ad
    skill: story-image-ad-writer
    job: ads
    from: "skill: story-image-ad-writer"
    method: ["Find the push in the customer quotes", "Pick the narrator and shape", "Write what the picture makes people wonder", "Plan two tests"]
    inputs: [voc_reviews, product_data, brief!]
    outputs: [ad_copy, image_prompt]
    note: "Writes one story for a single image from the brief and the quotes, with a picture plan and test plan."
