# Workflow skeleton chained from the AI Blocks library (docs/INTAKE.md).
id: lib-get-three-offer-image-ads-ready-to-launch
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: get-three-offer-image-ads-ready-to-launch
  name: "Get three offer image ads ready to launch"
  summary: "Give it your website and prices. Get new offers to try, three image ads built on one, and an ad rules check."
  when: "you want image ads that sell one offer clearly and are checked before they run."
  job: make-image-ads
  level: intermediate
steps:
  - name: Build your brand file
    skill: website-brand-brain-builder
    job: brand
    from: "skill: website-brand-brain-builder"
    method: ["Read the site and tag every fact", "Check in once with the owner", "Write the eight brand files", "Cross-check the files"]
    inputs: [web_page, voc_reviews!, performance_sheet!, product_data!]
    outputs: [brand_brain]
    note: "Start here so the rest uses your real prices, terms, colours and claims."
  - name: Find offers to try first
    skill: hidden-offer-finder
    job: offer
    from: "skill: hidden-offer-finder"
    method: ["Copy down what is live", "Flag clashes between offers", "Turn stock into new offers", "Pick three to try first"]
    inputs: [brand_brain, persona!]
    outputs: [offer]
    note: "Read the prices and deals in the brand file, flag clashes and pick the offer to build ads on."
  - name: Plan three offer image ads
    skill: three-way-offer-image-ad-planner
    job: ads
    from: "skill: three-way-offer-image-ad-planner"
    method: ["Split the offer into three parts", "Write the offer block", "Lay out each size for its own shape", "Run the contact-sheet test"]
    inputs: [offer, product_photos, voc_reviews!, brand_brain!]
    outputs: [static_ads]
    note: "Use the chosen offer to plan three ads that each show it a different way, in two sizes."
  - name: Check the ads against Meta rules
    skill: meta-ads-compliance-checker
    job: ads
    from: "skill: meta-ads-compliance-checker"
    method: ["Pick the rule groups that matter", "Judge what is shown or said", "Rate each finding", "Rewrite with the fixes in"]
    inputs: [ad_copy!, script!, static_ads!, landing_page!]
    outputs: [audit_report]
    note: "Check all three ads and their words against Facebook and Instagram ad rules before launch."
