# Workflow skeleton chained from the AI Blocks library (docs/INTAKE.md).
id: lib-make-new-image-ads-in-the-style-your-best-ads-share
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: make-new-image-ads-in-the-style-your-winners-share
  name: "Make new image ads in the style your winners share"
  summary: "Give it your ads with results. Get the style your winners share, new ad plans, and image prompts ready to make."
  when: "you have a few image ads with results and want new ones that keep what worked."
  job: make-image-ads
  level: intermediate
steps:
  - name: Find the style your winners share
    skill: winning-image-ad-style-finder
    job: ads
    from: "skill: winning-image-ad-style-finder"
    method: ["Rank the ads by the result you judge on", "Read the top and bottom ads on five traits", "Keep only the traits that split winners from the rest", "Plan new ads that change one thing each"]
    inputs: [brand_brain, performance_sheet, product_data]
    outputs: [ad_style_dna, brief]
    note: "Start from your ads and results. Keep the style traits and drop the old words and numbers."
  - name: Fix the settings for every new ad
    skill: image-ad-settings-picker
    job: ads
    from: "skill: image-ad-settings-picker"
    method: ["Collect your brief and choices", "Fill every setting with a choice", "Run the conflict check", "List any material still missing"]
    inputs: [brief]
    outputs: [brief]
    note: "Turn the new ad plans into a brief with the settings locked, so every ad is made the same way."
  - name: Plan the words and layout of each ad
    skill: single-image-ad-planner
    job: ads
    from: "skill: single-image-ad-planner"
    method: ["Write the one-sentence argument", "Place the buyer and pick the claim", "Pick the ad type and the look", "Set the reading order and zones"]
    inputs: [brand_brain!, voc_reviews!, product_data, angle_library!, script!, brief!, product_photos!]
    outputs: [ad_copy, image_prompt]
    note: "Plan each ad from the locked brief: the argument, the words on the image and the feed copy."
  - name: Write the image prompts
    skill: accurate-product-image-ad-maker
    job: image
    from: "skill: accurate-product-image-ad-maker"
    method: ["Sort the brief into three piles", "Give every photo one job", "Fix the lock lines", "Write the prompt in five blocks"]
    inputs: [brief, product_photos!, ad_copy!, brand_brain!, lessons_register!]
    outputs: [image_prompt]
    note: "Turn each planned ad and its words into a prompt that keeps the real product."
  - pause: "Make the images in your image tool, look at each one at full size, and pick the ones to keep."
  - name: Get the picked images to full size
    skill: image-upscale-checker
    job: image
    from: "skill: image-upscale-checker"
    method: ["Check the original first", "Work out the real target size", "Pick the upscaler by what is in the picture", "Check every change in the returned file"]
    inputs: [approved_image]
    outputs: [upscaled_image]
    note: "Take the images you approved and set up a faithful upscale to the size each place needs."
