# Workflow skeleton: chain of existing library skills (docs/INTAKE.md).
id: lib-narrated-video-ad-the-pictures-can-carry
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: write-a-narrated-video-ad-the-pictures-can-carry
  name: Write a narrated video ad the pictures can carry
  summary: Give it your brief and brand file. Get a narrated script trimmed of lines the pictures say, plus clip prompts.
  when: you want a one to ten minute video ad that still works with the sound off.
  job: make-video-ads
  level: advanced
steps:
  - name: Long-form video ad script writer
    skill: long-form-video-ad-script-writer
    job: video
    from: "skill: long-form-video-ad-script-writer"
    method:
      - Check narration is the right tool
      - List the problems, explanations, doubts and proof
      - Set the length from what you have
      - Build each round so it moves
      - Write a picture for every line
    inputs:
      - brief
      - persona!
      - brand_brain
    outputs:
      - script
    note: "Starts the chain: a narrated script with a picture for each line."
  - name: Voice-over stripping test
    skill: voice-over-stripping-test
    job: ops
    task: check-ads
    from: "skill: voice-over-stripping-test"
    method:
      - Split narration from scene
      - Strip the narration and reread what is left
      - Mark each line as telling or adding
      - Cut or turn telling lines into action
      - Reread cold
    inputs:
      - script
    outputs:
      - feedback_notes
      - script
    note: Tests the narration from the step before and cuts lines the pictures already say.
  - name: Ad script read-aloud editor
    skill: ad-script-read-aloud-editor
    job: copy
    from: "skill: ad-script-read-aloud-editor"
    method:
      - Say each line at delivery speed
      - Fix every line that trips
      - Keep the voice steady across the script
      - Strip habits that sound machine-made
    inputs:
      - script
    outputs:
      - script
    note: Takes the trimmed script and makes each remaining line easy to say.
  - name: Video ad shot list maker
    skill: video-ad-shot-list-maker
    job: video
    from: "skill: video-ad-shot-list-maker"
    method:
      - Write the film plan
      - Time the words to the pace
      - Count and vary the shots
      - Write clip prompts that describe only the motion
    inputs:
      - script
      - product_data
    outputs:
      - shot_list
      - image_prompt
      - video_prompt
      - edit_plan
    note: Turns the final script into timed shots and clip prompts.
