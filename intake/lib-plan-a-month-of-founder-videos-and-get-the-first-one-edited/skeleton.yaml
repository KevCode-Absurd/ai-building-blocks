# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: lib-plan-a-month-of-founder-videos-and-get-the-first-one-edited
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: plan-a-month-of-founder-videos-and-edit-the-first
  name: "Plan a month of founder videos and edit the first"
  summary: "Give it your brand file. Get ten founder video episodes, a script for the first, and an edit plan for your footage."
  when: "you want regular founder videos without staring at a blank page each week."
  job: grow-social
  level: beginner
steps:
  - name: Plan the video series
    skill: founder-video-series-planner
    job: organic
    from: "skill: founder-video-series-planner"
    method: ["Sort founder questions into four threads", "Pair each with something to show", "Choose ten and order them", "Add the filming setup"]
    inputs: [brand_brain, persona!]
    outputs: [plan, brief]
    note: "Turns your brand file into ten episodes and a brief for the first one."
  - name: Script the first episode
    skill: founder-video-ad-script-writer
    job: video
    from: "skill: founder-video-ad-script-writer"
    method: ["Find the decision only the founder can speak to", "Tell it in four moves", "Offer two or three openings", "Keep the founder's own voice"]
    inputs: [brief, brand_brain]
    outputs: [script]
    note: "Takes the first episode's brief and writes a script that sounds like the founder."
  - name: Make it easy to say aloud
    skill: ad-script-read-aloud-editor
    job: video
    from: "skill: ad-script-read-aloud-editor"
    method: ["Say every line at speaking speed", "Fix only what trips the tongue", "Keep voice and tense steady", "Strip machine-made habits"]
    inputs: [script]
    outputs: [script]
    note: "Reads the script aloud line by line and fixes the places a person would stumble."
  - pause: "Film the episode using the script and the filming setup."
  - name: Plan the edit
    skill: social-video-edit-planner
    job: organic
    from: "skill: social-video-edit-planner"
    method: ["Log the footage", "Shape the story and the opening", "Plan captions and sound", "Check the platform rules"]
    inputs: [footage, brand_brain!]
    outputs: [edit_plan]
    note: "Plans cuts, captions, cover and export for the footage you filmed."
