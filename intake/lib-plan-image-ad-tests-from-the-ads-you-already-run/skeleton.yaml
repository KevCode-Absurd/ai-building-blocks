# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: lib-plan-image-ad-tests-from-the-ads-you-already-run
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: plan-image-ad-tests-from-the-ads-you-already-run
  name: "Plan image ad tests from the ads you already run"
  summary: "Give it your running image ads. Get the gaps in them, a test brief, image ad copy and scored opening lines."
  when: "you run image ads and need to know what to test next."
  job: plan-ad-tests
  level: intermediate
steps:
  - name: Find the gaps in your image ads
    skill: image-ad-gap-finder
    job: ads
    from: "skill: image-ad-gap-finder"
    method: ["Code every running ad", "Fill the grid of types and styles", "Find the question stuck without an answer", "Write an ad card for each new pick"]
    inputs: [static_ads, voc_reviews!]
    outputs: [brief]
    note: "Maps what your image ads already cover and picks up to three new tests."
  - name: Write the test brief
    skill: ad-test-brief-writer
    job: ads
    from: "skill: ad-test-brief-writer"
    method: ["Grade the evidence", "Name the buyer doubt", "Choose the plan", "Write three versions per idea"]
    inputs: [brand_brain, performance_sheet!, voc_reviews!, competitor_set!, audit_report!, brief!]
    outputs: [brief]
    note: "Turns the gap cards into a brief with three ideas and three versions each."
  - name: Write the ad copy
    skill: image-ad-copy-writer
    job: copy
    from: "skill: image-ad-copy-writer"
    method: ["Give each field its job", "Match depth to what the buyer knows", "Test one appeal per version", "Use only real proof"]
    inputs: [brief, offer!, voc_reviews!]
    outputs: [ad_copy]
    note: "Writes headline and text for each version in the brief."
  - name: Score the opening lines
    skill: ad-first-line-writer-and-scorer
    job: copy
    from: "skill: ad-first-line-writer-and-scorer"
    method: ["Pick moves by what the buyer knows", "Gate by speaker and by facts", "Write about ten lines", "Score each and say what a win would tell you"]
    inputs: [brief, brand_brain!, ad_copy!]
    outputs: [hooks]
    note: "Writes and scores opening lines for the same ideas, so you start the test with the strongest."
