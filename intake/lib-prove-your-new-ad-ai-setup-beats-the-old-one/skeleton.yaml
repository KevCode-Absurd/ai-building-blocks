# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: lib-prove-your-new-ad-ai-setup-beats-the-old-one
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: prove-your-new-ad-ai-setup-beats-the-old-one
  name: "Prove your new ad AI setup beats the old one"
  summary: "Give it a story ad test plan. Get handoff cards that keep facts whole, then a blind old-versus-new score."
  when: "you changed how AI makes your ads and need proof the new way is better."
  job: set-up-ai
  level: expert
steps:
  - name: Plan the story ad test
    skill: story-ad-test-planner
    job: ads
    from: "skill: story-ad-test-planner"
    method: ["Check the fit", "Sort customer words into problems", "Pick the lead problem and narrator", "Plan four stories to test"]
    inputs: [voc_reviews, product_data, persona!, landing_page!]
    outputs: [plan]
    note: "Writes the plan for the chain of AI steps that will make your story ads."
  - name: Plan the handoffs
    skill: ai-workflow-handoff-planner
    job: ops
    from: "skill: ai-workflow-handoff-planner"
    method: ["Lock every claim as a whole card", "Label facts by how sure they are", "Write a handoff card per step", "Set run rules for retries and resuming"]
    inputs: [plan]
    outputs: [plan]
    note: "Takes the test plan and writes what each AI step is sent and must never lose."
  - pause: "Run the old chain and the new chain on the same briefs and save every image ad each one makes."
  - name: Score old against new
    skill: old-vs-new-ad-prompt-scorer
    job: analysis
    from: "skill: old-vs-new-ad-prompt-scorer"
    method: ["Freeze the before set", "Build matched pairs", "Run pass or fail checks", "Judge blind, twice, with order swapped"]
    inputs: [static_ads, brief]
    outputs: [audit_report]
    note: "Compares the two sets of image ads and says whether the new setup is better, worse or just cheaper."
