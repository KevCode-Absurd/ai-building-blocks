# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: lib-send-creators-a-gift-and-a-brief-they-can-film-from
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: send-creators-a-gift-and-a-brief-to-film-from
  name: "Send creators a gift and a brief to film from"
  summary: "Give it your brand file. Get a creator gifting plan, a phone-video script, a filming brief and an edit plan."
  when: "you want creators to post about your product and need a clear brief to send them."
  job: grow-social
  level: intermediate
steps:
  - name: Plan the gifting
    skill: influencer-gifting-planner
    job: organic
    from: "skill: influencer-gifting-planner"
    method: ["Score creators on fit, not size", "Write the one-page card", "Add the disclosure wording", "Plan how to read each post"]
    inputs: [brand_brain, persona!]
    outputs: [plan, brief]
    note: "Picks who to send to and what to ask, in a card creators can answer."
  - name: Write the phone-video script
    skill: selfie-style-video-ad-script-writer
    job: video
    from: "skill: selfie-style-video-ad-script-writer"
    method: ["Settle who is speaking", "Write the spine in one line", "Pick one concrete anchor", "Write five beats and say them aloud"]
    inputs: [brief, voc_reviews, brand_brain, persona!, product_data!]
    outputs: [script]
    note: "Turns the gifting brief into a short phone-video script a creator could film."
  - name: Write the filming brief
    skill: creator-filming-brief-writer
    job: video
    from: "skill: creator-filming-brief-writer"
    method: ["State deliverables and deadline", "Describe the idea in a few lines", "Order the shoot to save takes", "Split must-haves from maybes"]
    inputs: [script, product_data]
    outputs: [brief]
    note: "Turns the script into a brief the creator can follow without asking questions."
  - pause: "Send the gift and the brief, then collect the creator's footage."
  - name: Plan the edit
    skill: video-ad-edit-planner
    job: video
    from: "skill: video-ad-edit-planner"
    method: ["Sort the footage by job", "Open on a clean first frame", "Protect product and proof", "Plan captions, sound and close"]
    inputs: [footage, script, offer!, product_data!]
    outputs: [edit_plan]
    note: "Plans the cut of the creator's footage against the approved script."
