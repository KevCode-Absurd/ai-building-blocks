# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: lib-turn-competitor-gaps-into-image-ad-copy-that-passes-meta
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: turn-competitor-gaps-into-image-ad-copy-that-passes-meta
  name: "Turn competitor gaps into image ad copy that passes Meta"
  summary: "Give it competitor ads. Get their gaps, image ad copy for each gap, and a Meta rules check."
  when: "you want image ads that fill a gap competitors leave open and are safe to run."
  job: study-competitors
  level: advanced
steps:
  - name: Build the swipe file
    skill: competitor-ad-swipe-file-builder
    job: research
    from: "skill: competitor-ad-swipe-file-builder"
    method: ["Remove your own ads and merge duplicates", "File each ad under one type", "Pick three per type from different advertisers", "Write one note per question"]
    inputs: [reference_set, competitor_set!, brand_brain!]
    outputs: [shortlist]
    note: "Sorts the competitor ads into a board of types so patterns show."
  - name: Find the gaps
    skill: competitor-ad-gap-finder
    job: research
    from: "skill: competitor-ad-gap-finder"
    method: ["Write a card per ad from the creative", "Count advertisers per type to find crowded cells", "Read buyer wants and doubts from reviews", "Brief your version of each gap"]
    inputs: [reference_set, brand_brain, competitor_set!, shortlist!]
    outputs: [ad_breakdowns, brief]
    note: "Uses the sorted ads to map what is crowded and what no one says, then briefs the gaps."
  - name: Write the image ad copy
    skill: image-ad-copy-writer
    job: copy
    from: "skill: image-ad-copy-writer"
    method: ["Give each field its job", "Open the main text by the ad type", "Match depth to what the buyer knows", "Use only real proof"]
    inputs: [brief, offer!, voc_reviews!]
    outputs: [ad_copy]
    note: "Writes headline and text for each gap brief, with one appeal tested per version."
  - name: Check it against Meta rules
    skill: meta-ads-compliance-checker
    job: ads
    from: "skill: meta-ads-compliance-checker"
    method: ["Pick the rule groups that apply", "Judge what the ad says", "Rate each finding", "Rewrite with the fixes in"]
    inputs: [ad_copy!, script!, static_ads!, landing_page!]
    outputs: [audit_report]
    note: "Checks the new copy against Meta ad rules and rewrites any line that would be rejected."
