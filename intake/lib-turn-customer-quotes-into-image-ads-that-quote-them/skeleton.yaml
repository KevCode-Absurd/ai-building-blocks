# Workflow skeleton chained from the AI Blocks library (docs/INTAKE.md).
id: lib-turn-customer-quotes-into-image-ads-that-quote-them
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: turn-customer-quotes-into-image-ads-that-quote-them
  name: "Turn customer quotes into image ads that quote them"
  summary: "Give it your reviews. Get quote image ads, a review card ad, an ad rules check and the ad types still missing."
  when: "you have real customer words and want image ads that carry them unchanged."
  job: make-image-ads
  level: intermediate
steps:
  - name: Find the reasons people buy
    skill: customer-buying-reasons-finder
    job: research
    from: "skill: customer-buying-reasons-finder"
    method: ["Mark up phrases, do not summarise", "Tag each phrase by force", "Count separate people", "Rank the reasons"]
    inputs: [voc_reviews, brand_brain!]
    outputs: [angle_library]
    note: "Rank the reasons in your reviews with the exact phrases, so the quote ads use real ones."
  - name: Make quote image ads
    skill: image-ad-maker-from-customer-quotes
    job: ads
    from: "skill: image-ad-maker-from-customer-quotes"
    method: ["Sort each quote by its job", "Keep one reason per set", "Lock the phrase word for word", "Write the feed text for each ad"]
    inputs: [angle_library, product_photos!]
    outputs: [static_ads, ad_copy]
    note: "Build the quote ads from the ranked reasons and their exact phrases."
  - name: Make a review card ad
    skill: complaint-review-image-ad-maker
    job: image
    from: "skill: complaint-review-image-ad-maker"
    method: ["Sort every review with one test", "Copy the winner word for word", "Keep the real stars", "Say how to make the card"]
    inputs: [voc_reviews, ad_copy]
    outputs: [image_prompt]
    note: "Add one plain review card whose small grumble works as a reason to buy, in copy that matches the quote ads."
  - name: Check the ads against Meta rules
    skill: meta-ads-compliance-checker
    job: ads
    from: "skill: meta-ads-compliance-checker"
    method: ["Pick the rule groups that matter", "Judge what is shown or said", "Rate each finding", "Rewrite with the fixes in"]
    inputs: [ad_copy!, script!, static_ads!, landing_page!]
    outputs: [audit_report]
    note: "Check the quote ads and the feed text against Facebook and Instagram ad rules."
  - name: Find the ad types still missing
    skill: image-ad-gap-finder
    job: ads
    from: "skill: image-ad-gap-finder"
    method: ["Code every ad by type", "Fill the grid", "Find the stuck question", "Write a card for each new type"]
    inputs: [static_ads, voc_reviews!]
    outputs: [brief]
    note: "Code the ads from this run, find the types the set leaves out and brief the next three."
