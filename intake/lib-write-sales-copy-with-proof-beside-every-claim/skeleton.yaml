id: lib-write-sales-copy-with-proof-beside-every-claim
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: write-sales-copy-with-proof-beside-every-claim
  name: "Write sales copy with proof beside every claim"
  summary: "Give it customer reviews and product facts. Get a buyer brief, two openings to test and a body with proof."
  when: "you are writing a long sales page and want every claim to carry its proof."
  job: write-landing-page
  level: intermediate
steps:
  - name: Write the buyer brief
    skill: buyer-brief-writer
    job: copy
    from: "skill: buyer-brief-writer"
    method: ["Find the moment buyers started looking", "Sort the evidence into four forces", "Place their awareness", "Pick the one force the copy must move"]
    inputs: [voc_reviews, brand_brain!]
    outputs: [brief]
    note: "Turns the reviews into one buyer and the force the page must move."
  - name: Write two openings
    skill: sales-copy-opening-writer
    job: copy
    from: "skill: sales-copy-opening-writer"
    method: ["Find the starting lead", "Check you have what it needs", "Write opening A and a neighbouring opening B", "Name the promise the close must keep"]
    inputs: [brief, brand_brain!]
    outputs: [hooks]
    note: "Writes two openings from the brief, so you test two leads against each other."
  - name: Write the body and close
    skill: proof-backed-sales-copy-writer
    job: copy
    from: "skill: proof-backed-sales-copy-writer"
    method: ["Find the one true detail to build on", "Cover four jobs in the order the opening sets", "Match proof to each doubt", "State the deal and the real guarantee"]
    inputs: [brief, product_data]
    outputs: [ad_copy]
    note: "Continues from the opening's promise with the body and close, proof beside each claim."
