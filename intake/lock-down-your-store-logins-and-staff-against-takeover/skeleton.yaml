# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Our words.
id: lock-down-your-store-logins-and-staff-against-takeover
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: lock-down-your-store-logins-and-staff-against-takeover
  name: "Lock down your store logins and staff against takeover"
  summary: "Describe your team and apps. Get a security score, a fix list, a sign-in policy and a phishing rule sheet."
  when: "you want to know how safe your store logins, staff access and apps are, and fix the gaps."
  job: protect-your-store
  level: beginner
steps:
  - name: "Store security checkup"
    skill: store-security-checkup
    job: ops
    from: "skill: store-security-checkup"
    method: ["Split the job between your platform and you", "Score two-step sign-in, access, apps, card data and backups", "Score phishing and password habits", "Rank fixes into today, this month and this quarter"]
    inputs: [question, store_capture!]
    outputs: [audit_report, plan]
    note: "Starts the flow. Finds the gaps and ranks the fixes."
  - pause: "Do the fixes marked today: turn on two-step sign-in for every admin, remove leavers and delete unused apps."
  - name: "Sign-in security checker"
    skill: store-sign-in-security-checker
    job: ops
    from: "skill: store-sign-in-security-checker"
    method: ["Sort what your platform covers from what you cover", "Drop old password rules and check new ones against breach lists", "Rank second steps: keys, apps, then codes", "Harden recovery and risky changes", "Write a one-page sign-in policy"]
    inputs: [question]
    outputs: [audit_report, document]
    note: "Takes the checkup's sign-in and password findings and writes the policy for staff and customers."
  - pause: "Share the sign-in policy with your team and move everyone onto a password manager."
  - name: "Staff phishing rules briefer"
    skill: staff-phishing-rules-briefer
    job: ops
    from: "skill: staff-phishing-rules-briefer"
    method: ["Check the base: no shared logins, a password manager in use", "Teach how to read a web address", "Cover lookalike letters, fake windows and warning pages", "Name who to tell about a suspicious message", "Run a ten-minute drill"]
    inputs: [question]
    outputs: [document]
    note: "Builds the staff rule sheet and drill on top of the sign-in policy, closing the phishing gap the checkup found."
