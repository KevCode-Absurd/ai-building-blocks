# Workflow skeleton chained from existing skills in the AI Blocks library (docs/INTAKE.md).
id: map-your-rivals-and-write-a-message-they-cannot-answer
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: map-your-rivals-and-write-a-message-they-cannot-answer
  name: "Map your rivals and write a message they cannot answer"
  summary: "Give it your product and rivals. Get a position map, the words nobody owns and a message you can defend."
  when: "you sell against rivals who sound alike and need one message nobody else can say."
  job: study-competitors
  level: intermediate
steps:
  - name: "Map where each rival sits"
    skill: positioning-grid-builder
    job: brand
    from: "library"
    method: ["List every real alternative, including doing nothing", "Choose two axes that shoppers feel", "Plot each alternative and swap an axis to check", "Mark crowded and open spots", "Test each gap and pick the corner you can own"]
    inputs: [question, competitor_set!, voc_reviews!, brand_brain!]
    outputs: [competitor_set]
    note: "Starts the chain: writes the rival set with where each one sits and which corners are open."
  - name: "Find the words nobody owns"
    skill: owned-word-mapper
    job: research
    from: "library"
    method: ["List the rivals, leader first", "Pick the one word each rival is known for", "Mark each word taken, contested or open", "Find the claims everyone makes that nobody owns", "List three open words that buyers care about"]
    inputs: [competitor_set, voc_reviews!]
    outputs: [audit_report]
    note: "Reads the mapped rivals from the step before and marks which words are taken and which are open."
  - name: "Turn a rival weakness into a message"
    skill: rival-weakness-message-finder
    job: strategy
    from: "library"
    method: ["List each rival's weak spots from public facts", "List your strengths and the proof you can show", "Match both on the same axis", "Keep only differences a buyer can check", "Write the message and test the rival's best reply"]
    inputs: [competitor_set, brand_brain!]
    outputs: [angle_library]
    note: "Takes the map and picks the one strength of yours that is also a rival's weakness."
