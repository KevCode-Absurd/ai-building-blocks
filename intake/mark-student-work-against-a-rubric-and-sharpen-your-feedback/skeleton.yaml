# Workflow skeleton that chains library skills (docs/INTAKE.md). Our words.
id: mark-student-work-against-a-rubric-and-sharpen-your-feedback
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: mark-student-work-against-a-rubric-and-sharpen-your-feedback
  name: "Mark student work against a rubric and sharpen your feedback"
  summary: "Give it a learning goal and student work. Get a rubric, the gaps, the causes and checked feedback."
  when: "students keep making the same mistakes and your comments do not seem to change the next piece of work."
  job: teach-and-train
  level: intermediate
steps:
  - name: Single-point rubric builder
    skill: single-point-rubric-builder
    job: ops
    from: library
    method: ["Write the one criterion for the goal", "Describe what meeting it looks like", "Leave open columns for evidence of falling short and exceeding", "Word it so students can use it too"]
    inputs: [brief]
    outputs: [document]
    note: "Makes the criterion every later step marks against."
  - pause: "Pick one piece of student work, or a handful, and have it ready to paste."
  - name: Student work gap finder
    skill: student-work-gap-finder
    job: ops
    from: library
    method: ["Set the work against the rubric", "Name exactly what is missing", "Say why it is missing", "Suggest the feedback to give"]
    inputs: [document]
    outputs: [audit_report]
    note: "Marks the student work you pasted against the rubric from step one."
  - name: Student mistake analyser
    skill: student-mistake-analyser
    job: ops
    from: library
    method: ["List the errors the gap check found", "Group them by likely cause", "Separate slips from misunderstandings", "Match each cause to feedback or teaching"]
    inputs: [document]
    outputs: [feedback_notes]
    note: "Takes the gaps found against the rubric and traces each to a cause with a fix."
  - pause: "Write your comments to the student using the causes and fixes above."
  - name: Written feedback checker
    skill: written-feedback-checker
    job: ops
    from: library
    method: ["Read each comment for how specific it is", "Check it tells the student what to do next", "Flag comments that only praise or only judge", "Rewrite weak comments"]
    inputs: [feedback_notes]
    outputs: [audit_report]
    note: "Checks the comments you wrote from the analysis, and rewrites the weak ones."
