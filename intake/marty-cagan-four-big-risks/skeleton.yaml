# Workflow skeleton for The Four Big Risks (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: marty-cagan-four-big-risks
source:
  title: "The Four Big Risks"
  by: "Marty Cagan"
  kind: blog
  rights: ideas-only
  year: 2017
minds: [marty-cagan]
workflow:
  slug: check-an-ideas-four-risks-and-rewrite-your-roadmap
  name: "Check an idea's four risks and rewrite your roadmap"
  summary: "Paste your product idea. Get its four risks rated and a feature list rewritten as problems with results to measure."
  when: "your roadmap is a list of features and nobody can say what each should change."
  job: build-product
  level: intermediate
steps:
  - name: "Product idea risk checker"
    skill: product-idea-risk-checker
    job: research
    task: test-an-idea
    from: "The Four Big Risks, summary"
    method: ["State the problem and the customer in plain words", "Ask what evidence says people will want and use it (value)", "Ask whether people can work it out without help (usability)", "Ask whether builders can deliver it with the time, skills and tools you have (feasibility)", "Ask what could veto it in sales, legal, cost or brand (viability)", "Name one owner for each risk", "Pick the cheapest test for the riskiest one and write the result that would change your plan"]
    inputs: [question, voc_reviews!, brand_brain!]
    outputs: [audit_report, plan]
    note: "The four risks rated and the cheapest test to run first"
  - name: "Feature roadmap to outcomes rewriter"
    skill: feature-roadmap-to-outcomes-rewriter
    job: ops
    task: plan-strategy
    from: "Study notes on Product vs. Feature Teams"
    method: ["Mark each item as a feature, a problem or a result", "Ask who asked for each and what they hope will change", "Rewrite each feature as a problem for a named customer", "Give each problem one result you can measure", "Group them into three to five problems", "Note who owns value and viability for each", "Replace fixed dates with a review point and the evidence needed"]
    inputs: [plan, audit_report!, question!]
    outputs: [plan]
    note: "A short list of problems to solve, each with a result to measure. Reads the plan from the step before"
