# Workflow skeleton from the craft shown in the novel Misery (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: misery-craft-page-turner-scene
source:
  title: "Misery"
  by: "Stephen King"
  kind: book
  rights: ideas-only
  year: 1987
minds: [stephen-king, alfred-hitchcock]
workflow:
  slug: draft-a-scene-that-makes-readers-need-the-next-one
  name: "Draft a scene that makes readers need the next one"
  summary: "Tell it what happens in the scene. Get a hook plan, a fair way out, a drafted scene and a find-the-lull check."
  when: "you are writing a chapter or scene and want readers to say they have to find out what happens next."
  job: write-and-tell-stories
  level: intermediate
steps:
  - name: Plan the hook
    skill: next-page-hook-planner
    job: strategy
    from: "The 'gotta know' feeling and the Can You? game, as thoughts of a character"
    method: ["Name the one question the reader must want answered", "Say who it is about and what they stand to lose", "Pick the exact line where the scene stops, at the peak of trouble", "Plan the answer for the next scene", "Decide what to plant earlier so the answer is fair"]
    inputs: [question]
    outputs: [plan]
    note: "One open question, one stopping point and a planned answer."
  - name: Check the way out is fair
    skill: fair-escape-checker
    job: analysis
    from: "The rule that a way out must be fair, not a rescue from nowhere"
    method: ["List each way the character gets out of trouble", "Find where its means were shown to the reader earlier", "Flag any escape that arrives by luck or by an outsider", "Check each escape costs something", "Rewrite each flagged escape using what is already on the page"]
    inputs: [plan]
    outputs: [audit_report]
    note: "The planned answer must use something the reader has already seen."
  - name: Draft the scene
    skill: page-turner-scene-drafter
    job: creative
    from: "How the scenes are built: concrete detail, short beats, a stop on the peak"
    method: ["Open in the middle of the trouble with one concrete detail", "Use brand names, sounds and small objects in place of general words", "Keep the beats short and put the worst fact late", "Hold back one fact that answers the open question", "Stop on the planned line"]
    inputs: [plan, audit_report!]
    outputs: [copy_draft]
    note: "A full scene built on the hook plan and the fair-escape notes."
  - name: Find where readers would put it down
    skill: page-pull-scene-checker
    job: analysis
    from: "The pull of the gotta-know feeling, tested line by line"
    method: ["Mark the open question in every paragraph", "Find the lowest-pull paragraph, where a reader would stop", "Check the last line leaves the question open", "Cut or sharpen the lull", "Give a verdict on the pull"]
    inputs: [copy_draft, plan!]
    outputs: [audit_report, feedback_notes]
    note: "Marks the paragraph where a reader would put the book down, and fixes it."
