# Workflow skeleton from the craft shown in the novel Misery (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: misery-craft-trapped-suspense
source:
  title: "Misery"
  by: "Stephen King"
  kind: book
  rights: ideas-only
  year: 1987
minds: [stephen-king, alfred-hitchcock]
workflow:
  slug: build-suspense-in-a-story-where-your-character-cannot-leave
  name: "Build suspense in a story where your character cannot leave"
  summary: "Tell it who is stuck and who holds them. Get a sealed setting, mood map, cost ladder and fair-escape check."
  when: "you are writing a story about someone trapped, watched or cornered and want the dread to keep rising."
  job: write-and-tell-stories
  level: intermediate
steps:
  - name: Seal the setting
    skill: closed-setting-planner
    job: strategy
    from: "The whole novel: one house, one room, one person who cannot leave"
    method: ["Name the one place and who is stuck in it", "List every way out and every object in reach", "Give each way out a believable reason it is shut", "Pick the few ordinary objects and sounds the reader will learn to watch", "Write what the trapped person knows that the other does not"]
    inputs: [question]
    outputs: [plan]
    note: "A small closed world where every exit is shut for a reason a reader accepts."
  - name: Map the mood swings
    skill: volatile-antagonist-mood-mapper
    job: strategy
    from: "The captor's changing moods and the signs the prisoner learns to read"
    method: ["Name three or four moods from calm to dangerous", "For each, write the early sign the trapped person can notice", "Write what the captor does and what it costs in each mood", "Name the small trigger that flips one mood to the next", "Give the captor a sincere reason they think they are right"]
    inputs: [plan]
    outputs: [plan]
    note: "The person who holds the power gets a mood scale, so every calm scene carries a threat."
  - name: Build the cost ladder and the clock
    skill: rising-cost-ladder-builder
    job: strategy
    from: "Each attempt to ease or end the captivity costs more than the last"
    method: ["List the attempts the trapped person can make, small to big", "Price each one in something that stays lost", "Order them so each costs more than the one before", "Let the reader see the price before the character does at least once", "Set a clock the character cannot move"]
    inputs: [plan]
    outputs: [plan]
    note: "Every try gets more expensive, and a deadline sits over all of it."
  - name: Check every escape is fair
    skill: fair-escape-checker
    job: analysis
    from: "The rule that a way out must be fair, not a rescue from nowhere"
    method: ["List each way the character gets out of trouble", "Find where its means were shown to the reader earlier", "Flag any escape that arrives by luck or by an outsider", "Check each escape costs something", "Rewrite each flagged escape using what is already on the page"]
    inputs: [plan]
    outputs: [audit_report]
    note: "Every escape uses something the reader has already seen."
  - name: Check every scene turns
    skill: scene-turn-checker
    job: analysis
    from: "Scene-by-scene pass over the plan"
    method: ["List the scenes in order", "Write what changes in each", "Name the choice that causes the change", "Flag scenes where nothing turns"]
    inputs: [plan, question!]
    outputs: [plan, audit_report]
    note: "Reads the plan and marks any scene where nothing turns."
