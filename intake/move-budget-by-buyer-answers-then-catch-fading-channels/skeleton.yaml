# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Skills run in order, each reading what the one before made.
id: move-budget-by-buyer-answers-then-catch-fading-channels
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: move-budget-by-buyer-answers-then-catch-fading-channels
  name: "Move budget by buyer answers, then catch fading channels"
  summary: "Give it survey answers and spend by channel. Get over-credited channels, a budget move and a check on fading channels."
  when: "platform reports and what buyers say disagree and you are unsure where the next dollar should go."
  job: read-ad-results
  level: advanced
steps:
  - name: "Post-purchase survey reader"
    skill: post-purchase-survey-reader
    job: analysis
    from: "library"
    method: ["Count whether there are enough answers to trust", "Sort answers into channels", "Compare each channel's share of spend, platform sales and answers", "Pick a small budget move to test and score the trust"]
    inputs: [voc_reviews, performance_sheet, spreadsheet!]
    outputs: [audit_report, plan]
    note: "Shows which channels the platforms over-credit and which budget move to test."
  - name: "Next-dollar budget allocator"
    skill: next-dollar-budget-allocator
    job: ads
    from: "library"
    method: ["Ask what the next ten thousand dollars brings in new-customer revenue", "Grade the evidence behind each channel", "Find where each channel stops paying back", "Write a test plan for the biggest move"]
    inputs: [performance_sheet, plan!, question!]
    outputs: [plan]
    note: "Takes the survey's budget move and ranks it against the other channels."
  - pause: "Make the budget move and leave it for eight weeks. Then export spend, responses and customers by channel for each month, including earlier months."
  - name: "Channel decay checker"
    skill: channel-decay-checker
    job: analysis
    from: "library"
    method: ["Line up spend, response rate and cost per customer by channel and month", "Mark where each channel began to fall", "Test the three causes of a fall", "Suggest small refreshes and one channel to try"]
    inputs: [performance_sheet]
    outputs: [audit_report, plan]
    note: "Shows whether the moved budget helped and which channels are wearing out."
