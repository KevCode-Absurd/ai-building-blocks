# Workflow skeleton from Mozart's Vienna letters, volume 2 (docs/INTAKE.md). Our words; the letters stay in mind-sources/ (local only).
id: mozart-letters-pleasing-experts-and-beginners
source:
  title: "The Letters of Wolfgang Amadeus Mozart (1769-1791), Volume II"
  by: "Wolfgang Amadeus Mozart, collected by Ludwig Nohl, translated by Lady Wallace"
  url: "https://archive.org/details/lettersofwolfgan02moza"
  kind: letter
  rights: public-domain
  year: 1866
minds: [wolfgang-amadeus-mozart]
workflow:
  slug: write-something-experts-admire-and-newcomers-enjoy
  name: "Write something experts admire and newcomers enjoy"
  summary: "Give it what you are making and who it is for. Get a trimmed draft that works for both experts and newcomers."
  when: "you are making a talk, article, product or piece and want it to satisfy people who know the field and people who do not."
  job: write-and-tell-stories
  level: intermediate
steps:
  - name: Name both audiences and what each needs
    skill: two-audience-brief-writer
    job: strategy
    task: write-and-tell-stories
    from: "Letter 213 (December 1782), the concertos between too easy and too difficult; letter 172 on writing for the Viennese"
    method: ["Describe the knowledgeable few and the casual many in your own field, by what each notices and enjoys", "Name the two failure ends: so simple it bores the expert, so dense that only the expert follows", "Write one line for what the newcomer must enjoy without help and one for what the expert must find on a closer look", "Check the brief asks for both at once, not a compromise that gives neither"]
    inputs: [brief, persona!]
    outputs: [brief]
    note: "A brief with two named audiences, the two ways to fail and one promise to each."
  - name: Fit it to the person who will deliver it
    skill: deliverer-fit-planner
    job: strategy
    task: write-and-tell-stories
    from: "Letter 172 (September 1781), writing the arias to suit the singers' voices; letter 174 on Osmin and Belmonte"
    method: ["List what the deliverer does well and what is hard for them", "Put the showpiece where they are strongest and keep the hard parts plain", "Match range, pace and vocabulary to their natural voice", "Mark any line they must not be given and offer a swap"]
    inputs: [brief]
    outputs: [plan]
    note: "What the deliverer shines at, what to give them and what to keep away from them."
  - name: Draft with a plain surface and a deeper layer
    skill: layered-draft-writer
    job: copy
    task: write-and-tell-stories
    from: "Letter 213, brilliant, pleasing to the ear and natural, with passages only connoisseurs fully taste; letter 172 on feeling that stays pleasing"
    method: ["Write the surface first: a main idea anyone can carry away after one pass", "Add a few deeper touches only an expert would notice, each placed so it never blocks the surface", "Keep strong feeling inside a shape the listener can still enjoy", "Mark which lines are surface and which are depth"]
    inputs: [brief, plan!]
    outputs: [copy_draft]
    note: "A draft where the surface works for anyone and the depth rewards a second look."
  - name: Cut what crowds it
    skill: overstuffed-draft-cutter
    job: copy
    task: write-and-tell-stories
    from: "Letter 213 and the remark on too much in a piece; the short and good rule from the earlier letters; letter 172 on a finale kept short so applause cannot cool"
    method: ["Count the ideas and name the one main idea", "Cut or move every idea that fights the main one, even a good one", "Shorten the ending so the best moment is the last thing heard", "Report what was cut and why"]
    inputs: [copy_draft, brief!]
    outputs: [copy_draft, feedback_notes]
    note: "A shorter draft with the cuts listed, so you can put one back if you disagree."
  - name: Plan a test with one expert and one newcomer
    skill: expert-and-newcomer-test-planner
    job: research
    task: write-and-tell-stories
    from: "Letters 213 and 233 on watching the real audience: the cries, the encores, who stayed to the end"
    method: ["Pick one expert and one newcomer, in the same setting", "Ask each the same few questions about what they remember, felt and wanted cut", "Watch what they do unprompted: where they lean in, drift or ask a question", "Set a pass line for each group in advance"]
    inputs: [copy_draft, brief!]
    outputs: [plan]
    note: "Who to try it on, what to ask each, and what counts as a pass."
  - pause: "Show the draft to one expert and one newcomer, and write down what each did and said."
  - name: Sort what each group said
    skill: reader-feedback-sorter
    job: analysis
    task: write-and-tell-stories
    from: "Letters 213 and 233, reading the room after the performance"
    method: ["Group notes by place in the draft", "Fix what both groups raise", "Treat expert-only and newcomer-only notes as a choice about which audience wins that spot", "Rank the rewrite list"]
    inputs: [feedback_notes, copy_draft!]
    outputs: [plan]
    note: "A ranked rewrite list that says which group each change serves."
