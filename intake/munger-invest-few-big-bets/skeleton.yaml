# Workflow skeleton from Poor Charlie's Almanack (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: munger-invest-few-big-bets
source:
  title: "Poor Charlie's Almanack"
  by: "Charles T. Munger, ed. Peter D. Kaufman"
  kind: book
  rights: ideas-only
minds: [charlie-munger, warren-buffett]
workflow:
  slug: pick-a-few-big-bets-and-sit-still
  name: "Pick a few big bets and sit still"
  summary: "List your bets. Get which have the odds in your favour, how big each should be and rules for holding."
  when: "you have several ideas for where to put money or effort and want to back only the few that deserve it."
  job: money-and-investing
  level: intermediate
steps:
  - name: "Mispriced bet tester"
    skill: mispriced-bet-tester
    job: analysis
    task: money-and-investing
    from: "Talk Two, the race track betting system and the market"
    method: ["Write what the crowd already believes and what that belief is priced at", "Write what you believe that differs, and the evidence only you have", "Remember a favourite is not a good bet if its price already shows it", "Work out the odds you would need and how sure you are", "Call it a near cinch, a fair bet or a no bet", "Say which edge you hold: knowledge, patience or temperament"]
    inputs: [question]
    outputs: [audit_report]
    note: "For each idea, whether the odds really favour you or the price already says it"
  - name: "Twenty-punch bet ranker"
    skill: lifetime-punch-card-bet-ranker
    job: strategy
    task: money-and-investing
    from: "Talk Two, the twenty-punch ticket and the few insights that made most of the money"
    method: ["Imagine you may make only twenty big choices in your whole life", "Rank every idea by how well you understand it and how big the edge is", "Compare each with your next best use of the money or time", "Give most of the weight to the top one to three and none to the rest", "Say what share of the pot each gets and what each one is NOT allowed to risk", "Write why anything that is not a top pick gets nothing"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "A short ranked list with sizes. Reads the odds test from the step before"
  - name: "Incentive checker"
    skill: incentive-checker
    job: analysis
    from: "Talk Two, the money manager and the fishing tackle seller"
    method: ["List who is selling you this bet and how each is paid", "Say what behaviour each reward encourages", "Find where that differs from what you want", "Treat a big commission and a thick prospectus as a warning", "Write what you would do if you were paid the way you want to be"]
    inputs: [plan!, question]
    outputs: [audit_report]
    note: "Who gains from steering you, and where it pulls the wrong way. Reads the sized plan"
  - name: "Room for error plan checker"
    skill: room-for-error-plan-checker
    job: analysis
    from: "Talk Two, being willing to be bumpy; survival before upside"
    method: ["Find the ruin point", "Test a bad year on the sized plan", "Check borrowed money that can be called in", "Check how much of the plan rests on one thing", "Fix the size until you can stay in through the bad year"]
    inputs: [plan]
    outputs: [audit_report]
    note: "Whether the concentrated plan survives a bad year. Reads the sized plan"
  - name: "Sit-still rule writer"
    skill: sit-still-rule-writer
    job: ops
    task: money-and-investing
    from: "Talk Two, doing little after a few great choices; taxes and costs"
    method: ["Write the facts that must stay true for each bet to stay a bet", "Choose the dates you will review them and ban checks in between", "List the costs of acting: fees, tax, and the noise you listen to", "Write the only reasons to sell: the facts broke, or a clearly better use appeared", "Write the one line to read when you feel the urge to act", "Write what you will do with spare cash while you wait"]
    inputs: [plan, audit_report!]
    outputs: [plan]
    note: "A one-page holding rule set. Reads the sized plan and the risk checks"
