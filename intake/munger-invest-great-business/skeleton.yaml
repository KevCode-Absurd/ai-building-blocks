# Workflow skeleton from Poor Charlie's Almanack (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: munger-invest-great-business
source:
  title: "Poor Charlie's Almanack"
  by: "Charles T. Munger, ed. Peter D. Kaufman"
  kind: book
  rights: ideas-only
minds: [charlie-munger, warren-buffett]
workflow:
  slug: judge-if-a-business-is-great-enough-to-hold
  name: "Judge if a business is great enough to hold"
  summary: "Describe a business. Get its edge tested, who keeps the gain, and a keep, wait or pass call."
  when: "you are studying a business to own for years and want to know if it is truly a great one before you look at the price."
  job: money-and-investing
  level: intermediate
steps:
  - name: "Business power tester"
    skill: business-power-tester
    job: strategy
    from: "Talk Two, advantages of scale, brands and franchises"
    method: ["Name what customers get that rivals cannot match", "Name the barrier that stops rivals from copying it", "List the kinds of scale advantage in play: cost, buying, advertising reach, information, social proof, winner-take-all", "Say how big the prize is and how long it should last", "Check the opposite pull: bureaucracy and slow decisions as it grows"]
    inputs: [question, competitor_set!]
    outputs: [audit_report]
    note: "The edge and the wall around it"
  - name: "Circle of competence sorter"
    skill: circle-of-competence-sorter
    job: analysis
    task: money-and-investing
    from: "Talk Two, worldly wisdom and investment management; Berkshire and Wesco meeting remarks"
    method: ["Write the business in one plain sentence", "Test whether you can explain how it makes money and what could hurt it, to a stranger, without notes", "Name the edge you have over other buyers here, such as years of work in the field", "Sort it into one of three baskets: yes, no, too tough", "Mark the edge of your knowledge by writing the next question you could not answer", "List what it would take to widen the circle, and if it is not worth the work, pass"]
    inputs: [audit_report!, question]
    outputs: [audit_report]
    note: "A sort of the business into yes, no or too tough, with your real edge written down. Reads the edge test from the step before"
  - name: "Who-keeps-the-gain tester"
    skill: who-keeps-the-gain-tester
    job: analysis
    task: money-and-investing
    from: "Talk Two, microeconomics, competition and the textile loom"
    method: ["List the changes that could help the whole industry, such as a better machine or a lower cost", "For each, ask what stays with the owners and what flows through to customers", "Check whether rivals behave calmly or fight for share until profits vanish", "Sort the industry as brand-led, commodity or protected by a franchise", "Say which way technology cuts for this business: helps you or kills you", "Write the one-line verdict on whether gains stick"]
    inputs: [audit_report!, question]
    outputs: [audit_report]
    note: "Whether improvements stay with the owners or pass to buyers, and whether rivals fight each other. Reads the edge test from the step before"
  - name: "Owner-minded management checker"
    skill: owner-minded-management-checker
    job: analysis
    task: money-and-investing
    from: "Berkshire and Wesco meeting remarks; the editor's notes on how he judges managers"
    method: ["Look at what managers did with spare cash over the last years", "Check pay against results and against what owners got", "Look for growth for its own sake and for ego deals", "Read how they talk about their mistakes", "Judge ability, honesty and owner-mindedness, each as high, mixed, low or MISSING", "Remember that a good business beats a good manager in a poor business, so weigh management second"]
    inputs: [audit_report, question!]
    outputs: [audit_report]
    note: "Whether those running it are able, honest and act like owners. Reads the earlier findings"
  - name: "Long-hold return calculator"
    skill: long-hold-return-calculator
    job: analysis
    task: money-and-investing
    from: "Talk Two, how the return of a stock follows the return of the business; taxes and holding"
    method: ["Write the return the business earns on the money put into it, from its record", "Show that over many years the owner's return cannot beat that by much, whatever the entry price", "Run the sum for the business at a poor return and a high return, with an expensive and a cheap entry price", "Run the after-tax sum for selling often against holding and paying once", "Compare with your next best choice, since only alternatives set the bar", "Call it keep, wait for a better price, or pass, with the reason and MISSING figures listed"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "The long sums and the final keep, wait or pass call. Reads all the findings so far"
