# Workflow skeleton for explaining a surprising result in Poor Charlie's Almanack (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: munger-models-explain-a-surprise
source:
  title: "Poor Charlie's Almanack: The Wit and Wisdom of Charles T. Munger"
  by: "Charlie Munger"
  kind: book
  rights: ideas-only
minds: [charlie-munger]
workflow:
  slug: work-out-why-something-worked-or-failed
  name: "Work out why something worked or failed"
  summary: "Describe a surprising result. Get ranked causes, a check through many fields and rewards, and what to copy or skip."
  when: "something did far better or worse than expected and you want the real cause before you copy or avoid it."
  job: think-and-decide
  level: intermediate
steps:
  - name: "Rank the likely causes"
    skill: surprise-cause-ranker
    job: analysis
    from: "Talk Nine, solving problems forward and backward"
    method: ["Rule out causes the facts cannot support", "Test four patterns: one or two things pushed far, many factors adding up, excellence on many fronts, a big wave", "List four to six causes with what else must be true", "Rank them and pick the cheapest test that separates the top two"]
    inputs: [question]
    outputs: [plan]
    note: "Ranked causes, a cheap test for each and what stays unexplained"
  - name: "Check the causes through many fields"
    skill: mental-model-checklist-runner
    job: analysis
    from: "Talks Two, Three and Nine"
    method: ["Run the case through maths, engineering, biology, psychology and economics in turn", "Write what each says, even if it is nothing", "Look for forces that stack and forces that clash"]
    inputs: [plan, question!]
    outputs: [audit_report]
    note: "An answer from each field about the ranked causes. Reads the plan from the step before"
  - name: "Check who was rewarded for what"
    skill: incentive-checker
    job: analysis
    from: "Talk Two; Talk Nine"
    method: ["List how each person involved was paid", "Say what behaviour that reward encouraged", "Find where it explains the result", "Note the fix if the result was bad"]
    inputs: [plan!, question]
    outputs: [audit_report]
    note: "Whether pay or rewards explain the result. Reads the plan from step one"
  - name: "Decide what to copy and what to skip"
    skill: copy-or-skip-lesson-writer
    job: strategy
    from: "Talk Four, on copying what works; Talk Nine"
    method: ["Compare the conditions of the success with your own", "Find the hidden systems behind each visible feature", "Sort each cause as copy, adapt, skip or luck", "Write the smallest test for each idea kept"]
    inputs: [audit_report, plan!]
    outputs: [plan]
    note: "What carries over to your case, what was luck, and small tests. Reads the checks from the steps before"
