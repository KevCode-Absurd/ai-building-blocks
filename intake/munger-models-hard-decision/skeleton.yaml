# Workflow skeleton for the thinking tools in Poor Charlie's Almanack (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: munger-models-hard-decision
source:
  title: "Poor Charlie's Almanack: The Wit and Wisdom of Charles T. Munger"
  by: "Charlie Munger"
  kind: book
  rights: ideas-only
minds: [charlie-munger]
workflow:
  slug: think-a-hard-decision-through-with-many-models
  name: "Think a hard decision through with models from many fields"
  summary: "Describe a hard decision. Get the obvious questions settled, many fields checked, pressures and rewards tested, and the case against it."
  when: "you face a decision that is hard, costly or close, and want it checked from many sides before you act."
  job: think-and-decide
  level: intermediate
steps:
  - name: "Settle the obvious questions first"
    skill: no-brainer-question-settler
    job: strategy
    from: "Talk Four, Practical Thought About Practical Thought"
    method: ["List the big questions the problem rests on and settle the ones with an obvious answer first", "Work the target backward with plain arithmetic to see what it needs", "Cross off any path the sums rule out", "Restate what is left as a smaller question"]
    inputs: [question]
    outputs: [question, plan]
    note: "The settled questions, a sum for your target and a smaller question to work on"
  - name: "Run it through models from many fields"
    skill: mental-model-checklist-runner
    job: analysis
    from: "Talks Two, Three and Nine; Chapter 2"
    method: ["Carry the main ideas of maths, accounting, engineering, physics, biology, psychology and economics", "Go through them as a checklist so none is skipped because it did not come to mind", "Write what each says about this case, even if it is nothing", "Look for forces that point the same way, since they can give extreme results", "Look for forces that conflict and state the trade-off"]
    inputs: [plan, question!]
    outputs: [audit_report]
    note: "An answer from each field, where they agree and clash, and the facts still missing. Reads the plan from the step before"
  - name: "Find the pressures bending your judgment"
    skill: decision-bias-pileup-checker
    job: analysis
    from: "Talk Eleven, The Psychology of Human Misjudgment"
    method: ["Write the decision and the clear, rational reasons for it first", "Run a second pass for quiet pulls such as rewards, past promises, the crowd and fear of loss", "Count how many push the same way", "Name the strongest and cool them down"]
    inputs: [question]
    outputs: [plan]
    note: "The pressures at work and a calmer version of the choice. Reads the sharper question from step one"
  - name: "Check who is rewarded for what"
    skill: incentive-checker
    job: analysis
    from: "Talk Two, A Lesson on Elementary Worldly Wisdom"
    method: ["List the people involved and how each is paid or rewarded", "Say what behaviour each reward encourages", "Find where it differs from what you want", "Change the reward so it pays for the result you want"]
    inputs: [plan!, question]
    outputs: [audit_report]
    note: "Who is rewarded for what, where it pulls the wrong way, and a fix. Reads the plan from the step before"
  - name: "Follow the consequences of the consequences"
    skill: second-order-effects-tracer
    job: analysis
    from: "Talk Nine, Academic Economics"
    method: ["Write the first effects of the change", "Ask who will react and what each is rewarded for", "Follow the reactions two more steps", "Ask how much of any gain you keep and how much flows to buyers or rivals", "Ask how people could game the new rule"]
    inputs: [plan]
    outputs: [plan]
    note: "The effects of the effects, who keeps the gain, and a plan that allows for the reactions"
  - name: "Turn it upside down"
    skill: failure-first-plan-check
    job: strategy
    task: plan-strategy
    from: "Talk One, Harvard School commencement; Talk Ten"
    method: ["State the goal in one line", "Ask what would guarantee failure and avoid that", "List the standard ways of failing in this field", "Check the plan against each", "Mark anything that could end the project"]
    inputs: [plan]
    outputs: [plan]
    note: "The ways it could fail, survival risks first, and the changes that avoid them"
  - name: "Argue the other side before you decide"
    skill: case-against-writer
    job: analysis
    from: "Talk Ten, USC Gould School of Law; Talk One"
    method: ["Pick the smartest person who disagrees and has something at stake", "Write their three best arguments better than they would", "Answer each with facts, or admit it is open", "Write what would change your mind", "Make the call: go, change or wait"]
    inputs: [plan]
    outputs: [plan]
    note: "The best case against the plan, what is still open, and a go, change or wait call"
