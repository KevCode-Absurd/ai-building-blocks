# Workflow skeleton for My Life and Work (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: my-life-and-work
source:
  title: "My Life and Work"
  by: "Henry Ford"
  kind: book
  rights: public-domain
  year: 1922
minds: [henry-ford]
workflow:
  slug: work-back-from-a-low-price-to-cheaper-production
  name: "Work back from a low price to cheaper production"
  summary: "Name the price you want to sell at. Get a cost-cutting plan, a better work layout and the waste worth chasing."
  when: "you want to sell at a lower price and need to cut the cost of making it."
  job: plan-strategy
  level: intermediate
steps:
  - name: "Price-first cost planner"
    skill: price-first-cost-squeeze-planner
    job: offer
    task: make-offer
    from: "My Life and Work, 1922"
    method: ["Say who you want to sell to and the price they can pay", "Set the price first, below where costs sit now", "List every cost line, step and part behind the product", "Ask of each: is it needed for the customer to get the service", "Remove or simplify before you try to speed up", "Find a place where competition is thin and people now travel far to buy", "Name the many people you serve and what they can pay", "Compare your prices with the far-off store they use now"]
    inputs: [product_data, question!, competitor_set!]
    outputs: [plan]
    note: "A plan that works backward from it to cut cost"
  - name: "Work flow layout planner"
    skill: work-flow-layout-planner
    job: ops
    task: build-product
    from: "My Life and Work, 1922, chapter on getting into production"
    method: ["List the steps of the job in order and count the moves each person makes", "Place tools and people in the order of the work so each part travels the shortest distance", "Give each person a set place to drop the part, using gravity or a carrier to hand it on", "Bring parts to the worker on a sliding line at a convenient height", "Split work into small steps so each person makes one movement", "Write the job as a list of small steps in order", "Time each step and note switching between them", "Group steps by skill so each person does a few"]
    inputs: [plan, question]
    outputs: [plan]
    note: "A layout where the work moves to the person, with fewer steps and less walking. Reads the plan from the step before"
  - name: "Waste and by-product finder"
    skill: waste-and-by-product-finder
    job: ops
    from: "Today and Tomorrow, 1926, chapter Learning from Waste"
    method: ["Walk the whole process and list everything thrown away or left idle", "Measure each in units, hours or money per month", "Ask who would buy it or what it could feed", "Ask what a rival wastes that you could buy cheaply", "Rank by money recovered against effort", "List all materials, scrap and offcuts per job", "Value each by the labour that went into it, not only its price", "Note what is reclaimed and what it costs to reclaim"]
    inputs: [audit_report!, plan!, question, performance_sheet!]
    outputs: [audit_report, plan]
    note: "Each item priced as a possible product, reuse or saving. Reads the plan from the step before"
