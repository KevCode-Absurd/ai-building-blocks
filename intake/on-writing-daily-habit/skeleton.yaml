# Workflow skeleton from On Writing: A Memoir of the Craft (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: on-writing-daily-habit
source:
  title: "On Writing: A Memoir of the Craft"
  by: "Stephen King"
  kind: book
  rights: ideas-only
  year: 2000
minds: [stephen-king, jerry-seinfeld]
workflow:
  slug: make-a-daily-writing-habit-that-lasts
  name: "Make a daily writing habit that lasts"
  summary: "Tell it your hours. Get a daily word count, a reading plan, a restart rule and a weekly check on your log."
  when: "you want to write a little every day and keep going past the first few weeks."
  job: write-and-tell-stories
  level: beginner
steps:
  - name: Plan the start and the restart
    skill: habit-plan-builder
    job: ops
    from: "The 'On Writing' section: do not wait for the muse; show up at the same hour so the work knows where you will be"
    method: ["Shrink the first step to something you can do on the worst day", "Tie it to a fixed cue, the same time and place", "Remove one thing that gets in the way", "Plan the restart after a missed day", "Name the reward"]
    inputs: [question, feedback_notes!]
    outputs: [plan]
    note: "A small first step, a fixed cue and a restart rule for the days it goes wrong."
  - name: Set the daily word quota
    skill: daily-word-quota-planner
    job: ops
    from: "The 'On Writing' section: set a goal low at first, shut the door, stop when the count is met"
    method: ["Pick the length of the finished piece and the days you can write", "Divide it into a daily word count you can hit on a bad day", "Work out the finish date and one rest day a week", "Set the room, the closed door and the start time", "Write the rule for what happens on a missed day"]
    inputs: [question, brief!, plan!]
    outputs: [plan]
    note: "Sizes the word count around the small first step and the restart rule."
  - name: Build a reading plan
    skill: writers-reading-plan-builder
    job: ops
    from: "The 'On Writing' section: read a lot, in small sips and long swallows, and cut the screens that eat the time"
    method: ["Count the free pockets of time in a normal week", "Pick a books-per-year target and work out pages per day", "Put a book in each pocket, with an audio book for driving or exercise", "Choose a mix of great, merely fine and bad books and say what each teaches", "Pick what to cut to make room"]
    inputs: [question, plan!]
    outputs: [plan]
    note: "A weekly reading schedule that sits beside the writing slot."
  - pause: "Write at the same time every day for two weeks and keep a log of the date, the start time and the words."
  - name: Review the log
    skill: writing-log-reviewer
    job: analysis
    from: "The 'On Writing' section: count the words, protect the schedule, treat gaps as a signal"
    method: ["Add up days hit, words and average per writing day", "Project the finish date at that pace", "Find the pattern in missed days", "Pick the one change to make", "Say whether to keep the quota, lower it or raise it"]
    inputs: [plan, performance_sheet]
    outputs: [audit_report, plan]
    note: "Where you are against the plan and one change for next week."
