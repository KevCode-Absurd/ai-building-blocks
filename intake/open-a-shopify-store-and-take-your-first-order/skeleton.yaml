# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Our words.
id: open-a-shopify-store-and-take-your-first-order
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: open-a-shopify-store-and-take-your-first-order
  name: "Open a Shopify store and take your first order"
  summary: "Give it your country, team and products. Get your store plan, product setup, menus, shipping, tax and a go-live score."
  when: "you are building a new Shopify store and want it to take a real order without launch-day mistakes."
  job: set-up-store
  level: beginner
steps:
  - name: "Shopify store setup planner"
    skill: shopify-store-setup-planner
    job: ops
    from: "skill: shopify-store-setup-planner"
    method: ["Prepare logo, colours and one photo shape", "Pick the plan and own the account", "Choose payments by country", "Test the name and buy the domain", "Set the build order"]
    inputs: [question, product_data!]
    outputs: [plan]
    note: "Starts the flow. Gives the build order that the steps after it follow."
  - pause: "Open the admin and do the base settings from the plan: business details, plan, domain and payments."
  - name: "Product and variant setup planner"
    skill: product-and-variant-setup-planner
    job: ops
    from: "skill: product-and-variant-setup-planner"
    method: ["Pick simple or variable for each product", "Build shared options first", "Fill each variant row: SKU, price, stock, weight, photo", "Set price, stock and shipping fields", "List what is still missing"]
    inputs: [product_data, product_photos!]
    outputs: [product_data]
    note: "Turns the products you list into set-up sheets that the rest of the store uses."
  - name: "Collections and menu planner"
    skill: collections-and-menu-planner
    job: page
    from: "skill: collections-and-menu-planner"
    method: ["Fix product type names and tags", "Choose manual or smart collections", "Pick filters shoppers use", "Build the menu so any product is two or three clicks away", "Set up search"]
    inputs: [product_data, competitor_set!]
    outputs: [plan]
    note: "Groups the finished products into collections, filters and a menu."
  - name: "Shipping rate planner"
    skill: shipping-rate-planner
    job: ops
    from: "skill: shipping-rate-planner"
    method: ["Start with the places you can serve well", "Choose one rate model", "Build zones and a saved package", "Set the free-shipping line", "Check the price charged against the real carrier cost"]
    inputs: [question, product_data!, performance_sheet!]
    outputs: [plan]
    note: "Uses product weights and sizes from the setup sheets to set zones, rates and a free-shipping line."
  - name: "Store tax setup planner"
    skill: store-tax-setup-planner
    job: ops
    from: "skill: store-tax-setup-planner"
    method: ["Turn taxes on and choose how prices are entered", "Set the tax base and the classes", "Write the rate rows", "Handle shipping tax", "Test with carts from different places"]
    inputs: [question, product_data!]
    outputs: [plan]
    note: "Sets the tax status and class for each product from the setup sheets, then gives test carts."
  - name: "Store go-live checker"
    skill: store-go-live-checker
    job: ops
    from: "skill: store-go-live-checker"
    method: ["Sweep settings, products and policies", "Run test orders through payment and fulfilment", "Repeat the buying path on a phone", "Check the domain and tracking", "Remove the password last"]
    inputs: [question, product_data!, store_capture!]
    outputs: [audit_report]
    note: "Checks the finished store against the earlier plans and ends with a score, blockers and a test-order plan."
