id: paid-app-starter
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: build-a-paid-app-with-billing-emails-alerts-and-tests
  name: "Build a paid app with billing, emails, alerts and tests"
  summary: "Give it your app idea. Get a working starter with sign-in, billing, emails, alerts and tests."
  when: "you want a subscription app started on a sound base instead of from a blank folder."
  job: build-software
  level: advanced
steps:
  - name: "Scaffold the app"
    skill: saas-starter-builder
    job: ops
    from: "skill: saas-starter-builder"
    method: ["Collect the product, sign-in, database and payment choices", "Lay out pages, API routes and the database", "Write sign-in, billing and dashboard code", "Add an example environment file"]
    inputs: [brief]
    outputs: [codebase]
    note: "Starts the project with sign-in, a database and a dashboard."
  - name: "Add subscriptions and webhooks"
    skill: stripe-payments-builder
    job: ops
    from: "skill: stripe-payments-builder"
    method: ["Map the plans, trials and what happens when a payment fails", "Add checkout and the customer portal", "Add webhook handlers that verify signatures and ignore repeats", "Set up local testing with the Stripe command line"]
    inputs: [codebase, brief]
    outputs: [code_change]
    note: "Builds billing on the project from the step before."
  - name: "Add the emails the app sends"
    skill: transactional-email-builder
    job: ops
    from: "skill: transactional-email-builder"
    method: ["List the emails the app sends", "Build the templates and a sending function", "Preview them locally", "Check spam and dark mode"]
    inputs: [codebase]
    outputs: [code_change]
    note: "Adds welcome, receipt and password emails to the same project."
  - name: "Add logs and alerts"
    skill: logging-and-alerts-setter
    job: ops
    from: "skill: logging-and-alerts-setter"
    method: ["Write the questions on-call will ask", "Pick a log, metric or trace for each", "Log events with stable names and fields", "Add alerts for what needs action"]
    inputs: [codebase]
    outputs: [code_change]
    note: "Makes the payment and email paths visible once they are in place."
  - name: "Write the tests"
    skill: test-suite-writer
    job: ops
    from: "skill: test-suite-writer"
    method: ["Read the code and list what is testable", "List cases for each part, riskiest first", "Write and run the tests", "Report coverage and what is still missing"]
    inputs: [codebase]
    outputs: [test_report]
    note: "Tests the finished app, billing and emails included."
