# Workflow skeleton for Paul Rand and Michael Bierut on logo design (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: paul-rand-and-bierut-logo-design
source:
  title: "Paul Rand and Michael Bierut on logo design"
  by: "Paul Rand and Michael Bierut"
  kind: other
  rights: ideas-only
minds: [paul-rand, michael-bierut, massimo-vignelli]
workflow:
  slug: design-a-brand-mark-and-test-that-it-holds-up
  name: "Design a brand mark and test that it holds up"
  summary: "Describe the design job. Get a tight brief, a mark plan and a strength test for your finished ideas."
  when: "you need a logo or mark and want a clear brief and a fair way to judge the options."
  job: design-work
  level: intermediate
steps:
  - name: "Design brief rules writer"
    skill: design-brief-rules-writer
    job: brand
    from: "Design and the Play Instinct, 1965"
    method: ["Pull out the core facts: what, why, when and where", "Pick the one idea the work must carry", "Set three to five limits: a size, a grid, two colours, one typeface, a time", "Name what is left free on purpose", "Add a collecting step: gather ten images or objects that catch the eye", "Name the audience, the client and what the audience should do or see differently", "State the need the design must meet", "Find one idea that can be got in a glance"]
    inputs: [question, brand_brain!]
    outputs: [brief]
    note: "A brief with tight limits that give room to play, instead of a blank page"
  - name: "Brand mark system planner"
    skill: brand-mark-system-planner
    job: brand
    from: "I'm With Her"
    method: ["Read the brief for the answer already in it", "List the obvious solutions and keep the ones that work", "Keep what people already know and add one surprising move", "Test the mark at the smallest and largest uses", "Plan it as a frame others can fill, simple enough to draw by hand", "Hold a listening call or shop visit and ask about goals and problems", "Write a short soft strategy: what the mark must do and who it fits", "Sketch on paper and list ideas before opening software"]
    inputs: [brief, brand_brain!, reference_set!]
    outputs: [design_direction, plan]
    note: "A mark plan that starts from the brief, tests small and works as a system. Reads the brief from the step before"
  - pause: "Sketch the mark ideas and make a few finished options."
  - name: "Logo strength tester"
    skill: logo-strength-tester
    job: brand
    from: "Logos, Flags, and Escutcheons, 1991"
    method: ["Say what the mark has to identify, not what it has to explain", "Test each idea for distinct, visible, usable, memorable, universal, durable and timeless", "Check it in one colour and at a very small size", "Ask if it only works because it pictures what the business sells", "Set first reactions aside and judge what it could mean after years of use", "Write down who wants the change and why", "Separate a real fault (ugly, out of date, wrong) from a wish for change for its own sake", "Find how long the mark has been in public use and how well known it is"]
    inputs: [design_direction, brand_brain!, brief!]
    outputs: [audit_report]
    note: "Each one scored on seven tests, with a keep, fix or drop call"
