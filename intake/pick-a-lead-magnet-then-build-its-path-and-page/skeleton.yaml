id: pick-a-lead-magnet-then-build-its-path-and-page
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: pick-a-lead-magnet-then-build-its-path-and-page
  name: "Pick a lead magnet, then build its path and page"
  summary: "Give it your buyer. Get a lead magnet, the path from it to a sale, a signup page and a review."
  when: "you want email signups and have no free offer, path or page for them yet."
  job: write-landing-page
  level: intermediate
steps:
  - name: "Pick the lead magnet"
    skill: lead-magnet-planner
    job: ops
    from: "skill: lead-magnet-planner"
    method: ["Pick a specific problem the buyer has now", "List magnet types that match the buyer's stage", "Choose the best one and what to ask for in return", "Outline the page and emails that go with it"]
    inputs: [persona]
    outputs: [offer, plan]
    note: "Starts from your buyer and returns one free offer with a plan for its page and emails."
  - name: "Map the path to a sale"
    skill: funnel-flow-planner
    job: ops
    from: "skill: funnel-flow-planner"
    method: ["Match each audience and stage to an entry point", "Lay out page, magnet, emails and offer in order", "Plan what each email does", "Choose the numbers that show where people drop"]
    inputs: [persona!, offer]
    outputs: [plan]
    note: "Reads the magnet from the step before and lays out the path from signup to sale."
  - name: "Write the signup page"
    skill: ad-matched-landing-page-writer
    job: page
    from: "skill: ad-matched-landing-page-writer"
    method: ["Pin one buyer, one reason and one offer", "Build the first screen from the post, ad or link people click", "Answer each doubt under its own heading", "State what the signup costs and asks before the button"]
    inputs: [brand_brain, offer, ad_copy!, voc_reviews!, persona!]
    outputs: [landing_page]
    note: "Writes the page for the magnet from the step before, using your post, ad or link as the first screen."
  - name: "Review the page before it goes live"
    skill: landing-page-auditor
    job: page
    from: "skill: landing-page-auditor"
    method: ["Name the one job of the page", "Read it as a glance, a skim and a doubt check", "Check the phone basics", "Rank each finding by how much it hurts and how easy it is to fix"]
    inputs: [landing_page, brand_brain!]
    outputs: [audit_report]
    note: "Reads the signup page and ranks what to fix first."
