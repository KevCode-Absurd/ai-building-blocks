# Workflow skeleton: chains library skills (docs/INTAKE.md). Our words.
id: pick-a-sale-offer-check-profit-set-an-honest-deadline
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
minds: []
workflow:
  slug: pick-a-sale-offer-check-profit-set-an-honest-deadline
  name: "Pick a sale offer, check profit, set an honest deadline"
  summary: "Give it your margins. Get a sale offer with a true reason, the ad return it needs and a real deadline."
  when: "you plan a sale and want the offer type, the reason and the deadline settled before you spend on it."
  job: make-offer
  level: intermediate
steps:
  - name: "Store offer picker"
    skill: store-offer-picker
    job: offer
    from: "skill: store-offer-picker"
    method: ["Name what each offer type trades away", "Check margin floor, order spread and hero product", "Match offer types to the store and its repeat rate", "Rank by ease and show the sums"]
    inputs: [product_data, performance_sheet!, voc_reviews!]
    outputs: [shortlist, plan]
    note: "Starts the chain: the offer types worth testing, ranked, with the maths."
  - name: "Reason-why deal writer"
    skill: reason-why-deal-writer
    job: copy
    from: "skill: reason-why-deal-writer"
    method: ["State the deal in one sentence with the real numbers", "List the doubts a stranger would have", "Pick a reason you can prove and honour", "Write three versions and the claim steps"]
    inputs: [shortlist, product_data, persona!, brand_brain!]
    outputs: [offer, copy_draft]
    note: "Takes the top offer type from the step before and writes the deal with a reason a buyer will believe."
  - name: "Discount impact checker"
    skill: discount-impact-checker
    job: offer
    from: "skill: discount-impact-checker"
    method: ["Build the full-price margin sheet", "Model the deal on retail value", "Work out the ad return needed to hold profit", "Decide if the jump is believable and score it"]
    inputs: [product_data, performance_sheet!, offer!]
    outputs: [audit_report]
    note: "Runs the deal from the step before through your costs to find the return you must hit."
  - name: "Honest urgency planner"
    skill: honest-urgency-planner
    job: strategy
    from: "skill: honest-urgency-planner"
    method: ["Find real capacity", "Pick the limit and the date type", "Set the cap a little under demand", "Write true lines for page, ad, email and calls"]
    inputs: [offer, performance_sheet!]
    outputs: [plan]
    note: "Takes the checked deal and sets a limit and date you can keep."
