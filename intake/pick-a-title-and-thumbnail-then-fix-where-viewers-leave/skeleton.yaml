# Workflow skeleton built from existing library skills (docs/INTAKE.md). Our words.
id: pick-a-title-and-thumbnail-then-fix-where-viewers-leave
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: pick-a-title-and-thumbnail-then-fix-where-viewers-leave
  name: "Pick a title and thumbnail, then fix where viewers leave"
  summary: "Give it your video idea. Get the best title and thumbnail pairs, then the one change that holds viewers longer."
  when: "you have a video idea and want it clicked, then want to know where people stop watching."
  job: grow-social
  level: intermediate
steps:
  - name: "Thumbnail and title planner"
    skill: thumbnail-and-title-planner
    job: strategy
    from: "skill: thumbnail-and-title-planner"
    method: ["Write the one promise the video makes", "Build a base title and thumbnail pair", "Make at least twelve pairs that each change one thing", "Check each thumbnail reads at phone size", "Write the first minute so it pays off the promise"]
    inputs: [question, performance_sheet!, lessons_register!]
    outputs: [hooks, plan]
    note: "Starts from your video idea and channel and makes the pairs to choose from."
  - name: "Headline cover test ranker"
    skill: headline-cover-test-ranker
    job: copy
    from: "skill: headline-cover-test-ranker"
    method: ["Read each title alone, with the video hidden", "Score it on five rules for a reader", "Cut the dead, too clever and meaningless ones", "Keep three that differ from each other and say how to test them"]
    inputs: [hooks, persona!]
    outputs: [shortlist, audit_report]
    note: "Reads the titles from the step before and cuts them to three that are different enough to test."
  - pause: "Publish the top pair. After a week or more, export the audience retention report from YouTube Studio for that video. You publish and export."
  - name: "YouTube transcript and channel reader"
    skill: youtube-transcript-reader
    job: ops
    from: "skill: youtube-transcript-reader"
    method: ["Take the link to the published video", "Fetch the transcript with times", "Return it as text the next step can read"]
    inputs: [question]
    outputs: [transcript]
    note: "Fresh start after publishing: gets the words of the live video so the drop-off points can be matched to what you said. You can paste the captions instead."
  - name: "YouTube retention reader"
    skill: youtube-retention-reader
    job: ops
    from: "skill: youtube-retention-reader"
    method: ["Find how much is lost in the first 30 seconds", "Find single steep drops and what was said at each", "Find the slow bleed through the middle", "Name the one biggest leak and one change for it"]
    inputs: [performance_sheet, transcript!]
    outputs: [audit_report]
    note: "Reads the transcript from the step before, so each drop shows what you were saying then."
