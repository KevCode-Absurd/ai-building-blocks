id: plan-a-branded-unboxing-that-customers-film-and-reorder-for
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: plan-a-branded-unboxing-that-customers-film-and-reorder-for
  name: Plan a branded unboxing that customers film and reorder for
  summary: Give it your store link and order data. Get a customer ritual, an unboxing plan and the inserts that carry it.
  when: your product looks like your rivals' and you want a pack opening that customers repeat, share and come back for.
  job: brand-file
  level: intermediate
steps:
  - name: Website brand brain builder
    skill: website-brand-brain-builder
    job: brand
    from: library
    method:
      - Read the site
      - Tag every fact
      - One check-in
      - Map the market
      - Cross-check
      - Write the diagnosis
      - Check the result before you hand it on
    inputs:
      - web_page
      - voc_reviews!
      - performance_sheet!
      - product_data!
    outputs:
      - brand_brain
    note: Reads your store and reviews into a brand file the later steps work from.
  - name: Brand ritual designer
    skill: brand-ritual-designer
    job: brand
    from: library
    method:
      - Look for one small physical act that can sit around the product
      - Turn a flaw into a ritual
      - Consider seasonal or limited-run rituals
      - Consider collecting
      - Pick three ritual ideas and describe each
      - Plan the launch of one ritual
      - Plan a 90-day run and measure it
    inputs:
      - product_data
      - brand_brain!
      - voc_reviews!
    outputs:
      - plan
    note: Designs one customer ritual around the product. Reads the brand file from the step before.
  - name: Sensory unboxing planner
    skill: sensory-unboxing-planner
    job: brand
    from: library
    method:
      - Write the brand feeling in three words
      - Colour
      - Sound
      - Shape and feel
      - Design the first 30 seconds of the unboxing
      - Add the cost line
      - Set honest expectations
    inputs:
      - product_data
      - brand_brain!
    outputs:
      - plan
    note: Matches weight, colour, sound and smell to the ritual. Reads the brand file from the first step.
  - name: Unboxing insert and gift planner
    skill: unboxing-insert-and-gift-planner
    job: ops
    from: library
    method:
      - Fix effort before delight
      - Use cost bands, and ask for real quotes
      - Do the volume math
      - Set the note rule
      - Set the gift rule
      - Check the payback
      - Set what to measure
    inputs:
      - performance_sheet
      - brand_brain!
    outputs:
      - plan
    note: Chooses the inserts and gifts that carry the plan, within your margin. Reads the brand file from the first step.
