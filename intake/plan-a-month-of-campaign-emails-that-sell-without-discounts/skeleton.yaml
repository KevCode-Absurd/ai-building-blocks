# Workflow skeleton chaining skills already in the AI Blocks library (docs/INTAKE.md).
id: plan-a-month-of-campaign-emails-that-sell-without-discounts
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: plan-a-month-of-campaign-emails-that-sell-without-discounts
  name: "Plan a month of campaign emails that sell without discounts"
  summary: "Give it your products and brand file. Get a topic bank, a month calendar, written emails and a layout brief for each."
  when: "you send campaigns and want ideas that sell without a code in every email."
  job: write-emails
  level: intermediate
steps:
  - name: "Email topic bank builder"
    skill: email-topic-bank-builder
    job: email
    from: "library"
    method: ["Set the rule", "Compile first", "Record how people joined the list", "Write 10 broad topics", "Write 10 narrow ideas under each topic", "Tag one format on every idea"]
    inputs: [product_data, voc_reviews!, brand_brain!]
    outputs: [plan]
    note: "Builds the bank of reasons to email that are not a discount."
  - name: "Email campaign calendar planner"
    skill: email-campaign-calendar-planner
    job: email
    from: "library"
    method: ["Pick the pace", "Lock fixed dates", "Add supporting sends", "Add holidays or awareness days", "Map existing content", "Fill gaps"]
    inputs: [brand_brain, offer!, plan!]
    outputs: [plan]
    note: "Places the best topics from the bank on a month calendar."
  - pause: "Pick the first slot on the calendar and write its one-paragraph brief: the idea, the audience and the product."
  - name: "Campaign email writer"
    skill: campaign-email-writer
    job: email
    from: "library"
    method: ["Set one core message", "Write for the buyer", "Order the blocks", "Write subject and preview", "Choose by campaign type", "Use persuasion honestly"]
    inputs: [brief, brand_brain!, voc_reviews!]
    outputs: [copy_draft]
    note: "Writes the full email from the brief for that slot."
  - name: "Email draft reviewer"
    skill: email-draft-reviewer
    job: email
    from: "library"
    method: ["Lead", "Length", "Subject line", "Cut filler", "Pacing", "Reading level"]
    inputs: [copy_draft, brand_brain!]
    outputs: [audit_report]
    note: "Reviews the draft against the brand voice before anyone designs it."
  - name: "Email layout brief writer"
    skill: email-layout-brief-writer
    job: email
    from: "library"
    method: ["Set one message", "Write the top block", "Write the bridge", "Place the buttons", "Choose the product grid", "Keep it short"]
    inputs: [copy_draft, brand_brain!, image!]
    outputs: [page_layout_spec]
    note: "Turns the reviewed draft into a layout brief for the designer."
