# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md). Our words.
id: plan-a-month-of-meta-ads-with-the-right-number-of-new-ads-and-budget
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: plan-a-month-of-meta-ads-with-the-right-number-of-new-ads-and-budget
  name: "Plan a month of Meta ads with the right number of new ads and budget"
  summary: "Give it your spend, results, reviews and product facts. Get a monthly ad quota, a budget split and test-ready briefs."
  when: "you want to know how many new ads to make this month, what to say in them and where the money goes."
  job: plan-ad-tests
  level: intermediate
steps:
  - name: "Creative volume planner"
    skill: creative-volume-planner
    job: ads
    from: "library"
    method: ["Work out how many new ads your spend needs each month","Show a low and a high range, then pick a start","Split the quota by format and by week","Check the plan is not lopsided toward one concept"]
    inputs: [performance_sheet, question]
    outputs: [plan]
    note: "Starts the month by sizing the work: a quota of new ads for your spend and hit rate."
  - name: "Next-dollar budget allocator"
    skill: next-dollar-budget-allocator
    job: ads
    from: "library"
    method: ["Ask what the next $10,000 brings in new-customer revenue per channel","Grade how good the evidence is for each channel","Find where each channel stops paying back","Name the test that would settle the ranking"]
    inputs: [performance_sheet, plan!]
    outputs: [plan]
    note: "Reads the quota plan and decides where the money for it goes."
  - pause: "Collect your reviews, support emails and product facts. Keep them in one place."
  - name: "Ad concept matrix builder"
    skill: ad-concept-matrix-builder
    job: ads
    from: "library"
    method: ["Read the buyer words and write each buyer as a problem in a situation","Give every buyer an angle and pair it with an offer","Rank the concepts in test order","Write a first line for each concept"]
    inputs: [product_data, voc_reviews]
    outputs: [angle_library, plan]
    note: "Turns your reviews and facts into ranked ad concepts to fill the quota."
  - pause: "Pick this month's top two or three concepts from the matrix. Keep one problem per concept."
  - name: "Creative brief writer"
    skill: creative-brief-writer
    job: ads
    from: "library"
    method: ["Sort the customer words into wants, blockers and what they already tried","Pick one problem and write the angle in one sentence","Choose the format that can show the value","Name the shot that proves each claim"]
    inputs: [voc_reviews, product_data]
    outputs: [brief]
    note: "Writes a brief for each chosen concept, one problem and one angle at a time."
  - name: "Meta test campaign planner"
    skill: meta-test-campaign-planner
    job: ads
    from: "library"
    method: ["Size the test structure to your budget","Group the ads by pack and name each one","Choose how to split budget and write the settings checklist","Set how you will read the result"]
    inputs: [brief, performance_sheet!]
    outputs: [plan]
    note: "Puts the briefs into a test layout that fits the monthly plan."
