# Workflow skeleton that chains library skills (docs/INTAKE.md). Our words.
id: plan-a-year-of-hiring-and-what-it-will-cost
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: plan-a-year-of-hiring-and-what-it-will-cost
  name: "Plan a year of hiring and what it will cost"
  summary: "Give it your headcount history and goals. Get a hiring forecast, a role-by-role plan and a monthly people-cost budget."
  when: "you are growing the team and need to know who to hire, in what order and what it will cost."
  job: hire-people
  level: intermediate
steps:
  - name: Headcount forecast builder
    skill: headcount-forecast-builder
    job: ops
    from: library
    method: ["Take past hires and exits", "Project hires needed and people likely to leave", "State the method and the range of error", "Lay out the result by month"]
    inputs: [question, spreadsheet!]
    outputs: [spreadsheet]
    note: "Starts with how many people you will need and lose, with a stated margin of error."
  - name: Headcount plan builder
    skill: headcount-plan-builder
    job: ops
    from: library
    method: ["Turn growth goals into roles", "Put the roles in priority order", "Match the order to the forecast", "Set a monthly report for leaders"]
    inputs: [brief, spreadsheet!]
    outputs: [plan, document]
    note: "Reads the forecast from the step before and turns it into named roles in the order to hire them."
  - name: People cost budget builder
    skill: people-cost-budget-builder
    job: ops
    from: library
    method: ["Price each role in the plan", "Build the budget by team", "Show it month by month", "Add notes to explain gaps to finance"]
    inputs: [question, spreadsheet!]
    outputs: [spreadsheet]
    note: "Prices the roles in the plan against the forecast so finance can approve a number."
