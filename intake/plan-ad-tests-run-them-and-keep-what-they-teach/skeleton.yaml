# Workflow skeleton chained from existing skills in the AI Blocks library (docs/INTAKE.md).
id: plan-ad-tests-run-them-and-keep-what-they-teach
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: plan-ad-tests-run-them-and-keep-what-they-teach
  name: "Plan ad tests, run them and keep what they teach"
  summary: "Give it your past ads. Get five untried ideas, a test campaign layout, and after the run, what the results taught."
  when: "you keep making new ads without knowing what the last ones taught you."
  job: plan-ad-tests
  level: advanced
steps:
  - name: "Find the ideas you have not tried"
    skill: untried-ad-idea-finder
    job: analysis
    from: "library"
    method: ["Grade the evidence behind your past ads", "Build one record per ad", "Look for gaps in moments, value, buyer knowledge, openings and form", "Rank the five biggest gaps", "Write one idea per gap with a test question"]
    inputs: [brand_brain, performance_sheet!]
    outputs: [audit_report, brief]
    note: "Starts the chain: reads your past ads and finds five ideas nobody has tested."
  - name: "Lay out the test campaign"
    skill: meta-test-campaign-planner
    job: ads
    from: "library"
    method: ["Size the structure to the business", "Group the new ads in packs of four to eight", "Pick CBO or ABO and say why", "Split budget by funnel stage", "Write the keep, cut and scale rules"]
    inputs: [brief, performance_sheet!]
    outputs: [plan]
    note: "Takes the five ideas from the step before and sets how many ads go in each pack and when to scale."
  - pause: "Launch the test and let it run for the read window without changing it. Then export the results."
  - name: "Learn from the winners and losers"
    skill: winners-and-losers-ad-comparer
    job: analysis
    from: "library"
    method: ["Put a number on each ad", "Rank them and look for a break", "Fill a checklist for every ad", "Find what the winners share and check it is not a place effect", "Write the lesson as a rule to test next"]
    inputs: [performance_sheet, audit_report!, ad_copy!]
    outputs: [lessons_register]
    note: "Reads the test results against the ideas and plan, and records what they teach."
