id: plan-collection-pages-that-rank-for-buying-searches
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: plan-collection-pages-that-rank-for-buying-searches
  name: Plan collection pages that rank for buying searches
  summary: Give it your products and a keyword export. Get validated keywords, a collection page plan and written page copy.
  when: you sell a range, want search sales without ads, and need to know which collection pages to build and what to write on them.
  job: get-found-in-search
  level: intermediate
steps:
  - name: Store keyword validator
    skill: store-keyword-validator
    job: analysis
    from: library
    method:
      - Think like a buyer
      - Gap view (paid tool)
      - Intent
      - Use the bid range when there is no difficulty score
      - Check the results page
      - Cluster
      - Score the list
    inputs:
      - product_data
      - spreadsheet
      - competitor_set!
    outputs:
      - audit_report
    note: Tests your keyword ideas for buying intent, volume and difficulty, and names the page type and owner page for each keeper.
  - pause: Pick one main keyword per page from the keepers and save them as a sheet with the products that belong on each page.
  - name: Collection page planner
    skill: collection-page-planner
    job: page
    from: library
    method:
      - Start with the best-selling category
      - Reuse the same products
      - Name each collection for the search
      - Skip thin collections
      - Match how people ask AI tools
      - Build collections before tweaking product pages
      - State what the result can and cannot prove
    inputs:
      - product_data
      - spreadsheet
      - performance_sheet!
    outputs:
      - plan
    note: Turns the chosen keywords into a build order for collection pages, with handles and links. Reads the keyword sheet you saved after the last step.
  - pause: Choose the first collection from the plan and note its keyword, its products and a few customer review lines.
  - name: Collection page SEO builder
    skill: collection-page-seo-builder
    job: page
    from: library
    method:
      - Check the page is worth the work
      - Write one H1 that carries the keyword
      - Search listing description
      - Links in the text
      - FAQ accordion
      - Grid and links
      - No stuffing, no raw AI text
    inputs:
      - product_data
      - voc_reviews!
      - spreadsheet!
    outputs:
      - pdp_copy
    note: Writes the page text and search listing for that collection, using the keyword and products you chose from the plan.
