# Workflow skeleton for The Positioning Era Cometh (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: positioning-era
source:
  title: "The Positioning Era Cometh"
  by: "Al Ries and Jack Trout"
  kind: other
  rights: ideas-only
  year: 1972
minds: [al-ries, jack-trout]
workflow:
  slug: choose-a-position-check-a-name-stretch-launch-with-press
  name: "Choose a position, check a name stretch, launch with press"
  summary: "Paste your product and rivals. Get one position to own, a name check for the new product and a press-first launch."
  when: "you are launching or extending a brand and want to own one clear idea."
  job: plan-strategy
  level: intermediate
steps:
  - name: "Positioning statement writer"
    skill: positioning-statement-writer
    job: ops
    from: "Wikipedia article on Jack Trout"
    method: ["List the categories a buyer would put you in and who sits at the top of each rung in their mind", "Name what each rival owns, as one word or one attribute", "Find the rival's weak spot that you can truthfully use", "If you cannot be first in a category, define a new one you can lead", "Pick one attribute to own and drop the rest", "Write the position as one plain line and test that it needs no explaining", "Check the line does not stretch the brand into areas that dilute it"]
    inputs: [competitor_set, question]
    outputs: [plan, brief]
    note: "One position to own, the rival weakness to use, and a one-line statement"
  - name: "Brand name stretch checker"
    skill: brand-name-stretch-checker
    job: ops
    from: "The Positioning Era Cometh, 1972"
    method: ["Say in one word or line what your brand name means in the buyer's mind", "Describe the new product and what it would mean on its own", "Ask if the new product fits that meaning or blurs it", "Check if the market is splitting into narrower specialist branches", "If the new branch needs its own meaning, plan a new name", "If it stays under the old name, set the limit so the name does not mean less", "State what happens to the core product if the stretch fails"]
    inputs: [brand_brain, product_data, plan!, competitor_set!]
    outputs: [plan, audit_report]
    note: "A call: use the name, make a new one, or skip. Reads the plan from the step before"
  - name: "Publicity-first launch planner"
    skill: publicity-first-launch-planner
    job: ops
    from: "Interview with Al Ries on Brands and Branding"
    method: ["State the category and whether you are first in it", "If not first, define a narrower category you can lead", "Pick the one word or idea you want to own", "Find the news angle that a reporter would care about", "Plan the press and third-party stories before any ad", "Make the look of the product or brand unlike the rest", "Set the point of trust at which you start ads and how much to spend"]
    inputs: [plan, brand_brain, product_data]
    outputs: [plan]
    note: "A launch that starts with press coverage, then ads once people believe it. Reads the plan from the step before"
