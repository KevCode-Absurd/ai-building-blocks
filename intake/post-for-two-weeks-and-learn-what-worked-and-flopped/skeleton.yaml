# Workflow skeleton built from existing library skills (docs/INTAKE.md). Our words.
id: post-for-two-weeks-and-learn-what-worked-and-flopped
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: post-for-two-weeks-and-learn-what-worked-and-flopped
  name: "Post for two weeks and learn what worked and flopped"
  summary: "Give it your platforms and goal. Get ready posts checked for sharing, then a read of what worked and why one flopped."
  when: "you post on social media and want proof of what works instead of guessing."
  job: grow-social
  level: beginner
steps:
  - name: "Social post planner"
    skill: social-post-planner
    job: ops
    from: "skill: social-post-planner"
    method: ["Pick the platforms and goal", "Set the topics and mix of post types", "Lay out a calendar", "Write the posts for each platform"]
    inputs: [brand_brain!, brief]
    outputs: [plan, copy_draft]
    note: "Starts from your platforms and goal and writes the posts you will publish."
  - name: "Shareable content checker"
    skill: shareable-content-checker
    job: analysis
    from: "skill: shareable-content-checker"
    method: ["Rate each post on six reasons people pass things on", "Quote the part of the post that earns each rating", "Name the weakest reason", "Suggest one change that adds it"]
    inputs: [copy_draft, brief!, persona!]
    outputs: [audit_report]
    note: "Reads the posts from the step before, so you fix the weakest before they go out."
  - pause: "Post for two weeks, then export your post numbers: reach, likes, comments, shares and clicks. You post and export."
  - name: "Social media results analyst"
    skill: social-media-results-analyst
    job: ops
    from: "skill: social-media-results-analyst"
    method: ["Work out the engagement rate per post", "Compare each platform with typical ranges", "Rank the posts", "Say what to post next"]
    inputs: [performance_sheet]
    outputs: [audit_report]
    note: "Fresh start after the two weeks: reads your real numbers and ranks the posts."
  - name: "Flop post diagnoser"
    skill: flop-post-diagnoser
    job: ops
    from: "skill: flop-post-diagnoser"
    method: ["Tell apart three failures: few saw it, they scrolled past, or they saw it and did not care", "Find the weak line", "Say the one change to make"]
    inputs: [copy_draft]
    outputs: [feedback_notes]
    note: "Takes the worst post from the ranking, which started as one of the drafts from step one, and says why it failed."
