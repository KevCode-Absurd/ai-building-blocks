# Workflow skeleton that chains library skills (docs/INTAKE.md). Our words.
id: price-a-product-so-it-pays-after-delivery-ads-and-discounts
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: price-a-product-so-it-pays-after-delivery-ads-and-discounts
  name: Price a product so it pays after delivery, ads and discounts
  summary: Give it a price and every cost. Get the true margin, three test prices and the discount depth that keeps profit.
  when: you are launching or repricing a product and want ad targets and sales to rest on real margin.
  job: set-prices
  level: intermediate
steps:
  - name: Product margin checker
    skill: product-margin-checker
    job: analysis
    from: library
    method:
      - Set the price and work out product margin
      - Add cost of delivery and a shrink allowance
      - Show gross and contribution margin
      - Find break-even and the marketing room left
    inputs:
      - product_data
    outputs:
      - audit_report
    note: Starts with what the product really keeps after delivery and how much ad cost it can carry.
  - name: Pricing decision planner
    skill: pricing-decision-planner
    job: strategy
    from: library
    method:
      - Judge the value to the buyer and write down the costs
      - Set three prices that could each work
      - Estimate sales and total profit at each
      - Check the floor and name the number to watch
    inputs:
      - product_data
      - audit_report!
    outputs:
      - plan
      - offer
    note: Uses the margin and marketing room to set three test prices and pick the most profitable.
  - name: Discount impact checker
    skill: discount-impact-checker
    job: offer
    from: library
    method:
      - Build the full-price waterfall
      - Model the discount and find the sales jump that holds profit flat
      - Find the best depth and check layered offers
      - Treat discount and CAC as one pool and score it
    inputs:
      - product_data
      - offer!
    outputs:
      - audit_report
    note: Takes the chosen price as the offer and shows how deep any discount can go.
