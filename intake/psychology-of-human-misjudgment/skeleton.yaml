# Workflow skeleton for The Psychology of Human Misjudgment (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: psychology-of-human-misjudgment
source:
  title: "The Psychology of Human Misjudgment"
  by: "Charlie Munger"
  kind: talk
  rights: ideas-only
minds: [charlie-munger]
workflow:
  slug: check-a-plan-for-bias-bad-incentives-and-failure
  name: "Check a plan for bias, bad incentives and failure"
  summary: "Describe a decision. Get the pressures behind it, who is rewarded for what, and how the plan could fail."
  when: "you are about to commit to a plan and want it attacked before you do."
  job: think-and-decide
  level: intermediate
steps:
  - name: "Decision bias pile-up checker"
    skill: decision-bias-pileup-checker
    job: analysis
    from: "The Psychology of Human Misjudgment"
    method: ["Write the decision and the clear, rational reasons for it first", "Run a second pass for mind tricks: incentives, reciprocation, consistency with past commitments, social proof, fear of loss", "Count how many push the same way, since several together can turn judgment to mush", "Name the one or two that are strongest here", "Remove or delay the pressure: step away from the auction, the party or the crowd", "Describe the call and who made it", "Ask whether the field gives regular practice and quick feedback", "Check whether confidence comes from a neat story or from a record"]
    inputs: [question]
    outputs: [plan]
    note: "The pressures bending your judgment, and a calmer version of the choice"
  - name: "Incentive checker"
    skill: incentive-checker
    job: analysis
    from: "A Lesson on Elementary Worldly Wisdom, USC Business School, 1994"
    method: ["List the people involved and how each one is paid or rewarded", "Say what behaviour each reward really encourages", "Find where that behaviour differs from what you want", "Look for a small change in the reward that fixes it, such as paying for the thing you want instead of the time spent", "Check that the new reward cannot be gamed", "Check that pay is fair enough to take money off the table", "Write what the job pays and how", "Split the work into routine tasks and thinking tasks"]
    inputs: [plan!, question]
    outputs: [audit_report]
    note: "Who is rewarded for what, where it pulls the wrong way, and a fix. Reads the plan from the step before"
  - name: "Failure-first plan check"
    skill: failure-first-plan-check
    job: ops
    task: plan-strategy
    from: "Charlie Munger, Wikipedia"
    method: ["State the goal in one line", "Ask what would guarantee failure", "List the standard ways of failing in this field", "Check the plan against each one", "Mark anything that risks survival, such as debt or one big dependence", "State the bet and who pushes it", "Assign one or two people to attack it on purpose", "List the attacks: market, timing, team, what the other path would look like"]
    inputs: [plan]
    outputs: [plan]
    note: "A list of the ways it could fail, and the changes that avoid them. Reads the plan from the step before"
