id: pull-request-review-loop
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: review-a-pull-request-fix-the-comments-and-sign-off
  name: "Review a pull request, fix the comments and sign off"
  summary: "Give it a pull request. Get risks ranked, the comments fixed in code and a one-page sign-off with proof."
  when: "a pull request is open and you want it reviewed, fixed and signed off properly."
  job: test-and-fix-code
  level: intermediate
steps:
  - name: "Rank the risks"
    skill: pull-request-risk-reviewer
    job: ops
    from: "skill: pull-request-risk-reviewer"
    method: ["Fetch the diff and the pull request details", "Trace what the change could break outside its own files", "Scan for security gaps, breaking changes and slow queries", "Rank the findings and say what to fix first"]
    inputs: [code_change]
    outputs: [feedback_notes]
    note: "Reads the change and ranks the issues a reviewer should raise."
  - pause: "Post the findings that matter as comments on the pull request."
  - name: "Fix the comments"
    skill: review-comment-fixer
    job: ops
    from: "skill: review-comment-fixer"
    method: ["Fetch every comment and thread on the open pull request", "Number them and say what each fix needs", "Ask which ones to fix", "Apply those fixes"]
    inputs: [codebase]
    outputs: [code_change]
    note: "Works through the comments you posted from the review and updates the code."
  - name: "Sign off"
    skill: human-review-gate
    job: ops
    from: "skill: human-review-gate"
    method: ["Build a one-page review of the finished change", "Collect your notes as blockers and nits", "Refuse to close while a blocker is open", "Record who signed off and what was checked"]
    inputs: [code_change]
    outputs: [audit_report]
    note: "Takes the fixed change and holds it until a named person has reviewed it and no blocker is open."
