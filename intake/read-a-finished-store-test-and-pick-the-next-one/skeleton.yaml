id: read-a-finished-store-test-and-pick-the-next-one
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: read-a-finished-store-test-and-pick-the-next-one
  name: "Read a finished store test and pick the next one"
  summary: "Give it your test numbers and dates. Get a ship call, a ranked list of ideas and the next bold tests."
  when: "a store test has just ended and you need to decide what to ship and what to test next."
  job: test-store-changes
  level: intermediate
steps:
  - name: Get the verdict
    skill: store-test-verdict-maker
    job: analysis
    from: "skill: store-test-verdict-maker"
    method: ["Check the split and how the test ended", "Look for tracking faults and other changes", "Give the lift as a range and in money", "Check order value and margin, then make the call"]
    inputs: [performance_sheet, plan!]
    outputs: [audit_report]
    note: "Starts from your test numbers and says whether the result can be trusted and whether to ship."
  - name: Rank the ideas it points to
    skill: test-idea-ranker
    job: analysis
    from: "skill: test-idea-ranker"
    method: ["Split repairs from tests", "Write each idea as a hypothesis", "Count the evidence and score yes or no", "Rank the top ideas by profit"]
    inputs: [audit_report, performance_sheet!, voc_reviews!]
    outputs: [shortlist]
    note: "Takes what step 1 learned and writes each next idea as a hypothesis with the evidence behind it."
  - name: Pick the next bold tests
    skill: big-swing-test-picker
    job: page
    from: "skill: big-swing-test-picker"
    method: ["Place the store by its traffic", "Pick tests your traffic can prove", "Give the metric and guardrails for each", "Lay out one test per page by month"]
    inputs: [performance_sheet, audit_report!, question!]
    outputs: [shortlist, plan]
    note: "Fits the ideas and the step 1 verdict to what your traffic can prove, in order."
