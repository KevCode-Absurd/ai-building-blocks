# Workflow skeleton chaining AI Blocks library skills (docs/INTAKE.md).
id: reconcile-the-bank-to-your-books-and-issue-a-clean-p-and-l
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: reconcile-the-bank-to-your-books-and-issue-a-clean-p-and-l
  name: "Match bank to books and issue a clean P&L"
  summary: "Give it a bank statement and your ledger. Get matches, each gap traced to its cause, and statements built after the fixes."
  when: "your bank and your books disagree and you need them to agree before you report."
  job: money-and-investing
  level: intermediate
steps:
  - name: "Bank and ledger matcher"
    skill: bank-and-ledger-matcher
    job: ops
    from: "skill: bank-and-ledger-matcher"
    method: ["Clean names and dates on both sides", "Match exact items by reference, amount and date", "Match near items within a small tolerance", "Resolve one payment that covers several entries", "List what is left on each side and draft entries for fees and interest"]
    inputs: [spreadsheet]
    outputs: [spreadsheet, audit_report]
    note: "Starts from the bank file and the ledger and ends with the items that do not match."
  - name: "Reconciliation break tracer"
    skill: reconciliation-break-tracer
    job: ops
    from: "skill: reconciliation-break-tracer"
    method: ["Take each unmatched item one at a time", "Find the entry behind it on the bank side and the ledger side", "Line up date, amount, sign and account", "State the cause in one sentence", "Mark what to do: wait, adjust, ask or remove"]
    inputs: [spreadsheet]
    outputs: [audit_report]
    note: "Works through the leftovers the matcher listed and gives each a cause and an action."
  - pause: "Make the corrections in your books. Then export the updated ledger and the figures for the last period."
  - name: "P&L and balance sheet writer"
    skill: p-l-and-balance-sheet-writer
    job: ops
    from: "skill: p-l-and-balance-sheet-writer"
    method: ["Pick the period and the comparison period", "Build the income statement with variances", "Build the balance sheet and the cash flow", "Flag big swings for a reason", "Mark everything for an accountant to review"]
    inputs: [spreadsheet]
    outputs: [spreadsheet, document]
    note: "Builds statements from the books after your fixes, and flags big swings. Have an accountant review them."
