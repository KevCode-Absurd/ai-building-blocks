# Workflow skeleton chaining library skills (docs/INTAKE.md). Our words.
id: reorder-stock-before-you-run-out-and-track-the-shipment
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: reorder-stock-before-you-run-out-and-track-the-shipment
  name: "Reorder stock before you run out and track the shipment"
  summary: "Connect your store. Get days of stock left, restock rules, draft purchase orders and a shared shipment tracker."
  when: "you reorder by feel and keep finding out too late that a best seller is gone."
  job: run-your-store
  level: intermediate
steps:
  - name: "See how long each product will last"
    skill: days-of-stock-calculator
    job: ops
    from: "skill: days-of-stock-calculator"
    method: ["Read stock levels for each product and location", "Work out how fast each one sells", "Divide stock by sales speed to get days left", "List the products running low first"]
    inputs: [tool_connection]
    outputs: [spreadsheet]
    note: "Reads your live store and makes the sheet of days of stock and sales speed for every product."
  - name: "Set a restock rule for each product group"
    skill: restock-rule-designer
    job: ops
    from: "skill: restock-rule-designer"
    method: ["Group products by how fast they sell and how long the supplier takes", "Pick a rule for each group, such as a min-max level or a fixed order cycle", "Set the trigger level and the order size for each rule", "Say how often to check and who acts"]
    inputs: [spreadsheet]
    outputs: [plan]
    note: "Uses the sales speed from step 1 and your supplier lead times to set the reorder level for each group."
  - name: "Draft the purchase orders"
    skill: purchase-order-reorder
    job: ops
    from: "skill: purchase-order-reorder"
    method: ["Read sales and stock for the last weeks", "Project the date each product runs out, on the careful side", "Size each reorder to cover lead time plus a cushion", "Draft the orders and mark the slow movers to clear"]
    inputs: [spreadsheet]
    outputs: [spreadsheet]
    note: "Reads the days-of-stock sheet from step 1 and turns the rules from step 2 into draft orders."
  - pause: "Check the drafts with your supplier, place the orders and note the purchase order numbers, freight details and ship dates."
  - name: "Build the shipment tracker"
    skill: inbound-shipment-tracker-builder
    job: ops
    from: "skill: inbound-shipment-tracker-builder"
    method: ["Set one shared sheet beside your accounting record", "Add a row per purchase order with quantities, dates and freight details", "Write the rule for who updates it and who is told when arrival moves", "Draft the notice for the warehouse and a same-day check for short shipments"]
    inputs: [question, spreadsheet!]
    outputs: [spreadsheet, document]
    note: "Starts from the draft orders and the details you gathered once the orders were placed."
