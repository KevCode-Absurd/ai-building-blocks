# Workflow skeleton built from existing AI Blocks library skills (docs/INTAKE.md).
id: review-a-contract-and-get-edits-and-a-plain-summary
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: review-a-contract-and-get-edits-and-a-plain-summary
  name: "Review a contract and get edits and a plain summary"
  summary: "Give it a contract and your side. Get a clause review with edits, an IP check and a summary for your lawyer."
  when: "you have a contract to sign and want to know what is risky, what to change and what to ask a lawyer."
  job: check-contracts
  level: intermediate
steps:
  - name: "Review the contract clause by clause"
    skill: contract-reviewer
    job: ops
    from: library
    method: ["Say which side you are on, your deadline and what worries you", "Work out the contract type and read all of it before flagging anything", "Compare each clause with your rules, or with common market terms if you have none", "Rate each gap and write a suggested edit with a fallback", "List the points to raise first when you talk to the other side"]
    inputs: [document]
    outputs: [audit_report, document]
    note: "Starts from the contract and your rules. Makes the flagged clauses and suggested edits the next steps work from."
  - name: "Check the IP clauses"
    skill: ip-clause-checker
    job: ops
    from: library
    method: ["Say what kind of agreement it is and who gives and who gets the IP", "Check that ownership and assignment are clear before anything else", "Check licence scope, warranties and indemnities clause by clause", "Compare the clauses with each other for clashes", "Rank what you find by risk and suggest wording"]
    inputs: [document]
    outputs: [audit_report]
    note: "Reads the reviewed contract and its edits, and looks hardest at the clauses that are slowest to fix later: who owns the work and what each side may use."
  - name: "Write a plain summary"
    skill: contract-plain-summary
    job: ops
    from: library
    method: ["Take the review and the IP findings and decide who will read the summary", "Answer the one question: can I sign this and what is the catch", "Leave out legal terms and keep it to two short paragraphs", "List what the reader must do before signing"]
    inputs: [document]
    outputs: [document]
    note: "Turns the reviewed contract into two minutes of reading for the person who has to sign or approve it."
  - pause: "Take the summary, the suggested edits and the flagged clauses to a qualified lawyer before you sign. This workflow gives you a first check and the right questions, not legal advice."
