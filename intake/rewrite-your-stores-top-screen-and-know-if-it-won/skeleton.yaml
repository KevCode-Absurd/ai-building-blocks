id: rewrite-your-stores-top-screen-and-know-if-it-won
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: rewrite-your-stores-top-screen-and-know-if-it-won
  name: "Rewrite your store's top screen and know if it won"
  summary: "Give it your offer and proof. Get five headline options, a one-change test plan and, after the test, a ship call."
  when: "visitors leave a store page in the first screen and you want a better top screen plus proof it works."
  job: write-landing-page
  level: intermediate
steps:
  - name: Write the top screen
    skill: store-hero-section-writer
    job: page
    from: "skill: store-hero-section-writer"
    method: ["Match the headline to the ad's promise", "Write five headlines and pick one", "Add a subhead, proof, a button and doubt-reducers", "Plan the tests for the top screen"]
    inputs: [offer, voc_reviews!, ad_copy!, web_page!]
    outputs: [copy_draft, plan]
    note: "Starts from your offer, proof and ad. It makes the top-screen copy and a first test plan."
  - name: Plan a one-change test
    skill: one-change-experiment-planner
    job: research
    from: "skill: one-change-experiment-planner"
    method: ["Write the question in plain terms", "List what could affect the result", "Change one thing and hold the rest", "Say what counts as no effect and what each result means"]
    inputs: [question, plan!]
    outputs: [plan]
    note: "Turns the test plan from step 1 into a test that changes the top screen and nothing else."
  - pause: "Put the new top screen live for the test, run it for at least two full weeks, then export visits and orders for both versions."
  - name: Get the ship call
    skill: store-test-verdict-maker
    job: analysis
    from: "skill: store-test-verdict-maker"
    method: ["Check the split and how the test ended", "Look for tracking faults and other changes", "Give the lift as a range and in money", "Check order value and margin, then make the call"]
    inputs: [performance_sheet, plan!]
    outputs: [audit_report]
    note: "Reads the test plan from step 2 and your exported numbers. It says whether to ship the new top screen."
