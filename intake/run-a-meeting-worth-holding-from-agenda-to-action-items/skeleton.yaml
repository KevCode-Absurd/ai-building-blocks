# Workflow skeleton built from existing AI Blocks library skills (docs/INTAKE.md).
id: run-a-meeting-worth-holding-from-agenda-to-action-items
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: run-a-meeting-worth-holding-from-agenda-to-action-items
  name: "Run a meeting worth holding, from agenda to action items"
  summary: "Name a meeting. Get a call on whether to hold it, a pre-read, and notes with owners and dates after."
  when: "you are about to call a meeting and want it to end in decisions with owners."
  job: organise-work
  level: beginner
steps:
  - name: "Decide if the meeting is worth holding"
    skill: meeting-agenda-and-cost-planner
    job: ops
    from: library
    method: ["Say what decision the meeting must make", "Price the meeting in dollars from who attends and how long", "Refuse the meeting if there is no decision, no agenda or no owner", "Build a timed agenda with decisions first"]
    inputs: [brief]
    outputs: [meeting_notes]
    note: "Starts from your idea for a meeting. Makes a go or no-go call and a timed agenda."
  - name: "Write the pre-read"
    skill: meeting-pre-read-writer
    job: ops
    from: library
    method: ["Confirm the goal, the attendees and the date", "Gather background from your notes and past decisions", "Pick the agenda form that fits: status, decision or planning", "Write the pre-read with owners and timings on each topic"]
    inputs: [brief, meeting_notes!]
    outputs: [meeting_notes]
    note: "Builds on the agenda from the step before. Needs your Notion pages connected to pull in background."
  - pause: "Send the pre-read, hold the meeting and record it."
  - name: "Turn the recording into action items"
    skill: meeting-notes-maker
    job: ops
    from: library
    method: ["Check the audio file and clean up the sound", "Write out the talk with a label for each speaker", "Pull out the summary and the decisions made", "List action items with an owner and a date"]
    inputs: [audio]
    outputs: [meeting_notes]
    note: "Starts from the recording. Check each decision and action against the agenda you wrote at the start."
