# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md). Our words.
id: scale-meta-spend-while-it-still-pays
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: scale-meta-spend-while-it-still-pays
  name: "Scale Meta spend while it still pays"
  summary: "Give it your ad results and costs. Get your real return, a scaling ladder, a budget split and a delivery fix."
  when: "your Meta ads are profitable and you want to spend more without losing the profit."
  job: launch-and-scale-ads
  level: advanced
steps:
  - name: "Platform ROAS reality check"
    skill: platform-roas-reality-check
    job: analysis
    from: "library"
    method: ["Set the store's own base","Climb down the return ladder for each platform","Check the top ad by itself","Look for leaks from existing customers"]
    inputs: [performance_sheet, spreadsheet!]
    outputs: [audit_report]
    note: "Starts by finding the return that is real, so scaling is judged on the right number."
  - pause: "Write down the return you need to break even. Pick the campaign to scale."
  - name: "Meta scaling campaign planner"
    skill: meta-scaling-campaign-planner
    job: ads
    from: "library"
    method: ["Work out break-even return","Find each ad set's ceiling","Build the scaling ladder","Decide whether a scaling campaign pays off"]
    inputs: [performance_sheet, product_data]
    outputs: [plan]
    note: "Sets the scaling steps against the break-even you wrote down."
  - name: "Next-dollar budget allocator"
    skill: next-dollar-budget-allocator
    job: ads
    from: "library"
    method: ["Ask what the next dollar brings in new-customer revenue","Check retargeting is not taking the budget","Find the stop point","Write the test that would change the ranking"]
    inputs: [performance_sheet, plan!]
    outputs: [plan]
    note: "Uses the scaling plan to decide how the extra budget is split."
  - pause: "Scale in the steps of the ladder for one to two weeks. Export the results."
  - name: "Meta delivery troubleshooter"
    skill: meta-delivery-troubleshooter
    job: analysis
    from: "library"
    method: ["Lay out the serving sequence","Check the value formula and the unit economics","Check warm-audience traps","Name the failing step"]
    inputs: [performance_sheet, question]
    outputs: [audit_report]
    note: "Finds why spend stalled or cost rose once the budget went up."
