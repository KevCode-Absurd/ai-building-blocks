# Workflow skeleton for Security Analysis, Part II (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: security-analysis-bond-safety
source:
  title: "Security Analysis: Principles and Technique (second edition)"
  by: "Benjamin Graham and David L. Dodd"
  kind: book
  rights: ideas-only
  year: 1940
minds: [benjamin-graham]
workflow:
  slug: check-if-a-bond-or-loan-is-safe-to-hold
  name: "Check if a bond or loan is safe to hold"
  summary: "Paste the debt terms and the borrower's statements. Get coverage and cushion tests and a safe, speculative or reject call."
  when: "you are about to lend money, buy a bond or note, or hold a preferred share, and want to know if the borrower can keep paying in a bad year."
  job: money-and-investing
  level: intermediate
steps:
  - name: Sort it as investment or speculation
    skill: investment-or-speculation-sorter
    job: analysis
    task: money-and-investing
    from: "Chapter IV, investment and speculation"
    method: ["Ask whether careful study promises safety of principal and a satisfactory return", "Judge the operation at this price, not the issue in general", "Label anything that fails as speculation, and say so plainly"]
    inputs: [question]
    outputs: [audit_report]
    note: "A first label, so the rest of the run knows whether it is testing for safety or for a gamble."
  - name: Test the borrower's average earnings against all its debt
    skill: average-earnings-coverage-tester
    job: analysis
    task: money-and-investing
    from: "Chapters VI to IX, ability to pay, bad-year test and the three ways to count coverage"
    method: ["List every claim on the borrower, ahead of and behind yours, and total all yearly charges", "Judge safety by the borrower's ability to pay, not by the collateral", "Average earnings over about seven years, counting loss years as zero", "Divide by total charges and compare with a bar set by how steady the business is", "Check the trend, the worst year and the latest year, and ask for more cover if one is poor"]
    inputs: [source_text, audit_report!]
    outputs: [audit_report]
    note: "Takes the label, then tests earnings against the full pile of charges, not only the borrower's own claim."
  - name: Test the cushion of value behind the debt
    skill: equity-cushion-ratio-tester
    job: analysis
    task: money-and-investing
    from: "Chapters X and XI, property value and the stock-value ratio"
    method: ["Value what sits behind the debt: the market value of the stock, or a fair price for the owner's share", "Divide it by the total debt and compare with a bar by business type", "Treat asset book values and pledged property as weak comfort, except for assets that can be moved and sold", "Read a pass on one test and a fail on the other as a question to answer, not a tie"]
    inputs: [audit_report, source_text!]
    outputs: [audit_report]
    note: "Adds a second, independent test: is the business worth far more than it owes?"
  - name: Write the safe, speculative or reject call
    skill: lender-safety-verdict-writer
    job: analysis
    task: money-and-investing
    from: "Chapters VI, VII, IX and XIII, rules of exclusion, near maturity and the high coupon"
    method: ["Treat selection as rejection: if there is a doubt, decline", "Do not relax the bar for a near maturity, a high coupon or a pledge", "Check size, track record, refinancing and what a rise in rates does", "Give the call, the reasons and what would change it"]
    inputs: [audit_report]
    outputs: [audit_report]
    note: "Turns both tests into one call with reasons, using rules that exclude rather than rules that persuade."
