# Workflow skeleton for Security Analysis, Part V (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: security-analysis-earnings-record
source:
  title: "Security Analysis: Principles and Technique (second edition)"
  by: "Benjamin Graham and David L. Dodd"
  kind: book
  rights: ideas-only
  year: 1940
minds: [benjamin-graham]
workflow:
  slug: find-a-companys-real-earning-power-and-its-tricks
  name: "Find a company's real earning power and its tricks"
  summary: "Paste several years of a company's income statements. Get one-offs removed, padding flagged and a normal earnings range."
  when: "you are reading a company's results, or a business you might buy, and want to know what it really earns in an ordinary year."
  job: money-and-investing
  level: advanced
steps:
  - name: Take the one-off items out of each year
    skill: one-off-items-separator
    job: analysis
    task: money-and-investing
    from: "Chapters XXXI and XXXII, restating the income account"
    method: ["List every gain and loss that will not repeat: asset sales, security gains, tax refunds, write-downs, lawsuits", "Set each one beside its pair, since a one-off gain is often matched by a one-off charge elsewhere", "Rebuild each year's operating result without them", "Keep the one-offs in the long-run record, since over many years they are part of the real result"]
    inputs: [source_text]
    outputs: [audit_report]
    note: "A clean year-by-year table of what the business earned from its ordinary work."
  - name: Look for padding in the profit figure
    skill: earnings-padding-detector
    job: analysis
    task: money-and-investing
    from: "Chapters XXXII to XXXVI, misleading artifices, depreciation and reserves"
    method: ["Check whether a big write-down in one year made the next year's profit look better", "Check whether costs were moved from income to surplus or parked as deferred charges", "Check whether depreciation fell because assets were marked down, or fell below what is really spent", "Check income from subsidiaries and investments, booked as dividends, stock dividends or paper gains", "If the management itself looks unsound, stop: do not adjust a number, avoid it"]
    inputs: [source_text!, audit_report]
    outputs: [audit_report]
    note: "Finds profit that comes from accounting choices instead of the business."
  - name: Decide whether the past record can guide the future
    skill: earnings-record-reliability-checker
    job: analysis
    task: money-and-investing
    from: "Chapters XXXVII and XXXVIII, earning power and reasons to reject the record"
    method: ["Ask if the years cluster near the average or are just ten unrelated numbers", "Ask if the business is the kind that lasts: its position, its industry and its finances", "Check if good years rested on a temporary price, a peak rate of output or a cost saving that may not last", "Check if the company's place in the industry has changed", "Treat deficits as a question about survival, not as a number to average"]
    inputs: [audit_report, source_text!]
    outputs: [audit_report]
    note: "Says how much weight the history can bear, before it is turned into a figure."
  - name: Work out normal earnings as a range
    skill: normal-earnings-estimator
    job: analysis
    task: money-and-investing
    from: "Chapters XXXVII and XXXIX, average against trend and current earnings"
    method: ["Average the cleaned years over five to ten years, with loss years at their real value or at zero and both shown", "Do not use the latest year alone unless it was not a boom year, the trend is up and the industry supports growth", "Do not project a trend forward; cap the figure at what has already been earned in a normal year", "State a low, normal and high figure with the reason for each"]
    inputs: [audit_report]
    outputs: [audit_report]
    note: "One range of normal earnings, with the tricks found and how far to trust it."
