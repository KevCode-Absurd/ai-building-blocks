# Workflow skeleton built from existing library skills (docs/INTAKE.md). Our words.
id: send-reorder-emails-that-fit-each-buyer-then-read-results
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: send-reorder-emails-that-fit-each-buyer-then-read-results
  name: "Send reorder emails that fit each buyer, then read results"
  summary: "Give it your products and how long they last. Get timed reorder emails split by buyer type, then a read of results."
  when: "your buyers use up what they buy and you want more second and repeat orders."
  job: keep-customers
  level: intermediate
steps:
  - name: "Reorder and second-order planner"
    skill: reorder-and-second-order-planner
    job: email
    from: "skill: reorder-and-second-order-planner"
    method: ["Work out when each product runs out", "Time a refill nudge before then", "Time a second-order nudge for new buyers", "Cap the offer per message", "Skip buyers with an open problem"]
    inputs: [product_data, performance_sheet!, offer!]
    outputs: [email_flow]
    note: "Starts from your products and how long they last and writes the timed reorder messages."
  - name: "Customer stage flow mapper"
    skill: customer-stage-flow-mapper
    job: email
    from: "skill: customer-stage-flow-mapper"
    method: ["Define new, returning and loyal buyers with your own filters", "Set a goal and tone for each", "Apply the split to the reorder flow", "Check each offer against your margin"]
    inputs: [email_flow, offer!, brand_brain!, performance_sheet!]
    outputs: [email_flow]
    note: "Takes the reorder messages and gives new, returning and loyal buyers their own paths."
  - name: "Dynamic email block planner"
    skill: dynamic-email-block-planner
    job: email
    from: "skill: dynamic-email-block-planner"
    method: ["List the customer fields you hold, with exact values", "Plan show and hide rules so one email serves each group", "Plan a product block that pulls the item they bought", "Plan the tests for each rule"]
    inputs: [email_flow, product_data!, brand_brain!]
    outputs: [email_flow]
    note: "Reads the staged flow and turns the splits into show and hide rules and product blocks."
  - pause: "Build the flows in your email tool and let them run for 30 days. Then export the flow and campaign numbers. You build and export."
  - name: "Email and SMS performance reader"
    skill: email-and-sms-performance-reader
    job: analysis
    from: "skill: email-and-sms-performance-reader"
    method: ["Check nothing is broken", "Read flow results and revenue", "Compare each flow with the number of orders", "Rank the causes and give one fix to test each"]
    inputs: [performance_sheet, email_flow!]
    outputs: [audit_report]
    note: "Reads the results next to the flow you built, so you see which branch earned and which to fix."
