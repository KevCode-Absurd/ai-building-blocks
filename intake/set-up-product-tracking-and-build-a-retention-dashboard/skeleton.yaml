# Workflow skeleton chaining AI Blocks library skills (docs/INTAKE.md).
id: set-up-product-tracking-and-build-a-retention-dashboard
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: set-up-product-tracking-and-build-a-retention-dashboard
  name: "Set up product tracking and build a retention dashboard"
  summary: "Describe your product. Get an event plan to ship, then a retention grid and a shareable dashboard from your real data."
  when: "you are building a product and need clean usage tracking, then a clear view of who comes back."
  job: track-numbers
  level: advanced
steps:
  - name: "Event tracking planner"
    skill: event-tracking-planner
    job: ops
    from: "skill: event-tracking-planner"
    method: ["Pick the one main number to steer by", "List the events as object then past-tense action", "Split event details from details about the person", "Define the funnels and the retention groups", "Add naming rules and a version note for the plan"]
    inputs: [brief]
    outputs: [spreadsheet, plan]
    note: "Starts from your product description and fixes the event list, the funnels and the retention groups you will read later."
  - pause: "Ship the events. Let real people use the product for two to four weeks. Export sign-up dates and activity dates per person."
  - name: "Retention heatmap maker"
    skill: retention-heatmap-maker
    job: ops
    from: "skill: retention-heatmap-maker"
    method: ["Set the sign-up group and what counts as active", "Build the group by period table from the export", "Work out the share of each group still active in each period", "Draw the colour-coded grid", "Read the grid in plain words: where people drop and which groups hold"]
    inputs: [spreadsheet]
    outputs: [spreadsheet, audit_report!]
    note: "Uses the groups and the activity event the plan defined, on the export you pulled after the pause."
  - name: "Dashboard builder"
    skill: dashboard-builder
    job: ops
    from: "skill: dashboard-builder"
    method: ["Name the audience and the few numbers that matter", "Put the main number and its supports in cards at the top", "Chart the retention grid and the funnel below them", "Add filters for group and period", "Save it as one page you can open and share"]
    inputs: [spreadsheet]
    outputs: [web_page]
    note: "Takes the retention table from the step before and turns it into a page the team can open."
