# Workflow skeleton that chains library skills (docs/INTAKE.md). Our words.
id: set-your-cac-limit-and-test-what-ads-really-add
source:
  title: AI Blocks library
  by: AI Blocks
  kind: other
  rights: ours
workflow:
  slug: set-your-cac-limit-and-test-what-ads-really-add
  name: Set your CAC limit and test what your ads really add
  summary: Give it your ad and order data. Get a CAC limit, a truer ROAS, a lift test and a budget split.
  when: you spend on several channels, platforms claim more than your store sees, and you need one limit.
  job: plan-ad-tests
  level: advanced
steps:
  - name: New-customer profit dashboard builder
    skill: new-customer-profit-dashboard-builder
    job: analysis
    from: library
    method:
      - Use net revenue and define CAC on new customers only
      - Track new and returning customers apart
      - Work out new-customer MER and profit contribution
      - Build the daily rows and set the reading rules
    inputs:
      - performance_sheet
      - spreadsheet!
    outputs:
      - spreadsheet
    note: Starts with a daily sheet of new-customer CAC, MER and profit from your store and ad exports.
  - name: CAC payback checker
    skill: cac-payback-checker
    job: analysis
    from: library
    method:
      - Count CAC and build first-order profit
      - Choose one payback window and rate the profit to CAC ratio
      - Work out the CAC you can afford
      - Set a floor and an expected CAC and read the trend
    inputs:
      - performance_sheet
      - spreadsheet!
    outputs:
      - audit_report
    note: Uses the new-customer sheet to set the CAC limit you and your media buyer both hold to.
  - name: Platform ROAS reality check
    skill: platform-roas-reality-check
    job: analysis
    from: library
    method:
      - Set the store's own base
      - "Step down each platform's ROAS: view credit, clicks, existing customers"
      - Check the top ad by itself
      - Rank the evidence behind each decision
    inputs:
      - performance_sheet
      - spreadsheet!
    outputs:
      - audit_report
    note: Compares what each platform reports with the new-customer sheet, to see which numbers hold up.
  - pause: Pick the channel you doubt most and pull its spend by week and region for the last 90 days.
  - name: Incrementality test planner
    skill: incrementality-test-planner
    job: analysis
    from: library
    method:
      - Decide whether to test at all
      - "Match the method to the question: in-platform lift or region test"
      - Size the change, the run time and the quiet window
      - Say how to read it with a cut, hold or scale rule
    inputs:
      - performance_sheet
    outputs:
      - plan
    note: Designs a lift test for the channel the first checks left in doubt.
  - pause: Run the test for the planned weeks, then pull spend and new-customer returns by channel.
  - name: Next-dollar budget allocator
    skill: next-dollar-budget-allocator
    job: ads
    from: library
    method:
      - Ask where the next dollar goes for each channel
      - Grade the evidence and find each stop point
      - Size spend on existing customers as a number
      - Write the test plan with success measures other than daily return
    inputs:
      - performance_sheet
      - plan!
    outputs:
      - plan
    note: Reads the test plan and its result to decide where the next $10,000 goes.
