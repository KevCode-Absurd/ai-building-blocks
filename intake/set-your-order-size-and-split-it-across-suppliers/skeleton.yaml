# Workflow skeleton chaining library skills (docs/INTAKE.md). Our words.
id: set-your-order-size-and-split-it-across-suppliers
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: set-your-order-size-and-split-it-across-suppliers
  name: "Set your order size and split it across suppliers"
  summary: "Give it past sales and supplier quotes. Get a forecast, the cheapest order size and how much to buy from each supplier."
  when: "you buy stock in batches and want the lowest total cost, not a round-number guess."
  job: plan-supply-chain
  level: intermediate
steps:
  - name: "Forecast demand"
    skill: demand-forecast-planner
    job: ops
    from: "skill: demand-forecast-planner"
    method: ["Read the sales history and spot the pattern", "Pick the forecast method that fits it", "Test it on months you held back", "Give a forecast by period and a way to track the miss"]
    inputs: [spreadsheet]
    outputs: [plan, spreadsheet]
    note: "Starts from your past sales and makes the demand figure the next steps size orders from."
  - name: "Find the cheapest order size"
    skill: order-quantity-calculator
    job: ops
    from: "skill: order-quantity-calculator"
    method: ["Take yearly demand from the forecast", "Add the cost to place one order and the cost to hold one unit for a year", "Work out the order size with the lowest total cost", "Compare it against each supplier price break"]
    inputs: [spreadsheet]
    outputs: [spreadsheet]
    note: "Reads the demand figure from step 1 and finds the order size with the lowest total cost."
  - name: "Split the order across suppliers"
    skill: supplier-order-splitter
    job: ops
    from: "skill: supplier-order-splitter"
    method: ["List each supplier quote, minimum order and lead time", "Set the demand to cover from the order size sheet", "Split the quantity to get the lowest total cost within each limit", "Show the risk of leaning on one supplier"]
    inputs: [spreadsheet]
    outputs: [plan]
    note: "Takes the order size from step 2 and your quotes, and says how much to buy from each supplier."
