# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md).
id: set-your-position-and-turn-it-into-a-checked-roadmap
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: set-your-position-and-turn-it-into-a-checked-roadmap
  name: "Set your position and turn it into a checked roadmap"
  summary: "Give it what you offer and who you serve. Get a position, a roadmap of results and a failure review."
  when: "you know roughly where you want to compete and need a plan you can check before you commit."
  job: plan-strategy
  level: advanced
steps:
  - name: "Choose a position and what you will not do"
    skill: strategy-trade-off-planner
    job: strategy
    from: "skill: strategy-trade-off-planner"
    method: ["Separate doing better from doing different", "Choose one position that fits the facts", "Write a list of things you will not do", "List the activities that must fit together to carry it"]
    inputs: [question, competitor_set!]
    outputs: [plan]
    note: "Starts the chain with a position, a not-do list and the activities that carry it"
  - name: "Rewrite the activities as a roadmap of results"
    skill: outcome-based-roadmap
    job: ops
    from: "skill: outcome-based-roadmap"
    method: ["Mark each item as a feature, a problem or a result", "Rewrite features as problems for named customers", "Give each problem one result you can measure", "Swap fixed dates for review points"]
    inputs: [plan, question!]
    outputs: [plan]
    note: "Turns the position's activities into three to five problems with a measure each"
  - name: "Rebuild the roadmap from the end date"
    skill: work-backwards-plan-checker
    job: strategy
    from: "skill: work-backwards-plan-checker"
    method: ["Fix the goal, the measure and the date", "Work back from the date to this week", "Check the answer a second way and test small changes", "Add a backup route and score the plan out of 100"]
    inputs: [plan]
    outputs: [audit_report, plan]
    note: "Tests the roadmap by building it backwards and shows where it does not hold"
  - name: "List the ways it could fail and fix them"
    skill: failure-first-plan-check
    job: analysis
    from: "skill: failure-first-plan-check"
    method: ["List what would guarantee failure", "Add the usual ways plans in this field fail", "Check each against the plan and mark risks that could end it", "Write one change for each exposed failure"]
    inputs: [plan]
    outputs: [plan]
    note: "Attacks the checked roadmap and writes the changes that close the gaps"
