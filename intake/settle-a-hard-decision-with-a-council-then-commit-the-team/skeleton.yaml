# Workflow skeleton chaining library skills (docs/INTAKE.md). Our words.
id: settle-a-hard-decision-with-a-council-then-commit-the-team
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: settle-a-hard-decision-with-a-council-then-commit-the-team
  name: "Settle a hard decision with a council, then commit"
  summary: "Give it a hard decision. Get a council's call and dissent, a stress-tested plan and a note that commits the team."
  when: "you face a real choice, the team is split and you need a call everyone will act on."
  job: think-with-minds
  level: intermediate
steps:
  - name: "Run the council"
    skill: advisory-council
    job: ops
    from: "skill: advisory-council"
    method: ["Restate the question and what a good outcome is", "Seat the minds, each in a role", "Let them answer, challenge and rank each other blind", "Write the chair's brief with the decision and strongest dissent"]
    inputs: [question]
    outputs: [council_brief]
    note: "Gives the decision, the strongest dissent, what would change the call and the first steps."
  - pause: "Turn the brief's decision and first three steps into a dated plan with an owner for each step."
  - name: "Try to break the plan"
    skill: failure-first-plan-check
    job: strategy
    from: "skill: failure-first-plan-check"
    method: ["State the goal in one line", "List what would guarantee failure", "Check the plan against each failure", "Set people to attack it on purpose"]
    inputs: [plan]
    outputs: [plan]
    note: "Tests the plan you wrote from the council's brief and fixes the gaps."
  - name: "Write the commit note"
    skill: disagree-and-commit-note-writer
    job: ops
    from: "skill: disagree-and-commit-note-writer"
    method: ["Write each person's doubt as a fair line", "Sort each as a difference of view or a clash of aims", "Name who decides a clash", "Draft the team note with owner, signal and review date"]
    inputs: [plan]
    outputs: [copy_draft]
    note: "Takes the checked plan and the council's dissent and writes the note that closes the debate."
