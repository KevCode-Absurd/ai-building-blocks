# Workflow skeleton for The 7 Habits of Highly Effective People, Habit 3 (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: seven-habits-week
source:
  title: "The 7 Habits of Highly Effective People (25th anniversary edition)"
  by: "Stephen R. Covey"
  kind: book
  rights: ideas-only
  year: 1989
minds: [stephen-covey]
workflow:
  slug: plan-a-week-that-puts-what-matters-before-what-is-loud
  name: "Plan a week that puts what matters first"
  summary: "Paste your task list and roles. Get what to drop, hand off and protect, a role-based week and a Friday review."
  when: "your days fill with urgent small jobs and the important work, the kind with no deadline, keeps slipping."
  job: plan-strategy
  level: beginner
steps:
  - name: Sort urgent from important
    skill: urgent-versus-important-sorter
    job: analysis
    task: plan-strategy
    from: "Habit 3, the time management matrix"
    method: ["List everything on your plate and the time each takes", "Mark each item urgent or not, and important or not, where important means it serves a goal or role you chose", "Sort into four boxes and estimate the share of your week in each", "Name what to drop, what to hand off and what important work gets time first", "Write a short, pleasant no for the first two things you will refuse"]
    inputs: [question, plan!]
    outputs: [audit_report, question]
    note: "Four boxes with your real time split, what to drop or hand off, and what to protect."
  - name: Hand off what others can own
    skill: results-agreement-writer
    job: ops
    task: lead-people
    from: "Habit 3, delegation: gofer and stewardship"
    method: ["Pick a job that someone else could own and name the result wanted, not the method", "Set only the limits that truly matter and name the known traps", "List the people, money, tools and help on offer", "Fix when and how progress is judged, with the person judging their own work first", "State what follows good and poor results"]
    inputs: [audit_report!, question]
    outputs: [plan]
    note: "A one-page agreement for each job you hand off: the result, limits, help, review times and consequences."
  - name: Build the week from your roles
    skill: values-to-week-planner
    job: ops
    task: plan-strategy
    from: "Habit 3, organizing the week around roles and goals"
    method: ["Write your roles for the week", "Choose one or two results for each role, with some that are important but not urgent", "Put those results in the calendar as real appointments before anything else", "Leave open space for people and surprises", "Review each morning and adapt"]
    inputs: [question]
    outputs: [plan]
    note: "A week built from roles and chosen results, with the important work booked first."
  - pause: "Live the week. Keep the plan in view and note when a loud job pulled you away."
  - name: Review how the week went
    skill: weekly-time-audit-planner
    job: analysis
    task: plan-strategy
    from: "Habit 3, evaluating the week against your chosen priorities"
    method: ["Count last week's hours by what you chose and what was taken", "Compare with the plan and the roles", "Find the one hour or habit to win back", "Carry one change into the next week"]
    inputs: [question, plan!]
    outputs: [audit_report, plan]
    note: "What you chose against what took you, and one hour won back for next week."
