# Workflow skeleton for The 7 Habits of Highly Effective People, Habits 4 to 6 (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: seven-habits-win-win
source:
  title: "The 7 Habits of Highly Effective People (25th anniversary edition)"
  by: "Stephen R. Covey"
  kind: book
  rights: ideas-only
  year: 1989
minds: [stephen-covey]
workflow:
  slug: reach-a-deal-both-sides-will-back
  name: "Reach a deal both sides will back"
  summary: "Describe the deal or dispute. Get your stance, a plan to listen first, a third option and a written agreement."
  when: "you must agree something with a partner, client, boss or family member and both of you want to win."
  job: sell-and-negotiate
  level: intermediate
steps:
  - name: Set your stance and your no-deal line
    skill: win-win-stance-planner
    job: strategy
    task: sell-and-negotiate
    from: "Habit 4, six ways to deal with people and five parts of win-win"
    method: ["Name the way you and the other side are likely to approach it: win-lose, lose-win, lose-lose, win, win-win or no deal", "Check your balance of courage and consideration", "Write what a win looks like for the other side as well as for you", "Set the no-deal line: the point where you would rather walk away", "Check the trust, the agreement and the rewards around the deal"]
    inputs: [question]
    outputs: [plan, question]
    note: "Your stance, what a win is for each side and the point where you walk away."
  - name: Add to the trust first
    skill: trust-deposit-planner
    job: strategy
    task: sell-and-negotiate
    from: "Habit 4, the emotional bank account"
    method: ["Rate the trust in the relationship today and what has drawn it down", "Learn what counts as a deposit to this person, not to you", "Pick deposits from six kinds: understanding them, small kindnesses, kept promises, clear expectations, loyalty to those absent and sincere apology", "Schedule two small deposits before the talk"]
    inputs: [plan, question!]
    outputs: [plan]
    note: "Where trust stands, and two deposits to make before the talk."
  - name: Plan to listen first
    skill: listen-first-talk-planner
    job: strategy
    task: sell-and-negotiate
    from: "Habit 5, seek first to understand"
    method: ["Set aside your own story and your reply", "Rephrase their words and then the feeling", "Keep going until they say you have it", "Only then state your side, with credibility, then feeling, then reasons"]
    inputs: [question]
    outputs: [plan]
    note: "A listening plan: what to ask, how to restate, and when to speak."
  - pause: "Hold the conversation. Listen until they say you have it right, and write down their concerns and yours in two columns."
  - name: Find a third option
    skill: third-option-finder
    job: strategy
    task: sell-and-negotiate
    from: "Habit 6, fishing for the third alternative"
    method: ["Write both sides' concerns where all can see them", "Sit on the same side of the problem", "Ask for ideas that meet every concern, without judging them yet", "Pick the one that beats both starting plans"]
    inputs: [question]
    outputs: [plan]
    note: "At least three options that meet both sides' needs, and a small first step."
  - name: Write the agreement
    skill: results-agreement-writer
    job: ops
    task: sell-and-negotiate
    from: "Habit 4, win-win agreements"
    method: ["State the desired results, not the methods", "Set the guidelines and the resources", "Fix how and when each side reports on progress", "State the consequences up front, good and poor", "Add a clause for what happens if it is not working"]
    inputs: [plan, question]
    outputs: [plan]
    note: "A written agreement both sides can back: results, limits, help, review and consequences."
