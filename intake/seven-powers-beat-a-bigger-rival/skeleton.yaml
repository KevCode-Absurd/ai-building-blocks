# Workflow skeleton for 7 Powers (a book summary), counter-positioning (docs/INTAKE.md). Our words; the text stays in mind-sources/hamilton-helmer (local only).
id: seven-powers-beat-a-bigger-rival
source:
  title: "7 Powers: The Foundations of Business Strategy (a book summary)"
  by: "Hamilton Helmer"
  kind: book
  rights: ideas-only
  year: 2016
minds: [hamilton-helmer]
workflow:
  slug: beat-a-bigger-rival-with-a-model-it-cannot-copy
  name: "Beat a bigger rival with a model it cannot copy"
  summary: "Paste your rivals. Get gaps, a model the leader would lose by copying, and what to build while the window is open."
  when: "a bigger rival dominates your market and you need a way to win that they cannot match without hurting themselves."
  job: plan-strategy
  level: advanced
steps:
  - name: Find where the leader is weak
    skill: competitor-white-space-mapper
    job: research
    task: plan-strategy
    from: "Chapter 4, counter-positioning"
    method: ["List what buyers value and who is strong on each", "Mark the gaps nobody covers well", "Note where the leader's model forces a trade-off"]
    inputs: [competitor_set, voc_reviews!, brand_brain!]
    outputs: [audit_report]
    note: "Where nobody is strong, and where the leader's own model holds it back."
  - name: Find a model the leader would lose by copying
    skill: counter-positioning-finder
    job: strategy
    task: plan-strategy
    from: "Chapter 4, counter-positioning"
    method: ["Write how the leader earns its money", "Design a model that is better for some buyers", "Work out what the leader would lose by copying it", "Check the other ways the leader could respond"]
    inputs: [audit_report, question!]
    outputs: [audit_report]
    note: "A new model, with the sum that shows why the leader holds back."
  - name: Check it lasts ten years
    skill: ten-year-durability-checker
    job: strategy
    task: plan-strategy
    from: "Chapter 4 and chapter 9, the limits of counter-positioning"
    method: ["Ask who could copy you and how long it would take", "Split value into the next few years and the years after", "List what gets harder to copy as you grow", "Ask what change in the world would end the edge"]
    inputs: [audit_report, question!]
    outputs: [audit_report]
    note: "How long the window stays open, and who else could use the same model."
  - name: Plan what to build while the window is open
    skill: power-stage-build-planner
    job: strategy
    task: plan-strategy
    from: "Chapter 9, putting the powers together"
    method: ["Name the stage your market is in from signs you can check", "Mark which powers can still be built at that stage", "Pick the nearest one and plan a first test with a decision rule", "List the early product choices that help or close each power"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "A second power to build with the time your new model buys."
