# Workflow skeleton for 7 Powers (a book summary) (docs/INTAKE.md). Our words; the text stays in mind-sources/hamilton-helmer (local only).
id: seven-powers-find-your-power
source:
  title: "7 Powers: The Foundations of Business Strategy (a book summary)"
  by: "Hamilton Helmer"
  kind: book
  rights: ideas-only
  year: 2016
minds: [hamilton-helmer]
workflow:
  slug: find-which-of-seven-powers-you-hold-or-can-build
  name: "Find which of seven powers you hold or can build"
  summary: "Describe your business. Get each of the seven powers scored on benefit and barrier, a ten-year check and what to build first."
  when: "you think your business has a moat and want proof, or you want to know which lasting advantage to build next."
  job: plan-strategy
  level: advanced
steps:
  - name: Test your main advantage
    skill: business-power-tester
    job: strategy
    task: plan-strategy
    from: "Chapter 1, what makes a strategic power"
    method: ["Name the benefit in numbers", "Name the barrier in words", "Test that the benefit is big enough to matter", "Match it to one power and a stage"]
    inputs: [question, competitor_set!]
    outputs: [audit_report]
    note: "The benefit, the barrier, whether it is big enough and the one power it matches."
  - name: Score all seven powers
    skill: seven-powers-scorecard-builder
    job: strategy
    task: plan-strategy
    from: "Chapters 2 to 8, one chapter for each power"
    method: ["Write the benefit and barrier each power needs", "Find the fact in your business that shows each one, or mark it missing", "Score each power from none to proven", "Rank the powers you hold, could build and cannot"]
    inputs: [audit_report, question!]
    outputs: [audit_report]
    note: "Each power scored on benefit and barrier, so the one you named is checked against the other six."
  - name: Check it lasts ten years
    skill: ten-year-durability-checker
    job: strategy
    task: plan-strategy
    from: "Chapter 1 and chapter 9, how long a power holds"
    method: ["Ask who could copy you and how long it would take", "Split value into the next few years and the years after", "List what gets harder to copy as you grow", "Ask what change in the world would end the edge"]
    inputs: [audit_report, question!]
    outputs: [audit_report]
    note: "What could take the top-scoring power away, and how soon."
  - name: Plan what to build at your stage
    skill: power-stage-build-planner
    job: strategy
    task: plan-strategy
    from: "Chapter 9, putting the powers together, and the stages of a market"
    method: ["Name the stage your market is in from signs you can check", "Mark which powers can still be built at that stage", "Pick the nearest one and plan a first test with a decision rule", "List the early product choices that help or close each power"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "The power to build now, a first test, and the choices that would close other powers."
