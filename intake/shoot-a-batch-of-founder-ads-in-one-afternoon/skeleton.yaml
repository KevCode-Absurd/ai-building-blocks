# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md). Our words.
id: shoot-a-batch-of-founder-ads-in-one-afternoon
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: shoot-a-batch-of-founder-ads-in-one-afternoon
  name: "Shoot a batch of founder ads in one afternoon"
  summary: "Give it your reviews, product facts and brand facts. Get checked founder scripts, hooks and a shoot list for one afternoon."
  when: "you or your founder will go on camera and you want a batch of ads filmed in one session."
  job: make-video-ads
  level: intermediate
steps:
  - name: "Ad concept matrix builder"
    skill: ad-concept-matrix-builder
    job: ads
    from: "library"
    method: ["Read the buyer words and write each buyer as a problem","Give each buyer an angle","Rank the concepts in test order","Write a first line for each concept"]
    inputs: [product_data, voc_reviews]
    outputs: [angle_library, plan]
    note: "Picks the problems and angles the founder will talk about."
  - name: "Founder ad script builder"
    skill: founder-ad-script-builder
    job: video
    from: "library"
    method: ["Start from the viewer's problem","Choose a claim you can prove","Write the script in that order, using only what the founder can say","Write two to four hooks for the same body"]
    inputs: [brand_brain, angle_library!]
    outputs: [script, hooks]
    note: "Writes founder scripts for the top angles from the matrix."
  - name: "Video hook scorer"
    skill: video-hook-scorer
    job: ads
    from: "library"
    method: ["Split each hook into its layers","Rate clarity, relevance and novelty","Check who the hook attracts","Rewrite the weak hooks"]
    inputs: [hooks, persona, script!]
    outputs: [audit_report, hooks]
    note: "Scores the hooks from the scripts and picks which to film."
  - name: "Video script bridge checker"
    skill: video-ad-bridge-checker
    job: ads
    from: "library"
    method: ["Map the sections of each script","Check when the product enters","Check the bridge to the offer at the end","Rewrite the weak spots"]
    inputs: [script]
    outputs: [audit_report, script]
    note: "Checks each script holds from the hook to the offer before anyone films it."
  - name: "Founder ad shoot planner"
    skill: founder-ad-shoot-planner
    job: video
    from: "library"
    method: ["Size the shoot to the hours you have","Sort the story parts and group the shot list","Write edit notes","Decide whether to run it as a partnership ad"]
    inputs: [script, hooks]
    outputs: [shot_list, plan]
    note: "Turns the approved scripts and hooks into one shoot list for the afternoon."
