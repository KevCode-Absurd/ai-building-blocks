id: spec-to-tested-service
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: turn-a-spec-into-a-tested-service-with-api-docs
  name: "Turn a spec into a tested service with API docs"
  summary: "Give it a written spec. Get a starter project, a working service, API tests and an API spec."
  when: "you have written what the service must do and want a first working version."
  job: build-software
  level: intermediate
steps:
  - name: "Start the project"
    skill: spec-to-starter-repo-builder
    job: ops
    from: "skill: spec-to-starter-repo-builder"
    method: ["Read the spec and say back what it means", "Choose the stack and list every file", "Generate the project with setup steps", "Check that it runs"]
    inputs: [brief]
    outputs: [codebase]
    note: "Turns the spec into a project folder with structure and setup."
  - name: "Build the service"
    skill: backend-builder
    job: ops
    from: "skill: backend-builder"
    method: ["Design the routes and the database", "Write the routes with validation and sign-in checks", "Add migrations that can be undone", "Load test the busiest route"]
    inputs: [brief, codebase]
    outputs: [code_change]
    note: "Fills in the service on the project from the step before."
  - name: "Test every route"
    skill: api-test-suite-builder
    job: ops
    from: "skill: api-test-suite-builder"
    method: ["Find every route in the code", "Write tests for sign-in, bad input and error codes", "Add paging and upload cases", "Run them"]
    inputs: [codebase]
    outputs: [test_report]
    note: "Finds the routes the build added and tests each one."
  - name: "Write the API spec"
    skill: api-spec-writer
    job: ops
    from: "skill: api-spec-writer"
    method: ["Pull the endpoints out of the code", "Add the sign-in scheme and data shapes", "Write examples for each response", "Output a complete OpenAPI file"]
    inputs: [codebase]
    outputs: [document]
    note: "Documents the routes the build made and the tests now cover."
