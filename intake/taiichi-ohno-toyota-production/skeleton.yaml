# Workflow skeleton for An Interview with Taiichi Ohno (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: taiichi-ohno-toyota-production
source:
  title: "An Interview with Taiichi Ohno"
  by: "Taiichi Ohno"
  kind: other
  rights: ideas-only
  year: 1984
minds: [taiichi-ohno]
workflow:
  slug: find-process-waste-and-the-cause-behind-it
  name: "Find process waste and the cause behind it"
  summary: "Paste your process step by step. Get the waste named, one change to try and the root cause behind it."
  when: "a process feels slow or keeps going wrong and you want the real cause."
  job: plan-strategy
  level: intermediate
steps:
  - name: "Process waste finder"
    skill: process-waste-finder
    job: ops
    from: "Taiichi Ohno, Wikipedia"
    method: ["Write each step with who does it, how long it takes and how long it waits", "Follow the whole time line from the customer's order to cash in hand", "Mark each step as something the customer would pay for or not", "Name the kind of waste: making too much, waiting, moving, needless steps, stock, extra motion, defects, unused talent", "Find the worst one, usually work made before the next step needs it", "List every step and who asked for it, by name", "Question each requirement, especially ones from smart people", "Delete every step you can, and expect to add back about a tenth"]
    inputs: [question, plan!]
    outputs: [audit_report, plan]
    note: "Each step marked value or waste, the worst waste named and one change to try"
  - name: "Root cause finder"
    skill: root-cause-finder
    job: analysis
    task: think-and-decide
    from: "Study notes on Five whys"
    method: ["State the problem as something seen, with the place and date", "Go and look at the real place or record, not a report of it", "Ask why it happened and write an answer you can check", "Ask why of that answer, and keep going until you reach a cause you can fix", "Try a second branch in case there is more than one cause", "State the problem in one plain sentence", "Ask why and answer from facts, not blame", "Repeat until you reach a process or training cause, usually about five times"]
    inputs: [question, plan!, feedback_notes!]
    outputs: [audit_report]
    note: "A chain of whys checked against facts, the fixable cause and a prevention check. Reads the plan from the step before"
