# Workflow skeleton for Design by Vitsoe, speech delivered in New York (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: ten-principles-of-good-design
source:
  title: "Design by Vitsoe, speech delivered in New York"
  by: "Dieter Rams"
  kind: talk
  rights: ideas-only
  year: 1976
minds: [dieter-rams]
workflow:
  slug: review-a-product-against-ten-principles-then-cut-extras
  name: "Review a product against ten principles, then cut extras"
  summary: "Describe your product or page. Get a ten-principle review and a keep, cut and merge plan for its features."
  when: "a product has grown cluttered and you want it simpler without losing its job."
  job: design-work
  level: intermediate
steps:
  - name: "Design ten-principles reviewer"
    skill: design-ten-principles-reviewer
    job: brand
    from: "Dieter Rams"
    method: ["Write what the product is for in one sentence and who uses it", "Score it on: innovative, useful, aesthetic, understandable, unobtrusive, honest, durable, consistent in detail, environment, as little design as possible", "List every part and its job", "Mark each part that serves no purpose", "Propose cuts and re-check the principles", "Write down what the design was meant to say in one line", "List every element on the piece, even small ones like page numbers", "State what the product is for and who holds it"]
    inputs: [question, web_page!, product_data!]
    outputs: [audit_report]
    note: "A review against ten principles of good design, with what to remove"
  - name: "Feature cutting planner"
    skill: feature-cutting-planner
    job: brand
    from: "Design by Vitsoe, speech delivered in New York, December 1976"
    method: ["State the one job the product does for the user", "List each feature and ask if it helps that job or helps people understand it", "Remove decoration and anything that exists only to impress", "Arrange what is left by a clear order so it shows how to use it", "Check consistency of size, colour and wording", "State the goal and who would want to own the result", "List every part, feature and step", "For each ask whether it is needed or whether another part already does that job"]
    inputs: [audit_report, question, product_data!]
    outputs: [plan]
    note: "What to keep, cut and merge so the product explains itself. Reads the audit report from the step before"
