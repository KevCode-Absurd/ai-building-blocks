# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md).
id: test-your-ideas-riskiest-risk-and-decide-what-next
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: test-your-ideas-riskiest-risk-and-decide-what-next
  name: "Test your idea's riskiest risk and decide what next"
  summary: "Give it your product idea. Get four risks scored, the smallest test for the worst one and a keep or change call."
  when: "you have a product idea, know it carries risk, and want to test the worst part cheaply before you build."
  job: test-an-idea
  level: intermediate
steps:
  - name: "Score the four risks"
    skill: product-idea-risk-checker
    job: research
    from: "skill: product-idea-risk-checker"
    method: ["Write the problem and the customer in plain words", "Score value, usability, feasibility and viability by how strong the evidence is", "Pick the riskiest of the four", "Write the cheapest test for it"]
    inputs: [question]
    outputs: [audit_report, plan]
    note: "Starts from your idea and names the risk with the weakest evidence"
  - name: "Shrink the test to the smallest one"
    skill: smallest-test-picker
    job: research
    from: "skill: smallest-test-picker"
    method: ["Name the action that counts as a yes", "Pick the cheapest form that can produce it", "Choose five to twenty people to try it on", "Cut everything the test does not need and set the fail line"]
    inputs: [plan]
    outputs: [plan]
    note: "Takes the test for the riskiest risk and shrinks it to something you can run this week"
  - pause: "Run the test with your five to twenty people and write down what each one did and said, including the ones who said no."
  - name: "Decide whether to keep going or change course"
    skill: pivot-or-persevere-decider
    job: strategy
    from: "skill: pivot-or-persevere-decider"
    method: ["Set the results beside the fail line you wrote first", "Count the signs that you are stuck", "Name the kind of change that fits what people said", "Write the new guess with its test and a review date"]
    inputs: [audit_report, plan!]
    outputs: [audit_report]
    note: "Reads the risk scores and the test plan, then judges your real results against them"
