# Workflow skeleton for Tested Advertising Methods, fifth edition (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: tested-ads-fix-an-ad
source:
  title: "Tested Advertising Methods, fifth edition"
  by: "John Caples, revised by Fred E. Hahn"
  kind: book
  rights: ideas-only
  year: 1997
minds: [john-caples]
workflow:
  slug: find-why-an-ad-is-not-pulling-and-fix-it
  name: "Find why an ad is not pulling and fix it"
  summary: "Give it an ad that gets no replies. Get likely causes in order, a fixed version and a test to prove it."
  when: "an ad, email or page is seen but not answered and you want to know what to change first."
  job: check-ads
  level: intermediate
steps:
  - name: Find the likely cause
    skill: ad-pull-diagnoser
    job: analysis
    task: check-ads
    from: "Chapters 2, 4, 6, 11 and 13, why ads fail"
    method: ["Check first that the ad is keyed and the reply is counted", "Read the headline alone and ask what a stranger would gain", "Check the appeal, the believability and the offer", "Check where, when and how big the ad ran", "Rank the causes by how likely and how cheap to fix"]
    inputs: [ad_copy, performance_sheet!, offer!]
    outputs: [audit_report]
    note: "Causes in order, starting with the headline and the appeal."
  - name: Compare your winners with your losers
    skill: winners-and-losers-ad-comparer
    job: analysis
    task: check-ads
    from: "Chapter 6, laying the ads out in order of merit"
    method: ["Mark each ad with its replies or sales and lay them out best to worst", "List headline, appeal, picture, copy length, offer, size, medium and position for each", "Find what the winners share that the losers lack", "Write the pattern down as a rule to test"]
    inputs: [performance_sheet, audit_report!, ad_copy!]
    outputs: [lessons_register]
    note: "What your own winners share, so the fix copies a pattern and not a hunch."
  - name: Write the fixed ad
    skill: reply-getting-fix-writer
    job: copy
    task: write-ad-copy
    from: "Chapter 13, thirty-two ways to get more inquiries, and chapters 4 and 11"
    method: ["Move the winning appeal into the headline", "Put the offer in the headline or subhead and describe it so people want it", "Make the reply easy: a coupon, a phone number, a plain next step", "Replace adjectives with specific facts and figures"]
    inputs: [audit_report, lessons_register!, ad_copy, offer!]
    outputs: [copy_draft]
    note: "A fixed version that changes only what the causes called for."
  - name: Check the fixed ad is ready
    skill: sales-copy-readiness-checker
    job: copy
    task: check-ads
    from: "Chapters 4 and 11, the headline rules and copy that sells"
    method: ["Check the opening names the reader and their gain", "Check every claim is specific and believable", "Check the next step is clear", "Give a ship, fix or rewrite call"]
    inputs: [copy_draft, brief!]
    outputs: [audit_report]
    note: "A last pass before the fixed ad goes out."
  - name: Plan the test of old against new
    skill: split-run-test-planner
    job: research
    task: plan-ad-tests
    from: "Chapter 18, split-run copy testing"
    method: ["Run the old ad and the fixed ad at the same time", "Key each one", "Set the reply count and winner rule before launch", "Change only what the diagnosis said"]
    inputs: [copy_draft, ad_copy!, offer!]
    outputs: [plan]
    note: "Proves the fix beats the old ad instead of assuming it does."
