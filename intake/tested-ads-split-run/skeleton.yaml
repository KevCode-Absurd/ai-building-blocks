# Workflow skeleton for Tested Advertising Methods, fifth edition (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: tested-ads-split-run
source:
  title: "Tested Advertising Methods, fifth edition"
  by: "John Caples, revised by Fred E. Hahn"
  kind: book
  rights: ideas-only
  year: 1997
minds: [john-caples, claude-hopkins]
workflow:
  slug: test-two-ads-head-to-head-and-read-which-won
  name: "Test two ads head to head and read the winner"
  summary: "Give it two ads. Get a fair split-run test, a reply offer that brings enough replies and a read of the result."
  when: "you have two ads, emails or pages and want to know which sells more before you put money behind one."
  job: plan-ad-tests
  level: intermediate
steps:
  - name: Plan a fair split-run test
    skill: split-run-test-planner
    job: research
    task: plan-ad-tests
    from: "Chapter 1 and chapter 18, key numbers and split-run copy testing"
    method: ["Change one thing between the two versions and keep everything else equal", "Show both at the same time to matched halves of the same audience", "Key each version so every reply traces back", "Decide in advance how many replies are enough and what counts as a win"]
    inputs: [ad_copy, offer!, performance_sheet!]
    outputs: [plan]
    note: "One difference, same time, same audience, a key on each, a rule set before launch."
  - name: Set a reply offer that brings enough replies
    skill: test-reply-offer-planner
    job: research
    task: plan-ad-tests
    from: "Chapter 13 and chapter 18, hidden offers and thirty-two ways to get inquiries"
    method: ["Pick a small free or low-cost offer the same in both versions", "Check that it will bring about a hundred replies per version, and sweeten it if not", "Screen out people who only want something free", "Put the offer in the same place and size in both"]
    inputs: [plan, offer!, product_data!]
    outputs: [offer]
    note: "A reply offer that is identical in both versions and big enough to count."
  - pause: "Run both versions at the same time and count the replies by key."
  - name: Read the result
    skill: split-run-result-reader
    job: analysis
    task: read-ad-results
    from: "Chapter 18, reading split-run results and checking against sales"
    method: ["Count replies per version and work out how much better the leader is as a percentage", "Check there are enough replies and that nothing but the one change differed", "Follow replies through to sales where you can", "Call it: keep, rerun, or stop, and write down what you learned"]
    inputs: [performance_sheet, plan!]
    outputs: [audit_report, lessons_register]
    note: "A plain call on the winner and a record of what it taught."
