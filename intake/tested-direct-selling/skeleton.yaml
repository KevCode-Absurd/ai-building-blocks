# Workflow skeleton for Tested Direct Selling (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: tested-direct-selling
source:
  title: "Tested Direct Selling"
  by: "Elmer Wheeler"
  kind: book
  rights: ideas-only
  year: 1942
minds: [elmer-wheeler, david-ogilvy]
workflow:
  slug: plan-a-sales-conversation-from-first-line-to-close
  name: "Plan a sales conversation from first line to close"
  summary: "Give it your product and buyer. Get the lead argument, a ten-second opener, answers to doubts and a close."
  when: "you sell face to face or on calls and want the conversation planned."
  job: sell-and-negotiate
  level: intermediate
steps:
  - name: "Buyer-matched argument planner"
    skill: buyer-matched-argument-planner
    job: ops
    from: "The Unpublished David Ogilvy, publisher sample with the 1935 Aga cooker sales manual"
    method: ["Write down every selling argument you have, one line each", "Research the prospect before you call: home, work, interests", "Say frankly and briefly why you have come, with no false pretext", "Match the lead argument to the listener, such as cost to a money person and ease to the person who does the work", "Let the buyer talk and follow their interest, and never give the same talk to a bishop and a trapeze artist", "Keep the call going only while you are not boring them, and leave gracefully when they close it"]
    inputs: [product_data, persona!]
    outputs: [angle_library]
    note: "Which argument leads for each and what to ask first"
  - name: "Ten-second opener writer"
    skill: ten-second-opener-writer
    job: ops
    from: "Tested Direct Selling, 1942"
    method: ["Pick something you can say that is true and that you are keen on", "Find the sizzle: what the buyer will see or get, not how the product is made", "Write a short question that starts with Did you know, Have you heard or Would you like", "Cut it to the first ten words and say it out loud", "Write two spare openers for a different mood or setting", "Add a light, sincere compliment or a free item if it fits, never a trick or a false reason to be there", "Try them on real buyers and keep the one that gets you in"]
    inputs: [angle_library, persona!, offer!, product_data!]
    outputs: [hooks]
    note: "A ten-second opener and two spares, as short honest questions. Reads the angle library from the step before"
  - name: "Objection answer sheet writer"
    skill: objection-answer-sheet-writer
    job: ops
    from: "Tested Direct Selling, 1942"
    method: ["Sort each doubt: the claim is not believed, the product has no use for me, or something cheaper is as good", "Never slide past a doubt; restate it as a question the buyer will answer yes to", "Agree with what is true, including a past weakness, before giving the fact", "Bring proof that fits: a demonstration, a number or a testimonial from someone like them", "Use the doubt as a reason to measure, show or try", "State your plan up front: history, then doubts, then conclusion", "Show who held your view before and what happened to them", "List every objection people raise"]
    inputs: [angle_library!, objection_map!, voc_reviews!, product_data!]
    outputs: [objection_map]
    note: "An answer sheet that agrees where true, restates each doubt as a yes-question and brings proof. Reads the angle library from the step before"
  - name: "Ask-which closing planner"
    skill: ask-which-closing-planner
    job: ops
    from: "Tested Direct Selling, 1942"
    method: ["List the fair choices you can offer: model, colour, size, delivery day and payment", "Turn each yes-or-no ask into a which-or-when question", "Start with small agreements, then assume the rest and fill in the order as you go", "Add one or two leading questions you expect a yes to", "List the ready-to-buy signals, such as questions on price or terms, and plan to stop and ask when you hear one", "For a buyer on the fence, pick the better option, say why and ask", "Plan to ask more than once, without pressure"]
    inputs: [offer, objection_map!, question!]
    outputs: [copy_draft]
    note: "Closing questions that offer two ways to say yes. Reads the objection map from the step before"
