# Workflow skeleton for The Art of War (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: the-art-of-war
source:
  title: "The Art of War"
  by: "Sun Tzu"
  kind: book
  rights: public-domain
minds: [sun-tzu]
workflow:
  slug: size-up-a-rival-and-decide-whether-to-go
  name: "Size up a rival and decide whether to go"
  summary: "Describe you and a rival. Get a five-factor matchup and a go or no-go check on your plan."
  when: "you are about to take on a rival or launch a move against one."
  job: study-competitors
  level: beginner
steps:
  - name: "Rival matchup scorer"
    skill: rival-matchup-scorer
    job: research
    from: "The Art of War, Lionel Giles translation"
    method: ["Score both sides on the people behind the leader, timing, ground, leadership and discipline", "Ask who has the better leader, training and fair rewards", "Rank the options: break their plan, cut their allies, beat them head on, or avoid", "Find where they are thin or unready", "Price the cost and length of a long contest", "Pick a position you can defend first, then the opening to wait for"]
    inputs: [competitor_set!, question]
    outputs: [audit_report]
    note: "A side-by-side on the five factors, with where to fight and where to avoid"
  - name: "Go or no-go launch checker"
    skill: go-or-no-go-launch-checker
    job: ops
    task: plan-strategy
    from: "The Art of War, Lionel Giles translation"
    method: ["Check size of the task against your strength", "Check that the team under the leader is not stronger than the officers", "Check for angry or resentful people ready to act alone", "Check that orders and authority are clear", "Check that you can judge the other side's strength", "Check three things: your team is ready, the opponent is open, the ground allows it"]
    inputs: [audit_report, plan]
    outputs: [audit_report]
    note: "A go or no-go against the book's six faults and three halfway checks. Reads the audit report from the step before"
