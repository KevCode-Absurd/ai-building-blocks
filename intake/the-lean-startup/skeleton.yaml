# Workflow skeleton for The Lean Startup (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: the-lean-startup
source:
  title: "The Lean Startup"
  by: "Eric Ries"
  kind: blog
  rights: ideas-only
  year: 2008
minds: [eric-ries]
workflow:
  slug: test-your-riskiest-guess-and-measure-what-counts
  name: "Test your riskiest guess and measure what counts"
  summary: "Give it your product idea. Get the riskiest guess, the smallest test, honest metrics and the root cause behind a miss."
  when: "you have a product idea and want proof before you build more."
  job: test-an-idea
  level: intermediate
steps:
  - name: "MVP experiment planner"
    skill: mvp-experiment-planner
    job: research
    from: "The lean startup"
    method: ["Write the guesses the idea depends on", "Pick the riskiest one", "Design the smallest product or ad test that can teach you about it", "Set the numbers that would count as a pass before you run it", "Run it with real customers, one group at a time", "Read what customers did, not what they said", "Decide to pivot or persevere"]
    inputs: [plan!, question]
    outputs: [plan]
    note: "The riskiest guess, the smallest test and a pivot or persevere rule"
  - pause: "Run the test and collect the numbers it asked for."
  - name: "Vanity metric fixer"
    skill: vanity-metric-fixer
    job: analysis
    task: think-and-decide
    from: "Why vanity metrics are dangerous"
    method: ["List the numbers you report each week", "Mark totals, hits and sign-ups that only grow", "Replace each with a per-customer or per-group rate", "Split results by customer group and by release", "Note what change could have caused each move", "State the goal in one line with a date", "Pick the one number that must change", "Check the data behind it: who collects it, how often, and what could be missing"]
    inputs: [performance_sheet, plan!, question!]
    outputs: [plan]
    note: "Which are vanity, and per-customer numbers that show cause"
  - name: "Root cause finder"
    skill: root-cause-finder
    job: analysis
    task: think-and-decide
    from: "Five Whys"
    method: ["State the problem as something seen, with the place and date", "Go and look at the real place or record, not a report of it", "Ask why it happened and write an answer you can check", "Ask why of that answer, and keep going until you reach a cause you can fix", "Try a second branch in case there is more than one cause", "State the problem in one plain sentence", "Ask why and answer from facts, not blame", "Repeat until you reach a process or training cause, usually about five times"]
    inputs: [question, plan!, feedback_notes!]
    outputs: [audit_report]
    note: "A chain of whys checked against facts, the fixable cause and a prevention check. Reads the plan from the step before"
