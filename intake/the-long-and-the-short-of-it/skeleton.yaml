# Workflow skeleton for The Long and the Short of It (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: the-long-and-the-short-of-it
source:
  title: "The Long and the Short of It"
  by: "Les Binet and Peter Field"
  kind: paper
  rights: ideas-only
  year: 2013
minds: [les-binet]
workflow:
  slug: split-your-marketing-budget-between-brand-and-sales
  name: "Split your marketing budget between brand and sales"
  summary: "Paste your spend and the numbers you track. Get a balanced scorecard and a brand versus sales split."
  when: "you spend on marketing and want to know how much should build the brand and how much should drive sales."
  job: plan-strategy
  level: advanced
steps:
  - name: "Marketing scorecard builder"
    skill: marketing-scorecard-builder
    job: analysis
    task: read-ad-results
    from: "The long and the short of it: 10 key principles of success, Binet and Field summary presentation"
    method: ["List the metrics you track now and sort them into short term and long term", "Add price sensitivity over three years, share of voice minus market share, and brand responses as long-term measures", "Pair each metric with the question it answers and its time lag", "Flag any metric that is likely to mislead alone, such as click-based sales", "Lay out the scorecard with long-term business results at the top and short-term response at the base", "Set a review rhythm that does not judge a long-term measure on a short-term window"]
    inputs: [performance_sheet, brand_brain!]
    outputs: [audit_report]
    note: "A balanced scorecard with short-term and long-term measures and what each tells you"
  - name: "Brand and sales budget splitter"
    skill: brand-and-sales-budget-splitter
    job: ops
    from: "The long and the short of it: 10 key principles of success, Binet and Field summary presentation"
    method: ["Sort each channel as brand building or sales activation", "Work out the current split and compare it with a starting point near 60 brand and 40 activation", "Compare share of voice with share of market to see if the brand is set to grow or shrink", "Check whether messaging is mostly rational or has an emotional side that builds the brand over years", "Check that reach is broad enough and not limited to existing customers or ready buyers", "Propose the smallest shift to test, and name what the split depends on for this brand"]
    inputs: [audit_report, performance_sheet!, brand_brain!, competitor_set!]
    outputs: [plan]
    note: "A brand versus sales split, a share-of-voice check and what to shift. Reads the audit report from the step before"
