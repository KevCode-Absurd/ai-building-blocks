# Workflow skeleton chained from existing skills in the AI Blocks library (docs/INTAKE.md).
id: tighten-a-video-ad-script-before-you-film-it
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: tighten-a-video-ad-script-before-you-film-it
  name: "Tighten a video ad script before you film it"
  summary: "Give it your video ad script. Get a tighter script, a sound-off check, a viewer test and a ship call."
  when: "you have a video ad script and want it right before you pay to shoot it."
  job: check-ads
  level: intermediate
steps:
  - name: "Check the bridge and the pacing"
    skill: video-ad-bridge-checker
    job: ads
    from: "library"
    method: ["Mark every line as hook, bridge, body, proof or call to action", "Plot how aware the viewer is of being sold to", "Check when the product enters and why", "Put benefit before feature", "Check pacing and proof, then write the tighter script"]
    inputs: [script, persona!, product_data!]
    outputs: [audit_report, script]
    note: "Starts the chain: scores the script and returns a tighter version."
  - name: "Check it sells with the sound off"
    skill: sound-off-commercial-checker
    job: analysis
    from: "library"
    method: ["Strip the sound and list what is seen", "Write what a silent viewer learns", "Check the main claim shows on screen", "Check the first shot, the product and the brand", "Pass or fail with fixes"]
    inputs: [script]
    outputs: [audit_report]
    note: "Reads the tighter script from the step before and checks the picture alone carries the claim."
  - pause: "Fix the script with both reports. Show it to ten people, ask each what the ad said, and write their answers down."
  - name: "Count what viewers heard"
    skill: ad-distraction-checker
    job: analysis
    from: "library"
    method: ["Write the one claim before reading any answer", "Score each viewer's answer", "Count the playback", "Name what took attention away", "Match words to pictures and list cuts"]
    inputs: [script, copy_draft!]
    outputs: [audit_report]
    note: "Compares what the ten viewers said with the one claim in the fixed script."
  - name: "Run the stop-ship check"
    skill: pre-launch-ad-checker
    job: ads
    from: "library"
    method: ["List the ad's format and platform rules", "Check safe zones, claims and brand details", "Run the platform policy check", "Give each fix, a verdict and a score"]
    inputs: [script, brand_brain!]
    outputs: [audit_report]
    note: "Runs the last check on the script after the fixes from the earlier reports."
