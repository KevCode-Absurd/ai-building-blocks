# Workflow skeleton chaining library skills (docs/INTAKE.md). Our words.
id: tune-a-prompt-with-real-tests-then-ship-it-with-versions
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: tune-a-prompt-with-real-tests-then-ship-it-with-versions
  name: "Tune a prompt with real tests, then keep versions"
  summary: "Give it a rough prompt. Get a clear version, scores against your test cases and a safe way to change it later."
  when: "a prompt does real work and you want proof a change helps before it goes live."
  job: set-up-ai
  level: intermediate
steps:
  - name: "Rebuild the rough prompt"
    skill: prompt-improver
    job: ops
    from: "skill: prompt-improver"
    method: ["Work out what the prompt is really for", "Pick a fitting structure", "Add the missing context, format and limits", "Return one clean prompt"]
    inputs: [question]
    outputs: [brief]
    note: "Turns the rough prompt into a clear, structured one."
  - pause: "Write 10 to 20 test cases for the prompt, each with the answer you would accept. Include two or three where it failed before."
  - name: "Score each version on the tests"
    skill: prompt-tester-and-tuner
    job: ops
    from: "skill: prompt-tester-and-tuner"
    method: ["Take a baseline score on your test cases", "Change one thing at a time", "Score each version against the baseline", "Keep only changes the scores support"]
    inputs: [question]
    outputs: [audit_report]
    note: "Runs the rebuilt prompt and your test cases and scores every version."
  - pause: "Pick the version with the best scores and save it as version 1 in a file, with its test cases beside it."
  - name: "Set up versions and safe changes"
    skill: prompt-change-manager
    job: ops
    from: "skill: prompt-change-manager"
    method: ["Set where prompts are stored and how versions are named", "Turn your test cases into a check that runs before each change", "Plan how to try a new version on part of the work", "Write the steps to roll back"]
    inputs: [question]
    outputs: [plan]
    note: "Takes the winning version and its test cases and sets rules for changing it later."
