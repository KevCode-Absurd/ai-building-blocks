# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md).
id: turn-a-flaw-first-ad-into-a-checked-picture-ad
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: turn-a-flaw-first-ad-into-a-checked-picture-ad
  name: "Turn a flaw-first ad into a checked picture ad"
  summary: "Give it your product and its real weaknesses. Get a flaw-first ad, the right picture for it and a launch check."
  when: "your product has a flaw buyers already see and you want a picture ad that names it and turns it."
  job: make-image-ads
  level: intermediate
steps:
  - name: "Write the flaw-first ad"
    skill: flaw-first-ad-writer
    job: copy
    from: "skill: flaw-first-ad-writer"
    method: ["List the true weaknesses", "Pick the one buyers already see", "Say what it shows about the product", "Write the flat claim, then the plain version", "Check the line holds in real use"]
    inputs: [brief, product_data, voc_reviews!, competitor_set!]
    outputs: [ad_copy, hooks]
    note: "Starts from your facts and what buyers say."
  - name: "Pick the picture that fits the story"
    skill: image-style-picker-for-story-ads
    job: image
    from: "skill: image-style-picker-for-story-ads"
    method: ["Quote the moment the old way stopped working", "Ask where it shows: a room, a thing, the body, words or a fact", "Break ties by closeness to the story and fewest words", "Add a runner-up from a different kind of evidence", "Write the caption line"]
    inputs: [ad_copy, persona!, brand_brain!]
    outputs: [image_prompt]
    note: "Reads the ad from the step before and picks a picture that shows the same flaw."
  - name: "Check the ad and picture together"
    skill: pre-launch-ad-checker
    job: ads
    from: "skill: pre-launch-ad-checker"
    method: ["Check shape, size and safe zones", "Look at the first second with the sound off", "Check every claim against your proof", "Check each version changes one nameable thing", "Give a verdict"]
    inputs: [ad_copy, image_prompt, brand_brain!]
    outputs: [audit_report]
    note: "Reads the words and the picture prompt together."
  - pause: "Make the picture for the first idea and the runner-up in your image tool, then run both as a small test."
