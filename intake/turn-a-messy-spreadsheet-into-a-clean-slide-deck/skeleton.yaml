# Workflow skeleton built from existing AI Blocks library skills (docs/INTAKE.md).
id: turn-a-messy-spreadsheet-into-a-clean-slide-deck
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: turn-a-messy-spreadsheet-into-a-clean-slide-deck
  name: "Turn a messy spreadsheet into a clean slide deck"
  summary: "Give it a messy data file. Get it cleaned and checked, then a written story and slides built from it."
  when: "you have raw data and a meeting to present it in."
  job: work-with-files
  level: intermediate
steps:
  - name: "Clean the data"
    skill: data-cleaner
    job: ops
    from: library
    method: ["Profile the file: blanks, repeats and mixed types per column", "Fill or flag missing values, column by column", "Remove repeats and settle conflicts", "Fix types and formats and treat outliers"]
    inputs: [spreadsheet]
    outputs: [spreadsheet]
    note: "Starts from your raw file. Makes a clean copy and keeps the original."
  - name: "Check the cleaned data"
    skill: data-quality-auditor
    job: ops
    from: library
    method: ["Profile the cleaned data: size, types and completeness", "Classify any gaps that remain", "Flag outliers and logical clashes between columns", "Give a quality score and list what to fix first"]
    inputs: [spreadsheet]
    outputs: [audit_report]
    note: "Reads the clean copy and tells you what is still not safe to present."
  - name: "Write the story the numbers tell"
    skill: data-story-writer
    job: ops
    from: library
    method: ["Name the audience and the decision they must make", "Find the one point the data proves", "Order it as context, problem, proof and next step", "Check every figure against the cleaned data"]
    inputs: [spreadsheet]
    outputs: [document]
    note: "Reads the cleaned file, and leaves out anything the quality check marked as unsafe."
  - name: "Build the slide deck"
    skill: presentation-builder
    job: ops
    from: library
    method: ["Take the story as the outline and name the audience", "Pick a format: Marp, reveal.js or PowerPoint", "Give each slide one point and add speaker notes", "Put the proof figures on the slide that makes the point"]
    inputs: [document, brief!]
    outputs: [slide_deck]
    note: "Turns the written story into slides."
