# Workflow skeleton chaining AI Blocks library skills (docs/INTAKE.md).
id: turn-a-raw-dataset-into-a-checked-brief-of-top-insights
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: turn-a-raw-dataset-into-a-checked-brief-of-top-insights
  name: "Turn a dataset into a checked brief of top insights"
  summary: "Give it a data file and a question. Get a checked analysis and a ranked brief of insights with actions."
  when: "you have a data file and a question, and need findings you can trust and act on."
  job: track-numbers
  level: intermediate
steps:
  - name: "Dataset profiler"
    skill: dataset-profiler
    job: ops
    from: "skill: dataset-profiler"
    method: ["Find the shape, the grain and the key of the table", "Sort each column into id, group, number, date or text", "Count blanks, repeats and odd values per column", "Name the columns worth analyzing and the ones to fix first"]
    inputs: [spreadsheet]
    outputs: [audit_report]
    note: "Shows what is in the file and what is broken before anyone draws a conclusion from it."
  - pause: "Fix or drop the columns the profile flagged. Write the one question you want the data to answer."
  - name: "Data analyst"
    skill: data-analyst
    job: ops
    from: "skill: data-analyst"
    method: ["Load the cleaned data and confirm it matches the profile", "Work out the summary numbers for each column", "Look for trends and groups that differ", "Test the relationships and the differences that matter", "Flag outliers and say whether they are errors", "Write the findings with the numbers and the limits"]
    inputs: [spreadsheet, question]
    outputs: [document]
    note: "Answers your question from the cleaned file, using what the profile said to trust."
  - name: "Analysis checker"
    skill: analysis-checker
    job: ops
    from: "skill: analysis-checker"
    method: ["Check the question, the population and the time range", "Run a pre-share checklist on the data and the sums", "Look for join errors, survivorship and shifting bases", "Recalculate a few key numbers by hand", "Rate how far the analysis can be trusted"]
    inputs: [document]
    outputs: [audit_report]
    note: "Reviews the analysis from the step before and lists what to fix before it is shared."
  - name: "Insight brief writer"
    skill: insight-brief-writer
    job: ops
    from: "skill: insight-brief-writer"
    method: ["List every finding as a plain fact", "Turn each into so what, why and now what", "Put a size on the business impact of each", "Score by impact, confidence and ease of acting", "Lead with the top three to five and note any conflicts"]
    inputs: [document, brief!]
    outputs: [document]
    note: "Turns the checked analysis into a short ranked brief, and lets the checker's doubts lower each insight's confidence."
