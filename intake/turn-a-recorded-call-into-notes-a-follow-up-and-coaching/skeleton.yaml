# Workflow skeleton chaining library skills (docs/INTAKE.md).
id: turn-a-recorded-call-into-notes-a-follow-up-and-coaching
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: turn-a-recorded-call-into-notes-a-follow-up-and-coaching
  name: "Turn a recorded call into notes, a follow-up and coaching"
  summary: "Give it a call recording. Get notes with actions, a follow-up email draft and coaching on how the call went."
  when: "you finish a call and the notes, the follow-up and the lessons all wait on the recording."
  job: work-with-audio
  level: beginner
steps:
  - name: "Audio meeting notes writer"
    skill: audio-meeting-notes-writer
    job: ops
    from: "skill: audio-meeting-notes-writer"
    method: ["Transcribe the recording", "Label each speaker", "Write a short summary", "List decisions and action items"]
    inputs: [audio]
    outputs: [transcript, meeting_notes]
    note: "Turns the recording into a transcript and notes."
  - name: "Call follow-up drafter"
    skill: call-follow-up-drafter
    job: ops
    from: "skill: call-follow-up-drafter"
    method: ["Read the transcript for what was agreed", "Draft a follow-up email", "Write a team summary", "List updates to approve before anything is sent"]
    inputs: [transcript]
    outputs: [copy_draft, meeting_notes]
    note: "Drafts the follow-up from the transcript. Nothing is sent until you approve."
  - pause: "Check the draft, fix any wrong detail and send it yourself."
  - name: "Meeting coaching analyst"
    skill: meeting-coaching-analyst
    job: ops
    from: "skill: meeting-coaching-analyst"
    method: ["Count who spoke and for how long", "Find habits such as interrupting or long answers", "Back each point with a quote", "Give a few things to change next call"]
    inputs: [transcript]
    outputs: [feedback_notes]
    note: "Coaches you on how the call went. Reads the transcript from the first step."
