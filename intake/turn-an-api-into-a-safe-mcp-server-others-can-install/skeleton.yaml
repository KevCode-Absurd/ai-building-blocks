# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Skills run in order, each reading what the one before made.
id: turn-an-api-into-a-safe-mcp-server-others-can-install
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: turn-an-api-into-a-safe-mcp-server-others-can-install
  name: "Turn an API into a safe, installable MCP server"
  summary: "Give it an API spec. Get an MCP server with sign-in, a security check and a published package others can add."
  when: "you want your AI, or other people's, to use an API through MCP without opening a hole."
  job: connect-tools
  level: advanced
steps:
  - name: "API to MCP server builder"
    skill: api-to-mcp-server-builder
    job: ops
    from: "library"
    method: ["Read the API spec and pick the calls to expose", "Generate the server in Python or TypeScript", "Check each tool definition and its schema", "Pick how it will run"]
    inputs: [codebase]
    outputs: [tool_connection]
    note: "Builds the first version of the server from your API spec."
  - pause: "Save the generated server in your repo and run it once to confirm it starts."
  - name: "MCP server sign-in builder"
    skill: mcp-server-sign-in-builder
    job: ops
    from: "library"
    method: ["Pick the sign-in model for how people connect", "Publish the sign-in details clients look for", "Check every token on every request", "Test the flow from first connect to a working call"]
    inputs: [codebase]
    outputs: [code_change]
    note: "Adds OAuth sign-in to the server you saved."
  - pause: "Commit the sign-in code and run the server again so the security check reads the final code."
  - name: "MCP server hardener"
    skill: mcp-server-hardener
    job: ops
    from: "library"
    method: ["Map the threats to the server", "Check the connection, sign-in and tool permissions", "Check logging and what each tool may touch", "Write a checklist of fixes, riskiest first"]
    inputs: [codebase]
    outputs: [security_report]
    note: "Reviews the server with its sign-in in place and lists what to fix before anyone installs it."
  - pause: "Apply every fix marked must-fix, then run the server once more."
  - name: "MCP server publisher"
    skill: mcp-server-publisher
    job: ops
    from: "library"
    method: ["Choose remote hosting, a local package or both", "Make the remote service stateless with health checks", "Add per-tool logging", "Package it, publish it and plan how to change versions without breaking clients"]
    inputs: [codebase]
    outputs: [deploy_url]
    note: "Hosts and packages the hardened server so others can install it."
