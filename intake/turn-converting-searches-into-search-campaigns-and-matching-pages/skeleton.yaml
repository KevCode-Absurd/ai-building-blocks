# Workflow skeleton built from the AI Blocks library (docs/INTAKE.md). Skills run in order, each reading what the one before made.
id: turn-converting-searches-into-search-campaigns-and-matching-pages
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: turn-converting-searches-into-search-campaigns-and-matching-pages
  name: "Turn converting searches into Search campaigns and matching pages"
  summary: "Give it your Google search terms and products. Get winners and negatives sorted, new Search campaigns with ads, and a page plan."
  when: "your Shopping data shows what people search and buy, and you want new customers from Search."
  job: run-google-ads
  level: intermediate
steps:
  - name: "Search term sorter"
    skill: search-term-sorter
    job: analysis
    from: "library"
    method: ["Tag every search term by intent and result", "Pick winners and send each to its campaign", "Build negatives at the right level", "Flag brand terms in cold campaigns"]
    inputs: [performance_sheet, brand_brain!]
    outputs: [audit_report, plan]
    note: "Sorts the terms that already convert from the waste, ready to build on."
  - pause: "Add the negatives in Google Ads and save the winning terms in a sheet with your products and offer."
  - name: "Non-brand Search campaign builder"
    skill: non-brand-search-campaign-builder
    job: ads
    from: "library"
    method: ["Group seed keywords by intent", "Mine the converting terms into ad groups", "Pick match types", "Write headlines and descriptions"]
    inputs: [product_data, performance_sheet!, offer!]
    outputs: [plan, ad_copy]
    note: "Builds Search campaigns from the winning terms and writes the ads."
  - name: "Page type and layout planner"
    skill: page-type-and-layout-planner
    job: page
    from: "library"
    method: ["Route each ad to the right page type", "Write the offer before the design", "Set the section order for the traffic", "Match the page thread to the ad"]
    inputs: [ad_copy, persona!, product_data!, performance_sheet!]
    outputs: [page_layout_spec, plan]
    note: "Takes the ad copy and plans the page each ad group should land on, so the promise matches."
