# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: turn-your-lessons-into-funny-stories-and-a-short-talk
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: turn-your-lessons-into-funny-stories-and-a-short-talk
  name: "Turn your lessons into funny stories and a short talk"
  summary: "Give it two or three lessons you have learned. Get a funny story for each and a short talk built on them."
  when: "you have to speak for five to ten minutes and want people to remember the point."
  job: speak-and-persuade
  level: beginner
steps:
  - name: "Teaching story writer"
    skill: teaching-story-writer
    job: copy
    from: "skill: teaching-story-writer"
    method: ["State the lesson in one plain sentence", "Pick a small everyday scene with one comic turn", "Speak to the reader after the turn and close on the consequence"]
    inputs: [question]
    outputs: [copy_draft]
    note: "Writes a one-minute funny story that carries one lesson."
  - name: "Single-effect draft checker"
    skill: single-effect-draft-checker
    job: analysis
    from: "skill: single-effect-draft-checker"
    method: ["State the one feeling the story should leave", "Mark each paragraph as serving, neutral or competing", "Find where attention slips and list the cuts"]
    inputs: [copy_draft, question]
    outputs: [audit_report]
    note: "Reads the story from the step before and checks every line serves the one point."
  - pause: "Fix the lines marked competing. Then repeat the first two steps for your other lessons, so you have two or three stories."
  - name: "Lesson talk writer"
    skill: lesson-talk-writer
    job: copy
    from: "skill: lesson-talk-writer"
    method: ["Pick the two or three lessons you trust most", "Tie each lesson to one true story and say it in one sentence", "Add an outside voice, a question for the room and an opening joke at your own cost"]
    inputs: [question, copy_draft!, brand_brain!]
    outputs: [script]
    note: "Builds the talk on the stories you just checked, each ending on a next step for the room."
