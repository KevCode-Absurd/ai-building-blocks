# Workflow skeleton for What the Errors Tell Us (docs/INTAKE.md). Our words; the source stays in mind-sources/ (local only).
id: what-the-errors-tell-us
source:
  title: "What the Errors Tell Us"
  by: "Margaret Hamilton"
  kind: paper
  rights: ideas-only
  year: 2018
minds: [margaret-hamilton]
workflow:
  slug: check-a-launch-for-weak-joints-and-plan-its-recovery
  name: "Check a launch for weak joints and plan its recovery"
  summary: "Describe your launch or release. Get the weak joints, what wins when things pile up, and a recovery plan."
  when: "a release or migration could fail and you want it to recover without a scramble."
  job: build-software
  level: advanced
steps:
  - name: "Launch readiness seam checker"
    skill: launch-readiness-seam-checker
    job: ops
    from: "What the Errors Tell Us, IEEE Software, Sept/Oct 2018"
    method: ["List every part of the system including hardware, people and plans", "Mark each place two parts meet and what passes between them: data, timing, priority", "Give every job a unique priority so order is never left to chance", "Decide what the system does when it is overloaded and what it must never drop", "Require a written reason and an approval for every change", "Name one person to read the final package by eye for seam errors", "Run the whole launch start to finish in simulation with a person in the loop"]
    inputs: [question]
    outputs: [audit_report]
    note: "The joins between parts, what wins when things pile up, and a run-through plan"
  - name: "Error warning and recovery designer"
    skill: error-warning-and-recovery-designer
    job: ops
    from: "What the Errors Tell Us, IEEE Software, Sept/Oct 2018"
    method: ["List the mistakes people say cannot happen and treat each as likely under pressure", "Decide how the system detects each error while running", "Design a safe restart point it can return to and keep the key jobs going", "Write the alarm so it interrupts normal work and names the decision: go or no-go", "Tell the operator and the control room the same thing", "Add a plain warning to the docs where blocking is refused", "Review each error afterwards by kind, and change the method that let it in"]
    inputs: [audit_report, question]
    outputs: [plan]
    note: "What the alarm says, what the person decides and how the system recovers. Reads the audit report from the step before"
