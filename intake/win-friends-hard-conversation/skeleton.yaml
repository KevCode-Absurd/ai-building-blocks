# Workflow skeleton for How to Win Friends and Influence People, Part Three (docs/INTAKE.md). Our words; the book stays in mind-sources/ (local only).
id: win-friends-hard-conversation
source:
  title: "How to Win Friends and Influence People (1981 revised edition)"
  by: "Dale Carnegie"
  kind: book
  rights: ideas-only
  year: 1981
minds: [dale-carnegie, benjamin-franklin, socrates]
workflow:
  slug: plan-a-hard-talk-so-they-end-up-agreeing
  name: "Plan a hard talk so they end up agreeing"
  summary: "Describe the talk you dread. Get their side, a plan, easy yeses in order and lines for pushback."
  when: "you must ask for something, change a mind or settle a dispute, and you want to keep the relationship."
  job: sell-and-negotiate
  level: intermediate
steps:
  - name: See it from their side
    skill: other-person-view-mapper
    job: research
    task: sell-and-negotiate
    from: "Part One chapters 2 and 3, Part Three chapter 8"
    method: ["Write what they want in the matter, in their words, and mark each line known or guess", "Give the honest reason they act as they do, without judging it", "List what they stand to gain and lose from your request", "Name where they could lose face and what would let them keep it"]
    inputs: [question]
    outputs: [persona]
    note: "Their wants, their reasons and their face-saving needs, so the plan starts on their side."
  - name: Plan the conversation
    skill: buy-in-conversation-planner
    job: strategy
    task: sell-and-negotiate
    from: "Part Three chapters 4 to 10"
    method: ["Start from their want, not yours", "Open friendly, with no blame", "Leave room for the idea to feel theirs", "Appeal to a fair, higher reason", "Own your mistakes first"]
    inputs: [question, persona!]
    outputs: [plan, objection_map]
    note: "A plan that opens friendly, lets them talk and leaves them room to shape the idea."
  - name: Build the ladder of easy yeses
    skill: yes-ladder-question-writer
    job: strategy
    task: sell-and-negotiate
    from: "Part Three chapter 5, the secret of Socrates"
    method: ["Start from the point you both already hold", "Write 4 to 7 questions, each with an honest yes", "Make each step small, so the last one is the natural next step", "Plan what to do when a no appears"]
    inputs: [plan, objection_map!]
    outputs: [plan]
    note: "Questions in an order where each honest yes leads to the next, ending at your request."
  - name: Write the lines for pushback
    skill: disagreement-calming-line-writer
    job: copy
    task: sell-and-negotiate
    from: "Part Three chapters 1 to 3 and 6"
    method: ["Welcome the disagreement and let them finish", "Agree on what is true, admit what you got wrong, quickly", "Say you will think about their point, and thank them", "Postpone the decision if the talk heats up"]
    inputs: [plan, objection_map!]
    outputs: [copy_draft]
    note: "Short lines for when they say no, get angry or say you are wrong."
  - pause: "Have the conversation. Afterwards, note what they agreed to and what they still doubt."
