# Workflow skeleton built from existing library skills (docs/INTAKE.md). Our words.
id: write-a-personal-story-email-and-read-how-it-did
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: write-a-personal-story-email-and-read-how-it-did
  name: "Write a personal story email and read how it did"
  summary: "Give it your brand file and one true story. Get a clean email ready to send, then a read of results."
  when: "you want an email that sounds like a person wrote it, and want to know if it beat your usual sends."
  job: write-emails
  level: beginner
steps:
  - name: "Story email writer"
    skill: story-email-writer
    job: email
    from: "skill: story-email-writer"
    method: ["Decide the reaction, the action and the one takeaway first", "Answer the buyer's main doubts", "Write three drafts in different shapes", "Add one call to action and a P.S.", "Pick which to send first"]
    inputs: [brand_brain, brief!]
    outputs: [copy_draft]
    note: "Starts from your brand file and one true story and writes three drafts."
  - name: "Email draft reviewer"
    skill: email-draft-reviewer
    job: email
    from: "skill: email-draft-reviewer"
    method: ["Check the opening line, length and subject line", "Cut filler and put the reader first", "Map the pacing", "Score how ready it is to send"]
    inputs: [copy_draft, brand_brain!]
    outputs: [audit_report]
    note: "Reads the draft you picked from the step before and lists the cuts to make."
  - name: "Email mistake fixer"
    skill: email-mistake-fixer
    job: ops
    from: "skill: email-mistake-fixer"
    method: ["Fix spelling, grammar and wrong words in your own voice", "Leave your style and meaning alone", "Remove tracking bits from links if you ask"]
    inputs: [copy_draft]
    outputs: [copy_draft]
    note: "Takes the draft after you apply the cuts and cleans up the small errors."
  - pause: "Send the email to part of your list, alongside your usual sends. After a few days, export the campaign numbers. You send and export."
  - name: "Email and SMS performance reader"
    skill: email-and-sms-performance-reader
    job: analysis
    from: "skill: email-and-sms-performance-reader"
    method: ["Check nothing is broken", "Read list growth and campaign results", "Compare opens, clicks and orders", "Rank the causes and give one fix to test each"]
    inputs: [performance_sheet, email_flow!]
    outputs: [audit_report]
    note: "Fresh start after the send: reads the numbers so you can see if the story email beat your usual ones."
