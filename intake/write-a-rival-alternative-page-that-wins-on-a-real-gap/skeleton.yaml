id: write-a-rival-alternative-page-that-wins-on-a-real-gap
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: write-a-rival-alternative-page-that-wins-on-a-real-gap
  name: "Write a rival alternative page that wins on a gap"
  summary: "Give it your rivals. Get how their messages differ, the gap worth owning, a fair alternative page and a review of it."
  when: "buyers compare you with a named rival and you want the page they find when they search for it."
  job: study-competitors
  level: intermediate
steps:
  - name: "Compare how rivals pitch themselves"
    skill: competitor-messaging-comparer
    job: ops
    from: "skill: competitor-messaging-comparer"
    method: ["Read each rival's public pages, news and content", "Build a matrix of their headlines, claims and proof", "Find topics they cover and topics nobody covers", "Note threats and the moves worth making"]
    inputs: [competitor_set!, question!]
    outputs: [competitor_set]
    note: "Starts from rival names and writes down how each one pitches."
  - name: "Map where nobody is strong"
    skill: competitor-white-space-mapper
    job: research
    from: "skill: competitor-white-space-mapper"
    method: ["List rivals the way buyers see them", "List the features that decide who wins", "Rate every rival and yourself on each one", "Mark the open spaces and where to stop fighting"]
    inputs: [competitor_set, voc_reviews!, brand_brain!]
    outputs: [audit_report]
    note: "Reads the rival set from the step before and shows which gap you can honestly own."
  - name: "Write the alternative page"
    skill: alternative-page-writer
    job: ops
    from: "skill: alternative-page-writer"
    method: ["Start with why people look for an alternative", "Compare features, service and price fairly", "Say who should switch and who should not", "Add the move path, proof from switchers and one call to act"]
    inputs: [competitor_set, product_data!]
    outputs: [landing_page]
    note: "Builds the page on the rival set and leads with the gap the map found."
  - name: "Review the page before it goes live"
    skill: landing-page-auditor
    job: page
    from: "skill: landing-page-auditor"
    method: ["Name the one job of the page", "Read it as a glance, a skim and a doubt check", "Check the phone basics", "Rank each finding by how much it hurts and how easy it is to fix"]
    inputs: [landing_page, brand_brain!]
    outputs: [audit_report]
    note: "Reads the alternative page and ranks what to fix first."
