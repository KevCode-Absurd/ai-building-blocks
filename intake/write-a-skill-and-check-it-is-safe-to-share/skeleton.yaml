# Workflow skeleton chaining library skills (docs/INTAKE.md). Our words.
id: write-a-skill-and-check-it-is-safe-to-share
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: write-a-skill-and-check-it-is-safe-to-share
  name: "Write a skill and check it is safe to share"
  summary: "Give it a job you repeat. Get a written skill, a score, a trigger grade, a safety scan and a portability check."
  when: "you want a skill your AI reliably picks, that you can pass to other people without risk."
  job: make-skills
  level: intermediate
steps:
  - name: "Write the skill"
    skill: skill-writer
    job: ops
    from: "skill: skill-writer"
    method: ["Pin down what the skill should do and when it should fire", "Draft the skill file with clear steps", "Write a few test prompts and try them", "Rewrite from what the tests show"]
    inputs: [brief]
    outputs: [skill_files]
    note: "Turns your description of the job into a skill folder with test prompts."
  - name: "Score its quality"
    skill: skill-quality-tester
    job: ops
    from: "skill: skill-quality-tester"
    method: ["Check the folder has the files and sections it needs", "Run any scripts it ships", "Score structure, clarity and use", "List fixes in order of value"]
    inputs: [skill_files]
    outputs: [audit_report]
    note: "Reads the skill folder from the step before and scores it with a fix list."
  - name: "Grade when it fires"
    skill: skill-trigger-auditor
    job: ops
    from: "skill: skill-trigger-auditor"
    method: ["Read the name and description the AI sees first", "Grade how well they match real requests", "Test which skill wins for sample prompts", "Flag skills that block each other"]
    inputs: [skill_files]
    outputs: [feedback_notes]
    note: "Reads the same skill folder and grades the line that decides when it runs."
  - pause: "Apply the fixes from the score and the trigger grade to the skill files. Keep a copy of the first draft."
  - name: "Scan it for risk"
    skill: skill-safety-checker
    job: ops
    from: "skill: skill-safety-checker"
    method: ["Read every file without running it", "Look for risky commands, data leaks and hidden code", "Rank each finding", "Say what to remove or keep"]
    inputs: [skill_files]
    outputs: [security_report]
    note: "Scans the fixed skill files for risky code and data leaks."
  - name: "Check it loads elsewhere"
    skill: skill-portability-checker
    job: ops
    from: "skill: skill-portability-checker"
    method: ["Check the header parses in strict readers", "Check names, paths and links", "Look for tool names that only work in one app", "Explain each finding with its fix"]
    inputs: [skill_files]
    outputs: [audit_report]
    note: "Checks the same files will load in other AI tools, so you can share them."
