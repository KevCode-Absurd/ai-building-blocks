# Workflow skeleton that chains library skills (docs/INTAKE.md). Our words.
id: write-a-thinking-task-english-learners-can-do
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: write-a-thinking-task-english-learners-can-do
  name: "Write a thinking task English learners can do"
  summary: "Give it a subject and a thinking skill. Get a task, a language check and a version with language help."
  when: "your class includes students still learning English and you want the thinking to stay hard while the language gets easier."
  job: teach-and-train
  level: intermediate
steps:
  - name: Critical thinking task writer
    skill: critical-thinking-task-writer
    job: ops
    from: library
    method: ["Name the subject and the thinking skill", "Choose the material students will weigh", "Write the task and its questions", "Say what a strong answer shows"]
    inputs: [brief]
    outputs: [document]
    note: "Makes the task students will work on, which the next two steps check and adapt."
  - name: Task language demand checker
    skill: task-language-demand-checker
    job: ops
    from: library
    method: ["Read the task for hard words and sentence types", "Mark what may block a learner of English", "Separate language blocks from thinking demands", "List what to support"]
    inputs: [document]
    outputs: [audit_report]
    note: "Reads the task from the step before and finds the words and sentences that may block students still learning English."
  - name: Task scaffold adder for language learners
    skill: ell-task-scaffolds
    job: ops
    from: library
    method: ["Take the task and the language blocks found", "Add word banks, sentence starters or visuals where needed", "Keep the thinking just as hard", "Offer lighter support for stronger learners"]
    inputs: [document]
    outputs: [copy_draft]
    note: "Adds language help to the task from step one, aimed at the blocks the check found."
