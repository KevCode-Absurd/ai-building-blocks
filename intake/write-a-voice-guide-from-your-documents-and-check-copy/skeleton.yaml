# Workflow skeleton built from library skills (docs/INTAKE.md).
id: write-a-voice-guide-from-your-documents-and-check-copy
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: write-a-voice-guide-from-your-documents-and-check-copy
  name: "Write a voice guide from your documents and check copy"
  summary: "Give it your documents. Get a voice guide, new copy in that voice and a ranked check of the draft."
  when: "your writing sounds different from page to page, or several people write for you."
  job: brand-file
  level: intermediate
steps:
  - name: "Brand voice guide builder"
    skill: brand-voice-guide-builder
    job: ops
    from: "skill: brand-voice-guide-builder"
    method: ["Sort your documents and call notes by type", "Pull out what is said about voice, tone and words", "Write voice, tone and rules with a confidence rating for each", "List the questions your team still has to settle"]
    inputs: [source_text, voc_reviews!]
    outputs: [brand_guide]
    note: "Starts the chain: reads what you already wrote and said and makes the voice guide."
  - pause: "Read the open questions with whoever owns the brand, settle them and update the guide before you write anything with it."
  - name: "Brand voice rewriter"
    skill: brand-voice-rewriter
    job: ops
    from: "skill: brand-voice-rewriter"
    method: ["Load the settled guide", "Read what the new piece is for and who reads it", "Keep the voice fixed and adjust tone to the situation", "Write the piece and explain each voice choice"]
    inputs: [brand_guide, brief]
    outputs: [copy_draft]
    note: "Uses the settled guide to write a real email, post or pitch, or to redo a draft you already have."
  - name: "Draft brand voice checker"
    skill: draft-brand-voice-checker
    job: ops
    from: "skill: draft-brand-voice-checker"
    method: ["Compare the draft with the voice and style rules", "Rank each gap by how much it matters", "Write a before and after for every fix", "Flag claims that need proof"]
    inputs: [copy_draft, brand_brain!]
    outputs: [audit_report]
    note: "Reads the draft from the step before and ranks where it drifts from the guide."
