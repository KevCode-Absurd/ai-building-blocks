# Workflow skeleton built from AI Blocks library skills (docs/INTAKE.md). Our words.
id: write-an-advertorial-that-turns-cold-traffic-into-sales
source:
  title: "AI Blocks library"
  by: "AI Blocks"
  kind: other
  rights: ours
workflow:
  slug: write-an-advertorial-that-turns-cold-traffic-into-sales
  name: "Write an advertorial that turns cold traffic into sales"
  summary: "Give it your product facts and customer reviews. Get an advertorial built on one big idea and checked for story and claims."
  when: "your ads send cold visitors to a page that does not explain the product well enough to sell it."
  job: write-landing-page
  level: intermediate
steps:
  - name: "Big idea and mechanism builder"
    skill: big-idea-and-mechanism-builder
    job: copy
    from: "library"
    method: ["List what is truly unique", "Rank the pain points", "Test each metaphor against what the product does", "Write the why-now", "List every claim that needs proof"]
    inputs: [product_data, voc_reviews, competitor_set!, brand_brain!]
    outputs: [brief]
    note: "Builds one big idea, a root cause and a named mechanism from your product facts and reviews."
  - name: "Store advertorial writer"
    skill: store-advertorial-writer
    job: page
    from: "library"
    method: ["Write for one named person and the ad's promise", "List the pains and desires first", "Name the mechanism so a reader could repeat it to a friend at a party", "Close with two options", "Pick the image list"]
    inputs: [brief, product_data, ad_copy!, voc_reviews!]
    outputs: [landing_page]
    note: "Writes the advertorial from the big idea brief."
  - name: "Advertorial story and belief checker"
    skill: advertorial-story-and-belief-checker
    job: page
    from: "library"
    method: ["Story-break check", "Mechanism check", "Risk and villain check", "Honesty check", "Score and rank the fixes"]
    inputs: [landing_page, persona!, brief!, ad_copy!]
    outputs: [audit_report]
    note: "Reads the draft page and flags where the story breaks or a belief is not yet earned."
  - name: "Store social proof placer"
    skill: store-social-proof-placer
    job: page
    from: "library"
    method: ["Tie each testimonial to a job", "Prefer short phone video testimonials", "Put proof where visitors are unsure", "Give an honest steer", "List what you dropped"]
    inputs: [voc_reviews, persona!, landing_page!]
    outputs: [objection_map]
    note: "Places reviews and proof where the checked draft raises a doubt."
  - name: "Landing page 30-point checker"
    skill: landing-page-30-point-checker
    job: page
    from: "library"
    method: ["Brand brain", "If something is missing, advise, don't block", "Verdict", "First five fixes", "Can't tell"]
    inputs: [landing_page, brand_brain!, design_direction!]
    outputs: [audit_report]
    note: "Scores the finished page on 30 points before it goes live."
