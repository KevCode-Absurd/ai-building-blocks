# Workflow skeleton chaining existing library skills (docs/INTAKE.md).
id: write-your-founder-story-and-cut-it-to-what-moves
source: {title: "AI Blocks library", by: "AI Blocks", kind: other, rights: ours}
workflow:
  slug: write-your-founder-story-and-cut-it-to-what-moves
  name: "Write your founder story and cut it to what moves"
  summary: "Give it the true facts of how you started. Get a mapped story, its shape checked, a 10% cut and plain wording."
  when: "you need an about-me or origin story that holds up and does not ramble."
  job: write-and-tell-stories
  level: beginner
steps:
  - name: "Hero story mapper"
    skill: hero-story-mapper
    job: copy
    from: "skill: hero-story-mapper"
    method: ["List the true facts in time order", "Mark the call, the point of no return, the hardest stretch and the change", "Describe what you brought back and who gains, then draft it"]
    inputs: [question]
    outputs: [plan, copy_draft]
    note: "Maps your facts to the stages of the story and drafts it without inventing anything."
  - name: "Story shape mapper"
    skill: story-shape-mapper
    job: analysis
    from: "skill: story-shape-mapper"
    method: ["Split the story into beats and score each from good to bad fortune", "Draw the line and name the shape", "Flag flat spots and suggest one change"]
    inputs: [copy_draft, question!]
    outputs: [audit_report]
    note: "Reads the draft from the step before and shows where the story goes flat."
  - pause: "Make the one change it suggests and rewrite the flat spots. Keep the facts true."
  - name: "Ten percent cutter"
    skill: ten-percent-cutter
    job: copy
    from: "skill: ten-percent-cutter"
    method: ["Count the words and set a target of 90%", "Cut in passes: needless words, repeats, obvious actions and back story", "Log every cut with its reason"]
    inputs: [copy_draft, plan!]
    outputs: [copy_draft, audit_report]
    note: "Cuts your reworked draft by a tenth and keeps a log of what went. It can use the story map from step one."
  - name: "Plain English editor"
    skill: plain-english-editor
    job: copy
    from: "skill: plain-english-editor"
    method: ["State the point of the piece in one sentence", "Swap stale phrases and jargon for plain words, and make passive lines active", "Read it aloud and fix any line you would not say"]
    inputs: [copy_draft, brand_brain!]
    outputs: [copy_draft, feedback_notes]
    note: "Takes the cut draft and puts it in words you would say out loud."
