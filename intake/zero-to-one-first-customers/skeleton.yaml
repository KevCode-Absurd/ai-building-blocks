# Workflow skeleton for Zero to One (docs/INTAKE.md). Our words; the book stays in mind-sources/peter-thiel (local only).
id: zero-to-one-first-customers
source:
  title: "Zero to One: Notes on Startups, or How to Build the Future"
  by: "Peter Thiel with Blake Masters"
  kind: book
  rights: ideas-only
  year: 2014
minds: [peter-thiel]
workflow:
  slug: pick-the-one-way-to-reach-customers-and-plan-it
  name: "Pick the one way to reach customers and plan it"
  summary: "Give it your product and price. Get one sales route, a plan for it and a pitch for hires."
  when: "you have a product and need to pick how it will reach customers, instead of trying every channel at once."
  job: sell-and-negotiate
  level: intermediate
steps:
  - name: Pick the sales route from the numbers
    skill: sales-route-picker
    job: strategy
    task: sell-and-negotiate
    from: "Chapter 11, how to sell a product"
    method: ["Work out what a customer is worth over time and what winning one costs", "Match the deal size to a route: a few large deals, a team selling, ads, or sharing between users", "Flag the gap in the middle where no route pays", "Choose one route and say why the others lose"]
    inputs: [question, offer!, persona!]
    outputs: [audit_report]
    note: "One route, picked from the value and cost of a customer, and why not the others."
  - name: Plan the route
    skill: sales-route-plan-builder
    job: strategy
    task: sell-and-negotiate
    from: "Chapter 11, complex sales, personal sales and viral marketing"
    method: ["Set who sells and how many deals are needed", "Start with the smallest buyers who need it most", "Use early customers as proof for larger ones", "Set the number that shows the route is working"]
    inputs: [audit_report, question!]
    outputs: [plan]
    note: "The first ninety days of the chosen route, with who does what and the number to watch."
  - name: Write the reason to join
    skill: reason-to-join-pitch-writer
    job: copy
    task: sell-and-negotiate
    from: "Chapter 10, recruiting conspirators, and chapter 11, selling to non-customers"
    method: ["Write why the twentieth hire should pick you over a bigger company", "Base it on the mission only you are doing and on the people", "Drop pay, perks and the claims every company makes", "Check the pitch fits your company and no other"]
    inputs: [plan, question!]
    outputs: [copy_draft]
    note: "A pitch to the people you need to hire, built on mission and team rather than perks."
