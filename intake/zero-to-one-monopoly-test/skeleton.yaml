# Workflow skeleton for Zero to One (docs/INTAKE.md). Our words; the book stays in mind-sources/peter-thiel (local only).
id: zero-to-one-monopoly-test
source:
  title: "Zero to One: Notes on Startups, or How to Build the Future"
  by: "Peter Thiel with Blake Masters"
  kind: book
  rights: ideas-only
  year: 2014
minds: [peter-thiel, hamilton-helmer]
workflow:
  slug: test-if-your-idea-can-own-its-market
  name: "Test if your idea can own its market"
  summary: "Give it your idea. Get an honest market size, a ten-times test, a ten-year check and a go, fix or stop call."
  when: "you have a business idea and want to know if it can win a market for good, or only join a crowded one."
  job: test-an-idea
  level: advanced
steps:
  - name: Find the belief your idea rests on
    skill: contrarian-belief-tester
    job: strategy
    task: test-an-idea
    from: "Chapters 2 and 8, the contrarian question and secrets"
    method: ["Ask what important thing you believe that few people agree with", "Check it is true and not only unusual", "Ask if the idea is new or a copy", "Name the narrowest market it could win first"]
    inputs: [question]
    outputs: [plan]
    note: "The one belief, whether it is new or a copy, and a first market."
  - name: Size your market without flattering yourself
    skill: market-boundary-checker
    job: research
    task: test-an-idea
    from: "Chapter 3, lies people tell, and chapter 13, the monopoly question"
    method: ["Describe the market two ways: as a narrow overlap and as a wide union", "Work out your share of each with real numbers", "Find the version a buyer would really use to compare you", "Say whether you own a big share of a small market or a sliver of a large one"]
    inputs: [question, plan!]
    outputs: [audit_report]
    note: "Your share of the market a buyer really compares you in, not the one that flatters you."
  - name: Test for a ten-times edge
    skill: ten-times-better-checker
    job: strategy
    task: test-an-idea
    from: "Chapter 5, characteristics of monopoly"
    method: ["Name the closest thing a buyer uses today", "Pick the one thing that matters most to the buyer and measure both", "Count it as real only at ten times or more, or a thing with no substitute", "Look for a network, scale or brand that grows the gap"]
    inputs: [question, audit_report!]
    outputs: [audit_report]
    note: "Whether the gap to the closest substitute is big enough that a buyer notices at once."
  - name: Check it still holds in ten years
    skill: ten-year-durability-checker
    job: strategy
    task: test-an-idea
    from: "Chapter 5, last mover advantage, and chapter 13, the durability question"
    method: ["Ask who could copy you and how long it would take", "Split value into the next few years and the years after", "List what gets harder to copy as you grow", "Ask what change in the world would end the edge"]
    inputs: [audit_report, question!]
    outputs: [audit_report]
    note: "What stops a rival, a cheaper copy or a change in the world from ending your edge."
  - name: Score the seven questions and make the call
    skill: seven-question-startup-scorer
    job: strategy
    task: test-an-idea
    from: "Chapter 13, the seven questions"
    method: ["Score engineering, timing, monopoly, people, distribution, durability and secret", "Mark any question you cannot answer from facts", "Name the weakest question as the thing to fix first", "Say go, fix or stop"]
    inputs: [audit_report, plan!, question!]
    outputs: [audit_report]
    note: "All seven scored from the earlier steps, with the weakest named as the first fix."
