    <script>
      // Dark by default; a saved choice of light is applied before first paint.
      document.documentElement.dataset.theme = "dark";
      try { if (localStorage.getItem("abb:theme") === "light") delete document.documentElement.dataset.theme; } catch (e) {}
    </script>
    <!-- APP_BOOT_START: only interactive pages use this first-paint screen. -->
    <style>
      html { background: #fafafa; }
      html[data-theme="dark"] { background: #0a0a0a; }
      #app-loader { display: none; }
      html[data-boot="loading"] body, html[data-boot="error"] body { overflow: hidden; }
      html[data-boot="loading"] #root, html[data-boot="error"] #root { visibility: hidden; }
      html[data-boot] #app-loader {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: #fafafa; color: #0a0a0a; text-align: center; padding: 24px;
        font: 14px/1.5 "Space Grotesk", system-ui, sans-serif;
        opacity: 1; visibility: visible; transition: opacity 180ms ease, visibility 180ms;
      }
      html[data-theme="dark"][data-boot] #app-loader { background: #0a0a0a; color: #fafafa; }
      html[data-boot="ready"] #app-loader { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-content { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px; text-align: center; }
      .boot-loading { display: grid; justify-items: center; gap: 14px; }
      .boot-brand { color: inherit; font: 650 18px/1.2 "Space Grotesk", system-ui, sans-serif; letter-spacing: -.04em; }
      .boot-progress { display: block; width: 42px; height: 3px; border-radius: 3px; background: currentColor; opacity: .55; transform-origin: left; animation: boot-progress 900ms ease-in-out infinite alternate; }
      @keyframes boot-progress { to { transform: scaleX(1.55); opacity: .28; } }
      .diagram-tools .workflow-view-help { display: none !important; }
      .boot-recovery { display: none; max-width: 360px; margin: auto auto 0; text-align: center; }
      .boot-recovery p { margin: 0 0 12px; }
      .boot-recovery a { display: inline-block; color: inherit; padding: 8px 12px; text-underline-offset: 4px; }
      .boot-recovery a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
      html[data-boot="error"] .boot-recovery { display: block; }
      /* Item pages: the server's readable page shows at once; the app opens hidden behind it (main.tsx) and replaces it in one frame. */
      html[data-boot="loading"]:has(#root > [data-static-first]) #app-loader, html[data-boot="static"] #app-loader { display: none; }
      html[data-boot="loading"]:has(#root > [data-static-first]) #root { visibility: visible; }
      html[data-boot="loading"]:has(#root > [data-static-first]) body, html[data-boot="static"] body { overflow: auto; }
      html[data-boot="static"] #root { visibility: hidden; position: absolute; top: 0; left: 0; right: 0; height: 0; overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { html[data-boot] #app-loader { transition: none; } .boot-progress { animation: none; } }
    </style>
    <script>
      // Run before the body can paint; JavaScript-free readers keep the HTML view.
      document.documentElement.dataset.boot = "loading";
      let bootStyleFailed = false;
      function bootError() {
        document.documentElement.dataset.boot = "error";
        document.getElementById("app-loader")?.setAttribute("aria-label", "AI Blocks is taking longer than expected");
      }
      // A failed stylesheet must not reveal an unformatted interactive page.
      function bootStyleError(event) {
        if (event.target instanceof HTMLLinkElement && event.target.rel === "stylesheet") {
          bootStyleFailed = true;
          bootError();
        }
      }
      window.addEventListener("error", bootStyleError, true);
      // Only time the page spends visible counts: a tab opened in the background
      // loads at low priority, so it gets a fresh wait once someone looks at it.
      (function armBootTimer(ms) {
        window.__abbBootTimer = setTimeout(function () {
          if (document.documentElement.dataset.boot !== "loading") return;
          if (document.visibilityState === "hidden") {
            document.addEventListener("visibilitychange", function shown() {
              if (document.visibilityState === "hidden") return;
              document.removeEventListener("visibilitychange", shown);
              armBootTimer(8000);
            });
            return;
          }
          // A readable pre-rendered page beats an error: show it while the app finishes.
          if (document.querySelector('#root [data-testid="public-opening"] [data-prerendered]')) { document.documentElement.dataset.boot = "ready"; return; }
          bootError();
        }, ms);
      })(15000);
      document.addEventListener("abb:ready", function () {
        clearTimeout(window.__abbBootTimer);
        if (bootStyleFailed) return;
        window.removeEventListener("error", bootStyleError, true);
        document.getElementById("static-view")?.remove();
        document.documentElement.dataset.boot = "ready";
        // The live app now owns the page semantics. Keep the short visual fade,
        // but prevent its duplicated heading and links from being announced.
        const loader = document.getElementById("app-loader");
        loader?.setAttribute("aria-hidden", "true");
        setTimeout(function () { document.getElementById("app-loader")?.remove(); }, 200);
      }, { once: true });
    </script>
    <!-- APP_BOOT_END -->
    <!-- Fonts are served from this site (Latin letters only), so text never waits on another server. -->
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <!-- The library list starts downloading alongside the code instead of after it. -->
    <script>
      // Only catalogue screens need the full index. Keep independent pages light. The builder (/compose) fetches it
      // itself when the visitor uses its form (App.tsx).
      if (location.pathname === "/" || /^\/(skills|prompts|workflows|agents|minds|space|people|s|from-a-source)(\/|$)/.test(location.pathname)) {
        // Public files can load while sign-in opens. Keep the full homepage
        // catalogue behind critical code/fonts in the network queue.
        const home = location.pathname === "/";
        const params = new URLSearchParams(location.search);
        const starter = home && !params.has("block") && !params.has("workflow");
        // A first visit to home shows only the starter picks; the list index waits for a search, scroll or library link.
        const intent = location.hash === "#library" || location.hash === "#build" || ["q", "kind", "area", "fn", "job", "audience", "starred", "scope"].some(key => params.has(key));
        // Home lists cards from the small index; block pages and tools need the full catalogue.
        const item = /^\/(skills|prompts|workflows|agents|minds)\/([a-z0-9-]+)$/.exec(location.pathname);
        const list = home ? "/data/blocks-index.json" : location.pathname === "/minds" ? "/data/minds-index.json" : item ? "/data/items/" + item[2] + ".json" : "/data/blocks.json";
        for (const href of starter ? (intent ? [list, "/data/starter-blocks.json"] : ["/data/starter-blocks.json"]) : [list]) {
          const catalogue = document.createElement("link");
          catalogue.rel = "preload"; catalogue.href = href;
          catalogue.as = "fetch"; catalogue.crossOrigin = "anonymous";
          if (home && href === list) catalogue.fetchPriority = "low";
          document.head.append(catalogue);
        }
      }
    </script>
    <style>
      @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: swap; src: url(/fonts/space-grotesk.woff2) format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(/fonts/jetbrains-mono.woff2) format("woff2"); }
    </style>

  <body>
    <!-- APP_LOADER_START -->
    <div id="app-loader" role="status" aria-live="polite" aria-label="AI Blocks is opening">
      <div class="boot-content">
        <div class="boot-loading" aria-hidden="true"><span class="boot-brand">AI Blocks</span><span class="boot-progress"></span></div>
        <div class="boot-recovery"><p>This is taking longer than expected.</p><a href="">Try again</a><a href="/jobs">Browse the library</a></div>
      </div>
    </div>
    <!-- APP_LOADER_END -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
