<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not in the tour · Example app</title>
<style>
  :root { --bg: #f6f7fb; --ink: #14213d; --soft: #55607a; --line: #dfe3ec; --accent: #ffd166; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1626; --ink: #eef1f7; --soft: #a9b2c6; --line: #263149; } }
  :root[data-theme="dark"] { --bg: #0f1626; --ink: #eef1f7; --soft: #a9b2c6; --line: #263149; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 440px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 10px; }
  p { color: var(--soft); margin: 0 0 22px; }
  a { display: inline-block; margin: 0 10px 10px 0; padding: 9px 16px; border-radius: 999px; text-decoration: none; font-weight: 600; color: #14213d; background: var(--accent); }
  a + a { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>This screen isn't in the tour</h1>
  <p>The tour keeps the main screens and a few of each kind of detail page, so it stays quick to load. Go back and pick another one.</p>
  <a href="javascript:history.back()">Go back</a><a href="/example-app/">Start of the app</a><a href="/apps">AI Blocks</a>
</main>
</body>
</html>
