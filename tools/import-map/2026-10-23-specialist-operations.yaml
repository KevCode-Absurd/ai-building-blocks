erphq/skills:templates/01-org-under-100/go-live-checklist:
  slug: business-tool-launch-checklist
  name: Business tool launch checklist
  summary: Share your rollout plan. Get launch checks, open blockers and a clear decision record for your team.
  subhead: Share the business tool you are launching, the people affected and your readiness notes. It checks data, access, training, connections and rollback plans. You get an open-issue checklist, a launch-day plan and a place to record the go or no-go decision.
  task: organise-work
  role: make
  level: intermediate
  thinking: medium
  thinking_why: It follows a process checklist and ties each step to your records.
  inputs:
    - type: source_text
      required: true
    - type: brief
      required: true
  outputs:
    - type: document
    - type: plan
  explain: Share the business tool you are launching, the people affected and your readiness notes. It checks data, access, training, connections and rollback plans. You get an open-issue checklist, a launch-day plan and a place to record the go or no-go decision.
  you_give:
    - The new business tool, rollout date and affected teams.
    - Known test results, owners, training plans and rollback options.
  you_get:
    - A readiness checklist with open items.
    - A go or no-go decision record for the owner.
    - A launch-day plan and follow-up review outline.
  how_it_works:
    - title: Step 1
      text: Check data, users, connections and communication readiness.
    - title: Step 2
      text: Separate launch blockers from risks the owner may accept.
    - title: Step 3
      text: Prepare the decision record, launch-day checks and follow-up review.
  needs: read your supplied records; changing live systems needs separate access and approval
erphq/skills:templates/01-org-under-100/migration-runbook:
  slug: business-data-move-runbook
  name: Business data move runbook
  summary: Share the old and new tools. Get a data-move plan with field maps, checks and a rollback path.
  subhead: Share the business tools you are moving between, the records involved and your target date. It plans field mapping, a test move, checks and the final switch. You get a runbook, a validation plan and a fallback if the move fails.
  task: work-with-files
  role: make
  level: intermediate
  thinking: medium
  thinking_why: It follows a process checklist and ties each step to your records.
  inputs:
    - type: source_text
      required: true
    - type: brief
      required: true
  outputs:
    - type: document
    - type: plan
  explain: Share the business tools you are moving between, the records involved and your target date. It plans field mapping, a test move, checks and the final switch. You get a runbook, a validation plan and a fallback if the move fails.
  you_give:
    - Source and target tools, record types and counts.
    - Field details, business timing, test results and responsible owners.
  you_get:
    - A phased data-move runbook.
    - A source-to-target field map and validation checklist.
    - A fallback plan and old-system retention steps.
  how_it_works:
    - title: Step 1
      text: Map source fields to the target and keep a full backup.
    - title: Step 2
      text: Plan a small test move, then check counts, samples and relationships.
    - title: Step 3
      text: Set the final switch, rollback triggers and old-system archive plan.
  needs: read your supplied records; changing live systems needs separate access and approval
