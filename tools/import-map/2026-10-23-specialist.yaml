yugash007/edu-agent-skills:skills/assessment/interview-mode:
  slug: technical-interview-practice
  name: Technical interview practice
  summary: Choose a topic and pressure level. Practice interview answers, then get scores and focused next steps.
  subhead: Share your interview topic, current level and time limit. It runs a warm-up, core questions and follow-ups before giving feedback. You get scores for your answers, clear gaps and a focused practice plan.
  task: find-a-job
  role: check
  level: beginner
  thinking: medium
  thinking_why: It follows a set method and adapts its questions or draft to your evidence.
  inputs:
    - type: source_text
      required: true
    - type: brief
      required: false
  outputs:
    - type: feedback_notes
    - type: plan
  needs: read your supplied notes and ask follow-up questions
  explain: Share your interview topic, current level and time limit. It runs a warm-up, core questions and follow-ups before giving feedback. You get scores for your answers, clear gaps and a focused practice plan.
  you_give:
    - Your interview topic and type, such as coding or system design.
    - Your current level, time limit and areas you want to test.
  you_get:
    - A practice interview with questions and follow-ups.
    - Scores from one to five for correctness, clarity, tradeoffs and edge cases.
    - Specific gaps and the next topic to practice.
  how_it_works:
    - title: Step 1
      text: Set the interview scope and start with an easier warm-up.
    - title: Step 2
      text: Ask core questions and follow-ups while you explain your reasoning.
    - title: Step 3
      text: End the interview, score four areas and suggest practice for weak answers.
yugash007/edu-agent-skills:skills/assessment/misconception-detector:
  slug: learning-mistake-coach
  name: Learning mistake coach
  summary: Share a repeated mistake. Get a clear correction, a fresh example and a question that checks your understanding.
  subhead: Share the explanation you keep getting wrong and what you have already tried. It checks the belief behind the mistake, then chooses a matching correction. You get a clearer model, a worked example and a fresh question to try.
  task: study-and-practice
  role: check
  level: beginner
  thinking: medium
  thinking_why: It follows a set method and adapts its questions or draft to your evidence.
  inputs:
    - type: source_text
      required: true
    - type: brief
      required: false
  outputs:
    - type: feedback_notes
    - type: plan
  needs: read your supplied notes and ask follow-up questions
  explain: Share the explanation you keep getting wrong and what you have already tried. It checks the belief behind the mistake, then chooses a matching correction. You get a clearer model, a worked example and a fresh question to try.
  you_give:
    - Your incorrect answer or explanation in your own words.
    - The topic and examples of the same mistake happening again.
  you_get:
    - A named mistake type with evidence from your answer.
    - A corrected explanation and example.
    - A fresh question and a plan for more practice.
  how_it_works:
    - title: Step 1
      text: Classify the mistake and check that the stated belief matches yours.
    - title: Step 2
      text: Find the cause and choose a definition, worked trace or guided question.
    - title: Step 3
      text: Explain the corrected idea and test it in a new case.
yugash007/edu-agent-skills:skills/memory/weak-area-tracker:
  slug: study-gap-tracker
  name: Study gap tracker
  summary: Share repeated mistakes and past checks. Get a short list of learning gaps and what to practice first.
  subhead: Give it your error notes, past checks and learning goal. It groups repeated mistakes, ranks the gaps and chooses what to revisit. You get a short active list, the next practice task and clear rules for closing each gap.
  task: study-and-practice
  role: check
  level: beginner
  thinking: medium
  thinking_why: It follows a set method and adapts its questions or draft to your evidence.
  inputs:
    - type: source_text
      required: true
    - type: brief
      required: false
  outputs:
    - type: feedback_notes
    - type: plan
  needs: read your supplied notes and ask follow-up questions
  explain: Give it your error notes, past checks and learning goal. It groups repeated mistakes, ranks the gaps and chooses what to revisit. You get a short active list, the next practice task and clear rules for closing each gap.
  you_give:
    - Error notes with topic, date and repeated attempts.
    - Your learning goal and any earlier gap list.
  you_get:
    - An active gap table with scores and evidence.
