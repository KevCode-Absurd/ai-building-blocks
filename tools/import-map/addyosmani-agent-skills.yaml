# addyosmani/agent-skills (MIT)
"addyosmani/agent-skills:skills/api-and-interface-design":
  name: API designer
  summary: Say what your code needs to offer. Get a clear, stable API or module design that is hard to misuse.
  task: build-software
  role: make
  level: advanced
  thinking: high
  thinking_why: Interfaces are hard to change later, so each choice needs weighing.
  inputs: [{type: brief, required: true}, {type: codebase, required: false}]
  outputs: [{type: plan}]
  needs: read your project files
"addyosmani/agent-skills:skills/browser-testing-with-devtools":
  name: Browser page debugger
  summary: Point it at a page that misbehaves. Get the real errors, network calls and slow spots found in a live browser.
  task: test-and-fix-code
  role: check
  level: intermediate
  thinking: medium
  thinking_why: It follows a set routine of inspecting the page and reading what comes back.
  inputs: [{type: web_app, required: true}]
  outputs: [{type: test_report}]
  needs: use Chrome DevTools and open a browser
"addyosmani/agent-skills:skills/ci-cd-and-automation":
  name: Build pipeline setter
  summary: Describe how you ship. Get automatic checks and a deploy pipeline so bad changes never reach users.
  task: ship-and-host
  role: make
  level: advanced
  thinking: medium
  thinking_why: It follows known pipeline patterns but must fit your project.
  inputs: [{type: codebase, required: true}]
  outputs: [{type: code_change}]
  needs: run code and read your project files
"addyosmani/agent-skills:skills/code-simplification":
