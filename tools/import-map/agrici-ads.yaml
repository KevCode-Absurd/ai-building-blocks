# AgriciDaniel/claude-ads (MIT)
"AgriciDaniel/claude-ads:ads":
  name: Twelve-platform ad account auditor
  summary: "Give it your ad exports and goal. Get an evidence-based audit across Google, Meta, TikTok, LinkedIn and more, with next steps."
  task: read-ad-results
  role: check
  level: advanced
  thinking: high
  thinking_why: "It weighs evidence across many platforms and flags what data is missing."
  needs: "read your ad exports and files, and optionally read your ad accounts with your own read-only tokens. Account changes stay as drafts for your approval"
  inputs: [ { type: performance_sheet, required: true }, { type: brief, required: false } ]
  outputs: [ { type: audit_report, required: true }, { type: plan, required: true } ]
  author: Daniel Agrici
  author_url: https://github.com/AgriciDaniel
"AgriciDaniel/claude-ads:skills/ads-attribution":
  name: Cross-platform conversion reconciler
  summary: "Give it your Meta and Google conversion reports. Get why the numbers differ and a plan to make them match."
  task: track-numbers
  role: check
  level: advanced
  thinking: high
  thinking_why: "Windows, counting rules and duplicates all change what the numbers mean."
  inputs: [ { type: performance_sheet, required: true } ]
  outputs: [ { type: audit_report, required: true }, { type: plan, required: false } ]
  author: Daniel Agrici
  author_url: https://github.com/AgriciDaniel
