# anthropics/knowledge-work-plugins, small-business (Anthropic, Apache 2.0). Most skills read ../../shared/*.md, a folder outside each skill, so copy shared/ next to the skills.

"anthropics/knowledge-work-plugins:small-business/skills/ap-processor":
  name: Vendor bill coder
  summary: "Give it your vendor bills. Get each one read, coded and matched, with a payment run ready for your approval."
  task: track-numbers
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It reads messy bills and judges where each one belongs."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: spreadsheet } ]
  needs: "read your accounts and files"
  bring: [ { from: small-business/shared, to: shared, link: ../../shared/ } ]

