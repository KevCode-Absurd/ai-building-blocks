  level: intermediate
  thinking: high
  thinking_why: Pay numbers need careful math and honest caveats.
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: spreadsheet }, { type: audit_report } ]
  needs: run code and read a pay file you upload
"anthropics/knowledge-work-plugins:human-resources/skills/draft-offer":
