# anthropics/knowledge-work-plugins (Anthropic, Apache 2.0): support, HR, legal, operations, finance, data. Skills draft or read; a person approves every send.
"anthropics/knowledge-work-plugins:customer-support/skills/customer-escalation":
  name: Escalation brief writer
  summary: Give it a stuck customer issue. Get a clear escalation brief for engineering or leadership, with impact and what was tried.
  task: help-customers
  role: compress
  level: intermediate
  thinking: medium
  thinking_why: It pulls scattered facts into one brief a busy person can act on.
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: document } ]
  needs: read your help desk, chat or tickets
"anthropics/knowledge-work-plugins:customer-support/skills/customer-research":
  name: Customer question researcher
  summary: Ask a customer question. Get an answer found across your docs, past tickets and chats, with each source named.
  task: help-customers
  role: source
  level: intermediate
  thinking: medium
  thinking_why: It searches several places and says how sure it is.
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: read your help desk, docs and chat
"anthropics/knowledge-work-plugins:customer-support/skills/draft-response":
  name: Customer reply drafter
  summary: Describe the customer's situation. Get a reply in the right tone, plus notes on what to check before you send it.
  task: help-customers
  role: make
  level: beginner
  thinking: medium
  thinking_why: The tone has to fit the person and the news.
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: copy_draft } ]
  needs: read your help desk or email
"anthropics/knowledge-work-plugins:customer-support/skills/kb-article":
