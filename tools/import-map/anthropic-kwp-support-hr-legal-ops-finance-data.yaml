  role: make
  level: beginner
  thinking: low
  thinking_why: It turns a known answer into a standard layout.
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: document } ]
"anthropics/knowledge-work-plugins:customer-support/skills/ticket-triage":
  name: Support inbox priority sorter
  summary: Paste a support ticket. Get a category, a P1 to P4 priority, who should handle it, and any known duplicate.
  task: help-customers
  role: check
  level: beginner
  thinking: low
  thinking_why: It sorts by clear rules.
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: read your help desk
"anthropics/knowledge-work-plugins:human-resources/skills/comp-analysis":
  name: Pay benchmark and equity modeler
  summary: Give it a role or pay data. Get market ranges, outliers and equity grant models. Not pay or tax advice.
  task: hire-people
