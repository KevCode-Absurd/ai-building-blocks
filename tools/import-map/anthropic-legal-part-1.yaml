"anthropics/claude-for-legal:ip-legal/skills/invention-intake":
  name: Invention idea screener
  summary: "Describe your invention. Get a first screen on novelty, deadlines and value, and whether to see a patent lawyer. Not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: high
  thinking_why: "It tests the idea on several patent hurdles."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
  bring:
    - from: ip-legal/skills/cold-start-interview
      to: setup-interview
      link: /ip-legal:cold-start-interview
"anthropics/claude-for-legal:ip-legal/skills/ip-clause-review":
  name: IP clause checker
  summary: "Give it a contract. Get ownership, assignment, licence and indemnity clauses checked and flagged. A first check, not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: high
  thinking_why: "Who owns the work is easy to give away by accident."
  inputs: [ { type: document, required: true } ]
