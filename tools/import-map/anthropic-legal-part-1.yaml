"anthropics/claude-for-legal:ip-legal/skills/clearance":
  name: Trademark name first-check
  summary: "Give it a name you want to use. Get a flag list of similar marks and risk factors. Not a clearance opinion."
  task: check-contracts
  role: check
  level: intermediate
  thinking: high
  thinking_why: "Look-alike marks need careful comparison."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
