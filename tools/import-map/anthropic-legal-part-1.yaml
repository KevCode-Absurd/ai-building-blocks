# anthropics/claude-for-legal part 1 (Anthropic, Apache 2.0): first checks for non-lawyers, never legal advice.
"anthropics/claude-for-legal:commercial-legal/skills/amendment-history":
  name: Contract change tracer
  summary: "Give it a contract and its amendments. Get what changed and each clause's latest wording. Not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "It has to line up several versions and trace each clause."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: audit_report } ]
  bring:
    - from: commercial-legal/skills/cold-start-interview
      to: setup-interview
      link: /commercial-legal:cold-start-interview
"anthropics/claude-for-legal:commercial-legal/skills/saas-msa-review":
  name: Software subscription terms checker
  summary: "Give it a software subscription contract. Get renewal traps, price rises, uptime and data terms flagged. A first check, not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: high
  thinking_why: "Small clauses can cost real money, so it reads closely."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: "read your own rules for what you will accept"
  bring:
    - from: commercial-legal/skills/cold-start-interview
      to: setup-interview
      link: /commercial-legal:cold-start-interview
"anthropics/claude-for-legal:commercial-legal/skills/stakeholder-summary":
  name: Contract plain-words summary writer
  summary: "Give it a reviewed contract. Get a two-minute summary of what to know before signing. A first check, not legal advice."
  task: check-contracts
  role: compress
  level: beginner
  thinking: medium
  thinking_why: "It has to pick the few points a busy reader needs."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: document } ]
  bring:
    - from: commercial-legal/skills/cold-start-interview
      to: setup-interview
      link: /commercial-legal:cold-start-interview
"anthropics/claude-for-legal:ai-governance-legal/skills/aia-generation":
  name: AI impact assessment writer
  summary: "Describe an AI use at work. Get risks, rules that apply and conditions to meet. Not legal advice."
  task: check-contracts
  role: make
  level: advanced
  thinking: high
  thinking_why: "It weighs risks across several sets of rules."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: document } ]
  needs: "search the web for current rules"
  bring:
    - from: ai-governance-legal/skills/cold-start-interview
      to: setup-interview
      link: /ai-governance-legal:cold-start-interview
"anthropics/claude-for-legal:ai-governance-legal/skills/policy-starter":
  name: Team AI use policy drafter
  summary: "Describe how your team uses AI. Get a first-draft AI use policy based on public model policies. Have a lawyer review it."
  task: check-contracts
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It adapts published policies to your setting."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: copy_draft } ]
  needs: "search the web for current model policies"
  bring:
    - from: ai-governance-legal/skills/cold-start-interview
      to: setup-interview
      link: /ai-governance-legal:cold-start-interview
"anthropics/claude-for-legal:ai-governance-legal/skills/reg-gap-analysis":
  name: New AI rule gap checker
  summary: "Give it a new AI law. Get gaps against what you do now and a fix plan. Not legal advice."
  task: check-contracts
  role: check
  level: advanced
  thinking: high
  thinking_why: "It compares dense rule text with your real practice."
  inputs: [ { type: source_text, required: true }, { type: question, required: false } ]
  outputs: [ { type: audit_report }, { type: plan } ]
  needs: "search the web for the rule text"
  bring:
    - from: ai-governance-legal/skills/cold-start-interview
      to: setup-interview
      link: /ai-governance-legal:cold-start-interview
"anthropics/claude-for-legal:ai-governance-legal/skills/vendor-ai-review":
  name: AI vendor terms checker
  summary: "Give it an AI tool's terms or addendum. Get data-training, liability and model-change risks flagged. A first check, not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: high
  thinking_why: "The risky wording is easy to miss."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: audit_report } ]
  bring:
    - from: ai-governance-legal/skills/cold-start-interview
      to: setup-interview
      link: /ai-governance-legal:cold-start-interview
"anthropics/claude-for-legal:corporate-legal/skills/board-minutes":
  name: Board minutes drafter
  summary: "Give it a meeting agenda and notes. Get draft board or committee minutes in a proper format. Have a lawyer check them."
  task: document-work
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It must record decisions correctly in a set form."
  inputs: [ { type: meeting_notes, required: true } ]
  outputs: [ { type: document } ]
  needs: "read your calendar"
  bring:
    - from: corporate-legal/skills/cold-start-interview
      to: setup-interview
      link: /corporate-legal:cold-start-interview
"anthropics/claude-for-legal:corporate-legal/skills/entity-compliance":
  name: Company filing deadline tracker
  summary: "List your companies and where they are registered. Get annual filings and due dates. Not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "Deadlines depend on company type and place."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: plan }, { type: spreadsheet } ]
  needs: "search the web to confirm current dates"
  bring:
    - from: corporate-legal/skills/cold-start-interview
      to: setup-interview
      link: /corporate-legal:cold-start-interview
"anthropics/claude-for-legal:corporate-legal/skills/tabular-review":
  name: Contract batch review grid builder
  summary: "Give it contracts and points to find. Get one cited spreadsheet row per contract. Verify before relying on it."
  task: check-contracts
  role: source
  level: advanced
  thinking: high
  thinking_why: "It reads many files and must cite every cell."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: spreadsheet } ]
  needs: "read a folder of files and build a spreadsheet"
  bring:
    - from: corporate-legal/skills/cold-start-interview
      to: setup-interview
      link: /corporate-legal:cold-start-interview
"anthropics/claude-for-legal:corporate-legal/skills/written-consent":
  name: Board written consent drafter
  summary: "Describe the decision your directors must approve. Get a written consent to sign instead of a meeting. Have a lawyer check it."
  task: check-contracts
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "Wording and who must sign matter."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: document } ]
  bring:
    - from: corporate-legal/skills/cold-start-interview
      to: setup-interview
      link: /corporate-legal:cold-start-interview
"anthropics/claude-for-legal:employment-legal/skills/handbook-updates":
  name: Handbook change checker
  summary: "Give it a proposed handbook change. Get what it affects elsewhere, including state differences. A first check, not legal advice."
  task: hire-people
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "One change can quietly clash with other rules."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: audit_report } ]
  bring:
    - from: employment-legal/skills/cold-start-interview
      to: setup-interview
      link: /employment-legal:cold-start-interview
"anthropics/claude-for-legal:employment-legal/skills/hiring-review":
  name: Offer letter and non-compete checker
  summary: "Give it an offer letter and work location. Get risky terms and non-compete limits flagged. Not legal advice."
  task: hire-people
  role: check
  level: intermediate
  thinking: high
  thinking_why: "Rules differ by place and are easy to get wrong."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: "search the web for current local rules"
  bring:
    - from: employment-legal/skills/cold-start-interview
      to: setup-interview
      link: /employment-legal:cold-start-interview
"anthropics/claude-for-legal:employment-legal/skills/internal-investigation":
  name: Workplace investigation guide
  summary: "Describe a workplace complaint. Get a plan, evidence log and draft memo. Not legal advice."
  task: hire-people
  role: orchestrate
  level: advanced
  thinking: high
  thinking_why: "It keeps track of evidence and gaps over many steps."
  inputs: [ { type: question, required: true }, { type: document, required: false } ]
  outputs: [ { type: document }, { type: plan } ]
  bring:
    - from: employment-legal/skills/cold-start-interview
      to: setup-interview
      link: /employment-legal:cold-start-interview
"anthropics/claude-for-legal:employment-legal/skills/termination-review":
  name: Termination risk checker
  summary: "Describe a planned firing. Get risk flags, severance and release points, and final pay timing. A first check, not legal advice."
  task: hire-people
  role: check
  level: advanced
  thinking: high
  thinking_why: "The cost of a mistake is high and rules vary by place."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: "search the web for current local rules"
  bring:
    - from: employment-legal/skills/cold-start-interview
      to: setup-interview
      link: /employment-legal:cold-start-interview
"anthropics/claude-for-legal:employment-legal/skills/wage-hour-qa":
  name: Pay and hours rules answerer
  summary: "Ask a pay, overtime or break question and where you are. Get the rule with its source. Not legal advice."
  task: hire-people
  role: source
  level: intermediate
  thinking: high
  thinking_why: "The answer depends on the exact place and facts."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: "search the web for the current rule"
  bring:
    - from: employment-legal/skills/cold-start-interview
      to: setup-interview
      link: /employment-legal:cold-start-interview
"anthropics/claude-for-legal:employment-legal/skills/worker-classification":
  name: Employee or contractor checker
  summary: "Describe how someone will work for you. Get employee or contractor risks flagged. Not legal advice."
  task: hire-people
  role: check
  level: intermediate
  thinking: high
  thinking_why: "The tests are fact-heavy and differ by place."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: "search the web for current local tests"
