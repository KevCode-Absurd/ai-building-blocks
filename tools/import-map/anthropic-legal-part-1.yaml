      link: /ip-legal:cold-start-interview
"anthropics/claude-for-legal:ip-legal/skills/infringement-triage":
  name: Infringement first-look sorter
  summary: "Describe a possible copy or a claim against you. Get a flag list of factors. Not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: high
  thinking_why: "Each type of claim has factors cutting both ways."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
