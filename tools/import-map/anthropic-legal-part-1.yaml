"anthropics/claude-for-legal:ip-legal/skills/fto-triage":
  name: Patent launch-risk scanner
  summary: "Describe a product or feature. Get patents that might block it and a first claim comparison. Not a legal opinion."
  task: check-contracts
  role: check
  level: expert
  thinking: high
  thinking_why: "Reading patent claims is hard and mistakes are costly."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: "search patent databases"
  bring:
    - from: ip-legal/skills/cold-start-interview
