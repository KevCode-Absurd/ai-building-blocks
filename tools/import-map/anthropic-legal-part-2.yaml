"anthropics/claude-for-legal:privacy-legal/skills/policy-monitor":
  name: Privacy policy drift checker
  summary: "Describe a data plan. Get where your privacy policy no longer matches, with fix wording. Not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "It compares two texts line by line."
  inputs: [ { type: question, required: true }, { type: document, required: false } ]
  outputs: [ { type: audit_report } ]
  needs: "read your saved privacy setup notes and your policy file"
