# anthropics/claude-for-legal, part 2 of 2 (Anthropic, Apache 2.0). Kept skills read a saved setup file made by each plugin's setup interview. Every kept skill is a first check, not legal advice.

"anthropics/claude-for-legal:litigation-legal/skills/demand-received":
  name: Incoming demand letter reviewer
  summary: "Give it a demand letter you got. Get the claims, how strong they look and your reply options. Not legal advice."
  task: check-contracts
  role: check
  level: intermediate
  thinking: high
  thinking_why: "It weighs the merit of a claim and the stakes are real."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: "read your saved legal setup notes and your files"
  bring:
    - from: litigation-legal/skills/cold-start-interview
      to: setup-interview
      link: /litigation-legal:cold-start-interview
"anthropics/claude-for-legal:litigation-legal/skills/demand-intake":
  name: Demand letter fact gatherer
  summary: "Answer its questions about a dispute. Get a fact sheet ready for a demand letter. First check, not legal advice."
  task: check-contracts
  role: source
  level: intermediate
  thinking: medium
  thinking_why: "It asks follow-up questions and files your answers."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: document } ]
  needs: "read your saved legal setup notes and save files"
  bring:
    - from: litigation-legal/skills/cold-start-interview
      to: setup-interview
      link: /litigation-legal:cold-start-interview
"anthropics/claude-for-legal:litigation-legal/skills/demand-draft":
  name: Demand letter drafter
  summary: "Give it your finished fact sheet. Get a demand letter draft and a send checklist. A first draft, not legal advice."
  task: check-contracts
  role: make
  level: advanced
  thinking: high
  thinking_why: "A careless demand can hurt your case, so it checks what you may admit."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: copy_draft } ]
  needs: "read your saved legal setup notes and make Word files"
  bring:
    - from: litigation-legal/skills/cold-start-interview
      to: setup-interview
      link: /litigation-legal:cold-start-interview
"anthropics/claude-for-legal:litigation-legal/skills/chronology":
  name: Dispute timeline builder
  summary: "Give it your emails and documents. Get a dated timeline of what happened, with key events marked. First check, not legal advice."
  task: check-contracts
  role: compress
  level: intermediate
  thinking: medium
  thinking_why: "It pulls dates from many files and removes repeats."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: document } ]
  needs: "read your saved legal setup notes and your files"
  bring:
    - from: litigation-legal/skills/cold-start-interview
      to: setup-interview
      link: /litigation-legal:cold-start-interview
"anthropics/claude-for-legal:litigation-legal/skills/subpoena-triage":
  name: Subpoena first-look reviewer
  summary: "Give it a subpoena. Get what it asks for, the deadline and a plan for your lawyer. Not legal advice."
  task: check-contracts
  role: check
  level: advanced
  thinking: high
  thinking_why: "Deadlines are short and a wrong move is costly."
  inputs: [ { type: document, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: "read your saved legal setup notes and your files"
  bring:
    - from: litigation-legal/skills/cold-start-interview
      to: setup-interview
      link: /litigation-legal:cold-start-interview
"anthropics/claude-for-legal:litigation-legal/skills/legal-hold":
  name: Records preservation notice drafter
  summary: "Tell it about a dispute. Get a notice telling staff which records to keep. A first draft, not legal advice."
  task: check-contracts
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It follows a set notice format and fills in your facts."
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: copy_draft } ]
  needs: "read your saved legal setup notes and make Word files"
  bring:
