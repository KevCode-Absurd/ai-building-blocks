# Four small repos: Arnab Bag brand skills, Strands Agents SOP author, ZhongHanLoo deep research, Paldom MCP server skills (all MIT or Apache 2.0).

# ---------- arnabbagxd/Brand-building-skills (MIT) ----------
"arnabbagxd/Brand-building-skills:skills/brand-voice":
  name: Brand voice rules writer
  summary: "Describe your brand and who you write for. Get tone, word choices and writing rules any writer can follow."
  task: brand-file
  role: make
  level: beginner
  thinking: medium
  thinking_why: "It turns your brand traits into clear rules and examples."
  inputs: [{type: brand_brain, required: false}, {type: persona, required: false}]
  outputs: [{type: brand_brain}]
"arnabbagxd/Brand-building-skills:skills/brand-audit":
  name: Brand health auditor
  summary: "Describe your brand as it is today. Get a clear diagnosis of what works and what is off, with ranked fixes."
  task: brand-file
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "It compares your identity, voice and position, then ranks what to fix first."
  inputs: [{type: brand_brain, required: false}, {type: web_page, required: false}]
  outputs: [{type: audit_report}]
"arnabbagxd/Brand-building-skills:skills/brand-strategy":
  name: Brand strategy report writer
  summary: "Answer a set of brand questions. Get a full brand strategy report for your business or your client."
  task: plan-strategy
  role: make
  level: intermediate
  thinking: high
  thinking_why: "It joins many answers into one strategy that must hold together."
  inputs: [{type: brief, required: true}]
  outputs: [{type: document}]
"arnabbagxd/Brand-building-skills:skills/brand-messaging":
  name: Brand messaging builder
  summary: "Give it your brand facts. Get a tagline, key messages and proof points for each audience."
  task: brand-file
  role: make
  level: beginner
  thinking: medium
  thinking_why: "It builds a message ladder from your facts and audience."
  inputs: [{type: brand_brain, required: false}, {type: persona, required: false}]
  outputs: [{type: brand_brain}]
"arnabbagxd/Brand-building-skills:skills/brand-naming":
  name: Brand name finder
  summary: "Share your brand brief. Get name ideas, or scores and honest feedback on the names you already have."
  task: brand-file
  role: make
  level: beginner
  thinking: medium
  thinking_why: "It picks between making names and judging names, then weighs each one."
  inputs: [{type: brief, required: true}]
  outputs: [{type: shortlist}]
"arnabbagxd/Brand-building-skills:skills/brand-architecture":
  name: Brand family planner
  summary: "List your brands and products. Get a clear structure for how they relate and what each one is called."
  task: brand-file
  role: make
  level: intermediate
  thinking: high
  thinking_why: "It weighs trade-offs between brand structures before choosing one."
  inputs: [{type: brand_brain, required: false}, {type: brief, required: true}]
  outputs: [{type: plan}]
"arnabbagxd/Brand-building-skills:skills/brand-manifesto":
  name: Brand manifesto writer
  summary: "Say what your brand believes and fights for. Get a bold manifesto that rallies your team and customers."
  task: write-and-tell-stories
  role: make
  level: beginner
  thinking: medium
  thinking_why: "It needs a strong point of view and careful word choice."
  inputs: [{type: brand_brain, required: false}, {type: brief, required: true}]
  outputs: [{type: copy_draft}]
"arnabbagxd/Brand-building-skills:skills/brand-story":
  name: Brand origin story writer
  summary: "Tell it how you started and why. Get an origin story and an About page that sound human."
  task: write-and-tell-stories
  role: make
  level: beginner
  thinking: medium
  thinking_why: "It finds the human truth first, then writes the story."
  inputs: [{type: brand_brain, required: false}, {type: brief, required: true}]
  outputs: [{type: copy_draft}]
"arnabbagxd/Brand-building-skills:skills/brand-launch":
  name: Brand launch planner
  summary: "Say when and where you launch. Get a rollout plan with the message and steps for each stage."
  task: plan-strategy
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It lays out a dated sequence from a set method."
  inputs: [{type: brand_brain, required: false}, {type: brief, required: true}]
  outputs: [{type: plan}]
"arnabbagxd/Brand-building-skills:skills/brand-measurement":
  name: Brand health metrics planner
  summary: "Say what your brand should achieve. Get the numbers to track, how to collect them and how to read them."
  task: track-numbers
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It picks measures to fit your goals and size."
  inputs: [{type: brand_brain, required: false}, {type: brief, required: true}]
  outputs: [{type: plan}]
"arnabbagxd/Brand-building-skills:skills/brand-packaging":
  name: Packaging brief writer
  summary: "Describe your product and brand. Get a packaging brief a designer can follow, from materials to unboxing."
  task: design-work
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It turns your brand look into specific packaging choices."
  inputs: [{type: brand_brain, required: false}, {type: brief, required: true}]
  outputs: [{type: brief}]
"arnabbagxd/Brand-building-skills:skills/rebranding":
  name: Rebrand planner
  summary: "Say why your brand must change. Get what to keep, what to change and a rollout plan."
  task: plan-strategy
  role: make
  level: intermediate
  thinking: high
  thinking_why: "It judges what to keep and what to drop, which takes careful thought."
  inputs: [{type: brand_brain, required: false}, {type: brief, required: true}]
  outputs: [{type: plan}]
"arnabbagxd/Brand-building-skills:skills/personal-brand":
  name: Personal brand planner
