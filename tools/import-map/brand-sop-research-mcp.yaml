# ---------- strands-agents/agent-sop (Apache 2.0) ----------
"strands-agents/agent-sop:skills/agent-sop-author":
  name: Agent procedure writer
  summary: "Describe a repeatable job. Get a step-by-step procedure file for your AI, with firm rules and a format check."
  task: make-skills
  role: make
  level: advanced
  thinking: medium
  thinking_why: "It follows a strict file format and fixes what the checker finds."
  needs: run shell scripts and save files
  inputs: [{type: brief, required: true}]
  outputs: [{type: skill_files}]

# ---------- ZhongHanLoo/deep-research-skill (MIT) ----------
"ZhongHanLoo/deep-research-skill:skill/deep-research":
  name: Cited research report writer
  summary: "Ask a question. Get a cited report with each claim checked against its source quote. Uses many tokens. Scrapes sites."
  task: research-topics
  role: orchestrate
  level: advanced
  thinking: high
  thinking_why: "It runs several research rounds and checks every claim against its quote."
  needs: search the web, run Python and save files
  inputs: [{type: question, required: true}]
  outputs: [{type: document}]
  scrapes: true

# ---------- Paldom/mcp-server-skills (MIT) ----------
"Paldom/mcp-server-skills:skills/mcp-server-design":
  name: MCP tool set designer
  summary: "Say what your AI should do through MCP. Get a small set of clearly named tools with plain descriptions."
  task: connect-tools
  role: make
  level: advanced
  thinking: high
  thinking_why: "Good design here decides whether an AI picks the right tool."
  inputs: [{type: brief, required: true}]
  outputs: [{type: plan}]
"Paldom/mcp-server-skills:skills/mcp-server-auth":
  name: MCP server sign-in builder
  summary: "Say how people will connect to your MCP server. Get correct OAuth sign-in built into it."
  task: connect-tools
  role: make
  level: expert
  thinking: high
  thinking_why: "Small mistakes in sign-in create real security holes."
  needs: read and edit your code
  inputs: [{type: codebase, required: true}]
  outputs: [{type: code_change}]
"Paldom/mcp-server-skills:skills/mcp-server-security":
  name: MCP attack defence reviewer
  summary: "Point it at an MCP server. Get a ranked list of attack risks, each with a fix."
  task: secure-code
  role: check
  level: expert
  thinking: high
  thinking_why: "It must think like an attacker and tell real risks from noise."
  needs: read your code
  inputs: [{type: codebase, required: true}]
  outputs: [{type: security_report}]
"Paldom/mcp-server-skills:skills/mcp-server-testing":
  name: MCP server test runner
  summary: "Point it at your MCP server. Get realistic task tests and a report on whether an AI picks the right tool."
  task: test-and-fix-code
  role: check
  level: advanced
  thinking: medium
  thinking_why: "It writes tests with checkable answers, then reads the results."
  needs: run code and save files
  inputs: [{type: codebase, required: true}]
  outputs: [{type: test_report}]
"Paldom/mcp-server-skills:skills/mcp-server-deployment":
  name: MCP server publisher
  summary: "Point it at your MCP server. Get it hosted, scaled and packaged so others can install it."
  task: ship-and-host
  role: make
  level: advanced
  thinking: medium
  thinking_why: "It follows set steps for hosting and packaging."
  needs: run commands and edit your code
  inputs: [{type: codebase, required: true}]
  outputs: [{type: deploy_url}]
"Paldom/mcp-server-skills:skills/mcp-server-implementation":
  skip: "Our MCP tool server builder and API to MCP server builder do the same job."
"Paldom/mcp-server-skills:.claude/skills/add-skill":
  skip: "Maintainer tool for this repo, only for writing its own skills."
"Paldom/mcp-server-skills:.claude/skills/publish-repo":
  skip: "Maintainer tool that publishes this repo to skills.sh, so only useful for its own repo."
