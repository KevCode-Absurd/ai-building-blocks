  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/historical-thinking/historical-document-set-curator":
  name: "History source set picker"
  summary: "Give it a history question. Get a chosen, ordered set of sources that pull in different directions."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "Picking sources that create useful tension takes judgment."
  inputs: [{type: brief, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/historical-thinking/historical-source-adapter":
  name: "History source simplifier"
  summary: "Paste a primary source and the learners' age. Get a shorter, simpler version that keeps what they need to analyse."
