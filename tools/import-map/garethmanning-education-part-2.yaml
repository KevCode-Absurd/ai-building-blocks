# GarethManning/education-agent-skills, part 2 (CC BY-SA 4.0, kept as they are)
"GarethManning/education-agent-skills:skills/global-cross-cultural-pedagogies/cross-cultural-task-validity-checker":
  name: "Cultural bias lesson checker"
  summary: "Paste a lesson or task. Get a check for cultural bias and hidden assumptions, with ways to adapt it for your learners."
  task: teach-and-train
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "It must spot assumptions the writer cannot see."
  inputs: [{type: document, required: true}]
  outputs: [{type: audit_report}]
"GarethManning/education-agent-skills:skills/global-cross-cultural-pedagogies/culturally-responsive-teaching-designer":
  name: "Culturally responsive lesson rewriter"
  summary: "Paste a lesson and describe your learners. Get a rewrite that draws on their backgrounds, communities and lived experience."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It reworks a lesson around who is in the room."
  inputs: [{type: document, required: true}]
  outputs: [{type: document}]
"GarethManning/education-agent-skills:skills/global-cross-cultural-pedagogies/emergent-project-design-scaffold":
  name: "Child-led project planner"
  summary: "Describe what young children keep asking about. Get a project plan that follows their interests into deeper inquiry."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It turns loose observations into a workable plan."
  inputs: [{type: brief, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/global-cross-cultural-pedagogies/phenomenon-based-unit-anchor":
  name: "Real-world phenomenon unit planner"
  summary: "Name a real event or puzzle. Get a unit plan that uses several subjects to explain it."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It links subjects around one real-world question."
  inputs: [{type: brief, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/global-cross-cultural-pedagogies/place-based-inquiry-anchor":
  name: "Local place lesson planner"
  summary: "Name a place near your learners. Get lessons that tie your content to that place, its community and its heritage."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It matches set content to a local setting."
  inputs: [{type: brief, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/global-cross-cultural-pedagogies/reggio-documentation-protocol":
  name: "Learning documentation planner"
  summary: "Describe a class activity. Get a way to record children's learning, share it with families and plan next steps."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It sets up a record-keeping routine that fits the setting."
  inputs: [{type: brief, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/global-cross-cultural-pedagogies/ubuntu-collective-knowledge-task-designer":
  name: "Group knowledge-building task designer"
  summary: "Give it a topic. Get a group task where learners build knowledge together and share responsibility for the result."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It shapes group roles so cooperation is real."
  inputs: [{type: brief, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/global-cross-cultural-pedagogies/variation-theory-task-designer":
  name: "Confusing concept contrast task designer"
  summary: "Name two ideas your learners mix up. Get a task of contrasting examples that shows what sets them apart."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: high
  thinking_why: "Choosing the right contrasts takes careful thought."
  inputs: [{type: brief, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/historical-thinking/central-historical-question-evaluator":
  name: "History inquiry question checker"
  summary: "Paste your main history question. Get a verdict on whether it drives real inquiry, with sharper rewrites."
  task: teach-and-train
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "It weighs a question against what it will draw out."
  inputs: [{type: question, required: true}]
  outputs: [{type: audit_report}]
"GarethManning/education-agent-skills:skills/historical-thinking/close-reading-skill-builder":
  name: "Close reading lesson builder for history"
  summary: "Give it a history source. Get a lesson series that teaches learners to read word choice, tone and bias."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It sequences practice steps for a hard skill."
  inputs: [{type: source_text, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/historical-thinking/contextualisation-skill-builder":
  name: "Historical context lesson builder"
  summary: "Give it a source and its period. Get a lesson series that teaches learners to use the time and place as evidence."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It sequences practice steps for a hard skill."
  inputs: [{type: source_text, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/historical-thinking/corroboration-skill-builder":
