"GarethManning/education-agent-skills:skills/historical-thinking/sourcing-skill-builder":
  name: "Check who wrote it lesson builder"
  summary: "Give it a history source. Get a lesson series that teaches learners to ask who wrote it, when and why."
  task: teach-and-train
  role: make
  level: intermediate
