  thinking_why: "It sequences practice steps for a hard skill."
  inputs: [{type: source_text, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/inclusive-design/udl-barrier-anticipator":
  name: "Lesson barrier spotter"
  summary: "Paste a lesson and describe your class. Get likely barriers and which ones design can fix. It does not diagnose anyone."
  task: teach-and-train
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "It predicts problems from the task and class description."
  inputs: [{type: document, required: true}]
  outputs: [{type: audit_report}]
"GarethManning/education-agent-skills:skills/inclusive-design/udl-lesson-auditor":
  name: "Accessible lesson auditor"
  summary: "Paste a lesson. Get a check against Universal Design for Learning, with fixes ranked by impact."
  task: teach-and-train
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "It reviews a whole lesson against three principles."
  inputs: [{type: document, required: true}]
  outputs: [{type: audit_report}]
"GarethManning/education-agent-skills:skills/inclusive-design/udl-options-designer":
  name: "Learning options designer"
