  summary: "Give it two or more accounts. Get a lesson series that teaches learners to find agreement, conflict and gaps."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It sequences practice steps for a hard skill."
  inputs: [{type: source_text, required: true}]
  outputs: [{type: plan}]
"GarethManning/education-agent-skills:skills/historical-thinking/document-based-lesson-designer":
  name: "Primary source history lesson planner"
  summary: "Give it a topic and sources. Get a full lesson where learners investigate a historical question from documents."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It follows a set lesson structure with your content."
