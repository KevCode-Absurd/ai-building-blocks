  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It must simplify without losing the key features."
  inputs: [{type: source_text, required: true}]
  outputs: [{type: source_text}]
"GarethManning/education-agent-skills:skills/historical-thinking/historical-thinking-assessment-designer":
  name: "History thinking quiz designer"
  summary: "Say which history skills you teach. Get short checks that show how your learners source, read, place and compare evidence."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It matches checks to specific skills."
  inputs: [{type: brief, required: true}]
  outputs: [{type: question}]
"GarethManning/education-agent-skills:skills/historical-thinking/historical-thinking-strategy-modelling-guide":
  name: "History think-aloud script writer"
  summary: "Give it a source. Get a script for talking through your thinking so learners see how a historian reads."
  task: teach-and-train
  role: make
  level: intermediate
  thinking: medium
