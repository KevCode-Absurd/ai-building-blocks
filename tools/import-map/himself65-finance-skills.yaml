# himself65/finance-skills. Tools that explain or calculate; none give buy or sell advice.
"himself65/finance-skills:plugins/data-providers/skills/finance-sentiment":
  name: Stock chatter tracker
  summary: Give it stock tickers. Get how much Reddit, X, news and Polymarket talk about each, and whether the mood is rising.
  task: money-and-investing
  role: source
  level: intermediate
  thinking: low
  thinking_why: It fetches numbers and reports them side by side.
  inputs: [ { type: question, required: true } ]
  outputs: [ { type: audit_report } ]
  needs: run code and use your Adanos API key
