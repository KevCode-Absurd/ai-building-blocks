"JimLiu/baoyu-skills:skills/baoyu-danger-gemini-web":
  skip: Marked danger by its maker. It uses unofficial Gemini web access with browser cookies, which we do not copy.
"JimLiu/baoyu-skills:skills/baoyu-danger-x-to-markdown":
  skip: Marked danger by its maker. It uses a reverse-engineered X interface with saved login cookies, which breaks our no-logins rule.
"JimLiu/baoyu-skills:skills/baoyu-electron-extract":
  skip: Takes apart other companies' installed desktop apps to read their source, so it is not a safe skill to list.
"JimLiu/baoyu-skills:skills/baoyu-markdown-to-html":
  skip: Built around WeChat Official Account themes and styling, so it mainly serves a Chinese app.
"JimLiu/baoyu-skills:skills/baoyu-post-to-wechat":
  skip: Only posts to WeChat Official Accounts, a Chinese app.
"JimLiu/baoyu-skills:skills/baoyu-post-to-weibo":
  skip: Only posts to Weibo, a Chinese app.
"JimLiu/baoyu-skills:skills/baoyu-wechat-summary":
  skip: Only works on WeChat group chats through a local WeChat tool.
"JimLiu/baoyu-skills:skills/baoyu-xhs-images":
  skip: Made for Xiaohongshu and WeChat image posts, so it mainly serves Chinese apps.
"JimLiu/baoyu-skills:skills/baoyu-post-to-x":
  skip: Posts by driving your real logged-in Chrome with scripts, not an official API. It acts on a live social account, which breaks our rules.
"JimLiu/baoyu-skills:skills/baoyu-url-to-markdown":
  skip: Scrapes pages with a scripted Chrome, handles logins and CAPTCHAs, and has site adapters, so it breaks our logins and CAPTCHA rules.
"JimLiu/baoyu-skills:skills/baoyu-youtube-transcript":
  skip: Pulls captions through an unofficial YouTube interface, retries around bot detection and can use browser cookies, so it breaks our bot-check rule.
