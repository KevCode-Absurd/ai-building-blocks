# JimLiu/baoyu-skills (MIT). Skipped: the two "danger" skills, anything that posts to or works with WeChat, Weibo or Xiaohongshu, and anything that scrapes.
"JimLiu/baoyu-skills:.claude/skills/release-skills":
  name: Release preparer
  summary: Point it at your project. Get the version bumped, a changelog written and a tagged release ready to publish.
  task: ship-and-host
  role: orchestrate
  level: intermediate
  thinking: medium
  thinking_why: It reads your changes, sorts them, then follows set release steps.
  inputs: [{type: codebase, required: true}]
  outputs: [{type: code_change}, {type: document}]
  needs: run code and read your project files
