"nexscope-ai/eCommerce-Skills:competitive-pricing-strategy":
  name: Price position planner
  summary: Give it your costs and rival offers. Get a price for each product, response rules for rival discounts, and a rollout plan.
  task: set-prices
  role: orchestrate
  level: advanced
  thinking: high
  thinking_why: It weighs costs, rival offers and brand position before it picks a price.
  inputs: [ { type: product_data, required: true }, { type: competitor_set, required: false } ]
  outputs: [ { type: plan } ]
"nexscope-ai/eCommerce-Skills:dynamic-pricing-ecommerce":
  name: Repricing rules designer
  summary: Give it your margins and stock. Get safe automatic price rules, test cases, and a kill switch you can trust.
  task: set-prices
  role: make
  level: expert
  thinking: high
  thinking_why: One bad rule can cost real money, so each rule needs checking.
  inputs: [ { type: product_data, required: true }, { type: performance_sheet, required: false } ]
  outputs: [ { type: plan } ]
"nexscope-ai/eCommerce-Skills:price-optimization-tool":
  name: Price test planner
  summary: Give it your costs and sales data. Get the best price to try, three outcome cases, and a test you can undo.
  task: set-prices
  role: make
  level: advanced
  thinking: high
  thinking_why: It checks if the data is good enough before it recommends any price.
  inputs: [ { type: performance_sheet, required: true }, { type: product_data, required: false } ]
  outputs: [ { type: plan } ]
"nexscope-ai/eCommerce-Skills:ecommerce-competitor-analysis":
  name: Rival store comparer
  summary: Name your top rivals. Get a side-by-side of their channels, prices and messages, plus the gaps you can win.
  task: study-competitors
  role: compress
  level: intermediate
  thinking: medium
  thinking_why: It gathers public facts and sorts them into clear gaps.
  inputs: [ { type: product_data, required: true } ]
  outputs: [ { type: competitor_set } ]
  needs: search the web and open pages
"nexscope-ai/eCommerce-Skills:product-description-generator":
  name: Product listing writer
  summary: Give it your product facts. Get a title, bullets and description built for the marketplace you sell on.
  task: write-landing-page
  role: make
  level: beginner
  thinking: medium
  thinking_why: It follows a set copy method and fits each site's limits.
  inputs: [ { type: product_data, required: true }, { type: competitor_set, required: false } ]
  outputs: [ { type: pdp_copy } ]
  needs: open web pages
"nexscope-ai/eCommerce-Skills:ecommerce-marketing-strategy-builder":
  name: Ninety day marketing plan builder
  summary: Describe your store. Get a buyer profile, your best channels, a budget split, and a 90 day action plan.
  task: run-your-store
  role: orchestrate
  level: intermediate
  thinking: medium
  thinking_why: It follows set steps but picks channels to fit your business.
  inputs: [ { type: product_data, required: true } ]
  outputs: [ { type: plan } ]
"nexscope-ai/eCommerce-Skills:ecommerce-social-media-marketing":
  skip: Our platform-native content planner already builds the monthly calendar by platform, and the rest is generic outline.
"nexscope-ai/eCommerce-Skills:ecommerce-content-marketing":
  name: Content calendar builder
  summary: Give it your product and platforms. Get topics from real customer words, rival content gaps, and a ready calendar.
  task: grow-social
  role: make
  level: intermediate
  thinking: medium
  thinking_why: It mines customer words and rival posts, then builds the calendar.
  inputs: [ { type: product_data, required: true }, { type: voc_reviews, required: false } ]
  outputs: [ { type: plan } ]
  needs: search the web and open pages
"nexscope-ai/eCommerce-Skills:ecommerce-growth-strategy":
  name: Growth roadmap builder
  summary: Tell it your stage and numbers. Get the growth lever that pays most now, plus a step by step roadmap.
  task: run-your-store
  role: orchestrate
  level: intermediate
  thinking: high
  thinking_why: It weighs five growth levers against your stage and numbers.
  inputs: [ { type: product_data, required: true }, { type: performance_sheet, required: false } ]
  outputs: [ { type: plan } ]
"nexscope-ai/eCommerce-Skills:ecommerce-email-marketing-builder":
  name: Store email flow writer
  summary: Describe your store. Get ten email flows with full copy, who gets each one, and a year of campaigns.
  task: write-emails
  role: make
  level: intermediate
  thinking: medium
  thinking_why: It follows a fixed set of flows and writes copy for each.
  inputs: [ { type: product_data, required: true }, { type: brand_brain, required: false } ]
  outputs: [ { type: email_flow } ]
"nexscope-ai/eCommerce-Skills:cross-border-ecommerce":
  name: Overseas market planner
  summary: Name your store and goals. Get ranked countries, shipping and tax costs, and a phased plan to sell abroad.
  task: run-your-store
  role: orchestrate
  level: advanced
  thinking: high
  thinking_why: Tax, shipping and law choices differ by country and carry real cost.
  inputs: [ { type: product_data, required: true } ]
  outputs: [ { type: plan } ]
  needs: search the web
"nexscope-ai/eCommerce-Skills:brand-protection/brand-protection-amazon":
