  inputs: [ { type: spreadsheet, required: true }, { type: codebase, required: false } ]
  outputs: [ { type: document, required: true } ]
  author: Nimrod Fisher
  author_url: https://github.com/nimrodfisher
"nimrodfisher/data-analytics-skills:02-documentation-knowledge/semantic-model-builder":
