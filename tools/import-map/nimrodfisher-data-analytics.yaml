# nimrodfisher/data-analytics-skills (MIT)
"nimrodfisher/data-analytics-skills:01-data-quality-validation/data-quality-audit":
  name: Data quality scorecard maker
  summary: "Give it a dataset and your rules. Get checks for blanks, duplicates, broken links and stale data, plus a scorecard."
  task: track-numbers
  role: check
  level: intermediate
  thinking: medium
  thinking_why: "The checks are set steps, but the severity calls need judgment."
  inputs: [ { type: spreadsheet, required: true }, { type: brief, required: false } ]
  outputs: [ { type: audit_report, required: true } ]
  needs: run code and open files
  author: Nimrod Fisher
  author_url: https://github.com/nimrodfisher
"nimrodfisher/data-analytics-skills:01-data-quality-validation/programmatic-eda":
  skip: Same job as our Dataset profiler and New dataset explorer, so we keep those.
"nimrodfisher/data-analytics-skills:01-data-quality-validation/query-validation":
  name: SQL query launch reviewer
  summary: "Give it a SQL query before it goes live. Get wrong-result risks, slow spots and rewrites ranked by impact."
  task: track-numbers
  role: check
  level: advanced
  thinking: medium
  thinking_why: "It follows a checklist, but each fix depends on your database."
  inputs: [ { type: codebase, required: true }, { type: brief, required: false } ]
  outputs: [ { type: audit_report, required: true } ]
  needs: run code
  author: Nimrod Fisher
  author_url: https://github.com/nimrodfisher
"nimrodfisher/data-analytics-skills:02-documentation-knowledge/analysis-assumptions-log":
  name: Analysis assumptions logger
  summary: "Tell it about your analysis. Get every assumption logged with its risk, so reviewers see what could change the answer."
  task: document-work
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "Spotting which assumptions matter most takes some judgment."
  inputs: [ { type: brief, required: true } ]
  outputs: [ { type: document, required: true } ]
  author: Nimrod Fisher
  author_url: https://github.com/nimrodfisher
"nimrodfisher/data-analytics-skills:02-documentation-knowledge/analysis-documentation":
  name: Analysis write-up builder
  summary: "Give it your finished analysis. Get a write-up with the question, data, method, results and steps to rerun it."
  task: document-work
  role: make
  level: intermediate
  thinking: medium
  thinking_why: "It fills a set structure, but needs a clear read of your audience."
  inputs: [ { type: codebase, required: false }, { type: brief, required: true } ]
  outputs: [ { type: document, required: true } ]
  author: Nimrod Fisher
  author_url: https://github.com/nimrodfisher
"nimrodfisher/data-analytics-skills:02-documentation-knowledge/data-catalog-entry":
  name: Data catalog entry writer
  summary: "Give it a table and its owner. Get a plain entry with column meanings, quality notes, sources and who may use it."
  task: document-work
  role: make
  level: intermediate
  thinking: low
  thinking_why: "It fills a fixed template from facts you give it."
  inputs: [ { type: spreadsheet, required: true }, { type: brief, required: false } ]
  outputs: [ { type: document, required: true } ]
  needs: connect to your database
  author: Nimrod Fisher
  author_url: https://github.com/nimrodfisher
"nimrodfisher/data-analytics-skills:02-documentation-knowledge/metric-reconciliation":
  name: Metric mismatch tracer
  summary: "Tell it which number differs between two reports. Get the gap, the step where they split and a fix."
  task: track-numbers
  role: check
  level: intermediate
  thinking: high
  thinking_why: "Finding the exact split point means reading two calculations closely."
  inputs: [ { type: brief, required: true }, { type: spreadsheet, required: false } ]
  outputs: [ { type: audit_report, required: true } ]
  author: Nimrod Fisher
  author_url: https://github.com/nimrodfisher
"nimrodfisher/data-analytics-skills:02-documentation-knowledge/schema-mapper":
  name: Column mapping document writer
