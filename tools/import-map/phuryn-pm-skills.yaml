# phuryn/pm-skills (MIT, Pawel Huryn). 69 skills in 9 plugin folders, each skill appears once.
# Product management, discovery, strategy and go-to-market. Many overlap skills we already have; those are skipped.

"phuryn/pm-skills:pm-ai-shipping/skills/code-review":
  skip: "Another code reviewer; we already have many (Hidden bug hunter, Code change reviewer, Parallel code reviewer)."
"phuryn/pm-skills:pm-ai-shipping/skills/intended-vs-implemented":
  name: Code intent gap auditor
  summary: "Give it your docs and code. Get each place the code breaks its own rules, with a fix."
  task: secure-code
  role: check
  level: expert
  thinking: high
  thinking_why: "It must trace rules through the code and prove each gap is real."
  inputs: [ { type: codebase, required: true }, { type: document, required: true } ]
  outputs: [ { type: security_report } ]
  needs: read your code files
"phuryn/pm-skills:pm-ai-shipping/skills/shipping-artifacts":
  name: Ship-ready docs writer
  summary: "Point it at an AI-built app. Get the short set of docs a reviewer needs: architecture, permissions, secrets and test map."
  task: document-work
  role: make
  level: advanced
  thinking: medium
  thinking_why: "It reads the code and writes set documents, with some judgment on what applies."
  inputs: [ { type: codebase, required: true } ]
  outputs: [ { type: document } ]
  needs: read your code files
