"seb1n/awesome-ai-agent-skills:agent-security/skill-supply-chain-audit":
  skip: Checks skills for hidden risks, which few people need and our own skill checks already cover.
"seb1n/awesome-ai-agent-skills:context-engineering/context-injection":
  skip: Narrow prompt-plumbing skill for builders; overlaps context-optimization and adds little for most people.
"seb1n/awesome-ai-agent-skills:context-engineering/context-ranking":
  skip: Narrow retrieval-tuning skill for builders; overlaps context-optimization.
"seb1n/awesome-ai-agent-skills:context-engineering/context-retrieval":
  skip: Search-index plumbing for builders, not a job most people hire for.
"seb1n/awesome-ai-agent-skills:security/threat-modeling":
  skip: Same job in the same form as the openai/skills threat model skill we already list, so we keep one.
"seb1n/awesome-ai-agent-skills:ai-ml-operations/data-labeling":
  skip: Narrow machine-learning tooling skill with little use outside ML teams.
