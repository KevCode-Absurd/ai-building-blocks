"sickn33/agentic-awesome-skills:skills/market-sizing-analysis":
  name: Market size estimator
  summary: Give it a market or product idea. Get a TAM, SAM and SOM estimate built top-down and bottom-up, with sources.
  task: plan-strategy
  role: make
  level: intermediate
  thinking: high
  thinking_why: It builds the numbers two ways and checks that they agree.
  inputs: [ { type: brief, required: true } ]
  outputs: [ { type: plan } ]
  needs: search the web for market data
"sickn33/agentic-awesome-skills:skills/marketing-mindset":
