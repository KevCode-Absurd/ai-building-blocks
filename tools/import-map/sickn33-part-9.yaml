  summary: Ask whether a marketing move will work. Get a straight verdict with the reasons, including "not worth doing".
  task: plan-strategy
  role: check
  level: beginner
  thinking: high
  thinking_why: It weighs your numbers and rivals before it gives a verdict.
  inputs: [ { type: question, required: true }, { type: offer, required: false } ]
  outputs: [ { type: feedback_notes } ]
  author: Axel Freeman
  author_url: https://github.com/axelfreeman
