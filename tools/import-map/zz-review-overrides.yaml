# Daniel Agrici's per-platform audits read notes from ads/references/ at the repo top, so we copy the ones each needs into the skill.
# They fill gaps: we had no Google (beyond exports), TikTok, LinkedIn or Microsoft account audit.
"AgriciDaniel/claude-ads:skills/ads-google":
  name: Google Ads account auditor
  summary: "Give it your Google Ads exports. Get a checked audit of tracking, search terms, Shopping, Performance Max, bids and budgets."
  task: read-ad-results
  role: check
  level: advanced
  thinking: high
  thinking_why: "It weighs many settings at once and says where data is missing."
  needs: "read your ad exports, and optionally read your Google Ads account with your own read-only access. Changes stay as drafts for your approval"
  inputs: [ { type: performance_sheet, required: true }, { type: brief, required: false } ]
  outputs: [ { type: audit_report, required: true }, { type: plan, required: true } ]
  bring: [ { from: ads/references/google-audit.md, to: ads/references/google-audit.md, link: ads/references/ }, { from: ads/references/gaql-notes.md, to: ads/references/gaql-notes.md } ]
