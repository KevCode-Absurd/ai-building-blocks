new_slug: ad-ab-test
name: "Test two ads head to head and read the winner"
summary: "Test two ads head to head with a fair split-run plan, a reply offer that brings enough replies, and a plain call on which ad won."
job: plan-ad-tests
thinking: high
thinking_why: "It plans a fair test, then judges whether a result is real. Give it your strongest model."

headline: "A fair test of two ads, and a plain call on which one won"
subhead: "Give it two versions of an ad, email or page. It plans a split-run test with one change and a key on each, picks a reply offer that brings enough replies, and waits while you run it. Then it reads your counts and tells you to keep, rerun or stop."

explain: |
  Most tests of two ads are not fair. One ran on a Monday and the other in a quiet week. One sat at the top of the page. When a gap shows up, nobody can say whether the ad caused it. Then a small gap gets called a win, and the result is luck.

  This workflow plans the test so only the thing you changed can explain a gap. Both versions go out at the same time to matched halves of the same audience, each with its own code. It picks a small reply offer, the same in both, and checks it will bring about a hundred replies a version without drawing people who only want something free. You run the test and count the replies. Then it states the gap as a percentage, checks it against luck, follows replies through to sales and cost, and gives a plain call. The method follows John Caples's Tested Advertising Methods.

when:
  - You have two ads, emails or pages and want to know which sells more before you put money behind one.
  - A past test gave a result nobody trusted.
  - You can send each version to a few thousand people, or run both at the same time on a platform.
not_for:
  - "You have one ad and nothing to compare it with: check it with the Ad response copy editor, or ask a customer to read it."
  - "You only want to know if an ad's meaning lands: use the Ad meaning test planner."
  - "Your channel cannot split an audience evenly or run both at once: compare before and after with the Ad change decision checker."

you_give:
  - The two versions of the ad, email or page
  - Your offer and what a reply means (optional)
  - Your product facts, so a reply item can be chosen (optional)
  - Time to run the test and count replies by version
you_get:
  - A test plan with one difference, a code for each version and the audience size needed
  - A reply offer, identical in both versions, with the lines to use
  - A winner rule written before launch, with a read date
  - After the test, the gap as a percentage, a luck check and a keep, rerun or stop call
  - A record of what the test taught and the next test to run

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give it both versions, your usual reply rate and the audience you can reach.
  - It plans the test and the reply offer. Put the same offer lines and the codes into both versions and launch them together.
  - When the read date arrives, count replies and sales by code and bring the counts back for step 3.
output_sample:
  input:
    - Your two versions of the ad, email or page
    - Your usual reply rate for the channel
    - The size of the audience you can reach
    - Your offer and what counts as a reply (optional)
    - Replies and sales counted by code, after the test
  prerequisites:
    - An AI that can read files, to run the handoff pack
    - Time to run both versions together and count replies
  output:
    - name: "Step 1: Fair split-run test plan"
      contains: The one difference, what stays equal, a code for each version, the audience needed and the winner rule.
    - name: "Step 2: Reply offer"
      contains: A small offer, the same in both versions, with the ad line, reply form and thank-you lines.
    - name: Pause
      contains: You run both versions at the same time and count replies and sales by code.
    - name: "Step 3: The result"
      contains: The gap as a percentage, a luck check, a fairness check, cost per reply and sale, and a keep, rerun or stop call.
    - name: Lesson record and next test
      contains: What the test taught, with the date and audience, and the next test to run.
    - name: Hand-back summary
      contains: Each step's file and every MISSING line in one list.

how_it_works:
  - title: Plan a fair split-run test
    text: "Finds every difference between the versions and narrows the test to one. Splits the audience into matched halves, gives each version a code and sets the reply target and winner rule before launch."
  - title: Set a reply offer that brings enough replies
    text: "Picks a small free or low-cost item that relates to what you sell, decides whether to show or hide it and compares expected replies with the target. The offer is the same in both versions."
  - title: Run the test
    text: "A pause. You run both versions at the same time and count replies and sales by code."
  - title: Read the result
    text: "States the gap as a percentage, checks it against luck, checks the test stayed fair and follows replies through to sales and cost. Ends with keep, rerun or stop, a lesson record and the next test."

output_shape: |-
  STEP 1: FAIR SPLIT-RUN TEST PLAN
    One difference: <...> | Held equal: <...>
    Split: <...> | Codes: A <...> B <...>
    Size: <replies target> / <reply rate> = <audience per version>
    Winner rule: <number that decides | gap that counts | read date>

  STEP 2: REPLY OFFER
    Offer: <item, shown or hidden, any screen>
    Expected against target: <range>
    Lines: <ad line, reply form, thank-you>

  PAUSE: run both versions together and count replies by code

  STEP 3: THE RESULT
    Gap: <leader> is <n> percent better | Luck check: <likely real / borderline / too small>
    Fair? <what matched, what broke> | Cost: <per reply, per sale>
    Call: <keep / rerun / stop> because <reason>
    Lesson record: <difference | result | date | audience>
    Next test: <...>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
    CHECKS MISSED: <checks that failed or could not run, or none>

tweaks:
  - what: Your reply rate
    how: Give the real reply rate for the channel. The audience size in step 1 is worked from it.
  - what: What counts as a reply
    how: Say if it is a click, a form, a call or a sale. All three steps use the same meaning.
  - what: More than two versions
    how: Say so in step 1. It plans rounds or a control version for the rest.
  - what: Sales data
    how: Bring sales by code to step 3 if they arrive later. The call can change when they do.

judge:
  - Only one thing differs between the versions, or the test is split into more than one.
  - Both versions run at the same time, each with its own code.
  - The reply offer is the same item, in the same words and place, in both.
  - The winner rule and read date were written before launch.
  - The call is keep, rerun or stop, and a small test is never called a win.

test:
  - Give it two versions that differ in three ways. Step 1 should split them into separate tests.
  - Check your codes after launch. Could you tell which version brought each reply?
  - Give step 3 a large gap on 20 replies in all. It should say the test is too small.
  - Run the same pair a second time at the end of a series. The call should hold.

improve:
  - Keep every lesson record in one file and read it before you plan the next test.
  - Save your reply rates for each channel, so the audience sum is exact next time.
  - Keep one control version per channel and run each new idea against it.
  - Pair it with "Write headlines and pick the winner with a small test" when the two versions differ by headline.

works_best_with:
  tools:
    - {name: "Your email tool or ad platform", why: "Most have an even split option and export counts by code."}
    - {name: "A spreadsheet", why: "Holds the codes, counts and read dates for every test."}
  inputs:
    - "Your usual reply rate for each channel"
    - "The size of the audience you can reach with each version"
    - "Your record of past tests"

terms:
  - term: Split-run test
    meaning: A test where each version goes to a matched half of the same audience at the same time.
  - term: Key
    meaning: A code on each version that lets you trace every reply back to it.
  - term: Control
    meaning: The version you keep as a yardstick and run each new version against.
