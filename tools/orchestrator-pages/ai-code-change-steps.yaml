new_slug: ai-code-change-steps
name: Make a code change in small tested steps with AI
summary: Plan a code change in small tested steps. Describe the change and get a test list, split-up edits and rules for your AI coding helper.
job: build-software
thinking: high
thinking_why: It has to split real code edits correctly and write rules an AI agent will follow. Give it your strongest model.
headline: Make a code change in small tested steps with an AI helper
subhead: Describe the change you want. It writes a list of cases to test, smallest first, before any code. Then it splits the change into tidy-up steps and new-behaviour steps, and writes a plan file and standing rules so your AI coding helper works one test at a time.
explain: |
  A big code change made in one go is hard to review and hard to undo. Tidy-ups get mixed with new behaviour, so when something breaks nobody can say which edit did it. An AI coding helper makes this worse. Left alone, it writes a lot of code at once, adds features nobody asked for, and may delete or switch off a test that is in the way.

  The steps keep each move small. First it lists the cases the change must handle, smallest first, without saying how to build it. Then it labels each edit as structure (how code is arranged) or behaviour (what it does) and puts them in separate steps. Last, it writes a plan file and rules that make your AI helper take one test at a time and commit only on green. The order comes from Kent Beck's writing on test-driven development, starting with Canon TDD.
when:
  - You are changing code, with or without an AI helper, and want every step small and safe.
  - You have a large messy change and need to split it into pieces someone can review one at a time.
  - Your AI coding helper keeps adding things you did not ask for, and you want rules that hold it to one test at a time.
not_for:
  - "You are making a one-line fix or a throwaway prototype: write a plain test, or just make the edit and check it by hand."
  - "You want your AI helper to start coding the first test right now: take the plan file from this workflow and give it to your coding helper."
  - "You need a review of code that is already merged: ask a teammate to read the commits, since this workflow plans changes before they are made."
you_give:
  - The change you want to make, in your own words
  - What the code does today, and any code or notes (optional)
  - Cases you already know about, such as past bugs (optional)
  - The change as a diff or list of edits, if it is already written (optional)
  - A short description of the project and the tools it uses
  - Rules your team already has for commits and checks (optional)
you_get:
  - The change in one line, and a list of cases to test, smallest first, with the one to turn into a real test now
  - Every edit labelled as structure or behaviour, grouped into small steps, with when to run your tests
  - A plan file with the ordered tests, a one-word command for your helper, and standing rules with warning signs to watch
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe the change you want. It writes the test list first.
  - Put the plan file and rules in your project, then start your AI helper with the one-word command.
  - Check the commit history as you go. The rules are written so you can tell if they were followed.
output_sample:
  input:
    - The change you want to make, in your own words
    - What the code does today, and any code or notes (optional)
    - Cases you already know about, such as past bugs (optional)
    - The change as a diff or list of edits (optional)
    - Your team's commit and check rules (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini
    - An AI coding helper for the plan file, if you want to build the change with one
  output:
    - name: Test list
      contains: The change in one line, cases to test from smallest to largest, and the one case to turn into a real test now.
    - name: Small steps
      contains: Each edit labelled as structure or behaviour, grouped into tidy-up steps and new-behaviour steps, with when to run your tests.
    - name: Plan file
      contains: The ordered tests, a one-word command for your helper and the order to work in.
    - name: Standing rules
      contains: Rules that keep your helper on one test at a time, with warning signs to watch for.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: List the test cases
    text: Writes the change in one line, lists the cases it must handle, including old behaviour that must stay, and puts the smallest first.
  - title: Split the change
    text: Takes the test list and labels each edit as structure or behaviour, then puts tidy-ups and new behaviour in separate small steps.
  - title: Write the helper's rules
    text: Takes the ordered steps and writes a plan file, a one-word command and standing rules so the helper does one test at a time.
output_shape: |-
  STEP 1: TEST LIST
    The change in one line | cases, smallest first, none about how to build it | the one case to turn into a real test now

  STEP 2: SMALL STEPS
    Each edit as structure or behaviour, and how easy to undo | tidy-up steps | behaviour steps | which tidy-ups help | order and when to run tests

  STEP 3: HELPER RULES
    Plan file with the ordered tests | one-word command | standing rules | warning signs | when to take the design back

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
    CHECKS MISSED: <checks that failed or could not run, or none>
tweaks:
  - what: How much old behaviour you list
    how: Say what must keep working. Cases for old behaviour are what stop a tidy-up from breaking something.
  - what: The change as a diff
    how: If the change is already written, give the diff. Step 2 can then label real edits instead of guessing from your description.
  - what: Your commit rules
    how: Tell it how your team commits and what checks must pass. The standing rules use them so the helper cannot commit on red.
judge:
  - Each case on the list says what should happen, not how to build it.
  - The smallest and most useful case comes first.
  - No step mixes a structure edit with a behaviour edit.
  - The helper rules can be checked from the commit history.
  - The warning signs include loops, unasked features and deleted or switched-off tests.
test:
  - Give it a change where you already know an edge case. That case should appear on the list.
  - Give step 2 a diff that mixes a rename with a new rule. It should split them into two steps.
  - Run your AI helper for one case with the rules. It should write one failing test, then the least code to pass it, and stop.
improve:
  - Add the bugs you have had before as known cases, so every new list starts with them.
  - Edit the standing rules to match your team, such as your branch names, commit style and checks.
  - Keep the plan file in the project, so a new session of your helper can pick up where the last one stopped.
