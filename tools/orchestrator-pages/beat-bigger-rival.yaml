new_slug: beat-bigger-rival
name: "Beat a bigger rival with a model it cannot copy"
summary: "Paste your rivals. Get gaps, a model the leader would lose by copying, and what to build while the window is open."
job: plan-strategy
thinking: high
thinking_why: "It builds a loss-and-gain sum for a rival from limited facts and then judges how long the window stays open. Give it your strongest model."

headline: "Beat a bigger rival with a model it loses money by copying"
subhead: Paste your rivals. It finds where the leader is weak, designs a model the leader would lose by copying, and checks the window stays open for years. You get the model, the sum that proves it and a second edge to build with the time it buys.

explain: |
  Being a little better than a larger rival rarely wins. A bigger firm can match a price cut, a feature or an ad. What it cannot match easily is a model that attacks the part of its business that pays for everything else.

  This workflow runs four steps. The first maps where the leader is weak and where its own model holds it back. The second designs a model that is better for some buyers, and does a sum of what the leader would lose and gain by copying it. The third checks how long the window stays open and who else could use the same model. The fourth finds your market stage and picks a second power to build while the leader holds back.

  The protection is from the leader only. It does not stop another newcomer using the same model. The workflow says so and plans for it. It rests on a third-party summary of a strategy book, so its claims are kept modest.

when:
  - A larger rival dominates your market and being a little better has not worked.
  - You are choosing a price model, a sales route or a product design and want one the leader would find costly to match.
  - You have a new model and want to know if the leader will copy it the moment it works.

you_give:
  - Your rivals, with what each offers and charges
  - Customer reviews or quotes about the rivals (optional)
  - Your idea for doing the job differently, if you have one (optional)
you_get:
  - The gaps nobody covers well, and where the leader's model holds it back
  - A model that is better for named buyers, with the leader's copy sum
  - A ten-year check on how long the window stays open and who else could copy you
  - A second power to build with the time you gain, with a first test

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your rivals and anything you know about how the leader earns. It works step by step and saves each result.
  - Check the leader's figures in the copy sum against its price lists and annual reports before you act.

how_it_works:
  - title: Finds where the leader is weak
    text: Lists what buyers value, marks the gaps nobody covers well and notes where the leader's own model forces a trade-off.
  - title: Finds a model the leader would lose by copying
    text: Writes how the leader earns, designs your model, and works out what the leader would lose and gain by copying it.
  - title: Checks it lasts ten years
    text: Asks how long the window stays open, who else could copy the model and what would end the edge.
  - title: Plans what to build while the window is open
    text: Finds your market stage and picks a second power, such as scale or switching costs, with a first test.

output_shape: |
  STEP 1: WHERE THE LEADER IS WEAK
    Gaps: <> | Leader trade-offs: <>

  STEP 2: THE MODEL
    Leader earns from: <lines> | Your model: <> | Better for: <buyers>
    Copy sum: leader loses <> vs gains <> | Net: <> | Call: <strong / weak / not counter-positioning>

  STEP 3: TEN YEARS OUT
    Window: <how long> | Others who could copy: <> | What could end the edge: <>

  STEP 4: BUILD WHILE THE WINDOW IS OPEN
    Stage: <> | Power: <> | First test: <> | Pass line: <number> | Check in: <date>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: The leader's figures
    how: Paste price lists, channel mix and any revenue split. The copy sum in step 2 is only as good as these.
  - what: How the leader's people are paid
    how: Say if sales staff or partners earn on the current model. It is often the real reason the leader holds back.
  - what: Your own cost per sale
    how: Give it so step 2 can say whether you undercut the leader or only match it.

judge:
  - Each step used the result of the step before.
  - The model is better for named buyers, not only different.
  - The copy sum shows its arithmetic and marks every estimate.
  - A price cut alone is never called counter-positioning.
  - The limit about other newcomers is stated.

test:
  - Give it a model that only cuts price. Step 2 should call it weak.
  - Run it twice on the same input. The call in step 2 should be the same, even if the wording differs.
  - Stop it after step 2 and check the leader's figures yourself before letting it carry on.

improve:
  - Replace estimates in the copy sum with the leader's real figures as you find them.
  - Rerun after the leader changes its pricing or channels.
  - Pair it with "Find which of seven powers you hold or can build" once the model is running, to score what you have built.

works_best_with:
  tools:
    - {name: "Claude", why: "Holds four steps, the leader's figures and your model in one run."}
  inputs:
    - "The leader's price list and annual report"
    - "Customer reviews of the rivals"
    - "Your cost per sale"

terms:
  - term: Counter-positioning
    meaning: A better business model that the market leader does not copy because copying would hurt its existing business.
  - term: Copy sum
    meaning: What the leader would lose from its current customers and partners, set against what it would gain from new ones.
  - term: Window
    meaning: The time before the leader copies you or another newcomer catches up.
