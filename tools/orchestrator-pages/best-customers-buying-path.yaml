new_slug: best-customers-buying-path
name: Find your best customers and rebuild how they buy
summary: Paste your customer list with what each paid. Get your best customers and the steps every new lead should follow.
job: understand-customers
thinking: high
thinking_why: It has to find real patterns in your customer data and not invent them. Give it your strongest model.
headline: Find your best customers and rebuild how they buy
subhead: Give it your customer list with what each one paid and how long they stayed. It finds your top fifth and the traits they share. Then it looks at what those customers read or did before buying and turns it into steps every new lead should follow.
explain: |
  Most businesses chase more customers of any kind. The best ones, who pay the most, stay longest and are good to work with, get lost in the average. So the same ads, the same pitch and the same follow-up go to everyone, and the people who would have been your best customers get the weakest path to buying.

  The steps fix this in two moves. First it sorts your customers by what they paid, how long they stayed and how much you like working with them, keeps the top fifth, and finds the few traits they share. Then it takes what that group saw or did before buying, counts how many did each thing, and adds the missing steps to every lead's path. The order comes from the lost chapter on your first avatar in Alex Hormozi's $100M Offers.
when:
  - You want more customers like your best ones and are not sure what makes them different.
  - Your best customers all seem to have read, watched or done something before they bought, and you want every lead to do it.
  - Your sales team picks which content to send by feel and you want a shortlist that is based on what worked.
you_give:
  - A customer list with what each one paid and how long they stayed
  - A note on how good each one is to work with (optional)
  - Survey answers, reviews or emails from customers, in their words
  - What each top customer read, watched or did before buying, if you know it (optional)
  - Your brand file (optional)
  - Weeks to run the test it sets up, with and without the new steps
you_get:
  - Your top fifth of customers and the three to five traits they share
  - A plain profile of your best customer, who does not fit, and the channels they came through
  - The steps every new lead should follow before sales talks to them
  - A shortlist of your best pieces for sales to hand-pick from, and a test with a rule for what counts as a win
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Share your customer list and their words. It finds your best customers and writes the profile.
  - Add what those customers did before buying. It builds the new path and the test.
  - Run the test for the number of weeks it sets, then compare leads who got the steps with leads who did not.
how_it_works:
  - title: Find your best customers
    text: Sorts your customers, keeps the top fifth, finds the fewest traits they all share, and names who does not fit and where they came from.
  - title: Rebuild how they buy
    text: Takes the profile from the step before and what those customers did first, counts each step, and adds the missing ones to every lead's path.
output_shape: |-
  STEP 1: YOUR BEST CUSTOMERS
    Top fifth | three to five shared traits, each checked | plain profile | who does not fit | channels they came through | what the data cannot show

  STEP 2: THE NEW BUYING PATH
    How many top customers did each step | the pattern most share | steps to add to every lead | shortlist of pieces for sales | test with a win rule

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: What counts as best
    how: Say whether you care most about what they paid, how long they stayed or how much you enjoy working with them. The top fifth changes with that choice.
  - what: How much of the customers' own words you give it
    how: Survey answers and emails in their words show why they bought. Without them the profile rests on numbers alone and says so.
  - what: What you track before a sale
    how: The new path is only as good as the record of what customers did first. If you do not track it, ask a few top customers and add what they say.
judge:
  - The traits are shared by nearly all of the top group, not a few of them.
  - The profile says who does not fit, not only who does.
  - Each step in the new path shows how many top customers did it.
  - It checks whether weaker customers skipped the same steps.
  - Nothing about your customers is made up, and gaps are listed.
test:
  - Give it a customer list where you already know your three best clients. They should appear in the top fifth.
  - Run step 1 twice. The traits can be worded differently but should name the same things.
  - Check the test it sets up. It should compare leads who got the steps with leads who did not, with a rule for a win written before the test starts.
improve:
  - Save the profile and the channels into your brand file, so ads, sales calls and follow-up all aim at the same person.
  - Repeat the run every quarter with new customers, so the profile keeps up with who is paying you now.
  - Add the "does not fit" list to your lead form or your sales script, so those people are sent somewhere else early.
