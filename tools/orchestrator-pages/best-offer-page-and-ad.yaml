new_slug: best-offer-page-and-ad
name: "Find your best offer and write the page and ad"
summary: "Find the offer worth testing, then get an article-style page, a 30-point check and a matching ad. Built from your brand file and live deals."
job: make-offer

headline: "Find your best offer and write the page and ad"
subhead: Give it your brand file and a list of what is live now. It finds the clashes in your live deals and three offers to try first, writes an article-style page for the one you pick, checks that page in 30 points, then writes the matching ad.

explain: |
  Many shops run deals that quietly clash, such as a pop-up with one discount while an ad shows another. Fix that and choose one offer to test before you write a page or an ad. Two deals that disagree lose the sale.

  Step 1 copies down what is live, flags the clashes and lists what you already have to offer, such as sizes, prices, guarantee and delivery. It picks three offers to try first and words each one three ways, then waits for you to choose one. Step 2 writes an article-style page for the offer you choose. The page is labelled "Advertisement" and has the offer block near the end. Step 3 runs 30 yes-or-no checks on that page and ranks the five fixes to make first. Step 4 applies those fixes to the page text, then writes the article-style ad that sends people to it, with one claim and an image brief.

when:
  - Your site and ads show different deals and you're not sure which one is real.
  - You want to test a new offer but don't know which one to try.
  - Readers click through to your page from an ad that reads like a news story.
not_for:
  - You have no live deals to check. Skip the offer step and start with the Article-style landing page writer.
  - You already chose your offer. Use the Article-style landing page writer, then the 30-point landing page checker.
  - You only need to review a page you already have. Use the Landing page conversion review.

you_give:
  - Your brand file, with prices, deals, guarantee and terms
  - Every deal live now, such as ads, pop-ups and site offers, and where you saw each
  - A short brief for the ad: who the offer is for and what it should say
  - Your cost per order, if you know it (optional)
  - Customer reviews (optional)

you_get:
  - The clashes in your live deals, and three offers to try first
  - An article-style page labelled "Advertisement", with the offer block
  - 30 yes-or-no checks, five fixes in order and a score out of 100
  - An article-style ad with one claim, and an image brief

how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and the skill files this workflow uses.
  - Give the folder to Claude, in Claude Code or as files in a Claude Project. Say "Follow HANDOFF.md". This needs an AI that can read and save files.
  - Add your brand file, a list of every deal live now with where you saw each one, and a short brief for the ad.
  - Let it work step by step. Fix any clash it finds before you launch, and check the price and terms against your own records.
  - Pick the offer to take forward when step 1 gives you three.
  - The ad step applies the five fixes from the 30-point check to the page text. Make the same fixes on your real page.
  - Keep "Advertisement" above the page headline and keep the label your platform adds to the ad. The run stops if the page has no label.
  - Use the ad copy and the image brief to build your ad. Check your platform's ad rules before you publish.
output_sample:
  input:
    - Your brand file, with prices, deals and terms
    - Everything live now, such as ads, pop-ups and site offers, and where you saw each
    - Who the offer is for (optional)
    - Customer reviews (optional)
    - Your costs and margin floor (optional)
  prerequisites:
    - An AI that can read files, so it can follow HANDOFF.md and save each step's result
    - Your brand brain from the Website brand brain builder (optional, makes the result better)
  output:
    - name: step-01-hidden-offer-finder.md
      contains: Your live deals, the clashes between them, and three offers to try first, each worded three ways.
    - name: step-02-article-landing-page.md
      contains: An article-style page labelled as an ad, with ten sections and an offer block showing price and terms.
    - name: step-03-landing-page-30-point-checker.md
      contains: Thirty yes-or-no checks with quoted evidence, five ranked fixes and a score out of 100.
    - name: step-04-article-style-image-ad-writer.md
      contains: The ad headline, main text, one claim and an image brief that sends people to the checked page.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.

how_it_works:
  - title: Finds the offer
    text: Uses the hidden offer finder to list what is live, flag clashes, take stock and turn it into offers for a buyer and a stage.
  - title: Writes the page
    text: Uses the article-style page skill to keep the ad's promise on the first screen, label the page as an ad and build the offer block.
  - title: Checks the page
    text: Uses the 30-point checker to run yes-or-no checks at five stops, quote the page for every no and rank five fixes. The run stops if the Advertisement label is missing.
  - title: Writes the ad
    text: Uses the article-style ad skill on the page with the five fixes applied. It writes the headline as an editor would, holds one claim, briefs the image and checks the page pays off the headline.

output_shape: |
  LIVE DEALS
  <deal> (<where seen>) | Clash: <with what>

  OFFERS TO TRY FIRST
  1 <offer> | Buyer: <who> | Why now: <reason> | Wording: <three ways>

  ARTICLE-STYLE PAGE
  Label: <ad label> | Headline: <headline>
  Sections: <ten, in four moves> | Offer block: <price, terms, guarantee>

  30-POINT CHECK
  No: <check, evidence, fix> ... Five fixes: 1 ... 5 | Score: <n>/100

  ARTICLE-STYLE AD
  Headline: <text> | Main text: <text> | Claim: <one> | Image brief: <text>

  HAND-BACK SUMMARY
  Files: <each step's file> | MISSING: <every line, in one list>

example:
  business: sprout
  input: |
    [the handoff pack] Follow HANDOFF.md.
    Brand file: sprout-brand/
    Live now: ad says 61% off, pop-up says 55% off, first box $29.99.
  output: |
    LIVE DEALS
    Ad: 61% off | Pop-up: 55% off | Clash: two discounts

    OFFERS TO TRY FIRST
    1 First box $29.99, then $49.99 every 4 weeks, said plainly | Buyer: the price doubter

    ARTICLE-STYLE PAGE
    Label: Advertisement | Offer block: $29.99 first box, renews at $49.99

    30-POINT CHECK
    No 27 (deal-breaker): pop-up says 55%. Fix: one figure everywhere. Score: 68/100

    ARTICLE-STYLE AD
    Claim: the first box is $29.99 | Image brief: a torn pack on a kitchen table

tweaks:
  - what: Which offer to take forward
    how: Name the offer you prefer from the three. The page and ad are then built on that one.
  - what: Where the ad runs
    how: Say the platform in your brief. Check its length and image rules before you upload.
  - what: How it is bought
    how: Say whether people buy once, subscribe or come back. The offer block then shows the full cost of that path.
  - what: A page you already have
    how: Paste your current page and ask for the 30-point check on that too, to see what the new one fixes.

judge:
  - Every deal in the clash list is quoted from something live, with where it was seen.
  - The offer's price, terms and dates match your records.
  - The page is clearly labelled as an ad.
  - Every no in the 30-point check quotes a line from the page.
  - The ad holds one claim, and the page backs it.

test:
  - Check the offer's price and terms against what you offer in your store.
  - Put the ad next to the page's first screen. The promise should carry over.
  - Take one no from the check and find the line it quotes on the page.
  - Run the new ad and page against your current best for a week.

improve:
  - In the builder, drop step 1 if you already know your offer and have no clashes. Then give step 2 your offer.
  - Add a step at the end that sizes an A/B test for the page.
  - Swap step 3 for the landing page auditor if you want fixes ranked by quick wins.
  - Pair it with the workflow that finds where a page loses buyers, once it has live traffic.

works_best_with:
  tools:
    - {name: "Claude", why: "Keeps the live deals, the offer terms and the page claims straight across four steps."}
  inputs:
    - "A screenshot of every live ad and pop-up, so clashes can be quoted"
    - "Your cost per order, so each offer shows what it costs you"
    - "Customer reviews, so the page uses real doubts"

terms:
  - term: Article-style page
    meaning: A page written like an article, labelled as an ad.
  - term: Clash
    meaning: Two deals or prices live at the same time that disagree.
