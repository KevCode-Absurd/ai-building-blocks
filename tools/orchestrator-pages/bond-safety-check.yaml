new_slug: bond-safety-check
name: Check if a bond or loan is safe to hold
summary: "Get a safe, speculative or reject call on a bond or loan. Paste the debt terms and the borrower's accounts; it tests cover and cushion."
job: money-and-investing
thinking: high
thinking_why: It runs four skills in a row and each one does sums and judgment on the last. Give it your strongest model.
headline: Find out if a borrower can keep paying, even in a bad year
subhead: Give it the debt terms and about seven years of the borrower's earnings. It sorts the loan as an investment or a speculation. It tests whether average earnings cover every debt, and what the business is worth beyond what it owes. Then it writes a safe, speculative or reject call, with its reasons.
explain: |
  Is this bond or loan safe? It is safe only if the borrower keeps paying. A good year proves little, and a pledge of property helps less than it sounds, because pledged assets lose value just when they are needed. A high rate is the usual bait for thin numbers.

  This workflow follows the method in the 1940 edition of Security Analysis by Benjamin Graham and David Dodd. It starts by asking if the loan is an investment or a speculation. It then tests the borrower's average earnings against all its debts together, and tests how much the owners' stake is worth next to what the borrower owes. The bars start at about 1.75 to 3 times for earnings cover and 0.5 to 1.0 for the cushion, depending on how steady the business is. The call comes from rules that exclude rather than persuade. It is a method of analysis, not financial advice. It never says buy or sell.
when:
  - You are about to lend to a business and want a test beyond "they seem solid".
  - You are looking at a bond, a note or a preferred share and want to know how well it is covered.
  - A borrower offers a high rate, a short term or collateral to make up for thin numbers.
  - You already hold a loan and a new set of accounts has just come out.
not_for:
  - "You are weighing a share, not a loan: use Value a stock with a margin of safety."
  - "You want to know if the business is worth owning for years: use Find out if a business is worth owning long term."
  - "You only have a year or two of accounts. The average needs about seven years, and five will do."
  - "You want to be told what to buy or how much to put in. Ask a licensed adviser. This gives a call on one loan."
you_give:
  - The loan or bond terms and the price you would pay
  - About seven years of the borrower's income statements (five will do)
  - The borrower's other debts and lease payments
  - What the owners' stake is worth, from a low share price or a fair private price (optional)
  - The most you could lose without harm (optional)
you_get:
  - A first label of investment or speculation
  - Average earnings cover against every fixed charge, in a bad year too
  - The cushion of value behind the debt, against a bar for the type of business
  - A safe, speculative or reject call, with ranked reasons and what would change it
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste the loan terms, the price you would pay, why you like it, and the borrower's income statements and debts.
  - It runs four steps and saves each result. A missing figure is marked MISSING, never guessed.
  - Read the final call first, then the cover and cushion tests behind it. Run it again when new accounts come out.
how_it_works:
  - title: Labels the loan
    text: Asks whether careful study promises safety of your money and a fair return at this price. If not, it says speculation.
  - title: Tests earnings against all debt
    text: Adds every fixed charge, averages earnings over about seven years and sets the cover against a bar that fits the business.
  - title: Tests the cushion
    text: Divides what the owners' stake is worth by the total debt, and reads it next to the earnings test.
  - title: Writes the call
    text: Checks size, record and honest accounts. It does not relax the bar for a near due date, a high rate or a pledge, and says what would change the call.
output_shape: |-
  STEP 1: LABEL
    Investment or speculation: <label> | Why: <test result>

  STEP 2: EARNINGS COVER
    Total charges: <amount> | Cover: <x> on two bases | Bar: <x> | Call: <pass / borderline / fail>

  STEP 3: CUSHION
    Total debt: <amount> | Cushion: <amount> | Ratio: <x> | Bar: <x> | Call: <pass / fail>

  STEP 4: THE CALL
    <MEETS THE BAR / SPECULATIVE AT THESE TERMS / REJECT>
    Why, ranked: <list> | What would change it: <facts> | Test again: <date>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
output_sample:
  input:
    - "The loan or bond terms and the price you would pay"
    - "About seven years of the borrower's income statements"
    - "The borrower's other debts and lease payments"
    - "Why you like the loan (what you would say if asked)"
  output:
    - {name: "Step 1 label", contains: "Investment or speculation, with the test result that decided it."}
    - {name: "Step 2 earnings cover", contains: "All fixed charges, average earnings on two bases, the bar and a pass, borderline or fail."}
    - {name: "Step 3 cushion", contains: "Total debt, the owners' stake, the ratio against its bar, and how far the stake can fall."}
    - {name: "Step 4 call", contains: "Meets the bar, speculative at these terms, or reject, with ranked reasons."}
    - {name: "What would change the call", contains: "The facts that would move the call, and a date to test again."}
    - {name: "Hand-back summary", contains: "Each step's file and every MISSING line in one list."}
tweaks:
  - what: Before or after tax
    how: Say which one your earnings figures are. After tax is the stricter test.
  - what: A low share price
    how: Give a low from the last slump. A peak price flatters the cushion.
  - what: Your lending limit
    how: Say the most you could lose without harm. A speculative call is then sized to it.
judge:
  - Each step used the result of the step before.
  - Every fixed charge is in the total, and no prior-deductions figure was used.
  - No bar was relaxed for a near due date, a high rate or a pledge.
  - The call says what would change it.
  - No step invented a figure, and nothing was named as a security to buy or sell.
test:
  - Run it on a business loan you know well and check the cover against your own sum.
  - Give it a loan with a high rate and thin cover and check it holds the bar.
  - Run it twice on the same facts. The call should not change.
improve:
  - Save your own bars by type of business, from loans you have made.
  - Keep a log of past calls and what happened.
  - Run "Earnings padding detector" on the borrower's accounts before step 2 if the numbers look too good.
terms:
  - term: Cover
    meaning: How many times average earnings cover the yearly charges on all the borrower's debts.
  - term: Cushion
    meaning: The value of everything that ranks behind your claim, mainly the owners' stake. It takes the first losses.
  - term: Bar
    meaning: The lowest cover or cushion the method accepts for that type of business. A less steady business needs a higher bar.
next: [business-worth-owning, stock-margin-of-safety]
works_best_with:
  tools:
    - {name: "Claude", why: "Keeps the four steps in one run, so each test uses the one before."}
    - {name: "A spreadsheet", why: "Lets you check the cover sum and try a different rate or year range."}
  inputs:
    - "The borrower's debt note or the bond terms"
    - "Its annual report, for the debts and lease payments"
    - "A low share price from the last slump, if it is listed"
