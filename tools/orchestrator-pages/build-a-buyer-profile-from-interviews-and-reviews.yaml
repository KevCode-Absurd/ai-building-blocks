new_slug: build-a-buyer-profile-from-interviews-and-reviews
name: Build a buyer profile from interviews and reviews
summary: Build a buyer profile from interviews and reviews. Give it your orders and reviews. Get call sheets, a profile in buyers' words and a writer brief.
job: understand-customers
thinking: high
thinking_why: It runs five skills in a row and sorts real quotes into buyer groups. Give it your strongest model.
headline: Know your real buyer, in their own words
subhead: Give it your order records and any reviews. It builds interview sheets for recent buyers, digs through reviews and forums for their words, and writes a profile based on the job they hire you for. You also get a half-page brief for writers and a check of your ad or page against it.
explain: |
  Most buyer profiles are an age, a gender and a guess. Ads written from them sound like everyone else's and speak to no one. If you sell to a mix of people, you can't tell which of them matters or what pushed them to buy.

  This workflow replaces guesses with quotes. Step 1 uses your order records to write a call sheet for each recent buyer. The run then pauses while you call five to eight of them, write notes and gather reviews and forum posts. Step 2 mines your notes, reviews and posts for the words buyers use. Step 3 groups the stories by the job each buyer hired you for and writes a profile for each group. Step 4 boils it to a half-page brief for writers. Step 5 checks your current ad or page against the profile.
when:
  - You sell to a mix of people and want to know which one buys most, and why, before you write ads or pages.
  - Your ads get views but not sales, and you suspect they speak to the wrong person.
  - You have reviews or support emails sitting unused and want them turned into something your writers can use.
not_for:
  - "You have no buyers yet: use the Forum buyer researcher on its own, with public posts and reviews."
  - "You only want to find where your buyers spend time online: use the Customer community finder."
  - "You only need a script for one buyer call: use the Customer purchase interview script writer."
you_give:
  - Your order list with dates, times, devices, items bought together and order value
  - Buyers who agreed to a call (use codes, not names)
  - Your product, its price, the problem it solves and what it replaced for buyers
  - Reviews, survey answers or support emails (optional)
  - Forum posts you read and paste by hand (optional)
  - Your org context (optional)
  - Your current ad copy or landing page, to check against the profile (optional)
you_get:
  - A call sheet for each buyer, pre-filled from their order, with a consent line
  - A one-page sketch of who buys, with quotes and the exact phrases they use
  - Buyer profiles built on the job they hire you for, each with a trigger, proof and a not-for line
  - A half-page brief for ad and page writers
  - A fit score out of 100 for your ad or page, with rewrites in the buyer's words (if you give an ad or page)
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Ask each buyer before you list them for a call. It only builds sheets for people who agreed.
  - When it pauses, call five to eight recent buyers, write notes right after each call, and collect reviews and forum posts from the same group.
  - Bring the notes back and let the later steps run. Remove names and contact details first. Paste only reviews and posts you can already see, and take out usernames.
output_sample:
  input:
    - Your order list with dates, devices, items bought together and order value
    - Buyers who agreed to a call, shown as codes not names
    - Your product, price and what it replaced for buyers
    - Reviews, survey answers or support emails (optional)
    - Your current ad or landing page, to check against the profile (optional)
  prerequisites:
    - An AI that can read files, such as Claude Code or a Claude Project
    - Five to eight recent buyers who agree to a call
    - Your org context from the Org context builder (optional, makes the result better)
  output:
    - name: Interview sheets
      contains: One sheet per buyer code with order facts, timeline questions, gap questions and a consent line.
    - name: Buyer sketch
      contains: Search phrases, marked-up quotes and a one-page sketch of who buys, in their own words.
    - name: Buyer profiles
      contains: Each profile has the job, trigger, what they stopped using, quotes, a not-for line and confidence.
    - name: Buyer brief
      contains: A half-page for writers with how much the buyer knows, the force to work on, quotes and a job line.
    - name: Fit check
      contains: A fit score out of 100 for your ad or page, with mismatches and rewrites.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Write the interview sheets
    text: Picks recent buyers from your orders. Writes a call that builds a timeline of the day they bought, with questions only where the order leaves a gap.
  - title: Dig for their words
    text: Gives you search phrases and a timed hour for forums and reviews. You read and paste by hand. It marks up your call notes and the quotes you paste, and writes a one-page sketch of the buyer.
  - title: Build the buyer profiles
    text: Groups stories by the struggle behind the purchase, not by age. Writes the job, the trigger, three or more quotes and who it is not for. Steps 4 and 5 use these profiles.
  - title: Write the buyer brief
    text: Settles how much the buyer knows and which force to work on. Boils it to a half page of quotes and a job line.
  - title: Check your copy against it
    text: Tests whether your ad or page sounds like this buyer. Scores the fit out of 100 and lists rewrites.
output_shape: |-
  STEP 1: INTERVIEW SHEETS
    One sheet per buyer code: order facts | timeline questions | gap questions | consent line | how to group the stories

  STEP 2: BUYER SKETCH
    Search phrases | marked-up quotes | one-page sketch with the buyer's own words

  STEP 3: BUYER PROFILES
    Each profile: job | trigger timeline | what they stopped using | quotes | not-for line | confidence

  STEP 4: BUYER BRIEF
    Awareness | forces | the one to work on | quotes | job line

  STEP 5: FIT CHECK
    Pass or fail per buyer field | fit score out of 100 | mismatches | rewrites

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How recently they bought
    how: Buyers from the last few weeks remember the day. Older orders give vaguer stories.
  - what: How many stories you bring
    how: Fewer than five gives guesses, and every profile says so. Five to eight gives leads, not proof.
  - what: Where the reviews and posts come from
    how: Paste only reviews and posts you can already see, such as your own reviews, survey answers and public threads. Read forum posts by hand and paste the words, without usernames. Do not use a scraper.
  - what: A reward for the call
    how: A small gift card helps people say yes. Tell step 1 what you offer.
judge:
  - Every profile rests on quotes with a source type and date, and none is written from a guess.
  - The job is a situation sentence with verbs and nouns, not words like "convenient" or "premium".
  - No names, emails or profile links are kept anywhere.
  - Each profile has a not-for line, and the brief picks one force to work on.
  - The fit score lists what it left out because you did not supply it.
test:
  - Call one buyer before the rest and see if the sheet's questions got them telling a story, not listing features.
  - Read a profile aloud to your support team. Ask if they know the person it describes.
  - Pick a review it did not use and check if it fits a profile. If it fits none, a group is missing.
improve:
  - Add your own interview questions to the sheet skill, for what your product replaced.
  - Save the profiles and brief in your org context so every ad and page skill starts from them.
  - Repeat the forum hour for each new buyer group, and call more buyers each quarter.

terms:
  - term: Job
    meaning: The progress a buyer wants in a certain moment. Profiles are built on the job, not on age or gender.
  - term: Not-for line
    meaning: A line on each profile that says who the product will disappoint.
