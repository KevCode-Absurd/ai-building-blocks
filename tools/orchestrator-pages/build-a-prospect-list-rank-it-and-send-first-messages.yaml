new_slug: build-a-prospect-list-rank-it-and-send-first-messages
name: Build a prospect list, rank it and send first messages
summary: Build a prospect list from your ideal customer, rank it, and get checked first messages plus a daily block to send them. Free workflow.
job: sell-and-negotiate
thinking: high
thinking_why: It judges who to approach and writes messages real strangers will read. Give it your strongest model.
headline: Build a prospect list, rank it and send first messages
subhead: Give it who your ideal customer is and what you offer. It builds a qualified prospect list, ranks it by fit and activity, writes a first message a stranger can answer in Aaron Ross's manner, checks its claims, and plans a daily prospecting block the way Jeb Blount teaches.
explain: |
  Outbound sales fails in two quiet ways. The list is wrong, so good messages go to people who will never buy. Or the list is fine but nobody works it, because prospecting is the task everyone puts off until the quarter is lost.

  This workflow fixes both. Step 1 builds a prospect list from your ideal customer, with a reason each account fits, the person to contact and a public source for each. Step 2 ranks it by fit and activity so the first hour goes to the best accounts. Step 3 writes a first message a stranger can answer in one line, following Aaron Ross's rule that the first email asks for a referral or a short answer, never a meeting. Step 4 tests each claim about the prospect against page text you paste in, and checks the basics of commercial email. Step 5 plans a protected daily prospecting block, with a two-minute research batch and one real reason to reach out, the way Jeb Blount teaches. You send the messages yourself.
when:
  - You have a product people like and no pipeline.
  - You have a long list of names and have contacted none of them.
  - Your first emails get no reply and you do not know whether it is the list or the message.
not_for:
  - "You want to sell more to people who already bought: use your own customer list and a short note from you, not this workflow."
  - "You sell to shoppers, not businesses: this builds lists of companies and roles, so use a simple ad or store page plan instead."
  - "A prospect has already replied: write your next message by hand, since this only writes first messages to strangers."
you_give:
  - "Your ideal customer: company type, size, role, the problem they have"
  - What you offer and the price
  - Your current list, if you have one (optional)
  - Your week and how much time you can give to prospecting
  - The text of each prospect's own page, so step 4 can check claims about them
  - Your brand file, for voice and approved claims (optional)
you_get:
  - A qualified prospect list with the reason each fits, the person to contact and a public source for each
  - The list ranked into tiers by fit and activity
  - A first message under 60 words, a 30-word email and a 15-second call opening, with each claim about the prospect checked
  - A daily prospecting block with a research batch and a reason to reach out
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your ideal customer, your offer and your week. It builds and ranks the list.
  - Paste the text of the prospect pages the message refers to. Step 4 checks each claim against it.
  - Read the first message and the checker's notes. Fix any claim it flagged. Add your postal address and an opt-out line if it says they are missing.
  - Send to the top tier yourself, in your daily block. Keep a log of replies so you can use it later.
output_sample:
  input:
    - "Your ideal customer: company type, size, role and the problem they have"
    - What you offer and the real terms, such as price
    - Your current list of prospects (optional)
    - Your week and how much time you can give to prospecting
  prerequisites:
    - Your brand brain from the Brand profile builder (optional, but it helps)
    - Your offer from the New offer opportunity finder (optional, but it helps)
  output:
    - name: Prospect list
      contains: Accounts that match your ideal customer, with the reason each fits, the right person to contact and a public source.
    - name: Ranked list
      contains: Each account scored on fit and activity and sorted into tiers, so the first hour goes to the best.
    - name: First message and short versions
      contains: A message under 60 words, a 30-word email and a 15-second call opening, asking a stranger for a referral or a short answer.
    - name: Checked message
      contains: Each claim about the prospect checked against the page text you supplied, the basics of commercial email listed, and a tightened version.
    - name: Daily prospecting block
      contains: A protected daily time slot, a two-minute research batch per prospect and one real reason to reach out.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Build the list
    text: Builds a list of accounts that match your ideal customer, with the reason each fits, who to contact and a public source. A contact with no source is marked MISSING.
  - title: Rank it
    text: Reads the list from step 1. Scores each account out of 100 on fit and activity, and sorts the list into tiers.
  - title: Write the first message
    text: Reads the top tier from step 2 and your offer. Writes a first message under 60 words, a 30-word email and a 15-second call opening that ask a stranger for a referral or a short answer, in Aaron Ross's manner.
  - title: Check it before sending
    text: Tests each claim about the prospect against the page text you paste in, marks claims about you that need proof, checks the subject line, length and the single ask, and lists the commercial email basics. Hands back a tightened version.
  - title: Send in daily batches
    text: A pause. Send the checked message to the top tier yourself, from your own address, in small daily batches.
  - title: Plan the daily block
    text: Uses the ranked list from step 2 and your week, not the step 4 messages. Plans a protected daily prospecting block with a research batch and one real reason per prospect, in Jeb Blount's method.
output_shape: |-
  STEP 1: PROSPECT LIST
    <account> | Fits because: <...> | Contact: <role, name if public> | Source: <URL, date> or MISSING

  STEP 2: RANKED
    Tier A (<n>): <accounts> | Tier B: <...> | Tier C: <...> | Scored on: <fit, activity>

  STEP 3: FIRST MESSAGE
    Subject: <...> | Body: <under 60 words, about them, one easy ask> | Short versions: <30-word email, 15-second call opening>

  STEP 4: CHECKED
    Claims about them: <each, backed or unsupported> | Claims about you: <backed or needs proof> | Tightened version: <...> | Before you send: <postal address, opt-out line>

  PAUSE: send to tier A yourself, in daily batches

  STEP 5: DAILY BLOCK
    When: <time, length> | Research batch: <2 minutes each, what to look for> | Reason to reach out: <...>
    End-of-day count: <calls made, conversations held, opportunities added>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
example:
  business: sprout
  input: |
    [the workflow]
    Sprout, a daily greens gummy brand. We want wholesale accounts: independent gyms and boutique fitness studios that sell supplements at the front desk.
    Ideal customer: a studio or gym with 300 to 2,000 members, one to three locations, already sells a protein or hydration product at the counter, in Texas, Arizona or Colorado. Contact: the owner or the general manager.
    Offer: a 12-pack display case at wholesale $11.50 (retail $19.97), free first display, 30-day terms, reorder by text.
    Why they'd care: members ask for greens, powders don't sell at a desk because they need a shaker, our packs sell as a grab-and-go.
    Current list: none.
    My week: I can give 45 minutes a day, 7:30 to 8:15, before the store wakes up.
  output: pending
tweaks:
  - what: The ideal customer
    how: Give the size, place and the sign they already buy something like yours. The list is only as good as this.
  - what: Your offer
    how: Give the real price and terms. Step 3 writes from your offer, and step 4 flags any claim about you that needs proof.
  - what: The ask
    how: Say if you want a referral, a yes or no, or a sample request. The message asks for one thing.
  - what: Your time
    how: Give the real minutes per day. The block is planned to that, and never more than you will keep.
judge:
  - Every account on the list has a reason it fits that you agree with.
  - Tier A is small enough to work in a week.
  - The first message is under 60 words, is about them, and asks for one thing that is not a meeting.
  - The checker flagged every claim without a source and the final message has none.
  - The daily block fits your calendar and names what to look up in two minutes.
test:
  - Give it an ideal customer that is too broad ("any gym"). Step 1 should ask you to narrow it.
  - Paste a first message that opens with your company history. Step 3 should rewrite it to open with them.
  - Add a made-up statistic to the message. Step 4 should cut it.
  - Run step 2 twice. The tier A accounts should be the same both times.
improve:
  - Once you have enough replies and no-replies, paste them and ask step 2 to reweigh its scoring. The ranking skill suggests waiting for about 90 days of results first.
  - Save your offer and your ideal customer in one file and paste it every run.
  - Keep every first message you sent and its reply rate in one sheet. Step 3 can start from the best.
  - Pair it with "Find your niche, write the first message, split sales jobs" if you are not sure who the ideal customer is yet.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Every step is a plan or a piece of writing.
    - name: A spreadsheet or CRM
      why: Holds the list, the tiers and who you have contacted.
    - name: Your own email account
      why: Send from it, in small batches, so replies reach you.
  inputs:
    - The text of each prospect's own page, so claims about them can be checked
    - A list of your best current customers and what they share
    - Replies to past outreach, good and bad
    - Public signals that an account is buying (job posts, new locations)
terms:
  - term: Prospecting
    meaning: Finding and contacting people who might buy, before they have shown any interest.
  - term: Tier
    meaning: A group of accounts ranked together by how well they fit and how active they are.
