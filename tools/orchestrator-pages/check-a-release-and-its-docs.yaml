new_slug: check-a-release-and-its-docs
name: Check a release and its docs
summary: Share your change and release plan. Get test gaps, stale docs and a rollout plan with rollback checks.
job: ship-and-host
headline: Check a release and its docs
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your change and release plan. Get test gaps, stale docs and a rollout plan with rollback checks. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your change and release plan. Get test gaps, stale docs and a rollout plan with rollback checks.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - Coverage gaps
  - Documentation drift
  - Rollout and rollback plan
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: Test coverage gap investigator
    text: Share your repo or change. Get missing, weak and stale tests ranked by the behavior at risk. Hands the rollout step those gaps as known risks.
  - title: Code and docs drift checker
    text: Works from your code change and your docs. Get outdated docs and missing instructions traced to the changed behavior. Hands the rollout step the list of docs to fix.
  - title: Service rollout and rollback planner
    text: Share a release or infrastructure change. Uses the test gaps and stale docs from steps 1 and 2 as risks and tasks. Get preflight checks, rollout stages, health signals and a rollback plan.
output_shape: |-
  Coverage gaps
  Documentation drift
  Rollout and rollback plan
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
not_for:
  - You want a go or no-go verdict on your code and a list of blockers. Use the Ship readiness gate.
  - You only need a read-only report on migrations, config, secrets and rollout order. Use the Release readiness reviewer.
  - You only need the missing tests for one code change. Use the Test gap finder.
output_sample:
  input:
    - Your repo or the code change you plan to release
    - Your docs, such as README, setup guide, API docs and changelog
    - Your release plan, with the target environment and any downtime limits
    - Your goal and deadline
  prerequisites:
    - An AI that can read your code and docs (a code tool or uploaded files)
  output:
    - name: Coverage gaps
      contains: Missing, weak and stale tests, ranked by the behaviour at risk, from the Test coverage gap investigator.
    - name: Documentation drift
      contains: Docs that no longer match the code, each tied to the change that broke it, from the Code and docs drift checker.
    - name: Rollout and rollback plan
      contains: Preflight checks, rollout stages, health signals and rollback steps, from the Service rollout and rollback planner.
    - name: Final summary
      contains: Source coverage, unresolved findings, missing facts and one next action.
