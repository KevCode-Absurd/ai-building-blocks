new_slug: check-an-ai-app-improvement
name: Check an AI app improvement
summary: Share your AI app and proposed change. Get evaluation criteria, feedback loops and an evidence-based comparison plan.
job: set-up-ai
headline: Check an AI app improvement
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your AI app and proposed change. Get evaluation criteria, feedback loops and an evidence-based comparison plan. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your AI app and proposed change. Get evaluation criteria, feedback loops and an evidence-based comparison plan.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - Evaluation criteria and cases
  - Feedback loop design
  - Quality findings and next experiment
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: AI app evaluation planner
    text: Share your AI app and goal. Get test cases and a way to compare changes with real results. Hands step 2 the success criteria and cases.
  - title: Agent answer feedback designer
    text: Share an agent task. Uses the success criteria from step 1 as the standard for a good answer. Get checks and feedback loops to improve the quality of its answers.
  - title: AI workflow quality investigator
    text: Reads your own workflow files and uses the test cases and checks from steps 1 and 2 to show where it disappoints. Get its weak points ranked, with causes and practical fixes.
output_shape: |-
  Evaluation criteria and cases
  Feedback loop design
  Quality findings: five scores out of 5, the three worst problems ranked, a fix for each
  Next experiment: the one change to try next, in a short paragraph
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
not_for:
  - You want to compare an old prompt with a new one on the same test cases. Use the Prompt change tester.
  - Your app is not Python code, or your AI cannot run code. Use the AI agent tester for a test set and a ship or hold memo.
  - You want one agent to check and fix its own answers. Use the Agent answer feedback designer.
output_sample:
  input:
    - Your AI app's code, or a description of the job it does
    - The change you want to make, and what a good answer looks like
    - One agent task that gives weak answers (optional)
    - A workflow that disappoints you (optional)
  prerequisites:
    - A Python 3.10 or newer app that calls an AI model
    - An AI tool that can read your code and run commands, because the evaluation step runs the app
  output:
    - name: Evaluation criteria and cases
      contains: Test cases, scoring rules and a repeatable pass or fail run, from the AI app evaluation planner.
    - name: Feedback loop design
      contains: A rewritten task prompt, a rubric, critique and refine prompts and stop rules, from the Agent answer feedback designer.
    - name: Quality findings
      contains: Five scores out of 5, the worst problems ranked, and a fix for each, from the AI workflow quality investigator.
    - name: Next experiment
      contains: The one change to try next, with source coverage, unresolved findings and missing facts.
