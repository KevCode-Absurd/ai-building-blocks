new_slug: check-real-demand-for-your-idea-then-run-one-cheap-test
name: Check demand for your idea, then run one cheap test
summary: Check demand for your idea before you build it. Get real buyer words, the one fact that could kill it, and a cheap test with a pass mark.
job: test-an-idea
thinking: medium
thinking_why: Each step is short, but the kill check has to be honest. A mid-size model is enough.
headline: Find out if people want your idea before you build it
subhead: Give it your idea. It reads what people post about the problem, tries to kill the idea with one hard fact, then designs a cheap test with a pass mark you set first.
explain: |
  Most ideas die for a plain reason that was findable in a week. People never complained about the problem, or they already fixed it another way, or they would not pay. You feel sure because you have not looked yet, and building feels easier than asking.

  The steps look first, then judge, then test. It reads public posts about the problem and groups the pain, the workarounds and the buying signals. It turns that into a short buyer brief. It then tries to kill the idea and names the one fact that would end it. If the idea survives, it designs two or three cheap tests, each with a pass mark. The pause asks you to run the cheapest test for a week or two and compare the numbers with the pass mark. The first step may need a ScrapeCreators account to read posts. If you would rather not, paste posts you gathered yourself.
when:
  - You have an idea and have not built anything yet.
  - Friends say it is great, but nobody has paid or signed up.
  - You can only afford one small test before you decide to go on.
not_for:
  - "Your idea already has paying customers: use a market-sizing check, or ask those customers what they want next."
  - "You have no idea yet: talk to five people in your field about their daily problems first."
  - "You want a full business plan or a financial forecast: ask an accountant or use a plan template."
you_give:
  - Your idea in a sentence or two, and who you think it is for
  - The words you would search for to find people with the problem
  - Anything you already know about rivals or workarounds (optional)
  - Your brand file (optional)
you_get:
  - A list of what people complain about, how they cope today and when they say they would buy, with links
  - A half-page buyer brief in their own words
  - A verdict on the idea, with the one fact that could end it
  - Two or three cheap tests, each with a method, a number to watch and a pass mark
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Write the idea as a question, such as "do people want a way to do X?".
  - Run the cheapest test it picks for one to two weeks. Compare the numbers with the pass mark and stop if they fall short.
output_sample:
  input:
    - Your idea in a sentence or two, and who it is for
    - The words you would search for to find people with the problem
    - What you know about rivals or workarounds (optional)
    - Your brand brain (optional)
  prerequisites:
    - A ScrapeCreators account (paid) if you want step 1 to read public posts, or posts you gathered and pasted yourself
    - An AI that can read files, such as Claude Code or a Claude Project
  output:
    - name: "Step 1: What people post"
      contains: Complaints, workarounds and buying signals about the problem, each with a link, plus a demand score.
    - name: "Step 2: Buyer brief"
      contains: The moment that sends people looking, the forces for and against, their own words, and the job in one line.
    - name: "Step 3: The kill check"
      contains: A verdict on the idea, the one fact that could end it, and the cheapest test left.
    - name: "Step 4: Cheap tests"
      contains: The claim as a share of people who will act, two or three tests, a number to watch and a pass mark.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every missing item in one list.
how_it_works:
  - title: Find the pain people post about
    text: Turns your idea into search phrases, reads public posts and comments, and groups complaints, workarounds and buying signals with links.
  - title: Write a buyer brief from the evidence
    text: Picks the moment that sends people looking and the force that matters most, and keeps their own words.
  - title: Try to kill the idea
    text: Checks the brief against known ways ideas die and looks for live proof that people pay. Ends with dead and why, or alive and the test left.
  - title: Design a cheap test with a pass mark
    text: Writes the claim as a share of people who will act, then gives two or three small tests such as a page, a pre-order or a sign-up.
  - title: Run the test (your step)
    text: You run the cheapest test for one to two weeks and write down the numbers against the pass mark.
output_shape: |-
  STEP 1: WHAT PEOPLE POST
    Pains | workarounds | buying signals | links | demand score

  STEP 2: BUYER BRIEF
    The moment | forces for and against | their words | the job in one line

  STEP 3: THE KILL CHECK
    Verdict | the one fact that could end it | the cheapest test left

  STEP 4: CHEAP TESTS
    The claim | two or three tests | number to watch | pass mark

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Where your buyers talk
    how: Name the forums, groups or channels. Step 1 searches there first.
  - what: How much you can spend
    how: Say your budget and days. Step 4 picks tests that fit them.
  - what: A past idea you killed
    how: Paste why. The kill check uses it as a pattern to look for.
  - what: Your brand file
    how: Add it so the brief uses your voice and your product facts.
judge:
  - Every pain and buying signal in step 1 has a link or a quote, not a guess.
  - The brief quotes real posts and says where evidence is thin.
  - The verdict names one specific fact, not a general worry.
  - Every test has a number to watch and a pass mark written before it runs.
  - Tests ask for a real action, such as a sign-up or a pre-order, not a compliment.
  - You can finish the cheapest test in two weeks or less.
test:
  - Open five links from step 1 and check each one says what the summary claims.
  - Read the kill check cold and decide if you would drop the idea on that fact alone.
  - Show the pass mark to a friend and ask if a pass would change your mind.
improve:
  - Save the verdict and the reason in a list of killed ideas, so the next check starts with it.
  - Re-run step 1 in three months to see if the pain grows or fades.
  - After the test, re-run steps 3 and 4 with the real numbers.
