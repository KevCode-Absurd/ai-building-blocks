new_slug: competitor-ad-to-script
name: "Turn competitor ads into a script of your own"
summary: "Turn competitor ads into a script of your own. Give it ads from Meta's Ad Library and your reviews. You get an original script and an ad rules check."
job: study-competitors

headline: "Turn competitor ads into a script of your own"
subhead: Give it the competitor ads you saved from Meta's public Ad Library, your org context and your reviews. It files the ads into nine types, maps where your category crowds and what nobody does, borrows one idea, and writes an original script checked against ad rules.

explain: |
  Studying competitor ads is useful, but it's easy to end up with a copy. You rewrite a good ad's lines a little, and now yours sounds like theirs and borrows claims you can't back. The useful part of a good ad is the idea behind it, such as admitting the doubt out loud, or letting one demonstration do the talking.

  This workflow keeps the idea and drops the rest. It files the ads you saved by the question each one answers, from "what is it?" to "why now?", and keeps three per type from at least two brands. It counts which types your category crowds into, which repeated claims have become clichés, and what your buyers ask that no ad answers. Then it picks one idea your own facts can back, writes a new script from your reviews, and runs a five-line distance check before the ad rules check. How long an ad has run is treated as a hint, never as proof it sold.

when:
  - You've saved competitor ads you admire and want to know why they work.
  - Your ads feel stuck and you want ideas from outside your own account.
  - You want to borrow what works without copying anyone's words, people or footage.
not_for:
  - "You have no competitor ads you can open in the public Ad Library: start with the Fact-based ad copy writer, or collect a few ads by hand first."
  - "You want a single image ad, not a video script: use the Reference layout image ad maker."
  - "You only want to check an ad you already wrote: use the Meta ad policy checker."

you_give:
  - The ads you saved, each with its library ID, the brand, its start date, its words and a screenshot
  - Your org context, or your website so one can be built
  - Your customer reviews, copied as written
  - Your product facts and the claims you may and may not make
  - Your current ad's words and offer, for the rules check to compare against
  - The competitors that matter to you (optional)
you_get:
  - A study board of up to 27 ads, three per type, each with what to study
  - A map of where your category crowds, its clichés, and the gaps your proof can fill
  - An original video script, with the one idea it borrows and a five-line distance check
  - The script polished to read aloud, an ad rules check, and one list of what's missing

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Have your inputs ready. Save the ads by hand from Meta's public Ad Library, with each one's library ID, start date, words and a screenshot. Add your org context, reviews and product facts.
  - It works step by step and saves each result. If it can't see any real ads, it stops after step 1 and tells you exactly what to collect.
  - Read the distance check under the script. If any line says no, ask for a rewrite before you go further.
output_sample:
  input:
    - Competitor ads you saved by hand, each with library ID, brand, start date, words and a screenshot
    - Your org context, or your website so one can be built
    - Your customer reviews, copied as written
    - Your product facts and the claims you may and may not make
    - Your current ad's words and offer
  prerequisites:
    - An AI that can read files, such as Claude in a Project or Claude Code
    - The handoff pack zip with HANDOFF.md from this page
  output:
    - name: Study board
      contains: Saved ads filed into nine types, three per type, with brand, library ID, start date and what to study.
    - name: Category map
      contains: Which types are crowded, repeated claims word for word, and gaps your proof can fill.
    - name: Script
      contains: The one idea borrowed, a beat-by-beat script, and a five-line distance check.
    - name: Read-aloud fixes
      contains: Lines reworded so they sound natural when spoken, with no change to claims or facts.
    - name: Ad rules check
      contains: A verdict, exact lines that could get the ad rejected, and settings to choose at launch.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every missing item in one list.

how_it_works:
  - title: Sorts the ads
    text: Uses the study board skill to file each ad under one of nine types and keep three per type from at least two brands, long-running ones first. The run is only as good as the ads you collect by hand. No step fills a gap from your notes.
  - title: Maps the category
    text: Uses the competitor gaps skill to count which types the category crowds, list repeated claims word for word, and check them against what buyers say.
  - title: Writes your own script
    text: Uses the one-idea script skill to pick an idea your facts can back, write a new script from your reviews, and run a five-line distance check.
  - title: Fixes how it sounds
    text: Uses the read-aloud skill to fix lines nobody would say out loud, without changing any claim or fact.
  - title: Checks the ad rules
    text: Uses the Facebook and Instagram ad rules skill to flag anything that could get the ad rejected and list what to set at launch.

output_shape: |
  STUDY BOARD
  <type> | <code> | <brand> | <library ID> | <start date> | <tier> | what to study
  Gaps: <types with fewer than three cards>   Not looked at: <ads>

  CATEGORY MAP
  <type>: <brands using it> | crowded / thin / open
  Clichés: "<claim, word for word>" (<brands>)
  Gaps worth filling: <gap> because <buyer reason>, backed by <your fact>

  IDEA BORROWED
  <one sentence, with no competitor's product, claim or words>
  Rests on: <your fact or quote> | Where it acts: <one or two parts>

  SCRIPT (<length> seconds, spoken by <who>)
  | Beat | Spoken line | On-screen text | Picture note | Evidence |
  Fixed when read aloud: <line> to <new wording>

  DISTANCE CHECK
  Five lines, each yes or no: order, no 5-word run, no claim, no person or shot, nothing on the do-not-borrow list

  AD RULES CHECK
  Verdict: <ready / fix first / likely rejected>   Set at launch: <restrictions>

  HAND-BACK SUMMARY
  Files: <each step's file> | Not run: <step and why> | MISSING: <every line, in one list>

  If step 1 can't see any real ads, the run stops there: the study board, what to collect, and the summary.

example:
  business: sprout
  input: |
    [the handoff pack] Follow HANDOFF.md.

    Ads I collected: my notes on five competitors, from the org context.
    - A big-name greens powder: science-first, podcast-famous, 90-day
      guarantee, about $79 a month
    - A TikTok-famous women's wellness brand: greens gummies, bloat
      relief angle, creator videos
    - A celebrity-founded women's supplement line: sitewide sales up to
      45% off
    - A doctor-backed greens tablet and gummy brand, sold in grocery stores
    - A vegan family liquid-vitamin brand: trust badges, gentle tone
    Org context, reviews and product facts: the Sprout files.
  output: |
    This run stopped at step 1, which is what the workflow should do here.
    It shows what happens when the ads themselves are missing.

    STUDY BOARD
    Not looked at: all 5. These are notes about each brand, not ads.
    There is no library ID, no start date, no ad words and no image or
    video to look at.
    Filed: none. The board files only ads it has seen, because a note
    like "creator videos" can't show what the first frame does.
    MISSING: the ads themselves.

    WHAT TO COLLECT (by hand, from the public Meta Ad Library)
    For each ad: the library ID, the brand, the start date, the words on
    it and above it, and a screenshot or the first frames of the video.
    - Up to 10 active ads per competitor: the 5 that have run longest
      and the 5 newest.
    - The wellness brand: its creator videos on bloating. They aim at
      Sprout's gut buyer, the group with the strongest feelings.
    - The big-name powder: its longest-running ads. Sprout's reviewers
      name it as the powder they quit.
    - The supplement line: its sale ads, to see how it shows discounts
      Sprout's buyers already doubt.
    - The doctor-backed and family brands: two or three ads each, for
      how they show trust badges and expert voices.
    - Two or three ads from brands that sell something else to the same
      buyers, to fill any type with fewer than three cards.

    STEPS 2 TO 5
    Not run. Each needs real ads to study, and step 3 writes no script
    without one.

    HAND-BACK SUMMARY
    Files: outputs/step-01 (study board and what to collect).
    Not run: steps 2 to 5, for lack of real ads.
    MISSING: the ads themselves, with library IDs, start dates, words
    and screenshots; your current ad's words and offer for the rules
    check.
    Already on file for later: Sprout's reviews point at a gap to test
    once the ads are in. The "I quit powders" and "I finally stuck with
    it" stories barely appear in Sprout's own ads.

tweaks:
  - what: Which ads you collect
    how: Include the five longest-running and the five newest ads for each competitor. The newest show where the category is heading.
  - what: Neighbouring categories
    how: Add a few ads from brands that sell something different to similar buyers. Their ideas are less likely to be ones your competitors already use.
  - what: What not to borrow
    how: List anything you want kept out, such as a competitor's offer style or a kind of claim. The distance check confirms none of it appears.
  - what: Script length and speaker
    how: Say "20 seconds, hands only, voice-over" or "30 seconds, founder to camera". The borrowed idea then works inside that shape.

judge:
  - Every ad on the board has a library ID and start date and was looked at, or the run stops at step 1 and lists what to collect.
  - No competitor ad is called a winner, and run time is given in days, never as proof of sales.
  - The borrowed idea is one sentence that doesn't mention the competitor's product, and it rests on a fact from your files.
  - No line, claim, number or shot in your script comes from a competitor ad, and every claim appears in your facts.
  - The ad rules check points to exact lines, and the run ends with a summary of every file and every MISSING line.

test:
  - Check the board from step 1. Every ad should have a library ID and a start date. If any is called a winner, ask why.
  - Read the borrowed idea. It should be one sentence that doesn't mention the competitor's product.
  - Put the script beside the competitor ads it learned from. No line, claim, number or shot should match.
  - Run it once with notes instead of ads. It should stop after step 1 and list what to collect, with no draft script.

improve:
  - In the builder, drop step 1 if you've already filed the ads by type, and give your board to step 2.
  - Add a step after the script that turns it into a shot list, so it's ready for a video tool.
  - Add a step before step 3 that turns your reviews into ranked buying reasons, so the script speaks in your customers' words.
  - "Tune step 3's skill: list what you never want borrowed, such as a competitor's offer style, so the distance check looks for it."
  - Run it again every few months with fresh ads, and compare what changed.

works_best_with:
  tools:
    - {name: "Meta Ad Library", why: "The public place to find competitor ads with their library ID and start date, browsed by hand."}
    - {name: "Claude", why: "Holds dozens of ad cards, your reviews and your claims rules in one long run."}
    - {name: "Google Sheets", why: "Keeps the board by library ID and counts types per brand, so the map is easy to check."}
  inputs:
    - "A screenshot of each ad's whole library card, so the start date and versions are on file"
    - "Ads from three to six competitors, so the map shows the category and not one brand's habits"
    - "Twenty or more of your own reviews, so the gaps rest on what your buyers say"
    - "A list of claims and offer styles you never want borrowed, so the distance check looks for them"

terms:
  - term: Public ad library
    meaning: A free website where you can see the ads any brand is running, such as Meta's Ad Library.
  - term: Study board
    meaning: A set of other brands' ads saved for study and filed by type, with what to learn from each.
  - term: Distance check
    meaning: Five yes or no lines that confirm your script took the idea and nothing else.
