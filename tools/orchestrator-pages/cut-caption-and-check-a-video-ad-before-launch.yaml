new_slug: cut-caption-and-check-a-video-ad-before-launch
name: Cut, caption and check a video ad before launch
summary: Turn your clips and script into a cut list, brand-font captions and a launch check for your video ad, with a fix for each mistake.
job: make-video-ads
thinking: medium
thinking_why: Each step is a defined check. A mid-level model is enough.
headline: A finished video ad, cut, captioned and checked
subhead: Give it your clips and script. It plans the cut, you edit it, then it writes captions in your brand font timed to the speech and checks the finished ad for mistakes that get ads rejected. You get a verdict and a fix list.
explain: |-
  Clips are not an ad. Between the raw files and a launch sit three jobs people skip: a cut that follows the script, captions that people can read, and a check for faults. Miss one and the ad loses viewers, or gets rejected after you pay to publish it.

  The steps cover all three. First it plans the cut from your real clips and script. You pause to edit and export. Then it times captions to the speech in your font, kept clear of the app buttons. Last it checks the captioned ad and lists stop-ship mistakes first, each with a fix.

  It plans and checks. It does not edit or render the video for you.
when:
  - Your clips are ready but the ad is not edited yet.
  - You edited an ad and want captions that fit the speech.
  - You want a last check before you put money behind the ad.
  - You want one run that covers the cut, the captions and the check.
not_for:
  - "Your ad is already cut and captioned: use the Pre-launch ad checker on its own."
  - "You only need captions on a finished video: use the Video caption maker in your brand font."
  - "You still need a script: write one first with the Video ad script writer from customer quotes."
you_give:
  - The list of your raw clip files
  - The script the clips follow
  - Your offer (optional)
  - Your brand font file (needed for the captions)
  - The exported video, after you edit it at the pause
you_get:
  - A cut list with in and out times for each shot
  - A caption plan in your font, an exported file and a subtitle file
  - A launch check with a verdict, a fix for each mistake and a score out of 100
how_to_use:
  - Download the handoff pack from this page. It is a zip with HANDOFF.md (the run order below) and the three skill files this workflow uses, video-ad-edit-planner, branded-video-captions and pre-launch-ad-checker. Unzip it and keep them together in one folder.
  - Give the folder to Claude, in Claude Code or as files in a Claude Project, and say "Follow HANDOFF.md".
  - List your clips and paste your script. Step 1 needs only these.
  - When it stops after the cut list, edit the video in your own editor and export it.
  - Attach the exported video and your font file. Step 2 adds captions and step 3 checks the result.
  - Fix every stop-ship mistake, then run the check again before you launch.
output_sample:
  input:
    - The list of your raw clip files
    - Your video ad script, beat by beat
    - Your offer (optional)
    - Your brand font file (optional)
    - Your brand brain folder (optional)
  prerequisites:
    - A video editor, to cut and export the ad at the pause
    - An AI that can read files, if you use the handoff pack
  output:
    - name: Cut list
      contains: Cuts by clip file with in and out times, caption windows, a sound plan, export settings and gaps.
    - name: Caption groups
      contains: The script split into word-for-word caption groups, with a style, font and timing table.
    - name: Subtitle file
      contains: A timed subtitle file you can load next to the captioned video.
    - name: Fault list
      contains: Caption problems found, such as text sitting under app buttons, each with a fix.
    - name: Launch check
      contains: Stop-ship mistakes first, each with a fix, then a verdict (fix, remake, ready within what was reviewed, or incomplete) and a score out of 100.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Plan the cut
    text: Sorts your clips by job, opens on a clean first frame, times every shot to the real files and plans sound and exports.
  - title: "Pause: cut and export"
    text: You edit the video to the cut list and export it.
  - title: Write the captions
    text: Locks the words to the script, splits them into groups, times them to the speech and places them clear of the app buttons.
  - title: Check before launch
    text: Checks facts, claims, format and safe zones, lists stop-ship mistakes first, and scores the ad.
output_shape: |-
  STEP 1: CUT LIST
    Cuts by clip file | caption windows | sound plan | exports | gaps

  PAUSE: you edit and export the video

  STEP 2: CAPTIONS
    Caption groups word for word | style and font | timing table | subtitle file | fault list

  STEP 3: LAUNCH CHECK
    Stop-ship mistakes with fixes | verdict | score out of 100 and how it was worked out

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Where it will run
    how: Name the placements, such as Reels or Stories. Safe zones for captions differ by placement.
  - what: Your font
    how: Attach the real font file. Without it, caption widths are only estimates.
  - what: Sound
    how: Say if the ad is mostly watched muted. Caption size and timing change.
judge:
  - Every caption says what the speaker says, in the same order.
  - No caption sits under the app's buttons.
  - The subtitle file matches the burned-in captions.
  - Each stop-ship mistake has a one-line fix.
  - The score says what it measured.
test:
  - Watch the captioned ad on a phone with the sound off and read every caption.
  - Check the first and last frames against the cut list.
  - Fix one flagged mistake and run step 3 again. The score should rise.
next: [ad-results-report-writer, creative-test-reader]
improve:
  - Save your caption style in your brand file so every ad matches.
  - Keep a list of your most common stop-ship mistakes and watch for them while editing.
  - Run this on every ad before launch, not only the big ones.
