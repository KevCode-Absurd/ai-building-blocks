new_slug: cut-ci-cost-without-weakening-checks
name: Cut CI cost without weakening checks
summary: Share your GitHub workflows. Get cost savings, permission fixes and runtime upgrades that preserve the build checks.
job: ship-and-host
headline: Cut CI cost without weakening checks
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your GitHub workflows. Get cost savings, permission fixes and runtime upgrades that preserve the build checks. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your GitHub workflows. Get cost savings, permission fixes and runtime upgrades that preserve the build checks.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - Build cost review
  - Security findings
  - Proposed runtime changes and validation
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: GitHub build cost reviewer
    text: Share your Actions workflows. Get wasted build minutes, slow jobs and ways to cut repeat work.
  - title: GitHub Actions permission reviewer
    text: Share your build workflows. Get risky permissions, unsafe inputs and dependency trust problems with fixes.
  - title: GitHub Actions runtime upgrade helper
    text: Share your Actions workflows. Get supported action versions while keeping the build's behavior intact.
output_shape: |-
  Build cost review
  Security findings
  Proposed runtime changes and validation
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []

not_for:
  - "Your build is failing right now: use the CI failure fixer or the Failed workflow diagnoser."
  - "You only want a security check of your workflows: use the GitHub Actions permission reviewer."
  - "You do not use GitHub Actions. These steps read GitHub workflow files only."
output_sample:
  input:
    - Your workflow files from the .github/workflows folder
    - Your goal, such as fewer build minutes
    - Recent run history from gh run list (optional)
  prerequisites:
    - An AI that can read your files, or workflow text you can paste
  output:
    - name: Build cost review
      contains: Where build minutes are wasted, and the top fixes ranked by minutes saved.
    - name: Security findings
      contains: Risky permissions, unsafe inputs and loose action versions, each with a fix.
    - name: Proposed runtime changes and validation
      contains: Supported action versions to move to, and how to check the build still behaves the same.
