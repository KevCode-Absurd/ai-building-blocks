new_slug: design-a-brand-mark-and-test-that-it-holds-up
name: Design a brand mark and test that it holds up
summary: Describe the design job. Get a tight brief, a mark plan and a strength test for your finished ideas.
job: design-work
thinking: high
thinking_why: It scores finished marks on seven tests and gives calls you will act on. Give it your strongest model.
headline: Get a logo brief that works, and a fair test of every idea you make
subhead: Describe the design job. It writes a brief with a few firm limits, then plans the mark from that brief, with tests for small and large use. After you sketch and finish a few options, it scores each one on seven tests and says keep, fix or drop.
explain: |
  A logo job that starts from a blank page goes wrong in familiar ways. The brief is vague, so every idea is a guess. Everyone argues from taste. Someone picks the idea they liked on first sight, and it falls apart at the size of a phone icon.

  This workflow gives the job limits before you sketch, plans the mark so it works as a system, and tests your finished options on fixed points instead of opinion. The order comes from Paul Rand's writing on design and the play instinct, and from Michael Bierut's work on marks that start from the brief and are tested small. The final test uses the seven-part check from Logos, Flags, and Escutcheons.
when:
  - You need a logo or mark and want a clear brief to hand a designer or an AI tool.
  - You have three logo ideas and can't tell which one is best without a fight.
  - You are thinking of redesigning your mark and want to know if the fault is real or only a wish for change.
you_give:
  - A few lines on the job, such as what it is for, when and where
  - Who it is for, and what they should do or see differently
  - Limits you already know, such as budget or size (optional)
  - Your brand file (optional)
  - Notes from a call or visit with the client, and marks you admire or want to avoid (optional)
  - A day or more to sketch the ideas and finish a few options
  - Your finished options, as images, and the smallest size the mark will be used
you_get:
  - A brief with core facts, the one idea the work must carry, three to five limits and what is left free
  - A mark plan with the answer already in the brief, the obvious options tried and one surprising move
  - A list of ideas to sketch on paper before you open any software
  - A score out of 100 for each finished option, with the seven tests and the one-colour and small-size check
  - A keep, fix or drop call with one reason, and for a redesign a note on whether the fault is real
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe the job. It writes the brief and the mark plan, then stops.
  - Sketch the ideas on paper and make a few finished options. Attach the images, tell it the smallest size, and say "carry on".
how_it_works:
  - title: Writes the brief
    text: Pulls out the core facts, picks the one idea the work must carry and sets three to five limits, with what is left free.
  - title: Plans the mark
    text: Reads the brief for the answer already in it, tries the obvious options and adds one surprising move on top of what people already know.
  - title: Sets the tests
    text: Plans how to test the mark at the smallest and largest use, and lists ideas to sketch on paper first.
  - title: Waits for your sketches
    text: You sketch, pick and finish a few options. Nothing more runs until you bring them back.
  - title: Tests each idea
    text: Scores each finished option on seven tests, in one colour and at a very small size, against the brief and the mark plan.
  - title: Makes the call
    text: Gives a score out of 100, a keep, fix or drop call and one reason for each option.
output_shape: |-
  STEP 1: DESIGN BRIEF
    Core facts: what <job> | why <reason> | when <date> | where <place>
    Audience and client: <one sentence> | they should <do or see differently>
    The need: <what the design must do>
    The one idea: <one sentence, got in a glance>
    Limits: <three to five> | left free on purpose <what>

  STEP 2: BRAND MARK PLAN
    The answer in the brief: <line>
    Obvious options: <option> | tried <result> | keep or drop <why>
    Keep and add: known by people <what> | one surprising move <move>
    Ideas to sketch first: <list>

  (you sketch and finish a few options)

  STEP 3: LOGO STRENGTH TEST
    Idea <n>: distinct | visible | usable | memorable | universal | durable | timeless
    One colour and small size: <what happens at the smallest size>
    Score: <n> out of 100 | call <keep / fix / drop> because <reason>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: The limits in the brief
    how: Tight limits give better ideas than none. Pick a size, a number of colours, one typeface and a deadline, and be strict about them.
  - what: Where the mark will be used
    how: Name the smallest size, such as a 16 pixel icon. The test judges the mark at that size, so a vague size gives a vague answer.
  - what: How many options you finish
    how: Bring three to five. Fewer gives nothing to compare, and more makes the scores harder to act on.
judge:
  - The brief has one idea that can be got in a glance, and three to five firm limits.
  - The mark plan starts from the brief, not from a style.
  - The score says how it was worked out, and each of the seven tests is shown.
  - Every option has a one-colour and small-size result.
  - No fact about the client or business is invented.
test:
  - Give it a mark you already know is weak, such as a detailed drawing that vanishes at icon size. It should score low on the small-size check.
  - Give it two marks and ask which one it would keep. It should answer with a reason tied to the tests.
  - Write a brief of your own and compare it with the one it writes. The limits should be tighter and the one idea clearer.
improve:
  - Save the finished brief to your brand file, so the next design job starts from the same limits.
  - Add the marks you rejected and why, so the plan avoids them next time.
  - For a redesign, add how long the current mark has been used and how well it is known.
