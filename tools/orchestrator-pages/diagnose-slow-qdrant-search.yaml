new_slug: diagnose-slow-qdrant-search
name: Diagnose slow Qdrant search
summary: Share query traces and workload sizes. Get speed fixes, capacity choices and health measures to compare.
job: test-and-fix-code
headline: Diagnose slow Qdrant search
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share query traces and workload sizes. Get speed fixes, capacity choices and health measures to compare. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share query traces and workload sizes. Get speed fixes, capacity choices and health measures to compare.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - Performance baseline and candidate fixes
  - Capacity plan
  - Monitoring checks
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: Qdrant search speed tuner
    text: Share your search workload. Get index, query and hardware changes to test against a clear baseline.
  - title: Qdrant cluster capacity planner
    text: Share your data size and traffic. Get a scaling plan and the evidence needed before adding nodes.
  - title: Qdrant health monitoring planner
    text: Share your Qdrant setup. Get useful health metrics, alerts and checks for slow or unhealthy search.
output_shape: |-
  Performance baseline and candidate fixes
  Capacity plan
  Monitoring checks
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []

not_for:
  - "Search is fast but returns the wrong results: use the Qdrant search relevance investigator."
  - "You are choosing where to host Qdrant: use the Qdrant hosting option adviser."
  - "You are moving to a new embedding model or a new Qdrant version: use the Qdrant embedding migration planner or the Qdrant version upgrade planner."
output_sample:
  input:
    - Your goal, such as faster single searches or more searches per second
    - Your Qdrant version, point count and vector size
    - Your machines, such as RAM, CPU cores and disk type (optional)
    - Current collection settings and baseline timings (optional)
  output:
    - name: Performance baseline and candidate fixes
      contains: Likely causes, most likely first, with the setting to change, a before and after test and the risk.
    - name: Capacity plan
      contains: The bottleneck, a labelled memory estimate and when more nodes are needed.
    - name: Monitoring checks
      contains: Metrics to collect, health checks and alerts that show slow or unhealthy search.
