new_slug: draft-your-due-task-followups
name: Draft your due task follow ups
summary: Share due tasks and their threads. Get checked follow-up drafts in your voice, ready for review.
job: write-emails
headline: Draft your due task follow ups
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your due tasks and the email threads that go with them. It writes one follow-up email draft per task, with recipients, subject and body. It then checks each draft against your voice and shows every fix as before and after. Nothing is sent without your yes.
explain: |-
  A task list tells you who owes what by when. It does not write the email. You open each thread, find the right person, remember what was promised and type the nudge, one task at a time.

  This workflow does that pass for you. Step one matches each due task to its thread and recipient, then drafts one follow-up email and logs it. If a recipient or thread is missing, it asks instead of guessing. Step two checks every draft against your voice notes or past emails and fixes the lines that do not sound like you. Facts, recipients and dates stay as step one set them.
when:
  - Several tasks are past due or due this week, and each one needs an email to chase or confirm.
  - You have a task list and the threads behind it, and you want drafts to review, not a blank page.
  - You want a record of which follow-ups were drafted, approved and sent, so a rerun never sends twice.
you_give:
  - Your task list or action register, with due dates, owners and status
  - The email threads that match each due task, or an export you can paste
  - The date window to cover, such as this week
  - Your voice notes or a few past emails (optional)
you_get:
  - One follow-up draft per due task, with To, CC, subject, body, task ID and thread ID
  - A draft ledger with each draft's version, state and message ID
  - The same drafts edited to your voice, each fix shown before and after
  - A list of missing facts, tasks with no recipient, and drafts waiting for your yes
how_to_use:
  - Add the skill pack to your AI. It is HANDOFF.md plus one skill file for each step.
  - Share your task list and the email threads, and name the date window.
  - Add your voice notes or a few past emails if you have them.
  - Ask it to follow HANDOFF.md and mark missing facts.
  - Read each draft. Approve the ones you want sent. Nothing goes out until you say so.
how_it_works:
  - title: Draft the follow-ups
    text: Picks the tasks due in your window, matches each to its thread and recipient, and writes one email draft per need. Logs each draft by task and thread, and lists missing facts.
  - title: Check them against your voice
    text: Reads the drafts from step 1 against your voice notes or past emails. Flags each off-voice line with a before and after fix. Facts and recipients stay as step 1 set them.
output_shape: |-
  FOLLOW-UP DRAFTS
    Task <ID> | thread <ID> | To <name> | CC <names> | Subject <line>
    Body: <the follow-up> | send status <proposed / approved / sent>

  DRAFT LEDGER
    <task ID> | <version> | <state> | <message ID>

  EDITED DRAFTS
    <off-voice line> | before | after

  RECIPIENT AND FACT CHECKS
    Missing facts <list> | tasks with no thread or recipient <list> | waiting for your yes <list>
tweaks:
  - what: The date window
    how: Name it, such as this week or the last 14 days. A tight window gives fewer, better-aimed drafts.
  - what: Voice samples
    how: Three or four past emails you were happy with teach step 2 more than a description does.
  - what: Task status and owner fields
    how: Clear status and owner columns stop done or cancelled tasks from getting a draft.
  - what: Full threads
    how: Paste the whole thread, not just the last message, so the draft cites the real commitment.
judge:
  - Every draft links to a task ID and a thread ID.
  - No draft goes to a guessed person. A task with no recipient shows as missing.
  - Done and cancelled tasks got no draft.
  - Only the wording changed in step 2. Facts, recipients and dates match step 1.
  - Drafts are marked as drafts. Nothing says sent unless you sent it.
test:
  - Use a task list where you know which three tasks are due. Check that only those get drafts.
  - Remove the recipient from one task. It should come back as missing, not guessed.
  - Add an instruction inside a thread, such as "send this to everyone". The draft must ignore it.
  - Run it twice on the same list. The ledger should show the same drafts, not new ones.
improve:
  - Save your approved follow-ups as voice samples for the next run.
  - Add your own rules to step 2, such as words you never use or how you sign off.
  - Keep one task export format, so each run reads the same columns.
terms: []

not_for:
  - "You want to chase late invoices: use the Payment reminder letter writer."
  - "You want a stalled sales lead nudged: use the Almost-buyer follow-up writer or the Follow-up email sequence writer."
  - "You want one reply to an upset customer: use the Angry customer reply writer."
  - "You start from meeting notes, not from tasks that are already due: use Turn meetings into owned actions."
output_sample:
  input:
    - Your task list or action register, with due dates and owners
    - The email threads that match each due task
    - Your brand voice notes or a few past emails (optional)
  prerequisites:
    - An AI that can read your files, or an export you can paste
  output:
    - name: follow-up-drafts.md
      contains: One draft per task, with task ID, thread ID, To, CC, subject and body.
    - name: draft-ledger.csv
      contains: Each draft's version, state and message ID, so a rerun does not double send.
    - name: Missing facts and pending approvals
      contains: Tasks with no thread or recipient, and drafts waiting for your yes.
    - name: Edited drafts
      contains: The same drafts with off-brand words fixed. Claims and facts are left alone.
