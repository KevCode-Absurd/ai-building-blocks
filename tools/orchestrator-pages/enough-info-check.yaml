new_slug: enough-info-check
name: Check you know enough before you act
summary: Describe what you are about to do. Get your knowledge tested, then a learn, borrow, start small or pass plan.
job: think-and-decide
thinking: high
thinking_why: It has to test your claims honestly, including the ones you feel sure about. Give it your strongest model.
headline: Find the edge of what you know before you act on it
subhead: Describe what you are about to do and what you know about it. It maps the parts you must understand, tests you with the hardest follow-up questions, checks any adviser you would lean on, and picks whether to learn, borrow help, start small or pass. You get a first-week plan.
explain: |
  Charlie Munger said to stay inside your circle of competence and, more important, to know where its edge is. If you cannot say where your knowledge ends, it probably ends sooner than you think. Smooth talk is easy to mistake for knowledge, most of all your own.

  This workflow finds the edge. It splits the topic into parts and rates each by what you have done, not what you feel. It then asks the six questions an expert would ask and marks your answers real, partial or only talk. If you plan to lean on an adviser, it checks who gains and who loses. It ends with a choice between learning, borrowing, starting small and passing, and a plan for the first week.
when:
  - You are about to act in a field you have mostly read about.
  - You are thinking of hiring an expert and want to do it safely.
  - You want to know which areas are worth building real skill in over the next few years.
not_for:
  - "You face a routine choice with a clear precedent or a small choice you can undo: just check the fact directly or ask one expert."
  - "You only want to judge one adviser's advice: use the Advice credibility checker."
  - "You want to test a business idea with real people: use the Smallest test picker."
you_give:
  - What you are about to do and the field it sits in
  - What you have done, studied or read about it
  - Your answers to the hard questions, from memory
  - The adviser you would rely on and how they are paid (optional)
you_get:
  - A map of what you know, half know and don't, with the edge named
  - Six hard questions, your answers marked real, partial or only talk, and the gaps as questions
  - A check of whether your adviser gains or loses with the advice
  - A choice of learn, borrow, start small or pass, with a first-week plan and a retest date
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md plus one skill file for each step.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Answer the hard questions from memory. Say so when you are guessing.
  - Do the first week of the plan and book the retest.
output_sample:
  input:
    - What you are about to do and the field it sits in
    - What you have done, studied or read about it
    - Your answers to the hard questions, from memory
    - The adviser you would rely on and how they are paid (optional)
  prerequisites:
    - An AI that can work through steps in order and save a file for each step, such as Claude with the handoff pack files
  output:
    - name: outputs/step-01-circle-of-competence-mapper.md
      contains: Each part of the topic rated known, partly known or not known, with your edge named.
    - name: outputs/step-02-real-knowledge-tester.md
      contains: Six hard questions, your answers marked real, partial or only talk, and the gaps as questions.
    - name: outputs/step-03-advice-skin-in-the-game-checker.md
      contains: Who pays if your adviser is wrong, who gains, and how far to trust the advice.
    - name: outputs/step-04-learn-borrow-or-pass-planner.md
      contains: Your path (learn, borrow, start small or pass), a first-week plan and a retest date.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Maps your circle
    text: Splits the topic into parts, rates each by evidence and names the edge.
  - title: Tests your knowledge
    text: Asks six hard follow-up questions and marks each answer real, partial or only talk.
  - title: Checks your adviser
    text: Asks what the adviser gains if you say yes and loses if they are wrong, and how far to trust the advice.
  - title: Picks the path
    text: Chooses learn, borrow, start small or pass using the size of the decision, the deadline and who holds the edge.
  - title: Plans the first week
    text: Lists the few big ideas to learn, the checks on any helper and seven days of small tasks, with a retest date.
output_shape: |-
  STEP 1: YOUR CIRCLE
    Parts | KNOWN, PARTLY or NOT | source | the edge | aptitude | basket

  STEP 2: REAL KNOWLEDGE TEST
    Six questions | your answer | REAL, PARTIAL or TALK | score and verdict
    Over-confidence | gap questions

  STEP 3: ADVISER CHECK
    Who pays if wrong | who gains | how far to trust

  STEP 4: LEARN, BORROW, START SMALL OR PASS
    Path and reason | big ideas | helper checks | first week | retest date

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: What you say you have done
    how: Say what you did, with years or numbers. Reading a lot counts, but less than doing.
  - what: How honestly you answer
    how: Guess out loud and mark it as a guess. A flagged guess is more useful than a smooth answer.
  - what: The deadline
    how: A tight deadline moves the answer from learn to borrow, start small or pass.
judge:
  - Every rating has a source you can name (did, studied, read or heard).
  - The edge is a real question you could not answer.
  - Each real answer has an example or number behind it.
  - A borrowed helper would pass the skin-in-the-game test.
  - The first-week plan has small tasks you can start today.
test:
  - Run it on a field you know well. You should score five or six real answers.
  - Run it on a field you have only read about. Expect some answers marked as talk.
  - Run it twice with the same answers. The marks and the path should match.
improve:
  - Redo the retest after a month and see if the edge has moved.
  - Keep the six questions as an interview guide for advisers.
  - Ask an expert to answer the same questions and compare.
