new_slug: expert-and-newcomer-writing
name: Write something experts admire and newcomers enjoy
summary: Write for experts and newcomers at once. Give it your piece and your audiences. You get a layered, trimmed draft and a test plan for both groups.
job: write-and-tell-stories
thinking: high
thinking_why: It runs several skills in a row. Give it your strongest model.
headline: Write one piece that satisfies the expert and the newcomer
subhead: Tell it what you are making and who will see it. It writes a brief for both audiences, fits the piece to whoever delivers it, drafts a plain surface with a few deeper touches, cuts what crowds it and plans a test with one expert and one newcomer.
explain: |
  Work for a mixed audience usually goes wrong at one end. It is so simple the experts are bored, or so dense that newcomers give up. Aiming for the middle gives you a piece nobody remembers.

  This workflow is loosely inspired by Mozart's letters, where he writes about music that pleases experts and beginners alike: a surface anyone enjoys, and deeper parts for those who know more. It starts by naming both audiences and the two ways to fail. It fits the piece to the person who will deliver it, writes the draft in layers, and cuts every idea that fights the main one. It ends with a small test: one expert and one newcomer, each alone, with the pass lines fixed first. After you run the test, it sorts what they said into a ranked rewrite list.
when:
  - You are making a talk, article, course, product page or song for people who range from beginners to experts.
  - Feedback pulls you both ways, with one person saying it is too basic and another saying it is too hard.
  - A draft has grown past what it can carry and you cannot say what it is really about.
not_for:
  - "You write for one audience only: use the Creative brief reframer, or a plain editor, to sharpen the brief."
  - "You only need a quick edit of a finished draft: ask a plain editor or your AI to tighten it."
  - "You need to know what buyers want before you write: use the Customer needs finder."
you_give:
  - What you are making and where people will meet it
  - Who the experts are and who the newcomers are, with real comments if you have them
  - Who will deliver it (speak, present, read, perform), if it is not you
  - Your facts, material and length limit
  - Later, what an expert and a newcomer said when they tried it
you_get:
  - A brief naming both audiences, the two ways to fail and a promise to each
  - A fit plan for the person who delivers it
  - A draft with a plain surface and marked deeper touches
  - A shorter draft with every cut listed and a put-back order
  - A one-page test for one expert and one newcomer
  - After the test, a ranked rewrite list that says which group each change serves
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md plus one skill file for each step.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Say what you are making, who will see it and who will deliver it. It works step by step and saves each result.
  - Run the test with one expert and one newcomer, each alone. Bring back their answers for the last step.
output_sample:
  input:
    - What you are making and where people will meet it
    - Who the experts are and who the newcomers are
    - Who will deliver it, if it is not you
    - Your facts, material and length limit
    - What one expert and one newcomer said after trying it (added later)
  prerequisites:
    - An AI that can save files, such as Claude Code or a Claude Project
    - Your brand brain from the Website brand brain builder (optional)
  output:
    - name: "Step 1: Two-audience brief"
      contains: Both audiences described, the two ways to fail, and one promise to each.
    - name: "Step 2: Fit plan"
      contains: What the deliverer does well, where the showpiece goes, and which lines to swap.
    - name: "Step 3: Layered draft"
      contains: A plain surface with tagged deeper touches. This is the copy draft used by steps 4 to 6.
    - name: "Step 4: Cut draft"
      contains: A shorter draft, every cut listed with a reason, and an order to put cuts back.
    - name: "Step 5: Test plan"
      contains: Who to pick, what to watch, questions for each group, and pass lines.
    - name: "Step 6: Ranked rewrite list"
      contains: Changes in rank order, each marked with the group it serves.
    - name: Hand-back summary
      contains: Each step's file, any step not run, and every MISSING line in one list.
how_it_works:
  - title: Names both audiences
    text: Describes what the expert notices and what loses the newcomer, names the two ways to fail and writes one promise to each.
  - title: Fits it to the deliverer
    text: Lists what the speaker or performer does well, puts the showpiece where they are strongest and swaps the lines they trip on.
  - title: Drafts in layers
    text: Writes a plain surface a newcomer can follow in one pass, then adds a few touches only an expert would catch, each one removable.
  - title: Cuts what crowds it
    text: Names the main idea, scores every other idea against it, cuts what competes and lists each cut so you can put one back.
  - title: Plans the test
    text: Sets who to try it on, what to watch, the same questions for each group and a pass line for each, fixed before you start.
  - title: Sorts what they said
    text: Uses the notes your testers send back after step 5's test. Groups them by place in the draft and ranks the changes, marking which audience each serves.
output_shape: |-
  STEP 1: BRIEF FOR BOTH AUDIENCES
    The expert | The newcomer | Two ways to fail, with a test each | A promise to each

  STEP 2: FIT PLAN FOR THE DELIVERER
    Fit table | Showpiece and where it goes | Plain parts | Swaps

  STEP 3: LAYERED DRAFT
    Main idea | Draft with [S] surface and [D] depth tags | Depth map

  STEP 4: CUT DRAFT
    Main idea | Cut draft | Before and after words | Cuts with reasons | Put-back order

  STEP 5: TEST PLAN
    Who to pick | Setup | Watch list | Questions for each group | Pass lines | Record sheet

  Pause: run the test, write down what each person did and said.

  STEP 6: RANKED REWRITE LIST
    Fixes both groups raised | Choices between groups | Changes in rank order

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How well you know the two groups
    how: Real comments from an expert and a newcomer make steps 1 and 5 much sharper than a description.
  - what: Who delivers it
    how: If it is not you, paste a recording or a transcript of them speaking. The fit plan then works from evidence, not a guess.
  - what: How strong the feeling in the piece is
    how: If it carries anger, grief or fear, say so. Step 3 will write it in full and keep it easy to take.
judge:
  - Both audiences are described by what they notice or are lost by, and the brief does not ask for an average.
  - A newcomer could state the main idea after reading the surface once.
  - Every deeper touch can be removed without breaking the draft.
  - The cut draft has no idea left that competes with the main one.
  - The pass lines were set before the test and each is a clear yes or no.
test:
  - Run it on a piece you have already made. See whether the failure tests would have caught what readers complained about.
  - Read the draft to someone new to the subject. They should be able to say what it was about.
  - Run it twice on the same input. The main idea and the biggest cuts should stay the same.
improve:
  - Save the brief and the pass lines, so the next piece starts from step 2.
  - Keep the parking list from step 4. It is the start of your next piece.
  - After each test, add what the expert noticed and what the newcomer remembered to the brief for next time.
