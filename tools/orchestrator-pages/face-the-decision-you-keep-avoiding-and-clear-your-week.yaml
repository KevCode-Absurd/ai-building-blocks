new_slug: face-the-decision-you-keep-avoiding-and-clear-your-week
name: Face the decision you keep avoiding and clear your week
summary: Paste the decision you keep putting off. Get the worst case, a stop list and the few big tasks for the week.
job: think-and-decide
thinking: high
thinking_why: It weighs fears, habits and a full task list against one another. Give it your strongest model.
headline: Make the call you keep putting off, and clear space to act on it
subhead: Paste the decision you keep delaying. It writes out the worst realistic outcomes and how you would repair each, and prices what waiting costs. Then it builds a list of habits to stop and sorts your tasks into the few big ones for this week.
explain: |
  A decision you keep delaying grows in your head. The fear stays vague, so you never check how bad it would really be, and the small tasks on your list make you feel busy while the big one waits. Each week of delay costs something, but you never add it up.

  This workflow makes the fear specific. It rates each worst case for lasting harm and likelihood, plans the repair and prices the cost of doing nothing. It then finds the habits that eat your time and gives each a stop rule with a number. Last, it sorts every open task into big work that pays off and small work that only feels good, so you spend the week on the few that matter. The method comes from Tim Ferriss's writing on fear-setting and the not-to-do list.
when:
  - You have a move you have put off for weeks, such as quitting, raising prices or ending a deal.
  - Your week fills with small tasks and the one big thing never gets done.
  - You keep saying "after this busy stretch," and the stretch never ends.
you_give:
  - The move you are putting off, in one or two sentences
  - What you are afraid will happen, and limits that matter, such as savings or a lease (optional)
  - A calendar or list of how last week went
  - The habits you suspect cost you most
  - Every open task, and the hours you really have this week
  - Your main goal this month or quarter
you_get:
  - The worst realistic outcomes, each rated for harm and likelihood, with a repair for each
  - The gains from a partial or full win, and the cost of doing nothing at one, five and ten years
  - One small step to take within a day
  - A short list of what to stop, each with a rule that has a number and a swap
  - Your tasks sorted into big and small, three priorities for the week with protected time, and tomorrow's list
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste the decision, last week's calendar and your task list. It works step by step and saves each result.
  - Take the first small step within a day, then follow the stop rules for one week.
how_it_works:
  - title: Names the worst case
    text: Names the move you are putting off, writes the worst realistic outcomes and rates each one for lasting harm and likelihood.
  - title: Plans the repair
    text: Plans how to repair or limit each one, lists the gains of a partial or full win and prices the cost of doing nothing.
  - title: Finds what eats your time
    text: Uses your plan and last week's calendar to mark habits that cause false emergencies and finds the costly few tasks and clients.
  - title: Writes the stop list
    text: Writes one stop rule per habit with a number or limit, and sets a protected block and a review date.
  - title: Sorts the big from the small
    text: Sorts every open task into big work that pays off and small work that only feels good, and finds the one that makes the others easier.
  - title: Plans the week
    text: Batches or drops the small tasks, tests whether the task you have put off longest is the big one, and picks three priorities.
output_shape: |-
  STEP 1: FEAR-SETTING PLAN
    The move: <what you are putting off>
    Worst cases: <outcome> | harm 1-10 | likelihood | repair <steps>
    Gains: partial win <what> | full win <what>
    Cost of doing nothing: one year <what> | five years <what> | ten years <what>
    First step within a day: <step>

  STEP 2: NOT-TO-DO LIST
    Where the time went: <habit> | <hours> | false emergency yes/no
    Costly few: <tasks or clients> | share of effort | share of return
    Stop list: <habit> | rule <number or limit> | swap <what to do instead>
    Protected block and review date: <when>

  STEP 3: WEEKLY BIG TASKS
    Big or small: big <tasks> | small <tasks>
    The main task: <task> | makes easier or unneeded <tasks>
    Put off longest: <task> | big? <yes/no, why>
    Three priorities for the week: <priority> | protected time <when>
    Tomorrow's list: <tasks>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How honest you are about the fear
    how: Say the thing you are afraid of, even if it sounds silly. A vague fear gets a vague repair plan.
  - what: Your calendar for last week
    how: Give real hours, not what you meant to do. The stop rules come from where the time went.
  - what: The hours you have this week
    how: Subtract fixed meetings and travel first. A plan built on hours you don't have fails by Wednesday.
judge:
  - Every worst case has a harm rating, a likelihood and a repair.
  - The cost of doing nothing is stated at one, five and ten years.
  - Each stop rule has a number or limit, not "try to do less."
  - The three priorities include the task you put off longest, or say why it is not big.
  - Nothing about your life, work or money is invented.
test:
  - Give it a decision that is truly risky, such as a move that could lose your savings. The worst case should be rated high and the repair should be specific.
  - Give it a week with six meetings that had no agenda. One stop rule should deal with them and have a number.
  - Run the task sort twice. The big tasks should be the same both times.
improve:
  - Keep the stop list in your notes and check it each Friday. Bring back what you broke and why.
  - Re-run the fear-setting after you take the first step, to see which fears were smaller than you thought.
  - Add your quarterly goal to the input every time, so the big tasks always point at it.
