new_slug: falling-market-plan
name: Write your plan for a falling market before it happens
summary: Write your plan for a falling market while you are calm. Paste your holdings and get each move read, each business checked, and a rule card.
job: money-and-investing
thinking: medium
thinking_why: It runs three skills in a row. The steps are fixed, and the care is in keeping the price out of the verdict on the business. A mid-level model is enough.
headline: Decide what you will do in a falling market while you are calm, and write it down
subhead: Paste your holdings, what you think each is worth and how prices have moved. It sorts each move into the business changing or the crowd changing its mood, checks each holding on business facts with the price hidden, and writes the do and do-not rules for a fall. A method of analysis, not personal financial advice.
explain: |
  It is hard to choose well in the middle of a fall. The screen is red, the news is loud, and every reason to act sounds sensible.

  This workflow is inspired by the Mr. Market picture in The Intelligent Investor by Benjamin Graham. Imagine a business partner who names a price for your share every day, some days far too high and some days far too low. You may deal with him or ignore him. First it reads the offer: today's price against your own written value, and whether the business changed or only the mood. Then it checks each holding on business facts alone, and asks if you would buy the same business today with the price hidden. Last it writes the rules for three sizes of fall and for a jump, with fixed dates for looking. It is a plan, not a trade. It names no security to buy or sell.
when:
  - Prices are swinging and you feel pulled to act.
  - You sold in a panic once and do not want to do it again.
  - You are about to put in more money and want a calm plan for the bumps.
not_for:
  - "You want a view on one day's dip with no change in the business: wait, and look again on your set look date."
  - "You are deciding whether to buy a new holding: use the Case-against writer to test the idea first."
  - "You want a stock to buy or sell, or advice for your own money: talk to a licensed financial adviser."
you_give:
  - What you hold, what you paid and when
  - Your own written value for each holding and why
  - How the prices have moved and what changed in each business
  - Money you need within five years, and any loan against your holdings
you_get:
  - Each move sorted as business change or mood
  - Pricing kept apart from timing in every reason to act
  - A keep, watch or weak mark for each holding, from facts alone
  - A one-page rule card for falls and jumps, with look dates
how_to_use:
  - Download the handoff pack. It holds HANDOFF.md plus one skill file for each step.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Gather your holdings with cost and date, your written value for each, and the sizes of fall that would hurt you. Even a rough range works. Without your value the gap cannot be read.
  - Print the rule card and keep it where you look at prices.
output_sample:
  input:
    - What you hold, what you paid and when
    - Your own written value for each holding and why
    - How prices have moved and what changed in each business
    - Money you need within five years, and any loan against your holdings (optional)
  prerequisites:
    - An AI that can read files, such as Claude with the handoff pack
  output:
    - name: "Step 1: The offer"
      contains: Each holding's gap to your value, marked business change, mood or unknown, with take, ignore or wait.
    - name: "Step 2: The business"
      contains: What changed in each business, whether you would buy it today with the price hidden, and a keep, watch or weak mark.
    - name: "Step 3: The rule card"
      contains: The half-value test, money needed soon, rules for three sizes of fall, a rule for a jump, and look dates.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every missing item in one list.
how_it_works:
  - title: Reads the offer
    text: Sets price beside your value, sorts each move into business change or mood, and marks timing reasons as speculation.
  - title: Checks the business
    text: Lists what changed in profit, debt, shares and rivals, and asks if you would buy it today with the price hidden.
  - title: Writes the rules
    text: Runs the half-value test, checks money needed soon, and sets do and do-not rules for falls and jumps.
output_shape: |-
  STEP 1: THE OFFER
    <holding> | Gap to your value | BUSINESS CHANGE / MOOD / UNKNOWN | TAKE / IGNORE / WAIT

  STEP 2: THE BUSINESS
    <holding> | Then and now | Would I buy it today, price hidden | KEEP / WATCH / WEAK

  STEP 3: THE RULE CARD
    Half-value test | Money needed soon | Rules for a tenth, a quarter and a half fall | Rule for a jump | Look dates

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Sizes of fall
    how: Choose sizes that would hurt you. The rules use yours.
  - what: How often you look
    how: Say monthly, quarterly or yearly. Yearly is the calmest.
  - what: Your witness
    how: Choose someone who will say no to you, not someone who agrees with everything.
judge:
  - Each step used the result of the step before.
  - Every sort uses business facts, not the tone of the news.
  - The would-you-buy answer was written before the price was shown.
  - Every rule points to a business fact.
  - Nothing names a security to buy or sell, and no forecast is given.
test:
  - Give it a fall with profit up and debt flat. It should call it mood and mark the holding keep.
  - Give it a fall with profit down a third and debt doubled. It should call it a business change and mark it weak.
  - Say you would sell everything if your holdings halved. It should say the plan is too big for you.
  - Run it twice on the same input. The marks and rules should match.
improve:
  - Reread the card on each look date and after any big fall.
  - After a real fall, write down what you did and add the lesson to the card.
  - Update your value for each holding when the company reports.
terms:
  - term: Mr. Market
    meaning: A picture of the share market as a moody partner who names a price every day. You may take the price or ignore it.
  - term: Pricing and timing
    meaning: Pricing is buying below what a thing is worth. Timing is guessing which way the market will move next.
  - term: Half-value test
    meaning: Asking whether you could watch your holdings lose half their value and not sell in a panic.
