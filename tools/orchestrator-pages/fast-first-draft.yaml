new_slug: fast-first-draft
name: Write a first draft fast with the door closed
summary: "Write a first draft fast: give it your story idea and writing days. Get a what-if, a daily word plan, scene details and pages with no outline."
job: write-and-tell-stories
thinking: high
thinking_why: It plans, then writes real prose day after day without an outline, which needs close control of the people and the facts. Give it your strongest model.

headline: Get a whole first draft written before your doubts catch up
subhead: Tell it your idea and the days you can write. It turns the idea into a what-if situation, works out a daily word count and a finish date, picks the details for each place, then writes each day's pages in order with no outline.

explain: |
  Most first drafts never get finished. The writer plans too long, rewrites page one all week, or shows the pages to a friend and loses their nerve. A first draft needs speed, a closed door and a clear daily count.

  This workflow sets that up. It starts with a situation, which is a person or two stuck in a pressure they cannot leave, not a plot. It works out how many words to write each day and the date you will finish, then picks a few real details for each place so the scenes stay short. Last, it writes the day's pages by asking at each turn what these people would really do next. It keeps a facts sheet so day two matches day one. The method comes from Stephen King's book On Writing.

when:
  - You have an idea for a story or book and keep putting off the first page.
  - You start drafts and then rewrite the opening until you give up.
  - You want a whole draft in about three months.
not_for:
  - "You want to plot or outline the story first: this workflow skips outlines, so plan on paper or with a trusted editor instead."
  - "You already have a finished draft to improve: use the Long-form draft editor."
  - "You are writing nonfiction, such as a guide or report: use a plain outline and write it section by section."

you_give:
  - Your idea, even if it is only a topic or a mood
  - The length you are aiming for and the days and minutes you can write
  - Places you know well, or the places your first scenes happen (optional)
  - A page of your own writing, so the pages sound like you (optional)

you_get:
  - One what-if question, the people stuck in it and what to leave open
  - A daily word count, a finish date and a closed-door routine with a two-week table
  - A short detail sheet for each place
  - Each day's pages, a facts sheet and tomorrow's first question

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give it your idea, your length and your writing days. It works step by step and saves each result.
  - Run the last step again each day with the facts sheet and the last paragraph until the draft is done.
  - Keep the door shut. Show the draft to nobody until the last word is down.
output_sample:
  input:
    - Your story idea, even if it is only a topic or a mood
    - The length you want and the days and minutes you can write
    - Places you know well (optional)
    - A page of your own writing, for voice (optional)
  prerequisites:
    - An AI that can read the handoff folder, such as Claude with files or Claude Code
  output:
    - name: "Step 1: The situation"
      contains: One what-if question, three versions with the pick, the people stuck in it, what to leave open and where to start.
    - name: "Step 2: The daily word quota"
      contains: Your daily word count, days needed, finish date, closed-door routine and a two-week table.
    - name: "Step 3: Scene details"
      contains: For each place, four first-to-mind details, a fresh comparison and a skip list.
    - name: "Step 4: Day pages"
      contains: The day's pages in order, a facts sheet, where it stopped and tomorrow's first question.
    - name: Hand-back summary
      contains: Each step's file, any step not run and every MISSING line in one list.

how_it_works:
  - title: Find the situation
    text: Turns your idea into a what-if question, picks the best of three versions and sketches the people stuck in it.
  - title: Set the daily word quota
    text: Works out the daily count, the finish date and the closed-door routine from your length and your hours.
  - title: Pick the scene details
    text: Keeps four first-to-mind details for each place and a skip list, so the scenes stay about the story.
  - title: Write the draft without an outline
    text: Writes the day's pages in order by asking what the people would really do, and hands back a facts sheet for tomorrow.

output_shape: |-
  STEP 1: THE SITUATION
    The what-if | Three versions and the pick | The people | Leave open | Where to start

  STEP 2: THE DAILY WORD QUOTA
    Daily count | Days needed | Finish date | Routine | Two-week table

  STEP 3: SCENE DETAILS
    Place | Four details | Fresh comparison | Skip

  STEP 4: DAY 1 PAGES
    <draft, near the daily count>
    Facts sheet | Where it stopped | Tomorrow's first question

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: Your hours
    how: Give the minutes you really have on your worst writing day. The daily count is sized to that day, so a true answer keeps you on track.
  - what: Your voice
    how: Paste a page of your own writing before step 4, so the pages match your sentence length and words.
  - what: Point of view and tense
    how: Say first or third person, past or present. It keeps to one for the whole draft.
  - what: Places you know
    how: Name real places. Details taken from real places feel truer than invented ones.

judge:
  - The what-if names a person, a pressure and why they cannot leave.
  - The daily count fits in the minutes you have, and the sums re-add.
  - Each place has four details and no list of clothes or faces.
  - The pages follow from what the people would do, with no outline behind them.
  - The facts sheet lists every name, age and place the pages stated.

test:
  - Check the quota by hand. 60,000 words at 1,000 a day and six days a week should give 10 weeks.
  - Run day two with the facts sheet and check that no name, age or place changed.
  - Read the first page aloud. You should want to know what happens next.

improve:
  - Save your facts sheet and each day's pages in one file, so day two starts from the right place.
  - After two weeks, run the writing log reviewer from the daily habit workflow to adjust the count.
  - When the draft is done, rest it for six weeks, then run the revise workflow.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Keeps the situation, the plan and each day's pages in one thread."}
    - {name: "A plain text file", why: "One file per draft keeps the pages and the facts sheet together."}
  inputs:
    - "A page of your own writing, for voice"
    - "Facts you already know about the people, such as ages and jobs"
    - "A photo or notes from a place you know"

terms:
  - term: What-if
    meaning: A question that puts a person in a strange pressure and asks what happens.
  - term: Door closed
    meaning: Writing the first draft alone, with no one reading and no one asking what it means.
  - term: Facts sheet
    meaning: A short list of names, ages, places and promises the draft has already stated.
