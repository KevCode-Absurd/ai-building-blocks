new_slug: find-out-if-your-ad-works-and-decide-whether-to-change-it
name: Check if your ad works, then keep or change it
summary: Give it your current ad. Get a short survey, the recall and pull sums, and a keep or change call.
job: read-ad-results
thinking: medium
thinking_why: The sums are fixed, but reading what they mean and weighing the cost of change takes judgment.
headline: Find out whether your ad works, apart from everything else that moves sales
subhead: Give it your current ad. It writes a short survey, you ask it of at least a hundred buyers, and it works out who remembers the ad and whether they buy more. Then it tells you whether to keep, fix or replace the ad, and where to spend next.
explain: |
  Sales go up and down for many reasons, so sales alone cannot judge an ad. Rosser Reeves split people into two groups instead: those who can say what the ad says, and those who cannot. If the first group buys more of your product, the ad is pulling people over. If they buy the same, it is not. If they buy less, it may be driving customers away.

  This workflow runs that method. It writes the questions and the scoring rule, then reads your answers and works out recall, the buying rate in each group and the pull. It then asks whether a change is justified. It treats a bored team as a reason to ask, not a reason to change. It prices the recall you would lose by starting over. It ends with a plan to reach more different people before repeating the ad to the same ones.
when:
  - Your ad has run a while, sales are muddy and your team wants something new.
  - A new manager or agency wants to start again.
  - You are not sure whether people even notice your ad.
you_give:
  - Your current ad, or the claim it makes
  - Who could buy and how you can reach some of them
  - After the pause, the filled-in answer sheet from the survey
  - Spend by year and sales for the same period (optional)
you_get:
  - A survey with questions, sample size and scoring rule
  - Recall, the buying rate in each group and the pull as a number, with a margin
  - Which of four patterns you have, and the next step
  - A keep, fix or replace call, with the cost of starting over
  - A plan for reaching more different people before repeating
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your ad and say who buys. Ask it to plan the survey.
  - Ask at least a hundred buyers the questions exactly as written, and write down their words.
  - Bring the answer sheet back for the rest.
how_it_works:
  - title: Plans the recall and pull survey
    text: Writes the questions, the sample size and the rule for what counts as knowing the ad.
  - title: Works out recall and pull
    text: Scores the answers, finds the buying rate in each group, subtracts, checks the margin and names the pattern.
  - title: Decides to keep or change
    text: Separates real reasons to change from boredom, prices a restart and gives a keep, fix or replace call.
  - title: Plans who sees it
    text: Ranks where the next spend reaches the most new people and holds repeats until most buyers are reached.
output_shape: |-
  STEP 1: PLAN THE RECALL AND PULL SURVEY
    Target answer | who to ask | questions | scoring rule | sample size | answer sheet

  PAUSE
    Ask at least a hundred buyers and fill in the sheet.

  STEP 2: WORK OUT RECALL AND PULL
    Counts | recall | buying rates | pull | margin | pattern | caution

  STEP 3: DECIDE TO KEEP OR CHANGE
    Reason | wear test | real reasons | cost of starting over | verdict | what to keep

  STEP 4: PLAN WHO SEES IT
    Fit | coverage | next money in order | when to add repeats

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How many people you can ask
    how: The survey plan shows how many it takes. A smaller sample gives a rougher read, and it says so.
  - what: Who you can reach
    how: If you can only reach customers, say so. The result then tells you about recall among customers.
  - what: Spend history
    how: Add spend by year. It makes the cost of starting over a real figure.
  - what: A rival's ad
    how: Add it to the same survey to compare recall.
judge:
  - The questions never hint at the claim.
  - The pull is shown as two rates and their difference, with a margin.
  - The verdict follows from the checks, not from opinion.
  - The plan works from unique people, not views.
  - No step invented a figure to fill a gap.
test:
  - Redo the sums by hand on the first twenty rows of the sheet.
  - Run the survey again in six months with the same questions and compare.
  - Change the reason from boredom to a fall in pull. The call should change.
improve:
  - Keep every wave's sheet in one folder so recall and pull can be compared over time.
  - Add a column for where each person saw the ad.
  - Pair it with the find-one-claim workflow when the verdict says fix the claim.
