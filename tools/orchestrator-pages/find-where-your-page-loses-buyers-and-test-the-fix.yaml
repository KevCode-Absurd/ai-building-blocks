new_slug: find-where-your-page-loses-buyers-and-test-the-fix
name: "Find where your page loses buyers and test the fix"
summary: "Give it your page and step numbers. Get the worst drop-off, the unanswered doubts and how long a fair test needs."
job: audit-landing-page

headline: "Find where your page loses buyers, fix it, then prove the fix worked"
subhead: Give it your page and the numbers at each step. It finds the step that loses the most buyers, then finds the customer doubts the fixed page still leaves open, and tells you how many weeks a fair test of the change needs.

explain: |
  When a page gets visits but few sales, the instinct is to change a lot at once. Then if sales move you can't tell why, and if they don't you can't tell what to undo. It works better to find the one step that leaks the most, fix that, and then test the change fairly.

  This workflow builds a step table from your numbers, finds the leakiest step and matches it to the page that owns it. It reviews that page on a phone, sizes the fix and pauses while you make it. Then it checks the fixed page against real customer questions and lists the doubts still unanswered. After you add those answers, it checks whether your traffic is enough to prove the change worked and how many weeks that takes.

when:
  - Your page gets visits but few sales, and you don't know which step loses the most people.
  - You've changed your page before and couldn't tell whether it worked.
  - You want to know if your traffic is big enough to run a fair A/B test.

you_give:
  - Your page, as a link, text or screenshots
  - Visits or orders at each step, from your store or analytics (optional for step 1)
  - Customer questions or reviews, copied as written
  - Visits and orders for the last few weeks, as an export

you_get:
  - The step that loses the most buyers, the page that owns it, and fixes sized by effort
  - The doubts your fixed page still leaves open, with the answer to add and where
  - The test size, weeks needed and a verdict on whether you can test at all
  - Rules for running the test, and a score out of 100 for test readiness

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Have your inputs ready. Your page, the numbers at each step and your customers' questions.
  - It works step by step and pauses twice. First while you fix the worst step, then while you add answers and export your traffic.
  - Give each pause's result to the next step.

how_it_works:
  - title: Finds the worst drop-off
    text: Uses the funnel drop-off finder to build a step table, find the leakiest step, match it to its page and review that page on a phone.
  - title: Finds the open doubts
    text: Uses the unanswered question skill to check each customer doubt against the fixed page and say where each missing answer goes.
  - title: Sizes the test
    text: Uses the A/B test traffic checker to work out honest numbers, size the test, give a verdict and set rules for running it.

output_shape: |
  STEP TABLE
  <step>: <visits> -> <next step> (<drop-off>)
  Leakiest step: <step> | Page: <which>

  FIXES
  <finding, what was seen> | Effort: <size> | Ship or test: <which>

  PAUSE
  Fix the worst step and save the page.

  OPEN DOUBTS
  <doubt> (<how often>) | Missing: <answer or proof> | Add at: <section>

  PAUSE
  Add the answers. Export visits and orders.

  TEST SIZE
  Smallest lift worth finding: <n>% | Weeks needed: <n> | Verdict: <can test, test with care or can't test>
  Rules for running it: <list> | Score: <n>/100

  HAND-BACK SUMMARY
  Files: <each step's file> | MISSING: <every line, in one list>

example:
  business: sprout
  input: |
    [the handoff pack] Follow HANDOFF.md.
    Page: sprout.example/first-box
    Steps: product page 4,200 visits, cart 600, checkout 310, orders 190
    Reviews: reviews.md
  output: |
    STEP TABLE
    Product page -> cart: 14% | Cart -> checkout: 52% | Checkout -> order: 61%
    Leakiest step: product page to cart | Page: the product page
    
    FIXES
    The price shows only after scrolling | Effort: small | Ship
    
    PAUSE: fix it and save the page
    
    OPEN DOUBTS
    "How do I cancel?" (5 reviews) | Add at: before the button
    
    TEST SIZE
    Smallest lift worth finding: 20% | Weeks needed: 5 | Verdict: can test

tweaks:
  - what: Where traffic comes from
    how: Split your numbers by source, such as ads, email and search. The test step then sizes the test for each source.
  - what: Smallest change you care about
    how: Say what lift would be worth the work. The test step then says how many weeks it takes to see it.
  - what: No step numbers
    how: Say so. Step 1 then works from the page alone and tells you which numbers to start tracking.
  - what: Little traffic
    how: Say "I can't test". The last step then gives a way to decide without a test, such as before-and-after with a note on what else changed.

judge:
  - The step table adds up. Each step's visits are no more than the step before.
  - The leakiest step is the one with the biggest drop that you could act on.
  - Each fix says what was seen on the page.
  - Each open doubt names a customer question.
  - The test size shows its numbers and not only a verdict.

test:
  - Check the step table against your analytics for two steps.
  - Take one fix and find what it quotes on the page.
  - Take one open doubt and find the customer question behind it.
  - Re-run the last step with a different lift size to see how the weeks change.

improve:
  - In the builder, drop step 2 if you've already answered your customers' questions.
  - Add a step after the pause that runs 30 yes-or-no checks on the fixed page.
  - Add a step at the end that writes a report of the test result.
  - Pair it with the workflow that writes a page from reasons to switch, if the page needs more than a fix.

works_best_with:
  tools:
    - {name: "Google Analytics", why: "Gives visits and orders by step for the step table."}
    - {name: "Claude", why: "Keeps the step table, the fixes and the test size straight across three steps."}
    - {name: "PageSpeed Insights", why: "Free Google check of the page for phone speed problems."}
  inputs:
    - "Visits and orders for the last four weeks, split by source"
    - "Support tickets or pre-sale questions"
    - "Phone screenshots of each step of the buying path"

terms:
  - term: Drop-off
    meaning: The share of people who leave at a step instead of moving on.
  - term: A/B test
    meaning: Showing two versions of a page to different visitors to see which sells more.
