new_slug: first-impression-plan
name: Make a strong first impression and build the relationship
summary: Plan a first meeting with someone new and keep the relationship going. Get a brief, a meeting plan, a memory card and a thank-you note.
job: speak-and-persuade
thinking: high
thinking_why: It runs several skills in a row. Give it your strongest model.
headline: Meet someone new, be remembered well and keep the relationship going
subhead: Tell it who you are about to meet and why. It uses the public text you paste about them, plans a meeting where they do most of the talking, turns your notes into a memory card with promises and dates, and writes an honest thank-you note.
explain: |
  Most people walk into a first meeting with their own pitch ready and nothing prepared about the other person. They talk about themselves, forget the name by the end and never follow up. The person leaves with no sense of being seen.

  This workflow prepares the other half. It lists what the person cares about, from the public facts you give it, picks two things you can honestly admire and writes one question only they can answer. It plans the first ten seconds, the questions, the listening and the close. After the meeting, it turns your rough notes into a card with the exact name, the facts they shared, your promises and the next touch. Then it writes a short, specific thank-you with no request in it. It is inspired by Dale Carnegie's How to Win Friends and Influence People.
when:
  - You are about to meet a senior person, a new contact or a buyer.
  - You go to events and forget most of the people you meet.
  - You owe someone a follow-up and want it to be about them.
not_for:
  - "You are messaging a cold list of strangers with no reason to contact them: send a plain intro message instead."
  - "You only want to learn about one person before a call: use the Meeting brief writer."
  - "You need to ask for a sale or a decision: use a sales next-step plan, since this workflow keeps any ask out of the note."
you_give:
  - The person's name and role, and why you are meeting
  - Anything public about them, such as a site, talk or post (optional)
  - Where and how long you will meet
  - Your rough notes after the meeting, with the name as spelled and anything you promised
  - "An AI that can keep files, such as Claude Code or a Claude Project. These can need a paid plan. For a free route, use any chat window: paste HANDOFF.md and then each skill file in turn."
you_get:
  - A one-page brief on what they care about, the people around them and the one question only they can answer
  - A meeting plan with their name, open questions, listening rules and a close
  - A memory card with facts, promises with dates and the next touch
  - A short thank-you note with one specific, true appreciation and no ask
how_to_use:
  - The brief uses only public facts you paste or name. It does not search for private details or invent any.
  - Download the handoff pack. It's a zip with HANDOFF.md plus one skill file for each step.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give the person's name and why you are meeting. It plans the meeting and saves the result.
  - Have the meeting. Write your notes within an hour, then bring them back to make the card and the note.
output_sample:
  input:
    - The person's name and role, and why you are meeting
    - Anything public about them, such as a site, talk or post (optional)
    - Where and how long you will meet
    - Your rough notes after the meeting, with the name as spelled and anything you promised
  prerequisites:
    - An AI that can keep files, such as Claude Code or a Claude Project, to follow HANDOFF.md. In a plain chat window, paste HANDOFF.md and each skill file in turn
  output:
    - name: "Step 1: The brief"
      contains: What they care about, the people around them, two honest admirations, the one question only they can answer and the size of your ask.
    - name: "Step 2: The meeting plan"
      contains: The first ten seconds, questions in three layers, listening rules, two true appreciations and the close.
    - name: "Step 3: The memory card"
      contains: The name as spelled, what they shared, promises with dates, the next touch and dates for your calendar.
    - name: "Step 4: The thank-you note"
      contains: A short note with one specific true appreciation, the detail used and any ask moved to a later message.
    - name: Hand-back summary
      contains: Each step's file, any step not run and every MISSING line in one list.
how_it_works:
  - title: Learns what they care about
    text: Lists the public facts you gave it with their sources, ranks what they treasure, notes the people around them and picks two honest admirations.
  - title: Plans how to get them talking
    text: Plans the first ten seconds, writes open questions in three layers, sets listening rules and places two true appreciations.
  - title: Writes the memory card
    text: Fixes the exact name, records what they shared, lists promises with dates and sets the next touch with a reason about them.
  - title: Writes the thank-you note
    text: Picks one thing you truly valued, adds a detail only a listener would know and keeps any request out.
output_shape: |-
  STEP 1: THE BRIEF
    What they care about | The people around them | Two honest admirations | The one question | The size of your ask

  STEP 2: THE MEETING PLAN
    The first ten seconds | Questions in three layers | Listening rules | Two appreciations | The close

  STEP 3: THE MEMORY CARD
    Name as spelled | What they shared | Promises with dates | Next touch | Dates for your calendar

  STEP 4: THE THANK-YOU NOTE
    The note | The detail used | Any ask moved to a later message

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: What you can paste about them
    how: Paste their bio, a talk summary or recent posts. Real text gives better topics than a name alone.
  - what: The time you have
    how: Ten minutes at an event needs fewer questions than an hour at lunch. Say how long you will have.
  - what: Your notes after the meeting
    how: Include every detail, even small ones. The card keeps what matters and leaves out what is private.
  - what: Your own voice
    how: Paste a note you wrote and liked. The thank-you matches your length and words.
judge:
  - Every fact in the brief has a public source.
  - Both admirations are specific and true.
  - Their name is planned for the first ten seconds.
  - The card has dates and owners for every promise.
  - The note has one detail only a listener would know and makes no request.
test:
  - Run the first two steps on someone you know well. Check if the brief names what they love.
  - Read the questions to a friend. See if they want to answer.
  - Use the plan at a real meeting and note how much of the time the other person spoke.
  - After the meeting, check that they remembered your name.
improve:
  - Add your own opening lines, so the first ten seconds sound like you.
  - Add a monthly review of cards due for a touch.
  - Keep the cards in one sheet, one row per person.
  - Add fields that matter in your work, such as their other suppliers or budget cycle.
