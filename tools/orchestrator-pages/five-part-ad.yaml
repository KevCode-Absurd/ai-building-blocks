new_slug: five-part-ad
name: "Write an ad in five parts, from hook to ask"
summary: "Write an ad in five parts from your product facts: a hook, a gain, proof, a sum-up and an ask. It checks each part and scores the ad out of 100."
job: write-ad-copy
thinking: high
thinking_why: "It writes and checks a full ad across eight steps. Give it your strongest model."

headline: "An ad with all five parts: attention, a gain, proof, a push and an ask"
subhead: "Give it your product facts. It finds the one want to lead with, writes and checks the headline, gathers four kinds of proof, writes the body, adds a summing-up and an ask, then scores all five parts. You get a full ad and a list of fixes."

explain: |
  Many ads do three of the five jobs well and skip the rest. They grab the eye and show a gain, then end without proof, or with proof and no ask. The reader agrees and does nothing.

  This workflow follows the five jobs in the order a third-party summary of Victor Schwab's How to Write a Good Advertisement gives them. It starts by finding the one thing your reader wants, tested against your facts. It then writes headlines and checks that each picks out a reader and promises a reward. Next it gathers proof in four kinds and writes the body with proof beside each claim. Then it adds a short section that sums up and gives a real reason to act, and writes the ask. Last it scores all five parts out of 100. The source is a summary, so treat its detail as second-hand.

when:
  - You need a full ad, not just a headline, and want to be sure no part is missing.
  - Your ad reads well and still does not bring action.
  - You have product facts but no clear idea what to lead with.
not_for:
  - "You only need a headline: use the Ad headline writer."
  - "You want a short social post or a first line: use the Ad hook writer."
  - "You already have an ad and only want its claims checked: use the Ad claims checker."

you_give:
  - "Your product or service facts: what it does, price, proof you may use"
  - Who buys it and some customer words (optional)
  - Your offer with its exact terms, such as a guarantee or trial (optional)

you_get:
  - The one want to lead with, and a short brief
  - Headlines, with the one checked for reader and reward
  - A proof map, with the claims that have no proof marked
  - The body, a summing-up section and a clear ask
  - A score out of 100 on the five parts, with ranked fixes

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give it your product facts first. Add customer words and your offer if you have them.
  - It works step by step and saves each result. Read the proof map before the finished ad.
output_sample:
  input:
    - "Your product facts: what it does, price, and proof you may use"
    - Customer words, such as reviews or emails (optional)
    - Your offer with exact terms, such as a guarantee or trial (optional)
    - Your brand brain (optional)
  prerequisites:
    - A strong chat AI that can follow the handoff folder and save a file for each step
  output:
    - name: "Step 1: What the reader wants"
      contains: The one want to lead with and the reward it promises, backed by your facts.
    - name: "Step 2: The headlines"
      contains: Headlines written for the chosen want.
    - name: "Step 3: The headline check"
      contains: A verdict on whether the headline picks out its reader and promises a reward.
    - name: "Step 4: The proof map"
      contains: Each claim paired with its strongest proof, with bare claims marked.
    - name: "Step 5: The body"
      contains: Body copy that pays off the headline, with proof beside each claim.
    - name: "Step 6: The summing-up"
      contains: A short section that pictures the gain and gives a real reason to act.
    - name: "Step 7: The ask"
      contains: Two versions of a clear ask with a real reason to act now.
    - name: "Step 8: The five-part check"
      contains: Pass or fail on all five parts, a score out of 100 and ranked fixes.
    - name: Hand-back summary
      contains: Each step's file, any step not run, and every MISSING line in one list.

how_it_works:
  - title: Find what the reader wants
    text: "Looks at the product as its maker and its buyer, sorts wants into gain, be, do and save, keeps those your facts back, and picks one."
  - title: Write and check the headline
    text: "Writes headlines for that want and keeps only one that picks out its reader and promises a reward."
  - title: Gather the proof
    text: "Looks for proof in four places (how it is made, what it has done, what others say, what the reader can try) and pairs each claim with the strongest."
  - title: Write the body
    text: "Opens on the promised reward and puts proof beside each claim."
  - title: Sum up and ask
    text: "Adds a short section that pictures the gain and gives a real reason to act, then writes a clear ask."
  - title: Check all five parts
    text: "Scores attention, advantage, proof, persuasion and action out of 20 each, judges length and ranks the fixes."

output_shape: |-
  STEP 1: WHAT THE READER WANTS
    Lead want and reward: <...>

  STEP 2: THE HEADLINES
    <headlines>

  STEP 3: THE HEADLINE CHECK
    <verdict, stronger versions>

  STEP 4: THE PROOF MAP
    <claim | proof | kind>

  STEP 5: THE BODY
    <body with proof beside each claim>

  STEP 6: THE SUMMING-UP
    <section ready to place before the ask>

  STEP 7: THE ASK
    <two versions>

  STEP 8: THE FIVE-PART CHECK
    <part | pass or fail | points>  Score: <n> out of 100

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
    CHECKS MISSED: <checks that failed or could not run, or none>

tweaks:
  - what: Your product facts
    how: Give exact figures, tests and sources. Claims with no fact behind them are dropped or marked.
  - what: Your offer
    how: Give the guarantee, trial and dates word for word. The ask uses only these terms.
  - what: Your buyer
    how: Add a few customer words. They show which wants buyers say out loud.

judge:
  - One lead want, backed by a fact.
  - Every main claim has proof beside it or is marked bare.
  - The summing-up adds no new claim.
  - The ask names one action and uses only terms from your offer.
  - Nothing is invented to fill a gap.

test:
  - Run it on an ad you already run. Compare its five-part score with what that ad pulled.
  - Stop after step 1 and show the lead want to a customer. Ask if it is why they would buy.
  - Key the finished ad and your current ad with different codes and compare replies.
  - Run it twice. The lead want and the order of the parts should be close.

improve:
  - Save your lead want and proof map in your brand file, so a new ad starts from step 2.
  - After each run, record the result with the keyed ad results log keeper.
  - Test a gain headline against a loss headline from step 2.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Writing, sorting and checking copy in sequence works well in any strong chat AI."}
    - {name: "Your ad platform or a coupon code", why: "Lets you key the finished ad so you can see which version pulled."}
  inputs:
    - "Product facts with exact numbers and sources"
    - "Customer reviews or emails, word for word"
    - "Your offer terms, written exactly"

terms:
  - term: Five fundamentals
    meaning: Get attention, show an advantage, prove it, persuade the reader to take it, and ask for action.
  - term: Lead want
    meaning: The one thing the buyer wants that your facts can back, and that the ad leads with.
  - term: Proof map
    meaning: A table pairing each claim with its strongest proof and the kind of proof it is.
