new_slug: flaw-into-selling-point
name: "Make a flawed or copycat product worth buying"
summary: "Give it your product and its flaw. Get a stage read, a new frame, how it works and a claim check."
job: write-ad-copy
thinking: high
thinking_why: "It tests reframes against the facts and must reject any that would mislead. Give it your strongest model."

headline: "Turn the trait that puts buyers off into a reason to buy"
subhead: "Give it your product, the thing buyers dislike and what rivals claim. It reads your buyers and market, tests four ways to give the product a new, true meaning, explains how it works so the new frame is believed, and checks the claim is yours and not a rival's."

explain: |
  Some products come with a built-in turn-off: a high price, a strong smell, a hard-looking setup, an audience that seems too small. Other products are fine, but every rival says the same thing, so buyers stop listening. A better pitch does not help in either case. The buyer has already made up their mind before reading it.

  This workflow, built on a summary of Eugene Schwartz's Breakthrough Advertising, first reads how aware your buyers are and how many claims they have heard. Then it names the handicap in the buyer's own words and tests fixes: turn the trait into proof, cut the product down to one thing the buyer does, tie it to a bigger concern, or reset the price comparison with a sum. Only a fix that is true is kept. A short cause-and-effect passage then explains how it works, and a claim check tests that only you can say it. The source is a third-party summary, so treat its detail as second-hand.

when:
  - Buyers back away from something about your product before they read the benefits.
  - Your product costs more than the usual alternative and you cannot cut the price.
  - Every rival makes your claim and yours sounds like theirs.

you_give:
  - "Your product facts: price, what it does, how it is used, what buyers dislike"
  - What rivals claim, pasted from their ads and pages (optional)
  - Customer words about the trait, such as reviews, word for word (optional)

you_get:
  - A stage brief that says what your buyers know and what a headline may say
  - The handicap in the buyer's words, a test result for each fix and a new one-line definition
  - A passage that carries the new frame and a how-it-works chain behind it
  - A claim check on whether the offer is stated, only you can say it and it is strong enough to pull

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give it your product facts and, if you have them, rival claims and what buyers say about the trait.
  - It works step by step and saves each result. Read the fix results before the passage.

how_it_works:
  - title: Read the market
    text: "Names the want, places buyers on the awareness scale and the market on the claim-fatigue scale, and writes the stage call as a short brief."
  - title: Reframe the product
    text: "Names the handicap in the buyer's words, tests the matching fix, keeps one that is true, and writes the new definition and the passage that carries it."
  - title: Explain how it works
    text: "Builds a chain of cause and effect from your facts so the new frame is believed. Any link without a fact is left out."
  - title: Check the claim
    text: "Checks the offer is stated, that only you can say it and that it is strong enough to pull, and lists the fixes."

output_shape: |-
  STEP 1: THE STAGE BRIEF
    Want: <...> | Awareness: <...> | Claim-fatigue stage: <1-5> | MAY / MAY NOT: <...>

  STEP 2: THE NEW DEFINITION
    Handicap: <buyer's words> | Kind: <...>
    Fixes tried: <fix | result>
    Definition: <one line>
    Passage: <60 to 120 words>

  STEP 3: HOW IT WORKS
    Chain: <because ... which ... so ...>
    In place: <passage with the chain added>

  STEP 4: CLAIM CHECK
    Offer stated: <...> | Only you: <...> | Pull: <...> | Fixes: <...>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: Buyer's words about the trait
    how: Paste the reviews and questions that mention it word for word. The fix is only as true as your picture of the doubt.
  - what: The price sum
    how: Give the price, the number of uses and the cost of the usual alternative, so the price comparison can be reset with real numbers.
  - what: A loved rival
    how: If buyers are loyal to a rival, name it and give facts about how you differ. Without facts, that passage is skipped.

judge:
  - The handicap is in the buyer's words and each fix has a written test result.
  - The new frame is true of the product and of what the buyer receives.
  - Any price sum shows its numbers and divides correctly.
  - Every link in the how-it-works chain is backed by a fact you gave.
  - If no fix is true, the run says so and suggests another strength to lead with.

test:
  - Run it on a product that has a known handicap a rival has already reframed. See if it finds a similar fix.
  - Remove the good thing that comes with the trait and run it again. It should report no honest fix, not invent one.
  - Show the new definition to a buyer and ask what they expect to find in the box.
  - Check the price sum with a calculator.

improve:
  - Keep a list of handicaps buyers raise, in their words, and paste it in each time.
  - Save frames that worked, with the test result.
  - After the run, put the new definition in your headline and test it against your control.
  - Add words you would never use about a rival to the check.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Testing fixes against facts, writing the winner and checking the claim works well in any strong chat AI."}
    - {name: "A calculator", why: "Check the price sum yourself before the frame goes live."}
  inputs:
    - "Reviews and questions that mention the trait"
    - "Price, number of uses and the cost of the usual alternative"
    - "Rival claims, pasted from their ads and pages"

terms:
  - term: Handicap
    meaning: A trait of the product that puts buyers off before they read your pitch.
  - term: Redefinition
    meaning: Giving the product a new, true meaning that turns the handicap into part of the case for it.
  - term: Claim fatigue
    meaning: How many times buyers have heard your kind of promise, so the same words no longer work.
