new_slug: free-sample-launch
name: Launch with a free sample and learn what customers cost
summary: Plan a free sample offer and a small launch test. Then work out what each customer really costs and how soon sales pay it back.
job: make-offer
thinking: high
thinking_why: It plans a test and does sums you will rely on with real money. Give it your strongest model.
headline: Launch with a free sample and learn what a customer costs
subhead: Give it your product and price. It designs a free sample offer and plans a small test in a few places with a rule for what counts as a win. After you run it, it works out what each customer really cost and how soon sales pay that back.
explain: |
  New products often launch with a big spend. The money goes into ads before anyone knows if the product sells, and the only numbers afterward are replies and clicks. Replies are cheap and often come from people who never buy, so the ads that look best may be losing money.

  The steps start small and measure what counts. First it designs a free sample that reaches interested people and caps the budget. Then it plans a test in four or five places, with a rule written before you start that says whether to roll out, change or drop. Once you have run it, it adds up every cost, counts real customers instead of replies, and shows what a customer cost and how soon sales cover it. The order comes from Scientific Advertising by Claude C. Hopkins (1923).
when:
  - You are launching a product and want to try it on a small crowd before you spend big on ads.
  - Your ads bring plenty of replies or clicks, but you cannot tell what a paying customer costs.
  - You have a new offer or idea and want a clear rule for when to roll it out, change it or drop it.
not_for:
  - "You have no price or ad history yet: use the Ad test brief writer first to plan what to test."
  - "You only want the sample offer itself: use the Free sample offer planner."
  - "You want to check a discount against margin and ad cost: use the Discount margin and ad-cost checker."
you_give:
  - Your product facts, such as what it is, its size and what it costs to make
  - Your price
  - Your current offer (optional)
  - A sample budget and where you could offer it, such as towns, lists, shops or channels (optional)
  - Costs for ad space or spend, samples, handling and follow-up, after the test
  - Replies and orders for each ad, headline or offer, after the test
  - Repeat orders you can show (optional)
  - Time to run the test in a few places
you_get:
  - A free sample offer in words you can use, who gets it, how they claim it and a capped budget
  - A small test in four or five places, what to measure, and a roll out, change or drop rule set before you start
  - What a customer really costs for each ad, headline and offer, how soon sales cover it, the most you can pay for a customer and which ads to keep
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give it your product and price. It writes the sample offer and the test plan, then stops.
  - Run the test in a few places and write down samples sent, replies and orders for each place.
  - Bring the numbers back and say "carry on". Read the cost per customer last.
output_sample:
  input:
    - Your product facts, such as what it is and what it costs to make
    - Your price
    - Your sample budget and where you could offer it (optional)
    - "Your test results: costs, replies and orders for each ad, after the test"
  prerequisites:
    - An AI that can read files, such as Claude with the handoff pack
    - Your brand brain from the Website brand brain builder (optional)
  output:
    - name: Free sample offer
      contains: The offer in words you can use, who gets it, how they claim it and a capped budget.
    - name: Small launch test plan
      contains: One question, four or five places to try it, what to measure and a roll out, change or drop rule.
    - name: Cost per customer
      contains: Cost by ad, headline and offer, days to pay back, the most you can pay for a customer and ads to keep.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Design the sample
    text: Picks the smallest piece a buyer can try, says who gets it and how they claim it, and caps the sample budget.
  - title: Plan the small test
    text: Takes the offer from the step before and sets one question, four or five places to try it and a rule for roll out, change or drop.
  - title: Work out the cost
    text: Takes your test numbers, counts real customers instead of replies, and shows cost per customer, how soon it pays back and which ads to keep.
output_shape: |-
  STEP 1: SAMPLE OFFER
    The offer in words you can use | who gets it | how they claim it | sample budget and cap | cost-per-customer check

  STEP 2: TEST PLAN
    The one question | four or five places, each with a reason | what to measure | roll out, change or drop rule

  (you run the test)

  STEP 3: COST PER CUSTOMER
    Cost by ad, headline and offer | days to pay back | the most you can pay for a customer | data score out of 100 | ads to keep

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: What your sample is
    how: Say the smallest piece a buyer can try at home. A sample that shows the product at its best brings customers, while one that does not brings freebie hunters.
  - what: How you label every reply
    how: Give each ad, place and offer its own code or name. Without it you cannot tell which one brought the customer.
  - what: The rule you write before you start
    how: Fix the numbers that mean roll out, change or drop now. After the test, it is easy to explain any result away.
judge:
  - The sample is free, easy to claim and limited so it reaches buyers, not strangers.
  - The test asks one question and has a rule written before it starts.
  - Cost per customer counts real customers, not replies.
  - Every cost is listed, including samples and follow-up.
  - No number is invented, and gaps in the data are listed.
test:
  - Give step 3 numbers where one ad has the most replies and another has the most orders. The cost per customer should favour the second.
  - Look at the roll out, change or drop rule and ask if you would follow it if the result was close. If not, tighten it.
  - Run step 1 twice on the same product. The offers can differ but both should be free and capped.
improve:
  - Save the winning offer and the cost per customer into your brand file, so later ad plans start from what you can afford to pay.
  - Add your real cost to make and ship the sample, so the budget cap is exact.
  - After a successful test, run it again in a few new places before you scale, as the plan suggests.
