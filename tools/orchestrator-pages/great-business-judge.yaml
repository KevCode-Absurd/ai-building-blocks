new_slug: great-business-judge
name: Judge if a business is great enough to hold
summary: Judge if a business is great enough to hold for years. Get its edge tested, who keeps the gain, and a keep, wait or pass call.
job: money-and-investing
thinking: high
thinking_why: It carries findings through five checks and runs sums on your figures. Give it your strongest model.
headline: Find out if a business is great enough to hold for years
subhead: Describe a business and what you know about it. It tests the edge and the wall around it, checks you can truly judge it, asks who keeps any gain, rates the managers and runs the long sums. You get a keep, wait or pass call. It is a method of analysis, not personal financial advice.
explain: |
  This workflow looks at the business before the price. Over many years, the owner's return follows what the business itself earns.

  It runs five checks in order. It tests the edge and the barrier that protects it, then asks if this is a business you can truly judge. Next it asks who keeps any gain: owners, or customers and rivals. It rates how able, honest and owner-minded the managers are from what they did with cash. Last it runs the long-hold sums with your figures and compares them with your next best choice. The approach is inspired by Charlie Munger's talks in Poor Charlie's Almanack. It gives no buy or sell calls on any named security.
when:
  - You are studying a business to own for years and want to know if it is a great one before you look at price.
  - A business looks cheap, and you want to know if it is cheap for a good reason.
  - You like a business as a customer and want to test that against how it earns.
not_for:
  - "You want a buy or sell call on a listed stock or a trade: this gives no calls on named securities, so use a licensed financial adviser."
  - "You only want to know if a price is too high after you like the business: use the Mispriced bet tester."
  - "You cannot study the business in depth, such as a firm with no public facts: ask someone who knows the field first, then come back."
you_give:
  - The business, what it sells and who its main rivals are
  - What you know about it and your own background in the field
  - "Any figures, such as returns on the money invested, price history and what managers did with cash (optional)"
  - The changes to test, such as a cost cut or a better product
  - Your tax rate and your next best choice for the money (optional)
you_get:
  - The edge and the barrier around it, with the kinds of scale that apply
  - A sort of the business into yes, no or too tough, with your real edge written down
  - Who keeps the gain from any improvement, and how rivals behave
  - Ratings for able, honest and owner-minded managers, each with its evidence
  - The long-hold sums and a keep, wait or pass call with the figures that would change it
how_to_use:
  - Download the handoff pack. It holds HANDOFF.md plus one skill file for each step.
  - Open Claude Code, or a Claude Project where you can add files. Give it the folder and say "Follow HANDOFF.md".
  - Gather the business facts, at least five years of return on invested money, what managers did with cash, your tax rate and your next best choice. Say plainly what you have done in the field.
  - Let it run one step at a time. It saves each result as a file before the next step starts.
  - Read the circle of competence result before the final call. If it says too tough, treat the call with care.
  - The figures are yours, and the call rests on them. Any figure not checked against the company's annual reports is marked unverified.
  - The call judges the business, not your money. It does not know your savings, debts or goals, so it is not advice to buy, sell or keep anything.
  - Check the HAND-BACK SUMMARY for MISSING lines. Fill those gaps and rerun the steps that need them.
output_sample:
  input:
    - The business, what it sells and who its main rivals are
    - What you know about it and what you have done in the field
    - Five or more years of return on invested money, and what managers did with cash (optional)
    - Your tax rate and your next best choice for the money (optional)
  prerequisites:
    - An AI that can work with files, such as Claude Code or a Claude Project, to run the handoff pack (these may need a paid plan)
  output:
    - name: Business power tester
      contains: What customers get that rivals cannot match, the barrier that protects it, and the kinds of scale at work.
    - name: Circle of competence sorter
      contains: Your five answers, your real edge or none, and a yes, no or too tough sort.
    - name: Who-keeps-the-gain tester
      contains: Whether gains stay with owners or pass to customers and rivals, and if the industry is commodity, brand-led or protected.
    - name: Owner-minded management checker
      contains: A log of what managers did with cash and ratings for able, honest and owner-minded.
    - name: Long-hold return calculator
      contains: The long sums, a comparison with your next best choice, and a keep, wait or pass call.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Tests the edge and the wall
    text: Names what customers get that rivals cannot match, the barrier that protects it and the kinds of scale at work, and checks the opposite pull of size.
  - title: Checks you can judge it
    text: Asks five plain questions you answer without notes, writes down your real edge and sorts the business as yes, no or too tough.
  - title: Asks who keeps the gain
    text: Runs a two-line sum on each improvement, with and without rivals getting it, and sorts the industry as commodity, brand-led or protected.
  - title: Rates the managers
    text: Logs what they did with spare cash, compares pay with owner results and rates able, honest and owner-minded from the record.
  - title: Runs the long sums
    text: Shows how the business return caps the owner's, how entry price shifts it and what tax timing costs, then compares with your next best choice.
output_shape: |-
  STEP 1: BUSINESS POWER TESTER
    Benefit: <what customers get> | Barrier: <what stops copying> | Scale forces: <list>
    Size and life of the prize: <note>

  STEP 2: CIRCLE OF COMPETENCE SORTER
    Five answers: <KNOW / GUESS / BLANK each> | Your edge: <edge or none>
    Basket: <YES / NO / TOO TOUGH> | First question you cannot answer: <question>

  STEP 3: WHO-KEEPS-THE-GAIN TESTER
    Change | owner keeps if only you get it | owner keeps if rivals do too
    Rivals: <calm or fights for share> | Industry: <commodity / brand-led / protected>
    Verdict: <gains stick / leak / contested>

  STEP 4: OWNER-MINDED MANAGEMENT CHECKER
    Cash log: <year> | <choice> | <GOOD / POOR / UNKNOWN>
    Ratings: Able <r> | Honest <r> | Owner-minded <r> | Call <note>

  STEP 5: LONG-HOLD RETURN CALCULATOR
    Business return: low <%> middle <%> high <%>
    Cap sum, price grid, tax sum | Next best choice: <choice>
    Call: <KEEP / WAIT / PASS> | Changes if: <figures>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Your background
    how: Say exactly what you have done in the field. Step 2 turns "I like it" into a real edge or none.
  - what: Years of record
    how: Give at least five years of the business's return on invested money. One year can mislead.
  - what: Your next best choice
    how: Name a real alternative for the money. The final call is measured against it.
  - what: How strict to be
    how: Say how large a share of your resources this would be. The bar for a keep rises with the stakes.
judge:
  - The edge is named as something customers get and rivals cannot match.
  - The sort into yes, no or too tough follows its stated rule.
  - Each change has a sum with and without rivals getting it.
  - Every manager rating has an evidence line or says missing.
  - The call is measured against a real alternative and names the figures that would change it.
  - Nothing says to buy or sell a named security.
test:
  - Run it on a business you work in. Step 2 should find a clear edge.
  - Run it on a field you only read about. Step 2 should say too tough, and the call should wait.
  - Leave out the return figures. The final step should refuse to give a call and list what is missing.
  - Run it twice on the same facts. The baskets and the call should match.
improve:
  - Keep a log of your calls and what happened, so you see where you judge well.
  - Add the typical mistakes in your field to step 3.
  - Rerun it once a year on each business you hold, since edges and managers change.
  - Run the "Mispriced bet tester" after a keep, to test the price.
next: [mispriced-bet-tester]
