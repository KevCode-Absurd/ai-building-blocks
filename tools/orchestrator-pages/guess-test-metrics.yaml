new_slug: guess-test-metrics
name: "Test your riskiest guess and measure what counts"
summary: "Give it your product idea. Get the riskiest guess, the smallest test, honest numbers and the root cause of a miss."
job: test-an-idea
thinking: high
thinking_why: "It has to tell real progress from numbers that only look good. Give it your strongest model."

headline: "Test the guess your idea depends on, and read the results honestly"
subhead: "Give it your product idea. It finds the guess the idea rests on most, designs the smallest test and sets the pass numbers before you run it. After the test, it replaces vanity numbers with ones that show cause, then traces any miss back to a cause you can fix."

explain: |
  Most people build the whole product first and find out later that the riskiest guess was wrong. When they do test, they watch numbers that only go up, such as total sign-ups or page views, which look like progress whether or not the idea works.

  This workflow tests one guess at a time. It picks the guess that would sink the idea, plans the smallest test that can teach you about it, and sets what counts as a pass before you run it. You run the test and collect the numbers. Then it swaps vanity numbers for per-customer rates and splits results by group, and, if the result missed, asks why until it reaches a cause you can fix. The method comes from Eric Ries and The Lean Startup.

when:
  - You have a product idea and want evidence before you build more of it.
  - Your numbers are going up but you can't tell if the business is better off.
  - A test or launch missed its target and you need to know why before you try again.

you_give:
  - Your product idea and the guesses it depends on
  - Your current plan (optional)
  - The numbers from your test, such as visits, sign-ups and sales, for the later steps
  - Notes from customers or the team on what happened (optional)
  - Time to run the test and collect its numbers

you_get:
  - The riskiest guess, the smallest test, the numbers that count as a pass and a rule for when to change direction or keep going
  - Your reported numbers marked as vanity or real, with a per-customer or per-group rate in place of each
  - A chain of whys checked against facts, the cause you can fix and a check that it won't happen again

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe your idea. It runs step 1 and stops.
  - Run the test with real customers and collect the numbers it asked for.
  - Bring the numbers back and say "carry on from step 2". Add your notes on what happened.

how_it_works:
  - title: Plan the smallest test
    text: "Lists the guesses your idea depends on and picks the riskiest. Designs the smallest test, sets the pass numbers and a rule for changing direction."
  - title: Fix the numbers
    text: "Takes your test results and the plan from step 1. Marks the vanity numbers and swaps each for a rate per customer or group."
  - title: Find the root cause
    text: "If the result missed, asks why of what you saw, then why of that answer, until it reaches a cause you can fix. Checks each answer against facts."

output_shape: |-
  STEP 1: SMALLEST TEST
    Guesses: <what the idea depends on>
    Riskiest: <...>
    Test: <smallest product or ad test, one group at a time>
    Pass line: <numbers, set before running>
    Rule: <change direction / keep going>

  (you run the test)

  STEP 2: HONEST NUMBERS
    Vanity: <number | why it misleads>
    Real: <rate per customer or group | what could have caused a move>
    The one number that must change: <...> by <date>
    Data check: <who collects it, how often, what could be missing>

  STEP 3: ROOT CAUSE
    Problem as seen: <place and date>
    Whys: <chain, each checked against a fact>
    Cause you can fix: <...>
    Prevention check: <...>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: How exact your guesses are
    how: Write each guess as a sentence that could be wrong, such as that one in ten visitors will join a waitlist.
  - what: Your pass numbers
    how: Set them before you run the test. Numbers chosen afterwards will always look like a pass.
  - what: Splitting results by group
    how: Give results by customer group and by version. A total can hide a group that is leaving.

judge:
  - The riskiest guess is the one that would sink the idea if wrong.
  - The test is small enough to run in days or weeks, not months.
  - The pass line has numbers and was set before the results.
  - Every vanity number is replaced with a rate per customer or group.
  - Each why in the chain is backed by a fact, not by blame.

test:
  - Give it a past launch that missed. It should find a cause you can name and fix.
  - Give it a report full of totals only. Each total should come back as a rate.
  - Run step 1 twice on the same idea. The riskiest guess should be the same.

improve:
  - Keep a log of every guess and its result, so a later test starts from what you already know.
  - Save the pass line and rule in your brand file or plan before each test.
  - After a root cause, add its prevention check to your launch checklist.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Holds the plan, the results and the chain of whys across the pause."}
    - {name: "A spreadsheet", why: "Lets you calculate per-customer rates from your raw numbers."}
  inputs:
    - "Raw numbers by customer group and week"
    - "A list of what changed in the product between versions"
    - "Quotes from customers who left"

terms:
  - term: Vanity number
    meaning: A total that only goes up, such as page views, which can look like progress without showing whether the business works.
  - term: Pass line
    meaning: The result you set in advance that counts as the test working.
  - term: Chain of whys
    meaning: Asking why something happened, then why of that answer, until you reach a cause you can fix.
