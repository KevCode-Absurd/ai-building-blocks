new_slug: headline-test
name: "Write headlines and pick the winner with a small test"
summary: "Write headlines, check each one names its reader and promises a reward, then plan a small keyed test that picks the winning headline."
job: plan-ad-tests
thinking: high
thinking_why: "It writes, checks and then designs a fair test. Give it your strongest model."

headline: "Headlines that pass a reward check, and a fair test to pick the best"
subhead: "Give it your brief, your product facts and your offer. It writes headlines for the ideas in the brief and marks the one to test first. It checks each one picks the right reader and promises a clear reward. Then it plans a small keyed test and a rule for choosing the winner."

explain: |
  Most headlines are chosen by whoever likes them most. A headline can sound clever and still fail to name the reader, or promise nothing worth reading for. When there are several, they get picked on taste, or compared in a test that changes five things at once.

  This workflow writes headlines for each idea in your brief, then checks each against a few questions: does it pick out the right reader, does it promise a reward, and does it still make sense when read on its own? Weak lines are rewritten. It sorts the headlines by appeal, picks two or three to test, and plans a small test where each version has its own code, so you know which one brought each reply. It is inspired by Victor Schwab's 100 Good Advertising Headlines; the step order is this library's own design.

when:
  - You need a headline for an ad, email or page and have several ideas but no way to choose.
  - Your headlines get clicks but the wrong people, or the right people but not enough of them.
  - You are about to spend on an ad and want a small, fair test before you do.
not_for:
  - "You need one obvious headline and have no choice to make: write it yourself, or use the Ad headline writer on its own."
  - "You have no offer yet, so there is nothing to promise: use the Hidden offer finder first."
  - "You want the first line of an ad, not a headline: use the Ad opening writer and reviewer."

you_give:
  - Your brief (who it is for and the ideas to work from)
  - Your product facts
  - Your offer, including price and any deadline
  - Time to run the small test and write down the replies and costs

you_get:
  - Headlines for each idea in the brief, with the one to test first marked
  - A check of each headline for reader and reward, with stronger versions of the weak ones
  - A test plan with the headlines sorted by appeal, a code for each version and a rule for picking the winner

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give it your brief, product facts and offer.
  - It works step by step and saves each result. Read the checked headlines before you read the test plan.
  - Run the small test and note replies and cost per reply for each version.
output_sample:
  input:
    - "Your brief: who it is for and the ideas to work from"
    - "Your product facts: price, how it is used, what it is made of"
    - Your offer, with price, terms and any deadline
  prerequisites:
    - An AI that can read files and save results as files, such as Claude Code or a Claude Project
    - Your brand brain, buyer brief and offer from earlier items (optional)
  output:
    - name: outputs/step-01-ad-headline-writer.md
      contains: Headlines for each idea in the brief, what they are allowed to say, and the one to test first.
    - name: outputs/step-02-headline-promise-checker.md
      contains: A check of each headline for reader and reward, with stronger versions of the weak ones.
    - name: outputs/step-03-keyed-headline-test-planner.md
      contains: Headlines sorted by appeal, a code for each version, a small first test and a rule for picking the winner.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.

how_it_works:
  - title: Write the headlines
    text: "Sets what the headline may say from your brief and facts. Writes one line for each way in and marks the one to test first."
  - title: Check the promise
    text: "Takes the headlines and checks each one names its reader and promises a reward worth reading for. Rewrites the weak lines and lists the changes."
  - title: Plan the keyed test
    text: "Sorts the checked headlines by appeal, picks two or three to test and gives each a code. Sets a rule for picking the winner on replies per cost."

output_shape: |-
  STEP 1: HEADLINES
    Allowed to say: <from the brief and facts>
    Headlines: <way in | headline>
    Test first: <...>

  STEP 2: PROMISE CHECK
    Per headline: <reader it picks out | reward: gain or loss avoided | speed, ease or cost if true | passes the so-what test?>
    Rewrites: <weak line | stronger version | what changed>

  STEP 3: KEYED TEST PLAN
    Sorted by appeal: <self-interest / news / curiosity tied to a promise>
    Test: <two or three versions, one change at a time> | Codes: <one per version>
    Small test first: <size and where>
    Winner rule: <replies per cost>, recorded with the reason

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
    CHECKS MISSED: <checks that failed or could not run, or none>

tweaks:
  - what: The offer
    how: Include price, terms and any deadline. A headline can only promise what the offer delivers.
  - what: The reader
    how: Name who it is for in one line. The check can only judge a headline against a reader you've named.
  - what: Where you will test
    how: Say where the headlines will run, such as ads, email or a page, so the test plan fits it.

judge:
  - Each headline picks out a reader and promises a reward in the headline alone.
  - Curiosity headlines are tied to a clear promise about the product.
  - Any speed, ease or cost claim in a headline is true for your offer.
  - The test changes one thing at a time and gives each version its own code.
  - The winner rule is set before the test, on replies per cost.

test:
  - Give it a headline you know performs badly. The check should say why it fails.
  - Cover the body of an ad and show only the winning headline to a stranger. Ask what they'd expect to get.
  - Run the small test with the codes and see whether you can trace every reply to a version.

improve:
  - Keep every headline you test, with its appeal type and result, and look back at which types win for you.
  - Add your own banned claims to the check, such as results you can't back up.
  - Re-run step 3 with the winner and two new challengers each round.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Writes, checks and plans the test in one run."}
    - {name: "Meta Ads Manager or Google Ads", why: "Runs the small test and reports replies and cost for each version."}
  inputs:
    - "Your past best-performing headlines"
    - "Reviews showing what buyers care about"
    - "The reply path you will key, such as a code or link"

terms:
  - term: Keyed test
    meaning: A test where each version carries its own code or link, so every reply can be traced to the version that brought it.
  - term: So-what test
    meaning: Reading the headline alone and asking whether a stranger would care.
