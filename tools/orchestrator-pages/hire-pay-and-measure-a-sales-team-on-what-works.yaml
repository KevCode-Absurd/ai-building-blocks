new_slug: hire-pay-and-measure-a-sales-team-on-what-works
name: Hire, pay and measure a sales team on what works
summary: Describe your sale and past hires. Get a hiring scorecard, a pay plan check and one early sign of customer success.
job: lead-people
thinking: high
thinking_why: It reads your hires, pay and customer data and has to spot patterns without inventing any. Give it your strongest model.
headline: Hire, pay and measure a sales team on what works
subhead: Describe what you sell, how long a sale takes and how past hires turned out. It builds a scorecard with a test for each trait. Then it checks your pay plan against who stays, and defines one early sign that a new customer will stick around.
explain: |
  Sales teams are often built on gut feel. People get hired because they interview well, paid on whatever closes the most, and measured on calls and meetings. Then the best talkers sell to customers who leave in a year, the pay plan rewards that, and nobody can say why some reps keep customers and others do not.

  The steps tie the three together. First it builds a 1 to 10 scorecard for hiring, with a test for each trait, based on how your own past hires turned out. Then it checks what your pay plan rewards and ignores, by lining up reps by how many customers stayed next to what they earned. Last, it defines one early sign of customer success, such as a percent of customers who do one action within a number of days. The order comes from Mark Roberge's The Sales Acceleration Formula.
when:
  - You are building a sales team and want hiring, pay and targets to rest on data instead of gut feel.
  - Your top earners bring in customers who leave early, and you want to see if the pay plan is part of the cause.
  - You can only tell if a customer is doing well after they cancel, and you want a sign you can see in the first weeks.
you_give:
  - What you sell, who buys it, how hard it is to explain and how long a sale takes
  - How past hires turned out, with a few notes on each (optional)
  - Traits you think matter (optional)
  - Your pay plan in words or a table, with each rep's sales and how many of their customers stayed or left
  - What customers did after they bought, with dates, and which ones stayed or left
  - Cost to win a customer and what a customer pays over time (optional)
  - Two quarters, if you want to see the pay change work
you_get:
  - A 1 to 10 scorecard with a definition, a test and a one-page score sheet for each trait, and a date to check it against real results
  - What your pay plan rewards and ignores, reps ranked by churn next to their earnings, and one change to test with the number that would prove it
  - One early sign of customer success written as a percent, an action and a time limit, with a way to measure it by cohort
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe your sale and your past hires. It builds the scorecard first.
  - Share your pay plan and each rep's results. Give any pay change at least two quarters before you judge it.
  - Share what customers did after buying. It sets the early sign last and checks it against your costs.
how_it_works:
  - title: Build the scorecard
    text: Describes your sale, defines the traits that predict success, and writes what a 1, 5 and 10 look like with a test for each.
  - title: Check the pay plan
    text: Takes the scorecard and your pay plan, ranks reps by how many customers stayed, and finds what the plan rewards that you did not mean to.
  - title: Define the early sign
    text: Takes the findings from the step before and writes one sign of success as a percent, an action and a time limit that you can check in 30 to 60 days.
output_shape: |-
  STEP 1: HIRING SCORECARD
    Sale profile | traits with a 1, 5 and 10 anchor | test for each trait | one-page score sheet | date to re-check

  STEP 2: PAY PLAN CHECK
    What the plan pays for | what it ignores | reps ranked by churn next to earnings | one change to test with its number | guesses and gaps

  STEP 3: EARLY SIGN OF SUCCESS
    What kept customers did early | the sign: <P percent do <action> within <T days> | cohort measure | lifetime value against cost to win

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Notes on your past hires
    how: A few honest lines on your best and slowest hires let it compare them. With none, the scorecard rests on general traits and says so.
  - what: How you measure retention
    how: Customer churn by rep is the strongest signal for step 2. If you only have revenue, say so and it will flag the gap.
  - what: The time window for the early sign
    how: Shorter windows give you answers sooner but may be less certain. Pick a window you can really check in 30 to 60 days.
judge:
  - Each trait has a clear 1, 5 and 10 and a test you could use in an interview.
  - The pay plan check shows what is paid for, not only what you meant to pay for.
  - Reps are ranked by customers kept, not only by sales.
  - The early sign is written as a percent, an action and a time, and can be measured.
  - It states what it guessed and what the data could not show.
test:
  - Give it a pay plan that pays only on first sales. It should flag that nothing rewards keeping customers.
  - Score two past hires, your best and your slowest, on the new sheet. The scores should be clearly apart.
  - Check the early sign against two cohorts of customers you already know. The percent should be higher for the group that stayed.
improve:
  - Save the scorecard and the early sign into your brand file, so hiring and onboarding use the same words.
  - Re-score your scorecard against real results on the date it sets, and cut or add traits.
  - Add the cost to win a customer, so the last step can check lifetime value before you add more sellers.
