new_slug: idea-market-test
name: "Test if your idea can own its market"
summary: "Test your business idea against its market. Get a market size, a ten-times test, a ten-year check and a go, fix or stop call."
job: test-an-idea
thinking: high
thinking_why: "It runs five skills and has to tell a real edge from a story that flatters you. Give it your strongest model."

headline: "Find out if your idea can own its market, or only join a crowded one"
subhead: Give it your idea. It finds the belief the idea rests on, sizes your market the way a buyer sees it, and tests whether you are ten times better than what buyers use now. It checks the edge will hold in ten years, then scores seven make-or-break questions and gives a go, fix or stop call.

explain: |
  A weak idea often fails in a familiar way. The market is described to look small and alone. The product is a little better, which buyers shrug at. The plan never asks what happens in year five. Each step feels fine and the whole thing is weak.

  This workflow runs your idea through five checks in order. The first finds the belief you are betting on and whether it is new or a copy. The second works out your share of the market a buyer really compares you in. The third measures your gap to the closest substitute after the cost of switching. The fourth asks who can copy you and what could end your edge. The fifth scores seven questions, including timing, people and how you reach buyers, and names the weakest one as your first fix.

when:
  - You have a business idea and want to know if it can win a market for good before you put years into it.
  - Your plan says you have no competitors, or that you only need a small share of a huge market.
  - You are about to pitch backers or hire a team and want to know where the plan is weakest.
not_for:
  - "Your product already has proven sales and you want to improve them: use a pricing review or a sales review instead."
  - "You want to check how strong your edge is over rivals: use the Ten-times-better checker."
  - "You want to test the guesses behind your plan: use the workflow Find the riskiest guess in your plan and test it."

you_give:
  - Your idea in a few sentences, and who it is for
  - Any numbers you have on customers, sales or costs (optional)
  - Who is on the team and how long you have worked together (optional)
you_get:
  - The belief your idea rests on, and whether it is new or a copy
  - Your share of the market a buyer really compares you in
  - The gap to your closest substitute, after switching costs
  - How much of your value lies past year five, and what could end your edge
  - A score on seven questions, a go, fix or stop call, and the first thing to fix

how_to_use:
  - Download the handoff pack. It holds HANDOFF.md plus one skill file for each step.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe your idea and paste any numbers, lost-deal notes and team facts you have. It works step by step and saves each result.
  - If step 2 says sliver, the later steps work on the narrower market. If steps 3 and 4 disagree, you see both.
  - Read the weakest question last, then do the first fix it names before you spend more.
output_sample:
  input:
    - Your idea in a few sentences, and who it is for
    - Your numbers on customers, sales and costs (optional)
    - Why recent buyers said no, in their words (optional)
    - Your team and how long you have worked together (optional)
  prerequisites:
    - An AI that can save files, or one that lets you copy each step's result by hand
  output:
    - name: "Step 1: The belief"
      contains: The one belief your idea rests on, whether it is new or a copy, and a first market.
    - name: "Step 2: The market"
      contains: Your share of the market a buyer really compares you in, and a call on whether you own it.
    - name: "Step 3: The gap"
      contains: How far you are ahead of the closest substitute after the buyer's cost of switching.
    - name: "Step 4: Ten years out"
      contains: How much value lies past year five, who can copy you, and what could end your edge.
    - name: "Step 5: Seven questions"
      contains: A score on seven questions, a go, fix or stop call, and the weakest question as your first fix.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.

how_it_works:
  - title: Finds the belief
    text: Writes the one belief your idea rests on, checks it is true and not only unusual, and says if the idea is new or a copy.
  - title: Sizes the market
    text: Describes your market narrowly and widely, works out your share of each, and finds the one buyers compare you in.
  - title: Tests for a ten-times edge
    text: Measures you against the closest substitute on the one thing the buyer cares about, minus the cost of switching.
  - title: Checks ten years out
    text: Shows how much value lies past year five, who can copy you and how fast, and what could end the edge.
  - title: Scores seven questions
    text: Engineering, timing, monopoly, people, distribution, durability and secret, each with a pass line, then a go, fix or stop call.

output_shape: |
  STEP 1: THE BELIEF
    Belief: <one sentence> | New or copy: <verdict> | First market: <>

  STEP 2: THE MARKET
    Share at four sizes: <> | The market buyers compare you in: <> | Call: <own / reach / sliver / fiction>

  STEP 3: THE GAP
    Measure: <unit> | Substitute <> vs yours <> | Net gap: month 1 <> quarter <> year <> | Verdict: <>

  STEP 4: TEN YEARS OUT
    Value past year 5: <x%> | Copiers and months: <> | What could end the edge: <> | Call: <lasting / fading / unknown>

  STEP 5: SEVEN QUESTIONS
    Engineering <0-2> Timing <0-2> Monopoly <0-2> People <0-2> Distribution <0-2> Durability <0-2> Secret <0-2> | Total <n>/14
    CALL: <go / fix / stop> | First fix: <weakest question, task this week>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: Your numbers
    how: Paste real customer, sales and cost figures. Every sum in steps 2 to 4 uses them in place of estimates.
  - what: Lost deals and buyer words
    how: Add why recent buyers said no, in their words. That is the best evidence for step 2.
  - what: Your team
    how: Give each person's role, hours and how long you have worked together. Step 5 scores people from it.

judge:
  - Each step used the result of the step before.
  - Every share, gap and score is tied to a number or a fact, or says MISSING.
  - The market used is the one buyers compare you in, not the one in your slide.
  - No step invented a fact to fill a gap.
  - The first fix is a task you could start this week.

test:
  - Run it on a plan that says it has no competitors. Step 2 should find what buyers pick instead.
  - Run it on a product that is 15% better than the old way. Step 3 should call it marginal.
  - Run it twice on the same input. The final call should be the same, even if the wording differs.

improve:
  - Save your lost-deal notes and yearly numbers in your brand file, so later runs start from them.
  - After the first fix, run steps 4 and 5 again and compare the totals.
  - Pair it with "Pick the small market to own first, then the ones after" if step 2 says sliver.

works_best_with:
  tools:
    - {name: "Claude", why: "Holds five checks, their sums and your plan in one run."}
  inputs:
    - "Customer, sales and cost numbers"
    - "Notes on why recent buyers said no"
    - "Team history and who works full time"

terms:
  - term: Net gap
    meaning: How much better you are than the old way after you take off the buyer's cost of switching.
  - term: Durability
    meaning: Whether your edge is still there in ten years.
  - term: Substitute
    meaning: What a buyer would use or do if your product did not exist.
next: [riskiest-guess-test]
before: []
