new_slug: image-ad-test-plan
name: Plan image ad tests from the ads you already run
summary: Give it your running image ads. Get the gaps in them, a test brief, image ad copy and scored opening lines.
job: plan-ad-tests
thinking: high
thinking_why: It runs several skills in a row. Give it your strongest model.
headline: Know which image ads to test next, with the copy ready
subhead: Give it the image ads you already run. It maps what they cover and what they miss, writes a test brief with three ideas and three versions each, writes the ad copy, and scores opening lines so you start with the strongest.
explain: |-
  A test that only changes a colour or a font often teaches little. A test that changes the question the ad answers teaches you something.

  This workflow sorts your running ads by type and style and finds the question your buyers still have that no ad answers. It picks up to three new tests, each in a different type. It briefs three ideas with three versions each, writes the copy and scores the opening lines.
when:
  - You run image ads and every new one looks like the last.
  - You have a designer waiting for a brief.
  - You want each test to teach you something even if it loses.
not_for:
  - "You have no image ads running yet: use the Single image ad planner to plan your first ad."
  - "You only need the test brief: use the Ad test brief writer."
  - "You want to check ads against Meta rules before launch: use the Meta ad policy checker."
you_give:
  - Your running image ads, as pictures with their text
  - Your org context
  - Your ad results (optional)
  - Customer reviews (optional)
you_get:
  - A grid showing which types and styles your ads cover
  - Up to three new tests, each in a different type
  - A brief with three ideas and three different versions each
  - Image ad copy for every version
  - Opening lines with a score out of 4 and a fix for weak ones
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md plus one skill file for each step.
  - Open Claude Code, or a Claude Project where you can add files. Add the unzipped folder.
  - Add your image ads as pictures, and your org context. Add results and reviews if you have them.
  - Say "Follow HANDOFF.md". It runs four steps in order and saves each result as a file.
  - Check the ad copy before you use it. Any health claim must match your org context's approved claims. If it does not, the line is held back and marked for your review.
output_sample:
  input:
    - Your running image ads, as pictures with their text
    - Your org context, with facts, offers, claims and voice
    - Your ad results (optional)
    - Customer reviews (optional)
  prerequisites:
    - An AI that can read files, such as Claude Code or a Claude Project
    - The handoff pack folder, which holds HANDOFF.md and the skill files
  output:
    - name: Gap grid
      contains: A grid of ad types and styles you already cover, the question buyers still have, and up to three new tests.
    - name: Test brief
      contains: The evidence grade, a plan, and three ideas, each with the buyer doubt, the answer and three versions.
    - name: Ad copy
      contains: A headline and text for each version in the brief, with one appeal each.
    - name: Opening lines
      contains: About ten opening lines, each scored out of 4, with a fix for weak ones.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every missing item in one list.
how_it_works:
  - title: Finds the gaps
    text: Uses the image ad gap finder to code each ad and fill a grid of types and styles, then pick new cells.
  - title: Writes the test brief
    text: Uses the test brief skill to grade the evidence, name the buyer doubt and write three versions per idea.
  - title: Writes the copy
    text: Uses the image ad copy skill to write headline and text for each version, one appeal each.
  - title: Scores the opening lines
    text: Uses the opening line skill to write about ten lines and score each on four checks.
output_shape: |-
  GAP GRID
    Type x style: <count per cell> | Stuck question: <one>
    New tests: 1 <card> 2 <card> 3 <card>

  TEST BRIEF
    Evidence: <grade> | Plan: <explore / extend / refresh>
    Idea <n>: <name> | Doubt | Answer | Versions A, B, C

  AD COPY
    Version A: <headline> | <text> | Appeal

  OPENING LINES
    | Line | Score out of 4 | Fix |

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
example:
  business: sprout
  input: |-
    [the handoff pack] Follow HANDOFF.md.

    Image ads: 9 running Sprout image ads with their text. Practice data.
    Org context: the Sprout org context. Reviews: 6 reviews.
  output: |-
    STEP 1: GAP GRID
    9 ads coded. Types used: offer (4), benefit (3), proof (2). Empty: story, comparison, objection.
    Stuck question: "Will it upset my stomach?" No ad answers it.
    New test 1: objection type, style: plain text on photo.

    STEP 2: TEST BRIEF
    Evidence: reported (no results given). Plan: explore.
    Idea 1: "Easy on the gut" | Doubt: "Will this upset my stomach?" | Answer: start with Low Sugar, 6g prebiotic fiber
    Versions: A pack on a desk, B a glass after lunch, C a hand holding a spoon.

    STEP 3: AD COPY
    Version A: Headline: Your stomach, first. Text: Start with Low Sugar and build up.

    STEP 4: OPENING LINES
    | Will it upset my stomach? | 4 | none |
    | Gut health made easy | 2 | Could open any ad. Name a moment |

    HAND-BACK SUMMARY
    Files: outputs/step-01 to step-04. MISSING: ad results; consent to quote reviews.
tweaks:
  - what: Your results
    how: Add the export. The gap step then also finds which question your clicks stall on.
  - what: Formats you can make
    how: Say if you make only photos or only text on colour. The brief stays inside that.
  - what: How many tests
    how: Ask for one test instead of three if your budget is small.
judge:
  - Each new test is in a different type, so the results teach different things.
  - The three versions of each idea open on different first frames.
  - Every copy line rests on a fact in your org context.
  - Opening lines under 3 come with a fix.
test:
  - Count your ads by type yourself. The grid should match.
  - Check that the stuck question is not answered by an ad you run.
  - Run the opening line step twice. The top three lines should mostly repeat.
improve:
  - After the test runs, feed the results back in and run the sales drop workflow.
  - Save the cut-claims log so later rounds start from it.
  - Add a rules check before launch.
