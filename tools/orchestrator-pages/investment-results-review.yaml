new_slug: investment-results-review
name: "Review your investments by business results, not price"
summary: "Give it your holdings. Get each judged on business results, a short ranked list with sizes and rules for sitting still."
job: money-and-investing
thinking: high
thinking_why: "It reviews several businesses, ranks them and writes rules that depend on your answers. Give it your strongest model."

headline: "Review what you own by how the businesses are doing, and hold fewer, longer"
subhead: Give it your holdings and what you know of each business. It judges every one on earnings and returns with the price hidden, ranks them against your best, writes the rules for sitting still, and then writes your rules for price drops before the next one. It is a method of analysis, not personal financial advice.

explain: |
  It is easy to review investments by the price. It is up, so it feels right. It is down, so it feels wrong. But the price is a mood, and the thing you own is a business with results you can read.

  This workflow reviews your holdings the way a focused owner would. Step one hides the price and sorts each holding as keeper, watch, weak or not understood, by earnings, returns and debt. Step two ranks what is left, using your best holding as the bar every other idea must beat, and keeps the list short with sizes that match how well you understand each. Step three writes the rules for sitting still: the facts that must stay true, the cost of trading and tax, and the only reasons to act. Step four writes your rules for price drops and jumps, before you are in one. The approach is inspired by Robert Hagstrom's account of Warren Buffett's focus investing. It gives no buy or sell calls, and it is not a substitute for a licensed adviser on tax, loans or a single buy or sell decision.

when:
  - You own a handful of investments and want to judge them by business results.
  - You trade often and suspect you would do better holding fewer things longer.
  - You want rules in place for the next fall before it happens.

you_give:
  - Your holdings, with how much, when bought and why
  - Several years of earnings, returns and debt for each business (optional)
  - When you will need the money and any loan against your holdings (optional)
you_get:
  - Each holding sorted keeper, watch, weak or not understood, with the figure behind it
  - A cross-check of profit kept against value gained
  - A short ranked list with sizes, and a written no for the rest
  - A one-page rule set for sitting still, with the cost of acting and the only reasons to change
  - A rule card for price drops and jumps, with look dates and your mind traps

how_to_use:
  - Download the handoff pack. It holds HANDOFF.md plus one skill file for each step.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - List your holdings with the reason you bought each, and attach any yearly earnings, returns and debt figures you have.
  - Answer the half-value question honestly in the last step.
  - Print the rule card, name your witness and redo the review once a year.

how_it_works:
  - title: Judges each holding by its results
    text: Hides the price, checks whether the reason you bought it still holds, and labels each holding with the figure behind it.
  - title: Ranks them and cuts the list
    text: Ranks holdings by how well you understand them and how clear the edge is, uses the best as the bar, and gives most weight to the top few.
  - title: Writes the rules for sitting still
    text: The facts that must stay true, fixed review dates, the cost of trading and tax, and the only reasons to act.
  - title: Writes your rules for price drops
    text: The half-value test, money needed soon, do and do-not rules for drops and jumps, and the mind traps that fit you.

output_shape: |
  STEP 1: BUSINESS RESULTS (no price)
    <holding: keeper / watch / weak / not understood, with figure>
    Where results and price disagree: <...>

  STEP 2: RANKED LIST
    <top picks with sizes, the best-holding bar, and a written no for the rest>

  STEP 3: RULES FOR SITTING STILL
    <facts that must stay true, review dates, cost of acting, only reasons to act>

  STEP 4: RULES FOR PRICE DROPS
    <half-value test, money needed soon, drop rules, jump rule, look dates, traps, cooling line, witness>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
    Not personal financial advice. The ranked sizes are not an instruction to buy or sell.

tweaks:
  - what: The reason you bought
    how: One honest line per holding. A weak reason is a useful finding.
  - what: How long you can leave the money
    how: Say it plainly. The sizes and the drop rules both depend on it.
  - what: Your drop sizes
    how: Choose falls that would hurt you, such as a tenth, a quarter and a half.

judge:
  - The results table shows no price and no gain or loss.
  - Every label has a figure behind it, or is not understood.
  - The ranked list is short and every cut has a written reason.
  - Every rule points to a business fact, not to a price level.
  - Nothing says to buy or sell a named security.

test:
  - Give it a holding whose price doubled while earnings fell. It should be marked weak or watch, and listed as a disagreement.
  - Give it twenty holdings. The ranked list should cut hard and write a no for most.
  - Say you have a loan secured on your holdings. The last step should flag it first.
  - Run it twice on the same inputs. The labels should match.

improve:
  - Redo the review once a year, on the same date, with the new annual figures.
  - Keep your reason for each purchase in a notes file, so you can check it honestly later.
  - After any real fall, write what you did and add the lesson to the rule card.
  - Add a rival's figures for each business to sharpen the labels.

works_best_with:
  tools:
    - {name: "Claude", why: "Holds four steps and several businesses' figures in one run."}
    - {name: "A printed page", why: "A rule card only works if you can see it at the moment you want to break it."}
  inputs:
    - "Your broker statement, for sizes and dates"
    - "Annual report summaries for each company you hold"
    - "A list of money you will need in the next five years"

terms:
  - term: Focus investing
    meaning: Holding a small number of businesses you understand well, in bigger amounts, for years.
  - term: Keeper, watch, weak
    meaning: Labels for a holding judged on business results. Keeper means the reason you bought it still holds.
  - term: Half-value test
    meaning: Asking whether you could watch your holdings lose half their value and not sell in a panic.
