new_slug: job-based-product-design
name: Design the experience, name and measures around your customer's job
headline: Design the experience, name and measures around your customer's job
summary: Turn your customer's job into a plan. Get the moments to fix, features to keep or cut, a name for the job and progress measures.
job: plan-strategy
thinking: high
thinking_why: It turns one job spec into changes across moments, features, a name and measures, and has to judge thin evidence. Give it your strongest model.
subhead: Give it your job spec, your feature requests and the numbers you track. It maps the moments from first look to later use and designs a fix for each worry. It cuts features that do not serve the job, names the product after the job and picks measures of customer progress.
explain: |-
  Once you know the job, the work is not done. A product that does the job still loses if it is hard to choose, hard to start or easy to forget. And a company that follows its org chart and its loudest numbers drifts away from the job, one reasonable decision at a time. Job-based product design keeps each decision tied to the job the customer hired you for.

  This workflow turns one job spec into four pieces of design. It maps the moments of buying and use, rates today's experience from your evidence and designs the change that clears each worry, with one owner per moment. It uses the job as a filter on your feature list, so you keep what serves it and cut or merge the rest.

  It then names the product so a stranger can guess what to hire it for, and writes a line that tells the wrong buyer to look elsewhere. Last, it checks the numbers you track against three data traps and writes three to five measures of customer progress, with one for repeat use. It follows the method in Competing Against Luck by Clayton Christensen and his co-authors.
when:
  - You know the job, but your product, features or reports still follow your org chart.
  - Customers stall at set-up, return the product or do not use it twice.
  - You have a long list of feature requests and no way to choose between them.
  - You are about to name a product or range and want the name to say what it is for.
not_for:
  - "You do not yet know the job: write it first with the Job spec writer, then come back."
  - "You face one feature decision, not a whole product: use the Feature request screener."
  - "You want to see who else the customer could hire for the job: use the Job rival mapper."
you_give:
  - A job spec for one customer circumstance
  - Your feature wish list, with every request, and your question, such as what to build next
  - The numbers and reports you track now
  - Customer reviews, complaints and returns, pasted as written (optional)
  - Product facts (optional)
you_get:
  - A map of the moments, the worry at each and a rating of today's experience
  - A designed fix for each weak moment, with one owner
  - A keep, cut and merge list for your features
  - Ten names tested three ways, with three ranked picks and a not-for line for each
  - Three to five measures of customer progress, with a guard against gaming each
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini, in an AI that can read files, and say Follow HANDOFF.md.
  - Paste your job spec, your feature list and the numbers you track. Add complaints and reviews if you have them.
  - Check each rating of today's experience against what you know. Correct any that are wrong before the later steps use them.
  - Check trademarks and domains for the top names yourself. The AI cannot.
  - Give each change to its named owner.
output_sample:
  input:
    - Your job spec for one circumstance
    - Your feature wish list and your question
    - The numbers and reports you track now
    - Customer reviews, complaints and returns (optional)
    - Product facts (optional)
  prerequisites:
    - A job spec, for example from the Job spec writer
    - An AI that can read files, to run the handoff pack
  output:
    - name: Moments and experience
      contains: The job line, six to ten moments with worry, today's rating and evidence, the fix and one owner each.
    - name: Feature cuts
      contains: Each feature marked keep, cut or merge, with a reason tied to the job, and any that cannot be cut.
    - name: Name
      contains: The job in eight words or fewer, ten names with test scores, and the top three with hire-it-when and not-for lines.
    - name: Measures
      contains: Your tracked numbers tagged, and three to five progress measures with source, owner and a guard against gaming.
    - name: Hand-back summary
      contains: Each step's file, every MISSING line in one list and the checks that could not run.
how_it_works:
  - title: Map the moments
    text: "From first look to later use, including when things go wrong. For each: the worry, today's rating with evidence, the designed fix and one owner."
  - title: Cut features by the job
    text: Tests each feature against the job. Keeps what serves it, cuts or merges the rest and uses the moments map to weigh what fixes a weak moment.
  - title: Name the product after the job
    text: Drafts names in four routes and tests each on a stranger, on stretch, on lookalikes and without the company name.
  - title: Pick the measures
    text: Tags what you track, checks it against three data traps and writes a few measures of progress with a source, an owner and a guard against gaming.
output_shape: |
  STEP 1: MOMENTS AND EXPERIENCE
    <moment> | worry | today: <good, patchy, bad or unknown> | designed experience | inside change | owner
    Premium test, hard-to-copy list, top three changes

  STEP 2: FEATURE CUTS
    Keep: <features that serve the job> | Cut: <...> | Merge: <...>

  STEP 3: NAME
    Job in eight words or fewer | ten names | scores | top three with a hire-it-when line and a not-for line

  STEP 4: MEASURES
    What you track, tagged | three to five measures: formula or question | source | owner | guard against gaming | repeat-use measure

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: The job spec
    how: Use one circumstance. A mixed spec gives a muddled map, a muddled name and muddled measures.
  - what: Your feature list
    how: Paste every request, even the odd ones. The job decides which ones stay.
  - what: Complaints and returns
    how: Paste them untouched. They are the best evidence for how today's moments are going.
judge:
  - The map covers use after buying, not only the purchase.
  - Every rating of today has evidence, and every moment has one owner.
  - Each feature kept can be tied to the job.
  - No top name scored zero on the stranger test, and the trademark check is marked as not done.
  - Each measure traces to a promise in the job and has a guard against gaming.
test:
  - Give it a spec where reviews complain about set-up. The set-up moment should rate bad with a quote.
  - Give it a name that is only your company name. It should fail the maker test.
  - Give it a dashboard with ten sales figures. It should say that few or none show customer progress.
improve:
  - Rerun the map when new complaints arrive, and review the unowned moments each quarter.
  - Use the blur rule from the naming step each time you add a variant.
  - Review the measures every quarter and drop any that nobody acts on.
  - Pair it with "Write the job your customers hire you for, and its real rivals" for the spec this workflow needs.
works_best_with:
  tools:
    - name: Claude
      why: Holds the spec, the feature list and four steps of work in one run.
    - name: A whiteboard or slide
      why: The moments table is easier to review with your team when drawn out.
  inputs:
    - A job spec from the Job spec writer
    - A switch story map from the Switch story mapper, if you have one
    - Your dashboard or weekly report
next:
  - feature-request-screener
  - job-rival-mapper
  - smallest-test-picker
before:
  - job-spec-writer
terms:
  - term: Moment
    meaning: One step in the customer's path, such as judging if it is right or the first use.
  - term: Owner
    meaning: The one person answerable for how a moment goes for the customer.
  - term: Customer progress measure
    meaning: A number that shows whether the customer got the job done, such as time saved or a task they no longer do.
