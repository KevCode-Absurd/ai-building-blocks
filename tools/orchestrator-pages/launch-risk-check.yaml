new_slug: launch-risk-check
name: Check a launch for weak joints and plan its recovery
summary: Find where your launch could break and plan the recovery. Give it your release details. You get weak joints, priorities and alarm text.
job: build-software
thinking: high
thinking_why: It checks many parts and joins and then plans for mistakes people say can't happen. Give it your strongest model.
headline: Find where your launch will break, and plan how it recovers
subhead: Describe your launch, migration or release. It lists every part and every join between parts, scores how ready the launch is and plans what wins when too much happens at once. Then it designs the alarms and the safe restart for the mistakes you think can't happen.
explain: |
  Most launches fail where two parts meet, not inside one part. Two teams each did their job, but the data, the timing or the order did not match at the join. Then an alarm goes off that nobody can read, and people scramble.

  This workflow checks the joins first. It lists the parts, marks what passes between them, gives every job a priority and plans what the system keeps and drops under load. Then it takes those findings and designs the alarms, the go or no-go decision and a safe point to restart from. The order is inspired by Margaret Hamilton's paper "What the Errors Tell Us", which draws on her work on software for the Apollo missions.
when:
  - A release or migration is coming and you want to know where it could fail before it does.
  - Your last launch went wrong at a handoff between teams or tools, and you want to stop that happening again.
  - You are adding a new system to a busy one and need to know what happens when everything runs at once.
not_for:
  - "You change one system with one owner: use a plain test plan and a rollback note instead."
  - "You need a project schedule or task list: use a project planning tool or ask a project manager."
  - "You want to design code changes after the check: use the Structure and behaviour change splitter once you have the plan."
you_give:
  - What is launching, the date and what success looks like
  - The parts, teams and suppliers involved, as far as you know them
  - Change records, plans or earlier problems (optional)
  - The mistakes people on your team say can't happen (optional)
you_get:
  - A list of parts and every join between them, with what crosses each
  - A readiness score out of 100 with how it was worked out
  - A priority plan for when the system is overloaded, and what it must never drop
  - A run-through plan for the whole launch
  - Alarm text for each mistake, the go or no-go decision it asks for and a safe restart point
how_to_use:
  - Download the handoff pack first. It's a zip with HANDOFF.md and the two skill files this workflow uses, the launch readiness seam checker and the error warning and recovery designer.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe the launch and list the parts you know about. It works step by step and saves each result.
  - Do the run-through with a person in the loop before the real launch, and fix what it finds.
output_sample:
  input:
    - What is launching, the date and what success looks like
    - The parts, teams and suppliers involved, as far as you know them
    - Change records, plans or earlier problems (optional)
    - Mistakes your team says can't happen (optional)
  prerequisites:
    - An AI that can read the handoff folder, such as Claude Code or a Claude Project with files
  output:
    - name: Parts and joins
      contains: Every part with its owner, and each join between parts with what passes across it.
    - name: Priorities and overload plan
      contains: A rank for each job, and what the system drops or must never drop when overloaded.
    - name: Readiness score
      contains: A score out of 100 with the working shown, based on written reasons and approvals for each change.
    - name: Run-through plan
      contains: The steps for a full rehearsal, and who reads the final package.
    - name: Mistakes said to be impossible
      contains: Each mistake, how it would be detected, and what the system does in response.
    - name: Alarms and safe restart
      contains: Alarm text, the go or no-go decision and who makes it, plus the safe restart point.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Maps parts and joins
    text: Lists every part, including people and plans, and marks each join and what passes across it.
  - title: Sets priorities
    text: Gives each job its own priority and decides what the system drops and what it must never drop when overloaded.
  - title: Scores readiness
    text: Checks that every change has a written reason and an approval, and gives a readiness score with the working shown.
  - title: Designs the alarms
    text: Takes the gaps from the check and writes an alarm for each mistake, with the decision it asks for, go or no-go.
  - title: Plans the recovery
    text: Sets a safe restart point, the jobs that keep running and a review of each error by kind afterwards.
output_shape: |-
  STEP 1: LAUNCH READINESS CHECK
    Parts: <part> | owner: <name or MISSING>
    Joins: <part A> to <part B> | passes: <data / timing / priority> | checked: <yes / no>
    Priorities and overload plan: <job> | priority <rank>
    Readiness score: <n>/100 and how it was worked out
    Run-through plan: <steps> | final package read by: <name>

  STEP 2: ERROR WARNING AND RECOVERY PLAN
    Mistakes said to be impossible: <mistake> | detected by <how> | system does <response>
    Safe restart: <restart point> | keeps running <jobs> | dropped <jobs>
    Alarms: <trigger> | text <alarm> | decision GO / NO-GO | who decides <name>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How many parts you list
    how: Include people, suppliers and plans, not only software. Most weak joints sit where a person hands over to a machine or to another team.
  - what: The mistakes people call impossible
    how: Ask your team which ones they would bet can't happen. Those get the most careful alarm text.
  - what: Who decides at go or no-go
    how: Name one person for each alarm. A decision with two owners usually has none.
judge:
  - Every join lists what passes across it, not only that two parts are linked.
  - Every job has its own priority, with no ties left to chance.
  - The readiness score says what it measures and how it was worked out.
  - Each alarm names the decision the person has to make.
  - No part, owner or incident is invented.
test:
  - Give it a past launch that went wrong. The check should flag the join that failed.
  - Remove an owner from your parts list. The check should mark it MISSING, not fill in a name.
  - Read one alarm out loud to someone who doesn't know the system. They should be able to say what to decide.
improve:
  - Add your real incident history to the input, so the check looks for the failures you have already had.
  - Keep the parts and joins list as a file and update it after each launch.
  - After a launch, review each error by kind and ask what change to the method let it in.
