new_slug: make-a-cutaway-ad-that-shows-how-your-product-works
name: Make a cutaway ad that shows how your product works
summary: Make a cutaway ad that shows how your product works. Give it your product facts and buyer words. Get one cutaway image prompt with a short headline.
job: make-image-ads
thinking: high
thinking_why: It builds a claim chain and checks each link against your proof. Give it your strongest model.
headline: Show buyers the inside of your product in one clear picture
subhead: Give it your product facts and what buyers say. It finds the big idea and the true reason your product works, turns that into one cutaway picture with a short headline, keeps your real product in the picture, and checks every claim before you make the image.
explain: |
  Some products work in ways nobody can see: how a filter catches dust, how a formula reaches the skin, how a part takes the strain. A normal photo cannot show it, so the ad falls back on praise words. And a made-up diagram often claims more than you can prove.

  The steps start with the idea. First it finds what is unique about your product, asks why for each part and names the way it works. Next it freezes the one moment your product acts and draws it as a cutaway with a short headline and three labels at most. Then it rewrites the prompt so the product in the picture looks like yours. Last it checks each claim and number against your proof. You pause to make the image and compare it with your photos, then size up the one you pick.
when:
  - Your product has a hidden reason it works that buyers cannot see on the shelf.
  - Your ads say "better" and "advanced" and buyers shrug.
  - You want a how-it-works picture without claims you cannot back.
not_for:
  - "Your product's benefit shows on the shelf or in a photo: use the Product image ad prompt writer."
  - "You only want the cutaway prompt and already know how your product works: use the 3D cutaway image ad maker."
  - "You want a story with many panels or slides: use the Carousel ad writer."
you_give:
  - Your product facts, such as parts, materials and what each does
  - Buyer words from reviews, calls or surveys
  - Photos of the real product
  - Rival claims (optional)
  - Your org context (optional)
  - The proof you hold, such as test results (optional)
you_get:
  - A big idea, a root cause and a named way your product works, with a list of claims that need proof
  - A cutaway image prompt, a headline of seven words or fewer and the feed text
  - A prompt rewritten so the product matches your photos
  - A check of each claim and number, with a verdict
  - Upscale settings and a change check for the image you approve
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Attach your product photos and paste your facts and buyer words.
  - Mark which claims you can prove. It will not draw a link you cannot back.
  - When it pauses, make the image in your image tool, compare it with your photos and approve one.
output_sample:
  input:
    - Your product facts, such as parts, materials and what each does
    - Buyer words from reviews, calls or surveys
    - Photos of your real product
    - Proof you hold, such as test results (optional)
    - Your org context files (optional)
  prerequisites:
    - An image tool to make the picture, such as ChatGPT or Gemini, because the workflow pauses for you to make it
    - A way to approve one image before the last step
  output:
    - name: "Step 1: Idea and mechanism"
      contains: The big idea, the root cause, the named way your product works, and claims that need proof.
    - name: "Step 2: Cutaway ad"
      contains: The chain of links, the frozen moment, a headline of seven words or fewer, labels, image prompt and feed copy.
    - name: "Step 3: True-to-product prompt"
      contains: A job for each photo, lock lines for details, and the prompt rewritten so the product matches yours.
    - name: "Step 4: Check"
      contains: Each claim and number checked against your proof, with findings and a verdict.
    - name: "Step 5: Upscale"
      contains: Settings for a faithful full-size image and a check that no word or part changed.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Find the idea and how it works
    text: Lists what only your product has, asks why for every part, ranks the buyer pains and names the way it works in a few words.
  - title: Write the cutaway ad
    text: Writes the process as two to four links, freezes the moment the product acts and lays out a short headline with three labels at most.
  - title: Keep the real product in the picture
    text: Gives each photo a job, fixes the details models get wrong and rewrites the prompt with the exact words in quotes.
  - title: Check the ad before you make it
    text: Reads the words and picture together as your buyer would and checks every claim and number against your proof. A claim that fails sends you back to step 2. A product that does not match your photos sends you back to step 3.
  - title: Pause to make and approve the image
    text: You make the image, compare the product with your photos and approve the one you want to run.
  - title: Get the pick to full size
    text: Sets a faithful upscale for your use and checks that no word or part has changed.
output_shape: |-
  STEP 1: IDEA AND MECHANISM
    Big idea | root cause | named mechanism | why now | claims that need proof

  STEP 2: CUTAWAY AD
    Chain of links | the frozen moment | headline and labels | image prompt | feed copy

  STEP 3: TRUE-TO-PRODUCT PROMPT
    Photo roles | lock lines | prompt in five blocks | check lines

  STEP 4: CHECK
    Findings | claims against proof | verdict

  PAUSE: make the image and approve one

  STEP 5: UPSCALE
    Settings | change check | score

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Where the ad runs
    how: Say 4:5 or 1:1. Step 2 lays out the headline and labels for that shape.
  - what: Strict claim rules
    how: Name your field if claims are limited, such as health or money. Step 1 marks them and step 4 holds the line.
  - what: Test results
    how: Paste them. A number with a source can go on a label. A number without one stays off.
  - what: Matching your video
    how: If you have a 3D video, give its part names and colours so the picture uses the same ones.
judge:
  - The picture shows one moment, not the whole chain as numbered steps.
  - Every link in the chain is marked sourced, common knowledge or unsupported, and no unsupported link is drawn.
  - The headline is seven words or fewer and there are at most three labels.
  - The product in the picture matches your photos on shape, colour and label.
  - No number appears without a source.
test:
  - Show the finished picture to someone with your brand name covered. Ask what they think the product does.
  - Check every label against your proof list.
  - Put the image next to your product photo and compare shape and label text.
improve:
  - Save the named mechanism in your org context so later ads use the same name.
  - Test the cutaway against your best photo ad with the same headline.
  - Make a second picture from another link in the chain.
