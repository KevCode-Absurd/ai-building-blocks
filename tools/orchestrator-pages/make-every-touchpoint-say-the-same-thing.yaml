new_slug: make-every-touchpoint-say-the-same-thing
name: Make every touchpoint say the same thing
summary: Check your site, emails and packaging for brand drift. Give it your store link and screenshots. You get ranked fixes and a brand guide.
job: brand-file
thinking: high
thinking_why: Four skills run in a row and the audit judges screenshots. Give it your strongest model.
headline: Make your site, emails and packaging sound like one brand
subhead: Give it your store link, reviews and screenshots of your homepage, product page, pack and an email. It builds your brand file, scores where touchpoints disagree and ranks the fixes, edits your sample copy to the voice, and writes a guide new writers can follow.
explain: |
  When a site, an email and a box each say something different, shoppers trust you less. They cannot say why, they just feel it. New writers and designers make it worse, because nothing written down tells them how the brand sounds or looks.

  The steps start by writing down what the brand really is. First it reads your store and reviews into one brand file, with each fact tagged by where it came from. Then it scans your homepage, a product page, your pack and an email, scores how well they fit that file, and ranks the fixes by how many shoppers see them. It checks sample copy against your voice and rewrites weak lines. Last, it packages voice, colours and do and don't into a guide with a copy-paste tokens file.
when:
  - Your site, emails and packaging feel like different companies.
  - A new writer, designer or agency keeps getting the voice wrong.
  - You are about to redesign or relaunch and want to know what is off first.
not_for:
  - "Your brand has no live site or reviews yet: start with the Brand profile builder alone, then come back."
  - "You only need a short voice summary for writers: use the Brand voice one-pager writer."
  - "You only want a guide from a brand file you already have: use the Brand guide builder."
you_give:
  - Your store address, plus any pasted pages if it can't be read
  - Customer reviews or survey answers (optional)
  - Screenshots of your homepage, a product page, your pack and a promo email
  - A sample of your current ad or email copy (optional)
  - Your logo rules and colour codes (optional)
you_get:
  - A brand file of eight plain files with each fact tagged by its source
  - A fit score out of 100 and a ranked fix list, ordered by what shoppers see first
  - A voice score out of 100 for your sample copy, with the weak lines rewritten
  - A printable brand guide with colour pairs checked for readable contrast, and a tokens file
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your store link and attach screenshots. The AI can read images, so do not describe them in words.
  - Answer its short check-in question about anything the site can't say.
  - Check the ranked fix list before you act on it. The audit measures fit, not whether copy sells.
output_sample:
  input:
    - Your store link
    - Screenshots of your homepage, a product page, your pack and a promo email
    - Customer reviews or survey answers (optional)
    - A sample of your current ad or email copy (optional)
    - Your logo rules and colour codes (optional)
  prerequisites:
    - An AI that can read files and images, such as Claude with the handoff folder attached
  output:
    - name: "Step 1: Brand file"
      contains: Eight plain files on facts, offers, buyers, claims, voice and look, with each fact tagged by its source.
    - name: "Step 2: Touchpoint audit"
      contains: A scan of each asset, a touchpoint list, price fit, a score out of 100 and fixes ranked by visibility.
    - name: "Step 3: Voice edit"
      contains: A line-by-line voice check, the rewritten weak lines and a voice score out of 100.
    - name: "Step 4: Brand guide"
      contains: A quick sheet, checked colour pairs, type, voice, do and don't, and a tokens file.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Build your brand file
    text: Reads the site and your reviews, tags every fact by source and status, and writes eight plain files on offers, buyers, claims, voice and look.
  - title: Audit your touchpoints
    text: Scans each asset for three seconds, lists every touchpoint, checks price fit and trust cues, scores the fit and ranks the fixes.
  - title: Edit the voice
    text: Checks each line of sample copy against the voice rules and rewrites weak lines. It changes wording only, never claims or offers.
  - title: Build the brand guide
    text: Packages voice, colours, type and do and don't into a guide with a quick sheet first, plus a copy-paste tokens file.
output_shape: |-
  STEP 1: BRAND FILE
    Eight files for facts, offers, buyers, claims, voice and look, market and history, each fact tagged

  STEP 2: TOUCHPOINT AUDIT
    Three-second scan per asset | touchpoint list | price fit | score out of 100 | fixes ranked by visibility

  STEP 3: VOICE EDIT
    Line-by-line voice check | rewritten lines | voice score out of 100

  STEP 4: BRAND GUIDE
    Quick sheet | colour pairs checked | type | voice | do and don't | tokens file

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Customer reviews
    how: Real customer words make the voice rules truer. Without them the voice comes from your site alone.
  - what: Which assets you show
    how: More touchpoints give a better audit. Add the cart, thank-you page and shipping email if you can.
  - what: The sample copy
    how: Pick copy that is finished and fact-checked. The voice edit changes wording only.
  - what: Edit mode
    how: Use report mode if the copy is already live or belongs to someone else. It lists problems and changes nothing.
judge:
  - Every fact in the brand file has a source tag.
  - The audit lists what it could not see, not guesses.
  - The fit score explains what it measures.
  - Rewritten lines keep the same claims, numbers and offers.
  - Every colour pair in the guide shows its contrast result.
test:
  - Hide the logo on your homepage and a promo email. Could a stranger tell they are the same brand?
  - Take the top fix and check it against the real asset.
  - Ask a new writer to write one email using only the guide. Compare it with your best email.
  - Check three facts in the brand file against your own records.
improve:
  - Edit the voice rules in the brand file after each real customer quote you add.
  - Re-run the audit after you fix the top three items.
  - Save the guide and tokens file where your designers and writers can find them.
  - Add rival touchpoints to the audit to see where you stand out.
