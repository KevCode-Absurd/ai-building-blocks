new_slug: make-your-repo-agent-ready
name: Make your repo agent ready
summary: Share your repo. Get a readiness dashboard, agreed scoring rules and project instructions for coding agents.
job: set-up-ai
headline: Make your repo agent ready
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your repo. Get a readiness dashboard, agreed scoring rules and project instructions for coding agents. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your repo. Get a readiness dashboard, agreed scoring rules and project instructions for coding agents.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
not_for:
  - "You want rules that make a coding agent write tests first and never delete them: use the AI coding agent rules writer."
  - "You want a guide for a human who is new to the codebase: use the Codebase onboarding guide writer."
  - "You only want instruction files, without a score first: use the AgentRC instruction file writer on its own."
  - "You cannot run Node 20 or newer on the repo: the readiness scan needs it, so the dashboard step will stop."
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - Readiness dashboard
  - Proposed scoring policy
  - Preview of project instructions
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
output_sample:
  input:
    - Your repo, open in an AI that can read and run it
    - Your goal, such as a score to reach or a standard to meet
    - Any scoring policy your team already uses (optional)
    - The areas of the repo that need their own rules, for a monorepo (optional)
  prerequisites:
    - Node 20 or newer on your machine
    - An AI that can run commands in the repo, such as Claude Code
  output:
    - name: "Step 1: Readiness dashboard"
      contains: A single web page, reports/index.html, with a score, grade, maturity level, nine areas and a fix-first list.
    - name: "Step 2: Scoring policy"
      contains: A small policy file that turns off checks that do not apply and sets the pass rate you need.
    - name: "Step 3: Instruction files preview"
      contains: A preview of the agent rules file, such as .github/copilot-instructions.md or AGENTS.md, before any file is written.
    - name: Source coverage and next step
      contains: What was scanned, missing facts, and one next action.
how_it_works:
  - title: Agent readiness dashboard builder
    text: Point it at your repo. Get a dashboard showing what stops coding agents from working well. Hands step 2 the score, the nine areas and the fix-first list.
  - title: Agent readiness rule setter
    text: Share your repo's needs. Get scoring rules that fit the project and show which checks matter. Uses step 1's dashboard and hands step 3 the rules and weakest areas.
  - title: AgentRC instruction file writer
    text: Point it at your repo. Get project rules for coding agents, with a preview before files change. Uses step 1's gaps and step 2's scoring rules.
output_shape: |-
  Readiness dashboard
  Proposed scoring policy
  Preview of project instructions
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
