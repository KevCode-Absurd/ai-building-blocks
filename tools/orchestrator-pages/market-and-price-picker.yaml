new_slug: market-and-price-picker
name: Pick a market worth selling to and its price
summary: Pick a market worth selling to and the price that fits it. Give it your offer and who might buy. You get a scored shortlist and a price.
job: make-offer
thinking: high
thinking_why: It scores markets, rewrites an offer for several buyers and does price sums. Give it your strongest model.
headline: Pick a market worth selling to and its price
subhead: Give it your offer and the groups you could sell to. It tests whether buyers can only compare you on price, scores each group on pain, money, reach and growth, narrows to the smallest group you can still reach, and sets a price from what the result is worth to them.
explain: |
  If buyers see you as the same as everyone else, they pick the cheapest. A price war follows, and margins shrink for all of you. The usual answer is to push harder on marketing. A better answer is to change who you sell to and what you say to them.

  The steps do this in four moves. First it tests whether you are a commodity and what a price war would cost. Then it scores the groups you could sell to and rules out any with no pain, no money or no growth. Next it narrows the group in steps and rewrites the promise for each, with a price band at each level. Last it sets the price from what one result is worth to the narrowest group you can reach. The order follows Alex Hormozi's $100M Offers.
when:
  - Buyers keep asking for a discount or quote you against someone cheaper.
  - You sell to anyone who will pay and want a group that can afford more.
  - You are unsure whether to go narrower or broader.
not_for:
  - "You have a brand-new offer with no buyers yet: build your brand facts first with the Org context builder."
  - "You want to add bonuses to an offer you already have: use the Offer bonus package builder."
  - "You want to test a business idea or its risky guesses: use the Business model assumption tester."
you_give:
  - Your offer and the price you charge now
  - The groups you could sell to, or what you can do so it can propose some
  - Rivals and alternatives buyers mention (optional)
  - Reviews or call notes (optional)
  - Sales numbers (optional)
you_get:
  - A verdict on whether buyers can only compare you on price, and the first row to change
  - A score for each group on pain, money, reach and growth, and the one to commit to
  - The offer rewritten for narrower and narrower buyers, with a price band and a reach check
  - A price set from what the result is worth, with a gap check and two tests
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Share your offer and the alternatives buyers weigh against it. Check the side-by-side before it moves on.
  - Add what you know about each group's size and growth. Guesses are marked as guesses.
  - Pick the tries you will commit to in the market it chooses, before you start selling.
output_sample:
  input:
    - Your offer and the price you charge now
    - The groups you could sell to, or what you can do so it can propose some
    - Rivals and alternatives buyers mention (optional)
    - Reviews or call notes (optional)
    - Sales numbers (optional)
  prerequisites:
    - An AI that can read files, such as Claude Code or a Claude Project with the handoff pack uploaded
  output:
    - name: step-01-commodity-trap-checker.md
      contains: A side-by-side with rivals, a verdict on price-only comparison, a price-war sum and the first row to change.
    - name: step-02-starving-crowd-market-scorer.md
      contains: Each group scored on pain, money, reach and growth, groups ruled out, the pick and the tries to commit to.
    - name: step-03-niche-price-ladder-builder.md
      contains: The offer rewritten for narrower buyers, with the worth of one result, a price band and a reach check at each level.
    - name: step-04-pricing-decision-planner.md
      contains: A price set from what the result is worth, a gap check, a cost multiple and two tests.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Check whether buyers can compare you on price
    text: Lines you up against the alternatives, counts the differences a buyer can see in seconds and runs the price-war sum.
  - title: Score the markets you could serve
    text: Scores each group on pain, money, reach and growth, rules out any with a zero, and sets how many tries you commit to.
  - title: Narrow the audience and price each level
    text: Rewrites the offer for narrower buyers in their words, estimates what one result is worth to each and checks you can still reach enough of them.
  - title: Set the price from the value
    text: Sets the price as a small share of what the result is worth, checks the gap and gives you two tests.
output_shape: |-
  STEP 1: PRICE COMPARISON
    Side-by-side | visible differences | verdict | price-war sum | first row to change

  STEP 2: MARKET SCORES
    Pain, money, reach and growth for each group | ruled out | the pick | tries to commit to

  STEP 3: THE LADDER
    Levels from broad to narrow | promise in their words | worth of one result | price band | reach check

  STEP 4: THE PRICE
    What the result is worth | price band and pick | gap and cost multiple | two tests

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Which alternatives you name
    how: Name the ones buyers really mention. A rival you never meet in a sale gives the wrong comparison.
  - what: Evidence on size and growth
    how: Numbers on how many are in each group and which way it is moving make the scores firm. Without them they are marked as estimates.
  - what: How many sales you need each month
    how: The reach check in step 3 uses it to decide how narrow you can go.
judge:
  - Only differences a buyer can see in seconds are counted in step 1.
  - A group with a zero in pain, money or growth is ruled out in step 2.
  - Each narrower level uses that group's own words and a problem only they have.
  - The price comes from what the result is worth, and rival prices appear only as a floor check.
  - Nothing about group sizes or prices is invented.
test:
  - Give it a market you know is shrinking. Step 2 should rule it out.
  - Show the narrowest promise to someone in that group. They should say it is made for them.
  - Redo the reach and price sums by hand. They should match.
improve:
  - Commit to the pick for the number of tries you set before you review.
  - Update group size and growth every six months.
  - Run "Build an offer from your buyer's problems" for the narrow group you picked.
