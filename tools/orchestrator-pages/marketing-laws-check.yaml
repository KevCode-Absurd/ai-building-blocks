new_slug: marketing-laws-check
name: Check your plan against the laws that decide who wins
summary: Check your marketing plan against 13 laws of marketing. Find where it breaks, test the name, spot costly tactics and pick one move to back.
job: plan-strategy
thinking: high
thinking_why: It tests a plan against many rules, then picks one move, so it needs your strongest model.
headline: Find the marketing laws your plan breaks, then back the one move that can win
subhead: Paste your marketing plan, your brand facts and your rivals. It tests the plan against thirteen rules about the buyer's mind and scores it. It then checks any new product name, finds the tactics that pay now and cost you later, and picks one move to back.
explain: |
  Most plans assume the better product wins. The rules in this workflow start from how buyers think: they keep a short ranking in their heads for each kind of product, they rarely change it, and they judge new things by where they fit. A well-made, well-funded plan can push against that and still fail.

  The workflow checks the plan against thirteen tests, such as being first in something, owning one word and not stretching your name. It then checks the name of any new product, lists each tactic with its effect now and in two years, and calls hot bets a fad or a trend. Last, it picks the one move that hits a rival where it is weakest, and cuts the rest. The tests draw on "The 22 Immutable Laws of Marketing" by Al Ries and Jack Trout (1993). They are a selection from the 22 laws and our own reading of them, not the authors' method, and the authors do not endorse them. A fail is a question to answer, not a doom call, because leaders can break some of these rules.
when:
  - You have a marketing plan or launch idea and want it attacked before you spend on it.
  - Your plan has many small moves and no clear lead.
  - You plan to put your name on a new product or a new group of customers.
not_for:
  - "You have no plan yet: write a rough draft first, or talk the idea through with a colleague, then come back."
  - "You want to judge only a new product name: use the Brand name fit checker on its own."
  - "You want to know if past tactics hurt you later: use the Long-term strategy impact reviewer on its own."
you_give:
  - Your marketing plan, as rough as it is
  - Your brand facts, such as name, buyers and budget (optional, but the verdicts are better with them)
  - Product facts for any new product in the plan
  - Your main rivals and what each is known for (optional)
you_get:
  - A pass, warn or fail on each of thirteen tests, with the plan line behind it, and a score out of 100
  - A call on the name for any new product, with a stretch score
  - Each tactic with its short-term and long-term effect, and a sum for any discount
  - A fad or trend call for each bet
  - One move to back, a stop list, the money it needs and a pass or fail test with a date
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your plan first. Add your rivals and last year's discount figures if you have them. It works step by step and saves each result.
  - Read the fails before you read the fixes. Check each quoted plan line is the one the verdict means.
output_sample:
  input:
    - Your marketing plan, as rough as it is
    - Your brand facts, such as name, buyers, offers and budget
    - Facts for any new product in the plan
    - Your main rivals and what each is known for (optional)
  prerequisites:
    - An AI that can read the files in the handoff pack
    - An org context from the Org context builder (optional)
  output:
    - name: step-01-marketing-plan-law-checker.md
      contains: A pass, warn or fail on each of 13 laws, the plan line behind each, a score out of 100 and a fix list.
    - name: step-02-brand-name-stretch-checker.md
      contains: What your name means now, a stretch score for any new product and a call on whether to use the name.
    - name: step-03-long-run-effects-checker.md
      contains: Each tactic's effect now and in two years, the sum for any discount and a fad or trend call.
    - name: step-04-one-bold-move-picker.md
      contains: One move to back, a stop list, the money it needs, an owner and a dated test.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Checks the plan against the laws
    text: Says what the plan is first in and which rung it holds, then marks each of thirteen tests pass, warn or fail with the plan line behind it.
  - title: Checks the name stretch
    text: Takes the fix list and compares what your name means today with what a new product would mean, then makes the call.
  - title: Checks short-term gains against long-term costs
    text: Writes the effect now and in two years for each tactic, does the sum for each discount and calls bets a fad or a trend.
  - title: Picks the one bold move
    text: Finds where each rival is least ready, scores the candidate moves and backs one, with a stop list, a budget check and a dated test.
output_shape: |-
  STEP 1: CHECK THE PLAN AGAINST THE LAWS
    First in: <what, or nothing yet> | Rung: <top, second, third, none>
    Tests: <law> | <pass, warn, fail> | plan line: "<quote>"
    Score: <n> out of 100
    Fix list: <worst first>

  STEP 2: CHECK THE NAME STRETCH
    What the name means now: <one word or line>
    Stretch score: <n>/100 | Call: <use the name, make a new one, skip>

  STEP 3: CHECK SHORT-TERM GAINS AGAINST LONG-TERM COSTS
    Tactic: <name> | Next 90 days: <effect> | Two years on: <effect>
    Discount net: <+/-> | Bet: <fad or trend>

  STEP 4: PICK THE ONE BOLD MOVE
    The move: <one sentence> | Stop list: <moves cut or parked>
    Money: <needed vs available> | Owner: <who>
    Test: by <date>, <measure and threshold>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Your plan
    how: Paste the plan as written, not a summary. Verdicts quote your lines, so vague input gives vague verdicts.
  - what: Your size in the market
    how: Say if you lead, challenge or are small. A leader can break some rules that a small firm cannot.
  - what: Discount history
    how: Give weekly sales before, during and after your last offers. Without them the discount sums are templates.
judge:
  - Each verdict quotes a line from your plan, and the score can be rebuilt from the verdicts.
  - The name call says what the name means now and what happens to the core product if the stretch fails.
  - Every tactic has both a short-term and a long-term effect.
  - Exactly one move is picked, and the rest are parked or cut.
  - No step invented a fact to fill a gap.
test:
  - Run it on a plan that failed before. Check it flags the cause you already know.
  - Run it twice on the same plan. The fails should stay the same even if the wording differs.
  - Read the one-sentence move to three buyers and see if they repeat it back.
improve:
  - Save the fix list and run the first step again after each change.
  - Add your market's usual leaders, so the ladder test starts from facts.
  - Keep a log of every discount, so the sums use your own data.
