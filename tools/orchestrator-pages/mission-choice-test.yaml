new_slug: mission-choice-test
name: Write a mission statement and test it on real choices
summary: Write a personal mission statement from your roles and test it on five real choices. Get three lengths and a clarity score out of 100.
job: think-and-decide
thinking: high
thinking_why: It runs four skills in a row and each one builds on the last. Give it your strongest model.
headline: A mission statement from your roles, tested on five real choices
subhead: Tell it your stage in life. It asks what four people would say about you on a day far ahead, maps your roles and lasting goals, writes a mission statement in three lengths and tests it on five real choices. You get a statement and a score for how much it settles.
explain: |
  Many people write a mission statement from a blank page and get a poster. This workflow builds yours from the end backward. First it finds what you want to be remembered for, then the roles you play, then the few lines that cover both. Last it checks the lines against choices you really face.

  The order comes from the second habit in Stephen Covey's book, begin with the end in mind. The book treats a mission statement as a personal constitution, a standard every choice is measured against. It builds the statement from roles and long-term goals, keeps the core fixed and updates the details as you learn. The last step tests whether it works.
when:
  - You are busy all the time and cannot say what it is for.
  - A new job, role or season asks for a clear direction.
  - You wrote a mission statement once and it never helped you decide anything.
not_for:
  - "You need a mission for a company or brand: use the Business mission writer."
  - "You want to turn your roles into a real week: use a week-planning workflow, once it is in the library."
  - "You have one big decision and no time to build a statement: use the Decision priority planner."
you_give:
  - Your age or stage in life, and what is on your mind
  - Honest examples from the last thirty days when asked
  - Five real choices, two recent and three ahead
  - What you know you value (optional)
you_get:
  - Your top five values and contributions, each with evidence and a gap score
  - A table of your roles with one or two lasting results each
  - A mission statement in three lengths, with a one-line version you can say from memory
  - A clarity score out of 100 for the statement, line fixes and a review date
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses. You need an AI that can read files, such as Claude Code or a Claude Project, which may need a paid Claude plan. On a free plan, paste each step's SKILL.md into a chat one at a time.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Say your stage in life and answer for the four speakers. Give moments, not titles.
  - Check each result before the next step. Strike out any goal you took from someone else's wish.
  - Bring five real choices to the last step and keep the review date it sets.
output_sample:
  input:
    - Your age or stage in life, and what is on your mind
    - Real moments from the last thirty days, when it asks
    - Five real choices, two recent and three ahead
    - What you know you value (optional)
  prerequisites:
    - An AI that can read the handoff folder, such as Claude Code or a Claude Project with files
  output:
    - name: Eulogy values finder
      contains: Your top five values, each with evidence, a score for now and a step for this month.
    - name: Roles and long-term goals mapper
      contains: A table of your roles, what you are about in each, and one or two lasting results.
    - name: Personal mission statement writer
      contains: Your mission in a long, a medium and a one-sentence version, with limits you will not trade.
    - name: Mission choice tester
      contains: Each of your five choices marked clear, partly clear or silent, a score out of 100 and line fixes.
    - name: Hand-back summary
      contains: Each step's file, any step not run, and every missing item in one list.
how_it_works:
  - title: Eulogy values finder
    text: Four people speak about you on a distant day. It pulls out what repeats, scores each against your last month and ranks the top five.
  - title: Roles and long-term goals mapper
    text: Lists your roles, writes what you are about in each and sets one or two lasting results. It names the role crowding out the others. Uses your ranked values from step 1.
  - title: Personal mission statement writer
    text: Joins values, roles and goals into a long, a medium and a one-sentence version in the present tense, with limits you will not trade.
  - title: Mission choice tester
    text: Reads the statement against five real choices, marks each clear, partly clear or silent, scores it out of 100 and fixes the weak lines.
output_shape: |-
  STEP 1: EULOGY VALUES FINDER
    Top five: <value | evidence | score now | this month>
    Biggest gap: <item>

  STEP 2: ROLES AND LONG-TERM GOALS MAPPER
    <role | about | value | results with tests>
    Crowding out the rest: <role>

  STEP 3: PERSONAL MISSION STATEMENT WRITER
    Long: <lines by role>
    Medium: <paragraph>
    Short: <one sentence>

  STEP 4: MISSION CHOICE TESTER
    <five choices, each marked clear, partly clear or silent>
    Clarity score: <n> out of 100 | After fixes: <n>
    Review date: <date>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Detail in step 1
    how: Say what you did for people, not what you were. Specific acts give the later steps something real to build on.
  - what: The five choices
    how: Pick hard ones with a date or a name. Easy choices make any statement look clear.
  - what: Limits
    how: Say what you would not do for money, praise or ease. Without limits the statement says nothing hard.
judge:
  - Each speaker in step 1 has at least one specific moment.
  - Every goal in step 2 names the day it is done.
  - Every line of the statement traces to a role, goal or value you gave.
  - You can say the short version after reading it twice.
  - The score in step 4 can be worked out from the marks.
test:
  - Run it twice a week apart. The top five values should overlap by at least three.
  - Read the short version to someone who knows you. Ask if it sounds like you.
  - Take one hard choice from last month and see if the statement would have settled it.
improve:
  - Save the top five and the role table in your about-me file so later runs start from step 3.
  - Add your own banned words, such as passionate, to the writer step.
  - Re-run steps 3 and 4 every six months or after a big change.
  - Pair it with the week-planning workflow to turn the roles into a real week.
