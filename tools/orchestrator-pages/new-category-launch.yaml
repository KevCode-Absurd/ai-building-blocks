new_slug: new-category-launch
name: Find a category to be first in and launch it
summary: Find a new product category you can lead, name it and plan a press-first launch. Paste your rivals and product to get a ranked shortlist.
job: plan-strategy
thinking: high
thinking_why: It splits a market many ways and tests each branch, then plans a launch, so it needs your strongest model.
headline: Be first at something new, name it, and launch it with press
subhead: Paste your rivals and your product. It maps where no rival is strong, splits the market into branches and tests each for being different, open, big enough and well timed. It then names the best one and plans a launch that starts with press.
explain: |
  If a rival got into the buyer's mind first, being better rarely moves anyone. Buyers are wary of brand claims but curious about what is new. So the way out is to be first in a narrower or newer kind of product, and to become the word for it.

  This workflow starts with a grid of who holds what, then asks "first what?" and cuts the market by buyer, use, price, channel and kind. Each branch must pass four tests, and a branch that is just a bad idea you like fails. It names the winning category in plain words, writes brand names that could become the word for the whole kind, and writes the pitch for the category before the pitch for your brand. Last, it plans the launch with press first and ads once people believe you. The ideas come from "The 22 Immutable Laws of Marketing" by Al Ries and Jack Trout (1993), and from Ries's later writing on publicity.
when:
  - A rival leads your market and you can't win by being better.
  - You are third or lower and attacking the leaders is not working.
  - You have a product that doesn't fit any existing kind.
not_for:
  - "You can win by being better than the leader: use a plain positioning review of your offer and your rivals, not this workflow."
  - "No rival holds a category in your market yet: skip the map and start with the Best customer finder to learn who you serve."
  - "You only want to see what rivals do in their ads: use the Competitor ad opportunity finder."
  - "You already compete in a category and want the one word to own in it: use Pick the one word to own in your customers' minds."
you_give:
  - Your main rivals and what each is known for
  - Your product facts, such as price, benefits and proof
  - Your brand facts, including any name you must keep
  - Customer reviews, press you have won, and how long your money lasts (optional)
you_get:
  - A grid of who holds what, with the open spots marked
  - A ranked short list of categories you could lead, each scored on four tests
  - The category in plain words, ten brand names scored on seven tests and a category pitch
  - A launch that starts with press and says when ads begin
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, in Claude Code or as files in a Claude Project, and say "Follow HANDOFF.md". It needs a tool that can read files.
  - Paste your rivals and product facts when asked. Add reviews if you have them.
  - Check each step's file before the next step starts. Fix any MISSING line you can fill.
  - Search the top category name yourself before you commit, since a rival may already use it.
  - Check the top brand name in a trademark register. The skills do no legal check.
output_sample:
  input:
    - Your main rivals and what each is known for
    - Your product facts, such as price, benefits and proof
    - Your brand facts, including any name you must keep
    - Your customer reviews (optional)
  prerequisites:
    - An AI chat tool such as Claude, ChatGPT or Gemini
    - Your brand brain from the Website brand brain builder (optional, makes the result better)
  output:
    - name: step-01-competitor-white-space-mapper.md
      contains: A grid of who holds what, with the spots no rival serves marked.
    - name: step-02-first-in-category-finder.md
      contains: A ranked short list of categories you could lead, each scored on four tests.
    - name: step-03-category-name-writer.md
      contains: The category in buyer words, brand name ideas that could become its word, and a category pitch.
    - name: step-04-publicity-first-launch-planner.md
      contains: A launch plan that starts with press, then says when ads begin.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Maps where no rival is strong
    text: Rates rivals on what buyers value and marks the rungs held and the spots nobody serves.
  - title: Finds a category you can be first in
    text: Asks "first what?", splits the market and tests each branch for being different, open, big enough and well timed.
  - title: Names the category
    text: Writes the category in buyer words, brand names that could become its word and a pitch that sells the kind before the brand.
  - title: Plans a launch that starts with press
    text: Finds a news angle a reporter would care about, plans coverage before any ad and sets the point at which ads begin.
output_shape: |-
  STEP 1: MAP WHERE NO RIVAL IS STRONG
    Rival: <name> | holds: <what> | open spots: <list>

  STEP 2: FIND A CATEGORY YOU CAN BE FIRST IN
    The first <kind> for <who> | Different, open, big enough, timing: <scores> | Drop it if: <condition>

  STEP 3: NAME THE CATEGORY
    In plain words: <phrase> | Top names: <three> | Category pitch: <line>

  STEP 4: PLAN A LAUNCH THAT STARTS WITH PRESS
    News angle: <angle> | Press and third-party plan: <who, when>
    Ads begin when: <point of trust> | Budget: <amount>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Rivals
    how: List the brands buyers really compare you with. A wrong list gives a category nobody needs.
  - what: How long your money lasts
    how: Say it. A category that is too early needs cash to wait for the market.
  - what: A name you must keep
    how: If your brand name is fixed, say so. The category gets its own name and your brand sits inside it.
judge:
  - The category is written as "the first ___ for ___", not "better than".
  - Each branch has four scores that add up, and branches that fail on different or open are dropped.
  - At least one name could be the word for the whole kind of product.
  - The pitch sells the category first.
  - The launch puts press before ads, with a date or point for ads to start.
test:
  - Search the top category name. If a rival uses it, the open test was wrong.
  - Ask three buyers to describe the category without hearing your brand. They should call it a different kind of thing.
  - Say the top name over the phone and ask a friend to spell it.
improve:
  - Save the chosen category and its plain-words phrase in your brand file.
  - Re-run the first step each year. Rungs move.
  - Add press you have already won, so the plan builds on stories that exist.
