new_slug: one-channel-plan
name: "Pick the one way to reach customers and plan it"
summary: "Pick the one sales route that fits your price and plan its first 90 days. Give it your product, price and buyer to get a route, a plan and a hiring pitch."
job: sell-and-negotiate
thinking: medium
thinking_why: "It runs three skills with some sums and choices. A strong model keeps the numbers and the plan consistent."

headline: "Pick the one way your product will reach customers, and plan the first ninety days"
subhead: Give it your product, price and buyer. It works out what a customer is worth and what one costs to win, matches your deal size to a sales route and picks one. It then plans the first ninety days of that route and writes the pitch that makes the right people want to join you.

explain: |
  Good products fail when no way of reaching buyers pays for itself. The common response is to try everything: a salesperson, some ads and a hope that it spreads. The numbers rarely support more than one of those.

  This workflow starts with the sums: what a customer is worth over time, and what winning one costs. It matches your deal size to a route (a few large deals, a team selling, advertising, or sharing between users), flags the price range where no route pays, and picks one. It then plans ninety days of that route: who sells, which small buyers come first, how early customers become proof for larger ones, and the one number to watch. The last step writes a pitch for the people you need to hire, built on your mission and team, not on perks.

when:
  - You have a product and no clear way to reach buyers.
  - You are spending on several channels and can't tell which one works.
  - You are about to hire your first sellers or team members.
not_for:
  - "Your product already sells well through a proven channel: keep running that channel, and skip this plan."
  - "You only need to pick a route and not plan it: use the Sales route picker on its own."
  - "You want to test whether the idea itself can own its market: use the Competitive advantage tester."

you_give:
  - What you sell, the price and who buys it
  - Your sales and ad spend, and how many customers it brought (optional)
  - Who can sell and the roles you want to hire for (optional)
you_get:
  - Customer value and cost to win, as sums, with a pass or fail
  - One route picked, with the reason each other route loses
  - "A ninety-day plan with who sells, the first five buyers, a proof ladder and one number to watch"
  - A pitch for the people you need to hire, as a message, a spoken pitch and a job post opening

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give it your price, margin and what you spend now. Mark any figure you are guessing.
  - Stop the routes it tells you to stop, and look at the weekly number every week.
output_sample:
  input:
    - What you sell, its price and who buys it
    - Your sales and ad spend and how many customers it brought (optional)
    - Who can sell and the roles you want to hire for (optional)
    - Your brand brain or your offer (optional)
  prerequisites:
    - An AI that can read the files in the handoff pack, such as Claude
  output:
    - name: "Step 1: The route"
      contains: Customer value, cost to win, a pass or fail, a dead zone flag, the one route picked and why others lose.
    - name: "Step 2: The plan"
      contains: Goal in deals, who sells, first five buyers, a proof ladder, the number to watch and a 30, 60 and 90 day plan.
    - name: "Step 3: The pitch to hires"
      contains: The mission, your people, a pay line, a message, a spoken pitch and a job post opening.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every MISSING line in one list.

how_it_works:
  - title: Picks the route from the numbers
    text: Works out customer value and cost to win, matches your deal size to a route, flags the dead zone and picks one.
  - title: Plans the route
    text: Turns your goal into a number of deals, names who sells, picks the first small buyers and sets the number to watch.
  - title: Writes the reason to join
    text: Cuts the claims every firm makes and writes the mission and the people only you have, for hires, investors and the press.

output_shape: |
  STEP 1: THE ROUTE
    Customer value: <sum> | Cost to win: <sum> | Ratio: <x> pass / fail
    Dead zone: <yes / no> | The one route: <route> | Why others lose: <list>

  STEP 2: THE PLAN
    Goal in deals: <n> | Who sells: <> | First five buyers: <>
    Proof ladder: <> | Number to watch: <> | Change the route if: <>
    Days 1-30: <> | Days 31-60: <> | Days 61-90: <>

  STEP 3: THE PITCH TO HIRES
    Mission: <one sentence> | People: <names and facts> | Pay line: <>
    Message: <text> | Spoken: <text> | Job post opening: <text>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: Your real costs
    how: Paste what you spend by month and how many customers it brought. The sums in step 1 use them.
  - what: Customer stay
    how: Give your best figure for months or purchases per customer. It reruns the value sum.
  - what: Your people
    how: Give real names, roles and how long you have worked together. Step 3 uses them in the pitch.

judge:
  - Customer value and cost to win are shown as sums, with guesses marked.
  - Exactly one route is planned.
  - The first buyers are small and named.
  - The pitch has no perks list and no claim every firm makes.
  - Nothing is invented to fill a gap.

test:
  - Give it a $1,000 a year product for small shops. Step 1 should flag the dead zone and give ways out.
  - Give it a product where cost to win is above customer value. Step 1 should fail the rule.
  - Run it twice on the same input. The route should be the same.

improve:
  - Save your route, your weekly number and your stop rule in your brand file.
  - After ninety days, re-run step 1 with your real costs and compare.
  - Pair it with "Test if your idea can own its market" to test the idea behind the product.

works_best_with:
  tools:
    - {name: "Claude", why: "Holds the sums, the plan and the pitch in one run."}
  inputs:
    - "Sales and marketing spend by month"
    - "Customer stay or repeat purchase data"
    - "A list of buyers you can contact now"

terms:
  - term: Customer value
    meaning: The profit you earn from an average customer over the whole time they buy.
  - term: Cost to win
    meaning: All sales and marketing spend divided by the number of new customers it brought.
  - term: Proof ladder
    meaning: A series of customers where each one's result helps win the next, larger one.
