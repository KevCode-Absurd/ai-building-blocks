new_slug: open-a-shopify-store-and-take-your-first-order
name: Open a Shopify store and take your first order
summary: Open a Shopify store and take your first order. Give it your country and products. Get a build plan, shipping, tax and a go-live score.
job: set-up-store
thinking: medium
thinking_why: Six skills run in a row, but each one is a plan to follow. A mid-size model is enough. Use your strongest for tax and shipping in many countries.
headline: Open your Shopify store and take a real order without launch mistakes
subhead: Give it your country, staff, products, parcel sizes and shipping costs. It plans your store setup, fills product and variant sheets, groups collections and menus, sets shipping and tax, then checks the finished store and gives a go or no-go score out of 100.
explain: |
  A new store has dozens of settings and they depend on each other. Payments depend on your country. Shipping depends on product weights. Tax depends on where you ship. Skip one and the first real customer finds it, usually at checkout.

  The steps put the choices in the right order. First it plans the base: plan, account, payments, domain name and what to build in what order. It pauses while you do the base settings in admin. Then it builds product and variant sheets. From those it groups collections and a menu, and sets shipping rates from your weights and sizes, and tax settings for each product. The last step checks the finished store, runs test orders, and ends with a go or no-go score and a list of blockers.
when:
  - You are building a new Shopify store and want it ready for a real order without launch-day surprises.
  - You have a product list but have not decided plan, payments, shipping or tax.
  - You are about to switch the password off and want a final check before the public sees the store.
not_for:
  - "Your Shopify store is already live: use Shopify's own help pages, or ask the person who built it to fix the one setting."
  - "You sell on another platform such as WooCommerce or Etsy: use that platform's own setup guide."
  - "You only want a rate table or a tax setup for one country: run the single step you need with your own AI chat."
you_give:
  - The country where your business is registered, and who needs staff access
  - Your markets and number of products
  - Your product list with options, prices, stock, weight and packed box size
  - Your real carrier costs per country and your average order value
  - Where you ship from, where you sell, and your logo, colours and photos (optional)
you_get:
  - A build order covering plan, account, payments and domain
  - A fill-in sheet for each product with variants, SKU, price, stock and weight
  - Collections, filters and a short menu, with search settings
  - Shipping zones, rates and a free-shipping line, plus tax settings and test carts
  - A go-live score out of 100 with blockers first and a test-order plan
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Have your product list, weights and carrier costs ready. Steps 2 to 5 reuse them.
  - When it pauses after step 1, open admin and do the base settings from the plan before you continue.
  - Check tax rates and Shopify fees on official pages. The plan gives the setup, not the rates.
output_sample:
  input:
    - Your country and who needs staff access
    - Your product list with options, prices, stock, weight and packed box size
    - Your real carrier costs per country and your average order value
    - Your markets and number of products
    - Your logo, colours and photos (optional)
  prerequisites:
    - An AI that can read a folder of files, such as Claude Code or a Claude Project
    - A Shopify account, since you do the base settings in admin after step 1
    - Your org context from the Org context builder (optional)
  output:
    - name: "Step 1: Store setup plan"
      contains: What to prepare, plan and account, payments for your country, domain name tests and the order to build in.
    - name: "Step 2: Product and variant sheets"
      contains: One fill-in sheet per product with a variant table, price and stock rules, and what is still missing.
    - name: "Step 3: Collections and menu"
      contains: Type and tag spelling, collections and rules, filters, a short menu and search options.
    - name: "Step 4: Shipping plan"
      contains: Shipping zones, rates, a free-shipping line, package settings, checkout wording and test carts.
    - name: "Step 5: Tax plan"
      contains: Display and price settings, tax classes, rate rows, shipping tax and test addresses.
    - name: "Step 6: Go-live check"
      contains: A score out of 100, blockers first, a test-order plan and a safe way to switch to live.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Plan the store setup
    text: Lists what to prepare, which plan to start on, likely payment options for your country, the domain name tests and the order to build in.
  - title: Plan products and variants
    text: Pauses while you do the base settings. Then picks simple or variable for each product and fills a variant row with SKU, price, stock, weight and photo.
  - title: Plan collections and menu
    text: Sets one spelling for types and tags, plans collections and filters, and builds a menu where any product is two or three clicks away.
  - title: Plan shipping rates
    text: Uses your weights and carrier costs to set zones, one rate model and a free-shipping line, and checks the price charged against real cost.
  - title: Plan tax setup
    text: Sets tax status and class for each product, adds rate rows and test carts. It does not decide where tax is owed.
  - title: Check go-live
    text: Sweeps settings, products and policies, runs test orders and a phone check, and ends with a go or no-go, blockers and a safe switch to live.
output_shape: |-
  STEP 1: STORE SETUP PLAN
    What to prepare | plan and account | payments by country | domain tests | build order

  STEP 2: PRODUCT AND VARIANT SHEETS
    One fill-in sheet per product | variant table | price and stock rules | what is still missing

  STEP 3: COLLECTIONS AND MENU
    Type and tag spelling | collections and rules | filters | menu | search options

  STEP 4: SHIPPING PLAN
    Zones | rates | free-shipping line | package settings | checkout wording | test carts

  STEP 5: TAX PLAN
    Display and price settings | classes | rate rows | shipping tax | test addresses

  STEP 6: GO-LIVE CHECK
    Score out of 100 | blockers first | test-order plan | safe switch to live

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list> | CHECKS MISSED: <checks that failed or could not run, or none>
tweaks:
  - what: Your country
    how: It decides which payment options exist and which tax rules matter. State the registered country first.
  - what: Weights and packed sizes
    how: Shipping rates depend on them. Without them the plan marks rates as unchecked.
  - what: Carrier costs
    how: Give the real cost per country or weight band. The plan checks charged price against it.
  - what: Number of products
    how: Under about 15, you only need collections and a short menu. Filters pay off from about 30.
  - what: Where you ship
    how: Serve only places you can serve well. A smaller list gives a simpler plan.
judge:
  - Each step used the weights, prices or settings from the steps before, and did not invent any.
  - The shipping plan checks the rate against the real carrier cost.
  - Tax rates are marked as ones to check on official tables, not taken from demos.
  - The go-live score shows its working and lists blockers before anything else.
  - Each step marks menu names as ones to match on screen.
test:
  - Place a test order through payment and check the email, stock and tax it creates.
  - Test one cart from each shipping zone and compare the charged rate with the carrier's price.
  - Walk the buying path on your phone from the homepage to the thank-you page.
  - Ask a friend to find three products using only the menu and the search box.
improve:
  - Save the product sheets in your org context, so you can add new products fast.
  - Re-run the shipping and tax steps whenever you add a country.
  - Re-run the go-live check after any big change to payments, shipping or tax.
  - Then check your returns and shipping pages with the Shopify store policy checker (useaiblocks.com/skills/store-policy-checker). Bring the step 2 product sheets and the step 4 shipping plan, so the pages match your real rates.
next: [payments-and-checkout-settings-checker, store-policy-checker]
