new_slug: page-problems-test-picks
name: Find what's wrong with your page and pick tests
summary: Find what's wrong with your landing page and pick what to test. You get a research plan, ranked problems and a check on your traffic.
job: audit-landing-page
thinking: high
thinking_why: It runs four skills with two pauses for real research. Give it your strongest model.
headline: Find what's wrong with your page and decide what to test
subhead: Give it your page and your analytics. It plans the research to run first, then audits the page, sorts every problem into fix now, investigate, test or tracking, and checks whether your traffic can prove a test in a sensible time.
explain: |
  Most people fix a weak page by guessing. They change the headline, move a button and wait, and a test with too little traffic tells them nothing. Or they test before they know why visitors leave, so they test the wrong thing. Worse, if the analytics count twice, every number they trust is off.

  The steps put the work in order. It plans the research first, so you learn where people drop, what is on the page and why they hesitate. Then it audits the page like a stranger would. It sorts each problem by what to do about it, with tracking faults first, since they break the data. Last, it checks whether your traffic can prove a test and how many weeks that takes. The order comes from Peep Laja's keynote, Optimizing Optimization.
when:
  - Your page gets visits but few people buy, sign up or book, and you do not know what to fix first.
  - You have a list of changes you want to test and need to know which ones deserve the traffic you have.
  - Someone says to run an A/B test and you want to know if your numbers can support one.
not_for:
  - "Your page has no traffic yet: set up basic analytics first, then come back once visits are coming in."
  - "You only want the page scored before launch: use the Landing page conversion reviewer."
  - "You only want to know if your traffic can support a test: use the A/B test traffic checker."
you_give:
  - The address or saved copy of the page (optional for the first step, needed for the audit)
  - Your analytics, with visits, steps and sales or sign-ups by page
  - Customer words from reviews, chats or surveys (optional)
  - Your brand file or a note on your offer, proof and buyer doubts (optional)
  - Time to do the research the plan lists (a few days to a few weeks)
  - Your visits and conversions for the page you want to test, pulled after the research
you_get:
  - A research order that says what to check first and why, with a tracking check up front
  - A ranked audit of the page, quick wins first, with a score out of 100
  - Every problem sorted into fix now, investigate, test or tracking, in order of likely gain
  - A clear yes or no on whether your traffic can prove a test, and how many weeks it needs
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Share your page and analytics. It writes the research plan and stops.
  - Do the research the plan lists, such as the analytics check, a walk-through of the page and a few customer questions. Then say "carry on".
  - Pull your visits and orders for the page you want to test when it asks, so the last step can size the test.
output_sample:
  input:
    - The link or saved copy of your page
    - "Your analytics: visits, steps and sales or sign-ups by page"
    - Customer words from reviews, chats or surveys (optional)
    - Your brand brain or a note on your offer and proof (optional)
    - Your visits and conversions for the page to test, pulled after the research
  prerequisites:
    - An AI that can read files, such as Claude with the handoff pack
    - Time to do the research the plan lists, from a few days to a few weeks
  output:
    - name: Research plan
      contains: "The order to work in: tracking check first, where people drop, pages to review, customer questions and an issue template."
    - name: Page audit
      contains: What a glance and a skim tell a buyer, ranked fixes with quick wins first, and a score out of 100.
    - name: Sorted problems
      contains: Each problem tagged tracking, fix now, investigate or test, ranked by likely gain and effort.
    - name: Test check
      contains: The smallest lift worth finding, weeks needed, a yes or no verdict and rules for running the test.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Plan the research
    text: Writes the order to work in, from checking your tracking to finding where people drop and asking why they hesitate.
  - title: Audit the page
    text: Reads the page like a stranger would, after the research is done, and ranks what to fix with quick wins first.
  - title: Sort the problems
    text: Takes the audit and tags each problem as tracking, fix now, investigate or test, then ranks by likely gain and effort.
  - title: Check your traffic
    text: Takes your visits and conversions and says whether a test can finish in a sensible time, with the rules for running it.
output_shape: |-
  STEP 1: RESEARCH PLAN
    Tracking check first | where people drop | pages to review | replays and tests | questions to ask customers | issue template

  (you do the research)

  STEP 2: PAGE AUDIT
    Page job and verdict | what a glance and a skim tell a buyer | ranked fixes with severity | quick wins | score out of 100

  STEP 3: SORTED PROBLEMS
    Tracking | fix now | investigate | test idea with a reason it might work | ranked by gain and effort

  (you pull your numbers)

  STEP 4: TEST CHECK
    Smallest lift worth finding | weeks needed | verdict | rules for running the test

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How good your analytics are
    how: Step 1 starts by checking for double counting. If your tracking is off, fix that before you trust any number or run a test.
  - what: The goal you name for the page
    how: Say the one action that counts, such as a sale, a booking or a sign-up. The audit and the traffic check both use it.
  - what: The smallest lift you care about
    how: A test that finds a tiny gain needs far more visitors. Say what change would be worth the effort and the check will size the test to match.
judge:
  - Each step used the result of the step before.
  - Tracking faults come first, before any test idea.
  - Every issue has the proof for it, not just an opinion.
  - The test check gives numbers and a plain verdict, and says so if you cannot test yet.
  - No number, result or visitor count was invented.
test:
  - Give it a page where you already know one real fault. That fault should show up in the audit and be sorted into fix now, not test.
  - Give the last step a very low traffic count. It should say you cannot prove a test and suggest fixing instead of testing.
  - Stop it after step 1 and check that the research plan is something you could do this week.
improve:
  - Save the sorted problem list in your brand file, so the next round starts from what is still open.
  - Keep a log of each test, its result and its date, so later runs can see what you have already learned.
  - If your traffic is too low to test, run the first three steps again after each round of fixes and test later.
