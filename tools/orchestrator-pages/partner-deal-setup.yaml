new_slug: partner-deal-setup
name: "Set up a partner deal both sides win from"
summary: "Set up a partner deal or franchise terms that pay your partner fairly. Get their profit sum, a one-page term sheet, an incentive check and supplier terms."
job: sell-and-negotiate
thinking: high
thinking_why: "The terms have to match the partner's profit sum and your own incentives, and a gap here costs real money. Give it your strongest model, then have a lawyer read the result."

headline: "A partner or franchise deal that pays them as well as you"
subhead: Describe your offer, your fees and what it costs a partner to run it. It works out what the partner keeps, writes the terms on one page, checks where your own pay would tempt you to squeeze them, and sets fair terms with your suppliers. You get a term sheet for a lawyer.

explain: |
  A partner deal that only works for you does not last. If the partner works full time and earns less than a fair wage, they cut corners or leave, and your name goes down with them. If the terms are vague or changes are agreed in a chat, you end up arguing about what was said.

  This workflow runs four steps. The first builds the partner's year with every fee you charge, tests it at sales a fifth lower than forecast, and sets what is left against hours and a fair wage. The second writes the terms on one page: who gives what, fixed and local standards, one fee table, a rule that changes count only when both sides sign, and the exits. The third looks at who is paid for what on your side and where it pulls against the partner. The fourth plans terms with your suppliers so they grow with you and savings reach your partners.

  It rests on a third-party summary of a memoir about building a restaurant chain, so its claims are kept modest. The term sheet is not legal advice.

when:
  - You want others to run your business, sell your product or use your name, and you want them to make money too.
  - Partners are leaving or struggling and you are not sure your fees are the reason.
  - A handshake deal has gone wrong, or you want to avoid one.
not_for:
  - "You are hiring an employee: use an employment contract from a lawyer or your local labour office, as this workflow is built for partners who run their own business."
  - "You need a contract with one customer: ask a lawyer for a standard sales agreement, since this has no step for single-customer terms."
  - "You want a signed contract: take the term sheet to a lawyer who knows franchise or agency law in your country, because this only writes a summary."

you_give:
  - Your offer and every fee or required purchase the partner pays
  - The partner's expected sales, costs and hours (optional)
  - What you buy from suppliers and what partners pay for it (optional)
you_get:
  - The partner's year at your forecast and at weaker sales, with pay per hour and a call of fair, thin or unfair
  - A one-page term sheet and a list of points for a lawyer
  - Where your own pay pulls against the partner, and a fix
  - A supplier terms plan with a no-gifts rule and a savings split

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe your offer and list every payment from the partner to you. It works step by step and saves each result.
  - If step 1 calls the deal thin or unfair, change a fee and run the step again before you read the term sheet.
output_sample:
  input:
    - Your offer and every fee or required purchase the partner pays
    - The partner's expected sales, costs and hours (optional)
    - What you buy from suppliers and what partners pay for it (optional)
    - Your standards sheet or manual (optional)
  prerequisites:
    - An AI that can work with a folder of files, such as Claude Code or a Claude Project
    - The handoff pack (a zip with HANDOFF.md and the skill files)
  output:
    - name: "Step 1: Partner's profit"
      contains: The partner's year at your forecast and at sales a fifth lower, with pay per hour and a call of fair, thin or unfair.
    - name: "Step 2: Term sheet"
      contains: Who gives what, fixed and local standards, one fee table, changes in writing, exits and points for a lawyer.
    - name: "Step 3: Incentives"
      contains: Who is paid for what on your side, where it pulls against the partner, and a fix.
    - name: "Step 4: Suppliers"
      contains: What you need from suppliers, what you give back, a no-gifts rule, a savings split and a bad-week plan.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.

how_it_works:
  - title: Tests that the partner makes money
    text: Builds the partner's income, costs and your fees, tests sales a fifth lower, and divides what is left by hours worked.
  - title: Writes the terms
    text: One location or territory at a time, with duties on both sides, fixed and local standards, one fee table, signed changes and exits.
  - title: Checks who is paid for what
    text: Finds where your pay or a supply markup would pull against the partner's profit.
  - title: Sets fair supplier terms
    text: Turns what you need from suppliers into a plan with a no-gifts rule, a savings split and a bad-week plan.

output_shape: |
  STEP 1: PARTNER'S PROFIT
    At forecast: <left> | At sales 20% lower: <left> | Pay per hour: <> vs fair wage <> | Call: <fair / thin / unfair>

  STEP 2: TERM SHEET
    Who gives what: <> | Fixed and local: <> | Fees: <table> | Changes in writing: <> | Exits: <> | For a lawyer: <>

  STEP 3: INCENTIVES
    Who is paid for what: <> | Where it pulls the wrong way: <> | Fix: <>

  STEP 4: SUPPLIERS
    Needs: <> | Give back: <> | No gifts rule: <> | Savings split: <> | Bad week: <>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: Every fee
    how: List start-up fees, shares of sales, markups on supplies, required equipment and advertising levies. A hidden fee breaks the sums.
  - what: Hours worked
    how: Be honest about the partner's hours. Pay per hour is the test of fairness.
  - what: Your country
    how: Say where the partner will work, so the list of points for a lawyer fits the local rules.
  - what: Your standards
    how: Paste your standards sheet or manual so the terms point to a real document.

judge:
  - Each step used the result of the step before.
  - Every fee appears in both the profit sum and the term sheet.
  - The weaker-sales case is shown.
  - A signed-change rule and exit rules are present.
  - The sheet says it is not legal advice, and no legal rule is invented.

test:
  - Give it a deal where you take a share of sales and mark up supplies. Both should show as separate fees in steps 1 and 2.
  - Give it no hours worked. Step 1 should show MISSING and cap the call at thin.
  - Run it twice on the same input. The calls in steps 1 and 3 should be the same.

improve:
  - After three months, replace the estimates with real figures from your first partner and rerun step 1.
  - Ask a partner to check the profit sum against their own books.
  - Rerun the whole workflow when you change a fee or a supplier.

works_best_with:
  tools:
    - {name: "A lawyer who knows franchise or agency law in your country", why: "The term sheet is not a contract. A lawyer turns it into one."}
    - {name: "Claude", why: "Holds four steps, the sums and the terms in one run."}
  inputs:
    - "A list of every fee and required purchase"
    - "A standards sheet or manual"
    - "What you buy and what partners pay for it"

terms:
  - term: Term sheet
    meaning: A short plain-words summary of the main terms of a deal, used before a contract is written.
  - term: Fair wage
    meaning: What the partner could earn per hour doing similar work for someone else.
  - term: Required purchase
    meaning: Anything the partner must buy from you or your chosen supplier, which works as a second fee.
