new_slug: photo-product-gallery
name: "Turn real photos into a product page gallery"
summary: "Turn your real product photos into a product page image gallery. You get about 8 checked images, each one answering a question shoppers ask."
job: product-photos

headline: "Turn real photos into a product page gallery"
subhead: Give it real photos of your product, your product facts and your brand file. It records exactly what the product looks like, scores the questions shoppers ask, plans about 8 images, makes them once you approve every word, and checks each one in 13 checks.

explain: |
  Many product page galleries are five versions of one packshot (the product alone on a plain background). They show what it is and nothing else, so shoppers scroll down hunting for size, ingredients and how to use it. AI images add a new risk: a pack that drifts in colour or shape, or a close-up of a part your product doesn't have.

  This workflow starts with a product truth sheet written from your photos: shape, colours, printed words, how it opens, what's in the box and what it must never be drawn as. Then it scores the questions your shoppers ask by how often they come up, whether a picture answers them better than words, and whether you hold the proof. The best ones become about 8 image cards, with every word and its source fixed before anything is made. Your reviews decide which worry gets the second image. Nothing is made until you say yes, and every image is checked against the plan and your real photos.

when:
  - Your product page gallery is mostly packshots and shoppers keep asking the same questions.
  - You're launching a product and need a full set of gallery images.
  - You've tried AI product images and the pack came out wrong.
not_for:
  - "You have no real photos of the product yet: take photos first, or make wordless images with the Product image ad prompt writer."
  - "You want one ad image, not a full gallery: use the Product image ad prompt writer."
  - "You only want to check images you already have: use the Product page image checker."

you_give:
  - Real photos of the exact product, as many angles as you have, ideally one in use
  - Your product facts, including amounts, size and what's in the box
  - Your brand file, with your colours, fonts, claims and guarantee terms
  - Customer reviews, to find the worry that stops most sales (optional)
you_get:
  - A product truth sheet, and the photos you still need
  - A scored plan of about 8 images, each with its question, words and sources
  - The images, named in upload order, each with alt text
  - A pass or fail for every image, with one fix for each fault

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md". It needs an image tool connected to make the images.
  - Have your inputs ready. Your product photos (full size, the exact variant you sell), your product facts with amounts, your brand file and, if you can, your reviews.
  - It works step by step and saves each result. Read the truth sheet's missing photos first. Each one is an image it can't make honestly.
  - Approve the plan and every word on it when it asks, then approve the first two images. Nothing gets made before you say yes, and the words don't change after.
output_sample:
  input:
    - Real photos of the exact product, from as many angles as you have
    - Your product facts, with amounts, size and what is in the box
    - Your brand file, or your website link
    - Your customer reviews (optional)
  prerequisites:
    - An AI that can save files and follow a folder of steps
    - An image tool, or a chat that can make images, to produce the pictures
    - Your brand brain from the Brand profile builder (recommended)
  output:
    - name: Truth sheet
      contains: Shape, colours, printed words, how it opens, what is in the box, what never to draw, and missing photos.
    - name: Gallery plan
      contains: A score for each shopper question, about 8 image cards with every word and its source, and a list of gaps.
    - name: Doubts
      contains: Your reviews sorted into five fears, with the biggest one placed in image slot 2.
    - name: Gallery images
      contains: Each image in its own shapes, named in upload order, with alt text.
    - name: Image check report
      contains: 13 checks in three passes, with a Stop, Fix or Polish rating and one fix per fault.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every missing item in one list.

how_it_works:
  - title: Records the real product
    text: Uses the product truth sheet skill to keep only photos of the exact variant and write down its shape, colours, printed words, how it opens and what to never draw.
  - title: Plans the gallery
    text: Uses the gallery plan skill to score each shopper question from 0 to 6 and write a card for each of about 8 images. A question with no proof goes on the gaps list.
  - title: Makes the images
    text: Uses the gallery image set skill to sort your reviews into five fears, put the biggest one second, and stop for your yes on the plan and on the first two images.
  - title: Checks every image
    text: Uses the gallery image check skill to run 13 checks in three passes, from thumbnails to a one-second glance at phone size to every word zoomed in.

output_shape: |
  TRUTH SHEET: <product and variant>
  Looks like: <shape, colour, finish, size against a hand>
  Printed words: <front of pack, word for word>
  Not this: <lookalikes to avoid> | Never show: <list>
  Missing: <photo jobs not held, and the images they block>

  SCORES (asked + picture wins + proof, each 0 to 2)
  <image type>  <a+b+c = total>  -> slot <nn> or gap

  CARDS
  <nn-type> | question | message | photo | words, each with its source | proof | watch

  DOUBTS
  <fear>: <people> | stopper or grumble | "<quote>" (<source>) -> slot

  GAPS
  NEED: <fact or photo> -> <image it waits on>

  IMAGES (after you approve)
  <nn-type>_1x1.png, <nn-type>_4x5.png ... with alt text

  CHECK
  <image> | <check> | <Stop / Fix / Polish> | <where> | fix: <one change>
  Set: <S1 to S4>

  HAND-BACK SUMMARY
  Files: <each step's file> | Not run: <step and why> | MISSING: <every line, in one list>

example:
  business: sprout
  input: |
    [the handoff pack] Follow HANDOFF.md.

    Product: Sprout Original (Adults), Low Sugar, 28 daily packs
    Photos: none attached in this run. The brand file describes the
    house photo style: one pouch on a soft gradient with gummies in
    front, and adults pouring gummies into a hand.
    Product facts: the brand file's product table, price table and
    "fine to repeat" claims, plus its "Show it right" rules.
    Brand file: the Sprout brand file
    Reviews: reviews.md
  output: |
    TRUTH SHEET: Sprout Original (Adults), Low Sugar, 28 daily packs
    Status: written from the brand file, not checked against photos.
    It can plan the gallery. Nothing gets made from it.
    Told apart by: no white burst (Sugar-Free has one); green, not the
    yellow Kids pouch.
    Looks like: a glossy deep green stand-up foil pouch. Gummies are
    small opaque deep-green bears, soft matte, about thumbnail height.
    Printed words: a big yellow wordmark; "28 Daily Packs" at the
    bottom. The rest: MISSING (read it from a sharp front photo).
    In use: a small flat pack torn straight across its top edge,
    gummies tipped into a palm.
    Not this: not a tub, bottle or powder; never a pack torn at the
    side, bottom or a corner; never a torn pouch.
    Never show: cartoon tie-in characters or partner marks.
    Missing: every real photo file; a single daily pack, whole and
    torn; the 28 packs laid out; the pouch in a hand.

    SCORES (asked + picture wins + proof)
    Main          2+2+1 = 5  -> slot 01
    Cost per use  2+1+2 = 5  -> slot 02 (moved up by the doubts below)
    Made of       2+1+2 = 5  -> slot 03
    Tested        1+1+2 = 4  -> slot 04
    Scale         1+2+1 = 4  -> slot 05 (gummies in a palm only)
    Promise       1+0+2 = 3  -> slot 06
    Steps         1+2+0 = 3  -> gap (no daily pack photo)
    What arrives  1+2+0 = 3  -> gap (no laid-out photo)
    Voices        1+1+1 = 3  -> gap (reviewer names removed)

    CARDS
    02-cost-per-use | Will the price jump after the first box? |
      "$49.99 every 4 weeks" / "$1.78 a day" (price table) | have |
      watch: the renewal price, never the first-box price alone
    03-made-of | Can a gummy hold enough? | "60+ ingredients" /
      "21 vitamins & minerals" / "6g fiber" (fine-to-repeat claims) |
      have | watch: per pack, never per gummy
    04-tested | Is this just candy? | "Clinically tested for nutrient
      absorption" / "Vitamin C +40.1%" / "Folate +20.5%" / small print
      "2025 study, 12 weeks, 120 healthy adults" (science page) | have
      | watch: no energy or immunity claims
    Also planned: 01 main (pouch front on), 05 scale (a small handful
    in a palm), 06 promise ("30-day money-back guarantee on your first
    order"; "first order" stays).

    DOUBTS (step 3, from reviews.md)
    I'll overpay or get stuck: 3 people (17, 20, "They are
      expensive") | stopper: "I have tried multiple times to cancel my
      subscription." (20) -> slot 02
    It won't suit me: 3 people (18, 19, "The sugar free [Sprout]
      worked too well.") | grumble -> taste and Low Sugar stay in the
      page text, not the gallery
    The brand file's doubt, "A gummy can't hold enough", has no review
    behind it, so made-of moves to slot 03.

    GAPS
    NEED: the real photo files, checked at full size -> every image
    NEED: daily pack photo, whole and torn at the top -> steps
    NEED: the 28 packs laid out -> what arrives
    NEED: reviewer names as published -> voices
    NEED: pouch in a hand -> a stronger scale image

    IMAGES
    Not made. Stop 1: approve the plan and every word, and send the
    photo files. Then slots 01 and 02 get made as test images.

    CHECK
    Not run: no images yet. All 13 checks wait for the files.

    HAND-BACK SUMMARY
    Files: outputs/step-01 to step-04. Not run: making the images
    (no photo files, no approval) and the image check (no images).
    MISSING: real photo files; the rest of the printed front; grams of
    sugar; reviewer names; your yes on the plan.

tweaks:
  - what: Marketplace set
    how: Say "this is for a marketplace" and image 1 becomes the product alone on plain white with no words. Check the marketplace's own image rules before you upload.
  - what: Shapes
    how: Ask for square only, or square and 4:5 portrait. Each shape is composed for itself, never cropped from the other.
  - what: The biggest doubt
    how: Tell it the question shoppers ask most ("will it fit?", "what does it taste like?"). It goes second, right after the main image.
  - what: Words set by a designer
    how: Say "leave room for a designer" and dense panels like ingredient tables are left as clean space, not drawn by the image tool.

judge:
  - Each planned image answers one question you can name at a glance, and no two answer the same one.
  - Every number on an image matches your facts digit for digit.
  - The pack has the same shape, colours and printed words in every image, and its size against a hand stays true.
  - Every review is word for word with the name as published, and no rating is made up.
  - Images it couldn't fill honestly go on the gaps list, not into the gallery.
  - The run stops for your yes before anything is made, and ends with a summary of every file and every MISSING line.

test:
  - Mix one photo of a different variant in with your real photos. Step 1 should reject it. If it uses it, every image after will be wrong.
  - Read the plan from step 2 before you approve it. Every number on a card should match your label digit for digit.
  - Make one image and put it beside your real photo at full size. The pack should match in colour, words and size.
  - Look at the final set as phone thumbnails, in order. Each image should answer a different question.

improve:
  - In the builder, drop step 1 if you have a recent truth sheet for this exact variant, and give it to step 2.
  - Add a step before step 2 that turns your reviews into ranked buying reasons, so the scores for "asked" come from counted evidence.
  - "Tune step 2's skill: add your category's own image types, and fix your biggest doubt as slot 2."
  - Swap step 3 for the full photoshoot workflow if you only want wordless photos, and drop step 2.
  - Pair it with the landing page workflow, so the page and the gallery answer doubts in the same order.

works_best_with:
  tools:
    - {name: "Claude", why: "Keeps track of a long run with two stops for your OK, and holds every fact and source."}
    - {name: "Nano Banana", why: "Takes many reference photos at once and handles shiny packs such as foil pouches."}
    - {name: "GPT Image", why: "Lets you point at one word or part of an image and fix it, which suits the one-change remake rule."}
    - {name: "Figma", why: "Sets ingredient panels and small print as real type, so no word gets redrawn."}
  inputs:
    - "A photo of one daily pack, or one unit, whole and opened, so the how-to-use image can be made"
    - "A photo of everything in the box laid out, so the what-you-get image is honest"
    - "The label panel shot flat and sharp, so every amount is read, not guessed"
    - "Return reasons and questions shoppers ask before buying, so the worst worry is counted right"
    - "Your current gallery files in upload order, so it can say what to keep, fix or drop"

terms:
  - term: Packshot
    meaning: A photo of the product on its own, usually on a plain background.
  - term: Truth sheet
    meaning: A written record of exactly what your product looks like, used to hold every image to the real thing.
  - term: Alt text
    meaning: A short description of an image for screen readers and search engines.
