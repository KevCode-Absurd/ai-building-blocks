new_slug: plan-a-qdrant-model-change
name: Plan a Qdrant model change
summary: Share your search setup and new model. Get a migration plan, relevance tests and monitoring before switching traffic.
job: ship-and-host
headline: Plan a Qdrant model change
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your search setup and new model. Get a migration plan, relevance tests and monitoring before switching traffic. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your search setup and new model. Get a migration plan, relevance tests and monitoring before switching traffic.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You are switching the embedding model behind your Qdrant search and need a plan that can be rolled back.
  - Some searches already return weak results and you want to know whether the new model helps.
  - You want alerts and rollback gates ready before you send live traffic to the new model.
not_for:
  - "Your Qdrant search is slow, not wrong or changing models: use Qdrant performance reviewer or the Qdrant search speed tuner."
  - "You only need to pick where to host Qdrant: use the Qdrant hosting option adviser."
  - "You are upgrading Qdrant itself and keeping your model: use the Qdrant version upgrade planner."
you_give:
  - Your current and new embedding models, with vector sizes
  - The number of points in the collection, and whether search must stay online
  - Three to ten failing searches, each with the result you expected
  - Your Qdrant version and where it runs
you_get:
  - Embedding migration plan
  - Search relevance checks
  - Monitoring and rollback gates
output_sample:
  input:
    - Your current embedding model and the new one, with vector sizes
    - How many points your collection holds and whether search must stay online
    - Three to ten searches that return weak results, with the result you expected
    - Where Qdrant runs and its version
  prerequisites:
    - Access to your Qdrant settings, to read them (the plan is not run for you)
  output:
    - name: Embedding migration plan
      contains: The strategy you chose with the reason, numbered phases, checks before the swap and the rollback steps.
    - name: Search relevance checks
      contains: Likely causes ranked, one test for each, fixes in order and a before and after measure on your own searches.
    - name: Monitoring and rollback gates
      contains: Metrics, health checks and alerts to watch after the switch, and the point where you go back.
    - name: Missing facts and next action
      contains: Every MISSING line in one list, then the first step to take.
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: Qdrant embedding migration planner
    text: Share your current and new models. Get a search migration plan with validation and rollback steps. It hands the plan and the new model to the next two steps.
  - title: Qdrant search relevance investigator
    text: Share queries and weak results. Get likely relevance problems and tests to compare proposed fixes. It starts from your own failing searches and model details. From step 1 it takes only the new model's name and vector size.
  - title: Qdrant health monitoring planner
    text: Share your Qdrant setup. Get useful health metrics, alerts and checks for slow or unhealthy search. It starts from your own setup and builds the alerts and rollback gates around the plan and the tests.
output_shape: |-
  EMBEDDING MIGRATION PLAN
    Strategy and why | numbered phases, each with its change, check and rollback step

  SEARCH RELEVANCE CHECKS
    Likely cause | test | fix | before | after (one row per cause, ranked)

  MONITORING AND ROLLBACK GATES
    Metric or check | normal range | alert when | action | the point to go back

  MISSING FACTS AND NEXT ACTION
    Source coverage | unresolved findings | MISSING lines | CHECKS MISSED | what to send to unblock a step
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
