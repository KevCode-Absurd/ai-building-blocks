new_slug: plan-collection-pages-that-rank-for-buying-searches
name: Plan collection pages that rank for buying searches
summary: Plan collection pages that rank for buying searches. Give it your products and a keyword export. You get kept keywords, a page plan and one finished page.
job: get-found-in-search
thinking: high
thinking_why: It runs three skills in a row and sorts hundreds of keywords. Give it your strongest model.
headline: Get search traffic to your collection pages with the right keywords
subhead: Give it your product list and a keyword export. It tests each keyword for buying intent, volume and difficulty, plans which collection pages to build with their handles and links, and writes the title, text and FAQ for the first page.
explain: |
  A store that sells a range can win searches like "waterproof hiking boots women" without paying for ads. Collection pages are the pages to do it with. The trouble is choosing. Most keyword lists are long, many terms have no buying intent, and a page built on the wrong term never gets seen.

  The steps narrow the list to pages worth building. First it tests each keyword, keeps the ones with buying intent and gives each a page type. It pauses and asks you to pick one main keyword per page and save it with the products that belong there. Then it plans the set of collections with handles, parent links and a build order, and skips thin ones. It pauses again for you to pick the first collection, its keyword, products and some review lines. Last it writes that page's title, heading, text, FAQ and links.
when:
  - You sell a range of products and want sales from search without paying for ads.
  - You have a long keyword export and do not know which terms deserve a page.
  - Your collection pages are just a grid of products with no text and you want them to rank.
not_for:
  - "You sell one product, or have fewer than three products per category: use the Website page structure planner to lay out your pages instead."
  - "You only want to check a few keywords: run the keyword step alone, or ask your AI to check them by hand."
  - "You want a sales page for an ad or a long article: use the Ad-matched landing page writer or the Article-style landing page writer."
you_give:
  - Your product list, with categories and what each product is
  - A keyword export from a search tool, with volume and difficulty if you have them
  - A list of your main competitors (optional)
  - Your search or sales results by collection (optional)
  - Customer review lines for the first collection you build (optional)
you_get:
  - A keyword table with intent, volume, difficulty, page type and a keep or reject verdict, plus a score out of 100 for the list
  - A collection map with a keyword, handle, products, parent and child links for each page
  - A build order in batches, and a list of collections left out with the reason
  - Page copy for the first collection, with title tag, heading, search description, text above and below the grid, FAQ and links
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your product list and keyword export. Say which tool the keywords came from.
  - When it pauses, pick one main keyword per page and save them as a sheet with the products for each page.
  - When it pauses again, pick the first collection and add a few real review lines about its products.
output_sample:
  input:
    - Your product list, with categories and what each product is
    - A keyword export from a search tool, with volume and difficulty if you have them
    - Your main competitors (optional)
    - Customer review lines for the first collection you build (optional)
  prerequisites:
    - An AI that can read files, to run the handoff pack
    - The three step skills, which come inside the handoff pack
    - Your brand brain from the Website brand brain builder (optional)
  output:
    - name: Step 1 keyword table
      contains: Each keyword with intent, volume, difficulty, page type, owner page and a keep or reject verdict, plus a score for the list.
    - name: Step 2 collection plan
      contains: A map of collections with keyword, handle, products and parent and child links, plus a brief for each.
    - name: Build order and left-out list
      contains: Collections grouped in batches, and the thin ones skipped with the reason.
    - name: Step 3 page copy
      contains: Title tag, heading, URL handle, search listing, text above and below the grid, FAQ, featured reviews and links.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run, and every MISSING line in one list.
how_it_works:
  - title: Test the keywords
    text: Store keyword validator checks each term for buying intent, volume, difficulty and what already ranks. It names the page type and the owner page for each keeper and scores the list out of 100.
  - title: Plan the collections
    text: Collection page planner takes the validated keyword report and your chosen keywords and turns them into a map of collections. Each has one keyword, a handle, products and parent and child links. It skips thin collections and sets a build order in batches.
  - title: Write the first page
    text: Collection page SEO builder takes one collection from the plan, its products and its keyword. It writes the title tag, heading, search listing, text, FAQ and link plan, and notes for splitting the text in Shopify.
output_shape: |-
  STEP 1: KEYWORD TABLE
    Each term with intent, volume, difficulty, what ranks, page type, owner page and verdict | per-page keywords | score out of 100

  STEP 2: COLLECTION PLAN
    Collection map with keyword, handle, products and links | brief per collection | build order | not added

  STEP 3: PAGE COPY
    Title tag | heading | URL handle | search listing | text above the grid | text below the grid | FAQ | featured reviews | links | theme notes

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Your keyword export
    how: Include volume and difficulty. If there is no difficulty score, step 1 uses the bid range as a stand-in and says so.
  - what: How many products you have
    how: A collection needs at least three products or it is flagged for merging. A very small range gets a short plan.
  - what: Your competitors
    how: Giving them lets step 1 look at which terms rivals already win and where there are gaps.
  - what: Which collection you pick first
    how: Start with your best-selling category, since a page there pays back soonest.
judge:
  - Every kept keyword has buying intent and a stated reason, and every rejected one has a reason.
  - No two collections share a keyword, and no product page shares one with a collection.
  - Every collection has at least three products, or is flagged for merging.
  - The page has one heading that carries the keyword, a title under 60 characters and no keyword stuffing.
  - Every claim in the page text traces to your product facts, and reviews are real and unedited.
test:
  - Search three of the kept keywords yourself and check that the page type matches what ranks.
  - Check that each handle and parent link matches how your store menu actually works.
  - Back up your theme, then publish the first page and check it in Search Console after a few weeks.
  - Read the page text aloud and see if a shopper would learn something from it.
improve:
  - Edit the planner skill's thin-collection rule to match your range, such as a higher minimum product count.
  - Save the kept keyword sheet in your brand file, so next batch starts at step 2.
  - Add your approved product claims to the brand file so the page copy can use them.
  - After a batch is live, log impressions and clicks per collection and use them to pick batch two.
