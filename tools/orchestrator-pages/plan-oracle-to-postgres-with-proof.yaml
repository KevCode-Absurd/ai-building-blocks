new_slug: plan-oracle-to-postgres-with-proof
name: Plan Oracle to Postgres with proof
summary: Share your .NET data access code. Get migration scope, baseline tests and a review of database behavior risks.
job: build-software
headline: Plan Oracle to Postgres with proof
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your .NET data access code. Get migration scope, baseline tests and a review of database behavior risks. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your .NET data access code. Get migration scope, baseline tests and a review of database behavior risks.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You are moving a .NET app from Oracle to PostgreSQL and want to know what to test before you change any code.
  - You need baseline tests that record how the Oracle code behaves today, so differences show up after the move.
  - You want a review of behavior risks before release, not after.
not_for:
  - "You are ready to change the code: use the Oracle to Npgsql code migrator or the Oracle stored procedure migrator."
  - "You only want to review code you already moved: use the Oracle migration risk reviewer on its own."
  - "Your move is not from Oracle to PostgreSQL, or your data access is not .NET: use the Migration planner or the Zero-downtime migration planner."
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - Migration inventory and plan
  - Baseline test scope and tests
  - Behavior risks and release gates
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
output_sample:
  input:
    - Your .NET solution, with every project that touches the database
    - Where any existing Oracle or PostgreSQL schema files (DDL) are kept (optional)
    - Your existing integration tests and test project (optional)
    - Your migrated code or the changes made, for the final review
  prerequisites:
    - An AI that can open and read your code folder
    - A test project that already builds, before the baseline tests can be written
  output:
    - name: Master migration plan
      contains: Solution summary, a project inventory marked migrate or skip, and the order to move projects.
    - name: Integration testing plan
      contains: Data access methods to test, test cases for each, seed data needs and Oracle and PostgreSQL differences to check.
    - name: Oracle baseline tests
      contains: Integration tests that record what the Oracle code does today, with seed data and checks on exact values.
    - name: Migration risk review
      contains: A table of behavior differences with where they apply, the risk, the fix and whether a test covers it.
    - name: Verdict and decisions needed
      contains: Each risk marked addressed or not, open design choices and whether tests passed or were not run.
how_it_works:
  - title: Oracle to Postgres program planner
    text: Share your .NET solution. Get a project inventory, migration scope and a master plan to track the work. The plan goes to step 2.
  - title: Oracle migration test planner
    text: Share your data access code. Get test scope and parity checks for an Oracle to Postgres migration. It reads the master plan and hands the testing plan to step 3.
  - title: Oracle behavior baseline test writer
    text: Share your Oracle data access code. Get tests that record what the code does before you change databases. It reads the testing plan and hands the baseline tests to step 4.
  - title: Oracle migration risk reviewer
    text: Share your migrated code. Get Oracle and PostgreSQL behavior gaps checked before release. It checks the migrated code against the baseline tests.
output_shape: |-
  Migration inventory and plan
  Baseline test scope and tests
  Behavior risks and release gates
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
