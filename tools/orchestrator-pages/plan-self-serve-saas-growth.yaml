new_slug: plan-self-serve-saas-growth
name: Plan self serve SaaS growth
summary: Share your funnel and product. Get self serve growth tests and an onboarding plan tied to customer value.
job: plan-strategy
headline: Plan self serve SaaS growth
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your funnel and product. Get self serve growth tests and an onboarding plan tied to customer value. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Self serve growth works when people can sign up, reach first value and pay without talking to you. This workflow starts with your funnel. It scores each stage (sign-up, first use, first value, paying, expanding), says whether self serve fits your product, and writes growth tests. Each test names the metric it moves, its baseline, the rule for judging it and the date to read it.

  Then it builds a meeting rhythm around those tests, so your team reviews the same numbers every week. Where you have no channel spend or retention figures, it marks the gap instead of guessing. It plans and drafts. It changes nothing in your product or accounts.
when:
  - You run a software product people can sign up for without talking to you, and growth has stalled.
  - You want tests tied to the metric each one should move, not a list of ideas.
  - You need a weekly rhythm for reviewing those numbers with your team.
not_for:
  - "You do not know yet which growth channel to try: use SaaS growth channel test planner."
  - "Your product needs a sales call to close, with large deals: use the Enterprise customer onboarding planner, or expect this to tell you self serve is a poor fit."
  - "You only want to improve first-time use: use the First-use onboarding designer."
you_give:
  - What your product does, who uses it and who pays
  - Counts for each funnel stage (sign-ups, first use, first value, paying, expanding) and the period they cover
  - The steps a new user takes from sign-up to first use
  - Spend, sign-ups, paying users and retention by channel, if you have them
  - Your team size and goals for the next quarter
you_get:
  - Growth motion choice
  - Activation and expansion tests
  - Metric review cadence
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your funnel counts, the sign-up to first-use steps and your team goals.
  - Ask it to follow the steps and mark any missing facts.
  - Read the fit check first. If it says self serve is a poor fit, stop there.
  - Review the tests and the meeting rhythm before you act on them.
output_sample:
  input:
    - What your product does, who uses it and who pays
    - The steps from sign-up to first use
    - Spend, sign-ups, paying users and retention by channel (optional)
    - Typical deal size and gross margin (optional)
    - Your team size and goals, for the meeting rhythm
  prerequisites:
    - Nothing needed beyond a chat with your AI. A spreadsheet export helps if you have one.
  output:
    - name: Fit check
      contains: Whether self serve, mixed or sales-led suits your product, with reasons from your answers.
    - name: First-value audit
      contains: The steps to first use, time to first value and the fixes to try.
    - name: Growth equation and channel table
      contains: For each channel, cost to win, conversion, retention, payback and a keep, optimize or kill call.
    - name: Forecast and first test
      contains: Baseline, upside and downside by channel, and a one-page playbook for the first test.
    - name: Meeting rhythm and metric reviews
      contains: Which meetings you need, the weekly numbers to review and who decides what.
    - name: Missing list
      contains: Every MISSING line in one list.
how_it_works:
  - title: Self serve product growth planner
    text: Share your product funnel. Get activation and expansion changes, with tests to see whether self serve growth fits.
  - title: Company meeting rhythm designer
    text: Share your team and goals. It starts from that brief and takes the tests and metrics from step 1. You get meeting rhythms, metric reviews and decision rules that fit your stage.
output_shape: |-
  Growth motion choice
  Activation and expansion tests
  Metric review cadence
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
