new_slug: plan-the-cash-for-your-next-stock-order
name: Plan the cash for your next stock order
summary: Plan the cash for your next stock order. Give it supplier invoices and lead times to get true unit costs, cash needed and a growth verdict.
job: plan-supply-chain
thinking: high
thinking_why: It runs five skills in a row and each one does money sums on the last. Give it your strongest model.
headline: Know how much cash your next stock order needs and whether cash limits your growth
subhead: Give it your supplier invoices, lead times and current cash. It works out what each unit really costs on your shelf, the cash each order needs, the supplier terms that would close the gap, and whether cash or ads limit your growth.
explain: |
  A store can show a profit and still run out of cash. Stock is paid for months before it sells, freight and duty arrive as lump invoices, and a growth plan can ask for more money than the bank holds. Many owners find out only when a supplier wants a deposit and the account is short.

  The steps put numbers on it in order. First it spreads freight, duty and fees across the products to get the true cost of each unit. Then it times each order against lead time and shows the cash it needs and your lowest cash point, with a case where sales fall short. Next it shows which supplier terms would close the gap. Then it tests your growth plan against cash and tells you if cash or ads are the limit. If cash is still short, it ranks six ways to free it. There is no planned pause. It asks you a question only when a step needs a number that only you have, and it stops at step 1 if the supplier invoices are missing, so have your numbers ready.
when:
  - You are about to place a large stock order and want to know if you can pay for it.
  - Your store shows a profit, but cash is always tight after a reorder.
  - You want to ask your factory for better payment terms and need numbers to back the ask.
not_for:
  - "You have one small reorder and your cash is clearly fine: check the sums by hand or in a simple sheet instead."
  - "You have no supplier invoices yet: gather your invoices and freight bills first, then come back."
  - "You want to know why ad sales dropped: use the Ad sales drop analyst."
you_give:
  - Your supplier invoices, with freight, duty and any other lump costs for the shipment
  - Your lead times from order to shelf, and how and when you pay the supplier
  - Your starting cash, stock on hand and sales per month by product
  - Your price and cost per product
  - Your last three months of profit and loss (needed for the last step only)
  - Your ad results (optional)
you_get:
  - Landed cost per unit with each layer shown, and margin per unit
  - A stock and cash plan with your lowest cash point, a 13-week view and a case where sales fall 30 and 50 percent short
  - A ladder of supplier terms to ask for, with an offer to share the factory's financing cost
  - A stock grade from A to D for each product, a stockout test, a verdict on cash or ads as the limit, and a score out of 100
  - Six cash levers ranked by cash freed at day 180, with the best two or three combined
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Start with your latest invoices in a sheet. Add lead times, payment terms and starting cash.
  - Check the landed costs against your invoices before you read the cash plan. Everything after it builds on those costs.
  - Take the plan and the terms to your accountant before you act on any funding option.
output_sample:
  input:
    - Your supplier invoices, with freight, duty and other lump costs
    - Your lead times and how and when you pay the supplier
    - Your starting cash, stock on hand and monthly sales by product
    - Your price and cost for each product
    - Your ad results (optional)
  prerequisites:
    - An AI that can read files, such as Claude Code or a Claude Project
    - The handoff pack folder with HANDOFF.md and the skill files
  output:
    - name: Landed cost allocator result
      contains: Cost per unit with freight, duty and fees spread across products, checked against invoices, plus margin per unit.
    - name: Inventory cash planner result
      contains: Stock and cash by month, your lowest cash point, the raise needed, downside cases and funding options.
    - name: Supplier terms and float planner result
      contains: Days of float, a ladder of terms to ask for, a cost-share offer and cash by month.
    - name: Growth cash limit checker result
      contains: Profit versus cash, stock grades A to D, stockout and growth tests, a verdict and a score.
    - name: Cash lever ranker result
      contains: Six cash levers ranked by cash freed, the best combination and what to watch for 90 days.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Work out true unit costs
    text: Landed cost allocator spreads each freight, duty and fee invoice across the products on a stated basis. It checks the sums add up to the invoices, then divides by units received.
  - title: Plan the cash for each order
    text: Inventory cash planner times each order against lead time and shows the cash it needs. It finds your lowest cash point and a 13-week view, writes the downside case first and compares ways to fund the gap.
  - title: Find better supplier terms
    text: Supplier terms and float planner works out how many days of float you have. It builds a ladder of terms to ask for and shows cash by month with the new terms.
  - title: Test the growth limit
    text: Growth cash limit checker separates profit from cash, works out the cash conversion cycle and grades each product A to D. It runs stockout and growth tests and gives a verdict and a score.
  - title: Rank the cash levers
    text: Cash lever ranker tests six levers one at a time on the same base. It reads each at day 0, 30, 60 and 180, ranks them and combines the best two or three.
output_shape: |-
  STEP 1: LANDED COST
    Allocation basis | per-product cost layers | check against invoices | margin per unit | late-cost checklist

  STEP 2: CASH PLAN
    Stock and cash by month | lowest cash and raise needed | downside cases | funding options | 13-week view

  STEP 3: SUPPLIER TERMS
    Float in days | ladder of terms to ask for | cost-share offer | cash by month, now and with new terms

  STEP 4: GROWTH CHECK
    Profit versus cash | cash conversion cycle | stock grades | stockout and growth tests | verdict | score out of 100

  STEP 5: CASH LEVERS
    Six levers tested | ranking | best combination | what to watch for 90 days | score out of 100

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list> | CHECKS MISSED: <checks that failed or could not run, or none>
tweaks:
  - what: How you pay your supplier
    how: Full prepay, a deposit with the balance on shipping, or credit terms each change the cash sums. State yours exactly.
  - what: Your lead time
    how: Time from order to stock on your shelf. Add buffer for delays, since a short guess understates the cash gap.
  - what: How many products you order together
    how: A shipment with several products needs a table for each. Say how you want them grouped.
  - what: Your starting cash
    how: Use cash you can really spend, after tax and payroll. A padded number hides the low point.
judge:
  - The allocated costs add up to each invoice, and every lump cost has a stated basis.
  - Cash for each order is units times unit cost, on the date you pay it.
  - The lowest cash point and the downside case are shown before the plan is called safe.
  - The float sum uses your own payment terms and lead time.
  - The verdict follows from the numbers on the page, and example figures from the source are marked as examples.
test:
  - Add up the allocated costs for one product by hand and compare them with your invoice.
  - Check the cash for your next order against what your bank account will show on the payment date.
  - Ask your factory for the first rung of the terms ladder and note what they say.
  - Run the plan again with a longer lead time and see how far the lowest cash point moves.
improve:
  - Save the landed costs in your brand file or product sheet, so the next order starts at step 2.
  - Add your own funding options and their real cost to the cash planner.
  - Edit the stock grade rules to match how fast your products sell.
  - Repeat the plan before every order and keep each one, so you can see how your cash cycle changes.
