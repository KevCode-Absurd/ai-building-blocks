new_slug: prepare-a-board-decision-brief
name: Prepare a board decision brief
summary: Share company facts and decisions due. Get an evidence map, a board update and a review rhythm.
job: lead-people
headline: Prepare a board decision brief
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Give it the decisions your board must make and your numbers against plan. For each decision you get the evidence for and against it. You also get a one-page board update and a rhythm for reviewing the decisions and the numbers. Your AI marks every gap and returns work you can review before acting.
explain: |-
  A board decision goes better when the case, the case against it and the unknowns are on one page before the meeting.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
not_for:
  - "You need the slides themselves: use the Board deck builder."
  - "You need minutes or a written consent after the meeting: use the Board minutes drafter or the Board written consent drafter."
  - "You want a short update to investors with no decision to make: use the Board and investor update planner on its own."
you_give:
  - The decisions the board must make, one sentence each
  - Your key metrics against plan, and any bad news the board has not heard
  - Your team size, your goals and the meetings you hold now (optional)
  - Documents and numbers that bear on each decision, with where they came from
you_get:
  - Decision evidence map
  - Board update
  - Decision and metric review rhythm
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
output_sample:
  input:
    - The decision or decisions the board must make, in one sentence each
    - Documents and numbers that bear on each decision, with where they came from
    - Your key metrics against plan, and any bad news the board has not heard
    - Your team size, goals and the meetings you hold now
  prerequisites:
    - An AI that can read your files. Add your own judgment on what the evidence means.
  output:
    - name: Decision evidence map
      contains: One question and a provisional answer, with supporting and opposing evidence linked to its source, and the unknowns.
    - name: Board story
      contains: What is working, what is not and what you are doing about it, with each metric shown against its target.
    - name: Investor update and prepared questions
      contains: A short update with one headline, three bullets and the metric table, plus questions the board may ask.
    - name: Decision and metric review rhythm
      contains: Which meetings to hold, which numbers to review each week and who decides what.
    - name: Missing facts
      contains: What you still need to find before the board sees it.
how_it_works:
  - title: Technical decision evidence mapper
    text: Share a disputed choice and sources. Get claims linked to evidence, counterarguments and the facts still missing.
  - title: Board and investor update planner
    text: Share company facts and decisions due. Get a board story, investor update and questions to prepare for.
  - title: Company meeting rhythm designer
    text: Share your team and goals. Get meeting rhythms, metric reviews and decision rules that fit your stage.
output_shape: |-
  Decision evidence map
    Per decision: question | provisional answer | evidence for and against, with source | unknowns

  Board update (one page)
    Headline | three bullets: what is working, what is not, what you are doing about it | metric table against target | questions the board may ask

  Decision and metric review rhythm (a table)
    Meeting | how often | who attends | numbers reviewed | who decides what
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
