new_slug: prepare-an-enterprise-account-plan
name: Prepare an enterprise account plan
summary: Share a target account and product. Get buyer roles, deal risks and a customer onboarding plan.
job: sell-and-negotiate
headline: Prepare an enterprise account plan
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share a target account and product. Get buyer roles, deal risks and a customer onboarding plan. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share a target account and product. Get buyer roles, deal risks and a customer onboarding plan.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You sell a complex product to a large company and need to know who the buyers are and what could stall the deal.
  - You want an onboarding plan ready, with owners and a check for first value, for when the deal signs.
  - You have notes from calls and want them turned into next steps with owners.
you_give:
  - The target account name, your product, the contacts you know and where the deal stands
  - Your goal, deadline and limits
  - Your signed-customer brief and success goals, if the deal has signed (for step 2)
you_get:
  - Account map
  - Deal actions and risks
  - Onboarding success plan
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: Enterprise account deal planner
    text: Share an account and deal context. Get buyer roles, deal risks and next steps for a complex sale. Hands step 2 the buyer roles, success goals and risks.
  - title: Enterprise customer onboarding planner
    text: Share a signed customer and success goals. Uses step 1's plan with your signed-customer brief. Get onboarding stages, owners and checks for reaching first value.
output_shape: |-
  Account map
  Deal actions and risks
  Onboarding success plan
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
not_for:
  - "You only need to plan one live deal: use the Enterprise account deal planner."
  - "The customer has already signed and you only need the first 90 days: use the Enterprise customer onboarding planner."
  - "You want help with a single sales call: use the Sales call prep assistant."
output_sample:
  input:
    - The target account and the product you sell
    - Notes on who you have met and where the deal stands
    - Your goal and deadline
    - Success goals for the customer (optional)
  output:
    - name: Account map
      contains: The buyer roles at the account, who you have met, and who you still need to reach.
    - name: Deal actions and risks
      contains: Deal health checks, a mutual action plan, and the next step for each risk.
    - name: Onboarding success plan
      contains: Onboarding stages, owners and checks for reaching first value after signing.
    - name: Source coverage and missing facts
      contains: What the plan rests on, what is still unknown, and one next action.
