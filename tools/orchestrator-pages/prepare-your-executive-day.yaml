new_slug: prepare-your-executive-day
name: Prepare your executive day
summary: Share one day's calendar and open work. Get meeting briefs, an action register and a plan for that day.
job: organise-work
headline: Prepare your executive day
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Give it the date and that day's calendar, plus the notes and email threads behind your meetings. It writes a brief for each meeting, lists every open action with an owner and a date, and sets the plan for that one day. Your AI marks gaps and returns work you can review before acting.
explain: |-
  This plans one day. For a whole week, use Prepare your weekly executive review.

  First it writes a brief for each meeting on the day's calendar, with the goal, the open decisions and the questions. Then it pulls every open request from your notes and email threads into one action list with owners and deadlines. Last it writes a single dated brief: the priorities, the clashes and the work waiting on others.

  It works with the files you give it and marks every gap. It sends nothing and changes nothing. Each outside action it proposes, such as a message, a calendar change or spending, waits for your clear yes.
when:
  - You have a full day of meetings tomorrow and want a short brief for each one before it starts.
  - Open requests are spread over notes and email threads, and you want them in one list with owners and dates.
  - You want one daily brief for a single date: the priorities, the clashes and the work waiting on others.
you_give:
  - The date and your calendar for that day, as an export or a pasted list
  - Meeting notes or email threads with open requests
  - Your goals and any limits on your time
  - Your earlier action list (optional)
you_get:
  - Meeting briefs
  - Action register
  - Daily brief with priorities and gaps
how_to_use:
  - Add the complete skill pack to your AI.
  - Share the date, that day's calendar and your notes and email threads.
  - No calendar export? Paste each meeting's title, time and attendees. Without a date or a calendar, it stops at step 1 and writes MISSING.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: Executive meeting brief writer
    text: Share a meeting and relevant notes. Get a sourced brief with the goal, open decisions, questions and preparation gaps.
  - title: Executive action register keeper
    text: Share meeting notes or email threads. Get one action list with owners, deadlines, source links and unresolved commitments.
  - title: Executive daily briefing writer
    text: Share your calendar, action list and updates. Get a dated brief of priorities, decisions, conflicts and work waiting on others.
output_shape: |-
  Meeting briefs
  Action register
  Daily brief with priorities and gaps
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
not_for:
  - "You only need to prepare for one meeting: use the Executive meeting brief writer."
  - "You want a review of the whole week, not one day: use Prepare your weekly executive review."
  - "You need to answer one email or request: use Write a clear executive reply."
output_sample:
  input:
    - Your calendar for the day, as an export or pasted list
    - Meeting notes or email threads with open requests
    - Your goals and any limits on your time
    - Earlier action list (optional)
  output:
    - name: Meeting briefs
      contains: One brief per meeting with the goal, decisions due, an agenda, questions and gaps.
    - name: Action register
      contains: One action list with owner, due date, status and source link for each item.
    - name: Daily brief
      contains: Top three priorities, clashes, decisions, work waiting on others and one next action.
    - name: Source coverage and missing facts
      contains: What was checked, what is unknown, and which external actions are only proposed.
