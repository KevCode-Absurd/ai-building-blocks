new_slug: prepare-your-weekly-executive-review
name: Prepare your weekly executive review
summary: Give it this week's notes, threads and tasks. Get one action list, a review of open commitments and next week's priorities.
job: organise-work
headline: Prepare your weekly executive review
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Name the week you want to review, then give it your notes, email threads and tasks from that week. It builds one action list with owners and deadlines, shows which commitments are done and which are open, and sets next week's priorities. Your AI marks gaps and returns work you can review before acting.
explain: |-
  A week of meetings leaves actions spread across notes and threads, and nobody can say which ones are still open. This review pulls them into one list, then uses that list to set next week's priorities.

  Only this weekly version covers a seven-day window and carries last week's open commitments into next week's priorities. For a single day, use Prepare your executive day.

  It works with the files you give it and marks every gap. It sends nothing and changes nothing. You approve the action list and the priorities before anything is acted on.
when:
  - You end the week with actions spread across meeting notes and email threads, and cannot say which are still open.
  - You want last week's open commitments carried into next week's priorities.
  - You want one list you can review with your team on a set day each week.
you_give:
  - The date window to cover
  - This week's meeting notes and email threads
  - Your task list, or last week's action register
  - Next week's calendar
  - Your goals and any limits on your time
you_get:
  - Weekly action register
  - Progress and unresolved commitments
  - Next-week priorities
how_to_use:
  - Add the complete skill pack to your AI.
  - Name the week. Share that week's notes, email threads and task list, last week's action list and next week's calendar.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: Executive action register keeper
    text: Share meeting notes or email threads. Get one action list with owners, deadlines, source links and unresolved commitments.
  - title: Executive daily briefing writer
    text: Share your calendar, action list and updates. Get a dated brief of priorities, decisions, conflicts and work waiting on others.
output_shape: |-
  Weekly action register
  Progress and unresolved commitments
  Next-week priorities
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
not_for:
  - "You only need today's plan and meeting briefs: use Prepare your executive day."
  - "You want a plan for the week built around your goals: use Plan a week that puts what matters first."
  - "You need a weekly review you run on a schedule: use the Weekly review keeper."
  - "You only need to turn one set of meeting notes into owned actions and follow-up drafts: use Turn meetings into owned actions."
output_sample:
  input:
    - This week's meeting notes and email threads
    - Your task list or last week's action register
    - Your calendar for next week
    - The projects or decisions you care most about (optional)
  output:
    - name: Weekly action register
      contains: One action list with owner, due date, status and source link for each item.
    - name: Progress and unresolved commitments
      contains: What moved this week, what is overdue or blocked, and what others owe you.
    - name: Next-week priorities
      contains: Up to three priorities, decisions due, clashes and a first next action.
    - name: Source coverage and missing facts
      contains: What was checked, what is unknown, and which changes are only proposals.
