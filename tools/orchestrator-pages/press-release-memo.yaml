new_slug: press-release-memo
name: "Write the press release and six-page memo before you build"
summary: "Test your product idea on paper before you build. Get a future press release, hard questions, a six-page memo and a score for that memo."
job: build-product
thinking: high
thinking_why: "It tests a need, writes for a customer and builds a long argument. Give it your strongest model."

headline: "Test your idea on paper before you spend a cent building it"
subhead: "Paste your idea and who it is for. It finds the customer need behind it, writes the press release as if the product launched today, asks the hard questions, and turns it all into a six-page memo. After you share the memo, it checks it before the meeting."

explain: |
  Most ideas are loved in the head and tested too late. A team builds for months, then finds the customer does not care, the price does not work or a risk was sitting in plain view. Slides do not help, because bullets let weak thinking hide.

  This workflow starts with the customer need and asks if it will still be true in ten years. It then writes the press release you would publish on launch day. If the release is dull, the idea is not ready. Next come the questions a sceptical customer and your own team would ask, answered and graded. The six-page memo joins the story in full sentences and plans a week or more of drafts. After you share and edit it, the last step scores the memo. The method comes from Jeff Bezos's letters to shareholders.

when:
  - You have an idea for a product or project and want to know if it holds up before you spend on it.
  - Your team debates features but cannot say why a customer would care.
  - You need a decision from others and want them to read the same facts before they talk.
not_for:
  - "You already have live customers and want to learn from their data: review your reviews and sales numbers first, or ask a person who knows the account."
  - "You want the money side checked: use the Bad-year break-even tester after this, not this workflow."
  - "You need a short sales page or ad for a product that already exists: use the Buyer brief writer or the Ad headline writer."

you_give:
  - Your idea in a sentence, and who you think it is for
  - Any customer words you have, such as reviews, emails or call notes (optional)
  - The price and the numbers you can back (optional)
  - Time to share the memo with colleagues and edit it after step 4

you_get:
  - A need statement with a ten-year test and a skills gap
  - A one-page press release written for the customer
  - The hard questions, answered and graded, with gaps ranked
  - A six-page memo in full sentences with a realistic writing schedule
  - A memo score out of 100 and the three fixes that matter most

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your idea and who it is for. It works step by step and saves each result.
  - It stops after the memo draft. Share it with two or three colleagues, set it aside for two days, then edit it.
  - Bring the edited memo back and say "carry on from step 5".
output_sample:
  input:
    - Your idea in one sentence, and who it is for
    - Customer reviews, emails or call notes (optional)
    - Your price and the numbers you can back (optional)
    - Your memo, after you share it and edit it (for step 5)
  prerequisites:
    - An AI chat that can hold a long task, such as Claude, ChatGPT or Gemini
    - Two or three colleagues to read the memo draft, and two days before the final edit
  output:
    - name: Customer need
      contains: The customer, the need written as a result, a ten-year test and the skills gap.
    - name: Future press release
      contains: One page for the customer, written as if the product launched today.
    - name: Hard questions and answers
      contains: Questions a sceptical customer and your team would ask, each answer graded known, guess or gap.
    - name: Six-page memo
      contains: The ask on page one, then the case in full sentences, with a writing schedule.
    - name: Memo check
      contains: A score out of 100, the one-sentence ask read cold, and the three fixes that matter most.
    - name: Hand-back summary
      contains: Each step's file, any step not run, and every MISSING line in one list.

how_it_works:
  - title: Find the customer need that will last
    text: "Names the customer, writes the need as a result and runs a ten-year test. Lists the skills the need demands and checks four marks of a business worth building."
  - title: Write the future press release
    text: "Writes one page for the customer as if the product launched today. Cuts features that only a rival has and marks every claim without proof."
  - title: Write the hard questions and answers
    text: "Lists what a sceptical customer and your own team would ask. Answers each, grades it known, guess or gap, and ranks the gaps."
  - title: Write the six-page memo
    text: "Turns the release and questions into a memo in full sentences, with the ask on page one. Sets a schedule of a week or more."
  - title: Check the memo before the meeting
    text: "After you share and edit it, reads the memo cold, scores it out of 100 and lists the three fixes that matter most."

output_shape: |-
  STEP 1: CUSTOMER NEED
    Need: <the result the customer wants> | Ten-year test: <pass / fail and why>
    Skills gap: <have / can learn / must hire>

  STEP 2: FUTURE PRESS RELEASE
    Headline: <what the customer gets>
    <one page, with price and how to start>

  STEP 3: HARD QUESTIONS
    <question | answer | known / guess / gap>
    Gaps ranked: <1, 2, 3>

  STEP 4: SIX-PAGE MEMO
    <the ask on page one, then the story in full sentences>
    Writing schedule: <draft | comments | two days away | fresh edit>

  (you share and edit the memo)

  STEP 5: MEMO CHECK
    Cold ask: <one sentence> | Score: <n>/100
    Three fixes: <1, 2, 3>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: How exact your first input is
    how: Name one type of customer. Every later step builds on the need statement.
  - what: Real customer words
    how: Paste reviews or call notes in step 1. They make the release and the questions sound like your customers.
  - what: Numbers you can back
    how: Add price, cost and test results. They turn guesses in the questions into known answers.
  - what: How long you give the memo
    how: Plan a week or more. A memo written in a day usually scores low in step 5.

judge:
  - The need sentence has no product in it, and the ten-year test names a specific opposite.
  - The press release leads with what the customer gets, and every unproven claim has a MISSING note.
  - Some questions are uncomfortable, and at least one answer is graded gap.
  - Page one of the memo states the ask, the decider and the date.
  - No step invented a customer quote, number or price as real.

test:
  - Run it on a product you already launched. See if the need statement matches why customers bought.
  - Read the press release to someone who fits the customer. Ask what they would do next.
  - Stop after step 3 and check the top gap yourself before the memo is written.
  - Run step 5 on a memo that went badly in the past and see if the score matches the room.

improve:
  - Save the need statement and release in your project notes, so you can start later runs at step 3.
  - Add your brand voice rules to the press release skill.
  - Add the questions your customers asked last time to step 3.
  - Keep scored memos to see how your team improves.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Holds the need, the release and the questions across the pause."}
    - {name: "A shared document", why: "Colleagues can comment on the memo draft before the edit."}
  inputs:
    - "Customer reviews, emails or call notes"
    - "Price and cost figures"
    - "A past memo your team found clear"

terms:
  - term: Press release
    meaning: A short announcement of something new, written for the people it helps. Here it is written before you build.
  - term: Narrative memo
    meaning: A document in full sentences that makes the case in order, read in silence at the start of a meeting.
