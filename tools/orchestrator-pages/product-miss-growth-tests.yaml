new_slug: product-miss-growth-tests
name: Would people miss your product? Then pick growth tests
summary: Find out if your product is a must-have with the 40 percent survey test, then rank growth ideas and pick the first three tests to run.
job: test-an-idea
thinking: high
thinking_why: It reads survey answers for who your real fans are and ranks tests from them. Give it your strongest model.
headline: Find out if your product is a must-have, then pick the growth tests worth running
subhead: Give it your product and your active users. It writes a short survey and shows how to count the 40 percent test. After the answers come in, it ranks your growth ideas by impact, confidence and ease, and plans the first three tests.
explain: |
  Teams often push growth before they know whether anyone would miss the product. They spend on ads and launches, and users arrive, try it and leave. Without a clear read on who loves it, every growth idea looks equally good.

  This workflow asks the one question that tells you: how would you feel if you could no longer use it? If at least 40 percent of active users say very disappointed, you have something worth growing. It also studies the group who say that, so you know what they value and who they are. After you collect answers, it ranks growth ideas on impact, confidence and ease and plans a test for each of the top ones. The survey question and the 40 percent line come from Sean Ellis's article "Key to Sustaining Rapid Growth". The idea scoring and the step order are this workflow's own.
when:
  - You have users and want to know if the product is a must-have before you spend on growth.
  - Growth has stalled and the team has twenty ideas, but no way to choose.
  - You are about to raise money or hire for growth and want evidence the product holds up.
not_for:
  - "You have fewer than about 30 active users: talk to them one by one first, or use the Customer purchase interview script writer."
  - "Your product has not launched and has no users: use the Minimum experiment planner to test the idea with real people first."
  - "You already know your fans and only want to compare competitors: use the Competitor funnel mystery shopper."
you_give:
  - What your product does and the core experience a user should have had
  - How many active users you have and how to reach them
  - A buyer profile or customer reviews (optional)
  - A week or two to send the survey and wait for the answers
  - Your list of growth ideas, from everyone who has them
  - Your goal number and what you tried before (optional)
you_get:
  - A short survey with one fixed key question and open follow-ups
  - How to count the 40 percent test and what it means
  - A plan to study the group who would be very disappointed, and one change to try
  - Your growth ideas scored for impact, confidence and ease, sorted by average
  - One test for each of the top ideas, with a measure and a stop date, and a run order
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe your product and users. It writes the survey and the plan, then stops.
  - Send the survey to active users and wait for the answers. This usually takes a week or two.
  - Bring back the results and your list of growth ideas and say "carry on".
output_sample:
  input:
    - What your product does and the core experience a user should have had
    - How many active users you have and how to reach them
    - Your list of growth ideas
    - The survey answers you collect (after step 1)
    - A buyer profile or customer reviews (optional)
  prerequisites:
    - An AI that can read the files in the handoff pack, such as Claude with files or Claude Code
    - A week or two to send the survey and collect answers
  output:
    - name: Must-have survey plan
      contains: Who to ask, the survey with its fixed key question, how to count the 40 percent test, and how to study fans.
    - name: Growth idea ranking
      contains: Each growth idea scored 1 to 10 for impact, confidence and ease, averaged and sorted.
    - name: First three tests
      contains: One test for each top idea, with a measure, a stop date and a run order.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Picks who to ask
    text: Picks active users who have had the core experience, and plans interviews first if there are too few.
  - title: Writes the survey
    text: Writes one fixed question on how they would feel without the product, plus open questions on the main benefit and who it is for.
  - title: Plans how to count
    text: Shows how to count the share who say very disappointed against the 40 percent line, and how to study that group.
  - title: Waits for the answers
    text: You send the survey and collect the answers. Nothing more runs until you bring them back.
  - title: Scores the ideas
    text: Takes your survey findings and scores each growth idea from 1 to 10 for impact, confidence and ease, then averages and sorts.
  - title: Plans the tests
    text: Writes one test for each top idea with a measure and a stop date, and puts the quickest first.
output_shape: |-
  STEP 1: MUST-HAVE SURVEY PLAN
    Who to ask: <active users who have had the core experience> | count <n> | enough? <yes/no>
    The survey: 1 How would you feel if you could no longer use <product>? 2 <main benefit> 3 <who benefits most> 4 <one more question>
    How to count: very disappointed / all answers = <share> against 40 percent
    Study the fans: <what they value> | <who they are>
    One change to try, then re-run the survey

  (you send the survey and collect the answers)

  STEP 2: GROWTH IDEA RANKING
    The list, scored and sorted: rank | idea | impact | confidence | ease | average | why
    The first three to test: <idea> | test <what> | measure <number> | stop date <date>
    Run order: <quickest first, with why>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Who gets the survey
    how: Send it only to people who used the core feature. Someone who signed up and left can't tell you if they would miss it.
  - what: The answers you bring back
    how: Include the open answers, not only the counts. The fans' own words tell you which ideas to rank higher.
  - what: Your list of ideas
    how: Collect ideas from across the team before you score. A longer list gives the ranking more to work with.
judge:
  - The key question has fixed answers, so the share is easy to count.
  - The 40 percent line is described as a signal, not proof.
  - Each score has a reason, and the average is shown.
  - Each test has a measure and a stop date.
  - No survey result or user number is invented.
test:
  - Give it a product with fewer than 30 active users. The plan should suggest interviews first.
  - Give it made-up answers where 30 percent say very disappointed. It should say you are below the line and point to a change to try, not to growth.
  - Run the scoring twice on the same list. The top three can differ in order, but should mostly match.
improve:
  - Run the survey again after the change you try, and keep the share in a file to see the trend.
  - Add the fans' reasons to your org context, so ads and pages use their words.
  - Re-score the list after each test and record what the test showed.
