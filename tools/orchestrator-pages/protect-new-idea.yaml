new_slug: protect-new-idea
name: Protect a rough new idea until it is ready
summary: Protect a rough new idea from deadlines and doubters. Learn if it is early or broken, then get a plan for who sees it and who pays.
job: lead-people
thinking: high
thinking_why: It weighs weak signs of progress and morale and can end a project, so give it your strongest model.
headline: Shield a rough new idea from deadlines and doubters until it can stand up
subhead: "Describe the idea and the groups pulling on it. It maps who wants what, decides whether the idea is early or truly stuck, and if it deserves to live, writes the plan: who sees it, what they may ask, who pays and when the shield comes off."
explain: |
  A new idea is ugly at first. Ed Catmull's name for it is an ugly baby, and his point is that it cannot be judged by the standards of finished work. The people who would kill it are usually doing their jobs well. They hold schedules, sales targets and high standards. Meanwhile, the work that already exists needs no defender because the system leans its way.

  This workflow does two things in order. First it tells you whether the idea is early or broken, by comparing it with its own earlier versions, checking whether notes change it and asking whether the people on it still believe the problems can be solved. Only then does it write the plan to shield it, with protectors, a short list of allowed questions, funded time and a date and test for meeting the wider business.
when:
  - A promising idea looks rough and someone wants to judge it as if it were finished.
  - Deadlines or sales targets are pulling a new project off course.
  - You can't tell if a struggling project needs patience or a hard decision.
not_for:
  - "Your work is finished and ready to ship: use a standard project review with your team instead."
  - "You have a single task to check, not an idea under pressure: use the Advice credibility checker to test the advice you were given."
  - "The idea has no history and no people on it yet: write a short brief first, then come back once there is a first version to judge."
you_give:
  - The idea, who leads it and how long it has run
  - The groups that need output or approval from it
  - Its rounds so far, with dates and what changed (strongly better)
you_get:
  - A map of who pulls on the idea and where the pull has started to steer it
  - A call to keep protecting, change the approach, change the lead or stop, with evidence and a date to look again
  - A protection plan with who sees it, which questions are allowed, who pays and the hand-off date and test
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Give step 1 the idea and the groups around it. Give step 2 the version history if you have it.
  - If the call is not keep protecting, step 3 still runs but says the plan only applies if you choose to carry on.
output_sample:
  input:
    - Your idea, who leads it and how long it has run
    - The groups that need output or approval from it
    - Its versions so far, with dates and what changed (optional, but it helps a lot)
    - How the team feels about it (optional)
  prerequisites:
    - An AI that can read files, such as Claude, to follow the handoff pack
  output:
    - name: "Step 1: Who pulls on the idea"
      contains: A table of each group, what it wants, how it pulls and where it steers the idea.
    - name: "Step 2: Early or broken"
      contains: A timeline, a test of how notes changed the idea, a read on team belief, then the call and a date to look again.
    - name: "Step 3: The plan that shields it"
      contains: What is protected, who sees it, which questions are allowed, who pays and the date and test for the hand-off.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every missing item in one list.
how_it_works:
  - title: Maps the pull
    text: Lists every group that needs something from the idea, what each wants, and where a schedule or target has started to decide what the idea becomes.
  - title: Judges early or broken
    text: Compares the idea with its own past, checks what changed after each round of notes and reads whether the team still believes.
  - title: Makes the call
    text: Picks keep protecting, change the approach, change the lead or stop, with a date and what would flip it.
  - title: Writes the shield
    text: Chooses protectors, limits questions to the stage, names who pays and answers each pressure group.
  - title: Plans the hand-off
    text: Sets the date and test for moving from protection to meeting the rest of the business.
output_shape: |-
  STEP 1: WHO PULLS ON THE IDEA
    group | wants | how it pulls | where it steers the idea | balance to restore

  STEP 2: EARLY OR BROKEN
    timeline | against its own past | notes test | belief of the team | hurry | cost
    the call | evidence | look again | flips if

  STEP 3: THE PLAN THAT SHIELDS IT
    what is protected and the three signs of readiness
    who sees it, who does not, rhythm | allowed questions and the line to say
    time and money, payer, review | a line per pressure group
    goals held lightly, intentions held firmly | hand-off date, test, first group, taper

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: The version history
    how: Give dates and a line for each version. Three or more points let step 2 judge the trend.
  - what: How the team feels
    how: Add what people have said, or put the private question step 2 gives you to each person.
  - what: Who pays
    how: Tell step 3 which budgets you have. It will suggest a payer that does not resent the idea.
  - what: How long you can protect
    how: Say it plainly. The rhythm and review dates scale to it.
judge:
  - The idea is compared with its own earlier versions, not finished work.
  - The call is one of the four options and has a date and a flip condition.
  - The belief of the people on the work is addressed with evidence or a missing line.
  - Each protector and each excluded group has a reason about the idea's state.
  - A named person or fund pays, and the hand-off has a date and a test.
test:
  - Give it an idea that later succeeded after a rough start. The call should be keep protecting or change approach.
  - Give it a project that came back unchanged for three rounds. The notes test should flag it.
  - Remove the version history. Step 2 should mark it missing and ask for it.
  - Read the line for forbidden questions aloud. It should sound fair to the person who asked.
improve:
  - Run steps 2 and 3 again at every review, not only when you doubt the idea.
  - Keep each call and its flip condition in a log, then check which flips came true.
  - Add the people in your business who tend to kill early ideas, so they are named as kept away for now.
  - Share the plan with the protectors first, then with the pressure groups.
