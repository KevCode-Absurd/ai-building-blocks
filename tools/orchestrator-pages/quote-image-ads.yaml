new_slug: quote-image-ads
name: "Turn customer quotes into image ads that quote them"
summary: "Turn your customer reviews into quote image ads that use their exact words. Get a review card ad, an ad rules check and a list of missing ad types."
job: make-image-ads
thinking: high
thinking_why: It runs several skills in a row. Give it your strongest model.

headline: "Turn customer quotes into image ads that quote them word for word"
subhead: Give it your reviews. It ranks why people buy, builds quote ads around their exact words, adds a plain review card, checks the lot against ad rules, and lists the ad types your set still lacks.

explain: |
  A real customer sentence sells because it sounds like a person. It stops working the moment someone tidies it up. This workflow keeps every quote exactly as written, with its source, and uses it only for the job it does: the push away from the old way, the pull toward yours, a doubt, or a habit.

  It starts by counting separate people, so a reason is called a pattern only when enough of them say it. The quote ads come next, then one review card that uses a real grumble as a reason to buy. The set is checked against ad rules, and a last step codes the ads by type so you can see what to make next.

when:
  - You have good reviews and want the ads to use the customers' own words.
  - Your image ads sound like brand copy, and you want them to sound like people.
  - You want to know which kinds of ad your set is missing.
not_for:
  - "You have no real reviews yet: write ads from your product facts with the Fact-based ad copy writer, or collect reviews first."
  - "You only want one quote ad: use the Image ad maker from customer quotes."
  - "You only want to know why people buy: run the buying reasons step alone, or use the Buyer research image ad maker."

you_give:
  - Your customer reviews, copied as written, with where each came from
  - Your product facts and photos (optional)
  - Your target countries, for the ad rules check (optional)
you_get:
  - A ranked list of why people buy, in their exact words
  - Quote image ads with the layout, feed text and a flag on any quote to check first
  - A review card ad built from one real review
  - A check of every ad against Facebook and Instagram ad rules
  - The ad types your set still lacks, with a brief for the next three

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Have your inputs ready. Paste your reviews as written and say where each one came from.
  - Check the ranked reasons and the quotes it picked before you make any pictures.
  - Make the images with your image tool, using the prompts and your real photos. Some image tools are paid or need an API key.
  - Check you may use each reviewer's words in an ad. Run the ad rules check before you publish anything.
output_sample:
  input:
    - Your customer reviews, copied as written, with where each came from
    - Your product facts and photos (optional)
    - Your target countries, for the ad rules check (optional)
    - Your brand brain from the Website brand brain builder (optional)
  prerequisites:
    - An AI that can read files, such as Claude with the handoff pack
    - An image tool, if you want to turn the briefs into pictures
  output:
    - name: "Step 1 file: buying reasons"
      contains: Ranked reasons people buy, with the exact phrases, review numbers and whether each counts as a pattern.
    - name: "Step 2 file: quote image ads"
      contains: Quote ads sorted by job, with layout, feed text and a flag on any quote to check first.
    - name: "Step 3 file: review card ad"
      contains: One plain review card built from a real review, with its real stars and word for word lines.
    - name: "Step 4 file: ad rules check"
      contains: A verdict on each ad against Facebook and Instagram ad rules, with the exact line flagged.
    - name: "Step 5 file: missing ad types"
      contains: The ad types your set leaves out, with a short brief for the next three.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.

how_it_works:
  - title: Finds why people buy
    text: Uses the buying reasons skill to copy out each phrase, tag its force, count separate people and rank the reasons.
  - title: Builds the quote ads
    text: Uses the quote ad skill to sort each quote by the job it does, lock the phrase word for word and write the feed text.
  - title: Adds a review card
    text: Uses the review card skill to find a real review whose grumble only exists because the product works, and copies it with its real stars.
  - title: Checks the ads against Meta rules
    text: Uses the ad rules checker on the quote ads and the review card to flag review claims and rate each finding.
  - title: Finds the types still missing
    text: Uses the gap finder to code every ad by type and brief the next three.

output_shape: |
  REASONS (ranked)
  <reason>: <people> people, <sources>   Best phrase: "<exact words>" (review <n>)
  Pattern: <yes or no, and why>

  QUOTE AD <n>: <short name>
  Job: <push, pull, doubt or habit>   Quote: "<exact words>" (review <n>)
  Layout: <zones>   Feed text: <short and long, counts>
  Flag: <quote to check first, or none>

  REVIEW CARD: <stars> <title> <lines, word for word> (review <n>)

  AD RULES CHECK: <verdict, findings with the exact line>

  NEXT: <three ad types the set lacks, with a card for each>

  HAND-BACK SUMMARY
  Files: <each step's file> | MISSING: <every line, in one list>

example:
  business: sprout
  input: |
    [the handoff pack] Follow HANDOFF.md.

    Reviews: the 20 public reviews in reviews.md, with the site each
    came from
    Photos: the pouch and the torn pack
  output: |
    REASONS (ranked)
    No shaker or mixing: 6 people, brand site and a retailer
    Best phrase: "I stopped dreading the powder." (review 4)
    Pattern: yes, 6 people across 2 kinds of source.
    Sticking with it: 3 people, brand site only. Not a pattern.

    QUOTE AD 1: Stopped dreading it
    Job: push   Quote: "I stopped dreading the powder." (review 4)
    Layout: quote large in the top half, pack bottom right
    Feed text: "Greens, without the shaker." (27)
    Flag: review 4 is not marked verified, so it stays out of paid ads
    until the source confirms it.

    REVIEW CARD: 4 stars "Wish the box was bigger" "I run out too fast
    because I eat them like sweets." (review 9)

    AD RULES CHECK: fix first. Ad 2 implies a health result. Cut the
    second sentence.

    NEXT: no price ad, no comparison ad, no how-it-works ad.

    HAND-BACK SUMMARY
    Files: outputs/step-01 to step-05. MISSING: which reviews are
    verified; target countries.

tweaks:
  - what: How many quote ads
    how: Ask for three to six. Each uses a different reason or job, so the set does not repeat itself.
  - what: Quotes you do not trust
    how: Mark them unverified and they stay out of the paid ads and go to a "check first" list.
  - what: Skip the review card
    how: Say "quote ads only" if your reviews have no honest grumble worth using.
  - what: Sizes
    how: Name every size you need. Each is laid out for its own shape.

judge:
  - Every quote on an ad matches the review word for word, with its source.
  - A reason is called a pattern only when at least five separate people say it across two kinds of source.
  - The review card keeps the real star rating and changes nothing in the review.
  - The ad rules check quotes the exact line it flags.
  - The run ends with a summary that lists every file and every MISSING line in one place.

test:
  - Check three quotes on the ads against your reviews, letter by letter.
  - Count the separate people behind the top reason yourself.
  - Confirm the review card shows the real stars and the real wording.
  - Check that the missing types match what you see in your own ad account.

improve:
  - Add reviews from support emails and surveys, so more reasons count as patterns.
  - Add a step after the quote ads that turns each into an image prompt with your real photos.
  - Run it again each quarter with new reviews.
  - Pair it with a skill that reads your ad results, so the next brief targets what works.

works_best_with:
  tools:
    - {name: "Claude", why: "Holds all your reviews, every review number and five steps of work in one run."}
    - {name: "GPT Image", why: "Keeps short quoted words readable in the picture."}
  inputs:
    - "Reviews from more than one site, so reasons can count as patterns"
    - "The review ID or link for each quote"
    - "Your own photos of the product, in use"

terms:
  - term: Quote ad
    meaning: An image ad whose main words are one real customer phrase, kept exactly as written.
  - term: Review card
    meaning: A plain picture that looks like a review, with stars, a short title and a few lines.
  - term: Pattern
    meaning: A reason that at least five separate people give, across two kinds of source.
