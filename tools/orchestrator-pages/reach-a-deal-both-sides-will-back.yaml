new_slug: reach-a-deal-both-sides-will-back
name: Reach a deal both sides will back
summary: Describe the deal or dispute. Get your stance, a plan to listen first, a third option and a written agreement.
job: sell-and-negotiate
thinking: high
thinking_why: It runs five skills in a row and reads two sides from thin evidence. Give it your strongest model.
headline: A deal both sides can say yes to, in writing
subhead: Describe the deal or dispute. It sets your stance and your walk-away line, plans deposits of trust, plans how to listen first, finds a third option beyond both plans and writes an agreement on results. You get a plan for the talk and a page both sides can sign off.
explain: |
  Most deals end in a split of the difference, or one side gives in and resents it. Neither lasts. A better deal comes from knowing your stance, trusting enough to be honest, listening until the other side feels understood, and then looking for an option neither of you named.

  This workflow follows the fourth to sixth habits in Stephen Covey's book: think win-win, seek first to understand, then look for a third alternative. It starts with your stance and your no-deal line, because being ready to walk away lets you listen. It adds to trust, plans the listening, and leaves a pause for the real talk. It then finds a third option and puts the result in an agreement with review dates and consequences.
when:
  - You must settle terms with a client, partner, boss or supplier you will deal with again.
  - A family or business dispute keeps going in circles.
  - You tend to give in or push too hard and want a plan that does neither.
you_give:
  - The deal or dispute, with who, what each wants and what is at stake
  - What you would do if there were no deal
  - Anything the other side has said, word for word (optional)
  - Notes from the real conversation, when you get to the pause
you_get:
  - Your stance, what a win is for each side and the point where you walk away
  - A trust check with two small deposits to make before the talk
  - A plan for listening first and for stating your side after
  - A third option beyond both plans, and a written agreement with review and consequences
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe the deal in a paragraph and say honestly what you do if you walk away.
  - Make the two deposits and have the conversation. Write both sides' concerns in two columns.
  - Bring the notes back for the last two steps and go through the agreement with the other side.
how_it_works:
  - title: Win-win stance planner
    text: Names the stance each side is likely to take, rates your courage and consideration and sets your no-deal line.
  - title: Trust deposit planner
    text: Reads the trust, finds what counts as a deposit to this person and plans two small deposits before the talk.
  - title: Listen-first talk planner
    text: Plans how to listen until they feel heard, then how to state your side.
  - title: Third option finder
    text: Writes both sides' concerns fairly and finds options that beat both starting plans, with a small first step.
  - title: Results agreement writer
    text: Writes the agreement on results, limits, help, review dates and consequences, with an exit clause.
output_shape: |-
  STEP 1: WIN-WIN STANCE PLANNER
    Stances | Courage and consideration | Wins for each side | No-deal line

  STEP 2: TRUST DEPOSIT PLANNER
    Trust: <n> out of 10 | Two deposits | One habit to stop

  STEP 3: LISTEN-FIRST TALK PLANNER
    <what to ask, how to restate, when to speak>

  (hold the conversation)

  STEP 4: THIRD OPTION FINDER
    <both plans, needs, three options beyond them, first step>

  STEP 5: RESULTS AGREEMENT WRITER
    Results | Guidelines | Resources | Accountability | Consequences | Exit

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Their words
    how: Paste what the other side said or wrote. A stance read from a quote is more reliable than one guessed from a summary.
  - what: Your alternative
    how: Say honestly what you would do without this deal. A weak alternative means a weaker walk-away line.
  - what: The conversation notes
    how: Write both sides' concerns in two columns. The third option step is only as good as these notes.
judge:
  - Each stance is backed by a quote or a fact, and their wins are marked as guesses.
  - Your walk-away line says what you would do instead.
  - The listening plan puts your side after theirs.
  - The third option meets both sides' core needs and is more than a split.
  - The agreement states results you can check and gives both good and poor consequences.
test:
  - Run it on a deal you already finished and see if the stance matches what happened.
  - Do the two trust deposits and look at how the other person responds after ten days.
  - Ask the other side to say the agreement back in their own words.
improve:
  - Add your standing alternatives and limits to the stance step so the walk-away line is concrete.
  - Save agreements you like as templates for the same type of deal.
  - Use the week-planning workflow to book the review dates in your calendar.
