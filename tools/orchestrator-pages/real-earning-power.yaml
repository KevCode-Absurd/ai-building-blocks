new_slug: real-earning-power
name: Find a company's real earning power and its tricks
summary: "See what a company really earns in a normal year. Paste its income statements; get one-offs removed, padding flagged and a normal earnings range."
job: money-and-investing
thinking: high
thinking_why: It runs four skills in a row and each one reads many lines across years. Give it your strongest model.
headline: See what a company really earns in an ordinary year, and which profit is for show
subhead: Paste several years of income statements and their notes. It strips out the one-time gains and losses and looks for accounting choices that lift profit. It tests whether the past years can guide the future, then gives low, normal and high earnings per share.
explain: |
  What does this company really earn in a normal year? Reported profit is a figure with a story behind it. A building sold, a tax refund, a write-down that comes back as next year's profit, a cost parked on the balance sheet. Each can move the number without changing the business.

  This workflow uses ideas from the 1940 edition of Security Analysis by Benjamin Graham and David Dodd. The order of the steps is ours, not the authors'. It rebuilds each year without the one-offs, checks for padding and rates how far the record can be trusted. Only then does it work out normal earnings, as a range. It never projects a trend and does not use the latest year alone unless three conditions hold. It is a method of analysis, not financial advice. It never says buy or sell.
when:
  - A company's latest profit looks too good, or too poor, to be typical.
  - A big write-down was followed by a very good year.
  - You are valuing a business and need one earnings figure you can defend.
  - You are reading an annual report and want to know which profit is for show.
not_for:
  - "You want a price or value for the company: run this first, then Stock valuation margin-of-safety reviewer."
  - "You are lending to the company, not owning it: use Bond and loan repayment risk review."
  - "You want to know if the business itself is any good: use Long-term business quality reviewer."
  - "You have fewer than five years of statements, or the company is new. The record cannot guide, and the run will say so."
you_give:
  - Five to ten years of income statements, with the notes
  - Balance sheets and cash flow statements for the same years (optional)
  - A few lines on the business and its industry (optional)
  - Share counts by year (optional)
  - Years you think were unusually good for the business (optional)
you_get:
  - A table of one-off items and each year's ordinary earnings
  - Accounting choices that lift profit, sized, with a clean, adjusted or avoid call
  - A rating of how far the record can guide the future
  - Low, normal and high earnings per share, each with a reason
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste the income statements and the notes. Add cash flow statements and a note on the business if you have them.
  - It runs four steps and saves each one. A missing figure is marked MISSING, never guessed.
  - Read the call on padding first. If it says avoid, stop there. If not, use the normal earnings range.
how_it_works:
  - title: Removes the one-offs
    text: Lists gains and losses that will not repeat, pairs the ones booked in different places and rebuilds each year.
  - title: Looks for padding
    text: Checks write-downs, parked costs, depreciation, subsidiary income and per-share effects, and sizes each.
  - title: Rates the record
    text: Tests the scatter, the nature of the business, temporary profits and what the loss years say about survival.
  - title: Works out normal earnings
    text: Averages five to ten years, caps the figure at what a normal year has shown and gives a range.
output_shape: |-
  STEP 1: ONE-OFFS REMOVED
    One-off items by year | Ordinary earnings by year | Ordinary average and all-in average

  STEP 2: PADDING
    Findings: <check, year, size, direction> | Restated earnings | Call: <CLEAN / ADJUSTED / AVOID>

  STEP 3: HOW FAR THE RECORD CAN BE TRUSTED
    Scatter | Business | Temporary profits | Place in industry | Loss years | Rating: <GUIDE / PARTIAL GUIDE / NOT A GUIDE>

  STEP 4: NORMAL EARNINGS
    LOW: <amount> | NORMAL: <amount> | HIGH: <amount> per share, each with a reason

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
output_sample:
  input:
    - "Five to ten years of the company's income statements, with the notes"
    - "Cash flow statements for the same years (optional)"
    - "A few lines on the business and its industry (optional)"
  output:
    - {name: "Step 1 one-offs removed", contains: "One-off items by year and ordinary earnings by year, with the ordinary and all-in averages."}
    - {name: "Step 2 padding", contains: "Accounting choices that lift profit, sized, restated earnings and a clean, adjusted or avoid call."}
    - {name: "Step 3 how far the record can be trusted", contains: "Six tests of the record and a guide, partial guide or not a guide rating."}
    - {name: "Step 4 normal earnings", contains: "Low, normal and high earnings per share, each with a reason, and the limits."}
    - {name: "Hand-back summary", contains: "Each step's file and every MISSING line in one list."}
tweaks:
  - what: Cash flow statements
    how: Paste them. Profit against cash from operations is the fastest warning of padding.
  - what: Share counts
    how: Give the count for each year, or the splits and buybacks, so per-share figures are comparable.
  - what: Boom years
    how: Name years you think were unusually good for business. They stay out of the high case.
judge:
  - Each step used the result of the step before.
  - Gains and losses of the same kind were paired.
  - An avoid call puts no number on dishonesty.
  - The latest year was not used alone unless all three conditions held.
  - No step invented a figure, and nothing was named as a security to buy or sell.
test:
  - Run it on a company that sold a property in one year and check the gain is removed.
  - Give it a company that wrote off stock and then had a strong year and check the link is found.
  - Run it twice on the same input. The range should not change.
improve:
  - Save your list of items you always question, so later runs start with it.
  - Keep a record of the ranges and what the company later earned.
  - Feed the result to "Value a stock with a margin of safety".
terms:
  - term: Ordinary earnings
    meaning: What the business earned from its normal work in a year, with one-off gains and losses taken out.
  - term: Padding
    meaning: Accounting choices that lift reported profit without any change in the business.
  - term: Earnings per share
    meaning: A company's profit for the year divided by the number of shares it has issued.
next: [stock-margin-of-safety, business-valuation-discount]
works_best_with:
  tools:
    - {name: "Claude", why: "Reads many lines across several years and keeps each step's table for the next."}
    - {name: "A spreadsheet", why: "Lets you check the year-by-year table and the averages."}
  inputs:
    - "The company's annual reports, with the notes"
    - "Cash flow statements for the same years"
    - "Share counts, splits and buybacks by year"
