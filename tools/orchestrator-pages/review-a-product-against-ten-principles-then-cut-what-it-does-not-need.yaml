new_slug: review-a-product-against-ten-principles-then-cut-what-it-does-not-need
name: Review a product and cut features it does not need
summary: Describe your product or page. Get a ten-principle review and a list of
  what to keep, cut and merge.
job: design-work
thinking: high
thinking_why: It judges a product on ten principles, then decides what to cut.
  Give it your strongest model.
headline: Review a product and cut features it does not need
subhead: "Describe your product, page or app, and say what it is for. It scores
  the product on ten principles of good design and marks every part that serves
  no purpose. Then it turns that into a plan: what to keep, what to cut and what
  to merge so the product explains itself."
explain: >
  Products grow by adding. Each feature had a reason, but over time the page
  fills up, the menu gets long, and the one thing the product is for gets harder
  to find. Cutting is harder than adding, because every part has someone who
  likes it.


  This workflow gives you a standard to cut against. It starts with one sentence
  on what the product is for, then scores it on ten principles, such as being
  useful, understandable, honest and having as little design as possible. It
  marks each part that serves no purpose. The second step lists every feature,
  asks whether it helps the main job, and sorts them into keep, cut and merge.
  The ten principles come from a talk by Dieter Rams, the designer behind Braun
  and Vitsoe.
when:
  - Your product, app or page has grown cluttered and new users don't know where
    to start.
  - You are planning a redesign and want to decide what goes before you decide
    what it looks like.
  - Your team can't agree on which features to keep, and you want a shared
    standard to argue from.
you_give:
  - A description of the product and what it is for
  - A page or screenshot of it (optional)
  - A list of its features, parts or settings (optional)
you_get:
  - A score on each of the ten principles, with the reason for each
  - A list of every part and its job, with the parts that serve no purpose marked
  - A plan that sorts each feature into keep, cut or merge, with a reason, in
    the order a new user should meet them
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file
    this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project)
    and say "Follow HANDOFF.md".
  - Describe the product and say what it is for. Add a page, screenshot or
    feature list if you have one.
  - It works step by step and saves each result. Read the review before you read
    the cut list.
  - Check the cuts with your team before you remove anything people rely on.
how_it_works:
  - title: Score against ten principles
    text: Writes what the product is for, lists every part and its job, and scores
      it on ten principles. Marks the parts that serve no purpose.
  - title: Plan the cuts
    text: Takes the review and asks of each feature whether it helps the main job.
      Sorts them into keep, cut and merge, then sets the order a new user should
      see them.
output_shape: |-
  STEP 1: TEN-PRINCIPLE REVIEW
    Purpose: <what it is for and who uses it>
    Scores: <principle | score | reason> (ten rows)
    Parts: <each part | its job | serves a purpose or not>
    Proposed cuts: <part | why>

  STEP 2: KEEP, CUT AND MERGE PLAN
    The one job: <what the product does for the user>
    Features: <keep / cut / merge> | <feature> | <reason>
    Order: <what a new user should meet first, second, third>
    Consistency fixes: <size, colour and wording to match>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: The one-sentence purpose
    how: Write what the product is for before you run it. A vague purpose makes
      every feature look useful.
  - what: The feature list
    how: Include small things such as settings, labels and footers. They often add
      the most clutter.
  - what: Who uses it
    how: Say who uses the product most. A part the main user never touches is a good
      candidate for a cut.
judge:
  - The purpose is one sentence and every score refers back to it.
  - Each score has a reason you could argue with, not just a number.
  - Every part in the product appears in the list, including small ones.
  - Each cut names what happens to the job it did, such as merged or no longer
    needed.
  - The plan keeps the product's main job working.
test:
  - Run it on a product you know has dead weight. The parts you suspected should
    show up in the cut list.
  - Ask it to defend one cut you disagree with. The reason should rest on the
    product's purpose, not on taste.
  - Show the keep, cut and merge plan to a new user. They should be able to say
    what the product is for.
improve:
  - Save the purpose sentence and the keep list in a file your team shares, and
    check new feature ideas against it.
  - Add rules of your own to the review, such as a limit on menu items or on
    fields in a form.
  - Re-run the review after each round of cuts to see which parts are now the
    weakest.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Takes screenshots and a feature list and works through both steps.
    - name: Your analytics tool
      why: Shows which features real users never touch, which backs up the cut list.
  inputs:
    - Usage numbers for each feature
    - Support questions about the product
    - A screenshot of every main screen
terms:
  - term: Ten principles
    meaning: A short list of tests for good design, such as useful, honest,
      understandable and as little design as possible.
