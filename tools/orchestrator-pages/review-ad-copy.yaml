new_slug: review-ad-copy
name: Turn reviews into ad copy in your brand voice
summary: Turn customer reviews into ad copy that sounds like your brand. Get a buyer brief, an ad angle, fact-based copy and a voice check.
job: understand-customers
thinking: high
thinking_why: It runs several skills in a row. Give it your strongest model.
headline: Turn customer reviews into ad copy that sounds like you
subhead: Give it your customer reviews and your org context. It writes a buyer brief, picks the argument an ad should make, writes ad copy from one real product fact at a time, then checks each line against your brand voice.
explain: |-
  Ad copy written from guesses sounds like every other ad. Copy written from reviews alone can drift off your brand's voice or lean on claims you cannot back.

  This workflow reads the reviews first and writes who the buyer is, what pushed them to look and what holds them back. It picks the argument that fits how much they already know. It then writes copy built on one product fact per ad, and checks every line against your voice rules and your never-say list.
when:
  - You have reviews or customer emails and no one has turned them into ad copy.
  - Your ad copy sounds generic or sounds nothing like your site.
  - You need copy a stranger can trace back to a fact you can prove.
not_for:
  - "You have no customer words yet: collect reviews, emails or survey answers first, or build your org context with the Org context builder."
  - "You only want the argument an ad should make: use the Ad angle planner."
  - "You already have ad copy and only need it to match your voice: use the Brand voice editor."
you_give:
  - Customer reviews, copied as written
  - Your org context
  - Your product facts
you_get:
  - A buyer brief with the moment they started looking and their own words
  - The ad angle that fits what the buyer already knows
  - Ad copy where each line rests on one product fact
  - A voice score with a fix for each line that misses
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Have your inputs ready. It works step by step and saves each result.
output_sample:
  input:
    - Customer reviews, tickets, survey answers or call notes, with source and date
    - Your org context (facts, voice, claims, buyers)
    - "Your product facts: price, variants, how it is used"
    - A video ad script (optional)
  prerequisites:
    - An AI that can read files, such as Claude Code or a Claude Project with the handoff pack uploaded
  output:
    - name: Buyer brief
      contains: The moment the buyer started looking, what pushes and holds them back, and their own words.
    - name: Ad angle
      contains: The argument the ad should make, matched to what the buyer already knows, with the reason.
    - name: Ad copy
      contains: Headlines and text, each built on one product fact with its source.
    - name: Voice check
      contains: Each line flagged if it breaks your voice rules, with a fix and a voice score.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Writes the buyer brief
    text: Uses the buyer brief skill to find the buying moment, sort the pushes and holds, and quote the buyer's words.
  - title: Picks the ad angle
    text: Uses the ad angle skill to match the argument to how many others make the same promise and how much the buyer knows.
  - title: Writes fact-based copy
    text: Uses the fact-based copy skill to find the one fact that answers the buyer's doubt and say what it changes for them.
  - title: Checks your voice
    text: Uses the brand voice editor to flag lines that break your voice rules and fix them with the customer's own word.
output_shape: |-
  BUYER BRIEF
    Moment: <what happened before they looked> | Knows: <level>
    Forces: push / pull / habit / worry, each quoted
    Their words: <5 to 8 phrases>
    Job line: When <moment>, I want to <progress>, so I can <gain>.

  ANGLE
    Level and stage: <pick>, because <why>

  AD COPY
    <headline> | <text> | Fact: <fact> (source)

  VOICE CHECK
    | Line | Flag | Fix |  Voice score: <share of lines in voice>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
example:
  business: sprout
  input: |-
    [the handoff pack] Follow HANDOFF.md.

    Reviews: 6 Sprout reviews, copied as written. Practice data.
    Org context: the Sprout org context. Product facts: powder, 6g prebiotic fiber.
  output: |-
    STEP 1: BUYER BRIEF
    Moment: "Yesterday's shaker was still in the sink." (review 2)
    Forces: push "I keep quitting powders"; hold "will it upset my stomach?"
    Their words: "consistency", "chore", "kept taking it".
    Job line: When taking a supplement feels like a chore, I want one I keep taking, so I can feel steady.

    STEP 2: ANGLE
    Buyer knows the problem and is comparing fixes. Argument: show how Sprout is easy to keep taking, because 80% of surveyed users take it daily.

    STEP 3: AD COPY
    Headline: The greens you'll still be taking next month.
    Text: Most people quit powders because it feels like a chore. 80% of surveyed users take Sprout daily.
    Fact: 80% daily use (brand survey, 3,000+)

    STEP 4: VOICE CHECK
    | Line | Flag | Fix |
    | "Most people quit powders" | none | none |
    | "detox your gut" | never-say word | "help your gut keep going" |
    Voice score: 3 of 4 lines (75)

    HAND-BACK SUMMARY
    Files: outputs/step-01 to step-04. MISSING: consent to quote review 2 in a paid ad.
tweaks:
  - what: How many ads
    how: Say how many versions you need. The copy step writes one fact per version and skips a fact that has no source.
  - what: Where the copy runs
    how: Name the place (image ad, video script, landing page). The angle step then keeps the argument inside what that place can show.
  - what: Voice rules
    how: Add your never-say list and two or three lines you like. The voice check uses them first.
judge:
  - Every quoted phrase in the brief appears in your reviews.
  - Each ad line points to a fact in your org context or product facts.
  - The angle fits how much the buyer already knows, and the brief says why.
  - Lines the voice check flags are fixed or listed, not left in.
test:
  - Search your reviews for three quoted phrases from the brief. Each should be there word for word.
  - Check one ad fact against your product page.
  - Run the voice check on a line you wrote yourself. It should flag only real breaks of your rules.
improve:
  - Add a step at the end that turns the best copy into an image ad or a video script.
  - Save the buyer brief in your org context so later runs skip step 1.
  - Feed the voice check your best-performing ads as examples of your voice.
