new_slug: review-an-agent-before-launch
name: Review an agent before launch
summary: Share your agent code and design. Get risks in tool access, plugin trust and behavior ranked before launch.
job: secure-code
headline: Review an agent before launch
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your agent's job, its tool list and its code. Your AI checks what each tool may do, tests the code against the 10 OWASP agent risks, checks your packages, and reviews the proof behind each finding. You get the open risks ranked High, Medium or Low.
explain: |-
  An agent that can call tools can send, change or delete things. This review finds where it could do harm before real users reach it.

  Step 1 lists each tool and decides what the agent may do with it: allow, deny or ask a person first. Step 2 checks your code against the 10 OWASP agent risks and uses that tool plan. Step 3 works on your code and package files alone. It records a file hash for your tools and packages and checks how they are pinned. Step 4 checks the findings from steps 2 and 3 for proof. A claim with no evidence is marked, not trusted.

  The last result ranks what is still open. High means the agent can change data, spend money or reach secrets with no block or approval. Medium means a control exists but can be bypassed, is not logged or is not tested. Low means a weakness with little reach. A person must still review it before launch.
when:
  - You are about to launch an agent that can call tools, such as APIs, files or a database.
  - You need to decide which tools the agent may use, which are blocked and which need a person to approve.
  - You want the agent's code and packages checked before real users reach it.
  - You were given a security audit of the agent and want to know which claims have proof.
you_give:
  - What the agent does, in one or two sentences
  - Each tool the agent can call, and whether it reads or changes things
  - The risk level (internal test, general production, sensitive such as money, health or legal, or compliance-critical) and the data it can touch
  - Your agent code, tool list and package files
  - A security audit or findings list you already have (optional)
you_get:
  - A tool permission table that says allow, deny or ask a person, with the reason
  - A policy file, the fields to log for each tool call and a test list
  - A pass or fail line for each of the 10 OWASP agent risks, with evidence and a fix
  - A file hash record of your tools and packages, with a verified or tampered result when you recheck
  - A verdict on each finding's evidence
  - The open risks ranked High, Medium or Low, in the order to fix them
not_for:
  - "Your agent has no tools and only writes text: there is nothing to lock down, so skip this."
  - "You want to attack the agent and see if it breaks: use the AI agent attack tester."
  - "You want to watch the agent once it is live: use the AI agent monitoring planner."
  - "Your concern is the API behind the agent: use Fix API security gaps with tests and a pull request."
output_sample:
  input:
    - The agent's job in one or two sentences
    - Each tool the agent can call, and whether it reads or changes things
    - Your agent code, tool list and package files
    - A security audit or findings list you already have (optional)
  prerequisites:
    - An AI that can read files, to run the handoff pack
  output:
    - name: "Step 1: Agent control review"
      contains: A tool permission table (allow, deny or ask a human), a policy file, audit log fields and a test list.
    - name: "Step 2: OWASP findings"
      contains: A pass or fail line for each of the 10 OWASP agent risks, with evidence and a fix for each gap.
    - name: "Step 3: Plugin integrity record"
      contains: A file hash manifest for your tools and packages, and a verified or tampered result when you recheck.
    - name: "Step 4: Evidence review"
      contains: A verdict on each finding from steps 2 and 3, and any audit you supply, marked verified, unsupported or not checked.
    - name: Unresolved risks
      contains: Open findings ranked High, Medium or Low in fix-first order, every missing fact and one next action.
    - name: Hand-back summary
      contains: Source coverage and each step's status in one list.

how_to_use:
  - "Download the pack. It holds HANDOFF.md and four skill files, in the order they run: AI agent control designer, Agent OWASP risk checker, Agent plugin integrity checker, then Security audit evidence reviewer."
  - Share the agent's job, its tool list, and its code and package files.
  - Ask your AI to follow HANDOFF.md and mark any missing fact.
  - Review the ranked risks yourself before launch. Nothing is deployed or changed for you.
how_it_works:
  - title: AI agent control designer
    text: Lists every tool the agent can call and what it can do with it. Sets allow, deny or ask a person for each tool, and writes the policy, log fields and tests. Hands the plan to step 2.
  - title: Agent OWASP risk checker
    text: Checks your agent code against the 10 OWASP agent risks, using the plan from step 1. Gives a pass or fail line for each risk, with evidence and a fix.
  - title: Agent plugin integrity checker
    text: Works on your code and package files, not on step 2. Records a file hash for your tools and packages, checks how packages are pinned and flags files that changed.
  - title: Security audit evidence reviewer
    text: Checks the findings from steps 2 and 3, and any audit you supply, against the files they cite. Marks each claim verified, unsupported or not checked.
output_shape: |-
  Agent control review          <tool | reads or changes | allow, deny or ask a person | why; policy file; log fields; tests>
  OWASP and plugin findings     <ASI-01 to ASI-10, pass or fail, evidence, fix; file hash record for tools and packages>
  Evidence review and unresolved risks   <each claim: verified, unsupported or not checked; open risks ranked High, Medium, Low in fix-first order; missing facts; one next action>
tweaks:
  - what: Risk level
    how: Say if the agent is an internal test or touches money, health or legal matters. A higher level calls for stricter controls.
  - what: Scope
    how: Name the tools, folders or packages to include when the agent is large.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms:
  - term: OWASP agent risks
    meaning: A public list of the 10 most common security risks for AI agents that use tools.
  - term: File hash
    meaning: A short code worked out from a file's contents. If the file changes, the code changes.
