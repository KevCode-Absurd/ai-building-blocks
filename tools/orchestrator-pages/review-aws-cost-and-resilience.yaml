new_slug: review-aws-cost-and-resilience
name: Review AWS cost and resilience
summary: Share your AWS design and bills. Get resource savings weighed against workload risks before you change anything.
job: ship-and-host
headline: Review AWS cost and resilience
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your AWS design and bills. Get resource savings weighed against workload risks before you change anything. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your AWS design and bills. Get resource savings weighed against workload risks before you change anything.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want to cut your AWS bill and need to know which savings would weaken reliability or security.
  - You plan an infrastructure change and want preflight checks and a rollback plan that account for those risks.
  - You have a bill export and design files, but no one has weighed cost against risk.
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - Resource cost findings
  - Architecture risks
  - Prioritized change and rollback plan
not_for:
  - "Your setup runs on Azure, not AWS: use Review Azure cost and resilience."
  - "Something is broken on AWS right now: use Investigate an AWS service incident."
  - "You only want to cut the cost of your build and test runs: use Cut CI cost without weakening checks."
output_sample:
  input:
    - Your AWS design files (Terraform, CloudFormation or CDK) or a list of your AWS services
    - Your AWS bills or cost reports (optional)
    - The release or infrastructure change you plan to make
    - Your goal and the limits you work within
  prerequisites:
    - An AI that can read files, to run the handoff pack
    - AWS command line access and a GitHub link, only if you want the AI to read live resources and open issues
  output:
    - name: Resource cost findings
      contains: Each saving tied to a named resource, with current cost, proposed change, risk, effort and a priority score.
    - name: Architecture risks
      contains: Findings across the six AWS Well-Architected pillars, each rated high, medium or low risk, with a fix.
    - name: Rollout and rollback plan
      contains: Preflight checks, rollout stages, health signals, rollback steps and who to tell.
    - name: Prioritized change list
      contains: Savings and risk fixes in one order, so you see which saving costs you resilience.
    - name: Hand-back summary
      contains: Source coverage, missing facts and one next action.

how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: AWS resource cost reviewer
    text: Share your AWS setup. Get cost findings and proposed fixes tied to the resources your app uses.
  - title: AWS workload practice reviewer
    text: Share your AWS design. Get architecture gaps and proposed fixes against AWS workload guidance.
  - title: Service rollout and rollback planner
    text: Share a release or infrastructure change. Get preflight checks, rollout stages, health signals and a rollback plan.
output_shape: |-
  Resource cost findings
  Architecture risks
  Prioritized change and rollback plan
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
