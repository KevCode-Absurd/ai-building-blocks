new_slug: review-azure-cost-and-resilience
name: Review Azure cost and resilience
summary: Share your Azure resources. Get a resource map, current price estimates and a risk-aware savings plan.
job: ship-and-host
headline: Review Azure cost and resilience
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your Azure resources. Get a resource map, current price estimates and a risk-aware savings plan. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your Azure resources. Get a resource map, current price estimates and a risk-aware savings plan.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - Your Azure bill keeps rising and you do not know which resources cause it.
  - You want to cut waste without making the setup less reliable or secure.
  - You need a resource map and a price estimate before a budget talk.
you_give:
  - The name of your Azure resource group, or a list of your resources
  - Your Bicep, Terraform or ARM files (optional)
  - Your goal and any budget limit
you_get:
  - A map of your resources and how they connect
  - Current retail prices with every assumption shown (list prices, not your bill)
  - Savings tied to named resources, each with its risk, and gaps rated high, medium or low
not_for:
  - "Your setup runs on AWS, not Azure: use AWS cost and resilience reviewer."
  - "You want a new Azure design from scratch: use the Azure architecture designer."
  - "A deploy is failing or an Azure service is down: use the Azure service health investigator."
  - "You only want to check that your deploy will pass: use the Bicep deployment preflight checker or Azure deployment access reviewer."
output_sample:
  input:
    - The name of your Azure resource group, or a list of your Azure resources
    - Your Azure design files (Bicep, Terraform or ARM templates), if you have them
    - The Azure services and regions you want priced
    - Your goal and the limits you work within
  prerequisites:
    - An AI that can read files, to run the handoff pack
    - Azure command line or Azure tool access and a GitHub link, only if you want the AI to read live resources and open issues
    - Internet access, so the AI can fetch current Azure retail prices
  output:
    - name: Resource relationship map
      contains: A diagram of your resources and how they connect, with a resource table and notes on weak spots.
    - name: Price assumptions
      contains: Current retail prices by service, size and region, with monthly and yearly estimates and the assumptions shown.
    - name: Cost findings
      contains: Waste found in named resources, with the proposed fix, saving, risk and effort for each.
    - name: Workload findings
      contains: Gaps across the five Azure Well-Architected pillars, each rated high, medium or low risk, with a fix.
    - name: Hand-back summary
      contains: Source coverage, missing facts and one next action.

how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: Azure resource relationship mapper
    text: Share your Azure resource group. Get a diagram of the resources and how they connect.
  - title: Azure price estimate researcher
    text: Name the Azure services you need. Get current retail prices and an estimate with its assumptions shown.
  - title: Azure resource cost reviewer
    text: Share your Azure setup. Get waste findings and proposed fixes tied to your app's resources.
  - title: Azure workload practice reviewer
    text: Share your Azure design. Get architecture gaps and proposed fixes against Azure workload guidance.
output_shape: |-
  Resource relationship map
  Price assumptions
  Cost and workload findings
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
