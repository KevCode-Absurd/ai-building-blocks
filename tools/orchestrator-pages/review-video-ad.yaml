new_slug: review-video-ad
name: "Turn reviews into a video ad ready to film"
summary: "Give it your website and reviews. You get a script in your customers' words, then every stage to the clips."
job: make-video-ads

headline: "Turn reviews into a video ad ready to film"
subhead: Give it your website, your customer reviews and the buyer you want to reach. It builds your brand file, ranks why people buy, writes a script where every line has a source, checks it against ad rules, then takes it through avatar, sheets, storyboard and clip prompts, with your yes at each stage.

explain: |
  Most video ads start from a blank page and a guess about what buyers care about. The result sounds like every other brand, and the person making it has to make up the shots. This workflow starts from your customers instead. It reads your reviews for the reasons people switch and the words they use, and counts how many separate people say each one.

  It runs seven skills in order. The first collects your facts, voice and allowed claims into a brand file, with every fact tagged by where it came from, so no later step invents anything. The script names the one belief the ad must change and builds beats from the opening to the call to action, each with the review or fact behind it. The next step reads every line aloud to fix what sounds stiff, and the script is then locked. It's checked against Facebook and Instagram ad rules before anything is made. Then the full video process: pick the avatar, make reference images and a character sheet with every angle, storyboard every shot, and turn the storyboard into clip prompts and an edit list. You approve the avatar, the sheets and the storyboard before it moves on.

when:
  - You need a new video ad and don't know where to start.
  - Your current video ads sound like the rest of your category.
  - You have plenty of reviews but have never turned them into a script.

you_give:
  - Your website, as a link or saved pages
  - Your customer reviews, copied as written
  - Who the ad is for, what they want and what makes them doubt
  - Your product facts and the claims you may and may not make
  - Your ad results and real product photos (optional)
you_get:
  - A script beat by beat, with on-screen words, what is seen and the source for each line
  - An ad rules check with fixes, before anything is made
  - The avatar card, character and product sheets, and a storyboard, each approved by you
  - Timed shot tables, clip prompts and an edit list, plus your brand file and buying reasons to reuse

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Have your inputs ready. Your website link, your reviews, one or two sentences on who the ad is for, your product facts and real product photos.
  - Fix anything wrong in the brand file's fact sheet, check the buying reasons, and fix anything the ad rules check marks "Fix first".
  - Approve the avatar card, then the sheets, then the storyboard. Nothing is made until you say yes.

how_it_works:
  - title: Builds your brand file
    text: Uses the brand file skill to read your website, check the basics with you once, and write eight files where every fact says where it came from.
  - title: Finds why people buy
    text: Uses the buying reasons skill to copy out phrases word for word, tag what pushed and pulled each buyer, and rank reasons by how many separate people say them.
  - title: Writes and locks the script
    text: Uses the video script skill to name the belief to change and write the beats with a source for each line, then the read-aloud skill fixes stiff lines without changing any fact.
  - title: Checks the ad rules
    text: Uses the Facebook and Instagram ad rules skill on the locked script and picture notes, before any image or clip is made.
  - title: Picks the avatar and builds the sheets
    text: Uses the storyboard skill to write the avatar card, make reference images and build a sheet with every angle, your product and each place. You approve each.
  - title: Storyboards every shot
    text: One frame and one shot card per shot, each with one job, with continuity checked. You approve the board.
  - title: Makes the clips
    text: Uses the shot list skill to split the script into clips of about 6 seconds, write timed shots, clip prompts that describe only the motion, and the edit list.

output_shape: |
  SCRIPT (<length> seconds, spoken by <who>, <spoken words> of a <budget> word budget)
  Belief shift: Now they believe <...>. After this ad they believe <...>.
  | Beat | Spoken line | On-screen text | Picture note | Evidence |

  AD RULES CHECK  Verdict: <ready to run / fix first / likely rejected>
  - <rule area>, <where>: <problem>. <fix>

  AVATAR CARD (approval 1)  <role, look, clothes, voice, never changes>
  REFERENCE IMAGES  <3 or 4 prompts>  Picked: <n>
  SHEETS (approval 2)  <every angle, product sheet, set sheets>  LOCK LINES <..>
  STORYBOARD (approval 3)  <n> <job> <time> | <framing> | <action> | "<line>"

  SHOT LIST, CLIP <n> (<which lines>, <seconds>)
  <#> | <start> to <end> s | <size> | <camera position> | <move> | <one action>
  CLIP PROMPTS  <lock lines, then the motion>  EDIT LIST  <order, captions, end card>

  HAND-BACK SUMMARY
  Files: <each step's file> | Clips and shots: <counted from the tables>
  Approvals: <three, or WAITING> | MISSING: <every line, in one list>

example:
  business: sprout
  input: |
    [the handoff pack] Follow HANDOFF.md.

    Website: sprout.example (product page, science page, FAQ)
    Reviews: the 20 public reviews in reviews.md
    Who it's for: people who quit greens powders and pill stacks and
    want one habit that lasts. Their doubt: "A gummy can't hold enough
    to replace my powder."
    Product facts: the product table and the "fine to repeat" claims
    in the brand file. Never repeat the risky list.
    Photos: pouch front, daily pack in a hand.
    Length and speaker: about 40 seconds, voice-over, no customer
    on camera.
  output: |
    Built on: the buyer you named. In step 2, quitting powders comes
    from 6 people, all on the brand site, so it's "one channel", not a
    pattern. No review is marked as a verified buyer, so no quote
    appears in the paid ad.

    SCRIPT (42 seconds, voice-over, 117 of a 120 word budget)
    Belief shift: Now they believe a gummy can't hold enough to replace
    a powder. After this ad they believe one pack holds what they need.
    | Opening | "Most greens powders end up here, half a tub at the back of
      the cupboard." | Still half full | an unbranded tub pushed behind
      jars | the old way (brand file)
    | Doubt | "Can a gummy hold enough? Each pack has 60-plus ingredients,
      21 vitamins and minerals, and 6 grams of fiber." | 60+ ingredients,
      21 vitamins & minerals, 6g fiber | gummies in an open palm |
      fine-to-repeat claim
    (cut for length: the full script has 9 beats, each with its source)

    AD RULES CHECK  Verdict: Fix first. Main reason: a supplement ad
    needs 18+ targeting. Offer line: $29.99 needs the text sign-up; it
    is said and shown. Passed: claims (all from the fine-to-repeat
    list), third-party marks (the tub is unbranded).

    AVATAR CARD (approval 1)  A made-up adult, early 30s, plain grey
    T-shirt, seen from the chest down or from behind; no voice on
    camera, a separate narrator. Never claims to use the product.
    [approved]
    REFERENCE IMAGES  4 prompts, plain ground, even light. Picked: 2.
    SHEETS (approval 2)  Front, three-quarters, side, back, hands; the
    pouch from its photo, closed at its resealable top; the daily pack
    torn straight across its top only; a home kitchen, morning light
    from the left.  [approved]
    STORYBOARD (approval 3)  14 shots. 1 STOP 0-1.5 s | close-up,
    inside the cupboard | a hand pushes the tub behind a jar | "Most
    greens powders end up here,"  [approved]

    SHOT LIST, CLIP 1 (opening line, 15 words, 4.5 seconds)
    1 | 0.0 to 1.5 s | close-up | inside the cupboard, looking out |
      locked | A hand pushes a half-full unbranded tub behind a jar.
    2 | 1.5 to 3.0 s | extreme close-up | overhead | push in | A finger
      draws a line through dust on the tub's lid.
    3 | 3.0 to 4.5 s | medium | low, from counter height | hand-held |
      The adult swings the cupboard door shut.
    CLIP PROMPTS  [lock lines], then the three shots as timed lines.
    EDIT LIST  Hard cuts, captions in Work Sans, offer on the end card.
    (cut for length: clips 2 to 7)

    HAND-BACK SUMMARY
    Files: outputs/step-01 to step-07. Clips and shots: 7 clips, counted
    from the shot tables. Approvals: all three, from you.
    MISSING: your answers to the brand file's check-in; which countries
    the ad targets and where you ship; the landing page; grams of sugar.

tweaks:
  - what: The buyer
    how: Name one buyer, with what they want and what makes them doubt. A different buyer gets a different belief to shift and a different script from the same reviews.
  - what: Length and speaker
    how: Say "30 seconds, voice-over" or "15 seconds, founder to camera". A real founder gets a casting and wardrobe note and a real-camera shot list instead of an AI avatar.
  - what: Scripts you already run
    how: Paste the opening lines of your current video ads. The script will open differently and lean on a different proof, so you test something new.
  - what: An avatar you already have
    how: Give step 6 the approved avatar card and sheets from an earlier ad. It reuses them and goes straight to the storyboard.

judge:
  - The opening describes a moment your buyer lives through, not your product.
  - Every claim in the script appears in your product facts or approved claims, and every quote is word for word with its source.
  - The ad rules check ran before any image or clip was made, and names an exact place for each problem.
  - The run stopped for your yes on the avatar card, the sheets and the storyboard.
  - Each shot has one action you could make with your real product, and every cut changes both shot size and camera position.
  - The run ends with a summary of every file, the approvals and every MISSING line, with clip and shot counts taken from the tables.

test:
  - Run it for a product that already has a video ad that worked. Compare the top buying reason in step 2 with the one your winner used.
  - Check every customer quote in the script against the review it came from, word for word.
  - Run it without being there to approve. It should stop at the avatar card, write WAITING, and still hand back the summary.
  - Pick one shot from the shot list and ask whether you could make it with your real product and the approved avatar. If not, that shot needs rewriting.
  - Run step 2 twice on the same reviews. The top three reasons should come back in the same order.

improve:
  - In the builder, drop step 1 if you already have a brand file, and give your file to step 2 directly.
  - Save the approved avatar card, sheets and lock lines in your brand file, so the next ad starts at the storyboard.
  - "Tune step 3's skill: add your voice rules and your banned claims to its file, so every script starts inside them (for Sprout: \"supports\", never \"fix\")."
  - Swap step 7 for the clips skill of a style (clay, watercolor, selfie-style) when you want that look.
  - Pair it with a check for finished ads once the video is made, before you spend on it.

works_best_with:
  tools:
    - {name: "Claude", why: "Holds the brand file, every review number and seven steps of work in one run."}
    - {name: "Nano Banana", why: "Makes the reference images, sheets and storyboard frames from your product photos."}
    - {name: "Veo", why: "Starts a clip from an approved frame and follows timed shot lines inside one 8-second prompt."}
    - {name: "Meta Ads Manager", why: "Sets the 18+ age and countries the rules check asks for, and previews the ad in Reels and Stories."}
  inputs:
    - "Support emails, survey answers or call notes as well as reviews, so a reason can count as a pattern across more than one source"
    - "Which reviews come from verified buyers, so their words can be quoted in a paid ad"
    - "The opening lines of video ads you already run, so the new script opens differently"
    - "Photos of the product from every side and of the places it lives, so the product and set sheets are real"
    - "The speaker's age range, so the shot timings use the right speaking pace"

terms:
  - term: Brand file
    meaning: One folder with your facts, voice, offers and the claims you can make, so every AI step works from the same truth.
  - term: Avatar
    meaning: The made-up person, character or product that carries the ad. Never a real person, and never shown as a customer.
  - term: Storyboard
    meaning: One frame and one shot card per shot, approved before any clip is made.
  - term: Belief shift
    meaning: The one thing the buyer believes before the ad, and what they should believe after it.
