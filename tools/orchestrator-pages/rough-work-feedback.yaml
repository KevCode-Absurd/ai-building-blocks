new_slug: rough-work-feedback
name: Get honest notes on rough work and a fix plan
summary: Get honest feedback on rough work. Give it your draft and reviewers. You get problem notes, likely causes and a dated plan for the next version.
job: lead-people
thinking: high
thinking_why: It has to judge what sits behind each note and decide what to keep. Give it your strongest model.
headline: Get notes on your rough work that name the problem and leave the fix to you
subhead: Give it your work and the people who could review it. It plans a session where peers speak freely, sharpens the raw comments into problem notes, traces each problem to its cause, then boils it all down to a few headlines and a dated plan for the next version.
explain: |
  Feedback on early work usually comes in two bad shapes. It is polite and says nothing, or it is bossy and tells you what to do about a problem nobody has named. Either way you lose time. Early work is rough, and the people who can help most are peers who have faced the same problem and have no power over you.

  This workflow follows the way Ed Catmull describes feedback at Pixar. The group names problems and does not dictate fixes, and the owner decides. It plans a session that keeps rank out of the room. After you hold it, it turns raw comments into specific notes. It then asks where each problem really starts, since a problem often shows up far from its cause. It ends with three to five headlines and a date to look again.
when:
  - Your work is stuck or still rough and you want honest notes from people you trust.
  - The feedback you get is either polite or bossy.
  - You have a pile of comments and do not know where to start.
not_for:
  - "Your work is finished and needs sign-off or an expert check: ask a named expert or approver to review it instead."
  - "You want one person to edit your wording line by line: ask a single trusted reader for an editing pass instead."
  - "You have no reviewers and no comments yet: ask two or three peers to look at the work first, then come back."
you_give:
  - The work, or a description of it, and what is stuck
  - The people who could review it, with their roles and whether they have power over you
  - How long the session is and where it is held
  - After the session, every comment as it was said
you_get:
  - A session plan with who sits in the room, who stays quiet first and the rule for notes
  - Raw comments rewritten as specific problem notes, with fixes kept as examples only
  - Each problem traced to its likely cause, with notes that may name the wrong spot
  - Three to five headlines, what to blow up and keep, a choice sheet for you and the date of the next look
how_to_use:
  - "Download the pack. It holds HANDOFF.md and four skill files, in the order they run: Peer feedback session planner, Good note sharpener, Problem root cause tracer, then Revision headline planner."
  - Give the folder to Claude, in Claude Code or as files in a Claude Project, and say "Follow HANDOFF.md".
  - "Step 1: paste your work and the people who could review it. Then hold the review session and write down every comment."
  - "Step 2: paste all the comments, with who said each one. Steps 3 and 4 then run from the notes."
  - Read the headlines, then fill in the choice sheet yourself. The workflow never decides for you.
output_sample:
  input:
    - Your rough work, or a short description of it and where it is stuck
    - The people who could review it, with their roles
    - Every comment from the session, as it was said, and who said it
    - The date of your next look (optional)
  prerequisites:
    - An AI that can read your pasted text or files
    - A review session held by you between step 1 and step 2
  output:
    - name: "Step 1: The review session"
      contains: Who sits in the room, who speaks last, a timed plan, the note rule and a follow-up date.
    - name: "Step 2: Good notes"
      contains: Each raw comment rewritten as a problem note with its place, what the reader lost and who raised it.
    - name: "Step 3: Causes"
      contains: Each problem traced to its likely cause, with notes that may point at the wrong spot flagged.
    - name: "Step 4: The fix plan"
      contains: Three to five headlines, what to blow up, go back on and keep, and your choice sheet.
    - name: Hand-back summary
      contains: Each step's file, any step not run and every gap marked MISSING in one list.
how_it_works:
  - title: Plans a session peers can be honest in
    text: Picks reviewers with no power over you, keeps the most senior voices quiet at the start and sets the rule that notes name problems and not fixes.
  - title: Sharpens the comments
    text: Sorts each comment into problem, fix, order, feeling or comment on you, and rewrites it as a specific problem with its place.
  - title: Traces the cause
    text: Reads each spot on its own, looks earlier in the work and flags notes that may name the wrong symptom.
  - title: Headlines it
    text: Boils the notes down to a few headlines and asks what to blow up, what to go back on and what you still love.
  - title: Leaves the choice to you
    text: Gives you a sheet to mark Act, Test first or Decline, and sets the next review and a stuck test.
output_shape: |-
  STEP 1: THE REVIEW SESSION
    Reviewers and who is left out, with reasons | timed plan | note rule | note form | follow-up date

  (Pause: hold the session and write down every comment.)

  STEP 2: GOOD NOTES
    <n>. Problem | where | what the reader lost | raised by | example fix (marked)
    What works | not about the work | questions for reviewers

  STEP 3: CAUSES
    problem | spot alone holds or not | causes ranked | hold test | first check
    possible wrong symptom list

  STEP 4: THE FIX PLAN
    goal | headlines | blow up, go back on, love | your choice sheet
    first moves | next look | stuck test

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Who can review
    how: Name real roles. A reviewer who has faced the same problem and holds no power over you gives the best notes.
  - what: Showing the work
    how: Bring what exists now, not a polished version. Polish hides the problems the session is for.
  - what: How much time you have
    how: Say if the next look is in days or months. The review date and first moves scale to it.
  - what: Who leads the work
    how: Say if it is you or someone else. The stuck test names who to ask first.
judge:
  - No reviewer outranks the owner, and senior voices are held back at the start.
  - Every note is about the work and carries a place or a missing-place line.
  - Every fix is on its own line and marked as an example.
  - Each problem has a cause listed that sits earlier than the spot, or a reason none could.
  - The choice sheet is left for the owner to fill in.
test:
  - Run it on a draft where you already know the weak spot. See if the trace points near it.
  - Give step 2 a comment such as "just cut the middle". It should ask what problem made the reviewer say it.
  - Mark one headline Decline and check the plan still hangs together.
  - Hold a second session on the next version. The stuck test should say what changed.
improve:
  - Keep the choice sheets from each round. They show which kinds of note you tend to decline.
  - Rotate the reviewers so no one is always the critic.
  - Use the same note form each time so the group learns to write in it.
  - Run it again on the next version instead of starting from scratch.
