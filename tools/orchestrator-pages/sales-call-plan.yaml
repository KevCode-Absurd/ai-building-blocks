new_slug: sales-call-plan
name: Plan a sales conversation from first line to close
summary: Plan a sales conversation before you walk in. Give it your product and buyer. Get a lead argument, an opener, answers to doubts and a close.
job: sell-and-negotiate
thinking: high
thinking_why: It plans a live conversation and has to stay honest about proof. Give it your strongest model.
headline: Plan a sales conversation from first line to close
subhead: Give it your product and your buyer types. It picks the lead argument for each kind of buyer, writes a ten-second opener, and prepares an answer for every doubt. Then it writes closing questions that give the buyer two ways to say yes.
explain: |
  Most face to face and phone sales run on habit. The seller gives the same talk to everyone, opens with a line that starts a wall, and meets doubts with a speech. At the end, they ask a yes or no question, and "no" is the easy answer.

  The steps plan each part of the talk. First it picks which argument leads for each kind of buyer and what to ask first. Then it writes a ten-second opener as a short, honest question. It then writes an answer for each doubt that agrees where the buyer is right, restates it as a question and brings proof. Last, it turns the close into a choice of which or when. The order comes from Tested Direct Selling by Elmer Wheeler.
when:
  - You sell face to face or on calls and want the conversation planned before you walk in.
  - Buyers listen at the start and then say "I'll think about it", and you want closing questions that move them on.
  - You keep hearing the same doubts and want an answer ready for each, with proof.
not_for:
  - You sell online only, with no live talk. Write a page or email instead, or ask a person to review your sales page.
  - You need a full pitch deck or a written proposal. Use a document tool or write it yourself, then use this for the talk.
  - You have no product facts or offer yet. Write down your price, terms and options first, then come back.
you_give:
  - Your product or service facts, and your offer, price and options
  - The buyer types you meet (optional)
  - Where you can research a buyer before a call (optional)
  - The doubts buyers raise, or reviews and messages to find them in (optional)
  - Proof you have, such as results, numbers and testimonials (optional)
  - Where buyers stall and your current closing lines (optional)
you_get:
  - Every true argument you have, a lead argument and backup for each buyer type, and a first question for each
  - A ten-second opener of about ten words, with two spares and a short plan to test them
  - An answer sheet for every doubt, with a yes-question, an honest agreement and proof, and a list of doubts with no proof yet
  - Closing questions that offer two ways to say yes, the order to ask them in and the buying signals to listen for
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Describe your product, your offer and the buyers you meet. It plans the lead arguments and the opener.
  - Give it your real doubts, in the buyers' words if you can. It writes the answer sheet and the close.
  - Try the openers on real buyers and keep the one that gets you in.
output_sample:
  input:
    - Your product or service facts, and your offer, price and options
    - The buyer types you meet (optional)
    - The doubts buyers raise, or reviews and messages to find them in (optional)
    - Proof you have, such as results and testimonials (optional)
  prerequisites:
    - An AI that can read files (the steps are saved as files)
    - Your brand brain from the Website brand brain builder (optional)
    - Your offer from the Hidden offer finder (optional)
  output:
    - name: "Step 1: lead arguments"
      contains: Every true argument, a lead and backup for each buyer type, and a first question to ask each.
    - name: "Step 2: opener"
      contains: A ten-second opener of about ten words, two spare openers and a short plan to test them.
    - name: "Step 3: answers to doubts"
      contains: Each doubt as a yes-question, with an honest agreement, proof, and doubts that still have no proof.
    - name: "Step 4: close"
      contains: Closing questions with two ways to say yes, the order to ask them, and buying signals.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Match argument to buyer
    text: Lists every true argument you have and picks which one leads for each kind of buyer, with a first question to ask.
  - title: Write the opener
    text: Takes the angle library from step 1 and writes a ten-word opener as a short honest question, with two spares.
  - title: Answer the doubts
    text: Takes the angle library from step 1 and your own doubts and lists each one. It agrees where the buyer is right, restates it as a yes-question and brings proof.
  - title: Plan the close
    text: Takes your offer and the answers to doubts and turns each yes or no ask into a which or when question, with signals to listen for.
output_shape: |-
  STEP 1: LEAD ARGUMENTS
    Every true argument, with proof marked | lead and backup for each buyer type | first question for each | research list | honest reason for the visit

  STEP 2: OPENER
    Ten-word opener | two spares | test plan

  STEP 3: ANSWERS TO DOUBTS
    Each doubt by kind | yes-question, honest agreement and fact | proof and where it comes from | doubts still without proof

  STEP 4: CLOSE
    Closing questions with two ways to say yes | order to ask them in | buying signals and what to do on each | line for a buyer on the fence

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How well you describe each buyer type
    how: A named kind of buyer, such as the person who pays and the person who uses it, gets a different lead argument for each. A vague "customer" gets one.
  - what: Real doubts in the buyers' words
    how: Reviews, call notes and lost-deal notes give the real list. Without them it lists the likely doubts and says it guessed.
  - what: The choices you can offer
    how: List the real options, such as plan, start date and payment. The close can only offer choices that exist.
judge:
  - The opener is true, short and a question, with no trick or false reason to be there.
  - The lead argument changes with the buyer type.
  - Each answer agrees with what is true before it gives a fact.
  - Proof is something you can show, and doubts with no proof are listed.
  - The close offers real choices and is not pressure.
test:
  - Read the opener out loud. It should take about ten seconds or less.
  - Give it a doubt that you cannot answer well. It should say there is no proof yet and not invent one.
  - Role play with a colleague. Use the opener, one answer and one closing question, then note which part felt forced.
improve:
  - Save the lead arguments, answer sheet and close into your brand file, so every seller uses the same proof.
  - After each real call, add any new doubt and how it went, and run step 3 again.
  - Add the openers that worked and the ones that did not, so step 2 learns your tone.
