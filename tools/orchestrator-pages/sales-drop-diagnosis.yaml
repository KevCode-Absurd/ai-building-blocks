new_slug: sales-drop-diagnosis
name: Find why sales dropped and brief your next ads
summary: Find why your ad sales dropped. Give it two periods of ad results and get the cause, untried ideas, a test brief and headlines.
job: read-ad-results
thinking: high
thinking_why: It runs several skills in a row. Give it your strongest model.
headline: Find out why ad sales dropped and what to make to win them back
subhead: Give it your ad results for two periods and your brand file. It finds which part of your ad path got worse. Then it maps ideas you have not tried, writes a test brief and writes headlines.
explain: |-
  When cost per sale jumps, the usual move is to change the ad you can see. The cause is often somewhere else, such as broken tracking, a worn-out ad or a page that stopped converting.

  This workflow checks the counting first, then splits cost per sale into cost per view, click rate and buy rate and says which one moved. It then maps what your ads have not tried, briefs three ideas that fit what your numbers prove, and writes headlines with the one to test first.
when:
  - Your cost per sale rose and you do not know why.
  - You are about to change your ads on a guess.
  - You need a brief for your designer that rests on numbers.
not_for:
  - "You have no past results, such as a first launch: wait for data, or start with a plain plan for your first test ads."
  - "You have no brand file yet: build one first with the Brand profile builder, then come back."
  - "You only want the cause of the drop: use the Ad sales drop analyst."
you_give:
  - Your ad results export, one row per ad, for this period and the one before
  - Your brand file
  - Your target cost per sale (optional)
  - Your store's own revenue for the period (optional)
you_get:
  - The links in the chain that moved, with evidence for and against each reason
  - A ranked list of fixes with the condition for each
  - A map of what your ads have not tried, with the five biggest gaps
  - A test brief with three ideas aimed at different buyer doubts
  - Headlines for each idea, with the one to test first
how_to_use:
  - "Download the handoff pack. It's a zip with HANDOFF.md and the 4 skill files in the order they run: Ad sales drop analyst, Untried ad idea finder, Ad test brief writer and Ad headline writer."
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Have your inputs ready. Your ad results for two periods and your brand file are required. It works step by step and saves each result.
  - Check the drop report before you act on it. Read the headlines for health or result claims before any go live.
output_sample:
  input:
    - Your ad results export for this period, one row per ad
    - Your ad results export for the period before
    - Your brand file
    - Your target cost per sale (optional)
    - Your store's own revenue for the period (optional)
  prerequisites:
    - Your brand file, made with the Website brand brain builder
    - An AI that can read files, such as Claude with a project or Claude Code
  output:
    - name: outputs/step-01-ad-sales-drop-analyst.md
      contains: "The drop report: a counting check, which part of the ad path moved, reasons for and against, and ranked fixes."
    - name: outputs/step-02-untried-ad-idea-finder.md
      contains: A map of what your past ads have tried, with the five biggest gaps.
    - name: outputs/step-03-ad-test-brief-writer.md
      contains: A test brief with three ideas, each aimed at a different buyer doubt, with versions of each.
    - name: outputs/step-04-ad-headline-writer.md
      contains: Headlines for each idea, with the one to test first marked.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Finds why sales dropped
    text: Uses the sales drop analyst to recalculate rates, check tracking first, and split the change into its links.
  - title: Finds what you have not tried
    text: Uses the untried idea finder to map every past ad and rank the five biggest gaps.
  - title: Writes the test brief
    text: Uses the test brief skill to grade your evidence, choose the plan and write three versions per idea.
  - title: Writes the headlines
    text: Uses the headline skill to write one line per way in and mark the one to test first.
output_shape: |-
  DROP REPORT
    Counting check | Cost per sale = cost per 1,000 views / (1,000 x click rate x buy rate)
    Link that moved: <link> | Reasons for and against | Ranked fixes

  GAPS
    1 <gap> (<lens>) ... top 5

  TEST BRIEF
    Evidence | Plan | Idea <n>: doubt, answer, versions

  HEADLINES
    | Idea | Headline | Way in | Test first |

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
example:
  business: sprout
  input: |-
    [the handoff pack] Follow HANDOFF.md.

    Ad results: this month and last month, 9 ads. Practice numbers.
    Brand file: the Sprout brand file. Practice data. Target cost per sale: $30.
  output: |-
    STEP 1: DROP REPORT
    Counting check: browser and server purchases match within 3%.
    Cost per sale rose from $26.79 to $76.92 on ad P1.
    Link that moved: click rate fell from 1.50% to 0.92%; buy rate held. Likely cause: the ad wore out after 21 days (supported by falling click rate).
    Fix 1: replace P1's opening. Revisit after 7 days.

    STEP 2: GAPS
    1 Moment: the "I quit powders" story. No ad runs it.
    2 Opening: proof first. No ad opens on the survey.

    STEP 3: TEST BRIEF
    Evidence: measured. Plan: refresh, because P1 wore out.
    Idea 1: "The one I kept" | Doubt: "why switch?" | Answer: 80% of surveyed users take it daily (a claim on the practice brand file).

    STEP 4: HEADLINES
    | The greens you'll still be taking next month. | moment | test first |

    HAND-BACK SUMMARY
    Files: outputs/step-01 to step-04. MISSING: store revenue; who owns each fix.
tweaks:
  - what: Targets
    how: Give a target cost per sale or return on ad spend. The report then judges every ad against your line.
  - what: Two periods
    how: Add the previous period's export. Without it the report shows this period only and says so.
  - what: Formats you can make
    how: Say "image ads only" or "no people on camera". The brief stays inside what you can produce.
judge:
  - Every figure can be worked out from your export's totals.
  - Tracking is checked before any ad is blamed.
  - Each idea fills a different gap and answers a different buyer doubt.
  - No ad is called a winner without numbers.
test:
  - Recompute one cost per sale with a calculator from the same rows.
  - Check the link it says moved against your own click and purchase counts.
  - Run it twice. The top gaps should repeat.
improve:
  - Run it at the same point each month, so the brief never repeats an idea you tested.
  - Add a step that turns the best idea into image ads.
  - Save your target in your brand file so every run judges against it.
