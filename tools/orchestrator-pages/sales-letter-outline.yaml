new_slug: sales-letter-outline
name: Research your buyer and outline the sales letter
summary: Turn your product material into a sales letter outline. Get sorted buyer research, the one feeling to write to, and a plan with proof for each claim.
job: write-landing-page
thinking: high
thinking_why: It reads a lot of material and has to choose one theme and keep every claim tied to proof. Give it your strongest model.
headline: Research your buyer and outline the sales letter
subhead: Give it your product material, such as past promotions, emails, bonuses and customer words. It sorts the best passages into research files, then finds the strongest feeling your buyer already has. Last, it builds a full outline for a long sales page or letter, with the proof each claim needs.
explain: |
  Long sales pages fail before the first word is written. The writer skims the material, picks an angle that feels right and starts drafting. The headline is a guess, claims have no proof nearby, and the page speaks to the product when the buyer is thinking about something else.

  The steps do the research first and the outline second. It sorts your material into files for the people behind the product, the buyer's strongest emotions, and the passages that make the problem real. Then it names the one feeling, a fear or a desire, that is already there, and picks a main theme. Last, it plans the whole page before any copy is written. The order comes from The 7 Daily Habits of Successful Copywriters by Clayton Makepeace.
when:
  - You are about to write a long sales page or letter and want the research done first.
  - You have a lot of old promotions, emails and notes and no idea which parts are worth using.
  - Your page keeps leading with features and you want to start from what your buyer feels.
not_for:
  - "You have only a short product page and little else: use the Community evidence researcher to find real buyer words first."
  - "You already have your research and want the finished page: use the Proof-backed sales copy writer."
  - "You only want to know what your buyers worry about: use the Buyer problem list builder."
you_give:
  - Product material, such as issues, emails, bonuses and old promotions, with dates
  - Your brand file (optional)
  - Customer words, such as reviews, emails or call notes, with dates (optional)
  - A buyer persona or short description (optional)
  - Your price, contents, guarantee and proof
  - The goal for the piece, such as break-even or profit on each send (optional)
you_get:
  - Research files of the best passages, each with its source, an angle library of ranked reasons to buy, the top past hits and a short list of proof you can give away
  - The strongest feeling to write to, the events and words behind it, a main theme and the runner-up
  - A section-by-section outline, a pile of headline ideas, a table of claims with their proof, and three options for the headline, deck and lead-in
  - A brief another writer or AI can write the page from
how_to_use:
  - "Download the handoff pack. It's a zip with HANDOFF.md and the 3 skill files in the order they run: Copy research file builder, Dominant emotion finder and Sales letter outline planner."
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Share all the product material you have, newest first. It builds the research files.
  - Read the dominant feeling it picks. Leave it a day or two and talk it over with someone before you accept it as the theme.
  - Show the outline to someone outside the project before you start writing.
output_sample:
  input:
    - Your product material, such as old promotions, emails and bonuses, with dates
    - Your price, contents, guarantee and proof
    - Customer words, such as reviews or call notes (optional)
    - Your brand brain or a short buyer description (optional)
    - The goal for the piece, such as break-even on each send (optional)
  prerequisites:
    - An AI that can read pasted text or files
    - A brand brain from the Website brand brain builder (optional, makes the result better)
  output:
    - name: "Step 1: Copy research file builder"
      contains: Best passages sorted by purpose with their sources, the angle library, proof you can give away, and your top past hits.
    - name: "Step 2: Dominant emotion finder"
      contains: The one feeling to write to, the events and words behind it, a main theme and a runner-up.
    - name: "Step 3: Sales letter outline planner"
      contains: Sections of the letter, headline ideas, each claim with its proof, and three headline, deck and lead-in options.
    - name: Brief
      contains: A short brief another writer or AI can use to write the full page.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Build the research files
    text: Reads your material, copies the best passages into files by purpose, and lists proof you can give away and the top past hits.
  - title: Find the dominant feeling
    text: Takes the angle library from the step before, lists what the buyer has lived through lately, and names the one fear or desire that is already there.
  - title: Outline the letter
    text: Takes the angle library and the chosen theme, plans the whole piece before any copy, and matches each claim to the proof it needs.
output_shape: |-
  STEP 1: RESEARCH FILES
    Passages sorted by purpose, each with its source | value note and mini-ad for each bonus | proof you can give away | top past hits and why they worked

  STEP 2: THE FEELING TO WRITE TO
    The dominant emotion in one sentence, with events and words behind it | feeling-by-feeling table | proposed theme and runner-up | persona update

  STEP 3: LETTER OUTLINE
    Sections, each with the yes it must win | headline ideas | claims and their proof | three headline, deck and lead-in options | brief to write from

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How much material you give
    how: More past promotions, emails and customer words give it more real passages to sort. A short product page gives it little to work with.
  - what: Dates on your material
    how: Dates let it start with the newest and see which feelings are fresh. Undated notes can only be sorted by topic.
  - what: The goal for the piece
    how: Say whether you need to break even or make a profit on each send. The outline puts more effort into the headline and lead-in when the goal is tight.
judge:
  - Each passage in the research files has its source.
  - The dominant feeling is backed by events and words from your material, not a guess.
  - The outline plans the order of the whole piece before any copy is written.
  - Every claim in the outline has proof, or is flagged as lacking it.
  - It names the runner-up theme and why it lost.
test:
  - Give it past promotions where you already know the top hit. That hit should show up in the top past hits.
  - Check the dominant feeling against five customer comments. Most should fit it.
  - Give the outline to a writer who has not seen the research. They should be able to start a draft.
improve:
  - Save the research files and the chosen theme into your brand file, so every page and email starts from the same research.
  - After you write and test the page, add the result and what it showed, then rerun step 2 with that to see if the feeling still holds.
  - Add claims you cannot prove to your brand file, so the outline flags them first.
