new_slug: set-team-goals-run-one-on-ones-and-settle-decisions
name: Set team goals, run one-on-ones and settle decisions
summary: Describe your team and the quarter. Get goals with dated key results, a
  one-on-one plan and a way to settle disputes.
job: lead-people
thinking: high
thinking_why: It builds three linked plans for how a team runs. Give it your strongest model.
headline: Set team goals, run one-on-ones and settle decisions
subhead: Describe your team and the period you are planning for. It writes a few
  goals, each with dated results that show whether you got there. Then it plans
  your one-on-one meetings around those goals and sets up a way to settle a
  decision when people disagree.
explain: >
  A team without a system drifts. Goals live in someone's head, so people work
  on what is nearest. One-on-ones turn into status updates, or get cancelled
  when things are busy. Decisions wait until the loudest person wins or nobody
  does.


  This workflow builds the three parts together. It writes a few goals for a
  short period, with key results that can be marked done or not done with no
  argument. It then plans one-on-ones around those goals, so each person's
  meeting ties to the team's aim. Last, it names one owner for a contested
  decision, collects the strongest case against it, and sets a date. The system
  comes from Andy Grove's book High Output Management.
when:
  - You manage a team and each person is working on something different, with no
    shared goal to pull it together.
  - Your one-on-ones are dull, rushed or skipped, and you suspect they should do
    more.
  - Two people disagree on a decision and it has been stuck for days.
you_give:
  - "Your team: who is on it, what they do and how experienced they are"
  - What you want to get done in the period (a quarter or a month)
  - A current plan or list of priorities (optional)
  - The decision that is stuck, if there is one
you_get:
  - A few goals, each with key results that have a number and a date
  - "A one-on-one plan: how often to meet each person, how long, an agenda they
    write, and how to follow up"
  - "A decision plan: one named owner, who to hear from, the strongest case
    against, a date and what everyone does after the call"
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file
    this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project)
    and say "Follow HANDOFF.md".
  - Describe your team and the period. Add the stuck decision if you have one.
  - It works step by step and saves each result. Check the key results first,
    since the other two steps use them.
  - Share the goals with the team before you run the first one-on-one.
how_it_works:
  - title: Write goals and key results
    text: Turns what you want into a few short goals for the period. Gives each one
      dated key results that can be marked done or not done.
  - title: Plan the one-on-ones
    text: Uses the goals to set how often to meet each person, how long, and what
      they bring. Adds a follow-up routine so actions get checked.
  - title: Settle the decision
    text: Takes the goals and your stuck decision. Names one owner, collects the
      best case against, sets a date and says what everyone does after the call.
output_shape: >-
  STEP 1: GOALS AND KEY RESULTS
    Period: <quarter or month>
    Goal: <short sentence>
      Key results: <number> by <date>
      Each person's link: <how their goals feed this one>

  STEP 2: ONE-ON-ONE PLAN
    Per person: <how often | how long | where>
    Their agenda: <what they bring: numbers, worries, what happened>
    Follow-up: <hold file for later items, actions checked next time>

  STEP 3: DECISION PLAN
    Decision: <what is being decided>
    Owner: <one name> | decides on <date>
    Hear from: <who knows most and who disagrees> | <their strongest case against>
    After the call: <disagree out loud, then commit>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: The length of the period
    how: A quarter suits most teams. A month gives faster feedback if your work
      changes quickly.
  - what: How experienced each person is
    how: Say how long each has done their current task. New hands need weekly
      meetings. Experienced ones can meet less often.
  - what: How many goals you allow
    how: Say how many you can take on. Fewer goals give clearer key results and a
      firmer no to everything else.
judge:
  - Every key result has a number and a date, and two people would agree on
    whether it is done.
  - There are only a few goals, not one for every task.
  - Each person's meeting plan ties back to a goal.
  - The decision has exactly one owner and a date.
  - Nothing in the plan invents facts about your team or your numbers.
test:
  - Give it a goal you already know is vague. The key results should make it
    measurable.
  - Run the one-on-one plan for two people with very different experience. Their
    meeting rhythm should differ.
  - Use the decision plan on a real disagreement and see whether people accept
    the call once it is made.
improve:
  - Keep a standing outline for each one-on-one and a hold file, and update them
    each week.
  - At the end of the period, mark each key result done or not done, then run
    step 1 again for the next one.
  - Add the questions you find most useful in one-on-ones to the planner, so
    they appear every time.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Holds your team notes and writes all three plans in one run.
    - name: A shared document
      why: Gives each person somewhere to write their one-on-one agenda.
  inputs:
    - Last period's results
    - A short note on how each person is doing
    - The goals of the team above you
terms:
  - term: Key result
    meaning: A measurable outcome with a number and a date that shows whether a goal
      was met.
  - term: One-on-one
    meaning: A regular private meeting between a manager and one person on their team.
  - term: Informed captain
    meaning: One named person who makes the final call on a decision after hearing
      from everyone who knows the subject.
