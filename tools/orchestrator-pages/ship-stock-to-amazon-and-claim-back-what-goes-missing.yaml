new_slug: ship-stock-to-amazon-and-claim-back-what-goes-missing
name: Ship stock to Amazon and claim back what goes missing
summary: Plan your Amazon shipment to FBA, then find lost or short units Amazon owes you. Give it sales and product facts. Get claims to file.
job: sell-on-amazon
thinking: medium
thinking_why: It runs two skills with a wait between them. A mid-size model is enough.
headline: Send stock to Amazon with proof kept, then claim back what Amazon loses
subhead: Give it your sales and product facts. It sizes the order, splits the shipment and checks barcodes, labels and limits. After the shipments close, it compares what you sent with what Amazon received and lists the claims worth filing.
explain: |
  Sellers lose money at both ends of an Amazon shipment. Before it, a wrong label or a bad barcode can stop sales for weeks. After it, Amazon can receive 400 units of the 405 you sent, put a product in the wrong fee tier or lose a box, and nobody notices because nobody kept the proof. Late claims often are not paid.

  The steps cover both ends. First it sizes your first order from sales and lead time, splits the shipment so one lost box does not stop sales, and gives a checklist that includes the proof to keep: receipts, packing list and bill of lading. You then ship, track each shipment to closed and export the shipment, fee, damaged and lost reports. The second step reads your checklist and those reports, compares sent against received, checks size tiers and fee lines, and lists the claims to file with a score for how much it could check.
when:
  - You are about to send your first or next shipment to Amazon.
  - Your shipments have closed and you have never checked what Amazon received.
  - You think fees or size tiers are wrong but have not checked.
not_for:
  - "You have no sales yet and no closed shipments: plan by hand with Amazon's own shipment tool, and come back once shipments close."
  - "You only want to check fees or lost stock on old shipments: skip step 1 and give the reports straight to your AI, or ask Amazon seller support."
  - "You sell on Shopify or eBay, not Amazon: use your own platform's stock report and your carrier's claim form."
you_give:
  - Your sales so far, lead times and case sizes
  - "Product facts: size, weight, cost and barcode setup"
  - Shipment, fee, damaged and lost reports, once shipments close
  - Your shipment receipts and packing lists
you_get:
  - How many units to send, when, and in how many shipments
  - A shipment checklist for barcodes, prep, case limits, labels and carrier
  - A list of claims to file for short shipments, wrong fee tiers, and damaged or lost stock
  - A score for how much of the check could be run, and a monthly routine
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, in Claude Code or as files in a Claude Project. Say "Follow HANDOFF.md".
  - Paste your sales, lead times, case sizes and product facts. Check Amazon's current fee tables before you commit cash.
  - When it pauses, ship your stock and keep the receipts, packing list and bill of lading. Wait until the shipments close.
  - Export the shipment, fee, damaged and lost reports. Give them to your AI to get the claim list.
  - Check each claim against your proof before you file it with Amazon.
output_sample:
  input:
    - Your sales so far, lead times and case sizes
    - "Product facts: size, weight, cost and barcode setup"
    - Shipment, fee, damaged and lost reports, once shipments close
    - Your shipment receipts and packing lists (optional for step 1, needed for step 2)
  prerequisites:
    - Step 2 needs your shipments to be closed first.
    - Reports exported from your Amazon seller account.
  output:
    - name: "Step 1: Shipment plan"
      contains: How many units to send, when, and how to split them into shipments.
    - name: Shipment checklist
      contains: Barcode, prep, case limit, label and carrier checks, plus the proof to keep.
    - name: "Step 2: Sent vs received"
      contains: A comparison of units you sent with units Amazon received, shipment by shipment.
    - name: Size tier and fee check
      contains: Whether each product sits in the right size tier and whether fee lines look right.
    - name: Damaged, lost and returns check
      contains: Stock Amazon damaged, lost or failed to return that may be paid back.
    - name: Claim list
      contains: Each claim to file with the proof to attach, and a score for how much could be checked.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, steps not run and why, and every MISSING line in one list.
how_it_works:
  - title: Plan the shipment
    text: Sizes the first order at three to six months of sales, splits the shipment, allows for slow check-in and checks barcodes, prep, case limits and box labels. Lists the proof to keep.
  - title: Pause and ship
    text: You ship, track each shipment to closed, keep every receipt, the packing list and the bill of lading, then export the shipment, fee, damaged and lost reports.
  - title: Find what Amazon owes you
    text: Takes your checklist and the reports. Compares units sent with units received, checks size tiers and fee lines, damaged and lost stock and returns, and lists the claims to file with the proof for each.
output_shape: |-
  STEP 1: SHIPMENT PLAN
    Order size | shipment split | checklist | proof to keep | storage notes

  PAUSE: ship, wait for shipments to close, export reports

  STEP 2: CLAIMS
    Sent vs received | size tier check | fee lines | damaged and lost | returns | claim list | score

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Your marketplace
    how: Say US, UK or other. Case limits, fees and check-in times differ.
  - what: Your account plan
    how: Say individual or professional. It changes unit caps and what you can claim.
  - what: Maker lead time and capacity
    how: Give the units per month they can make, not only the minimum. Step 1 sizes the order against it.
  - what: Months of reports
    how: Give as many closed months as you have. Late claims may not be paid, so check older ones first.
judge:
  - "The order size shows its working: monthly sales, lead time and months of cover."
  - The checklist names the proof to keep for each shipment.
  - Every claim has the shipment, the units and the proof attached.
  - Any fee table, limit or window is marked as needing a check against Amazon's current page.
  - The score says how much could be checked, not how much money is owed.
test:
  - Pick one closed shipment. Compare sent and received by hand and match it to the claim list.
  - Check one product's size tier against its real box dimensions and weight.
  - Make sure every claimed shipment has a receipt and packing list on file.
improve:
  - Run the claim check once a month and log each claim as filed, paid or rejected, with the reason.
  - Split future shipments a few days apart so one lost box does not stop sales.
  - Keep a folder per shipment with its proof from the day you send it.
