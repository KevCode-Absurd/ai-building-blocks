new_slug: size-a-market-and-separate-facts-from-guesses
name: Size a market and separate the facts from the guesses
summary: Size a market from the bottom up and see which numbers are facts and which are guesses. You get an estimate range and a report with every number labelled.
job: research-topics
thinking: high
thinking_why: It builds numbers from sources and must say which are findings and which are guesses. Give it your strongest model.
headline: Size a market and separate the facts from the guesses
subhead: Give it the market and who you would sell to. It builds a market size estimate from the bottom up, looks for the public facts behind each input, and sorts every input into fact or guess. You get a report where each number says which it is.
explain: |
  Market size numbers are mostly made up and passed on. A deck says the market is $12 billion, the source is another deck, and the number that matters, how many people would actually buy this, was never worked out. This workflow builds a bottom-up market size estimate you can defend and argue with.

  Step 1 starts from the people or businesses who have the problem, how many of them could buy, and what they would pay. Every input is shown. Step 2 looks for public facts behind each input, such as census data, trade statistics and company filings, and notes the source and date. If it finds nothing, it says so. Step 3 sorts each input into a finding (with its source) or a guess (with its reasoning), in the way Newton and Darwin kept what they saw apart from what they inferred. It ranks the guesses by how much each one moves the total. Step 4 writes the report with a range instead of one figure.

  Step 2 needs web or database access. Without it, the AI lists where to look and marks each gap, rather than making up a figure. The result is only as good as your inputs, and the sizes are estimates, not forecasts.
when:
  - You are writing a plan or a deck and need a market size that holds up to questions.
  - Two sources give you numbers a factor of five apart.
  - An investor or buyer asks where a market size figure came from.
  - You want to know which inputs to test first, because they are guesses.
not_for:
  - You cannot yet say who would buy. Use the Pick a market worth selling to and its price workflow first, then come back.
  - You want to know whether your idea can win its market, not how large it is. Use the Test if your idea can own its market workflow.
  - A source you trust already sized the market and you only need it written up. Use the Market research report writer.
  - You need survey sample sizes or a plan to test the guesses. Use the Market size and survey planner.
you_give:
  - The market and who you would sell to, in one or two sentences
  - What you already know or believe about its size
  - Your price, or an idea of it
  - The country or area you care about (optional)
  - Your own data, such as sales or survey results, or a report you already have (optional)
you_get:
  - A bottom-up size estimate with every input shown and the working behind it
  - The public facts found for each input, with source and date, or a line saying none was found
  - Each input marked finding or guess, with the guesses ranked by how much they move the total
  - A market report with a range, every number labelled and the first guess to test
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to your AI, such as Claude, and say "Follow HANDOFF.md". Use one that can browse the web, or tell it step 2 will be a list of where to look.
  - Paste the market, who you would sell to and your price. Add any sales or survey data you have.
  - After step 1, check that every input has a number and a reason. After step 2, open one source yourself to check it says what the AI says it does.
  - Read the findings and guesses split. Test the top guess first, and update the report when it becomes a finding.
how_it_works:
  - title: Estimate from the bottom up
    text: "Builds the market size from who has the problem, how many could buy and what they would pay, with every input and assumption shown. Hands step 2 the list of inputs."
  - title: Find the public facts
    text: "Looks for public data for each input, such as census, trade statistics and filings, and records the source and date. Says so when nothing is found. Hands step 3 the facts."
  - title: Separate findings from guesses
    text: "Marks each input as a finding with its source or a guess with its reasoning, and ranks the guesses by how much they move the total. Hands step 4 the split."
  - title: Write the report
    text: "Writes the report with every number labelled, a range instead of one figure, and the guess to test first."
output_shape: |-
  STEP 1: ESTIMATE
    Who has the problem: <n> (how: <...>) | Could buy: <n> | Would pay: <...> | Size: <range>

  STEP 2: PUBLIC FACTS
    <input>: <fact> (source: <...>, <date>) | No public data found: <input>

  STEP 3: FINDINGS AND GUESSES
    <input>: <finding / guess> | Basis: <...> | Moves the total by: <...>
    Test first: <guess>

  STEP 4: REPORT
    Size: <range> | Facts: <...> | Guesses: <...> | Test next: <...>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list> | CHECKS MISSED: <...>
output_sample:
  input:
    - The market and who you would sell to
    - Your price or an idea of it
    - What you believe about its size, and any sales or survey data you have (optional)
    - The country or area (optional)
  prerequisites:
    - "An AI that can read files and browse the web for step 2 (optional: without it, step 2 lists where to look)"
  output:
    - name: Estimate
      contains: Who has the problem, how many could buy and what they would pay, with the size as a range.
    - name: Public facts
      contains: The public data found for each input, with source and date, and the inputs with none.
    - name: Findings and guesses
      contains: Each input marked finding or guess, ranked by how much it moves the total.
    - name: Market report
      contains: The range, every number labelled fact or guess, and the first guess to test.
    - name: Hand-back summary
      contains: Each saved file, every MISSING line and the checks that could not run.
example:
  business: sprout
  input: |
    [the workflow]
    Sprout, a daily greens gummy brand. We want to size the US market for a kids' daily greens gummy sold to parents, before we commit to a kids 12-pack for big-box stores.
    Who we'd sell to: parents of children aged 2 to 13 who already buy a children's vitamin or gummy.
    What I believe: a lot of US households have kids in that range; some share buys a children's supplement; our kids pouch sells at $53.32 one-time or $24.99 on a first order, and the 12-pack would retail around $14.97.
    Data I have: our own kids line is about 15% of our site sales; in one retailer, kids 12-packs sold at about a third the rate of adult packs.
    I don't want a headline number from a market report. I want to know which of my inputs are facts and which are hopes.
  output: pending
tweaks:
  - what: Who has the problem
    how: Define them tightly. The whole estimate hangs on this count.
  - what: Your own data
    how: Bring sales, conversion or survey numbers. They turn guesses into findings.
  - what: The region
    how: Say the country or area. Public data is found per region.
  - what: The reader
    how: Say if this goes to investors or your team. The report's range and labels are the same, but the length changes.
judge:
  - Every input of the estimate is shown, with how it was reached.
  - Each public fact has a source and a date.
  - Every input is marked finding or guess, and the guesses are ranked by how much they move the total.
  - The report gives a range, not one number.
  - The report says which guess to test first.
test:
  - Give it a market where no public data exists. Step 2 should say so rather than invent a figure.
  - Give it a headline market size from a deck. Step 3 should mark it as a guess until its basis is found.
  - Run step 1 twice. The structure of the estimate should match.
  - Change one guess by half and check the report's range moves as step 3 predicted.
improve:
  - Save the public sources you found per region and reuse them.
  - When a guess becomes a finding, update the estimate and keep the old version.
  - Add your own sales data file once, so step 3 has findings from the start.
  - Pair it with "Pick a market worth selling to and its price" once the size is known.
works_best_with:
  tools:
    - name: A chat AI that can browse the web
      why: Step 2 looks up public data. Without browsing it lists where to look and marks each gap.
    - name: Official statistics sites
      why: Census, trade and health statistics are the facts behind the inputs.
    - name: A spreadsheet
      why: Holds the estimate so you can change an input and see the range move.
  inputs:
    - Your own sales or survey data
    - Industry reports you have, with their methods
    - Competitor filings or public numbers
terms:
  - term: Bottom-up estimate
    meaning: A market size built from the number of buyers and what they pay, instead of taken from a headline figure.
  - term: Finding
    meaning: A number that has a named source and a date.
  - term: Guess
    meaning: A number with no source yet, kept with the reasoning behind it so you can test it.
