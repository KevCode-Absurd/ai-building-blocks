new_slug: size-up-a-rival-and-decide-whether-to-go
name: Size up a rival and decide whether to go
summary: Describe your plan and a rival. Get a five-factor matchup, where to
  fight and avoid, and a go or no-go check.
job: study-competitors
thinking: high
thinking_why: It has to weigh both sides honestly and then test your plan
  against that. Give it your strongest model.
headline: Size up a rival and decide whether to go
subhead: Describe your plan and the rival you are facing. It sets you side by
  side on five factors, ranks your options and shows where the rival is thin.
  Then it tests your plan for common mistakes and gives a go or no-go answer.
explain: >
  Most people pick a fight with a rival because the rival looks beatable on one
  measure, such as price or size. They move before they have looked at the
  people, the timing, the ground and the cost of a long contest. Or they never
  move, because every rival looks too big.


  This workflow compares you and the rival on the same five factors, so the
  comparison is fair. It ranks your options, from breaking their plan to
  avoiding them, and finds where they are thin or unready. Then it checks your
  plan against six common faults and three checks that you are ready, the rival
  is open and the ground allows it. It ends in go or no-go. The method comes
  from Sun Tzu's The Art of War, an old book on competing that still applies to
  business.
when:
  - You are about to launch a product or offer into a market where a stronger
    rival already sells.
  - A rival has just cut prices or copied your best idea and you need to decide
    how to answer.
  - You are choosing between going head to head with a rival and finding a
    corner they ignore.
you_give:
  - Your plan or move, in a few sentences
  - "What you know about the rival: who they are, how they sell, their strengths
    and weak spots"
  - "Your own situation: team, budget and timing"
  - Other rivals in the market (optional)
you_get:
  - A side-by-side of you and the rival on five factors, with the reason for each
  - A ranked list of your options, with where to fight and where to stay away
  - A go or no-go answer, with the faults and checks it rests on
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file
    this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project)
    and say "Follow HANDOFF.md".
  - Describe your plan, your side and the rival. Be honest about your weak spots.
  - It works step by step and saves each result. Read the matchup before the go
    or no-go.
  - If the answer is no-go, use the "opening to wait for" in step 1 to decide
    when to look again.
how_it_works:
  - title: Score the matchup
    text: Scores you and the rival on five factors, ranks your options and finds
      where the rival is thin. Prices the cost and length of a long fight.
  - title: Check the plan
    text: Takes the matchup and your plan and checks it for six common faults. Then
      checks that your team is ready, the rival is open and the ground allows
      it. Ends with go or no-go.
output_shape: >-
  STEP 1: RIVAL MATCHUP
    Five factors: <factor | you | rival | edge>
    Options ranked: <break their plan / cut their allies / head on / avoid> | <why>
    Where they are thin: <weak or unready spots>
    Cost of a long fight: <money and time>
    Position to hold first: <what you can defend> | Opening to wait for: <...>

  STEP 2: GO OR NO-GO
    Six faults: <fault | clear or at risk | why>
    Three checks: <team ready | rival open | ground allows>
    CALL: <go / no-go>, because <reasons>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How honestly you describe your own side
    how: Say what is weak about your team, cash and timing. A flattering picture of
      you gives a flattering matchup.
  - what: What you know about the rival
    how: Give facts you can point to, such as their prices, reviews and job ads.
      Mark guesses as guesses.
  - what: The move you plan
    how: Say the exact move, such as a launch on a set date. A vague plan can't be
      checked for faults.
judge:
  - Both sides are scored on the same five factors with a reason for each.
  - The options are ranked, and the top one fits the facts you gave.
  - Every fault in the check is marked clear or at risk with a reason.
  - The call is clear, and a no-go says what would change it.
  - Nothing about the rival is invented. Gaps are listed as missing.
test:
  - Run it on a past rivalry whose outcome you know. See whether the matchup
    would have pointed the right way.
  - Run it twice with the same facts. The call should be the same.
  - Swap in a weaker version of your plan. The call should move toward no-go.
improve:
  - Keep one rival file per competitor and update it after each run, so you can
    see how they change.
  - Add the one rival move that worries you most to the plan input, and run the
    check again.
  - Pair it with a swipe board of the rival's ads to give step 1 more facts.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Weighs both sides and runs both checks in one conversation.
    - name: Meta Ad Library
      why: Shows the rival's live ads for free, a good source of facts about how they
        sell.
  inputs:
    - The rival's pricing page and reviews
    - Their job ads, which show where they are growing
    - Your own recent results
terms:
  - term: Five factors
    meaning: The people behind the leader, timing, ground, leadership and
      discipline. Each is scored for both sides.
