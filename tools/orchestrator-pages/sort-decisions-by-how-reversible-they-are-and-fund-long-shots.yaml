new_slug: sort-decisions-by-how-reversible-they-are-and-fund-long-shots
name: Sort reversible decisions and plan small bets
summary: Paste a choice you are stuck on. Get it sorted by reversibility, a
  capped long-shot test and a keep-or-cut review.
job: plan-strategy
thinking: high
thinking_why: It sorts decisions, sets limits on a risky bet and judges results
  later. Give it your strongest model.
headline: Sort reversible decisions and plan small bets
subhead: Paste a choice you are stuck on. It decides whether you can undo it,
  and matches how slowly you should decide to the answer. For a risky bet it
  plans a small test with a loss cap. After the test, it reviews each program
  and marks it keep, cut or double down.
explain: >
  Teams tend to treat every decision as if it were permanent. They slow down on
  choices they could reverse next week, and they rush the few they cannot. Long
  shots get either no money or too much, because nobody set the most they could
  lose or what would count as learning.


  This workflow sorts the choice first: a one-way door you can't walk back
  through, or a two-way door you can. Two-way choices go to one owner, fast.
  One-way choices get a slower look at what you still need to know. For a long
  shot it sets a small team, a cap on losses and what you learn if it fails. You
  then run the test yourself. The last step reviews each program on cash and
  customer signals. The ideas come from Jeff Bezos's letters to shareholders.
when:
  - You are stuck on a choice and can't tell whether it needs a week of debate
    or an hour.
  - You have an idea with a low chance and a big payoff, and you want to try it
    without risking the business.
  - You run several programs, such as channels or products, and need to decide
    which to keep, cut or push.
you_give:
  - The choice you are stuck on, and who it touches
  - A bet you want to try, with what a big win would look like
  - A sheet of what each of your programs cost and what it returned, for the
    last step
  - Time to run the small test and track its cost and results
you_get:
  - A sort of the choice as a one-way or two-way door, with the process that
    fits it
  - "A long-shot plan: the small test, the most you can lose, one owner and a
    rule for dropping it"
  - A review of each program, marked keep, cut or double down, with the reason
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file
    this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project)
    and say "Follow HANDOFF.md".
  - Paste the choice you are stuck on. It sorts it and plans the long-shot test.
  - It stops after the plan. Run the small test and write down its cost and
    results.
  - Bring the results and your program numbers back and say "carry on from step
    3".
how_it_works:
  - title: Sort the decision
    text: States the choice and asks what would be hard to undo. Sorts it as a
      one-way or two-way door and picks the process that fits.
  - title: Plan the long shot
    text: Takes the sorted choice and plans a small test. Sets the odds, the payoff,
      the most you can lose and what counts as learning if it fails.
  - title: Review each program
    text: After your test, lists each program with its cost and return. Checks
      customer signals before the numbers, and marks each keep, cut or double
      down.
output_shape: |-
  STEP 1: DECISION SORT
    Choice: <what is being decided, who it touches>
    Door: <one-way / two-way>, because <what is hard to undo>
    Process: <owner and fast / wide and slow> | Review date: <...>
    Still needed before going through: <for one-way>

  STEP 2: LONG-SHOT PLAN
    Bet: <what it is, what a big win looks like>
    Odds and payoff: <honest estimate>
    Most you can lose: <a cap you can carry on after>
    Team and time: <one owner, short build>
    Counts as learning: <what you learn if it fails>

  (you run the small test)

  STEP 3: KEEP-OR-CUT REVIEW
    Per program: <cost | return | customer signals | keep / cut / double down>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: What the choice would cost to undo
    how: Give a number or a time, such as a month of rework. It lets the sort be
      exact instead of a guess.
  - what: The loss cap
    how: Tell it the most you can afford to lose and still carry on. The test is
      sized to fit under it.
  - what: Customer signals
    how: Add repeat purchases, referrals and complaints for each program. They
      matter more than the figures on paper.
judge:
  - The sort names what makes the choice hard or easy to undo.
  - A two-way choice has one owner and a review date. A one-way choice lists
    what is still unknown.
  - The long shot has a loss cap, a short build time and a stated rule for what
    counts as learning.
  - The odds are honest, not a hopeful guess.
  - Every program in the review has a decision and a reason, and cash comes
    before how it looks on paper.
test:
  - Give it a past decision you regret. See whether the sort would have told you
    to go slower or faster.
  - Plan a long shot with a loss cap that is too high for you. Check that it
    flags the cap.
  - Run the review on two programs, one that clearly works and one that doesn't.
    The marks should match what you know.
improve:
  - Keep a log of each decision, its door type and what happened, and check your
    sorting after a few months.
  - Add your own loss cap and a standard review date to the file you give it.
  - Set a regular date to run the keep-or-cut review so weak programs don't run
    on by default.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Holds the choice, the plan and your results across the pause.
    - name: A spreadsheet
      why: Tracks the cost and results of the small test and each program.
  inputs:
    - Cost and return for each program
    - Repeat purchase and referral numbers
    - A note of who would object to the choice
terms:
  - term: One-way door
    meaning: A choice that is hard or costly to undo, so it deserves a slower, wider
      look.
  - term: Two-way door
    meaning: A choice you can reverse at low cost, so one owner can make it quickly.
