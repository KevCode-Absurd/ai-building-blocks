new_slug: story-idea-test
name: "Test a story idea and make every scene turn"
summary: "Test your story idea before you write it. Get a go, rework or drop verdict, each scene checked for what changes, and a voice-over line test."
job: write-and-tell-stories
thinking: high
thinking_why: "It judges whether a story holds together, scene by scene. Give it your strongest model."

headline: "A story that holds together, with no scene that fails to turn"
subhead: "Paste your story idea. It states the idea the story proves, names the idea that argues back, and gives a go, rework or drop verdict. It then marks what changes in each scene and flags those where nothing does. After you write the script, it tests every voice-over line."

explain: |
  A story can have good scenes and still go nowhere. The usual causes are an idea that runs out halfway, scenes where nothing changes, and a narrator who explains what the pictures should already show. The writer is too close to see any of these.

  This workflow tests the story from the top down. It first checks whether the central idea is strong enough to carry the whole story and what argues against it. Then it goes through the scenes in order, writes down what changes in each and which choice causes it, and flags the scenes where nothing turns. You then write the script. The last step removes the voice-over and judges whether the story still works, so only lines that add meaning stay. The method comes from Robert McKee's story seminars.

when:
  - You are writing a short film, an ad, a novel or a customer story and aren't sure the idea is strong enough to carry it.
  - A draft reads flat, with scenes that feel like they could be cut, and you can't say why.
  - Your video relies on a narrator to explain what is happening, and you want to know which lines it really needs.
not_for:
  - "You want to check an ad for Meta rules: use the Meta ads compliance checker, which looks at ad policy, not story."
  - "You only want to know if a short idea has a strong core: use the Story premise tester on its own."
  - "You want notes from real readers sorted into themes: use the Reader feedback sorter."

you_give:
  - Your story idea in a few sentences, and who it is for
  - Your scene list in order, one line per scene
  - Your script or draft written from the scenes
  - Your medium, such as an ad, short film or case study (optional)

you_get:
  - A verdict on the idea (go, rework or drop), with the idea the story proves, the idea that argues back and the main turns
  - Your scenes in order, each marked for what changes and which choice causes it, with weak scenes flagged and a fix for each
  - A verdict on each voice-over line, and a version of the script with the telling lines cut or turned into scenes

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your story idea. It tests the idea and then asks for your scene list.
  - It stops after the scene check. Write the script from the scene list, fixing the flagged scenes first.
  - Bring the script back and say "carry on from step 3".
output_sample:
  input:
    - Your story idea in a few sentences, and who it is for
    - Your scene list, in order, for the second step
    - Your script or draft, for the last step
  prerequisites:
    - An AI chat that can keep your idea, scene list and script in one conversation
    - Time to write the script between step 2 and step 3
  output:
    - name: Story premise test
      contains: The idea the story proves, the idea that argues back, and a go, rework or drop verdict.
    - name: Scene turn check
      contains: Each scene marked for what changes and which choice causes it, with weak scenes flagged.
    - name: Voice-over stripping test
      contains: "A verdict on each narration line: does the story work without it, or does the line add something new."
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.

how_it_works:
  - title: Test the idea
    text: "Puts the story in one sentence, names the idea it proves and the idea that argues back. Checks the idea can grow to the end and gives a verdict."
  - title: Check each scene turns
    text: "Goes through your scenes in order using the idea from step 1. Writes down what changes in each scene, which choice causes it and what it costs the character."
  - title: Strip the voice-over
    text: "Takes the script you wrote from the scene list, reads the scene list for what each scene should do, and removes all narration. Judges whether the story still works, then sorts each line as telling or adding something new."

output_shape: |-
  STEP 1: IDEA TEST
    Story in one sentence: <...>
    Idea it proves: <...> | Idea that argues back: <...>
    Can it grow to the end: <yes / no, why>
    Main turns: <in order>
    Original or recycled: <where, and what would make it fresh>
    VERDICT: <go / rework / drop>

  STEP 2: SCENE CHECK
    Scene: <number | what changes | the choice that changes it | cost to the character>
    Flagged: <scenes where nothing turns | cut / merge / sharper turn>
    Set-ups without pay-offs: <...>

  (you write the script)

  STEP 3: VOICE-OVER TEST
    Without narration: <does the story still work>
    Each line: <telling (cut or dramatise) / adds something new (keep)>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: Your idea in one sentence
    how: Write it before you run the workflow. If you can't, the idea may not be ready, and step 1 will say so.
  - what: The scene list
    how: List scenes in order, one line each. A missing scene means a missing check.
  - what: Your medium
    how: Say if it is an ad, a short film or a case study. Voice-over is normal in some forms and costly in others.

judge:
  - The idea is stated as a sentence that can be argued with, not a theme word.
  - The idea that argues back is a real opposing view and not a weaker copy of the first.
  - Every scene has a change, a choice and a cost, or is flagged.
  - Flagged scenes come with a fix, such as a cut or a sharper turn.
  - Each voice-over line is sorted, and the story is judged with all narration removed.

test:
  - Run it on a story you know is weak. The weak scenes you suspect should be flagged.
  - Take a voice-over line you love. See whether the test keeps it, and whether the reason is fair.
  - Run step 1 twice on the same idea. The verdict should agree even if the wording differs.

improve:
  - Keep a list of the ideas that scored go, with a note on what made them strong.
  - Add your own rule about length, such as a limit on scenes, to the scene check.
  - After you cut telling lines, re-run step 3 on the new script.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Tracks the idea, the scene list and the script across the pause."}
    - {name: "A document or screenwriting app", why: "Keeps your scenes in order, so you can move and cut them."}
  inputs:
    - "The audience and where the story will run"
    - "A short list of favourite stories in the same form"
    - "Any lines or scenes you refuse to cut"

terms:
  - term: Controlling idea
    meaning: The one truth a story proves by the end, such as that justice wins only when someone pays for it.
  - term: Counter idea
    meaning: The opposing view the story has to overcome, which gives the story its tension.
  - term: Voice-over
    meaning: A narrator's spoken words laid over a video, rather than something the characters say on screen.
