new_slug: talking-product-video-ad
name: "Get a talking product video ad ready to generate"
summary: "Make a talking product video ad: give your product and buyer, get a script where the product speaks, clip prompts and an ad rules check."
job: make-video-ads
thinking: high
thinking_why: It runs several skills in a row. Give it your strongest model.

headline: "Get a video ad where your product talks, ready to generate"
subhead: Give it your product and who the ad is for. It writes a script where the product is the speaker, checks every line, turns it into clip prompts with a character sheet and an edit plan, and checks the claims against ad rules.

explain: |
  A talking product gets attention in a feed because nobody expects it. It also goes wrong quickly. The product can say things a brand could not claim, the voice can drift between clips, and the face can change from shot to shot.

  This workflow starts with a brief that fixes the buyer and the one doubt to answer. The script tests whether the product suits a speaker, picks who talks and sets one mood, so the voice stays steady. After a line check, the clip prompts describe only the motion, keep the character the same across takes and plan the voice and lip-sync. A last check reads the script against ad rules, because claims made by a talking product are still claims.

when:
  - You want a playful video ad that stands out, and your product can be a character.
  - You plan to make the clips with an AI video tool.
  - You want the claims checked before any clip is made.
not_for:
  - "Your product has no face or voice to give it, or you want a plain demo: use the Product claim demo planner."
  - "You only want a script with no video tool: use the Ad script read-aloud editor to polish one you already have."
  - "You want a cartoon, clay or anime look: use the Animated film video ad script writer or the Claymation video ad script writer."

you_give:
  - Your product facts, with the claims you may make, by claim ID if your brand file has them
  - Your brand file and who the ad is for
  - Your customer reviews (optional)
  - Your target countries, for the ad rules check (optional)
you_get:
  - A brief with the buyer, the doubt and the one argument
  - A script where the product speaks, with a mood and a fit check
  - A line-by-line check with fixes
  - Clip prompts, a character sheet and an edit plan
  - An ad rules check on the script and its claims

how_to_use:
  - "Download the handoff pack. It has HANDOFF.md and five skill files, in the order they run: Ad angle planner, Talking object video ad script writer, Video ad script line checker, Talking object video clip prompt writer and Meta ads compliance checker."
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Have your inputs ready. Your product facts, your brand file, and a line on who the ad is for.
  - Check the script before you generate anything. Fix any line the ad rules check marks "Fix first".
  - Paste each clip prompt into your video tool with the character sheet and your real product photo.
output_sample:
  input:
    - Your product facts, with the claims you may make
    - Your brand file and who the ad is for
    - Your customer reviews (optional)
    - Your target countries for the ad rules check (optional)
  prerequisites:
    - An AI video tool such as Veo or Kling, which needs its own account or plan, to make the clips
    - Your brand brain from the Website brand brain builder (optional, but it makes the result better)
  output:
    - name: Brief
      contains: The buyer, their main doubt and the one argument the ad makes.
    - name: Script
      contains: Spoken lines and picture notes where the product talks, in one mood, with a fit check.
    - name: Line check
      contains: Weak lines quoted with the check that failed and a fix for each.
    - name: Clip prompts
      contains: Motion-only prompts for each clip, with a character sheet, voice and lip-sync notes, and an edit plan.
    - name: Ad rules check
      contains: A verdict on the script and its claims against Facebook and Instagram ad rules, with the exact lines.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every missing item in one list.

how_it_works:
  - title: Picks the buyer and the angle
    text: Uses the angle planner to fix who the ad is for, their doubt and the one argument.
  - title: Writes the script
    text: Uses the talking product script skill to check the fit, choose who talks, test the product as a speaker and write the words in one mood.
  - title: Checks every line
    text: Uses the line checker to label each line by beat, run the checks and fix the weak lines.
  - title: Writes the clip prompts
    text: Uses the talking product clip skill to describe only the motion, keep the character the same across takes, and plan voice, lip-sync and the edit.
  - title: Checks against Meta rules
    text: Uses the ad rules checker to flag claims the talking product makes.

output_shape: |
  BRIEF: <buyer, doubt, the one argument>

  SCRIPT (<seconds>, <spoken words>)
  Who talks: <the product or a part of it>   Mood: <one>
  Fit check: <four counts, pass or not>
  <beats with spoken words and picture notes>

  LINE CHECK: <weak lines, quoted, with the check code and a fix>

  CLIP PROMPTS
  Character sheet: <face, look, voice, kept the same>
  Clip <n>: <motion only>   Voice: <line, lip-sync note>
  Edit plan: <cuts, captions, sound>

  AD RULES CHECK: <verdict, findings with the exact line>

  HAND-BACK SUMMARY
  Files: <each step's file> | MISSING: <every line, in one list>

example:
  business: sprout
  input: |
    [the handoff pack] Follow HANDOFF.md.

    Product facts: the product table and the claims list
    Brand file: sprout/brand-brain/
    Who it is for: someone who quit a greens powder over the grit
  output: |
    BRIEF: the powder quitter, Warm. Doubt: will it work the same.

    SCRIPT (20 seconds, 48 spoken words)
    Who talks: the pack. Mood: dry and a little smug.
    Fit check: passes on all four counts.
    Beat 1: "Hi. I'm what you bought instead of the shaker."
    Beat 3: "Six grams of fiber. No water. I'm very easy."

    LINE CHECK: beat 4 "I fix your gut" (T2). Fix: "I support
    digestion and gut health", the wording on file.

    CLIP PROMPTS
    Character sheet: a flat green pouch with two simple eyes, the real
    print on its front, a low calm voice.
    Clip 1: the pouch stands on a counter beside a dirty shaker and
    turns slowly toward the camera. Voice: line 1, mouth opens on "Hi".

    AD RULES CHECK: fix first. "I fix your gut" is a health claim.
    (cut for length: beats 2 to 5 and clips 2 to 4)

    HAND-BACK SUMMARY
    Files: outputs/step-01 to step-05. MISSING: your voice choice;
    target countries.

tweaks:
  - what: Mood
    how: Name one mood, such as dry, cheerful or deadpan. The whole script and the voice keep to it.
  - what: Who talks
    how: Name the speaker yourself, such as the pack, the lid or the box, or let the script pick.
  - what: Length
    how: Ask for 10, 20 or 30 seconds. The beats and clips change with it.
  - what: Number of takes
    how: Ask for more than one take per clip if your video tool often drifts.

judge:
  - The product says nothing that is not in your claims list.
  - The character looks and sounds the same in every clip prompt.
  - Each clip prompt describes the motion, not the whole scene again.
  - The ad rules check quotes the exact line it flags.
  - The run ends with a summary that lists every file and every MISSING line in one place.

test:
  - Read the script aloud in the product's voice. It should sound like one speaker throughout.
  - Check every claim against your product facts.
  - Generate clip 1 and compare the product with your real photo.
  - Check that the character in clip 2 matches clip 1.

improve:
  - Add a step before the script that finds the reasons people buy from your reviews.
  - Add a step after the clips that plans the captions.
  - Tune the script step with the mood and phrases your brand uses.
  - Pair it with a pre-launch check on the finished video.

works_best_with:
  tools:
    - {name: "Claude", why: "Keeps the character, the voice and the claims consistent across five steps."}
    - {name: "Veo", why: "Makes short clips with sound and lip-sync from a prompt."}
    - {name: "Kling", why: "Holds a character steady across clips when given a reference image."}
  inputs:
    - "Full-size photos of your product, front and back"
    - "Your claims list, with the wording you may use"
    - "A voice you like, such as a clip or a description"

terms:
  - term: Clip prompt
    meaning: The written instructions you give a video tool so it makes one short clip.
  - term: Character sheet
    meaning: A page that fixes how the speaker looks and sounds, so every clip matches.
  - term: Lip-sync
    meaning: Making the mouth move to match the spoken words.
