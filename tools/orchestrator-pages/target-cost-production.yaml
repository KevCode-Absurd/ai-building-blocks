new_slug: target-cost-production
name: "Work back from a low price to cheaper production"
summary: "Name the price you want to sell at. Get a cost-cutting plan, a better work layout and the waste worth chasing."
job: plan-strategy
thinking: high
thinking_why: "It works backward from a price through every cost and step. Give it your strongest model."

headline: "Sell at a lower price by finding a cheaper way to make the product"
subhead: "Name the price you want to sell at and give it your costs. It works backward from that price to cut costs, starting with what the customer doesn't need. Then it lays out the work so there are fewer steps and less walking, and prices every scrap of waste as a possible product or saving."

explain: |
  Most businesses set a price by adding a margin to their costs. Costs then become a fixed fact, and the price follows. A lower price looks impossible because nobody asked which costs the customer is paying for and does not need.

  This workflow turns it around. It sets the price first, then asks of each cost line and step whether the customer needs it, and removes or simplifies before trying to speed up. The second step lays out the work in order, so each part travels the shortest distance and each person does a few small steps. The last step walks the whole process, lists what is thrown away or left idle, and prices each as a product, a reuse or a saving. It draws on ideas in Henry Ford's book My Life and Work, such as pricing first. The order of the steps is this library's own design.

when:
  - You want to cut your price to reach more customers and need to know where the cost can come out.
  - A rival is selling at a price you can't match, and you want to see how far your costs are from theirs.
  - Your process feels slow and wasteful, but you don't know which part to fix first.

you_give:
  - The price you want to sell at, and the customers who can pay it
  - Your product facts, such as costs, parts and materials
  - "How the work runs now: the steps in order, who does each, the space and the tools"
  - What you throw away, leave idle or redo, with amounts if you know them
  - A competitor's prices (optional)
  - A cost or process report, if you have one (optional)
  - A sheet of your costs and volumes (optional)

you_get:
  - A cost plan that starts from the target price, with each cost line and step marked as needed or not
  - A better layout of the work, with the steps in order, fewer moves and a place for each part
  - A list of waste and by-products, each priced as a possible product, reuse or saving, and ranked by money recovered for the effort

not_for:
  - "You want to know what each step costs today, not work back from a price: use Process waste reuse opportunity planner."
  - "Your main cost is what a factory charges you: use Supplier cost and payment terms planner."
  - "You only want to find where a process wastes time and why: use Process waste and root-cause reviewer."
  - "You want to set a price that covers every cost, not cut cost to meet a price: use Product price and discount planner."

output_sample:
  input:
    - "The price you want to sell at, and who can pay it"
    - "Your product facts, such as costs, parts and materials"
    - "How the work runs now: steps, space and tools"
    - "What you throw away, leave idle or redo"
    - "Your rivals' prices (optional)"
    - "A cost or process report, or a sheet of costs and volumes (optional)"
  prerequisites:
    - "An AI that can read files, to run the handoff pack"
  output:
    - name: "Step 1: Price-first cost plan"
      contains: "Each cost line and step marked needed by the customer or not, with remove, simplify or keep, and the saving."
    - name: "Step 2: Work layout"
      contains: "The steps in order with a time for each, where each tool and part sits, and moves counted before and after."
    - name: "Step 3: Waste and by-products"
      contains: "Each scrap or idle item with its monthly amount, who might buy it, its value and the effort to reclaim it."
    - name: "Ranked list and first actions"
      contains: "Waste ranked by money recovered against effort, with the first three actions and a date to count again."
    - name: "Hand-back summary"
      contains: "Each step's file and every MISSING line in one list."

how_to_use:
  - "Download the handoff pack. It has HANDOFF.md and three skill files, in the order they run: Price-first cost planner, Work flow layout planner and Waste and by-product finder."
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Name your target price and give your product facts and costs.
  - It works step by step and saves each result. Check the cost plan before you read the layout.
  - Test the biggest saving on a small batch before you change the whole process.

how_it_works:
  - title: Plan from the price
    text: "Sets the target price first, lists every cost line and step, and asks of each whether the customer needs it. Removes before it speeds up."
  - title: Lay out the work
    text: "Takes the steps left in the cost plan and puts them in the order of the work. Counts each person's moves and shortens how far parts travel."
  - title: Find the waste
    text: "Walks the whole process and lists what is thrown away or left idle. Prices each item as a possible product, reuse or saving and ranks them."

output_shape: |-
  STEP 1: PRICE-FIRST COST PLAN
    Customers and price: <who, what they can pay>
    Cost lines and steps: <item | needed by the customer? | remove / simplify / keep>
    Where rivals are thin: <...>
    Plan: <what to cut, in order>

  STEP 2: WORK LAYOUT
    Steps in order: <small steps, each timed>
    Layout: <where each tool and part sits | how far it travels>
    Moves saved: <before | after>

  STEP 3: WASTE AND BY-PRODUCTS
    Item: <scrap or idle thing | amount per month | who might buy it | value>
    Ranked: <money recovered against effort>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: The target price
    how: Name an exact figure. A price such as 20 percent lower than now gives a clearer plan than "cheaper".
  - what: How detailed your cost list is
    how: Break costs into lines and steps, not totals. It can only question lines it can see.
  - what: What you can change
    how: Say what is fixed, such as a supplier contract or a space. It keeps the plan inside what you can do.

judge:
  - The plan starts from the price and not from current costs.
  - Every cost line and step is marked as needed by the customer or not, with a reason.
  - The layout counts moves before and after, and the steps are in the order of the work.
  - Each waste item has an amount, a value and an option to use it.
  - No cost, volume or saving is invented. Gaps are listed as missing.

test:
  - Give it a process where you already know one step is wasteful. It should flag that step.
  - Set a price you know is too low. The plan should say how far the cost is from it.
  - Check the first saving on a small batch before you trust the numbers.

improve:
  - Keep a log of each cost cut and what it saved, so later runs can build on it.
  - Add any fixed costs or limits to the file you give it.
  - Re-run the waste step each quarter, since the scrap you make changes over time.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Works through the cost lines, the layout and the waste in one run."}
    - {name: "A spreadsheet", why: "Holds the cost lines, timings and amounts so the plan can be checked."}
  inputs:
    - "Time per step, measured on a real day"
    - "Supplier prices and minimum orders"
    - "A walk-through of the process, with photos"

terms:
  - term: By-product
    meaning: Something made along the way, such as an offcut or a spare part, that could be sold or used instead of thrown away.
  - term: Cost line
    meaning: A single item in your costs, such as a material, a wage or a fee, listed on its own.
