new_slug: three-look-product-photos
name: "Get product photos in three looks from phone photos"
summary: "Turn phone photos into product photos for ads and your shop: a styled set, flash snapshots and a copy of a look you like. Prompts for your image tool."
job: product-photos
thinking: high
thinking_why: It runs several skills in a row. Give it your strongest model.

headline: "Get product photos in three looks from your phone photos"
subhead: Give it your website and a few phone photos of your product. It builds your org context, then plans a styled set of nine photos, six flash snapshots from one real occasion, and a set that matches a photo you admire, all showing your real product.

explain: |
  Most small shops have a handful of phone photos and a need for dozens of pictures: for ads, the shop, email and social. One style rarely covers all of that. A clean studio look suits the shop, a flash snapshot looks like a real night out, and a copy of a look you like gets you a feel you cannot name yourself.

  This workflow starts with your org context, so the colours, the product details and the look come from your own site and not from a guess. Each photo skill then writes prompts for your image tool and keeps the real product: its shape, its print and how it opens. You make one test picture in each look before the rest.

when:
  - You only have phone photos and need many more for ads and your shop.
  - You like the look of someone else's photo and want that feel for your product.
  - Your product photos all look alike and you need some variety.
not_for:
  - "You need real customer pictures: the flash snapshots are staged, so use photos from your own customers instead."
  - "You only want one plain studio photo set: use the Product photo shoot planner."
  - "You want to fix flaws in pictures you already made: use the Ad image planner."

you_give:
  - Your website, as a link or saved pages
  - "Your product photos: the front, the back of the pack, in use, and a close-up of the print"
  - A photo whose look you like (optional, needed for the third look)
  - Who the photos are for (optional)
you_get:
  - An org context with your colours, look and product details
  - A style sheet and nine matching photo prompts
  - Six flash snapshot prompts from one real occasion
  - A prompt that matches the look of your reference photo, with the pictures ranked
  - A check list for every picture at full size

how_to_use:
  - "Download the handoff pack. It has HANDOFF.md and four skill files, in the order they run: Org context builder, Product photo shoot planner, Flash snapshot product photo maker and Reference-style product photo maker."
  - Give the folder to Claude, in Claude Code or as files in a Claude Project, and say "Follow HANDOFF.md".
  - "Have your inputs ready: your website link, your phone photos and one photo whose look you like."
  - Take the prompts to your image tool. You need a tool or account that makes images, and it may be paid.
  - Make frame 1 of each look first and check it against your real product before you make the rest.
  - Look at every finished picture at full size. Treat the flash snapshots as staged images, not real customer photos. If you use one in an ad, label it AI-generated. Never present it as a customer or event photo.
output_sample:
  input:
    - Your website, as a link or saved pages
    - Photos of your real product, from the front, back and in use
    - A photo whose look you like (optional)
    - Customer reviews or your ad results (optional)
  prerequisites:
    - An image tool to run the prompts, such as GPT Image or Nano Banana, which may need a paid account
    - An AI that can open files, so it can follow the handoff pack
  output:
    - name: Org context
      contains: Your colours, look, prices and product details, each tagged with where it came from.
    - name: Styled photo set
      contains: A style sheet and nine frames on a grid, each with a prompt for your image tool.
    - name: Flash snapshots
      contains: The flash look, one real occasion in time order, and six prompts.
    - name: Reference look
      contains: What is kept, swapped and dropped from your reference photo, one prompt, and the pictures ranked.
    - name: Checks
      contains: A list for looking at each picture at full size next to your real product.
    - name: HAND-BACK SUMMARY
      contains: Each step's file, any step not run and why, and every MISSING line in one list.

how_it_works:
  - title: Builds your org context
    text: Uses the org context skill to read your site and tag every colour, product detail and claim with where it came from.
  - title: Plans a styled photo set
    text: Uses the shoot planner to write a style sheet, plan nine frames on a grid and write one prompt for each.
  - title: Makes flash snapshots
    text: Uses the flash snapshot skill to set the flash look, plan one real occasion in time order and write six prompts.
  - title: Copies a look you like
    text: Uses the reference photo skill to read your reference as the set that made it, keep or swap each part, and rank the pictures.

output_shape: |
  PRODUCT: <shape, colours, printed words, how it opens>   (from photos <n>)

  STYLE SHEET: <light, background, props, colours>
  FRAMES (grid): <frame | job | prompt>   (nine)

  FLASH ROLL: <the occasion, in time order>
  Dials: <flash strength, angle, grain>   Prompts: <six>

  REFERENCE LOOK
  Kept: <what is copied>   Swapped: <what is yours>   Dropped: <what is not>
  Prompt: <one paragraph>   Ranked: <pictures, best first>

  CHECKS: <each picture at full size, against the real photo>

  HAND-BACK SUMMARY
  Files: <each step's file> | MISSING: <every line, in one list>

example:
  business: sprout
  input: |
    [the handoff pack] Follow HANDOFF.md.

    Website: sprout.example
    Photos: 6 pack photos (front, back, torn open, in a hand)
    Reference: a photo of a pouch on a bathroom shelf, soft morning light
  output: |
    PRODUCT: deep green stand-up pouch, gold seed mark, a torn flat pack
    inside; "Sprout" in cream. (from photos 1, 2, 5)

    STYLE SHEET: soft window light, cream wall, one green plant as the
    only prop, brand green #00582D.
    FRAMES (grid): 01 | hero front | "Deep green pouch on a cream shelf,
    soft window light from the left..." (eight more)

    FLASH ROLL: a Friday night at a friend's flat, in time order: bag on
    the hall table, pack torn at the sofa, gummies in a palm.
    Dials: direct on-camera flash, slightly harsh, mild grain.

    REFERENCE LOOK
    Kept: morning side light, shelf at a slight angle
    Swapped: the bathroom for a kitchen counter
    Dropped: the reference's brand marks

    CHECKS: at full size, is the pack torn straight across the top?
    (cut for length: frames 02 to 09 and flash prompts 2 to 6)

    HAND-BACK SUMMARY
    Files: outputs/step-01 to step-04. MISSING: a photo of the back of
    the pack; the finished pictures to check.

tweaks:
  - what: How many photos
    how: Ask for six to twelve in the styled set. Each gets its own job, such as hero, in use or detail.
  - what: The occasion
    how: Name the moment for the flash roll, such as a picnic or a weekend away. The six frames follow it in time order.
  - what: Reference photo
    how: Give two or three references and ask it to pick one, or to say what they share.
  - what: Image tool
    how: Name your tool and the prompts are written to fit it, with your photos named by their jobs.

judge:
  - The product in every prompt matches your photos in shape, colours and printing.
  - The three looks are clearly different from each other.
  - The reference prompt copies the light and mood, not the other brand's marks.
  - Every prompt names the photo it needs and what that photo is for.
  - The run ends with a summary that lists every file and every MISSING line in one place.

test:
  - Make frame 1 in each look and compare the pack with your real photo at full size.
  - Put the three looks side by side. They should look like three different shoots.
  - Check that the reference look is recognisable but no logo or face from it appears.
  - Check that the printed words on the pack are spelled the same as the real pack.

improve:
  - Drop step 1 if your org context is up to date, and start from step 2.
  - Add a step that plans which photo goes in which place on your product page.
  - Tune the shoot planner with the look words your brand already uses.
  - Next, check each finished picture against your real product with the AI product photo inspector before it goes live.

works_best_with:
  tools:
    - {name: "Claude", why: "Keeps the product details the same across all three looks in one run."}
    - {name: "GPT Image", why: "Takes your product photos as references and keeps the pack close to the real one."}
    - {name: "Nano Banana", why: "Takes many reference photos at once and handles shiny packs such as foil pouches."}
  inputs:
    - "Full-size photos of your product from the front, back and in use"
    - "A close-up of the print on the pack, so printed words stay spelled right"
    - "Your colour codes, if you have them"

terms:
  - term: Style sheet
    meaning: A short page that fixes the light, background, props and colours, so all the photos match.
  - term: Flash snapshot
    meaning: A photo that looks like it was taken on a phone with the flash on, at a real moment.
  - term: Reference photo
    meaning: A photo whose look you want to copy, kept for its light and mood, not its brand.
