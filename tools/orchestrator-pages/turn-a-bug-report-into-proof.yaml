new_slug: turn-a-bug-report-into-proof
name: Turn a bug report into proof
summary: Share a bug report and repo. Get a repeatable case, missing tests and a record of what is verified.
job: test-and-fix-code
headline: Turn a bug report into proof
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share a bug report and repo. Get a repeatable case, missing tests and a record of what is verified. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share a bug report and repo. Get a repeatable case, missing tests and a record of what is verified.

  Step 1 turns an unclear report into steps that repeat the bug, and the smallest case that fails. Step 2 finds the tests that are missing, weak or out of date, ranked by the behavior at risk. Step 3 records what is verified, partly verified or blocked, with the date. It works with the sources you provide and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - A bug report is vague and you cannot make the bug happen on your machine.
  - You have a fix and need proof that it works, not a claim.
  - You want to know which tests would have caught the bug.
you_give:
  - The bug report, as you received it
  - Your repo, or the part of the code the bug touches
  - Error messages or logs, with secrets removed (optional)
  - The fix and the checks you ran on it, for the last step (optional)
you_get:
  - Reproduction brief
  - Coverage gaps
  - Verified, partial or blocked bug receipt
how_to_use:
  - Add the complete skill pack to an AI that can read your repo and run commands, such as Claude Code.
  - Share the bug report and the repo. Take secrets out of any logs first.
  - Ask it to follow the steps and mark any missing facts.
  - Read the repeatable case before step 2. If the AI cannot repeat the bug, the receipt will say blocked.
  - Review the result before approving external actions.
how_it_works:
  - title: Bug reproduction evidence writer
    text: Share an unclear bug report. Get repeatable steps, a minimal case and the evidence still needed.
  - title: Test coverage gap investigator
    text: Share your repo or change. Get missing, weak and stale tests ranked by the behavior at risk.
  - title: Bug fix evidence recorder
    text: Share a fix and its checks. Get a dated record of what is verified, partial or blocked.
output_shape: |-
  Reproduction brief
  Coverage gaps
  Verified, partial or blocked bug receipt
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
not_for:
  - "You want the bug fixed and a pull request written: use Bug repair and pull request reviewer."
  - "You can already repeat the bug and only need its cause: use Bug root cause finder."
  - "You only need a clear ticket for a developer: use Bug report writer."
output_sample:
  input:
    - The bug report as you received it
    - Your repo, or the part of the code the bug touches
    - Error messages or logs with secrets removed (optional)
    - The fix and the checks you ran on it (optional, for the last step)
  prerequisites:
    - An AI that can read your repo and run commands, such as Claude Code, so it can repeat the bug
  output:
    - name: Reproduction brief
      contains: Expected and actual behavior, the environment, the smallest failing case and what happened on repeat runs.
    - name: Coverage gaps
      contains: Missing, weak and stale tests, ranked from P0 to P3, each with a suggested test.
    - name: Bug receipt
      contains: One block marked VERIFIED, PARTIAL or BLOCKED, with problem, root cause, change, proof and gaps.
