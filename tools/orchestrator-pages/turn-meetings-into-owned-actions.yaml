new_slug: turn-meetings-into-owned-actions
name: Turn meetings into owned actions
summary: "Give it notes from one meeting or one set of threads. Get an action list with owners and dates, plus follow-up drafts you review before anything is sent."
job: organise-work
headline: Turn meetings into owned actions
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: "Give it the notes or threads from one meeting, with the date window. It builds one action list with an owner, a date and a source for each action, then drafts a follow-up for each due task. Anything it cannot confirm is marked, and nothing is sent."
explain: |-
  Actions from a meeting get lost between the notes and the inbox. This workflow turns one meeting, or one set of threads, into a single action list. Each action has an owner, a date and the line in the notes it came from.

  It is for one meeting or one set of threads. For a weekly review of commitments across the week, use Prepare your weekly executive review.

  Then it drafts a chase-up for each task that is due. It does not guess an owner or a date. It marks them unconfirmed. Nothing is sent and no task is changed until you say yes.
when:
  - "You have just had a meeting and need each action tied to an owner and a date."
  - "Actions are spread across notes and email threads, and you need one list."
  - "Some tasks are due and you want a follow-up drafted for each."
you_give:
  - "Meeting notes, a transcript or email threads"
  - "The date window and your timezone"
  - "Who attended, so owners can be matched to names (optional)"
  - "Your current task list (optional)"
you_get:
  - "An action list with owner, date, status and source for each action"
  - "A list of owner and date gaps, and a draft of task changes"
  - "One follow-up draft per due task, with what is still missing"
  - "A note of every owner, date and recipient it could not confirm"
how_to_use:
  - "Download the handoff pack. It's a zip with HANDOFF.md, the Executive action register keeper skill and the Due task follow up drafter skill, in that order."
  - "Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say \"Follow HANDOFF.md\"."
  - "Paste your notes or threads, the date window and your timezone."
  - "Check the action list and the gaps before you read the drafts."
  - "Send nothing until you have read each draft and said yes."
how_it_works:
  - title: "Executive action register keeper"
    text: "Reads your notes or threads and builds one action list. Each action has an owner, a deadline and a source. Gaps go on a short list to settle."
  - title: "Due task follow up drafter"
    text: "Takes the action list from step 1 and the related threads. Writes one follow-up draft per due task, with the missing facts and its send status."
output_shape: |-
  STEP 1: ACTION LIST
    Actions: id | task | owner | due date | timezone | status | dependency | source
    Gaps: owner and deadline questions | overdue | due soon | blocked | undated
    Proposed task changes (a draft, nothing applied)

  STEP 2: FOLLOW-UP DRAFTS
    Per due task: recipients | subject | body | missing facts | state

  Unconfirmed owners, dates and recipients, in one list
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
not_for:
  - "You only need tidy minutes to circulate: use Rough notes to minutes writer."
  - "You want a short written update from one meeting: use Meeting to written update converter."
  - "You want the same action list kept up to date every week: use Weekly meeting actions keeper."
  - "You want a weekly review of commitments and next week's priorities: use Prepare your weekly executive review."
  - "You already have due tasks and only need follow-up drafts in your voice: use Draft your due task follow ups."
output_sample:
  input:
    - Meeting notes, a transcript or email threads
    - The date window and your timezone
    - Who attended, so owners can be matched to names
    - Your current task list (optional)
  output:
    - name: action-register.csv
      contains: One row per action with id, task, owner, due date, timezone, status, dependency and source.
    - name: clarifications.md
      contains: Owner and deadline gaps, plus overdue, due soon, blocked and undated work.
    - name: proposed-task-changes.md
      contains: Task creates and updates for your task system, as a draft nothing has applied.
    - name: follow-up-drafts.md
      contains: One draft per due task with recipients, subject, body and the facts still missing.
    - name: draft-ledger.csv
      contains: Each draft's version and state, so nothing counts as sent until you send it.
