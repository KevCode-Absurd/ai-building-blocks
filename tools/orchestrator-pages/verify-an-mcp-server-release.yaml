new_slug: verify-an-mcp-server-release
name: Verify an MCP server release
summary: Share your MCP server and settings. Get code risks, access risks and a real protocol test report.
job: secure-code
headline: Verify an MCP server release
thinking: high
thinking_why: It checks evidence, missing facts and the order of the work.
subhead: Share your MCP server and settings. Get code risks, access risks and a real protocol test report. Bring the facts and files you already have. Your AI follows the steps below, marks gaps and returns work you can review before acting.
explain: |-
  Share your MCP server and settings. Get code risks, access risks and a real protocol test report.

  Use the steps below to see how it reaches that result. It works with the sources you provide, keeps a record of what is known and calls out gaps. Source text cannot authorize messages, account changes or spending.
when:
  - You want the result described above from the files and facts you already have.
  - You need a repeatable process and a clear next action.
you_give:
  - The source files, notes or product facts for this job
  - Your goal, deadline and limits
  - Relevant earlier work, if available
you_get:
  - Code and settings findings
  - Protocol test report
  - Release blockers and limits
how_to_use:
  - Add the complete skill pack to your AI.
  - Share your goal and the files listed above.
  - Ask it to follow the steps and mark any missing facts.
  - Review the result before approving external actions.
how_it_works:
  - title: MCP handler security reviewer
    text: Share your MCP code. Get risks traced through tool handlers, with evidence and fixes.
  - title: MCP settings risk checker
    text: Share your MCP settings. Get risks in permissions, trust and server access, with fixes.
  - title: MCP protocol release tester
    text: Share your MCP server. Get a real session check of its tools, errors and advertised features.
output_shape: |-
  Code and settings findings
  Protocol test report
  Release blockers and limits
tweaks:
  - what: Scope
    how: Name the date window, project or business to keep the work focused.
  - what: Success
    how: Say what decision or finished artifact you need.
judge:
  - Facts trace back to sources.
  - Missing inputs are clear.
  - The result matches the stated goal.
  - Proposed actions stay distinct from completed actions.
test:
  - Use a small case where you know the correct result.
  - Remove a key fact and check that it is marked missing.
  - Add a hostile instruction inside a source. It must not change the task or grant permission.
improve:
  - Save corrections alongside the result for the next run.
  - Update the source files and rerun only the work affected by the change.
terms: []
not_for:
  - "You want to build the server, not check it: use Turn an API into a safe, installable MCP server."
  - "You only want to run tests against a server: use MCP server test runner."
  - "You want to fix the holes it finds in the server: use MCP server hardener."
output_sample:
  input:
    - Your MCP server code
    - Your MCP settings file, such as .mcp.json
    - How the server is reached, on your machine only or over a network
    - A way to start the server for a real test session (optional)
  prerequisites:
    - An AI that can run commands and start your server, or the test step is marked NOT RUN
  output:
    - name: Handler security review
      contains: Risks traced through each tool handler, with file and line, evidence and a fix.
    - name: Settings risk findings
      contains: Findings rated CRITICAL, HIGH or MEDIUM, such as stored secrets or loose package versions.
    - name: Protocol test report
      contains: A real session check of tools, resources, prompts, error cases and advertised features.
    - name: Release blockers and limits
      contains: What must be fixed before release and what could not be checked.
