new_slug: weekly-priorities-plan
name: Plan a week that puts what matters first
summary: Plan your week by putting the important work first. Paste your task list and roles. Get what to drop, a role-based week and a Friday review.
job: plan-strategy
thinking: high
thinking_why: It runs four skills in a row and each one builds on the last. Give it your strongest model.
headline: A week that books the important work first
subhead: Paste your tasks and say what matters to you. It sorts them into four boxes by urgent and important, hands off what others can own, builds the week from your roles and reviews it afterwards. You get what to drop, a week plan and one hour won back.
explain: |
  A full calendar is not a plan. Urgent jobs push on you, so they take the week, and the important work with no deadline waits. Months pass and you are busy and behind on what you care about.

  This workflow follows the third habit in Stephen Covey's book, put first things first. It sorts your plate into four boxes and shows the real split of your hours. It hands off what someone else can own by agreeing the result, not the method. Then it builds the week from your roles, books the important work as real appointments and leaves open space for people. After the week, it reviews what you chose against what took you.
when:
  - Your days fill with small urgent jobs and the big work never starts.
  - You are about to plan the week and want to know what to clear first.
  - You want to hand off more but past handoffs came back wrong.
not_for:
  - "You have one fixed deadline or a one-off project: use a plain to-do list or the project plan for that job."
  - "You want to plan only a single day: write a short list of your top three jobs by hand."
  - "You have no task list and no idea of your roles: write down your jobs and goals first, then come back."
you_give:
  - Your task list or last week's calendar, with rough hours
  - Your roles, goals or values (optional but helps)
  - A job you could hand to someone, and who (optional)
  - Next week's fixed meetings and duties
you_get:
  - Your tasks in four boxes, your time split and what to drop, hand off or shrink
  - Two polite refusals and a one-page agreement for each handoff
  - A week built from your roles with the important work booked first
  - A review of how the week went and one hour won back
how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your task list and say what matters to you. Guess your own split before you read the answer.
  - Live the week with the plan in view. Note each time a loud job pulled you away.
  - On Friday, run the last step with those notes.
output_sample:
  input:
    - Your task list or last week's calendar, with rough hours
    - Your roles, goals or values (optional)
    - A job you could hand to someone, and who (optional)
    - Next week's fixed meetings and duties
  prerequisites:
    - Claude Code, or a Claude Project that can load files, to open the handoff pack
  output:
    - name: "Step 1: Urgent versus important sorter"
      contains: Your tasks in four boxes, the real split of your hours, what to drop or hand off, and two polite refusals.
    - name: "Step 2: Results agreement writer"
      contains: "A one-page agreement for each handoff: the result, limits, help, review times and consequences."
    - name: "Step 3: Values-to-week planner"
      contains: A week built from your roles, with the important work booked first and open space left for people.
    - name: "Step 4: Weekly time audit planner"
      contains: What you chose against what took your time, and one hour won back for next week.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Urgent versus important sorter
    text: Sorts each task by two questions, counts the hours in each box, traces crises to missing prevention and marks what to drop, hand off or shrink.
  - title: Results agreement writer
    text: Turns a handoff into one page on the result, limits, help, review dates and consequences, with no instructions on how to work.
  - title: Values-to-week planner
    text: Builds the week from your roles, books the important work first and leaves open space.
  - title: Weekly time audit planner
    text: After the week, counts what you chose against what took you and finds one hour to win back.
output_shape: |-
  STEP 1: URGENT VERSUS IMPORTANT SORTER
    Four boxes with hours | Split: I <n>% II <n>% III <n>% IV <n>%
    Drop or hand off: <list> | Two refusals: <lines>

  STEP 2: RESULTS AGREEMENT WRITER
    Result: <what, by when> | Limits | Help | Review | Consequences

  STEP 3: VALUES-TO-WEEK PLANNER
    <roles, results and a day-by-day view with protected blocks>

  (live the week)

  STEP 4: WEEKLY TIME AUDIT PLANNER
    <chosen against taken, and one hour won back>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Honest hours
    how: Use last week's calendar or a three-day log. Guessed hours make the split wrong and the plan too tight.
  - what: What important means
    how: Name two or three roles or goals first. Without them the sort is the AI's guess, not yours.
  - what: What you hand off
    how: Pick one job a person could own. Describe the result you would accept, not the steps.
judge:
  - Important is defined from your own roles, goals or values.
  - The shares of your hours add up to 100 percent.
  - Time for the important work comes from the urgent but unimportant jobs and from escape.
  - Each handoff states a result you can check and no method.
  - The week has open space left in it.
test:
  - Guess your split before you run step 1, then compare.
  - Hand off one job with the agreement and see whether you can keep from checking in before the review date.
  - Run the review after one week and see whether the important share moved.
improve:
  - Save your roles and goals in your about-me file so step 3 starts from them.
  - Add your usual urgent but unimportant jobs to the sorter, such as a weekly status meeting.
  - Re-run the sort every month.
  - Pair it with the mission statement workflow to ground the roles.
