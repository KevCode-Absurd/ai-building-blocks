new_slug: what-you-really-sell
name: Find what you really sell and prove every claim
headline: Find what you really sell and prove every claim
summary: Find the angle worth selling on. Get ten or more angles, a checked offer and each claim in your copy matched to its proof.
job: write-ad-copy
thinking: high
thinking_why: It runs three skills in a row and has to catch claims that outrun their proof. Give it your strongest model.
subhead: Give it your product facts, your offer and the copy you want checked. It lists at least ten things you could really be selling and picks the best three as test angles. Then it reviews your offer against a checklist and pairs every claim in your copy with its proof.
explain: |-
  Most copy fails in one of three places. It sells the thing instead of the result the buyer wants. The offer is fine but nobody has pushed on it, so the deal, the guarantee and the framing stay at their first draft. Or the copy makes a big claim and puts the proof somewhere else, or nowhere. Readers notice, and they stop believing the rest. This workflow helps you find what you really sell and check that every claim holds up.

  The steps run in a fixed order, and each one starts from the result of the one before. First it finds what you are really selling and picks three angles to test. Then it checks your offer against a list of offer tests and ranks the three changes worth trying first. Then it matches each claim to proof, and shrinks, supports or moves the claims that lack it.

  The order follows Gary Bencivenga's Marketing Bullets Collection. The steps and checks are written in our own words. The proof step never adds a fact. If you hold no proof for a claim, the claim shrinks or is flagged.
when:
  - Your ad or page makes big claims and you want each one to hold up before it goes live.
  - You keep describing your product the same way and want fresh angles to test against each other.
  - Your offer converts but you suspect the deal, the guarantee or the way you state the price could do better.
  - A reviewer or platform asked you to back up a claim and you need to see what you can prove.
not_for:
  - "You have no live offer yet: build your brand profile first with the Brand profile builder, then come back."
  - "You only want the claims in an ad checked against proof: use the Claim evidence checker on its own."
  - "You only want the offer reviewed: use the Offer checklist reviewer on its own."
you_give:
  - "Your product facts: what it is, who it is for, what it costs and its limits"
  - Your current offer, price and guarantee
  - The ad or page copy you want checked
  - Your buyer or a persona (optional)
  - Customer reviews or buyer words (optional)
  - Your proof, such as test results, numbers, reviews and awards, each with its source (optional)
you_get:
  - A long list of what you could really be selling, with the best three as test angles and a test headline for each
  - Your offer in one line, a checklist review with a score, and the three changes to test first
  - Every claim in your copy paired with its proof, with the gaps and the fixes listed
  - A test plan in which only the angle changes
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini, in an AI that can read files, and say Follow HANDOFF.md.
  - Paste your product facts, your offer and your copy. Add proof if you have it. It works step by step and saves each result.
  - Read the three angles before you go on. Cut any you could not honestly deliver.
  - Split-test the angles and the offer changes it picks. Those tests need time and traffic, so give them time before you judge them.
  - Check each claim fix against your own records before the copy goes live.
output_sample:
  input:
    - Your product facts and price
    - Your current offer, guarantee and any deadline
    - The ad or page copy to check
    - Your buyer and customer words (optional)
    - Your proof, with sources (optional)
  prerequisites:
    - An AI that can read files, to run the handoff pack
  output:
    - name: Angles to test
      contains: Ten or more answers to what you are really selling, the best three with a reason and a test headline each.
    - name: Test plan
      contains: A plan in which only the angle changes, with the measure to watch and how long to run it.
    - name: Offer review
      contains: The offer in one line, a checklist score, a revised offer and three ranked changes to test, each with a measure.
    - name: Claims and proof table
      contains: Each claim with its proof or a gap flag, the claims bigger than their proof, and a fix for each.
    - name: Hand-back summary
      contains: Each step's file, every MISSING line in one list and the checks that could not run.
how_it_works:
  - title: Find what you sell
    text: Lists at least ten answers to what you are really selling, pushes each toward the result the buyer wants, drops what you cannot deliver and picks the best three as test angles.
  - title: Review the offer
    text: Takes the angles and checks your offer against an offer checklist. It ranks the changes and picks three to split-test.
  - title: Match claims to proof
    text: Takes the revised offer, lists every claim in your copy and puts the proof next to each. Claims bigger than their proof are shrunk, supported or moved.
output_shape: |-
  STEP 1: ANGLES TO TEST
    Ten or more answers to "what am I really selling?" | best three, each with a reason and a test headline | test plan where only the angle changes

  STEP 2: OFFER REVIEW
    Offer in one line | checklist review | revised offer | three changes to test first, each with a measure

  STEP 3: CLAIMS AND PROOF
    Each claim | its proof or a gap flag | claims bigger than their proof | fixes

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: How exact your product facts are
    how: Every later step builds on the first one. Real numbers, real limits and the words buyers use give better angles than a loose description.
  - what: Your proof
    how: Give it everything you can back up, such as test results, review counts and dates. A claim with no proof either shrinks or gets flagged, so more proof keeps more of your copy.
  - what: Your guarantee and deal terms
    how: Say what you will truly keep, such as a refund window or a price rise date. It will not suggest a limit or deadline you do not mean.
judge:
  - Each step used the result of the step before.
  - The angles are about the buyer's result, not only the product's features.
  - No claim was invented or made bigger to fit a gap.
  - Every claim has proof beside it or a flag saying it has none.
  - The three offer tests each name one thing to change and one number to watch.
test:
  - Run it on copy where you know one claim has no proof. That claim should come back flagged, not passed.
  - Run it twice on the same input. The steps should land in the same places, even if the wording differs.
  - Stop it after step 1 and read the three angles yourself before you let it carry on.
improve:
  - Save the three angles and your proof into your brand file, so later runs can start from step 2.
  - Add the claims you are not allowed to make to your brand file, so step 3 flags them first.
  - After a test ends, add the winner and what it showed, and run step 1 again for the next round.
works_best_with:
  tools:
    - name: Any good chat AI
      why: Every step is a plan or a piece of writing.
    - name: A spreadsheet
      why: Keeps your split-test results once the angles and offer changes go live.
  inputs:
    - Your brand profile, from the Brand profile builder
    - Test results, review counts and dates you can show
    - A list of claims you are not allowed to make
next:
