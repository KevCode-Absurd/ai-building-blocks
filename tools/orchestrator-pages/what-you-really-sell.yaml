terms:
  - term: Angle
    meaning: The reason to buy that an ad leads with, such as saving time or feeling safe.
  - term: Proof
    meaning: A result, number, review or record you can show next to a claim.
  - term: Split test
    meaning: Two versions run at the same time to different halves of an audience, so one change can be read.
