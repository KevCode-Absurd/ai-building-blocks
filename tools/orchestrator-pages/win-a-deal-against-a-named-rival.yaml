  - get-a-quiet-deal-moving-again-without-pressure
  - rival-matchup-scorer
terms:
  - term: Battlecard
    meaning: "A one-page sheet for sellers: how you compare with one rival, their usual claims and your replies."
  - term: Mutual action plan
    meaning: A dated plan to signature, shared with the buyer, with tasks for both sides.
