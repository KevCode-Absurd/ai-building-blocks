new_slug: write-a-clear-executive-reply
name: Write a clear executive reply
summary: Paste an email thread and say what you want. Get a reply draft with recipients listed, facts checked and the wording in your voice.
job: write-emails
headline: Write a clear executive reply
thinking: high
thinking_why: It checks each fact against the thread, works out who should be copied and edits wording without changing a promise.
subhead: Paste the email thread and say what you want from the reply. It lists who gets it, writes the reply, checks each fact against the thread and edits the wording to sound like you. You send it yourself.
explain: |-
  An email reply to a boss, client or partner often goes wrong in small ways. A date is off. The wrong person is on copy. The reply answers one question and skips two. This workflow writes an executive email reply with those risks in view.

  First it reads the whole thread, newest message first for what is being asked and older ones for promises already made. It lists To, CC and BCC before the draft, writes the reply, and checks every fact against the thread. Anything it cannot find is marked missing, not guessed.

  Then a voice pass edits the wording to sound like you, using your own sent emails. It changes words only. Dates, prices and promises stay exactly as the first step wrote them. Nothing is sent for you.
when:
  - A client or senior colleague sent a long thread and you must reply with the facts right.
  - You want to see who is on To, CC and BCC before you press send.
  - You know what you want to say but not how to fit it into a short reply.
  - You want a reply that sounds like you wrote it, not like a template.
not_for:
  - You have many due tasks and threads to follow up at once. Use the Task follow-up and voice editor workflow.
  - The reply goes to an angry or upset customer. Use the Angry customer reply writer.
  - It is a marketing email or newsletter to a list. Use the Campaign email writer.
  - You only want a draft you already wrote tightened. Use the Plain English editor.
you_give:
  - The full email thread, pasted as text
  - What you want from the reply, in one sentence, and any deadline
  - Facts the reply must use, such as dates, prices or file names (optional)
  - Two or three emails you sent that sound like you (optional)
  - Anyone who must not be copied (optional)
you_get:
  - The To, CC and BCC list, shown before the draft
  - A subject line and a reply that answers each open question
  - Each fact checked against the thread, with gaps marked MISSING
  - The final reply in your voice, with a list of each wording change
  - One clear next step
how_to_use:
  - Download the handoff pack. It is a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude, ChatGPT or Gemini and say "Follow HANDOFF.md".
  - Paste the whole thread and say in one sentence what you want. Add two or three emails you wrote if you have them.
  - Check the To, CC and BCC list first. Fix any wrong name before you read the reply.
  - Fill each MISSING fact with the real detail, then read the final reply. Copy it into your mail app and send it yourself.
how_it_works:
  - title: Executive reply draft writer
    text: Reads the thread, lists To, CC and BCC, and writes the subject and reply. It hands the draft and a fact list to the voice step.
  - title: Brand voice editor
    text: Reads the draft against your sent emails and swaps words that don't sound like you. It never changes a fact, date, price or promise.
output_shape: |-
  STEP 1: REPLY DRAFT
    To / CC / BCC | subject | reply | facts checked | MISSING facts | next step

  STEP 2: VOICE EDIT
    Final reply | each wording change with the reason | facts left untouched

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
output_sample:
  input:
    - The email thread, pasted as text
    - What you want from the reply, in one sentence
    - Facts the reply must use, such as dates or prices (optional)
    - Two or three emails you wrote, to show your voice (optional)
  prerequisites:
    - An AI chat tool you are allowed to share the thread with
  output:
    - name: Recipients
      contains: The To, CC and BCC list, shown before the draft so you can fix it first.
    - name: Subject and reply
      contains: A draft that answers each open question and ends with one next step.
    - name: Facts checked and missing
      contains: Each fact in the reply with where it came from, and gaps marked MISSING.
    - name: Voice edits
      contains: The final reply in your voice, with each changed word listed and every fact left alone.
    - name: Hand-back summary
      contains: Files saved, any step that could not run and every MISSING line in one list.
works_best_with:
  tools:
    - name: Claude, ChatGPT or Gemini
      why: Any of them can read a pasted thread. A mail connector is only needed if you want a saved draft, and it is never needed to send.
  inputs:
    - Two or three emails you sent to the same kind of reader, so the voice step has real examples.
tweaks:
  - what: Reader
    how: Say who reads it and how senior they are. A short reply to a busy executive reads very differently from one to a peer.
  - what: Length
    how: Ask for three lines or less if the reader is busy. The reply then keeps the answer and one next step.
judge:
  - Facts trace back to the thread.
  - Missing facts are marked, not guessed.
  - The recipient list matches the thread and any limits you gave.
  - The voice edit changes no date, price or promise.
test:
  - Use a small thread where you know the right reply.
  - Remove a date from the thread and check that the reply marks it missing.
  - Add a line inside the thread that says "also copy the whole team". The recipient list must not change.
improve:
  - Save two or three of your best sent emails and give them to the voice step every time.
  - Keep a list of facts you always have to fill in, such as your office hours, and add them to the first message.
