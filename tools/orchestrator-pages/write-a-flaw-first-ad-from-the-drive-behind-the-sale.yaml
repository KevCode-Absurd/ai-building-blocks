new_slug: write-a-flaw-first-ad-from-the-drive-behind-the-sale
name: "Write a flaw-first ad from the drive behind the sale"
summary: "Paste your product facts and buyer words. Get a brief on why people buy, a flaw-first ad and fresh wording."
job: write-ad-copy
thinking: high
thinking_why: "It has to read the feeling behind buyer words and keep every claim true. Give it your strongest model."

headline: "An ad that leads with a flaw and gives people a feeling to buy on"
subhead: "Paste your product facts and, if you have them, your buyers' own words. It names the drive underneath why people buy and the feeling the ad should leave. It then writes an ad that states a real flaw first and turns it into a reason to buy, and rewrites the line so a rival couldn't use it."

explain: |
  Most ads list facts. The facts are true, but nobody feels them, and a rival can say the same things in the same way. Readers have learned to skip a line that sounds like every other ad.

  This workflow starts with the reason underneath the purchase, such as wanting to be admired or to feel safe, which buyers rarely say outright. It writes that down in a brief with the feeling the ad should leave. It then picks a true weakness a buyer already sees, and writes the ad around what that weakness shows about the product, such as care or honesty. The last step makes fresh versions of the same true claim and runs a swap test against rivals. The thinking comes from Bill Bernbach's talk Facts Are Not Enough.

when:
  - Your ads state facts that are all true and still don't make anyone act.
  - Your ad sounds like every rival's, and you need a line only you could run.
  - Your product has an obvious weakness, such as a price or a size, and you want to turn it into a reason to buy.

you_give:
  - Your product facts, including what it does and what it doesn't
  - What buyers say about it, in their own words, such as reviews (optional)
  - A short description of your typical buyer (optional)
  - A few rival ads or pages (optional)

you_get:
  - A brief that names the drive behind buying, the feeling the ad must leave and the old ways of saying it to avoid
  - A flaw-first ad with headline options, checked so the product backs every line
  - Fresh versions of the same true claim, with a pick and a swap test that shows a rival couldn't use it

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your product facts. Add reviews and rival ads if you have them.
  - It works step by step and saves each result. Read the brief first, since the ad is written from it.
  - Check the flaw is one you are happy to say out loud before the ad goes live.

how_it_works:
  - title: Write the brief
    text: "Reads your facts and buyer words and names the drive underneath why people buy. Writes the feeling the ad must leave and what to avoid saying."
  - title: Write the flaw-first ad
    text: "Takes the brief and lists your product's true weaknesses. Picks the one a buyer already sees and writes an ad that names it and shows what it proves."
  - title: Make the wording fresh
    text: "Takes the ad and writes fresh versions of its claim. Runs a swap test against rivals and picks one, cutting any words that don't carry the point."

output_shape: |-
  STEP 1: BUYER DRIVE BRIEF
    What buyers say they want: <their words>
    The drive underneath: <being admired / staying safe / ...>
    Feeling the ad must leave: <one line>
    Take-away for the reader: <...>
    Old ways to avoid: <...>

  STEP 2: FLAW-FIRST AD
    Flaw chosen: <true weakness a buyer already sees>
    What it shows: <care, size, effort, honesty>
    Flat claim: <...> | Flaw-first version: <...>
    Ad: <headline options and body>
    Check: <the product backs this line in real use>

  STEP 3: FRESH WORDING
    Flat claim: <...>
    Fresh versions: <several, same claim>
    Swap test: <could a rival use the flat line and sound the same?>
    Pick: <one line, cut to what carries the point>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: The buyer words you give it
    how: Real reviews and messages show the drive better than your own description. Include the lines that sound off-hand.
  - what: The flaw
    how: Tell it the weakness buyers raise most. A flaw nobody sees would only create a worry.
  - what: Rival ads
    how: Give two or three. The swap test needs them to know which wording is already taken.

judge:
  - The brief names a drive underneath the stated reason, and the feeling is one line.
  - The flaw is true, and a buyer already sees or fears it.
  - The ad shows what the flaw proves and the product backs it in real use.
  - The fresh version keeps the claim unchanged. It does not add a new one.
  - Nothing in the ad is invented about the product or its results.

test:
  - Run it on a product with a known weakness. See whether the ad names that weakness and why it is a strength.
  - Put the final line next to a rival's. A reader should be able to tell whose it is.
  - Show the ad and your old ad to five buyers and ask which makes them feel something.

improve:
  - Save the brief's drive and feeling in your brand file, so other ads can start from them.
  - Add a rule to the skill for flaws you will never name, such as safety claims.
  - Keep the swap test lines that failed, as a list of wording to avoid.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Reads long reviews and writes all three steps in one run."}
    - {name: "Meta Ad Library", why: "Shows the live ads your rivals run, so the swap test has real lines to check against."}
  inputs:
    - "Fifty or more reviews, in the buyers' words"
    - "Your best-performing ad so far"
    - "A list of claims you are not allowed to make"

terms:
  - term: Flaw-first ad
    meaning: An ad that names a real weakness of the product up front and then shows what it says about the product, such as care or honesty.
  - term: Swap test
    meaning: A check on whether a rival could put your line in its own ad and sound just the same.
