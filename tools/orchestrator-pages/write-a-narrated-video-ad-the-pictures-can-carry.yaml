new_slug: write-a-narrated-video-ad-the-pictures-can-carry
name: Write a narrated video ad the pictures can carry
summary: "Give it your brief and org context. Get a narrated script trimmed of lines the pictures say, plus timed shots and clip prompts."
job: make-video-ads
thinking: high
thinking_why: The strip test needs careful judgment on every line. Give it your strongest model.
headline: A narrated video ad where the pictures carry the story
subhead: Give it your brief and org context. It writes a narrated script with a picture for every line, cuts the narration that only repeats what we see, fixes how it sounds spoken, then plans timed shots and clip prompts.
explain: |-
  A voice-over that says what the screen already shows is wasted. Viewers who watch with the sound off miss it, and viewers who hear it feel talked down to. Long narrated ads fall into this trap often, because every line gets a voice.

  The steps cut it back. First it writes a narrated script with a picture planned for each line. Then it removes all the narration and rereads what is left, marks each line as telling or adding, and turns telling lines into something seen. A read-aloud pass fixes what remains. Last it turns the final script into timed shots and clip prompts.

  Not worth running for a fifteen second ad. Short ads rarely carry narration worth stripping.
when:
  - You want a one to ten minute ad that explains how something works.
  - Your last narrated ad felt like a slide show with a voice on top.
  - Many of your viewers watch with the sound off.
not_for:
  - "You want a fifteen-second ad: short ads rarely carry narration worth cutting, so write a short script by hand or with the Video ad script line checker."
  - "You already have a script and only need it to sound right spoken: use the Ad script read-aloud editor."
  - "You already have a final script and need timed shots: use the Video ad shot list maker."
you_give:
  - "A brief: the goal, the buyer and the main point"
  - Your org context
  - A buyer description (optional)
  - Your product facts, such as price, variants and how it is used
you_get:
  - A narrated script with a picture for every line
  - A line-by-line verdict on what the narration adds
  - A leaner script that reads cleanly aloud
  - Timed shots with a prompt for each clip
how_to_use:
  - "Download the handoff pack. It's a zip with HANDOFF.md plus four skill files, in the order they run: Long-form video ad script writer, Voice-over stripping test, Ad script read-aloud editor, Video ad shot list maker. Keep them together."
  - "Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say \"Follow HANDOFF.md\"."
  - "Paste your brief and product facts, and say how long the ad should run."
  - "Read the verdict on each narration line. Say if you want to keep a line the test cut."
  - "Make the clips from the prompts. This needs a video tool, and it runs on paid credits."
output_sample:
  input:
    - "Your brief: the goal, the buyer and the main point"
    - Your org context
    - A buyer description (optional)
    - Your product facts, such as price, variants and how it is used
    - How long the ad should run
  prerequisites:
    - An AI that can read files, with the four skills in the handoff pack or installed before you start
    - A video tool or paid credits if you want the clips made, not just the prompts
  output:
    - name: "Step 1: Narrated script"
      contains: Rounds of narration, a picture planned for each line, and the total length.
    - name: "Step 2: Strip test"
      contains: Each narration line marked as telling or adding, with a seen replacement for every telling line.
    - name: "Step 3: Read-aloud script"
      contains: The leaner script with each line fixed so a presenter can say it cleanly.
    - name: "Step 4: Shots and clip prompts"
      contains: Timed shots, an image prompt and a video prompt for each clip, and an edit plan.
    - name: Hand-back summary
      contains: Each step's file, any step not run and why, and every MISSING line in one list.
how_it_works:
  - title: Write the narrated script
    text: Lists problems, explanations, doubts and proof, sets the length, and writes each round with a picture for every line.
  - title: Strip the voice-over
    text: Removes all narration, rereads the scenes, marks each line as telling or adding, and replaces telling lines with something we see.
  - title: Fix the read-aloud trips
    text: Reads the lean script at speaking speed and fixes each line a presenter would stumble on.
  - title: Plan the shots
    text: Times the remaining words, counts shots and writes a motion prompt for each clip.
output_shape: |-
  STEP 1: NARRATED SCRIPT
    Rounds with narration | picture for each line | length

  STEP 2: STRIP TEST
    Each narration line marked telling or adding | replacements | cleaned script

  STEP 3: READ-ALOUD SCRIPT
    Fixed script | rule each fix followed

  STEP 4: SHOTS AND CLIP PROMPTS
    Timed shots | prompt per clip | edit list

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>
tweaks:
  - what: Length
    how: Each round needs a problem, an explanation and proof. Ask for fewer rounds if you have less proof.
  - what: Where the voice sits
    how: Say if one narrator speaks or a real person tells their own story. It changes what the strip test keeps.
  - what: How strict the cuts are
    how: Tell step 2 to cut only clear repeats if you want a gentler edit.
judge:
  - Every narration line left in adds something the picture cannot show.
  - Each replaced line became an action you could film.
  - No fact was lost in the trim.
  - The script still makes sense to someone watching with no sound.
  - Each shot has one action.
test:
  - Mute your own reading of the shot list and see if the story still holds.
  - Check three cut lines. Would anyone miss them?
  - Run it on a shorter brief to see if the number of rounds drops.
improve:
  - Keep a list of narration habits you want cut, and add it to step 2.
  - Save the pictures that worked best in your org context as a visual style.
  - Pair it with the cut and caption workflow once your clips are made.
