new_slug: write-an-annual-letter-that-sets-long-term-priorities
name: "Write an annual letter with long-term priorities and metrics"
summary: "Paste your year's numbers. Get principles, input metrics, a cash check, a value tally and a draft letter."
job: lead-people
thinking: high
thinking_why: "It joins principles, metrics, cash and value into one honest letter. Give it your strongest model."

headline: "Write a yearly letter your team and backers will trust"
subhead: "Paste your year's numbers. It writes your promises on how you will choose, picks the input metrics you control, checks the cash behind the profit and tallies the value you create for each group. Then it writes a plain letter that puts the bad news first and says what you will stop."

explain: |
  A yearly letter is the one time you explain how you think, not only what happened. Most are a list of wins with the bad news buried, and the numbers they lead with are results nobody can act on.

  This workflow starts with a short list of promises on how you will choose when the short and long term pull apart. It picks metrics you can work on, such as wait time or stock, and tests each for the chance it could rise while the real goal falls. It sets free cash flow beside profit to show what growth costs. A tally estimates the value you create for owners, staff, partners and customers, with the assumptions in view. The last step writes the letter. The ideas come from Jeff Bezos's letters to shareholders.

when:
  - You write a year-end letter to your team, partners or owners.
  - You have results and metrics but no story that joins them.
  - You want to tell the bad news in a way people trust.

you_give:
  - Your business, who the letter is for and the hard trade-offs you face
  - Your reported numbers by year, with earnings, depreciation, working capital and capital spending
  - Share or owner counts, and figures for staff, partners and customers (optional)
  - The year's mistakes

you_get:
  - A list of up to eight promises, each with its cost
  - Three to six input metrics with owners, targets and a proxy test
  - Free cash flow beside earnings, a payback test and a score out of 100
  - A value tally for each group and your weakest link
  - A letter of 700 to 1,200 words

how_to_use:
  - Download the handoff pack. It's a zip with HANDOFF.md and every skill file this workflow uses.
  - Give the folder to Claude (in Claude Code, or as files in a Claude Project) and say "Follow HANDOFF.md".
  - Paste your business, your numbers and the year's mistakes. It works step by step and saves each result.
  - Read the metric plan and the weak numbers before the letter is written. Fix any that are too generous.
  - Send the draft to two readers before it goes out.

how_it_works:
  - title: Write the long-term principles
    text: "Finds where short and long term pull apart and writes one plain promise for each, with the cost it names."
  - title: Pick the input metrics that matter
    text: "Traces your results to the inputs you control and picks three to six. Tests each for proxy risk and keeps one output as a check."
  - title: Check the cash behind the earnings
    text: "Works out free cash flow, sets it beside earnings and tests whether growth pays back. Gives a score out of 100."
  - title: Tally the value you create
    text: "Builds a cautious estimate for owners, staff, partners and customers with assumptions in view. Names the group you serve least well."
  - title: Write the letter
    text: "Opens with the result and the bad news, restates the promises, shows metrics, cash and value, owns the mistakes and says what you will stop."

output_shape: |-
  STEP 1: PRINCIPLES
    <up to eight promises, each with its cost>

  STEP 2: INPUT METRICS
    <input | owner | target | review date | proxy guard>
    Output kept as a check: <...>

  STEP 3: CASH VIEW
    Free cash flow by year, cash conversion, growth payback, owners' share
    Score: <n>/100 (what it measures)

  STEP 4: VALUE TALLY
    <group | measure | figure | assumption>
    Least well served: <group and one change>

  STEP 5: THE LETTER
    <700 to 1,200 words: result and bad news, promises, what moved, cash and value, mistakes, next year, closing>

  HAND-BACK SUMMARY
    Files: <each step's file> | MISSING: <every line, in one list>

tweaks:
  - what: Past hard choices
    how: Real choices from your history make the promises sharper than general values.
  - what: Years of numbers
    how: Give three to five years. The cash step needs the trend.
  - what: The bad news
    how: Give it in full. A letter with soft bad news loses trust.
  - what: Who the letter is for
    how: Say staff, partners or owners. The detail and tone shift.

judge:
  - Every promise names a cost and would be unpopular in a bad quarter.
  - Each chosen metric is something a team controls, and each has a proxy test.
  - Free cash flow is worked out for every year, with no missing figure guessed.
  - Every group in the tally has an assumption beside its figure.
  - The letter opens with the result and the bad news, and every number comes from the earlier steps.

test:
  - Run it on last year. See if the letter would have told your team what you did not say.
  - Stop after step 3 and check the cash figures against your bank or accounts.
  - Halve the customer figure in step 4 and see if the tally still holds.
  - Ask a reader to state the letter's main point after the first paragraph.

improve:
  - Keep each year's principles, metrics and letter in one folder so the next year builds on them.
  - Add your voice rules to the letter skill.
  - Add the metrics your team already watches to step 2.
  - Review the weak numbers in the tally each year and replace guesses with real data.

works_best_with:
  tools:
    - {name: "Any good chat AI", why: "Holds the principles, metrics and results across the steps."}
    - {name: "A spreadsheet", why: "Check the cash and value sums before they go in the letter."}
  inputs:
    - "The cash flow statement"
    - "Customer survey results"
    - "Pay and benefits totals"
    - "Last year's letter"

terms:
  - term: Input metric
    meaning: A number for something you control that causes a result, such as how long customers wait.
  - term: Free cash flow
    meaning: Cash from running the business minus cash spent on assets such as machines and software.
